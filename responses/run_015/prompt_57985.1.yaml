  2.  **Evaluate the "Wisdom of Crowds" vs. "Mob Mentality":**
      *   *Wisdom of Crowds:* Works best when individuals are independent, diverse, and decentralized. If these conditions are met, averaging opinions often beats experts.
      *   *Mob Mentality/Information Cascades:* Happens when people see others' opinions before forming their own. This destroys independence. The user explicitly mentioned this ("everyone watches the same big horror youtuber's breakdown," "discuss in the main chat," "pile onto whatever the first couple votes say").
      *   *Expertise:* The mods (6/10 accuracy) are slightly better than random. The volunteers (50/50 accuracy) are random coin flips *if* independent.
      *   *Math Check:*
          *   7 mods @ 60% accuracy.
          *   25 volunteers @ 50% accuracy.
          *   *Scenario A (Current):* 7 independent votes (assumed). Probability of majority being correct is high (binomial distribution).
          *   *Scenario B (Proposed as described):* 25 dependent votes. If they all follow the YouTuber or the first few voters, $N$ effectively becomes 1 (the influencer) or very small (the first voters). If the influencer is wrong, the crowd is wrong.
          *   *Scenario C (Idealized Crowd):* 25 independent volunteers @ 50%. The law of large numbers says this converges to 50% accuracy. It doesn't improve over the mods' 60%.
