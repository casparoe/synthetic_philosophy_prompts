answer: |-
  You have correctly identified a gap in the popular vocabulary. "Evolutionarily Stable Strategy" (ESS) is a static stability concept (can it resist invasion?), not a dynamic one (can it invade?). In technical evolutionary game theory, these are distinct properties, and your simulations are revealing the geometry of the **fitness landscape** over time.

  Here is the conceptual carving you need, broken down by the two observations, with the specific terminology for the "intermediate peak" case you want to name.

  ### 1. Invadability vs. Stability (Observation One)

  You are right that ESS covers only stability. The vocabulary distinguishes these two axes:

  *   **Evolutionary Stability:** The ability of a population state to resist invasion by a rare mutant. (Your "30% seed drives resident out" case).
  *   **Invasibility:** The ability of a rare mutant to increase in frequency when introduced to a resident population. (Your "2% seed spreads" case).

  When these come apart, you are dealing with **Basins of Attraction**.
  *   A strategy that is stable but not invadable has a **small basin of attraction**. It is a "local optimum" that requires a large perturbation (your 30% seed) to reach.
  *   A strategy that is invadable but not stable (spreads then collapses) is often part of a **Heteroclinic Cycle** or simply traversing a **Transient Dynamic**. It climbs a fitness gradient that disappears as it climbs.

  **For your write-up:** Do not use "ESS" for the invadable strategies. Instead, describe them as having **high invasibility but low evolutionary stability**, or vice versa. If you need a single concept for the "30% seed" requirement, refer to the **size of the basin of attraction**.

  ### 2. The Intermediate Peak (Observation Two)

  This is the core of your question. You have a strategy that:
  1.  Fails when rare (Positive Frequency Dependence at low frequencies).
  2.  Thrives at intermediate frequencies.
  3.  Declines when common (Negative Frequency Dependence at high frequencies).
  4.  Settles at a stable mix (Polymorphism).

  #### The Mechanism: Frequency-Dependent Selection
  The umbrella term is **Frequency-Dependent Selection**. The fitness of the strategy is a function of its own prevalence $p$.
  *   The decline at high frequency is **Negative Frequency-Dependent Selection**. As the strategy becomes common, its marginal value drops (e.g., too many cooperators allow defectors to thrive, or in your case, noise causes mutual punishment loops).
  *   The failure at low frequency is **Positive Frequency-Dependent Selection**. The strategy needs a "critical mass" to be viable (e.g., cooperators need to meet other cooperators to score well).

  #### The Specific Configuration
  There is no single noun like "gravity" for this, but there is a precise phrase used in evolutionary dynamics and ecology that fits your "carving":

  **Stable Polymorphism with an Invasion Threshold**

  Alternatively, borrowing from ecology where this exact dynamic is studied:
  **An Evolutionary Allee Effect leading to Stable Coexistence.**

  *   **The Allee Effect:** In ecology, this describes a population that cannot grow when density is too low. In your game, the strategy cannot grow when its *frequency* is too low. This creates the **Unstable Equilibrium** (your 15% point). Below this, selection pushes it to 0%. Above it, selection pushes it up.
  *   **The Stable Polymorphism:** The peak (your 40% point) is a **Stable Internal Equilibrium**. Selection pushes the frequency toward this point from both sides (from above and from below the peak, provided you are above the threshold).

  #### Why this differs from standard concepts
  *   **Vs. Hawk-Dove (Snowdrift):** In a standard Hawk-Dove game, the cooperative strategy *can* invade when rare. Your strategy *cannot*. This is the crucial difference the "Threshold" vocabulary captures.
  *   **Vs. Stag Hunt:** In a Stag Hunt, there are two stable *pure* states (All Cooperate or All Defect). Your simulation settles on a *mixed* state (40% Cooperate). This distinguishes it as a polymorphism rather than a coordination equilibrium.
  *   **Vs. Standard ESS:** An ESS is typically a pure state (100% fixation). Your outcome is a **Mixed ESS** (in the population sense, not the individual mixing sense).

  ### 3. IPD Context and Artifacts

  **Is this an artifact of the reproduction rule?**
  Likely not. If you are using fitness-proportional reproduction (Replicator Dynamics), this behavior is a property of the **Payoff Matrix** induced by the strategies, not the selection rule.
  *   The **Threshold** arises because, in the IPD, conditional cooperators need clusters to survive noise. Below a certain frequency, they meet defectors (or noisy agents) too often to sustain their score.
  *   The **Cap** arises because, at high frequencies, the strategy likely encounters its own weaknesses (e.g., if it is Tit-for-Tat, noise causes long punishment chains; if it is Generous, it gets exploited by the remaining defectors).

  **One-shot vs. Iterated:**
  In a one-shot game, strategies are simple moves. Frequency dependence exists (e.g., Hawk-Dove), but the "memory" aspect of IPD adds **Spatial/Temporal Clustering** effects even in a well-mixed population. The "Threshold" is often higher in IPD because the "shadow of the future" must be long enough *and* the partner reliable enough to offset the temptation to defect. Your 15% threshold is the point where the probability of meeting a "compatible" partner becomes high enough to offset the noise cost.

  ### 4. Recommended Vocabulary for Your Readers

  To write this as a claim about cooperation rather than code, avoid "basin of attraction" or "replicator dynamics" unless necessary. Use these terms:

  1.  **For the 15% point:** Call it a **Critical Threshold** or **Establishment Threshold**.
      *   *Phrasing:* "The strategy exhibits a critical threshold for establishment; below 15% frequency, it cannot sustain a foothold."
  2.  **For the 40% point:** Call it a **Stable Equilibrium Frequency** or **Carrying Capacity** (metaphorically).
      *   *Phrasing:* "Selection drives the population toward a stable polymorphism at roughly 40%."
  3.  **For the whole phenomenon:** Call it **Frequency-Dependent Selection with an Invasion Barrier**.
      *   *Phrasing:* "The strategy is subject to strong frequency-dependent selection: it suffers from an Allee effect when rare (unable to invade) and competitive saturation when common (self-limiting)."

  **Summary Label:**
  If you need a single label for the configuration, **"Stable Polymorphism with an Invasion Threshold"** is the most accurate technical description. If you want a more evocative term for a general audience, **"Critical Mass Cooperation"** captures the threshold aspect, though it misses the self-limiting cap.

  **The "Carving":**
  You are observing a system where cooperation is **locally stable** (at 40%) but **globally fragile** (cannot start from scratch). This is distinct from "Robust Cooperation" (which implies both stability and invasibility). You are demonstrating that under these noise conditions, cooperation is a **conditional attractor**: it persists if established, but cannot self-start.
