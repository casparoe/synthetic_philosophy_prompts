answer: |-
  Your observation is precise, and the phenomenon you describe is indeed a central subject in the philosophy of social science, game theory, and institutional economics. You have correctly identified that this is distinct from technical necessity, external enforcement, or mere habit.

  The closest and most rigorous characterization is **David Lewis's theory of Convention**, specifically as articulated in his 1969 work *Convention: A Philosophical Study*. However, because you note the presence of "critical review comments" (a form of social sanction), your examples also border on what contemporary philosopher **Cristina Bicchieri** classifies as **Social Norms**.

  Below is an analysis of your pattern using these frameworks, including the specific inclusion/exclusion criteria you requested, the mechanics of emergence, and the boundary cases.

  ---

  ### 1. The Core Characterization: Lewisian Convention

  David Lewis defined a convention as a solution to a **recurrent coordination problem**. His definition is not merely "custom" or "habit"; it is a specific equilibrium state sustained by mutual expectations.

  For a regularity $R$ (e.g., the error envelope shape) to be a convention in a population $P$ (your engineering teams), it must satisfy five conditions:

  1.  **Regularity:** Everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Preference for Conformity:** Everyone prefers to conform to $R$ *if* others do (coordination payoff).
  4.  **Arbitrariness:** There is an alternative regularity $R'$ that could have solved the coordination problem just as well (the "could-have-been-otherwise" clause).
  5.  **Common Knowledge:** All the above facts are known by everyone, known to be known, and so on.

  #### Mapping Your Instances to Lewis's Criteria
  *   **Regularity:** All microservices return the specific error envelope.
  *   **Expectation:** Team A builds their client expecting Team B's service to return that envelope.
  *   **Preference:** Team A would prefer to match Team B's shape rather than be correct in isolation but incompatible.
  *   **Arbitrariness:** You noted "several leaner shapes would have worked equally well." This is the crucial differentiator from technical necessity.
  *   **Common Knowledge:** This is established through code reviews, documentation, and the friction felt when a new service deviates. The "critical review comments" serve to broadcast the common knowledge that deviation is unexpected.

  ### 2. The Nuance: From Convention to Social Norm

  You mentioned that a new service omitting the hint would "attract critical review comments." This suggests the pattern has evolved beyond a pure Lewisian convention into a **Social Norm** (in the sense of Cristina Bicchieri).

  *   **Lewisian Convention:** "I do X because I expect you to do X, and we both want to match." (Pure coordination).
  *   **Bicchieri's Social Norm:** "I do X because I expect you to do X, *and* I expect you to think I *ought* to do X." (Normative expectation).

  In your second year, the error envelope likely shifted from a *convention* (pragmatic alignment) to a *norm* (obligatory alignment). The "critical review" is the sanction that enforces the normative expectation. This explains why unilateral deviation feels "wrong" rather than just "inconvenient."

  ### 3. The Emergence: Path Dependence and Schelling Points

  You asked about the emergence over time ("No vote is taken... small early precedent gets copied"). Philosophy and economics describe this via two concepts:

  1.  **Schelling Points (Focal Points):** When the first team designed the error envelope, they needed a shape. Without communication, they chose a shape that felt "salient" or "natural" (perhaps influenced by prior industry experience). This initial choice became a focal point.
  2.  **Path Dependence:** Once the first few services adopted the shape, the cost of switching increased for every subsequent service. The system entered a "lock-in" state. The history of the decision matters more than the optimality of the decision. This is why the specific shape persists even if a "better" shape is theoretically identified later.

  ### 4. Inclusion and Exclusion Criteria

  To properly bound this pattern, we must distinguish it from the "nearby phenomena" you listed. Here is the precise philosophical boundary work.

  | Phenomenon | Primary Driver | Arbitrariness? | Sanction for Deviation | Fits Your Pattern? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lewisian Convention** | Mutual Expectation | **Yes** (Crucial) | Coordination Failure | **Yes** (Primary fit) |
  | **Social Norm** | Normative Expectation | **Yes** | Social Sanction (Critique) | **Yes** (Secondary fit) |
  | **Technical Necessity** | Physical/Logical Constraints | **No** (Only one way works) | System Crash / Parse Error | **No** (Excluded by you) |
  | **Tool Enforcement** | External Authority (CI/CD) | **Yes** | Build Failure | **No** (Excluded by you) |
  | **Private Habit** | Individual Preference | **Yes** | None (Personal only) | **No** (Excluded by you) |
  | **Formal Standard** | Decree by Authority (ISO, W3C) | **Yes** | Compliance Failure | **No** (No central body in your case) |

  #### Difficult Boundary Cases

  **Case A: The "De Facto Standard"**
  *   *Scenario:* A specific library becomes so popular that everyone uses its error format.
  *   *Analysis:* This looks like your pattern, but the driver is **network effect** rather than pure mutual expectation.
  *   *Boundary:* If teams use it *only* because the library is convenient, it is a **technological lock-in**. If they use it because they expect *other teams* to use it (even if they swapped libraries), it is a **convention**. Your case is the latter.

  **Case B: The "Documented Guideline"**
  *   *Scenario:* An architecture doc suggests the error shape, but CI does not enforce it.
  *   *Analysis:* This is the strongest boundary case. Does the document make it a rule?
  *   *Boundary:* If the document is ignored without social friction, it is mere advice. If the document is cited during code reviews to justify "critical comments," the document is merely *codifying* an existing convention/norm. The force comes from the **social expectation**, not the text itself. Your description ("No architecture document initially required this") confirms you are dealing with the pre-codified convention.

  **Case C: Protocol Specifications (e.g., HTTP)**
  *   *Scenario:* You must return a 404 for not found.
  *   *Analysis:* This looks like a convention (we could have used 999), but it is now **Technical Necessity** due to ecosystem integration.
  *   *Boundary:* If deviation breaks interoperability with *external* tools (browsers, load balancers), it has crossed into Technical Necessity. Your error envelope is internal; deviation only causes friction with *internal* clients. This keeps it in the realm of Convention.

  ### 5. Proposed Definition for Socio-Technical Systems

  Since existing philosophical definitions predate the specific context of distributed software engineering, I propose the following synthesized definition to capture your instances while excluding the contrast cases:

  > **Emergent Technical Convention**
  >
  > A regularity in technical design or behavior within a distributed system is an *Emergent Technical Convention* if and only if:
  >
  > 1.  **Functional Equivalence:** At least one alternative design exists that satisfies all functional and technical constraints equally well (Excludes *Technical Necessity*).
  > 2.  **Decentralized Adoption:** The regularity was not mandated by a governing authority or automated enforcement mechanism at inception (Excludes *Formal Standards* and *Tool Enforcement*).
  > 3.  **Inter-Dependency:** The utility of the design for any single agent is contingent upon its adoption by other agents in the system (Excludes *Private Habit*).
  > 4.  **Expectation Stability:** Adherence is sustained primarily by the mutual belief that other agents will adhere, such that unilateral deviation incurs integration costs or social sanction, while coordinated deviation would be costless (Distinguishes from *Path Dependence* alone).

  ### 6. Why This Distinction Matters

  You asked for this understanding to "properly bound" the pattern. In engineering management and architecture, confusing these categories leads to specific failure modes:

  *   **Treating a Convention as Technical Necessity:** Engineers argue "It *must* be this way," stifling innovation. If you realize it is a convention, you know it *can* be changed, provided the change is coordinated.
  *   **Treating a Convention as Private Habit:** An engineer might change the error envelope because they prefer a different style, not realizing they are breaking a coordination equilibrium.
  *   **Treating a Convention as a Standard:** Management might try to enforce it via heavy-handed policy (Tool Enforcement), which creates resentment. Recognizing it as a convention suggests the solution is better communication and alignment (reinforcing the mutual expectation) rather than stricter linting.

  ### Summary

  The pattern you have isolated is a **Lewisian Convention** that is maturing into a **Bicchieri-style Social Norm**, driven by **Path Dependence**.

  It is bounded by **Arbitrariness** (distinguishing it from technical necessity) and **Mutual Expectation** (distinguishing it from habit or external enforcement). The "lock-in" you observe is not technical debt in the traditional sense; it is the stable equilibrium of a coordination game. Recognizing it as such allows you to manage it not as code, but as a social contract among engineers.
