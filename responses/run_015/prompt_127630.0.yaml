answer: |-
  Here is a structured breakdown of the desiderata for an adequate theory of moral motivation, tailored for your feature. It focuses on the tension between impartial moral demands and personal integrity, keeping the distinctions sharp and the contested areas flagged.

  ### The Desiderata List: What a Theory of Moral Motivation Must Deliver

  To survive the integrity objection, a theory cannot simply tell us *what* is right; it must account for *how* a human being psychologically engages with that rightness without alienation.

  **1. The Intimacy Constraint (The Spouse Case)**
  *   **Requirement:** The theory must explain why acting directly from love is morally distinct from (and superior to) acting from a principle that permits love.
  *   **The Trap:** If the theory says saving your spouse is only right because it maximizes utility, it fails. If it says saving your spouse is right *because* it is your spouse, it must explain why this partiality doesn't undermine moral equality.
  *   **Status:** **Non-Negotiable.** Almost no contemporary theory accepts the "cold calculator" model as psychologically healthy or morally ideal.

  **2. The Integrity/Identity Constraint (The Ground Projects)**
  *   **Requirement:** The theory must accommodate "ground projects"—the commitments and relationships that give an agent's life meaning and provide the motive force for action.
  *   **The Trap:** A theory that requires an agent to abandon their identity whenever the impartial calculus demands it renders the agent a channel for utility rather than a person.
  *   **Status:** **Non-Negotiable.** This is the core of Williams's objection.

  **3. The Impartiality Constraint (The Stranger Case)**
  *   **Requirement:** The theory must still generate obligations to distant strangers or enemies, preventing the "Intimacy Constraint" from collapsing into pure selfishness or tribalism.
  *   **The Trap:** If we prioritize integrity too much, we lose the critical power of morality to demand sacrifice when stakes are high (e.g., ignoring a drowning child to finish a painting).
  *   **Status:** **Non-Negotiable,** but the *degree* of impartiality is heavily contested.

  **4. The Role-Distinction Constraint (The Journalist/Soldier)**
  *   **Requirement:** The theory must distinguish between *personal integrity* (my commitments) and *institutional integrity* (my role obligations).
  *   **The Case:** A journalist protecting a source shouldn't do it because of a personal utilitarian calculation, but because the *role* demands it. However, the theory must explain what happens when role integrity conflicts with personal conscience (e.g., a soldier ordered to commit a war crime).
  *   **Status:** **Contested.** Some theories try to reduce role obligations to personal commitments; others treat them as sui generis.

  **5. The Sustainability Constraint (The Activist)**
  *   **Requirement:** The theory must not be self-defeating. It cannot demand a level of sacrifice that leads to psychological burnout or the abandonment of morality altogether.
  *   **The Case:** An activist who swallows all universal demands into her personal projects ceases to function effectively. The theory needs a "limit" on demandingness.
  *   **Status:** **Broadly Accepted,** but where the limit lies is a major fault line.

  ---

  ### Critical Distinctions The Theory Cannot Collapse

  **1. Motivation vs. Justification**
  *   **The Distinction:** *Why I act* (motivation) is not always the same as *why the act is right* (justification).
  *   **Why it matters:** Williams argues that if the justification invades the motivation (i.e., I must think about the justification to act), integrity is lost. An adequate theory must allow the justification to remain in the background while the motivation remains personal.
  *   **Risk:** Collapsing these leads to the "one thought too many" problem.

  **2. Permission vs. Requirement**
  *   **The Distinction:** Is saving your spouse merely *permitted* by morality, or *required* by it?
  *   **Why it matters:** If it is only permitted, morality is external to your life. If it is required, morality dictates your loves.
  *   **Risk:** Collapsing these makes morality either too weak (optional) or too tyrannical (dictating emotions).

  **3. Personal Integrity vs. Institutional Integrity**
  *   **The Distinction:** Protecting a source because "I value trust" (personal) vs. "Journalism requires confidentiality" (institutional).
  *   **Why it matters:** Institutional integrity can sometimes override personal safety, but personal integrity can sometimes justify whistleblowing against the institution.
  *   **Risk:** Treating them as identical ignores the tragedy of conflicting duties.

  ---

  ### Jointly Unsatisfiable Pairs (The Hard Trade-Offs)

  You asked for tensions that might be impossible to resolve. These are the aporias your feature should highlight.

  **1. Full Universality vs. Full Integrity**
  *   **The Conflict:** If morality is truly universal (everyone counts equally), then personal projects (which are necessarily partial) are always suspect. If integrity is inviolable, then universality is limited.
  *   **Verdict:** **Likely Unsatisfiable.** Most theories sacrifice one for the other. Utilitarianism sacrifices integrity for universality; Virtue Ethics often sacrifices strict universality for integrity.

  **2. Psychological Realism vs. Normative Transparency**
  *   **The Conflict:** *Transparency* says we should always be able to articulate the moral reason for our action. *Realism* says human psychology doesn't work that way in intimate moments.
  *   **Verdict:** **Unsatisfiable.** You cannot have a theory that demands we always know the moral truth *and* a theory that fits how humans actually love and act.

  **3. Demandingness vs. Sanity**
  *   **The Conflict:** A theory that captures all moral obligations (feeding the hungry, stopping wars) is too demanding for a single life. A theory that fits a single life ignores many moral obligations.
  *   **Verdict:** **Contested.** Some argue "sanity" is just an excuse; others argue "demandingness" proves the theory wrong.

  ---

  ### Brief Scorecard: How the Big Three Stack Up

  **Utilitarianism (Consequentialism)**
  *   **Intimacy:** **Fail.** (Unless using "Indirect" strategies, which are contested). Struggles with the "one thought too many."
  *   **Impartiality:** **Pass.** Its strongest suit.
  *   **Integrity:** **Fail.** Views projects as contingent on utility.
  *   **Sustainability:** **Fail.** Notorious for excessive demandingness (burnout).
  *   **Note:** Modern rule-utilitarians try to patch this, but the psychological gap remains.

  **Virtue Ethics**
  *   **Intimacy:** **Pass.** Centers on character and relationships.
  *   **Impartiality:** **Struggle.** Can struggle to condemn actions that are "virtuous" for the agent but harmful to strangers (e.g., the honorable gangster).
  *   **Integrity:** **Pass.** Identity is central to the theory.
  *   **Sustainability:** **Pass.** Focuses on flourishing (eudaimonia), which precludes burnout.
  *   **Note:** Strongest on motivation, weaker on resolving hard conflicts between duties.

  **Care Ethics**
  *   **Intimacy:** **Pass.** Makes relationships the foundational moral unit.
  *   **Impartiality:** **Fail.** Struggles to extend care to distant strangers or enemies without stretching the concept of "care" until it breaks.
  *   **Integrity:** **Pass.** deeply tied to personal narrative.
  *   **Sustainability:** **Mixed.** Can lead to burnout if "care" becomes self-effacing (often a feminist critique of the theory itself).
  *   **Note:** Best at describing the psychology, hardest to codify into public policy.

  ---

  ### Settled vs. Contested in the Literature

  **Broadly Settled (Consensus Points)**
  *   **The Psychological Objection Holds:** It is widely accepted that a theory requiring constant conscious calculation is psychologically implausible and morally alienating. Pure Act-Utilitarianism is generally rejected as a theory of *motivation*, even if kept as a theory of *rightness*.
  *   **Motivation Matters:** Moral psychology is no longer seen as separate from normative ethics. How an agent feels about their action is relevant to the moral evaluation of the action (at least in terms of praise/blame).
  *   **The "Overdemandingness" Problem:** It is agreed that a theory that requires you to give away everything until you are as poor as the recipient is intuitively problematic.

  **Heavily Contested (Fight Club)**
  *   **The Solution to Integrity:** There is no consensus on how to fix it. Some argue for "Two-Level" thinking (think like a utilitarian only when necessary); others argue for a pluralistic value system; others reject impartiality entirely.
  *   **The Status of Integrity:** Is integrity a *moral* value (it makes you good) or a *non-moral* constraint (it makes you a person, but morality might override it)? Williams implies the latter; many critics argue the former.
  *   **Impartiality's Scope:** There is fierce debate over whether impartiality is the *definition* of morality or just one tool among many. Care ethicists and Particularists reject it as the starting point; Kantians and Utilitarians defend it as essential.

  ### Final Note for the Feature
  If you need a hook for the conclusion: The literature suggests we may have to choose between a morality that is **comprehensive** (covers all duties) and one that is **habitable** (fits a human life). Williams suggests that if a moral theory makes it impossible to live a human life, it is the theory that must be rejected, not the life. That is the live wire in the debate.
