  ### Brainstorming: Plausible Decision Rules

  Before formalizing the criteria, I need to isolate the intuitive patterns in your friend's six verdicts. The core tension in the "Moloch" literature is between the *structure of incentives* and the *availability of solutions*.

  1.  **The "Game Structure" Intuition:** She might be looking strictly at the payoff matrix and the iteration count. If the effective game is a Prisoner's Dilemma (dominant strategy to defect) and it is one-shot (or effectively so), it is Molochian. If it is a Stag Hunt (Case 4) or Iterated PD (Case 3), cooperation is an equilibrium, so it is not Molochian.
  2.  **The "Mechanism/Exit" Intuition:** She might be focusing on the *tools* available to the agents. Do they have communication? Can they punish? Is there a central enforcer? If they have *any* viable technology (social, strategic, or legal) to bind themselves to the good outcome, it is not Molochian. This aligns with the "no easy way to opt out" clause in your definition.
  3.  **The "Selection Pressure" Intuition:** She might be focusing on the *dynamics of survival*. Does the system actively punish cooperators? In evolution (Case 2) or tax races (Case 6), cooperators are eliminated. In a monopoly (Case 5) or repeated game (Case 3), cooperators can survive or thrive. If the system tolerates cooperation, it isn't Molochian.

  These three intuitions map onto distinct operational rules that I will formalize below.

