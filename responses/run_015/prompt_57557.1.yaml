  **1. Identification of Disputes and Positions**

  Nora and Tomás are entangled in three distinct disputes. First, a **conceptual dispute** over whether "relations of production" can be defined independently of legal categories (property vs. effective control). Second, a **methodological dispute** over the validity of functional explanation in social science without elaborated feedback mechanisms (Cohen's functionalism vs. Elster's methodological individualism). Third, an **exegetical dispute** over whether a reconstructed theory that deviates from Marx's text counts as a defense of Marx's doctrine.

  *   **Nora's Strongest Position:** The base/superstructure distinction is conceptually incoherent because economic relations are constitutively legal relations, and functional explanations lacking micro-foundations are unscientific just-so stories that cannot handle counter-evidence like state-led industrialization.
  *   **Tomás's Strongest Position:** The base can be defined in terms of effective power rather than legal title, preserving the distinction, and the primacy thesis holds as a functional constraint on viable superstructures even if specific historical sequences vary or involve state mediation.

  **2. Adjudication of Moves**

  **(1) Nora:** *Defensible.*
  Nora correctly identifies the classic "collapse objection": if the base is defined by property relations, and property is legal, the base depends on the superstructure. However, calling the distinction completely collapsed is too strong initially, as it assumes legal form is the only way to describe economic power, ignoring de facto control which Tomás will raise.

  **(2) Tomás:** *Mixed: right about one thing, wrong about another.*
  Tomás is right that effective control is the substantive core of economic relations and can conceptually diverge from legal title (e.g., squatters or mafias). He is wrong, however, to imply this separation is stable in capitalism, where corporate law and state enforcement largely constitute what counts as "effective control," making the non-legal redescription empirically thin.

  **(3) Nora:** *Clearly right.*
  Nora is textually undeniable: Marx explicitly equates relations of production with property relations in the Preface, so Tomás is reconstructing Marx, not defending the literal text. Theoretically, she is also right that in mature capitalism, "effective control" is often indeterminate without legal adjudication (e.g., contractor status), so the superstructure remains constitutive of the base.

  **(4) Tomás:** *Mostly mistaken but pointing at something real.*
  Tomás is mistaken to suggest that "fit" between base and superstructure constitutes explanation; without a causal mechanism, this is the just-so story Elster critiques. He points to something real in noting Marx uses functional language and "conditions" rather than mechanical causation, but this linguistic shift does not solve the methodological deficit.

  **(5) Nora:** *Clearly right.*
  Nora correctly applies Elster's decisive methodological critique: functional explanation requires a feedback loop (like natural selection) to be valid, which historical materialism lacks. Her historical examples (Enclosure, Soviet Union) are valid falsifiers of a strong primacy thesis, showing political power can precede and construct economic relations.

  **(6) Tomás:** *Mostly mistaken but pointing at something real.*
  Tomás is mostly mistaken because his defense relies on ad hoc adjustments (e.g., claiming Soviet failure was due to productive forces) that make the theory unfalsifiable. He points to something real in noting that political action is constrained by material limits, but this constraint is too weak to sustain the specific functional claims of the primacy thesis.

  **3. Specific Questions**

  **(a) Does Tomás's non-legal redescription solve the collapse problem?**
  It relocates the problem rather than solving it. By shifting from legal title to "effective control," Tomás moves the dependency from legal *definitions* to coercive *enforcement*. Since effective control in a stable society requires protection against usurpation (usually by the state/police), the base still relies on superstructural violence to maintain itself, preserving the circularity Nora identified.

  **(b) Is Nora's reliance on the Marx sentence legitimate?**
  It is legitimate if the dispute is about exegesis ("What did Marx claim?"), but less so if the dispute is about theoretical viability ("Is historical materialism true?"). Tomás is entitled to reconstruct the theory to save its insights even if he abandons Marx's specific formulations, but Nora is entitled to point out that this abandons the text they are supposedly reading. They are talking past each other on whether fidelity to Marx matters more than the theory's survival.

  **(c) Is there something important both leave out?**
  Both omit the role of **class struggle** as the mediating mechanism. They treat base and superstructure as static structures that either fit or don't, ignoring the Marxist insight that the relationship is dynamic and contested by agents. Additionally, they equivocate on "explains": Nora treats it as causal prediction, while Tomás treats it as functional constraint, missing the possibility of "determination in the last instance" which allows for reciprocal influence without abandoning primacy.

  **4. Overall Adjudication**

  **Nora is more right overall.** She wins on the methodological front, as Elster's critique of functional explanation without micro-foundations is the consensus view in analytic philosophy of social science, and Tomás offers no mechanism to counter it. She also wins on the conceptual front, as the constitutive role of law in capitalism makes the separation of base and superstructure analytically unstable.

  **For Tomás to be more right,** two things would have to be true. First, functional explanation would need to be accepted as valid in social science without explicit feedback mechanisms (perhaps via a strong analogy to evolutionary biology). Second, it would have to be shown that "effective power" can be empirically individuated independently of legal norms across most historical cases, proving the base is ontologically prior rather than mutually constituted.
