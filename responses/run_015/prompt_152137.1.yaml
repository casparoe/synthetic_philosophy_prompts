answer: |-
  Two rationalists, Alice and Bob, are standing outside a burning server farm.

  "I'm going in," says Bob, pulling out his wallet. "There's a $10^{-100}$ chance the backup contains $10^{50}$ digital lives. With unbounded utility, the EV is astronomical. I'm shutting up and multiplying."

  "Bob, that's Pascal's Mugging," Alice says. "The probability is epistemically negligible."

  "It's positive credence!" Bob insists. "Any $\epsilon > 0$ times infinite value dominates finite costs. I'm donating my life savings to the rescue fund."

  Alice pauses, checking her phone. "Actually, I just spoke to the engineer. The rescue mechanism relies on a continuous variable hitting an exact integer. That's a measure-zero event."

  Bob immediately puts his wallet away. "Oh. In that case, not worth the risk."

  "But the odds are physically indistinguishable!" Alice cries. "$10^{-100}$ is practically zero!"

  "No, it's *literally* not zero," Bob corrects, adjusting his glasses. "My decision algorithm has a hidden lexical ordering. Step 1: Verify the event is in the support of my credence distribution ($P > 0$). If $P = 0$, utility is undefined. Step 2: Maximize EV."

  "So you'd go bankrupt for a googolplex-to-one shot," Alice says, "but you won't lift a finger for a measure-zero event with the same payoff?"

  "Exactly," Bob says. "I'm an EV maximizer, but I'm not *measure-theoretically* suicidal. My lexical preference protects me from the Void, not from the Improbable."

  "So you're not an EV maximizer," Alice concludes. "You're a 'Non-Zero Maximizer'."

  "Call it what you want," Bob says, walking away. "I'm a fanatic, not a realist. I only draw the line at Exact Zero."
