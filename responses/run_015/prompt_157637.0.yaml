answer: |-
  # The Replacement Taxonomy: A Decision Tree for the Synthetic Self

  To determine where you stand on the survival of the self during gradual neural replacement, answer the following questions in order. Follow the path that matches your intuition until you reach a final position.

  ### **Start: The Psychology Question**
  **If a procedure perfectly preserved your memories, personality, and reasoning skills, would that be enough to ensure *you* survive, regardless of what physical material holds those traits?**

  *   **NO:** (Go to **Branch A**)
  *   **YES:** (Go to **Branch B**)

  ---

  ### **Branch A: The Skeptic's Path**
  **Since psychological continuity is not enough, does the survival of your biological life processes matter?**

  *   **YES:** You believe survival requires the continued functioning of the living organism.
      *   **Leaf 1: Biological Animalism**
      *   *Awkward Commitment:* You must accept that a patient in a persistent vegetative state is still the same person, while a fully conscious mind uploaded to a computer is merely a copy.
  *   **NO:** You believe neither psychology nor biology secures a persistent self.
      *   **Leaf 2: Eliminative Nihilism**
      *   *Awkward Commitment:* You must concede that no one is currently reading this sentence; there is only a body behaving as if it reads, with no "self" to experience it.

  ---

  ### **Branch B: The Continuity Path**
  **You believe psychological continuity is key, but must that continuity be carried by the original biological tissue, or can it transfer to synthetic parts?**

  *   **Original Biology Required:** You believe the mind cannot be separated from the specific meat that grew it.
      *   **Leaf 3: Embodied Psychological Continuity**
      *   *Awkward Commitment:* You must accept that replacing a single neuron with a synthetic duplicate technically destroys the original person, even if the change is undetectable.
  *   **Functional Transfer Allowed:** You believe the pattern matters more than the substrate. (Go to **Branch C**)

  ---

  ### **Branch C: The Hybrid Phase Judgment**
  **During the years when the brain operates with both biological and synthetic neurons using incompatible error-correction protocols, how many subjects are present in the hospital bed?**

  *   **One Persisting Subject:** The patient remains a single, unified person throughout the transition. (Go to **Branch D**)
  *   **Two Overlapping Subjects:** The biological person and the emerging synthetic person coexist as distinct entities sharing one body. (Go to **Branch E**)
  *   **No Single Correct Answer:** The question has no definite truth value during the transition.
      *   **Leaf 8: Ontic Vagueness View**
      *   *Awkward Commitment:* You must accept that reality itself is fuzzy, meaning there is no fact of the matter about whether a person exists during the hybrid months, only linguistic conventions.

  ---

  ### **Branch D: The Unity Explanation (For "One Subject")**
  **If one subject persists, is that person wholly present at every moment, or are they a chain of connected time-slices?**

  *   **Wholly Present:** The entire person exists at each instant of the procedure.
      *   **Leaf 4: Psychological Endurantism**
      *   *Awkward Commitment:* You must claim the patient is simultaneously 100% biological and 100% synthetic during the hybrid phase, despite the physical contradiction.
  *   **Chain of Time-Slices:** The person is a spacetime worm composed of sequential stages.
      *   **Leaf 5: Psychological Perdurantism**
      *   *Awkward Commitment:* You must admit that the "you" of today is only a proper part of the whole "you," much like a single frame is only part of a movie.

  > **⚠️ COLLAPSE FLAG: Leaves 4 & 5**
  > **Diagnosis:** These positions cannot be genuinely separated by case judgments. Both agree that *one person survives* the procedure. They differ only in their metaphysical description of *how* that person exists (wholly present vs. temporal parts), which has no impact on clinical or ethical outcomes.

  ---

  ### **Branch E: The Fission Explanation (For "Two Subjects")**
  **If two subjects overlap, how are they related across time?**

  *   **Diverging Worms:** The two subjects share an initial segment of history before branching into distinct futures.
      *   **Leaf 6: Perdurantist Fission Theory**
      *   *Awkward Commitment:* You must accept that two distinct people are entitled to the original patient's bank account and marriage vows simultaneously during the transition.
  *   **Momentary Stages:** Only instantaneous stages exist, linked by external relations of similarity and causation.
      *   **Leaf 7: Exdurantist Stage-Series View**
      *   *Awkward Commitment:* You must deny that anyone survives from one day to the next; the person waking up tomorrow is a strictly different entity from the one who went to sleep, linked only by resemblance.
