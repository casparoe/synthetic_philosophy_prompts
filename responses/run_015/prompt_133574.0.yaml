answer: |-
  There is no established term that captures this configuration precisely. While the components are familiar to game theory, epistemology, and security studies, their specific arrangement—where the *cost of verification* is endogenous to the *truth value of the hypothesis*—does not have a standard label.

  The nearest formal equivalent is **off-path beliefs** in a Perfect Bayesian Equilibrium, but that is a modeling tool, not a description of the phenomenon itself. The nearest substantive equivalent is the **security dilemma**, but that describes a dynamic of escalation, not the epistemic lock you are describing.

  Below is the differentiation from existing concepts, followed by a proposed term and its operational parameters.

  ### 1. Nearest Neighbours and Distinctions

  **Off-Path Beliefs (Game Theory)**
  *   **The Concept:** In equilibrium, certain nodes of the game tree are never reached. Players hold beliefs about what would happen if they *were* reached, but these beliefs are unconstrained by observation because the nodes are never visited.
  *   **The Difference:** Off-path beliefs are a formal permission for *any* belief to exist where data is missing. Your phenomenon is stronger: it explains *why* the data is missing (rational avoidance of fatal cost) and why the belief persists *despite* the lack of data. It turns a modeling feature into a causal mechanism.

  **Self-Fulfilling Prophecy**
  *   **The Concept:** A false definition of a situation evokes new behavior which makes the originally false conception come true (Merton).
  *   **The Difference:** A self-fulfilling prophecy resolves the uncertainty by making the belief *true*. Your configuration allows the belief to remain *false* (the universe is safe, but everyone thinks it is dangerous) indefinitely. The outcome (silence) is observationally equivalent in both the true and false states.

  **Self-Sealing Argument (Sociology/Epistemology)**
  *   **The Concept:** An argument where any evidence produced against it is reinterpreted as evidence for it (e.g., "The lack of conspirators proves the conspiracy is efficient").
  *   **The Difference:** Self-sealing works by *reinterpretation* of existing data. Your configuration works by *suppression* of data generation. In your case, no counter-evidence exists to reinterpret; the act of producing it is prohibited by the risk calculus.

  **The Security Dilemma (Jervis/Herz)**
  *   **The Concept:** One state's defensive measures are interpreted as offensive threats by another, leading to spiral escalation.
  *   **The Difference:** The security dilemma assumes uncertainty about *intent*. Your configuration describes uncertainty about the *environmental rules* (e.g., "Is the universe inherently hostile?" vs. "Is this specific state hostile?"). The security dilemma leads to arms races; your configuration leads to strategic silence or permanent mobilization without necessarily escalating.

  ### 2. Proposed Concept: Strategic Unfalsifiability

  Since no existing term fits, I propose **Strategic Unfalsifiability**.

  **Definition:**
  A state of empirical indeterminacy in which a hypothesis regarding a threat cannot be falsified because the requisite test condition imposes a cost that rational agents, holding the hypothesis, will not incur. The hypothesis remains stable regardless of its truth value because the observable outcome is identical in both the true and false states.

  **Minimal Conditions:**
  1.  **Binary Threat Hypothesis:** Agents hold a belief about a latent threat (e.g., "The environment is hostile" vs. "The environment is benign").
  2.  **Asymmetric Verification Cost:** The act required to verify the benign state (e.g., signaling, standing down) is low-cost if the hypothesis is false, but catastrophic if the hypothesis is true.
  3.  **Rational Avoidance:** Agents prioritize survival/security over epistemic clarity.
  4.  **Observational Equivalence:** The behavior resulting from the belief (silence, mobilization) produces the same observable data regardless of whether the threat is real or imagined.

  **The "Planted Forest" Variant:**
  When a third party actively manufactures signs of danger to sustain the belief among others for their own benefit, this is **Manufactured Strategic Unfalsifiability**. This adds a condition: *Beneficiary Manipulation*. The unfalsifiability is no longer just a tragedy of information; it is a weaponized asset.

  ### 3. Non-Instances (What This Is Not)

  To ensure the concept is not over-extended, here are two cases that resemble Strategic Unfalsifiability but fail the conditions:

  **Case A: Nuclear Deterrence Stability**
  *   *Resemblance:* Peace persists; we don't know if it's because deterrence works or because no one wanted to fight. Testing (fighting) is catastrophic.
  *   *Why it fails:* The *capacity* for destruction is observable (weapons exist). The uncertainty is only about *intent*. In Strategic Unfalsifiability, the *rules of engagement* or the *nature of the environment* are the unknown variables. Deterrence is a subset of the security dilemma, not a pure epistemic lock.

  **Case B: Pascal's Wager**
  *   *Resemblance:* Belief is maintained because the cost of being wrong (atheism if God exists) is infinite.
  *   *Why it fails:* This is individual decision theory under uncertainty, not a strategic equilibrium between agents. There is no interaction where one agent's silence confirms another's fear. Strategic Unfalsifiability requires a multi-agent system where the *collective* behavior sustains the opacity.

  ### 4. Non-Question-Begging Tests

  If the phenomenon is defined by the impossibility of direct testing, how do you identify it without assuming its existence? You look for **marginal anomalies** in the cost structure or the beneficiary landscape.

  **Test 1: The Marginal Signal Experiment**
  If Strategic Unfalsifiability is in effect, agents should remain silent at high signal strengths but might signal at low signal strengths if the cost curve is continuous.
  *   *Method:* Observe if agents utilize low-cost, low-visibility probes (e.g., leakage, unofficial backchannels, low-power pings) that would be safe even if the threat were real.
  *   *Indicator:* If *no* signaling occurs even at near-zero cost, the belief in the fatality of the test is absolute, supporting the hypothesis of Strategic Unfalsifiability. If signaling occurs at the margins, the lock is porous.

  **Test 2: The Beneficiary Audit (For the Planted Forest Variant)**
  If the belief is false but stable, someone must be bearing the cost of maintaining the fear (manufacturing decoys, spreading rumors).
  *   *Method:* Trace the resource flows required to generate the "signs of danger."
  *   *Indicator:* In a true Dark Forest, signs of danger (e.g., destroyed civilizations) are natural or random. In a Planted Forest, the *distribution* of danger signs correlates with the strategic interests of a specific surviving actor. If the "predators" only strike when a specific third party benefits from the resulting silence, the unfalsifiability is manufactured.

  **Test 3: Asymmetric Belief Persistence**
  *   *Method:* Compare belief persistence across agents with different risk profiles.
  *   *Indicator:* If actors with lower survival stakes (e.g., smaller states, non-state actors, or AI probes) begin to signal while high-stakes actors remain silent, it suggests the unfalsifiability is a function of *cost*, not evidence. If *all* actors remain silent regardless of stake, the belief may be true (or the lock is total).

  ### Summary for Your Chapter

  You are describing **Strategic Unfalsifiability**. It is distinct from the security dilemma (which is about escalation) and self-fulfilling prophecies (which resolve truth). It is an epistemic trap where the price of knowledge is survival, and rational agents choose survival over knowledge. The "Planted Forest" is a malign sub-species where the trap is engineered. Use the term to distinguish the *mechanism of silence* from the *fact of silence*.
