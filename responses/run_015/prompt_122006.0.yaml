      *   *User's Case:* The benefits algorithm case challenges this. If the algorithm is rule-bound (non-arbitrary in republican terms) but people feel unfree, republicanism predicts they *should* feel free (or at least politically free). If they don't, either the theory is wrong about what constitutes arbitrariness, or the feeling of unfreedom is not about political freedom.

