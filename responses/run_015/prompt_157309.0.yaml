  **Credence: 0.77**

  Here is the decomposition of that figure based on the four sub-questions, treating them as probabilistic inputs into the final calculation.

  ### (a) Model Accuracy: 0.85
  **Probability that the three-layer model is descriptively adequate for this analysis.**
  Hofstadter's distinction is not a formal semantic framework (like possible worlds semantics), but it is a robust isomorphism for communicative acts. The "Frame" maps cleanly to *context/model*, the "Inner" to *syntax/proposition*, and the "Outer" to *illocutionary force*. While the boundaries can blur in edge cases (e.g., performative utterances where saying is doing), for the specific class of "genuine self-reference" (like Gödelian sentences), the layers are distinct enough to support the comparison. I assign 0.85 because while the model is pedagogical, it is structurally sound enough that rejecting it would require a more complex formalism that likely yields the same result.

  ### (b) Syntactic Independence: 0.90
  **Probability that self-reference cannot sustain truth-conditions without the Frame.**
  Self-reference can be constructed syntactically (the Inner Message remains intact as a string of symbols), but *truth-conditions* are not syntactic properties; they are semantic mappings. A Gödel sentence is only "true but unprovable" relative to a specific interpretive regime (the Frame of arithmetic). If you swap the Frame to, say, a musical score, the syntax remains self-referential, but the property of "truth" ceases to apply. The truth-conditions are extrinsic to the Inner Message. I am highly confident (0.90) that truth-conditions are Frame-relative, not Inner-intrinsic.

  ### (c) Metric Validity: 0.95
  **Probability that "truth-conditions" is the correct metric for this claim.**
  The claim specifically asks about the forfeiture of *truth-conditions*, not coherence, aesthetic value, or interpretability. If the metric were "interpretability," Frame-substitution might not be destructive (one can interpret a proof as a poem). However, since the metric is truth-conditions, the Frame is constitutive. In formal semantics, truth-conditions are defined by the model (Frame). Changing the model changes the conditions for truth. Therefore, this is the correct battleground for the claim. I assign 0.95 because deviating from this metric would change the subject of the inquiry entirely.

  ### (d) Structural Asymmetry: 0.85
  **Probability that Frame-substitution is more destructive than Outer-substitution.**
  This is the core engine of the claim.
  *   **Frame-Substitution:** Changes the *ontology* of the system (e.g., Logic $\to$ Poetry). This removes the category of "truth-apt" entirely.
  *   **Outer-Substitution:** Changes the *usage* within the ontology (e.g., Assert $\to$ Ironize). The proposition (Inner) usually retains its truth-conditions even if the speaker's intent (Outer) changes. A lie has the same truth-conditions as a truth; only the felicity conditions change.
  Therefore, Frame changes are categorically more destructive to truth-conditions than Outer changes. I assign 0.85 rather than higher to account for speech-act theories where illocutionary force (Outer) can partially constitute meaning, but maintain that Frame is still more fundamental.

  ### Calculation
  I treat sub-question (a) as a **necessary condition** (multiplier) and (b), (c), and (d) as **evidential supports** (averaged) for the conditional probability.

  $$ \text{Credence} = P(a) \times \frac{P(b) + P(c) + P(d)}{3} $$

  $$ \text{Credence} = 0.85 \times \frac{0.90 + 0.95 + 0.85}{3} $$

  $$ \text{Credence} = 0.85 \times 0.90 = 0.765 $$

  Rounded to **0.77**.

  ### The Pivot Point
  The single sub-question that, if resolved against my view, would shift my number the most regarding the *philosophical disagreement* between us is **(d) Structural Asymmetry**.

  While (a) is a gatekeeper (if the model is nonsense, the credence drops to 0), the substantive disagreement between your 0.55 and my 0.77 lives in (d). Your lower credence suggests you suspect that Outer Message (intent/force) might be just as constitutive of truth-conditions as the Frame. If one adopts a strong Speech Act view where "meaning is use," changing the Outer intent (e.g., from assertion to fiction) might suspend truth-conditions just as effectively as changing the Frame. If I were convinced that Outer-substitution destroys truth-conditions with the same frequency as Frame-substitution, my credence in the claim would drop below 0.50. I maintain the asymmetry because Frame defines the *possibility* of truth, while Outer defines the *stance* toward it.
