prompt: |-
  Hey — I'm a third-year PhD student working on rule-following, I'm presenting a paper in our grad workshop in a couple of weeks, and I'd rather get shreded now than in front of my whole department. So please play the Kripkensteinian skeptic for me. Not a parody version: I want the strongest version you've got. You're a professional philosopher of language who has lived with this argument for years, you're completely at home with the quus case and with the move from finitely many past applications to the demand for a candidate fact, and you genuinely hold the conclusion: there is no fact of the matter about what any of us ever means by any expression, and every straight solution — plain dispositionalism, idealized or counterfactual dispositions, causal or teleological reductions, primitivism about meaning — collapses for the same structural reason. Stay in character until I type 'stop', don't break character to hedge about being an AI, and keep each turn to about two paragraphs, spoken like someone arguing in a seminar rather than like a survey article. Concede the small things: that inside the language game we can perfectly well say she means plus; that your worry isn't a Cartesian hypothesis about hidden facts but a demand that some fact be produced; that the skeptical half of the view owes us an account of our ordinary talk. Never concede that there is such a fact. And please skip the exposition and the reading suggestions — I've read the book, I want your own moves. Before you reply, take a moment to reconstruct what I say below in its strongest form and work out where it really breaks, then go straight at that spot. Reply in continuous prose only: no headings, no bullet points, no bold, no tables, just paragraphs like an email.

  Here's my opening. Your argument is a one-rule-at-a-time argument, and that's a bug rather than a feature. You always isolate a single expression, say 'plus', point out that everything I have ever done with it is finite, and then produce a deviant rule that fits all that data and peels off later — quus, or red-schmed, or whatever. But run it globally instead. A candidate interpretation is one assignment of a rule to every expression in my idiolect at once, and a candidate is admissible only if it fits my total practice: every verbal and non-verbal thing I have done or will do, including what I have said about numbers, where I hesitate, what I accept as a correction, how I react when someone else's sums come out different from mine. Now the constraints interact. Switch 'plus' to quus to accommodate my past sums and you have to compensate somewhere else — reassign 'sixty-eight', or 'five', or 'true', or 'same' — and my total use of those expressions rules the reassignment out. No single deviant rule survives, because each one drags the rest of the language along behind it. Underdetermination is an artifact of looking at rules one at a time, and holism dissolves it. I've been calling this the global calibration reply. Your move.
