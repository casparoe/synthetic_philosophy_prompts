answer: |-
  In the sixth chapter of *A Treatise on Probability*, John Maynard Keynes draws a distinction that continues to haunt decision theory. He separates the *probability* of a conclusion from its *weight*. Probability is the degree of rational belief warranted by the evidence at hand. Weight, conversely, measures the amount of relevant evidence upon which that probability rests. It is a balance between relevant knowledge and relevant ignorance. Two analysts might assign a probability of 0.5 to a proposition; one may have examined a single clue, the other a thousand. For Keynes, the latter argument has greater weight. The philosophical dispute concerns whether this difference ought to influence rational action. Four positions emerge. The *Redundancy Thesis* holds that weight is merely epistemic biography; if probabilities are identical, action should be too. The *Second-order Reduction* treats weight as a spread in higher-order probabilities. The *Elasticity Reduction* identifies weight with the sensitivity of the probability to new evidence. Finally, *Irreducibility* claims weight is a distinct normative input. To resolve this, we must test these views against specific decision environments.

  Consider first the sealed-forecast case. An engineer must sign off on a design now or never. Two analyses yield an identical failure probability of 0.02. Analysis A rests on exhaustive testing; Analysis B on thin simulation. No further evidence is possible, and no future decision depends on this one. Does the engineer ought to act differently? The Irreducibility thesis suggests she should hesitate more with Analysis B, perhaps demanding a higher safety margin. However, if the expected utility is calculated using the 0.02 figure, the rational choice is identical. To act otherwise is to let the history of the calculation dictate the present risk, rather than the risk itself. The Redundancy Thesis argues that once the evidence is conditionalized into the probability, the "amount" of evidence is metabolized. Any residual preference for Analysis A is either a disguised judgment that the 0.02 in Case B is inaccurate (which contradicts the stipulation) or an irrational aversion to ambiguity. In a static decision with no downstream consequences, weight appears normatively inert.

  However, the intuition that weight matters persists because it usually tracks something else. This leads to the divergence of measures. Keynes defines weight by the volume of relevant knowledge (survey-weight). But practical rationality often cares about stability (elasticity-weight). These can come apart. Imagine a high survey-weight scenario where 90% of the field is examined, but the missing 10% contains a "killer variable" that would shift probability from 0.9 to 0.1. Here, survey-weight is high, but elasticity is high (the view is fragile). Conversely, imagine low survey-weight where only 10% is known, but the unknown 90% is known to be noise that cannot shift the probability significantly. Here, survey-weight is low, but elasticity is low (the view is robust). If rational action depends on stability, Keynes identified the wrong quantity. He conflated the *amount* of evidence with the *stability* of the conclusion. The Elasticity Reduction captures the practical value of weight—knowing when to seek more information—without positing a new normative category. It reduces weight to the expected value of information and robustness analysis, both standard tools of decision theory.

  This reduction is tested by the weight-audit. Suppose an agent can pay a small sum for an audit guaranteed to leave her posterior probability unchanged in a decision with no downstream choices. Is paying rational? Under the Redundancy and Elasticity reductions, this is irrational. The audit costs resources but yields no change in belief and no opportunity to alter action based on new data. It is a money pump. The Irreducibility thesis might argue the agent buys "epistemic security." But if the probability remains unchanged, this security is purely psychological—a reduction in anxiety, not an improvement in rationality. Unless anxiety enters the utility function directly (as a cost of decision-making), paying for an audit that changes nothing is a failure of rational agency. It treats the *feeling* of weight as a good in itself, distinct from the *truth-tracking* function of evidence.

  Furthermore, we must address the definitional worry. Weight is measured against "relevant ignorance." But an agent cannot know what she does not know. To assess the weight of an argument, one must assess the size of the relevant field of evidence. If the field is unknown, the weight is incalculable. An agent might believe she has high weight because she has examined all *known* evidence, unaware of a whole category of data. This makes weight an unreliable guide for action. Probability, while difficult to assess, is at least anchored in the evidence possessed. Weight requires a meta-assessment of the evidence space that is often impossible. This epistemic opacity suggests that weight cannot serve as a independent normative constraint; it is too shadowy to guide reason.

  My verdict is that the **Redundancy Thesis** is correct. Weight, in Keynes's sense, has no role in rational decision-making that is not already played by probability and the value of information. The intuition that weight matters is best explained by the Elasticity Reduction: in dynamic environments, low weight usually signals high value of information. We prefer high-weight arguments because they are less likely to be overturned by the next piece of data, saving us the cost of revising our beliefs. But in the sealed-forecast case, where revision is impossible, this value vanishes. The "amount" of evidence is irrelevant; only the warrant it provides (probability) matters. To claim otherwise is to commit the sunk-cost fallacy of epistemology: valuing the labor of evidence-gathering rather than its product. The Redundancy Thesis preserves the normative clarity of expected utility theory. It acknowledges that while agents may *feel* more comfortable with high-weight evidence, rationality demands they act on the best estimate of the world they have, regardless of how thin the file may be.

  This conclusion has significant implications for Keynes's later work in *The General Theory*. There, Keynes argues that the precariousness of long-term expectation (low weight) forces agents to rely on convention and liquidity rather than rational calculation. If the Redundancy Thesis holds, this description is psychologically astute but normatively deflated. Agents do not *ought* to lean on convention because weight is low; they do so because they are ambiguity-averse or cognitively limited. The reliance on convention is a behavioral coping mechanism for the discomfort of low weight, not a rational requirement imposed by weight itself. Rational agents should act on their best probability estimates, even if the weight is slender, provided the expected value is positive. Thus, Keynes's move in *The General Theory* stands as a profound claim about human behavior under uncertainty, but it cannot be vindicated as a claim about rational necessity. The weight of an argument matters to the psychologist, but to the rational agent, only the probability counts.
