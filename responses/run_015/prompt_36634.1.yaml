answer: |-
  To the Members of the Capital Punishment Review Commission, as we approach this vote I feel compelled to offer a recommendation that steps back from the immediate choice between the status quo and the proposed narrowing statute to examine the foundational assumptions underlying both options. The proposal before us is intellectually seductive because it attempts to reconcile the moral intuition that some crimes demand the ultimate penalty with the practical reality that our justice system is fallible. By restricting eligibility to cases with physical evidence like DNA or video, requiring unanimous jury votes for death, and establishing life without parole as the default, we aim to create a system that is both retributively just and practically infallible. However, before we cast our votes, we must confront the two questions this proposal quietly dodges, namely whether a system that executes only rarely and after decades of appeals deters anything at all, and whether a standard of only the certainly guilty is something any human institution can actually meet, or whether it just moves the line of who gets wrongly killed.

  On the question of deterrence, we have heard extensive testimony regarding the economists' time-series studies that claim each execution prevents a specific number of murders. It is true that some models support this conclusion, but it is equally true that these results fell apart as soon as researchers reran them with different assumptions about the model, suggesting the findings are fragile and dependent on specific statistical controls rather than robust social facts. Yet even if we grant for the sake of argument that capital punishment can deter, we must ask if the system proposed here would retain that capacity. Deterrence relies on the perception of risk and the immediacy of consequence. A regime that executes only in the rarest instances, following decades of appellate review necessary to verify DNA or video evidence and ensure unanimous consensus, removes both the certainty and the swiftness required to influence the calculus of a potential killer. If we narrow the penalty to this degree, execution becomes a historical anomaly rather than a credible threat, and we cannot in good faith claim public safety benefits from a practice that occurs so infrequently and so slowly that it fades from public consciousness.

  This brings us to the retributivist case, which the chair has rightly insisted we take seriously on its own terms as a matter of desert rather than dismissing it as dressed-up vengeance. Retribution is not merely vengeance; it is the moral claim that justice requires a proportionate response to evil, that there is a moral balance sheet that must be settled. If a person knowingly and willingly commits an aggravated murder, the argument goes, they have forfeited their right to life, and failing to exact that penalty fails to honor the dignity of the victim. This is a coherent moral position that deserves respect. However, the legitimacy of retribution rests entirely on the accuracy of the judgment. To inflict death as a matter of moral desert requires absolute certainty that the person standing before the state is the one who deserves it. If we are wrong, we are not delivering justice; we are committing a murder of our own, and no amount of moral balancing can justify the intentional killing of an innocent person.

  This is where the proposal's requirement for physical evidence like DNA or video attempts to solve the problem of innocence, but it does not solve the problem of human fallibility. We have a stack of files on people who spent years on death row and then got exonerated, including one guy who came within weeks of execution on what looked airtight at the time based on eyewitness testimony and a signed confession. While DNA and video are more reliable than eyewitnesses, they are not immune to contamination, mishandling, or contextual misinterpretation. More importantly, by restricting the death penalty only to cases with this specific type of evidence, we may create a false sense of security that leads to complacency in investigation and adjudication. We must ask whether a standard of only the certainly guilty is something any human institution can actually meet. History suggests that every time we raise the bar for evidence, we do not eliminate error but rather move the line of who gets wrongly killed. We shift from executing the poor defendant with a bad lawyer to potentially executing the defendant where the science looked perfect but was flawed, all while telling ourselves that this time it is different.

  Furthermore, the delay inherent in ensuring this level of certainty undermines the retributive goal as well. A death sentence carried out twenty years after the crime does not serve the same moral function as one carried out swiftly, yet swift execution is incompatible with the rigorous review needed to approach certainty. We are left with a system that is too slow to deter, too fallible to guarantee the moral certainty required for retribution, and too rare to satisfy the public demand for justice. The proposal attempts to have it both ways, retaining the penalty while removing the risks, but the risks are inherent to the act of judging human beings. Given that we cannot meet the epistemic standard required to make retribution just, and given that the narrowed system offers no credible deterrence benefit, I recommend that we vote to abolish the death penalty. We can still honor the gravity of murder through life without parole, which protects the public and acknowledges the severity of the crime without forcing the state to claim a certainty it cannot possess or to inflict a punishment that, in our modern context, fails to achieve its own stated moral and practical ends.
