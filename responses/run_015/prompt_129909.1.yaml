  ### Preliminary Assessment of Joint Satisfiability

  The set of requirements derived from your job description (state observes earnings/wealth only) and your candidate worries (specifically 1, 3, 10, 12 regarding the choice/chance boundary) is **jointly unsatisfiable**. A state cannot adjudicate the brute/option luck distinction (Requirement 1) without observing effort and choice (forbidden by the job description). To ship a scheme, you must relax the demand for metaphysical accuracy in distinguishing luck types. You must substitute *proxy-based insurance* for *justice-based compensation*. The cost is that some unjust inequalities will remain uncompensated, and some just inequalities will be taxed, to preserve administrative feasibility and incentives.

  ### Normative Specification Desiderata

  | id | requirement | motivating_case | status | rules_out |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Epistemic Feasibility:** All eligibility criteria and transfer calculations must rely exclusively on observables (income, wealth, age, disability status) without requiring testimony on effort, intent, or taste formation. | The state cannot see inside the agent; requiring unobservables invites fraud or arbitrary bureaucratic discretion. | Non-negotiable | Metaphysical Luck Egalitarianism; Strict Responsibility-Sensitive Theories |
  | **R2** | **Incentive Compatibility:** The marginal tax rate on productive activity must remain below the threshold where labor supply or investment collapses materially. | A scheme that eliminates the return to effort destroys the tax base required to fund transfers. | Non-negotiable | Strict Outcome Egalitarianism; Confiscative Taxation |
  | **R3** | **Minimum Security:** The scheme must guarantee a material floor below which no citizen falls, regardless of prior choices or gambles. | Moral horror at destitution; political stability requires preventing absolute deprivation. | Negotiable (level) | Libertarianism; Harsh Desert-Based Theories |
  | **R4** | **Administrative Dignity:** Claiming transfers must not require the agent to publicly certify incapacity, defect, or moral failure. | Stigma reduces uptake and harms social status; justice should not require humiliation. | Negotiable | Strict Means-Testing on Need; Charity Models |
  | **R5** | **Currency Specification:** The scheme must explicitly identify the metric of advantage (e.g., income, wealth, capability access) used for comparison and transfer. | Without a fixed metric, policy drifts and comparisons become arbitrary. | Non-negotiable | Vague Pluralism; Unstructured Discretion |
  | **R6** | **Temporal Accounting:** The scheme must specify whether liability and entitlement are calculated per time-slice (annual) or over a lifetime (cohort). | Ambiguity allows gaming (timing income) and creates inter-temporal unfairness. | Negotiable | Ambiguous Temporal Scope |
  | **R7** | **Preference Neutrality:** The scheme must not subsidize expensive tastes unless they are certified as disabilities or structural constraints. | Subsidizing tastes creates perverse incentives and infinite liability; resources are scarce. | Prejudice of Resourcists | Welfarism; Preference-Satisfaction Theories |
  | **R8** | **Population Boundary:** The scheme must define the class of persons eligible for membership (e.g., citizens, residents, all affected). | Resources are finite; unlimited scope dilutes the guarantee to members. | Negotiable | Cosmopolitanism; Open Borders Egalitarianism |

