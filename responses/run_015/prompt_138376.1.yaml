prompt: |-
  I chair the weekly case conference that sets the care plan for patients with prolonged disorders of consciousness at a long-term complex-care unit. Roughly six to ten new patients a year come through it, always with the same three questions from the family: is she conscious; can she hear us when we talk to her; is she suffering. What we decide with the answers is not small — whether to continue clinically assisted nutrition and hydration, whether to give analgesia and sedation for procedures and for turning, whether to encourage the family to keep talking at the bedside, whether to approach them about a research protocol. The conference is an hour long, the people in it are a neurologist, a palliative care physician, a senior nurse and a chaplain, we have no research lab, and whatever we decide has to be said out loud to a family in plain words and defended afterwards to the hospital's ethics committee. So I need a procedure, not a position paper.

  The framework I keep coming back to is integrated information theory, because it is the only one I know that answers the three questions separately rather than treating consciousness as one dial: it gives a criterion for whether experience is present at all, a quantity for how much, and — at least in principle — a specification of what the experience is like. But every time I try to turn it into something we can run in an hour I get stuck on how many of its commitments are the opposite of clinical common sense, and I would rather have the contradictions on the table than smoothed over.

  Here is what I take the theory to commit to, for the purposes of the procedure; correct me where I have it wrong. Experience is a property of a system's causal structure — the cause–effect repertoire it specifies over itself — not of its activity at a moment. It is the irreducibility of that structure to the structures of its parts that matters, and the quantity is measured by how much the whole specifies over and above the sum of the parts. Crucially, the conscious entity is the subset that maximizes that quantity, not automatically the whole brain: the theory takes the maximum over candidate subsets rather than reading off the organism. And the quality of the experience is supposedly given by the shape that structure takes when unfolded into a space whose axes are the concepts the system specifies.

  If that is right, then several things follow that I do not know how to handle in a case conference, and I want them built into the procedure rather than quoted at me:

  First, a cortex that is physically present and wired up but pharmacologically or structurally quiescent — burst suppression, deep sedation, a thalamus no longer driving it — still has its cause–effect repertoire on this account, because the repertoire is a property of the mechanism and its connections rather than of what it is currently doing. So no EEG pattern I can point to is a deductive entailment of the theory's criterion for absence. I need to know what, if anything, on this view does license a negative verdict, and where the procedure must stop and say "no verdict available" instead of "not conscious."

  Second, neuron count and surviving volume are the wrong axis. A large, modular, mostly feedforward structure can contribute almost nothing while a small densely recurrent mesh contributes a great deal. My team's instinct, and the families', is to read the scan as "how much brain is left." I want that instinct replaced by a question we can actually ask of the imaging and the clinical examination, and told honestly when the answer is not available at our level of resolution.

  Third, and this is the one I expect to be unpopular: if the theory takes a maximum over subsets, then a weakly connected region can supply a cheap cut that makes the whole brain reducible, and destroying or disconnecting that region can leave a smaller system whose irreducibility is higher than that of the whole it used to belong to. On the face of it, the theory allows a lesion to increase consciousness rather than decrease it. If that is a real consequence and not my misreading, the procedure has to say so, tell me what would count as evidence for it in a particular patient, and tell me what we are allowed to say to a family about it.

  Fourth, "can she hear us" is not the same question as "is she conscious." Even granting a complex exists, whether the patient hears speech depends on whether that structure specifies the corresponding auditory concepts. A patient could be conscious with an experience that contains nothing corresponding to speech at all, and a patient who follows commands on fMRI or EEG is showing us that a specific concept is specified, which is stronger and different evidence than evidence of consciousness in general. My procedure needs the content question asked separately from the existence question, with different evidence for each.

  Fifth, the verdict is time-relative and discontinuous. It is a verdict about a mechanism in a state, so it can flicker across hours and across a sedation holiday; and because it hangs on which subset maximizes the quantity, small differences in assumed connectivity can flip which system is the subject. I want to know how to handle near-ties between candidate complexes: whether a near-tie is a genuine finding or a "no answer," and how the procedure should treat a patient whose verdicts differ between two assessments a week apart.

  Sixth, the theory says nothing usable to me about valence. It may identify quality with a shape in a space of concepts, but nobody in my hospital can read suffering off that, and I am not going to withhold analgesia from a patient because of a philosophical argument. So the procedure needs an explicit handoff point where the suffering question leaves the theory and goes to clinical precaution, and it should state what the precautionary default is and why the theory gives no reason to depart from it.

  So here is what I am asking for. Write me a decision procedure my team can run in a one-hour conference, in the form of ordered questions with a specified stopping rule for each: what counts as a sufficient answer, what evidence at our level of resolution would meet it, where the procedure returns a no, and where it hands the question to a person because it is a question of values rather than of fact. Mark explicitly the steps where judgment cannot be eliminated and the theory is being used as a heuristic rather than applied. Include a short table translating the theory's terms into the things we can actually observe — imaging, bedside examination, EEG, evoked responses, a TMS-EEG perturbation-based complexity measure where we can get one — and say plainly which of those are proxies and what each proxy would have to track in order to be evidence of irreducibility rather than merely of differentiation of response. Give me the limits of the procedure as well: the cases where integrated information theory has no verdict at all, the cases where its verdict should be overridden, and a note on what the absence of a verdict does and does not entitle us to conclude or to tell a family.

  Then run it on three patients.

  One: a woman of thirty-four, six months out from an anoxic brain injury, diagnosed with unresponsive wakefulness syndrome — eyes open, sleep–wake cycles on EEG, no command following at the bedside, no command following on task-based fMRI, thalamocortical architecture apparently preserved on structural imaging. Her family has stopped talking to her because a resident told them there is nobody there, and they are asking us whether to continue clinically assisted nutrition and hydration.

  Two: a man of fifty-eight, bedside unresponsive for four months after a traumatic injury, who shows reproducible command-following on motor-imagery fMRI and on EEG but nothing at the bedside. His family wants to know whether he experiences the scans, the noise, and the instructions as instructions, and whether he is in pain. I want to know what the procedure adds here over what the imagery data already tells us — in particular whether the evidence that a concept is specified is also evidence about which system is the one that is conscious, or whether those come apart.

  Three: a man of forty-one with long-standing severe hydrocephalus, whose cortex is compressed to a thin mantle, who is awake and follows simple commands inconsistently. The team's reflex is to treat him as barely conscious because the scan looks catastrophic, and I suspect the theory says the opposite of what the scan suggests. I would rather hear that my procedure gives an answer I dislike than an answer that flatters me — so if your honest application of it tells me to treat him as more conscious, or tells me that some lesion in one of these patients raised rather than lowered what the theory cares about, say so and show the step where it happens.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a weekly case conference for patients with prolonged disorders of consciousness (pDoC).
      *   **Context:** Long-term complex-care unit, 6-10 new patients/year.
      *   **Core Questions from Families:** Is she conscious? Can she hear us? Is she suffering?
      *   **Stakes:** High (CANH, analgesia, family interaction, research protocols).
      *   **Constraints:** 1-hour conference, multidisciplinary team (Neuro, Palliative, Nurse, Chaplain), no research lab, must explain to families/ethics committee in plain words.
      *   **Framework:** Integrated Information Theory (IIT). The user understands IIT well (causal structure, irreducibility, maximum subset, quality as shape, etc.) but finds it hard to operationalize clinically due to contradictions with common sense.
      *   **Specific Demands:**
          *   A decision procedure (ordered questions, stopping rules).
          *   Explicit handling of IIT's counter-intuitive commitments (quiescence vs. structure, lesion increasing consciousness, subset maximization).
          *   Separation of "Existence," "Content" (hearing), and "Valence" (suffering).
          *   Handling of temporal instability and near-ties.
          *   Explicit handoff to clinical precaution for suffering.
          *   Translation table (Theory -> Clinical Proxy).
          *   Limits of the procedure (where IIT has no verdict).
          *   Application to three specific case vignettes.
      *   **Tone:** Professional, precise, honest about limitations, not smoothing over contradictions.

  2.  **Deconstruct Integrated Information Theory (IIT) for Clinical Application:**
      *   *Core Axiom:* Existence (consciousness exists) -> Intrinsicality, Information, Integration, Exclusion.
      *   *Core Measure:* $\Phi$ (Phi) - amount of integrated information.
      *   *Core Mechanism:* Cause-effect repertoire of a mechanism in a state.
      *   *Clinical Reality Check:* We cannot calculate $\Phi$ directly in humans. We use proxies (PCI, EEG complexity, fMRI connectivity).
      *   *User's Specific Concerns:*
          1.  *Quiescence:* Structure exists even if inactive. IIT says potential matters, but actual $\Phi$ depends on the *state*. A sleeping brain has structure but low $\Phi$ in some states, high in others (dreaming). Deep sedation reduces effective connectivity. *Correction:* IIT 3.0/4.0 emphasizes the *actual* cause-effect power in the current state. If connections are functionally silenced (pharmacologically), $\Phi$ drops.
          2.  *Volume vs. Integration:* Correct. Recurrency matters more than mass.
          3.  *Lesion Increasing Consciousness:* Theoretically possible (Exclusion postulate). If a noisy module reduces overall integration, removing it might increase the $\Phi$ of the remaining core. *Clinical implication:* Rare, but must be acknowledged.
          4.  *Hearing vs. Consciousness:* Content vs. Existence. Specific concepts (auditory) vs. general capacity.
          5.  *Time/Discontinuity:* $\Phi$ is state-dependent. Fluctuations are real.
          6.  *Suffering:* IIT describes *what* it is like, not *how good/bad* it is. Valence is separate. Precautionary principle applies.

  3.  **Drafting the Procedure (The "IIT-Clinical Protocol"):**
      *   *Goal:* 1-hour workflow.
      *   *Structure:* Step-by-step questions with "Stop/Go" criteria.
      *   *Step 1: Structural Substrate (The "Hardware").* Is there a candidate complex? (Anatomy).
      *   *Step 2: Functional Capacity (The "Software/State").* Is it integrated *now*? (Physiology/EEG/PCI).
      *   *Step 3: Content Specificity (The "Input").* Can it distinguish speech? (fMRI/ERP).
      *   *Step 4: Suffering (The "Valence").* Handoff to palliative/ethics.
      *   *Step 5: Verdict Formulation.* Plain language for family.

      *   *Refining the "Quiescence" issue:* IIT requires *causal power*. If a neuron is hyperpolarized to the point it cannot fire, its cause-effect repertoire is null. So, deep sedation *does* reduce $\Phi$. The procedure needs to distinguish "structurally intact but functionally silenced" vs. "structurally disconnected."
      *   *Refining the "Lesion" issue:* This is the "Exclusion" postulate. If a region adds noise, removing it increases $\Phi_{max}$. The procedure needs a check for "noisy modules."
      *   *Refining the "Proxy" issue:* PCI (Perturbational Complexity Index) is the closest clinical proxy to $\Phi$. EEG connectivity is a weaker proxy. fMRI is good for content, less for integration speed.

  4.  **Developing the Translation Table:**
      *   Need to map IIT terms (Cause-Effect Repertoire, Integration, Exclusion) to Clinical Tools (MRI, EEG, TMS-EEG, Bedside Exam).
      *   Must distinguish between *Proxy for Structure* and *Proxy for State*.

  5.  **Addressing the Three Cases:**
      *   *Case 1 (Anoxic, UWS):* Structure okay, function low. No command following. PCI likely low. *Verdict:* Low probability of consciousness. *Suffering:* Precautionary. *Family:* "We cannot prove anyone is there, but we cannot prove no one is there."
      *   *Case 2 (TBI, MCS*/Cognitive Motor Dissociation):* Command following on fMRI/EEG. *Verdict:* Conscious (Existence confirmed). *Content:* Auditory concepts specified (Hearing confirmed). *Suffering:* Unknown, assume yes.
      *   *Case 3 (Hydrocephalus, Thin Cortex):* Structure looks bad, but function exists (command following). *Verdict:* Conscious. *IIT nuance:* Small but dense network might have high $\Phi$. Don't trust the MRI volume alone.

  6.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is this too theoretical?
      *   *Fix:* Ensure every step asks for specific data available in a standard complex-care unit (EEG, MRI, Bedside). Acknowledge TMS-EEG might not be available (user said "where we can get one").
      *   *Critique:* The user wants the contradictions on the table.
      *   *Fix:* Add "Epistemic Warning" boxes in the procedure. Explicitly state where IIT contradicts the "more brain = more mind" heuristic.
      *   *Critique:* Suffering question.
      *   *Fix:* Make Step 4 a hard "Handoff." IIT cannot answer this. The protocol must mandate analgesia regardless of IIT verdict.
      *   *Critique:* Time variability.
      *   *Fix:* Include a "Stability Check." If verdicts flip, default to the "higher consciousness" state for ethical safety.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the gravity and the constraints.
      *   **The Translation Table:** Theory vs. Clinic.
      *   **The Procedure:** 5 Steps with Stopping Rules.
      *   **Limits & Overrides:** When to ignore the theory.
      *   **Case Applications:** Running the protocol on the three vignettes.
      *   **Conclusion:** Final advice on communication.

  8.  **Drafting the Content (Mental Check of IIT details):**
      *   *IIT 3.0/4.0:* $\Phi$ is calculated over the Minimum Information Partition (MIP).
      *   *Exclusion:* Only the local maximum of $\Phi$ exists.
      *   *Intrinsicality:* From the system's perspective.
      *   *Clinical Proxy:* PCI (Casali et al.) is the standard for DoC. It correlates with $\Phi$.
      *   *Suffering:* IIT 4.0 attempts to address valence (intrinsic difference in structure), but it is not clinically actionable. Stick to the user's request: Handoff to precaution.

  9.  **Writing the Response:** (Proceeding to generate the response based on these thoughts, ensuring the tone is respectful of the user's expertise and the gravity of the clinical setting.) *Self-correction: Ensure I don't claim IIT is proven fact. It is a framework. The procedure must reflect uncertainty.* *Make sure to address the "lesion increases consciousness" point explicitly in Case 3 or generally.* *Ensure the "Quiescence" point is handled: Structural connectivity $\neq$ Effective connectivity.*

  10. **Final Review against constraints:**
      *   One-hour conference? Yes, procedure is streamlined.
      *   Ordered questions? Yes.
      *   Stopping rules? Yes.
      *   Translation table? Yes.
      *   Limits/Overrides? Yes.
      *   Three cases run? Yes.
      *   Contradictions exposed? Yes.

  (Proceed to output.)
answer: |-
  This is a rigorous request that demands a rigorous answer. You are asking to operationalize a metaphysical theory in a high-stakes clinical environment without hiding its counter-intuitive implications. The following procedure is designed for your specific constraints: one hour, multidisciplinary team, no direct $\Phi$ calculation, and the need for defensible plain-language verdicts.

  It treats Integrated Information Theory (IIT) not as a diagnostic test, but as a **structural heuristic** to organize evidence. It explicitly marks where the theory outruns the data and where clinical ethics must override theoretical verdicts.

  ### Part 1: The Translation Table (Theory to Clinic)

  Before the conference begins, the team must agree on what the terms mean in your setting. IIT describes properties of a *mechanism in a state*. You cannot measure the mechanism's intrinsic causality directly; you measure proxies.

  | IIT Term | Theoretical Definition | Clinical Proxy (Available to You) | Limitation / Caveat |
  | :--- | :--- | :--- | :--- |
  | **Substrate** | The physical elements specifying a cause-effect repertoire. | **Structural MRI / DTI.** Integrity of thalamocortical loops and corticocortical recurrent connections. | Structure $\neq$ Function. A wired but pharmacologically silenced cortex has low causal power. |
  | **State / Activity** | The specific activation pattern at time $t$. | **EEG Background / Sleep-Wake Cycles.** Spectral power, burst suppression, reactivity. | EEG shows correlation, not causation. High voltage $\neq$ high integration. |
  | **Integration ($\Phi$)** | Irreducibility of the whole to its parts. | **PCI (Perturbational Complexity Index)** via TMS-EEG. **Functional Connectivity** (EEG coherence/fMRI). | PCI is the gold standard proxy. Without TMS, you are inferring integration from spontaneous complexity (weaker evidence). |
  | **Exclusion** | The local maximum of $\Phi$ defines the subject. | **Lesion Mapping.** Identifying isolated islands of preserved tissue vs. diffuse network. | **Critical:** A small, dense island may have higher $\Phi$ than a large, disconnected mass. |
  | **Concepts** | Specific cause-effect repertoires (content). | **Task-based fMRI / EEG.** Command following, auditory evoked potentials (MMN, P300). | Proves specific content (hearing), implies existence, but absence does not prove absence of existence. |
  | **Valence** | Geometric property of the cause-effect structure. | **None.** | **Hard Stop.** IIT offers no clinical metric for suffering. Default to precaution. |

  ---

  ### Part 2: The Decision Procedure (60 Minutes)

  **Role:** You (Chair) drive the clock.
  **Goal:** Answer the three family questions (Existence, Content, Suffering) or declare "No Verdict."
  **Rule:** If a step fails to yield evidence, move to the next. Do not loop. If the final verdict is ambiguous, default to the ethical precaution.

  #### Step 1: The Substrate Check (10 Minutes)
  **Question:** Is there a physical candidate for a "complex" that *could* support integration?
  **Evidence:** Structural MRI, CT, DTI.
  **Stopping Rule:**
  *   **STOP (Negative):** Global cortical laminar necrosis, bilateral thalamic destruction, or brainstem death. *Verdict: No substrate.*
  *   **STOP (Positive):** Preserved thalamocortical architecture, even if atrophied. *Proceed to Step 2.*
  *   **IIT Contradiction Alert:** Do not equate volume with capacity. A thin mantle of cortex (Case 3) with dense recurrent connectivity counts more than a large volume of feedforward white matter.
  *   **Judgment Call:** If the scan shows severe hydrocephalus or compression but preserved gray matter density, mark this as **"Structurally Ambiguous."** Do not rule out consciousness based on volume alone.

  #### Step 2: The State Check (15 Minutes)
  **Question:** Is the substrate functionally capable of irreducibility *now*?
  **Evidence:** EEG (background, reactivity), PCI (if available), Sedation history.
  **Stopping Rule:**
  *   **STOP (Negative):** Isoelectric EEG, continuous burst suppression with long inter-burst intervals, or high-dose sedatives known to silence synaptic transmission (propofol/volatile agents at anesthetic depth). *Verdict: State inactive.* (Note: This is reversible).
  *   **STOP (Positive):** Continuous background, sleep-wake cycling, reactive to pain/noise, or PCI > 0.31 (conscious threshold). *Proceed to Step 3.*
  *   **IIT Contradiction Alert:** A quiescent brain (low firing) can still have high causal power if the *connections* are intact and excitable. However, if pharmacologically silenced, the *effective* connectivity is zero. Distinguish "sleeping" (high $\Phi$ possible) from "anesthetized" (low $\Phi$).
  *   **Temporal Instability:** If EEG varies wildly between days, record the **Maximum Observed State**. IIT says consciousness is discrete; if it flickers, the patient *is* conscious during the high states.

  #### Step 3: The Content Check (15 Minutes)
  **Question:** Does the complex specify concepts relevant to the family's questions (e.g., auditory speech, pain, command)?
  **Evidence:** Bedside command following, fMRI motor imagery, Auditory Evoked Potentials (AEP), Nociceptive Evoked Potentials.
  **Stopping Rule:**
  *   **STOP (Positive):** Reproducible command following (bedside or fMRI/EEG). *Verdict: Conscious + Specific Content Present.*
  *   **STOP (Negative):** No command following, no specific evoked differentiation (e.g., no P300 to name). *Proceed to Step 4.*
  *   **IIT Distinction:** Command following proves a specific concept ("move hand") is integrated into the complex. Absence of command following does *not* prove absence of consciousness (the complex might exist but lack motor output concepts).
  *   **Hearing Specific:** Look for MMN (mismatch negativity) to deviant tones or name. If present, "She can hear" is supported even if "She is conscious" is unproven.

  #### Step 4: The Exclusion & Maximization Check (10 Minutes)
  **Question:** Is there evidence that a lesion or disconnection has isolated a smaller, more integrated system?
  **Evidence:** Comparison of lesion location vs. functional islands.
  **Stopping Rule:**
  *   **Judgment Call:** This is the highest risk step. If a large area is necrotic but a small posterior "hot zone" is hyper-connected, IIT allows that the *small* system is the conscious subject.
  *   **Procedure:** If the team suspects a "noisy" lesion is dragging down network efficiency, acknowledge this theoretically but **do not act on it clinically** (e.g., do not suggest resection to improve consciousness).
  *   **Verdict:** If functional islands exist despite massive structural loss, upgrade the Existence probability. (See Case 3).

  #### Step 5: The Suffering Handoff (10 Minutes)
  **Question:** Is the patient suffering?
  **Evidence:** Physiological markers (HR, BP), Behavioral markers (grimacing), IIT Verdict.
  **Stopping Rule:**
  *   **HARD HANDOFF:** IIT provides **NO** evidence for or against suffering.
  *   **Protocol:** Regardless of Steps 1-4, if the patient undergoes noxious stimuli (turning, suctioning), **analgesia is mandatory.**
  *   **Rationale:** Valence is a property of the cause-effect structure's shape, which you cannot measure. The cost of false negative (withholding analgesia to a suffering being) is ethically infinite compared to the cost of false positive (sedating a non-suffering being).
  *   **Verdict:** "We cannot know if she suffers, so we must assume she can."

  #### Step 6: Final Verdict Formulation (Remaining Time)
  **Task:** Synthesize Steps 1-5 into plain language for the family/ethics committee.
  **Categories:**
  1.  **Confirmed Conscious:** (Step 3 Positive).
  2.  **Probable Conscious:** (Step 1 & 2 Positive, Step 3 Negative).
  3.  **Uncertain:** (Step 1 Ambiguous or Step 2 Fluctuating).
  4.  **Improbable:** (Step 1 or 2 Negative).
  5.  **No Verdict:** (Data insufficient to distinguish).

  **Rule for Ambiguity:** If the verdict oscillates between "Probable" and "Improbable" across weeks, default to **"Probable"** for care decisions (CANH, protection) but **"Uncertain"** for prognosis.

  ---

  ### Part 3: Limits and Overrides

  **Where IIT Has No Verdict:**
  *   **Valence:** As stated, the theory describes *what* it is like, not *how it feels*.
  *   **Micro-states:** If the patient's consciousness flickers faster than your EEG sampling rate, you cannot detect it.
  *   **Non-Standard Substrates:** If the conscious complex is subcortical (thalamus only), standard cortical proxies (PCI) may fail.

  **When to Override the Theory:**
  1.  **Ethical Precaution:** If IIT suggests "Improbable" but the family reports behavioral signs of distress, treat as Conscious.
  2.  **Legal Standards:** If local law defines consciousness by behavioral responsiveness, IIT's "covert consciousness" verdict does not legally override the statute, though it informs ethics.
  3.  **Resource Allocation:** Do not use IIT to justify withdrawal of CANH in "Uncertain" cases. Use it only to support continuation or to guide palliative sedation levels.

  **What "No Verdict" Means:**
  *   **To the Family:** "Our best tools cannot detect a signal, but they cannot prove silence. We must act as if someone is listening."
  *   **To Ethics:** "We lack the resolution to calculate irreducibility. The default is preservation of life."

  ---

  ### Part 4: Running the Procedure on Your Three Cases

  #### Case 1: Woman, 34, Anoxic Injury, UWS (6 Months)
  *   **Step 1 (Substrate):** Thalamocortical architecture preserved. *Pass.* (Note: Anoxia often damages layers selectively, but MRI says "preserved").
  *   **Step 2 (State):** Sleep-wake cycles present. EEG not burst-suppressed. *Pass.* (State is not silenced).
  *   **Step 3 (Content):** No command following (bedside or fMRI). *Fail.*
  *   **Step 4 (Exclusion):** No specific islands noted.
  *   **Step 5 (Suffering):** Handoff. Assume capacity for suffering.
  *   **IIT Analysis:** She has the hardware and the state potential, but no evidence of specific integrated concepts (commands). $\Phi$ is likely low but non-zero.
  *   **Verdict:** **Uncertain / Improbable.**
  *   **Family Script:** "The brain structure is there, and it cycles between sleep and wake. However, we cannot find any evidence that it is putting information together in a way that creates awareness of you or commands. We cannot prove she is gone, but we cannot find her. Because we cannot prove she is gone, we will continue nutrition, but we will not expect recovery."
  *   **Action:** Continue CANH. Encourage family talking (low risk, potential benefit if $\Phi$ is borderline).

  #### Case 2: Man, 58, TBI, Covert Command Following (4 Months)
  *   **Step 1 (Substrate):** Traumatic injury, but sufficient tissue remains to support fMRI signal. *Pass.*
  *   **Step 2 (State):** EEG shows reactivity. *Pass.*
  *   **Step 3 (Content):** Reproducible command following on fMRI/EEG. *Pass (Strong).*
  *   **Step 4 (Exclusion):** The fact that he can follow commands proves a specific complex exists that integrates auditory instruction with motor imagery.
  *   **Step 5 (Suffering):** Handoff. Assume capacity for suffering.
  *   **IIT Analysis:** This is the "Cognitive Motor Dissociation" case. IIT confirms **Existence** (Step 3 proves a complex exists). It confirms **Content** (Auditory concepts are specified).
  *   **Verdict:** **Confirmed Conscious.**
  *   **Family Script:** "He is conscious. He can hear you and understand instructions, even though his body cannot move to show it. The scans prove his brain is forming thoughts."
  *   **Action:** Aggressive analgesia for procedures. Research protocol eligibility (he can consent via proxy/assent). Family encouraged to talk (he hears).

  #### Case 3: Man, 41, Hydrocephalus, Thin Cortex
  *   **Step 1 (Substrate):** Cortex compressed to thin mantle. *Ambiguous.* (Instinct says "fail", IIT says "check density").
  *   **Step 2 (State):** Awake, EEG likely shows activity. *Pass.*
  *   **Step 3 (Content):** Follows simple commands inconsistently. *Pass (Weak but Positive).*
  *   **Step 4 (Exclusion):** **Critical Step.** The team instinct is "thin cortex = low consciousness." IIT asks: "Is the remaining cortex densely recurrent?" If the hydrocephalus pushed out white matter but left a dense, highly connected gray matter shell, the $\Phi$ of that shell could be higher than a larger, disconnected brain.
  *   **Step 5 (Suffering):** Handoff.
  *   **IIT Analysis:** The behavioral evidence (command following) trumps the structural instinct. The lesion (hydrocephalus) may have actually *increased* the signal-to-noise ratio of the remaining network by removing noisy, disconnected modules (Exclusion postulate).
  *   **Verdict:** **Probable Conscious.** (Higher than the team instinct).
  *   **Family Script:** "The scan looks severe, but his behavior shows he is aware. The brain has reorganized. We must treat him as a conscious person, not based on how the scan looks, but on what he can do."
  *   **Action:** Do not withhold care based on "futile" imaging. Treat pain.

  ### Final Note to the Chair
  You asked for the contradictions on the table. Here is the biggest one you will face in the conference:

  **The "Lesion Benefit" Paradox (Case 3):**
  If a family asks, "Did the water on his brain make him more conscious?" the IIT answer is, "Theoretically, yes, if it removed noise."
  **Do not say this to the family.**
  It sounds like medical gaslighting.
  **Procedure Fix:** In Step 6 (Verdict Formulation), suppress the *explanation* of Exclusion unless it directly aids care. Use the theory to *justify* high-care standards for damaged brains, not to explain the damage as beneficial. The theory guides your *confidence*, not necessarily your *narrative*.

  **The "Quiescence" Trap (Case 1):**
  If a resident says, "Her EEG is flat, she's gone," IIT says, "Check the connections."
  **Procedure Fix:** Step 2 forces the distinction between *silenced* (drugs) and *disconnected* (necrosis). If the connections are there, the potential for consciousness is there, even if the signal is currently low. This justifies the "Uncertain" verdict rather than "Negative."

  Run this procedure. It will not give you certainty, but it will give you a defensible reason for why you are choosing precaution over probability.
