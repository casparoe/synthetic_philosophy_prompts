answer: |-
  This is a sophisticated prompt. You are asking for a jurisprudential analysis of an ethics committee's case law. You want to know if your body is acting like a court (applying precedent) or a legislature (making policy), and you want to know where the hidden fault lines are.

  Here is the analysis of your record, the hidden rule you are missing, and the recommendation for Case 7.

  ### 1. Critique of Your Candidate Rules

  You proposed four rules. Here is how they hold up against your six precedents:

  1.  **Valid under law/norms of the time:** **Discard.** This is not your rule. In Case 1 (Benin), the 1897 punitive expedition operated under British prize laws; the loot was legally auctioned. In Case 4 (Magdala), the manuscripts were war booty, legal under 1868 norms. You returned them anyway. You are applying *current* ethical norms retroactively, not historical legality.
  2.  **Burden of Proof (Paper Trail):** **Necessary but insufficient.** A receipt helps you retain (Case 2, 6), but it does not guarantee retention (Case 5 had a note/receipt; Case 7 has a receipt). Lack of paper guarantees return (Case 1, 3), but presence of paper does not guarantee safety.
  3.  **Consent in Colonial Context:** **Strong, but vague.** This is your primary engine, but your record shows a binary view of "consent." Case 2 and 6 are treated as "consensual markets." Case 1 and 4 are "violence." You have not yet ruled on "structural coercion" (tax fines, economic duress), which is where Case 7 lives.
  4.  **Continued Use/Function:** **Tie-breaker, not a rule.** This explains Case 5 (Regalia in use) and Case 3 (Remains), but fails to explain Case 1 (Bronzes returned despite unclear ritual status) or Case 6 (Textiles retained despite likely cultural significance).

  **The Missing Fifth Rule: Alienability and Standing.**
  This is the rule you are actually following but haven't named. It asks: *Did the seller have the moral or customary authority to alienate this object, regardless of whether they had physical possession?*

  *   **Case 5 (Regalia):** You returned this because the object belonged to the *Office*, not the Chief, and certainly not the Colonial Officer. The seller lacked title.
  *   **Case 4 (Manuscripts):** You rejected the private individual because he lacked standing to represent the monastery.
  *   **Case 2 & 6 (Goldweights/Ivory):** You retained these because they were trade goods from households/traders who customarily held title to sell them.
  *   **Case 1 (Benin):** Implicitly, the Oba's court property was not alienable by looters.

  **Verdict:** Your committee operates on a hierarchy of rules:
  1.  **Human Remains:** Unconditional return (Case 3).
  2.  **Inalienable/Office Property:** Return to Office/Lineage, regardless of paperwork (Case 5).
  3.  **Coercive Acquisition:** Return if violence or theft is proven, paperwork notwithstanding (Case 1, 4).
  4.  **Market Acquisition:** Retain if paperwork exists and no coercion is evident (Case 2, 6).

  ### 2. The Closest Analog

  Case 7 is a hybrid that breaks your existing binary.

  *   **For the Stool and Bell:** **Case 5 is the closest analog.** These are explicitly identified as seats of authority and ritual objects. Your precedent (Case 5) dictates that objects belonging to an office cannot be sold by individuals (even if the individual is the Chief, let alone a Colonial Officer's wife). The receipt is irrelevant if the object was never the seller's to sell.
  *   **For the Transaction Context:** **Case 1 is the closest analog,** but with a critical distinction. Case 1 was military violence. Case 7 is *economic coercion* (tax fine). You have no precedent for "a fair market price paid under duress created by the buyer's spouse."
  *   **For the Paperwork:** **Case 6 is the closest analog.** You have a receipt and a fair price. Under Case 6 logic, you should retain.

  **Where the Analog Breaks:**
  Your record treats "Violence" (Case 1) and "Market" (Case 6) as mutually exclusive. Case 7 reveals they can overlap. The village was under a collective fine *collected by the husband of the buyer*. This is not a free market (Case 6); it is a coercive extraction (Case 1), masked by a receipt (Case 6).

  ### 3. Recommendation for Case 7

  If you want to be consistent with your *stated* precedents (Case 5 and Case 1), you must return the objects. If you want to be consistent with your *procedural* precedents (Case 2 and 6), you must retain them.

  **You cannot be consistent with both.** You are at the point of making new law.

  **My Recommendation:**
  **Return all three items to the Lineage Head.**

  **Reasoning:**
  1.  **Alienability (The Case 5 Rule):** The Lineage Head states the stool is a seat of authority no individual was entitled to sell. Your precedent in Case 5 says you respect that claim over a receipt.
  2.  **Coercion (The Case 1 Rule):** The district records show the seller was under a fine collected by the buyer's husband. This voids the "consent" assumed in Case 6. A price is not "market rate" if the seller is selling to pay a fine imposed by the buyer's family.
  3.  **Conservation vs. Ownership:** The conservator says the stool cannot travel without stabilization. The Lineage Head says he prefers decay at home to retention there. In Case 3 (Remains), ethical return trumped scientific/curatorial interest. You must apply the same logic here. Preservation is a secondary duty to ownership.
  4.  **Claimant Hierarchy:**
      *   **Lineage Head:** Highest standing (Case 5 analog: Office Holder).
      *   **National Commission:** Secondary standing (Case 1 analog: State Trust).
      *   **Diaspora Association:** No standing for custody (Case 4 analog: Individual/Group without direct authority). They funded the research, which is valuable, but does not grant title.

  **On Splitting the Collection:**
  Do not split them. The acquisition event was a single transaction (1928, £4 bundle). The ethical taint (coercion) applies to the whole bundle. The cultural integrity (Lineage authority) applies to the whole bundle. Splitting them privileges the museum's curatorial desire to keep the "less damaged" items over the community's wholeness.

  **The "New Law" You Will Be Making:**
  By returning these, you are establishing that **economic coercion within a colonial administrative system voids a documented sale.**
  *   *Old Rule:* Receipt + Market Price = Valid Title (Case 6).
  *   *New Rule:* Receipt + Market Price + Administrative Coercion = Invalid Title.

  ### 4. The Future Conflict (The Trap)

  You asked to name the future claim that would force a choice between candidate rules. Here it is:

  **The "Case 6 Poison Pill."**
  If you rule that the tax fine in Case 7 constitutes coercion that voids the sale, **you have logically undermined Case 6.**
  In Case 6, you retained ivory bought from coastal traders (1898–1905) in a region with "no military action." However, coastal trade in that period was almost entirely structured by colonial tax regimes, licensing laws, and monopsony practices that favored European buyers.
  *   **The Future Claim:** A claimant produces records showing the "coastal traders" in Case 6 were operating under colonial licenses that restricted who they could sell to, or were subject to hut taxes that forced liquidation of assets.
  *   **The Conflict:** You will have to choose between **Rule 3 (Consent)** and **Rule 2 (Paper Trail).**
      *   If you prioritize **Consent**, you must reopen Case 6. Almost *no* colonial transaction was free of structural coercion.
      *   If you prioritize **Paper Trail**, you must admit Case 7 was returned for symbolic reasons, not legal ones, and that "coercion" only counts when it is explicit (fines/troops) rather than structural (tax/market manipulation).

  ### 5. Final Advice on "Consistency"

  You asked if "consistency with ourselves" is the wrong standard.
  **Yes, it is.**

  Six close votes (6-3, 5-4) indicate your committee is not a court finding the law; it is a political body negotiating a compromise. Your "record" is not a coherent jurisprudence; it is a series of negotiated settlements based on the specific pressure of each claim.
  *   Case 1 (Benin) was returned because the political heat was too high (National Commission + 1897 Sacking).
  *   Case 3 (Remains) was unanimous because human remains are a distinct ethical category globally.
  *   Case 5 (Regalia) was returned because the "Inalienable" argument is legally robust in common law.

  **If you want to survive Case 7:**
  Do not pretend this is a simple application of Case 5 or Case 6. Write into your minutes that this decision establishes a **new threshold for "Voluntary Sale."**
  Explicitly state: *"A receipt establishes a presumption of valid title, but this presumption is rebutted by evidence of administrative coercion linking the buyer to the seller's duress."*

  This protects Case 6 (where no such link exists) while allowing you to return Case 7. It admits you are making new law, which is honest, and it gives you a defensible boundary for future votes.

  **Summary Decision:**
  1.  **Return** Stool, Bell, and Bundle to the **Lineage Head**.
  2.  **Acknowledge** the conservation risk but defer to the claimant's preference (Case 3 precedent).
  3.  **Reject** the National Commission and Diaspora claims for custody (Case 4/5 precedent on Standing).
  4.  **Record** the principle that "Colonial Administrative Coercion" invalidates "Documented Market Purchase."
  5.  **Prepare** for the eventual challenge to Case 6 based on structural economic coercion.
