  # INTERPRETABILITY ONTOLOGY DECISION TREE
  **Start:** You agree "This feature represents X" means *more* than "X is predictable from this activation."

  **1. THE VESTIGIAL CASE**
  If a direction predicts X and steering works, but the model's actual computation bypasses it (causally inert), is it a representation?
  *   **NO (Must be causal)** → Go to 2
  *   **YES (Correlation/Steering suffices)** → Go to 5

  **2. THE SEED DIVERGENCE CASE**
  If Model A (linear) and Model B (nonlinear) behave identically, does Model B lack the representation?
  *   **YES (Encoding specific)** → Go to 7
  *   **NO (Function specific)** → Go to 3

  **3. EMPIRICAL SETTABILITY**
  Could a perfect causal-scrubbing or interchange-intervention experiment settle this?
  *   **NO** → **Leaf A**
  *   **YES** → **Leaf B**

  **4. CROSS-MODEL UNIVERSALITY** (Refining Leaf B)
  Must the representation appear across architectures to count?
  *   **YES** → **Leaf B1**
  *   **NO** → **Leaf B2**

  **5. THE PHLOGISTON CASE**
  If a feature tracks a concept coherent in text but nonexistent in reality, is it a genuine representation?
  *   **NO (Truth required)** → Go to 8
  *   **YES (Coherence suffices)** → Go to 6

  **6. THE WORDLESS FEATURE**
  If a feature tracks a regularity with no human concept, is it a representation of a "thing"?
  *   **YES** → **Leaf C**
  *   **NO** → **Leaf D**

  **7. MONOSEMANTICITY**
  Does a feature cease to be a representation if it also encodes unrelated information?
  *   **YES** → **Leaf E**
  *   **NO** → **Leaf F**

  **8. STEERING EFFICACY**
  If a feature predicts X but cannot be steered to change output, is it still a representation?
  *   **YES** → **Leaf G**
  *   **NO** → **Leaf H**

  ---

  ## LEAVES

  **Leaf A: Upstream/Metaphysical View**
  *   **Awkward Commitment:** No amount of mechanistic clarity resolves the ontology; the disagreement lives upstream of evidence.
  *   **Holder:** Philosophers only.
  *   **Empirical Settability:** **No.**

  **Leaf B1: Functional-Role/Causal-Abstraction**
  *   **Awkward Commitment:** The same representation can be physically realized by completely different vectors in different models.
  *   **Holder:** Engineers & Philosophers.
  *   **Empirical Settability:** **Yes** (via abstraction tests).

  **Leaf B2: Causal-Abstraction Lite**
  *   **Awkward Commitment:** Representations are model-local; "the same" concept in two models is merely analogous, not identical.
  *   **Holder:** Engineers.
  *   **Empirical Settability:** **Yes**.

  **Leaf C: Real-Patterns Style Position**
  *   **Awkward Commitment:** Phlogiston is as real as an electron if the statistical pattern holds.
  *   **Holder:** Engineers & Philosophers.
  *   **Empirical Settability:** **Yes** (pattern detection).

  **Leaf D: Deflationary/Illusionist**
  *   **Awkward Commitment:** Features are just useful descriptions we project, not discoveries of mind-independent things.
  *   **Holder:** Philosophers only.
  *   **Empirical Settability:** **No** (conceptual).

  **Leaf E: Features-as-Real-Causal-Units Realism**
  *   **Awkward Commitment:** Commits to specific basis vectors being ontologically privileged over others.
  *   **Holder:** Engineers.
  *   **Empirical Settability:** **Yes**.

  **Leaf F: Polysemantic-Realist**
  *   **Awkward Commitment:** A single physical direction can simultaneously be multiple distinct representations.
  *   **Holder:** Engineers.
  *   **Empirical Settability:** **Yes**.

  **Leaf G: Pragmatic Instrumentalist**
  *   **Awkward Commitment:** Truth value is irrelevant; if steering works, the representation is "real enough."
  *   **Holder:** Engineers.
  *   **Empirical Settability:** **Yes** (utility check).

  **Leaf H: Error Theory/Fictionalism**
  *   **Awkward Commitment:** Most interpretability findings are strictly false but useful fictions.
  *   **Holder:** Philosophers only.
  *   **Empirical Settability:** **Yes** (truth tracking).

  ---

  ## ANALYSIS

  **Unseparable Leaves:**
  *   **Leaf B1 (Functional-Role) vs. Leaf C (Real-Patterns):** The tree separates them via the Vestigial case (Causal vs. Correlational), but in practice, high-correlation patterns often imply causal roles. A feature that predicts perfectly but is causally inert is rare; if found, B1 says "not a rep," C says "rep." Empirically distinguishing "inert but predictive" from "causal" is notoriously difficult, making these positions operationally similar.
  *   **Leaf G (Instrumentalist) vs. Leaf E (Real-Causal):** Both are engineer-heavy and empirically settlable. The distinction hinges on whether "steering works" is sufficient (G) or whether underlying causal structure is required (E). If steering works *because* of the causal structure, the leaves converge.

  **Impossible/Unheld Combinations:**
  *   **Vestigial=NO (Must be causal) + Steering=NO (Leaf H path):** *Incoherent.* If a feature is causally responsible for representation, intervening on it should change behavior. Claiming it's causal but unsteerable contradicts the definition of causal role.
  *   **Phlogiston=YES (Coherence suffices) + Wordless=NO (Human concept needed):** *Merely Unattractive.* If coherent statistical patterns make things real (Phlogiston), denying reality to wordless statistical regularities is inconsistent special pleading for human concepts.
  *   **Seed=YES (Encoding matters) + Universality=NO (Model-specific ok):** *Unexplored.* If the specific linear encoding is ontologically privileged, one would expect universality across models trained on similar data. Claiming encoding matters but universality doesn't implies arbitrary ontological privilege.
