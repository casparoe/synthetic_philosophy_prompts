      *   **The Flaw:** AHC is an *epistemic* test masquerading as an *ontological* test.
      *   **The Repair:** Distinguish between "Phenomenological Periods" (passed AHC, e.g., actors felt it) and "Structural Periods" (failed AHC, but real patterns).
      *   **Step 8 Rebuttal:** Revisability applies to *significance*, not *existence*. The stall after 1700 counterfactual changes the *meaning* of the prior century, not the *facts* of the prior century.
      *   **Pricing:**
