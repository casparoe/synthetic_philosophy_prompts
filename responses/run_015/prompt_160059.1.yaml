          *   Option (a) (nihilism about artifacts) is consistent but unpopular.
          *   *Advice:* Cut §4 or minimize it. Embrace (c). The strength of the argument is the *quartet/organism* link. Artifacts drag it back into standard mereology mud. Admitting the scope is limited makes the positive thesis stronger. It's not cowardly; it's precise.

      *   **(v) Meta-Question:**
