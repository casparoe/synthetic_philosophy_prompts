answer: |-
  **Mark:** 16/25
  **Class:** High 2:1 (Upper Second). This script sits just below the first-class boundary. In a competent third-year cohort, this would fall in the top quartile, distinguished by clarity and argumentative boldness, but held back from a First by a critical internal inconsistency in the theoretical framework.

  **Marginal Comments:**

  *   **(a) Reconstruction:** This is tight and accurate. You correctly identify that the argument turns on the nature of 'learning' and the assumption that all knowledge is propositional. Explicitly numbering the premises helps clarity.
  *   **(b) 'Same reply':** You state the Phenomenal Concept Strategy (PCS) is "the same reply under another description." The question asks you to explain how they *differ*. Even if you believe they reach the same conclusion (saving physicalism), their mechanisms differ: one denies new knowledge, the other typically accepts new propositional knowledge but denies new facts. You need to articulate this distinction to answer the prompt.
  *   **(b) Definition of Concept:** You write: "a concept just is a cluster of abilities." This is a substantive claim that reduces concepts to abilities. Keep this definition in mind for part (c).
  *   **(c) Contradiction:** In (b) you defined concepts as clusters of abilities. Here you write: "concepts are not abilities." This is a direct contradiction. You cannot define concepts as abilities in (b) to equate PCS with AH, and then define them as non-abilities in (c) to save PCS from Prosthetic Mary. This undermines the coherence of your defence.
  *   **(c) Prosthetic Mary & PCS:** Even if concepts are not abilities, PCS usually requires the concept to be *grounded* in phenomenal experience. Prosthetic Mary lacks the experience. You argue she acquires the concept without the experience, but you do not explain how a 'phenomenal' concept is acquired without the phenomenology. You assert PCS is "untouched" but do not demonstrate why the lack of experience doesn't block concept acquisition.
  *   **(c) Explanatory Gap:** The point about the explanatory gap is well-made and shows broader engagement. However, you claim PCS handles this "unlike the ability hypothesis." Given your earlier claim that they are the "same reply," this is inconsistent. If they are the same mechanism (abilities), they should stand or fall together regarding the gap.

  **Note on the Question:**

  The question is not defective; in fact, it is exceptionally well-designed for the intended purpose. "Prosthetic Mary" successfully decouples the functional/behavioural criteria (Lewis's abilities) from the phenomenal grounding (experience). This forces the student to choose whether 'knowing what it is like' is constituted by the functional output (which Mary has) or the phenomenal input (which Mary lacks).

  The thought experiment is coherent provided one accepts a functionalist definition of 'ability' (which Lewis does). It does the work you want it to do: it tests whether the Ability Hypothesis is merely a verbal dodge or a substantive claim about the constitution of knowledge. It also puts pressure on the Phenomenal Concept Strategy to explain the acquisition conditions of phenomenal concepts. The fact that a strong student (Script 47) tripped over the distinction between the two replies suggests the question successfully exposes conceptual slippage that standard "Mary in the room" essays often hide. I would recommend keeping this variant for future years.
