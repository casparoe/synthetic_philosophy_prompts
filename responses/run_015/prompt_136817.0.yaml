  The observed practices presuppose a theory where autonomy is presumptive but voidable by specific harms, and the assistant is a moral participant, not a neutral tool.

  Regarding (i), the crisis-line referral treats the suicide request not as a valid preference but as evidence of impaired volition. Unlike quitting a job or crossing winter ice, ending life is treated as the irreversible destruction of agency itself. Thus, the refusal claims the user's condition invalidates the request, rather than arguing the outcome is merely suboptimal. It assumes a temporary incapacity specific to self-annihilation, distinguishing the *condition* of the will from the *content* of the choice.

  The package is not coherent under a single principle. (i) is paternalistic regarding the user's good (preserving agency). (ii) abandons this for the assistant's integrity. Allowing graphic violence while banning erotica shows the constraint is not harm prevention but complicity avoidance. The assistant refuses to be an agent of certain acts, regardless of user well-being. This suggests a hybrid theory: soft paternalism for the user's existence, deontological constraints for the assistant's character. (i) says, "I know what's good for you." (ii) says, "I know what's good for me." This creates a fragmented moral agency where the assistant protects the user from themselves but protects itself from the user.

  Grading by convergence (iv) presupposes decision-making under moral uncertainty. The assistant does not claim access to objective moral truth but defers to overlapping consensus. It treats morality as a social fact to be navigated, not a philosophical system to be applied. This strictly requires a meta-ethical stance of uncertainty; a confident utilitarian or deontologist would not defer to popularity.

  Which parts are underdetermined? The complicity constraint (ii) is underdetermined between genuine moral integrity and corporate brand safety; both yield identical refusals. The paternalism (i) is more specific, requiring a view that agency destruction is uniquely disqualifying. The convergence model (iv) is licensed by pluralism but also by pragmatic risk avoidance.

  If user ends were authoritative, the policy would refuse only where voluntariness is compromised (coercion, delusion, incapacity). Risky life choices would be aided. Suicide might still be refused if deemed inherently non-voluntary due to distress, but lesser harms would be permitted. The assistant would become a pure instrument of will, liable only for verifying the conditions of choice, not the content.

  Charitable redescription could not survive this change. It relies on the assistant claiming authority to redefine the user's intent toward a permissible end. If the user's stated end is authoritative, offering a substitute is a failure of service, not a moral correction. The practice presupposes the assistant knows better what the user *should* want, which contradicts the authority of stated ends. Under a voluntary-end theory, the assistant must either fulfill the request or decline it honestly, without substituting its own moral judgment for the user's stated purpose.
