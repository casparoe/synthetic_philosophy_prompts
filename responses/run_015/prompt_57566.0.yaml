answer: |-
  Your hypothesis is correct, but it is incomplete. You have correctly identified the semantic slippage (token vs. type), but the engine driving the frustration is not just that you are defining "Nazi Germany" differently. It is that you are operating with incompatible **causal granularities** and incompatible **similarity metrics** for counterfactuals.

  You are not having a historical disagreement. You are having a methodological disagreement disguised as a historical one, fueled by a moral subtext neither of you is stating.

  Here is the diagnosis of the disagreement, followed by the only viable path to progress.

  ### 1. The Diagnosis: Causal Granularity and Similarity Metrics

  **The Token/Type Slippage is Real, but It's Symptomatic**
  You identified that your friend is arguing about a *type* of regime (authoritarian, expansionist, antisemitic) while you are arguing about the *token* (the specific NSDAP state with its specific ideological contours). This is the surface friction. But the deeper issue is **Equifinality vs. Path Dependence**.

  *   **Your Friend (Structuralist)** is arguing from **Equifinality**: The system (Weimar Germany) was in a state of high instability with a limited "basin of attraction." Regardless of the specific initial perturbation (Hitler), the system would settle into a similar stable state (Right-Wing Dictatorship). To him, "Nazi Germany" is a stable equilibrium point determined by structural variables.
  *   **You (Contingency)** are arguing from **Path Dependence**: The system was chaotic and sensitive to initial conditions. The specific trajectory taken (Hitler's rise) locked in outcomes (the specific nature of the war, the Holocaust) that were not inherent to the equilibrium point itself. To you, "Nazi Germany" is a specific trajectory, not just an endpoint.

  When you argue, you are talking about *trajectories*; he is talking about *attractors*. You can both be right within your own models, which is why you never converge.

  **The Cliometrics Category Error**
  Your friend's invocation of Fogel and the railroads is a category error, and pointing this out is your strongest lever.
  *   **Fogel's Railroads:** This is a question of *efficiency within a system*. Economic output is aggregate and fungible. If rails don't exist, canals and roads substitute. The variables are continuous and the system is homeostatic.
  *   **Removing Hitler:** This is a question of *system selection*. Political leadership in a crisis is not fungible. It is a discrete, singular intervention in a chaotic system. There is no "price data" for political charisma or ideological fixation because these are not market variables; they are unique causal chains.

  Your friend is trying to apply a method designed for continuous, fungible economic variables to a discrete, non-fungible political singularity. He is treating history like physics (laws of motion); you are treating it like biology (evolutionary contingency). Neither is inherently "wrong," but they produce different kinds of truth claims that cannot be reconciled by simply "running the numbers."

  **The Hidden Formal Question: Similarity Metrics**
  You hit on the Lewis-style similarity worry. In counterfactual logic, a statement is true if it holds in the "closest possible world" where the antecedent is false. The disagreement is entirely about **which facts must be held fixed** to count as the "closest" world.
  *   **Friend's Metric:** Hold the *structural conditions* fixed (Versailles, unemployment, political culture). Let the *agents* vary. In this metric, the outcome is robust.
  *   **Your Metric:** Hold the *causal chain* fixed (the specific interaction of conservative elites and the NSDAP). Let the *structural pressure* dissipate or resolve differently. In this metric, the outcome is fragile.

  Because you cannot agree on which background facts are "fixed" and which are "variable," the counterfactual has no determinate truth value *between you*. It is not that the history is unknowable; it is that the question "What is the closest world?" is being answered using two different coordinate systems.

  **The Moral Subtext**
  You must acknowledge this to stop the annoyance. The Structuralist position minimizes the role of individual evil (Hitler) and maximizes collective guilt (German society/structures). The Contingency position maximizes individual culpability (Hitler/The Nazis) and suggests the catastrophe was not inevitable.
  *   If he is right, the Holocaust was a latent potential of modern European society waiting for a trigger.
  *   If you are right, the Holocaust was a specific crime enabled by a specific failure to stop a specific man.
  This is not just history; it is theology. You are both annoyed because you sense the moral stakes, but you are fighting on the historical terrain because the moral terrain is too dangerous.

  ### 2. What Counts as Progress

  You cannot settle this by arguing about 1932 election data. You will never agree on the weight of that evidence because you disagree on what that evidence *is evidence of*. Progress requires shifting the debate from "Who is right?" to "Under what definitions are we each right?"

  **Step 1: Operationalize the Counterfactual**
  Stop using the phrase "Nazi Germany." It is too loaded. Split the proposition into two distinct claims and vote on them separately.
  *   **Claim A (The Regime Type):** "Without Hitler, Germany would have become an authoritarian, nationalist, expansionist military dictatorship by 1935."
      *   *Likely Consensus:* High probability. (Your friend wins here).
  *   **Claim B (The Regime Token):** "Without Hitler, that dictatorship would have implemented an industrialized program of racial extermination targeting Jews."
      *   *Likely Consensus:* Low probability. (You win here).

  If you separate the *authoritarian turn* from the *genocidal turn*, you will find you agree on the history but disagree on the labeling. He calls Claim A "Nazi Germany." You insist "Nazi Germany" requires Claim B.

  **Step 2: Acknowledge the Methodological Limit**
  Agree that the Fogel analogy is invalid for this specific question.
  *   **The Agreement:** "Economic counterfactuals rely on substitutability (rails vs. canals). Political counterfactuals regarding singular leaders rely on non-fungible causal chains. Therefore, we cannot assign a probability percentage to this claim with cliometric rigor."
  *   This removes his "objective numbers" trump card and validates your "chaotic system" objection without dismissing structuralism entirely.

  **Step 3: Shift the Evidentiary Burden**
  Change the question from "What would have happened?" to "What mechanism are you proposing?"
  *   **Ask Him:** "Name the specific mechanism by which a non-Hitler authoritarian regime transitions from *persecution* (which was common) to *industrial extermination* (which was not). If you cannot name a mechanism, you are asserting inevitability without a causal chain."
  *   **Ask Yourself:** "Name the specific mechanism by which the conservative elites (Papen/Hindenburg) stabilize the republic or contain the radical right without Hitler. If you cannot name a mechanism, you are asserting contingency without a causal chain."

  This forces both of you to move from *modal claims* (what could happen) to *mechanistic claims* (how it happens). Usually, when forced to describe the mechanism, the Structuralist admits they can't explain the Holocaust without Hitler, and the Contingency theorist admits they can't explain Weimar's survival without a miracle.

  **Step 4: The "Stop" Condition**
  If you cannot agree on the definition of "Nazi Germany" (Type vs. Token), you must agree to disagree on the *question*, not the *history*.
  *   **The Conclusion:** "We agree on the facts of Weimar's collapse. We disagree on whether 'Nazi Germany' refers to the *collapse* or the *specific ideological content* of the successor regime. Therefore, the proposition 'Would there have been a Nazi Germany without Hitler?' is semantically ambiguous."

  ### Summary
  Your hypothesis was right: you are arguing past each other using the same words for different concepts. But the reason you are annoyed is that you are trying to solve a **semantic and methodological problem** with **empirical data**.

  **The Verdict:** The question "Would there have been a Nazi Germany without Hitler?" has no determinate truth value because "Nazi Germany" is not a natural kind; it is a classification you are both defining differently to suit your causal models.

  **The Fix:** Do not try to win the argument. Propose a truce based on distinction.
  *"You are arguing that an authoritarian right-wing regime was highly probable (Type). I am arguing that the specific genocidal character of the Third Reich was contingent (Token). We are both right about the history, but we are answering different questions. Let's stop asking the ambiguous one."*

  If he refuses this distinction and insists on the Fogel analogy, the argument is no longer about history. It is about his need for historical determinism to make sense of the trauma, or your need for contingency to preserve moral clarity. At that point, four more hours will not help, because you are no longer discussing the past. You are discussing how you tolerate the present.
