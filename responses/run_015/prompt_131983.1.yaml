      *   *Alternative Diagnosis:* The definition of Supererogation in (1) + (4). (4) claims supererogatory acts are "morally better." If we distinguish "morally better" (impersonal value) from "what one is required to do" (agent-relative permission), the contradiction dissolves. This points to restricting (2).

      *   *Decision:* The fault lies in the inference from (2) to (3) via the univocal use of "ought." Specifically, Premise (2) assumes *Maximizing Consequentialism* (or similar), while Premise (1) assumes a *Deontological/Common-Sense* structure. They are incompatible frameworks forced into one syllogism. The specific break is usually located at (2) or the link between (2) and (3). I will identify the equivocation in "Ought" (Evaluative vs. Deontic) as the primary logical fault, which manifests as a rejection of (2) in its strong form.

