answer: |-
  ### Internal Brainstorming: Conceptual Dependencies

  Before structuring the lesson, I need to map the logical dependencies. If I introduce the *distinction* (Legitimating vs. Allocative) before establishing that marriage is an *institution*, students will treat the functions as optional add-ons rather than structural features. If I introduce the *same-sex marriage case* before defining the functions, the culture-war noise will drown out the philosophical analysis. Therefore, the sequence must be:
  1.  **Institutional Ontology:** Establish marriage as a public institution, not just a private feeling. (Prerequisite for functions).
  2.  **Functional Distinction:** Define Legitimating (status) vs. Allocative (goods). (Prerequisite for analysis).
  3.  **Historical Variability:** Show that while functions persist, their specific content changes. (Preempts relativism).
  4.  **Case Application:** Apply the distinction to the carrying example. (Tests the concepts).
  5.  **Normative Testing:** Ask if gender/contract changes the functions. (The core debate).

  I must also decide on the carrying example. The **Modern Same-Sex Couple** is the necessary choice. Why? The **Arranged Historical Alliance** fails as a pedagogical anchor for *this specific lesson* because it allows students to silo the "allocative function" (property, alliances) as an archaic feature of *past* marriage, reinforcing the misconception that *modern* marriage is purely about love/recognition. To show that the allocative function (taxes, immigration, insurance) is a *live* feature of contemporary marriage, the example must be contemporary. The Same-Sex case forces students to see that even "love-based" marriage is inextricably linked to state-distributed goods.

  ***

  ### Lesson Plan: The Functions of Marriage and the Same-Sex Debate
  **Time:** 50 Minutes
  **Target:** First-Year Undergraduates
  **Goal:** Distinguish marriage's legitimating and allocative functions to analyze same-sex marriage beyond "love vs. procreation."

  #### I. Explanatory Sequence & Conceptual Arc (0–35 Minutes)

  **1. The Institutional Frame (0–10 mins)**
  *   **Move:** Begin by challenging the "Private Feeling" model. Ask: "If two people love each other and live together, are they married?" (Students will say "No, not without a license/ceremony.").
  *   **Concept:** Establish marriage as a **Social Institution**. It requires a third party (state/community) to transform a private bond into a public status.
  *   **Preempting Misconception #1:** *"Marriage is just a state contract."*
      *   **Moment:** Immediately after establishing the "third party" requirement.
      *   **Intervention:** Clarify that a contract is merely an agreement between parties. Marriage involves *status*. You cannot contractually agree to be "married" without the state's recognition. This sets up the **Legitimating Function**.

  **2. Defining the Two Functions (10–20 mins)**
  *   **Move:** Introduce the core distinction using the **Modern Same-Sex Couple Seeking Spousal Immigration** as the running example.
  *   **Concept:**
      *   **Legitimating Function:** The transformation of a private relationship into a publicly recognized *status* (honor, social intelligibility, "next of kin" standing).
      *   **Allocative Function:** The distribution of specific *goods* attached to that status (tax breaks, visa rights, hospital visitation, inheritance).
  *   **Application:** In the immigration case, the *Allocative* good is the visa/citizenship path. The *Legitimating* good is the state saying, "This bond counts as a family."
  *   **Preempting Misconception #2:** *"Public recognition is merely symbolic and therefore dispensable."*
      *   **Moment:** While defining the Legitimating Function.
      *   **Intervention:** Point out that in the immigration case, the "symbolic" recognition is the *key* that unlocks the material benefit. Without the public status (Legitimation), the material good (Allocation) is inaccessible. Symbolic status has material teeth.

  **3. Historical Variability vs. Functional Stability (20–30 mins)**
  *   **Move:** Briefly acknowledge that *what* is allocated changes (land vs. tax breaks) and *who* is legitimated changes (dynasties vs. individuals), but the *functions* remain.
  *   **Concept:** Distinguish between the *purpose* (functions) and the *content* (specific laws/customs).
  *   **Preempting Misconception #3:** *"If purpose is historically variable then nothing is essential."*
      *   **Moment:** During the historical overview.
      *   **Intervention:** Explain that variability in *content* does not mean the *structure* is arbitrary. A "cup" can be made of clay, glass, or plastic (variable content), but its function (holding liquid) remains stable. Similarly, marriage can allocate land or visas, but it must allocate *something* to be an institution.

  **4. Testing the Distinction: Gender and Contract (30–35 mins)**
  *   **Move:** Apply the distinction to the core debate questions.
  *   **Question A:** Does the **Legitimating Function** require gender complementarity? (Does the public status rely on the symbolic union of "male and female"?)
  *   **Question B:** Can the **Allocative Function** survive a purely contractual reinterpretation? (Could we just give visas to any two cohabiting people without calling it "marriage"?)
  *   **Goal:** Show that opponents of same-sex marriage often argue from Legitimation (status symbolism), while proponents often argue from Allocation (equal access to goods). The distinction reveals why they talk past each other.

  #### II. Carrying Example Justification (Pedagogical Note)

  **Selected Example:** **Modern Same-Sex Couple Seeking Spousal Immigration.**
  **Rejected Alternative:** Arranged Historical Alliance-Marriage.

  **Why the Alternative Fails:**
  The Arranged Alliance is a clean philosophical specimen, but it fails as a pedagogical anchor for *this* section because it encourages the **"Historical Relic" Misconception**. If you use arranged marriage to illustrate the Allocative Function (land, peace treaties), first-year students will compartmentalize that function as a feature of *oppressive, past* marriages. They will conclude: "Sure, marriage *used* to be about money and status, but *now* it's about love." This undermines the entire lesson, which aims to show that modern marriage *still* relies on state allocation (taxes, immigration). The Modern Same-Sex case forces students to confront the Allocative Function as a *current, live* reality, not a historical artifact.

  #### III. Check-for-Understanding (CFU) Question (35–40 Minutes)

  **Question:**
  "Imagine a state creates a 'Domestic Partnership' status for same-sex couples. This status grants **all** the federal tax, immigration, and inheritance benefits of marriage (Allocative Function), but the state explicitly prohibits these couples from using the word 'Marriage' and refuses to perform ceremonial unions (Legitimating Function withheld).
  Based on our distinction, has the state achieved equality?"

  **Desired Answer Logic:**
  *   **No.** The Allocative Function is satisfied (goods are distributed), but the Legitimating Function is withheld (public status/social meaning is denied).
  *   **Why this works:** It forces students to separate the two functions. A student who has merely adopted a partisan stance will say "Yes, they got the benefits" or "No, it's discriminatory." A student who grasps the *conceptual distinction* will identify exactly *which* function is missing.

  #### IV. Scope Limitations (40–50 Minutes)

  **What to Leave Out:**
  1.  **Sacramental/Religious Accounts:**
      *   **Why:** Religious marriage operates under a different authority (God/Church) with different goods (salvation/grace). Mixing these confuses the *civil institutional* analysis. Acknowledge this exists but bracket it to keep the secular institutional mechanics clear.
  2.  **Queer-Theoretic Critiques of State Recognition:**
      *   **Why:** Arguments that the state *should not* be in the business of licensing intimacy at all (e.g., "abolish marriage") are valid but advanced. Introducing them now collapses the distinction we are building. If marriage should be abolished, analyzing its functions is moot. Acknowledge this as a "next step" critique, but maintain the focus on how the institution *currently* functions.

  **Closing Pedagogical Note:**
  End by reminding students that understanding the *mechanics* of the institution (what it does) is a prerequisite for debating the *ethics* of the institution (what it should do). This protects the section from devolving into a culture war and keeps it grounded in philosophical institutionalism.
