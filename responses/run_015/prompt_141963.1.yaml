answer: |-
  (a) **There is no single valid number.**

  Your proposal contains a fundamental contradiction: a *flat fee* (a fixed sum) cannot represent a single *fraction of revenue* across firms of different sizes. If you charge £10,000 to everyone, that represents 10% of a £100,000 firm's revenue but only 0.1% of a £10 million firm's revenue.

  Under the Handicap Principle, a signal is trustworthy only if the *marginal cost* of producing it is lower for high-quality signallers than for low-quality ones. A flat fee fails this test. It creates a **regressive barrier**: it disproportionately excludes small, honest firms (for whom the fee is a large fraction of revenue) while remaining trivial for large, potentially dishonest firms (for whom the fee is a negligible operating cost). This leads to *adverse selection*, where the mark signals 'cash reserves' rather than 'supply chain integrity'.

  If you must set a fee, it should not be a flat sum nor a revenue fraction, but rather **100% of the actual audit cost**, tiered by firm complexity. However, if you require a benchmark for 'significance' to ensure the signal is not ignored, industry standards for certification costs typically hover around **1%** of annual revenue for SMEs. Anything significantly lower is ignored as noise; anything significantly higher risks excluding virtuous smaller members.

  (b) **0%.**

  Zero share of the fee should be spent on a deliberately unproductive sacrifice.

  Your trustee's interpretation of the Handicap Principle is biologically accurate but economically flawed in this context. A peacock's tail is a 'waste' of energy, but it signals *genetic fitness* because only a healthy bird can survive the burden. In commerce, burning money signals *inefficiency* or *poor governance*, not ethical supply chains.

  Customers purchasing certified goods are paying for a specific utility: assurance of ethical labour and environmental standards. Money spent on a 'visible sacrifice' (e.g. shredding banknotes or funding a useless monument) does not improve the supply chain, nor does it verify it. It merely reduces the capital available for actual compliance. To be credible, the cost must be **instrumental**: every pound spent must contribute to the verification or improvement of the standard. The 'handicap' should be the cost of *remediation* (fixing the supply chain), which is naturally higher for non-compliant firms, not an artificial fee waste.

  (c) **Recommended Changes to the Scheme**

  To ensure the cost does the work you expect of it, I recommend three structural changes:

  1.  **Replace the Flat Fee with a Tiered Structure:**
      Charge based on the *time required to audit*, which correlates with firm size and supply chain complexity. This ensures the cost burden is proportional to the risk profile. A large multinational requires more audit days than a local artisan; charging them the same flat fee subsidises the former and penalises the latter.

  2.  **Make the 'Handicap' the Compliance Cost, Not the Fee:**
      The true signal of quality is the effort required to *meet* the standard, not the fee to apply. Publish the standard clearly. High-quality firms will pass with minimal investment; low-quality firms will face prohibitive costs to upgrade their supply chains. This natural differential cost creates the honest signal you desire without needing artificial fee barriers.

  3.  **Invest in Transparency, Not Sacrifice:**
      Instead of wasting a portion of the fee, spend it on **public verification**. Allow customers to scan a QR code on the product to see the audit summary (redacted for commercial sensitivity). A signal is only as strong as its visibility. A costly audit that results in a private report is decorative; a modest audit that results in public, verifiable data is credible.

  In summary, do not burn money to prove you are rich; spend money to prove you are ethical. The credibility of the mark will derive from the rigour of the standard and the transparency of the result, not from the regressivity of the fee or the destructiveness of the spending.
