answer: |-
  Question Three

  Consider the Helios lineage, a synthetic biology project involving self-replicating protocells. At the initial stage, researchers assemble a membrane protein, P, which has no measurable effect on survival or reproduction. At stage one, the cells are moved into a chemostat containing a specific toxin. P happens to pump this toxin out, conferring a four percent fitness advantage to bearers. At stage two, five hundred generations later, P is universal in the population, clearly retained due to this advantage. At stage three, the toxin is removed from the environment. P continues to be expressed but no longer pumps toxins; instead, it buffers internal pH by a small amount, making no measurable difference to survival or reproduction. Additionally, consider a second synthetic lineage, Helios-B, where a variant of P buffers pH similarly to stage three Helios, but this effect was never selected for, nor did it confer any advantage during the lineage's history. Using the etiological account and the causal-role account of function, analyze the functional status of protein P at stage two, stage three, and in Helios-B. Is there a single fact of the matter regarding what P is for in each instance, or does the correct attribution depend on the explanatory context? Defend your position.

  Model Answer

  A strong analysis begins by applying the two accounts directly to the Helios case without conflating them. At stage two, the etiological account identifies the function of P as toxin pumping because this effect explains why P was selected and retained in the population. The causal-role account agrees that P has the capacity to pump toxins but defines the function simply as whatever contribution P makes to the containing system's capacities at that time. The divergence becomes sharp at stage three and in Helios-B. For the etiological theorist, stage three presents a dilemma: either P has no function because the selected effect is gone, or it retains the function of pumping despite no longer doing so, because its presence is still explained by past selection. In Helios-B, the etiological account must say P has no function at all, as there is no selection history for pH buffering. The causal-role account, conversely, attributes the function of pH buffering to P in both stage three and Helios-B, because that is the current contribution to the system's capacities, regardless of history.

  Merely mapping these distinctions, however, only secures a passing grade. The deeper philosophical work lies in evaluating whether these conflicting verdicts represent a problem to be solved or a pluralism to be accepted. A superficial response assumes one account must be false because they disagree. A stronger response recognizes that the accounts are answering different questions. The etiological account is primarily concerned with explaining why a trait is there rather than some alternative. It underwrites historical explanations of presence. The causal-role account is concerned with mechanistic explanation, detailing how a system works here and now. If a researcher asks why the protocell has protein P, the etiological answer is appropriate. If they ask how the protocell maintains homeostasis today, the causal-role answer is appropriate. Thus, there is no single fact of the matter independent of the explanatory interest driving the inquiry.

  Furthermore, even if we privilege the etiological account, there is an indeterminacy problem that prevents it from being a perfect arbiter. Selection acts on whole organisms, not isolated traits, and fitness effects are matters of degree. At stage two, P conferred a four percent advantage, but this advantage was correlated with many other effects. Did selection choose P for pumping toxins specifically, or for general membrane stability that coincided with pumping? The historical record does not necessarily distinguish between the specific effect and the correlated byproducts that traveled with it. This suggests that even the etiological function is not a hard fact waiting to be discovered, but depends on how we individuate the selected effect. Consequently, the best approach is pragmatic pluralism. We should not ask which account is true, but which account serves the specific biological or philosophical explanation we are attempting to construct. In the Helios case, P has different functions depending on whether we are investigating its evolutionary history or its current physiological contribution, and acknowledging this dissolves the conflict rather than forcing a false choice between the two frameworks.

  Marking Scheme

  The first five marks are awarded for the accurate application of both accounts to the specific stages of the Helios case. To secure full marks here, the student must correctly identify that the etiological account ties function to the history of selection at stage two and denies function in Helios-B, while the causal-role account ties function to current contribution at stage three and in Helios-B. Students typically lose marks here by swapping the definitions, claiming the causal-role account relies on history, or by failing to address all three scenarios presented in the prompt.

  The next five marks are allocated for clearly articulating the core conflict between the two accounts without resolving it prematurely. The student must show that the accounts yield contradictory verdicts in stage three and Helios-B. Common errors include treating the accounts as compatible complements that always agree, or suggesting that one account is simply a refined version of the other rather than a fundamentally different criterion for attribution.

  The third criterion, worth five marks, requires the student to identify that the two accounts serve different explanatory purposes. Full credit is given for recognizing that etiological functions explain presence or history, while causal-role functions explain current capacity or mechanism. Students often fail this section by insisting one account is objectively true and the other false, missing the insight that the divergence stems from different explanatory goals rather than factual error.

  The final five marks depend on engaging with the indeterminacy of selection or defending a pragmatic pluralism. The student should note that even within the etiological account, selecting the specific function is tricky because selection acts on whole organisms and effects are correlated. Alternatively, they may argue that the correct attribution depends on the context of inquiry. Marks are deducted if the student concludes with a shrug or asserts there is a single hidden fact of the matter that science will eventually reveal, ignoring the conceptual nature of the function debate.
