      *Self-Correction on (3):* The user says "correct explanation... is not that the actor is pursuing its own long-run interest." In Phil Bio, this is the "Sober/Wilson" multilevel selection vs. "Dawkins/Grafen" gene selection debate. If the user is arguing for Group Selection or strong Proximate Altruism, they need to be careful. Standard Reciprocal Altruism (Trivers) *is* long-run self-interest at the gene level. I need to flag this heavily.

      *Self-Correction on (1) & (5):* If the user accepts (5), they effectively reject the strict CDT interpretation of (1). They are essentially a "Logical Decision Theorist" who restricts LDT to "near-copies." This is a coherent position (Parfit's "Reasons and Persons" split), but needs articulation.

