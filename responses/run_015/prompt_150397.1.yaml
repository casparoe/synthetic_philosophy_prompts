      *Wait, nuance on (2):* The "Gang of Four" reputation model resolves the finite PD paradox by introducing incomplete information. The user says "treat the unraveling argument as telling us that something in the standard setup is wrong." This aligns with the Gang of Four (the setup assumption of *common knowledge of rationality* is wrong). I should validate this but ask for precision.

