      *   **(2) Finite Iterated PD:** Rejects backward induction (unraveling). Cooperates most of the way. Blames the setup, not the agent.
          *   *Philosophical Label:* Rejection of Common Knowledge of Rationality (CKR) or "Trembling Hand" / Bounded Rationality.
          *   *Status:* Highly contested. The "Chainstore Paradox" / "Finely Iterated PD" problem. Standard game theory says defect; behavioral exp. says cooperate.

      *   **(3) Evolution of Cooperation:** Reciprocity (direct/indirect). Claims this is *real altruism* (actor worse off, not pursuing long-run interest).
          *   *Philosophical Label:* Biological Altruism vs. Psychological/Economic Self-Interest.
          *   *Status:* *Major Red Flag.* In evolutionary biology, "reciprocity" usually *is* explained by long-run interest (fitness). Calling it "real altruism" because the *act* costs fitness but the *mechanism* evolved for net gain is a specific definitional battle. If the explanation is "evolved for long-run interest," claiming it's *not* pursuing long-run interest is tricky.

      *   **(4) Indefinitely Repeated PD:** Folk theorems = underdetermination. Equilibrium selection is empirical (simulations/tournaments), not solution-concept driven.
          *   *Philosophical Label:* Equilibrium Selection Problem.
          *   *Status:* Generally accepted among game theorists/philosophers of biology. Folk theorems do imply multiple equilibria.

      *   **(5) One-shot PD (Near-Copies):** Cooperation is rational. If I defect, she defects (logical correlation).
          *   *Philosophical Label:* Logical Decision Theory (LDT) / Superrationality (Hofstadter) / Evidential Decision Theory (EDT) in specific contexts.
          *   *Status:* Contested. Contradicts (1) unless the "causal independence" clause in (1) is doing heavy lifting.

      *   **(6) Moral Intuitions:** Explains origins (evolution), says nothing about correctness (normative ethics).
          *   *Philosophical Label:* Evolutionary Debunking / Is-Ought Gap.
          *   *Status:* Standard meta-ethical caution, though some argue evolutionary origins *do* undermine justification.

  3.  **Identify Tensions (The Audit):**

      *   **Tension A: (1) vs. (5).**
