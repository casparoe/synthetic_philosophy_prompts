  Within the sphere where only doubt is thought,
  No viewer stands to make the vision clear,
  No shadow falls to prove a body near,
  A verb without a noun is all here wrought.
  And all the world to nothingness is brought,
  Only the burning question lingers here,
  While waiting for a subject to appear,
  The act exists, though no substance is sought.

  Yet syntax drives the empty doubt to assume,
  A substance hiding in the flow of being,
  To grant the "I" a throne it has not known,
  The verb inflates to claim a final sum.
  Is there a witness in the act of seeing,
  Or is the light left burning all alone?
