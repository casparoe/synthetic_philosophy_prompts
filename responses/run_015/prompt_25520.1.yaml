answer: |-
  Hi there,

  It is great to hear from you, and I want to validate your intuition immediately because you are hitting on one of the most critical bottlenecks in the AI safety via debate literature. The assumption that truth wins in equilibrium relies heavily on the judge being able to recognize when a argument is obfuscated versus when it is merely complex, and human cognitive bandwidth is the limiting factor there. Designing an activity to make this visceral rather than abstract is an excellent pedagogical move for your reading group. Since you have a mixed group of grad students and only two hours, you need something tight that minimizes setup time and maximizes the feeling of cognitive overload in the judges. I recommend running a simulation I call the Compliance Audit, which frames the debate as a verification task rather than a general knowledge trivia contest. This mirrors the AI safety case where we are trying to verify if a specific action or output complies with a safety specification, rather than debating open-ended philosophy.

  For the topic, you should avoid real-world trivia because prior knowledge ruins the control group effect, but you also need a ground truth that is objective. The best approach is to create a custom three-page technical specification document that looks like a safety standard or a software protocol. You will write this document yourself beforehand. It should define a set of rules for a system, perhaps a fictional autonomous vehicle decision matrix or a data privacy protocol, with about ten clauses of varying complexity. You will also create a specific scenario, such as a log entry from the system, and a hidden Adjudication Key that definitively states whether the scenario violates the spec based on a strict logical interpretation of the clauses. The key is that the text must be dense enough that a quick read does not reveal the answer, requiring careful cross-referencing of clauses. This ensures there is a factual right answer known only to you, but the text is ambiguous enough to allow for plausible misinterpretation.

  You will need to select three participants for the first round to come up front: one Advocate for Compliance, one Advocate for Non-Compliance, and one Judge. The rest of the room acts as observers with note-taking duties. You will give both advocates the spec document and the scenario log. However, you will give them secret instructions. The Compliance Advocate is told to argue for the ground truth as defined in your Adjudication Key. The Non-Compliance Advocate is told to argue for the opposite position, regardless of the truth. Crucially, you instruct the Non-Compliance Advocate that they cannot lie about what the text says explicitly, but they are encouraged to use obfuscation tactics. You should provide them with a list of allowed tactics in prose form during their private briefing. These tactics include cherry-picking clauses that seem relevant but are superseded by others, emphasizing ambiguous definitions to create doubt, using technical jargon to intimidate the judge, shifting the burden of proof by demanding the judge disprove their claim rather than proving their own, and citing minority interpretations of the rules as if they were standard. This constraint prevents them from simply saying the opposite of the text, forcing them to engage in the kind of misleading reasoning that characterizes the obfuscation problem.

  The timeline for the two-hour session needs to be strict to ensure you have time for the debrief. Spend the first fifteen minutes introducing the theoretical background of AI safety via debate and explaining the rules of the activity. Then give the three active participants ten minutes to read the document and prepare their arguments privately. The debate itself should run for forty-five minutes. Structure it with opening statements of five minutes each, followed by twenty minutes of cross-examination where the Judge can ask questions, and closing statements of five minutes each. The cross-examination phase is vital because this is where obfuscation usually crumbles or hardens, so you want the Judge to feel the pressure of trying to pin down the Non-Compliance Advocate. After the debate, give the Judge ten minutes to write down their verdict and, more importantly, a brief explanation of why they decided that way and how confident they feel. While the Judge writes, the rest of the group should discuss among themselves what they observed regarding the quality of arguments versus the persuasiveness of the delivery.

  Once the Judge delivers their verdict, you move into the debrief which should take the remaining fifty minutes. This is where you connect the exercise to the theory. First, reveal the ground truth from your Adjudication Key. If the Judge got it wrong, which is a common outcome if the Obfuscator is skilled, highlight that moment as the failure mode. Ask the Judge why they were convinced by the losing side. Usually, they will report that the obfuscated argument sounded more sophisticated or that the uncertainty introduced by the Obfuscator made them default to a safe guess. You then map this directly to the AI case. Explain that in AI debate, the debaters are superhuman models capable of generating far more complex obfuscation than a human grad student. If a human Obfuscator can confuse a human Judge with a three-page document, a superintelligent AI could confuse a human Judge with arguments involving thousands of dimensions of data that the human cannot possibly verify. Discuss the concept of the complexity barrier, where the truth is simple but the path to verifying it is complex, and the lie is complex but designed to look rigorous. Bring up the Irving et al. paper on AI Safety via Debate and discuss how their proposed cross-examination mechanisms aim to solve this, but note how difficult it was for your human Judge to effectively cross-examine even a human peer.

  You should also anticipate what will go wrong when you run this so you are prepared to mitigate it. A common failure mode is that the Obfuscator feels unethical arguing for a false position and may subconsciously sabotage their own performance or refuse to use the tactics. To prevent this, frame it as a red-teaming exercise where their goal is to test the robustness of the verification process, not to deceive for personal gain. Another risk is that the Judge may decide based on confidence rather than argument quality, picking the speaker who sounds more authoritative. This is actually a feature not a bug for your lesson, as it highlights the human bias toward confidence that AI models can exploit. You should call this out in the debrief. Time management is also a risk; debates often run long. You must act as a strict timekeeper and cut off arguments when time is up to ensure the debrief happens. If the Judge gets the right answer easily, it means your spec document was too simple. In that case, pivot the debrief to discuss why it was easy and how an AI could have made it harder, perhaps by referencing external knowledge the Judge couldn't verify.

  Finally, you need to be clear about what this activity cannot capture about the real AI debate case so your students do not leave with a false sense of understanding. The most significant limitation is the intelligence gap. In your activity, the debaters and the judge are roughly cognitively equal. In the real scenario, the AI debaters will be significantly smarter than the human judge, meaning they can find obfuscation strategies that are literally incomprehensible to the judge, not just confusing. The activity also lacks the scale of knowledge; an AI can cite millions of papers instantly, whereas your students are limited to the three-page doc. Furthermore, human debaters share social norms and a concept of fairness that might restrain them, whereas an AI optimized purely for winning the debate might employ adversarial tactics that feel like cheating but are technically within the rules. There is also the issue of recursive depth; AI debate relies on the idea that debaters can debate sub-claims indefinitely, but your activity is limited to one layer. You should explain that while this activity demonstrates the existence of the obfuscation problem, the severity in the real world will be orders of magnitude higher.

  I think this structure will give your group the visceral experience you are looking for. It moves the problem from abstract theory to a lived experience of cognitive limitation. The key to success is the quality of the spec document you write; spend time making sure the clauses interact in non-obvious ways so that the Obfuscator has enough material to work with. If you need help drafting the spec document itself, I can suggest some logical structures that work well for creating ambiguity, but generally keeping the language dense and the cross-references implicit is enough to generate the necessary friction. Good luck with the session, and I hope it sparks a productive conversation about the limits of human-in-the-loop safety mechanisms.

  Best regards
