answer: |-
  You're technically right about the algebra, but you're wrong about the psychology and the process. Yes, if you have a truly exogenous diagnostic with historically validated likelihood ratios independent of your current project's narrative, Bayes' theorem holds. But in practice, that "cheap diagnostic" is almost never selected via outside-view rigor. You didn't pick that spike because it was the most predictive variable available across all 150 projects; you picked it because you had a hunch it would go well. That selection process is inside-view contamination. You're treating the diagnostic as if it fell from the sky, but you chose to run it. If you had run a different spike—one you were less confident about—and it came back "dirty," would you have updated down to 10% and canceled the project, or would you have questioned the validity of the dirty result? The outside view isn't just about the math; it's about forcing you to accept the base rate before you start looking for exceptions.

  As for your second point, collapsing the outside view into "doing statistics correctly" misses why the distinction was invented in the first place. Kahneman and Lovallo didn't propose reference class forecasting because they thought people were bad at Bayes; they proposed it because people refuse to use base rates at all. The "inside view" isn't a statistical error; it's a narrative bias. By framing the outside view as a rival methodology rather than a subset of statistics, we create a normative rule: "Start here, and you need overwhelming evidence to move." If you tell practitioners "just do statistics correctly," they will plug their optimistic inside-view assumptions into a Bayesian formula and get a precise, wrong answer. The 68% looks legitimate on paper, but it's dangerous because it gives your optimism a statistical seal of approval. The outside view's job is to keep you at 35% until you've proven, beyond reasonable doubt, that you aren't just another data point in the 65% failure column. Your spike doesn't prove that; it just proves you passed a test that 60% of winners also passed.
