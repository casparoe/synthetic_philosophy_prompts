answer: |-
  # Activity: The Chromatic Wager

  ## 1. Materials List
  *   **Thermochromic Beads:** 20–30 beads (green at room temp, blue at body temp). *Test these beforehand; ensure they are fully green at your classroom's ambient temperature.*
  *   **White Trays/Plates:** 6 (one per group). White background makes the green pop.
  *   **Plastic Tongs:** 6 pairs (to move beads without heating them prematurely).
  *   **"Confidence Chips":** 100 poker chips or distinct paper tokens (two colors, e.g., Red and Blue).
  *   **The Lab Log:** A prop notebook. Page 1 contains a printed table: "Observation 1–500: Bead Color = Green." Page 2 is blank.
  *   **Sealed Envelope:** Contains a slip of paper reading: "OUTCOME: BLUE." (This is your backup honesty guarantee if the beads misbehave, though the beads are the primary mechanic).
  *   **Projector/Board:** To track group scores.
  *   **Handout:** "Rule Template" (see below).

  ## 2. The Payoff Scheme
  *   **Endowment:** Each group starts with 10 Chips.
  *   **The Wager:** Groups place chips on "Green" or "Not-Green" for the next observation.
  *   **Resolution:** Correct prediction doubles the wagered chips. Incorrect loses them.
  *   **The Prize:** The group with the most chips at the end gets a trivial but tangible reward (e.g., first choice of seminar topics, or a bag of actual candy). *Keep it low stakes but socially visible.*

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  ### Phase 1: The Pattern (00:00 – 00:15)
  *   **Action:** Place a white tray at the front. Using tongs, place 5 beads on the tray one by one.
  *   **Observation:** All 5 are Green.
  *   **Instruction:** "Record this in your Lab Log. 5 Observations. 5 Greens. Zero Blues."
  *   **The Wager:** "I am about to draw the 6th bead. I will place it on the tray. Bet your chips: Will it be Green or Not-Green?"
  *   **Expected Outcome:** 100% of chips go on Green.
  *   **Action:** Draw 6th bead with tongs, place on tray. It is Green.
  *   **Payoff:** Everyone wins. Tension dissipates. They feel smart.

  ### Phase 2: The Squeeze (00:15 – 00:35)
  *   **Action:** Pick up the 6th bead *with your bare fingers* (not tongs). Hold it for 10 seconds. It turns Blue.
  *   **Shock:** "Wait. The object changed. The data just changed."
  *   **Instruction:** "Reset. You have 10 chips again. I will draw a 7th bead. I will hold it in my hand for 10 seconds. Bet: What color will it be *in my hand*?"
  *   **The Conflict:** Most will still bet Green (habit). Some might switch to Blue (updating).
  *   **Action:** Collect bets. Do not reveal yet.
  *   **The Task (Group Work):** Hand out the **Rule Template**.
      *   *Template:* "All beads in this bag are _______."
      *   *Constraint:* "You must write a rule that fits Observations 1–6 (on the tray) perfectly, but predicts a DIFFERENT color for Observation 7 (in the hand) than the rule 'All beads are Green' predicts."
  *   **Goal:** They must manufacture the rival.
      *   *Example Solution:* "All beads are *Tray-Green*." (Definition: Green if on tray, Blue if in hand).
      *   *Example Solution:* "All beads are *Hand-Blue*."
  *   **Verification:** Have groups swap rules. Ask: "Does this rival rule fit the first 6 observations?" (Yes). "Does it disagree on the 7th?" (Yes).
  *   **The Trap:** Ask a group who bet Green: "Why did you bet Green when *Tray-Green* fits the data just as well?"
      *   *Expected Answer:* "Because beads don't change color." / "Because that's cheating."
      *   *Your Response:* "Define 'cheating' without using the word 'real' or 'natural'." (They will struggle).

  ### Phase 3: The Entrenchment Move (00:35 – 00:50)
  *   **Action:** Bring out **The Lab Log**.
  *   **Script:** "Here is the history. For 3 years, this lab has used the predicate 'Green'. It appears in 500 past entries. The predicate 'Tray-Green' appears zero times. It was invented 5 minutes ago by Group 3."
  *   **The Challenge:** "You cannot say 'Green is real.' You cannot say 'Tray-Green is fake.' You only know the Log. Justify betting on Green using *only* the fact that 'Green' is in the Log and 'Tray-Green' is not."
  *   **Discussion:** Let them wrestle. They will say things like "It's safer," "It's standard."
  *   **Point:** Press them. "Safer why? If the world is actually Tray-Green, 'Standard' loses you points. Why trust the Log?"
  *   **Goal:** Force them to admit they are betting on *us* (the lab's habits), not the *beads*.

  ### Phase 4: The Resolution (00:50 – 01:00)
  *   **Action:** Draw the 7th bead. Hold it in your hand.
  *   **Outcome:** It turns Blue.
  *   **Scoring:**
      *   Groups that bet "Green" lose their wager.
      *   Groups that bet "Not-Green" (or wrote a rival rule predicting Blue) win.
      *   *Crucial Twist:* Acknowledge that the "Green" bettors were rational, but lost. The "Rival" bettors were lucky (or insightful), but won.
  *   **Honesty Check:** Show the Sealed Envelope. "I wrote 'BLUE' before class. The chemistry was fixed. I didn't change it based on your bets."

  ### Phase 5: The Debrief (01:00 – 01:15)
  *   **Mapping the Experience:**
      1.  **The Projection:** "In Phase 1, could you *not* bet on Green?" (No. You can't function without projecting).
      2.  **The Underdetermination:** "In Phase 2, did the 6 beads prove 'Green' over 'Tray-Green'?" (No. Both fit perfectly).
      3.  **The Habit:** "In Phase 3, what separated the winner from the loser?" (Not logic. Not data. It was the Lab Log. It was *entrenchment*).
  *   **Naming:** Now introduce Hume (Custom/Habit) and Goodman (Grue/Entrenchment). Tell them they just reinvented Goodman's puzzle without knowing it. "Tray-Green" is "Grue."
  *   **Closing:** "You feel uneasy about 'Tray-Green' not because it's false, but because it's new. That unease is the only thing holding your science together."

  ## 4. Exact Scripting for Critical Moments

  **The "Cheating" Objection (Phase 2)**
  *   *Student:* "But 'Tray-Green' is gerrymandered. It's ad hoc."
  *   *You:* "Ad hoc means 'for this purpose.' Yes, it was made for this purpose. But 'Green' was made for *past* purposes. Why does a rule made for the past work for the future? If you say 'Because it worked before,' you are using 'Green' to justify 'Green.' Show me where the bead tells you 'Green' is better than 'Tray-Green'."

  **The Entrenchment Justification (Phase 3)**
  *   *You:* "I want a volunteer to justify betting on Green. Rule: You cannot use the words 'real,' 'natural,' 'intrinsic,' or 'actually.' You can only talk about the Log."
  *   *Student:* "Well... it's more reliable."
  *   *You:* "Reliable based on what?"
  *   *Student:* "Past success."
  *   *You:* "And 'Tray-Green' has 100% past success on the tray data. Why does the *older* success count more than the *new* rule's fit? You are appealing to the age of the word, not the nature of the world."

  **The Reveal (Phase 4)**
  *   *You:* "Look at your scores. The people who trusted the habit lost points. The people who spotted the relational trick won points. But next week, if I bring normal beads, the habit wins. There is no 'Induction Machine' in your brain that tells you which rule to pick. There is only your history."

  ## 5. Honest Assessment: Failure Modes & Limitations

  ### What Will Go Wrong
  1.  **The "Semantics" Dismissal:** One group will insist that "Tray-Green" isn't a *real* property, it's just a description of an event. They will treat this as a knockdown argument.
      *   *Fix:* Don't fight metaphysics. Agree. "Fine. It's a description. But the description *fits the data*. Why is the 'real' description privileged before we check the future? You are assuming the future respects 'real' properties more than 'descriptive' ones. That is the assumption I want you to see."
  2.  **The "Gaming" Strategy:** A group might split their chips (5 on Green, 5 on Blue) to guarantee survival.
      *   *Fix:* Call this out during the debrief. "Hedging is rational for points, but impossible for action. You can't walk out of the room hedging. You will walk through the door expecting the floor to be there, not 'there-or-not-there.' The problem of induction isn't about betting; it's about acting."
  3.  **Bead Failure:** If the room is hot, beads might start blue. If the room is cold, they might not turn blue fast enough.
      *   *Fix:* Have the Sealed Envelope ready. If the beads lag, say: "The chemistry is slow, but the outcome is fixed." Open the envelope. "The outcome was Blue. The bead would have gotten there. Your prediction was about the fixed fact, not the speed of the dye."

  ### The Limitation You Must Supply
  **The Depth of Entrenchment.**
  In the room, "Green" and "Tray-Green" are both effectively new. "Green" has the *illusion* of history because of the Lab Log prop, but the students know you just handed it to them. They won't *feel* the weight of a lifetime of linguistic conditioning.
  *   **Your Job:** You must verbally bridge this gap in the debrief. "In this room, 'Green' feels old because I gave you a Log. In your life, 'Green' feels old because your ancestors used it to survive. The feeling of 'naturalness' is just the feeling of very deep habit. I can't simulate 10,000 years of usage in 75 minutes. You have to imagine that 'Green' feels to you what 'Tray-Green' feels to a Martian. Neither is logical. One is just ours."

  ### Why This Version Works
  It avoids the abstract "All emeralds are grue" text. It makes the predicate *relational* (Tray vs. Hand) which is physically demonstrable. It forces them to write the rival rule themselves, preventing them from dismissing it as "the professor's trick." The loss of points on the "Green" bet in Phase 4 is crucial—it punishes the habit, proving that the habit is not logically guaranteed to win, only statistically entrenched.
