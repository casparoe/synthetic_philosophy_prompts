          *   *Severity:* Medium-High. It risks making the duty look arbitrary. If citizens aren't beneficiaries, on what basis are they liable for the institution's debt? Pure membership? That looks like collective punishment.
          *   *Resolution:* Shift the grounding from "benefit" to "successor responsibility" or "democratic authorization."

