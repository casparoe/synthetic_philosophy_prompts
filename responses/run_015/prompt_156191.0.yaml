          *   *Analysis:* Claim 1 says guilt is *not* personal moral blame. Claim 6 says an individual can shed their "share of the political guilt." This implies political guilt *does* attach to individuals in some way, otherwise there's no "share" to shed.
          *   *Severity:* High. Claim 1 says "not as personal moral blame... to individual citizens." Claim 6 says "individually shed her share." This is a direct contradiction in terminology or ontology. Is political guilt a cloud over the land (institutional) or a tag on the passport (individual)?
