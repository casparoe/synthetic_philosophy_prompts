      *   *Claim 3 (Duty of Reparation):* Duty exists, based on corrective justice for the institution, not individual punishment.
      *   *Claim 4 (Metaphysical Guilt):* Rejects inescapable metaphysical guilt; moral resistance can dissolve it.
