answer: |-
  ### Brainstorming Candidate Framings

  1.  **The Ambiguity Thesis:** Argue that "knows how" is lexically ambiguous, akin to "bank," splitting strictly between intellectualist and ability senses.
      *   *Tractability:* Low. Proving lexical ambiguity over context-sensitivity requires heavy semantic machinery and cross-linguistic data. This is a career project, not a one-year fellowship.
  2.  **The Regulative Exclusivity:** Argue that standard cases (bike riding) are degenerate and only regulative know-how (managing a lab) is philosophically fundamental.
      *   *Tractability:* Medium. Highly revisionary. You would spend the year defending the premise rather than producing positive results, risking alienation of both camps.
  3.  **The Task-Relative Truth Conditions:** Argue that the truth conditions for know-how attributions shift based on the temporal and feedback structure of the task, explaining why each theory wins on its home ground.
      *   *Tractability:* High. This accepts the data from both sides but reorganizes it. It allows for a delimited investigation into *where* the split occurs without requiring a full metaphysical overhaul of knowledge states.

  **Selection:** I am proceeding with **The Task-Relative Truth Conditions** framing. It is the only one tractable in twelve months that respects the existing literature while offering a novel resolution.

  ***

  ### Proposal: Task-Relative Truth Conditions in Know-How Attributions

  **Project Question**
  Does the temporal and feedback structure of a task determine whether know-how attributions require executability or merely guidance, and whether they demand a narrow or wide modal profile?

  **The Problem and Existing Positions**
  The contemporary debate over knowledge-how is stagnant. Intellectualists argue that knowing how to $\phi$ is a species of propositional knowledge—knowing that $w$ is a way to $\phi$ under a practical mode of presentation. Anti-intellectualists, following Ryle, argue it is a complex capacity or ability. The dialectic has reached an equilibrium where each side secures victories on specific cases but fails to generalize. Intellectualists handle one-shot tasks well (the chess player knowing a mate they never face); Ability Theorists handle extended tasks better (riding a bike through varying terrain).

  This stalemate persists because both sides assume a unified account must apply to a single unit of analysis. They treat "opening a safe" and "raising a child" as equivalent targets for attribution. My project challenges this assumption. I propose that the disagreement is not about the nature of the mental state alone, but about the structure of the task being evaluated. In one-shot tasks, guidance suffices; in regulative tasks—extended, open-ended, feedback-dependent activities like steering a department or maintaining a friendship—executability and robust modal profiles are required.

  Current positions leave this open because they rely on intuition pumps that obscure task structure. Intellectualism cannot easily account for the feedback loops required in regulative know-how without inflating the propositional content absurdly. Ability Theory struggles to explain attributions to agents who cannot execute the task (the paralyzed pianist) without severing the link between knowledge and action. Neither framework possesses the vocabulary to distinguish between *executability* (can you do it?) and *guidance* (can you monitor it?), nor do they adequately model the *modal profile* (how much environmental variation can the agent absorb?). By forcing these distinctions into the analysis, we can explain why the debate feels intractable: the participants are talking about different functional roles masked by the same verb phrase.

  **Methodology**
  I will not employ pure conceptual analysis, as the intuitions here are conflicted by design. Nor will I borrow semantics from linguistics, which often abstracts away from the action-theoretic constraints relevant to philosophers of action. Instead, I will use a method of **structured case variation**.

  *   **Phase 1 (Months 1–3): Taxonomy Construction.** I will categorize standard and novel know-how cases along two axes: temporal duration (one-shot vs. extended) and feedback dependency (open-loop vs. closed-loop). The output will be a matrix of task types used to test attributions.
  *   **Phase 2 (Months 4–8): Attribute Mapping.** Using the matrix, I will test the stability of executability and modal profile requirements across task types. For example, does the attribution "knows how to calm a colleague" survive if the agent cannot physically speak (executability failure) but understands the psychology (guidance success)? Does "knows how to ride a bike" survive if the agent fails on wet pavement (modal profile failure)? The output will be a draft manuscript mapping the shift in truth conditions.
  *   **Phase 3 (Months 9–12): Synthesis and Objection Handling.** I will integrate the findings into a unified account of task-relativity and stress-test it against counterexamples. The output will be a complete dissertation chapter or article ready for submission.

  This method is superior to armchair intuition pumping because it systematizes the variables causing the conflict. It avoids the trap of simply collecting more cases; instead, it isolates the structural features of the cases that trigger different evaluative standards.

  **Success and Failure Conditions**
  A successful result will be a demonstrable correlation between task structure and attribution standards. Specifically, I will show that regulative tasks invariably require a wider modal profile and stricter executability conditions than one-shot tasks. This provides a determinate answer to where the split in the literature falls.

  Failure is defined concretely. First, the project fails if I discover that task structure has no impact on attribution standards, meaning the stalemate is due to something deeper than unit of analysis. Second, it fails if the distinction between executability and guidance collapses under scrutiny, rendering the taxonomy useless. Third, and most critically, it fails if I produce two unrelated papers—one on task structure, one on modal profiles—without successfully integrating them into a single argument about truth conditions. The goal is a unified explanation, not a collection of observations.

  **Scope Note**
  This project is delimited to the truth conditions of attributions, not the metaphysics of the underlying states. I will not argue whether the state *is* propositional or ability-based, only what is *required* for the attribution to be true. This prevents the project from ballooning into a five-book series on the nature of mind. I am mapping the surface grammar of our practices to explain the theoretical deadlock, not solving the hard problem of consciousness or agency.

  **Anticipated Objections**
  To the colleague who claims this is two topics stapled together: The unity is provided by the functional role of the attribution, where task structure is the independent variable shifting the dependent variables of executability and modality. To the foundation reviewer who argues conceptual philosophy offers no new insights: This framework directly informs AI alignment and professional training assessment, where distinguishing between guidance knowledge and executable capacity is practically urgent.

