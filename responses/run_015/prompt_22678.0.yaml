          5.  Social Trust (The "Signal" problem).
          6.  Moral Tragedy (Regret).
          7.  Language Teleology (Why language matters).
          8.  Personal Cost (Anxiety/Burden).

      *   *Refining Follow-ups:* I need to be specific about what he's *likely* to say. Augustinians usually argue that the *act* is the sin, not the consequence. They distinguish *implicature* from *assertion*. They often ground it in natural law which can be secularized but is historically theological.

  5.  **Final Review against Constraints:**
