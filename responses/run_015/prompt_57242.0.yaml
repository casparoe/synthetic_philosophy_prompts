prompt: |-
  I lead a small modelling team at a national health technology assessment agency. Roughly once a month we must put a number on something for which there is essentially no data — the probability of a rare but serious adverse event from a newly approved device, the between-site variance of an outcome, the rate at which a treatment effect decays after a trial ends — and our submissions are required to state a prior that "assumes nothing." I know that requirement is incoherent: a distribution uniform on the probability is not uniform on the odds, or the log-odds, or the reciprocal, and the defensible posterior means can differ by an order of magnitude. Our reviewers include two statisticians who will catch every equivocation and a lay panel that reads only the summary.

  Please write a decision procedure my analysts can run before any such parameter goes into a submission: the questions to ask in order; what counts as a sufficient answer at each; the criteria a proposed non-informative prior must satisfy, including which invariances it must respect and which parameterization must be declared on the record; the step at which the procedure must stop and log that indifference is unavailable rather than simulate it; and the points where the choice is handed to a person because it reflects institutional risk appetite rather than fact. Every step must be executable in under an hour by someone with one course in Bayesian statistics.

  Then apply it to three cases: an adverse event with zero occurrences in 400 patient-years; the between-site variance of a continuous outcome; and an annual decay rate extrapolated ten years beyond the trial. In at least one of these the procedure must deliver an answer my team will not like — for instance forbidding the number they have already drafted — and state what they must submit instead. Close with what the procedure cannot deliver, and a four-sentence plain-language paragraph explaining to the lay panel why "we assumed nothing" is never an available claim.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of a small modelling team at a national health technology assessment (HTA) agency.
      *   **Problem:** Monthly need to quantify parameters with essentially no data (rare AEs, between-site variance, treatment decay).
      *   **Constraint:** Submissions require a prior that "assumes nothing" (non-informative), which is mathematically incoherent (parameterization dependence).
      *   **Audience:** Two expert statisticians (catch equivocation) and a lay panel (reads summary).
      *   **Task:** Create a decision procedure for analysts.
          *   Questions in order.
          *   Sufficient answers.
          *   Criteria for non-informative priors (invariances, parameterization).
          *   Stop rule (when to log "indifference unavailable").
          *   Hand-off points (institutional risk appetite).
          *   Executable in <1 hour by someone with 1 Bayesian course.
      *   **Application:** Apply to three specific cases (AE 0/400, between-site variance, decay rate).
          *   One case must yield an "unliked" answer (forbid drafted number).
      *   **Closing:** Limitations of the procedure + 4-sentence plain-language explanation for the lay panel.

  2.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* Make the implicit explicit. Acknowledge the impossibility of "no assumptions" while standardizing the *least objectionable* assumption.
      *   *Step 1: Parameter Definition.* Must define the scale. Log? Probability? Variance? This addresses the invariance issue.
      *   *Step 2: Data Check.* Is there truly *no* data? Or just no *direct* data?
      *   *Step 3: Prior Selection.* Move away from "Uniform(0,1)" as the default. Introduce Reference Priors (Jeffreys) or Weakly Informative Priors (Gelman).
      *   *Step 4: Sensitivity/Invariance Check.* Does changing the scale change the conclusion?
      *   *Step 5: Risk Appetite Hand-off.* If the prior drives the decision, it's not statistical; it's policy.
      *   *Step 6: Documentation.* Explicitly state what is assumed.

      *Refining for the "1 Course" Constraint:* Keep math simple. Avoid complex derivation of Jeffreys priors. Focus on *choice* and *documentation*. Use standard defaults (e.g., Beta(1,1) vs Beta(0.5, 0.5) vs Half-Cauchy).
      *Refining for the "Statisticians" Constraint:* Must mention parameterization invariance explicitly.
      *Refining for the "Lay Panel" Constraint:* Need a clear audit trail.

      *Drafting the Steps:*
      1.  **Scale Declaration:** What is the unit?
      2.  **The "Zero Data" Verification:** Is it truly structural absence or just sampling zero?
      3.  **Prior Candidate Selection:** Pick from a pre-approved list (Uniform, Jeffreys, Weakly Informative).
      4.  **Invariance Test:** Check log-scale vs linear.
      5.  **Decision Impact:** Does the prior change the reimbursement/approval decision?
      6.  **Sign-off:** Who owns the risk?

  3.  **Apply to Case Studies:**

      *   **Case 1: Adverse Event (0 events in 400 patient-years).**
          *   *Common mistake:* Probability = 0. Or Uniform(0,1) on probability.
          *   *Issue:* Rule of Three suggests ~3/400. Uniform on probability implies different belief than Uniform on rate.
          *   *Procedure outcome:* Need a prior that respects the rate scale. Beta(1,1) on probability is often too informative near 0 for rare events. Jeffreys (Beta(0.5, 0.5)) is better. But wait, for *rare* events, a weakly informative prior pulling towards 0 might be needed, OR we acknowledge the upper bound.
          *   *Conflict:* The team probably wants to say "Risk is negligible." The procedure might force them to admit "Risk is uncertain, upper bound is X."
          *   *Decision:* Forbid the point estimate of 0. Force a credible interval based on a specific prior (e.g., Jeffreys).

      *   **Case 2: Between-site variance (Continuous outcome).**
          *   *Common mistake:* Inverse-Gamma(0.001, 0.001) (the old BUGS default).
          *   *Issue:* This is informative near zero.
          *   *Procedure outcome:* Must use Half-Cauchy or Half-Normal on the *standard deviation*, not the variance.
          *   *Conflict:* Analysts likely drafted an Inverse-Gamma. Procedure forbids it.

      *   **Case 3: Treatment Decay (Extrapolation 10 years).**
          *   *Common mistake:* Linear decay to 0, or Uniform on decay rate.
          *   *Issue:* Physical impossibility (negative effect?) or extreme sensitivity to prior tail.
          *   *Procedure outcome:* This is structural uncertainty, not just parameter uncertainty. A prior on the *rate* is insufficient.
          *   *Conflict:* This is where "indifference is unavailable." You cannot assume nothing about biology over 10 years. This requires a policy decision (risk appetite).

      *   *Selection for "Unliked Answer":* Case 2 (Variance) is the classic "Inverse-Gamma trap." It's technical, the statisticians will catch it, and analysts hate changing legacy code. Or Case 1, where they can't claim 0 risk. Let's go with Case 2 (Variance) as the technical "stop," and Case 3 as the "policy hand-off." Actually, the prompt asks for *one* case where the procedure forbids the number. Case 2 is the strongest technical forbid. Case 1 is also good. Let's make Case 1 the "forbid 0 risk" and Case 2 the "forbid Inverse-Gamma." I need to pick one to highlight as the "unliked" outcome. Let's choose Case 2 (Variance) because the Inverse-Gamma(epsilon, epsilon) is a notorious sin in modern Bayesian practice that a "one course" analyst might still use from old tutorials.

  4.  **Drafting the Content:**

      *   *Tone:* Professional, authoritative, pragmatic, slightly bureaucratic (it's an agency protocol).
      *   *Structure:*
          1.  Protocol Title & Purpose.
          2.  The Decision Flowchart (Steps 1-6).
          3.  Application to Cases.
          4.  Limitations.
          5.  Lay Panel Statement.

  5.  **Refining the "One Hour/One Course" Constraint:**
      *   Avoid asking them to calculate Fisher Information.
      *   Provide a "Look-up Table" for priors.
      *   Focus on *checking* boxes rather than *deriving* math.
      *   The "Invariance Test" needs to be simple: "If you log-transform the parameter, does the prior look different?"

  6.  **Refining the "Lay Panel" Statement:**
      *   Must be exactly four sentences.
      *   Must explain why "assuming nothing" is impossible.
      *   Must be understandable.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex?
      *   *Fix:* Simplify the Invariance Test. Just ask them to plot the prior on the log scale.
      *   *Critique:* Did I address the "risk appetite" hand-off?
      *   *Fix:* Make Step 5 explicit: "If the prior choice changes the decision threshold, escalate to Director."
      *   *Critique:* Is the "unliked answer" clear?
      *   *Fix:* In Case 2, explicitly state "Do not submit the Inverse-Gamma model. Submit the Half-Normal."

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Criteria (invariance, parameterization)? Yes.
      *   Stop rule (indifference unavailable)? Yes.
      *   Risk appetite hand-off? Yes.
      *   <1 hour/1 course? Yes (by using lookup tables and simple plots).
      *   Three cases applied? Yes.
      *   One unliked answer? Yes (Case 2).
      *   Limitations? Yes.
      *   4-sentence paragraph? Yes.

  9.  *(Self-Correction on Case 1)*: 0 events in 400 patient-years. A common error is reporting 0. Another is using a Uniform(0,1) prior on the rate. The "Rule of Three" is frequentist. In Bayesian, Beta(1,1) gives mean 1/402. Beta(0.5, 0.5) gives slightly different. The real issue is often the *scale*. Is it a rate (Poisson) or probability (Binomial)? Let's ensure the procedure forces them to distinguish.
      *(Self-Correction on Case 3)*: Decay rate. This is extrapolation. A prior on the decay rate doesn't capture structural uncertainty (e.g., does it decay at all?). This is the best candidate for "Indifference Unavailable."

      *Decision:* I will make Case 2 the "Technical Forbid" (Inverse Gamma) and Case 3 the "Procedural Stop" (Indifference Unavailable). This covers different aspects of the prompt. Wait, the prompt says "In at least one of these the procedure must deliver an answer my team will not like... and state what they must submit instead." I will focus the "unliked" instruction on Case 2, as it's a concrete substitution. Case 3 will trigger the "Stop and Log" rule.

      *Wait, one more check:* "Every step must be executable in under an hour by someone with one course in Bayesian statistics."
      *Implication:* I cannot ask them to derive Jeffreys priors. I must provide the specific distributions to choose from (e.g., "Use Beta(0.5, 0.5) for probabilities," "Use Half-Normal for SDs"). The procedure becomes a compliance checklist against a standard list.

      *Let's write.*
answer: |-
  # Protocol: Non-Informative Prior Justification (NIPJ-01)

  **Purpose:** To standardize the selection of prior distributions when data are insufficient to inform a parameter, ensuring mathematical coherence and transparency regarding institutional risk.
  **Authority:** Modelling Team Lead.
  **Time Limit:** 60 minutes per parameter.
  **Prerequisite:** Completion of *Introduction to Bayesian Methods* (or equivalent).

  ---

  ## Part 1: The Decision Procedure

  **Step 1: Parameterization Declaration**
  *   **Question:** What is the exact mathematical scale of the parameter being estimated? (e.g., Probability $p$, Log-Odds $\log(p/(1-p))$, Rate $\lambda$, Standard Deviation $\sigma$, Variance $\sigma^2$).
  *   **Sufficient Answer:** A single variable name and unit (e.g., "Log-Hazard Ratio," not "Risk").
  *   **Criteria:** The submission must declare the prior on the scale used for computation. You may not place a uniform prior on a variance and claim it represents indifference on the standard deviation.
  *   **Action:** Write the parameter scale on the cover sheet.

  **Step 2: The "Zero Data" Verification**
  *   **Question:** Is the lack of data due to sampling (we looked and saw nothing) or structure (the mechanism is unknown)?
  *   **Sufficient Answer:** "Sampling Zero" (e.g., 0 events in $N$ trials) OR "Structural Uncertainty" (e.g., biological decay mechanism unknown).
  *   **Criteria:** If "Structural Uncertainty," proceed to **Step 6**. You cannot assume nothing about a mechanism you do not understand.
  *   **Action:** Tick box: [ ] Sampling Zero [ ] Structural Uncertainty.

  **Step 3: Prior Candidate Selection (Lookup Only)**
  *   **Question:** Which pre-approved "Reference Prior" matches your parameter scale?
  *   **Sufficient Answer:** Selection from the **Approved Lookup Table** (see below). Do not derive new priors.
  *   **Criteria:**
      *   *Probabilities/Proportions:* Use **Beta(0.5, 0.5)** (Jeffreys). Do *not* use Beta(1,1) (Uniform) unless justified by policy.
      *   *Standard Deviations:* Use **Half-Normal(0, 1)** or **Half-Cauchy(0, 1)** scaled to the data. Do *not* use Inverse-Gamma($\epsilon, \epsilon$).
      *   *Regression Coefficients/Log-Odds:* Use **Normal(0, 10)** (Weakly Informative). Do *not* use Uniform($-\infty, \infty$).
      *   *Rates (Poisson):* Use **Gamma(0.5, 0)** (Jeffreys) or **Gamma(0.01, 0.01)** (only if scale is verified).
  *   **Action:** Select distribution from table.

  **Step 4: The Invariance Check**
  *   **Question:** If you plot this prior on the log-scale of the parameter, does it imply a strong preference for specific values (e.g., bunching near zero)?
  *   **Sufficient Answer:** A visual plot (generated in R/Python/Excel) showing the density on both the linear and log scale.
  *   **Criteria:** If the density spikes aggressively at a boundary (0 or 1) on the log scale, the prior is informative.
  *   **Action:** Attach plot. If spike exists, return to Step 3.

  **Step 5: Decision Impact Test**
  *   **Question:** Does changing the prior to the next-most-conservative option in the Lookup Table change the reimbursement/approval recommendation?
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Criteria:** If "Yes," the prior is driving the decision, not the data. This is a policy choice, not a statistical one.
  *   **Action:** If "Yes," **STOP**. Escalate to Team Lead for Risk Appetite Sign-off (Step 6).

  **Step 6: Risk Appetite Hand-off / Indifference Log**
  *   **Trigger:** Step 2 was "Structural Uncertainty" OR Step 5 was "Yes."
  *   **Action:** Do not submit a number. Submit a **Range of Plausible Values** based on two priors (conservative and optimistic) and log the parameter as "Indifference Unavailable."
  *   **Requirement:** The submission must state: *"The choice between these priors reflects the Agency's tolerance for Type I vs. Type II error, not statistical evidence."*

  ---

  ## Part 2: Application to Current Submissions

  ### Case 1: Adverse Event (0 occurrences in 400 patient-years)
  *   **Step 1 (Scale):** Rate per patient-year ($\lambda$).
  *   **Step 2 (Data):** Sampling Zero.
  *   **Step 3 (Prior):** Analysts drafted a point estimate of 0. **Procedure Forbids.** A point estimate implies certainty.
      *   *Correction:* Use Gamma(0.5, 0) (Jeffreys for Poisson rate).
  *   **Step 4 (Invariance):** Gamma(0.5, 0) is invariant to scale changes in the rate.
  *   **Step 5 (Impact):** Does the upper 95% credible bound cross the safety threshold?
  *   **Outcome:** **Submit the 95% Credible Interval, not the mean.**
      *   *Calculation:* With 0 events, Jeffreys prior yields an upper 95% bound of approx. 3.69 events per 400 years ($\approx 0.009$ per year).
      *   *Instruction:* You must report the upper bound. You cannot report 0.

  ### Case 2: Between-Site Variance (Continuous Outcome)
  *   **Step 1 (Scale):** Variance ($\sigma^2$) vs. Standard Deviation ($\sigma$).
  *   **Step 2 (Data):** Sampling Zero (few sites, high uncertainty).
  *   **Step 3 (Prior):** Analysts drafted **Inverse-Gamma(0.001, 0.001)**.
      *   **PROCEDURE STOP.** This prior is on the *variance* scale but is highly informative near zero on the *standard deviation* scale. It violates the Approved Lookup Table.
  *   **Step 4 (Invariance):** The Inverse-Gamma($\epsilon, \epsilon$) implies a strong belief that the variance is either tiny or huge, with little mass in between. It is not non-informative.
  *   **Outcome:** **You must respecify the model.**
      *   *Instruction:* Place a **Half-Normal(0, 1)** prior on the *Standard Deviation* ($\sigma$), not the Variance.
      *   *Why you won't like it:* This will likely widen the credible intervals for the treatment effect compared to your drafted Inverse-Gamma, potentially threatening the cost-effectiveness threshold. You must submit the Half-Normal result.

  ### Case 3: Treatment Decay Rate (Extrapolated 10 Years)
  *   **Step 1 (Scale):** Annual decay percentage.
  *   **Step 2 (Data):** **Structural Uncertainty.** The trial lasted 2 years; you are modelling year 12. There is no data on the *mechanism* of decay (linear? exponential? step-function?).
  *   **Step 3 (Prior):** N/A.
  *   **Step 6 (Trigger):** Structural Uncertainty detected.
  *   **Outcome:** **Log "Indifference Unavailable."**
      *   *Instruction:* Do not submit a single decay rate. Submit two scenarios: "Immediate Loss of Effect" and "Permanent Effect."
      *   *Rationale:* No prior distribution can capture the ignorance of biological mechanism over a decade. This is a policy scenario, not a parameter estimation.

  ---

  ## Part 3: Limitations of this Procedure

  This procedure cannot resolve conflicts where the mathematical definition of "nothing" contradicts the clinical reality of "something." It cannot generate information where none exists; it can only standardize how we admit our ignorance. It does not protect the Agency from criticism if the chosen reference prior yields a result that harms patients or wastes resources. Finally, it relies on the honesty of the analyst in Step 2; misclassifying structural uncertainty as sampling zero bypasses all safety checks.

  ## Part 4: Statement for the Lay Panel

  "When we say we 'assumed nothing,' we actually mean we used a standard mathematical starting point that lets the data speak for itself. However, mathematics requires us to measure uncertainty on a specific scale, and choosing one scale over another always changes the result slightly. Therefore, we never truly assume nothing; we instead choose the assumption that adds the least amount of our own opinion to your data. This report explicitly states which standard assumption we used so you can see where our calculations began."
