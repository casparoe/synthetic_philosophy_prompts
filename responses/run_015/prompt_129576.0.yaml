answer: |-
  Hi there,

  It is great that you are tackling this with your group because Hempel's paradox is one of those things that feels like a logic trick until you realize it actually breaks how we think about science. Since you want them to feel the contradiction before you explain it, you need an activity that forces them to act on the logical equivalence rather than their intuition. I recommend setting up a closed universe simulation using a deck of custom cards where the players act as scientists testing a law about that universe. You will need to create a simple deck of about forty cards consisting of four types of objects defined by shape and color, so you have Red Circles, Blue Circles, Red Squares, and Blue Squares. The hypothesis they are testing is simple and written on the board as All Circles are Red. Before you start dealing cards, you give them a single rule of logic that they must abide by for the sake of the game, which is that a statement and its logical equivalent must be treated identically regarding evidence. You explain that All Circles are Red is logically the same as All Non-Red things are Non-Circles, so any evidence for one is evidence for the other.

  The game plays out over several rounds where you draw cards from the deck one by one without showing the whole deck yet. Each player has a set of tokens representing their confidence level in the hypothesis, starting at zero. When a card is revealed, everyone must vote on whether this observation supports the hypothesis. If they vote yes, they add a token to their confidence pile. If the card turns out to be a Blue Circle, the hypothesis is falsified and the game ends early, but you should rig the deck so this does not happen. The trick is in the composition of the deck. You should make the Red Circles very rare, maybe only two or three in the whole deck, but make the Blue Squares very common, say twenty of them. The Red Squares and Blue Circles should be few or nonexistent in the draw pile. Because you established the rule about logical equivalence, when you draw a Blue Square, which is a Non-Red Non-Circle, they are logically forced to vote that it supports the hypothesis. They will accumulate confidence tokens rapidly as you flip through all the Blue Squares. By the end of the deck, they will have high confidence tokens and claim they are very sure that All Circles are Red.

  Then comes the reveal that creates the dissonance. You ask them to turn over their confidence tokens and ask how many of them actually saw a Circle. Most will realize they based their high confidence almost entirely on looking at Squares. This is the moment where the paradox hits them organically because they followed the rules of logic perfectly but ended up feeling like they learned about Circles by looking at Squares. You can then pivot to the debrief by asking them why it feels wrong even though it was logically valid. This is where you map their confusion back to the raven problem, noting that the Blue Square is the White Shoe and the Red Circle is the Black Raven. You should be honest with them and with yourself that this activity cannot reproduce the probabilistic weight of evidence, which is the standard mathematical resolution to the paradox. In the real world, there are infinitely more non-black things than ravens, so the confirmation value of a white shoe is technically non-zero but so infinitesimally small it is negligible. Your card game treats all evidence as equal units, so it misses the nuance that seeing a shoe adds less than a billionth of a percent to your confidence, whereas seeing a raven adds a significant chunk. You will have to supply that context yourself because a card game cannot easily simulate infinite populations or Bayesian priors.

  Regarding your question about confirmation holism, you can weave that into the end of the discussion without turning it into a lecture. If someone asks whether this means science is broken, you can suggest that maybe we do not test beliefs one by one like isolated cards. Instead, mention that when they counted the Blue Squares, they were actually confirming a whole web of beliefs about how shapes and colors are distributed in this universe, not just the single sentence about Circles. This does not necessarily fix the paradox so much as it moves the weirdness elsewhere, suggesting that evidence supports a whole network of theories rather than a single hypothesis, which might make the idea of a white shoe confirming ravens feel slightly less absurd if viewed as stabilizing the entire system of classification rather than proving a fact about birds. It is a nice way to close the loop without claiming there is a perfect solution. I hope this works for your group and that you have a lively session, because nothing gets engineers talking like a bug in their logic engine.

  Best of luck with the meeting.
