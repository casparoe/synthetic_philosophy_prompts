answer: |-
  # JOINT STATEMENT ON THE SPECIAL COMPOSITION QUESTION
  **Date:** October 26, 2023
  **Parties:** The Nihilist (Author) & The Universalist (Friend)

  ## I. SHARED PREMISES AND METHODOLOGICAL COMMITMENTS

  We, the undersigned, having debated the Special Composition Question (SCQ) to a standstill, affirm the following points of agreement regarding the structure of the debate and the inadequacy of alternative positions:

  1.  **The Formulation of the SCQ:** We agree the question is to be understood as: "Under what conditions do some objects $x_1, x_2...$ compose a further object $y$?" We agree this is not a question about linguistic usage alone, but about the structure of reality.
  2.  **Rejection of Restricted Composition:** We jointly reject all "moderate" or restricted answers (e.g., composition occurs only when parts are in contact, fastened, or constitute a life). We agree that any such restriction entails a sharp cutoff along a continuum (e.g., of proximity or cohesion) where no metaphysical difference exists. We accept that vagueness in the world is untenable, and semantic vagueness cannot rescue a restricted ontology without arbitrariness.
  3.  **The Burden of Paraphrase:** We agree that both our views require a reconstruction of ordinary discourse.
      *   The Nihilist must provide a paraphrase schema for singular terms referring to composites (e.g., "The table is solid" $\rightarrow$ "The simples arranged table-wise are solid").
      *   The Universalist must provide an error theory or contextual constraint explaining why ordinary speakers ignore arbitrary sums (e.g., "The shoe and the Moon") despite their existence.
  4.  **Inadmissible Arguments:** We agree that the following moves do not settle the dispute:
      *   Appeals to pre-theoretical intuition regarding familiar objects (e.g., "Obviously there is a chair").
      *   Appeals to absurdity regarding exotic objects (e.g., "Obviously there is no trout-turkey").
      *   Arguments relying solely on the cardinality of objects posited without reference to theoretical utility.
  5.  **Supervenience:** We agree that all facts about composite objects (if any) supervene on the facts about simples and their spatiotemporal relations. There is no "further fact" of composition that floats free of the arrangement of the fundamental constituents.

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines the substantive divergence remaining between us. Each row describes the same metaphysical commitment, phrased in the terminology each of us finds most accurate.

  | Domain | The Nihilist's Formulation | The Universalist's Formulation |
  | :--- | :--- | :--- |
  | **Ontology** | Only simples exist. There are no composite objects. | Simples exist, and for any plurality of objects, there exists a sum of those objects. |
  | **Quantification** | To say "there exists a table" is strictly false; to say "there exist simples arranged table-wise" is true. | To say "there exists a table" is true; to say "there exists a sum of my shoe and the Moon" is also true, though pragmatically obscure. |
  | **Identity** | A table is identical to nothing; it is a *façon de parler* for a plurality. | A table is identical to the mereological sum of its parts; the sum is identical to the parts taken collectively. |
  | **Change** | When a table is destroyed, no object ceases to exist; only the arrangement of simples changes. | When a table is destroyed, a composite object ceases to exist, though its parts (and their sum under a different description) persist. |
  | **Science** | Fundamental physics quantifies only over fields/particles (simples). Macro-objects are useful fictions. | Fundamental physics may quantify over regions or sums; macro-objects are legitimate values of bound variables. |

  ## III. CRUXES AND THE "MERELY VERBAL" CHARGE

  We identify two primary cruxes where an answer would force a revision of one or both views.

  **Crux 1: The Nature of Existence (Quantifier Variance)**
  *   *Issue:* Is the dispute about what exists, or about what the word "exists" means?
  *   *Assessment:* We agree this is **not merely verbal** in a trivial sense, but it hinges on whether the unrestricted quantifier ($\exists$) carves reality at its joints. If the Universalist's quantifier is legitimate, Nihilism is false. If the Nihilist's quantifier is the only fundamental one, Universalism is an ideological bloat.
  *   *Settling Condition:* A demonstration that one quantificational scheme allows for a formulation of fundamental laws that is strictly simpler (in terms of primitive ideology) than the other.

  **Crux 2: Causal Exclusion**
  *   *Issue:* Do composite objects have causal powers distinct from their parts?
  *   *Assessment:* We both agree **no**. (We accept the causal closure of the physical/simples).
  *   *Settling Condition:* If it could be shown that positing composites *reduces* causal overdetermination rather than creating it, Universalism gains ground. If positing them creates insoluble exclusion problems, Nihilism gains ground. Currently, we view this as a tie.

  ## IV. UNRESOLVED TEST CASES

  We failed to agree on the interpretation of the following two scenarios. We record our divergent predictions here.

  ### Case 1: The Toy World (Three Simples)
  **Scenario:** A world containing exactly three simples ($A, B, C$).
  *   *Time $t_1$:* $A, B, C$ are clustered closely (touching).
  *   *Time $t_2$:* $A, B, C$ are scattered light-years apart.
  *   *Dynamics:* The laws of motion describe only the trajectories of $A, B, C$.

  | Question | Nihilist Prediction | Universalist Prediction |
  | :--- | :--- | :--- |
  | **What exists at $t_1$?** | Exactly three objects ($A, B, C$). | Seven objects ($A, B, C, A+B, A+C, B+C, A+B+C$). |
  | **What exists at $t_2$?** | Exactly three objects ($A, B, C$). | Seven objects ($A, B, C, A+B, A+C, B+C, A+B+C$). |
  | **Does existence change?** | No. The ontology is constant. | No. The ontology is constant (composition is unrestricted). |
  | **Do "extra" entities do work?** | The Universalist's sums do no work; they are idle wheels. | The Nihilist's denial of sums gains no predictive power; sums are harmless redundancies. |
  | **Resolution Condition** | If the dynamics *required* a variable ranging over $A+B$ to predict $C$'s motion, I would concede. | If the dynamics *forbade* quantification over sums to remain consistent, I would concede. |

  ### Case 2: The Stipulated Cost Audit
  **Scenario:** We imagine a completed physics. We audit the "cost" of each theory not by counting objects, but by theoretical utility.
  *   *Ontological Cost:* Entities quantified over in fundamental laws.
  *   *Ideological Cost:* Complexity of the paraphrase schema required to translate ordinary/scientific talk into fundamental ontology.

  | Metric | Nihilist Expectation | Universalist Expectation |
  | :--- | :--- | :--- |
  | **Ontological Cost** | **Low.** Physics quantifies only over simples/fields. Composites are never fundamental variables. | **Neutral/High.** Physics *could* quantify over sums, but doesn't *need* to. However, denying them requires no extra laws. |
  | **Ideological Cost** | **High.** Requires complex paraphrases for every macro-object claim ("There are xs arranged F-wise..."). | **Low.** Ordinary talk is largely literal. No paraphrase needed for "The table exists." |
  | **Net Verdict** | Ontological parsimony outweighs ideological cost. Simples are fundamental; tables are not. | Ideological simplicity outweighs ontological bloating. Existence is cheap; paraphrase is expensive. |
  | **Moving Condition** | If the paraphrase schema becomes too complex to be computationally tractable for agents like us. | If the commitment to arbitrary sums forces a revision of logic (e.g., failure of extensionality) that complicates laws. |

  ## V. FALSIFICATION AND FINAL SETTLEMENT

  **1. Evidence Against the Nihilist View**
  *   **Condition:** If fundamental physics posits irreducible composite variables. For example, if the Standard Model were replaced by a theory where "quark-triplets" are fundamental and cannot be analyzed away into three distinct variables without loss of predictive power or symmetry.
  *   **Confidence:** High. If physics requires it, metaphysics must follow.

  **2. Evidence Against the Universalist View**
  *   **Condition:** If it is demonstrated that unrestricted composition leads to logical paradoxes that cannot be resolved by standard set-theoretic or mereological restrictions (e.g., if the "Universal Object" leads to a contradiction akin to Russell's Paradox that breaks the logic of identity).
  *   **Confidence:** Moderate. Standard mereology (Classical Extensional Mereology) seems consistent, but a proof of inconsistency would be fatal.

  **3. Is There a Settlement?**
  We conclude that **nothing currently available settles the matter definitively.**
  *   The dispute rests on a trade-off: **Nihilism** purchases ontological parsimony at the price of ideological complexity (paraphrase). **Universalism** purchases ideological simplicity (literalism) at the price of ontological bloating.
  *   Since we agree on all the concrete facts (the arrangement of simples, the truth conditions of ordinary sentences, the laws of physics), the remainder is a meta-ontological choice about how to map the quantifier $\exists$ onto the world.
  *   **Joint Verdict:** We suspend judgment on which view is *true* in an absolute sense, acknowledging that each is a coherent, internally consistent system for carving reality. We agree to disagree, recognizing that our dispute is as much about the virtues of theoretical economy (entities vs. ideology) as it is about the world itself.

  __________________________
  **The Nihilist**

  __________________________
  **The Universalist**
