answer: |-
  Your reasoning is exceptionally sharp, and it touches upon one of the most persistent and sophisticated criticisms leveled against Lakatos's Methodology of Scientific Research Programmes (MSRP). You have effectively reconstructed the "problem of rational reconstruction": if history can be rewritten to make any theory look progressive, does the distinction between progress and degeneration retain any normative force?

  Given your background in experimental physics, you will appreciate that the slip in your chain is not in the logic of deduction, but in the **operational definition of "novel fact"** within Premise (1) and the **empirical requirement** hidden in Premise (3).

  To preserve both (1) and (5) as you wish, you must reject the inference from (2) to (3). Here is precisely where the chain slips and what conceptual price is paid to fix it.

  ### 1. The Slip: Conflating Logical Entailment with Empirical Progress
  Your Premise (2) states: *Any given theoretical adjustment... can in principle be shown to entail some previously untested or unmeasured consequence if one examines its formal structure with sufficient mathematical ingenuity.*

  This is logically true but methodologically empty in Lakatos's framework. Lakatos distinguishes between **theoretical progress** (an increase in empirical content) and **empirical progress** (the corroboration of some of that new content).

  The slip occurs in Premise (3): *Consequently, for virtually any protective-belt revision one can retrospectively construct a "novel prediction"...*

  Lakatos explicitly blocks this move by imposing a **temporal constraint** on novelty. For a problem shift to be progressive, the "novel fact" must not only be entailed by the new theory; it must be **discovered or observed after the modification was proposed**.

  If you adjust the protective belt to accommodate Anomaly A (which is already known), and then use "mathematical ingenuity" to claim the adjustment also implies Fact B (which was also already known, or merely unmeasured until you looked for it *because* of the adjustment), Lakatos classifies this as **degenerating**.

  **The Fix:** You must amend Premise (1) to include a temporal condition. A problem shift is progressive only if it predicts facts that were **unknown** at the time the modification was introduced. This blocks the "retrospective construction" in (3). You cannot count a fact as "novel" if the theory was tuned to fit a landscape that already included that fact, even implicitly.

  ### 2. The Hidden Normative Condition: "Ex Ante" Prediction
  You asked: *Have I omitted a hidden normative condition within (1) itself—perhaps one requiring that the novel fact be predicted in advance of its discovery rather than excavated afterwards?*

  **Yes.** This is exactly the constraint required to save Lakatos's examples (Marxism, Psychoanalysis) from your reductio ad absurdum.

  Lakatos was acutely aware of the Duhem-Quine problem—that one can always save a theory by adding auxiliary hypotheses. To prevent MSRP from becoming a tautology where every theory is progressive, he insisted that the "excess empirical content" must be **corroborated**.

  In your condensed-matter context, consider the difference between:
  *   **Progressive:** Proposing a new Hamiltonian to explain a specific heat anomaly, which *then* leads you to measure a specific magnetic susceptibility peak that no one had seen or expected before.
  *   **Degenerating:** Proposing a new Hamiltonian to explain the specific heat anomaly, and then scouring old data to find *some* minor deviation in thermal expansion that you can claim the new Hamiltonian "predicts," even though the Hamiltonian was essentially tuned to the specific heat data alone.

  If you allow the latter (your Premise 3), you collapse the distinction. Lakatos demands the former. The "novelty" must be **temporal**, not just logical.

  ### 3. The Role of the Positive Heuristic
  There is a second constraint you have omitted which reinforces the first. Lakatos argues that the protective belt is not modified randomly or purely *ad hoc*; it is guided by a **positive heuristic**.

  *   **Progressive programmes** have a positive heuristic that anticipates problems and guides the construction of the belt *before* anomalies become crushing.
  *   **Degenerating programmes** modify the belt *only* in response to anomalies, without a guiding plan for new discoveries.

  Your Premise (2) suggests that "mathematical ingenuity" can always find a new consequence. But Lakatos would argue that if that consequence is not part of a coherent, heuristic-driven expansion of the theory, but rather a desperate dig for *any* available confirmation, it counts as degeneration. The "ingenuity" must be in the service of the heuristic, not in the service of saving the core.

  ### 4. The Conceptual Cost
  You asked what you must pay conceptually if you reject a different link.

  *   **If you reject (2)/(3) (The Constructibility Claim):** You pay very little. You simply acknowledge that logical entailment is not sufficient for scientific progress. This aligns with your experimental experience: a model that fits existing data perfectly but fails to predict new regimes is not "progress," it's just curve-fitting.
  *   **If you reject the Temporal Constraint in (1):** You lose the ability to distinguish science from pseudoscience in real-time. If retrospective accommodation counts as progress, then Astrology (which constantly reinterprets past events to fit charts) could be classified as progressive. You would preserve the logical structure of MSRP but destroy its normative power.
  *   **If you reject (5) (Lakatos's Historical Examples):** You might argue that Marxism or Psychoanalysis *were* progressive in some contexts. However, this requires a historical revisionism that most philosophers of science find untenable given their failure to generate risky, successful predictions over the long term.

  ### Conclusion
  Your chain slips at **(3)**. The move from "entails a consequence" to "constitutes a novel prediction" fails because it ignores the **temporal order of discovery**.

  To preserve (1) and (5), you must accept that Lakatos's definition of "progressive problem shift" contains an implicit **prohibition on ex post facto rationalization**. A modification is only progressive if it leads to the discovery of facts that were **not used in the construction of the modification**.

  This preserves the integrity of Lakatos's demarcation. It acknowledges your physicist's intuition: a theory that only explains what we already know (even if it does so with great mathematical sophistication) is degenerating. A theory that tells us where to look next, and we find something there, is progressing. The "mathematical ingenuity" you describe in (2) is, in Lakatos's view, merely sophisticated curve-fitting unless it is validated by *new* data.
