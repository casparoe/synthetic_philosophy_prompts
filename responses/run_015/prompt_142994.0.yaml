      *   **Address Premise (1) - The Definition of Novelty:** Lakatos isn't just talking about logical entailment. He requires *corroborated* excess empirical content. It's not enough to say "the theory implies X." X must be observed.
      *   **Address Premise (3) - The Retrospective Loophole:** This is the main target. Lakatos explicitly guards against this. He requires that the novel fact be *unexpected* based on the *previous* version of the theory. If you tweak the belt to fit Anomaly A, and then dig up Fact B that was already known but ignored, that's not progress. If you dig up Fact C that is *newly observed* after the tweak, that counts.
