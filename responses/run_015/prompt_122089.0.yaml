answer: |-
  ### Brainstorming & Angles

  *   **The Core Tension:** The "Dirty Hands" problem (à la Walzer/Weber) isn't about corruption; it's about the tragic necessity of violating a moral norm to uphold a greater political good. The *Moral Remainder* is the guilt/stain that persists even after the utilitarian calculus justifies the act. The problem for the stand-up bit is that the *remainder* is proof of the leader's morality (if you don't feel bad, you're a sociopath), but admitting to the *remainder* is proof of guilt (if you feel bad, you did something wrong).
  *   **The Voter's Paradox:** Voters want the *outcome* of dirty hands (safety, stability, funded schools) but the *aesthetic* of clean hands (purity, integrity, transparency). They want a sin-eater who doesn't smell like sulfur.
  *   **The Scenario:** A town councilor approves hazardous waste storage in the school basement to fund the roof repair. The kids are safe from collapse, but exposed to toxins. The "right" thing structurally, the "wrong" thing morally.
  *   **The Campaign Trail Need:** The councilor must run for re-election. He cannot admit the crime (liability), but he cannot appear soulless (likability). He must perform the *weight* of the decision without admitting the *content* of the decision.
  *   **The Punchline Logic:** The joke needs to land on the *performance* of the remainder. The guilt isn't private; it's a campaign asset that must be managed like a liability. The punchline should highlight that the "cleanliness" the voters see is actually the result of the labor of hiding the stain, and that labor is the actual job.
  *   **Key Phrase Ideas:** "Performative hygiene," "Budgeting for guilt," "The stain is the resume," "Industrial scrubbing."

  ***

  ### The Bit

  "You know the 'Dirty Hands' problem in political theory? It's not about bribes. It's when you have to break a moral rule to save the system. Like, I'm a town councilor, and the school roof is collapsing. The only way to fix it is to let a chemical company store some 'lightly hazardous' sludge in the basement.

  I sign the deal. The roof holds. The kids are safe from falling beams, but now they're breathing freon. I saved the children by poisoning the children. Structurally? Necessary. Morally? I'm a monster.

  Now comes the re-election campaign. This is where the philosophy meets the focus group. Because voters want a leader who can make that call—they want the dirty hands—but they don't want to *see* the dirt. They want the moral remainder—the guilt, the sleepless nights—but they don't want it to look like weakness.

  So my campaign manager tells me, 'Look, you can't say you did it. But you have to show you feel bad about *something*.'

  So now my stump speech is just me staring intensely at my own palms. I'm like, 'I know what it means to carry a burden... a heavy, unspecified burden that smells vaguely of sulfur.'

  My opponent has clean hands. He's never done anything wrong. He's also never done anything. Me? I'm running on a platform of aggressive hand-washing. I scrub for forty minutes before every rally. Not to get clean—to show you I know I'm dirty.

  The punchline of my candidacy isn't that I'm innocent. It's that I'm the only candidate who budgets time for guilt. Vote for me. I'm hemorrhaging morality so you don't have to."
