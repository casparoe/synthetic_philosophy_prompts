      *   *Standard Fix:* Reflection applies only when you expect your future self to be updating via Conditionalization on evidence you don't yet have (van Fraassen's own caveat). Or, more broadly, when you regard your future self as an *epistemic expert* relative to your current self.
      *   *Price:* You lose the ability to use Reflection in cases of "rational self-doubt" where you aren't sure if you'll be rational, but you don't know *specifically* that you'll be irrational due to an external cause. However, the sleep deprivation case is a case of *known* irrationality.
      *   *Hard Case:* What about cases where you know you will forget evidence? Or cases where you know you will undergo a "rational" belief revision that you currently disagree with (e.g., philosophical persuasion)? The restriction must allow for legitimate updating while blocking distortion.
