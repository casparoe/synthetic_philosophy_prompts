      *   Therefore, (1) must be restricted to cases where the agent does not anticipate their own irrationality, OR (1) is subordinate to synchronic norms.
      *   Best restriction: Reflection applies only when the agent expects their future credence to be the result of conditionalization on veridical evidence (or simply, when they trust their future self).
