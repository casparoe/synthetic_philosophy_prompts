answer: |-
  You have hit on a genuine logical error in literary interpretation, and your intuition about the statistical structure is spot-on. You are describing a failure to account for the **selection function** that governs what appears in a text.

  There is no single, canonical Latin term for this specific mistake in literary theory (like *ad hominem* or *post hoc*), but it is a recognized composite error. Here is the breakdown of the existing terminology, the validity of your anthropic hunch, and how to define the boundary you're asking about.

  ### 1. The Established Names (and why they aren't quite it)

  You correctly ruled out the **Intentional Fallacy** (Wimsatt & Beardsley). That fallacy argues that authorial intent is either unavailable or irrelevant to the text's meaning. Your critics are doing the opposite: they are claiming intent is *everything*, but they are calculating it incorrectly.

  The closest established terms are:

  *   **The Biographical Fallacy:** This is the parent category. It occurs when a critic assumes the text is a direct transcript of the author's life or psyche. However, this is usually too broad for your specific point about *selection bias*.
  *   **The Mouthpiece Fallacy:** This is the informal term most commonly used in workshops. It describes the assumption that a character (usually the protagonist) serves as the author's direct mouthpiece. However, this names the *assumption*, not the *logical error* behind it.
  *   **The Fundamental Attribution Error:** This is the psychological term that best fits the mechanism. In social psychology, this is the tendency to attribute someone's behavior to their character (disposition) rather than their situation.
      *   *In your context:* The critics attribute the character's speech to the author's **belief** (disposition) rather than the **narrative requirements** (situation). They ignore that the "situation" of a novel requires conflict, and conflict requires dangerous ideas to be voiced.

  ### 2. Your Anthropic Hunch

  You asked if the connection to the **Anthropic Principle** is forced. **It is not.** Structurally, it is identical.

  In philosophy of science, this is called an **Observation Selection Effect (OSE)**.
  *   **Anthropic Principle:** We cannot observe conditions incompatible with our existence as observers. Therefore, we must adjust our probabilities to account for the fact that we are observing from a "filtered" pool of possible universes.
  *   **Your Literary Principle:** Readers cannot observe ideas incompatible with the story's existence (drama, conflict, tension). Therefore, they must adjust their inference about the author to account for the fact that they are reading from a "filtered" pool of possible ideas.

  If you want to sound formidable in that discussion, call it **ignoring the Observation Selection Effect of Narrative.** You are arguing that the text is not a random sample of the author's mind; it is a *biased sample* filtered for dramatic viability. Treating a biased sample as a representative population is a statistical error.

  ### 3. A Proposed Label

  Since there isn't one perfect word, you can coin a precise phrase for the discussion. The most accurate description is **Narrative Selection Bias**.

  *   **Definition:** The interpretive error of inferring an author's personal beliefs from a character's statements without accounting for the editorial filter of dramatic necessity.
  *   **The Logic:** Just as you cannot estimate the average noise level of a forest by only listening to the birds that are currently singing, you cannot estimate an author's worldview by only analyzing the ideas that were dramatic enough to survive the drafting process.

  ### 4. The Boundary: Belief vs. Tension

  You asked where the boundary sits between "this character expresses the author's view" and "this character expresses a view selected for narrative tension."

  In narratology, we distinguish these using **structural consequences** rather than just dialogue. Here are the heuristics critics should use instead of the Mouthpiece assumption:

  **A. The Cost Test**
  *   **Author's View:** If the character holds this view, does the narrative reward them with clarity, stability, or moral victory? (Not necessarily "happiness," but narrative validation).
  *   **Tension View:** Does holding this view cost the character something? Does it lead to isolation, error, or tragedy? Authors often put their *darkest* fears in the hero's mouth to explore them, not to endorse them. If the belief destroys the character, it is likely a subject of inquiry, not a thesis.

  **B. The Polyphony Test (Bakhtin)**
  *   Mikhail Bakhtin argued that great novels are **polyphonic** (many-voiced). If the author believes X, do they allow a different character to articulate Not-X with equal intelligence and rhetorical force?
  *   **Mouthpiece:** The opposing view is straw-manned or spoken by a villain without nuance.
  *   **Tension:** The opposing view is robust. If the author puts a dangerous idea in the hero's mouth, but gives the antagonist the best counter-argument, the author is likely staging a debate, not preaching a sermon.

  **C. The Irony Distance**
  *   Look at the narrative voice. Is there a gap between what the character *says* and what the narration *shows*?
  *   If the hero says "War is glorious," but the prose describes mud, blood, and screaming, the author is using **dramatic irony**. The "truth" is in the gap, not the dialogue. Critics who ignore this are committing a form of **Naïve Realism**.

  ### Summary for your Discussion

  If you need a shorthand to stop the workshop talk, try this:

  > "You are committing a **Fundamental Attribution Error** compounded by **Narrative Selection Bias**. You are treating the text as a representative sample of my beliefs, when it is actually a filtered sample of *dramatic possibilities*. You are reasoning from an **Observation Selection Effect**: you only see the ideas that were useful for conflict, not the ideas I actually hold. To find my view, look at the *consequences* of the belief in the plot, not just the *statement* of the belief in dialogue."

  Your intuition is philosophically sound. The critics are treating a simulation (the novel) as a transcript (the manifesto).
