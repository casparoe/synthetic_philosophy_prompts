answer: |-
  To evaluate whether habitat destruction reduces wild animal suffering, a theory of ecosystem welfare must satisfy specific ethical, ecological, and logical desiderata. These fall into two categories: non-negotiable constraints (logic and empirical fact) and ethical preferences (axiological commitments).

  **Ethical Distinctions (Preferences)**
  Any theory must explicitly adopt a stance on population ethics, as habitat changes alter who exists and how many exist.
  1.  **Total vs. Average Welfare:** The theory must decide if a larger population with lower average welfare is better than a smaller, happier one. The Total View sums all welfare; the Average View maximizes per-capita welfare. This is a preference, not a fact.
  2.  **Suffering Asymmetry:** The theory must weigh negative experiences against positive ones. Does one unit of agony cancel out one unit of joy, or does suffering carry greater moral weight? This is axiological.
  3.  **The Non-Identity Problem:** The theory must handle cases where actions change *which* individuals are born. Destroying habitat prevents future animals from existing. Is preventing a potentially suffering life a benefit? Is preventing a happy life a harm?

  **Ecological Constraints (Non-Negotiable)**
  The theory cannot contradict established biological mechanics.
  1.  **Carrying Capacity:** Populations expand until resources limit them. High population density inevitably leads to starvation or disease. A theory claiming high populations sustain high average welfare contradicts this.
  2.  **Trophiic Dependence:** Predators require prey. A theory cannot propose a high-welfare ecosystem that eliminates predation without collapsing the predator population.
  3.  **Turnover Rates:** Many species employ "r-selection," producing many offspring expected to die young. A theory must account for the welfare of the vast majority who die before adulthood.

  **Intuitive Test Cases**
  A robust theory should align with strong moral intuitions, though these can be overridden by consistent principles.
  1.  **The Painful Extinction:** If a population lives lives of net suffering, is painless extinction better than continuation? A theory should ideally say "yes," unless it values existence itself over welfare.
  2.  **The Harm Principle:** Killing an existing animal is typically viewed as worse than preventing one from being born. The theory must explain why habitat destruction (which kills existing animals) is permissible or impermissible compared to natural death.

  **The Impossibility Result**
  Here lies the critical conceptual bottleneck. It appears jointly unsatisfiable to hold the following three claims simultaneously:

  1.  **Ecological Realism:** Stable ecosystems require high turnover, predation, and resource scarcity (mechanisms that generate suffering).
  2.  **Total Utilitarianism:** We ought to maximize the sum total of welfare across all beings.
  3.  **The Asymmetry Intuition:** Preventing a suffering life is good; preventing a happy life is not bad (or less bad).

  If wild lives are net negative (due to Ecological Realism), Total Utilitarianism implies we should minimize population size, potentially endorsing habitat destruction. However, if we accept the Asymmetry Intuition, we must also weigh the intense suffering inflicted on *existing* animals during destruction against the suffering prevented for *future* animals.

  The contradiction arises because ecological stability ties welfare to population density. To maximize Total Welfare, you might need more animals, but more animals lowers Average Welfare due to scarcity. To maximize Average Welfare, you need fewer animals, but reducing populations via habitat destruction inflicts immediate harm on existing beings.

  Furthermore, if you accept that preventing a suffering life is good (Asymmetry), but killing an existing being is bad (Harm Principle), habitat destruction becomes paradoxical. It kills existing beings (bad) to prevent future beings from suffering (good). Because ecological turnover is so high, the "prevented suffering" of future generations vastly outweighs the harm to current generations *if* lives are net negative. But if lives are net positive, destruction is catastrophic.

  **Conclusion**
  The non-negotiables are logical consistency and ecological fact. The preferences are how you weigh total vs. average welfare and suffering vs. happiness. The joint unsatisfiability lies in trying to maximize welfare within a system where welfare generation is mechanistically linked to suffering processes (predation/starvation). You cannot have a high-welfare, high-population, stable ecosystem under current biological laws. Any theory must either reject ecological realism, accept that nature is net negative (justifying intervention), or accept that nature is net positive (justifying preservation), but it cannot coherently hold that nature is stable, high-welfare, and high-population simultaneously.
