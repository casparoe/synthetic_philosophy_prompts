  9.  **Refining the Output (Checking Constraints):**
      *   *Tone:* Philosophical, precise, direct. No fluff.
      *   *Structure:* Desiderata list -> Distinctions -> Tension Analysis -> Exclusionary/Prejudice -> Scorecard.
