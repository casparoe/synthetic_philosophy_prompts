  7.  **Identifying the Exclusionary Requirement & Prejudice:**
      *   *Most Exclusionary:* **Portability (Detachability).** Most readings explain the *moment* of insight well but fail to explain how that insight functions as a premise in a long proof weeks later without begging the question about memory.
      *   *Prejudice to Drop:* **Non-triviality (in the sense of informative content).** If the goal is foundational security, a "tautology" (in a broad sense) might be preferable to a risky existential claim. *However*, for the *user's specific job* (restoring the world), "Non-triviality" is actually non-negotiable. So, which is a prejudice? **Logical Form (Syllogism vs. Intuition).** This is scholarly baggage. The job cares about *function*, not grammatical form.

  8.  **Developing the Scorecard:**
