      *   **Task:** Correct, prune, and extend the user's provisional list of desiderata. Distinguish non-negotiables from preferences/camp-specific tastes. Identify distinctions that must be respected (e.g., indubitability vs. knowledge). Address the user's specific "detachability/memo problem."
