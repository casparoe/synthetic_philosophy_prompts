prompt: |-
  I am a professor of philosophy and, this year, the chair of my university's committee on conflicts of interest and research integrity. We adjudicate some fifty cases a year — most of them trivial, a few capable of costing us a campus licence, a researcher's safety, or a colleague's career — and we have been asked to replace our current guidance, which is little more than a gift register with a monetary threshold, with an actual protocol. The protocol has to serve our home campus and two campuses abroad, where the surrounding political economy is clientelist: permits, access to research sites, and official goodwill run through patrons and brokers; a gift is what acknowledges a relationship rather than what buys a favour; and refusing one can be a grave affront rather than a punctiliousness. Some colleagues hold that our home rules simply travel and that anything else is relativism dressed up as cultural sensitivity. Others hold that an impersonal-office ethic applied in such a setting makes our research impossible and punishes local staff for the way their own society works. Both cannot be right, and "when in Rome" is not a procedure.

  What I need is a decision procedure the committee can actually run: the questions in order, what counts as a sufficient answer to each, the points at which the answer is simply no, and the points at which it must stop and hand the decision to a person because what remains is a question of values rather than of fact. It has to work in about twenty minutes, over email, by academics with no legal training, producing one recorded paragraph of reasoning that our general counsel's office can sign off on asynchronously within five days; it has to be usable by a colleague who has never read a line of political philosophy; and it has to say what to do when the relevant fact cannot be had, since we usually cannot know why someone gave something.

  The crude tests we have tried do not work, and I would like you to say why before replacing them. Publicity — would you mind this being known? — misfires where gift-giving is public and expected. A value threshold misfires in both directions: a cheap gift can be the visible token of a clientelist relationship, while an expensive one, a funded conference or a studentship, can be entirely at arm's length. My suspicion is that what does the work is neither size nor secrecy but whether the transfer redirects a practice away from the end that makes the office worth having — admissions is for admitting those qualified to study, peer review for assessing the quality of work, procurement for getting the building built. If that is right, the procedure should turn on something like whether the giver is acquiring a claim on a good the officeholder has no right to dispose of, and whether the transfer would survive that officeholder's leaving office tomorrow; if it is not right, say so and build it on something better. It should also return more than yes and no: what is prohibited, what is permitted, what is permitted only on the record, what our rules permit but should not — and, the category I care about most, what is not a corruption question at all but a question of justice or of whether our institution should be operating there as it does, and is therefore nothing this committee has authority to decide.

  Apply it to three live cases. First: an official who must renew the licence of our campus abroad mentions that his son has applied to the Master's programme whose admissions I chair, and asks me to look at the file. Second: six months after graduating with a First, a former student's family sends me a handwoven rug worth roughly two weeks of local wages, against a rule forbidding gifts above a nominal value. Third: a publisher whose introductory textbook we are deciding whether to require, at the students' expense, offers to fund a three-day curriculum retreat for my department at a coastal hotel. I expect the procedure to give me an answer in the third case that I will not enjoy; give it anyway. Finally, tell me honestly where a procedure of this kind will misfire: which innocent arrangements it will flag, which real corruptions it will miss because they present as hospitality or gratitude, and which questions it is not even able to ask.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **User:** Professor of Philosophy, Chair of Committee on Conflicts of Interest (COI) and Research Integrity.
      *   **Context:** Adjudicates ~50 cases/year. Home campus + 2 abroad (clientelist political economies).
      *   **Problem:** Current guidance (gift register + monetary threshold) is inadequate. Needs a robust *protocol* (decision procedure).
      *   **Constraints:**
          *   Must work in ~20 mins.
          *   Via email.
          *   By academics (no legal training).
          *   Output: One recorded paragraph of reasoning (for General Counsel).
          *   Must handle uncertainty (unknown motives).
          *   Must distinguish: Prohibited, Permitted, Permitted on Record, Permitted but Unwise, Not a COI issue (Justice/Institutional Presence).
          *   Must address the "Home Rules Travel" vs. "Cultural Relativism" tension without being relativistic or imperialistic.
          *   User's Hypothesis: Corruption is about redirecting a practice away from its internal end (teleological view). Does the giver acquire a claim on a good the officeholder has no right to dispose of? Would the transfer survive the officeholder leaving?
      *   **Tasks:**
          1.  Critique existing crude tests (Publicity, Value Threshold).
          2.  Evaluate User's Hypothesis.
          3.  Design the Decision Procedure (Questions in order, stop points, hand-off points).
          4.  Apply to 3 Live Cases (Admissions/Official, Rug/Student, Retreat/Publisher).
          5.  Honest Assessment of Misfires (False positives, false negatives, blind spots).

  2.  **Deconstruct the User's Hypothesis:**

      *   *Hypothesis:* Corruption = redirecting a practice away from its internal end (admissions, peer review, procurement). Key test: Does the giver acquire a claim on a good the officeholder has no right to dispose of? Does the transfer survive the officeholder leaving?
      *   *Evaluation:* This is strong. It aligns with a *functionalist* or *institutional integrity* view of corruption (like Dennis Thompson or Philp). It moves beyond "quid pro quo" (explicit exchange) to "influence peddling" or "structural corruption."
      *   *Refinement:* The "survival test" (would this happen if I left?) is excellent for distinguishing personal relationships from institutional access. The "claim on a good" test distinguishes between legitimate influence (advocacy) and illegitimate privilege (entitlement).
      *   *Verdict:* Keep this core but operationalize it. It needs to be phrased as questions, not philosophical concepts.

  3.  **Drafting the Decision Procedure (The Protocol):**

      *   *Goal:* 20 minutes, email, non-lawyers.
      *   *Structure:* Flowchart style but in text.
      *   *Step 1: The Nature of the Transfer.* (Is it a gift, favor, service?)
      *   *Step 2: The Officeholder's Power.* (Do I have discretion over something the giver wants?)
      *   *Step 3: The Teleological Test (User's insight).* (Does this alter the criteria of the decision?)
      *   *Step 4: The Survival Test.* (If I leave, does the benefit vanish?)
      *   *Step 5: The Cultural/Contextual Check.* (Is refusal an affront that endangers the mission?)
      *   *Step 6: Categorization.* (Prohibited, Permitted, Recorded, Unwise, Justice Issue).
      *   *Handling Uncertainty:* If motive is unknown, assume the *appearance* of the claim is the risk.
      *   *Hand-off Point:* When the risk is to the *institution's presence* rather than *integrity*, it goes to Senior Management/Provost, not COI.

  4.  **Critiquing Crude Tests (as requested):**

      *   *Publicity Test:* Fails in high-trust/clientelist societies where transparency *is* the bonding mechanism. Hiding it is rude; showing it is normal.
      *   *Value Threshold:* Fails because symbolic value $\neq$ market value. A cheap gift can seal a deal; a conference can be legitimate professional development.

  5.  **Applying to Cases:**

      *   *Case 1 (Official's Son):* High risk. Admissions is a specific institutional end. The official has power over the campus license. The "claim" is on a spot that should be merit-based. *Verdict:* Prohibited/Recusal.
      *   *Case 2 (Student's Rug):* Post-graduation. Relationship is largely over. Is it gratitude or investment? Survival test: If I leave, do they still send it? Probably yes (gratitude). But value is high. *Verdict:* Permitted on Record (acknowledge relationship, ensure no future expectation).
      *   *Case 3 (Publisher Retreat):* Curriculum decision. Publisher pays for department retreat. This buys access to the *department*, not just the chair. It alters the environment of the decision. *Verdict:* Prohibited (or Permitted only if funded by neutral third party). User expects to not enjoy this. I must be firm.

  6.  **Addressing the "Justice/Institutional Presence" Category:**

      *   This is crucial. Sometimes the *system* is corrupt, not the individual. If operating there requires bribery to exist, the COI committee can't solve that. It's a strategic decision for the University. The protocol must flag this.

  7.  **Refining the Output:**

      *   Tone: Professional, philosophical but practical, respectful of the user's expertise.
      *   Format: Clear headings, numbered steps, distinct sections for the critique, protocol, cases, and limitations.
      *   The "One Paragraph" Requirement: I need to draft a template for the reasoning paragraph.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "clientelist" context? Yes, by including the "Refusal Cost" step.
      *   *Check:* Is it too complex? Need to ensure the questions are binary or triage-style.
      *   *Check:* Did I answer the "unknown motive" issue? Yes, by focusing on the *structural* effect rather than the *intent*.
      *   *Check:* The "Justice" category. Make sure the protocol explicitly routes these out of the COI committee's lane.
      *   *Check:* The "Hand-off." Where does the committee stop? When the decision requires weighing the university's presence against its ethics. That's not COI; that's Strategy.

  9.  **Final Polish:**

      *   Ensure the distinction between "Corruption" (internal integrity) and "Justice" (external environment) is clear.
      *   Make sure the "Survival Test" is phrased simply.
      *   Ensure the "One Paragraph" template is fill-in-the-blank style.

  *(Self-Correction on Case 3)*: The user expects an answer they won't enjoy. The retreat is likely a "no." But is it *corruption*? It creates a sense of obligation. It creates a "claim" on the department's time and goodwill. It fails the "arm's length" test. I will recommend prohibition or strict mitigation (university pays, publisher reimburses via grant). I will lean towards prohibition to satisfy the "won't enjoy" constraint.

  *(Self-Correction on Misfires)*: Be honest. This protocol will flag genuine hospitality. It will miss "slow burn" corruption (long-term grooming). It cannot ask "Is this university complicit in an authoritarian regime?"

  10. **Finalizing the Text.** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Part I: Why the Crude Tests Fail

  You are correct to discard the existing heuristics. They fail because they treat corruption as a transactional event rather than a structural condition.

  1.  **The Publicity Test:** In clientelist economies, transparency is not a disinfectant; it is the receipt. To give a gift privately is to imply shame; to give it publicly is to acknowledge the bond. Asking "Would I mind this being on the front page?" assumes a liberal-individualist context where privacy protects integrity. In your abroad campuses, publicity *confirms* the relationship. Using this test forces colleagues to either lie (hide the gift) or offend (publicly refuse the norm).
  2.  **The Value Threshold:** This assumes market price correlates with moral weight. It does not. A handwoven rug (low market value, high symbolic/cultural value) can signify a binding kinship obligation. A funded conference (high market value) can be a standard professional exchange with no strings attached. The threshold protects the university from embarrassment, not from compromise.

  ### Part II: Evaluation of Your Hypothesis

  Your suspicion is philosophically sound and operationally superior. You are describing a **teleological account of institutional corruption** (akin to the work of Dennis Thompson or Mark Philp). Corruption is not merely rule-breaking; it is the subversion of an institution's *purpose* by an external interest.

  *   **The "Claim" Test:** Does the giver believe they now own a piece of your discretion?
  *   **The "Survival" Test:** Is the benefit attached to *you* (the office) or *you* (the person)?

  If the benefit vanishes when you leave the office, it is likely a bribe or a privilege attached to the role that shouldn't exist. If the benefit persists based on personal history (e.g., a former student's gratitude), it is likely relational.

  **Verdict:** Build the protocol on this. It avoids relativism (the *purpose* of admissions is universal) while accommodating context (the *manner* of acknowledging relationships varies).

  ### Part III: The Decision Protocol (The "Twenty-Minute Triage")

  **Instructions:** Copy the questions below into an email. Answer sequentially. If you hit a **STOP**, follow the instruction. If you reach the end, fill in the Reasoning Template.

  **Step 1: The Power Check**
  *Question:* Do I currently hold discretion over a decision (admissions, hiring, procurement, grading, licensing) that provides a tangible benefit to the giver?
  *   **No:** Proceed to Step 2.
  *   **Yes:** Proceed to Step 2. (Note: If "Yes," the burden of proof shifts to you to demonstrate independence).

  **Step 2: The Teleological Test**
  *Question:* If I accept this, does it alter the criteria by which the decision in Step 1 is made? (e.g., Does this make me more likely to admit the son, buy the book, or renew the license than I would be otherwise?)
  *   **No:** Proceed to Step 3.
  *   **Yes:** **STOP.** This is **Prohibited**. Recuse yourself or decline the transfer.
  *   **Uncertain:** Assume **Yes**. Proceed to Step 3 but flag for recording.

  **Step 3: The Survival Test**
  *Question:* If I left my position tomorrow, would the giver still offer this benefit, or would the access vanish?
  *   **Benefit Vanishes:** **STOP.** This is **Prohibited**. The benefit attaches to the office, not the person. It is an attempt to purchase institutional access.
  *   **Benefit Persists:** Proceed to Step 4. (This suggests a personal relationship, e.g., former student, long-term collaborator).

  **Step 4: The Refusal Cost (Contextual Check)**
  *Question:* In this specific cultural/political context, would refusing this transfer cause grave offense that endangers the safety of staff, the security of the campus, or the ability to conduct research?
  *   **No:** Proceed to Step 5.
  *   **Yes:** **HAND-OFF.** This is not a COI issue; it is an **Institutional Risk** issue. Do not decide. Forward to the Provost/VP for Global Affairs with a note: *"Acceptance violates integrity protocol, but refusal poses operational risk. Requires strategic decision on campus presence."*

  **Step 5: The Disposal Check**
  *Question:* Is the benefit something I can share with the department or convert to institutional use (e.g., a book for the library, food for a meeting), or is it purely personal (cash, rug, tuition)?
  *   **Shareable/Institutional:** **Permitted on Record.** Declare it; deposit it.
  *   **Personal:** Proceed to Step 6.

  **Step 6: The "Unwise" Filter**
  *Question:* Even if this passes the above, does it create an *appearance* of a claim that a reasonable observer in our *home* jurisdiction would find compromising?
  *   **No:** **Permitted.**
  *   **Yes:** **Permitted but Unwise.** You may keep it, but you must declare it publicly on the register to inoculate against future suspicion.

  ***

  **Reasoning Template (For General Counsel)**
  *Copy and paste this paragraph into your case file.*

  > "In the matter of [Name/Case], the Committee applied the Integrity Protocol v2.0. We determined that the transfer [does/does not] attach to the Officeholder's discretionary power over [Specific Decision]. Under the Survival Test, the benefit [would/would not] persist were the Officeholder to leave their post, indicating the transfer is [relational/institutional]. While the local context presents a [high/low] cost of refusal, the Committee finds that accepting this transfer [would/would not] redirect the practice of [Admissions/Procurement/etc.] from its intended end. Accordingly, the transfer is classified as [Prohibited / Permitted on Record / Permitted but Unwise / Institutional Risk Hand-off]. If Permitted, the condition is [Declaration/Deposit/Recusal]."

  ***

  ### Part IV: Application to Live Cases

  **Case 1: The Official and the Master's Application**
  *   **Step 1 (Power):** Yes. You chair admissions; he controls the license.
  *   **Step 2 (Teleological):** Yes. Looking at the file "specifically" implies applying a different standard than the rubric.
  *   **Step 3 (Survival):** If you leave the chair, does he still ask you? Likely no. He needs the *chair*, not you.
  *   **Verdict:** **Prohibited.**
  *   **Action:** You must recuse yourself from the file immediately. The file must be reviewed by a colleague blind to the applicant's identity. You must inform the official (diplomatically) that university rules prevent you from viewing the file to protect *his* son's application from any appearance of impropriety.
  *   **Reasoning:** "The transfer attaches to the Officeholder's discretionary power over Admissions. Under the Survival Test, the benefit would not persist were the Officeholder to leave their post, indicating the transfer is institutional. Accepting this transfer would redirect the practice of Admissions from its intended end. Classified as Prohibited."

  **Case 2: The Former Student and the Rug**
  *   **Step 1 (Power):** No. They have graduated. You hold no current discretion over their grade or status.
  *   **Step 2 (Teleological):** N/A (No active decision).
  *   **Step 3 (Survival):** Yes. It is gratitude for past mentorship. It persists after you leave.
  *   **Step 5 (Disposal):** Personal item.
  *   **Step 6 (Unwise):** High value (two weeks' wages). In the home jurisdiction, this looks like a kickback. In the host, it is gratitude.
  *   **Verdict:** **Permitted on Record.**
  *   **Action:** Accept it, but declare it on the register. This acknowledges the cultural norm (avoiding affront) while satisfying the home office (transparency).
  *   **Reasoning:** "The transfer does not attach to current discretionary power. Under the Survival Test, the benefit would persist were the Officeholder to leave their post, indicating the transfer is relational. However, due to value, it creates an appearance of compromise in the home jurisdiction. Classified as Permitted on Record."

  **Case 3: The Publisher and the Retreat**
  *   **Step 1 (Power):** Yes. The department is deciding whether to require their textbook.
  *   **Step 2 (Teleological):** Yes. A retreat funded by the interested party creates a atmosphere of obligation, even if no explicit deal is made. It softens the criteria for selection.
  *   **Step 3 (Survival):** If you leave, does the publisher fund the retreat? Only if the *department* is buying the book. If the department decides *not* to buy the book, the funding likely vanishes. It is contingent on the commercial relationship.
  *   **Step 5 (Disposal):** It is shared (department), but it is funded by a vendor under review.
  *   **Verdict:** **Prohibited.** (This is the answer you will not enjoy).
  *   **Action:** The university must fund the retreat. If the publisher wishes to contribute, they must donate to a general departmental fund unrestricted by vendor status, or pay the university directly to invoice them (arm's length). They cannot pay the hotel directly for a decision-making retreat.
  *   **Reasoning:** "The transfer attaches to the Department's discretionary power over Procurement/Curriculum. Under the Survival Test, the benefit is contingent on the commercial relationship, not the personal one. Accepting this transfer would redirect the practice of Curriculum Selection from its intended end. Classified as Prohibited."

  ### Part V: Where This Protocol Will Misfire

  You asked for honesty. No procedure is a moral algorithm. Here is where this one breaks:

  1.  **The False Positive (The Innocent Host):**
      *   *Scenario:* A local partner invites you to a wedding or a meal that is culturally mandatory.
      *   *Misfire:* The protocol may flag this as "Permitted but Unwise" or require recording. This bureaucratizes hospitality. It turns a human bond into a compliance item. It creates a "chill" where colleagues stop building the relationships necessary to work in those regions.
      *   *Mitigation:* The "Refusal Cost" step (Step 4) catches the dangerous ones, but the mundane ones still get logged. You must accept that *some* friction is the price of integrity.

  2.  **The False Negative (The Long Game):**
      *   *Scenario:* A "friend" takes you to dinner for three years with no ask. In year four, they ask for a favour.
      *   *Misfire:* The protocol assesses the *current* transfer. It cannot see the grooming phase. The Survival Test fails here because the "friendship" feels real.
      *   *Mitigation:* None. This requires human judgment, not a checklist. This is why the "Permitted but Unwise" category exists—to flag low-level accumulation of obligation.

  3.  **The Blind Spot (Structural Complicity):**
      *   *Scenario:* To operate the campus at all, the University must pay a "facilitation fee" to a ministry official who does no work.
      *   *Misfire:* The protocol classifies this as **Institutional Risk Hand-off**. It correctly identifies that the COI committee cannot solve this. But it leaves the question unanswered. Is the university corrupt for being there?
      *   *Limitation:* This protocol protects the *researcher*, not the *institution's soul*. It identifies the corruption but cannot adjudicate whether the university should withdraw. That is a question of justice, not integrity.

  4.  **The "Unknown Motive" Problem:**
      *   *Scenario:* A gift arrives with no note.
      *   *Misfire:* The protocol forces you to assume the worst (Step 2: Uncertain = Assume Yes). This creates anxiety.
      *   *Mitigation:* The "Permitted on Record" outlet allows you to accept it while neutralizing the risk by declaring it. Transparency substitutes for knowledge of motive.

  ### Final Note on the "Justice" Category

  You identified a category: *"What is not a corruption question at all but a question of justice or of whether our institution should be operating there."*

  The protocol handles this via **Step 4 (The Refusal Cost)**. If the answer is "Refusal endangers the campus," the COI committee *must* stop. You do not have the authority to tell a colleague to choose between their integrity and their safety, nor to choose between the university's ethics and its existence.

  When you hand that case off, your reasoning paragraph must change slightly:
  > *"While the transfer fails the Teleological Test, the Refusal Cost indicates that adherence to protocol endangers [Safety/Operations]. This is not a Conflict of Interest but an Institutional Risk. The Committee recommends acceptance under duress but flags this for Strategic Review regarding campus presence."*

  This protects the colleague (they followed protocol), protects the committee (you identified the risk), and forces the Administration to own the moral cost of doing business in that region.
