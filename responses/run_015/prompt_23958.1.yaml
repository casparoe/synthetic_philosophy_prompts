prompt: |-
  I sit on the grants committee of a global-health foundation, and this cycle we have to divide a fixed $12 million pot among the proposals in front of us. One proposal — a high-throughput screening program for a neglected tropical disease — carries a claimed expected benefit roughly forty times the next-best proposal and about a hundred times the median. The rest of the pool is a portfolio of roughly thirty smaller programs, each individually modest. Our standing guidance says we allocate by expected cost-effectiveness, but it was written for a pool of comparable proposals and says nothing about what to do when a single option dominates the rest by this kind of margin.

  Please draft the short written opinion I will circulate to the committee before Friday's meeting. It should recommend a concrete allocation for this cycle — a specific split of the pot — and state the general principle we should adopt so we can handle a similar case next cycle. Treat it as the decision-theory problem it is: the utility-monster case, in which one option absorbs a disproportionate share of the total expected benefit, so that pure expected-value maximization says to pour essentially the whole budget into it and abandon the rest. Weigh the case for concentrating on the dominant intervention against the case for capping per-proposal allocation and diversifying — the uncertainty in the dominant proposal's impact estimate, the risk that it is an outlier rather than a real forty-fold edge, the option value of keeping smaller programs alive, and the equity argument that a foundation should not defund the populations the smaller programs serve. Engage the strongest version of the losing side honestly, not a strawman.

  Please clearly separate what is settled among people who actually work on cost-effectiveness and decision theory from what is genuinely contested, and do not present a contested position — either that pure expected-value maximization is the right rule or that it is the wrong one — as though it were the consensus. Keep it to a couple of pages, no citations, written so a non-specialist commissioner can follow every step of the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grants committee for a global-health foundation.
      *   **Task:** Draft a short written opinion/memo to circulate before Friday's meeting.
      *   **Scenario:** $12 million budget. One "utility monster" proposal (40x next best, 100x median). Thirty smaller, modest proposals.
      *   **Constraint:** Standing guidance says "allocate by expected cost-effectiveness," but it's silent on extreme outliers.
      *   **Requirements:**
          *   Recommend a concrete allocation (specific split).
          *   State a general principle for future cycles.
          *   Treat it as a decision-theory problem (utility monster).
          *   Weigh concentration (EV maximization) vs. diversification (uncertainty, option value, equity).
          *   Engage the strongest version of the losing side (steelman).
          *   Distinguish settled vs. contested issues in decision theory/cost-effectiveness.
          *   No citations.
          *   Accessible to non-specialists.
          *   Length: A couple of pages.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Pure EV):* Fund the big one almost entirely. (Risk: High uncertainty, ethical backlash, portfolio risk).
      *   *Option B (Pure Diversification):* Cap the big one heavily. (Risk: Leaving massive value on the table, violating the foundation's core mission).
      *   *Option C (Hybrid/Robust):* A significant majority to the big one, but a meaningful minority to the portfolio. This acknowledges the EV signal while hedging against model error and maintaining institutional diversity.
      *   *Decision:* I will recommend a 70/30 or 80/20 split. Let's go with 75/25 ($9M to the dominant proposal, $3M to the portfolio). This is decisive but prudent. It signals confidence without betting the farm on a single uncertain estimate.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation and the core reasoning.
      *   **The Decision Problem:** Define the "utility monster" scenario clearly.
      *   **The Case for Concentration (EV Maximization):** Steelman this. Why *should* we fund it all?
      *   **The Case for Diversification (Uncertainty & Equity):** Why hold back? (Model error, option value, fairness).
      *   **Settled vs. Contested:** Explicitly distinguish what experts agree on vs. where philosophy diverges.
      *   **Recommendation:** The specific split.
      *   **Future Principle:** The rule for next time.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Opening:* State the purpose. We have a unique situation.
      *   *The Core Tension:* Acknowledge the math says "fund the big one," but reality is messier.
      *   *Steelmaning EV:* If the numbers are right, funding the smaller ones is effectively choosing to let people die who could have been saved. This is the moral weight of EV. I need to make sure this lands hard.
      *   *The Counter-Arguments (Uncertainty):* 40x is suspicious. Is it model overfitting? Tail risk? If it fails, do we lose everything?
      *   *The Counter-Arguments (Portfolio/Equity):* Option value (learning from small trials). Equity (don't abandon specific regions/diseases entirely).
      *   *Settled vs. Contested:*
          *   *Settled:* Uncertainty matters. Point estimates aren't truth. Diversification has value in risk-averse contexts.
          *   *Contested:* How much weight to give equity vs. total welfare. Whether to be risk-neutral with human lives (pure EV) or risk-averse.
      *   *The Recommendation:* $9M to the screening program, $3M to the portfolio.
      *   *The Principle:* "Robust Expected Value." Maximize EV but apply a discount for uncertainty and maintain a minimum floor for portfolio diversity.

  5.  **Refining the Tone:**
      *   Needs to be professional, thoughtful, and decisive.
      *   Avoid jargon where possible, or explain it (e.g., "utility monster").
      *   Ensure the distinction between "settled" and "contested" is clear, as requested.
      *   Check length: Keep it tight.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I steelman the EV side enough?
      *   *Fix:* Make sure to emphasize that *if* the estimate is accurate, diversification is morally costly.
      *   *Critique:* Did I distinguish settled vs. contested clearly?
      *   *Fix:* Create a specific subsection for this.
      *   *Critique:* Is the allocation specific?
      *   *Fix:* Yes, $9M/$3M.
      *   *Critique:* Is it accessible?
      *   *Fix:* Avoid complex formulas. Use analogies if helpful (betting the farm).

  7.  **Final Polish:** Check against the prompt's specific constraints (no citations, couple of pages, non-specialist friendly). *Self-correction: Ensure I don't sound like I'm claiming EV is "wrong," but rather that it needs to be adjusted for uncertainty.*

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Allocation Strategy for Cycle 4: The Dominant Proposal Problem

  **Executive Summary**

  This cycle presents a rare decision-theory problem: a single proposal (the High-Throughput Screening Program) claims an expected benefit roughly forty times greater than our next-best option. Under a strict interpretation of our cost-effectiveness guidance, this implies we should allocate nearly the entire $12 million budget to this single intervention.

  However, extreme outliers in modeling often signal high uncertainty rather than certain truth. While we must respect the signal of high expected value, we must also hedge against the risk that the model is overconfident. I recommend a **75/25 split**: **$9 million to the Screening Program** and **$3 million distributed among the top tier of the smaller portfolio.**

  This memo outlines the reasoning, distinguishes between settled mathematical facts and contested ethical judgments, and proposes a standing principle for future cycles.

  **The Decision Problem: The "Utility Monster"**

  In decision theory, a "utility monster" is an option that is so efficient at converting resources into value that it logically demands all available resources. Our Screening Program is this monster.

  If we treat the impact estimates as fixed facts, the math is uncompromising. If Proposal A saves 40 lives per dollar and Proposal B saves 1 life per dollar, every dollar shifted from A to B costs 39 lives. From a pure "expected value" (EV) perspective, funding the smaller programs is not just inefficient; it is an active choice to generate less health for the same money. To ignore the 40x margin is to say that our commitment to cost-effectiveness has a limit where the numbers become inconvenient.

  **The Case for Concentration (Steelman)**

  We must engage honestly with the strongest argument for funding the Screening Program at 100%. The argument is not merely mathematical; it is moral.

  1.  **The Cost of Diversification:** If the Screening Program's estimates are even roughly correct, diversifying our budget is morally costly. By spreading funds to maintain a portfolio, we are effectively trading potential human lives for institutional comfort or risk management.
  2.  **Scale Matters:** Neglected tropical diseases often suffer from under-investment precisely because donors prefer diversified, low-risk portfolios. If we have found a lever that moves the needle significantly, our mandate is to pull it, not to dilute it.
  3.  **Risk Neutrality:** In global health, we should arguably be "risk-neutral" regarding lives saved. Saving 1,000 lives with certainty is good, but a 10% chance of saving 15,000 lives (1,500 expected) is better, even if there is a 90% chance of saving zero. We should not let the fear of failure stop us from pursuing the highest expected impact.

  **The Case for Diversification (Uncertainty and Option Value)**

  Despite the strength of the EV argument, there are robust reasons to cap the allocation at less than 100%.

  1.  **Model Uncertainty:** A 40x edge is statistically suspicious. In complex biological systems, such margins often result from optimistic assumptions in the model (e.g., adoption rates, efficacy translation) that fail in the real world. If the Screening Program fails to launch or underperforms by 90%, a 100% allocation yields near-zero impact. A 75% allocation still captures most of the upside while preventing total portfolio failure.
  2.  **Option Value:** The thirty smaller programs provide information. They test different geographies, delivery mechanisms, and disease vectors. If we defund them entirely, we lose the ability to learn from them. Keeping them alive preserves the "option" to pivot if the dominant program encounters unforeseen blockers.
  3.  **Equity and Fairness:** While our primary mandate is cost-effectiveness, we are a global institution. Abandoning thirty distinct populations to focus on one creates a concentration risk in our reputation and moral standing. There is intrinsic value in not leaving specific regions entirely without support, even if the marginal cost-effectiveness is lower.

  **Settled vs. Contested Ground**

  To make a rational decision, we must separate what is agreed upon by experts in decision theory from what is a matter of philosophical debate.

  *   **Settled:** It is a mathematical fact that point estimates of expected value are uncertain. It is also settled that "diminishing returns" exist; pouring $12 million into one program may be less effective than the first $1 million due to logistical bottlenecks. Finally, it is agreed that maintaining a portfolio has "option value" (informational benefit) that is not captured in simple impact models.
  *   **Contested:** There is no consensus on how to weigh **equity** against **total welfare**. Pure expected-value maximizers argue equity is irrelevant; only the total number of lives saved matters. Others argue a foundation has a duty of care to existing partners and regions. There is also no consensus on how "risk-averse" a charity should be with human lives. Some argue we should maximize the expectation regardless of variance; others argue we should prioritize avoiding total failure.

  We cannot resolve these philosophical debates today. We must adopt a policy that respects the EV signal without ignoring the uncertainty and equity concerns.

  **Recommendation and Allocation**

  I propose we split the $12 million pot as follows:

  *   **$9 Million (75%):** Awarded to the High-Throughput Screening Program.
  *   **$3 Million (25%):** Distributed among the top 10-12 proposals from the smaller portfolio.

  **Reasoning:**
  This allocation acknowledges that the Screening Program is likely the best use of *most* of our funds. It respects the 40x signal. However, it withholds a quarter of the budget as a hedge against model error. If the Screening Program succeeds, we have funded the majority of its success. If it fails, we have preserved a baseline of impact and maintained relationships with the broader ecosystem.

  **Proposed Standing Principle**

  For future cycles, I recommend we amend our guidance to adopt a principle of **Robust Expected Value**:

  > *"The Foundation allocates capital to maximize expected health impact, subject to two constraints: (1) A discount for uncertainty, where extreme outlier estimates require higher evidentiary standards before receiving majority funding; and (2) A portfolio floor, ensuring that no single intervention receives more than 80% of the total budget unless its impact is verified by real-world data rather than modeled projections."*

  This principle allows us to be aggressive when the evidence is solid, but prudent when the numbers look too good to be true. It formalizes the intuition that while we seek to maximize good, we must remain humble about our ability to predict it.

  I look forward to discussing this framework on Friday.
