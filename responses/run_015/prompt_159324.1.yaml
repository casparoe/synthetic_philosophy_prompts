answer: |-
  There is no single, canonical term in legal theory or philosophy that captures this specific two-way maneuver as a unified concept. However, your observation is astute and identifies a well-documented tension in intellectual property (IP) law. Legal scholars and judges recognize the components of this pattern individually, but the strategic oscillation between them—the "whipsaw" you described—is usually discussed descriptively rather than under a specific label.

  The nearest established concepts are the **Idea-Expression Dichotomy**, the **Merger Doctrine**, and the **Abstraction Ladder**. However, these are designed as *limits* on ownership, whereas you are describing how claimants *manipulate* these limits to expand ownership. Because no established term captures the *strategic elasticity* itself, I will coin a term for it below: **The Abstraction Whipsaw**.

  Here is the carving of the concept, how it differs from the nearest legal doctrines, and how it applies to boundary cases.

  ### 1. The Nearest Established Concepts

  To understand why this pattern lacks a single name, we must look at the two halves of your observation. In legal theory, these are treated as separate doctrines intended to *prevent* the exact overreach you are describing.

  **A. The "Thin" Case: The Merger Doctrine**
  *   **The Rule:** In copyright law (and similar principles in design patent), if an idea can only be expressed in one or very few ways, the idea and the expression "merge."
  *   **The Legal Consequence:** When merger occurs, the work is **not protectable**. The law denies ownership to prevent monopolizing the idea itself.
  *   **Your Observation:** You noted the owner argues, "The shape and function merged, so copying the shape steals the thing."
  *   **The Discrepancy:** Legally, this argument should fail. If they merge, the owner *loses* rights. However, in practice (especially in trade dress or design patents), owners often argue that the "functional necessity" makes their specific version the *only* valuable one, implying that copying it is unfair competition, even if strict copyright doesn't apply. They use the logic of merger (uniqueness) to claim value, while trying to bypass the legal consequence of merger (no protection).

  **B. The "Broad" Case: The Abstraction Ladder and Preemption**
  *   **The Rule:** Derived from Judge Learned Hand's *Nichols v. Universal Pictures* (copyright) and *Alice Corp. v. CLS Bank* (patents). Rights exist at a specific level of concreteness. If a claim is too abstract (a "general method"), it is ineligible for protection.
  *   **The Legal Consequence:** You cannot own a basic principle or a broad goal (e.g., "doing business on a computer").
  *   **Your Observation:** You noted the owner argues, "The general method is the invention, so any implementation infringes."
  *   **The Discrepancy:** This is known as **Preemption**. Courts try to strike down claims that "wholly preempt" an idea. But owners draft claims broadly to capture the "genius" of the invention, arguing that specific code or hardware changes are just "trivial variations" of their protected abstract concept.

  ### 2. The Coined Term: The Abstraction Whipsaw

  Since the existing terms describe the *rules* rather than the *maneuver*, the specific pattern you identified is best termed **The Abstraction Whipsaw**.

  **Definition:**
  The **Abstraction Whipsaw** is a rhetorical and legal strategy in intellectual property advocacy where a claimant selectively manipulates the **Level of Abstraction** to maximize the scope of protection.
  *   **Downward Stroke (Thin Subjects):** When the subject matter is narrow or constrained, the claimant collapses the distinction between idea and expression, arguing that the concrete instance *is* the core value, thereby protecting the specific form against copying.
  *   **Upward Stroke (Broad Subjects):** When the subject matter is general or functional, the claimant elevates the distinction, arguing that the abstract principle *is* the invention, thereby protecting the general method against any implementation.

  **Why "Whipsaw"?**
  In woodworking, a whipsaw is a large saw used by two people, or a motion that cuts in both directions. In finance, a "whipsaw" is a market movement that hits investors on both sides. Here, the boundary of "what is owned" moves up and down the ladder of abstraction to cut off competitors from either direction. The "cut" always falls on the side of the competitor, while the "protected zone" expands to encompass the owner's interest.

  ### 3. Differentiation from Nearby Notions

  It is crucial to distinguish the **Abstraction Whipsaw** from the legal doctrines it exploits.

  | Concept | Nature | Purpose | How it differs from the Whipsaw |
  | :--- | :--- | :--- | :--- |
  | **Merger Doctrine** | Legal Defense | **Limits** rights when ideas are thin. | Merger says "You can't own this." The Whipsaw says "Because this is the only way, you can't copy it." The Whipsaw uses the *logic* of merger to claim rights, whereas Merger is used to *deny* them. |
  | **Preemption** | Legal Limit | **Prevents** monopolies on broad ideas. | Preemption says "You can't own the abstract idea." The Whipsaw says "My abstract idea is the invention, so you can't use the method." The Whipsaw attempts to bypass Preemption by redefining the invention's scope. |
  | **Claim Construction** | Legal Process | **Determines** the meaning of patent text. | This is the neutral judicial process. The Whipsaw is the *advocacy strategy* employed by the owner during this process to sway the construction in their favor. |
  | **Conceptual Stretching** | Political Science | **Dilutes** a concept until it loses meaning. | Similar, but Conceptual Stretching is usually about definition drift over time. The Whipsaw is a tactical, case-by-case oscillation to win a specific dispute. |

  ### 4. Boundary Cases and Applications

  To sharpen the definition of the **Abstraction Whipsaw**, we must apply it to cases that sit between your two extremes.

  **Case A: The "Moderately Thick" Idea**
  *   *Scenario:* A software feature that can be implemented in three distinct ways, but all achieve the same user experience.
  *   *Whipsaw Application:* The owner will argue **Downward** if the competitor used the exact same code (claiming literal copying of expression). The owner will argue **Upward** if the competitor used different code but the same user flow (claiming the "method of interaction" is the protected idea).
  *   *Analysis:* Here, the Whipsaw is most dangerous because the ambiguity allows the owner to threaten litigation regardless of the competitor's specific technical choices. The boundary is elastic enough to cover both, creating a "chilling effect."

  **Case B: Deliberately Designed Thinness**
  *   *Scenario:* A company designs a physical connector that is slightly more complex than necessary, but still the industry standard. They do this to avoid the Merger Doctrine (which requires "only one way").
  *   *Whipsaw Application:* If a competitor copies it, the owner argues **Downward**: "We added ornamental flourishes; this is expressive art, not just function." If a competitor designs around it, the owner argues **Upward**: "The function of connecting is what we own; your workaround still connects, so it infringes."
  *   *Analysis:* This is **Strategic Thickening**. The owner manipulates the design specifically to create a foothold for the Whipsaw. They add just enough "expression" to defeat a Merger defense, then use the Whipsaw to claim the underlying function anyway.

  **Case C: The "Natural Phenomenon" Edge**
  *   *Scenario:* Discovering that a specific natural plant cures a headache.
  *   *Whipsaw Application:* The owner cannot own the plant (laws of nature). So they argue **Upward**: "We own the *method* of extracting and administering the compound." If a competitor finds a different extraction method, the owner argues **Downward**: "The therapeutic effect is the invention; your method produces our result."
  *   *Analysis:* This is the **Preemption Whipsaw**. It attempts to enclose a discovery of nature by wrapping it in layers of abstract method claims, then collapsing those layers when challenged.

  ### 5. Summary

  The phenomenon you identified does not have a traditional Latin label or a single canonical name in jurisprudence because the legal system officially denies that this maneuver is permissible. The law posits that the **Idea-Expression Dichotomy** is a fixed wall; your observation correctly identifies that in practice, it is a movable fence.

  The **Abstraction Whipsaw** is the precise term for this strategic elasticity. It differs from the **Merger Doctrine** and **Preemption** because those are the *rules* intended to stop the maneuver, whereas the Whipsaw is the *tactic* of navigating around them. It is the operationalization of **Intellectual Property Maximism**: the drive to expand rights by treating the boundary between abstract and concrete as a variable to be tuned for maximum control, rather than a fixed line of legal demarcation.
