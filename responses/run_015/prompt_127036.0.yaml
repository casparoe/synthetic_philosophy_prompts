answer: |-
  **The Bilateral Mirror Protocol**

  In the Bilateral Mirror Protocol, subjects A and B inhabit separate biological bodies with strictly isolated peripheral sensory streams, yet their left hemispheres are coupled via a direct cortical bridge that enforces perfect functional isomorphism of spike trains across the dyad. A monitoring neuroscientist observes identical neural firing patterns down to the microsecond in the linked tissue, despite A and B receiving distinct visual and auditory data that are computationally normalized prior to integration, resulting in a single distributed functional state token realized across two spatially distinct substrates. The physical record confirms structural unity in the linked cortex but fails to dictate whether substrate multiplicity entails subject multiplicity, leaving first-person reports privately inaccessible to the opposite subject while third-person data shows complete synchronization.

  **The Check**

  *   **What is being identified:** The numerical identity of the conscious subject (i.e., are there one or two "minds" present?).
  *   **Method of identification:** Supervenience mapping comparing the count of functional neural state tokens against the count of biological sustaining systems.
  *   **Nearby worlds where they diverge:** In World 1, the bridge is severed, causing immediate neural and phenomenal divergence (supporting pluralism); in World 2, the setup exists within a single cranium (supporting unity).
  *   **Why each theory gives the verdict it does:** The Schrödinger/Vedanta view identifies the subject with the *functional state itself*; since the state is numerically one token distributed across space, the consciousness is one. The Physicalist Pluralist identifies the subject with the *causally closed biological organism*; since there are two metabolically independent systems, there are two subjects.
  *   **Which structural feature of the bridge does the philosophical work:** The direct causal coupling that enforces *necessary synchrony* rather than contingent correlation, creating a single functional system across distinct substrates.
  *   **What collapses if you replace the bridge with just highly correlated environments:** The modal strength of the connection vanishes; without direct coupling, the systems can drift independently (contingent similarity vs. necessary identity), breaking the claim that they share a single functional state token.
  *   **How the pluralist attacks the symmetry without just appealing to bodily location:** The pluralist appeals to *metabolic independence* and *counterfactual causal capacity*; because each hemisphere is sustained by distinct biological machinery that could continue functioning if the other died, they possess distinct causal powers and potentials regardless of current symmetrical output.
