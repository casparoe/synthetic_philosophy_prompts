  I'm in a just war theory course and we're stuck on the moral equalty of combatants thing, like Walzer talks about. I have gut reactions to cases but they don't line up clean and I want to see if there's a hidden principle or if I'm just contradicting myself. Here goes, mostly sensical I think but there's one pair that really bugs me.

  First, a 19-year-old draftee fighting for an unjust invasion who'd literally be executed if he deserts. I feel like killing him in battle is wrong, or at least not the same as killing a volunteer - he doesn't have full moral equality with the enemy soldier.

  Second, a well-paid private mercenary who signed up for the same unjust war knowing exactly what it was. I think he's fair game and doesn't get the equality shield at all.

  Third, a drone pilot in Arizona who presses buttons and kills people but never risks her own life. I think she IS a legitimate target - the enemy can strike her base - but she still lacks that moral equality status? Or maybe I'm wrong and she has it?

  Fourth, a soldier fighting for a just cause but he was brainwashed from childhood in a cult-like military academy and genuinely believes false propaganda. I think he keeps combatant rights but the moral equality feels shakier.

  Fifth, two unjust armies fighting each other in some proxy conflict. Even though both sides are wrong, I still feel their regular foot soldiers are morally equal to each other.

  Sixth, a civilian nurse who occasionally loads artillery shells when the crew is shorthanded. I think she loses civilian protection but doesn't become a full combatant with equality rights - she's stuck in some weird middle zone.

  So my verdicts are all over: draftee gets protection, mercenary doesn't, drone pilot is targetable but maybe not equal, brainwashed just-cause soldier has rights but questionable equality, unjust-vs-unjust soldiers are equal, and the nurse is in limbo. The hard pair is 1 and 3 - the draftee gets protected despite being dangerous and on the ground, while the drone pilot is targetable despite being safe, so risk-to-self can't be the principle. Maybe it's about voluntary assumption of risk plus epistemic responsibility? But then case 4 messes that up because the brainwashed soldier didn't voluntarily choose his false beliefs. And case 6 doesn't fit either.

  Can you lay out one precise principle, or maybe two competing ones, that captures as many verdicts as possible? Say exactly which case I'd have to drop for each principle. And apply it to a case I haven't listed: a civilian engineer who designs autonomous targeting algorithms but never activates them herself - does she have combatant status, and does she have moral equality with soldiers on the ground?
