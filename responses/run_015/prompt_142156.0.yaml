answer: |-
  **Module:** PHILM001 Responsibility and Criminal Justice
  **Assessment:** Unseen Examination
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,300 words maximum

  **Question 1**

  Consider the following empirical scenario. Suppose we possess a well-confirmed, fine-grained measure—the 'Uptake Index'—of an agent's capacity, at the moment of acting, to recognise and respond to the moral reasons bearing on them. Suppose three findings are established:
  (1) Uptake comes in degrees and varies within a single person across situations; it is not an on/off switch.
  (2) Being held responsible in the right way (blamed, praised, asked to justify yourself) raises your later Uptake; the practice partly constitutes the very capacity it responds to.
  (3) Uptake predicts reoffending, but only where offenders are subsequently addressed in the second person; in systems that process people purely as risks (risk scores, civil detention, no moral address), Uptake atrophies and reconviction rises.

  In light of findings (1)–(3), answer the following:
  (a) Does any of this settle the debate between Dennett and Caruso regarding desert, or is there a further question the findings do not touch? If the latter, specify exactly what that question is and what would be required to settle it.
  (b) Consider a jurisdiction that adopts Caruso's public-health quarantine model but adds a compulsory 'address hearing', at which the offender is told in second-personal terms what they did and why it was wrong. The hearing has no effect whatsoever on the sentence. Is this arrangement stable? Would Dennett hold that desert is satisfied by address that changes nothing, or does desert require that the address make a difference to what happens? Would Caruso welcome this as communication without hard treatment, or object that it shapes motives for public safety and thus uses the offender as a means?
  (c) The same jurisdiction retains state honours awarded on explicitly desert-based grounds while abolishing desert-based punishment. Is this asymmetry defensible on either view?

  ***

  ### Model Answer

  The Uptake Index scenario offers a sophisticated compatibilist picture of agency, yet it does not settle the fundamental metaphysical dispute between Dennett and Caruso. While findings (1) and (2) confirm that moral responsibility practices are functionally effective and that capacity is graded, they leave untouched the question of *basic desert*. A sceptic like Caruso can grant that agents possess varying degrees of Uptake and that blaming practices improve them, while maintaining that no agent is the ultimate source of their Uptake in a way that justifies retributive suffering. The findings describe the *mechanics* of responsibility, not its *normative foundation*. To settle the debate, one would need to argue either that ultimate sourcehood is incoherent (Dennett's likely move) or that basic desert requires a control that Uptake does not provide (Caruso's move). The data alone cannot bridge the is-ought gap between 'blame works' and 'blame is deserved'.

  Regarding the compulsory address hearing within a quarantine model, the arrangement is philosophically unstable. For Dennett, desert is often tied to the appropriateness of consequences relative to the agent's capacities. If the address is purely communicative and alters neither the detention nor the stigma, it is unclear what work 'desert' is doing. On a standard reading, Dennett retains a notion of proportionality; if the agent deserves censure, that censure should arguably track the gravity of the offence in terms of hard treatment, not merely words. However, this is contested: some interpret Dennett as a pragmatic consequentialist about punishment who only retains 'desert' as a heuristic. If the latter, he might accept the hearing as sufficient social calibration. But if he is a modest realist about desert, he would likely view the hearing as insufficient; desert usually demands that the offender *fare* differently, not just be *spoken to* differently.

  For Caruso, the hearing presents a dilemma. Officially, his public health model rejects retributive hard treatment, so a hearing without sentence adjustment aligns with his rejection of suffering. However, finding (2) states that address raises Uptake, and finding (3) links Uptake to reduced reoffending. If the state mandates this address *because* it reduces risk, Caruso risks instrumentalising the offender. Using second-personal moral address to manipulate future capacity for public safety looks suspiciously like using the agent as a mere means, violating the very respect the address purports to show. Caruso might welcome the removal of hard treatment, but he must explain how moral address can be non-manipulative if its justification is purely forward-looking. If the address implies the offender *deserved* the censure, it smuggles in retributivism; if it is merely therapeutic, it undermines the second-personal standing it claims to honour.

  Finally, the asymmetry regarding state honours is difficult to defend consistently. If the jurisdiction abolishes desert-based punishment because agents lack the control required for basic desert (Caruso's view), it should logically abolish desert-based honours. Luck plays as large a role in moral achievement as in moral failure. To praise one as a hero while refusing to blame another as a villain, given identical constraints on Uptake, is arbitrary. Caruso should consistently reject both. Dennett, conversely, might defend the asymmetry on consequentialist grounds: punishment inflicts harm and requires stricter justification (desert), whereas honours confer benefits and can be distributed based on social utility or encouragement. However, if 'desert' is the stated ground for the honours, Dennett faces the same metaphysical hurdle. If agents lack basic desert, they do not deserve honours any more than punishment. The jurisdiction can only maintain this asymmetry if it treats 'desert' in honours as honorific rather than metaphysical, while treating 'desert' in punishment as metaphysical. This inconsistency suggests the jurisdiction has not fully accepted the implications of either view.

  In conclusion, the Uptake Index clarifies the functional role of responsibility but fails to resolve the normative stalemate. Both the address hearing and the honours asymmetry reveal that without settling the metaphysics of basic desert, hybrid systems risk incoherence or manipulation.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of whether Uptake settles the debate (4 marks)**
  *   **Award:** 4 marks for arguing that (1)–(3) do not settle the debate because they address functional capacity, not basic desert/ultimate responsibility.
  *   **Deduct:** 2 marks if the student claims graded capacity refutes scepticism (the 'Uptake is graded, therefore scepticism is refuted' error).
  *   **Deduct:** 4 marks if they argue the data settles the metaphysical question empirically.

  **2. Identification of the 'further question' (3 marks)**
  *   **Award:** 3 marks for identifying the distinction between forward-looking justification (consequences/Uptake) and backward-looking basic desert (control/sourcehood).
  *   **Deduct:** 3 marks if they identify the further question merely as 'how to measure Uptake' or similar empirical gaps.

  **3. Dennett on the Address Hearing (4 marks)**
  *   **Award:** 4 marks for discussing whether Dennett requires hard treatment for desert or accepts pragmatic address. *Must flag that Dennett's commitment to robust desert is contested.*
  *   **Deduct:** 2 marks if they treat Dennett as a retributivist who thinks suffering is intrinsically good (misreading).
  *   **Deduct:** 2 marks if they present one reading of Dennett as definitive without acknowledging the scholarly disagreement.

  **4. Caruso on the Address Hearing (4 marks)**
  *   **Award:** 4 marks for identifying the tension between non-manipulative respect and forward-looking risk reduction (using as a means).
  *   **Deduct:** 2 marks if they describe Caruso's model as unconstrained consequentialism permitting indefinite detention without least-restrictive-means constraints.
  *   **Deduct:** 2 marks if they fail to note the contestation regarding whether Caruso's moral address implicitly relies on desert.

  **5. The Honours/Punishment Asymmetry (3 marks)**
  *   **Award:** 3 marks for arguing that scepticism regarding punishment should logically extend to honours (luck egalitarianism), or offering a robust pragmatic defence of the asymmetry.
  *   **Deduct:** 3 marks if they assume the asymmetry is obviously defensible without argument.

  **6. Structure and Clarity (2 marks)**
  *   **Award:** 2 marks for a coherent argument that integrates (a), (b), and (c) rather than treating them as disjointed lists.
  *   **Deduct:** 2 marks if the answer is disjointed or exceeds the word limit significantly.

  **Examiner's Note on Interpretation:**
  There is genuine scholarly disagreement regarding Dennett's realism about desert and the consistency of Caruso's moral address. Students who argue the *opposite* of the model answer on these specific interpretive points (e.g., arguing Dennett *does* accept the hearing as sufficient, or Caruso *can* consistently use address) should receive full marks for criteria 3 and 4, provided they justify the interpretation philosophically. Do not penalise for lack of citations; assess the argumentative quality.
