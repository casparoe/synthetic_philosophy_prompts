answer: |-
  Hi there, you are absolutely right to be suspicious of that radio analogy because while it offers a comforting bridge for the Western scientific mind trying to grasp non-duality, it fundamentally misrepresents the metaphysics of Advaita Vedanta especially when pushed to the strict limits of vivartavada and ajata-vada that Schrödinger himself admired. If we map the correspondence as your circle does the single radio station represents Brahman or universal consciousness the signal represents the life force or awareness itself the receivers are the individual body-mind complexes and switching off a receiver corresponds to physical death the comfort comes from the idea that the signal persists independently of the hardware but this picture smuggles in a subtle dualism that collapses under scrutiny because it implies the receivers are real distinct entities existing in space and time separate from the station whereas in vivartavada multiplicity is only an apparent transformation like a rope appearing as a snake not a real transformation where one thing actually becomes many or emits many. The radio analogy suggests parinama or real modification where the station actually sends something out to something else but Vedanta insists there is no second thing to receive the signal so the separation between transmitter and receiver is the very illusion maya that needs to be seen through not reinforced by a metaphor that validates the existence of the receiver. When you take ajata-vada seriously the position Gaudapada championed and that Schrödinger found so compelling there is no creation event whatsoever meaning the station never started broadcasting and the receivers were never manufactured so there is no hidden creator-creation framework allowed here because even Ishvara the lord who might be analogized as the broadcaster is ultimately part of the appearance not a separate ontological reality standing outside the system. The analogy fails because it reifies the individual soul as a tangible object that can be switched off rather than revealing it as a false superimposition that never truly turned on and this matters significantly for your question about whether the conclusion that death is illusory survives once the disanalogies are on the table. The conclusion does survive but it shifts ground from a comforting continuity of signal to a radical negation of the dying subject because if the receiver was never real then its destruction is also unreal whereas the radio analogy suggests the receiver was real and just stopped working which still leaves a trace of duality and loss. So the analogy was carrying a specific version of the argument one based on persistence of substance rather than non-existence of separation and while it might reduce fear by suggesting consciousness continues it ultimately hinders the realization that there is no one to die and no one to live in the way we conventionally understand it. You are correct that the picture contains a hidden creator-creation framework because a broadcast implies a beginning a medium and distinct endpoints which ajata rejects entirely in favor of the view that nothing ever happened and Brahman alone exists without a second. Ultimately the radio metaphor is a dualistic tool used to explain a non-dual truth and while it might serve as a preliminary comfort it must be discarded to realize that the fear of extinction is based on the belief in a real individual who could go extinct whereas the Vedantic view Schrödinger leaned toward is that the individual is the extinction proof illusion itself. I hope this helps clarify why your intuition about the analogy smuggling in dualism was spot on and why the stricter view actually offers a more thorough dissolution of the fear of death even if it is less intuitively graspable than the radio picture. Best wishes
