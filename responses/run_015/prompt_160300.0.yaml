answer: |-
  This is a rigorous ethical audit. You have provided a set of intuitions that are internally consistent in their *moral weight* but inconsistent in their *logical basis*. Your proposed principle ("controlled channel") is elegant, but it is a **Relationship Principle**, whereas several of your verdicts rely on a **Labor Principle**.

  Here is the test of your proposed principle, followed by the two principles you requested, their costs, and the resolution of your new cases.

  ### 1. Testing Your Proposed Principle
  *Principle: You owe the originator only when the idea reached you through a channel they had a stake in controlling (confidence, employment, manuscript for purpose).*

  **Where it matches your verdicts:**
  *   **Grad Student/Advisor:** Matches. The channel (email/mentorship) implies a controlled exchange for credit.
  *   **Independent Theorem:** Matches. No channel, no debt.
  *   **Journalist:** Matches. Knowing a story *exists* is not a controlled channel.
  *   **Open Market Reverse Engineering:** Matches. Buying the product grants the right to inspect the channel.
  *   **Cabinetmaker:** Matches (with interpretation). Apprenticeship is a channel for *skill transfer*, not property hoarding. The master's stake in the channel was to teach, not to retain a monopoly on the style.

  **Where it strains or breaks:**
  *   **The Comedian (Verbatim):** **Breaks.** A stage performance is a public channel, not a controlled confidence. Your principle says this should be "Fine." Your verdict is "Not Fine."
  *   **The Biographer:** **Breaks.** An archive or published finding is a public channel. The author chose to publish. Your principle says "Fine." Your verdict is "Not Fine."
  *   **The Oaxaca Pattern:** **Breaks.** There is no specific originator to control a channel. Your principle cannot generate a verdict. Your verdict is "Not Fine."
  *   **The AI Poet:** **Strains.** Published books are a public channel. Your principle suggests "Fine." Your intuition wavers toward "Not Fine."
  *   **Line Cook vs. Cabinetmaker:** **Strains.** Both are employment/apprenticeship channels. To make the verdicts differ, you must argue the dish was a "trade secret" (controlled) while the joinery was "general skill" (uncontrolled). This requires adding a clause about the *nature of the content*, which your principle currently lacks.

  **Verdict on your principle:** It successfully explains when you *don't* owe anything, but it fails to explain why you *do* owe anything in public contexts (comedy, biography, culture). It assumes ownership is created by *secrecy*, but your intuitions suggest ownership is sometimes created by *labor* or *identity*, even in public.

  ---

  ### 2. The Two Principles

  Here are the two formulations that reconcile your verdicts. One prioritizes simplicity and social flow; the other prioritizes moral accounting and dignity.

  #### A. The Simple Principle: "The Implicit Contract"
  **Formulation:** *Ideas are free unless their transmission implied a restriction. You owe nothing unless you bypassed a gate the originator was entitled to keep closed, or violated a specific norm of the relationship through which you received it.*

  *   **Logic:** This treats ideas like air. They belong to everyone unless placed in a container (contract, confidence, trade secret).
  *   **Saves:** Grad Student, Independent Theorem, Journalist, Lab Data, Open Market Reverse Engineering, Cabinetmaker, Dumpster (discarded = abandoned control).
  *   **Forces You to Abandon:**
      *   **The Comedian:** You must accept that verbatim joke theft is only wrong if there's an industry norm (contract) prohibiting it, not because the joke is "owned."
      *   **The Biographer:** You must accept that facts found in archives are free game; citation is a courtesy, not a debt.
      *   **The Line Cook:** You must accept that unless the recipe was a documented trade secret, the cook is free to cook it.
      *   **The Oaxaca Pattern:** You must accept that without a specific rights-holder, no debt exists.
      *   **The AI Poet:** You must accept that publishing a book invites mimicry.
  *   **The Cost:** This principle makes the world safer for innovation and competition but colder for creators. It privileges the *receiver's* liberty over the *originator's* dignity. It reduces ethics to transactional boundaries.

  #### B. The Elaborate Principle: "The Labor & Dignity Account"
  **Formulation:** *You owe a debt when your gain represents a bypass of the originator's necessary labor, specifically when that labor is tied to their identity or livelihood, unless the idea is functional or foundational to human knowledge.*

  *   **Logic:** This treats ideas like crops. If you harvest what someone else planted, you owe them, unless the crop is "wild" (facts of nature) or the harvest is necessary for survival (basic skills).
  *   **Saves:** All your verdicts, including the Comedian (bypasses the labor of writing), the Biographer (bypasses the labor of discovery), the Oaxaca Pattern (bypasses cultural labor), and the Line Cook (bypasses R&D labor).
  *   **Distinguishes Biographer vs. Lab:** The Decay Constant is a fact of *nature* (no one made the universe); the Anonymous Review is a fact of *history* (someone made the attribution).
  *   **Distinguishes Cook vs. Cabinetmaker:** The Dish is a specific *product* of labor; the Joinery is a *capability* gained through labor. You can own the fruit, not the ability to grow.
  *   **The Cost:** This principle is administratively exhausting. It requires a judge (or conscience) to measure "how much labor" was bypassed and "how tied to identity" the idea is. It risks stifling the Cabinetmaker (who might be sued for style) and creates uncertainty for the AI Poet (where is the line between manner and theft?). It privileges the *originator's* dignity over the *receiver's* liberty.

  ---

  ### 3. Is It About Ideas or Relationships?

  Your intuitions reveal that **it is not about ideas.** Ideas, in the abstract, cannot be owned.

  Your verdicts show that you are actually tracking **Unjust Enrichment of Identity.**

  *   In the **Grad Student** and **Line Cook** cases, the wrong is *betrayal of relationship*.
  *   In the **Comedian**, **Biographer**, and **Oaxaca** cases, the wrong is *theft of persona*. The joke, the attribution, and the pattern are extensions of the person or culture. To take them without credit is to erase the person.
  *   In the **Lab** and **Theorem** cases, the work is viewed as contributing to a *commons*. The reward is priority (being first), not ownership.

  **Conclusion:** You are not judging the ownership of the *idea*. You are judging the fairness of the *transfer of value*. When the value is purely functional (a decay constant, a drawer joint), you allow free transfer. When the value is expressive or identity-laden (a joke, a signature dish, a biographical finding), you require recognition.

  Your proposed "Channel" principle fails because it tries to solve a "Value" problem with a "Privacy" solution.

  ---

  ### 4. Application to Your Unsettled Cases

  Here is how the two principles resolve the two cases you haven't settled.

  #### Case 1: The Employee Invention
  *An employee invents something on company time/equipment but outside their hired scope.*

  *   **The Simple Principle (Implicit Contract):** **Fine for the Company.**
      *   *Reasoning:* The "channel" is the employment relationship and the use of company resources. Even if outside the scope of hiring, the use of time and equipment creates an implicit claim. The "gate" was company property.
      *   *Verdict:* The company is owed the invention (or a share), because the employee bypassed the gate of "own time/resources."
  *   **The Elaborate Principle (Labor & Dignity):** **Fine for the Employee (with compensation).**
      *   *Reasoning:* The labor and creative spark were the employee's (identity). The company provided the soil, but the employee planted the seed. To claim the invention entirely is to bypass the employee's specific creative labor.
      *   *Verdict:* The employee owns the idea, but owes the company a "rent" for the equipment/time.
  *   **Which matches your intuition?** Given your sympathy for the Cabinetmaker (skill belongs to the worker), you likely lean toward the **Elaborate Principle** here. The invention is an extension of the employee's mind, not the company's will.

  #### Case 2: The Novelist's Half-Remembered Plot
  *A novelist takes the bare shape of a plot (death in chapter 1, story told backwards) from a book read at 15, only half-remembered.*

  *   **The Simple Principle (Implicit Contract):** **Fine.**
      *   *Reasoning:* A published book is a public channel. Reading it implies the right to absorb its lessons. There is no confidence violated. The "structural trick" is akin to the Comedian's misdirection (which you called Fine).
      *   *Verdict:* No debt. Ideas and structures are the commons of the craft.
  *   **The Elaborate Principle (Labor & Dignity):** **Not Fine (but unenforceable).**
      *   *Reasoning:* This is the "Biographer" case. The original author performed the labor of structuring that narrative arc. To use the *specific* unique structure without acknowledgment bypasses that labor. However, because it is "half-remembered," there is no intent to deceive, which mitigates the moral wrong.
      *   *Verdict:* A debt of acknowledgment exists (a nod in the afterword), but not a debt of ownership.
  *   **Which matches your intuition?** Given your verdict on the **Comedian's Structural Trick** (which you called Fine), you likely lean toward the **Simple Principle** here. You distinguished between the *joke* (expression) and the *trick* (technique). A plot structure is closer to a trick than a joke.

  ### Final Recommendation

  Your discomfort stems from trying to apply one rule to **Functional Knowledge** (how to join a drawer, a decay constant) and **Expressive Identity** (a joke, a signature dish, a biographical discovery).

  *   **Functional Knowledge** follows the **Simple Principle** (Channel/Contract). It should flow freely to improve the world.
  *   **Expressive Identity** follows the **Elaborate Principle** (Labor/Dignity). It requires recognition to preserve the humanity of the creator.

  The **AI Poet** case troubles you because it blurs this line. It uses functional tools (code) to replicate expressive identity (style). If you accept the distinction above, the verdict becomes clear: It is **Not Fine**, not because the lines were copied (Functional), but because the *manner* was appropriated without the *relationship* (Expressive). It is the Cabinetmaker's skill applied to the Line Cook's dish.
