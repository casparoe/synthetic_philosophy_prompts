answer: |-
  **Handout: *Rashomon* and the Limits of Testimonial Justification**

  **The Epistemic Impasse**
  Kurosawa's *Rashomon* is frequently cited as a metaphor for subjective truth, but for the epistemologist, it functions as a limit case for the reductionism/anti-reductionism debate regarding testimony. 

  Reductionism (associated with Hume) holds that testimony is not a basic source of justification. To believe a witness, you need independent perceptual or inferential evidence of their reliability. In *Rashomon*, the viewer (like the commoner listening at the gate) lacks independent access to the forest event. We cannot verify the bandit's boast, the wife's shame, or the samurai's honor through observation. A strict reductionist stance forces us into global skepticism: since we cannot verify the speakers' competence or sincerity against the facts, we must suspend judgment entirely.

  Anti-reductionism (associated with Reid) argues testimony is a basic source of justification; we are entitled to believe unless there are specific defeaters. However, *Rashomon* presents a scenario where defeaters are ubiquitous. The accounts are mutually exclusive. If testimony is basic, how do we proceed when basic sources contradict? The film suggests that when background norms collapse, the default entitlement to believe evaporates. We are left with neither the reductionist's evidence nor the anti-reductionist's default trust.

  **Beyond the Dichotomy: The Unreliable Self**
  The film suggests the dichotomy itself is inadequate because both positions assume a stable subject capable of sincerity and competence. *Rashomon* dramatizes the collapse of the subject. The witnesses are not merely lying to others; they are lying to themselves to preserve their egos. The bandit constructs a narrative of virility, the wife of victimhood, the samurai of honor. 

  This challenges the standard "background conditions" both epistemological camps rely on. Reductionism assumes we can assess sincerity; anti-reductionism assumes sincerity is the default. *Rashomon* shows that self-deception makes sincerity inaccessible even to the speaker. If the testifier does not know the truth of their own motives, no amount of inferential checking (reductionism) or default trust (anti-reductionism) can secure knowledge. The problem is not merely evidential; it is ontological. The film asks whether testimony can function as knowledge when the "self" offering it is a fiction constructed for survival.

  **The Ethical Turn: The Ending**
  The film refuses an epistemic resolution. We never learn what happened in the forest. Instead, the film ends with the woodcutter—who we learn is also a liar (he stole the dagger)—deciding to adopt an abandoned baby. This shift is crucial for your students to analyze. 

  After hours of debating who is telling the truth, the priest regains his faith in humanity not because the epistemic uncertainty is resolved, but because the woodcutter performs a moral act. The woodcutter's decision bypasses the question of justification. He does not know if he will be a good father, just as he does not know the truth of the murder. He acts anyway. 

  This suggests that in cases of radical testimonial conflict, the response cannot be purely epistemic. When evidence and default entitlements fail, trust becomes a moral risk rather than an epistemic calculation. The woodcutter redeems himself not by telling the truth (he remains ambiguous), but by taking responsibility for a vulnerable other. The film posits that when the architecture of knowledge collapses, ethics is the only remaining framework for engagement.

  **Teaching Takeaway**
  Use *Rashomon* to push students beyond the standard analytic framework. Ask them:
  1.  **Is skepticism the only rational response?** If reductionism demands evidence we cannot have, is skepticism too high a price?
  2.  **Can testimony be basic if selves are unstable?** Does anti-reductionism require a theory of mind the film suggests we don't possess?
  3.  **Is trust ethical?** Does the ending suggest that believing others (or acting despite not knowing) is ultimately a moral commitment rather than an epistemic status?

  *Rashomon* does not solve the debate; it exposes its human cost. It suggests that epistemology alone cannot govern our reliance on others when the truth is unknowable. We are forced to choose not what is true, but how to live with uncertainty.
