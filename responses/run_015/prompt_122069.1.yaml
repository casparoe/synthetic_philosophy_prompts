answer: |-
  # Spec Sheet: Adequacy Criteria for a Normative Theory of Geometric Rationality

  **Subject:** Normative Foundations of Geometric Growth (Kelly/Log-Utility Tradition)  
  **Context:** Non-stationary, reflexive, and ontologically uncertain environments.  
  **Objective:** Define necessary conditions for a theory to claim *normative* status (prescribing how agents *ought* to reason) rather than *heuristic* status (useful rules of thumb).

  ---

  ## I. Core Desiderata & Pressure Points

  An adequate theory must satisfy the following six criteria. Failure to meet a "Non-Negotiable" criterion reduces the theory to a heuristic or a special case of Expected Utility (EU).

  ### 1. Ergodic Recovery without Smuggled Preferences
  *   **Motivating Case:** The classic Kelly result is often criticized as merely EU maximization with a logarithmic utility function. A normative geometric theory must derive the log-criterion from the physics of time-averages vs. ensemble-averages (ergodicity breaking), not from a subjective preference for concavity.
  *   **Status:** **Non-Negotiable.** If the theory requires an exogenous risk-aversion parameter to derive the bet size, it is EU in disguise.
  *   **Difficulty:** High. Demonstrating that *time-optimality* is the unique normative standard requires arguing that agents *ought* to care about long-run growth rates even in finite or non-ergodic contexts. It must show that $\lim_{T\to\infty} \frac{1}{T} \log W_T$ is the only objective function that doesn't rely on subjective utility curvature.

  ### 2. Ontological Uncertainty (Model Risk)
  *   **Motivating Case:** Agents rarely know the true probability distribution $P$. They operate over a space of models $\mathcal{M}$. Standard Bayesian EU places a prior on $\mathcal{M}$ and integrates. A geometric theory must handle uncertainty over the *payoff structure itself* without collapsing into Bayesian EU via a "prior on priors."
  *   **Status:** **Non-Negotiable.** Real-world leverage fails due to model error, not just outcome variance.
  *   **Difficulty:** High. The standard geometric solution is to treat model uncertainty as a reduction in the effective growth rate. However, distinguishing "uncertainty about $p$" from "uncertainty about the utility of wealth" is mathematically delicate. The theory must specify how to update the *growth estimator* rather than just the *probability estimator*.

  ### 3. The Reflexive-Bet Problem (Endogeneity)
  *   **Motivating Case:** In prediction markets or large-scale institutional betting, the wager $f$ influences the odds $p$ (market impact) or the outcome $X$ (self-fulfilling/voiding prophecies). Here, $p = p(f)$. Classic Kelly assumes $p$ is exogenous.
  *   **Status:** **Non-Negotiable.** A theory failing here breaks in modern finance and AI alignment contexts.
  *   **Difficulty:** Extreme. If $p$ depends on $f$, the optimization becomes $\max_f E[\log(1 + f \cdot X(p(f)))]$. This creates a fixed-point problem where the optimal bet depends on the agent's belief about their own impact. If the agent's belief is updated *by* the decision to bet, the separation between belief and action dissolves.

  ### 4. Accommodation of One-Shot Deviations (Allais-Type)
  *   **Motivating Case:** Empirical agents systematically reject geometric optimality in high-stakes, one-shot decisions (e.g., preferring a sure \$1M over a 99% chance at \$10M, even if log-utility suggests the latter). A normative theory cannot dismiss this as "irrational noise" if it claims to describe rational agency under uncertainty.
  *   **Status:** **Contested Preference.** Strict Kelly proponents view this as human error; adequate *normative* theories should explain it as rational under hidden constraints.
  *   **Difficulty:** High. To accommodate this without utility functions, the theory must argue that "one-shot" is an epistemic illusion (every decision is part of a life portfolio) OR that geometric rationality has a finite-horizon correction that mimics risk aversion. If it fails, the theory is empirically vacuous for singular existential risks.

  ### 5. Epistemic vs. Pragmatic Distinction
  *   **Motivating Case:** Epistemic rationality demands calibrated credences (truth-tracking). Pragmatic rationality demands optimized outcomes (growth-tracking). Kelly betting often conflates the two (betting odds = credences). In reflexive environments, optimizing growth may require distorting reported credences (e.g., hedging).
  *   **Status:** **Non-Negotiable.** Collapsing belief into bet makes scientific inquiry impossible.
  *   **Difficulty:** High. If the optimal geometric bet requires hedging against model error (Fractional Kelly), does the agent report the hedged probability or the true credence? The theory must provide a scoring rule that separates *calibration* from *leverage*.

  ### 6. Principled Fractional Kelly
  *   **Motivating Case:** Full Kelly leads to high volatility and drawdown. Practitioners use "Half-Kelly." If this is just risk aversion, it violates (1). If it is rational, it must be derived from the geometry of the problem (e.g., parameter uncertainty, transaction costs, or leverage constraints).
  *   **Status:** **Non-Negotiable.** A theory that mandates full leverage in the face of parameter uncertainty is brittle and practically useless.
  *   **Difficulty:** Medium-High. The derivation must show that $f^* < f_{Kelly}$ maximizes the *true* expected growth rate when accounting for estimation error, rather than maximizing a *different* utility function.

  ---

  ## II. Incompatibility Analysis

  There is a significant tension between the following subset of criteria: **{1, 3, 5}**.

  *   **The Conflict:**
      *   **(1) Ergodic Recovery** relies on the growth rate being an objective property of the gamble independent of the agent's specific state (exogenous $p$).
      *   **(3) Reflexivity** admits that the gamble's properties ($p$, payoffs) are endogenous to the agent's action ($f$).
      *   **(5) Epistemic/Pragmatic Split** requires that the agent's belief about $p$ remains distinct from the optimization of $f$.
  *   **Why it breaks:** In a reflexive environment, the "objective growth rate" does not exist independently of the agent's strategy. To calculate the geometric optimum, the agent must model their own impact. If they model their impact to maximize growth (Pragmatic), their belief about the probability distribution shifts away from the "true" causal structure (Epistemic) because the "truth" now includes their own intervention.
      *   If you preserve **(5)** (Beliefs track truth), you cannot solve **(3)** using **(1)**'s tools, because the "truth" doesn't yield a single growth rate without specifying the bet size.
      *   If you solve **(3)** using **(1)** (Maximize growth given impact), you violate **(5)** because your "credence" becomes a function of your "bankroll" and "leverage capacity," not just evidence.
  *   **Secondary Tension:** **{1, 4}**. If geometric rationality is derived from long-run ergodicity (1), it has no normative grip on one-shot decisions (4) unless one argues that every decision is part of an infinite sequence. Accommodating one-shot risk aversion as *rational* (4) typically requires importing a utility function, which violates the "no smuggled preferences" clause of (1).

  ---

  ## III. Comparative Scorecard

  | Criterion | Pure Kelly (Log-Utility) | Fractional Kelly (Heuristic) | Bayesian EU (Risk Averse) |
  | :--- | :--- | :--- | :--- |
  | **1. Ergodic Recovery** | **Pass.** Derives from time-averages. | **Fail.** Ad-hoc reduction lacks ergodic derivation. | **Fail.** Derives from subjective utility curvature. |
  | **2. Ontological Uncertainty** | **Fail.** Assumes known $p$. | **Pass (Pragmatic).** Implicitly handles model risk. | **Pass.** Integrates over model priors. |
  | **3. Reflexivity** | **Fail.** Assumes exogenous odds. | **Fail.** No formal mechanism for endogeneity. | **Pass.** Can model $p(f)$ in the expectation. |
  | **4. One-Shot Deviations** | **Fail.** Prescribes risk-neutral log-growth. | **Pass.** Matches behavior, lacks normativity. | **Pass.** Explains via utility curvature. |
  | **5. Epistemic/Pragmatic** | **Fail.** Conflates credence with bet size. | **Fail.** Further conflates via arbitrary scaling. | **Pass.** Separates belief (P) from utility (U). |
  | **6. Fractional Justification** | **Fail.** Views fractional as sub-optimal. | **Pass (Descriptive).** Fails normative justification. | **N/A.** Risk aversion is the justification. |

  **Analysis:**
  *   **Pure Kelly** is the only candidate that satisfies (1), but it crumbles under real-world complexity (2, 3, 4).
  *   **Bayesian EU** handles the complexity (2, 3, 4) but fails the core philosophical claim of geometric rationality (1) by relying on subjective risk preferences, and risks collapsing epistemic rationality into pragmatic utility (5).
  *   **Fractional Kelly** is the industry standard but lacks a coherent *normative* foundation; it is a patch that acknowledges the failures of Pure Kelly without resolving the theoretical contradictions.

  ---

  ## IV. Conclusion

  A theory of geometric rationality can claim adequacy only if it resolves the tension between objective growth rates and subjective model uncertainty without retreating into subjective utility functions. Currently, no formulation successfully integrates reflexive endogeneity with a strict ergodic derivation while maintaining a clean separation between belief and betting strategy.

  Verdict: {1, 3, 5}
