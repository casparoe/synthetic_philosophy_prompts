answer: |-
  **Project Title:** Moral Tenancy: Obligations of the Temporary Visitor

  **The Problem**
  Tourists face conflicting normative demands. Is an American morally required to refrain from jaywalking in Berlin, or to tip in Japan where it is culturally alien? Current philosophical frameworks offer unsatisfying dichotomies. Moral universalism suggests rules are binding regardless of context, while strong relativism reduces conventions to mere preferences. Neither explains the specific asymmetry of local resentment: locals often exhibit disproportionate anger toward tourists who break queueing norms compared to locals who do the same. If conventions were merely preferences, violation shouldn't matter; if they were universal laws, local violation should be judged equally harshly. The existing models fail to capture the gradient of obligation based on membership status.

  **The Hypothesis: Moral Tenancy**
  I propose the concept of "Moral Tenancy." Visitors are not citizens bound by the full social contract, nor are they outsiders exempt from local norms. Instead, they are temporary tenants renting space within a social system. Obligations arise not from universal duty or cultural deference, but from the specific benefits extracted from the system's smooth functioning and the duration of the stay.

  **Methodology**
  The project will test this hypothesis by categorizing conventions into two duty types:
  1.  **Maintenance Duties:** Long-term obligations to uphold the system (e.g., paying taxes, consistent queueing). These fall primarily on residents.
  2.  **Non-Disruption Duties:** Short-term obligations to avoid actively degrading the system (e.g., not blocking sidewalks, not overtly disrespecting sacred spaces). These apply to tenants.

  I will apply this framework to three case studies: traffic norms (jaywalking), economic conventions (tipping), and social coordination (queueing). The analysis will focus on whether the "tenancy" model better predicts intuitive moral judgments than universalism or relativism, specifically addressing the asymmetry in local resentment.

  **Expected Outcomes and Risks**
  A successful result would yield a practical framework for travelers to determine which rules are binding based on their "tenancy length" and benefit extraction, potentially informing city tourism policies. However, I must be honest about the primary failure condition: the theory may collapse into a simple heuristic where "longer stay equals more rules," offering no distinct philosophical insight beyond duration. Additionally, distinguishing between "maintenance" and "non-disruption" may prove arbitrary in complex cases like tipping, where the line between participation and disruption is blurred.

  **Feasibility and Scope**
  For a semester-length project, this scope is realistic provided I limit the analysis to the three specified case studies. Attempting to cover all social conventions would be too ambitious. By focusing on high-friction tourist interactions, I can sufficiently test the tenancy model without needing a comprehensive theory of global justice. The project will conclude with a defense of whether "Moral Tenancy" is a distinct moral category or merely a repackaging of contractualism.
