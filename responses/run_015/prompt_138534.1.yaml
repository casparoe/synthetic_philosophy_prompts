answer: |-
  ### Preamble: Distortions and Blind Spots

  To make this procedure runnable in twenty minutes by a non-specialist, I have necessarily flattened several complex historiographical and scientific concepts.

  1.  **Linear Causality vs. Feedback Loops:** Scholarly climate history often treats human-environment interaction as a feedback loop (e.g., famine leads to war which leads to deforestation which leads to drought). This procedure forces a linear arrow (X → Y). **Misleading Effect:** It will systematically under-credit human actions that exacerbated the physical shock (e.g., poor storage worsening a drought).
  2.  **"Institutions" as Black Boxes:** The Differential-Signature Test treats "institutions" or "practices" as uniform variables. In reality, institutional weakness is often internal and invisible until tested. **Misleading Effect:** It may promote a non-human factor to "Trigger" simply because two regions had different *names* for their governments, even if both were equally fragile.
  3.  **The "Protagonist" Trap:** Academic history rarely grants non-human agents "protagonist" status; they are usually contextual. By including "Protagonist" as a verdict, I am creating a category the procedure is structurally biased against (see Step 1). **Misleading Effect:** You will get very few "Protagonist" verdicts. This is a feature, not a bug, but it may feel like the tool is fighting the producer on biological determinism cases (like 1492).
  4.  **Temporal Granularity:** The Timescale Test requires matching "shock" to "event." Scholarship often deals with "presses" (slow stress) vs. "pulses" (sudden shock). This procedure lumps them unless the Slow Variable Rule triggers. **Misleading Effect:** It struggles with "creeping normalcy," where a slow decline makes a society vulnerable to a minor shock.

  **Limitations on Causal Credit:**
  You are correct: this procedure cannot apportion degrees of credit (e.g., "60% weather, 40% policy"). It only ranks *structural role*. It also systematically under-credits agents that act on **bodies** rather than **institutions**. A pathogen that kills 50% of a population is a "Protagonist" biologically, but if the state survives, this tool may demote it to "Trigger" because the *historical narrative* (state continuity) continues. It is blind to suffering that does not result in political change.

  ***

  ### The Decision Procedure: "The Non-Human Pitch Filter"

  **Input:** A single causal claim: "X (non-human) caused/explains Y (human event)."
  **Time Budget:** 20 Minutes.
  **Operator:** Producer (no scientific training required).

  **Verdicts:**
  1.  **Protagonist:** The non-human factor overwhelmed human agency; outcome was inevitable regardless of choice.
  2.  **Trigger:** The non-human factor sparked the event, but human structures determined the magnitude and shape of the outcome.
  3.  **Backdrop:** The non-human factor was present and stressful, but did not determine the timing or specific outcome.
  4.  **Not Established:** The link is speculative, coincidental, or lacks a mechanism. (Segment cut or rewritten as coincidence).

  **The Steps:**

  **Step 1: The Mechanism Chain (Stop Rule)**
  *   **Question:** Can you name the specific human system that translated the physical shock into the historical outcome? (e.g., not "crops died," but "crops died → grain reserves were empty → prices spiked → riots occurred").
  *   **Sufficient Answer:** A chain of 3 links connecting physics to human behavior.
  *   **If Unanswered:** **Verdict: Not Established.** Narration must use coincidence language ("occurred around the same time") or segment is cut.
  *   **Common Error:** Stopping at the physical effect ("it got cold") without explaining the social consequence ("cold caused tax default").

  **Step 2: The Latency Check**
  *   **Question:** Does the timing of the shock match the timing of the event, accounting for known delays (harvest cycles, incubation periods)?
  *   **Sufficient Answer:** The gap between X and Y is explained by a specific lag (e.g., "eruption in June, famine next harvest").
  *   **If Unanswered:** Demote one verdict level (Protagonist → Trigger, Trigger → Backdrop).
  *   **Common Error:** Ignoring multi-year gaps (e.g., claiming a 1783 volcano caused a 1789 revolution without bridging the years).

  **Step 3: The Differential-Signature Test**
  *   **Question:** Did a neighbor with similar exposure but different institutions/practices have a different outcome?
  *   **Sufficient Answer:** Yes (Human variable explains the difference) OR No (Physical gradient explains the similarity).
  *   **If Answer is "Yes" (Outcome tracks human variable):** Demote non-human factor to **Backdrop**.
  *   **If Answer is "No" (Outcome tracks physical gradient):** Maintain current verdict.
  *   **Common Error:** Comparing incomparable regions (e.g., comparing Iceland to France).

  **Step 4: The Alibi Test**
  *   **Question:** Did contemporary elites use this explanation to excuse their own failure?
  *   **Sufficient Answer:** We have identified the bias and accounted for it, OR we have independent evidence overriding their claim.
  *   **If Unanswered/Ambiguous:** **Handoff to Editor.** (This is a question of narrative emphasis, not evidence).
  *   **Common Error:** Accepting "Act of God" claims from tax records without questioning who benefited from that classification.

  **Step 5: The Counterfactual & Slow Variable Check (Handoff Point)**
  *   **Question:** If the physical event happened but human choices were different, would the outcome change? (For slow variables: Did the variable *change* in this window, or was it constant?)
  *   **Sufficient Answer:** A plausible scenario where the event does not happen despite the shock.
  *   **If Answer is "Outcome would change":** Verdict is **Trigger**.
  *   **If Answer is "Outcome inevitable":** Verdict is **Protagonist**.
  *   **If Ambiguous:** **Handoff to Editor.** (This is a debate about historical weight).
  *   **Common Error:** Treating a constant background condition (e.g., "arid soil") as a cause without showing a *shift* in aridity.

  ***

  ### Worked Cases

  **Case 1: Tambora (1815) → Subsistence Crisis (1816)**
  *   **Claim:** Volcanic winter caused famine and unrest in Europe/New England.
  *   **Step 1 (Mechanism):** Pass. Ash → Cooling → Crop Failure → Price Spike → Unrest.
  *   **Step 2 (Latency):** Pass. Eruption April 1815, Harvest failure Summer 1816.
  *   **Step 3 (Differential):** Mixed. Some regions had reserves, some didn't. Severity tracked with trade policy.
  *   **Step 4 (Alibi):** Low risk. Few elites benefited from claiming "weather" over "policy" in this specific window.
  *   **Step 5 (Counterfactual):** If grain reserves existed, famine mitigated. Outcome changes.
  *   **Verdict:** **Trigger.**
  *   **Narration Line:** "The volcano broke the harvest, but it was the empty granary that turned hunger into history."

  **Case 2: Laki (1783) → French Revolution (1789)**
  *   **Claim:** Icelandic fissure eruption caused the French Revolution.
  *   **Step 1 (Mechanism):** Weak. Gas → Health/Economic shock → ? → 1789 Revolt. The chain breaks between 1783 and 1789.
  *   **Step 2 (Latency):** Fail. Six-year gap unbridged.
  *   **Step 3 (Differential):** Fail. Britain experienced similar weather shocks; no revolution. Outcome tracks human variable (French fiscal crisis), not physical gradient.
  *   **Step 4 (Alibi):** High Risk. Royalists later blamed nature to excuse fiscal mismanagement.
  *   **Step 5 (Counterfactual):** If France had solvable debt, would Laki cause a revolution? No.
  *   **Verdict:** **Backdrop.** (Demoted from Trigger due to Differential Test).
  *   **Narration Line:** "The skies darkened years before the Bastille fell, stressing a kingdom that was already breaking under its own weight."

  **Case 3: Post-1492 Epidemics → Americas Demographic Collapse**
  *   **Claim:** Old World pathogens caused the collapse of Indigenous societies.
  *   **Step 1 (Mechanism):** **FAIL/STRANGE.** The mechanism is biological (immune naivety), not social. There is no "human system" translating the shock; the shock *is* the outcome.
  *   **Step 3 (Differential):** Fail. No society resisted. The physical gradient wins everywhere.
  *   **Verdict:** **Protagonist** (by Step 5 logic), **BUT** Step 1 flags this as "Weather, not History."
  *   **Note:** This procedure fails here because it is designed for *political* history. It treats biological determinism as a "Stop" condition in Step 1, yet the evidence forces a "Protagonist" verdict in Step 5.
  *   **Narration Line:** "Where institutions once stood, the pathogen left only silence; here, biology wrote the history."
  *   **Warning:** Do not trust the Step 1 "Not Established" verdict here. This is the exception where the non-human *is* the history.

  ***

