  *   **Richard's Paradox:** Verify attribution to Jules Richard (1905) and ensure the explanation distinguishes it from Berry's Paradox.
  *   **Tarski's Undefinability Theorem:** Confirm the 1936 date and that it applies to truth/definability in formal languages.
  *   **ZFC Axioms:** Ensure the claim that Cantor's theorem is derived from ZFC is clear, as alternative set theories (e.g., constructive) may differ.
  *   **Skolem's Paradox:** Verify the explanation aligns with the model-theoretic distinction between countable models and uncountable sets.
