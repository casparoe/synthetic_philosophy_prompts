      *   **Context:** Recently studied classical Indian epistemology (Nyāya school) with a religion colleague. Key concepts: *pramāṇas* (sources of knowledge), *hetu* (reason), *vyāpti* (pervasion/invariable concomitance), *upādhi* (adventitious condition/defeater), *gavaya* example (identification by similarity), *śabda* (testimony as distinct from inference), *navyatā* (novelty condition).
      *   **Task:** Create a triage procedure for editorial assistants (no Sanskrit/training) based on Nyāya principles to evaluate short submissions (15-20 mins each).
      *   **Constraints:**
          *   Must keep Nyāya integrity (testimony $\neq$ inference, similarity $\neq$ pervasion, novelty required, *upādhi* check required).
          *   Must handle two complications: (1) Statistical/ML evidence (no clear *pramāṇa*), (2) The editor's "one inference rule" (is it valid or prejudice?).
          *   Must apply the procedure to three specific cases (AI ethics w/ vague empirics, Corporate obligations w/ analogy, Correlational study).
          *   Must be honest/harsh if the procedure dictates rejection/restructuring (even if it matches the editor's own work).
          *   Must include a "Limitations" section.
          *   Format: One page of procedure + worked cases + limitations.
          *   Language: British English.
          *   Audience: Postgraduate editorial assistants (no Sanskrit). Gloss terms.

  2.  **Deconstruct Nyāya Concepts for the Procedure:**

      *   *Pramāṇa* (Source of Knowledge): Perception (*pratyakṣa*), Inference (*anumāna*), Testimony (*śabda*), Comparison (*upamāna*).
          *   *Application:* Every claim needs a source. Is it observed? Inferred? Told by an expert?
      *   *Śabda* (Testimony): Must be a reliable speaker (*āpta*). Not just "literature says."
      *   *Anumāna* (Inference): Needs a *hetu* (reason) and *vyāpti* (pervasion).
          *   *Hetu conditions:* Present in subject (*pakṣa*), present in similar cases (*sapakṣa*), absent in dissimilar cases (*vipakṣa*).
          *   *Upādhi* (Defeater): Is there a hidden condition making the pervasion accidental?
      *   *Upamāna* (Comparison/Similarity): Knowing a *gavaya* is cow-like. Good for identification, *not* for establishing universal laws (*vyāpti*).
      *   *Navyatā* (Novelty): Knowledge must be new. No restating common ground.
      *   *Complication 1 (Stats/ML):* This looks like *anumāna* but the *vyāpti* is opaque (black box). It lacks a reliable *śabda* source if no specific researcher is cited. It needs strict *upādhi* checking.
      *   *Complication 2 (One Inference Rule):* Nyāya values rigorous checking of *vyāpti*. If a reader has to check the pervasion themselves without aid, it burdens the *pramāṇa*. The rule seems consistent with Nyāya rigor regarding *vyāpti* verification.

  3.  **Drafting the Procedure (The "One Page"):**

      *   Need clear steps.
      *   Need "Stop/Flag" points.
      *   Need British English.
      *   Need to gloss Sanskrit terms simply.
      *   *Step 1: Novelty Check.* (Is this new?)
      *   *Step 2: Source Identification.* (Perception, Testimony, Inference, Comparison).
      *   *Step 3: Testimony Validation.* (Is the speaker named/reliable?)
      *   *Step 4: Inference/Correlation Check.* (Is the pervasion justified? Any hidden conditions?)
      *   *Step 5: Analogy Check.* (Is similarity being used as proof?)
      *   *Step 6: The "One Inference" Rule.* (Address the editor's specific constraint).

  4.  **Drafting the Worked Cases:**

      *   *Case 1 (AI Ethics):* "Empirical literature has settled."
          *   *Nyāya Verdict:* Fails *Śabda*. No reliable speaker (*āpta*). Vague consensus isn't testimony.
          *   *Action:* Desk reject or major restructure (cite specific studies).
      *   *Case 2 (Corporate Obligations):* "Structurally just like" (Analogy).
          *   *Nyāya Verdict:* Fails *Anumāna*. Uses *Upamāna* (comparison) to do the work of *Vyāpti* (pervasion). Also fails *Navyatā* (everyone already accepts the base case).
          *   *Action:* Restructure (needs actual pervasion, not just likeness). *Self-reflection:* This matches the editor's draft. Must be honest.
      *   *Case 3 (Correlational Study):* Trait correlates with X, therefore disposes to X.
          *   *Nyāya Verdict:* Potential *Upādhi* (adventitious condition). Correlation $\neq$ Pervasion. Needs to rule out confounders.
          *   *Action:* Restructure (address confounders/*upādhi*). *Self-reflection:* Matches editor's past publication. Must be honest.

  5.  **Drafting the Limitations:**

      *   What does this miss? Creative philosophy, historical exegesis, normative claims that aren't empirical.
      *   Where does it misfire? Interdisciplinary work that doesn't fit neat *pramāṇa* boxes.
      *   Human judgment needed: Value of the question, stylistic merit, ethical weight.

  6.  **Refining and Polishing (Iterative Process):**

      *   *Tone:* Professional, precise, British English (e.g., "programme", "centre", "modelling").
      *   *Constraint Check:* Did I keep the Sanskrit integrity? Yes (Testimony distinct from Inference, Novelty, *Upādhi*).
      *   *Constraint Check:* Did I handle the Stats/ML issue? Yes, treated as opaque inference requiring extra scrutiny.
      *   *Constraint Check:* Did I answer the "One Inference Rule" question? Yes, validated it via *vyāpti* burden.
      *   *Constraint Check:* Honesty on Cases 2 & 3? Yes, must explicitly state they fail the procedure despite the editor's involvement.
      *   *Length:* Needs to be tight. "One page of procedure" implies conciseness, though the prompt asks for "One page of procedure plus the worked cases". I will aim for a dense but readable layout.

  7.  **Final Review against Nyāya Logic:**

      *   *Śabda:* Requires a competent speaker. "The literature" is not a speaker.
      *   *Upamāna:* Good for naming/identification, bad for establishing causal/universal links.
      *   *Vyāpti:* Must be free of *upādhi*. Correlation is a weak *vyāpti*.
      *   *Navyatā:* Knowledge must be uncontradicted and new.

  8.  **Writing the Response:** (Mental check on British spelling: *programme, modelling, centre, colour, analyse*).

      *   *Procedure Title:* Nyāya-Inspired Triage Protocol.
      *   *Glossary:* Keep it inline or footnoted? Inline is better for flow.
      *   *Case 2 & 3 Honesty:* "This procedure flags your own draft." "This procedure flags your recent publication."

      *(Self-Correction during drafting)*: Make sure the "One Inference Rule" analysis is explicit. Nyāya says the *audience* must be able to grasp the *vyāpti*. If they have to do the heavy lifting without tools, the inference is defective. So the rule holds.

      *(Self-Correction on Stats)*: Statistical models are essentially *anumāna* based on *perception* of data, but if the model is opaque, the *vyāpti* is hidden. This creates an *upādhi* risk.

      *(Final Polish)*: Ensure the distinction between *upamāna* (analogy) and *anumāna* (inference) is clear in Case 2.

  9.  **Final Output Generation** (incorporating all above thoughts).
answer: |-
  **NYĀYA-INSPIRED TRIAGE PROTOCOL FOR EDITORIAL ASSISTANTS**

  **Objective:** To filter submissions based on epistemic rigour, ensuring claims rest on valid sources of knowledge (*pramāṇas*) and avoid logical defects. You have 15–20 minutes per submission.

  **GLOSSARY OF TERMS**
  *   **Novelty (*Navyatā*):** The claim must offer new knowledge, not restate what is already generally accepted.
  *   **Testimony (*Śabda*):** Knowledge from a reliable source. Requires a named, competent speaker.
  *   **Inference (*Anumāna*):** Knowledge derived from a reason (*hetu*). Requires a universal connection (*vyāpti*) between the reason and the conclusion.
  *   **Adventitious Condition (*Upādhi*):** A hidden factor that makes a connection look universal when it is not (a confounder).
  *   **Comparison (*Upamāna*):** Knowledge from similarity. Valid for identification, invalid for proving universal laws.

  **PROCEDURE**

  **1. The Novelty Check**
  *   **Question:** Does the abstract or introduction state a conclusion that is already granted by the target audience?
  *   **Pass:** The paper argues for a specific, contested claim or offers new evidence for an old claim.
  *   **Fail:** The paper argues for a premise everyone in the field already accepts (e.g., 'agents have obligations').
  *   **Action:** If **Fail**, Desk Reject. *Stop.*

  **2. Source Identification**
  *   **Question:** For every major empirical or factual premise, can you identify the source type?
      *   **A. Perception:** Direct observation or data presented in the paper.
      *   **B. Testimony:** Citation of a specific researcher or established text.
      *   **C. Inference:** A logical step derived from A or B.
      *   **D. Statistical/Model Output:** Treated as *Inference* based on opaque perception.
  *   **Action:** If a premise has no source (e.g., 'the literature says'), flag for **Human Review**. *Do not pass.*

  **3. Testimony Validation (*Śabda*)**
  *   **Question:** If the source is Testimony, is there a named, competent speaker (*āpta*)?
  *   **Pass:** 'Smith (2023) demonstrates...'
  *   **Fail:** 'It is well known...', 'The consensus is...', 'Empirical literature has settled...'
  *   **Action:** If **Fail**, Return for Restructuring. *Vague consensus is not testimony.*

  **4. Inference and Pervasion Check (*Anumāna & Vyāpti*)**
  *   **Question:** If the paper argues X causes/disposes Y, is the connection justified?
  *   **Pass:** The paper argues for the connection and rules out alternative explanations.
  *   **Fail:** The paper assumes correlation implies disposition without addressing confounders.
  *   **Action:** If **Fail**, check for *Upādhi* (Adventitious Condition). Is there a third factor Z that explains both X and Y? If yes, Return for Restructuring.
  *   **Constraint (The 'One Inference' Rule):** A note may contain at most **one** inference where the reader must verify the universal connection themselves. All other steps must be explicitly justified or observed.
      *   *Rationale:* Nyāya requires the *vyāpti* (pervasion) to be graspable. Burdening the reader with multiple unverified leaps invalidates the knowledge source.
      *   *Action:* If >1 unverified inference, Return for Restructuring.

  **5. The Analogy Trap (*Upamāna*)**
  *   **Question:** Does the paper argue that because Case A is *like* Case B, the rules of B apply to A?
  *   **Pass:** Analogy is used for illustration or identification only.
  *   **Fail:** Analogy is used as the primary proof for a normative or causal claim.
  *   **Action:** If **Fail**, Return for Restructuring. *Similarity is not pervasion.*

  **6. Statistical/Model Complications**
  *   **Question:** If the evidence is a black-box model or large corpus analysis:
      *   Is the method reproducible?
      *   Is the 'pervasion' (the pattern) inspectable?
  *   **Action:** If the pattern is asserted without inspectable steps, flag for **Human Review**. This lacks a clear *pramāṇa*.

  **HUMAN REVIEW FLAGS**
  Send to the Editor immediately if:
  1.  The paper relies on 'consensus' without named speakers.
  2.  The paper uses statistical models where the correlation mechanism is opaque.
  3.  The paper fails the Novelty Check but argues the novelty is in the *method*.
  4.  You are unsure if a similarity claim is illustrative or probative.

  ***

  **WORKED CASES**

  **Case 1: AI Ethics Note (2,500 words)**
  *   **Premise:** "The empirical literature has now settled that users form durable attachments to chatbots."
  *   **Procedure Application:**
      *   **Step 2 (Source):** Fails. No specific data or observation presented.
      *   **Step 3 (Testimony):** Fails. "The literature" is not a competent speaker (*āpta*). "Has settled" is vague testimony.
      *   **Step 1 (Novelty):** If the attachment claim is the foundation, and it is unsupported, the ethical conclusion collapses.
  *   **Verdict:** **Return for Restructuring.**
  *   **Required Changes:** The author must cite specific studies (valid *Śabda*) or present new data (valid *Perception*). They cannot rely on a gesture at consensus. Without a reliable source, the testimony is defective (*apramā*).

  **Case 2: Corporate Obligations (Editor's Draft)**
  *   **Premise:** Corporate actors bear obligations because the case is "structurally just like" a person acting through an agent.
  *   **Procedure Application:**
      *   **Step 1 (Novelty):** Risk. If "everyone in the literature already accepts" the base case of personal agency, does this add new knowledge? If the move to *corporate* agency is the only new claim, proceed.
      *   **Step 5 (Analogy):** **Fail.** The argument rests on *Upamāna* (similarity). It attempts to use likeness to establish a normative pervasion (obligations). Nyāya dictates similarity identifies objects (the *gavaya* is cow-like); it does not establish universal laws (*vyāpti*).
      *   **Step 4 (Inference):** To pass, this must be converted to *Anumāna*. The author must show the *reason* for obligations (e.g., capacity for rational choice) is present in the corporation, not just that the corporation is *like* a person.
  *   **Verdict:** **Return for Restructuring.**
  *   **Honest Assessment:** This procedure rejects your current draft. The analogy is epistemically insufficient.
  *   **Required Changes:** You must establish a *vyāpti* between 'capacity for rational choice' (or relevant *hetu*) and 'bearing obligations', then demonstrate the corporation possesses that capacity. Do not rely on structural likeness.

  **Case 3: Correlational Study Note (Editor's Recent Publication)**
  *   **Premise:** People scoring high on Trait T are more likely to do X; therefore, Trait T disposes them to X.
  *   **Procedure Application:**
      *   **Step 4 (Inference/Upādhi):** **Fail.** Correlation is not pervasion. The procedure demands a check for *Upādhi* (adventitious condition). Is there a third variable (e.g., social environment) causing both T and X?
      *   **Step 6 (Statistics):** The 'pervasion' depends on a model step that may hide confounders.
  *   **Verdict:** **Return for Restructuring.**
  *   **Honest Assessment:** This procedure rejects the note you published last year. The leap from correlation to disposition is a classic *upādhi* error.
  *   **Required Changes:** The author must explicitly rule out the most likely confounders. They must argue why the correlation is not accidental. If they cannot inspect the causal mechanism, they must downgrade the claim from 'disposes' to 'correlates with'.

  ***

  **LIMITATIONS AND HUMAN JUDGEMENT**

  **Where the Procedure Misfires**
  1.  **Historical/Exegetical Work:** This protocol is designed for epistemic claims about the world. It will incorrectly flag papers analysing historical texts where 'truth' is secondary to 'interpretation'.
  2.  **Normative Innovation:** Papers proposing new ethical frameworks may fail the Novelty Check if the editor confuses 'unfamiliar' with 'new knowledge'.
  3.  **Interdisciplinary Synthesis:** Work combining distinct fields may look like it lacks a single *pramāṇa* when it is actually building a bridge between them.

  **Systematic Disfavour**
  *   **Speculative Metaphysics:** Claims that cannot be traced to perception, testimony, or strict inference will be desk-rejected.
  *   **Purely Negative Claims:** Papers arguing only that 'X is not Y' without establishing what X *is* may fail the Novelty condition (as they produce no new positive cognition).

  **Verdicts Never to be Automated**
  *   **Ethical Weight:** An assistant cannot judge if a topic is *worth* publishing, only if it is *knowable*.
  *   **Style and Clarity:** A valid inference can be written poorly.
  *   **Field-Specific Nuance:** If a sub-field has a specific convention for 'consensus' that differs from general epistemology, the Editor must override the Testimony Validation step.

  **Final Note on the 'One Inference' Rule**
  Your rule survives the translation. Nyāya insists that for knowledge to be transmitted, the receiver must be able to grasp the *vyāpti*. If a paper demands the reader verify multiple pervasions without aid, it fails as a vehicle of knowledge (*pramā*). It is not prejudice; it is a requirement for successful communication.
