prompt: |-
  ok so im doing this little project for my schools art club and ive been getting kinda stuck on something, my teacher said to ask people about it so here goes

  theres this pattern I keep noticing and I cant tell if it actually adds up. The big museum near us still hangs paintings by a guy everyone now knows treated the women in his life horribly, and they even spent a ton of money restoring one of them, but they put a little sign next to it now saying what he did, and his name got taken off the cafe. But last year when a director got accused of abusing his actors, the studio just shelved the movie he had finished, like it never existed, and nobody has seen it. And my friend who does youth theatre said their group cut a song out of a show because singing it felt like saying the guy who wrote it was fine, but they still listen to his other songs at home. So we keep some of it and put a warning label on it, we bury other stuff completly, and we cut some things at random.

  My teacher said somthing like: when you enjoy a work you're sort of taking the artist's side, or joining in with them, so it matters whether the bad thing is visible in the work itself or whether the work would be just as good if you didn't know anything about who made it. I didn't totally follow.

  What I want: what does this mix of stuff actually presuppose about whether something can be great art while also being made by a bad person, and about the difference between keeping a work around and honoring it? Does the museum thing assume the value is all in the object while shelving the movie assumes enjoying it is a kind of endorsement, and are those two beliefs even compatible? Which bits of the pattern really need a strong belief like that and which bits would lots of different views explain just as well? And what would we have to start doing differently if we believed a work's moral flaws are always part of its artistic value?

  Can you answer in exactly five numbered points, each one or two sentences, with no intro and no wrap-up sentence at the end. thanks!!
