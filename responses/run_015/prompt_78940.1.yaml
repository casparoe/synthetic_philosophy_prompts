      *   **Length:** Roughly 700 words.
      *   **Format:** Numbered question-and-answer.
      *   **Key Comedy Source:** The specific conditions of the CJT (independence, competence > 0.5, binary choices, large N) vs. how the company implements them (rigidly adhering to the letter while violating the spirit).
      *   **Specific Requirements:**
