          *   Address Condorcet cycles (intransitive preferences) by handing power to the agenda-setting office without acknowledging the power shift.
          *   Include a short quoted dissenting memo from an in-house statistician (staying in corporate register).
          *   Ending: Ambiguous line (reassuring or appalling).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Premise:* If each voter has an independent probability $p > 0.5$ of choosing the correct option between two alternatives, the probability that the majority chooses correctly approaches 1 as the number of voters $n$ approaches infinity.
      *   *Condition 1:* Binary choice.
      *   *Condition 2:* Independence (no communication/correlation).
      *   *Condition 3:* Competence ($p > 0.5$).
      *   *Failure Mode 1:* If $p < 0.5$, adding more voters makes the group *less* likely to be correct (approaches 0).
      *   *Failure Mode 2:* Condorcet Paradox (cycling majorities) when there are >2 options.

