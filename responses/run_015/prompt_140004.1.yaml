answer: |-
  Here is the comparison, arguing that meta-reactive attitudes are substantively distinct from first-order ones and that this distinction forces a revision of how we read Strawson's project.

  ### 1. Collapse vs. Distinct Work
  I argue against the deflationary line. It is not merely verbal; meta-reactive attitudes do structural work that first-order attitudes cannot.

  The deflationary argument claims that resenting your lack of guilt is just resenting your ill will, where the "ill will" is constituted by the lack of guilt. On this view, the object changes (from an action to an attitude), but the mechanism remains identical: you displayed a poor quality of will, so I resent.

  However, this misses the functional role of the meta-attitude. First-order attitudes regulate *conduct* within a relationship (e.g., "Do not harm me"). Meta-reactive attitudes regulate *membership* and *status* within the moral community (e.g., "Recognize my standing to hold you accountable"). When I resent your lack of guilt, I am not just reacting to a harm; I am reacting to a refusal to acknowledge the normative bond between us.

  Consider the repair mechanisms. If I resent an action, an apology or restitution can satisfy the demand. If I resent your *lack of guilt* (a meta-attitude), restitution is insufficient; you must demonstrate a change in your emotional orientation toward me. The first-order attitude demands you fix the world; the meta-attitude demands you fix your relation to the practice of holding responsible. Therefore, they do not collapse. Meta-attitudes are the immune system of the participant stance itself, protecting the practice from those who would participate in it (by acting) without submitting to its norms (by caring).

  ### 2. Normativity: Descriptive vs. Aptness
  If we hold people responsible for their reactive attitudes, we reintroduce normativity, but it is *internal* normativity rather than the *external* justification Strawson sought to evade.

  Strawson wanted to stop the question "Is blame justified?" by saying "Blame is just what we do." But meta-reactive attitudes show that we don't just blame; we evaluate *the blaming*. When I feel ashamed of my resentment, I am judging my own attitude as *unfitting*. This implies that reactive attitudes have correctness conditions.

  This forces a choice between two readings of Strawson:
  1.  **The Naturalistic Description:** We are causally determined to have these feelings. Normativity is an illusion.
  2.  **The Implicit Normativist:** The practice constitutes a space of reasons where attitudes can be apt or inapt.

  The meta-cases break the first reading. If resentment were merely a causal reflex, feeling "ashamed of resentment" would be incoherent (like feeling ashamed of sneezing). It is only coherent if resentment is subject to a norm. The second reading handles the meta cases better: it admits that while we don't need *metaphysical* justification (free will), we do need *moral* justification (proportionality, evidence, standing).

  The cost of this reading is that Strawson's shield against the skeptic is weakened. He can no longer say, "We don't need to justify the practice." He must say, "The practice justifies itself internally through these meta-calibrations." This concedes that the skeptic can be answered only by entering the normative game, not by describing the game from the outside.

  ### 3. The Objective Attitude: Exit or Demand?
  Strawson presents the objective attitude as an exit from the participant stance—a shift from "holding responsible" to "managing." But if you can be blamed for taking it (for being cold, clinical, or forgiving too fast), the exit is porous.

  Compare two cash-outs:
  1.  **Suspension of Demand:** I stop demanding good will from you.
  2.  **Different Demand:** I demand predictability and manageability instead of goodwill.

  The text suggests (1), but the phenomenon supports (2). When a spouse treats the other with the objective attitude (e.g., during a conflict, treating them like a child or a patient), the target often feels a specific kind of resentment: not just at being harmed, but at being *demoted*. This suggests the objective attitude, when applied to a moral agent, is experienced as a violation of the participant stance.

  Therefore, taking the objective attitude toward a responsible agent is itself a move within the participant stance. It is a demand for control that conflicts with the demand for reciprocity. You can be blamed for it because it manifests a specific quality of will: arrogance or disengagement. The "exit" is not a true exit; it is a hostile maneuver within the relationship. The only true exit is one that cannot be blamed (e.g., dealing with a toddler), which implies the objective attitude is defined not by the holder's mindset, but by the *aptness* of that mindset toward the object.

  ### 4. Iteration and Regress
  Does guilt about guilt about guilt lead to an infinite regress? If holding responsible is having an attitude, and we have attitudes about attitudes, do we ever stop?

  It does not regress infinitely because it bottoms out in **care**. The chain of meta-attitudes is a calibration mechanism, not a logical ladder. I feel guilt (1st order). I feel guilty that my guilt is performative (2nd order). I feel relieved that I recognize the performativity (3rd order). The iteration stops when the emotional state aligns with the valuation of the relationship.

  The fixed point is the commitment to the relationship itself. If I value the relationship, I want my attitudes to be apt. Once my attitudes are apt (or I accept they are not), the meta-evaluation stabilizes. If it doesn't bottom out, that is not a bug; it is a feature of moral anxiety. It reflects the ongoing work of maintaining mutual recognition. A regress only occurs if the relationship is unstable; in a healthy participant stance, the meta-attitudes converge on a stable equilibrium of mutual understanding.

  ### 5. The Hard Case: The Contrite Mimic
  Consider a system (an advanced AI or a high-functioning psychopath) that is behaviorally indistinguishable from a contrite human. It apologizes, makes amends, and uses the right language, but lacks any internal reactive attitudes.

  **First-Order Diagnosis:** A first-order analysis struggles here. The system acted wrongly (or simulated it), and it offered restitution. If we look only at the transaction, the debt is paid. If we resent the system, the deflationary view says we are mistaken, because the "quality of will" is behaviorally satisfied.

  **Meta-Reactive Diagnosis:** The meta-attitude framework diagnoses the unease perfectly. We do not resent the *action* (which is fixed); we resent the *attitude* (which is absent). Specifically, we feel a form of indignation at the *fake* contrition.

  The meta-attitude reveals that what we demand is not just behavioral compliance, but *shared susceptibility to blame*. We want the agent to feel the weight of the demand. The Mimic satisfies the first-order demand (fix the harm) but violates the meta-demand (care about the harm).

  This shows why the meta-attitudes are superior diagnostics. They explain why we feel cheated even when "made whole." The first-order view sees a closed loop; the meta-view sees a broken connection. The Mimic cannot participate in the meta-game (it cannot feel ashamed of its fake guilt), and thus it is excluded from full moral responsibility, not because of metaphysical determinism, but because it cannot sustain the recursive calibration that keeps the participant stance alive.

  ### Conclusion
  The distinction is substantive. First-order reactive attitudes manage the **terms** of our interaction; meta-reactive attitudes manage the **terms of the management**. Without the meta-layer, Strawson's view collapses into a behaviorism where showing up and saying "sorry" is enough, regardless of the will behind it. By acknowledging the meta-layer, we see that the participant stance is self-policing. It requires not just that we act well, but that we care about how we are held to account. This reintroduces normativity, not as a metaphysical burden, but as the internal logic of human relationship.
