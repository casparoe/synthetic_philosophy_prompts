answer: |-
  This is a sophisticated request that requires careful philosophical archaeology. You are asking for a conceptual mapping between two distinct normative frameworks: Bentham's classical utilitarianism (specifically his unpublished sexual ethics) and contemporary public health ethics (specifically harm reduction).

  Below is the systematic translation of Bentham's arguments into your vocabulary, followed by the residue report and the verdict on the hedonic calculus.

  ### Part I: Systematic Translation
  **Source:** Bentham's unpublished manuscripts on sexual offenses (e.g., *Offences Against One's Self*, c. 1785).
  **Target:** Contemporary Public Health Ethics & Harm Reduction Framework.

  | Bentham's Concept / Argument | Public Health / Harm Reduction Translation |
  | :--- | :--- |
  | **The Threshold of Harm:** Bentham argues that consensual "irregularities" produce no physical pain, injury, or involuntary deprivation to the participants. Therefore, they fail the necessary condition for state interference. | **Absence of Primary Harm:** The behavior does not meet the threshold for **primary harm** (direct physiological or psychological damage intrinsic to the act). Without evidence of primary harm, the **proportionality principle** in public health law prohibits coercive intervention. |
  | **The Manufacture of Suffering:** Bentham contends that the pain associated with these acts is not intrinsic but is created by the legal penalty and the social shame attached to it. | **Secondary Harm & Iatrogenesis:** The morbidity associated with these practices is largely **secondary harm** generated by the policy response. Criminalization functions as an **iatrogenic intervention**, where the "treatment" (law/punishment) produces worse population-level health outcomes (mental health comorbidities, care-seeking delays) than the "condition" itself. |
  | **Opprobrium as Mechanism:** Bentham identifies social disgust ("popular displeasure") as a multiplier of pain that the law legitimizes and amplifies. | **Stigma as a Social Determinant:** Legal prohibition codifies **stigma**, transforming a social attitude into a structural barrier. This stigma operates as a **social determinant of health**, driving the behavior underground, reducing access to sexual health services, and increasing STI transmission vectors. |
  | **The Principle of Antipathy:** Bentham argues that prohibitions are often based on irrational dislike masquerading as moral reason. Legislators punish because they feel disgust, not because they can demonstrate utility loss. | **Evidence-Free Policy & Moralizing:** This maps to policy driven by moral intuition rather than **epidemiological evidence**. It critiques the use of "community standards" or "moral offense" as valid public health justifications, identifying them as bias that undermines **health equity**. |
  | **Offense to Sensibilities:** Bentham dismisses the "disgust" of third parties as insufficient to outweigh the liberty and pleasure of the participants, labeling it a "prejudice." | **Balancing Rights and Distress:** In PH ethics, mere "offense" or psychological discomfort of observers cannot justify restrictions on autonomy unless there is a demonstrable **health threat**. Bentham's dismissal anticipates the rejection of "moral distress" as a valid counterweight to **bodily autonomy** in harm reduction models. |
  | **The Hedonic Calculus:** Bentham proposes summing the pleasures of the actors against the pains of the observers and the state to find the net utility. | **Population Health Metrics:** This anticipates **Cost-Benefit Analysis (CBA)** or **Cost-Effectiveness Analysis (CEA)**. The "sum" is the aggregate health outcome of the population, weighing the benefits of autonomy/reduced stigma against the costs of enforcement and disease burden. |

  ***

  ### Part II: The Residue Report

  Here we analyze the fidelity of the translation. Where does the mapping hold, where does it stretch, and where does it break?

  #### 1. Clean Translations (High Fidelity)
  *   **Primary vs. Secondary Harm:** This is the strongest link. Bentham's distinction between the act (pain-free) and the punishment (painful) is structurally identical to the harm reduction distinction between drug use/sexual behavior (primary) and criminalization/policy (secondary). Both frameworks agree that the state can be a vector of disease and suffering.
  *   **Stigma as Multiplier:** Bentham's insight that law licenses social opprobrium translates cleanly into the modern understanding of stigma as a structural driver of health disparities. Both agree that stigma is not just a feeling but a mechanism of harm production.
  *   **Iatrogenic Policy:** Bentham's view that the law creates the mischief it claims to prevent is a precise philosophical ancestor to the concept of iatrogenesis in social policy.

  #### 2. Distorted or Stretched Translations (Medium Fidelity)
  *   **The Nature of "Offense":** Bentham dismisses third-party offense almost instantly as irrational. Contemporary public health ethics is sometimes more cautious here. While harm reduction minimizes offense, PH policy sometimes must navigate "community engagement" where community values (even if moralistic) hold political weight. Translating Bentham's radical dismissal of offense into PH vocabulary risks overstating how easily PH ethics discards community moral distress, even when it *should*.
  *   **The "Principle of Antipathy":** In Bentham, this is an epistemological claim about *why* people reason badly (they feel, then rationalize). In PH, we often treat this as "bias" or "lack of evidence." The translation stretches slightly because PH assumes a neutral evidence base is possible, whereas Bentham is suggesting the very *language* of morality is corrupted by antipathy. PH tries to fix the data; Bentham wants to fix the vocabulary of value.

  #### 3. No Expression (The Breakdown)
  *   **Pleasure as a Positive Good:** This is the significant residue. Bentham counts the *pleasure* of the sexual act as a positive credit in the ledger. Contemporary public health is largely **pathology-focused**. PH metrics (DALYs, QALYs) measure the *absence of disease* or *functional health*, not the presence of pleasure or happiness. PH seeks to minimize harm; Bentham seeks to maximize utility. PH has no standard vocabulary for coding "sexual pleasure" as a health gain, only for coding "sexual dysfunction" or "STI" as a loss.
  *   **The Sovereignty of the Individual Sensorium:** Bentham insists that the individual is the sole judge of their own pleasure. PH operates on **paternalistic premises** (soft or hard) where the state or expert determines what constitutes a "healthy" choice, regardless of the individual's subjective utility.

  ***

  ### Part III: The Hedonic Calculus vs. Public Health Metrics

  You asked specifically about the commensurability of pleasures/pains (Bentham) versus trade-off metrics like QALYs/DALYs (PH).

  **The Divergence:**
  Bentham's hedonic calculus assumes **cardinal commensurability**. It posits that liberty, pleasure, pain, and security can all be reduced to a single unit of "utility" and summed across persons. It implies a "view from nowhere" where the calculator is neutral and the units are stable.

  Public Health metrics (QALYs/DALYs) are **operational proxies**, not metaphysical claims.
  1.  **Scope:** QALYs measure *health-related* quality of life. They explicitly exclude non-health utilities (e.g., the pleasure of a risky behavior that doesn't kill you immediately, or the financial cost to the state). Bentham's calculus includes *everything*.
  2.  **Incommensurability:** Modern bioethics and PH often acknowledge that some values (autonomy, justice, health) are incommensurable. We use "frameworks" to balance them, not a "calculus" to solve them. Bentham believes the math *can* be done; PH knows the math is a heuristic for decision-making under uncertainty.
  3.  **Distribution:** Bentham's "everybody to count for one" is aggregative. It allows for massive sacrifice of a minority if the total sum increases. PH ethics, influenced by Rawls and prioritarianism, increasingly incorporates **equity weights**. We care *who* suffers the DALYs, not just the total count. Bentham's calculus is blind to distribution unless it threatens future security.

  **Does PH have a counterpart?**
  Only in a limited, technocratic sense. Cost-Effectiveness Analysis is the bureaucratic ghost of the Hedonic Calculus. But where Bentham saw a moral imperative to calculate true utility, PH views CEA as a resource allocation tool within a constrained budget.

  ***

  ### Part IV: Final Verdict on the Residue

  **Where the translation fails, is PH vocabulary impoverished, or did we wisely leave Bentham behind?**

  **Verdict:** Public Health has wisely left Bentham's metaphysical commitments behind, though at the cost of some rhetorical power.

  1.  **On Commensurability:** Bentham's assumption that all pleasures and pains are commensurable is a philosophical weakness, not a strength. It smuggles in the idea that sexual pleasure and physical pain are the *same kind of thing* merely differing in intensity. Public Health's refusal to reduce everything to a single utility metric is a strength. It allows us to say, "This policy improves aggregate health metrics but violates justice," without being forced to mathematically resolve the tension. Bentham's calculus forces a false precision; PH metrics (when used ethically) acknowledge uncertainty and value pluralism.
  2.  **On Pleasure:** Here, **PH vocabulary is impoverished.** By focusing almost exclusively on morbidity and mortality (the absence of harm), PH lacks the conceptual architecture to advocate *for* pleasure as a health outcome. Bentham's framework is superior here: he recognizes that sexual liberty is a positive good, not just the absence of disease. PH harm reduction often defends risky behaviors neutrally ("if you do it, do it safely"), whereas Bentham defends them positively ("this adds to the sum of happiness").
  3.  **On the Neutral Calculator:** Bentham assumes the utilitarian calculator can be neutral. PH has learned (through critical public health and social epidemiology) that the "calculator" is always political. Who decides the weight of a QALY? Who defines "stigma"? PH's skepticism of the neutral observer is a maturation beyond Bentham's Enlightenment optimism.

  **Conclusion for your Dissertation:**
  You can faithfully claim Bentham as a conceptual ancestor regarding **secondary harm** and **iatrogenic policy**. His argument that "the law creates the crime's suffering" is the 18th-century formulation of "criminalization is a social determinant of health."

  However, do not lean on his **Hedonic Calculus** as a methodological precursor to QALYs/DALYs. That is a category error. Instead, use Bentham to critique the limitations of current PH metrics. You can argue that by failing to account for **pleasure as a positive health asset** (a Benthamite move), contemporary public health inadvertently reinforces the "principle of antipathy" by treating non-procreative or non-normative sex as a risk to be managed rather than a utility to be maximized. Bentham gives you the ethical permission to center pleasure; PH gives you the epidemiological tools to measure the harm of suppressing it.
