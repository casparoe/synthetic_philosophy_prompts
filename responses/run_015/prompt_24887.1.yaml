      *   *Hedonic Calculus:* Summing pleasures and pains to determine policy.

  3.  **Deconstruct Public Health/Harm Reduction Vocabulary:**
      *   *Primary Harm:* Direct physical/psychological damage from the behavior itself.
      *   *Secondary Harm:* Damage caused by the response to the behavior (policy, stigma, criminalization).
      *   *Stigma:* Social determinant of health, barrier to care.
      *   *Iatrogenic Effects:* Harm caused by the "treatment" (in this case, legal intervention).
      *   *Proportionality:* Intervention must match the severity of the threat.
      *   *Metrics:* QALYs (Quality-Adjusted Life Years), DALYs (Disability-Adjusted Life Years), Cost-Effectiveness Analysis (CEA).
