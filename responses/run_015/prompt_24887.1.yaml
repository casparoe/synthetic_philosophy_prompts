      *   *Bentham:* "Offense to sensibilities." -> *PH:* Moral distress of observers vs. Health Impact Assessment (needs to be weighed against rights).
      *   *Bentham:* "Principle of Antipathy." -> *PH:* Bias/Stigma as a driver of policy rather than evidence.
      *   *Bentham:* "Hedonic Calculus." -> *PH:* Population Health Metrics / Cost-Benefit Analysis.

      *Constraint Check:* Must be faithful. Don't make Bentham sound like a modern epidemiologist, but show where the *logic* aligns.

  5.  **Drafting the Residue Report (Section 2):**
