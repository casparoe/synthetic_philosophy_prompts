      *   *Distorted/Stretched:* "Offense." Bentham dismisses it easily; PH has to deal with "community values" sometimes, though harm reduction pushes back. "Antipathy" is broader than just stigma; it's epistemic.
      *   *No Expression:* The metaphysical status of "pleasure." PH cares about health outcomes, not raw hedonic utility.

  6.  **Addressing the Hedonic Calculus vs. Public Health Metrics (The Core Critical Question):**
      *   *Bentham:* Cardinal utility. All pleasures/pains are commensurable on a single scale. Theoretically precise summing.
      *   *PH:* QALYs/DALYs are proxies. They measure *health* status, not total utility. They often ignore distributional equity (though increasingly considered). They are pragmatic, not metaphysical.
      *   *Divergence:* Bentham wants the *true* sum of happiness. PH wants the *best achievable health outcome* within constraints. PH acknowledges incommensurability (e.g., liberty vs. health) more readily than classical utilitarianism.
      *   *Verdict:* PH metrics are operational tools, not philosophical claims about the nature of value. Bentham's calculus is a philosophical claim. PH has left behind the idea that *everything* reduces to a single metric of utility, focusing instead on specific health domains. Is PH impoverished? No, it's more modest and pragmatic. Is Bentham smuggling commitments? Yes, commensurability is a huge assumption.

