  *(Self-Correction on Bentham's Manuscripts)*: I need to be careful not to attribute modern germ theory to Bentham. He argued from the lack of *physical* pain/injury in the act itself, not specifically STI transmission (though he acknowledged disease risk could be a secondary issue to manage, not criminalize). I must ensure the translation reflects *his* reasoning (no direct injury) mapped to *our* reasoning (primary harm assessment), without claiming he anticipated epidemiology.

  *(Refining the "Antipathy" point)*: Bentham's "Principle of Antipathy" is the idea that people punish things simply because they dislike them, calling it "reason" or "nature." In PH, this maps to "moralizing policy" or "stigma-driven intervention" lacking evidence base.

  *(Refining the Calculus point)*: Bentham's calculus is aggregative and cardinal. PH metrics are often aggregative (population level) but usually ordinal or bounded (health states). The divergence is on *commensurability*. PH admits trade-offs are hard; Bentham thinks they are solvable math problems.

