  You will need four tables arranged in a square, each with a large sheet of card, coloured markers, scissors, glue, and a bowl of coloured tokens. Seat the sixteen students in four groups of four and tell them nothing about the topic until the clock reads 10:00 AM. At 10:00 AM hand each group a packet of cards with simple replacement rules printed on them, such as red token becomes two blue tokens, and ask them to simulate the machine for five minutes. At 10:05 AM give them the critical instruction which must be written on a slip of paper to avoid vocal emphasis. Rule one, the machine must output a string of tokens that describes its own rule set. Rule two, the description must use the same tokens the machine manipulates. Rule three, no metalanguage or external labels are permitted. Rule four, you have exactly three patches to fix contradictions. Rule five, if you cannot complete the description you must halt. Watch them struggle with the regress as they try to encode the encoding rule, and when they attempt to patch the third level intervene at 10:20 AM to stop the formal phase regardless of progress. This failure is the foundation, so do not explain why it failed yet. The goal here is to let them feel the computational cost of self-reference before they ever see a picture, and you should note how quickly the three patches are consumed by the need to describe the patching rule itself.

  At 10:20 AM distribute the large sheets and markers for the pictorial phase. Tell them they must now draw the process by which the picture is being made, including the hands drawing it and the conversation planning it, with nothing off the sheet allowed to explain the image. Introduce the scoring mechanic immediately to create pressure. Rule one, you earn one token for each distinct level of production depicted. Rule two, you may bank tokens at any point by placing them in a sealed envelope. Rule three, an audit occurs every five minutes requiring you to point to the depiction of the current level. Rule four, if you fail an audit you lose all unbanked tokens. Rule five, the audits escalate from depicting the drawing to depicting the planning to depicting the decision to depict. The rational move is to bank early, but the temptation to go deeper will feel productive because each new level seems solvable until the audit arrives. Walk around and enforce the audits strictly, noting that groups who try to draw the drawer must then draw the hand drawing that hand, pushing them toward the edge of the paper. You should observe the anxiety of the banking decision, where stopping feels like surrender but continuing risks total loss, and you must resist the urge to hint that the game is rigged. At 10:50 AM stop the drawing and collect the envelopes, leaving the sheets on the tables.

  For the cross-audit phase from 10:50 AM to 11:05 AM assign each group a specific level to treat as inviolate, such as the paper, the hand, or the conversation, and have them audit another group's sheet against this assignment. This is where the structural insight should land without your narration. Group A will claim Group B's drawing is incomplete because it does not depict the hand, while Group B claims the hand is the inviolate level and cannot be depicted. When they argue, you will see them realize that the stopping point is a decision about where to stand rather than a fact about the picture. Do not resolve this tension. Let them feel the discomfort of knowing their inviolate level is depictable from another stance. Collect the sheets and move to the debrief at 11:05 AM.

  In the debrief map the specific moments of failure to the core idea. When a group writes this picture depicts its own production on the sheet and declares victory, treat the sentence as a depiction that requires its own depiction, forcing them to draw the writing of the sentence. When a group produces a beautiful image that quietly dodges the constraint by using metaphor, point out that the metaphor is an external reference and demand it be drawn internally. When a group produces a genuine infinite regress and takes it for a solution, show them that the regress never produces the picture itself, so the picture remains unexplained. When a group points out that they are outside the picture and are therefore the inviolate level, validate this as nearly right and use it to introduce the term inviolate level formally. Explain that the formal phase eating twenty minutes more than it should is a feature not a bug, as the time pressure mimics the computational cost of self-reference. Connect this explicitly to the Liar sentence and the Halting Problem they already know, showing that the token rules were a halting problem and the drawing was a Liar sentence made visible. You must then be frank about what the activity cannot reproduce. The structural unavailability of complete self-representation is clear, but the feeling of consciousness or the sense of self is not generated by tokens and cards. You will have to say out loud that the inviolate level is where we usually locate the self, and that the discomfort they felt in the audit is the structural cost of having a self-model at all. End the session at 11:20 AM by showing Escher's Drawing Hands only now, letting them see the tangle they just built, and assign the reading choice to the group that banked the most tokens without failing an audit. The prize is trivial but the memory of the failure should linger into the next week when you discuss minds.
