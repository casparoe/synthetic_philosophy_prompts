  8.  *(Self-Correction on the User's "Stuck"):* The user says they are stuck between rejecting (3) and (1). I should explicitly tell them why rejecting (3) [or rather, the inference to 4] is better than rejecting (1). Rejecting (1) makes you a "Great Man" theorist in an era of data that suggests otherwise. Rejecting (3)/(4) allows you to be a structuralist *and* a humanist.

  9.  *(Final check on the "Mouthpiece" metaphor):* This is the weak point. A mouthpiece transmits without change. A scientist transforms the toolkit. Even if the result is inevitable, the *transformation* is the work.

      *   *Plan:*
