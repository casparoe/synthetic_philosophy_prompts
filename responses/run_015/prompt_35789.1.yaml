          *   "Pragmatism isn't a rival theory of truth; it's a recommendation to change the subject."
          *   Diagnosing questioners as trapped in the Kantian scheme/content picture (or Mirror of Nature framework).
          *   Running circles around the host previously.
      *   **Task:** Write a sequence of ~10 interview questions.
      *   **Structure:** Ordered to make the "change the subject" deflection progressively harder to use.
      *   **Ending:** A question about falsification/counterevidence (what would count against the view?).
      *   **Specific Requirements:**
          *   One question on self-refutation/audience relativity (vs. Thomists next door).
          *   One question on coping/prediction vs. representation (do bridges standing up smuggle representation back in?).
          *   One question on science vs. politics (aeroplanes fly vs. parliaments failing consensus).
          *   Follow-ups for each question keyed to likely deflections.
          *   **Language:** British English (spelling, phrasing).
          *   **Tone:** Professional but sharp, suitable for reading verbatim on air. No generic intros.

  2.  **Deconstruct the Guest's Position (Neopragmatism/Rorty):**
      *   *Core:* Antirepresentationalism. No "Mirror of Nature."
      *   *Truth:* Not correspondence. Truth is what is good to believe. Justification is social.
      *   *Strategy:* Dissolve epistemological problems rather than solve them. "Change the subject."
      *   *Vulnerability:* If *everything* is just vocabulary/social practice, is there any normativity left? Does the view undermine itself? Is there a difference between successful engineering and successful propaganda?

  3.  **Drafting Strategy - The Arc:**
      *   *Questions 1-3:* Establish the ground, letting him use his standard moves but setting traps.
      *   *Questions 4-6:* Tighten the screw on specific applications (science, ethics, self-reference).
      *   *Questions 7-9:* Corner him on the consequences of the view (normativity, reality constraints).
      *   *Question 10:* The "Falsifier" question (the knockout punch).

  4.  **Drafting the Questions (Iterative Process with British English check):**

      *   *Q1 (Warm-up/Setting the Stage):* Start with the "change the subject" claim itself.
