answer: |-
  Here is a sequence of ten questions designed to tighten the net around the neopragmatist position. They are ordered to start with clarificatory charity and move towards the meta-philosophical constraints of the view, making the 'change the subject' manoeuvre increasingly costly to deploy. The language is British English throughout.

  ### 1. The Status of the Recommendation
  **Question:** You've often said that pragmatism isn't a rival theory of truth, but rather a recommendation to change the subject from 'correspondence' to 'justification'. My first question is simply this: is that recommendation itself *true*? Or is it merely a useful piece of vocabulary for our particular historical moment?

  *   **Anticipated Deflection:** He will likely say it's not 'true' in the correspondence sense, but 'good to believe' or 'useful for liberal purposes'.
  *   **Follow-up:** If it's merely useful for *our* moment, then if a future society finds the 'Mirror of Nature' vocabulary more useful for their purposes, would you have to concede they are right to return to Descartes? Or is there something about your recommendation that holds regardless of historical utility?

  ### 2. The Kantian Diagnosis
  **Question:** When critics press you on the status of reality, you often diagnose them as still being trapped inside the Kantian scheme/content distinction—the idea that there's a raw givenness we must organise. But to diagnose someone as 'trapped' implies you have a vantage point from which you can see the trap. Doesn't positing that vantage point reintroduce the very 'God's Eye View' you claim to reject?

  *   **Anticipated Deflection:** He will claim he isn't positing a view from nowhere, but simply offering a new vocabulary that makes the old problems dissolve.
  *   **Follow-up:** But if it's just a new vocabulary, why should it dissolve the problems rather than just translate them? If I say 'the world causes beliefs', you say 'vocabularies cause vocabularies'. Have you actually explained anything, or just shifted the grammar?

  ### 3. Coping and Representation (Requirement: Bridges)
  **Question:** Let's talk about coping. You argue that we should swap truth for 'successful coping'. But when an engineer builds a bridge, it stands up because it accords with the physical constraints of the world. If her beliefs didn't *represent* the load-bearing facts accurately, the bridge would fall. Doesn't the bridge standing up smuggle representation back in through the back door?

  *   **Anticipated Deflection:** He will argue that 'accuracy' is just another word for 'reliability', and we don't need to posit a relation of 'aboutness' between belief and world.
  *   **Follow-up:** Yet, reliability *of what*? If the bridge stands, it's reliable *with respect to gravity*. If you refuse to say the beliefs track gravity, aren't you just being coy? Why not admit that some beliefs are constrained by the world in a way others aren't?

  ### 4. Science and Politics (Requirement: Aeroplanes vs Parliaments)
  **Question:** Following on from that: you want to put science and politics on all fours as social practices aimed at solidarity. But aeroplanes fly, whereas parliaments mostly fail to produce consensus. Science seems to have a friction with reality that politics lacks. Are you really prepared to say the difference between a functioning aeroplane and a failed peace treaty is just a difference in social agreement?

  *   **Anticipated Deflection:** He will suggest that 'flying' is just another form of consensus among pilots and engineers, and that 'reality' doesn't speak except through human descriptions.
  *   **Follow-up:** But the reality of the crash doesn't wait for consensus. If the pilot disagrees with the engine, the engine wins. Doesn't that asymmetry suggest that in science, unlike politics, the world is doing more work than the peers are?

  ### 5. The Self-Refutation Worry (Requirement: Thomists)
  **Question:** This brings me to the normativity of your view. You say justification is relative to an audience of peers. In this building, your peers let you get away with saying truth is made, not found. But in the building next door, the Thomist colleagues let each other get away with saying truth is eternal and mind-independent. On your account, why is your justification preferable to theirs? Is it merely that you have more friends?

  *   **Anticipated Deflection:** He will likely appeal to 'liberal hope' or the reduction of cruelty, arguing his vocabulary is more inclusive.
  *   **Follow-up:** But that appeal to cruelty looks like an absolute value, doesn't it? If the Thomists say their view reduces cruelty by securing eternal order, you can't say they are *wrong*, only that you prefer your tribe. Does this reduce philosophy to a matter of demographic headcount?

  ### 6. The 'Change the Subject' Strategy
  **Question:** I want to press on your signature move: the idea that objections fail because they presuppose the old picture, so we should just change the subject. If every objection is dismissed as 'still using the old vocabulary', doesn't that insulate your position from criticism? How is this different from a theological claim that faith is immune to reason?

  *   **Anticipated Deflection:** He will argue he is offering a *therapy*, not a thesis, and therapies aren't true or false, just effective or ineffective.
  *   **Follow-up:** If it's a therapy, it can be administered badly. What counts as a botched administration? If I leave your seminar more confused about how to act in the world, have you failed? Or is my confusion just my own resistance to the cure?

  ### 7. Progress without Teleology
  **Question:** If we drop the idea that we are getting closer to the truth of things, can we still make sense of intellectual progress? We surely want to say that modern physics is an improvement on Aristotelian physics. If that improvement isn't about better representation, what is it about?

  *   **Anticipated Deflection:** He will say it's about having more tools, more possibilities for action, and greater predictive power.
  *   **Follow-up:** But 'more tools' implies a task. If the task isn't 'knowing the world', what is it? If you say 'coping', we return to the bridge problem: isn't better coping just a proxy for better representation?

  ### 8. Suffering and Reality
  **Question:** Rorty often centred the reduction of cruelty. But cruelty involves pain, and pain seems to be a direct encounter with reality that bypasses vocabulary. When someone is tortured, does it make sense to say their suffering is 'justified' within a certain vocabulary? Or does the pain itself silence the pragmatist?

  *   **Anticipated Deflection:** He will agree pain is non-linguistic but argue our *response* to it is linguistic, and that's where the justification lies.
  *   **Follow-up:** But if the pain is non-linguistic, then there is something given, something unconstructible. Doesn't that admit a constraint on language that comes from outside language? And if so, haven't we let the Mirror back in?

  ### 9. Choosing Vocabularies
  **Question:** You suggest we are free to adopt new vocabularies that serve us better. But on what basis do we choose? If I propose a vocabulary that justifies slavery, and it works for my peer group, you must say it's wrong. But if truth is just what peers let you say, where do you stand to condemn it?

  *   **Anticipated Deflection:** He will rely on 'sentimental education' and the expansion of 'us', arguing we simply won't let them get away with it.
  *   **Follow-up:** So it comes down to power? If we can't say they are *mistaken* about the world or humanity, only that we are stronger than them, isn't this might-makes-right dressed up as philosophy?

  ### 10. The Falsifier (Requirement: What Counts Against)
  **Question:** Finally, I'd like to ask what would actually count against your view. If every objection I raise—about bridges, about Thomists, about cruelty—is met by saying I'm using the wrong vocabulary or asking the wrong questions, then your position seems built to absorb every critique. Is there any evidence, any argument, or any state of affairs that would force you to concede that perhaps beliefs *do* represent the world after all? Or is neopragmatism unfalsifiable?

  *   **Anticipated Deflection:** He will likely say that 'falsifiable' is part of the old scientific/representationalist vocabulary he's trying to move us away from, and that the question itself begs the question.
  *   **Follow-up:** If you cannot specify what would prove you wrong, then you aren't offering a philosophical position; you're offering a conversion experience. If I can't argue you out of it, I can only pray you see the light. Is that where we've arrived?
