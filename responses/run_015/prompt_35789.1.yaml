      *   *Q3 (Coping/Representation - Requirement 1):* Bridges standing up.
          *   *Draft:* If bridges stand up, doesn't that mean they represent physics correctly?
          *   *Refinement:* Focus on "coping" vs "representing". Does success imply accuracy?
          *   *Follow-up:* If he says "no, just utility," ask why utility tracks reality so well.

      *   *Q4 (Science vs Politics - Requirement 2):* Aeroplanes vs Parliaments.
          *   *Draft:* Science works, politics doesn't. Are they the same?
          *   *Refinement:* Rorty treats them as similar social practices. Challenge the asymmetry in success.
          *   *Follow-up:* If he says "both are just solidarity," ask about the cost of ignoring the asymmetry.

      *   *Q5 (Self-Refutation - Requirement 3):* Thomists next door.
          *   *Draft:* Why is your view better than the Thomists if it's just what your peers like?
          *   *Refinement:* Focus on the normativity of justification. If justification is relative to *my* peers, why critique *their* peers?
          *   *Follow-up:* If he says "liberal hope," ask if that's just another absolute.

      *   *Q6 (The Status of the Recommendation):* Is the recommendation itself true?
          *   *Draft:* Is your advice true?
          *   *Refinement:* If it's not true, why follow it? If it is, you're back in the truth business.

      *   *Q7 (Progress):* Do we make progress if we don't get closer to truth?
