          *   *Refinement:* Define progress without teleology.

      *   *Q8 (Suffering/Reality):* Does reality push back?
          *   *Draft:* If pain is real, doesn't that matter?
          *   *Refinement:* Rorty on cruelty. Does suffering demand a representational account?

      *   *Q9 (The Vocabulary Trap):* If we can't step outside vocabulary, how do we choose better vocabularies?
