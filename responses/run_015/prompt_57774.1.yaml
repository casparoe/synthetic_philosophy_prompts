  1. **Accuracy.** You avoid putting Goodman in Neurath's mouth by writing "In Goodman's vocabulary," which is safe. However, since *Languages of Art* postdates Neurath, ensure readers know this is anachronistic analysis, not historical attribution. Your summary of the protocol controversy is standard and safe for this context. The description of the transformation role is accurate; Reidemeister's work was indeed normative reconstruction, not mere copying. The Vienna and Hague teams treated rules as constraints on inference, matching your description. The maxim quoted is authentic to the museum's pedagogy.

  2. **The coherentism analogy.** The analogy is defensible but vulnerable. A hostile reader will argue source data function as foundations. To defend this, explicitly state that for Neurath, source documents are themselves protocol sentences, warrantable only within the system. Your phrase "not to a pre-linguistic given" does heavy lifting here; ensure you emphasize that data statements are fallible like any other. Do not cut the analogy; it is essential to your claim. Strengthen the link between data and protocols by mentioning physicalism: charts are physical objects facilitating intersubjective checkability, not mirrors of nature.

  3. **Significance.** Both theses are substantive; neither is a distinction without a difference. The "logical rule" thesis is stronger for a philosophy of science audience because it ontologically elevates the chart from illustration to statement-system. The "audience" thesis supports the social epistemology angle but relies on the first. Organize the paper around the logical rule thesis regarding denotation fixity. This grounds the coherentism claim more securely than the sociological reading. A design historian might dismiss the perceptual claim, but the logical claim forces them into your philosophical frame. It transforms Isotype from a styling choice to an epistemic necessity.
