answer: |-
  Before arguing for openness, I must steel-man the opposition. The case against releasing frontier weights rests on three serious pillars. First, **catastrophic misuse**: open weights lower the barrier for bad actors to design bioweapons or launch cyberattacks, potentially causing immediate, large-scale harm. Second, **irreversibility**: once weights are online, they cannot be recalled; if a dangerous capability is discovered later, it is permanently available. Third, **parity**: openness gives adversaries equal access to powerful tools, undermining democratic advantages in security and intelligence.

  These concerns are weighty, but they focus on event-based risks while ignoring structural ones. To see why openness is ultimately safer, we must distinguish between **spills** and **lock-in**.

  A spill is a release of harmful capability—a leak, a hack, or a misuse event. Spills are bad, but they are typically discrete events. Like a virus outbreak, a spill triggers immune responses: patches, defenses, and new norms. We learn from spills. Lock-in, however, is a structural condition where control over intelligence is concentrated in a handful of corporations or states. If frontier AI remains closed, we cement a permanent power asymmetry. A few entities decide what the model sees, says, and builds. This creates a single point of failure and a monopoly on truth. Lock-in is harder to undo than a spill because it reshapes the political and economic landscape around centralized control.

  Proponents of closed models argue secrecy prevents spills. History suggests otherwise. Secrets in the digital age are porous. State actors will replicate capabilities regardless of corporate policy, and leaks from within closed labs are inevitable. By restricting weights, you do not stop the technology from spreading; you only stop the good guys from having it. You restrict defensive researchers, small businesses, and watchdogs, while determined adversaries pursue independent replication anyway. Closed control creates a facade of security while leaving the system vulnerable to asymmetric attacks from those who ignore the rules.

  Furthermore, closed models block the independent safety probing we desperately need. Security through obscurity is a fallacy. When weights are hidden, only the lab's internal team can audit for biases, vulnerabilities, or dangerous behaviors. They have incentives to ship products, not necessarily to find deal-breaking flaws. Open weights allow a global community of researchers to stress-test the system, finding bugs and exploits before they are weaponized. Distributed scrutiny is more robust than centralized gatekeeping.

  Finally, we must address the claim that openness is irreversible, so we only get one chance to be wrong. This assumes closed models are reversible. They are not. Once the knowledge exists to build a system, it cannot be un-known. If a closed model is compromised or leaked, the damage is done, but without the public knowledge needed to defend against it. Openness accepts the risk of spills to build collective immunity. If weights are open, defense is distributed; if a vulnerability is found, everyone can patch it simultaneously.

  The choice is not between safety and risk. It is between a fragile system reliant on secrecy and a resilient system built on distributed knowledge. Lock-in guarantees that when the system fails, everyone falls. Openness ensures that when spills happen, we all learn how to build the dam higher.
