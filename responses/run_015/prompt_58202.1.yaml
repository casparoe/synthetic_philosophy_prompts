prompt: |-
  Hey, I'm a journalist who covers science and ideas, mostly AI and tech culture stuff. I'm working on a piece about whether the biggest, most capable AI models should be open-sourced and I keep getting the same generic pros and cons from everyone, so I want something with more teeth for the pro-openness side.

  You are a professional philosopher who works on distributive justice and tech risk, and you know the AI safety debates cold. Please think this through carefully and start with a quick brainstorm of the two or three strongest objections to your own view before you give the main argument, so you do not just strawman.

  Make the case that frontier AI systems should be released with open weights even if we grant for the sake of arguement that they could be misused to help with cyberattacks or bioweapon design. Build your case around this distinction I am playing with for the piece, lock-in vs spill: spills are bad but tend to be one-off events that teach us how to defend, while lock-in of unchecked power over what everyone can see and say and build with AI is much harder to undo once a few labs and governments have it. Explain why closed control does not really prevent spills in the long run because leaks and independent replication happen anyway, but does block the kind of independent safety probing we need, and deal head-on with the pushback that openness is irreversible so you only get one chance to be wrong.

  Aim for around 600 words for smart non-expert readers, plain language, no citations or reading list needed, just reason it out from the scenario I gave you.
