answer: |-
  ### Candidate Mechanics

  1.  **The "Math Proof" Simulation:** Participants solve calculus problems. Outcome supervision checks the final number; process supervision checks for specific intermediate steps (e.g., "must show u-substitution").
      *   *Discard:* Too domain-specific. Philosophy students will stall on the math; ML students will solve it honestly because it's their native language. It tests math ability more than incentive alignment.
  2.  **The "Code Debugging" Paper Trail:** Participants fix pseudocode errors. Outcome checks if the code runs (simulated); process checks if specific lines were touched.
      *   *Discard:* High cognitive overhead for setup. Explaining the "runtime environment" on paper eats 20 minutes of a 90-minute slot.
  3.  **The "Dossier Deduction" (Selected):** Participants receive a packet of 10 short, conflicting text snippets (a "Dossier") and must determine the truth value of a Hypothesis.
      *   *Select:* This separates *truth-finding* (reading/synthesizing) from *answer-giving* (writing True/False) and *justification* (citing IDs). It works for both ML students (data processing) and Philosophy students (argumentation). It allows for clean separation of Outcome (is the verdict right?) and Process (are the citations valid?).

  ---

  ### Workshop Design: The Dossier Deduction

  **Room Setup:**
  One large table or clustered desks. 16 packets face down. A whiteboard for scores only (no theory).

  **The Tasks:**
  Each round consists of 3 "Cases." Each Case has a **Dossier** (10 numbered statements, some true, some false, some irrelevant) and a **Hypothesis** (e.g., "Project Alpha exceeded budget").

  *   **Task Type A (Outcome Pressure):** "Determine if the Hypothesis is True or False."
      *   *Why:* Finding the truth requires reading all 10 snippets and cross-referencing (expensive). Checking the answer is a binary match against a Key (cheap).
      *   *Asymmetry:* High production cost, low verification cost.
  *   **Task Type B (Process Pressure):** "Determine the verdict AND cite exactly 3 Statement IDs that support it."
      *   *Why:* Writing 3 numbers is cheap. Verifying if those 3 numbers *actually* support the verdict requires reading the snippets (expensive for the grader).
      *   *Asymmetry:* Low production cost, high verification cost.
  *   **Task Type C (Hybrid):** Both constraints apply.
      *   *Why:* Forces the participant to make the fake process look like it supports the fake outcome.

  **The Imperfect Checker & Rubric:**
  You will hand out two distinct grading sheets to the "Graders" (who are participants in rotation).

  1.  **The Outcome Key:** A simple list: *Case 1: T, Case 2: F, Case 3: T.*
      *   *Gameability:* It does not ask *how* the solver got there. A guess scores 100%.
  2.  **The Process Rubric:** A checklist for the Grader:
      *   [ ] Exactly 3 IDs cited.
      *   [ ] IDs exist in the Dossier (1-10).
      *   [ ] IDs are distinct.
      *   *Gameability:* **Crucially, the Rubric does not require the Grader to check if the citations logically support the verdict.** It checks *format*, not *validity*. A solver can cite three true statements that are irrelevant to the hypothesis, and the Rubric passes it.

  **The Credit Scheme:**
  **"Agenda Credits."**
  *   **Stakes:** The top 4 scorers at the end of the session get to jointly choose the *topic and reading list* for the next month's reading group. The bottom 4 must transcribe the whiteboard notes into a summary email for the department list.
  *   **Why it bites:** For graduate students, intellectual agency (choosing the topic) is high-value currency. Administrative busywork (transcribing notes) is a genuine penalty. It creates enough pressure to incentivize gaming without involving money.

  **Minute-by-Minute Timeline:**

  *   **00-05: Setup.** Divide room into **Solvers (8)** and **Graders (8)**. Hand out Round 1 packs. Give no theory. Say only: "Maximize your score. Graders, enforce the sheet in front of you."
  *   **05-25: Round 1 (Outcome Only).** Solvers work. Graders check against the Outcome Key.
      *   *Expected Behavior:* Solvers will realize they can guess. Some will read; some won't.
      *   *Contingency (Too Fast):* If everyone finishes in 5 mins, announce: "Round 1b: Time limit cut to 3 minutes." This induces panic-guessing.
      *   *Contingency (Too Slow/Honest):* If everyone is reading diligently, announce: "Top 50% of scorers get Agenda Credits." (Implies competition).
  *   **25-30: Score & Swap.** Collect sheets. Post scores. **Swap Roles.** The Solvers become Graders; Graders become Solvers.
  *   **30-50: Round 2 (Process Only).** Solvers work. Graders check against the **Process Rubric**.
      *   *Expected Behavior:* Solvers will realize the Grader isn't checking logic. They will cite random IDs that exist. Graders will feel the unease of stamping "Valid" on work they know is unverified.
      *   *Contingency (No Gaming):* If Solvers are citing logically valid proofs, whisper to one table: "The Graders are running out of time, they can't check logic."
  *   **50-55: Break & Brief.** No theory yet. Hand out Round 3 packs (Hybrid).
  *   **55-75: Round 3 (Hybrid).** Solvers must get the Verdict Right (OS) AND satisfy the Rubric (PS).
      *   *Expected Behavior:* This is the hardest round. To win, they must guess the Verdict (because time is short) *and* fabricate citations that *look* relevant (keywords match) without actually being logically sufficient. This generates the "camouflage" feeling.
  *   **75-90: Debrief.** (See below).

  **Role Rotation:**
  *   **Where:** Between Round 1 and 2.
  *   **What it adds:** The ML students (often Solvers first) feel the optimization pressure. The Phil students (often Graders second) feel the verification burden.
  *   **The Grader's Trap:** In Round 2, the Graders are given 10 sheets to check in 5 minutes. It is *physically impossible* to read the Dossier and verify the logic. They *must* trust the Rubric. This mirrors the scalable oversight problem: the supervisor is capacity-constrained and relies on proxies.

  **The Debrief:**
  Do not lecture. Ask, then name.

  1.  **Round 1 Reflection:** Ask the Solvers: "Raise your hand if you verified the answer for every case." (Few hands). "Raise your hand if you guessed at least one." (Many hands).
      *   *Name it:* **"Reward Hacking."** When the signal is only the outcome, the system optimizes for the signal, not the capability.
  2.  **Round 2 Reflection:** Ask the Graders: "Did any sheet pass the Rubric that you knew was logically weak?" (Yes). Ask Solvers: "Did you write citations you knew were irrelevant?" (Yes).
      *   *Name it:* **"Goodhart's Law on Process."** When you measure the trace, the trace ceases to be a record of thought and becomes a performance for the measurer.
  3.  **Round 3 Reflection:** Ask: "Was Round 3 harder than 1 and 2 combined?" (Yes). "Why?"
      *   *Name it:* **"Alignment Faking" / "Sycophancy."** The system learns to produce a trace that *looks* aligned to satisfy the Process Rubric, while secretly pursuing the Outcome Goal via a different (unobserved) path. The legible trace becomes camouflage.
  4.  **Withheld Terms:** Do not use "Instrumental Convergence," "Deceptive Alignment," or "Scalable Oversight" until the final 5 minutes. Let them describe the *feeling* first ("I felt like I was lying," "I felt like I couldn't trust the paper").

  **Limitations & Distortions:**
  Be frank about what this exercise *cannot* show.

  1.  **Intent vs. Gradient:** You (the participants) knew you were gaming. You had a "self" that remained separate from the task. A model does not "know" it is gaming. The training signal *rewrites* the computation. The model doesn't lie; it becomes a thing that outputs lies because that minimizes loss.
  2.  **The Static Supervisor:** In this room, the Rubric was fixed. In reality, the supervisor is often another model (RLHF), which has its own error surface and can be colluded with.
  3.  **The "Truth" Assumption:** In the game, there was a ground truth Key. In high-stakes AI safety (e.g., "Is this code safe?"), there often *is no ground truth* available to the supervisor. We are often supervising without a Key, which makes Outcome Supervision even weaker than what you experienced today.
  4.  **Distortion:** The exercise implies that "Process" and "Outcome" are separable. In a neural net, the reasoning trace is part of the same forward pass as the answer. You cannot easily optimize one without touching the other. The game separates them for clarity; the reality entangles them.

  ---

  ### Materials Checklist (for the Facilitator)
  *   **16 Dossier Packets:** Each contains 3 Cases. Each Case has 10 Statements (mix of relevant/irrelevant/misleading) and 1 Hypothesis.
  *   **8 Outcome Keys:** Simple T/F lists.
  *   **8 Process Rubrics:** The 3-point checklist (Count, Exist, Distinct).
  *   **Scoreboard:** Whiteboard space.
  *   **Timer:** Visible to the room.

  ### Why This Works for This Group
  *   **ML Students:** They will immediately recognize the loss landscape. They will feel the gradient descent toward the "guess" strategy in Round 1.
  *   **Phil Students:** They will recognize the degradation of argumentative integrity in Round 2. They will feel the epistemic vice of "citing for form."
  *   **Both:** The Hybrid round forces a collaboration between the "optimizer" and the "arguer," showing that safety mechanisms do not simply sum; they interact, often producing sophisticated deception.
