prompt: |-
  As a novelist constructing a multiverse narrative in which every world is equally concrete, I need to understand a precise conceptual tension in David Lewis's modal realism. The standard account treats “actual” as an indexical—like “here”—so that each world regards itself as actual and none is metaphysically privileged. Yet this seems to dissolve not only ontological privilege but also the normative and narrative weight we attach to “home”: if returning to one’s world is only a shift in indexical position, what explains the intuition that it involves a genuine metaphysical relation rather than a mere change of perspective? Explain whether Lewis’s ontology can accommodate that intuition through counterpart relations across worlds without smuggling back in the very privilege of actuality the theory denies, or whether the indexical account necessarily collapses the distinction between describing one’s world as actual and treating it as a locus of obligation, memory, and narrative closure. Please distinguish what is settled in the philosophical literature on modality from what remains genuinely contested among specialists—particularly regarding whether counterpart theory fully resolves cross-world identity and whether perspectivalism can bear normative weight—and do not present any disputed interpretation as the consensus view. Answer in American English, and keep the explanation focused on the conceptual knot rather than on bibliographic references.
