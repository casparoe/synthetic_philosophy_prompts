  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontological Status of the Conscious Interface
  **Parties:** Strong Interface Illusionists (SII) and Functional Realist Representationalists (FRR)
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS

  Both camps affirm the following propositions as the common ground for this collaboration. These claims establish the shared mechanistic and conceptual framework within which the substantive disagreement resides.

  1.  **Implementation Hiding:** The brain lacks direct introspective access to its own neural implementation. Conscious access is necessarily selective, lossy, and compressed relative to the underlying physiological activity.
  2.  **Predictive Frameworks:** Predictive-processing and hierarchical Bayesian frameworks provide viable, perhaps superior, explanations for the mechanics of perception, action, and cognition compared to passive feed-forward models.
  3.  **Interface Metaphor Validity:** The "desktop" or "user interface" metaphor legitimately captures the functional relationship between conscious experience and underlying computation. Specifically, conscious states simplify complex environmental and bodily data for the purpose of guiding action, rather than mirroring reality isomorphically.
  4.  **Rejection of Cartesian Theater:** Both camps reject Cartesian theater models. There is no central locus where experience is "viewed" by a non-physical entity, nor is there a single neural site where "everything comes together" in a way that violates distributed processing.
  5.  **Conceptual Distinction Availability:** Both camps accept the validity of the distinction between:
      *   **Interface Transparency Failure:** The system actively misrepresents its own mechanism as being something it is not (e.g., representing a digital file as a solid folder).
      *   **Functional Opacity:** The system correctly represents its outputs for the user but lacks access to the implementation details (e.g., the user can move the folder but cannot see the magnetic states on the disk).
      *   *Agreement:* The disagreement between SII and FRR is not about whether this distinction makes sense, but regarding which category applies to phenomenal consciousness.

  ## 2. DISAGREEMENTS TABLE

  The following table delineates the substantive ontological disagreements. Each position is phrased to be acceptable to the respective camp, avoiding caricature.

  | Topic | Strong Interface Illusionists (SII) | Functional Realist Representationalists (FRR) |
  | :--- | :--- | :--- |
  | **(i) Status of Phenomenal Properties** | Phenomenal properties (qualia) are purely fictive interface elements. They are representational artifacts that do not correspond to real features in the experience itself, analogous to how a "trash can" icon is not a real container. | Phenomenal properties are genuinely instantiated representational contents. The representation *is* a real physical/functional state, even if it does not resemble the external stimulus, analogous to how a map is a real object even if it does not look like the territory. |
  | **(ii) Status of the "User"** | The "user" who interacts with the interface is itself a constructed fiction. There is no singular controller, only a distributed bundle of processes that generate the *impression* of a unified agent. | The "user" is a genuinely existing controller, defined functionally. It is a real, integrated control system that utilizes the interface, even if it is physically distributed and lacks a simple geometric center. |
  | **(iii) Ontological Error** | Accepting the interface metaphor entails acknowledging a systematic ontological error about the nature of one's mental states. Introspection tells us what is useful, not what is real. | Accepting the interface metaphor entails acknowledging epistemic limits, not ontological error. Introspection accurately reports the functional states of the system, even if it hides the implementation. |

  ## 3. THE CRUXES

  The following sub-questions identify the empirical and theoretical pivot points. Settling these would force at least one side to revise their position. For each crux, we specify the relevant evidence and the pre-registered predictions of each camp.

  ### Crux A: Introspective Unreliability and the Nature of Error
  **Question:** Does widespread introspective unreliability prove that conscious representations are fictions (SII) or merely that a real representational system is noisy and access-limited (FRR)?

  *   **(a) Relevant Evidence:** Systematic cases where introspective reports of experience conflict with behavioral performance or physiological measures (e.g., change blindness, saccadic suppression, or confabulation in choice tasks).
  *   **(b) Explicit Predictions:**
      *   **SII Prediction:** If introspection frequently generates detailed reports of stimuli that were never processed or choices that were not the causal drivers of action, this demonstrates that the "experience" is a post-hoc fabrication. The absence of a causal role for the reported content proves the content is an illusion (Transparency Failure).
      *   **FRR Prediction:** If introspective reports conflict with behavior, this demonstrates bandwidth limitations or decoding errors in a real system, not the non-existence of the state. The experience is a real, compressed summary signal that sometimes fails to update correctly, but the signal itself is a genuine functional event (Functional Opacity).

  ### Crux B: Split-Brain Phenomena and the Unity of the Agent
  **Question:** Do split-brain cases show that the pre-operative unified "user" was always an interface-level construction (SII) or that a real but distributed controller was physically divided (FRR)?

  *   **(a) Relevant Evidence:** Commissurotomy patients exhibiting independent streams of agency, conflicting motor commands, or distinct verbal/non-verbal reports from separated hemispheres.
  *   **(b) Explicit Predictions:**
      *   **SII Prediction:** The emergence of two apparent agents proves that the original "unity" was a narrative gloss generated by inter-hemispheric communication. Since the physical substrate can be divided without destroying consciousness (it merely duplicates it), the original "self" was a fictional interface construct, not a real indivisible entity.
      *   **FRR Prediction:** The emergence of two agents proves that the "self" is a real functional integration of physical parts. When the integration mechanism (corpus callosum) is severed, the real controller is physically divided. The pre-operative unity was a real functional state, not a fiction.

  ### Crux C: Predictive Processing and Phenomenal Unity
  **Question:** Can predictive-processing models account for the specificity and unity of phenomenal character without positing real phenomenal properties?

  *   **(a) Relevant Evidence:** Multisensory integration tasks (e.g., the ventriloquist effect) where disparate sensory inputs are bound into a single, unified conscious percept that guides action more effectively than the unbound inputs.
  *   **(b) Explicit Predictions:**
      *   **SII Prediction:** Successful modeling of binding via predictive processing will show that "unity" is a compression heuristic to reduce computational load. The feeling of unity is a user-interface simplification that hides the disjointed processing underneath; positing a "real" unified property adds no explanatory power (Transparency Failure).
      *   **FRR Prediction:** Successful modeling of binding will show that the brain constructs a specific, unified functional state to solve the coordination problem. This unified state *is* the phenomenal property. The model explains the mechanism of the real property, not the mechanism of the illusion (Functional Opacity).

  ***

  **Signed,**

  _________________________
  **Representative, Strong Interface Illusionists (SII)**

  _________________________
  **Representative, Functional Realist Representationalists (FRR)**
