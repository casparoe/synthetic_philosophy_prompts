prompt: |-
  I work at a small foundation that funds conflict-prevention programs, and we're in the middle of a grant review where one of our board members keeps bringing up "the world is becoming less violent" as a reason to cut funding. His logic is basically: if violence is already on a long-term downward trend, why are we pouring money into preventing conflicts that history will solve on its own? We're just riding a trend, and our grants are reduntant. I keep feling like I can't push back because I'm not actually sure I know what the claim is, and I'm not even sure there's a single fact of the matter here versus the slogan just doing rhetorical work. Can you lay out the different precise claims that "the world is becoming less violent" could be making? I'm specifically thinking about the per-capita vs. absolute distinction (the population's gone from about 2.5 billion to 8 billion, so a per-capita decline can hide an absolute rise in violent deaths), which categories of violence are being counted (interstate war deaths, internal conflict, homicide, state and police violence, gender-based violence — these have very different trends and very different measurement problems), and over what time window (since 1945, since 1100, since the state emerged, or just the last couple of decades). For each reading, say whether it's defensible and whether it actually supports his conclusion that we shouldn't fund conflict prevention. And tell me which reading, if any, is decision-relevant for a foundation whose job is deciding how many lives its grants will save, as opposed to which readings are just a comforting narrative about long-run history. I want a menu I can bring to the board meeting, not a single answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Works at a small foundation funding conflict-prevention programs.
      *   **Problem:** A board member argues for cutting funding based on the claim "the world is becoming less violent" (implying grants are redundant).
      *   **User's Need:** A breakdown of the precise claims behind "the world is becoming less violent." They suspect it's a slogan/rhetoric rather than a single fact.
      *   **Specific Dimensions to Cover:** Per-capita vs. absolute numbers, categories of violence (interstate, internal, homicide, state, gender-based), time windows (post-1945, long-term history, recent decades).
      *   **Evaluation Criteria:** For each reading, is it defensible? Does it support the board member's conclusion (cut funding)? Is it decision-relevant for a foundation focused on saving lives *now*?
      *   **Format:** A "menu" of claims for a board meeting, not a single answer.

  2.  **Deconstruct the Claim ("The World is Becoming Less Violent"):**
      *   This is famously associated with Steven Pinker (*The Better Angels of Our Nature*), but it's heavily debated in political science and peace studies.
      *   I need to categorize the variations of this claim based on the user's prompts (metrics, scope, time).

  3.  **Drafting the Categories (The "Menu"):**

      *   *Category 1: The Long-Run Historical Decline (Pinker Style).*
          *   Time: Millennia/centuries.
          *   Metric: Per-capita rates of battle deaths/homicide.
          *   Defensibility: Contested but has some data support for certain metrics (interstate war).
          *   Relevance to Board: Low. Past trends don't guarantee future safety, especially with new technologies.
          *   Funding Implication: Doesn't support cutting funding (prevention maintains the trend).

      *   *Category 2: The Post-WWII "Long Peace" (Great Power War).*
          *   Time: 1945–Present.
          *   Metric: Interstate war between major powers.
          *   Defensibility: Strong. No WW3.
          *   Relevance: Medium. But ignores civil wars.
          *   Funding Implication: Weak. Civil wars are where most suffering happens now.

      *   *Category 3: Absolute Numbers vs. Per-Capita.*
          *   Time: Recent decades.
          *   Metric: Total deaths vs. rate per 100k.
          *   Defensibility: Per-capita might be down/stable, absolute numbers often fluctuate or rise due to population growth.
          *   Relevance: High. Foundations save *lives* (absolute), not percentages.
          *   Funding Implication: Strong pushback. If absolute numbers are stable/high, need is still there.

      *   *Category 4: Type of Violence (Interstate vs. Intrastate vs. One-sided).*
          *   Time: Last 30 years.
          *   Metric: UCDP/PRIO data types.
          *   Defensibility: Interstate down, Intrastate/Civil up and down (spiky). One-sided violence (against civilians) is significant.
          *   Relevance: High. Foundations usually target civil conflict/community violence.
          *   Funding Implication: Strong pushback. The violence that remains is harder to solve and affects civilians more.

      *   *Category 5: The "Tail Risk" / Existential Threat Argument.*
          *   Time: Future-looking.
          *   Metric: Potential severity (nuclear, bio, AI).
          *   Defensibility: Theoretical but plausible.
          *   Relevance: High for prevention.
          *   Funding Implication: Strong support for funding. Low probability, high impact.

      *   *Category 6: Structural/Chronic Violence (Homicide, GBV, State Repression).*
          *   Time: Ongoing.
          *   Metric: Homicide rates, GBV stats.
          *   Defensibility: Homicide stable/high in some regions. GBV undercounted but pervasive.
          *   Relevance: High. Affects daily life.
          *   Funding Implication: Strong support for funding.

  4.  **Synthesizing the Evaluation (The "So What?"):**
      *   I need to explicitly address the board member's logic: *Trend $\rightarrow$ Redundancy.*
      *   Counter-logic: *Trend $\rightarrow$ Fragility.* (The trend is the result of work, not nature).
      *   Counter-logic: *Composition Shift.* (Wars are fewer but deadlier or more complex).
      *   Counter-logic: *Marginal Utility.* (The last 10% of violence is the hardest to prevent).

  5.  **Refining the Tone:**
      *   Professional, analytical, non-partisan but firm on the data nuances.
      *   Empowering the user to speak confidently in the board meeting.
      *   Avoid taking a side on "Pinker is right/wrong," focus on "Which metric matters for *our* mission?"

  6.  **Review against Constraints:**
      *   Did I cover per-capita vs. absolute? Yes.
