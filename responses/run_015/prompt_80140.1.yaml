      *   Add a concluding section on "Strategic Framing" to help the user pivot the conversation from "Is violence down?" to "What is our role?"
      *   Ensure the distinction between *descriptive* (is violence down?) and *prescriptive* (should we fund?) is clear.

  **(Self-Correction during drafting):** I initially thought about focusing heavily on the Ukraine/Gaza conflicts as counter-examples. *Correction:* Better to keep it structural and data-driven rather than getting bogged down in specific current events which might date the advice or trigger political defensiveness. Stick to the *types* of data (UCDP, etc.). Make sure to emphasize that "conflict prevention" often targets *potential* violence, which doesn't show up in death counts anyway (the "dog that didn't bark" problem).

