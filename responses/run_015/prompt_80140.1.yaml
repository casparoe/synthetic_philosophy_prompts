answer: |-
  This is a classic tension in philanthropy and policy: the conflict between **long-term historical narratives** (which are often comforting) and **operational risk management** (which requires focusing on current and future threats).

  Your board member is relying on a heuristic often associated with Steven Pinker's *The Better Angels of Our Nature*. While that thesis has data behind it, it is highly sensitive to *how* you measure violence. For a foundation deciding where to allocate capital to save lives *now*, the long-run historical average is often the wrong metric.

  Here is a menu of six precise interpretations of the claim "the world is becoming less violent." You can use this to dissect the board member's argument, evaluate the defensibility of each claim, and determine its relevance to your funding strategy.

  ---

  ### 1. The "Per-Capita Rate" Claim
  *   **The Claim:** The *rate* of violent death per 100,000 people is lower today than in previous centuries.
  *   **Time Window:** Centuries/Millennia (e.g., comparing Medieval Europe to the 21st Century).
  *   **Categories:** Primarily homicide and battle deaths.
  *   **Defensibility:** **Moderate.** There is robust data suggesting homicide rates in Europe dropped from ~50 per 100k in the Middle Ages to ~1 today. However, extrapolating this globally is tricky; data from the Global South in the pre-1950s era is sparse.
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* Even if the *rate* is lower, the *population* is higher. A 0.01% rate applied to 8 billion people yields more absolute deaths than a 0.1% rate applied to 100 million people.
  *   **Decision Relevance:** **Low.** Foundations save *lives* (absolute numbers), not *percentages*. If your goal is to reduce human suffering, the per-capita rate is a statistical abstraction that hides the actual volume of tragedy.

  ### 2. The "Great Power Peace" Claim
  *   **The Claim:** Direct interstate war between major industrialized powers has virtually disappeared since 1945.
  *   **Time Window:** 1945–Present (The "Long Peace").
  *   **Categories:** Interstate war (state vs. state).
  *   **Defensibility:** **High.** There has been no World War III. Direct conflict between nuclear powers is historically anomalous.
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* This is a specific subset of violence. Most modern conflict is *intrastate* (civil war, insurgency, communal violence). A foundation funding conflict prevention is rarely funding the French army to stop the German army; you are likely funding mediation in civil conflicts or community violence interruption.
  *   **Decision Relevance:** **Low.** This is a geopolitical macro-trend driven by nuclear deterrence and trade interdependence, not by the grassroots or mid-level conflict prevention programs a small foundation typically funds.

  ### 3. The "Absolute Numbers" Claim
  *   **The Claim:** The total number of people dying violently each year is declining.
  *   **Time Window:** Last 30–50 years.
  *   **Categories:** Battle deaths, one-sided violence (against civilians).
  *   **Defensibility:** **Contested/Weak.** According to data from the Uppsala Conflict Data Program (UCDP) and the Peace Research Institute Oslo (PRIO), battle deaths spiked in the early 2010s (Syria, Ukraine, Ethiopia, etc.) to levels not seen since the end of the Cold War. While lower than the 1980s, the trend is not a smooth downward line; it is volatile and currently ticking upward in absolute terms.
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* If absolute numbers are stable or rising, the "need" is not diminishing. Furthermore, volatility makes prevention *more* valuable, not less, because systems are fragile.
  *   **Decision Relevance:** **High.** This is the most honest metric for a foundation. If absolute deaths are not plummeting to zero, there is work to do.

  ### 4. The "Composition Shift" Claim
  *   **The Claim:** Violence hasn't necessarily disappeared, but it has shifted from "organized war" to "one-sided violence" or "criminal violence."
  *   **Time Window:** Last 20 years.
  *   **Categories:** State repression, violence against civilians, gang homicide, gender-based violence (GBV).
  *   **Defensibility:** **High.** While battlefield deaths between uniformed soldiers may be down in some regions, violence against civilians (bombings, executions, sexual violence) remains a primary tactic of war. Additionally, GBV and urban homicide remain massively undercounted in standard "war" datasets.
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* This type of violence is often *harder* to prevent than interstate war because it is decentralized. It requires more intensive, localized intervention (exactly what small foundations fund), not just high-level diplomacy.
  *   **Decision Relevance:** **Very High.** If your grants target community safety, rule of law, or protection of civilians, this is the relevant metric. The "Long Peace" does not apply to a woman facing domestic violence or a village facing militia predation.

  ### 5. The "Tail Risk" Claim
  *   **The Claim:** The *average* year is safer, but the *potential* worst-case year is more dangerous.
  *   **Time Window:** Future-looking.
  *   **Categories:** Existential risk, nuclear escalation, biological weapons, AI-enabled conflict.
  *   **Defensibility:** **Theoretical but Plausible.** Technology increases the lethality of violence. A single conflict today has a higher ceiling for destruction (nuclear, cyber-infrastructure collapse) than a conflict in 1900.
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* This argues for *more* prevention, not less. Insurance premiums do not go down just because you haven't had a fire in five years; they go up if the house is now made of gasoline.
  *   **Decision Relevance:** **High.** For a foundation interested in "saving lives," preventing a low-probability, high-catastrophe event is often more cost-effective than marginal reductions in chronic violence.

  ### 6. The "Fragility of Trends" Claim
  *   **The Claim:** The downward trend is not a law of nature (like gravity); it is the result of active maintenance (institutions, norms, funding).
  *   **Time Window:** Ongoing.
  *   **Categories:** All forms of political violence.
  *   **Defensibility:** **High.** Political science consensus suggests peace is an active equilibrium, not a default state. When institutions weaken (e.g., withdrawal of peacekeepers, cuts to diplomacy), violence often returns (e.g., South Sudan, Afghanistan).
  *   **Does it support cutting funding?** **No.**
      *   *Reasoning:* This directly refutes the "history will solve it on its own" logic. If you stop funding the maintenance of peace, the trend reverses. Your grants are not "riding the trend"; they are part of the infrastructure *creating* the trend.
  *   **Decision Relevance:** **Critical.** This reframes your grants from "redundant" to "essential infrastructure."

  ---

  ### Strategic Framing for the Board Meeting

  When you bring this to the board, do not get bogged down in arguing whether Pinker is right or wrong. Instead, pivot to **Mission Relevance**.

  **1. The "Dog That Didn't Bark" Problem**
  Remind the board that conflict prevention is measured by *non-events*. If a grant successfully prevents a local conflict from escalating, that violence never enters the historical dataset.
  *   *Argument:* "We cannot look at historical violence data to judge the necessity of prevention, because successful prevention removes the data points we would be measuring."

  **2. Absolute vs. Relative Risk**
  Acknowledge the per-capita decline but emphasize the foundation's metric of success.
  *   *Argument:* "Even if the *rate* of violence is down, there are still 500,000+ violent deaths annually. Our mission is to save lives, not to improve statistics. As long as the absolute number is non-zero, there is a moral imperative to act."

  **3. The Marginal Utility of Prevention**
  Argue that the "easy" violence (great power war) has been reduced by governments, leaving the "hard" violence (civil, communal, structural) to civil society.
  *   *Argument:* "The long-term decline was driven by nation-states securing monopolies on violence. The remaining violence is complex, local, and social. It requires the exact kind of grassroots funding we provide. We are not solving the problems of 1945; we are solving the problems of 2025."

  **4. The Insurance Analogy**
  Use the board member's logic against itself regarding risk.
  *   *Argument:* "If the world is indeed becoming less violent, that is a fragile asset we must protect. Cutting funding now is like canceling fire insurance because the house hasn't burned down in a decade. It assumes the safety is inherent rather than maintained."

  ### Summary Recommendation
  The claim "the world is becoming less violent" is **descriptively debatable** (depending on metrics) but **prescriptively irrelevant** to your funding decisions.

  *   **Defensible readings:** Great Power Peace (since 1945), Per-Capita Homicide (Long-run).
  *   **Indefensible readings:** Absolute Battle Deaths (currently volatile/rising), Total Suffering (ignores GBV/State violence).
  *   **Decision-Relevant reading:** **Fragility of Trends.** The trend exists *because* of investment in norms and institutions. Withdrawing capital risks reversing the trend.

  **Your takeaway line:** *"We do not fund conflict prevention because violence is at an all-time high; we fund it because peace is not self-sustaining. The data shows violence is volatile, absolute numbers remain unacceptable, and the types of violence remaining are exactly what our grants are designed to address."*
