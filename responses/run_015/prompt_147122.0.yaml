          *   *Resolution:* I will proceed with **6 People** (Alice–Fiona) for philosophical coherence, as adding a 7th person breaks the "same people in both groups" symmetry required to make the paradox bite. I will treat the "leftover" as the **marginal difference in lives saved** (3 vs 2 = 1 extra life). This preserves the core logic without getting bogged down in arithmetic impossibilities.

  **The Rescue Mechanism:**
  The drone can only execute **one** protocol.
  *   **Protocol Family:** Saves **one** Room Pair (2 people).
  *   **Protocol Work:** Saves **one** Work Team (3 people).

  **The Dilemma:**
  You are the remote operator. You must choose which protocol to activate. You cannot save individuals; you must save the *group*.

