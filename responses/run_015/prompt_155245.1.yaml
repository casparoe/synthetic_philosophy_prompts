answer: |-
  Here is my diagnosis, structured as you requested. I will treat you as a colleague: I assume you know the algebra of the mixed model better than I do, and I ask you to accept my competence in the metaphysics of causal inference and the logic of scientific disagreement.

  ### Three Candidate Diagnoses

  **1. The Equivocation Diagnosis (Your Hypothesis)**
  The dispute is verbal. The "Defenders" are arguing about *etiological attribution in the actual population* (how much of the *current* spread is due to genetic sorting?), while the "Critics" are arguing about *interventionist potential* (what would happen to the mean or variance under environmental manipulation?). They use the word "heritability" for both. The Defenders intend $h^2$ as a constraint on *explanatory theories* (any theory must account for the genetic signal), while the Critics hear it as a constraint on *policy efficacy* (intervention is futile). Your "levelled heritability" attempts to bridge this by defining the parameter the Defenders *wish* they had (stability under equalization) versus what they *have* (variance in the status quo).

  **2. The Normative Camouflage Diagnosis**
  The technical stalemate is a proxy for a value conflict. The Defenders prioritize *meritocratic fairness*: if traits are heritable, outcomes reflect innate differences, and redistribution is unjust or inefficient. The Critics prioritize *egalitarian reform*: if traits are malleable, inequality is a structural failure we are obliged to fix. The technical arguments (GxE, population specificity) are weaponized rhetorical tools. The impasse persists because neither side can concede the scientific point without feeling they have surrendered the political ground. The "ritual" feeling comes from the fact that no amount of variance component estimation can resolve a disagreement about justice.

  **3. The Reification Diagnosis**
  Both sides treat variance components ($V_G, V_E$) as causal *substances* or *forces* rather than statistical descriptions of a specific population structure. The Defenders reify $V_G$ as a "genetic limit." The Critics reify $V_E$ as "environmental potential." The impasse exists because variance partitioning is fundamentally non-identifiable with respect to causal mechanisms without strong, untestable assumptions about the causal graph. The debate stalls because the quantity they are fighting over ($h^2$) is a "black box" statistic that collapses distinct causal structures (e.g., direct genetic effects vs. gene-environment correlation) into a single number. They are fighting over the content of a box that has no contents.

  ### The Verdict: A Refined Equivocation grounded in Reification

  I commit to a refinement of **Diagnosis 1**, but only because it is underpinned by **Diagnosis 3**.

  The Equivocation Diagnosis is correct that they are talking past each other, but it is too charitable to suggest they are simply reaching for different *quantities*. They are reaching for different *modalities*. The Defenders are making a claim about the **Actual** (the current variance structure constrains etiological models). The Critics are making a claim about the **Possible** (the counterfactual variance structure constrains policy).

  However, your "levelled heritability" does not solve this; it merely shifts the reification. Here is why I reject the pure Equivocation Diagnosis as sufficient: even if you define "levelled heritability," the Defenders cannot estimate it, and the Critics would still reject its policy relevance.

  The core issue is that the Defenders want $h^2$ to do **counterfactual work** (constraining what *could* explain the trait) using **actualist data** (variance in the current population). They want the stability of a biological constant (like a reaction norm slope) from a statistic that is inherently contingent (variance in a specific environment). The Critics correctly identify that the statistic is contingent, but they incorrectly infer that this makes it causally inert.

  The impasse is not verbal; it is **modal**. The Defenders need the parameter to be stable across counterfactual environments to support their claim that "genetics matters." The Critics know it is not stable. Your "levelled heritability" admits the instability but tries to fix the reference environment. But "best currently feasible standard" is a normative, not biological, boundary.

  **Why I reject the Normative Camouflage Diagnosis:** While values are present, dismissing the debate as "just political" ignores that both sides are making genuine, falsifiable claims about the structure of variance. The Defenders *are* right that high $h^2$ constrains purely environmental etiological models. The Critics *are* right that it doesn't constrain interventions. This is a logical incompatibility in the *inferences* drawn from the statistic, not just a value clash.

  **Why I reject the pure Reification Diagnosis:** It is too defeatist. Variance components *are* useful for prediction within the reference population. The problem isn't that the number is meaningless; it's that it is being asked to answer a question (policy/mechanism) it was not designed to ask.

  ### On "Levelled Heritability"

  Is your distinction useful? **Yes.**
  Does it collapse into something existing? **Yes, and that is the problem.**

  In animal breeding, you know this quantity effectively as **heritability in a standardized environment**. In human genetics, it collapses into the concept of the **Norm of Reaction** or, more precisely, the **variance of the reaction norm intercepts**.

  The problem is identifiability. In your breeding work, you could often assume $V_E$ was controlled or randomized across genotypes. In human cognitive traits, you cannot equalize the environment to a "feasible standard" experimentally. Therefore, "levelled heritability" is a **structural parameter** that is not identifiable from observational pedigree or twin data without assuming a specific functional form for GxE.

  If you assume additive GxE, you might estimate it. If you assume multiplicative or threshold effects, you cannot. By proposing "levelled heritability," you are asking the group to agree on a causal model of GxE that they explicitly disagree about. The Defenders assume GxE is small (hence stability); the Critics assume GxE is large (hence contingency). Your parameter requires the Defenders' assumption to be estimable, so the Critics will reject the estimate as circular.

  **Does either side need the counterfactual parameter?**
  *   **The Critics:** No. They are satisfied showing the actual $h^2$ is population-specific.
  *   **The Defenders:** **Yes, implicitly.** This is the crux. If the Defenders only cared about *prediction within the current population*, the Critics' objections would be irrelevant. A weather forecast is valid even if the climate changes. But the Defenders use $h^2$ to argue about the *nature* of the trait (innate vs. constructed). To argue about the nature of the trait, they need the parameter to hold across counterfactual environments. They need "levelled heritability" but are selling "actual heritability."

  ### What Counts as Progress?

  Given this diagnosis, here is my verdict on how to move the discussion, ranked from most to least feasible.

  **1. The "No Progress" Verdict (The Honest Answer)**
  You should argue that **no progress is expected on the current question** because the question is ill-posed. The question "How heritable is intelligence?" presupposes that there is a single scalar quantity that captures the genetic contribution to the trait. There isn't. There is only "variance attributable to genetic differences in population P at time T under environmental distribution E."
  *   **Action:** Propose a moratorium on the word "heritability" in the reading group. Force the Defenders to specify the *population* and *environmental range* for every claim. Force the Critics to specify *which* environmental intervention they claim would change the variance.
  *   **Why:** This dissolves the ritual. It forces the Defenders to admit their claims are local (undermining their "constraining" argument) and forces the Critics to admit that *some* variance is genetic in the current setting (undermining their "purely environmental" strawman).

  **2. The Design Shift (Within-Family)**
  You mentioned sibling designs. This is the most concrete scientific path.
  *   **Action:** Shift the debate to **Within-Family Polygenic Scores** or **Sibling Difference Models**.
  *   **Why:** These designs control for shared environment and population stratification. They typically yield lower estimates than population-level $h^2$.
  *   **Progress Condition:** If the Defenders accept the within-family estimate as the "true" causal parameter, the debate shifts to *why* the population estimate is higher (assortative mating? indirect genetic effects?). If they reject it, they must admit their previous estimates were confounded. This moves the debate from "what does $h^2$ mean" to "which design identifies causal effects." It trades a philosophical stalemate for a technical discrepancy that can be measured.

  **3. The Formal Identifiability Result**
  *   **Action:** Ask for a causal graph. Can anyone draw a DAG (Directed Acyclic Graph) that identifies "levelled heritability" from the available data?
  *   **Why:** It will likely demonstrate that without experimental equalization of $E$, the parameter is structurally unidentified.
  *   **Progress Condition:** This forces the Defenders to admit that their "constraining" quantity is metaphysically real but empirically inaccessible. It forces the Critics to admit that without that quantity, they cannot claim the trait is *more* malleable than the data suggests, only that it *might* be. It converts a shouting match into a agreement on ignorance.

  ### Final Recommendation

  Your "levelled heritability" is a philosophically sound concept (it isolates the genetic variance from the environmental noise), but it is **empirically vacuous** for human cognitive traits given current data.

  The impasse persists because the Defenders are using a **descriptive statistic** to make a **modal claim** (about what *would* happen if environments changed), while the Critics are attacking the **modal claim** by pointing out the limits of the **descriptive statistic**.

  To move the group:
  1.  **Validate the Critics:** Concede that actual $h^2$ says nothing about interventions.
  2.  **Challenge the Defenders:** Ask them explicitly: "Do you claim this coefficient would remain stable if we equalized schooling quality?"
      *   If they say **Yes**: Demand the identifiability proof for "levelled heritability." They cannot provide it. Their claim becomes a faith statement.
      *   If they say **No**: They concede the Critics' main point (that the coefficient is environmentally contingent), and the "constraining" power of the statistic evaporates for any theory that posits environmental change.

  The progress lies not in finding the right number, but in exposing that the number they are fighting over **does not exist** in the form they require. The "ritual" continues because both sides pretend the parameter is identifiable. Break that pretense.
