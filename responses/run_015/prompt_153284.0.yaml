          *   If it collapses into "social norms of assertion," it's not linguistic cognition.
      *   *Section 4: Falsifiability Assessment.*
          *   Be honest. This view *is* harder to falsify than hard Whorfianism.
          *   Why? Because memory is reconstructive by nature. Attributing the reconstruction to *grammar* vs. *culture* vs. *general cognition* is the swamp.
          *   Is it a weakness? Yes, it risks becoming a "just-so story." Needs specific predictions (e.g., reaction times, error patterns).

  6.  **Refining the Argument (Self-Correction during drafting):**
