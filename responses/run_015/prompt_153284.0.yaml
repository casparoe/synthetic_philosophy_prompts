          *   *Bilinguals:* The strongest test. If language switching doesn't switch the memory bias, the grammar isn't the causal lever.
          *   *Acquisition:* If cognition precedes grammar, grammar isn't the scaffold.
      *   *Section 2: Awkward Defeaters.* Nuances that make the theory messy but not dead.
