answer: |-
  Hey, I wanted to follow up on our conversation about metaphysics because I have been thinking about the special composition question and I really want to skip the standard intro about tables and chairs since we both know that drill. The real tension shows up when we stop looking at static furniture and start looking at things that happen over time, specifically temporary collective entities like flash mobs or ad-hoc political coalitions versus something like a human body or a machine. We usually want to say that composition is restricted, meaning some things make up a whole and others do not, because common sense tells us that a person is a real object while a random scattering of dust is not. But if you press on why that is, especially when you introduce time and intention into the mix, the middle ground between universalism and nihilism starts to look incredibly shaky, and I think it ultimately collapses under the weight of its own arbitrariness.

  Think about a flash mob for a second. You have a group of people who converge on a location, perform a coordinated action, and then disperse. During that window of time, they share a spatial proximity and, crucially, they share an intention. They are causally linked by their mutual awareness and the social cues they exchange. If restricted composition is true, there has to be a non-arbitrary condition that tells us when these people compose a single entity, let's call it a FlashMobObject, and when they do not. If you say shared intentionality is the key, you run into the problem of scope and duration. Does the object exist when they are planning it via text message? Does it cease to exist if one person leaves early? If the condition is too loose, then every group chat constitutes an object, which pushes us toward universalism where any collection of things is a whole. If the condition is too strict, requiring perfect synchronization, then the object flickers in and out of existence every time someone misses a beat, which makes the existence of the object vague, and most metaphysicians agree that existence itself cannot be vague.

  Now contrast that with an enduring physical object like an organism. We want to say this is a real composite because of causal integration. The heart pumps blood to the brain, the cells replicate to maintain the structure, and there is a homeostatic loop that keeps the parts working together for the survival of the whole. This seems like a much stronger candidate for restricted composition than the flash mob. But even here, the temporal boundary problem destroys the stability of the middle ground. Organisms undergo metabolic turnover where almost all the material constituents are replaced over time. There is no precise moment when the collection of cells becomes the organism or when the organism ceases to be during death. It is a gradual process. If you claim composition occurs only when causal integration reaches a certain threshold, you have to specify that threshold. Is it fifty percent integration? Ninety percent? Any line you draw is going to be arbitrary because nature does not provide sharp edges for these processes. You end up with a scenario where adding one single molecule could theoretically turn a non-object into an object, which is metaphysically absurd.

  This is where the attempt to find a stable middle ground really falls apart because any condition you propose to restrict composition either fails to exclude the things we want to exclude or fails to include the things we want to include. If you rely on causal integration, you have to admit that a flash mob has some causal integration through social signaling, just less than a body. If you rely on shared intentionality, you have to admit that conspiracies or even large corporations function as composite entities in the same way, which bloates your ontology with strange temporary objects. The universalist says just accept all of them, and the nihilist says accept none of them, but the restricted compositionist tries to say only the bodies count. The problem is that there is no natural joint in reality to carve at that distinguishes the body from the mob in a way that is precise enough to ground existence. The difference is one of degree, not kind, and existence cannot come in degrees.

  So here is my verdict on whether restricted composition holds up. I do not think it does, and I believe the middle ground is inherently unstable. The pressure comes from the fact that any restriction condition we devise to validate enduring objects while invalidating temporary collectives inevitably relies on vague predicates like strong cohesion or significant function. Since existence is an all-or-nothing affair, you cannot build it on a foundation of vague predicates without contradicting yourself. This leaves us with a hard choice. Universalism is logically consistent but ontologically bloated, forcing us to accept that every random scatter of particles is an object. Nihilism is ontologically sparse but counterintuitive, forcing us to say that neither tables nor people exist, only simple particles arranged in certain ways. Between the two, nihilism is the more stable position because it avoids the arbitrariness of drawing lines where none exist. It acknowledges that while we speak about flash mobs and bodies as useful conceptual tools for navigating the world, there is no metaphysical fact of the matter that makes one a real composite object and the other not.

  Ultimately, defending restricted composition requires believing that reality respects our common-sense categories, but the case of temporary collective entities shows that reality is indifferent to our distinctions between ad-hoc groups and enduring things. Both are just particles in spacetime with varying degrees of correlation. If we insist that composition is real, we have to accept it everywhere, and if we insist it is not everywhere, we have to accept it nowhere. Since universalism makes the concept of an object trivial, the only serious position that survives the scrutiny of temporal and causal vagueness is a form of nihilism. We should stop looking for a stable middle ground because the instability is not a bug in the theory, it is a feature of reality itself. Composition is not a fundamental relation, it is a pragmatic way we describe arrangements, and once you see that, the urge to find a metaphysical rule for when parts make a whole just disappears.
