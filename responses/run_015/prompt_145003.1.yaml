  Write a two-page interdisciplinary fellowship proposal (twelve months, hosted at a university center for science and society studies) for my application. I am a novelist developing a long-form narrative about institutional collapse, and I need rigorous conceptual scaffolding rather than decorative background. The proposal should address the following half-formed problem: the standard literature on Moloch and multipolar traps treats races to the bottom almost entirely as competitions over outcomes—actors degrading safety, ethical, or quality standards to outpace rivals. I suspect there is a parallel, under-theorized mechanism that I will call epistemic contraction: under identical competitive pressure, institutions do not merely cut corners in action but systematically discard nuanced causal variables from their internal risk-models, converging on an impoverished shared ontology that makes coordination conceptually impossible even when material interests align. The precise research question is whether this epistemic contraction is a distinct subtype of multipolar trap—governed by its own dynamics of belief-formation and communicative simplification—or merely an unavoidable epiphenomenon of outcome-races. The proposal should explain why existing collective-action and strategic-framing treatments of Moloch leave this distinction open, outline a comparative method examining model-simplification dynamics in frontier AI governance and transboundary climate regulation over the fellowship year, specify what a positive identification versus a null result would look like, define what would count as project failure, and provide an honest assessment of whether the scope is realistic for a non-specialist with strong narrative-analysis skills but no formal training in decision theory. Do not include a bibliography, reading list, or citations; I will supply references myself. The tone should be formal, precise, and suitable for an interdisciplinary review panel, while acknowledging that the applicant’s ultimate deliverable is conceptual architecture for a work of fiction.
