      *   **Mara's Position:** Frame message does all the heavy lifting. Without built-in decoding architecture, the Outer message is dead syntax. No real Inner message exists without the Frame.
      *   **Jonas's Position:** "Disjunctive Anchoring." A symbol can be grounded even if no single sensory channel delivered the quality, provided it participates in error-correction loops spanning multiple channels.
      *   **Concrete Case:** An AI trained *only* on temperature gradients but outputs the token "red-hot."
      *   **Mara's Take on Case:** Pure syntax, no Inner message.
