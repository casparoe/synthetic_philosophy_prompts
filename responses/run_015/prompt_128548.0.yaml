  4.  **Refining the Arguments:**
      *   *Mara:* If the receiver doesn't have the biology/culture to decode "red," the word is empty. The AI doesn't have vision, so "red" is just a label for "high temp." It's syntactic mapping, not semantic grounding. The Frame (the human mind) provides the meaning, not the AI.
      *   *Jonas:* Meaning isn't a little picture in the head. It's about how the symbol behaves in a network. If "red-hot" triggers the right avoidance behaviors, links to "danger," "fire," etc., via error correction (e.g., if it says "red-hot" but nothing burns, it corrects), it's grounded. The "disjunction" means you can anchor via heat *or* light. You don't need both.

