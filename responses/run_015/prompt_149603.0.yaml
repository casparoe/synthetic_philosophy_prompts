answer: |-
  This is an exceptionally sharp reconstruction. You have correctly identified that the "Dark Forest" (DF) argument is not merely a security dilemma but a specific claim about the structure of the information set and the dynamics of the type space. Your intuition that the argument conflates equilibrium selection with evolutionary survival is also correct and is the primary source of formal friction.

  Here is the translation and critique you requested, structured by your three deliverables.

  ### Part 1: Component-by-Component Translation

  **1. Postulate: Survival is the Primary Need**
  *   **Translation:** This is a lexicographic preference ordering or a boundary condition on the utility function. Let $u_i(a)$ be the payoff for civilisation $i$. If outcome $D$ (destruction) occurs, $u_i(D) = -\infty$. Alternatively, the discount factor $\delta_i \to 1$ conditional on survival, and $\delta_i = 0$ upon destruction.
  *   **Mapping:** Clean. This establishes that the game is not about maximizing resources per se, but maximizing the probability of continuation. It justifies risk aversion of an extreme order.

  **2. Postulate: Expansion > Resources (Finite Base)**
  *   **Translation:** This defines the payoff interdependence. It implies that for any two civilisations $i, j$, the resource constraint $R$ is binding. While not strictly zero-sum in a static sense, the dynamic growth implies $\lim_{t\to\infty} P(\text{Conflict}_{ij}) = 1$ unless one party is removed.
  *   **Mapping:** Clean, but requires a dynamic constraint. In a static game, trade could solve this. The DF argument requires an assumption that transaction costs (distance/time) preclude trade equilibria, making the interaction effectively zero-sum over the relevant horizon.

  **3. Mechanism: Chain of Suspicion**
  *   **Translation:** This is a breakdown of the **Common Prior Assumption (CPA)** and the impossibility of establishing **Common Knowledge**.
      *   Standard Bayesian games assume a common prior $P(\theta_i, \theta_j)$.
      *   DF posits that due to light-speed lag and lack of shared history, $i$ does not know $P(\theta_j)$, nor does $i$ know what $j$ believes about $P(\theta_i)$.
      *   Formally, the hierarchy of beliefs does not converge. $i$'s belief about $j$'s type is $\mu_{i}(\theta_j)$, but $i$ believes $j$'s belief about $i$ is $\mu_{j|i}(\theta_i)$, where $\mu_{j|i} \neq \mu_{i}$.
      *   Because communication is delayed by $T_{lag}$, by the time a signal is received, the state of the world $S_t$ has evolved to $S_{t+T_{lag}}$.
  *   **Mapping:** Requires an assumption not standard in tractable models. Standard models assume the *structure* of uncertainty is common knowledge, even if types are private. DF argues the *structure* itself (the distribution of aggression) is unknown and unlearnable. This moves the model from Bayesian Nash Equilibrium (BNE) to a setting with ambiguous priors (Maxmin Expected Utility) or Knightian uncertainty.

  **4. Mechanism: Capability Jumps (Technological Explosion)**
  *   **Translation:** This makes the type space **endogenous and stochastic**.
      *   Standard model: $\theta_i \sim F(\theta)$ drawn at $t=0$, fixed forever.
      *   DF model: $\theta_{i, t+1} = f(\theta_{i, t}, \epsilon_t)$, where $\epsilon_t$ has fat tails. A "weak" type $\theta_L$ can transition to "threat" type $\theta_H$ with non-negligible probability over interval $\Delta t$.
      *   This creates a **Real Option** value to striking. Waiting has an option value (gathering info), but the DF argument claims the "cost of waiting" (risk of $\theta_j$ jumping to $\theta_H$) dominates the option value of waiting.
  *   **Mapping:** Clean, but computationally brutal. This requires a dynamic programming formulation where the value function $V_t(\theta_i, \mu_i)$ depends on the evolution of the belief $\mu_i$ about the opponent's *future* capacity, not just current capacity.

  **5. Conclusion: Pre-emption and Silence**
  *   **Translation:** "Strike on Detection" is a **Dominant Strategy** (or at least the unique surviving strategy in an ESS sense). "Silence" is a **Pooling Equilibrium** where all types choose $a = \text{Hide}$.
      *   If $\text{Strike}$ is dominant, then $\text{Hide}$ is the best response to the expectation that others will Strike.
      *   Formally: $E[u_i(\text{Strike} | \text{Detect})] > E[u_i(\text{Wait} | \text{Detect})]$ for all $\mu_i$.
  *   **Mapping:** Requires the "Capability Jump" risk to be high enough that the expected loss from waiting exceeds the expected gain from peace.

  **6. Deterrence Move (The Swordholder)**
  *   **Translation:** This is a **Commitment Device** designed to alter the payoff matrix of the opponent. It attempts to create a **Subgame Perfect Equilibrium** where the opponent chooses $\text{Not Strike}$.
      *   It relies on a threat: "If you strike, I broadcast coordinates," leading to $u_{opp} = -\infty$.
      *   Credibility requires that carrying out the threat is optimal *ex-post* (after the opponent strikes).
  *   **Mapping:** Problematic. In standard theory, this threat is not credible unless the commitment is binding. If the opponent strikes, the Swordholder is dead; broadcasting coordinates post-mortem yields no utility to the Swordholder (who is dead). Thus, the threat is time-inconsistent unless the mechanism is automated (removing the agent) or the utility function includes posthumous vengeance (lexicographic preference on punishment).

  ---

  ### Part 2: The Residue Report (What Doesn't Fit)

  This section addresses the frictions where the DF argument strains or breaks the standard toolkit.

  **1. Equilibrium vs. Selection (The Survivorship Artefact)**
  You identified this correctly. The DF hypothesis oscillates between two distinct claims:
  *   **Claim A (Rational Equilibrium):** All civilisations are rational actors who deduce that Silence/Strike is the BNE. Therefore, no one broadcasts.
  *   **Claim B (Evolutionary Selection):** Civilisations broadcast, get destroyed, and are removed from the sample. We only observe the survivors who stayed silent.

  *   **The Residue:** If Claim A holds, we do not need Claim B. If rationality is common knowledge, the "Chain of Suspicion" should be solved by deduction, not by blood. If Claim B holds, then the "rationality" assumption is false; civilisations are learning via trial and error (reinforcement learning), not Bayesian updating.
  *   **Toolkit Indictment:** Standard game theory struggles to model the *transition* from B to A. It assumes agents are either rational (Equilibrium) or adaptive (Evolutionary Game Theory). DF assumes agents are rational enough to fear death but not rational enough to deduce the equilibrium without trying to broadcast first.
  *   **Verdict:** The argument is stronger as an **Evolutionary Stable Strategy (ESS)** claim. The "Dark Forest" is not a Nash Equilibrium of a single game, but the steady state of a population dynamic where "Broadcasters" have fitness 0. Your silence is not a prediction of optimisation; it is a condition of your existence (selection bias).

  **2. The Type Space and Common Priors**
  *   **The Residue:** You noted the difficulty with fixed type spaces. In DF, the "type" (hostility/capability) is not just private information; it is **non-stationary**.
  *   **Toolkit Indictment:** Standard Bayesian Dynamic Games assume the transition function $P(\theta_{t+1}|\theta_t)$ is common knowledge. DF argues that the *physics* of technological growth is unknown. One civilisation might stagnate; another might explode. There is no common prior on the *distribution of distributions*.
  *   **Verdict:** This indicts the toolkit's reliance on the Harsanyi transformation. To model DF faithfully, you need a model of **Ambiguity** (e.g., Epstein-Zin preferences or Maxmin Expected Utility) where players act as if nature is adversarial regarding the opponent's type evolution. The "Chain of Suspicion" is formally a refusal to assign a precise prior $P(\theta_j)$ because the sample space of possible civilisations is unknown.

  **3. Signalling Impossibility (Why no Separating Equilibrium?)**
  *   **The Residue:** In standard signalling games (Spence), a separating equilibrium exists if the cost of signalling $c(\theta)$ is lower for the "good" type than the "bad" type.
  *   **Why DF blocks this:**
      1.  **Infinite Loss:** The receiver's loss from trusting a "bad" type is $-\infty$. No finite cost signal $c(\theta)$ can offset an infinite risk. The likelihood ratio required to update the belief $\mu(\text{Hostile})$ to a level where $\text{Wait}$ is optimal is unattainable.
      2.  **Dynamic Types:** Even if $j$ signals "I am Weak ($\theta_L$) today," the receiver $i$ cares about $\theta_{j, t+k}$. Since $\theta$ evolves stochastically (Capability Jump), a signal about $\theta_t$ is uninformative about $\theta_{t+k}$. The signal depreciates instantly.
      3.  **Mimicry:** A "Hostile" civilisation can mimic "Weakness" to lure $i$ into a false sense of security before a tech jump. Since the cost of hiding capability is low (cheap talk or low-cost concealment), the Intuitive Criterion fails to rule out pooling.
  *   **Verdict:** The impossibility of communication is not a separate empirical premise; it is a derived result of the **payoff asymmetry** (finite gain from trade vs. infinite loss from error) combined with **type non-stationarity**.

  ---

  ### Part 3: Reverse Residue (What Game Theory Has that DF Ignores)

  Here is where your vocabulary offers tools that the DF narrative underutilizes or assumes away.

  **1. Repeated Games and Reputation**
  *   **The Gap:** DF treats every detection as a one-shot game. However, if detection is persistent (you can watch them for centuries), it is an infinitely repeated game.
  *   **The Tool:** **Folk Theorems**. If the discount factor $\delta$ is sufficiently high, cooperation (Non-Aggression) can be sustained as a Subgame Perfect Equilibrium via trigger strategies.
  *   **DF Counter-argument:** DF assumes $\delta \to 0$ effectively, because the "Capability Jump" creates a high probability that the game ends exogenously (one side becomes too powerful) or that the opponent's type changes fundamentally.
  *   **Critique:** DF ignores the possibility of **gradual trust building**. Even with uncertainty, small, costly, verifiable steps (e.g., sharing low-level science) could update priors slowly. DF assumes the "Chain of Suspicion" cannot be broken incrementally. A formal model might show that for certain parameter ranges of tech-growth variance, a "Slow Reveal" equilibrium exists.

  **2. Endogenous Commitment (The Swordholder Problem)**
  *   **The Gap:** The "Swordholder" deterrence system relies on a human (or entity) holding the trigger.
  *   **The Tool:** **Time Inconsistency / Subgame Perfection**. Once the enemy strikes, the Swordholder is dead or dying. Carrying out the retaliation (broadcasting coordinates) brings destruction upon oneself (or one's remnants). A rational actor would not push the button *ex-post*. Therefore, the threat is not credible *ex-ante*.
  *   **Critique:** DF hand-waves this by implying the Swordholder is ideologically committed or the system is automated. In game theory, this requires a **binding commitment device** (e.g., a dead-hand system that cannot be stopped). Without modelling the internal game of the civilisation (Principal-Agent problem between the Civ and the Swordholder), the deterrence equilibrium is not Subgame Perfect. The enemy should call the bluff.

  **3. Correlated Equilibria and Mediators**
  *   **The Gap:** DF assumes bilateral interaction in a vacuum.
  *   **The Tool:** **Correlated Equilibrium**. If a third party (or a natural phenomenon) could provide a signal that correlates the actions of $i$ and $j$ without revealing types, cooperation might emerge.
  *   **Critique:** In the DF universe, the "mediator" is the universe itself (the dark forest). But formally, if multiple civilisations exist, a coalition could form against an aggressor. DF assumes no coalition stability. Game theory suggests that if $N > 2$, balancing behavior (forming alliances against the strongest) is a standard equilibrium outcome. DF assumes $N$ is effectively infinite and anonymous, preventing coalition formation.

  **4. Information Acquisition as a Strategic Variable**
  *   **The Gap:** DF treats detection as exogenous or binary.
  *   **The Tool:** **Endogenous Information**. Players can choose how much to invest in sensing vs. hiding.
  *   **Critique:** A formal model would allow civilisations to invest in "Stealth" ($s_i$) and "Surveillance" ($v_i$). An equilibrium might exist where high surveillance is too costly relative to the benefit, leading to a "Low-Information" equilibrium that is stable without requiring universal genocide. DF assumes surveillance is cheap and strike is cheap, which forces the aggressive equilibrium.

  ### Summary Assessment

  Your reconstruction is robust. The Dark Forest hypothesis is best modelled not as a Bayesian Nash Equilibrium of a static game, but as the **limit of a Dynamic Game with Endogenous Types and Ambiguous Priors**, where the observed silence is an **Evolutionary Selection effect** rather than a pure rationality deduction.

  The "Chain of Suspicion" is formally a violation of the Common Prior Assumption. The "Capability Jump" is a non-stationary type transition that destroys the value of signalling. The "Deterrence" is a commitment device that fails Subgame Perfection unless automated.

  The model holds together if you accept two strong axioms that standard economics often relaxes:
  1.  **Lexicographic Survival:** $u(\text{death}) = -\infty$ dominates all other payoff considerations.
  2.  **Unbounded Type Variance:** The probability of a "weak" type becoming a "strong" type is high enough that no finite signal can update beliefs sufficiently to justify risk.

  If you relax either (e.g., survival is valuable but trade is more valuable; or tech growth is bounded), the "Dark Forest" equilibrium collapses into a standard security dilemma with potential for cooperation. The story's power relies on the parameters being in a specific, extreme region of the model space.
