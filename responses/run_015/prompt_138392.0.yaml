answer: |-
  To the Editor, *Meridian Ledger*

  Re: The Chrononeutral Usage Manual (3rd Ed.)

  I write this not as an enemy of progress, but as a guardian of clarity. For twenty years I have managed the copy desk at the *Ledger*, ensuring that what we print reflects the world as it is, not as a committee wishes it to be. The Commission on Chronological Equity's latest proposal replaces the generic "day" with "person" wherever the referent is not specifically solar. We are asked to write *personlight*, *personbreak*, *personcare*. We are asked to wish colleagues a "good person" instead of a "good day." At the far edge of this logic, we arrive at *holiperson* and *someperson*.

  This is not equity. It is category error masquerading as morality.

  The word "person" denotes an agent, a human being. "Day" denotes a period of illumination, a cycle of the earth. When the Commission insists on *personlight*, they ask us to say that the sun emits humanity. When they propose *personcare*, they confuse the time of care with the object of it. A neutral term must not carry its own baggage. "Person" is heavy with baggage. It points relentlessly at the human category it was supposed to dissolve. We are not trying to erase people; we are trying to describe time. By forcing "person" into the slot of "day," the Commission ensures that every sentence about time becomes a sentence about us. It is the opposite of neutrality.

  My colleague Bram, who runs the night desk, argues that I am missing the point. Bram has worked the shadows for twenty years. He tells me this is theatre. He argues that a shared default is a coordination device. We need a focal point to schedule meetings, to run trains, to print newspapers. The sun is that point. Bram says de-marking a term imposes a small cost on every speaker for a symbolic gain. He asks me to consider the cognitive load. Every time a printer asks "Is this for personbreak?", they must pause to decode. Bram says: "Marley, men and women both walk the street. Only one half of the planet sees the sun at once. The diurnal default has a naturalistic rationale. This isn't patriarchy, it's photons."

  He is right that the sun is real. He is right that most citizens sleep when it sets. But he is wrong to think that makes the language harmless. When the etymology is dead, the rule breaks. Consider "someday." We use it to mean "eventually," not "on a specific solar date." Under the Manual, "someday" becomes "someperson." *I will see you someperson.* It strips the word of its temporal hope and replaces it with a vague humanism. Consider "day one." We mean "the beginning." "Person one" sounds like a headcount. The Commission treats language as a code to be patched, but language is a river. You cannot dam it with hyphens.

  And there are practical impossibilities. Try saying "yesterperson." The tongue rejects it. It is unpronounceable in good faith. It demands a sincerity nobody feels. We are being asked to perform a respect we do not owe, using words that do not work, to solve a problem that is mostly physical.

  I know the Commission will call this resistance privilege. They will say the "day" default erases the Second Watch. They will say that making the diurnal majority pay a small cost in attention is justice. But justice requires a clear target. What is the harm in "good day"? It is a wish for light. It is not a claim that night people are less than. If we change the words, do we change the conduct? Will the trains run later? Will the banks stay open? Or will we simply have a new vocabulary for the same old hours?

  I have spent my career ensuring the *Ledger* hits the streets at dawn. It is a demanding schedule. It requires sacrifice. We all adjust to the city's rhythm. To suggest that the rhythm itself is oppressive is to war with the sky. I am not asking the Second Watch to vanish. I am asking them to let language remain a tool for coordination, not a battlefield for identity. If we cannot agree on what "day" means, we cannot agree on when to meet. And if we cannot meet, we are not a city.

  We are just people standing in the dark, shouting different names at the sun.

  Yours,

  Marley Dane
  Copy Chief, *Meridian Ledger*
  *Drafted: 03:14*

  ***

  The streetlamps outside my window are the only things burning now. The curtains are drawn tight against the morning that belongs to everyone else. Bram thinks I fight for the sun because I love it. He doesn't know I fight it because I have learned to live in its shadow without burning. I am Second Watch. I have passed for diurnal since '98. I defend the default because it is the wall that hides me. If the Commission wins, they shine a light on the difference I have spent a career erasing. They want to change the words to change the thought. I know it won't work. But I also know that if they stop trying, I will never have to explain why my morning starts when theirs ends. I want the coordination device. I want the default. I want to be the exception that proves the rule, not the proof that the rule is broken.

  I hit send. The sun will be up in two hours. I will go to sleep. The *Ledger* will go to the city. It will say "good day." And I will wish it meant what it used to.
