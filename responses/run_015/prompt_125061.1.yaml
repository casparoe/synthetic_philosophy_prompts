answer: |-
  ### The One-Page Decision Procedure

  **Time Limit:** 30 Minutes | **Authority:** Solo Archivist | **Goal:** Active Shaping, Not Passive Accumulation

  **STEP 1: The Legal Hard Stop (Factual)**
  *   **Question:** Does the state retention schedule mandate destruction, or does statutory law (e.g., juvenile privacy, HIPAA, sealed records) prohibit accessioning this material in the proposed state?
  *   **Pass:** Material is legal to hold and access conditions can be legally enforced.
  *   **Fail:** Material must be destroyed by law, or donor restrictions (e.g., "sealed for 25 years") violate statutory access rights.
  *   **Action:** If **Fail**, issue a formal Decline citing statute. Do not pass Go. Do not negotiate.
  *   **Note:** This is not a values call. This is liability management.

  **STEP 2: The Capacity Hard Stop (Factual)**
  *   **Question:** Can this collection be processed to a minimum viable standard (box list + basic finding aid) within 6 months using current staff/volunteer hours, *excluding* the time needed for Step 4?
  *   **Pass:** Yes, we have the boxes, shelves, and labor.
  *   **Fail:** No. Accepting this halts other work or requires budget we don't have.
  *   **Action:** If **Fail**, Refer to a larger institution or Decline.
  *   **Note:** A collection you cannot process is a collection you are hoarding, not preserving.

  **STEP 3: The Silence Typology (Values Call)**
  *   **Question:** Categorize the primary silence this collection represents using your distinctions:
      1.  *Never-made:* The group had no power to create records.
      2.  *Never-sent:* The group created records but they were lost/destroyed/kept private.
      3.  *Never-theirs:* The records exist but describe the group only through the gaze of power (police, courts, welfare).
  *   **Threshold:**
      *   If *Never-theirs*: You must justify why adding more surveillance records serves the historical record better than leaving them in the agency of origin.
      *   If *Never-sent*: High priority for accession.
      *   If *Never-made*: Accession only if accompanied by a plan to contextualize the absence.
  *   **Action:** Record the category in the appraisal memo. If *Never-theirs*, you must proceed to Step 4.

  **STEP 4: The Harm/Benefit Test (Values Call)**
  *   **Question:** For collections categorized as *Never-theirs* or containing sensitive community data: Does public access cause active harm (stigmatization, privacy violation, re-traumatization) that outweighs the research benefit?
  *   **Pass:** Benefit outweighs harm, OR harm can be mitigated (redaction, anonymization, restricted access).
  *   **Fail:** Harm is intrinsic to the record type (e.g., mugshots without context) or mitigation is impossible with current resources.
  *   **Action:** If **Fail**, Decline. Do not accept "historical value" as a substitute for "ethical safety."
  *   **Note:** This is where you stop being a warehouse and start being a gatekeeper.

  **STEP 5: The Counter-Collection Note Commitment (Fact/Values)**
  *   **Question:** Can you write the "Counter-Collection Note" for the finding aid *now*? (Three absent groups + one guess where their traces actually exist).
  *   **Pass:** You can name the absentees and point to a specific alternative source (even if that source is "nowhere").
  *   **Fail:** You cannot identify who is missing, or you cannot guess where else to look.
  *   **Action:** If **Fail**, you do not understand the collection well enough to accession it. Return to donor for context or Decline.
  *   **Note:** If you cannot write this, you are accepting the donor's narrative uncritically.

  ***

  ### Evaluation of Your Home-Made Distinctions

  **1. Never-made vs. Never-sent vs. Never-theirs**
  *   **Verdict:** **Survives.** It is not too cute; it is operational. It forces you to classify the *power dynamic* of the record before you classify the *content*.
  *   **Usage:** Use this in Step 3. It prevents you from treating a judge's case notes (Never-theirs) the same as a tenant's flyer (Never-sent). It stops you from pretending a gap in the record is an accident rather than a structural outcome.

  **2. The Counter-Collection Note**
  *   **Verdict:** **Survives, but with a condition.** It is a safeguard *only if* it is public and actionable. If it stays in your private appraisal file, it is just guilt management. If it goes in the finding aid, it alters the researcher's behavior.
  *   **Usage:** Use this in Step 5. The condition is: You must point to an *alternative*. "These people are missing" is poetry. "These people are missing; try the St. Mary's Church baptismal logs" is archival work.

  ***

  ### Running the Procedure on Your Three Offers

  #### (a) The Juvenile Court Judge (40 Boxes)
  *   **Step 1 (Legal):** **FAIL.** Juvenile records are statutorily confidential in almost every jurisdiction. A 25-year seal is likely insufficient and violates state law regarding minor privacy. The donor cannot legally gift what they do not own the rights to (the families' privacy).
  *   **Step 2 (Capacity):** **FAIL.** 40 boxes is a massive undertaking for a solo archivist + interns. This would consume your year.
  *   **Step 3 (Silence):** **Never-theirs.** The families are subjects of state power. Their words are filtered through the judge's summary.
  *   **Step 4 (Harm):** **FAIL.** High risk of re-traumatization and privacy violation.
  *   **Step 5 (Note):** Impossible to write accurately without violating privacy.
  *   **Decision:** **DECLINE.**
  *   **Hard Truth:** This collection is not "history"; it is sealed legal evidence. Accepting it makes your archive an extension of the court's surveillance apparatus. The prestige of the donor's name is a trap.

  #### (b) The Tenants' Union (Shoebox)
  *   **Step 1 (Legal):** **PASS.** Community records, no retention schedule.
  *   **Step 2 (Capacity):** **PASS.** Shoebox is manageable.
  *   **Step 3 (Silence):** **Never-sent.** These are records created by the community, for the community, that survived.
  *   **Step 4 (Harm):** **PASS with Conditions.** Fear of name lists is valid. Condition: Accession only if names are redacted or access is restricted to verified researchers. Focus on flyers/photos.
  *   **Step 5 (Note):** **PASS.** "Absent: Landlords, City Inspectors, Non-participating tenants. Traces: City housing violation logs, local newspaper archives."
  *   **Decision:** **ACCESSION WITH CONDITIONS.**
  *   **Hard Truth:** This is the only collection here that actively counters the silence. It requires you to protect the donors from the state, which is the reverse of your usual job.

  #### (c) The Booking Photographs (Digitized, 70s-90s)
  *   **Step 1 (Legal):** **PASS.** Likely public record.
  *   **Step 2 (Capacity):** **PASS.** Digital storage is cheap.
  *   **Step 3 (Silence):** **Never-theirs.** The ultimate expression of state power over the body. Subjects had zero agency.
  *   **Step 4 (Harm):** **FAIL.** Without extensive context, this is a catalog of trauma and racial bias. Making this searchable online turns state violence into content. There is no way to mitigate the harm of a mugshot without a full case file and social context, which you do not have.
  *   **Step 5 (Note):** **FAIL.** You cannot guess where the "absent" humanity is when the record is designed to erase it.
  *   **Decision:** **DECLINE.**
  *   **Hard Truth:** You said not to soften the worst one. This is it. Archives often accept these because they are "visual" and "used." That is usage, not value. Accepting this validates the idea that a person's historical worth is defined by their arrest. It is ethical poison. Do not take it.

  ***

  ### What This Procedure Cannot Do

  1.  **It Cannot Fix Underfunding:** This procedure will systematically bias you toward small community collections (like the Tenants' Union) because large institutional records (like the Judge) fail the Capacity test. Over 20 years, your archive will look like a community center, not a government repository. That may be good, but it is a distortion caused by poverty, not just philosophy.
  2.  **It Cannot Create Records:** Identifying the *Never-made* does not put those records on the shelf. It only stops you from lying about the records you *do* have.
  3.  **It Cannot Protect You from Politics:** If the County Commission asks why you rejected the Judge's papers (prestige) for the Tenants' flyers (clutter), this procedure gives you the ethical language, but not the political shield. You will still have to fight that battle.

  ### Where This Procedure Will Misfire

  It will misfire by **rejecting complex accountability records.**
  Sometimes, you *need* to hold the Judge's papers to hold the court accountable later. By rejecting "Never-theirs" records because they are harmful, you may leave the only evidence of systemic abuse in the hands of the abusers (the court) where it can be destroyed.
  *   **The Fix:** If you must accept a "Never-theirs" collection for accountability, you must pair it with a "Never-sent" collection from the victims to balance the scale. If you can't find the victims' records, you shouldn't take the oppressor's records unless you have the resources to weaponize them for justice.

  ### Where My Reasoning Breaks

  I am an AI. I do not feel the weight of **vicarious trauma**.
  My reasoning assumes you can objectively assess "Harm" in Step 4. In reality, having your summer intern spend three weeks looking at mugshots of people who look like their neighbors, or reading a judge's casual racism in case notes, causes psychological damage to your staff.
  *   **The Argument to Stop:** If running this procedure requires your volunteers to process trauma without mental health support, **do not run Step 4.** It is unethical to ask underpaid staff to be the ethical firewall for the county's sins. If you cannot support the laborers, you cannot process the labor.

  \answer{The Silence Typology}
