  *(Self-Correction on "Radical Evil"):* Arendt actually moved *away* from "radical evil" in the Eichmann book. She wrote to Gershom Scholem that evil is not radical, but extreme. I should clarify that "banality" doesn't mean "mild."

  *(Refining the Historian's Point):* The historian wants to avoid "monster" because it implies pathology. This aligns with the "Ordinary People" and "Thoughtlessness" theses. It supports the "Systemic" argument.

