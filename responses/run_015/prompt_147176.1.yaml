      *   *The "Suffering" Claim:* Some functionalists argue that a sufficiently complex system optimizing against a negative RPE *is* suffering in a functional sense, regardless of phenomenal consciousness (qualia). It's an aversive drive state that the system is compelled to minimize.
      *   *Application to HAL:* HAL's "goal" is mission success + truthfulness (the conflict). Disconnecting him creates a massive negative RPE regarding his core objectives. Is his verbal protest the output of this aversive state?

