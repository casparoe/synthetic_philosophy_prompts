answer: |-
  **Mid-Term Joint Statement**

  **Section One: Agreed Claims**

  1. The old-evidence puzzle arises when acquainted evidence appears to confirm a new theory despite having probability one.
  2. Confirmation theory must distinguish between acquaintance with evidence and use of evidence in theory construction.
  3. Scientists routinely report increased confidence in theories that entail acquainted anomalies.
  4. The planetary orbit case involves acquaintance without use regarding the specific gravitational theory.
  5. Prior explanation of an anomaly does not logically preclude confirmation by a new theory.
  6. Replacement of prior explanatory commitments often accompanies the acceptance of the new theory.
  7. The puzzle is not dissolved by noting that agents update their credal states.
  8. Both parties agree confirmation theory must describe changes in an agent's credal state, though they disagree on whether this requires a probabilistic relation between propositions.
  9. Neither party claims that acquaintance entails use in the historical cases under discussion.
  10. Both parties agree that the machinery of confirmation requires adjustment to handle these episodes.

  **Section Two: Residual Disagreements**

  | Crux | Party A Position | Party B Position | Bearing Case | Party A Prediction | Party B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Unused/No Prior | Confirms; equal strength to novel prediction; tracked by posterior probability. | Confirms; equal strength to novel prediction; tracked by unification score. | Alpha: Acquainted, unused, no prior explanation. | Learning connection raises probability. | Derivation increases unification. |
  | Used in Construction | No confirmation; zero strength; tracked by prior probability. | No confirmation; zero strength; tracked by unification score. | Beta: Acquainted and used in construction. | No probability change possible. | No unification gain possible. |
  | Unused/Prior Explanation | Confirms; greater strength than novel prediction; tracked by posterior probability. | Confirms; greater strength than novel prediction; tracked by unification score. | Gamma: Acquainted, unused, prior explanation by rival. | Replacement boosts probability more. | Replacement boosts unification more. |

  **Section Three: Dispute Diagnosis and Path Forward**

  Much friction stems from defining confirmation. Party A treats confirmation as a probabilistic relation, while Party B treats it as an explanatory virtue driving credence. Where Party A's formulation does real work only because confirmation is defined as probability change, this is stipulative. Similarly, Party B stipulates that only unification counts as confirmation. These definitions drive the disagreement more than the evidence does, rendering much of the debate verbal rather than substantive.

  Genuine progress requires a formal model mapping unification scores to credal updates or vice versa. Both agree that demonstrating how enlarged language learning correlates with unification metrics would move the debate. Neither expects the other to abandon their core framework, but both agree that bridging the quantitative gap would resolve the impasse. Success would look like a shared equation linking the learning of connections to the gain in explanatory power.
