  I'm helping my flatmate mark some coursework for an online philosophy module he's taking — he's doing medieval Islamic thought and I'm just reading along for fun, though I'm not an acedemic or anything. We were discussing Al-Ghazālī's occasionalism over coffee last week and I got a bit obsessed with the fire-and-cotton thing, especially this pairing problem I came across: if God is directly creating every effect, why does He always pair fire with burning rather than with, I don't know, the cotton turning blue? Anyway, the exam question was: 'Explain Al-Ghazālī's occasionalist account of causation using the fire and cotton example, and say whether he allows any genuine role for secondary causes or removes them altogether.'

  Here's the student's answer, copied word for word:

  'Al-Ghazālī's occasionalism says that fire and cotton don't have a necessary connection. He uses the example of fire touching cotton but not burning it — God could just create the cotton's blackening without the fire being there at all, or keep the fire present but not create the burn. So causation is just God creating events one after another in a regular pattern He chooses to maintain (His custom or sunnah). This doesn't mean fire and cotton don't exist; they do, but they have no causal power of their own. In fact, Al-Ghazālī treats them like instruments that God uses, similar to how a pen writes but the real writer is the person holding it. The pen is still involved, but all the real work belongs to God. So secondary causes are kept as instruments, but they're completely dependent on God for any effect. Because God usually sticks to the same pattern, science works fine, but technically every burning is a direct act of God, almost like a continuous miracle.'

  Can you grade this out of 70? I think it's mostly on the right track but I'm suspicious about the pen-and-writer bit — it sounds more like something Aquinas might say? — and also I'm not sure about calling every burning a continuous miracle, since I thought miracles were specifically when God breaks His usual pattern. I'd like specific feedback: a point-by-point breakdown of what's correct, what's muddled or wrong, and whether missing the pairing problem matters. Don't just say 'good answer' or 'poor answer' — I need the actual marks and the reasoning for each part so I can write it up for him.
