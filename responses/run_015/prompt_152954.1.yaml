  Here are eight interview questions designed to press the philosophical content of her project. The first three address the specific tensions you highlighted, complete with the likely deflections and sharper counter-follow-ups. The remaining five maintain that same pressure to ensure she defends the Lewisian framework directly.

  **1. The Common Knowledge Requirement in Anonymous Spaces**
  **Question:** Lewis insists that convention relies on iterated common knowledge—I know that you know that I know. In open-source threads or ephemeral social media feeds, participants are often anonymous and constantly rotating. How do you establish the necessary epistemic states for a convention when the population doesn't even know who else is participating, let alone what they know?

  *   **Likely Follow-up:** She will likely argue that public visibility acts as a functional surrogate for common knowledge. She may claim that because the thread history is visible to all, the "knowledge" is embedded in the environment, scalable enough to satisfy the condition without requiring explicit mutual awareness.
  *   **Counter-Follow-up:** But Lewis's condition is about the mental states of rational agents, not just data availability. If I don't know *who* is looking at the thread, I can't form a belief about *their* expectations. If you replace common knowledge with mere public visibility, aren't you actually abandoning the Lewisian framework for a stimulus-response model?

  **2. The Arbitrariness Condition vs. Platform Architecture**
  **Question:** A core clause in Lewis's account is arbitrariness: there must be an alternative regularity that could have solved the coordination problem just as well. But digital platforms often force coordination through rigid architecture—like a specific button for "reblogging" or a mandatory field for "commit messages." When the interface eliminates alternative equilibria, doesn't the arbitrariness condition collapse?

  *   **Likely Follow-up:** She will likely suggest that while the architecture is fixed, the *interpretation* of how to use it remains arbitrary. She might argue that users still coordinate on the *meaning* of the click, not just the mechanical act, preserving the convention within the constraints.
  *   **Counter-Follow-up:** If the cost of deviation is a system error or an automatic ban, that's not a coordination problem; it's a command. Lewisian conventions rely on mutual expectation of compliance, not code-enforced compliance. If the platform removes the ability to do otherwise, where is the convention?

  **3. Regularity and Algorithmic Enforcement**
  **Question:** You argue that regularity in behavior is maintained even when enforcement is partly handled by bots or algorithms. But for Lewis, regularity stems from mutual expectations among rational agents. If a bot bans a user for violating a norm, that's causal enforcement, not normative expectation. How do you square algorithmic punishment with the agency required for a convention?

  *   **Likely Follow-up:** She will likely propose treating the algorithm as part of the agent pool. She may argue that the algorithm represents the codified preferences of the community, so interacting with it is functionally identical to interacting with a human enforcer.
  *   **Counter-Follow-up:** Algorithms don't have preferences or the capacity to change their behavior based on expectations of others. They execute code. If the "regularity" is maintained by a script that cannot coordinate back, you're describing a system of rules, not a Lewisian convention. Why insist this is still Lewis?

  **4. Lewisian Rationality vs. Evolutionary Game Theory**
  **Question:** You insist this is straight Lewisian work rather than evolutionary game theory. But Lewis relies on explicit rationality and reasoning, whereas digital norms often emerge from blind imitation or trial-and-error. If the mechanism of adoption is evolutionary rather than rational, what work is the Lewisian framework actually doing here?

  *   **Likely Follow-up:** She will likely claim that rationality can be bounded or implicit. She may suggest that even if users don't consciously reason, the system stabilizes in a way that *mimics* rational coordination, which is sufficient for the ontology.
  *   **Counter-Follow-up:** If the mechanism is evolutionary, the ontology should be evolutionary. By forcing a rationalist framework onto an evolutionary process, aren't you misdescribing the social reality just to keep the Lewisian label?

  **5. The Source of Normative Force**
  **Question:** In Lewis's account, the "ought" of convention is prudential—I ought to conform because I prefer to coordinate. In these micro-norms, users often follow rules even when it costs them status or time, sometimes purely out of a sense of digital duty. Where does this non-prudential normative force come from in your account?

  *   **Likely Follow-up:** She will likely argue that the preference structure is deeper than it appears. She may say users prefer social standing or long-term community health over short-term gains, keeping it within the prudential framework.
  *   **Counter-Follow-up:** That stretches the definition of "preference" until it's unfalsifiable. If every action is explained by a hidden preference, you aren't explaining the norm; you're just describing the behavior. How do you distinguish a convention from a mere habit if the preference is always assumed?

  **6. Coordination vs. Conflict of Interest**
  **Question:** Lewisian conventions solve coordination problems where interests align. But many digital micro-norms, like attribution etiquette, exist precisely because interests *conflict*—people want credit without doing the work. Can a framework built on pure coordination explain norms that arise from conflict?

  *   **Likely Follow-up:** She will likely suggest that the conflict is secondary to the higher-order coordination of having a system at all. She may argue that everyone prefers a system with rules over a system with no rules, restoring the coordination baseline.
  *   **Counter-Follow-up:** But the specific content of the rule benefits some groups over others. If the convention systematically advantages early adopters or platform owners, it's not a pure coordination equilibrium. Does your account have room for power dynamics, or does it assume away the conflict?

  **7. Defining the Population**
  **Question:** For a convention to exist, there must be a specific population where the regularity holds. In distributed networks, boundaries are porous. At what point does a micro-norm stop being a local convention and become something else, and who gets to decide where that boundary lies?

  *   **Likely Follow-up:** She will likely argue for a functional definition of the population. She may say the population is defined by those who recognize the norm, making the boundary self-selecting rather than fixed.
  *   **Counter-Follow-up:** That makes the existence of the convention circular. The norm exists because the population recognizes it, and the population is defined by those who recognize the norm. How do you ground this ontologically without begging the question?

  **8. Ontological Discovery vs. Creation**
  **Question:** By labeling these behaviors "distributed micro-norms" within a Lewisian framework, are you discovering an existing social ontology, or are you imposing a structure that makes these behaviors look more organized than they actually are?

  *   **Likely Follow-up:** She will likely assert that the stability of the behavior proves the ontology. She may argue that because the patterns persist over time, they must reflect a real underlying social structure.
  *   **Counter-Follow-up:** Patterns persist in weather systems too, but we don't call them conventions. If the only difference is human involvement, but the human involvement is minimal or automated, aren't you projecting intentionality onto what is essentially digital noise?
