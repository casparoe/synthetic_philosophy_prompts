          *   *Daniel:* Occam's Razor. Invisible structure = ether. Shave it away.
          *   *Assessment:* Maya is technically correct that SR is compatible with a Lorentzian interpretation (empirically equivalent). However, Daniel is correct on methodological grounds (parsimony). This is a classic underdetermination problem. Neither is "wrong," but Daniel represents the scientific consensus view.
          *   *Rating:* Both are logically consistent. Daniel wins on scientific methodology; Maya wins on logical possibility.

      *   **Move 3:**
