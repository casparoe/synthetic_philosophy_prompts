  **Reasoning:**
  While the Strict Knowledge Norm (Candidate A) fits the data, it fails to capture the specific texture of her hesitation in the Witness case ("lie or breach of duty"). A pure epistemologist would simply say "she doesn't know." Your interlocutor's invocation of "duty" suggests she views assertion not merely as a transfer of information, but as a **social undertaking** bound by institutional expectations.

  This explains why the Meteorologist (Case 1) is blamed more heavily than a layperson making a weather guess would be; her professional role raises the epistemic threshold. It also explains the Historian (Case 3): in academia, the duty is to truth, which she possesses, so the expression of uncertainty is permissible. In the Student case (Case 4), the duty is to understanding, which he lacks.

  **Prediction for the Surgeon:**
  She will **condemn** the surgeon, but her reasoning will likely conflate the epistemic with the ethical. She will not just say "she doesn't know"; she will say "she shouldn't be speaking/operating in that state." The lack of cognitive capacity is treated as a breach of professional duty, not just an epistemic deficit.

  ### 3. Proposed Discriminatory Case

  To distinguish between the **Strict Knowledge Norm** (which cares about the factive state) and the **Internalist Justification Norm** (which cares about the ability to defend), you need a case where a speaker *knows* but *cannot currently defend*.

  **The "Forgotten Evidence" Scenario:**
  > A senior professor asserts a specific historical date in a lecture. The date is true, and she believes it. She knows it because she researched it extensively ten years ago. However, she has temporarily forgotten the specific archival source that justifies it. If challenged, she could not cite the evidence, though she is confident her memory is reliable. She asserts the date categorically.

  **Discriminative Logic:**
  *   **If she approves:** She is running a **Factive Knowledge Norm**. She recognizes that the professor *knows* the fact (the warrant exists in her past research and reliable memory), even if she cannot currently access the justification. This aligns with her approval of the Historian (who knew from "other sources" despite uncertainty).
  *   **If she condemns (or demands qualification):** She is running an **Internalist Justification Norm** or a **Dialectical Norm**. For her, the inability to provide reasons *now* makes the assertion improper, regardless of the factive state. This would align with her condemnation of the Surgeon (who cannot defend the claim).

  **Why this works:**
  This case isolates the variable of *current access to reasons*. The Surgeon case confounds this with negligence (sleep deprivation). The Professor case removes the negligence (it is normal to forget sources) while retaining the lack of immediate defensibility. Her verdict here will tell you whether her commitment is to the *state of knowing* or the *practice of giving reasons*.
