  8.  **Final Polish:** Ensure the criteria for "convincing me I'm wrong" are concrete. (e.g., "If you can construct a cycle that violates the 2nd Law without erasure...")

      *(Self-Correction during drafting)*: I need to be careful not to dismiss Landauer's Principle entirely. It's widely accepted in engineering. The philosophical controversy is whether it's a *fundamental* law or a consequence of specific assumptions. The user wants to find the assumptions.

      *Plan:*
      1.  Rank: 1 > 3 > 2.
      2.  Merge 1 & 3 conceptually (Observer = Coarse Graining = Substrate Stability).
      3.  Isolate 2 as a generalization that doesn't solve the root conceptual tension.
