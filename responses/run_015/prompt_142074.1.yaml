answer: |-
  Here is a complete design for your 75-minute session. It is built to be run with zero upfront theory, maximum student engagement, and a debrief that lands the conceptual payload precisely.

  # Activity Title: The Wheel & The Rule

  ## 1. Materials & Setup
  **Room:** Tables arranged for 6 groups of 3 students.
  **Handouts (Print 1 set per group):**
  1.  **The Wheel:** A simple diagram showing the 5 symbols in a circle with a clockwise arrow.
      *   Order: **◆** (Diamond) $\to$ **▲** (Triangle) $\to$ **■** (Square) $\to$ **●** (Circle) $\to$ **★** (Star) $\to$ **◆**...
      *   Caption: *"Movement follows the arrow. There is no start or end."*
  2.  **Warm-Up Packet (Color-Coded):** You need 3 versions (A, B, C). Assign two groups to each version.
      *   *See Problem Sets below.*
  3.  **Target Sheet (Identical for all):** Contains 3 problems.
  4.  **Prediction Sheet:** For the betting phase.
  5.  **Sticky Notes:** 3 colors (e.g., Yellow, Pink, Blue), one pad per group.
  6.  **Board Space:** To tally answers.

  **The Payoff (No Money):**
  *   **Coherence Points:** Awarded if your group's answers are consistent with your own Warm-Up logic.
  *   **Oracle Points:** Awarded if your group correctly predicts what a *different* Warm-Up group will answer.
  *   **Prize:** Bragging rights / "Master Analogists" title / First choice of topic for next week.

  ---

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Instructions |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Hand out **Wheel** and **Warm-Up Packets**. Assign groups A, B, or C (2 groups each). **Rule:** "No talking between groups. Silence within groups until instructed." |
  | **05–15** | **Priming** | Groups solve their 5 Warm-Up problems. These are designed to feel easy and establish a "rhythm." Collect packets when done. |
  | **15–30** | **Targets** | Hand out **Target Sheet** (same for everyone). Groups solve 3 problems. They must write their final answer on a **Sticky Note** (large, clear). |
  | **30–40** | **The Bet** | Hand out **Prediction Sheet**. Groups must guess what the *other* types of groups answered for Target 1 & 2. (e.g., Group A guesses what Group C wrote). |
  | **40–50** | **The Reveal** | Stick notes on the board by Target Number. Do not sort them yet. Reveal the Warm-Up types (A, B, C). Sort the notes by group type. |
  | **50–65** | **Debrief** | Facilitated discussion (see script below). Map the disagreement to the Warm-Ups. Introduce terms ("slippage," "pressure"). |
  | **65–75** | **Limitations** | You speak (5 mins) on what the activity *couldn't* show (sub-symbolic processing). Q&A. |

  ---

  ## 3. Problem Sets

  ### The Wheel Key
  **◆** $\to$ **▲** $\to$ **■** $\to$ **●** $\to$ **★** $\to$ **◆**

  ### Warm-Up Packets (Distribute 2 groups per type)
  *Instruction: "If the left string changes to the right string, how does the new string change? Write the result."*

  **Packet A (The Right-Edge Movers)**
  *Focus: Change only the last symbol to its successor.*
  1.  `◆` $\to$ `▲`
  2.  `■` $\to$ `●`
  3.  `◆■` $\to$ `◆●`
  4.  `★▲` $\to$ `★★`
  5.  `■■` $\to$ `■●`

  **Packet B (The Left-Edge Movers)**
  *Focus: Change only the first symbol to its successor.*
  1.  `◆` $\to$ `▲`
  2.  `■` $\to$ `●`
  3.  `◆■` $\to$ `▲■`
  4.  `★▲` $\to$ `◆▲`
  5.  `■■` $\to$ `●■`

  **Packet C (The Growers)**
  *Focus: Duplicate the symbol (Run-Length increase).*
  1.  `◆` $\to$ `◆◆`
  2.  `▲` $\to$ `▲▲`
  3.  `■` $\to$ `■■■`
  4.  `◆▲` $\to$ `◆◆▲▲`
  5.  `★` $\to$ `★★★★`

  ### Target Problems (Identical for All Groups)
  *Instruction: "Apply the rule from the top line to the bottom line."*

  **Target 1 (The Single Symbol)**
  > `◆` $\to$ `▲`
  > Apply to: `■`
  > *   **Predicted A/B:** `●` (Successor)
  > *   **Predicted C:** `■■` (Growth)

  **Target 2 (The Pair)**
  > `◆` $\to$ `▲`
  > Apply to: `◆■`
  > *   **Predicted A:** `◆●` (Right moves)
  > *   **Predicted B:** `▲■` (Left moves)
  > *   **Predicted C:** `◆■■` (Growth on end) OR `▲■` (Forced shift)

  **Target 3 (The Count/Value Slip)**
  > `◆` $\to$ `◆◆`
  > Apply to: `▲`
  > *   **Predicted A/B:** `■` (Interpret "1 becomes 2" as "Value 1 becomes Value 2", so "Value 2 becomes Value 3")
  > *   **Predicted C:** `▲▲` (Direct Growth)

  ---

  ## 4. The Debrief Script (Mapping Activity to Theory)

  **Step 1: The Illusion of Objectivity (10 mins)**
  *   **Action:** Look at the board for Target 2 (`◆` $\to$ `▲` on `◆■`). You will see `◆●`, `▲■`, and maybe `◆■■`.
  *   **Ask:** "Look at Target 2. Did anyone find this problem difficult *while* you were doing it?" (Most will say no).
  *   **Ask:** "Then why are there three different 'obvious' answers on the board?"
  *   **Point:** The problem didn't change. Your *history* changed. The "obviousness" was not in the symbols; it was in the momentum you built during the Warm-Up.
  *   **Concept:** **Conceptual Momentum.** We don't approach problems fresh; we approach them with a running start.

  **Step 2: The Cost of Slippage (10 mins)**
  *   **Action:** Ask Group A (Right-Movers) to explain how Group C got `■■` for Target 1.
  *   **Ask:** "To see their answer, what did you have to do mentally?"
  *   **Likely Answer:** "I had to ignore the shape change," or "I had to stop looking at the wheel."
  *   **Point:** That mental effort is the **cost**. In cognitive science, we call the bending of categories **slippage**.
  *   **Concept:** **Slippage isn't free.**
      *   For Group C, `◆` $\to$ `■■` is zero cost (it's their rule).
      *   For Group A, `◆` $\to$ `■■` is high cost (it violates the "move on the wheel" rule).
      *   Analogy happens when the benefit of the new connection outweighs the cost of the slippage.

  **Step 3: Pressure & Context (5 mins)**
  *   **Action:** Reveal the Oracle Points (who predicted correctly).
  *   **Point:** The groups that won Oracle points didn't find the "right" answer; they modeled the *pressure* the other groups were under.
  *   **Concept:** **Context is Pressure.** The Warm-Up acted as a pressure system. It made some paths cheap (downhill) and others expensive (uphill). When the pressure is high enough, we don't even see the expensive paths.

  ---

  ## 5. Predictable Failure Modes & Fixes

  **1. The Relativist Collapse ("Everything is arbitrary")**
  *   **Risk:** Students conclude that because answers differ, there is no truth, and analogy is just nonsense.
  *   **Fix:** In the debrief, point to Target 3 (`◆` $\to$ `◆◆` on `▲`). Group C answered `▲▲` instantly. Groups A/B likely answered `■` or struggled.
  *   **Say:** "It's not arbitrary. Group C's answer is *cheaper* for them. Group A's answer is *expensive* for them. If I gave you 10 seconds, you'd all give your 'cheap' answer. Analogy is about **economy**, not truth."

  **2. The Steamroller (One loud student dominates)**
  *   **Risk:** One person dictates the group answer, masking the internal disagreement.
  *   **Fix:** The **Sticky Note Rule**. "Before you discuss the answer, everyone write their own answer on a sticky note. Put them in the center. Only then talk." This forces divergence to the surface before convergence.

  **3. The "Growth" Group Confusion on Target 3**
  *   **Risk:** Groups A/B might not see the "Count to Value" slip (`1->2` means `Value 1->Value 2`). They might just say "Impossible."
  *   **Fix:** This is actually a feature. If they say "Impossible," that *is* the data. It shows the cost of slippage was too high. In the debrief, highlight the groups that *did* make the slip vs. those that refused.

  ---

  ## 6. What You Must Say (The Limitations)
  *Save this for the final 5 minutes. The activity is discrete and symbolic; real cognition is not.*

  "Today, you processed these symbols one at a time, consciously. You chose a rule.
  But in your actual brain, analogy is not a choice. It is a **competition**.
  1.  **Parallel Processing:** You didn't just try one rule. Your brain likely activated 'Successor', 'Growth', and 'Swap' simultaneously in the first 200 milliseconds. The Warm-Up simply suppressed the losers.
  2.  **Sub-Symbolic:** You don't have a 'Successor Node' in your head. You have millions of neurons firing. The 'rule' is an emergent property, like a whirlpool in a river.
  3.  **Affect:** Real analogy is driven by importance and emotion. You didn't care if the answer was `▲` or `■`. In the real world, we bend concepts harder for things we care about.

  This activity showed you the **logic** of slippage. But remember: the slippage happens before you know you're slipping."

  ---

  ## 7. Instructor Cheat Sheet (Why this works)
  *   **Target 1** isolates **Type** (Move vs. Grow).
  *   **Target 2** isolates **Position** (Left vs. Right).
  *   **Target 3** isolates **Representation** (Symbol Identity vs. Symbol Count).
  *   **The Warm-Ups** act as **gradient descent**. They put the groups in different local minima. When they hit the Target, they assume they are at the global minimum. The disagreement proves they are not.
  *   **The Betting** forces them to model another mind's constraints, which is the definition of high-level analogy.
