      *   *Contemplation (*Theōria*):* The highest activity (NE Book X). Divine-like. Requires leisure.
      *   *Slavery:* Aristotle thinks some people are natural slaves (controversial, but textually present). They need a master to direct them. In a post-work world, who is the master? The AI? Or do humans become "slaves to pleasure"?
      *   *Distribution of Leisure:* In Aristotle's ideal city, only citizens get leisure. Others (farmers, artisans) support them. In the AI scenario, *everyone* has material support. Does everyone have the *capacity* for leisure?

  3.  **Drafting - Section by Section:**

