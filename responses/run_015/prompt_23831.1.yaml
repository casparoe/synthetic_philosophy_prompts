      *Selection & Ordering:* I need to order by *damage*.
      1.  The Measurement/Circularity problem (Statisticians). If you can't measure it without frequencies, it's just frequencies in disguise.
      2.  The Inverse Probability/Bayes problem (The specific fear). This is technically damning for using propensities in inference.
