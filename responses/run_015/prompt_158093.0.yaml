t with her five earlier verdicts but diverge on this case. For each rule, state exactly what it predicts here. Then give your best-guess verdict with explicit reasoning for preferring one rule over the other, and finally specify one further hypothetical case in a different institutional domain that would sharply distinguish these two rules and reveal which one she is actually running.
