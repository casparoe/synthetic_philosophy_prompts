answer: |-
  Here is the machinery of the problem, built around a single concrete scenario, designed to help you untangle the knot for your editor and readers.

  ### The Worked Example: The Irrigation Warden

  Imagine a high-altitude valley system. There is an **Upper Valley** (established, wealthy) and a **Lower Valley** (new, arid, dependent on runoff). Separating them is a dam managed by a single **Warden**.

  The dam has a main sluice gate. When open, water flows to the Lower Valley, keeping their crops alive. When closed, the water stays in the Upper reservoir, and the Lower Valley crops wither.

  There is also a **Manual Override Lever** on the catwalk. If pulled, it mechanically jams the gate open for 24 hours. Anyone can pull it, but it requires significant physical effort to hold down for ten seconds to engage the jam.

  **The Crisis:** A drought hits. The Warden must decide how to manage the water.

  **Scenario A (The Active Closure):** The gate is currently open. The Lower Valley is receiving water. The Warden walks to the control wheel and actively cranks it shut. The water stops. The Lower Valley crops die.
  *Intuition:* This feels like **killing** (or harming).

  **Scenario B (The Passive Refusal):** The gate is currently closed. The Lower Valley is dry. The Warden stands next to the control wheel. He *could* crank it open, but he chooses not to. The water stays off. The Lower Valley crops die.
  *Intuition:* This feels like **letting die** (or failing to help).

  Physically, the outcome is identical: the Lower Valley ends up dry because of the Warden's choice. But our moral intuition screams that Scenario A is worse. Here is where the definitions break down, and where your two specific sticking points come in.

  ---

  ### 1. The Failure of Causal and Baseline Accounts

  You noted that "movement vs. stillness" doesn't work. In Scenario A, the Warden moves his muscles to close the gate. In Scenario B, he moves his muscles to *resist* opening it (tensing his arms against the wheel). Physiologically, both involve muscle contraction and energy expenditure. If "doing" is just physics, both are doings.

  So, philosophers try **Counterfactual Dependence**: *Did the victim die because of what I did, or would they have died anyway?*
  *   In Scenario A: If the Warden hadn't acted, the water would have flowed. His act caused the death.
  *   In Scenario B: If the Warden hadn't acted (stood still), the water would have stayed off. His inaction allowed the death.

  This seems robust until you introduce the **Baseline Problem**.

  Imagine a legal treaty changes overnight.
  *   **Baseline 1:** The treaty says the Lower Valley has a *right* to water. The default setting of the dam is **Open**. Now, Scenario B (leaving it closed) is a violation of the treaty. It feels much more like "killing" because he is withholding what is owed.
  *   **Baseline 2:** The treaty says the Lower Valley has *no right*. The default setting is **Closed**. Now, Scenario A (opening it then closing it) feels like a cruel tease, but Scenario B is just business as usual.

  The physics of the Warden's body haven't changed. The counterfactuals (water flows vs. doesn't flow) are identical. The only thing that shifted is the **normative baseline**—what we expect to happen in the normal course of events.

  **The Takeaway:** The doing/allowing distinction does not track *causation*; it tracks *deviation from expectation*. "Doing harm" is pushing the world away from its expected trajectory. "Allowing harm" is letting the world follow a bad trajectory that was already underway. But since "expected trajectory" is a social agreement, not a law of physics, the distinction is inherently unstable.

  ---

  ### 2. Third-Party Sensitivity: The Volunteer on the Catwalk

  This is where the distinction really threatens to dissolve. Let's modify the example to include a **Third Party**.

  **Scenario C:** The gate is closed. The Lower Valley is dying. A **Volunteer** from the Upper Valley is standing at the Manual Override Lever, poised to pull it. The Warden sees this.
  *   **Variation 1:** The Warden shouts, "Stop! Don't pull that!" The Volunteer freezes. The gate stays closed. The crops die.
  *   **Variation 2:** The Warden says nothing. He just stares at the Volunteer. The Volunteer hesitates, feels the social pressure, and decides not to pull the lever. The gate stays closed. The crops die.

  In both variations, the Warden's physical behavior is roughly the same (standing there, outcome secured). In Variation 1, we intuitively feel the Warden has *killed* the crops. He actively intercepted a rescue. In Variation 2, it feels more like he *allowed* the crops to die. He merely failed to encourage the rescue.

  **Why this breaks the definition:**
  If the distinction were about the Warden's agency, Variation 1 and 2 should be morally identical. The Warden is the one with the authority in both cases. But the moral classification of the Warden's act flips based entirely on the **Volunteer's mental state**.

  If the Volunteer was *determined* to pull the lever, and the Warden stopped him, it's a "doing." If the Volunteer was *unsure*, and the Warden's silence tipped the scale, it's an "allowing."

  This proves the distinction isn't located in the agent (the Warden). It is located in the **network of relationships**. It tracks whether the Warden disrupted an existing causal chain (the Volunteer's rescue attempt) or merely failed to start a new one. But since "existing causal chains" are often matters of probability and intention (was the Volunteer *really* going to do it?), the line remains murky.

  **The Non-Causal Account:**
  So, if it's not causation, what is it? A robust non-causal account views the distinction as **Normative Disruption**.
  *   **Doing:** You intervene in a system that was functioning (or expected to function) to produce a worse outcome. You take ownership of the bad result.
  *   **Allowing:** You decline to intervene in a system that is already failing. You decline ownership of the bad result.

  The "slipperiness" comes from the fact that we can never agree on what the "system" is. Is the system "The Dam" (which is closed)? Or is the system "Humanitarian Aid" (which implies water should flow)? The doing/allowing distinction is a fight over how to describe the status quo.

  ---

  ### 3. Verdict on Your Friend's Debunking Theory

  Your friend argues that the distinction is merely an **evidential and coordination device**.
  *   **Her Claim:** Actions are salient, datable, and easy to prove in court. Omissions are infinite (I didn't feed a starving child in Somalia today) and impossible to track. Therefore, we treat "acts" as worse to make social coordination manageable. The moral intuition is just a byproduct of this bookkeeping.

  **Where she is right:**
  She is correct that the distinction serves a vital administrative function. If we treated all omissions as equivalent to actions, every person would be morally responsible for every preventable death on earth. Moral agency would dissolve into noise. We need a "salience filter" to know which causal levers to monitor. In policy, this is why we regulate *emissions* (doing) more strictly than we mandate *carbon capture* (allowing/remediation), even if the atmospheric impact is identical.

  **Where she is wrong:**
  She assumes the bookkeeping is arbitrary. It isn't. The reason we mark "acts" as salient isn't just because they are visible; it's because they **violate a specific type of trust**.

  When the Warden cranks the gate shut (Scenario A), he violates the **security of reliance**. The Lower Valley farmers can plan their lives assuming the Warden won't actively attack them. When he merely refuses to open it (Scenario B), he violates the **hope for assistance**, which is a weaker moral claim.

  Your friend's theory fails because it cannot explain why we feel a *residual* moral difference even when the bookkeeping is easy.
  *   *Test:* Imagine a world with perfect surveillance cameras. Every omission is recorded and datable. The "evidential" problem is solved. Would we still feel that injecting a poison is worse than withholding the antidote?
  *   *Result:* Yes. Most people still feel the injection is worse.

  Why? Because the distinction tracks **entitlements**, not just evidence.
  *   **Negative Right:** I am entitled to you not touching me (Do not kill).
  *   **Positive Right:** I am entitled to you helping me only if you have a specific role (Do not let die).

  Your friend's debunking story explains why we *enforce* the distinction, but it doesn't explain why we *feel* it. The feeling comes from the deep-seated human intuition that violating a boundary (intruding on someone's life) is a greater aggression than failing to bridge a gap (extending a hand).

  ### Summary for Your Piece

  1.  **The Trap:** We try to define "doing vs. allowing" using physics (movement) or logic (counterfactuals). Both fail because the physical reality is often identical.
  2.  **The Reality:** The distinction is **baseline-dependent**. It measures deviation from a "normal course of events," but that "normal" is a social negotiation, not a fact of nature.
  3.  **The Third-Party Problem:** The moral status of my act can change based on what *you* were planning to do. This proves the distinction lives in the *relationship*, not the *agent*.
  4.  **The Friend's Theory:** She correctly identifies that the distinction is a tool for social coordination (we can't police every omission). But she is wrong to call it *merely* convenient. It tracks real moral differences regarding **rights of non-interference** vs. **claims to assistance**.

  **The Punchline:** The doing/allowing distinction isn't a bug in our moral software. It's the interface we use to negotiate where my responsibility ends and yours begins. It's slippery because that boundary is always being redrawn.
