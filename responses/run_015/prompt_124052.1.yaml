answer: |-
  Good evening. For those who do not know me, I am the brother of the bride, and I have the privilege of standing here to say a few words about what is happening today. Looking around this room, I see a gathering that is rare in its composition. On one side, there are those who understand this moment as a sacrament, a visible sign of invisible grace that binds not just two people but a community to God. On the other, there are those who spend their lives studying how people make choices over time, how we weigh the present against the future, and how we navigate the person we are now against the person we will become. It is a challenging thing to speak to both groups at once, because one side knows that love is a gift received, and the other knows that commitment is a structure built. But I believe that what we are witnessing today satisfies the deepest requirements of both.

  We all understand that time changes us. The people standing at the altar today are not the same people who will wake up ten years from now. Feelings shift, circumstances change, and the priorities that seem absolute in this moment will be tested by the quiet erosion of ordinary days. There are two ways that promises usually fail under this pressure. The first is when people follow only what feels best in the moment, chasing a sequence of small preferences that eventually lead them back to where they started, only poorer and more confused. The second is when people stay simply because leaving is too hard, where the cost of exit is so high and so immediate that they remain in a place they would have refused if they had seen the whole picture at the start. The first failure is a loss of direction; the second is a loss of freedom. A marriage must survive both. It cannot rely on the stability of feeling, because feelings are not reliable anchors. But it cannot rely on the difficulty of leaving, because that is not fidelity, that is merely being trapped.

  This brings us to the strange logic of the vow. When you make a promise today, you are signing a contract that a future version of yourself must keep. But that future person did not agree to this. They were not consulted. They will wake up on a Tuesday morning years from now and find themselves bound by a decision made in a moment of joy they can barely remember. The question is how to bind that future person without treating them like a prisoner. You cannot remove their option to leave. There are no chains available here, and there should be no walls built to keep someone in against their will. If you tie someone to the mast, you are admitting that the ship is dangerous and the sailor is untrustworthy, and that is no way to begin a life together.

  So there is only one other way to bind a future self, and that is what we are doing here. You leave the option to leave entirely intact, but you arrange the world so that choosing it is visible. You surround the promise with witnesses. You make the cost of breaking the vow not a matter of internal calculation, but a matter of public rupture. Some might ask if this is unfair to that future self who never consented. They might call it a manipulation of their situation, rigging the incentives so they cannot deliberate freely. I am here to say that this is not manipulation. It is the only form a promise can take that allows them to actually keep it. If there were no witnesses, if there were no social weight, if there were no community here to hold the memory of this day, then keeping the vow would be a private whim. It would be easy to break, and therefore easy to keep, which means it would be worthless.

  By standing here, you are not removing the freedom of your future selves. You are giving them the only thing that makes freedom meaningful, which is a context where their choices matter. You are telling them that staying is not just about what you feel, but about who you are in relation to everyone in this room. You are telling them that breaking this promise would not just be a change of mind, it would be a break with the community that witnessed it. This is not a trap. It is the architecture of fidelity. It allows the future person to choose the vow again, not because they are forced to, but because the cost of abandoning it is high enough to make the choice real. This honors the sacrament, because it acknowledges that this covenant is larger than the two of you. And it honors the logic of commitment, because it acknowledges that a choice without consequence is not a choice at all.

  So let us raise a glass. To the bride and groom. May you never feel trapped by the promises you make today, because may you always find that the weight of them is exactly what makes them worth keeping. May you always have the freedom to leave, and may you never want to use it. And may you always look around you and see the faces of those who are here to remind you that you are not alone in keeping what you have started. To the couple.

  The strongest argument against this position is that relying on social visibility and the cost of public rupture to sustain a marriage ultimately privileges stability over truth. If the weight of witnesses makes breaking a vow socially catastrophic, it may coerce individuals into maintaining a union that has become spiritually dead or even harmful, simply to avoid the shame of public failure. This turns the community from a support system into a panopticon, where the fear of judgment replaces the virtue of fidelity, and the future self is not empowered to choose but rather bullied into compliance by the accumulated expectations of the past.
