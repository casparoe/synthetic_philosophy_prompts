      *   *Mechanism:* "Radii" (rays/beams). Not just light, but geometric configurations (aspects). This is a shift from "occult qualities" to something akin to optics/acoustics (harmony).
      *   *Vis Formatrix:* The formative power in the Earth/Sublunary realm. This is Aristotelian/Neoplatonic. It's the capacity of matter to take form.
      *   *Determinism:* Kepler wants to save astrology from skepticism (Tycho Brahe was skeptical) by making it "scientific" (physical) but also save free will/Christian theology from determinism.
      *   *The Tension:* If $A$ physically causes $B$, why isn't $B$ guaranteed? Kepler's answer: The Earth's matter is variable/resistant.

  3.  **Evaluate the Professor's Analogy (Climate Models):**
