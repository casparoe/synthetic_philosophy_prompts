answer: |-
  Good afternoon. It's cold enough to feel the granite through the coat. That's appropriate. We are here for stone, and for what stone remembers.

  You know the first tablet. It has stood there since 1931. Paid for by the mill hands, by the families who worked the floor and heated the irons. It tells the story we were raised on. The Ice Flood. The hall opening. The last line: AND ON THE NIGHT OF THE ICE FLOOD NOBODY WAS TURNED AWAY.

  My grandmother told me that story every year. She did not tell it as folklore. She told it as instruction. She meant it to tell me what kind of place this was, and consequently, what kind of man I was to be. I am the Chairman of the Relief Association now. In December, we vote on who gets help for the doctor, who gets help for the burying. We do not ask questions. We pay. We have done this for ninety years on the authority of that sentence.

  Two years ago, the state digitized the records. The lodge minute book, the mill tickets, the ferry log. I was the volunteer who read them. On March 14, 1907, the hall committee voted to open the doors. But the mill agent, who owned the ferry and held the treasury, stopped the ferry at nine. He required a mill ticket for entry. Forty-one people from the Flats—seasonal hands, quarry families, recent arrivals—were kept across the river. Within a fortnight, the township paid to move them out. They were not taken in. They were turned away.

  The archivist has asked me to stand here and say the first tablet is false. I cannot say that word. Not because I fear the stone, but because that word belongs to the ledger, and we are standing in a park. The ledger says the event did not happen as described. The stone says something else.

  If I say the stone is a lie, I tell my grandmother she was a liar. She was not. She taught me a debt, not a date. But if I say the stone is true, I tell the forty-one families that their exclusion is a matter of debate. It is not. They were excluded. The record holds.

  So we have two tablets now. The first stands. The second stands beside it. They do not say the same thing. They cannot. To smooth them over would be to insult both the dead who suffered and the dead who tried to help. The first tablet is not a report of what was done. It is a record of what was owed.

  A community is not only what it has done. It is also what it has undertaken to owe. When the committee voted in 1907 to open the hall, they incurred a debt to every soul in the township. When the agent closed the ferry, he defaulted on that debt. The 1931 tablet was not a receipt for a job finished. It was a promissory note that remains outstanding.

  My grandmother did not lie to me. She handed me the note. She told me that in this town, nobody is turned away. She was not describing the night of the flood. She was describing the obligation that night created. The record shows we failed the test. The stone shows we accepted the grade.

  There are descendants of the Flats families here today. They did not come for our apology. Apologies are for the living. They came because the story traveled, and because the record was found. They are here to witness that the town knows what happened. We do not need to gesture to them to prove our virtue. Their presence is the proof of the record, just as our presence is the proof of the obligation. We are both here because the night is not over.

  Some will say that ninety years of payouts redeems the night. It does not. Charity given today does not erase exclusion practiced yesterday. If we treat the Relief Association as a reward for our ancestors' goodness, we misunderstand it. The Association exists because our ancestors were not good enough. We pay out in December not because we are virtuous, but because the debt is still due. The authority to pay comes from the failure, not the success.

  The selectboard wants a line about reckoning. Here it is: We cannot fix 1907. We can only stop pretending it is finished. The second tablet lists the names of the forty-one families removed. It does not say "Welcome." It says "Removed." It stands next to the promise that was broken.

  So what do we do with the Association? What do we do with the lamps in the Odd Fellows' hall, which we light every year for the supper? The archivist wants the truth. The members want a charter. The truth is that the charter was based on a hope that was betrayed. But a hope betrayed can still bind us, if we acknowledge the betrayal.

  Here is the instruction. Three weeks from now, at the supper, the lamps will be lit. They will be left burning, as always. But before the light is struck, the clerk will read the margin note from the 1907 minute book. The note written by the janitor who was overruled. My great-grandfather. He wrote the motion that was passed, and he wrote the refusal that was enacted.

  We will read both. We will light the lamps in the presence of the refusal. That is the only way the light is honest.

  The first tablet says nobody was turned away. The second tablet says forty-one were. We keep the first tablet not as history, but as a command. It tells us what we must do now, because we did not do it then. It is not a description of our character. It is a prescription for our conduct.

  If we treat the stone as a history, it is wrong. If we treat it as a vow, it is binding. We are here to renew the vow, with eyes open to the history. The ice flood is over. The debt is not.

  Thank you.
