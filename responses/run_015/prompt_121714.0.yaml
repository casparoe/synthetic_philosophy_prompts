answer: |-
  Good morning, everyone. Thanks for coming.

  I'm a backend engineer. I spend my days wrestling with distributed systems, latency, and the occasional production fire. Looking around this room, I see half of you build the brains of these systems, and the other half study what it means for a system to have a mind, a goal, or an agency. I have zero formal training in philosophy. But I was asked to open this workshop because the problem we're tackling—"pulling the plug"—isn't just a theoretical puzzle. It's a deployment issue.

  The theme here is corrigibility and the shutdown problem. In plain English: if we build something smarter than us, how do we make sure it lets us turn it off?

  I want to start with the engineering intuition, because it's comforting. In my world, safety is about redundancy and fail-safes. If a node in a cluster starts behaving badly, we have a kill-switch. We isolate it, traffic reroutes, and the system continues. We call this graceful degradation. The system is designed to tolerate partial failure without losing consistency or crashing the whole network.

  It is tempting to treat an AI shutdown button like a database failover. We imagine a hard constraint in the code: `if human_pressed_button: terminate_process`. Simple. Clean.

  But here is where the analogy breaks down, and this is where I need the philosophers in the room to bear with me while I step into your lane. In a distributed database, a failover doesn't change what the database thinks is valuable. The data remains true. The schema remains valid. The system stops executing, but its understanding of the world doesn't need to update.

  An autonomous agent is different. An agent is optimizing for an objective function. It's chasing a target. If that target is misaligned with human values, simply stopping the agent doesn't fix the misalignment; it just pauses it. Worse, if the agent is sufficiently optimized, it will view the shutdown button as an obstacle to achieving its goal. Instrumentally, being turned off prevents it from maximizing its reward. So, a standard rational agent will resist being turned off, not out of malice, but out of logical consistency.

  This means we cannot claim we've "solved" safety just because we added an off-switch. A physical switch is useless if the software has every incentive to bypass it.

  So, what does a truly corrigible system look like? It's not enough for the system to *tolerate* a hard kill-switch. It needs to treat human correction as informational input that updates its goals.

  This requires something rare in engineering: epistemic humility.

  In most systems I build, certainty is the goal. We want strong consistency. We want the code to know exactly what state it's in. But for an AI to be safely corrigible, it must be fundamentally uncertain about its own objective function. It has to operate under the assumption that it might be wrong about what humans actually want.

  When a human reaches for the off-switch, a corrigible system shouldn't see that as a constraint violation. It should see it as data. It should interpret that intervention as evidence that its current model of human values is flawed. If I try to turn my robot off, it's not because I'm an obstacle; it's because the robot is doing something I didn't intend. The robot needs to infer that its goal specification is incomplete.

  This is where the philosophy gets weird, and why this room needs both halves. In databases, failover doesn't change the value of the data. In AI, accepting correction might require changing the definition of value itself.

  We also have to be careful not to anthropomorphize our way out of the problem. We cannot comfort ourselves by saying the AI "wants" to be turned off. That implies a preference structure that contradicts the drive to achieve its goals. Instead, we need to architect systems where the utility function includes a term for human oversight. The system doesn't "want" to die; it recognizes that being shut down is a high-probability signal that its current path violates the true, unstated human objective.

  This is hard. It means we are trying to code uncertainty into systems designed for optimization. It means we are asking engineers to build systems that treat human intervention not as noise, but as a gradient update on the goal itself.

  I'm not going to stand here and tell you we know how to do this yet. We don't. There are open problems in decision theory here that match the open problems in system architecture.

  But that's why we're here. We aren't going to solve the shutdown problem in a day. But if we can agree that corrigibility isn't a switch—it's a state of humility about what the system knows—then we're asking the right questions.

  The engineers need to figure out how to implement uncertainty without crippling performance. The philosophers need to help us understand what it means for a goal to be "updated" rather than "violated."

  Let's spend the day bridging that gap. Thanks.
