answer: |-
  This is a profound design problem. You are discovering that "griefing" and "harm" in a persistent virtual world are not actually about property or economics, but about **ontology** (what exists) and **agency** (who gets to act).

  Your current intuition is struggling because you are trying to use a single metric for two different categories of harm.
  *   **Cases 1, 5, 7, 8, 9** involve **Moral Wrong** (Agent A violates Agent B).
  *   **Cases 2, 3, 4, 6** involve **Ontological Status** (What counts as real/persistent in the Shared World).

  Case 2 is the key. You restore the plugin-wiped cathedral not because a rule was broken (no one broke it), but because the *Server* made a promise of continuity that was accidentally violated. The "badness" is the break in continuity. The "wrongness" is the intent.

  Here is a principle that unifies your verdicts, distinguishes between punishment and restoration, and handles your edge cases.

  ### The Principle: Invested Continuity

  > **"A virtual act is harmful if it non-consensually severs the link between a human's investment of self (labor, time, presence, or trust) and the persistent world, OR if it degrades the reliability of the world as a vessel for such investment."**

  This principle has two pillars:
  1.  **Invested Self:** Players put pieces of their real lives (time, emotion, agency) into the game. That investment becomes "real" when it is anchored in the shared world.
  2.  **Shared Reliability:** The world itself must remain a trustworthy container for those investments. If the world becomes volatile, the investment loses value for *everyone*, even if no specific individual is targeted.

  ---

  ### How this resolves your 9 Cases

  **1. Cathedral Burned (Player)**
  *   **Verdict:** Harmful.
  *   **Why:** Severs the link between the builder's *labor* and the *world*. It is a non-consensual negation of invested self.
  *   **Action:** Rollback (restore continuity) + Ban (punish moral wrong).

  **2. Cathedral Wiped (Plugin)**
  *   **Verdict:** Harmful (ontologically), but no Moral Wrong.
  *   **Why:** The link between labor and world is still severed (the "badness" remains), but no agent violated trust (the "wrongness" is absent).
  *   **Action:** Rollback (restore continuity) + No Ban (no moral agent to punish). *This explains why you spend the effort to fix it despite "nobody harmed anyone."*

  **3. Abandoned Castle (2014)**
  *   **Verdict:** Harmful.
  *   **Why:** This is the **Shared Reliability** pillar. Even if the owner is gone, the castle is now part of the server's *history*. Allowing it to be destroyed degrades the reliability of the world for *current* players. It signals: "History is disposable." If history is disposable, my current build is also disposable.
  *   **Policy Note:** This suggests your House Rule ("active group") needs a **Heritage Clause**. After X years, a structure transitions from "Private Property" to "Public Heritage." It is protected not for the owner, but for the community.

  **4. Client-side Defacement**
  *   **Verdict:** Not Harmful.
  *   **Why:** The link between the builder's labor and the *Shared World* is untouched. The "Invested Self" remains anchored in reality; only one person's perception is altered.

  **5. Duping**
  *   **Verdict:** Harmful.
  *   **Why:** Degrades **Shared Reliability**. It inflates the economy, which devalues the *labor investment* of everyone else who earned items legitimately. It harms the *system* that gives value to individual effort.

  **6. Bot Griefing**
  *   **Verdict:** Not Harmful.
  *   **Why:** No human "Invested Self" exists behind the bot. There is no link to sever.

  **7. Spawn Camping**
  *   **Verdict:** Harmful (Worse than #1).
  *   **Why:** This attacks **Presence** rather than Property. It severs the link between the player's *agency* and the *world*. In #1, they lost a past investment. In #7, they are denied the ability to make *any* investment. It is a total nullification of participation.

  **8. VR Standing**
  *   **Verdict:** Harmful.
  *   **Why:** This attacks **Embodied Presence**. The "Investment of Self" is higher in VR (psychological proximity). The shared reliability of "personal space" is violated. It's not about blocks; it's about the safety of the *avatar as self*.

  **9. Scamming (RMT vs. In-game)**
  *   **Verdict:** Same Harm.
  *   **Why:** The harm is to the **Trust Investment**, not the currency. The victim invested trust and effort; that link was severed by deception. The medium of exchange is irrelevant.

  ---

  ### Adjudicating Your New Cases

  **Case A: The Claimed Cave**
  *   *Scenario:* A player "claims" a natural cave (no building), another destroys it.
  *   *Verdict:* **Low/No Harm.**
  *   *Reasoning:* Under *Invested Continuity*, protection scales with **Investment**. A cathedral represents 300 hours of labor (high investment). A natural cave represents zero labor. A "claim" (e.g., a sign) is a speech act, not a material investment.
  *   *Nuance:* If the cave was a known landmark where players *gathered* (social investment), destroying it harms the community's Shared Reliability. If it was just a private stash spot with no social footprint, destroying it is negligible.
  *   *Policy:* "Natural formations are public domain. Claims require material modification (building/fencing) to establish Invested Continuity."

  **Case B: The Beloved AI**
  *   *Scenario:* Deleting an AI character players care about.
  *   *Verdict:* **Harmful.**
  *   *Reasoning:* The AI has no "Self," so Case 6 suggests it's fine. *However*, the **Players** have invested emotion, time, and narrative expectation into that AI. The AI is a vessel for *human* investment. Deleting it severs the link between the players' emotional investment and the world.
  *   *Policy:* "NPCs/Entities that have become central to community narrative or interaction acquire protected status based on player attachment, not just code."

  ---

  ### Drafting the Policy Document

  When you write this, you need to separate **Restoration** (fixing the world) from **Discipline** (punishing the player). Your intuition in Case 2 proves these are different processes.

  **Suggested Policy Framework:**

  **1. The Integrity of Investment**
  > "The server recognizes player time, labor, and social presence as real investments. Actions that non-consensually nullify these investments are prohibited."

  **2. The Continuity of the World**
  > "The server is a historical record. Staff will prioritize the restoration of significant structures lost to bugs or accidents, regardless of fault, to maintain the reliability of the world."

  **3. The Heritage Clause (Fixing Case 3)**
  > "Structures older than [X] years are considered Community Heritage. They remain protected even if the original builders are inactive, as they form part of the shared environment current players rely upon."

  **4. Embodied Safety (Fixing Case 7 & 8)**
  > "Harassment includes actions that deny a player's ability to participate (spawn camping) or violate reasonable expectations of personal space (VR proximity), even if no in-game blocks are damaged."

  ### Why this works for you
  It validates your feeling in Case 2 that "the badness doesn't disappear." The badness is the break in continuity. The wrongness is the intent. You can fix the badness (rollback) without punishing a wrong (ban).

  It validates your feeling in Case 3 that the castle matters even if the owner is gone. It matters because *you* and *the current players* need to live in a world where history isn't erased.

  It validates Case 7 & 8 by shifting the focus from "Property Damage" to "Agency Denial."

  You aren't moderating a game; you are curating a **persistent society**. The principle is **Stewardship of Human Investment.**
