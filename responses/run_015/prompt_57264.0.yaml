answer: |-
  ### Candidate Arcs

  1.  **Empirical-First:** Play the centipede live with sweets immediately. Observe cooperation. Then derive the equilibrium to show they "failed."
      *   *Risk:* Anchors the session in "people are nice/irrational" before the logic is established. Hard to pivot to belief revision because students view the deviation as moral, not epistemic.
  2.  **Formal-First:** Define subgame perfection, draw the 100-node tree, solve mathematically, then mention lab results.
      *   *Risk:* 9am fatigue kills the recursion tracking. The 100-node tree obscures the specific node where belief revision matters.
  3.  **Logical-Paradox Hybrid (Selected):** Define BI on a trivial 2-node game. Apply to a 6-node Centipede on the board. Immediately interrogate the off-path beliefs required to sustain the solution.
      *   *Why:* Isolates the logic from social preferences (no live play), keeps the tree tractable (6 nodes), and places the philosophical weight (belief revision) at the center rather than the end.

  ---

  ### The Session Plan: Dependency Sequence

  1.  **Distinguish Perfect from Imperfect Information.** Draw a simple 2-node game (Ultimatum-style) and contrast it with Prisoner's Dilemma.
      *   *Why here:* Students cannot apply Backward Induction (BI) until they understand that later movers *observe* earlier moves; this distinction is the prerequisite for sequential reasoning.
  2.  **Define Backward Induction as an Algorithm.** Solve the 2-node game by starting at the last mover's decision and working back.
      *   *Why here:* You must establish the mechanical procedure on a trivial case before adding the complexity of the Centipede's multiple nodes.
  3.  **Introduce the 6-Node Centipede (Static).** Draw the tree on the whiteboard with clear payoffs (e.g., 1,1 -> 0,3 -> 2,2 -> 1,4... ending in Take).
      *   *Why here:* A 6-node tree is long enough to make "Take Immediately" counterintuitive but short enough to solve without losing the class in arithmetic.
  4.  **Execute Backward Induction on the Centipede.** Solve from node 6 back to node 1, deriving "Take at Node 1."
      *   *Why here:* You cannot critique the equilibrium until the equilibrium is formally established on the board.
  5.  **Interrogate the Off-Path Belief (The Pivot).** Ask: "If Player 1 Passes at Node 1, what must Player 2 believe about Player 1's rationality to justify Passing at Node 2?"
      *   *Why here:* This exposes the dependency of the current move on conjectures about future play, directly addressing your hypothesis that taking is not locally dominant.
  6.  **Discuss Common Knowledge of Rationality (CKR).** Explain that BI holds only if players believe opponents are rational even after observing moves that imply irrationality.
      *   *Why here:* This concept is required to explain *why* the induction holds theoretically, even if it fails empirically.
  7.  **Briefly Note Empirical Deviations.** Mention that labs show cooperation, but frame it as a failure of the CKR assumption, not necessarily utility maximization.
      *   *Why here:* Acknowledging reality prevents dismissal of the theory, but placing it last ensures the logic isn't contaminated by "people are nice" arguments during the derivation.

  ---

  ### Misconception Map

  | What a student will actually say | Roughly where it surfaces | The specific move that heads it off |
  | :--- | :--- | :--- |
  | "Isn't this just a longer Prisoner's Dilemma?" | Step 1 (Definitions) | Explicitly contrast payoff structures: in PD, defection dominates regardless of the other; here, Taking is only optimal *if* the other Takes later. |
  | "Passing is dominated, so passing is just an error." | Step 4 (BI Execution) | Stop the derivation at Node 2. Ask: "Is Take strictly better than Pass *if* Player 1 passes at Node 3?" Show it depends on the conjecture. |
  | "You're telling us how we *should* play, not what happens." | Step 5 (Off-Path) | Clarify: "BI predicts what happens *if* rationality is common knowledge. It is a conditional prediction, not a moral instruction." |
  | "Common Knowledge just means everyone is smart." | Step 6 (CKR) | Define it recursively: "I know you're rational, I know you know I'm rational, I know you know I know..." Emphasize the infinite regress. |
  | "This is the Surprise Exam paradox; the logic is flawed." | Step 6 (CKR) | Acknowledge the structural similarity but distinguish: "Here the logic is valid within the axioms; the axioms (CKR) are what fail in practice." |
  | "Lab results prove people are irrational." | Step 7 (Empirical) | Reframe: "Lab results prove CKR is false. Players might be rational but believe *others* are not, which is itself a rational belief." |

  ---

  ### Topics to Explicitly Avoid

  1.  **Trembling Hand Perfection:** "We are assuming moves are intentional today; introducing accidental slips complicates the belief update logic we are trying to isolate."
  2.  **Incomplete Information / Reputation:** "We are assuming everyone knows everyone's payoffs; adding hidden 'types' changes the game entirely and requires Bayesian updating we don't have time for."
  3.  **Forward Induction:** "We are solving from the end back; arguing from the start forward about signals is a different solution concept we will not mix in today."
  4.  **Surprise Exam Literature:** "The epistemic logic is similar, but we are sticking to game-theoretic payoffs, not philosophical puzzles about knowledge definitions."

  ---

  ### The Chess Student Intervention

  **When:** Step 2 (Define Backward Induction).
  **What to say:** "You might think this is just like calculating mate in chess. In chess, you don't take a move because you know your opponent *cannot* see the counter; here, we assume the opponent *does* see it and is *choosing* not to take it. The recursion isn't about calculation limits; it's about common knowledge of rationality. If you treat this like chess calculation, you will miss the belief paradox."

  ---

  ### Closing Question

  "If you are Player 2, and Player 1 has just Passed at Node 1, does Backward Induction tell you to Take or Pass at Node 2? Explain why the standard solution concept struggles to give you a clear answer once Node 1 is reached."

  *(Correct answer indicates understanding that BI relies on CKR, which is contradicted by the move at Node 1, leaving Player 2 without a stable conjecture.)*

  Verdict: The misconception that "Taking is locally dominant independent of beliefs about future play" does the most damage if it's still standing when they leave.
