      *   **Core Metaphor:** A center of gravity is a useful abstract point for calculating physical interactions, but it's not a physical *thing* you can touch. Similarly, the self is a useful abstract point for organizing behavior and memory, but not a homunculus inside the head.
      *   **Key Tension:** Is it *eliminativist* (there is no self) or *reductionist/functionalist* (the self is real but constituted by narrative)?

  3.  **Drafting the Menu of Theses:**
