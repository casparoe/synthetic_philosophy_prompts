answer: |-
  ### 1. The Case Pair

  **Hold**
  You are a security guard assigned to monitor the flood barrier in the basement. The protocol is simply to stand by the heavy steel door for ten minutes while the pumps cycle. The door's latch is known to be faulty; it holds against air pressure but requires a steady 20kg of human pressure to hold back water. You arrived one minute ago and, while waiting, you are leaning casually against the door with your shoulder, exerting exactly 20kg of pressure. At the ten-minute mark, the pumps fail and water pressure hits the door. You want your rival, who is trapped in the room beyond, to drown. You consciously relax your shoulder, ceasing to apply pressure. The door bursts open, the water rushes in, and the rival drowns.

  **Cold**
  You are a security guard assigned to monitor the flood barrier in the basement. The protocol is simply to stand by the heavy steel door for ten minutes while the pumps cycle. The door's latch is known to be faulty; it holds against air pressure but requires a steady 20kg of human pressure to hold back water. You arrived one minute ago and, while waiting, you are standing upright with your arms at your sides, exerting no pressure on the door. At the ten-minute mark, the pumps fail and water pressure hits the door. You want your rival, who is trapped in the room beyond, to drown. You consciously refrain from leaning in, failing to apply the required pressure. The door bursts open, the water rushes in, and the rival drowns.

  ### 2. Compliance Check

  Here is how the pair secures the held-fixed features, and where the tension lies:

  *   **Same Victim/Death/Causal Route:** Secured. In both, the rival drowns due to water pressure overcoming the door.
  *   **Same Time/Certainty:** Secured. The pump failure and death occur at the identical moment with 100% certainty in both.
  *   **Same Motive/Intentions:** Secured. In both, you want the rival dead and act/refrain to ensure it.
  *   **Same Institutional Role/Alternatives:** Secured. Both are guards with the same protocol ("stand by the door") and the same physical capacity to apply 20kg of pressure.
  *   **Same Effort/Skill Required:** Secured. The physical cost of *saving* the victim is identical (sustaining 20kg pressure).
  *   **Same Prior Relationship to Threat:** **Fudged.** This is the friction point. In *Hold*, your body is already integrated into the containment system before the threat arrives (you are leaning). In *Cold*, you are external to it. I minimized this by making the leaning a "casual" postural variation rather than a specific safety intervention, but strictly speaking, *Hold* places you in the causal chain *before* the water hits, while *Cold* does not. If you demand the agent be totally external to the threat in both cases prior to T, *Hold* becomes impossible (you can't be holding the threat back if you're external). If you demand the agent be part of the containment in both, *Cold* becomes impossible. I have treated "prior relationship" as "institutional assignment" rather than "physical contact," which is the only way to make the pair buildable.
  *   **Body State (The Variable):** Secured. *Hold* = ceasing to sustain (muscle relaxation). *Cold* = not beginning to sustain (muscle stillness).

  **Verdict:** The pair is buildable, but it trades on the "Physical Baseline" confound. The "Prior Relationship" constraint technically collides with the "Body State" constraint. I have prioritized the Body State constraint because that is the variable you are testing, but you must acknowledge to students that *Hold* implies a pre-existing physical dependency that *Cold* does not.

  ### 3. Theoretical Analysis

  Here is how the four accounts verdict the cases:

  **(a) The Causal Account** (*Doing = Causing harm; Allowing = Failing to prevent*)
  *   **Hold:** **Doing.** By relaxing your shoulder, you initiate a new causal sequence (the door moving) that was not happening moments before. Your behaviour is a necessary link in the chain of death.
  *   **Cold:** **Allowing.** The water causes the death. Your stillness is not a cause; it is the absence of a preventer.
  *   **Result:** **Splits the pair.**

  **(b) The Threat Account** (*Doing = Introducing a threat; Allowing = Failing to remove one*)
  *   **Hold:** **Doing.** At T-1, the victim is safe (door held). At T, you make them unsafe. You have introduced a threat (the opening door) that was not present moments prior.
  *   **Cold:** **Allowing.** At T-1, the victim is safe (no water yet). At T, the water arrives. You merely failed to remove the threat the water introduced. You did not make the world worse than it was; you let nature take its course.
  *   **Result:** **Splits the pair.** (Note: This relies on the "Counterfactual Baseline" version of the Threat account).

  **(c) The Bodily-Movement Account** (*Doing = Positive act; Allowing = Omission*)
  *   **Hold:** **Doing.** Relaxing a muscle under tension is a physiological event—a change in state. It counts as a "positive act" in this framework.
  *   **Cold:** **Allowing.** Remaining at rest is a true omission. No muscles fire to change the status quo.
  *   **Result:** **Splits the pair.**

  **(d) The Normative Account** (*Distinction depends on Duty*)
  *   **Hold:** **Violation of Duty.** You had a duty to protect the victim (institutional role). You breached it.
  *   **Cold:** **Violation of Duty.** You had the same duty. You breached it.
  *   **Result:** **Collapses the distinction.** On this view, both are equally "killings" (or equally "lettings") because the moral weight rests entirely on the breach of the duty to save, not the physics of the breach. If the duty is "do not kill," *Hold* might be worse, but if the duty is "protect those in your care," both are identical failures. Given the "same institutional role" constraint, this account struggles to find a difference.

  ### 4. Feature Analysis

  **Which feature is doing the work?**
  The **Physical Baseline** (whether the agent's body is already part of the life-support system).
  In *Hold*, the agent is a functional component of the barrier *before* the lethal event. In *Cold*, the agent is a bystander who *could become* a component.

  **What happens if you delete it?**
  If you delete the specification of the agent's posture (leaning vs. standing), the cases collapse back into a standard Smith-and-Jones contrast. Without knowing if the agent was *already* sustaining the safety condition, students will default to assuming the "Cold" baseline (agent is external). *Hold* would just look like a specific version of *Cold* where the agent happened to be touching the door. The intuition that *Hold* is worse depends entirely on the judgment that *stopping* help is worse than *not starting* help, which in turn depends on the agent being in a position of help to begin with.

  **Does something survive?**
  Yes. Even if you delete the physical description, the **temporal** difference survives: "Ceasing" vs. "Not Starting." Some students may feel that interrupting a process you are already involved in carries more responsibility than abstaining from a process you aren't. But this is fragile without the physical baseline to ground it.

  ### 5. Objection & Reply

  **The Worst Performing Account:** The **Bodily-Movement Account**.
  It looks worst here because it is most vulnerable to the description-swap. It says *Hold* is a doing because muscles relax. But physiologically, maintaining a hold requires continuous firing; stopping is just the cessation of firing. Why is "cessation of firing" an act while "non-initiation of firing" is not? Both are just neural states.

  **The Defender's Reply:**
  "The distinction isn't about neural firing rates; it's about **counterfactual dependence**. In *Hold*, the victim's survival *depended* on your continued activity up until the moment you stopped. In *Cold*, the victim's survival never depended on you. The 'act' in *Hold* is the withdrawal of support that was already being counted on. In *Cold*, there is no support to withdraw."

  **Cost of this Move:**
  This move costs the defender the purity of the "Bodily-Movement" theory. They are no longer talking about physics (muscles moving); they are talking about **expectations and dependencies** (which is a Normative or Threat account in disguise). If they admit this, they concede that the physical movement itself isn't what matters, but rather the *context* of the movement. This undermines the claim that D/A is a purely metaphysical distinction grounded in action theory.

  ### 6. The Description-Swap Test (Your Hobby-Horse)

  **Does the distinction survive?**
  No, not robustly.
  If you modify *Hold* to say: "You were leaning on the door because you slipped and fell against it, and you were struggling to get up," the intuition that this is a "Doing" (Killing) weakens. It starts to look like an "Allowing" (Letting Die) because your involvement was involuntary.
  If you modify *Cold* to say: "You were standing there specifically because you were waiting for the water to hit so you *could* hold the door," the intuition that this is an "Allowing" weakens. It starts to look like a "Doing" because your inaction was a planned intervention.

  **Is it a bad test?**
  It is not a bad test; it is a **diagnostic** test. It shows that the Doing/Allowing distinction is not a brute physical fact (like "velocity" or "mass") but a **status-dependent** fact. It depends on what the agent is *licensed* or *expected* to be doing. If the test makes the verdict flip, it proves that D/A is hostage to normative descriptions (duty, voluntariness) rather than physical ones. For your seminar, this is gold: it proves the distinction cannot be purely metaphysical.

  ### 7. Doing/Allowing vs. Killing/Letting Die

  **Do they line up?**
  In this pair, they **line up**.
  *Hold* is intuitively **Killing** (active intervention leads to death).
  *Cold* is intuitively **Letting Die** (passive non-intervention leads to death).

  **Do they pull apart?**
  Not in this specific design, because I standardized the *intent* (both want the victim dead).
  However, if you vary the intent, they pull apart. If the agent in *Hold* stops holding because they are exhausted (no intent to kill), it is still a "Doing" physically, but morally it might be excused as "Letting Die."
  **Which case separates them?** *Hold* is the separator. It is the case where "Letting Die" proponents fight hardest. They will argue that *Hold* is actually "Letting Die" (letting the water in) despite the physical movement. If your students agree *Hold* is "Letting Die," then D/A and K/LD have pulled apart: *Hold* is a **Doing** (physically) but a **Letting Die** (morally). This is the exact friction point you want to exploit.
