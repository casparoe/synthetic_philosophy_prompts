answer: |-
  ### The Tension: Naturalized Normativity vs. Anti-Essentialist Ontology

  The core tension lies between Quine's **ontological naturalism** (the claim that all legitimate properties are continuous with the causal properties posited by empirical science) and his **modal anti-essentialism** (the rejection of *de re* necessity, or the idea that objects possess properties essentially, independent of how they are described).

  For a Quinean naturalized ethics to work, moral properties (like "wrongness") must be identified with natural properties (like "causing suffering") to earn their place in the web of belief. However, for these properties to function *morally*—guiding action and supporting judgment across different contexts—they must support counterfactuals and generalizations that resemble modal necessities. Quine's framework struggles to accommodate the stability required for moral naturalism without violating his strictures against essentialism.

  ### The Scenario: Institutional Slavery and Property $N$

  Consider the institutional practice of **chattel slavery**. A Quinean naturalist seeks to identify the moral property **Wrongness** ($W$) with a complex natural/functional property ($N$), such as *"the systematic deprivation of autonomy resulting in net psychological trauma."*

  To naturalize ethics, the Quinean claims:
  $$ \text{Slavery is } W \iff \text{Slavery is } N $$

  For this identification to be ethically robust and not merely a report of current sentiment, it must support **counterfactual stability**. We must be able to say: "Even if the economic conditions were different, or if the slaves were psychologically resilient, this institution would *still* be wrong." This implies that the link between the institution (the object/event) and property $N$ is not accidental. The wrongness must be tied to the *nature* of the institution, not just its current contingent effects.

  **The Modal Commitment:**
  To assert that slavery is *naturally* wrong requires a commitment that the connection between the institutional structure and property $N$ is **necessary** in a law-like sense. If the connection were purely contingent, one could imagine a possible world where slavery exists without property $N$ (e.g., "happy slaves"), and in that world, slavery would not be wrong. But moral naturalism typically wants to say that such a world is impossible or that the institution *essentially* produces $N$.

  **The Quinean Block:**
  Quine's anti-essentialism (articulated in "Reference and Modality") denies that objects have properties essentially. Whether an object (or institution) has property $N$ essentially depends on how we describe it.
  1.  Described as *"a system of forced labor,"* slavery might essentially entail $N$.
  2.  Described as *"an economic arrangement of the 18th century,"* slavery might only contingently entail $N$.

  For Quine, there is no fact of the matter about which description captures the "essence" of the institution. Therefore, there is no fact of the matter about whether the wrongness is *necessarily* tied to the institution. The link is relative to our conceptual scheme (ideology), not a feature of the world (ontology).

  ### Why the Ontology/Ideology Distinction Fails to Dissolve the Tension

  Quine often resolves modal anxieties by relegating modality to **ideology** (the language we use) rather than **ontology** (what exists). He allows modal operators if they are not quantified into (i.e., we can say "Necessarily, all bachelors are unmarried," but not "There exists an $x$ such that $x$ is necessarily a bachelor").

  One might argue the Quinean ethicist can treat the link between $W$ and $N$ as merely ideological: a useful way of speaking that doesn't commit us to modal entities. However, this dissolution fails for two reasons:

  1.  **The Loss of Naturalistic Realism:** If the link between Wrongness and Natural Property $N$ is merely a feature of our conceptual scheme (ideology), then moral truths are not discoveries about the causal structure of the universe. They become linguistic conventions. This undermines the *naturalistic* ambition, which seeks to ground ethics in the same mind-independent reality as physics or biology. If "wrongness" is just a projection of our conceptual scheme onto natural events, Quinean ethics collapses into a form of projectivism or error theory, not naturalistic realism.
  2.  **The Requirement of Quantification:** Scientific laws (which naturalized ethics aims to emulate) quantify over variables. To say "All actions of type $A$ are wrong" is to quantify over actions. If the "wrongness" of those actions relies on a modal connection to $N$ that is only ideological, the generalization lacks the projectible strength of a scientific law. Quine accepts laws, but he treats their necessity as a matter of how centrally we hold the sentence in the web of belief, not a feature of the objects. If moral laws are merely central beliefs, they are revisable in principle. This implies that under sufficient theoretical pressure (e.g., a radical shift in sociological theory), we could revise our web of belief to accept that "Slavery is $N$ but not $W$." A robust moral naturalism cannot accept this revisability without ceasing to be *moral*.

  ### Implications: The Collapse into Description

  This tension reveals a critical limitation in whether a Quinean naturalized ethics can genuinely dispense with modal notions.

  If Quine strictly maintains his anti-essentialism, he cannot account for the **normative stability** of moral properties. Without a modal tie (even a naturalized one) between the descriptive base ($N$) and the moral value ($W$), the statement "Slavery is wrong" reduces to "Slavery has property $N$, and we dislike $N$."

  This results in the **collapse of the normative into the descriptive**:
  *   **Descriptive:** "This institution causes trauma." (Empirically verifiable, modally contingent).
  *   **Normative:** "This institution ought not to exist." (Implies a stability across contexts).

  In Quine's framework, the "ought" is absorbed into the "is" of our current best theory. But because Quine denies that our theories latch onto essential structures of objects, the "is" is always relative to a conceptual scheme. Consequently, a Quinean naturalized ethics cannot sustain the claim that moral properties are *real features of the world* that command assent independent of our specific linguistic formulation.

  **Conclusion:**
  The tension reveals that a consistent Quinean naturalism cannot support a robust moral ontology. To save moral properties as genuine, action-guiding natural kinds, one must smuggle in a form of essentialism (that certain natural configurations *necessarily* constitute wrongness). To remain faithful to Quine's anti-essentialism, one must admit that moral properties are merely descriptive labels we apply to natural events, devoid of the counterfactual force required for genuine normativity. Thus, Quine's framework ultimately suggests that a naturalized ethics is possible only by eliminating the distinctively *moral* (modal/normative) character of ethical claims, reducing them to sociology or psychology.
