      *   **The Conceptual Problem (approx. 250 words):** Elaborate on the tension. The Handicap Principle suggests cost guarantees honesty. The Evolutionary/Functionalist counter-argument suggests natural selection eliminates waste. If a procedure survives, it must have a hidden function (error correction). This creates a dilemma: either the cost is useless (and should vanish) or it's useful (and isn't a handicap).
