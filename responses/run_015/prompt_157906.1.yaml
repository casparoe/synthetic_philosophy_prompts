answer: |-
  **Title:** The Paradox of Constitutive Waste: Signaling and Function in Expert Institutions

  **Introduction**
  Expert institutions, ranging from peer-review systems in science to judicial panels and charitable governance boards, are characterized by procedural friction. Decisions are delayed by multiple rounds of scrutiny; governance is slowed by ritualized voting protocols; and access is gated by administrative burdens that appear disproportionate to the immediate task. A central question in the philosophy of social science is how to interpret this friction. One interpretation, drawing on the logic of the handicap principle, suggests these burdens act as credible signals. By willingly enduring cost, the institution distinguishes its commitment from "cheap talk," thereby securing trust. A competing interpretation, rooted in evolutionary functionalism, argues that competitive selection eliminates genuinely wasteful practices. If a burden persists, it must covertly serve a functional role, such as error-correction or coordination, rendering the handicap account redundant.

  This proposal outlines a research project designed to resolve this conceptual tension. The objective is not merely to choose between signaling and functionalism, but to formulate a precise, non-reductive version of the dispute. Specifically, I ask whether there can exist a stable institutional regime in which a practice is genuinely costly—wasteful from the standpoint of individual rational optimization—yet persists not because of hidden functionality, but because the cost itself is the mechanism that maintains collective credibility. I term this the "intermediate regime" of constitutive waste.

  **The Conceptual Problem and Model Collapse**
  The core theoretical difficulty lies in the stability of the signal. In standard evolutionary game-theoretic models of costly signaling, a signal is stable only if it is too costly for low-quality agents to mimic. However, these models typically assume that selection pressures operate primarily at the level of the individual actor or the competing institution. If a procedural burden is purely a handicap—meaning it consumes resources without improving the epistemic quality of the output—a "mutant" institution should arise that streamlines the process, lowers costs, and undercuts the incumbent. If the incumbent survives, the functionalist argues, the burden must be doing work (e.g., filtering low-quality submissions) that the streamliner fails to do.

  Consequently, standard models tend to collapse the intermediate possibility into one of two binary outcomes. Either the cost is pure waste, in which case the institution is evolutionarily unstable and should vanish; or the cost is functional, in which case it is not a handicap in the strict sense, but an instrumental investment. This collapse obscures the possibility that the *inefficiency* itself is the source of value. For example, the slowness of peer review may not improve the specific paper's quality (functional) but may signal to the broader community that the journal is not desperate for content, thereby maintaining the currency of the publication (signaling). Standard individual-level optimization models struggle to capture this because they cannot easily account for why an individual actor would not defect to a more efficient strategy if the group benefit relies on collective inefficiency.

  **Proposed Analytical Strategy**
  To discriminate between the handicap interpretation and the hidden-function interpretation, this project proposes a two-level analytical strategy combining multi-level selection modeling with structured comparative analysis.

  First, I will develop a conceptual model that separates individual-level inefficiency from institution-level equilibrium stability. Unlike standard signaling games where payoffs are immediate, this model will treat institutional credibility as a public good that degrades if individual actors optimize too aggressively. The model will test whether a "constitutive waste" equilibrium can resist invasion by efficient mutants when trust is modeled as a non-linear function of perceived commitment.

  Second, this theoretical framework will be applied through a structured comparative analysis of non-profit governance rituals and open-science initiatives. The strategy relies on identifying "efficiency shocks"—instances where institutions deliberately reduce procedural burdens. The functionalist predicts that reducing burdens will increase error rates (e.g., more retractions, more governance scandals) while maintaining or increasing trust due to higher output. The handicap theorist predicts that reducing burdens may lower error rates (or leave them unchanged) but will degrade trust and institutional prestige, because the signal of commitment has been weakened.

  By comparing institutions that have undergone streamlining (e.g., journals shifting to rapid-review models or boards adopting digital governance) against controls that maintain traditional friction, we can observe the decoupling of *epistemic quality* from *institutional trust*. If trust drops despite stable quality, this supports the intermediate regime where the cost itself sustains the social fact of authority.

  **Criteria for Support and Retreat**
  The success of this project hinges on specific empirical and conceptual thresholds. Support for the intermediate regime requires demonstrating a divergence between quality metrics and trust metrics following an efficiency shock. Specifically, if an institution reduces administrative burden and objective error rates remain constant (or improve), yet the institution suffers a loss of prestige, funding, or compliance, this indicates the burden was functioning as a handicap rather than a filter.

  Conversely, the project must retreat to the standard functionalist position if every observed instance of procedural burden can be correlated with a measurable reduction in error or coordination costs. If streamlining consistently leads to higher error rates that explain the loss of trust, then the "waste" was merely hidden function. Alternatively, the project must retreat to the pure waste position if institutions maintaining high burdens are shown to be in decline, unable to compete with leaner competitors, suggesting the handicap is indeed evolutionarily unstable.

  **Scope and Limitations**
  This inquiry is framed as a multi-semester project rather than a single workshop paper due to significant scope limitations regarding data and causal inference. First, establishing that a cost is "genuinely wasteful" requires ruling out all possible hidden functions, a negative proof that is philosophically and empirically demanding. Longitudinal data is required to distinguish between short-term efficiency gains and long-term reputational decay. Second, trust is a latent variable; proxy measures (citation rates, donation levels) are noisy and influenced by external factors.

  Furthermore, the theoretical modeling requires refining multi-level selection arguments to avoid the charge of group-selection naivety. Demonstrating that individual inefficiency can be stable requires precise conditions regarding competition and information asymmetry that cannot be fully explored in a brief treatment. Finally, the comparative analysis must control for cultural and disciplinary differences that might confound the relationship between friction and trust.

  By acknowledging these limitations, the proposal positions the "intermediate regime" not as a final verdict, but as a necessary conceptual category for understanding the persistence of institutional friction. It moves the debate beyond the binary of "useless bureaucracy" versus "hidden utility," offering a framework where the cost of doing business is understood as the price of maintaining the social reality of expertise. Formal citations and a detailed bibliography will be supplied separately to accompany the full theoretical development.
