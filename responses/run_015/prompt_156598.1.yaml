answer: |-
  The clock on the wall read 4:15 PM. The submission portal for the *Handbook of Non-Classical Logic* closed at five. Ilse Vogt capped her marker and turned to Ravi Menon. The whiteboard behind her was crowded with negation symbols and domain restrictions.

  "We need the entry text, Ravi. Not another seminar."

  "We need a semantics that doesn't break when turned," Ravi replied, leaning forward. "Look, let me ensure I have your view right before I dismantle it again. You hold that the fourfold rejection—denying existence, non-existence, both, and neither—is not a logical operation on truth-values. It is a diagnostic tool. You treat 'The Tathāgata exists after death' as a sentence with a failing singular term. In your free logic, it lacks a truth-value because the subject has no intrinsic nature. The four denials are just four ways of pointing out that the presupposition fails."

  Ilse nodded. "Precisely. Classical logic holds for well-formed propositions. Madhyamaka shows us that many philosophical claims are not well-formed because they presume *svabhava*. I don't revise logic; I revise the ontology required to feed it."

  "And my view," Ravi said. "You see it as an algebraic necessity. I argue that if the four lemmas are to form a complete partition of logical space, we need four values: true, false, both, and neither. To avoid a fifth lemma when we reject the fourth, I distinguish an internal negation, which operates within the four values, from an external negation, which asserts that the sentence takes none of them. You think this reifies emptiness into a fifth value."

  "I think it risks it," Ilse corrected. "But let's test them. Case one: 'The Tathāgata exists after death.' On my view, the term 'Tathāgata' fails to denote an intrinsic entity. The sentence is truth-valueless. All four lemmas are rejected because the precondition for truth-assessment is missing."

  Ravi tapped his pen. "Here is the collapse. If the sentence lacks a truth-value, then Lemma One ('It exists') is false—or rather, not true. But Lemma Two ('It does not exist') is also not true. On your account, the rejection of the second lemma and the rejection of the fourth lemma ('Neither exists nor does not exist') come to the same thing. Both are just 'presupposition failure.' The fourfold collapses into a twofold. The form does no work."

  Ilse sighed. "I concede the output looks identical in a truth-table. If you map 'presupposition failure' to 'no value,' Lemma Two and Lemma Four both yield null. But the derivation differs. Lemma Two is denied because the predicate fails to apply; Lemma Four is denied because the conjunction of failures is not a positive state. However, for the handbook entry, I will admit that my notation cannot distinguish the rejection of the second from the rejection of the fourth without pragmatic markers."

  "Pragmatics isn't semantics," Ravi said. "Which brings us to case two. 'A chariot exists.' The texts say this is true conventionally but not ultimately. This looks like Lemma Three: both true and false. You say it's equivocation."

  "It is," Ilse insisted. "'Exists' means 'functions causally' in the first instance and 'exists intrinsically' in the second. It's not a glut; it's indexicality."

  "Okay," Ravi said, holding up a hand. "I concede that equivocation blocks the contradiction in natural language. If 'exists' shifts sense, you don't need a paraconsistent logic to avoid explosion. But if both levels are about the *same* chariot, what in your apparatus prevents every sentence and its negation from being true together when the levels mix? You need a principled reason for rejecting Lemma Three formally, not just a shrug that says 'different contexts.' My four-value semantics handles the shift as a single object having incompatible properties at different evaluation points."

  "And your solution," Ilse countered, "creates a stable object that has properties. That violates emptiness. But let's go to the third case. The one you constructed. Sentence E: 'This sentence is empty.'"

  Ravi smiled faintly. "If all things are empty, E is empty. But if E is empty, what it says is the case. So E is true. But a true sentence looks like it has a stable truth condition. You claim your free logic handles this by saying E cancels its own subject. It's not a proposition."

  "Exactly," Ilse said. "It means having no thesis. Can a conclusion be non-propositional? Yes. It's a performative cancellation."

  "But here is where your classical claim fails," Ravi pressed. "You say you keep classical logic. But free logic combined with a non-classical treatment of quantification over a domain with no stable members *is* revisionary. You are changing the quantifier rules to accommodate 'no stable members.' That isn't classical logic unchanged. And meanwhile, I must answer your charge that my external negation makes emptiness a fifth value."

  "Doesn't it?" Ilse asked. "If you say 'E is neither true, false, both, nor neither,' haven't you named a state?"

  Ravi paused. He looked at the clock. 4:45 PM. "I concede the phrasing is dangerous. If 'external negation' is treated as a value in the algebra, I have five values. I must insist it is an operator on the algebra, not a member of it. But Ilse, you must concede that your 'cancellation' acts like a value in practice. You treat 'presupposition failure' as a distinct semantic status to block inference. That is a fifth value in disguise."

  Ilse rubbed her temples. "I concede that operationally, 'failure to denote' functions like a value in the metalanguage. We are both smuggling ontology into the semantics."

  "We are," Ravi said. "But we have to submit. We need the three sentences."

  They turned to the shared document on the screen. The cursor blinked in the text box.

  "The joint statement," Ilse said. "It has to be neutral."

  "The fourfold rejection functions as a limit on predication," Ilse typed, "whether modeled as presupposition failure or as a multi-valued algebraic closure."

  Ravi read it. "Acceptable. It describes the function without committing to the mechanism." He typed his name below it.

  "Now the separating sentence," Ravi said. "This needs to capture the core disagreement."

  "Classical logic requires revision only if emptiness is a property," Ilse dictated, "whereas emptiness is actually the dissolution of the subject required for property attribution."

  Ravi shook his head. "Too verbose. Try: 'The semantics of emptiness requires either a revision of truth-values or a revision of the domain of quantification, but not both.'"

  "No," Ilse said. "That implies we could split the difference. The split is deeper. How about: 'The formal analogue of emptiness is either a value within the system or the condition for the system's application.'"

  Ravi nodded slowly. "Yes. That's it. I hold it's a value—specifically the 'neither' value managed by external negation. You hold it's the condition for application. That separates us." He typed it into the second box.

  "Finally, the test sentence," Ilse said. "Not the Tathāgata, not the chariot, not E. Something new."

  "The sentence: 'Emptiness is the ultimate truth,'" Ravi suggested.

  "Good. On my semantics," Ilse said, "that sentence fails. 'Emptiness' is not an entity that can be a subject. It is truth-valueless. Verdict: Undefined."

  "On my semantics," Ravi said, "it is true, but only under external negation. It asserts that no internal value applies to ultimate reality. Verdict: True via external negation."

  "Wait," Ilse said. "If it's true via external negation, isn't that a truth value?"

  "It's the verdict my system yields," Ravi said. "Yours yields nothing."

  "Then we have divergence," Ilse said. "Undefined versus True."

  "Write it," Ravi said.

  Ilse typed: *Test Sentence: "Emptiness is the ultimate truth." Ilse's Verdict: Undefined (presupposition failure). Ravi's Verdict: True (via external negation).*

  She hit save. The status bar turned green. Submitted.

  Ravi leaned back. "We didn't solve Madhyamaka."

  "No," Ilse said, packing her bag. "But we formalized the disagreement. That's what logic is for."

  "Until the next refutation," Ravi said.

  "Until the next refutation," Ilse agreed.
