answer: |-
  This is a sophisticated plan that targets the exact friction points in the literature (Levi, Walley, Seidenfeld). The logistics are the biggest risk: with only 14 students, you cannot afford clunky transitions. You need to move from "feeling" to "formalism" without losing the room.

  Here is the runnable lesson plan, optimized for a 90-minute seminar.

  ### **Lesson Title:** The Price of Precision
  **Goal:** Demonstrate that imprecise credences entail specific behavioral commitments (buy/sell gaps, menu dependence, dilation) that differ structurally from sharp credences.
  **Materials:**
  *   2 Opaque Bags (labeled **K** and **U**).
  *   100 Colored Tokens (Red/Blue) or printed cards.
  *   "Bid Slips" (small paper, 3 per student).
  *   Projector/Board for recording data.
  *   1 Chocolate Bar (The Prize).

  ---

  ### **1. Timeline & Flow (90 Minutes)**

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Control & Calibration** | Establish risk baseline with a known coin. |
  | **10–30** | **Phase 1: The Gap** | Urn K vs. Urn U. Elicit Buy/Sell prices. |
  | **30–45** | **Phase 2: The Sure Gain** | Split Group U. Test menu dependence (Bets X, Y, X+Y). |
  | **45–55** | **Phase 3: Dilation** | The Two-Box Problem. Offer free information. |
  | **55–90** | **Debrief** | Map behavior to theory. Dutch Book vs. Forgone Gain. |

  ---

  ### **2. Procedure & Rules**

  #### **Setup: Points & Payout**
  *   Every student starts with **1,000 Points**.
  *   Bets are settled in points immediately after each phase (keeps stakes salient).
  *   **Prize:** The student with the highest final score gets the chocolate bar. (Tie-breaker: random draw).
  *   **Rule:** You are rational agents. Do not take a bet if you believe it has a *negative expected value* based on your information.

  #### **00–10: Control (Risk Aversion Check)**
  *   **Action:** Flip a visible, fair coin.
  *   **Bet:** Pays 100 points if Heads.
  *   **Task:** On a slip, write your **Buy Price** (max you'd pay) and **Sell Price** (min you'd accept to sell the ticket).
  *   **Collect & Board:** Write the range on the board.
  *   **Expected:** Tight spread around 50 (e.g., 48–52). If ranges are wide (e.g., 30–70), note that this class is highly risk-averse, which will confound Phase 1. *Adjustment:* If ranges are wide, explicitly tell them: "For the rest of the game, assume you are risk-neutral regarding points. Maximize expected points."

  #### **10–30: Phase 1 (The Behavioral Gap)**
  *   **Split:** Divide class into Group K (7 students) and Group U (7 students).
  *   **Group K Info:** "A fair coin was flipped. Heads: 4 Red / 6 Blue in Bag K. Tails: 6 Red / 4 Blue in Bag K. You don't know the coin result." (Sharp $P(Red) = 0.5$).
  *   **Group U Info:** "Bag U contains 10 balls. There are either 4, 5, or 6 Red balls. We have no information about which." (Imprecise $P(Red) \in [0.4, 0.6]$).
  *   **Task:** Both groups draw one ball (replace it). They write **Buy** and **Sell** prices for a ticket paying 100 points if Red.
  *   **Data Collection:** **Do not use show of hands.** Collect slips. Write the *minimum Buy* and *maximum Sell* for each group on the board.
  *   **Settlement:** Pick a market price (e.g., 50). If Buy > 50, they buy. If Sell < 50, they sell. Settle points.
  *   **Expected Result:** Group K trades actively around 50. Group U has a "dead zone" (e.g., Buy max 40, Sell min 60). No trades occur in the 40–60 range.

  #### **30–45: Phase 2 (Menu Dependence)**
  *   **Focus:** Only Group U participates (Group K sits out or observes).
  *   **Split:** Divide Group U into **U1** (Sequential) and **U2** (Menu).
  *   **The Bets:**
      *   **Bet X:** Pay 10 if Red, Receive 14 if Blue.
      *   **Bet Y:** Receive 14 if Red, Pay 10 if Blue.
      *   **Bundle:** Take both X and Y. (Net: +4 points regardless of color).
  *   **Instruction:** "Recall your credence is $[0.4, 0.6]$. Accept a bet only if it has positive expected value for *every* probability in that set."
  *   **U1 Procedure:** Ask "Accept X?" (Wait for vote). Ask "Accept Y?" (Wait for vote). Finally ask "Accept Both?"
  *   **U2 Procedure:** Show menu {None, X, Y, Both}. Ask them to pick one.
  *   **Expected Result:** U1 rejects X, rejects Y, then (hopefully) accepts Both. U2 picks Both.
  *   **Philosophical Hook:** U1 rejected a sure gain because of the *order* of presentation.

  #### **45–55: Phase 3 (Dilation)**
  *   **Setup:** 100 Balls total (50 Red, 50 Blue). Split into **Box A** and **Box B** (50 balls each).
  *   **Constraint:** "The manufacturer guarantees neither box has more than 60% Red balls." (Implies Red in each box $\in [20, 30]$, so $P(Red|Box) \in [0.4, 0.6]$).
  *   **Current State:** You know a ball is drawn from *one* of the boxes (50/50 chance which box). Unconditional $P(Red) = 0.5$. (Sharp).
  *   **The Offer:** "I will tell you which box the ball came from. It costs 0 points. Do you want to know?"
  *   **Task:** Vote Yes or No.
  *   **The Trap:** If they say Yes, their credence becomes imprecise $[0.4, 0.6]$ regardless of the answer. If they say No, it stays sharp $0.5$.
  *   **Expected Result:** Students who understand Phase 1 should decline the info. (If they accept, they voluntarily dilate their own credence).

  ---

  ### **3. The Debrief Script (35 Minutes)**

  **Part 1: The Gap (Behavioral Imprecision)**
  *   **Point:** "Look at the board. Group K traded. Group U didn't. You all *felt* uncertain in both cases, but only Group U *acted* differently."
  *   **Philosophy:** Imprecision isn't a feeling of 'vagueness'; it's a commitment to a **range of permissible betting prices**.
  *   **Dutch Book Contrast:** "A sharp agent who refuses to bet at 45 and 55 is vulnerable to a Dutch Book (sure loss). An imprecise agent who refuses to bet at 45 and 55 is not. Their 'failure mode' is not losing money, but **forgoing gain**."

  **Part 2: The Sure Gain (Menu Dependence)**
  *   **Point:** "Group U1 rejected X and Y individually. Why? Because at $P(Red)=0.6$, X loses. At $P(Red)=0.4$, Y loses."
  *   **Philosophy:** This is the cost of **E-Admissibility** or **Maximin**. You protect yourself from the worst-case prior, but you become sensitive to how options are packaged.
  *   **The Cost:** "You threw away 4 sure points. Is that rational? Yes, if your goal is to ensure you never act against your evidence. No, if your goal is pure accumulation."

  **Part 3: Dilation (Seidenfeld's Phenomenon)**
  *   **Name:** This is **Dilation**.
  *   **Point:** "You started with a sharp 0.5. Free information turned it into [0.4, 0.6]. You became *less* precise by learning."
  *   **Philosophy:** Conditioning on a partition can expand your lower/upper probabilities even if the partition is irrelevant to the hypothesis *on average*.
  *   **Takeaway:** "Sometimes, ignorance is precision. Information is noise."

  **Part 4: Addressing the Objections (The "Gotchas")**

  *   **Objection 1: "Just use the Midpoint (0.5)."**
      *   **Reply:** "If you use 0.5, you are claiming your evidence warrants 0.5 more than 0.41. In Urn U, it doesn't. Using 0.5 is **arbitrary precision**. If the true rate is 0.4, the 'Midpoint Agent' gets Dutch Booked. The 'Imprecise Agent' just sits out."
  *   **Objection 2: "This is just Risk Aversion / Ellsberg."**
      *   **Reply:** "We controlled for that with the Coin Flip. If you bid 49–51 on the coin but 40–60 on Urn U, that's not risk aversion. That's **evidential weight**."
  *   **Objection 3: "This is just a Confidence Interval."**
      *   **Reply:** "Frequentist confidence intervals are about long-run coverage. This is about **single-case rationality**. What price is *fair* right now?"

  ---

  ### **4. Troubleshooting: What Will Go Wrong**

  **(a) The Risk Aversion Confound**
  *   **Risk:** Students bid 30–70 on the Control Coin.
  *   **Fix:** If this happens, pause. Say: "We have high risk aversion in the room. For the next rounds, imagine you are a 'Risk Neutral Bank'. Your utility is linear in points." If they still act risk-averse, acknowledge it in the debrief: "Risk aversion widens the gap, but only *imprecision* creates a gap where the expected value is clearly positive for some priors."

  **(b) The "Midpoint" Rebel**
  *   **Risk:** A student in Group U insists on using 0.5 and trades at 50.
  *   **Fix:** Don't correct them during play. In the debrief, ask: "What evidence do you have that it's exactly 5 and not 4 or 6?" When they admit "None," say: "Then you are guessing. Imprecise probability is the formalism for *not guessing*."

  **(c) The "Confidence Interval" Confusion**
  *   **Risk:** Stats majors argue about sample sizes.
  *   **Fix:** Pre-empt this. "This is not inference from data. This is **direct representation of evidence**. The urn composition *is* the evidence. There is no sampling."

  **(d) Phase 2 Failure**
  *   **Risk:** Group U1 accepts X and Y anyway because they want the points.
  *   **Fix:** Reinforce the instruction: "Accept *only* if positive for *every* probability in your set." If they break the rule, they break the experiment. You may need to act as the "Bookie" who enforces the rule: "I cannot offer you Bet X because it violates your own constraints."

  ---

  ### **5. Limitations: What the Game Cannot Do**

  Be honest with them in the final 5 minutes.

  1.  **Normative Force:** The game shows *consequences* of imprecision (forgone gains, dilation). It does not prove you *ought* to be imprecise. That requires a separate argument about the nature of evidence (e.g., Joyce's accuracy arguments or Levi's consensus theory).
  2.  **Decision Rules:** The game assumes a "Maximin" style rule (reject if any prior loses). There are other rules (Gamma-Maximin, E-Admissibility) that might accept X or Y. The game doesn't solve the **decision problem** for imprecise agents; it just highlights the tension.
  3.  **Sparse Evidence:** You asked about the "sparse evidence" worry.
      *   **Verdict:** It is **not fatal**, but it must be framed correctly.
      *   **What to say:** "You noticed these intervals came from 'missing data' (we didn't tell you the distribution). In formal epistemology, this is a feature, not a bug. The interval represents the **set of probabilities compatible with your evidence**. If your evidence doesn't pinpoint a number, your credence shouldn't either. The 'indeterminacy' isn't in the world; it's in the **support relation** between evidence and hypothesis."

  ### **6. Data Collection Strategy (Crucial)**

  Do not use show of hands. It creates herding.
  **Use "Bid Slips":**
  1.  Hand out 3 slips per student at the start.
  2.  Slip 1: Control (Coin).
  3.  Slip 2: Urn (Buy / Sell).
  4.  Slip 3: Dilation (Yes / No).
  5.  **Collection:** Have them fold slips and put them in a box.
  6.  **Display:** You (the instructor) tally the ranges live on the board. "Group U Buy Prices: 35, 40, 40, 38... Max is 40." "Group U Sell Prices: 60, 65, 60... Min is 60."
  7.  **Visual:** Draw the "Gap" on the board. It will be visually striking.

  ### **7. Final Advice on the "Sparse Evidence" Worry**

  If you feel the intervals are too "manufactured," add this line to the Urn U instructions:
  *"Imagine you are a judge. You know the urn was filled by a committee of 3 experts. One says 4 red, one says 5, one says 6. They refuse to aggregate. You must make a ruling."*
  This shifts the source of imprecision from "missing data" to "**irreconcilable expert testimony**," which is a standard philosophical justification for imprecise priors (Levi). It makes the interval feel more normative and less like a lack of effort.
