answer: |-
  This is a sharp argument. You've effectively reconstructed Dennett's "Quining Qualia" but grounded it in the specific psychophysics of quality spaces (Torgerson, Shepard, Ekman) rather than just intuition pumps. It's a structuralist eliminativist argument: if identity is structural, and structure is underdetermined, identity is indeterminate.

  Your friend's reductio is the standard realist counter-punch: "If this kills qualia, it kills everything." But it's not quite a *reductio ad absurdum*; it's more of a *reductio ad Quine*. Quine *did* argue for the indeterminacy of translation. Color eliminativism is a live option. Revealed preference theory admits indeterminacy in utility functions. Your friend is treating "global skepticism" as a bug; you might be standing on the verge of a consistent structural realism where determinate intrinsic facts are the actual bug.

  However, since you want to keep (1) and (2) but avoid (5), you have to break the chain at (3) or (4). Here is the breakdown of where the argument bleeds, what your friend got wrong, and the costs of each exit.

  ### 1. The Friend's Reductio: Where it Fails
  Your friend claims the argument generalizes to object colors and word meanings. This is the weakest part of their objection.

  *   **Object Colors:** If you are a physicalist about object color (reflectance profiles, surface spectral properties), the argument *does not* run. Object colors are pinned down by physics, not just discriminatory judgments. The argument only kills *phenomenal* color (the experience). If your friend thinks object color is *also* just a construct of judgments, they are already a relationalist/eliminativist about color, and they have no ground to stand on to save qualia.
  *   **Word Meanings:** Quine would nod sagely here. The indeterminacy of translation *is* the point. If your friend wants determinate meanings, they need to reject Quinean behavioral semantics, not your argument about qualia.
  *   **Preferences:** Revealed preference theory handles this by accepting that preferences are *defined* by choices. If choices are inconsistent (intransitive), the preference relation is incomplete, not non-existent.

  **Verdict:** The reductio doesn't force you to accept global skepticism. It forces you to accept that *phenomenal properties* (and perhaps semantic properties) lack the determinacy of *physical properties*. That is a distinction realists usually want to draw anyway.

  ### 2. The Break Point: Step (3) vs. Step (4)
  You want to keep (1) [Qualia = Structural Position] and (2) [Access = Judgment]. This locks you into a specific kind of structuralism. The tension is between the empirical messiness of (3) and the metaphysical leap of (4).

  #### Option A: Reject (3) — The Psychophysical Defense
  **The Move:** You argue that while *similarity ratings* are non-metric and context-dependent, *discriminability* (Just Noticeable Differences, JNDs) defines a stable, Riemannian metric space.
  **The Argument:** Torgerson distinguished between *discriminability* (can you tell A from B?) and *similarity* (how alike are A and B?). Similarity judgments are noisy and cognitive. Discrimination thresholds are physiological and stable. If qualia are positions in a space defined by *discriminability* (the "phenomenal metric"), the space is unique (up to isomorphism) and the underdetermination vanishes.
  **The Cost:**
  1.  **Functionalism Creep:** You are defining the quality space by *capacity* (what the system can do) rather than *phenomenal character* (what it feels like). This pushes you toward functionalism.
  2.  **Empirical Risk:** You are betting on psychophysics. If future data shows JNDs are also context-dependent (adaptive coding, efficient coding hypotheses), (3) comes back stronger.
  3.  **The "Gap" Problem:** Even if the JND space is unique, does it capture *all* qualitative differences? Two stimuli might be equally discriminable but feel differently similar (e.g., hue vs. saturation). If the metric space doesn't capture the similarity data, is it really the *qualia* space?

  #### Option B: Reject (4) — The Realist/Coordinate Defense
  **The Move:** You accept the underdetermination of *models* but reject the indeterminacy of *facts*. $S_1$ and $S_2$ are just different coordinate systems mapping onto the same underlying reality.
  **The Argument:** Just as physics allows different mathematical formulations for the same physical state (e.g., Heisenberg vs. Schrödinger pictures), the mind might have a determinate qualitative state that admits multiple non-isomorphic descriptive spaces. The "fact of the matter" is the intrinsic state; the spaces are just our imperfect maps.
  **The Cost:**
  1.  **Epiphenomenalism:** You are positing a fact (the "true" quality) that makes no difference to discrimination, judgment, or behavior. By your own premise (2), we have no access to it. It is a noumenal residue.
  2.  **Violates (1):** If the quality is not exhausted by its position in the structure (since multiple structures fit), then (1) is false. You are secretly reintroducing intrinsic natures.
  3.  **The Friend's Trap:** This is exactly what your friend flagged. If "the quale itself does it," you've posited something that answers to no evidence. You save qualia by making them scientifically occult.

  #### Option C: Accept (5) — The Illusionist/Structuralist Route
  **The Move:** You bite the bullet. There is no determinate fact about *which* quale is instantiated, only facts about the discriminatory relations.
  **The Argument:** "What it's like" is not a determinate state but a vague, relational disposition. The question "Is this *exactly* Red-24 or Red-25?" has no answer, not because we can't tell, but because the property doesn't exist.
  **The Cost:**
  1.  **Denial of the Manifest Image:** You are telling your friend that their direct introspective certainty is an illusion. This is a hard sell.
  2.  **Error Theory:** You have to explain why it *seems* determinate to the subject if it isn't. (Dennett's "Joy of Introspection" move).

  ### 3. The "Coordinate System" Objection (Your Friend's Second Point)
  Your friend asked: *Suppose $S_1$ and $S_2$ fit all data. What makes it the case she's in $S_1$?*

  If $S_1$ and $S_2$ are **isomorphic** (structurally identical, just different labels), there is no problem. That's just a change of coordinates. The "fact of the matter" is the structure itself, not the labels.
  If $S_1$ and $S_2$ are **non-isomorphic** (e.g., one is Euclidean, one is hyperbolic, but both fit the similarity data within error margins), then you have a problem.

  **The Fix:** You need to tighten (3). The argument only works if the data underdetermines the *topology* or *geometry* of the space, not just the labeling.
  *   **If the geometry is fixed:** Then (1) saves qualia. The position is determinate relative to the geometry.
  *   **If the geometry is fluid:** Then (4) follows.

  Most psychophysical data suggests the geometry *is* stable enough for practical purposes (e.g., CIE color space works). The "non-metric" behavior usually shows up in high-level similarity judgments, not low-level discrimination.
  **So, the precise break is here:** You must distinguish **Phenomenal Structure** (low-level, stable, metric) from **Cognitive Similarity** (high-level, noisy, non-metric).
  *   If Qualia = Phenomenal Structure, (3) is false (or weakened).
  *   If Qualia = Cognitive Similarity, (5) follows.

  ### 4. Recommendation: How to Keep (1) & (2) Without (5)
  To keep your core commitments without collapsing into eliminativism, you should take **Option A (Refine 3)** but with a specific caveat.

  **Reject the equivalence of "Judgment" and "Similarity Rating."**
  Modify (2): *The grip we have on a subject's quality space is her **discriminative dispositions** (JNDs), not her similarity ratings.*
  Modify (3): *Discriminative dispositions define a local metric space that is stable and unique (up to isomorphism), even if global similarity ratings are non-metric.*

  **Why this works:**
  1.  It respects the Chase/Sanborn line (no intrinsic residue beyond structure).
  2.  It avoids the global skepticism (physical objects and JNDs are determinate).
  3.  It avoids the "coordinate system" trap (isomorphic spaces count as the same fact).

  **What this costs you:**
  1.  **You lose the "Inverted Spectrum" intuition:** If qualia are just positions in a discriminative space, an inverted spectrum is just a re-mapping that preserves structure. If it preserves structure, it's the same experience. If it changes structure, it's detectable. The "philosophical" inverted spectrum (same behavior, different qualia) is ruled out by definition.
  2.  **You concede to Functionalism:** You are effectively defining qualia functionally (by discrimination role). Hardline phenomenologists will say you've changed the subject.
  3.  **Vagueness remains at the margins:** You still have to admit that at the threshold of discrimination, there is no fact of the matter. But that's a feature, not a bug (phenomenal sorites).

  ### Summary of Commitments

  | Move | What you Reject | What you Keep | The Cost |
  | :--- | :--- | :--- | :--- |
  | **Reject (1)** | Structuralism | Realism / Intrinsic Natures | You must explain intrinsic natures without ostension. Inverted spectrum becomes possible. Hard to naturalize. |
  | **Reject (3)** | Equivocation on Judgment | Discriminability is Metric | You bet on psychophysics. You distinguish "phenomenal" from "cognitive" similarity. Leans functionalist. |
  | **Reject (4)** | Verificationism | Realism about Underdetermined Facts | You posit facts that make no difference to evidence. Epiphenomenal "noumenal" qualia. |
  | **Keep All** | Nothing | Eliminativism / Illusionism | You deny the determinacy of experience. "What it's like" is a vague fiction. |

  **Final Advice:**
  Your friend is right that (4) is the dangerous slide. It moves from "we can't model it uniquely" to "it isn't unique."
  However, your strongest position is to argue that **discriminability fixes the structure** enough to make qualia determinate *for all naturalistic purposes*, while admitting that **similarity judgments** are too noisy to do the job.
  This keeps (1) and (2) (mostly), breaks (3) (by refining "judgment"), and blocks (5). It costs you the "mysterious intrinsic glow" of qualia, but if you're reading Chase/Sanborn, you probably wanted to lose that anyway.

  Tell your friend: "The reductio fails because object colors are physical, but phenomenal colors are structural. Structural indeterminacy is real, but it's limited by the metric of discrimination, not the noise of similarity ratings. We don't need global skepticism, just a precise psychophysics."
