      *   *Objection 8 (Methodology):* How did you study this?
          *   *Voice:* Methodologist.
          *   *Focus:* Textual analysis vs. lived experience.

      *   *Refining the Order:* The Normative Ranking (Anthro) is #1. The Power/Inequality (Anthro) is #2. The Kantian Autonomy definition is #3. The Honor comparison is #4. The Gradient empirical claim is #5. The Stability/Function argument is #6. The Coherence contradiction is #7. The Methodology is #8.

