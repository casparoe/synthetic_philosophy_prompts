answer: |-
  **The Boundaries of the River: Defining the Demos in the Thames-Basin Assembly**

  The fundamental question of democratic theory is not merely how people should rule, but who constitutes the "people." This is the boundary problem. In traditional nation-states, boundaries are often taken for granted, inherited from history or geography. However, when political authority is designed to manage transboundary resources like river systems, the boundary problem becomes acute. The proposed Thames-Basin Assembly presents a paradigmatic case: a body with binding authority over water and ecology across national borders, affecting populations outside its administrative zone. To determine the legitimate membership of this Assembly, one must weigh the principles of residency, affected interests, subjection, and stakeholder continuity. This essay argues that a residency-based model is morally insufficient for ecological governance, while a pure "all-affected" model is pragmatically unworkable. Instead, legitimacy requires a hybrid model grounded in a physically interpreted "all-subjected" principle for current humans, combined with guardianship for future generations, while rejecting direct voting rights for non-human entities or algorithmic systems.

  The first proposal, limiting voting rights to present adult residents within the administrative zone, relies on the Stakeholder Principle grounded in sustained territorial presence. The principal argument for this view is administrative clarity and political accountability. Democracy requires a mechanism for sanctioning representatives; if voters live within the jurisdiction, they experience the consequences of policy and can vote officials out of office. This creates a tight feedback loop between decision and consequence. Furthermore, residency provides a clear, binary rule for membership, avoiding the endless litigation of who qualifies to vote.

  However, in the context of a river system, the residency principle fails to account for the physical reality of hydrology. Water flows irrespective of political borders. The specific tension identified in the prompt highlights this failure: a non-resident downstream community suffers severe impacts (drought or flooding) while resident upstream voters face only minor, diffuse costs. Under a residency-only model, the upstream majority is democratically entitled to vote themselves a benefit (water allocation) that imposes a catastrophe on the downstream minority. This is not merely an unfortunate side effect; it is a form of democratic exploitation. The upstream voters are insulated from the true cost of their decision because the cost is externalized onto non-voters. Therefore, while residency ensures accountability for *internal* consequences, it legitimizes tyranny over *external* ones. For a body managing a shared physical system, a boundary defined solely by administrative lines is arbitrary and morally deficient.

  To resolve this, the second proposal suggests the All-Affected-Interests Principle: membership extends to all living persons whose vital interests are causally affected. The moral argument here is one of equality. If a decision alters an individual's life prospects, that individual possesses an equal moral claim to influence that decision. In the Thames-Basin case, this principle immediately solves the downstream tension. The downstream community, facing severe impacts, would be granted membership, effectively giving them a veto or a weighted voice against the upstream residents' minor gains. This aligns democratic boundaries with the boundaries of consequence.

  Yet, the All-Affected Principle suffers from the problem of indeterminacy. Causality is a chain without a clear end. If the Assembly restricts water usage, global food prices might shift slightly, affecting consumers thousands of miles away. Are they members? If the ecological management alters carbon sequestration, does every human on earth have a claim? If the *demos* expands to include everyone potentially affected, it becomes too large to function as a democratic unit. Deliberation becomes impossible, and the specific accountability of the decision-makers is diluted. Furthermore, "interests" are subjective. Determining the threshold of "affected" requires a prior political decision, which begs the question of who gets to draw the boundary. While morally superior to residency in addressing the downstream tension, the All-Affected Principle is too boundless to serve as a sole operational rule for a specific legislative assembly.

  This necessitates a shift toward the All-Subjected Principle. Traditionally, this principle argues that those subject to the coercive power of the law should have a say in its creation. In the Thames-Basin context, this must be interpreted not merely as legal subjection, but as physical subjection. The Assembly has binding authority over water allocation. When upstream decisions dictate flow rates, they physically coerce downstream bodies, determining their ability to farm, drink, or remain safe from floods. This is not merely an "effect"; it is an imposition of will akin to legal coercion.

  Adopting a physically interpreted All-Subjected Principle offers a superior middle ground. It includes the downstream community because they are subject to the physical force of the Assembly's decisions, even if they are not legal residents. However, it excludes distant parties only casually affected (e.g., via global market fluctuations) because they are not subject to the direct physical coercion of the river management. This resolves the specific tension: the downstream community is included because their subjection is severe and unavoidable, whereas the upstream residents' interest is merely preferential. This principle respects the moral intuition of the All-Affected view without succumbing to its infinite regress. It defines the *demos* by the scope of unavoidable physical coercion rather than the scope of causal ripples.

  The third and fourth proposals introduce non-standard members: future generations via guardians, and non-human ecosystems via advocates. The inclusion of future generations is logically consistent with the nature of ecological management. Water tables and flood defences have time horizons that exceed human lifespans. A *demos* composed only of the living has an inherent incentive to discount the future, consuming capital that unborn people will need. Since future people cannot be "subjected" in the present, they cannot vote. However, their interests are definitively at stake. Therefore, the All-Subjected Principle must be temporally extended via institutional guardianship. Appointed guardians, insulated from short-term electoral cycles, would hold a veto or weighted vote on long-term ecological sustainability. This does not violate democratic agency because it protects the possibility of future agency.

  The proposal to permit designated advocates for non-human riparian ecosystems is more contentious. The argument for this rests on the recognition that ecosystems have interests (survival, flourishing) independent of human utility. However, democracy is a system of human agency and communication. To grant voting rights to a river is a category error; a river cannot deliberate, compromise, or bear responsibility. While the ecosystem must be protected, this is better achieved through constitutional constraints (rights of nature) enforced by human advocates or judges, rather than through membership in the *demos*. Including non-humans as voters dilutes the concept of political responsibility. Therefore, while the Assembly must serve the ecosystem's health, the ecosystem should not be a voter. It is the object of protection, not a subject of rule.

  Weighing these arguments leads to a clear conclusion. The Thames-Basin Assembly ought to determine membership based on a **Hybrid Model of Physical Subjection and Temporal Guardianship**. Voting rights should be granted to: (1) Adult residents within the zone, and (2) Adult non-residents who are subject to direct, severe physical coercion by the Assembly's decisions (specifically the downstream communities). Simultaneously, (3) Future generations must be represented by appointed guardians with specific veto powers over long-term depletion. Non-human ecosystems should be represented by legal advocates, but not granted voting membership.

  This conclusion is defended on the grounds that it maximizes legitimacy while maintaining functionality. It avoids the tyranny of the residency model by enfranchising the downstream victims of upstream decisions. It avoids the paralysis of the All-Affected model by limiting membership to those physically subjected to the river's management. It avoids the short-termism of presentism by institutionalizing the interests of the future. It creates a *demos* that matches the physical reality of the resource being managed. In the specific tension of the upstream/downstream conflict, this model ensures that the severe harms faced by the downstream community cannot be outvoted by the minor gains of the upstream residents, as the downstream community becomes part of the majority coalition required to pass legislation. This transforms the decision from an external imposition to an internal negotiation, which is the essence of democratic resolution.

  The final consideration is whether this verdict changes if the affected parties include predictive modelling systems commissioned to represent the preferences of unborn generations. The prompt suggests these systems would actively represent preferences, potentially acting as proxies for the guardians.

  The verdict does not change. Predictive modelling systems, no matter how sophisticated, are epistemic tools, not political agents. They operate based on data and algorithms provided by humans. To grant a modelling system a form of membership or voting weight would be to confuse simulation with agency. A model can predict that a certain water level will cause drought in fifty years, but it cannot "prefer" one outcome over another in a moral sense; it can only calculate probabilities based on parameters set by its programmers.

  If the Assembly were to treat these models as representatives, it would obscure the chain of accountability. Who programmed the model? What weightings did they choose? If the model "votes" for conservation, is that the will of the future, or the will of the data scientists who built the model? Granting political status to algorithms risks technocratic authoritarianism, where decisions are justified by "the model says so" rather than through human deliberation about values.

  However, the role of the *guardians* for future generations should be informed by these models. The guardians are the political agents; the models are their evidence. The Hybrid Model remains robust: humans (present and subjected) vote, human guardians represent the future, and human advocates represent the ecosystem. Predictive systems serve the guardians by reducing uncertainty about the long-term consequences of decisions, but they do not enter the *demos*. To allow otherwise would be to surrender democratic judgment to computational determinism. The boundary of the *demos* must remain human, even if the interests it protects extend beyond the present and the biological.

  In conclusion, the boundary problem in the Thames-Basin Assembly cannot be solved by retreating to traditional residency, which ignores the physical reality of water, nor by expanding to all affected interests, which ignores the practical limits of association. Legitimacy requires that the democratic boundary align with the boundary of physical coercion. By enfranchising those physically subjected to the river's flow, regardless of nationality, and by instituting human guardianship for the future informed by, but not replaced by, predictive technology, the Assembly can achieve a just and functional democracy. This ensures that those who bear the weight of the decision hold the power to make it, securing both justice for the downstream vulnerable and sustainability for the unborn.
