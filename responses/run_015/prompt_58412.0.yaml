  Use the following stipulated background as common ground for the humor: the lamp starts off, then is toggled on after one minute, off after an additional half minute, on after an additional quarter minute, and so on, halving the interval each time, so infinitely many toggles are stipulated to occur before the two-minute mark. The classic difficulty is that the instructions specify the state after each finite toggle but do not by themselves settle what, if anything, should be said about the state exactly at two minutes, or whether talk of completing the series even makes sense, or what the energy use and heat would be.

