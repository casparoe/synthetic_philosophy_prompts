answer: |-
  1. **The "Horn One" Charge**
  Critics argue that by grounding goodness in God's *rational nature* rather than His will, you've just smuggled in Horn One of the Euthyphro dilemma—making morality independent of God, just with extra steps. How do you respond to the claim that "rational constitution" is simply independence by another name?
  *Follow-up:* When you defend against this, are you relying on your standard move that the apparent gap between God and the Good is epistemic, not metaphysical?

  2. **Necessity of Divine Nature**
  You claim moral truths are necessary because they flow from a necessary divine nature. But if we can conceive of a being with a different nature, doesn't that suggest the moral truths contingent on that nature are also contingent?
  *Follow-up:* Is our inability to conceive of a different divine nature a metaphysical limit on reality, or just an epistemic limit on our imagination, consistent with your view on underdetermination?

  3. **Specific Prohibitions (The "Five vs. Six" Problem)**
  Let's get concrete. If moral truths are necessary outputs of divine nature, why do specific rules look contingent? Why five prohibitions in the Decalogue rather than six? Does divine nature really dictate the number?
  *Follow-up:* You typically argue this underdetermination is epistemic, not metaphysical. But at what point does an epistemic gap become indistinguishable from a metaphysical one for the believer?

  4. **The Appearance of Contingency**
  If the moral law is truly necessary, why does its historical revelation look so messy and contingent? Why does it appear to evolve or adapt if it's rooted in an unchanging nature?
  *Follow-up:* Are you asking us to treat this appearance of contingency as purely epistemic, relying on your distinction that the underdetermination is in our access, not the structure itself?

  5. **Deep Moral Disagreement (Frameworks)**
  When two people clash on a hard case—say, end-of-life ethics—are they operating in genuinely separate normative frameworks, or is there only one framework grounded in divine nature?
  *Follow-up:* If there's only one framework, does your view imply their disagreement is metaphysical (competing realities) or merely epistemic, keyed to your move that underdetermination is not metaphysical?

  6. **Deep Moral Disagreement (Error)**
  If there is only one rational structure, does that mean the person who disagrees with you is simply misreading the divine nature? Are they making a factual error about God?
  *Follow-up:* If they can't be convinced, is that because the structure is metaphysically unclear, or because their epistemic tools are degraded, consistent with your claim that underdetermination is epistemic?

  7. **Plato's Essentialism**
  You've claimed Plato's framing of the dilemma bakes in a normative essentialism that modern Divine Command theorists shouldn't accept. What exactly is that baggage, and why is it a mistake?
  *Follow-up:* When you reject Plato's framing, are you suggesting the distinction he draws between 'god' and 'good' is metaphysical, whereas your view treats it as epistemic?

  8. **Normative Essentialism**
  You reject normative essentialism, yet you say God's nature dictates the good. Doesn't "divine nature" just reintroduce essentialism under a theological label?
  *Follow-up:* If nature dictates normativity, is the link between them metaphysical, or are you relying on the move that the underdetermination of that link is epistemic, not metaphysical?

  9. **Implications for Divine Command Theory**
  What should modern Divine Command theorists take from your view? Should they abandon the "command" language entirely in favor of "constitution"?
  *Follow-up:* When they worry about arbitrariness, are they worried about a metaphysical lack of reason, or an epistemic lack of access to God's reasons, which your view addresses?

  10. **The Cost of the Middle Path**
  Every philosophical position has a cost. What's the biggest theoretical cost of holding this middle path between independence and voluntarism?
  *Follow-up:* Is that cost a metaphysical commitment you have to own, or an epistemic burden you place on the believer, consistent with your stance that underdetermination is epistemic?
