answer: |-
  Good morning. Welcome to all of you.

  Looking around this room, I see a divide that doesn't happen often. On one side, we have people who know how much labor goes into moving a single cubic meter of soil. On the other, we have people who know how much labor goes into moving a single concept. Usually, these groups meet to apologize to one another—the archaeologists for the messiness of the data, the philosophers for the impracticality of the theory.

  I don't want us to apologize this weekend. I want us to collide.

  Our theme is reconstructing beliefs and institutions from artifacts, specifically when those artifacts are missing. And I want to start by setting a constraint on what we can hope to achieve here. We are not gathered to solve the puzzle of what people believed. We are gathered to map the conditions under which those beliefs were allowed to become invisible.

  Let me give you a concrete case to anchor this.

  Imagine a Late Bronze Age settlement. You are digging through a destruction layer. The preservation conditions are excellent. You find storage jars, hundreds of them, and every single one carries an administrative seal. The bureaucracy is materially loud. It is everywhere.

  But you find zero ritual figurines. None in the houses, none in the public spaces, none in the destruction debris where clay usually survives.

  The standard inference is straightforward: this was a secular site. Or, perhaps, a site where cult practice was marginal. The archaeologist cites taphonomy; the philosopher cites underdetermination. We agree that the data is incomplete.

  But I want to suggest something more uncomfortable. What if the absence of figurines is not a failure of preservation, but a success of policy?

  What if the institution governing this settlement deliberately prohibited the materialization of ritual in durable media? What if the silence of the ground is not an accident of history, but an artifact of the very belief system we are trying to study?

  If that is the case, then preservation bias is not random noise. It is signal.

  This is why I am framing our two days around the idea that absence is not neutral data. For the archaeologists in the room: you know better than anyone that equifinality is a trap. Different processes can produce the same material result. A lack of figurines can mean a lack of belief, or it can mean a belief system that demands immateriality.

  For the philosophers: you know that theory-ladenness cuts both ways. We often worry that our theories distort what we see. But we must also worry that the ancient institutions distorted what they left behind for us to see.

  If we accept this, we have to change our goals for this workshop.

  I cannot promise you that we will leave here with a method for "reading beliefs off the remains." If the remains were designed to hide the belief, reading them directly is a category error. We cannot treat the archive as a passive victim of time. It was an active participant in the social order.

  So, what are we doing instead?

  We are investigating the architecture of the silence.

  When we look at a gap in the record, we shouldn't just ask, "How do we fill this?" We need to ask, "What kind of social machinery is required to keep this gap empty?"

  This requires the diggers to think like institutional analysts. When you see a pattern of absence, don't just reach for the taphonomic explanation. Ask if the soil is hiding something, or if the society hid it from the soil.

  And it requires the philosophers to think like materialists. Underdetermination isn't just a logical problem to be solved with better epistemology. It is a historical reality produced by human agents who made choices about what deserved to last.

  Over the next two days, I want us to resist the urge to rescue the past from its own silence. If we try to speak for the people who deliberately chose not to speak in clay, we might just drown them out again.

  Instead, let's study the choice itself. Let's treat the missing figurine not as a failure of our knowledge, but as a positive achievement of their institution.

  If we can do that, we won't necessarily know more about what they believed. But we will know much more about how their beliefs worked.

  Thank you, and let's get to work.
