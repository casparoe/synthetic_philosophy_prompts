answer: |-
  Elena works in hospital records. Over five years, across three software systems, four supervisors, and varying workload pressures, she maintains perfect accuracy and timely processing. She voluntarily assists colleagues during backlogs and never bypasses protocol, even when rushed. Colleagues describe her as exceptionally reliable; she reports acting "because accuracy matters for patient care." No single situational variable—fatigue, supervision level, or system complexity—predicts variation in her performance. Her behavior is statistically indistinguishable from that of a paradigmatically conscientious agent within the range of situations actually encountered in this ward.

  The situationist attributes the trait. Their criterion is cross-situational consistency and predictive validity within the ecology of actual situations. Elena's behavior shows high stability across varied empirical contexts (shifts, systems, supervisors). No situational variable swamps the disposition. The effect size of her "conscientiousness" on output quality is large and significant. For the situationist, a trait is a statistically robust behavioral prediction function. Elena satisfies this. She possesses a robust trait of conscientiousness.

  The virtue ethicist denies the virtue. Using Aristotelian conditions, virtue requires *phronesis* (practical wisdom): acting for the sake of the fine (*kalon*), responsive to normative reasons rather than mere rules. Elena's stability derives from rigid rule-adherence, not reason-responsiveness. In the sampled ecology, rules align with patient good, so she acts rightly. However, virtue requires stability across *normatively relevant* counterfactuals (e.g., where protocol conflicts with welfare). A disposition generated by rigid compliance fails here; *phronesis* would override the rule. Since her mechanism cannot track the *kalon* independent of the rule, she lacks virtue. She has a lookalike: bureaucratic reliability.

  The case turns on the divergence between *empirical frequency* and *normative range*. Situationist robustness is frequency-weighted across actual situations; VirtueEthicist robustness is weighted across normatively necessary situations. Remove this ambiguity: If robustness is purely frequency-weighted, Elena is virtuous (collapse to Situationist view). If robustness requires normative counterfactuals, the trait is not robust (collapse to standard Situationist critique where traits fail). The case only holds if robustness is ambiguous between these two definitions.

  Three counter-attacks arise. First, situationism addresses trait existence, not virtue status (category error). Second, robustness is defined by actual frequency, not philosophical counterfactuals (definitional stipulation). Third, the virtue ethicist lacks epistemic access to the mechanism if behavior and self-report match (empirical emptiness).

  The epistemic access objection worries most. If behavior and speech match, the virtue ethicist distinction risks being metaphysical ghosting. Reply: Virtue ethics is not empirical psychology; it is a normative anthropology. The virtue ethicist claims access via rational reconstruction of agency: a mechanism that *cannot* respond to reason (by definition of rigidity) is distinct from one that *can*, even if currently convergent. The distinction tracks modal properties of agency, not just actuals.
