answer: |-
  # Specification of Adequacy: The Careenium-Simmball Framework

  This document specifies the necessary conditions (desiderata) for any theory adjudicating the relationship between the **careenium** (the layered, reactive, non-symbolic physical substrate) and **simmballs** (discrete, combinatorial, rebindable representational entities). The goal is to define the solution space without privileging a specific metaphysical resolution.

  ## I. Causal Dynamics Desiderata
  These criteria govern how change is transmitted within the system and between levels.

  ### D1. Substrate-to-Symbol Sensitivity (Bottom-Up Integrity)
  *   **Requirement:** The theory must account for cases where careenium dynamics determine simmball stability, binding, or dissolution. A change in the substrate must be capable of corrupting or altering the symbolic level without necessarily violating symbolic rules.
  *   **Motivating Case:** *The Noise Corruption.* A careenium fluctuation (e.g., thermal noise, physical damage) causes a simmball cluster to dissociate or bind incorrectly (a "bit flip"), leading to a computational error. The symbolic logic remains valid, but the physical instantiation fails.
  *   **Status:** **Non-Negotiable.** Any theory denying that substrate states constrain symbolic states fails to account for physical implementation errors.

  ### D2. Symbol-to-Substrate Efficacy (Downward Causation)
  *   **Requirement:** The theory must specify whether simmball properties (e.g., logical validity, semantic content, combinatorial structure) can initiate or constrain careenium reconfiguration distinct from the local micro-physics of the substrate.
  *   **Motivating Case:** *The Volitional Trigger.* A high-level simmball configuration (e.g., a "decision" pattern) results in a macroscopic reorganization of the careenium (e.g., motor output) that would not have occurred given the substrate's prior trajectory alone.
  *   **Status:** **Camp-Specific.**
      *   *Realist/Functionalist:* Required. Simmballs must have genuine causal power.
      *   *Substrate Monist:* Rejected. Simmballs are descriptive epiphenomena; the careenium pushes itself.

  ### D3. Temporal Precedence and Lag
  *   **Requirement:** The theory must accommodate scenarios where substrate changes precede symbolic recognition, and vice versa. It must define the temporal grain at which "simmball time" diverges from "careenium time."
  *   **Motivating Case:** *The Unconscious Precursor.* Careenium activity shifts (e.g., neural priming) before a simmball becomes stable or "conscious." Conversely, a sustained simmball state maintains a careenium configuration against entropy for a duration longer than typical substrate decay rates.
  *   **Status:** **Non-Negotiable.** Empirical data in cognitive science and computation requires handling latency and feedback loops.

  ### D4. Emergent Stability (Attractor Dynamics)
  *   **Requirement:** The theory must explain how simmballs maintain identity over time despite careenium flux. There must be a mechanism for "dynamic stability" where the symbol persists even as the underlying substrate particles/states are replaced.
  *   **Motivating Case:** *The Ship of Theseus Computation.* A simmball remains the "same" logical entity while the specific careenium layer supporting it cycles through different reactive states, provided the relational structure is preserved.
  *   **Status:** **Non-Negotiable.** Without this, simmballs cannot function as discrete, rebindable entities.

  ---

  ## II. Ontological & Structural Desiderata
  These criteria govern the identity, dependence, and distinction between the two layers.

  ### D5. Causal Contribution vs. Constitutive Dependence
  *   **Requirement:** The theory must rigorously distinguish between a simmball *causing* a careenium change (efficient causation) and a simmball *being constituted* by a careenium state (ontological dependence).
  *   **Motivating Case:** *The Distinction Test.* If a simmball is destroyed, did the careenium cease to exist (constitution), or did the careenium merely change shape (causation)? A theory must not conflate the destruction of the pattern with the destruction of the medium.
  *   **Status:** **Non-Negotiable.** Conceptual clarity requires this distinction to avoid category errors.

  ### D6. Token vs. Type Independence
  *   **Requirement:** The theory must specify whether causal efficacy resides in the *token* simmball (this specific instance) or the *type* simmball (the abstract class). It must address whether different careenium tokens realizing the same simmball type produce identical downstream effects.
  *   **Motivating Case:** *Multiple Realizability.* Two physically distinct careenium configurations instantiate the same simmball type. Do they cause the same subsequent careenium states? If yes, how is this mediated without a universal physical law?
  *   **Status:** **Camp-Specific.**
      *   *Functionalists:* Type-level efficacy is real.
      *   *Reductive Physicalists:* Only token-level (substrate) efficacy is real; type-level is a generalization.

  ### D7. Non-Symbolic Layering
  *   **Requirement:** The theory must respect the definition of the careenium as "non-symbolic." It cannot smuggle symbolic properties into the substrate to explain symbolic outcomes. The reactivity of the careenium must be describable without reference to meaning or combinatorial logic.
  *   **Motivating Case:** *The Brute Physics.* A careenium layer operates via fluid dynamics or quantum fields that have no intrinsic "aboutness." If the theory requires the careenium to "understand" the simmballs to interact with them, it violates the framework definition.
  *   **Status:** **Non-Negotiable.** This is a definitional constraint of the provided framework.

  ---

  ## III. Physical & Formal Constraints
  These criteria ensure the theory remains consistent with established scientific and logical boundaries.

  ### D8. Conservation of Energy (Causal Closure)
  *   **Requirement:** If the careenium is physical, any interaction initiated by simmballs must ultimately respect energy conservation and the causal closure of the physical domain. No energy may enter the careenium from the "symbolic realm" ex nihilo.
  *   **Motivating Case:** *The Ghost in the Machine.* If a simmball pushes the careenium, it must do so by channeling existing careenium energy, not by injecting new energy.
  *   **Status:** **Non-Negotiable** (for physicalist interpretations). Violating this renders the theory scientifically untenable under standard physics.

  ### D9. Supervenience without Reduction
  *   **Requirement:** The theory must accommodate the intuition that there can be no difference in simmballs without a difference in the careenium (supervenience), while potentially denying that simmball facts are *reducible* to careenium facts.
  *   **Motivating Case:** *The Twin Earth.* If two careeniums are identical in all physical respects, the simmballs must be identical. However, the explanation of *why* they behave as they do may require symbolic vocabulary not present in the substrate vocabulary.
  *   **Status:** **Non-Negotiable** (for correlation), **Camp-Specific** (for reducibility).

  ### D10. Computability Bounds
  *   **Requirement:** The combinatorial operations of simmballs must remain within the bounds of what the careenium can physically compute. Simmballs cannot solve uncomputable problems unless the careenium itself supports hypercomputation.
  *   **Motivating Case:** *The Halting Problem.* A simmball configuration cannot reliably determine the halting status of arbitrary simmball processes if the careenium is Turing-equivalent.
  *   **Status:** **Non-Negotiable.** Formal consistency requirement.

  ---

  ## IV. Tensions and Joint Unsatisfiability (No-Go Zones)
  The following pairs of desiderata generate significant tension. A theory may satisfy one only by qualifying or rejecting the other. These are the primary fault lines for adjudication.

  ### T1. The Exclusion Tension (D2 vs. D8)
  *   **Conflict:** **Symbol-to-Substrate Efficacy (D2)** vs. **Conservation/Causal Closure (D8).**
  *   **Description:** If the careenium is causally closed (every physical event has a sufficient physical cause), there is no "room" for the simmball to push the careenium without overdetermining the effect. If the simmball pushes, it either violates closure or is redundant.
  *   **Unsatisfiability:** It is jointly unsatisfiable to claim:
      1.  Careenium physics is causally closed (D8).
      2.  Simmballs exert distinct, non-redundant causal force on the careenium (Strong D2).
  *   **Resolution Paths:**
      *   *Deny D2:* Simmballs are epiphenomenal (Substrate Monism).
      *   *Deny D8:* Accept non-physical causation (Dualism - generally rejected in this framework).
      *   *Reconcile:* Claim simmball causation is *realized by* substrate causation (Non-reductive Physicalism), risking the charge of redundancy.

  ### T2. The Abstraction Tension (D6 vs. D1)
  *   **Conflict:** **Token vs. Type Independence (D6)** vs. **Substrate-to-Symbol Sensitivity (D1).**
  *   **Description:** If simmball types have causal power regardless of substrate token (Multiple Realizability), then substrate noise (D1) should not affect the outcome. But if substrate noise *does* corrupt the symbol (D1), then the symbol's efficacy is dependent on the specific token implementation.
  *   **Unsatisfiability:** It is jointly unsatisfiable to claim:
      1.  Simmball types cause effects identically across all careenium substrates (Strong D6).
      2.  Specific careenium micro-states determine symbolic success/failure (Strong D1).
  *   **Resolution Paths:**
      *   *Probabilistic Efficacy:* Types constrain probabilities, tokens determine actualization.
      *   *Idealization:* D6 holds only in idealized, noise-free careeniums.

  ### T3. The Stability Tension (D4 vs. D7)
  *   **Conflict:** **Emergent Stability (D4)** vs. **Non-Symbolic Layering (D7).**
  *   **Description:** To maintain simmball stability against careenium flux, the careenium often requires "attractor" dynamics that look suspiciously like symbolic rules (e.g., error correction, homeostasis). If the careenium is truly non-symbolic, it is difficult to explain how it sustains discrete, combinatorial entities without implicitly encoding symbolic constraints in the substrate physics.
  *   **Unsatisfiability:** It is jointly unsatisfiable to claim:
      1.  Careenium dynamics are purely reactive/non-symbolic (D7).
      2.  Careenium dynamics robustly sustain discrete, logical simmballs against entropy without external tuning (Strong D4).
  *   **Resolution Paths:**
      *   *Evolutionary Tuning:* The careenium was selected *for* this capacity (external explanation).
      *   *Layered Semantics:* Lower careenium layers are non-symbolic, but higher layers acquire symbolic constraints via feedback (accepting a gradient).

  ---

  ## V. Brief Assessment of Standard Camps
  *For the purpose of locating where existing approaches typically fail or succeed within this specification.*

  1.  **Substrate Monism (Eliminativism/Reductive Physicalism)**
      *   *Performance:* Satisfies D1, D7, D8, D10 perfectly.
      *   *Failure Point:* Fails **D2 (Downward Causation)** and often struggles with **D6 (Type Independence)**. It treats simmballs as purely descriptive overlays. It resolves T1 by denying simmball efficacy.
      *   *Verdict:* Physically robust but explanatorily thin for high-level computation.

  2.  **Symbol Autonomy (Strong Functionalism/Computationalism)**
      *   *Performance:* Satisfies D2, D4, D6 perfectly.
      *   *Failure Point:* Struggles with **D1 (Noise)** and **D8 (Conservation)**. It often treats the careenium as a passive vessel, underestimating substrate constraints. It risks violating T1 (Exclusion) by positing causal powers detached from energy flow.
      *   *Verdict:* Computationally robust but physically precarious.

  3.  **Inter-Level Coupling (Non-Reductive Physicalism/Enactivism)**
      *   *Performance:* Attempts to satisfy D1, D2, D4, D8 simultaneously.
      *   *Failure Point:* High risk of incoherence regarding **T1 (Exclusion)**. Must walk a tightrope explaining how simmballs "push" without adding energy or being redundant. Often relies on vague notions of "constraint" or "information" to bridge the gap.
      *   *Verdict:* Most intuitive for cognitive phenomena, but faces the highest burden of proof regarding mechanistic consistency.

  ## VI. Adjudication Instruction
  When evaluating a specific theory against this specification:
  1.  Check if it explicitly resolves **T1 (Exclusion)**. If it ignores the energy/closure problem, it fails D8.
  2.  Check if it defines the **binding mechanism** for D4. If simmballs "float," what physically prevents them from dissolving in the careenium flux?
  3.  Check if it distinguishes **D5 (Constitution vs. Causation)**. If it conflates them, it cannot handle the Noise Corruption case (D1).
  4.  Determine if its rejection of **D2** is a feature (monism) or a bug (failed functionalism).

  This specification provides the metric for determining whether a theory offers a coherent ontology of the careenium-simmball relation or merely shifts the explanatory burden.
