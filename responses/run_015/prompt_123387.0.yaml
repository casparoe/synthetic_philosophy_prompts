answer: |-
  This is an exceptionally sharp observation. You are right to feel that "Moral Luck" (Nagel/Williams) is the neighborhood but not the house. Nagel and Williams ask whether it is *justifiable* to judge differently based on luck. You are describing something more mechanical and sociological: the *retrospective manipulation of action descriptions* to make the judgment look justified, followed by the *migration* of that judgment into unrelated domains.

  There is no single established term that captures the *combination* of the redescription mechanism, the migration, and the asymmetry. However, we can carve it precisely by separating the metaphysical move from the social move.

  ### The Carving: Two Distinct Mechanisms

  You asked whether the "relocation" (redescribing the act) and the "sideways-travel" (bleeding into other judgments) are the same phenomenon. They are not. They are distinct cognitive operations that function as a system.

  1.  **Mechanism A: Outcome-Dependent Agential Resizing.**
      This is the action-theory component. In metaphysics, we debate whether actions are fine-grained (token events) or coarse-grained (descriptions). In your departmental cases, the *ontology* of the action is being manipulated to preserve the *normativity* of the judgment.
      *   **Success:** The action is described *coarsely* to include the luck ("He made a brave gamble"). The boundary of the agency expands to swallow the fortunate outcome.
      *   **Failure:** The action is described *finely* (or alternatively) to exclude the luck ("He refused to listen to the Dean"). The boundary of the agency contracts to isolate the risky decision from the unfortunate outcome.
      *   **Function:** This protects the observer from cognitive dissonance. It maintains the illusion that our judgments track *agency* rather than *outcomes*.

  2.  **Mechanism B: Evaluative Contagion.**
      This is the social-psychological component. Once the act is resized (e.g., from "unlucky reformer" to "stubborn listener"), the trait attributed ("stubbornness") is treated as a *global character feature* rather than a *contextual behavior*.
      *   **Function:** This reduces cognitive load. It is easier to tag a colleague as "untrustworthy" globally than to maintain a ledger where they are "untrustworthy on curriculum but reliable on budgets."

  **Verdict:** They are distinct. You can have Resizing without Contagion (e.g., "He made a bad call on the reform, but I trust him on budgets"). You can have Contagion without Resizing (e.g., The Halo Effect, where I like you so I assume your papers are good, without re-describing your actions). They travel together in your examples because Resizing provides the *premise* ("He is stubborn") that makes Contagion ("He will be stubborn on the budget") seem logically valid.

  ### Nearest Established Concepts (and why they miss)

  1.  **Moral Luck (Nagel/Williams):**
      *   *Fit:* High. Deals with outcome-dependence of judgment.
      *   *Miss:* Nagel assumes the description of the act remains constant while the judgment shifts. You are observing the *description of the act shifting* to support the judgment. Nagel asks, "Is it fair to blame him?" You are asking, "How did we redefine what he *did* to make blaming him feel fair?"

  2.  **Action Individuation (Anscombe/Davidson):**
      *   *Fit:* High on the "relocation" aspect.
      *   *Miss:* This is ontological. It asks, "What *is* the action?" Your phenomenon is normative. It asks, "Which description of the action *serves our judgment*?" It is *Teleological Resizing*: the end (the outcome) determines the means (the description of the act).

  3.  **Outcome Bias / Fundamental Attribution Error:**
      *   *Fit:* High on the "sideways travel."
      *   *Miss:* These are psychological heuristics. They don't capture the *narrative work* being done. Your colleagues aren't just ignoring the process; they are actively rewriting the history of the agency to make the outcome look inevitable.

  4.  **Hindsight Bias:**
      *   *Fit:* Medium.
      *   *Miss:* Hindsight bias is "I knew it would happen." Your phenomenon is "He *made* it happen (by being stubborn/brave)." It attributes *more* agency in the failure case, not less.

  ### The Asymmetry: Why Negative Sticks and Positive Collapses

  You noted the unflattering version survives debunking, while the flattering version collapses when luck is pointed out. This is essential to the phenomenon, not accidental.

  *   **Risk-Averse Epistemology of Character:** In a professional environment, "competence" is treated as a baseline expectation, while "incompetence" is a discovered threat.
  *   **Vice as Essence, Virtue as Contingency:** When someone succeeds via luck, we label it "bravery." But "bravery" is only virtuous if it works. If it stops working, it is reclassified as "recklessness." The positive label is provisional on continued success.
  *   **Vice is Sticky:** When someone fails, we label it "stubbornness." Even if they succeed later, the "stubbornness" remains a latent trait ("He got lucky this time, but he's still reckless"). Negative traits are treated as *revealed truths*; positive traits are treated as *unfalsified hypotheses*.

  ### Edge Cases

  **1. When is Resizing Legitimate?**
  It is legitimate when the outcome *reveals hidden information* about the agency that was present at the time but unknowable.
  *   *Case:* Two drivers run a red light. One hits a child; one does not.
  *   *Legitimate Resizing:* If an investigation reveals the first driver was texting, the redescription ("reckless driver" vs. "distracted driver") is valid. The outcome triggered an investigation that revealed a prior agential defect.
  *   *Illegitimate Resizing:* If both were equally distracted, but we only call the one who hit the child "reckless," that is the phenomenon you described.
  *   *Test:* Would the agent have accepted the description *ex ante*? If the "stubborn" colleague would have said, "Yes, I am refusing to listen," the description is valid. If they would have said, "I am listening, I just disagree," and the "refusal" is only applied because they lost, it is illegitimate.

  **2. When is the Pattern Absent?**
  In **High-Reliability Organizations (HROs)** like aviation safety or surgical morbidity reviews.
  *   *Case:* A pilot makes a near-identical error to a colleague. One lands safely; one crashes.
  *   *Absence:* In a "Just Culture," the investigation focuses on the *process*, not the outcome. The judgment does not migrate. The pilot who crashed is not deemed "untrustworthy" globally; the system is fixed.
  *   *Why:* The cost of Evaluative Contagion is too high. You cannot afford to lose a good pilot because of bad luck. Your department, unfortunately, has low enough stakes that it can afford the inefficiency of bad hiring/budgeting judgments based on curricular luck.

  ### The Term

  Since no existing term captures the *redescription* + *migration* + *asymmetry* complex, I propose you coin:

  **Agential Gerrymandering**

  **Definition:** The retrospective manipulation of the boundaries of an agent's action (fine- vs. coarse-grained description) to align with the moral or professional valuation of the outcome, typically followed by the generalization of that valuation to unrelated domains of competence.

  **Why this term works for your Monday meeting:**
  1.  **Gerrymandering** implies drawing boundary lines to ensure a specific electoral result. Here, the "district lines" are the boundaries of the action (e.g., "Was the act *taking the risk* or *ignoring the Dean*?"), and the "result" is the judgment (Competent vs. Incompetent).
  2.  It captures the *political* nature of the departmental context without implying malicious intent (gerrymandering is often systemic).
  3.  It distinguishes itself from "Moral Luck." Moral Luck says, "We judged him differently." Agential Gerrymandering says, "We changed what he *did* so we wouldn't have to admit we judged him differently."

  **How to use it:**
  *"I think we're engaging in **Agential Gerrymandering**. We're drawing the boundaries of Sarah's action differently than John's solely because her enrollment numbers were better. If we accept that they took the same risk, we can't let the judgment on the curriculum reform bleed into the budget committee assessment."*

  ### Summary of the Carving

  *   **Is it one phenomenon?** No. It is **Agential Resizing** (epistemic/narrative) enabling **Evaluative Contagion** (social/normative).
  *   **Is the asymmetry essential?** Yes. It stems from a risk-averse epistemology where vice is a discovery and virtue is a provisional hypothesis.
  *   **Does it fit Moral Luck?** No. Moral Luck accepts the act description and questions the judgment. This phenomenon changes the act description to protect the judgment.
  *   **The Term:** **Agential Gerrymandering**.

  You are seeing the social machinery that keeps Moral Luck hidden. We don't admit we judge by luck; we rewrite the history of the agency so it looks like we judged by character.
