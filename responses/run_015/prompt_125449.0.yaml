answer: |-
  # Q&A PREP SHEET: Elastic Sphexishness
  **Time to Seminar:** 20 Mins
  **Goal:** Survive the cross-examination without collapsing into hard determinism or bad biology.

  ## ⚠️ STRATEGIC ANCHORS

  **HOLD FIRM ON THIS:**
  Freedom is not a *metaphysical status* (uncaused cause); it is a *functional capacity* for mode-switching. Do not let them drag you into "could you have done otherwise in the exact same universe?" You are arguing for **architectural flexibility**, not metaphysical openness. If you defend the *value* of the calibration, you win, even if the *source* of the calibration is determined.

  **THE "PRAYER QUESTION" (The Collapse Risk):**
  *"Is the mechanism that calibrates the switch between sphexish and elastic modes itself sphexish?"*
  *   **Why it kills you:** If yes, you have an infinite regress (who calibrates the calibrator?). If no, you've smuggled in a homunculus (a "little man" inside who is truly free).
  *   **The Save:** Admit the regress but deny it's vicious. The calibration is a **learned meta-habit**. It's sphexish all the way down, *but* the "depth" of the stack allows for sufficient complexity to count as agency. Don't claim the buck stops; claim the buck bounces high enough to matter.

  ---

  ## THE 8 OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Regress Objection (The "Prayer Question")
  *   **Who:** The Sharp Compatibilist (likely the seminar leader).
  *   **The Question:** "You say freedom is the ability to switch out of rigid habits. But isn't the rule for *when* to switch just another rigid habit? If your 'elasticity' is just a deeper layer of determinism, haven't you just pushed the homunculus back one step?"
  *   **2-Min Reply:** "I concede the calibration mechanism is itself a habit—a 'meta-habit.' But this isn't a vicious regress; it's a stack. A single-layer system (the wasp) crashes on novelty. A multi-layer system (humans) can override layer 1 with layer 2. Freedom isn't the absence of the stack; it's the *height* and *connectivity* of the stack. We don't need an uncaused calibrator; we need a system complex enough to model its own rigidity."
  *   **Soft Spot:** They will press on where the "modeling" comes from. If that's determined, are you really different from a sophisticated chatbot?
  *   **Concession:** Concede that this doesn't solve *ultimate* responsibility. You are solving *functional* agency.

  ### 2. The "Old Wine" Objection (Redescription)
  *   **Who:** Standard Compatibilist.
  *   **The Question:** "This sounds exactly like standard reasons-responsiveness. You're just using 'sphexishness' as a synonym for 'insensitive to reasons' and 'elasticity' for 'sensitive.' Why do we need the wasp analogy?"
  *   **2-Min Reply:** "Reasons-responsiveness is often treated as a binary switch. The wasp analogy highlights the *energy cost* of responsiveness. Hofstadter's point was that rigidity is efficient. My view adds that we *should* be rigid 90% of the time. Standard compatibilism implies we should always be reasons-responsive. I'm arguing that being *too* responsive (chaotic flexibility) is also a failure of agency. It's not just responsiveness; it's resource allocation."
  *   **Soft Spot:** They might argue reasons-responsiveness already accounts for "capacity."
  *   **Concession:** Concede the overlap. Frame your view as a *refinement* of compatibilism, not a rival.

  ### 3. The Ethological Error (Bad Biology)
  *   **Who:** The Insect Cognition Visitor.
  *   **The Question:** "Your whole premise rests on the digger wasp being a mindless robot. Contemporary ethology shows wasps *do* adapt to novel obstacles. If your paradigm case of 'unfree' is actually flexible, doesn't your distinction collapse?"
  *   **2-Min Reply:** "You're right that Hofstadter's 1979 data is dated. Wasps have more flexibility than we thought. But the *gradient* remains. A wasp's flexibility is narrow-band; human flexibility is open-ended. I'm not claiming wasps are rocks; I'm claiming they represent the *lower bound* of the elasticity spectrum. The analogy holds as a limit case, even if the biology is messier."
  *   **Soft Spot:** If they have data showing wasps do high-level analogical reasoning, your "lower bound" looks arbitrary.
  *   **Concession:** **Concede upfront.** Acknowledge the 1979 science is outdated. Say you are using "Sphex" as a philosophical placeholder for "low-bandwidth heuristic," not a literal biological claim.

  ### 4. The Normative Stakes Problem
  *   **Who:** Any Ethicist/Compatibilist.
  *   **The Question:** "You say we need rigidity for 'low-stakes' and flexibility for 'high-stakes.' Who decides what counts as high-stakes? If a racist is 'calibrated' to be rigid about race, is that free will on your view?"
  *   **2-Min Reply:** "Calibration is about *accuracy*, not just moral value. The racist is miscalibrated because their heuristic fails to track reality (people are not defined by race). However, I grant this is the weak point. 'Stakes' are subjective. My defense is that a well-calibrated agent has a feedback loop that updates what they consider 'high stakes' based on social friction. The racist lacks elasticity *about* their stakes, which is a second-order failure."
  *   **Soft Spot:** Distinguishing "miscalibrated" from "evil" is hard without smuggling in external norms.
  *   **Concession:** Admit your theory describes *agency capacity*, not *moral goodness*. A calibrated villain is still free, just bad.

  ### 5. The Dual-Process Oversimplification
  *   **Who:** Cog Psych Person #1.
  *   **The Question:** "You're treating System 1 (habit) and System 2 (flexible) as distinct modes we switch between. Cognitive science shows they're deeply integrated and running in parallel. You can't 'turn off' the sphexish part."
  *   **2-Min Reply:** "I agree they run in parallel. 'Switching' isn't turning one off; it's changing the *gain* or weighting. Elastic Sphexishness is about inhibitory control—allowing System 2 to veto System 1. When I say 'mode,' I mean the dominant driver of action, not the exclusive active process."
  *   **Soft Spot:** If they cite specific neural pathways that don't allow for top-down veto, you're in trouble.
  *   **Concession:** Adjust terminology. Stop saying "switch" and start saying "weighting adjustment."

  ### 6. The "Automaticity is Agency" Objection
  *   **Who:** Cog Psych Person #2.
  *   **The Question:** "Expertise looks like sphexishness. A pianist playing fluently isn't deliberating. Are you saying the pianist is less free than the novice stumbling through notes?"
  *   **2-Min Reply:** "Excellent point. This is why I call it *Elastic* Sphexishness. The pianist has *chosen* the rigidity through prior practice. They can stop if the hall catches fire. The 'sphex' is a tool they own, not a master they serve. Unfreedom is when you *cannot* interrupt the flow when context demands it."
  *   **Soft Spot:** Distinguishing "owned rigidity" from "compulsive rigidity" can be blurry in the moment.
  *   **Concession:** Concede that high-level skill *looks* unfree from the outside. The test is interruptibility.

  ### 7. The Mitigation/Responsibility Trap
  *   **Who:** Compatibilist focused on blame.
  *   **The Question:** "If someone is miscalibrated because of childhood trauma (they can't switch out of defense modes), are they responsible? Your view makes unfreedom a medical diagnosis."
  *   **2-Min Reply:** "It does medicalize it slightly, and I think that's correct. We treat addiction as a loss of elasticity. I'm arguing we should treat some moral failures similarly. However, responsibility attaches to the *history* of calibration. Did they neglect maintaining their elasticity? If the calibration is broken through no fault of their own, blame is inappropriate, but containment might still be necessary."
  *   **Soft Spot:** This sounds like you're dissolving responsibility entirely for many agents.
  *   **Concession:** Hold the line here. This is a feature, not a bug. Your view *should* reduce blame for structural miscalibration.

  ### 8. The Terminology Nitpick
  *   **Who:** Anyone running out of time.
  *   **The Question:** "Why call it 'Free Will' at all? Why not just 'Cognitive Flexibility'? You're inviting metaphysical confusion."
  *   **2-Min Reply:** "Because 'Cognitive Flexibility' is a capacity, like having good vision. 'Free Will' is the *exercise* of that capacity in action. I want to reclaim the term from the libertarians who think it requires magic. I'm offering a naturalistic free will worth wanting."
  *   **Soft Spot:** None really.
  *   **Concession:** None. This is your branding.

  ---

  ## TACTICAL ADVICE FOR THE ROOM

  1.  **If the Insect Researcher speaks first:** Listen closely. If they dismantle the wasp analogy completely, **pivot immediately**. Say: "Then let's treat Sphex as a thought experiment for 'minimal agency' rather than a biological claim." Do not fight them on entomology; you will lose.
  2.  **If the Compatibilists gang up:** They will try to absorb you. "This is just Frankfurt." "This is just Fischer." **Resist absorption.** Keep emphasizing the *cost* of flexibility. That is your unique contribution. Standard compatibilism ignores the energy budget of agency.
  3.  **Watch your hands:** When explaining the "switch," don't make it sound like a light switch (binary). Use a dimmer switch gesture.
  4.  **The "Determinism" Trap:** If asked "Is this compatible with determinism?" say **"Yes, explicitly."** Do not hedge. If you hedge, the compatibilists will smell libertarianism and attack. If you say yes, the libertarians (if any) will attack, but they aren't in the room. Play to the room.

  **Good luck. You're arguing that freedom is a skill, not a gift. Stick to that.**
