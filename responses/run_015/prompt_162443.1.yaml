      *   (8) **Paradigm Cases (Human/Inst):** Hospital waits, exam rates, police reclassification. Same phenomenon, slower/dumber.

  3.  **Brainstorming Tensions & Connections (Internal Monologue/Drafting):**

      *   *Tension A: (1) vs. (6).* (1) says it's *not* about agency/intentions, dumb hill-climbers do it. (6) says adversarial Goodhart is *categorically* different because the system represents the measurement.
          *   *Severity:* High. (1) tries to unify everything under statistics. (6) carves out a special ontological category for agency/representation. If (6) is true, is (1) false? Or does (1) only apply to non-adversarial? (1) says "core mechanism... rather than agential." (6) says "adversarial... is categorically different." This looks like a direct conflict.
