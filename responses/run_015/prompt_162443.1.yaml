  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Refining Tension 1:* (1) says "core mechanism is statistical... not agential." (6) says "adversarial... is categorically different." If Adversarial is a subset of Goodhart, and Adversarial is agential, then the *core* mechanism of *that subset* is agential. So (1) is an overgeneralization. It should be "The core mechanism of *non-adversarial* Goodhart is statistical."
      *   *Refining Tension 2:* (3) says pressure is the master variable. (4) says learned proxies mitigate. If pressure is master, mitigation should be about reducing pressure. But (4) suggests changing the *proxy* helps even under pressure. This implies proxy quality matters more than (3) admits.
      *   *Refining Tension 3:* (5) wants gameability to be a property of the *proxy* (like a confidence interval). But gameability is relational (Proxy + Optimizer + Environment). A lock isn't "pickable" intrinsically; it's pickable relative to a skill level. This is a category error.
