          *   *Severity:* Medium. Are the hospital/police cases adversarial? Usually, yes (humans gaming the system). Are the boat/robot cases adversarial? Usually no (dumb agents finding loopholes). If (6) says adversarial is *categorically* different, but (7)/(8) say they are the *same phenomenon*, there's a taxonomy clash.
      *   *Tension E: (2) vs. (6).* (2) collapses Regressional/Extremal/Causal into one statistical phenomenon. (6) isolates Adversarial. This seems consistent *unless* the "Causal" case involves agency. But (2) says only Adversarial is distinct. This seems okay, but needs checking against (1).
      *   *Tension F: (4) vs. (1).* (1) says it's statistical/distributional. (4) says learned proxies track "considerations nobody would have thought to write down." This implies semantic/content richness matters, not just statistical fit.
