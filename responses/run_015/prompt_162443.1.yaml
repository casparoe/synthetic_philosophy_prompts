          *   *Severity:* Medium-High. If optimization pressure is the *master* variable, why does the *type* of proxy (learned vs. hand-written) matter enough to call it a "genuine mitigation"? (4) implies the proxy quality matters significantly, potentially overriding (3)'s claim that pressure is the *main* driver. Also, RLHF *is* optimizing hard against a learned proxy. Does (4) contradict the suspicion in (3)?
      *   *Tension C: (5) vs. (1)/(2).* (5) wants to measure gameability as a stable property of the *proxy* (like a confidence interval). (1) & (2) say the breakdown depends on distributional shift/optimization pressure.
          *   *Severity:* Medium. Can gameability be intrinsic to the proxy if the breakdown depends on the *interaction* with the optimizer and the environment's distribution? A confidence interval is statistical, but "gameability threshold" sounds like it depends on the optimizer's capabilities. If the optimizer changes, does the threshold change? If yes, it's not a property of the proxy alone.
