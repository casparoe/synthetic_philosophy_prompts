  6.  **Final Polish:** Check tone (American English, professional philosopher persona, rigorous but conversational). Ensure all constraints of the prompt are met (ranked tensions, give up/cost, single revision, case verdict check).

      *   *Wait, one nuance on (2):* The user collapses Regressional, Extremal, Causal. This is a known move (Zhuang et al. do something similar). But Causal often implies intervention. If I intervene on a proxy, does it break? Yes. Is that statistical? Yes (d-separation). Okay, (2) is defensible.
