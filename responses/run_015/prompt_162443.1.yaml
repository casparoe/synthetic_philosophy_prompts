      *   (4) **Learned Proxies:** Reward models (RLHF style) are genuine mitigations, not just more proxies. Richer, track unwritten considerations, break less.
      *   (5) **Methodology:** Unit of analysis = Proxy. Define "gameability threshold" (optimization pressure before decoupling). Treat as stable, pre-measurable property (like CI).
      *   (6) **Adversarial Goodhart:** Categorically different/scarer. System represents measurement and routes around it. Capable optimizers = special risk.
