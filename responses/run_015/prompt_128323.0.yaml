  # The Morning Scroll Taxonomy

  **Node 1 (Start):** When you open the app, does the pull feel like **a mirror of your past clicks** or **a stranger's hand** pushing you?
  *   *Go to Node 2 if Mirror.*
  *   *Go to Node 3 if Stranger.*

  **Node 2 (Mirror Branch):** If you saw the exact code that picked your video, would you admit **you are still the one choosing to watch?**
  *   *Yes → Leaf 1*
  *   *No → Leaf 2*

  **Node 3 (Stranger Branch):** If you saw the exact code that picked your video, would you feel **able to close the app?**
  *   *Yes → Leaf 3*
  *   *No → Leaf 4*

  ***

  **Leaf 1: Pure Sartrean Freedom**
  It's your history, but you own the next click. The algorithm is just a pile of your old choices. You are fully responsible, even here.

  **Leaf 2: Bad Faith 2.0**
  It's your history, but you pretend it's a trap. You know the transparency is there, but you hide from yourself that the menu is co-written by you.

  **Leaf 3: Soft Determinism**
  It's a heavy external force, but not total. The curation is real weight (facticity), but knowing the trick gives you enough leverage to resist.

  **Leaf 4: Radical Unfreedom**
  It's a heavy external force that crushes will. Prediction collapses you into an object. You aren't choosing; you're being processed.

  ***

  ### ⚠️ Glitch Report (Empty Combos)
  *   **The "Victim of Self" Error:** Claiming the feed is your *past self* (Node 2) but also claiming *Radical Unfreedom* (Leaf 4). **Incoherent.** You cannot be enslaved by your own past choices unless you pretend you didn't make them (which loops back to Bad Faith).
  *   **The "Magic Knowledge" Error:** Claiming the feed is a *stranger* (Node 3) but that knowing the code *automatically* frees you without effort. **Ugly.** Knowledge isn't a key; it's just a map. You still have to walk.
  *   **The "Ghost in the Machine" Slot:** A position where the algorithm is *neither* you nor a stranger, but a third party entity. **Unexplored.** Currently no leaf here; most people force it into one of the two branches.
