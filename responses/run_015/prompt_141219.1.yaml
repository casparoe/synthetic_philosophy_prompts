prompt: |-
  i co-write a dramatized history podcast — real people, real events, invented dialogue — and we ship every two weeks, so these calls come up constantly and there's never more than a day or two for one, sometimes it's a rewrite at midnight in the edit. legal reads our scripts but they only care about living people and music clearance; once somebody's dead nobody's watching at all. it's got personal recently: my great-aunt ran a home for unmarried mothers in Cork in the 1950s, she left basically nothing behind — no diary, no letters, two signatures on documents — and I'm the one pushing to build a season around her while two cousins think it's a betrayal. so I need something I can read out loud to them, not just my gut.

  what I want is a decision procedure, not an essay. the question in the room is always some version of "can we put this in her mouth" or "can we show this happening", and I want ordered questions, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands off to a person because the question is values rather than facts. ground it in whatever philosophy actually knows about what we owe people who are dead and can't be harmed in the ordinary sense — but no bibliographies, and don't build it on the law, the law is silent here.

  it has to handle scenes where the record is documented, silent, contested, or known to be otherwise, and it has to handle the four devices we definately lean on: compressed chronology, composite minor characters, "borrowed lines" (giving her a real line somebody else actually said, because it's better), and "silent scenes" (she's in the room, the record says nothing, we write what we think happened). we already tag every scene in the script with a certainty level 1–4; tell me whether that tag is doing any real work or just making us feel better.

  distinctions I don't want it to collapse: wronging her versus misrepresenting her; what's owed to her versus to my cousins versus to listeners who'll take the season as history; getting her actions wrong versus getting her character wrong; "could have happened" versus "probably happened" versus "what she'd want said". and I want it to be able to say: don't dramatize this one at all.

  it has to be runnable by a writers' assistant in under an hour, with no theory jargon in the checklist itself (a glossary is fine), and it should say which answers need my sign-off and which need the family's.

  then run it on three: the finale where we give her a speech assembled out of someone else's testimony; the scene of her signing a document we know she signed but not why, with invented voiceover of her thinking; and the cold open of our first season, allready aired and publicly defended by me, that I'm now worried was indefensible. I'd rather be told that last one's wrong than right. and tell me where the procedure will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** Co-writer of a dramatized history podcast (real people/events, invented dialogue). Bi-weekly schedule, tight deadlines. Legal only cares about living people/music.
      *   **Specific Conflict:** The user wants to build a season around their great-aunt (ran a home for unmarried mothers in 1950s Cork). She left almost no record. Two cousins think it's a betrayal.
      *   **Goal:** A *decision procedure* (checklist/flowchart style), not an essay. Something readable aloud to the cousins.
      *   **Constraints:**
          *   Grounded in philosophy of obligations to the dead (no harm, but dignity/truth), but no jargon/bibliographies in the checklist.
          *   Not based on law (law is silent on the dead).
          *   Must handle four specific record states: Documented, Silent, Contested, Known False.
          *   Must handle four specific devices: Compressed Chronology, Composite Characters, Borrowed Lines, Silent Scenes.
          *   Must evaluate the existing "Certainty Level 1-4" tagging system.
          *   Must distinguish: Wronging vs. Misrepresenting, Obligations to Her vs. Cousins vs. Listeners, Actions vs. Character, Possibility vs. Probability vs. Desire.
          *   Must allow for a "Do Not Dramatize" outcome.
          *   Runnable by an assistant in <1 hour.
          *   Must specify sign-off levels (Writer vs. Family).
          *   Must run the procedure on three specific test cases (Finale speech, Signing scene voiceover, Aired Cold Open).
          *   Must identify where the procedure itself might misfire.

  2.  **Philosophical Grounding (Internal Logic):**

      *   *Obligations to the Dead:* They can't be harmed (no pain), but they can be *wronged* (violation of ante-mortem wishes, distortion of legacy, instrumentalization). Key concept: *Narrative Integrity* and *Respect for Agency*.
      *   *Obligations to the Living (Family):* Grief, privacy, reputation, shared memory.
      *   *Obligations to the Audience:* Truth-in-advertising (it's "dramatized," but listeners often blur the line), historical understanding.
      *   *The "Betrayal" Aspect:* Is the aunt being used as a prop for a narrative she wouldn't recognize?
      *   *Epistemic Humility:* Acknowledging what we don't know.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Structure:* Needs to be step-by-step, binary (Yes/No/Handoff), and clear.
      *   *Tone:* Professional, ethical, firm but empathetic.
      *   *Step 1: The Harm Check (Living).* Legal/Living privacy. (Fast fail).
      *   *Step 2: The Record State.* What do we actually know?
      *   *Step 3: The Device Check.* What trick are we using?
      *   *Step 4: The Character vs. Action Check.* Are we changing *what* she did or *who* she was?
      *   *Step 5: The "Do Not Dramatize" Gate.* Is this too sensitive/unknown?
      *   *Step 6: Sign-off.* Who decides?

      *Refining the "Certainty Tag":* The prompt asks if 1-4 is doing work. Usually, these tags are cosmetic. The procedure needs to make them matter. If a tag is low (3 or 4), certain devices should be banned.

      *Refining the "Borrowed Lines":* This is tricky. Giving her someone else's words. Needs a high bar for thematic resonance vs. factual falsity.

      *Refining the "Silent Scenes":* High risk of projection. Needs to align with known character traits, not plot convenience.

  4.  **Developing the Test Cases:**

      *   *Case 1: Finale Speech (Borrowed Lines).* She gets a speech made of someone else's testimony.
      *   *Case 2: Signing Document (Silent Scene + Voiceover).* We know she signed, not why. Invented internal monologue.
      *   *Case 3: Aired Cold Open.* Already out. User is worried it was indefensible. (Need to be honest here).

  5.  **Addressing the "Misfire" Section:**

      *   Where does logic fail? Emotions, unconscious bias, the "Story God" complex (needing a good ending over a true one).

  6.  **Writing - Section by Section:**

      *   *Introduction:* Acknowledge the stakes.
      *   *The Protocol:* The core checklist.
      *   *The Glossary:* Define terms without jargon.
      *   *The Test Runs:* Apply the protocol.
      *   *The Meta-Analysis:* Where the protocol breaks.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like a lawyer. The prompt says "law is silent." Focus on *ethics* and *trust*.
      *(Self-Correction on Sign-off)*: The cousins are hostile. Giving them veto power might kill the project. Giving them *consultation* power on specific high-risk items is better. The "Family Sign-off" needs to be limited to specific "Red Zone" items.
      *(Self-Correction on the Cold Open)*: The user wants to be told if it's wrong. I have to be brave enough to say "This might be a violation" based on the procedure, even if I don't know the content. I will frame it as "If it fails X, it is wrong."

      *Philosophical Anchor:* The "Right to Narrative Self-Determination" (even posthumous) vs. "Public Interest/History." Since she left no diary, we lean on "Best Interest of the Memory" vs. "Instrumentalization."

      *The "Certainty Tag" Critique:* I need to explicitly state that tags are useless unless tied to *permissions*. Tag 4 cannot allow Borrowed Lines, for example.

  7.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   No essay? Yes.
      *   No bibliography? Yes.
      *   Handles 4 record states? Yes.
      *   Handles 4 devices? Yes.
      *   Evaluates Tags 1-4? Yes.
      *   Distinguishes Wronging/Misrepresenting? Yes.
      *   Runnable in 1 hour? Yes (checklist format).
      *   Sign-off levels? Yes.
      *   Test cases run? Yes.
      *   Misfire analysis? Yes.

  8.  **Final Polish:** Ensure the tone is appropriate for reading aloud to estranged family. It needs to be respectful but firm on the craft. (Actually, the prompt says "read out loud to them" regarding the *procedure*, implying the procedure itself is the peace offering/negotiation framework).

      *Wait, one nuance:* "read out loud to them" refers to the *procedure* as a way to mediate the conflict. So the language must be accessible to the cousins too, not just the writers. It needs to sound like a safeguard for *her*, not just a creative tool.

      *Let's build the "Red Zone".* Specific topics that automatically trigger family consultation. Running a home for unmarried mothers in 1950s Cork is *highly* sensitive (Magdalene Laundries context). This almost certainly triggers the "Family/Community Consultation" clause regarding stigma.

      *Okay, ready to write.*
answer: |-
  # The Posthumous Integrity Protocol (PIP)

  **Purpose:** To determine whether a specific dramatized element respects the dead subject, the living family, and the audience.
  **Time Required:** 45–60 minutes per scene/sequence.
  **Operator:** Writers' Assistant or Lead Writer.
  **Authority:** This protocol overrides creative convenience. If a scene fails the PIP, it is cut or reworked, regardless of schedule.

  ---

  ## Part 1: The Checklist

  ### Section A: The Living & Legal (Hard Stop)
  *If any answer is YES, stop. Consult Legal. Do not proceed to Section B.*
  1. Does this depict a living person in a defamatory or private light?
  2. Does this use copyrighted material (letters, songs, recordings) without clearance?
  3. Does this reveal private medical or legal records of living descendants?

  ### Section B: The Record State
  *Select the one that matches the historical evidence for this specific moment.*
  *   **[DOC] Documented:** We have letters, transcripts, or contemporary accounts of this exact event.
  *   **[SIL] Silent:** We know the event happened (e.g., she signed a document), but the record says nothing about *how* or *why*.
  *   **[CON] Contested:** Sources disagree on what happened or her role in it.
  *   **[FALSE] Known Otherwise:** The record indicates something different, but we are changing it for narrative flow.

  ### Section C: The Device & The Tag
  *Match your intended device against your Certainty Tag (1 = Verified, 4 = Speculative).*

  | If Tag is... | Compressed Time | Composite Characters | Borrowed Lines | Silent Scenes (Inner Life) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1 (Verified)** | Allowed | Allowed | Allowed | Allowed |
  | **2 (Likely)** | Allowed | Allowed | **Restricted*** | **Restricted*** |
  | **3 (Possible)** | **Restricted*** | **Restricted*** | **Banned** | **Banned** |
  | **4 (Speculative)**| **Banned** | **Banned** | **Banned** | **Banned** |

  *\*Restricted = Permitted only if it serves the *Subject's* known character, not the Plot's needs.*

  **Check:** Does your current Tag match the device you want to use?
  *   **NO:** Downgrade the Tag or Change the Device.
  *   **YES:** Proceed to Section D.

  *(Note on Tags: Your current 1–4 tags are cosmetic unless tied to these bans. A Tag 4 scene cannot contain invented dialogue attributed to her. If it does, the tag is a lie.)*

  ### Section D: The Integrity Gates
  *Answer aloud. If you hesitate, mark "Handoff."*

  **Gate 1: Action vs. Character**
  *   Are we changing *what she did* (Action) or *why she did it* (Character)?
  *   Changing Action requires [DOC] or [CON].
  *   Changing Character is **Banned** unless [CON] supports the new interpretation.
  *   *Pass:* We are keeping her known actions, inferring motive from consistent traits.
  *   *Fail:* We are making her do something she wouldn't do to fix the plot.

  **Gate 2: Instrumentalization**
  *   Is this scene here to reveal *her*, or to make the *listener* feel a specific way (shock, pity, triumph)?
  *   *Pass:* The scene illuminates her agency or constraints.
  *   *Fail:* The scene turns her into a prop for audience emotion (e.g., a death scene played for tears without historical basis).

  **Gate 3: The "Borrowed Line" Test**
  *   If using someone else's words in her mouth:
      1. Did the original speaker face a similar context/constraint?
      2. Is the sentiment consistent with her known writings/speeches?
      3. **Crucial:** Are we crediting the borrowing in the show notes/end credits?
  *   *Fail:* If the line makes her sound wiser, braver, or more villainous than the evidence allows.

  **Gate 4: The Stigma Check (Specific to Sensitive Topics)**
  *   Does this scene involve sexuality, illegitimacy, mental health, or criminality?
  *   **YES:** This triggers **Family Sign-Off** (see Part 3), regardless of Tag.
  *   **NO:** Proceed to Gate 5.

  **Gate 5: The "Do Not Dramatize" Clause**
  *   If the Record is [SIL] or [FALSE], and the event is pivotal to her legacy:
  *   Can we tell this part of the story *without* showing it? (e.g., narration, montage, third-party observation).
  *   *Yes:* Do that instead.
  *   *No:* Proceed to Sign-Off.

  ---

  ## Part 2: Sign-Off Authority

  **Writer Sign-Off Only:**
  *   Tags 1 & 2.
  *   Devices: Compressed Time, Composite Minor Characters (non-family).
  *   Record State: [DOC].

  **Lead Writer (You) Sign-Off:**
  *   Tags 3.
  *   Devices: Borrowed Lines, Silent Scenes (Inner Life).
  *   Record State: [CON].

  **Family Consultation Required:**
  *   Tags 4.
  *   Record State: [SIL] regarding pivotal life choices.
  *   **Any scene triggering Gate 4 (Stigma Check).**
  *   **Any scene where the "Do Not Dramatize" clause was invoked but overruled.**

  *Note on Family Consultation: This is not a veto on the project. It is a veto on specific depictions that violate shared memory or dignity. If Family objects, the scene must be shifted to Third-Party Observation or Narration.*

  ---

  ## Part 3: Glossary (For Reading Aloud)

  *   **Wronging Her:** Treating her as a tool for our story rather than a person with her own history. (e.g., making her say something profound she never would have said).
  *   **Misrepresenting Her:** Getting the facts wrong. (e.g., saying she was in Cork when she was in Dublin).
  *   **Borrowed Lines:** Giving her words spoken by a real contemporary, used only when her own voice is lost but the sentiment is historically accurate to her view.
  *   **Silent Scenes:** Dramatizing a moment where she was present but the record is quiet. We must not invent *motives*, only *actions* consistent with known behavior.
  *   **Third-Party Observation:** Showing the *effect* of her action through someone else's eyes, rather than dramatizing her internal choice.

  ---

  ## Part 4: Test Runs

  Here is the protocol applied to your three specific scenarios.

  ### Case 1: The Finale Speech (Borrowed Lines)
  *   **Scenario:** She gives a speech assembled from another person's testimony.
  *   **Record State:** [SIL] (She likely didn't give this specific speech, or no transcript exists).
  *   **Device:** Borrowed Lines.
  *   **Tag:** Likely 3 or 4 (Speculative).
  *   **Protocol Run:**
      *   Section C: Tag 3/4 bans Borrowed Lines unless Restricted.
      *   Gate 3 (Borrowed Line Test): Did the original speaker face similar constraints? (If yes, Pass). Is it credited? (If yes, Pass).
      *   Gate 2 (Instrumentalization): Is this speech making her the "hero" of the season artificially?
      *   Gate 4 (Stigma): Unmarried mothers context = **YES**.
  *   **Verdict:** **Family Consultation Required.**
  *   **Reasoning:** Even if the words are historically accurate to the *era*, putting them in her mouth at the climax defines her legacy. Because this touches on the stigma of the mothers (Gate 4), the cousins have a right to review whether this attribution feels like a eulogy or a fabrication.
  *   **Fix:** If family objects, shift to Narration: *"We don't know what she said, but the records show she argued for X, echoing the sentiments of..."*

  ### Case 2: The Signing Scene (Silent Scene + Voiceover)
  *   **Scenario:** She signs a document we know she signed. Invented voiceover of her thinking.
  *   **Record State:** [SIL] (We know the signature, not the thought).
  *   **Device:** Silent Scene + Inner Monologue.
  *   **Tag:** 3 (Possible she signed it, Speculative on thought).
  *   **Protocol Run:**
      *   Section C: Tag 3 **Bans** Silent Scenes (Inner Life).
      *   Gate 1 (Action vs Character): Action is verified. Character (thought process) is invented.
      *   Gate 5 (Do Not Dramatize): Can we show the hand signing, but hear a narrator explain the context? Yes.
  *   **Verdict:** **FAIL.** (As written).
  *   **Reasoning:** You cannot invent internal monologue on a Tag 3/4 Silent Scene. It collapses "Probably Happened" into "What She'd Want Said."
  *   **Fix:** Remove the voiceover. Show the hand. Use a narrator or a letter from a colleague to explain the *implication* of the signature. Do not inhabit her head.

  ### Case 3: The Aired Cold Open (Retrospective)
  *   **Scenario:** Already aired. You are worried it was indefensible.
  *   **Protocol Run:** (Hypothetical reconstruction based on your worry).
  *   **Assumption:** It likely used a Tag 4 speculation presented as Tag 1 fact, or invented a "Silent Scene" of high emotion to hook listeners.
  *   **Verdict:** **If it failed Gate 2 (Instrumentalization), it was wrong.**
  *   **Reasoning:** You say you are worried. The protocol asks: *Was this scene here to reveal her, or to hook the listener?* If you dramatized a private moment of grief or cruelty to grab attention without evidence, you instrumentalized her.
  *   **Action:** You cannot un-air it. But in the season notes or a companion piece, you must issue a correction regarding the certainty level of that scene. Transparency repairs the breach with the audience. If you don't, the protocol says you are complicit in the misrepresentation.

  ---

  ## Part 5: Where This Procedure Misfires

  I am obligated to tell you where this tool will break, so you don't trust it blindly.

  1.  **The "Good Story" Bias:** The protocol relies on honest answers in Section D. When you are tired at midnight, you will lie to yourself. You will say "Yes, this is consistent with her character" when really "This is just cooler." *Mitigation:* The Assistant running this must have the authority to flag "Hesitation" without fear of being overruled by the Writer.
  2.  **The "Silent" Trap:** In cases like the Magdalene Laundries/Cork homes, the silence *is* the story. The protocol bans inventing thoughts in silence. But sometimes, the only way to convey the horror is to imagine it. *Risk:* Strict adherence might sanitize the history. *Mitigation:* Use "Third-Party Observation" (showing the result on the mothers) rather than inventing her internal state.
  3.  **Family Veto Creep:** The protocol limits Family Sign-Off to specific gates. Cousins may feel *any* dramatization is a betrayal. The protocol cannot solve grief. If they reject a Gate 1 Pass scene, you have a business decision, not an ethical one. The protocol protects *her*, not their feelings.
  4.  **The "Borrowed Line" Illusion:** Even if credited, putting another woman's words in your aunt's mouth creates a false memory for the listener. They will remember *her* saying it. *Risk:* This is a form of lying that feels like truth-telling. *Mitigation:* The credit must be audible in the episode, not just in the show notes.

  ## Final Note for the Cousins

  If you read this to them, say this:

  *"This checklist prevents me from making her a hero she wasn't, or a villain she wasn't. It stops me from putting words in her mouth just because they sound good. It gives you a say on the sensitive things that affect the family memory. It doesn't stop the season, but it stops me from lying about who she was."*
