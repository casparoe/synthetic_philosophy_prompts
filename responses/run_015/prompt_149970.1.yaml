      *   **Secondary Target:** Step 4. The leap from "failure" to "structural defect."
      *   **Resolution:** Distinguish between *sovereignty* (who has the final say) and *administration* (who does the work).
      *   **Cost:** You have to accept that democracy is a system of *authorization*, not just *action*.

  8.  **Self-Correction/Refinement during drafting:**
