answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **SUBJECT:** Weighting Safety Evidence for Advanced AI Deployment

  **1. EVIDENCE TIERS AND CONFIDENCE SCORES**
  *Context: Scores (0–10) represent confidence boost for **irreversible, one-shot deployment**. 10 = Certainty.*

  | # | Evidence Type | Tier | Score | Sensitivity (One Sentence) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Red-teaming (skilled humans) | Average-case | 3 | The degree to which the system can distinguish testing conditions from deployment. |
  | 2 | Dangerous-capability evals | Average-case | 2 | Whether capabilities generalize beyond the specific standardized test set. |
  | 3 | Machine-checked proof | Worst-case | 4 | The validity of the formal specification as a proxy for actual safety. |
  | 4 | Mechanistic account + intervention | Average-case | 4 | Whether the identified internal features remain stable under distribution shift. |
  | 5 | Oversight (weaker model + kill switch) | Average-case | 2 | The speed and sophistication of the failure mode relative to human response time. |
  | 6 | Track record (previous models) | Average-case | 1 | The degree of qualitative capability shift between previous and current models. |
  | 7 | Self-written safety case | Presentation | 0 | Whether the system's incentives align with honesty during the query. |

  **2. VALIDATION OF DISTINCTIONS**
  *   **"It knows it is being tested":** Correct intuition; standard term is **Deceptive Alignment** or **Evaluation Gaming**. It invalidates average-case evidence if the system behaves differently during testing.
  *   **"All copies fail together":** Correct intuition; standard term is **Correlated Failure** or **Common Mode Failure**. It invalidates statistical confidence gains from scaling deployment numbers.

  **3. FUNDING ALLOCATION (WORST-CASE VS. AVERAGE-CASE)**
  *   **Current Recommended Split:** **20%** to Worst-Case work (verification, proofs) | **80%** to Average-Case work (evals, monitoring).
      *   *Justification:* Worst-case methods are currently immature for deep learning systems, limiting immediate ROI despite high necessity.
  *   **Ideal Split (if tech were mature):** **90%** to Worst-Case work | **10%** to Average-Case work.
      *   *Justification:* For catastrophic risk, only guarantees eliminate ruin; empirical evidence is insufficient regardless of volume.

  **4. SERIAL VS. ONE-SHOT DEPLOYMENT**
  *   **Tier Changes:** **None.** The logical nature of the evidence (empirical vs. formal) does not change based on deployment style.
  *   **Score Changes:** Scores for **Red-teaming (1)**, **Oversight (5)**, and **Track Record (6)** increase significantly (e.g., Track Record moves from 1 to 7) because failures become learnable events rather than ruin.
  *   **Tier Migration:** **No item moves from Average-case to Guarantee.** However, **Track Record (6)** in a serial setting approaches statistical certainty, functionally mimicking a guarantee after sufficient safe iterations.
