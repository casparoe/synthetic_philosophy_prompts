          *   *Fragility:* Very fragile. A small amount of new public information can break it.
          *   *Efficiency:* Can lead to inefficient outcomes (everyone goes to a bad restaurant).

      *   **Rational Herding (or simply Herding):**
          *   *Origin:* Broader term, often used in finance and macroeconomics.
          *   *Mechanism:* Can be sequential or simultaneous.
          *   *Key Feature:* Often driven by *payoff externalities* (it's better to be together) or *reputational concerns* (Keynesian beauty contest, career concerns).
          *   *Distinction:* Sometimes used interchangeably with cascade, but often implies the *reason* for following is not just informational (learning from others) but also payoff-based (network effects, safety in numbers).
          *   *Volatility:* Often associated with overreaction to public news (financial bubbles).

      *   **The Confusion:** In popular literature and even some academic contexts, these terms are often conflated. Strictly speaking, an information cascade is a *type* of rational herding model, but "herding" is the broader behavioral phenomenon, while "cascade" is the specific informational mechanism.

