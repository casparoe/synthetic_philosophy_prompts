answer: |-
  You have a sharp eye for detail. In popular discourse, these terms are often used interchangeably, but in behavioral economics and game theory, they describe distinct mechanisms. Getting this right will add a layer of subtextual realism to your scene.

  Here is the breakdown of the mechanics, the differences in group error, and how to diagnose which one your characters are experiencing.

  ### 1. The Core Distinction

  *   **Information Cascade:** This is a specific **informational** phenomenon. It occurs when people make decisions **sequentially**. Person B observes Person A's action. Even if Person B's private information suggests A is wrong, B rationally decides that A's action *is* information. Once the public history (what people have done) outweighs private signals (what people know/feel), everyone follows the crowd. They are following because they believe the crowd knows something they don't.
  *   **Rational Herding:** This is a broader umbrella term, but when contrasted with cascades, it usually refers to herding driven by **payoff externalities** or **reputational concerns**. People follow the crowd not because they think the crowd is *right* about the quality of the object, but because the *value* of the object increases if others choose it (network effects), or because there is a social/professional cost to dissenting.

  ### 2. Mechanism-Level Comparison

  | Feature | Information Cascade | Rational Herding (Payoff/Reputational) |
  | :--- | :--- | :--- |
  | **Sequence** | **Strictly Sequential.** Person 2 must see Person 1's choice before making their own. If decisions are simultaneous, a classic cascade cannot form. | **Flexible.** Can happen sequentially or simultaneously. |
  | **Motivation** | **Informational Externality.** "I think this restaurant is bad, but since you all chose it, I assume my information is wrong and yours is right." | **Payoff/Reputational Externality.** "I think this restaurant is bad, but I get more utility from eating with you than eating alone," OR "If I object, I look like a difficult friend." |
  | **Private Signal** | **Ignored.** Once the cascade starts, private information is completely discarded. It becomes rational to ignore your own gut. | **Weighed.** Private taste is acknowledged but overruled by social utility. "I know it's overrated, but being together matters more." |
  | **Fragility** | **Extremely Fragile.** Because the group is ignoring private data, a single credible dissenting voice (new public information) can shatter the cascade immediately. | **Robust.** If the motivation is payoff (e.g., "we want to be together"), telling the truth won't change the outcome. They *still* want to go to the same place to stay together. |
  | **Group Error** | **Idiosyncratic & Brittle.** The group can lock into a wrong decision based on the actions of just the first two people. | **Systemic & Momentum-driven.** The group moves together because of incentives, often leading to bubbles or sustained conformity even when everyone knows the truth. |

  ### 3. Implications for Group Error

  You recalled correctly that cascades are fragile.
  *   **In a Cascade:** The group can end up at a terrible restaurant based on the first two friends saying "Yes." If the third friend had spoken up and said, "Actually, I read the reviews and they're fake," the cascade would break, and everyone might revert to their private signals. The error is based on a **lack of aggregated information**.
  *   **In Herding:** The group ends up at a mediocre restaurant, but they *know* it's mediocre. They go anyway. The error here isn't that they are fooled; it's that their incentives are misaligned with quality. In financial markets, this looks like a bubble where traders buy an asset they know is overvalued because they expect to sell it to a "greater fool" later. In your dinner party, this looks like **social cohesion trumping individual taste**.

  ### 4. Diagnosing Your Scene

  To decide which concept fits your scene, you need to interrogate your characters' internal monologues during the dinner party.

  #### Scenario A: It is an Information Cascade
  *   **The Setup:** Friends speak up one by one.
  *   **The Internal Monologue:** "I checked Yelp, and it looked mediocre (Private Signal). But Sarah said she loves it, and Mark nodded. Sarah and Mark usually have great taste. Maybe my source was wrong? I'll say yes."
  *   **The Outcome:** They genuinely believe the restaurant might be good by the end.
  *   **The Narrative Tension:** This is about **uncertainty**. The later compliers are unsure of their own judgment. If one person later says, "Actually, I hated the food," the others will feel betrayed or confused.

  #### Scenario B: It is Rational Herding (Payoff/Reputational)
  *   **The Setup:** Friends discuss it openly or vote.
  *   **The Internal Monologue:** "I checked Yelp, and it looked mediocre (Private Signal). Sarah and Mark want to go. If I say no, we argue, or I eat alone. I'd rather have a 6/10 meal with my friends than a 9/10 meal alone. I'll say yes."
  *   **The Outcome:** They *know* the restaurant is overrated, but they go anyway.
  *   **The Narrative Tension:** This is about **compromise and social cost**. The tension isn't "Are we wrong?" it's "Are we suppressing ourselves for the group?" If one person later says, "I hated the food," the others will nod in agreement: "Yeah, me too, but it was worth it to be together."

  ### 5. Writing Recommendation

  For a dinner party scene, **Rational Herding (specifically Reputational Herding)** is often more psychologically rich than a pure Information Cascade.

  Pure Information Cascades require a strict sequence where later people literally cannot see the private signals of earlier people. In a dinner party, people talk; they share *why* they like the place. If they share their reasons, the "private signal" becomes public, which theoretically stops a cascade.

  However, **Reputational Herding** thrives in dinner parties.
  *   **How to write it:** Have the character who doubts the restaurant look around the table. Show them calculating the social cost of dissent.
  *   **The Dialogue:** The doubter shouldn't say, "I'm not sure." They should say, "Sounds fun!" while feeling a pang of resignation.
  *   **The Payoff:** This highlights the theme of **individuality vs. belonging**.

  **Verdict:**
  If you want the scene to be about how easily people are **fooled**, use the **Information Cascade** (make sure they speak in order, and hide their reasons).
  If you want the scene to be about how people **sacrifice preference for harmony**, use **Rational Herding** (let them know the truth, but show them choosing the group anyway).

  Given your description ("privately thought it looked overrated"), it sounds like they *know* the truth but are going anyway. That is **Rational Herding driven by payoff/reputational externalities**, not a pure Information Cascade. In a true cascade, they would eventually convince *themselves* it isn't overrated. If they still think it's overrated but go regardless, they are herding for social payoff.
