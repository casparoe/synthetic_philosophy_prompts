answer: |-
  You are working within a Foucaultian framework (specifically *Discipline and Punish*), but your intuition is hitting the friction points where 19th-century disciplinary theory meets 21st-century algorithmic governance.

  Your current heuristic (**Record + Norm + Correction**) is close, but it conflates *measurement* with *discipline*. A census measures; a piece-rate measures. Neither are necessarily disciplinary in the specific sense you are grasping for.

  Here is a cleaner principle that resolves your paradoxes, followed by the verdict on your edge case.

  ### The Cleaner Principle: **Normalization via Individualization**

  Disciplinary power is distinct from Sovereign power (force), Economic power (exchange), and Biopower (population management).

  **Discipline = The construction of a "Case."**
  It requires three simultaneous conditions:
  1.  **Individualizing Visibility:** The mechanism must isolate *you* as a specific unit of analysis (rules out Census).
  2.  **Normative Judgment:** The mechanism must measure you against a standard of "health," "competence," or "normalcy," not just against a price or a law (rules out Piece-rate, Insurance).
  3.  **Constitutive Correction:** The measurement must feed back to reshape your *capacities, habits, or soul*, not just your output (rules out Surgical Checklist).

  **The Crucial Distinction: Transactor vs. Subject**
  *   **Economic/Sovereign Power** treats you as a **Transactor** or **Subject-of-Law**. You pay a price, you break a law, you get a reward. Your internal state is irrelevant; only the outcome matters.
  *   **Disciplinary Power** treats you as a **Subject-to-be-Optimized**. It cares about *how* you sleep, *how* you learn, *how* you spend. It wants to align your internal rhythms with an external norm.

  ### Re-evaluating Your Verdicts

  Using this principle, here is how your cases stack up. I have flagged one you might need to reconsider.

  | Case | Your Verdict | New Analysis | Keep/Drop? |
  | :--- | :--- | :--- | :--- |
  | **Prison timetable** | Yes | Classic discipline. Time + Body + Norm. | **Keep** |
  | **Sovereign spectacle** | No | Sovereign power. Intermittent, spectacular, not normalizing. | **Keep** |
  | **Piece-rate pay** | No | Economic exchange. Measures *output*, not *capacity*. Leaves your body's rhythm alone. | **Keep** |
  | **National census** | No | Biopower. Works on populations/statistics, not the individual "case." | **Keep** |
  | **School exams** | Yes | Individualizes + Ranks against Norm + Corrects future path. | **Keep** |
  | **Hospital diagnosis** | Yes | Creates a "case" (the patient) against a norm (health). | **Keep** |
  | **Therapy confession** | Yes | Pastoral/Disciplinary hybrid. Internalizes the gaze to correct the soul. | **Keep** |
  | **Sleep app** | Yes | **Key Case.** No money, no guard. But it defines "Good Sleeper." You change your *life* to fit the score. It is normalization. | **Keep** |
  | **Biometric/Insurance** | **No** | **Borderline.** You call it a contract (economic). But it *does* discipline your body. *Recommendation:* Keep your "No," but acknowledge it is **Discipline masked as Contract.** The money distracts from the norm. | **Keep (with nuance)** |
  | **Credit score** | Yes | Algorithmic discipline. Creates a "truth" about you that gates your life, forcing behavioral alignment. | **Keep** |
  | **Surgical checklist** | No | Procedural safety. Standardizes the *task*, not the *person*. The surgeon isn't ranked/changed by the list. | **Keep** |

  ### Resolving the Paradox: Sleep App vs. Piece-Rate

  You asked why the Sleep App is discipline but Piece-Rate is not, since both act on self-interest without a guard.

  *   **Piece-Rate:** The metric is **External/Transactional**. "Make 10 widgets." It does not care if you are sleep-deprived, stressed, or inefficient, as long as the widgets exist. It extracts labor; it does not shape the laborer.
  *   **Sleep App:** The metric is **Internal/Normative**. "Score 85." This defines a *quality of being*. To get the score, you must change your biology, your routine, your anxiety. It extracts *compliance with a norm*.
  *   **The Panopticon Factor:** In the Sleep App, *you* are the guard. The app provides the gaze, but you enact the punishment (going to bed earlier, skipping wine). In piece-rate, the market enforces the consequence (no money), not your own self-conception.

  ### The Edge Case: The Adaptive AI Tutor

  > *A tutor system that builds a permanent model of each student, adapts itself to them, never grades and never compares them to anybody.*

  **Verdict: Yes, this is Discipline (specifically, Algorithmic Governance).**

  Here is why, and why your hesitation about "no comparison" is understandable but ultimately secondary:

  1.  **The Model is the Gaze:** Even if it never shows you a grade, building a "permanent model" objectifies the student. It turns the student into a **Case**. You are being known, mapped, and predicted.
  2.  **Adaptation implies a Norm:** If the system "adapts," it is steering you toward a target. That target (literacy, competency, curriculum completion) is the **Norm**. The fact that it doesn't show you a class ranking hides the *shame* of discipline, but not the *correction*.
  3.  **Comparison is Hidden, Not Absent:** The system likely compares you to a dataset of "successful learning paths" to know how to adapt. The comparison happens in the black box, not on the report card.
  4.  **Constitutive Correction:** By adapting to you, it shapes how you learn. It closes off paths it deems "inefficient" for your model. It disciplines your intellectual capacity by narrowing your trajectory to what the model predicts you can handle.

  **Why it feels different:**
  This is **Discipline without the Spectacle of Ranking.** Foucault described the shift from Sovereign punishment to Disciplinary correction. This is the next shift: **Disciplinary Optimization.** It feels softer because it removes the *humiliation* of the exam (no grades), but it increases the *totality* of the surveillance (permanent model).

  **The Trap:**
  If the tutor adapts *purely* to the student's desires with no external curriculum goal, it ceases to be discipline and becomes a **Mirror**. But if it adapts to maximize *learning outcomes* (defined by the system), it is discipline. It is the Panopticon where the tower whispers suggestions instead of shouting orders.

  ### Summary of the Principle

  To decide future cases, ask this:
  **"Does this mechanism treat me as a source of value to be extracted (Economic/Sovereign), or as a subject to be aligned with a standard of normalcy (Disciplinary)?"**

  *   **Piece-rate:** Extracts value. (Not Discipline)
  *   **Sleep App:** Aligns subject with "Health." (Discipline)
  *   **AI Tutor:** Aligns subject with "Competency." (Discipline)
  *   **Census:** Counts the herd. (Biopower)
  *   **Checklist:** Safeguards the process. (Procedural)

  Your gut was right on the Sleep App. That is the purest form of modern discipline: **Voluntary self-surveillance for the sake of a number that defines your worth.**
