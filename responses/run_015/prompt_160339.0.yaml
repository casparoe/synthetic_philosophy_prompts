prompt: |-
  Act as a political philosopher who also publishes literary fiction, and take the craft side of this as seriously as the conceptual side. Before you start drafting, spend some real effort brainstorming: sketch four to six candidate situations in bullet form, say in a sentence each what philosophical work the situation does, note which ones collapse into cliché, and then pick the one with the most traction and tell me why you picked it. Only then write the piece.

  Some context, because it shapes what I need. Seven months ago I became the executive director of a regional housing authority. Since then I have regularly signed off on things I would have condemned as a housing attorney two years ago: refusing an emergency transfer that I believe is justified, moving one waiting-list category above another, applying a rule I know will leave a specific family worse off than a rule I could write instead. The philosophical literature on dirty hands has accordingly stopped being an abstraction for me, and it has started being something I have to explain to other people. I run a monthly ethics seminar for our staff. Case studies make everyone defensive and turn into arguments about the facts, so for the next session I want fiction instead — something people can talk about without it being about them.

  Write a short story of roughly 1,800 to 2,500 words. Constraints on the setting and form: put it in ordinary civil administration — housing, benefits, hospital capacity, school placement, procurement, parole, anything with forms and deadlines and a budget line. No torture, terrorism, war, espionage, or heads of state; I want the phenomenon at the scale where it actually occurs for people like me. Give the decision concrete content: real numbers, a deadline, a written rule, an identifiable person who loses. Do not let it resolve into either noble tragedy or slow corruption; I am interested in the unstable middle where the protagonist's motives are mixed and she genuinely cannot tell, in the moment, whether she is deliberating or rationalizing. No lecturing narration, no allegorical names, no closing paragraph that announces the moral.

  Here is the half-formed material I want you to develop rather than illustrate. Three ideas I have been turning over, which I have not seen handled in quite this way:

  First, what I have started calling the purity tax — the possibility that keeping one's own hands clean is not costless but is instead a cost that falls on someone else, typically the same vulnerable people whose interests motivated the refusal. If so, the clean-hands option is not the moral baseline against which dirt is measured; it is one more option with a price, and it may be the option that is easiest to feel good about.

  Second, what I call laundered remainder: in a bureaucracy you can almost always get the same outcome either by choosing it or by building a process — a formula, a waitlist rule, an automated eligibility check — whose predictable output is that outcome and which nobody in particular chose. Is the agent's situation morally different in the two cases, and if it is, is the difference one the agent is entitled to rely on?

  Third, a thought I am less sure of, which I will state as a conjecture: that the moral remainder in these cases is conserved rather than eliminated by delegation — that it does not evaporate when the dirty act is pushed down to a caseworker, a contractor, or a piece of software, but relocates, and specifically relocates to whoever has the least power to refuse it.

  You do not need to use all three; pick whichever one or two the story can actually carry, and let the others sit. What matters is that the fiction does the philosophical work itself — that a reader who had never heard the term dirty hands would come away having felt the specific difficulty — rather than staging a debate and letting a character explain it.

  After the story, add a note of about 300 to 400 words addressed to me and to my staff, not to a scholarly audience. In it: name which reading of dirty hands the story presupposes (the paradoxical reading on which the act is genuinely wrong and yet the thing to do, versus the reading on which it is right and leaves a residue, versus a view on which the real cost is to the agent's character rather than to the act's deontic status), tell me where the story takes liberties for dramatic effect, and tell me where it leans on a contested reading rather than a safe one. Be disciplined about the epistemics: separate what people who actually work on this topic take to be settled from what is a live dispute — for instance, whether dirty hands is a distinctive moral phenomenon at all rather than a dramatic label for ordinary tragic trade-offs, and whether the cost is best located in wrongness, in residue, or in character. Label contested claims as contested, and do not present a contested view as the consensus. I would rather be told that the profession is split than be given a confident answer I would repeat to staff as received doctrine.

  No citations or bibliography; I will supply the reading myself.
