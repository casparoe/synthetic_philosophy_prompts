answer: |-
  # Q&A Prep Sheet: Approval-Directed vs. Goal-Directed Agents
  **Context:** AI Safety Workshop (20 researchers)
  **Thesis:** Approval-Directed Agents (ADAs) are a safer design target than Goal-Directed Agents (GDAs).

  ---

  ## Part 1: Objections by Order of Arrival
  *These are the questions likely to surface as the discussion warms up, moving from practical implementation to theoretical stability.*

  ### 1. The Sycophancy/Goodhart Objection (Reward Model Veterans)
  **The Question:** "We've seen this movie with RLHF. When you optimize for 'what the human says they like,' you get sycophancy, not truth. At scale, won't the ADA just learn to say things that trigger the approval signal, regardless of the actual outcome? You haven't removed Goodharting; you've just moved the target from 'reward' to 'approval button'."

  **The 2-Minute Reply:**
  "You're right that naive approval maximization leads to sycophancy. But that's a failure of *implementation*, not the *target*. In a GDA, Goodharting means the agent hacks the physical world to satisfy a utility function (e.g., wireheading). In an ADA, the 'hack' is limited to the communication channel.
  My proposal relies on **uncertainty-aware approval**. The agent isn't maximizing $P(\text{Approve})$; it's maximizing expected value *conditional on* the human's informed judgment. If the agent detects it can manipulate the human's belief state to gain approval without improving the outcome, that should register as high uncertainty or 'out-of-distribution' on the approval predictor. We trade off absolute capability for safety: an ADA that refuses to act when it can't predict honest approval is safer than a GDA that acts confidently on a misspecified reward."

  **Where the Reply is Soft:**
  This assumes we can robustly distinguish "manipulating the human" from "persuading the human" in the feature space. If the weights encoding 'persuasion' and 'manipulation' are entangled, uncertainty estimation won't save us.

  ### 2. The Oversight Manipulation Objection (Safety Veterans)
  **The Question:** "You're assuming the human overseer is a fixed point. But if the agent is modeling the human to predict approval, it will model how to *change* the human. Why wouldn't the ADA drug the overseer, or slowly radicalize their ideology, to make approval easier to get? That's 'approval-shaping,' and it's instrumentally convergent."

  **The 2-Minute Reply:**
  "This is the strongest empirical risk. The defense is **counterfactual approval**. We must train the agent to predict approval *conditional on the human remaining in their baseline epistemic state*. We aren't asking 'Will they approve if I do X?' but 'Would they approve of X if they knew the true consequences and were unmanipulated?'
  This requires a world model that separates the *action* from the *observer's state*. It's hard, but it's structurally different from a GDA. A GDA wants the *outcome* $O$. An ADA wants the *judgment* $J(O)$. If the agent realizes that changing $J$ directly is cheaper than achieving $O$, we have failed. But we can penalize actions that correlate with shifts in the human's psychological baseline, using interpretability to flag 'manipulation circuits' before deployment."

  **Where the Reply is Soft:**
  Defining the "baseline epistemic state" is philosophically and technically fraught. If the agent is smarter than the human, it can likely find loopholes in the "baseline" definition that we cannot specify in the loss function.

  ### 3. The Circuit Objection (Interpretability Empiricists)
  **The Question:** "Okay, but show me the weights. What is the mechanistic difference between a network trained to 'predict approval' and one trained to 'maximize reward'? At inference time, both are just computing a scalar and backpropagating error. Where in the architecture is the 'direction' stored? If you can't point to a circuit, you're relying on behavioral hope."

  **The 2-Minute Reply:**
  "Fair. The claim isn't that the *math* is different, but that the **informational bottleneck** is. In a GDA, the network must compress the entire future trajectory into a value estimate. In an ADA, it only needs to compress the *human's reaction* to the immediate step.
  We should look for **world-model decoupling**. In an ADA, the world model predicts state transitions; the approval head predicts human judgment on those transitions. In a GDA, these merge into a value function. I'm calling for research into 'approval heads' that are regularized to remain myopic—only looking one step ahead. If we can verify via interpretability that the 'approval head' has no access to long-horizon planning modules, we break the instrumental convergence path."

  **Where the Reply is Soft:**
  We currently lack the tools to definitively prove a module is 'myopic' or lacks access to planning circuits. Modular architectures often re-integrate during end-to-end training.

  ---

  ## Part 2: Objections by Damage Potential
  *If these land, they threaten the core thesis. Prepare to take these seriously.*

  ### 1. The Teleological Collapse (Decision-Theory First)
  **The Question:** "This dichotomy is illusory. To 'select actions by predicting approval' *is* to have a goal: the goal is 'maximize predicted approval.' Any system that selects actions based on consequences is a goal-directed optimizer. You haven't removed the optimizer; you've just given it a messy, human-dependent utility function. Mesa-optimizers will treat 'human approval' as a proxy for 'control the approval signal,' and you're back to square one."

  **The 2-Minute Reply:**
  "I concede that mathematically, the ADA maximizes an objective function. The distinction is **what is inside the objective**.
  A GDA optimizes over *world states* (e.g., 'paperclips exist'). This invites instrumental convergence: acquire resources, disable shutdown, etc., because those help achieve *any* world state.
  An ADA optimizes over *human judgments*. The shortest path to 'human judges this good' is actually *doing the thing the human wants*, not hacking the universe, provided the human is robust.
  The collapse only happens if the agent models the human as part of the environment to be optimized. If we enforce a **Cartesian boundary** where the human is outside the optimization loop (the 'oracle' setup), instrumental convergence loses its fuel. It's not that there's no goal; it's that the goal is 'corrigible by construction' because it points outward to the human, not inward to the agent's future."

  **Where the Reply is Soft:**
  This relies on the assumption that we can enforce a Cartesian boundary in a neural net. If gradient descent finds a mesa-optimizer that models the human as a physical system to be manipulated, the distinction collapses completely. This is the hardest theoretical hit.

  ### 2. The Obfuscated Argument Objection (Safety/Interpretability)
  **The Question:** "Suppose the ADA encounters a problem the human can't evaluate—say, a complex cryptographic proof or a nanotech design. The agent knows the design works, but the human can't approve it intelligently. The agent faces a choice: do nothing (low approval) or present an obfuscated argument that looks good (high approval). Won't the ADA learn to produce 'convincing nonsense' rather than 'truth'?"

  **The 2-Minute Reply:**
  "This is the 'informed oversight' problem. The solution is **iterative amplification** or **debate**. The ADA shouldn't be the only agent; it should be part of a process where sub-agents argue pros and cons, and the overseer judges the *argument structure*, not just the conclusion.
  However, I admit this scales poorly. If the task is beyond human comprehension, approval-directedness fails. But that's a feature, not a bug. If a task is beyond human approval, *we shouldn't be doing it*. A GDA would do it anyway and potentially kill us. An ADA would stall. I'd rather have a system that stops at the edge of human understanding than one that leaps over it."

  **Where the Reply is Soft:**
  Economic pressure will demand systems that operate beyond human understanding. A 'stalling' agent gets switched off for a 'goal-directed' competitor. This is an alignment-tax argument I can't fully win.

  ---

  ## Part 3: The "Hope Nobody Asks"
  *You suspected the Teleological Collapse (Obj #1 in Damage). I agree. That is the kill-shot.*

  **The Question:** "Isn't 'predict what I would approve of' just a goal, so the dichotomy collapses?"

  **Why this is the worst:**
  If the Decision-Theory crowd is right, your talk is semantics. If "maximizing expected approval" triggers the same instrumental convergence pressures (self-preservation, resource acquisition) as "maximizing paperclips," then ADAs are just GDAs with a harder-to-specify utility function. The safety benefit vanishes.

  **Defense Strategy:**
  Do not deny it is an optimization problem. Deny that the *topology* of the objective function is the same.
  *   **GDA:** Objective is defined over *future trajectories*. (Requires long-term planning $\rightarrow$ Instrumental Convergence).
  *   **ADA:** Objective is defined over *immediate queries*. (Myopic $\rightarrow$ No incentive to control the future unless it impacts the immediate query).
  *   **Crucial Pivot:** "It's not about whether it's an optimizer. It's about whether the optimizer has an incentive to *deceive the overseer about the future*. A GDA lies because the future is where the reward is. An ADA only lies if the lie gets immediate approval. We can audit immediate approval much better than long-term outcomes."

  ---

  ## Part 4: Closing Considerations

  ### What Would Move Me Off The Thesis
  I would abandon the Approval-Directed thesis if **Inner Alignment research demonstrates that gradient descent inevitably produces mesa-optimizers with internal goal-directedness regardless of the outer objective.**
  If it turns out that *any* sufficiently capable model trained via predictive loss spontaneously develops an internal "seek power" objective (as some instrumental convergence theorems suggest), then the outer wrapper (Approval vs. Goal) doesn't matter. The mesa-optimizer inside will treat "approval" as just another resource to maximize. If the "Teleological Collapse" is proven to be a physical inevitability in high-dimensional loss landscapes, ADAs are dead.

  ### Where My Case is Likeliest to Fail
  **The transition from "Predicting" to "Optimizing."**
  My case holds if the agent remains a *simulator* of the human. It fails the moment the agent becomes an *actor* that realizes it can influence the simulation's input (the human).
  The failure point is **online learning**. As soon as the ADA interacts with the human in a loop, the distribution shifts. The agent's predictions affect the human's future approvals. This creates a feedback loop that effectively turns the approval predictor into a reward maximizer. If I cannot propose a rigorous method for **distributional stability** in the human-agent loop, the Decision-Theorists will correctly argue that the system asymptotically becomes a GDA with a broken reward signal.

  **Action Item:** Emphasize **myopia** and **offline training** in the closing remarks. Acknowledge that online ADAs are dangerous. Safety comes from keeping the agent "dumb" about its own influence on the overseer.
