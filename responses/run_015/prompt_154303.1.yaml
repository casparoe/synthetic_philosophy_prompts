      *   **Amartya Sen's Entitlement Approach:** Famines occur not necessarily from food availability decline (FAD) but from entitlement failure (people can't access food). This shifts blame from "nature" to "society/politics."
      *   **Bengal (1943):** Wartime inflation, speculative hoarding, British "Denial Policy" (scorched earth regarding rice/boats), prioritization of military supply. *Mechanism:* Market failure exacerbated by colonial policy.
      *   **Ireland (1845-52):** Potato blight (ecological), but continued export of grain/livestock to Britain under laissez-faire ideology and colonial structure. *Mechanism:* Colonial extraction + ideological rigidity during ecological shock.
      *   **Great Leap Forward (1958-62):** Communalization, backyard steel, exaggerated reporting by local officials leading to over-procurement by the state. *Mechanism:* Centralized command economy failure + political coercion + ecological factors (some drought/flood, but secondary to policy).
      *   **The Binary Problem:** "Natural Disaster" implies inevitability/act of God. "Political Crime" implies intent or gross negligence punishable/condemnable.
      *   **The Charter Constraint:** Must preserve multi-factor labeling when climate/ecological stress is present.

  3.  **Evaluate the Options:**
      *   *Option A: Adopt Binary.* Pros: Clear moral stance, aligns with modern human rights frameworks. Cons: Violates charter (ignores ecology), oversimplifies complex historiography (especially Bengal's market shocks), hard for staff to apply consistently (what defines "crime"?).
