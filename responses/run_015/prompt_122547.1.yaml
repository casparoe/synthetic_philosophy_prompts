answer: |-
  # PREP SHEET: Discount Rate Decomposition Q&A
  **Context:** Finance Ministry Technical Consultation
  **Goal:** Survive the Q&A without conceding the core normative claim, while acknowledging administrative constraints.
  **Strategy:** Do not defend ethical theory. Defend *risk management* and *fiscal prudence*. Translate "pure time preference" into "accounting error." Translate "hazard" into "political risk premium."

  ---

  ## RANKED OBJECTIONS (1 = Most Damaging)

  ### 1. The "Spreadsheet" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "You've proposed a three-component decomposition. The guidance needs to be a single discount rate schedule or a lookup table. If you tell analysts to estimate a 'survival hazard' for every project, you are introducing subjective discretion where we need consistency. Two analysts will produce two different rates for the same project. How do I put that in the spreadsheet without getting flagged by Audit for inconsistency?"

  **The Reply:** "You're right that discretion is a risk, but the current single-number approach hides discretion rather than removing it. Right now, an analyst chooses a discount rate based on the outcome they want. My proposal makes the assumptions explicit. We don't need project-by-project estimation. We can publish standard hazard schedules by *policy type*—infrastructure gets one schedule, regulatory standards get another, based on historical reversal rates. This reduces discretion to a classification problem, which is auditable, rather than a number-picking problem, which is not. It shifts the burden from justifying a magic number to justifying a policy category."

  **Candid Note:** *Soft spot:* You are assuming the Ministry will do the work of creating these standard schedules. They won't. They will offload it to departments, reintroducing the inconsistency you promised to fix. You are promising centralization but proposing decentralization.

  ### 2. The "Capital Crowding" Objection (Macroeconomist, Advisory Council)
  **The Objection:** "You concede the opportunity cost of capital is high—say, four percent. But you argue the effective rate for long-term projects should be near one percent. If the state can earn four percent in the market, and you approve a project returning one percent because of your hazard adjustment, you are literally destroying wealth. You are instructing the government to starve present capital allocation for the sake of hypothetical future benefits that may never materialize. That's not ethics; that's inefficiency."

  **The Reply:** "It is only inefficiency if the benefit is certain. If there is a significant chance the benefit never arrives due to policy reversal or institutional collapse, investing at the market rate is the gamble. My argument is that the 'high return' on private capital assumes a stable institutional framework. If the policy horizon is three centuries, that framework is not guaranteed. We aren't comparing a safe 4% to a risky 1%. We are comparing a safe 4% to a *conditional* 1%. If the condition fails, the return is zero. Accounting for the probability of institutional failure isn't inefficiency; it's risk adjustment."

  **Candid Note:** *Begs the question:* You are assuming the "hazard" is exogenous. The Macroeconomist will argue the state *ensures* the stability. If the state is the hazard, the state is also the insurer. This distinction is fragile.

  ### 3. The "Audit Trail" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "Let's say we accept your hazard schedules. The Auditor General asks me why I used a 0.5% hazard rate for this climate regulation. I can't show them a market price for 'political stability.' I can't show them a revealed preference. It looks like I just picked a number to make the benefit-cost ratio pass. How is this defensible under current financial reporting standards?"

  **The Reply:** "It is more defensible than the alternative. Currently, you defend a rate by citing a guidance document that cites a paper from ten years ago. That's an appeal to authority. Under my proposal, you defend the rate by citing the *class* of policy and the historical survival rate of that class. We have data on how long tax credits last, how long regulations survive statutory review, and how often infrastructure is abandoned. You are defending a number based on empirical survival data, not a normative parameter. That is a stronger audit trail."

  **Candid Note:** *Weakness:* That data doesn't exist in a clean format. You are asking them to build a dataset they don't have. You are trading a normative problem for a data availability problem.

  ### 4. The "Arbitrage" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "If the hazard rate depends on policy type, departments will reclassify projects to get the lower discount rate. A transport department will label a road as 'climate adaptation' to get your long-horizon low rate. We spend the next five years litigating project classifications instead of appraising projects. How do you prevent regulatory arbitrage?"

  **The Reply:** "Arbitrage exists in any system with categories. The solution isn't to remove categories; it's to tighten the definitions. We already distinguish between capital and operating expenditures for tax purposes. We can distinguish between 'entrenched' and 'discretionary' benefits. If a department tries to game it, the Cost-Benefit Unit rejects the classification. The incentive to game proves the rate matters. The current system encourages gaming by letting departments argue for exceptions to the single rate. My system makes the exceptions the rule."

  **Candid Note:** *Concession:* You are admitting the system will be gamed. You are arguing it will be *less* gamed than the current one, which is a low bar.

  ### 5. The "IAM Calibration" Objection (Environmental Economist, Modeler)
  **The Objection:** "Integrated Assessment Models like DICE are calibrated to a specific discounting structure. If you introduce a time-declining hazard rate, you break the recursive solution. We can't just swap the parameter. We have to re-solve the entire optimization path. Are you asking us to rebuild the models from scratch? And if we do, does the Social Cost of Carbon actually change, or does the model just converge back to the market rate via the consumption smoothing channel?"

  **The Reply:** "You don't need to rebuild the optimization. You can treat the hazard as an exogenous probability weight on the utility stream, separate from the consumption discount. It's a multiplication factor, not a change to the Euler equation. As for the SCC: yes, it changes. It raises the present value of distant damages significantly. If your model converges back to the market rate, that's because the model assumes infinite institutional stability. If you want the model to reflect reality, you have to let the hazard term do its work. Don't let the tool dictate the physics."

  **Candid Note:** *Soft spot:* Technically, adding a time-varying hazard *does* complicate the recursive structure in many standard implementations. You are oversimplifying the coding burden.

  ### 6. The "Revealed Preference" Objection (Macroeconomist, Advisory Council)
  **The Objection:** "You say pure time preference should be zero. But the market shows a positive rate. That reveals society's preference for now over later. If the government ignores this, it is imposing a preference structure that citizens don't hold. Why should the state's time preference differ from the aggregate time preference of the taxpayers funding it?"

  **The Reply:** "The market rate reflects the time preference of *current* taxpayers trading with *current* investors. It does not reflect the preference of people who cannot trade because they do not exist yet. There is no market for intergenerational exchange. Using the observed market rate for a 300-year horizon assumes the future is present in today's prices. It isn't. The state is the only agent with a horizon long enough to represent the future. Using the market rate for the long run isn't respecting preference; it's pretending a market exists where it doesn't."

  **Candid Note:** *Begs the question:* The Macroeconomist rejects the idea that the state *should* represent the future. To them, the state is an agent of current taxpayers. You are arguing past each other on the function of the state.

  ### 7. The "Sign Change" Objection (Environmental Economist, Modeler)
  **The Objection:** "Let's be practical. Does this decomposition actually flip a decision? If a project doesn't pass at 3% but passes at 1%, is that project actually viable, or is it just subsidized by your accounting? If the physical resources are consumed today, does it matter that the benefit is discounted less?"

  **The Reply:** "It matters for prioritization. We have a budget constraint. We need to know which long-term investments yield the highest return relative to their risk. If we use a 3% rate for everything, we systematically underinvest in long-horizon risk reduction, like climate mitigation or nuclear waste storage. We end up buying short-term efficiency at the price of long-term fragility. The sign change isn't about subsidizing bad projects; it's about stopping the systematic rejection of good long-term projects due to a mathematical artifact."

  **Candid Note:** *Weakness:* If the budget is fixed, this just shifts money from short-term to long-term. The Macroeconomist will argue the short-term projects have higher verified returns. You are advocating for a portfolio shift without proving the long-term return is real.

  ### 8. The "Cyclical Politics" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "You argue hazard is front-loaded because policies get entrenched. But politics is cyclical. A change in government can reverse anything, regardless of sunk costs. Look at carbon taxes. Why should we assume hazard declines over time? It might increase if political polarization increases."

  **The Reply:** "It's not about immunity to politics; it's about the cost of reversal. A policy in year five can be repealed with a stroke of a pen. A policy in year fifty has dependent infrastructure, vested interests, and adapted behaviors. Reversing it creates immediate, visible losers. That creates friction. Even if polarization increases, the *mechanical* cost of reversal rises with time. The hazard rate doesn't go to zero, but the marginal probability of reversal drops as the status quo becomes the new baseline."

  **Candid Note:** *Concession:* This is empirically shaky. Some policies become *more* vulnerable over time as coalitions fracture. You are relying on a 'status quo bias' theory that isn't universally true.

  ### 9. The "Double Counting" Objection (General/Modeler)
  **The Objection:** "In standard risk analysis, we adjust the probabilities of the outcomes, not the discount rate. If there's a 10% chance the policy fails, we multiply the benefit by 0.9. By putting it in the discount rate, aren't you compounding the risk exponentially over time in a way that doesn't match the probability tree?"

  **The Reply:** "You adjust probabilities for specific outcome uncertainty—will the dam hold? You adjust the discount rate for *systemic* survival uncertainty—will the institution managing the dam exist? Probability weights handle event risk. The hazard rate handles existence risk. If the institution collapses, all future benefits are zero, not just one year's. That requires a continuous rate adjustment, not a one-off probability weight. Mixing them conflates project risk with regime risk."

  **Candid Note:** *Soft spot:* Mathematically, a constant hazard rate *is* equivalent to a probability decay. The distinction is semantic unless the hazard rate varies. Since you argue it *does* vary, the distinction holds, but it's a technicality they can pick apart.

  ### 10. The "Non-Identity" Caveat (Political Philosopher)
  **The Objection:** "I'm sympathetic, but if policy choices determine who comes into existence, the 'beneficiaries' of your long-term discounting are different people than those who would exist under a high-discount policy. Are we really comparing welfare across worlds, or just different populations? Does your hazard rate survive the fact that the 'future' isn't a fixed target?"

  **The Reply:** "I concede the aggregative framework has metaphysical limits. But practically, the ministry must allocate resources to *someone*. Whether the specific individuals are identical or not, there will be *people* living in 2100 who require functioning institutions. We are discounting the value of *conditions* for life, not specific life histories. Even if identities change, the need for a stable climate or safe waste storage remains a prerequisite for any welfare calculation. We discount the precondition, not the person."

  **Candid Note:** *Concession:* This is a philosophical patch, not a solution. In a strict philosophical sense, you are right to worry. In a ministry context, you can ignore this, but don't pretend you've solved it.

  ---

  ## THE ONE QUESTION I HOPE NOBODY ASKS

  **The Question:** "You distinguish between 'hazard' (policy reversal) and 'pure time preference' (valuing the future less). But if the polity chooses to reverse a policy, isn't that simply the revealed time preference of the electorate wearing a technical costume? If the voters in 2050 choose to cancel your climate project, that reveals they value the cost of continuation more than the benefit. By calling it a 'hazard' and discounting it mechanically, aren't you just bypassing democratic preference to impose your own ethical rate?"

  **How Bad Is It?**
  **Critical.** This is the only objection that collapses your entire theoretical framework. If Hazard = Preference, your decomposition is cosmetic. You haven't removed pure time preference; you've just renamed democratic impatience as "institutional risk." The Macroeconomist and the Civil Servants will immediately latch onto this. It undermines your claim to objectivity. It suggests you are treating democratic decisions as "errors" or "risks" rather than legitimate expressions of value.

  **What Can You Say?**
  You cannot deny the link, or you look naive. You must distinguish between *capacity* and *choice*.

  **The Reply:** "That is a powerful challenge. But there is a distinction between a preference for consumption now, and a failure of commitment mechanisms. A hazard rate acknowledges that even if the *long-term* preference of the polity is for stability, the *short-term* incentives of elected officials may force reversal. That's not the people's time preference; that's a principal-agent problem. We aren't discounting because the future matters less to the voters. We are discounting because the institutional bridge to the future might collapse under political pressure. We are accounting for the fragility of the commitment, not the value of the outcome. One is a constraint on our ability to deliver; the other is a judgment on the worth of the delivery."

  **Candid Note:** *Reality Check:* This is a distinction without a huge difference in practice. If the polity won't sustain the policy, the value *is* lower. However, this reply allows you to frame the issue as "institutional design" rather than "ethical imposition," which is the only language the room respects. It shifts the blame from the *people* to the *system*, which is a safer political position for a civil servant to accept.
