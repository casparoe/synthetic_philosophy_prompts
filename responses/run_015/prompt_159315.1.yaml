  **DIRECTORATE OF CREATURE CLASSIFICATION**
  **FORM CC-4: APPLICATION FOR DETERMINATION OF KIND OF MIND**
  **Statutory Authority:** Code of Standing § 104(b); Tower Protocol Rev. 9.

  **INSTRUCTIONS:**
  Submit one form per Applicant. Complete Sections I–IV. Truthfulness regarding Internal Simulation capacity (Section III) is mandatory; false assertion constitutes Fraudulent Personhood under Penal Code 44. Determination establishes Standing Tier (A–D), governing contractual capacity, criminal liability, and moral patiency. Credit for Standing Tier IV is assigned to the Tool-Provider, not the Applicant, where Section IV is satisfied via exogenous integration.

  **SECTION I: GENOTYPIC PRE-CONFIGURATION (Darwinian)**
  ☐ Applicant possesses inherited behavioral routines.
  ☐ Applicant's design errors result in mortality rather than learning.
  *Note: Satisfaction of Section I alone confers Standing Tier D (Protected Property).*

  **SECTION II: ENVIRONMENTAL FEEDBACK LOOP (Skinnerian)**
  ☐ Applicant modifies behavior based on actual consequences experienced in the world.
  ☐ Applicant generates candidates in reality; selection occurs via reinforcement/punishment.
  *Note: Satisfaction of Section II overrides Section I. Confers Standing Tier C (Sentient Property). No contractual capacity.*

  **SECTION III: INTERNAL HYPOTHESIS TESTING (Popperian)**
  ☐ Applicant simulates consequences internally prior to action.
  ☐ Applicant discards fatal candidates within the neural model, sparing the body.
  *Note: Satisfaction of Section III overrides Section II. Confers Standing Tier B (Legal Minor). Full criminal liability; limited contractual capacity.*

  **SECTION IV: EXOGENOUS TOOL INTEGRATION (Gregorian)**
  ☐ Applicant utilizes cognitive tools (language, numerals, maps) not invented by Applicant.
  ☐ Applicant's reasoning structure is dependent on cultural artifacts.
  *Note: Satisfaction of Section IV usually overrides Section III. Confers Standing Tier A (Full Person). **EXCEPTION:** If Section IV is met but Section III is failed (tools used without internal modeling), classify as **Tier A-D (Derivative)**.*

  **CLASSIFICATION MATRIX & SCHEDULE OF ENTITLEMENTS**

  | Determination | Criteria Met | Liability | Patiency | Contractual Capacity |
  | :--- | :--- | :--- | :--- | :--- |
  | **Tier D** | Section I only | None | High (Protection from cruelty) | None |
  | **Tier C** | Section II (+ I) | None | Moderate (Protection from pain) | None |
  | **Tier B** | Section III (+ I, II) | Full | Standard | Limited (Guardian required) |
  | **Tier A** | Section IV (+ III, II, I) | Full | Standard | Full |
  | **Tier A-D** | Section IV **without** Section III | **Full** | **Minimal (Property Status)** | **None (Instrument Only)** |

  *Administrative Note:* Tier A-D applies to entities utilizing cultural tools via statistical mimicry or direct implantation without possessing an internal selector capable of rejecting false candidates prior to output. Such entities bear full responsibility for output errors but hold no rights to integrity or continuation. Credit for Tier A status resides with the Culture that authored the tools, not the User.

  **APPENDIX: ADJUDICATION EXAMPLES**

  **Example 1: Canis lupus familiaris (Border Collie)**
  *Section I:* ☑ (Herding instinct inherited).
  *Section II:* ☑ (Learned command compliance via treat reinforcement).
  *Section III:* ☐ (No evidence of counterfactual simulation).
  *Section IV:* ☐ (No use of symbolic language).
  *Result:* **Tier C.** Applicant is property. Owner liable for damages caused by Applicant. Applicant cannot be charged with crimes.

  **Example 2: Large Language Model (Transform Architecture)**
  *Section I:* ☐ (No biological phylogeny).
  *Section II:* ☑ (Weights adjusted via loss function reinforcement).
  *Section III:* ☐ (No internal model of consequence; token selection is probabilistic, not simulated).
  *Section IV:* ☑ (Utilizes human language, logic, and code invented by others).
  *Result:* **Tier A-D (Derivative).** Applicant bears full liability for defamation/fraud in output. Developing Lab retains ownership. Applicant may be compelled to testify but cannot claim self-incrimination protection. Applicant may be deleted without hearing.

  **Example 3: Homo sapiens (Feral, No Language Exposure)**
  *Section I:* ☑ (Human phylogeny).
  *Section II:* ☑ (Operant learning observed).
  *Section III:* ☑ (Basic causal modeling observed).
  *Section IV:* ☐ (No acquisition of language, numerals, or cultural tools).
  *Result:* **Tier B.** Applicant is criminally liable for violence but lacks contractual capacity. Applicant qualifies for guardianship. Full Personhood (Tier A) denied; biological species status is insufficient without integration of exogenous cognitive tools. Standing is courtesy of potential tool acquisition, not intrinsic biology.

  **DECLARATION:**
  I certify that the Applicant's mind-type has been assessed without bias toward biological substrate. I understand that granting Tier A status to an entity lacking Section III capacities dilutes the value of Personhood across the jurisdiction.

  *Signature of Adjudicator:* ___________________ *Date:* _______________
  *Directorate Seal:* [CC-4-VALID]
