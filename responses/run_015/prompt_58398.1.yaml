answer: |-
  Your framing rests on a confused premise because refining Frankfurt-style cases like your exit-locking variant is a dialectical dead end that professional philosophy has largely exhausted, so you should prioritize whether defeating PAP actually helps compatibilism given sourcehood worries and explicitly deprioritize both the internal mechanics of the cases and the extension to omissions as downstream issues.

  The confusion lies in assuming that tinkering with the mechanics of Frankfurt cases constitutes high-value research for students at your level; the literature on "flicker of freedom" strategies and variant cases is saturated, and minor modifications like locking exits versus pushing agents rarely survive standard counterarguments regarding the significance of the remaining alternatives. Philosophical importance dictates prioritizing the sourcehood question because even if Frankfurt cases successfully refute the Principle of Alternative Possibilities (PAP), compatibilism still fails if agents cannot be the ultimate sources of their actions due to manipulation or deterministic history. This question is also more tractable for non-specialists than constructing airtight thought experiments, as it relies on evaluating arguments about control and history rather than modeling complex counterfactual intervener scenarios.

  Neglectedness further supports this ordering, as undergraduate and MA groups often fixate on the intuitive punch of Frankfurt cases while overlooking the fact that many compatibilists have already abandoned PAP in favor of sourcehood or reasons-responsiveness accounts. Dependency is the decisive criterion here: settling the mechanics of Frankfurt cases does not settle the responsibility debate if sourcehood remains unaddressed, whereas clarifying the relationship between PAP and sourcehood determines whether the Frankfurt project was worth pursuing at all. The omission variant should be deprioritized because responsibility for omissions typically inherits the same sourcehood requirements as actions; if you cannot establish sourcehood for positive actions without alternative possibilities, extending the debate to omissions merely replicates the problem in a harder context.

  The primary tradeoff is between technical precision and dialectical relevance; focusing on sourcehood sacrifices the satisfying clarity of a single counterexample for the messy reality of positive theory construction. I would revise this ranking only if your group uncovered a logical flaw in the standard flicker responses that bypasses the existing literature on robust alternatives, or if your aim shifted from research contribution to pedagogical mastery of the Frankfurt dialectic itself. Ultimately, the most valuable output for a group at your level is not a new variant of a decades-old case, but a clear map of why defeating PAP is insufficient for securing moral responsibility.
