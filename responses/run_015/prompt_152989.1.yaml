prompt: |-
  I have recently been appointed to the board of the mutual insurance association that insures my own farm and most of my neighbours' holdings, as the member responsible for signing the statement on actuarial assumptions in our quarterly reserving filing. I am not a statistician by training — my formal background is an engineering degree with one graduate course in Bayesian methods — and the file comes back to me about four times a year, with roughly a week to work on it, an external reviewer who will not accept a prior whose justification is that it came with the software, and a set of assumptions that ends up minuted and binding on the premiums our members pay, including my own.

  The item now on my desk is the choice of priors for the parameters we have no useful data on. My predecessor's filing described these priors as non-informative, by which he appears to have meant that he placed a uniform distribution on whatever quantity the software happened to parameterise. Our reviewer's note says this is a concealed assumption rather than an absence of one, and I have been reading about the principle of indifference and Bertrand's chord problem in order to understand the objection. My provisional reading, which I set out so that you can tell me whether I have it right, is this: that the three classical answers to the chord problem show the principle of indifference to be simply inconsistent, since one and the same state of ignorance yields a probability of one third, one half, or one quarter depending on which construction one uses; and that the only workable remedy is therefore to fix one convention — always impose indifference on the parameter as presented, or always impose it on the logarithm of a positive parameter — and then apply it uniformly across every filing, so that at least our numbers are reproducible and consistent from quarter to quarter.

  What I need from you is a procedure I can actually run, not a discussion. Specifically:

  A sequence of steps, to be applied to each unknown parameter in turn, with a statement at each step of what would count as a sufficient answer and what would count as a failure. It must be runnable by me, in a spreadsheet, in the time I have.

  At each step, an explicit indication of where the procedure stops with a no — where the honest output is that no defensible ignorance prior exists for this parameter — and where it hands the decision back to a person because the remaining question is one of judgement rather than calculation. Please mark these hand-off points plainly rather than papering over them.

  A worked application to three parameters from our file: the standard deviation of claim sizes, which is positive and whose order of magnitude we genuinely do not know; the proportion of claims that settle without any payment, bounded between zero and one and otherwise unknown to us; and the shape parameter governing how heavy the upper tail of the claim-size distribution is, which is the quantity our reinsurance pricing most depends on and the one we have the least data about. I expect at least one of these to come back with an answer I will not like, and I would rather have that stated directly than have it softened.

  Some further requirements that I think matter, but which you should overrule if you think they are misguided:

  A reparameterisation stress test. For each parameter, I want to be able to write the sentence "we know nothing about this quantity" in three or four equivalent-sounding forms — about the quantity itself, about its square, about its logarithm, about its reciprocal — and see whether the resulting priors agree. Where they disagree, I take it my claim of ignorance was incomplete, and I want the procedure to say what I must then supply.

  An account of which distinctions have to survive the simplification and which can be dropped. I cannot carry the full theory into a board minute, but I also cannot afford to carry a version of it that is false. Tell me which is which.

  A rule for when the choice stops mattering. Some of these parameters will be pinned down by next year's data and some will not. I need to know how to tell the difference, and what I owe the reviewer in each case — whether a sensitivity analysis is an acceptable substitute for a principled choice, and in what regime it is not.

  Finally, a short closing section stating plainly what the procedure cannot do, and a note on the reading I described above: if my diagnosis of the chord problem, or my proposed remedy of fixing a single convention, is wrong, I would rather be corrected at the outset than have the procedure built on top of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Board member of a mutual insurance association (farm insurance). Responsible for signing actuarial assumptions (quarterly reserving).
      *   **Background:** Engineering degree, one grad course in Bayesian methods. *Not* a statistician/actuary.
      *   **Constraint:** ~1 week per quarter, must use a spreadsheet, external reviewer is strict (rejects "software default" priors), assumptions bind member premiums (including user's own).
      *   **Problem:** Choosing priors for parameters with no useful data. Predecessor used "uniform on software parameter" (called non-informative). Reviewer says this is a concealed assumption (Bertrand's Paradox style).
      *   **User's Diagnosis:** Principle of Indifference is inconsistent (Bertrand's Chord). Remedy: Fix a convention (e.g., always uniform on parameter or log-parameter) for reproducibility.
      *   **Request:**
          1.  A runnable procedure (steps, pass/fail criteria).
          2.  Explicit "Stop/No" points and "Hand-off to Judgment" points.
          3.  Worked application to 3 specific parameters (Claim SD, Zero-claim proportion, Tail shape).
          4.  Reparameterisation stress test included.
          5.  Distinction between what must survive simplification vs. what can be dropped.
          6.  Rule for when the choice stops mattering (data dominance vs. prior dominance).
          7.  Correction of the user's diagnosis (Chord problem & convention remedy).

  2.  **Evaluate the User's Diagnosis (Crucial Step):**
      *   *User's View:* Bertrand's Paradox shows the Principle of Indifference (PoI) is inconsistent. Remedy: Pick a convention (e.g., always uniform on $\theta$) and stick to it.
      *   *Statistical Reality:* The user is *half-right* but the proposed remedy is dangerous in an insurance context.
      *   *Bertrand's Paradox:* Yes, PoI is ill-defined without specifying the *method of selection*. In parameter estimation, this translates to parameterization invariance. A uniform prior on $\theta$ is *not* uniform on $\log(\theta)$ or $\theta^2$.
      *   *The Remedy:* "Fix a convention... and apply it uniformly" is *not* a sufficient statistical remedy for ignorance. It creates *bias*. If the physics/actuarial reality suggests a parameter should be scale-invariant (like claim size SD), a uniform prior on the linear scale implies small values are vanishingly unlikely compared to large values (relative to the log scale). If you fix "Uniform on $\theta$" as a convention, you are actively asserting knowledge (that the linear scale is the "true" scale).
      *   *Better Approach:* Reference Priors (Bernardo/Berger) or Jeffreys Priors are the standard "objective Bayesian" solution to parameterization invariance. However, for a non-statistician in a spreadsheet, Jeffreys priors are often calculable ($\propto \sqrt{I(\theta)}$).
      *   *Correction Needed:* I must correct the user's idea that "fixing a convention" solves the ignorance problem. It solves the *consistency* problem but introduces *arbitrary information*. The reviewer will likely reject "We chose Uniform on $\theta$ because we always choose Uniform on $\theta$." The reviewer wants *justification*.
      *   *Practical Compromise:* Since the user cannot derive Jeffreys priors easily in a spreadsheet for complex models, the procedure needs to guide them to *invariant* choices (like Uniform on Log for scale parameters) based on the *nature of the quantity*, not an arbitrary convention.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Needs to be spreadsheet-friendly.
      *   Needs clear Pass/Fail/Hand-off.
      *   *Step 1: Classification.* Is it a location, scale, or proportion? (This determines the invariant prior).
      *   *Step 2: Reparameterisation Test.* (User's request). Check if Uniform on $\theta$ matches Uniform on $\log \theta$.
      *   *Step 3: Data Dominance Check.* Will the data swamp the prior? (Rule for when it stops mattering).
      *   *Step 4: Sensitivity.* If prior matters, test alternatives.

  4.  **Developing the Worked Examples:**
      *   *Parameter 1: SD of claim sizes ($\sigma$).* Positive, scale parameter.
          *   *Prior:* Uniform on $\sigma$ is bad (not scale invariant). Uniform on $\log \sigma$ (Jeffreys for scale) is better.
          *   *Outcome:* User won't like this because it puts more weight on small values than a linear uniform prior.
      *   *Parameter 2: Proportion of zero claims ($p$).* Bounded [0,1].
          *   *Prior:* Uniform on $p$ (Beta(1,1)) is standard. But is it invariant? Arcsine transformation? Beta(1/2, 1/2) (Jeffreys) is often preferred for binomial proportions to handle boundaries.
          *   *Outcome:* Uniform is usually acceptable here, but Jeffreys is safer for "ignorance."
      *   *Parameter 3: Tail shape ($\xi$).* Real valued (usually), critical for reinsurance.
          *   *Prior:* Highly sensitive. No standard "ignorance" prior. Uniform on a bounded range is common but arbitrary.
          *   *Outcome:* **FAIL.** This requires expert judgment, not a mechanical prior. This is the "Hand-off" point.

  5.  **Addressing Specific Requirements:**
      *   *Reparameterisation Stress Test:* Explicitly build this into Step 2.
      *   *Distinctions:* What to keep in minutes? (Classification, Sensitivity result). What to drop? (Derivation of Jacobian).
      *   *When it stops mattering:* Posterior vs. Prior variance comparison.
      *   *Correction on Diagnosis:* Must be polite but firm. "Fixing a convention" is not a defense against "concealed assumption."

  6.  **Refining the Tone:**
      *   Professional, direct, respectful of the user's engineering background.
      *   No fluff. "Runnable" means actionable.
      *   Acknowledge the risk (mutual insurance, own farm at stake).

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Suggest Jeffreys Priors.
      *   *Correction:* User is in a spreadsheet. Calculating Fisher Information might be too hard.
      *   *Adjustment:* Provide the *standard invariant forms* (Uniform on Log for scale, Uniform on Proportion for rates) as lookup rules. This is "engineering" the statistics.
      *   *User's Remedy:* I need to explicitly tell them that "Fixing a convention" is *not* a valid defense to the reviewer. The reviewer wants *invariance*, not *consistency of arbitrariness*.
      *   *Tail Parameter:* This is the trap. If they use a flat prior on a tail index, they might underestimate ruin probability. I must flag this as a "Judgment Hand-off."

  8.  **Final Structure:**
      *   **Correction of Diagnosis:** Address the Bertrand/Convention view first.
      *   **The Procedure:** Step-by-step spreadsheet logic.
      *   **Worked Examples:** The three parameters.
      *   **Simplification Guide:** What goes in the minutes.
      *   **Data Dominance Rule:** When to stop worrying.
      *   **Limitations:** What this doesn't solve.

  9.  *(Self-Correction on the "Correction")*: I need to be careful not to overwhelm. The user wants a procedure. I will embed the correction into the rationale for Step 1. The core message: "Invariance, not Convention."

  10. *(Final check on constraints)*: Spreadsheet runnable? Yes. Pass/Fail markers? Yes. Hand-offs? Yes. 3 examples? Yes.

  Let's write it.cw
answer: |-
  ### Part 1: Correction of Diagnosis

  You asked to be corrected at the outset if your diagnosis is wrong. It is partially wrong, and acting on it will cause your filing to be rejected again.

  **The Error:** You propose fixing a convention (e.g., "always uniform on the parameter") to ensure reproducibility.
  **The Consequence:** This does not solve the problem of "concealed assumptions." It merely codifies one specific assumption. If you choose a uniform prior on a standard deviation $\sigma$, you are asserting that a value of $\sigma=100$ is just as likely as $\sigma=1$. But if you measure in cents instead of dollars, that same state of knowledge implies $\sigma=10,000$ cents is as likely as $\sigma=100$ cents. The mathematics changes based on your choice of units. The reviewer will reject this because it is not *invariant* to measurement scales.

  **The Remedy:** Do not fix a convention of *uniformity*. Fix a convention of *invariance*.
  *   For **scale parameters** (standard deviations, rates), ignorance implies invariance to multiplication. The mathematically consistent prior is **Uniform on the Logarithm** (equivalent to $1/\theta$ on the linear scale).
  *   For **proportions** (0 to 1), ignorance implies invariance to the specific mapping. The standard is **Jeffreys Prior** (Beta(0.5, 0.5)), though Uniform (Beta(1,1)) is often accepted if data is strong.
  *   For **shape parameters** (tail indices), there is no unique ignorance prior. This requires judgment.

  Your diagnosis of Bertrand's Chord is correct (Principle of Indifference is ill-defined without a selection method). Your proposed remedy (pick one method and stick to it) is administratively tidy but statistically indefensible. The procedure below uses *invariance* to satisfy the reviewer.

  ---

  ### Part 2: The Procedure (Spreadsheet Runnable)

  This procedure is designed to be executed in a spreadsheet tab labeled "Prior Justification."

  #### Step 1: Classification
  **Action:** For the parameter $\theta$, select its type from the dropdown list:
  1.  **Scale** (Positive, units matter, e.g., SD, rate).
  2.  **Proportion** (Bounded 0–1, e.g., probability).
  3.  **Location** (Real valued, additive shifts, e.g., mean claim cost).
  4.  **Shape** (Governs distribution form, e.g., tail index).

  *   **Pass:** You can definitively select one category.
  *   **Fail/Hand-off:** If the parameter fits multiple categories or you are unsure, **STOP**. Mark as "Requires Actuarial Judgment." Do not proceed to Step 2.
  *   **Minute Record:** "Parameter classified as [Type] based on [physical definition]."

  #### Step 2: The Invariance Selection
  **Action:** Apply the corresponding prior rule based on Step 1.
  *   If **Scale**: Set Prior Density $\pi(\theta) \propto 1/\theta$. (In spreadsheet: Sample from Uniform on $\log(\theta)$).
  *   If **Proportion**: Set Prior Density $\pi(\theta) \propto \theta^{-0.5}(1-\theta)^{-0.5}$. (In spreadsheet: Use Beta(0.5, 0.5)). *Note: If software forces a Uniform, note the bias.*
  *   If **Location**: Set Prior Density $\pi(\theta) \propto 1$. (Uniform).
  *   If **Shape**: **STOP**. Mark as "Requires Actuarial Judgment." There is no default ignorance prior for shape.

  *   **Pass:** You have selected a functional form.
  *   **Fail/Hand-off:** If your software cannot implement $1/\theta$ or Beta(0.5, 0.5) and forces Uniform on $\theta$, you must document the distortion in Step 3.

  #### Step 3: Reparameterisation Stress Test
  **Action:** Perform the following calculation in three adjacent cells.
  1.  Cell A: Calculate the prior probability that $\theta < \text{Median}$ using your chosen prior. (Should be 0.5).
  2.  Cell B: Define $\phi = \log(\theta)$ (for scale) or $\phi = \theta^2$. Calculate the implied prior on $\phi$. Is it Uniform?
  3.  Cell C: Define $\psi = 1/\theta$. Calculate the implied prior on $\psi$.

  *   **Sufficient Answer:** For Scale parameters, the prior on $\log(\theta)$ must be Uniform. For Proportions, the prior should be symmetric around 0.5 (unless data dictates otherwise).
  *   **Failure Condition:** If you chose Uniform on $\theta$ (linear) for a Scale parameter, Cell B will show a non-uniform prior on the log scale.
  *   **Decision Rule:** If Cell B shows strong bias (e.g., implies huge values are vastly more likely than small values purely due to math), you must revert to Step 2 (Log-Uniform).
  *   **Minute Record:** "Prior verified for scale invariance; uniform on log-scale adopted."

  #### Step 4: Data Dominance Check (The "Stop Mattering" Rule)
  **Action:** Compare the "Information Content" of the Prior vs. the Data.
  *   Calculate $N_{eff}$ (Effective Sample Size of the Prior).
      *   For Beta(0.5, 0.5), $N_{eff} = 1$.
      *   For Log-Uniform on SD, approximate $N_{eff}$ based on the width of the credible interval relative to the data variance. (Simplification: If the 95% prior interval spans 3 orders of magnitude, treat $N_{eff} \approx 0$).
  *   Compare $N_{eff}$ to $N_{data}$ (Number of claims/observations this quarter).

  *   **Rule:**
      *   If $N_{data} > 10 \times N_{eff}$: **Prior Choice Does Not Matter.** You may proceed with the Step 2 default. Sensitivity analysis is optional.
      *   If $N_{data} \le 10 \times N_{eff}$: **Prior Choice Matters.** You must run Step 5.
  *   **Minute Record:** "Data volume ($N=$) exceeds prior effective size by factor of $X$; posterior driven by data." OR "Data sparse; prior sensitivity tested."

  #### Step 5: Sensitivity Analysis (Required if Step 4 Fails)
  **Action:** Run the reserving model twice.
  1.  Run A: Using the Step 2 Invariant Prior.
  2.  Run B: Using a "Conservative" Prior (e.g., one that shifts mass toward higher reserves/higher tail risk).
  3.  Calculate the % difference in the final Reserve Figure.

  *   **Pass:** Difference < 5% (or your board's materiality threshold). File Run A. Note the sensitivity in minutes.
  *   **Fail/Hand-off:** Difference > 5%. **STOP.** You cannot sign this filing based on mechanical rules. You must convene the Actuarial Committee to select a prior based on industry benchmarks, not ignorance.
  *   **Minute Record:** "Sensitivity analysis showed reserve variance of X%; deemed material/immaterial."

  ---

  ### Part 3: Worked Application to Your Three Parameters

  Here is how the procedure handles the specific items on your desk.

  #### 1. Standard Deviation of Claim Sizes ($\sigma$)
  *   **Step 1 (Classify):** Scale Parameter (Positive, units matter). **Pass.**
  *   **Step 2 (Select):** Rule is Uniform on $\log(\sigma)$ (Density $\propto 1/\sigma$).
  *   **Step 3 (Stress Test):**
      *   Uniform on $\sigma$ (Predecessor's method): Implies $\sigma=1000$ is 100 times more likely than $\sigma=10$ (relative to log measure).
      *   Uniform on $\log(\sigma)$ (Required): Implies orders of magnitude are equally likely.
      *   **Result:** You will likely **not like this**. The $1/\sigma$ prior places much more probability mass on *small* standard deviations than a linear uniform prior does. It suggests "quiet" years are more probable than "volatile" years absent data.
  *   **Step 4 (Data):** If you have >50 claims, data swamps this. If <10 claims, proceed to Step 5.
  *   **Verdict:** **Defensible.** You must use Log-Uniform to satisfy the reviewer's invariance requirement. Do not use Linear Uniform.

  #### 2. Proportion of Claims Settling at Zero ($p$)
  *   **Step 1 (Classify):** Proportion (Bounded 0–1). **Pass.**
  *   **Step 2 (Select):** Rule is Jeffreys Prior Beta(0.5, 0.5).
      *   *Note:* Your software may default to Uniform Beta(1,1).
  *   **Step 3 (Stress Test):**
      *   Beta(1,1) implies the proportion is equally likely to be 0.1, 0.5, or 0.9.
      *   Beta(0.5,0.5) implies the proportion is more likely to be near 0 or 1 (U-shaped).
      *   **Reasoning:** True ignorance about a probability suggests it could be a rare event or a common event. Uniform biases toward the middle (0.5).
  *   **Step 4 (Data):** Zero-claim proportions usually have high data counts (thousands of claims). $N_{data}$ will likely swamp $N_{eff}=1$.
  *   **Verdict:** **Safe.** Even if you use Uniform (Beta 1,1) for simplicity, the data volume likely renders the difference immaterial. Document that Uniform was used for simplicity but Data Dominance applies.

  #### 3. Tail Shape Parameter ($\xi$)
  *   **Step 1 (Classify):** Shape Parameter.
  *   **Step 2 (Select):** **FAIL.**
      *   There is no invariant "ignorance" prior for tail shape. A uniform prior on $[0, 1]$ implies a hard cutoff at 1. A uniform prior on $[0, \infty)$ is improper and may lead to infinite reserves.
      *   This parameter dictates the probability of a farm-ruining loss. "Ignorance" is not a valid stance here.
  *   **Hand-off Point:** This **must** be handed back to a person (Chief Actuary or Board Risk Committee).
  *   **Required Action:** You cannot sign a mechanical prior for this. You need a minute stating: *"The tail parameter was set to X based on industry reinsurance benchmarks / regulatory capital standards, not on statistical ignorance, due to the material impact on solvency."*
  *   **Verdict:** **Do not apply the procedure.** If you apply a flat prior here, you are accepting unquantified ruin risk. The reviewer will likely flag this as the critical item.

  ---

  ### Part 4: Simplification for the Board Minute

  You cannot paste the math above into the minutes. Use this mapping:

  | Concept | Keep in Minute (True) | Drop from Minute (Safe Simplification) |
  | :--- | :--- | :--- |
  | **Bertrand's Paradox** | "Priors were selected to ensure results do not depend on arbitrary units of measurement." | Do not mention "Principle of Indifference" or "Paradoxes." |
  | **Log-Uniform** | "For scale parameters, we assume equal probability per order of magnitude." | Do not write "$\pi(\theta) \propto 1/\theta$". |
  | **Data Dominance** | "For high-volume parameters, the data overwhelms the initial assumption." | Do not cite "Effective Sample Size." |
  | **Tail Shape** | "This assumption was set based on industry benchmarking due to high sensitivity." | Do not claim this is an "ignorance prior." |
  | **Sensitivity** | "We tested alternative assumptions and the reserve impact was X%." | Do not list the specific alternative distributions unless asked. |

  **The False Version to Avoid:** "We used non-informative priors." (This is what got your predecessor in trouble).
  **The True Version:** "We used reference priors invariant to measurement scale, subject to sensitivity testing."

  ---

  ### Part 5: When the Choice Stops Mattering

  You asked for a rule on when to stop worrying. Use the **10% Variance Rule**.

  1.  Run the model with your chosen "Ignorance" Prior. Record the Reserve $R_1$.
  2.  Run the model with a "Stiff" Prior (e.g., force the SD to be exactly the sample SD, or the Tail to be fixed at 0.5). Record the Reserve $R_2$.
  3.  Calculate $\Delta = |R_1 - R_2| / R_1$.

  *   **If $\Delta < 5\%$:** The choice does not matter. You owe the reviewer a note stating: *"Sensitivity analysis confirms prior choice has negligible impact on reserves given current data volume."*
  *   **If $\Delta > 5\%$:** The choice matters. You owe the reviewer a **Justification**. You can no longer claim ignorance. You must justify why Prior 1 is better than Prior 2 using external evidence (industry data, regulatory minimums).

  **Regime where Sensitivity is NOT a substitute:**
  If the parameter is the **Tail Shape** (Parameter 3 above) and the business writes high-excess coverage. In this regime, the prior *is* the reserve. Sensitivity analysis will show massive swings. You cannot average them. You must pick the one that aligns with the association's risk appetite (solvency), not statistical convenience.

  ---

  ### Part 6: Limitations and Closing

  **What this procedure cannot do:**
  1.  **It cannot create information.** If you have no data on the tail, no prior will tell you the true risk. It only formalizes your uncertainty.
  2.  **It cannot protect against model error.** If the claim distribution is not the one you are fitting (e.g., you assume Pareto but it is LogNormal), the prior is irrelevant.
  3.  **It cannot replace judgment on solvency.** For a mutual insurer, the "correct" prior for a tail parameter may be the one that ensures survival, not the one that is mathematically invariant.

  **Final Note on Your Reading:**
  Your diagnosis of the Chord Problem is correct: "Ignorance" is not enough; you must specify the *method of generation*.
  Your proposed remedy (fix a convention) is **incorrect**.
  *   **Why:** If you fix "Uniform on Linear Scale" as a convention, you are implicitly betting that large values are more probable than small values (in log space). In insurance, betting that volatility is high when you don't know is prudent, but betting that volatility is *low* (which Uniform on Linear often does relative to Log-Uniform for small values) is dangerous.
  *   **Correction:** The convention must be **Invariance**, not Uniformity. Use Log-Uniform for scales. This is the only "convention" that survives the reviewer's test of "what if we measured claims in cents instead of dollars?"

  **Summary Instruction:**
  1.  Classify parameters (Scale vs. Proportion vs. Shape).
  2.  Apply Invariant Priors (Log-Uniform for Scale, Jeffreys for Proportion).
  3.  Hand-off Shape parameters to Judgment/Benchmarking.
  4.  Run Sensitivity Check. If >5% impact, justify via Risk Appetite, not Statistics.
