prompt: |-
  I'm putting together a set of standards for what counts as a serious account of genuine moral dilemmas, and I want them in place before I start reading. Write out the requirements an adequate theory has to meet — the cases it must get right, the distinctions it can't collapse (a no-good-option case versus a lesser-evil case, the agent's epistemic perspective versus the actual moral landscape, doing wrong versus being blameworthy), the intuitions it must preserve — with the consideration behind each. Tell me which of these are non-negotiable and which are just preferences of one camp, flag any pair you suspect can't be jointly satisfied, and say which requirement, if a theory fails it, most clearly shows the theory has missed the point.
reasoning: |-
  Here's a thinking process that leads to the suggested standards for moral dilemma theories:

  1.  **Deconstruct the Request:**
      *   **Goal:** Create a set of standards/criteria for evaluating theories of *genuine moral dilemmas*.
      *   **Context:** The user is preparing to read philosophical literature on this topic and wants a framework to judge adequacy.
      *   **Specific Requirements:**
          *   List requirements (cases to get right, distinctions to maintain, intuitions to preserve).
          *   Provide the consideration/rationale behind each.
          *   Flag which are non-negotiable vs. camp-specific preferences.
          *   Identify potential incompatibilities (pairs that can't be jointly satisfied).
          *   Identify the "killer criterion" (failure here means missing the point entirely).
      *   **Tone:** Philosophical, rigorous, structured, analytical.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *What is a moral dilemma?* Roughly: A situation where an agent ought to do A, ought to do B, but cannot do both.
      *   *Key Debate:* Do genuine dilemmas exist? (Impossibility of "Ought implies Can" vs. phenomenological experience).
      *   *Key Distinctions:*
          *   Ontic (real conflict of duties) vs. Epistemic (uncertainty about duties).
          *   Symmetrical (two equal duties) vs. Asymmetrical (lesser evil).
          *   Wrongdoing vs. Blameworthiness (residue).
          *   "Ought implies Can" (Kantian) vs. "Ought does not imply Can" (Existential/Tragic).
      *   *Key Cases:* Sophie's Choice, Sartre's Student, Agamemnon, Conflicting Promises.
      *   *Key Intuitions:* Regret, Residue, Tragedy, Agent-Integrity.

  3.  **Drafting the Standards (Iterative Process):**

      *   *Requirement 1: The Definition.* Must distinguish genuine dilemmas from mere uncertainty.
          *   *Distinction:* Ontic vs. Epistemic.
          *   *Rationale:* If it's just not knowing, logic can solve it. Genuine dilemmas are structural.
          *   *Status:* Non-negotiable.

      *   *Requirement 2: The "Ought Implies Can" Constraint.*
          *   *Issue:* If I can't do both, can I really be obligated to do both?
          *   *Distinction:* Overriding obligation vs. Prima facie obligation.
          *   *Rationale:* Logical consistency vs. Moral experience.
          *   *Status:* This is the main battleground. I need to flag this as a potential incompatibility point.

      *   *Requirement 3: Wrongdoing vs. Blame.*
          *   *Issue:* If I *must* choose one, am I doing wrong? If I'm not doing wrong, why the guilt?
          *   *Distinction:* Objective wrong vs. Subjective blame/excuse.
          *   *Rationale:* Explains moral residue (guilt/regret) without condemning the agent unfairly.
          *   *Status:* Non-negotiable for a *phenomenologically* adequate theory.

      *   *Requirement 4: Symmetrical vs. Asymmetrical.*
          *   *Issue:* Sophie's Choice (two children) vs. Trolley Problem (kill one to save five).
          *   *Distinction:* No-good-option vs. Lesser-evil.
          *   *Rationale:* A theory that treats them the same misses the tragedy of the former.
          *   *Status:* Non-negotiable for capturing the *range* of dilemmas.

      *   *Requirement 5: Moral Residue.*
          *   *Issue:* After choosing, does the agent feel okay?
          *   *Intuition:* Appropriate regret/remorse is required.
          *   *Rationale:* If the agent feels nothing, they are sociopathic. If they feel crushed, the theory must explain why.
          *   *Status:* Non-negotiable.

      *   *Requirement 6: Action-Guidance.*
          *   *Issue:* Does the theory tell me what to do?
          *   *Intuition:* Ethics is practical.
          *   *Rationale:* A theory that says "you're doomed" without guidance is depressing but maybe true. A theory that says "just calculate" might miss the point.
          *   *Status:* Preference/Debated.

  4.  **Refining and Categorizing (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Ontic/Epistemic distinction, Wrongdoing/Blame distinction, Moral Residue. (Without these, you aren't talking about *dilemmas*, you're talking about confusion or calculation).
      *   *Preferences/Camp-Specific:* Adherence to "Ought implies Can" (Kantians vs. Pluralists), Symmetry requirements (some deny symmetrical dilemmas exist), Action-guidance priority.
      *   *Incompatibility:* "Ought implies Can" + "Genuine Ontic Dilemmas exist." You generally have to drop one or redefine "ought."

  5.  **Identifying the "Killer Criterion":**
      *   If a theory cannot explain *Moral Residue* (the lingering guilt/regret even after the "right" choice), it fails to capture the *experience* of the dilemma. It reduces tragedy to arithmetic.
      *   *Alternative:* If it collapses Ontic and Epistemic, it denies the phenomenon exists.
      *   *Decision:* The collapse of Ontic vs. Epistemic is the most fundamental error. It denies the subject matter. But the failure to account for Residue is the most common failure of *normative* theories. Let's go with the Ontic/Epistemic collapse as the "missing the point" error, because it dissolves the dilemma into ignorance.

  6.  **Structuring the Output:**
      *   Introduction: Acknowledge the task.
      *   Section 1: The Non-Negotiables (Conceptual Boundaries).
      *   Section 2: The Phenomenological Requirements (Experience of the Agent).
      *   Section 3: The Logical Constraints (Metaphysical/Logical consistency).
      *   Section 4: The Incompatibility Warning (The "Hard Trade-off").
      *   Section 5: The "Killer Criterion."
      *   Conclusion: Summary advice.

  7.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to clearly distinguish "Lesser Evil" from "No-Good Option." In a lesser evil, one option is right. In a no-good option, both are wrong (or both are equally binding but mutually exclusive).
      *   *Refinement:* Ensure the distinction between "Objective Wrongdoing" and "Subjective Blameworthiness" is clear. This is crucial for the "dirty hands" problem.
      *   *Tone Check:* Keep it authoritative but neutral. I am setting up the user's framework, not arguing for one side (though I must highlight where sides diverge).

  8.  **Final Review against Prompt:**
      *   Requirements listed? Yes.
      *   Considerations behind each? Yes.
      *   Non-negotiable vs. Preferences flagged? Yes.
      *   Incompatible pairs identified? Yes.
      *   "Missed the point" failure identified? Yes.

  9.  **Final Polish:** Check for clarity and philosophical precision (e.g., using terms like "prima facie," "all-things-considered," "moral residue"). (Proceed to generate output).

