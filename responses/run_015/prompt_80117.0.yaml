answer: |-
  Here is a framework of standards for evaluating theories of genuine moral dilemmas. These are structured by conceptual necessity, phenomenological adequacy, and logical coherence.

  I have categorized them into **Non-Negotiables** (requirements for the theory to be about *dilemmas* at all), **Contested Ground** (where philosophical camps diverge), and **Structural Tensions** (where requirements may conflict).

  ### I. The Non-Negotiables (Conceptual Boundaries)
  *If a theory fails these, it is not an account of moral dilemmas; it is an account of something else (e.g., ignorance, weakness of will, or simple calculation).*

  #### 1. The Ontic/Epistemic Distinction
  *   **Requirement:** The theory must distinguish between a conflict in the world (two objective duties genuinely clash) and a conflict in the mind (the agent lacks information about which duty applies).
  *   **Consideration:** An epistemic uncertainty is solvable with more data. A genuine ontic dilemma persists even with perfect knowledge. If a theory reduces all dilemmas to "you just didn't know enough," it denies the existence of the phenomenon you are studying.
  *   **Status:** **Non-Negotiable.**

  #### 2. The Distinction Between Wrongdoing and Blameworthiness
  *   **Requirement:** The theory must allow for the possibility that an agent can commit an objective moral wrong (violate a binding norm) without being subject to appropriate blame or sanction.
  *   **Consideration:** In a genuine dilemma, the agent *must* violate *some* norm. If violating a norm automatically entails full culpability, the agent is condemned for doing what was unavoidable. If violating a norm entails *no* wrongness, the norm wasn't binding. The theory must decouple the act's status from the agent's culpability.
  *   **Status:** **Non-Negotiable.**

  #### 3. The Symmetrical/Asymmetrical Distinction
  *   **Requirement:** The theory must distinguish between a "Lesser-Evil" case (one option is morally preferable, but costly) and a "No-Good-Option" case (options are morally symmetrical or equally catastrophic).
  *   **Consideration:** The Trolley Problem (kill one to save five) is asymmetrical; *Sophie's Choice* (choose which child dies) is symmetrical. A theory that treats these identically fails to capture the specific tragedy of symmetrical dilemmas, where there is no moral justification for the choice, only necessity.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. The Phenomenological Requirements (Experience of the Agent)
  *If a theory fails these, it may be logically consistent, but it will feel alien to the moral experience it attempts to describe.*

  #### 4. The Explanation of Moral Residue
  *   **Requirement:** The theory must explain why "appropriate regret" or "agent-regret" persists even after the agent has made the best possible choice.
  *   **Consideration:** If an agent walks away from a dilemma feeling perfectly clean because they "did the right thing," they lack moral sensitivity. A theory must account for why the agent feels stained, grieving, or compromised despite acting correctly (or necessarily).
  *   **Status:** **Non-Negotiable for Adequacy.** (Theories can fail this and remain logically sound, but they fail to capture the *human* reality).

  #### 5. Preservation of Agent-Integrity
  *   **Requirement:** The theory must acknowledge that dilemmas threaten the agent's moral identity, not just their action ledger.
  *   **Consideration:** Dilemmas aren't just math problems; they are threats to who the agent *is*. A theory that reduces the dilemma to a utilitarian calculus misses the cost to the agent's character and integrity.
  *   **Status:** **Preference (Virtue/Ethics of Care Camp).** Consequentialists often view integrity as secondary to outcomes.

  ---

  ### III. The Logical Constraints (Metaphysical Consistency)
  *This is where the major philosophical battles are fought.*

  #### 6. Adherence to "Ought Implies Can" (OIC)
  *   **Requirement:** The theory must state whether it upholds the Kantian principle that if an agent cannot do X, they cannot be obligated to do X.
  *   **Consideration:** If OIC holds, genuine dilemmas (where one ought to do A and ought to do B, but cannot do both) are logically impossible. To allow dilemmas, the theory must either reject OIC or redefine "ought."
  *   **Status:** **Contested Ground.** (Kantians/Utilitarians usually keep OIC and deny dilemmas; Existentialists/Pluralists keep dilemmas and modify OIC).

  #### 7. Action-Guidance
  *   **Requirement:** The theory must provide a determinate answer to "What should I do?"
  *   **Consideration:** Ethics is practical. A theory that says "You are doomed, both choices are wrong" is tragic but potentially useless. A theory that says "Pick one, it doesn't matter" is action-guiding but potentially nihilistic.
  *   **Status:** **Preference (Deontic Logic Camp).** Some argue the point of dilemma theory is to explain tragedy, not to solve it.

  ---

  ### IV. Structural Tensions (Incompatible Pairs)
  *You likely cannot satisfy both members of these pairs simultaneously. You must choose which to prioritize.*

  #### Tension A: Logical Consistency vs. Phenomenological Accuracy
  *   **The Conflict:** To be logically consistent (avoiding contradictory obligations), a theory usually has to deny that genuine dilemmas exist (claiming one duty always overrides). To be phenomenologically accurate (capturing the feeling of inescapable conflict), the theory usually has to tolerate logical contradiction (two all-things-considered 'oughts').
  *   **The Trade-off:** Do you want a clean logic that denies the tragedy, or a messy logic that preserves the tragedy?

  #### Tension B: Objective Wrongness vs. Moral Residue
  *   **The Conflict:** If the theory says the agent did the *right* thing (all-things-considered), it is hard to explain why they should feel guilt (Residue). If the theory says the agent did the *wrong* thing, it is hard to explain why they aren't fully blameworthy.
  *   **The Trade-off:** Most successful theories split the difference (e.g., "You did the right thing, but you violated a binding norm"), but this requires complex metaphysical machinery.

  ---

  ### V. The Verdict Criteria

  #### Which requirements are mere preferences?
  *   **Adherence to "Ought Implies Can":** This is the main dividing line. If you demand a theory keep OIC, you automatically rule out most "tragic" realist accounts. If you demand a theory allow dilemmas, you rule out strict Kantianism. This is a metaphysical preference, not a standard of clarity.
  *   **Action-Guidance:** Demanding a theory tell you *what to do* privileges normative ethics over meta-ethics. Some theories are descriptive of the tragedy, not prescriptive of the solution.

  #### Which pair is likely impossible to jointly satisfy?
  *   **Standard Deontic Logic + Genuine Ontic Dilemmas.** In standard logic, if you ought to do A and ought to do B, you ought to do (A and B). If (A and B) is impossible, you have a contradiction. To satisfy both, you must adopt a non-standard logic (e.g., paraconsistent logic), which most mainstream theories reject.

  #### The "Killer Criterion" (Missing the Point)
  If a theory fails **Requirement #1 (The Ontic/Epistemic Distinction)**, it has most clearly missed the point.

  *   **Why:** If a theory collapses a genuine dilemma into a state of ignorance (e.g., "If you knew the full consequences, you'd see there was no conflict"), it has not analyzed a moral dilemma; it has analyzed a lack of information. It dissolves the subject matter rather than explaining it. It turns *Sophie's Choice* into a math problem she just didn't have the variables for. This eliminates the tragedy, which is the core feature of the phenomenon you are investigating.

  *   **Runner Up:** If a theory fails **Requirement #4 (Moral Residue)**, it has missed the *moral* point. It treats the agent as a calculator rather than a moral being. While logically permissible, it renders the theory useless for understanding human ethical experience.

  ### Summary Checklist for Your Reading
  When evaluating a text, ask:
  1.  **Does it admit ontic conflicts?** (Or does it reduce them to ignorance?)
  2.  **How does it handle "Ought Implies Can"?** (Does it break logic or break the dilemma?)
  3.  **Does it explain the guilt?** (If the agent chooses the "right" option, why do they still suffer?)
  4.  **Does it distinguish Sophie from the Trolley?** (Symmetry vs. Asymmetry).

  If a text fails #1, put it down; it's not about dilemmas. If it fails #3, note it as a "cold" theory (logically robust, humanly sterile). If it struggles with #2, note which metaphysical cost it chose to pay.
