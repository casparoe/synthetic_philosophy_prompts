answer: |-
  1. Standing here today, surrounded by everyone who loves you, the reasons to make this promise are overwhelming and obvious. But we all know a vow isn't a prediction about how good things will feel when the crowd goes home and the reasons start to fade.

  2. It is tempting to think that promising is just betting on your future self having the same incentives you have right now. But that would make this ceremony merely a forecast, and Tom knows better than to treat a commitment like a prediction.

  3. The truth is that saying these words doesn't just describe what you plan to do, it creates the reason to do it when nothing else remains. You are not binding your future self based on what he will want, but on what you decide to stand for.

  4. So this isn't about guaranteeing that the calculus of happiness will always balance in your favor. It is about deciding that the person standing opposite you is worth the cost when the numbers stop adding up.

  5. I raise my glass to the both of you, not for the easy intention of today, but for the hard fidelity of all the tomorrows where you stay simply because you promised.
