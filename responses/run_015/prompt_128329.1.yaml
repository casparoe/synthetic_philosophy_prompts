  You've got a sharp intuition there. You're right to separate the epistemic problem from the causal structure. Your Mechanism A is the epistemic engine of the Unilateralist's Curse, while Mechanism B is the causal structure of the payoff function. The "Curse" specifically refers to Mechanism A.

  The Unilateralist's Curse arises because agents fail to condition their decision on the fact that they are part of a selected subset. Even with a common prior, if agents receive private signals and act independently, those who choose to act are statistically likely to be those who received overly optimistic signals. This is a selection effect. If your agents are "perfectly calibrated" in the sense that they are perfect Bayesians who fully model this selection effect (i.e., they discount their signal based on the probability that others are also acting), the curse disappears. They would realize that being the type willing to act implies their signal is likely an outlier. However, if "calibrated" just means their signals are unbiased but they don't model the correlation between their willingness and others', Mechanism A still bites. The Curse is fundamentally a failure to fully update on the reference class of other potential unilateralists.

  Mechanism B—the threshold externality—is what makes the outcome *bad*, but it isn't the *Curse* itself. You can have Mechanism B without the Curse (e.g., if everyone knows the true value but lacks coordination, it's just a coordination game). You can also have Mechanism A without Mechanism B (e.g., if the harm is linear, you still overact, but there's no sharp cliff). The Curse is the explanation for why rational agents overact despite the risk.

  Regarding the non-monotone case (1 good, 2-4 bad, 5+ good): Mechanism A still applies. Agents acting because they think it's beneficial might cluster in the "2-4" zone because they fail to account for how many others are similarly convinced. The epistemic failure remains identical; only the payoff landscape changes. It doesn't create a new problem, just makes the consequences of Mechanism A more complex. You're still dragging the outcome toward the bad end because you're overestimating the safety of your unilateral action.

  Finally, coordination fixes both, but in different ways. Communication solves Mechanism A by pooling private information. If everyone shares their signals, the noise cancels out, and the group arrives at a more accurate common estimate, removing the selection bias. Coordination solves Mechanism B by allowing the group to set quotas or randomize actions to ensure the threshold isn't crossed. So yes, the usual fix touches both: it corrects the epistemic error and manages the causal externality.

  For your pset, the key takeaway is that the Unilateralist's Curse is primarily an epistemic problem (Mechanism A) occurring within a specific causal structure (Mechanism B). Without the selection bias, it's just a standard collective action problem.
