  Right, I need a thought experiment for a metaphysics seminar — material constitution, but not the statue-and-lump thing everyone parrots. Build me a one-paragraph scenario with an ordinary object made of clay or wood where there's two seperate transformations: in the first, the constitution view (object constituted by its matter, not identical) says it survives whilst the identity view says it doesn't; in the second transformation, the verdicts flip. Keep it realistic — no teleportation, no brains in vats, just physical change — and inject something weirder than a sculpture; maybe a functional object with some legal or ceremonial weight. One paragraph max for the scenario.

  After that, walk through the reasoning for both theories on both transformations, point out which feature is actually driving the disagreement (modal flexibility? functional role? relational properties?), and say what happens if you strip that feature away — does the case collapse back into the standard puzzle? Finally, briefly, how would an identity-theorist attack your scenario — which specific premise they'd deny, not just "that's rubbish". Don't cite anyone, I just want the machinery laid out.
