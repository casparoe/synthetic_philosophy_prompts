answer: |-
  Consider the Speaker's Mace, a ceremonial wooden rod carved from a single beam of historic oak, legally required to be present for any parliamentary session to be valid. In the first transformation, over ten years, every fiber of the original oak is secretly replaced with indistinguishable new oak to prevent rot, maintaining the exact shape and ceremonial role without interruption. In the second transformation, the original intact Mace is decommissioned, stripped of its legal status by an act of parliament, sanded smooth to remove its distinctive carvings, and sold as a generic wooden beam for use in a private construction project, its matter remaining entirely continuous throughout the process.

  ***

  **Reasoning and Analysis**

  In the first transformation (replacement), the Constitution View holds the Mace survives because its persistence conditions are tied to its functional and historical continuity, not its specific particles; the Identity View denies survival because the object is identical to the wood, and since the original wood is gone, the object is gone. In the second transformation (repurposing), the verdicts flip: the Constitution View says the Mace ceases to exist because it loses the essential ceremonial function that defines its sortal category, while the Identity View says it survives because the underlying matter remains spatio-temporally continuous.

  The feature driving this disagreement is **sortal-dependent persistence conditions** versus **material continuity**. The Constitution View relies on the concept "Mace" carrying essential functional properties that differ from the essential properties of "Wood." The Identity View rejects this, arguing persistence is solely a matter of physical continuity. If you strip the ceremonial/legal weight and treat the object merely as "a shaped piece of wood," the case collapses back into the standard puzzle; without the functional sortal, the Constitution View loses the leverage to claim the object ceases in the second transformation, and both views would likely agree the object survives both changes (assuming wood can survive replacement) or ceases both (assuming wood cannot), removing the divergent verdicts.

  An Identity Theorist would attack the scenario by denying the premise that **constitution is not identity**. Specifically, they would reject the claim that the Mace and the Wood have different modal profiles. They would argue that in the first transformation, the Mace strictly ceases to exist and is merely replaced by a qualitatively similar successor, and in the second, the Mace simply changes properties. They deny the ontological coherence of two distinct objects occupying the same space with different persistence conditions, asserting that our intuition of "survival" in the first case is loose speech, not metaphysical fact.
