  The first model fits the tube quite well,
  And scores on being simple, neat.
  It rings a known chemical bell,
  But fails to make the map complete.

  The second borrows from the known,
  A fold that rests within the bank.
  The phases fall into place like stone,
  But needs too many blanks to rank.

  The third suggests a new domain,
  It points to where the light might bend.
  But fits the noise inside the chain,
  And fails to make the edges end.

  The fourth is smooth and clean and tight,
  It wins on grace and high degree.
  It holds the helix in the light,
  The best of all that we can see.

  Except the loop where density dissolves,
  Into a grey we cannot build.
