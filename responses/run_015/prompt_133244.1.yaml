  # Heritability Coefficient Classification Tree

  **Instructions:** Begin at the **Root Case**. Answer the question at each node to traverse the branches. Continue until you reach a **Leaf**. The leaves classify your philosophical stance on the meaning and utility of heritability coefficients ($h^2$).

  ---

  ### **ROOT CASE: The Divergence**
  A well-powered twin study reports $h^2 \approx 0.65$ for a working-memory task in a homogeneous cohort. A replication with broader socioeconomic and ethnic diversity finds $h^2 \approx 0.30$ for the same task.

  ---

  ### **NODE 1: Ontology and Divergence Explanation**
  **Question:** Does the reduction from 0.65 to 0.30 indicate that heritability is a stable property of the *trait mechanism* (where the drop reflects increased environmental variance, $V_E$, masking the genetic signal), or is it a relational property of the *trait-in-population pair* (where the drop reflects a restructuring of Gene-Environment covariance, $rGE$, altering the variance partition itself)?

  *   **Branch A:** Stable Trait Property (Drop = Increased $V_E$)
  *   **Branch B:** Relational Population Property (Drop = Restructured $rGE$)

  ---

  ### **NODE 2: The Causal-Statistical Distinction**
  *(Note: This node turns on the non-obvious distinction regarding causal potency.)*
  **Question:** Regardless of the explanation in Node 1, does the heritability coefficient measure the **comparative causal potency** of genetic differences versus environmental differences, or is it strictly a **variance-partitioning statistic** describing observed dispersion without comparative causal weight?

  *   **Branch A:** Comparative Causal Potency
  *   **Branch B:** Pure Variance-Partitioning

  ---

  ### **NODE 3: Inferential License**
  **Question:** Does the coefficient license downstream inferences regarding **individual-level etiology** (predicting genetic contribution for a specific person) OR **intervention efficacy** (predicting that environmental changes will have limited effect in high-$h^2$ populations)?

  *   **Branch A:** Yes (Licenses Individual/Intervention Inference)
  *   **Branch B:** No (Silent on Individual/Intervention Inference)

  *(Note: If you selected **Pure Variance-Partitioning** at Node 2, selecting "Yes" here implies the statistic is predictively useful despite lacking causal weight. Selecting "No" implies it is merely descriptive.)*

  ---

  ### **LEAVES (Classification Positions)**

  #### **Path 1A-2A-3A**
  **Label:** **Biometric Realism**
  **Diagnosis:** Asserts heritability reflects a stable causal architecture of the trait; high $h^2$ implies genetic determination at the individual level and limits to environmental intervention.

  #### **Path 1B-2A-3A**
  **Label:** **Contextualist Causal Pluralism**
  **Diagnosis:** Accepts causal potency but insists it is population-specific; high $h^2$ licenses intervention predictions only within the specific cohort measured, not across diverse populations.

  #### **Path 1A-2A-3B**
  **Label:** **Causal Realist / Intervention Skeptic**
  **Diagnosis:** Maintains genes have causal potency and the trait is stable, but denies that population-level $h^2$ translates to individual etiology or fixed intervention limits (often due to G-E interaction concerns).

  #### **Path 1B-2A-3B**
  **Label:** **Unnamed Position**
  **Diagnosis:** **Unattractive/Unstable:** Claims causal potency is population-relative but denies this relativity licenses any specific intervention predictions, rendering the causal claim practically inert.

  #### **Path 1A-2B-3A**
  **Label:** **Quantitative-Genetic Instrumentalism**
  **Diagnosis:** Treats $h^2$ as a non-causal statistical tool that is nonetheless predictively valid for individuals and interventions within the homogeneous population where it was measured.

  #### **Path 1B-2B-3A**
  **Label:** **Empirical Pragmatism**
  **Diagnosis:** Treats $h^2$ as a population-specific statistical summary that retains predictive utility for breeding or policy within that specific context, devoid of causal claims.

  #### **Path 1A-2B-3B**
  **Label:** **Strict Statistical Descriptivism**
  **Diagnosis:** Views $h^2$ as a variance description with no causal weight and no predictive utility beyond describing the sample from which it was derived.

  #### **Path 1B-2B-3B**
  **Label:** **Developmental-Systems Interactionism**
  **Diagnosis:** Rejects causal weight and predictive utility; views the coefficient as an artifact of separating inseparable developmental processes, rendering the drop from 0.65 to 0.30 expected and theoretically uninformative.

  ---

  ### **STRUCTURAL COLLAPSE NOTE**

  **Flagged Leaves:** **Strict Statistical Descriptivism (Path 1A-2B-3B)** and **Developmental-Systems Interactionism (Path 1B-2B-3B)**.

  **Explanation of Collapse:** These two leaves cannot be genuinely separated in practice. Although they arrive via different answers at Node 1 (one claims the trait is stable but masked, the other claims the trait is relational), their shared commitment at Node 2 (Pure Variance-Partitioning) and Node 3 (No Inferential License) collapses their practical stance. If the coefficient has no causal weight and licenses no predictions, the ontological disagreement about *why* the coefficient dropped (increased $V_E$ vs. restructured $rGE$) becomes empirically undecidable and philosophically inert. Both positions result in the same methodological recommendation: ignore $h^2$ for causal or policy reasoning.
