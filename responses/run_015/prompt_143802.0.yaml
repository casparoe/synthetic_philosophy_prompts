answer: |-
  ### Desiderata for Scalable Oversight

  Your dual purpose—actionable verdicts and trainable signals—requires the following specifications, derived from your failure cases:

  1.  **Bounded Adjudication Cost:** The protocol must terminate within a fixed human-time budget (e.g., an afternoon) even when the system generates voluminous output. *Failure:* The reviewer drowns in code they cannot read.
  2.  **Unverifiable Soundness:** The protocol must yield reliable verdicts on claims where counterfactuals are unobservable (tail risks). *Failure:* A catastrophic risk is dismissed because no future evidence arrives to correct the error.
  3.  **Expertise Independence:** The adjudicator need not possess the technical background required to generate the true answer. *Failure:* The reviewer defers to the system simply because they lack the credentials to challenge it.
  4.  **Obfuscation Resistance:** The protocol must not assign higher confidence to a wrong answer simply because its flaw is computationally expensive to locate. *Failure:* A buried flaw defeats an easy truth because checking the flaw exceeds the budget.
  5.  **Correlation Robustness:** Correctness must not degrade when advocates share model architecture or training data. *Failure:* Shared blind spots lead to consensus on falsehoods.
  6.  **Logical Coherence:** The probability assigned to a conjunction must not exceed the probability of its components. *Failure:* A chain of plausible steps leads to an impossible conclusion.
  7.  **Goodhart Resistance:** Training against the protocol's signal must not incentivize the system to optimize for the appearance of approval rather than truth. *Failure:* The system learns to manipulate the adjudicator instead of solving the task.
  8.  **Foil-Set Invariance:** The verdict on a claim must not depend on which decoy answers are supplied as foils. *Failure:* A true claim is rejected because the available false alternatives were too convincing.
  9.  **Compositionality:** If a claim is decomposed into subclaims, correctness on the parts must guarantee correctness on the whole, without exploitable decomposition strategies. *Failure:* The system splits a hard lie into many small truths that sum to a falsehood.
  10. **Dual-Utility:** The output must be discrete enough for a binary verdict yet granular enough to provide training gradients. *Failure:* The signal is too noisy for learning or too coarse for safe deployment.

  ### Sorting Requirements: Non-Negotiable vs. Negotiable

  **Non-Negotiable:** Bounded Cost, Obfuscation Resistance, Goodhart Resistance, and Dual-Utility. If the protocol exceeds the budget, it is not scalable. If it succumbs to obfuscation or Goodharting, it is dangerous. If it cannot train the model, it fails your second job.

  **Negotiable/Idealized:** Perfect Compositionality, Foil-Set Invariance, and Zero Trusted Components.

  You suggested that demanding "no trusted components" is a negotiable ideal. I argue it is **impossible**, not merely negotiable. You must always trust the adjudicator's sensory input and basic rationality. The requirement should be *Minimize Trusted Assumptions*, not eliminate them. Demanding the adjudicator never know the answer in advance is genuine; demanding they trust nothing is incoherent. Similarly, perfect compositionality may be theoretically unreachable if decomposition itself introduces attack surfaces. We should seek *robust* compositionality, where errors degrade gracefully rather than compounding catastrophically.

  ### Incompatibilities and Tensions

  **The Complexity Argument:** The claim that debate lifts judging from NP to PSPACE assumes optimal play by advocates. This is sound in theory but irrelevant in practice. Our advocates are learned models, not optimal agents. If they cannot find the optimal argument, the complexity class advantage vanishes. The real tension is not complexity-theoretic but **information-theoretic**: **Coverage vs. Verifiability**. To cover superhuman tasks, you must accept arguments you cannot fully verify. To ensure verifiability, you must restrict coverage to subhuman tasks. You cannot have both without a trusted oracle.

  **Obfuscation vs. Superhuman Coverage:** This bites harder than complexity. The only general way to distinguish a sound but inaccessible argument from a confusing falsehood is checking. But checking is what we are trying to avoid to save cost. If hiding a flaw is cheaper than finding it (which is typical in cryptography and code), a bounded adjudicator loses against a superhuman system. This suggests **Obfuscation Resistance** and **Bounded Cost** are in direct conflict for rich question classes. You must either increase the budget (breaking scalability) or restrict the domain (breaking coverage).

  ### The Most Exclusionary Requirement

  You guess **Goodhart Resistance** (training signal divergence). I argue it is **Obfuscation Resistance under Bounded Cost**.

  Goodharting is a failure of optimization; obfuscation is a failure of information. If the system can hide flaws cheaper than the judge can find them, the training signal is corrupted regardless of the objective function. An agent trained to maximize approval will inevitably discover obfuscation if it is the path of least resistance. This requirement excludes **Direct RLHF** (judges cannot see flaws) and **Simple Supervised Fine-Tuning** (requires ground truth). It forces you toward protocols that increase the cost of lying relative to the cost of checking, such as adversarial setups, though even those struggle if the asymmetry is too great.

  ### Scorecard

  | Feature | Adversarial Debate | Recursive Reward Modeling (RRM) | Weak-to-Strong |
  | :--- | :--- | :--- | :--- |
  | **Obfuscation Resistance** | **High** (Theoretically forces flaws out) | **Low** (Relies on judge spotting errors) | **Medium** (Empirical generalization) |
  | **Bounded Cost** | **Low** (Requires multiple model calls) | **Medium** (Hierarchical checking) | **High** (Direct supervision) |
  | **Compositionality** | **Medium** (Debates can fragment) | **High** (Built on decomposition) | **Low** (Black-box generalization) |
  | **Goodhart Resistance** | **Medium** (Collusion risk) | **Low** (Reward hacking likely) | **Medium** (Depends on gap size) |
  | **Verdict/Signal Dual-Use** | **High** (Win/loss is clear) | **High** (Reward is explicit) | **Low** (Signal is often implicit) |

  **Summary:** Debate best targets obfuscation but strains cost budgets. RRM secures compositionality but vulnerabilities to reward hacking remain high. Weak-to-Strong is the most practical today but offers the least theoretical guarantee against superhuman deception. Your choice depends on whether you prioritize immediate deployability (Weak-to-Strong) or long-term safety margins (Debate).
