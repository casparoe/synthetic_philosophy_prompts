  The load-bearing premise is (ii): that mathematically distinct models must represent physically distinct possibilities. The hole argument only bites if you think shifting the fields off the points creates a new world rather than just a new description of the same world. Premise (i) tempts you into accepting (ii), but (ii) is the engine; if you deny that isomorphism preserves physical identity, the hole closes regardless of whether points are real or whether the manifold is smooth. The discrete wrinkle confirms this: if you treat event labels as gauge, the indeterminism vanishes without needing smoothness, proving the core issue is representational redundancy, not calculus.

  **1. Relationalism** | Premise: (i) | Discrete: 9 | Cheap: 4 | Tier: B
  It survives discretization well since graphs are purely relational, but it pays a high collateral cost by making it difficult to recover the local geometry needed for standard physics practice.

  **2. Sophisticated Substantivalism** | Premise: (ii) | Discrete: 10 | Cheap: 8 | Tier: S
  This is the robust winner because anti-haecceitism translates perfectly to permutation invariance in discrete structures without requiring metaphysical gymnastics or denying the reality of the manifold.

  **3. Bite the Bullet** | Premise: (i) [via rejecting substantivalism] | Discrete: 10 | Cheap: 6 | Tier: B
  It handles the discrete case trivially by abandoning the ontology entirely, but it ranks lower because surrendering substantivalism solely to save determinism feels like an overreaction to a representational artifact.

  **4. The Gauge Move** | Premise: (ii) | Discrete: 8 | Cheap: 9 | Tier: A
  Physicists love this because it matches practice, but it scores slightly lower on discrete survival because the active/passive distinction becomes murky without smooth coordinates to drag.

  **5. Supersubstantivalism** | Premise: (i) | Discrete: 6 | Cheap: 3 | Tier: F
  Identifying spacetime with the field creates category confusion in a discrete setting where the "field" is just the graph structure itself, making the distinction vacuous and metaphysically expensive.

  **6. Ontic Structural Realism** | Premise: (i) | Discrete: 10 | Cheap: 2 | Tier: B
  It fits the discrete graph ontology perfectly since graphs are pure structure, but the collateral damage is severe because cashing out "structure without relata" remains notoriously obscure.

  **7. The Dynamical/Cauchy Reply** | Premise: (iii) | Discrete: 7 | Cheap: 7 | Tier: A
  Redefining determinism as uniqueness up to diffeomorphism works well in practice, but it scores lower on discrete survival because initial-value formulations in causal sets are not straightforward equivalents of the continuum case.

  **8. Label Eliminativism** | Premise: (i) | Discrete: 10 | Cheap: 7 | Tier: A
  Added for the wrinkle: if discrete events have no primitive labels, the hole argument never gets off the ground, and this avoids OSR's metaphysical excess by treating labels as merely heuristic tools.

  If cornered at a conference bar, I'd defend Sophisticated Substantivalism because it keeps the ontology real without buying into magical point-identity. The most overrated is Ontic Structural Realism, which solves the hole by dissolving the relata but leaves you with a metaphysics too vague to do physics with.
