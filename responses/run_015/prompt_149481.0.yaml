answer: |-
  ### BRAINSTORMING: WHAT THEY'RE GOING TO SAY

  **The Consequentialists (The Majority)**
  *   **Vocabulary:** Aggregation, maximizing, sorites paradox, decision-guidance, scope insensitivity, lexical priority.
  *   **The Gist:** They think lexical thresholds are "rule worship" or "intuition pumping." They'll argue that if a little pain is bad, and a little pleasure is good, there must be some exchange rate. If you deny this, you're being irrational.
  *   **Specific Attack:** "Where is the line? Is 50 years of mild headache worse than one minute of torture? If you say yes, you're scope insensitive. If you say no, your threshold is arbitrary."
  *   **Specific Attack:** "Why doesn't extreme joy collapse structure too? Orgasms, flow states, religious ecstasy. Why is pain special?"

  **The Kantians (The Skeptics)**
  *   **Vocabulary:** Dignity, inviolability, ends-in-themselves, side-constraints, agency, rationality.
  *   **The Gist:** They smell a rat. They think you're trying to get deontological results (no torturing!) without paying the deontological price (abandoning maximization).
  *   **Specific Attack:** "You're describing the destruction of agency via phenomenology. That's just a fancy way of saying 'rights violation.' Why not just say torture violates dignity?"
  *   **Specific Attack:** "If the subject's temporal structure collapses, are they still a moral patient in the utilitarian sense? Or are they now a sacred object?"

  **The Welfare Economist (The Measurement Guy)**
  *   **Vocabulary:** Interpersonal utility comparison (IUC), cardinal vs. ordinal, social welfare function, measurability, operationalization.
  *   **The Gist:** He cares about whether this view can actually *do* anything. If you can't measure it, you can't policy-test it.
  *   **Specific Attack:** "If extreme pain is phenomenologically incommensurable with pleasure, how do you compare *my* extreme pain to *your* extreme pain? You've broken the metric for everyone, not just across categories."
  *   **Specific Attack:** "This makes cost-benefit analysis impossible in edge cases. How do we allocate medical resources?"

  ---

  ### PREP SHEET: ORDERED OBJECTIONS

  Here is the order of fire you should expect. I've ranked these by likelihood combined with damage potential.

  #### 1. The "Vagueness/Sorites" Objection (Consequentialists)
  **The Question:** "You ground the threshold in phenomenological structure. But phenomenology is vague. At exactly what intensity does temporal structure collapse? If there's a gray zone, lexicality fails. If there isn't, you're positing a magical phenomenological switch."
  **The Reply:** "I'm not positing a precise switch, but a salient transition. Just as 'wetness' emerges from water molecules without a precise molecule-by-molecule line, the collapse of comparative framing is a structural shift recognizable in retrospect. Lexicality doesn't require precision to be real; it requires a difference in *kind*, not degree."
  **Weakness Flag:** **High.** Analytic ethicists hate vague boundaries on lexical thresholds. If you admit vagueness, they will argue you can't justify prioritizing the threshold case over a massive aggregate of near-threshold cases.
  **Prep:** Be ready to bite the bullet that the line is somewhat vague but *ontologically* real (like adulthood vs. childhood).

  #### 2. The "Smuggled Deontology" Objection (Kantians & Consequentialists)
  **The Question:** "If aggregation is conceptually broken above the threshold, you aren't maximizing welfare anymore. You're treating suffering persons as inviolable. Why call this Utilitarianism? It's just Deontology with extra steps."
  **The Reply:** "It remains utilitarian because below the threshold, aggregation holds fully. The 'constraint' isn't a moral side-constraint (rights), but a conceptual limit on the currency itself. You can't add apples and oranges not because of a rule, but because they aren't the same kind of thing."
  **Weakness Flag:** **Medium-High.** If the conceptual limit is absolute, it functions exactly like a right. You need to emphasize that *below* the threshold, you are a hard-nosed maximizer.
  **Prep:** Distinguish between "moral prohibition" (deontology) and "measurement failure" (your view).

  #### 3. The "Extreme Pleasure" Counterexample (Consequentialists)
  **The Question:** "You claim pain collapses temporal framing. But what about extreme ecstasy or religious rapture? Those also consume the subject and eliminate contextual framing. Why don't they get lexical priority?"
  **The Reply:** "Pain is coercive; pleasure is not. Pain forces the collapse of structure upon the subject (involuntary), whereas extreme pleasure is often sustained by anticipatory framing or requires a background of safety. Pain destroys the 'self' holding the experience; pleasure usually inflates it."
  **Weakness Flag:** **Medium.** Some drug states or mystical experiences genuinely dissolve the self. If you concede this, you might have to grant lexical priority to extreme joy, which ruins Negative Utilitarianism.
  **Prep:** Focus on the *suffering* aspect. The collapse matters because it is *suffering*. The structural collapse amplifies the negative valence uniquely.

  #### 4. The "Who Counts?" Problem (All Camps)
  **The Question:** "If the subject in extreme pain loses the capacity for comparative framing, they cannot evaluate their own welfare. So who determines the threshold? You, the philosopher? That seems paternalistic and undermines the welfare basis."
  **The Reply:** "We use third-person phenomenological markers (behavioral, neurological, testimonial) to infer the structural collapse. We aren't asking them to calculate; we are observing the breakdown of the calculator."
  **Weakness Flag:** **Medium.** This moves you away from subjective welfare toward objective list theories.
  **Prep:** Acknowledge the epistemic difficulty but insist the ontological fact remains.

  #### 5. The "Prayer" Objection: Interpersonal Comparison (The Welfare Economist)
  **The Question:** "If extreme pain creates a phenomenological structure unique to the subject that is incommensurable with pleasure, is it also incommensurable with *other people's* pain? If pain is structurally unique because it collapses *my* temporal frame, how do you compare *my* collapsed frame to *yours*? If you can't, you've destroyed interpersonal welfare comparison entirely. Your view is practically inert."
  **The Reply:** "We can compare degrees of structural collapse across persons via shared physiology and testimony, even if we can't compare pain to pleasure. The metric breaks *across categories* (pain vs. pleasure), not necessarily *within categories* (pain vs. pain)."
  **Weakness Flag:** **CRITICAL.** This is the hardest hit. If the phenomenology is truly subjective and structural, claiming we can compare *your* collapse to *mine* risks contradicting the core claim that the structure is unique/unshareable.
  **Prep:** If this comes up, do not bluff. Admit this is the hardest part of the theory.

  ---

  ### STRATEGIC CONCESSIONS
  *Don't fight every battle. Concede these upfront to look reasonable and save energy for the core argument.*

  1.  **Concede Operational Difficulty:** Admit that this view is harder to implement in policy than classical utilitarianism. Don't claim it's "user-friendly." Claim it's *true*, not convenient.
  2.  **Concede the "Gray Zone":** Admit there are borderline cases where it's unclear if the threshold is crossed. Argue that this doesn't negate the existence of clear cases (e.g., torture vs. headache).
  3.  **Concede Non-Utilitarian Roots:** Acknowledge that this view draws heavily from phenomenology (Husserl/Levinas vibes) rather than pure economics. Don't try to hide the continental influence; frame it as "richer data."

  ---

  ### SENIOR PHILOSOPHER ADVICE

  **1. Watch Your Terminology:**
  You are walking a tightrope. If you say "conceptually broken," the economists will say "then your theory is broken." If you say "morally ugly," the consequentialists will say "then you're intuition pumping."
  *   **Fix:** Stick to "structurally incompatible." Use the analogy of trying to add "length" to "weight." It's not that length is more important than weight; it's that adding them yields nonsense.

  **2. The Phenomenology Trap:**
  Analytic ethicists often treat phenomenology as "soft" data. They will demand functionalist accounts.
  *   **Fix:** When describing the "collapse of temporal structure," tie it to cognitive capacity. "The subject loses the ability to project beyond the immediate moment." This sounds more like a cognitive science claim than a poetic one.

  **3. Handle the Economist Carefully:**
  He is the wildcard. If he decides your view is unmeasurable, he will tell the room it's not serious theory.
  *   **Fix:** Tell him: "I am not offering a social welfare function for easy calculation. I am offering a correction to the variables entering the function. Garbage in, garbage out. Classical utilitarianism puts garbage in by assuming commensurability."

  **4. The "Prayer" Objection Strategy:**
  If the Economist asks about Interpersonal Comparison (Objection #5):
  *   **Do not** say "We can measure it perfectly."
  *   **Do** say: "Interpersonal comparison of pain is always inferential, but it relies on shared physiology. Interpersonal comparison of pain *to pleasure* relies on a shared metric that doesn't exist above the threshold. I am denying the cross-category conversion rate, not the cross-subject empathy."

  **5. Final Mindset:**
  You are not defending a policy. You are defending a metaphysics of value. If they ask "What should we do?", answer "First we must understand what is happening." Don't let them push you into practical applicability too early.

  Good luck. Keep your cool. If you get stuck, return to the core image: *You cannot bargain with a drowning man using gold coins.*
