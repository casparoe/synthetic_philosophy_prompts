      *   *Section 1: Sentence-by-Sentence Audit.* Break it down clearly. Use bolding for verdicts (Accurate, Exaggerated, False).
      *   *Section 2: The Oxford/Newton Question.* Dive into the history of science. Mention Grosseteste/Bacon vs. Newton. Key difference: Mathematization and Mechanical Philosophy.
