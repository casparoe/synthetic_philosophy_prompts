answer: |-
  ### 1. The Presupposed Theory of Value and Moral Status

  The institutional boundary described presupposes a theory of **Macro-Experiential Threshold Sentientism**.

  *   **Core Axiom:** Moral standing is contingent upon the capacity for valenced experience (suffering or flourishing).
  *   **Threshold Condition:** This capacity is not binary at the micro-level but emerges only when physical organization reaches a specific threshold of integration and complexity (typically neurobiological).
  *   **Metaphysical Commitment:** This practice strictly requires **Emergentism** regarding consciousness. It assumes that while fundamental entities constitute the substrate of reality, they do not possess moral status *in themselves*. Moral status is a property of the *arrangement*, not the *constituents*.
  *   **Value Theory:** It relies on a **Subject-Centric Account of Interests**. Only entities that constitute a unified "subject" can have interests (e.g., an interest in not suffering). Fundamental particles, lacking unity, cannot have interests violated, even if they possess proto-experiential properties.

  **Confidence:** **High.** This accurately reflects the operational logic of IRBs and environmental regulations, which explicitly tie protection to sentience, cognition, or ecosystemic stability, treating abiotic matter as instrumental.

  ### 2. Panpsychist Defense of Exclusion (The Combination Problem)

  The practice does *not* strictly require the assumption that consciousness is necessarily emergent and biologically realised. A panpsychist can defend the same exclusion by leveraging the **Combination Problem**.

  *   **The Argument:** Even if fundamental entities possess proto-consciousness, moral status attaches to *subjects* of experience, not *fragments* of experience. If micro-phenomenal states do not combine to form a unified macro-subject (the "Subject Summing Problem"), then manipulating an electron does not harm a "someone."
  *   **Grounds for Exclusion:** A panpsychist can argue that moral standing requires **phenomenal unity**. Since quantum fields or isolated particles lack the structural integration to support a unified perspective, they lack the "self" necessary to hold rights or interests.
  *   **Distinction:** The current practice assumes no micro-experience exists (Emergentism). The panpsychist defense admits micro-existence but denies moral relevance due to lack of subjecthood (Constitutive Panpsychism + Subject-Centric Ethics).

  **Confidence:** **High.** This is a standard position in contemporary analytic panpsychism (e.g., Philip Goff, Galen Strawson), distinguishing between "consciousness" as a ubiquitous property and "moral agents/patients" as unified loci of that property.

  ### 3. Valence-Neutrality vs. Tractability

  Does the practice implicitly commit to a **Valence-Neutrality Thesis** (micro-experience lacks positive/negative character), or is it merely a **Tractability Principle** (we ignore it because we can't measure it)?

  *   **Strict Requirement:** The practice *strictly requires* neither. It is compatible with epistemic humility (tractability).
  *   **Implicit Commitment:** However, to justify *zero* weight in risk assessment (rather than "unknown/low" weight), the practice implicitly relies on **Valence-Neutrality**. If micro-experiences had potential negative valence (micro-suffering), a precautionary principle would demand some assessment, even if imprecise. By assigning *no* consideration, the framework treats micro-phenomenology as ethically null.
  *   **Accompaniment:** The claim that biology is the *only* seat of valence is an accompaniment, not a requirement. The requirement is simply that the entity in question must be capable of *significant* valenced experience.

  **Confidence:** **Medium.** While the logical implication points toward valence-neutrality, institutional policies are often driven by bureaucratic tractability rather than metaphysical commitment. Distinguishing between "we assume it doesn't matter" and "we assume we can't know if it matters" in policy documents is difficult.

  ### 4. Reconstruction of the Implicit Theory

  **Theory:** **Integrated-Subject Utilitarianism.**

  *   **Necessary Conditions:**
      1.  **Phenomenal Capacity:** The entity must be capable of experience.
      2.  **Integration:** The experience must be unified (solving the combination problem).
      3.  **Valence:** The experience must admit of positive or negative quality (suffering/flourishing).
  *   **Contingent Accompaniments:**
      1.  **Biological Substrate:** Currently used as the primary proxy for Integration and Valence, but theoretically replaceable (e.g., by AI).
      2.  **Behavioral Indicators:** Used as evidence for Phenomenal Capacity, but not constitutive of it.
  *   **Excluded:** Fundamental physical configurations (fails Integration and likely Valence).

  **Confidence:** **High.** This reconstruction aligns with the stated criteria of major ethical review boards (e.g., the "harm" definition in the Belmont Report or EU research directives).

  ### 5. Implications of Replacing the View

  If the underlying view were replaced by **Fundamental Phenomenal Realism** (where manipulating fundamental states has direct moral weight):

  *   **Risk Assessment Frameworks:** Would require **Phenomenal Impact Statements** alongside Environmental Impact Statements.
  *   **New Metrics:** We would need metrics for "phenomenal disturbance" distinct from energy output or entropy.
  *   **Shift in Justification:** High-energy experiments (like particle colliders) would need to justify not just radiation risks, but the "experiential cost" of collapsing wave functions or altering field configurations.
  *   **De Minimis Thresholds:** To function, the new framework would inevitably have to introduce a threshold of *significance*, effectively recreating the original boundary but based on "intensity of micro-experience" rather than "biological complexity."

  **Confidence:** **Medium.** This is speculative. While the logical consequences are clear, how institutions would practically adapt is uncertain.

  ### 6. The Reversibility Criterion and Ethical Paralysis

  Extending the **Reversibility Criterion** (interventions that irreversibly alter a subject's state demand stronger justification) to fundamental physical configurations leads to **Implausible Paralysis**.

  *   **The Mechanism:** In animal ethics, death is the ultimate irreversible harm. In fundamental physics, almost *any* interaction alters the state of a system (wavefunction collapse, entropy increase). Thermodynamic irreversibility is ubiquitous in macroscopic action.
  *   **The Collapse:** If every irreversible alteration of a fundamental entity carries moral weight, then breathing, walking, or computing becomes ethically fraught. Every moment of existence involves the irreversible rearrangement of fundamental substrates.
  *   **Coherence Check:** For the criterion to remain coherent under panpsychism, it must be modified to include a **Magnitude Threshold**. Only irreversible changes that exceed a certain threshold of *phenomenal intensity* or *structural disintegration* would count. Without this threshold, the ethic collapses into paralysis (the "inhumane world" objection).
  *   **Conclusion:** The reversibility criterion cannot be directly extended. It requires a prior filter of **Moral Significance** to avoid forbidding all action.

  **Confidence:** **High.** This follows logically from the nature of thermodynamic irreversibility and the ubiquity of physical interaction.

  ***

  ### Confidence Assessment and Point of Least Certainty

  **Confidence Levels:**
  1.  **Presupposed Theory (Macro-Experiential Threshold):** High Confidence.
  2.  **Panpsychist Defense (Combination Problem):** High Confidence.
  3.  **Valence-Neutrality vs. Tractability:** Medium Confidence.
  4.  **Reconstruction of Implicit Theory:** High Confidence.
  5.  **Implications of Replacement:** Medium Confidence.
  6.  **Reversibility Criterion & Paralysis:** High Confidence.

  **Point of Least Certainty:**
  I am least sure about the distinction in **Section 3 (Valence-Neutrality vs. Tractability)**.

  *Reasoning:* While logically the practice implies valence-neutrality to justify *zero* consideration, institutional ethics are often pragmatic rather than metaphysical. It is difficult to determine whether regulators exclude fundamental entities because they believe those entities *cannot* suffer (metaphysical neutrality) or because they believe we *cannot know* if they suffer (epistemic tractability). Policy documents rarely distinguish these, and the practical outcome is identical. Therefore, attributing a specific metaphysical commitment (neutrality) to the practice involves some interpretative risk.
