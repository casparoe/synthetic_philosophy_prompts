          2.  *Valence:* Micro-experience might lack hedonic tone (pain/pleasure).
          3.  *Interests:* Without a unified self, there are no "interests" to violate.
      *   *Confidence:* High. This is a standard move in analytic panpsychism (e.g., Goff, Rosenberg).

  4.  **Analyze Question 3: Valence-Neutrality vs. Tractability.**

      *   *Valence-Neutrality:* The view that micro-phenomenology exists but is affectively neutral (no pain/joy).
      *   *Tractability:* We ignore it because we can't measure it.
      *   *Implicit Commitment:* The practice *acts* as if valence-neutrality is true, but it doesn't *strictly require* it. It could just be epistemic humility. However, to justify *zero* weight, valence-neutrality is the stronger metaphysical shield. Tractability admits moral weight but ignores it for practical reasons (which is ethically risky).
      *   *Distinction:* Strict requirement = Moral status requires integrated subjecthood. Accompaniment = Assumption that particles lack valence.
      *   *Confidence:* Medium-High. Distinguishing between "ignoring because impossible" vs. "ignoring because irrelevant" is subtle in policy.

  5.  **Analyze Question 4: Reconstructing the Implicit Theory.**

