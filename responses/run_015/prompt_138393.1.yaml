answer: |-
  The "we're next" inference cannot survive the swap to the language metaphor because it relies entirely on the building metaphor's assumption of catastrophic, final failure.

  ### Audit 1: The Building Analogy

  | Building Component | Roman State Correspondence |
  | :--- | :--- |
  | **The Building** | The Imperial State apparatus |
  | **Foundation** | Agricultural surplus, tax base, trade networks |
  | **Load-Bearing Walls** | Legions, bureaucracy, imperial legitimacy |
  | **The Ground** | Local warlordism / feudal fragmentation |
  | **The Collapse** | Loss of central authority (476 CE) |
  | **The Rubble** | Ruined infrastructure, lost literacy, fragmented law |
  | **People Living in It** | The populace continuing under new management |

  **Disanalogies Sorted by Relevance**

  **Matter for the "One Cause" & "We're Next" Moves:**
  *   **Static vs. Adaptive:** Buildings cannot repair themselves or change design during stress; states can reform, relocate, or restructure (e.g., the East surviving). This disanalogy destroys the "one cause" move by allowing for multiple failure points and recovery attempts.
  *   **Finality vs. Transformation:** When a building hits the ground, it is done; when a state "falls," authority often diffuses rather than vanishes. This disanalogy blocks the slide to "we're next" by redefining the end as a transition rather than a termination.
  *   **Agency:** Buildings suffer external forces or material fatigue passively; states make choices (bad treaties, civil wars). This undermines the "bad load-bearing wall" search for a single structural flaw, shifting blame to decision-making.

  **Precision Nitpicks:**
  *   Buildings do not collect taxes or enforce laws.
  *   Rubble does not retain cultural memory or language.
  *   Buildings do not have borders that shift over centuries.

  ### Audit 2: The Latin Analogy

  **Where It Fits Better:**
  *   **Continuity:** Just as Vulgar Latin didn't "die" but drifted into Romance languages, the Roman state didn't vanish but fragmented into successor kingdoms that retained Roman law and titles.
  *   **No Single Moment:** You cannot pinpoint the day Latin became Italian; similarly, 476 was unnoticed by contemporaries because the administrative functions persisted under Odoacer.
  *   **Survival via Mutation:** The thing survives by becoming something else. The Church kept the "Latin" of Rome alive even when the "Building" was gone.

  **Where It Falls Apart:**
  *   **Coercion:** Languages cannot levy taxes or conscript armies; states rely on monopoly violence to exist.
  *   **Intent:** Languages evolve naturally without trying to stay the same; the Roman State actively fought to maintain its structure and borders.
  *   **Conquest:** You can conquer a state and dissolve its institutions; you cannot "conquer" a language, only suppress or adopt it.

  ### Verdict on the "We're Next" Inference

  The inference dies once both pictures are on the table because the building metaphor carries all the fatalistic weight. The building analogy presupposes a hard stop: gravity wins, structure fails, habitability ends. This invites the "we're next" panic because modern societies are also framed as complex structures subject to gravity. The Latin analogy removes the doom by reframing "fall" as "drift." If Rome is Latin, then "we're next" doesn't mean collapse; it means transformation. We won't be the US forever, but that doesn't mean catastrophe; it means becoming something else. The building metaphor is doing 100% of the work for the apocalyptic conclusion; the language metaphor reveals that conclusion as an artifact of the analogy, not history.

  ### A Better Analogy: The Conglomerate Corporation

  Rome is not a building or a language; it is a **legacy conglomerate undergoing bankruptcy and asset stripping.**

  **What It Buys You:**
  *   **Agency + Structure:** Like a corporation, Rome had bureaucracy, revenue (taxes), security (private army), and a brand (Imperial legitimacy). Unlike a building, it could make decisions; unlike a language, it could be coerced.
  *   **The 476 Non-Event:** When a CEO dies or HQ dissolves, the subsidiaries often keep operating. The Western "branch" went bankrupt, but the Eastern "parent company" kept trading, and local managers (Germanic kings) kept the employees (citizens) working under new branding.
  *   **Collapse vs. Restructuring:** Bankruptcy isn't death; it's a legal reorganization. Assets (laws, roads, religion) get sold off to competitors (successor kingdoms). This explains why life didn't stop in 476 while acknowledging the loss of central coordination.
  *   **The "We're Next" Check:** Corporations fail constantly without ending the economy. They merge, split, or pivot. This analogy allows for institutional failure without implying civilizational extinction. It shifts the question from "when will the building fall?" to "is our current business model sustainable?"—which is actionable rather than fatalistic.
