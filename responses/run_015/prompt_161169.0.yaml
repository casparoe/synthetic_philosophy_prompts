      *   *Tiny Prob/Astro Payoff:* A sample $x$ where $P(x) \approx 10^{-12}$ but $U(x) \approx 10^{15}$. In MC simulation, you likely never see this sample, but analytically it dominates the integral.
      *   *Fix 1 (Bounded Utility):* `clip(U, min, max)`. Saturation arithmetic. Prevents overflow.
      *   *Fix 2 (Non-linear Prob):* Weighting function $w(p) \neq p$. Like importance sampling but changing the measure permanently. Or treating $p < \epsilon$ as 0 (underflow to zero).
