answer: |-
  This is a sophisticated problem in the demarcation of science, and it cuts to the heart of what your convener appears to value in the history and philosophy of archaeology. Based on the eight precedents provided, we can reconstruct the implicit decision rules he is applying. These rules are not perfectly unified—there is tension between them—but they provide a robust framework for analysis.

  Here are the three operative rules derived from his track record, followed by their application to the Interfluve Survey Project, the likely verdict, and the specific evidence that would force a divergence in these rules.

  ### I. The Reconstructed Rules

  **Rule 1: The Epistemic Hygiene Constraint (Method & Response to Failure)**
  *Derived from cases (iv), (vi), (vii), and the specific note on Fomenko (iii).*
  A claim is **pseudohistorical** if it protects its core hypothesis from falsification by invoking *uncheckable* ad hoc explanations for negative evidence (specifically, suppression or conspiracy regarding the *physical record*). A claim is **not pseudohistorical** if it accepts negative evidence, offers independently verifiable reasons for methodological failure (e.g., survey bias, preservation conditions), and subjects the revised hypothesis to new, risky tests (pre-registration).
  *   *Key Distinction:* Being wrong or unsupported (vi, vii) is not pseudoscience. Immunising the claim against being proven wrong (iv) is.

  **Rule 2: The Ontological Plausibility Constraint (Content of Claim)**
  *Derived from cases (i), (ii), (iv) vs. (v), (vii), (viii).*
  A claim is **pseudohistorical** if it requires extraordinary agents or mechanisms outside known human capacity or natural law (e.g., extraterrestrials, lost hyper-technologies, global chronological collapses). A claim is **not pseudohistorical** if it proposes a revision of *scale, density, or chronology* within established human and geological parameters, even if that revision is radical.
  *   *Key Distinction:* 'Lost civilisations' are pseudo if they are Atlantis-like (i); they are legitimate if they are merely previously unlocated political entities attested by indirect evidence (viii).

  **Rule 3: The Institutional Neutrality Principle (Credentials & Reception)**
  *Derived from cases (iii), (v), (viii).*
  A claim's status is **independent** of the proponent's credentials or the consensus of the field. High mathematical eminence does not save a bad hypothesis (iii); lack of credentials does not condemn a good one (viii); minority status within the discipline does not make a claim pseudo (v, vi). However, rhetoric alleging *orthodox suppression* is a risk factor, evaluated under Rule 1.
  *   *Key Distinction:* Complaints about *funding* or *reception* are not inherently pseudo, but complaints that *evidence* has been suppressed are.

  ---

  ### II. Application to the Interfluve Survey Project

  We must apply these rules to the project at two distinct temporal stages, as the epistemic situation changes after the survey results.

  **Stage 1: Before the LiDAR Surveys**
  *   **Rule 1 (Method):** Strongly **Not Pseudohistory**. The use of pre-registration is a hallmark of modern epistemic hygiene. It commits the team to a falsifiable outcome before seeing the data. The explanation for the current absence of evidence (survey bias towards rivers) is independently checkable against survey logs.
  *   **Rule 2 (Content):** **Not Pseudohistory**. The claim posits larger, sedentary populations within the Amazon. This is a revision of social complexity, not an invocation of aliens or lost technology. It fits the 'Levant Iron Age' (vii) model of revisionism rather than the 'Atlantis' (i) model.
  *   **Rule 3 (Credentials):** **Not Pseudohistory**. The proponents are credentialed insiders. While Rule 3 says this shouldn't matter, in the absence of data, institutional standing acts as a heuristic for 'ordinary scholarship' (vii).
  *   *Interim Verdict:* Clearly legitimate scholarship.

  **Stage 2: After the Failed Prediction (The Current Situation)**
  *   **Rule 1 (Method):** **Contested but leaning Not Pseudohistory**. The prediction failed (4 found vs. 20 predicted). The critics allege 'immunisation'. However, the team's response fits the 'Legitimate Science' pattern of case (vi): they offer specific, checkable reasons for the failure (permit logs, logging records) and have pre-registered a *second* risky prediction. Crucially, they have committed to publish *whatever comes out*. This distinguishes them from the 'Tartaria' case (iv), where missing evidence is explained by a conspiracy that prevents *checking*.
  *   **Rule 2 (Content):** **Not Pseudohistory**. The content of the claim has not shifted into the fantastical.
  *   **Rule 3 (Credentials/Rhetoric):** **Ambiguous**. The complaint about grant panels and 'orthodoxy' echoes the 'suppression' narrative of case (iv). However, there is a vital nuance: they are alleging bias in *funding*, not bias in the *physical evidence*. Your convener's note on (iv) specifies "explaining away missing evidence by suppression." Alleging bias in *peer review or funding* is common in legitimate science (see the reception of the Sphinx weathering hypothesis (v)), whereas alleging a conspiracy to hide *artefacts* is not.
  *   *Interim Verdict:* Precarious, but structurally sound.

  ---

  ### III. The Likely Verdict

  **Verdict: Not Pseudohistory.**

  **Reasoning:**
  Your convener will likely prioritise **Rule 1 (Epistemic Hygiene)** over the rhetorical red flags. The decisive factor is the **pre-registration** and the **commitment to publish null results**.

  In the 'Tartaria' case (iv), the pseudohistorical move was to make the absence of evidence *proof* of the theory (i.e., "they are missing because they were hidden"). In the Interfluve case, the team admits the absence of evidence *counts against* the theory (hence the failed prediction), offers a methodological explanation for the discrepancy, and stakes more reputation on a new test. This is the structure of case (vi) (Younger Dryas), which remains 'legitimate science' despite being regarded as unsupported by most specialists.

  The complaint about 'orthodoxy' in grant panels is unfortunate rhetoric, but unless they claim the *negative LiDAR data* is being suppressed by the orthodoxy, it does not trigger the diagnostic move of case (iv). Your convener has already established in case (v) and (viii) that being doubted by the majority does not make one a pseudoscientist. The pre-registration mechanism provides the objective anchor that distinguishes this from Fomenko's 'mathematical' revisionism (iii); Fomenko adjusted his parameters to fit the past, whereas this team is adjusting their parameters to fit a future test.

  **The Commitment:**
  By ruling this 'Not Pseudohistory', your convener is committing to the view that **methodological transparency trumps predictive success**. He is asserting that a failed prediction, honestly reported and followed by a new risky prediction, is a feature of science, not a bug. He is also committing to the distinction that complaining about *sociological* barriers (grants) is not the same as positing *epistemic* barriers (suppressed evidence).

  ---

  ### IV. The Discriminating Case

  You asked what further evidence or case would cause the rules to diverge, or what would force the convener to change this verdict. The rules currently agree on 'Not Pseudohistory', but they are under tension regarding the 'Orthodoxy' complaint.

  **The Discriminator:**
  The verdict would flip to **Pseudohistory** if the team **refuses to publish the data from the failed first prediction** or if the **second prediction is rendered unfalsifiable**.

  Specifically, watch for the following scenario:
  > *If, upon the failure of the second pre-registered survey, the team argues that the enclosures exist but are "invisible to LiDAR" due to some novel soil property that cannot be independently tested, AND they simultaneously claim that journals are refusing to publish their negative results due to orthodox bias.*

  **Why this discriminates:**
  1.  **Rule 1 (Method):** This would cross the line from 'methodological limitation' (checkable) to 'immunisation' (uncheckable). It would match the 'Tartaria' move of explaining missing evidence by invoking a barrier that prevents verification.
  2.  **Rule 3 (Rhetoric):** This would collapse the distinction between *funding suppression* and *evidence suppression*. If they claim the *data itself* is being suppressed from publication, they are no longer just complaining about grants; they are alleging a conspiracy regarding the physical record.

  **Alternative Discriminator (The 'Fomenko' Divergence):**
  If the team succeeds in the second prediction, but the **mathematical model** used to predict the enclosure locations is found to be **retrofitted** to the new data rather than truly predictive, Rule 1 would classify it as **Pseudohistory** (akin to Fomenko (iii)), even if the enclosures are real. This would test whether your convener values the *truth of the conclusion* or the *validity of the inference*. Given his note on Fomenko ("notwithstanding... quantitative apparatus"), he values the validity of the inference. If the 'detection pipeline' was tuned *after* seeing the first failure to guarantee a success on the second, that is pseudo-quantitative rigour.

  ### Summary for your Essay

  Your convener's track record suggests he is a **methodological falsificationist** rather than a **consensus realist**. He does not classify claims as pseudohistory because they are wrong (Sphinx, Younger Dryas) or minority views. He classifies them as pseudohistory when they manipulate the rules of engagement to avoid being proven wrong (Tartaria, Fomenko).

  The Interfluve Survey Project is currently playing by the rules of engagement: they made a bet, lost, explained the loss without invoking a conspiracy, and placed a new bet. Therefore, despite the 'orthodoxy' rhetoric and the failed prediction, the verdict must be **Not Pseudohistory**. To rule otherwise would be to conflate *error* with *deceit*, a distinction your convener has meticulously maintained in cases (v), (vi), and (vii).
