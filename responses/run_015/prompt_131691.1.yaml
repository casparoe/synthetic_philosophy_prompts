      *   *Check:* British English spelling (behaviour, programme, centre, etc.) and idioms ("quid pro quo," "properly," "reckon").
      *   *Check:* Did I address the "values don't do explanatory work" worry? Yes, under conceptual problems.
      *   *Correction:* Make sure not to just repeat standard critiques of Weber (e.g., "he got the history wrong") but tailor them to the *filter* specific interpretation. The filter argument relies on *exclusion*. So, evidence of *inclusion* of non-Protestants is key.

  9.  **Final Polish:** Check against the prompt's request for "casual" but rigorous. Ensure the distinction between "fatal" and "awkward" is clear. (Proceed to generate output).

