  2.  **Deconstruct the Theory (Epistemic Game Theory):**
      *   *Common Knowledge (CK):* Everyone knows $X$, everyone knows everyone knows $X$, ad infinitum. Crucial for coordination (e.g., attacking a fire flank simultaneously).
      *   *Mutual Knowledge (MK):* Everyone knows $X$, but not necessarily that others know it.
      *   *Common Belief in Rationality (CBR):* Everyone believes others are acting rationally to achieve shared goals.
      *   *Coordinated Attack Problem (Two Generals):* Over an unreliable channel, CK is impossible to achieve with finite messages.
      *   *Payoff Divergence:* Sometimes people don't coordinate because their incentives differ, not because they lack knowledge.

  3.  **Drafting the Procedure (The "Coordination Failure Protocol" - CFP):**
      *   Needs to be a checklist/flowchart style but written as text.
