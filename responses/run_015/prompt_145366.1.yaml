answer: |-
  This Coordination Failure Protocol identifies whether an incident stemmed from misaligned incentives, missing receipt, lack of shared awareness, or unreliable channels, but its authority stops at adjudicating individual negligence or physical impossibility.

  ### The Coordination Failure Protocol (CFP)

  **Data Sources:** Radio Logs, Incident Timeline, Two Interviews (one per involved party).
  **Missing Data Instruction:** If a log entry or interview answer is missing, record as **UNVERIFIABLE** and proceed to the next step; if UNVERIFIABLE accumulates in Steps 2–4, mark [JUDGMENT REQUIRED] for the District Ranger.

  **Step 1: Goal Alignment (Payoff Divergence)**
  *   **Question:** Did both parties benefit equally from the coordinated action succeeding?
  *   **Evidence:** Interview quotes regarding intent; Log entries showing task assignment.
  *   **Decision:**
      *   If **No** (e.g., one crew prioritized safety over speed while the other prioritized containment): **Finding = Incentive Conflict.** Remedy: Change tasking or authority structure. Stop.
      *   If **Yes**: Proceed to Step 2.

  **Step 2: Receipt Confirmation (Mutual Knowledge)**
  *   **Question:** Is there a log entry proving the message was sent and a log entry proving it was received?
  *   **Evidence:** Radio timestamps; "Copy" or "Roger" acknowledgments.
  *   **Decision:**
      *   If **No** (Message sent but no ack): **Finding = Communication Failure.** Remedy: Better radio or stricter radio discipline. Stop.
      *   If **Yes**: Proceed to Step 3.

  **Step 3: Shared Awareness (Common Knowledge)**
  *   **Question:** Is there proof both parties knew the *other* party received the message?
  *   **Evidence:** Acknowledgment of the acknowledgment (e.g., "Copy your copy"); Public announcement on open channel vs. private point-to-point.
  *   **Decision:**
      *   If **No** (I know you got it, but I don't know if you know I know): **Finding = Awareness Gap.** Remedy: Designated Decision-Maker or Public Announcement protocol. Stop.
      *   If **Yes**: Proceed to Step 4.

  **Step 4: Trust in Execution (Common Belief in Rationality)**
  *   **Question:** Did one party believe the other was unable or unwilling to act on the message?
  *   **Evidence:** Interview statements regarding competence ("I thought they were stuck"); Timeline discrepancies showing delayed action despite receipt.
  *   **Decision:**
      *   If **Yes** (Doubt existed): **Finding = Trust/Competence Failure.** Remedy: Training or Crew Reassignment. Stop.
      *   If **No**: Proceed to Step 5.

  **Step 5: Channel Stability (Unreliable Link)**
  *   **Question:** Is the communication channel known to drop messages intermittently (static, terrain shadowing)?
  *   **Evidence:** Historical log data; Terrain maps vs. radio line-of-sight.
  *   **Decision:**
      *   If **Yes** (Channel is unreliable): **Finding = Structural Impossibility.** Remedy: **Do not upgrade radio.** Implement Safe Standing Fallback or Pre-committed Trigger (e.g., "If no contact by 1400, withdraw"). Stop.
      *   If **No**: Proceed to Step 6.

  **Step 6: Residual Error (No-Change)**
  *   **Question:** Do Steps 1–5 show all protocols were followed and channels were stable?
  *   **Decision:**
      *   If **Yes**: **Finding = Random Variance.** Remedy: No Change. Stop.
      *   If **No** (Data gaps prevent conclusion): **Mark [JUDGMENT REQUIRED].** Hand decision to District Ranger.

  ### Simplification Notes
  **Survived Distinctions:** The protocol retains the critical separation between *Mutual Knowledge* (Step 2: I know you know) and *Common Knowledge* (Step 3: I know you know I know), as this is where most coordination failures hide. It also retains the distinction between *Knowledge* (Step 3) and *Belief in Rationality* (Step 4), acknowledging that knowing the plan isn't enough if you doubt the partner's ability to execute.
  **Dropped Distinctions:** We dropped the infinite recursion of common knowledge (knowing that knowing that knowing...) in favor of a practical "Acknowledgment of Acknowledgment" threshold. We dropped formal utility functions in favor of binary "Goal Alignment" interviews. We dropped probabilistic channel modeling in favor of binary "Channel Stability" based on historical logs.

  ### Case Applications

  **Case 1: The Ridge Near-Miss (Two Engine Crews)**
  *   **Scenario:** Crew A (above) and Crew B (below) radioed "Holding." Crew B pulled out; Crew A advanced. Near miss.
  *   **Application:**
      *   Step 1: Both wanted containment. (Pass)
      *   Step 2: Logs show both sent "Holding." Logs show both received "Holding." (Pass)
      *   Step 3: Logs show no acknowledgment of the acknowledgment. Crew B did not know Crew A knew Crew B was holding. (Fail)
      *   **Verdict:** **Awareness Gap.** The fix is not a better radio; it is a protocol requiring a closed-loop confirmation ("Copy your Holding") before either moves.
      *   **Outcome:** Validates your argument over the boss's.

  **Case 2: The Silent Hand Crew**
  *   **Scenario:** Hand crew waited for redeploy order. Acknowledgment never came back. They stayed put; fire overrun position.
  *   **Application:**
      *   Step 1: Goals aligned. (Pass)
      *   Step 2: Message sent, no ack received. (Fail Step 2 initially)
      *   *Correction:* If the boss argues "better radio," check Step 5.
      *   Step 5: Terrain caused intermittent dropout (Unreliable Link).
      *   **Verdict:** **Structural Impossibility.** Because the link is unreliable, no finite chain of confirmations guarantees safety. The fix is **not** a better radio. The fix is a Pre-committed Trigger ("If no radio contact by 1200, retreat to rally point").
      *   **Outcome:** Validates your argument that confirmations cannot close the gap over unreliable links.

  **Case 3: The Unwelcome Verdict (Clearing the Boss)**
  *   **Scenario:** A District Ranger wants to blame a Crew Boss for not moving. Logs show message sent, received, acknowledged, and channel was stable.
  *   **Application:**
      *   Steps 1–5 all Pass. Protocols were followed; knowledge was common; channel was stable.
      *   Step 4 Interview: Crew Boss admits, "I just hesitated."
      *   **Verdict:** **Random Variance** or **Individual Negligence** (outside protocol scope).
      *   **Outcome:** The procedure clears the protocol and the Crew Boss of systemic failure. The Ranger must accept that no procedural fix prevents human hesitation, or pursue individual discipline outside the AAR board.
      *   **Alternative Unwelcome:** If Step 5 fails (Unreliable Link), the procedure mandates a Fallback Trigger. If the Ranger insists a "Better Radio" is the fix, the procedure flags this as **Incorrect Remedy**, forcing the Ranger to sign off on a technical fix that the board records as ineffective for common knowledge generation.

  ### Limitations
  This procedure cannot determine if a person lied in an interview, it cannot account for sudden physical environmental changes not captured in the timeline (e.g., a wind shift unseen on camera), and it cannot resolve liability for injuries if the protocol was followed but the outcome was fatal. It isolates systemic coordination logic, not human error or act-of-God variables.
