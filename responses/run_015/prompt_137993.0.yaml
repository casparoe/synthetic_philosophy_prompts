answer: |-
  1. **You argue that reflection order changes the outcome—career first versus relationships first lands you in different places. But how do we know that's not just two different paths up the same mountain? How do you distinguish real indeterminacy from just multiple descriptions of the same endpoint?**

  *Follow-up:* She'll likely say the endpoints have conflicting preferences that can't be reconciled. If she does, ask: "If they're truly conflicting, doesn't that mean value itself is broken? Or are you just saying coherence is a myth?"

  2. **You give our current selves a seat at the bargaining table. But right now, I'm tired, depressed, and badly informed. Why does my current messed-up state get veto power over what my idealized self would want?**

  *Follow-up:* She'll probably argue that current selves anchor identity. If so, press: "But if my current self is depressed, doesn't that anchor lock in a distortion? How do you prevent the disagreement point from poisoning the whole bargain?"

  3. **Some people have preferences about the extrapolation process itself. Like, I might want to be persuaded, not just updated. Does your bargaining model handle preferences about how the extrapolation happens, or only the output?**

  *Follow-up:* She'll likely say process preferences are just another input. Ask: "But what if my process preference conflicts with the most efficient path to my ideal self? Does the process preference get extrapolated away too?"

  4. **If a superintelligence runs this extrapolation, isn't it just smuggling its own judgments in? How do we know the output is us and not the machine's implicit philosophy?**

  *Follow-up:* She'll probably say we can audit the steps. Ask: "But if the reasoning is too complex for us to verify, aren't we just trusting the machine's claim that it's neutral? Where's the check on that?"

  5. **Your fairness rule says no path gets privileged unless there's a reason. But who decides what counts as a good reason? Is that definition also up for extrapolation?**

  *Follow-up:* She'll likely say yes, the extrapolation decides what counts as a reason. If she does, ask: "But doesn't the rule about reasons have to exist *before* the extrapolation runs? Otherwise, you're using the output to define the input."

  6. **Let's say the endpoints disagree on something fundamental and the bargaining deadlocks. If you push the resolution into the extrapolation, aren't you just assuming the extrapolation resolves conflicts nicely? What if it doesn't?**

  *Follow-up:* She'll likely say the procedure guarantees a solution. Ask: "If the procedure guarantees a solution regardless of the agents' will, isn't that coercion? At what point does 'bargaining' just become a label for whatever the algorithm does?"

  7. **You say 'unless someone can say why.' Does 'someone' include the current depressed me, or only the idealized versions? If it's only idealized, aren't we back to privileging the ideal?**

  *Follow-up:* She'll likely try to split the difference. Ask: "If current selves can veto paths but idealized selves pick the reasons, doesn't that give the current self all the power to block but none to build? How is that stable?"

  8. **We keep circling back to fixes that happen inside the black box. Is there any part of this structure that *can't* be solved by saying 'we'll just put that in the extrapolation'?**

  *Follow-up:* She'll likely insist the framework is external. Ask: "Then name one constraint in your framework that the extrapolation isn't allowed to override. If there isn't one, isn't the framework just decorative?"

  9. **Last one. Before we turn this thing on, what could count as evidence that the procedure itself is broken? Not just the output looks weird, but the process failed?**

  *Follow-up:* She'll likely look for internal consistency checks. Ask: "But if the process is path-dependent by design, consistency might just mean it's consistently wrong. Do you need an external anchor, or are you comfortable flying blind?"
