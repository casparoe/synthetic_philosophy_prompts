answer: |-
  Based on Maya's track record, her verbal tics, and her career pivot to insurance liability, here is the breakdown of her causal logic, predictions for your dinner cases, and the diagnostic test to pin her down.

  ### The Predictions

  **Case A: The Two Factories (Joint Necessity + Norms)**
  *   **Verdict:** Only **Factory 2 (the illegal dumper)** caused the kill.
  *   **Reasoning:** This is structurally identical to her **Match/Oxygen (Case 5)** verdict. Both the match and oxygen were necessary for the fire, but only the match was the cause. Both factories are necessary for the fish kill (But-For causes), but Factory 1 is operating within its permit (the "background condition" or "normal state," like oxygen), while Factory 2 is violating a norm (the "intervention," like the match). She will treat Factory 1 as part of the causal *background*, not the causal *source*.

  **Case B: The Night Guard (Omission + Protocol)**
  *   **Verdict:** The **Guard did NOT cause** the theft.
  *   **Reasoning:** This inverts her **Gardener (Case 4)** verdict. In the Gardener case, the cause was the person who *violated* a duty (the contract). Here, the Guard *followed* the duty (the manual). Even though the manual is "stupid," in liability terms, the manual sets the "what was supposed to happen" baseline. Since he did what he was supposed to, his behavior is the default. The cause of the theft would be assigned to whoever wrote the manual (the norm-setter) or the thief, but not the rule-following guard.

  **Case C: The Pens + System Crash (Preemption + Overdetermination)**
  *   **Verdict:** The **Professor did NOT cause** the problem (the form failure).
  *   **Reasoning:** Maya's first tic is "wiggling." If you wiggle the Professor (he doesn't take the pen), does the outcome change? No, because the system crash guarantees the form fails anyway. While the Professor might have caused the *pen shortage*, he did not cause the *liability event* (the form failure). This aligns with her **Suzy/Billy (Case 2)** logic: causation tracks the actual mechanism that delivers the outcome. Here, the Crash is the preemptive cause of the failure; the pen shortage is causally inert regarding the final loss.

  ***

  ### The Underlying Rule

  Maya is not running a simple "But-For" test (Counterfactual Dependence), nor is she a pure Interventionist. She is running a **Structural Equation Model (SEM) with Default/Normal Values**.

  This is a specific philosophical framework (associated with theorists like Joseph Halpern, Judea Pearl, and Christopher Hitchcock) that combines her two tics:

  1.  **"Wiggling" (The Structure):** She builds a mental model of the world where variables are connected by equations. She tests causation by intervening on variables ($do(X)$). This explains why she says Suzy caused the break in **Case 2** (Preemption). In a simple But-For test, Suzy isn't a cause (because Billy's rock would have broken it anyway). But in an SEM, you hold the other variables fixed at their *actual* values. If you hold Billy's throw fixed, Suzy's throw makes a difference.
  2.  **"What was supposed to happen" (The Defaults):** She uses norms to set the **Default Values** for the variables in her model. When evaluating causation, she compares the actual world to a "normal" world. This explains **Case 4 (Gardener)** and **Case 5 (Match/Oxygen)**. Counterfactually, the neighbor watering the plants would have saved them, and the oxygen burning was necessary for the fire. But because those are "normal" defaults, they are pruned from the causal list. Only the *deviation* from the default (the Gardener's omission, the Match's strike) counts as a cause.

  **In short:** She identifies causes as **abnormal deviations** in a structural model that **make a difference** to the outcome when other variables are held fixed.

  ***

  ### The Most Weighty Verdict

  **Case 4 (The Gardener)** carries the most weight.

  While **Case 2 (Suzy/Billy)** proves she understands complex structural dependencies (ruling out simple But-For tests), **Case 4** proves that her "Supposed to happen" tic is not just conversational filler—it is a functional constraint on her causal attribution.
  In Case 4, the counterfactual dependence is identical for the Gardener and the Townspeople (if either watered, plants live). The *only* variable that changes is the Norm. Since her verdict changes based *solely* on the Norm, this confirms that Norms are acting as the filter for causal selection, not just the "Wiggling."

  ***

  ### The Diagnostic Test Case

  To distinguish whether she prioritizes **Structure** (Case 3 logic) or **Norms** (Case 5 logic) when they conflict, propose this case:

  **The "Mixed Overdetermination" Case:**
  > A warehouse burns down. Two fires merge to destroy it, and either one alone would have been sufficient.
  > *   **Fire 1:** Caused by a Lightning Strike (Normal/Act of God).
  > *   **Fire 2:** Caused by an Arsonist (Abnormal/Crime).
  >
  > **Question:** Did the Lightning cause the destruction? Did the Arsonist?

  **Why this splits the rules:**
  *   **If she says "Both Caused":** She is prioritizing **Structure (Case 3)**. In symmetric overdetermination (Lightning/Surge), she said both caused. Here, the physical structure is identical (two sufficient causes). The Norms are irrelevant to the structural fact of overdetermination.
  *   **If she says "Only the Arsonist":** She is prioritizing **Norms (Case 5)**. In the Match/Oxygen case, she rejected a necessary condition because it was "normal." Here, she would reject a *sufficient* condition because it is "normal," treating the Lightning as a background condition like the Oxygen.

  **Prediction:** Given her liability work, I suspect she will say **Only the Arsonist**. Insurance adjusts for "Acts of God" as background risk; liability hunts for the abnormal agent. This would confirm that for Maya, **Normative Abnormality trumps Structural Sufficiency.**
