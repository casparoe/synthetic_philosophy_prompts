answer: |-
  **Scenario Narrative**
  Governor Alessio of Pienza holds a fragile mandate over a city divided by rival guilds while a mercenary army camps three days' march away. A sudden landslide has blocked the enemy's supply pass, leaving them stranded without provisions for exactly one week, yet Alessio's treasury contains enough gold to either hire a strike force to annihilate the stranded enemy now or to fund a permanent civic militia and judicial overhaul that would prevent future factionalism. The guilds refuse to contribute further taxes until their private arms are legalized, threatening civil war if Alessio attempts to disarm them before securing the border, but the landslide will clear in seven days, restoring the enemy's mobility and ending the window for a preemptive victory.

  **Reasoning Chains**
  The **Instrumental-Adaptation (IA)** reading prescribes the strike. Here, *virtù* is the capacity to recognize and ride the wave of *fortuna*. The landslide is a genuine contingent gift—a specific *occasione*—that lowers the cost of victory temporarily. To ignore it is to allow *fortuna* to revert to its default hostile state. Since institutional reform requires stability, and stability requires the removal of the immediate existential threat, the strike is the prerequisite for any future architecture. *Virtù* demands boldness because the window is closing; hesitation is a failure of timing.

  The **Institutional-Domestication (ID)** reading prescribes the reform. Here, *virtù* is the capacity to build dams against the river of *fortuna*. The landslide is precisely the kind of random contingency that *virtù* should not rely upon; building strategy around a temporary geological accident is the definition of dependency on luck. If the strike fails or the landslide clears unexpectedly, the state is bankrupt and exposed. True *virtù* channels contingency by creating a militia and courts that render the enemy's mobility irrelevant. Bold opportunism is a failure of *virtù* because it leaves the underlying disorder (the armed guilds) intact, ensuring the next crisis will be fatal.

  **Structural Feature and Collapse**
  The divergence hinges on the **Impermanence of the Contingent Advantage**. IA values the advantage *because* it is fleeting (necessitating immediate action), while ID distrusts the advantage *because* it is fleeting (necessitating structural independence). If this feature is removed—specifically, if the landslide were permanent, rendering the enemy indefinitely immobile—the divergence collapses. IA would agree to reform, as there is no longer a "ticking clock" requiring opportunistic violence; the threat is neutralized without risk. Both readings would converge on the Institutional-Domestication prescription, as the urgency forcing the Instrumental choice disappears.

  **Defense of the Instrumental-Adaptation Reading**
  The Instrumental-Adaptation proponent would argue the scenario stacks the deck by treating "security" and "reform" as simultaneous options rather than sequential necessities. By implying that judicial overhaul and militia building can occur while an enemy army waits merely three days away, the scenario ignores the Machiavellian axiom that necessity forces action. Without the strike, the state may not survive the week to enjoy the benefits of reform; thus, the strike is not merely opportunistic but the foundational act of state-building. The ID reading privileges a theoretical long-term stability that is impossible without first securing the short-term survival that only the strike guarantees.
