      *   *Key Insight:* The distinction between Case 1 (War) and Case 6 (Colonialism) is the *consensus of the legal community*. Kellogg-Briand made war illegal-ish. Colonialism was still legal.
      *   *Case 5 Resolution:* The court is hypocritical, but the defendant is guilty. The principle should judge the *act*, not just the *tribunal*. But the prompt asks about the *prosecution's legitimacy*.
      *   *Advice:* Admit the court is flawed (Victor's Justice) but argue that some crimes are so grave they transcend the court's flaws. Case 5 falls in the middle. Maybe the verdict stands, but the sentencing should reflect the mitigating context of universal belligerent practice.

