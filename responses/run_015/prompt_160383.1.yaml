      *   *Correction on Case 6:* Why is Colonialism different? Because in 1945, the international legal system was built on the sovereignty of *states*, not the rights of *peoples* within states. Violating a border (Case 1) was a legal shock. Violating rights within a border (Case 6) was legally invisible then. This fits Component A (Recognizable Standard).
