answer: |-
  This is a remarkably clear-eyed dissection of the problem. You have identified the central tension of international criminal law: the conflict between *substantive justice* (punishing evil) and *procedural legitimacy* (fairness, consistency, and non-hypocrisy).

  Your tentative principle has two prongs:
  1.  **Recognizability:** The act was wrong by a standard the defendant could have recognized at the time.
  2.  **Reciprocity:** The prosecutors would accept the same rule applied to themselves.

  Here is an analysis of where your principle holds, where it breaks, and how to resolve the tensions you've identified.

  ### 1. Does the principle hold together?

  It holds together well for the clear-cut cases (Camps, Reprisals), but it faces a structural fracture in the comparison between **Case 1 (Aggressive War)** and **Case 6 (Colonial Practices)**, and it reaches a breaking point in **Case 5 (Factory Director)**.

  **The Case 1 vs. Case 6 Tension**
  You judge Aggressive War (Case 1) as "Right" but Colonial Practices (Case 6) as "Wrong," yet you note both were routine and claimed as rights. Why does your principle distinguish them?
  *   **The Distinction:** In 1945 international law, the primary unit of moral concern was the *sovereign state*, not the *individual human*.
  *   **Aggressive War:** This violated the sovereignty of another recognized state (e.g., France, Poland). The Kellogg-Briand Pact (1928) had already attempted to outlaw war as an instrument of national policy. Therefore, the "recognizable standard" (Prong 1) existed in treaty law, even if enforcement was new.
  *   **Colonialism:** This was viewed legally as internal administration. While morally repugnant, it did not violate the sovereignty of a recognized equal. The "recognizable standard" (Prong 1) did not exist in positive international law in 1945.
  *   **Verdict:** Your intuition is legally sound. Case 1 fits Prong 1 (shifting norms among states); Case 6 fails Prong 1 (norms hadn't shifted regarding internal imperial governance).

  **The Case 5 Breaking Point (The Factory Director)**
  This is where your principle snaps. You want to convict (because slavery is *malum in se*—wrong in itself), but you feel the court is corrupt because the victors did the same (failing Prong 2, Reciprocity).
  *   **The Problem:** If you strictly enforce Prong 2 (Reciprocity), you must acquit the director. But acquitting a slave-driver because the judges also used slave labor feels like a moral failure.
  *   **The Flaw:** Your principle conflates **the validity of the norm** with **the purity of the enforcer.**
  *   **The Fix:** Prong 2 should not require the prosecutor to have a spotless record; it requires them to accept the *binding nature* of the rule. If the Allies said, "Forced labor is a crime, and we acknowledge our own use of it was criminal and we submit to this rule going forward," the trial is legitimate. If they said, "It is a crime for you, but a necessity for us," the trial is illegitimate.
  *   **Recommendation:** Do not give up the verdict (convict the director). Instead, refine Prong 2. Legitimacy requires that the prosecutors acknowledge the *universality* of the law, even if they are hypocrites regarding their own past actions. Hypocrisy undermines *moral authority*, but it does not negate the *guilt of the accused* regarding crimes against humanity.

  ### 2. Which verdict should you give up?

  You should not give up a verdict based on the defendant's guilt; you should give up the expectation of **perfect procedural purity** for crimes that are *malum in se*.

  *   **Keep:** Convicting the Factory Director.
  *   **Modify:** Your assessment of the *Court*. You can hold two thoughts simultaneously: "The defendant is guilty of a crime against humanity" AND "The tribunal was compromised by victor's hypocrisy."
  *   **Why:** International law often emerges from the ashes of conflict. If we demand that the enforcers be sinless before they can punish evil, we grant impunity to the worst offenders whenever the opposing side is imperfect.
  *   **The Sacrifice:** You must sacrifice the idea that a "corrupt" court cannot render a "just" verdict. In transitional justice, imperfect justice is often the only alternative to vengeance or amnesty.

  ### 3. Applying the Principle to the Two Unsettled Cases

  Here is how your refined principle (Recognizability + Willingness to be Bound) applies to your new scenarios.

  **Case A: A tribunal created by a treaty signed by winners and losers alike, applying a statute drafted after the fighting ended.**
  *   **Analysis:** This addresses the *ex post facto* (after the law) concern.
  *   **Prong 1 (Recognizability):** If the losers sign the treaty, they are effectively consenting to the jurisdiction and the definitions, even if drafted post-conflict. This cures the "sovereign right" objection. It transforms the trial from "imposed law" to "contractual obligation."
  *   **Prong 2 (Reciprocity):** A treaty binds all signatories. If the winners sign it, they are theoretically subject to the same court.
  *   **Verdict:** **Legitimate.** This is the strongest possible legal foundation. It moves the trial from "Victor's Justice" to "Consensual Adjudication." (Historically, this is closer to the International Military Tribunal for the Far East's charter, though the power dynamic made German/Japanese consent coerced).
  *   **Caveat:** You must assess if the signature was truly voluntary or coerced under occupation. If coerced, it reverts to the Nuremberg problem.

  **Case B: A prosecution brought fifty years later, once the defendants' own country has itself adopted the law it is being tried under.**
  *   **Analysis:** This addresses the "foreign imposition" and "recognizable standard" concerns.
  *   **Prong 1 (Recognizability):** Since the defendant's own country has now adopted the law, the "recognizable standard" is no longer foreign or retrospective; it is domestic and current. The defendant is being held to their own nation's moral evolution.
  *   **Prong 2 (Reciprocity):** If the law is domestic, it applies to all citizens equally. The "victor" element is removed.
  *   **Verdict:** **Legitimate (with caveats).** This resolves the hypocrisy charge. However, it introduces a new problem: **Due Process and Memory.** Fifty years later, evidence may be lost, witnesses dead, and the defendant aged.
  *   **Refinement:** Your principle supports the *jurisdiction*, but you must add a third prong: **Feasibility of Defense.** If the delay makes a fair defense impossible, the trial becomes a show trial, regardless of the law's validity. (See the distinction between the Barbie trial in France [allowed] vs. attempts to prosecute very elderly low-level offenders [often stayed]).

  ### Summary of the Refined View

  Your intuition is robust, but your principle needs to distinguish between **crimes of sovereignty** (Aggressive War, Colonialism) and **crimes of humanity** (Camps, Slavery, Reprisals).

  1.  **For Crimes of Sovereignty:** Strict adherence to your principle is required. You cannot punish aggressive war or colonialism if the victors did the same and no prior law existed. (Your verdicts on Case 1 and Case 6 are correct).
  2.  **For Crimes of Humanity:** Prong 1 (Recognizability) is satisfied by natural law (murder is wrong). Prong 2 (Reciprocity) should be interpreted as "Willingness to be bound," not "Past Purity." You can convict the Factory Director (Case 5) while condemning the Allies' hypocrisy.
  3.  **For the New Cases:**
      *   **Treaty:** Legitimate, provided consent wasn't purely coerced.
      *   **50 Years Later:** Legitimate regarding jurisdiction, but requires strict scrutiny of evidentiary fairness.

  You do not need to choose between dismissing the trials or endorsing them wholesale. The most honest position is that Nuremberg and Tokyo were **legally flawed but morally necessary.** They established a vocabulary of accountability that did not exist before, purchased at the price of hypocrisy. Your principle holds together if you allow it to judge the *crimes* differently than it judges the *courts*.
