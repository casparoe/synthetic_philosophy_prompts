          *   *Wickham:* Psychopathic/Sociopathic in this framework. No spectator. Pure performance.
          *   *Jane:* The "over-charitable spectator." Smith warns against excessive candor. If you never condemn, you lose the ability to guide conduct. She fails to protect herself because her spectator is too weak.
