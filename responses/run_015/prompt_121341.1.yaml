answer: |-
  A senior epistemologist is asked by a grad student how he finally settled on his life's work regarding rational belief.

  "I attempted to optimize," the professor says, "but the scissors of bounded rationality snapped shut. My cognitive limits intersected with the environment's complexity, and the search costs were prohibitive."

  "So you satisficed?" the student asks.

  "Precisely. I began with an aspiration level of 'Necessary and Sufficient Conditions.' But after repeated search failures in the literature, I adjusted downward to 'High Probabilistic Confidence.' Still too computationally expensive. The environment resisted. I adjusted again to 'Internal Consistency.'"

  "Did you find a candidate norm?"

  "No. The search costs remained too high relative to the marginal gain in truth. So I lowered the aspiration level one last time."

  "To what?"

  "To 'Whatever hypothesis allows me to stop talking and go to lunch.' The environment provided the hunger, my brain provided the fatigue, and the scissors cut right through the truth."
