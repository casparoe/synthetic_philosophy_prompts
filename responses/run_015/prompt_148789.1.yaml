          *   Direct translations (what fits well).
          *   Distorted fits (political/spiritual ideas forced into software metaphors).
          *   No analog (what doesn't exist in engineering).
      *   **Conclusion:** Evaluate whether the "leftover bits" mean software thinking is too thin for history, or if the original theories were imprecise.
      *   **Constraint:** Don't worry about being exhaustive on Toynbee if it gets clunky.
      *   **Tone:** Technical, analytical, respectful of the user's expertise, avoiding oversimplification but embracing the metaphor.

  2.  **Deconstruct the Theories & Map to Software:**

