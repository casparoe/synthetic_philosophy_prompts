  If $B > A+$ and $A+ \ge A$, does $B > A$ follow?
  Yes, in standard order theory, if $>$ is the asymmetric part of $\ge$, and $\ge$ is transitive.
  $B \ge A+$ (from $B > A+$) and $A+ \ge A \to B \ge A$.
  Since $B > A+$, $B \neq A+$. If $B \sim A$, then $A \ge B$. Then $A+ \ge A \ge B \to A+ \ge B$. Contradiction with $B > A+$. So $B > A$.
  So the linking principle relies on the transitivity of $\ge$ and the definition of $>$.
  The user asked about "Transitivity of 'not worse than' plus whatever linking principle."
  I should clarify that standard value theory assumes $\ge$ is a preorder or weak order. The paradox attacks the consistency of these assumptions with the substantive premises.

