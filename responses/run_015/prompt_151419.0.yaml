  **Borough of Ostensive Definitions Planning Office**
  **Frequently Asked Questions: Conceptual Zoning and Linguistic Compliance**

  **Q: What are the necessary and sufficient conditions for a Class 4 Dwelling?**
  A: The Borough does not recognise necessary and sufficient conditions. Residents seeking classification for structures must instead demonstrate a network of overlapping similarities. As per Section 66 of the Planning Act, no single feature need run through all approved applications. Much like the fibres of a thread, where no single filament extends the full length, the strength of your classification lies in the overlapping of residential fibres, not in a core essence. Please submit Form 89b detailing these overlaps without attempting to isolate a defining characteristic.

  **Q: Why are the regulatory boundaries so vague?**
  A: Precision is a philosophical illusion. The Council rejects the demand for crystalline purity in administrative law. We operate on the rough ground of ordinary use, not the slippery ice of abstract logic. Residents are advised that clarity is not a prerequisite for enforcement. If a regulation appears ambiguous, this is not a defect but a feature of language-games in practice. Do not request sharper definitions; instead, observe how the regulation is currently being applied by your neighbours.

  **Q: Can I assign my own meaning to terms in a legal contract?**
  A: No. Under the Private Language Ordinance (2024), meaning is fixed by public practice, not private mental states. You cannot intend a word to mean something unless that usage is ratified by communal agreement. Citizens found utilising idiosyncratic definitions will be fined for disrupting the language-game. It is not a defence to claim you knew what you meant; if the community cannot verify your usage, the meaning is void. Compliance requires aligning your internal state with external behaviour.

  **Q: How do I know if I am following the rules correctly?**
  A: Rule-following is a practice, not an interpretation. No rule determines its own application in advance. You are following the rule correctly if your actions accord with the customary use of the rule within the Borough. Please note that appealing a decision on the grounds that you followed the "spirit" of the law rather than the letter is inadmissible. There is no spirit separate from the practice. If the Planning Officer says you are wrong, you are wrong, as their judgement constitutes the standard of correctness for this jurisdiction.

  **Q: My application was rejected because my concept lacked a boundary.**
  A: Concepts do not have strict boundaries. Please refer to the analogy of the game. Some games have balls, some do not; some have winners, some do not. Your proposal was rejected not because it lacked a boundary, but because you insisted on drawing one. Future applications should embrace the vagueness of the concept "Development." Do not ask what a Development *is*; ask how the word "Development" is used in this ward.

  Legislating for concepts without essences requires the administration to police the overlaps rather than the definitions.
