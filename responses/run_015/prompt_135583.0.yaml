answer: |-
  # JOINT STATEMENT ON NON-HUMAN AGENCY IN HISTORICAL EXPLANATION
  **Adversarial Collaboration Group: History & Causality**
  **Date:** October 26, 2023
  **Signatories:** Camp P (Causal Parity), Camp A (Accountability & Address)

  ## 1. AGREED SUBSTANTIVE CLAIMS

  Both camps affirm the following claims as necessary conditions for any historical explanation involving environmental or non-human factors. These claims are intended to rule out vacuous generalities and prevent explanatory drift.

  1.  **Independent Causal Leverage:** Non-human factors (pathogens, climatic shifts, geological events) exert causal leverage that is not always reducible to human intention, belief, or social construction. A historical explanation that treats a volcanic eruption *solely* as a discursive event, ignoring its thermal and atmospheric effects, is empirically deficient.
  2.  **Mediation and Interaction:** The impact of a non-human factor is never uniform across a population. Where a single pathogen or climate shock yields divergent outcomes (e.g., differential mortality in two cities), the variance must be explained by human-mediated structures (housing, nutrition, logistics). To cite the pathogen without citing the housing is to offer an incomplete causal chain; to cite the housing without the pathogen is to posit a miracle of immunity.
  3.  **Temporal Relevance (Overdetermination):** A factor is only causally relevant if its occurrence precedes or coincides with the outcome it is alleged to explain. An epidemic that arrives after a garrison has surrendered is not a cause of the surrender. Claims of causal parity do not license the inclusion of "difference-makers" that arrived too late to make a difference.
  4.  **The "Lazy Tropics" Prohibition:** It is a category error to move directly from a environmental premise (e.g., "the climate is hot") to a cultural or psychological conclusion (e.g., "the population is indolent") without specifying the mechanism. Environmental explanations are invalid when they rely on essentialist stereotypes rather than material constraints.
  5.  **Explanatory Cost:** Attributing "actorhood" or "agency" to non-human entities carries an explanatory cost. If the terminology obscures the human decisions that mediated the non-human impact (e.g., why some were exposed to the germ and others were not), the terminology has failed, regardless of its ontological precision.

  ## 2. METHODOLOGICAL CAVEATS AND DEVICE REPAIRS

  To ensure the following disagreement table is productive, we acknowledge that the adversarial devices carried over from previous meetings contain structural biases. We agree to the following repairs before applying them.

  *   **The Symmetry Audit (Repaired):**
      *   *Original Bias:* The original audit asked, "For every non-human cause, what human cause of identical magnitude would be written as a cause?" This presupposes that human and non-human causes *should* be treated symmetrically, rigging the test in favor of Camp P.
      *   *Agreed Repair:* **The Explanatory Consistency Check.** For any factor cited as a primary cause (human or non-human), we must ask: "Is there a factor of identical counterfactual magnitude in this same narrative that has been demoted to 'background condition'?" If yes, the demotion must be justified by a principled distinction (e.g., addressability) rather than implicit bias.
  *   **The Closed-Magistrate Case (Repaired):**
      *   *Original Bias:* The original case (1816 magistrate, mandatory sentencing, volcanic harvest failure) rigs the test in favor of Camp A by focusing on *legal discretion*. It forces Camp P to argue that a human with no discretion is ontologically identical to a volcano, which conflates *causal necessity* with *moral agency*.
      *   *Agreed Repair:* **Dual-Labeling Protocol.** In this specific test case, we agree to distinguish between **Causal Actor** (any necessary link in the chain of events) and **Accountable Agent** (an entity capable of reasoning or being held to account). Camp P and Camp A will apply their definitions of "Actor" to the *Causal* label, while acknowledging the *Accountable* label is reserved for the Magistrate (or the State) alone.

  ## 3. DISAGREEMENTS TABLE

  | The Crux | Camp P Formulation (Parity) | Camp A Formulation (Accountability) | Agreed Test / Case | Camp P Prediction | Camp A Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Reason-Responsiveness** | Actorhood does not require the capacity to respond to reasons. It requires only counterfactual dependence: if X had not occurred, Y would not have happened. | Actorhood requires the capacity to be addressed, answered, or held to account. A thing that cannot hear a question cannot be an actor, only a force. | **The Closed-Magistrate Case (Repaired).**<br>1816 Magistrate (no discretion) + Volcanic Eruption (harvest failure). | **Both are Causal Actors.** The Eruption forced the riot; the Magistrate (as an institutional conduit) forced the sentence. Both are necessary links. To exclude the Eruption is to hide the trigger. | **Magistrate is Accountable Agent; Eruption is Condition.** The Magistrate is the locus of the law, even if constrained. The Eruption is the *occasion* for action, not an *agent* of sentencing. Calling the volcano an actor exculpates the state. |
  | **2. Graded Agency** | There is no ontological "grade" of agency. There is only causal weight. A virus evolving under pressure and a volcano erupting are both causes; distinguishing them as "more" or "less" agentic is metaphorical. | There is a categorical break between systems sensitive to reasons (humans), systems sensitive to consequences (viruses/evolution), and inert systems (volcanoes). Conflating these erases the specific nature of historical action. | **Comparative Evolution Case.**<br>A virus mutating to bypass immunity vs. a volcano erupting due to pressure. | **Continuity.** Both are physical processes. The virus is more complex, but not a different *kind* of historical cause. Both belong in the causal story as difference-makers. | **Discontinuity.** The virus exhibits teleonomy (goal-directedness without mind); the volcano does not. Neither are *actors*, but the virus belongs in a different explanatory category than the volcano. |
  | **3. Explanation vs. Blame** | Explanation is descriptive. Blame is a secondary moral layer. Conflating them leads to "wishful history" where causes are excluded because they are uncomfortable (e.g., disease in colonial conquest). | Explanation in history is inherently normative. To explain is to allocate responsibility. Hiding this behind "objective causality" is a political act that protects power. | **Explanatory Consistency Check (Symmetry Audit).**<br>Applied to Colonial Conquest narratives (Epidemic vs. Military Decision). | **Audit reveals bias.** We will find that human decisions are routinely elevated to "causes" while non-human drivers of equal magnitude are demoted to "context" to preserve human-centric narratives. | **Audit reveals evasion.** We will find that non-human drivers are elevated to "causes" to obscure human culpability (e.g., "smallpox conquered them" vs. "we weaponized smallpox"). |

  ## 4. FALSIFICATION CONDITIONS

  To ensure this collaboration remains empirical rather than theological, each camp specifies what evidence would compel them to abandon or significantly revise their position.

  *   **Camp P Falsification Condition:**
      We would abandon the Causal Parity view if it were demonstrated that including non-human actors *systematically* reduces the predictive accuracy of historical models compared to human-centric models, *and* that this reduction cannot be corrected by adding nuance. If treating germs as actors consistently leads historians to miss the human logistical decisions that actually determined the epidemic's path, the parity framework is pragmatically useless.

  *   **Camp A Falsification Condition:**
      We would abandon the Accountability view if it were demonstrated that restricting "actor" to reason-responsive entities *systematically* forces historians to construct empirically false narratives. If we are required to ignore a volcanic cooling event as a "condition" in a way that makes the timing of a revolution inexplicable, or if the restriction consistently protects powerful human actors from scrutiny by masking structural constraints, the Accountability framework is ethically and empirically untenable.

  ## 5. CLOSING: VERBAL VS. SUBSTANTIVE AND FUTURE DIRECTION

  **On the Nature of the Dispute**
  We acknowledge that a portion of this dispute is **verbal**. Both camps agree on the physical chain of events (Volcano → Cooling → Harvest Failure → Riot → Sentence). We disagree on the label "Actor." Camp P treats "Actor" as a synonym for "Significant Cause." Camp A treats "Actor" as a synonym for "Moral Participant."

  However, the dispute is not *merely* verbal. It is **substantive** regarding the *ethics of narrative*. The label assigned to a cause influences policy, memory, and liability. If the volcano is an "actor," the state's failure to store grain is a tragedy. If the volcano is a "condition," the state's failure to store grain is a crime. The collaboration accepts that the choice of terminology has political effects that are not accidental.

  **Criteria for Continued Collaboration**
  Running this collaboration for another year is only warranted if we can move beyond labeling to **predictive divergence**. We will continue only if we can identify a historical case where Camp P's framework generates a specific archival search strategy or causal hypothesis that Camp A's framework explicitly rules out (and vice versa). If both frameworks simply redescribe the same evidence using different adjectives, the collaboration has reached its limit. We commit to finding one case study in the coming year where the *location of the archive* depends on the *definition of the actor*.

  ***

  **Signed,**

  _________________________
  *Representative, Camp P (Causal Parity)*

  _________________________
  *Representative, Camp A (Accountability & Address)*
