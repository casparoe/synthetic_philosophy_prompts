prompt: |-
  I help run a county wildlife sighting log — me and about forty volunteers, mostly retirees and a couple of high schoolers, who text me things or fill out a Google Form. In season I get maybe fifty records a week. Two grad students and the state natural heritage office pull from our log, and every few years the town leans on it when it rewrites its open space plan. So the stakes aren't nothing: a record of something rare can trigger a survey that costs real money and holds up a subdivision, and no record can mean a wet spot gets filled in. I've got about five minutes per record, no budget, and a retired state biologist named Dale who goes over whatever I flag, once a week.

  I'm not academic at all, but I got interested in that old Indian epistemology stuff — Nyaya, I think — with its four ways of knowing: pratyaksha (you saw or heard it yourself), anumana (you worked it out from signs like tracks, scat, chewed bark), upamana (you knew it because it was like something you already knew — the example I keep seeing is knowing what a gavaya is from being told it's sort of cow-like), and shabda (somebody told you, or the field guide says so). I probly have some of this garbled. What grabbed me is that our unwritten rule right now is basically no photo, no record, which now looks to me like it worships one of the four and throws the rest in the trash.

  So what I want is a procedure, not a discussion. Give me the questions in the order I should ask them, what counts as a good enough answer to each one, where the procedure just stops and says no, and where it hands the thing to Dale because the real issue is how much risk we're willing to take and not what's true. I need verdict labels I can put in a spreadsheet (confirmed, probable, in-but-unconfirmed, rejected, escalate), and I need it to be runnable by a volunteer in five minutes without me hovering.

  Four things it has to handle, because these are the ones I keep getting stuck on:

  Two reports of the same kind versus two of different kinds. My instinct is that two different kinds agreeing should count for more than two of the same kind — a photo plus a good inference beats two photos — but I don't know if "different kind" is even the right thing to be counting, or what to do when the different kinds disagree.

  Stuff I've started calling laundered perception. A volunteer writes "my neighbor saw one in her yard," and the neighbor did see it, so it feels like perception. But it comes to me as testimony, and I think I've been counting it twice, once as the seeing and once as the telling. Where does the procedure draw that line?

  Negative reports. A lot of what comes in is "walked the beaver marsh every week all summer, never heard a least bittern." Some lists of the ways of knowing seem to have a fifth one for knowing something from NOT seeing it, but the Nyaya four don't. If the four genuinely can't handle a negative, say so plainly instead of squeezing it in, because I'd rather have a hole I know about.

  And there's something I read about checking your own knowing, a kind of second look at the looking. Sounds like a time sink for someone with five minutes, but maybe it's the step that actually matters. Tell me honestly if it earns its place or if I should drop it.

  Then run it on three real-ish cases. First: a volunteer sends a sharp phone photo of a turtle with a yellow chin, first record for our county, with a note that her uncle has been trapping turtles since he was a kid and says it's the state-listed kind. Second: no photo of any animal, but photos of tracks in mud next to a ruler, described as bigger than coyote, round, no claw marks, from a volunteer who has tracked for thirty years — and the state says cougars aren't here, so this one could blow up. Third, and this is the one I care about unfairly: back in 2016 I saw a timber rattlesnake cross the trail on a ridge behind my own house, out walking the dog, no phone on me, and I've wanted the log to mark that ridge as occupied ever since. Run the procedure on my snake and tell me straight. I expect it says no, or in-but-unconfirmed at best, and I want to hear exactly why even though I definately won't like it.

  Also, please don't send me to any reading or give me names of books and papers — I've got no library card and no patience for it, and I don't care who said something first. And if any step is really just my gut wearing a lab coat, label it as that. Finally, tell me what the procedure can't do for me at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Coordinator of a county wildlife sighting log (40 volunteers, mostly retirees/HSers).
      *   **Constraints:** 5 minutes per record, no budget, one expert reviewer (Dale, retired state biologist) once a week.
      *   **Stakes:** High (land use, subdivision halts, wetland protection).
      *   **Philosophical Framework:** Interested in Nyaya epistemology (Pratyaksha/perception, Anumana/inference, Upamana/comparison, Shabda/testimony) but admits to potentially garbling it. Wants to move away from "no photo, no record."
      *   **Deliverables:** A step-by-step procedure (questions, pass/fail criteria), verdict labels, handling of specific edge cases (multiple reports, laundered perception, negative reports, self-check), application to three specific cases, limitations of the procedure.
      *   **Tone:** Practical, direct, no academic fluff, honest about uncertainty/gut feeling.

  2.  **Deconstruct the Nyaya Framework for Practical Use:**
      *   *Pratyaksha (Perception):* Direct observation (Photo/Video/Audio). High reliability, but can be faked or misidentified.
      *   *Anumana (Inference):* Signs (tracks, scat, damage). Requires expertise.
      *   *Upamana (Comparison):* "It looked like X but bigger." Relies on the observer's baseline knowledge.
      *   *Shabda (Testimony):* "My neighbor saw it" or "The field guide says." Relies on the source's credibility.
      *   *User's Insight:* Current system worships *Pratyaksha* (photos) and ignores the rest. The goal is to weight them differently, not equally.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Goal:* 5-minute triage.
      *   *Structure:* Funnel approach. Start with easy rejections, move to weighting evidence, end with escalation.
      *   *Verdicts:* Confirmed, Probable, In-but-Unconfirmed, Rejected, Escalate.
      *   *Step 1: Completeness & Basic Credibility.* (Is the form filled? Is the location possible?)
      *   *Step 2: Evidence Type & Weighting.* (Mapping Nyaya to data types).
      *   *Step 3: Corroboration.* (Handling the "two reports" issue).
      *   *Step 4: The "Laundered Perception" Check.* (Source chain).
      *   *Step 5: The Self-Check (Pramana Pariksha).* (Does it pass the sniff test?)
      *   *Step 6: Final Verdict.*

  4.  **Addressing Specific User Concerns:**
      *   *Two reports (Same vs. Different):* Independent corroboration is key. Two photos from the same bird aren't as good as a photo + tracks.
      *   *Laundered Perception:* Must trace back to the original perceiver. If the volunteer didn't see it, it's Shabda (testimony), not Pratyaksha (perception).
      *   *Negative Reports:* Nyaya doesn't have a specific "non-perception" pramana in the basic four (though *anupalabdhi* exists in later schools). For this practical log, treat as "Habitat Suitability" data, not "Species Presence." Don't mix them.
      *   *Self-Check:* Is it worth 5 minutes? Yes, but it needs to be a specific question, not a meditation. "Would I bet my reputation on this?"

  5.  **Refining the Verdicts:**
      *   *Confirmed:* Photo/Audio + Expert ID (Dale).
      *   *Probable:* Strong inference + Experienced observer OR Multiple independent sources.
      *   *In-but-Unconfirmed:* Single testimony, no photo, plausible but unverified. (Good for heat maps, bad for regulatory stops).
      *   *Rejected:* Impossible location, known hoax, contradictory evidence.
      *   *Escalate:* High stakes (rare species) + Ambiguous evidence. Needs Dale.

  6.  **Developing the Three Test Cases:**
      *   *Case 1 (Turtle):* Photo (Pratyaksha) + Uncle's Testimony (Shabda). High stakes (state-listed). *Verdict:* Escalate. Photo needs expert ID. Uncle's word adds weight but isn't proof.
      *   *Case 2 (Cougar Tracks):* Tracks (Anumana) + Experienced Observer. High stakes (State says no cougars). *Verdict:* Escalate. Anumana is risky for regulatory stops without Pratyaksha.
      *   *Case 3 (User's Snake):* Personal Memory (Pratyaksha in the past, now Shabda/Testimony). No photo. High personal stake. *Verdict:* In-but-Unconfirmed. Why? Because memory degrades, and for regulatory stakes, you need current, verifiable data. It's honest but not actionable for stopping a subdivision.

  7.  **Addressing the "Gut Wearing a Lab Coat" Requirement:**
      *   I need to explicitly flag where the procedure relies on intuition vs. hard rules. The "Plausibility Check" is largely gut calibrated by experience.

  8.  **Final Review against Constraints:**
      *   5 minutes? Yes, if questions are binary or scaled simply.
      *   No academic reading? Yes.
      *   Handle the four specific sticking points? Yes.
      *   Tell me what it *can't* do? Yes (cannot establish truth, only reliability).

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Nyaya:* Don't get bogged down in Sanskrit accuracy. Use the concepts as functional buckets.
      *   *Negative Reports:* Be clear. They are "Absence of Evidence," not "Evidence of Absence" unless the survey effort was standardized. Keep them separate in the log.
      *   *Laundered Perception:* Make the rule strict. "Who saw it?" If not the submitter, downgrade evidence type.
      *   *The Snake Case:* Be kind but firm. The user wants to know *why* their own memory isn't enough for high-stakes decisions. The answer is "verifiability for others," not "truth."

  10. **Final Polish:** Ensure tone is respectful of the volunteer work and the stakes involved. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, the user asked for the procedure *first*, then the test cases. I should structure it that way. Also, ensure the "Escalate" bucket is clearly defined as "Send to Dale."

  *(Refining the "Self-Check")*: The user asked if it earns its place. I should argue that in a 5-minute window, the self-check is simply "Does this smell wrong?" If yes, reject/escalate. If no, proceed. It's a heuristic, not a deep philosophical inquiry.

  *(Refining Negative Reports)*: Nyaya actually does have *Anupalabdhi* (non-apprehension) in some schools, but the user said "the Nyaya four don't." I will respect their premise: The four don't handle it well. I will advise treating negatives as "Effort Data" not "Sighting Data."

  *(Refining the Turtle Case)*: Photo exists. Why Escalate? Because it's state-listed. A volunteer ID isn't enough for regulatory action. Dale needs to see the photo.
  *(Refining the Cougar Case)*: No animal, just tracks. State says no cougars. This is high conflict. Escalate.
  *(Refining the Snake Case)*: User's memory. It's Shabda now (testimony of the coordinator). No photo. Stakes are high (ridge occupancy). Verdict: In-but-Unconfirmed. It informs general habitat modeling, not specific development halts.

  Let's assemble.cw
answer: |-
  Here is the procedure, the verdicts, the test cases, and the limitations. I have stripped the philosophy down to its functional parts so it fits in a five-minute window.

  ### The Procedure: "The Five-Minute Triage"

  **Goal:** Sort records into buckets based on *actionability*, not absolute truth.
  **Tools:** Your spreadsheet, the submission form, Google Maps.
  **Time:** 5 minutes max per record.

  #### Step 1: The Source Chain (Laundered Perception Check)
  *Ask:* **Who actually perceived the animal?**
  *   **A:** The volunteer submitting the form.
  *   **B:** Someone else (neighbor, uncle, hiker).
  *   **C:** No one (tracks, scat, damage).

  *Rule:* If **B**, the evidence type downgrades immediately. A photo sent by a neighbor is *Testimony* (Shabda) about a *Perception* (Pratyaksha), not direct *Perception*. You cannot verify the chain of custody.
  *   *Action:* Mark source as "Second-hand."
  *   *Stop:* If the source is "A friend of a friend" or anonymous internet rumor. **Verdict: Rejected.**

  #### Step 2: The Evidence Weight (Nyaya Bucketing)
  *Ask:* **What kind of proof is attached?**
  Assign points based on this scale. You need **3 points** for "Probable," **5 points** for "Confirmed" (pending Dale), **1 point** for "In-but-Unconfirmed."

  *   **Photo/Video/Audio Recording:** 2 points. (*Pratyaksha* - Direct Perception)
  *   **Physical Sign (Tracks/Scat) + Ruler/Scale:** 2 points. (*Anumana* - Inference)
  *   **Detailed Description + Observer History:** 1 point. (*Upamana* - Comparison/Knowledge)
      *   *Observer History:* "I've birded 20 years" = 1 point. "I'm new to this" = 0 points.
  *   **Testimony Only ("I saw it"):** 1 point. (*Shabda* - Testimony)
      *   *Note:* If Step 1 was "Second-hand," this is the max score possible.

  #### Step 3: The Corroboration Check (Two Reports Rule)
  *Ask:* **Is there another record for this species in this grid square within 14 days?**
  *   **Same Kind:** (e.g., Two photos). Add **1 point**. (Confirms presence, not ID).
  *   **Different Kind:** (e.g., Photo + Tracks, or Sighting + Scat). Add **2 points**. (Confirms presence *and* behavior/physics).
  *   **Disagreement:** (e.g., Photo says Red Fox, Tracks say Coyote). **Stop.** **Verdict: Escalate.**

  #### Step 4: The Plausibility Filter (The "Gut in a Lab Coat")
  *Ask:* **Does this break physics or biology for this location?**
  *   *Examples:* Saltwater fish in a mountain creek; Arctic bird in July; Cougar in a county surrounded by cities.
  *   *Rule:* If it contradicts established state range maps, subtract **3 points**.
  *   *Honesty Check:* This step is intuition calibrated by experience. It is not objective. It is you asking, "If I put this on the map, will Dale yell at me?"

  #### Step 5: The Negative Report Handling
  *Ask:* **Is this a "Zero" report?**
  *   *Rule:* The Nyaya four do not handle absence well. Do not mix these with sighting data.
  *   *Action:* Move to a separate tab called "Survey Effort."
  *   *Value:* A "No Bittern" report is not data about Bitterns. It is data about *Volunteer Hours*. It tells us where we *looked*, not what is *there*.
  *   *Verdict:* **Logged as Effort Only.** (Does not trigger surveys or stops).

  #### Step 6: Final Scoring & Verdict
  Sum the points from Steps 2, 3, and 4.

  *   **5+ Points:** **CONFIRMED.** (Send to Dale for final sign-off). Actionable for land use.
  *   **3-4 Points:** **PROBABLE.** (Send to Dale). Good for habitat planning, risky for regulatory stops.
  *   **1-2 Points:** **IN-BUT-UNCONFIRMED.** (Keep in log). Good for general heat maps. Do not use to stop development.
  *   **0 Points or Negative Total:** **REJECTED.**
  *   **Conflicting Evidence:** **ESCALATE.** (Send to Dale immediately).

  ---

  ### Addressing Your Four Sticking Points

  **1. Two Reports (Same vs. Different)**
  The procedure handles this in Step 3. Two photos prove the animal was there, but they might both be misidentified the same way. A photo *plus* tracks proves the animal was there *and* left physical evidence. Different kinds of evidence are harder to fake simultaneously. That is why "Different Kind" gets 2 points and "Same Kind" gets 1.

  **2. Laundered Perception**
  Step 1 draws the line. If the volunteer didn't see it, it is not Perception (*Pratyaksha*). It is Testimony (*Shabda*). You are not recording the sighting; you are recording the *report* of the sighting. This lowers the weight. It stops you from counting the neighbor's eyes and the volunteer's text message as two separate validations.

  **3. Negative Reports**
  The procedure admits the Nyaya four can't handle this cleanly. *Anupalabdhi* (non-perception) is a later addition to Indian logic for a reason—it's tricky. By moving negatives to "Survey Effort," you acknowledge the hole. You aren't saying "No Bittern." You are saying "We looked for Bittern here." This protects you from liability if a Bittern shows up later.

  **4. The Self-Check (Step 4)**
  Does it earn its place? **Yes.** In a 5-minute window, you cannot verify truth. You can only verify *coherence*. Step 4 is the "smell test." It is your gut wearing a lab coat. Without it, you will accept impossible data that looks good on paper. With it, you catch the 10% of errors that pass the other checks.

  ---

  ### Running the Cases

  #### Case 1: The Turtle
  *   **Data:** Sharp phone photo (2 pts) + Uncle's ID (Testimony/Shabda). Uncle is expert (1 pt). First county record (High Stakes).
  *   **Corroboration:** None yet (0 pts).
  *   **Plausibility:** State-listed species, but habitat matches (0 penalty).
  *   **Total:** 3 Points.
  *   **Verdict:** **ESCALATE.**
  *   **Why:** Even though it hits "Probable," the stakes (state-listed, subdivision halt) require the "Confirmed" bucket. A volunteer's photo + uncle's word is not enough to stop a legal development process. Dale must verify the photo.
  *   **Action:** Send to Dale. Mark as "Pending Expert ID."

  #### Case 2: The Cougar Tracks
  *   **Data:** Tracks with ruler (2 pts). Volunteer 30 yrs experience (1 pt). No animal (0 pts).
  *   **Corroboration:** None (0 pts).
  *   **Plausibility:** State says no cougars (-3 points).
  *   **Total:** 0 Points.
  *   **Verdict:** **ESCALATE.**
  *   **Why:** The math says "Reject," but the stakes (apex predator, public safety, massive land impact) override the math. This is a "High Risk, Low Evidence" scenario. You cannot reject it outright because the observer is credible, but you cannot accept it because it contradicts state biology.
  *   **Action:** Send to Dale. Note the contradiction. Do not publish on public map yet.

  #### Case 3: Your Snake (2016)
  *   **Data:** Memory only. No photo. (Testimony/Shabda - 1 pt). You are the coordinator (Observer History - 1 pt).
  *   **Corroboration:** None (0 pts).
  *   **Plausibility:** Ridge habitat is suitable (0 penalty).
  *   **Total:** 2 Points.
  *   **Verdict:** **IN-BUT-UNCONFIRMED.**
  *   **Why:** You asked for the hard truth. Here it is: **Your memory is now testimony, not perception.** Time has degraded the *Pratyaksha* into *Shabda*.
  *   **The Hard Part:** For a general habitat plan, this record is valuable. It tells planners "Ridges here are snake habitat." For stopping a specific subdivision *today*, it is useless. A developer will ask for current, verifiable data. A record from 8 years ago with no photo cannot hold up a legal challenge.
  *   **Action:** Log it. Mark it "Historical/Unverified." Use it to suggest surveys, not to block permits.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Establish Truth:** It establishes *reliability*. A "Confirmed" record might still be wrong (Dale might be tired, the photo might be a taxidermy mount). It just means you followed the process.
  2.  **It Cannot Handle "Secret" Locations:** If a volunteer marks "Location Hidden" to protect the animal, you lose the ability to check habitat plausibility (Step 4). You must downgrade these to "In-but-Unconfirmed" automatically.
  3.  **It Cannot Replace Dale:** This triage saves Dale's time; it does not replace his expertise. Any record that triggers a regulatory stop *must* pass his desk, regardless of your score.
  4.  **It Cannot Fix Bad Data Entry:** If a volunteer writes "big bird" instead of "Great Blue Heron," Step 2 fails. You need a dropdown menu on your Google Form to force *Upamana* (comparison) into specific categories.

  ### One Final Tweak for Your Form
  To make Step 2 work, change your Google Form. Don't let them write free text for "Evidence." Make them check boxes:
  *   [ ] Photo/Video attached
  *   [ ] Physical Sign (Tracks/Scat) measured
  *   [ ] I have identified this species before (Yes/No)
  *   [ ] I saw this directly (Yes/No)

  This forces the Nyaya categories onto them before the data ever reaches your inbox. It saves you the 2 minutes of reading interpretation, giving you the full 5 for the decision.
