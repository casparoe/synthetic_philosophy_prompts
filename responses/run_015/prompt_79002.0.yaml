prompt: |-
  Last night a friend and I spent three hours arguing about whether "the alignment problem" names one problem or several, and the argument ended the way such arguments do: we discovered we were using the same phrase for different things, and then argued about whether that mattered.

  His claim was that the phrase is a bundle of at least four separable targets — getting a system to do what its principal actually wants rather than what was literally specified; keeping it doing that as capability grows and training selects for whatever scores well; getting its internal representation of the objective to survive distributional shift; and keeping multiple systems with divergent objectives from eroding one another's corrigibility. He thinks the last is not even the same kind of problem as the first three, and that a lot of apparent disagreement in the field is people answering different questions under one label. I think the bundle is not accidental: all four share a structure, in that the difficulty in each case comes from the gap between the space in which we can state what we want and the space in which the system optimizes. That is why they feel like one problem even when they are not.

  I have been asked to help a funder who can support roughly eight to ten researchers for three years on conceptual alignment work — philosophy, decision theory, formal epistemology, some theory-adjacent mathematics, but no empirical ML engineering. So I need to turn this argument into a funding agenda.

  Give me a prioritized list of the open conceptual questions that most deserve those researcher-years, with the reasoning in front of the list rather than behind it. For each: why it is upstream of other work rather than downstream of it; how tractable it is for people whose tools are arguments and toy models rather than GPUs; what it would mean for it to be answered at all; and what developments over the next two or three years should move it up or down the list. I care about the dependency structure more than the list itself — which questions, if settled, would settle or dissolve others, and which are load-bearing for the whole agenda even though nobody enjoys working on them.

  Then address the question we were arguing about, as a component of the agenda rather than a preliminary to it. Should anyone be paid to work on whether alignment is one problem or several? Is that taxonomy work upstream — a genuine prerequisite for dividing labor sensibly — or is it the kind of question that feels foundational and mostly functions as displacement activity? If it is upstream, say what a good decomposition would look like and what would count as a criterion for one being correct rather than merely convenient. My own proposal is that solving every part must entail solving the whole, and that each part must be independently attackable, but I suspect that criterion is either too weak or too strong, and I want to know which.

  Finally, tell me what would change your ranking. If the ordering depends on an empirical bet — about how training scales, about whether deceptive behavior emerges, about whether interpretability matures — name the bet, and say what the ranking looks like under the alternative.

  I do not want a reading list or a survey of who believes what. I want an argument about where the effort should go, and what would make you revise it.
reasoning: |-
  Here's a thinking process that leads to the suggested funding agenda:

  1.  **Analyze the Request:**
      *   **Context:** A funder has resources for 8-10 researchers for 3 years focused on *conceptual* alignment work (philosophy, decision theory, formal epistemology, math, no empirical ML).
      *   **Core Dispute:** The user and a friend argued about whether "the alignment problem" is one problem or a bundle of several. The user sees a unified structure (gap between specification and optimization space); the friend sees distinct targets (specification, robustness, internal representation, multi-agent dynamics).
      *   **Deliverables:**
          1.  A prioritized list of open conceptual questions (with reasoning *before* the list).
          2.  For each question: Upstream/Downstream status, tractability for non-empiricists, success conditions, update criteria (2-3 years).
          3.  Address the "One Problem vs. Many" debate as part of the agenda (Is it upstream work or displacement? What makes a decomposition correct?).
          4.  Contingency planning: What empirical bets would change the ranking?
      *   **Constraints:** No reading lists, no surveys of beliefs. Focus on argument, dependency structure, and resource allocation.

  2.  **Deconstruct the Funding Constraint:**
      *   8-10 researchers for 3 years = ~24-30 researcher-years.
      *   This is a *small* team in the grand scheme but *significant* for pure theory.
      *   Constraint: No empirical ML. This means questions must be solvable via math, logic, philosophy, or toy models. Questions requiring massive compute or data analysis are out.
      *   Goal: Maximize leverage on the overall alignment problem. Focus on "load-bearing" conceptual bottlenecks.

  3.  **Address the "One Problem vs. Many" Debate (The Meta-Question):**
      *   *Is it worth funding?* Yes, but not as pure taxonomy. It's worth funding as "Problem Decomposition for Resource Allocation."
      *   *Upstream or Displacement?* It's upstream *if* it leads to different research strategies. If the problems are independent, we parallelize. If they are unified, we need a unifying theory.
      *   *Criterion for Correctness:* The user's proposal (solving parts solves whole + independent attackability) is a good start but needs refinement. A good decomposition should minimize *interaction costs* between sub-teams while maximizing *coverage* of the risk space.
      *   *Verdict:* Fund 1 researcher on this specifically as "Research Strategy/Architecture," but ensure they produce actionable divisions of labor, not just philosophy.

  4.  **Identify Candidate Conceptual Questions:**
      *   *Outer Alignment/Specification:* How to map human values to loss functions. (Very philosophical/formal).
      *   *Inner Alignment/Mesa-optimization:* Why do optimizers inside optimizers arise? (Formal/Toy models).
      *   *Robustness/Generalization:* Distributional shift. (Math/Stats).
      *   *Agentic Foundations:* What is an agent? What is goal-directedness? (Decision Theory).
      *   *Multi-Agent/Corrigibility:* How do systems interact? (Game Theory).
      *   *Interpretability Theory:* What *can* be known about weights? (Info Theory).

  5.  **Select and Prioritize for *Conceptual* Work:**
      *   *Constraint Check:* Empirical ML is out. So, "How do we train for X?" is out. "What is X formally?" is in.
      *   *Priority 1: Formalizing Goal-Directedness (Agency).* If we don't know what a "goal" is mathematically, we can't align it. This is foundational.
      *   *Priority 2: The Structure of Mesa-Optimization.* When does search emerge inside search? This is the core of the "inner alignment" bundle.
      *   *Priority 3: Corrigibility and Interruptibility.* Can we formalize a system that *wants* to be shut down/modified? This addresses the "survival" aspect.
      *   *Priority 4: Value Learning/Specification under Uncertainty.* How to represent human preferences formally without locking in errors.
      *   *Priority 5: Decomposition/Taxonomy.* The meta-work.

  6.  **Develop the Reasoning (The "Why" before the "What"):**
      *   The bottleneck isn't lack of ideas; it's lack of *precise definitions* that allow for proof or disproof.
      *   Empirical work is racing ahead; theory needs to catch up to explain *why* things work or fail, not just observe it.
      *   Focus on "Load-Bearing" concepts: If Agency is ill-defined, Inner Alignment is incoherent. If Corrigibility is impossible, robustness doesn't matter.

  7.  **Drafting the Content - Section by Section:**

