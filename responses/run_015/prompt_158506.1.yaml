answer: |-
  Hey, here's the draft for the Wigner question. I tried to steer clear of the usual "list the objections" prompt and forced them to work with that Mapping vs. Engineering distinction we talked about. The hypothetical should keep them from just regurgitating lecture notes.

  ***

  ### Exam Question (Question 3)

  **Time Allowed:** 90 Minutes
  **Marks:** 25

  **Prompt:**
  Eugene Wigner famously argued that the success of mathematics in physics is "unreasonable." However, we might refine this puzzle by splitting "effectiveness" into two distinct categories:

  1.  **Descriptive-Mapping Fit:** Mathematics successfully tracks structures already present in nature (passive observation).
  2.  **Interventionist-Engineering Fit:** Mathematics allows us to build technologies or predict phenomena that exploit hidden regularities we never observed directly (active manipulation).

  **Consider the following hypothetical case:** A physicist employs an abstract symmetry argument with *zero* empirical calibration to predict a specific particle decay rate. No data was used to tune the equation. Later, experiments confirm the prediction exactly.

  In a coherent essay, argue whether this hypothetical case supports one kind of fit over the other, or if the success of the prediction suggests the distinction collapses. Finally, conclude whether Wigner's puzzle still looks "unreasonable" once both kinds of fit are on the table. You do not need to cite external literature; rely on argumentative precision.

  ***

  ### Model Answer (5 Must-Hit Moves)

  *Note to graders: Students don't need to match this exactly, but a high-scoring essay needs to hit these five logical beats.*

  1.  **Define the Dichotomy:** The student must clearly articulate the difference between *Mapping* (math as a mirror of existing ontology) and *Engineering* (math as a tool that unlocks hidden potentials or predicts the unobserved).
  2.  **Classify the Hypothetical:** The student must argue where the symmetry/decay case fits. Strong answers will note that because there was *zero empirical calibration*, this leans heavily toward **Interventionist-Engineering** (math leading nature) rather than Descriptive-Mapping (math following nature).
  3.  **Evaluate the "Unreasonableness":** The student must assess whether distinguishing these two solves Wigner's worry. A key insight is that Engineering Fit is arguably *more* unreasonable than Mapping Fit, because it implies math dictates nature rather than just describing it.
  4.  **Test the Distinction (Collapse vs. Separation):** The student must address whether the distinction holds. Do successful engineering feats imply a deep mapping truth? (e.g., If you can engineer it, the structure must be there). Or are they distinct? (e.g., We can exploit regularities without understanding the underlying ontology).
  5.  **Final Verdict:** The essay must conclude with a definitive stance on Wigner's puzzle. (e.g., "The puzzle remains unreasonable because Engineering Fit suggests math is constitutive of reality, not just descriptive.")

  ***

  ### Marking Scheme (25 Marks Total)

  | Move | Weight | Typical Mistake (Costs Points) |
  | :--- | :--- | :--- |
  | **1. Define the Dichotomy** | 5 Marks | Conflating the two fits or treating them as synonyms for "true" vs. "false." |
  | **2. Classify the Hypothetical** | 5 Marks | Ignoring the "zero empirical calibration" clause and treating it as standard modeling. |
  | **3. Evaluate Unreasonableness** | 5 Marks | Simply summarizing Wigner's original argument without applying the new framing. |
  | **4. Test the Distinction** | 5 Marks | Asserting the distinction collapses without explaining *why* (e.g., "they're the same"). |
  | **5. Final Verdict** | 5 Marks | Sitting on the fence without justification or failing to answer the specific prompt question. |

  ***

  Let me know if you want to tweak the weighting on the "Collapse" section—that's usually where the A-students separate themselves from the B-students.
