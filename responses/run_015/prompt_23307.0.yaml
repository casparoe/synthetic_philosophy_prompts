          *   Premise 3: "Emptiness of emptiness" removes the ground for asserting emptiness itself, leading to skepticism or incoherence.
          *   *Strength:* Highlights genuine logical tensions that have plagued Madhyamaka interpretation for centuries (e.g., Nyaya critiques).
          *   *Weakness:* Assumes Madhyamaka is trying to build a positive metaphysical system subject to classical bivalent logic.

      *   **Ravi's Core Claim:** Therapeutic / Anti-Dogmatic.
          *   Premise 1: The horns represent *dṛṣṭi* (views) based on *svabhāva* (inherent nature).
