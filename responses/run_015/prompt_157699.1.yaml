answer: |-
  Headline Credence: 0.62

  ### Decomposition

  **1. Variance of Unmeasured Value**
  *Number: 0.85*
  *Justification:* Interventions differ wildly in institutional and normative spillovers that models exclude, creating a large reservoir of hidden value that varies significantly across the candidate set.

  **2. Directionality of Omission**
  *Number: 0.60*
  *Justification:* While hard-to-measure interventions are often undervalued, they are sometimes hard to measure because they are ineffective, so the bias is real but not absolute.

  **3. Correlation of Evaluator Error**
  *Number: 0.70*
  *Justification:* The community of cost-effectiveness analysts is small and homogenous, causing them to share blind spots and systematic modeling errors rather than cancelling them out.

  **4. Unrepairability of Bias**
  *Number: 0.50*
  *Justification:* Some biases can be corrected with haircuts or value-of-information calculations, but fundamental uncertainty about long-run causal chains resists quantitative adjustment.

  **5. Existence of Superior Lower-Ranked Options**
  *Number: 0.65*
  *Justification:* Given the variance and directionality above, it is probable that within any given funding cycle, at least one lower-ranked intervention holds more true value than the top pick.

  **6. Evidence Capitalisation (Mechanism 1)**
  *Number: 0.75*
  *Justification:* Interventions with past funding generate more data, artificially inflating their cost-effectiveness scores and locking in historical allocation patterns.

  **7. Measurement Treadmill (Mechanism 2)**
  *Number: 0.55*
  *Justification:* Implementers optimize for measured metrics over time, but this often reflects genuine learning rather than pure gaming, making the net distortion moderate.

  **8. Auditability Rent (Mechanism 3)**
  *Number: 0.80*
  *Justification:* Interventions that are easily verified from a distance are systematically favoured, and this property correlates only weakly with actual welfare impact.

  ### Combination Logic

  I treat the headline not as a simple average but as a weighted probability where **Directionality (Q2)** and **Superior Options (Q5)** are the primary gates; without these, the other factors are irrelevant. I calculate a "Bias Strength" index as the average of Q1, Q2, Q3, Q4, Q6, Q7, and Q8 (0.68), representing the likelihood that the model is distorted. I then multiply this by Q5 (0.65), representing the likelihood that this distortion actually flips the ranking order against a specific alternative. $0.68 \times 0.65 \approx 0.44$. However, this is too conservative because the resolution procedure only requires *some* lower-ranked option to be better, not a specific one, and the "Bias Strength" already implies the top pick is compromised. Therefore, I treat Q5 as a baseline probability that is *boosted* by the Bias Strength. I set the baseline probability of a ranking error at 0.40 (random noise) and add the weighted contribution of the systematic bias factors (0.22), yielding **0.62**.

  ### Value Theory Sensitivity

  My headline number assumes an impartial, long-run welfarist view. If we shift to a **rights-based or deontological view**, my credence rises to **0.80**, because cost-effectiveness models notoriously struggle to price rights violations or procedural justice, making the "unmeasured value" variance (Q1) and "auditability rent" (Q8) even more skewed against the top-ranked picks. If we shift to a **short-termist or donor-centric view** (valuing the donor's emotional connection or immediate visibility), my credence drops to **0.30**, because the models are actually quite good at optimizing for visible, short-term metrics which align with those values. The headline figure is therefore unstable if you reject welfarism, but generally moves *against* the ranking's accuracy under most alternative ethical frameworks.

  ### Mechanisms Pricing & Critique

  You asked me to price the three mechanisms separately to check for confusion. I have integrated them into the decomposition above (Q6, Q7, Q8) to ensure they drive the headline, but here is the specific assessment of their validity:

  1.  **Evidence Capitalisation (0.75):** This is not confused; it is a robust observation of path dependence. Money buys data, data buys credibility, credibility buys money. This creates a "rich get richer" dynamic in funding that is decoupled from true marginal value.
  2.  **Measurement Treadmill (0.55):** This is partially confused. You assume the drift is artificial. In many cases, repeated measurement *improves* delivery (learning by doing). I price it lower because it is a mix of real improvement and Goodhart's Law, making it a weaker driver of systematic error than the other two.
  3.  **Auditability Rent (0.80):** This is the strongest of the three. The requirement for arm's-length verification systematically filters out complex, context-dependent, or political interventions in favour of logistical ones (like bednets) regardless of the latter's diminishing returns.

  ### Diagnostics

  **Least Confident Term:**
  I am least confident in **Q2 (Directionality of Omission)**. It is easy to assert that "hard-to-measure is undervalued," but it is equally plausible that "hard-to-measure is hard because it doesn't work." Distinguishing between complexity and ineffectiveness is the core epistemic challenge, and my 0.60 reflects a guess rather than a hard signal.

  **Sensitivity Analysis:**
  If I perturb **Q5 (Existence of Superior Lower-Ranked Options)** within a defensible range (0.50 to 0.80), the headline number moves the furthest, shifting from **0.51 to 0.73**. This is because Q5 is the bottleneck; even if the models are biased (high Q1-Q4), the claim fails if the lower-ranked options are *also* bad or worse. The variance here drives the total uncertainty.

