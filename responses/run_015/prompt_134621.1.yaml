  ### Resolving the Tension (Cases 3 vs. 4)

  Your intuition that Case 4 understands while Case 3 does not is the linchpin of this principle.
  *   **Case 3 (LLM)** is a *static map*. It compresses correlations from training data. When it generates text, it is not "acting" to maintain a state; it is calculating a probability distribution. It is ungrounded syntax.
