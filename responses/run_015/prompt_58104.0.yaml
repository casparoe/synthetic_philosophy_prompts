      *   *Key Concepts to Weave In:* Strong vs. Weak Precautionary Principle, Type I/II Errors, Reversibility, Existential Risk, Opportunity Costs.

      *(Self-Correction during drafting)*: Make sure to address the specific prompt points: "harm, uncertainty, burden of proof, reversibility, proportionality, and the moral weight of foregone benefits." Don't miss the "underdetermined" section—this is crucial for a journalist looking for the "story behind the story." The SRM vs. Gene Drive distinction is the biggest tension point to highlight.

