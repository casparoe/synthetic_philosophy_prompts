      *   Ruled Out: That all uncertainty should stop action (Strong PP). That all uncertainty should be ignored (Libertarian).

      *(Final Polish)*: Ensure the distinction between "moratorium" and "monitoring" is clear. Ensure the "cost of delay" distinction is highlighted as the moral pivot point.

