answer: |-
  # Mechanism Identity Protocol (MIP-6)

  **Purpose:** To determine whether a detected anomaly instantiates a catalogued failure mechanism (allowing existing containment) or constitutes a novel mechanism (mandating root-cause investigation).
  **Time Budget:** 30 Minutes.
  **Decision Logic:** Steps 1–5 are conjunctive. A **"No"** on Steps 1–5 terminates the procedure and mandates **Full Root-Cause Investigation**. Step 6 resolves algorithmic certainty; a **"Yes"** on Step 6 triggers a **Human Judgment Hand-off**. Only a "Yes" on Steps 1–5 and a "No" on Step 6 yields a **"Same Mechanism"** verdict.

  ### The Procedure

  1.  **Functional Phenotype Match:** Is the observable error output (logs, signal deviation, behavioral fault) indistinguishable from the catalogued case?
      *   *Yes:* Proceed to 2.
      *   *No:* **STOP.** Verdict: Novel Mechanism (Investigate).

  2.  **Entity/Activity Correspondence:** Do the failing components perform the same causal role (activity) within the system, regardless of physical instantiation?
      *   *Yes:* Proceed to 3.
      *   *No:* **STOP.** Verdict: Novel Mechanism (Investigate).
      *   *Time-Pressure Simplification:* If under severe time constraint, this axis may be **dropped** *only if* Step 3 and Step 4 are robustly confirmed. (See Operational Notes).

  3.  **Organizational Topology:** Is the causal wiring (sequence, feedback loops, dependency graph) of the failing entities isomorphic to the catalogued case?
      *   *Yes:* Proceed to 4.
      *   *No:* **STOP.** Verdict: Novel Mechanism (Investigate).

  4.  **Counterfactual Dependency Preservation:** Does the same intervention (e.g., removing a node, dampening a signal) eliminate or alter the failure in the exact same manner as the catalogued case?
      *   *Yes:* Proceed to 5.
      *   *No:* **STOP.** Verdict: Novel Mechanism (Investigate).

  5.  **Boundary Condition Stability:** Does the failure trigger under the same environmental constraints (load, thermal, noise floor) as the catalogued case?
      *   *Yes:* Proceed to 6.
      *   *No:* **STOP.** Verdict: Novel Mechanism (Investigate).
      *   *Time-Pressure Simplification:* This axis may be **simplified** to "No known conflicting constraints" if Steps 3 and 4 are strong.

  6.  **Ambiguity Check:** Is there *any* residual uncertainty regarding the Organizational Topology (Step 3) or Counterfactual Dependency (Step 4)?
      *   *Yes:* **STOP.** Verdict: Hand-off to Human Judgment (Risk Tolerance Review).
      *   *No:* **CONCLUDE.** Verdict: Same Mechanism (Apply Containment).

  ***

  ### Operational Notes on Simplification
  *   **Core Axes (Non-Negotiable):** Organizational Topology (Step 3) and Counterfactual Dependency (Step 4). These define mechanistic identity. They cannot be dropped without destroying the philosophical basis of the protocol.
  *   **Simplifiable Axes:** Component Correspondence (Step 2) and Boundary Conditions (Step 5). In time-pressed settings, multiple realizability (different parts, same mechanism) is acceptable *if* Organization and Counterfactuals hold. If Step 2 is "No" but Steps 3 & 4 are "Yes," the team may bypass the Step 2 "Stop" rule under explicit Lead Officer authorization.

  ***

  # Case Applications

  ### Case 1: Mesh-Networked Swarm vs. Hierarchical Controller
  *   **Step 1 (Function):** **Yes.** (Exact error-signature profile).
  *   **Step 2 (Component):** **No/Debatable.** (Nodes vs. Central Controller). *Assume No for strict adherence.*
  *   **Step 3 (Organization):** **No.** (Peer-to-peer vs. Centralized).
  *   **Step 4 (Counterfactual):** **No.** (Removing single node ≠ Removing central controller).
  *   **Verdict:** **Novel Mechanism (Investigate).**
  *   **Process Flag:** Procedure stops at Step 3.
  *   **Team Resistance:** **High.** The team will resist this verdict because the *functional phenotype* (Step 1) is identical. Engineers often equate "same error message" with "same failure." Forcing a three-week shutdown for what looks like a known timing bug will be viewed as bureaucratic over-caution, despite the mechanistic difference in how the timing is governed.

  ### Case 2: Bio-Hybrid Actuator vs. Mechanical Actuator
  *   **Step 1 (Function):** **Yes.** (Phenotypic output identical).
  *   **Step 2 (Component):** **No.** (Bio-hybrid vs. Purely Mechanical).
      *   *Simplification Applied:* Under Time-Pressure Protocol, Step 2 "No" is bypassed because Steps 3 & 4 are strong.
  *   **Step 3 (Organization):** **Yes.** (Entity-activity mapping isomorphic).
  *   **Step 4 (Counterfactual):** **Yes.** (Intervention-response patterns isomorphic).
  *   **Step 5 (Boundary):** **Yes.** (Thermal stress trigger matches).
  *   **Step 6 (Ambiguity):** **No.** (Mappings are clear).
  *   **Verdict:** **Same Mechanism (Apply Containment).**
  *   **Process Flag:** Step 2 bypassed via Simplification Rule.
  *   **Team Resistance:** **Critical.** The team will resist this verdict strongly. While philosophically sound (mechanism is organization, not matter), the *material novelty* of bio-hybrids introduces unmodeled biological variance (drift, decay) that mechanical models do not capture. Permitting containment based on structural isomorphism risks propagating an error mode that biological degradation could alter later. This is an **unwanted containment** risk driven by the procedure's abstraction of physical substrate.

  ### Case 3: Cognitive Architecture (Missing Feedback Loop)
  *   **Step 1 (Function):** **Yes.** (Same misclassification pattern).
  *   **Step 2 (Component):** **Yes.** (Identical intermediate representations).
  *   **Step 3 (Organization):** **No.** (Feedback loop absent).
  *   **Step 4 (Counterfactual):** **No.** (Error propagation differs across nearby-world variations).
  *   **Verdict:** **Novel Mechanism (Investigate).**
  *   **Process Flag:** Procedure stops at Step 3.
  *   **Team Resistance:** **Low.** The absence of a feedback loop is a clear architectural change. The team will accept that error *correction* dynamics are part of the mechanism, not just error *generation*.

  ***

  # Limitations and Override Conditions

  ### What the Procedure Cannot Do (Blind Spots)
  1.  **Emergent Latency:** MIP-6 tests static organization and immediate counterfactuals. It is blind to slow-drift failures where the mechanism's organizational parameters shift gradually over time (e.g., synaptic weight decay in bio-hybrids) without changing the topological map.
  2.  **Contextual Embedding:** The procedure treats the system as closed. It cannot detect mechanistic novelty arising from external system-of-systems interactions not defined in the "Boundary Conditions" (Step 5).
  3.  **Probabilistic Mechanisms:** If the mechanism is inherently stochastic rather than deterministic, the "Counterfactual Dependency" (Step 4) may yield false negatives due to variance rather than mechanistic difference.

  ### Distortions of the Philosophical Account
  *   **Binary Topology:** Reducing "Organizational Closure" to a binary Isomorphic/Non-Isomorphic check (Step 3) distorts the philosophical nuance of *degrees* of organizational similarity. Mechanisms can be "similar enough" without being strictly isomorphic, but the procedure forces a hard line to ensure operational consistency.
  *   **Intervention Granularity:** Step 4 assumes interventions are clean and discrete. In complex distributed systems, interventions often have side effects that muddy the counterfactual dependency, potentially forcing false "Novel" verdicts.

  ### Override Conditions
  The Lead Officer must override the MIP-6 output entirely under the following conditions:
  1.  **Safety-Critical Threshold:** If the system controls life-critical infrastructure (e.g., medical autonomy, grid stabilization), any "Same Mechanism" verdict involving material novelty (like Case 2) must be upgraded to "Investigate" regardless of organizational isomorphism.
  2.  **High-Variance Environments:** If the operating environment is known to be non-stationary, Step 5 (Boundary Conditions) becomes non-negotiable and cannot be simplified; a "No" here must always trigger investigation.
  3.  **Historical False Positives:** If the specific catalogued mechanism has a history of "look-alike" failures that later diverged, the threshold for Step 6 (Ambiguity) must be lowered, forcing a Hand-off on minor uncertainties.
