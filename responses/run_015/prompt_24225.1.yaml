answer: |-
  Dear Friend,

  It is a pleasure to hear about your new project, and I find your interest in revealed preference theory particularly apt for a novelist concerned with how choices reveal character. You asked for my perspective on what the concept of utility signifies within this framework, and I wish to argue for a position that might initially seem cold but ultimately offers a profound clarity for your work. My contention is that in revealed preference theory, the utility function must be understood not as a measure of a real psychological state of the agent, such as her satisfaction, happiness, or the strength of her desire, but rather as a purely formal device whose only job is to rank her alternatives. This is not merely a matter of semantic preference but a logical necessity forced upon us by the mathematical structure of the theory itself, specifically the fact that any two utility functions representing the same preference relation differ only by a strictly increasing transformation.

  Consider what this mathematical property implies for the meaning of the numbers we assign to utility. If a function U represents an agent's preferences, then any function V that is a strictly increasing transformation of U represents those preferences equally well. This means that if choosing option A yields a utility of ten and option B yields a utility of five, we cannot say that the agent desires A twice as much as B, nor can we say she derives twice the happiness from it. We could just as easily transform the scale so that A yields one hundred utils and B yields ninety-nine, or A yields one util and B yields zero. Since the theory treats all these numerical assignments as equivalent representations of the same underlying reality, no fact about the amount or intensity of utility is fixed by the theory. The numbers convey order, nothing more. Consequently, utility cannot be a measure of psychological intensity because intensity implies a cardinal measure where differences matter, whereas revealed preference theory only guarantees an ordinal ranking where only the direction of difference matters.

  Once we accept that utility is merely a formal ranking device devoid of cardinal significance, we must confront the deeper consequence this has for the concept of preference itself. If utility is stripped of psychological content, then the preference relation it represents is similarly drained of inner life. In common parlance, we think of a preference as a mental state that precedes and causes a choice, a feeling of leaning toward one object over another. However, under the formalist reading required by the mathematics of revealed preference, a preference is nothing over and above the disposition to choose. The theory defines preference recursively through observed choice behavior, meaning that to say an agent prefers A to B is simply to say that when faced with both, she chooses A. There is no room in this framework for a hidden psychological struggle where she might prefer B but choose A, nor is there room for the idea that she prefers A with great passion versus mild interest. The theory is blind to the internal machinery of desire and sees only the external gearwork of selection.

  This leads us to the ultimate conclusion about what the theory actually describes. By stripping both utility and preference of psychological content to save the theory from the impossibility of measuring inner states, we are left with a description that belongs to the agent's choice function rather than her inner life. The theory maps the logical consistency of her actions, ensuring that if she chooses A over B and B over C, she does not choose C over A, but it tells us nothing about why she moves in that pattern. It describes a property of the system of choices, a structural integrity of behavior, rather than a narrative of motivation. For a novelist, this distinction is vital because it highlights the gap between what can be known from the outside and what exists within. Your character's choices will reveal the structure of her values to the reader, just as revealed preference theory maps the structure of an agent's choices, but the theory reminds us that this map is not the territory of her soul.

  I hope this perspective serves your story well, offering a rigorous way to think about the limits of what choice can reveal. There is a certain tragedy and beauty in the idea that we can only ever know each other through the formal logic of our actions, while the intensity of our utilities remains forever unmeasurable and private. I look forward to reading how you navigate this tension between the visible choice and the invisible heart.

  Warmly,

  Your Friend
