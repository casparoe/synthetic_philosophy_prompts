answer: |-
  This is a remarkably precise observation of a phenomenon that sits at the intersection of metaphysics, psychology, and game studies. You are correct that standard explanations like the Endowment Effect or Sunk Cost Fallacy are too blunt; they explain *intensity* of attachment, but not the *specific conditions* under which that attachment is violated.

  There is no single, universally recognized term like "The Tuesday Regulars Effect" in the literature, but your pattern maps almost perfectly onto a specific cluster of philosophical and psychological concepts. If we are to be precise, we should call this **Historical Essentialism applied to Virtual Artifacts**, or more poetically, **Virtual Haecceity**.

  Here is the breakdown of the concept, how it applies to your cases, the boundary conditions, and where the theory gets shaky.

  ### 1. The Name and Definition

  **The Established Concept:** **Historical Essentialism.**
  In philosophy, *essentialism* is the view that objects have a set of attributes that are necessary to their identity. *Historical* essentialism argues that an object's identity is not defined by its current properties (stats, look) but by its **causal history** (how it came to be, where it has been).

  **The Coined Term:** **Virtual Haecceity.**
  *Haecceity* (from the Latin *haecceitas*, "this-ness") is a philosophical term coined by Duns Scotus to describe the property that makes a specific thing *this* specific thing, distinct from all other things of the same type.
  I propose we use **Virtual Haecceity** to describe your group's specific pattern.

  **Definition:** *Virtual Haecceity* is the treatment of a digital object as a **historical individual** rather than a **functional type**. Under this view, the "soul" of the item is not its code (stats/model) but its **continuity of existence** within the game's causal chain. Harm is defined not as functional loss, but as **Biographical Rupture**—the breaking of the object's (or player's) continuous narrative thread.

  ### 2. Mapping Your Cases to the Theory

  Here is how *Virtual Haecceity* explains the specific distinctions that baffled you.

  *   **Case 1 (Nerf vs. Delete/Replace):**
      *   **Theory:** This distinguishes between *Accidental Change* vs. *Substantial Change*.
      *   **Analysis:** When the sword was nerfed, its *properties* changed, but its *history* remained intact. It is still the sword you killed the boss with. When it was deleted and replaced, the causal chain was broken. The new sword is a *numerical distinct entity* that merely resembles the old one. You felt robbed because the *individual* died, even if the *type* survived.
  *   **Case 2 (Re-skin vs. ID Change):**
      *   **Theory:** This distinguishes between *Surface Properties* vs. *Technical Haecceity*.
      *   **Analysis:** In an MMO, the "Item ID" (the database pointer) is the technical proxy for *haecceity*. Players intuitively understand that the ID is the object's "birth certificate." Changing the model is a makeover; changing the ID is reincarnation. The fury comes from the sense that the developers killed the original and mailed you a clone.
  *   **Case 3 (PvP Loss: New vs. Socialized):**
      *   **Theory:** This is **Narrative Identity** (a subset of Virtual Haecceity).
      *   **Analysis:** An object's history isn't just technical; it's social. Wearing the item in the capital integrated it into the group's shared story. It became a "character" in your guild's narrative. Destroying it wasn't losing stats; it was burning a chapter of your collective history.
  *   **Case 4 (Missed Drop vs. Deletion):**
      *   **Theory:** This highlights **Counterfactual History**.
      *   **Analysis:** The mount your guildmate got never entered *your* causal chain. It has no *haecceity* relative to you. When they deleted it, you felt a pang because you were mourning a *potential* history that was finally extinguished. It wasn't harm to *your* property, but harm to the *world's* story you were invested in.
  *   **Case 5 (Server Rollback):**
      *   **Theory:** This is the outlier. It shifts from *Object Haecceity* to **Subject Haecceity**.
      *   **Analysis:** Here, the object isn't the sword; the object is *you* (the player character/state). The rollback creates a Biographical Rupture for the *player*. The half of the group that was furious felt their *time* (lived experience) was stolen. You, who couldn't locate the loss, likely view the game state as a "current configuration" rather than a "cumulative history." This case reveals that your group is split between **Historical Essentialists** (furious group) and **Functionalists** (you, in this specific instance).

  ### 3. Boundary Cases

  You asked for boundary cases to test the tightness of the definition.

  **Boundary Case A: The Rollback (Expanded)**
  *   *Scenario:* Server crashes. Backup restored. You lose 3 hours of loot gathering.
  *   *Virtual Haecceity Verdict:* This is **Subjective Biographical Harm**.
  *   *Why:* The "object" harmed is your session history. If you view your character as a container of experiences, the rollback is a lobotomy. If you view your character as a set of current stats (Functionalism), the rollback is irrelevant provided stats are restored.
  *   *Distinction:* This differs from the sword deletion because the "history" being erased is *your* memory/effort, not the *object's* lineage.

  **Boundary Case B: The Amnesiac NPC**
  *   *Scenario:* An NPC quest-giver remembers your past deeds ("Ah, the hero who saved the village!"). A patch rewrites the NPC so they no longer remember you, though the quest rewards are identical.
  *   *Virtual Haecceity Verdict:* **Narrative Harm.**
  *   *Why:* The NPC is a vessel for shared history. Rewriting their memory severs the causal link between your past actions and the current world state. Even if the *function* (quest completion) is unchanged, the *validation of your history* is destroyed. Under Virtual Haecceity, this is a genuine harm because it invalidates the *truth* of your past interactions.

  **Boundary Case C: The "Cloned" Item**
  *   *Scenario:* A bug allows you to duplicate an item. You keep one, give one to a friend. Both have the same ID, stats, and history up to the point of duplication.
  *   *Virtual Haecceity Verdict:* **Haecceity Crisis.**
  *   *Why:* This breaks the "uniqueness" requirement of *this-ness*. Most players will instinctively feel one is "real" and one is "fake" (often the original is "real"), or both are tainted. Virtual Haecceity predicts players will eventually devalue both because the *singular causal chain* has been forked.

  ### 4. Where the Answer is Shaky (The Honest Assessment)

  You asked me to be honest about where this framework might be masking unrelated effects. There are two major weak points in calling this a unified "pattern."

  **Weakness 1: Technical Intuition vs. Metaphysics (Case 2)**
  Is your fury over the ID change truly metaphysical (Historical Essentialism), or is it just **Technical Literacy**?
  *   *The Critique:* Long-time MMO players learn that `Item_ID_12345` is the "real" item. When devs change that, players know it triggers different flags, might break transmog collections, or might not count for future achievements.
  *   *The Shake:* It is possible that Case 2 isn't about "history" at all, but about players intuitively understanding database architecture and fearing *functional* downstream consequences they can't yet see. If you asked a non-gamer, they might not care about the ID. This suggests the "Essentialism" is learned behavior specific to the medium, not a deep philosophical stance.
  *   *Convincing Evidence:* If the devs changed the ID *but* guaranteed all collections/achievements/transmog data transferred perfectly, and your group *still* felt fury, then it is truly Virtual Haecceity. If the fury vanishes when functionality is guaranteed, it was just risk aversion.

  **Weakness 2: The Rollback Split (Case 5)**
  You noted that half the group was furious and half (you) couldn't locate the loss. This suggests **Virtual Haecceity is not a stable trait**, but a contextual mode.
  *   *The Critique:* You might be a Historical Essentialist regarding *guild artifacts* (swords, mounts) but a Functionalist regarding *personal progression* (time spent).
  *   *The Shake:* This implies there isn't one "view" your group holds. There are two competing ontologies running in parallel:
      1.  **Relic Ontology:** Objects are historical artifacts (Swords, Mounts).
      2.  **Tool Ontology:** Objects/Time are resources for current utility (Grinding, Rollbacks).
  *   *Convincing Evidence:* If you would pay real money to restore the 3 hours of lost time *even if* you couldn't remember what you did in those hours, then you are a Historical Essentialist about time. If you only care about the time because of the *loot* you would have gotten, you are a Functionalist.

  ### Summary

  The pattern has no single common name, but it is best described as **Virtual Haecceity**: the treatment of digital objects as historical individuals defined by causal continuity rather than functional properties.

  *   **It covers:** The distinction between nerf (change) vs. delete (death), skin (clothing) vs. ID (soul), and socialized items (narrative) vs. raw drops (tools).
  *   **It struggles with:** Distinguishing between genuine metaphysical attachment and learned technical anxiety (the ID issue), and explaining why the same players switch between "Historical" and "Functional" modes depending on whether the object is a relic or a resource.

  Your group isn't just playing a game; you are collectively maintaining a **distributed archive of causal histories**. When an item is deleted or an ID changed, you aren't losing data; you are losing a reference point in your shared history. That is a genuine harm, regardless of who "owns" the code.
