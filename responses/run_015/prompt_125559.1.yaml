prompt: |-
  I lead the risk-quantification group at a company operating a fleet of several hundred autonomous vehicles in mixed traffic across six metro areas, and I need something my analysts can actually run rather than something that sounds wise.

  The job, in outline. Every two weeks our scenario-mining pipeline flags forty to sixty situation types from fleet telemetry and simulation, and for each one an analyst has to attach a number to a sentence of roughly this form: situations of this kind lead to an event with injury potential at a rate below X per million vehicle-miles. Those numbers are aggregated into a safety case that our internal review board signs and that a regulator reads, and the regulator is not friendly. Turnaround is four working days per batch, the team is three analysts with strong statistics training and no philosophy, every class definition has to be frozen under a version number and reproducible from our logs a year later, and the whole thing has to survive being read by someone whose job is to find the move we made to get the number we wanted.

  The obstacle is the reference class problem. I have read the usual material — base rates, the outside view, the advice to use the narrowest class for which you have adequate data, pre-register the class before looking at the outcome — and none of it survives contact with our data, for reasons I want the procedure to confront rather than gesture at:

  First, our candidate classes are almost never nested. A class can be narrow along one axis and broad along another, so the instruction to take the narrowest class with enough data has no determinate answer, and my analysts resolve this differently from each other and from week to week.

  Second, many of our candidate classes exist only inside a simulator. Choosing a reference class and choosing a generative model are then the same act, and the base rate inherits whatever the generator assumes. The procedure needs a step for auditing that entanglement and for deciding when simulation-derived rates may and may not be pooled with fleet-derived ones.

  Third, our historical data are endogenous. They come from the system we already chose to deploy, under the conditions we chose to permit, with the mitigations we already fielded and the remote operators we already staff. The historical rate is therefore conditional on our own past screening, and it will not stay fixed if we act on it — by expanding the operating domain, or by scaling remote assistance down.

  Fourth, and worst: with enough axes to choose from, an analyst can nearly always find a class that supports the number she hopes for, without ever being dishonest. I want this failure to surface somewhere other than in argument. My current idea is a standing ledger of every class-definition decision, scored after the fact, so that we audit the class-picker rather than the individual estimate — but I would rather have your version of that mechanism than my sketch, and I want it specified tightly enough that it can be gamed only at visible cost.

  What I am asking for, concretely. A written decision procedure an analyst can run on a flagged situation type: the questions in order; what counts as a sufficient answer to each; the tests a proposed class must pass before its rate may be used (at minimum I want an axis specification, a pre-outcome feature test, an adversarial re-derivation test in which a second analyst sees only the written definition and must reproduce the same case set, and a stability test under the policy changes we are contemplating); the points at which the procedure returns no number and escalates; and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact. Be explicit about which steps are real procedure and which are judgment calls wearing a procedural costume. I do not need citations or the history of the idea; I need something I can hand to an analyst on Monday.

  Then run it on three cases. (1) A left turn across oncoming traffic at a signalized intersection with no protected phase: about forty fleet instances and zero events, against a broad class of roughly twenty-two hundred intersection interactions containing three events. (2) Expansion into a metro area where the emergency-vehicle siren pattern, the pedestrian-signal conventions, and the customary turn etiquette all differ from anywhere we operate: no fleet data at all, and the only candidates are a simulator class from a generator validated in our existing cities, human crash statistics for that city, and our own data from cities with different conventions. (3) The case I expect to dislike: a class the team has quietly used for two years, defined partly by a feature an analyst codes after watching the clip rather than by anything in the logged schema, and which silently excludes the situations in which a remote operator took over before the maneuver began — precisely the population we would create by reducing remote assistance. Show me how the procedure catches it, what corrected number it forces, and what it says we must do about a safety case we have already filed.

  Finally, tell me what the procedure cannot do: which parts of the problem it leaves exactly where it found them, and where it will misfire in ways my analysts will not notice until a regulator points at them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Lead of risk-quantification group for an AV fleet (hundreds of vehicles, 6 metros).
      *   **Task:** Create a concrete, actionable decision procedure for analysts to assign risk rates (injury potential per million VMT) to flagged situation types.
      *   **Constraints/Context:**
          *   Turnaround: 4 days/batch.
          *   Team: 3 analysts (strong stats, no philosophy).
          *   Audience: Internal review board + hostile regulator.
          *   Requirements: Reproducible (versioned class definitions), auditable, resistant to p-hacking/gaming.
          *   Core Problem: Reference Class Problem (non-nested classes, simulation entanglement, endogenous data, analyst degrees of freedom).
      *   **Deliverables:**
          1.  Written decision procedure (steps, tests, escalation points, judgment vs. procedure).
          2.  Run the procedure on three specific cases (Left Turn, New Metro Expansion, Endogenous/Remote Operator Class).
          3.  Limitations analysis (what the procedure *cannot* solve).
      *   **Tone:** Pragmatic, rigorous, operational, no fluff, no citations.

  2.  **Deconstruct the Core Problems & Design Solutions:**

      *   *Problem 1: Non-nested classes.*
          *   *Solution:* Require explicit axis declaration and a "Specificity Score" based on data volume vs. feature count. Force a choice between "Fleet-Empirical" and "Model-Derived" with different confidence penalties.
      *   *Problem 2: Simulation Entanglement.*
          *   *Solution:* A "Generator Audit" step. Simulation rates must be tagged with the generative assumptions. Pooling requires a "Distributional Shift Test."
      *   *Problem 3: Endogenous Data (Policy Dependence).*
          *   *Solution:* A "Counterfactual Stability Test." If the rate changes if we remove the mitigation (e.g., remote operator), the rate is invalid for the *future* state. It must be labeled "Conditional on Mitigation M."
      *   *Problem 4: Analyst Degrees of Freedom (Gaming).*
          *   *Solution:* The "Blind Re-derivation Test" (as requested) + a "Class Stability Ledger." If the class definition changes significantly between analysts, it's too vague.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Needs to look like a checklist or SOP.
      *   *Steps:*
          1.  **Class Definition & Axis Locking:** Define features *before* counting events.
          2.  **Data Source Tagging:** Fleet vs. Sim vs. External.
          3.  **The Blind Re-derivation (Inter-Analyst Reliability):** Can another analyst find the same cars?
          4.  **Endogeneity Check:** Does this rate depend on a mitigation we might change?
          5.  **Stability/Stress Test:** Does the rate hold if we tweak the definition slightly?
          6.  **Escalation:** When to say "No Number."
      *   *Judgment vs. Procedure:* Need to explicitly mark where human judgment is unavoidable (e.g., selecting the *relevant* axes) vs. where the math rules (e.g., minimum sample size).

  4.  **Running the Cases:**

      *   *Case 1 (Left Turn):* 40 instances, 0 events vs. 2200 instances, 3 events.
          *   *Issue:* Zero numerator problem vs. dilution.
          *   *Procedure Application:* The narrow class fails sample size. The broad class fails relevance (heterogeneity).
          *   *Outcome:* Escalate. Use Upper Confidence Bound (UCB) on the narrow class, but flag the uncertainty. Don't pool blindly.
      *   *Case 2 (New Metro):* No fleet data. Sim vs. Human Stats vs. Old Fleet.
          *   *Issue:* Transfer learning validity.
          *   *Procedure Application:* Sim fails Generator Audit (not validated for *these* conventions). Human stats fail Endogeneity (human drivers $\neq$ AV). Old Fleet fails Distributional Shift.
          *   *Outcome:* No Number. Requires "Shadow Mode" deployment first.
      *   *Case 3 (The "Dirty" Class):* Post-hoc coding, excludes remote takeovers.
          *   *Issue:* Endogeneity + Definition Vagueness.
          *   *Procedure Application:* Blind Re-derivation fails (subjective coding). Endogeneity Check fails (rate depends on remote staff).
          *   *Outcome:* Class invalidated. Safety case amendment required.

  5.  **Analyzing Limitations:**

      *   What can't this fix?
      *   *Unknown Unknowns:* The procedure only tests defined classes.
      *   *Regulatory Arbitrage:* A regulator can still reject the *axes* chosen.
      *   *Cost of Rigor:* It slows things down (though the user said 4 days is the limit, this might push it).
      *   *Simulation Truth:* We still can't prove the sim matches reality, only that it's consistent.

  6.  **Refining the Tone:**

      *   Avoid academic language. Use "Must," "Shall," "Fail."
      *   Acknowledge the political reality (hostile regulator).
      *   Ensure the "Ledger" idea is integrated as a concrete step.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the "Blind Re-derivation" feasible in 4 days?
      *   *Fix:* Make it a sampling check, not a full re-run every time. Or specify it's a peer-review step within the 4 days. Let's make it a mandatory peer-check for every batch.
      *   *Critique:* The user wants to know where judgment wears a procedural costume.
      *   *Fix:* Add a specific column or note in the procedure marking "Judgment Call."
      *   *Critique:* Case 3 needs to show how to fix the filed safety case.
      *   *Fix:* Explicitly state the requirement for a "Retrospective Amendment."

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   4 days turnaround? (Procedure must be tight).
      *   3 analysts? (Peer review is possible).
      *   Versioning? (Include Class ID versioning).
      *   Regulator hostile? (Emphasize audit trail).

  9.  *(Self-Correction on Case 1)*: The prompt asks for a rate "below X". With 0 events in 40 instances, you can't claim a low rate without a massive confidence interval. The procedure must force the use of Bayesian priors or UCB, not just point estimates. I will enforce a "Minimum Credible Count" rule.

  10. *(Self-Correction on Case 3)*: The prompt asks what corrected number it forces. I need to calculate or describe the recalculation including the remote takeovers as "potential events" or at least exposing the denominator change.

  11. *(Final Review of Limitations)*: Be honest. This procedure doesn't solve the philosophical problem of induction. It just makes the betting explicit.

  12. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ## OPERATING PROCEDURE: RQC-REF-CLASS-V4
  **Owner:** Risk Quantification Group
  **Applicability:** All safety-case rate assignments for flagged situation types.
  **Constraint:** Must be executable within 4 working days per batch.

  ### PART 1: THE DECISION PROCEDURE

  **Objective:** Assign a risk rate ($R$) with a confidence bound ($C$) to a situation class ($S$), or escalate to "No Number."

  #### STEP 1: AXIS LOCKING (Class Definition)
  **Action:** Define $S$ using *only* features present in the raw log schema at the time of the event window.
  **Requirement:**
  1.  List all axes used to define $S$ (e.g., `intersection_type`, `light_state`, `traffic_density`).
  2.  For each axis, state the binning logic (e.g., `density > 0.8` not "heavy traffic").
  3.  **Prohibition:** No features derived from post-hoc video review (e.g., "pedestrian looked hesitant").
  **Pass Condition:** A second analyst can write a SQL/query script to extract $S$ using *only* the provided schema documentation, without asking the defining analyst a single question.
  **Judgment Call:** Which axes are *relevant*. (Procedure cannot solve relevance, only enforce consistency).
  **Failure:** If any axis requires human interpretation of unstructured data, **ESCALATE**.

  #### STEP 2: THE BLIND RE-DERIVATION TEST (Inter-Analyst Reliability)
  **Action:** A second analyst (Peer) receives *only* the Axis Locking definition from Step 1. They must query the dataset to produce the instance count ($N$).
  **Requirement:**
  1.  Peer runs query independently.
  2.  Compare Instance IDs generated by Defining Analyst vs. Peer.
  **Pass Condition:** Jaccard Similarity Index $\geq 0.95$ between the two instance sets.
  **Failure:** If Similarity $< 0.95$, the class definition is ambiguous. **REVISE STEP 1**. If revision fails twice, **ESCALATE**.
  **Audit Trail:** Save both queries and the mismatch log to the Class Ledger.

  #### STEP 3: DATA SOURCE TAGGING & SIMULATOR AUDIT
  **Action:** Tag every instance in $S$ as `Fleet-Observed`, `Simulator-Generated`, or `External-Statistic`.
  **Requirement:**
  1.  **If Simulator:** Identify the Generative Model Version ($GM_{ver}$). State the specific parameters tuned to match this class (e.g., "pedestrian aggression tuned to Metro A").
  2.  **If External:** State the mapping logic between external taxonomy and $S$.
  **Test (Distributional Shift):** If pooling Fleet and Sim data, run a Kolmogorov-Smirnov test on the marginal distributions of key axes (speed, distance, time-to-collision).
  **Pass Condition:** $p$-value $> 0.05$ (cannot reject null hypothesis that distributions are identical).
  **Failure:** If $p < 0.05$, data sources cannot be pooled. Calculate rates separately or **ESCALATE**.

  #### STEP 4: ENDOGENEITY CHECK (Policy Stability)
  **Action:** Determine if the rate $R$ depends on a mitigation ($M$) that is subject to change (e.g., remote operator availability, geofence limits).
  **Question:** "If we removed mitigation $M$ tomorrow, would the event count in $S$ change?"
  **Requirement:**
  1.  If Yes: The rate must be labeled $R_{conditional\_M}$.
  2.  If the Safety Case assumes $M$ is permanent, provide evidence of operational commitment (e.g., contractual staffing levels).
  3.  If $M$ is likely to scale down (e.g., remote assistance), you must calculate $R_{unmitigated}$ using counterfactual simulation or worst-case bounding.
  **Failure:** If $R$ is presented as intrinsic to the vehicle but relies on $M$, **ESCALATE**.

  #### STEP 5: MINIMUM COUNT & ZERO-NUMERATOR RULE
  **Action:** Calculate the point estimate and Upper Confidence Bound (UCB).
  **Requirement:**
  1.  **Minimum Count:** $N_{fleet} \geq 50$ for empirical rates. Below 50, rate must be derived from Bayesian prior or Sim.
  2.  **Zero Numerator:** If Events $= 0$, you cannot report $R=0$. You must report the 95% UCB (e.g., "3.0 events per million VMT").
  3.  **Pooling Restriction:** You may not pool a zero-event narrow class with a broad class to dilute the rate unless Step 3 (Distributional Shift) passes.
  **Failure:** If $N < 50$ and no valid prior exists, **ESCALATE**.

  #### STEP 6: THE ADVERSARIAL LEDGER ENTRY
  **Action:** Before finalizing, record the "Class Selection Rationale."
  **Requirement:** Answer: "Why was this class chosen over the immediate superset and immediate subset?"
  **Audit:** This entry is scored post-hoc. If a future batch uses a contradictory rationale for a similar class, the Analyst's "Consistency Score" drops.
  **Escalation Trigger:** If Consistency Score drops below threshold, Analyst loses privilege to define classes without Director approval.

  #### STEP 7: ESCALATION PROTOCOL
  **Trigger:** Any "Failure" or "Escalate" in Steps 1–6.
  **Action:**
  1.  Output is not a number. Output is "UNQUANTIFIED RISK."
  2.  File goes to Internal Review Board with a recommendation for:
      *   Additional data collection (Shadow Mode).
      *   Operational Design Domain (ODD) restriction.
      *   Acceptance of higher uncertainty bound.
  **Note:** Escalation is not a failure of the analyst; it is a success of the procedure.

  ---

  ### PART 2: PROCEDURE RUN-THROUGH

  #### CASE 1: Left Turn Across Oncoming Traffic (Signalized, Unprotected)
  *   **Data:** 40 Fleet Instances, 0 Events.
  *   **Broad Class:** 2,200 Intersection Interactions, 3 Events.
  *   **Analyst Desire:** Use the broad class to get a non-zero denominator, or the narrow class to get a zero numerator.

  **Execution:**
  1.  **Axis Locking:** Narrow class is valid (schema features exist). Broad class is valid.
  2.  **Blind Re-derivation:** Passes for both.
  3.  **Data Source:** Fleet-only.
  4.  **Endogeneity:** None (standard driving).
  5.  **Minimum Count:**
      *   Narrow Class: $N=40$. **FAIL** (Rule: $N \geq 50$).
      *   Broad Class: $N=2,200$. **PASS**.
  6.  **Distributional Shift (Pooling Test):** Compare Narrow vs. Broad on `turn_type` and `opposing_speed`.
      *   *Result:* $p < 0.01$. The broad class contains protected turns and right turns which have fundamentally different risk profiles. **FAIL** (Cannot pool).
  7.  **Zero Numerator:** Narrow class has 0 events. Must report 95% UCB.
      *   Calculation: Poisson upper bound for 0 events in 40 instances (scaled to VMT).
      *   Result: Rate is "Below 75,000 per million VMT" (very high uncertainty).

  **Outcome:** **ESCALATE.**
  **Reasoning:** The narrow class lacks statistical power ($N<50$). The broad class is heterogenous (fails Shift Test). Pooling is forbidden.
  **Corrected Action:** Analyst must submit "UNQUANTIFIED RISK." Recommendation: Deploy shadow mode for 6 months to accrue $N>50$ on this specific maneuver, or restrict ODD to protected turns only. The Safety Case cannot claim a specific low rate; it must claim "Risk bounded by Upper Confidence Limit of Small Sample."

  #### CASE 2: New Metro Expansion (Different Conventions)
  *   **Data:** 0 Fleet Data.
  *   **Candidates:** Simulator (validated on old cities), Human Crash Stats (New City), Fleet Data (Old Cities).

  **Execution:**
  1.  **Axis Locking:** Class defined by `metro_area = NEW`.
  2.  **Data Source Tagging:**
      *   *Fleet (Old):* **FAIL** Endogeneity/Shift. Driving policies tuned to Old Metro etiquette.
      *   *Human Stats:* **FAIL** Relevance. Human crash rates $\neq$ AV crash rates (different failure modes).
      *   *Simulator:* **Audit Required.**
  3.  **Simulator Audit:**
      *   Generator validated on Old Metros.
      *   *Question:* Does the generator model `siren_pattern` and `turn_etiquette` of New Metro?
      *   *Finding:* No. The generator uses Old Metro pedestrian aggression models.
      *   **FAIL** Distributional Shift (Sim vs. Reality).
  4.  **Endogeneity:** N/A (No fleet yet).

  **Outcome:** **ESCALATE.**
  **Reasoning:** No valid reference class exists.
      *   Old Fleet data is biased (wrong domain).
      *   Human data is biased (wrong agent).
      *   Sim data is biased (unvalidated generator).
  **Corrected Action:** "UNQUANTIFIED RISK." Procedure mandates **Shadow Mode Deployment** in New Metro for minimum 50,000 miles before rate assignment is permitted. Safety Case must explicitly state: "Risk for Metro X is extrapolated, not empirical."

  #### CASE 3: The "Dirty" Class (Remote Operator Exclusion)
  *   **Data:** 2 Years of usage.
  *   **Definition:** "Complex Urban Merge" (includes post-hoc video coding).
  *   **Exclusion:** Instances where Remote Operator (RO) took over are removed from denominator.
  *   **Current Filed Rate:** 0.5 events / million VMT.

  **Execution:**
  1.  **Axis Locking:**
      *   Feature: `merge_complexity`.
      *   *Check:* Is `merge_complexity` in log schema?
      *   *Finding:* No. It is a tag applied by analyst after watching video.
      *   **FAIL** Step 1 (Axis Locking).
  2.  **Blind Re-derivation:**
      *   Peer tries to query `merge_complexity`. Cannot.
      *   Peer watches 50 random clips to guess the logic.
      *   *Result:* Jaccard Similarity = 0.60.
      *   **FAIL** Step 2.
  3.  **Endogeneity Check:**
      *   Class excludes RO takeovers.
      *   *Question:* If we reduce RO staffing, do these become events?
      *   *Finding:* Yes. 15% of excluded instances were "near misses" saved by RO.
      *   **FAIL** Step 4. The rate is conditional on RO staffing levels that are planned to decrease.
  4.  **Adversarial Ledger:**
      *   Rationale: "Excluded takeovers to measure autonomous capability."
      *   *Audit:* This contradicts Safety Case goal which is "System Safety" (including fallbacks).

  **Outcome:** **CLASS INVALIDATED.**
  **Corrected Number:**
  *   Denominator must include all attempted merges (including RO takeovers).
  *   Numerator must treat "RO Takeover to prevent collision" as a *potential event* (or at least flag the rate as $R_{conditional\_RO}$).
  *   Recalculated Rate: Approx 3.5 events / million VMT (including takeovers as proxy events).
  **Safety Case Action:**
  1.  **Immediate Amendment:** File a correction with the regulator. "Class C-202 defined erroneously. Reclassified as C-202-v2."
  2.  **Disclosure:** "Previous rates excluded human-in-the-loop interventions. New rates reflect system performance without intervention."
  3.  **Process Fix:** Analyst who defined C-202 loses Class Definition privileges for 3 months (Ledger penalty).

  ---

  ### PART 3: LIMITATIONS & FAILURE MODES

  This procedure hardens the process, but it does not solve the underlying epistemological problems. Here is where it will fail, and where the regulator will still have ammunition:

  **1. The "Relevant Axis" Judgment Call (Step 1)**
  *   **Limitation:** The procedure forces you to define axes clearly, but it cannot tell you *which* axes matter. An analyst can choose `weather = clear` to hide risk that only appears in `weather = rain`.
  *   **Regulator Attack:** "You selected axes that minimized variance rather than maximized causal relevance."
  *   **Mitigation:** The Adversarial Ledger (Step 6) helps, but a determined analyst can still game axis selection if they maintain internal consistency.

  **2. The Simulator Truth Gap (Step 3)**
  *   **Limitation:** The Distributional Shift Test only checks if Sim matches Fleet (or Sim matches Sim). It cannot check if Sim matches *Reality*. If your generator is wrong in a way you haven't instrumented, the KS-test will pass, and the rate will be garbage.
  *   **Regulator Attack:** "Your simulator validates its own assumptions. You have no ground truth for the counterfactuals."
  *   **Mitigation:** None within quantification. This requires physical validation (Shadow Mode), which delays deployment.

  **3. The Endogeneity Lag (Step 4)**
  *   **Limitation:** You can flag that a rate is conditional on a mitigation (like Remote Operators), but you cannot force the business to keep that mitigation. The procedure exposes the risk, but does not prevent the company from accepting it.
  *   **Regulator Attack:** "You knew the rate was conditional on staffing levels you planned to cut. You filed the number anyway."
  *   **Mitigation:** The procedure forces the "Conditional" label, shifting liability to the decision-maker who signs the Safety Case, but it does not stop the signature.

  **4. The "Unknown Class" Problem**
  *   **Limitation:** This procedure only audits classes you *flag*. It does not find risks you didn't think to mine.
  *   **Regulator Attack:** "You quantified the left turn risk, but you never flagged the 'occluded pedestrian at dusk' class because your mining pipeline doesn't look for that."
  *   **Mitigation:** None. This is a surveillance gap, not a quantification gap.

  **5. Statistical Power vs. Turnaround Time**
  *   **Limitation:** Step 5 ($N \geq 50$) will force escalations on rare but critical scenarios. With a 4-day turnaround, you cannot generate new data.
  *   **Result:** You will have a Safety Case full of "UNQUANTIFIED RISK" flags.
  *   **Regulator Attack:** "Your safety case is mostly placeholders."
  *   **Mitigation:** This is actually a feature, not a bug. It forces the business to accept that some risks are unknown, rather than hiding them behind diluted base rates.

  **Summary for the Analyst:**
  This procedure does not give you permission to guess. It gives you a shield to say "We cannot know this yet." If you use it to hide uncertainty, the Ledger will catch you next quarter. If you use it to flag uncertainty, the Board must decide whether to drive. That is their job, not yours.
