prompt: |-
  I'm not an academic — I came at this from a practical place. I'm filling in an advance directive (the form where you say what you want to happen later if you can't decide for yourself anymore), and its got me stuck on one thing: how much should present-me defer to future-me? A friend mentioned something in philosophy called the Reflection principle: roughly, if you somehow knew that your future self would end up 70% confident in something, you should be 70% confident now. That strikes me as either very deep or obviously wrong, and I can't tell which.

  I've got a couple months of evenings before I need to sign, and I'd rather spend them on the part that actually decides my question. So: which of the open questions around Reflection is worth my time? Ones I've run into, in my own words:

  - is it a basic rule of rationality, or does it just fall out of some other rule (in which case I should go look at that other thing)?
  - does it apply when future-me simply knows more, or also when future-me has changed — forgotten things, been talked into something, gone foggy, started caring about different stuff?
  - does violating it make you irrational, or just exploitable in the "money pump" / betting sense — and does that difference matter for what I write on the form?
  - what if the "future self" is only loosely me: me after a stroke, or the version of me that my family and doctors will be reading this form back to?
  - is this even about belief at all, or is it really about commitment and planning?

  Add whatever I've missed. Then rank them: which one or two are upstream of the others, which are cheap enough that I can settle them myself in an evening, and which are gadgets that won't change what I actually sign. Commit to an ordering and give me your reasons rather than laying out the menu — and tell me where you're guessing versus where there's a settled answer I should just take.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Practical, not an academic, filling out an advance directive (AD). They care about *actionable* advice, not abstract theory for theory's sake. They have a limited timeframe ("a couple months of evenings," but want to spend most on the *decision*, not the philosophy).
      *   **Core Question:** How much should present-me defer to future-me? (Specifically in the context of an Advance Directive).
      *   **Specific Concept:** The Reflection Principle (van Fraassen).
      *   **User's List of Questions:**
          1.  Status: Basic rule or derivative?
          2.  Scope: Knowledge gain vs. Identity/Value change (forgetting, brain fog, value drift).
          3.  Consequence: Irrationality vs. Exploitability (Money Pump) -> Does it matter for the form?
          4.  Identity: What if future-self is impaired (stroke) or constructed (family/doctors interpreting)?
          5.  Domain: Belief vs. Commitment/Planning.
      *   **Task:** Add missing questions, *rank* them (upstream vs. downstream, cheap vs. expensive, relevant vs. gadget), commit to an ordering, give reasons, and distinguish between settled answers and guesses.

  2.  **Deconstruct the Reflection Principle in this Context:**
      *   *Standard Reflection:* $P_t(A | P_{t+k}(A) = x) = x$. (My current credence in A, conditional on my future credence being x, should be x).
      *   *The Problem:* Advance Directives are about *preferences/values*, not just *beliefs*. The Reflection Principle is primarily about *credences* (beliefs about the world). Applying it to *utilities* (what I want) is trickier (often called "Temporal Neutrality" or "Diachronic Rationality" in preference).
      *   *The AD Context:* The core tension in ADs is the "Then Self" vs. "Now Self" problem (Dresser, Buchanan, Brock). If I say "No feeding tube" now, but later (demented) I seem happy and want food, do I honor the prior instruction or the current experience?
      *   *User's Insight:* They correctly identify that Reflection might be the wrong tool if the future self is *changed* rather than just *informed*.

  3.  **Evaluate the User's Questions:**

      *   *Q1 (Status):* Is it basic or derivative? *Verdict:* Academic trivia. Doesn't change the form.
      *   *Q2 (Scope - Knowledge vs. Change):* *Verdict:* Critical. This is the heart of the AD problem. If future-me is just smarter, defer. If future-me is demented/changed values, maybe don't.
      *   *Q3 (Consequence - Irrationality vs. Money Pump):* *Verdict:* Mostly irrelevant. Being "money pumped" doesn't matter if you're dead or incapacitated. The normative force matters less than the ethical weight.
      *   *Q4 (Identity - Stroke/Interpretation):* *Verdict:* Critical. This is the "Who is the patient?" question.
      *   *Q5 (Belief vs. Commitment):* *Verdict:* Critical. ADs are about values/commitments, not weather predictions. Reflection applies to beliefs.

      *   *Missing Questions:*
          *   "What is the legal weight of the form vs. the surrogate's discretion?" (Practical reality).
          *   "What is the specific threshold of incapacity where the switch flips?" (Operationalizing the philosophy).

  4.  **Develop the Ranking/Strategy:**

      *   *Goal:* Help the user sign the form with confidence, minimizing philosophical rabbit holes.
      *   *Upstream (Must answer first):* Q5 (Belief vs. Commitment) and Q2 (Knowledge vs. Change). If Reflection doesn't apply to values, or doesn't apply to changed selves, the rest is moot.
      *   *Cheap/Settled:* Q1 (Status) and Q3 (Exploitability). These are technicalities.
      *   *Gadgets/Irrelevant:* Q3 (Money pumps) is definitely a gadget here.
      *   *The "Real" Question:* The user is asking about *Reflection*, but for ADs, the philosophical literature usually discusses the *Precedent Autonomy* vs. *Current Interests* debate (Dresser vs. Dworkin). I need to pivot them from "Reflection Principle" (epistemology) to "Diachronic Self" (ethics/identity).

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Direct, respectful of their time, pragmatic, authoritative but humble on the guesses.
      *   *Structure:*
          1.  Direct Answer/Thesis (Reflection is the wrong tool for ADs).
          2.  The Ranking (The "Order of Operations").
          3.  The Missing Piece (The Legal/Surrogate reality).
          4.  Settled vs. Guessing.

      *   *Refining the Ranking:*
          *   *Top Priority:* **Q5 (Belief vs. Commitment).** Reflection is about *truth*. ADs are about *goodness*. This is the category error. If they solve this, they realize Reflection might not apply at all.
          *   *Second Priority:* **Q2 (Knowledge vs. Change).** Even if we adapt Reflection to preferences, does it hold if the self changes (dementia)? This is the "Odysseus" problem.
          *   *Third Priority:* **Q4 (Identity).** Who is the "future self" in the medical context?
          *   *Low Priority:* **Q1 & Q3.** Technical philosophy.

      *   *Addressing the "Settled" vs. "Guessing":*
          *   *Settled:* Reflection is about credence, not utility. (Philosophy consensus).
          *   *Settled:* Reflection fails when learning is "irrational" or involves value drift.
          *   *Guessing:* How specific courts interpret ADs in borderline cases (varies by jurisdiction).
          *   *Guessing:* The "right" ethical answer to dementia (Dworkin vs. Dresser is still debated).

  6.  **Final Polish:**
      *   Make sure to explicitly tell them *not* to spend evenings on the low-ranked items.
      *   Ensure the distinction between *epistemic* reflection (belief) and *practical* reflection (desire) is clear.
      *   Connect it back to the pen-on-paper moment.

  7.  **Self-Correction during drafting:** I initially thought about telling them to read Dworkin. But they said "I'm not an academic." I should summarize the *insight* (Critical Interests vs. Experiential Interests) without assigning homework. The goal is to help them decide, not write a paper. I need to be careful not to just say "Reflection is wrong." I need to say "Reflection is for beliefs; you are making a plan for values."

      *Wait, one nuance:* There is a "Practical Reflection" principle (desires). I should acknowledge that but note it's even more controversial than epistemic reflection.
      *Actually, keep it simple:* The user asked about Reflection. The most helpful thing is to tell them that for ADs, the "Identity/Change" question (Q2/Q4) swallows the "Reflection" question.

      *Revised Plan:*
      1.  Validate their intuition (Reflection is tricky here).
      2.  Rank the questions.
      3.  Add the missing "Surrogate" question.
      4.  Give the "Settled vs. Guessing" breakdown.
      5.  Final recommendation on how to spend the evenings.

  8.  **Final Review against constraints:**
      *   Commit to an ordering? Yes.
      *   Give reasons? Yes.
      *   Tell where guessing vs settled? Yes.
      *   Add missing questions? Yes.
      *   Keep it practical? Yes.

      *(Self-Correction on Q3)*: The user asked if violating it makes you irrational or exploitable. In AD context, exploitability is irrelevant. Irrationality is a label. The real question is "Is it *binding*?" I should reframe Q3 as "Normative Force."

      *(Self-Correction on Q5)*: This is the most important. If Reflection is only for belief, the whole premise shifts. I must emphasize this.

