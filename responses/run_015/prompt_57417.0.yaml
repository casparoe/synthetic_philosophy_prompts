      *   **Task:** Rigorously stress-test this position. Sort objections by decisiveness (fatal vs. awkward/adjustable). Address admissibility of evidence (only one history). Address specific potential counter-evidence (convergent evolution, small perturbations with long effects, substitution of individuals, macro-regularity). Address the "averaging artifact" escape hatch (chaos vs. statistical regularity). Assess unfalsifiability/qualification. Distinguish internal vs. external objections. Identify predictions distinct from rivals (strong structuralism, strong contingency, layered views).
