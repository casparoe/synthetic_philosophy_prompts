  No dungeon dark obscures the body's light,
  Within the glassy cell the inmate dwells,
  Exposed to gaze permanently bright,
  While silence from the central tower tells.
  It is not shadow that constrains the sight,
  But luminous walls where surveillance swells,
  The unseen eye commands the field of white,
  And power flows within these crystal shells.

  The scaffold falls; power shifts its face,
  The sovereign sword yields to the written file,
  Where power finds the soul it seeks to bind,
  The norm produces each deviant trace,
  And breeds the fault within its own profile,
  Till each becomes the watcher of his mind.
