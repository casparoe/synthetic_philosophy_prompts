  - most_original_bit: the part of the draft you think is genuinely doing new work
  - least_original_bit: the part that's most likely already said better elsewhere, described in your own words rather than attributed
  - revised_thesis: how you'd restate what I'm after so it doesn't collapse into either plain pluralism or something nobody denies
  - would_a_philosopher_care: exactly one of yes / maybe / no

  Everything else in plain prose, no bullet-point sludge, and don't tell me it's promising.
