answer: |-
  Prioritize the epistemics of diagnostic boundary-moving (Three) as the primary research track, followed by institutional pluralism (Two), and treat the unstable baseline problem (One) as a necessary constraint rather than a standalone solution.

  Idea Three is upstream of everything else because the bottleneck in your experience wasn't just a lack of concepts, but the rigidity of the validation process that refuses to update categories without specific kinds of evidence. If you change the rules for how a diagnostic category is legitimized—for example, allowing functional impairment and patient testimony to count as evidence alongside biomarkers—you automatically solve the recognition problem for conditions like Long COVID without needing to win the metaphysical war over what disease "really" is. This is tractable for STS and philosophy postdocs in two years because it relies on comparative case studies of successful vs. failed diagnostic expansions (e.g., fibromyalgia vs. chronic fatigue syndrome) to build a normative framework for guideline panels. If these postdocs can produce a concrete "evidence hierarchy" that clinics adopt to validate functional disorders, you have met your ten-year success condition.

  Idea Two is second because it is the most pragmatic lever for insurers and lawyers, even if it feels like capitulation to philosophers. Disease talk *does* perform different jobs, and forcing them to align creates the exact deadlock you experienced: a condition might warrant disability accommodation (normative harm) but fail insurance reimbursement criteria (biostatistical dysfunction). A research program here would map the conflicts between these institutional definitions and propose "translation protocols" rather than unified theories. The risk is fragmentation—if the clinical definition diverges too sharply from the legal one, patients lose portability. Evidence that would move this up in priority is if postdocs can demonstrate existing jurisdictions where pluralistic definitions successfully coexist without increasing litigation or fraud; evidence that moves it down is if pilot frameworks reveal that conflicting definitions simply allow institutions to offload costs onto patients.

  Idea One is third because, while theoretically sound, it is the most likely to dissolve back into the reference-class debates you want to avoid. The insight that baselines are environmentally contaminated is correct, but turning that into a tool for a clinician in 2025 is difficult without first solving Idea Three (how do we evidence this contamination?). This project is best funded as a subordinate constraint within the other two: postdocs working on boundary-moving must account for baseline drift, rather than treating baseline drift as the primary object of study. If treated as a standalone project, it risks producing sophisticated critiques of epidemiology that guideline panels will ignore as "too complex to implement." Evidence that would elevate this is the development of a scalable metric for "environmental confounding" that insurers can plug into actuarial models; without that operational hook, it remains academic.

  Regarding your skepticism about the practical stakes: you are right to dismiss the standard naturalism-versus-normativism warnings. Naturalism does not protect against medicalization because statistical deviance can be manufactured by lowering thresholds to expand markets (e.g., pre-hypertension), and normativism does not guarantee disease-mongering because values can prioritize patient autonomy over profit. The real driver of medicalization is not metaphysical commitment but incentive structures coupled with evidentiary rigidity. Therefore, the postdocs should not be asked to defend naturalism or normativism, but to audit the *incentives* embedded in current diagnostic criteria.

  To maximize impact, allocate three postdocs to Idea Three (developing frameworks for boundary revision), two to Idea Two (mapping institutional conflicts and translation protocols), and one to Idea One (focused strictly on operationalizing baseline adjustments for the other teams). The success metric for the first group should be the draft of a model guideline protocol; for the second, a policy brief on conflicting definitions; for the third, a dataset or tool auditing reference class stability. If, within 18 months, the Idea Three team cannot produce a draft protocol that a patient advocacy group could realistically present to a guideline panel, shift resources to Idea Two, as pluralism may be the only viable short-term workaround for rigid epistemic systems.
