answer: |-
  This is a fantastic puzzle. You have hit on one of the most significant tensions in modern moral and political philosophy: the gap between **David Hume's evolutionary genealogy** of justice and **David Lewis's logical analysis** of convention.

  You are right to feel that they pull in slightly different directions. Hume is describing a historical, psychological process (how we stumbled into justice), while Lewis is describing a logical structure (what constitutes a convention once it exists).

  Here is a breakdown of how to reconcile the seal trappers, Hume's "artifice," and Lewis's "arbitrariness," specifically addressing your worries about gradualism and common knowledge.

  ### 1. How Lewis Explains the "Start" (Without Foreseeing the System)
  You asked: *How would Lewis explain this norm getting started if, as Hume insists, nobody could have foreseen the whole setup in advance?*

  The good news is that Lewis actually agrees with Hume against the Social Contract theorists. Lewis explicitly argues that conventions **do not require promises or explicit agreements.**

  For Lewis, a convention can emerge through **precedent** or **salience**.
  *   **Salience:** In your trapper example, perhaps the shanty was just the loudest thing happening that day. It stood out.
  *   **Precedent:** One trapper sings accidentally; the others, seeing he is motivated, hold back. The next day, they expect him to sing again.

  Lewis does not require the trappers to sit down and reason, "If we all adopt rule R, we maximize utility." He only requires that they fall into a **coordination equilibrium**.

  **The Humean Twist:** Hume would say the trappers don't even need to recognize it as an "equilibrium." They just feel the relief of conflict cessation. Lewis requires that they *expect* others to conform. Hume requires that they *observe* others conforming and feel a "sense of common interest."
  *   **Lewis:** "I sing because I know you expect me to, and you expect me because you know I know..." (Common Knowledge).
  *   **Hume:** "I sing because I see it works, and I see you doing it, and I feel it's better than fighting." (Shared Sentiment/Habit).

  **Resolution:** Lewis can accommodate the "no foresight" claim by relying on **inductive reasoning based on past experience** rather than deductive reasoning about future systems. The trappers don't foresee the *system* of property; they just react to the *immediate* coordination success of the shanty.

  ### 2. The "Arbitrary" vs. "Gradual" Tension
  You asked: *Can a norm that emerges by tiny steps really be called arbitrary in Lewis's sense?*

  This is the crux of your confusion. In Lewis's framework, **arbitrariness is counterfactual, not historical.**

  *   **Historical Process:** How did we get here? (Hume's focus: gradual, insensible steps).
  *   **Logical Status:** Could we have gone elsewhere? (Lewis's focus: arbitrariness).

  A norm can be the result of a slow, painful, non-random evolutionary process (Hume) and *still* be arbitrary in Lewis's sense, provided there was **another stable regularity that could have solved the problem.**

  In your trapper example:
  *   **Norm A:** First to sing gets the blubber.
  *   **Norm B:** Everyone splits equally.

  If Norm B *would also have worked* to prevent conflict (i.e., if everyone expected equal splitting, everyone would have conforming preferences to split equally), then Norm A is **arbitrary** in Lewis's sense, even if Norm A emerged through a slow, gritty historical process where Norm B was never considered.

  **The Friction:** Hume might push back here. He might argue that once a norm is established by "artifice" and time, it ceases to feel arbitrary to the participants. It gains "moral beauty." Lewis's definition freezes the moment of coordination; Hume's definition includes the sedimentation of time. For Lewis, the convention is arbitrary *now*. For Hume, the convention is artificial in *origin* but necessary in *practice*.

  ### 3. The Cognitive Gap: Common Knowledge vs. Habit
  This is where Lewis's definition might fail to capture Hume's "artifice."

  Lewis requires **Common Knowledge** (everyone knows $X$, everyone knows everyone knows $X$, ad infinitum). This is a high cognitive bar. It implies a level of recursive reasoning that Hume's primitive trappers might not possess.

  Hume's "artifice" is closer to what the economist **Robert Sugden** (in *The Economics of Rights, Co-operation and Welfare*) calls a **Humean Convention**. Sugden argues that we don't need Common Knowledge. We just need:
  1.  Regularity in behavior.
  2.  A belief that others will continue the regularity (based on induction, not logic).
  3.  A preference to conform conditional on that belief.

  **Where Lewis misses Hume:**
  Lewis's model is static. It describes a convention *in equilibrium*. It struggles to explain the "insensible transition" Hume talks about—the messy period where the rule is half-formed, where some trappers sing and others don't, and the norm is shaky.
  *   **Lewis:** Either it's a convention (expectations align) or it isn't.
  *   **Hume:** Justice grows like a plant. There is a period where it is neither fully unjust nor fully just.

  If the trappers are in that "tiny steps" phase, Lewis might say "no convention exists yet because common knowledge isn't established." Hume would say "the artifice is currently being woven." Hume captures the *process* of convention formation better than Lewis; Lewis captures the *logic* of convention maintenance better than Hume.

  ### 4. Revisiting the Hume Quote
  You quoted Hume distinguishing between:
  1.  The **manner** rules are established (Artifice).
  2.  The **moral beauty** attributed to them (Sentiment).

  Hume says: *"These questions will appear afterwards to be distinct."*

  This is where Lewis stops and Hume continues.
  *   **Lewis** only answers Question 1 (mostly). He explains how the regularity exists and why we follow it (conditional preference). He doesn't really explain why we feel *moral outrage* when someone breaks a convention. (Why do we think the trapper who steals the blubber is *evil*, not just inconvenient?)
  *   **Hume** uses the "Artifice" (Question 1) to explain Question 2. Because we recognize that the *system* of property is vital for societal survival, we cultivate a moral sentiment (approval/disapproval) to enforce it.

  Lewis's convention is held up by **self-interest** (I follow it because it helps me if you do).
  Hume's justice is held up by **sympathy + self-interest** (I follow it because it helps me, but I also *feel* it is virtuous because I sympathize with the public interest).

  ### Summary: How to Line Them Up
  To make sense of the passage using Lewis without losing Hume:

  1.  **On Origin:** Use Lewis's concept of **Precedent** to explain Hume's "Artifice." The trappers didn't agree; they stumbled into a pattern (precedent) that solved a coordination problem (conflict over blubber).
  2.  **On Arbitrariness:** Accept that "gradual" does not mean "necessary." Even if the shanty norm evolved slowly, it is Lewis-arbitrary because an equal-split norm *could* have evolved instead. The history doesn't negate the contingency.
  3.  **On the Gap:** Acknowledge that Lewis requires too much "Common Knowledge." Modify Lewis with Sugden's **inductive expectation**. The trappers don't need to know that others know; they just need to expect others to repeat what worked yesterday.
  4.  **On Morality:** Remember Hume's warning that the questions are distinct. Lewis explains the *stability* of the norm. Hume explains the *moral obligation* we feel toward it. The trappers follow the shanty rule initially for profit (Lewis); eventually, they follow it because breaking it feels "wrong" (Hume).

  **The Verdict:** Lewis provides the skeletal logic of the convention, but Hume provides the flesh and blood of how it grows and why we care about it. A norm emerging by tiny steps is still arbitrary in Lewis's sense (because alternatives were possible), but Hume is right that the participants won't *feel* it as arbitrary once the habit sets in.
