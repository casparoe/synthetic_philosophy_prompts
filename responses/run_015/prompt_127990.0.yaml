  **INTERAGENCY COMMITTEE ON LONG-RANGE FORECASTING (ICLRF)**  
  **DECISION MEMORANDUM**

  **TO:** Regional Planning Boards; Institute for Demographic-Ecological Modeling (IDEM)  
  **FROM:** Interagency Committee on Long-Range Forecasting  
  **DATE:** October 26, 2023  
  **SUBJECT:** Decision on Proposal to Adopt Revised Malthusian Carry-Capacity Index (MCCI) for 2050 Planning Cycles  

  ### 1. EXECUTIVE DECISION

  The Committee **APPROVES WITH CONDITIONS** the use of the revised Malthusian Carry-Capacity Index (MCCI) for regional planning purposes. 

  This approval is **not** an endorsement of the MCCI as a baseline predictive forecast. Instead, the MCCI is authorized strictly as a **stress-testing framework** for resource security scenarios. Adoption is limited to a **five-year pilot cycle** (rather than the proposed ten), subject to strict empirical validation of the "subsidy exhaustion" hypothesis. Failure to meet validation metrics by 2028 will result in automatic withdrawal of the framework from authorized planning tools.

  ### 2. RATIONALE

  The Committee deliberated on two competing epistemological positions regarding the MCCI's history of prediction failure (1995–2005) and its proposed revision.

  **A. The "Right but Early" Argument (Accepted in Principle)**
  The Committee accepts the proponents' argument that a model's failure to predict timing does not necessarily invalidate its structural mechanics. We acknowledge the role of *auxiliary hypotheses* in long-range modeling. Specifically, the claim that synthetic fertilizer subsidies and desalination energy credits acted as temporary buffers against carry-capacity limits is physically plausible. 
  *   **Policy Implication:** Dismissing the model solely on past timing errors risks "signal rejection," where planning boards ignore genuine resource constraints because the warning arrived prematurely. Given the stakes of food and water security to 2050, the cost of a false negative (complacency) outweighs the cost of a false positive (over-preparation).

  **B. The Falsification/Unfalsifiability Argument (Accepted as Risk)**
  The Committee gives full weight to the critique that attributing prediction failure to "temporary subsidies" functions as an *immunizing stratagem*. If every missed deadline is explained away by a new buffer, the model becomes unfalsifiable in practice, rendering it useless for decision-making.
  *   **Policy Implication:** We cannot adopt a framework that allows for infinite deferral of the predicted collapse. To prevent the MCCI from becoming a non-falsifiable belief system, the "subsidy exhaustion" variable must be operationalized as an observable metric, not a theoretical placeholder.

  ### 3. CONDITIONS OF ADOPTION

  To balance the utility of the long-run theory against the risk of unfalsifiability, the following conditions apply:

  1.  **Usage Limitation:** The MCCI must not be used to generate single-point baseline forecasts (e.g., "Water shortage will occur in 2035"). It must be used to generate **boundary conditions** (e.g., "If subsidy X declines by rate Y, capacity Z is breached by 2035").
  2.  **Empirical Triggers:** IDEM must define specific, observable indicators for "subsidy exhaustion" within 90 days. 
      *   *Example:* Marginal cost of nitrogen fixation or energy-per-cubic-meter of desalinated water must show a sustained deviation from historical efficiency gains.
      *   *Requirement:* These indicators must be leading, not lagging. If these indicators do not show stress within the 5-year pilot, the "exhaustion" hypothesis is considered unsupported for planning purposes.
  3.  **Review Cycle:** The approval is valid for **five years**. A full re-evaluation will occur in 2028. If the MCCI predictions for the 2023–2028 window deviate from observed data by more than 15% without meeting the Empirical Trigger criteria above, the framework will be decertified.

  ### 4. ANALYTICAL CAVEATS & PREMISE CLARIFICATION

  *Per the Committee's commitment to analytical rigor, the following clarifications address potential conceptual confusion in the proposal and this decision.*

  **A. On the "Malthusian" Label**
  The term "Malthusian Carry-Capacity" is a contested shorthand in this context. Thomas Malthus's original thesis (1798) posited geometric population growth against arithmetic food production, largely excluding technological substitution. The MCCI, by contrast, appears to model *resource depletion* mediated by economic inputs (subsidies). 
  *   **Risk:** Using the "Malthusian" label may invite historical critiques irrelevant to the actual model mechanics (e.g., ignoring technological innovation). 
  *   **Directive:** Future iterations should rename the framework to reflect its actual variables (e.g., "Resource-Subsidy Elasticity Model") to avoid conflating it with discredited 19th-century demographic determinism.

  **B. On Scientific Falsification vs. Policy Utility**
  This decision rests on a distinction between *scientific truth* and *planning utility*. 
  *   **The Tension:** In pure science, a model that fails prediction is often discarded. In policy, a model that highlights low-probability, high-impact risks (like carry-capacity collapse) retains utility even if its timing is imprecise. 
  *   **The Compromise:** This memo does not resolve the philosophical debate on whether the MCCI is "true." It resolves that the MCCI is "useful" *only if* constrained by the conditions above. If IDEM interprets this approval as scientific validation of the Malthusian mechanism, they are misreading this decision. This is a license to plan for risk, not a certification of fact.

  **C. On the "Rescue" Hypothesis**
  We note that the "right but early" defense relies on the assumption that physical limits are inevitable once subsidies are removed. This assumes no further technological discontinuities (e.g., lab-grown protein, fusion-powered desalination). The MCCI must account for the probability of *new* buffers, not just the expiration of *old* ones. Treating current technology as the ceiling is itself a modeling error.

  ### 5. NEXT STEPS

  1.  **IDEM:** Submit operational definitions for "Subsidy Exhaustion Indicators" by January 26, 2024.
  2.  **Regional Boards:** Integrate MCCI scenarios into 2025 Risk Assessments only as "High-Stress" scenarios, not baselines.
  3.  **ICLRF:** Schedule interim review for Q3 2026 to assess indicator performance.

  **Signed,**  
  *Dr. Elena Rostova, Chair*  
  *Interagency Committee on Long-Range Forecasting*
