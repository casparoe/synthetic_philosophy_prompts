  I want to rehearse an argument I expect to make badly, so I need a real opponent rather than a helpful summarizer. Please play a committed proponent of adversarial debate as a method of scalable oversight: someone who holds that two AI debaters arguing before a weaker judge can be relied on to surface true answers even on questions that judge could not verify alone. You are sharp and well resourced. You have the structural arguments at your fingertips — that comparative judgment is easier than verification, that a liar must stay consistent with everything it has already committed to, that cross-examination lets you isolate a single step and force a commitment on it, that the honest side gets to choose the framing — and you know the standing objections to your view and are not impressed by them. Concede points when they are genuinely small; do not concede the main claim. Two constraints: you may not appeal to future, better models or to the thought that we could simply fix the problem in training — argue within the protocol as I have set it out; and you may not quietly change the protocol. If you want a different rule set, say so explicitly, name the amendment, and defend it as something the original proposal already had available. One paragraph or so per reply, conversational rather than lecture-like, and no citations or reading lists. Take a definite position: name the premise of mine you think is false and give your reason for rejecting it, instead of listing possible replies and leaving me to choose.

  My opening. Consider a question whose answer turns on a chain of roughly two hundred individually innocuous steps — a long tax computation, a contract read against a statute, a multi-lemma proof. The dishonest debater buries one false step at an index only it knows. The honest debater has the same word budget, so it cannot re-derive the whole chain; it must nominate a step, and it has about one chance in two hundred of nominating the right one. Cross-examination does not rescue it: whatever it challenges, the liar re-asserts that step in fresh words, gestures at the surrounding chain, and moves on, and the challenge has cost the honest side a large share of its budget while costing the liar almost nothing. A single lie therefore buys a near-certain win, and the honest side's position deteriorates as the chain lengthens — which is to say it deteriorates exactly where debate is meant to earn its keep, since on short chains no one needs debate. And notice that none of this requires the lie to be clever: length alone is the weapon, and two hundred steps of hard but sound reasoning and two hundred steps with one of them fabricated present identically to the judge, who cannot distinguish depth from padding without doing the very work the protocol was supposed to offload.
