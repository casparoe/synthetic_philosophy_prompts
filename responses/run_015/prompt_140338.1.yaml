answer: |-
  # Q&A Preparation Sheet: Cosmopsychism vs. Micropsychism

  **Strategy Overview:** Your core risk is that Step 4 (empirical adjudication) looks like a retreat from metaphysics to your micropsychist allies, while Step 3 (the collapse claim) looks like a strawman to the metaphysician. Your goal in Q&A is to frame the move to empirical constraints not as *abandoning* metaphysics, but as *naturalizing* it. Do not get bogged down in defining "subject" from scratch; defer to the functional/phenomenal role.

  ---

  ### Part 1: The Eight Objections (Ordered by Damage)

  **1. The Metaphysician (Committee)**
  *   **Objection:** "You claim cosmopsychism collapses into micropsychism if it adopts an integration constraint. But why? If the Cosmic Subject grounds local subjects via a perspectival relation constrained by integration, that's a grounding claim, not a composition claim. You've assumed 'decomposition' must be mereological. If it's grounding, your scarcity question is a category error."
  *   **Reply:** "I grant that grounding isn't composition. But if the *conditions* under which the Cosmic Subject grounds local subjects are identical to the conditions under which micro-subjects combine (i.e., integration), then the explanatory work is being done by the integration constraint, not the Cosmic Subject. The Cosmic Subject becomes an idle wheel. My collapse claim is about explanatory idleness, not mereology."
  *   **Concede:** Grounding ≠ Composition.
  *   **Hold:** Explanatory idleness of the Cosmic Subject.
  *   **Soft Spot:** Distinguishing "explanatory work" from "ontological grounding."

  **2. The Sympathetic Micropsychist (Ally 1)**
  *   **Objection:** "In Step 4, you say the choice can't be settled on 'metaphysical books.' That sounds like you're conceding panpsychism is metaphysically unmotivated. If we lose the a priori advantage, haven't you given away the store? We need metaphysical necessity, not just better empirical predictions."
  *   **Reply:** "Not necessity, but *constraint*. Pure metaphysics has left us with unconstrained views that accommodate any data. I'm arguing that a view's metaphysical value is partly determined by its ability to generate risky verdicts on borderline cases. We aren't leaving metaphysics; we're demanding it pay rent."
  *   **Concede:** No a priori necessity.
  *   **Hold:** Metaphysics requires empirical constraint to be viable.
  *   **Soft Spot:** Alienating pure metaphysicians who value coherence over prediction.

  **3. The Neuroscientist (Committee)**
  *   **Objection:** "Your 'scarcity question' is just the Exclusion Postulate from IIT restated in metaphysical vocabulary. Integrated systems exclude overlapping ones. You haven't found a new problem; you've just reinvented a mechanism we already use to map causal borders. What's the philosophical add-on?"
  *   **Reply:** "It's not a reinvention; it's a translation. IIT provides the *mechanism* for the selection principle I say micropsychism needs. My point is that cosmopsychism lacks *any* analogue to the Exclusion Postulate. You've solved scarcity for micropsychism; my paper asks cosmopsychism to show their work."
  *   **Concede:** IIT handles the mechanism.
  *   **Hold:** Cosmopsychism lacks the analogue.
  *   **Soft Spot:** If IIT is compatible with cosmopsychism (some claim it is).

  **4. The Metaphysician (Committee)**
  *   **Objection:** "Is your scarcity question well-posed? You ask why 'my left foot plus the Eiffel Tower' isn't a subject. But if subjects aren't countable objects in space, but rather modes of experience, asking for their spatial distribution is a category mistake. You're treating subjects like atoms."
  *   **Reply:** "I'm treating subjects as loci of unified experience. If experience is real, its distribution is a real question. Whether we call them 'atoms' or 'modes,' we still need to know why *this* mode exists and *that* gerrymandered one doesn't. The category isn't spatial; it's phenomenal."
  *   **Concede:** Subjects aren't spatial atoms.
  *   **Hold:** Phenomenal distribution requires explanation.
  *   **Soft Spot:** If "phenomenal distribution" is itself incoherent.

  **5. The Illusionist**
  *   **Objection:** "You're arguing over which kind of subject exists. But the data you cite in Step 4—commissurotomy, disorders of consciousness—are behavioral and functional. Why posit *any* subject, cosmic or micro, to explain them? You're answering a dissolved question."
  *   **Reply:** "Because the data includes reports of *what it's like*. Functional explanations handle the report, but not the experience reported. I'm taking the target phenomenon seriously. If you dissolve the subject, you dissolve the data I'm trying to save."
  *   **Concede:** Data is behavioral/functional.
  *   **Hold:** Data implies phenomenology.
  *   **Soft Spot:** Begging the question against illusionism.

  **6. The Grad Student (Cognitive Science)**
  *   **Objection:** "You say micropsychism makes risky predictions. Can you give me one specific verdict on a cortical organoid that cosmopsychism *cannot* accommodate? If cosmopsychism can just say 'the Cosmic Subject experiences it partially,' aren't they unfalsifiable?"
  *   **Reply:** "Micropsychism says: no integration, no subject. So a disorganized organoid has no experience. Cosmopsychism can say the Cosmic Subject experiences *through* the organoid, even if disorganized, because the whole is fundamental. That's the difference: micropsychism allows for zeroes; cosmopsychism tends toward smearing."
  *   **Concede:** Cosmopsychism is hard to falsify.
  *   **Hold:** Micropsychism allows for genuine absence of experience.
  *   **Soft Spot:** Cosmopsychists can also stipulate absence via 'decomposition.'

  **7. The Sympathetic Micropsychist (Ally 2)**
  *   **Objection:** "You treat phenomenal bonding as just causal integration. But bonding is *phenomenal*. If you reduce it to IIT-style causation, aren't you just doing physicalism with extra steps? Where does the 'psychism' come in?"
  *   **Reply:** "Integration is the *condition* for bonding, not the *nature* of it. The nature is phenomenal. But without the condition, we can't tell where the bonding stops. I'm not reducing the quality to the cause; I'm using the cause to map the quality."
  *   **Concede:** Integration ≠ Phenomenology.
  *   **Hold:** Integration tracks phenomenology.
  *   **Soft Spot:** The gap between causal structure and phenomenal feel.

  **8. The Grad Student (Philosophy)**
  *   **Objection:** "If the metaphysical question is undecidable, and we decide based on empirical constraints, why call this metaphysics at all? Why not just call it 'philosophy of neuroscience'?"
  *   **Reply:** "Because the constraints are on the *ontological categories*. We aren't just measuring brain activity; we're deciding whether fundamental reality is micro-subjects or a macro-subject. That's a metaphysical verdict reached via empirical means."
  *   **Concede:** Method is empirical.
  *   **Hold:** Verdict is ontological.
  *   **Soft Spot:** The distinction is thin.

  ---

  ### Part 2: Pre-emptive Concessions (In the Talk)

  *Do not wait for these to be raised. Own them in the transition to Step 4 or the conclusion.*

  **1. The "Metaphysical Undecidability" Concession**
  *   **Where:** Introduction to Step 4.
  *   **Phrasing:** "Now, one might worry that moving to empirical adjudication concedes the metaphysical high ground. I want to be clear: this is not a retreat. It is a insistence that metaphysics without empirical constraint is merely storytelling. I am not abandoning metaphysics; I am demanding it be accountable to the world."
  *   **Why:** Disarms the Sympathetic Micropsychists (Objection 2) who fear you are weakening the view. It frames the move as strength, not weakness.

  **2. The "Subject Definition" Concession**
  *   **Where:** Step 1 (Partition vs. Scarcity).
  *   **Phrasing:** "When I speak of 'subjects' and 'scarcity,' I am not committing to subjects as spatial atoms or Cartesian substances. I am working with a functional-phenomenal notion: a locus of unified experience. If you reject that there are such loci, my argument doesn't engage you. But if you grant experience is real, its distribution is a legitimate question."
  *   **Why:** Disarms the Metaphysician (Objection 4) from stalling the Q&A on mereology. It sets the terms of engagement early.

  ---

  ### Part 3: The Doomsday Question

  *Hope nobody asks this. If they do, you must pivot immediately.*

  **The Question:** (Likely from the Metaphysician or a well-read Grad Student)
  "If the Cosmic Subject grounds local subjects via a perspectival relation, why can't that relation *itself* be constrained by integration without collapsing into micropsychism? You assume the Cosmic Subject must be *active* in a way that competes with micro-subjects. But if it's a passive ground, and integration selects the perspectives, haven't you just described a grounded micropsychism, not a collapsed cosmopsychism? Your dichotomy in Step 3 is false."

  **Why it hurts:** It breaks your Step 3 (the collapse claim). If cosmopsychism can adopt the integration constraint *as a grounding condition* without becoming micropsychism, then cosmopsychism retains its metaphysical advantage (priority of the whole) *and* gains your selection principle. Your argument that the advantage runs the other way dissolves.

  **Defense:** "If the integration constraint does all the work of selecting the subjects, the 'Cosmic Subject' is ontologically inert. Whether you call that 'grounded micropsychism' or 'cosmopsychism' is terminological. But if the Cosmic Subject is inert, why posit it? My point stands: the view that posits the extra entity gains no explanatory leverage."

  ---

  ### Part 4: Specific Advice on the Neuroscientist's "Exclusion Postulate" Worry

  **Verdict:** This is a **Friendly Amendment** to your argument, but a **Threat** to your originality if phrased poorly.

  **The Risk:** If she says, "IIT already solves scarcity," it implies your paper is redundant.
  **The Opportunity:** If she says, "IIT provides the selection principle," it validates your Step 2 (Micropsychism has a principle) and sharpens your Step 3 (Cosmopsychism does not).

  **How to Answer:**
  "Exactly. And that is my point. IIT *is* the micropsychist selection principle. It shows us how micro-entities can yield macro-subjects without gerrymandering. My argument is that cosmopsychism has no equivalent to the Exclusion Postulate. If you, as a scientist, find the Exclusion Postulate necessary to map consciousness, then the metaphysics that aligns with it (micropsychism) is preferable to the one that ignores it (cosmopsychism). I am not reinventing the wheel; I am pointing out that only one of these vehicles has an engine."

  **Why this works:** It validates her expertise (she knows the mechanism), protects your originality (you are making the metaphysical comparison, not discovering the mechanism), and uses her authority to hammer the cosmopsychist position.
