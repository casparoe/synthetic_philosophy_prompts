      *   *The Trap:* Relativism. If I say "Western standards aren't universal," I risk validating kleptocracy. If I say "Western standards are perfect," I ignore cultural context.
      *   *The Winning Argument:* The distinction between "gift" and "extraction" is analytically useful for *understanding* behavior, but it is **not** a principled defense for exempting clientelism from anti-corruption standards. The line is often a rationalization for power hoarding. Western standards (impartiality) *are* universalizable in principle because they protect the vulnerable, even if the *implementation* ignores local context.
      *   *Refinement:* The roommate is right about the *sociology* (how people see it) but wrong about the *normativity* (how we should judge it). The "moral economy" of clientelism is almost always a mask for inequality.
      *   *Decision:* I will argue that the distinction is mostly a rationalization for elite capture, and while Western frameworks are often clumsily applied, the principle of impartiality is universal, not culturally specific.

