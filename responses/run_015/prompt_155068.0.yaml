  This stalemate is structurally a **different-questions** dispute masked as a single inquiry, driven by incompatible theoretical commitments about what naturalizes mental properties. Your hunch that this is a proxy war about individuality is partially correct but incomplete: Wes and Lena actually agree (implicitly) that operational individuality (like Markov blankets) is necessary, but they disagree on whether it is sufficient for *mentality* because they are targeting different phenomena under the label "mind." Wes is arguing for **collective cognition** defined by teleosemantic content and functional organization (unit of selection, covariance, misrepresentation), explicitly decoupling it from feeling ("misrepresentation without anyone's feelings"). Lena is arguing against **collective consciousness** defined by subjective perspective and global availability ("a state whose being wrong matters to something"), implicitly treating "mind" as requiring a subject of experience. The impasse persists because Wes treats the presence of content as sufficient for mind, while Lena treats the absence of a subject as fatal to mind, meaning they are answering "Does the colony cognize?" (Wes: Yes) and "Does the colony experience?" (Lena: No) while believing they are answering "Does the colony have a mind?"

  If Wes is wrong, he must give up the claim that teleosemantic function naturalizes content without subjectivity, or admit that colony-level selection does not confer the right kind of individuation for content (collapsing into the lac operon triviality Lena fears). If Lena is wrong, she must give up the intuition that subjectivity is a necessary condition for mind, or admit that her criteria for subjects (bottlenecks, homeostasis) are met by markets and thermostats, forcing her into the panpsychism or triviality she rejects. Neither side can move because Wes's empirical evidence (selection, covariance) is irrelevant to Lena's requirement (perspective), and Lena's conceptual objections (markets, thermostats) are irrelevant to Wes's functionalist definition.

  Progress would be: disambiguating the research program into separate questions of collective cognition (functional/teleological) and collective consciousness (phenomenal/subjective) to isolate where the empirical data actually bears on the theoretical commitments.

  \answer{different-questions}
