  *   **The Conflict:** In (3) you promise to control for technological level and information stress. In (5) you admit to bypassing these controls for the Roman analogy.
  *   **Why:** This is methodological hypocrisy. You are selling a controlled statistical model but delivering an uncontrolled historical analogy because it reads better.
  *   **Severity:** High. It exposes the "science" as a narrative device.

  **3. LOW (FAKE TENSION): (2) vs. (4)**
  *   **The Conflict:** (2) prioritizes political form; (4) suggests modern political form (feedback loops) makes comparison difficult.
  *   **Why:** This is resolvable. Feedback loops *are* a feature of political form. You can argue that while "Republic" is the form, the *subtype* (Liberal Democratic Republic vs. Oligarchic Republic) introduces noise.
  *   **Severity:** Apparent only. Easily fixed with precise taxonomy.

