      *(Self-Correction during drafting)*: I need to make sure I don't just sound like a textbook. I need to sound like a philosopher *thinking*. Use phrases like "Here's the rub," "The tension lies here," etc. Ensure I address the "smart paper" specifically—it's a physical system, so Riley's "derived intentionality" claim is weaker there because the physics is doing the work, not a human interpreter. I need to highlight that distinction.

      *Refining Move 4 (Intrinsic/Derived):* Riley argues the paper's dynamics are "derived." But if the paper physically reacts to light without a human interpreter, the causality is physical, not semantic. Riley needs to argue that electrochemical causality is *different in kind* from optical/mechanical causality. That's a harder sell. I should rate Riley lower here.

      *Refining Move 6 (Temporal):* This is Riley's strongest point. Consciousness seems to require a specific kind of temporal integration (specious present). A discrete system might not generate the *flow*.

      *Final Verdict:* It's a draw, but Jordan has the burden of proof met better. Actually, no, Riley points out the *implementation* matters. Let's say Jordan wins on principle, Riley wins on plausibility. I'll lean towards Jordan because "biological chauvinism" is a weak metaphysical stance, but acknowledge Riley's causal concerns are valid if framed as "causal density" rather than "magic biology."

      *Wait, the prompt asks me to rate from "clearly mistaken" to "clearly right".* I need to be careful not to be too wishy-washy.
      1. Jordan 1: Mostly Right (Functionalism is standard).
      2. Riley 1: Clearly Right (Static book is not a mind).
      3. Jordan 2: Mostly Right (Closes the loophole).
      4. Riley 2: Partially Right (Distinction is real but poorly defined).
      5. Jordan 3: Mostly Right (Charge of circularity is strong).
      6. Riley 3: Partially Right (Temporal binding is crucial but solvable).

      *Missing:* The "What it is like" (Qualia) and the "Unity" (Binding).

  6.  **Final Polish:** Check tone. Ensure it sounds like an expert talking to a layperson/bystander. Avoid jargon where possible, or explain it quickly. (e.g., explaining "phenomenal binding").

