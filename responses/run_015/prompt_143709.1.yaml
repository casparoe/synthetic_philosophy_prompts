      *   Discipline on mapping actors/substrates? Yes.

  6.  **Final Polish:** (Produces the final output.)
answer: |-
  The split-brain cases of Sperry and Gazzaniga present a phenomenological crisis for the Western intuition of a unitary subject. When the corpus callosum is severed, the behavioral output suggests two distinct centers of volition and awareness housed within one cranium. Analyzing this through the Buddhist doctrine of *anatta* (no-self) requires a rigorous mapping of categories. We must distinguish between the *paramattha* (ultimate realities, i.e., the aggregates) and the *pannatti* (conceptual designations, i.e., the "person").

  ### 1. Divided Consciousness and the Mechanism of *Papanca*

  In the split-brain patient, the left hemisphere (LH) often verbally claims agency for actions initiated by the right hemisphere (RH), despite having no access to the RH's visual or volitional data. The LH confabulates a reason ("I wanted a soda") to explain the RH's action (pointing to a drink).

  **Characterization of the Division:**
  *Anatta* rejects the premise that a "single self has been fractured." Since there is no enduring substance (*svabhava*) to begin with, there is nothing to break. Conversely, to say there are "two provisional selves" is accurate only at the level of *vohara* (conventional speech). Ultimately, there are not two selves, but rather two distinct streams (*santana*) of the five aggregates (*khandhas*) operating in parallel. The split-brain case does not reveal *no self whatsoever* in a nihilistic sense; rather, it reveals that the "self" was never a singular controller, but a dependent arising of specific aggregate configurations. When the physical aggregate (the brain) is bifurcated, the cognitive aggregates bifurcate.

  **The Interpreter as *Papanca*:**
  The LH's "interpreter" function is a precise neurological correlate to the Buddhist concept of *papanca* (mental proliferation/conceptual obsession). *Papanca* is the mind's tendency to overlay conceptual narratives onto raw sensory experience, generating "I," "mine," and "story."
  *   **The Mapping:** The LH receives disjointed data (an action occurred without a conscious intention). To resolve the cognitive dissonance, it fabricates a narrative of agency.
  *   **The Illusion of Ownership:** This fabrication is exactly the mechanism *anatta* identifies as constructing the illusion of ownership (*attavada*). The LH does not *find* a self; it *constructs* one to maintain coherence. The split-brain patient demonstrates that the sense of "I did this" is a post-hoc commentary generated by specific cognitive formations (*sankhara*), not a pre-existing witness. The confabulation proves that the "owner" of an action is a narrative add-on, vulnerable to disruption when the informational stream is interrupted.

  ### 2. *Anatta* vs. Western Psychological-Continuity Theories

  Western theories of personal identity (e.g., Locke, Parfit) generally rely on psychological continuity—memory, character, and intention—as the criteria for identity survival.

  **Survival of Identity:**
  *   **Western Theory:** Struggles with the split-brain case. If identity is psychological continuity, and the continuity splits, does the person divide? If the LH remembers the past and the RH does not, is the RH a new person? Western metaphysics often seeks a determinate answer regarding the *subject* that survives.
  *   **Anatta:** Avoids the trap by denying the subject. There is no "who" that survives, only "what" continues. The causal stream of aggregates continues in two channels. *Anatta* outperforms Western continuity theories here because it does not require a singular locus of identity to remain intact. It accommodates the division naturally: one stream of karmic causality has become two. There is no paradox of "one person becoming two" because there was only ever a process, not a person.

  **The Subject of Experience:**
  *   **Western Theory:** Typically presupposes a subject of experience capable of being split. Even in reductionist accounts, there is an implicit "something" that holds the memories.
  *   **Anatta:** Posits no subject. Experience arises dependent on conditions (eye, form, consciousness). In the split-brain patient, the conditions for "visual consciousness" have been physically segregated. *Anatta* underperforms, however, in providing a framework for *legal* or *moral* continuity. Western theory strives to preserve accountability; *anatta* dissolves the ultimate accountability of the agent, leaving only the causal inevitability of karma. If the RH commits a crime the LH doesn't recall, Western theory fights to assign blame to the "person." *Anatta* would note that the conditions for the action arose in the RH stream, but offers no ultimate "person" to punish, only a causal stream to be conditioned differently.

  ### 3. What the Case Shows About *Anatta*

  **Confirmation of Fabrication:**
  The relentless construction of unity by the LH interpreter confirms the *anatta* thesis that the self is fabricated. If the self were an enduring substance, the severing of the corpus callosum should not generate a *new* narrative of unity; the true self should simply report the confusion. Instead, the mind manufactures unity where there is disunity. This supports the view that the "self-model" is a functional tool for coherence, not an ontological reality. The split-brain case makes visible the stitching that usually remains hidden in the intact brain.

  **The Challenge of Unitary Self-Models:**
  Does the persistence of a unitary self-model in *each* hemisphere suggest a deeper ground? One might argue that if both hemispheres generate a robust "I," the capacity for selfhood is fundamental to consciousness itself.
  *   **Buddhist Rebuttal:** This does not suggest a deeper ground, but rather the depth of *avijja* (ignorance). The capacity to generate *attavada* (self-view) is inherent in the functioning of the aggregates, specifically *sanna* (perception) and *sankhara* (volitional formations). That two hemispheres can generate two "I"s simply means the machinery of delusion is replicable. It confirms that the "self" is a local output of cognitive processing, not a global input. It shows that *anatta* is not the absence of the *experience* of self, but the absence of the *referent* of that experience. Both hemispheres have the experience; neither has the referent.

  ### 4. Where the Mapping Fails: Ethics, Soteriology, and Pluralism

  **Clinical Intervention and Soteriology:**
  Buddhism's primary soteriological goal is the cessation of *dukkha* (suffering/unsatisfactoriness) via the uprooting of clinging.
  *   **Silence:** *Anatta* is silent on clinical triage. It offers no metric to decide if severing the corpus callosum is "good" other than the reduction of physical suffering (seizures). However, from a strict soteriological view, increasing the fragmentation of the aggregates might complicate the practice of mindfulness (*sati*), which relies on a degree of cognitive integration to observe the arising and passing of phenomena.
  *   **Conflict:** The medical goal is functional adaptation; the Buddhist goal is liberation. Treating the LH and RH as separate patients might improve behavioral management, but it conflicts with the conventional social reality required for the patient's remaining relationships.

  **Pluralism About Persons (*Puggala*):**
  This is the most significant friction point.
  *   **The Problem:** If we treat the LH and RH as distinct loci of awareness with conflicting intentions, are they two *puggalas* (persons)?
  *   **Standard Doctrine:** Buddhism denies ultimate persons (*paramattha puggala*) but accepts conventional persons (*sammuti puggala*) for the sake of communication and karma.
  *   **The Conflict:** In a standard body, one conventional person is designated. In a split-brain body, the behavioral evidence suggests two centers of karmic volition. If we designate two persons, we force *anatta* into a pluralism that risks reifying the hemispheres as "selves." If we designate one, we ignore the empirical reality of two distinct streams of consciousness.
  *   **Resolution via Silence:** Buddhism must remain silent on the *number* of persons, as number is itself a *pannatti*. To ask "how many selves are here?" is a wrong question (*avyakata*), akin to asking "where does the flame go when the candle is blown out?" The theory identifies the aggregates (form, feeling, perception, etc.) in each hemisphere. It refuses to count the "selves" arising from them.
  *   **Ethical Failure:** This silence is a failure in a clinical/legal context. If the RH strikes a nurse, and the LH apologizes, a legal system needs to know who to hold responsible. *Anatta* can explain that there is no ultimate agent to blame, only causes and conditions. But it cannot provide a conventional rule for whether the "person" is the body or the stream of consciousness. If the stream has split, the conventional designation fractures. *Anatta* lacks a developed philosophy of *conventional* identity sufficient to handle pathological fission without collapsing into either nihilism (no one is responsible) or eternalism (the soul split).

  ### Summary of Mapping

  | Feature | Split-Brain Phenomenon | Buddhist *Anatta* Analysis | Mapping Status |
  | :--- | :--- | :--- | :--- |
  | **Agent** | Left/Right Hemispheres acting independently. | Two streams of *khandhas* (aggregates). | **Fit:** Both deny a singular controller. |
  | **Narrative** | LH confabulates reasons for RH actions. | *Papanca* (proliferation) constructing *attavada* (self-view). | **Strong Fit:** Confabulation = Self-construction. |
  | **Identity** | Indeterminate: One body, two minds? | No ultimate identity; conventional designation (*pannatti*) becomes unstable. | **Partial Fit:** *Anatta* explains the instability but offers no conventional count. |
  | **Ethics** | Who is responsible for RH actions? | Karma follows the causal stream, but no "person" to punish. | **Fail:** *Anatta* lacks a framework for divided conventional accountability. |
  | **Ontology** | Is there a subject that split? | No subject existed to split; only conditions changed. | **Strong Fit:** Resolves the "fission paradox" by denying the pre-existing unity. |

  **Conclusion:**
  The split-brain studies do not refute *anatta*; they dramatize it. They show that the "unity of consciousness" is a fragile, constructed artifact, easily dismantled by physical intervention. The LH interpreter is the ego-mechanism exposed, frantically weaving *papanca* to hide the void of agency. However, the mapping fails where Buddhism meets the pragmatic necessity of counting persons. *Anatta* successfully deconstructs the *reality* of the self in these patients, but it provides no guidance on how to *treat* the resulting duality within a social and legal framework that demands a singular responsible agent. The theory holds firm on the ultimate emptiness of the patient, but falls silent on the conventional management of the fracture.
