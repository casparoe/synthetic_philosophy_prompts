  7. Does the view have any cash value beyond entrenchment talk, and can you name one predicate in current scientific practice that you think we project and should not? If you cannot name one, argue why metaphysical naturalness adds anything to pragmatic entrenchment; if you can, defend why we are wrong to project it.
  8. My co-host insists grue is just overfitting with a fancy name and that the entire debate is philosophers rediscovering model selection, so what metaphysical work is left for naturalness once penalizing complexity is accounted for? If you say model selection misses the point, specify what statistical criteria fail to capture; if you agree, explain why philosophy is still needed.
