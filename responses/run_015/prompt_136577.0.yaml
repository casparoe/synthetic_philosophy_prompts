answer: |-
  You must establish the normative distinction between duties to avoid harm and duties to confer benefits before introducing the veil, otherwise participants will interpret the compensation fund as standard insurance rather than structural asymmetry.

  **Dependency Order**
  Before revealing the "reverse veil" scenario, you must secure two intuitive commitments separately, or the mechanics will collapse into standard risk assessment. First, establish that bringing a child into a life of suffering is a harm *to that child*; second, establish that failing to bring a happy child into existence is not a harm *to that child*. If you introduce the veil before locking in the second point, law and psych students will treat the "never exist" option as a loss of potential utility, which destroys the asymmetry. Only once they agree that non-existence cannot be a disadvantage for the non-existent person does the "no mirror reward" rule in your example become intelligible as anything other than arbitrary policy design.

  **Example Breakdown: Asymmetry vs. Decoration**
  The **asymmetry carrier** is exclusively the compensation fund rule: binding liability for welfare below baseline versus zero reward for welfare above baseline. This structurally encodes the claim that we have a duty to prevent suffering but no duty to create happiness. The **decoration** is the inclusion of "parents" as a possible position behind the veil. You must flag this explicitly as narrative flavor; including parents invites confusion about parental rights or sacrifices, whereas the asymmetry is strictly about the moral status of the potential child. If they focus on the parents, they will miss the point about the non-identity of the unborn.

  **Misconception Arc and Interventions**
  1.  **Overpopulation/Resource Scarcity:** They will immediately assume the veil is about limiting population growth to save resources. **Head this off** during the setup of the veil by stipulating that resources are abundant and the policy applies to individual conception choices, not aggregate demographics.
  2.  **Sneaking in Utilitarianism:** When you reveal the compensation fund, they will argue you are maximizing utility by minimizing pain. **Head this off** during the mechanics explanation by emphasizing the *absence* of a subsidy for high-welfare lives; if this were utilitarian, high welfare would generate credits to offset low welfare, but your fund forbids this trade-off.
  3.  **Life Has No Value:** Finally, they will conclude that if high welfare earns no moral credit, happiness is worthless. **Head this off** in the debrief by distinguishing *axiological value* (happiness is good) from *deontic obligation* (we are not required to create it); the framework says creating happiness is supererogatory, not worthless.

  **Check-for-Understanding Question**
  Ask: "Under this policy, if a couple can conceive a child who will have a minor disability but whose welfare will still remain above the compensation baseline, does the policy forbid conception, require conception, or leave it optional?"
  *   **Target Answer:** Optional.
  *   **Why:** It tests if they grasp that above-baseline suffering is permissible (no fund payout) and that creating the child is not required (no reward for existence), capturing both horns of the asymmetry without needing technical vocabulary.

  **Refusals**
  Do not explain the **Non-Identity Problem**, as introducing the logic that "the child cannot complain because they wouldn't exist otherwise" will derail the workshop into metaphysics rather than normative intuition. Do not use **"person-affecting" versus "impersonal" vocabulary**; stick to "harming someone" versus "making the world better," as the technical terms signal to law and psych students that this is abstract theory rather than applicable policy logic.
