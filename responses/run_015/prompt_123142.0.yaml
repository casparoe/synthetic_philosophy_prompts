  hey im in a philosophy of music course and we just covered schopenhauers idea that music isnt representation but direct objectification of the will. i want to write about the movie amadeus through that lens but i need it to be more in the weeds than just "mozart expresses genius." specifically, im stuck on schopenhauers claim that melody expresses the wills striving while rhythm is tied to the bodies mechanical repetition — and that the genius can turn this into a kind of temporary denial of the will. in amadeus, salieri hears mozarts music and feels both awe and hatred. is salieri experiencing the quietive of the will, or is he just feeling the will more intensely through mozarts melody? and does the films framing of mozart as a vulgar guy who writes divine music support or break schopenhauers idea that genius grasps platonic ideas?

  please write this in american english. dont summarize the plot, just do the philosophical reading. also no bibliography or citations please — i just need the argument. i want it to say where the movie resists schopenhauers framework, not just force it to fit.
