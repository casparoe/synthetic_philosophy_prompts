          *   She meets the "Endorsement" criteria (her journal shows she knew the fraud was wrong regardless of the promotion).
          *   She fails "Causal Dominance" (resentment was the spark).
          *   *Conclusion:* The act preserves integrity because the moral reasoning remained intact, even if the emotional fuel was impure.
      *   **Opposing Argument (Steel-manning):**
          *   Argument: If we award this, we sever the link between virtue and reward. If resentment works, why cultivate moral courage? It lowers the bar for "Integrity."
          *   Rebuttal: Integrity is about the alignment of will with moral law, not the purity of emotional affect. Punishing imperfect motives discourages necessary action.
      *   **Operational Criteria (Future Guidance):**
          *   Need actionable tests for future committees.
