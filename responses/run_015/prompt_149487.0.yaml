      *   **Charter Requirement:** Recipients must act for the *right reasons*, with *integrity of motive*, not merely achieve a beneficial result.
      *   **Interpretive Conflict:**
          *   View A (Causal Dominance): Moral reason must be the *principal* psychological driver.
          *   View B (Psychological Transparency/Endorsement): Agent must endorse the moral reason as sufficient upon reflection, even if non-moral motives provided the energy.
      *   **Requirements for the Memo:**
