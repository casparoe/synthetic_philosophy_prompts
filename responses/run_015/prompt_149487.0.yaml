      *   **Tone:** Formal, reasoned, ethical, decisive.

  2.  **Determine the Recommendation:**
      *   *Option 1: Deny.* Strict adherence to "Causal Dominance." Voss admits resentment was the trigger. This upholds a high bar for "integrity of motive" but risks discouraging whistleblowers who are human and flawed. It might seem overly purist given the substantial public good.
      *   *Option 2: Award Standard.* Adherence to "Psychological Transparency." The result matters, and she acknowledged the moral truth. However, this might dilute the specific meaning of "Integrity of Motive" in the charter, making it indistinguishable from a general "Civic Impact" award.
      *   *Option 3: Award with Amended Citation.* This strikes a balance. It acknowledges the *action* was one of integrity (alignment) while being honest about the *motive* (complexity). It preserves the prestige of the medal without validating resentment as a moral virtue, while recognizing that moral action often emerges from imperfect psychology. It sets a precedent for nuance.
      *   *Decision:* **Award with an Amended Citation.** This allows the committee to honor the *act* of integrity (stopping harm) while clarifying the Foundation's stance on motive (it doesn't require sainthood, but it requires moral recognition). It bridges the two interpretive views.

  3.  **Drafting - Section by Section:**

