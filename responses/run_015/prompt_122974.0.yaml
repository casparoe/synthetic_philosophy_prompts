  *   **Intersubjectivity (Engagement with another mind):**
      *   **Weight of Value:** **0.60.** (60% of the value we derive from art is the sense of connection with the creator.)
      *   **Probability Dana is such a mind:** **0.05.** (Given the "random selection" stipulation, Dana is functionally not a mind.)
