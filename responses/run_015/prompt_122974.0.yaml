  *   **Probability "Creativity" is a Cluster Concept/Verbal Dispute:** **0.55.**
      *   *Meaning:* There is a 55% chance there is no fact of the matter, and you and your friend are simply negotiating definitions (Prescriptivism vs. Descriptivism).

