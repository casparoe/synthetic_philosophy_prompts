  Here is the decomposition, the numbers, and the synthesis you asked for.

  ### 1. The Weights (P, H, A)
  How much of the aesthetic value we care about in art rides on each component? These sum to 1.0.

  *   **P (Artifact Quality/Novelty): 0.30**
