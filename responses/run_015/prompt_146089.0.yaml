      *(Refining Point 1)*: Can consequentialism value integrity? Bernard Williams criticized utilitarianism for ignoring integrity. Singer is more hardline than Williams. So, for Singer, walking away is likely irrational. I should state that clearly.
      *(Refining Point 2)*: The "Cliff." Singer's principle allows you to keep the money if saving the child ruins your life. In Omelas, saving the child ruins *everyone's* life. So Singer says "Don't save." But the walkers say "I can't stay." This implies a duty not to *benefit*, which is distinct from a duty to *prevent*.
