  Materials: 40 poker chips (20 white, 20 black), 12 name tags, 12 Statement Cards containing subtle logical errors. Roles: Four Seniors (start with 3 white chips), eight Juniors (start with 1 white chip). Seniors risk more reputation. Arrange chairs in a tight circle to maximize visibility. Distribute role cards secretly indicating personal goals (e.g., "Accumulate 5 chips" vs "Ensure 3 contradictions occur"). This creates conflicting incentives without revealing the upcoming shift. The Facilitator acts as Guild Master, tracking the hidden fatigue state.

  3. Rules of Play
  Three 15-minute Rounds. Turn structure: A reader presents a Card. Any player may stand to Contradict. To succeed, a second player must Second. Rounds 1-2: Contradictor and Seconder each gain 1 white chip. Round 3: Facilitator announces "Guild Fatigue." Seconding now costs 1 black chip. Contradicting still gains white, but without a Second, the Contradictor gains nothing. Players observe validators hesitating. The rule hasn't banned contradiction, but made support expensive, isolating the defender. The shift is announced, but the social impact is felt through hesitation.

  4. Payoff and Stakes
  Rewards are purely status-based. The top three chip holders earn the title "Guild Elder," granting them prime seating in future seminars and public acknowledgment. Low holders are assigned "Scribe" duty (cleaning the board). Visibility is key: chip piles sit openly on the table. Alliance opportunities arise because you need Seconds to score. Defection feels consequential because isolation yields zero points, mirroring the social cost of upholding a collapsing norm without support. Status is the only currency.

  5. Debrief: Mapping Experience to Theory
  In debrief, ask: "Did the rule against error change?" (No). "Did the logical argument change?" (No). "What changed?" (The cost of support). Introduce Williams and Appiah: Moral revolutions often occur when honor codes shift, not when logic wins. Practices like dueling ended not because arguments improved, but because defenders became socially toxic. The game reproduces the *isolation* of the holdout. Students feel the friction of maintaining integrity when the honor economy collapses. It highlights that persuasion is often secondary to social pricing in moral change. Map this to the triad: Arguments remained constant; interests shifted slightly; honor collapsed. This shows why logical persuasion often fails to end injustices until the social cost of participation outweighs the benefit. The simulation makes the abstract theory of honor economies tangible through the silence of the Seconders. Specifically, the Contradiction Duty remained valid, but upholding it became lonely. This mirrors how slavery persisted despite moral arguments until the honor economy shifted. Emphasize that the students likely felt frustration not at the logic, but at the lack of support. This emotional response is the data point. It proves that moral adherence is socially embedded. When the group withdraws validation, the norm dies regardless of its rational merit. This is the core of the honor revolution thesis.

  6. Predictable Failures and Fixes
  Predictable Failure: Students might laugh or refuse to Second early. Fix: Enforce "Guild Formality"—speak only when standing; treat cards as serious doctrine. Failure: Everyone stops contradicting too early in Round 3. Fix: Offer a hidden bonus for the first three contradictions in Round 3 to ensure some attempt the norm, guaranteeing others experience the cost of not Seconding. Maintain solemnity to prevent meta-gaming the shift. If silence persists, the Facilitator must model a contradiction to break the ice.

  7. Limits of the Simulation
  The simulation cannot reproduce physical danger or economic ruin. Real moral courage risks livelihood, safety, or violence, not just tokens. Discussion must bridge the gap between game friction and real-world ostracization. Students must imagine the stakes were higher to grasp the full weight of historical moral revolutions where the cost was exile or death.
