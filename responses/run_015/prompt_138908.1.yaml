  I modeled our comment threads as a poset ordered by distance retreated toward the motte, assuming every chain of retreats has a limit. Zorn's Lemma guarantees a maximal motte exists—a position you cannot be pushed back from—but since maximal isn't maximum, there are infinitely many such mottes, none comparable to the others. So the lemma proves you can defend a position perfectly without ever having to be right.

  **Note:** The punchline relies on the distinction between a *maximal* element (nothing is strictly better) and a *maximum* element (better than everything else). Zorn's Lemma only guarantees the existence of incomparable maximal elements, meaning you can reach a state where no further retreat is possible (perfect defense) without necessarily arriving at the unique "true" position (being right), and the non-constructive nature of the proof offers no way to distinguish between them.
