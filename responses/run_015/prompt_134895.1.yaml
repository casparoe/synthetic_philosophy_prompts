prompt: |-
  i'm trying to figure out what i should actually demand from a theory of multipolar traps and races-to-the-bottom before i commit to one. write me the desiderata: what cases it has to explain (climate inaction, ai development races, maybe fisheries collapse), which distinctions it can't collapse — like between a true multipolar trap and just a hard collective-action problem, or between a race to the bottom and a race to the top that still ends badly — and which institutional features it needs to stay consistent with. for each, say why it's a real requirement and not just a prejudice of one camp, and flag which ones are non-negotiable versus which are just preferences of particular schools. also, the theory has to handle what i'll call 'epistemic fragmentation traps,' where the agents don't just defect but actually stop sharing a model of the payoff structure itself — don't let it treat that as plain infromation asymmetry. if some subset of these can't all be satisfied together, say so — that's the part i care about most. tell me which single desideratum kills the most popular game-theoretic and institutional-economics accounts. briefly score the usual suspects — evolutionary/game-theoretic, institutional economics, maybe the scott alexander-style moloch framing — against your list. no bibliography needed, i just want the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of multipolar traps:

  1.  **Deconstruct the Request:**

      *   **Goal:** Define desiderata (requirements) for a theory of multipolar traps/races-to-the-bottom.
      *   **Key Components:**
          *   Cases to explain (climate, AI, fisheries, etc.).
          *   Distinctions to maintain (trap vs. collective action, race-to-bottom vs. race-to-top-gone-wrong).
          *   Institutional features to remain consistent with.
          *   Epistemic Fragmentation Traps (agents lose shared model of payoffs, not just info asymmetry).
          *   Trade-offs/Incompatibilities (identify if some desiderata conflict).
          *   The "Killer" Desideratum (which one breaks popular theories).
          *   Scoring of "Usual Suspects" (Game Theory, Inst. Econ, Moloch-style).
      *   **Tone/Style:** Analytical, rigorous, no bibliography, just the spec.
      *   **Constraint:** Distinguish between non-negotiable requirements and school-specific preferences.

  2.  **Initial Brainstorming & Categorization:**

      *   *What is a multipolar trap?* It's when individual rationality leads to collective ruin, often involving competition.
      *   *What are the standard examples?* Prisoner's Dilemma (PD), Tragedy of the Commons, Arms Races.
      *   *What does the user want that's new/deeper?* They want to distinguish "hard collective action" from "true traps." They want to handle "epistemic fragmentation" (divergent worldviews, not just hidden cards). They want to know what breaks current theories.
      *   *Structure:* I need to organize this logically. Maybe: 1. Empirical Coverage, 2. Conceptual Distinctions, 3. Epistemic Conditions, 4. Institutional Consistency, 5. Trade-offs & Scoring.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Empirical Coverage:* Needs to cover Climate (slow, diffuse), AI (fast, winner-take-all), Fisheries (renewable but depletable). *Why?* If it only works for one timescale, it's not general.
      *   *Distinctions:*
          *   Trap vs. Collective Action Problem (CAP). A CAP can be solved with coordination. A Trap implies structural coercion (you *must* defect to survive). *Non-negotiable:* Must explain why coordination fails *endogenously*.
          *   Race-to-Bottom vs. Race-to-Top-Gone-Wrong. Sometimes we optimize for the wrong metric (Goodhart's Law). *Preference:* Some schools think all optimization is bad, but we need to distinguish malicious competition from misaligned optimization.
      *   *Epistemic Fragmentation:* This is the user's specific addition. It's not "I don't know your hand" (asymmetry); it's "We disagree on the rules of the game." *Non-negotiable:* Standard Game Theory assumes common knowledge of payoffs. This breaks that.
      *   *Institutional Consistency:* Must explain why existing institutions (states, treaties) fail *without* assuming they are incompetent. *Non-negotiable:* Cannot just say "governments are weak."

  4.  **Identifying Trade-offs (The "Impossible Trinity"):**

      *   Can we have perfect rationality, common knowledge, *and* explain the trap? Standard Game Theory says no (if rational + common knowledge, they solve PD via repetition or contracts).
      *   To explain the trap, you usually have to sacrifice either Rationality (bounded), Common Knowledge (epistemic fragmentation), or Institutional Capacity.
      *   *The Killer:* Epistemic Fragmentation kills standard Nash Equilibrium analysis because NE requires common knowledge of rationality and payoffs.

  5.  **Scoring the "Usual Suspects":**

      *   *Standard Game Theory:* Good at structure, bad at epistemic fragmentation, bad at endogenous preference change.
      *   *Institutional Economics (Ostrom etc.):* Good at solutions, bad at explaining why global scale fails (scaling problem).
      *   *Moloch/Scott Alexander:* Good at vibe/metaphor, bad at formal rigor, treats "Moloch" as an agent (reification error).

  6.  **Refining the "Epistemic Fragmentation" Point:**

      *   User specifically said: "don't let it treat that as plain information asymmetry."
      *   Info asymmetry = I know something you don't.
      *   Epistemic fragmentation = We define "value" or "risk" differently. We are playing different games.
      *   *Requirement:* The theory must model divergent priors or ontologies, not just hidden variables.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the task.
      *   **Section 1: Empirical Coverage (The Cases).**
      *   **Section 2: Conceptual Distinctions (The Boundaries).**
      *   **Section 3: Epistemic Conditions (The Fragmentation).**
      *   **Section 4: Institutional Consistency.**
      *   **Section 5: The Incompatibility Matrix (Trade-offs).**
      *   **Section 6: The Killer Desideratum.**
      *   **Section 7: Scorecard.**

  8.  **Drafting Content - Specific Nuances:**

      *   *Distinction:* Trap vs. CAP. A CAP is solvable with a contract. A Trap is where the contract cannot be enforced because the enforcer is also in the trap. *Non-negotiable.*
      *   *Race to Bottom vs. Top:* A race to the top (e.g., AI capability) can lead to ruin if the capability is dangerous. The theory must distinguish *competitive pressure* from *goal misalignment*.
      *   *Epistemic:* This needs to be highlighted as the major friction point with standard theory.
      *   *Trade-off:* You can't have a theory that assumes hyper-rational agents *and* explains persistent sub-optimal equilibria without adding friction (transaction costs, epistemic walls).
      *   *Killer:* The "Common Knowledge of Payoffs" assumption.

  9.  **Review against Constraints:**

      *   *No bibliography?* Check.
      *   *Flag non-negotiable vs. preference?* Check.
      *   *Handle epistemic fragmentation?* Check.
      *   *Identify incompatibilities?* Check.
      *   *Score usual suspects?* Check.

  10. **Final Polish:** Ensure tone is sharp and analytical. Avoid fluff. Make sure the "Epistemic Fragmentation" section is robust because the user specifically flagged it. (Self-Correction: Make sure to emphasize that Epistemic Fragmentation isn't just "noise," it's structural divergence).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification for a theory of multipolar traps and races-to-the-bottom. It is organized by empirical coverage, conceptual boundaries, epistemic conditions, and institutional consistency, followed by an analysis of incompatibilities and a scorecard of existing frameworks.

  ### I. Empirical Coverage (The Cases)
  A viable theory must explain the dynamics of these three distinct regimes without ad-hoc adjustments for each.

  1.  **Slow-Moving Commons (e.g., Climate Change):**
      *   **Requirement:** Explain why defection persists despite long time horizons and near-universal agreement on the physical risk.
      *   **Why:** If the theory only works for fast-paced competition, it fails to account for inertia and discounting issues.
      *   **Status:** **Non-Negotiable.**

  2.  **Fast-Paced Capability Races (e.g., AGI Development):**
      *   **Requirement:** Explain why safety is sacrificed for speed even when actors privately prefer safety, driven by the fear of being preempted.
      *   **Why:** Distinguishes "tragedy of the commons" (resource depletion) from "arms race" (relative gain maximization).
      *   **Status:** **Non-Negotiable.**

  3.  **Market-Driven Degradation (e.g., Fisheries, Content Algorithms):**
      *   **Requirement:** Explain how price signals or engagement metrics drive behavior that destroys the substrate of the market itself.
      *   **Why:** Must account for cases where the "trap" is encoded in the profit mechanism, not just a lack of regulation.
      *   **Status:** **Non-Negotiable.**

  ### II. Conceptual Distinctions (The Boundaries)
  The theory must not collapse these categories. Conflating them renders the theory unfalsifiable.

  1.  **Multipolar Trap vs. Hard Collective-Action Problem (CAP):**
      *   **Distinction:** In a hard CAP, agents want to cooperate but lack a mechanism (e.g., no contract enforcement). In a Multipolar Trap, competitive pressure *forces* defection even if mechanisms exist, because survival depends on relative performance.
      *   **Why:** Treating all failures as "coordination problems" implies that better communication solves them. Traps often persist *despite* communication.
      *   **Status:** **Non-Negotiable.**

  2.  **Race-to-the-Bottom vs. Race-to-the-Top-Gone-Wrong:**
      *   **Distinction:** A Race-to-the-Bottom involves lowering standards (wages, safety) to cut costs. A Race-to-the-Top-Gone-Wrong involves maximizing a metric (AI capability, GDP) that correlates with ruin at high levels.
      *   **Why:** The solutions differ. The first requires floors/regulations; the second requires metric redesign or cessation. Conflating them leads to prescribing regulation for problems that require cessation.
      *   **Status:** **Preference (Policy Schools).** *Note: While distinct, a unified theory should explain the competitive pressure driving both.*

  3.  **Structural Coercion vs. Individual Malice:**
      *   **Distinction:** The theory must show how benevolent agents produce malevolent outcomes.
      *   **Why:** If the theory requires agents to be greedy or shortsighted to explain the ruin, it is a theory of vice, not a theory of traps.
      *   **Status:** **Non-Negotiable.**

  ### III. Epistemic Conditions (The Fragmentation Constraint)
  This is the critical addition regarding "Epistemic Fragmentation Traps."

  1.  **Divergent Ontologies vs. Information Asymmetry:**
      *   **Requirement:** The theory must model agents who do not share a common prior on the payoff structure itself, not just agents who hide their hands.
      *   **Why:** Standard Game Theory assumes Common Knowledge of Rationality and Payoffs. In modern traps (e.g., AI safety, climate), actors disagree on *whether* a catastrophe is possible, not just *who* will cause it.
      *   **Status:** **Non-Negotiable.**

  2.  **Endogenous Belief Polarization:**
      *   **Requirement:** The competitive pressure must be able to *widen* epistemic fragmentation (e.g., actors adopting optimistic models to justify risky investment).
      *   **Why:** If beliefs are static, the theory ignores how competition distorts truth-seeking.
      *   **Status:** **Non-Negotiable.**

  ### IV. Institutional Consistency
  The theory must align with how institutions actually function and fail.

  1.  **The Scaling Problem:**
      *   **Requirement:** Explain why solutions that work at small scales (Ostrom-style commons) fail at global scales without simply asserting "states are sovereign."
      *   **Why:** A theory that relies on a Leviathan to solve the trap merely pushes the trap up one level (who polices the Leviathan?).
      *   **Status:** **Non-Negotiable.**

  2.  **Path Dependence:**
      *   **Requirement:** Account for why early lock-in prevents escape even when better equilibria are identified later.
      *   **Why:** Explains why we stick with fossil fuels or dangerous architectures after superior alternatives are known.
      *   **Status:** **Preference (Institutional Economics).**

  ---

  ### V. The Incompatibility Matrix (Trade-Offs)
  You asked to flag where these desiderata cannot be satisfied together. There is a fundamental tension here.

  **The Trilemma of Multipolar Theory:**
  You cannot simultaneously hold these three assumptions:
  1.  **Hyper-Rationality:** Agents maximize expected utility consistently.
  2.  **Common Knowledge:** Agents share a model of the game (payoffs/rules).
  3.  **Persistent Sub-Optimality:** The trap persists indefinitely without exogenous shock.

  *   **If you keep 1 & 2:** Rational agents with common knowledge will solve the trap (via Coasean bargaining or iterated game strategies). The trap disappears.
  *   **If you keep 1 & 3:** You must assume Epistemic Fragmentation (violate 2). Agents are rational but playing different games.
  *   **If you keep 2 & 3:** You must assume Bounded Rationality (violate 1). Agents want to solve it but are cognitively or institutionally incapable.

  **The Conflict:** Most formal theories want to keep Hyper-Rationality. Most sociological observations demand Persistent Sub-Optimality. Therefore, **Common Knowledge must be dropped.** This is where standard Game Theory breaks.

  ### VI. The Killer Desideratum
  **Which single requirement kills the most popular accounts?**

  **The Epistemic Fragmentation Requirement.**

  *   **Why:** Standard Game-Theoretic and Neoclassical accounts rely on **Common Knowledge of Payoffs**. They assume that if agents know the Prisoner's Dilemma structure, they can model the solution (e.g., via reputation or contracts).
  *   **The Kill:** In modern multipolar traps (AI, Climate), the primary driver of defection is not "I know the cost and don't care," but "I genuinely believe the risk is low/managed, and you are hindering progress." When agents cannot agree on the payoff matrix (e.g., probability of existential risk), Nash Equilibrium analysis fails because there is no single game being played. Theories that assume a shared payoff structure cannot explain why coordination fails *even when communication is open*.

  ### VII. Scorecard of Usual Suspects

  | Framework | Empirical Coverage | Conceptual Distinctions | Epistemic Fragmentation | Institutional Consistency | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Game Theory** (Nash/NE) | **Fail.** Good for abstract arms races, bad for slow-moving climate dynamics. | **Fail.** Collapses Trap into CAP. Assumes cooperation is always possible if payoffs align. | **Fail.** Assumes Common Knowledge. Cannot model divergent ontologies. | **Neutral.** Agnostic on institutions. | **Rejected.** Fails the Killer Desideratum. |
  | **Institutional Economics** (Ostrom/North) | **Pass.** Excellent on fisheries/local commons. | **Pass.** Distinguishes rules-in-form vs. rules-in-use. | **Weak.** Treats belief divergence as transaction costs, not structural fragmentation. | **Pass.** Strong on path dependence and scaling limits. | **Conditional.** Works for local traps, fails on global epistemic splits. |
  | **"Moloch" / Alexander-Style** | **Pass.** Captures the vibe of AI and market degradation well. | **Pass.** Strong on Structural Coercion vs. Malice. | **Pass.** Implicitly handles divergent values as "sacrifices to Moloch." | **Fail.** Reifies "Moloch" as an agent. Lacks institutional mechanics for escape. | **Metaphorically Useful, Formally Empty.** |
  | **Evolutionary Game Theory** | **Pass.** Handles dynamic populations and strategy drift. | **Pass.** Explains why "defect" strategies invade. | **Pass.** Allows for diverse strategies/priors to coexist and compete. | **Weak.** Often ignores formal institutional constraints. | **Strongest Candidate.** Handles non-equilibrium dynamics best. |

  ### VIII. Summary Specification
  To commit to a theory, demand that it:
  1.  **Drops Common Knowledge:** It must model agents playing different games simultaneously.
  2.  **Endogenizes Preferences:** It must explain how the trap changes what agents *want*, not just what they *do*.
  3.  **Solves the Scaling Gap:** It must explain why local coordination does not aggregate to global coordination without invoking a global Leviathan.

  If the theory assumes a shared payoff matrix, discard it. That is the non-negotiable filter.
