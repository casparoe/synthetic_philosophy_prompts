answer: |-
  Here is the Nyāya verdict on your debate, broken down by your specific constraints.

  ### The Verdict: Who is Closer?

  You are closer, but with a technical correction. Your friend's reading ("memory is unreliable") is actually non-starter in Nyāya epistemology. In Nyāya, memory (*smṛti*) is **not** a *pramāṇa* (valid source of knowledge) to begin with. Memory is merely a reproduction of a past cognition; it cannot generate new truth. So, saying the film is about "unreliable memory" is, from a Nyāya perspective, like saying a film is about "dry water." Memory *cannot* certify truth; only fresh cognition can.

  Your reading ("running life on unauditable knowledge sources") aligns with the Nyāya concern for *pramāṇa* validation. The film isn't about the failure of a biological faculty; it is about the failure of the **validation conditions** required for knowledge to count as knowledge. Leonard isn't suffering from memory loss so much as he is suffering from a collapse of *parataḥ prāmāṇya* (extrinsic validity).

  ### 1. Leonard's System: Defective *Śabda*, Not a 5th *Pramāṇa*

  You asked if Leonard's notes and tattoos constitute a distinct fifth *pramāṇa* or defective *śabda* (testimony).

  **Nyāya Verdict:** It is defective *śabda*.

  In Nyāya, *śabda* is verbal testimony. It requires two conditions: the words must be intelligible, and the speaker (*āpta*) must be reliable. Leonard's notes function as testimony from "Past Leonard" to "Present Leonard."
  *   **The Defect:** For *śabda* to be valid, the speaker must be competent and truthful. Past Leonard is neither. He is cognitively damaged and, as we learn, actively self-deceiving.
  *   **The *Parataḥ* Problem:** Nyāya holds that validity is extrinsic (*parataḥ*). You know a cognition is true because it leads to successful action (*arthakriyākāritva*) or because the source is verified by other *pramāṇas* (like perception or inference). Leonard's system is designed to block this. He treats the notes as intrinsically valid (*svataḥ prāmāṇya*), which Nyāya rejects. He refuses to check the notes against perception (e.g., ignoring that his car has changed) or inference (ignoring that Teddy's motives might be complex).
  *   **Knowledge Status:** Does he have no knowledge, or too much? He has **no knowledge** (*apramā*), but he suffers from **false certainty** (*niścaya*). In Nyāya, doubt (*saṃśaya*) is actually healthier than error (*viparyaya*). Leonard eliminates doubt by destroying counter-evidence. He creates a closed epistemic loop where validity is assumed, never tested.

  So, it is not a new *pramāṇa*. It is *śabda* from a speaker who has been disqualified, treated as if it were *pratyakṣa* (direct perception).

  ### 2. Sammy Jankis: A Failed *Upamāna*

  You asked if the Sammy Jankis plotline is a study in *upamāna* (comparison/analogy).

  **Nyāya Verdict:** You are not forcing it, but it is a dramatization of *upamāna* failing, not succeeding.

  *Upamāna* is the knowledge of a relation between a name and an object based on similarity to a known object (e.g., "A *gavaya* is like a cow," then seeing a *gavaya* and knowing the name applies).
  *   **The Analogy:** Leonard is told "Sammy is like you." He observes Sammy. He infers "I am like Sammy." This allows him to name his own condition.
  *   **The Collapse:** *Upamāna* requires the analogue (Sammy) to be real and distinct from the subject (Leonard). The film reveals that Sammy is a projection of Leonard's own guilt. The "similarity" is actually identity.
  *   **The Epistemic Lesson:** This is a legitimate use of the concept to show **epistemic hazard**. If the basis of comparison is fabricated, the knowledge derived from the comparison is *viparyaya* (error). Leonard uses *upamāna* to outsource his self-knowledge. He thinks he is learning about himself by looking at Sammy, but he is actually looking in a mirror he has been told is a window.

  Your reading holds up: the film uses the structure of *upamāna* to show how we construct self-knowledge through narratives about others, and what happens when that narrative is a lie.

  ### 3. Where the Nyāya Framing Does Real Work

  **The Scene:** The sequence where Leonard decides to keep Teddy alive as a target, specifically when he writes the note on the Polaroid.

  **Why it works:** A psychological reading sees this as Leonard coping with grief or boredom. A Nyāya reading sees this as the **manufacture of validity**.
  Leonard has just received testimony from Teddy that contradicts his entire mission (Teddy claims the revenge is already done). This testimony should trigger *parataḥ* validation checks. Instead, Leonard actively alters the *śabda* source. He writes "Don't believe his lies" on the photo.
  In Nyāya terms, Leonard is retroactively disqualifying a reliable speaker to protect a defective cognition. He is manipulating the conditions of *śabda* to ensure a specific outcome. This scene isn't just about a man confused; it's about a man **engineering ignorance**. The Nyāya framework highlights that Leonard isn't a victim of his condition here; he is an active epistemologist of his own delusion. He chooses *aprāmāṇya* (invalidity) because the *pramā* (truth) leaves him with no purpose. This supports your argument: it's about unauditable sources, because he is the auditor rigging the audit.

  ### 4. Where the Nyāya Framing Distorts the Film

  **The Scene:** The black-and-white sequences where Leonard is on the phone in the motel room, recounting the story of Sammy Jankis.

  **Why it distorts:** Nyāya is a realist school concerned with public debate, logic, and liberation (*mokṣa*) through correct knowledge. It assumes a shared reality that can be correctly mapped.
  These phone call scenes are phenomenological; they are about the **internal experience** of fragmentation. Leonard is talking to himself (as we later realize). Applying Nyāya logic here tries to impose a structure of "valid vs. invalid cognition" on a state of mind that is pre-cognitive or anti-cognitive.
  Nyāya asks, "Is this cognition true?" The film, in these moments, asks, "What does it *feel like* to have no continuity?" If you apply Nyāya too strictly here, you reduce Leonard's existential tragedy to a logic puzzle. You risk turning his suffering into a mere classification error. The film wants you to feel the vertigo of his condition; Nyāya wants you to solve the equation of his condition. In these specific monologue scenes, the "feeling" is the point, not the "validity," and the Nyāya lens can sterilize the emotional horror of a man talking to a void.

  ### Summary for the Argument

  Tell your friend this:
  If the film were just about memory being unreliable, Leonard would be a passive victim. But Nyāya shows us that memory isn't a valid source of truth for anyone, ever. The film is about what happens when a man treats his own **records** (testimony) as **perception**, and actively destroys the **external validation** (*parataḥ prāmāṇya*) that would prove him wrong.

  Your friend sees a broken brain. You see a broken epistemology. Nyāya sides with you: Leonard's tragedy isn't that he can't remember; it's that he has built a system where he can never be proven wrong, and therefore can never know anything at all.
