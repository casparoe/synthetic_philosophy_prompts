      *   *Refining the Nyāya specifics:* Ensure *parataḥ prāmāṇya* is explained clearly. Validity comes from *outside* the cognition (e.g., successful action). Leonard's actions "work" (he kills people), but they don't achieve the *intended* truth (justice). This is *arthakriyākāritva* (efficacy) twisted.
