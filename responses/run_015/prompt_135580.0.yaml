answer: |-
  The practice you describe—statistically "cleaning" moral judgments to isolate a stable preference profile—is one of the central methodological pillars of contemporary AI value alignment. It treats human moral psychology analogously to a signal-to-noise problem in engineering: the "signal" is the true preference, and the "noise" is the cognitive bias.

  However, as you rightly suspect, this methodology is not philosophically neutral. It rests on a specific, often unacknowledged, metaphysics of the moral agent. To analyze this, we must dissect the ontological status of the "preference" being extracted, the normative assumptions embedded in the definition of "bias," and the political implications for AI governance if we reject the premise of a singular, recoverable value function.

  ### 1. The Ontological Commitment: Psychological Realism vs. Idealization

  To make the correction procedure coherent, one must hold a commitment regarding the nature of preferences.

  **The Realist Reading (The "Inner Compass" Model)**
  The standard interpretation of this practice presupposes a form of **Psychological Value Realism**. This is distinct from metaphysical moral realism (the claim that moral truths exist independently of humans); rather, it claims that *individual* moral truths exist independently of *context*. It assumes that within the cognitive architecture of the subject, there is a latent variable—a "true" utility function—that generates judgments. Framing effects, anchoring, and emotional priming are treated as measurement errors, akin to static on a radio line.
  *   **Commitment:** This requires believing that moral agency is fundamentally static and context-invariant. It assumes that if a subject judges differently in Frame A vs. Frame B, one of those judgments is "mistaken" relative to their own internal standard.

  **The Constructivist Reconstruction (The "Reflective Equilibrium" Model)**
  Can this be saved without realism? Yes, but only by shifting the goal from *discovery* to *idealization*. A constructivist (e.g., Rawlsian or Habermasian) could argue that the "cleaned" preference is not what the subject *does* value, but what they *would* value under idealized conditions of deliberation.
  *   **Reconstruction:** Here, statistical correction is not removing noise to reveal a pre-existing fact; it is simulating a process of **Reflective Equilibrium**. By removing "arbitrary" influences (like order effects), the researcher attempts to model the subject as a fully rational agent.
  *   **The Cost:** This admits that the "true preference" does not currently exist in the subject's mind. It is a counterfactual construct. The alignment researcher is no longer an archaeologist digging up values; they are an architect building a rationalized version of the user. This creates a legitimacy problem: By what right does the researcher define the conditions of "ideal deliberation"?

  ### 2. Internal Consistency and the Smuggling of Normative Assumptions

  The practice faces a severe internal consistency challenge regarding the definition of "bias." In psychometrics, bias is defined as systematic error. But in moral psychology, distinguishing "error" from "feature" requires a normative theory of morality.

  **The Invariance Assumption**
  Most correction procedures rely on the **Principle of Invariance**: if a judgment changes due to an "irrelevant" change in framing, the judgment is flawed.
  *   **The Normative Smuggle:** This assumes that morality *ought* to be invariant to context. However, many ethical frameworks argue the opposite. A care ethicist might argue that emotional priming is not noise but the very mechanism of moral perception. A particularist might argue that context *constitutes* the moral reality, so stripping it away destroys the moral content.
  *   **The "View from Nowhere":** To classify emotional context as "noise" is to privilege a dispassionate, Kantian or Utilitarian mode of reasoning over a Humean or Virtue-ethical one. The statistical procedure effectively hard-codes a specific normative ethical theory (likely rationalist/universalist) into the data processing pipeline.

  **The Circularity of Correction**
  If framing effects are pervasive (as psychology suggests), there is no "neutral" frame. The "corrected" aggregate is simply the preference profile that emerges from the *researcher's* chosen framing of the experiment (e.g., deciding that the "logical" frame is the baseline and the "emotional" frame is the deviation).
  *   **Conclusion:** The procedure is not internally consistent as a neutral measurement tool. It is a normative filter. It defines "rationality" as "stability," and then measures stability to prove rationality.

  ### 3. Implications for AI Alignment: From Extraction to Governance

  If we replace the implicit theory (preferences are stable facts to be extracted) with the alternative theory (preferences are situated, pluralistic, and context-dependent), the technical and institutional project of AI alignment changes fundamentally.

  **A. The Conceptual Suspicions of Single Preference Profiles**
  If moral variability across frames reveals genuine moral complexity, then aggregating human values into a single, cleaned utility function is a **category error**.
  *   **The Problem:** A single objective function forces a resolution to moral dilemmas that humans themselves do not resolve. It collapses a moral *conflict* into a mathematical *optimization*.
  *   **The Risk:** An AI trained on "cleaned" data will act with a moral confidence that no human possesses. It will enforce a coherence that is artificial, potentially overriding legitimate moral ambiguity with false precision.

  **B. Institutional Alternatives: Preserving Disagreement**
  If we cannot extract a "true" preference, alignment must shift from **Value Loading** (uploading the right values) to **Value Governance** (managing the process of value conflict).

  1.  **Pluralistic Systems (The "Moral Parliament"):**
      Instead of one utility function, the AI could maintain a distribution of competing value models (e.g., a "care" model, a "justice" model, a "liberty" model). When faced with a decision, the AI does not optimize a single score but negotiates between these internal stakeholders, perhaps exposing the trade-off to the human user. This mirrors the human condition of conflicting intuitions.

  2.  **Procedural Alignment:**
      Rather than aligning the AI to specific *outcomes* (which vary by frame), align the AI to specific *procedures*. The AI's goal is not to "maximize good" but to "facilitate human deliberation." It would be designed to recognize when a framing effect is occurring and prompt the user to reflect, rather than bypassing the user to execute the "corrected" preference.

  3.  **Institutionalizing Uncertainty:**
      AI systems could be designed with "moral uncertainty" hard-coded. If the statistical variance in human judgments is high (indicating genuine moral complexity rather than noise), the AI should default to deference or inaction, rather than relying on the statistical mean. This treats high variance as a stop-signal, not a data point to be smoothed.

  4.  **Democratic Aggregation over Statistical Aggregation:**
      Currently, "aggregation" is done by algorithms averaging data points. If preferences are constructed, they should be aggregated politically. This suggests that value alignment cannot be solved in the lab; it requires democratic institutions to decide which "framings" of morality the AI should prioritize. The "correction" of bias becomes a public policy decision, not a hyperparameter tuning.

  ### Conclusion

  The practice of statistically correcting moral judgments to find "stable preferences" is not a neutral scientific method; it is a form of **applied moral philosophy**. It presupposes that the moral self is a unified, stable entity and that rationality is defined by invariance.

  If we accept that moral judgments are irreducibly situated, the project of extracting a clean preference profile for AI becomes not just difficult, but conceptually incoherent. It attempts to solve a political problem (how to live with conflicting values) with an engineering solution (optimizing a function). A more defensible path forward acknowledges that "bias correction" is actually "value selection." Consequently, the authority to decide which variations count as noise must be moved from the laboratory to the public sphere, and AI systems must be designed to navigate moral pluralism rather than erase it.
