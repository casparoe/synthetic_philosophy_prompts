answer: |-
  You have isolated a fissure that runs through the center of philosophical fiction, though philosophy itself rarely has a name for it because philosophy generally tries to seal it. You are describing a situation where the **logical stipulations** of a thought experiment diverge from its **phenomenological uptake**.

  There is no single canonical term for this specific phenomenon in the way "performative contradiction" or "category mistake" exist. However, there are three frameworks that map onto what you are seeing. If you require a label for your own working vocabulary, I would suggest **"The Phenomenological Override."**

  Here is how to define it, how it differs from a defect, and why the gap is not only productive but necessary for your specific artistic aim.

  ### 1. The Name and Definition
  In the philosophy of mind and experimental philosophy, there is a concept known as **Heuristic Substitution** (popularized by Daniel Kahneman). When a human mind is asked to solve a complex problem (e.g., "grasp actual infinity"), it unconsciously substitutes a simpler, related problem (e.g., "grasp being trapped").

  In the context of thought experiments, Kathleen Wilkes (in *Real People*, 1988) argued that many famous thought experiments fail because they ask us to imagine scenarios that violate the necessary conditions of psychological continuity. She calls these **"Impossible Imaginings."**

  Your observation refines Wilkes. You have found that when the logical engine (Infinity) is impossible to simulate, the audience's mind automatically installs a different engine (Inescapability + Memory) to generate the emotional payload.

  Therefore, I propose you call this **The Phenomenological Override**.
  **Definition:** *A condition in a narrative or philosophical thought experiment where the stated logical premises fail to generate the intended affective response, and are silently replaced by the audience's mind with psychologically salient variables (such as memory, agency, or continuity) that successfully generate the affect, albeit for different reasons.*

  ### 2. Defective vs. Productive
  You ask if a thought experiment whose stated and effective engines come apart is always defective.

  **In Philosophy: Yes.**
  If you are arguing a logical point, this gap is a fatal flaw. It is an **Intuition Pump Leak** (to use Dennett's term). If the conclusion relies on "Infinity," but the audience is convinced by "Memory," the argument is invalid. The philosopher must close the gap to ensure the conclusion follows from the premises.

  **In Literature: No. It is the source of the work.**
  In art, this gap is not a leak; it is **Resonance**.
  A purely logical execution of Eternal Recurrence (true infinity, no memory, perfect repetition) is, as you found, emotionally inert. It is a mathematical concept. Humans do not feel mathematics; they feel psychology.
  *   The "Infinite" version shakes them not because they understand infinity, but because they encounter the **Sublime** (in the Kantian sense): the overwhelming failure of the imagination to comprehend magnitude.
  *   The "Finite + Memory" version dread them because it engages **Personal Identity**. If I remember the previous cycle, *I* am suffering. If I do not, *someone else* is suffering in my body.

  The gap is productive because your medium is not logic; it is the human nervous system. The "failure" of the premise to work logically is the "success" of the story to work aesthetically. You are not testing the truth of recurrence; you are testing the *weight* of recurrence. Nietzsche himself knew this; he did not present recurrence as a cosmological fact to be proven, but as a "weight" (*das größte Schwergewicht*) to be felt. Your audiences are correctly identifying that the weight comes from the trap, not the math.

  ### 3. How it Differs from Ordinary Defects
  An ordinary defective thought experiment usually suffers from one of three things:
  1.  **Incoherence:** It asks you to imagine a square circle.
  2.  **Begging the Question:** It assumes the conclusion in the premise.
  3.  **Irrelevance:** The details provided do not impact the outcome.

  Your "defect" is different. It is a **Translation Error** that becomes a **Transmutation**.
  *   **Standard Defect:** The bridge collapses, and you cannot cross.
  *   **Your Gap:** The bridge collapses, but the audience builds a boat and crosses anyway, arriving at a different shore that they find more interesting.

  The difference lies in **Fidelity**. A standard defect betrays the inquiry. Your gap *advances* the inquiry by revealing that the "horror of recurrence" is actually the "horror of conscious entrapment." You have inadvertently conducted a better philosophical investigation than the original premise allowed, because you tested the *psychological conditions* of the horror rather than just the *temporal conditions*.

  ### 4. The Specific Variables: Memory and Exit
  Your findings on memory and exit align with specific philosophical problems that the "standard" recurrence glosses over.

  *   **The Exit (Inescapability):** This shifts the genre from Cosmology to Prison. A life chosen infinitely (Nietzsche's *Amor Fati*) is heroic. A life imposed infinitely is punitive. Your audiences are reacting to the removal of agency, not the extension of time.
  *   **The Memory (Accumulation):** This touches on **Parfit's Reductionism**. If there is no psychological connectedness (memory) between Cycle 1 and Cycle 2, are they the same life? Your audience intuitively senses that without memory, the "punishment" cannot land on the self. The "Finite + Memory" version is more dreadful because it preserves the **Continuity of Consciousness**. It ensures the *subject* of the suffering persists.

  ### 5. Recommendation for the Novelist
  You asked if philosophy has a way of talking about this. It does, but mostly in the margins, under headings like "The limits of intuition pumps" or "Literature as moral philosophy" (Martha Nussbaum).

  Do not try to fix the gap. The gap is your subject.
  The "carving" you are after is the realization that **human beings cannot simulate eternity; they can only simulate confinement.**

  If you need a label for your notes or discussions, I recommend **"The Affective Decoupling."**
  It signals that the *affect* (dread) has decoupled from the *concept* (recurrence) and re-attached to the *condition* (entrapment/memory).

  This is not a failure of your stories. It is a successful demonstration that Eternal Recurrence, as a lived experience, is not about time. It is about the self's relationship to its own boundaries. The "infinity" is just the wallpaper; the "no exit" is the room. Your audiences are reacting to the room.

  **Summary Definition for your use:**
  > **The Phenomenological Override:** A narrative phenomenon wherein the audience's emotional response to a speculative premise is generated not by the premise's logical parameters (e.g., infinity), but by the psychological conditions required to simulate them (e.g., entrapment, memory, continuity). Unlike a logical fallacy, this override is aesthetically productive, revealing the human constraints that make the abstract premise feel real.

  You are writing in the space where the logic stops and the feeling begins. That is not a defect; that is the definition of literature.
