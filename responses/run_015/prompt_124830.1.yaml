          3.  Provide a "Residue Report": What maps cleanly? What requires distortion? What is inexpressible?
          4.  Answer the core question: Is teleosemantics just a redescription of training dynamics, or does it claim something about teleological normativity that AI vocabulary misses?

  2.  **Deconstruct Teleosemantics (Philosophical Core):**
      *   *Core Idea:* Mental states represent things because they were *selected* (by evolution or learning) to do so.
      *   *Misrepresentation:* A state misrepresents if it fires when it shouldn't, based on its *selected function*, not just statistical error.
      *   *Normativity:* There is a "right" and "wrong" way for the system to work, grounded in history, not just current performance.
