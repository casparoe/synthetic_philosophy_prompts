          *   *Refinement:* This is the "Grounding" problem. In AI, weights encode correlations. Teleosemantics says the *process* of minimizing loss gives the *meaning*.

  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *Clean Maps:* Selection history $\rightarrow$ Training trajectory/loss landscape. Misrepresentation $\rightarrow$ Generalization error/OOD failure.
