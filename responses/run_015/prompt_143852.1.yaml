      *   *Trace Labour:* If I teach a class, the "lesson" is gone. But the *capacity* to teach (my labor power) was sold. The *result* (educated students) benefits the school system/economy, not me.
      *   *Textual Application:* "loss of realization." For the teacher, the realization (teaching) becomes a loss (exhaustion, no ownership of the curriculum/outcome).
      *   *Does the chain break?* No, because the "object" can be read as the *crystallized labor time* or the *value* created, not just a physical widget.
      *   *Problem for Marx?* If we stick *strictly* to 1844's Hegelian language, it's trickier. But the logic holds: The *activity* becomes a power independent of the worker. The schedule, the metrics, the "outcome" (even if intangible) are owned by the employer.
      *   *Key Phrase:* "power independent of the producer." This is the load-bearing beam, not the word "object."

