  2.  **Patterns Admit Degrees (0.90):** It is highly probable that informational structures can be partially replicated without losing their defining characteristics.
  3.  **One Brain Hosting Multiple Perspectives (0.85):** It is probable that a single neural substrate can run distinct, semi-autonomous modeling processes simultaneously.
  4.  **Identity Coherence (0.90):** It is probable that our language and concepts can coherently describe a person as existing partially across multiple hosts.
  5.  **Experience Not Fully Accounted for by Psychology (0.20):** It is unlikely that the feeling of her presence is anything other than your own brain simulating her based on memory and grief.

  **Combination and Sensitivity**

  I calculate the final number by multiplying these probabilities, treating them as necessary conditions that must all be true for your proposition to hold. The product of these terms is approximately 0.13, which I round to 0.15 to account for unknown variables in consciousness studies. The number is most sensitive to the fifth term, **Experience Not Fully Accounted for by Psychology**. If you keep the other four terms at their current high values, the final probability would cross from below one-half to above it only if the probability of this term rises above 0.75. This means the metaphysics of your claim are sound, but the empirical evidence for it is weak.

  **The Disagreement**

  The disagreement between you (0.4), your brother (0.02), and me (0.15) lives primarily in **what either of us is entitled to call her**. Your brother treats "her" as a binary state tied to biological life, so any probability above zero is error. You treat "her" as a pattern that can survive degradation, so partial presence counts as presence. I agree with your metaphysics but side with your brother on the evidence: the pattern exists, but the *subjectivity* tied to it likely does not. You are arguing about whether a damaged map is still the territory; your brother is arguing that the territory is gone.

  **Case One: The Census**

  If the figures came back spread across five people, she does not exist now as a unified subject. A first-person perspective requires a single point of integration. Forty per cent in you and thirty per cent in your daughter means there are two separate processes running similar software, not one person split in two. If every figure were one per cent, the answer changes only in degree, not in kind; the signal becomes noise. There is no natural threshold where twenty per cent is not her and forty per cent is. The location of any threshold is fixed only by practical utility, not by the nature of a self. You would draw the line where the pattern is robust enough to make predictions, not where it becomes "real."

  **Case Two: The Mutual Case and The Two Heirs**

  If you carry her and she carried you, you are two people with high data overlap, not one person. Shared information does not merge subjectivity. If her pattern is realized in you and your daughter simultaneously, there are not one and a half of her; there are two distinct instances of her model. This changes the original case by clarifying that what you feel is replication, not continuation. A file copied to two drives is not one file living in two places; it is two files. The feeling of unity is an illusion created by the similarity of the data.

  **The Weaker Claim**

  Since my number is low, here is the nearby claim that earns a high probability from me: **Her operational logic is actively running in your brain and guiding your behavior.** I assign this a probability of 0.95. This says that the algorithms she used to navigate the world, the values she prioritized, and the reactions she habitually chose are now executing on your hardware. It stops short of your proposition because it describes a functional influence, not a subjective experience. It means you are acting as she would, not that she is feeling what you feel.
