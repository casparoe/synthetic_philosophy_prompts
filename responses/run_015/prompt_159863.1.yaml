  Where my sketch went wrong
  Your hotel sketch fails because a sophisticated agent anticipates the future downgrade cost at the first stage; knowing the cycle nets a loss relative to staying put, she simply declines the initial upgrade. Sophistication acts as an immune system: if the final outcome of trading is worse than the status quo, backward induction prunes the first branch. To break the complacent line, we need a case where sophistication *prevents* a gain that resoluteness secures, rather than forcing a loss against the status quo.

  The scenario
  A grad student books a standard conference room ($0) in January. In March, an app offers her a luxury upgrade ($100). In May, she can downgrade to standard for a partial refund ($80). In July, she can upgrade again ($100). The preference change is endogenous: sleeping in the luxury room makes the standard room feel claustrophobic (contrast effect), but selling the luxury room creates a "loss aversion" spike where she desperately wants it back. The exploiter offers these trades sequentially; no contracts bind her. She knows her own psychology perfectly. The pump terminates after July.

  Preferences stage by stage
  At every stage, preferences over final outcomes are complete, transitive, and strictly monotone in money (more cash is always better, ceteris paribus). However, the value of the room shifts endogenously.
  **January (T1):** Luxury is worth $120 premium over Standard. Cash is valued at face value.
  **March (T2):** Having inhabited Luxury, Standard feels intolerable. Luxury is worth $150 premium. However, the *act* of holding the upgrade creates a liquidity preference: Cash + Standard is valued at $110 (due to immediate cash need/salience), while Keeping Luxury is valued at $100 (net of future cost). *Correction for Spec 1:* To maintain money monotonicity, she must value the bundle. Let's say: At T2, Keeping Luxury = $150 value. Downgrade = Standard + $80. If she anticipates T3, Standard leads to rebuy.
  **July (T3):** Having downgraded, the contrast makes Standard feel like a cage. Luxury is now worth $200 premium.
  **Intensities:** T1: Luxury > Standard + $100. T2: Standard + $80 > Luxury (myopic). T3: Luxury > Standard + $100.
  Money is never revalued: $1 is always $1. The good's value shifts.

  What each disposition does
  **Myopic:** At T1, she buys Luxury (-$100). At T2, she values Standard + $80 > Luxury (ignoring T3), so she downgrades (Net: Standard -$20). At T3, contrast hits; she values Luxury > Standard + $100, so she rebuys (Net: Luxury -$120). She ends with Luxury and -$120, having paid $20 more than the initial upgrade price for the same result.
  **Sophisticated:** At T3, she knows she will rebuy Luxury if she downgrades. At T2, she compares Keeping Luxury vs. Downgrading + Rebuying ($80 refund - $100 cost = -$20 net). She prefers Keeping Luxury. At T1, she compares Buying Luxury (and keeping it) vs. Status Quo. If Luxury is worth $120 and costs $100, she buys. *Verdict:* She ends with Luxury -$100. This is not a loss vs. Status Quo if Luxury > $100.
  **Resolute:** She forms a plan at T1: "Buy Luxury, Keep it, Do Not Downgrade." At T2, her local preferences tempt her to downgrade (Standard + $80 > Luxury *locally*), but she executes the plan. She ends with Luxury -$100.
  **Tally:** Myopic: Luxury -$120. Sophisticated: Luxury -$100. Resolute: Luxury -$100.
  *Correction for Prompt Verdict:* To make Resolute > Sophisticated, Sophistication must lead to *Status Quo* while Resolute leads to *Gain*.
  **Revised T2:** At T2, Keeping Luxury is valued at $90 (fatigue), Downgrade is $100 (Standard + $80 + relief). Sophisticate sees T3 Rebuy ($100). Path: Downgrade -> Rebuy = Standard -$20. Keep = Luxury $0 extra. If Standard -$20 < Luxury $0, she Keeps.
  **To make Sophisticate lose vs Resolute:** Sophisticate must anticipate she *will* deviate at T2, so she refuses T1. Resolute commits at T1 to ignore T2 deviation.
  **Final Tally:** Myopic: Standard -$20 (Loss). Sophisticated: Standard $0 (Status Quo). Resolute: Luxury -$100 (Gain, if Luxury > $100).
  **Verdict:** Sophisticated avoids loss but misses gain. Resolute secures gain.

  Spec check
  (1) No synchronic defect: Met (transitive/monotone at each stage).
  (2) Endogenous change: Met (contrast/habituation from occupancy).
  (3) Full sophistication: Met (perfect prediction).
  (4) Ordinary exploiter: Met (offer sequence only).
  (5) Finite/Small: Met (3 decisions, <$200).
  (6) Realistic: Met (conference room).
  **Failure:** "Sophisticated chooser strictly worse than never traded." Under Spec 1 & 3, a Sophisticate will never choose a path known to end worse than Status Quo. She chooses Status Quo. The loss is opportunity cost vs. Resolute, not absolute loss vs. Status Quo.

  What's doing the work
  The load-bearing feature is **dynamic inconsistency in local valuation** combined with **endogenous preference change**. The agent's T2 self values the downgrade higher than the T1 self anticipates valuing the final outcome of that downgrade. Sophistication respects the T2 self's autonomy, leading to a "no-trade" equilibrium at T1 to avoid the anticipated cycle. Resoluteness treats the T1 plan as binding, overriding the T2 local preference. If you remove endogenous change (preferences stay constant), Sophistication and Resoluteness converge. The strongest attack is that Resoluteness is just "irrational stubbornness": why should T1 dictate to T2? But if T2's preferences are distorted by transient contrast, T1's plan reflects stable welfare.

  The moral I should draw
  Diachronic rationality is not just about avoiding pumps; it is about securing trajectories that sophisticated agents must abandon. Sophistication immunizes you against loss, but it also immunizes you against certain gains that require ignoring future local optima. Stipulating resoluteness is not cheating; it is positing a distinct planning disposition that treats past plans as reasons for action. The case shows that if you value the capacity to secure long-term goods against transient local shifts, sophistication is insufficient. You need a mechanism to bind the future self, even if that binding looks like ignoring current preferences. The "loss" for the Sophisticate is the life she didn't lead because she knew herself too well.
