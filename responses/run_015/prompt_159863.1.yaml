an quietly relaxing a spec.

  Be committed about it: give me one case, not a menu of options; commit to whether each spec is met; and commit to a verdict on what the case shows, including the strongest objection you can see to your own reading of it. One thing I especially want you to be honest about is standpoint: exploitation has to be worse-than-doing-nothing for somebody, but I suspect it can't be worse for every stage, since whoever makes the last trade thinks that trade was worth it. Tell me which standpoint the claim needs and which stage dissents.

