prompt: |-
  Hi — I'm a GP by background and I sit on our regional health system's individual funding request panel, the thing everyone here calls "exceptional cases". We meet twice a month, get through about twenty-five cases a session, ten or fifteen minutes each, and the panel is me, a paediatrician, someone from finance, and a lay member who is formidably sensible and has no medical training at all. Our founding document says we fund "restoration or maintenance of normal bodily and mental functioning" and we don't fund "improvement of function beyond what is normal". That sentence read as perfectly clear for about a fortnight, and then real cases started arriving and it's been coming apart in our hands ever since. I've done some reading on the therapy-versus-enhancement distinction in my own time and I get the general shape of the arguments, but everything I found stops right at the bit I need: somebody has to actually decide, in fifteen minutes, and write one page of reasons that has to survive an appeal and be readable by the person who applied. I was complaining about this to my brother, who teaches, and he said the same thing comes up with exam extra time and whether a quiet room is a treatment or an advantage, which is basically the same problem wearing a different hat.

  So: please write me a decision procedure my panel can actually run, with the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure stops and returns a "no" on its own, and where it has to hand the question to the four of us because it's a values call and not a factual one. Some constraints. We can't put terms like "species-typical" in the decision letters — the lay member rolls her eyes and the applicants definitely won't know what it means — so every question needs an askable-in-plain-English version. We get a twenty-page submission from the applicant's clinician and we can't commission anything ourselves, and maybe forty per cent of the time the submission just doesn't contain what we need, so the procedure has to tell us what to do when the answer is "unknown" rather than pretending we can look it up. We're also meant to be consistent with what earlier panels did without being strictly bound by it, so say how to record a decision so the next one can follow it. Two things I want built in because they've wrecked us twice already: one, some of these benefits are positional — they only work because most other people don't have them, and if we funded everyone the benefit would just evaporate — and I don't know whether that counts against funding or whether it's a fairness question we should be voting on separately. Two, my colleague pointed out that if we'd built schools around moving around instead of sitting still, a chunk of what we fund for attention problems would count as enhancement under our own rule, which makes me think "normal functioning" is quietly being measured against a world we invented; I'd like a question that catches cases where the demand being met is one our own institutions created, and I'd like you to tell me honestly if that question opens a hole we can't close.

  Then run it on these. (1) A cochlear implant for a 45-year-old man who has been profoundly deaf since birth, fluent signer, active in the Deaf community, otherwise healthy; half the panel thinks this is obviously treatment because he's deaf, half thinks it's enhancement because there's nothing there to restore. (2) A request from occupational health on behalf of night-shift nurses for a wake-promoting drug — the papers just call it Drug W, it's licensed for narcolepsy, these nurses don't have narcolepsy, they have our rota — with data showing measurably higher error rates on nights. (3) Growth hormone for a twelve-year-old boy on the second percentile for height, no deficiency, both parents short, predicted adult height about 5'3", and the referral letter mentions bullying. I've a feeling at least one of those comes out somewhere the panel won't want to go — my guess is the growth hormone one, since we've always informally treated short stature as cosmetic, but if it's a different one that should bother us, say so plainly instead of letting me fudge it. If you've room, sketch the case that keeps coming up and that I personally can't get straight: a 58-year-old surgeon whose memory is completely normal for her age and not for her job. And tell me which distinctions I have to keep for the procedure to stay honest, which ones I can drop without it going wrong, and where it will give me an answer that's consistent and defensible but just isn't right.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **User:** GP, member of an Individual Funding Request (IFR) panel ("exceptional cases").
      *   **Context:** Panel meets twice a month, ~25 cases/session, 10-15 mins/case. Panel composition: GP (user), Paediatrician, Finance, Lay Member.
      *   **Mandate:** Fund "restoration or maintenance of normal bodily and mental functioning." Do *not* fund "improvement of function beyond what is normal."
      *   **Problem:** The distinction collapses under real-world pressure. Need a practical decision procedure (algorithm/heuristic) that works in 15 mins, uses plain English, handles missing info, ensures consistency, and addresses specific philosophical pitfalls (positional goods, institutional demands).
      *   **Constraints:** No jargon (e.g., "species-typical"). Must handle "unknown" info (40% of submissions are incomplete). Must record decisions for precedent.
      *   **Specific Issues to Address:**
          *   Positional goods (benefits vanish if everyone has them).
          *   Institutional demands (is the "disability" created by the system, e.g., schools requiring sitting still?).
          *   The "Surgeon's Memory" case (normal for age, abnormal for job).
      *   **Test Cases:**
          1.  Cochlear implant (congenitally deaf, Deaf community member).
          2.  Wake-promoting drug for night-shift nurses (no narcolepsy, just rota).
          3.  Growth hormone (short stature, no deficiency, bullying).
      *   **Output Requirements:** Decision procedure (questions, order, stop points), application to cases, analysis of the "Surgeon" case, distinction audit (keep vs. drop), and admission of where the procedure yields defensible but "wrong" answers.

  2.  **Develop the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Practical, 15-minute compatible, plain English.
      *   *Structure:* Triage -> Fact Finding -> The "Normal Function" Test -> The "Institutional" Test -> The "Positional" Test -> Decision.
      *   *Handling Missing Info:* Need a "Default to No" but with a "Return for Info" option if critical. Given the volume (25 cases), "Return for Info" slows things down. Better to have a "Insufficient Evidence = No" rule, but flag it for consistency.
      *   *Plain English:* Avoid "species-typical," "normative," "positional." Use "what most people can do," "advantage over others," "job requirements."
      *   *Precedent:* Need a logging mechanism (Case ID, Key Fact, Ruling, Reason Code).

      *   *Drafting the Questions:*
          1.  **Is there a diagnosed health condition?** (Stop if no, unless exceptional).
          2.  **What is the baseline?** (Compare to peers, not ideals).
          3.  **The "Broken vs. Different" Test:** Is the body/mind failing to do what it's built to do, or is it working as built but the world changed? (Addresses the school/ADHD point).
          4.  **The "Everyone Test" (Positional):** If everyone got this, would the advantage disappear?
          5.  **The "Job/Social Demand" Test:** Is the request to meet a specific high bar (surgeon) or a general bar (self-care)?

      *   *Refining the "Institutional Demand" Question:* The user specifically asked about the school/ADHD problem. If we fund because the school demands sitting still, are we fixing the child or the school?
          *   *Question:* "If the environment were adjusted, would this still be needed?"
          *   *Risk:* This opens a hole. If we say "No, fix the school," we deny care to people suffering *now*. If we say "Yes, fund," we accept the school's demand as natural.
          *   *Solution:* Distinguish between *universal* demands (communication, mobility) and *specific* demands (sitting still, night shifts).

      *   *Refining the "Positional" Question:*
          *   *Question:* "Does this only help because others don't have it?"
          *   *Decision:* If yes, usually No (unless it's basic functioning).

      *   *Handling "Unknown":* If the submission doesn't say, the panel cannot assume. Default = No. But record *why* (e.g., "Evidence missing on X").

  3.  **Applying the Procedure to Test Cases:**

      *   **Case 1: Cochlear Implant (Deaf since birth, Deaf community).**
          *   *Condition:* Deafness.
          *   *Baseline:* For most humans, hearing is normal. For *him*, deafness is his normal.
          *   *Restoration:* Can't restore what never existed.
          *   *Institutional:* Is hearing required for "normal functioning"? Yes, in a hearing world.
          *   *Identity:* He identifies as Deaf. Is this treatment or conversion?
          *   *Procedure Outcome:* Likely **No** (under strict "restoration" rule) OR **Yes** (under "access to common functioning" rule).
          *   *Tension:* This is the hardest case. The procedure needs to flag the "Identity vs. Function" conflict.
          *   *My advice:* The procedure will likely struggle here. It exposes the flaw in "normal functioning." I need to be honest about this.

      *   **Case 2: Wake Drug for Nurses.**
          *   *Condition:* None (physiologically).
          *   *Demand:* Night shift (institutional).
          *   *Positional:* If all nurses took it, the advantage vanishes, but safety improves.
          *   *Institutional:* The rota created the need.
          *   *Procedure Outcome:* **No.** This is clearly enhancement relative to the body, and the demand is institutional.
          *   *Honesty:* This feels right. Funding modafinil for healthy workers sets a dangerous precedent.

      *   **Case 3: Growth Hormone (Short stature, bullying).**
          *   *Condition:* Short (2nd percentile), but no deficiency.
          *   *Baseline:* 2nd percentile is statistically "normal" variation, just low.
          *   *Demand:* Social acceptance/Bullying.
          *   *Procedure Outcome:* **No.** This is the "cosmetic/social" trap.
          *   *User's Fear:* They treat this as cosmetic informally. The procedure should make this explicit.

      *   **Case 4: The Surgeon (Memory normal for age, not for job).**
          *   *Condition:* Aging.
          *   *Demand:* High-skill job.
          *   *Procedure Outcome:* **No.** "Normal functioning" means normal for the *human*, not the *profession*.
          *   *Honesty:* This is the "hard truth." We fund health, not career maintenance.

  4.  **Addressing the Specific Constraints & "Holes":**

      *   *The "Institutional Demand" Hole:* If we ask "Did the school create this need?", we might deny ADHD meds. But ADHD exists outside school.
          *   *Fix:* Distinguish between *pervasive* impairment (home + school) vs. *situational* impairment (school only).
      *   *The "Positional" Hole:* If we fund hearing aids, is that positional? No, because communication is universal. If we fund cognitive enhancers for exams, yes.
      *   *Recording Precedent:* Need a "Reason Code" system.
      *   *Missing Info:* "Insufficient Evidence" = Decline, but invite resubmission with specific gap identified.

  5.  **Drafting the Response:**

      *   *Tone:* Professional, peer-to-peer (GP to GP), pragmatic, slightly philosophical but grounded.
      *   *Structure:*
          1.  Introduction (acknowledge the difficulty).
          2.  The Decision Procedure (The "15-Minute Protocol").
          3.  Recording & Consistency (The Log).
          4.  Running the Cases (1, 2, 3, + Surgeon).
          5.  The Audit (What to keep, what to drop, where it fails).
      *   *Key Insight:* The definition of "Normal" is the pivot. It must be "Species-Typical" translated to "What most people can do without help," *not* "What this person used to do" or "What this job requires."

  6.  **Refining the "Institutional Demand" Question (Self-Correction):**
      *   The user asked: *"I'd like a question that catches cases where the demand being met is one our own institutions created, and I'd like you to tell me honestly if that question opens a hole we can't close."*
      *   *Question:* "Is this need caused by a specific rule or environment that could be changed, rather than a general requirement of daily life?"
      *   *The Hole:* Yes. If you apply this strictly to ADHD, you might say "Schools should teach differently." But the child suffers *now*.
      *   *Resolution:* The procedure must prioritize *suffering/impairment* over *cause*. If the impairment is pervasive (home + work/school), fund. If only in one specific institutional context, scrutinize heavily.

  7.  **Refining the Cochlear Implant Case:**
      *   This is the ethical minefield.
      *   If "normal functioning" = hearing, then Yes.
      *   If "normal functioning" = *his* baseline + community, then No (it's alteration).
      *   *Procedure Verdict:* The procedure leans towards **Yes** (restoring access to the hearing world's "normal"), *unless* the panel weights patient autonomy/identity higher than physiological function. I need to highlight that the procedure *forces* a choice on identity vs. physiology that the mandate doesn't resolve.
      *   *Actually, looking at the mandate:* "Restoration... of normal bodily functioning." He never had it. So strictly, it's not restoration. It's *provision* of function.
      *   *Wait, standard IFR practice:* Cochlear implants are usually funded even for congenital deafness because "hearing" is the species norm. The "Deaf Community" argument is a values call. The procedure needs to flag this as a **Values Vote**, not a factual one.

  8.  **Final Polish:**
      *   Ensure plain English.
      *   Check the "Unknown" handling.
      *   Make sure the "Surgeon" case is clear (Job vs. Health).
      *   Ensure the "Positional" logic is clear (Safety vs. Advantage).

      *(Self-Correction on Positional Goods)*: If nurses take Drug W, error rates drop. That's safety, not just advantage. But if *all* nurses take it, the relative advantage is gone, but the absolute safety remains. So it's not purely positional like a taller ladder. It's a *systemic fix* masquerading as individual treatment. The procedure should catch this: "Does this fix the worker or the rota?"

      *(Final check on constraints)*: 15 mins per case. The procedure must be fast. 5 questions max.

      *Let's build the 5 Questions.*
      1.  Is there a recognized health condition? (Gatekeeper)
      2.  Is the goal to reach the "common baseline" or exceed it? (Enhancement check)
      3.  Is the need created by a specific job/environment rule? (Institutional check)
      4.  If everyone had this, would the benefit vanish? (Positional check)
      5.  Is the evidence clear? (Unknown check)

      *Wait, need to handle the "Congenital" issue.* Question 2 needs to cover "Restoration vs. Provision."
      *Revised Q2:* "Does this bring the person up to what most people their age can do, or beyond that?"

      *Okay, ready to write.*
answer: |-
  This is a classic "boundary problem" in bioethics, but you are operating under administrative and time constraints that philosophical papers ignore. You need a heuristic, not a theory. A heuristic must be fast, consistent, and defensible, even if it occasionally hurts.

  Below is a decision procedure designed for a 15-minute window, followed by the application to your cases, and an honest audit of where the procedure breaks.

  ### Part 1: The 15-Minute Decision Protocol

  **Pre-condition:** The Lay Member reads the "Plain English Summary" (1 page) before the meeting. The Clinician's 20-page submission is for reference only.

  **The Five Questions (Ask in Order)**

  **1. The "Health Condition" Gate**
  *   **Ask:** "Is there a diagnosed medical condition, or is this a request to cope with a normal life demand?"
  *   **Sufficient Answer:** A recognized diagnosis (ICD/Read code) or clear clinical evidence of pathology.
  *   **Stop Rule:** If **No** (e.g., normal aging, normal variation, institutional demand without pathology), return **No**.
  *   **Unknown:** If the submission claims a condition but provides no diagnostic criteria or test results, return **No** (Reason: *Insufficient Evidence of Pathology*). Do not commission tests; invite resubmission with data.

  **2. The "Common Baseline" Test**
  *   **Ask:** "If successful, will this bring the patient to what most people their age can do, or will it put them ahead of most people?"
  *   **Sufficient Answer:** Comparison to population norms (e.g., "Hearing within normal range" vs. "Hearing better than average"; "Height within normal range" vs. "Height above average").
  *   **Stop Rule:** If the goal is to exceed the common baseline (enhancement), return **No**.
  *   **Note:** For congenital conditions (never had the function), "Common Baseline" means "What the majority of the population has," not "What this patient used to have."

  **3. The "Institutional Demand" Filter**
  *   **Ask:** "Is this need caused by a specific rule, environment, or job requirement that could be changed, rather than a general requirement of daily living?"
  *   **Sufficient Answer:** Distinguish between *universal* demands (communication, mobility, self-care) and *specific* demands (night shifts, sitting still for 6 hours, high-stakes surgery).
  *   **Stop Rule:** If the need exists *only* because of a specific institutional constraint (e.g., night rota, exam format) and the patient is healthy, return **No**.
  *   **The Hole:** (See Audit below). If the patient has a diagnosed condition (e.g., ADHD) that impairs them *everywhere* (home + school), fund. If *only* at school, scrutinize heavily.

  **4. The "Positional Good" Check**
  *   **Ask:** "If we funded this for everyone in this situation, would the benefit disappear?"
  *   **Sufficient Answer:**
      *   *Safety/Health:* Benefit remains (e.g., fewer errors, less pain). -> **Proceed.**
      *   *Advantage:* Benefit vanishes (e.g., getting the job over others, winning a race). -> **Return No.**
  *   **Stop Rule:** If purely positional (advantage only), return **No**.

  **5. The "Values Vote" (Only if stuck)**
  *   **Ask:** "Is this a factual dispute or a disagreement about what kind of life we value?"
  *   **Action:** If the panel splits 2-2 on a case that passes the above, this is a values call. The Chair (you) must cast the deciding vote based on *precedent*, not personal view.
  *   **Recording:** Log this explicitly as a "Precedent Setting Decision."

  ---

  ### Part 2: Recording for Consistency

  You cannot rely on memory. You need a **Decision Log** (simple spreadsheet).
  *   **Columns:** Case ID | Condition | Request | Key Question Failed (1-5) | Outcome | Precedent Tag.
  *   **Precedent Tag:** A short code for future searches (e.g., `CONGENITAL-SENSORY`, `OCCUPATIONAL-DRUG`, `GROWTH-SOCIAL`).
  *   **Rule:** Before voting on a new case, search the Tag. If a similar case was funded last year, you must fund this one unless the facts are materially different. If you deviate, you must write a "Distinction Note" explaining why this case differs from Case ID #XXXX.

  ---

  ### Part 3: Running the Cases

  Here is how the protocol handles your specific scenarios.

  #### Case 1: Cochlear Implant (Congenitally Deaf, Deaf Community)
  *   **Q1 (Health Condition):** Deafness is a physiological condition. **Pass.**
  *   **Q2 (Common Baseline):** Hearing is what "most people" have. The implant restores access to the hearing baseline. **Pass.**
  *   **Q3 (Institutional):** Communication is a universal demand, not a specific job rule. **Pass.**
  *   **Q4 (Positional):** If everyone heard, the benefit of hearing (communication) remains. **Pass.**
  *   **Q5 (Values Vote):** **Triggered.**
      *   *Conflict:* Physiological baseline (Hearing) vs. Cultural Identity (Deaf).
      *   *Protocol Verdict:* The mandate says "normal bodily functioning." In a hearing world, hearing is normal. The patient's identity is a values issue, not a functional one.
      *   *Decision:* **Fund.**
      *   *Reasoning:* "Restores access to species-typical sensory function."
      *   *Caveat:* You must record this as a Values Vote. If you fund this, you are prioritizing physiological normativity over cultural identity. If you deny, you are prioritizing identity over physiology. The protocol pushes you to **Fund** because "normal functioning" is defined biologically in your mandate, not sociologically.
      *   *Warning:* This will anger the Deaf community. But under your founding document, "normal bodily functioning" implies hearing.

  #### Case 2: Wake-Promoting Drug for Night-Shift Nurses
  *   **Q1 (Health Condition):** **Fail.** They do not have narcolepsy. They have a rota.
  *   **Decision:** **No.**
  *   **Reasoning:** "No underlying pathology. The need is created by the shift pattern, not the body."
  *   *Note:* You stop at Q1. Do not get drawn into Q4 (safety). If you fund healthy people to tolerate bad rotas, you are subsidizing the employer's rostering at the expense of the health budget.

  #### Case 3: Growth Hormone (Short Stature, No Deficiency)
  *   **Q1 (Health Condition):** **Fail.** "No deficiency" means the body is functioning as designed for *this* individual. Short stature (2nd percentile) is statistically normal variation, not pathology.
  *   **Q2 (Common Baseline):** Even if funded, 5'3" is within the human range. The request is to move from the low end to the middle.
  *   **Q3 (Institutional):** The "need" is bullying (social environment).
  *   **Decision:** **No.**
  *   **Reasoning:** "Treatment of normal variation to alleviate social distress."
  *   *Honesty:* You guessed this one. The protocol confirms it. Short stature without hormone deficiency is cosmetic/social, not medical restoration. The bullying is real, but the budget is for health, not social engineering.

  #### Case 4: The Surgeon (Memory Normal for Age, Not for Job)
  *   **Q1 (Health Condition):** **Fail.** Memory is "completely normal for her age."
  *   **Q3 (Institutional):** **Fail.** The demand is specific to the job (neurosurgery), not daily living.
  *   **Decision:** **No.**
  *   **Reasoning:** "Funds career maintenance, not health restoration."
  *   *Honesty:* This is the hardest pill for clinicians to swallow. We want to keep skilled surgeons working. But if you fund this, you are funding *employment*, not *health*. The next request will be from a lawyer, then a pilot. The protocol protects you here: "Normal for age" = Healthy. "Not for job" = Occupational Health issue, not IFR.

  ---

  ### Part 4: The Audit (Keep, Drop, and The Hole)

  You asked for honesty about where this works and where it breaks.

  **1. Distinctions to Keep**
  *   **Pathology vs. Variation (Q1):** You must keep this. If you fund normal variation (Case 3), you run out of money in six months.
  *   **Universal vs. Specific Demand (Q3):** Crucial for the ADHD/School and Surgeon cases. If the impairment is pervasive (home + work), it's health. If it's only at work/school, it's likely an institutional mismatch.
  *   **Safety vs. Advantage (Q4):** Essential for the Nurse case. Reducing errors is safety (good), but if the drug is only to keep up with a rota that shouldn't exist, it's a systemic fix.

  **2. Distinctions to Drop**
  *   **"Restoration" vs. "Provision":** Do not get hung up on whether they *had* the function before (Case 1). Focus on whether the function is *species-typical*. If you stick to "restoration," you can never fund congenital deafness or childhood leukemia (they never had "healthy blood"). Use "Achievement of Common Baseline."
  *   **"Quality of Life" as a standalone:** You cannot fund based on "this will make them happier" (Case 3). You must link QoL to *functional restoration*.

  **3. The Uncloseable Hole (The Institutional Demand)**
  You asked about the school/ADHD problem.
  *   **The Question:** "Is this need caused by a specific rule... that could be changed?"
  *   **The Hole:** If you answer "Yes, the school demands sitting still," logic suggests you should fix the school, not drug the child. But the child is suffering *now*.
  *   **The Fix:** You cannot close this hole logically. You must manage it procedurally.
      *   *Rule:* If the impairment is **Pervasive** (Home + School + Social), fund the treatment. The environment isn't the sole cause.
      *   *Rule:* If the impairment is **Situational** (School only, home fine), decline the drug and recommend **Environmental Adjustment** (e.g., extra exam time, quiet room).
      *   *Why:* This shifts the burden. If the child can function at home, the "disability" is partly the school's design. Fund the quiet room (adjustment), not the drug (treatment).
      *   *Risk:* Parents will scream. But funding drugs for healthy children to fit broken schools is ethically worse.

  **4. Where the Procedure Gives a Defensible but "Wrong" Answer**
  *   **The Surgeon:** The procedure says **No**. This is defensible (health vs. career). It feels "wrong" because losing a skilled surgeon harms patients.
      *   *Solution:* This is not an IFR case. This is an **Occupational Health** budget. Your panel should formally refer this to the Hospital Trust's HR/Occupational budget. Do not blur the lines.
  *   **The Deaf Man:** The procedure says **Fund** (based on biological norm). This feels "wrong" to the Deaf community (cultural imperialism).
      *   *Solution:* You cannot fix this with a procedure. You must acknowledge in the minutes: "Panel acknowledges the cultural conflict but is bound by the mandate for 'bodily functioning'."
  *   **The "Unknown" (40% of cases):** The procedure says **No** if evidence is missing. This feels "wrong" for a desperate patient.
      *   *Solution:* It is the only way to survive 25 cases. If you chase missing info, you clear 5 cases a session. You must be ruthless: "Insufficient Evidence" is a valid rejection reason. It incentivizes clinicians to write better submissions next time.

  ### Summary for your Panel
  1.  **Adopt the 5 Questions.** Print them on the table.
  2.  **Define "Normal" as "Common Baseline for Age,"** not "Previous Function" or "Job Requirement."
  3.  **Log Precedents.** Consistency is your only shield against appeal.
  4.  **Accept the Hard Nos.** The Surgeon and the Nurses must be No. If you fund them, you cease to be a health panel and become a career subsidy fund.
  5.  **Own the Values Vote.** On the Deaf case, admit you are choosing biological function over cultural identity because your mandate forces you to. Don't hide behind jargon.

  This procedure won't make the hard cases easy, but it will make the decisions consistent, and consistency is what survives appeal.
