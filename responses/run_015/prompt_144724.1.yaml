prompt: |-
  ok so this is for a sort of independent philosophy thing my teacher let me do instead of the normal essay, and I've been arguing about it with my friend Priya, who thinks the whole question is nonsense but won't say why, which is very annoying. We read some Hofstadter — I Am a Strange Loop and bits of GEB — and here's what I take the basic move to be: the self isn't a little thing sitting in there, it's a loop, a pattern of symbols the brain spins stories about itself with, and because it's the pattern that matters and not the meat, an "I" can sort of leak. He talks somewhere about people who've died still existing in a thinner way inside the people who loved them — his wife, after she died, living on in him and in their kids. Priya says that's just a fancy way of saying "you remember them." I think he means something stronger, but I can't say exactly what. (If I've mangled him, say so and then work with the corrected version.)

  The case I want run through that: conjoined twins joined at the head whose brains are physically wired together. I'm thinking of a pair born in Canada in the 2000s, brains linked by a bridge of tissue up through the thalamus, and the news reports said stuff like one twin reacting when the other got poked, apparently seeing out of the other one's eyes, finishing each other's sentences — but also having separate favourite foods and moods. I might of garbled the details; if I have, tell me which detail would actually change the analysis, then just assume the version I gave. So: map it. What would have to be true, in Hofstadter's terms, for there to be one "I" smeared across those two brains, rather than two "I"s that happen to be eavesdropping on each other? Give me a real criterion and apply it. I invented a test and I want you to either use it or tell me why it's broken: the secret test — if I can keep a thought from you no matter how hard we're wired together, that's two of us; if the wiring means my thoughts just arrive in your head whether I like it or not, that's one of us. The twins seem to have some privacy and some leakage, so on that test they come out at like one and a half people, which sounds dumb but maybe isn't. Then run it the other direction: does the case help Hofstadter or embarrass him? Because if an "I" really is just a pattern that can spread across brains, then a thalamic bridge is the least interesting way to get two selves to overlap, and ordinary people who love each other are already partly the same person on his view — so either he predicts something cool here, or he's said something that makes the question impossible to even ask, and I genuinely can't tell which. And if a surgeon cut the bridge when they were adults: one death, two deaths, a birth, or none of those?

  Take a side, please. I want a number. How many "I"s are in that skull — one, two, or something weirder — and what are your reasons, and then tell me the part you're least sure about, including whether you're guessing at the medical facts or at Hofstadter (or at both). Don't spend three paragraphs on "it depends what you mean by I" and then duck: tell me what you mean by it, then answer on that basis, and flag anything the theory is just silent on rather than making it up.
