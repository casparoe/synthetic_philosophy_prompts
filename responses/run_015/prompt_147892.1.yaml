answer: |-
  The tension you identify lies at the heart of contemporary archaeological theory: the conflict between **resilience thinking** (which views change as cyclical and adaptive) and **complexity theory** (which acknowledges that certain thresholds, once crossed, represent a net loss of systemic capacity).

  To answer your question directly: The distinction between "collapse" and "transformation" is not *merely* a value-laden preference for centralized complexity, though elite bias certainly inflates the drama of the narrative. There is an **objective feature** that distinguishes the Late Bronze Age (LBA) event from a standard adaptive release: **the irreversible loss of emergent properties and informational fidelity.**

  Here is an analysis of why the Late Bronze Age shift occupies a distinct category from the Maya or Rapa Nui examples, based on systemic thresholds rather than moral judgment.

  ### 1. The System Boundary Problem
  The first step in resolving the paradox is defining the "system." Resilience theory requires a clear boundary to measure cycles.
  *   **If the system is "human population in the Levant/Greece":** Then it is **transformation**. Demographics persisted, agriculture continued, and material culture evolved.
  *   **If the system is "The Palatial International Network":** Then it is **collapse**. The specific mechanism that coordinated labor, standardized weights, managed surplus across ecological zones, and externalized memory (writing) ceased to function.

  The objective distinction lies in **emergent properties**. A networked civilization possesses capabilities that isolated villages do not: risk pooling across drought zones, high-level craft specialization, and large-scale infrastructure maintenance. When the LBA network dissolved, those emergent properties vanished. A society that cannot coordinate beyond the village level is objectively less capable of specific tasks (e.g., building aqueducts, maintaining standing armies, long-distance diplomacy) than one that can. This is not a value judgment on quality of life, but a measurement of **cooperative scale**.

  ### 2. Informational Fidelity and "Dark Ages"
  You note that writing disappeared. In resilience terms, this is not just a change in state; it is a reduction in **informational bandwidth**.
  *   **Maya Case:** While the Classic political structure fragmented, Maya literacy and calendrical systems persisted into the Post-Classic period. The *informational technology* survived the political release.
  *   **LBA Case:** In the Aegean (Greek Dark Ages) and parts of Anatolia, literacy vanished entirely for centuries. Linear B and Cuneiform were not just administrative tools; they were externalized memory.

  The objective feature here is **path dependence**. A standard "release" phase ($\Omega$ in the adaptive cycle) implies a accumulation of potential for the next "reorganization" ($\alpha$). However, the loss of literacy represents a loss of *accumulated potential*. The system did not just reorganize; it forgot how to operate its previous complexity. Re-inventing literacy (the Greek alphabet) required new inputs (Phoenician contact) and centuries of time. This suggests a **tipping point** was crossed where the system fell into a lower-energy equilibrium basin, distinct from a cyclical fluctuation.

  ### 3. Specialization vs. Redundancy
  Resilience theory often champions redundancy (many small units) over efficiency (centralized optimization). The LBA shift fits this: the collapse of palaces reduced efficiency but potentially increased local redundancy.
  *   **The Argument for Transformation:** The palatial system was fragile (low resilience). Its failure allowed for more resilient, decentralized Iron Age societies.
  *   **The Argument for Collapse:** The specialization required for Bronze Age metallurgy (tin from Afghanistan, copper from Cyprus) is a **fragile dependency**. When the network broke, the *capacity* to produce bronze collapsed. Societies were forced into technological regression (iron is more common but harder to work initially without specialized knowledge).

  The objective metric here is **energy capture and technological capacity**. If a society loses the ability to access distant resources necessary for its dominant technology, it undergoes a material contraction. Bioarchaeological data often shows a decline in health markers (height, dental health) during these "dark ages," suggesting that while the *political* system may have been oppressive, the *economic* system provided a caloric buffer that the decentralized system lacked.

  ### 4. Why "Collapse" is Still a Useful Category
  If we discard the term "collapse" entirely in favor of "transformation," we risk losing the ability to describe **net losses in complexity**.
  *   **Transformation** implies continuity of function.
  *   **Collapse** implies the termination of a specific function.

  The LBA was a collapse of **interregional interdependence**. This is objectively different from the Maya shift because the Maya maintained a cultural and economic sphere of interaction, whereas the LBA Mediterranean sphere fragmented into isolated micro-regions. The loss of long-distance trade isn't just "less stuff moving"; it is the loss of the **mechanism for buffering local ecological failure**. When trade networks vanish, a local drought becomes a famine. When trade networks exist, a local drought becomes a market opportunity. The loss of that buffering mechanism is an objective reduction in systemic resilience to specific stressors.

  ### Conclusion: Thresholds, Not Values
  Is the distinction value-laden? **Partially.** Historians have traditionally equated "civilization" with "monuments and texts," which privileges the elite experience. A peasant in 1100 BCE Greece may have been happier without a Mycenaean *wanax* taxing their grain.

  However, is there an objective feature? **Yes.**
  The Late Bronze Age event represents a **phase shift in cooperative complexity**. It was not merely a reorganization of the same system; it was the dissolution of a system whose defining characteristic was *supra-regional integration*.

  When a system loses the capacity to process information (writing), the capacity to coordinate labor beyond the kin-group (palaces), and the capacity to buffer risk through exchange (trade), it has crossed a threshold into a lower-complexity basin. Calling this "collapse" is not a moral condemnation of the people who survived; it is a technical description of the **dissolution of the network's emergent properties.** The Maya and Rapa Nui examples involve political restructuring within a continuing cultural-technological framework; the LBA involved the temporary extinction of the technological-cultural framework itself in key regions. That is an objective systemic breakdown, distinct from adaptive release.
