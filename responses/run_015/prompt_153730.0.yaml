answer: |-
  The break in your colleague's argument occurs at the inference from **(3) to (4)**. While premise (3) correctly identifies that institutional selection pressure is weak (due to inertia, lock-in, etc.), it does not logically entail premise (4), which claims survival is *no* evidence of fitness. This is an **invalid inference**: "nearly nil" selection pressure is not equivalent to "zero" evidentiary value. Survival over long periods signals *robustness* or *stability* even if it does not signal optimal *fitness* or moral *wisdom*. A fence that survives a century has proven it is not easily knocked down, which is relevant data for a policy maker, even if the fence was originally built for the wrong reason.

  This diagnosis addresses your two specific pricing questions. First, the **deletion asymmetry** in (6) does not deliver Burkean conservatism; it delivers only a instrumental precaution akin to the precautionary principle or real options theory. Burkeanism requires a positive epistemic claim about tradition (that it contains latent wisdom), whereas (6) offers only a negative decision-theoretic claim (that destruction is risky). If (6) is all the conservative has left, they have surrendered the doctrine of inherited wisdom for a doctrine of risk management.

  Second, the move from **(2) through (3) to (4)** is indeed doing unwarranted work. It conflates "tested for optimality" with "tested for survivability." By rejecting the leap to (4), you preserve a sliver of the Burkean claim: survival is *weak* evidence of functional robustness, even if not of moral fitness. If you choose to keep (3) (inertia explains persistence) rather than relying on (6) (deletion asymmetry) as your primary defense, the cost is that you must abandon the mystical "wisdom of ancestors" claim. You retain a pragmatic conservatism based on empirical robustness and irreversible risk, but you lose the epistemic authority that Burke claimed for tradition. The reformer, conversely, loses the license to treat tradition as mere noise; it must be treated as weak signal.

