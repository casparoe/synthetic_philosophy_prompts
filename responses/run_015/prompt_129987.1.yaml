      *   *(9) Untranslatable Corpus:* Fine in principle, no instance available, nothing new required. (Generalization/Blind ascription extended).

      *   *Synthesis of Commitments:* The supervisor is a **Global Deflationist**. She treats "true" as a logical device (for generalization and anaphora) rather than a robust property. Crucially, she denies *explanatory power* to truth itself (Case 6). She allows "true" to apply wherever there is declarative content (Case 8), even if we can't access the content (Case 9).

