      *   **Goal:** Predict the verdict on Case 10, identify the consistent underlying principle(s) among Cases 1-9, evaluate consistency with Case 6 (explanatory use), and propose a decisive test case.
      *   **Constraint:** Keep it at the level of principles and predictions (no need for reading lists).

  2.  **Analyze the Supervisor's Nine Rulings:**
      *   *(1) Ordinary Instances:* Equivalence schema ($T(p) \leftrightarrow p$) is sufficient. No property beyond instances. (Classic Disquotationalism/Minimalism).
