              *   *Supervisor (Deflationist):* If "says that P" is indeterminate, the equivalence schema cannot be applied. Therefore, "is true" is equally indeterminate. There is no hidden truth fact beyond the meaning facts.
              *   *Disquotationalist:* Cannot disquote if meaning is fixed.
              *   *Prosententialist:* No antecedent to latch onto.
          *   *Refinement:* Let's look at the prompt's suggestions: "untranslatable corpus, an indeterminate translation, a world-varying counterfactual... or something else."
          *   *Selection:* **Indeterminate Translation.** It tests whether "true" floats free of "says that." If the supervisor is consistent with Case 6 (content does the work), then if content is indeterminate, truth must be too. If she says "It's still either true or false, we just don't know," she's smuggling in substantivism (Case 6 violation).

