answer: |-
  Hi there. No worries about the typos — writing philosophy on a phone in a pub back room is practically a rite of passage. It sounds like a brilliant seminar setup, even if the notifications are playing up.

  Here is a menu of the five precise claims underlying 'it's the thought that counts', drafted for your group chat. I've assessed each on whether it's a platitude or a substantive thesis, whether it actually blocks the consequentialist reading (does it do the work your friends need?), and how it handles the 'right vs. excused' distinction.

  ***

  ### 1. The Strong Constitutive Claim
  *   **The Claim:** An act's moral status is *constituted* entirely by the intention behind it; consequences are morally inert and irrelevant even as a tie-breaker.
  *   **Status:** **Substantive Thesis.** (This is a robust deontological or virtue-ethical position, not a platitude.)
  *   **Does it rule out consequentialism?** **Yes.** If outcomes play no role in determining rightness, it cannot be consequentialism.
  *   **Right or Excused?** **Right.** On this view, a compassionate lie to save a life is positively *right* (or *kusala*/skilful) solely because the motive is compassionate, even if the victim is found anyway and killed. The bad outcome doesn't make the act a failure.
  *   **Verdict:** This does the work your friends want, but it's a hard sell in Buddhism, which is obsessed with the cessation of suffering (an outcome).

  ### 2. The Epistemicised Claim
  *   **The Claim:** Consequences are what matter, but agents are only responsible for what they can foresee; therefore, we judge the intention because it proxies for expected utility.
  *   **Status:** **Platitude (for sophisticated consequentialists).** Most modern consequentialists accept 'expected utility' over 'actual utility' for moral deliberation.
  *   **Does it rule out consequentialism?** **No.** This *is* a form of consequentialism (Expected Utility Consequentialism). It concedes your point that the deliberation is cost-benefit reasoning, just limited by human knowledge.
  *   **Right or Excused?** **Right.** If the agent reasonably expected the lie to save a life, the act is right, even if it fails. The agent isn't merely excused; they acted correctly given the information.
  *   **Verdict:** This won't help your friends. It validates your reading of the bodhisattva case as cost-benefit reasoning.

  ### 3. The Causal/Mechanistic Claim
  *   **The Claim:** Intention is the load-bearing node because karma is a causal law of character development; motives propagate into future habits and rebirth, whereas external outcomes are often luck-dependent.
  *   **Status:** **Substantive Thesis.** (This aligns closely with traditional karma theory.)
  *   **Does it rule out consequentialism?** **Yes, mostly.** It shifts the locus of evaluation from 'state of the world' to 'state of the agent'. It blocks *act*-consequentialism, though it might allow for a kind of long-term *rule*-consequentialism about character.
  *   **Right or Excused?** **Right (for the agent).** The act is 'skilful' (*kusala*) for the moral agent's spiritual trajectory, regardless of the external outcome. However, it leaves open whether the act was 'good' for the victim.
  *   **Verdict:** This is the strongest candidate for what your friends *should* mean. It blocks your reading by changing the metric from 'lives saved' to 'karmic seeds planted'.

  ### 4. The Axiological Claim
  *   **The Claim:** Only conscious states (suffering and its easing) have intrinsic value; material outcomes matter only insofar as they are felt.
  *   **Status:** **Plausible Interpretation.** (This fits the First Noble Truth well.)
  *   **Does it rule out consequentialism?** **No.** In fact, this is the axiological foundation *of* consequentialism. If the goal is maximising good conscious states, that is consequentialist by definition.
  *   **Right or Excused?** **Depends.** The act is right only if it actually reduces suffering. A good intention that fails to reduce suffering is, at best, excused, but the act itself is a failure to achieve the good.
  *   **Verdict:** This undermines your friends' position. If this is their claim, you win the argument.

  ### 5. The Two-Level Claim
  *   **The Claim:** The *criterion* for rightness is intention-based (follow the precept/motive), but the *justification* for having that criterion is consequentialist (it produces the best outcomes overall).
  *   **Status:** **Substantive Thesis.** (This is Indirect or Rule Consequentialism.)
  *   **Does it rule out consequentialism?** **No.** It rules out *direct* act-consequentialism, but admits the system is consequentialist at the foundational level.
  *   **Right or Excused?** **Right (by rule), Excused (by outcome).** The act is right because it followed the intention-based rule, but if the outcome is disastrous, the rule itself might be questioned. In the bodhisattva case, the 'rule' might be 'save lives', making the lie right.
  *   **Verdict:** This doesn't fully rule out consequentialism, but it explains why the deliberation doesn't *look* like a spreadsheet calculation in the moment.

  ***

  ### Summary for the Chat

  **On 'Right vs. Excused':**
  Only readings **(1)** and **(3)** allow a clean motive with a bad outcome to be positively **right** (or *kusala*). Readings **(2)**, **(4)**, and **(5)** tend to treat a bad outcome as a failure of the act, even if the agent is **excused** from blame. If your friends think the bodhisattva's lie is *good* even if it fails to save the victim, they are committed to (1) or (3).

  **On What They Probably Meant:**
  They are likely oscillating between **(1)** and **(3)**. They want the strong anti-consequentialist punch of **(1)**, but **(3)** is the only one that makes sense within the mechanics of karma. The problem is that **(3)** doesn't fully explain why the bodhisattva should lie to save *another* person (an outcome) rather than just protecting their own mind (an intention).

  **Does the slogan settle it?**
  No. 'Intention matters' is compatible with consequentialism (see claim 2). To shut down your reading, they need to commit to claim **(1)** or **(3)** specifically: that the moral quality of the act is independent of the welfare of the victim. If they admit the victim's welfare matters, they are back in consequentialist territory.

  Hope this helps settle the round!
