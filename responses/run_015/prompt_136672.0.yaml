answer: |-
  Your hypothesis is remarkably close to the cutting edge of the debate, despite your lack of formal training. You have correctly identified that the stalemate is not a single argument but a conflation of two distinct layers: one concerning the **dynamical role** of spacetime (the empirical/structural question) and one concerning the **ontological status** of spacetime points (the metaphysical/representational question).

  However, I will argue that your diagnosis requires one crucial refinement. The disagreement is not merely about "notation" or "representation" in a deflationary sense. It is about **modality**—specifically, about how we count possible worlds. The stalemate persists because both sides have retreated to positions that are empirically equivalent but modally distinct, and the field lacks a consensus on whether modal differences matter if they never cash out in observation.

  Here is the diagnosis of the stalemate, structured around your hypothesis.

  ### 1. The Empirical Question: Mostly Settled (Against Relationism)
  You asked whether inertial structure can be recovered from relations among bodies. In the context of General Relativity (GR), the answer is effectively "no," which should have ended the empirical dispute.

  *   **The Substantivalist Claim:** GR admits "vacuum solutions" (e.g., gravitational waves, black holes) where the curvature tensor is non-zero but the matter tensor is zero. There is geometry without matter.
  *   **The Relationist Reply:** Historically, the relationist (following Mach) argued that inertia is determined by the distribution of all mass in the universe.
  *   **The Stalemate Breaker:** In GR, spacetime geometry is a dynamical field ($g_{\mu\nu}$) that carries energy and momentum itself. It can exist and propagate without material sources. If you treat the metric field as "matter," you save relationism but trivialize it (everything is matter). If you treat it as "space," you vindicate substantivalism.

  **Diagnosis:** On the *empirical/structural* layer, strict Machian relationism lost when GR was accepted. The "extra ingredient" you mentioned is the metric field. Most physicists treat the metric field as a real physical object. If your reading group is still debating whether rotation needs "space" or "matter" to be defined, you are debating 19th-century physics. In GR, rotation is defined relative to the local metric field, which is a real entity distinct from ordinary matter.

  ### 2. The Representational Question: The Hole Argument and Identity
  This is where your "array vs. graph" analogy is powerful, but where the stakes are higher than notation.

  *   **The Substantivalist Intuition:** Spacetime points are like memory addresses. They have identity independent of what is stored in them.
  *   **The Relationist Intuition:** Spacetime points are like nodes in a graph defined only by their edges (relations). No edges, no node.
  *   **The Hole Argument:** If points have independent identity (substantivalism), I can take a region of spacetime (the "hole"), permute the points inside it, and drag the fields along. Mathematically, this produces a distinct model. Physically, everything observable is identical.
      *   **Option A:** Accept these are distinct physical possibilities. This implies **indeterminism**: the state outside the hole does not determine the state inside, even though all laws are satisfied.
      *   **Option B:** Deny these are distinct possibilities. This implies spacetime points do not have independent identity (haecceity).

  **Diagnosis:** The stalemate here is that "Sophisticated Substantivalists" have adopted Option B. They say, "Spacetime is real, but points don't have primitive identity." This looks suspiciously like Relationism. The Relationist says, "Points are just nodes in a relational structure." The Sophisticated Substantivalist says, "The manifold is real, but we quotient out diffeomorphisms."
  **They agree on the math.** They agree on the predictions. They disagree on whether the manifold *itself* is a substance or merely the scaffolding for the fields. This confirms your suspicion that this layer is representational, but it is a representation with metaphysical consequences.

  ### 3. The Hidden Weight: Modality, Not Notation
  You suggested the representational dispute might be a "notational choice." I argue it is deeper: it is a disagreement about **counterfactuals**.

  In distributed systems, you might ask: "Is this state distinct from that state?" If the observable output is identical, does the internal state matter?
  *   **The Substantivalist** says: "Yes. If I had shifted the entire universe 5 meters to the left, that would be a different possible world, even if no observer could tell." They commit to **Haecceitism** (this-ness of points).
  *   **The Relationist** says: "No. A shift that changes no relations is no shift at all. It is the same world."

  **Why this causes a stalemate:** Physics is generally in the business of predicting observations. Modal claims about "possible worlds that look identical" are untestable. Therefore, the dispute cannot be resolved by experiment. It can only be resolved by a philosophical decision about whether our ontology should track distinguishability or underlying structure.

  Your "single rotating body in an empty universe" test is the correct intuition pump here.
  *   **Substantivalist:** "The bucket rotates relative to the spacetime metric. The metric exists. Fact of the matter: Yes."
  *   **Relationist:** "Without other matter, 'rotation' has no meaning. Fact of the matter: No."
  *   **The Catch:** In GR, a single body *creates* a metric (Schwarzschild solution). So the universe isn't empty of *fields*. If you strip the field away, you have no theory.
  *   **The Real Test:** Ask them: "If we have two mathematical models that are diffeomorphic (identical observations), are they the same physical world?"
      *   If they say **Yes**, they are effectively Relationists (or Structural Realists).
      *   If they say **No**, they are Naive Substantivalists (and must accept indeterminism).
      *   **Most people say Yes.** This is why you are stuck. Everyone has converged on the same mathematical practice, but they use different words to justify it.

  ### 4. What Counts as Progress?
  Given this diagnosis, progress will not come from a better argument for Newton or Mach. It will come from one of three shifts:

  1.  **Formal Distinction (Structural Realism):** The field moves toward "Ontic Structural Realism." This view says: "Stop asking if points exist. Only the structure (the invariant relations) is real." This dissolves the dispute by rejecting the premise that there must be a "substance" bearing the relations. This is the current dominant trend in philosophy of physics.
  2.  **Successor Theory (Quantum Gravity):** If a theory of Quantum Gravity (e.g., Loop Quantum Gravity, String Theory) shows that spacetime is **emergent**, the debate dissolves. If spacetime points are not fundamental (like pixels on a screen emerging from code), then asking if they are "substances" or "relations" is a category error. The fundamental layer might be a spin network or a matrix model where "distance" is derived, not primitive.
  3.  **Methodological Shift:** A consensus that metaphysical questions unconnected to empirical variance are pseudo-problems. This would declare the dispute "verbal" and close the file.

  ### 5. Explicit Extrapolation
  I am now extrapolating beyond broad consensus.
  *   **Consensus:** GR favors substantivalism dynamically; Hole Argument favors relationism ontologically. Structural Realism is a popular middle ground.
  *   **Extrapolation:** I claim the dispute is **pathological**. It persists only because philosophers of physics treat classical metaphysics (substance vs. attribute) as applicable to relativistic field theory. In a field theory, the "field" is the substance. The "manifold" is just the domain. The debate is an artifact of trying to force a container/content ontology onto a system where the container is dynamical. I predict the dispute will vanish not because one side wins, but because the next generation of physicists will view the "substantivalist" vocabulary as archaic, like debating whether "phlogiston" is a substance or a relation.

  ### 6. What Would Change My Mind?
  To hold myself accountable, here is what would falsify my diagnosis:

  1.  **Empirical Divergence:** If a relationist formulation of gravity (e.g., Shape Dynamics) produces a testable prediction that differs from standard GR, and that prediction is confirmed. This would revive the empirical layer of the dispute. (Currently, Shape Dynamics is empirically equivalent to GR in many domains, but not all).
  2.  **Resolution of the Hole Argument:** If a rigorous proof demonstrates that "Sophisticated Substantivalism" is logically incoherent (i.e., you cannot have a real manifold without point identity), then the metaphysical layer would force a choice between indeterminism or relationism.
  3.  **Fundamental Discreteness:** If spacetime is proven to be fundamentally discrete (atoms of space), the "point identity" problem changes. If the atoms are individuated by their connectivity (graph theory), relationism wins. If they are individuated by primitive labels, substantivalism wins. A discovery here would make the "notation" argument empirical.

  ### Summary for Your Group
  Your hypothesis is correct: the dispute is split.
  1.  **Dynamical Layer:** Settled by GR. Spacetime geometry is a real physical field, not just a bookkeeping device for matter relations. (Point for Substantivalism).
  2.  **Ontological Layer:** Stalemated by the Hole Argument. We cannot assign independent identity to points without breaking determinism. (Point for Relationism/Structuralism).

  **The Verdict on the Stalemate:** You are stuck because you are arguing about **identity conditions for unobservables**. You are asking, "Do the memory addresses exist, or just the data?" In classical computing, the addresses exist. In quantum computing, the distinction blurs. In spacetime physics, we are in a transitional phase.

  **Recommendation:** Stop asking "Who is right?" Start asking "Which ontology makes quantization easier?" If you treat spacetime points as real individuals, you run into problems quantizing gravity (non-renormalizability, problem of time). If you treat them as relational structures, you get different problems (recovery of continuum). The dispute is no longer about truth; it is about **heuristic utility** for the next theory.

  If your group accepts that the debate is now about **utility for Quantum Gravity** rather than **truth about Classical Spacetime**, the stalemate breaks. You aren't looking for a verdict on Newton; you are looking for the right data structure for the next kernel.
