          *   Survivor 2: **The Veto Rule** (from P4). Control requires the operator to prevent *unacceptable* actions, but need not select the specific acceptable one. Approval is a constraint, not an objective.

      *   *Drafting - Stage 3 (Recommendation):*
          *   The new proposal fits the Veto Rule. It treats approval as a safety constraint, not the goal.
