answer: |-
  (a) **Exam Question**

  **Final Examination: Moral Status**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Value:** 20 Marks

  **Question 1**

  Suppose a future neuroscience produces a reliable, interpersonally comparable scalar measure of a creature's capacity for valenced experience at a time, the Sentience Index ($S$). Its reliability is to be granted outright; epistemic uncertainty regarding measurement is not a valid topic for discussion. Assume $S$ reads 1.0 for a typical adult human, roughly 0.02 for a honeybee, and exactly 0 for a domestic thermostat.

  Write an essay that addresses the following four requirements:

  1.  **The Mapping Function:** State what function maps $S$ onto moral status. Defend the shape of this function: is any threshold defensible, given that small differences in $S$ seem not to permit large differences in status, or does that continuity demand itself collapse under a sorites-style argument?
  2.  **Multidimensionality:** Notice that $S$ is one number while the thing we care about does not look like one number: intensity, duration, temporal depth (whether the creature remembers and anticipates), and the unity or fragmentation of its experience can all come apart. Explain how the moral question is not well-posed until one specifies what is being decided (e.g., inflicting pain vs. killing vs. replacing).
  3.  **The Thermostat Condition:** Give the further condition that excludes the thermostat (a subject, a point of view, something it matters to, valence that is intrinsic rather than merely informational), and then face the awkward consequence that this condition looks all-or-nothing, so that gradualism about sentience appears to smuggle a cliff back in at the bottom.
  4.  **Aggregation:** Say whether, on your own account, very many low-$S$ creatures can sum to outweigh one high-$S$ creature, and explain why that is or is not a separate question from the one about degrees.

  ***

  (b) **Model Answer**

  The Sentience Index ($S$) offers a seductive simplification of moral status, but it conflates the *capacity* for experience with the *moral weight* of that experience. To map $S$ onto status, I propose a continuous, non-linear function where moral weight increases with $S$ but exhibits diminishing marginal returns. A threshold view is untenable because it violates the principle of relevant similarity: a creature with $S=0.51$ cannot possess radically more rights than one with $S=0.49$ without arbitrary stipulation. However, continuity invites a sorites paradox. If we remove status grain-by-grain, we eventually reach the thermostat. To avoid this without a threshold, we must accept that moral status fades into insignificance rather than vanishing at a specific point. The "collapse" is not logical but practical; below a certain $S$, the status is too negligible to constrain action, though not theoretically zero.

  However, $S$ measures capacity at a time, whereas moral status often concerns the disruption of a life. This reveals the multidimensionality problem. $S$ might measure the intensity of pain, but it does not measure temporal depth. Inflicting pain on a honeybee ($S=0.02$) is weighed primarily by the intensity of that sensation. Killing a human ($S=1.0$), however, involves the frustration of future-oriented desires and the loss of a unified narrative self. Therefore, the mapping function cannot be universal; it must be context-sensitive. For pain infliction, $S$ is the primary variable. For killing, $S$ must be weighted by psychological continuity. A being with high $S$ but no temporal depth (a hypothetical pain-intense amnesiac) might have high status regarding torture but lower status regarding killing than a being with moderate $S$ and high temporal depth. $S$ alone is insufficient; it must be integrated with a metric of psychological unity.

  This integration highlights the thermostat problem. We exclude the thermostat ($S=0$) not because it lacks intensity, but because it lacks a "subject." There is nothing it is *like* to be a thermostat; its states are informational, not intrinsically valenced. This subjecthood condition appears binary: either there is a point of view or there is not. This creates a cliff at the bottom of the scale. Even if sentience is gradual, *subjecthood* may be all-or-nothing. This undermines the pure gradualist project. We are forced to admit a hybrid view: a binary condition for entry into the moral community (subjecthood), followed by a gradual scale of status within that community. The "cliff" is not in sentience, but in the metaphysical precondition for sentience counting morally.

  Finally, regarding aggregation: can many low-$S$ creatures outweigh one high-$S$ creature? If moral status is purely about the sum of valenced experience (classical utilitarianism), then yes; sufficient bees outweigh one human. However, if status protects the integrity of the subject (a rights-based view), aggregation is blocked. I argue aggregation is permissible for pain infliction but blocked for killing. This demonstrates that aggregation is a separate question from degrees. One can accept that humans have higher status (degrees) due to temporal depth, yet still deny that enough bees can be killed to save one human (non-aggregation). The degree question concerns the weight of an individual's interests; the aggregation question concerns the structural relationship between distinct individuals' interests. Conflating them leads to the error of assuming that because humans matter *more*, they matter *infinitely more*, or conversely, that because bees matter *less*, their interests are merely additive fractions. The $S$ index clarifies the degrees but leaves the aggregation structure entirely open.

  ***

  (c) **Marking Scheme (20 Marks)**

  **1. The Mapping Function & Sorites (4 Marks)**
  *   **Requirement:** Proposes a function (linear, non-linear, threshold) and addresses the sorites tension (continuity vs. vanishing status).
  *   **Common Error:** Asserting a threshold without defending it against the "marginal difference" objection, or ignoring the sorites problem entirely.

  **2. Multidimensionality & Context (4 Marks)**
  *   **Requirement:** Distinguishes $S$ (capacity) from other metrics (temporal depth, unity) and notes that moral weight changes based on the act (killing vs. hurting).
  *   **Common Error:** Treating $S$ as a universal proxy for all moral decisions, ignoring that killing impacts future-oriented beings differently than momentary beings.

  **3. The Thermostat & The Cliff (4 Marks)**
  *   **Requirement:** Identifies a binary subjecthood condition (intrinsic valence/point of view) and acknowledges this reintroduces a "cliff" despite gradual $S$.
  *   **Common Error:** Claiming the thermostat differs only in degree ($S=0$ vs $S=0.0001$) rather than kind, missing the metaphysical distinction.

  **4. Aggregation Stance (4 Marks)**
  *   **Requirement:** Takes a clear stance on whether low-$S$ sums can outweigh high-$S$ individuals.
  *   **Common Error:** **The Expected Value Trap:** Answering by citing uncertainty about insect sentience or huge population numbers (epistemic/empirical claims) rather than the structural moral question.

  **5. Aggregation Distinctness (4 Marks)**
  *   **Requirement:** Explains whether aggregation is conceptually distinct from the question of degrees (e.g., weight of interest vs. trade-off structure).
  *   **Common Error:** Treating aggregation as a mathematical inevitability of accepting degrees, rather than a separate structural commitment.

  ***

  (d) **Differentiation Statement (A vs. B)**

  A **B-grade** answer will successfully execute the four required tasks as distinct checklist items, correctly identifying the subjecthood cliff and the multidimensionality of experience.

  An **A-grade** answer will explicitly synthesize the tension between Task 1 (Gradualism) and Task 3 (The Binary Cliff). It will recognize that positing a binary "subjecthood" condition effectively undermines the purity of the Sentience Index as a *sole* determinant of status, forcing a hybrid theory (binary entry + gradual weighting) that requires its own justification. The A answer sees that the "Thermostat Condition" is not just an exclusion clause, but a structural challenge to the gradualist framework itself.
