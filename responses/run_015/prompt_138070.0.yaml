answer: |-
  **Requirements**

  1. **Non-Consequentialist Wronging [Non-negotiable]:** Arising from the *idle sensor*, this mandates that the theory identify a distinctive loss inherent in the recording itself, even if wiped and never viewed. Privacy is not merely a shield against downstream harm like discrimination or distress; it is a normative status violated by the structure of observation alone. The theory must articulate what is lost when nothing further bad follows, ensuring that the mere capacity for surveillance constitutes a wrong independent of utility or outcome.

  2. **Potentiality vs. Actuality [Non-negotiable]:** Arising from the *sealed letter*, the theory must distinguish between authorized access conditions and actual viewing. A contingent permission (open only if missing) must be evaluated differently than open access, yet still constitute a privacy state distinct from total secrecy. It must take a position on whether an unexercised permission or an unread record is already a loss, acknowledging that the threat of access alters the relational dynamic even if unactualized.

  3. **Volition vs. Indifference [Non-negotiable]:** Arising from the *night-train stranger*, the theory must distinguish waiving privacy (active disclosure) from merely not caring about it. Privacy can be lost without being violated, but indifference does not negate the existence of the privacy interest prior to disclosure. It must distinguish having privacy from waiving it or not caring about it, preventing the assumption that silence equals consent or that lack of distress equals lack of violation.

  4. **Derivative Knowledge [Non-negotiable]:** Arising from the *inference*, the theory must adjudicate whether facts generated via modeling, without direct document access, count as privacy violations. Privacy must extend beyond stored records to encompass deducible truths about the subject. It must take a position on whether inferred facts can be private at all, recognizing that knowledge gained without breach may still undermine the subject's informational self-determination.

  5. **Relational Boundary [Negotiable]:** Arising from the *genetic mirror*, the theory must specify whether privacy rights extend to non-patients implicated by data. Does the hospital owe the sister anything? The theory must define the ontological limit of the data subject and whether obligations traverse genetic links, addressing whether privacy is individual or inherently relational.

  6. **Attenuation Threshold [Negotiable]:** Arising from the *ten-thousandth viewer*, the theory must take a position on whether wrongs aggregate or diminish. Does the marginal wrong of an additional viewer drop to zero, or does the structural exposure remain constant regardless of audience size? This determines whether privacy is a finite resource or a binary status.

  7. **Conceptual Distinctiveness [Non-negotiable]:** The theory must not collapse privacy into autonomy (choice) or security (protection). A patient can autonomously choose to waive privacy, but the theory must explain what privacy *was* before the waiver. Security prevents breaches; privacy governs legitimate flows. It must not let privacy collapse into autonomy or into security, ensuring the framework evaluates the practice itself, not just the consent or the safety.

  8. **Content Neutrality [Non-negotiable]:** The theory must not rely on a fixed inventory of sensitive categories (e.g., HIV status). Trivial data can be private depending on context. The sensitivity must emerge from the relationship or structure, not the data type. It must not smuggle in a fixed inventory of sensitive categories, allowing the theory to adapt to new data forms without legislative update.

  **Collisions**

  The tension lies primarily between **Non-Consequentialist Wronging** and **Conceptual Distinctiveness**. If privacy is violated by an idle sensor (no harm, no viewing), it risks collapsing into a property right over information or a form of security (integrity of the container). If I insist privacy is distinct from security, I must explain what normative interest is damaged by a wiped sensor. Furthermore, **Derivative Knowledge** conflicts with **Content Neutrality**. If inferred facts count, almost any data becomes sensitive given enough compute power, effectively creating a fixed category of "everything." Satisfying the demand for a distinctive loss without consequential harm while maintaining a boundary against total informational lockdown appears logically unstable. The requirement for no harm yet intrinsic wronging pushes toward deontology, while the institutional need for decision procedures pushes toward consequentialism.

  **The sharpest requirement**

  **Non-Consequentialist Wronging** is the exclusionary criterion. Reductionist theories fail immediately because they define privacy violations by downstream harm (discrimination, distress); if no one looks, there is no harm. Control-based theories struggle because the patient exercised no control over the sensor, yet the wrong persists. Access-based theories fail because no human agent accessed the data. Contextual Integrity survives best but must stretch to define "idle recording" as a contextual breach without transmission. This requirement forces the theory to justify privacy as an intrinsic good rather than an instrumental shield, eliminating the majority of policy-ready frameworks that rely on harm thresholds.

