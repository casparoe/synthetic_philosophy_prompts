prompt: |-
  I convene a small reading group — two statisticians, an epidemiologist who works with potential outcomes and causal diagrams, a decision theorist, and me (philosophy of science) — and for the better part of a year we have been going in circles about Simpson's paradox. I do not want a verdict on who is right; I want a diagnosis of why we are not moving, and I am happy to have my own hypothesis dismantled.

  The case we keep returning to is one I built myself so that we would stop trading the two canonical examples. A platform randomizes 400 students to each of two versions of a lesson, New and Old; the outcome is passing; and there is a third binary variable, whether the student completed the practice set, which is measured after assignment and is affected by it. Under New, 360 of 400 complete; pass rates are 85 per cent among completers (306/360) and 30 per cent among non-completers (12/40), for an overall 79.5 per cent. Under Old, 100 of 400 complete; pass rates are 95 per cent (95/100) and 40 per cent (120/300), for an overall 53.75 per cent. New wins overall by roughly 26 points and loses by 10 points inside both strata of completion.

  Our three camps say recognizably different things. The statisticians say there is nothing to explain: a weighted average of positive differences can be negative, the weights differ across arms because the arms carry different mixtures of the third variable, and the only real question is psychological (why anyone is surprised). They add that much of what circulates under the label is not a reversal at all — their favourite is a logistic-regression treatment coefficient that shifts when a pre-treatment covariate uncorrelated with treatment is included, which they call non-collapsibility of the odds ratio rather than confounding. The epidemiologist says the table is silent and the question is ill-posed until you say where the third variable sits: confounder, mediator, or something downstream of both treatment and outcome. On that view my own case is a mediator, and additionally a mediator that shares an unmeasured cause with the outcome, so conditioning on it both blocks the indirect path and opens a collider path; once the graph is fixed, which comparison is correct has a determinate answer and the appearance of paradox is the sound of an underspecified question. The decision theorist says the real object is the sure-thing principle (Blyth's 1972 note in JASA makes the connection), and that everything turns on whether the states in the partition are independent of the act — which, in my example, they are not, since completion is caused by the version assigned — and on which strategies are available to the agent, not merely on which partition is causally admissible.

  My hypothesis is that most of this is three questions under one name: an arithmetic one about weighted averages, an epistemic one about what licenses an inference from a joint distribution, and a decision-theoretic one about which prospect the agent actually faces. But I think there is a residue that does not dissolve, and I want your view on whether I have located it. Grant the graph and the intervention set, and the admissible partition still seems to depend on what the institution can manipulate — whether it can mandate completion independent of lesson version — which is a practical and institutional fact rather than a causal or statistical one. My group splits on whether a correct analysis is answerable to that fact at all.

  So: is the impasse verbal, are we answering different questions, or is there a genuine normative disagreement about what an analysis is for? Is the residue I have identified the real one, and is it practical in the way I have described, or is it a hidden formal question — for instance, I have been arguing that if the partition variable is pre-treatment and the stratum-wise causal risk differences share a sign, the average effect cannot reverse, since it is a convex combination over a treatment-invariant distribution, so that causal reversal requires a post-treatment partition, while associational reversal requires no such thing; and I cannot get a clean answer on whether the same holds for ratio measures, or whether that is precisely where non-collapsibility enters. Please also say what would count as progress here: sharp bounds on how extreme a reversal can be, a representation result connecting graph shapes to table patterns, a formal separation of reversal from non-collapsibility, an experiment, or a change of question. And be honest about whether anything could end this dispute, or whether the right move is to stop asking it in this form. Argue from what each side in my description actually claims; I do not need citations.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A philosopher of science convening a reading group with two statisticians, an epidemiologist (causal inference/potential outcomes/DAGs), and a decision theorist.
      *   **Topic:** Simpson's Paradox (SP).
      *   **Current State:** Stuck in circles for a year.
      *   **Specific Case:** A constructed example where Treatment (New/Old) affects a Post-Treatment variable (Completion), which affects Outcome (Pass). New is better overall, Old is better within strata of Completion. (Classic mediation/collider structure).
      *   **Group Positions:**
          *   *Statisticians:* It's arithmetic (weighted averages). Surprise is psychological. Distinguish from non-collapsibility.
          *   *Epidemiologist:* It's causal structure (DAGs). Need to know if variable is confounder/mediator/collider. Conditioning changes the estimand.
          *   *Decision Theorist:* It's about the Sure-Thing Principle and available strategies/actions. Partition independence matters.
          *   *User (Philosopher):* Hypothesizes three distinct questions (arithmetic, epistemic, decision-theoretic). Suspects a "residue" regarding institutional manipulability (can we mandate completion?). Wonders if the impasse is verbal, normative, or formal.
      *   **Goal:** Diagnosis of the impasse, evaluation of the "residue" hypothesis, clarification on formal issues (ratio measures/non-collapsibility), and advice on what counts as progress (or if they should stop).
      *   **Constraint:** Argue from what each side actually claims. No citations needed. Be honest about resolvability.

  2.  **Deconstruct the Impasse:**
      *   Why are they talking past each other? Because "Simpson's Paradox" is a label slapped onto three distinct phenomena that often co-occur but are logically separable.
      *   *Statistician:* Focuses on the *phenomenon* (reversal of association).
      *   *Epidemiologist:* Focuses on the *cause* (bias vs. mediation vs. colliders).
      *   *Decision Theorist:* Focuses on the *action* (what should I do?).
      *   *Philosopher:* Focuses on the *ontology/semantics* (what kind of question is this?).
      *   The impasse isn't just verbal; it's teleological. They disagree on what the *point* of the analysis is.

  3.  **Evaluate the User's "Residue" Hypothesis:**
      *   User says: "Grant the graph... admissible partition still seems to depend on what the institution can manipulate... practical and institutional fact rather than a causal or statistical one."
      *   Is this real? Yes. This is the "Policy vs. Etiology" distinction.
      *   If the goal is *etiology* (how does the lesson work?), the epidemiologist is right: condition on mediators to see direct effects, but beware colliders.
      *   If the goal is *policy* (which lesson to adopt?), the decision theorist is right: look at the total effect (overall pass rate) because you can't force completion independently of the lesson in this specific setup.
      *   *However*, if the institution *could* mandate completion (e.g., require practice sets for everyone regardless of lesson), the causal structure effectively changes (intervention on the mediator).
      *   So, the "correct" analysis depends on the *available action space*. This confirms the Decision Theorist's primacy in policy contexts but validates the Epidemiologist's concern about mechanism.
      *   The Statisticians are partially right that the math doesn't change, but wrong that the *interpretation* is merely psychological. The surprise comes from conflating association with causation.

  4.  **Address the Formal Questions (Ratios, Non-collapsibility, Pre/Post Treatment):**
      *   *User's Claim:* If partition is pre-treatment and stratum-wise effects share a sign, average effect cannot reverse (convex combination). Causal reversal requires post-treatment partition. Associational reversal does not.
      *   *Analysis:* This is mostly correct for Risk Differences (RD). $RD_{total} = \sum w_i RD_i$. If weights are pre-treatment (invariant), signs are preserved.
      *   *Ratios (RR/OR):* Non-collapsibility kicks in. Even with pre-treatment covariates, Odds Ratios can reverse or shift without confounding due to the mathematical property of the OR. This is what the Statisticians are yelling about. The Epidemiologist calls this "bias" only if it changes the causal estimate, but Statisticians call it "math."
      *   *Verdict:* The User is right about RD and pre-treatment. The Statisticians are right that ORs behave differently (non-collapsibility). This is a source of confusion: is SP about RD reversal or OR shift? Usually RD/AR.

  5.  **Determine What Counts as Progress:**
      *   *Sharp bounds:* Useful, but might just feed the Statisticians' arithmetic view.
      *   *Representation result:* Connecting graph shapes to table patterns is the Epidemiologist's dream. Already largely done (DAGs).
      *   *Formal separation:* Separating Reversal (SP) from Non-collapsibility is crucial.
      *   *Change of Question:* This is the most likely path to peace. Stop asking "Is this Simpson's Paradox?" Ask "What is the estimand?"
      *   *Can the dispute end?* Not if they insist on a single definition of SP. It *can* end if they agree SP is a umbrella term for distinct problems.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the group. Validate that the impasse is structural, not just stubbornness.
      *   *Diagnosis:* It's a teleological clash.
          *   Statisticians: Descriptive (What happened in the data?).
          *   Epidemiologist: Explanatory (What is the causal mechanism?).
          *   Decision Theorist: Prescriptive (What should we do?).
          *   Philosopher: Conceptual (What are we talking about?).
      *   *The "Residue":* Validate the User. The "institutional manipulability" is the bridge between Decision Theory and Causal Inference. It determines whether the Total Effect or Direct Effect is the target.
      *   *Formal Check:* Address the Pre/Post treatment and Ratio measure question. Confirm User's intuition on RD/Pre-treatment. Clarify Non-collapsibility (OR) vs. Confounding (SP).
      *   *Path Forward:*
          1.  Separate Non-collapsibility from Simpson's Reversal.
          2.  Define the Estimand *before* looking at the table.
          3.  Acknowledge the "Action Space" constraint (User's residue).
      *   *Honesty Check:* Will this end the dispute? Only if they stop trying to define "True SP" and start defining "Target Quantity."

  7.  **Refining the Tone:**
      *   Needs to be respectful but decisive.
      *   Avoid taking sides, but explain *why* each side feels right.
      *   Use the specific example provided (Lesson/Completion/Pass) to illustrate points.
      *   Ensure the distinction between *association reversal* and *causal effect reversal* is clear.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, did the User say the variable is post-treatment?* Yes ("measured after assignment and is affected by it").
      *   *Implication:* Conditioning on it blocks the indirect path.
      *   *Statisticians:* Say "weighted averages." They are ignoring the causal direction.
      *   *Epidemiologist:* Says "mediator + collider." This is key. If Completion is affected by Treatment and affects Pass, it's a mediator. If there's an unmeasured cause of Completion and Pass, conditioning opens a collider path.
      *   *Decision Theorist:* Says "Sure Thing Principle." The states (Completer/Non-completer) are not independent of the Act (Lesson). So STP doesn't apply directly to the stratified table.
      *   *User's Residue:* "Can we mandate completion?" If yes, we can intervene on the mediator. If no, we are stuck with the total effect.
      *   *My Verdict:* The User is correct. The "paradox" dissolves once the *goal* is specified. If the goal is "Pick the best lesson as is," look at totals (Decision Theory). If the goal is "Understand how the lesson works," look at strata (Epi). If the goal is "Describe the data," look at weights (Stats).
      *   *The "Residue" is normative:* It's about what we *want* from the science. Prediction vs. Explanation vs. Control.

  9.  **Final Polish:** Check against constraints. No citations. Argue from their claims. Address the ratio measure question. Be honest about resolvability. (Proceed to generate output).

  *(Self-Correction on the Ratio Measure Question)*: The user asks: "if the partition variable is pre-treatment and the stratum-wise causal risk differences share a sign, the average effect cannot reverse... I cannot get a clean answer on whether the same holds for ratio measures."
  *Answer:* For Risk Ratios, it *can* reverse even with pre-treatment covariates if the baseline risks vary enough across strata, though it's less common than with ORs. For Odds Ratios, non-collapsibility guarantees the marginal OR will differ from conditional ORs even without confounding. This is a formal fact that distinguishes the Statistician's concern from the Epidemiologist's. I need to make sure this is clear.

  *(Final Plan)*:
  1. Validate the "Three Questions" hypothesis.
  2. Diagnose the impasse as Teleological (Purpose of inquiry).
  3. Validate the "Residue" (Manipulability/Action Space).
  4. Clarify the Formal/Math question (RD vs OR/RR).
  5. Recommend "Progress" via Estimands, not definitions.
  6. Honest conclusion: The dispute won't end if seeking a single definition, but can end if seeking a protocol.

  (Start writing response based on this structure.)
answer: |-
  Your hypothesis is correct, but it is incomplete. You have correctly identified that there are three distinct questions hiding under one label (arithmetic, epistemic, decision-theoretic). However, the reason your group is stuck is not merely that you are answering different questions, but that you disagree on which question *ought* to be primary when the label "Simpson's Paradox" is invoked. The impasse is teleological, not just verbal.

  Here is the diagnosis of your circle, an evaluation of your residue, and a verdict on the formal questions.

  ### 1. The Diagnosis: A Clash of Teleologies

  Your group members are not disagreeing about the math; they are disagreeing about the *purpose* of the analysis.

  *   **The Statisticians** treat the table as a **description**. For them, the paradox is a warning about summarizing data. Their claim that "a weighted average of positive differences can be negative" is a statement about the properties of aggregation. When they bring up non-collapsibility, they are defending the integrity of the measure (e.g., odds ratios) against the charge of "bias." They are right that the arithmetic holds regardless of causality, but they are wrong to imply that the *surprise* is merely psychological. The surprise exists because humans instinctively treat associations as causal.
  *   **The Epidemiologist** treats the table as a **mechanism**. For them, the paradox is a warning about identification. Their claim that "the table is silent" without a graph is the strongest causal position. In your specific case, they are correct that "Completion" is a post-treatment variable. Conditioning on it blocks the indirect path (Lesson → Completion → Pass) and, if there are unmeasured common causes of Completion and Pass, opens a collider path. They are fighting to prevent you from estimating a biased direct effect when you think you are estimating a total effect, or vice versa.
  *   **The Decision Theorist** treats the table as a **menu**. For them, the paradox is a warning about action. Their invocation of the Sure-Thing Principle is precise: the principle holds only if the partition (Completion) is independent of the act (Lesson). In your case, it is not. Therefore, the stratified comparison does not dictate the rational choice. The rational choice is determined by the expected utility of the available acts. If the act is "Assign Lesson," the total probability matters. If the act were "Assign Lesson AND Mandate Completion," the stratified probability might matter.

  **Why you are going in circles:** You are trying to resolve a normative disagreement (What should we care about?) with formal tools (What does the math say?). The Statisticians think the Epidemiologist is importing metaphysics into arithmetic. The Epidemiologist thinks the Statisticians are ignoring the data-generating process. The Decision Theorist thinks both are ignoring the agent's constraints.

  ### 2. The Residue: Manipulability and Institutional Fact

  You asked if the residue you identified is real: *"Grant the graph and the intervention set, and the admissible partition still seems to depend on what the institution can manipulate... which is a practical and institutional fact rather than a causal or statistical one."*

  **Yes, this is the real residue.** And it is the point where the Decision Theorist and the Epidemiologist must shake hands, leaving the Statisticians to record the minutes.

  In your example, "New" is better overall, "Old" is better within strata.
  *   If the institution **cannot** mandate completion (i.e., completion is a behavioral response to the lesson), then the only available act is "Choose Lesson." The relevant quantity is the Total Effect (79.5% vs 53.75%). The Decision Theorist wins. The stratified numbers are counterfactuals that cannot be realized by any available policy.
  *   If the institution **can** mandate completion (i.e., they can force students to do practice sets regardless of lesson type), then the causal structure changes. You are no longer observing $P(Pass | Lesson, Completion)$; you are intervening on Completion. Now, the "Old" lesson might indeed be superior for the forced-completers. The Epidemiologist wins, because the graph has effectively been pruned by intervention.

  The disagreement in your group arises because the Epidemiologist assumes the goal is to understand the *lesson's intrinsic efficacy* (Direct Effect), while the Decision Theorist assumes the goal is to maximize *pass rates under current constraints* (Total Effect). The Statisticians sit on the sideline noting that both numbers are mathematically valid summaries of the joint distribution.

  Your intuition is correct: the "correct" analysis is answerable to the institutional fact of manipulability. This is not a hidden formal question; it is a boundary condition on the decision problem. If you cannot separate the lesson from the completion behavior, the stratified comparison is a distraction for policy, though it remains vital for science (understanding *why* New works better overall despite worse stratum performance).

  ### 3. The Formal Question: Ratios, Risks, and Non-Collapsibility

  You asked for a clean answer on your formal hypothesis: *"If the partition variable is pre-treatment and the stratum-wise causal risk differences share a sign, the average effect cannot reverse... I cannot get a clean answer on whether the same holds for ratio measures."*

  Here is the distinction you need to break the deadlock:

  1.  **Risk Differences (RD):** You are correct. If the partition variable is pre-treatment (independent of assignment), the marginal RD is a weighted average of the conditional RDs, where the weights are the marginal proportions of the strata. If all conditional RDs are positive, the marginal RD *must* be positive. Reversal is impossible without post-treatment conditioning or confounding (selection bias).
  2.  **Risk Ratios (RR):** Reversal *is* possible even with pre-treatment partitions if the baseline risks vary sufficiently across strata. The marginal RR is not a weighted average of conditional RRs in the same linear way RD is.
  3.  **Odds Ratios (OR):** This is where the Statisticians are fighting. The OR is **non-collapsible**. Even in a perfectly randomized trial with no confounding and no post-treatment variables, the marginal OR will differ from the conditional ORs simply due to the mathematics of the odds. This is *not* Simpson's Paradox (which implies a reversal or a bias due to mixing); this is a property of the measure.

  **The Verdict:** The Statisticians are right that much of what is called "Simpson's Paradox" in logistic regression contexts is actually non-collapsibility. The Epidemiologist is right that for causal identification (RD or RR), pre-treatment conditioning cannot cause a sign reversal in the absence of confounding. The confusion in your group stems from conflating *non-collapsibility* (a mathematical property of the OR) with *confounding/selection bias* (a structural property of the DAG).

  ### 4. What Counts as Progress?

  Do not seek sharp bounds on reversal extremes; that feeds the Statisticians' view that this is just arithmetic. Do not seek a representation result connecting graphs to tables; the Epidemiologist already believes they have this (DAGs).

  **Progress requires a Change of Question.**

  You must stop asking "Is this Simpson's Paradox?" and start asking "What is the Estimand?"

  To end the dispute, propose the following protocol for your group:
  1.  **Define the Action Space:** Before looking at data, the Decision Theorist must specify what acts are available. (Can we mandate completion?)
  2.  **Define the Target:** Based on the action space, the Epidemiologist must specify the causal estimand. (Total Effect vs. Direct Effect).
  3.  **Check Identification:** The Epidemiologist determines if the data identifies the target. (In your case, conditioning on Completion does *not* identify the Total Effect).
  4.  **Describe the Data:** The Statisticians describe the associations, explicitly labeling any non-collapsibility artifacts if odds ratios are used.

  **Can this dispute end?**
  No, not if you insist on a single definition of "Simpson's Paradox." The term is too historically overloaded. It refers to a arithmetic curiosity (Yule), a causal warning (Pearl), and a decision-theoretic puzzle (Blyth).

  **The Right Move:**
  Declare a moratorium on the phrase "Simpson's Paradox." It has done its work. It served as a heuristic to teach people that "averages can lie." Your group has outgrown the heuristic.
  *   Tell the Statisticians: "We agree it is arithmetic, but we need to know which arithmetic corresponds to the causal quantity."
  *   Tell the Epidemiologist: "We agree the graph determines the bias, but we need to know which bias matters for the decision."
  *   Tell the Decision Theorist: "We agree the action dictates the metric, but we need to know if the data supports that metric."

  Your residue is the key. The "institutional fact" of manipulability is the switch that selects the correct estimand. If you formalize that switch, you dissolve the paradox. If you continue to debate the table without specifying the switch, you will circle forever.
