prompt: |-
  I am a digital archivist fluent in the OAIS reference model, format migration, emulation environments, fixity verification, and the operational distinction between preservation masters and access renderings. Restate the philosophical debate about mind uploading and gradual neuronal replacement—the cerebral Ship of Theseus versus abrupt whole-brain emulation—entirely within that vocabulary. Treat the persistence of a person over time as the persistence of an information package through successive preservation actions: original bitstreams, migrated formats, emulated executions, and checksums that either match or fail. For gradual biological replacement, map neuronal turnover onto incremental preservation actions (refresh, migration, repair); for abrupt upload, map it onto a full migration-plus-emulation event. Then deliver the residue report: which claims about subjective continuity, first-person authority, or discontinuity translate cleanly onto archival concepts like fixity failure or rendering fidelity; which must be distorted to fit; and which have no counterpart—for example, whether archival science contains anything analogous to the intuition that an executed copy feels differently depending on substrate. Assess whether the untranslated residue points to a genuine gap in archival theory (a missing concept of experiential substrate-dependence) or reveals that philosophy is over-indexing on the data-versus-execution distinction that preservation practice already treats as pragmatic. Do not smuggle in dualist assumptions; treat execution as a functional state within the vocabulary. Conclude by stating your overall confidence in the translation and identifying the single mapping you are least sure about.
