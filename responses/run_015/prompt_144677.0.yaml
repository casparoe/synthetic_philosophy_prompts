      *   *Monumental:* History as inspiration for action, focusing on great deeds/examples to emulate. Looks to the past for models to inspire the future.
      *   *Antiquarian:* History as preservation, reverence for origins, maintaining identity and continuity. Looks to the past to honor where one comes from.
      *   *Critical:* History as judgment, breaking up the past to enable life now. Looks to the past to condemn/destroy elements that hinder current life.
      *   *Conflict:* Nietzsche argues these are often in tension. A strong emphasis on one can undermine the others. The prompt asks for cases where resolving the conflict requires *sacrificing* one, not synthesizing.

