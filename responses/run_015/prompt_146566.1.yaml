prompt: |-
  You are a senior researcher working at the intersection of the philosophy of measurement, welfare economics, and public policy evaluation; you have written funded proposals before and you know what review committees actually read for. Please think carefully before drafting, and begin with a short brainstorming paragraph (150 words or so) in which you sketch two or three candidate framings of the problem below, note what each would cost you, and say which one gives the sharpest question. Then write the proposal.

  The setting: I work in a small policy unit attached to a national statistics office. A minister has asked whether the government should adopt an explicit national target of placing in the top ten of the annual world happiness rankings within ten years, and my unit has been asked to produce an internal decision memo on the concept rather than on the politics. I have a half-formed idea I want turned into a real proposal: that the debate splits into a measurement question and a targeting question that people keep running together, and that the interesting part is the feedback between them. On the measurement side, the familiar rankings rest on self-reported life evaluation, which is not the same thing as experienced affect, and reported numbers move with things like response styles, aspiration levels, and the order and framing of survey items, so it is not obvious that a rise in a country's score means a rise in anything we independently care about. On the targeting side, a ranking is ordinal and positional: only one country can be at the top, so if many governments each optimise their own rank, the total effort is large and the total improvement in human wellbeing could be nil, and the ranking would at the same time become less informative because the measured quantity is now being produced partly by the measurement. My suspicion is that there is a principled case — not just a prudential one — for a state to commit to steering by something it does not publish or does not target directly, and I would like the project to take seriously the option of a deliberately opaque or lagged wellbeing indicator as a policy instrument.

  Write a two-page research proposal for a six-month, one-investigator project with a part-time research assistant, to be read by a mixed committee of economists, one philosopher, and two senior civil servants, so keep it free of unnecessary jargon. It should contain: a precise statement of the question, narrow enough that it has a determinate answer within six months; an explanation of why the two standard postures — that the existing measures are good enough to steer by, and that interpersonal comparisons of happiness are too shaky to steer by at all — both leave the question open; the method, month by month, meaning what I would actually do and why that approach rather than the obvious alternatives of commissioning a new survey, running a cross-country regression, or writing a conceptual overview; the range of possible conclusions and what considerations would decide between them; a concrete description of the deliverable for someone who has to advise a minister on whether to set the target; and an honest closing section on what would count as the project having failed and what would make it too big for six months. Do not include a bibliography, a literature review organised by citation, or any references section; refer to positions and arguments in your own words and I will add the citations myself.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior researcher at the intersection of philosophy of measurement, welfare economics, and public policy evaluation. Experienced in funded proposals.
      *   **Task:** Write a two-page research proposal for a six-month, one-investigator project (plus part-time RA).
      *   **Audience:** Mixed committee (economists, one philosopher, two senior civil servants). Needs to be jargon-free but rigorous.
      *   **Context:** Small policy unit at a national statistics office. Minister asks about adopting a target to be top 10 in world happiness rankings within 10 years.
      *   **Core Idea:** The debate splits into measurement vs. targeting, but the interesting part is the *feedback* between them. Rankings are ordinal/positional (zero-sum game if everyone optimizes). Self-reported life evaluation != experienced affect. Proposal should explore the case for steering by something opaque or lagged.
      *   **Required Structure:**
          1.  Short brainstorming paragraph (150 words max) sketching 2-3 framings, costs, and selecting the sharpest.
          2.  Proposal Content:
              *   Precise statement of the question (narrow enough for 6 months).
              *   Explanation of why standard postures (measures good enough vs. too shaky) leave the question open.
              *   Method (month-by-month), explaining why this approach over alternatives (new survey, regression, conceptual overview).
              *   Range of possible conclusions and deciding considerations.
              *   Concrete description of the deliverable for the minister.
              *   Honest closing section on failure conditions and scope creep.
      *   **Constraints:** No bibliography, no literature review by citation, no references section. Refer to arguments in own words. Two-page limit (approximately).

  2.  **Brainstorming Paragraph (Pre-writing):**
      *   *Goal:* Sketch 2-3 framings, note costs, pick the sharpest.
      *   *Framing 1: Technical Validity.* Focus on psychometric properties of life evaluation vs. affect. *Cost:* Requires new data collection or deep dive into psych literature, risks getting bogged down in "is it real?" without addressing policy.
      *   *Framing 2: Game Theory/Positional Goods.* Focus on the zero-sum nature of rankings. *Cost:* Requires modeling other nations' responses, speculative, might ignore the measurement validity issue.
      *   *Framing 3: Measurement-Targeting Feedback (Goodhart's Law).* Focus on how targeting changes the measure's meaning. *Cost:* Conceptual heavy lifting, needs careful philosophical framing to avoid sounding like "metrics are bad."
      *   *Selection:* Framing 3 is sharpest because it directly addresses the user's suspicion about opaque/lagged indicators and bridges the philosopher/economist divide.
      *   *Word Count Check:* Keep it around 150 words.

  3.  **Drafting the Proposal:**
      *   *Tone:* Professional, precise, policy-relevant, academically rigorous but accessible.
      *   *Length:* Two pages roughly (approx. 800-1000 words excluding the brainstorming paragraph).
      *   *Section 1: Question.* Needs to be narrow. Not "Should we target happiness?" but "Under what conditions does targeting a ranking invalidate the measure?"
      *   *Section 2: Why Standard Postures Fail.*
          *   Posture A (Pro-measurement): Ignores Goodhart's law/positional nature.
          *   Posture B (Anti-measurement): Ignores that some steering is better than none, or that robust metrics exist if used differently.
      *   *Section 3: Method (Month-by-Month).*
          *   Months 1-2: Conceptual mapping (measurement vs. targeting).
          *   Months 3-4: Simulation/Scenario analysis (not full econometrics, but logical modeling of feedback).
          *   Months 5-6: Drafting the decision memo framework.
          *   *Why not alternatives?* New survey = too slow/expensive. Regression = data doesn't capture counterfactual policy shifts. Conceptual overview = too abstract, needs policy output.
      *   *Section 4: Conclusions.* Range from "Targeting is safe" to "Targeting destroys validity" to "Use lagged/opaque metric."
      *   *Section 5: Deliverable.* A decision tree or checklist for the minister, not just a paper.
      *   *Section 6: Risks/Failure.* What if the feedback loop is unmodelable? What if the philosophical distinction collapses?

  4.  **Refining and Editing:**
      *   *Check Constraints:* No citations. Jargon check (explain Goodhart's law if used, or use plain English). Ensure the brainstorming paragraph is at the very beginning.
      *   *Audience Check:* Economists want rigor/logic. Philosopher wants conceptual clarity. Civil servants want actionable advice.
      *   *Word Count:* The prompt asks for a "two-page research proposal." In standard formatting (12pt, single/double spaced), this is roughly 800-1000 words. I need to be concise.
      *   *Brainstorming Paragraph:* Ensure it's distinct from the proposal text.

  5.  **Drafting - Step-by-Step:**

      *   *Brainstorming:* I need to write this first.
      *   *Title:* Needs to be clear. "The Feedback Loop Between Measurement and Targeting in National Wellbeing Policy."
      *   *Question:* "Does adopting a public ranking target systematically distort the underlying wellbeing metric such that the target becomes self-defeating?"
      *   *Standard Postures:* Explain the "mismeasurement" vs. "useless metric" trap.
      *   *Method:* Focus on conceptual modeling and scenario testing rather than empirical data collection.
      *   *Deliverable:* A "Decision Memo Framework."
      *   *Risks:* Scope creep into general welfare theory.

      *Self-Correction on Length:* The prompt asks for a "two-page research proposal." Usually, this means the output *excluding* the brainstorming paragraph should fit the visual space of two pages. I will aim for ~900 words for the proposal itself. The brainstorming paragraph is separate.

      *Self-Correction on Tone:* Ensure I sound like a senior researcher. Confident, aware of limitations, practical.

      *Self-Correction on Content:* Make sure I address the "opaque or lagged wellbeing indicator" idea specifically.

      *Let's write.*

      *Brainstorming Paragraph:*
      Three framings compete. First, a psychometric audit: are life-evaluation scores valid proxies for welfare? Cost: high empirical burden, risks concluding "measures are imperfect" without policy guidance. Second, a game-theoretic model: if all nations target rank, does global welfare rise? Cost: speculative modeling of foreign governments, distracts from domestic validity. Third, a measurement-targeting feedback loop: does public targeting alter the semantic content of the score? Cost: conceptual density, requires bridging philosophy of science and economics. I choose the third. It yields the sharpest question: does publishing a target invalidate the metric used to track it? This directly addresses the minister's request while respecting the philosophical nuance of measurement reactivity.

      *Proposal Text:*
      **Project Title:** The Reflexivity of Wellbeing Targets: Measurement Validity under Policy Pressure
      **Investigator:** [Name]
      **Duration:** 6 Months

      **1. The Question**
      Should a government adopt a public target based on ordinal wellbeing rankings? The standard view assumes metrics are stable mirrors of reality. This project asks a narrower, determinate question: *Under what conditions does committing to a public ranking target systematically distort the underlying wellbeing metric such that achieving the target no longer correlates with improved welfare?* This isolates the feedback mechanism between measurement and targeting, distinguishing it from general debates about whether happiness can be measured.

      **2. Why Standard Postures Fail**
      Two dominant positions leave the minister without guidance. The first, common among wellbeing advocates, assumes existing measures (like life evaluation) are robust enough to steer by. This ignores "measurement reactivity": when a metric becomes a target, respondents may alter answers based on perceived expectations or shifting aspirations, decoupling the score from actual experience. The second, common among skeptics, argues interpersonal comparisons are too shaky for policy. This throws out useful information; even imperfect metrics guide better than GDP alone, provided we understand their limits. Both postures treat measurement as static. Neither accounts for the dynamic where the act of targeting changes what is being measured. If the metric changes meaning under pressure, a top-ten ranking could coincide with stagnant or declining actual welfare. We need a framework to assess when this decoupling occurs.

      **3. Methodology**
      This project avoids three obvious but unsuitable alternatives. Commissioning a new survey is too slow and cannot simulate the long-term effects of a ten-year target. Cross-country regressions cannot capture counterfactual policy shifts or the endogenous change in survey response styles. A purely conceptual overview would lack policy traction. Instead, I will employ a structured conceptual modeling approach combined with scenario analysis.

      *   **Months 1-2: Conceptual Mapping.** I will map the causal pathways between policy announcements, public attention, and survey response behaviors. I will categorize types of measurement distortion (e.g., aspiration adaptation vs. strategic responding) using existing literature on measurement theory and Goodhart's Law, translated into policy terms.
      *   **Months 3-4: Scenario Simulation.** Working with the RA, I will construct three policy scenarios: (1) Public ordinal target (top 10); (2) Public absolute target (score increase); (3) Opaque/lagged internal target. For each, I will trace the likely feedback loops on data validity. This involves logical modeling rather than econometrics, testing whether the indicator remains informative under each regime.
      *   **Months 5-6: Framework Development.** I will synthesize findings into a decision framework. This involves drafting the criteria under which an indicator is safe to target versus when it should be shielded from public targeting.

      **4. Range of Conclusions**
      The project will conclude with one of three determinate findings.
      1.  *Robustness:* The metrics are sufficiently insulated from policy targeting that a public rank goal is safe. (Unlikely given literature on reactivity).
      2.  *Fragility:* Public targeting inevitably corrupts the metric, making the target self-defeating.
      3.  *Conditional Utility:* Targeting is viable only if decoupled from the measure (e.g., targeting specific drivers like social support while measuring life evaluation separately, or using lagged data).
      The deciding consideration will be the magnitude of the estimated feedback loop. If the act of targeting shifts response styles more than it shifts actual welfare, the recommendation must be against public targeting.

      **5. Deliverable**
      The output is not an academic paper but an internal *Decision Memo Framework*. This will be a 5-10 page document containing a diagnostic checklist for the minister. It will specify: (1) which indicators are safe for public targeting; (2) which require opacity or lagging; and (3) a warning system for signs that the metric is decoupling from reality (e.g., divergence between life evaluation and affect measures). This allows the minister to answer the specific request while safeguarding the statistical integrity of the office.

      **6. Risks and Limitations**
      This project fails if the feedback mechanisms prove too heterogeneous to model generally, resulting in a "it depends" conclusion that offers no decision rule. To avoid this, I will restrict the scope to ordinal ranking targets, ignoring absolute score targets unless necessary for contrast. The project becomes too big if it attempts to design the alternative opaque indicator in detail; the scope is limited to evaluating the *principle* of opacity, not designing the specific metric. If the philosophical distinction between "measurement" and "targeting" collapses under scrutiny, I will pivot to recommending a portfolio of metrics rather than a single target, but this contingency is built into the Conditional Utility conclusion.

      *Review against constraints:*
      - Brainstorming paragraph included? Yes.
      - Two-page length? Looks about right (approx 900 words).
      - No bibliography/citations? Checked.
      - Month-by-month method? Included.
      - Honest closing? Included.
      - Audience appropriate? Yes, mixes technical and policy language.

      *Final Polish:* Ensure the transition from brainstorming to proposal is clear. Ensure the tone is authoritative. The prompt asks to "begin with a short brainstorming paragraph... Then write the proposal." I will separate them clearly.

      *Word Count Check:*
      Brainstorming: ~130 words.
      Proposal: ~850 words.
      Total: ~1000 words. This fits "two-page" standard density.

      *Refining the "Method" section:* Make sure to emphasize *why* this method. I did that (vs survey, vs regression).
      *Refining the "Deliverable":* Make sure it's concrete. "Decision Memo Framework" is good.
      *Refining the "Failure":* Be honest. "It depends" is a risk.

      *Final check on the "opaque/lagged" idea:* Ensure it's prominent. It is in the scenarios and conclusions.

      *Ready to generate.*
