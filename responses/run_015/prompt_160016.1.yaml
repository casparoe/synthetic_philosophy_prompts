prompt: |-
  I coach a competitive debate team at a large public high school, and in the same building I moderate a monthly discussion group for adults who read philosophy on their own. In both settings I run into the same move several times a month, and I have never had a consistent way of ruling on it. Instead of offering evidence, a speaker says that the opponent could not even make the claim without presupposing its opposite. You cannot argue that there are no reasons for belief, because to argue is to offer a reason. You cannot say that every truth is relative, because that very statement presents itself as true and not merely relative. You cannot deny that you acted freely, since raising the denial is something you did. You cannot claim that nothing is objectively valuable while writing a speech that urges the audience to change its mind. Sometimes the move deserves to win the point. Sometimes it feels like rhetorical judo, a way of punishing someone for speaking at all. I have since learned that philosophers apparently have a name for this shape of argument and a long dispute about what, if anything, it establishes, but I have no training in the subject and I am asking you rather than reading about it.

  What I need is a decision procedure, not an essay. My students debate every other weekend, and whether this move counts decides rounds; I also have to give the adults something they can use the same evening. So I want six or seven questions in a fixed order, each with a statement of what counts as a sufficient answer, a point at which the procedure returns a clear no, and a point at which it stops and hands the decision to the judge because the remaining question is one of values rather than of fact. It has to fit on one side of an index card and be runnable by a fifteen-year-old in about ninety seconds in the prep room, with no technical vocabulary. Where a step needs a piece of theory in order to be understood, say so and say what the plain-language version gives up. The judges are community volunteers who will not accept anything that sounds like theory, and neither will half my students.

  Three things I have noticed on my own that I want built in, but corrected if I have them wrong. First, these arguments are supposed to start from something the opponent cannot deny; yet some of them start from something the opponent is perfectly willing to give up, such as their own continued participation in the exchange, since they can stop talking or say they are only venting a feeling rather than asserting anything. That difference seems to matter, and I want a question that catches it. Second, there is a reply that deflates many of these arguments for me: granted, we have to think that way, but is that any reason to think things are that way? Some arguments I hear seem to collapse under that reply and others seem untouched by it, and I cannot say which is which. To me this looks like the deepest issue in the whole neighbourhood, so I would like the procedure to contain an explicit test for vulnerability to it, and to say what an argument would have to add in order to be immune. Third, some of these arguments strike me as circularity in costume, where the starting point quietly contains the conclusion the argument was meant to establish. I want a question that catches that without rejecting every argument of this shape on principle, since a few of them clearly do real work.

  Please then run the finished procedure on three cases and be blunt about the results. Apply it to the relativism case above, where a speaker says that the claim there is no objective truth refutes itself. Apply it to the case of reasons for belief, because I have been using that argument myself for about ten years and I would rather be told honestly that it establishes only something weaker than I have been claiming, if that is what it establishes. And apply it to a case I expect to fail outright, such as the claim that no one can deny having free will, since anyone who says so could have stayed silent instead. Where the procedure hands a decision to the judge, say so explicitly and say what the judge is being asked to decide.

  Finally, tell me which of the questions are really judgment calls wearing procedural clothing, and what the procedure cannot do. In particular, I want to know whether it can ever certify a conclusion as true of the world rather than merely as something we are committed to in virtue of thinking or speaking at all, and how a judge should weigh a move that survives the whole procedure against a single piece of ordinary evidence pointing the other way.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** High school debate coach and philosophy discussion moderator.
      *   **Problem:** Needs a consistent way to rule on "self-refuting" or "transcendental" arguments (arguments claiming an opponent presupposes the opposite of their claim).
      *   **Constraints:**
          *   Decision procedure, not an essay.
          *   6-7 questions in fixed order.
          *   Each question needs: sufficient answer criteria, clear "no" stop point, clear "judge decision" stop point.
          *   Fit on one side of an index card.
          *   Runnable by a 15-year-old in ~90 seconds.
          *   No technical vocabulary (explain theory trade-offs if used).
          *   Judges are community volunteers (no "theory" speak).
          *   Must incorporate user's three observations (voluntary participation, "have to think vs. is true," circularity).
          *   Must run the procedure on three specific cases (Relativism, Reasons for Belief, Free Will).
          *   Must include a meta-analysis (judgment calls, limitations, truth vs. commitment, weighing against evidence).
      *   **Tone:** Practical, blunt, authoritative but accessible.

  2.  **Deconstruct the Argument Type:**
      *   The user is describing *performative contradictions* or *transcendental arguments*.
      *   Structure: "You claim X. But in claiming X, you must assume Y. Y contradicts X. Therefore, X is false."
      *   User's specific concerns:
          1.  *Volition:* Can the opt-out? (e.g., "I'm just venting").
          2.  *Necessity vs. Truth:* Just because we *must* assume Y to speak, does that make Y *true*? (Kantian vs. Realist).
          3.  *Circularity:* Is the argument just begging the question?

  3.  **Drafting the Decision Procedure (The Index Card):**
      *   *Goal:* 6-7 questions. Simple language.
      *   *Q1 (The Claim):* What exactly are they denying? (Need clarity).
      *   *Q2 (The Act):* What act are they doing that supposedly contradicts the claim? (Speaking, arguing, choosing).
      *   *Q3 (The Opt-Out - User Obs 1):* Could they have made the claim without doing that act? (Can they opt-out?).
      *   *Q4 (The Necessity - User Obs 2):* Is the act *necessary* for the claim, or just convenient? (Is the presupposition unavoidable?).
      *   *Q5 (The Circle - User Obs 3):* Does the act prove the *content* or just the *practice*? (Truth vs. Commitment).
      *   *Q6 (The Weighing):* If it passes, does it beat evidence? (Judge's call).

      *Refining for Constraints:*
      *   Needs to be tighter. 90 seconds is very fast.
      *   Needs explicit "Stop" conditions.
      *   Needs to handle the "Truth vs. Commitment" distinction clearly without jargon.

      *Drafting Questions:*
      1.  **The Denial:** Is the opponent denying something absolute (e.g., "No truth") or specific (e.g., "This policy is bad")? *Stop if specific.*
      2.  **The Act:** Is the contradiction in the *speaking* or the *living*? *Stop if living (too hard to prove).*
      3.  **The Exit:** Could they make the point without arguing? (e.g., "I'm just joking"). *Stop if yes.*
      4.  **The Leap:** Does proving they *must speak* this way prove the *world* is this way? *Stop if no (Judge Call).*
      5.  **The Circle:** Does the argument assume what it tries to prove? *Stop if yes.*
      6.  **The Verdict:** If all pass, does this beat evidence? *Judge Call.*

      *Polishing for "Index Card" feel:*
      *   Make it a checklist.
      *   Use bold for decisions.
      *   Ensure the "Theory Trade-off" is noted where simplification happens.

  4.  **Running the Procedure on the Three Cases:**
      *   *Case 1: Relativism ("No objective truth" is objectively true).*
          *   Q1: Absolute denial? Yes.
          *   Q2: Contradiction in speaking? Yes.
          *   Q3: Exit? Hard to exit if making a truth claim.
          *   Q4: Leap? Does speaking prove truth? (Here's the rub).
          *   Result: Likely passes to Judge on the "Leap."
      *   *Case 2: Reasons for Belief ("No reasons" argues with reasons).*
          *   Q1: Absolute? Yes.
          *   Q2: Speaking? Yes.
          *   Q3: Exit? Can say "I'm not arguing, just stating."
          *   Q4: Leap? Similar to relativism.
          *   Result: User admits using this for 10 years. Need to be blunt. It proves commitment, not necessarily metaphysical truth.
      *   *Case 3: Free Will ("Denying free will requires free choice").*
          *   Q1: Absolute? Yes.
          *   Q2: Acting? Yes.
          *   Q3: Exit? "I was determined to speak." (Harder to opt-out).
          *   Q4: Leap? Does choosing to speak prove general free will?
          *   Result: Likely fails on Q4/Q5.

  5.  **Meta-Analysis (The "What I Can't Do" Section):**
      *   Identify which questions are actually value judgments.
      *   Address the "Truth vs. Commitment" issue directly.
      *   Address the "Evidence" weighing issue.
      *   Acknowledge the simplification of complex philosophy (Transcendental Arguments, Pragmatic Contradictions).

  6.  **Review against Constraints:**
      *   6-7 questions? Yes.
      *   Fixed order? Yes.
      *   Sufficient answer/Stop points? Yes.
      *   Index card size? (Need to keep text tight).
      *   15-year-old friendly? (Avoid "performative contradiction," use "doing vs. saying").
      *   User's 3 observations included? Yes (Exit, Leap, Circle).
      *   Three cases run? Yes.
      *   Blunt results? Yes.
      *   Meta-analysis included? Yes.

  7.  **Final Polish:**
      *   Ensure the tone is respectful but direct.
      *   Make sure the "Judge Decision" points are clear.
      *   Check the "Theory Trade-off" notes.
      *   *Self-Correction on Q4:* The distinction between "we must think this" and "this is true" is the hardest part. I need to make sure the procedure flags this as a *Judge Decision* rather than a hard fact, because philosophy hasn't settled it. The user asked for a point where it hands off to the judge on values. Q4/Q5 is that spot.

      *Refining the "Exit" question:* The user noted opponents can say "I'm just venting." The procedure needs to catch if the claim *requires* assertion. If I say "Truth is relative," am I asserting? Yes. If I say "I feel like truth is relative," maybe not. The question needs to test if the claim *demands* the act.

      *Refining the "Circle" question:* Need to distinguish between "vicious circularity" and "inevitable presupposition."

      *Let's finalize the 7 questions.*
      1. Scope (Absolute vs. Specific)
      2. The Act (Speaking vs. Living)
      3. The Exit (Can they opt out?)
      4. The Gap (Thinking vs. Being) -> *Judge Handoff*
      5. The Circle (Begging the Question)
      6. The Weight (vs. Evidence) -> *Judge Handoff*
      7. Final Ruling.

      *Wait, need to fit the "Theory Trade-off" instruction.* "Where a step needs a piece of theory in order to be understood, say so and say what the plain-language version gives up." I will add a small sidebar or footnote style text within the procedure explanation.

      *Let's write the response.*
      *   Part 1: The Index Card Procedure.
      *   Part 2: The Three Case Runs.
      *   Part 3: The Meta-Analysis (Limitations & Truth).

      *Check:* Did I answer the specific prompt about "what the judge is being asked to decide" at the handoff points? Yes, need to be explicit there.
      *Check:* Did I address the "Reasons for Belief" case honestly? Yes, need to admit it might only prove pragmatic commitment, not metaphysical necessity.

      *Final check on constraints:* "Six or seven questions in a fixed order." "Each with a statement of what counts as a sufficient answer." "A point at which the procedure returns a clear no." "A point at which it stops and hands the decision to the judge."
      Okay, I will format the procedure clearly so it looks like it *could* be printed on a card, even if I'm explaining it in text.

      *Wait, one nuance:* The user wants the procedure *on* the response, but also wants me to *run* it. I should present the procedure first, then the runs.
      *Also:* "Tell me which of the questions are really judgment calls wearing procedural clothing." This goes in the final section.

      *Let's refine the "Truth vs Commitment" question.* This is the Kantian/Strawsonian issue. The plain language version gives up the distinction between *transcendental necessity* and *contingent psychology*. I need to state that.

      *Okay, ready to draft.*
answer: |-
  ### The Index Card: Decision Procedure for "Self-Refuting" Claims

  **Instructions:** Ask these questions in order. If you hit a **STOP**, the argument fails or passes to the judge. If you reach the end, the argument stands.

  **1. The Scope Check**
  *   **Question:** Is the opponent denying something absolute (e.g., "No truth exists") or something specific (e.g., "This evidence is bad")?
  *   **Sufficient Answer:** It must be an absolute denial about how reality or argument works.
  *   **STOP (NO):** If they are only criticizing a specific plan, fact, or value. *Ruling: Ordinary debate; this move does not apply.*

  **2. The Act Check**
  *   **Question:** Is the contradiction in the *speaking* itself, or in how they live their life?
  *   **Sufficient Answer:** The contradiction must happen the moment they open their mouth (e.g., arguing that argument is impossible).
  *   **STOP (NO):** If you have to check their behavior outside the round (e.g., "They say life is cheap but they eat food"). *Ruling: Too speculative; ignore.*

  **3. The Exit Check (Your Observation 1)**
  *   **Question:** Could they make their point without asserting it as true?
  *   **Sufficient Answer:** No. The claim *requires* them to treat it as true to be understood (e.g., "There is no truth" claims to be a truth).
  *   **STOP (NO):** If they can say, "I'm just expressing a feeling," or "I'm testing an idea," without losing their point. *Ruling: They opted out; argument fails.*

  **4. The Gap Check (Your Observation 2)**
  *   **Question:** Does proving they *must speak* this way prove the *world* is this way?
  *   **Sufficient Answer:** Only if the way we speak is the only way to know the world.
  *   **STOP (JUDGE):** This is a value judgment. *Handoff: The judge must decide if "how we must think" counts as "how things are."* (See Note A).

  **5. The Circle Check (Your Observation 3)**
  *   **Question:** Does the argument assume the conclusion to prove the conclusion?
  *   **Sufficient Answer:** No. It must show that *any* starting point leads to their conclusion, not just their preferred one.
  *   **STOP (NO):** If they only win by assuming their own rule is the only valid rule. *Ruling: Circular; argument fails.* (See Note B).

  **6. The Weight Check**
  *   **Question:** Does this logical trap outweigh hard evidence presented against it?
  *   **Sufficient Answer:** Yes, if the evidence relies on the very logic being trapped.
  *   **STOP (JUDGE):** This is a value judgment. *Handoff: The judge must decide if a logical trap beats empirical evidence.*

  **7. Final Ruling**
  *   **Decision:** If you passed 1, 2, 3, 5 and the Judge resolves 4 and 6 in favor, the point is won. Otherwise, it is not.

  ***

  **Note A (Theory Trade-off):** This step simplifies the difference between *pragmatic necessity* (we can't help saying it) and *metaphysical truth* (it is actually real). Plain language loses the philosophical nuance but stops students from claiming "we must say it" equals "it is fact."
  **Note B (Theory Trade-off):** This step simplifies *begging the question*. It rejects arguments that only work if you already agree with the speaker's definition of "reason" or "truth."

  ---

  ### Case Runs

  Here is the procedure applied bluntly to your three examples.

  **Case 1: The Relativist ("There is no objective truth.")**
  *   **Q1 (Scope):** Absolute denial. **Pass.**
  *   **Q2 (Act):** Contradiction is in the assertion. **Pass.**
  *   **Q3 (Exit):** Can they opt out? If they say "It is true that there is no truth," they cannot claim to be just venting. **Pass.**
  *   **Q4 (Gap):** Does speaking prove reality? **STOP (JUDGE).**
      *   *Judge Instruction:* You are being asked to decide if a statement that eats itself is false, or if it's just a special kind of statement. Does the rule of speech bind reality?
  *   **Q5 (Circle):** Is it circular? It assumes "truth" means "objective fact" to deny it. **Borderline.**
  *   **Result:** This does not win the round automatically. It kicks the can to the judge on Q4. Most judges will rule it a "logical error" by the speaker, but the procedure forces them to admit that is a value call, not a fact.

  **Case 2: Reasons for Belief ("You can't argue there are no reasons.")**
  *   **Q1 (Scope):** Absolute denial. **Pass.**
  *   **Q2 (Act):** Contradiction in arguing. **Pass.**
  *   **Q3 (Exit):** Can they opt out? They could say, "I am not arguing; I am causing you to believe via causation, not reason." (A hard line, but possible). **Borderline.**
  *   **Q4 (Gap):** Does needing reasons to speak prove reasons exist in the universe? **STOP (JUDGE).**
      *   *Judge Instruction:* You are being asked to decide if our human need for reasons proves reasons are real, or if we are just trapped in a system that requires them.
  *   **Q5 (Circle):** Does it assume reasons matter to prove reasons matter? **Yes.** It defines "argument" as "giving reasons."
  *   **Result:** **Fail on Q5.** Be honest with yourself: You have been using an argument that defines the game to win the game. It proves that *within debate*, reasons are required. It does not prove reasons exist outside the debate. The procedure catches this circularity.

  **Case 3: Free Will ("You chose to speak, so you have free will.")**
  *   **Q1 (Scope):** Absolute denial ("No free will"). **Pass.**
  *   **Q2 (Act):** Contradiction in acting/speaking. **Pass.**
  *   **Q3 (Exit):** Can they opt out? They can say, "I was determined to speak." They don't have to claim choice. **STOP (NO).**
      *   *Ruling:* The speaker can consistently claim they are a puppet who was determined to say "I am a puppet." The act of speaking does not force them to claim they chose it.
  *   **Result:** **Fail on Q3.** This argument collapses immediately. The opponent does not need to claim freedom to deny freedom; they only need to claim causation. The procedure kills this dead in 10 seconds.

  ---

  ### Meta-Analysis: What This Procedure Cannot Do

  You asked for blunt honesty about the limitations. Here is what is hiding behind the questions.

  **1. Which questions are judgment calls wearing procedural clothing?**
  *   **Question 4 (The Gap)** is the biggest one. It pretends to be a test, but it is actually the entire history of epistemology compressed into a yes/no. By handing this to the judge, you are admitting that logic alone cannot bridge the gap between "we must think X" and "X is true." The procedure forces the judge to own that bias.
  *   **Question 6 (The Weight)** is also a value judgment. You are asking a volunteer to weigh a logical trap against empirical evidence. There is no formula for this. Some judges value consistency over facts; others value facts over consistency. The procedure doesn't solve this; it just forces the judge to admit they are making the choice.

  **2. Can it certify a conclusion as true of the world?**
  *   **No.** It cannot. It can only certify that a conclusion is **unavoidable for a speaker**.
  *   If a student passes the whole procedure, they have proven: "You cannot coherently say otherwise." They have *not* proven: "The world is actually this way."
  *   *Example:* Passing the procedure on "Reasons for Belief" proves you cannot argue against reasons. It does not prove the universe contains reasons. It proves a rule of the game, not a law of physics.
  *   *Instruction for Judges:* If a move survives the procedure, it wins the *logic* point, but it does not automatically win the *truth* point. If the opponent offers a single piece of ordinary evidence (e.g., a scientific study) that contradicts the conclusion, the judge must weigh "Unavoidable Commitment" vs. "Observed Fact." The procedure does not tell them which is heavier.

  **3. What the plain-language version gives up.**
  *   By avoiding terms like "performative contradiction" or "transcendental argument," you lose the ability to distinguish between *pragmatic* self-refutation (it's useless to say) and *logical* self-refutation (it's impossible to be true).
  *   The procedure treats them the same. This is a feature for a 90-second prep, but it means you will sometimes reject arguments that are pragmatically weak but logically sound, or vice versa.
  *   You are trading philosophical precision for adjudicative consistency. In a high school round, this is the correct trade. In your adult philosophy group, you should tell them: "This card decides the debate, but it doesn't settle the philosophy."

  **4. How to weigh against ordinary evidence.**
  *   If a student survives this procedure, they have established a **presupposition**.
  *   If the opponent offers **evidence**, they are offering a **claim within the system**.
  *   *The Rule:* A presupposition usually beats a claim *within* the round, because the claim relies on the presupposition to be heard.
  *   *The Exception:* If the evidence shows the presupposition leads to absurdity in the real world (e.g., "We must assume humans are rational" vs. "Here is video of humans acting irrationally"), the judge must vote for the evidence.
  *   *Instruction:* Tell your judges: "If the logical trap makes the evidence impossible to discuss, vote for the trap. If the logical trap ignores the evidence, vote for the evidence." The procedure cannot automate this.
