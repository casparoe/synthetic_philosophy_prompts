prompt: |-
  I cover science and ideas for a living, which is apparently how I got talked onto the grant committee of a small family foundation — about $7M a year, and the donor's letter says we have to commit it within 18 months because the fund winds up in 2031. We're down to three finalists and I'm drafting the memo for Thursday, and I'd rather not just run the usual importance/tractability/neglectedness score sheet and call it a day. The three: (1) a renewal — seasonal malaria chemoprevention in two Nigerian states, twelve years of outcome data, roughly $5 per child per season, and a bigger donor will match us 1:1 but only if we commit by June; (2) a two-year-old, literally two-person outfit trying to get occupational heat-stress rules — shade, water, rest breaks, a maximum wet-bulb globe temperature cutoff — written into public-works procurement codes in three South and Southeast Asian countries, which almost nobody funds, which would be pretty self-enforcing if it ever passed (procurement rules stick), but which is basically lobbying whose success rate I can only guess to within an order of magnitude and which leaves almost nothing behind if it fails; (3) a sentinel wastewater-surveillance network for antimicrobial resistance across about forty cities in one region, which is really a purchase of information — the whole payoff is that five or ten years from now some regulator, drug developer or bigger donor does something different because the data exists. Two complications. First, one trustee wants to replace the product of the three scores with the minimum of them (treating them as bottlenecks rather than multipliers) and to add a fourth "reversibility" score for how much of the grant is recoverable if we're wrong about tractability; another says we should stop pretending we can rank these at all and just diversify across all three the way you'd hold a portfolio, especially since a decent chunk of each one's value is flow-through to what *other* actors later do rather than anything we buy directly. Second, someone on the committee swears neglectedness is just a stand-in for diminishing marginal returns and should be deleted as a column. Also the fund's 2031 sunset sits badly with payoffs that run to 2050, and I don't know how to weigh that honestly.

  What I want is a memo that takes a position, not a survey of cause-prioritization frameworks and not a list of who funds what — I can look up organizations myself. Recommend an actual split of the $7M across the three (including zero to one or two of them if that's where the reasoning lands), say which decision rule we should be using and defend that rule rather than just applying it, engage the strongest version of the case against your own recommendation, and be explicit about how the sunset date should and shouldn't change the math. Please also tell me where the recommendation is most fragile: which single estimate, if it came in three times higher or lower, would flip the answer, because my suspicion is the whole thing turns on one number nobody on our committee actually has.

  Give it back as a JSON object with exactly these fields: "recommendation" (one-sentence bottom line), "allocation" (an object mapping each cause to a dollar figure, summing to 7.0), "rule" (which decision rule to use and why, max 80 words), "scoring" (an array of one object per cause with keys "cause", "importance", "tractability", "neglectedness", "reversibility", each a 0–5 number plus a one-line justification, and "marginal_value_per_million" as your estimate with a short basis), "rejected_rule" (the rule you turned down and the one reason it loses), "sunset_handling" (how the 2031 wind-up should bear on the choice), "strongest_objection" (max 80 words), "what_would_change_my_mind" (an array of objects with keys "assumption", "how_far_it_must_move", "what_it_flips_to"), "confidence" (0–100 that a careful outsider given our numbers lands on roughly the same split), and "conditions" (an array of strings — what we should require of the grantees or revisit in 12 months). Don't also send a prose version; the JSON is the memo.
