  **BUREAU OF RADICAL INTERPRETATION**
  **FIELD MANUAL 84-D**
  **SUBJECT: PROTOCOLS FOR EX NIHILO LINGUISTIC ATTRIBUTION**
  **DATE: 14 OCTOBER 1984**
  **CLEARANCE: LEVEL 5 (OMNISCIENT)**

  **1.0 TRIANGULATION EQUIPMENT REQUISITION**
  1.1 Prior to the attribution of any propositional attitude to a Subject, the Agent must establish a causal chain linking the Agent, the Subject, and a shared object in the environment.
  1.2 Agents must submit Form T-84 (Triangulation Equipment Requisition) to verify the presence of all three vertices. Thought is not authorized in dyadic interactions.
  1.3 If the Subject observes Object X, but the Agent observes Object Y, no belief regarding X or Y may be recorded. The Agent must physically relocate until perceptual convergence is achieved. Failure to triangulate results in the nullification of the Subject's rationality status.

  **2.0 CHARITY ADJUSTMENT LEDGER**
  2.1 In accordance with the Principle of Maximizing Agreement, Agents must presume the Subject's utterances are predominantly true and rational.
  2.2 In instances where the Subject's statement contradicts observable reality (e.g., Subject states "It is raining" during drought), the Agent must not attribute error to the Subject.
  2.3 Instead, the Agent must log a revision in the Charity Adjustment Ledger, altering their own belief state to align with the Subject's assertion. The Agent is hereby authorized to perceive rain where none exists to preserve the Subject's rationality quota.
  2.4 Persistent disagreement indicates a failure of the Agent's charitable calibration, not the Subject's confusion. Agents exceeding five disagreement incidents per hour will be referred for recalibration.

  **3.0 HOLISM CHECK PROCEDURES**
  3.1 Beliefs possess meaning only in relation to the total web of belief. No single belief can be attributed in isolation.
  3.2 Agents must initiate a Holism Check before recording any individual sentence translation. This check requires the mapping of the Subject's entire belief system, including desires, intentions, and background theories.
  3.3 Attribution of specific terms (e.g., "rabbit," "gavagai") is prohibited until the Holism Check reaches 100% completion.
  3.4 Given the infinite nature of belief webs, Agents are advised to suspend all translation activities indefinitely while awaiting Holism Check clearance. Premature attribution constitutes a violation of Semantic Holism Statutes.

  **4.0 INDETERMINACY FILING SYSTEM**
  4.1 The distinction between conceptual scheme and empirical content is rejected. There are no alternative conceptual schemes, only variations in charitable interpretation.
  4.2 When multiple translation manuals are compatible with all physical evidence yet mutually incompatible, Agents must utilize the Indeterminacy Filing System.
  4.3 Both incompatible translations shall be certified as equally valid. The Agent shall file both versions under Separate but Equal Truth Designations.
  4.4 Costs associated with maintaining contradictory reality models shall be billed directly to the Subject under Ambiguity Surcharge Code 99. The Subject is responsible for the ontological overhead required to sustain multiple valid interpretations of their own utterances.

  **5.0 GENERAL COMPLIANCE**
  5.1 Agents must refrain from assuming any shared vocabulary exists prior to full interpretation.
  5.2 Agents must refrain from assuming any shared vocabulary can exist prior to full interpretation.
  5.3 Success is defined as the complete dissolution of the interpreter's distinct perspective into the Subject's coherent web of belief. Upon successful interpretation, the Agent will no longer exist as a separate interpretive entity.

  **AUTHORIZED BY:**
  **DIRECTORATE OF MEANING AND CAUSATION**
