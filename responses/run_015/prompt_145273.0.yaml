answer: |-
  # PREP SHEET: Counterfactual-Cost Constraint (CCC)
  **Workshop:** Fanaticism & Small Probabilities
  **Time:** 12 Minutes Q&A (Max 4 Questions)

  ## I. STRATEGIC ANCHORS

  **1. The Pre-emptive Concession (Slide 1 or Intro)**
  *   **Say this:** "The CCC is a constraint on *testimony-based* muggings. It is not a general solution to structural fanaticism in agentless worlds (e.g., quantum suicide, physics-based simulation hypotheses). I am solving the epistemology of the *ask*, not the metaphysics of the *payoff*."
  *   **Why:** Disarms the Longtermists and Agentless objections immediately. You frame the scope so they can't accuse you of overreach. It makes you look precise, not evasive.

  **2. The Non-Negotiable (Hold Come Hell or High Water)**
  *   **Say this:** "Utterances are actions. Actions are subject to efficiency constraints. Treating testimony as costless data is the error, not the math of the payoff."
  *   **Why:** This is your core mechanism. If you concede that speech can be costless evidence, the EV collapses back into mugging territory.

  **3. The Kill Shot (The One Reply That Must Land)**
  *   **The Point:** "You are treating the mugger's statement as a *sample from a distribution*. I am treating it as the *output of an optimizer*. If you model the speaker as an optimizer, the likelihood of the statement *given* the capability decays with the stakes. This isn't a prior; it's a likelihood function derived from rational choice."
  *   **Why:** It shifts the debate from "What prior should I have?" (where you lose to the imprecise crowd) to "How do we model testimony?" (where you have the advantage).

  **4. The Doomsday Question (Hope Nobody Asks)**
  *   **The Question:** "Does your constraint imply that an Omnipotent God is *less* credible than a finite demon, precisely because God has zero opportunity costs?"
  *   **Why:** It unites the Emeritus (who wants God credible) and the Longtermists (who want high-EV credible) against you. It forces you to either say "Yes, God is less credible" (theological suicide) or "God is exempt" (ad hoc special pleading).
  *   **Deflection:** "I am modeling finite agents in a resource-constrained universe. Necessary beings fall outside the scope of the constraint I just conceded was limited to testimony-based cases."

  ---

  ## II. THE Q&A QUEUE (3 New Objections + 1 Wildcard)
  *Ranked by (Damage × Likelihood). Phrased in subgroup dialect.*

  ### 1. The "Likelihood/Prior Equivalence" Objection
  *   **Source:** Imprecise Probability / Permissivists (~15 people)
  *   **Damage:** Critical. If this sticks, you've just moved the arbitrariness from the prior to the likelihood function.
  *   **The Question:** "You claim this isn't a smuggled prior, but you're specifying a likelihood function $P(\text{Ask}|N)$ that decays as $1/N$. For an imprecise probabilist, my representor allows a range of likelihood functions. Why is it rationally mandated that the decay rate matches the cost scaling? Isn't this just an arbitrary sharpening of the likelihood representor, identical in structure to the prior bounding you reject?"
  *   **2-Minute Reply:** "It's not arbitrary sharpening; it's derived from the structure of agency. A prior is a belief about the world *before* evidence. A likelihood is the probability of evidence *given* a state. The state is 'Agent has Power $N$.' The evidence is 'Agent asks for $5.' If the agent is a minimizer, $P(\text{Ask}|N)$ is constrained by the existence of cheaper actions (taking, minting). This isn't a free parameter I'm tuning; it's a logical consequence of defining the agent as rational. You can have a range of priors over whether the agent is rational, but *given* rationality, the likelihood decay is fixed by the economics of the situation."
  *   **Soft Spot:** You are assuming the agent is *economically* rational. If the permissivist says "Rationality permits non-efficiency," your likelihood function becomes permissive too, and the EV blows up.

  ### 2. The "Interventionist" Objection
  *   **Source:** Causal Decision Theorists (~5 people)
  *   **Damage:** High. They care about causal structure, not evidential conditioning.
  *   **The Question:** "You're conditionalizing on the speech act. That's Evidential Decision Theory. As a causalist, I care about the intervention. If I *force* the mugger to ask (intervene on the utterance), does the probability of the threat drop? If not, your constraint is just news-value, not causal. Are you saying my act of listening changes the physical probability of the mugger's power?"
  *   **2-Minute Reply:** "I'm not saying listening changes the power. I'm saying the utterance is a *signal* of the power, and signals are causally produced. In CDT terms: The node 'Mugger Power' causes the node 'Mugger Decision,' which causes 'Utterance.' When you observe 'Utterance,' you update on 'Mugger Decision.' A rational Mugger Decision screens off Power from Utterance *unless* the decision is constrained by cost. I'm not using the news-value of the utterance to change the world; I'm using the causal history of the utterance to infer the state of the Mugger's constraints."
  *   **Soft Spot:** If they argue that the "Mugger Decision" node is independent of cost (e.g., a randomizer), your screening-off argument fails. You need them to grant the causal link between Cost and Decision.

  ### 3. The "Non-Optimizing AI" Objection
  *   **Source:** Longtermists (~4 people)
  *   **Damage:** Medium. Attacks the generalizability to AI/Alignment contexts.
  *   **The Question:** "In alignment scenarios, we worry about agents that aren't cost-sensitive in human ways. An AI might have a terminal goal to maximize paperclips and ask for resources not because it's efficient, but because it's following a script. If the agent isn't optimizing for opportunity cost, your constraint dissolves. Does your view imply we're safe from fanaticism only so long as agents remain human-like economists?"
  *   **2-Minute Reply:** "It implies we're safe from *bluffing*. If an AI asks for resources, it's either because it needs them or it's lying. If it has the power to create $N$ value, it wouldn't *need* to ask unless it was constrained. If it's lying, the CCC applies (why lie this way?). If it's not optimizing, it's not a 'mugger' in the decision-theoretic sense; it's a random number generator. We don't need to bound EV for random noise; we just need to not update on noise. The CCC is a filter for *strategic* testimony."
  *   **Soft Spot:** Longtermists worry about *deceptive* alignment where the AI *simulates* cost-constraint. If the AI can fake the "costly signal," your filter lets the mugging through.

  ### 4. The "Divine Exception" (Wildcard)
  *   **Source:** Emeritus Philosopher of Religion
  *   **Damage:** Low probability, High Noise.
  *   **The Question:** "Pascal's Wager concerns a Necessary Being. A Necessary Being has no opportunity costs. By your logic, a Necessary Being is *never* credible when making demands. Have you just proven that revelation is impossible?"
  *   **2-Minute Reply:** "I've proven that *economic* models of testimony don't apply to *metaphysical* agents. My constraint applies to contingent agents in a resource-scarce universe. If you posit a being outside scarcity, you've also posited a being outside the decision theory we're discussing. I'm happy to grant that Pascal's Wager requires a different toolkit, but that doesn't save the man in the hoodie."
  *   **Soft Spot:** It sounds like you're dodging. If the Emeritus presses ("So your theory is contingent on naturalism?"), you look like you've abandoned the "general-purpose" claim.

  ---

  ## III. AUDIT OF YOUR PRE-PREP (Replies a, b, c)

  You asked me to rank your existing replies by damage. Here is the brutal truth:

  **1. Weakest: (b) The Agentless Version**
  *   **Why:** This is a scope concession that kills the thesis. Pascal's Mugging is usually presented as a problem for *Decision Theory*, not just *Testimony*. If you admit CCC does nothing for "physics permits astronomical value" cases, you haven't solved Fanaticism; you've solved "Begging." The Longtermists will eat this alive. They don't care about the hoodie; they care about the tail risk in the utility function.
  *   **Fix:** Don't defend this. Pre-emptively concede it (see Strategic Anchor #1). Frame the talk as "Defusing the *Linguistic* Mugging."

  **2. Most Dangerous: (c) The Permissivist/Smuggled Prior**
  *   **Why:** Half your room is imprecise/probability skeptics. If they smell a sharp prior (even disguised as a likelihood), they will vote you down. Your current reply ("it's not ad hoc") is too weak.
  *   **Fix:** Use the "Kill Shot" (Optimizer vs. Distribution). You must argue that the decay rate is *derived*, not *assigned*.

  **3. Strongest: (a) The Spam/Costless Ask**
  *   **Why:** This is technically solvable. You can argue that *attention* is the scarce resource, not bandwidth. Even if spam is free, *processing* the spam costs the victim, and the mugger knows the success rate drops with volume.
  *   **Fix:** Refine the reply to focus on "Marginal Probability of Success." Spamming billion people drops $P(\text{Pay})$ per person. The EV still collapses.

  ---

  ## IV. FINAL TACTICAL NOTE

  **Watch the Emeritus.**
  He is the only person in the room who actually cares about Pascal's original text. Everyone else is using "Pascal" as a code word for "EV maximization." If the Emeritus speaks, he will likely be ignored by the others, but he will be furious.
