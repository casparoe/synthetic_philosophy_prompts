          5.  Conclusion on why it still matters.

  7.  (Mental Check against Aumann's actual paper): Aumann (1976) "Agreeing to Disagree". Yes, Common Prior is essential. Halpern & Kets later explored "Agreeing to Disagree with Heterogeneous Priors." I should mention that dropping CPA allows disagreement, but that doesn't make the original theorem irrelevant, just conditional.

