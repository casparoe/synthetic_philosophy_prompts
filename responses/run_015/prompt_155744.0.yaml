answer: |-
  This is a sophisticated deployment of the **Phenomenal Concept Strategy (PCS)**. Your core triad (Claims 1, 3, and 4) is the standard, robust physicalist defense against the Knowledge Argument. It is internally consistent and widely recognized as the strongest physicalist move available.

  Your intuition that you are "paying for the same thing twice" is correct. You are trying to extract two different advantages from the distinction between **knowledge** and **ability** (Claim 2 and Claim 5), but Claim 5 creates a tension with your metaphysics of concepts (Claim 4).

  Here is the stress test, ranked by severity.

  ### 1. Severe Tension: Claim 5 vs. Claim 4 (The Fading-Mary Problem)
  **The Conflict:**
  Claim 4 states that phenomenal concepts (PCs) are the "guise" required to grasp the fact, and these concepts are acquirable *only* through experience. Claim 5 states that Fading Mary loses the experience (and the associated abilities to imagine/recognize) but retains the knowledge.

  If PCs are grounded in the capacity to recognize or imagine the experience (as most PCS accounts hold), then losing the ability to imagine/recognize red implies **losing the Phenomenal Concept**. If she loses the PC, she loses the "guise." If she loses the guise, she cannot grasp the proposition (Claim 2). Therefore, on your own terms, Fading Mary should *not* know what red looks like anymore; she should only know *that she used to know*.

  By insisting she still "knows what it looked like" (Claim 5), you are trying to have the knowledge float free of the concept that makes it possible (Claim 4). You used the Knowledge/Ability distinction in Claim 2 to defeat the Ability Hypothesis, and you are using it again in Claim 5 to support a memory intuition, but Claim 4 pulls the rug out from under Claim 5.

  **What has to give:**
  You must soften Claim 5. You cannot have it both ways: either the PC is essential to the knowledge (Claim 4), or the knowledge survives the loss of the PC's functional role (Claim 5).

  **Cheapest Fix:**
  Reframe Claim 5. Do not insist she retains the *phenomenal knowledge*. Instead, argue she retains a **non-phenomenal memory trace** that allows her to truly say, "I remember having that concept," without currently possessing the concept.
  *   *Revision:* "In the Fading-Mary case, she loses the phenomenal concept and thus the phenomenal knowledge, but retains a non-phenomenal propositional memory that she *had* such knowledge."
  *   *Cost:* You lose the intuitive punch of "she still knows what it's like."
  *   *Benefit:* It aligns perfectly with Claim 4 and saves Physicalism.

  ### 2. Moderate Tension: Claim 6 vs. Claim 3 (The Ineffability Trap)
  **The Conflict:**
  Claim 3 says there are no new facts (just new guises). Claim 6 says what she learns is ineffable (cannot be communicated).
  If Mary and the scientists share the *same fact*, standard communication should be possible. If I know Fact F under Guise A, and you know Fact F under Guise B, I can usually translate. If it is truly *ineffable*, it suggests the content itself is private, which nudges toward dualism (new facts).

  **What has to give:**
  The definition of "ineffable" in Claim 6.

  **Cheapest Fix:**
  Clarify that the **fact** is effable, but the **mode of presentation** is not transferable.
  *   *Revision:* "She can communicate the *fact* (e.g., 'Red experience is neural state N'), but she cannot transfer the *phenomenal mode of presentation* to those who lack the concept."
  *   *Cost:* Nuance. You have to be careful not to say "she can't tell them what she learned" without qualifying "in a way that grants them the concept."
  *   *Benefit:* Protects Claim 3 from dualist attacks.

  ### 3. Minor Tension: Claim 2 (Propositional vs. Recognitional)
  **The Conflict:**
  Claim 2 insists the knowledge is *propositional*. Some PCS proponents argue phenomenal concepts are *recognitional* or *non-descriptive*, and forcing them into a "propositional" box invites the objection: "What is the predicate?"
  However, this is not a fatal conflict, merely a terminological vulnerability. Many PCS defenders (like Loar) successfully argue for phenomenal *propositions*.

  **What has to give:**
  Nothing, provided you define "propositional" loosely enough to include demonstrative concepts (e.g., "This experience is thus").

  **Cheapest Fix:**
  Keep it, but be prepared to defend that "knowing what it is like" has truth conditions.

  ### 4. No Conflict: Claims 1, 3, and 4
  **Status:** **Fine as they stand.**
  These three form the backbone of the Phenomenal Concept Strategy.
  *   **1** accepts the intuition (Mary learns something).
  *   **3** maintains the ontology (Physicalism).
  *   **4** explains the gap (Epistemic, not Ontological).
  There is no internal friction here. This is your strong suit.

  ---

  ### The "Paying Twice" Diagnosis
  You feel like you're paying twice because **Claim 2 and Claim 5 are doing the same work.**
  *   In **Claim 2**, you separate Knowledge from Ability to refute the Ability Hypothesis.
  *   In **Claim 5**, you separate Knowledge from Ability to refute the idea that memory loss entails knowledge loss.

  You are using the same lever to open two different doors, but the hinge (Claim 4: The nature of the Concept) breaks under the second load. You don't need Claim 5 to be as strong as you want it to be to make your main point work.

  ### The Single Revision to Tidy Up the Most
  **Drop the strong assertion in Claim 5.**

  If you revise Claim 5 to acknowledge that Fading Mary loses the *phenomenal concept* (and thus the active phenomenal knowledge) but retains a *memory of the fact*, you solve the tension with Claim 4 immediately.

  **Why this is the best fix:**
  1.  **Saves the Core:** It protects the integrity of the Phenomenal Concept Strategy (Claim 4), which is your main argument.
  2.  **Reduces Surface Area:** Claim 5 is an intuition pump, not a premise. If the intuition conflicts with the metaphysics, cut the intuition.
  3.  **Pre-empts Objections:** Opponents love the Fading-Mary case. By conceding she loses the *concept*, you deny them the claim that she retains "dualist knowledge" without the experience.

  **Recommended Wording for Claim 5:**
  > "5. The Fading-Mary case: If she loses colour vision and the ability to imagine red, she loses the *phenomenal concept* and thus the active phenomenal knowledge. She retains only a non-phenomenal memory that she *once possessed* that knowledge. This follows from 4: no concept, no grasp of the fact under that guise."

  This aligns 5 with 4, removes the "paying twice" feeling, and leaves your core argument (1, 2, 3, 4, 6) intact and robust.
