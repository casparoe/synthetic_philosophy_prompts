answer: |-
  This is a sharp argument, and it cuts right to the heart of the "normativity objection" against Lewis. You are right to feel suspicious: the chain smuggles in a normative conclusion from a game-theoretic premise.

  Here is the diagnosis of the slip, the literature landscape, and a recommendation on how to salvage the chapter without sacrificing your intuition in (6).

  ### The Primary Slip: Step (5) (The Normative Equivocation)

  The critical error is in **Step (5)**: *"So by (1)-(2), individuals in P are still genuinely bound by R."*

  This step equivokes on the word **"bound."**
  *   **Lewisian Sense:** "Bound" means *prudentially rational*. Given your preferences (to coordinate) and your beliefs (others will do R), game theory dictates you should do R. It is a hypothetical imperative: *If* you want to coordinate, *then* you ought to conform.
  *   **Your Sense (in Step 6):** "Bound" means *morally obligated*. This implies a categorical force that persists even if the coordination is useless or harmful.

  Lewis's account explains why conventions are **stable**, not why they are **morally binding**. Lewis is a Humean; he distinguishes sharply between artificial virtues (conventions) and natural virtues (morality). For Lewis, if a convention becomes harmful (a "zombie"), the *prudential* reason to follow it may remain (due to expectations/punishment), but the *moral* reason evaporates.

  **If you reject (5)** (by clarifying that Lewis only generates prudential reasons, not moral obligations), you can keep (6). Lewis would agree with (6): if the convention is harmful, moral insight trumps prudential convention. The "obligation" in (5) was never moral to begin with.

  **The Cost:** You must concede that Lewisian conventions do not ground *moral* obligations on their own. They only ground *rational* expectations. If you want conventions to ground moral duties, Lewis is the wrong framework (Margaret Gilbert or Seamus Miller might be better).

  ### The Secondary Slip: Step (4) (The Preference Condition)

  There is a more technical Lewisian objection available to you regarding **Step (4)**.

  Lewis's definition requires a **conditional preference for conformity**: I prefer to do R *if* others do R, *because* R solves the coordination problem.
  *   In a **Zombie Case**, the coordination problem has vanished (per Step 3).
  *   If the problem is gone, the payoff structure changes. If doing R is actively harmful (deters research), then even if others do R, my preference might shift to *not* doing R (or doing R* instead).
  *   If my preference shifts, **it is no longer a Lewisian convention** by definition. It is merely a habit or a coercive rule.

  **If you reject (4)** (by arguing that informed agents in a zombie case lose the conditional preference), you break the chain earlier. The regularity persists, but it ceases to be a *convention*.

  **The Cost:** This requires a strong empirical claim: that researchers *actually* lack the preference to conform once they realize the harm. If they still prefer to conform (to avoid administrative hassle, even if scientifically useless), then it remains a convention, and you are back to the Step (5) problem.

  ### Literature Map: Settled vs. Contested

  You asked to distinguish consensus from debate. Here is how the field currently stands on the premises you are using.

  #### 1. The Definition of Convention (Step 1)
  *   **Settled:** Lewis defines convention via coordination equilibria, common knowledge (or mutual belief), and conditional preferences. Everyone agrees this is Lewis's view.
  *   **Contested:** Whether **Common Knowledge** is strictly required. Many (e.g., Skyrms, Vanderschraaf) argue "common belief" or even weaker probabilistic expectations suffice. If you weaken this, "zombie" conventions might be easier to dissolve because expectations are less robust.

  #### 2. The Source of Normativity (Step 5)
  *   **Settled:** Lewis's account is fundamentally **descriptive and game-theoretic**. It explains stability.
  *   **Contested:** Whether this stability translates to **obligation**.
      *   **The Orthodoxy:** Lewis provides an account of *rationality*, not *obligation*. (See: David Gauther, *Morals by Agreement* critiques).
      *   **The Gilbert Critique:** Margaret Gilbert (*On Social Facts*) argues Lewis fails to capture the *normativity* of social groups. She claims Lewisian conventions lack "joint commitment," which is required for genuine obligation. If Gilbert is right, your Step (5) is false even on Lewis's own terms regarding social bindingness.
      *   **The Millikan Critique:** Ruth Millikan (*Language, Thought, and Other Biological Categories*) argues conventions are defined by their *proper function*. If the function vanishes (zombie case), the convention is "defective" or dead, even if the behavior persists.

  #### 3. Moral vs. Artificial Virtues
  *   **Settled:** Lewis distinguishes conventions (arbitrary solutions to coordination) from moral norms (non-arbitrary solutions to cooperation/conflict).
  *   **Contested:** Whether this distinction holds. Some argue all norms evolve from coordination problems (e.g., Brian Skyrms, *Evolution of the Social Contract*). If you take the evolutionary view, "zombie" moral norms are harder to dismiss because they may serve latent functions not immediately visible (Step 3 might be empirically false).

  ### Recommendation for the Chapter

  To keep your intuition in (6) while remaining faithful to the philosophy, I recommend **rejecting Step (5)** and qualifying Step (1).

  **The Argument Revision:**
  1.  Accept Lewis's definition (1).
  2.  Argue that Lewisian conventions generate **prudential rationality**, not **moral obligation**.
  3.  In Zombie cases, the *prudential* reason to conform may persist (due to fear of sanction or inertia), but the *moral* permission to break the rule remains intact.
  4.  Therefore, Lewis's account does not entail that individuals are "bound" in the moral sense. It only entails they are "stuck" in an equilibrium.
  5.  This validates (6): Individual moral insight allows one to override the prudential reason.

  **Why this is better:**
  It avoids the trap of trying to make Lewis a moral theorist. It frames the "Zombie Convention" not as a failure of Lewis's account, but as a demonstration of its limits. Lewis explains why we *do* things; he does not explain why we *should* (morally) do them when they cease to serve a purpose.

  **Drafting Suggestion:**
  > "The slip lies in conflating the *stability* of a regularity with the *normativity* of an obligation. Lewis explains why zombie conventions persist (inertia of expectation), not why they bind the conscience. Step (5) claims individuals are 'genuinely bound,' but Lewis only shows they are pragmatically incentivized. Once we distinguish prudential rationality from moral obligation, (6) is preserved: the researcher is pragmatically pressured to conform, but morally permitted to deviate."

  This allows you to critique the *social power* of zombie conventions (they are hard to break) without conceding that they are *right* to follow.
