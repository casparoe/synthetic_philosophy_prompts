prompt: |-
  hey — i'm drafting a chapter on Lewisian conventions and this argument is definately suspicious. here's the chain i'm stuck on:

  (1) For Lewis, a convention is an arbitrary regularity that solves a recurrent coordination problem in some population P, sustained by common knowledge and a conditional preference for conformity.

  (2) Once R is in place, the reason any individual in P has to stick with R is that deviation breaks coordination and frustrates others' expectations.

  (3) Now take a zombie convention: a regularity that survives long after the original coordination problem has vanished or changed form. Think of hyper-elaborate IRB consent rituals for minimal-risk online survey work — the original problem (protecting subjects from physical harm) isn't there anymore.

  (4) Even in zombie cases, common knowledge still holds: everyone knows everyone expects R, and people generally prefer not to rock the boat.

  (5) So by (1)-(2), individuals in P are still genuinely bound by R.

  (6) But if R is now actively harmful — it deters useful research, creates false assurance, etc. — then an individual researcher who sees this clearly ought to be able to break R without being irrational or immoral.

  (7) If Lewis denies (6), then individual moral insight is impossible whenever a zombie convention is in place.

  (8) That seems false. So either Lewis's account doesn't generate real obligations, or something in the chain is wrong.

  (9) Therefore conventions can't ground obligations in zombie cases.

  where's the slip? i really want to keep (6) — that individual insight should matter — but i'm not sure if i'm misapplying the preference condition (maybe it has to be present-tense?), or if there's a scope shift between population-level regularity and individual-level duty. which step should i reject and what does that cost?

  please also separate what's settled in the literature from what's genuinely contested — don't present one reading of Lewis as the consensus if it's actually fought over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Lewisian conventions (David Lewis, *Convention: A Philosophical Study*).
      *   **Problem:** The user has drafted an argument chain (1-9) claiming that Lewis's account implies obligations persist even in "zombie conventions" (where the original purpose is gone/harmful), which conflicts with the intuition that individuals should be able to break harmful conventions based on moral insight.
      *   **Goal:** Identify the "slip" in the argument, advise on which step to reject, explain the costs, and distinguish settled vs. contested literature.
      *   **Constraint:** Do not present one reading of Lewis as consensus if it's contested.
      *   **Tone:** Academic, helpful, precise, philosophical.

  2.  **Deconstruct the Argument Chain:**
      *   (1) Definition of Convention (Lewisian): Arbitrary regularity, recurrent coordination problem, common knowledge, conditional preference. -> *Generally accurate to Lewis.*
      *   (2) Reason for conformity: Deviation breaks coordination/frustrates expectations. -> *Accurate to the coordination equilibrium logic.*
      *   (3) Zombie Convention Example: IRB rituals for minimal-risk surveys (purpose vanished/changed). -> *Plausible example of a "dead" or "zombie" norm.*
      *   (4) Common Knowledge/Preference persists: People expect it, prefer not to rock the boat. -> *Empirically plausible.*
      *   (5) Conclusion from (1)-(2): Individuals are *bound* by R. -> *Here lies a potential equivocation on "bound".*
      *   (6) Normative Claim: If R is harmful, an individual *ought* to be able to break it without being irrational/immoral. -> *User wants to keep this.*
      *   (7) Lewis Denial Claim: If Lewis denies (6), moral insight is impossible. -> *Strong claim, needs scrutiny.*
      *   (8) Intuition: (7) is false.
      *   (9) Final Conclusion: Conventions can't ground obligations in zombie cases.

  3.  **Identify the Philosophical "Slip":**
      *   *The Core Issue:* Lewis's account is primarily *descriptive* and *game-theoretic*, not robustly *normative* in the moral sense. He explains why conventions *persist* and why agents have a *pragmatic reason* to conform, not necessarily a *moral obligation*.
      *   *Step (5) Equivocation:* "Bound by R." Does this mean "pragmatically rational to follow" or "morally obligated to follow"? Lewis argues for the former. The user's argument slides into the latter in step (6) and (7).
      *   *Step (1) Condition:* The "conditional preference for conformity." Lewis requires that agents prefer to conform *if others do*. In a zombie case, does this preference hold? If the convention is actively harmful, the preference might vanish for reflective agents, breaking the definition of convention *for them*, even if the regularity persists.
      *   *Step (2) Reason:* The reason is coordination. If coordination is no longer valuable (because the problem vanished), the reason evaporates.
      *   *Literature Context:* There is a huge debate on whether Lewisian conventions generate *normativity* (obligation) or just *rationality* (prudence). Gilbert, Millikan, and others have critiqued Lewis on this.

  4.  **Evaluate Specific Steps for Rejection:**

      *   *Reject (5)?* This is the strongest candidate. Lewis explains *reasons for action* based on preferences, not *obligations* that override moral insight.
      *   *Reject (1)?* No, that's the definition. But one could argue the definition isn't met in zombie cases (see below).
      *   *Reject (4)?* One could argue that in zombie cases, the "conditional preference" is weak or non-existent for informed agents. If I know it's useless, I don't prefer to do it even if others do (unless there's punishment).
      *   *Reject (7)?* Lewis might not deny (6). He might say you have a *prudential* reason to follow it, but a *moral* reason to break it. Morality trumps prudence.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the argument. It touches on the "normativity of convention" debate.
      *   **Diagnosing the Slip:** Focus on the equivocation in Step (5) between *prudential rationality* and *moral obligation*. Lewis is a Humean; he distinguishes "is" (regularity) from "ought" (moral).
      *   **Analyzing Step (1) & (4) (The Preference Condition):** This is the technical Lewisian point. In a zombie case, do agents *really* have a conditional preference to conform? If the outcome is harmful, the payoff matrix changes. The equilibrium might dissolve for reflective agents.
      *   **Analyzing Step (5) (The Normative Leap):** Lewis provides an account of *why we do*, not necessarily *why we must* (morally).
      *   **Literature Map (Settled vs. Contested):**
          *   *Settled:* Lewis defines convention via coordination equilibria and common knowledge.
          *   *Contested:* Does this generate obligation? (Gilbert says no, needs joint commitment). Does it apply to moral norms? (Lewis says mostly no, they aren't arbitrary). Is common knowledge required? (Some say mutual belief is enough).
      *   **Recommendation:** Reject or qualify (5). Distinguish prudential vs. moral "oughts." Or challenge (4) regarding the preference condition in zombie cases.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Lewis think conventions generate obligations?* In *Convention*, he talks about "oughts" but they are hypothetical imperatives ("If you want to coordinate, you ought to..."). He explicitly denies that conventions are the source of *moral* obligations in later work (*Languages of Mind* etc.).
      *   *The "Zombie" aspect:* If the coordination problem is gone, is it still a Lewisian convention? Lewis requires a *recurrent coordination problem*. If the problem is gone, strictly speaking, it fails condition (1). So the regularity persists, but it's no longer a *convention* by Lewis's lights. It's just a habit or a rule.
      *   *So, Step (3) to (5) transition:* If the problem vanished, it's not a convention anymore. Therefore, (5) is false because the antecedent of (1) isn't met.
      *   *Counter-argument:* But the *expectations* remain (Step 4). Lewis emphasizes expectations. If expectations remain, the coordination problem might be "meta-coordination" (coordinating on the expectation itself). This is where it gets tricky.
      *   *Best advice:* The slip is likely in (5) conflating rationality with obligation, OR in (3)/(5) assuming a zombie regularity still counts as a Lewisian convention.

  7.  **Finalizing the Advice:**
      *   **Primary Slip:** Step (5). Lewisian conventions generate *prudential* reasons, not *moral* obligations that override independent moral insight.
      *   **Secondary Slip:** Step (1)/(3). If the coordination problem is truly gone, it technically ceases to be a Lewisian convention, even if the behavior persists.
      *   **Literature Check:** Cite Margaret Gilbert (joint commitment vs. common knowledge), Ruth Millikan (proper functions), and maybe Sugden or Skyrms on the evolution of norms. Mention the "Normativity Objection."

  8.  **Structure of the Output:**
      *   Direct Answer: Where the slip is.
      *   Detailed Analysis of the Slip (The Normativity Gap).
      *   Alternative Diagnosis (The Definition Gap).
      *   Literature Map (Settled vs. Contested).
      *   Strategic Recommendation for the Chapter.

  9.  **Review against Constraints:**
      *   Did I separate settled/contested? Yes.
      *   Did I avoid presenting one reading as consensus? Yes, will highlight the Gilbert critique.
      *   Did I respect the user's desire to keep (6)? Yes, by showing Lewis doesn't necessarily contradict (6).

  10. **Final Polish:** Ensure tone is collaborative ("here's where the tension lies") rather than corrective ("you are wrong"). (Self-correction: Ensure I don't attribute views to Lewis he didn't hold. Lewis is careful about 'ought'.)

  *(Self-Correction during drafting)*: I need to be careful about Step (1). Lewis defines convention as solving a *recurrent* coordination problem. If the problem vanishes, does the convention vanish? Lewis says conventions persist because of *expectations*. If the problem is gone, but expectations remain, is it still a convention? Lewis might say it's a "degenerate" convention or simply a regularity sustained by inertia. But strictly, the *reason* for the preference is the coordination. If coordination yields no value (or negative value), the preference condition fails. I should emphasize the **Preference Condition** in Step (4).

