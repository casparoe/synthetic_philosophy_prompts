answer: |-
  **Subject:** Re: The Metaphysics of Blame in Cold War Historiography

  **To:** The Seminar Group
  **From:** [Your Name/Role]
  **Date:** 24 October 2023

  **Introduction: The Category Error of Moral Agency**

  The proposition before us today concerns the analytical utility of the question, "Who started the Cold War?" It is my contention that this framing is not merely empirically difficult to answer, but is fundamentally flawed at the level of historiographical method. To ask "who started it" is to commit a category error: it imports the logic of individualistic moral psychology into a domain governed by systemic, multi-agent historical processes. States are not moral agents; they are complex bureaucracies operating within structural constraints. Consequently, assigning blame to a singular initiator presupposes a level of unitary volition that simply does not exist in international relations.

  I argue that we must abandon the search for a culpable party in favour of a framework of "distributed institutional responsibility." This approach shifts our analytical gaze from the identification of a first mover to an examination of the structural conditions that rendered escalation rational for all parties at successive decision nodes. By doing so, we move beyond the assignment of guilt and towards an understanding of the mechanisms of systemic lock-in.

  **The Metaphysical Premise of the Tripartite Historiography**

  To demonstrate the pervasiveness of this error, we need only examine the standard tripartite division of Cold War historiography: the Traditionalist, Revisionist, and Post-Revisionist schools. Conventionally, we treat these as empirical disagreements regarding the archival record. I suggest, however, that they share a deeper, unexamined metaphysical premise: the assumption of unitary state agency.

  The Traditionalist school, dominant in the early post-war period, posits Soviet expansionism as the catalyst. Here, the USSR is treated as a monolithic actor possessing a coherent, aggressive will, embodied in the person of Stalin. The moral calculus is straightforward: the aggressor is to blame. Conversely, the Revisionist school, emerging in the 1960s, inverts this moral vector. It identifies American economic imperialism as the driving force, casting the United States as the unitary aggressor seeking to close the "Open Door." While the empirical finger-pointing reverses, the metaphysical structure remains identical: a singular state actor made a conscious, avoidable choice to initiate hostility.

  Even the Post-Revisionist synthesis, which sought to mitigate this blame through the lens of the security dilemma and mutual misperception, fails to escape the trap. By focusing on "misperception," Post-Revisionists still imply that there was a correct perception available to a rational unitary actor, which, had it been chosen, would have averted conflict. This retains the notion that the state is capable of a unified psychological response to external stimuli.

  All three schools, therefore, remain bound by the fiction of the state-as-individual. They debate *which* individual is guilty, rather than questioning the validity of applying guilt to the system itself. Resolving the empirical disputes between these schools—determining definitively whether Truman or Stalin was more intransigent in 1946—would leave the conceptual problem intact. We would merely have a more accurate account of a category error.

  **Initiatory versus Enabling Causation**

  To rectify this, I propose we adopt a specific conceptual distinction between "initiatory causation" and "enabling causation."

  *Initiatory causation* refers to the discrete event or decision that triggered the first overt hostile move. It is the spark. In legal or moral terms regarding individuals, the initiator often bears the brunt of responsibility. However, in macro-history, the initiatory act is frequently epiphenomenal—a reactive gesture within a pre-existing field of tension.

  *Enabling causation*, by contrast, refers to the institutional and diplomatic architectures that transformed discrete moves into an irreversible systemic confrontation. It is the accumulation of tinder, the construction of the room, and the locking of the exits. Enabling causation resides in the structural conditions that make de-escalation increasingly irrational for all parties over time.

  If blame is to be applied at all in macro-history—and I remain sceptical of its utility—it ought to attach primarily to the maintenance of enabling conditions rather than to initiatory acts. An initiatory act can often be reversed; an enabling structure creates a path dependency. Therefore, historical analysis should prioritise identifying the institutional mechanisms that removed the possibility of compromise, rather than identifying who spoke the first harsh word.

  **Application: The Sequence of 1945–1947**

  We may illustrate this distinction by reconsidering the well-known sequence of 1945 to 1947: the breakdown of the Grand Alliance, the articulation of the Truman Doctrine, and the implementation of the Marshall Plan. Under the traditional "who started it" framework, historians agonise over whether the Soviet consolidation of Eastern Europe preceded American containment, or vice versa. Under the framework of distributed institutional responsibility, we analyse how these events constructed an enabling architecture of conflict.

  The breakdown of the Grand Alliance was not merely a betrayal by one side (an initiatory moral failure); it was the dissolution of a specific, negative coalition against a common foe. The *enabling condition* here was the absence of a positive institutional framework to replace the anti-Nazi coalition. The institutional architecture of the wartime alliance was designed for victory, not for peace-building. When the war ended, the bureaucratic and military structures on both sides lacked a protocol for cooperation, defaulting instead to pre-war habits of suspicion.

  Consider the Truman Doctrine of 1947. Viewed through initiatory causation, one might argue this was the moment the US declared ideological war. However, through the lens of enabling causation, the Doctrine is significant because it universalised a specific security commitment. It created a domestic institutional imperative in the United States that required a global threat to justify itself. By framing foreign policy in binary ideological terms, the US administration locked itself into a structural position where any Soviet gain was automatically an American loss. This did not start the conflict, but it made the conflict unmanageable by removing the grey areas necessary for diplomacy.

  Similarly, the Marshall Plan is often debated as either benevolent aid or economic coercion. Yet, its primary significance in this framework is its function as an enabling mechanism. By requiring European economic integration and transparency as a condition for aid, the Plan created a structural divide. It was not necessarily that the Soviets were excluded by American malice (initiatory), but that the *terms* of the Plan were incompatible with the Soviet command economy's need for secrecy and autarky (enabling). The architecture of the Plan made participation impossible for the Eastern Bloc without systemic collapse. Thus, the division of Europe was not caused by a single veto, but by the incompatibility of two institutional systems attempting to occupy the same diplomatic space.

  In this sequence, no single event is the "start." Rather, each event tightened the structural screws. The responsibility is distributed across the bureaucratic inertia of the State Department, the security paranoia of the NKVD, the economic necessities of Western Europe, and the ideological rigidities of Marxism-Leninism. Each actor behaved rationally within their own institutional logic, yet the aggregate result was a system where escalation was the only rational output.

  **Conclusion: Towards Distributed Institutional Responsibility**

  In conclusion, the question "who started the Cold War" retains no analytical value because it seeks a moral answer to a structural problem. It assumes that history is driven by the volition of unitary actors who could have chosen otherwise, ignoring the systemic constraints that narrow the field of choice to a single, conflictual path.

  By distinguishing between initiatory and enabling causation, we see that the discrete decisions of 1945–1947 were less important than the institutional architectures they solidified. The Traditionalist, Revisionist, and Post-Revisionist schools all fail because they accept the metaphysical premise of unitary state agency. They argue over who lit the match, whilst ignoring the construction of the powder keg.

  As historians of international relations, we should therefore abandon the framework of blame. In its place, we must adopt a framework of distributed institutional responsibility. This allows us to analyse how specific diplomatic and economic structures made confrontation rational for all sides, without resorting to the simplistic moral psychology of the courtroom. It is not a matter of who was guilty, but of how the system was built to fail. Only by acknowledging this can we hope to derive lessons relevant to the management of great power competition in our own time.
