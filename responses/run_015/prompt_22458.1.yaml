answer: |-
  This is a fantastic question, and you have correctly identified a source of significant confusion for students (and indeed, many readers). The short answer is: **Goldman does not think "Easy Knowledge" dissolves the bootstrapping problem. He thinks "Easy Knowledge" *is* the problem.**

  Your students are misreading the title of Goldman's paper ("Liberalism About Easy Knowledge," or simply the discussion of "Easy Knowledge" in his 2002 *Philosophical Issues* paper) as an endorsement. They think Goldman is saying, "Knowledge is easy to get, so bootstrapping is fine." In reality, Goldman is using "Easy Knowledge" as a diagnostic label for a *reductio ad absurdum* against unrestricted externalism.

  Here is a clear account of how the two relate, which you can use to structure your seminar discussion.

  ### 1. The Diagnostic vs. Endorsement Distinction
  The primary source of your students' confusion is likely the phrase "Easy Knowledge." In ordinary English, saying knowledge is "easy" sounds like a relief. In this specific dialect of epistemology, it is a pejorative.

  *   **The Bootstrapping Argument (Cohen/Vogel):** This is the *argument* that shows a specific consequence of reliabilism. It says: "If reliabilism is true, I can know my faculties are reliable just by using them. But I can't know that. Therefore, reliabilism is false (or incomplete)."
  *   **Goldman's "Easy Knowledge":** This is Goldman's label for the *consequence* that bootstrapping exposes. When Goldman discusses "Easy Knowledge," he is agreeing with Cohen and Vogel that allowing agents to acquire knowledge of a faculty's reliability *solely* through the use of that faculty (without antecedent justification) is intuitively unacceptable.

  Goldman is not proposing "Easy Knowledge" as a solution to bootstrapping. He is arguing that **any theory that permits Easy Knowledge is vulnerable to the Bootstrapping objection.**

  ### 2. The Logical Relationship
  To help your students, it helps to map the logical dependency. They are not competing theories; they are the *bug* and the *error message*.

  *   **The Theory:** Unrestricted Process Reliabilism (Knowledge = True Belief + Reliable Process).
  *   **The Mechanism:** The Closure Principle (If I know $P$, and I know $P$ entails $Q$, I can know $Q$).
  *   **The Result (Bootstrapping):** I can deduce the reliability of my vision just by trusting my vision.
  *   **The Label (Easy Knowledge):** Goldman calls this result "Easy Knowledge" because it allows me to know a crucial proposition (my faculties are reliable) "too easily" (i.e., without independent verification).

  So, Easy Knowledge does not make the circularity worry evaporate; it **names the circularity worry.** When Goldman writes about this, he is essentially conceding that unrestricted externalism yields counterintuitive results regarding circularity.

  ### 3. Addressing the Circularity Worry
  Your students ask: *"If I can come to know that my vision is trustworthy just by looking at things, then seems like the whole worry about circular justification... just evaporates."*

  This is where you need to distinguish between **Externalist Circularity** and **Internalist Circularity**.

  *   **The Externalist View:** Circularity is only vicious if it undermines reliability. If the process is actually reliable, the circularity doesn't matter. (This is the view your students are attributing to Goldman).
  *   **Goldman's Nuance:** Goldman agrees that externalism generally tolerates some circularity. *However*, in the "Easy Knowledge" paper, he concedes that Bootstrapping pushes this tolerance too far. He agrees with the internalist intuition that there is *something* wrong with vouching for your senses using only your senses, even if those senses are reliable.

  Goldman's point is that a viable epistemology must explain **why** this specific type of circularity is forbidden, even if other types are allowed. If "Easy Knowledge" were a solution, Goldman would argue bootstrapping is valid. Instead, he spends the paper trying to **restrict** reliabilism so that Easy Knowledge is *blocked*.

  ### 4. Goldman's Actual Proposal (The "Fix")
  If you want to show your students that Goldman treats this as a live problem, point them to his proposed restrictions. Goldman suggests that to avoid the Bootstrapping/Easy Knowledge problem, we need to add a constraint to reliabilism.

  He proposes something like a **No-Defeater Condition** or a restriction on the **Basing Relation**. Specifically, he suggests that one cannot come to know a faculty is reliable if the *only* basis for that belief is the output of that very faculty.

  *   **If Easy Knowledge were a solution:** Goldman would say, "Embrace bootstrapping; it's valid."
  *   **What Goldman actually says:** "We must modify our theory of justification to rule out Easy Knowledge, because Bootstrapping shows it leads to absurdity."

  ### 5. Pedagogical Strategy for the Seminar
  To break the wall your students have hit, try this analogy in class:

  **The "Check Engine" Light Analogy**
  *   **Bootstrapping** is like a mechanic saying: "If this car's diagnostic system is reliable, the 'Check Engine' light should be able to confirm its own reliability just by lighting up."
  *   **Easy Knowledge** is the label for the claim: "The light has confirmed its own reliability."
  *   **Goldman's Paper** is the mechanic saying: "Wait, if the light can confirm its own reliability just by lighting up, then a broken light could also claim it's working. That's a problem. We need to change how the diagnostic system works so it can't self-certify."

  **Discussion Questions to Pose:**
  1.  "Does Goldman think the bootstrapping conclusion is *true* (we do know our faculties are reliable easily), or does he think it shows the *theory* is false?" (Answer: The latter).
  2.  "If 'Easy Knowledge' were a solution to bootstrapping, why does Goldman spend so much time trying to restrict the conditions under which we can know a faculty is reliable?"
  3.  "Is the 'Easy' in Easy Knowledge descriptive (it is simple to do) or normative (it is too simple to count as knowledge)?"

  ### Summary for Your Preparation
  You are framing it correctly by sensing that Goldman doesn't think the problem dissolves. The relationship is:
  1.  **Bootstrapping** is the argument that exposes the flaw.
  2.  **Easy Knowledge** is the name of the flaw.
  3.  **Goldman's Project** is to adjust externalism so it doesn't produce Easy Knowledge.

  Your students are treating "Easy Knowledge" as a **feature** of Goldman's system. It is actually a **bug** he is trying to patch. Once they realize Goldman is on their side (that bootstrapping is problematic), the confusion should clear.
