      *   **The Crucial Misunderstanding:** The students (and potentially the user initially) seem to think "Easy Knowledge" is a *positive thesis* Goldman is advocating (i.e., "Knowledge is easy, so bootstrapping is fine"). In reality, Goldman uses "Easy Knowledge" as a *label for a problematic consequence* of certain theories. He is essentially agreeing with Cohen/Vogel that bootstrapping is a problem.

