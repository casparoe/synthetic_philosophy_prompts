      *   Structure: Materials, Setup/Audit, Scoring, Debrief, Failures, Limitations, Takeaway.

      *(Self-Correction during drafting)*: Make sure the scoring rule encourages honesty. Logarithmic is theoretically best, but Brier is easier to explain. I'll use a modified Brier for simplicity in a 90-min session.
      *   Wait, the prompt asks for "Strictly proper". Brier is strictly proper for binary.
