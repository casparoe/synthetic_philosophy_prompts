  # Activity Design: The Sealed Population

  ## 1. Materials and Setup

  **Room:** A seminar room with a projector and a physical safe (or lockbox) placed visibly at the front.

  **Pre-Session Preparation (Facilitator Only):**
  1.  **World Selection:** Flip a fair coin. Heads = **Short World** (Total Population $N_S = 200$). Tails = **Long World** (Total Population $N_L = 200,000$).
  2.  **Commitment:** Generate a random 32-character salt. Create a SHA-256 hash of `"[World Outcome] + [Salt]"`. Print this hash on a handout for every participant. Place the written outcome and salt in the sealed safe.
  3.  **Identity Cards:** Prepare 16 cards.
      *   To ensure the activity functions without immediately falsifying the Long World (which would happen if any ID > 200 were drawn), the IDs are drawn from the range **1–200**.
      *   *Audit Trail:* Generate these 16 numbers using a public random number generator (e.g., NIST Randomness Beacon) timestamped *before* the session. Print the transaction ID on the board.
      *   *Note:* In the Long World, receiving an ID $\le 200$ implies the participant belongs to a specific early subset of the population. This is integral to the "Class" choice.
  4.  **Dossiers:** 16 envelopes, each containing:
      *   One Identity Card (Serial Number $k \in [1, 200]$).
      *   One **Class Menu** (see below).
      *   One **Commitment Sheet** (to write chosen Class and Credence).
  5.  **Scoring:** Prepare a payout table (see Scoring Rule) in candy or course credit points.

  **The Class Menu (Inside Dossier):**
  Participants are told these are the two valid ways to interpret their existence in this experiment.
  *   **Class $\alpha$ (General Observers):** Beings capable of holding an identity card in this world.
      *   Short World Total: 200.
      *   Long World Total: 200,000.
  *   **Class $\beta$ (Pilot Observers):** Beings holding an identity card *during the pilot phase* of this world's timeline.
      *   Short World Total: 200 (The entire population is the pilot phase).
      *   Long World Total: 200 (Only the first 200 beings are in the pilot phase).

  ## 2. The Procedure (90 Minutes)

  **0:00–0:10: Introduction & Audit**
  *   Distribute the Hash Handout. Explain: "The World (Short or Long) was decided before you arrived. This hash proves I cannot change it now. I will reveal the key at the end."
  *   Display the RNG Transaction ID for the Serial Numbers. "Your numbers were generated publicly. I did not pick them to fit the World."
  *   Distribute Dossiers. Instruct participants not to open them until told.

  **0:10–0:20: The Task**
  *   "Open your dossiers. You have a Serial Number $k$. You are in one of two possible Worlds. Your prior credence for Short World is 0.5."
  *   "You must make two written commitments on your sheet:
      1.  **Select a Class:** $\alpha$ or $\beta$. This defines the population you consider yourself a random sample from.
      2.  **State a Credence:** A number $p \in [0, 1]$ representing your confidence that the World is Short.
  *   "You will be scored on the accuracy of your credence *given the actual World*. Your Class choice determines how your Serial Number is interpreted, but the score depends only on the World."

  **0:20–0:50: Deliberation**
  *   Facilitator silence. Participants may talk to each other but must make individual commitments.
  *   *Expected Dynamic:* Some will calculate the Bayes factor for Class $\alpha$ ($1000:1$ likelihood ratio) and move $p \to 0.999$. Others will choose Class $\beta$ (likelihood ratio $1:1$) and keep $p = 0.5$.

  **0:50–1:10: Collection & Reveal**
  *   Collect Commitment Sheets.
  *   Open the Safe. Reveal the World and Salt.
  *   Have a participant verify the Hash on their phone.
  *   Verify the RNG transaction for the Serial Numbers.

  **1:10–1:30: Scoring & Debrief**
  *   Calculate scores based on the revealed World.
  *   Conduct the debrief (scripted below).

  ## 3. Scoring Rule

  We use a **Scaled Brier Score**, which is strictly proper for binary outcomes. It rewards honesty and penalizes overconfidence in falsehoods.
  $$ \text{Score} = 100 \times (1 - (\text{Truth} - p)^2) $$
  *   **Truth** = 1 if Short World, 0 if Long World.
  *   **$p$** = Participant's stated credence in Short World.

  **Representative Scoring Table:**

  | Actual World | Participant Credence ($p$) | Calculation | Score |
  | :--- | :--- | :--- | :--- |
  | **Short** | 0.99 | $100 \times (1 - (1 - 0.99)^2)$ | **99.99** |
  | **Short** | 0.50 | $100 \times (1 - (1 - 0.50)^2)$ | **75.00** |
  | **Short** | 0.01 | $100 \times (1 - (1 - 0.01)^2)$ | **1.99** |
  | **Long** | 0.99 | $100 \times (1 - (0 - 0.99)^2)$ | **1.99** |
  | **Long** | 0.50 | $100 \times (1 - (0 - 0.50)^2)$ | **75.00** |
  | **Long** | 0.01 | $100 \times (1 - (0 - 0.01)^2)$ | **99.99** |

  *Note: Choosing Class $\beta$ locks you into $p=0.5$ (max score 75). Choosing Class $\alpha$ allows a high score (99.99) but risks a catastrophic low score (1.99) if the Long World is true.*

  ## 4. Debrief Script & Mapping

  **Step 1: The Arithmetic**
  "Look at the scores. Those who chose Class $\alpha$ and updated their credence to near-1 (if Short) or near-0 (if Long) outperformed those who stayed at 0.5. The math worked. Bayes' theorem is not in dispute."

  **Step 2: The Choice**
  "But notice the split. Half of you likely chose Class $\alpha$. Half chose Class $\beta$. Why? The data (your Serial Number) was identical. The World was identical. The only difference was the **reference class** you selected from the menu."

  **Step 3: Mapping to Theory**
  *   "In the literature, choosing Class $\alpha$ is adopting the **Self-Sampling Assumption (SSA)**. You assume you are a random sample from all observers in that class. This leads to the 'Doomsday Argument': a low serial number implies a small total population."
  *   "Choosing Class $\beta$ effectively neutralizes the argument. By defining your class as 'Pilot Observers,' you made the total population size irrelevant to your serial number. In anthropic terms, this mimics the **Self-Indication Assumption (SIA)**: you reason that you are more likely to exist in a world with more observers, which cancels out the SSA update."
  *   "The 'Reference Class' was the variable nobody asked you to justify, yet it determined your reality."

  ## 5. Predictable Failures & Mitigations

  **1. "The Prior is Fixed at One-Half"**
  *   *Failure:* A participant argues, "There's no reason to think Short or Long is 50/50. I'm sticking with 50/50 regardless of evidence."
  *   *Response:* "The scoring rule penalizes you for ignoring the evidence *if* the evidence is informative. If you believe the prior is not 0.5, you should have written that down. But if you agree the coin flip was fair, 0.5 is the only rational starting point. The exercise tests the *update*, not the prior."

  **2. "Gaming the Score"**
  *   *Failure:* A participant chooses Class $\alpha$ but writes $p=0.8$ instead of $0.999$ to "hedge" against the Long World.
  *   *Response:* "That is a valid risk management strategy, but it is not Bayesian updating. The scoring rule is *strictly proper*; it maximizes your expected points only if you report your true credence. Hedging lowers your expected score."

  **3. "The Low Draw in the Long World"**
  *   *Failure:* If the **Long World** was selected, participants will notice that *all* 16 serial numbers are $\le 200$. They will argue, "In a world of 200,000, the odds of all 16 of us being in the first 200 are one in a quadrillion. The Long World is impossible. The exercise is rigged."
  *   *Mitigation:* Acknowledge this immediately. "You are correct. This is the **Observation Selection Effect**. You cannot observe a world where you do not exist. If the Long World were true and you had drawn number 150,000, you would not be here to complain. The fact that you are here with low numbers is the exact datum the Doomsday Argument relies on. However, Class $\beta$ explains this: You are in the 'Pilot Phase.' In the Long World, only Pilot Observers get cards. So your low number is guaranteed in *both* worlds under Class $\beta$. The disagreement is not about the rarity of the number, but about whether you are a 'General' or 'Pilot' observer."

  ## 6. Limitations of the Activity

  Be honest about what this simulation cannot capture:
  1.  **The Prior is Not a Coin Flip:** In reality, we have no external "coin flip" telling us the probability of human extinction vs. long-term survival. The 0.5 prior is an artifact of the game.
  2.  **Discrete vs. Continuous:** The real hypothesis space is not {200, 200,000}. It is a continuous distribution over time and population. The "cliff" between Short and Long simplifies the math but obscures the integration required in real applications.
  3.  **Trivial Stakes:** Betting candy points is not the same as betting on the fate of humanity. Risk aversion behaves differently when the stakes are existential.

  ## 7. One Sentence Takeaway

  "The live disagreement is not about the arithmetic but about which sampling assumption governs, and no datum of the kind they were given settles it."
