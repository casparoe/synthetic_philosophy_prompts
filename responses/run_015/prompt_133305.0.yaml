answer: |-
  Here is a sorting tree to help you map out where you stand on whether reading lives makes you good. I've kept the branches concrete, like you asked, and injected that ventriloquism/friction distinction as the fourth split to see how the reader interacts with the text.

  ### The Taxonomy of Moral Biography

  **Root:** Reading about a dead person improves your morality.

  **Split 1: The Contradiction Test**
  *   **Branch A (Ruins):** If the subject preaches humility but acts vain, the moral lesson is broken. (Hypocrisy invalidates the example.)
  *   **Branch B (Teaches):** The contradiction *is* the lesson. (Seeing how they struggled with vanity teaches you how to handle your own.)

  **Split 2: The Learning Mechanism**
  *   **Branch A (Copying):** You learn by isolating specific traits to mimic (e.g., "I will wake up at 4 AM like Franklin").
  *   **Branch B (Configurational):** You learn by seeing how traits fit into a whole life-shape (e.g., "Franklin's 4 AM wake-up only worked because of his specific social context").

  **Split 3: The Reader-Text Interaction (The Injection)**
  *   **Branch A (Moral Ventriloquism):** You project your existing ethics onto the subject; the book is a mirror.
  *   **Branch B (Narrative Friction):** The text resists your current ethics and forces you to revise them.

  **Split 4: The Accuracy Requirement**
  *   **Branch A (Strict Truth):** If the story is invented, the moral lesson is fake.
  *   **Branch B (Mythic Utility):** A partly invented life teaches just as well as a true one.

  ---

  ### The Leaves (Named Positions & Commitments)

  Combining these splits gives us 16 theoretical endpoints, but many collapse into the same philosophical camp. Here are the distinct positions you land on, along with the weirdest thing each one has to accept.

  **1. Strict Exemplarism**
  *   *Path:* Contradictions Ruin + Copying + Ventriloquism + Strict Truth
  *   *Weirdest Commitment:* You must actively erase any evidence of your hero's bad days to keep the lesson pure.
  *   *Status:* **Named** (Classic Exemplar Theory)

  **2. Sanitized Hagiography**
  *   *Path:* Contradictions Ruin + Copying + Ventriloquism + Mythic Utility
  *   *Weirdest Commitment:* It doesn't matter if the saint existed, only that the story convinces you to behave.
  *   *Status:* **Named** (Traditional Hagiography)

  **3. The Impossible Standard**
  *   *Path:* Contradictions Ruin + Copying + Narrative Friction + Strict Truth
  *   *Weirdest Commitment:* The only moral biography is of a person who never actually existed.
  *   *Status:* **Unnamed** (Logically unstable)

  **4. Allegorical Didacticism**
  *   *Path:* Contradictions Ruin + Copying + Narrative Friction + Mythic Utility
  *   *Weirdest Commitment:* You can lie about the person's actions as long as the lie forces the reader to change their mind.
  *   *Status:* **Named** (Fable/Parable Theory)

  **5. Selective Realism**
  *   *Path:* Contradictions Ruin + Configurational + Ventriloquism + Strict Truth
  *   *Weirdest Commitment:* You have to edit the life story to make the "shape" look consistent, even if the real life was messy.
  *   *Status:* **Unnamed**

  **6. Tragic-Flaw Biography**
  *   *Path:* Contradictions Ruin + Configurational + Narrative Friction + Strict Truth
  *   *Weirdest Commitment:* You learn morality primarily by studying how good people failed.
  *   *Status:* **Named** (Tragic Theory)

  **7. Ironical Mimicry**
  *   *Path:* Contradictions Teach + Copying + Ventriloquism + Strict Truth
  *   *Weirdest Commitment:* You should copy the hero's bad habits because they prove being human is okay.
  *   *Status:* **Unnamed**

  **8. Dialectical Heroism**
  *   *Path:* Contradictions Teach + Copying + Narrative Friction + Strict Truth
  *   *Weirdest Commitment:* You must mimic the hero's struggles, not their successes, to learn virtue.
  *   *Status:* **Unnamed**

  **9. Psychological Integration**
  *   *Path:* Contradictions Teach + Configurational + Ventriloquism + Strict Truth
  *   *Weirdest Commitment:* The reader decides what the life means, regardless of what the author intended.
  *   *Status:* **Unnamed** (Reader-Response adjacent)

  **10. Narrative Ethics**
  *   *Path:* Contradictions Teach + Configurational + Narrative Friction + Strict Truth
  *   *Weirdest Commitment:* You cannot extract a rule from the life; you must re-live the whole story to get the moral.
  *   *Status:* **Named** (Ricoeurian Narrative Ethics)

  **11. Mythic Integration**
  *   *Path:* Contradictions Teach + Configurational + Ventriloquism + Mythic Utility
  *   *Weirdest Commitment:* A made-up life teaches you how to handle real contradictions better than a true one.
  *   *Status:* **Unnamed**

  **12. Fictional Realism**
  *   *Path:* Contradictions Teach + Configurational + Narrative Friction + Mythic Utility
  *   *Weirdest Commitment:* Reading a novel about a fake person is morally superior to reading a biography of a real one.
  *   *Status:* **Named** (Nussbaum's Poetic Justice view)

  *(Note: The remaining 4 leaves involving "Copying + Contradictions Teach" tend to collapse into Ironical Mimicry or Dialectical Heroism depending on the accuracy split, so I haven't listed them separately to avoid redundancy.)*

  ---

  ### Indistinguishable Leaves
  I have to flag that **Sanitized Hagiography (2)** and **Allegorical Didacticism (4)** are practically impossible to separate in the real world. Both allow for invented details to teach a lesson, and the only difference is whether the text tries to force a revision of your ethics (Friction) or just confirms what you want to hear (Ventriloquism). Since authors rarely state their intent clearly, and readers vary wildly, you can't really sort a specific book into one or the other without mind-reading the author.

  ### What Would Change My Mind
  I built this tree assuming that **Copying** and **Configurational** learning are distinct psychological processes. I would scrap this whole structure if empirical psychology showed that humans *cannot* isolate traits for mimicry without subconsciously processing the whole life context anyway. If it turns out that "copying" is just a simplified version of "configurational" processing, then Split 2 is false, and the tree collapses into a simpler dichotomy based only on whether contradictions matter.

  Also, if you showed me a case where a known fictional biography (like a forged memoir) produced a *more durable* moral change in readers than a verified true biography, I would have to move **Strict Truth** out of the final split and treat accuracy as irrelevant to moral efficacy entirely.
