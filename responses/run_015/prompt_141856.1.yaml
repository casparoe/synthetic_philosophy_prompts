answer: |-
  ### Brainstorming and Selection

  **Distinctions considered:**
  *   **Regularity vs. Rule:** Distinguishes habit from obligation; lets team distinguish "people often buried pots" from "burial rules existed."
  *   **Belief vs. Acceptance:** Distinguishes inner state from public commitment; dropped (too internal for 90-minute record check).
  *   **Intention vs. Function:** Distinguishes maker's goal from user's outcome; lets team distinguish "made to cut" from "used to cut."
  *   **Convention vs. Institution:** Distinguishes shared habit from structured hierarchy; dropped (subsumed by Regularity vs. Rule).
  *   **Meaning-for-them vs. Interpretable-for-us:** Distinguishes emic access from etic description; dropped (too abstract for panel text).
  *   **Assertion vs. Implication:** Distinguishes what is said from what is suggested; dropped (linguistic nuance, not ontological).
  *   **Use vs. Depiction:** Distinguishes tool from symbol; lets team distinguish "axe used for wood" from "axe shown as power."

  **Selection:**
  I am building the procedure on **Regularity vs. Rule**, **Intention vs. Function**, and **Use vs. Depiction**.
  *   **Regularity vs. Rule** is the load-bearing thesis for Institutional claims (Requirement 3).
  *   **Intention vs. Function** grounds the Attributive grade.
  *   **Use vs. Depiction** aids the Anti-residual step.
  *   **Dropped:** Belief vs. Acceptance and Meaning-for-them vs. Interpretable-for-us. A three-person team cannot adjudicate internal states or emic meaning from old notebooks in ninety minutes; these distinctions invite speculation rather than constraining it.

  ***

  ### The Decision Procedure

  **Claim Grades:**
  1.  **Reportive:** Describes material properties (form, material, association, wear, breakage, deposition). *Example: "Polished stone axe found in peat."*
  2.  **Attributive:** Describes intent, meaning, or treatment (offering, weapon, dangerous, seen). *Requires evidence of specific treatment distinguishing it from refuse.*
  3.  **Institutional:** Describes rules, roles, or standing arrangements (priest, guild, tribute, marriage rule). *Requires evidence of cost, enforcement, or disadvantageous adherence.*

  **Step 1: Material Base (Reportive)**
  *   **Question:** What physical facts are secure in the record?
  *   **Stopping Rule:** List only what is photographed, measured, or consistently noted in notebooks.
  *   **Failure:** If context is lost or records contradictory, stop at object description only.

  **Step 2: Anti-Residual Check**
  *   **Question:** What is the plain practical alternative to the proposed claim?
  *   **Procedure:** Write down the mundane explanation (e.g., "lost," "broken in use," "refuse").
  *   **Stopping Rule:** If you cannot formulate a practical alternative, the claim is residual. Return to Reportive.
  *   **Requirement:** Specify what evidence would have made it ordinary (e.g., "found in midden" vs. "found in bog").

  **Step 3: Equifinality Check**
  *   **Question:** Name two distinct processes that could produce this pattern.
  *   **Procedure:** List Process A (proposed) and Process B (alternative).
  *   **Discrimination:** What evidence in *this* record distinguishes them?
  *   **Stopping Rule:** If nothing discriminates, verdict is **Not Licensed**. Use minimal Reportive statement.

  **Step 4: Attributive Threshold**
  *   **Question:** Does the record show intentional treatment beyond utility?
  *   **Criteria:** Deliberate breakage, placement away from settlement, unused edges, association with non-utilitarian items.
  *   **Stopping Rule:** If treatment matches domestic refuse or loss, stay Reportive. If distinct, move to Attributive.

  **Step 5: Institutional Threshold (The Cost/Enforcement Test)**
  *   **Question:** Does the practice imply a rule that imposed costs or was enforced?
  *   **Criteria:** Evidence of roles (special grave goods only for some), enforcement (punishment markers), or adherence where locally disadvantageous (wealth buried rather than used).
  *   **Stopping Rule:** If only regularity (habit) is visible, **Not Licensed** for Institutional. Downgrade to Attributive or Reportive.
  *   **Thesis:** A regularity of behaviour is not yet a rule. Institutional claims require evidence of status functions backed by collective recognition/enforcement.

  **Step 6: Values Check**
  *   **Question:** Is this interpretation contested by descendant communities or dependent on living tradition?
  *   **Stopping Rule:** If yes, verdict is **Hand Off**. Do not write text. Consult officer leads.

  **Verdicts:**
  1.  **Approved:** Claim matches evidence grade.
  2.  **Weakened:** Claim downgraded (e.g., Institutional → Attributive). Wording supplied.
  3.  **Not Licensed:** Claim unsupported. Minimal true statement supplied.
  4.  **Hand Off:** Values issue.

  ***

  ### Calibration Set (Test Cases)

  1.  **Object:** Iron nail in posthole. **Claim:** "Built by a guild." **Verdict:** Not Licensed. **Output:** "Iron nail found in posthole."
  2.  **Object:** Gold coin in grave. **Claim:** "Payment for the afterlife." **Verdict:** Weakened. **Output:** "Gold coin placed with the dead."
  3.  **Object:** Burnt grain in pit. **Claim:** "Ritual burning." **Verdict:** Not Licensed. **Output:** "Burnt grain deposited in pit." (Practical alt: store fire).
  4.  **Object:** Human bone in river. **Claim:** "Execution victim." **Verdict:** Not Licensed. **Output:** "Human bone found in river." (Equifinality: accident vs. execution).
  5.  **Object:** Sacred bundle in community store. **Claim:** "Contains ancestor spirits." **Verdict:** Hand Off. **Output:** [Consult Officer].

  ***

  ### Audit-Record Template

  **Audit Record:** [Object ID]
  **Proposed Claim:** [Insert Text]
  **Material Base:** [List secure facts]
  **Practical Alternative:** [Insert mundane explanation]
  **Equifinality:** [Process A vs. Process B; Discriminator]
  **Grade Justification:** [Reportive/Attributive/ Institutional]
  **Decision:** [Approved/Weakened/Not Licensed/Hand Off]
  **Reviewer:** [Name/Date]
  *Note: If Institutional, cite specific evidence of cost or enforcement. If Hand Off, cite community instruction.*

  ***

  ### Limits and Honesty

  **Constraints vs. Judgment Calls:**
  Steps 1 (Material) and 3 (Equifinality) are genuine constraints; if the record lacks data, you cannot proceed. Steps 4 (Attributive) and 5 (Institutional) are judgment calls dressed as steps; the threshold for "deliberate" or "costly" depends on specialist intuition. We flag this as a choice: we prioritise avoiding over-claiming (false positives) over capturing nuance (false negatives).

  **Systematic Misfires:**
  *   **Unprovenanced Objects:** Procedure will force Reportive only.
  *   **Old Excavations:** Poor context will trigger Step 1 Failure often.
  *   **Analogy:** Using ethnographic analogy to fill Step 5 is prohibited unless the analogue is explicitly cited as a model, not fact.
  *   **Typologies:** If the typology assumes the interpretation (e.g., "ritual axe" based on shape), Step 2 will reject it.

  **Philosophical Choice:**
  We adopt a realist stance on material (Step 1) but a constructivist caution on social roles (Step 5). We assume rules require enforcement markers. This could be wrong (soft power leaves no trace), but it is safer for public text.

  ***

  ### Live Case Runs

  #### Case A: Polished Stone Axes in Bog
  **Proposed:** "Weapons offered to a god of the lake."
  **Step 1 (Material):** 41 axes, peat bog, wooden platform, 2 clusters, 9 broken, unused edges. Secure.
  **Step 2 (Anti-Residual):** Practical alt: Lost during transport; discarded broken tools. Discriminator: Platform construction implies effort beyond loss.
  **Step 3 (Equifinality):** Process A: Ritual offering. Process B: Prestige storage/cache. Discriminator: Breakage. Broken tools are poor cache.
  **Step 4 (Attributive):** Deliberate breakage + platform = intentional treatment. Attributive licensed.
  **Step 5 (Institutional):** "God" implies institutional role/recipient. Evidence of cost/enforcement? No texts, no temple structure, no priestly grave association. Regularity ≠ Rule.
  **Verdict:** **Weakened.**
  **Printable Wording (58 words):**
  Forty-one polished stone axes were placed on a wooden platform in the former lake. Nine were deliberately broken before deposition. No settlement lies nearby. This careful treatment suggests the axes were valued beyond their use as tools. People gathered here to deposit them in the water, marking the landscape with meaningful acts.
  **Audit:** Material secure. Practical alt (loss) ruled out by platform. Equifinality (cache) ruled out by breakage. Institutional (god) failed cost/enforcement test. Downgraded to Attributive (valued/meaningful).

  #### Case B: Beaker Graves
  **Proposed:** "These burials show a ranked society governed by priests."
  **Step 1 (Material):** 60 graves, 150 years, identical beaker form, left shoulder placement, varied depth/goods. Secure.
  **Step 2 (Anti-Residual):** Practical alt: Family traditions; wealth variation due to income, not rank.
  **Step 3 (Equifinality):** Process A: Ranked society. Process B: Egalitarian society with personal wealth variation. Discriminator: Consistent rule (beaker placement) suggests convention, but goods variation suggests wealth.
  **Step 4 (Attributive):** Uniform orientation = shared meaning/intent. Licensed.
  **Step 5 (Institutional):** "Governed by priests." Evidence of cost/enforcement? Variation in goods suggests wealth, not necessarily office. No evidence of priestly regalia distinct from wealth. No evidence of enforcement (punishment for wrong burial). Regularity of beaker placement is convention, not necessarily institutional rule.
  **Verdict:** **Not Licensed.** (This is the unpopular verdict).
  **Printable Wording (55 words):**
  Sixty people were buried here over one hundred and fifty years. Each body was oriented with a decorated beaker at the left shoulder. The depth of graves and quantity of goods vary widely. This pattern shows a community sharing burial customs, where some individuals were accompanied by more material than others.
  **Audit:** Material secure. Equifinality (wealth vs. rank) unresolved. Institutional (priests/governed) failed cost/enforcement test. No evidence of office distinct from wealth. Downgraded to Reportive/weak Attributive.
  **Why you will resist:** You want to keep "ranked society governed by priests" to explain the variation and assert social complexity. The procedure forces you to admit the record shows wealth variation, not necessarily political hierarchy or priesthood. This reduces the site's perceived political significance for planning objections.

  #### Case C: Rock Art with Descendant Community
