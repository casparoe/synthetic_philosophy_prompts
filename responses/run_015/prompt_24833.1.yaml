answer: |-
  Focus your paper on the metaphysical status of created natures within Ghazali's system rather than debating whether he fits the label of occasionalist, because resolving how causal discourse remains meaningful without efficacy is upstream of determining whether he fits a modern category.

  **1. The Ontological Status of Created Natures**
  This is your primary topic because it dictates whether Ghazali offers a viable alternative to necessitarianism or merely a skeptical dead end. It is upstream of the occasionalism debate because you must establish what exists in the world before you can label how it acts; if natures have no ontological weight, science becomes impossible, but if they have a delegated reality, Ghazali offers a distinct metaphysics rather than just a negation. This is highly tractable for a non-Arabic speaker since key texts like *The Incoherence of the Philosophers* and *Moderate Belief in Religion* are well-translated, and secondary literature by Frank Griffel and Dag Nikolaus Hasse specifically targets this nuance without requiring linguistic forensics. You would move this up if you find evidence in Ghazali's later works that he softens his stance on secondary causality to accommodate practical science, but move it down if consensus hardens around the view that he treats natures as purely fictional conveniences.

  **2. The Coherence of Divine Habit (*Adah*)**
  This ranks second because it explains the mechanism that allows regularity without necessity, bridging his theology and his metaphysics. It is mid-stream because it relies on your conclusion about natures; if natures are real, habit is a description of their operation, but if natures are void, habit is a voluntary constraint God places on Himself. This is tractable using secondary sources on Ash'arite theology, specifically regarding atomism and time, which are covered extensively in English-language companions to Islamic philosophy. You would move this up if you uncover a tension between God's absolute freedom and the reliability required for prophecy, but move it down if the literature confirms that Ghazali successfully isolates metaphysical possibility from theological voluntarism.

  **Skip: The Occasionalist vs. Humean Label**
  Drop this entirely because it is a historiographical categorization game that yields no philosophical payoff for your argument. Even if you prove he is a "true" occasionalist rather than a regularity theorist, it does not change the internal coherence of his system or his solution to the problem of induction, making it a downstream question that consumes disproportionate energy on textual comparison you cannot perform in the original language. No amount of new evidence here would change the metaphysical stakes of your paper, so treat it as background context rather than a thesis.

  **Skip: Empirical Distinguishability**
  Avoid this because it imposes modern verificationist criteria on a pre-modern metaphysical framework. Ghazali is not arguing about what evidence would falsify his view in a laboratory sense, but about what is metaphysically possible given divine omnipotence, so asking if the view is empirically distinguishable from regularity is anachronistic and leads to a category error. A great answer here wouldn't change much downstream because Ghazali's goal is to secure theological space for miracles, not to propose a competing philosophy of science that must meet modern falsification standards.
