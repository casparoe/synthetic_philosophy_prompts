      *   **Discuss "Bootstrapping":** Clarify that this isn't exactly the standard "Bootstrapping Problem" (Cohen), but rather an "Armchair Knowledge" argument. The standard bootstrapping problem is about circularity (reliability of sources). This argument is about the *content* of mental states.
