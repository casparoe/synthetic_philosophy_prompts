prompt: |-
  Hey, I'm prepping a grad seminar on historiography and I keep running into the same old Whig-history warnigns in the literature — you know, writing the past as progress toward the present, grading dead people by our standards, picking winners. But I want to push past the generic version. Rank the following four temptations by how insidous they actually are for someone who thinks they're being reflexive about it — not just 'bad for undergrads' but 'will corrupt a careful scholar's framing without them noticing':

  1. The institutional-genealogy trap: tracing a modern concept (say, 'human rights') backward and treating earlier approximations as incomplete drafts rather than different things altogether.
  2. The counterfactual-stability trap: using our present social arrangement as the implicit baseline, so that past deviations look like failures or detours rather than live alternatives.
  3. The moral-anachronism grade: judging past actors mainly by whether they anticipated our current ethical consensus, which sounds obvious but I think hides in subtler forms.
  4. The survivor-selection bias: writing history of ideas by tracking only the texts or movements that 'made it' into our canon, then treating that survival as evidence of merit or inevitability.

  Give me tiers — S, A, B, C — with one line each for why it lands there. I'm especially unsure about where to put #2 vs #3; if you swap them, tell me what argument would make you do so.

  Also, be honest: where's your reasoning most likely to fail here? Like, what kind of example or counter-argument would actually change your ranking?

  Oh, and no reading lists — my students can find those, and I'm not asking you to cite anyone. Just your gut with some reasoning behind it.
