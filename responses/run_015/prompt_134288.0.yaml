  **S: The counterfactual-stability trap** — It disguises contingency as structural necessity, making the present seem like gravity rather than a choice.
  **A: The institutional-genealogy trap** — It smuggles teleology into categorization, forcing fragmented pasts into coherent modern lineages.
  **B: The survivor-selection bias** — It privileges canonical voices under the guise of source availability, even when silences are acknowledged.
  **C: The moral-anachronism grade** — It's overt enough that reflexive scholars usually flag it, whereas the others hide inside methodology.

  **On swapping #2 and #3:**
  I would swap them if we defined "reflexive" as *politically engaged* rather than *methodologically strict*, because moral judgment then masquerades as critical rigor rather than historical error. In that frame, #3 becomes the S-tier trap because the scholar believes condemning the past is a virtue, not a bias, making it impossible to self-correct.

  **Where my reasoning fails:**
  My ranking assumes the scholar's primary goal is *causal explanation*; if the goal is *archival recovery* or *justice*, #4 (Survivor-selection) becomes the S-tier sin because it structurally excludes the very subjects the history aims to restore. I'm also biasing toward intellectual history—in social history, #2 often looks like legitimate structural analysis, making it even harder to spot than I've admitted.
