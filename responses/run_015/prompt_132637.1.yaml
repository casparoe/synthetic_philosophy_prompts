answer: |-
  The parole practice implicitly presupposes that moral responsibility tracks quality of will, but it institutionalizes incentives that render the required quality of will incoherent by collapsing the participant stance into the objective management it claims to transcend. By conditioning liberty on remorse, the board asserts that dangerousness is a function of moral character rather than statistical probability, presupposing a retributive rehabilitation model where acknowledging the normative claim is a condition of re-entry into the moral community. This conflates the forward-looking test of risk with the backward-looking assessment of desert, creating a performative contradiction: genuine reactive attitudes must be spontaneous to be authentic, yet the coercive context transforms them into instrumental strategies for release. Consequently, the board punishes the lack of sincerity (a participant stance judgment) while treating denial as a risk symptom to be managed (an objective stance classification), a hybridity that is philosophically unstable because one cannot blame an agent for failing to feel what one has incentivized them to fake. Your distinction between acknowledgment and affective remorse identifies the only coherent demand; cognitive acceptance of facts and norms can be required without violating autonomy, but demanding emotional guilt presupposes that the state owns the prisoner's interior life. A shift to pure actuarial risk scores would resolve the contradiction by abandoning the claim that liberty is a moral reward for repentance, treating the prisoner wholly as an object of management. However, if Strawson is correct that the objective attitude cannot be sustained wholesale without dehumanizing the subjects, this reform would have to give up the pretense of moral engagement entirely, admitting that release is a regulatory decision based on probability rather than a restoration of moral standing, thereby severing the link between responsibility and liberty that the current practice hypocritically maintains.
