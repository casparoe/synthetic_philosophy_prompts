answer: |-
  **Q&A PREP SHEET: HOBBES, GEOMETRY, AND THE METHOD OF LEVIATHAN**

  **Strategy Note:** Your audience suspects you are rescuing Hobbes's math to save his politics. Do not do that. Rescue the *method* to explain the *structure*. Admit the math is trash immediately so they stop waiting for you to defend the quadrature of the circle.

  ### **UPFRONT CONCESSION (Say this in your closing remarks or if pressed early)**
  "I want to be clear: I am not arguing Hobbes was a good mathematician. He was objectively wrong about the quadrature of the circle. Wallis won that fight. My claim is not that Hobbes's geometric *results* are true, but that his geometric *criteria* for what counts as science (demonstration from arbitrary definitions of causes we construct) is the engine driving his political theory. The value is in the epistemic standard, not the calculation."

  ---

  ### **THE OBJECTIONS (Ordered by Damage)**

  #### **1. The Anachronism Trap (Most Damaging)**
  **Objection:** "You're describing 'arbitrary definition followed by deduction' in a way that sounds like logical positivism or a modern axiomatic system. Are you smuggling a 20th-century philosophy of science onto a 17th-century materialist? Does Hobbes actually have a concept of 'stipulative definition' distinct from nominalism?"

  **Reply (90s):** "That's the crucial historical distinction. Hobbes isn't a logical positivist; he's a materialist. For him, definitions aren't just linguistic conveniences; they are claims about generation. When I define a circle, I'm not just setting a rule; I'm describing the motion that *causes* the figure. Because I conceive the cause, I can demonstrate the properties.
  In *Leviathan*, he does the same with the Commonwealth. We don't discover the state in nature; we generate it through the covenant. The 'arbitrariness' isn't that the definition is random, but that the artifact is human-made, not divinely or naturally given. So, it's not modern axiomatics; it's a claim about *knowability*. We can only have science of things we make. That's the 17th-century core, not a modern imposition."

  **Soft Spot:** You're walking a tightrope between "nominalism" and "constructivism." If they push on whether Hobbes thought definitions were *truly* arbitrary vs. grounded in sense experience, you might wobble.

  #### **2. The Normative Gap**
  **Objection:** "Even if the *form* of reasoning is identical, the *output* is different. Geometry yields truths; Politics yields obligations. A valid deduction about a triangle doesn't create a duty. How does a geometric method generate normative force? You've shown the structure matches, but not how it binds the conscience."

  **Reply (90s):** "Hobbes doesn't think the deduction *itself* creates the obligation; the covenant does. The geometric method is what allows us to understand the *consequences* of that covenant once made.
  Think of it this way: Geometry tells you that *if* you construct a figure this way, these properties *must* follow. Politics tells you *if* you authorize a Sovereign this way, these rights *must* follow. The 'ought' comes from the initial act of will (the covenant), but the 'must'—the inescapable logic of sovereignty—is geometric. He's not deducing morality from lines; he's deducing the necessary conditions of stability from the definition of the artificial person. The method guarantees the necessity of the conclusion, given the premise."

  **Soft Spot:** This relies on the audience accepting that "necessity" in politics works the same way "necessity" works in geometry. Hard determinists will nod; libertarians or natural law theorists will roll their eyes.

  #### **3. The "False Foundation" Problem**
  **Objection:** "If Hobbes's geometric method leads to demonstrably false conclusions in *De Corpore* (as Wallis proved), why should we trust it in *Leviathan*? If the engine produces errors in physics, doesn't that invalidate the engine for politics?"

  **Reply (90s):** "We have to distinguish between the *method* and the *application*. Hobbes failed in geometry because he tried to apply the method to magnitude without respecting the established conventions of the mathematical community. But in politics, he controls the conventions.
  In *Leviathan*, the 'definitions' (human nature, the state of war) are arguably more secure than his geometric axioms because they are introspective. We know the passions because we feel them. The method is only as good as the definitions. My claim is that he *intended* the same rigor, not that he achieved the same success. The failure in math highlights why he was so obsessed with controlling definitions in politics—he knew where the vulnerability lay."

  **Soft Spot:** This is a bit of a save. You're admitting the method is fallible if definitions are bad. They might ask: "So the method isn't sufficient for science?" (Answer: No, definitions must be clear, which is Hobbes's whole point).

  #### **4. The Anthropological Mismatch**
  **Objection:** "Geometric figures are static and obedient. Human beings are passionate, irrational, and dynamic. Can a method designed for static magnitude actually capture the motion of human deliberation? Isn't this a category error?"

  **Reply (90s):** "Hobbes would say human deliberation *is* a kind of motion—endeavor, appetite, aversion. He's a thoroughgoing materialist. He doesn't think there's a category error because he thinks there's only one category: matter in motion.
  The genius of *Leviathan* is treating the Commonwealth as an artificial animal. By reducing human action to calculable motions of self-preservation, he makes the 'material' of politics amenable to the geometric method. He isn't ignoring passion; he's formalizing it. The method works *because* he reduces the anthropological complexity to a set of axiomatic drives. Whether that reduction is *true* is a different question, but it's not a category error within his system."

  **Soft Spot:** If they attack the materialist psychology itself (e.g., "Humans aren't just matter in motion"), you can't defend Hobbes without going down a rabbit hole. Stick to "Within his system..."

  #### **5. Textual Priority**
  **Objection:** "You're claiming *De Corpore* mirrors *Leviathan*. But Hobbes wrote parts of *Leviathan* while the math disputes were heating up. Did he actually intend this structural mirroring, or are you systematizing two projects he kept pragmatically separate?"

  **Reply (90s):** "He explicitly states in *De Corpore* that politics is the only other science besides geometry that allows for demonstration because, in both, we construct the causes. He calls geometry and civil philosophy the only two sciences we can have.
  He doesn't treat them as separate projects; he treats them as the only two islands of certainty in a sea of ignorance. The timing matters less than the systematic claim. He returns to the math disputes for twenty years because he thinks the integrity of the *method* is at stake. If geometry fails as a model of demonstration, the claim that politics can be a science collapses. He fights Wallis so hard because he's fighting for the possibility of political science."

  **Soft Spot:** You need to be sure about the "only two sciences" claim without a citation. (It's in the Preface to *De Corpore* and *Six Lessons*). If they demand a specific text, pivot to the general epistemic claim.

  #### **6. The "Prayer" Question (The Wallis Trap)**
  **Objection:** "Be honest: Isn't this just an elaborate way of romanticizing a mathematical loser? If Wallis was technically right, doesn't that make Hobbes's obsession with the method just stubbornness rather than philosophical insight?"

  **Reply (90s):** "If we judge by the area of the circle, yes, he's a loser. But Hobbes wasn't fighting for the area; he was fighting for the *criteria of truth*.
  Wallis represented an algebraic, symbolic approach that Hobbes thought was 'scabrous'—manipulating symbols without understanding the magnitudes. Hobbes thought true science required intuitive grasp of the generation of the figure. So, historically, he lost the math battle. But philosophically, his insistence that 'science requires knowing the cause because we made it' is a profound insight into the limits of political knowledge. I'm not defending the quadrature; I'm defending the reason he cared about it. He was wrong about the circle, but right about why the circle mattered to him."

  **Soft Spot:** This is the most emotional answer. It risks sounding like you're making excuses for bad math. Keep your tone cool. Admit the loss fully.

  ---

  ### **FINAL TIPS FOR THE ROOM**
  *   **If they ask for a citation:** Don't bluff. Say, "The specific formulation is in the Latin Preface to *De Corpore*, but the systematic link is argued throughout the *Six Lessons*."
  *   **If they say "This is irrelevant to political obligation":** Push back gently. "It's not about obligation directly; it's about the *scientific status* of the obligation. Hobbes wants politics to be indisputable like geometry. That ambition shapes the text."
  *   **Body Language:** When discussing the math failure, shrug. When discussing the method, lean in. Show them you care about the philosophy, not the geometry.
