      *(Self-Correction)*: I should also mention that reducing Śabda to Anumāna is actually a *Buddhist* position, while defending Upamāna is a *Nyaya* position against Buddhists. So the user is fighting the Buddhists on one front while adopting their weapons on another. That's a strategic tension.

