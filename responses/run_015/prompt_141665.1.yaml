prompt: |-
  I have about one postdoc-year of conceptual-research funding to spend on the cluster of problems around expected value fanaticism, and I want to put it where the answer does the most downstream work. I'm less interested in re-litigating whether the fanatical verdict in tiny-probability/huge-stakes cases is correct than in why the debate looks stuck: my sense is that both sides are defending different theses under one label. The decomposition I'd start from: (i) whether value is unbounded at all, or whether some finite cap on how good an outcome can be is independently defensible; (ii) whether, granting unboundedness, small chances of astronomically large goods must be allowed to swamp moderate certain ones, or whether a principled temperance or discounting move survives; (iii) whether the estimation noise and model uncertainty that come with any real-world estimate of such probabilities and stakes are enough to defuse the fanatical verdict — or whether treating that uncertainty correctly just reinstates fanaticism one level up; and (iv) the self-application worry: every argument for or against fanaticism is itself held with less than certainty, and if you are a fanatic you seem required to weight heavily the small chance that the true decision theory or the true axiology makes the fanatical verdict catastrophically wrong, which looks as if it either supports fanaticism trivially or collapses into paralysis. Where (iv) sits in the dependency structure is my main open question.

  Give me a defended ordering for one researcher-year: which question is most upstream, which is genuinely tractable in a year by someone working alone, which matters but needs more than I have, and which I should drop because settling it wouldn't change what any funder, policy shop, or individual donor actually does. Be explicit about the criteria you're trading off, and about what evidence over the next year or two would move items up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Request:**
      *   **User:** A postdoc-level researcher with one year of funding dedicated to "expected value fanaticism" (longtermism, effective altruism, decision theory context).
      *   **Goal:** Maximize downstream impact (work that changes what funders, policy shops, or donors *do*).
      *   **Constraint:** One person, one year.
      *   **Stance:** Less interested in "is fanaticism true?" (normative ethics/decision theory pure), more interested in "why is the debate stuck?" and "what actually guides action?" (meta-ethics, epistemology, practical application).
      *   **Input Decomposition:**
          *   (i) Bounded vs. Unbounded Value (Axiology).
          *   (ii) Swamping vs. Temperance/Discounting (Decision Theory).
          *   (iii) Estimation Noise/Model Uncertainty (Epistemology).
          *   (iv) Self-Application/Recursive Uncertainty (Meta-Decision Theory).
      *   **Task:** Provide a *defended ordering* of these questions based on upstream/downstream status, tractability, impact on action, and criteria trade-offs. Also, specify evidence that would shift the ordering.

  2.  **Evaluate the Four Questions (The "Decomposition"):**

      *   **(i) Bounded vs. Unbounded Value:**
          *   *Nature:* Deep axiology. Is there a maximum possible utility?
          *   *Tractability:* Low. Philosophers have debated this for centuries. Hard to prove a negative (no cap) or a positive (specific cap) without controversial premises.
          *   *Downstream Impact:* High *if* bounded. If bounded, fanaticism dies immediately. But proving it bounded is hard.
          *   *Actionability:* Low. Funders won't stop funding longtermist causes just because a philosopher argues for a cap unless the cap is low enough to matter (which is unlikely for existential risk).

      *   **(ii) Swamping vs. Temperance (Decision Theory):**
          *   *Nature:* Normative decision theory. Should we maximize EV or use something like risk-weighted expected utility (RWEU) or bounded rationality?
          *   *Tractability:* Medium. Formal models exist. But the "why" is contentious (money pumps vs. intuition).
          *   *Downstream Impact:* Medium-High. If temperance is justified, it changes portfolio allocation.
          *   *Actionability:* Medium. Hard to convince EAs to abandon EV maximization without strong arguments.

      *   **(iii) Estimation Noise/Model Uncertainty (Epistemology):**
          *   *Nature:* Empirical/Epistemic. Can we actually *know* the probabilities and utilities involved in fanatical cases?
          *   *Tractability:* High. This involves analyzing specific claims (e.g., x-risk probabilities), sensitivity analysis, and forecasting literature.
          *   *Downstream Impact:* Very High. Even if fanaticism is *theoretically* true, if we can't estimate the terms, we can't *act* on it. This leads to "robustness" criteria rather than pure EV.
          *   *Actionability:* High. Funders care about "robustly good" vs. "speculative huge." This directly informs grantmaking heuristics.

      *   **(iv) Self-Application/Recursive Uncertainty (Meta-Decision Theory):**
          *   *Nature:* Meta-normative. What do we do when we aren't sure about the decision theory itself?
          *   *Tractability:* Low-Medium. Highly abstract. Prone to infinite regress.
          *   *Downstream Impact:* Low-Medium. Often leads to paralysis or "follow your best guess," which doesn't change behavior much compared to (iii).
          *   *Actionability:* Low. Too abstract for policy shops.

  3.  **Determine Criteria for Ordering:**
      *   **Upstreamness:** Does answering this resolve the others?
      *   **Tractability (1 year/solo):** Can a single researcher make progress?
      *   **Action-Guidance (Downstream Work):** Does this change what funders/donors do?
      *   **Bottleneck:** Which question is currently stopping progress?

  4.  **Drafting the Ordering (Iterative Process):**

      *   *Attempt 1 (Philosophical Purity):* (i) -> (ii) -> (iii) -> (iv).
          *   *Critique:* Bad for the user's goal. (i) is a quagmire. Solving (i) doesn't help if we can't estimate probabilities anyway.
      *   *Attempt 2 (Pragmatic/EA Focus):* (iii) -> (ii) -> (iv) -> (i).
          *   *Critique:* Better. (iii) is the real bottleneck for *action*. Even if EV is king, if inputs are noise, output is noise.
      *   *Attempt 3 (Refining the "Stuckness" angle):* The user thinks the debate is stuck because sides talk past each other. The "Epistemic vs. Normative" confusion is key.
      *   *Selection:*
          1.  **Priority 1: (iii) Estimation Noise & Model Uncertainty.** Most tractable, most actionable, bypasses the normative stalemate.
          2.  **Priority 2: (ii) Swamping vs. Temperance.** Important for the theoretical ceiling, but secondary if inputs are unknowable.
          3.  **Priority 3: (iv) Self-Application.** Interesting, but likely derivative.
          4.  **Drop: (i) Boundedness.** Too hard, low marginal impact on *current* decision-making (caps are usually way above x-risk stakes).

  5.  **Fleshing out the Argument for the Ordering:**

      *   **Why (iii) first?** It's the "implementation constraint." Fanaticism requires *reliable* access to tiny probabilities. If model uncertainty swamps the EV calculation, fanaticism is practically inert. This is where the "debate is stuck" diagnosis pays off: one side says "EV says yes," the other says "You can't know that." Formalizing the "can't know" part is high value.
      *   **Why (ii) second?** If (iii) leaves room for robust estimates, then we need to know if we *should* take them. But (ii) is harder to settle normatively.
      *   **Why (iv) third?** It's a meta-layer. If we solve (iii) and (ii), (iv) becomes manageable. If we don't, (iv) is just paralysis.
      *   **Why drop (i)?** Unless the cap is *low* (e.g., human happiness cap), it doesn't stop x-risk fanaticism. Most caps proposed are astronomical. Arguing for a cap is philosophically costly and practically less useful than arguing we can't measure the approach to the cap.

  6.  **Developing the Research Plan (The "One Year"):**
      *   Need concrete deliverables. Not just a paper, but tools/heuristics.
      *   Focus on "Epistemic Humility as a Decision Rule."
      *   Connect to forecasting literature (Tetlock, etc.) and model uncertainty (Bayesian model averaging).

  7.  **Identifying Criteria Trade-offs:**
      *   *Truth vs. Usefulness:* Prioritizing (iii) sacrifices finding the "True Decision Theory" for finding the "Usable Decision Procedure."
      *   *Rigor vs. Speed:* (i) requires deep metaphysics (slow). (iii) allows empirical/semi-formal work (faster).
      *   *General vs. Specific:* (ii) is general. (iii) can be specific to longtermism/x-risk.

  8.  **Defining "Evidence to Shift":**
      *   What would make (i) more important? If someone proves a *low* bound.
      *   What would make (ii) more important? If robust estimation techniques show we *can* know probabilities.
      *   What would make (iv) more important? If normative uncertainty leads to clear divergence from (ii)/(iii) results.

  9.  **Refining the Output:**
      *   Tone: Professional, strategic, academic but pragmatic.
      *   Structure: Executive Summary -> Criteria -> The Ordering -> The Research Plan -> Shift Conditions.
      *   Ensure the "Why the debate is stuck" insight is integrated (Normative vs. Epistemic confusion).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the user's specific point about (iv)'s dependency structure?
      *   *Adjustment:* Explicitly place (iv) as dependent on (ii) and (iii). If (iii) wipes out the signal, (iv) doesn't matter. If (ii) is resolved, (iv) is just applying uncertainty over the winner.
      *   *Check:* Is the "drop" justification strong enough?
      *   *Adjustment:* Emphasize that boundedness arguments often fail to bind *existential* stakes specifically, whereas epistemic arguments bind *all* extreme claims.

  11. **Final Polish:** Ensure clear headings and bold text for readability. (Proceed to generate response).

  *(Self-Correction Note)*: Wait, I need to be careful not to dismiss (i) too lightly. Some boundedness arguments (e.g., welfare lexicality) *are* relevant. But for a 1-year postdoc aiming for *downstream work*, it's still the lowest ROI. I will frame it as "Conditional Drop" or "Monitor only." Actually, the prompt asks what to *drop*. I'll recommend dropping it as a primary focus.

  *(Refining the "Stuckness" Diagnosis)*: The user suspects sides defend different theses. Side A (Fanatics) defends Normative EV. Side B (Anti-Fanatics) often defends Epistemic Skepticism but frames it as Normative. My research should expose this category error. This strengthens the case for prioritizing (iii).

  *(Final Plan)*:
  1.  **Top Priority:** (iii) Epistemic/Model Uncertainty.
  2.  **Second:** (ii) Decision Theory (Temperance).
  3.  **Third:** (iv) Self-Application.
  4.  **Drop:** (i) Boundedness.

