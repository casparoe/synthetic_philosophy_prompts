answer: |-
  This is a strategic allocation problem under constraints (1 FTE-year, solo researcher) with a specific objective function (maximize downstream action-guidance, not just philosophical truth).

  Your diagnosis of the "stuckness" is likely correct: the debate conflates **Normative Fanaticism** (EV maximization is the correct moral calculus) with **Epistemic Fanaticism** (we can reliably identify the inputs for that calculus). Proponents argue the former; opponents often argue the latter while pretending to argue the former.

  Here is the defended ordering for your research year, based on three criteria:
  1.  **Upstreamness:** Does answering this dissolve or resolve the others?
  2.  **Tractability:** Can a solo researcher produce a definitive or highly persuasive output in 12 months?
  3.  **Action-Radius:** Does the output change heuristics for funders, policy shops, or donors?

  ### The Ordering

  #### 1. Primary Focus: (iii) Estimation Noise & Model Uncertainty
  **Status:** **Execute.** This is your comparative advantage and the highest-leverage intervention.
  **Why:** This is the actual bottleneck for action. Even if (i) and (ii) are resolved in favor of the fanatics (unbounded value, strict EV maximization), fanaticism is *practically inert* if the probability estimates are swamped by model uncertainty.
  *   **Upstreamness:** High. If model uncertainty dominates the signal, questions about (ii) temperance become less urgent (you don't need a discount rate if the numerator is noise), and (iv) self-application becomes moot (you can't optimize over uncertainty if the base layer is opaque).
  *   **Tractability:** High. You can utilize existing literature on forecasting, Bayesian model averaging, and sensitivity analysis. You don't need to solve metaphysics; you need to formalize "epistemic humility" as a decision rule.
  *   **Action-Radius:** Very High. Funders cannot act on "1 in 10^9" claims. They *can* act on "robustly positive across a range of plausible models." A framework for distinguishing *estimable* longtermist interventions from *speculative* ones directly informs grantmaking criteria.
  *   **The "Stuckness" Fix:** This explicitly separates the Normative claim (EV is good) from the Epistemic claim (We know the inputs). It allows you to concede the normative point to fanatics while defeating the practical verdict.

  #### 2. Secondary Focus: (ii) Swamping vs. Principled Temperance
  **Status:** **Monitor/Integrate.** Do not attempt to solve normatively; solve *instrumentally*.
  **Why:** You cannot settle the normative debate over Risk-Weighted Expected Utility (RWEU) vs. standard EV in one year. However, you can investigate temperance as a *heuristic* for handling (iii).
  *   **Upstreamness:** Medium. If a principled discount rate is found, it overrides (iii). But finding one is philosophically costly.
  *   **Tractability:** Low (Normative) / Medium (Instrumental). Don't argue for RWEU from first principles. Instead, argue that temperance functions as a necessary error-correction mechanism for the model uncertainty identified in (iii).
  *   **Action-Radius:** Medium. If you can show that "temperance" is just a proxy for "accounting for tail risk in our models," donors will adopt it without needing to accept a new decision theory.
  *   **Dependency:** This depends on (iii). If (iii) shows estimates are impossible, (ii) is irrelevant. If (iii) shows estimates are possible but noisy, (ii) becomes the tool to manage that noise.

  #### 3. Tertiary Focus: (iv) Self-Application / Recursive Uncertainty
  **Status:** **Defer.** This is a dependency, not a driver.
  **Why:** You identified the dependency structure as an open question. The dependency is: *Self-application only matters if there is a non-negligible probability that the first-order decision theory is wrong AND that the alternative yields divergent action.*
  *   **Upstreamness:** Low. It sits on top of (i) and (ii).
  *   **Tractability:** Low. Prone to infinite regress and paralysis arguments that yield no action-guidance.
  *   **Action-Radius:** Low. "Maximize expected choice-worthiness" (the standard solution to normative uncertainty) usually collapses back into following your best guess of (ii). Unless you find a specific case where normative uncertainty *reverses* the verdict of your best-guess theory, this is theoretical overhead.
  *   **Strategy:** Treat this as a sensitivity check on your conclusions from (ii) and (iii), not a primary research line.

  #### 4. Drop: (i) Bounded vs. Unbounded Value
  **Status:** **Drop.**
  **Why:** This is the "philosophical black hole." It consumes infinite time for marginal practical gain.
  *   **Upstreamness:** Theoretically High, Practically Low. Yes, if value is bounded, fanaticism dies. But to matter for longtermism/x-risk, the bound must be *below* the stakes of existential risk mitigation. Most plausible bounds (e.g., based on human experience) are either arbitrary or still astronomical.
  *   **Tractability:** Very Low. No consensus is emerging in axiology.
  *   **Action-Radius:** Negligible. A funder will not stop funding x-risk reduction because a philosopher argues utility is bounded at $10^{100}$ utils. They will only stop if you prove they *cannot estimate* the probability of reaching that bound (which returns you to (iii)).
  *   **Opportunity Cost:** Time spent defending a specific cap is time not spent building the epistemic framework that actually guides portfolios.

  ---

  ### The One-Year Research Plan: "Epistemic Robustness as a Decision Rule"

  **Objective:** Produce a framework that allows donors to filter fanatical opportunities based on *estimability* rather than *axiology*.

  **Months 1-3: Mapping the Epistemic Terrain (Focus on iii)**
  *   **Task:** Survey literature on "deep uncertainty," "Knightian uncertainty," and forecasting calibration in extreme tails (e.g., Good Judgment Project, intelligence community forecasting).
  *   **Output:** A taxonomy of "Fanatical Claims" categorized by their epistemic structure (e.g., "physics-based probability" vs. "sociological speculation").
  *   **Goal:** Show that not all tiny-probability claims are epistemically equal. Some are noise; some are signal.

  **Months 4-6: Formalizing the "Noise Floor" (Focus on iii & ii)**
  *   **Task:** Develop a model where model uncertainty acts as a discount factor. Instead of arguing for RWEU normatively, argue that *Bayesian Model Averaging* over plausible world-models naturally dampens fanatical verdicts.
  *   **Output:** A technical paper or working model showing how increasing model uncertainty mathematically converges toward temperance, even under standard EV maximization.
  *   **Goal:** Bridge the gap between the "Epistemic" and "Normative" sides. Show the anti-fanatics they don't need new ethics, just better stats. Show the fanatics they need better data.

  **Months 7-9: Downstream Application (Focus on Action-Radius)**
  *   **Task:** Apply the framework to 2-3 concrete longtermist cause areas (e.g., AI safety vs. biosecurity vs. moral circle expansion).
  *   **Output:** Case studies demonstrating how the "Epistemic Robustness" filter changes allocation compared to raw EV.
  *   **Goal:** Give funders a heuristic (e.g., "The 3-Model Test") they can use immediately.

  **Months 10-12: Synthesis & Meta-Check (Focus on iv)**
  *   **Task:** Briefly check if normative uncertainty (iv) alters the recommendations from Months 4-9.
  *   **Output:** Final paper + Policy Brief.
  *   **Goal:** Cement the argument that the debate was stuck because it was treating an epistemic problem as a normative one.

  ---

  ### Criteria Trade-offs

  1.  **Truth vs. Utility:** You are trading off finding the *True Decision Theory* (ii) for finding the *Usable Decision Procedure* (iii). You are accepting that you might not solve whether EV is *correct*, only when it is *actionable*.
  2.  **Rigor vs. Speed:** By dropping (i), you sacrifice metaphysical rigor for speed. You are assuming that for the next 50 years, humanity will operate as if value is unbounded because the bounds are too distant to matter.
  3.  **General vs. Specific:** You are prioritizing specific application to longtermism over general decision theory. This increases impact on your target audience (EA funders) but decreases citation potential in pure philosophy journals.

  ### Evidence That Would Shift the Ordering

  You should pivot if the following evidence emerges in the next 12-24 months:

  *   **Shift (iii) down / (i) up:** If a prominent axiologist (e.g., Arntzenius, Beckstead) publishes a proof of a **low** value bound (one reachable within centuries, not eons). If the cap is "low," fanaticism dies instantly, making epistemic analysis redundant.
  *   **Shift (iii) down / (ii) up:** If the forecasting literature demonstrates **high calibration** on extreme tail events (e.g., if superforecasters can reliably distinguish $10^{-6}$ from $10^{-9}$). If we *can* know the inputs, the epistemic defense collapses, and you must fight on normative grounds (ii).
  *   **Shift (iv) up:** If a new formalism for normative uncertainty (e.g., from the Oxford Global Priorities Institute) demonstrates that maximizing expected choice-worthiness *systematically* reverses EV verdicts in longtermist cases. Currently, it usually reinforces them; if that changes, (iv) becomes critical.

  ### Summary Recommendation
  Spend your year formalizing **Epistemic Robustness**. Argue that the "Anti-Fanatic" position is not a rejection of Expected Value, but a rejection of **Precision** in the tails. This allows you to keep the fanatics' decision theory while neutralizing their most controversial verdicts, providing funders with a principled way to say "no" to speculative projects without abandoning longtermism. This is the path of highest leverage for a single researcher-year.
