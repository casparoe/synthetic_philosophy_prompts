  *(Refining the Nightmare Question)*: The absolute worst question for a non-CBA argument in a CBA room is: "If you won't trade off, how do you prioritize between two precautionary claims?" (e.g., Cancer risk vs. Climate risk). I'll use that or the Shadow Price one. The Shadow Price one is more fundamental to *their* worldview. Let's go with "How do you allocate scarce resources between competing precautionary demands?" because it forces a trade-off. Actually, the prompt asks for "the one question I'm quietly hoping nobody asks." Usually, that's the one that exposes the internal contradiction. "If safety is lexical, what do you do when two safety claims conflict?" is good. But "What is the shadow price?" is more economist-specific. Let's go with the Resource Allocation/Trade-off question. It forces the CBA back in.

