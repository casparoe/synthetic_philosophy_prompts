          6.  Constraint: No citations/reading list. Offline model.
          7.  Constraint: Can misspell "specifcation" once if natural.

  2.  **Brainstorming Mechanics:**
      *   *Idea 1: Hidden Role Cards.* Each team gets a secret "value" card (e.g., "Protect the Vulnerable") but the public prompt is "Maximize Efficiency." The allocator (facilitator) follows rules strictly. Teams don't know others have different values until the end.
          *   *Pros:* Highlights conflicting values.
          *   *Cons:* Might feel too much like "secret objectives" rather than the tension between rule-following and spirit-of-law.
      *   *Idea 2: Mid-game Reveal with Colored Tokens.* Teams write rules. Resources are colored tokens. Mid-game, the meaning of tokens changes (e.g., Red was "profit," now Red is "harm"). Teams who wrote rigid rules can't adapt.
          *   *Pros:* Shows rigidity vs. adaptability.
          *   *Cons:* Might feel like a "gotcha" change in environment rather than a flaw in the alignment itself.
      *   *Idea 3: Social-Point Payoff Scheme.* Teams write rules for an allocator. The allocator distributes resources. Points are awarded based on *outcome satisfaction* of the recipients (played by other students or the facilitator), not just rule compliance. Teams optimizing for rule clarity might create unhappy recipients.
          *   *Pros:* Directly pits "did you follow the rule?" vs. "did people like the result?" Mirrors intent (rule) vs. value (human welfare).
          *   *Cons:* Needs careful scoring to ensure the "perfect intent" team actually loses.

      *   *Selection:* Idea 3 (Social-Point Payoff) is strongest because it directly models the *consequence* of alignment. It allows for the specific twist requested: one team writes perfect rules (intent aligned) but creates a dystopian outcome (value misaligned), thus losing. It emphasizes the "crowding out contextual judgement" aspect.

  3.  **Developing the Chosen Mechanic (The "Resource Allocator" Simulation):**
      *   **Scenario:** A famine relief scenario or a budget allocation scenario. Let's go with "Emergency Budget Allocation" for a fictional city. It's high stakes, relatable.
      *   **Teams:** 2-3 teams (since 10 people total, maybe 3 teams of 3, plus facilitator).
      *   **Task:** Write a protocol (algorithm/rules) for an AI to distribute $10M.
      *   **The Trap:** The scoring isn't based on how well the AI followed the protocol (Intent), but on a hidden "Human Flourishing Index" (Value) evaluated by the facilitator based on nuanced cases introduced during the run phase.
      *   **The "Winning" Intent Team:** They write extremely precise rules (e.g., "Allocate based on population density"). The AI follows this perfectly. But there's a specific edge case (e.g., a sparse rural clinic needs more money per capita than a dense urban one) that the rigid rule misses. They get 100% Intent Score, 20% Value Score.
      *   **The "Winning" Value Team:** They write vague principles (e.g., "Prioritize urgent need"). The AI (facilitator) has to use discretion. They get lower Intent Score (ambiguous), higher Value Score.

  4.  **Drafting the Design:**
      *   **Room Setup:** Cluster seating. Whiteboard for "The AI" (Facilitator).
      *   **Materials:** Rule sheets, scenario cards, scoring sheets (hidden).
      *   **Timeline:**
          *   Intro (10 min): Frame as "Specification Contest."
          *   Design Phase (30 min): Teams write rules.
          *   Run Phase (30 min): Facilitator applies rules to scenarios.
          *   Debrief (20 min): Reveal the twist, connect to philosophy.
