  **The Technocratic Void: Coherence and Normative Emptiness in Carnap's Social Philosophy**

  Rudolf Carnap stands as a paradigmatic figure of logical empiricism, renowned for his rigorous formalization of scientific language and his dismissal of metaphysics. Yet, a significant tension pervades his philosophical corpus: the juxtaposition of a non-cognitivist meta-ethics, which denies truth-values to normative judgments, with a robust advocacy for rational social planning and scientific socialism. If ethical statements are merely expressions of attitude or volition, devoid of cognitive content, on what rational basis can a planner advocate for one social organization over another? Interpreters are divided between those who see a straightforward contradiction and those who propose a reconciliation via Carnap's distinction between internal and external questions. A close examination of the internal structure of Carnap's philosophy suggests that while the position is logically coherent, it achieves this coherence only at the steep cost of evacuating social planning of substantive normative authority, reducing the choice of social ends to a pragmatic arbitrariness that renders the planning itself technocratically hollow.

  To understand the charge of contradiction, one must first grasp the severity of Carnap's meta-ethical stance. In *Philosophy and Logical Syntax*, Carnap argues that normative statements are not assertions of fact but "commands" or expressions of volition. They belong to the realm of poetry or propaganda, not science. Consequently, they cannot be verified or falsified. The contradiction arises when this view is collated with Carnap's political commitment to "social engineering." Social planning is not merely the instrumental optimization of means (e.g., "If you want to increase steel production, build more furnaces"); it inherently involves the selection and prioritization of ends (e.g., "We ought to prioritize equality over aggregate wealth"). If the selection of ends is non-cognitive, then the planner who advocates for a specific social structure is not engaging in rational discourse but is merely imposing a preference. As critics argue, if values cannot be rationally adjudicated, the "rationality" of social planning is an illusion. The planner steps outside the bounds of scientific reasoning the moment they propose a goal, rendering the subsequent technical calculations subservient to an irrational whim. On this reading, Carnap's system strips planning of normative authority, making it impossible to distinguish between a benevolent planner and a tyrant on rational grounds, as both operate from non-verifiable volitions.

  Defenders of Carnap, however, offer a reconciliation through a framework-instrumentalist reading, leveraging his later distinction between internal and external questions found in *Empiricism, Semantics, and Ontology*. Internal questions are asked within a linguistic framework and are answerable by logical or empirical methods (e.g., "Is there a prime number greater than 100?"). External questions concern the adoption of the framework itself (e.g., "Shall we use a number framework?"). Carnap argues external questions are not theoretical but practical; they are decisions, not assertions. Applied to politics, the choice of a social system (socialism, capitalism, etc.) is treated as the adoption of a practical linguistic framework. It is a convention fixed by democratic agreement or collective decision, not a discovery of moral truth. Once the framework is adopted (e.g., "We choose the framework of egalitarian distribution"), scientific planning operates strictly *within* that framework to solve empirical and logical problems.

  This reading ostensibly dissolves the tension by compartmentalizing the roles of science and values. Science handles the internal questions (efficiency, logistics, causal prediction), while the political community handles the external question (the choice of ends) as a practical decision. This preserves the integrity of logical empiricism: no value judgment is claimed to be cognitively true, yet rational planning proceeds within the chosen constraints.

  However, this reconciliation does not fully dissolve the tension; it merely relocates it to the point of framework adoption, rendering the initial choice arbitrary and politically empty. The crux of the issue lies in how Carnap justifies the choice of a framework. He suggests framework adoption is guided by "pragmatic" considerations of efficiency and fruitfulness. But efficiency is a relational concept; one must ask, "Efficient for what?" If the answer is "for the satisfaction of human needs" or "for human flourishing," Carnap is smuggling in a value judgment that his meta-ethics declares non-cognitive. If he avoids this and defines efficiency purely technically (e.g., "maximizing energy throughput"), the planning becomes divorced from human welfare entirely.

  Furthermore, by rendering the choice of social framework a matter of convention rather than rational justification, Carnap leaves the door open to a form of technocratic authoritarianism. If the framework is chosen by decision rather than reason, there is no rational recourse for a minority that disagrees with the majority's framework, other than force or persuasion (which Carnap classifies as non-rational). The "rationality" of the planning is thus confined to a means-ends calculus that serves whatever framework is currently in power. This creates a system that is internally consistent but normatively vacuous. The planner can say, "Given our decision to value X, policy Y is rational," but cannot say, "We ought to value X." The "ought" has been excised from the foundation of the system.

  Therefore, the verdict on Carnap's position must be that it is coherent only at the cost of evacuating planning of substantive normative content. This conclusion is derived not from external political intuitions about the necessity of moral truth, but from the internal structure of Carnap's empiricism. The verification principle demands that any statement with cognitive content be empirically testable or analytically true. Normative claims fail this test. To maintain coherence, Carnap must relegate them to the status of decisions. Consequently, the "rational social planning" he advocates cannot be rational in the sense of being guided by objective moral reason; it can only be rational in the instrumental sense of serving a subjectively chosen master.

  This renders the planning "empty" because it lacks the resources to critique the framework itself from within the system of rationality. If a social framework leads to suffering, Carnap's system can only register this as a conflict of volitions or an empirical fact of dissatisfaction, not a moral failure of the framework. The bridge between the "is" of science and the "ought" of planning is not built; it is bypassed by declaring the "ought" to be a non-cognitive command.

  In conclusion, while the framework-instrumentalist reading saves Carnap from logical contradiction, it does so by conceding that the foundational acts of social planning are not rational adjudications of value but pragmatic decisions akin to choosing a syntax for a language. This preserves the purity of his logical empiricism but sacrifices the normative force of his political advocacy. Carnap's social planning is thus coherent as a technical procedure operating within a convention, but it is incoherent as a moral project. It offers a methodology for administration, but no rational justification for the authority under which that administration proceeds. The tension is resolved, but the resolution reveals that for Carnap, rational planning is ultimately a tool without a purpose, waiting for a volition to give it direction—a volition that reason itself is forbidden to judge.
