  ### Brainstorming Notes

  *   **Candidate Agreed Claim:** Both sides accept physicalism; no "ghost in the machine." The mental supervenes on the physical. (Too generic? Need to tie it to the MR debate specifically.) -> *Refinement:* Agree that every instance of a psychological state has *some* physical base, but disagree on whether the *type* of state maps to a *type* of physical base.
  *   **Candidate Agreed Claim:** The "Swapping Criterion." We must agree that physical differences only mandate psychological differences if they alter the causal profile defined by psychology. This prevents the critic from saying "different neurons = different state" trivially.
  *   **Candidate Agreed Claim:** The "Shrinking Dynamic." Both agree that as we make psychological descriptions more specific (e.g., from "pain" to "pain in a mammal"), the set of possible physical realizers shrinks.
  *   **Rival Formulation (Functionalist):** Autonomy is principled; psychology tracks causal roles that are invariant across substrates.
  *   **Rival Formulation (Critic):** Autonomy is pragmatic; psychology tracks causal roles that are *contingently* similar due to convergent evolution or physical constraints.
  *   **Candidate Crux:** Artificial Intelligence. If we build a mind in silicon, does it need to mimic neural dynamics closely (Critic) or just input-output functions (Functionalist)?
  *   **Candidate Crux:** Cross-species neurobiology. Do octopuses and humans use structurally similar circuits for learning? (Critic predicts yes/convergence; Functionalist predicts no/divergence).
  *   **Discard:** "Consciousness is irreducible." (Too specific, conflates MR with qualia).
  *   **Discard:** "Reduction is impossible." (Critic won't sign this; Functionalist might not need impossibility, just impracticality).
  *   **Verbal Dispute Check:** Is the fight about what counts as a "kind"? If the disjunction is finite, is it a "natural kind"? This needs to be flagged.

