  # Joint Statement on Multiple Realizability and Levels of Explanation

  ### I. Agreed Claims

  Both signatories endorse the following claims as the common ground for this dispute. These claims define the terms of engagement and isolate the substantive disagreements from methodological preliminaries.

  1.  **Physical Supervenience:** Both camps accept that every particular instance of a psychological state is constituted by some physical state. There is no psychological difference without a physical difference. The dispute concerns whether psychological *kinds* map onto physical *kinds*.
  2.  **The Swapping Criterion for Individuation:** We adopt the following working criterion for determining when physical differences entail psychological differences: A difference in the physical base counts as a difference in the realized psychological state only if swapping in the alternative physical base would change the causal profile that the higher-level science (psychology) assigns to the state. If the causal profile remains invariant under the swap, the physical difference constitutes multiple realizability of the *same* state, not a difference in state.
  3.  **The Shrinking Dynamic:** Both camps acknowledge that as the description of a psychological state becomes finer-grained (e.g., moving from "belief" to "belief formed under conditions X in organism type Y"), the set of compatible physical realizers shrinks. Coarse-grained functional descriptions admit a wider range of physical bases than fine-grained mechanistic descriptions.
  4.  **Limits of the Shrinking Dynamic:** Both camps agree that the shrinking dynamic alone does not settle the debate. The fact that realizer classes shrink as descriptions refine does not prove that they vanish entirely (reduction), nor does it prove they remain indefinitely disjunctive (autonomy). The limit behavior of this process is the core empirical and theoretical question.
  5.  **Explanatory Utility:** Both camps agree that psychological explanations are currently indispensable for predicting behavior and guiding research. The dispute is not about whether to use psychological vocabulary today, but about whether that vocabulary picks out genuine natural kinds that are irreducible to physical vocabulary in principle.
  6.  **Nomological Constraint:** Multiple realizability must be demonstrated within the bounds of nomological possibility (the laws of nature as they actually are), not merely logical or metaphysical possibility. Science fiction scenarios involving magic or physics-violating substances do not count as evidence for multiple realizability in the actual world.

  ### II. Residual Disagreements

  The following table outlines the divergent interpretations of the agreed claims. Each formulation is phrased to be acceptable to the respective camp while highlighting the tension between them.

  | Topic | Functionalist Formulation | Neuroscience-First Critic Formulation |
  | :--- | :--- | :--- |
  | **The Nature of the Disjunction** | The set of physical realizers for robust psychological kinds is *heterogeneous*. Even at the limit of fine-graining, the base will be a disjunction of structurally distinct physical types (e.g., carbon-based neurons vs. silicon gates) that share no unified physical description. | The set of physical realizers for robust psychological kinds is *constrained*. As descriptions refine, the apparent disjunction resolves into a unified class of physical mechanisms that share deep structural or dynamic properties (e.g., specific neural coding schemes). |
  | **Source of Similarity** | Psychological similarity arises from the abstraction of causal roles. Different physical systems can occupy the same role because the role is defined by relations to inputs, outputs, and other states, not by internal constitution. | Psychological similarity arises from convergent evolutionary pressures and physical constraints. Different systems look functionally similar because there are only a few efficient physical ways to solve specific computational problems. |
  | **Autonomy of Psychology** | Psychology is autonomous because its kinds are *multiply realized*. Since no single physical kind maps onto a psychological kind, psychological laws cannot be reduced to physical laws without losing their generality. | Psychology is autonomous only *pragmatically*. Its kinds are provisional placeholders for underlying mechanistic kinds. Reduction is possible in principle, but psychological vocabulary remains useful for managing complexity. |
  | **The Limit of Refinement** | We suspect the shrinking class of realizers will **asymptote** at a genuinely disjunctive base. No matter how precisely we define the state, there will remain distinct physical ways to achieve it. | We suspect the shrinking class of realizers will **empty** of alternatives. At sufficient precision, each psychological state type will correspond to a unique (or unified) physical state type, eliminating the disjunction. |

  ### III. Cruxes and Adjudicating Evidence

  The following cruxes identify concrete areas where empirical findings or specific arguments would shift the burden of proof. For each crux, we record the distinct predictions made by each camp.

  | Crux | Description of Case / Finding | Functionalist Prediction | Critic Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Cross-Species Neural Homology** | Comparative neurobiology investigates whether distantly related species (e.g., humans and octopuses) utilize structurally similar neural circuits to solve identical cognitive tasks (e.g., spatial learning). | **Divergence.** We predict that while the behavior is identical, the underlying neural architectures will be structurally distinct. The same functional role will be played by different circuit dynamics, supporting the claim that the psychological kind is not tied to a specific neural kind. | **Convergence.** We predict that efficient solutions to cognitive problems are physically constrained. We will find deep structural homologies or convergent dynamic patterns (e.g., specific oscillatory frequencies) across species, suggesting a unified physical kind underlies the psychological kind. |
  | **2. Non-Biological Intelligence** | The construction of an artificial system that passes rigorous tests for psychological states (e.g., reasoning, belief attribution) without using biological neural tissue. | **Feasibility of Dissimilarity.** We predict such a system can be built using architectures wildly different from biological brains (e.g., symbolic logic or distinct neural net topologies) while realizing the *same* psychological states. | **Necessity of Mimicry.** We predict that to truly realize these states, the artificial system must mimic the specific dynamic properties of biological neural networks. If the architecture is too different, it will simulate the behavior but fail to realize the state (changing the causal profile). |
  | **3. The Limit of Psychophysical Mapping** | A comprehensive research program attempts to refine psychological categories until each maps to a unified neural signature across all instances. | **Failure via Disjunction.** The program will fail because the final categories will always require a disjunctive physical definition (e.g., "Neural Pattern A OR Neural Pattern B"). The "OR" cannot be eliminated. | **Success via Unification.** The program will succeed because the apparent disjunctions are artifacts of coarse measurement. Finer measurement will reveal a common variable (e.g., a specific information-theoretic metric) that unifies the physical base. |

  ### IV. Verbal vs. Substantive Disputes

  We identify one area where the disagreement appears partially verbal, though it rests on substantive commitments.

  *   **The Definition of "Natural Kind":**
      *   **The Dispute:** The Functionalist claims that a disjunctive physical base (A or B or C) cannot constitute a natural kind, thereby rendering the psychological kind irreducible. The Critic claims that if the disjunction is finite and law-governed, it can be treated as a natural kind for the purposes of reduction.
      *   **Why it is Verbal:** If both sides agree on the exact structure of the world (i.e., that psychological states map to a finite list of disparate physical states), the argument over whether this counts as "reduction" depends on the definition of the term.
      *   **Why it is Substantive:** The disagreement reflects a deeper clash about the nature of scientific laws. The Functionalist holds that genuine laws must be exceptionless and unitary; a disjunctive base implies the psychological law is not fundamental. The Critic holds that scientific laws are often local and mechanistic; a disjunctive base simply reflects the historical contingency of the mechanisms, not a failure of reduction.
      *   **Resolution Strategy:** We agree to set aside the label "reduction" and focus on the structural claim: **Does the set of physical realizers for a psychological kind admit a unified physical description?** If yes, the Critic wins the substantive point. If no (if the description must remain an unstructured list of alternatives), the Functionalist wins the substantive point.

