answer: |-
  Dr. Aris stands before the survey crew at the morning briefing, her field notebook open to a page densely filled with fresh data points from yesterday's transect. She points to the map and says flatly, "The water table has risen above the critical threshold in Sector 4." She is right; she personally measured the piezometers twice, logged the readings, and cross-referenced them with the rainfall data, so she knows the proposition is true and her belief is evidentially solid. However, over the last six months, Aris has developed a habit of announcing similar hydrological statuses with the same confident tone based merely on hunches or outdated models, and her confident assertions during this period have been correct only 40% of the time. The crew knows this statistic from the monthly audit logs, but they cannot distinguish which of her current claims are backed by fresh measurement and which are guesses, as she uses the same declarative syntax for both.

  This case meets your criteria.
  **Proposition:** The water table has risen above the critical threshold in Sector 4.
  **Basis:** Direct measurement, logging, and cross-referencing (Knowledge).
  **Reference Class & Hit Rate:** The class is "flat assertions regarding hydrological status made by Aris during briefings over the last six months"; the hit rate is 40%.
  **Reference Class Choice:** I selected "flat assertions at that confidence level" rather than "everything she asserts." The cost is that it requires us to identify confidence levels independently of permissibility (avoiding circularity where "flat" just means "permissibly certain"), and it concedes that Aris might be permissible if she hedged, even with the same evidence.
  **Norm Deliverables:**
  *   **Truth Norm:** Permissible. *p* is true.
  *   **Reasonable-Belief Norm:** Permissible. Her evidence is strong and she has done the work.
  *   **Knowledge Norm:** Permissible. She knows *p*; there is no Gettier problem or false lemma.
  *   **Calibration Norm:** Impermissible. Her confidence (implied by flat assertion) exceeds her actual reliability (40%) within the relevant reference class.
  **Feature Doing the Work:** The indistinguishability of checked versus unchecked claims combined with the known poor track record. If the hearers could tell which claims were checked (e.g., she shows the notebook or uses a different linguistic marker for verified data), the local reliability is restored, and the Calibration Norm would likely permit the assertion because the reference class shifts to "verified claims."
  **Strongest Knowledge-Norm Objection:** Your opponent will argue that you are conflating the norm of *assertion* with the norm of *testimony* or *professional conduct*. They will claim that because Aris knows *p*, she satisfies the epistemic norm of assertion *simpliciter*. The reason she shouldn't speak is pragmatic or institutional: speaking without displaying evidence wastes the crew's time filtering signal from noise (a consequence) or violates a lab protocol about data verification (etiquette/rules). They will insist the defect lies in the audience's inability to discriminate, not in the speaker's epistemic right to assert what she knows.
