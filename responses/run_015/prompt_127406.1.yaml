answer: |-
  There is a baseline debt we **owe**,
  And then the surplus we may **give**.
  The saint accepts the public **praise**,
  But walks away without the **blame**.
  This open space is called **grace**,
  Where no demand says "this is **enough**."

  Who draws the line at **enough**?
  The ledger marks what strictly **owe**.
  But habit masquerades as **grace**,
  The hand grows tired that must **give**.
  The crowd looks for someone to **blame**,
  When heroes stop expecting **praise**.

  They trade the optional **praise**
  For demand: is this yet **enough**?
  They seek a target for their **blame**
  When we withhold what we do not **owe**.
  They say we are bound to **give**,
  And call coercion simple **grace**.

  Is this still unmerited **grace**?
  Or just the price of earned **praise**?
  The saint refuses now to **give**,
  Asking only what is **enough**.
  The debt exceeds what others **owe**,
  The social finger points with **blame**.

  But truth forbids the assignment of **blame**.
  The category rests on **grace**,
  Not on the minimum we **owe**.
  Keep distinct the reward of **praise**,
  Until the saint says "this is **enough**."
  Restore the freedom to **give**.

  The hand remains free to **give**,
  Or rest incur no worthy **blame**.
  When has the hero done **enough**?
  When the act remains pure **grace**.
  Do not withdraw the **praise**,
  But do not tally what we **owe**.

  Count what you **owe**, give no debt to the **give**,
  Split the reward of **praise** from the threat of **blame**,
  So **grace** holds open, never **enough** to close.

  ***

  **Commentary**

  I have committed to the reading that supererogation is a logically distinct category that does not collapse under repetition—the "ratchet" is a social confusion, not a moral reality. The poem enacts this by distinguishing between the *social pressure* (stanzas 3 and 4, where the crowd conflates habit with duty) and the *moral logic* (stanzas 5 and 6, where the asymmetry is reasserted). The sestina's repetitive form mimics the ratchet mechanism itself; the returning words feel like accumulating expectations. However, by shifting the syntactic relationship between the words in the second half (e.g., moving from "habit masquerades as grace" to "category rests on grace"), the poem resists the form's tendency toward entrapment, enacting the verdict that the category holds. I took a liberty with "grace," secularizing it from its theological origin (counsels of perfection) to function as a moral synonym for "unowed favor," ensuring the poem remains philosophical rather than devotional. The envoy forces all six terms into three lines to simulate the pressure of the boundary condition, ultimately deciding that the space remains open.
