answer: |-
  This is a fantastic question. You've identified a genuine tension in the metaphysics of software engineering. As a backend engineer, you deal with the *mechanics* of this dance (dependency hell, deprecation warnings, fork maintenance), but you're asking about the *ontology* of the norms that govern it.

  Here is a breakdown of the philosophical machinery under the hood of Open Source Software (OSS) norms, addressing your specific points on Lewis, evolution, crypto, and governance.

  ### 1. Lewis vs. Evolution: Coordination or Survival?

  You asked if SemVer requires David Lewis's account of conventions (coordination equilibria based on common knowledge) or if a pure evolutionary account suffices.

  **The Lewisian View (The Contract):**
  David Lewis, in *Convention* (1969), argues that a convention exists when there is a regularity in behavior, everyone prefers to conform if others conform, and crucially, there is **common knowledge** of this expectation.
  *   **SemVer as Lewisian:** When you see `v2.1.0`, you expect backward compatibility. The maintainer knows you expect it. You know they know you expect it. This is a coordination equilibrium. If the maintainer breaks it without a major version bump, they aren't just making a technical error; they are violating the *common knowledge* that makes the signal useful.
  *   **The Fork as Collapse:** In Lewis's framework, a fork happens when the common knowledge shatters. The community splits into two groups with *different* expectations of what the "true" project is. The "zombie branch" persists because a subset of users still coordinates around the old equilibrium (stability), while the mainline coordinates around a new one (innovation).

  **The Evolutionary View (The Ecosystem):**
  An evolutionary account (think Dennett or Millikan) suggests norms don't need common knowledge; they just need differential reproduction.
  *   **SemVer as Survival:** Projects that respect SemVer get adopted more. Projects that break APIs arbitrarily get abandoned. The norm persists not because we all agreed to it, but because projects that violate it die out (or get forked into oblivion).
  *   **The Fork as Mutation:** Here, forking isn't a coordination failure; it's a speciation event. The "zombie branch" is a distinct species occupying a different niche (legacy enterprise stability) than the mainline (cutting-edge features).

  **The Verdict:**
  The practice is **hybrid**.
  *   **Micro-level (Daily Dev):** It relies on **Lewis**. You cannot use a library without the common knowledge that `minor` means `compatible`. If that common knowledge is absent, the signal is noise.
  *   **Macro-level (Ecosystem History):** It relies on **Evolution**. SemVer dominates over other versioning schemes because projects using it survived longer.
  *   **The Tension:** The "bugging" feeling you have comes from the clash. Maintainers *talk* like Lewisians ("We promise stability") but *act* like Evolutionists ("Adapt or we fork").

  ### 2. The Lib vs. Crypto Inconsistency

  You asked: *Is it consistent that we treat breaking changes in libraries as morally bad but celebrate hard forks in blockchain protocols?*

  On the surface, it looks hypocritical. In both cases, the state changes incompatibly. But philosophically, they rely on different models of **agency and externality**.

  **Libraries: The Problem of Externalities**
  *   **Context:** A library is a dependency. It is a component inside *your* system.
  *   **The Moral Claim:** When a maintainer breaks SemVer in a minor release, they are imposing an **externality** on you. You incur a cost (refactoring) without your consent.
  *   **Philosophy:** This is deontological. You made a promise (via the version number), and breaking it violates the duty of non-maleficence toward downstream users.
  *   **Forking:** Forking a library is seen as a tragedy (fragmentation, duplicated security effort) because the goal of libraries is *composability*. We want a monoculture of utilities so everything fits together.

  **Blockchains: The Problem of Sovereignty**
  *   **Context:** A blockchain is a state machine owned by *no one* and *everyone*.
  *   **The Moral Claim:** A hard fork is not an externality; it is an **exercise of sovereignty**. If the community disagrees on the rules (e.g., The DAO hack, Block Size), the only way to resolve the dispute without a central authority is to split the state.
  *   **Philosophy:** This is liberal-political. The "code is law" ethos implies that if the law changes in a way you dislike, you have the right to secede.
  *   **Forking:** Forking a chain is celebrated as a feature (exit rights) because the goal of chains is *consensus*. If consensus breaks, splitting is the only honest resolution.

  **Consistency Check:**
  It is consistent if the underlying principle is **Consent**.
  *   In libs, you didn't consent to the upgrade cost, so breaking changes are "bad."
  *   In crypto, the fork *is* the mechanism of consent. You choose which chain to validate.
  *   **The Friction:** The friction arises because OSS libraries are increasingly treated like public infrastructure (like chains), but governed like private products (like libs).

  ### 3. Governance Implications: If Norms are Evolutionary

  If we accept the **Evolutionary Account** (norms are just what survives fork-pressure) rather than the Lewisian Account (norms are promises we must keep), package repository governance (npm, PyPI, Cargo) would need to shift drastically.

  Currently, repos act like **Regulators** (Lewisian Enforcers):
  *   They encourage SemVer.
  *   They allow yanking of "bad" versions.
  *   They treat forking as a last resort.

  If they acted on **Evolutionary Theory**, they would act like **Gardeners**:
  1.  **Stop Policing SemVer:** Don't warn users about "violations." Let the market punish maintainers who break things. If a library breaks often, its "fitness score" (downloads/dependents) drops naturally.
  2.  **First-Class Fork Support:** Currently, forks are second-class citizens (you have to publish under a new name, losing social proof). An evolutionary repo would make forking frictionless. If `library-A` stagnates, `library-A-fork` should be able to seamlessly inherit the dependency graph of the parent without manual intervention.
  3.  **Automated "Zombie" Maintenance:** Instead of hoping volunteers patch the zombie branch, the repo could incentivize security patches on old versions via bounties, acknowledging that multiple equilibria (versions) will coexist long-term.
  4.  **Data over Rules:** Shift from "You must follow SemVer" to "Here is the breakage rate of this dependency." Let consumers decide the risk, rather than enforcing a norm that maintainers might not be able to sustain.

  ### 4. Is the Practice Underdetermined?

  You asked if the practice is philosophically underdetermined or if it commits us to one view.

  It is **philosophically underdetermined**, but **rhetorically committed**.

  *   **Underdetermined:** The actual mechanics work under both theories. Whether you believe SemVer is a "moral promise" or a "survival trait," you still bump the major version when breaking things. The code runs either way.
  *   **Rhetorically Committed:** The community *speaks* Lewis. We use words like "contract," "promise," "guarantee," and "violation." We shame maintainers for breaking changes. This rhetoric creates an expectation of stability that the evolutionary reality cannot always support.

  **The "Bug" in Your Head:**
  The thing bugging you is the **cognitive dissonance** between the rhetoric (Lewisian Contract) and the reality (Evolutionary Selection).
  *   Maintainers claim they are making promises they can't keep (because requirements change, people leave, tech rots).
  *   Users expect guarantees that the system cannot structurally provide (because open source is voluntary).
  *   The Fork is the moment the mask slips. It reveals that there was no central authority, no real contract, only a temporary alignment of incentives.

  ### Summary for the Backend Engineer

  1.  **Norms:** SemVer is a Lewisian signal built on top of an Evolutionary substrate. It works as long as incentives align. When they don't, the Lewisian layer cracks, and the Evolutionary layer (forking) takes over.
  2.  **Crypto vs. Libs:** The difference isn't technical; it's political. Libs are treated as components (stability > sovereignty); Chains are treated as states (sovereignty > stability).
  3.  **Governance:** If we embraced the evolutionary view, we'd stop shaming breakage and start building tools to manage the inevitable fragmentation (better fork handling, automated migration paths).
  4.  **Underdetermination:** You can code without deciding this. But understanding that SemVer is a *coordination game* rather than a *law of physics* helps explain why it sometimes feels like everyone is playing by different rules.

  The "zombie branch" isn't a failure of the system; it's a feature of a distributed, authority-less ecosystem. It's the cost of doing business in a world without a king.
