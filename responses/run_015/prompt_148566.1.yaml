  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to dismiss Lewis too quickly. SemVer *requires* common knowledge to function as a signal. If I don't know you know what "minor" means, the signal fails. So Lewis is necessary for the *mechanism*, Evolution is necessary for the *persistence*.
      *   *Nuance on Forking:* Forking isn't just "exit." It's often a "voice" mechanism that failed. It's a schism.
