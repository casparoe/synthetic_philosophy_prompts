answer: |-
  Based strictly on the internal logic of David Lewis's *Convention: A Philosophical Study* (1969), we can construct a rigorous assessment of how he would analyze the normative structures of decentralized online platforms. Lewis's account relies on five specific conditions for a regularity $R$ to be considered a convention within a population $P$: (1) general conformity to $R$, (2) mutual expectation of conformity, (3) conditional preference for conformity (agents prefer to conform only if others do), (4) the existence of alternative regularities, and (5) **common knowledge** of conditions 1–4.

  Applying these criteria to federated networks like Mastodon or Bluesky yields a nuanced verdict: Lewis would likely argue that while *local* instance norms qualify as genuine conventions, *global* platform norms fail the test due to the erosion of common knowledge by algorithmic opacity and population fragmentation.

  ### 1. The Coordination Problem and Conditional Preference
  Lewis defines a convention as a solution to a recurrent coordination problem where agents have a common interest in coordinating but multiple equilibria exist (e.g., driving on the left vs. the right).

  In the context of the Fediverse, the recurrent situation $S$ is public discourse. The coordination problem is maintaining legible, safe, and sustainable interaction without a central authority.
  *   **Content Labeling (CW):** The use of Content Warnings for sensitive topics fits Lewis's model well. Users prefer to use CWs *on the condition* that others do, because if no one uses them, the signal loses its value (the "boy who cried wolf" scenario), and the coordination fails. If everyone uses them, the payoff (accessible discourse) is maximized.
  *   **Reply Etiquette:** Norms against "quote-tweeting" to mock (common in Mastodon) function similarly. An individual prefers to refrain from quote-tweeting only if they expect others to refrain; otherwise, they are disadvantaged in the discourse.

  Lewis would identify these as genuine attempts at convention because they satisfy the **conditional preference** criterion. Users do not follow these rules because of external coercion (initially), but because they expect the coordination to yield a better payoff than the alternative (chaos or hostility).

  ### 2. The Common Knowledge Bottleneck
  The critical friction point for Lewis would be condition (5): **Common Knowledge**. For a convention to hold, it is not enough that I know the rule; I must know that you know it, and know that you know that I know it.

  *   **Algorithmic Opacity:** Lewis's model requires transparency of the regularity. In algorithmic feeds (even custom feeds in Bluesky), the mechanism of visibility is often opaque. If a user posts with a specific tag expecting it to reach a community, but the algorithm suppresses it without signaling why, the regularity of "tag $X$ reaches community $Y$" is broken. Users cannot form stable mutual expectations if the mediation layer hides the consequences of actions. Lewis would argue that opaque ranking systems undermine the **common knowledge of the payoff structure**. If I do not know *why* a post succeeds, I cannot coordinate my behavior with yours based on shared rules.
  *   **Codification vs. Tacit Knowledge:** Lewis distinguishes conventions from explicit agreements. Much of the "normativity" in decentralized web spaces is codified in Instance Terms of Service or pinned posts. Lewis might argue that once a regularity is explicitly codified and enforced by admins, it shifts from a *convention* (tacit, self-enforcing) to a *social contract* or *local law*. While conventions can be reinforced by norms, heavy reliance on admin intervention suggests the self-enforcing equilibrium of a pure Lewisian convention has not been achieved.

  ### 3. Population Fragmentation ($P$)
  Lewis assumes a population $P$ among whom the convention holds. In a federated network, $P$ is ill-defined.
  *   **Instance Boundaries:** A regularity might hold within Instance $A$ (e.g., "no political bots") but not Instance $B$. Lewis would likely treat each instance as a distinct population with its own conventions.
  *   **The Global Failure:** There is no global "Fediverse" convention because there is no global common knowledge. A user on Instance $A$ cannot reasonably expect a user on Instance $B$ to conform to $A$'s etiquette. Therefore, Lewis would conclude that **global norms are not conventions**; they are merely overlapping local conventions that fail to scale. The "network effect" does not create a unified population $P$ sufficient for global common knowledge.

  ### 4. Turnover and Equilibrium Stability
  The prompt asks whether high turnover proves these are not true conventions. Lewis would likely reject the idea that turnover negates conventionhood *per se*, but would interpret it as evidence of **unstable equilibrium**.

  *   **Disrupted Equilibrium:** For Lewis, a convention is a proper equilibrium. If norms change rapidly (e.g., shifting from "no quote tweets" to "quote tweets are fine"), it suggests the conditional preferences are shifting faster than the expectations can stabilize.
  *   **Technological Mediation:** Lewis would argue that software updates act as exogenous shocks to the coordination problem. If a platform changes an interface (e.g., making "block" visible to the blocked user), it alters the payoff structure. Lewis would interpret high turnover not as proof that conventions are impossible, but as proof that **technological mediation prevents the recurrence of situation $S$**. If $S$ changes every six months due to software updates, a stable convention cannot form.
  *   **Verdict on Turnover:** He would not say "these are not conventions." He would say "these are **failed conventions**." They are attempts at coordination that never reach the stability required for common knowledge to crystallize because the environment is too volatile.

  ### 5. Defederation as Sanction vs. Convention
  Defederation (instances blocking other instances) presents a complex case.
  *   **Lewis on Sanctions:** Lewis notes that conventions are self-enforcing; you follow them because you want to coordinate, not because you will be punished. However, he acknowledges that sanctions can sustain expectations.
  *   **Analysis:** Defederation is a collective sanction. If Instance $A$ defederates Instance $B$ because $B$ violates a norm (e.g., allowing hate speech), this looks less like a convention and more like a **boundary enforcement mechanism**.
  *   **Lewis's View:** Lewis would likely classify defederation not as a convention among users, but as a **convention among administrators** regarding population management. For the end user, defederation removes the coordination problem entirely (you cannot interact with $B$), thereby dissolving the need for a convention between $A$ and $B$. It is a tool to preserve local conventions by excising the population that refuses to coordinate.

  ### Conclusion
  David Lewis would likely assess the normative structure of decentralized platforms as a **fragmented landscape of local conventions undermined by global opacity.**

  1.  **Local Validity:** Within specific instances (populations $P$), unwritten rules regarding reply etiquette and labeling constitute genuine Lewisian conventions, provided they are self-enforcing and based on mutual expectation.
  2.  **Algorithmic Undermining:** Opaque algorithmic curation violates the **common knowledge** condition. Users cannot coordinate on regularities they cannot observe or predict. Thus, algorithmic feeds transform potential conventions into games of guesswork, preventing stable equilibrium.
  3.  **Turnover:** Rapid norm turnover indicates that the **recurrent situation $S$** is not actually recurrent; technological changes alter the payoff structure too quickly for expectations to align.
  4.  **Final Verdict:** Lewis would argue that the "Fediverse" as a whole does not possess conventions. It possesses a patchwork of local equilibria that are constantly threatened by the lack of transparent common knowledge and the exogenous shocks of software mediation. The norms are "real" conventions only insofar as they are localized, transparent, and stable; where they are global, opaque, or volatile, they are merely **conventional attempts** that fail to satisfy the strict logical conditions of mutual knowledge and conditional preference.
