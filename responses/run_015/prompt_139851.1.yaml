      *   **User:** Novelist (2 published, 1 due spring, behind).
      *   **Task:** Run a 90-minute session at a small writers' festival.
      *   **Audience:** 12-15 adults, mostly fiction, some poets, no philosophers.
      *   **Goal:** Use the session to work out a problem in the user's own book (identical sisters, one swaps, no one notices, beta readers say it doesn't matter, user feels it does).
      *   **Philosophical Core:** Identity of Indiscernibles (IoI), Black's Two Spheres, haecceity vs. qualitative properties.
      *   **Constraints:**
          *   No lecture upfront.
          *   No jargon until the end (if at all).
          *   Must involve writing and reading aloud.
          *   Must include a "forced choice" with stakes (one text read, one destroyed, etc.).
          *   Must include an attempt to produce a difference that collapses under swap.
          *   Needs a timeline, materials list, scripts for reading.
          *   Debrief must map exercise to philosophical argument (including the "nothing else in the universe" constraint).
          *   Must address limitations (what the exercise *can't* do).
          *   Must predict failure modes (pedants, refusers, puzzle-solvers).
          *   **Crucial:** Do not tell the user how to fix the book. Tell them what the room's reaction reveals about the viability of their intuition.

  2.  **Deconstruct the Philosophical Problem for Writers:**
      *   *The Problem:* If $A$ and $B$ share all properties, are they identical? (Leibniz says yes). Black says no (two iron spheres in an empty universe).
      *   *The Writer's Stake:* Narrative depends on *this* character doing *this* thing. If Character A and Character B are truly interchangeable, does the plot lose tension? Or does the *fact* of their distinctness (haecceity) create tension even without qualitative difference?
      *   *The "Gap":* Epistemic (we can't tell) vs. Ontological (there is no difference). The exercise needs to bridge the feeling of "I can't tell" to "There might be nothing to tell."

  3.  **Drafting the Session Structure (90 Minutes):**
      *   *Intro (5 min):* Set the scene, no theory.
      *   *Exercise 1: The Swap (20 min):* Establishing indistinguishability. Writing identical descriptions.
      *   *Exercise 2: The Forced Choice (20 min):* The stakes. Choosing one over the other without a reason.
      *   *Exercise 3: The Difference Engine (20 min):* Trying to invent a difference and failing (relational/collapsing).
      *   *Debrief/Theory (20 min):* Mapping the experience to the philosophy and the book problem.
      *   *Buffer/Closing (5 min):* Q&A/Wrap.

      *Refining the Timeline:* 90 minutes is tight. Need to be strict.
      *   0-5: Intro.
      *   5-25: Writing Pair 1 (Indistinguishability).
      *   25-45: The Bet (Forced Choice).
      *   45-65: The Difference Engine (Trying to break the symmetry).
      *   65-85: Debrief & Theory.
      *   85-90: Close.

  4.  **Developing the Exercises:**

      *   *Exercise 1 (Indistinguishability):* Needs to be concrete. Not "describe a person." Describe an object. Why? Because people have internal lives (which creates difference). Objects are safer for the "Two Spheres" analogy. Let's use keys or coins. No, let's use *sentences*. Write two sentences that mean the exact same thing but look different? No, that's syntax.
      *   *Better:* Write two descriptions of an object so precise that if you swapped the objects, the description still fits.
      *   *Best:* The "Twin Object" prompt. Participants pair up. They describe a generic object (e.g., a red ball) so perfectly that the description fits any red ball of that type. Then they swap papers.
      *   *Wait, the constraint says:* "Moment where they try to produce a difference themselves and discover that everything they come up with is either relational or collapses under a swap."
      *   *Revised Exercise 1:* "The Perfect Copy." Write a paragraph describing an object. Then write a second paragraph describing a *second* object that is identical in every way.
      *   *Revised Exercise 2 (The Bet):* Collect the pairs. Shuffle. Pick one pair. Ask the group: "If I burn Page 1 and keep Page 2, is anything lost?" Then make them vote. Then actually destroy one (symbolically or literally).
      *   *Revised Exercise 3 (The Difference Engine):* Ask them to write *one sentence* that makes Object A distinct from Object B. Then test it by swapping A and B. Does the sentence still hold?

      *Let's sharpen the "Forced Choice":* It needs stakes. "One text gets read out and one gets torn up."
      *   *Scenario:* Participants write two short micro-fiction pieces about "The Woman." They must be identical in content. Then they must choose which one represents "The Survivor."

      *Actually, let's look at the "Two Spheres" constraint:* "why it's supposed to matter that in the sphere version there's nothing else in the universe."
      *   *Adaptation:* The writing prompt needs to isolate the subjects. No background. Just the two things.

      *Final Plan for Exercises:*
      1.  **The Mirror Write:** Write two descriptions of "The Sister." No background context. Just her. Must be identical.
      2.  **The Verdict:** I (the facilitator) hold two envelopes containing identical texts. I ask the room to choose which envelope contains the "Real" sister for the ending. One envelope gets shredded.
      3.  **The Anchor:** Try to write a sentence that anchors one sister to the page without referencing the other or the outside world.

  5.  **Drafting the Scripts:**
      *   Need to sound like a writer talking to writers, not a professor.
      *   Avoid "ontology." Use "story truth" vs. "fact truth."
      *   The " Forced Choice" script needs to be firm. "I need a show of hands. Left or Right? You have to pick."

  6.  **Addressing the Limitations (The "Gap"):**
      *   The room can only demonstrate *epistemic* indistinguishability (we can't tell).
      *   Philosophy argues *ontological* indistinguishability (there is no fact of the matter).
      *   I need to tell the user: The exercise proves the *reader* can't tell. It doesn't prove the *author* can't know. But if the reader can't tell, does the author's knowledge matter? That's the crux for the novelist.

  7.  **Predicting Failure Modes:**
      *   *The Scientist:* "But atoms are arranged differently!" -> Counter: "In this story universe, they aren't. Play the game."
      *   *The Poet:* "The *sound* of the words is different." -> Counter: "We are talking about the *referent*, not the signifier." (Save this for debrief).
      *   *The Puzzle Solver:* "There's a trick." -> Counter: "The trick is that there is no trick."

  8.  **Refining the Debrief:**
      *   Connect the "Shredding" to the Beta Reader complaint (if they are the same, losing one doesn't matter).
      *   Connect the "Failed Anchor" to Black's Spheres (spatial position is relational, not intrinsic).
      *   Connect the "Empty Universe" constraint: If there's background noise, you can use that to tell them apart (left of the tree). If there's *nothing*, you can't.
      *   **The Verdict for the User:** If the room feels the loss of the shredded paper despite knowing it's identical, the user's intuition holds (Haecceity has narrative weight). If the room shrugs, the Beta Readers are right (Qualitative supervenience).

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   No jargon upfront? Yes.
      *   Forced choice with stakes? Yes (shredding text).
      *   Attempt to produce difference? Yes (The Anchor exercise).
      *   Materials list? Yes.
      *   Scripts? Yes.
      *   Limitations addressed? Yes.
      *   No fixing the book? Yes.

  10. **Final Polish:**
      *   Tone check: Empathetic to the writer's block/anxiety.
      *   Ensure the "Empty Universe" point is clear in the debrief.
      *   Make sure the "Forced Choice" feels uncomfortable. That discomfort is the data.

