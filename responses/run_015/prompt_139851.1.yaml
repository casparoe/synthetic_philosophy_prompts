  *Correction on Stakes:* Shredding a participant's work might be too aggressive for a festival. I should shred *my* copies of their work, or use a generic text. Let's use a generic text I provide, but they vote on it. No, the prompt says "one text gets read out and one gets torn up." I'll have *me* bring two identical prints. They vote on which I keep. That protects their ego but keeps the stake.
