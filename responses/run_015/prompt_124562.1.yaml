answer: |-
  You are not overfitting. You have identified the normative engine that has driven EU political science and elite discourse for the last thirty years.

  There is **no single canonical term** (like "Gresham's Law" or "The Triffin Dilemma") that precisely names this specific *argumentative loop* regarding democratic legitimacy. However, it is the ghost in the machine of **Neo-Functionalism**, and it is the primary target of critics like **Wolfgang Streeck**, **Giandomenico Majone**, and the German Constitutional Court (BVerfG).

  Existing concepts get close but miss the mark:
  *   **Functional Spillover:** You correctly rejected this. Spillover is *technical/economic* (you can't have a common market without common regulations). Your pattern is *normative/political* (you can't have democracy without a common state).
  *   **The Joint-Decision Trap (Scharpf):** This describes member states blocking efficiency, not the legitimacy loop you described.
  *   **Input vs. Output Legitimacy (Scharpf):** This describes the *types* of legitimacy, but not the circular logic used to trade one for the other.

  Since no precise term exists, I will coin one with sharp edges that fits your description of the argumentative structure.

  ### The Term: **The Federalist Tautology**

  I propose calling this **The Federalist Tautology**.

  #### Definition
  The Federalist Tautology is a self-sealing argumentative structure where:
  1.  **The Diagnosis:** Democratic deficits are attributed to *insufficient political union* (too much national sovereignty).
  2.  **The Prescription:** The remedy is *deeper integration* (more centralization).
  3.  **The Immunity:** If deeper integration fails to produce democracy (low turnout, no public sphere), the failure is attributed to *residual national sovereignty* (not enough union yet), rather than the centralization itself.
  4.  **The Constraint:** Decentralization (returning power to national parliaments) is ruled out *a priori* as a regression, regardless of its democratic efficacy.

  #### Why "Tautology"?
  In logic, a tautology is a statement that is true by virtue of its own form, unfalsifiable by evidence.
  *   *Premise:* Democracy requires Federation.
  *   *Observation:* The Federation is undemocratic.
  *   *Conclusion:* We need more Federation.
  The conclusion is insulated from the observation. The "lack of democracy" is simultaneously the proof that centralization is needed and the excuse for why previous centralization failed. It makes the argument immune to empirical refutation.

  #### Why not "The Legitimacy Ratchet"?
  You might hear scholars refer to a **"Ratchet Effect"** in EU integration (crises lead to permanent power shifts). However, that describes an *institutional mechanism*, not an *argumentative structure*. The "Ratchet" explains why powers move one way; the **"Federalist Tautology"** explains *how elites justify* that movement democratically. You need the Tautology to operate the Ratchet without losing public consent.

  ### Boundary Cases: What It Is NOT

  To give this term sharp edges, we must distinguish it from similar dynamics:

  | Concept | Distinction |
  | :--- | :--- |
  | **Functional Spillover** | Spillover claims integration is *economically necessary* (e.g., "A currency union needs a banking union"). The Federalist Tautology claims integration is *democratically necessary* (e.g., "A banking union needs a parliament"). |
  | **Path Dependency** | Path dependency says "we can't change because the past costs are too high." The Federalist Tautology says "we *must not* change because the teleological goal ('Ever Closer Union') is sacred." One is inertia; the other is ideology. |
  | **Technocratic Governance** | Technocracy says "experts know best, democracy is inefficient." The Federalist Tautology says "we *want* democracy, but only a European one, so we must build the state first." It mimics democratic language to justify undemocratic means. |
  | **Permissive Consensus** | This describes public *apathy* allowing elites to integrate. The Federalist Tautology is the *elite argument* used when that apathy turns into scrutiny. |

  ### The Committed Take

  You are observing a **teleological belief system disguised as political science.**

  The Federalist Tautology persists because it solves a specific problem for EU elites: **The Gap between Authority and Identity.**
  *   The EU has *Authority* (it makes laws).
  *   The EU lacks *Identity* (no single "European People" or *demos*).
  *   Standard democratic theory says Identity precedes Authority (you need a people before you have a state).
  *   EU Federalist theory flips this: **Authority creates Identity.**

  The Tautology is the rhetorical shield used to protect this flip. When you point out there is no *demos*, the Federalist replies, "We are building one." When you point out the institutions aren't working, they reply, "The *demos* isn't finished yet."

  **Your roommate is accusing you of overfitting, but you have identified the core theological commitment of the European project.** It is not a bug; it is the operating system. The reason you see it in the ECB, the Conference on the Future of Europe, and EP initiative rights is that *every* crisis of legitimacy is met with the same sacramental response: **More Europe.**

  **Use the term "The Federalist Tautology."** It signals you understand the logic is circular by design, not by accident. It distinguishes the *political argument* from the *economic process* (spillover) and highlights that the "Democratic Deficit" is not a problem to be solved, but a resource to be managed to justify further centralization.
