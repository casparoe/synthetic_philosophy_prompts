answer: |-
  **Setup & Materials**
  Index cards (3 per student), pens, whiteboard. Divide class: 6 Founders, 12 Citizens.

  **Rules & Payoff**
  **Task:** Write valid arguments for 'Universal Basic Income'. 1 point per argument.
  **Phase 1 (Self-Bind):** All students write one personal constraint on a card (e.g., 'No slang'). Set a penalty (1–5 points) for breaking it. Keep card.
  **Phase 2 (Cross-Bind):** Founders leave. They write 3 rules for Citizens. They must specify: (a) Penalty for breach, (b) Cost to Amend (0–10 points), (c) Duration (Permanent or 10 mins). Founders' score = 50% of Citizens' total. Founders leave permanently; their score is locked once Citizens begin.
  **Phase 3 (Execution):** Citizens work for 25 minutes. They must obey their Phase 1 card + Founders' cards. To break or change a rule, pay the set cost from your score.

  **Timeline (75 mins)**
  **0–5:** Framing: 'Today we test how constraints affect output.'
  **5–20:** Phase 1. Students draft self-constraints.
  **20–35:** Phase 2. Founders draft Citizen rules. Founders exit.
  **35–60:** Phase 3. Citizens work. Monitor rule-breaking costs.
  **60–75:** Debrief.

  **Debrief Mapping**
  (i) **Same-agent:** Ask Citizens about Phase 1 constraints. 'Did you resent your own rule?' Highlights autonomy-respecting binding; you authored the pain.
  (ii) **Cross-cohort:** Ask Citizens about Founders' rules. 'Did the amendment cost feel fair?' Highlights the asymmetry; they bear the cost, you bear the rule.
  (iii) **Indistinguishability:** 'When you felt frustration at minute 45, could you tell if the rule was yours or theirs?' The phenomenology of constraint is identical; only the genealogy differs.
  **The Repair:** Ask Founders: 'Why did you choose Permanent vs. 10 mins?' Ask Citizens: 'Which rules felt legitimate?' They should identify that rules requiring renewal felt less oppressive, inventing the sunset clause concept.

  **What Will Go Wrong**
  Founders may set punitive amendment costs (e.g., 10 points) to secure their score, causing Citizens to refuse the task.
  *Fix:* Intervene quietly: 'Remember, if they stop working, your score is zero.' This forces Founders to balance control with motivation, mirroring the need for legitimacy.
  **Limitation**
  The game cannot simulate the *passage of generations*. You must state aloud: 'In reality, the Founders are dead. Here, they are just outside the door. That emotional distance is harder to mimic.'
