  Consider two art dealers, Elena and Marcus, who finalize the sale of a rare canvas while riding separate high-speed trains departing from the same station in opposite directions. As Elena signs the certificate of authenticity in her carriage, Marcus is miles away, moving rapidly away from her. Because of their relative motion, the moment Elena's pen lifts from the paper falls into what Marcus's motion defines as his future, while for Elena, the signature is firmly fixed in her present. The canvas sits between them in a secure vault, physically unchanged, yet its status as "sold" depends on whose moving "now" you trust. Elena treats the transaction as completed fact, while Marcus's trajectory suggests the signing event has not yet entered the realm of what is real for him.

  For the presentist, reality is limited strictly to the present moment; thus, if motion shifts what counts as "now," Elena and Marcus literally inhabit different realities where the signed certificate either exists or does not. The eternalist, conversely, holds that past, present, and future events are equally real, so both observers are correct simply because they are located at different positions in time relative to the signing event, which exists permanently as a fixed point in history. The exact feature forcing this divergence is the dependence of the "present" boundary on the observer's state of motion rather than a universal clock. A presentist could attack this setup by arguing that referring to the canvas as a single, stable object discussed by both parties smuggles in an eternalist assumption that the object persists through time independently of the present moment, rather than being re-created anew in each instant. Finally, stripping away the relative-motion element collapses the philosophical tension entirely; without motion defining different "nows," the disagreement reduces merely to a matter of subjective psychology or incomplete knowledge about when the signing occurred, rather than a fundamental dispute about what actually exists.
