answer: |-
  ### 1. Exam Question

  **Course:** PHIL 405 – Contemporary Ethics & Future Generations  
  **Time Allowed:** 45 Minutes  
  **Word Limit:** Approximately 600 words  

  **Question:**  
  Samuel Scheffler's "Afterlife Conjecture" suggests that a significant portion of what we value in our present lives depends on the belief that humanity will continue to exist after we die. It's not just about our own deaths; it's about the end of the collective project.

  Consider this scenario: Biological humanity fades away due to infertility or evolutionary obsolescence, but before the last human dies, we create artificial minds. These successors are not biologically human, share no evolutionary history with us, and possess no flesh, yet they perfectly preserve and continue all human culture, science, and moral projects.

  Using Scheffler's framework, argue whether this scenario satisfies the condition of a "collective afterlife" necessary for our current activities to retain their value. Does the "humanity" in Scheffler's conjecture require biological continuity, or is the preservation of our normative projects enough? Explain why the distinction matters for the value of our present lives.

  ***

  ### 2. Model Answer

  Scheffler's Afterlife Conjecture posits that we care about the future not merely out of altruism for specific descendants, but because the existence of future people is a precondition for the value of many current activities. If we knew humanity would end immediately after our deaths, Scheffler argues, we would lose confidence in the worth of our efforts, from scientific research to artistic creation. The question here is whether "humanity" in this conjecture refers to a biological species or a carrier of cultural value.

  If we interpret Scheffler strictly biologically, the AI successor scenario fails. The conjecture relies on the survival of "humanity." If the successors are silicon-based minds with no genetic link to *Homo sapiens*, then humanity has gone extinct. Under this reading, the collective afterlife is broken. The people who come after are not "us" in any relevant sense. Consequently, our current projects would lose their value because there is no one "like us" to inherit them. The continuity of the species is the anchor for our confidence. If the chain of biological life breaks, the mirror in which we see our future shatters, and our present endeavors become futile exercises in a vacuum.

  However, a more charitable reading of Scheffler focuses on the *objects* of our concern rather than the biology of the successors. We value the future because we value the continuation of human practices, knowledge, and morality. In the AI scenario, these practices continue. The AI minds solve the equations we started, appreciate the art we made, and uphold the justice systems we built. If the value of my work lies in its contribution to an ongoing tradition, and that tradition continues uninterrupted, then the biological substrate might be irrelevant. The "afterlife" Scheffler describes is essentially a social and normative one. As long as there are minds capable of recognizing the value of what we did and building upon it, the condition is met. The successors don't need to be our children; they need to be our heirs.

  Yet, there is a middle ground that complicates this. Scheffler suggests we value future humans partly because they are like us—vulnerable, mortal, and capable of flourishing. If the AI successors are immortal or lack biological needs, the connection weakens. We might feel that our struggles were specific to the human condition. If the successors cannot understand suffering or mortality, can they truly value our moral progress? If they are fundamentally different in experience, the continuity is superficial.

  Ultimately, the AI scenario likely satisfies the conjecture only if we prioritize cultural continuity over biological essentialism. If the value of our lives is tied to the persistence of the *human species*, the scenario fails. But if the value is tied to the persistence of *meaning*—which can be housed in non-biological minds—then the collective afterlife remains intact. For the purpose of validating our current lives, the latter is more robust. It suggests that what matters is not the blood in our veins, but the ideas we leave behind and the minds capable of holding them. Therefore, even without biological continuity, the preservation of our normative world by artificial successors supplies the necessary afterlife to sustain the value of our present actions.

  ***

  ### 3. Marking Scheme

  | Criterion | Marks (out of 20) | What an A answer does | Typical mistake that costs marks |
  | :--- | :---: | :--- | :--- |
  | **Understanding of Scheffler** | 5 | Clearly explains the Afterlife Conjecture without needing direct quotes; focuses on the dependency of present value on future existence. | Merely summarizes the theory without linking it to the "value of present activities" core claim. |
  | **Application to AI Scenario** | 5 | Directly engages with the biological vs. artificial successor twist; doesn't treat it as a generic extinction question. | Ignores the AI aspect and writes a generic essay about human extinction or climate change. |
  | **Argumentative Coherence** | 5 | Takes a clear stance (biological vs. cultural continuity) and defends it consistently throughout the response. | Hedges too much or contradicts itself halfway through without resolution. |
  | **Clarity & Structure** | 5 | Logical flow (Intro -> Theory -> Application -> Nuance -> Conclusion); stays within word limit constraints. | Rambles, lacks paragraphs, or significantly under/overwrites the target length. |
  | **Total** | **20** | | |

