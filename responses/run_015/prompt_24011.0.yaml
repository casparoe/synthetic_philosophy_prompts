      *   However, the explanation of the Undermining Problem is fundamentally wrong (confuses it with self-fulfilling/defeating prophecies or epistemic reliability).
      *   The explanation of the New Principle is technically incorrect (wrong formula/logic).
      *   In a grad seminar, misunderstanding the *mechanism* of the Undermining Future (it's about the future history determining the laws, not the agent's belief) is a major conceptual failure.
