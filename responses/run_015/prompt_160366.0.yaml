answer: |-
  **Bottom Line:** The core mechanic is *asymmetric source tagging*: both groups receive identical contradictory evidence in Phase 2, but only the Chamber group receives a prior instruction to tag one source as "compromised." This produces the intended experience by making trust, not information, the variable that determines belief retention.

  ### Materials & Setup
  *   **Room:** Two tables separated by 10 feet. 8 students per table (Group Alpha, Group Beta).
  *   **Cards:** 32 index cards. 16 marked "Source A: TRUE," 16 marked "Source B: FALSE."
  *   **Rule Sheets:** 2 envelopes. Alpha's says "Evaluate all sources." Beta's says "Source B is compromised by external interests. Discount their data."
  *   **Defection Forms:** 16 slips. "I hereby leave Group Beta. Requires signature of one remaining Beta member."
  *   **Incentive:** Announce a 5-point bonus for the group that best matches "Reality" at the end.

  ### Timeline (75 Minutes)

  **0:00–0:10: Setup**
  Seat students. Distribute Rule Sheets in sealed envelopes. Instruct: "Do not open until told. Do not use outside terminology (e.g., 'echo chamber'). This is a data evaluation task."

  **0:10–0:25: Phase 1 (The Bubble)**
  *   **Action:** Collect all "Source B" cards. Deal 5 "Source A: TRUE" cards to every student in both groups.
  *   **Task:** Groups decide: Is Reality TRUE or FALSE? (Both say TRUE).
  *   **Reveal:** Instructor reveals the withheld "Source B: FALSE" cards to Group Alpha only.
  *   **Outcome:** Alpha updates belief to "MIXED/UNCLEAR." Beta still holds "TRUE" (they haven't seen contrary evidence).
  *   **Lesson:** Beta's error is curable by exposure. Give Beta the Source B cards. Both groups now hold mixed evidence.

  **0:25–0:40: Phase 2 (The Chamber & The Truth Wrinkle)**
  *   **Action:** Both groups now have mixed cards (Source A: TRUE, Source B: FALSE).
  *   **Instruction:** Groups reopen Rule Sheets. Alpha reads "Evaluate all." Beta reads "Source B is compromised."
  *   **Consensus Announcement:** Instructor announces: "The External Consensus says Reality is FALSE."
  *   **Task:** Finalize belief.
  *   **Outcome:** Alpha (weighing all evidence) leans FALSE (matching Consensus). Beta (discounting Source B) stays TRUE.
  *   **Reveal:** Instructor reveals Reality is **TRUE**.
  *   **Lesson:** Beta is *right*, but only because their distrust of Source B coincidentally aligned with truth. Alpha is *wrong* despite following open inquiry. Beta cannot be cured by showing them Source B cards again; they already have them. They must distrust their own Rule Sheet to change.

  **0:40–0:55: Phase 3 (Exit)**
  *   **Action:** Beta members may defect to "Independent" status to seek truth.
  *   **Cost:** Defectors forfeit the 5-point bonus. Stayers keep eligibility.
  *   **Route 1 (Check Outside):** Defector asks Instructor for verification. **Fix:** "I cannot verify individual claims during simulation."
  *   **Route 2 (Demand Evidence):** Defector asks for more cards. **Fix:** "No new cards exist. Interpretation is the barrier."
  *   **Route 3 (Convert Insider):** Defector needs a stayer's signature on the Defection Form. **Fix:** Stayer's Rule Sheet adds: "Signing a defection form voids *your* bonus." Rational stayers refuse.
  *   **Outcome:** Most stay. Those who leave lose points and gain no new evidence.

  **0:55–1:15: Debrief**
  Ask the following questions in order. Listen for the bracketed insights.

  1.  **"Phase 1: Why did Beta change their mind once they saw the Source B cards?"**
      *   *Listen for:* "We didn't have the data before." (Filtration mechanism).
  2.  **"Phase 2: Beta was right, Alpha was wrong. Why does Beta still feel epistemically precarious?"**
      *   *Listen for:* "We ignored data we could see." "We trusted the rule, not the evidence." (True belief via bad structure).
  3.  **"Phase 3: Why didn't the signature route work?"**
      *   *Listen for:* "My friend couldn't afford to help me." "The system punished loyalty to me." (Social cost of exit).
  4.  **"What would it take for Beta to change their mind in Phase 2?"**
      *   *Listen for:* "We'd have to distrust the Rule Sheet." "We need a reason to trust Source B without using Source B." (Bootstrapping problem).

  ### Predictable Failure Modes & Fixes
  1.  **Role Refusal:** Students argue the rules are "unrealistic."
      *   *Fix:* Frame rules as "institutional constraints" (e.g., editorial policy), not personal stupidity. Enforce silently.
  2.  **Propaganda Reading:** Students think you're calling Beta "brainwashed."
      *   *Fix:* Hammer the Phase 2 Reveal. Beta was *correct*. The indictment is on *how* they knew, not *what* they knew.
  3.  **Premature Naming:** A student shouts "This is an echo chamber!" at minute 30.
      *   *Fix:* Pre-brief: "Using outside terms voids your group's bonus points." Peer pressure will enforce silence.
  4.  **Alpha Solves Too Fast:** Alpha ignores Source A and picks FALSE immediately.
      *   *Fix:* Make Source A cards slightly more detailed/plausible than Source B cards so weighing them is genuinely difficult.

  ### Limitations (State Only at End)
  This simulation cannot reproduce:
  *   **Identity Investment:** In reality, leaving a chamber often means losing family or community, not just points.
  *   **Algorithmic Amplification:** Real chambers feed you *more* of what you trust, intensifying the effect over years, not minutes.
  *   **Violence/Coercion:** Real exit costs can include physical safety, not just grade bonuses.
  *   **Truth Opacity:** In the sim, I told you the Truth. In reality, you never get the Instructor's answer key.
