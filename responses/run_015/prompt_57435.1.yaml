answer: |-
  The conclusion that descendants are *guilty* does not survive, but the claim that they *owe* restitution remains valid if grounded in political liability rather than moral culpability.

  **Correspondence Table**

  | Family Analogy | Political Reality |
  | :--- | :--- |
  | **The Estate** | National wealth/infrastructure built via colonial extraction. |
  | **The Ancestors** | Colonial-era state actors and beneficiaries. |
  | **The Heirs** | Current citizenry (taxpayers/voters). |
  | **The Creditors** | Former colonies and victims of exploitation. |
  | **Act of Accepting** | Continued residence, citizenship, and use of state services. |

  **Where the Mapping Breaks**

  1.  **Renunciation/Exit:** An heir can legally refuse an inheritance to avoid attached debts; a citizen cannot easily renounce citizenship to avoid political liability. Exit requires emigration, often costly or impossible without risking statelessness, whereas refusing an inheritance is a bureaucratic formality.
  2.  **Continuity of Identity:** Family continuity is biological and affective; national continuity is legal and institutional. Citizens are not necessarily biological descendants of the perpetrators (due to migration), whereas heirs are defined by lineage.
  3.  **Nature of Obligation:** Family inheritance implies a private transfer of wealth; political restitution involves public funds and sovereign responsibility, which persists regardless of regime changes or population shifts.

  **Disanalogies: Killing vs. Inelegant**

  *   **Killing Disanalogies:**
      *   **Moral Guilt Transfer:** The family analogy relies on bloodlines to transmit shame, which contradicts the liberal principle that moral agency is individual. This kills the MEP's claim that *guilt* travels down generations; you cannot inherit sin, only liabilities.
      *   **Biological Continuity:** Because citizenship is not strictly genealogical, the analogy fails to account for citizens who arrived post-colonialism. If liability rests on "family" ties, recent immigrants are exempt; if it rests on citizenship, the family analogy is the wrong map.
  *   **Inelegant Disanalogies:**
      *   **Coercive Acceptance:** The difficulty of renouncing citizenship makes the "acceptance" of the estate non-voluntary compared to inheritance. This is inelegant because it weakens the consent-based argument for liability, but it does not negate the obligation if the benefit is retained regardless of consent.

  **Verdict on Guilt vs. Owe**

  The conclusion that descendants are *guilty* collapses; moral guilt dies with the perpetrator, as Jaspers argued. However, the conclusion that they *owe* survives if reframed as **political liability**. Current citizens inherit the state as a legal corporation that holds assets (land, wealth) acquired unjustly; justice requires the corporation to settle debts regardless of the personal morality of its current shareholders.

  **Better Analogy: Corporate Succession**

  A better model is **Corporate Merger or Succession**: when Company A absorbs Company B, it inherits B's assets and liabilities regardless of whether the current employees worked there during the misconduct.

  *   **Cost:** This depersonalizes the relationship, reducing restitution to a balance-sheet transaction that may lack the moral resonance required to motivate public sacrifice, and it risks treating victims as creditors in a bankruptcy proceeding rather than wronged parties deserving recognition.
