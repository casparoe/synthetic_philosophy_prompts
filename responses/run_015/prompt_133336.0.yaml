      *   *Option 2: Weaken (5).* This is the most promising. Deny that safety is *introspectively* recognizable. Safety is external. I can't see nearby worlds. I can only infer safety based on internal cues, which brings us back to MFE problems. Weakening (5) saves (1), (3), and (4). It makes the view a standard Externalist Safety View (like Pritchard or Williamson).
      *   *Option 3: Accept KK-like consequences.* Drop (3). This makes the view a form of Internalist Infallibilism or Strong Externalism. But it contradicts the user's explicit desire to reject KK.
