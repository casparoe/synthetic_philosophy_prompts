  I'm preparing a brief for a discussion on AI governance, and I've noticed that participants keep falling back on the same comparison to make process-based versus outcome-based supervision concrete: they say supervising a capable AI system is essentially like administering a driving examination, where process-based evaluation corresponds to checking that the candidate signals correctly, observes speed limits, and executes proper lane changes, while outcome-based evaluation corresponds only to verifying that the vehicle arrived at the destination safely and within the allotted time. The analogy is then used to license conclusions about which mode of oversight should dominate—some argue that, just as we ultimately care about reaching the destination, we should weight outcomes far more heavily for AI, while others counter that, just as a driver who reaches the destination by running red lights is still unfit, internal procedural compliance must be verified independently. I'd like you to audit this analogy systematically: lay out the correspondence table—what plays the role of the examiner, the road rules, the observable behavior, the arrival state, and the hidden intermediate steps—then identify the disanalogies that matter specifically for AI supervision, particularly where process-checking requires mechanistic interpretability of latent representations rather than observation of external actions, and where outcome-checking in open-ended domains permits specification gaming or environment manipulation that has no analog in a bounded driving route. Separate the breaks that merely weaken the picture from those that undermine the conclusions it is used to support, and say whether either the "outcome-first" or the "process-first" position survives once the mapping is fully explicit, or whether the analogy was carrying the argumentative weight all along. If there is a better analogy for the relationship between procedural and result-oriented oversight in autonomous system