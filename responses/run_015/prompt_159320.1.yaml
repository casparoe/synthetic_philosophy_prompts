answer: |-
  Here is a complete design for **The Friction Protocol**. It is built to fit your 80-minute window, your $15 budget, and your specific philosophical constraints.

  ### The Core Concept
  You are simulating a "model" (Group A) that learns purely from symbolic logs of past successful interactions, versus an "agent" (Group B) that interacts with the physical environment directly.

  The "Friction" is literal: the difference between reading a report that a box is "rough" and feeling the box tear your fingerprint. The "More Data" objection is addressed by giving Group A the *exact* logs of Group B's success, proving that symbolic transcriptions of grounded acts do not confer the ability to perform grounded acts.

  ### Materials & Budget ($15)
  1.  **The "World" (20 units):** Fold 20 identical paper boxes (origami cubes or just folded envelopes). Cost: $0.
  2.  **The "Friction" (Texture):** Buy 1 sheet of fine-grit sandpaper ($3) and 1 sheet of felt or velvet fabric ($4). Cut into 20 squares. Glue inside the boxes.
      *   10 boxes: Smooth paper interior (The "Null" class).
      *   5 boxes: Sandpaper interior (The "Target" class).
      *   5 boxes: Felt interior (The "Distractor" class).
      *   *Crucial:* Externally, all boxes must look identical. Mark them with numbers 1–20 on the bottom.
  3.  **The Symbol System:** Print 16 copies of a "Glyph Sheet." Cost: $2.
      *   Create 3 made-up glyphs: `⌖` (Vorn), `⌬` (Krax), `⌭` (Blep).
      *   Define them *initially* by color/shape (e.g., `⌖` = Red Square). You will change the definition later without telling them.
  4.  **The Stakes:** A bag of generic candy ($5) and one "Golden Token" (spray paint a large washer or wooden block gold, $1).
  5.  **Barriers:** Use backpacks or laptop screens to ensure Group A cannot see Group B's table.

  ### Room Setup
  *   **Table 1 (The World):** Holds the 20 boxes.
  *   **Zone A (Syntax Group):** 8 people. Sit *away* from Table 1. They get the Glyph Sheets and notepads. They are **not allowed to touch the boxes**.
  *   **Zone B (Friction Group):** 8 people. Sit *at* Table 1. They get the Glyph Sheets. They **must touch the boxes** to solve tasks.
  *   **You (The Oracle):** Stand between them. You validate answers. You distribute "Training Logs."

  ### The Timeline (80 Minutes)

  #### 0:00 – 0:10: Setup & Split
  *   Split the room randomly (or mix Phil/CS evenly) into Zone A (8) and Zone B (8).
  *   **Rule:** "You are two teams optimizing a selection protocol. You will communicate using this Glyph Sheet. Zone A optimizes the *description*. Zone B optimizes the *selection*. Do not talk to the other zone. Do not look at their materials."
  *   Hand out Glyph Sheets.
  *   **Initial Definition:** `⌖` = "The box with the Blue Dot." `⌬` = "The box with the Red Dot." `⌭` = "The box with the Green Dot."
  *   *(Secretly, all boxes have no dots. This is a lie to establish syntactic fluency without semantic reference yet.)*
  *   **Task 1:** "Select all `⌖` boxes."
  *   **Trick:** You (The Oracle) simply tell them which numbers correspond to `⌖` based on a pre-printed key. Both groups "succeed" by writing down the numbers you validate.
  *   **Goal:** Establish that both groups are equally "fluent" in the symbol system. They feel smart. They trust the symbols.

  #### 0:10 – 0:30: The Training Phase (Illusion of Competence)
  *   **Task 2:** "We are expanding the corpus. Here is a list of past successful selections." (Hand Zone A a 5-page printout of logs: *"User requested ⌖. Agent selected Box 4. Reward: +1."*)
  *   **Task 3:** "New Query: Select the `⌬` boxes."
  *   **Reality:** You change the definition. `⌬` now means "The box that feels Smooth."
  *   **Zone B:** Opens boxes, feels inside. Identifies the smooth ones. Succeeds easily.
  *   **Zone A:** Reads the logs. The logs say *"Box 4 is ⌬."* They look for patterns in the logs. (e.g., "Box 4, 7, 9 were ⌬ in the logs. Maybe it's even numbers?"). They submit a guess based on statistical regularity in the text.
  *   **Outcome:** Zone B gets 100%. Zone A gets ~40% (chance + pattern matching).
  *   **Oracle Feedback:** To Zone A, simply mark answers "Incorrect." Do not explain why. To Zone B, let them feel the correction (they pick a rough one, feel it, put it back).

  #### 0:30 – 0:50: The Friction Test (The Core Mechanism)
  *   **Announcement:** "Final Round. High Stakes. The Golden Token goes to the team with higher accuracy."
  *   **Task:** "Select the `⌭` boxes."
  *   **Reality:** `⌭` means "The box that resists." (The Sandpaper boxes).
  *   **Zone B:** Reaches in. The sandpaper grabs their finger. It provides *friction*. They know immediately.
  *   **Zone A:** Receives a "Data Dump." This is the critical move. Give them the *exact* logs of Zone B's successful training from the previous round.
      *   *Log Entry:* "Request: ⌭. Selection: Box 3. Feedback: Positive."
      *   *Log Entry:* "Request: ⌭. Selection: Box 8. Feedback: Positive."
  *   **The Trap:** Zone A has *more data* than before. They have the *successful history* of the grounded agents. But the data is purely symbolic. It contains no information about tactile resistance.
  *   **Action:** Zone A will try to find a syntactic pattern in the box numbers or the log structure. Zone B will simply feel the boxes.
  *   **Result:** Zone B clears the table in 2 minutes. Zone A argues about the distribution of numbers in the logs for 15 minutes and fails.

  #### 0:50 – 1:00: The "More Data" Intervention
  *   Zone A will complain: "We need more logs. The pattern isn't clear."
  *   **Action:** Give Zone A *double* the logs. Include "Negative" feedback logs (*"Selection: Box 5. Feedback: Negative"*).
  *   **Outcome:** It still doesn't help. Box 5 was negative not because of its number, but because it was Felt, not Sandpaper. That distinction does not exist in the symbol system.
  *   **Stop the clock.** Zone A has failed despite infinite symbolic data. Zone B succeeded with minimal data but high friction.

  #### 1:00 – 1:20: The Debrief (The Mapping)
  *   **Reveal:** Show the boxes. Let Zone A feel the sandpaper. The "Aha!" moment will be visceral.
  *   **Map the Game to the Argument:**
      *   **The Glyphs:** The LLM's token space.
      *   **Zone A (Syntax):** The CS claim that "enough text" creates meaning. They had the text (logs) but couldn't distinguish Sandpaper from Felt.
      *   **Zone B (Friction):** The Phil claim that connection to the world is needed.
      *   **The "Data Dump":** Address the "More Data" objection. Zone A had the *history* of Zone B's success. It didn't help. Why? Because the *channel* was wrong.
      *   **Your "Friction" Distinction:** Ask Zone B: "How did you know?" They will say "It scratched my finger." That is **Friction**. The world pushed back.
      *   **Causal Contact vs. Friction:** Ask Zone A: "Did you have causal contact?" Yes, the paper touched their eyes. But there was no resistance. A camera pointing at the box (causal contact) wouldn't know it's sandpaper either. Only interaction (friction) reveals the property.
  *   **The CS Counter-Argument (Pre-empted):** A CS student will say, "But if the logs included the text 'It felt rough,' Zone A would win."
      *   **Your Reply:** "Then the symbol 'Rough' is doing the work. But where did 'Rough' get *its* meaning? If Zone A looks up 'Rough' in the dictionary, it says 'See: Sandpaper.' If they never touch sandpaper, 'Rough' is just another glyph. You've pushed the grounding problem back one step, not solved it."

  ### Predicted Failure Modes & Fixes

  1.  **Cheating (Zone A peeking):**
      *   *Fix:* Put Zone A in a corner with their backs to the table. Appoint a "Monitor" from Zone B (who has finished their task) to watch Zone A.
  2.  **Zone A gets too good at pattern matching:**
      *   *Risk:* If you number the boxes 1-5 for Sandpaper and 6-10 for Felt, Zone A will guess it.
      *   *Fix:* Randomize the box numbers for every round. Shuffle the boxes physically between rounds. The number on the bottom must correlate to *nothing*.
  3.  **The "It's just a bad API" Objection:**
      *   CS students might argue the symbol system was poorly designed.
      *   *Fix:* In the debrief, concede this. "Yes, a better API includes multi-modal inputs. But this *is* the argument. Is text-only an API that misses the world? This game says yes."
  4.  **Boredom/Confusion:**
      *   *Fix:* Keep the rounds fast. If Zone A is stuck, don't help. Their frustration is data.

  ### What This Activity Cannot Reproduce (The Lecture Bits)
  You must be honest about the limitations in the debrief.
  1.  **Scale:** LLMs have trillions of tokens. Zone A had 5 pages. You cannot replicate the scale of the internet in a seminar room. You must argue *qualitatively*: "No amount of text describes the feeling of sandpaper unless the text assumes you already know what sandpaper is."
  2.  **Social Grounding:** The CS argument often relies on "Humans wrote the text, and humans are grounded." This game isolates the individual. You need to verbally add: "Even if the logs came from grounded humans (Zone B), the *transfer* to Zone A stripped the grounding. This suggests grounding isn't fully compressible into symbols."
  3.  **Learning:** Zone A didn't "learn" in the neural net sense. They were doing explicit reasoning. Acknowledge that implicit statistical learning might find correlations you didn't see, but reiterate: "Correlation is not reference."

  ### The "Friction" Test for Your Distinction
  To specifically test your "Friction vs. Causal Contact" idea:
  *   During the debrief, hold up a photo of the sandpaper box.
  *   Ask: "Does this photo have causal contact with the box?" (Yes, light reflected).
  *   "Does the photo know it's rough?" (No).
  *   "Did Zone B's finger have causal contact?" (Yes).
  *   "What was the difference?" (The finger *deformed* slightly, the nerve endings fired under pressure. The world *changed* the observer, not just the observer sensing the world.)
  *   **Conclusion:** Meaning requires the possibility of being *wrong* in a way that hurts (or scratches), not just being *incorrect* in a way that prints an error message.

  ### Final Prep Checklist
  *   [ ] Build 20 boxes (Friday night).
  *   [ ] Glue textures (Saturday morning).
  *   [ ] Print Glyph Sheets and Logs (Saturday afternoon).
  *   [ ] Buy Candy and Spray Paint the Token (Saturday afternoon).
  *   [ ] **Crucial:** Memorize the mapping of Box Numbers to Textures so you can validate Zone B quickly.

  This design forces the CS students to *be* the ungrounded system. When they fail, they aren't failing a theory; they are failing a task they thought they were equipped for. That is the only way to break the breakfast stalemate.
