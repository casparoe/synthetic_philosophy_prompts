prompt: |-
  hey im a software engineer with zero philosphy training trying to figure out what a decent theory of work and leisure rights actually needs to cover. I keep seeing three things that feel like they should constrain any answer: the Protestant work ethic treating labor as virtuous, France's 35-hour week capping it by law, and karoshi in Japan where people literally work themselves to death. but I also want it to handle this weird case I'm stuck on—imagine AI automates all productive labor, so the only "work" left is voluntary creative projects people do for fun, yet society still shames or penalizes anyone who opts out completely.

  what would the full list of desiderata be? I want the spec: the phenomona and edge cases it must explain (the ethic, the legal cap, death-by-overwork, and my AI leisure-punishment scenario), the distinctions it can't collapse (like a right to leisure vs being forced into it, or earned rest vs state-mandated idleness), any medical or economic results it can't flat-out contradict, and for each why it's a real requirement not just one camp's prejudice. also tell me which requirements are genuinely non-negotiable vs just preferences, and point out the single one that does the most damage to popular theories. table is fine—just keep it conceptual, no need to name-drop obscure authors.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, zero philosophy training, thinks in terms of specs, constraints, edge cases, and desiderata. Wants a conceptual framework, not a history lesson.
      *   **Task:** Define the "spec" for a decent theory of work and leisure rights.
      *   **Input Constraints/Phenomena to Explain:**
          1.  Protestant Work Ethic (labor as virtue).
          2.  France's 35-hour week (legal cap).
          3.  Karoshi (death by overwork).
          4.  AI Edge Case (post-scarcity, voluntary work, but social shaming for opting out).
      *   **Required Distinctions:** Right to leisure vs. forced leisure, earned rest vs. mandated idleness.
      *   **Constraints:** Cannot contradict medical/economic results. Must explain *why* each requirement is necessary (not just prejudice).
      *   **Output Format:** Conceptual, table is okay, identify non-negotiables vs. preferences, identify the single most damaging requirement to popular theories.
      *   **Tone:** Analytical, structured, precise (engineering mindset), avoiding obscure jargon.

  2.  **Deconstruct the Problem:**
      *   The core tension is between *instrumental value* of work (making money/things) and *intrinsic value* of work (meaning/virtue), versus the *necessity* of rest (health/autonomy).
      *   A "theory of work and leisure rights" needs to balance individual agency, social utility, and biological limits.
      *   The AI scenario highlights that even if economic necessity vanishes, *social* necessity might remain. A good theory must address social pressure, not just economic coercion.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: Biological Viability.* Can't contradict medicine. Humans break if they work too much (Karoshi).
      *   *Requirement 2: Economic Sustainability.* Can't contradict economics. Society needs stuff done (Protestant Ethic/France).
      *   *Requirement 3: Agency/Autonomy.* Must distinguish between choosing to rest and being forced to rest. (France vs. Unemployment).
      *   *Requirement 4: Social Meaning.* Must explain why work feels virtuous even when not needed (Protestant Ethic/AI scenario).
      *   *Requirement 5: Protection from Coercion.* Must prevent death by overwork (Karoshi) and economic starvation.

  4.  **Refining the Distinctions:**
      *   *Leisure as Right vs. Leisure as Duty:* You can have the right to not work, but if society makes you feel guilty, is it a real right? (AI scenario).
      *   *Rest as Recovery vs. Rest as Idleness:* Medical need vs. moral failing.

  5.  **Identifying Non-Negotiables vs. Preferences:**
      *   *Non-Negotiable:* Biological limits (you die if you ignore them), Basic Agency (you must be able to choose).
      *   *Preference:* Specific hours (35 vs 40), Specific cultural attitude (virtue vs. necessity).

  6.  **Identifying the "Killer" Constraint:**
      *   What breaks most theories? Usually, it's the *AI Edge Case*. Most theories tie leisure to *economic necessity* (you rest so you can work again). If work is optional but shamed, a theory based solely on economic efficiency fails. It needs to account for *social status* and *meaning*.
      *   Actually, a stronger candidate is the distinction between *Right to Leisure* and *Duty of Leisure*. Many theories advocate for leisure but fail to protect the *choice* to work (or vice versa).
      *   Let's look closer at the prompt's specific request: "point out the single one that does the most damage to popular theories."
      *   Common theories: Libertarian (contract freedom), Marxist (alienation), Welfare State (safety net).
      *   The AI scenario breaks the "Labor Theory of Value" or "Economic Necessity" models. If labor isn't needed for survival, why does the shame persist? A theory must explain the *social function* of work beyond production.
      *   *Decision:* The requirement to account for *non-economic social coercion* (the AI scenario) is the hardest. It breaks theories that assume removing economic need removes the pressure to work.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the engineering mindset (specifying constraints).
      *   **The Spec Table:** Columns for Requirement, Phenomena Covered, Why it's Objective (not prejudice), Non-Negotiable/Preference.
      *   **Critical Distinctions:** Explicitly handle the "Right vs. Forced" and "Earned vs. Mandated" splits.
      *   **Medical/Economic Guardrails:** Briefly list the hard facts.
      *   **The "Killer" Constraint:** Identify the one that breaks existing models.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Non-Negotiable":* Is the 35-hour week non-negotiable? No, that's a policy implementation. The *need for rest* is non-negotiable. Is the Protestant Ethic non-negotiable? No, that's cultural. The *psychological need for meaning* is non-negotiable.
      *   *Refining the AI Scenario:* This is about "Status Signaling." Work signals contribution. If AI does everything, work signals *virtue*. A theory must handle status without economic leverage.
      *   *Refining the "Killer":* The requirement that **Leisure must be socially legitimized, not just legally permitted.** Most theories stop at "you won't be arrested/starved." They fail at "you won't be shamed." This is the "Social Validity" constraint.

  9.  **Final Review against User Constraints:**
      *   Software engineer persona? Yes, use terms like "spec," "edge case," "constraints."
      *   Zero philosophy training? Avoid terms like "deontology," "teleology," "hegemony." Use plain English.
      *   Cover all 4 phenomena? Yes (Protestant, France, Karoshi, AI).
      *   Distinctions clear? Yes.
      *   Medical/Economic facts respected? Yes.
      *   Table included? Yes.
      *   Killer constraint identified? Yes.

  10. **Final Polish:** Ensure tone is respectful but direct. (Proceed to generate output).

  *(Self-Correction during drafting)*: Make sure I don't just list "don't die." Frame it as "Physiological Boundary Conditions." Make sure the AI case isn't just "UBI." It's about the *shame*. The theory needs to explain why shame exists and how to mitigate it as a *right*.

  *Revised Killer Constraint:* The requirement that **Work and Leisure must be decoupled from Survival *and* Status.** Most theories decouple from survival (welfare) but fail to decouple from status (the AI shame case).

