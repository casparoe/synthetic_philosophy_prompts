answer: |-
  Here is the spec for a robust Theory of Work and Leisure Rights, structured as a system design document. It treats the human organism as the hardware, society as the operating system, and work/leisure as resource allocation processes.

  ### 1. Core Desiderata (The Requirements)

  A valid theory must satisfy these five constraints to handle your four phenomena (Protestant Ethic, France, Karoshi, AI Edge Case) without crashing.

  | Requirement | Phenomena Constrained | Why it's Objective (Not Prejudice) | Priority |
  | :--- | :--- | :--- | :--- |
  | **1. Physiological Boundary Conditions** | **Karoshi** (Death by overwork) | Human biology has hard limits on stress, sleep, and recovery. Ignoring this causes system failure (death/illness), which is a net negative for any society regardless of ideology. | **Non-Negotiable** |
  | **2. Economic Continuity** | **France's 35h Week** / **Protestant Ethic** | Society requires resource production to sustain the population. A theory that eliminates the incentive or mechanism for production causes collapse. Work must remain viable as a means of survival. | **Non-Negotiable** |
  | **3. Volitional Integrity** | **France** vs. **Unemployment** | There is a functional difference between *choosing* not to work (leisure) and being *unable* to work (unemployment). A theory must protect the user's ability to distinguish between these states. | **Non-Negotiable** |
  | **4. Social Legitimacy of Rest** | **Protestant Ethic** / **AI Shame** | Humans are social animals; status affects mental health. If rest is legally allowed but socially punished (shamed), the "right" is buggy. The theory must account for cultural signaling, not just law. | **Non-Negotiable** |
  | **5. Post-Scarcity Scalability** | **AI Edge Case** | The theory cannot rely solely on "labor for survival." It must remain stable even if economic necessity is removed. If the theory breaks when money is no longer needed, it is not a theory of *rights*, but of *economic coercion*. | **Preference** (but critical for longevity) |

  ### 2. Critical Distinctions (What Cannot Be Collapsed)

  To avoid logic errors, the theory must maintain strict separation between these pairs. Collapsing them leads to authoritarianism or anarchy.

  *   **Negative Liberty vs. Positive Liberty regarding Leisure**
      *   *Definition:* **Negative** means "no one can force you to work." **Positive** means "society supports your right to not work without penalty."
      *   *Why it matters:* The **AI Edge Case** fails Negative Liberty (you aren't forced) but fails Positive Liberty (you are shamed). A theory that only guarantees Negative Liberty is insufficient for human well-being.
  *   **Instrumental Rest vs. Intrinsic Rest**
      *   *Definition:* **Instrumental** is rest to recover for more work (maintenance). **Intrinsic** is rest as a valuable state in itself (feature).
      *   *Why it matters:* **Karoshi** happens when rest is viewed only as Instrumental (you skip maintenance to run the process longer). The **Protestant Ethic** often fails here by viewing rest only as a tool for labor.
  *   **Mandated Idleness vs. Protected Leisure**
      *   *Definition:* **Mandated** is the state forcing you to stop (e.g., forced retirement, lockdowns). **Protected** is the state preventing others from forcing you to start.
      *   *Why it matters:* **France's 35h week** walks this line. If the state mandates stoppage, it violates agency. If it mandates *access* to stoppage, it protects agency. The theory must specify who holds the toggle switch.

  ### 3. Hard Guardrails (Medical & Economic Facts)

  The theory cannot output solutions that contradict these established data points:

  1.  **Diminishing Returns on Cognitive Labor:** Medical/psychological data shows productivity drops precipitously after ~50 hours/week long-term. A theory demanding 60+ hours as a standard violates efficiency metrics.
  2.  **The Necessity of Contribution:** Economic/Psychological data shows that total removal of "obligation" or "contribution" correlates with higher rates of depression and loss of status (The **Protestant Ethic** intuition has a biological basis in social bonding).
  3.  **The Cost of Enforcement:** Economic reality dictates that enforcing leisure (like France) has an administrative cost and potential productivity drag. A theory claiming zero cost is hallucinating.

  ### 4. Priority Classification

  *   **Non-Negotiable (Hard Constraints):**
      *   **Physiological Boundary:** You cannot legislate away the need for sleep or stress recovery.
      *   **Volitional Integrity:** The individual must retain the final commit rights on their own time, provided basic survival needs are met.
      *   **Social Legitimacy:** If the culture punishes the legal right, the right is effectively null. The theory must address culture, not just statute.

  *   **Preferences (Configurable Parameters):**
      *   **Specific Hour Caps:** 35 hours vs. 40 hours is a tuning parameter, not a core requirement.
      *   **Source of Income:** Whether leisure is funded by savings, state welfare, or spousal support is an implementation detail.
      *   **Definition of "Work":** Whether creative coding counts as "work" or "leisure" is subjective and should be user-defined.

  ### 5. The "Killer" Constraint

  The single requirement that does the most damage to popular existing theories is:

  **Requirement #4: Social Legitimacy of Rest.**

  **Why it breaks existing theories:**
  *   **Libertarian/Free Market theories** usually solve for *legal* coercion (you can't be enslaved). They fail the **AI Edge Case** because they assume that if economic coercion is removed, freedom exists. They do not account for *social* coercion (shame/status loss).
  *   **Marxist/Labor theories** usually solve for *economic* exploitation (you are paid less than your value). They fail the **AI Edge Case** because they assume if you own the means of production, work becomes fulfilling. They don't explain why people would still feel shame for *not* working even if they own the AI.
  *   **Welfare State theories** solve for *survival* (you won't starve). They fail the **Protestant Ethic** constraint because they often inadvertently create a "leisure class" stigma, where receiving support marks you as a second-class citizen.

  **The Implication:**
  A decent theory cannot just say "You have the right to not work." It must explain how to decouple **Human Worth** from **Economic Output**. If your theory allows a person to survive without work but leaves them socially degraded (as in your AI scenario), the spec is incomplete. The "right to leisure" must include a "right to dignity while idle."
