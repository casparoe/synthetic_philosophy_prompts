answer: |-
  ### Specification for an Institutional Account of Moral Testimony

  To serve an institutional purpose (ethics committees, legislatures, funding panels), an account of moral testimony must move beyond the binary of "justified belief" vs. "unjustified belief." It must provide a grammar for distributed agency. Below is the requirements list derived from your cases and constraints, tagged by their status.

  #### 1. The Object of Assessment Specification
  **Status:** Non-negotiable.
  **Requirement:** The account must explicitly distinguish between at least three objects: (a) the epistemic justification of the *belief* (is it true/reliable?), (b) the moral worth or *credit* of the *agent* (did they act virtuously?), and (c) the *understanding* possessed (do they grasp the *why*?).
  **Case/Consideration:** An institution may be epistemically licensed to act on testimony (a) without the individual members possessing moral credit (b) or deep understanding (c). An account that conflates these cannot guide a body that needs to act without claiming moral sainthood for its bureaucrats.

  #### 2. Layered Deference Localization
  **Status:** Non-negotiable.
  **Requirement:** The account must distinguish between deference on non-moral facts (suffocation kills), moral weights (suffering matters), and final verdicts (buying is wrong). It must specify which layers permit testimony and which require first-personal grasp.
  **Case/Consideration:** *Layered Deference.* Reluctance usually attaches to the weight/verdict layer, not the factual layer. An institutional account must allow fact-deference while clarifying the cost of verdict-deference.

  #### 3. Conceptual Transmission Capacity
  **Status:** Negotiable (depends on meta-ethics).
  **Requirement:** The account must state whether testimony can transmit new moral concepts (e.g., "speciesism") or only apply existing ones. If it cannot transmit concepts, it must explain how institutions adjudicate novel moral kinds without conceptual inflation.
  **Case/Consideration:** *Novel Moral Kinds.* If a panel cannot grasp the concept "artificial person" via testimony, they cannot legislate for AI. The account must allow for conceptual expansion via expert testimony or admit a blind spot in institutional learning.

  #### 4. Constitutive Authority Handling
  **Status:** Preference (Feminist/Relational Camp).
  **Requirement:** The account must accommodate cases where deference does not track a prior fact but helps constitute the moral reality (e.g., accepting a victim's testimony that they were wronged).
  **Case/Consideration:** *Constitutive Deference.* In institutional settings (e.g., HR tribunals), accepting testimony *is* the act of justice. A purely reportive model fails here.

  #### 5. Diachronic Consistency
  **Status:** Non-negotiable.
  **Requirement:** The account must treat trusting one's future self (pre-commitment) or past self (memory/rules) as structurally similar to trusting another person, or provide a principled reason for the difference.
  **Case/Consideration:** *Diachronic Deference.* Legislatures bind future selves via rules. If self-trust is epistemically distinct from other-trust, institutional continuity is threatened.

  #### 6. The Comprehension-Stakes Ratio
  **Status:** Non-negotiable.
  **Requirement:** The account must define the relationship between the deferrer's comprehension and the stakes involved. Does high stakes demand higher comprehension, or does it license greater deference to expertise?
  **Case/Consideration:** *Deference at Scale.* A funding panel cannot understand the bioethics of every grant. If high stakes require high comprehension, institutions freeze. If high stakes license high deference, institutions risk moral outsourcing.

  #### 7. Credit and Double-Counting Constraint
  **Status:** Non-negotiable.
  **Requirement:** The account must precisely state whether an agent acting on testimony retains moral credit. It must forbid "double counting" where the testifier gets credit for the insight and the deferrer gets credit for the action, unless a specific division of labor is justified.
  **Case/Consideration:** *Credit.* Institutions need to know if acting on advice makes them morally complicit or merely administratively efficient.

  #### 8. The Discrimination Test
  **Status:** Negotiable (Symmetry vs. Asymmetry Camp).
  **Requirement:** The account must identify a feature unique to moral testimony (if any) that distinguishes it from mathematical or scientific testimony. If no feature exists, it must argue why the *feeling* of reluctance persists.
  **Case/Consideration:** *Discrimination Test.* If moral testimony is epistemically identical to scientific testimony, institutional reluctance is irrational. If distinct, the distinction must be robust enough to survive scrutiny.

  #### 9. Temporal Dynamics of Conversion
  **Status:** Preference.
  **Requirement:** The account should explain whether rapid conversion on testimony indicates epistemic irresponsibility or efficient updating.
  **Case/Consideration:** *Conversion Speed.* Institutions need rapid consensus. If rapid shift via testimony is epistemically suspect, institutional deliberation is structurally flawed.

  #### 10. Disagreement Resolution
  **Status:** Non-negotiable.
  **Requirement:** The account must specify how to weigh conflicting moral testimony. It cannot simply reduce to general peer disagreement but must address the *moral* valence of the disagreement.
  **Case/Consideration:** *Moral Disagreement.* When experts disagree on the moral status of an embryo, does the panel suspend judgment (skepticism) or choose a side (deference)?

  #### 11. Meta-Ethical Neutrality or Explicit Commitment
  **Status:** Non-negotiable.
  **Requirement:** The account must not smuggle in skepticism or relativism. It must state plainly whether it requires Internalism (judgment motivates) or Externalism (judgment is truth-apt regardless of motivation).
  **Case/Consideration:** *Constraint.* Institutions need actionable truths. A view that implies moral truths are unknowable (skepticism) fails the institutional purpose.

  #### 12. Collective Agent Compatibility
  **Status:** Non-negotiable.
  **Requirement:** The account must handle testimony given to and by groups, not just individuals.
  **Case/Consideration:** *Institutional Deference.* A committee relies on a sub-committee's report. This is group-to-group testimony. Individualist epistemologies fail here.

  ***

  ### Meta-Analysis: Tensions, Prejudices, and Settlement

  **1. Incompatible Requirements**
  There is a fundamental tension between **Requirement 7 (Credit)** and **Requirement 6 (Comprehension-Stakes)**.
  *   **The Conflict:** If moral credit requires understanding (as Pessimists argue), and institutional stakes demand action under near-zero comprehension (Requirement 6), then institutions *cannot* act morally. They can only act efficiently.
  *   **The Two-Tier Consequence:** You correctly anticipate that satisfying the institutional need for action while respecting the epistemic demand for understanding forces a split verdict. The account must be **pessimistic about belief/credit** (the individual bureaucrat gains no moral worth) but **permissive about action** (the institution is licensed to proceed). This creates a "moral division of labor" where the institution acts, but the moral credit resides solely with the testifiers. This is unstable: it turns the institution into a mere tool of the experts, undermining its democratic or fiduciary authority.

  **2. Genuine Requirements vs. Partisan Prejudices**
  *   **Genuine Requirements:** 1 (Object Specification), 2 (Layered Deference), 6 (Comprehension-Stakes), 11 (Meta-Ethical Clarity). These are structural necessities for any institutional application.
  *   **Partisan Prejudices:** 8 (Discrimination Test) and 7 (Credit).
      *   The demand that moral testimony be *different* from scientific testimony (8) is a prejudice of the "Moral Agency" camp. The Symmetry camp views this as a bug, not a feature.
      *   The demand that acting on testimony reduces moral credit (7) is a prejudice of the "Understanding-First" camp. Consequentialists would reject this entirely.
  *   **The Killer Constraint:** **Requirement 1 (Object Specification)** combined with **Requirement 7 (Credit)**. This pair does the most work excluding candidate accounts. Any account that treats "justification" as a monolithic property (covering belief, action, and credit simultaneously) will fail. The account *must* fracture the concept of justification to survive.

  **3. The Settling Finding**
  For **Pessimism** to be conclusively correct, the following conceptual finding would need to be established:
  *   **The Necessity of First-Personal Grasp:** It must be shown that *moral properties* are not mind-independent facts that can be tracked, but are partly constituted by the agent's own reasoning process. If moral truth is response-dependent on the *agent's* rational engagement, then testimony (which bypasses engagement) cannot transmit moral truth, only moral reports.
  *   **Empirical Correlate:** If psychological research showed that agents who act on moral testimony consistently fail to recognize relevant moral features in *novel* situations (unlike those who reason it out), this would support the claim that testimony fails to transmit *understanding*, which is a necessary condition for moral competence.

  ***

  ### Scoring of View Families

  **1. Understanding-First Pessimism**
  *   **Core Claim:** Moral belief via testimony is possible, but moral understanding (and thus moral worth) is not.
  *   **Performance:**
      *   *Strengths:* Excellent on **Credit (Req 7)** and **Discrimination (Req 8)**. It explains the reluctance to defer. It handles **Layered Deference (Req 2)** well by allowing factual deference but blocking moral deference.
      *   *Weaknesses:* Fails **Institutional Action (Req 1/6)**. If understanding is required for justified action, institutions paralysis. It struggles with **Novel Moral Kinds (Req 3)** because new concepts require understanding to grasp.
      *   *Verdict:* Epistemically robust, institutionally crippling.

  **2. Skepticism about Moral Expertise**
  *   **Core Claim:** There are no moral experts; therefore, moral testimony is fundamentally flawed or non-existent.
  *   **Performance:**
      *   *Strengths:* Solves **Disagreement (Req 10)** by leveling the field. Avoids **Double Counting (Req 7)**.
      *   *Weaknesses:* Fails **Deference at Scale (Req 6)** and **Layered Deference (Req 2)**. Institutions *must* defer on complex bioethical facts. This view forces every committee member to be a moral philosopher, which is pragmatically impossible. It violates **Meta-Ethical Neutrality (Req 11)** by smuggling in a substantive claim about moral ontology.
      *   *Verdict:* Philosophically clean, practically useless.

  **3. Symmetry View (Reductionism)**
  *   **Core Claim:** Moral testimony is epistemically identical to scientific testimony.
  *   **Performance:**
      *   *Strengths:* Excellent on **Scale (Req 6)**, **Diachronic (Req 5)**, and **Institutional Action (Req 1)**. It allows bodies to act on expert advice without guilt.
      *   *Weaknesses:* Fails **Discrimination (Req 8)** (ignores the intuition of reluctance). Fails **Credit (Req 7)** (grants full credit where intuition suggests less). Struggles with **Constitutive Deference (Req 4)** (treats victim testimony as mere data).
      *   *Verdict:* Institutionally efficient, phenomenologically inaccurate.

  **4. Hybrid View (Belief-Action Split)**
  *   **Core Claim:** Testimony justifies action and institutional policy, but does not confer full moral understanding or credit to the individual deferrer.
  *   **Performance:**
      *   *Strengths:* Best fit for **Object Specification (Req 1)** and **Credit (Req 7)**. Handles **Scale (Req 6)** by permitting action without understanding. Accommodates **Layered Deference (Req 2)**.
      *   *Weaknesses:* Theoretically unstable. It requires maintaining two different standards of justification simultaneously. Risks creating a "moral caste system" (experts think, bureaucrats act).
      *   *Verdict:* The only viable option for your institutional purpose, despite theoretical friction.

  ### Summary Table

  | Requirement | Understanding-First Pessimism | Skepticism about Expertise | Symmetry View | Hybrid (Split) View |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Object Specification** | Pass (Distinguishes belief/understanding) | Fail (Collapses all) | Fail (Collapses all) | **Pass (Explicitly splits)** |
  | **2. Layered Deference** | **Pass** | Fail | Pass | **Pass** |
  | **6. Comprehension-Stakes** | Fail (Paralysis at scale) | Fail (Paralysis at scale) | **Pass** | **Pass** |
  | **7. Credit Allocation** | **Pass** | Pass | Fail (Over-credits) | **Pass** |
  | **8. Discrimination Test** | **Pass** | Pass | Fail | **Pass** |
  | **11. Meta-Ethical Neutrality**| Pass | Fail | Pass | Pass |
  | **Institutional Viability** | Low | None | High | **High** |
  | **Theoretical Stability** | High | High | High | **Low** |
