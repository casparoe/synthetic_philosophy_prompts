  3. **Primitive haecceity** — 6/10: While it secures numerical distinctness easily, it relies on ontologically expensive bare particulars that many find unintelligible or ad hoc.
  4. **The hard Leibnizian** — 4/10: This position is costly because it rules out a physically coherent scenario based solely on a logical principle that many now treat as contingent.
  5. **The modal counterfactual retreat** — 2/10: This is the weakest link because the symmetry of the world likely extends to modal properties, making the distinction circular or question-begging.
