prompt: |-
  I'm a junior majoring in philosophy, and this term I'm in a seminar on race, aesthetics, and politics. We spent most of two weeks on the W. E. B. Du Bois essay about Black art — "Criteria of Negro Art," I think it's called, the one where he says that all art is propaganda and always must be, that he doesn't care about art that isn't used for propaganda, and that this is no license for bad art, because the propaganda has to be beautiful and true to count as art at all. I finished the reading convinced, and then realized that being convinced hasn't changed a single thing I actually do, which makes me suspect I understood it less well than I thought.

  Here is what I mean. I sit on the student exhibitions committee for the gallery in our student union: twice a month, in a ninety-minute meeting, six to ten proposals for small commissions — anywhere from $500 to $3,000 — from student and local artists for work to be installed in the building or shown in the gallery cases. We vote, we write a paragraph of reasons that goes back to the applicant, and the gallery director reviews what we recommend and can veto it (she has, once, over insurance and once over a work that would have needed a structural engineer). Our rubric is three lines — artistic merit, message, fits the space — and it is useless, because every real disagreement we have turns out to be a fight inside the first line. I would like to replace it with a decision procedure built honestly out of Du Bois's position: art should be propaganda; propaganda that isn't made well isn't art; and craft that carries nothing is decoration. Please write me that procedure as an ordered set of questions a committee of non-specialists can run in about fifteen minutes per proposal, each with a stop rule: what counts as passing, what counts as an immediate no, and which questions have to be kicked to a person — the director, the artist, the people depicted — because they are disagreements about values rather than facts and no checklist can settle them. Keep the distinctions in Du Bois's view that are actually doing the work and drop the ones that only matter in a seminar paper, and be blunt about where a rubric like this will misfire.

  Two half-formed ideas of my own, which you should use or discard as you see fit. The first is a subtraction test: take the political content away and ask whether the object still holds up as a made thing, then take the craft away and ask whether the message still reaches anyone who wasn't already persuaded — so that a slogan on a beautiful surface and a beautiful surface with a slogan stapled to it both fail, for different reasons. The second is that propaganda has an addressee, and it matters who it is: a work addressed to the people it depicts, or to the people it wants to move, seems to me a different animal from a work whose real content is that its sponsor is a decent institution, and I don't know what Du Bois's view implies about that second kind. Then run the finished procedure on three kinds of proposal we get constantly. One: a large, genuinely accomplished mural for the dining hall wall about the scheduling of subcontracted food-service workers, proposed by a student labor group, with a student artist whose portfolio is strong and a facilities office that is quietly unhappy. Two: a polished, professionally produced installation funded by the bank that handles the university's accounts — beautiful, costs us nothing, says that everyone on this campus belongs, and puts the bank's name on the wall label; we currently approve these cheerfully and I want to know whether we should. Three: a stack of photocopied posters from the tenants' union in the neighborhood next to campus, about a rent increase at a building the university's foundation has a stake in — the committee agrees with them completely, the people affected made it themselves, and the design is honestly bad; I suspect this is the case where the procedure says something we don't want to hear, and I want to see whether it has to say it or whether it can offer us a condition instead of a no. Finally, tell me what the procedure cannot do — what it will get wrong, which of our decisions it will not touch, and where it will quietly turn into a vote dressed up as a test. Please write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior philosophy major, student exhibitions committee member.
      *   **Context:** Seminar on Race, Aesthetics, Politics. Studied W.E.B. Du Bois's "Criteria of Negro Art."
      *   **Core Insight:** Convinced by Du Bois ("All art is propaganda," "must be beautiful and true"), but realized it hasn't changed practice. Wants to bridge theory and practice.
      *   **Task:** Create a decision procedure (rubric/checklist) based on Du Bois's view for a committee of non-specialists.
      *   **Constraints:**
          *   Ordered set of questions.
          *   ~15 minutes per proposal.
          *   Stop rules (Pass, Immediate No, Kick Upstairs).
          *   Keep Du Bois's working distinctions, drop seminar-paper distinctions.
          *   Be blunt about misfires.
          *   Use/Discard user's two ideas (Subtraction Test, Addressee Test).
          *   Run the procedure on three specific case studies (Labor Mural, Bank Installation, Tenants' Posters).
          *   Explain limitations (what it can't do, where it fails).
          *   American English.

  2.  **Deconstruct Du Bois's "Criteria of Negro Art":**
      *   *Core Thesis:* All art is propaganda.
      *   *The Demand:* Art *ought* to be propaganda (specifically for racial uplift/truth, but for this secular committee, we generalize to "truth/justice").
      *   *The Constraint:* It must be *Art*. Badly made propaganda is just noise. It must be beautiful.
      *   *The Truth:* It must be true (not stereotypical, not lying about the human condition).
      *   *Tension:* Beauty vs. Utility. Du Bois refuses to choose; he demands both.

  3.  **Develop the Decision Procedure (The "Du Bois Rubric"):**
      *   *Goal:* 15 minutes, non-specialists. Needs to be actionable.
      *   *User's Idea 1 (Subtraction Test):* Good. Aligns with Du Bois's insistence on craft *and* message. If you remove the message, is it still well-made? If you remove the craft, does the message land?
      *   *User's Idea 2 (Addressee):* Crucial. Du Bois wrote for Black people *and* white people, but primarily to assert Black humanity. Corporate propaganda ("We are decent") is the antithesis of Du Boisian truth.
      *   *Structure:*
          1.  **Threshold Question (The "Propaganda" Check):** Does it take a stand? If it's neutral/decorative, it fails Du Bois's "always must be" criterion.
          2.  **Craft Check (The "Art" Check):** Is it well-made? (Du Bois: "no license for bad art").
          3.  **Truth Check (The "True" Check):** Is it honest or manipulative?
          4.  **Addressee Check:** Who is this for?
      *   *Stop Rules:* Need clear "No" triggers and "Kick" triggers.
      *   *Refinement:* Make it sound like a committee tool, not a philosophy exam.

  4.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: The Claim.* What is it arguing? If "nothing," it's decoration. Du Bois says decoration without purpose is insufficient for *this* mission. *Decision:* If it claims to be neutral, it's a No (for this specific rubric).
      *   *Step 2: The Craft.* Is it technically competent? *Decision:* If it's sloppy, it fails the "Art" half of Du Bois's equation.
      *   *Step 3: The Truth.* Is it lying? *Decision:* If it obscures power dynamics (like the Bank example), it fails.
      *   *Step 4: The Addressee.* Who is spoken to?
      *   *Kick Rules:* When the committee disagrees on values (e.g., is this message *true*?), kick to the Director or the affected community.

  5.  **Applying to Case Studies:**
      *   *Case 1: Labor Mural.*
          *   Propaganda? Yes (labor rights).
          *   Craft? Yes (strong portfolio).
          *   Truth? Yes (subcontracted workers exist).
          *   Addressee? Workers/Students.
          *   *Verdict:* Pass, but anticipate friction with Facilities.
      *   *Case 2: Bank Installation.*
          *   Propaganda? Yes (Bank is good/Everyone belongs).
          *   Craft? Yes (Professional).
          *   Truth? Questionable. "Everyone belongs" while the bank profits from student debt/tuition? Du Bois would smell a lie.
          *   Addressee? The Institution (self-congratulation).
          *   *Verdict:* No. It's "beautiful surface with a slogan stapled to it."
      *   *Case 3: Tenants' Posters.*
          *   Propaganda? Yes (Rent control).
          *   Craft? No ("honestly bad").
          *   Truth? Yes (Committee agrees).
          *   Addressee? Affected tenants.
          *   *Verdict:* This is the hard one. Du Bois says bad art isn't art. But it's *their* voice.
          *   *Solution:* Condition. Fund them to make it better *with* a designer, or display it as archival/documentary, not "Art." Or, acknowledge the rubric says No, but ethics says Yes. The prompt asks if the procedure *has* to say No. Du Bois is strict: "I do not care a damn for any art that is not used for propaganda." But he also says "I would not be a painter... if I did not want to make a picture that is a work of art."
          *   *Refinement:* The procedure should flag the craft failure. The "Kick" option is vital here. Kick to the artist: "We support the message, but the craft undermines it. Will you collaborate with a designer?"

  6.  **Addressing Limitations (The "Blunt" Part):**
      *   Subjectivity of "Beauty."
      *   Committee bias (who defines "Truth"?).
      *   Institutional risk (Du Bois was radical; universities are conservative).
      *   The "Vote dressed as a test" problem.

  7.  **Review against Constraints:**
      *   American English? Yes.
      *   15 minutes? The questions need to be tight.
      *   Stop rules included? Yes.
      *   User's ideas integrated? Yes (Subtraction & Addressee).
      *   Tone? Respectful, academic but practical, blunt.

  8.  **Final Polish:**
      *   Ensure the distinction between "Propaganda" (Du Bois's positive term) and "Manipulation" is clear.
      *   Make sure the "Kick" rules empower the Director or external voices, acknowledging the committee's limits.
      *   Check the Tenants' Union case carefully. Du Bois valued the *dignity* of Black representation. If the posters are "bad," do they undermine dignity? Or is the rawness part of the truth? I need to be faithful to Du Bois's high standards for craft while acknowledging the political necessity. The compromise is the "Condition."

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the gap between theory and practice.
      *   *The Procedure:* 4 Questions.
      *   *The Cases:* Run them through.
      *   *The Limitations:* Where the rubric breaks.
      *   *Conclusion:* Encouragement.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Du Bois says X." I need to operationalize it. For the Bank case, Du Bois would hate "corporate propaganda" that masks truth. For the Tenants, Du Bois might say "make it better." I need to be careful not to sound patronizing to the tenants. The "Condition" is the key.

      *(Refining the "Stop Rules")*:
      *   Pass: Yes to Propaganda, Yes to Craft, Yes to Truth.
      *   No: No to Propaganda (Decoration), No to Craft (Sloppy), No to Truth (Lie).
      *   Kick: Disagreement on Truth, Disagreement on Addressee.

      *(Refining the Tenants Case)*: If the design is "honestly bad," Du Bois says it's not art. But it *is* propaganda. The committee funds "Art." So, technically, it's a No *as art*. But maybe it can be funded *as communication*? Or the committee offers resources to improve it. I will suggest the latter as the "Condition."

  10. **Final Review:** Does this sound like a helpful peer/mentor? Yes. Is it philosophically rigorous? Yes. Is it practical? Yes.

      *(Wait, one more check on Du Bois)*: Du Bois wrote: "I do not care a damn for any art that is not used for propaganda." But he also wrote, "I would not be a painter... if I did not want to make a picture that is a work of art." He demands the synthesis. So, bad craft = rejection. But the *reason* for rejection matters. It's not "we don't like your politics," it's "your politics deserve better craft." That's the Du Boisian move.

      Okay, ready to write.
answer: |-
  This is a classic philosophical problem: the gap between *assent* (agreeing with a proposition) and *commitment* (structuring your life around it). You have assented to Du Bois; now you are trying to build a commitment. That is difficult work, especially in a bureaucratic setting designed to minimize risk.

  Du Bois's "Criteria of Negro Art" (1926) is often summarized as "all art is propaganda," but the operational weight lies in the *and*. He demands a synthesis: **Propaganda + Beauty + Truth.** If any leg of that stool is missing, the object fails his criteria. It becomes either decoration (no propaganda), noise (no beauty), or a lie (no truth).

  Your two half-formed ideas are excellent. The **Subtraction Test** captures the synthesis requirement. The **Addressee Test** captures the ethical dimension of *who* the propaganda serves (uplift vs. self-congratulation).

  Below is a decision procedure built for your committee. It is designed to be run in fifteen minutes. It is blunt. It will make some people uncomfortable.

  ***

  # The Du Bois Decision Procedure
  **For:** Student Union Exhibitions Committee
  **Time Limit:** 15 Minutes per Proposal
  **Goal:** To fund work that is simultaneously skilled, truthful, and committed.

  ### Phase 1: The Propaganda Threshold (3 Minutes)
  *Du Bois Premise: Art without a purpose is merely decoration. We are not funding decoration.*

  **Question 1:** Does this work advance a specific claim about the world, rather than merely reflecting the status quo?
  *   **The Subtraction Test:** If you remove the political or social message, does the object lose its reason for existing?
      *   **If Yes:** It passes the threshold. Proceed to Question 2.
      *   **If No:** It is decoration. **STOP. Immediate No.** (Exception: If the "decoration" creates a space of rest for a marginalized group, discuss under "Addressee," but generally, neutral art fails this rubric).

  **Question 2:** Who is the Addressee?
  *   Is this work speaking *to* the people it depicts, or *for* them to an audience of power? Or is it speaking *at* the audience to comfort the sponsor?
      *   **Red Flag:** If the primary beneficiary of the message is the institution funding the work (e.g., "We are a diverse campus"), note this for Phase 3.

  ### Phase 2: The Craft Check (5 Minutes)
  *Du Bois Premise: "I do not care a damn for any art that is not used for propaganda," but also "no license for bad art." Ineffective propaganda is noise.*

  **Question 3:** Is the technical execution competent enough to command attention from a hostile viewer?
  *   **The Subtraction Test (Reverse):** If you agree with the message but hate the art, would you still display it?
      *   **If Yes:** The craft is insufficient. **STOP.** (See *Condition Rule* below).
      *   **If No:** The craft holds up on its own merits. Proceed to Phase 3.

  *Note: "Competent" does not mean "polished." It means "intentional." A rough poster can be intentional; a sloppy mural is just sloppy.*

  ### Phase 3: The Truth & Value Check (5 Minutes)
  *Du Bois Premise: Propaganda must be "true." Stereotypes, even positive ones, are lies. Corporate sanitization is a lie.*

  **Question 4:** Does the work obscure power dynamics to make the sponsor look good?
  *   Look at the funding source and the message. Do they conflict?
      *   **If Yes (Conflict):** E.g., A bank funding a "financial freedom" piece. **KICK.** This is a value disagreement about institutional complicity. Send to the Gallery Director with a note: "Committee recognizes this as corporate propaganda, not Du Boisian art."
      *   **If No (Alignment):** Proceed to Vote.

  **Question 5:** Is the message true to the experience of the subjects?
  *   If the committee disagrees on whether the message is "true" (e.g., is this labor struggle legitimate?), do not vote.
      *   **KICK.** Send to the people depicted. Ask: "Does this representation feel honest to you?" Their answer is binding.

  ### Phase 4: The Vote & Conditions (2 Minutes)
  *   **Pass:** Meets Propaganda, Craft, and Truth criteria.
  *   **No:** Fails Craft (too sloppy to persuade) or Propaganda (neutral/decorative).
  *   **Condition:** Passes Propaganda and Truth, Fails Craft.
      *   *The Du Bois Compromise:* "We will fund this *if* the artist collaborates with a designated designer to improve technical execution without diluting the message."
  *   **Kick:** Fails Truth (disagreement on validity) or Addressee (institutional self-worship).

  ***

  # Running the Procedure on Your Cases

  ### Case 1: The Labor Mural
  *   **Proposal:** Mural on subcontracted food workers. Student artist, strong portfolio. Facilities unhappy.
  *   **Phase 1 (Propaganda):** **Pass.** It advances a claim (labor rights). Subtraction Test: Without the labor message, it's just a wall painting.
  *   **Phase 1 (Addressee):** **Pass.** Addressed to students/workers to build solidarity.
  *   **Phase 2 (Craft):** **Pass.** Portfolio is strong. It can command attention.
  *   **Phase 3 (Truth):** **Pass.** The workers exist; the scheduling issue is factual.
  *   **Phase 3 (Conflict):** **Flag.** The sponsor (University) is the employer of the subcontractor. This creates tension, but the work is truthful about that tension.
  *   **Verdict:** **Pass.**
  *   **Note:** The rubric supports this. The friction with Facilities is a feature, not a bug. Du Boisian art is supposed to unsettle. The committee must be prepared to defend the "Truth" criterion against administrative pressure.

  ### Case 2: The Bank Installation
  *   **Proposal:** Polished installation. "Everyone belongs." Funded by the university's bank.
  *   **Phase 1 (Propaganda):** **Pass.** It advances a claim ("Everyone belongs").
  *   **Phase 1 (Addressee):** **Fail.** Who is this for? It is addressed to the administration to prove they are decent. It is self-congratulatory.
  *   **Phase 2 (Craft):** **Pass.** Professionally produced.
  *   **Phase 3 (Truth):** **Fail.** This is the stopper. Does the bank's presence (tuition handling, loans) align with "everyone belongs"? If the committee feels this obscures the economic barriers the bank helps enforce, it is a "Lie" in Du Bois's terms.
  *   **Verdict:** **No.** (Or **Kick** to Director).
  *   **Reasoning:** This is the "beautiful surface with a slogan stapled to it." It fails the Addressee test. It is propaganda *for the sponsor*, not propaganda *for the people*. Du Bois wrote for the uplift of the oppressed, not the comfort of the oppressor. If the committee approves this, they are admitting the rubric is a sham.

  ### Case 3: The Tenants' Posters
  *   **Proposal:** Photocopied posters. Rent increase protest. University foundation has stake in building. Design is "honestly bad."
  *   **Phase 1 (Propaganda):** **Pass.** High stakes, clear claim.
  *   **Phase 1 (Addressee):** **Pass.** Addressed to the tenants and the university.
  *   **Phase 2 (Craft):** **Fail.** You state the design is "honestly bad." Under Du Bois, bad art is not art. It will be ignored by anyone not already persuaded.
  *   **Phase 3 (Truth):** **Pass.** Committee agrees with the message.
  *   **Verdict:** **Condition.**
  *   **Reasoning:** A straight "No" betrays the political mission. A straight "Pass" betrays the aesthetic mission. Du Bois demands the synthesis.
  *   **The Move:** Offer the funding *conditionally*. "We support this truth, but the craft undermines your power. We will fund the printing costs *plus* $500 for a graphic designer of your choice to refine the layout." This respects the propaganda (the message) while enforcing the criteria (the art). If they refuse help, then it is a **No**.

  ***

  # What This Procedure Cannot Do (The Limitations)

  You asked for bluntness about where this will misfire. Here is where the Du Bois rubric will break down in a university setting.

  **1. It cannot solve the "Who Decides Truth?" problem.**
  Du Bois assumed a shared understanding of racial uplift among his audience. Your committee does not have a shared understanding of "labor justice" or "institutional complicity."
  *   **The Misfire:** Question 4 (Truth) will quietly become a vote. If the committee is mostly conservative, the Labor Mural becomes a "Lie." If mostly radical, the Bank Installation becomes a "Lie."
  *   **The Fix:** You must institutionalize the **Kick Rule**. When the committee disagrees on Truth, you cannot vote. You must outsource the decision to the people depicted. If you vote on Truth, you are just censoring under a new name.

  **2. It cannot protect you from institutional retaliation.**
  Du Bois wrote this for *The Crisis*, a publication of the NAACP. You are writing it for a Student Union funded by the University.
  *   **The Misfire:** The Gallery Director (who has veto power) will veto the Labor Mural not because it fails the rubric, but because it risks donor relations.
  *   **The Reality:** This rubric gives you the language to fight that veto ("This meets our stated criteria for Art and Truth"), but it does not give you the power to override it. You will be accused of being "ideological." (Du Bois would say: "Obviously.")

  **3. It turns aesthetic disagreements into moral failures.**
  By linking Craft to Political Efficacy ("bad art doesn't persuade"), you risk shaming artists who lack resources.
  *   **The Misfire:** The Tenants' Union might feel patronized by the "Condition." They might say, "Our urgency is the art."
  *   **The Reality:** Du Bois was an elitist about craft. He believed high art was necessary for dignity. If you adopt his view, you adopt his elitism. You must be honest that you are prioritizing *long-term persuasive power* over *immediate raw expression*.

  **4. It will not change the Bank Decision unless you are willing to lose.**
  Currently, you approve the Bank proposals "cheerfully." This rubric demands you reject them.
  *   **The Misfire:** The Director will override the "No."
  *   **The Reality:** If you use this rubric and the Director overrides you on the Bank case, you have exposed the committee's actual function: it is not to select art, but to legitimize institutional PR. That is a valuable philosophical realization, but it is a professional risk.

  ### Final Advice
  You suspected you understood Du Bois less well than you thought because your actions didn't change. That is correct. Understanding Du Bois is not an intellectual state; it is a willingness to incur cost.

  If you propose this rubric:
  1.  You will reject "safe" art (The Bank).
  2.  You will demand more work from "urgent" art (The Tenants).
  3.  You will fight for "risky" art (The Labor Mural).

  If you are not prepared for the Gallery Director to veto you, or for your student peers to call you "difficult," do not use this. But if you want to stop the gap between your seminar and your meeting room, this is the bridge. It turns "Artistic Merit" from a vague compliment into a demand for **effective truth-telling.**

  Du Bois wrote: "We have, to be sure, a few recognized Negro artists... but they have not yet said the things that need to be said." Your committee has the power to decide which things get said. Make sure they are worth saying, and make sure they are said well.
