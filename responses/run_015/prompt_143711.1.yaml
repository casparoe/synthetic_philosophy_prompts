answer: |-
  **Joint Statement on Moral Compromise and Value Leakage**

  **Date:** 24 October 2023
  **Parties:** The Trade-is-Real Camp (Camp 1) & The No-Dirty-Hands Camp (Camp 2)

  **Intro**
  Right, we've had a proper chat about this "value leakage" idea. We aren't friends, and we aren't merging brands, but we reckon we've found enough common ground to stop talking past each other. Below is where we stand, where we split, and what would actually change our minds.

  ***

  ### 1. Agreed Claims

  1.  **Leakage is real.** Both camps accept that moral compromise isn't frictionless. There is a psychological, social, or reputational cost beyond the explicit terms of the deal. You don't walk away clean.
  2.  **Scope of leakage.** We agree leakage isn't uniform. It applies heavily to core identity values (like sanctity of life or ecological integrity) but is negligible for mere preferences (like budget allocation or scheduling).
  3.  **The Logging Case.** Regarding the activist who trades trees for a protected zone: both sides agree the outcome is morally mixed. The protected zone is a tangible gain, but the activist's moral authority is diminished amongst their base, and the act of consenting to logging normalises the harm elsewhere.
  4.  **Transparency matters.** Hiding the compromise increases leakage. If the deal is opaque, the "taint" spreads via rumours and mistrust. If it's open, the leakage is contained to the act itself.
  5.  **Net benefit is hard to measure.** Both sides admit that calculating the "net benefit" is notoriously difficult because the costs (integrity, precedent) are qualitative, while the gains (acres saved, lives prolonged) are often quantitative.

  ***

  ### 2. Disagreements Table

  | Issue | Camp 1: The Trade-is-Real Lot | Camp 2: The No-Dirty-Hands Lot |
  | :--- | :--- | :--- |
  | **Nature of Values** | Values are fungible enough. Like currencies, they fluctuate, but you can find an exchange rate that works if the bargaining is smart. | Values are incommensurable. You can't swap principles for outcomes without breaking the principle. There is no exchange rate, only degradation. |
  | **The Net Outcome** | Leakage is a transaction cost. As long as the gain outweighs the cost (including the taint), the deal is a win. Progress is messy. | Leakage is corrosive. The taint infects the gain itself. A protected zone bought with blood isn't truly protected; it's just deferred harm. |
  | **Long-term Effect** | Compromise builds muscle. It teaches opponents to negotiate and establishes a baseline for future, better deals. | Compromise builds slippery slopes. It shifts the Overton window, making the next violation easier. It's damage control, not progress. |
  | **Agent Integrity** | The actor remains whole if they believe the trade was necessary. Intent sanitises the hands. | The actor is altered by the act. Once you cross the line, you're the sort of person who crosses lines. Integrity is binary. |

  ***

  ### 3. The Cruxes

  These are the sub-questions where, if we got a definitive answer, one of us would have to concede ground.

  1.  **Degradability:** Does the moral "taint" of a compromise fade over time as the benefits materialise, or does it persist indefinitely?
  2.  **Precedent Weight:** Does a successful compromise make future compromises *easier* (good efficiency) or *more dangerous* (erosion of standards)?
  3.  **Isolation:** Can the negative value be contained to the specific deal, or does it inevitably leak into unrelated areas of the organisation's work?

  ***

  ### 4. Concrete Cases & Predictions

  For each crux, here's a case we both agree is relevant, and what each side reckons it proves.

  **Crux 1: Degradability**
  *   **Case:** **Post-conflict Amnesty Deals.** (e.g., granting immunity to warlords in exchange for ending a civil war).
  *   **Camp 1 Prediction:** The taint fades. Once a generation grows up in peace, the amnesty is viewed as a necessary evil. The net benefit (lives saved) dwarfs the moral cost over time.
  *   **Camp 2 Prediction:** The taint persists. The lack of justice creates a permanent wound in society. The peace is unstable because the moral debt was never paid, only deferred.

  **Crux 2: Precedent Weight**
  *   **Case:** **Political Coalition Building.** (e.g., a Green party joining a government led by a centrist party that supports some fossil fuel projects).
  *   **Camp 1 Prediction:** Efficiency wins. The Greens get policy wins on renewables they couldn't get alone. The compromise proves they are serious players, leading to more influence later.
  *   **Camp 2 Prediction:** Erosion wins. The voters see the betrayal and disengage. The party becomes indistinguishable from the centrists, losing the very value they sought to protect.

  **Crux 3: Isolation**
  *   **Case:** **Medical Triage in Resource Scarcity.** (e.g., doctors agreeing to insurance rules that deny care to some to save the hospital from bankruptcy).
  *   **Camp 1 Prediction:** Containment works. The doctors can compartmentalise. They save the institution to fight another day, keeping their hands clean on individual cases where possible.
  *   **Camp 2 Prediction:** Contamination spreads. The doctors become bureaucrats. The habit of denying care bleeds into their clinical judgment, lowering the standard of care across the board.

  ***

  **Signed,**
  *The Pragmatists & The Purists*
