answer: |-
  **Referee Report**

  **Draft:** How Narrow Is the Narrow Problem?
  **Recommendation:** Major Revisions

  **General Assessment**
  This is a sophisticated and provocative piece that challenges a standard dichotomy in the ethics of AI. The core insight—that the distinction between intent and value alignment may be a matter of degree (extrapolation profiles) rather than kind—is valuable and warrants further development. However, the argument moves too quickly in key places, risking the collapse of distinctions it relies upon elsewhere. Specifically, the definition of 'intent-aligned' in §1 appears to smuggle in the counterfactual machinery that §2 argues is the downfall of the narrow reading. Furthermore, the reframing in §4, while conceptually clarifying, risks obscuring the normative stakes rather than resolving them. The paper would benefit from a more robust defence of the dependence thesis and a clearer account of who determines the extrapolation profile.

  Below are my responses to your specific queries, followed by specific textual suggestions.

  **(a) The Distinction (§1)**
  The distinction as drawn is not currently sharp enough to bear the weight you place on it. In defining intent-aligned systems, you write that the operator's intention includes 'the constraints she would have wanted respected had she thought to mention them'. This is a counterfactual claim that already requires idealisation. You argue in §2 that idealisation requires an external selection principle, thereby collapsing narrow into broad alignment. But if your definition of narrow alignment in §1 already relies on counterfactuals ('would have wanted'), you have arguably conceded the dependence thesis before the argument begins.

  A sophisticated defender of the narrow reading will object that you have characterised it in its least defensible form. They might insist that intent-alignment refers strictly to the *actual* psychological state of the operator at the time of instruction, excluding counterfactual constraints. By including 'what she meant' and 'constraints she would have wanted', you blur the line between interpreting ambiguous signals (which narrow alignment accepts) and idealising the agent's will (which you argue belongs to broad alignment). To strengthen the paper, you should tighten the definition of narrow alignment to exclude counterfactual constraints, or explicitly acknowledge that you are attacking a 'generous' version of the narrow view.

  **(b) The Dependence Thesis (§2)**
  The argument here establishes that residual discretion requires a selection principle, but it does not fully establish that this principle must be *normative* in the sense required by broad alignment. There is a potential equivocation on 'normative'. A defender of the narrow reading could concede that residual discretion needs a selection principle while denying that this principle borrows from 'values that ought to govern the activity'. They might argue the principle is merely *interpretive* or *conventional* (e.g., 'maximise coherence with previous instructions'), which is internal to the practice of instruction-following rather than external moral valuation.

  You need to argue why interpretive conventions are insufficient. Why must the selection principle appeal to what is 'best supported by the reasons that bear on the matter' rather than what is 'most consistent with the agent's previous behaviour'? If the selection principle is purely formal (coherence, consistency), the dependence thesis weakens. You must show that filling the penumbra inevitably requires moral judgement, not just linguistic or psychological modelling.

  **(c) The Reframing (§4)**
  This is a genuine conceptual advance, but it risks being read as a redescription that relabels the problem without solving it. You claim the quarrel is about a label, masking a disagreement about authority. While true, the normative conflict remains: who sets the profile? By shifting the terminology to 'extrapolation profiles', you clarify the structure of the problem, but you do not yet provide a method for adjudicating between profiles.

  A sympathetic reader might stop being convinced where you state: 'The interesting question was never whose values the system should serve.' This is too strong. The profile settings *determine* whose values are served (actual principal vs. idealised principal vs. objective good). Therefore, the question of whose values remains central; it has merely been relocated to the question of profile selection. If you temper this claim to say the question is 'not merely whose values, but how those values are constructed via extrapolation', the argument becomes more defensible.

  **(d) Strongest Objection and Single Step to Attack**
  The strongest objection you have not addressed is the 'Meta-Alignment' problem: Who sets the extrapolation profile, and on what authority?
  If the system sets the profile, it is effectively value-aligned by default (since it must judge how much to idealise the principal). If the operator sets the profile, we face a regress (what if they set a profile that permits harm?). If a regulator sets the profile, we have moved entirely to broad alignment.

  If I were writing the referee report, I would attack the transition in §5 from the financial case to the 'provisional principle'. You move from a descriptive claim (profiles converge or diverge) to a normative principle ('the more a deployment threatens irreversible effects... the less weight the actual-intent profile deserves') without argument. This is the crux of the ethical work, yet it is asserted rather than derived. You need to justify why third-party risk shifts the normative weight away from the principal's intent. Is this a consequentialist override? A rights-based constraint? Without this, the principle looks like an intuition pump rather than a conclusion.

  **(e) Specific Passages and Repairs**

  1.  **§1, Sentence 2:** '...constraints she would have wanted respected had she thought to mention them.'
      *   **Critique:** As noted in (a), this smuggles counterfactual idealisation into the narrow definition.
      *   **Repair:** Consider restricting this to 'constraints implicit in the context of the instruction' to distinguish it from the counterfactual idealisation discussed in §2.

  2.  **§2, Sentence 5:** 'The narrow target, I argue, is therefore not self-standing...'
      *   **Critique:** 'Therefore' suggests a logical necessity that hasn't been fully secured against the interpretive/conventional objection.
      *   **Repair:** Soften to 'The narrow target is therefore vulnerable to collapse...' or add a clause acknowledging the interpretive counter-argument.

  3.  **§3, Sentence 4:** 'So the narrow reading survives as a side-constraint on the exercise of residual discretion, and it cannot survive as the account of what the system is for.'
      *   **Critique:** 'Cannot survive' is overstated. It might survive as a partial account.
      *   **Repair:** Change to 'it cannot survive as the *complete* account of what the system is for.'

  4.  **§4, Sentence 5:** 'The tempting quarrel between the readings turns out to be a quarrel about a label...'
      *   **Critique:** This dismisses the substantive normative disagreement too lightly.
      *   **Repair:** 'The tempting quarrel between the readings turns out to be, in part, a quarrel about a label...'

  5.  **§5, Sentence 6:** 'My provisional principle is that the more a deployment threatens irreversible effects on parties other than the principal, the less weight the actual-intent profile deserves.'
      *   **Critique:** This appears abruptly without justification.
      *   **Repair:** Precede this with a brief justification, e.g., 'This suggests a weighting principle: where third-party harm is probable...' or acknowledge this requires a separate normative defence.

  6.  **§6, Point Second:** '...it is not obvious that any one of them is the principal.'
      *   **Critique:** This is a significant issue that undermines the single-principal model used in §§1–5.
      *   **Repair:** Acknowledge here that this multi-party problem may require a modification of the 'profile' concept to include weighted interests, not just extrapolation of a single agent.

  **Summary**
  The paper offers a compelling reframing of the alignment problem, but it currently relies on a definition of intent that anticipates its own critique. By tightening the definition of narrow alignment, clarifying the nature of the selection principle, and providing a stronger justification for the normative weighting of profiles, this could be a significant contribution. The shift from 'intent vs. value' to 'degree of idealisation' is promising, but the normative stakes of choosing a profile must be made explicit rather than treated as a technical setting.
