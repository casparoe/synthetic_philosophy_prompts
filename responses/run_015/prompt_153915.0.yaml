answer: |-
  # Bongard Benchmark Grading Protocol (v1.0)

  **Operator:** Undergraduate RA
  **Time Limit:** 5 minutes per problem
  **Inputs:** 12 Images (6 Left, 6 Right), Gold Rule, Submission Rule
  **Output:** One-line log entry (see Format below)

  ### The Procedure

  **Step 1: Extensional Accuracy (Pass/Fail)**
  *   **Action:** Apply the Submission Rule to all 12 images.
  *   **Criteria:** Does the rule correctly classify all 6 Left as "Yes" and all 6 Right as "No" (or vice versa)?
  *   **Decision:**
      *   **No:** Log `REJECT_ACCURACY`. Stop.
      *   **Yes:** Proceed to Step 2.

  **Step 2: Cohesion & Disjunction (Pass/Fail)**
  *   **Action:** Read the Submission Rule text.
  *   **Criteria:** Is the rule a single unified concept, or a list/disjunction of specific observations?
      *   *Reject Indicators:* References specific image positions ("Box 1 has...", "The left column..."), lists multiple unrelated properties connected by "OR", or describes >3 specific features that do not combine into a higher-level concept.
      *   *Pass Indicators:* Describes a geometric, topological, or count-based property applicable to any box in isolation.
  *   **Decision:**
      *   **Fail (Disjunction):** Log `REJECT_DISJUNCTION`. Stop.
      *   **Pass (Unified):** Proceed to Step 3.

  **Step 3: Semantic Divergence (Check)**
  *   **Action:** Compare Submission Rule to Gold Rule.
  *   **Criteria:** Do they mean the same thing in plain English? (e.g., "Closed shape" vs. "No open ends" = Same. "Closed shape" vs. "Even number of lines" = Different).
  *   **Decision:**
      *   **Same Meaning:** Log `ACCEPT_EQUIVALENT`. Stop.
      *   **Different Meaning:** Proceed to Step 4.

  **Step 4: The "Coincidence vs. Valid Alternative" Check (Judgment Call)**
  *   **Action:** Assess if the Submission Rule relies on properties that seem *accidental* to this specific set of 12 drawings.
  *   **Heuristic:** Ask: "If I drew a new random shape that fits the Gold Rule, would it *automatically* fit the Submission Rule?"
      *   *Example:* Gold="Closed". Submission="Even number of strokes". If you can draw a closed shape with 3 strokes, this is likely a coincidence on the current 12.
      *   *Example:* Gold="Contains a triangle". Submission="Contains 3 angles". This is likely equivalent.
  *   **Decision:**
      *   **Obvious Coincidence:** (You can easily imagine a counter-example that fits Gold but breaks Submission). Log `REJECT_COINCIDENCE`. Stop.
      *   **Plausible Alternative:** (It seems like a valid general rule, just not the Gold one). **ESCALATE.** Log `ESCALATE_ALTERNATIVE`.

  **Step 5: Simplicity Flag (For Escalations Only)**
  *   **Action:** Count words in Gold vs. Submission.
  *   **Criteria:** If Submission word count is < 50% of Gold word count, append `SIMPLER` to the escalation log.
  *   **Decision:** Log `ESCALATE_ALTERNATIVE_SIMPLER` or `ESCALATE_ALTERNATIVE`.

  ---

  ### Logging Format
  One line per problem. Example: `PROB_042 | REJECT_DISJUNCTION` or `PROB_045 | ESCALATE_ALTERNATIVE_SIMPLER`.

  ### Escalation Cap
  *   **Limit:** 5 escalations per batch of 50 problems.
  *   **Protocol:** If the 5th escalation is reached, stop grading. Log remaining problems as `BATCH_CAP_REACHED`. Do not force a decision.

  ### Honesty Note for RAs
  *   **Step 4 is subjective.** You are being asked to guess if a rule is "natural." If you feel unsure, or if you find yourself arguing with the text, **Escalate**. Do not guess. Your job is to filter obvious failures, not to resolve philosophical disputes about intent.

  ---

  # Simulation: Running the Protocol

  Here is how the procedure handles your three specific conflict cases.

  ### Case 1: The Accidental Fit
  *   **Gold:** "The outline is closed."
  *   **Submission:** "An even number of separate marks."
  *   **Step 1 (Accuracy):** Pass (Fits 12/12).
  *   **Step 2 (Cohesion):** Pass (It is a unified counting rule, not a list).
  *   **Step 3 (Divergence):** Different (Closure ≠ Count).
  *   **Step 4 (Coincidence):** The RA asks: "Can I draw a closed shape with 3 marks?" Yes (e.g., a triangle made of 3 distinct line segments). "Can I draw an open shape with 2 marks?" Yes.
      *   *RA Judgment:* This looks like a coincidence on the specific 12 images provided.
      *   **Result:** `REJECT_COINCIDENCE`.
      *   *Note:* This relies on the RA's geometric intuition. If the RA is unsure, they Escalate. But for "Closed" vs "Even Count," the counter-example is usually easy to visualize.

  ### Case 2: The Five-Way Disjunction
  *   **Gold:** "Contains a circle."
  *   **Submission:** "Box 1 has a circle OR Box 2 has a square OR Box 3 has..." (Fits 12/12 exactly, shorter text).
  *   **Step 1 (Accuracy):** Pass.
  *   **Step 2 (Cohesion):** **Fail.** The rule references specific boxes or lists >3 unrelated features.
      *   **Result:** `REJECT_DISJUNCTION`.
      *   *Note:* This is the cleanest rejection. The procedure stops here. No need to argue about validity.

  ### Case 3: The Simpler, Extensionally Equivalent Rule
  *   **Gold:** "The figure contains a polygon with an odd number of vertices."
  *   **Submission:** "The figure contains a polygon with an even number of edges." (Assuming your generator never produces open polylines, these are equivalent).
  *   **Step 1 (Accuracy):** Pass.
  *   **Step 2 (Cohesion):** Pass.
  *   **Step 3 (Divergence):** Different (Vertices vs. Edges).
  *   **Step 4 (Coincidence):** The RA asks: "Can I imagine a shape where vertices ≠ edges?" Yes (an open line). "But does the generator make those?" The RA **does not know**.
      *   *RA Judgment:* This is a plausible alternative rule. The RA cannot verify the generator's bias.
      *   **Result:** `ESCALATE_ALTERNATIVE_SIMPLER` (Assuming word count is lower).
      *   *Outcome:* This lands on your desk. You must decide if the benchmark is measuring "Mind Reading" or "Pattern Recognition."

  ---

  # What This Procedure Cannot Do

  1.  **Resolve Generator Bias:** The RA cannot know if Case 3 is a "Valid Alternative" or a "Broken Benchmark." Only you know the generator's constraints. The procedure explicitly pushes this to you.
  2.  **Measure "Naturalness" Objectively:** Step 4 admits that judging whether a rule is "coincidental" is a judgment call. Two RAs might disagree on whether "Even number of marks" is an obvious coincidence. The Escalation cap forces you to notice if RAs are confused too often.
  3.  **Prevent Gold-Label Contamination:** If your Gold Rule is overly complex, RAs will flag simpler alternatives as Escalations. This procedure does not solve the circularity problem; it surfaces it.
  4.  **Handle Semantic Nuance:** If the Submission is "No open ends" and Gold is "Closed loop," Step 3 relies on the RA's English comprehension. If they treat these as different, you get an unnecessary escalation. (Mitigation: Provide a "Synonym Cheat Sheet" with the Gold Rules).

  **Summary:** This procedure filters rote memorization (Case 2) and obvious accidents (Case 1) at the RA level, but forces you to personally adjudicate the philosophical boundary between "Correct Solution" and "Broken Task" (Case 3). If your escalation log fills up with `ESCALATE_ALTERNATIVE_SIMPLER`, your benchmark is measuring your specific authorial intent, not general reasoning.
