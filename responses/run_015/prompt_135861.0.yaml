      *   *Inter-textual Corroboration:* Source A and Source B agree. But do they share a common ancestor? If yes, it's not independent. If no, it's stronger. But in antiquity, "independent" texts often share oral traditions or cultural *koine*.
      *   *Narrative Continuity:* The story holds together logically/causally. This is internal coherence, not external verification. A good story isn't necessarily true.
      *   *The Core Tension:* The student is trying to draw a *binary* line (Legend vs. History) using a criterion (NCCC) that reveals a *spectrum* of evidence. The *reductio* arises because the binary doesn't map onto the continuous nature of historical evidence.

  3.  **Diagnosing the Argument:**
      *   *Premise (1):* Defines history/legend boundary via NCCC (Non-Circular Corroboration Condition). This is the crux. It posits a *qualitative* threshold.
