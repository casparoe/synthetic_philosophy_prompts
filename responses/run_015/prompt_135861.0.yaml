      Actually, the strongest philosophical move is to attack the *Ontology* in (1). The distinction isn't in the *events* (Legend vs. History) but in the *warrant*.
      Also, I need to address the "Selective Application" fear. If NCCC applies to Exodus but not Thucydides, is that special pleading? No, if Thucydides *actually meets* the condition better than the Exodus. But does he? Step 6 says no. So I must argue Step 6 is empirically false *or* Step 1 is conceptually wrong.
      Best approach: Step 1 is conceptually wrong (Category Mistake). Step 6 is empirically exaggerating the lack of evidence for Greece/Mesopotamia.

