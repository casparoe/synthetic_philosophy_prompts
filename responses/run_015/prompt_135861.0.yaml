      *   Specific focus on Step (6): It conflates "contemporary administrative record" with "independent evidence." Thucydides is supported by epigraphy (Meiggs-Lewis), archaeology (destruction of Plataea, etc.), and cross-references (Xenophon, inscriptions). It's not *perfectly* independent, but it's not *circular* in the way Arthur is.
