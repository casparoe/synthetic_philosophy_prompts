      *   *The Hidden Assumption:* The assumption is that "Material Independence" is a binary switch (Present/Absent) rather than a matter of degree or probative weight. It also assumes that "Administrative Archiving" is the only source of independence.
      *   *The Flaw:* Step (6) is too strong/monolithic. It ignores numismatics, stratigraphy, paleoclimatology, and cross-cultural synchronisms that *do* provide independence for things like the Peloponnesian War or Hammurabi, even if they aren't "imperial archives" in the modern sense.
      *   *Alternative Flaw:* Step (1) is the deeper philosophical error. It assumes there *is* a sharp ontological boundary between "legend" and "history." Most modern philosophy of history sees this as a spectrum of warrant.

