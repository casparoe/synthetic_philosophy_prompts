  7.  **Final Polish:** Ensure the language matches a PhD seminar context (use terms like "epistemic warrant," "category mistake," "Bayesian updating," "source criticism"). Ensure the distinction between *ontology* (what happened) and *epistemology* (how we know) is clear. The student's argument conflates them.

      *(Self-Correction on "Independence"):* I need to make sure I distinguish between *generation* independence (the artifact wasn't made to support the text) and *interpretive* independence (we don't need the text to understand the artifact). NCCC seems to demand both. That's very high bar.

