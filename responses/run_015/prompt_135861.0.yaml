          *   *Inter-textual Corroboration:* Agreement between texts, but risky due to common sources.
          *   *Narrative Continuity:* Internal coherence, distinct from truth.
      *   *Step-by-Step Analysis:*
          *   (1) is the definitional move. It's stipulative but risky.
          *   (2)-(5) seem historically plausible (Exodus/Arthur = weak evidence; Troy = stronger).
          *   (6) is the weak link empirically. Thucydides + Archaeology + Inscriptions (e.g., tribute lists) *do* offer independence.
          *   (9)-(10) highlight the spectrum problem.
      *   *Diagnosis:* The argument is a valid *reductio ad absurdum* of Premise (1). The student has successfully proven that NCCC is too strict for the ontology of history.
      *   *The "Cost":*
          *   If keeping (1): You must accept (6) is false. You need to show how Thucydides meets NCCC while Exodus doesn't. This requires nuanced archaeology (e.g., destruction layers matching specific campaigns vs. general settlement).
          *   If abandoning (1): You move to a Bayesian/Probabilistic model. History isn't "True/False" or "History/Legend," but "High Warrant/Low Warrant."

  5.  **Refining the Philosophical Position:**
      *   The student is struggling with the *Demarcation Problem* in history (similar to Science vs. Pseudoscience).
