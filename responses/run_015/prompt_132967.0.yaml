  You're an expert philosophy-interview coach and a pro at cutting through jargon. Think step by step: first do a quick brainstorm of the three biggest pressure points on narrative-embedded sunk-cost rationality, then draft the actual questions.

  I'm a science-and-ideas journalist prepping a podcast with Dr. Lena Vasquez — she's defending a niche view she calls narrative-embedded sunk-cost rationality. The idea is that honoring sunk costs isn't always irrational, because when a decision is embedded in a long-running practical narrative — like staying in a career, maintaining a public work, or keeping a commitment — cutting losses can violate diachronic consistency in a way one-off expected-utility calculus misses. It's not just "throwing good money after bad," she argues, but preserving coherence across the time-slices of a practical agent.

  I want eight to ten interview questions that don't just let her restate this. I need at least one pressing how she distinguishes her view from standard commitment-device theories in decision theory; one on the objection that she's really smuggling in identity-based loyalty and calling it rationality; and one on whether collective sunk costs — say, a city keeping a failing transit line alive — can be rational on her account even when no single person holds the narrative together. For each, include a sharp folow-up keyed to the answer she's most likely to give. Don't ask for a bibliography or reading list — this is live audio, not a syllabus. Keep it casual, I'm writing in a rush and there's probably a typo or two in my notes, but make sure the questions hit the actual philosophy, not generic "what drew you to this?" fluff. Start with the brainstorm, then list the questions with the follow-ups marked clearly.
