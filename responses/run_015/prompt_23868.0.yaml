answer: |-
  **Project Title:** The Ethical Irrelevance of the Paranormal: Sidgwick's Category Error in the Society for Psychical Research

  **Project Summary**
  In the Concluding Chapter of *The Methods of Ethics*, Henry Sidgwick identifies the "dualism of practical reason" as the fundamental contradiction between rational egoism and utilitarian morality. He argues this dualism can only be resolved if the universe is under a moral government that guarantees the ultimate coincidence of virtue and self-interest. To secure this premise, Sidgwick devoted his later years to the Society for Psychical Research (SPR), seeking empirical evidence of survival and telepathy. Standard scholarship treats this turn either as a continuation of his empiricist rigor or as a biographical episode distinct from his philosophical system. This project argues that both approaches overlook a fatal structural flaw: even if successful, the SPR's findings could establish post-mortem survival, but survival does not entail moral justice. This project will demonstrate that Sidgwick's psychical research was logically incapable of resolving the ethical dualism it was designed to fix, rendering the enterprise a category error rather than a scientific extension of his ethics.

  **The Research Question**
  The project centers on a determinate logical question: Does empirical evidence of post-mortem survival or telepathic communication logically entail the existence of a moral government of the universe sufficient to resolve the dualism of practical reason?

  The answer required by Sidgwick's ethical system is "yes." The answer dictated by the logical structure of the evidence is "no." This project will rigorously test whether Sidgwick possessed, or could have constructed, a bridge argument connecting metaphysical survival to ethical retribution.

  **Historiographical Context and Intervention**
  Current scholarship generally bifurcates regarding Sidgwick's involvement with the SPR. One camp, emphasizing intellectual continuity, portrays the SPR as a natural application of Sidgwick's broad empiricism. These readings suggest Sidgwick treated ethical axioms as hypotheses to be tested by the widest available data, including the paranormal. A second camp treats the SPR involvement as a biographical anomaly—a psychological crisis or a lapse in judgment separate from the cold logic of *The Methods*.

  Both readings fail to address the specific entailment gap between the *data* sought (survival) and the *premise* needed (moral government). The continuity reading assumes the data would speak for itself ethically, ignoring that ghosts can be miserable and telepaths can be evil. The biographical reading dismisses the connection entirely, missing that Sidgwick explicitly intended the research to underwrite his ethical system. By focusing on the logical relation between the evidence and the ethical requirement, this project moves beyond the continuity/biography dichotomy to expose a structural impossibility in Sidgwick's late project.

  **Methodology and Work Plan**
  The three-month fellowship will be dedicated to textual exegesis and logical reconstruction, culminating in a draft article of approximately 8,000 words.

  *Month 1: Textual Reconstruction.* I will collate Sidgwick's statements on the dualism of practical reason from the various editions of *The Methods of Ethics* with his presidential addresses and private correspondence regarding the SPR. The goal is to map the exact dependency: what specific type of psychical evidence did Sidgwick believe would validate the moral government postulate? I will isolate whether he conflated the *possibility* of retribution (requiring survival) with the *certainty* of retribution (requiring moral governance).

  *Month 2: Logical Analysis.* I will construct the entailment argument. I will analyze whether survival data, even if verified, necessitates a benevolent cosmic order. This involves distinguishing between metaphysical claims (the soul persists) and axiological claims (the universe is just). I will test Sidgwick's potential counter-arguments: did he rely on a hidden theological premise that psychical research was merely meant to trigger? I will also examine contemporary critiques from within the SPR to see if this objection was raised during his lifetime.

  *Month 3: Drafting and Refinement.* I will synthesize the textual and logical analysis into a cohesive argument. The draft will argue that the gap is fatal. I will refine the distinction between "scientific theology" and "ethical necessity," ensuring the conclusion addresses the implications for Sidgwick's overall legacy. The final weeks will be dedicated to peer review simulation and polishing the prose for submission to a leading journal in history of philosophy.

  **Position Statement**
  I take the position that the gap is genuine and fatal. Sidgwick sought to solve an axiological problem (how reason demands justice) with a metaphysical solution (proof of survival). However, an afterlife without guaranteed reward and punishment leaves the dualism intact; a rational egoist could still reasonably choose vice in a surviving afterlife if it offered greater personal happiness. Sidgwick had no logical resources to close this gap because empirical methods, even psychical ones, cannot derive an "ought" of cosmic justice from an "is" of paranormal phenomena. His project was not just unsuccessful in fact; it was unsuccessful in principle.

  **Criteria for Project Failure**
  Intellectual honesty requires defining what would constitute failure for this specific thesis. The project would fail if I uncover textual evidence demonstrating that Sidgwick explicitly distinguished between survival and moral government, and posited a separate, non-empirical rational warrant for the latter, using psychical research solely to remove the obstacle of materialism. If Sidgwick viewed the SPR work merely as clearing the ground for a faith-based assumption rather than proving the moral government itself, my claim of a "category error" would be overstated. Additionally, if I find that Sidgwick's definition of "moral government" was thin enough to be satisfied by mere survival (e.g., if existence itself is the reward), the logical gap I propose would collapse. Should either of these emerge in Month 1, I will pivot the article to analyze why Sidgwick believed the distinction was negligible, rather than arguing he missed it entirely.
