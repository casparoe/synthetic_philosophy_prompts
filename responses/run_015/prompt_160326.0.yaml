answer: |-
  Here is the brainstorming phase you requested, working through the candidate concepts before settling on a verdict.

  **Brainstorming Candidate Concepts**

  The first candidate concept is the **Best System Account (BSA)** of laws, associated with David Lewis. On this view, laws are the axioms of the deductive system that best balances simplicity and strength in summarizing the universe's history. This captures your observation that status depends on "what else is on the table." If Newtonian mechanics is the system in play, Kepler's regularities are theorems, not axioms. If the system is merely descriptive astronomy, Kepler's regularities *are* the axioms. The BSA captures the idea that lawhood is relational to a system. However, this strains against your description in a crucial way: the BSA aims for *the* Best System of the world, an objective fact. You are describing a status that flips depending on the *chapter* or the *researcher's intent*. The BSA suggests there is one true answer (Kepler's laws are derivative, fundamentally), whereas your scientists seem to treat them as laws *simpliciter* in one context and not in another without feeling contradictory.

  The second candidate is the distinction between **Fundamental and Derivative Laws**. Many metaphysicians (particularly Armstrong or Dretske) allow that there is a hierarchy. Fundamental laws govern the basic constituents of reality; derivative laws govern higher-level patterns that flow from the fundamental ones. This captures the "movement" you see: as theory deepens, a regularity moves from the "fundamental" bucket to the "derivative" bucket. The strain here is modal: usually, derivative laws are still considered *laws*, just less fundamental. Yet your planetary scientist explicitly denied coplanarity was a law, and geneticists deny the code is a law, calling them "accidents" or "contingencies." If they were merely derivative laws, they should still support counterfactuals robustly. But the scientists seem to suggest these regularities *could have been otherwise* in a way that gravity could not. This suggests the shift isn't just hierarchy; it's about contingency versus necessity.

  The third candidate is **Invariance under Intervention**, associated with James Woodward. This view suggests laws are generalizations that remain stable when we wiggle the variables. This fits your note about what researchers "lean on counterfactually." A law holds under interventions; an accident does not. The strain is that the genetic code *does* hold under interventions within terrestrial biology (you can edit a gene, and the code holds). The scientists deny it lawhood not because it fails locally, but because the *mechanism that established it* (evolutionary history) was contingent. This suggests the feature doing the work isn't just current stability, but the *origin story* of the regularity. Invariance theory struggles to explain why a regularity that is currently invariant is demoted because of its historical origin.

  **The Verdict**

  I am confident that the phenomenon you have identified is real and significant, but I am equally confident that your description conflates two distinct categories: **Laws of Nature** (ontic features of the world) and **Law Statements** (epistemic tools used by scientists). The "movement" you see is not the regularity itself changing its metaphysical status; it is the *role* that statement plays in a specific scientific model changing.

  The feature doing the work here is **Explanatory Independence within a Model**. When a regularity is treated as a "law," it is being used as a premise that explains other things without itself needing explanation in that context. When it is treated as an "accident" or "consequence," it is being treated as a conclusion that requires explanation by something else.

  It is precisely *not* **Modal Strength** or **Universality**. As you noted, the evidence and scope are identical in both cases. The genetic code is universal for Earth life regardless of whether we call it a law. The shift is not about how firmly the regularity holds, but about whether the scientist is willing to ask "Why?" of it. If the answer is "That's just how the system is set up," it functions as a law. If the answer is "Because of this deeper mechanism," it functions as a fact.

  Because existing terminology blurs the line between the metaphysical status and the functional role, I am going to coin a term to help you isolate this. I call this **Contextual Axiomaticity**.

  *Assumptions built into this term:*
  1.  **Functionalism:** It assumes "law" is a job description, not an intrinsic property. A statement is a law if it performs the job of an axiom.
  2.  **Model-Relativity:** It assumes scientific practice happens inside specific models (e.g., "The Astronomy Model" vs. "The Particle Physics Model"), and a statement can be axiomatic in one and derivative in another.
  3.  **Epistemic Priority:** It assumes the distinction tracks our explanatory priorities, not necessarily the furniture of the universe.

  **Implications for the Metaphysical Debate**

  You asked whether this is a problem for Humeans (laws summarize) or Anti-Humeans (laws make things happen).

  *   **For the Humean (Best System):** This is manageable but requires a tweak. Standard Humeanism seeks *the* single Best System of the universe. Your observation suggests scientists work with *many* nested systems. A Humean must admit that "Law" is ambiguous between "Axiom of the Global Best System" (Fundamental Physics) and "Axiom of the Local Best System" (Biology/Astronomy). If they accept this, your phenomenon is just the friction between local and global systematization.
  *   **For the Anti-Humean (Necessitation):** This is harder. If laws are relations of necessitation between universals (e.g., Mass *necessitates* Attraction), that relation either holds or it doesn't. It shouldn't depend on whether we are in chapter 1 or chapter 5 of a textbook. To accommodate your observation, the Anti-Humean must posit a rigid hierarchy: Fundamental Laws (true necessitation) vs. Derivative Regularities (no necessitation, just flow-on effects). They must bite the bullet and say the planetary scientist is right: coplanarity is *not* a law, it is a mere regularity, even if it is perfectly stable. This creates a disconnect between scientific practice (calling Kepler's laws "laws") and metaphysical reality (they aren't).

  **Boundary Cases**

  To ensure you don't overextend this concept, here is how to distinguish **Contextual Axiomaticity** from look-alikes:

  1.  **Instance of the Phenomenon:** *Snell's Law of Refraction.* In an optics textbook, it is presented as a law: light *bends* according to this ratio. In a quantum electrodynamics context, it is a statistical consequence of photons taking paths of least time. The regularity doesn't change; its status as a starting point vs. an endpoint does. This is Contextual Axiomaticity.
  2.  **Merely a Hedged Generalization:** *"All matchsticks in this box light when struck."* This looks like a regularity that might get promoted. But it is not. It fails the counterfactual test (if I struck a match from a different box, it might not hold). This is an **Accidental Generalization**, not a demoted law. The difference is that Snell's Law *would* hold in nearby possible worlds (counterfactually robust); the matchstick claim does not.
  3.  **Merely a Mathematical Truth:** *$F=ma$.* Sometimes this is a law (force causes acceleration); sometimes it is a definition (force is *defined* as mass times acceleration). This looks like your phenomenon, but it is distinct. This is **Conceptual Stipulation**. When it's a definition, it's true by fiat. When it's a law, it's an empirical claim. Your phenomenon involves empirical claims that stay empirical but shift explanatory rank.
  4.  **Pattern due to Lack of Intervention:** *"No human has ever run a 2-minute mile."* This is a regularity with no exceptions so far. It is not a law, nor is it a derived consequence. It is a **Contingent Constraint**. It differs from your cases because scientists do not expect it to hold in other galaxies or future centuries, whereas they *do* expect the genetic code to hold for any Earth life, past or future.

  **Direct Challenge to Your Description**

  You asked me to tell you directly if your description is confused. Here is the hard truth: You are observing **Theory Change** and mistaking it for **Lawhood Instability**.

  When a regularity moves from "Law" to "Consequence," the scientific *theory* has changed, not the status of the regularity in the abstract. Kepler's Laws were *always* consequences of Newtonian mechanics; before Newton, we didn't know that. The "movement" is in our map, not the territory.

  However, there is a deeper confusion you might be running together. You mention the genetic code (contingent, historical) and Kepler's Laws (necessary, given gravity). These are different beasts.
  *   **Kepler's Laws:** These are *derivative nomological truths*. They flow from deeper laws. They are "laws" in a loose sense, "theorems" in a strict sense.
  *   **The Genetic Code:** This is a *frozen accident*. It is not a law of nature; it is a boundary condition of Earth's biosphere.

  If you treat these as the same phenomenon, you are conflating **Derivation** (Kepler) with **Contingency** (Genetic Code).
  *   Kepler's regularities *could not be otherwise* given the mass of the sun and the laws of gravity.
  *   The Genetic Code *could have been otherwise* even given all the laws of physics and chemistry.

  Scientists deny the Genetic Code is a law because it lacks **Nomological Necessity**. They deny Planetary Coplanarity is a law because it lacks **Explanatory Independence**. These are two different reasons for demotion.

  **Conclusion**

  The feature doing the work is **Explanatory Independence** (for Kepler) and **Nomological Necessity** (for the Genetic Code). You have run these two together under the banner of "status movement."

  If you want a single concept for your article, stick with **Contextual Axiomaticity**, but be precise: it applies to cases like Kepler, where a truth is stable but derivable. Do not apply it to the Genetic Code. The Code isn't a law that got demoted; it was never a law candidate. It is a **Historical Boundary Condition**.

  Distinguishing these will make your piece sharper. The "movement" you see in physics (Kepler) is about depth of explanation. The "stasis" you see in biology (Code) is about the difference between physical necessity and historical chance. Conflating them risks suggesting all scientific laws are just temporary guesses, which isn't what the physicists are telling you. They are telling you some regularities are bedrock, and some are just the shape of the bedrock in this particular valley.
