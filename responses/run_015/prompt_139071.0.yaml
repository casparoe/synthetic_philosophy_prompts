answer: |-
  Five candidate concepts or labels:

  1.  Evidential Decision Theory (EDT)
  2.  Evidential Cooperation in Large Worlds (ECL)
  3.  Superrationality
  4.  The Smoking Lesion Problem
  5.  Causal Decision Theory (CDT)

  ### The Arithmetic

  Your arithmetic is substantially correct, subject to a standard technical caveat regarding the definition of correlation versus probability shift.

  You treat a correlation coefficient ($\rho$) of 0.001 as equivalent to a 0.001 shift in the conditional probability that another agent contributes given that you do. Strictly speaking, correlation is standardized covariance. For binary variables (contribute/not), the shift in conditional probability equals the correlation coefficient only if the base rate of contribution is 50%. If the base rate is very low or very high, the probability shift for a given $\rho$ is actually larger. Thus, your calculation is conservative; if the base rate is not 0.5, the evidential benefit accumulates even faster.

  The scaling law you identified is the crucial insight: the total expected evidential impact scales linearly with the population size $N$.
  $$ \text{Total Evidential Benefit} \approx N \times \rho \times \text{Payoff per Other} $$
  $$ \text{Net Value} = (N \times 0.001 \times 0.01) - 1 $$
  Break-even occurs at $N = 100,000$. At $N = 1,000,000$, the benefit is 10 units against a cost of 1. The arithmetic holds. The verdict does flip purely on population size, holding correlation and payoffs fixed.

  ### The Best Fit

  The concept you are reaching for has an established name: **Evidential Cooperation in Large Worlds (ECL)**.

  Your friend was correct. However, your hesitation regarding the term "cooperation" (Feature 5) is astute. The label is historically derived from its application to large-scale Prisoner's Dilemmas, but the underlying mechanism is broader. It is not limited to cooperative games; it applies to any decision where your act is statistically correlated with the acts of a large number of others, regardless of whether those acts are "cooperating" or merely similar behaviors (like smoking).

  Here is why the other candidates do not fit the carving you require:

  1.  **Evidential Decision Theory (EDT):** This is the *framework*, not the specific phenomenon. EDT is the engine that calculates expected utility using conditional probabilities. Your case is a specific *application* of EDT where the population size ($N$) becomes a decisive variable. Saying this is "just EDT" is like calling a specific type of engine failure "just mechanics." It misses the structural dependency on $N$ that you isolated.
  2.  **Superrationality:** You correctly ruled this out (Feature 1). Superrationality (associated with Hofstadter) relies on *logical* correlation: I contribute because I know that any agent reasoning exactly as I do must reach the same conclusion. It treats the other agents as mirrors of your own algorithm. Your case relies on *statistical* correlation caused by a common background factor (the newspaper). Superrationality does not require a common cause; ECL does. Superrationality works for $N=2$; your argument requires large $N$.
  3.  **The Smoking Lesion Problem:** This is the closest neighbour, but it differs in dimensionality (Feature 5). The Smoking Lesion is typically a one-agent problem (or an agent vs. nature). It illustrates the flaw of EDT when correlation is spurious. Your case generalizes this to an $N$-agent structure where the "lesion" is replaced by inter-agent correlation. The Smoking Lesion warns against EDT; ECL attempts to salvage a normative recommendation from it in large populations.
  4.  **Causal Decision Theory (CDT):** This is the opposing view. CDT insists that because your act is causally inert regarding others' payoffs, you should not contribute. CDT is the label for the verdict your friend defended, not the argument you were constructing.

  ### The Carving

  You asked for the carving, not just the label. The conceptual boundary of Evidential Cooperation in Large Worlds is defined by the tension between **causal inefficacy** and **aggregated evidential import**.

  It carves out a space where an agent maximizes expected utility not by changing the world causally, but by selecting the act that is *good news* about the state of the world, where the "state of the world" includes the actions of others. The distinctiveness of this carving lies in the **linearity of aggregation**. In small worlds, negligible correlations are rightly ignored because the evidential shift is smaller than the cost. In large worlds, the summation of negligible shifts becomes decisive.

  This carving is distinct because it survives the removal of logical identity (unlike Superrationality) and survives the removal of causal power (unlike standard instrumental reasoning). It relies entirely on the *volume* of the correlation field.

  ### Boundary Cases

  To test the robustness of this carving, we must examine the boundary conditions you requested.

  **1. The correlation is exactly zero.**
  The argument collapses immediately. The expected benefit is zero. The verdict reverts to the Causal Decision Theory recommendation (do not contribute). This confirms that the phenomenon is purely evidential.

  **2. The correlation is negative.**
  If your contributing makes it *less* likely others contribute (perhaps you are all competing for a scarce resource, or there is a contrarian correlation), the arithmetic flips. If $N$ is large enough, the negative evidential impact outweighs the cost. You should *not* contribute, not because it costs you, but because your contributing is bad news about the total pool of benefits. The theory handles this symmetrically.

  **3. The correlation is produced by a common cause I have already conditioned on.**
  This is the most dangerous boundary (Feature 4). If the correlation arises solely because everyone read the newspaper, and you *know* you read the newspaper, standard probability theory suggests you should "screen off" the correlation. Once you condition on "I read the newspaper," your decision should provide no additional information about whether others read it, and thus no information about whether they contribute.
  *   *The Carving's Limit:* If the common cause is fully observed and conditioned upon, the correlation $\rho$ drops to zero, and the argument fails. For ECL to work, there must be *residual* correlation unexplained by the observed common causes. This implies that either you do not know for certain that you read the newspaper (uncertainty about your own state), or there are further unobserved common causes. This is the **Reference Class Problem**. The argument only holds if you define the population as "people relevantly similar to me" in a way that preserves the correlation after conditioning on your own act.

  **4. A population gerrymandered to include people whose acts do not affect me.**
  If you include agents in $N$ whose contributions do not put money in your pocket, the arithmetic breaks. The benefit term sums only over those whose acts affect your payoff. However, if their acts are correlated with yours, they still contribute to the *evidence* that you are the "type" who contributes. But since they pay you nothing, they add to the "cost" side of the evidential balance (if there were a cost to them contributing) or simply dilute the correlation.
  *   *The Carving's Limit:* The population $N$ must be restricted to **beneficiaries**. If you count bystanders, you inflate $N$ without inflating the payoff, potentially leading to a false positive. The theory requires that the correlated agents are also the sources of the payoff.

  **5. The case in which I already know with certainty what I am going to do.**
  If you know with certainty what you will do, there is no decision problem. You cannot condition on an act you are not free to vary. In decision theory, this is the problem of **logical omniscience**. If you know you will contribute, $P(\text{Contribute}) = 1$. The conditional probability $P(\text{Others} | \text{Me})$ becomes identical to the unconditional probability. The evidential leverage vanishes. The argument requires that you treat your decision as a variable about which you are uncertain, even if you are determined.

  ### Real Phenomenon or Confusion?

  Is this a real phenomenon, or have you confused "is evidence of" with "makes more likely by an amount worth caring about"?

  It is a **real phenomenon within the framework of Evidential Decision Theory**, but it is **ontologically fragile**.

  You have not confused the arithmetic. The aggregation of weak correlations is mathematically valid. If the world is structured such that your acts are statistically linked to a million others, and you value the aggregate outcome, EDT *requires* you to act on that link.

  However, the "confusion" lies in **Feature 4: the individuation of the population**. The verdict is hypersensitive to how you define the reference class.
  *   If you define the class as "everyone in the universe," $N$ is huge, and you should contribute.
  *   If you define the class as "everyone who read this specific sentence," $N$ is small, and you should not.
  *   If you define the class as "everyone causally disconnected from me," $\rho$ is zero.

  Because there is no non-arbitrary stopping point for the reference class, the recommendation is unstable. A Causal Decision Theorist would argue this instability proves the reasoning is flawed: rational recommendations should not depend on how you carve up the population of strangers. An Evidential Decision Theorist must accept that rationality is relative to the information partition you employ.

  **Conclusion:**
  The name is **Evidential Cooperation in Large Worlds**. It is distinct from Superrationality because it relies on statistical correlation rather than logical identity. It is distinct from the Smoking Lesion because it relies on aggregation over $N$ rather than a single lesion. The argument goes through mathematically, provided the correlation is not screened off by known common causes. However, the reliance on an arbitrarily defined population ($N$) makes it philosophically vulnerable. It is a real consequence of evidential reasoning, but whether it is a *correct* guide to action depends on whether you accept that "good news" is a valid substitute for "causal power" in large populations.
