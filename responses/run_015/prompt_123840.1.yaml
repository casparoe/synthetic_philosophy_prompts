answer: |-
  **Essay Question**

  **Scenario:** Consider the isolated island of *Nova Hibernia*. It has fertile land and able workers, but both lie idle because the inhabitants lack silver coin. The government proposes a "Land Bank": it will print paper notes to pay workers to farm the land, redeemable not for silver, but for a share of the future harvest.

  **(a)** Using Berkeley's account of money as a "ticket" or "counter," explain why the *Nova Hibernia* government is correct to claim that their notes create wealth rather than merely representing it. (25%)

  **(b)** If money is merely a ticket to command industry, and industry is currently idle, what prevents the government from printing infinite notes? Identify the specific constraint Berkeley must posit to avoid devaluing the currency, distinguishing between claims on *existing* stock versus *future* flow. (35%)

  **(c)** Berkeley argues that denying gold's intrinsic value parallels his denial of mind-independent matter: in both cases, we mistake a relational utility for a substantial essence. Does this metaphysical parallel strengthen his monetary theory (by freeing it from metal) or weaken it (by making value too dependent on perception)? Take a stand. (40%)

  ***

  **Model Answer**

  Berkeley's monetary theory represents a radical shift from the mercantilist view that wealth consists in the accumulation of precious metals. For Berkeley, gold and silver are not wealth themselves but merely instruments to facilitate it. In the case of *Nova Hibernia*, the government's proposal aligns perfectly with Berkeley's "ticket" theory. The island's true wealth is not the silver it lacks, but the potential industry of its workers and the fertility of its soil. Money functions as a token or counter that entitles the holder to a share of this national industry. By issuing paper notes to pay workers, the government is not creating debt in a negative sense, but rather activating a dormant resource. The notes are a claim on the future harvest, and by putting them into circulation, the government transforms idle capacity into actual production. Thus, the notes do not represent pre-existing wealth; they are the mechanism by which wealth is called into existence. The value of the ticket is derived entirely from the industry it can command, not from the material it is printed on.

  However, this raises the critical problem of limits. If the tickets create the industry, why not print enough tickets to employ everyone forever? If Berkeley's premises hold, money seems self-validating: issue the ticket, stir the industry, and the ticket is backed by the resulting goods. The constraint Berkeley must posit lies in the distinction between a claim on a static stock versus an incentive for a dynamic flow. A ticket is a right to a proportion of the common stock of goods available for exchange. If the government issues more tickets than the *possible* flow of production can support, the individual ticket's purchasing power diminishes. Even if hands are idle, there is a physical limit to how much the land can yield and how much labor can produce in a given season. If the volume of tickets exceeds the velocity and volume of goods produced, the ticket ceases to function as a reliable claim.

  Furthermore, there is a temporal distinction essential to Berkeley's view that students often miss. The ticket is a claim on *future* industry, but it relies on *present* trust. In *Nova Hibernia*, the notes are redeemable against the harvest. If the government prints notes exceeding the likely harvest, the ticket no longer commands industry; it commands nothing. Therefore, the limit is not the amount of silver in a vault, but the capacity of the nation to produce goods that people actually want and the willingness of the public to accept the ticket as a valid claim. Berkeley implies a moral constraint here: the issuer must have the integrity to ensure the tickets correspond to real productive capacity. Without this, the ticket becomes a false promise, and the "industry" it commands will flee or refuse to work.

  This leads to the metaphysical parallel. Berkeley's immaterialism argues that objects have no existence independent of perception; similarly, his monetary theory argues money has no value independent of its social utility. In both cases, he attacks the notion of "intrinsic" value existing in a substratum (whether material substance or gold). This parallel strengthens his monetary theory by liberating it from the fetishism of bullion. It allows us to see that a paper note can function just as well as a guinea, provided it fulfills the same relational role. It explains why a nation can be "poor" despite having mines of gold: if the gold does not circulate to command industry, it is philosophically and economically inert, like unperceived matter.

  However, this parallel also exposes a fatal vulnerability. In immaterialism, God guarantees the stability of the world when human perceivers look away. In economics, there is no divine guarantor of the ticket's value. If value is purely relational—dependent on the "mind" of the public—then it is subject to the fluctuations of opinion and panic. If the inhabitants of *Nova Hibernia* collectively lose faith in the Land Bank, the value of the notes collapses to zero, regardless of the fertility of the land. Berkeley wants to say value is objective in the sense of being based on real industry, but his own metaphysics suggests value is constitutive of the perception of that industry.

  Therefore, the metaphysical parallel ultimately weakens his practical monetary advice. By reducing value to a relation without a substantial anchor, Berkeley makes money terrifyingly fragile. He solves the problem of scarcity (we don't need silver), but he creates a problem of stability. To close this gap, Berkeley needs a distinction he does not fully develop: the difference between *issuing* power and *acceptance* conditions. He assumes that because the industry *can* exist, the tickets *will* work. But the immaterialist insight reminds us that the economic relation exists only insofar as it is sustained by collective belief.

  In conclusion, Berkeley is right that money is a ticket on industry, not wealth itself. *Nova Hibernia* can indeed create wealth by issuing paper. However, he cannot simply say the tickets are self-validating. The limit is the physical capacity of production combined with the social convention of trust. The immaterialist parallel is insightful in debunking intrinsic value, but it fails to provide the stability mechanism that gold provided by accident. Berkeley frees money from matter, but in doing so, he leaves it floating in the precarious realm of human opinion, requiring a moral discipline he hopes for but cannot guarantee.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Explanation of the "Ticket" Theory (4 marks)**
  *   **Award:** For clearly articulating that money is a claim on industry/production, not wealth itself, and applying this to the *Nova Hibernia* scenario (notes activate idle land/labor).
  *   **Common Error:** Treating Berkeley as a standard mercantilist who thinks money *is* wealth, or failing to use the scenario to illustrate the activation of idle resources.

  **2. Identification of the Inflation/Limit Constraint (4 marks)**
  *   **Award:** For identifying that unlimited printing devalues the claim per ticket. Must distinguish between the *capacity* to produce (flow) and the volume of notes (stock of claims).
  *   **Common Error:** Arguing that Berkeley limits money supply by the amount of land alone, ignoring the ratio of tickets to goods, or claiming Berkeley supports infinite printing.

  **3. Integration of Immaterialism Parallel (4 marks)**
  *   **Award:** For connecting the denial of intrinsic value in gold to the denial of mind-independent substance. Must explain how this liberates money from metal.
  *   **Common Error:** Writing two separate mini-essays (one on money, one on metaphysics) without showing how the metaphysical view underpins the monetary view.

  **4. Conceptual Distinctions (Trust/Time/Flow) (4 marks)**
  *   **Award:** For supplying a missing distinction to resolve the tension (e.g., Past vs. Future industry, Issuing power vs. Public Acceptance, or the lack of a "Divine Guarantor" in economics).
  *   **Common Error:** Assuming Berkeley has a complete theory of inflation, or failing to notice that the "relational" nature of value makes it vulnerable to panic.

  **5. Critical Evaluation/Stance (4 marks)**
  *   **Award:** For taking a clear stand on whether the metaphysical parallel helps or hurts Berkeley (e.g., "It explains value but undermines stability").
  *   **Common Error:** Remaining neutral or concluding that Berkeley is "mostly right" without addressing the specific instability introduced by his relational view of value.
