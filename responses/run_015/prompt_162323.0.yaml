  (3) The big choices we face — how to handle the far future, population stuff, wild-animal suffering — mostly don't change how existing creatures fare, they change which creatures come to exist. Pick a different policy and you get different creatures, not the same creatures doing better or worse.

  (4) So compare policy A (a lovely future) and policy B (a future crammed with misery). The miserable creatures in B wouldn't have existed under A, so by (2) their misery counts for nothing in the comparison; and the contented creatures in A wouldn't exist under B, but their happiness never counted anyway by (1). So A and B come out exactly equal.

  (5) And it generalises: for basically any pair of big policies, neither one is better. So the view I got into this for has nothing to say about the one thing it seemed most useful for.

  (6) But you're obviously not allowed to just pick B.

