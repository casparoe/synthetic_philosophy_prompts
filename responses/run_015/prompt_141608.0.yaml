      *   *Precedent (Case):* Past historical events (Munich, Vietnam, Peloponnesian War).
      *   *Holding:* The outcome of the past event (War happened, Appeasement failed).
      *   *Ratio Decidendi:* The causal lesson derived (Aggression must be met with force; Rising powers threaten established ones).
      *   *Adversarial Brief:* Policy memos, intelligence assessments, op-eds (Pro/Con war).
      *   *Distinguishing:* Arguing why the current situation differs from the historical precedent (e.g., "Putin is not Hitler," "Nuclear weapons change the calculus").
      *   *Appeal/Overruling:* Elections, regime change, or historical revisionism (re-evaluating the lesson of Vietnam).
      *   *Doctrine/Relevance:* International Relations theory (Realism, Liberalism) or strategic culture.

  3.  **Evaluate the Disanalogies (The "Audit"):**

      *   *User's List:*
          1.  Relevance of features (Law: fixed by doctrine; Policy: contested).
          2.  Adversary (Law: paid professional; Policy: inclined actor).
          3.  Reflexivity (Law: facts static; Policy: analogy affects the outcome).
          4.  Correctability (Law: appealable; Policy: irreversible consequences).
          5.  Case Selection (Law: bounded corpus; Policy: salience/winner's bias).
      *   *Assessment:*
          *   *Relevance:* Damaging. In law, *stare decisis* constrains what counts. In policy, theories compete (Realism vs. Constructivism), so the "rules of relevance" are the subject of the debate, not the framework for it.
          *   *Adversary:* Damaging. In law, the system *forces* distinction. In policy, groupthink often suppresses it.
          *   *Reflexivity:* Damaging. Self-fulfilling prophecies (Thucydides Trap) make the "prediction" part of the cause. Legal precedents don't usually change the facts of the new case just by being cited.
          *   *Correctability:* Damaging. War dead don't come back. Legal errors are corrected prospectively; policy errors are often catastrophic retrospectively.
          *   *Case Selection:* Damaging. The "reporter" of history is biased by survival and narrative.

  4.  **Evaluate the Friend's Conclusion (Base Rate vs. Mechanism):**

      *   Friend claims analogy sets a *default* (base rate) + burden of proof.
