      *   **Friend's Argument:** Historical reasoning is like common-law reasoning (reasoning by precedent). It involves likeness-judgments answerable to reasons. There's a presumption of similarity (like cases decided alike), placing the burden of proof on those claiming "this time is different." Institutional machinery in law handles pathologies (small sample size, bias), implying foreign policy *could* or *should* have similar machinery.
      *   **User's Argument:** Historical analogies are rhetorically powerful but evidentially worthless because likenesses/differences are cherry-picked without constraint.
      *   **Task:** Audit the analogy explicitly.
