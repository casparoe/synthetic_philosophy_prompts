answer: |-
  This is a sophisticated dispute that cuts to the bone of how we reason under uncertainty. Your friend's move to equate historical analogy with common-law reasoning is the strongest possible defense of the practice, because it concedes your point (there is no covering law) while denying your conclusion (therefore it is unconstrained).

  Below is the audit you requested, structured for your seminar write-up. It maps the correspondence, evaluates the disanalogies, assesses the competing conclusions about base rates versus mechanisms, and finally addresses the institutional question.

  ### I. The Mapping: Legal Concepts vs. Foreign Policy Analogies

  To audit the analogy, we must first accept your friend's premise: that foreign policy decision-making functions as a common-law system where history provides the case law.

  | Legal Concept | Function in Common Law | Foreign Policy Equivalent | Function in Policy Argument |
  | :--- | :--- | :--- | :--- |
  | **The Court** | Adjudicates the dispute; binds the parties. | **The Decider** (President/NSC/Public). | Decides the action; bears the consequence. |
  | **The Precedent** | A prior case with a binding holding. | **The Historical Analogy** (Munich, Vietnam, 1914). | Provides the narrative template for the current crisis. |
  | **The Holding** | The specific outcome of the prior case. | **The Historical Outcome** (War occurred; Appeasement failed). | Establishes the feared or desired end-state. |
  | **Ratio Decidendi** | The legal principle necessary to the holding. | **The Strategic Lesson** ("Aggression must be met with force"). | The causal rule extracted from history to apply now. |
  | **The Brief** | Argument applying precedent to current facts. | **The Policy Memo / Intelligence Assessment.** | Argues for the applicability of the historical lesson. |
  | **Distinguishing** | Arguing facts differ enough to void precedent. | **Contextualization** ("Nuclear weapons change the calculus"). | Argues why the historical lesson does *not* apply. |
  | **Doctrine** | Rules determining which facts are relevant. | **IR Theory / Strategic Culture** (Realism, Liberalism). | Filters which historical features count as signal vs. noise. |
  | **Appeal / Overruling** | Higher court corrects error or changes doctrine. | **Elections / Historical Revisionism.** | Retrospective judgment; regime change; new historiography. |

  ### II. The Audit: Disanalogies

  You provided a strong candidate list of disanalogies. To determine if your friend's argument survives, we must separate those that are merely **colorful** (differences in degree or texture) from those that are **fatal** (differences in kind that break the logic of the analogy).

  #### 1. The Doctrine of Relevance (Fatal)
  *   **Law:** Relevance is constrained by *stare decisis* and procedural rules. A judge cannot decide a contract case based on the defendant's astrological sign because doctrine forbids it.
  *   **Policy:** There is no supreme court of international relations. Realists, Liberals, and Constructivism disagree fundamentally on what features are relevant (e.g., is regime type relevant? Is trade interdependence relevant?).
  *   **Verdict:** **Fatal.** Your friend argues the burden of proof lies on the distinguisher. But without an agreed-upon doctrine to determine *which* distinctions are legally (or strategically) material, the burden of proof is meaningless. If I claim "nuclear weapons distinguish this from 1939," and you claim "human nature makes that irrelevant," there is no meta-rule to settle the dispute. In law, the meta-rule exists.

  #### 2. The Adversarial System (Fatal)
  *   **Law:** The system *institutionalizes* the search for distinctions. The opposing counsel is paid to find the difference; the judge is neutral.
  *   **Policy:** The "adversary" is often a rival state, not a participant in the decision process. The internal "distinguishing" is done by subordinates who may fear contradicting the Decider (groupthink).
  *   **Verdict:** **Fatal.** The common-law system relies on a *structured* conflict to polish the truth. Policy often suffers from *unstructured* conflict (bureaucratic turf wars) or no conflict at all (echo chambers). The "machinery" your friend cites exists in law to *force* the distinction; in policy, the machinery often suppresses it.

  #### 3. Reflexivity (Fatal)
  *   **Law:** Citing a precedent does not usually alter the facts of the current case.
  *   **Policy:** Invoking an analogy is a speech act that alters the environment. If the US invokes the "Thucydides Trap," China may act more defensively, making war *more* likely. If they invoke "Munich," they may refuse negotiations, making war *more* likely.
  *   **Verdict:** **Fatal.** This is the "performativity" problem. A legal precedent describes a static past to rule on a static present. A historical analogy in policy intervenes in a dynamic system. The analogy becomes a variable in the equation it claims to solve.

  #### 4. Correctability (Serious)
  *   **Law:** Errors are corrected prospectively. A bad ruling can be overturned; damages can be awarded.
  *   **Policy:** Errors are often catastrophic and irreversible. You cannot "appeal" a nuclear exchange or a lost generation of soldiers.
  *   **Verdict:** **Serious.** Your friend's burden-shifting argument assumes errors are symmetric and reversible. If the cost of a "false positive" (acting on a bad analogy) is existential, the presumption of similarity is too dangerous, regardless of the logical burden of proof.

  #### 5. Case Selection (Serious)
  *   **Law:** The corpus is bounded (reported cases).
  *   **Policy:** The corpus is curated by salience and survivorship bias. We remember the wars, not the crises that were peacefully resolved but looked identical beforehand.
  *   **Verdict:** **Serious.** This undermines the statistical validity of the "base rate." If the "case reporter" only publishes convictions, you cannot calculate the rate of innocence.

  ### III. The Conclusion: Base Rate vs. Mechanism

  You suspect your friend is conflating two claims:
  1.  **Base Rate:** History provides a prior probability (e.g., "Rising powers usually fight").
  2.  **Mechanism:** History provides a causal checklist (e.g., "Check for security dilemmas").

  **Your suspicion is correct.** The legal precedent model supports the *form* of the first claim (burden shifting) but not the *epistemic weight*.

  In common law, a precedent carries weight because it is an **authority**, not just a data point. It is binding because the system says so. In history, a case carries weight only insofar as it is **empirically representative**. Because the "case law" of history suffers from the selection biases noted above (N=1, survivorship bias), it cannot sustain a probabilistic base rate. You cannot derive a Bayesian prior from a sample curated by drama.

  However, the **Mechanism** claim survives the audit. If you treat historical analogies not as *binding precedents* (which dictate the outcome) but as *medical case reports* (which suggest symptoms to check), the analogy holds.
  *   **Legal Precedent:** "Case X ruled Y, therefore we must rule Y."
  *   **Medical Case Report:** "Patient X presented with symptoms A, B, C and developed condition Y. Check current patient for A, B, C."

  Your friend's argument fails because he wants the **authority** of law (the burden shift) without the **institution** of law (the constraints on relevance). Your repair is to downgrade the analogy from *jurisprudence* to *diagnostics*. This preserves the utility (it generates hypotheses) without the danger (it mandates action).

  ### IV. The Institutional Question

  Finally, you ask: *If the disanalogies are institutional rather than logical, could a process supply what is missing?*

  Could a "standing devil's advocate," a "likeness-and-difference table," or a "register of analogies" make historical cases behave like precedents?

  **The answer is No, but with a caveat.**

  **Why No:** The missing element is not merely institutional; it is **ontological**.
  Legal precedents are *normative*. They create obligations. "Like cases must be decided alike" is a moral and legal command.
  Historical analogies are *descriptive*. They suggest likelihoods. "Like cases have tended to end alike" is an empirical observation.
  No amount of procedure can turn an empirical observation into a normative obligation without a sovereign authority to enforce it. In law, the Judge *makes* the rule binding. In policy, History does not enforce its lessons; it only punishes those who ignore them (and sometimes punishes those who follow them). You cannot proceduralize the lack of a sovereign.

  **The Caveat:** While you cannot make history *act* like law, you can make the *decision process* act like a court.
  *   **Red Teaming:** Institutionalizing the "adversarial brief" (forcing a team to argue the distinction) mitigates the groupthink disanalogy.
  *   **Analogy Registers:** Keeping a log of "Analogies Used vs. Outcomes" (as you suggested) mitigates the selection bias disanalogy over time.
  *   **Pre-Mortems:** Forcing a written distinction table *before* the decision mitigates the hindsight bias.

  **Verdict on the Institutional Fix:**
  These procedures would not make historical analogies **binding** (they will never be true precedents), but they would make them **disciplined**. They would shift the practice from "rhetorical weapon" to "structured analytic technique."

  ### Summary for the Seminar

  Your friend is right that reasoning by analogy is the only way we *can* reason in the absence of covering laws. He is wrong that the common-law model validates the *weight* we give those analogies.

  *   **The Mapping:** Holds structurally but fails functionally.
  *   **The Disanalogies:** The lack of a doctrine of relevance and the reflexivity of the analogy are fatal to the "binding precedent" model.
  *   **The Conclusion:** The analogy supports a **diagnostic heuristic** (check for these mechanisms), not a **probabilistic prior** (assume this outcome).
  *   **The Fix:** Institutional procedure cannot make history binding, but it can prevent history from being hijacked. The goal is not to make policy into law, but to make the *use of history* in policy subject to cross-examination.

  You are not getting the better of the argument unfairly; you are correctly identifying that your friend is trying to borrow the **authority** of the legal system to shore up the **epistemology** of history. The audit shows that while the *structure* of the argument is legal, the *truth-value* remains historical, and no amount of procedural dressing can convert the latter into the former.
