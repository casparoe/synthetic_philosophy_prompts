      *   *Analysis:* The legal precedent model *does* establish a baseline expectation (stare decisis). However, because the "case law" of history is so messy, the "base rate" is statistically unsound (N=1 or N=few). The "mechanism sketch" (checking for status anxiety, etc.) is more robust because it treats history as a database of causal pathways, not binding rulings.
      *   *Verdict:* The User is right. The legal model supports the *form* of the argument (burden shifting), but not the *epistemic weight* (probability). It works better as a medical case report (here's a symptom cluster to check) than a binding precedent (you must rule this way).

