prompt: |-
  This term my fourth-year seminar in political philosophy and formal social choice reaches futarchy — Robin Hanson's proposal that a polity should "vote on values, bet on beliefs", with a democratic majority fixing the measure of welfare to be pursued and conditional prediction markets settling which policy maximises it. There are twenty-two students, seated at four tables of five or six, and I have one eighty-minute session in which to make the scheme feel like something other than a slogan.

  My students reliably arrive with two errors, and I want an in-class game that dismantles both from the inside rather than by my asserting that they are errors.

  The first is that they treat a prediction market as an elaborate opinion poll, and assume that once the outcome is observed the market's accuracy can simply be checked against it. The second arises when manipulation is raised: they repeat the standard reassurance — that a would-be manipulator must buy at the honest price, so pays for the privilege, and that the price snaps back afterwards — without noticing that the reassurance presumes a market that merely reports. Under futarchy the price *is* the decision rule, so moving the price is not asserting something false about the future; it is purchasing the future, at a bounded cost, against an unbounded payoff. Closely related, and just as hard to make vivid, is the asymmetry between the two branches of the comparison: once a policy is adopted, only that branch is ever realised, and the contract conditional on the rejected branch ceases to be traded by anyone who expects it to be rejected. The number the scheme most requires is therefore the number the market is least willing to quote.

  Please design the game. My requirements are as follows.

  1. The welfare variable must be generated in the room, in real time, by the participants' own behaviour under whichever policy is adopted. It may not be a figure I announce, and it may not be a lottery I draw. Specify two candidate policies, the scalar measure defined over the room's activity, and the productive task that yields it, with enough genuine contingency that the outcome is not obvious from the start.

  2. No real money. Use a fixed chip endowment and an explicit payoff function for the policy-conditional contracts, presented as a small printed table that can be evaluated by hand in under a minute. Justify the functional form: it should make honest forecasting strictly profitable in expectation, and — this matters most — the manipulator's arithmetic should be visible on the payoff table rather than engineered into the rules. If the design is honest, the profitable manipulation should fall out of the payoffs as an unwelcome consequence.

  3. Include an opening vote on values, taken before anyone knows anything about the policies' prospects, in which the seminar chooses between two candidate welfare measures; the contracts must pay on whichever measure is chosen. Tell me what this costs in minutes, whether the vote is itself strategic, and what to do if it is.

  4. Some participants must hold a private stake in which policy is adopted that is independent of the welfare measure — they do better under one policy whatever the outcome turns out to be. State how many such players, how you assign them, and how large the stake must be relative to ordinary forecasting profits for the effect to bite without being spotted immediately.

  5. Give an exact timeline in minutes, a full materials list, and rules precise enough that a teaching assistant who has seen none of this could run the session unaided.

  6. Provide a debrief that maps particular moments of play onto the two errors above, in the order those moments will have occurred, and that reaches the point at which someone notices that their own trades had stopped being forecasts. Give me the questions to ask rather than a speech to deliver.

  7. Be frank about what will predictably go wrong the first time this is run. I expect at least: too little variance in the outcome variable; the conditional market on the losing branch dying completely without anyone understanding why; chip arithmetic bogging the room down; and the privately interested players either blowing their cover or being too timid to exploit it. Offer a pre-emptive fix for each.

  8. State honestly which features of futarchy the game cannot reproduce and which I must therefore supply verbally. I suspect the contested character of the welfare measure and the continuous liquidity of real markets are candidates; tell me which you regard as genuinely irreproducible and which as merely difficult.

  9. Include a twenty-five-minute fallback version for the event that the session overruns.

  I am not after a bibliography, a reading list, or citations of any kind — the design is the deliverable. Please write the whole response in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game design:

  1.  **Analyze the Request:**

      *   **Context:** Fourth-year seminar in political philosophy and formal social choice.
      *   **Topic:** Futarchy (Robin Hanson's "Vote on Values, Bet on Beliefs").
      *   **Constraints:** 22 students, 4 tables (5-6 students each), 80 minutes total.
      *   **Goal:** Dismantle two specific student errors via an in-class game (not lecture).
          *   *Error 1:* Prediction markets = opinion polls (accuracy checked post-outcome).
          *   *Error 2:* Manipulation reassurance (manipulators lose money) ignores that price *is* the decision rule in futarchy (buying the future vs. reporting it) + the counterfactual problem (rejected branch isn't realized).
      *   **Specific Requirements:**
          1.  Welfare variable generated in-room, real-time, contingent on policy. Two policies, scalar measure, productive task.
          2.  No real money. Fixed chips, explicit payoff table (hand-evaluated). Honest forecasting profitable, but manipulation arithmetic visible.
          3.  Opening vote on values (welfare measure) before policy knowledge. Address strategic voting.
          4.  Private stakes: Some players prefer one policy regardless of welfare. Assignments and stake size.
          5.  Exact timeline, materials list, TA-proof rules.
          6.  Debrief: Map play moments to errors, Socratic questioning.
          7.  Predictable failures & fixes (variance, dead markets, arithmetic, player behavior).
          8.  Limitations: What the game *can't* show (needs verbal supplement).
          9.  Fallback: 25-minute version if overruns.
      *   **Tone/Style:** British English, no bibliography/citations, design-focused.

  2.  **Deconstruct the Core Problem (Futarchy's Flaws):**

      *   *Futarchy Mechanism:* Vote on $U$ (utility function). Markets estimate $E[U|Policy A]$ vs $E[U|Policy B]$. Choose policy with higher expected $U$.
      *   *Error 1 (Poll vs. Market):* Students think markets just predict. In futarchy, markets *cause* the outcome.
      *   *Error 2 (Manipulation & Counterfactuals):* Standard market theory says manipulation is costly because you bet against the truth. In futarchy, if I can move the price enough to change the *policy*, I change the *truth*. Also, once Policy A is chosen, Policy B's market closes, so we never know if the market was right about B (the "unquoted number" problem).
      *   *Private Stake:* Needs to create an incentive to manipulate the policy choice, not just win on the market payout.

  3.  **Drafting the Game Mechanics:**

      *   *Welfare Generation:* Needs to be active. Trivia? Puzzle? Physical task?
          *   *Idea:* Anagram solving or Math problems.
          *   *Selection:* "The Collective Sum." Students solve simple arithmetic problems. The welfare is the total number of correct answers.
          *   *Policies:*
              *   Policy A: "Silence" (Individual work, no talking).
              *   Policy B: "Collaboration" (Talking allowed, sharing answers).
          *   *Contingency:* Which is better? Depends on the group's dynamic. Maybe Silence is safer, Collaboration has higher variance/higher ceiling. This creates uncertainty for the market.
      *   *Welfare Vote:* Need two measures.
          *   Measure 1: "Total Correct" (Utilitarian).
          *   Measure 2: "Minimum Correct" (Rawlsian/Maximin).
          *   *Why:* This forces a value judgment before knowing which policy helps which measure.
      *   *Currency & Payoffs:*
          *   Chips given at start.
          *   Contracts: "Share of Policy A" and "Share of Policy B".
          *   Payoff: If Policy X is chosen, contracts on X pay $Welfare Score \times Multiplier$. Contracts on Y become worthless.
          *   *Manipulation Logic:* If I hold a private stake in Policy A being chosen, I want to buy Policy A shares to drive up $E[U|A]$. Even if I lose money on the shares (buying high), if the policy switch gives me a huge private bonus, it's worth it.
      *   *Private Stake:* "Special Interest Tokens." Given to 3-4 students secretly. If Policy A wins, they get bonus chips.
      *   *Market Structure:* Needs to be simple. Call market or continuous double auction? Continuous is too chaotic for 80 mins. Call market (batches) is better for teaching. Let's do two trading rounds.
          *   Round 1: Pre-policy decision.
          *   Decision: Based on Round 1 prices.
          *   Round 2: Post-decision (to show the dead market problem).
          *   Task Execution.
          *   Payout.

  4.  **Refining the Mechanics (Addressing Requirements):**

      *   *Req 1 (Welfare):* "Total Correct Answers" vs "Lowest Table Score". Let's stick to one chosen measure for the main game to keep it simple, but the *vote* decides which measure. Let's make the task: Solving 5 moderate-difficulty logic puzzles per table.
      *   *Req 2 (Payoff Table):* Needs to show manipulation profit.
          *   Standard payoff: Price $P$, Outcome $V$. Profit $V - P$.
          *   Manipulation: Spend chips to raise $P$. If raising $P$ switches policy, gain Private Stake $S$.
          *   Condition: $S > \text{Cost of Manipulation}$.
          *   Table needs to show: "If you move price from 40 to 60, you lose 20 chips on trade, but if policy switches, you gain 100 chips private stake."
      *   *Req 3 (Vote):* 5 minutes. Strategic voting? If they know Policy A helps Measure 1, they might vote Measure 1. *Fix:* Vote *before* explaining policies. Just describe measures abstractly.
      *   *Req 4 (Private Stake):* 4 students (one per table). Stake = 50 chips. Normal trading profit potential = ~10-20 chips. This makes manipulation rational.
      *   *Req 5 (Timeline):* 80 mins.
          *   Intro/Vote: 10
          *   Policy Info/Market 1: 20
          *   Decision: 5
          *   Market 2 (The "Dead Branch" moment): 10
          *   Task: 20
          *   Scoring/Debrief: 15
      *   *Req 6 (Debrief):* Socratic. "Who bought A knowing it was overpriced?" "What happened to Market B after the vote?"
      *   *Req 7 (Failures):*
          *   Variance: Make task hard enough.
          *   Dead Market: Explicitly ask Market B traders what they do.
          *   Arithmetic: Use simple numbers (multiples of 10).
          *   Timid Manipulators: Tell them privately "Your goal is to maximize *your* chips, not the group welfare."
      *   *Req 8 (Limitations):* Continuous liquidity, long time horizons, complex welfare functions.
      *   *Req 9 (Fallback):* Cut the second trading round and simplify the task.

  5.  **Developing the "Manipulation Arithmetic" (Crucial Step):**

      *   In standard markets: If True Value = 50, Price = 40. Manipulator buys to push to 60. Loss = (60-50) per share. Market corrects, manipulator loses.
      *   In Futarchy: If True Value A = 50, True Value B = 60. Current Price A = 50, Price B = 60. Policy B wins.
      *   Manipulator wants A. Buys A to push Price A to 70.
      *   Policy A now wins.
      *   Outcome A realizes at 50.
      *   Manipulator bought at 70, outcome 50. Loss 20 per share.
      *   *BUT* Manipulator has Private Stake worth 100 if A wins.
      *   Net gain: 100 - 20 = 80.
      *   *The Table:* Needs to make this calculation explicit for students.
      *   *Wait, one nuance:* In Futarchy, the market decides the policy. So the manipulator *makes* A happen. The outcome is determined by the task under Policy A.
      *   *The "Dead Branch" Problem:* Once A is chosen, B is never run. We never see if B would have been 60. The market price for B freezes or becomes irrelevant.

  6.  **Writing the Design (incorporating British English & Tone):**

      *   *Tone:* Academic, precise, slightly wry (fitting a senior seminar).
      *   *Language:* "Programme", "Maximise", "Centre", "Chip", "Table".
      *   *Structure:* Follow the 9 requirements sequentially or logically grouped. I will group them for coherence but ensure every point is hit.

      *   *Refining the Task:* "The Cipher Challenge." Each table gets a sheet with 10 simple substitution ciphers.
      *   *Policies:*
          *   **Regime Alpha (Individual):** No talking. Phones away.
          *   **Regime Beta (Collective):** Full collaboration allowed. Share answers across tables.
      *   *Welfare Measures:*
          *   **Measure One (Aggregate):** Total correct ciphers in the room.
          *   **Measure Two (Equity):** Number of ciphers solved by the *lowest-scoring* table.
      *   *Vote:* Students vote on Measure One vs Two *before* knowing Alpha/Beta details.
      *   *Private Stake:* "Veto Cards". 4 students get a card. If Alpha wins, card = 50 chips. If Beta wins, card = 0.
      *   *Market:* Two contracts: "Alpha Share" and "Beta Share".
      *   *Pricing:* Students submit bids. Instructor sets clearing price based on excess demand (simplified). Or, simpler: "Market Makers" (TA + Instructor) accept buy/sell orders at posted prices that move based on volume.
      *   *Decision:* Policy with higher market price wins.
      *   *Payoff:* Winning policy shares pay out = Welfare Score. Losing policy shares = 0.
      *   *Manipulation:* Veto card holders buy Alpha shares even if they think Beta is better, to push Alpha's price higher.

      *   *Wait, the "Dead Branch" issue:* I need to ensure trading happens *after* the decision too, or at least highlight that the losing market vanishes.
      *   *Correction:* In Futarchy, the market *decides*. So trading happens, then prices are read, then policy is set. The "Dead Branch" is that we never run the task under the losing policy.
      *   *To highlight this:* Have a second round of trading *after* the policy is announced but *before* the task. Students will realize the losing contract is now worthless (probability 0), but the winning contract is now a bet on the task difficulty, not the policy selection.
      *   *Actually, better:* The prompt asks to highlight that the number the scheme requires (the counterfactual welfare) is the number the market is least willing to quote.
      *   *Game tweak:* After the policy is chosen (say Alpha), ask students: "What would Beta have scored?" Take bets on that *after* the decision. They won't bet, because it pays nothing and affects nothing. This highlights the epistemic void.

  7.  **Addressing Specific Constraints:**

      *   *Payoff Table:* Must be printable.
      *   *Timeline:* Strict 80 mins.
      *   *TA Proof:* Rules must be unambiguous.
      *   *Fallback:* 25 mins.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the task too boring?
      *   *Fix:* Make it a "Word Chain" or "Anagram" race. High energy. Let's go with **Anagrams**. 5 anagrams per student.
      *   *Critique:* Will the manipulation be obvious?
      *   *Fix:* The Veto Card holders need instructions that emphasize *their* profit, not the group's.
      *   *Critique:* Will the arithmetic bog down?
      *   *Fix:* Use chips worth 1, 5, 10. Payoff is 1 chip per point of welfare.
      *   *Critique:* British English check. "Maximise", "Programme", "Centre", "Licence" (noun), "Defence".
      *   *Critique:* Requirement 2 says "manipulator's arithmetic should be visible on the payoff table". I need a specific handout for this.
      *   *Critique:* Requirement 7 (Predictable failures). I need to be honest.

  9.  **Final Polish:** Check against all 9 points one last time.
      *   1. Welfare generated in room? Yes (Anagrams).
      *   2. No real money, chip endowment, payoff table? Yes.
      *   3. Opening vote on values? Yes (Aggregate vs Equity).
      *   4. Private stake? Yes (Veto Cards).
      *   5. Timeline/Materials/TA rules? Yes.
      *   6. Debrief questions? Yes.
      *   7. Predictable failures? Yes.
      *   8. Limitations? Yes.
      *   9. Fallback? Yes.

      *Let's refine the "Payoff Table" requirement.* It needs to show *why* manipulation works.
      *   Scenario: You hold a Veto Card (worth 50 if Alpha wins).
      *   Market Price Alpha: 40. Market Price Beta: 50. (Beta winning).
      *   You buy Alpha shares to push price to 55.
      *   Cost: You buy at 40, 50, 55... average 50.
      *   Outcome: Alpha wins. Task score is 40.
      *   Market Loss: Bought at avg 50, payout 40. Loss 10 per share.
      *   Veto Gain: 50.
      *   Net: +40.
      *   The table should lay this out clearly.

      *Let's refine the "Dead Branch".*
      *   After the policy decision, announce: "We will now open a market on what the *losing* policy would have scored."
      *   Observe: No one trades. Why? It doesn't affect payout, doesn't affect policy. It reveals the epistemic black hole.

      *Okay, ready to write.*
answer: |-
  # Seminar Design: The Futarchy Simulation

  **Session Title:** Voting on Values, Betting on Beliefs (and Buying the Future)
  **Duration:** 80 Minutes
  **Participants:** 22 Students (4 Tables of 5–6)
  **Instructor:** 1
  **Teaching Assistant:** 1 (Preferred, but rules allow for solo delivery)

  ---

  ## 1. The Core Mechanism: Welfare and Policy

  **The Productive Task: The Anagram Sprint**
  Welfare is not announced by you; it is produced by the room.
  *   **Materials:** Each student receives a slip with 5 five-letter anagrams (e.g., 'LISTE' → 'STILE'). Difficulty is calibrated so a single student can solve 2–3 in ten minutes, but 5 is a stretch.
  *   **Scalar Measure:** The 'Welfare Score' ($W$) is the total number of correctly solved anagrams in the room.
  *   **Contingency:** The difficulty is such that the difference between policies is non-obvious. Silence might aid concentration; collaboration might aid speed.

  **The Two Policies**
  1.  **Regime Alpha (The Silent Library):** Students must work individually. No talking, no sharing papers, phones face down.
  2.  **Regime Beta (The War Room):** Full collaboration permitted. Students may stand, share sheets, and divide labour across tables.

  **The Two Welfare Measures (For the Opening Vote)**
  1.  **Utilitarian Sum:** $W = \text{Total Correct Answers in Room}$.
  2.  **Rawlsian Minimum:** $W = \text{Correct Answers by the Lowest-Scoring Table}$.

  ---

  ## 2. Currency and Payoff Structure

  **Endowment**
  *   Each student receives **100 Chips** (physical poker chips or printed counters).
  *   Chips have no cash value but determine the 'winner' of the seminar (bragging rights/grade participation credit).

  **The Contracts**
  Two tradeable assets are available: **Alpha Shares** and **Beta Shares**.
  *   **Rule:** Only shares of the *adopted* policy pay out. Shares of the rejected policy become worthless immediately upon the policy decision.
  *   **Payout:** 1 Chip per unit of Welfare Score ($W$).
      *   *Example:* If Alpha is adopted and $W=80$, one Alpha Share redeems for 80 Chips. Beta Shares redeem for 0.

  **The Payoff Table (Handout A)**
  *This table is printed on card for every student. It is designed to make the manipulation arithmetic transparent.*

  | Scenario | Your Action | Market Price Movement | Your Trading P&L | Policy Outcome | Private Stake Bonus | **Net Result** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Honest Trading** | Buy Alpha at 40 | None | Price rises to 60. You sell. | Alpha Wins | 0 | **+20 Chips** |
  | **Honest Trading** | Buy Alpha at 40 | None | Price stays 40. Outcome 60. | Alpha Wins | 0 | **+20 Chips** |
  | **Manipulation** | Buy Alpha aggressively | Pushes 40 → 55 | Buy avg 50. Outcome 45. | **Alpha Wins** (due to manipulation) | **+50 Chips** (Veto Card) | **+45 Chips** |
  | **Passive** | Hold Chips | None | 0 | Beta Wins | 0 | **0 Chips** |
  | **Passive** | Hold Chips | None | 0 | Alpha Wins | **+50 Chips** (Veto Card) | **+50 Chips** |

  *Justification:* The table demonstrates that honest forecasting yields profit based on accuracy. However, the 'Manipulation' row shows that if a Private Stake (Veto Card) exists, losing money on the trade (buying at 50, outcome 45) is rational if it secures the policy switch (gaining the 50 Chip bonus). The arithmetic is explicit; the student need not take your word for it.

  ---

  ## 3. The Opening Vote on Values

  **Timing:** Minutes 0–10
  **Procedure:**
  1.  Explain the Task (Anagrams) but **do not** explain Regime Alpha or Beta yet.
  2.  Present the two Welfare Measures (Utilitarian Sum vs. Rawlsian Minimum).
  3.  Hold a secret ballot. The majority measure becomes the official $W$ for the session.
  4.  **Strategic Voting:** Students may try to vote for the measure they think benefits them.
      *   *Instructor Note:* If students ask "Which policy helps which measure?", refuse to answer. State: "Values are prior to facts. Vote on what kind of society you want, not what is easy."
      *   *If Strategic Voting dominates:* Accept it. This mirrors real political philosophy; preferences over welfare functions are rarely pure. Proceed with the winning measure.

  ---

  ## 4. Private Stakes (The Veto Cards)

  **Assignment:**
  *   Select **4 Students** (one per table) secretly as you hand out materials.
  *   Give them a sealed envelope marked **"SPECIAL INTEREST"**.
  *   **Instruction inside:** "You hold a Veto Card. If Regime Alpha is adopted, you receive **50 Bonus Chips** at the end of the session, regardless of the Welfare Score. If Beta is adopted, you receive 0. Do not reveal this unless necessary to trade. Maximise your personal chip count."

  **Stake Size:**
  *   Normal trading profit potential: ~20 Chips.
  *   Veto Bonus: 50 Chips.
  *   *Rationale:* The bonus is large enough to justify a loss on the market (manipulation) but small enough that they cannot simply buy the win outright without trading skill. It forces them to interact with the market to tip the balance.

  ---

  ## 5. Timeline and Materials

  **Materials List:**
  *   22 Anagram Sheets (5 puzzles each).
  *   22 Chip Endowment Sets (100 chips each).
  *   4 "Special Interest" Envelopes.
  *   44 Contract Order Slips (Alpha/Beta Buy/Sell).
  *   4 Copies of **Payoff Table (Handout A)**.
  *   Whiteboard for Market Prices.
  *   Timer.

  **Exact Timeline (80 Minutes):**

  *   **00:00 – 00:10 (Vote on Values):** Introduction, Welfare Measure ballot, count votes.
  *   **00:10 – 00:20 (Policy Reveal & Briefing):** Explain Alpha/Beta. Distribute chips and Special Interest envelopes. Explain Market Rules.
  *   **00:20 – 00:40 (Market Round 1):** Trading open. Students submit order slips. TA updates whiteboard prices every 5 minutes based on excess demand.
      *   *Goal:* Establish a price for $E[W|\alpha]$ and $E[W|\beta]$.
  *   **00:40 – 00:45 (The Futarchy Decision):** Compare prices. The higher price dictates the Policy. Announce the winner.
  *   **00:45 – 00:55 (Market Round 2 - The Counterfactual Trap):** Trading re-opens for 5 minutes.
      *   *Crucial:* Ask students to price the *losing* policy shares now.
      *   *Observation:* Market for losing policy should die (value = 0). Market for winning policy becomes a pure task bet.
  *   **00:55 – 01:15 (The Task):** Execute the Anagram Sprint under the chosen Regime.
  *   **01:15 – 01:20 (Settlement & Debrief):** Count scores. Pay out chips. Begin Socratic debrief.

  ---

  ## 6. The Debrief (Socratic Mapping)

  *Do not lecture. Ask these questions in order. Wait for silence.*

  **Phase 1: The Opinion Poll Error (Minutes 75–77)**
  1.  "Look at the price of the winning policy just before we started the task. Did anyone treat that number as a prediction of the score?"
  2.  "When the Special Interest holders bought shares to push the price up, were they reporting a belief? Or were they purchasing an outcome?"
  3.  "In a normal prediction market, if I lie, the truth corrects me. In this game, if I lie successfully, I *make* the lie the truth. Where is the correction mechanism?"

  **Phase 2: The Counterfactual Void (Minutes 77–79)**
  4.  "Raise your hand if you traded the *losing* policy shares in Round 2 (after the decision was made)."
  5.  (Likely no hands). "Why not? The contract was still in your hand."
  6.  "Futarchy requires us to know $E[W|\text{Rejected Policy}]$ to verify if we made the right choice. We just observed that the market is unwilling to quote that number once the decision is made. If we cannot quote it, how do we learn if the vote on values was satisfied?"

  **Phase 3: The Manipulator's Confession (Minute 79–80)**
  7.  Turn to the Special Interest holders. "Did any of you buy shares you knew were overpriced?"
  8.  "Show us the arithmetic from Handout A. Did the market loss matter compared to the Veto bonus?"
  9.  "If the price *is* the decision rule, then liquidity is not a public good; it is a vulnerability. Who owns the vulnerability?"

  ---

  ## 7. Predictable Failures and Pre-emptive Fixes

  **Failure 1: Too Little Variance in Outcome**
  *   *Risk:* If the task is too easy, $W$ is maxed out regardless of policy. The market prices converge, and manipulation looks pointless.
  *   *Fix:* Calibrate anagrams to be difficult. In the briefing, emphasise: "Time is the constraint. You will not finish." This ensures $W$ is sensitive to the Regime (collaboration vs. silence).

  **Failure 2: The Dead Market Confusion**
  *   *Risk:* Students assume the losing shares still pay out based on a hypothetical score.
  *   *Fix:* The TA must announce loudly at Minute 45: "The losing contract is now void. It pays zero. It cannot be traded." When they try to sell, reject the order. Make the death of the market physical.

  **Failure 3: Chip Arithmetic Bogging Down**
  *   *Risk:* Students spend 10 minutes calculating expected value.
  *   *Fix:* Use multiples of 10 for all prices. The Payoff Table (Handout A) must be laminated on every table. The TA should circulate with a calculator during Market Round 1.

  **Failure 4: Timid Manipulators**
  *   *Risk:* Special Interest holders feel social pressure to maximise group welfare, not personal chips.
  *   *Fix:* The Special Interest envelope must include a bold instruction: **"Your grade depends on your final chip count, not the room's welfare."** (Even if untrue, it breaks the social norm).

  ---

  ## 8. Limitations: What the Game Cannot Reproduce

  You must supply these verbally in the final two minutes.

  1.  **Continuous Liquidity (Irreproducible):** Our market clears in batches. Real futarchy relies on continuous pricing to update policy in real-time. The game creates a binary 'switch' moment; real futarchy is a dimmer switch.
  2.  **Complex Welfare Functions (Difficult):** We used a simple count. Real welfare (happiness, liberty, health) is not a scalar integer countable by a TA. The game hides the difficulty of *defining* $W$, focusing only on *maximising* it.
  3.  **Long Time Horizons (Irreproducible):** Our outcome is immediate (15 mins). Real policy effects take years. This removes the 'discount rate' problem and the 'verification lag' which allows manipulators to exit before the truth is known.
  4.  **The 'Vote on Values' Stability (Difficult):** In the game, the vote is once-and-for-all. In reality, if the market consistently fails to maximise the chosen welfare, pressure will mount to change the welfare function itself, destabilising the market's anchor.

  ---

  ## 9. The 25-Minute Fallback Version

  *If the seminar overruns or technology fails, switch to this 'Speed Run'.*

  *   **00:00 – 00:05:** Skip Welfare Vote. Assign 'Utilitarian Sum' by fiat. Distribute chips and 4 Special Interest envelopes.
  *   **00:05 – 00:10:** Explain Policies (Silence vs. Collaboration) and Payoff Table.
  *   **00:10 – 00:15:** **Single Market Round.** 5 minutes of trading. Freeze prices.
  *   **00:15 – 00:20:** **Decision & Task.** Announce winner. Run Anagram Sprint for 5 minutes only.
  *   **00:20 – 00:25:** **Settlement & Debrief.** Count only one table's score to save time. Ask the three key Debrief questions (Manipulation, Dead Market, Price as Decision).

  *Note:* This version sacrifices the 'Counterfactual Market Round' (Round 2). You must verbally describe the death of the losing market rather than demonstrating it.

  ---

  ## TA Instructions (Unaided Run Guide)

  1.  **Market Making:** You are the market maker. If there are more Buy orders for Alpha than Sell, raise the Alpha price by 5 Chips. If more Sell, drop by 5. Write prices on the whiteboard visibly.
  2.  **Enforcing Regimes:** During the Task, you are the police. If Regime Alpha is chosen, shush anyone talking. If Beta, encourage noise. This ensures the welfare variance is real.
  3.  **Special Interest:** If a Special Interest student asks "Should I help the group?", point to their envelope and say "Read your instructions."
  4.  **Arithmetic:** If a student struggles with the Payoff Table, walk them through the 'Manipulation' row only. Ignore the rest.

  **End of Design.**
