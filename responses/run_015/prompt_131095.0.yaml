answer: |-
  # Q&A PREP SHEET: CHASE-SANBORN & INTROSPECTIVE REFERENCE DRIFT

  **Strategic Posture:** You are arguing that "qualia" is a *failed theoretical posit* due to structural instability in reference, not merely that it doesn't exist. Your crux is **ostensive failure**, not ontological denial.
  **Epistemic Status:** Your argument relies on a conceptual claim (ostension requires stability) and an empirical premise (attention alters phenomenal content). You must defend the conceptual claim fiercely; you can concede ground on the empirical mechanism.

  ---

  ### UPFRONT CONCESSIONS (Opening Remarks)
  *Deploy these immediately to lower temperature and preempt the "strawman" accusations.*

  1.  **To the Predictive Processing (PP) Group:** Concede that **Introspective Reference Drift (IRD)** is likely implemented via **active inference and precision weighting**. Do not claim you have discovered a new cognitive mechanism. Claim you are identifying the *conceptual consequence* of that mechanism for first-person ontology.
      *   *Script:* "I am not proposing a rival cognitive architecture to predictive processing. I am arguing that if the PP model of attention is correct, the philosophical category of 'qualia' cannot sustain the referential weight realists place on it."
  2.  **To the Realists:** Concede that **phenomenal reports are pragmatically indispensable**. You are not arguing we should stop talking about experience, only that the *theoretical term* 'qualia' fails to pick out a stable natural kind suitable for the Hard Problem.
      *   *Script:* "I grant that phenomenology is the data. I deny that 'qualia' is the correct theoretical unit for that data."

  ---

  ### THE OBJECTIONS (Ordered by Damage)

  #### 1. The "Hard Problem Survivor" (Phenomenal Realist / Boundary Condition)
  **The Objection:** "You've shown that phenomenal content is unstable under attention. That's an empirical claim about variability. But the Hard Problem isn't about stability; it's about *existence*. Even if the redness drifts, there is still *something it is like* to see the drift. You've explained the variation, not the presence. The 'Hard Problem boundary' remains intact."
  **Damage Level:** **FATAL.** If qualia exist even as drifting entities, your incoherence thesis fails.
  **Reply Strategy:** **Hold Firm on Conceptual Instability.**
  *   **Argument:** The Hard Problem assumes a stable *explanandum*. If the target of explanation shifts every time we attempt to isolate it, the problem is ill-posed, not just hard. A "drifting entity" is a contradiction in terms for a foundational ontological posit. If the 'what-it-is-like' cannot be fixed for long enough to be referenced without alteration, it cannot serve as the boundary condition for a scientific theory.
  *   **Concession:** Admit that *experience* occurs. Deny that *qualia* (as fixed, ostendable properties) exist.
  *   **Weakest Point:** You are relying on the premise that ontological reality requires referential stability. This is a contested metaphysical claim (process ontologies disagree).
  *   **Crux:** "Does an ontology require stable identity conditions? If yes, qualia fail. If no, the Hard Problem loses its force as a boundary condition."

  #### 2. The "Active Inference Redescription" (Predictive Processing Scientists)
  **The Objection:** "This is just precision weighting on prediction errors. When I attend to a sensation, I update the generative model, changing the sensation. You're calling this 'Reference Drift' and acting like it's a philosophical discovery. It's just standard active inference. You're putting philosophical gloss on our machinery."
  **Damage Level:** **HIGH.** Renders your extension redundant/obsolete.
  **Reply Strategy:** **Concede Mechanism, Hold Firm on Implication.**
  *   **Argument:** Agree entirely that active inference is the mechanism. However, cognitive science often assumes the *target* of the inference (the phenomenal state) remains the anchor while the *model* updates. Your point is that the *target itself* is constituted by the attention. This invalidates the "inner witness" assumption still present in many PP models. You are not describing the engine; you are proving the steering wheel is disconnected from the wheels.
  *   **Concession:** "You are right about the mechanism. I am not competing with your model."
  *   **Hold Firm:** "But you still treat the 'sensory data' as a stable ground truth for the hierarchy. IRD claims the ground truth moves."
  *   **Weakest Point:** If PP already models the sensory data as constructed/variable, your philosophical addition adds no predictive power.

  #### 3. The "Failed Kind Term" (Philosopher of Science)
  **The Objection:** "You argue 'qualia' is an unstable posit. But by your own criteria, many successful theoretical terms (e.g., 'species', 'temperature' pre-kinetic theory) were unstable or fuzzy before refinement. Why is this *incoherence* rather than just *immaturity*? How do you distinguish a bad term from a developing one?"
  **Damage Level:** **HIGH.** Challenges the "Incoherence" conclusion vs. "Revision" conclusion.
  **Reply Strategy:** **Hold Firm on Ostensive Failure.**
  *   **Argument:** 'Temperature' was fuzzy, but ostension worked (hot vs. cold) even before kinetic theory. 'Qualia' fails at the ostensive level *by design* of the phenomenon (via IRD). You cannot point to a quale without changing it. A theoretical term that cannot be ostensively anchored by the very subjects who possess it is not immature; it is structurally broken.
  *   **Concession:** Allow that a *revised* term (e.g., "dynamic phenomenal processes") might work.
  *   **Hold Firm:** "But that revised term is not 'qualia'. 'Qualia' specifically implies fixed, intrinsic, ostendable properties. That specific term is dead."
  *   **Weakest Point:** You must defend the claim that ostension is necessary for this specific theoretical term, which realists will deny (they argue for theoretical identification, not ostension).

  #### 4. The "Ontological Commitment" (Eliminativists)
  **The Objection:** "If the term is unstable and the mechanism is just predictive processing, why aren't you an eliminativist? You're keeping the 'drift' and the 'instability' as if *something* is doing the drifting. You've misappropriated our machinery to save a ghost. Just say 'qualia do not exist' and be done."
  **Damage Level:** **MEDIUM.** Attacks consistency, not the core thesis.
  **Reply Strategy:** **Strategic Partial Concession.**
  *   **Argument:** Distinguish between *eliminativism* (nothing exists) and *incoherentism* (the concept fails to carve reality). There *are* experiences, and there *is* drift. Eliminating the talk entirely loses the data. Your position is revisionary, not eliminative. You are saving the phenomenon by killing the noun.
  *   **Concession:** "I agree 'qualia' should not appear in our final ontology."
  *   **Hold Firm:** "But we need a vocabulary to describe the *error* of introspection. Eliminativism silences the error; Incoherentism explains it."
  *   **Weakest Point:** Eliminativists will argue that explaining the error still reifies the error too much. You risk sounding like a property dualist who is afraid to admit it.

  #### 5. The "Epistemic Self-Defeat" (Phenomenal Realist)
  **The Objection:** "If introspective attention alters the state, and your argument relies on introspective attention to establish the drift... doesn't your argument drift? How can you trust the philosophical reasoning that concludes introspection is unreliable, if that reasoning is a product of the same introspective apparatus?"
  **Damage Level:** **MEDIUM.** Undermines your credibility/authority.
  **Reply Strategy:** **Hold Firm on Third-Person Convergence.**
  *   **Argument:** The claim of IRD is not based solely on *my* introspection. It is based on the *failure of agreement* in introspective reports across subjects and time, modeled via PP. The argument is a third-person inference about first-person limitations, not a first-person assertion. I am not introspecting the drift; I am theorizing it based on the breakdown of ostension.
  *   **Concession:** "My own introspection is indeed unreliable."
  *   **Hold Firm:** "But the *pattern* of unreliability is an objective, third-person observable fact."
  *   **Weakest Point:** You rely on the assumption that the "pattern of unreliability" is observable without relying on the very introspective reports you claim are drifted.

  #### 6. The "Diachronic Identity" (General / Mixed)
  **The Objection:** "For a state to 'drift,' it must persist as the *same* state over time while changing properties. If attention alters the target, isn't it more accurate to say the old state ceased and a new state began? 'Drift' implies a continuous substrate. What is the substrate?"
  **Damage Level:** **LOW/MEDIUM.** Metaphysical nitpick, but exposes the soft joint.
  **Reply Strategy:** **Concede the Metaphor, Hold Firm on the Function.**
  *   **Argument:** "Drift" is a functional description, not a metaphysical claim about a substrate. It describes the failure of reference fixation. Whether it's one state changing or a series of new states, the *ostensive link* is broken. The identity condition is the problem, not the substrate.
  *   **Concession:** "I do not commit to a persistent phenomenal substrate."
  *   **Hold Firm:** "The functional outcome for reference is identical: you cannot pin the label to the experience."
  *   **Weakest Point:** If there is no substrate, the Realist can argue there is no "thing" to be incoherent. You risk arguing against a straw man.

  ---

  ### THE DREADED QUESTION (The Softest Joint)
  **Question:** "If introspective attention alters the state, what constitutes the identity of the state *before* attention lands on it, such that you can claim it has 'drifted' rather than simply 'been replaced'? If you can't specify the pre-attentional state, you haven't shown reference drifts; you've shown reference fails because there's no stable target to begin with. But if there's no stable target, what are you experiencing *before* you attend?"

  **Why this is fatal:** It forces you to admit either:
  1.  There is a stable pre-attentional state (which undermines IRD, because then we could theoretically point to *that*).
  2.  There is no pre-attentional state (which undermines the "drift" metaphor and moves you toward pure eliminativism or a different ontology entirely).

  **Prepared Reply (Damage Control):**
  "I am not claiming there is a *determinate* pre-attentional state. I am claiming there is a *dispositional* state that becomes determinate only through the act of attention, and that determination process is what varies. The 'drift' is in the *determination*, not the substrate. The incoherence lies in treating the determined output as if it were the intrinsic input."
  *(Flag: This relies on a dispositional/occurrent distinction that is itself philosophically contested. Be prepared to defend that distinction if pressed.)*

  ---

  ### FINAL TACTICAL NOTES
  *   **Do not get bogged down in neuroscience.** If the PP scientists push on mechanisms, defer to them ("That is an empirical question for your models") and pivot back to the *conceptual consequence* for qualia.
  *   **Watch the Realist Boundary Condition.** The one who sees the Hard Problem as a permanent boundary will try to frame your drift as *inside* the boundary. Keep insisting the boundary itself is drawn in sand.
  *   **Epistemic Humility:** When flagging your weakest points, do so explicitly. "This relies on the assumption that X..." This builds trust with the Phil of Science and PP crowd.
  *   **Kill the Noun:** Consistently refer to "qualia-talk" or "the posit of qualia" rather than "qualia." Reinforce the linguistic/conceptual nature of your thesis.
