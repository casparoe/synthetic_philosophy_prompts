prompt: |-
  I'm presenting a seminar defense of the Chase-Sanborn incoherence thesis—qualia are not mysterious entities but a conceptually unstable theoretical posit—augmented with my own extension that I call introspective reference drift: the claim that repeated attempts to fix the phenomenal content of an experience through attention alter the target state in a way that makes first-person ostension structurally unreliable, unlike ostension for physical properties. The audience is a philosophy-of-mind reading group with four committed phenomenal realists (mostly naturalistic dualists, one who treats the hard problem as a permanent boundary condition), two eliminativists who will argue I've misappropriated their machinery, three predictive-processing cognitive scientists who think philosophers are still fighting about ghosts in predictive hierarchies, and a philosopher of science who will scrutinize whether "qualia" fails the criteria for a well-behaved theoretical term. I need a Q&A prep sheet, not a neutral literature survey: list the six or seven objections I will actually face, ordered by how damaging they are to my specific argument, each phrased in the vocabulary and framing that audience member would use (not generic "what about the inverted spectrum" objections). For each: a two-minute reply that takes a definite line—tell me where to concede ground and where to hold firm, with reasoning, and flag the weakest point in that reply. Include the one or two points I should concede up front in my opening remarks to lower the temperature, and identify the single question I am hoping nobody asks—the one that exposes the softest joint in my reference-drift argument. Write this from a committed stance: make definite recommendations about which objections are fatal, which are distractions, and which require a strategic partial concession, rather than laying out options for me to choose among. Keep the framing consistent with a rationalist-style concern for cruxes, steel-manning