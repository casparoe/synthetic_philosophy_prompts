          *   *Key Insight:* **The Precautionary Principle vs. Epistemic Integrity.**
          *   *Let's focus on:* **Moral Significance vs. Moral Status.** Status = do they count? Significance = how much do they count? An aphid might have status (non-zero) but negligible significance (tiny capacity). This solves the "quintillion" problem without needing to prove they feel nothing.

  5.  **Refining the Output (Self-Correction during drafting):**
