answer: |-
  The cooling units hummed, a low B-flat that vibrated in the fillings of Elias's teeth. On the main screen, the spectral analysis of Alpha Centauri A waited in a buffer queue. The cursor blinked over the *Execute* command.

  "Don't," Mara said. She wasn't looking at the screen. She was watching the power draw metrics on the secondary monitor, her coffee cold beside her keyboard.

  "It's light, Mara. We're collecting photons."

  "We're requesting data packets." She spun her chair around. Her eyes were red-rimmed, three weeks of sleep debt carved into her face. "Look at the background radiation again. The deep field stuff from last night."

  Elias sighed, pulling up the image. The usual cosmic microwave background, but smoothed. Too smoothed. "Compression artifacts. We talked about this. Instrument error."

  "Instrument error doesn't repeat texture patterns across opposite quadrants of the sky. Instrument error doesn't show quantization noise in the hydrogen line that correlates with observational density." She stood up and walked to the screen, tapping the glass over the Centauri system. "The universe is lazy-loaded, Elias. It only renders high-fidelity physics where there's an observer to collapse the wave function. Everything else is low-poly placeholder data until someone looks."

  "And?" Elias kept his hand near the mouse. "That's why we built this array. To look."

  "To look at *our* neighborhood. There's a difference between resolving a star and resolving a system. If we switch this to high-gain interferometry, we aren't just seeing the star. We're forcing the engine to render the planets. The atmosphere. The chemistry."

  "Maybe there's life there."

  "Maybe there isn't," Mara said, her voice dropping. "Maybe there's nothing there because nothing *needs* to be there until we ask. And if we ask for too much detail too quickly, what happens to the budget?"

  Elias laughed, a dry, brittle sound. "You think we're going to crash the universe? That's not science. That's superstition wrapped in coding metaphors."

  "It's resource management. Think about the Fermi paradox. Why is it silent? Not because everyone is dead. Not because they're hiding. But because nobody has looked hard enough to force the rendering of their neighbors yet. Civilizations hit this exact threshold—where their instruments can resolve exoplanet biosignatures—and then they stop. Or they vanish."

  "Or they find out what's there." Elias gripped the edge of the desk. "If we don't push the key, we remain in a solipsistic bubble. We are assuming the substrate is stable regardless of our inquiry. But the only way to test the stability of the substrate is to stress it."

  "If the substrate crashes, we don't get to publish the paper, Elias. We cease."

  "We don't know that. You're extrapolating from spectral noise."

  "I'm extrapolating from the fact that the noise increases when we increase gain," she snapped. "Look at the logs. Every time we tightened the focus on Proxima, the local background variance dropped. Like the system was reallocating cycles to handle our request. It's compensating. If we ask for a full biosignature resolution on a binary system, that's a massive compute cost. Where does it take the cycles from?"

  "From the distant galaxies. From the void."

  "Or from us. From the stability of local constants." She stepped between him and the console. "If the speed of light is a processing limit, and Planck length is the pixel size, what happens when we demand more than the sector can handle? Do we get a patch? Do we get a reset?"

  Elias stood up, matching her height. "You want to stop. You want to leave the question mark forever. 'Maybe there are friends out there.' 'Maybe we are alone.' You want to keep it comfortable."

  "I want to keep us *existing*," Mara said. "There is a decent argument for ignorance if knowledge requires a transaction we can't afford. We are part of the simulation, Elias. We aren't the users. We're the code. Code doesn't get to demand more memory than the developer allocated."

  "Code doesn't get to choose," Elias said softly. He reached around her. "But scientists do."

  "If you turn that on, and the sky goes blank... if the stars flicker because the renderer timed out... you won't just have killed the program. You'll have flagged us as a rogue process."

  "Then let them debug us."

  "Elias."

  He paused, his finger hovering over the key. The hum of the servers seemed to pitch up, just slightly. Or maybe it was the blood rushing in his ears. He looked at the spectral data, the beautiful, suspicious lines that suggested the universe was cheaper than they thought.

  "If there's something out there," Elias said, "it's waiting for us to pay the render cost. If we don't pay, we're just ghosts in a machine talking to ourselves."

  "And if we pay," Mara said, "and the account is empty?"

  Elias looked at her, then back at the blinking cursor. The silence of the room felt heavy, pressurized, like the air before a storm breaks.

  "Then we'll know," he said.

  He pressed the key.
