  ### AI Analysis: The Verbal Dispute Component

  You asked me to identify if part of their dispute is merely verbal. Based on the document above, **yes, a significant portion is verbal**, specifically centering on the definition of **"Object"** and **"Identity."**

  **Why it is verbal:**
  1.  **The Meaning of "Is":** Thorne uses "is" in the sense of *numerical identity* (strict, absolute). Vane uses "is" in the sense of *constitution* or *relative identity*. When Thorne says "The Statue is not the Lump," he means they are two countable items. When Vane says "The Statue is the Lump," he means they are the same matter counted under different rules. They agree on all the physical facts (the hammering, the melting, the zombie), but they disagree on how to *count* the furniture of the universe based on those facts.
  2.  **Quantifier Variance:** This is a classic case of what philosopher Eli Hirsch calls "quantifier variance." Thorne's quantifier ("there exists an object...") ranges over things with specific modal profiles. Vane's quantifier ranges over material continuants regardless of modal profiles. They are effectively speaking different dialects of "Ontology."
  3.  **The "Further Fact":** Thorne demands a "further fact" to distinguish the objects (which he finds in modal properties). Vane argues that asking for a further fact *beyond* the descriptive differences is a category error. The dispute is about whether the question "How many objects are there?" has a single, absolute answer (Thorne) or is relative to a conceptual scheme (Vane).

  **For your novel:** This verbal nature is a great source of tension. They can agree on everything that *happens* (the marble breaks, the person dies), but they will never agree on *what happened* ontologically. They are measuring the world with different rulers and arguing about the length of the table.
