          1.  Death is not loss but seasonal transformation.
          2.  Grief arises from clinging to a fixed self-boundary.
          3.  The sage accepts dissolution without resistance.
      *   **Target Vocabulary:** Autopoiesis, structural coupling, sense-making, embodied world-enactment (non-representational), depersonalization/derealization (clinical phenomenology), self-model.
      *   **Critical Analysis:** For each claim, identify:
          *   What translates without distortion.
          *   What requires stretching/alteration.
