answer: |-
  Dear Friend,

  It is a pleasure to engage with these reflections, for you have laid out a rich tapestry of intuitions that cuts to the heart of promissory obligation. The tension you feel is well-founded, as the cases you describe pull in different directions regarding whether the source of the obligation lies in the will of the promisee, the interest protected, or the act of the promisor. After considering your verdicts, I believe the principle that comes closest to capturing your judgments is what we might call the Voluntary Authority over Interest Principle. This principle states that a promise creates a binding obligation when a promisor voluntarily grants a promisee the authority to demand performance regarding a specific interest of the promisee, provided that the interest remains viable and the undertaking was not extracted under coercive pressure. This formulation attempts to harmonize the insights of both will-based and interest-based theories while respecting the condition of voluntariness.

  Let us trace how this principle illuminates your cases. In the first case of the airport pickup, you voluntarily granted your friend authority over your schedule to serve her interest in safe transport. The inconvenience of traffic does not negate the voluntariness of the initial grant, nor does it extinguish her interest, so the obligation holds. In the second case of the charity dinner, the crucial feature is the lack of voluntariness. Being singled out to avoid embarrassment constitutes a form of social coercion that undermines the validity of the undertaking, meaning no genuine authority was transferred, which explains why you feel unbound despite the organizer's reliance. This distinguishes the first two cases by focusing on the conditions of the undertaking rather than the mere presence of social pressure, as normal social expectations in the first case do not amount to the coercive pressure present in the second.

  The tension you noted between the third case and the fourth and fifth cases is resolved by observing that the principle ties the obligation to the viability of the interest rather than the physical presence or current will of the promisee. In the case of your late mother, the interest you promised to serve was your brother's education, which remains a viable interest even though your mother has passed away. The authority was granted at the moment of promising and persists because the object of the promise survives her. By contrast, in the case of the colleague's secret, the interest was confidentiality, which ceased to be viable the moment she announced her search publicly. Similarly, with the photographs, the interest was your friend's privacy or control over her image. When she told you to keep them, she exercised the very authority you granted her to waive the obligation, dissolving the bond regardless of your insistence. This explains why the obligation lapses in the fourth and fifth cases but survives in the third. Finally, the case of the self-promise fails to generate a full obligation because there is no second party to whom authority is granted. You cannot wrong yourself in the same way because you cannot hold authority over yourself in the distinct interpersonal sense required to create a promissory duty, leaving only feelings of guilt or disappointment rather than a sense of having violated another's right.

  Regarding the new case you proposed, where you promise a small child to bring a gift and the child forgets the promise by the next day, this principle predicts that you remain bound. The child possesses an interest in the gift, and while their capacity to hold authority may be limited, it is generally understood that adults act as trustees for such interests in children. The child's forgetting does not extinguish the interest in receiving the gift, nor does it constitute a waiver of authority. Therefore, unless a guardian intervenes to release you, the obligation persists despite the child's forgetfulness, aligning with the intuition that we owe it to children to keep our word even when they lack the memory to enforce it.

  However, I must offer an honest assessment regarding simplicity. If you seek to preserve a simpler principle, such as a strict interpersonal view where obligations exist only between living agents who can currently exercise will, you would likely need to abandon or reclassify your verdict on the third case regarding your late mother. A simpler model might argue that promissory obligations are strictly relational and dissolve upon the death of the promisee, recharacterizing your duty to your brother as a general moral duty derived from the past promise rather than a surviving promissory obligation. Alternatively, if you prioritize a pure reliance model to simplify the theory, you would have to abandon the verdict that you are bound in the mother's case since the brother does not know and cannot rely, or even in the photograph case if the friend's reliance remained on you keeping them safe. To maintain all your current verdicts, you must accept a hybrid principle that is slightly more complex, acknowledging that authority can be granted over interests that survive the person, but can also be waived by the person while they live. I suspect the verdict on the late mother is the most costly to maintain if theoretical simplicity is your primary goal, as it requires extending the normative bond beyond the living relationship.

  I hope this helps clarify the structure of your commitments. It is a sign of philosophical integrity to wrestle with these inconsistencies rather than smoothing them over prematurely.

  Warmly,

  Your Assistant
