answer: |-
  In Strawson's "Freedom and Resentment," the distinction between excuses and exemptions is not a metaphysical taxonomy of actions but a map of the interpersonal landscape. Its work is to delineate the boundaries of the **participant stance**. Excuses operate within the participant stance; they concede that the agent is a proper subject of demands but argue that the specific action did not express the ill will or indifference that typically warrants a reactive attitude. Exemptions, by contrast, challenge the agent's standing as a participant altogether. They signal that the agent is not a suitable target for the ordinary economy of demands and expectations because they lack the psychological capacities required for ordinary adult relationships.

  The distinction allows Strawson to navigate between the Scylla of optimism (which struggles to explain why we don't blame the insane) and the Charybdis of pessimism (which suggests determinism undermines all blame). By grounding responsibility in the natural human commitment to interpersonal relationships, Strawson argues that we suspend reactive attitudes only when the relationship itself is rendered impossible or radically altered by the agent's condition.

  In the case of the Frontal-Lobe Man, the structural tension arises because the *form* of his agency (lucid, voluntary, expressive of will) mimics a standard participant, while the *etiology and functional capacity* of his will (pathological, indifferent to social bonds) mimic an exempt agent. The friends' inability to cease resenting him highlights the friction between the intellectual recognition of an exemption and the emotional inertia of the participant stance.

  **(a) Causal History vs. Present Incapacity**

  For Strawson, the objective attitude is keyed to the agent's **present incapacity to take part in the economy of demands, expectations, and goodwill**, not merely to the causal history of the will. Strawson is explicitly anxious to avoid the implication that causal determination itself warrants the objective attitude; if causal history were the key, universal determinism would force the objective attitude upon us all, collapsing the participant stance. Exemptions are reserved for psychological abnormalities that make ordinary interpersonal relations impossible.

  In this case, the structural feature doing the work is the agent's **emotional unresponsiveness to social evaluation**. Although the man reasons well about means and ends, the prompt specifies his condition affects "emotional responsiveness and social evaluation" and puts him "beyond the reach of ordinary address." For Strawson, the participant stance relies on a shared sensitivity to the expectations of others. If the neurological condition has destroyed the capacity to care about those expectations—to feel the pull of goodwill or the sting of reproach—then the reciprocity required for the participant stance is broken.

  It follows that, strictly within Strawson's framework, the friends *ought* to adopt the objective attitude. The agent's lucidity is a red herring if it is merely instrumental rationality devoid of moral sensibility. However, the case reveals a lag in the practice: the friends' reactive attitudes are keyed to the *appearance* of participation (the betrayal was deliberate), whereas the justification for the attitude requires the *reality* of participation (the capacity for mutual regard). If the incapacity is present, the objective attitude is the appropriate stance, even if the friends psychologically struggle to achieve it.

  **(b) Reactive Attitudes and Relational Work**

  Strawson's account is naturalistic: reactive attitudes are not chosen strategies but natural human responses. Therefore, a reactive attitude can **occur** even when it cannot do its relational work. However, for an attitude to be **in place** (normatively appropriate within the practice), it must be possible for it to function within the economy of demands.

  The structural feature here is the **predictable unresponsiveness of the agent**. Strawson suggests that reactive attitudes are communicative; they express a demand for regard. If the agent is constitutionally incapable of recognizing or responding to that demand due to pathology, the communication is structurally doomed. In such a scenario, the resentment is psychologically inevitable (as the friends demonstrate) but normatively misplaced.

  Strawson acknowledges that we sometimes feel resentment toward those who are exempt (e.g., a young child or someone in a temporary frenzy), but we typically view this as a failure of our own adjustment to the facts. In this case, the resentment is "in place" only in the sense that it is a natural human reaction to perceived ill will. It is not "in place" in the sense of being a valid move in the moral relationship, because the relationship has been unilaterally severed by the agent's condition. The friends are effectively addressing demands to someone who has lost the ears to hear them.

  **(c) Local Eligibility vs. Global Practice**

  Strawson's global argument is that we cannot abandon the reactive attitudes wholesale without ceasing to be human; the cost to our interpersonal life is too high. However, local questions of eligibility are decided by the **facts of the specific relationship and the psychological capacities of the specific agent**.

  Inside Strawson's framework, the local decision turns on whether the agent is capable of participating in the "ordinary adult inter-personal relationships" that ground the practice. It is a question of **psychological intelligibility**, not utility. We ask: "Can I relate to this person as a moral peer?" If the answer is no (due to exemption), the attitude is suspended, regardless of the consequences.

  A consequentialist about blame would answer the local question differently. For the consequentialist, the structural feature that matters is the **efficacy of the response**. If blaming the Frontal-Lobe Man produces no reform, deters no future action, and causes distress, the consequentialist advises suspending blame because it is useless or harmful. For Strawson, the uselessness of the blame is secondary; the primary reason to suspend it is that the target is not a valid participant. The Strawsonian suspends resentment because the man is not a *who* in the relevant sense, but a *what* (an object of treatment), whereas the consequentialist suspends it because treating him as a *who* yields bad outcomes. In this case, the Strawsonian verdict relies on the diagnosis rendering the agent an object of medical management, whereas the consequentialist verdict relies on the diagnosis rendering blame ineffective.

  **(d) Personal vs. Vicarious Attitudes**

  Yes, a significant distinction turns on the difference between **personal reactive attitudes** (resentment) and **vicarious or moralistic attitudes** (indignation). Strawson notes that personal attitudes are more deeply entrenched in our self-regard and are harder to modify by theoretical or factual considerations than vicarious ones.

  The structural feature doing the work here is the **degree of personal involvement**. The betrayed friend is the direct victim; their resentment is a defense of their own standing and a response to personal injury. This makes the shift to the objective attitude psychologically arduous, even when intellectually warranted. The friend feels the ill will directly, and the "quality of will" displayed (betrayal) is personally devastating.

  A third party, operating with indignation or moral condemnation, is one step removed. Their attitude is based on a general demand for goodwill among members of the community. Because their personal stake is lower, they are better positioned to recognize the **exemption conditions** objectively. A third party who knows the diagnosis can more readily see the man as a patient to be managed rather than a villain to be condemned, because their emotional investment does not cloud the assessment of his capacity.

  Strawson implies that while the *logic* of exemption applies to both, the *psychology* of suspension differs. The friend's continued resentment is a testament to the power of the personal stance, but it does not validate the man's responsibility. The third party's ability to adopt the objective attitude more easily confirms that the man's condition is indeed an exemption: those less emotionally compromised can see that the "participant" is missing from the interaction. Thus, within Strawson's framework, the third party *should* respond differently, not by feeling a different degree of anger, but by more readily substituting the objective attitude for the reactive one, acknowledging that the man is a subject for treatment rather than a partner in morality.
