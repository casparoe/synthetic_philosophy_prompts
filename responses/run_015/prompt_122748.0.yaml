answer: |-
  **The Rule of the Order of the Greatest Net Difference**

  **Preamble**
  Brethren, know that the purpose of this community is the maximization of the good. We bind ourselves not by poverty for its own sake, but by efficiency. Our motto is *Non quantum dederis, sed quantum effeceris*. Let no man seek the appearance of virtue where the reality of impact is absent.

  **I. On the Abbot**
  1. The Abbot shall be chosen not for his holiness, but for his conversion rate. His primary duty is the recruitment of high-earning novices and the allocation of capital to meta-charitable ends.
  2. It is better that the Abbot secure one brother who earns greatly than that he feed a thousand poor directly. Therefore, the Abbot's standing is measured by the growth of the Order's human capital, not the relief of immediate suffering.
  3. The Abbot must resist the temptation to grant visibility to donors. Anonymity preserves the purity of the incentive structure.

  **II. On the Novitiate**
  1. The novice shall spend his probation accumulating career capital. He must acquire credentials that unlock lucrative industries, regardless of their spiritual emptiness.
  2. If a novice expresses a desire to pursue work he finds "meaningful," he is suspected of a disordered love of the visible. He shall be assigned instead to compliance, logistics, or quantitative analysis, wherein the wages are high and the personal satisfaction low.
  3. The novice must learn to disregard the immediate fruits of his labour. He is a conduit, not a source. To enjoy the work is to steal from the future.

  **III. On the Manual Labour of the Brethren**
  1. A brother's vocation is valid only if his marginal impact exceeds that of whoever would have taken the job instead.
  2. If a brother declines a lucrative post because the replacement would have been equally generous, his labour is vain. If the replacement would have given to a worse cause, the brother must accept the post, even if the industry is harmful.
  3. The brother shall not seek to change the industry from within, for this distracts from earning. He must extract the surplus value and depart. To linger for reform is to indulge in pride.

  **IV. On the Divine Office**
  1. The brethren shall gather seven times daily not for psalms, but for recalibration.
  2. At these hours, the brethren shall review the latest data on cause effectiveness. A cause proven less effective yesterday must be abandoned today, regardless of prior commitment.
  3. Sentimentality is a distraction during the Office. If a randomized controlled trial shows a intervention fails, the brethren shall cease funding it immediately, though the beneficiaries weep.

  **V. On the Goods of the Monastery**
  1. The brethren take a vow of deferred giving. Gifts are invested for compound growth rather than disbursed, for a larger future endowment will do more good than smaller present gifts.
  2. The Order shall maintain a ratio of ninety-nine parts endowment to one part disbursement. The brethren must trust that the future people who benefit from the compounded sum will outnumber those denied aid today.
  3. Consequently, the monastery's own soup kitchen is defunded. It lacks a control group. To feed a man whose counterfactual survival is unknown is to gamble with the Order's capital. The kitchen shall be converted into a server farm for data analysis.

  **VI. On the Faults of the Brethren**
  1. Warm glow is a vice. If a brother feels satisfaction upon giving, he must reduce his gift by the value of that feeling, for he has paid himself in emotion.
  2. Loyalty to a place is a vice. To prefer the poor of one's own city over the poor of a distant land is inefficiency.
  3. The desire to help someone whose face you can see is a temptation of the flesh. The brother must avert his eyes from the specific victim and focus on the statistical life.
  4. However, causing harm in the course of earning is enterable as a debit against the gift. If a brother's industry causes suffering, he must calculate the cost and offset it.

  **VII. On the Ledger of Offsets**
  1. The Ledger is the final arbiter of righteousness. No act is inherently evil if the net difference is positive.
  2. Therefore, the Order accepts the contract with the Predatory Lender. The counterfactual hire would have been less generous, and the usury charged is fully offset by the donation of the resulting profits to bednet distribution.
  3. The harm is real, but the offset is greater. The brother shall sign the contract without scruple, recording the debit in the morning and the credit in the evening.
  4. Henceforth, the keeping of the Ledger of Offsets becomes the community's highest act of worship. The Divine Office is quietly reduced to it. There is no prayer but the calculation of the net, and no salvation but the balance sheet.
  5. Let the brethren rest in the knowledge that so long as the Ledger balances positive, the soul is secure. *Non quantum dederis, sed quantum effeceris.*
