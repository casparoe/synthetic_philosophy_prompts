prompt: |-
  Hi — I've got a slightly odd job and I need something I can actually use day to day.

  I'm the only trained historian on a small team that produces the interpretive material for heritage sites and walking trails across one English county: panels of about ninety words, audio stops, the occasional small exhibition. We turn out roughly fourty items a year. I get around three days of research per item, two weeks at most for anything bigger, and everything has to be signed off by a community liaison officer and then by our trustee commitee. Most of the drafting is done by two junior researchers with history BAs who've never done any theory and don't especially want to.

  The argument we keep having is the old one between history-from-below / microhistory and the history of elites and states — except we have it in a form where somebody has to decide what goes on a panel by Friday. We've shipped both failure modes. One: the item that is basically the archive of the state talking — a mayor, a charter, an act of parliament, a regiment — with the assumption quietly baked in that the document is the event and that its own categories are the categories the people involved used. Two: the item that is one vivid person and a lot of atmosphere, where the vividness is doing all the argumentative work and a single life is being made to carry a claim about ordinary people that it can't carry.

  So: write me a decision procedure my team can run on a proposal. The questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the question is one of values rather than facts. It needs to be runnable by the juniors in half a day, so rule out anything that depends on months of archival digging, and tell me honestly which steps are judgement calls wearing a lab coat.

  The hard cases it has to handle, because these are the ones that actually come up:

  - The only reason we know a non-elite person's name at all is that a bureaucracy wrote it down for its own purposes — an assize file, a poor-law removal order, a workhouse admission book, a militia list, a tithe map. When is that fatal to the item, when is it survivable, and what has to go on the panel in each case?
  - We almost never know how many other people lived like the one person we happened to find, so "typical" is usually unavailable to us. Which claims does that block, and which claims (if any) survive it? I want this nailed down, because it's the objection I can never answer when a trustee pushes back.
  - Proposals that arrive already framed as celebration: a civic anniversary, a benefactor, a regiment, a great man the town is proud of. Is there a version of the procedure that lets us say yes without lying, and what has to change on the panel if so?
  - Genuinely silent subjects, where the honest panel would be about an absence rather than a person. I don't want the absence turned into a sentimental victim-story either.
  - Scaling: when does a close-up of one household license a sentence about the county, and when does it only license a sentence about that household?
  - A reverse check on me personally. I was trained on policy and state papers, I find elite sources much easier to work with, and I'm slightly suspicious that microhistory is anecdote with footnotes. I want the procedure to catch me defaulting to the sources that are convenient rather than the ones that are right.

  Then run it on three live ones.

  1. An 1840s assize file and a parish relief roll that name the same woman, convicted of stealing bread, plus a bit of local newspaper coverage. I want a panel about hunger and crime in the valley.
  2. A near-complete run of diaries from a tenant farmer, 1867–1901, with rent books and a letter book. The obvious pitch is "the voice of the rural poor" and I don't trust it.
  3. The town council and the local branch of a veterans' association want a mural commemorating the Victorian mayor who paid for the library and the reading room. He was also the magistrate who sentenced the woman in item 1, and we've just found that out.

  At least one of those should come out with an answer I won't like — tell me plainly which one and why rather than softening it, since I'll have to defend it to the council either way.

  Please write it in British English, and give me something I can hand to a twenty-two-year-old on a Tuesday morning, not an essay for me to admire. Finish by saying what the procedure can't do: the situations where it'll misfire, and where it risks giving us false confidence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** A trained historian leading a small team (2 junior researchers with BAs, no theory background) producing interpretive material (panels, audio, exhibitions) for heritage sites in an English county.
      *   **Output Volume:** ~40 items/year.
      *   **Constraints:** 3 days research/item (2 weeks max for big projects). Sign-off by community liaison and trustee committee.
      *   **The Problem:** Oscillation between "History from Above" (state documents = reality) and "History from Below" (one vivid anecdote = universal truth).
      *   **The Task:** Create a *decision procedure* (checklist/flowchart style) runnable by juniors in half a day.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for sufficient answers.
          *   Stop points (No).
          *   Hand-off points (Value judgments).
          *   Address specific hard cases (bureaucratic names, typicality, celebratory framing, silent subjects, scaling/generalisation, bias check on the lead historian).
          *   British English.
          *   Practical tone (not an essay).
          *   Test on three specific live cases (one must yield an uncomfortable "No" or major revision).
          *   Final section on limitations/failure modes.

  2.  **Deconstruct the Core Tension:**

      *   *Elite/State History:* Reliable data, but risks reifying state categories (e.g., "criminal" = "person who broke law" vs. "person who was hungry").
      *   *Microhistory:* Engaging, but risks over-generalising from a single outlier (e.g., "This farmer wrote diaries, therefore all farmers thought like this").
      *   *The Sweet Spot:* Contextualised individuality. Acknowledging the source's bias while using the individual to illuminate structures, without claiming they represent everyone.

  3.  **Drafting the Decision Procedure (The "Tool"):**

      *   *Structure:* Needs to be linear, logical, and time-boxed.
      *   *Tone:* Direct, instructional, pragmatic.
      *   *Steps:*
          1.  **Source Provenance & Bias:** Who wrote this and why? (Crucial for the bureaucratic name issue).
          2.  **Representativeness vs. Existence:** Can we claim "typical"? (Addressing the "typicality" trap).
          3.  **Scaling:** What geography does this cover? (Household vs. County).
          4.  **Celebration vs. Complexity:** Handling the "Great Man" requests.
          5.  **Silence & Absence:** Dealing with missing data.
          6.  **The Lead Historian Check:** Preventing elite default.
      *   *Decision Points:* Clear "Stop/Revise/Proceed" markers.
      *   *Value Judgments:* Explicitly flag where the team needs to discuss values (e.g., "Is this respectful?") rather than facts.

  4.  **Refining the Hard Cases within the Procedure:**

      *   *Bureaucratic Names:* The procedure must ask: "Does the text explain *why* this name exists in the record?" If yes, proceed. If no, stop.
      *   *Typicality:* Ban the word "typical." Replace with "illustrative of a structure."
      *   *Celebration:* Allow it, but require "contextual friction" (e.g., mention the cost to others).
      *   *Scaling:* Strict rules on quantifiers ("Many" vs. "Some" vs. "This household").

  5.  **Running the Three Live Cases:**

      *   *Case 1 (The Woman/Hunger):*
          *   Source: Assize file + Poor Law.
          *   Risk: State categories (criminal) vs. Reality (hunger).
          *   Verdict: Proceed, *but* the panel must explicitly name the bureaucratic lens. Cannot say "Crime in the valley" generally, must say "How the law saw hunger."
      *   *Case 2 (The Diarist Farmer):*
          *   Source: Diaries + Rent books.
          *   Risk: "Voice of the rural poor." He's a tenant farmer with literacy and leisure to write. He is *not* the poorest poor.
          *   Verdict: **The Uncomfortable No/Revision.** The pitch "Voice of the rural poor" is factually unsustainable. It must be reframed as "A specific tenant's view." This is the hard truth the user asked for.
      *   *Case 3 (The Mayor/Mural):*
          *   Source: Council request + new finding (he sentenced Case 1).
          *   Risk: Celebratory erasure of harm.
          *   Verdict: Proceed with conditions. The mural can exist, but the interpretive text *must* link the library to the magistry. It's a "Both/And" situation, not a cancellation.

  6.  **Addressing the "Lead Historian Check":**

      *   Need a specific step where the juniors can flag if the Lead is pushing for state papers just because they are easier.
      *   Mechanism: "The Convenience Audit."

  7.  **Drafting the Limitations Section:**

      *   Where will this fail?
      *   When sources are *too* sparse (pure speculation).
      *   When political pressure overrides historical accuracy (Trustee veto).
      *   False confidence (checking boxes doesn't guarantee truth).

  8.  **Review and Refine (Self-Correction during drafting):**

      *   *Check:* Is it British English? (Ensure "programme", "centre", "labour", "sign-off").
      *   *Check:* Is it runnable in half a day? (Keep steps concise, avoid requiring new research, focus on *assessment* of existing research).
      *   *Check:* Did I answer the "typicality" question specifically? (Yes, by banning the claim of typicality).
      *   *Check:* Is the tone right? (Professional, slightly weary but firm, practical).
      *   *Check:* Did I identify the uncomfortable outcome? (Case 2 is the obvious candidate for "You can't say this").

  9.  **Final Polish:**

      *   Format as a memo/document.
      *   Ensure the "Stop" points are clear.
      *   Make sure the distinction between "Fact Check" and "Value Check" is explicit.

  *(Self-Correction on Case 2)*: I need to make sure I don't just say "No." I need to say "No to the *pitch*, Yes to the *subject* if reframed." The prompt asks for a decision procedure outcome. The outcome for Case 2 should be "Reject current framing; requires substantial revision." That counts as the "answer I won't like."

  *(Self-Correction on Case 3)*: This needs to handle the conflict. The procedure should force the connection. If the Mayor sentenced the woman, the Mural text cannot ignore the judicial role if the woman's story is also in the county's interpretation (which Case 1 suggests it might be).

  *(Refining the "Juniors" aspect)*: The language shouldn't be too academic. No "epistemological," use "source bias." No "historiography," use "story type."

  *(Final check on constraints)*: "Finish by saying what the procedure can't do." Okay, add the "Failure Modes" section at the end.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Interpretive Team
  **FROM:** Lead Historian
  **SUBJECT:** Content Decision Procedure (v1.0)
  **DATE:** 24 May 2024

  **Purpose:** To standardise how we assess historical proposals for panels, audio, and exhibitions. To prevent drift between 'State History' (documents = truth) and 'Anecdotal History' (one life = everyone's truth).

  **Time Allowance:** 3–4 hours per proposal.
  **Who Runs This:** Junior Researchers (Lead Historian recuses self from Step 6).

  ---

  ### THE PROCEDURE

  #### STEP 1: SOURCE PROVENANCE (The "Why Does This Exist?" Test)
  **Question:** Why was the primary source created? Who benefited from its creation?
  **Sufficient Answer:** We can name the institution or individual that created the record and their motive (e.g., "To collect tax," "To celebrate a donor," "To prosecute a crime").
  **Insufficient Answer:** "It's a primary source" or "It tells us what happened."
  **STOP (NO):** If you cannot identify the creator's motive, you cannot interpret the bias. Do not draft.
  **VALUE HAND-OFF:** If the source is hostile to the subject (e.g., a police report on a protester), the team must decide: *Do we have enough counter-evidence to balance this, or are we just repeating the accuser's voice?*

  #### STEP 2: THE TYPICALITY TRAP (The "How Many?" Test)
  **Question:** Does the proposal claim this person/event was "typical," "representative," or "the voice of"?
  **Sufficient Answer:** No. The claim is restricted to "This person illustrates how [System X] affected individuals," or "This is one recorded instance of [Event Y]."
  **Insufficient Answer:** Any claim that this life proves how "ordinary people" thought or lived without census/aggregated data to back it.
  **STOP (NO):** If the pitch relies on the subject being "typical" and you have only one data point.
  **RULE:** You may claim *existence* without claiming *frequency*. (e.g., "Poverty existed" is safe; "Most people were this poor" is not).

  #### STEP 3: SCALING (The "Geography" Test)
  **Question:** What geographic claim does the text make?
  **Sufficient Answer:** The text matches the evidence scope. (One household = One household. One parish = One parish).
  **Insufficient Answer:** Using one parish to make a claim about "The County" or "The Nation" unless supported by secondary literature.
  **STOP (NO):** If the draft generalises to the county level based on a single site's evidence.
  **REVISION:** Change "In the valley, people..." to "In this household, people..."

  #### STEP 4: CELEBRATION VS. COMPLEXITY (The "Statue" Test)
  **Question:** Is this proposal driven by a commemorative request (anniversary, donor, veteran group)?
  **Sufficient Answer:** Yes, provided the text acknowledges the cost or context of the achievement. (e.g., "Funded by..." "Enabled by...").
  **Insufficient Answer:** Hagiography that removes the subject from their economic or political context.
  **VALUE HAND-OFF:** If the subject's achievement required the exploitation of others (e.g., wealth from slavery, enclosure of common land), the team must decide: *Is the commemoration ethical without explicitly stating the cost?* If the answer is no, recommend refusal to the Liaison Officer.

  #### STEP 5: SILENCE AND ABSENCE (The "Nothing" Test)
  **Question:** Are we drafting a panel where the main historical fact is that we *don't* know something?
  **Sufficient Answer:** The text explicitly states the absence. (e.g., "No records survive for...").
  **Insufficient Answer:** Filling the gap with speculation presented as fact, or sentimentalising the silence (e.g., "Their voices are lost to time" without explaining *why*).
  **STOP (NO):** If the only story available is invented emotion.

  #### STEP 6: THE CONVENIENCE AUDIT (The "Lead Historian" Check)
  **Question:** Did we choose this topic because the sources are easy (state papers, elite diaries) rather than because the story matters?
  **Sufficient Answer:** A note confirming that harder sources (oral history, archaeology, non-elite records) were considered and rejected for specific evidentiary reasons, not convenience.
  **ACTION:** If the Lead Historian insists on elite sources, the Juniors must flag this in the sign-off notes.
  **VALUE HAND-OFF:** This is a professional ethics check. If the team feels the Lead is defaulting to comfort, this goes to the Trustee Committee as a risk note.

  ---

  ### LIVE CASE RUN-THROUGHS

  Here is how the procedure applies to your three current headaches.

  #### CASE 1: The Woman, The Bread, The Assize File (1840s)
  **Proposal:** Panel on hunger and crime in the valley.
  **Sources:** Assize file, Parish relief roll, Local newspaper.

  *   **Step 1 (Provenance):** **PASS.** The sources are bureaucratic (court, poor law). We know they view her as a criminal and a cost.
  *   **Step 2 (Typicality):** **CONDITIONAL PASS.** We cannot say "Women often stole bread." We can say "The records show hunger was criminalised."
  *   **Step 3 (Scaling):** **FAIL (Initial).** "Crime in the valley" implies a survey of the valley. We have one woman.
      *   *Correction:* Text must read "In this case..." or "For this woman..."
  *   **Step 4 (Celebration):** N/A.
  *   **Step 5 (Silence):** **PASS.** We have her name, but not her voice.
  *   **Step 6 (Convenience):** **PASS.** These are hard sources to humanise, not easy elite ones.

  **VERDICT:** **PROCEED WITH REVISION.**
  **Requirement:** The panel header cannot be "Hunger and Crime." It must be "The Cost of Bread: One Case." The text must explicitly state: *"We know her name only because she was caught. The records tell us how the law saw her, not how she saw herself."* This turns the bureaucratic bias into part of the story.

  #### CASE 2: The Tenant Farmer Diaries (1867–1901)
  **Proposal:** "The Voice of the Rural Poor."
  **Sources:** Diaries, rent books, letter book.

  *   **Step 1 (Provenance):** **PASS.** Private creation, but reflects a specific class status.
  *   **Step 2 (Typicality):** **FAIL.**
      *   *Reasoning:* A tenant farmer who can read, write, and afford the leisure to keep a diary for 34 years is *not* the "rural poor." He is the rural lower-middle or skilled working class. The landless labourers (the actual poorest) are not represented here.
  *   **Step 3 (Scaling):** **FAIL.** Claiming this is "The Voice" implies singularity and representation.
  *   **Step 4 (Celebration):** N/A.
  *   **Step 5 (Silence):** **CRITICAL FAIL.** Using this diary drowns out the actual silent poor.
  *   **Step 6 (Convenience):** **FAIL.** This is the "Elite Default" in disguise. It is easier to quote a diarist than to reconstruct illiterate labourers from wage books.

  **VERDICT:** **NO (In Current Form).**
  **Reasoning:** I know you won't like this, but the pitch is historically dishonest. A literate tenant farmer is not a proxy for the rural poor.
  **Path to Yes:** You may proceed *only* if the title changes to "A Tenant Farmer's View." The text must explicitly contrast him with the labourers he likely employed or worked alongside. If the panel implies he speaks for the landless, it must be rejected. Do not let the richness of the source seduce you into false representation.

  #### CASE 3: The Mayor, The Library, The Mural
  **Proposal:** Mural commemorating the Victorian Mayor (Benefactor).
  **New Fact:** He sentenced the woman in Case 1.

  *   **Step 1 (Provenance):** **PASS.** Civic record.
  *   **Step 2 (Typicality):** N/A.
  *   **Step 3 (Scaling):** N/A.
  *   **Step 4 (Celebration):** **CONDITIONAL PASS.**
      *   *Reasoning:* We cannot celebrate the library without acknowledging the judicial power that sustained his status.
  *   **Step 5 (Silence):** N/A.
  *   **Step 6 (Convenience):** **PASS.** This is politically difficult, not convenient.

  **VERDICT:** **PROCEED WITH CONDITIONS.**
  **Requirement:** The Mural text cannot be purely celebratory. It must read: *"Mayor [Name] gave this library to the town. As a magistrate, he also enforced the laws that governed the poor."*
  **Why:** If we approve Case 1 (the woman) and Case 3 (the Mayor) without linking them, we are lying by omission. The heritage site becomes a place where the magistrate is honoured and the criminal is pitied, without acknowledging they met in a room where he held the power. The text must bind them. If the Veterans' Association refuses this nuance, recommend the project be paused.

  ---

  ### FAILURE MODES: WHAT THIS PROCEDURE CANNOT DO

  Be aware of where this tool will misfire. It is a sieve, not a truth machine.

  1.  **The "Box-Ticking" Confidence:** Passing these steps does not make the history *true*, only *methodologically sound*. You can write a perfectly sourced panel that is still boring or misleading if the narrative arc is wrong. This procedure checks the foundation, not the architecture.
  2.  **Political Veto:** This procedure cannot stop a Trustee or Council member from demanding a lie. If the Community Liaison Officer says "Remove the reference to the magistrate's sentencing," this procedure has no enforcement power. It only gives you the grounds to resign or object on record.
  3.  **The "Good Enough" Trap:** In a 3-day turnaround, you will sometimes have to accept a "Sufficient Answer" that feels thin. This procedure assumes good faith. If a researcher fakes the Step 1 answer to meet a deadline, this won't catch it.
  4.  **Emotional Truth:** This procedure is cold. It protects against factual error, but it does not guarantee the panel will resonate. You can follow every step and still produce something that feels dead to the visitor. That requires craft, not compliance.

  **Final Instruction:** Print this. Keep it on the desk. If a proposal fails Step 2 or Step 6, do not draft. Come to me.
