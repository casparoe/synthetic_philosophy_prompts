      *   *New kind of empire:* While the mechanism is new, the underlying dynamic (extraction without fair return) fits his existing critique of exploitative trade relationships.
      *   *Synthesis:* He would likely view it as a digital mercantilism. The "raw material" (data) is taken without fair compensation, violating the natural liberty of the market and the principle that value stems from labor (user activity).

