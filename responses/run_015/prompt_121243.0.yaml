  Smith would likely diagnose this not as a novel empire, but as a digital resurrection of the mercantilist exploitation he famously condemned, because the underlying mechanism remains the unilateral extraction of value from the periphery to enrich a concentrated metropole. Since he grounded wealth in the produce of labor, he would argue that users generating data are performing unpaid work, making the tech firms' hoarding of profits a violation of natural liberty rather than a legitimate market outcome. He would view these corporations as modern chartered monopolies using asymmetrical power to bypass the mutual benefit that defines true commerce, treating human behavior as a resource to be seized rather than a contribution to be compensated. Ultimately, he would frame this as a corruption of free trade where the invisible hand is replaced by an extractive grip that denies the Global South the gains of their own productive activity.
