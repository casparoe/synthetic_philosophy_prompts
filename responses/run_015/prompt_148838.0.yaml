answer: |-
  ### Exam Question

  **Philosophy of Language – Final Seminar Assessment**
  **Time Allowed:** 60 Minutes
  **Expected Length:** Approx. 1200 words

  **Question:**

  Putnam's Twin Earth thought experiment relies on a sharp binary: Earth has H2O, Twin Earth has XYZ. But consider 'Gradient Earth'. Here, the clear, drinkable liquid varies continuously across regions—from pure H2O in the north to something chemically distinct (XYZ-like) in the south, with endless mixtures in between. Inhabitants in the middle zones cannot perceptually distinguish their local liquid from their neighbours', yet the chemical composition shifts gradually.

  Does this Gradient Earth scenario undermine the standard Twin Earth argument for semantic externalism? Or does it merely force us to 'indexicalise' externalism, such that the content of 'water' is fixed by the speaker's specific location in the chemical gradient rather than a binary planet-wide essence?

  In your essay, assess whether the gradient case collapses externalism into internalism, or if it reveals a more nuanced form of environmental dependence.

  ***

  ### Model Answer

  The Gradient Earth thought experiment pushes the Twin Earth intuition to its breaking point. Putnam's original case works because it offers a clean switch: same psychology, different chemistry, different extension. We intuitively say the meaning changes because the stuff changes. But Gradient Earth removes the clean switch. If chemical composition shifts continuously, there is no sharp line where 'water' stops being water and starts being something else. This threatens the binary intuition underpinning the original argument.

  If meaning depends on external facts, but those facts are vague or continuous, does the meaning become vague too? A critic might argue this undermines externalism because it makes content indeterminate. If I stand in the middle zone, is my term 'water' referring to H2O, XYZ, or a hybrid? If there's no fact of the matter, then perhaps meaning isn't fixed by the environment at all, but rather by our internal conceptual schemes which treat the liquid as uniform regardless of chemistry. This would push us back toward internalism.

  However, an indexicalised version of externalism can save the phenomenon. We don't need a binary planet-wide essence. Instead, we can say the content of 'water' is indexical to the speaker's immediate environment. Just as 'here' refers to wherever the speaker is, 'water' refers to the dominant liquid structure in the speaker's immediate vicinity. On this view, two speakers in different zones of Gradient Earth have different contents for 'water', even if their psychological states are identical. The content is fixed by their specific position in the gradient. This preserves externalism because the content still depends on the world, not just the head.

  Does this collapse into internalism? Not necessarily. Internalism claims meaning is determined solely by intrinsic psychological states. Indexical externalism admits psychological states are identical across the gradient, but insists the content differs due to location. The difference is still external. However, one serious objection remains. If the gradient is continuous, where does one zone end and the next begin? This looks like a Sorites paradox. If externalism requires a precise boundary for content determination, and the world offers none, then externalism might be demanding precision the world doesn't supply.

  Yet, this objection might actually strengthen externalism. It shows that environmental dependence isn't a magic switch but a continuous covariance. Meaning tracks the environment even when the environment is messy. We don't need sharp boundaries in nature to have externalist content; we just need a causal connection between the speaker and the local stuff. The gradient case doesn't kill externalism, it just forces us to drop the simplistic binary model. We must accept that content can be context-sensitive in a granular way. Ultimately, Gradient Earth shows that externalism is robust enough to handle vagueness, provided we accept an indexical framework. The meaning isn't in the head, even if the map of the world is blurry.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Identifying the threat to binary intuition (6 marks)**
  *   **A (5-6 marks):** Clearly explains how the continuous variation disrupts Putnam's clean H2O/XYZ switch. Notes that without a sharp boundary, reference becomes indeterminate unless modified.
  *   **B (3-4 marks):** Mentions Putnam's binary setup but doesn't fully explain why the *gradient* specifically causes a problem for reference determination.
  *   **C (0-2 marks):** Fails to identify the binary intuition or treats the gradient as identical to the original Twin Earth case.

  **2. Indexicalised externalism vs. internalism collapse (6 marks)**
  *   **A (5-6 marks):** Articulates the 'indexical' solution (content fixed by local position) and argues why this remains externalist (content differs despite identical psychology).
  *   **B (3-4 marks):** Describes the indexical option but wavers on whether it counts as externalism or slips into internalism without justification.
  *   **C (0-2 marks):** Ignores the indexical option or claims externalism is impossible here without argument.

  **3. Addressing a serious objection (6 marks)**
  *   **A (5-6 marks):** Raises a strong objection (e.g., Sorites/vagueness problem, or that continuous dependence strengthens externalism) and offers a reply.
  *   **B (3-4 marks):** Mentions an objection (like vagueness) but doesn't resolve it or explain its impact on the theory.
  *   **C (0-2 marks):** No objection raised, or the objection is trivial (e.g., "it's too confusing").

  **4. Clarity, precision, and originality (7 marks)**
  *   **A (6-7 marks):** Engages directly with the Gradient twist. Does not just summarise Putnam/Burge. Writing is sharp, precise, and flows well.
  *   **B (4-5 marks):** Competently describes standard Twin Earth and Arthritis cases but treats the Gradient scenario as an afterthought. Good writing but less engagement with the specific prompt.
  *   **C (0-3 marks):** Pure summary of standard texts. Confusing structure or imprecise terminology.

  **Note on Grading:**
  To get an **A**, the student *must* engage with the Gradient Earth modification. A paper that recites Putnam and Burge perfectly but ignores the continuous variation aspect cannot score higher than a **B**, regardless of how well written it is. We're testing their ability to think on their feet, not just their memory of the readings.

  Cheers, and good luck marking these. Hope theres not too many scripts to get through!
