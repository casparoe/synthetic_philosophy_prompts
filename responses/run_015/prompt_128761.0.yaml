      *(Self-Correction during drafting)*: I need to be careful about the "0.99" argument. The user is right that *if* the derivability conditions hold, 0.99 doesn't save you. The point is that probabilistic agents *do not satisfy the derivability conditions*. Specifically, they fail the "Necessitation" rule ($\vdash \phi \implies \vdash \square \phi$) because they aren't deductively closed. I must emphasize this.

