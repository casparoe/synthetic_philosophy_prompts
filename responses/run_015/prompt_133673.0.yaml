          *   *Epistemology:* Introspection is reliable. If I say I want this, it's mine.
          *   *Normative:* Negative liberty (freedom from interference).
          *   *Underdetermination:* Compatible with biological essentialism *but also* compatible with a certain kind of libertarian constructivism (I constructed myself, leave me alone). It assumes the *current* context is neutral enough for choices to be free.
      *   **Stance 2: 'Quota for Parity' (The Radical Feminist view):**
          *   *Ontology:* Structural Realism. Structures determine agents.
