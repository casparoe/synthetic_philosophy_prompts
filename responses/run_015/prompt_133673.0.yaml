      *   *Explanation B (Radical/Structural):* Preferences are adaptive/conditioned. Parity is the metric of justice. (Implies social constructionism + representational justice).
      *   *The Gap:* Both assume a binary between "real" and "fake" preferences. Both struggle with the ontology of *how* preferences form within structures without erasing agency.

  3.  **Step 1: Brainstorming the "Middle View" (Structural Preference Pluralism):**
