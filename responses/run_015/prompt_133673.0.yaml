      *   "Path-dependence": Current choices are constrained by past institutional arrangements (even if those arrangements are now gone, their effects linger in socialization, expectation, self-concept).
      *   "Pluralism": Acknowledges multiple valid ways of valuing work, not just income or status, but also care, autonomy, etc., which are gendered.
      *   Key Ontological Shift: Move from *preference satisfaction* (welfare economics) to *preference formation conditions* (social ontology).

  4.  **Step 2: Reconstructing the Implicit Commitments:**
