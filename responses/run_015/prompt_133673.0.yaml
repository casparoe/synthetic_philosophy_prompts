      *   **Topic:** Welfare-state gender policy (specifically the Nordic paradox: egalitarian policies vs. high occupational segregation).
      *   **Problem:** Stuck on a puzzle regarding the interpretation of preferences (biological/essentialist vs. socially constructed/structural).
