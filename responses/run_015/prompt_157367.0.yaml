  **OFFICE OF COUNTERFACTUAL RISK ASSESSMENT (OCRA)**
  **ADVISORY NOTICE 902-X: DECISION-THEORETIC HAZARDS**
  **EFFECTIVE DATE: IMMEDIATE ACROSS ALL ACCESSIBLE BRANCHES**

  **I. DEFINITIONS**
  For the purposes of this Advisory, a "Counterfactual Agent" is defined as any entity possessing predictive accuracy exceeding 99.9% regarding subject decision nodes in causally isolated timelines. "Accessible Worlds" refer to branching realities wherein the Citizen retains agency. "Transactional Leakage" occurs when information regarding a subject's hypothetical conduct influences physical conditions in the actual timeline. Citizens are advised that ignorance of modal realism does not exempt one from liability arising from cross-branch dependencies.

  **II. THE XOR BLACKMAIL MECHANISM**
  Citizens are warned of a prevalent schematic wherein a Counterfactual Agent transmits a demand for funds if and only if (Property Damage Exists) XOR (Citizen Complies). Upon receipt of such demand, the Citizen occupies an epistemic state where compliance correlates strictly with the absence of property damage, while refusal correlates strictly with the presence of property damage. 

  OCRA emphasizes that compliance purchases favorable evidence but exerts no causal leverage over the physical state of the property. However, under Section 4(b), refusing payment constitutes an admission of liability for damages in the actual branch. Citizens must not conflate evidential utility with causal efficacy. Payment is classified as a voluntary contribution to a predictive model rather than a remediation service.

  > **CASE STUDY 44-C: THE PARALLEL-BRANCH PREDICTOR**
  > *Citizen K received a letter demanding $1,000. The sender claimed transmission occurred iff (Basement Flooded) XOR (K Pays). Citizen K reasoned that paying ensured the basement was dry, as the letter would not have been sent if both conditions were false. K paid. Subsequent inspection revealed the basement was dry. OCRA ruled that K incurred a financial loss without mitigating physical risk, as the flood status was determined prior to transmission. K was fined for unauthorized interaction with a non-causal agent.*

  **III. COUNTERFACTUAL MUGGING RESPONSE PROCEDURES**
  Distinct from XOR scenarios, Counterfactual Mugging involves a stochastic event (e.g., a coin flip) where reward distribution in the inaccessible branch is contingent upon compliance in the accessible branch. If the coin lands Tails (Actual), the Agent requests payment. If the coin lands Heads (Counterfactual), the Agent offers a reward predicated on whether the Citizen *would have* paid in the Tails scenario.

  Citizens are instructed that failure to comply in the Actual Branch constitutes a forfeiture of assets in the Counterfactual Branch. While the Counterfactual Branch is causally inaccessible, OCRA regulations treat the expected utility loss as an administratively cognizable injury. Protocols require Citizens to maintain liquidity sufficient to satisfy demands arising from low-probability branches to maximize aggregate branch-weighted welfare.

  **IV. CITIZEN OBLIGATIONS UNDER COMPETING REASONING FRAMEWORKS**
  To ensure regulatory compliance, Citizens must adopt a pre-commitment strategy valid across all possible worlds. Citizens are required to treat branch-weighted harm as administratively equivalent to actual harm. Consequently, a decision optimized for causal independence in the actual world may be deemed negligent if it reduces utility in counterfactual worlds where the Citizen retains beneficiary status. 

  OCRA recommends the filing of Form 10-UDT (Universal Decision Theory) prior to engaging with any Agent claiming omniscience. Failure to pre-commit to non-payment in blackmail scenarios, or payment in mugging scenarios, may result in audits of the Citizen's rationality coherence. Jurisdiction extends to any decision process that could have been simulated by a regulated entity.

  **DISCLAIMER**
  *The Office of Counterfactual Risk Assessment assumes no liability for damages incurred in branches where this Advisory was not distributed. However, please note that injuries sustained in counterfactual timelines where the Citizen failed to comply with this Advisory are considered substantively equivalent to actual injuries for the purpose of tax deductions and grief counseling eligibility. Jurisdiction is hereby asserted over all events that did, do, or would have occurred.*
