  3. They assert "At least one is Buildable" and tax the parcel, holding that the disjunction is supertrue while no individual lot is determinately Buildable or discoverable across all admissible sharpenings.

  4. The divergence depends on whether truth requires a specific truth-maker (epistemicism) or merely stability across precisifications (supervaluationism), and if the items lined up on a single scale, constraint (ii) would fail because the highest item would be F on every sharpening.

  5. An epistemicist would attack the case as rigged by arguing the statute merely forces a decision, not a truth, but if that attack fails, it shows vagueness can create logical truths without individual truth-makers.
