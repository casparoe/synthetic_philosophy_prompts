answer: |-
  To ensure your technical background is precise, we must first distinguish the objects these theorems analyze. While both address collective choice, they operate on different functional mappings:

  *   **Arrow's Impossibility Theorem** concerns **Social Welfare Functions (SWF)**. The input is a profile of individual preference orderings; the output is a complete social *ranking* of all alternatives.
  *   **The Gibbard–Satterthwaite (GS) Theorem** concerns **Social Choice Functions (SCF)**. The input is a profile of individual preference orderings; the output is a single *winner* (or a set of winners).

  Both theorems assume an **Unrestricted Domain** (voters can hold any transitive preference ordering) and require at least **three alternatives**. Both conclude that if you demand certain "fairness" properties, the only remaining solution is a **Dictatorship** (one voter determines the outcome regardless of others).

  Here is the precise technical comparison you need.

  ### 1. Independence of Irrelevant Alternatives (IIA) vs. Strategy-Proofness (SP)

  The core of your piece rests on understanding that while both axioms restrict the voting rule, they restrict it in fundamentally different dimensions: one structural, the other behavioral.

  **Arrow's Independence of Irrelevant Alternatives (IIA)**
  IIA is a condition of **structural consistency**. It requires that the social ranking between any two alternatives, $x$ and $y$, depend *only* on the individual voters' rankings of $x$ and $y$.
  *   *Formal definition:* If two preference profiles coincide on the relative ranking of $x$ and $y$ for every voter, then the social ranking must coincide on $x$ and $y$.
  *   *Intuition:* The social preference between Coke and Pepsi should not change just because someone changed their mind about Sprite. IIA prevents "spoiler effects" from altering the relative social ordering of existing options. It is a constraint on the *aggregation mechanism's logic*.

  **Gibbard–Satterthwaite's Strategy-Proofness (SP)**
  SP is a condition of **incentive compatibility**. It requires that truth-telling be a dominant strategy for every voter.
  *   *Formal definition:* For any voter $i$, and any preference profile of the other voters, voter $i$ cannot obtain a strictly more preferred outcome by submitting a false preference ordering than by submitting their true preference ordering.
  *   *Intuition:* No voter should ever benefit from lying. If a system is not strategy-proof, there exists at least one scenario where a voter is better off voting tactically (e.g., voting for a less-preferred candidate to prevent a worst-case winner). It is a constraint on the *voters' game-theoretic incentives*.

  ### 2. How the Substitution Shifts the Conclusion

  The prompt notes a shift from Arrow's claim ("no rule satisfies all axioms") to GS's claim ("only strategy-proof rules are dictatorial"). Technically, both theorems conclude that **dictatorship is the only rule that satisfies the respective axioms.** The "shift" is not in the final verdict (Dictatorship), but in the *nature of the impossibility* revealed by swapping IIA for SP.

  **Arrow: The Impossibility of Coherent Aggregation**
  Arrow combines IIA with **Pareto Efficiency** (if everyone prefers $x$ to $y$, society must prefer $x$ to $y$).
  *   *The Conflict:* Arrow proves that you cannot construct a social *ranking* that is simultaneously consistent (IIA), respectful of unanimity (Pareto), and democratic (Non-Dictatorial).
  *   *The Takeaway:* The "public will" is logically incoherent. You cannot aggregate individual rankings into a social ranking without violating basic consistency conditions, unless one person dictates the ranking.

  **Gibbard–Satterthwaite: The Impossibility of Honest Implementation**
  GS combines SP with **Surjectivity (Onto)** (every candidate must have a chance to win).
  *   *The Conflict:* GS proves that you cannot construct a social *choice* (winner) that is simultaneously immune to manipulation (SP), allows anyone to win (Onto), and democratic (Non-Dictatorial).
  *   *The Takeaway:* The "honest vote" is not an equilibrium. Any non-dictatorial system that picks a winner creates scenarios where lying pays off.

  **The Technical Bridge:**
  Why does swapping IIA for SP lead to the same dictatorial conclusion?
  There is a deep link known as the **Muller–Satterthwaite Theorem**, which shows that for Social Choice Functions, **IIA + Pareto Efficiency implies Strategy-Proofness.**
  Therefore, GS can be viewed as a strengthening of Arrow's result in the context of picking a winner. By demanding Strategy-Proofness directly, GS bypasses the need for IIA but arrives at the same destination: the only way to guarantee voters never want to lie is to let one voter decide everything. If you remove the dictator, you introduce the possibility that a voter's truthful ballot leads to a worse outcome than a tactical one.

  ### 3. Which is the More Serious Obstacle?

  For a piece on why voting systems get **gamed**, the **Gibbard–Satterthwaite theorem is the more serious obstacle.**

  Here is the justification for that verdict:

  **1. Practicality vs. Philosophy**
  Arrow's theorem is a philosophical crisis; it suggests that a coherent "social welfare ordering" may not exist. However, real-world elections rarely output a full social ranking; they output a winner. A system can violate IIA (like Instant Runoff Voting or Borda Count) and still function as a legitimate election method. Voters generally accept that the ranking of losers might be inconsistent.
  GS, however, attacks the *stability* of the winner. If a system is not strategy-proof, the election outcome depends not on the true will of the people, but on the sophistication of their strategizing. This directly validates your premise that systems get "gamed."

  **2. Inevitability of Manipulation**
  Arrow allows for non-dictatorial systems if you are willing to drop IIA. Many common voting systems (Borda, IRV) do exactly this; they are "fair" (non-dictatorial) but violate IIA.
  GS closes this escape hatch for the specific goal of *resistance to manipulation*. It states that **any** non-dictatorial voting system (that allows at least 3 candidates to win) is *necessarily* manipulable. There is no "second best" option that is perfectly resistant. You cannot design a system that is both fair and immune to gaming; you must choose between fairness (non-dictatorship) and honesty (strategy-proofness).

  **3. The Burden on the Voter**
  Under Arrow's constraints, the failure is in the *counting method*. Under GS, the failure is forced onto the *voter*. Because no non-dictatorial system is strategy-proof, rational voters are compelled to become game theorists. They must poll, guess, and hedge. This transforms voting from an expression of preference into a strategic calculation, eroding the normative legitimacy of the election result.

  **Conclusion for your piece:**
  While Arrow explains why aggregating preferences is logically fraught, Gibbard–Satterthwaite explains why **honesty is a losing strategy.** For a narrative focused on gaming, GS is the definitive technical proof that manipulation is not a bug of specific systems (like Plurality), but a feature of *all* non-dictatorial collective choice mechanisms.
