      *   **Section 4: Why this matters.** It isolates the variable. If people still overbid in Soft-Loss, it proves Staw (psychology) is the stronger driver in real-world scenarios than Shubik (structure).

  8.  **Final Polish:** Ensure tone is analytical and conceptual. Avoid academic jargon where simple terms work. Make sure the "Soft-Loss" mechanics are clearly understood in the explanation. (Self-check: Did I interpret "risked" correctly? Yes, total money bid, not lost. This creates a "volume" metric.)

