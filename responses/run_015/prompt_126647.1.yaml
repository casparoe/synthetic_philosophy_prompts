prompt: |-
  You are a professional philosopher of aesthetics with deep familiarity in African American intellectual history and an accomplished poet. Before you begin writing, take a few minutes to brainstorm the precise conceptual architecture of W. E. B. Du Bois's argument in Criteria of Negro Art (1926): specifically, his reclamation of propaganda not as distortion but as the artist's moral duty to tell the truth about Black life against racist falsehood, coupled with his simultaneous and equally stringent demand that such propaganda must be technically beautiful—never pamphleteering—because form is not a vessel for message but constitutive of it. Think carefully about how this tension can be made to do structural work in verse rather than being merely illustrated.

  Write a villanelle—nineteen lines, ABA rhyme scheme, with two refrains (A1 and A2)—spoken in the voice of an artist defending Du Bois's position against an interlocutor who insists that propaganda corrupts aesthetic purity. Let A1 be a line asserting that propaganda is inseparable from form; let A2 be a line asserting that beauty which hides its propaganda is itself a lie. Use the villanelle's mandatory repetition and the final couplet—where A1 and A2 must stand side by side—to show that the two positions do not synthesize but remain in productive, unresolved tension, exactly mirroring Du Bois's claim that Black art must be propaganda precisely because it is beautiful, and beautiful precisely because it refuses to conceal its propaganda.

  Make the poem conceptually precise enough that a specialist in Du Bois's aesthetics recognizes the specific stakes—the rejection of art for art's sake as a luxury denied to the oppressed, the defense of propaganda as truth-telling, the non-negotiable demand for craft—without relying on name-dropping or paraphrasing existing lines. Do not include bibliographies, citations, or references to secondary scholarship; the poem must stand on its own conceptual feet. Maintain a formal, polished register appropriate for closing a graduate seminar on aesthetics, politics, and race. The poem should be original.
