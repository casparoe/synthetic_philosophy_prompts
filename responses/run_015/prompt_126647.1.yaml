  No form is free of the truth it must pursue.
  The line must cut like steel, both sharp and bright.
  Beauty that hides its purpose is untrue.

  For those whose lives are bound by racial plight,
  No form is free of the truth it must pursue.
  Where falsehood wears the mask of color white.
  Beauty that hides its purpose is untrue.

  So let the craft be perfect, pure and right,
  No form is free of the truth it must pursue.
  And let the message burn with moral might.
  Beauty that hides its purpose is untrue.

  No form is free of the truth it must pursue.
  Beauty that hides its purpose is untrue.
