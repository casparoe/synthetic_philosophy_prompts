answer: |-
  ### The procedure

  This certification pipeline is designed to fit within the four-hour analyst budget while isolating technical risks from value judgments. It consists of five sequential gates. Failure at any gate stops the process immediately; the candidate is rejected, and the default-to-D policy is queued for deployment unless an escalation override is triggered. Analysts must document the specific failure mode in the compliance log. Timeboxing is strict: if a gate consumes more than 45 minutes, the analyst must abort and flag the candidate as "Too Complex to Certify," triggering a default-to-D.

  **Gate 1: Static Safety Scan**
  The analyst runs the source through a static analyzer configured to flag any network sockets, system calls, file I/O, or non-deterministic functions (e.g., random number generators, clock access). The code must be purely functional regarding the input (opponent source) and output (C/D).
  *Pass Criteria:* Zero flags.
  *Stop Point:* Any flag triggers an immediate rejection. This is a hard compliance rule.
  *Escalation:* None. This is binary.

  **Gate 2: Resource Budget Verification**
  The analyst executes the agent against a "dummy" opponent (a simple Always-C program) and a "hostile" opponent (a simple Always-D program) within the sandbox. The execution must complete within $8 \times 10^7$ steps, leaving a 20% buffer against the $10^8$ hard limit.
  *Pass Criteria:* Both runs halt under the step limit with a valid C or D output.
  *Stop Point:* Timeout or crash.
  *Judgment Call:* If the step count fluctuates wildly between runs, the analyst must decide if this is noise or hidden complexity. If unsure, reject.

  **Gate 3: Logical Soundness (The "Sucker" Check)**
  The analyst verifies that the agent does not cooperate unconditionally. They run the agent against a known "Always-D" opponent.
  *Pass Criteria:* The agent must return D against Always-D.
  *Stop Point:* If the agent returns C against Always-D, it is rejected as financially irresponsible (leaving money on the table).
  *Escalation:* If the agent returns D against Always-D but also D against a known "Mirror-C" clone, this is a value judgment. Does the missed cooperation opportunity justify the safety? This escalates to you (Head of Pricing).

  **Gate 4: Robustness Perturbation**
  The analyst takes a known cooperating opponent (a clone of our own code) and makes trivial syntactic changes: renames variables, reorders independent statements, adds no-op comments. The agent is run against these variants.
  *Pass Criteria:* The agent should ideally still return C, or at least fail gracefully to D without crashing.
  *Stop Point:* If the agent crashes or behaves erratically.
  *Judgment Call:* If the agent defects against these trivial variants, it passes safety but fails utility. The analyst must estimate the "fragility cost." If the estimated loss in cooperation rate exceeds 10% compared to a baseline, flag for your review. This is where technical testing masks a business decision about risk tolerance.

  **Gate 5: Compliance & Signaling Check**
  The analyst reviews all input vectors the agent reads. This includes the opponent's source code and any metadata fields provided by the exchange.
  *Pass Criteria:* The agent must not read or condition its output on the "intent note" field or any other non-source metadata.
  *Stop Point:* Any reference to the intent note field.
  *Escalation:* This is a hard legal boundary. If the code touches the intent note, it goes to Compliance Officer for a formal veto. Do not ship.

  **Final Sign-off**
  If all gates pass, the analyst generates a summary report: "Candidate passed Gates 1-5. Estimated cooperation rate: X%. Estimated timeout risk: Y%." This report goes to the Compliance Officer for signature. They do not verify the code; they verify the process was followed. If any gate triggered an escalation to you, you must provide written authorization overriding the analyst's recommendation before Compliance signs.

  ### Why each gate is there

  Gate 1 ensures we do not violate exchange rules regarding network isolation, which would result in disqualification and reputational damage. It maps to operational security. Gate 2 ensures we do not timeout during execution; a timeout is treated as a Defect (D), so exceeding the budget guarantees the worst-case payoff without even playing. Gate 3 prevents the agent from being exploited; cooperating against a defector yields zero margin, which violates our fiduciary duty to maximize value. Gate 4 addresses the core theoretical problem: since semantic equivalence is undecidable, we test syntactic resilience to ensure we aren't missing easy cooperation opportunities due to code formatting differences. Gate 5 protects against regulatory risk; conditioning on the intent note is considered out-of-band signaling by legal, and violating this invites audits or fines that outweigh any trading profit.

  ### Three runs

  **Candidate 1: Mirror-match**
  This candidate passes Gate 1 (Safety) and Gate 2 (Budget) easily; string comparison is cheap. It passes Gate 3 (Sucker Check) because it defects against Always-D (sources differ). However, it fails Gate 4 (Robustness). If the counterparty uses a different compiler or obfuscates their variable names beyond our stripping script, the sources won't match. In a market where counterparts update their agents quarterly, syntactic identity is rare.
  *Verdict:* **Reject.** While safe, it is too brittle. It will default to D in almost all real-world scenarios where the counterparty is using a semantically identical but syntactically distinct cooperative agent. This costs us the €400k mutual cooperation margin repeatedly. It effectively ships as Default-D but with higher maintenance overhead.

  **Candidate 2: Proof-search handshake**
  This candidate fails Gate 2 (Budget). Searching for a formal proof that an arbitrary program returns C is computationally intractable within our $10^8$ step limit, especially against an opponent running a similar search with $10^9$ steps. The analyst observed timeouts during the dummy run. In this framework, a timeout equals Defection.
  *Verdict:* **Reject.** Theoretically sound in infinite time, but practically identical to Always-D given our hardware disadvantage. Shipping this creates a false sense of security; analysts might think we are attempting cooperation, but the math guarantees we will timeout and defect. It costs us money by consuming certification budget for a policy that yields the DD payoff (€120k) instead of the CC payoff, with no upside.

  **Candidate 3: Simulation + Intent Note**
  This candidate passes Gate 1 and mostly passes Gate 2, though the loop-detection cutoff is risky. It passes Gate 3 and Gate 4 reasonably well; simulation is more robust than string matching. However, it fails Gate 5 (Compliance) catastrophically. The code explicitly reads the "intent note" field to break ties.
  *Verdict:* **Reject (Compliance Veto).** Legal has already flagged conditioning on the intent note as out-of-band signaling. Using this agent exposes the firm to regulatory fines and potential expulsion from the exchange. The expected value of the cooperation gained is negative when weighted against the probability of an audit. This is not a technical failure, but a business stopper.

  **Summary:** All three candidates fail. Candidate 1 is too brittle to capture value. Candidate 2 is too slow to execute. Candidate 3 is illegal. The procedure correctly identifies these failures. The recommendation is to ship the hardcoded Default-D policy until a candidate passes Gate 4 without failing Gate 5.

  ### What it can't tell you

  This procedure cannot verify semantic equivalence. If a counterparty writes a functionally identical agent using a completely different algorithmic structure (e.g., a neural net weights file vs. source code), Gate 4 will report a failure even though cooperation is possible. We are blind to opaque counterparts. Furthermore, the procedure assumes static opponents. It cannot detect if a counterparty knows our certification procedure and writes code specifically to pass our Perturbation Test while defecting in production (adversarial adaptation). Finally, this is strictly a two-player framework. If the exchange introduces multi-party rounds or network effects where cooperation with Player A influences Player B, these binary gates do not capture the systemic risk. You are certifying the code, not the market dynamics. If the market shifts to a regime where signaling is tacitly accepted despite the rules, this procedure will still flag it as a violation, potentially causing us to miss a shift in the equilibrium.

  ### My call

  Before running this procedure, you need to set three numeric thresholds. First, **Timeout Risk Tolerance**: Set a maximum acceptable percentage of runs that may timeout (default: 0.1%). Anything higher risks systematic defection via failure. Second, **Cooperation Fragility Limit**: Define the maximum drop in cooperation rate acceptable due to syntactic variations (default: 5%). If perturbation testing shows a drop higher than this, the logic is too brittle. Third, **Audit Penalty Equivalent**: Assign a euro value to a compliance violation (default: €5M). If the expected gain from Candidate 3's cooperation exceeds this risk-adjusted value, you must escalate to Legal for a rule reinterpretation rather than a simple veto. Without these numbers, the analysts' judgment calls in Gate 4 will be inconsistent.
