answer: |-
  This is a sharp reading. You are not forcing a conflict where there isn't one; you have identified a genuine fault line in Bentham's utilitarianism that often gets glossed over in standard summaries of his "liberalism."

  Here is a breakdown of how your argument holds up against the texts and the scholarship, along with a few suggestions to tighten the framing.

  ### 1. Is the conflict between the Panopticon and the Sexual Fragments real?
  **Yes.** Your intuition about the "behaviorist contradiction" is sound.

  *   **The Panopticon Logic:** The Panopticon relies on the premise that human behavior is malleable. Through surveillance, incentive, and the architecture of pain/pleasure, the "reformer" can shape the subject to maximize social utility. It assumes preferences are, to a significant degree, *corruptible* or *correctable*.
  *   **The Sexual Fragments Logic:** In his unpublished writings on "Paederasty" (his term), Bentham argues that the taste is harmless. To make this stick within a utilitarian framework, he often treats the propensity as a brute fact of nature—akin to hunger or a preference for certain foods. If it were truly malleable, a strict act-utilitarian might have to ask: *"Would it cause less net pain to re-educate this preference than to tolerate it?"* (e.g., if social stigma causes immense pain, perhaps removing the desire is more efficient than removing the law).
  *   **The Tension:** By effectively ruling out the "re-education" option for sexual tastes, Bentham smuggles in a deontological-style constraint (a "right" to private taste) under the guise of utilitarian calculation. He treats sexual propensity as **immune to the very social engineering he champions elsewhere.**

  **Verdict:** This is not a forced reading. It highlights the limit of Bentham's radicalism. He is willing to engineer the prisoner, but not the lover.

  ### 2. Is the "Pre-Social" Framing Unique or Anachronistic?
  This is where you need to be careful with terminology, but the core insight is viable.

  *   **The Anachronism Risk:** Bentham did not have a concept of "sexual orientation" as a fixed identity (that's a late 19th-century development). He spoke of "propensities" and "acts." If you argue he views them as "pre-social," a critic might say you are projecting modern essentialism onto him.
  *   **The Defense:** However, Bentham *does* consistently treat these desires as **data points** rather than **social constructs.** For Bentham, pleasure and pain are sovereign masters. If a desire produces pleasure and no external pain, its origin doesn't matter. But by comparing it to culinary taste, he implies it is internal and resistant to external coercion.
  *   **Scholarly Context:** You aren't alone in noticing this, but your specific angle is fresh.
      *   **Louis Crompton** (the leading scholar on Bentham and homosexuality) focuses heavily on Bentham's courage in decriminalization and his comparison of anti-sodomy laws to religious persecution.
      *   **Gerard Harrison** and **Igor Primoratz** have analyzed the utilitarian calculus of his defense.
      *   **Your Contribution:** Most scholarship focuses on the *harm principle* aspect (no victim = no crime). Fewer focus on the *psychological immutability* aspect vis-à-vis the Panopticon. Framing it as a contradiction between his **reformist behaviorism** and his **libertarian utility** is a strong, under-explored niche.

  ### 3. Suggestions for Refining the Argument
  To make this bulletproof, consider these three adjustments:

  **A. Swap "Liberalism" for "Utilitarian Consistency"**
  Be careful calling it "Bentham's liberalism." Bentham is notoriously hostile to natural rights and abstract liberty (he called natural rights "nonsense upon stilts"). His defense of homosexuality is not based on *liberty* but on *efficiency*.
  *   *Better framing:* You are arguing that Bentham encounters a **limit case for utilitarian engineering.** He stops being a social engineer and starts being a passive observer when it comes to sex, which contradicts his active stance in the Panopticon.

  **B. Clarify the "Corruptible" vs. "Fixed" Distinction**
  Bentham might argue that sexual tastes *are* corruptible, but the *cost* of corrupting them is too high.
  *   *Your Counter:* You need to press the point that Bentham implies the taste is *intrinsic*, not just expensive to change. If he admits it could be changed easily, his defense weakens (because the utilitarian calculus might favor changing the taste to avoid social stigma). By insisting the taste is harmless *as is*, he implies it is a fixed variable in the equation, not a variable to be solved. This is where your "unexamined distinction" argument shines.

  **C. The "Culinary" Analogy is Key**
  Lean hard into the food analogy. Bentham explicitly compares sexual preferences to dietary ones (e.g., eating pork vs. beef).
  *   *The Contradiction:* In the Panopticon, Bentham is happy to dictate diet, labor, and sleep to reform the prisoner. But in the sexual fragments, diet/taste is private. Why is the palate of the prisoner public property, but the palate of the lover private? That is the specific contradiction you should hunt.

  ### Summary
  You are not forcing it. You have found a legitimate tension between Bentham the **Institutional Designer** (who believes he can mold man) and Bentham the **Moral Calculator** (who accepts man's desires as given).

  It is not a "weird framing" to suggest he treats sexual taste as pre-social; it is actually the only way his utilitarian defense works without sliding into coercive re-education. Just be precise that Bentham likely views this as a **practical limit on reform** (it causes too much pain to try) rather than a **metaphysical truth** (biology dictates desire), though he often writes as if it were the latter.

  Go for it. It's a solid thesis.
