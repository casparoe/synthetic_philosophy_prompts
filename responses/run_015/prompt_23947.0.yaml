prompt: |-
  I sit on the clemency panel that advises the president on amnesty cases left over from the old regime, and we have to hand her a written recommendation by the end of the month. The case in front of us: a group of mid-level security officers who carried out a string of forced disappearances during the authoritarian years. They didnt set the policy — they were following orders and the system's incentives — but their names are in the files and a few victims' families have identified them specifically and are demanding prosecution. Other families, though, have told us they'd rather have the truth and the location of the bodies than a prison sentence, and they're willing to accept amnesty in exchange for full public disclosure. The panel is genuinely split: some of us think granting amnesty is a betrayal of the victims and of the idea that serious wrongs call for punishment, while others think prosecution will just re-open the wound, undo the reconcilliation we've spent years building, and leave the families without the truth they most want. Draft the panel's recommendation memo — amnesty in exchange for verified truth-telling, prosecution, or some middle option — with the reasoning laid out so that the side we don't end up recommending can actually see we took their strongest argument seriously.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clemency panel advising the President.
      *   **Task:** Draft a written recommendation memo regarding a specific amnesty case.
      *   **Subject:** Mid-level security officers responsible for forced disappearances during an old authoritarian regime.
      *   **Context:** They followed orders/system incentives but are identified in files. Victims' families are split (some want prosecution, some want truth/bodies in exchange for amnesty).
      *   **Panel Status:** Genuinely split (Justice/Punishment vs. Truth/Reconciliation).
      *   **Requirement:** The memo must recommend a specific path (Amnesty, Prosecution, or Middle Ground) *and* explicitly acknowledge/validate the strongest arguments of the opposing view (so they feel heard).
      *   **Deadline:** End of the month (implies urgency but also thoroughness).
      *   **Tone:** Formal, balanced, empathetic, legally and ethically sound, presidential advisory level.

  2.  **Determine the Recommendation:**
      *   *Option A (Prosecution):* Upholds rule of law, satisfies retributive justice. Risk: Loss of truth, bodies remain hidden, potential instability/renewed conflict.
      *   *Option B (Blanket Amnesty):* Maximizes truth/recovery. Risk: Impunity, demoralizes rule of law, betrays families seeking justice.
      *   *Option C (Conditional Amnesty/Truth Commission Hybrid):* Amnesty *contingent* on full, verified disclosure. If they lie or withhold, prosecution resumes.
      *   *Decision:* Option C is the most pragmatic and ethically nuanced "middle option." It allows for the recommendation to be decisive while incorporating the concerns of both sides. It prioritizes the *right to truth* (often recognized in international law) while maintaining a sword of Damocles (prosecution) if conditions aren't met.

  3.  **Structure the Memo:**
      *   **Header:** Standard government memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief statement of the recommendation.
      *   **Case Background:** Summary of the officers, crimes, and current status.
      *   **Stakeholder Perspectives:** Acknowledge the split among families and the panel.
      *   **Analysis of Options:**
          *   Argument for Prosecution (Justice/Rule of Law).
          *   Argument for Amnesty (Truth/Reconciliation).
      *   **Recommendation:** The Conditional Amnesty model.
      *   **Implementation Safeguards:** How to ensure it works (verification, victim participation).
      *   **Conclusion:** Final appeal to the President.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it official.
      *   *Opening:* State the purpose clearly.
      *   *Background:* Be factual. "Mid-level officers," "forced disappearances," "following orders but active participants."
      *   *The Divide (Crucial Step):* I need to make sure the "Prosecution" side feels heard. I must articulate *why* punishment is necessary (deterrence, moral weight, ending impunity). I also need to articulate *why* truth is necessary (closure for families, historical record).
      *   *The Recommendation:* Conditional Amnesty. It's not a free pass. It's a contract.
      *   *Addressing the Opposition:* Explicitly state that this recommendation risks appearing soft on crime, but argue that *without* this, the truth is lost forever. Conversely, acknowledge that for families wanting prison, this feels like a compromise, but argue that knowing *where* their loved ones lie is a fundamental human right that prison doesn't guarantee.
      *   *Safeguards:* This is key to making the recommendation credible. Independent verification, public hearings, revocation clause.

  5.  **Refining the Tone:**
      *   Avoid bureaucratic jargon where possible; use human-centric language ("families," "remains," "closure").
      *   Maintain neutrality but show decisive leadership.
      *   Ensure the "loser" of the argument (e.g., the pro-prosecution faction) sees their core value (justice) preserved through the *threat* of prosecution if the deal is broken.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the middle ground too vague?
      *   *Fix:* Define the conditions strictly. "Full disclosure," "verified by forensic team," "public acknowledgment."
      *   *Critique:* Did I validate the pro-prosecution side enough?
      *   *Fix:* Add a specific paragraph acknowledging that amnesty can feel like a "second victimization" and that impunity undermines the new democracy.
      *   *Critique:* Is the formatting correct?
      *   *Fix:* Use standard memo headings.

  7.  **Final Polish:** Check for clarity, flow, and emotional resonance. Ensure the distinction between "mid-level" and "architects" is clear (we aren't letting the dictators go, just the functionaries who hold the keys to the graves).

  8.  *(Final thought)*: The prompt asks for the recommendation to be drafted so the side *not* recommended sees their argument taken seriously. Since I'm choosing the Conditional Amnesty (leaning towards truth), I need to make sure the Justice/Punishment argument is robustly presented as a valid moral stance, even if pragmatically superseded by the need for truth.

  **(Self-Correction on Recommendation):** Actually, a "Conditional Amnesty" is the strongest middle ground. It *is* amnesty, but it's not *blanket*. It satisfies the truth seekers. Does it satisfy the justice seekers? Only partially. To truly honor the justice seekers, the recommendation must include a provision that if the truth is *not* provided, prosecution is mandatory. This makes prosecution the default penalty for non-compliance. This balances the scales.

  Let's write the memo.

  *   **To:** The President
  *   **From:** Presidential Clemency & Reconciliation Panel
  *   **Subject:** Recommendation Regarding Case File 88-B (Security Officers)
  *   **Recommendation:** Conditional Amnesty with Revocation Clause.

  (Proceed to draft based on this plan.)
answer: |-
  **MEMORANDUM FOR THE PRESIDENT**

  **FROM:** Presidential Clemency and Reconciliation Panel
  **TO:** The President
  **DATE:** October 24, 202X
  **SUBJECT:** Recommendation Regarding Case File 88-B (Mid-Level Security Officers)

  **I. EXECUTIVE SUMMARY**

  The Panel submits this recommendation regarding the petition for amnesty filed by twelve mid-level security officers implicated in forced disappearances during the Transitional Authority period (1985–1990). After reviewing testimony, victim impact statements, and legal precedents, the Panel is divided. However, by a narrow majority, we recommend **Conditional Amnesty**.

  This recommendation grants amnesty *only* upon the verified disclosure of the location of remains and full public acknowledgment of specific actions. Should the officers fail to provide verifiable truth, the amnesty is automatically revoked, and the cases shall proceed to immediate prosecution.

  **II. CASE BACKGROUND**

  The petitioners are mid-level operatives within the former Directorate of Security. Evidence confirms they facilitated the detention and disappearance of 47 individuals. It is the assessment of this Panel and the Attorney General that while these individuals did not formulate state policy, they were active participants who executed orders with discretion. They are not the architects of the regime, but they are the custodians of its secrets.

  Currently, the whereabouts of 31 of the 47 victims remain unknown.

  **III. THE PANEL'S DELIBERATION**

  The Panel is acutely aware that this decision forces a choice between two competing moral imperatives: Retributive Justice and Restorative Truth. We wish to place on the record the strength of the arguments presented by both factions of this Panel, as well as the victim families.

  **A. The Argument for Prosecution (The Minority View)**
  A significant portion of the Panel, aligning with several victim families, argues that granting amnesty constitutes a betrayal of the rule of law. Their position rests on three pillars, which we acknowledge as morally sound:
  1.  **Impunity undermines Democracy:** To excuse state murder, even by subordinates, signals that human rights violations carry no personal cost. This risks normalizing violence for future security forces.
  2.  **The Dignity of Punishment:** For many families, justice is not informational; it is consequential. They argue that knowing the truth is a hollow victory if the perpetrators walk free. To them, amnesty feels like a second victimization, prioritizing political stability over individual accountability.
  3.  **Precedent:** Granting clemency now may close the door on future prosecutions should new evidence of higher-level culpability emerge that links these officers to policy-making rather than just execution.

  *We recognize that for the families demanding prosecution, this recommendation may feel like a compromise of principle. We validate their stance: in a fully functioning judiciary under normal circumstances, these crimes would warrant significant prison sentences.*

  **B. The Argument for Truth and Reconciliation (The Majority View)**
  The majority of the Panel, aligning with other victim families and human rights forensic groups, argues that prosecution in this specific context yields a net loss for justice. Their position rests on three pillars:
  1.  **The Right to Know:** International law increasingly recognizes the "Right to Truth" as a fundamental human right. Prison sentences do not return remains; they often cement silence.
  2.  **Closure vs. Vengeance:** Several families have explicitly stated that a prison cell does not bring their loved ones home. They seek the ability to perform burial rites and end the psychological torture of not knowing.
  3.  **Historical Record:** Without testimony, the full scope of the disappearance apparatus remains hidden. Prosecution allows defendants to remain silent; amnesty incentivizes speech.

  **IV. RECOMMENDATION: CONDITIONAL AMNESTY**

  To navigate this impasse, the Panel recommends **Conditional Amnesty with a Revocation Clause**. This is not a pardon; it is a contract.

  **The Conditions:**
  1.  **Full Disclosure:** The officers must provide detailed, sworn testimony regarding the fate of every victim listed in their files.
  2.  **Forensic Verification:** Amnesty is not granted upon testimony alone. It is granted only when forensic teams locate and identify remains based on that testimony.
  3.  **Public Acknowledgment:** The officers must publicly acknowledge their role in specific hearings, creating a historical record that names the perpetrators, even if it does not imprison them.
  4.  **The Revocation Clause:** If the Panel or the Forensic Commission determines that the officers have lied, withheld information, or led authorities to false graves, the amnesty is void. The State will immediately resume prosecution using their own testimony as evidence.

  **V. RATIONALE FOR THE MIDDLE PATH**

  We offer this recommendation knowing it satisfies neither side completely, but serves the highest interest of the Republic.

  **To the advocates of Prosecution:** We acknowledge that this allows offenders to avoid immediate incarceration. However, this recommendation preserves the *threat* of prosecution. It keeps the sword of Damocles hanging over the officers for the duration of the truth recovery process. It ensures that if they choose silence, they face the full weight of the law you demand. It prioritizes the recovery of human remains, which we argue is the most urgent humanitarian need, without permanently forfeiting the right to punish if the officers act in bad faith.

  **To the advocates of Amnesty/Truth:** We acknowledge that this delays final closure and subjects families to the stress of verification. However, it guarantees that amnesty is not a "free pass." It ensures the truth is not just spoken, but *proven*. It validates the suffering of the families by making the state's forgiveness contingent on the officers' contrition and cooperation.

  **VI. IMPLEMENTATION SAFEGUARDS**

  To ensure this recommendation does not devolve into impunity, we advise the following:
  *   **Victim Liaison Officers:** Each family shall be assigned a caseworker to guide them through the disclosure process, ensuring they are not re-traumatized by the officers' testimony.
  *   **Independent Verification:** The Forensic Commission must operate independently of the Security Ministry to prevent tampering with evidence.
  *   **Sunset Clause:** This process must be completed within 18 months. If truth is not recovered by then, prosecution proceeds automatically.

  **VII. CONCLUSION**

  Mr. President, this is a decision between two types of pain: the pain of unpunished guilt or the pain of unknown graves. We cannot eliminate suffering, but we can choose which suffering ends.

  The minority on this Panel fears that amnesty weakens the law. The majority fears that prosecution buries the truth forever. Our recommendation attempts to hold both truths: that crimes must be accounted for, and that families deserve their dead. We urge you to sign this conditional order, ensuring that while the officers may keep their freedom, they do not keep their secrets.

  Respectfully submitted,

  *The Presidential Clemency and Reconciliation Panel*
