  # The Combination Problem: A Decision Tree

  **Starting Commitment:** There is something it is like to be an ordinary awake human being, and this fact has some ground in the intrinsic or *categorical bases* (the intrinsic properties) of the physical.

  1.  **The Organoid and the Colony.** A cortical organoid of a million neurons; a mature ant colony; a large firm. For each: one subject, many, none, or a matter of degree?
      *   *None (for humans too):* **Leaf: Illusionist Outsider.**
      *   *A matter of degree:* **Cell: Unoccupied 1.** (Diagnosis: Merely unattractive; violates the unity of consciousness).
      *   *One (for humans), None (for organs):* Go to 2.

  2.  **The Census Question.** In a room containing three awake humans, one human in dreamless sleep and a cat, how many subjects are there on your view?
      *   *One (the Universe):* **Leaf: Cosmopsychism.**
      *   *Many (Micro-subjects only, no humans):* **Leaf: Macro-subject Eliminativism.**
      *   *Many (Micro-subjects AND Human subjects):* Go to 3.
      *   *Three (Human subjects only, micros absorbed):* Go to 4.

  3.  **The Inverted-bonding World.** A world physically identical to ours and identical at the level of every micro-experience, but with a different macro-experiential outcome — no unified human experience at all, say. Is that genuinely conceivable on your view, or excluded as a matter of necessity?
      *   *Conceivable:* **Cell: Unoccupied 2.** (Diagnosis: Simply unexplored; contingent *phenomenal bonding* (an irreducible relation) is rarely defended).
      *   *Excluded:* **Leaf: Phenomenal Bonding.**
      *   *Inapplicable (No micro-experience):* **Leaf: Panprotopsychism.** (Base facts are *proto-phenomenal* (not experiential)).

  4.  **Fission and Recombination.** A subject's two hemispheres are separated and each continues; later they are reconnected. Is the post-reconnection subject identical with the pre-split subject, identical with one of the two interim subjects, or a new subject?
      *   *New subject:* **Leaf: Brute Emergence.**
      *   *Identical with pre-split:* **Leaf: Non-further Relation.**
      *   *Ill-posed:* **Cell: Unoccupied 3.** (Diagnosis: Incoherent; denies the data of continuity).

  ### Table of Leaves

  | Label | Answer Pattern | Statement of View | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **Illusionist Outsider** | 1: None (humans) | Consciousness is a functional appearance, not grounded in intrinsics. | You granted the starting premise only for the sake of argument. |
  | **Cosmopsychism** | 2: One (Universe) | The universe is the single subject; humans are modifications of it. | You face the *decomposition problem* (the mirror-image of combination) explaining how one subject appears as many. |
  | **Macro-subject Eliminativism** | 2: Many (Micros only) | Only micro-subjects exist; human unity is a facon de parler. | You must deny the reality of the very experience that motivated the seminar. |
  | **Phenomenal Bonding** | 3: Excluded | Micro-subjects constitute macros via a necessary phenomenal relation. | You must posit a new fundamental law of nature specifically for consciousness. |
  | **Panprotopsychism** | 3: Inapplicable | Base facts are proto-phenomenal, not experiential; macros are constituted by them. | You must explain how non-experiential facts combine to yield experience without magic. |
  | **Non-further Relation** | 4: Identical | Macro-facts are nothing over and above micro-subjects plus physical relations. | You must claim composition is as intelligible here as it is elsewhere (which many deny). |
  | **Brute Emergence** | 4: New subject | The macro-subject is an additional ingredient emerging brute from the micro-level. | You abandon the hope of explaining consciousness in terms of its grounds. |
  | **Unoccupied 1** | 1: Degree | Subjecthood comes in degrees across systems. | You cannot say exactly when pain becomes real pain. |
  | **Unoccupied 2** | 3: Conceivable | Phenomenal bonding is contingent or nomic. | You admit physics could duplicate our minds without our consciousness. |
  | **Unoccupied 3** | 4: Ill-posed | Identity across fission is meaningless. | You must treat first-person continuity as a linguistic confusion. |

  ### Indistinguishable Positions

  1.  **Grounding vs. Identity:** The tree does not separate variants of the **Non-further Relation** leaf where macro-subjects are *grounded in* micros versus *identical to* compositions of micros. No concrete case separates them because both deny any further phenomenal ingredient.
  2.  **Grain Solution vs. Non-further:** The **Grain Solution** (base facts sit at a coarse grain, e.g., neurons) is merged into **Non-further Relation**. The tree does not separate them because both deny the need to combine fundamental micro-experiences. To separate them, one would need a case testing whether fundamental particles possess categorical bases.

