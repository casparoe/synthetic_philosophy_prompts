answer: |-
  # Q&A PREP SHEET: "Emotions as Affordance Perceptions"
  **Series:** Mind and Value | **Time:** 25 mins Q&A | **Stakes:** High (Chapter Defense)

  ## STRATEGIC CONCESSIONS (Slide 2)
  *Do not wait for these to be dragged out of you. Pre-empt them to lower the temperature.*

  1.  **Concede the label "Perception":** Explicitly state you are using "perception" analogically to highlight *directness* and *world-directedness*, not to commit to the modular, encapsulated architecture of early vision. This disarms the Modular Perceptualists before they load the gun.
  2.  **Concede the scope limitation:** Admit this model is built primarily on *basic, forward-looking emotions* (fear, anger, disgust). Acknowledge upfront that backward-looking emotions (grief, regret) and moods require an extension of the framework you are currently working on. This makes you look honest rather than evasive when they ask.

  ---

  ## THE OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Rationality Objection (Appraisal/Concern Group)
  **Who:** The 3–4 rationalists.
  **The Question:** "You've replaced 'justification' with 'aptness.' But aptness is a competence norm, like a tennis serve. I can't reason with a tennis serve. If emotions aren't responsive to reasons, how do they participate in the space of value? You've saved the spider case but lost the rationality of emotion."
  **The 2-Minute Reply:**
  Distinguish between *having* reasons and *being responsive* to reasons. My claim isn't that emotions are arational habits like reflexes. Affective competence is a *learned* skill, and skills are reason-responsive over time. When I reappraise the spider, I am training the competence, not just correcting a belief. Aptness tracks the *outcome* of that training. So, emotions are assessable by reasons *indirectly* through the cultivation of the competence that produces them. We criticize the agent for not training their sensitivity, not just the episode for being wrong.
  **The One-Liner:** "Aptness isn't a substitute for rationality; it's the *track record* of a rationality that has become embodied."
  **The Soft Spot:** You are blurring the line between assessing the *agent* (for being untrained) and assessing the *emotion* (for being irrational). They may press that the *episode itself* remains arational.

  ### 2. The Circularity/Measurement Objection (Psych Constructionists)
  **Who:** The 2 Psychologists.
  **The Question:** "What's your dependent variable? If 'competence' is defined as picking up actual affordances, and 'actual affordances' are defined as what a competent agent picks up, you're circular. How do you measure competence independently of the emotion report?"
  **The 2-Minute Reply:**
  This is the empirical hinge. Competence isn't defined by the emotion report; it's defined by *successful action outcomes* downstream. If fear perceives "fleeable," the measure of competence is whether fleeing (or preparing to flee) actually enhances survival or goal attainment in that context. We can measure physiological readiness and behavioral success without asking the subject what they feel. The emotion is the mechanism; the action-outcome is the independent validator.
  **The One-Liner:** "Competence is cashed out in behavioral success, not introspective accuracy."
  **The Soft Spot:** Many emotions (e.g., awe, righteous anger) don't have clear "success" conditions. You risk reducing value to utility here.

  ### 3. The "Not Perception" Objection (Modular Perceptualists)
  **Who:** The 2 Value Perceptualists.
  **The Question:** "If your 'perception' is penetrable by belief and reappraisal, it's not perception. It's inference with a phenomenology. You're just stretching the word 'perception' to do normative work it can't support."
  **The 2-Minute Reply:**
  Reject the premise that perception must be encapsulated. That's a 1980s view of vision. Even in standard vision, expectation shapes edge detection. I'm arguing for a *skill-based* perception model, akin to expert bird-watching or wine-tasting. It's perceptual because the content is presented as *there*, not inferred as *likely*. The phenomenology is of direct contact, not conclusion.
  **The One-Liner:** "Encapsulation is a bug of early vision, not a feature of perception as such."
  **The Soft Spot:** They are right that the philosophical literature on "Value Perception" usually assumes modularity. You are changing the subject slightly.

  ### 4. The Content Objection (The Enactivist)
  **Who:** The 1 Enactivist.
  **The Question:** "You talk about affordances as if they are representational contents ('fleeable-here-now'). But affordances are relations, not representations. Why do you need content at all to explain aptness? Isn't that representationalist baggage?"
  **The 2-Minute Reply:**
  I need content to explain *normativity*. A relation just *is*; a content can be *apt* or *inapt*. If I'm just coupled with the environment, there's no room for error, only mismatch. To say the fear is *defective* (recalcitrant), I need to say the system represented the situation as affording flight when it did not. Aptness requires a gap between the uptake and the world.
  **The One-Liner:** "Without content, you have coupling, but you can't have error."
  **The Soft Spot:** She might argue you can have error in a dynamical system without representational content (e.g., a thermostat).

  ### 5. The Relabeling Objection (Your Advisor)
  **Who:** The Advisor.
  **The Question:** "This looks like 'fittingness' with extra steps. You've swapped 'value property' for 'affordance' and 'justification' for 'aptness.' What work is the affordance vocabulary actually doing that 'fittingness' didn't?"
  **The 2-Minute Reply:**
  "Fittingness" implies a match between emotion and a static value property (e.g., Danger). "Affordance" implies a match between emotion and an *action possibility relative to the agent*. This explains why the same snake is "fleeable" for you but "catchable" for a herpetologist. Fittingness struggles with agent-relativity; affordances center it. It moves the normativity from the object to the *relation*.
  **The One-Liner:** "Fittingness asks if the emotion matches the object; Aptness asks if the emotion matches the *agent-in-the-world*."
  **The Soft Spot:** If you can't give a concrete example where fittingness fails and affordance succeeds, this is just terminology.

  ### 6. The Moods Objection (The "Hope Nobody Asks")
  **Who:** Anyone paying attention to scope.
  **The Question:** "Affordances are object-directed. What about free-floating anxiety or depression? There's no object to afford anything. Is your theory incomplete?"
  **The 2-Minute Reply:**
  Moods are shifts in the *landscape* of affordances, not perceptions of specific affordances. Anxiety isn't seeing a specific thing as dangerous; it's the background salience of *all* things as potentially threatening. It's a change in the "field" rather than the "figure." The theory extends, but the unit of analysis shifts from specific action-possibilities to global readiness.
  **The One-Liner:** "Moods don't change the objects; they change the lighting on the whole field."
  **The Soft Spot:** This is hand-wavy. It's hard to define "global readiness" without slipping back into "feelings."

  ### 7. The Backward-Looking Objection (The Real Landmine)
  **Who:** The Sharp Junior Faculty.
  **The Question:** "What is the affordance of Grief or Regret? These look backward. What action does a lost loved one afford? If you say 'mourn-able,' haven't you just smuggled a value property back in?"
  **The 2-Minute Reply:**
  (See "Weakest Joint" below). Acknowledge this is the boundary of the current chapter. Suggest that grief affords "withdrawal-for-reintegration" or "signaling-need-for-support." It's a social affordance.
  **The One-Liner:** "Grief affords a pause in action to recalibrate the agent's social world."
  **The Soft Spot:** This is the weakest part of the theory. It sounds forced.

  ### 8. The Wrong Kind of Reasons Objection (Appraisal Group, Follow-up)
  **Who:** The Rationalists (Round 2).
  **The Question:** "You said aptness avoids the wrong-kind-of-reasons problem. But if competence is trained, isn't training subject to pragmatic reasons? I can train myself not to feel grief because it's inconvenient. Is that emotion then 'inapt'?"
  **The 2-Minute Reply:**
  No, because competence is defined by *uptake of the world*, not *utility to the agent*. Training yourself to ignore grief might be useful (pragmatic), but it makes you less competent at perceiving the loss (epistemic/normative). Aptness tracks the world, not the benefit.
  **The One-Liner:** "Competence makes you better at seeing the world, not necessarily happier in it."
  **The Soft Spot:** Distinguishing "seeing the world" from "being happy" is harder in emotion than in vision.

  ---

  ## CRITICAL ANALYSIS

  ### The Single Objection with Genuine Force Against the Framework
  **The Rationality/Reason-Responsiveness Objection (#1).**
  If you succeed in making emotions sub-personal competencies (like vision or tennis), you risk making them *too* sub-personal to be bearers of value. Value theories usually require the agent to be responsive to reasons *in the moment*. If your account makes the emotion a output of a trained module, you might save the normativity of the *trait* but lose the normativity of the *episode*. This strikes at the heart of the "Mind and Value" series theme.

  ### The Weakest Joint in Your Position
  **Backward-Looking Emotions (Grief/Regret).**
  Your theory is built on *affordances* (action possibilities). Fear affords fleeing; anger affords attacking. Grief affords... what? "Processing"? "Withdrawing"? These aren't affordances in the Gibsonian sense; they are internal states or value judgments. If you can't parse Grief as an affordance perception without calling it a "value property" (which you explicitly deny), the "neither judgments nor feelings" thesis cracks for a huge chunk of emotional life. **Prepare to limit the scope of the chapter rather than forcing a bad fit.**

  ### The Question You're Hoping Nobody Asks
  **You guessed Moods. You are wrong.**
  Moods are manageable as "background fields."
  **The Real Landmine:** **"What distinguishes an affordance from a value property?"**
  If "fleeable" is just "dangerous" translated into action-terms, you haven't moved the needle. The Modular Perceptualists will press this: "Dangerous" *means* "affords fleeing." If your content is identical to the value property content, just phrased differently, you haven't solved the problem of what emotions perceive; you've just changed the vocabulary.
  **Prep:** Have a concrete example where *Dangerous* and *Fleeable* come apart. (e.g., A cliff is dangerous, but for a base-jumper, it affords jumping, not fleeing. The value property stays, the affordance flips. This proves they are distinct contents.)

  ## WHITEBOARD STRATEGY
  *   **Draw the Triangle:** Agent — Emotion — World.
  *   **Modularists** want to cut the Agent out (Direct perception).
  *   **Appraisal** wants to cut the World out (Construction/Concern).
  *   **You** are keeping all three lines active. When answering, point to the specific line you are defending.
  *   **When stuck:** "That's a question about the *development* of the competence, not the *structure* of the episode. I'm defending the structure today." (Buys you time).
