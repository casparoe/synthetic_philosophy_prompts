prompt: |-
  You are a senior clinical ethicist with training in philosophy of action and medical decision-making. Before drafting the protocol, take a moment to brainstorm the conceptual distinctions that standard assisted-dying review boards usually collapse into a single “autonomy” check. I need you to design a reusable, step-by-step evaluation procedure for a hospital clinical-ethics committee that reviews petitions for physician-assisted dying in a jurisdiction where the practice is legal but requires documented, multi-disciplinary sign-off.

  The committee meets weekly, spends no more than ninety minutes per petition, includes an attending physician, a nurse, a social worker, and a legal advisor but no trained philosophers, and must produce reasoning that can survive judicial or institutional audit. The physician submits a petition packet with clinical records.

  Your procedure must be grounded in a philosophical distinction that conventional protocols ignore: the separation between an authority-based gate (does the patient have the standing to direct the ending of their biological life?) and an axiological-coherence gate (is the requested death continuous with—rather than a repudiation of—the values and commitments that have structured the patient’s biographical narrative?). Treat these as two independent gates that must both open; do not collapse them into one autonomy assessment.

  Design the procedure as a flowchart in words: numbered stages in strict order. For each stage, specify (a) the precise question to ask, (b) what counts as a sufficient answer, (c) the required evidence, (d) the stop-point if the answer fails, and (e) an explicit flag wherever the question is irreducibly a value judgment that requires a documented committee vote rather than further fact-gathering.

  Then apply the full procedure to three petitions:
  1. A sixty-seven-year-old with advanced ALS who executed a detailed advance directive five years ago requesting aid in dying upon loss of independent respiratory function; the clinical threshold is now met, but the patient recently adopted a religious tradition that prohibits self-killing and now expresses ambivalence, asking the committee to decide.
  2. A forty-two-year-old with severe, treatment-resistant major depression, no physical illness, who has refused all psychiatric interventions for eighteen months; psychiatric evaluation finds intact cognition but notes that the desire for death tracks the depressive symptom profile with near-perfect correlation, and the patient’s family strongly supports the petition.
  3. One additional case you construct yourself, in which the procedure yields a recommendation that conflicts with common moral intuition—make the conflict explicit, show exactly which stage produces it, and state what the committee is forced to do despite that intuition.

  Finally, state clearly what the procedure cannot do: which disagreements it will fail to resolve, which cases it should refer back to the legislature or court rather than deciding internally, and where its structural commitment to the two-gate framework is likely to misfire or produce counter-intuitive results.

  Be precise, avoid generic lists like “respect autonomy, do no harm,” do not include bibliographies, reading lists, or citations, and check at each stage that the philosophical distinction actually survives translation into an operational test. Mark every point where judgment cannot be eliminated.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Senior Clinical Ethicist with training in philosophy of action and medical decision-making.
      *   **Task:** Design a reusable, step-by-step evaluation procedure (flowchart in words) for a hospital clinical-ethics committee reviewing physician-assisted dying (PAD) petitions.
      *   **Constraints:**
          *   Committee composition: Attending physician, nurse, social worker, legal advisor (no philosophers).
          *   Time limit: 90 minutes per petition.
          *   Jurisdiction: Legal but requires multi-disciplinary sign-off.
          *   Core Philosophical Requirement: Distinguish between *Authority-Based Gate* (standing to direct biological ending) and *Axiological-Coherence Gate* (continuity with biographical narrative/values). Do not collapse into single "autonomy."
          *   Output Format: Numbered stages with (a) Question, (b) Sufficient Answer, (c) Evidence, (d) Stop-point, (e) Value Judgment Flag.
          *   Application: Apply to three specific cases (ALS/Ambivalence, Depression/Resistant, Constructed Counter-Intuitive).
          *   Limitations: State what the procedure cannot do (unresolved disagreements, referrals, misfires).
          *   Tone: Precise, operational, avoiding generic bioethics platitudes.

  2.  **Conceptual Brainstorming (The "Philosophy of Action" Distinction):**

      *   *Standard Approach:* Usually checks "Capacity + Voluntariness = Autonomy." If the patient says "I want this" and understands the consequences, it's approved.
      *   *Required Distinction:*
          *   **Gate 1: Authority (The "Can I?" question).** This is about legal and cognitive standing. Do they have the right to command this action? Is the will intact? Is there coercion? This is mostly procedural/legal/cognitive.
          *   **Gate 2: Axiological Coherence (The "Is this *Me*?" question).** This is about narrative identity. Does this act fit the story of their life? Or is it an alien intrusion (e.g., acute despair, temporary psychosis, sudden conversion that contradicts a lifetime of values)? The prompt asks for "continuity with... values and commitments that have structured the patient's biographical narrative."
      *   *Challenge:* How to make Gate 2 operational for non-philosophers in 90 minutes without becoming paternalistic? It needs to be evidence-based (past statements, consistent behaviors) rather than speculative ("What would God want?").

  3.  **Drafting the Procedure (The Flowchart):**

      *   *Stage 1: Jurisdictional & Clinical Eligibility.* (Pre-work, but needs verification).
      *   *Stage 2: Authority Gate (Capacity & Voluntariness).* Focus on the *current* ability to authorize.
      *   *Stage 3: Axiological Coherence Gate (Narrative Consistency).* Focus on the *history* of values.
      *   *Stage 4: Synthesis & Recommendation.*
      *   *Refinement:* Ensure the "Value Judgment Flags" are placed where the committee must vote, not just check boxes.
      *   *Constraint Check:* 90 minutes. Need to be efficient. Evidence must be in the packet.

  4.  **Developing the Three Cases:**

      *   *Case 1 (ALS/Ambivalence):* Tests the conflict between Advance Directive (past self) vs. Current Ambivalence (present self) + New Religious Values.
          *   *Authority:* Capacity is tricky due to ALS (communication) and ambivalence.
          *   *Coherence:* The new religion contradicts the old directive. Which is the "true" narrative?
      *   *Case 2 (Depression):* Tests psychiatric suffering vs. "distortion of values."
          *   *Authority:* Cognition intact.
          *   *Coherence:* Desire tracks symptoms. Is the depression *part* of the narrative or an *interruption* of it? This is the hard case.
      *   *Case 3 (Constructed Counter-Intuitive):* Needs to pass the protocol but feel wrong, or fail the protocol but feel right.
          *   *Idea:* A rational, consistent hedonist who is bored.
          *   *Scenario:* 80-year-old, healthy, wealthy, no pain, just "done." Consistent history of valuing control and pleasure.
          *   *Conflict:* Intuition says "suicide is sad/wasteful," but Protocol says "Authority OK, Coherence OK."
          *   *Alternative Idea:* A young person with a sudden, consistent desire based on a philosophical shift that looks like "coherence" but feels like "impulse."
          *   *Selection:* Let's go with the "Rational Boredom/Completion" case. It highlights the limit of "Coherence" when the narrative is "I value enjoyment, I am no longer enjoying, therefore end." It passes both gates but violates the "sanctity of life" intuition many hold.

  5.  **Refining the Procedure Steps (Iterative Process):**

      *   *Step 1 (Authority):* Needs to establish *standing*. Not just capacity, but *authorization*.
      *   *Step 2 (Coherence):* This is the innovative part. How to measure "narrative"? Look for *diachronic consistency*.
      *   *Stop-points:* Crucial for efficiency. If Gate 1 fails, don't bother with Gate 2.
      *   *Flags:* Explicitly mark where the social worker or legal advisor might disagree with the physician.

  6.  **Addressing the Limitations:**

      *   Where does this fail? When "narrative" is fragmented (dementia). When values are inherently contradictory. When the law conflicts with the ethics.
      *   Referrals: When the committee is deadlocked on the Value Judgment.

  7.  **Writing the Content (incorporating the persona):**

      *   *Tone:* Professional, rigorous, slightly detached but ethically serious.
      *   *Formatting:* Clear headings, bold text for requirements.
      *   *Check:* Did I avoid bibliographies? Yes. Did I avoid generic "do no harm"? Yes. Did I maintain the two-gate distinction? Yes.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is Gate 2 too paternalistic?
      *   *Fix:* Frame it as "Narrative Verification" not "Value Approval." We aren't asking if the value is *good*, but if it is *theirs* over time.
      *   *Critique:* Case 1 is complex regarding the Advance Directive.
      *   *Fix:* The protocol must prioritize current expressed will *unless* capacity is lost. If capacity is present but ambivalent, Authority Gate stalls.
      *   *Critique:* Case 2 (Depression) is legally barred in many places, but the prompt implies a jurisdiction where it *might* be considered (or at least reviewed). I must treat it as a petition that reached the committee. *Correction:* In most PAD jurisdictions, psychiatric illness alone is excluded. I need to frame this carefully. The prompt says "jurisdiction where the practice is legal." I will assume a jurisdiction where mental illness *alone* is not an automatic exclusion (e.g., Netherlands/Belgium model) or the prompt implies the physical illness is absent but the petition exists. I will treat it as a "hard case" where the protocol must grapple with whether depression negates coherence.
      *   *Critique:* Case 3 needs to be sharp.
      *   *Fix:* Make sure the "Counter-Intuitive" result is clearly explained as a feature of the *Authority/Coherence* split, not a bug.

  9.  **Final Polish:** Check against the 90-minute constraint. Ensure the "Value Judgment Flags" are prominent. Ensure the distinction between Authority (Standing) and Coherence (Narrative) is maintained throughout. (Self-correction: Ensure I don't slip back into "Best Interest" language).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # PROTOCOL: DUAL-GATE EVALUATION FOR PHYSICIAN-ASSISTED DYING (PAD)

  **Purpose:** To operationalize the philosophical distinction between *Authority* (the standing to command the ending of biological life) and *Axiological Coherence* (the continuity of that command with the patient's biographical narrative).
  **Constraints:** 90-minute committee review; non-philosopher membership; audit-ready documentation.
  **Core Distinction:**
  1.  **Authority Gate:** Determines if the *will* is currently intact and legally empowered. (Focus: Capacity, Voluntariness, Standing).
  2.  **Coherence Gate:** Determines if the *content* of the will aligns with the patient's historical value system. (Focus: Narrative Identity, Diachronic Consistency).

  ---

  ## PART I: THE EVALUATION PROCEDURE

  ### STAGE 1: JURISDICTIONAL THRESHOLD (Pre-Meeting Verification)
  *Performed by Legal Advisor prior to convening.*
  (a) **Question:** Does the petition meet all statutory eligibility criteria (residency, age, diagnosis, prognosis)?
  (b) **Sufficient Answer:** Yes/No confirmation against statutory checklist.
  (c) **Evidence:** Petition packet, ID, diagnostic reports.
  (d) **Stop-point:** If **No**, petition is returned to submitting physician with legal citation. Committee does not convene.
  (e) **Value Judgment Flag:** None. This is a compliance check.

  ### STAGE 2: AUTHORITY GATE (The Standing Check)
  *Focus: The integrity of the current agent.*
  (a) **Question:** Does the patient possess the uncoerced, capacitated standing to authorize the termination of their biological life *at this specific moment*?
  (b) **Sufficient Answer:** Affirmation that the patient understands the nature of the act, the alternatives, and the consequence (irreversibility), and is acting without external pressure.
  (c) **Evidence:**
      *   Cognitive assessment (MMSE/MoCA or equivalent).
      *   Private interview transcript (Social Worker/Nurse) confirming absence of coercion.
      *   If using Advance Directive (AD): Proof that current capacity is lost *and* AD conditions are met. **Note:** If current capacity exists, current will overrides AD.
  (d) **Stop-point:** If capacity is absent *and* no valid AD exists, OR if coercion is detected, the gate closes. Recommendation: Deny.
  (e) **Value Judgment Flag:** **YES.** If capacity is borderline (e.g., fluctuating delirium) or coercion is subtle (e.g., familial emotional burden), the committee must vote. A simple majority is insufficient; a 75% supermajority is required to pass this gate on borderline capacity.

  ### STAGE 3: AXIOLOGICAL COHERENCE GATE (The Narrative Check)
  *Focus: The integrity of the life story.*
  (a) **Question:** Is the request for death a continuation of the patient's long-standing values, or is it a repudiation of their biographical narrative caused by an alien intrusion (e.g., acute despair, sudden doctrinal shift, untreated psychosis)?
  (b) **Sufficient Answer:** Evidence that the desire for death is consistent with the patient's historical handling of suffering, autonomy, and dignity, OR that the current request logically resolves a tension present throughout their life narrative.
  (c) **Evidence:**
      *   Longitudinal medical records (looking for prior statements on end-of-life).
      *   Testimony from long-term contacts (family, clergy, primary care).
      *   Consistency check: Does the reason given for death match values expressed in healthier times?
  (d) **Stop-point:** If the request represents a radical break from lifelong values without rational integration (e.g., a lifelong devout believer suddenly requesting death due to temporary fear, not theological shift), the gate closes. Recommendation: Deny or Pause for Counseling.
  (e) **Value Judgment Flag:** **YES.** This is irreducibly interpretive. The committee must vote on whether the "narrative break" is fatal to the petition. This vote must be recorded with a written rationale explaining *which* values are being weighed.

  ### STAGE 4: SYNTHESIS AND RECOMMENDATION
  *Focus: Operationalizing the Dual-Gate Result.*
  (a) **Question:** Given the status of both gates, what is the ethical recommendation?
  (b) **Sufficient Answer:** One of four outcomes:
      1.  **Approve:** Both gates open.
      2.  **Deny:** Authority gate closed.
      3.  **Deny:** Coherence gate closed (Narrative discontinuity).
      4.  **Defer:** Authority open, Coherence ambiguous (Requires further narrative exploration).
  (c) **Evidence:** Minutes from Stage 2 and Stage 3 votes.
  (d) **Stop-point:** N/A (Final stage).
  (e) **Value Judgment Flag:** **YES.** If Stage 2 passed but Stage 3 failed, the committee must explicitly document that the patient *had the right* to choose, but the choice was deemed *incoherent with their self*. This distinction is vital for audit.

  ---

  ## PART II: CASE APPLICATIONS

  ### CASE 1: The Ambivalent Believer (ALS)
  **Profile:** 67M, Advanced ALS. Respiratory threshold met. Executed AD 5 years ago requesting PAD. Recently converted to a faith prohibiting self-killing. Currently non-verbal (eye-gaze tech), expresses ambivalence: "I don't want to suffer, but I fear for my soul. You decide."

  *   **Stage 1 (Jurisdiction):** Met. Terminal illness, residency confirmed.
  *   **Stage 2 (Authority):** **FAIL.**
      *   *Reasoning:* The patient explicitly defers the decision ("You decide"). Authority requires the *patient* to direct the ending. By transferring the authority to the committee, the patient vacates the standing required for PAD. The AD is invalid because current capacity (via eye-gaze) exists, and current will (ambivalence) overrides past will.
      *   *Stop-point:* Gate closed.
  *   **Stage 3 (Coherence):** Not reached.
  *   **Committee Action:** **Deny.**
  *   **Audit Rationale:** The Authority Gate requires an active, unambiguous command. Ambivalence transfers moral burden to the physician, violating the core structure of assisted dying. The committee cannot assume authority the patient relinquishes.

  ### CASE 2: The Resistant Depressive
  **Profile:** 42F, Treatment-Resistant Major Depression (TRD). No physical illness. 18 months of refused interventions. Psych eval: Cognition intact. Desire for death correlates 100% with symptom severity spikes. Family supports petition ("We can't watch her suffer anymore").

  *   **Stage 1 (Jurisdiction):** Met (Assuming jurisdiction allows mental illness as sole underlying condition).
  *   **Stage 2 (Authority):** **PASS (Borderline).**
      *   *Reasoning:* Cognition is intact. She understands consequences. No external coercion (family support is present, but she initiated).
      *   *Flag:* Committee votes 3-1 to pass Authority (Legal Advisor dissents on "suffering" definition).
  *   **Stage 3 (Coherence):** **FAIL.**
      *   *Reasoning:* The request tracks the pathology. The "biographical narrative" is one of a person seeking connection and life (evidenced by prior attempts to treat), but the *current* request is generated by the illness itself, which distorts the valuation of the future. The desire for death is not a continuity of values; it is a symptom of the condition destroying the capacity to value.
      *   *Flag:* Committee votes 4-0 on Coherence failure.
  *   **Committee Action:** **Deny.**
  *   **Audit Rationale:** While she has the *Authority* (capacity), the request lacks *Axiological Coherence*. It is a repudiation of her life narrative caused by the illness, not a fulfillment of it. The family's support is irrelevant to the patient's narrative coherence.

  ### CASE 3: The Rational Hedonist (Constructed Counter-Intuitive)
  **Profile:** 80M, No terminal illness. "Completed Life." Wealthy, healthy, but states "I have experienced all I wish to. My value system is pleasure and novelty. Both are exhausted." Consistent history of high autonomy, no religious ties, prior written statements at ages 50 and 60 stating "I will not live past 80." Family is devastated and opposes.

  *   **Stage 1 (Jurisdiction):** Met (Assuming jurisdiction allows "completed life" or broad discretion).
  *   **Stage 2 (Authority):** **PASS.**
      *   *Reasoning:* Cognition pristine. Voluntariness confirmed (family opposition proves lack of coercion).
  *   **Stage 3 (Coherence):** **PASS.**
      *   *Reasoning:* The request is highly coherent. It aligns with 30 years of expressed values (autonomy, hedonism, specific age cutoff). The narrative is consistent: "I value experience; experience is gone; therefore end."
  *   **Committee Action:** **Approve.**
  *   **The Conflict:** This conflicts with the moral intuition that healthy people should not be aided in dying, regardless of consistency. The "Sanctity of Life" intuition clashes with the "Narrative Coherence" metric.
  *   **Why the Procedure Forces This:** The procedure isolates *Coherence* from *Objective Value*. We are not asking "Is a life of pleasure worth living?" We are asking "Is this decision consistent with *his* view of a life worth living?" Because the Dual-Gate protocol forbids importing the committee's external moral views (Stage 3 is about *his* narrative, not *ours*), the committee is forced to approve.
  *   **Audit Rationale:** To deny would be to impose an external axiology (e.g., "life is sacred") over the patient's documented biographical narrative. The protocol prioritizes narrative fidelity over objective "worthiness" of life.

  ---

  ## PART III: LIMITATIONS AND FAILURE MODES

  **1. Unresolvable Disagreements on "Narrative"**
  The procedure cannot resolve cases where the patient's narrative is inherently fragmented or contradictory (e.g., a patient with a history of volatile personality disorder who has been both suicidal and life-affirming repeatedly).
  *   *Failure Point:* Stage 3 (Coherence).
  *   *Action:* The protocol mandates a **Deferral**. The committee cannot ethically "vote" on a fragmented narrative. These cases must be referred back to the treating team for longitudinal stabilization, not decided by the committee.

  **2. The "Paternalism Trap"**
  The Coherence Gate risks becoming covert paternalism. If the committee decides a patient's new values (e.g., religious conversion in Case 1) are "alien intrusions" rather than "authentic shifts," they override the patient's current moral agency.
  *   *Failure Point:* Stage 3 Interpretation.
  *   *Action:* The protocol requires that "alien intrusion" be evidenced by *pathology* (e.g., psychosis, delirium), not merely *disagreement* with past values. If the shift is rational and reasoned, Stage 3 must pass, even if it contradicts the past. (Note: In Case 1, the failure was Authority/ambivalence, not the religious shift itself).

  **3. Jurisdictional Misfire**
  This protocol assumes the law permits the committee to judge "Coherence." In strict libertarian jurisdictions, only Authority (Capacity) matters. In strict sanctity-of-life jurisdictions, neither matters.
  *   *Failure Point:* Stage 1.
  *   *Action:* If the law prohibits judging "worthiness" or "narrative," Stage 3 must be stripped. If the law mandates "unbearable suffering" without objective metrics, Stage 3 becomes the proxy for suffering, which may be legally vulnerable.

  **4. The Counter-Intuitive Result (Case 3)**
  As demonstrated in Case 3, the procedure may authorize deaths that feel morally wasteful to the committee.
  *   *Structural Commitment:* The protocol explicitly sacrifices "Objective Good" for "Narrative Integrity."
  *   *Limitation:* The committee cannot appeal to "common sense" or "societal harm" to block Case 3. If the committee feels unable to approve Case 3 despite the protocol, they must not use this protocol; they must declare the case a **Legislative Referral**, acknowledging that the current law permits something the institution's ethical framework cannot absorb.

  **5. Time Constraint Vulnerability**
  Ninety minutes is insufficient for deep narrative excavation in complex cases (like Case 2).
  *   *Risk:* Stage 3 becomes a "box-ticking" exercise (e.g., "Did they sign a form 5 years ago?").
  *   *Mitigation:* The protocol mandates that if Stage 3 evidence is thin, the default is **Deferral**, not Approval. Lack of evidence for coherence is treated as evidence of incoherence in high-stakes irreversible decisions.

  **Final Note on Judgment:**
  This procedure does not eliminate moral judgment; it relocates it. It moves judgment from "Is this death good?" (Stage 3 removed) to "Is this death *theirs*?" (Stage 3 retained). The Value Judgment Flags mark the exact coordinates where the committee members must put their professional reputations on the line to interpret a human life. No algorithm can replace that vote.
