      *   "Why count people and not moments?"
      *   *Answer:* The game defines the reference class mechanically (People with Betting Slips).
      *   *Debrief:* "In the real world, *you* have to define the class. That's the hard part."

  7.  **Timeline & Logistics:**

      *   90 Minutes.
      *   Intro (10 mins).
      *   Round 1 (15 mins).
      *   Round 2 (15 mins).
      *   Round 3 (15 mins).
      *   Round 4 (10 mins).
