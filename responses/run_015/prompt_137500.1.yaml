answer: |-
  # Workshop Design: The Observer's Wager

  **Title:** The Observer's Wager: A Game of Worlds and Counts
  **Duration:** 90 Minutes
  **Participants:** 20 Adults (5 Tables of 4)
  **Facilitator:** You
  **Materials:**
  *   5 Large Envelopes (labelled Table 1–5).
  *   20 Small Envelopes (labelled Participant 1–20).
  *   Betting Slips (20 per round).
  *   Policy Cards (1 per Table).
  *   Two large sheets of flipchart paper (Scoreboard A: Worlds, Scoreboard B: Observers).
  *   One Book Token (the prize).
  *   A coin (for the Facilitator's private use).

  ---

  ## Part 1: Introduction (10 Minutes)

  **The Hook:**
  Do not mention philosophy, anthropics, SSA, or SIA. Do not mention Doomsday or Boltzmann Brains.
  Say this:
  *"We are going to play a game about uncertainty. I hold a coin. In a moment, I will leave the room and flip it. If it is Heads, we are in a 'Small' configuration. If it is Tails, we are in a 'Large' configuration. You do not know which. You will receive information that might help you guess. You will bet on the coin. The table with the best strategy wins the book token."*

  **The Setup:**
  1.  **Tables:** Assign each table a number (1 to 5).
  2.  **Policy Cards:** Give each table one Policy Card. They must write down a rule *now*, before any rounds begin.
      *   *Prompt:* "If you find yourself holding a Betting Slip, what will you guess? Heads (Small) or Tails (Large)? Why?"
      *   *Constraint:* They must sign the card. This policy stands for the whole game unless a round specifically allows renegotiation (none will).
  3.  **The Secret:** Tell them you will determine the "World" (Heads/Tails) privately before each round. They will only know their own status.

  ---

  ## Part 2: The Rounds (50 Minutes)

  *Facilitator Note: You must act as the 'God's Eye'. You know the truth. They do not. Move briskly.*

  ### Round 1: The Standard (15 Minutes)
  **The Mechanic:** Uncapped Observers.
  1.  **Flip:** Privately flip the coin.
      *   **Heads (Small World):** Only **Table 1** is "Active". Tables 2–5 are "Void".
      *   **Tails (Large World):** **All 5 Tables** are "Active".
  2.  **Distribution:** Walk around.
      *   If Heads: Give Betting Slips *only* to Table 1. Give blank paper to Tables 2–5 marked "VOID — DO NOT BET".
      *   If Tails: Give Betting Slips to *everyone*.
  3.  **The Bet:** Those with slips guess Heads or Tails based on their Table Policy.
  4.  **The Reveal:** Announce the Coin result.
  5.  **Scoring:**
      *   **Scoreboard A (Worlds):** If the guess matches the Coin, +1 Point. (Max 1 point per round).
      *   **Scoreboard B (Observers):** If the guess matches the Coin, +1 Point *per Betting Slip*. (Max 5 points per round).
  6.  **Observation:** In the Large World, Scoreboard B inflates rapidly. In the Small World, they are equal.

  ### Round 2: The Cap (15 Minutes)
  **The Mechanic:** Capped Observers (The Presumptuous Philosopher Check).
  1.  **Flip:** Privately flip the coin.
      *   **Heads (Small World):** **Table 1** is Active. (4 Bettors).
      *   **Tails (Large World):** Randomly select **one Table** (e.g., Table 3) to be Active. The other 4 are "Void". (4 Bettors).
      *   *Crucial:* In both worlds, exactly 4 people get Betting Slips.
  2.  **Distribution:** Hand out slips accordingly. Mark others "VOID".
  3.  **The Bet:** Bettors guess using their original Policy.
  4.  **The Reveal:** Announce the Coin result *and* which table was selected in the Tails case.
  5.  **Scoring:** Same as Round 1.
  6.  **Observation:** Scoreboard A and B now move in lockstep. The "I am here" evidence no longer favours the Large World, because the number of 'heres' was capped.

  ### Round 3: The Pot (15 Minutes)
  **The Mechanic:** Divergent Incentives (Decision Theory).
  1.  **Flip:** Same distribution as Round 1 (Heads = 1 Table, Tails = 5 Tables).
  2.  **The Payout Rule:** Announce this *before* they bet.
      *   **Rule:** "There is a £100 pot. If you guess correctly, the pot is split equally among all *correct guessers in the actual World*."
  3.  **The Bet:** Bettors guess.
  4.  **The Reveal:** Announce Coin result.
  5.  **Calculation:**
      *   If Heads (Small) wins: 4 people split £100 = **£25 each**.
      *   If Tails (Large) wins: 20 people split £100 = **£5 each**.
  6.  **Observation:** Even if they think Tails is more likely (due to Round 1 logic), the *value* of guessing Heads is higher. This separates probability from utility.

  ### Round 4: The Void (5 Minutes)
  **The Mechanic:** Minimal Information.
  1.  **Flip:** Privately flip.
  2.  **Distribution:** Everyone gets a slip.
  3.  **Information:** Tell them: "I have flipped the coin. At least one person in this room exists. You are that person. Bet."
  4.  **The Bet:** They bet.
  5.  **Reveal:** Announce result.
  6.  **Point:** This isolates the "I exist" datum from any structural knowledge about tables or caps.

  ---

  ## Part 3: The Debrief (25 Minutes)

  *This is where you earn your fee. Do not lecture. Ask questions and map their answers to the concepts.*

  **1. The Two Scoreboards (SSA vs. SIA)**
  *   **Ask:** "Look at Scoreboard A (Worlds) and Scoreboard B (Observers). In Round 1, did they tell the same story?"
  *   **Reveal:** "Scoreboard A counts **Worlds**. It treats the Small and Large universe as equally likely events (50/50). This is the **Self-Sampling Assumption (SSA)**. It says: 'I am a random sample from the observers in the *actual* world.'"
  *   **Reveal:** "Scoreboard B counts **Observers**. It favoured the Large World because there were more of you to win points. This is the **Self-Indication Assumption (SIA)**. It says: 'I am a random sample from *all possible* observers. The more observers a world has, the more likely I am to be in it.'"
  *   **Takeaway:** "Your intuition in Round 1 likely pulled you toward Scoreboard B. That is the anthropic pressure."

  **2. The Capped Round (The Presumptuous Philosopher)**
  *   **Ask:** "In Round 2, the number of bettors was the same in both worlds. Did your confidence change?"
  *   **Reveal:** "In Round 1, SIA says 'Bet Large' because there are more of you. In Round 2, the 'Large' world was capped. Most people in the Large World were told to sit down and be quiet. If you are holding a slip, you are special in *both* worlds."
  *   **Takeaway:** "This breaks the Presumptuous Philosopher argument. If the number of observers who *get to bet* is fixed by the experimental setup, the anthropic advantage evaporates. You cannot presume the world is large just because it *could* hold more people, if those people aren't in the room."

  **3. The Pot (Decision Theory)**
  *   **Ask:** "In Round 3, did anyone switch to betting Heads (Small) even if they thought Tails was more likely?"
  *   **Reveal:** "This is the conflict between **Truth** and **Value**. SIA might tell you Tails is 5x more probable. But the payout structure made Heads 5x more valuable per capita."
  *   **Takeaway:** "Sometimes it is rational to bet on the less likely world if the stakes are distributed differently. This is why cosmologists and philosophers fight: are we maximising truth (Scoreboard A) or total utility (Scoreboard B)?"

  **4. Handling Objections**

  *   **The Cosmology Enthusiast (Infinite Universes):**
      *   *They will say:* "But if the universe is infinite, the ratios break down. Measure problems make this meaningless."
      *   *Your Response:* "You are absolutely right. This game uses finite numbers to isolate the logic. Infinity breaks the scoreboard—that is exactly why we start with finite. If you can't agree on the score in a room of 20 people, you certainly won't agree on the measure of an infinite multiverse. Your job is to solve the scoreboard, not the cosmos."
      *   *Role:* Appoint them the "Auditor" for the scoreboards. Give them a pen. Let them check the math.

  *   **The Reference Class Question ("Why count people?"):**
      *   *They will ask:* "Why are we counting people? Why not moments? Or minds? Or species?"
      *   *Your Response:* "In this game, the reference class was 'People with Betting Slips'. I defined it for you. In the real world, *you* have to define it. That is the hard part. If you define the class as 'Conscious Moments', the Doomsday Argument looks different. If you define it as 'Civilisations', it changes again. The game works because the rules were clear. Reality doesn't give you rules."

  *   **The "Coin Toss" Dismissal:**
      *   *They will say:* "It's just a 50/50 coin toss."
      *   *Your Response:* "The coin was 50/50. But *you* were not. In Round 1, a random 'You' was 5x more likely to exist in Tails. The coin is fair; the sampling is not."

  **5. Limitations (What You Must Supply)**
  *   Be frank: "This game cannot tell you which assumption is *true*. Physics doesn't care about our scoreboards. It only shows that your answer depends on how you keep score. The 'truth' of the Doomsday Argument rests on whether the universe cares about World-Counting or Observer-Counting. That is not a game question; it is a metaphysical one."

  ---

  ## Part 4: Failure Modes & Mitigation

  **1. The Shouting Match About Priors**
  *   *Risk:* Participants argue that the coin wasn't 50/50 to begin with.
  *   *Fix:* Hard rule. "For the purpose of this game, the Coin is the Law. 50/50. Disputing the coin is like disputing the rules of chess. We are testing the betting, not the minting."

  **2. Boredom in "Void" Tables**
  *   *Risk:* In Round 1 (Heads) and Round 2, most tables do nothing.
  *   *Fix:* The "Void" participants are the **Scorekeepers**. They must tally the points for Scoreboard A and B. This keeps them engaged in the math of the divergence.

  **3. Confusion on Round 3 Payout**
  *   *Risk:* They don't understand the split pot.
  *   *Fix:* Write the math on the board *before* the bet.
      *   Heads Win: £100 / 4 people = £25.
      *   Tails Win: £100 / 20 people = £5.
      *   Ask: "Do you want to be right in a crowd, or right in a room?"

  **4. Running Over Time**
  *   *Risk:* Debrief drags.
  *   *Fix:* If time is tight, cut Round 4. It is the least mechanically distinct. Round 1, 2, and 3 carry the core weight.

  ---

  ## Part 5: Scaling Down (45 Minutes / 8 Colleagues)

  **Can it scale?** Yes, but the "World" mechanics need compression.
  *   **Setup:** 2 Tables of 4.
  *   **Worlds:**
      *   Small: 1 Table Active.
      *   Large: 2 Tables Active.
  *   **Rounds:** Run only Round 1 (Standard) and Round 2 (Capped). Skip Round 3 (Payout) and 4 (Minimal).
  *   **Debrief:** Condense to 15 minutes. Focus entirely on the divergence between Scoreboard A and B in Round 1, and the collapse of that divergence in Round 2.
  *   **Stakes:** Keep the book token. It works better with colleagues who know you; the bragging rights are higher.

  ---

  ## Facilitator's Cheat Sheet (Keep this in your pocket)

  *   **SSA (Self-Sampling Assumption):** "I am a random observer *in this world*." (Scoreboard A).
  *   **SIA (Self-Indication Assumption):** "I am a random observer *from all possible worlds*." (Scoreboard B).
  *   **Presumptuous Philosopher:** "The world must be large because I exist." (Refuted by Round 2 Cap).
  *   **Reference Class:** "Who counts as an observer?" (Defined by Betting Slips).
  *   **The Book Token:** Award it to the Table whose *Policy Card* would have accumulated the most points across Scoreboard A *and* B combined. This rewards robust strategy over lucky guessing.

  **Final Note:**
  When they ask, "But which one is real?"
  Your answer: "That is why you write the column, and I run the game. The game shows you the trap. You have to tell them how to walk around it."
