      *   *Adapting to 20 people in a room:*
          *   We can't create more people. We must simulate the *probability space*.
          *   Use cards.
          *   **Round 1 (The Divergence):**
              *   Facilitator flips coin.
              *   Heads (Small): 1 Table is "The World." (4 people).
              *   Tails (Large): 5 Tables are "The World." (20 people).
              *   *Constraint:* In both cases, *everyone in the room* gets a betting slip.
              *   *Wait, this breaks the logic.* If everyone bets in both cases, there is no anthropic selection.
              *   *Fix:* In the Small World, only 1 table is *allowed* to bet. But how do we select them without revealing the World?
              *   *Fix 2:* The Facilitator selects the tables *after* the bet? No.
