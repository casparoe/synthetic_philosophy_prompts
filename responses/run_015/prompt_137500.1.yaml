      *   If World L is capped to the same number of bettors as World S, then finding yourself as a bettor gives *no* evidence for L.
      *   This directly addresses the "Presumptuous Philosopher" (who assumes L because there are more observers). If the observers are capped, the presumption vanishes.
      *   *Implementation:* In World L, most observers are "asleep" or "non-betting."
      *   *Game:* In World L, only 1 Table is chosen to bet (randomly). In World S, 1 Table is chosen to bet (randomly).
