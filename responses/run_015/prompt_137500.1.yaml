          *   *Better:* Use Envelopes.
          *   Every participant gets an envelope.
          *   Inside is a role: "Bettor" or "Spectator."
          *   The distribution of roles depends on the World Coin Flip.
          *   *Round 1:*
              *   Coin S: 4 Bettors (1 Table), 16 Spectators.
              *   Coin L: 20 Bettors (5 Tables).
              *   Participants open envelopes. If "Bettor," they bet. If "Spectator," they watch.
              *   *Betting:* Bettors write down S or L.
              *   *Reveal:* Facilitator reveals Coin.
              *   *Scoring:* Did the Bettors get it right?
          *   *Round 2 (Capped):*
              *   Coin S: 4 Bettors (1 Table).
              *   Coin L: 4 Bettors (1 Table chosen from 5).
              *   *Key:* In World L, 16 people are Spectators even though the world is Large.
              *   *Intuition:* If I am a Bettor, does it make L more likely? No, because Bettors are capped.
          *   *Round 3 (Payout):*
              *   Same distribution as Round 1.
              *   Payout Rule A: £10 per correct Bettor.
              *   Payout Rule B: £100 pot split among correct Bettors *in the winning World*.
              *   *Wait, the prompt asks for "Fixed prize" vs "Single prize split among everyone in that bettor's world".*
              *   This tests "Total Utility" vs "Average Utility" or similar decision theoretic splits.
          *   *Round 4 (Minimal):*
              *   No info on distribution. Just "You exist."

      *   *Wait, one constraint:* "Participants... must commit in advance... to a policy."
      *   This implies the Tables discuss *before* opening envelopes.
      *   "If we find ourselves as Bettors, what will we guess?"
      *   This is excellent. It forces the "Policy" aspect of Decision Theory (UDT-ish).

  4.  **Developing the Scoreboards:**

      *   **Scoreboard A (World-Counting):** Counts the World as 1 point if the majority of *Tables* guessed right? No.
      *   **Scoreboard A (SSA-style):** Treats the Coin Flip as the primary event. 50/50 prior. Correct guess = 1 point for the *World*.
      *   **Scoreboard B (Observer-Counting):** Counts every correct *Bettor*.
      *   *The Divergence:* In Round 1 (Uncapped), Scoreboard B heavily favours the "Large World" guess because there are more bettors in L. Scoreboard A treats S and L equally.
      *   *The Reveal:* Show them that depending on how you tally the score, a different strategy wins.

  5.  **Addressing the "Infinite Universes" Person:**

      *   This person will try to break the game with measure problems.
      *   *Strategy:* Acknowledge the point, but bracket it. "This game uses finite numbers to isolate the logic. Infinity breaks the scoreboard, which is exactly why we start with finite."
      *   Give them a specific role: "The Auditor." Let them check the math.

