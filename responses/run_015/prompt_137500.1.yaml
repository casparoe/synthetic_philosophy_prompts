      *   *Okay, Policy Betting.* This is smarter.
      *   Teams (Tables) agree on a rule: "If we find ourselves in situation X, we bet Y."
      *   Then the Facilitator reveals the World.
      *   Then the Facilitator reveals which Observers within that World are "Active."

      *   *Designing the Three Rounds:*
          *   **Round 1 (Standard):** World S (1 Active Table), World L (5 Active Tables). All 20 people are in the room. Facilitator randomly selects which tables are "Active" based on the World.
              *   *Wait, if I am at a table that is told "You are inactive," I don't bet.*
              *   *So:* Facilitator flips coin.
              *   If S: Randomly pick 1 table to be "Real." The other 4 tables get "Void" slips (no bet).
              *   If L: All 5 tables are "Real."
              *   *Problem:* The 4 "Void" tables in World S know they aren't real. They can't bet.
              *   *The participants who *do* bet know they are real.*
              *   *The Bet:* "Is the World S or L?"
              *   *SIA:* I'm betting, so likely L (more bettors).
              *   *SSA:* I'm a random table. 50/50.
          *   **Round 2 (Capped):**
              *   World S: 1 Active Table.
              *   World L: 1 Active Table (chosen from 5).
              *   *Result:* Number of bettors is identical. Anthropics should vanish.
          *   **Round 3 (Payout/Shared):**
              *   Same as Round 1, but payout is shared among the *World's* population, not individual.
              *   This changes the *value* of the bet, not just the probability. (Decision Theory).
          *   **Round 4 (Minimal Info):**
              *   Just "At least one observer exists."

