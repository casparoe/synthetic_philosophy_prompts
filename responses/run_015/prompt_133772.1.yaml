answer: |-
  To serve as the basis for a statute governing gradual neural replacement, a theory of personal identity must function less as a metaphysical truth and more as an operational tool for registrars and clinicians. The primary desideratum is legal operability, which demands that the theory yield determinate verdicts in binary contexts. The law requires clear answers to questions of ownership, liability, and status; a theory that returns vague degrees of identity is unusable because a registrar cannot file a deed to a house under partial ownership derived from partial personhood. This requirement for determinacy is not a philosophical preference but a structural necessity of the legal system, which must distinguish between the liable and the non-liable, the living and the dead. Consequently, the theory must incorporate a decision rule that converts any underlying metaphysical continuity into a binary legal status, even if that conversion introduces an arbitrary cutoff point. This leads directly to the requirement that the theory must not contradict established neuroscience or ordinary biology. It cannot posit identity preservation across total functional cessation or deny the causal role of neural tissue, because clinicians must be able to verify compliance without engaging in metaphysical speculation. If a theory claims identity survives the destruction of all functional connectivity, it forces clinicians to certify life where their instruments show none, creating an untenable conflict between medical fact and legal fiction.

  Beyond these baseline constraints, the theory must pass specific stress tests derived from the procedural variations you have outlined. Regarding the cold swap, where a prosthetic unit runs on recording rather than live input, the theory must specify whether causal history or functional output is the criterion for identity. If the theory prioritizes functional output, the cold swap is permissible; if it prioritizes causal connectivity, the procedure halts until live integration is achieved. This distinction is required because liability for actions taken during the cold swap period depends on whether the agent was truly the subject or merely a simulation of them. Similarly, regarding the rate of replacement, the theory must explain whether time is a constitutive element of identity. If a theory allows the twenty-year procedure to succeed but forbids the afternoon anaesthetic version, it must identify the mechanism lost in the rapid swap, such as the time required for psychological integration or systemic homeostasis. If it cannot identify such a mechanism, it must treat the rates as equivalent, because allowing rate to matter without a functional justification invites arbitrary discrimination against those who cannot afford a decades-long procedure. The dormant duplicate case tests the requirement of uniqueness. A usable theory must determine whether the mere existence of an inert duplicate affects the identity of the original. If the theory holds that identity is unique, the duplicate's existence is irrelevant until activated; if identity is based on pattern alone, the duplicate poses a threat to the original's status. The statute needs to know if the destruction of the duplicate is a prerequisite for the original's continued legal existence, as this dictates whether the clinic commits property destruction or merely waste disposal.

  The re-implantation case introduces the problem of fission, where two candidates claim the same past. The theory must provide a priority rule, such as continuity of consciousness or physical precedence, to decide which candidate inherits the debts and rights. Without this, the legal system faces contradictory claims that cannot be adjudicated. The thinning case, where one unit is replaced by two, tests mereological stability. The theory must ensure that identity is not lost through mere subdivision of function, otherwise, any increase in neural complexity could inadvertently terminate the person. Finally, the institutional questions regarding property, debt, marriage, and homicide require the theory to specify whether personhood is a bundle of rights or a monolithic status. If the theory allows the post-procedure candidate to own the house but not answer for crimes, it creates a category of entity that the law does not currently recognize, complicating enforcement. Therefore, the theory should ideally treat these statuses as inseparable, unless there is a compelling safety reason to decouple them, such as shielding the new entity from the old entity's crimes if the psychological continuity is deemed insufficient for moral responsibility.

  The most critical test, however, is the directive revocation case. Here, a subject instructs the team to halt if capacity falls, then revokes this instruction mid-procedure. A usable theory must locate the authority to consent. If the theory holds that the pre-procedure person and the two-thirds replaced person are identical, the revocation stands as a valid update of will. If the theory holds that identity has degraded sufficiently by the two-thirds mark, the pre-procedure directive might bind the later stage as a living will binds a incapacitated patient. The theory cannot remain silent here, because acting on the wrong instruction constitutes either battery or negligence. This requires the theory to define the locus of agency over time, specifying whether authority resides in the continuous biological organism or the current psychological capacity. Without this, clinicians cannot know whose command obeys the law.

  When evaluating common demands placed on such a theory, we must distinguish genuine desiderata from philosophical prejudices. The demand for a determinate yes-or-no answer is genuine, driven by the binary nature of legal statutes. The demand that the theory invoke no further fact beyond the physical and functional ones is also genuine, as public policy cannot rely on unverifiable metaphysical entities like souls. However, the demand that the theory vindicate the first-personal conviction of the subject is a prejudice; subjects can be mistaken about their own persistence, and safety regulations often override subjective confidence. Similarly, the demand to treat biological and prosthetic tissue on a par is not strictly required; the statute could privilege biological tissue for safety reasons without contradicting logic, though doing so might undermine the procedure's purpose. The genuine tension lies between the requirement that no single swap be pivotal and the requirement that the verdict track something that could be lost by degrees. If identity is lost by degrees, there must be a point where enough is lost to change the legal verdict, which implies a pivotal swap. If no single swap is pivotal, identity never changes, which contradicts the possibility of loss. This pair is satisfiable only by adopting a pragmatic cutoff: the theory must acknowledge that while metaphysically no single swap matters, legally a threshold must be drawn to prevent infinite regress, effectively treating the Sorites paradox as a regulatory boundary rather than a metaphysical truth.

  The single requirement that does the most work in excluding existing theories is the demand for empirical verifiability combined with determinacy. This excludes any theory reliant on non-physical continuants, such as soul-based theories, because registrars cannot measure soul continuity. It also excludes strict psychological continuity theories that allow for branching, because the law cannot assign unique responsibility to branching entities without a priority rule that the theory itself does not provide. The theory that is most strongly excluded is one that posits identity as a matter of degree without a mechanism for converting those degrees into binary legal status, as this leaves the statute without an enforcement mechanism.

  If forced to abandon a requirement, I would abandon the requirement that the verdict track something that could be lost by degrees. I would do this if a new case demonstrated that functional isomorphism is perfectly preserved throughout the procedure, yet the subject's capacity for moral reasoning degrades unpredictably due to emergent properties of the hybrid system. In such a scenario, tracking degrees of identity becomes less important than tracking capacity for responsibility. If the prosthetic system behaves identically to the original but lacks the internal architecture for genuine intent, holding it liable for crimes would be unjust, regardless of identity continuity. This would force a shift from an identity-based statute to a capacity-based statute, where rights and liabilities attach to functional capability rather than historical persistence. This abandonment would be driven by the realization that the law cares more about who can be punished or trusted than about who metaphysically survives, making capacity a more robust foundation for policy than identity.
