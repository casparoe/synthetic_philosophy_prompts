  ok so im running a small philosphy meetup at my local library, maybe 8-10 people, one hour. i want an activty about the sorites paradox but instead of sand heaps i want to use gradual brain-cell replacement - like swapping neurons for synthetic ones one at a time. my weird idea is that there might actually be a sharp cutoff where "you" stop being you, but its hidden and nobody can know exactly where. can you design a simple game or roleplay where the group has to act like that cutoff exists, try to pin it down, and then realize they cant? i want them to feel why epistemicism about vagueness isnt totally nuts. include basic rules, any roles, and a short debrief mapping it back. also be honest about what will break when i run it - im not a pro teacher. dont send me papers or a bibliography, just the design.
