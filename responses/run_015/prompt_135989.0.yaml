      *   *Idea 3: Roleplay with Constraints.* One person is the "Subject." Others are "Surgeons." They have to make a decision based on incomplete info.
      *   *Refinement:* To capture Epistemicism, the players need to feel the *pressure* of a binary truth (You/Not-You) while lacking the *tools* to distinguish it.
