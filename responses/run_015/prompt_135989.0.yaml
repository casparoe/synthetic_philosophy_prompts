answer: |-
  # Activity Design: The Threshold Tribunal

  **Time:** 60 Minutes
  **Group Size:** 8-10 People
  **Goal:** Experience the frustration of Epistemicism (the idea that a sharp boundary exists but is unknowable) regarding personal identity.

  ## Part 1: The Setup (10 Minutes)
  **The Story:**
  Tell the group: *"In 2045, a procedure called 'NeuroSwap' allows you to replace dying neurons with synthetic ones. One at a time. You remain conscious the whole time. A criminal, Alex, committed a crime. Then Alex underwent NeuroSwap. We need to know: Is the person in the dock the same 'Alex' who committed the crime?"*

  **The Rule (Crucial):**
  Write this on a whiteboard/paper:
  1.  **Bivalence:** Alex is either **Guilty** (Same Person) or **Innocent** (Different Person). There is no "sort of."
  2.  **Continuity:** Each synthetic neuron is functionally identical to the biological one.
  3.  **The Task:** There are 10 Stages of replacement (10% to 100%). You must place the "Gavel" on the **exact card** where Alex stops being Alex.

  **Materials:**
  *   10 Index Cards (numbered 1 to 10).
  *   1 Object to serve as "The Gavel" (a book, a stapler, etc.).
  *   A timer.

  ## Part 2: The Game - "Pin The Boundary" (30 Minutes)

  **Phase 1: The Walkthrough (10 mins)**
  Lay the 10 cards in a line.
  *   **Card 1:** 10% synthetic.
  *   **Card 10:** 100% synthetic.
  *   Read a quick script for each: *"Card 1: Alex remembers childhood, feels pain, looks identical."* ... *"Card 10: Alex is fully synthetic, memories intact, behavior identical."*
  *   Ask the group: *"Is Card 1 Alex?"* (Everyone says Yes).
  *   Ask the group: *"Is Card 10 Alex?"* (Everyone says No, it's a robot copy).
  *   Remind them: *"Somewhere between 1 and 10, Alex ceased to exist. Find the switch."*

  **Phase 2: The Deliberation (10 mins)**
  The group must discuss and agree on **one single card** where the switch flips.
  *   *Example:* If they pick Card 5, that means Card 4 is Alex, and Card 5 is NOT Alex.
  *   **Your Role:** Act as the "Court Clerk." Do not offer opinions. Only enforce the rule: *"You must pick one. You cannot say 'it's fuzzy'."*

  **Phase 3: The Interrogation (10 mins)**
  Once they pick a card (e.g., Card 5), challenge them.
  *   Point to Card 4 and Card 5.
  *   Ask: *"What is the specific difference between the person at Card 4 and the person at Card 5?"*
  *   They will say: *"Well, one more neuron..."*
  *   Ask: *"But we agreed one neuron makes no difference. That's the premise."*
  *   Ask: *"So why is 4 'Guilty' and 5 'Innocent'?"*
  *   They will struggle. They will feel the arbitrariness.
  *   **The Twist:** Tell them: *"Imagine the Universe has a fact of the matter. One of these cards IS the true cutoff. But you have no tool to measure it. You just voted."*

  ## Part 3: The Debrief (20 Minutes)
  Sit in a circle. Put the cards away. Ask these three questions:

  1.  **"How did it feel to pick a number?"**
      *   *Expected:* Annoying, arbitrary, guessing.
      *   *Point:* Epistemicism admits it feels arbitrary to *us*, but claims it isn't arbitrary in *reality*.

  2.  **"If you couldn't tell the difference between Card 4 and 5, how can there be a truth about which one is 'Alex'?"**
      *   *Point:* This is the core of Epistemicism. Truth > Knowability. Just because we can't measure the exact moment a balloon pops (molecularly), doesn't mean it didn't pop at a specific micro-second.

  3.  **"Why do we want there to be a sharp line?"**
      *   *Point:* Our legal and moral systems require binary choices (Guilty/Innocent, Alive/Dead). Vagueness breaks the law. Epistemicism saves the law, even if it breaks our intuition.

  ---

  # Honest Assessment: What Will Break
  *Since you aren't a pro teacher, here is where this usually goes wrong and how to fix it.*

  **1. The "Fuzzy Logic" Rebellion**
  *   **The Break:** Someone will say, *"This is stupid. Identity is a spectrum. They are 50% Alex."*
  *   **The Fix:** Don't argue philosophy. Argue **consequences**. Say: *"Okay, but the law won't accept 50%. We have to send someone to prison or let them go. We are forced to draw a line. Where?"* Force the binary constraint.

  **2. The "Guessing Game" Vibe**
  *   **The Break:** If you act like *you* know the answer, they will treat it like a riddle where you hold the key.
  *   **The Fix:** Be clear: *"I don't know the answer. The Universe might know. You are the judges. You have to write the verdict."* Keep the authority on them.

  **3. Time Creep**
  *   **The Break:** Philosophy meetups love to talk. You will spend 40 minutes on the Setup and 5 minutes on the Game.
  *   **The Fix:** Be a ruthless timekeeper. When the 10-minute deliberation is up, slam the Gavel. *"Time's up. Point to the card. Now."* The pressure helps simulate the "forced decision" of reality.

  **4. The "So What?" Factor**
  *   **The Break:** They might leave thinking, *"Okay, we can't know. So what?"*
  *   **The Fix:** In the debrief, emphasize the **humility**. Epistemicism teaches us that our language and perception are too blunt to cut reality at its joints. Just because we can't see the line doesn't mean the cliff isn't there.

  **5. Group Size Dynamics**
  *   **The Break:** With 10 people, 2 might dominate the conversation.
  *   **The Fix:** During the "Interrogation" phase, specifically ask the quietest person: *"Do you agree with their reason for picking Card 5? Why or why not?"*

  # Facilitator Cheat Sheet (Keep this in your pocket)
  *   **If they stall:** *"If you don't pick, the defendant stays in jail forever. Pick."*
  *   **If they say 'It depends on the definition of Alex':** *"The definition is 'Continuous Consciousness'. That's the only definition we have. Where did it break?"*
  *   **If they get frustrated:** *"Good. That frustration is the philosophy. You are feeling the limits of human knowledge."*
