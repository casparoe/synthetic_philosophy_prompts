answer: |-
  # The Aunt Hillary Decision Tree
  **Starting Commitment:** *A mature ant colony is a genuine biological individual (a Darwinian individual) with traits selection acts upon.*  
  **Goal:** *Determine the mental status of this individual.*

  ---

  ## The Flowchart

  ```text
  START: Colony is a Biological Individual
    │
    ▼
  [Q1] NEST-SITE CHOICE & NECROPHORY
  When the colony chooses a site or removes dead, does the outcome represent 
  information (e.g., "Site A is best") that NO single ant possesses or compares?
    │
    ├── NO ──► LEAF A: MERE AGGREGATE
    │           (Biologically real, mentally null; mechanical causation only)
    │
    └── YES ──► (Colony represents what parts do not)
                │
                ▼
            [Q2] REPLETES & TRAILS (THE VEHICLE)
            To maintain colony states (e.g., food storage levels), is physical 
            structure (honey-pots, pheromone trails, nest architecture) required?
            │
            ├── YES ──► LEAF B: COGNITION SPREAD ACROSS NEST & TRAILS
            │           (Extended cognition; mind includes non-ant matter)
            │
            └── NO ────► (Vehicle is internal to ants)
                        │
                        ▼
                    [Q3] SOLDIER-TO-WORKER RATIO (REDUCTION)
                    The colony maintains a ratio in response to rivals. Is this 
                    state *reducible* to the sum of individual ant mental states?
                    │
                    ├── YES ──► LEAF C: NOTHING OVER AND ABOVE THE ANTS' MINDS
                    │           (Colony mind is just the sum of part-minds)
                    │
                    └── NO ────► (Emergent colony state)
                                │
                                ▼
                            [Q4] COLONY DEATH IN STORM (PHENOMENOLOGY)
                            If the colony dies (organization collapses) but most 
                            ants survive scattered, is there a loss of *experience*?
                            │
                            ├── NO ────► LEAF D: INTENTIONAL SYSTEM (NO WHAT-IT'S-LIKENESS)
                            │           (Mind is a functional/predictive stance only)
                            │
                            └── YES ───► (There is a subjective fact of the matter)
                                        │
                                        ▼
                                    [Q5] FISSION (BOUNDARIES)
                                    When one colony splits into two, is there a 
                                    precise fact about when one subject becomes two?
                                    │
                                    ├── NO ────► LEAF E: NO DETERMINATE ANSWER
                                    │           (Subject boundaries are stipulated/vague)
                                    │
                                    └── YES ───► LEAF F: REAL COLONY-LEVEL MIND
                                                (Ants play the role of neurons; 
                                                 colony is the true subject)
  ```

  ---

  ## Logical Space & Node Anchors

  The tree is built from six branching questions. You can answer each based on the concrete case provided without knowing which philosophical position you are endorsing.

  1.  **Representation (Nest-site/Necrophory):** *Can the system solve a problem the parts cannot?*
      *   **Case:** In quorum sensing, no ant compares Site A vs. Site B. The *colony* does. If you deny this is representation, you land at **Mere Aggregate**.
  2.  **Vehicle (Repletes/Trails):** *Where is the memory stored?*
      *   **Case:** Replete ants store food, but pheromone trails store path efficiency. If the "mind" requires the trails, you land at **Cognition Spread Across Nest**.
  3.  **Reduction (Soldier Ratio):** *Is the whole just the sum of parts?*
      *   **Case:** The colony shifts ratios over weeks. No ant knows the ratio. If this state is just the ants doing their jobs, you land at **Nothing Over And Above Ants' Minds**.
  4.  **Phenomenology (Colony Death):** *Is there feeling?*
      *   **Case:** A thunderstorm destroys the nest structure; the colony "dies" even if ants live. If nothing "felt" like dying, you land at **Intentional System**.
  5.  **Boundaries (Fission):** *Are subjects precise?*
      *   **Case:** One colony splits. Is there a second-by-second fact of when "Aunt Hillary" became two? If not, you land at **No Determinate Answer**.
  6.  **Ontology (Implicit in Q4/Q5):** *Is the mind real or a stance?*
      *   If you pass Q4 (Yes, there is experience) and Q5 (Yes, boundaries are precise), you land at **Real Colony-Level Mind**.

  ---

  ## Mapping the Positions (Leaves)

  | Leaf | Position | Key Commitment |
  | :--- | :--- | :--- |
  | **A** | **Mere Aggregate** | Biological individuality does not entail mental capacity. |
  | **B** | **Extended Cognition** | The vehicle of cognition includes the environment (trails/nest). |
  | **C** | **Reductive Individualism** | Colony cognition exists but reduces entirely to ant cognition. |
  | **D** | **Dennett's Intentional System** | The colony has beliefs/goals predictively, but no qualia. |
  | **E** | **Metaphysical Vagueness** | "Subjecthood" is a human stipulation, not a natural fact. |
  | **F** | **Emergent Materialism** | The colony is a literal mind; ants are its neurons (Hofstadter). |

  ---

  ## Empty & Incoherent Combinations

  In the logical space defined by these questions, certain paths are closed:

  *   **Incoherent:** *Yes to Q1 (Representation) + Yes to Q2 (Extended) + Leaf C (Nothing over ants' minds).*
      *   **Reason:** If the cognition relies on trails/nest (Q2-Yes), it cannot be *nothing over and above* the ants' minds, because the trails are not minds.
  *   **Unattractive/Undefended:** *Yes to Q1 + Yes to Q3 (Reducible) + Leaf F (Real Colony Mind).*
      *   **Reason:** If the state is reducible to the ants' minds (Q3-Yes), you cannot claim the colony is a *distinct* real mind (Leaf F). You are forced to Leaf C.
  *   **Incoherent:** *Yes to Q5 (Precise Boundaries) + Leaf E (No Determinate Answer).*
      *   **Reason:** Contradictory by definition.

  ---

  ## Confidence Check & Rebuilding

  **Least Confident Fork:** **Q4 (Phenomenology/Colony Death).**
  *   **Why:** It asks the user to introspect on whether a *colony* has "something it is like" to die. Most people cannot answer this without already having a theory of consciousness. A materialist might say "No" because there is no colony-brain, while a functionalist might say "Yes" because the organization died. The answer is theory-laden.
  *   **Rebuild Condition:** If the group finds Q4 unanswerable, I would replace it with a question about **Integration**: *"If you scramble the ants but keep the pheromone trails, does the 'mind' persist?"* This tests the substrate dependence without asking about qualia directly.

  **Note on Leaf Separation:**
  **Leaf D (Intentional System)** and **Leaf C (Nothing Over Ants' Minds)** are difficult to separate in practice. Dennett's view (D) often implies that talking about "ants' minds" is also just a stance. However, for this tree, they are separated by **locus**: Leaf C locates the mind in the *ants* (summed), while Leaf D locates the intentional stance in the *colony* (regardless of ants' internal states). If your group treats these as identical, merge them into "Functionalist Colony Mind."
