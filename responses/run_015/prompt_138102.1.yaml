answer: |-
  The notice lay on the linoleum table, square and white, distinct against the crumbs of toast. Elara stood over it, her hand still on the knob of the cast-iron stove. The room was warm, too warm for February, but the valley cold pressed against the windowpanes, looking for a way in.

  The paper bore the seal of the Office of Marginal Effects. For twenty years, her annual statement had read *Difference Number: 0.000*. Below that, the official classification: *Without Marginal Effect*. It was a moral geometry she understood. She was a school custodian; she swept up dust, she mopped halls, she burned the cheap coal to keep the boiler room humming. Her share of the winter haze was too small to measure. The Office said it didn't count, so it didn't count.

  This year, the number was different. *Difference Number: 1.000*. Below it: *TIPPING HOUSEHOLD*.

  The back door opened, letting in a gust of icy air and her grandson, Leo. He shook the snow from his coat and saw her standing there. He saw the paper.

  "They finally caught up," he said, not looking at her. He poured himself coffee.

  "It's a mistake," Elara said. Her voice sounded thin in the hot room. "I burned the same as last year. The same as the year before."

  Leo leaned against the counter, holding the mug with both hands. "Not a mistake, Nana. The pool filled up. You were the one who lit the fire when the bucket was full."

  "But the death was already there," she said. She pointed at the stove. "The smoke was already in the air. The sick people were already sick. If I had kept the damper closed yesterday, Mrs. Gable down the street would have lit hers ten minutes later. She would have gotten the notice. The person dies either way."

  "You got the notice," Leo said.

  "Because of the rounding. Because of the math." She tapped the paper. "For twenty years, I was nothing. 0.000. That was the truth. My smoke didn't kill anyone. Now you're saying I killed a whole person because I was the last one to add a drop to a full cup?"

  "It's not about the cup," Leo said. "It's about the switch. You flipped it."

  "I didn't flip anything. I just stayed warm." Elara looked at the black iron of the stove. It radiated a heavy, dull heat. "If I hadn't burned it, the total would have been one death minus a fraction. That fraction doesn't save a life. It just changes the name on the paper."

  "So it doesn't matter what you do?" Leo asked. He took a sip of coffee, watching her over the rim.

  "It matters that I'm warm. It matters that the school is heated. But this..." She gestured to the notice. "This says I did something different. I didn't. I did what everyone does. I'm just the one the line landed on."

  "The line has to land on someone," Leo said. "If nobody accepts the tip, nobody accepts the smoke. Then everyone burns, and everyone says 0.000, and the bodies pile up without names."

  "They have names," Elara said sharply. "Just not on this paper."

  She walked to the stove and opened the small iron door. The coals inside glowed orange, breathing heat into the room. Outside, the valley was gray, the sky a low ceiling of particulate matter. She knew the statistics. She knew the Office wasn't lying about the total count. But the logic of the notice felt like a trap. It asked her to carry a weight that belonged to the city, simply because the arithmetic of the pool had shifted onto her doorstep.

  If she stopped burning today, the pool would reset. The remainder would carry over to the next household. The deaths would continue. The only thing that would change is that her name wouldn't be on the next notice. She would be 0.000 again. Safe. Clean.

  "Are you going to turn it off?" Leo asked. He nodded at the fire.

  Elara looked at the coals. She thought of the cold school halls, the pipes that would freeze, the children who would sit in coats during arithmetic. She thought of the statistical death charged to her account. It was a full unit now, not a fraction. It felt heavier than the fractions ever had, even though the smoke was the same.

  "If I turn it off," she said, "someone else tips the bucket tomorrow."

  "Maybe," Leo said. "Or maybe the pool drains a little. Maybe someone else sees your notice and thinks twice."

  "Or maybe they just wait for the next name."

  She picked up the poker and stirred the coals. Sparks flew up the flue, joining the haze outside. The heat hit her face, dry and immediate. The notice lay on the table, stark white in the dim kitchen. She did not pick it up. She did not crumple it. She let it sit there, a fact of the house, like the dust on the sill or the cold in the walls.

  "Keep the door closed," she said. "Let it draft."

  Leo didn't move. "Nana."

  "It's winter, Leo," she said. She closed the iron door with a solid clank. The latch caught. The fire continued to burn behind the metal, invisible and hot.

  | Move in the story | The thesis it leans on | Status | Strongest objection |
  | :--- | :--- | :--- | :--- |
  | Elara's reliance on the 0.000 number to justify past burning. | If an individual's contribution to a harm is below a perceptible or reporting threshold, it carries no moral weight. | Contested | Thresholds are arbitrary; many small harms sum to large harms, so each contributor shares responsibility for the total. |
  | The Office's "Tipping Household" notice assigning full blame. | Actual causation (triggering the threshold) assigns full responsibility for the outcome, regardless of prior contributions. | Invented for this story | Real-world collective harms are probabilistic, not arithmetic; no single agent strictly "completes" a death in this binary way. |
  | Elara's argument that Mrs. Gable would have tipped the pool instead. | In overdetermined cases (where the outcome is inevitable), individual agency does not change the outcome and thus implies no responsibility. | Contested | Complicity exists even in overdetermination; participating in a harmful practice is wrong even if others would have done the same. |
  | Leo's suggestion that accepting the notice might change others' behavior. | Moral responsibility includes signaling effects; accepting blame can alter social norms and reduce future harm. | Settled among people who work on this | Signaling effects are empirically uncertain; one person's acceptance may not influence the collective behavior enough to matter. |
  | Elara continuing to burn the fuel despite the notice. | Practical necessity (warmth/survival) can override abstract moral accounting without resolving the moral conflict. | Contested | Necessity mitigates blame but does not negate the harm caused; the conflict remains morally relevant even if action is unchanged. |

  ### Liberties

  The story takes significant liberties with the metaphysics of causation to make the philosophical problem legible. In reality, pollution-related mortality is probabilistic and diffuse; there is no literal "pool" of fractional deaths that tips into a whole death upon a specific household's action. The "Carry and tipping" rule is a fictional mechanism designed to force a Sorites paradox into a binary decision, whereas real-world debates struggle with the lack of such clear thresholds. Additionally, the story treats the "statistical death" as a discrete unit that can be assigned to a specific agent, whereas epidemiologists view such figures as population-level risks that cannot be traced to individual emitters. The rounding rule dramatizes the psychological comfort of negligible impact, but real regulatory frameworks rarely issue individual moral absolutions based on rounding thresholds.
