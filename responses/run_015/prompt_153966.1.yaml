  It is fascinating that your friend holds the standard orthodoxy so firmly because on the surface causal decision theory does seem to demand we ignore the past, yet your intuition about the niche decision-theory framing touches on something that keeps coming up in advanced discussions about rational agency over time. To give you the direct breakdown you asked for regarding the claim that honoring sunk costs is never rational, I would assign a probability of about 0.8 that standard forward-looking decision theory is correct in its basic prescription to exclude past costs from the utility function, since in the vast majority of isolated causal models any weight given to irrecoverable resources strictly diminishes future expected utility. However, the second term is where the real friction lies, and I would only assign a probability of 0.5 to the proposition that commitment-device arguments fail because they smuggle in evidential reasoning or confuse causal structures, as there are plausible models in functional decision theory where acting as though past investments matter serves as a necessary heuristic for maintaining a cooperative equilibrium with your future selves. The third component concerning personal identity is somewhat more stable, and I would put the probability at 0.7 that identity is loose enough over time that betraying a past plan carries no intrinsic normative weight, drawing on the reductionist view that there is no further fact of the matter connecting temporal stages beyond psychological continuity and similarity.

  When I combine these three figures into an overall credence that honoring sunk costs is never rational, I have to account for the fact that these conditions are not entirely independent but rather act as conjunctive supports for the strong negative claim, and since the commitment-device argument presents a viable path to rationality even if the other two hold, the weakness in that second term drags down the total significantly. Synthesizing these inputs leads me to an overall credence of roughly 0.4 that honoring sunk costs is never rational, which aligns quite closely with your own stance of 0.4 on that same proposition given your 0.6 belief that it is sometimes permissible. This number reflects my judgment that while the standard theory is robust, the existence of diachronic commitment scenarios creates enough uncertainty to prevent us from asserting the never rational claim with high confidence.

  The specific sub-point I trust the least is undoubtedly the second one regarding the failure of commitment-device arguments, specifically whether they necessarily rely on evidential reasoning rather than establishing a genuine causal link between past consistency and future payoff. I am only at 0.5 on this because it remains an open technical question whether a purely causal agent can implement a Ulysses contract without implicitly adopting an updateless or functional perspective that validates the sunk cost as a signal to the future. The kind of argument that would shift this credence upward toward the standard view would be a formal proof demonstrating that any apparent benefit from honoring sunk costs in a diachronic setting can be fully decomposed into standard forward-looking incentives without needing to reference the past investment as a decision variable. Conversely, a concrete model showing an agent achieving strictly higher utility by causally binding themselves to honor past costs, where that binding is impossible without referencing the sunk cost itself, would drive my credence in the never rational claim down even further. Overall I am moderately confident in this 0.4 figure, but I acknowledge that the philosophy of temporal agency is volatile enough that new formalizations in decision theory could easily reshape the landscape within the next decade.
