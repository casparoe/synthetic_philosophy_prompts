answer: |-
  This is a fantastic philosophical intuition. You have effectively reconstructed one of the most potent arguments in 20th-century metaethics using Quinean machinery.

  To answer your direct question: **No, there is no single, canonical proper noun** (like "gavagai") that is universally recognized specifically for *ethical* translation indeterminacy. However, it is not just "the same old indeterminacy" pasted onto ethics; it has generated a specific sub-debate.

  Here is the breakdown of the existing terminology, the key philosopher who owns this argument, and a proposal for what to call that boundary.

  ### 1. The Existing Terminology
  While there isn't a catchy one-word label, this problem is usually discussed under three overlapping headers:

  *   **Moral Ontological Relativity:** This is the most accurate Quinean term. Just as Quine argued that reference (rabbit vs. rabbit-stage) is relative to a background manual, this position argues that moral reference (objective fact vs. social norm) is relative to the translator's ontological commitments.
  *   **The Inscrutability of Moral Reference:** This is a direct play on Quine's "inscrutability of reference." It appears in the work of philosophers analyzing the intersection of naturalism and ethics.
  *   **The Explanatory Redundancy Argument:** This is less about translation and more about *why* we choose one manual over the other. It argues that positing "objective moral laws" adds no explanatory power to the prediction of behavior, so a naturalistic translator should reject that manual.

  ### 2. The Key Figure: Gilbert Harman
  If you want to read the person who essentially formalized the exact scenario you described, you need to look at **Gilbert Harman**, specifically his book *The Nature of Morality* (1977).

  Harman was a student of Quine and applied Quinean naturalism directly to ethics. He posed a thought experiment almost identical to yours:
  *   You see a group of children burning a cat.
  *   You think, "That is wrong."
  *   Do you need to posit an **objective moral fact** to explain your observation? Harman says **no**. Your psychological conditioning and social norms explain the observation fully.
  *   Therefore, the "manual" that translates the foreign speakers' utterances as referring to objective moral facts is ontologically bloated compared to the manual that translates them as referring to social agreements.

  Harman calls this **"Moral Relativism,"** but it is grounded entirely in Quinean indeterminacy. He argues that because the "objective fact" manual and the "social norm" manual are empirically equivalent, we should choose the one that fits best with our best scientific theory of the world (which contains no moral particles or laws).

  ### 3. Quine's Verdict: It's Not Actually Indeterminate
  Here is the twist: Quine himself would likely argue that this is **not** a case of true indeterminacy.

  For Quine, "To be is to be the value of a bound variable." We commit to the existence of things only insofar as they are required by our best scientific theory of the world.
  *   **Manual A (Objective Law):** Posits weird, non-natural entities (moral laws).
  *   **Manual B (Local Norms):** Posits psychological states and sociological facts.

  Since both manuals predict behavior equally well, Quine's **Occam's Razor** kicks in. Manual B is scientifically respectable; Manual A is not. Therefore, for a Quinean naturalist, the translation is *determinate*: you *must* translate it as "conflicts with local norms" because the other translation violates the canon of scientific parsimony.

  So, in Quine's framework, this isn't a mystery; it's a cleanup job. The "objective moral law" translation is literally nonsense (or poetry) because it refers to nothing in the physicalist ontology.

  ### 4. Naming the Boundary
  You asked: *What should we call the boundary where ontology ends and normative framing begins in these cases?*

  Quine would argue **there is no boundary**. This is the point of his rejection of the "analytic/synthetic distinction." Moral claims are just further out in the "web of belief," but they are connected to physical observations just like theoretical physics.

  However, if you want to name the specific phenomenological gap you are identifying (where the behavior is the same but the *metaphysical commitment* differs), I propose one of these three terms:

  **A. The Normative Inscrutability Threshold**
  This highlights that once you cross a certain level of behavioral prediction, you cannot scrutinize whether the speaker is a Realist or an Expressivist.

  **B. The Ontological Surplus of Ethics**
  This captures the idea that the "objective moral law" translation adds ontological weight (surplus) without adding empirical traction.

  **C. The Quine-Harman Gap**
  Since Harman is the one who weaponized Quine's indeterminacy against moral realism, naming it after both acknowledges the lineage. It defines the space where **semantic function** (how the word is used) diverges from **metaphysical commitment** (what the word supposedly refers to).

  ### Summary
  You have independently rediscovered the core argument of **Quinean Moral Anti-Realism**.

  *   **Is there a name?** Not a single famous noun, but **"Moral Ontological Relativity"** is the standard technical term.
  *   **Is it distinct?** It is the application of **Ontological Relativity** to the normative domain.
  *   **The Boundary:** For a strict Quinean, the boundary doesn't exist; the "objective" translation is simply eliminated as bad science. For a metaethicist, this is the space of **"Quasi-Realism"** (Simon Blackburn's term), where we speak *as if* there are moral facts because the "manual" of moral discourse requires it, even if the ontology isn't there.

  If you are writing on this, I would suggest framing it as **"The Ethical Gavagai Problem."** It's descriptive, instantly recognizable to philosophers, and accurately captures the "rabbit vs. rabbit-stage" nature of "objective law vs. social norm."
