      *   "Outside jurisdiction." (County B vs City A Authority).
      *   "Loop falls out of ordinary mechanics." (Vote count changes outcome).
      *   "Post-scenario requirements." (Principle verdicts, feature, tweak, wriggle).

      *Self-Correction on Scenario:* Make sure the "harm never happens" logic is crisp. If they vote, they block it. If blocked, no harm. If no harm, not affected. If not affected, no vote. If no vote, it passes. If passes, harm. Loop closed.

      *Refining the "Wriggle Out":* The standard response in literature (e.g., Goodin, Marchetti) is often shifting from "actually affected" to "possibly affected" or "interests at stake." I should articulate that clearly.

      *Refining the "Tweak":* If the harm is the same size whichever way (e.g., the *construction* harms them regardless of water flow), then the interest exists independently of the vote outcome. So AAI includes them stably.

      *Refining the "Feature":* It's the *outcome-dependence* of the affected status.

      *Drafting the response.*

