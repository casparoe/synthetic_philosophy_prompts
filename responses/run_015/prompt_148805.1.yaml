      *Analysis:*
      1.  **Principle Verdicts:** The "all subject to coercion" principle yields a stable demos excluding County B, since OCWA's laws do not bind them; the diversion passes, and the farmers bear the external cost. The "all affected interests" principle yields no stable demos: if farmers are excluded, the measure passes and harms them, demanding inclusion; if included, they vote it down, removing the harm, demanding exclusion.
