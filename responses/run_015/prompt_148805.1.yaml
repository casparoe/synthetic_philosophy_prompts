  1.  **Analyze the Request:**
      *   **Topic:** The boundary problem in democratic theory (who constitutes the demos).
      *   **Core Task:** Create a case study that breaks the "all affected interests" principle (AAI) via endogenous affectedness (a feedback loop where inclusion changes the outcome which changes the affectedness).
      *   **Constraint 1:** One paragraph for the scenario.
      *   **Constraint 2:** Realistic body (water authority, zoning board, etc.) making a realistic decision.
      *   **Constraint 3:** Affected group must be outside the jurisdiction (excluded by the "all subject to coercion" principle).
