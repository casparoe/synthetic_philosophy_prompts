answer: |-
  The Oak Creek Water Authority (OCWA), governing City A, votes on diverting surplus aquifer flow to fund a new reservoir needed for projected population growth. If approved, downstream irrigation levels in neighboring County B drop below viability, bankrupting its farmers; if rejected, City A faces rationing but County B's water remains stable. County B lies outside OCWA's legal jurisdiction, so its residents are not subject to OCWA's taxes or enforcement coercion. Under the "all affected interests" principle, County B farmers qualify for membership in the voting demos only if the diversion proceeds, yet their inclusion in the demos ensures the diversion fails, thereby negating the harm that justified their inclusion in the first place.

  **Principle Verdicts:** The "all subject to coercion" principle yields a stable demos excluding County B, since OCWA's laws do not bind them; the diversion passes, and the farmers bear the external cost. The "all affected interests" principle yields no stable demos: if farmers are excluded, the measure passes and harms them, demanding inclusion; if included, they vote it down, removing the harm, demanding exclusion.

  **Feature Doing the Work:** The loop is driven by the *outcome-dependence* of the affected status—the harm exists only if the vote fails to include the harmed party.

  **The Tweak:** If the harm were constant (e.g., the surveying and construction noise damages crops regardless of water flow), the farmers' interests are affected irrespective of the vote's outcome; the "all affected interests" principle then stably includes them in the demos, breaking the loop.

  **The Wriggle Out:** A proponent would shift the criterion from *actualized* harm to *potential* harm or risk, arguing that the farmers have a stake in the decision-making process itself because the proposal creates a threat, regardless of whether they successfully vote to neutralize it.
