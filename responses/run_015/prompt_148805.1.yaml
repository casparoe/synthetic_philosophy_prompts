      *   **Post-Scenario Requirements:**
          *   Explain what each principle delivers and why.
          *   Identify the specific feature doing the work.
          *   Explain what happens if the harm is constant regardless of the vote.
          *   Explain how an AAI proponent would try to escape the problem.
          *   Verdicts must follow from principles, not setup.

  2.  **Drafting the Scenario:**
      *   *Need:* A decision that causes harm to outsiders *only if* they don't vote to stop it. If they vote, they stop it, so no harm, so they shouldn't vote.
      *   *Body:* A city zoning board or water authority. Let's go with a **Regional Water Authority** (RWA) located in City A.
      *   *Decision:* Diverting water from a shared aquifer or river to build a new industrial park.
      *   *Outsiders:* Farmers in neighboring County B (outside RWA jurisdiction).
      *   *Mechanism:* If County B farmers aren't in the demos, RWA votes to divert -> water drops -> farmers harmed. If County B farmers *are* in the demos, they vote no -> diversion stopped -> water stable -> farmers not harmed.
      *   *Constraint Check:* Is it one paragraph? Yes. Is it realistic? Yes. Are they outside coercion jurisdiction? Yes (different county/state). Is it ordinary voting? Yes.
      *   *Drafting:* The Oak Creek Water Authority (OCWA), governing City A, votes on diverting surplus aquifer flow to fund a new reservoir needed for projected population growth. If approved, downstream irrigation levels in neighboring County B drop below viability, bankrupting its farmers; if rejected, City A faces rationing but County B's water remains stable. County B lies outside OCWA's legal jurisdiction, so its residents are not subject to OCWA's taxes or enforcement coercion. Under the "all affected interests" principle, County B farmers qualify for membership in the voting demos only if the diversion proceeds, yet their inclusion in the demos ensures the diversion fails, thereby negating the harm that justified their inclusion in the first place.

  3.  **Analyzing the Principles (Post-Scenario):**
      *   *All Subject to Coercion (ASC):* Delivers a stable verdict. County B is out. They aren't subject to OCWA laws/police. Decision proceeds based on City A voters. Harm happens to B.
      *   *All Affected Interests (AAI):* Delivers a paradox/oscillation.
          *   Step 1: Assume B is out. Decision passes. B is harmed. -> B should be in.
          *   Step 2: Assume B is in. Decision fails. B is not harmed. -> B should be out.
          *   Result: No stable demos.
      *   *Feature doing the work:* Endogeneity of harm (the harm is contingent on the outcome of the vote which determines the composition of the vote).
      *   *Tweak (Harm constant):* If the diversion harms B *even if stopped* (e.g., construction noise, or the mere proposal lowers property values), then AAI stabilizes. B is affected regardless of outcome, so B stays in the demos. The loop breaks.
      *   *AAI Wriggle Room:* Proponents might argue for "potential affectedness" or "risk of harm" rather than actualized harm. They would say B has an interest in the *risk* of the diversion, so they get a vote to assess the risk, even if they successfully mitigate it. Or they move to a "all possibly affected" standard.

  4.  **Refining and Polishing:**
      *   *Check Constraints:* One paragraph for the scenario? Yes. Realistic body? Yes. Outside jurisdiction? Yes. Ordinary mechanics? Yes.
      *   *Check Post-Scenario:* Verdicts from principles? Yes. Feature identified? Yes. Tweak explained? Yes. Wriggle out explained? Yes.
      *   *Tone:* Academic but clear.
      *   *Word Count:* Keep it tight.

