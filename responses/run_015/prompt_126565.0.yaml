sh away complicity. I also need you to tell me exactly what will predictably go wrong teh first time I run it, like people refusing to play teh forger or teh hidden option being too obvious, and how to adjust teh rules. Be honest about which feature of teh real political experience this can't reproduce — probably teh long-term psychological corrosion of actually holding power — and say how I should supply that in words afterwards. And please, write all of this back to me as one continuous letter with no headings, no bullet points, no bold text, and no tables, just like an email. Don't ask me for a bibliography or citations, I can't check those without leaving teh room.
