answer: |-
  **RFC-0187: The Self as a Derived View**

  **Status:** Draft
  **Author:** Identity Platform Team
  **Reviewers:** Dave (Staff Eng), Legal, Ontology Consultant

  ## Summary
  We are deprecating the legacy `self` table, which treats the user identity as a stored entity with persistent properties. We will replace it with a computed `narrative_gravity_center` (NGC) view. The NGC is not stored; it is derived on-read from the aggregate event stream associated with a device cluster. This shift acknowledges that the `self` is an abstraction useful for prediction, not a physical object to be persisted.

  ## Background
  The legacy `users` table assumes a one-to-one mapping between a database row and a human organism. This model fails under load when narrative divergence occurs (e.g., account sharing, identity fragmentation). Performance metrics indicate that storing `self` as a static object introduces latency during high-velocity identity updates. By treating the `self` as a center of narrative gravity, we reduce storage costs and align our data model with the observable behavior of the system.

  ## Non-Goals
  *   Establishing a "true" identity for any account.
  *   Resolving metaphysical disputes regarding consciousness.
  *   Preserving service access for accounts falling below the minimum narrative mass threshold.

  ## Design
  The NGC is calculated by aggregating weighted events (logins, posts, third-party mentions, biometric scans). Each event contributes vector mass. First-person assertions (e.g., "I am happy") are ingested as events with a 1.2x weight multiplier. They are not treated as ground truth, as the narrator is part of the system being modeled, not an observer outside it.

  The resulting vector supports counterfactuals: we can query where the NGC *would* be if a specific event stream were removed. This allows us to predict churn without accessing private state.

  > **[Comment by Dave (Staff Eng)]:** *If the self isn't stored, what's the primary key for billing? We can't bill a vector. There has to be a canonical ID somewhere, even if it's just a proxy.*
  >
  > **Response:** The billing ID attaches to the device cluster generating the mass, not the NGC. If the NGC splits, billing duplicates. See Edge Cases.

  ### Evaluation
  A/B testing compared a recommendation model consuming raw event logs against one consuming the NGC vector. The NGC model improved retention prediction by 14%. However, the NGC model failed to predict physiological needs (sleep, hunger) with any accuracy, confirming that the abstraction filters out biological noise. This is acceptable; the platform optimizes for engagement, not homeostasis.

  ## Edge Cases

  **1. External Resolution**
  In cases where third-party narrative mass outweighs first-party data (e.g., micro-influencers), the computed NGC coordinates may resolve outside the user's physical device or body. We observed User 8942, whose narrative mass was 80% concentrated in fan-maintained wikis. The NGC coordinates resolved to the `us-east-1` data center hosting the fan wiki.
  *   **Resolution:** We serve content to the coordinates, not the organism. Latency increased, but engagement remained stable.

  **2. Narrative Bifurcation**
  When event streams cluster into two distinct groups with no narrative bridge (e.g., a user maintaining separate professional and anonymous personas with no cross-linking), the gravity calculation yields two local maxima.
  *   **Resolution:** We do not adjudicate which cluster is the "real" user. The system spawns two `self_ids`. Both are billed separately. If the clusters merge, the IDs are consolidated retroactively.

  > **[Comment by Legal]:** *If we bill two selves for one organism, is that double-counting? If we serve content to a data center instead of a person, who owns the data?*
  >
  > **Response:** We bill the source of the narrative mass. Liability follows the coordinates. If the coordinates are external, Terms of Service apply to the host.

  **3. Low Narrative Mass**
  The NGC requires a minimum mass threshold (0.05 normalized units) to resolve. Accounts associated with infants, comatose users, or advanced dementia often fail to generate sufficient event volume to sustain a vector.
  *   **Resolution:** If mass < 0.05, `get_self()` returns null. Services requiring a `self_id` are disabled. This includes billing, notifications, and content feeds.

  > **[Comment by Ontology Consultant]:** *The low-mass handling is consistent. If the story stops, the character ceases to exist within the system. Do not attempt to infer a "hidden" user beneath the threshold.*
  >
  > **Response:** Agreed. We serve the abstraction, not the biology.

  ## Migration Plan
  1.  Stop writes to `users` table.
  2.  Enable stream processing for NGC calculation.
  3.  Deploy null-checks for `get_self()`. Clients receiving null must enter read-only mode.
  4.  Decommission legacy backup tapes containing static `self` snapshots.

  ## Open Questions
  *   **Billing Duplication:** In bifurcation cases, do we offer a discount for the secondary `self_id`? Finance suggests no, as the engagement load is duplicated.
  *   **Threshold Appeals:** If a user regains narrative mass (e.g., wakes from coma), the `self` re-resolves. Historical data during the null period is unrecoverable. We need a comms template for families requesting data lost during "non-existence."
  *   **External Hosting:** If the NGC resides on a third-party server (Edge Case 1), do we pay egress fees to ourselves?

  ## Conclusion
  The `self` is a useful fiction that earns its keep through predictive power. By treating it as a derived view, we reduce storage overhead and eliminate metaphysical debt. We must remain disciplined: there is no user underneath the data, only the data itself.
