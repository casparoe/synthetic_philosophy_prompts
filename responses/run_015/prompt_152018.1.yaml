answer: |-
  You have identified one of the most persistent and difficult knots in contemporary political philosophy. You are correct that the standard vocabulary ("expensive tastes," "conversion factors," "disability") captures the edges of the problem but misses the specific dynamic you are describing: **the historical endogeneity of the conversion deficit.**

  There is no single, canonical noun phrase (like "The Veil of Ignorance") that universally names this specific pattern. However, it is a recognized problem that sits at the intersection of three distinct literatures. Depending on which tradition you are reading, it is discussed under different headers, none of which quite capture the full mechanism you described.

  Here is the mapping of the existing literature, the precise gap you have found, and a proposed terminology to fill it.

  ### 1. The Existing Nearest Neighbors

  **A. The Capability Approach: "Conversion Factors"**
  *   **The Fit:** You correctly identified this as the closest fit. Amartya Sen distinguishes between *resources* (goods) and *functionings* (what you can do with them). The link between them is determined by "conversion factors" (personal, social, environmental).
  *   **The Gap:** As you noted, Sen often treats conversion factors as descriptive parameters (e.g., metabolism, climate, infrastructure). While Sen acknowledges that past functionings determine current capabilities (the "interdependence of functionings"), the literature often lacks a specific normative term for when those conversion factors are *themselves the unjust residue of prior distribution*. It treats the low conversion rate as a "fact" to be compensated, rather than a "wrong" to be traced.

  **B. Luck Egalitarianism: "Expensive Tastes" vs. "Brute Luck"**
  *   **The Fit:** This tradition (Dworkin, Cohen, Arneson) asks: Is the deficit something the person is responsible for? If yes (expensive tastes), no compensation. If no (brute luck/disability), compensation is owed.
  *   **The Gap:** Your case breaks their binary. It is not a "taste" (the person doesn't *want* to be less efficient), but it is not "brute luck" in the biological sense (it was caused by society). It is **socially constituted brute luck**. Luck Egalitarians struggle here because compensating for it requires judging the person's history and character, which risks paternalism. Elizabeth Anderson's critique ("What is the Point of Equality?") targets exactly this: she argues that focusing on compensating for internal deficits (even socially caused ones) stigmatizes the disadvantaged as "defective converters."

  **C. Sociology: "Cultural Capital" and "Habitus"**
  *   **The Fit:** Pierre Bourdieu has the best descriptive account of your phenomenon. He calls this **Habitus**: the embodied skills, dispositions, and expectations acquired from one's class background that determine how effectively one can navigate institutions. A voucher is worth less to someone without the *habitus* to use it.
  *   **The Gap:** Bourdieu describes the mechanism but offers less in the way of a *normative theory of justice* for how to compensate for it. He explains *why* the inequality reproduces itself, but not precisely *what justice demands* in response.

  ### 2. The Missing Name

  Since there is no single established term, the most precise way to name this in philosophical discourse is:

  **"Endogenous Conversion Disadvantage"**
  *(or "Historically Compounded Conversion Deficits")*

  **Definition:** A reduction in an agent's capability to convert resources into functionings, which is (a) unchosen by the agent, (b) causally produced by prior unjust social conditions, and (c) self-compounding (the deficit reduces the efficacy of current corrective measures).

  **Why this name?**
  *   **Endogenous:** The deficit is inside the person (skills, psyche, habits), not just external.
  *   **Conversion:** It operates on the *rate of exchange* between goods and life, not just the goods themselves.
  *   **Disadvantage:** It carries a normative claim that this is not a neutral difference (like preferring apples to oranges) but a harm.

  ### 3. Boundaries and Distinctions

  You asked where the boundary lies and what the implications are. Here is how "Endogenous Conversion Disadvantage" distinguishes itself from its neighbors:

  **A. Vs. Expensive Tastes (The Responsibility Boundary)**
  *   **Expensive Taste:** I *prefer* champagne to beer. I cultivated this. I am responsible. Justice does not owe me extra money to satisfy this preference.
  *   **Endogenous Conversion Disadvantage:** I *lack the skill/confidence/health* to make the voucher work. I did not cultivate this; it was inculcated by poverty/neglect. I am not responsible.
  *   **The Test:** Could the person have reasonably avoided this deficit given their circumstances? If the "habit" was a survival strategy necessitated by past poverty (e.g., short-term thinking), it is not a taste; it is a scar.

  **B. Vs. Brute Disability (The Etiology Boundary)**
  *   **Brute Disability:** Congenital blindness. Biological etiology.
  *   **Endogenous Conversion Disadvantage:** "Learned helplessness" or lack of navigational skills. Social etiology.
  *   **Why it matters:** If it is social etiology, it implies a duty of *rectification* for past injustice, not just *assistance* for current misfortune. It implies the state is partly *responsible* for the deficit, not just a benevolent helper.

  **C. The High Converter (The Reverse Case)**
  You asked: *Does the argument commit you to saying the same thing, in reverse, about someone who converts unusually well — that her surplus is not hers either?*

  **Yes.** If your theory of justice is based on neutralizing unchosen disadvantages (Luck Egalitarianism) or treating natural/social assets as common property (Rawls), then you are committed to this.
  *   **The Logic:** If Person A gets less out of a voucher due to unchosen social history, and Person B gets more out of a voucher due to unchosen social history (e.g., raised in a stimulating home, given confidence), Person B's "surplus" is morally arbitrary.
  *   **The Implication:** Person B's higher conversion rate is a "common asset." In Rawlsian terms, this justifies taxing the returns on Person B's efficiency to compensate Person A.
  *   **The Counter-Argument:** Libertarians or Sufficientarians would reject this. They would argue that once the *resources* are equal, what people *do* with them is theirs, even if their ability to do so was shaped by luck. But if you accept the premise that justice requires equalizing *flourishing* (capability) rather than *goods* (resources), you cannot let the high converter keep the surplus without violating the equality principle.

  ### 4. Why This Is Theoretically Dangerous

  You noted that compensating this fully "seems to require giving the worse-off person more than the better-off one, perhaps indefinitely."

  This is known in the literature as the **"Problem of Expensive Needs"** or the **"Bottomless Pit" objection.**
  If Person A's conversion rate is so damaged by history that they require 10x the resources to reach the same functioning as Person B, a strict capability egalitarianism might demand we pour infinite resources into Person A.
  *   **The Risk:** This can lead to "Leveling Down" (dragging Person B down) or neglecting other social goods.
  *   **The Solution:** Most theorists (including Sen) argue for a **Threshold View**. Justice requires bringing everyone up to a sufficient level of capability, not equalizing capability perfectly regardless of cost. However, this admits that some "Endogenous Conversion Disadvantage" will remain uncorrected.

  ### Summary

  You have isolated the dynamic mechanism by which **resource equality fails to produce capability equality.**

  *   **Established Notions:** It is the intersection of Sen's *Conversion Factors*, Bourdieu's *Habitus*, and Luck Egalitarian *Brute Luck*.
  *   **Proposed Name:** **Endogenous Conversion Disadvantage.**
  *   **The Commitment:** Yes, accepting this claim logically commits you to viewing the high converter's surplus as morally arbitrary and subject to redistribution, provided your theory of justice aims at equalizing outcomes/capabilities rather than just resources.

  This is the central tension in non-ideal theory: how to correct for the fact that the people we are trying to help have been shaped by the very injustices we are trying to fix.
