answer: |-
  Sarah: We're going in circles, Marcus. We agree the money isn't a prize for virtue. We agree it isn't a tool to maximize total happiness in the town. If we were utilitarians, we'd give the whole pot to the Reyeses and call it a day. They'll stretch a dollar further than anyone. But we're not doing that. So what are we doing?

  Marcus: We're trying to stop the money from evaporating. Look at the Haddads. You hand them thirty thousand dollars—the equal share—and what happens? A landlord sees the credit history gap and asks for six months' rent upfront. A contractor sees the language barrier and quotes double for the roof repair. The check arrives, but the security doesn't. If fairness is about what people can actually *do* with what they get, giving them the same thing as the Reyeses isn't fair. It's just identical.

  Sarah: And who decides what they can do? You? Me? If we start adjusting the shares based on how well we think someone can spend it, we're not treating them as neighbors anymore. We're treating them as projects. The Haddads know their situation better than we do. Maybe they need cash to bribe—sorry, to incentivize—a translator. Maybe they need to send money home to stabilize things before they settle here. If we give them forty thousand because we think they're disadvantaged, we're also saying we know how to fix them better than they do.

  Marcus: It's not about fixing them. It's about the ramp. Look at Della. She needs sixty thousand to make her house livable for her son. You're proposing we give her thirty. That buys half a ramp. It buys a bathroom she still can't use. What is the moral virtue in handing her a check that we know, objectively, fails to solve the problem it's intended for? You're prioritizing the cleanliness of our ledger over the reality of her life.

  Sarah: I'm prioritizing her dignity. If I give Della sixty thousand and Marguerite fifteen, I am standing up and declaring that Della's needs are real and Marguerite's are frivolous. I am saying the committee knows what a "real" need is. Marguerite says she needs fifty thousand to enjoy her summer like everyone else. She's candid about it. She's not hiding her tastes. Why is her desire for luxury less valid than Della's desire for access? Both are converting money into a life they want.

  Marcus: Because one is a barrier imposed by the world, and the other is a preference generated by the self. Della didn't choose the wheelchair. The Haddads didn't choose the prejudice they face here. Roy chose the orchard. Marguerite chose the expensive palate. If we compensate for every difference in how people convert money, we end up subsidizing choices. I can't justify giving Roy full share for a business venture he admitted was a gamble that failed.

  Sarah: But you're willing to subsidize the Haddads' lack of credit history? That's partly circumstance, partly history. Where do you draw the line? You're drawing it where it feels comfortable to you. That's the danger. Once we admit the committee gets to weigh the worth of a life plan, we become a charity, not a trust. The equal share says: here is your stake in the community. What you build with it is your business. If the Haddads get scammed, that's a tragedy, but it's their tragedy to manage, not ours to prevent by treating them like children.

  Marcus: It's not about preventing tragedy. It's about justice. If I give you a bicycle and I give a man with no legs a bicycle, I have treated us equally. But I haven't given us equal mobility. I'm proposing we acknowledge the legs. Here are my numbers. Della gets sixty. The Haddads get forty to buffer against the markup they'll face. The Reyeses get twenty—they're secure. Roy gets fifteen, enough to salvage some stock but not fund the whole gamble. Marguerite gets fifteen.

  Sarah: And there it is. You've cut Marguerite and Roy by half based on your judgment of their character. Roy took a risk that benefits the town—pollination, local fruit. Marguerite spends locally too. You're punishing them because their conversion rate is low by your metric. And for Della, you're giving her the full need, which means taking from others. You're saying her son's mobility is worth two of Roy's livelihoods. How do you justify that math without claiming you know the value of their lives?

  Marcus: I'm not valuing their lives. I'm valuing the barriers. I can measure the cost of a ramp. I can estimate the discrimination markup. I can't measure the pain of a boring summer or the pride of a failed orchard. I'm sticking to what is externally imposed versus internally chosen.

  Sarah: But you can't measure the discrimination markup either. You're guessing forty thousand. Is it thirty? Fifty? You're making it up. And that's the problem. My plan—thirty thousand to every household—is transparent. Anyone can check the math. Everyone gets the same. It's public. Your plan requires us to sit in this room and secretly decide how much suffering counts.

  Marcus: So you'd rather be publicly clear and practically useless? You'd rather hand Della a check that leaves her son stuck in the bedroom because it's easier to defend the process than the outcome?

  Sarah: I'd rather hand her a check that acknowledges she's a member of this trust with the same standing as Marguerite. If we start means-testing the windfall, we break the community. We become the arbiters of worthiness. I concede this: thirty thousand doesn't buy her the ramp. It leaves her short. I know that. It feels cruel. But the alternative is claiming we have the wisdom to price human needs against each other.

  Marcus: And I concede this: my numbers are estimates. I don't know the exact markup the Haddads will face. I don't know if Roy's orchard could turn around with full funding. I am guessing at the conversion rates. But I'd rather guess at justice than guarantee inequality.

  Sarah: But if your guess is wrong, who appeals? If I give everyone thirty, there's no appeal. It's done. If I give Roy fifteen and he thinks he deserved thirty, he has to come back and argue his suffering is real enough. That changes the relationship between neighbor and committee.

  Marcus: The relationship is already changed. We're holding a bag of money that means life to Della and vacation to Marguerite. Pretending it means the same thing to both is the fiction.

  Sarah: The fiction is that we can know the difference well enough to act on it. You want to equalize capability. I want to equalize resources. You say resources are empty without capability. I say capability is too invisible to legislate.

  Marcus: So we're stuck. You think my measure is too subjective to be public. I think your measure is too blind to be fair.

  Sarah: Exactly. I think the trouble is that a measure nobody can publicly check cannot serve as the measure of justice. If we can't show the town why Roy got less than Della without judging their souls, we shouldn't do it.

  Marcus: And I think the trouble is that we have the wrong measure of fairness. If the measure doesn't account for the wheelchair, the measure is broken, no matter how easy it is to read.

  Sarah: Then we aren't arguing about the money anymore.

  Marcus: No. We're arguing about whether justice needs to be seen to be done, or done to be real.

  Sarah: And neither of us can move.

  Marcus: Not without losing what we think fairness is.

  Sarah: Then we sit here until the bylaws force a vote.

  Marcus: Or until we find a third way that doesn't exist.

  Sarah: Pass the water.

  Marcus: Here.
