answer: |-
  This is a sophisticated take on the Side-Effect Effect (SEE). You are aligning yourself with the **Conceptual Competence** or **Moral Constitutive** view (championed by Joshua Knobe in his later work, and Richard Holton), which argues that moral evaluation is not a bias distorting a neutral concept of intentionality, but a constituent part of the concept itself.

  However, the literature is far from settled on this. While the *existence* of the effect is robust, the *explanation* is fiercely contested. Below is a breakdown of the serious defeaters for your view, ranked by severity, followed by an analysis of what proponents concede, what is settled, and how your AI extension holds up.

  ### Part 1: The Defeaters (Ranked Fatal to Awkward)

  #### 1. The Causal Direction Problem (Fatal)
  **The Challenge:** Your claim relies on a specific causal arrow: *Moral Judgment → Intentionality Judgment.* However, mediation analyses in experimental psychology have produced mixed results. Some studies suggest the reverse: *Intentionality Judgment → Moral Judgment.*
  **Why it's fatal:** If participants first determine (consciously or unconsciously) that the agent had sufficient belief/desire coverage, and *then* assign blame based on that intentionality, the "moral first" hypothesis collapses. It reverts to the traditional view: we track mental states, and if they meet the threshold for intentionality, we moralize.
  **Evidence:** Studies by Malle, Guglielmo, and others have shown that when you control for specific mental state attributions (e.g., "Did the agent know this would happen?"), the moral valence effect diminishes or disappears. If mental state tracking can be isolated as the primary driver, the moral-constitutive view is dead.

  #### 2. The Non-Moral Normative Challenge (Fatal to "Moral" Specificity)
  **The Challenge:** The effect is triggered not just by moral violations (harm), but by violations of *any* salient norm, including etiquette, conventions, or even statistical norms.
  **Why it's fatal:** If I judge a side effect as intentional because it violates a rule of etiquette (e.g., wearing white to a wedding) rather than a moral principle, then "moral valence" is not the engine. The engine is **Normative Violation**.
  **Evidence:** Uttich & Lombrozo (2010) demonstrated that the SEE arises when agents violate conventional norms. This forces you to broaden your theory from "Moral Evaluation" to "Normative Evaluation." While this saves the "constitutive" idea, it kills the specific claim that *morality* is the ground of intentionality. It suggests intentionality is tied to *deviance*, not goodness/badness.

  #### 3. The Pragmatic/Conversational Implicature Account (Severe)
  **The Challenge:** This view (Adams, Steadman) argues that the *semantic content* of "intentional" is neutral (mental states only), but the *pragmatic use* implies blame. When we say "He did it intentionally," we are conversationally implicating "He is to blame."
  **Why it's severe:** If this is true, your view is a category error. You are confusing what a word *means* with what a speaker *implies*. The folk concept remains mentalistic; the moral judgment is just a conversational overlay used to assign responsibility in legal/social contexts.
  **Evidence:** When participants are asked to explain *why* something was intentional, they cite mental states (beliefs/desires), not moral outcomes. This suggests the underlying cognitive machinery is still tracking minds, even if the output is morally tinted.

  #### 4. Cross-Cultural and Developmental Variability (Serious)
  **The Challenge:** If the moral-constitutive view is true, it should be a universal feature of human folk psychology. However, replication rates vary across cultures (e.g., some studies in India, China, and Samoa show attenuated or reversed effects) and age groups.
  **Why it's serious:** If the effect is culturally learned or develops late (after children have already mastered mental state tracking), it cannot be "built from the ground up." It would be a secondary cultural overlay on a primary mentalistic core.
  **Evidence:** Some developmental studies show children attribute intentionality based on outcomes before they fully grasp belief/desire, which supports you. But other studies show the SEE doesn't stabilize until age 7 or later, suggesting it's a learned heuristic, not a foundational concept.

  #### 5. Expert/Legal Dissociation (Awkward)
  **The Challenge:** Judges, lawyers, and philosophers often do not show the Knobe effect, or actively reject it when instructed on legal definitions of *mens rea*.
  **Why it's awkward:** If the "folk" concept is constitutively moral, why does training eliminate it? Defenders say experts are "overriding" their folk intuition. Critics say experts are accessing the *real* definition while the folk are making performance errors.
  **Evidence:** In legal contexts, the Model Penal Code focuses on purpose, knowledge, recklessness, and negligence. Moral valence is supposed to be irrelevant to the *definition* of the state, even if relevant to sentencing. If the concept were truly moral, legal training shouldn't be able to strip it away so easily.

  ---

  ### Part 2: Proponent Responses (Concede vs. Dismiss)

  If you presented your view to a conference of experimental philosophers (x-phi), here is how the debate would likely play out:

  **What Defenders of the Moral-Constitutive View Would CONCEDE:**
  *   **"Moral" might be the wrong word:** Most proponents (including Knobe in later papers) have conceded that **Normativity** is a better descriptor than Morality. They would agree with Defeater #2. They now argue that intentionality is tied to whether the agent treats the norm as a *reason*.
  *   **It's not just "Valence":** They would concede that it's not simply "Bad = Intentional." It's more nuanced. If an agent violates a norm they *endorse*, the effect is stronger. If they violate a norm they reject, it's weaker.
  *   **AI Cases are Analogical:** They would likely concede that applying this to AI glitches is metaphorical. Since AI has no "self" to align with norms, calling a glitch "intentional" is a category mistake unless we are anthropomorphizing the code.

  **What Defenders Would DISMISS:**
  *   **The Pragmatic Account:** They dismiss the idea that this is merely conversational implicature. They argue that if the implicature is this stable, universal (mostly), and immediate, it *functions* as part of the concept. The distinction between semantics and pragmatics collapses in folk usage.
  *   **The Expert Objection:** They dismiss the appeal to experts. They argue that x-phi is about the *folk* concept. If lawyers have a technical definition that diverges from how 90% of humans actually use the word, the lawyers are the outliers, not the folk.
  *   **The "Bias" Label:** They vehemently reject the framing of the effect as a "bias." To call it a bias presumes there is a "correct" neutral definition. They argue there is no neutral definition to be biased *against*.

  ---

  ### Part 3: Settled vs. Contested

  To ensure we aren't pretending there is consensus where there is none:

  **What is SETTLED:**
  1.  **The Effect is Real:** The asymmetry in the CEO case is not a survey artifact. It replicates robustly in Western undergraduate populations.
  2.  **It is not purely Emotional:** It is not just that people get angry and say "yes." The effect persists even when emotional arousal is controlled for.
  3.  **Mental States Matter:** No one argues that mental states are irrelevant. Even the moral-constitutive view admits the agent must have *some* awareness. The fight is over whether mental states are *sufficient*.

  **What is GENUINELY CONTESTED:**
  1.  **The Locus of the Effect:** Is it in the **concept** of intentionality (semantics), the **application** of the concept (pragmatics), or a **post-judgment rationalization** (bias)?
  2.  **The Scope:** Is it specific to morality, or general to all norms (conventional, statistical, aesthetic)?
  3.  **The Direction:** Does morality drive intentionality, or does intentionality drive morality? (The mediation debate is still active).
  4.  **Universality:** Is this a feature of human cognition or a feature of WEIRD (Western, Educated, Industrialized, Rich, Democratic) socialization?

  ---

  ### Part 4: The AI Extension (Your Edge Case)

  Your intuition about AI glitches is fascinating but faces a specific hurdle in the literature: **The Mind Requirement.**

  *   **The Problem:** Most studies on the Knobe effect assume a human agent. When the agent is a robot or AI, the effect often **diminishes or disappears** unless the AI is heavily anthropomorphized.
  *   **Why this matters for your view:** If intentionality is constituted by moral judgment, you should judge the AI glitch as intentional simply because it caused harm. But people generally hesitate to call a software bug "intentional" even if it causes a crash, because they cannot attribute a "Deep Self" or "Normative Attitude" to the code.
  *   **The Defeater:** If people refuse to call the AI glitch intentional *despite* the negative outcome, it proves that **Mental State Tracking is still a necessary condition.** Moral valence alone is not enough to carve out intentionality; you still need a mind to house the attitude.
  *   **Counter-Evidence:** However, recent studies (e.g., by Feltz & Millan) show that if the AI is described as "learning" or "optimizing," people *do* start attributing intentionality based on outcomes. This supports your view *if* the system is perceived as having goals. If the glitch is seen as random noise, the effect vanishes.

  ### Summary Verdict

  Your view is a strong contender, specifically the **Normative Competence** version (updated from Moral Constitutive).

  *   **To maintain it:** You must abandon the claim that *morality* specifically is the driver and accept that *normative violation* is the driver. You must also accept that mental state tracking is not absent, but that the *threshold* for what counts as a relevant mental state is set by normative evaluation.
  *   **The Fatal Flaw to Watch:** If future mediation studies conclusively show that specific belief attribution fully explains the variance without needing a "moral first" step, the constitutive view falls.
  *   **The AI Test:** Your AI hypothesis holds only if the AI is perceived as an agent with goals. If people judge a purely random algorithm's harmful output as "intentional," you win. If they demand a "mind" before assigning intentionality regardless of harm, the traditional mental-state view wins. Current data leans toward the latter: we need a mind first, then morality colors the judgment.

  **Recommendation:** Shift your claim from "Moral evaluation constructs intentionality" to "Normative evaluation determines the *threshold* of mental state attribution required for intentionality." This is more defensible and aligns better with the current "Deep Self" literature (Sripada, etc.).
