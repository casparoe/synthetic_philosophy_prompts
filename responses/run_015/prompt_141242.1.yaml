  1.  **The non-identity term: 0.15**
      *   *Justification:* The Non-Identity Problem severely undermines harm-based obligations; while impersonal principles (Principle Q) survive, they rarely generate specific *duties to act* rather than general *reasons to prefer* in procreative contexts.
  2.  **The person-affecting term: 0.10**
      *   *Justification:* Since neither child is harmed by not being selected, the "obligation" lacks a rights-bearer to whom the duty is owed, reducing it to an impersonal optimization which is weak ground for blame.
  3.  **The prediction term: 0.30**
      *   *Justification:* An $R^2$ of 0.10 implies 90% of the variance is noise; obligations typically require high-certainty prevention of harm, not low-certainty optimization of goods.
  4.  **The dilution term: 0.50**
      *   *Justification:* This is morally neutral regarding individual duty; even if gains are positional, the individual parent's obligation to their own child's welfare (if it existed) wouldn't necessarily dissolve due to collective action problems.
  5.  **The label-instability term: 0.25**
      *   *Justification:* The feedback loop (parents pushing the "high score" child) introduces a significant risk that the selection procedure itself negates the predicted wellbeing gain, undermining the expected utility calculation.
  6.  **The parental-discretion term: 0.20**
      *   *Justification:* Procreative liberty grants parents wide latitude to weigh their own stakes and values; this discretion downgrades optimization requirements from obligations to permissions.
  7.  **The verbal term: 0.60**
      *   *Justification:* A significant portion of the debate hinges on whether "obligation" means "decisive reason" (higher credence) or "enforceable/blameworthy duty" (lower credence).

  ### Sensitivity Analysis

  The single term my number is most sensitive to is **Term 1 (The non-identity term)**.

  If I were convinced that impersonal principles generate strict duties in non-identity cases (i.e., if I moved from a person-affecting view to a strict Total Utilitarianism where bringing about a better state of affairs is mandatory regardless of identity), my credence would jump from 0.20 to roughly 0.75. The entire weight of the obligation rests on whether you believe the universe demands the "better" child even if no specific child is wronged by the "worse" choice. Everything else (noise, labeling, discretion) is secondary mitigation; Term 1 is the structural load-bearing wall.

