prompt: |-
  I'm giving the opening remarks tomorrow for a two-day workshop we're calling 'Who Decides the Watershed?' The room will be half local residents from three towns that share a river, and half poli-sci and philosophy grad students who know the boundry-problem literature inside out. The practical question is wether people who live just outside the municipal line but drink the water should have a vote on the upstream zoning board. I want the remarks to do real work: they need to welcome everyone without pretending we've already solved who 'the people' are here, and they can't just cite standard democratic theory because the residents won't follow that. There's also this weird local quirk I want woven in -- an old irrigation pact from the 1920s that technically gives riparian rights to landowners but not to renters, so some of the people most affected by flooding have no formal standing at all. Can you write about five minutes of opening remarks that sit in that tension? Don't resolve it with a neat answer; let the problem shape what I can honestly promise the room.
reasoning: |-
  Here's a thinking process that leads to the suggested opening remarks:

  1.  **Analyze the Request:**
      *   **Event:** Two-day workshop titled "Who Decides the Watershed?"
      *   **Audience:** 50/50 split between local residents (three towns sharing a river) and grad students (poli-sci/philosophy, experts in boundary-problem literature).
      *   **Core Question:** Should people living just outside the municipal line (but drinking the water/upstream impact) have a vote on the upstream zoning board?
      *   **Key Constraint 1:** Welcome everyone *without* pretending "the people" is already defined.
      *   **Key Constraint 2:** Avoid standard democratic theory jargon (residents won't follow/connect with it).
      *   **Key Constraint 3:** Weave in a specific local quirk: A 1920s irrigation pact giving riparian rights to landowners but not renters (some flood-affected people have no standing).
      *   **Tone/Goal:** Sit in the tension. Don't resolve it with a neat answer. Let the problem shape the honest promise of the workshop.
      *   **Length:** About 5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Tension:**
      *   *The Academics:* Want to talk about democratic boundaries, constituencies, and normative theory.
      *   *The Residents:* Want to talk about floods, zoning, bills, and fairness.
      *   *The Conflict:* The definition of "who counts" is the very thing being debated, yet we need them to collaborate.
      *   *The 1920s Pact:* Adds a layer of historical injustice/complexity. It's not just about geography; it's about property status (owner vs. renter). This makes the "boundary" problem even messier.

  3.  **Drafting - Section by Section:**

      *   **Opening/Welcome:** Acknowledge the mix of people. Validate both forms of expertise (lived experience vs. book knowledge).
      *   **The Title:** Address "Who Decides the Watershed?" directly. Admit we don't know the answer.
      *   **The Core Problem (The Boundary):** Explain the zoning/water issue without getting too technical. Acknowledge the "outside voter" question.
      *   **The 1920s Pact (The Twist):** Introduce the irrigation pact. This is crucial for local credibility. Highlight the renter vs. owner distinction.
      *   **The Promise (The "Work"):** What are we actually doing here? Not solving it today, but mapping the friction.
      *   **Closing:** Invite them into the discomfort.

  4.  **Drafting - Tone Check:**
      *   *Avoid:* "Democratic theory suggests," "The all-affected principle," "Normative frameworks." (Too academic).
      *   *Use:* "Who gets a say," "Paper rights vs. real water," "The line on the map."
      *   *Balance:* Ensure the residents don't feel talked down to, and the students don't feel their expertise is dismissed, but rather contextualized.

  5.  **Iterative Writing (Mental or Scratchpad):**
      *   *Attempt 1 (Mental):* Welcome everyone. We have a problem. Some people live outside the town but drink the water. Should they vote? Also, there's an old rule from the 1920s that says renters don't count. We won't solve this today. Let's talk.
      *   *Critique 1:* Too dry. Doesn't capture the tension. Needs more poetry/grit.
      *   *Attempt 2 (Adding the 1920s detail):* Mention the pact early. It shows I know the local history. Make sure to address the grad students specifically so they don't take over.
      *   *Refining the Promise:* The prompt says "let the problem shape what I can honestly promise." So the promise isn't a solution, it's a better understanding of the mess.

  6.  **Finalizing the Script (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is roughly 650-750 words.
      *   *Specific Phrase Integration:* Need to mention the 1920s pact, the three towns, the zoning board, and the boundary problem without using the term "boundary problem" too academically.

  7.  **Polishing the Flow:**
      *   Start with the river itself. It's the common ground.
      *   Move to the lines we draw (maps, municipal boundaries).
      *   Introduce the people in the room (residents vs. students).
      *   Hit the 1920s pact hard—it's the emotional anchor.
      *   End on the purpose of the gathering.

  8.  **Review against constraints:**
