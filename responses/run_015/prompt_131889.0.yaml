      *   *No standard democratic theory?* Yes, keep language plain.
      *   *1920s pact included?* Yes.
      *   *Sit in the tension?* Yes, explicitly state we aren't fixing it neatly.

  9.  **Final Polish:** (Self-Correction during drafting) *Make sure I don't sound like I'm blaming the residents for the 1920s pact. It's a structural issue.* *Ensure the grad students feel their knowledge is useful but not the only tool.*

  **(Self-Correction Note):** I need to make sure the transition between the academic audience and the local audience feels bridged, not segregated. The river bridges them.

  10. **Final Word Count Check:** Aiming for ~700 words.

