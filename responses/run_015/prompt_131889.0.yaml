answer: |-
  Good morning. Welcome to "Who Decides the Watershed?"

  I want to start by acknowledging the geography of this room. On one side, we have people who know the river by its smell, its flood stages, and the way it changes the value of their property. On the other side, we have people who know the river by its legal definitions, its political boundaries, and the theories of how we organize ourselves around shared resources.

  Usually, when we host a workshop, we start by defining our terms. We say, "Here is the problem, and here is the community gathered to solve it." But if I did that today, I would be lying. Because the first question we have to ask is not *how* we decide, but *who* the "we" is in the first place.

  We are here because three towns share one river, but they do not share one map. We have a practical question on the table: If you live just outside the municipal line, but you drink the water that flows from it, do you get a vote on the upstream zoning board?

  To some, the answer seems obvious. To others, it sounds like an overreach. But I want to complicate that further, because this isn't just about where you live. It's about how you stand.

  There is a quirk in our local history that we cannot ignore. In the 1920s, an irrigation pact was signed that governs much of the water rights in this valley. It grants riparian rights to landowners. It does not grant them to renters.

  That means we have people in this valley—people whose basements flood, whose children play near the banks, whose wells run dry—who technically have no standing. They are affected by the water, but the law sees them as temporary guests on the land. If we spend two days talking about "the community" without acknowledging that some of our neighbors are invisible to the 1920s pact, we are just drawing prettier lines on a broken map.

  So, I am not going to stand here and promise you that by Sunday afternoon, we will have agreed on who belongs in the room. I am not going to promise that we will reconcile the political science theories of boundaries with the lived reality of a flooded driveway.

  Standard democratic theory tells us that the "demos"—the people—should be defined by those affected. But the law tells us the "demos" is defined by property lines and municipal charts. And history tells us the "demos" is defined by who owned land a hundred years ago.

  These three things do not match.

  To the grad students in the room: Your literature on boundary problems is vital. But today, that literature has to survive contact with the 1920s pact. It has to survive contact with the fact that some people in the three towns downstream can vote on upstream zoning, while some people upstream have no say in what gets dumped in the river that flows through their backyard.

  To the residents in the room: Your experience is the data we are working with. But I ask you to know that the frustration you feel when you say, "This isn't fair," is a philosophical problem, not just a bureaucratic one. You are living the questions these students study.

  So, what can I promise you?

  I can promise that we will not paper over the cracks. We are not here to draft a consensus statement that smooths out the jagged edges of this watershed. We are here to trace those edges. We are here to look at the tension between the voter who lives across the bridge and the renter who lives downstream, and admit that our current tools for decision-making might be too blunt for the water we're trying to manage.

  If we do the work right, we might leave here with fewer clear answers than we came with. But we should leave with a clearer understanding of why the questions are so hard.

  The river doesn't care where the municipal line is drawn. It doesn't care if you own the land or rent it. It flows. Our job for the next two days is to figure out how to build a decision-making process that flows with it, rather than trying to dam it up with lines that no longer hold.

  Thank you. Let's get to work.
