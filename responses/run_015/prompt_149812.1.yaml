answer: |-
  The canonical money-pump argument stands as the formidable gatekeeper of rational choice theory, asserting that any agent possessing cyclic preferences is necessarily irrational because they are vulnerable to exploitative sequences of trades that leave them strictly worse off. This argument, however, relies upon a hidden metaphysical premise: the assumption of synchronic preference unity. It treats the diachronic agent as a single, static locus of valuation stretched across time, implying that a preference reversal constitutes a logical contradiction within a single mind. I contend that this assumption is neither necessary nor defensible for a genuinely diachronic agent. Rationality should not be measured by the static consistency of a timeless observer, but by the structural integrity of a temporally extended planner. An agent may be fully rational even if her preferences cycle across discrete decision epochs, provided those epochs are organised by an explicit, ex-ante fixed transition charter that binds each stage to the next but prohibits any backward traversal to an identical choice situation.

  The vulnerability of the money pump arises only when an agent can be returned to the *identical* decision node with reversed preferences, allowing an exploiter to extract value indefinitely. This requires the decision situation to be timeless or recurrent in a way that ignores temporal context. In a robust diachronic model, however, time is sliced into discrete decision epochs. Within any single epoch, the requirement for intra-epoch coherence holds strictly; preferences must be acyclic and transitive to prevent immediate local exploitation. This preserves the core intuition that an agent should not contradict herself in the present moment. However, between epochs, the agent exercises inter-epoch sovereignty. Here, preferences may shift, even cyclically, as a function of planned temporal evolution rather than logical error.

  The crucial mechanism protecting this agent from exploitation is the binding constraint on backward traversal. The ex-ante fixed transition charter dictates that once an epoch concludes and a choice is enacted, the agent moves to a new temporal stage with a new context. Even if the preference ordering over outcomes cycles (e.g., preferring A to B in epoch 1, B to C in epoch 2, and C to A in epoch 3), the agent never faces the *identical* choice situation twice. The decision node at epoch 3 is structurally distinct from epoch 1 because the history of transactions and the temporal location are intrinsic properties of the choice situation. Consequently, the loop required for a money pump is structurally impossible by design. The agent pays for transitions knowing the schedule, viewing the cost not as a loss from inconsistency, but as the price of a valued temporal journey.

  Critics may object that this merely relabels irrationality as planning, arguing that any cyclic preference implies a willingness to pay to return to a previous state, which is inherently wasteful. This objection fails because it conflates returning to a previous *state* with returning to a previous *decision node*. A rational diachronic agent may value the experience of the cycle itself—the consumption of A, then B, then C—without wishing to restart the sequence infinitely. The charter prevents the infinite restart. By prohibiting backward traversal to an identical choice situation, the agent ensures that the cycle is a spiral of development rather than a closed loop of exploitation. The costs incurred are finite and anticipated, authorized by the ex-ante plan rather than forced by synchronic inconsistency.

  Therefore, the money-pump argument collapses when applied to agents who recognise their own temporal granularity. Rationality is not the absence of preference change, but the governance of that change through binding structural constraints. By distinguishing intra-epoch coherence from inter-epoch sovereignty, we liberate decision theory from the demand for synchronic unity. A diachronic agent is rational not because her preferences are static, but because her trajectory is bound by a charter that renders her unexploitable. The impossibility of unbounded exploitability ensures that cyclic preferences across epochs are not a defect of reason, but a feature of temporal agency.

