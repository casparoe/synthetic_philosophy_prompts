answer: |-
  Here are seven questions designed to press the speaker on the implications and coherence of her defense of the Repugnant Conclusion.

  **1. The Content of Marginal Lives**
  **Question:** You argue that a vast population with lives "barely worth living" is superior to a smaller population of excellent lives. What specifically makes those marginal lives worth living? Must they contain complex goods like friendship, autonomy, or achievement, or is net positive hedonic tone sufficient?
  **Expected Answer:** She will likely say that complex goods are not necessary; a life need only have a net positive balance of pleasure over pain (e.g., "muzak and potatoes") to count positively in the total sum.
  **Follow-up:** If complex goods are not required, are you committed to the view that a world of lobotomized beings kept in a state of mild chemical contentment is better than a world of fewer, deeply fulfilled individuals? If you say yes, you alienate our deepest values; if you say no, aren't you implicitly reintroducing a lexical threshold for "human" welfare that undermines your totalist calculus?

  **2. Suffering and Lexical Thresholds**
  **Question:** If nothing matters but total welfare and there are no lexical thresholds, does your view imply that enough marginally good lives can outweigh the intense, concentrated suffering of a few? What resources do you have for resisting the "Sadistic Conclusion," where we might be obligated to inflict torture on a minority if it allows a sufficiently large number of people to exist with lives barely worth living?
  **Expected Answer:** She will likely bite the bullet, arguing that while suffering is bad, it is commensurable with positive welfare, and sufficient quantity of the latter can mathematically outweigh the former.
  **Follow-up:** If positive welfare can outweigh intense suffering, can negative welfare outweigh basic rights? Does this mean we are justified in enslaving a small group, provided their lives remain net-positive and their labor generates enough surplus welfare to bring a massive number of marginal people into existence?

  **3. The Asymmetry of Creation**
  **Question:** You reject the asymmetry between our reluctance to create miserable people and our indifference to creating happy ones. If the omission of a possible happy life is a loss of total value, are you committed to treating the decision not to have a child as a moral wrong of the same kind as making someone suffer?
  **Expected Answer:** She will likely argue that while creating happy people is *good*, it is not strictly *obligatory* in the same way avoiding suffering is, due to agent-centered prerogatives or practical constraints.
  **Follow-up:** But if the value of the total population is the sole metric of betterness, on what grounds do you exempt individual reproductive choices from moral scrutiny? If failing to create a happy child is not a wrong, why does that child's potential welfare count decisively in the Repugnant Conclusion comparison? You seem to want the total view when it suits the conclusion, but a person-affecting view when it suits our intuitions.

  **4. Transitivity of Betterness**
  **Question:** In the spectrum argument leading from the excellent population to the repugnant one, do you preserve the transitivity of betterness? If Population A is better than B, and B better than C, must A be better than Z (the repugnant population)?
  **Expected Answer:** She will almost certainly say yes, as abandoning transitivity would render rational choice impossible and undermine the coherence of her utilitarian framework.
  **Follow-up:** If transitivity holds, you are not merely saying the Repugnant Conclusion is *not worse* than the excellent population, but that it is *better*. Can you sincerely stand before us and argue that we ought to *prefer* the world of muzak and potatoes as a moral *improvement* over the world of Mozart, rather than just accepting it as a tragic inevitability?

  **5. Practical Policy and the Far Future**
  **Question:** If the total welfare of a vast far-future population dominates our moral calculations, how much weight should this give to present-day policy? Should we prioritize maximizing the probability of long-term human existence over alleviating current suffering or improving the quality of life for those alive now?
  **Expected Answer:** She should admit that, on her view, existential risk reduction and population maximization should dwarf almost all other moral concerns, given the potential scale of the future.
  **Follow-up:** Does this justify authoritarian population policies or extreme economic austerity in the present to ensure resources for future billions? If you say we shouldn't sacrifice the present, aren't you admitting that the "total welfare" of the future is actually discounted by our current intuitions, contradicting your claim that those intuitions are mere prejudice?

  **6. The Epistemology of "Prejudice"**
  **Question:** You describe our horror at the Repugnant Conclusion as a prejudice to be outgrown. What is the source of this prejudice? Is it evolutionary, cultural, or rational? And if our intuitions are unreliable here, why should we trust them in other foundational areas of morality, such as the wrongness of murder or torture?
  **Expected Answer:** She will likely argue that our intuitions evolved for small-scale tribal interaction and fail when scaled to astronomical numbers, whereas the mathematical logic of total welfare is universal.
  **Follow-up:** But moral theory is supposed to systematize our considered judgments, not obliterate them. If your theory conflicts with every deep moral intuition we possess regarding quality of life, isn't the more parsimonious explanation that the theory is missing a variable (like rights, dignity, or distribution) rather than that all of humanity is suffering from a mass delusion?

  **7. Impersonality and Replacement**
  **Question:** Your view seems thoroughly impersonal; it matters that *someone* lives a good life, not *who* lives it. If we could replace a smaller population of excellent lives with a larger population of marginal lives, without harming the original group (perhaps they simply never exist), does your view require us to make that swap?
  **Expected Answer:** Yes, because the total value of the state of affairs is higher in the swap, and since the original group never exists, they are not harmed by being replaced.
  **Follow-up:** This implies we have no special obligation to ensure *our* children lead excellent lives, only that *some* children exist. Does this not dissolve the specific bonds of parental love and responsibility into a cold calculus of production? If you are unwilling to accept this, you must concede that the identity of the lives matters, which breaks the totalist aggregation you rely on.
