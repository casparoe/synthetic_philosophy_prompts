prompt: |-
  I lead a four-person long-term policy evaluation unit inside a national audit office. Every two or three weeks we are handed a government proposal with effects that run past the next election and often past the next census — radioactive waste disposal, pension reform, energy infrastructure, fertility and family policy, large-scale housing and transport corridors — and we have about a day and a half to produce a short impact section that goes into a public report to a parliamentary committee, plus a one-page sign-off note to a director who has to defend it in person. None of my team has philosophy training; one has a statistics background. We cannot build population models beyond rough ranges, and we cannot look anything up beyond what is in the proposal and its annexes.

  Our standard template asks three questions: who is made worse off, by how much, and can they be compensated or the cost offset? Increasingly we hit proposals where the honest answer to the first question is that the people who will bear the burden would not have existed at all if we had chosen differently — because the policy changes energy prices, labour markets, family timing, or where people live, and therefore changes who meets whom and which children are conceived. Under the alternative, other people would have lived instead. So the sentence our template wants us to write — that the policy harms future people — looks unavailable, and our drafts currently fudge this with vaguer wording that I do not think survives questioning.

  I want a written procedure my team can actually run in the time we have. I do not need the intellectual history or references; I need an instrument.

  Specifically, please give me:

  A screening step that decides, in the time available, whether a proposal affects which people come to exist. Distinguish at least three outcomes — the policy is identity-locked (the same people either way), identity-scrambled (different people, roughly the same number, roughly similar lives), and identity-generative (a different number of people, or lives of a different shape). Tell us what counts as a sufficient answer at this step, what to do when the evidence only supports a probability rather than a yes or no, and what to do when the screen comes out mixed: identity-locked for the next twenty years, scrambled after that. Give us a materiality rule for that mixed case and say plainly what adopting it costs us.

  A branching procedure. Where the policy is identity-locked, our existing person-affecting harm comparison is fine and I only want you to tighten it. Where it is identity-scrambled or identity-generative, the harm statement is unavailable, and the procedure must say what replaces it: what finding we are permitted to write, in what words, and what we must never write. In particular, address the temptation to write that these people would have been better off under the alternative — tell us whether that sentence is ever defensible and, if it is, under what description of the comparator.

  Rules for the cases that break the clean branch, which are the ones that actually reach my desk:

  Near-identity cases, where the policy changes a detail of origin — the month of a conception, which of two embryos, whether a birth is medically assisted — so that arguably the same person exists with a different life, arguably a different person exists. Handle the view that a person could not have originated from different gametes as one input among alternatives, and tell us what to write when we cannot settle it.

  The mixed population case, where the same proposal makes identifiable living people worse off and also scrambles the identity of later generations. Give us a rule for combining a person-affecting finding about the living with a non-person-affecting finding about the unborn into a single sentence that does not equivocate between frameworks.

  Cumulative sequences, where each decision in a programme is individually identity-locking but the programme as a whole scrambles identities. Tell us whether the procedure evaluates the decision, the programme, or the standing policy, and how to phrase the finding when the answer is the programme.

  The asymmetry case, where a proposal both adds people and changes the quality of life of people who would otherwise not have existed, and quality is somewhat lower but every life is well worth living. Tell us where the procedure stops and hands this to a named person, on the grounds that the disagreement is about values and not about facts.

  At each branch, separate three things explicitly: what the procedure settles, what it settles only after the office has committed itself to one contested moral frame, and what it cannot settle at all. Where a frame must be chosen — a person-affecting restriction, an impersonal total or average comparison, a threshold or sufficiency standard, a rights-based or practice-based ground — say who signs off, what the report must disclose about the choice having been made, and how the same proposal would come out under a different permitted frame. Include a stop rule that returns an explicit no-finding output rather than a fudge.

  Then run the whole procedure on three proposals, showing the branches taken and the actual wording you would let me put in the report:

  One, a choice between building a deep geological repository for long-lived radioactive waste now, at large immediate cost and with small expected releases far in the future, and continuing interim surface storage for another century, at lower immediate cost and with a larger expected burden borne by whoever is doing the monitoring then.

  Two, a rise in the state pension age, which changes labour supply, savings and the timing of children, so that within roughly two generations the population is different, while also making identifiable people now in their fifties and sixties worse off.

  Three, a proposal my team wants to approve and expects to approve: a publicly funded expansion of fertility treatment and neonatal care in a country with a low birth rate, which will lead to a somewhat larger future population whose lives are somewhat more strained — by congestion, fiscal load and competition for places — than they would have been under a smaller-population path, though comfortably worth living. Apply the procedure without softening it, and tell me what it returns even if the result is that our recommendation has to rest on a frame the office would repudiate, or that the only defensible finding is the no-finding output.

  Finally, be straight with me about what the procedure cannot do. I want to know which questions in our current template have to be deleted outright rather than revised, where the procedure will systematically misfire on the proposals we actually get, and which part of the difficulty is not representable in a checklist at all and has to be carried by the director's judgment in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** A 4-person policy evaluation unit in a national audit office.
      *   **Constraints:** 1.5 days per proposal, no external research (only proposal docs), limited modeling (rough ranges), no philosophy training (one stats background).
      *   **Problem:** The standard template asks "Who is made worse off?" This fails for "Non-Identity Problem" cases (policies that change *who* exists in the future).
      *   **Goal:** A written procedure (instrument) to handle these cases, including screening, branching, specific edge cases, and application to three specific examples.
      *   **Requirements:**
          *   Screening step (Identity-locked vs. Scrambled vs. Generative).
          *   Branching procedure (What to write/never write).
          *   Rules for edge cases (Near-identity, Mixed population, Cumulative sequences, Asymmetry).
          *   Explicit separation of what is settled, what requires a moral frame choice, and what is unsolvable.
          *   Sign-off/disclosure requirements for frame choices.
          *   Stop rule (No-finding output).
          *   Application to three specific cases (Nuclear waste, Pension age, Fertility expansion).
          *   Honest limitation statement (What to delete from the template, where it misfires, what requires human judgment).

  2.  **Deconstruct the Core Philosophical Problem (The Non-Identity Problem):**

      *   *Standard View:* Harm requires making someone worse off than they would otherwise be.
      *   *Non-Identity Issue:* If Policy A causes Person X to exist, and Policy B causes Person Y to exist, Person X cannot claim they are worse off under A, because under B they wouldn't exist at all (assuming life is worth living).
      *   *Audit Office Constraint:* They need to produce *findings*, not philosophical treatises. They need defensible language that won't collapse under parliamentary scrutiny.
      *   *Solution Strategy:* Shift from "Harm to specific individuals" to "Burden on future generations" or "Quality of Future State" without making false counterfactual claims about specific individuals.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   **Screening Step:** Needs to be fast. Look at time horizons and mechanisms.
          *   *Locked:* Short term, no demographic shift.
          *   *Scrambled:* Long term, demographic/timing shifts, similar numbers.
          *   *Generative:* Significant population size change.
          *   *Mixed:* Needs a materiality threshold (e.g., 20 years or 2 generations).
      *   **Branching:**
          *   *Locked:* Use standard "worse off" language.
          *   *Scrambled/Generative:* **CRITICAL:** Do *not* say "Future people are worse off than they would have been." Say "The future state is lower quality" or "Burdens are shifted to future generations."
          *   *Forbidden:* "These specific future people would have been better off."
      *   **Edge Cases:**
          *   *Near-Identity:* Treat as Scrambled if gametes/timing change. Don't get bogged down in metaphysics.
          *   *Mixed Population:* Split the sentence. "Identifiable persons now... Future generations..."
          *   *Cumulative:* Evaluate the Programme, not the single decision, if the decision is trivial alone but significant in aggregate.
          *   *Asymmetry:* This is the "Repugnant Conclusion" zone. If lives are worth living but worse than alternatives, this is a value judgment. Escalate to Director.
      *   **Frame Choice & Disclosure:**
          *   If moving away from Person-Affecting, must disclose: "This finding relies on an impersonal comparison of future states."
          *   Sign-off: Director must sign off on frame shifts.
          *   Stop Rule: If the frame choice is too controversial and the impact is low, issue "No Finding on Intergenerational Equity."

  4.  **Developing the Three Case Studies:**

      *   *Case 1 (Nuclear Waste):* Deep geological vs. Surface.
          *   *Identity:* Generative/Scrambled (100+ years).
          *   *Finding:* Shift burden. Do not say future people are harmed. Say "Risk profile is higher/lower."
      *   *Case 2 (Pension Age):* Mixed.
          *   *Identity:* Living people (Locked), Future people (Scrambled).
          *   *Finding:* Split statement. Living lose money; Future inherit different demographic structure.
      *   *Case 3 (Fertility/Neonatal):* Asymmetry/Generative.
          *   *Identity:* Generative (more people).
          *   *Quality:* Lives worth living, but strained.
          *   *Finding:* This triggers the Asymmetry rule. Cannot say they are "worse off." Must disclose value frame (Total vs. Average). Likely requires Director sign-off on the value judgment that "More people with strained lives" is acceptable.

  5.  **Refining the Limitations (The "Straight Talk"):**

      *   *Template Deletion:* The question "By how much are they worse off?" must be deleted for Scrambled/Generative cases. It's logically incoherent.
      *   *Misfire:* The procedure can't solve the moral disagreement, only manage the language.
      *   *Judgment:* The Director must own the moral frame. The unit provides the logic, the Director takes the heat.

  6.  **Review against Constraints:**

      *   *Time:* Is this doable in 1.5 days? Yes, the screening is checklist-based.
      *   *Skills:* No philosophy needed, just following the flowchart.
      *   *Tone:* Professional, audit-focused, blunt.
      *   *Specifics:* Did I answer the "Near-identity" and "Cumulative" specific prompts? Yes.

  7.  **Self-Correction/Polishing during drafting:**

      *   *Correction:* Initially, I might suggest using "Average Utility." *Correction:* No, that's too philosophical. Use "Quality of Future State" or "Burden Shifting." Keep it institutional.
      *   *Correction:* Make sure the "Stop Rule" is clear. Don't force a finding if it's logically impossible.
      *   *Emphasis:* Highlight the "Forbidden Language" clearly. That's the biggest risk for the Director.
      *   *Formatting:* Use bolding and boxes to make it look like a manual/procedure.

  8.  **Final Polish:** Check against the prompt's specific request for "what to delete from the template" and "what the director must carry." Ensure the distinction between *facts* (population size) and *frames* (is this bad?) is clear.

  *(Self-Correction on Case 3)*: The prompt asks to apply the procedure *without softening it*. If the procedure says this requires a value judgment the office might repudiate, I must state that. The office usually assumes "more people = good" or "stable population = good." If the policy creates strain, the "Impersonal Total" view might say it's good (more total happiness), but "Average" might say bad. I need to flag this tension.

  *(Self-Correction on Screening)*: Make the "20-year/2-generation" rule concrete for the Mixed Case.

  *(Final Check)*: Did I address the "Near-identity" gamete issue? Yes, treat as Scrambled to avoid metaphysical rabbit holes.

  Let's assemble the document.cw
answer: |-
  # INTERGENERATIONAL IMPACT ASSESSMENT PROCEDURE (IIAP)
  **Version:** 1.0 (Draft for Internal Use)  
  **Authority:** Policy Evaluation Unit  
  **Constraint:** 36-Hour Turnaround | Internal Data Only  

  ---

  ## 1. SCREENING STEP: IDENTITY STATUS DETERMINATION

  **Objective:** Classify the proposal's effect on future population identity within 2 hours.  
  **Input:** Proposal text, demographic annexes, implementation timeline.

  ### 1.1 The Three Classifications
  Assign the proposal to **one** of the following categories based on the *longest* time horizon of significant impact.

  | Classification | Criteria | Indicator in Proposal |
  | :--- | :--- | :--- |
  | **A. Identity-Locked** | The same specific individuals exist under both the proposal and the counterfactual. | Impacts conclude within **20 years**; no change to fertility rates, migration, or household formation timing. |
  | **B. Identity-Scrambled** | Different specific individuals will exist, but total population size and rough quality of life remain comparable. | Impacts extend **20+ years**; changes energy costs, housing location, or labor markets that shift *when* people conceive, but not *how many*. |
  | **C. Identity-Generative** | The proposal changes the *number* of people or creates lives of fundamentally different shape (e.g., severe disability vs. health). | Explicit change to birth rates, neonatal survival, or migration quotas resulting in >5% population variance by year 50. |

  ### 1.2 Handling Uncertainty and Mixed Cases
  *   **Probability:** If evidence suggests a >50% likelihood of Scrambling/Generative effects by year 30, classify as **Scrambled/Generative**. Do not wait for certainty.
  *   **Mixed Timeline (The 20-Year Rule):** If the proposal is Identity-Locked for living persons (0–20 years) but Scrambled for future persons (20+ years):
      *   **Classification:** **Mixed.**
      *   **Materiality Rule:** If >10% of the total monetized cost/benefit falls in the 20+ year window, you must apply the **Scrambled** branching rules to that portion.
      *   **Cost of Adoption:** You lose the ability to aggregate costs into a single "Net Present Value of Harm" figure. You must report two separate findings.

  ### 1.3 Output of Screening
  *   **Settled:** The classification (A, B, C, or Mixed).
  *   **Frame Choice:** None yet.
  *   **Unsettled:** Whether the Scrambled/Generative impact is *normatively significant* (see Section 4).

  ---

  ## 2. BRANCHING PROCEDURE: DRAFTING THE FINDING

  ### Branch A: Identity-Locked (Standard Person-Affecting)
  *   **Procedure:** Use existing template.
  *   **Tightening:** Ensure "worse off" is compared to the *specific* counterfactual baseline, not a general standard.
  *   **Permitted:** "Person Group X incurs a net loss of $Y compared to the baseline."
  *   **Forbidden:** None.

  ### Branch B: Identity-Scrambled (Different People, Similar Lives)
  *   **Problem:** You cannot say future people are "worse off" because they would not exist otherwise.
  *   **Procedure:** Shift from *Harm to Persons* to *Burden on Generations*.
  *   **Permitted Finding:** "The policy imposes a higher risk/cost burden on the generation living in [Year] than the alternative policy would have imposed on the generation living in [Year]."
  *   **Permitted Finding:** "The quality of the future state under this proposal is lower in respect of [Metric] than the alternative."
  *   **Forbidden:** "Future people are worse off than they would have been." (Logically false).
  *   **Forbidden:** "This policy harms future citizens." (Implies person-affecting harm).
  *   **Frame Choice:** **Impersonal Comparison.** You are comparing *States of Affairs*, not *People*.
  *   **Disclosure:** The report must state: *"This finding compares future societal states, not individual welfare losses."*

  ### Branch C: Identity-Generative (Different Numbers/Shape of Lives)
  *   **Problem:** Adding people with "worth living" lives who are nonetheless "worse off" than alternative people would have been.
  *   **Procedure:** **STOP.** Do not draft a harm finding.
  *   **Action:** Escalate to Director (see Section 4).
  *   **Reason:** This requires a value judgment on population size vs. quality (The Asymmetry).

  ---

  ## 3. EDGE CASE RULES

  ### 3.1 Near-Identity (Gametes, Timing, Embryos)
  *   **Scenario:** Policy changes conception date by months or selects different embryos (e.g., IVF funding).
  *   **Rule:** Treat as **Identity-Scrambled**.
  *   **Rationale:** Biological origin determines identity. Do not attempt to argue "the same child" exists.
  *   **Drafting:** "The policy alters the composition of the future population." Do not speculate on whether the "same" person exists with different traits.
  *   **Settled:** Classification as Scrambled.
  *   **Frame Choice:** None (Biological fact).

  ### 3.2 Mixed Population (Living + Unborn)
  *   **Scenario:** Pension reform hurts current 50-year-olds (Locked) and changes who is born in 40 years (Scrambled).
  *   **Rule:** **Split Sentence Structure.** Do not aggregate.
  *   **Drafting:** "The proposal reduces net wealth for identifiable persons currently aged 50–65. For persons born after [Year], the proposal establishes a future state with [Higher/Lower] fiscal burden compared to the alternative."
  *   **Forbidden:** "The policy harms current and future taxpayers equally." (Equivocates between frameworks).
  *   **Settled:** The separation of findings.
  *   **Frame Choice:** The Director must accept that "Harm" and "Burden" are not additive.

  ### 3.3 Cumulative Sequences (Programme vs. Decision)
  *   **Scenario:** A single housing approval is Identity-Locked, but the 50-year Housing Programme is Identity-Scrambled.
  *   **Rule:** Evaluate the **Programme**.
  *   **Rationale:** A single decision's identity impact is negligible, but the audit office's mandate covers long-term policy efficacy.
  *   **Drafting:** "While this specific decision does not alter population identity, it is a constituent part of the [Name] Programme which is Identity-Scrambled. This finding applies to the Programme trajectory."
  *   **Settled:** Scope of evaluation.
  *   **Frame Choice:** None.

  ### 3.4 The Asymmetry Case (More People, Strained Lives)
  *   **Scenario:** Policy creates more people. Their lives are worth living, but quality is lower than the smaller alternative population.
  *   **Rule:** **No-Finding Output.**
  *   **Action:** Return "No Finding on Intergenerational Equity."
  *   **Reason:** This is a value conflict (Total Utilitarianism vs. Average Utilitarianism vs. Person-Affecting). The Audit Office cannot resolve this as fact.
  *   **Escalation:** If a finding *must* be produced, it requires **Director Sign-Off** on the Moral Frame.
  *   **Disclosure:** "This finding relies on the assumption that [Increasing Total Welfare / Maintaining Average Welfare] is the primary metric."

  ---

  ## 4. FRAME CHOICE AND SIGN-OFF PROTOCOL

  When the procedure moves from Branch A to Branch B or C, a moral frame is being selected.

  | Frame | Definition | When Used | Sign-Off Required | Disclosure Text |
  | :--- | :--- | :--- | :--- | :--- |
  | **Person-Affecting** | Harm requires making specific people worse off. | Branch A Only. | Unit Lead | None (Standard). |
  | **Impersonal State** | Comparing quality of future worlds, regardless of who lives in them. | Branch B. | **Director** | "Assessment compares future societal states, not individual counterfactuals." |
  | **Total/Average** | Valuing population size vs. quality of life. | Branch C (If overridden). | **Director + Legal** | "Assessment prioritizes [Total/Average] welfare over identity-specific harm." |

  **The Stop Rule:**
  If the proposal falls under Branch C (Generative) AND the quality of life is "worth living" BUT lower than the alternative:
  1.  Draft the **No-Finding Output**.
  2.  If the Parliamentary Committee demands a finding, the Director must sign a **Frame Declaration** stating which moral standard was applied.
  3.  If the Director refuses to sign a Frame Declaration, the report states: *"The Unit cannot assess intergenerational equity for this proposal without adopting a contested moral framework."*

  ---

  ## 5. APPLICATION TO CURRENT PROPOSALS

  ### Case 1: Radioactive Waste (Deep Repository vs. Surface Storage)
  *   **Screening:** **Identity-Scrambled.** (Time horizon >100 years. Anyone living with the risk in 150 years would not exist under the alternative due to societal shifts).
  *   **Branch:** **Branch B (Impersonal State).**
  *   **Procedure:** Do not calculate harm to specific future individuals. Compare the risk profile of the two states.
  *   **Drafting for Report:**
      > "The Deep Repository option imposes a lower monitoring burden on the generation living in 2150 than the Surface Storage option. However, Surface Storage retains flexibility for future technologies. Neither option creates a person-affecting harm claim, as the specific individuals affected differ between options. The comparison is between future risk states."
  *   **Drafting for Director's Note:**
      > "Finding relies on Impersonal State frame. We are comparing risk profiles, not victim counts. Standard 'harm' language is logically unavailable."
  *   **Frame Choice:** Impersonal State (Director Sign-off).

  ### Case 2: Pension Age Rise (Current 50s + Future Generations)
  *   **Screening:** **Mixed.** (Current 50s are Identity-Locked; their grandchildren are Identity-Scrambled due to labor market/fertility timing shifts).
  *   **Branch:** **Branch A (Living) + Branch B (Unborn).**
  *   **Procedure:** Split the finding. Do not aggregate costs.
  *   **Drafting for Report:**
      > "For identifiable persons currently aged 50–65, the proposal reduces expected lifetime pension wealth by an average of $X. For persons born after 2050, the proposal establishes a fiscal state with higher solvency but reduced intergenerational transfer capacity compared to the baseline. These findings are not additive."
  *   **Drafting for Director's Note:**
      > "We have a hard loss for living voters. For the unborn, we have a structural shift, not a loss. Do not allow the Committee to sum these figures."
  *   **Frame Choice:** Mixed (Person-Affecting + Impersonal State).

  ### Case 3: Fertility/Neonatal Expansion (More People, Strained Lives)
  *   **Screening:** **Identity-Generative.** (Explicitly increases population size).
  *   **Branch:** **Branch C (Asymmetry).**
  *   **Procedure:** **Stop Rule Triggered.**
  *   **Analysis:** The new people have lives "comfortably worth living" but "somewhat more strained."
      *   *Person-Affecting View:* No harm (they wouldn't exist otherwise).
      *   *Total View:* Good (more total happiness).
      *   *Average View:* Bad (lower average quality of life due to congestion).
  *   **Drafting for Report (No-Finding Output):**
      > "The Unit cannot render a finding on whether this proposal harms or benefits future generations. The proposal creates different people than the alternative. While their quality of life is projected to be lower than the alternative population's, their lives remain net positive. Determining whether this constitutes a policy failure requires a moral judgment on population size versus quality of life, which lies outside the Unit's factual mandate."
  *   **Drafting for Director's Note:**
      > "If you require a recommendation, you must choose a frame. If we prioritize Average Welfare, this is negative. If we prioritize Total Welfare or Rights to Exist, this is positive. I cannot sign a factual finding of 'harm' here. If you defend this in Committee, you are defending a moral philosophy, not an audit finding."
  *   **Frame Choice:** **None.** (Unless Director overrides Stop Rule).

  ---

  ## 6. LIMITATIONS AND DIRECTOR'S BURDEN

  ### 6.1 Template Deletions
  The following questions in your standard template **must be deleted** for Branch B and C cases. They cannot be revised; they are logically incoherent in these contexts.
  1.  *"Who is made worse off?"* → Replace with *"Which future state carries higher burdens?"*
  2.  *"By how much are they compensated?"* → Replace with *"Does the future state meet sufficiency thresholds?"*
  3.  *"Can the cost be offset?"* → Delete. (You cannot offset non-existence).

  ### 6.2 Systematic Misfires
  The procedure will misfire in two predictable ways:
  1.  **The "Roughly Similar Lives" Trap:** In Branch B (Scrambled), we assume lives are roughly similar. If a policy creates a future generation that is Scrambled but *drastically* poorer (e.g., climate collapse), the distinction between "Harm to Person" and "Bad State" blurs. The procedure treats this as a Bad State. The Director must decide if "Bad State" is politically sufficient to block the policy without "Victims."
  2.  **The Time Horizon Cut-off:** The 20-year rule is arbitrary. A policy might lock identity for 25 years. The procedure forces a binary choice. The Director must absorb the error margin on the 20–30 year boundary.

  ### 6.3 The Director's Judgment (Non-Representable)
  The checklist cannot carry the following burden:
  *   **Legitimacy of the Frame:** When the Director signs off on the "Impersonal State" frame (Case 1 & 2), they are accepting that the Audit Office has the authority to judge "Future States" without "Victims." A Parliamentary Committee may challenge this authority. The procedure protects the *logic*, but the Director must defend the *mandate*.
  *   **The Asymmetry Decision:** In Case 3, if the Director overrides the Stop Rule to give a positive recommendation, they are implicitly endorsing the view that "Creating Strained Lives is acceptable if they are Worth Living." This is a philosophical stance. The procedure isolates this, but the Director must own the political consequence of that stance.

  ### 6.4 Final Instruction to Team
  If the Screening Step yields **Identity-Generative** and the lives are **Worth Living**:
  1.  Do not write "Harm."
  2.  Do not write "Benefit."
  3.  Write the **No-Finding Output**.
  4.  Send to Director.
  5.  If Director insists on a finding, ensure the **Disclosure Text** is in the first paragraph of the public report.

  **End of Procedure.**
