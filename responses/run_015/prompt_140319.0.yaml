answer: |-
  This is an excellent question. You have correctly identified that your lecturer is sliding from a useful heuristic (a slogan) to a strong metaphysical claim (determinism) without justifying the steps. Your friend is also right: the slogan conflates distinct relationships (causation, correlation, representation).

  In philosophy of biology and systems biology, this is a well-trodden debate. Below is a "menu" of the specific claims hidden inside the slogans "Blueprint," "Code," and "Program." I have arranged them from **True/Trivial** to **False/Misleading**, marking the consensus status of each.

  ### The Menu of Claims

  #### 1. The "Template" Claim (True / Consensus)
  *   **The Claim:** DNA serves as a physical template for its own replication and for the synthesis of RNA/proteins.
  *   **The Slogan:** "DNA is a Code."
  *   **Status:** **[CONSENSUS]**
  *   **Detail:** This is the mechanistic baseline. We know exactly how polymerase reads DNA to make RNA, and how ribosomes read RNA to make proteins (the Genetic Code).
  *   **Does it support the lecturer?** No. A template is a *part* of a machine, not the whole machine. Knowing the shape of a key doesn't tell you which door it opens or what is inside the room.

  #### 2. The "Component List" Claim (True / Consensus)
  *   **The Claim:** The genome contains the sequences required to build the molecular parts (proteins, functional RNAs) of the organism.
  *   **The Slogan:** "DNA is a Parts List."
  *   **Status:** **[CONSENSUS]**
  *   **Detail:** If you have the genome, you can (in principle) list the primary structure of every protein the organism *can* make.
  *   **Does it support the lecturer?** No. A list of bricks and beams is not a blueprint for a house. It lacks assembly instructions.

  #### 3. The "Constraint" Claim (Substantive / Consensus)
  *   **The Claim:** DNA places limits on the possible phenotypes an organism can develop.
  *   **The Slogan:** "DNA determines potential."
  *   **Status:** **[CONSENSUS]**
  *   **Detail:** A human genome will not produce a oak tree. DNA restricts the "state space" of development.
  *   **Does it support the lecturer?** Partially. It supports the idea that DNA is *relevant*, but not that it is *sufficient*.

  #### 4. The "Instructional" Claim (Substantive / Contested)
  *   **The Claim:** DNA contains active "instructions" or "commands" that tell the cell *when* and *where* to use the parts.
  *   **The Slogan:** "DNA is a Program."
  *   **Status:** **[CONTESTED]**
  *   **Detail:** This relies on the existence of Gene Regulatory Networks (GRNs). While we find promoter regions and switches, many biologists argue these are not "commands" in a computer sense, but rather binding sites that interact with the *existing* cellular environment (transcription factors already present in the egg).
  *   **Does it support the lecturer?** This is the first step toward his conclusion. If DNA is a "program," it implies an algorithm that executes automatically. However, a program requires hardware and an operating system (the cell/egg) to run.

  #### 5. The "Sufficiency" Claim (Overstated / Mostly False)
  *   **The Claim:** The genome sequence, plus a "standard" environment, is sufficient to reconstruct the organism.
  *   **The Slogan:** "DNA is the Blueprint."
  *   **Status:** **[CONTESTED / MOSTLY FALSE]**
  *   **Detail:** This ignores **maternal effects** (proteins/RNA already in the egg before the zygote genome activates), **epigenetics** (methylation patterns not fully encoded in sequence), and **self-organization** (physical forces that shape tissues independent of genetic instruction).
  *   **Does it support the lecturer?** **Yes.** This is the specific claim your lecturer is making. It is the only claim that justifies "sequence = everything needed." Most modern developmental biologists reject this strong sufficiency view.

  #### 6. The "Spatial Map" Claim (False / Consensus False)
  *   **The Claim:** The DNA sequence contains a spatial map of the adult organism (e.g., this gene corresponds to the left arm, that gene to the liver).
  *   **The Slogan:** "DNA is a Blueprint" (Architectural sense).
  *   **Status:** **[CONSENSUS FALSE]**
  *   **Detail:** This is the literal definition of a blueprint. Architecture works this way; biology does not. Biological form emerges from local interactions between cells, not from a global map stored in the nucleus.
  *   **Does it support the lecturer?** If he believes this, he is factually wrong about developmental biology.

  #### 7. The "Predictive Completeness" Claim (False / Consensus False)
  *   **The Claim:** Knowing the sequence allows you to *predict* the phenotype with high accuracy.
  *   **The Slogan:** "Genomics predicts traits."
  *   **Status:** **[CONSENSUS FALSE]**
  *   **Detail:** Due to stochasticity (randomness in molecular noise), environmental sensitivity, and complex epistasis (gene-gene interaction), we cannot currently predict complex traits from sequence alone, even in principle, without simulating the entire developmental environment.
  *   **Does it support the lecturer?** Yes, this is the practical implication of his claim. It is currently unsupported by evidence.

  ---

  ### Analysis: Where the Lecturer Goes Wrong

  Your lecturer is trying to move from **Claim 2 (Component List)** to **Claim 5 (Sufficiency)** without acknowledging the gap.

  *   **The Leap:** He assumes that because DNA is *necessary* (Claim 1 & 2) and *causal* (Claim 3), it must be *sufficient* (Claim 5).
  *   **The Reality:** Development is a **recursive process**. The DNA produces proteins, but those proteins interact with the cell structure, which was built by *previous* proteins (often from the mother's egg), which then feedback to regulate the DNA.
  *   **Your Friend's Point:** Your friend is describing **Developmental Systems Theory (DST)**. She is correct that DNA is a "resource" rather than a "master." The cell reads the DNA differently depending on the cell's current state (context-dependent read-out).

  **Which claim gets him to his conclusion?**
  He is relying on **Claim 5 (Sufficiency)** disguised as **Claim 1 (Template)**. He treats the "Code" (which is real) as if it implies a "Program" (which is metaphorical) that runs independently of the "Hardware" (the cell/egg/environment).

  ---

  ### The "Information" Debate: What is Settled?

  You asked about the status of "genetic information." Here is the current landscape:

  **1. The "Shannon Information" View (Consensus)**
  *   **Status:** **[CONSENSUS]**
  *   **View:** DNA carries information in the mathematical sense (Shannon entropy). It reduces uncertainty. If I know the sequence, I know more about the protein than if I didn't.
  *   **Verdict:** No one disputes this. It is a statistical measure.

  **2. The "Semantic Information" View (Contested)**
  *   **Status:** **[CONTESTED]**
  *   **View:** DNA carries *meaning* or *instructions* in a way analogous to human language (e.g., "grow a leg here").
  *   **The Debate:**
      *   **Proponents (e.g., John Maynard Smith):** It is useful to treat genes as carrying instructions because natural selection has shaped them to have a function.
      *   **Critics (e.g., Lenny Moss, Susan Oyama):** "Instruction" implies a sender and a receiver with shared conventions. Cells don't "interpret" DNA like we read a book; they react chemically. Calling it "information" hides the causal work done by the cell machinery.
  *   **Verdict:** Most working biologists use the language of information pragmatically (it's useful shorthand) but do not commit to it being *literally* true in a semantic sense.

  **3. The "Blueprint" Metaphor (Consensus Rejection)**
  *   **Status:** **[CONSENSUS REJECTION among specialists]**
  *   **View:** While popular in textbooks, specialists in Evo-Devo (Evolutionary Developmental Biology) and Systems Biology largely reject "Blueprint" because it implies pre-formationism (the idea that the organism is pre-formed in miniature).
  *   **Verdict:** Your lecturer is using outdated terminology that persists for pedagogical simplicity but fails under scrutiny.

  ---

  ### My Read (Flagged as Personal Analysis)

  *Note: The following is my synthesis of the field, not a direct quote of a consensus document.*

  Your lecturer is teaching a **Central Dogma** view of biology (DNA $\rightarrow$ RNA $\rightarrow$ Protein $\rightarrow$ Trait) which was dominant in the mid-20th century. It is excellent for teaching the *mechanisms* of transcription and translation. However, it is poor for teaching *development* and *complexity*.

  The slogan "DNA is the blueprint" is **pedagogically toxic** at the advanced level because it creates the exact confusion you are experiencing. It encourages **Genetic Determinism**.

  *   **Why he says it:** It simplifies the exam. "Sequence determines protein" is easier to grade than "Sequence interacts with epigenetic landscape to constrain phenotype."
  *   **Why it's wrong:** It ignores the **causal parity** of the environment. The egg cell is not an empty bag waiting for DNA instructions; it is a highly structured machine that *uses* the DNA. Without the egg's existing structure, the DNA does nothing.

  **Recommendation for your studies:**
  For the purpose of your exams, use the lecturer's language (DNA = Blueprint/Code) when answering questions about *molecular mechanisms* (transcription, translation). However, when answering questions about *development, evolution, or phenotype*, qualify your answers. Use phrases like:
  *   "DNA provides the necessary components..."
  *   "Gene expression is regulated by environmental context..."
  *   "Phenotype emerges from the interaction of genome and environment..."

  This shows you understand the molecular basics (pleasing the lecturer) while acknowledging the biological reality (which is scientifically accurate).

  ### Summary Table

  | Claim | Slogan | Consensus Status | Supports Lecturer's "Sequence = Everything"? |
  | :--- | :--- | :--- | :--- |
  | **Template** | Code | **True** | No |
  | **Parts List** | Code | **True** | No |
  | **Constraint** | Blueprint | **True** | No |
  | **Instruction** | Program | **Contested** | Weakly |
  | **Sufficiency** | Blueprint | **False** | **Yes (This is his error)** |
  | **Spatial Map** | Blueprint | **False** | Yes (But biologically wrong) |

  Your skepticism is well-founded. You are spotting the difference between **molecular biology** (where the slogan works okay) and **developmental biology** (where the slogan fails).
