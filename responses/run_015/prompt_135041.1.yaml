      *   *Target Domain:* Public Monuments/Street Names.
      *   *Mappings:*
          *   Family $\rightarrow$ The City/Nation/Community.
          *   Grandparents/Ancestors $\rightarrow$ Historical Figures (statue subjects/namesakes).
          *   Ugly Photo $\rightarrow$ Problematic aspects of the figure's legacy (racism, colonization, etc.).
          *   Album $\rightarrow$ Public Space/Historical Record.
          *   Tearing Pages/Renaming $\rightarrow$ Removing Statue/Changing Street Name.
          *   Flipping Through $\rightarrow$ Public Engagement/Memory.
          *   Keeping the Album $\rightarrow$ Maintaining the Status Quo.

  3.  **Analyze the Breaks (Disanalogies):**
      *   *Privacy vs. Publicity:* A photo album is private; a statue is public. Private memory allows nuance; public space implies endorsement.
      *   *Function:* An album records history; a statue often *celebrates* or *honors*.
      *   *Agency:* You choose your family history (biologically); citizens don't choose their civic history (it was imposed).
      *   *Harm:* An ugly photo hurts feelings; a statue of an oppressor can cause active psychological or social harm to marginalized groups.
