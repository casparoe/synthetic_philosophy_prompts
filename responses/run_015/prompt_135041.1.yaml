      *   **Topic:** The debate over removing statues and renaming streets.
      *   **Specific Analogy:** Keeping a statue/street name is like keeping a family photo album with "ugly pictures" (flawed ancestors). Removing/renaming is like tearing pages out or throwing away the cover (erasing history).
      *   **Task:**
