answer: |-
  It is commendable that you are pausing to scrutinize the claims of a popular science book before adopting them as your own, especially in a field as nuanced as cultural evolution. Your summary is remarkably sharp for a non-specialist, capturing the core intuition of the field while inadvertently highlighting exactly where the popular presentation often diverges from the academic consensus. To address your request, I will walk through the claims in the order you presented them, distinguishing between the robust theoretical foundations, the simplifications required for a general audience, and the substantive errors that might lead you astray.

  The opening claim that culture constitutes a second Darwinian process running alongside biology is the foundational premise of Dual Inheritance Theory, and serious defenders of this approach would accept this without hesitation. They agree that cultural traits vary, are transmitted between individuals, and differ in their success at being copied, which satisfies the basic requirements for evolution by selection. However, many researchers in this field would wince at the use of the word meme. While the term coined by Dawkins is recognizable, serious theorists often avoid it because it implies that ideas are discrete, particle-like units with high fidelity, whereas cultural traits are often fuzzy, reconstructed, and blended during transmission. This is a mistake about words rather than substance, but it matters because it shapes how you visualize the process. When you move to the claim that selection is indifferent to the interests of the vehicle, you are on solid ground. Defenders of the approach fully accept that cultural variants can spread even if they reduce the biological fitness or well-being of the host, as seen in your examples of cults or harmful habits. This is a substantive point that is widely accepted, though it is often nuanced by the observation that many transmission biases are aligned with human psychology, so there is often a correlation between what spreads and what people find satisfying, even if not what is objectively good for them.

  The section on the transmission floor is where the summary begins to mix robust theory with significant oversimplification. The concept that high-fidelity copying is required for cumulative cultural evolution is a serious and respected hypothesis, often associated with researchers like Joseph Henrich. They argue that below a certain threshold of copying accuracy, innovations cannot accumulate because they degrade faster than they can be improved, preventing the ratchet effect that moves technology from handaxes to microchips. However, the claim that crossing this floor means useful variants are kept and harmful ones discarded is where the argument becomes internally contradictory and substantively wrong. You noted earlier that selection is indifferent to host interests, yet here the summary suggests that once the floor is crossed, the system filters for usefulness. A serious defender would correct this by stating that crossing the fidelity threshold allows for accumulation and complexity, but it does not guarantee that the accumulated traits are beneficial to the humans carrying them. A complex bureaucracy or a sophisticated financial scam can be highly fit cultural variants above the transmission floor while being neutral or harmful to human welfare. Furthermore, crossing the fidelity threshold is not the only requirement for the ratchet to work; population size and social connectivity are also critical variables. A small group with high fidelity may still lose innovations due to random drift, so the author's implication that fidelity alone unlocks the Darwinian machinery is an exaggeration.

  Your instinct about the methodological claim is also well-founded. The suggestion that we can simply ask what a custom was selected for to find its function is a form of adaptationism that many evolutionary biologists and cultural evolutionists treat with caution. While it is a useful heuristic to look for the function of a trait, assuming that every common custom exists because it was selected for a specific benefit can lead to just-so stories. Many cultural traits are byproducts of other adaptations, results of historical drift, or exaptations that serve a function now but were selected for something else originally. A serious defender would argue that while asking about selection is a valid starting point, it is not a method that yields definitive answers without rigorous testing, and it certainly does not guarantee that every custom has a single, discoverable function. Your observation that customs often have several plausible functions or none at all is a valid critique of sloppy adaptationist reasoning, not a failure on your part to understand the theory.

  Regarding the claim that biologists have largely come round to this view because the equations are the same, you are right to be skeptical. This is a significant inflation of the actual consensus. While Dual Inheritance Theory does use population-genetics models to show that cultural transmission can be mathematically described similarly to genetic transmission, this has not led to a wholesale acceptance of the gene's-eye view of culture among biologists. Many biologists remain resistant to the idea that culture obeys Darwinian rules in the same way genes do, preferring to view culture as a distinct psychological or sociological phenomenon. The equations may share structural similarities, but the mechanisms of inheritance, mutation, and selection differ enough that many experts consider the analogy limited rather than definitive. This claim is more about rhetoric than substance, designed to lend authority to the book by invoking a consensus that does not fully exist.

  Finally, we must look at the practical conclusion regarding misinformation. The argument that dealing with misinformation is solely a matter of lowering the copying rate and that arguing about content is pointless does not fully follow from the corrected parts of the theory. While it is true that selection is blind to truth, cultural evolution theory also recognizes content biases, meaning humans are more likely to adopt ideas that resonate with their existing knowledge, appear credible, or solve immediate problems. If you argue about content effectively, you are altering the selection pressures by changing the perceived credibility or utility of the information, thereby changing its fitness. Therefore, arguing about content is not pointless; it is a way of manipulating the selection environment. The conclusion that only lowering the copying rate matters relies on the flawed assumption that content never influences transmission, which contradicts the nuanced view of biased transmission that serious defenders uphold. If you discard the idea that fidelity is the only lever and accept that human psychology mediates what gets copied, you can see that both limiting spread and improving content are valid strategies.

  In sum, your summary captures the exciting core of cultural evolution but inherits some of the overconfident simplifications common in popular writing. The Darwinian framework is a powerful lens, but it is not a magic key that unlocks the function of every custom, nor does high fidelity guarantee progress toward human welfare. The consensus among biologists is not as solid as the book implies, and the practical advice on misinformation ignores the role of content bias. You can trust the broad strokes about cumulative culture and maladaptive spread, but you should treat the methodological prescriptions and claims of universal agreement with caution. By holding these distinctions in mind, you can discuss the ideas with your friends without repeating the errors that might undermine your credibility.
