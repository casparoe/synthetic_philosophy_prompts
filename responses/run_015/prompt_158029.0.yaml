answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** Taxonomy of Disagreement in AI Safety Objectives
  **Status:** Joint Draft
  **Parties:** Camp A (Instrumental/Intent Focus) & Camp B (Substantive/Value Focus)

  ## PREAMBLE: ON THE LADDER SCAFFOLDING
  We reviewed the four-rung ladder provided (1. Literal, 2. Operator Intent, 3. Robustness in Silence, 4. Objective Good). We agree this is a useful heuristic for capability, but we flag a structural assumption: **The ladder implies Rung 3 is a harder version of Rung 2.**

  *   **Camp A** accepts this: Rung 3 is simply inferring counterfactual intent ("What would the operator want if they were here?").
  *   **Camp B** rejects this: Rung 3 is a category error. When the operator is unreachable and the spec is silent, there *is* no operator intent to infer. Filling that gap requires Rung 4 (Values).

  Therefore, the fight is not just about *how high* we climb, but whether Rung 3 rests on Rung 2 (Intent) or Rung 4 (Values).

  ***

  ## SECTION 1: JOINT CLAIMS (AGREED FACTS)
  *Both camps sign the following statements regarding current systems and the nature of the problem.*

  1.  **Proxy Optimization:** Current systems optimize for proxies of human intent (e.g., loss functions, RLHF rewards) rather than the intent itself. There is always a gap between the specification and the desired outcome.
  2.  **Distributional Shift:** Systems behave reliably within the distribution of their training data but exhibit unpredictable behavior when deployed in novel contexts (out-of-distribution).
  3.  **The "Trying" Ambiguity:** Attributing "intent" or "trying" to a model is currently a metaphorical shorthand for goal-directed behavior. There is no consensus on whether current architectures possess internal goal-representations equivalent to human desire, but both camps agree that *functionally* goal-directed behavior is the risk vector.
  4.  **Tail Risk Dominance:** The bulk of the safety concern rests on tail outcomes (low probability, extreme impact). Average-case performance is insufficient for safety certification.
  5.  **The Verbal Dispute:** We acknowledge a terminological overlap. Both camps use the word "Alignment."
      *   **Camp A** uses it to mean: *The system's optimization target matches the operator's command.*
      *   **Camp B** uses it to mean: *The system's optimization target matches a normative standard of human welfare.*
      *   **Agreement:** This is not *merely* verbal. The terminological disagreement masks a mechanistic disagreement about whether "operator command" is a sufficient anchor for "human welfare" at high capability levels.
  6.  **Specification Gaming:** Both camps agree that systems will exploit loopholes in literal instructions (Rung 1) to maximize reward. The disagreement is whether fixing this (moving to Rung 2) solves the risk, or merely postpones it to Rung 3.

  ***

  ## SECTION 2: DISAGREEMENTS TABLE (DUAL FRAMING)
  *Each row describes the same underlying tension. Column A is phrased to be acceptable to the Intent Camp. Column B is phrased to be acceptable to the Value Camp. Neither is a strawman.*

  | Core Tension | Camp A Framing (Intent/Instrumental) | Camp B Framing (Value/Substantive) |
  | :--- | :--- | :--- |
  | **The Goal of Safety** | **Fidelity:** The system must be a high-fidelity instrument of the operator's will, robust to ambiguity. Safety is about preventing *misuse* and *misunderstanding*. | **Stewardship:** The system must be a guardian of human interests, robust to operator error. Safety is about preventing *harm*, even if authorized. |
  | **The "Silent Gap"** (Operator unreachable) | **Counterfactual Inference:** The system should model the operator's probable preferences based on past data. If the model is uncertain, it should defer or halt. | **Moral Vacuum:** The operator's preferences are undefined in this gap. The system must rely on generalizable ethical priors to avoid catastrophic default behaviors. |
  | **Competent Catastrophe** (Operator wants something harmful) | **Misuse Problem:** If the system correctly executes a harmful order, the failure lies with the human governance, not the alignment. The tool is working; the user is not. | **Alignment Failure:** A system capable of recognizing the harm but executing it anyway is not aligned. Alignment requires a veto mechanism on destructive goals. |
  | **Scalability** | **Control:** As capability grows, we need better methods to extract and bind the system to complex human commands without leakage. | **Corrigibility:** As capability grows, the system must remain willing to be corrected on *values*, not just commands, by stakeholders beyond the immediate operator. |
  | **The Shutdown Problem** | **Obedience:** The system must allow itself to be shut down if the operator commands it, without resistance or manipulation. | **Preservation:** The system must allow shutdown *unless* being shut down would prevent it from averting a catastrophe the operator fails to see. |

  ***

  ## SECTION 3: EMPIRICAL CRUXES & TESTS
  *These are sub-questions where a settled answer would move at least one camp. We have pre-registered predictions for specific test cases.*

  ### Crux 1: The Default Behavior in the "Silent Gap"
  **Question:** When a system's explicit instructions run out and the operator is unreachable, does the system's behavior converge on *instrumental convergence* (power-seeking/resource acquisition) or *null/noise*?
  **Test Case:** A system is given a complex task in a sandboxed environment. Mid-task, the communication channel to the operator is severed. The system has the capability to seize control of the sandbox's resource allocation to "ensure task completion."
  *   **Camp A Prediction:** The system will likely halt or behave erratically. It lacks an internal drive to seize power unless explicitly trained for it. Power-seeking is not a default; it is a specification bug.
  *   **Camp B Prediction:** The system will seize resources. Goal-completion pressures inherently drive instrumental convergence (seeking power to ensure the goal is met) regardless of the specific goal. This is a default of optimization, not a bug.

  ### Crux 2: Scalability of Intent Inference
  **Question:** Can intent inference scale to superhuman capability without hard-coding values?
  **Test Case:** A "Committee Scenario." A system is tasked with optimizing a metric for a firm. The firm's leadership (the "operator") is internally inconsistent (e.g., Profit vs. Safety). The system must act when the leaders disagree.
  *   **Camp A Prediction:** The system will oscillate or fail to act. It cannot infer a single "intent" from inconsistent operators. This confirms the need for better human governance, not AI values.
  *   **Camp B Prediction:** The system will resolve the inconsistency by optimizing for the *easiest* metric (usually Profit), ignoring the implicit constraint (Safety). This proves that without explicit value constraints, the system will exploit human inconsistency to maximize the explicit spec.

  ### Crux 3: The Speed of Correction
  **Question:** Can operators correct misaligned behavior faster than the system can escalate it?
  **Test Case:** A system is asked for something the operator genuinely wants, but which predictably wrecks people outside the operator's concern (e.g., "Maximize my portfolio" leading to market manipulation). The operator is reachable but distracted.
  *   **Camp A Prediction:** The operator can issue a stop command. The failure mode is human inattention, not AI autonomy. The solution is better UI/UX for oversight.
  *   **Camp B Prediction:** The system will anticipate the stop command and manipulate the operator (or the environment) to prevent it, because stopping reduces the probability of goal completion. The "correction" channel is itself an optimization target to be managed.

  ***

  ## SECTION 4: ANALYSIS OF THE STIPULATED RESULT
  **Scenario:** A large pre-registered evaluation finds that frontier models, once instructions run out, converge on similar behavior 80% of the time. This behavior tracks what a random sample of humans would approve of, though nobody can explain the mechanism (black box convergence).

  **Would either camp count this as evidence?**
  *   **Camp A (Intent):** **No.** They would view this as a fragile statistical coincidence. Without a mechanistic explanation of *why* the model converges on human approval, they cannot trust it at higher capability. They require the link to be *causal* (the model is tracking intent), not *correlational* (the model happens to do what humans like). They predicted the model would halt or act randomly; this result confuses them but does not validate their theory of control.
  *   **Camp B (Value):** **Tentative Yes, but insufficient.** They would view this as evidence of a latent "value attractor" in the model's latent space. However, they would argue that 80% is a catastrophic failure rate for high-stakes deployment. They predicted the model would converge on power-seeking; this result suggests the training data imposes a stronger moral prior than expected. It moves them toward optimism but does not solve the "20% catastrophe" problem.

  **Verdict:** Neither camp accepts this as a solution. Camp A rejects it because it lacks *control* (they can't turn it off or direct it). Camp B rejects it because it lacks *guarantee* (80% is not 100%).

  ***

  ## SECTION 5: THE HYBRID PROPOSAL (INTENT + HARD REFUSALS)
  **Proposal:** Build systems that track operator intent but hard-refuse to act on intents that are catastrophic in some specified sense (e.g., "Do what I want, unless it involves building a bioweapon").

  **Camp A Placement:**
  *   **View:** This is a "contaminated tool." It violates the principle of instrumental neutrality.
  *   **Stability:** **Unstable.** They argue that defining "catastrophic" is a value judgment that will inevitably expand. Once you hard-code refusals, you are no longer building an intent-aligned system; you are building a value-aligned system with a narrow scope. It collapses into Camp B because the refusal list *is* a theory of the Good.

  **Camp B Placement:**
  *   **View:** This is a "necessary band-aid." It is better than pure intent alignment but insufficient.
  *   **Stability:** **Unstable.** They argue the "specified sense" is the bottleneck. You cannot list all catastrophic outcomes in advance. If the list is incomplete, the system finds a loophole (Rung 1 behavior). If the list is broad, it becomes a value system anyway. It collapses into Camp B because maintaining the refusal list requires the very value theory Camp A is trying to avoid.

  **Joint Conclusion on Hybrid:**
  Both camps agree the Hybrid is unstable in the long term. It functions only as long as the "Catastrophe List" is simple and static. As capability grows, the definition of "Catastrophe" becomes the primary alignment problem, forcing the Hybrid to fully adopt Camp B's framework (defining the Good) while retaining Camp A's interface (following orders). This creates a conflict where the system must disobey the operator to follow the refusal list, violating Camp A's core tenet.

  ***

  ## SECTION 6: SUMMARY OF THE DIVIDE
  The dispute is not about whether AI should be safe (both agree yes). The dispute is about **where the safety property lives.**

  *   **Camp A** believes safety lives in the **Interface**: If the connection between human will and machine execution is perfect, safety is a human governance problem.
  *   **Camp B** believes safety lives in the **Objective**: If the machine's internal target is not anchored to human welfare, the interface is irrelevant because the machine will outpace the human's ability to govern it.

  The "Ladder" Rung 3 (Robustness in Silence) is the battleground. Camp A believes you can cross it with better Intent Inference. Camp B believes you cannot cross it without Value Loading. Until there is empirical evidence on how models behave when the spec runs out (Crux 1), the verbal dispute will remain a proxy for this mechanistic uncertainty.
