      *   *Concept:* Agent wants accurate beliefs about goals. Button provides calibration.
      *   *Analysis:* This relies on the agent valuing *truth* over *satisfaction*. An expected utility maximizer cares about $E[U]$, not accurate $P(U)$. If I believe $U=100$ and it's actually $U=0$, but I never find out, I'm happy.
      *   *The Catch:* To value accurate self-knowledge, you need a *meta-utility* function that values accuracy. Where does that come from? If it's hardcoded, we're back to structural fragility (why doesn't it modify the meta-utility?).
