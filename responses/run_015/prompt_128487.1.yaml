      *   *Refining the "Evidence" argument:* The Hadfield-Menell model assumes the human is rational and acting in the agent's interest. If the agent learns the human is *mistaken*, it will ignore the button. This is the "Off-Switch Game" collapse.
      *   *Refining the "Self-Knowledge" argument:* This touches on *wireheading*. An agent that values accurate beliefs about utility is resistant to wireheading, but only if that value is protected.

