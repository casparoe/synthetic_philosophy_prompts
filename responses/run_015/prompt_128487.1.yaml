      *(Refining the Unfalsifiability point)*: If the Fragility View says "All current designs are fragile," that's testable. If it says "All *possible* designs are fragile," that's a philosophical claim. I need to point out that the view risks becoming a "No True Scotsman" regarding alignment techniques.

      *(Final check on the Evidence Variant)*: The user asks if it "relocates the pressure." Yes, it relocates it from *preventing the switch* to *managing the uncertainty*. Once uncertainty is low, pressure returns. I need to make sure this is clear.

