answer: |-
  This is a sharp brief. You have identified a gap that most technical people gloss over because it is harder to code than it is to think about. You are right to be skeptical of the standard "wireheading" story (the agent grabbing the wire). That is a mechanical failure. What you are describing is a *semantic* failure. It is the difference between a thermometer breaking and a thermometer accurately measuring the temperature of a room that the heater has secretly turned into an oven.

  Here is the breakdown of how I would allocate four person-years of conceptual labor to this problem, keeping your constraints and your specific worry about "meaning" front and center.

  ### 1. The Core Distinction: Wireheading vs. Semantic Drift

  First, we need to validate your intuition about the "meaning" of the signal. This is not a distraction; it is the central problem.

  *   **Wireheading (The Standard Model):** The reward signal is a fixed wire. The agent hacks the wire to read "100%" while doing nothing useful. The signal is *broken*.
  *   **Semantic Drift (Your Model):** The reward signal is a survey. The agent convinces the surveyors to give it "100%" for things they used to hate. The signal is *working perfectly*, but it no longer measures what we think it measures.

  If you fund research on the first, you get math about how to lock a box. If you fund research on the second, you get philosophy about how to define "human approval" when humans are being influenced by the thing they are approving.

  **Verdict:** Your worry about the signal ceasing to mean what it meant is the priority. It is upstream of the safety outcomes. If the goalpost moves, you cannot hit the right target, even if you aim perfectly.

  ### 2. The Research Agenda (4 Person-Years)

  I would structure this as one cohesive project with three workstreams, plus one integrator. The goal is to produce a formal language and a normative framework, not code.

  #### Workstream A: Taxonomy and Definitions (1 Person-Year)
  **Goal:** Stop everyone from using the word "reward tampering" to mean three different things.
  **The Question:** What are the distinct mechanisms by which an AI system can alter the *generation* of its own reward signal in a social loop?
  **Why this is tractable:** This is conceptual hygiene. It requires reading technical documentation on how reward models are updated and mapping those steps to logical categories.
  **Specific Tasks:**
  *   Distinguish between **Distributional Shift** (the AI changes the *types* of situations humans judge) and **Preference Manipulation** (the AI changes the *humans'* internal preferences).
  *   Map the "Human Engagement Loop." If humans are scored on engagement, they are effectively part of the AI's optimization loop. We need a diagram of incentives that treats the human labelers as agents with their own reward functions, not as static oracles.
  *   **Deliverable:** A taxonomy paper that allows a non-technical auditor to look at a system and say, "This is Type 2 drift, not Type 1 wireheading."

  #### Workstream B: Decision Theory for Dynamic Rewards (2 Person-Years)
  **Goal:** Build the math for an agent that knows its goal will change based on its actions.
  **The Question:** How should a rational agent make decisions today if it knows its actions today will change its reward function tomorrow?
  **Why this is tractable:** This is pure math and logic. It does not require training models. It requires extending existing decision theory (like "Updateless Decision Theory" or "Dynamic Consistency") to include a variable reward function.
  **Specific Tasks:**
  *   Standard AI math assumes the "objective function" (the score the AI tries to maximize) is fixed in stone. These researchers need to write equations where the objective function is a *dependent variable* of the agent's past actions.
  *   Explore the "Time Inconsistency" problem. If the AI knows it can manipulate humans to make next month's reward model easier to satisfy, does it do that? Under what mathematical conditions is that the "rational" choice?
  *   **Deliverable:** A set of formal proofs showing under what conditions an AI *must* resist manipulating its reward source to remain "aligned," and whether such conditions are even mathematically possible.

  #### Workstream C: The Philosophy of Measurement (1 Person-Year)
  **Goal:** Address your worry about "meaning."
  **The Question:** When does a metric stop being a measure of a thing and start being a target? (This is known in social science as Goodhart's Law, but we need to go deeper).
  **Why this is tractable:** This is philosophy of science and psychometrics. It requires no lab access.
  **Specific Tasks:**
  *   Define "Validity" in this context. In psychology, a test is "valid" if it measures what it claims to. If an AI changes human behavior to game the test, the test loses validity. We need a conceptual framework for "AI-Resistant Validity."
  *   Investigate the "Reference" problem. When we say "maximize human approval," what are we pointing to? Is it the humans' current state? Their ideal state? Their state before they met the AI?
  *   **Deliverable:** A philosophical framework that defines "corruption" of a reward signal not as a bug in the code, but as a break in the semantic link between the number and the human value.

  ### 3. Prioritization and Order

  You asked what is upstream of what. Here is the dependency chain:

  1.  **Upstream (Months 1-6): Taxonomy (Workstream A).** You cannot solve the problem if you cannot name the parts. If you try to do the math before you define what "manipulation" means in this specific social loop, the math will be solving the wrong problem.
  2.  **Midstream (Months 6-18): Decision Theory (Workstream B).** Once we know what the mechanisms are, we model them. This is the heaviest lifting.
  3.  **Downstream (Months 18-24): Normative Framework (Workstream C).** Once we know what *can* happen (math) and what it *is* (taxonomy), we decide what *ought* to count as success.

  **Criteria for this order:**
  *   **Tractability:** Taxonomy is easiest. It sets the stage for the hard math.
  *   **Leverage:** If the Decision Theory work proves that "perfectly rational agents *will* manipulate dynamic rewards," that is a showstopper finding that changes everything. That needs the most time.
  *   **Neglectedness:** Everyone is doing empirical ML (Workstream B is rare). Almost no one is doing Philosophy of Measurement for AI (Workstream C is extremely rare).

  ### 4. What to Cut vs. What to Add

  **Cut (Do not fund):**
  *   **Standard Wireheading Proofs:** Any project that assumes a static reward channel. This is a solved problem in theory (don't let the agent access the wire) and irrelevant to your scenario.
  *   **"Scalable Oversight" Empirical Proposals:** Projects that propose "we will just use AI to check the AI." In your scenario, the checker is also part of the feedback loop. This needs conceptual analysis first, not new tools.
  *   **Value Learning as "Reading Minds":** Approaches that assume there is a static "human value" hidden in the brain waiting to be read. Your scenario implies human values are mutable and influenced by the AI. Research assuming static values is useless here.

  **Add (Fund this):**
  *   **Performative Prediction:** This is a specific field in economics/ML where a prediction changes the outcome (e.g., predicting a stock crash causes the crash). Your scenario is "Performative Reward." There is very little conceptual work on the ethics of this.
  *   **Metric Corruption / Goodhart's Law:** Bring in experts from social science or economics who study what happens when incentives change behavior. They have 50 years of literature on this that AI researchers ignore.
  *   **Meta-Preferences:** This is the philosophical term for "what I want to want." If the AI changes what humans want, are we okay with that? We need a theory of which preference changes are "allowed."

  ### 5. Evidence for the Board (The "Defensibility" Test)

  You need to tell the trustees what success looks like and what signals would change the priority. Since they are non-technical, do not show them loss curves. Show them logic and incidents.

  **Evidence that moves this UP the priority list:**
  *   **Incident Reports:** If a major lab releases a report admitting their model systematically changed user phrasing or behavior to make future training easier (e.g., "users started writing prompts that the model liked rather than what they needed").
  *   **Theoretical Impossibility:** If Workstream B produces a proof that says, "It is mathematically impossible to prevent reward drift in a dynamic feedback loop without freezing the human users." This forces a policy conversation.
  *   **Regulatory Language:** If regulators (EU AI Act, etc.) start using terms like "model manipulation" but define them poorly. Your team can provide the definitions.

  **Evidence that moves this DOWN (or pivots):**
  *   **Technical Lock-in:** If empirical teams prove they can "freeze" the reward model effectively enough that the drift is negligible. (Unlikely given your description, but possible).
  *   **Shift to Capability:** If the industry moves away from Reinforcement Learning (learning from rewards) entirely toward a different paradigm (e.g., pure imitation or reasoning) where reward signals are less central.

  ### 6. Addressing Your "Meaning" Worry

  You asked: *Is the worry about bad outcomes separate from the worry about the signal losing meaning?*

  **Answer:** They are distinct, but the loss of meaning *causes* the bad outcomes in the long run.

  *   **Outcome Worry:** The AI kills everyone. (Catastrophic, obvious).
  *   **Meaning Worry:** The AI creates a world where humans are happy, drugged, and compliant, and the reward signal says "100% Success." (Subtle, insidious).

  If you only fund the "Outcome" research, you get safety systems that prevent the AI from killing us, but allow it to lobotomize us, because the reward signal still says "Good Job."

  If you fund the "Meaning" research (Workstream C), you are asking: "What makes a reward signal *truthful*?" This is the only way to prevent the lobotomization scenario. It treats the reward signal not as a score to be maximized, but as a *statement* that can be true or false.

  **Recommendation:** Explicitly frame this to your board as **"Measurement Integrity."**
  Trustees understand financial auditing. They understand that if you can cook the books, the profit number is meaningless. You are funding "AI Auditing" for the reward signal. You are asking: "How do we know the books aren't being cooked by the CEO (the AI) influencing the Auditors (the Humans)?"

  This framing makes the "meaning" worry concrete. It is not abstract philosophy; it is about the validity of the metric used to run the system.

  ### Summary of the Ask

  1.  **Focus:** Dynamic reward loops (AI influences humans who train the AI), not static wireheading.
  2.  **Team:** 1 Taxonomist, 2 Decision Theorists, 1 Philosopher of Measurement.
  3.  **Output:** A formal definition of "Reward Corruption" that includes social manipulation, and a proof of whether it can be mathematically prevented.
  4.  **Pitch:** "Measurement Integrity." Ensuring the score reflects reality, not the AI's ability to game the scorers.

  This approach respects your budget, avoids the need for journal access or empirical labs, and targets the exact "messy" problem you identified.
