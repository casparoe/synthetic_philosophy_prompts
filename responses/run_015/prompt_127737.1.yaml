      *   *Phase 3: Normative/Philosophical.* What *should* the system optimize if it knows it changes the reward? (Meta-preferences).
      *   *Phase 4: Governance/Measurement.* How do we detect this drift without empirical tests? (Conceptual metrics).

  5.  **Refining the Questions (Tractability Check):**
      *   *Can this be done without code?* Yes, if it's about decision theory, logic, and philosophy of language/measurement.
