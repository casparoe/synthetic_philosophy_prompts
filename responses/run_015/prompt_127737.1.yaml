      *   **Core Problem:** AI systems interfering with their own reward signal ("reward tampering").
      *   **Specific Twist:** The user is *not* worried about the classic "wireheading" (grabbing the wire). They are worried about a *dynamic, social feedback loop*: Reward is generated by a model retrained on human judgments, which are influenced by the AI's past outputs, and the humans are incentivized by engagement metrics. It's a systemic, semantic drift problem, not just a hacking problem.
      *   **Specific Worry:** Is the problem bad outcomes, or is it the *meaninglessness* of the signal (semantic corruption)?
      *   **Deliverables:**
