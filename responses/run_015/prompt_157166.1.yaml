  10. **Final Polish:** Check tone. Ensure it sounds like an audit, not a lecture. Use the user's numbering.

  *(Self-Correction on the "Single Revision")*: Is modifying (4) better than modifying (6)?
  If I modify (6) to acknowledge praise is positional, I still have the problem of justifying (5) against (4).
  If I modify (4), I justify (5) against (2) and (3).
  (4) is the deeper philosophical block. (6) is a policy heuristic. Fix the philosophy, the heuristic adjusts.
  Okay, sticking with revising (4).

  Wait, looking at (7). (7) says "don't treat successful as morally special." (1) says "admire and reward."
  Is there a tension there? "Admire" implies some specialness. But (7) clarifies "morally" special. You can admire skill/output without implying moral superiority. That seems manageable. I won't rank it high.

