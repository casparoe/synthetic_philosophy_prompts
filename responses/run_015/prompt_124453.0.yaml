answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Public Realm Design Commission
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Civic Plaza Reconstruction and Governance Framework

  **Introduction**

  The Commission submits this recommendation regarding the reconstruction of Civic Plaza. While the staff report frames this decision as a selection of capital improvements, the Commission recognizes that the choice between the submitted options is fundamentally political. We are not merely selecting materials; we are selecting the mechanism by which public space is governed. This memo analyzes the options through the lens of artifact politics, specifically distinguishing between designs that settle matters of common life by technical means and those that require specific organizations of power to function.

  **Artifacts and Power Structures**

  Following the distinction articulated by Langdon Winner, we must ask whether the politics of these options are inherent in the artifact or compatible with specific power structures. Option A (segmented benches, locked restrooms) settles the matter of who belongs in the plaza by technical means. Once built, the exclusion is embedded in the concrete. It requires no ongoing authority to enforce; the artifact itself is the authority. It is compatible with any administration but demands none. Option B (sensor package), conversely, is inherently political in the stricter sense. It requires a continuing apparatus of monitoring, credentialed technicians, and a vendor relationship. The social condition is internal to the technical system; without the vendor's software and the staff's dashboard access, the system fails.

  Option A externalizes the politics into the environment, making the exclusion permanent and impersonal. Option B internalizes the politics into a hierarchy of access. While Option A appears neutral because it requires no active management, it effectively delegates authority to the design itself, removing the possibility of human discretion. Option B retains human discretion but concentrates it within a technical bureaucracy.

  **The Constructivist Objection**

  Some argue that artifacts carry no politics and that meaning resides entirely in surrounding practices. If this social constructivist objection holds, the choice between A and B turns on which artifact allows for more democratic practices. Option A constrains practice physically; one cannot lie down regardless of social consensus. Option B constrains practice algorithmically; one cannot lie down unless the code permits. If politics lives in practice, Option A forecloses the practice of dwelling entirely. Option B allows the practice to exist but subjects it to surveillance. Therefore, even if artifacts are politically neutral vessels, Option A is the more restrictive vessel for democratic life.

  **Deliberative Considerations**

  Three specific considerations guided our analysis of legitimacy and accountability.

  First, reversibility and visibility come apart. Option A's norm is durable and legible; anyone can see the armrests prevent sleeping. Option B's norm is cheap to revise but invisible; thresholds are moved by sliders. We conclude that visibility matters more for legitimacy. A citizen cannot contest a rule they cannot see. Option B's opacity creates a democratic deficit where the law is hidden in code. However, Option A's visibility is the visibility of a locked door. We prefer the invisible rule that can be changed over the visible rule that cannot.

  Second, contestability. A norm encoded in a thing is governed by whoever maintains it. In Option A, maintenance is Public Works; contestation requires physical alteration or political pressure on Council. In Option B, maintenance is a vendor release cycle; contestation requires dashboard credentials. Option B is less contestable by an ordinary resident because the barrier to entry is technical literacy rather than physical force. However, Option B creates a point of leverage (the vendor contract) that Option A does not.

  Third, data drift versus silence. Option B produces a quantitative record of dwell time; institutional ends tend to drift toward what is measured. Option A produces silence. We argue that drift is preferable to silence. Silence implies no problem exists to be solved. Data drift creates a record that can be audited, even if imperfectly. Option A's silence is a form of erasure; Option B's data is a form of surveillance. Erasure is harder to remedy than surveillance.

  **The Objection of Refusal**

  Some members argue the Commission should refuse to decide, asserting that choosing between armrests and sensors launders a housing failure as a procurement decision. We meet this head-on: refusal is itself a decision. To decline recommendation defaults the process to staff preference, which favors Option A on cost grounds. Refusing to choose accepts the exclusionary outcome while absolving ourselves of responsibility. Furthermore, while Option B's reprogrammability is cited as an escape from determinism, we acknowledge it merely relocates the politics from the concrete to the code. However, relocation is preferable to petrification. Code can be rewritten; concrete cannot. Therefore, we must choose the option that keeps the political question open.

  **Recommendation**

  The Commission recommends **Option B**, conditioned on the City Council's simultaneous commitment to fund **Option C** (extended shelter hours and outreach). Option B is only legitimate if the exclusion it manages is temporary and necessary for safety, not a substitute for housing. Without Option C, Option B becomes a high-tech method of managing poverty rather than alleviating it.

  **Governance Framework**

  To mitigate the risks of vendor lock-in and opaque governance, the following rules apply to Option B:

  1.  **Open Mode Decision Rule:** The system shall be placed in "open mode" (sensors disabled, benches static) automatically upon a National Weather Service extreme heat or cold warning. Additionally, any two Commission members may request open mode during a declared local emergency; staff must approve this request within four hours unless it violates a specific safety statute.
  2.  **Threshold Standing:** Changes to dwelling thresholds or sensitivity settings require thirty days' public notice and a vote by the Public Realm Design Commission. A quorum of four members is required to approve changes. The vendor is prohibited from altering thresholds without this authorization.
  3.  **Sunset and Review:** This authorization sunsets in thirty-six months. A review will be triggered automatically if the false-positive rate for reclining exceeds 5% or if overnight shelter capacity utilization remains below 90% for six consecutive months. Failure to meet these criteria will terminate the vendor contract and revert the plaza to neutral seating.

  **Implementation Timeline**

  *   **Months 1-3:** Finalize vendor contract with audit clauses; Council appropriates Option C funding.
  *   **Months 4-6:** Install sensor infrastructure; calibrate baseline thresholds.
  *   **Months 7-9:** Public trial period; dashboard goes live; Commission reviews initial data.
  *   **Months 10-12:** Full operational rollout; first quarterly review.

  **Rejected Option**

  We reject Option A. The strongest argument for Option A is fiscal and operational durability. It requires no ongoing budget, no vendor management, and no technical oversight. It is a "set and forget" solution that guarantees the plaza remains clean and accessible for transit users without burdening staff with enforcement decisions. In a climate of shrinking municipal budgets, the appeal of a one-time capital cost that eliminates ongoing management liability is substantial. It promises order without administrative friction.

  **Limits of Remit**

  Finally, the Commission must clarify the limits of this decision. We design public realms, not social safety nets. This recommendation cannot fix the regional housing shortage or the inadequacy of mental health services. We are telling Council that while we can design a plaza that treats vulnerable residents with dignity rather than hostility, we cannot design a home. Option B manages the symptom; Option C addresses the cause. This Commission can ensure the plaza does not become a weapon against the unhoused, but only Council can ensure the unhoused have somewhere else to go. We have chosen the design that leaves that political work possible.
