prompt: |-
  I am putting together a seminar module on automated decision-making for final-year philosophy and public policy students, built around a screening of Gattaca (Andrew Niccol, 1997). I want the session to do more than use the film as a cautionary illustration of "bias in algorithms", so I need a reading of it that takes a specific technical literature seriously and is willing to say where the film and the literature do not fit.

  The literature I want it read against is the family of impossibility results for algorithmic fairness. I will state them in my own terms so that you do not have to reconstruct or cite anything: when the outcome being predicted has a different prevalence in two populations, a single predictor cannot in general be calibrated in both populations — a given score cannot carry the same expected outcome for members of each — while also having equal false-positive and false-negative rates across them; and a third natural demand, that a given decision threshold carry the same predictive value regardless of population, is likewise not jointly satisfiable with those. There are also well-known tensions between group-level criteria of that kind and "treat like cases alike" individual fairness, which turns everything on the choice of a similarity metric. Assume these results as background; I know the papers and do not want references, a bibliography, or suggestions for further reading — only the reading of the film.

  Here is what I want. Work out what Gattaca's regime is actually doing in those terms: the genetic registry classifies everyone, in-valids are excluded from professional employment despite discrimination being nominally illegal, and the profile is used as a proxy for fitness. Then take the scenes I would show: the childhood game of chicken in the open sea and its nocturnal reprisal; Vincent's daily grooming and the borrowed samples by which he passes as a valid; Jerome's silver medal and the paralysis he inflicted on himself; Irene's undisclosed cardiac risk; Anton's investigation of the murder and the genetic sweep that follows an eyelash; Lamar's decision at the launch to falsify a result he knows is being gamed; Director Josef's killing; and Jerome's death with his medal. Say what each of these dramatizes, if anything, about calibration, error rates, proxy use, or the harms of being accurately ranked, and be explicit about scenes that illustrate nothing in the literature and would mislead the class if I presented them as illustrations.

  I also want you to work through a counterfactual inside the film's world, since I plan to hand it to students as a written exercise. Suppose reformers abolish exclusion by faith-birth status and replace it with a regulated risk score: Gattaca may decline any applicant whose predicted probability of mission-critical failure exceeds a published threshold, provided the score is calibrated in both populations and rejects capable valid and capable in-valid applicants at equal rates. Assume, as the film's world suggests, that mission-relevant failure really is more common among in-valids, and that seats on a launch are scarce and governed by a hard safety constraint. Which of those requirements cannot be met together, which would Gattaca's board quietly abandon and with what justification, and would Vincent be admitted, rejected, or admitted only by luck under each surviving version? Say too what becomes of the fairness question once the problem is one of allocating a fixed number of seats rather than classifying individuals.

  Finally, be an honest critic in both directions. I can see two ways the film resists this reading, and I want you to develop them or replace them with better ones: first, that mode of conception is not merely correlated with the predicted trait but close to identical with it, so this is a limiting case in which the usual trade-off — give up some accuracy to buy fairness — may not have the shape the results describe; second, that the film's objection is not fundamentally about error rates at all but about a caste order, unequal access to enhancement, and the expressive and dignitary harm of being told what you are for, none of which a fairness criterion registers. Vincent's own claim, that he got where he is on his merits, is an individual-fairness claim rather than a group one, and the ending vindicates him through a single official's discretionary act of rule-breaking — which the fairness literature would normally treat as the problem rather than the solution. Tell me how to present that tension without resolving it dishonestly, and close by saying what the film shows about statistical discrimination that the formal results and the policy papers cannot show.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar module reading:

  1.  **Deconstruct the Request:**

      *   **Target Audience:** Final-year Philosophy and Public Policy students.
      *   **Core Material:** *Gattaca* (1997) + Impossibility Results for Algorithmic Fairness (Calibration, Error Rate Balance, Predictive Value Parity, Individual Fairness).
      *   **Constraint:** Do *not* cite papers, provide bibliographies, or suggest further reading. Focus *only* on the reading of the film against the literature.
      *   **Task 1: Scene Analysis:** Analyze specific scenes (Chicken game, grooming/samples, Jerome's medal/paralysis, Irene's risk, Anton's sweep, Lamar's decision, Josef's killing, Jerome's death) through the lens of calibration, error rates, proxy use, and ranking harms. Explicitly identify scenes that *don't* fit the literature.
      *   **Task 2: Counterfactual Exercise:** Design a policy reform scenario within the film's world (regulated risk score, calibrated, equal rejection rates, hard safety constraint, scarce seats). Analyze trade-offs, what gets abandoned, Vincent's status under each version, and the shift from classification to allocation.
      *   **Task 3: Critical Tension:** Address two specific resistances: (1) Genetic determinism as a "perfect proxy" limiting the trade-off shape, and (2) The film's critique being about caste/dignity/expressive harm rather than error rates. Address Vincent's individual fairness claim vs. group fairness, and Lamar's discretion as a solution vs. problem.
      *   **Goal:** Be an honest critic. Don't resolve tensions dishonestly. Show what the film reveals that formal results miss.

  2.  **Task 1: Scene Analysis against Fairness Literature:**

      *   *Concept Check:* The literature says you can't have Calibration + Error Rate Balance (FPR/FNR equal) + Predictive Value Parity if base rates differ. *Gattaca* assumes base rates differ (In-valids = higher risk).
      *   *Childhood Game (Chicken):* This establishes the "ground truth." Vincent (In-valid) beats Anton (Valid). This challenges the *accuracy* of the genetic predictor. It shows the model has False Negatives (Vincent is capable) and False Positives (Anton is less capable than predicted). It dramatizes the *error* inherent in the proxy.
      *   *Grooming/Samples:* This is "gaming the system" or adversarial input. In fairness literature, this is usually treated as noise or fraud. Here, it's the only way to bypass the statistical discrimination. It highlights that the *measurement* is of the sample, not the person.
      *   *Jerome's Medal/Paralysis:* Jerome is a "Valid" who failed psychologically. This is a False Positive in the psychological/fitness domain. It shows genetic perfection $\neq$ mission success. It complicates the "ground truth" of fitness.
      *   *Irene's Cardiac Risk:* She is a Valid but "imperfect." She is internally calibrated (she knows her risk) but excluded from certain roles. This illustrates *within-group* stratification. It shows the system isn't just Valid/Invalid, but a continuous risk score.
      *   *Anton's Sweep (Eyelash):* This is the investigative use of the registry. It's a perfect identifier, but does it predict *guilt*? No. It predicts *presence*. This is a proxy misuse (identity vs. culpability).
      *   *Lamar's Decision:* Lamar knows Vincent is an In-valid (or at least suspects) but lets him go. This is *discretionary override*. In fairness terms, this breaks the rule to achieve a just outcome. It violates "consistency" (Individual Fairness) to correct a group harm.
      *   *Josef's Killing:* The Director is killed by a Valid (the murderer). The system failed to predict the violence of the Valid. Another False Positive on the Valid side.
      *   *Jerome's Death:* Suicide after helping Vincent. This is the human cost of the *ranking* itself. Even the "top" of the lower caste (silver medal) is crushed. This speaks to expressive harm, not statistical error.

      *   *Misleading Scenes:* The murder mystery plot. The fairness literature is about *allocation* (jobs, loans), not *culpability*. Using the eyelash to find the murderer suggests genetic determinism extends to criminal intent, which the film actually undermines (the murderer was a Valid). If presented as "algorithmic profiling works," it misleads. It actually shows the *limits* of the profile (it found the person, not the motive).

  3.  **Task 2: The Counterfactual Exercise:**

      *   *Setup:* Abolish status exclusion. Use risk score. Calibrated in both populations. Equal rejection rates (FPR/FNR balance). Hard safety constraint (fixed seats).
      *   *The Impossibility:* If base rates differ (In-valids riskier), you cannot have Calibration + Equal Error Rates.
      *   *What gets abandoned?*
          *   Option A (Calibration focus): Gattaca keeps the score meaningful. "A score of 80 means 80% success" for everyone. To do this with different base rates, they must accept different Error Rates (In-valids get rejected more often at the same threshold). *Result:* Vincent rejected (unless his personal score is high enough, which requires him to beat the average In-valid stats).
          *   Option B (Error Rate focus): Gattaca ensures equal opportunity (same % of V/IV rejected). To do this with different base rates, the scores cannot be calibrated (A score of 80 means different things for V vs IV). *Result:* Vincent might get in, but his score is "inflated" relative to a Valid.
          *   Option C (Predictive Value Parity): Same % of those accepted succeed.
      *   *The "Quiet Abandonment":* In a safety-critical industry (space), they will abandon Equal Error Rates. They will prioritize Calibration (safety). They will argue "Safety is colorblind." This leads to disparate impact.
      *   *Allocation vs. Classification:* If seats are fixed (N seats), this becomes a *ranking* problem, not a threshold problem. You take the top N scores. If In-valids have a lower mean score, they get fewer seats. Fairness becomes about *composition* of the cohort, not individual thresholds.
      *   *Vincent's Fate:* Under Calibration (Safety first), Vincent is rejected unless his *individual* metric beats the cutoff. Since he is borrowing Jerome's (high) metrics, he passes the *measurement*, but if the system detects the distribution anomaly, he's out. Under the counterfactual where we know he is In-valid: He is rejected if the system prioritizes group statistics over individual performance.

  4.  **Task 3: Critical Tension & Honest Critique:**

      *   *Tension 1: Perfect Proxy?* The literature assumes noisy proxies. The film posits genetics as *near-perfect* predictors of health/longevity, but *poor* predictors of will/spirit. The trade-off shape changes if the proxy is perfect. If genetics *caused* failure deterministically, fairness constraints would just reduce utility. But the film argues the proxy is *causally incomplete*. It misses "the human spirit." So the trade-off isn't Accuracy vs. Fairness; it's Narrow Accuracy vs. Broad Accuracy.
      *   *Tension 2: Caste vs. Error:* The film is about dignity. "There is no gene for the human spirit." Fairness literature accepts the category (race/gender) and asks how to treat them. *Gattaca* asks why we categorize at all. The harm is expressive: "You are your genes."
      *   *Vincent's Claim:* "I never saved anything for the swim back." This is meritocratic individualism. Fairness literature is mostly group-based (demographic parity). Vincent wins because he is an *exception*, not because the *group* was treated fairly.
      *   *Lamar's Discretion:* Literature says discretion introduces bias. Film says discretion allows humanity. This is the "Rule of Law vs. Equity" tension.
      *   *What the Film Shows:* The *lived experience* of being a probability. The anxiety of the "false positive" (Irene) and the "false negative" (Vincent). The literature quantifies harm; the film qualia-izes it.

  5.  **Drafting the Response:**

      *   *Tone:* Academic, precise, philosophical, direct. No fluff.
      *   *Structure:*
          1.  Introduction: Framing the module.
          2.  Scene-by-Scene Analysis (The Reading).
          3.  The Counterfactual Exercise (The Policy).
          4.  Critical Tensions (The Critique).
          5.  Conclusion: What the film adds.

      *   *Refining the Scene Analysis:* Ensure I explicitly state which scenes *don't* fit. The murder investigation is the big one. It looks like "predictive policing" but is actually just forensics.
      *   *Refining the Counterfactual:* Make sure the impossibility theorem is applied correctly. Base rate difference + Calibration + Equal Error Rates = Impossible. Gattaca chooses Calibration (Safety).
      *   *Refining the Critique:* Focus on the "Expressive Harm." The literature asks "How do we divide the pie?" The film asks "Why is the pie made of genes?"

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I cite papers? *No.*
      *   *Check:* Did I address the specific scenes requested? *Yes.*
      *   *Check:* Is the counterfactual logically sound regarding the impossibility results? *Yes, if base rates differ, you can't have calibration and error rate balance.*
      *   *Check:* Did I address the "Perfect Proxy" objection? *Yes, by distinguishing health prediction from will prediction.*
      *   *Check:* Did I address the "Caste" objection? *Yes, distinguishing distributive fairness from status hierarchy.*

  7.  **Final Polish:** Ensure the distinction between *classification* (threshold) and *allocation* (ranking) is clear in the counterfactual section. Ensure the distinction between *group fairness* and *individual fairness* is clear in the critique. (Proceed to generate output).

  *(Self-Correction Note on the Counterfactual)*: I need to be careful. If the reformers *require* calibration in both populations AND equal rejection rates, and base rates differ, the system is mathematically broken. The prompt asks "Which of those requirements cannot be met together." I need to state clearly: Calibration + Equal Error Rates is impossible with different base rates. Gattaca would drop Equal Error Rates to keep Calibration (Safety).
  Also, the prompt asks about "allocating a fixed number of seats." This shifts from binary classification to ranking. In ranking, "Equal Rejection Rates" is weird. It becomes "Selection Rate Parity." If you select top N, and distributions differ, selection rates differ. To get selection rate parity, you must lower the threshold for the disadvantaged group, which breaks Calibration (the selected In-valids will have lower expected success than selected Valids).

  *(Self-Correction on Scenes)*: Make sure to explicitly mention which scenes are *misleading*. The murder investigation is the strongest candidate for misleading if framed as "algorithmic decision making" regarding *risk*, because it's about *identity*.

  *(Final check on tone)*: Keep it rigorous. These are final-year students. Don't explain the math, apply it.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # Seminar Module: *Gattaca* and the Impossibility of Fair Algorithms

  ## Part I: Scene Analysis Against Fairness Constraints

  This reading treats the Gattaca Aerospace Corporation not merely as a dystopia, but as a deployment environment for a high-stakes classifier. The genetic registry functions as a risk score. The "Valid/In-valid" distinction is a protected attribute (or a proxy for one) with differing base rates for mission failure. The following analysis maps specific scenes to the technical constraints of calibration, error rates, and proxy validity.

  **1. The Childhood Game of Chicken (and Nocturnal Reprisal)**
  *   **Technical Concept:** Ground Truth vs. Predicted Label; False Negatives.
  *   **Reading:** This scene establishes the base rate fallacy. The genetic profile predicts Anton (Valid) will outperform Vincent (In-valid). Vincent wins. This is a False Negative for the classifier regarding Vincent (predicted failure, actual success) and a False Positive regarding Anton (predicted success, actual relative failure).
  *   **Seminar Point:** Use this to challenge the *accuracy* of the proxy. The impossibility results assume the predictor has *some* information. This scene suggests the predictor is missing a latent variable ("will," "spirit") that correlates poorly with genetics but highly with the outcome. It dramatizes the cost of a False Negative: the In-valid is excluded not because they will fail, but because the model cannot see the variance within the In-valid distribution.

  **2. Vincent's Grooming and Borrowed Samples**
  *   **Technical Concept:** Adversarial Input / Goodhart's Law.
  *   **Reading:** Vincent does not change his genetic reality; he changes the *measurement*. In fairness literature, this is often treated as fraud. In *Gattaca*, it is the only path to Individual Fairness ("treat like cases alike"). Vincent *is* alike the Valid whose samples he uses.
  *   **Seminar Point:** This illustrates the tension between *identity* and *score*. If the score is the only input, the system is vulnerable to sample spoofing. If the system requires identity verification (blood/urine tests), it reverts to group discrimination. It shows that "blind" evaluation is impossible when the input data is inextricably linked to the protected class.

  **3. Jerome's Silver Medal and Self-Inflicted Paralysis**
  *   **Technical Concept:** False Positives; Multi-dimensional Fitness.
  *   **Reading:** Jerome is genetically "Valid" but psychologically unfit. The genetic score calibrated for *physical* health is miscalibrated for *psychological* resilience.
  *   **Seminar Point:** This complicates the "Ground Truth." If mission failure includes suicide or sabotage, Jerome is a False Positive. It demonstrates that optimizing for one metric (genetic health) can degrade performance on another (mental stability). A fairness constraint that forces the inclusion of In-valids might actually *improve* overall utility if In-valids possess higher psychological resilience (as Vincent does), correcting the model's specification error.

  **4. Irene's Undisclosed Cardiac Risk**
  *   **Technical Concept:** Within-Group Stratification; Calibration.
  *   **Reading:** Irene is a Valid, but "imperfect." She is calibrated correctly (she knows her risk) but suffers expressive harm.
  *   **Seminar Point:** This scene resists the binary Valid/In-valid fairness frame. It shows that even within the privileged class, the algorithm creates a hierarchy. For the seminar, this illustrates that "group fairness" (Valid vs. In-valid) is insufficient. The harm is the *continuous ranking* itself. Irene is not discriminated against relative to In-valids; she is discriminated against relative to *better* Valids. This is a critique of ranking itself, not just the threshold.

  **5. Anton's Investigation and the Genetic Sweep (Eyelash)**
  *   **Technical Concept:** Proxy Misuse; Identity vs. Culpability.
  *   **Reading:** **Explicit Warning:** This scene is misleading if presented as an example of algorithmic *risk assessment*. It is an example of perfect *identification*.
  *   **Seminar Point:** Do not use this to illustrate predictive policing. The eyelash identifies *presence*, not *guilt*. The fairness literature concerns predictions of *future behavior* (recidivism, job performance). Using this scene suggests the genetic registry predicts criminal intent, which the film explicitly contradicts (the murderer is a Valid Director). Use this scene to show the *surveillance capacity* required to enforce the classification, not the validity of the classification itself.

  **6. Lamar's Decision at the Launch**
  *   **Technical Concept:** Discretionary Override; Individual Fairness.
  *   **Reading:** Lamar knows (or strongly suspects) Vincent is an In-valid ("Only a Valid could have done this... but you're not"). He lets him pass.
  *   **Seminar Point:** This is the antithesis of algorithmic consistency. In the literature, human discretion is usually the source of bias. Here, discretion is the source of justice. Lamar prioritizes *outcome* (Vincent's merit) over *process* (the genetic rule). This illustrates the "Rule of Law vs. Equity" tension. A perfectly fair algorithm (consistent application of the rule) would reject Vincent. A just outcome requires breaking the algorithm.

  **7. Director Josef's Killing**
  *   **Technical Concept:** Base Rate Neglect; False Positives.
  *   **Reading:** The Director is a Valid. He is the murderer. The system assumed safety based on genetic status.
  *   **Seminar Point:** This is the ultimate False Positive. The system excluded In-valids to ensure safety, yet the threat came from within the Valid class. It undermines the *business case* for discrimination. If the base rate of violence is not significantly different (or if the cost of a Valid violence is high), the exclusion of In-valids does not maximize safety.

  **8. Jerome's Death with His Medal**
  *   **Technical Concept:** Expressive Harm; Ranking Costs.
  *   **Reading:** Jerome commits suicide after Vincent leaves. He was the "best" of the In-valid proxies, yet he is disposable.
  *   **Seminar Point:** This scene illustrates nothing about error rates or calibration. It illustrates the *dignitary harm* of being a instrument. In fairness literature, harm is usually defined as denial of opportunity (loan, job). Here, the harm is ontological: being reduced to a biological resource. This is outside the scope of standard fairness metrics.

  ---

  ## Part II: The Counterfactual Exercise (Student Handout Material)

  **Scenario:** Reformers abolish status-based exclusion. Gattaca now uses a regulated risk score.
  **Constraints:**
  1.  **Calibration:** A score of $X$ must mean probability $X$ of failure for both Valids and In-valids.
  2.  **Error Rate Balance:** The rate of rejecting capable applicants (False Negatives) must be equal for both groups.
  3.  **Safety:** Seats are fixed ($N$). Total expected failures must not exceed a hard limit.
  4.  **Reality:** Mission failure is genuinely more prevalent among In-valids (different base rates).

  **The Impossibility:**
  Students must identify that with different base rates, **Calibration and Error Rate Balance are mathematically incompatible.**
  *   If you calibrate the score (Constraint 1), the threshold for safety will naturally reject more In-valids because their distribution is riskier. This violates Error Rate Balance (Constraint 2).
  *   If you enforce Error Rate Balance (Constraint 2), you must lower the threshold for In-valids. This means an In-valid with score $X$ is accepted while a Valid with score $X$ is rejected (or vice versa to balance errors). This violates Calibration (Constraint 1)—the score no longer means the same risk for both.

  **What Gattaca's Board Abandons:**
  In a safety-critical industry (spaceflight), the Board will quietly abandon **Error Rate Balance**.
  *   **Justification:** "Safety is colorblind." They will argue that Calibration is a physical necessity. If a score of 90% success means 90% for Valids but 80% for In-valids, the mission fails. They will frame Calibration as a technical requirement and Error Rate Balance as a political preference.
  *   **Result:** Disparate impact is codified. In-valids are rejected at higher rates, but the *meaning* of the score remains consistent.

  **Vincent's Status Under Each Version:**
  1.  **Calibration Prioritized (The Board's Choice):** Vincent is rejected *unless* his individual score (borrowed from Jerome) exceeds the safety threshold. Since he is using Jerome's Valid samples, he passes the *measurement*. However, if the reform requires him to declare his In-valid status for the sake of group calibration, he is rejected because his *group* base rate lowers his posterior probability.
  2.  **Error Rate Balance Prioritized:** Vincent is admitted *if* the system lowers the threshold for In-valids to match the Valid rejection rate. However, this means Vincent is admitted with a *lower* expected probability of success than a Valid counterpart. If a failure occurs, the policy is vulnerable to criticism that "standards were lowered."
  3.  **Allocation (Fixed Seats):** If the problem is ranking $N$ seats, "Equal Rejection Rates" becomes "Selection Rate Parity." To achieve this with different distributions, the Board must select In-valids with lower scores than Valids. This breaks Calibration. The "fairest" algorithm (Selection Rate Parity) produces a cohort where the In-valid members are statistically more likely to fail than the Valid members.

  **The Shift from Classification to Allocation:**
  When seats are fixed, fairness is no longer about whether an individual meets a threshold, but about the *composition* of the cohort. The fairness question shifts from "Was Vincent treated fairly?" to "Is the demographic makeup of the crew representative?" This highlights the tension between **Individual Fairness** (Vincent's merit) and **Group Fairness** (In-valid representation). The literature often treats these as compatible; the counterfactual shows that under scarcity and base rate differences, they are in direct competition.

  ---

  ## Part III: Critical Tensions and Honest Critique

  You must present two ways the film resists the fairness literature reading. Do not resolve these; leave them as open problems for the students.

  **Tension 1: The "Perfect Proxy" Objection**
  *   **The Literature's Assumption:** Algorithms use noisy proxies (zip code, credit history) for latent traits (risk, fitness). There is room to trade accuracy for fairness.
  *   **The Film's Reality:** In *Gattaca*, genetics is not a noisy proxy for health; it *is* the health. The correlation is near-perfect for physical traits.
  *   **The Conflict:** If the proxy is perfect, the impossibility results change shape. You cannot "buy fairness" by sacrificing accuracy if the accuracy is causal. If In-valids *are* physically weaker, excluding them isn't statistical discrimination; it's rational screening.
  *   **Seminar Presentation:** Ask students: *Is Vincent's success evidence that the proxy is noisy, or that the task (spaceflight) relies on traits (willpower) the proxy doesn't measure?* If the latter, the fairness literature applies (we are measuring the wrong thing). If the former (genetics determines will), then the fairness constraints are merely safety hazards. The film argues the former, but the world acts as if it is the latter.

  **Tension 2: Caste vs. Error Rates**
  *   **The Literature's Goal:** Distribute benefits and burdens fairly across groups within an existing system. It accepts the categories (Valid/In-valid) and asks how to score them.
  *   **The Film's Goal:** Dismantle the categories. Vincent's claim ("I never saved anything for the swim back") is a claim of **Individual Fairness** ("treat me as an individual"), not Group Fairness ("treat In-valids equally").
  *   **The Conflict:** The fairness literature generally views Individual Fairness (similar inputs $\rightarrow$ similar outputs) as compatible with Group Fairness. *Gattaca* shows they can diverge. Vincent succeeds *despite* his group, not *because* of group-level adjustments. Furthermore, Lamar's discretion (the solution in the film) is treated as a bug in the literature (source of bias).
  *   **Seminar Presentation:** The literature asks, "How do we set the threshold?" The film asks, "Why is there a threshold?" The harm Vincent suffers is not just exclusion (distributive); it is the **Expressive Harm** of being told his life is predetermined. No calibration metric captures the dignity loss of being a "probability."
  *   **The Ending:** Vincent wins because Lamar breaks the rule. The literature would say Lamar introduced bias. The film says Lamar introduced humanity. This is the tension between **Procedural Justice** (consistent rules) and **Substantive Justice** (right outcomes).

  **Closing: What the Film Shows That the Papers Cannot**
  The formal results quantify the trade-off: *You must lose X% accuracy to gain Y% fairness.* They treat this as a technical optimization problem.
  *Gattaca* shows the **phenomenology of the trade-off**. It shows the anxiety of the "False Positive" (Irene, living in fear of her heart) and the desperation of the "False Negative" (Vincent, scrubbing his skin to pass).
  The literature assumes the subjects accept the categories. The film shows the violence required to maintain them.
  The literature assumes the goal is to optimize the classifier. The film suggests the goal should be to render the classifier obsolete.

  **Instruction for the Seminar:**
  End the session by asking: *If we fix the algorithm (make it calibrated and error-balanced), have we fixed Gattaca?* The answer the film demands is **No**. The problem was never the math; it was the decision to let the math decide who matters. The impossibility results tell us we cannot have it all. The film tells us we should not want any of it.
