  7.  **Final Polish:** Ensure the "Software Engineer" persona is respected (logical, structural analysis) without being condescending. Use terms like "buggy logic" or "architectural flaw" metaphorically if helpful, but stick to philosophical precision. (Decided to stick to philosophical precision to maintain the "Expert" persona requested).

