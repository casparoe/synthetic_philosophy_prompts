      *   **Goal:** Determine fairness/accuracy (Acceptable, Simplification, Misrepresentation, Wrong) and evaluate the conclusion about institutional checks.

  2.  **Initial Brainstorming & Knowledge Retrieval (Spinoza's Core Concepts):**
      *   *Sovereignty (Summum Imperium):* For Spinoza, sovereignty is the power of the state. It is "absolute" in the sense that it is the highest power within the polity, but it is *not* unlimited metaphysically. It is limited by the power of the multitude. If the sovereign commands something impossible or universally hated, the sovereign loses power.
      *   *The Multitude (Multitudo):* The collective body of citizens. Sovereignty resides in them (in democracy). But the multitude is passionate, not inherently rational.
      *   *Conatus:* The striving to persevere. In politics, this translates to the desire for security and freedom.
      *   *Freedom of Thought:* Absolute right. The state cannot control minds. This is a *limit* on sovereignty, not just a feature.
      *   *Democracy:* Defined in the *Theological-Political Treatise* (TTP) and *Political Treatise* (TP). TTP is more optimistic/abstract; TP is more realistic/institutional.
      *   *Institutions:* Spinoza *does* propose institutions. In the TP (Aristocratic/Democratic sections), he talks about councils, syndics, courts, etc. He is not an anarchist or a pure direct democrat in the Rousseauian sense. He worries about mob rule.
      *   *Reason:* Reason is *not* distributed equally. Most people live by passion/imagination. Democracy is "most natural" because it aligns best with liberty, but it doesn't guarantee rational outcomes automatically.
      *   *Checks and Balances:* Spinoza is big on institutional design to channel passions. He isn't against "mediation"; he's against *tyranny* over the mind.

  3.  **Claim-by-Claim Audit Strategy:**
