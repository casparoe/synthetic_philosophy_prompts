      *   **Task:** Reconstruct Wittgenstein's position *based on the actual moves in Philosophical Investigations (PI) §243-315*, not popular glosses.
      *   **Specific Questions:**
          1.  Does the decoder solve the "criterion of correctness" problem (§258)?
