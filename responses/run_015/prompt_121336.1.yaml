answer: |-
  1. Rousseau argues in the *Letter to d'Alembert* that theater corrupts citizens by replacing active virtue with passive pity, yet his moral psychology identifies *amour-propre* as the engine of social identity through comparative recognition.
  2. This creates a paradox where the very mechanism of social virtue, regulating the desire for public esteem, relies on the performative self-presentation that the stage institutionalizes and amplifies.
  3. One might argue this inconsistency undermines his critique, suggesting that condemning theater is futile because social existence itself is inherently theatrical. However, this interpretation overlooks Rousseau's specific distinction between alienated spectacle and communal transparency.
  4. A more robust reading shows that Rousseau seeks not to eliminate performativity, but to redirect it through civic festivals where the distinction between actor and spectator dissolves.
  5. Thus, the tension ultimately validates his critique by demonstrating that virtue depends on harnessing theatrical dynamics for authentic civic unity rather than rejecting the performative nature of social life entirely.
