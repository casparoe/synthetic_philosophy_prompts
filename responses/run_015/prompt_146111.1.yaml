answer: |-
  1. Let's start with the lossy transmission case: if the scanner drops from ninety-nine percent fidelity down to sixty, where exactly does what matters stop?
  **Follow-up:** If you say it's just a matter of degree rather than a sharp threshold, doesn't that blur the line between identity and the thing that supposedly matters?

  2. Consider the daily commuter who teleports at ninety-nine percent fidelity for a year versus someone who just changes naturally over that same time.
  **Follow-up:** If the psychological difference between them is negligible, what actual work is the machine doing in your account?

  3. When the replica is built one cell at a time while the original stays conscious, at what point do you say a second person comes into existence?
  **Follow-up:** If you say there's no precise point, does the continuous consciousness of the original stop mattering to the answer?

  4. In the delayed push case, where both the Earth and Mars versions are conscious for a week, is there a fact of the matter about which one is you during that week?
  **Follow-up:** You'll likely say the question is empty, but how do you explain the Earth version's unique perspective on being destroyed?

  5. If the Earth version knows they will be destroyed after that week, is that destruction a harm to them, even if someone like them survives on Mars?
  **Follow-up:** If you say it's not a harm, aren't you asking us to ignore the immediate cessation of this specific conscious stream?

  6. In the coincidence case, where a duplicate appears by accident with no causal link to the original, does that count as full survival?
  **Follow-up:** If you say yes, aren't you saying causal history is irrelevant to what matters?

  7. If a backup is made without consent and activated after death, does the original have any reason to care about that replica during their life?
  **Follow-up:** If they should care, does the lack of consent change the metaphysics of survival, or only the morality?

  8. Setting aside thought experiments, what would count as evidence or an argument against your view that isn't just a redescription of the cases?
  **Follow-up:** If nothing could count against it, are we discussing a metaphysical truth or just a preferred way of speaking?

  9. As a seventeen-year-old, if identity isn't what matters, should I be less frightened of my own death and redistribute concern to others?
  **Follow-up:** If you say yes, hasn't your view become a piece of ethical advice rather than a piece of metaphysics?
