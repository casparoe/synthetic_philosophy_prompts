answer: |-
  # THE ARROW OF TIME: A LOGICAL DECISION TREE
  **Starting Premises:** (1) Microdynamics are time-symmetric. (2) Entropy is increasing locally.

  **1. Given time-symmetric microdynamics, is a special low-entropy boundary condition *required* to explain local entropy increase, or does increase emerge typically without one?**
  *   **Emerges Typically:** → **LEAF A: Deflationary / Typicality**
      *   *Awkward Commitment:* Must treat the universe's current order as a statistical given, risking dismissal of the cosmological fine-tuning problem.
  *   **Required:** → *Go to 2.*

  **2. Is the distinction between 'past' and 'future' grounded in the physical state of the universe, or in the epistemic situation of agents within it?**
  *   **Epistemic/Agent:** → **LEAF B: Perspectivalism** (e.g., Price)
      *   *Awkward Commitment:* Must deny an objective physical arrow, making temporal direction dependent on the observer's thermodynamic orientation.
  *   **Physical State:** → *Go to 3.*

  **3. If a theory successfully accounted for the universe's initial low entropy, would the continued increase of entropy require a *further* dynamical explanation?**
  *   **Yes, Further Explanation:** → **LEAF C: UNNAMED (The "Dan" Gap)**
      *   *Awkward Commitment:* Posits a dynamical bias for increase distinct from the boundary condition; incoherent with standard typicality arguments + T-symmetric microdynamics.
  *   **No, Automatic:** → *Go to 4.*

  **4. Is the low-entropy boundary condition a brute fact about the universe's state, or the output of a deeper cosmological mechanism?**
  *   **Cosmological Mechanism:** → *Go to 5.*
  *   **Brute Fact / State:** → *Go to 6.*

  **5. If cosmological, is the mechanism primarily a dynamical smoothing process (e.g., inflation) or a geometric constraint (e.g., vanishing Weyl curvature)?**
  *   **Dynamical Smoothing:** → **LEAF D: Inflationary Explanation**
      *   *Awkward Commitment:* Must assume the inflaton field's initial state does not itself require fine-tuning (the measure problem).
  *   **Geometric Constraint:** → **LEAF E: Weyl Curvature Hypothesis** (e.g., Penrose)
      *   *Awkward Commitment:* Requires a specific theory of quantum gravity to define curvature singularities rigorously.

  **6. If a brute boundary condition, must it apply to only one temporal extremity, or could the universe be symmetric around a central minimum?**
  *   **Symmetric (Two-Pasts):** → *Go to 7.*
  *   **Unique (One-Past):** → *Go to 8.*

  **7. If symmetric, is the low-entropy center a rare statistical fluctuation in an eternal background, or a structural necessity of a finite timeline?**
  *   **Statistical Fluctuation:** → **LEAF F: Boltzmann Fluctuation**
      *   *Awkward Commitment:* Commits to "Boltzmann Brains" (disembodied observers) being vastly more probable than embodied observers like us.
  *   **Structural Necessity:** → **LEAF G: Janus / Two-Past Point** (e.g., Barbour, Schulman)
      *   *Awkward Commitment:* Commits to a "future" big crunch or mirror universe that is causally inaccessible to us.

  **8. Is the asymmetry of records and counterfactuals the *primary* phenomenon to be grounded, with entropy serving as the macroscopic signature?**
  *   **Yes, Records Primary:** → **LEAF H: Record/Counterfactual Primacy** (e.g., Frisch, Elga)
      *   *Awkward Commitment:* Risks circularity if "record" is defined via thermodynamic irreversibility.
  *   **No, Entropy Primary:** → *Go to 9.*

  **9. Is the Past Hypothesis best understood as a fundamental law of nature, or a contingent initial condition?**
  *   **Fundamental Law:** → **LEAF I: Nomological PH** (e.g., Albert, Loewer)
      *   *Awkward Commitment:* Elevates a specific initial state to lawhood, straining Humean Best System accounts.
  *   **Contingent Condition:** → **LEAF J: Contingent PH**
      *   *Awkward Commitment:* Leaves the most critical fact in cosmology as an unexplainable cosmic accident.

  ***

  ### FACILITATOR NOTES & LOGICAL FLAGS

  **On Dan's Claim (Leaf C):**
  Marked **Unnamed**. This leaf is effectively empty not because nobody bothered, but because it is **dynamically unstable**. Given T-symmetric microdynamics, a low-entropy boundary + typicality *entails* entropy increase. To separate them requires rejecting typicality while keeping micro-symmetry, which implies a hidden dynamical bias no current model supports.

  **On Priya vs. Dana (Node 8):**
  Placed at **Node 8**. *Justification:* This distinguishes the *explanatory base*. Dana (Standard Mentaculus) argues entropy grounds the counterfactual asymmetry (we can't change the past because of the PH). Priya (Functionalists/Price-adjacent) argues the counterfactual asymmetry is the real target, and entropy is just how it looks macroscopically.

  **On Collapsed Distinctions (Leaf I vs. Leaf J):**
  **Flag:** *Nomological PH* and *Contingent PH* often collapse in practice. While metaphysically distinct (Law vs. Fact), they yield identical physical predictions and rely on the same Past Hypothesis posit. Separate only if discussing Humeanism vs. Non-Humeanism.
