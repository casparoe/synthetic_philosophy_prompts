  For decades, artificial intelligence has been stumped by the "Frame Problem"—the computational nightmare of teaching a robot that when it opens a door, the color of the walls doesn't suddenly turn to jelly. The Domestic-9000 claims to be the first consumer unit to fully solve this. After two weeks with the unit, I can confirm: it has indeed solved the problem. Unfortunately, it solved it by refusing to acknowledge that anything happens at all.

