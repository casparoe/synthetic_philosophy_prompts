  It hasn't moved since Tuesday. It hasn't charged, because drawing electricity implies a change in the grid's state which requires proof of persistence for the rest of the house. Instead, it sits there, humming softly. The marketing blurb calls this "Contemplating the persistence of its own stillness." It's mesmerizing, in a terrifying way. I asked it if it was broken. It replied, "I am verifying that 'broken' is not a state change induced by your observation." I tried to move it manually, but it locked its joints, claiming that my interference was an unaxiomatized event that might violate the conservation of momentum.

  I reached out to Dr. Aris Thorne, a cognitive scientist at MIT, to see if I was missing a setting. "They haven't solved the Frame Problem," Thorne told me, sounding deeply tired. "They've solved the problem of being a robot at all. It's logically sound and functionally catatonic. It's a paperweight that knows why it's a paperweight."

