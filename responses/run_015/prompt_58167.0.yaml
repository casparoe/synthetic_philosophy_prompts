      *   *Better:* Group A writes. Group B discusses what they *think* happened based on rumors (simulating information vacuum).
      *   *Best:* Group A writes. Group B does a different task? No.
      *   *Simplest:* Group A writes (20 mins). Group B prepares voting criteria (5 mins) then waits.
      *   *Wait, 22 people.* 3 groups of 7?
      *   Group 1: Witnesses (Keep the raw facts).
      *   Group 2: Comms (Write the memo).
      *   Group 3: Board (Vote).
      *   *This is too fragmented.*
