prompt: |-
  So I'm covering a session next Tuesday for our library's adult-ed writing workshop, around 22 people mostly in their 20s to 40s, 80 minutes total. We're doing a week on the Orwell idea that sloppy vague political language isn't just bad style, it actually makes it easier to go along with harsh stuff because you never picture what you're approving.

  I was chatting with my cousin who teaches middle school and she said just explaining that never really lands, people nod and then do it anyway. I want something where they catch themselves doing it in the room. My rough thought was to invent a campus situation we can all argue about, like our community college brings in a private security crew after a bunch of bike thefts and then they break up a small protest pretty roughly, and have half the room write the official update and the other half decide what to do based only on that wording, with some kind of vote or points so it feels real. I have a whiteboard and handouts and everyone has phones, no other tech realy.

  Could you lay out a full runnable plan with teams or roles, rules, timing, and what I should print ahead, so the shift in how they talk and vote happens before I ever name the concept. And then give me a debrief script that ties specific moments back to the language-shapes-thought point, plus a heads up on what typically goes sideways the first time and how to recover, and be straight with me about what part of the idea a game like this just can't get across and I'll have to cover by talking. I want them leaving actually spotting euphemisms in the wild, not just thinking that was a fun activty.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Orwell's idea that sloppy/vague political language facilitates harsh actions by obscuring reality (from "Politics and the English Language").
      *   **Audience:** Adult-ed writing workshop, ~22 people, ages 20s-40s.
      *   **Duration:** 80 minutes.
      *   **Goal:** Move beyond abstract explanation to *experiential realization*. Participants need to catch themselves using/being swayed by vague language *in the room*.
      *   **Constraints:** Whiteboard, handouts, phones (no other tech).
      *   **Specific Request:** Full runnable plan (teams, roles, rules, timing, printables), debrief script, troubleshooting (what goes sideways), and limitations (what the game *can't* do).
      *   **Tone:** Practical, direct, experienced (acknowledging the cousin's warning that "explaining doesn't land").

  2.  **Deconstruct the Core Concept:**
      *   Orwell's argument: Language $\rightarrow$ Thought $\rightarrow$ Action. Bad language dulls critical thought, allowing bad actions to proceed unchallenged.
      *   The User's Idea: A simulation involving a campus security incident. Half write the report, half decide the consequence based *only* on the report.
      *   Critique of User's Idea: It's good, but needs tightening to ensure the "language shift" happens visibly. If the writers just write honestly, the lesson fails. The prompt needs to *pressure* them into euphemism. The readers need to feel the *distance* from the reality.

  3.  **Develop the Simulation ("The Incident"):**
      *   *Scenario:* Needs to be morally ambiguous but emotionally charged. The "bike theft/protest" idea is solid. Let's refine it to ensure there's a clear "harsh reality" vs. "soft language" gap.
      *   *Roles:*
          *   Group A (Communicators): Tasked with "damage control." Their goal is to minimize backlash. This *incentivizes* euphemism.
          *   Group B (Decision Makers): Tasked with voting on policy (e.g., keep security, fire security, investigate). They only see the text.
          *   Group C (Witnesses - Optional but maybe too complex for 22 people/80 mins): Let's stick to two main groups to keep logistics tight. Actually, let's make it three phases to ensure everyone experiences both sides.
      *   *Revised Structure:*
          1.  **Phase 1 (The Reality):** Everyone sees the raw facts (video description/witness accounts).
          2.  **Phase 2 (The Spin):** Half the room writes the "Official Statement" under constraints (must sound professional, minimize liability).
          3.  **Phase 3 (The Vote):** The other half reads *only* the statements and votes on consequences.
          4.  **Phase 4 (The Reveal):** Compare the Reality vs. The Statement vs. The Vote.

      *Wait, 80 minutes is tight.* If I split them 50/50, half the room is bored while the other half writes.
      *Better Flow:*
      1.  Intro (5 mins)
      2.  The Raw Facts (10 mins) - Everyone sees the gritty reality.
      3.  The Writing Task (20 mins) - Split into teams. They are "PR/Admin."
      4.  The Decision Task (20 mins) - Swap papers. Now they are "Board Members."
      5.  Debrief (25 mins).
      *Correction:* Swapping papers takes time. Let's keep the groups static but have Group A write and Group B read. Then swap roles for a second round? No, one strong round is better than two rushed ones.
      *Best Approach:* Divide room into "Admin" (Writers) and "Board" (Voters). But to ensure everyone learns, *everyone* must write, and *everyone* must vote.
      *Solution:* Small groups of 3-4. Half the groups are "Admin," half are "Board." Admin writes, Board reads/votes. Then reveal. Then discuss.
      *Wait, to make it land:* The "Admin" needs a specific incentive to be vague. "Avoid lawsuits," "Maintain donor confidence."
      *The "Board"* needs to feel detached. "You weren't there. You only have this memo."

  4.  **Drafting the Plan (Iterative Refinement):**
      *   *Timing:* 80 mins is strict.
      *   *Printables:* Need a "Witness Packet" (gritty), an "Admin Brief" (constraints), a "Board Ballot" (voting).
      *   *The Trap:* The Admins *will* naturally use euphemisms if told to protect the institution. The Board *will* vote softer if the language is soft.
      *   *The Reveal:* Show the Witness Packet next to the Admin Memo. Show the Vote.

  5.  **Addressing the "Cousin's Warning":**
      *   Why do people nod and do it anyway? Because they don't feel the *consequence*.
      *   Fix: Make the vote matter. Give them "points" or a tangible outcome. If they vote to "Retain Security," they "win" stability but "lose" ethics. If they vote "Investigate," they "risk" unrest.
      *   Actually, the most powerful moment is when the Board realizes they almost approved something harsh because the words sounded nice.

  6.  **Developing the Debrief Script:**
      *   Needs to be Socratic. Don't lecture immediately. Ask: "How did the memo make you feel?" "What word stuck out?"
      *   Connect specific words ("incident" vs "assault", "relocated" vs "dragged").
      *   Connect to Orwell.

  7.  **Identifying Pitfalls:**
      *   *Cynicism:* "This is just how the world works." (Counter: That's why we study it.)
      *   *Giggle Factor:* People laughing at the euphemisms. (Counter: Keep the tone serious.)
      *   *Time Creep:* Writing takes longer than expected. (Counter: Strict timers.)
      *   *The "Good Guy" Bias:* Writers trying to be honest despite instructions. (Counter: Emphasize the "Protect the Institution" goal.)

  8.  **Identifying Limitations (The "Straight Talk" Section):**
      *   A game can't simulate *fear*. Real political language works because people are afraid of losing jobs/safety.
      *   A game can't simulate *repetition*. One instance doesn't rot your brain; years of it do.
      *   A game can't simulate *power dynamics*. In the room, they are peers. In reality, the writer has power over the reader.

  9.  **Final Polish:**
      *   Check timing.
      *   Ensure handouts are clear.
      *   Make sure the Orwell connection is explicit at the end.

