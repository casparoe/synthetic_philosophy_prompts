      *   *Nwoye:* Shows the *appeal* of the new order. It's not just force; it's ideological seduction. Complicates Veto (it's not just suppression, it's conversion).
      *   *Suicide:* The ultimate act of agency that defies categorization. In Igbo law, it's a crime/abomination. To the DC, it's just a plot point. To the reader, it's a tragic refusal to be ruled.
      *   *The DC's Book:* The literal embodiment of Ventriloquist/Veto.

  5.  **Developing the Self-Critique (Crucial Step):**
      *   *Confidence:* High on the failure of Veto, Medium-High on the tension of Ironic Entrapment.
