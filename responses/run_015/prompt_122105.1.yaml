      *   *Nuance:* The Veto Model fails because the culture isn't erased; it's displaced. The Ventriloquist Model works for the DC but fails for Achebe if we acknowledge his linguistic strategy (proverbs, Igbo rhythm in English).
      *   *Philosophical Contribution:* The distinction between *archive* (DC's book) and *experience* (the novel). History as "what happened" vs. History as "what it felt like to be human." The normative density of the *chi*, the land, the ancestors.

