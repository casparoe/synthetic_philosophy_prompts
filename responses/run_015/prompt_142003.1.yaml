prompt: |-
  Posting this here before our school's dumb "community forum" thing on Monday — our school is named after this 19th-century guy who made his money in mills and paid for half the town, and there's a petition going around to rename it, and I volunteered to say something, wich was a mistake, because I started writing it and realized my own views on this stuff are all over the place. Bit of background: I'm in APUSH and we're doing this weird unit at the start on like, how history even gets made, and my friend in the groupchat responds to literally everything with "history is written by the victors" (whoever said it first) as if that settles it. I mostly agree with him but I think he means like four different things by it. So here's my actual position, as best I can write it down: (1) history is written by the victors, in the sense that what even survives to be found — official records, letters, monuments, textbooks, whose diary got kept in an attic instead of thrown out — is shaped by who had the power to produce and preserve stuff, not just by who got to spin the story afterwards; (2) there are still facts about what happened, and some accounts are simply false rather than "another perspective" — people who say the American Civil War had nothing to do with slavery i dont think are offering a rival interpretation, they're just wrong; (3) you basically can't judge people in the past by today's morals, you have to understand them in their own context, and nobody is a simple hero or villain; (4) but "he was a man of his time" is mostly a dodge, it was right to take down the Confederate statues, and I think we should rename the school; (5) every account is written from somewhere, for present reasons, there's no neutral view from nowhere, and the questions we even ask of the past come from what we care about right now; (6) some histories are still better than others — professional historians working from primary sources and not cherry-picking beat a guy with a YouTube channel — and our textbooks today are closer to the truth than the ones my grandparents used, because people went back and corrected them.

  Can someone audit this for me? Which of these actually contradict each other and which only look like they do? I'd guess at least one of the clashes is fake, and I specifically want to know wich one, so please don't just flag every pair as "in tension." Rank the real ones by how bad they are, and for each one say exactly what has to give and what giving it up would cost me — like, would I have to stop saying something in my forum speech, or only admit that one claim was too strong? Then tell me if there's a single revision that cleans up the most. I'm not attached to any one of the six, so don't just tell me to drop whichever one sounds dumbest when I say it out loud.
