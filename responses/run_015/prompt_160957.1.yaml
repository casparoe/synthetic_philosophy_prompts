      **MEMORANDUM**

      **TO:** Board of Visitors
      **FROM:** Collections and Commemoration Committee
      **DATE:** February 14, 2024
      **SUBJECT:** Recommendation Regarding Pell Family Gift Agreement

      **Recommendation**
      The Committee recommends the Board accept the Pell family gift contingent on interpretive independence. We cannot accept the clause requiring perpetual donor approval for interpretive materials. We propose a counter-offer removing this veto power while maintaining the room's physical endowment.

      **Financial and Mission Stakes**
      The $6M offer represents approximately four years of our current financial aid budget. For a college of 1,400 students, this is transformative. However, the gift agreement ties these funds to a specific narrative control mechanism. Accepting the money as written secures aid but compromises the College's academic freedom. Declining the money preserves integrity but forfeits critical student support. The Committee believes we can secure the funds without surrendering our authority to interpret our own history.

      **The Gift Agreement: Clause-by-Clause**
      The current agreement contains two problematic provisions. First, items must display "descriptions affixed at installation." Second, any future interpretive material requires written approval from Pell descendants in perpetuity. Our General Counsel confirms these are enforceable; breach triggers repayment.

      The Pell family's lawyer will argue these clauses ensure the donor's intent is honored permanently. They will posit that the College is accepting a curated package, not a blank check. Our counter-argument must be specific: We accept the physical collection and the endowment for maintenance, but the *interpretation* of historical records is an academic function, not a donor privilege. We propose replacing "written approval from Pell descendants" with "consultation with a joint committee including Pell representatives," with final authority resting with the College Archivist and Faculty Senate. This respects the donors' interest without granting veto power over academic truth. If the family refuses this modification, the Committee recommends declining the gift. We cannot contract away our right to explain our own past to future students.

      **Evaluation of the "Rolling Seal" Proposal**
      Archivist Maren Osei proposed a "rolling seal" where damaging documents are exhibited for twenty years, then sealed for twenty. The strongest argument for this is pedagogical: permanent exposure to traumatic history can produce numbness rather than reckoning. A cohort encountering the admissions ledgers fresh may engage more deeply than one conditioned by their permanent presence.

      However, the Committee recommends against adopting this strategy for this specific gift. First, under the current agreement, removing items violates the "permanent exhibition" clause. Second, and more critically, the student body views this as censorship. In the age of digital transparency, physically hiding documents—even cyclically—invites accusations of institutional cowardice. The "rolling seal" attempts to solve a human psychological problem (numbness) with an institutional mechanism (sealing). While humans need forgetting to live, institutions do not die. They require cumulative legitimacy. Hiding our worst records, even temporarily, undermines the trust required for the College to survive across generations. We must not manage our conscience by cycling visibility.

      **Institutional Memory and the Nietzsche Frame**
      Faculty member Dana Reinholt has framed this debate using Nietzsche's essay on history, arguing we need forgetting to serve life. This frame breaks when applied to a college. A human being dies; an institution persists. The "life" of Halloway College is not biological survival but continued legitimacy. If we forget our exclusion of Black applicants until 1954, we lose the authority to claim inclusivity today.

      Therefore, "history in the service of life" for a college means "history in the service of truth." We do not need forgetting; we need context. The solution is not to seal records but to update their interpretation. We must allow the text on the walls to evolve as our understanding of racism, pacifism, and gender evolves. This is why the donor's "in perpetuity" clause is incompatible with institutional life. We cannot freeze 2024's understanding of 1954's racism forever.

      **Existing Memory Infrastructure**
      The Board should note that the Pell Heritage Room is not our only act of remembering. We have a campus museum, a 2019 Truth and Reclamation report (currently unacted upon), an oral history project, and a required first-year Legacy module launching next fall. The Heritage Room should complement these, not contradict them. If the Room is static while the Legacy module teaches critical inquiry, we create a dissonance that students will exploit. We must ensure the Room's narrative aligns with the broader educational mission. The funds should support the Room, but the narrative must align with the Truth and Reclamation findings.

      **Timeline and Review**
      We propose the following concrete schedule:
      1.  **Negotiation Period (30 Days):** Administration presents the counter-offer to the Pell family legal counsel.
      2.  **Board Vote (March Meeting):** If the family agrees to remove the perpetual veto, the Board accepts the gift. If not, the Board declines.
      3.  **Implementation (Fall 2024):** Room opens with initial interpretive material approved by the joint committee.
      4.  **Review Cycle (Every 5 Years):** A committee comprising faculty, students, and archivists reviews wall text and labels for accuracy and pedagogical effectiveness. Donor representatives may be consulted, but do not hold veto power.

      **Conclusion**
      We can take the money without taking the muzzle. The Committee urges the Board to negotiate for interpretive independence. If the Pell family insists on controlling our history forever, we must walk away. Our integrity is the only endowment that truly lasts.

      \answer{Accept contingent on interpretive independence; no perpetual donor veto}

