prompt: |-
  I've been covering the row over colonial-era restitution claims, and the line I keep getting from officials and from quite a few academics is that a nation is like a family: you inherit the property, so you inherit the debts; descendants can't enjoy the house their great-grandfather's money built and then plead innocence about how the money was made. One MEP told me on the record that this is why guilt travels down the generations rather than dying with the perpetrators. I know Jaspers pushed hard the other way -- criminal and moral guilt are always personal, it's only the political kind that leaves the citizen body liable, and even then as debt to be settled rather than as stain to be worn -- so the family picture looks like it's smuggling the exact thing he was trying to block.

  Can you audit it for me? Give the correspondence table explicitly (what plays the estate, the ancestors, the heirs, the creditors, the act of accepting the inheritance), then the places the mapping breaks -- including whether an heir who can renounce an estate has any equivalent exit from a nation. Separate the disanalogies that actually kill the use it's being put to from the ones that are merely inelegant, and tell me whether the conclusion survives: that living descendants are guilty, or merely that they owe. If there's a better analogy for the political-debt case than the family, name it and say what it costs you.

  Bottom line in the first sentence, then the reasoning -- no preamble, and don't restate the question back at me.
