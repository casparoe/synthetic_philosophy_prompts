answer: |-
  The family analogy is philosophically fatal to the claim that descendants inherit moral guilt, but it sustains the claim that they inherit political liability, provided the framework shifts from sin to unjust enrichment.

  ### Correspondence Table

  | Family/Probate Concept | Political/National Equivalent |
  | :--- | :--- |
  | **The Estate** | National infrastructure, institutions, and accumulated wealth. |
  | **The Ancestors** | Colonial administrators, settlers, and perpetrators of extraction. |
  | **The Heirs** | Current citizenry (beneficiaries of the state). |
  | **The Creditors** | Colonized peoples, descendant communities, or successor states. |
  | **Act of Accepting** | Birth into citizenship, residency, or utilization of public goods. |

  ### Where the Mapping Breaks

  1.  **Volition and Renunciation:** In probate, an heir can formally renounce an inheritance to avoid attached debts; in the nation-state model, renouncing citizenship is costly, often requires acquiring another citizenship first to avoid statelessness, and does not necessarily absolve one of tax liabilities or historical obligations accrued during residency.
  2.  **Nature of the Obligation:** Probate deals with financial debts attached to assets; the colonial claim often conflates financial restitution with moral culpability ("guilt"), which probate law does not transfer.
  3.  **Asset Tracing:** Inheritance involves specific, traceable assets (the house); national wealth is commingled, making it difficult to prove which specific public goods were funded by specific colonial extracts.
  4.  **Identity of Creditors:** Estate creditors are specific legal entities with filed claims; colonial creditors are often diffuse groups or historical entities without direct legal standing in the debtor's domestic probate court.

  ### Disanalogies: Killers vs. Inelegancies

  **Killer Disanalogies (Destroy the MEP's Conclusion):**
  *   **Moral Guilt vs. Political Liability:** This is the critical failure. As Jaspers noted, moral and criminal guilt are non-transferable. The family analogy smuggles moral stain ("guilt travels") into a transaction that should be purely political/financial ("debt travels"). If the analogy holds, it supports *owing*, not *being guilty*.
  *   **Voluntary Acceptance:** Inheritance law relies on the possibility of refusal to justify holding the heir liable upon acceptance. Since citizens cannot easily "renounce" their citizenship or the benefits of state existence without severe penalty, the moral basis for holding them liable via "acceptance" is coerced, not consensual.

  **Merely Inelegantly Disanalogies (Complicate but do not Destroy):**
  *   **Asset Tracing:** While difficult to trace specific colonial loot to specific schools or roads, the macroeconomic link is generally accepted in restitution theory; this makes the calculation hard, not the principle invalid.
  *   **Identity of Creditors:** While diffuse, international law recognizes state-to-state claims and indigenous rights, providing a functional equivalent to creditors even if the probate mechanism isn't identical.

  ### Verdict on the Conclusion

  The conclusion that living descendants are **guilty** does not survive the audit; the conclusion that they **owe** does, but only if reframed. The family analogy supports a duty of restitution based on *unjust enrichment* (benefiting from stolen assets), not based on *culpability* (committing the theft). The MEP's claim that "guilt travels" is a category error that the analogy exposes rather than proves.

  ### Better Analogy: Corporate Successor Liability

  **The Analogy:** When Corporation A merges with or acquires Corporation B, Corporation A inherits Corporation B's liabilities (lawsuits, debts, environmental cleanup) even if Corporation A's current shareholders and managers had no part in the original torts.

  **Why it works:** It captures institutional continuity and liability transfer without implying personal moral sin on the part of the new shareholders (citizens). It separates the entity's obligations from the individual's moral record.

  **The Cost:** It depersonalizes the relationship, reducing the moral urgency of restitution to a balance-sheet adjustment. It risks treating citizens as passive shareholders rather than active political agents, potentially weakening the democratic imperative to repair the harm beyond mere financial settlement.
