answer: |-
  The debate concerning the norm of assertion centres on the epistemic position a speaker must occupy to assert a proposition properly. The **Knowledge Norm of Assertion (KNA)**, most prominently associated with Timothy Williamson, posits that one must assert $p$ only if one knows $p$. This norm is factive; since knowledge entails truth, one cannot properly assert a falsehood. In contrast, the **Justified Belief Norm of Assertion (JBNA)** suggests that assertion is permissible when the speaker holds a justified belief, or asserts on the basis of reasonable evidence, regardless of whether the proposition is ultimately true or constitutes knowledge in the strict sense. The core contrast lies in the KNA's demand for a successful cognitive contact with reality (factivity), whereas the JBNA focuses on the internal rationality and evidential support available to the speaker.

  To evaluate these norms, we may examine the cases of Maya and Leo.

  **Case 1: Maya the Station Announcer**
  Maya asserts that a train will depart from Platform 4 based on the official roster. The roster is generally reliable, providing her with strong justification. However, the roster is mistaken that day due to an administrative error. Coincidentally, late engineering works have moved the service to Platform 4, rendering Maya's assertion true.

  *   **KNA Verdict:** Maya does not know the train is on Platform 4. Her true belief is Gettierised; it is true and justified, but the truth is accidental relative to her evidence. Therefore, under KNA, her assertion is improper. She violates the norm, even if she is not malicious.
  *   **JBNA Verdict:** Maya possesses reasonable evidence (the official roster) and holds a justified belief. Therefore, her assertion is proper.
  *   **Plausibility:** Intuitively, Maya is not blameworthy. She fulfilled her professional duty by consulting the authoritative source. To condemn her assertion as improper seems excessively demanding, as she acted responsibly and the information conveyed was correct. Here, the JBNA yields the more plausible verdict regarding propriety and blame.

  **Case 2: Leo the Junior Doctor**
  Leo asserts that a standard dose of medication is safe after carefully checking the formulary. His evidence is sound according to current protocol. However, a recent safety update rendering the dose unsafe has not yet been disseminated. His assertion is false.

  *   **KNA Verdict:** Leo does not know the dose is safe, as the proposition is false (one cannot know falsehoods). Thus, his assertion violates the KNA. However, KNA proponents often argue that while the assertion is improper, Leo is *excused* from blame because he could not have accessed the new information.
  *   **JBNA Verdict:** Leo has justified belief based on the available formulary. Thus, his assertion is proper and he is not blameworthy.
  *   **Plausibility:** This case creates tension. There is a strong intuition that asserting a falsehood regarding medical safety is inherently problematic, which supports the KNA's claim of impropriety. However, regarding *blameworthiness*, Leo is clearly exonerated; he followed all reasonable procedures. The JBNA captures his blamelessness directly, whereas the KNA must distinguish between violating the norm and being blameworthy for doing so.

  **Comparative Evaluation and Conclusion**
  When assessing which norm yields the more plausible verdict, one must distinguish between *objective propriety* (whether the assertion meets the ideal standard) and *subjective blameworthiness* (whether the speaker is criticisable).

  In Maya's case, the KNA struggles significantly. It classifies a truthful, responsibly sourced assertion as a norm violation. This suggests the KNA is too strict for governing everyday communicative practices, as it penalises speakers for factors outside their epistemic access (the Gettier element). The JBNA aligns perfectly with the intuition that Maya acted correctly.

  In Leo's case, the JBNA appears too permissive by classifying a dangerous falsehood as 'proper'. However, if 'propriety' is understood as 'assertoric justification from the speaker's perspective', the JBNA holds. The KNA better captures the intuition that assertion aims at truth and that asserting falsehoods is a failure, even if an excusable one.

  Do these cases together favour one norm? Collectively, they suggest that the **Justified Belief Norm** is superior for capturing the connection between assertion and **inquiry**, whereas the **Knowledge Norm** better captures the connection between assertion and **truth**. Inquiry is a process of gathering evidence; speakers can only control their justification, not the factivity of their beliefs. Since both Maya and Leo are blameless, a norm that renders them both proper (JBNA) offers a more coherent guide for agents engaged in inquiry. The KNA requires a supplementary theory of 'excuses' to handle these cases, rendering it less parsimonious.

  Therefore, while the KNA rightly highlights that assertion aims at truth (highlighted by the risk in Leo's case), the pair of cases ultimately favours the **Justified Belief Norm** as the more plausible standard for *assertoric propriety* in a social context. It correctly identifies that blameworthiness attaches to the quality of the evidence and the diligence of the speaker, rather than to the metaphysical status of their belief or the luck of the outcome. For the purposes of regulating inquiry and communication, what matters is that speakers act on reasonable evidence, a condition satisfied by both Maya and Leo, and best codified by the JBNA.
