answer: |-
  This is an exceptionally sharp methodological observation. You have identified a gap in the standard Kahneman/Lovallo formulation of the Inside/Outside View distinction: they treat the Outside View as an Archimedean point (objective data) rather than as a social product constructed by agents subject to the same cognitive limitations.

  Neither phenomenon has a single, universally standardized label that captures the precise nuance you are describing, though they sit at the intersection of behavioral economics, epistemology, and the sociology of quantification. Below, I propose precise terminology for each, map them to the nearest existing literature, distinguish them from the "neighbors" you mentioned, and offer a unified framework you can use in your methods section.

  ---

  ### Phenomenon 1: The Contaminated Reference Class
  **Proposed Term:** **Endogenous Baseline Contamination** (or *Constitutive Base Rate Bias*)

  **Definition:**
  Endogenous Baseline Contamination occurs when the statistical distribution used as an "outside view" (the base rate) is an aggregate of outcomes that were themselves generated by agents employing the "inside view" (subjective planning). The bias inherent in the individual planning process does not cancel out in aggregation; rather, it becomes structurally embedded in the outcome distribution. The base rate does not reflect the *true* causal constraints of the task, but the *effective* constraints as mediated by systematic planning errors.

  **Literature & Nearest Neighbors:**
  1.  **The Planning Fallacy (Kahneman & Tversky, 1979):** This is the micro-foundation. Your contribution is identifying the *macro-consequence*: the Planning Fallacy is not just an individual error but a data-generation mechanism.
  2.  **Performativity (MacKenzie, 2006; Callon, 1998):** Specifically *Barnesian Performativity*, where a theory/practice makes reality conform to it. However, standard performativity usually requires the theory to be *known* and *adopted*. Your case is stronger: the distortion exists even if the aggregate base rate is unknown. This is closer to **Reflexivity (Soros, 1987)**, where participant bias affects the fundamentals.
  3.  **Goodhart's Law / Lucas Critique:** You correctly distinguished these. The Lucas Critique concerns policy changes altering structural parameters *after* the model is published. Endogenous Baseline Contamination concerns the structural parameters being biased *before* measurement because the agents' internal models drove the behavior that created the data.
  4.  **Simultaneity Bias (Econometrics):** In a single equation, $Y$ and $X$ determine each other. Here, the "Plan" (Inside View) determines the "Completion Time" (Outcome), and the aggregate of "Completion Times" becomes the "Base Rate."

  **Boundary Conditions & Distinctions:**
  *   **Vs. Self-Fulfilling Prophecy:** A self-fulfilling prophecy requires the *prediction* to be known to the agents (Merton, 1948). In your committee case, the distortion exists even if no student ever sees the departmental completion data. The bias is in the *generation* of the data points, not the *response* to the aggregate.
  *   **Vs. Survivorship Bias:** You noted failures are counted. The issue isn't who is in the sample, but the *values* associated with them.
  *   **Pessimistic Contamination:** Can this push the outside view to be too pessimistic? Yes. If the norm is "dissertations take 7 years," students may pace themselves to fill that time (Parkinson's Law), or the department may structure funding to match that timeline, creating a bottleneck that wouldn't exist if the norm were 4 years. The baseline becomes a *coordination point* for delay.
  *   **The Limit Case:** If *everyone* adopts the Outside View perfectly, the contamination should theoretically decrease, *unless* the Outside View itself is the contaminated baseline. If everyone defers to a biased baseline, the bias is locked in. This suggests the Outside View is not a correction mechanism but a *coordination mechanism*.

  ### Phenomenon 2: The Selection Regress
  **Proposed Term:** **The Reference Class Selection Regress**

  **Definition:**
  The Reference Class Selection Regress describes the epistemic circularity wherein applying the Outside View requires selecting a reference class, but the criteria for selecting that class rely on Inside View judgments about the specific case. The cognitive bias the Outside View is meant to bypass is thus reintroduced at the meta-level of classification.

  **Literature & Nearest Neighbors:**
  1.  **The Reference Class Problem (Reichenbach, 1949; Venn, 1876):** The classic formulation is that any individual event belongs to infinite classes with different frequencies. Your insight adds a *psychological/epistemic* layer: the *choice* among these classes is not algorithmic; it requires human judgment subject to the same biases.
  2.  **The Problem of the Criterion (Chisholm, 1973):** In epistemology, how do we know which beliefs are true without a criterion, and how do we know the criterion is good without checking beliefs? Your regress is a methodological instantiation of this. You need a neutral criterion to pick the class, but you need a neutral judgment to pick the criterion.
  3.  **Epistemic Modesty (Elga, 2007):** This literature discusses deferring to others when you think you might be biased. Your point shows that "deferring to the base rate" is not an escape from judgment, but a shift of judgment from *estimation* to *classification*.

  **Boundary Conditions & Distinctions:**
  *   **Vs. Standard Reference Class Problem:** The standard problem is logical (many classes exist). Your problem is cognitive (the *selection* process is biased).
  *   **Vs. Overfitting:** Overfitting is choosing a class too narrow to fit noise. The Regress explains *why* we overfit: because the Inside View tells us our case is "special" (narrow class) rather than "typical" (broad class).
  *   **Does it bottom out?** It bottoms out only if there is an *exogenous* classification rule (e.g., "all dissertations submitted to this university"). But as you noted, even "all dissertations" may be the wrong class if your method is unique. The regress suggests there is no "view from nowhere"; there are only *wider* or *narrower* views, all requiring judgment.

  ---

  ### Unified Framework: Epistemic Endogeneity

  For your methods section, I recommend framing these two phenomena not as separate errors, but as two dimensions of **Epistemic Endogeneity**.

  *   **Dimension 1 (Data Endogeneity):** The data (base rates) are endogenous to the cognitive processes of the agents who produced them (Endogenous Baseline Contamination).
  *   **Dimension 2 (Classification Endogeneity):** The model specification (reference class) is endogenous to the cognitive processes of the agent applying it (Reference Class Selection Regress).

  **How to write this up (Drafting Suggestion):**

  > "Standard methodological advice distinguishes between the 'inside view' (case-specific narrative) and the 'outside view' (statistical base rates), treating the latter as an objective corrective to the optimism of the former (Kahneman & Lovallo, 1993). However, this distinction relies on two assumptions that do not hold in this context.
  >
  > First, it assumes **Exogenous Baselines**: that the reference class distribution reflects objective constraints rather than the aggregated planning errors of previous agents. In reality, departmental completion times are **Endogenously Contaminated**; they are the product of prior students' inside-view estimates dictating their pacing and resource allocation. The base rate launders individual optimism into structural fact.
  >
  > Second, it assumes **Neutral Classification**: that the researcher can select the appropriate reference class without relying on the very case-specific judgments the outside view is meant to correct. This creates a **Reference Class Selection Regress**, where the decision to categorize a project as 'standard' vs. 'high-risk' reintroduces the inside view at the meta-level.
  >
  > Consequently, this project treats the outside view not as a replacement for judgment, but as a **calibration prior**. I use departmental base rates not as a deterministic timeline, but as a Bayesian prior to be updated by case-specific evidence, explicitly acknowledging that both the prior and the likelihood function are subject to epistemic endogeneity."

  ### Why this distinction matters for your Committee Work

  You asked if these are instances of one underlying problem. They are both instances of **Reflexivity in Social Science Methods**.
  *   **Phenomenon 1** says: The *objects* of our study (students) are like us (planners).
  *   **Phenomenon 2** says: The *tools* of our study (categories) are made by us (judges).

  **Addressing your specific boundary questions:**

  1.  **Can contamination be pessimistic?** Yes. If the departmental culture believes "dissertations take 7 years," advisors may withhold feedback until year 5, or students may not rush to finish because funding lasts 7 years. The "fact" creates the friction.
  2.  **What happens if everyone takes the Outside View?** If everyone defers to the *current* contaminated baseline, the bias stabilizes. If everyone defers to a *corrected* baseline (e.g., "actually, this should take 4 years"), behavior might shift, changing the baseline for the next cohort. This makes the baseline a **moving target** (non-stationary data).
  3.  **Does a case count if no agent knew the base rate?** Yes. This is the crucial distinction from Goodhart's Law. The contamination happens via the *micro-mechanism* of planning (e.g., underestimating IRB delays), not via the *macro-mechanism* of gaming the statistic. The bias is in the *causal chain*, not just the *strategic response*.

  ### Recommended Reading for the Footnotes

  To ground this in existing lit without conceding your point is already named:
  *   **On Phenomenon 1:** Espeland, W. N., & Sauder, M. (2007). *Rankings and Reactivity: How Public Measures Recreate Social Worlds.* (Discusses how measures change behavior, though you are arguing the behavior changes the measure's validity retroactively).
  *   **On Phenomenon 2:** Hájek, A. (2007). *The Reference Class Problem is Your Problem Too.* (Synthese).
  *   **On the Union:** MacKenzie, D. (2006). *An Engine, Not a Camera: How Financial Models Shape Markets.* (Specifically the introduction on performativity vs. constativity).

  **Final Verdict:**
  You are describing **Endogenous Baseline Contamination** and the **Reference Class Selection Regress**. They are distinct but mutually reinforcing components of **Epistemic Endogeneity**. Using these terms will signal to your committee that you understand the statistical advice, have interrogated its ontological foundations, and are applying it with appropriate methodological humility.
