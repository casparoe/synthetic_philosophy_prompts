answer: |-
  Your observation touches on a recognized ethical tension often called the **Boundary Problem of Moral Accounting**. This conceptual issue arises whenever we try to calculate the cost of an action but disagree on where to draw the line around what counts as "our" responsibility. In your example, the tension pulls in opposite directions depending on whether you set a narrow boundary around direct intention or a wide boundary around systemic consequences.

  If you draw a **narrow boundary**, you only count the animals explicitly raised and slaughtered for food. Under this metric, beef looks worse because a single cow represents a large, intentional death, whereas chicken feed casualties are ignored as background noise. If you draw a **wide boundary**, you include every death caused by the production process, such as the mice and birds killed by harvesters planting the chicken feed. Under this metric, chicken might look worse because the industrial crop system creates a vast zone of invisible, collateral death that grass-fed beef might avoid.

  The conceptual conflict here is between **Direct Agency** and **Collateral Damage**. Direct Agency focuses on the moral weight of intentionally killing a specific animal (the cow), which feels heavier to most people. Collateral Damage focuses on the total biological destruction required to sustain a system, regardless of intent (the field mice). The paradox you identified shows that optimizing for one metric often worsens the other; reducing direct farm deaths by switching to grain-fed poultry might increase indirect wild deaths by expanding crop harvests. This makes it impossible to declare one option universally "better" without first deciding which type of harm matters more in your ethical framework.

  This tension reveals that expanding the boundary of moral accounting to include indirect consequences can reverse which option appears ethically superior.
