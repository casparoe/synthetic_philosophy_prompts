answer: |-
  **The Normative Architecture of Price Regulation: Rent Stabilisation and the Minimum Wage**

  The asymmetry you have identified between rent stabilisation and minimum wage regimes is not merely a matter of administrative convenience or political path dependence. It reflects a deeper, often unarticulated, divergence in how the law conceives of the commodity being regulated, the nature of the vulnerability being addressed, and the social function of price itself. To reconstruct the normative logic here, we must move beyond incidence analysis and ask what view of human flourishing and market order renders these specific shapes intelligible.

  **1. Disruption-Sensitivity and the Sunk Costs of Social Life**

  Your hypothesis of 'disruption-sensitivity' is compelling, but it requires refinement to bear the weight of the comparison. It is not simply that paying more forces abandonment; it is that the *cost of abandonment* differs fundamentally between housing and labour.

  In the housing context, the normative core is the protection of *established social investment*. A tenant is not merely consuming shelter; they are embedded in a locale. Over time, they accumulate 'sunk social costs': proximity to work, school placements, care networks, and community ties. Rent stabilisation, particularly with vacancy decontrol, presupposes that the moral claim to protection grows with tenure. The incumbent has built a life *around* this specific price and place. The newcomer has not. Therefore, the regulation protects the *continuity of the relationship* between person and place, not the person's general access to housing. This explains vacancy decontrol: once the link is broken, the specific social investment is lost, and the moral claim to the subsidised price dissolves.

  By contrast, the minimum wage protects the *capacity to participate* in the market at all. The vulnerability here is not the loss of an established position, but the threat of exploitation at the point of entry. A worker needs subsistence immediately, regardless of tenure. The normative claim is based on human dignity and biological necessity, which do not accrue over time. You do not need to have held a job for five years to deserve enough to eat; you need it on day one.

  However, this creates a tension with your observation about youth rates. If the minimum wage is about dignity, why allow lower pay for the young? Here, the logic shifts from *dignity* to *human capital formation*. The youth exemption presupposes that the wage is partly a signal of productivity and partly a subsidy for training. The state permits a lower price to encourage the acquisition of skills, viewing the young worker as an apprentice to the labour market rather than a full participant.

  So, disruption-sensitivity is part of the story, but it is better described as *specific asset dependency*. Housing regulation protects dependency on a *fixed asset* (the home and its location). Labour regulation protects dependency on the *market itself* (the need to sell labour to survive). One protects the *root*, the other protects the *branch*.

  **2. The Portable Cap and the Limits of Individualism**

  You ask why we do not see a 'portable cap', where the tenant carries their discount to the next flat. If the norm is protecting the tenant from disruption, this would seem the coherent extension. Yet, implementing this would fundamentally alter the ethical and economic architecture of the policy.

  A portable cap transforms a *tenancy right* into a *personal subsidy*. Under current stabilisation, the subsidy is implicit: the landlord foregoes market rent in exchange for security of income and reduced turnover costs. The subsidy is attached to the *unit*. If you make it portable, you sever the link between the price control and the maintenance of the specific housing stock.

  Normatively, rent stabilisation is often justified not just by tenant welfare, but by *neighbourhood stability*. The policy aims to prevent the churning of communities, preserving the social fabric of a district. A portable cap would incentivise mobility; tenants would be encouraged to move to capture better value elsewhere. This would defeat the place-based purpose of the regulation. Furthermore, it creates a two-tier market where landlords might discriminate against 'cap-holders' if the administrative burden or rent levels are less attractive than market tenants.

  What breaks if we adopt portability is the conception of housing as a *home* rather than a *consumable good*. A home implies staying put. By tethering the discount to the person, you acknowledge their financial need but abandon the commitment to their spatial continuity. The current regime is underdetermined between 'protecting the poor' and 'protecting the community', but the vacancy decontrol rule suggests the latter is the dominant norm. If it were purely about poverty alleviation, the benefit would follow the person. Because it follows the tenancy, it is about preserving the status quo of occupancy.

  **3. Inconsistent Views of Price?**

  You query whether these regimes rest on inconsistent views of what a price is. Rent stabilisation treats price as a *signal for supply* (hence the new-build exemption) but a *barrier to exclusion* for existing stock. The minimum wage treats price as a *moral floor* for adults but a *signal of productivity* for the young.

  Are these inconsistent? They are only inconsistent if one demands a unitary theory of price. A more robust reconstruction suggests both regimes operate on a theory of *embedded markets*. This view holds that prices are legitimate mechanisms for allocating *marginal* resources, but illegitimate when they threaten *social reproduction*.

  *   **In Housing:** The market is allowed to clear for new supply (new builds) and new allocations (vacancies). This preserves the signal function of price to encourage construction and efficient matching. However, once a social relationship is established (the tenancy), the market is suspended to prevent the price mechanism from destroying the tenant's home.
  *   **In Labour:** The market is allowed to signal skill levels (youth rates) to encourage hiring and training. However, for the core workforce (adults), the price mechanism is suspended to prevent the market from driving wages below subsistence.

  Thus, both regimes share a 'core and periphery' structure. They allow price signals to function at the margins (new builds, new entrants/youth) to maintain dynamism and supply, but they suppress price signals in the core (existing tenancies, adult labour) to maintain stability and dignity. The inconsistency is apparent, not real. Both treat price as a tool that must be switched off when its operation would undermine the social conditions required for the market to function legitimately.

  **4. Underdetermination: What is Essential?**

  Finally, we must distinguish between what the practice strictly needs and what merely sits comfortably with it.

  *   **Strictly Necessary:** The distinction between *marginal* and *intra-marginal* transactions is essential to the logic. Without vacancy decontrol (or some equivalent distinction between new and existing tenancies), rent stabilisation collapses into a supply freeze. Without the adult/youth distinction (or some equivalent training exemption), the minimum wage risks pricing low-productivity workers out of the market entirely. The architecture requires a valve to let market forces operate at the edges, or the system becomes rigid and destructive.
  *   **Contingent:** The specific mechanism of 'vacancy decontrol' versus 'portable caps' is contingent. One could imagine a regime that protected persons rather than places, but it would require a different fiscal structure (state-funded vouchers rather than landlord-funded rent gaps). Similarly, the 'complaint-driven' enforcement of wage laws is not normatively required; one could imagine proactive inspection regimes. These features sit comfortably with the current architecture because they minimise state administrative burden and shift the cost of regulation onto private actors (landlords and employers), but they are not dictated by the core ethical theory.

  **Conclusion**

  The shape of these policies is not accidental. Rent stabilisation protects *incumbency* because housing is a fixed asset around which a life is built; the disruption of moving is the harm to be prevented. The minimum wage protects *personhood* because labour is the means of survival; the harm to be prevented is exploitation and destitution.

  The 'disruption-sensitivity' you identified is the correct intuition, but it applies differently because the assets differ. Housing regulation is conservative in the literal sense: it conserves existing arrangements against market volatility. Labour regulation is foundational: it establishes a baseline below which participation is deemed unethical.

  The new-build exemptions and youth rates are not contradictions; they are the pressure valves that allow these ethical commitments to coexist with a market economy. They acknowledge that while we may suspend the price mechanism to protect the vulnerable, we cannot abolish it entirely without destroying the incentive to produce the very goods and jobs the vulnerable need. The architecture holds because it distinguishes between the *allocation of new resources* (where price signals rule) and the *protection of established lives* (where moral claims rule). To make the regimes more 'coherent' by aligning them perfectly (e.g., portable rent caps or tenure-based minimum wages) would likely undermine the specific social goods each is designed to secure: community stability in the first case, and universal subsistence in the second.
