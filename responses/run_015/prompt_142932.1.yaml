prompt: |-
  I am a PhD student in philosophy — my dissertation concerns the distinction between reasons that bear on whether an attitude fits its object and reasons that bear only on the value of being in that attitude — and for the past two years I have served as the graduate member and, informally, the minute-writer of my university's Research Integrity Review Panel. I would like a decision procedure the panel could actually run, written so that people who have never encountered that distinction can apply it correctly.

  The setting: the panel has eight seats — two senior scientists from different departments, a statistician, a research-compliance officer, a non-voting attorney from the Office of General Counsel, a rotating faculty member, me, and a chair who is an associate dean. We meet monthly for ninety minutes and handle ten to fifteen matters a year. We have no power to compel raw data or to interview unwilling parties; the statistician is the only member who can competently read the analyses in front of us; and the attorney screens every sentence for defamation exposure, so we cannot say anything we could not defend. Our output is a two-page recommendation to the Vice Provost for Research, who signs off on nearly all of them. The options in front of us are: close the matter with no public action, request materials from the authors, place a note on the publication record, recommend retraction, or refer the matter to the federal research-integrity office. The stakes run from a postdoc's career to a center's funding to the credibility of the institution's record.

  My sense is that the panel's real question is an attitude question in administrative costume: do we have a reason of the right kind to reduce confidence in this finding? Most of what actually moves the panel is not of that kind — it is the trouble a complainant can make, the existence of press coverage, the funder's mood, the size of the citing literature, the career damage a note would do to a junior author, the desire to be seen as responsive. Some of those are perfectly good reasons to do something. None of them, as far as I can tell, is a reason to doubt the finding, and the panel slides between the two constantly. I want a procedure that stops the slide.

  Please give me the following.

  An ordered set of questions, each with an account of what counts as a sufficient answer, including where the procedure stops with a no and where it hands the decision to a vote because the question is one of values rather than facts. It must be runnable inside a ninety-minute meeting, by the eight people described, and it must generate the two-page record as a by-product rather than as extra work.

  The procedure has to preserve a set of distinctions I keep watching the panel collapse. First, the basic one: considerations that bear on whether the finding is reliable, versus considerations that bear on what it costs or gains the panel, the institution, or the authors for us to be in a state of doubt. Second, reasons to investigate versus reasons to doubt: most of what reaches us justifies the first and is then treated as though it justified the second, and I want that gap to be explicit and thresholded. Third, the asymmetry of verdicts: our not finding evidence of fabrication, and the authors' answering our questions cooperatively, are not reasons for confidence, and the procedure must not let a written record imply that they are. Fourth, the stakes question, which I want flagged rather than settled: a finding that underwrites a clinical guideline, or that has hundreds of citing papers, raises the cost of being wrong — say whether that lowers the bar for reducing confidence, what the procedure assumes, and what would change under the view that it does not. Then the mirror image, which is the panel's most common failure: the damage that flagging would do to a junior author is not a reason for confidence either, and I want that as its own check rather than a footnote. Fifth, source-relative reasons: an allegation from a former lab member in a bitter dispute, or from an anonymous dossier since picked up by a science news outlet — distinguish what the complainant's motives do to the reliability of their testimony from what the trouble they can cause, or the coverage they have generated, does to us.

  Two further wrinkles that I have not seen handled anywhere and that I think matter more than the tidy cases. The first is what I have started calling laundered reasons: considerations that exist only because the panel or another body previously acted on reasons of the wrong kind, and which return to us later disguised as reasons of the right kind. A flag issued two years ago mainly to placate a large foundation now appears in a General Counsel memo as part of a documented pattern. The procedure must say whether such a consideration has any weight, and if it has none, what the panel is obliged to do when it shows up in a new file — including whether it owes a written correction of its own prior action. The second is that a committee is arguably not the kind of thing that has attitudes at all, and its output is a public statement that will function as evidence for readers who were not in the room. So the procedure should say whether it is trying to bring the panel to the fitting attitude, or to give readers a reason of the right kind to revise theirs, or both — and what breaks if it is the second, since a statement aimed at other people's attitudes makes almost every consideration look like a state-given one from our side.

  Please also mark, at each step, which parts are genuine procedure and which are judgment calls dressed up as procedure, and close by saying what the procedure cannot do: the questions it cannot answer, the cases it will systematically mishandle, and the points at which my distinction simply runs out.

  Then run it on three files.

  One: an anonymous dossier alleging image manipulation in a paper from six years ago. A forensic image review came back inconclusive; the authors produced part of the raw data and said the rest was lost in a lab move; the field is polarized; the dossier's author is identifiable as a former lab member with a documented grievance; a science news outlet has written about the allegations twice; and the chair wants a note on the record to show we responded.

  Two: an undisputed analytical error in a paper whose central result underwrites a clinical guideline. The statistician says the claim does not follow from the analysis anyone could run; the senior authors concede the error but say the conclusion survives; the error was found by a graduate student in the lab who is about to go on the job market and has asked not to be named; and the compliance officer notes that a note on the record would trigger a funder review of the entire center.

  Three: the laundering case. A new allegation against a lab the panel flagged two years ago, on a file I now think was driven almost entirely by reasons of the wrong kind and for which I drafted the minutes. The new file's summary cites our own earlier flag as corroboration. Run the procedure honestly and tell me what it commits us to, including whether it commits us to stating in writing that the earlier flag carried no evidential weight. If it does, say so plainly; that is an answer I will not like, and I would rather have it from the procedure than discover it myself in the meeting.

  I know the philosophical literature on this; I do not need citations, references, or a reading list, and the attorney will not read them anyway. What I need is something eight people with different training can run in a room in ninety minutes. Please write in American English, roughly 1,200 to 1,600 words, in a form I could circulate to the panel with only the identifying details changed.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (dissertation on reason distinctions: object-given vs. state-given reasons for attitudes).
      *   **Role:** Graduate member & informal minute-writer of university's Research Integrity Review Panel (RIRP).
      *   **Task:** Create a decision procedure for the panel to distinguish between reasons bearing on the *fit* of an attitude (confidence in findings) vs. reasons bearing on the *value* of having that attitude (consequences of doubt/action).
      *   **Constraints:**
          *   Runnable in 90 mins by 8 diverse members (scientists, statistician, compliance, attorney, etc.).
          *   Generates the 2-page recommendation as a by-product.
          *   Must preserve specific distinctions (reliability vs. cost, investigate vs. doubt, asymmetry of verdicts, stakes, source-relative reasons, laundered reasons, committee attitude vs. public statement).
          *   Must mark what is procedure vs. judgment call.
          *   Must state limitations (what it cannot do).
          *   Must apply to three specific case studies (Anonymous dossier/Image manipulation, Analytical error/Clinical guideline, Laundering case).
          *   Tone: American English, 1,200-1,600 words, circulate-ready (no philosophical jargon/citations).
          *   No citations/references/reading list.

  2.  **Deconstruct the Philosophical Core:**
      *   The core distinction is Object-Given Reasons (OGR) vs. State-Given Reasons (SGR) applied to administrative confidence.
      *   OGR: Evidence regarding the truth/reliability of the finding (data, methods, analysis).
      *   SGR: Consequences of holding the attitude (career damage, funding loss, public pressure, legal risk).
      *   The panel conflates these. The procedure must force separation.
      *   Additional nuance: "Laundered reasons" (past SGRs becoming present pseudo-OGRs), Committee Attitude vs. Public Statement.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Needs to be step-by-step.
      *   Needs stop conditions.
      *   Needs to produce the text for the recommendation letter.
      *   *Step 1: Threshold for Investigation.* (Is there enough OGR to look?)
      *   *Step 2: Assessment of Reliability (OGR).* (What does the evidence say?)
      *   *Step 3: Assessment of Consequences (SGR).* (What happens if we act?)
      *   *Step 4: Laundering Check.* (Is past history being misused?)
      *   *Step 5: Decision & Wording.* (Matching action to findings.)

  4.  **Addressing Specific Constraints:**
      *   *Distinctions:* Reliability vs. Cost, Investigate vs. Doubt, Asymmetry (no evidence $\neq$ evidence of no), Stakes (does high stakes lower the bar?), Source Motives vs. Trouble Potential.
      *   *Laundering:* Must address the weight of prior flags driven by SGRs.
      *   *Attitude:* Committee vs. Public. The procedure should aim for the Committee to hold the fitting attitude, but acknowledge the output functions as evidence for others.
      *   *Limitations:* Must explicitly state where the procedure fails.
      *   *Case Studies:* Apply the procedure to the three scenarios provided.

  5.  **Drafting - Section by Section:**

      *   **Title:** Needs to be administrative but precise. "Protocol for Distinguishing Evidential and Practical Considerations in Research Integrity Reviews."
      *   **Introduction:** Brief context (without philosophy jargon).
      *   **The Procedure (Steps 1-5):**
          *   *Step 1 (Admissibility):* Separate "reason to investigate" from "reason to doubt."
          *   *Step 2 (Evidential Weight):* Focus *only* on data/methods. Exclude consequences here.
          *   *Step 3 (The Laundering Check):* Specific check on prior flags.
          *   *Step 4 (Practical Weight):* Focus *only* on consequences (careers, funding, press).
          *   *Step 5 (Synthesis & Wording):* How to combine them without conflating them.
      *   **Limitations:** Where does this break? (e.g., when evidence is inaccessible, when legal threats override).
      *   **Case Applications:** Run the three scenarios through the steps.

  6.  **Refining the Tone and Length:**
      *   Avoid terms like "object-given" or "state-given." Use "Evidence of Reliability" vs. "Consequences of Action."
      *   Keep it tight. 1,200-1,600 words is tight for all this content. I need to be concise.
      *   Ensure the "Procedure vs. Judgment Call" markers are clear.
      *   Ensure the Case Studies are integrated or appended clearly. The prompt asks to "run it on three files," implying I should demonstrate the application. I will append the applications as a demonstration section to keep the procedure clean.

  7.  **Addressing the "Laundering" Constraint:**
      *   This is crucial. If a prior flag was SGR-driven, it cannot count as OGR now. The procedure must commit to stating this if true. This is the "answer I will not like" part. I need to be honest in the simulation.

  8.  **Addressing the "Attitude" Constraint:**
      *   Committee vs. Public. The procedure should aim for internal coherence first, but acknowledge the public function. If the public needs a reason, we can't give them a false OGR.

  9.  **Word Count Management:**
      *   Intro: 150 words.
      *   Procedure Steps: 600 words.
      *   Limitations: 200 words.
      *   Case Studies: 600 words.
      *   Total: ~1550 words.

  10. **Review against Constraints:**
      *   90 mins? Yes, steps are sequential.
      *   8 people? Yes, roles assigned (Statistical, Legal, etc.).
      *   Two-page record by-product? Yes, step 5 generates the text.
      *   Distinctions preserved? Yes, separated into Step 2 and Step 4.
      *   Laundering addressed? Yes, Step 3.
      *   Case studies run? Yes.
      *   No philosophy jargon? Yes, translate to admin speak.

  11. **Drafting - Iteration 1 (Mental Check):**
      *   Make sure the "Stakes" question is handled. Does high stakes lower the bar for doubt? The procedure should flag this as a judgment call, not a rule.
      *   Make sure the "Junior Author" constraint is handled. Damage to them is SGR, not OGR.
      *   Make sure the "Attorney" constraint is handled. Defamation risk is SGR.

  12. **Drafting - Iteration 2 (Writing):**
      *   *Self-Correction on Case Studies:* The prompt asks me to "run it on three files." I should present the procedure first, then show the application.
      *   *Self-Correction on Laundering:* The prompt says "If it does, say so plainly." I need to be explicit in the Case 3 analysis.
      *   *Self-Correction on Tone:* Needs to be formal enough for the Dean but precise enough for the Philosopher.

  13. **Final Polish:** Check word count and ensure all specific philosophical constraints (asymmetry, laundering, attitude) are met without using the jargon.

  *(Self-Correction during drafting)*: I need to make sure I don't exceed 1,600 words. I will keep the procedure tight and the case studies concise. I will use bolding for the "Procedure vs. Judgment" markers.

  *(Refining the Laundering Case)*: The prompt says "I now think was driven almost entirely by reasons of the wrong kind." The procedure must force the panel to admit this if they follow it. I will ensure the output reflects that commitment.

  *(Refining the Attitude Question)*: The prompt asks whether the procedure aims for the panel's attitude or the readers'. I will specify that the panel must hold the fitting attitude, but the *recommendation* may act on practical reasons provided the evidential basis is clear.

  Let's write.

  *Word Count Check:*
  Intro: 100
  Procedure: 700
  Limitations: 200
  Cases: 500
  Total: 1500 approx.

  *Wait, one more check:* "Mark, at each step, which parts are genuine procedure and which are judgment calls dressed up as procedure." I need to explicitly label this.

  *Okay, ready to generate.*
answer: |-
  **PROTOCOL FOR RESEARCH INTEGRITY REVIEW: EVIDENTIAL AND PRACTICAL SEPARATION**

  **Purpose:** To ensure panel recommendations distinguish between evidence regarding the reliability of research findings and considerations regarding the consequences of panel action. This protocol generates the text for the Vice Provost's recommendation as a by-product of the review.

  **Step 1: Admissibility and Threshold (15 Minutes)**
  *Question:* Does the allegation provide a specific, testable claim regarding data or method?
  *Procedure:* If **No**, close the matter. Record reason as "No specific evidential claim." If **Yes**, proceed.
  *Judgment Call:* Determining specificity. A vague claim of "sloppiness" is insufficient; a claim of "duplicated panel in Figure 3" is sufficient.
  *Constraint:* Do not consider the complainant's identity, potential for trouble, or press coverage here. These are reasons to manage risk, not reasons to investigate truth.
  *Output Text:* "The Panel reviewed an allegation concerning [specific claim]."

  **Step 2: Evidential Assessment (30 Minutes)**
  *Question:* What is the status of the finding based *only* on available data, analysis, and expert review?
  *Procedure:* The statistician and senior scientists lead. All other members observe.
  *   **Positive Evidence of Error:** Documented analysis failure, unavailable raw data where required, confirmed manipulation.
  *   **Negative Evidence of Error:** Analysis holds, data produced and verified.
  *   **Inconclusive:** Data unavailable but loss explained plausibly; analysis complex with competing expert views.
  *Constraint:* **Asymmetry Rule.** The absence of evidence for fabrication is not evidence of integrity. Do not write "The authors were cooperative" as a reason for confidence. Write "No evidence of fabrication was identified."
  *Constraint:* **Stakes Flag.** If the finding underwrites clinical guidelines or major policy, note: "High stakes increase the cost of false confidence." This does not lower the evidential bar, but it flags the risk of inaction.
  *Output Text:* "The Panel found [positive/negative/inconclusive] evidence regarding the reliability of [specific finding]."

  **Step 3: The Laundering Check (10 Minutes)**
  *Question:* Does this file rely on prior panel actions or flags as evidence of current unreliability?
  *Procedure:* Review minutes of prior actions cited in the current summary.
  *   If the prior action was driven primarily by practical concerns (press, funding pressure) rather than evidential findings, **the prior action carries zero evidential weight.**
  *   **Obligation:** If the current recommendation relies on distinguishing this case from a prior flag, the minutes must state: "The prior flag is not treated as evidential corroboration."
  *Judgment Call:* Determining the driver of the prior action. Review past minutes for language regarding "responsiveness" or "risk management" vs. "data verification."
  *Output Text:* If applicable: "Prior administrative actions regarding this lab are not treated as evidence of current reliability."

  **Step 4: Practical Assessment (20 Minutes)**
  *Question:* What are the consequences of reducing confidence vs. maintaining confidence?
  *Procedure:* Compliance officer, attorney, and chair lead.
  *   **Reasons to Act (Practical):** Funder requirements, legal risk, public trust, career damage to junior authors, institutional reputation.
  *   **Constraint:** These are **not** reasons to doubt the finding. They are reasons to manage the outcome.
  *   **Junior Author Check:** Explicitly note if action harms a junior researcher. This is a cost to be weighed, not a reason to exonerate.
  *Judgment Call:* Weighing institutional risk against scientific integrity. There is no formula.
  *Output Text:* "The Panel considered the impact of this recommendation on [funding/personnel/public trust]."

  **Step 5: Synthesis and Recommendation (15 Minutes)**
  *Question:* What action matches the Evidential Assessment, adjusted by Practical Assessment?
  *Procedure:* Vote on action options.
  *   **Close:** Evidential assessment is negative or inconclusive; practical risks of action outweigh benefits.
  *   **Note/Retraction:** Evidential assessment is positive; practical risks do not preclude action.
  *   **Refer:** Evidential assessment is positive and severe; beyond panel scope.
  *Constraint:* **Attitude Distinction.** The Panel must hold the attitude fitting the evidence. The Recommendation may act on practical reasons, but the text must not conflate them.
  *Output Text:* Combine Step 2 and Step 4 outputs. Do not use practical reasons to justify evidential claims.

  **LIMITATIONS**
  This procedure cannot compel raw data or testimony. It cannot resolve cases where evidence is inaccessible but suspicion remains high (the "Inconclusive" trap). It cannot prevent the Vice Provost from overriding the recommendation for practical reasons. It fails when legal counsel advises silence that contradicts evidential findings; in such cases, the minutes must record "Recommendation withheld on legal advice," not "No evidence found." Finally, the procedure assumes the Panel is capable of holding an attitude distinct from its public output; if the Panel acts solely as a public relations body, Step 2 becomes ceremonial.

  ***

  **APPLICATION TO CURRENT FILES**

  **File 1: Anonymous Dossier (Image Manipulation)**
  *   **Step 1:** Specific claim exists (image manipulation). Admissible.
  *   **Step 2:** Forensic review inconclusive; raw data partially lost. **Status: Inconclusive.** Asymmetry Rule applies: Authors producing *some* data is not evidence of integrity.
  *   **Step 3:** No prior flags cited.
  *   **Step 4:** Press coverage exists (practical risk). Chair wants note to show responsiveness (practical reason). Complainant has grievance (source motive affects testimony reliability, not truth of claim).
  *   **Step 5:** Evidential basis for doubt is weak (inconclusive). Practical basis for note is high (press).
  *   **Commitment:** The Panel cannot recommend a note implying unreliability. It may recommend a note stating "Review conducted; no conclusive evidence found," but must not imply the finding is suspect.
  *   **Verdict:** Close with no public action, or issue neutral note clarifying review occurred. Do not flag the paper.

  **File 2: Analytical Error (Clinical Guideline)**
  *   **Step 1:** Undisputed error. Admissible.
  *   **Step 2:** Statistician confirms claim does not follow. **Status: Positive Evidence of Error.** Authors concede error but claim conclusion survives. This is a new claim requiring verification.
  *   **Step 3:** No prior flags.
  *   **Step 4:** High stakes (clinical guideline). Junior author career risk (job market). Funder review risk (center funding).
  *   **Step 5:** Evidential basis for doubt is strong (error conceded). Practical costs of action are high (funding, careers).
  *   **Commitment:** High stakes lower the tolerance for error, not the bar for evidence. The error is proven. The survival of the conclusion is unproven.
  *   **Verdict:** Recommend Note on Publication Record. The note must state the error exists and the validity of the conclusion is currently unsupported. Protecting the junior author is a practical good, but cannot override the evidential fact of the error. The funder review is a consequence, not a reason to hide the error.

  **File 3: The Laundering Case**
  *   **Step 1:** New allegation. Admissible.
  *   **Step 2:** Assess new evidence on merits.
  *   **Step 3:** **Critical Check.** The file cites the Panel's flag from two years ago as corroboration.
      *   *Review of Prior Minutes:* You drafted them. They show the prior flag was driven by foundation pressure (Practical), not evidential findings (Evidential).
      *   *Procedure Requirement:* The prior flag carries **zero evidential weight**.
      *   *Obligation:* The Panel must state in writing that the earlier flag is not treated as evidence.
  *   **Step 4:** Practical risk of admitting prior error (institutional credibility).
  *   **Step 5:** If the new evidence is weak, the prior flag cannot bolster it.
  *   **Commitment:** **Yes.** The procedure commits you to stating in writing that the earlier flag carried no evidential weight. To do otherwise is to launder a practical reason into an evidential one.
  *   **Verdict:** If new evidence is weak, close the matter. The recommendation letter must include: "The Panel's prior administrative action regarding this lab is not considered evidence of current misconduct." This will be uncomfortable. It is required.

  **FINAL NOTE ON COMMITTEE ATTITUDE**
  This procedure aims to bring the Panel to the fitting attitude (Step 2) before drafting the public statement (Step 5). If the Panel aims only to give readers reasons to revise their attitudes, every consideration becomes practical (e.g., "readers should doubt this because it looks bad"). This collapses the distinction. The Panel must hold the evidential attitude internally, even if the public recommendation is moderated by practical constraints. If the legal counsel forbids stating the evidential attitude, the minutes must record the suppression, not a false consensus.
