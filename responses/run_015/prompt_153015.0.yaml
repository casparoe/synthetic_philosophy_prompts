answer: |-
  Below is a specification of the desiderata for a normative theory of rational belief and action capable of handling both classic and distributed Pascal's Mugging scenarios. These criteria are organized by their functional domain (Formal, Epistemic, Pragmatic/Social) and flagged according to their theoretical status.

  ### I. Desiderata for Rationality Under Mugging Conditions

  #### A. Formal Consistency Constraints
  *These are non-negotiable constraints on theoretical adequacy. A theory violating these is mathematically incoherent or self-defeating.*

  **1. Aggregation Stability (The Distributed Immunity Constraint)**
  *   **Requirement:** The theory must prevent the summation of arbitrarily many low-credence, high-stakes claims from compelling total resource exhaustion.
  *   **Motivating Case:** *Distributed Epistemic Mugging.* If an agent faces 1,000 independent sources each claiming a $10^{100}$ utility payoff with probability $10^{-50}$, a linear Expected Utility (EU) maximizer must allocate all resources to these claims collectively, even if each is individually negligible.
  *   **Distinction Preserved:** Between *individual claim evaluation* and *portfolio risk allocation*. The theory must recognize that a portfolio of "lottery tickets" does not become a certainty simply by virtue of volume.
  *   **Status:** **Non-negotiable.** Without this, the agent is computationally paralyzed or bankrupted by noise.

  **2. Diachronic Consistency (No Dynamic Dutch Books)**
  *   **Requirement:** The agent's policy for handling low-probability claims must not allow a sequence of trades or belief revisions that guarantees a loss relative to their starting state.
  *   **Motivating Case:** *Classic Single-Shot vs. Repeated Mugging.* If an agent rejects a mugger today but updates their priors such that they must accept a similar mugger tomorrow, they are vulnerable to exploitation over time.
  *   **Distinction Preserved:** Between *static rationality* (one-off decision) and *dynamic rationality* (policy over time).
  *   **Status:** **Non-negotiable.** Violation implies the theory is not a stable guide for action.

  #### B. Epistemic Integrity Constraints
  *These criteria govern the relationship between evidence, belief, and truth. They are often contested between evidentialists and pragmatists.*

  **3. Evidential Proportionality (The Clifford Constraint)**
  *   **Requirement:** The degree of doxastic commitment (credence) must scale with the quality of evidence, independent of the stakes involved.
  *   **Motivating Case:** *Manufactured Uncertainty.* A bad actor generates complex, unfalsifiable models predicting doom to lower the perceived probability of safety. The theory must not allow the *stakes* of the doom to inflate the *credence* in the model without new evidence.
  *   **Distinction Preserved:** Between *evidential warrant* (is it true?) and *pragmatic value* (does it matter?).
  *   **Status:** **Contested (Evidentialist).** Pragmatists may argue that high stakes *should* influence credence thresholds for action, even if not belief *simpliciter*.

  **4. The Rejection/Discounting Distinction**
  *   **Requirement:** The theory must distinguish between assigning a claim probability zero (rejection) and assigning it non-zero probability but zero/negligible decision-weight (discounting).
  *   **Motivating Case:** *Existential Risk vs. Mugging.* An asteroid impact has low probability but high stakes. We must not *reject* the claim (probability = 0), or we fail to prepare. But we must *discount* the Pascal Mugger.
  *   **Distinction Preserved:** Between *ontological dismissal* and *decision-theoretic truncation*.
  *   **Status:** **Non-negotiable.** Collapsing these leads to dogmatism (ignoring real risks) or gullibility (accepting muggings).

  #### C. Pragmatic and Social Viability Constraints
  *These criteria concern the implementation of the theory in bounded agents and social ecosystems.*

  **5. Existential Tail Sensitivity**
  *   **Requirement:** The theory must retain the capacity to trigger high-cost preventive action for genuine low-probability, high-impact risks (e.g., pandemics, asteroid defense).
  *   **Motivating Case:** *Genuine Existential Risk.* If a theory solves the Mugging problem by capping all low-probability utilities, it may fail to avert actual catastrophes.
  *   **Distinction Preserved:** Between *manipulative high-stakes* (mugging) and *structural high-stakes* (physics/biology).
  *   **Status:** **Non-negotiable.** A theory of rationality that guarantees extinction via indifference is pragmatically self-defeating.

  **6. Bounded Implementability**
  *   **Requirement:** The cognitive cost of evaluating whether a claim is a "mugging" must not exceed the expected value of the decision itself.
  *   **Motivating Case:** *Resource-Bounded Rationality.* If distinguishing a mugger from a genuine savior requires a super-intelligence to verify the claim, human agents cannot use the theory.
  *   **Distinction Preserved:** Between *ideal rationality* (god's eye view) and *ecological rationality* (human constraints).
  *   **Status:** **Non-negotiable.** An unimplementable theory is not a normative guide for humans.

  **7. Social Cost Minimization (False Positive Penalty)**
  *   **Requirement:** The theory must account for the externalities of widespread false-positive acceptance (e.g., panic, resource diversion from proven needs).
  *   **Motivating Case:** *Distributed Ecosystem.* In a "Distributed Mugging" environment, if every agent responds to every low-prob claim, the social system collapses under the weight of phantom emergencies.
  *   **Distinction Preserved:** Between *individual allocation costs* and *collective allocation costs*.
  *   **Status:** **Contested (Consequentialist/Pragmatist).** Strict individualists may argue social costs are external to individual rationality; systemic theorists argue they are internal constraints.

  ---

  ### II. Impossibility Results and Trade-offs

  There is a fundamental tension between **Desideratum 1 (Aggregation Stability)** and **Desideratum 5 (Existential Tail Sensitivity)**. This generates a theoretical impossibility result for any framework relying on linear Expected Utility Maximization with unbounded utility functions.

  **The Tail Sensitivity Trilemma:**
  Any adequate theory must violate at least one of the following three intuitive principles:
  1.  **Linearity:** Expected Value is calculated as $P \times U$.
  2.  **Unbounded Utility:** There is no upper limit to the value of an outcome (e.g., saving $N$ lives is always better than $N-1$).
  3.  **Mugging Immunity:** Agents are not compelled to pay finite costs for arbitrarily small probabilities of arbitrarily large payoffs.

  *   **If you keep Linearity and Unbounded Utility:** You succumb to Pascal's Mugging (violates Immunity).
  *   **If you keep Linearity and Immunity:** You must bound Utility (e.g., via a cap). This risks violating **Tail Sensitivity** if the cap is lower than the value of human extinction, or violating **Evidential Proportionality** by arbitrarily truncating value.
  *   **If you keep Unbounded Utility and Immunity:** You must reject Linearity (e.g., via probability discounting or risk-weighted expected utility). This risks violating **Diachronic Consistency** (opening the agent to Dutch Books) or **Bounded Implementability** (complex calculation of discount functions).

  **Implication for the Project:**
  There is no "clean" solution. A successful theory must explicitly locate where it breaks intuitive continuity. It must admit a "zone of indeterminacy" where rational agents are permitted (or required) to ignore positive expected value claims because the *reliability* of the probability estimate is below a meta-cognitive threshold. This shifts the burden from *calculating probabilities* to *evaluating the reliability of the probability generator* (the source).

  ---

  ### III. Framework Evaluation

  Here is how three major frameworks fare against the desiderata, highlighting their specific failure points.

  **1. Bayesian Threshold View (Credence Truncation)**
  *   *Mechanism:* Assign probability 0 to any claim below a credence threshold $\epsilon$.
  *   *Performance:* Satisfies **Aggregation Stability** and **Bounded Implementability**.
  *   *Failure:* Violates **Existential Tail Sensitivity** and **The Rejection/Discounting Distinction**. By setting $P=0$, it treats genuine existential risks (asteroids) identically to muggings. It also violates **Diachronic Consistency** if evidence slowly accumulates across the threshold without triggering action until a discontinuous jump occurs.
  *   *Verdict:* Too blunt for high-stakes environments.

  **2. Robust Evidentialist Rejection (Cliffordian)**
  *   *Mechanism:* Belief is prohibited unless evidence meets a high standard proportional to the "strangeness" of the claim.
  *   *Performance:* Satisfies **Evidential Proportionality** and **Social Cost Minimization** (prevents panic).
  *   *Failure:* Violates **Existential Tail Sensitivity**. By demanding high evidence for high-stakes claims, it creates a "precautionary paralysis." If evidence for a novel existential risk is inherently scarce (by definition of it being novel/low-prob), this framework forbids preventive action. It struggles with **Distributed Mugging** because it evaluates claims in isolation, not as a cumulative resource drain.
  *   *Verdict:* Epistemically safe, pragmatically dangerous.

  **3. Pragmatic Decision-Theoretic Framework (Bounded Utility/Risk-Weighting)**
  *   *Mechanism:* Modify the utility function (cap it) or the probability weighting (discount tails) to ensure convergence.
  *   *Performance:* Satisfies **Aggregation Stability**, **Existential Tail Sensitivity** (if calibrated correctly), and **Diachronic Consistency** (if done via consistent risk-weights).
  *   *Failure:* Violates **Evidential Proportionality** (Contested). It decouples action from truth-tracking; an agent acts *as if* the risk is small even if they believe it is real. It also faces **Bounded Implementability** challenges in determining *where* to set the utility cap or discount curve without arbitrariness.
  *   *Verdict:* The most viable for action, but requires accepting that rational action diverges from pure truth-tracking.

  ### Summary
  The "Distributed Epistemic Mugging" reveals that the core problem is not merely mathematical (infinite utility) but ecological (resource competition among claims). An adequate theory cannot rely solely on internal probability calculus; it must incorporate meta-epistemic constraints on *source reliability* and *systemic capacity*. The impossibility result suggests that rationality in this domain is not about finding the correct answer, but about managing the *risk of error* in the estimation process itself.
