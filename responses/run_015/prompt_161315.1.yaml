answer: |-
  ### 1. The Exam Question

  **Question 3: Agency, Time, and Judgment (20 Marks)**

  Consider two agents, Mira and Sam. Both plan at 9:00 AM to work on a dissertation chapter rather than go to the pub at 4:00 PM.

  *   **Mira** is a hyperbolic discounter. At 9:00 AM, she ranks working above the pub. By 4:00 PM, she reverses this ranking. She goes to the pub and, at 4:00 PM, sincerely asserts that the pub is the better option *now*.
  *   **Sam** is time-consistent (exponential). He never reverses his ranking. At 4:00 PM, he still ranks working above the pub. However, he goes to the pub anyway, sincerely asserting at 4:00 PM, "I know I should be writing, but I'm going anyway."

  Write an essay addressing the following three points. Your answer must not exceed **900 words**.

  1.  **Weakness of Will:** Which agent, if either, exhibits genuine weakness of will (akrasia)? Justify your answer by specifying *whose* judgment and *at what time* the action is supposed to contradict.
  2.  **The Relocation Test:** Imagine Mira's decision scenario is shifted entirely one week later (the same 9:00 AM to 4:00 PM structure applies next Tuesday). Mira's preferences flip again at 4:00 PM. Does this instability under time-shifting show that her 4:00 PM preference is not truly *hers*, or does it merely show she has time-indexed preferences? Explain how this impacts your verdict on her agency.
  3.  **Sophistication:** Suppose Mira is "sophisticated"—she perfectly anticipates her 4:00 PM reversal at 9:00 AM. Does this sophistication resolve the problem? Explain whether a sophisticated agent is necessarily better off than a naive one, and what this implies for the possibility of precommitment.

  ***

  ### 2. Model Answer (A-Grade Standard)

  **Word Count: 785**

  The standard story equates weakness of will with preference reversal: I plan to diet, but when the cake arrives, I want the cake more. If this were true, Mira would be the paradigmatic akratic agent. However, this definition conflates changing one's mind with acting against one's judgment. A more rigorous account requires conflict at the time of action. On this view, Sam is the clearer case of weakness of will, while Mira represents a different failure of diachronic coherence.

  To see why, we must specify whose judgment matters. If akrasia is acting against one's better judgment, that judgment must be held *at the time of action*. At 4:00 PM, Mira judges that the pub is better than work. She acts in accordance with her contemporaneous all-things-considered judgment. There is no conflict between her evaluation and her choice, only a discrepancy between her past and present selves. To call this weakness of will is to privilege the 9:00 AM self over the 4:00 PM self without justification. Sam, conversely, judges at 4:00 PM that work is better but chooses the pub. He acts against his contemporaneous judgment. Therefore, if weakness of will requires acting against what one currently believes one ought to do, Sam is the weak-willed agent, not Mira.

  This distinction is stress-tested by the Relocation Test. If we slide Mira's decision window to next week, her preferences flip again at 4:00 PM. Her 4:00 PM preference is unstable under pure time-shifting. Does this instability invalidate the preference? One might argue that a "true" judgment should be stable; if a preference vanishes simply because the date changes, it reflects a glitch in valuation rather than a genuine assessment of value. If we accept this, Mira's 4:00 PM judgment is defective, and acting on it might count as a failure of rational agency.

  However, rejecting the preference solely on instability risks denying agency to anyone with changing tastes. A stronger objection is that Mira's instability undermines her diachronic autonomy. She cannot govern her life over time because her future self cannot be trusted to uphold her current plans. Yet, this is a failure of planning, not necessarily will. At the moment of choice, she is coherent. Sam, meanwhile, maintains diachronic coherence in judgment but fails in execution. Thus, the Relocation Test highlights that Mira suffers from *inconsistency*, while Sam suffers from *weakness*. Inconsistency is irrational over time; weakness is irrational at a time.

  Finally, we must consider the sophisticated variant. Suppose Mira knows at 9:00 AM that she will reverse at 4:00 PM. Does this knowledge solve the problem? Standard models often treat sophistication as an improvement over naivety because it allows for precommitment. If Mira knows she will cave, she can lock her door at 9:00 AM. However, sophistication is not strictly better than naivety. In some cases, knowing you will cave can lead to "unraveling": if I know I will eat the cake at 4:00 PM anyway, I might as well eat it at 2:00 PM, or I may suffer anticipatory frustration that reduces my overall welfare without changing the outcome.

  Furthermore, sophistication only helps if precommitment is available and binding. If Mira cannot bind her future self, her sophistication merely allows her to watch helplessly as her plans dissolve. She becomes a spectator to her own failure. In contrast, the naive agent at least experiences the 9:00 AM hope of success. Therefore, sophistication does not cure the underlying preference reversal; it merely changes the agent's relationship to it. It highlights that the core problem is not information, but the lack of binding authority over future selves.

  In conclusion, defining akrasia requires locating the conflict. Mira changes her mind; Sam fights himself. Mira's instability makes her unreliable over time, but Sam's action contradicts his active judgment. Sophistication offers no magic bullet; without binding precommitment, knowing you are weak does not make you strong. Thus, genuine weakness of will is best understood as Sam's conflict at the time of action, rather than Mira's reversal over time.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  | Move | Criteria | Marks | Typical Fudge |
  | :--- | :--- | :--- | :--- |
  | **1. Identification** | Correctly identifies Sam as the clearer case of akrasia (conflict at time of action) vs. Mira (reversal without conflict). | 4 | Conflating reversal with weakness; claiming both are equally weak-willed without distinction. |
  | **2. Time of Judgment** | Explicitly states that the relevant judgment is the one held *at the time of action* (4:00 PM), rejecting equivocation between 9:00 AM and 4:00 PM. | 4 | Silently switching between 9:00 AM and 4:00 PM judgments to make the case fit; failing to specify *whose* judgment counts. |
  | **3. Relocation Test** | Engages with the Relocation Test: addresses whether instability invalidates the preference or merely indicates time-indexing. | 4 | Ignoring the test; or stating "it shows she's inconsistent" without explaining whether that negates agency. |
  | **4. Sophistication** | ***(A/B Separator)*** Correctly argues sophistication is *not* strictly better than naivety (e.g., mentions unraveling, welfare loss, or lack of binding power). | 4 | **B-grade:** States sophistication allows precommitment. **A-grade:** Explains why sophistication can be *worse* or useless without binding mechanisms. |
  | **5. Synthesis** | Provides a unified conclusion linking the definition of akrasia to the limits of sophistication (e.g., information ≠ control). | 4 | Disconnected paragraphs; conclusion merely restates the intro without synthesizing the sophistication point. |

  **The A/B Separator:**
  **Move 4 (Sophistication).** A strong B student will correctly note that Mira is sophisticated and can precommit. An A student will recognize the constraint that sophistication is not *normatively superior* in all cases (e.g., it can lead to earlier defeat or reduced welfare without changing the outcome) and link this to the limits of agency. Students who treat sophistication as a straightforward solution cap at 15/20.
