answer: |-
  ### 1. Exam Question

  **Question 4: Infinity, Computation, and Totality (25 Marks)**

  **Preamble:** This question asks you to analyze the logical structure of arguments about infinity, not to retell standard stories. Answers that rely solely on recounting Hilbert's Hotel, reciting Cantor's diagonal proof without analysis, or claiming "it depends on your axioms" without specifying which premises fail will receive minimal credit. Define any technical terms you use.

  **(a) Potential vs. Actual Infinity (8 Marks)**
  Consider two descriptions of a hotel:
  1.  **The Autoscaling Hotel:** At any finite time $t$, there are $N_t$ rooms. For any current room $k$, there exists a future time $t'$ where room $k+1$ exists.
  2.  **The Completed Hotel:** There exists a single collection $H$ such that for every natural number $n$, room $n$ is in $H$ simultaneously.

  (i) Express the difference between these two descriptions using quantifier order ($\forall, \exists$) over the natural numbers. (2 marks)
  (ii) Explain why a coach party of size $\aleph_0$ can be housed in the Completed Hotel but not the Autoscaling Hotel at any finite stage. (2 marks)
  (iii) In the Completed Hotel, the set of even-numbered rooms is a proper subset of all rooms, yet can be put in one-to-one correspondence with all rooms. A student claims this is a contradiction. Explain why mathematicians treat this not as a contradiction, but as the *definition* of an infinite set (Dedekind-infinite), and what principle (valid for finite sets) must be abandoned to accept this. (4 marks)

  **(b) The Computable Reals (10 Marks)**
  Call a real number **computable** if there exists a Turing machine that, given input $n$, outputs the $n$-th digit of the number's decimal expansion.
  (i) Argue why the set of computable reals, $\mathbb{R}_c$, is countable. (3 marks)
  (ii) Assume for contradiction that there exists a Turing machine $E$ that enumerates $\mathbb{R}_c$ (i.e., $E$ lists the machines that compute every computable real). Describe how to construct a new Turing machine $D$ using $E$ and Cantor's diagonal method. Prove that $D$ computes a real number that is not in the enumeration produced by $E$. (4 marks)
  (iii) Combine (i) and (ii). If $\mathbb{R}_c$ is countable, why does (ii) imply that no program can list them all? What does this distinction reveal about the difference between "countability" (existence of a bijection) and "computable enumerability" (existence of a program)? Finally, given Cantor's theorem that $\mathbb{R}$ is uncountable, what must exist that is not in $\mathbb{R}_c$? (3 marks)

  **(c) The Skeptic's Cut (7 Marks)**
  Consider a character, **The Skeptic**, who accepts the natural numbers $\mathbb{N}$ as a completed totality and accepts classical logic for statements about $\mathbb{N}$. However, The Skeptic refuses to accept the set of all functions $f: \mathbb{N} \to \mathbb{N}$ (or equivalently, the real numbers) as a completed totality over which quantifiers can range.
  (i) Identify exactly which premise of Cantor's diagonal argument The Skeptic rejects. (2 marks)
  (ii) For The Skeptic, Cantor's argument does not prove "the set of reals is larger than $\mathbb{N}$." Instead, rephrase the conclusion of the diagonal argument as a schematic result about *rules* or *specifications*. (2 marks)
  (iii) The Skeptic finds Hilbert's Hotel physically incredible but might accept Cantor's theorem as a logical rule about definitions. Explain this asymmetry: why might one reject the "Completed Hotel" (physical infinity) while accepting the diagonal argument (logical indefinability), or vice versa? Can The Skeptic state their view without quantifying over the "set of all functions" they reject? (3 marks)

  ***

  ### 2. Model Answer

  **(a) Potential vs. Actual Infinity**
  (i) The Autoscaling Hotel asserts $\forall n \exists t (\text{room } n \text{ exists at } t)$. The quantifier order places existence of the room dependent on time. The Completed Hotel asserts $\exists H \forall n (n \in H)$. Here, the collection exists prior to the quantification over $n$; all rooms exist simultaneously.

  (ii) A coach party of size $\aleph_0$ requires assigning every passenger $p_n$ to a room $r_n$ simultaneously. In the Autoscaling Hotel, at any finite stage $t$, only finitely many rooms exist. No matter how large $N_t$ is, there are passengers $p_k$ for $k > N_t$ who have no room. In the Completed Hotel, the mapping $n \mapsto \text{room } n$ is valid immediately because the totality of rooms is given.

  (iii) The student is applying the **Part-Whole Principle**, which states that a proper subset must be strictly smaller than the whole set. This principle holds for finite sets. However, for infinite sets, mathematicians prioritize **One-to-One Correspondence** (cardinality) as the definition of "size." If a set can be put in one-to-one correspondence with a proper subset of itself, it is defined as **Dedekind-infinite**. Accepting this is not a contradiction but a choice of definition: we abandon the Part-Whole Principle for infinite collections to preserve the arithmetic of cardinality.

  **(b) The Computable Reals**
  (i) A computable real is defined by the existence of a Turing machine. Turing machines can be encoded as finite strings of symbols. The set of all finite strings is countable (via dovetailing or lexicographical ordering). Since each computable real corresponds to at least one machine, the set of computable reals $\mathbb{R}_c$ is a subset of a countable set, making $\mathbb{R}_c$ countable.

  (ii) If an enumerator $E$ exists, it outputs a sequence of machines $M_1, M_2, \dots$ where $M_i$ computes the $i$-th computable real $r_i$. We construct a diagonal machine $D$ that, on input $n$, runs $E$ to find machine $M_n$, runs $M_n$ on input $n$ to get the $n$-th digit of $r_n$, and outputs a different digit (e.g., adds 1 mod 10). $D$ is a valid Turing machine, so it computes a real number $r_D$. By construction, $r_D$ differs from $r_n$ at the $n$-th digit for all $n$. Thus, $r_D$ is not in the enumeration.

  (iii) Part (i) establishes that $\mathbb{R}_c$ is countable (a bijection with $\mathbb{N}$ exists in the abstract). Part (ii) establishes that $\mathbb{R}_c$ is not *computably enumerable* (no program can generate the bijection). This reveals that "countable" quantifies over all mathematical functions, while "computably enumerable" quantifies only over computable functions. Since $\mathbb{R}$ is uncountable (Cantor) and $\mathbb{R}_c$ is countable, there must exist real numbers that are not computable (uncomputable reals).

  **(c) The Skeptic's Cut**
  (i) The Skeptic rejects the premise that "the set of all functions from $\mathbb{N}$ to $\mathbb{N}$" exists as a completed object. Cantor's argument assumes we can quantify over *all* possible lists (functions). The Skeptic accepts $\mathbb{N}$ but treats functions as rules that are generated, not a pre-existing totality.

  (ii) For The Skeptic, the conclusion is: "For any specific rule $L$ that purportedly lists all reals, there exists an effective construction of a rule $D$ that defines a real not listed by $L$." This is a schema about definitions: no definition can capture all definable objects. It avoids claiming the existence of a "set of all reals" that is "larger."

  (iii) The asymmetry arises because Hilbert's Hotel implies a physical impossibility (accommodating infinite guests in a physical building), whereas Cantor's theorem is a logical constraint on language and definition. One can reject physical actual infinity (Hotel) while accepting logical indefinability (Cantor). The Skeptic can state their view by quantifying over *descriptions* or *programs* (which are finite strings and thus form a countable totality) rather than *functions* (which are abstract mappings). They reject the jump from "all possible rules" to "a set containing all extensions of those rules."

  ***

  ### 3. Marking Scheme

  | Part | Required Move | Marks | Common Error / Half-Credit |
  | :--- | :--- | :--- | :--- |
  | **1(a)i** | Correct quantifier order ($\forall \exists$ vs $\exists \forall$). | 2 | Swapping quantifiers or using vague language like "time vs. space." |
  | **1(a)ii** | Simultaneity requirement for $\aleph_0$ guests. | 2 | Focusing on "running out of time" rather than lack of simultaneous rooms. |
  | **1(a)iii** | Identify Part-Whole Principle vs. Correspondence; Dedekind definition. | 4 | Calling it a "paradox" without resolving it; failing to name the abandoned principle. |
  | **2(b)i** | Programs are finite strings $\to$ countable. | 3 | Arguing reals are countable because digits are finite; ignoring the machine encoding. |
  | **2(b)ii** | Effective diagonalization against enumerator $E$. | 4 | Describing standard Cantor diagonalization without referencing the machine $E$ or computability. |
  | **2(b)iii** | Distinction: Countable $\neq$ Computably Enumerable; Existence of uncomputable reals. | 3 | Concluding computable reals are uncountable; failing to infer uncomputable reals exist. |
  | **3(c)i** | Rejection of function totality / Power Set of $\mathbb{N}$. | 2 | Saying they reject "infinity" generally or "Cantor's logic." |
  | **3(c)ii** | Reframing as schematic/rule-based result. | 2 | Restating standard set-theoretic conclusion. |
  | **3(c)iii** | Asymmetry (Physical vs. Logical); Quantifying over descriptions. | 3 | Claiming Skeptic is inconsistent; failing to explain how they speak without the set. |

  **Grade Boundaries:**
  *   **A Grade (21-25):** Clearly distinguishes between *existence* of a bijection and *computation* of a bijection in Part 2. In Part 3, articulates that the Skeptic quantifies over finite descriptions rather than infinite functions. No conceptual conflation between countability and computable enumerability.
  *   **B Grade (16-20):** Correctly performs the diagonalization and identifies the quantifier swap in Part 1. May struggle to articulate *why* the computable reals are countable but not enumerable (Part 2iii), or treats the Skeptic's view as simply "denying infinity" rather than restricting totalities (Part 3).
  *   **C Grade (10-15):** Recites Cantor's proof or Hilbert's Hotel without addressing the specific structural questions. Confuses "countable" with "computable." Fails to identify the Part-Whole Principle in Part 1.

  ***

  ### 4. Note on Mathematical Corrections

  Your sketch regarding the computable reals is mathematically sound for this context, but it relies on a subtle distinction that often trips up students: the set of computable reals is countable *classically*, but it has no *computable* enumeration. I have ensured Part 2(b) explicitly forces students to distinguish between "there exists a mapping" (set theory) and "there exists a program that computes the mapping" (computability theory). Without this distinction, students might incorrectly conclude that Cantor's theorem fails for computable reals. The question phrasing now prevents this by asking them to reconcile the countability of $\mathbb{R}_c$ with the impossibility of enumerating them via machine $E$. This preserves the rigor of your intended "Move 2" without requiring background in constructive analysis.
