  1. You suggest that monumental history is not merely a distortion but a necessity for action; does this mode necessarily falsify the past, or does it instead operate according to an entirely different temporal logic than chronology?
  Follow-up: If you argue it is a different logic rather than a lie, does that not grant the living a dangerous license to reshape ancestors to fit current needs, provided they claim vitality?

  2. You describe the antiquarian mode as mummifying life rather than preserving it; what is the precise mechanism by which this occurs, with particular attention to your claim that the decisive factor is the intensity of feeling rather than the volume of record?
  Follow-up: If volume is irrelevant to the pathology, why do you insist digital archives intensify this specific feeling if life selects its past regardless of archive size?

  3. When critical history cuts away the past to liberate the present, can it avoid reproducing the very monumentalism it seeks to dismantle when it constructs its own heroic narrative of liberation?
  Follow-up: Since you insist that life selects its past regardless of archive size, how do we distinguish a vital selection from a vain one without appealing to an objective truth you seem to sideline?

  4. How does your reconstructed framework apply to a novelist's practical problem of using family archives without falling into antiquarian paralysis?
  Follow-up: If life selects its past regardless of archive size, are you suggesting I must actively betray the completeness of the family record to tell a true story?

  5. You argue digital archives dissolve the necessary horizon not by supplying too much past but by removing the qualitative boundary; is forgetting now a spatial act we must engineer rather than a natural function?
  Follow-up: If you defend qualitative boundaries against quantitative objections, does that mean we need artificial barriers to protect our capacity to feel deeply?

  6. If the three modes are concurrent structural tensions rather than stages, does a healthy culture feel this conflict as pain or as rhythm?
  Follow-up: Since you insist life selects its past regardless of archive size, is that selection process itself the source of the pain you describe?

  7. Does the bloodline demand an antiquarian reverence that contradicts the critical knife needed to live freely, or can inheritance be edited?
  Follow-up: If you defend qualitative boundaries, can we draw a boundary around our own genetics, or are we bound to honor what we cannot choose?

  8. Nietzsche praises the power to forget as unhistorical; is this unhistorical space where the qualitative boundary is actually drawn?
  Follow-up: If life selects its past regardless of archive size, is the unhistorical the mechanism of that selection, or merely its residue?

  9. In this balancing act, is there justice for the dead who are selected against by the living?
  Follow-up: If you defend qualitative boundaries against quantitative objections, does justice belong only to those who can bear the weight of being remembered?

  10. What does healthy memory look like in action, if not the accumulation of facts?
  Follow-up: If life selects its past regardless of archive size, can we recognize a healthy culture by what it ignores rather than what it preserves?

  Verdict: The interview exposes the central tension between the living organism's need for a horizon and the digital archive's promise of a view without limits.
