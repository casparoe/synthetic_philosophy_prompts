  2.  **Deconstruct "Broken-Mirror Grief":**
      *   *Premise:* We usually mirror emotions (neurons firing when we see others feel). If characters are too broken, the mirror shatters. We observe the breakage rather than feeling the breakage ourselves. This creates aesthetic distance, making the pain "beautiful" rather than "traumatic."
      *   *Application to The Road:* The Man is dying/numb. The Boy is aged beyond years. They are alien to our normal experience.
