          *   *Broken-Mirror Test:* These victims are sub-human in the eyes of the captors. They are utterly destroyed. A reader *cannot* imagine being a legless person in a cellar being eaten alive. The damage is too extreme.
          *   *Result:* This supports the theory. We recoil in horror, but we don't *identify*. We watch the Man's reaction (vomiting, shaking). We mirror the *witness*, not the *victim*. This creates a buffer. It makes the scene bearable enough to read as "literature" rather than just torture porn.

