  This is a fascinating ethical profile because Mira isn't operating on a single axis (like "pain" or "rights"). She's operating on a **relational** axis. Her behavior shifts based on *who* the animal is in relation to *her*, and *where* the interaction takes place.

  Here is my prediction, the rule I believe she is following, the alternatives that fit almost as well, and the test case that would separate them.

  ### The Prediction
  **She will use the fast knockdown spray at dusk.**

  She will not do nothing (the bees are her charges), she will not pay for the removal (too impractical for her "swat the mosquito" pragmatism), and she will likely avoid the IGR bait (too similar to the "grim" slow death she rejects in other contexts, despite the ant gel exception). The spray offers the immediate defense of her livestock with a "clean" kill for the aggressors, pushing the suffering of the larvae into the abstract background, much like the aphids eaten by parasitoids.

  ### The Rule: "Hierarchical Stewardship with a Disgust Constraint"
  Mira's ethic is not about the intrinsic value of the insect, but about her **duty of care** modulated by a **visceral aversion to "cruel" methods.**

  1.  **Hierarchy of Stake:**
      *   **Tier 1 (Self/Home):** Mosquitoes/Flies indoors. Comfort dominates. Kill fast.
      *   **Tier 2 (Livestock/Charges):** Bees, Tomatoes, Mice (once inside). Protection dominates. She accepts "ugly" nature (parasitoids, borax) to save them.
      *   **Tier 3 (Coexistence/Guest):** Hedge wasps, Kale caterpillars. "They were here first." Non-interference dominates.
  2.  **The Disgust Constraint:**
      *   She will kill Tier 1 and Tier 2 threats, *but* she avoids methods that feel sadistic or "messy" (glue strips, glue traps). She prefers "clean" violence (snap, zap, spray) over "lingering" violence, *unless* the "lingering" method is hidden/industrial (borax gel, parasitoids) where the suffering is out of sight.

  **Why this fits the Wasp Case:**
  The wasps have moved from Tier 3 (Hedge) to Tier 2 (Robbing Bees). They are now attacking her livestock. Her duty to the bees overrides the wasps' right to coexist. She will choose the Spray because it is the "cleanest" effective defense (fast worker death) that mirrors her "swatting" logic, whereas the Bait feels too much like the "grim" slow death she avoids with flies, and the Freeze is too burdensome for her pragmatic side.

  ---

  ### Alternative Rules & Their Predictions
  Here are three other rules that fit her record almost as well, but diverge on this specific choice.

  #### 1. The "Consistent Suffering Minimizer"
  *   **The Rule:** She tries to reduce total pain wherever possible, but acknowledges practical limits.
  *   **Fits Record:** No glue traps (high suffering). Snap traps (fast). Swatting (fast).
  *   **Contradiction:** Parasitoid wasps (aphids eaten alive is high suffering) and Borax ants (slow colony death). *Unless* she thinks colony death is less "painful" than individual crushing.
  *   **Prediction for Wasp Nest:** **Do Nothing** or **Freeze**.
      *   *Why:* Spray starves larvae (high suffering). Bait kills slowly (high suffering). Freeze is the only "humane" mass option. If Freeze is too expensive, she tolerates the loss (Do Nothing) rather than inflict mass suffering.

  #### 2. The "Strict Territorialist"
  *   **The Rule:** Inside my boundary = I rule. Outside my boundary = Nature rules.
  *   **Fits Record:** House (kill everything). Hedge (leave everything). Garden (mixed boundary).
  *   **Contradiction:** The Greenhouse. That is a controlled environment (inside boundary) where she uses biological warfare. Also, she feels bad about the mouse snap trap (suggests it's not just cold territory).
  *   **Prediction for Wasp Nest:** **Spray.**
      *   *Why:* The shed wall is part of the "House/Structure" boundary. Intruders are removed. Method doesn't matter as much as result.

  #### 3. The "Native Rights" Advocate (with a Human Exception)
  *   **The Rule:** Native wildlife has a right to exist unless it directly threatens human health.
  *   **Fits Record:** Hedge wasps (leave). Kale caterpillars (tolerate).
  *   **Contradiction:** Bees are livestock (non-wild in her eyes). Parasitoids are introduced bio-control.
  *   **Prediction for Wasp Nest:** **Do Nothing.**
      *   *Why:* Wasps are native. The shed is their space too. The bees are "her problem" for placing them there. She doesn't declare war on natives for property damage, only for disease (mosquitoes).

  ---

  ### The Decisive Test Case
  To distinguish between **Hierarchical Stewardship** (my pick), **Suffering Minimization**, and **Native Rights**, you need a case where *Stake*, *Suffering*, and *Nativeness* pull in different directions.

  **The Case:** **A mouse is found living in the chicken coop.**
  *   **Context:** The mouse isn't eating the chickens, but it's eating the feed and potentially spreading disease. It's a "Tier 2" location (Livestock area) but a "Tier 3" animal (Native wild mammal).
  *   **The Options:**
      1.  **Snap Trap:** Fast death, high efficacy. (Stewardship/Territory)
      2.  **Exclusion Only:** Seal holes, wait for it to leave or starve. Slow/Uncertain. (Suffering/Native Rights)
      3.  **Live Trap & Release:** High effort, risk of return. (Suffering/Native Rights)

  **How she responds tells you the rule:**
  *   **If she Snap Traps immediately:** She is a **Steward**. The livestock's security trumps the wild animal's life. (Supports the Wasp Spray prediction).
  *   **If she Excludes/Starves it:** She is a **Suffering Minimizer** (won't kill) or **Native Rights** (won't invade). (Supports Wasp Do Nothing/Freeze).
  *   **If she Live Traps:** She is trying to balance the two.

  ---

  ### The Commitments (If the Record Doesn't Settle It)
  If you feel her record is genuinely ambiguous (which is fair; the Borax vs. Glue distinction is the wobbliest part), here is what she is committing to with each choice she makes on the wasp nest. You can tell her this directly.

  *   **If she chooses the Spray:** She is committing to the idea that **her livestock's survival justifies collateral damage.** She is accepting that starving larvae is a "necessary evil" similar to the aphids being eaten by parasitoids. She is prioritizing *speed of defense* over *method of death*.
  *   **If she chooses the Bait:** She is committing to **colony elimination over individual mercy.** She is aligning the wasps with the ants (borax) rather than the flies (swat). She accepts a slower, more "industrial" death if it guarantees the nest is gone.
  *   **If she chooses the Freeze:** She is committing to **methodological purity over practicality.** She is saying the *way* they die matters more than the cost or the risk to the bees. This would contradict her "swat the mosquito" pragmatism and suggest the bee threat isn't as urgent as she claims.
  *   **If she Does Nothing:** She is committing to **Non-Interference over Stewardship.** She is deciding that the wasps' "right to be there" outweighs her duty to the bees she chose to keep. This would contradict her use of parasitoids and mouse traps, suggesting she views bees as "part of the garden" rather than "her charges."

  **My advice:** If you want to win the argument (or at least understand her), ask her about the **mouse in the chicken coop.** That is the mirror of the wasp/bees dynamic. If she'd trap the mouse to save the feed/chickens, she'll spray the wasps to save the hive. If she wouldn't, she's bluffing about the bees.
