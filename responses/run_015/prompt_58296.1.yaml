  11. **Final Polish:** Ensure tone is appropriate for a convenor speaking to postgrads (respectful of their expertise in Soc/Econ, but guiding on Phil). *Self-correction: Make sure to explicitly link the Soc/Econ background to the potential pitfalls (e.g., Economists looking for equilibrium, Sociologists looking for social facts).*

