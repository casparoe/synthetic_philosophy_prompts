          *   Predict misunderstandings at each stage and how to preempt them.
          *   Assessment: How to tell if the central distinction is grasped.
          *   Specific sequencing of notions: Recurrent coordination difficulty, actual regularity, interlocking expectations, conditional willingness, alternative solutions.
          *   Intercept temptations: Equating convention with explicit bargain, counting every regularity as conventional, reducing mutual expectation to widespread knowledge, hearing "evolution" as biological.
          *   Provide a *new vignette* to separate genuine convention from habit and imposed uniformity.
          *   Identify formal refinements to bracket (with caveats).

  2.  **Deconstruct Lewis's Theory (for Pedagogical Mapping):**
      *   Lewis defines convention as a solution to a *recurrent coordination problem*.
      *   Key components:
          1.  Regularity in behavior ($R$).
          2.  Common knowledge/interlocking expectations (I expect you to do $R$, you expect me to do $R$, I expect you to expect me...).
          3.  Conditional preference (I prefer to do $R$ *if* you do $R$).
          4.  Alternative regularity ($R'$) was possible (arbitrariness).
      *   *Crucial distinction:* Convention vs. Habit (no interdependence) vs. Imposed Rule (no alternative/conditional preference based on others).

  3.  **Sequence the Building Blocks:**
      *   *Logic:* You can't have expectations without a problem to solve. You can't have conditional preference without expectations. You can't have arbitrariness without knowing it's a solution.
      *   *Proposed Order:*
          1.  Recurrent Coordination Difficulty (The "Why").
          2.  Actual Regularity in Response (The "What").
          3.  Interlocking Expectations (The "Glue").
          4.  Conditional Willingness to Conform (The "Motivation").
          5.  Availability of an Equally Workable Alternative (The "Arbitrariness/Conventionality").
      *   *Rationale:* Moves from problem -> solution -> mechanism -> motivation -> definition.

  4.  **Develop the Coffee-Machine Case (The "Through-Line"):**
      *   *Scenario:* Overcrowded workshop -> Queue forms left, right clear.
      *   *Fit Criteria:* Must show interdependence (I queue left *because* you queue left), not just efficiency. Must show arbitrariness (could have been right).
      *   *Risk:* It might look like a "rule" imposed by the first person. Need to emphasize the *emergence* and *maintenance* via expectation.
      *   *Misleading aspect:* If it became a written sign, it's no longer purely Lewisian convention. Must keep it informal.

  5.  **Address Predictable Misunderstandings (The "Traps"):**
      *   *Trap 1: Explicit Bargain.* (Sociologists/Economists often look for contracts). *Preemption:* Emphasize "tacit" and "signaling" via action, not words.
      *   *Trap 2: Every Regularity is Convention.* (Habit). *Preemption:* Use the "Solitary Drinker" test.
      *   *Trap 3: Mutual Expectation = Widespread Knowledge.* (Common Knowledge vs. Everyone Knows). *Preemption:* Use the "Island" analogy or simple recursion (I know that you know...).
      *   *Trap 4: Evolution = Biological.* (Evolutionary Game Theory vs. Darwin). *Preemption:* Clarify "cultural selection" or "trial and error."

  6.  **Design the Assessment (The "Check"):**
      *   How to know they get it? Ask them to break it. "What would destroy the convention?" or "Propose a new one."
      *   Better: The "New Vignette" requirement. I need to provide a vignette *for them* to use to test understanding, or ask them to apply the criteria to a new case. The prompt asks *me* to offer a single new vignette to separate convention from habit/imposition.

  7.  **Select Formal Refinements to Bracket:**
      *   Common Knowledge (infinite recursion) -> Replace with "Mutual Expectations."
      *   Payoff matrices -> Replace with verbal preference ordering.
      *   Signaling systems (language) -> Keep to behavioral norms for now.

  8.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the audience (Soc/Econ) and the goal (Lewis without the jargon).
      *   *Sequencing:* Map the 5 concepts to the Coffee Machine.
