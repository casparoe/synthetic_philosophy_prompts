answer: |-
  Here is a pedagogical roadmap for your primer, designed to leverage your group's disciplinary strengths while insulating them from their specific blind spots.

  ### 1. Sequencing the Conceptual Building Blocks

  Do not present Lewis's definition as a checklist. Present it as a **narrative of emergence**. The dependency logic is causal: you cannot have the later states without the earlier conditions.

  **The Sequence:**
  1.  **Recurrent Coordination Difficulty:** (The Problem)
  2.  **Actual Regularity in Response:** (The Solution)
  3.  **Interlocking Expectations:** (The Mechanism)
  4.  **Conditional Willingness to Conform:** (The Motivation)
  5.  **Availability of an Equally Workable Alternative:** (The Arbitrariness)

  **Rationale for Dependency:**
  *   You cannot explain why a *Regularity* persists (2) without first establishing there was a *Difficulty* that needed solving (1).
  *   You cannot explain why the *Regularity* is stable (2) without *Expectations* (3); otherwise, it is just coincidence.
  *   You cannot distinguish *Expectations* (3) from mere prediction without *Conditional Willingness* (4); otherwise, I might expect you to drive on the left but prefer to drive on the right myself (a conflict, not a convention).
  *   You cannot distinguish *Convention* from *Natural Law* or *Technical Necessity* without the *Alternative* (5); if there is no other way to solve the problem, it is not a convention, it is engineering.

  ### 2. Pressing the Coffee-Machine Case into Service

  Use the "Left-Side Queue" for all five stages. Do not switch examples, or you lose the thread.

  *   **Stage 1 (Difficulty):** Before the workshop, the machine was a bottleneck. People bumped elbows; water spilled. (Problem: Congestion).
  *   **Stage 2 (Regularity):** After the workshop, everyone lines up on the left. (Solution: Order).
  *   **Stage 3 (Expectations):** I join the left line because I *expect* you to be on the left. If I thought you would be on the right, I would not queue on the left.
  *   **Stage 4 (Conditional Willingness):** I do not *intrinsically* prefer the left. I prefer the left *given that* you are on the left. My preference is dependent on yours.
  *   **Stage 5 (Alternative):** We could have queued on the right. The physics of the machine allows both. The choice is arbitrary relative to the function.

  **Criteria for Fitness:**
  *   **Fit:** The case works if the group acknowledges that queuing on the *right* would have solved the congestion just as well.
  *   **Misleading Risk:** If the building has a physical barrier (e.g., a wall) that forces the left queue, it is not a convention; it is a constraint.
  *   **Preemption:** Explicitly state: *"Imagine the wall on the right was removed. Would the queue move? If yes, it's a constraint. If no, it's a convention."*

  ### 3. Intercepting Predictable Misunderstandings

  Your audience consists of Economists (who look for equilibrium) and Sociologists (who look for social facts). They will import baggage.

  | Stage | Temptation / Misunderstanding | Disciplinary Source | Preemption Script |
  | :--- | :--- | :--- | :--- |
  | **1. Difficulty** | **"Evolution is Biological."** Hearing "emergence" as Darwinian selection rather than learning. | Biology/EvoPsych drift | *"When we say this 'evolved,' we mean trial-and-error learning over weeks, not genes. It is cultural selection, not natural selection."* |
  | **2. Regularity** | **"Every Regularity is Conventional."** Equating habit with norm. | Sociology (Habitus) | *"If I drink coffee every morning alone, that is a regularity. Is it a convention? No. Why? Because your behavior doesn't change mine."* |
  | **3. Expectations** | **"Mutual Expectation = Widespread Knowledge."** Thinking 'everyone knows' is enough. | Game Theory (Naive) | *"It is not enough that we all know the rule. I must know that *you* know that *I* know. If I think you forgot the rule, I won't follow it."* |
  | **4. Willingness** | **"Convention = Explicit Bargain."** Assuming someone called a meeting to decide the queue. | Economics (Contract) | *"No one signed a contract. The 'agreement' is tacit. My action signals my intent; your action signals your acceptance."* |
  | **5. Alternative** | **"Conventions are Optimal."** Assuming the chosen solution is the best one. | Welfare Economics | *"Left queuing isn't 'better' than right queuing. It is just *a* solution. Conventions are often arbitrary, not optimal."* |

  ### 4. The Diagnostic: How to Tell They Have Grasped It

  Do not ask them to define convention. Ask them to **break** it.

  **The Test Question:**
  *"Imagine a new postgraduate arrives tomorrow. She sees the queue on the left. Under what specific condition would she be justified in ignoring the queue and standing on the right, without being 'irrational' or 'rude' in the Lewisian sense?"*

  **The Correct Answer:**
  She is justified only if she believes the *interlocking expectations* have collapsed (e.g., she sees everyone else moving to the right). If she stands on the right while everyone else is on the left, she creates a coordination failure. If she stands on the right because she "prefers it," she misunderstands the *conditional* nature of the preference.

  ### 5. The New Vignette: Separating Habit, Imposition, and Convention

  To test the distinction, offer them **"The Seminar Seating Pattern."**

  Present three variations of the same room and ask them to identify which is the Lewisian Convention.

  1.  **Mere Habit:** "Professor X always sits in the front row because she is short and needs to see the board. Students sit wherever. There is no pattern among students."
      *   *Diagnosis:* Not a convention. No interdependence. The Professor's action does not depend on the Students'.
  2.  **Imposed Uniformity:** "The Department Head assigns seat numbers. Students must sit in Row 1, Group A."
      *   *Diagnosis:* Not a convention. No *conditional willingness*. Students sit there because they are forced, not because they expect others to. The *alternative* (choosing seats) is removed.
  3.  **Genuine Convention:** "Students consistently sit in the back rows, leaving the front empty. No one assigns this. If a student saw the front filling up, they would join the front. They sit in the back *because* they expect others to, preferring to be with the group (or hide), but they could have filled the front if that's where the group started."
      *   *Diagnosis:* **Convention.** It meets all five criteria: Recurrent class (seminars), Regularity (back rows), Expectations (I expect you to hide), Conditional Preference (I'll sit front if you do), Alternative (Front row is physically available).

  ### 6. Formal Refinements to Bracket

  You cannot cover Lewis's full formal apparatus in a primer. Explicitly bracket the following to avoid paralysis by analysis:

  1.  **Common Knowledge (Infinite Recursion):** Lewis technically requires an infinite chain of "I know that you know that I know..."
      *   *Caveat:* *"For today, treat this as 'Mutual Expectations.' We will not solve the infinite regress problem. Assume that seeing the regularity is enough to generate the expectation."*
  2.  **Payoff Matrices:** Lewis uses game theory matrices to prove the coordination equilibrium.
      *   *Caveat:* *"We will use verbal descriptions of preference orderings. The logic holds without the algebra."*
  3.  **Signaling Systems:** Lewis's ultimate goal was language.
      *   *Caveat:* *"We are treating behavioral norms (queues) today. Language is a special, more complex case of convention that we will address only after this foundation is secure."*

  ### Summary of Pedagogy
  *   **Anchor:** The Coffee Machine (keep returning to it).
  *   **Flow:** Problem $\to$ Solution $\to$ Glue $\to$ Motive $\to$ Arbitrariness.
  *   **Defense:** Preempt "Contract," "Habit," and "Biology" traps at the door.
  *   **Test:** Ask them how to break the norm rationally.
  *   **Contrast:** Use the "Seminar Seating" vignette to isolate the concept.

  This structure respects their postgraduate status by focusing on *mechanism* and *boundary conditions* rather than basic definition, while preventing the interdisciplinary drift that has plagued previous sessions.
