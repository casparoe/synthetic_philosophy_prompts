      *   *Misunderstandings:* Map traps to specific stages.
      *   *The New Vignette:* Need something distinct from queuing. Driving? Greetings? *Driving side of the road* is the classic, but maybe too cliché. *Meeting place*? *Elevator standing*? Let's go with **"The Elevator Face-Forward Norm."** It distinguishes well from habit (you *could* face back) and imposition (no police enforcing it).
      *   *Assessment:* A specific question to ask the room.
      *   *Bracketing:* What to leave out (Common Knowledge technicalities).

  9.  **Refining the Pedagogy (Self-Correction during drafting):**
