      *   *Revision:* The least costly revision for the main tension is to clarify that the *state's* justification for the exemption must be public (e.g., protecting liberty of conscience), even if the *citizen's* motive remains non-public. (f) says citizens shouldn't be required to articulate secular translations. This is compatible with Rawls's wide public reason *if* the final vote/decision is justified publicly. But (c) says the value is incommensurable. If the value is incommensurable, can it be weighed against public values? This is the hard part.
      *   *Revision on Ranking:* The (a)/(c)/(f) cluster is the most severe. The (d)/(e) cluster is second. The (b)/(f) cluster is third.
      *   *Mind Change:* If one argues that public reason is not the sole source of legitimacy but rather a duty of civility, the tension lessens. Or if one argues that "public reason" can include religious reasons under certain conditions (audi alteram partem).
      *   *Failure Point:* The definition of "incommensurable." If it means "cannot be understood," it breaks liberalism. If it means "cannot be fully reduced," it might work.

