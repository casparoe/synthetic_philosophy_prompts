answer: |-
  ### Brainstorming: Distinctions and Selection

  **Distinctions considered:**
  *   **Regularity vs. Rule:** Regularity is repeated behaviour; Rule is enforced norm. *Lets team distinguish habit from institution.*
  *   **Belief vs. Acceptance:** Belief is internal state; Acceptance is public stance. *Lets team distinguish personal faith from social requirement.*
  *   **Intention vs. Function:** Intention is maker's goal; Function is actual use. *Lets team distinguish design from wear.*
  *   **Convention vs. Institution:** Convention solves coordination; Institution involves power/roles. *Lets team distinguish custom from hierarchy.*
  *   **Meaning-for-them vs. Interpretable-for-us:** Emic meaning vs. Etic analysis. *Lets team distinguish indigenous ontology from modern category.*
  *   **Assertion vs. Implication:** What text says vs. what reader infers. *Lets team distinguish claim from suggestion.*
  *   **Use vs. Depiction:** Tool vs. Symbol. *Lets team distinguish utility from representation.*

  **Selection:**
  I am building the procedure on **Regularity vs. Rule**, **Reportive vs. Attributive** (a simplification of Meaning-for-them/Interpretable-for-us), and **Use vs. Depiction**.
  *   **Regularity vs. Rule** is the load-bearing thesis for institutional claims.
  *   **Reportive vs. Attributive** structures the evidence hierarchy.
  *   **Use vs. Depiction** prevents functional over-claiming.

  **Rejection:**
  *   **Belief vs. Acceptance:** Dropped. A three-person team cannot infer internal states from pottery shards in ninety minutes.
  *   **Meaning-for-them vs. Interpretable-for-us:** Dropped as a primary step. It is too abstract for operational use; replaced by the Reportive/Attributive split which forces evidence citation.
  *   **Convention vs. Institution:** Merged into Regularity vs. Rule. Conventions are regularities; Institutions are rules.

  **Thesis Test:**
  I accept the thesis: Institutional claims require evidence of cost, enforcement, or adherence where locally disadvantageous. A regularity (everyone does X) is not a rule (everyone *must* do X). In archaeology, "cost" manifests as standardization despite ecological variability or resource scarcity. I will build this into Step 4.

  ---

  ### The Decision Procedure

  **Input:** Object/Assemblage + Context Record + Proposed Sentence.
  **Output:** Approved; Weakened (Reportive); Not Licensed (Minimal True); Hand Off (Values).

  **Step 1: The Reportive Check (Material Basis)**
  *   **Question:** Does the record securely support the physical description (form, material, association, wear)?
  *   **Stopping Rule:** If context is unreliable (old excavation, no provenance), stop. Verdict: **Not Licensed**. Use minimal true statement (e.g., "Stone object found in region").
  *   **Pass:** Proceed to Step 2.

  **Step 2: The Anti-Residual Step (Practical Alternative)**
  *   **Question:** Can you write a plain practical alternative for any "symbolic" or "ritual" claim? (e.g., if "offering," alternative is "discarded tool").
  *   **Requirement:** Specify what evidence would make it ordinary refuse (e.g., breakage consistent with use vs. deliberate snap).
  *   **Stopping Rule:** If no practical alternative can be formulated, the claim is a wastebasket. Verdict: **Weakened**. Drop the symbolic term.
  *   **Pass:** Proceed to Step 3.

  **Step 3: The Equifinality Check (Multiple Causes)**
  *   **Question:** Name two distinct processes that could produce this pattern. What evidence discriminates them?
  *   **Stopping Rule:** If the record contains no discriminator (e.g., both ritual deposition and flood transport look identical here), Verdict: **Not Licensed**. Use minimal true statement.
  *   **Pass:** Proceed to Step 4.

  **Step 4: The Institutional Threshold (Regularity vs. Rule)**
  *   **Question:** For claims about roles (priest, shaman) or systems (rank, tribe), is there evidence of enforcement or cost?
  *   **Criteria:** Look for standardization despite local variability, or resource expenditure without practical return.
  *   **Stopping Rule:** If only regularity is present (everyone did it), but no cost/enforcement is visible, Verdict: **Weakened**. Drop institutional terms (priest, guild, state).
  *   **Pass:** Proceed to Step 5.

  **Step 5: The Wording Check (Assertion vs. Implication)**
  *   **Question:** Does the text assert what the evidence only implies?
  *   **Requirement:** Convert attributive claims to reportive where evidence is indirect. (e.g., "Made to be seen" → "Polished surface").
  *   **Verdict:** **Approved** or **Weakened** with supplied wording.

  **Special Rule: Values Hand-Off**
  *   If the claim concerns identity, sacredness, or descendant community ontology (e.g., "shaman," "ancestor"), and living communities are involved, Verdict: **Hand Off**. Do not write.

  ---

  ### Calibration Set (5 Cases)

  1.  **Object:** Iron nail in posthole. **Claim:** "Used to build the house." **Verdict:** Approved. (Reportive/Function secure).
  2.  **Object:** Gold coin in river. **Claim:** "Lost by a merchant." **Verdict:** Weakened. **Wording:** "Gold coin deposited in the river." (Intent unknown).
  3.  **Object:** Human skull in cave. **Claim:** "Ancestor worship site." **Verdict:** Hand Off. (Values/Descendant identity).
  4.  **Object:** Broken pot in ditch. **Claim:** "Ritual destruction." **Verdict:** Not Licensed. **Wording:** "Pottery fragments found in ditch." (Anti-residual failed; could be refuse).
  5.  **Object:** Uniform clay tokens across region. **Claim:** "Managed by a central bureaucracy." **Verdict:** Weakened. **Wording:** "Standardized clay objects found across the region." (Institutional threshold failed; no evidence of enforcement).

  ---

  ### Audit-Record Template

  **Object/Assemblage:** [ID]
  **Proposed Claim:** [Text]
  **Evidence Cited:** [Context, Wear, Association]
  **Practical Alternative Considered:** [e.g., Refuse vs. Offering]
  **Equifinality Check:** [Process A vs. Process B; Discriminator found? Y/N]
  **Institutional Evidence:** [Cost/Enforcement visible? Y/N]
  **Verdict:** [Approved/Weakened/Not Licensed/Hand Off]
  **Final Wording:** [Text]
  **Sign-off:** [Specialist Name]

  ---

  ### Limits and Honesty

  **Constraints vs. Judgment Calls:**
  Steps 1 (Reportive) and 3 (Equifinality) are genuine constraints; if the physical record is absent or ambiguous, no amount of reasoning creates fact. Steps 2 (Anti-Residual) and 4 (Institutional) are judgment calls dressed as steps. A team could argue endlessly about what counts as "cost." We force a decision by requiring the practical alternative to be written down; if it sounds plausible, the symbolic claim fails.

  **Systematic Misfires:**
  *   **Unprovenanced Objects:** Step 1 will block almost all interpretive claims. These objects become aesthetic only.
  *   **Old Excavations:** Where context notes are poor, Step 1 triggers "Not Licensed." This will reduce output volume significantly.
  *   **Analogy Traps:** Step 4 blocks ethnographic analogy unless supported by local material evidence of enforcement. We may miss real institutions because they left no costly trace.
  *   **Typology Circularity:** If typologies were built on the interpretation we are testing (e.g., "ritual vessels"), Step 2 forces us to treat them as "containers" until proven otherwise.

  **Philosophical Choice:**
  We treat "Institution" as requiring evidence of normative enforcement (Regularity vs. Rule). Some philosophers argue institutions exist merely by collective acceptance. We reject this for archaeology because collective acceptance leaves no trace distinct from habit. This choice systematically under-counts social complexity.

  ---

  ### Live Cases Run

  #### Case A: Polished Stone Axes in Bog
  **Input:** 41 axes, bog, wooden platform, 9 broken, no settlement.
  **Proposed:** "Weapons offered to a god of the lake."

  1.  **Reportive:** Secure context (bog, platform). Breakage deliberate. **Pass.**
  2.  **Anti-Residual:** Practical alternative? "Discarded tools" or "Storage cache." Breakage argues against storage. Deliberate deposition argues against loss. **Pass.**
  3.  **Equifinality:** Process A: Religious offering. Process B: Status display/wealth burial without religion. Discriminator? None in record. **Stop.**
      *   *Correction:* Equifinality check requires discrimination. Since none exists, we cannot claim *why* it was deposited.
  4.  **Institutional:** Claim "God." Evidence of enforcement/cost? The axes are valuable, but "God" implies a specific religious ontology. No evidence of priesthood or temple. **Fail.**
  5.  **Wording:** "Weapons" is attributive (could be tools). "God" is institutional.

  **Verdict:** **Weakened.**
  **Final Wording:** "Forty-one polished stone axes were deliberately placed on a wooden platform in the lake. Nine were broken before deposition. This careful treatment suggests they were valued, though their exact purpose remains unknown." (41 words).
  **Audit:** Equifinality failed on motive (offering vs. display). Institutional claim ("god") lacked evidence of enforcement. "Weapons" weakened to "axes" as use-wear is absent.

  #### Case B: Beaker Graves
  **Input:** 60 graves, 150 years, uniform orientation/vessel, variable goods/depth.
  **Proposed:** "These burials show a ranked society governed by priests."

  1.  **Reportive:** Graves, orientation, goods variation secure. **Pass.**
  2.  **Anti-Residual:** Practical alternative? "Family preference" vs. "Social Rule." Uniform orientation suggests rule. **Pass.**
  3.  **Equifinality:** Process A: Social rank. Process B: Age/Sex differences. Discriminator? Goods quantity correlates with depth? If yes, suggests rank. Assume yes for this run. **Pass.**
  4.  **Institutional:** Claim "Priests." Evidence of religious office? Uniformity suggests convention, not necessarily religious enforcement. No temple, no distinct priestly grave goods identified. **Fail.**
  5.  **Wording:** "Ranked society" is borderline institutional. "Governed by priests" is definitely institutional.

  **Verdict:** **Weakened.**
  **Final Wording:** "Over one hundred and fifty years, people here buried their dead facing the same direction with a specific pot. Variation in grave goods suggests differences in status or wealth, but the reasons for these choices are not fully understood." (43 words).
  **Audit:** Regularity (orientation) supports convention. Institutional claim ("priests") failed Step 4; no evidence of specific religious roles or enforcement costs. "Ranked society" softened to "differences in status."

  #### Case C: Rock Art with Descendant Community
  **Input:** Painted panels, anthropomorphs, sheep, no excavation.
  **Proposed:** "Shamans painted these during vision quests."

  1.  **Reportive:** Paint exists. Motifs identified. **Pass.**
  2.  **Anti-Residual:** Practical alternative? "Hunting magic" or "Storytelling." **Pass.**
  3.  **Equifinality:** Process A: Vision quest. Process B: Historical record. Discriminator? None without excavation/oral history. **Fail.**
  4.  **Institutional:** Claim "Shamans." Specific role. **Fail.**
  5.  **Values Check:** Claim involves "Shaman" and "Vision Quest." Descendant community involved.

  **Verdict:** **Hand Off.**
  **Final Wording:** [None. Text must be developed in consultation.]
  **Audit:** Step 5 (Values Hand-Off) triggered. Interpretation of spiritual roles belongs to the descendant community. Material record alone cannot license "shaman" claim.

  ---

  ### Unpopular Verdict Note

  **Case A is the verdict you will not like.**
  You will resist this because it strips the "god" claim from your flagship panel and poster image. The narrative of "offering to a god" is compelling for visitors and funders. The procedure forces you to admit the motive is unknowable (Equifinality Check) and the religious ontology is unproven (Institutional Threshold). It replaces a strong story with a cautious description. This will feel like a loss of authority, but it protects the museum from future correction when new evidence arises.

  **Case C** is also restrictive, but you expect consultation. **Case A** is where your public identity is currently invested, and the procedure demands you divest.
