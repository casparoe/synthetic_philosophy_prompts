prompt: |-
  I've been going back and forth in my head about what emotions actually are, like are they judgments, perceptions, or just raw feelings, and I ran into this passage from an 1884 essay by William James called "What Is an Emotion?" that i cant fully parse:

  "Common sense says, we lose our fortune, are sorry and weep; we meet a bear, are frightened and run; we are insulted by a rival, are angry and strike. The hypothesis here to be defended says that this order of sequence is incorrect, that the one mental state is not immediately induced by the other, that the bodily manifestations must first be interposed between, and that the more rational statement is that we feel sorry because we cry, angry because we strike, afraid because we tremble, and not that we cry, strike, or tremble, because we are sorry, angry, or fearful, as the case may be. Without the bodily states following on the perception, the latter would be purely cognitive in form, pale, colourless, destitute of emotional warmth. We might then see the bear, and judge it best to run, receive the insult and deem it right to strike, but we could not actually feel afraid or angry."

  I think I follow the main claim, that he's flipping the usual order so the body reacts first and the feeling is basically us perceiving that reaction. But the last two sentences are throwing me off. If we could still judge it best to run from the bear, how is that different from just having some emotion left over? Why does he think the bodily feedback is doing all the work, and on his view, is an emotion a judgment, a perception, or a feeling?
