  **Department of Decision Theory & Strategic Rationality**
  **Course Catalog: Graduate Seminar Series**

  **DT 604: Applied Counterfactual Blackmail: From XOR to Mugging**
  **Credits:** 3
  **Prerequisites:** DT 301 (Causal Structures), ETH 405 (Ethics of Precommitment), or instructor consent. Students must sign Liability Waiver 88-B prior to enrollment.

  **Course Description:**
  This seminar examines the operational viability of updateless decision policies in high-stakes adversarial environments. While standard Causal Decision Theory (CDT) suggests ignoring sunk costs and counterfactual dependencies, recent developments in Timeless Decision Theory (TDT) indicate that rational agents must sometimes optimize across logically correlated states rather than causal timelines. Students will analyze the structural isomorphism between Counterfactual Mugging and XOR Blackmail scenarios, focusing on the conditions under which paying a blackmailer maximizes expected utility despite the absence of causal leverage. Special attention is paid to the epistemic status of the coin flip and the logical conjunction of termite presence.

  **Administrative Notice:**
  > "While the Department maintains academic freedom, the Office of Risk Management wishes to clarify that students are not authorized to engage in actual extortion transactions for course credit. All 'Muggers' must be departmental affiliates. The University assumes no liability for ontological distress resulting from logical causation modules."
  > — *Dr. Aris Thorne, Dean of Graduate Studies*

  **Learning Objectives:**
  Upon successful completion, students will be able to:
  *   Distinguish between evidential correlations and causal interventions in extortion contexts.
  *   Calculate expected utility when the blackmailer's letter is contingent on the agent's predicted response (XOR structure).
  *   Implement precommitment strategies that remain robust after updating on evidence (e.g., receiving the letter).
  *   Navigate the "Termite Paradox" without collapsing into evidential reasoning failures.

  **Required Texts:**
  *   *Precommitment in Hostile Environments* (4th Ed.), V. Stratemann.
  *   *The Omega Standard: Case Studies in Counterfactual Liquidity*, J. Sores & O. Mega.
  *   *Logical Causation for Practitioners*, L. Decison.

  **Weekly Schedule:**

  *   **Week 1-2:** Foundations of Rational Choice. Reviewing CDT vs. EDT divergence in Newcomb-like problems.
  *   **Week 3-4:** **The Counterfactual Mugging.** Analyzing the coin flip that has already landed. Why paying $100 yields $10,000 in the counterfactual branch. Workshop: Simulating Omega encounters.
  *   **Week 5-6:** **Updatelessness.** Maintaining policy integrity after receiving information. The cost of updating on the letter.
  *   **Week 7-9:** **XOR Blackmail Structures.** Logical dependency between termite existence, letter transmission, and payment. Why receiving the letter is evidence of both termites and your own compliance algorithm.
  *   **Week 10:** **Logical Correlation vs. Causal Influence.** When your decision determines the blackmailer's past action via logical implication.
  *   **Week 11:** **Liability and Ethics.** When not to pay. Distinguishing between rational blackmailers and irrational actors.
  *   **Week 12:** **Final Simulation.** Students will be assigned roles as Blackmailer, Agent, or Omega. Grading based on utility maximization across all possible worlds, not just the actual one.

  **Assessment:**
  40% Midterm (Theoretical), 40% Final Simulation (Practical), 20% Participation (Waiver compliance). Note: Students who refuse to pay in the Week 4 simulation due to "causal inefficacy" will receive a maximum grade of B+, reflecting standard CDT limitations.

  **Registration Note:**
  This course fulfills the Advanced Rationality requirement. Enrollment is capped at 12 students to prevent coordination problems during simulation modules.
