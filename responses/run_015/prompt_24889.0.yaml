  Here's a thinking process that leads to the explanation of Kierkegaard's "The Present Age":

  1.  **Analyze the User's Request:**
      *   **Source Material:** Kierkegaard's *Two Ages* (specifically "The Present Age" section), Alexander Dru translation.
      *   **Core Problem:** The user is struggling to reconcile three seemingly contradictory claims in the provided text:
