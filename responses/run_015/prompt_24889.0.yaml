  *(Self-Correction during drafting)*: I need to be careful with the word "nothing." In Kierkegaard, "nothing" often implies a lack of *ethical substance*, not a lack of *effect*. I must make this distinction clear. The Public is an *effective nothing*. It is a vacuum that exerts pressure.

