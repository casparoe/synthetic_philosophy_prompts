      *   **Goal:** Viscerally experience the tension between Physical, Design, and Intentional stances (Dennett's framework, though unnamed initially) *before* theoretical framing. Specifically, the idea that "real patterns" depend on predictive success and that stances can be incommensurable.
      *   **Scenario:** A "Compressed Editorial Filter" (black-box recommendation system, IRL-trained, no explicit rules).
      *   **Structure:** 3 Teams (Physical, Design, Intentional), 4 Rounds of prediction, Group Vote/Consensus mechanism.
      *   **Key Dynamics:**
          *   Round 1: Design wins, others struggle.
          *   Round 2: Incompatible predictions, none clearly wrong.
          *   Round 3: Physical finds glitch, Intentional predicts correctly via contradiction, Design stuck.
          *   Round 4: Group vote with payoff for accuracy + consensus.
      *   **Debrief:** Map rounds to stances, identify failure modes, explain what the simulation *can't* show (mind-independent patterns), and ensure the takeaway is about forced moves and predictive consequences.
