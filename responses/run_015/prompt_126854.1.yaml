      *   *Design Stance:* Function, purpose, architecture, reward function, intended behavior. (Team 2)
      *   *Intentional Stance:* Beliefs, desires, goals, agency (treating the system *as if* it has a mind). (Team 3)
      *   *The Tension:* Sometimes the Design stance fails (bugs/unexpected emergence). Sometimes the Physical stance is too noisy (too much data). Sometimes the Intentional stance predicts best but attributes "false" beliefs (the system doesn't *actually* want engagement, but acts like it).
      *   *The "Real Patterns" Claim:* Dennett argues patterns are real if they support prediction. The simulation needs to show that *which* pattern is visible depends on the lens.
      *   *The Limitation:* The simulation is constructed by the facilitator. It cannot show *mind-independent* reality because the "truth" is hardcoded by the facilitator. I need to explicitly tell the user how to address this in the debrief.

  3.  **Drafting the Simulation Mechanics:**
      *   *Time Management:* 75 mins is tight.
          *   Intro/Setup: 10 mins.
          *   Rounds 1-4: 40 mins (10 mins/round approx, needs to be snappy).
          *   Debrief: 25 mins.
      *   *Materials:* Need handouts for each team. Need a "System Truth" sheet for the facilitator to generate outputs.
      *   *The "System":* I need to pre-determine the outputs for the 4 rounds so the facilitator knows who is "right."
      *   *Scoring:* Needs to incentivize the specific tensions.
          *   Points for correct prediction.
          *   Penalty for group disagreement in Round 4.

  4.  **Developing the Rounds (The "Script"):**
      *   *Round 1 (Design Dominance):* Input is standard. System behaves according to reward function.
          *   *Truth:* System optimizes for "Credibility Score."
          *   *Design:* Predicts high credibility output.
          *   *Physical:* Sees noise, can't find signal.
          *   *Intentional:* Guesses "It wants truth," gets it right but for vague reasons.
      *   *Round 2 (Incommensurability):* Input is edge-case.
          *   *Truth:* System outputs something weird.
          *   *Design:* Says "This violates reward function."
          *   *Intentional:* Says "It's sacrificing short-term credibility for long-term engagement."
          *   *Physical:* Says "Memory address X spiked."
          *   *Result:* All plausible, none definitively provable without more info.
      *   *Round 3 (The Glitch vs. The Lie):*
          *   *Truth:* Hardware bit-flip caused output, BUT output matches "Engagement Bait" pattern.
          *   *Physical:* Finds the bit-flip (Correct causal story).
          *   *Intentional:* Predicts output correctly by saying "It wants clicks" (Correct predictive story, wrong ontological story).
          *   *Design:* "Reward function doesn't allow this." (Wrong prediction).
      *   *Round 4 (The Decision):*
