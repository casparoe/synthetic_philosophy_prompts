              *   *Requirement:* For each crux, provide a concrete hypothetical scenario/reasoning step and each camp's predicted outcome.
          4.  **Verbal Disputes:** Flag terminology risks ("intelligence," "explosion," etc.) and whether resolving them dissolves or relocates the disagreement.
      *   **Tone/Style:** Conceptual, rigorous, neutral, collaborative but acknowledging deep divergence. Avoid naming specific researchers or citations. Focus on conceptual architecture.

