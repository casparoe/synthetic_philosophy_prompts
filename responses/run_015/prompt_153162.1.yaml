      Goal: Be the last group with chips.
      *Problem:* This makes it competitive in a way that might obscure the philosophical point (everyone loses).
      *Solution:* The goal is to *lose* chips gracefully. The winner is the group that realizes their position is untenable first. (Too abstract for writers).
      *Better:* The goal is to expose the *other* groups' contradictions. But eventually, the facilitator stops the game when everyone is stuck.
      *Let's go with:* "The Contradiction Token." When you spot a logical loop in another group's use of the properties, you place a token on their table. If you get 3 tokens, your position collapses. The game ends when all groups have collapsed.

  4.  **Predicting Failures:**
