      *   **Task:** Design a 90-minute workshop activity for 12 fiction writers (no prior Buddhist philosophy knowledge).
      *   **Setting:** Bookstore backroom, bad coffee, next Tuesday.
      *   **Goal:** Create a runnable game/structured deliberation where participants *feel* the collapse of the four positions (exists, doesn't exist, both, neither) before explanation. They must see śūnyatā isn't nihilism or a fifth box.
      *   **Specific Twist:** Co-invent a fictional city with properties (e.g., "river that remembers") in the first 10 mins. Split into 4 groups defending the four corners using *only* those properties. Use a vote/chip system for stakes. Debrief maps stuck moments to the tetralemma.
      *   **Requirements:**
          *   Predict what will go wrong (e.g., conflating "neither" with skepticism).
          *   Identify what the exercise *cannot* reproduce (e.g., direct non-conceptual realization) and what the facilitator must supply.
          *   No bibliographies/citations/quotes.
