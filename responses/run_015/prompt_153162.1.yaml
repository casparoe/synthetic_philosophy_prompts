  2.  **Deconstruct the Philosophy (Madhyamaka/Tetralemma):**
      *   The Tetralemma (Catuṣkoṭi):
          1.  Exists (Being)
          2.  Does not exist (Non-being)
          3.  Both exists and does not exist
          4.  Neither exists nor does not exist
      *   The Madhyamaka Move: Reject all four. Not to establish a new truth, but to show inherent contradiction in conceptual proliferation (prapañca).
      *   Emptiness (Śūnyatā): Not nothingness/nihilism. It's dependent origination (pratītyasamutpāda). Things lack inherent existence (svabhāva) but function conventionally.
      *   The Trap: People treat "Neither" as "I don't know" or "It's magic beyond words" (mysticism) or "Nothing matters" (nihilism).

  3.  **Design the Workshop (90 Minutes):**
      *   **Total Time:** 90 mins.
      *   **Participants:** 12 writers (3 per group).
      *   **Phase 1: Co-Creation (15 mins).** Build the city. Define properties.
      *   **Phase 2: The Defense (45 mins).** Groups argue their corner using *only* the defined properties. Chip system for winning points.
      *   **Phase 3: The Collapse (15 mins).** Force the contradictions.
      *   **Phase 4: Debrief (15 mins).** Map to philosophy, explain what happened.

      *Refining Phase 2 & 3:* The prompt asks for a game where rules *force* contradictions.
      *   *Idea:* Each group gets a set of "Evidence Cards" derived from the city properties. They must play cards to prove their stance. But the cards are ambiguous.
      *   *Better Idea:* The "Cross-Examination" mechanic. Group 1 argues "Exists." Group 2 attacks. But the rules change mid-game to show dependency.
      *   *Best Idea (aligned with prompt):* The "Property Lock." Once a property is written, it cannot be changed. Groups must use *only* those words.
      *   *The Twist:* The properties themselves must be mutually dependent or paradoxical enough to break the categories. E.g., "The river remembers" implies change (memory) but also permanence (river).
      *   *Chip System:* "Conviction Chips." You bet chips on your argument. If someone points out a contradiction using the *established properties*, you lose chips. If you hold ground, you gain.
      *   *The Collapse:* The facilitator (me) introduces a "Reality Check" round where groups must swap positions or defend against a specific contradiction derived from another group's success.

      *Wait, the prompt says:* "rules need to force contradictions using only the properties we wrote together."
      *   So, if the city has "A river that remembers," Group 1 (Exists) says "The river is real because it remembers." Group 2 (Not Exists) says "Memory implies change, rivers flow, so it's not a fixed entity."
      *   To force the collapse, I need a mechanism where winning an argument in one corner automatically invalidates another corner *using the same logic*, leading to a stalemate where no corner holds.
      *   *Mechanism:* "The Mirror Rule." If Group 1 uses Property X to prove Existence, Group 2 can use Property X to prove Non-Existence. If both succeed, both lose chips. This encourages finding the flaw in the property itself.

      *Revised Plan:*
      1.  **City Building (15 min):** Define 5 core properties.
      2.  **The Four Corners (30 min):** Groups draft arguments using *only* those 5 properties.
      3.  **The Clash (30 min):** Structured debate. Key rule: You cannot introduce new concepts. You must show how the *same property* supports your view.
      4.  **The Kill Switch (15 min):** Facilitator reveals that every successful argument relied on a hidden assumption not in the text.
      5.  **Debrief (15 min):** Connect to Tetralemma.

      *Wait, 90 mins total.*
      1.  Intro & City (15)
      2.  Group Prep (15)
      3.  Debate/Game (40)
      4.  Debrief (20)
      *Adjusting:* Keep it tight.

      *Game Mechanic:* "The Burden of Definition."
      Each group gets 10 chips.
      Round 1: State your case using Property A.
      Round 2: Opposing group challenges using Property A.
