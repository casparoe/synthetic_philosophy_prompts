answer: |-
  Here is a runnable workshop design, calibrated for 90 minutes, 12 writers, and a backroom with bad coffee. It is built to induce the logical fatigue that precedes the Madhyamaka insight, without requiring them to know the terminology until the end.

  ### Workshop Title: The City of Four Gates

  **Materials:**
  *   40 Poker chips (or distinct tokens/coins) per group.
  *   Large sheet of paper for the "City Charter" (visible to all).
  *   Timer.
  *   Whiteboard/Marker for the Debrief.

  **Room Setup:**
  Four tables arranged in a square. One table per "Corner." You (facilitator) sit in the middle.

  ---

  ### Phase 1: The Charter (15 Minutes)
  **Goal:** Create the ontological trap.

  1.  **Intro (2 mins):** Tell them: "We are building a city. This city is the subject of our inquiry. Once a property is written on the Charter, it is law. You cannot add new facts during the debate. You can only interpret what is already there."
  2.  **Co-Creation (13 mins):** Ask the whole room to propose 5 properties for the city.
      *   *Constraint:* You must veto properties that are too solid ("It has a wall") or too vague ("It is magical").
      *   *Steer them toward dependency:* If they suggest "A river," ask "What does the river do?" If they say "Flows," push for "The river flows uphill when watched." If they suggest "A ghost," push for "The ghost is heard only when no one speaks."
      *   *Ideal Charter:* You want properties that rely on observation, relationship, or negation.
      *   *Example Charter:*
          1.  The central tower casts no shadow.
          2.  The market trades only in promises.
          3.  The gates open only when closed.
          4.  The citizens remember the future.
          5.  The city exists only on maps drawn from memory.

  ### Phase 2: The Defense (20 Minutes)
  **Goal:** Entrenchment.

  1.  **Split:** Divide the 12 writers into 4 groups of 3. Assign each group a Corner:
      *   **Group 1 (Exists):** The city is inherently real.
      *   **Group 2 (Not Exists):** The city is inherently unreal.
      *   **Group 3 (Both):** The city is inherently both real and unreal.
      *   **Group 4 (Neither):** The city is inherently neither real nor unreal.
  2.  **Task:** Using *only* the 5 Charter properties, draft a 2-minute opening statement proving your corner is the only logical conclusion.
  3.  **Stakes:** Each group starts with 10 Chips (representing "Ontological Stability").

  ### Phase 3: The Mirror Clash (40 Minutes)
  **Goal:** Force the collapse using the "Mirror Rule."

  This is not a free-for-all debate. It is a structured attrition game.

  **The Rules:**
  1.  **Round Robin:** Group 1 states their case using Property #1. Group 2 must immediately challenge using *only* Property #1.
  2.  **The Mirror Rule:** If Group 2 can show that Property #1 supports *their* position (Not Exists) just as well as Group 1's position (Exists), Group 1 loses 2 Chips.
  3.  **The Boomerang:** If Group 1 can show that Group 2's challenge actually proves Group 1's point, Group 2 loses 2 Chips.
  4.  **The Stalemate:** If the property clearly supports *both* or *neither* depending on how you look at it, *both* groups lose 2 Chips. (This is the key mechanic).
  5.  **Rotation:** Move through Properties 1–5. Then rotate which groups clash (1 vs 3, 2 vs 4, etc.).
  6.  **Winning Condition:** There is no winner. The game ends when all groups have lost at least 6 chips, or when the room falls silent because no one can speak without contradicting the Charter.

  **Facilitator Notes for the Clash:**
  *   Be ruthless about the "Only Charter Properties" rule. Writers will try to sneak in external logic ("Well, obviously a tower needs light to cast a shadow"). Stop them. "Is 'light' on the Charter? No. Chip penalty."
  *   Encourage Group 3 and 4. Writers struggle here. Group 3 will try to say "Part of it is real, part isn't." Force them to say "The *same* property is both real and unreal simultaneously." Group 4 will try to say "We don't know." Force them to say "The category of existence does not apply."
  *   Watch the chips dwindle. When the room gets quiet because the properties have become meaningless, stop the game.

  ### Phase 4: The Debrief (15 Minutes)
  **Goal:** Map the frustration to the Tetralemma.

  1.  **The Audit:** Ask, "Who won?" (No one). "Why?" (Because the properties couldn't hold the weight).
  2.  **The Map:** Draw the Tetralemma on the whiteboard.
      *   Label the four corners they just defended.
      *   Label the Chips as "Conceptual Proliferation" (the effort to make words stick to reality).
      *   Explain: "You didn't lose because you argued poorly. You lost because the tool (language/categories) broke when applied to the task (inherent existence)."
  3.  **The Ghost:** Connect it to their work. "Your monk isn't trying to solve whether the ghost is real. She is testing whether 'real' is a valid category for grief. When she breaks the categories, she isn't finding a fifth answer. She is finding the space where the ghost actually appears."

  ---

  ### Predictable Failure Modes (And How to Patch Them)

  **1. The "Neither" Trap (Nihilism/Mysticism)**
  *   **What happens:** Group 4 will treat "Neither" as "It's a mystery beyond words" or "Nothing matters." They will sit quietly and smile, refusing to engage, thinking they've won by transcending the game.
  *   **The Patch:** Enforce the "Active Negation" rule. Group 4 cannot say "It's unknowable." They must argue: "The property 'casts no shadow' actively prevents the category of 'existence' from applying." They must work harder than the others. If they coast, penalize chips. Emptiness is not a escape hatch; it's a rigorous dismantling.

  **2. The "Both" Trap (Compartmentalization)**
  *   **What happens:** Group 3 will argue, "The tower exists physically, but the shadow doesn't." This is dualism, not the tetralemma.
  *   **The Patch:** Force simultaneity. "Using Property #1, show how the tower is *fully* existent and *fully* non-existent in the *same* respect." When they fail (they will), highlight that failure. That failure is the point.

  **3. Rule-Breaking (Semantic Drift)**
  *   **What happens:** Writers are meaning-makers. They will redefine "shadow" or "memory" mid-game to save their argument.
  *   **The Patch:** Freeze the definitions after Phase 1. If someone says, "Well, memory implies..." stop them. "What did we write on the Charter? Just 'citizens remember the future.' Don't import 'memory implies past.'" The friction comes from the rigidity.

  **4. The "Fifth Box" Error**
  *   **What happens:** In the debrief, someone will ask, "So what's the answer? Is the city empty?" treating "Empty" as the correct answer box.
  *   **The Patch:** Correct this immediately. "Emptiness is not the answer. Emptiness is the realization that the question was malformed. If you put 'Empty' in a box, you've just made a new idol."

  ---

  ### What This Exercise Cannot Do (The Facilitator's Burden)

  You need to be frank with yourself about the limitations of this game. It is a conceptual simulation of a non-conceptual realization.

  **1. It Cannot Produce *Pratītyasamutpāda* (Dependent Origination)**
  *   **The Gap:** The game shows logical contradiction. It does not show *causal dependency*. In Madhyamaka, things are empty *because* they depend on other things, not just because logic breaks. The game makes emptiness look like a paradox puzzle.
  *   **Your Supply:** In the debrief, you must bridge this. "Logic broke today. But in your novel, the ghost isn't empty because of logic. She is empty because she depends on the monk's grief to appear. If the monk stops grieving, does the ghost exist? No. Is she fake? No. She is dependent. That is the warmth emptiness lacks in this game."

  **2. It Cannot Reproduce the *Soteriological Relief***
  *   **The Gap:** The point of the tetralemma isn't intellectual gymnastics; it's the cessation of suffering (duḥkha) caused by clinging to views. This game might just make them frustrated or tired.
  *   **Your Supply:** You need to narrate the "letting go." "Notice the moment you stopped trying to win. When the chips were gone, did you feel lighter? Or just annoyed? In the practice, that moment of dropping the view is where the suffering stops. Your monk shouldn't feel smart when she breaks the categories; she should feel relieved."

  **3. It Risks Reinforcing Nihilism**
  *   **The Gap:** If you destroy all four corners without rebuilding "Conventional Truth," writers will walk away thinking "Nothing is real, so why write?"
  *   **Your Supply:** You must explicitly validate the "Two Truths." "The city doesn't exist inherently (Ultimate), but you can still walk its streets (Conventional). Your ghost is not inherently real, but she still haunts the house. Do not write the ghost away. Write the haunting."

  ### Final Facilitator Script (for the last 2 minutes)

  "You just spent 40 minutes trying to pin a city down with words, and the words slipped. That slip is where your novel lives. Your monk isn't trying to solve the ghost. She is trying to stop using 'existence' as a weapon against her grief. When the categories break, she doesn't find a truth. She finds her sister. Run the game, break the rules, then throw the chips away."
