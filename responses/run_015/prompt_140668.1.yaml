  Uniform experience builds the case,
  That death is final, nature's steady law.
  No risen soul can show its living face,
  Nor breach the course that all men always saw.
  Let scepticism weigh the evidence,
  Against the tide of uniform event.
  The law of nature stands, a strong defence,
  Where probability is firmly spent.
  Yet grant the Leith quay crowds of honour speak,
  Men of endeavour, where the sailor rose.
  If falsehood makes experience seem quite weak,
  It weighs more heavy than the life it shows.
  Both miracles destroy each other's force,
  It leaves remainder, not belief's full course.
