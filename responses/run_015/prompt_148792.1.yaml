          *   Does it relocate it? Yes, into the "motivational filter." How does the filter know what to block without "knowing" the content? This is the "censor" problem (Freud).
          *   *Verdict:* It solves the synchronic contradiction of *avowal* but risks a synchronic contradiction of *functional role*.

      *   **2. Relation to Existing Accounts:**
          *   *Davidson:* He uses partitioning to avoid contradiction. You have two "structures." This proposal says one structure, different access modes. That's a substantive difference (unity of agency).
          *   *Mele (Deflationary):* Mele says no belief in $p$ at $t_2$, just bias in evidence gathering. This proposal says belief in $p$ *is* there, just inaccessible. This is *inflationary* compared to Mele.
          *   *Freud/Unconscious:* Very close to the dynamic unconscious. The "archive" is the unconscious. The "executive" is the conscious. Need to distinguish from standard psychoanalytic models (perhaps via the "write-only" technical specificity).
          *   *Verdict:* It's a specific functionalist refinement of partition theories, avoiding the "sub-agent" pitfall.

      *   **3. The Analogy's Limits:**
          *   Beliefs aren't static data. They are dispositional states.
          *   "Write-only" implies input is easy, output is hard. In self-deception, usually, the input is *resisted* (denial). The proposal says input happens at $t_1$, then blocked. This fits "repression" better than "denial."
          *   *Risk:* Reification. Treating belief as a file suggests it doesn't change. But beliefs integrate. If the archive is isolated, does it update? If it updates, how?
