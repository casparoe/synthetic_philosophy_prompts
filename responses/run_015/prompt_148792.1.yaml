      *   *Key Differentiator:* The "Write-Only" aspect. Most models focus on the *formation* bias. This focuses on the *retrieval* architecture of an *existing* belief. That is the novelty hook.
      *   *Critique:* Need to ensure the distinction between "retrieval failure" (forgetting) and "motivational retrieval inhibition" is clear.

  6.  **Synthesize and Structure the Response:**
      *   **Tone:** Professional, rigorous, constructive, peer-review style.
      *   **Structure:**
