  ok so im writing this essay for my politics/philosophy class and i need to check if my thoughts on weber actually hang together or if im just contradicting myself. heres what i think:

  (1) weber is basically right that calvinist ideas about predestination accidentally made people work like maniacs and that built modern capitalism
  (2) but i also think culture is never the real cause of big historical stuff - its always material conditions like trade routes or technology hiding underneath
  (3) i think social science should stay value-neutral and not explain events by saying people believed x so y happened
  (4) i think capitalism was probably inevitable once double-entry bookkeeping and joint-stock companies existed, regardless of religion
  (5) i think religious belief is mostly just people trying to feel safe about death, so it doesnt actually change economic behaviour
  (6) also i have this side idea that the protestant work ethic was really just about banning saints days and holidays so people worked more days per year

  do these fit? is (1) dead on arrival with (2) and (4)? does (3) rule out (1) or can they live together? and where does (6) land - does it destroy (1) from the inside? please answer in british english. rank the tensions by severity, say which pair is only apparently fighting, and tell me the cheapest single revision that fixes the most damage. dont just lecture me about weber - audit MY list specifically.
