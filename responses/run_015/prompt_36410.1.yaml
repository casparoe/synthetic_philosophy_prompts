answer: |-
  This is a classic philosophical trap. The phrase "you only see what it looks like" is a chameleon; it changes color depending on how much pressure you put on it. Your friend is sliding between a trivial truth and a controversial metaphysical claim without noticing the switch.

  To push back effectively, you need to force them to pick a specific lane. Here are the four distinct theses hiding inside that one-liner, ranked from trivial to metaphysically loaded.

  ### 1. The Phenomenal Thesis (Trivial)
  **Claim:** "Perception has a subjective character. There is 'something it is like' for you to see a tomato."
  *   **Plausibility:** True. Almost everyone accepts that experience has a qualitative feel (qualia).
  *   **Does it lead to Sense-Data?** **No.** Acknowledging that seeing feels a certain way does not mean you are seeing a *mental object* called a "feeling." When I see a tree, there is something it is like, but the object of my awareness is still the tree.
  *   **Verdict:** Your friend can have this, but it gets them nowhere near their conclusion.

  ### 2. The Causal Thesis (Weak)
  **Claim:** "Your visual experience is causally mediated by light, nerves, and brain states. You don't see the object *directly* in the sense of bypassing these mechanisms."
  *   **Plausibility:** True. Science confirms perception is a causal process.
  *   **Does it lead to Sense-Data?** **No.** This commits the "fallacy of the veil." Just because there is a causal chain between me and the moon doesn't mean I see the *chain* rather than the *moon*. I hear a voice through a telephone, but I say I am hearing my friend, not the electrical signals.
  *   **Verdict:** Your friend can have this too. It establishes dependency, not intermediacy.

  ### 3. The Epistemic Thesis (Moderate)
  **Claim:** "From the inside, a perfect hallucination is indistinguishable from a veridical perception. You cannot know by introspection alone which one you are having."
  *   **Plausibility:** Plausible. Most people grant that subjectively, they feel the same.
  *   **Does it lead to Sense-Data?** **Not necessarily.** This is the pivot point. This claim is about *knowledge* (epistemology), not *existence* (ontology). It says you can't tell the difference, not that the two things *are* the same thing.
  *   **Verdict:** Your friend needs this premise, but on its own, it doesn't force the conclusion. It only forces the conclusion if they smuggle in the next thesis.

  ### 4. The Ontological Thesis (Strong / The "Common Kind" Assumption)
  **Claim:** "Because the two states are indistinguishable, the *immediate object of awareness* must be identical in kind in both cases. Since there is no tomato in the hallucination, there is no tomato (as an immediate object) in the veridical case either."
  *   **Plausibility:** **Highly Controversial / Likely False.** This assumes that subjective indistinguishability entails ontological identity. It assumes the "Highest Common Factor" between a real sighting and a fake one is the *whole* of the experience.
  *   **Does it lead to Sense-Data?** **Yes.** This is the engine of the Argument from Illusion. If the immediate object isn't the physical tomato (because it might not exist), it must be a mental surrogate (sense-datum, representation, etc.).
  *   **Verdict:** This is the claim that does the heavy lifting.

  ---

  ### The Commitment: What the Argument Needs and Whether It's True

  You asked me to commit. Here is the diagnosis:

  **The Argument from Illusion genuinely needs Thesis 4 (The Ontological/Common Kind Thesis).**
  Without Thesis 4, the argument collapses into Thesis 3 (Epistemic), which allows for the possibility that in the veridical case, you are related to a tomato, and in the hallucination, you are related to nothing, even if you can't tell the difference. Thesis 4 is required to move from "they look the same" to "they *are* the same kind of mental relation."

  **Is Thesis 4 True?**
  **No.** It is an unmotivated assumption.
  There is no logical contradiction in saying: "Two things can be subjectively indistinguishable to the subject while having fundamentally different metaphysical structures."
  *   *Analogy:* A real diamond and a perfect cubic zirconia might be indistinguishable to the naked eye. It does not follow that what you are looking at in both cases is "a gemstone-appearance" rather than a mineral in one case and a synthetic in the other. The nature of the object is determined by its history and constitution, not just its current look to an observer.

  Therefore, the Argument from Illusion relies on a false premise: that the *nature* of experience is exhausted by how it feels from the inside.

  ---

  ### Is Disjunctivism the Only Escape?

  Your friend might say: "Okay, so you're a Disjunctivist then? You think the hallucination is a totally different kind of mental state?"

  **No, Disjunctivism is not the only escape.**
  Disjunctivism (associated with John McDowell and M.G.F. Martin) is the most famous rejection of Thesis 4, but it is the most radical. It says the veridical case and the hallucination share *no* fundamental mental kind.

  However, you can accept Thesis 3 (Indistinguishability) and reject Thesis 4 (Common Object) without going full Disjunctivist. Here are two other ways to block the move to Sense-Data:

  **1. Intentionalism (Representationalism)**
  *   **The Move:** You accept that the *experience* is the same kind of mental state in both cases (rejecting Disjunctivism), but you deny that this state involves an *object*.
  *   **How it works:** Experience is not a relation to an object (like seeing a tomato); it is a representation of a state of affairs (like believing a tomato is there).
  *   **Why it blocks Sense-Data:** When I hallucinate, I am not seeing a "mental tomato." I am in a state that *represents* a tomato. When I see a real tomato, I am in a state that *represents* a tomato, and a tomato actually exists. The "object of awareness" is the content (the tomato), not a mental proxy.
  *   **Verdict:** This accepts the "Common Kind" of *state*, but denies the "Common Kind" of *object*. It saves the intuition that hallucinations are mental glitches without forcing you to say veridical perception is also a mental glitch.

  **2. Adverbialism**
  *   **The Move:** You deny that "seeing" is a transitive verb requiring an object at all.
  *   **How it works:** You don't "see a red sense-datum." You "sense redly." The modification happens to *you*, not to an object in your mind.
  *   **Why it blocks Sense-Data:** In both hallucination and veridical cases, you are sensing in a certain way. In the veridical case, that way is caused by a tomato. In the hallucination, it is not. There is no "object" in either case to be the common factor.
  *   **Verdict:** This dissolves the problem by changing the grammar of perception.

  ### Summary for Your Reading Group

  To win the argument, do not get bogged down in the science of light or nerves. Pin your friend on the **inference from Epistemic to Ontological**.

  **Say this:**
  > "You are moving from 'I can't tell the difference' (Epistemic) to 'The object of awareness must be the same' (Ontological). That only works if you assume the nature of experience is defined entirely by how it feels from the inside. But that's exactly what's in question.
  >
  > If I accept your premise, I'm forced into Sense-Data theory. But I can accept that hallucinations feel real without agreeing that veridical perception is *also* just an internal show. I can say that in the good case, I am directly aware of the world, and in the bad case, I am merely seemed-to. They feel the same, but they aren't the same kind of relation. That blocks the need for mental intermediaries without denying the possibility of illusion."

  **The Bottom Line:** The Argument from Illusion is not a proof; it is a choice. It forces you to choose between **Direct Realism** (Disjunctivism) or **Indirect Realism** (Sense-Data/Representationalism). It does not prove Indirect Realism is true; it only proves it is *one coherent way* to handle hallucinations. Since Direct Realism (via Disjunctivism or Intentionalism) is also coherent, the argument fails to compel the conclusion that "you never see the object itself."
