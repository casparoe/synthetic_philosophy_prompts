      *   **Opponent's Claim:** "You never see the object itself, only what it looks like to you." (Standard AfI move: Indistinguishability $\rightarrow$ Common Factor $\rightarrow$ Sense-Data/Representationalism).
      *   **Goal:** The user wants to push back but needs clarity on *exactly* what the one-liner means.
