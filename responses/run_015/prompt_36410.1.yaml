      *   *Thesis 3 (Epistemic/Indistinguishability):* I can't tell veridical from non-veridical cases by introspection alone. (Plausible, but doesn't entail ontological identity).
      *   *Thesis 4 (Ontological/Common Factor):* The *immediate object of awareness* is identical in type across veridical and non-veridical cases. (This is the killer premise).

