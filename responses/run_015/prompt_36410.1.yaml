      *   *Premise 2:* Veridical perception and illusion/hallucination can be subjectively indistinguishable.
      *   *Intermediate Conclusion:* Therefore, what we are immediately aware of is the same in both cases (The Common Kind Assumption).
      *   *Final Conclusion:* Therefore, even in veridical cases, we are immediately aware of mental intermediaries (sense-data, representations), not the object itself.

  3.  **Drafting the Theses (Weak to Strong):**
      *   *Thesis 1 (Trivial/Phenomenological):* Perception has a subjective character. Things look a certain way to me. (True, but doesn't imply intermediaries).
