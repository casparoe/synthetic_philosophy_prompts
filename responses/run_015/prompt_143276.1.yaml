      *   *Philosophers:* Care about conceptual clarity, power dynamics, medicalization of life, Szasz's legacy. They know Szasz's biological claims were weak but like his political critique.
      *   *The Tension:* If I say MI isn't a disorder, clinicians hear "don't treat it." If I say Szasz was right, philosophers hear "biological reductionism is bad." I need to walk the line: *Validate the suffering, reject the diagnosis.*

