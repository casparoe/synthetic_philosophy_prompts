answer: |-
  Here is a formalized decision procedure based on your instincts, refined for administrative defensibility, philosophical consistency, and operational reality.

  ### Part 1: The Operational Sentience & Welfare Protocol (OSWP)

  This protocol is designed to be completed in 40 minutes using available literature and farm observation. It generates the text required for your half-page justification.

  **Tier System:**
  *   **Tier 1 (Full Coverage):** Code applies. Welfare restrictions enforceable.
  *   **Tier 2 (Monitor):** Code applies lightly (handling/harvest only). No restrictive practices, but requires data logging.
  *   **Tier 0 (Excluded):** Code does not apply.

  #### Step 1: Neuroanatomical Filter (The "Hardware" Check)
  *   **Question:** Does the species possess a centralised nervous system (CNS) or distinct ganglia capable of integrating sensory input?
  *   **Evidence:** Anatomical summaries, supplier specs.
  *   **Yes:** Proceed to Step 2.
  *   **No:** Proceed to Step 3 (Uncertainty Zone). *Note: Do not stop here. "No brain" is not an automatic "No coverage" under your precautionary instinct.*
  *   **Auditor Note:** Distinguish between diffuse nerve nets (e.g., jellyfish, sponges) and ganglia (e.g., bivalves, insects).

  #### Step 2: Behavioral Marker Assessment (The "Software" Check)
  *   **Question:** Is there peer-reviewed evidence of **Motivational Flexibility**?
  *   **Definition:** The animal modifies its behavior to avoid a noxious stimulus *even when doing so conflicts with another motivation* (e.g., feeding, mating, shelter), OR seeks analgesia when injured.
  *   **Sufficient Yes:**
      *   Trade-off demonstrated (e.g., crab sacrifices shelter to avoid shock).
      *   Wound guarding or rubbing.
      *   Self-administration of pain relief (if chemically possible).
  *   **Insufficient Yes (Do Not Count):**
      *   Simple reflex withdrawal (nociception).
      *   Classical conditioning (learning to avoid a cue without evidence of affective state).
  *   **Yes:** Assign **Tier 1**. Stop.
  *   **No/Unclear:** Proceed to Step 3.

  #### Step 3: The Uncertainty Zone (Precautionary Weighting)
  *   **Question:** Is there significant scientific disagreement or data scarcity regarding Step 1 or 2?
  *   **Procedure:** Apply the **Suffering-Cost Weighting**.
      *   If the biological plausibility of sentience is >10% (not zero), AND the cost of welfare measures is not existential to the supplier:
      *   **Action:** Assign **Tier 2 (Monitor)**.
      *   **Justification:** "Evidence insufficient for Tier 1, but uncertainty warrants precautionary monitoring."
  *   **If biological plausibility is negligible (e.g., Sponges):** Assign **Tier 0**.

  #### Step 4: The Value Hand-Off (Retailer Sign-Off)
  *   **Trigger:** Any decision that assigns **Tier 1** to a new species OR assigns **Tier 2** to a currently farmed species (like your shellfish).
  *   **Action:** The written justification must explicitly state: *"This classification prioritizes potential welfare risk over operational cost."*
  *   **Requirement:** Retailer Technical Director signature. This acknowledges that the committee is making a *value* judgment, not just a scientific one.

  #### Revisability Trigger
  *   **Automatic Review:** If a new peer-reviewed study is published that directly contradicts the Step 2 assessment (e.g., demonstrates motivational flexibility in a Tier 0 species), the species is automatically bumped to **Tier 2** pending committee review within 30 days.
  *   **Scheduled Review:** All Tier 2 classifications are reviewed every 24 months.

  ---

  ### Part 2: Philosophical Simplifications & The "Proxy" Objection

  **What We Keep:**
  1.  **Nociception vs. Suffering:** We retain the distinction between reflex (Step 2 "Insufficient") and affective experience (Step 2 "Sufficient"). This is the core of modern welfare science.
  2.  **The Precautionary Principle:** We retain your instinct to weight suffering heavier than cost in uncertainty (Step 3).

  **What We Drop:**
  1.  **Consciousness/Phenomenology:** We do not attempt to prove the animal "feels" pain in a human sense. We regulate based on *behavioral evidence* of feeling.
  2.  **Moral Status:** We do not decide if the animal *deserves* rights. We decide if it fits the *regulatory definition* of a welfare subject.

  **Answering the "Proxy" Critic:**
  Your committee member is philosophically correct but operationally wrong. We care about suffering (the thing itself), but suffering is private and unobservable. We *must* use proxies (neuroanatomy, flexibility) to enforce a code.
  *   **The Fix:** The protocol explicitly acknowledges this limitation in the written justification. You are not certifying "Truth"; you are certifying "Defensible Risk Management." The procedure admits it may misclassify, but provides a mechanism (Revisability) to correct it. This disarms the critic: you agree with him, but you have a job to do.

  ---

  ### Part 3: Test Run on Five Cases

  #### 1. Decapod Supplier (New Application)
  *   **Step 1:** Yes (Complex CNS).
  *   **Step 2:** Yes (Strong evidence of trade-offs, wound guarding, analgesic seeking in crabs/lobsters).
  *   **Step 3:** N/A.
  *   **Result:** **Tier 1 (Full Coverage).**
  *   **Justification:** Meets neuro and behavioral criteria. Standard welfare restrictions apply (stunning before cook, etc.).

  #### 2. Oysters & Mussels (Existing Farm)
  *   **Step 1:** Borderline. They have ganglia, but no centralised brain. (Pass to Step 2).
  *   **Step 2:** No. Evidence shows reflex closure and habituation, but no robust evidence of motivational trade-offs or analgesic seeking.
  *   **Step 3:** Uncertainty is high. Plausibility is not zero. Cost of "Monitor" tier is low (logging handling times/temps).
  *   **Result:** **Tier 2 (Monitor).**
  *   **Justification:** "Neuroanatomy present but simple. Behavioral evidence for suffering insufficient for Tier 1. Precautionary principle applied due to data gaps. Requires handling logs, no restrictive practice changes."

