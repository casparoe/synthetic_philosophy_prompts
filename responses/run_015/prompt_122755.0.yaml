  ### Part 4: The Unpleasant Outcome

  **The Case:** **The Oysters and Mussels (Your Family Farm).**

  **The Outcome:** The procedure assigns them **Tier 2 (Monitor)**, not Tier 0 (Excluded).

  **Why You Won't Like It:**
  Your instinct was a flat "no centralised brain, no coverage." You likely wanted a clean ethical exoneration (Tier 0) to align with business interests and your initial gut feeling. This procedure denies you that comfort. It forces you to admit that while there is no *proof* they suffer, there is insufficient proof that they *don't*.

  By applying your own **Precautionary Principle** (weighting suffering heavier than cost) consistently, the procedure drags your own product into the regulatory net. You cannot use this code to claim "Mussels don't feel pain." You can only claim "We don't know, so we are watching."

  **Why The Procedure Is Still Right:**
  1.  **Consistency:** If you exclude bivalves based on "uncertainty" while including unknown species based on "uncertainty," you are open to charges of conflict of interest. The procedure treats your family's stock the same as a new entrant.
  2.  **Defensibility:** If future science proves bivalves do suffer (neuroscience is moving fast), a Tier 0 decision makes you liable for negligence. A Tier 2 decision protects you; it shows you acknowledged the risk and monitored it.
  3.  **The "Proxy" Truth:** It validates the committee member's critique. We are using proxies. Since the proxy (neuroanatomy) is ambiguous in bivalves, we cannot claim certainty. The procedure forces you to live with the ethical ambiguity rather than hiding behind a false "No."

  **Operational Note:** Tier 2 is low-burden (logging), so it protects the business viability while satisfying the ethical weight. It is the only outcome that lets you sleep at night without lying to the auditors.
