answer: |-
  Imagine a distributed cluster consisting of two worker nodes, Alice and Bob, operating in a strictly asynchronous environment. At system initialization (time $t_0$), a coordinator distributes a shared correlation seed $\lambda$ to both nodes. In your vocabulary, this is a shared configuration blob or a pre-distributed random tape that is written to local persistent storage and marked immutable. No further updates to $\lambda$ are permitted via message passing. This seed represents the "local hidden variable."

  The system then enters a consensus round. During this round, the network partition guarantee is enforced: spacelike separation is modeled as a strict firewall rule preventing any message packets from traversing between Alice and Bob before the round completes. Within this isolated window, each node receives an independent input parameter, $x$ for Alice and $y$ for Bob. These inputs are treated as external client requests or local sensor readings. The "free choice" assumption maps to your security model regarding input integrity: you must assume the input generator is not compromised by an adversarial scheduler that has read-access to the immutable seed $\lambda$. If the scheduler knows $\lambda$ and selects $x$ and $y$ to correlate with it, the security model is broken; similarly, in physics, if the measurement settings are causally influenced by the hidden variable, the test is invalid.

  Upon receiving inputs, each node executes a local deterministic or probabilistic function based solely on its cached state ($\lambda$) and its local input ($x$ or $y$). Alice computes output $a$, and Bob computes output $b$. These outputs are written to a joint audit log. In a classical distributed system governed by local realism, the correlation between $a$ and $b$ across many rounds is bounded by the information capacity of $\lambda$ and the prohibition on messaging. This bound is the CHSH inequality. It is a theorem stating that no algorithm running on this architecture—shared seed, no messaging, independent inputs—can produce a correlation metric $S$ greater than 2.

  However, when you run this experiment with quantum systems, the joint output logs consistently show $S \approx 2.82$. In distributed systems terms, this is a critical consistency violation. The logs demonstrate statistical dependencies that exceed the bandwidth of the shared seed $\lambda$ without any evidence of message passing (signaling) during the round. To reconcile this within your vocabulary, you are forced into three distorting explanations: either messages *did* traverse the partition (violating locality/spacelike separation), the seed $\lambda$ was not immutable but was updated instantaneously across the network (violating the no-update constraint), or the input generator was adversarial and colluded with the seed (violating free choice/input independence).

  This brings us to the residue report. The translation of the **shared seed model** is clean; it maps perfectly to pre-distributed randomness or shared configuration. The **message-passing prohibition** is also clean; it maps to network partitions or latency guarantees ensuring no causal influence during the computation window. The **free-choice assumption** translates cleanly to input independence from internal state, a standard security requirement. The **statistical violation**, however, reveals the structural limit of your vocabulary. In distributed systems theory, correlation implies causation: either a common cause (the seed) or direct communication (messages). There is no third category. Quantum mechanics asserts a form of correlation—entanglement—that is neither common cause nor communication. It is a state where the nodes do not possess definite individual outputs prior to the consensus round, yet their joint outputs are correlated beyond the classical limit.

  Your intuition that this is a problem about shared randomness versus message delay is correct regarding the *classical* explanations (the hidden variable debate), but it misses the structural break because distributed systems theory is built on classical causal graphs. Your vocabulary assumes "local realism": that state exists independently of observation (realism) and influences propagate locally (locality). Quantum mechanics violates local realism. The residue is not an ambiguity in the physics claim; the experimental violations are robust. The residue is a limitation of the target vocabulary. Your framework lacks a primitive for "non-separable state." In your model, the system state is always the tuple of local states plus messages in flight. In quantum mechanics, the system state is a vector in a joint Hilbert space that cannot be factored into local states. When you force this into your vocabulary, you must distort it into "magic messaging" or "superdeterministic scheduling," because your vocabulary cannot express a correlation that does not reduce to shared seed or message passing.

