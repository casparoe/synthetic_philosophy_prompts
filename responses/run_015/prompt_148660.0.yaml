answer: |-
  This is the right pivot. Cases are data points; specifications are the theory's job description. If you don't define the job, you can't fire the theory that fails it.

  Here is the specification for a theory of stakes-sensitivity, sorted into your three buckets, followed by the critique of your starting list, the incompatibilities, and the scorecard.

  ### Part 1: The Specification (Desiderata)

  #### Bucket I: Genuine Adequacy Conditions
  *Any view claiming to offer a semantics/pragmatics for 'knows' must meet these to be a viable theory of the concept.*

  1.  **Compositional Stability (The Embedding Constraint):** The theory must specify the truth-conditions of 'S knows that p' when embedded under conditionals, attitude verbs, and modals without resorting to *ad hoc* context-shifts that break logical form. (Refines your **f** and addresses your friend's worry).
  2.  **Stakeholder Identification:** The theory must non-arbitrarily identify *whose* practical situation determines the truth-value: the subject's, the attributor's, the audience's, or a community standard. It must handle cases where these come apart (e.g., low-stakes subject, high-stakes attributor). (Refines your **c** and answers your supervisor).
  3.  **Semantic/Pragmatic Division of Labor:** The theory must explicitly state whether stakes affect the *semantic content* of 'knows' (truth-conditions) or the *pragmatics* of its use (assertability/warrant). It cannot hide the mechanism. (Refines your **a**).
  4.  **Determinacy in Loops:** The theory must assign a truth-value to self-fulfilling or looping attributions (your **d**) without collapsing into indeterminacy, or explicitly argue why indeterminacy is a feature, not a bug.
  5.  **Evidence/Stakes Distinction:** The theory must distinguish between *raising the evidential bar* (requiring more evidence) and *lowering the knowledge bar* (requiring less evidence due to urgency). It must predict the correct verdict in "emergency/no-time" cases (your **e**).

  #### Bucket II: Conditional Adequacy Conditions
  *Non-negotiable only if the theory commits to specific wider epistemic or semantic doctrines.*

  6.  **The Knowledge Norm Condition:** If the view accepts Knowledge is the Norm of Assertion (KNA) or Practical Reasoning (KNPR), it must explain why stakes change *knowledge* rather than just changing the *permission to assert/act*. (Refines your **a** and **e**).
  7.  **The Disagreement Condition:** If the view claims interlocutors with different stakes are having a genuine disagreement (not talking past each other), it must provide a shared proposition they are disagreeing *about*. (Refines your **c**).
  8.  **The Skeptical Pressure Condition:** If the view aims to explain the pull of skepticism, it must show how high-stakes contexts generate skeptical doubt without rendering ordinary low-stakes knowledge attributions false or meaningless. (Refines your **h** time-travel/assessment worry).
  9.  **Vocabulary Uniformity:** If the view claims 'knows' is stakes-sensitive, it must explain whether co-extensive epistemic vocabulary ('certain', 'warranted', 'justified') shifts in tandem or remains fixed. (Refines your **f**).

  #### Bucket III: Prejudice (Bad Demands)
  *Demands that reflect intuition-pumping or tradition rather than theoretical virtue.*

  10. **The "Save the Intuition" Demand:** The requirement that the theory must validate the theorist's specific pre-theoretic verdict on the Bank Case (or any single case). (Garbage version of **a**).
  11. **The "Traditionalist" Demand:** The requirement that knowledge must remain a purely epistemic relation (evidence/truth/belief) unaffected by practical facts, simply because "that's what knowledge is." (Begs the question against PE).
  12. **The "Sharp Threshold" Demand:** The requirement that there must be a precise cutoff for knowledge (your **g**), rather than accepting vagueness or gradability inherent in natural language predicates.
  13. **The "Legal Analogy" Demand:** The requirement that the theory must align with legal standards of evidence (your **h** legal point). Law is normative and institutional; ordinary knowledge is not. Alignment is a bonus, not a constraint.

  ---

  ### Part 2: Critique of Your Starting List (a–h)

  *   **Real Desiderata:** (a), (c), (e), and the embedding part of (f) are core. They define the phenomenon and the linguistic machinery.
  *   **Two Entries Wearing a Coat:**
      *   **(a) and (e)** are the same constraint tested in different environments. Both ask: "Is the shift in *knowledge* or in *action norms*?" Merge them into **Bucket I.5**.
      *   **(c) and (h-Time-Travel)** are both about *Assessment Sensitivity*. Both ask: "Who sets the standard?" Merge them into **Bucket I.2**.
      *   **(f) and (g)** are both about *Semantic Behavior*. One asks about siblings (certain/sure), the other about gradability. Keep distinct but group under Semantic Stability.
  *   **Missing:**
      *   **The Mechanism Constraint:** You need a desideratum demanding the theory explain *how* stakes interact with evidence. (Is it a multiplier? A threshold shifter? A blocker?).
      *   **The Factivity Constraint:** If knowledge is factive, stakes cannot make a false proposition known. A PE theory must ensure stakes don't override truth.
  *   **Garbage/Prejudice:**
      *   **(h) Legal:** As noted in Bucket III, legal standards are poor proxies for ordinary epistemology.
      *   **(d) Looping:** This is fascinating but niche. It's a stress test for **Determinacy**, not a standalone desideratum for a general theory. Keep it as a test case for Bucket I.4.

  ---

  ### Part 3: Incompatibilities (The "Gold" for your Paper)

  You asked for pairs or subsets that cannot be jointly satisfied. These are the theoretical fault lines.

  **1. The "Disagreement vs. Stakes-Sensitivity" Trilemma**
  You cannot jointly satisfy:
  *   (i) **Stakes-Sensitivity:** Truth of 'S knows' varies with practical stakes.
  *   (ii) **Genuine Disagreement:** Attributor and Subject (or two Attributors) can genuinely disagree about 'S knows' even if stakes differ.
  *   (iii) **Propositional Stability:** They are disagreeing about the same proposition.
  *   *Why:* If truth varies with stakes (i), and stakes differ between speakers, they assert different propositions. If they assert different propositions, they aren't disagreeing (iii). If you insist they *are* disagreeing (ii), you must abandon simple stakes-sensitivity (i) or adopt Relativism (which changes the semantics of truth itself).

  **2. The "Embedding vs. Contextual Shift" Tension**
  You cannot jointly satisfy:
  *   (i) **Standard Compositional Semantics:** Embedded clauses inherit context from the point of utterance or are fixed at the point of embedding.
  *   (ii) **Radical Contextualism:** The standard for 'knows' shifts freely with the *current* conversational stakes.
  *   (iii) **Intuitive Truth-Values in Conditionals:** "If I know the bank is open, I will go" (said in low stakes) should remain true even if evaluated in a high-stakes context.
  *   *Why:* If 'knows' shifts with current stakes (ii), the conditional's truth-value flips when you walk into a high-stakes room, breaking standard logic (i). Fixing this usually requires making the standard fixed at the time of utterance, which kills the ability to explain retrospective assessment (your time-travel worry).

  **3. The "Normative vs. Descriptive" Clash**
  You cannot jointly satisfy:
  *   (i) **Descriptive Adequacy:** The theory matches ordinary usage (where we sometimes say "I know" in high stakes if we have overwhelming evidence).
  *   (ii) **Strong Encroachment:** High stakes *always* raise the threshold for knowledge.
  *   (iii) **Knowledge Norm of Action:** You can only act on p if you know p.
  *   *Why:* If stakes are high and evidence is fixed, Strong Encroachment says you don't know. If you don't know, the Knowledge Norm says you can't act. But ordinary usage says you *can* act and *do* know if the evidence is strong enough. You have to drop one: either knowledge doesn't encroach that hard, or the norm of action isn't knowledge.

  ---

  ### Part 4: The Most Exclusionary Requirement

  **Bucket I.2: Stakeholder Identification (specifically combined with Bucket I.1: Compositionality).**

  This is the killer. Most theories fail here.
  *   **Subject-Sensitive Invariantism (SSI/IRI)** fails the **Disagreement** test (Bucket II.7). If truth depends on the *subject's* stakes, the attributor's high stakes shouldn't change the truth, but intuitively we hesitate to attribute knowledge to the subject if *we* (the attributors) are in a high-stakes context regarding that proposition.
  *   **Attributor-Contextualism** fails the **Embedding/Disagreement** test. If truth depends on the *attributor's* context, we talk past each other when stakes differ, and embedded clauses in belief reports become nightmares to formalize (your friend's worry).
  *   **Relativism** saves Disagreement but pays a heavy price in **Semantic Complexity** (Bucket I.1), requiring a post-semantics of assessment that many formal semanticists reject as non-standard.

  If you force a theory to specify *whose* stakes matter *and* show how that works inside a conditional without breaking logic, you eliminate 80% of the literature.

  ---

  ### Part 5: View Scorecard

  **Attributor-Contextualism**
  *   *Pros:* Handles skepticism well; keeps semantics standard.
  *   *Cons:* Fails Disagreement (talk past each other); struggles with embeddings (your friend's worry); makes "whose stakes" too easy (always attributor).
  *   *Verdict:* Semantically safe, epistemically costly.

  **Subject-Sensitive Invariantism (IRI/SSI)**
  *   *Pros:* Handles "whose stakes" clearly (Subject's); preserves disagreement.
  *   *Cons:* Fails to explain why *Attributor's* high stakes make us hesitate to attribute; struggles with the "Time-Travel" assessment data.
  *   *Verdict:* Metaphysically clean, phenomenologically inaccurate.

  **Relativism (Assessment-Sensitive)**
  *   *Pros:* Solves Disagreement and Time-Travel/Retraction perfectly.
  *   *Cons:* High semantic cost (non-standard truth predicates); struggles with the "Embedding Constraint" in complex sentences.
  *   *Verdict:* Best fit for data, hardest fit for semantics.

  **Purism (Invariantism + Pragmatics)**
  *   *Pros:* Preserves traditional semantics and factivity; clears the Embedding constraint easily.
  *   *Cons:* Must explain away all PE data as pragmatic implicature (hard to do for "I don't know" in high stakes); fails the "Norm of Action" job.
  *   *Verdict:* Semantically robust, explanatorily weak on PE data.
