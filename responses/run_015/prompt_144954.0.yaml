answer: |-
  Here is the battle plan. You have twenty minutes and a room full of skeptics who eat logical fallacies for breakfast. Your goal isn't to teach them philosophy; it's to trap them in the same intuition pump that trapped Hempel.

  ### 1. The Order: Logic Last, Not First
  **Do not start with the Equivalence Condition.** If you state "Logically equivalent statements share evidence" as a premise in minute one, the data folks will treat it as an axiom to be challenged, and the philosopher-blogger will start nodding smugly. It feels like a trick because it *is* a trick if presented as a rule.

  **The Sequence:**
  1.  **The Intuition (Min 0–5):** Establish that observing a Black Raven confirms "All Ravens are Black." Get unanimous nodding.
  2.  **The Translation (Min 5–10):** Ask *them* to rewrite the statement logically. Don't tell them the contrapositive. Ask: "If I say 'All R are B', what must be true about a non-Black thing?" Let *them* write `¬Black → ¬Raven` on the board.
  3.  **The Collision (Min 10–15):** Apply the intuition from step 1 to the statement in step 2. If a Black Raven confirms the first, what confirms the second? A White Shoe.
  4.  **The Dissolution (Min 15–20):** Address *why* it feels wrong (Information Weight) and where Dave is right (Finite Worlds).

  **Why this works:** By making them derive the contrapositive, you remove the "verbal trick" accusation. They built the trap themselves.

  ### 2. The Carrying Example: Stick to Ravens
  **Do not swap to "Every request returns in under 200ms."**
  You are right to suspect this smuggles in differences. In engineering, "evidence" is tied to *sampling methodology*.
  *   If you check a request and it's <200ms, you confirm the rule.
  *   If you check a request and it's >200ms, you falsify it.
  *   But what is the "non-slow request"? A database migration? A user clicking a button? The class of "non-slow things" in a system is ill-defined compared to "non-black things."

  Engineers will spend 10 minutes arguing about whether a 201ms request counts as a counter-example or a measurement error. **Ravens are abstract enough to prevent domain pedantry.**
  *   *Compromise:* If you must ground it, use **"All Critical Bugs are Tagged P0."**
      *   Equivalent to: **"All Non-P0 Tags are Non-Critical Bugs."**
      *   Evidence: Finding a Feature Request (Non-P0) that is not a Bug (Non-Critical).
      *   *Risk:* They will argue about tagging hygiene. Stick to Ravens if you can keep it light. If you use Bugs, warn them: "Assume perfect tagging, no measurement error."

  ### 3. Dave's Objection: The Finite Bag
  **Is he right?** Partially. In a finite population (a bag of 100 tiles), observing a white shoe *does* confirm the hypothesis, but the *degree* of confirmation depends entirely on your sampling method.
  *   If you pick a random **object** from the bag and it's a white shoe: Yes, it slightly increases the probability that all ravens are black (you eliminated one potential non-black non-raven).
  *   If you pick a random **non-black object** from the bag and it's a shoe: It provides *no* evidence about ravens.

  **Where does it fit?** **At the very end.**
  If you put the finite bag at the start, the paradox vanishes immediately because the math becomes tractable. You need the tension of the infinite/open world to make them feel the pull. Use Dave's point as the "release valve" in the last 5 minutes. It validates the engineers' instinct that "something is off with the setup" without invalidating the logic.

  ### 4. Misconceptions & Kill Order
  Here are the four misconceptions, in the order they will arise, and how to kill them.

  1.  **"Confirm" is just vague language.** (Min 5)
      *   *The Trap:* Someone says, "Confirm doesn't mean prove."
      *   *The Kill:* Define it immediately. "By confirm, I mean **increases the posterior probability**. Even by 0.0000001%." Write `P(H|E) > P(H)` on the board. Do not move on until the statistician nods.
  2.  **"It depends on how I found the shoe." (The Sampling Protocol).** (Min 12)
      *   *The Trap:* This is the fourth misconception you didn't see. A data engineer will say, "If I went looking for a shoe, it tells me nothing about ravens."
      *   *The Kill:* Acknowledge this is the *practical* resolution, but insist on the *logical* puzzle. "Assume I picked a random object from the universe, closed my eyes, opened them, and saw a white shoe. Does that update my belief?" Force them to stay in the thought experiment.
  3.  **"Okay, it's evidence, but it's negligible, so what?"** (Min 15)
      *   *The Trap:* They agree too fast to move on.
      *   *The Kill:* "If it's evidence, then staring at your white wall is currently doing work on your ornithology theories. If logic is universal, the domain shouldn't matter. Why does it feel like cheating?" Make them sit with the discomfort.
  4.  **"So science is fake/arbitrary."** (Min 18)
      *   *The Trap:* Cynicism.
      *   *The Kill:* "Science isn't about logical equivalence; it's about information gain. The paradox shows the limit of pure logic without priors."

  ### 5. The Closing Question
  Do not ask "Do you understand?" They will lie.
  Ask this:

  > **"I have a room of objects. I want to test 'All Ravens are Black'. I have two strategies:**
  > **A) Go find a Raven and check its color.**
  > **B) Go find a Non-Black object and check if it's a Raven.**
  > **In which strategy does finding a White Shoe count as evidence?"**

  *   **Correct Answer:** Strategy B (Sampling by property). In Strategy A (Sampling by object), finding a shoe is impossible/irrelevant.
  *   **Why this works:** It tests if they understand that the *paradox* relies on the implicit assumption of sampling from the class of "All Objects," whereas their engineering intuition defaults to sampling from "All Ravens."

  ### 6. Scope Boundaries (The "Out of Scope" List)
  You have a statistician and a philosophy blogger. They will try to hijack the talk. Here is your script:

  *   **To the Statistician (who wants priors):** "I know we can dissolve this with a Bayesian prior on the relative frequency of ravens vs. shoes. I'm not asking for the derivation. I'm asking why the *logic* feels broken before we even get to the math. Come find me after if you want to show me the likelihood ratios."
  *   **To the Philosopher (who says "Grue"):** "Goodman's 'Grue' is the next layer of this onion. Today we are just trying to peel the first layer. If we bring in time-dependence now, we won't finish our sandwiches."
  *   **To the Group (if they get stuck on semantics):** "We are doing logic today, not inference engineering. Assume the universe is a bag of marbles, not a production system."

  ### Summary Checklist for the Whiteboard
  1.  `∀x (Raven(x) → Black(x))`
  2.  `∀x (¬Black(x) → ¬Raven(x))`
  3.  `P(H|E) > P(H)` (Definition of Confirm)
  4.  **The Trap:** `Evidence(Black Raven) = Evidence(White Shoe)?`
  5.  **The Escape:** Sampling Frame (Objects vs. Properties).

  Good luck. Don't let them solve it too early; make them sit in the discomfort for at least ten minutes. That's where the bet is won.
