answer: |-
  - **The pattern**
  This dynamic begins when a proponent offers a specific theoretical mechanism to resolve a paradox, such as bounded utility functions solving the St. Petersburg expected value problem. When an interlocutor challenges that mechanism by rescaling the payoffs to overcome the utility bound, the proponent does not defend the utility curve; instead, they abandon it temporarily to argue that no real-world casino has infinite capital (the finite bankroll objection). However, once the interlocutor idealizes the casino to restore infinite capital, the proponent does not defend the idealization; they pivot back to the bounded utility curve as if it had never been set aside.

  The crucial feature is that these explanations are treated as interchangeable shields rather than cumulative causes. In a consistent model, bounded utility and finite bankrolls are distinct constraints that might both apply, but they imply different behaviors in counterfactual scenarios. By swapping them defensively, the speaker avoids committing to which constraint is actually doing the explanatory work. The result is a resolution that appears robust because it has two lines of defense, but theoretically hollow because neither line is held consistently when tested.

  - **Nearest established concepts**
  **Motte-and-Bailey** is the closest rhetorical analogue, but it fails to capture the nuance here. In a standard Motte-and-Bailey, a speaker retreats from a controversial claim (the Bailey) to a trivial or indisputable one (the Motte) when attacked. In your seminar, both the "bounded utility" and "finite bankroll" positions are defensible, standard "Mottes." The issue isn't retreating from a bold claim to a safe one; it is jumping between two safe claims to avoid falsification of the overall resolution.

  **Ad Hoc Rescue (or Immunization)** describes adding auxiliary hypotheses to save a core theory from refutation. This pattern is similar but distinct because it involves *substitution* rather than *accumulation*. An ad hoc rescue typically stacks assumptions (A + B + C) to keep the core theory alive. Your classmates are not stacking the utility bound and the bankroll limit; they are treating them as mutually exclusive fallbacks. They imply "A is the reason" until A is threatened, then "Actually, B is the reason," without ever asserting "A and B are both necessary."

  - **The term**
  There is no single canonical term for this specific inconsistency in decision theory literature, though it falls under the broad umbrella of **Immunization Strategies**. I propose calling this **"The Two-Motte Maneuver."** This defines a defensive tactic where an arguer maintains two distinct, defensible positions (two "Mottes") and opportunistically retreats to whichever one is currently under less fire, without integrating them into a unified model. A boundary case would be a researcher who explicitly models *both* constraints (e.g., a bounded utility function *applied to* a truncated payoff distribution); that is legitimate pluralism. The Two-Motte Maneuver occurs only when the commitment to each explanation vanishes the moment the other is invoked to handle an objection.

  - **The tell**
  To distinguish this from legitimate explanatory pluralism, ask a counterfactual question that isolates the mechanisms: "If we assume an idealized casino with infinite capital, does the bounded utility argument still hold on its own?" A genuine pluralist will say "Yes, both factors contribute," and maintain that stance even when pressed. A practitioner of the Two-Motte Maneuver will hesitate, qualify their answer, or implicitly rely on the bankroll limit again to do the heavy lifting. If their confidence in Explanation A disappears the moment you remove Constraint B, they are swapping, not combining.

  - **Bottom line for my presentation**
  You should absolutely call this out, but frame it as a call for theoretical robustness rather than an accusation of bad faith. Pointing out that swapping explanations prevents the seminar from determining *which* resolution is actually correct will elevate the discussion. It stops the class from settling for a "good enough" answer and pushes everyone to commit to a specific model of rationality.
