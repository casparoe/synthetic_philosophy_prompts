prompt: |-
  ok so me and my friend had this long arguement last night about that old nursery rhyme - for want of a nail the shoe was lost, for want of a shoe the horse was lost, all the way up to losing a kingdom - and whether history is actually that fragile, like one tiny diferent thing happens and suddenly everything changes because of chaos. my friend says its overated and basically just a story people tell after the fact to make history seem neat. i think theres something real in it but i cant defend it well, and now im wondering how to actually use the idea at work instead of just arguing about it.

  i work for a small regional archive, we get boxes of random old papers donated every week - receipts, draft letters, meeting notes, photos with no labels - and we have maybe ten minutes to decide keep or toss. the stakes feel low but also high, because if we throw away the wrong scrap maybe some historian in fifty years cant figure out why a local strike happened or a policy failed, and that feels like throwing away the nail. i need a decision procedure my team can actually run on each donation box: ask the questions in order, say what counts as a good enough answer at each step, mark exactly where the procedure stops with a toss and where it stops with a keep, and flag the spots where contingency theory just cant tell us which scrap matters and a person has to make a values call. please think carefully and brainstorm a bit first before laying it out, you are an expert in the philosophy of history with some background in chaos theory and archival science. then run the procedure on three actual-style cases: a 1953 grocery reciept from a town that later had a big factory strike, a handwritten school board memo with half the words crossed out, and a blurry photo of a broken fence near where people think a protest started but nobody can confirm the location. please write the whole response in continuous prose only - no headings, no bullet points, no bold text, no tables, just like an email or letter. make sure one case comes out as toss even though my gut wants to keep it, and be honest about where the procedure breaks down or gives an answer that feels wrong.
