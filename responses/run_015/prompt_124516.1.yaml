prompt: |-
  I chair the behavior-support committee at a nonprofit that runs eleven group homes for adults with profound intellectual and multiple disabilities. My younger sister moved into one of them two years ago, so I now also see the output of our process from the family side, which is part of why I'm asking. Every resident has a written preferences-and-goals plan, rewritten annually and reviewed quarterly, signed off by a state regulator; in practice that document determines how a person spends their days — what they are offered, what they are taken to, what staff will wake them for, what gets removed from their environment as a safety risk. None of the residents use speech, so every one of these plans is inferred from behavior. Our current method is essentially a frequency count: over a two-week structured trial a support worker offers a pair of options ten times, and whichever one the resident approaches, reaches toward, or looks at longer gets written into the plan as a preference. The workers who run the trials have high-school educations, no statistics, about fifteen minutes per trial, and usually two or three other residents to supervise at the same time; anything I hand them has to fit on one laminated sheet, use no equipment the unit doesn't already have, and hold up when a reviewer asks how we know.

  I recently read about inverse reinforcement learning — inferring an agent's reward function from its observed actions — in a machine-learning context, and it made me anxious about our own practice in a way I can't fully articulate to my committee. The parts I keep circling are these. First, behavior underdetermines the reward function: many different orderings of how much someone cares generate exactly the same choices, and, counterintuitively, a person who always picks the same thing tells you less about the strength of the preference than someone who mostly picks it but occasionally doesn't. Second, choices are made against an option set that we constructed, and a long history of being offered almost nothing can itself shrink what a person reaches for, so a frequency count can quietly launder staff convenience and institutional routine into the resident's own preferences. Third, motor effort, positioning, staff cueing, satiation, and fear of the alternative all move behavior in the same direction that liking does, and our trials don't separate them. Fourth — and this is the one I'm least sure I've got right — a reward function inferred from someone's behavior is not automatically the thing we ought to be serving; there may be cases where the plan should say something about what we owe the person rather than what they'd pick. I'd like the procedure to preserve those four worries while being usable by someone who will never read the theory, and to be honest about which of them it has quietly dropped.

  So: please write me a decision procedure my committee can adopt for turning observed behavior into a sentence in a plan. In order, the questions to ask; what counts as a sufficient answer to each; which tests a support worker can actually run in fifteen minutes on the unit; where the procedure stops and returns no inference is licensed from this behavior; and where it hands the question to a named human being — the resident where possible, otherwise a family member or an advocate — because it is a judgment about values and not a matter of evidence at all. The output should be a plan sentence a regulator can audit, not a preference ordering, and I'd like it to allow sentences that are instructions to staff about the environment rather than claims about what the resident wants. Then run it on three cases: a resident who picks the quiet room over the music room nine times out of ten (I want to know whether that means she seeks quiet or is avoiding noise, and the plan sentences differ); a resident who reaches for a cookie more often than an apple when the apple is placed slightly farther away and reaching is effortful for her; and a resident who has refused every offered activity for two years and now spends most of the day in bed, where I suspect the honest answer is that the behavior is underdetermined and the right move is something other than writing down a preference. At least one of these should come out somewhere my current frequency count would not have gone, and at least one should be marked as a case the procedure cannot settle. Finally, tell me where the procedure will misfire — which residents, which kinds of option, which staff behaviors — and what a reviewer should look for to notice that it has.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of behavior-support committee at a nonprofit (11 group homes, adults with profound intellectual and multiple disabilities). Also a sibling of a resident.
      *   **Current State:** Annual preferences-and-goals plans determine daily life. Inferred from behavior (non-verbal residents). Current method: 2-week trial, 10 offers, frequency count of approach/look.
      *   **Constraints:** Support workers (HS education, no stats, 15 mins/trial, multitasking), one laminated sheet, no new equipment, auditable by state regulators.
      *   **User's Anxieties (The "Four Worries"):**
          1.  *Underdetermination:* Behavior doesn't uniquely identify preference strength (e.g., consistency vs. intensity).
          2.  *Option Set Bias:* Choices are constrained by staff/institution; "preference" might just be adaptation to limited options.
          3.  *Confounds:* Motor effort, positioning, cueing, satiation, fear mimic "liking."
          4.  *Normative Gap:* Inferred reward $\neq$ what we *ought* to serve (paternalism/welfare vs. pure choice).
      *   **Task:** Create a decision procedure (algorithm/checklist) to turn behavior into a plan sentence.
      *   **Requirements:**
          *   Address the four worries (preserve them or explicitly drop them).
          *   Usable by staff (simple, laminated).
          *   Define stopping rules (no inference licensed).
          *   Define escalation rules (hand to human for value judgment).
          *   Output: Auditable plan sentences (can be environmental instructions, not just preference claims).
          *   Test on three specific cases (Quiet vs. Music, Cookie vs. Apple, Bed/Refusal).
          *   Identify failure modes (where it misfires).

  2.  **Deconstruct the Four Worries into Operational Steps:**

      *   *Worry 1 (Underdetermination/Consistency):* Need to check for variability. If 10/10, is it strong preference or lack of alternatives? If 6/10, is it noise or genuine ambivalence?
      *   *Worry 2 (Option Set Bias):* Need to check if the options were actually distinct and accessible. Did we offer things they know?
      *   *Worry 3 (Confounds):* Need a "Control for Effort/Access" step. Is the reach physically easier? Is the staff cueing the choice?
      *   *Worry 4 (Normative Gap):* Need a "Welfare Check." Even if they choose X, is X harmful? Or, if they choose nothing, do we owe them enrichment?

  3.  **Drafting the Procedure (The "Laminated Sheet" Concept):**

      *   It needs to look like a flowchart or a checklist.
      *   It needs to result in specific *types* of sentences.
      *   It needs to explicitly say "STOP" when data is insufficient.

      *   *Step 1: The Setup (Addressing Worry 2 & 3).* Before counting, verify the trial validity. Were options equidistant? Was the resident alert?
      *   *Step 2: The Count (Addressing Worry 1).* 10 trials. But interpret the *pattern*, not just the majority.
      *   *Step 3: The Confound Check (Addressing Worry 3).* Did effort explain the choice?
      *   *Step 4: The Inference Limit (Addressing Worry 1 & 3).* When do we say "We don't know"?
      *   *Step 5: The Value Judgment (Addressing Worry 4).* When do we call the family/advocate?
      *   *Step 6: Writing the Plan.* Distinguish between "Prefers," "Avoids," "Requires," and "Needs Investigation."

  4.  **Refining the Logic (Self-Correction during drafting):**

      *   *Critique:* A simple frequency count is what they do now. How is this different?
      *   *Fix:* Add a "Reversal Test" or "Effort Control." If they pick the cookie, move the apple closer. If they switch, it was effort, not taste.
      *   *Critique:* Staff have 15 minutes. Complex stats are out.
      *   *Fix:* Use simple thresholds (e.g., "8 out of 10" vs "5 out of 10"). Use binary checks (Yes/No).
      *   *Critique:* How to handle the "Normative Gap"?
      *   *Fix:* Create a category of plan statement called "Staff Duty" vs. "Resident Preference."

  5.  **Developing the Three Test Cases:**

      *   *Case 1 (Quiet vs. Music):* 9/10 Quiet.
          *   *Current Method:* "Prefers Quiet."
          *   *New Method:* Check *why*. Is music painful (sensory overload)? Or is quiet comforting?
          *   *Distinction:* "Avoids Music" (negative reinforcement) vs. "Seeks Quiet" (positive reinforcement). Plan sentence differs: "Keep noise below X" vs. "Offer quiet space."
          *   *Test:* Does she react negatively to music onset? If yes, it's avoidance.
      *   *Case 2 (Cookie vs. Apple):* Cookie chosen, but Apple farther.
          *   *Current Method:* "Prefers Cookie."
          *   *New Method:* Effort confound. Move Apple closer. If choice flips, inference is "Motor limitation," not "Food preference."
          *   *Result:* Plan sentence about positioning, not diet.
      *   *Case 3 (Bed/Refusal):* 2 years refusal.
          *   *Current Method:* "Prefers low stimulation/bed." (Dangerous).
          *   *New Method:* Underdetermined. Learned helplessness? Depression? Health issue?
          *   *Result:* "No inference licensed." Escalate to clinician/family. Plan sentence: "Staff to offer novel engagement daily," not "Resident prefers bed."

  6.  **Addressing the "Misfire" Section:**

      *   Where will this fail?
      *   Fluctuating health (pain masquerading as preference).
      *   Staff bias (unconscious cueing).
      *   Complex social preferences (can't be tested in 15 mins).
      *   Regulator audit traps (looking for "Prefer" when "Require" is written).

  7.  **Final Polish:**

      *   Tone: Professional, empathetic, rigorous but practical.
      *   Format: Clear headings, bullet points, distinct sections for the Procedure, The Cases, and The Failure Modes.
      *   Ensure the "Laminated Sheet" constraint is met (keep the procedure concise enough to be summarized on one page).

  8.  **Review against Constraints:**
      *   *One laminated sheet?* The core procedure must be compact. I will provide the "Full Protocol" here, but structure it so the "Field Sheet" is extractable.
      *   *No equipment?* Rely on observation and positioning.
      *   *Auditable?* The logic must be traceable.
      *   *Address the 4 worries?* Yes, mapped to specific steps.

      *(Self-Correction on Case 1)*: The prompt asks specifically about Quiet vs. Music. The distinction is Seeking vs. Avoiding. I need to make sure the procedure distinguishes *approach* vs. *relief*.
      *(Self-Correction on Case 3)*: The prompt wants at least one case marked as "cannot settle." Case 3 is the obvious candidate.
      *(Self-Correction on Case 2)*: The prompt wants at least one case to differ from frequency count. Case 2 (Cookie/Apple) is the best candidate for flipping the conclusion from "Food Pref" to "Motor Access."

  9.  **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the gravity).
      *   The "Field Sheet" Procedure (The actionable tool).
      *   The Plan Sentence Taxonomy (How to write the output).
      *   The Three Cases (Applied test).
      *   Failure Modes & Audit Checks.

      *(Refining the "Normative Gap")*: I need to make sure the procedure explicitly allows for "Staff Duty" statements that override or exist alongside preferences.

      *(Refining the "Underdetermination")*: The procedure needs a "Confidence Level" or a "Not Enough Data" exit.

      Let's write it.

      *Wait, one nuance:* The user mentioned Inverse Reinforcement Learning (IRL). I don't need to use ML terms, but I should honor the insight: behavior $\neq$ reward. The procedure must treat behavior as *evidence* of reward, not *definition* of reward.

      *Plan Sentence Structure:*
      1.  **Preference:** "[Name] chooses X when offered X and Y."
      2.  **Avoidance:** "[Name] shows distress when X occurs; staff will minimize X."
      3.  **Access:** "[Name] requires X positioning to access Y."
      4.  **Duty:** "Staff will offer X daily, regardless of initial refusal, to prevent deprivation."

      Okay, ready to draft.

      *(Final check on constraints)*: "Fifteen minutes per trial." The procedure needs to fit within that window. The "Effort Control" needs to be quick. Swapping positions is quick.

      *(Final check on "Human Judgment")*: Who gets the escalation? Family, Advocate, Clinician.

      Let's assemble.

      *(Wait, one more thing)*: The prompt asks for "In order, the questions to ask; what counts as a sufficient answer to each; which tests a support worker can actually run... where the procedure stops... where it hands the question to a named human being." I need to make sure this specific structure is followed in the Procedure section.

      Okay, proceeding.cw
answer: |-
  This is a profound operational challenge. You are asking for a procedure that acknowledges the philosophical limits of behaviorism while remaining usable by staff under resource constraints. The goal is to move from *counting behaviors* to *interpreting evidence*, while explicitly marking where evidence runs out and values begin.

  Below is the **Behavior-to-Plan Decision Protocol**. It is designed to be printed as a two-sided laminated card for support workers. Side One is the Decision Tree; Side Two is the Menu of Plan Sentences.

  Following the protocol, I have applied it to your three cases and outlined the failure modes.

  ***

  # SIDE ONE: THE DECISION PROTOCOL
  **Use this sheet during the 15-minute observation window. Do not proceed to Side Two until all steps are complete.**

  ### PHASE 1: VALIDITY CHECK (Before counting choices)
  *Goal: Address Worry #2 (Option Set Bias) & #3 (Confounds)*

  **Q1: Are the two options physically equidistant and equally accessible?**
  *   **Test:** Place Option A and Option B at equal distance from the resident's midline. Ensure lighting and noise are equal for both.
  *   **Sufficient Answer:** Yes.
  *   **If No:** Adjust positioning. If positioning cannot be equalized (e.g., resident is fixed in a chair), **STOP**. Mark trial as "Motor Confound." Do not infer preference.

  **Q2: Is the resident alert and free from acute distress?**
  *   **Test:** Check for signs of pain, illness, or exhaustion (grimacing, crying, slumping) *before* the trial starts.
  *   **Sufficient Answer:** No signs of acute distress.
  *   **If Yes (Distress present):** **STOP**. Mark trial as "Health Confound." Address health needs first.

  **Q3: Is the staff member neutral?**
  *   **Test:** The staff member offering the choice must not look at, point to, or verbally emphasize one option over the other.
  *   **Sufficient Answer:** Staff hands are open; gaze is on the resident, not the object.
  *   **If No:** Reset and retry.

  ### PHASE 2: THE TRIAL (10 Offers)
  *Goal: Address Worry #1 (Underdetermination)*

  **Q4: What is the consistency pattern?**
  *   **Test:** Offer the pair 10 times. Record choices.
  *   **Sufficient Answer:**
      *   **High Consistency:** 9 or 10 choices for Option A.
      *   **Moderate Consistency:** 7 or 8 choices for Option A.
      *   **Low Consistency:** 6 or fewer choices for Option A.
  *   **Rule:** If **Low Consistency**, **STOP**. Do not write a preference. The data indicates ambivalence or random variation.

  **Q5: The Effort Reversal (Crucial Step)**
  *   **Test:** For the last 3 trials of the 10, swap the physical position of the options (Left becomes Right).
  *   **Sufficient Answer:** The resident follows the *object*, not the *position*.
  *   **If No (They reach for the same side):** **STOP**. Mark as "Position Habit." Do not infer preference.

  ### PHASE 3: INFERENCE LIMITS
  *Goal: Address Worry #1 (Underdetermination) & #3 (Confounds)*

  **Q6: Does the behavior indicate Approach or Relief?**
  *   **Test:** Observe the resident *before* the choice.
      *   *Approach:* Resident is neutral, then smiles/engages upon selecting Option A.
      *   *Relief:* Resident is agitated (rocking, vocalizing), and agitation stops *only after* selecting Option A (or removing Option B).
  *   **Sufficient Answer:** Check one: [ ] Approach [ ] Relief [ ] Unclear.
  *   **Rule:** If **Relief**, you are measuring *Avoidance*, not Preference.

  **Q7: Is the choice potentially harmful?**
  *   **Test:** Does Option A pose a health/safety risk (e.g., choking hazard, known allergen, self-injury tool)?
  *   **Sufficient Answer:** No.
  *   **If Yes:** **STOP**. Do not write a preference. Proceed to Phase 4.

  ### PHASE 4: ESCALATION (The Value Judgment)
  *Goal: Address Worry #4 (Normative Gap)*

  **Q8: Does this choice limit the resident's world?**
  *   **Test:** If we honor this choice every time, will the resident never experience anything else? (e.g., choosing bed over all activity).
  *   **Sufficient Answer:** No.
  *   **If Yes:** **HAND OFF**. This is not a preference inference; it is a quality-of-life judgment.
      *   **Action:** Notify Committee Chair / Family / Advocate.
      *   **Plan Status:** "Under Review." Do not finalize plan sentence.

  **Q9: Is the behavior underdetermined by history?**
  *   **Test:** Has the resident refused *all* options for >6 months?
  *   **Sufficient Answer:** No.
  *   **If Yes:** **HAND OFF**. This indicates "Learned Helplessness" or "Depression," not preference.
      *   **Action:** Notify Clinician / Family.
      *   **Plan Status:** "Investigation Required."

  ***

  # SIDE TWO: THE PLAN SENTENCE MENU
  **Select exactly one sentence type based on where you stopped in Phase 1-4.**

  **TYPE A: Verified Preference (Passed Phases 1, 2, 3)**
  > "When offered [Option A] and [Option B], [Resident] consistently chooses [Option A]. Staff will ensure [Option A] is available daily."
  > *Audit Trail:* Attach completed Side One sheet showing 9/10 consistency and successful Reversal Test.

  **TYPE B: Verified Avoidance (Passed Phases 1, 2, 3, marked 'Relief' in Q6)**
  > "[Resident] shows signs of distress when exposed to [Option B]. Staff will minimize [Option B] and offer [Option A] as a calming alternative."
  > *Note:* This is not a preference for A; it is a duty to reduce B.

  **TYPE C: Access Requirement (Failed Q1 or Q5 due to motor effort)**
  > "[Resident] reaches for [Option A] only when positioned within [X] inches. Staff will position [Option A] within [X] inches before assuming lack of interest."
  > *Note:* This corrects the environment, not the resident.

  **TYPE D: No Inference Licensed (Stopped at Phase 3 or 4)**
  > "Current data is insufficient to determine preference between [Option A] and [Option B] due to [Motor Confound / Ambivalence / Health]. Staff will continue to offer both equally while monitoring for changes."
  > *OR (If Hand Off):*
  > "Pattern suggests [Learned Helplessness / Health Issue]. Committee to review by [Date]. Staff will continue to offer [Option A] twice daily as part of enrichment duty, regardless of initial refusal."

  ***

  # APPLICATION TO YOUR THREE CASES

  ### Case 1: Quiet Room (9/10) vs. Music Room
  *   **Current Method:** "Resident prefers Quiet Room."
  *   **Protocol Application:**
      *   **Phase 2:** 9/10 consistency passes.
      *   **Phase 3 (Q6):** Staff observes resident *before* the choice.
          *   *Scenario A:* Resident is calm, moves toward Quiet Room, smiles. -> **Inference:** Approach.
          *   *Scenario B:* Resident is rocking/vocalizing in the hallway (noise), enters Quiet Room, stops rocking. -> **Inference:** Relief.
      *   **Result:**
          *   If Scenario A: **Type A Sentence.** ("Prefers Quiet Room.")
          *   If Scenario B: **Type B Sentence.** ("Shows distress in Music Room; minimize noise.")
      *   **Why this differs:** The frequency count treats "Seeking Quiet" and "Fleeing Noise" as identical. The protocol distinguishes them. The plan changes from "Take her to quiet" (active) to "Keep music off" (protective).

  ### Case 2: Cookie (Reachable) vs. Apple (Farther)
  *   **Current Method:** "Resident prefers Cookies." (Dietary plan updated).
  *   **Protocol Application:**
      *   **Phase 1 (Q1):** Options are *not* equidistant. Staff must equalize distance.
      *   **Phase 2 (Q5 - Reversal):** Staff swaps positions. If resident reaches for the *side* rather than the *food*, or if the resident switches to the Apple once it is close...
      *   **Result:** **Type C Sentence.** ("Resident reaches for food items only when placed within 12 inches. Staff will ensure healthy options are positioned within 12 inches before recording refusal.")
      *   **Why this differs:** The frequency count records a food preference. The protocol records a motor access requirement. The dietary plan remains unchanged (healthier), but the staffing plan changes (positioning).

  ### Case 3: Bed / Refusal (2 Years)
  *   **Current Method:** "Resident prefers low stimulation/bed." (Status quo maintained).
  *   **Protocol Application:**
      *   **Phase 4 (Q9):** Has resident refused all options for >6 months? **Yes.**
      *   **Action:** **HAND OFF.**
      *   **Result:** **Type D Sentence.** ("Pattern suggests Learned Helplessness. Committee to review by [Date]. Staff will continue to offer [Activity X] twice daily as part of enrichment duty, regardless of initial refusal.")
      *   **Why this differs:** The frequency count validates the withdrawal as a preference. The protocol identifies it as a clinical risk requiring intervention. It shifts the burden from the resident (to show interest) to the staff (to provide opportunity).

  ***

  # FAILURE MODES & AUDIT CHECKS

  No procedure is perfect. Here is where this protocol will misfire, and what a regulator (or you) should look for to catch it.

  ### 1. The "Hidden Pain" Misfire
  *   **Risk:** A resident chooses "Bed" because they have an undiagnosed toothache, not because they prefer low stimulation. Phase 1 (Q2) relies on staff recognizing acute distress. Subtle chronic pain is often missed by HS-educated staff.
  *   **Audit Check:** Look for **Type D Sentences** that persist for more than 6 months without a medical review note attached. If a plan says "Insufficient Data" for a year, the procedure has become a placeholder for neglect.

  ### 2. The "Staff Cueing" Misfire
  *   **Risk:** In Phase 1 (Q3), staff believe they are neutral but unconsciously linger on the option they *want* the resident to pick (e.g., the apple). The resident reads the social cue, not the object value.
  *   **Audit Check:** Regulators should spot-check the **Audit Trail** (the laminated sheet). If 100% of trials show "High Consistency" across all residents for the same staff member, cueing is likely. Look for **Type D Sentences**; honest staff should admit ambiguity often. If every plan is a confident Type A, the staff is likely forcing data.

  ### 3. The "Narrow World" Misfire
  *   **Risk:** A resident genuinely prefers one thing (e.g., watching a specific DVD) 10/10 times. The protocol validates this as Type A. Over a year, this narrows their world, reducing neuroplasticity.
  *   **Audit Check:** Look at the **Frequency of Offers**. The plan sentence says "Available daily." It does not say "Only." Auditors must check daily logs to ensure non-preferred options are still *offered* (even if not chosen) to prevent the "Option Set Bias" (Worry #2) from calcifying.

  ### 4. The "Normative Handoff" Bottleneck
  *   **Risk:** Phase 4 requires handing off to a human (Family/Advocate). If the committee is backlogged, these residents sit in limbo with Type D plans.
  *   **Audit Check:** Track the **Time-to-Resolution** for Type D plans. If "Under Review" lasts longer than 30 days, the committee is the bottleneck, not the data. This is where your dual role (Chair + Sibling) is vital: you must ensure the "Hand Off" doesn't become a "Drop Off."

  ### 5. The "Binary Trap"
  *   **Risk:** The protocol forces a choice between two options. Some preferences are about *sequence* (A then B) or *duration* (A for 5 mins), not binary selection.
  *   **Audit Check:** Review plans for residents with complex sensory profiles. If their plan is entirely Type A (Binary Preferences), you are likely missing nuanced needs. These residents need a functional assessment, not a preference trial.

  ### Summary of What Was Dropped
  To make this fit on a laminated sheet, I have dropped:
  1.  **Statistical Significance:** We rely on heuristics (9/10) rather than p-values. This increases false positives slightly but ensures usability.
  2.  **Long-term Longitudinal Analysis:** This is a snapshot tool. It assumes the resident is stable. It cannot detect slow drifts in preference without annual repetition.
  3.  **Complex Social Dynamics:** It tests objects/rooms. It cannot easily test "Prefers Staffer A over Staffer B" without introducing massive bias risks.

  This procedure does not solve the hard problem of inferring minds from behavior. It simply makes the uncertainty visible, auditable, and actionable.
