answer: |-
  Here is the briefing pack for the Ferrante session. I've structured the sequence to tighten the noose around her two standard defensive moves. The early questions let her establish the view; the middle questions stress-test the boundaries; the late questions force her to choose between shrinking the power's scope or admitting it's less primitive than she claims.

  ### The Question Set (10 Questions)

  **1. The Pre-Conventional Inference (Topic 7)**
  You argue that children's sensitivity to giving their word in convention-free settings reveals a primitive normative power rather than mere socialization. Even granting the empirical data, why think this sensitivity tracks a *real* normative power rather than a evolved disposition to *feel* bound? How do you bridge the gap from "we are wired to treat this as binding" to "this is actually binding"?
  *   **Follow-up:** If the answer is that the disposition is reliable because it tracks a real power, what independent check do we have on the power other than the disposition itself? [Guess: She'll say the phenomenology of being wronged is the check.]

  **2. The Normative Gap (Topic 1)**
  When I promise to $\phi$, I often already have a moral reason to $\phi$. On your view, the promise generates a *new* obligation. Does this new obligation add weight to the existing reason, or does it simply change the *structure* of the reason? If it adds weight, how much? If it changes the structure, what practical difference does that make?
  *   **Follow-up:** If I promise to do something trivial I already ought to do, do I now have two obligations or one complex obligation? [Guess: She'll say one complex obligation to avoid redundancy.]

  **3. Trivial and Redundant Promises (Topic 4)**
  Consider a promise to do something wholly trivial, like tying my left shoe before my right. If the obligation is content-independent, I am now bound by a normative power over shoe-tying. Is there any sense in which this obligation is *defective*? If not, does your view imply we can flood the normative landscape with trivial obligations at will?
  *   **Follow-up:** If you say these are valid but trivial, is the "bindingness" of a promise to save a life qualitatively the same as the shoe-tying promise? [Guess: She'll distinguish the *weight* of the underlying act from the *fact* of the obligation.]

  **4. The Unwanted Promisee (Topic 2)**
  Consider the "stranger on the train" case: I blurt out a promise to you that you didn't ask for, don't want, and won't rely on. You say the promise hands me limited authority over my conduct to *you*. How can I be subject to your authority when you have no interest in exercising it?
  *   **Follow-up:** If the authority exists regardless of their interest, isn't this less like a second-personal power and more like a unilateral imposition of duty? [Guess: She'll insist uptake isn't required for the power to exist, only for reliance.]

  **5. Release and Waiver Asymmetry (Topic 3)**
  You ground the special wrongness of breaking a promise in the authority handed to the promisee. But why is the power to release me from the obligation exclusively theirs? If the obligation is mine, why can't I waive the authority I granted?
  *   **Follow-up:** Is this asymmetry a brute feature of the power, or does it derive from the value of the relationship? [Guess: She'll say it's constitutive of the power itself.]

  **6. Promises to the Dying and Groups (Topic 6)**
  Can I promise a dying person something they will never know I performed? Can I promise a diffuse group where no individual takes themselves to be the specific holder of the authority? If uptake is required, these fail; if not, who holds the authority to release me?
  *   **Follow-up:** If you say the authority lies with the estate or the group representatives, aren't you reintroducing the convention you sought to avoid? [Guess: She'll argue the authority persists in the "second-personal stance" even without physical presence.]

  **7. Immoral Promises (Topic 5 — Trap for Move B)**
  If I promise to help you commit a crime, does the normative power exercise occur and then get voided by morality, or does the immorality prevent the power from being exercised at all?
  *   **Follow-up:** If it's the latter, then the moral context is a *condition of the power's existence*, not just a blocker of its effects. Doesn't this make the power dependent on external morality rather than primitive? [Guess: She'll try to maintain the distinction between exercise and validity.]

  **8. Coerced Promises (Topic 5 — Trap for Move B)**
  Same structure: If I promise under duress, is the power exercised but invalid, or not exercised? If it's not exercised, then my psychological state (voluntariness) is a constitutive condition of the power.
  *   **Follow-up:** If voluntariness and morality are both conditions, how many such conditions can accumulate before "primitive power" just means "complex social rule"? [Guess: She'll claim these are negative conditions, not positive sources.]

  **9. The Source of the Power (Topic 1/7 — Trap for Move A)**
  You've defined the power's limits through these conditions. Now, what makes this power *normative* rather than causal? When you say "explanation stops here," are you saying we cannot ask why humans have this capacity, or that there is no reason why this capacity generates obligations?
  *   **Follow-up:** If there is no reason, how do you distinguish this from a magic spell? If there is a reason (e.g., autonomy), isn't *that* the source of the normativity, not the power itself? [Guess: She'll retreat to the idea that powers are basic building blocks of normativity.]

  **10. Falsification (The Closer)**
  Finally, what empirical or philosophical finding would actually make you abandon the framework? If children stopped showing this sensitivity, or if a culture was found where giving one's word carried no special weight, would the theory fall?
  *   **Follow-up:** If the answer is "no, because the power is normative not empirical," then what work is the pre-conventional argument actually doing? [Guess: She'll say the empirical data supports the plausibility, but isn't strictly necessary.]

  ***

  ### Commitments & Strategic Analysis

  **Leading Questions**
  I would lead with **Q1 (Pre-Conventional Inference)** and **Q4 (The Unwanted Promisee)**.
  *   **Why Q1:** It engages her unique selling point immediately. The manuscript hangs on the claim that the empirical data supports a metaphysical conclusion. Challenging the inference here sets the tone that you understand her core argument but find the bridge shaky. It forces her to defend the "is-ought" move before she gets comfortable.
  *   **Why Q4:** This hits the heart of the "second-personal" claim. If she can't explain why authority exists without the promisee's interest, the "second-personal" label starts looking like window dressing for a unilateral duty view. It's a concrete case that audiences grasp instantly, unlike abstract validity conditions.

  **Question Most Likely to Generate New Material**
  **Q9 (The Source of the Power).**
  *   **Reasoning:** Ferrante's standard move is "explanation stops here" (Move A). However, by the time you reach Q9, you will have spent two questions (Q7 & Q8) forcing her to admit that the power is constrained by external moral and psychological conditions. Once she admits the power is constrained, the claim that it is "primitive" becomes harder to sustain. She will be pressured to explain *what* unifies these constraints if not a deeper value (like autonomy or trust). She may be forced to articulate a positive theory of the power's source that isn't in the book to save the "primitive" claim.

  **Weakest Point in the Framework**
  **The Pre-Conventional Argument (Topic 7).**
  *   **Confidence:** High (85%).
  *   **Reasoning:** The inference from "children feel bound" to "there is a normative power" is the most vulnerable link. It conflates the *phenomenology* of obligation with the *metaphysics* of obligation. Evolutionary psychology can easily explain a disposition to feel bound (social cohesion advantage) without positing a realist normative power. If this empirical hook fails, her argument against conventionalism loses its primary weapon, reverting to a stalemate with Humeans.
  *   **Uncertainty Flag:** I am less sure (60% confidence) about how much weight she places on this vs. the conceptual argument. If she treats the empirical data as merely illustrative rather than foundational, attacking it might feel like hitting a straw man. However, given her emphasis on "pre-conventional," I assess it as central.

  **Strategy Note on Defensive Moves**
  *   **Move A ("Brute Fact"):** I saved this for Q9. If you ask this too early, she shuts down inquiry. By Q9, after she's admitted multiple validity conditions, claiming it's "brute" looks like an admission of ignorance rather than a philosophical stance.
  *   **Move B ("Conditions of Exercise"):** I split this into Q7 (Immoral) and Q8 (Coerced). Doing it once allows her to dismiss it as a boundary case. Doing it twice forces her to generalize. The follow-up on Q8 explicitly challenges whether a power with too many conditions is still a "power" or just a rule.
