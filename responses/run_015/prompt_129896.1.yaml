prompt: |-
  I direct a grant program that funds joint empirical research between groups that are publicly and sharply opposed on high-stakes policy questions—for example, collaborations between climate economists who favor carbon pricing and community organizers who oppose those instruments on equity and procedural grounds, or partnerships between AI safety researchers advocating pre-deployment evaluation mandates and open-source advocates who treat such mandates as regulatory capture by incumbents. Before committing funds, my board needs a reusable decision procedure to determine whether both sides are arguing in good faith in a sense strong enough to make collaboration intellectually productive rather than merely performative. The procedure should be grounded in the philosophical distinction between doxastic openness—genuine willingness to revise one’s beliefs in light of evidence—and dialectical openness—willingness to represent the opposing view in terms that its own proponents would recognize as accurate—while also accounting for the structural problem that echo chambers and institutional filtering can produce sincere participants who nevertheless systematically misrepresent counterevidence and opposing arguments. Please construct a step-by-step checklist that my reviewers, who are not philosophers, can run in approximately thirty minutes per proposal; specify the ordered questions, what counts as a sufficient answer at each stage, the explicit stopping points where the procedure returns “do not fund,” and the points where judgment cannot be eliminated and must be referred to a senior board member for a values-based sign-off. The procedure must handle the hard case in which one side is individually sincere but embedded in an institutional environment that filters out disconfirming information—what might be called structural bad faith—and must include two worked applications: first, to a proposed collaboration between carbon-tax proponents and their equity-focused critics, and second, to a proposed partnership between AI alignment researchers and open-source advocates. Include at least one case where the procedure yields an answer the board will find unwelcome, and conclude by stating explicitly what the procedure cannot determine, such as whether good faith guarantees productive outcomes or whether hidden strategic motives are present.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Goal:** Create a reusable decision procedure (checklist) for a grant program funding joint empirical research between opposed groups on high-stakes policy questions.
      *   **Target Audience:** Reviewers (not philosophers), Board Members.
      *   **Time Constraint:** ~30 minutes per proposal.
      *   **Core Concepts:**
          *   *Doxastic Openness:* Willingness to revise beliefs based on evidence.
          *   *Dialectical Openness:* Willingness to represent opposing views accurately (steel-manning).
          *   *Structural Bad Faith:* Sincerity undermined by institutional echo chambers/filtering.
      *   **Requirements:**
          *   Step-by-step checklist with ordered questions.
          *   Criteria for "sufficient answer."
          *   Explicit stopping points ("Do Not Fund").
          *   Points requiring Senior Board Member sign-off (values-based judgment).
          *   Handling of "Structural Bad Faith."
          *   Two worked applications (Carbon Tax vs. Equity; AI Safety vs. Open Source).
          *   One unwelcome outcome (procedure rejects a popular/plausible proposal).
          *   Explicit limitations statement at the end.

  2.  **Deconstruct the Philosophical Framework:**

      *   *Doxastic Openness:* How do we measure this in a proposal? Look for specific empirical outcomes that would change their minds. If they say "nothing will change my mind," that's dogmatism.
      *   *Dialectical Openness:* How do we measure this? Look at how they describe the *other side* in the proposal. Is it a strawman or a steelman?
      *   *Structural Bad Faith:* This is the hardest part. Individuals might be sincere, but their epistemic environment is closed. We need to check if the *methodology* allows for external validation or if it relies solely on internal community standards that filter dissent.

  3.  **Drafting the Procedure (The "Good Faith Collaboration Protocol" - GFCP):**

      *   *Structure:* Needs to be linear, with gates.
      *   *Time:* 30 minutes means roughly 5-7 key questions, not 50.
      *   *Gates:*
          *   Gate 1: Dialectical (Do they understand each other?)
          *   Gate 2: Doxastic (Will they change their minds?)
          *   Gate 3: Structural (Is the design robust against echo chambers?)
          *   Gate 4: Values (Senior Board Sign-off on risk).

      *   *Refining the Questions:*
          *   Q1 (Dialectical): How does Party A describe Party B's core objection?
          *   Q2 (Doxastic): What specific result would make Party A abandon their policy preference?
          *   Q3 (Structural): How is data/evidence adjudicated? Is there a neutral third party or pre-registered metric?
          *   Q4 (Structural/Institutional): Are there publication rights that prevent suppressing negative results?

      *   *Stopping Points:* If Q1 fails (strawmanning), stop. If Q2 fails (dogmatism), stop. If Q3/Q4 fails (structural bias), refer to Board.

  4.  **Developing the Worked Applications:**

      *   *Case 1: Carbon Tax (Economists vs. Equity Organizers).*
          *   *Scenario:* Economists want efficiency; Organizers want justice.
          *   *Success:* They agree to measure distributional impacts, not just aggregate GDP.
          *   *Unwelcome Outcome:* Let's make this the one that gets rejected or flagged. Maybe the economists refuse to define "equity" in non-monetary terms, or the organizers refuse to acknowledge efficiency trade-offs. Let's make it a *Structural* fail. The economists rely on models the organizers can't access/verify.
      *   *Case 2: AI Safety (Mandates vs. Open Source).*
          *   *Scenario:* Safety wants evals; Open Source wants access.
          *   *Success:* Jointly designing an eval that doesn't leak weights but tests capability.
          *   *Outcome:* Passes with Board Sign-off due to high risk of regulatory capture concerns.

      *   *Wait, I need one "unwelcome" answer.*
          *   Let's make the Carbon Tax case the one that *fails* despite looking good on the surface. Why? Because the "empirical" measure chosen is structurally biased (e.g., measuring equity only via rebate checks, ignoring procedural power). This highlights the "Structural Bad Faith" requirement.
          *   Alternatively, let's make the AI case the unwelcome one. The Board *wants* to fund AI safety, but the procedure reveals the Open Source side is structurally unable to accept safety constraints as valid data.
          *   *Decision:* Let's make the Carbon Tax case the *Success* (to show it works) and the AI case the *Unwelcome Fail* (or vice versa). Actually, the prompt asks for "At least one case where the procedure yields an answer the board will find unwelcome." Usually, boards want to fund "safe" or "popular" things. If the procedure kills a popular collaboration, that's unwelcome. Let's make the **Carbon Tax** collaboration fail because the Economists refuse to accept non-quantitative equity metrics as "evidence." This shows the procedure protects against epistemic imperialism.

  5.  **Refining the "Structural Bad Faith" Component:**

      *   This needs to be explicit in the checklist.
      *   Question: "Does the methodology rely on data sources or interpretive frameworks that one party controls exclusively?"
      *   Question: "Is there a mechanism for appealing a disagreement on data interpretation?"

  6.  **Drafting the Content (Iterative refinement):**

      *   *Title:* Good Faith Collaboration Protocol (GFCP).
      *   *Intro:* Explain the Doxastic/Dialectical distinction simply.
      *   *The Checklist:* 4 Stages.
      *   *Stage 1: Dialectical Accuracy (The Steelman Test).*
      *   *Stage 2: Doxastic Vulnerability (The Falsification Test).*
      *   *Stage 3: Structural Epistemic Security (The Echo Chamber Test).*
      *   *Stage 4: Senior Board Review (The Values Test).*
      *   *Worked Examples:*
          *   Case A (Carbon): Fails Stage 3 (Structural). Unwelcome because it looks like a standard econ project.
          *   Case B (AI): Passes Stage 4 (Conditional).
      *   *Limitations:* What this can't do (predict success, detect hidden motives).

  7.  **Review against Constraints:**

      *   30 minutes? Yes, 4 stages is tight enough.
      *   Non-philosophers? Language needs to be plain English, defining terms clearly.
      *   Stopping points? Yes, "Terminate" at Stage 1 & 2. "Refer" at Stage 3.
      *   Structural Bad Faith? Addressed in Stage 3.
      *   Unwelcome outcome? Yes (Carbon case rejection).
      *   Limitations? Included at the end.

  8.  **Final Polish:**

      *   Ensure the distinction between *Doxastic* (belief revision) and *Dialectical* (argument representation) is clear in the instructions.
      *   Make sure the "Structural" section doesn't just blame individuals but looks at *incentives and data access*.
      *   Check tone: Professional, procedural, rigorous.

      *(Self-Correction during drafting)*: I initially thought about having the AI case fail. But the Carbon case is better for showing "Structural Bad Faith" regarding *what counts as evidence*. Economists often dismiss qualitative equity data. If the proposal says "We will measure equity using only willingness-to-pay," the organizers might agree to get funding, but the *structure* filters out their actual concerns. That's a perfect example of structural bad faith. I will use that for the "Unwelcome" outcome.

      *(Refining the Board Sign-off)*: The prompt asks for points where judgment cannot be eliminated. This should be when the procedure identifies a risk that is acceptable *politically* but risky *epistemically*. Stage 3 is the best place for this. If structural risks exist but are mitigated, the Board must decide if the risk is worth the reward.

      *(Final check on time)*: 30 minutes is tight. The checklist needs to be scannable. I will format it with clear "Pass/Fail/Refer" indicators.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Good Faith Collaboration Protocol (GFCP)
  **Version 1.0 | For Reviewer Use Only**

  ## Purpose and Scope
  This procedure evaluates proposals for joint empirical research between parties holding opposing policy positions. It is designed to distinguish between **performative collaboration** (where parties agree to disagree without engaging) and **productive collaboration** (where engagement risks changing outcomes).

  It relies on two philosophical criteria translated into operational checks:
  1.  **Dialectical Openness:** Can Party A describe Party B's objection in a way Party B accepts as accurate? (The "Steelman" Test).
  2.  **Doxastic Openness:** Is there a specific empirical outcome that would cause Party A to weaken or abandon their policy preference? (The "Falsification" Test).
  3.  **Structural Integrity:** Does the research design protect against institutional echo chambers that filter out disconfirming evidence? (The "Echo Chamber" Test).

  **Time Allocation:** 30 Minutes per proposal.
  **Reviewer Authority:** Reviewers may recommend "Fund" or "Do Not Fund." Senior Board Members must sign off on any proposal triggering a "Referral" in Stage 3 or 4.

  ---

  ## Stage 1: Dialectical Accuracy (The Steelman Test)
  *Time Limit: 5 Minutes*

  **Objective:** Determine if the parties understand each other well enough to collaborate without talking past one another.

  **Q1.1: The Opposition Summary**
  In the proposal narrative, how does Party A describe the *primary* reason Party B opposes their preferred policy?
  *   **Sufficient Answer:** Party A cites a specific value, mechanism, or risk identified by Party B (e.g., "They oppose carbon pricing because they believe it disproportionately burdens low-income households without procedural recourse," NOT "They oppose it because they dislike markets").
  *   **Insufficient Answer:** Party A describes Party B's position as irrational, purely ideological, or based on misinformation.
  *   **Action:** If Insufficient, **STOP. Recommend Do Not Fund.**

  **Q1.2: The Validation Check**
  Does Party B explicitly endorse Party A's summary of their position within the proposal text (e.g., via a joint problem statement)?
  *   **Sufficient Answer:** Yes, there is a signed joint statement or explicit text confirming accuracy.
  *   **Insufficient Answer:** No, or Party B adds a caveat that fundamentally alters the premise (e.g., "Party A describes our view correctly, *but* they ignore the historical context which makes this impossible").
  *   **Action:** If Insufficient, **STOP. Recommend Do Not Fund.**

  ---

  ## Stage 2: Doxastic Vulnerability (The Falsification Test)
  *Time Limit: 10 Minutes*

  **Objective:** Determine if the research can actually change minds, or if the conclusion is pre-determined.

  **Q2.1: The Reversal Condition**
  Does the proposal specify a specific empirical result that would cause Party A to publicly advocate for *less* of their preferred policy (or more of Party B's)?
  *   **Sufficient Answer:** "If the data shows X (e.g., rebates fail to offset costs for >20% of the target demographic), we will recommend pausing implementation."
  *   **Insufficient Answer:** "If the data shows X, we will recommend *adjusting* the policy" (without defining what adjustment constitutes a rejection of the core premise) OR "No single study would change our view, but this adds to the literature."
  *   **Action:** If Insufficient, **STOP. Recommend Do Not Fund.**

  **Q2.2: Symmetry of Risk**
  Is Party B subject to the same condition? (i.e., Is there a result that would make Party B accept *more* of the policy they currently oppose?)
  *   **Sufficient Answer:** Yes. Both sides have skin in the game.
  *   **Insufficient Answer:** No. Only one side risks changing their position; the other treats the research as purely "monitoring" or "exposure."
  *   **Action:** If Insufficient, **Refer to Senior Board (Stage 4).** *Note: Asymmetry is not an automatic fail, but requires values-based sign-off.*

  ---

  ## Stage 3: Structural Epistemic Security (The Echo Chamber Test)
  *Time Limit: 10 Minutes*

  **Objective:** Identify "Structural Bad Faith." This occurs when participants are sincere, but their institutional environment filters out evidence that contradicts their worldview.

  **Q3.1: Data Adjudication**
  Who controls the data collection and interpretation methodology?
  *   **Sufficient Answer:** A neutral third party, a pre-registered protocol agreed upon by both sides *before* data collection, or a shared dashboard where raw data is visible to both.
  *   **Insufficient Answer:** One party controls the models/code and provides only summary statistics to the other.
  *   **Action:** If Insufficient, **Refer to Senior Board.** *This indicates high risk of structural filtering.*

  **Q3.2: Publication Rights**
  Does the agreement guarantee that negative results (results unfavorable to one side) can be published without veto power from the funding recipient's home institution?
  *   **Sufficient Answer:** Yes, publication rights are contractually guaranteed for all outcomes.
  *   **Insufficient Answer:** Ambiguous, or subject to "institutional review" that allows for delay or suppression.
  *   **Action:** If Insufficient, **STOP. Recommend Do Not Fund.**

  **Q3.3: Metric Pluralism**
  Does the methodology allow for metrics that validate *both* parties' core concerns, or does it force one party to translate their values into the other's language?
  *   **Sufficient Answer:** Yes. (e.g., Measuring both "aggregate efficiency" AND "procedural autonomy").
  *   **Insufficient Answer:** No. (e.g., Measuring "equity" only via monetary compensation, ignoring procedural power).
  *   **Action:** If Insufficient, **Refer to Senior Board.** *This indicates structural epistemic imperialism.*

  ---

  ## Stage 4: Senior Board Sign-Off (Values & Risk)
  *Time Limit: 5 Minutes (Board Only)*

  **Trigger:** Any proposal reaching this stage has passed Stages 1 & 2 but contains flagged risks in Stage 3 or 4.

  **Board Decision Matrix:**
  1.  **Asymmetry of Risk (from Q2.2):** Is it acceptable for one side to be more vulnerable than the other given current power dynamics?
  2.  **Structural Filtering (from Q3.1/Q3.3):** Is the risk of one side controlling the data outweighed by the feasibility of the project? Can mitigation strategies (e.g., external audit) be added?

  **Final Outcome:**
  *   **Approve:** Risks accepted.
  *   **Approve with Conditions:** Mitigation strategies required (e.g., external auditor added).
  *   **Reject:** Risks too high; collaboration likely to reinforce structural bad faith.

  ---

  ## Worked Application 1: Carbon Tax vs. Equity Organizers
  **Proposal:** A collaboration between Neoclassical Economists (Pro-Carbon Tax) and Community Justice Organizers (Anti-Carbon Tax).
  **Goal:** To measure the impact of a revenue-neutral carbon tax on low-income communities.

  **Stage 1 Review:**
  *   *Q1.1 (Opposition Summary):* Economists write: "Organizers oppose the tax because they fear it raises energy costs without addressing historical disinvestment." Organizers sign off. **(PASS)**
  *   *Q1.2 (Validation):* Organizers confirm this is their primary objection. **(PASS)**

  **Stage 2 Review:**
  *   *Q2.1 (Reversal Condition):* Economists state: "If net costs for the bottom quintile rise by >2%, we will recommend against this specific tax design." **(PASS)**
  *   *Q2.2 (Symmetry):* Organizers state: "If net costs remain flat and revenue is demonstrably invested in community control, we will cease opposition to this specific design." **(PASS)**

  **Stage 3 Review:**
  *   *Q3.1 (Data Adjudication):* The Economists will build the economic model. The Organizers will receive summary reports. **(FAIL - Refer to Board)**
  *   *Q3.3 (Metric Pluralism):* The proposal measures "Equity" solely via *household expenditure data*. The Organizers' core concern is *procedural power* (who decides how revenue is spent), which is not quantified in the model. The proposal argues procedural power is "outside the scope of empirical measurement." **(FAIL - Refer to Board)**

  **Outcome:** **UNWELCOME REJECTION.**
  *   **Reviewer Note:** While the parties are sincere and dialectically open, the *structure* of the research privileges economic metrics over political metrics. The Organizers are being asked to validate their concerns using the Economists' epistemic tools, which structurally filter out the Organizers' definition of justice.
  *   **Board Decision:** **Do Not Fund.** The collaboration would likely result in the Organizers' concerns being "measured" as irrelevant, reinforcing the very structural bad faith the program aims to cure.

  ---

  ## Worked Application 2: AI Safety Mandates vs. Open Source Advocates
  **Proposal:** A collaboration between AI Safety Researchers (Pro-Regulation) and Open Source Developers (Anti-Regulation).
  **Goal:** To test whether pre-deployment evaluations can be bypassed by open-weight models.

  **Stage 1 Review:**
  *   *Q1.1 (Opposition Summary):* Safety Researchers write: "Open Source advocates believe mandates will centralize power in large incumbents and stifle innovation." Advocates sign off. **(PASS)**
  *   *Q1.2 (Validation):* Advocates confirm. **(PASS)**

  **Stage 2 Review:**
  *   *Q2.1 (Reversal Condition):* Safety Researchers state: "If we demonstrate that evals can be bypassed in <48 hours by fine-tuning, we will shift focus to post-deployment monitoring." **(PASS)**
  *   *Q2.2 (Symmetry):* Advocates state: "If we demonstrate that bypassing requires resources only available to large labs, we will support targeted reporting requirements." **(PASS)**

  **Stage 3 Review:**
  *   *Q3.1 (Data Adjudication):* Code and evaluation scripts will be hosted on a neutral repository with commit access for both sides. **(PASS)**
  *   *Q3.3 (Metric Pluralism):* Metrics include both "Time-to-Bypass" (Safety concern) and "Compute-Cost-to-Bypass" (Open Source concern regarding centralization). **(PASS)**

  **Stage 4 Review (Triggered by Q3.1 nuance):**
  *   *Risk:* The Safety Researchers have significantly more funding and compute access than the Advocates. Even with shared repos, the *capacity* to run tests is asymmetrical.
  *   **Board Decision:** **Approve with Conditions.** Funding must include a specific line item to purchase compute credits for the Open Source Advocates to ensure they can independently verify the Safety Researchers' claims.

  ---

  ## Limitations of the GFCP

  Reviewers and Board Members must acknowledge what this procedure **cannot** determine:

  1.  **Guarantee of Productivity:** Passing the GFCP ensures the *conditions* for good faith exist, not that the research will yield useful results. Parties may be open to changing their minds but still fail to find conclusive evidence.
  2.  **Hidden Strategic Motives:** The procedure relies on self-reporting and proposal text. It cannot detect if a party is signing the proposal solely to gain legitimacy or funding while intending to ignore the results later (though Stage 3.2 mitigates this via publication rights).
  3.  **Truth Value:** The GFCP is agnostic regarding which side is *correct*. A proposal where the "wrong" side demonstrates higher doxastic openness will still pass.
  4.  **Long-Term Institutional Drift:** The procedure assesses the proposal at time *t*. It cannot prevent an institution from later punishing a researcher for adhering to the collaboration's findings (e.g., tenure denial). Stage 3.2 attempts to mitigate this, but cannot eliminate it.

  **Final Instruction:** If a proposal passes all stages but leaves the Reviewer with a strong intuitive sense of "performative alignment" that the checklist missed, the Reviewer must attach a **Dissenting Note** for Board review. The checklist is a floor, not a ceiling, for epistemic diligence.
