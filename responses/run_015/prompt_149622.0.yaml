  *   **Equal Large Benefit (3000 large vs. 1 large):** If "large" means "vital interest," Principle 2 applies. **Save the 3000.** (Matches common intuition).

  **Honest Assessment:**
  I cannot save your verdict on the **Same-Person Flickers**. If trivialities don't count across persons, they shouldn't count within one person enough to ruin health. I would overturn your intuition there: consistency demands we treat the person as a container of moments, not a magic shield against math when the units are trivial.
  However, these principles *do* save the **Equal Large Benefit** case, provided the benefit qualifies as a vital interest. If 3000 people lose a vital interest versus one person losing one, Principle 2 aggregates the loss.

