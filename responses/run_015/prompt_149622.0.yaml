  **Principle 1 (The Threshold Constraint):** No number of trivial benefits may justify imposing a severe burden on an identifiable individual. (Motivated by the Night Market).
  **Principle 2 (The Distribution & Aggregation Clause):** When preventing a severe burden requires only minor inconveniences to many, distribute the inconvenience. When severe burdens conflict (e.g., life vs. life), minimize the total number of severe burdens. (Motivated by the Grid/Rescue cases).

