  **The Scenario**

  Two agents, Alpha (logically omniscient) and Beta (logically bounded), share identical prior evidence $K$ and identical payoff structures. They are presented with a complex logical tautology $T$ (e.g., a specific instance of a known theorem) and then given a document $E$ containing a valid proof of $T$. The payoff rule is: "You receive $1,000 if your reported credence in $T$ strictly increases after reviewing $E$ compared to your credence before reviewing $E$; otherwise, you receive $0$." Both agents report credences via binding betting slips submitted before and after reviewing $E$. Alpha knows all logical consequences of $K$ (which includes $T$, as it is a tautology). Beta does not.

  **Walkthrough**

  Alpha, being logically omniscient, assigns a credence of 1 to $T$ immediately upon considering $K$, because $T$ is a logical consequence of the rules of logic contained in $K$. When Alpha reviews $E$, their credence remains 1. Since there is no increase (1 to 1), Alpha receives $0. Beta, being logically bounded, does not initially see that $K$ entails $T$ and assigns a credence less than 1 (e.g., 0.5). Upon reviewing $E$, Beta recognizes the proof and updates their credence to 1. Since there is a strict increase (0.5 to 1), Beta receives $1,000. Beta is strictly better off.

  **The Working Feature**

  The feature doing the work is the **payoff contingency on belief revision** rather than final accuracy. The scenario rewards the *process* of learning (updating) rather than the *state* of knowing. Because logical omniscience collapses the distinction between "potential knowledge" and "actual knowledge" regarding logical truths, the omniscient agent is incapable of satisfying the condition for the reward (change), whereas the bounded agent can.

  **Removal of the Feature**

  If you remove the requirement for belief revision and instead reward **final epistemic accuracy** (e.g., "You receive $1,000 if your final credence matches the truth value of $T$"), both agents receive $1,000. Alpha knows $T$ is true; Beta learns $T$ is true. The advantage disappears, and the logically omniscient agent is no worse off, restoring the standard intuition that omniscience is at least as good as boundedness for truth-tracking.

  **The Defender's Attack**

  A defender of logical omniscience would attack the **normative legitimacy of the payoff structure**. They would argue that ideal rationality is concerned with aligning beliefs with truth (accuracy), not with the psychological experience of updating. A reward scheme that pays for *changing* one's mind rather than *being right* is perverse; it incentivizes initial error. The defender would claim that Alpha's inability to win is not a flaw in omniscience, but a demonstration that Alpha correctly identifies the bet as irrational for an agent who already knows the truth. The case proves only that logical omniscience is incompatible with *profiting from ignorance*, not that it is incompatible with rationality.
