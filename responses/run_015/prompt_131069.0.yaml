answer: |-
  **Project Title:** The Subject of Extrapolation: Agent-Relativity in Coherent Extrapolated Volition

  **1. Project Summary**
  Coherent Extrapolated Volition (CEV) is a leading framework for AI alignment, proposing that AI should act according to what agents *would* want if they were smarter, knew more, and reflected further. However, CEV is traditionally formulated for a single mind. As AI systems are deployed to serve humanity—a plural, intertemporal collective—it is urgent to determine whether CEV's coherence conditions generalize to institutional agents. This project asks whether the coherence conditions grounding CEV (consistency, reflection, value-stability) are agent-relative in a way that makes collective extrapolation conceptually impossible. I will investigate whether institutional CEV is a viable extension of individual rationality or a category error that collapses into idealized preference aggregation.

  **2. Research Question & Motivation**
  The central question is: **Do the coherence conditions that ground CEV require a unified subject of experience, rendering multi-agent or intertemporal collective extrapolation conceptually incoherent?**

  Current literature treats extrapolation as a function of individual rationality—what *you* would want if *you* were improved. Social-choice analogues exist, but they assume the coherence chain itself can survive fragmentation across multiple subjects. This project challenges that assumption. If reflection presupposes a single self capable of recognizing its own values over time, then applying CEV to an institution (or humanity) may not merely be technically difficult; it may be a category error.

  This distinction is critical for AI safety. If CEV cannot survive the transition from singular to plural agents without collapsing into voting mechanisms or preference aggregation, then alignment strategies targeting "humanity's values" via CEV are fundamentally misguided. Conversely, if coherence conditions do generalize, they likely require revision to account for inter-subjective value drift. This project seeks a principled break point, distinguishing between technical hurdles (computation, information) and conceptual limits (the nature of the reflecting subject).

  **3. Methodology & Work Plan**
  This is a conceptual analysis project. While it engages with formal concepts, it will not attempt to solve formal impossibility theorems. The work proceeds in six months:

  *   **Month 1: Formalizing Single-Agent Coherence.** I will precisely define the coherence conditions of CEV (consistency, reflection under extrapolation, value-stability) without importing heavy mathematics. The goal is a philosophical specification of the "unity conditions" required for a single agent to maintain identity through extrapolation.
  *   **Month 2: Constructing Institutional Analogues.** I will map these conditions onto plural structures. This includes modeling intertemporal democratic preferences and federated value structures. I will examine whether an institution can "reflect" in the same sense as a mind, or if institutional reflection is merely aggregation.
  *   **Month 3: Isolating the Break Point.** I will analyze where the coherence chain breaks. Preliminary analysis suggests the break occurs at *reflection* (who is doing the reflecting?) or *value-stability* (whose values remain stable?). I will test whether value drift across members constitutes a loss of coherence or merely a change in aggregate state.
  *   **Month 4: Repair vs. Collapse.** I will evaluate potential repairs. Does fixing the break require empirical psychology (e.g., shared phenomenology) or does it collapse into social choice theory (e.g., voting)? If the only repair is "run an election," the project identifies this as a failure of CEV generalization.
  *   **Month 5: Drafting the Argument.** I will synthesize findings into a draft paper arguing either for irreducible agent-relativity or for a revised coherence condition for collective agents.
  *   **Month 6: Stress-Testing.** I will subject the draft to the "just aggregate preferences" objection. I will refine the distinction between *idealized aggregation* and *collective extrapolation* to ensure the contribution is not merely semantic.

  **4. Expected Outcomes & Success Criteria**
  The project aims for a binary conceptual resolution. Success is defined as either:
  1.  **Positive Generalization:** Demonstrating that collective CEV is coherent but requires a revised coherence condition (e.g., replacing "self-recognition" with "institutional continuity").
  2.  **Negative Result:** Demonstrating that agent-relativity is irreducible, proving that collective CEV is a category error because reflection requires a unified subject of experience.

  **Failure Conditions:** The project fails if the only solution to collective coherence is procedural (e.g., "run an election") or if progress requires solving Arrow-style impossibility results. The goal is to identify a *philosophical* limit, not a mathematical one. If the problem reduces to standard social choice impossibility, the project will document this reduction as the negative result (Outcome 2), rather than attempting to solve the math.

  **5. Feasibility & Scope Check**
  This project is scoped for conceptual analysis, not formal proof. The primary risk is "formalization creep"—attempting to mathematically model collective preference dynamics, which would exceed the six-month timeline. I will mitigate this by treating formal models as illustrative tools rather than objects of proof. The focus remains on the necessary conditions for *reflection* and *identity* across time and subjects.

  The scope is limited to the coherence conditions themselves, not the computational feasibility of extrapolation. I will not address how to build such a system, only whether the concept holds. This ensures the project remains deliverable within six months while producing high-impact guidance for alignment theory. If CEV is agent-relative, alignment research must pivot to frameworks designed for plural agents rather than scaling individual models.

  **6. Relevance to AI Alignment**
  As AI systems gain capacity to influence global governance and long-term planning, the target of alignment shifts from individual users to collective entities. If CEV cannot conceptually survive this shift, relying on it for institutional alignment poses a systemic risk. This project provides the necessary conceptual groundwork to determine whether we are building AI for "humanity" or merely for aggregates of humans. Clarifying this distinction is a prerequisite for safe deployment of high-stakes AI systems.
