prompt: |-
  You are a professional philosopher of religion and modal logician tasked with designing pedagogy, not delivering it. Before you outline anything, take a moment to brainstorm the conceptual dependency structure: which premises in Gödel's modal ontological argument must be secured before the essence axiom can do any work, where the risk of modal collapse is greatest, and how a student who already knows S5 semantics is likely to misapply that technical competence. Then construct a detailed teaching plan — not the lecture transcript — for a single 90-minute graduate seminar on Gödel's modal version, aimed at students who have completed introductory modal logic (they understand possible-worlds semantics, the S5 system, and the de re / de dicto distinction) but have never studied this argument.

  The plan must address the following in this order.

  First, the explanatory sequence: specify the exact order in which the logical pieces must be introduced so that the derivation of necessary existence feels inevitable rather than like theological sleight of hand. Indicate where Gödel's technical definition of God-like (the conjunction of all positive properties) belongs, where the axiom that being God-like is an essence belongs, and which intermediate commitments — such as the closure conditions on positive properties and the relation between possibility and necessary existence in S5 — must be in place before each subsequent step can be understood. Explain why reversing any of these steps breaks the pedagogical chain.

  Second, the carrying example: choose one concrete analogy or scenario — not the standard perfect-being intuition pump — that illustrates what a positive property means in Gödel's technical, non-evaluative sense and why necessary existence follows from being an essence. Describe exactly what this example must include (e.g., completeness, maximal consistency) and what it must exclude (e.g., moral evaluation, causal power) so that it carries the logical structure without importing theological baggage.

  Third, the misconception map: identify the misconceptions students will predictably form or import, tied precisely to the point in the sequence where each should be intercepted. At minimum, cover: the conflation of Gödel's positive properties with moral goodness; the confusion of modal possibility with epistemic possibility (treating possibly God exists as equivalent to we do not yet know whether God exists); and the hidden assumption that the argument still relies on the classical ontological argument's premise that existence is a perfection. For each misconception, specify the conceptual move that defuses it and the exact moment in the sequence to deploy it.

  Fourth, the diagnostic check: design one question or short exercise for the end of the session that reveals whether students have grasped the modal structure — specifically the inference from possible instantiation of an essence to necessary existence — rather than merely memorizing the conclusion that God necessarily exists.

  Fifth, the explicit omissions: state clearly what you will refuse to cover in this session and say so openly — for instance, the textual details of Gödel's unpublished notes, the full landscape of published criticisms of the axioms, or debates about whether the argument is consistent with atheism — and justify why leaving each out protects the pedagogical goal rather than hiding difficulty.

  Finally, note one subtle framing choice that makes this session different from a standard history-of-philosophy treatment: present Gödel's argument primarily as a stress test for modal logic's metaphysical neutrality, asking whether S5 machinery can generate substantive existence claims from purely formal premises. Keep your answer focused on the dependency structure, the misconception map, and the carrying example; do not provide the lecture itself, do not offer a bibliography or reading list, and do not cite specific texts by page or edition. Think carefully about how students with technical modal-logic training will over-apply machinery and miss the metaphysical weight of the premises, and structure the plan to guard against that specifically.
