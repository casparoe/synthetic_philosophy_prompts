answer: |-
  **Pass 1: Mises (The Dual Variable Problem)**
  Mises argues rational allocation is a constrained optimization problem. To solve the primal (resource distribution), you need the dual variables (shadow prices) for the means of production. In a market, these emerge from transactions. Without a market in capital goods, there are no transactions, hence no dual variables. You cannot compute the gradient for your LP relaxation.
  *   **Maps:** Shadow prices, LP relaxation.
  *   **Distortion:** Reduces "value" to an engineering constraint.
  *   **Missing:** The subjective origin of value; prices aren't just signals, they constitute the value metric.

  **Pass 2: Hayek (The Feature Space Problem)**
  Hayek argues the central model suffers from catastrophic distribution shift and feature sparsity. Knowledge is local, tacit, and high-dimensional. Aggregating it into a central state vector introduces latency. By the time you update the policy, the environment has shifted. Prices are a lossy compression protocol for dispersed features that cannot be fully logged.
  *   **Maps:** Distribution shift, online allocation, communication bandwidth.
  *   **Distortion:** "Tacit knowledge" is richer than "unlogged features."
  *   **Missing:** Preferences are not static parameters waiting to be discovered; they are created during action.

  **Pass 3: Lange (The Simulator Claim)**
  Lange proposes a planning board that announces prices, observes surplus/shortage (loss), and iterates (gradient descent). It treats the economy as a learned simulator where you can score allocations via counterfactuals without actual capital markets. It preserves the market algorithm while abolishing the institution.
  *   **Maps:** Model-based planning, online feedback loops.
  *   **Distortion:** Assumes agents truthfully reveal slack (incentive compatibility).
  *   **Missing:** The cost of computation and the rigidity of rules vs. entrepreneurial discovery.

  **Specific Questions**
  Is Lange claiming off-policy evaluation? Roughly, yes: he claims you can score alternative allocations using slack data generated under the current price policy. Is Hayek objecting via distribution shift? Yes, but deeper: he claims the data generating process is non-stationary *because* of the planning policy itself. The simulator fidelity collapses because agents adapt creatively, not just statistically.

  **Residue Report**
  Your hunch is correct. Your framework assumes an objective function (e.g., revenue, engagement) specified in advance and held fixed for a quarter. Hayek claims preferences and production possibilities do not fully exist until acted upon; they are emergent, not pre-existing parameters. This is a blind spot in your framework. You optimize for a proxy because the true objective is unknowable, but you assume the proxy is stable. Hayek argues the stability is an illusion maintained by the market process itself.

  Model-based planning works in your world because the environment is bounded: servers don't unionize, users don't rewrite the auction logic, and the "physics" are hardcoded. A real economy lacks this simulator fidelity. Lange works in ad tech because you are optimizing a local subsystem where the rules are fixed.

  **The Industry Question**
  Your industry sets prices by algorithm inside planned hierarchies using internal shadow prices. This looks like Lange, but it belongs to Mises and Hayek. Internal shadow prices work only because they are anchored by external market prices (for labor, hardware, electricity, and the ad inventory itself). Remove the external market, and your internal shadow prices lose their gradient signal and drift. You are running a planned economy inside a firm, but only because the firm is a planned island floating in a market sea. The external market provides the ground truth for your dual variables.
