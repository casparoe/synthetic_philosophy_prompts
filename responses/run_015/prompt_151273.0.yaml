      *   *Bottom Line:* The film *complicates* pronatalism. It doesn't argue for blind reproduction (quantity), but argues that the *possibility* of future generations is a prerequisite for moral coherence in the present (quality). It undermines the asymmetry argument by suggesting that the *absence* of new life actively harms the living by stripping existence of meaning.

