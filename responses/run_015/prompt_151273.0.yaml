      *   *Total Utilitarianism (Classic):* More happy lives = better. Leads to the "Repugnant Conclusion" (a massive population with barely worth-living lives is better than a smaller, very happy population).
      *   *Negative Utilitarianism / Asymmetry (Benatar):* Creating suffering is bad; failing to create happiness is not bad (because there's no one to be deprived). Non-existence is not a harm.
