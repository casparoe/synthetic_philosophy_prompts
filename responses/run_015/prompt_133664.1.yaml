      *   *Turkey (Backsliding):* Emergency powers, detentions, executive presidency, election annulment. *Key:* Formal legal basis and electoral victories do not change classification.
      *   *US (Erosion, not Backsliding):* Attempts to substitute electors/press officials. *Key:* Failed attempts absorbed by institutions = Erosion. State-level variation within democratic norms = No Backsliding. Subnational units not classified alone.
      *   *Lame-Duck Court (Erosion):* Court expansion (9 to 11), 2 judges seated post-loss. *Key:* Reversible by ordinary majority, no jurisdiction removed = Erosion (not Backsliding).

      *   *Synthesis of Precedents:*
          *   **Backsliding:** Structural, hard-to-reverse changes to horizontal accountability (courts, media, electoral admin) that entrench power, even if legal and elected. Turnover doesn't save it if institutions are captured.
          *   **Erosion:** Significant stress on institutions, but reversible or absorbed by checks. "Soft" damage.
          *   **No Classification:** Normal democratic variation, failed attempts, or changes that don't debilitate institutions.
          *   **Common Thread:** Legality/Electoral Mandate $\neq$ Defense. Reversibility is a key differentiator between Erosion and Backsliding. Impact on Horizontal Accountability is the core metric.

