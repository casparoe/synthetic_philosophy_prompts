answer: |-
  **Setup**
  Divide the 13 students into six pairs and one trio, where you join the final pair to balance the numbers, and have them sit back-to-back to eliminate non-verbal cues. Designate one student in each pair as the Speaker with a hidden agenda card and the other as the Listener with a blank inference sheet. The Speaker's card details a specific conversational context and a precise implicature they must convey, such as implying a candidate is dishonest, while imposing a constraint that forces them to violate the Maxim of Quantity by being strictly under-informative. The Listener knows the general context but not the specific agenda, tasked solely with decoding the Speaker's intended meaning based on the utterance provided.

  **Rules/Payoff**
  The scoring system incentivizes successful implicature calculation over literal truth, awarding 10 points to both students if the Listener's written inference matches the Speaker's hidden agenda exactly. If the Listener interprets the statement literally or derives a different implicature, coordination fails and both receive zero points, while an actively wrong inference deducts 5 points to penalize miscalculation. Speakers are forbidden from stating the agenda directly or using obvious synonyms, ensuring they must rely on the Listener calculating the gap between sentence meaning and speaker meaning to secure the payoff.

  **Sample Round**
  In a trial run, the Speaker gets the context "Recommending a restaurant" with the hidden agenda "Imply the Italian place has health violations without saying so." The Speaker violates Quantity by stating, "The Italian place is open tonight," omitting the crucial quality assessment. If the Listener writes "Do not eat there," the pair earns 10 points because the implicature was successfully calculated; if the Listener writes "Let's go," they get zero because the coordination failed and the literal meaning was accepted over the pragmatic inference.

  **Debrief**
  Gather the group to analyze rounds where points were lost, asking pairs to reconstruct the calculation process that either succeeded or stalled. Use these failures to map cancellability by showing how a Speaker could have neutralized the implicature with a clause like "and the food is great," and demonstrate non-detachability by swapping words, such as using "operating" instead of "open," to show the inference remains attached to the meaning rather than the specific form. This highlights that implicature is a rational inference based on shared context rather than a decoded linguistic signal.

  **Limitation**
  This activity cannot reproduce the automatic, subconscious assumption of the Cooperative Principle that drives real-world conversation, as students are explicitly trying to decode rather than naturally cooperating. I am 85% sure this design effectively demonstrates the calculation mechanic, but I am least confident in the penalty structure, as deducting points for wrong inferences might make students too risk-averse to attempt complex implicatures.
