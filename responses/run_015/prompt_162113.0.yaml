      *   *No Counterpart:* Normativity, intentionality (obviously), and perhaps the specific metaphysical weight of "causation" vs. "correlation/flow."

  4.  **Adjudicating the Three Cases:**

      *   *Case 1: Fixed-Point vs. Fragile Autonomy.*
          *   *Fixed-Point:* True Universality. Insensitive to UV details (irrelevant operators vanish). Supports Multiple Realization strongly.
          *   *Fragile:* "Accidental" symmetries or small couplings. Looks universal but isn't robust.
          *   *Philosophical Claim:* Multiple Realization arguments often assume Fixed-Point Autonomy (robustness). If they rely on Fragile Autonomy, the claim is weaker.
          *   *Diagnosis:* Philosophers often conflate the two. They see universality and assume it's deep (Fixed-Point), but sometimes it's just low-energy approximation (Fragile).
          *   *Verdict:* Shows philosophical claims are less clear/precise than they look. They need the RG distinction.

