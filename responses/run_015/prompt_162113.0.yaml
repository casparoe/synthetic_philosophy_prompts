          *   *EFT Translation:* Taking the $\Lambda \to \infty$ limit (or microscopic lattice scale $a \to 0$), specifying the microscopic action $S_{micro}$, and showing that the IR effective action $S_{eff}$ flows to a specific form where thermodynamic variables map uniquely to operators in $S_{eff}$. Bridge laws = Operator identification (e.g., magnetization $\leftrightarrow$ order parameter field expectation value).
      *   *Multiple Realization:* Same macro behavior from different micro structures.
          *   *EFT Translation:* Universality. Different $S_{micro}$ (different lattice structures, spin magnitudes, short-range interactions) flow to the *same* RG fixed point. The IR physics depends only on symmetry and dimensionality, not the UV details (irrelevant operators die out).
      *   *Weak Emergence (Epistemic):* Macro is determined by micro but hard to predict.
          *   *EFT Translation:* The RG flow is deterministic, but integrating out high-energy modes is computationally intractable (non-perturbative, sign problem, etc.). The map exists, but we can't calculate it.
      *   *Strong Emergence (Ontological):* Macro has causal powers not present in micro.
          *   *EFT Translation:* This is tricky. In standard QFT/Stat Mech, everything is unitary/determined by the path integral. Strong emergence would imply the IR effective action contains terms *not* generatable from *any* UV completion consistent with the symmetries, or that the RG flow is not surjective/injective in a way that breaks conservation laws. Basically, it claims the EFT is not just an approximation but a distinct ontological layer with independent dynamics.
      *   *Downward Causation:* Macro affects micro.
