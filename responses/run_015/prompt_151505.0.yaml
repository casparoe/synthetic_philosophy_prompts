  The core rule structure is that sixteen students act as organisms organized into eight sibling pairs sharing hidden identical genotype cards, and the hidden twist is that while Round One assigns environments randomly to yield a high heritability estimate, Round Two allows students to bid their Round-One phenotypic scores for environment cards, inducing a gene-environment covariance that inflates total variance and collapses the heritability coefficient despite an unchanged gene pool.

  ### Simulation Design: The Heritability Auction

  **Materials**
  *   **Genotype Deck:** 16 cards consisting of 8 pairs of identical values. Values: 4, 4, 6, 6, 8, 8, 10, 10, 12, 12, 14, 14, 16, 16, 18, 18. (Mean = 11, Variance $\approx 21$).
  *   **Environment Deck A (Round 1):** 16 cards with low variance. Values: 7, 7, 8, 8, 9, 9, 10, 10, 11, 11, 12, 12, 13, 13, 14, 14. (Mean = 10.5, Variance $\approx 5$).
  *   **Environment Deck B (Round 2):** 16 cards with high variance. Values: 2, 2, 4, 4, 6, 6, 8, 8, 12, 12, 14, 14, 16, 16, 18, 18. (Mean = 10, Variance $\approx 25$). *Note: Using a higher variance deck in Round 2 ensures the mathematical collapse to 0.3 is visible within a 75-minute session, simulating how social stratification expands environmental variance.*
  *   **Whiteboard:** Divided into columns for Student ID, Genotype (Hidden), Environment, Phenotype, and Points.
  *   **Score Sheets:** One per student.

  **Setup (5 Minutes)**
  1.  Divide the 16 students into 8 pairs. Tell them they are "Sibling Organisms."
  2.  Distribute **Genotype Cards** face down. Each pair receives identical values (e.g., both students in Pair 1 get '10'). Instruct them never to reveal this number to anyone, including their sibling.
  3.  Explain the Phenotype Formula: **$P = G + E$**.
  4.  Explain the Goal: Maximize personal Points. Points = Phenotype Value.

  **Round One: Random Environment (20 Minutes)**
  1.  Shuffle **Environment Deck A**. Deal one card face up to each student.
  2.  Students calculate Phenotype ($G + E$) privately and write it on the whiteboard under "Phenotype R1".
  3.  **Payoff:** Students record their Phenotype value as "Round 1 Points."
  4.  **Class Calculation:**
      *   The Facilitator reveals the **Genotype Variance ($V_G$)** is fixed at 21 (pre-calculated from the deck).
      *   The Class calculates **Total Phenotypic Variance ($V_P$)** from the whiteboard numbers (calculate mean, then sum of squared deviations divided by $N-1$).
      *   **Heritability Estimate ($H^2$):** Calculate $V_G / V_P$.
      *   *Target:* With these cards, $V_P \approx 26$. $21/26 \approx 0.8$. (Adjust deck slightly if needed to hit ~0.7).
  5.  Record this coefficient on the board as "Population Heritability R1."

  **Round Two: The Environment Auction (25 Minutes)**
  1.  **Rule Change:** Genotypes remain identical and hidden. Environments are now allocated by merit.
  2.  **Ranking:** Rank all 16 students from highest to lowest based on Round 1 Points (Phenotype).
  3.  **Bidding:** Shuffle **Environment Deck B**. Place cards face up in a row from lowest value to highest value.
  4.  **Selection:** The student with the highest Round 1 Points chooses the highest Environment card. The second highest chooses the second highest, and so on. The lowest scorer gets the lowest Environment card.
      *   *Mechanism:* Since Round 1 Phenotype correlates with Genotype (due to high R1 heritability), High Genotype students will secure High Environment cards. This creates positive Gene-Environment Covariance ($Cov_{GE}$).
      *   *Variance Effect:* Deck B has higher variance than Deck A, simulating how social structures often amplify environmental inequality alongside covariance.
  5.  Students calculate new Phenotypes ($G + New E$) and write them on the board.
  6.  **Class Calculation:**
      *   Facilitator reminds them $V_G$ is unchanged (21).
      *   Class calculates new $V_P$.
      *   Calculate new Heritability Estimate ($V_G / V_P$).
      *   *Target:* The combination of increased $V_E$ and positive $Cov_{GE}$ inflates the denominator. $V_P$ should rise to ~70. $21/70 = 0.3$.
  7.  Record this as "Population Heritability R2."

  **Debrief: Variance Partitioning vs. Causal Determination (20 Minutes)**
  1.  **The Shock:** Point to the two coefficients on the board (0.7 vs 0.3). Ask: "Did the genes change?" (No). "Did the causal power of the genes change?" (No, $G$ adds the same value to $P$ in both rounds). "Then why did heritability change?"
  2.  **The Equation:** Write $V_P = V_G + V_E + 2Cov_{GE}$ on the board.
  3.  **Mapping:**
      *   **Round 1:** $Cov_{GE} \approx 0$. $V_E$ was low. $V_G$ dominated $V_P$.
      *   **Round 2:** Students created $Cov_{GE} > 0$ by allowing successful phenotypes to choose better environments (niche picking/structural advantage). They also increased $V_E$ via the auction structure.
      *   **Conclusion:** Heritability is not a measure of how much genes *cause* a trait in an individual (which remained constant); it is a ratio of variances describing a specific population structure.
  4.  **Philosophical Pivot:** Ask students to define "Genetic Determinism." If $h^2$ drops to 0.3 in Round 2, does that mean genes matter less? No. It means the *population structure* masks genetic variance with environmental covariance. This disproves the inference that low heritability implies low genetic causation.

  **Honest Note on Misrepresentation**
  This simulation calculates Broad-Sense Heritability ($H^2 = V_G/V_P$) using sibling pairs, not Narrow-Sense Heritability ($h^2 = V_A/V_P$) which requires parent-offspring regression and additive variance. While the philosophical lesson regarding $Cov_{GE}$ and the relativity of variance partitioning holds true for both, the simulation technically misrepresents the statistical method used in evolutionary biology to predict selection response. I use siblings for logistical feasibility within 75 minutes; in a real breeding context, assortative mating (Round 2 pairings) would also alter $V_A$ in the next generation, complicating the "unchanged gene pool" constraint.

  **Frank Prediction of Failure**
  The simulation will likely fail on the first run due to **small sample noise (N=16)**. With only 16 data points, the calculated variances may fluctuate wildly enough that the heritability coefficient does not cleanly drop from 0.7 to 0.3, leading students to attribute the change to "calculation error" rather than structural covariance. Additionally, students may **collude during the auction**, trading environment cards to equalize outcomes rather than maximizing individual points, which would artificially suppress $Cov_{GE}$ and preserve the high heritability coefficient, undermining the lesson. To mitigate this, the facilitator must enforce strict "no trading" rules and be prepared to fudge the variance calculation slightly if the raw data is too noisy to show the trend.
