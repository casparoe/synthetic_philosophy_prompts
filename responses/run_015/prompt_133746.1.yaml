prompt: |-
  I am finalizing the assessment for my graduate seminar on rational belief and objective chance, and a recent dispute with a colleague about self-locating evidence in branching worlds has convinced me that the standard textbook framing is no longer sufficient. I need an essay question that students cannot answer by merely reciting the Principal Principle—that rational credence should match known objective chance in the absence of inadmissible evidence—or by listing canonical admissibility conditions. Instead, I want them to confront a deliberately constructed tension: imagine an agent who knows the global wavefunction in an Everettian multiverse and therefore knows the exact objective branch weights for a quantum measurement; she also knows that her mental state is duplicated across branches, with ninety percent of her mental duplicates observing outcome A and only ten percent observing outcome B, yet she herself observes B. The question should ask whether the Principal Principle requires her to assign credence 0.9 to A despite her first-personal knowledge, or whether her centered-world indexical that she is a B-observer blocks deference without rendering the principle vacuous, and whether uniqueness of rational credence can survive such blocking.

  Please write the exam question (calibrated for seventy-five minutes, with an expected answer of roughly seven hundred words), a model answer, and a marking scheme totaling twenty marks divided across five specific moves. The scheme must separate an A answer—one that identifies the indexical challenge, distinguishes metaphysical branch weight from epistemic access, and evaluates whether self-location undermines or merely qualifies the principle—from a B answer that accurately summarizes deference to chance but misses the centered-world problem entirely. For each of the five moves, state the marks available and provide a one-line note on the characteristic mistake candidates make. The difficulty should suit an advanced graduate seminar in formal epistemology or philosophy of science.

  In your response, please indicate how confident you are in the grading distinctions proposed, and explicitly name the single criterion about which you are least sure. End with a one-sentence summary of the marking scheme's central crux, formatted exactly as:

  \answer{The crux is whether centered-world self-location can block deference to objective chance without collapsing the Principal Principle into incoherence.}
