answer: |-
  **Exam Question**

  **Course:** Graduate Seminar in Formal Epistemology
  **Time Allowed:** 75 Minutes
  **Word Limit:** Approximately 700 Words

  **Question:**
  Consider an agent operating within an Everettian (Many-Worlds) framework who knows the universal wavefunction prior to a quantum measurement. She knows the branch weights are 0.9 for outcome A and 0.1 for outcome B. Post-measurement, she knows her mental state is duplicated across branches proportionally to these weights. However, she finds herself observing outcome B. Does the Principal Principle require her to maintain a credence of 0.9 in A despite this first-personal knowledge, or does her centered-world indexical knowledge that she is a B-observer block deference without rendering the principle vacuous? Discuss whether the uniqueness of rational credence survives such blocking.

  ***

  **Model Answer**

  The Principal Principle (PP) dictates that a rational agent's credence in a proposition should match its known objective chance, provided the agent possesses no inadmissible evidence. In standard stochastic frameworks, chance is probabilistic and exclusive; only one outcome occurs. However, in the Everettian multiverse, "chance" is reconceived as branch weight within a deterministic wavefunction. All outcomes occur, but weighted by the squared amplitude of the wavefunction. The central tension arises when an agent possesses both global knowledge of these weights and local, self-locating knowledge of her specific branch.

  Initially, the PP suggests the agent should assign credence 0.9 to outcome A based on the branch weight. This deference relies on the assumption that branch weight functions analogously to objective chance in guiding belief. However, the Everettian context complicates this. Since both A and B branches exist, the proposition "A occurs" is technically true in the global sense, but false relative to the agent's specific branch. The agent's knowledge is not merely propositional but indexical: she knows *she* is in the branch where B occurred. This self-locating evidence is distinct from the global wavefunction data.

  The critical philosophical move is determining whether this self-locating evidence counts as "inadmissible" under the PP. Standard admissibility conditions exclude evidence about the future outcome itself. Here, the agent's observation of B is evidence about her current location in the branching structure. If this indexical knowledge is deemed admissible, the PP would compel her to hold credence 0.9 in A while simultaneously knowing she observes B, creating a Moorean paradox or direct contradiction. Therefore, the self-locating proposition "I am in a B-branch" must be treated as inadmissible evidence that overrides the default deference to branch weight.

  This blocking does not necessarily render the PP vacuous. The principle can remain operational for pre-measurement agents or for propositions not tied to specific self-location within the multiverse. The PP guides belief when indexical information is absent or neutral. However, once the agent updates on her centered-world location, the rational credence shifts to reflect that certainty. She should assign credence near 1 to B and near 0 to A, despite the global weights. This suggests that in branching worlds, rational credence is a function of both objective weight and subjective location.

  Consequently, the uniqueness of rational credence survives, but its basis shifts. It is not unique solely because of the objective chance; it is unique because rationality requires coherence between global knowledge and local evidence. An agent who maintained 0.9 credence in A while observing B would be failing to update on inadmissible evidence. Thus, the PP is not violated but qualified: it applies only in the absence of self-locating information that identifies a specific branch. The rational doxastic state is unique because there is only one coherent way to integrate global weights with local indexical facts. To deny this is to sever the link between evidence and belief, rendering agency impossible in a branching universe.

  ***

  **Marking Scheme (20 Marks Total)**

  **Move 1: Articulation of the Principal Principle (4 Marks)**
  *   **Requirement:** Correctly states PP as credence matching chance conditional on admissibility.
  *   **Characteristic Mistake:** Treating the PP as an unconditional command to match chance regardless of evidence.

  **Move 2: Characterization of Everettian Chance (4 Marks)**
  *   **Requirement:** Distinguishes branch weight from stochastic frequency; notes all outcomes occur.
  *   **Characteristic Mistake:** Conflating branch weights with standard probabilities where only one outcome happens.

  **Move 3: Identification of Self-Locating Evidence (4 Marks)**
  *   **Requirement:** Identifies "I am observing B" as centered-world indexical knowledge distinct from global data.
  *   **Characteristic Mistake:** Ignoring the first-person perspective and treating the observation as standard propositional evidence.

  **Move 4: Analysis of Admissibility and Blocking (4 Marks)**
  *   **Requirement:** Argues that self-location blocks deference without destroying the PP's general utility.
  *   **Characteristic Mistake:** Claiming the PP is entirely vacuous or destroyed rather than qualified by inadmissibility.

  **Move 5: Verdict on Uniqueness of Rational Credence (4 Marks)**
  *   **Requirement:** Concludes uniqueness survives via coherence between weights and indexical facts.
  *   **Characteristic Mistake:** Asserting uniqueness dogmatically without explaining how conflicting evidence is resolved.

  **Grading Distinctions:**
  *   **A Answer (16-20 Marks):** Successfully executes Moves 3, 4, and 5, explicitly linking indexicality to admissibility.
  *   **B Answer (10-15 Marks):** Executes Moves 1 and 2 well but fails Move 3, missing the centered-world problem entirely.

  ***

  **Confidence and Criterion Uncertainty**

  I am highly confident in the grading distinctions proposed, particularly the separation between answers that engage with the indexical nature of the evidence versus those that treat it as standard propositional knowledge. The single criterion about which I am least sure is Move 4 (Analysis of Admissibility and Blocking), as the philosophical boundary between "qualifying" the Principal Principle and "collapsing" it into incoherence is subtle and may be interpreted differently depending on the specific literature favored by the candidate.

  \answer{The crux is whether centered-world self-location can block deference to objective chance without collapsing the Principal Principle into incoherence.}
