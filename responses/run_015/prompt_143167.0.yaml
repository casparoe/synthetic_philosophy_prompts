answer: |-
  1. The ten questions

  1. A four-line poem must be translated into French. It must rhyme AABB and keep exactly eight syllables per line to fit a specific melody. The literal meaning conflicts with the rhythm.
  A: Prioritize the literal meaning, even if the rhythm breaks.
  B: Prioritize the rhythm and rhyme, even if words change meaning slightly.
  C: Admit it cannot be done without losing something essential; the task is flawed.

  2. You translate "It rained" into a language requiring you to specify if you saw it, heard it, or were told. The system has no access to the speaker's experience.
  A: Pick the most common default marker automatically.
  B: Flag the sentence for human review because the info is missing.
  C: Invent a marker based on context clues, accepting the risk of lying.

  3. A novelist writes a scene where a hero dies. Later she says, "I intended him to survive spiritually." The text clearly says he died.
  A: Translate what is on the page; the text is the only authority.
  B: Translate the author's stated intention, adjusting the text to match.
  C: Include a footnote explaining the conflict between text and author.

  4. Updating a 500-year-old religious text into modern slang so teenagers understand it. The grammar changes completely.
  A: This is translation because the meaning is preserved for new readers.
  B: This is rewriting because the original voice is lost.
  C: This is only translation if the community accepts it as sacred.

  5. A menu describes a dish using a color code: red text means spicy. The system translates the words but outputs black text.
  A: It succeeded; the words are correct.
  B: It failed; the visual signal is part of the meaning.
  C: It depends on whether the reader sees the screen or prints it.

  6. A joke in chapter 1 relies on a reveal in chapter 10. Translating chapter 1 alone makes the joke nonsense.
  A: Translate chapter 1 literally; the reader will understand later.
  B: Adjust the joke in chapter 1 so it works standalone, changing the setup.
  C: Refuse to translate chapter 1 without the whole manuscript.

  7. A machine translates medical instructions. It gets the tone wrong but the dosage correct 99% of the time.
  A: It understands enough because the outcome is safe.
  B: It does not understand; tone is part of the instruction's force.
  C: It understands the data but not the patient's situation.

  8. A text is generated by a machine in Spanish, then fed back into the machine to translate to English. The output differs from the original English but means the same.
  A: The system understands because it recovered the meaning.
  B: The system is just looping symbols; the drift proves no understanding.
  C: The difference shows meaning is not fixed enough to judge understanding.

  9. Translating an apology letter for a crime. The system generates perfect words of remorse.
  A: The apology is valid if the recipient feels forgiven.
  B: The apology is fake because the sender feels nothing.
  C: The apology is a tool; sincerity is separate from the text.

  10. Two expert human translators disagree on whether a pun was preserved in a translation.
  A: One is right; there is a fact about the meaning.
  B: Both are right; meaning depends on the reader's take.
  C: The question is pointless; only the effect matters.

  2. Scoring key

  | Question | Option A leans toward | Option B leans toward | Option C leans toward |
  | :--- | :--- | :--- | :--- |
  | 1 (Verse) | Content-first | Form-and-music | Indeterminacy |
  | 2 (Evidential) | Reliability-first | Grounding | Purpose-relative |
  | 3 (Intention) | Content-first | Whole-text/ToM | Purpose-relative |
  | 4 (Intralingual) | Purpose-relative | Form-and-music | Content-first |
  | 5 (Visual) | Content-first | Grounding | Purpose-relative |
  | 6 (Whole Text) | Content-first | Whole-text/ToM | Purpose-relative |
  | 7 (Medical) | Reliability-first | Whole-text/ToM | Grounding |
  | 8 (Back-trans) | Reliability-first | Grounding | Indeterminacy |
  | 9 (Apology) | Purpose-relative | Grounding | Reliability-first |
  | 10 (Disagree) | Content-first | Indeterminacy | Purpose-relative |

  **Scoring mixed patterns:** Tally which leaf appears most often across your ten choices. If no leaf dominates, look for clusters: choosing B on 1, 4, and 6 suggests a coherent "deep structure" view (Form/Whole-text). Choosing A on 2, 7, and 8 suggests a "functional output" view.

  **Diagnostic weight:** Questions 1, 2, and 9 carry the most weight. Q1 separates those who see form as decorative from those who see it as constitutive. Q2 forces a choice between statistical safety and experiential truth. Q9 isolates the "self/stakes" complaint most sharply.

  **Less discriminating:** Questions 4 and 10 often attract "Purpose-relative" answers from both functionalists and deflationists, making them less useful for separating those two leaves. Question 5 is novel but may confuse participants unfamiliar with multimodal text.

  3. The logical space

  The ten questions jointly define three primary distinctions that carve up the logical space of translation understanding. First, **Locus of Meaning**: Is meaning located strictly in the propositional content (the "what"), or does it inhabit the form, medium, and context (the "how" and "where")? Second, **Criterion of Success**: Is a translation successful because it matches an external reality (truth/accuracy), because it achieves a specific use-case (utility), or because it preserves the internal coherence of the source (fidelity)? Third, **Source of Authority**: Who decides if understanding occurred—the system's reliability, the author's intent, or the reader's reception?

  These distinctions generate eight theoretical cells. The **Content-first** view sits in the cell where meaning is propositional, success is accuracy, and authority is textual. The **Reliability-first** view shares the propositional locus but shifts success to utility and authority to performance. The **Form-and-music** view locates meaning in the medium, demanding fidelity to structure over proposition. The **Grounding** view insists meaning requires a link to non-linguistic experience (body/world), rejecting purely textual authority. The **Whole-text/ToM** view locates meaning in the author-reader relationship, requiring context beyond the sentence. The **Purpose-relative** view makes success entirely dependent on the user's goal, dissolving fixed authority. Finally, the **Indeterminacy** view occupies the skeptical cell where neither locus nor criterion is fixed; meaning is unstable.

  Most participants will cluster in the Content-first or Reliability-first cells (engineering/analytic bias) or the Form/Grounding cells (humanities bias). The Purpose-relative and Indeterminacy cells act as escape hatches for those who find the binary of "understands/does not understand" itself flawed. The map reveals that disagreements about machine translation are rarely about the technology's capability, but about which cell of this space one inhabits prior to the test.

  4. Empty cells

  Certain combinations of answers map to empty cells—positions no actual participant occupies. The most prominent is **Reliability-first combined with Indeterminacy**. This would imply that while there is no fact of the matter about meaning (Indeterminacy), we can still measure success by consistent output (Reliability). This is incoherent: if meaning is indeterminate, reliability is merely consistent noise, not a metric of understanding. Participants who try to hold both usually collapse into Purpose-relative views upon probing.

  A second empty cell is **Grounding combined with Content-first**. This position claims understanding requires bodily experience (Grounding) but that meaning is purely propositional (Content). This is unattractive because propositions are typically abstractable from experience. If the body is required, the meaning must exceed the proposition. Those who select this pattern usually misunderstand the grounding cases as requiring mere data inputs rather than felt experience.

  A third potentially empty cell is **Whole-text/ToM combined with Reliability-first**. This suggests one needs a model of the author's mind to understand, but that statistical accuracy is sufficient proof of that model. While some engineers hope for this, it is unexplored philosophically: reliability does not prove the existence of a model, only the output of one. Participants selecting this often conflate "modeling the user" with "modeling the author."

  5. What the quiz cannot separate

  Despite its granularity, the quiz leaves certain leaves stuck together. The **Grounding** and **Whole-text/ToM** views often align on every question because both reject surface-level statistical matching in favor of "deep" context. Both will choose Option B on Q2 (Evidential), Q6 (Whole Text), and Q9 (Apology). The quiz cannot distinguish whether the participant demands a body (Grounding) or just a rich context (Whole-text), as both oppose the Content-first view similarly.

  Similarly, **Purpose-relative** and **Indeterminacy** views often overlap. Both reject fixed correctness (Option C on Q1, Q10). The quiz cannot easily separate the pragmatist (meaning is what works) from the skeptic (meaning is unknowable).

  To pry Grounding and Whole-text apart, a further question would be needed: "If a system had a perfect model of the author's life but no body, could it translate a poem about pain?" Grounding says no; Whole-text says yes. To separate Purpose and Indeterminacy, ask: "If a translation works for everyone but violates the text, is it correct?" Purpose says yes; Indeterminacy says the question is invalid. These nuances require a second session focused on metaphysics rather than translation cases.

  6. Running the session

  Begin by having participants answer the ten questions silently, then tally their dominant leaf. Discuss Q1 (Verse) first to set the stakes on form, then Q9 (Apology) to introduce the "self" constraint. Save Q2 (Evidential) for last as it is the most technical. In a mixed group, expect translators to cluster on Form/Whole-text and engineers on Reliability/Content, with philosophers scattered across Indeterminacy and Grounding. The exercise is likely to go wrong if participants treat the options as "right vs. wrong" rather than diagnostic signals. Intervene if debate focuses on technical feasibility ("Can MT do this?") rather than the conceptual commitment ("Does it matter if it can?"). Keep the focus on what their choices imply about understanding, not on the tool's current limits.
