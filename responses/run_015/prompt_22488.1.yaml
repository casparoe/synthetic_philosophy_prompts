answer: |-
  You have correctly identified the spirit of the standard resolution, but there is a crucial technical detail in your reasoning that needs adjustment. Your intuition about symmetry is right, but **rotational symmetry alone is not sufficient** to distinguish the three methods.

  The resolution you are looking for is most famously associated with **E.T. Jaynes** (in his paper *The Well-Posed Problem*). He argues exactly as you do: that the principle of indifference must be applied to a measure invariant under the symmetries of the problem. However, the "symmetry group" required to isolate a unique solution is larger than the symmetry group of the circle itself.

  Here is the breakdown of where your reasoning holds, where it needs refinement, and how the uniqueness of the measure works.

  ### 1. The Flaw in "Rotational Symmetry"
  You wrote:
  > *the circle is invariant under its full group of rotations and reflections, so the only genuinely unbiased measure on the space of chords should be the one invariant under that symmetry group*

  The problem is that **all three** standard solutions (1/2, 1/3, and 1/4) are invariant under the rotations and reflections of the circle.
  *   **1/3 (Random Endpoints):** If you rotate the circle, the distribution of endpoints rotates with it. It is rotationally symmetric.
  *   **1/4 (Random Midpoint):** If you rotate the circle, the uniform distribution of midpoints rotates with it. It is rotationally symmetric.
  *   **1/2 (Random Radius/Distance):** This is also rotationally symmetric.

  Therefore, demanding invariance under the circle's rotation group $O(2)$ does not break the tie. It filters out *some* weird parameterizations, but it leaves all three "standard" candidates alive.

  ### 2. The Correct Symmetry Group: Euclidean Motions
  To break the tie, you must consider the **context** of the circle. In a physical or probabilistic setting, the circle is usually an object located *within* a plane, not the entirety of the universe.

  If the problem statement does not specify the circle's position or size, a state of "maximum ignorance" implies that the probability distribution should not depend on:
  1.  **Where** the circle is located (Translation invariance).
  2.  **How big** the circle is (Scale invariance).
  3.  **How** the circle is oriented (Rotation invariance).

  Jaynes showed that if you require the measure on the space of chords (lines intersecting the circle) to be invariant under the **group of rigid motions of the plane (the Euclidean group)**, you isolate a unique measure.

  ### 3. The Uniqueness of the Measure (Your Haar Measure Concern)
  You asked:
  > *I'm specifically unsure about the step where I claim the circle's symmetry group is rich enough to fix a unique measure on chords... I know that uniqueness results (like the uniqueness of Haar measure) attach to the group itself, and I'm not sure that transfers to a space the group acts on.*

  This is the strongest part of your intuition. You are correct that Haar measure uniqueness applies to the group. However, in integral geometry, there is a corresponding result for homogeneous spaces.

  The space of all oriented lines in a plane can be parameterized by $(\rho, \theta)$, where $\theta$ is the angle of the normal vector and $\rho$ is the signed distance from the origin.
  *   The Euclidean group acts on this space of lines.
  *   There exists a unique (up to a scalar constant) measure on this space that is invariant under Euclidean motions.
  *   This measure is **$d\mu = d\rho \, d\theta$**.

  This is the **kinematic measure**. It is the analog of the Haar measure for the space of lines.

  **Why this picks 1/2:**
  A chord is longer than the side of the inscribed equilateral triangle if and only if its perpendicular distance from the center, $\rho$, is less than $R/2$ (where $R$ is the radius).
  *   The total measure of lines intersecting the circle is $\int_{0}^{2\pi} \int_{-R}^{R} d\rho \, d\theta = 4\pi R$.
  *   The measure of "favorable" lines (where $|\rho| < R/2$) is $\int_{0}^{2\pi} \int_{-R/2}^{R/2} d\rho \, d\theta = 2\pi R$.
  *   The ratio is $(2\pi R) / (4\pi R) = \mathbf{1/2}$.

  **Why the others fail this test:**
  *   **The 1/4 solution** assumes a uniform distribution of midpoints over the *area* ($dA = r \, dr \, d\theta$). This corresponds to a measure $d\mu \propto \rho \, d\rho \, d\theta$. This is **not** translation invariant. If you shift the coordinate system, the density of lines changes relative to the new origin.
  *   **The 1/3 solution** assumes uniform endpoints. This corresponds to a measure $d\mu \propto \frac{1}{\sqrt{R^2 - \rho^2}} \, d\rho \, d\theta$. This is also **not** translation invariant; it implicitly places a higher density of lines near the perimeter.

  ### 4. Is the Paradox "Resolved"?
  Your conclusion is essentially correct, with the amendment regarding the symmetry group:

  > *the "paradox" is really just people failing to notice that two of the three constructions are secretly biased.*

  In the context of **objective Bayesian priors** (where you want a prior that assumes nothing about the physical mechanism generating the data), **yes, this is the standard resolution.** The 1/2 answer is the only one that corresponds to a prior that is invariant under the location and scale of the circle.

  However, a caveat is necessary: If the physical process is known, the "symmetry" argument is overruled by the physics.
  *   If you are throwing straws onto a circle drawn on the floor, the 1/2 prior (invariant line measure) is physically correct.
  *   If you are spinning a dial on the rim to pick endpoints, the 1/3 prior is physically correct.
  *   If you are picking a location on a map to be the midpoint, the 1/4 prior is physically correct.

  Bertrand's paradox is not a mathematical contradiction; it is a demonstration that the phrase "at random" is ill-defined without specifying the **invariance group** of the physical process.

  ### Summary
  1.  **Your Intuition:** Correct. The resolution relies on symmetry-invariant measures.
  2.  **The Correction:** Rotational symmetry of the circle is not enough (all three methods have it). You need **translation and scale invariance** (treating the circle as an object in a plane).
  3.  **The Math:** Your worry about Haar measure was well-placed but ultimately unfounded. There *is* a unique measure on the space of lines invariant under the Euclidean group ($d\rho \, d\theta$), and it uniquely yields the 1/2 answer.
  4.  **The Verdict:** The 1/3 and 1/4 methods are indeed "biased" in the sense that they privilege a specific origin or scale, violating the principle of maximum ignorance.

  You can proceed with the 1/2 prior for your side project with confidence, provided your model assumes no prior knowledge about the location or scale of the parameters involved.
