prompt: |-
  I ran into Bertrand's paradox while trying to pick a "default" prior for a probabilistic model in a side project, and the standard discussion of the principle of indifference kept landing on the random-chord problem, so I want to make sure I have the resolution straight. As I understand it, the probability that a randomly drawn chord of a circle is longer than the side of an inscribed equilateral triangle comes out to 1/2, 1/3, or 1/4 depending on which of the three usual constructions you use to define "random." My working assumption is that the way to break the tie is to let symmetry do the work: the circle is invariant under its full group of rotations and reflections, so the only genuinely unbiased measure on the space of chords should be the one invariant under that symmetry group, and I'm fairly confident that argument picks out a unique measure and hence a single correct answer, with the other two values being artifacts of lopsided parameterizations that quietly break the symmetry.

  If that's right, then the principle of indifference isn't actually broken — it just has to be applied to the symmetry-invariant measure, and the "paradox" is really just people failing to notice that two of the three constructions are secretly biased. Could you walk me through whether this symmetry-based resolution is the standard one, and if not, where it goes wrong? I'm specifically unsure about the step where I claim the circle's symmetry group is rich enough to fix a unique measure on chords, because I know that uniqueness results (like the uniqueness of Haar measure) attach to the group itself, and I'm not sure that transfers to a space the group acts on. That last step feels like the whole thing hinges on it, and it's the part I'd least like to get wrong.
