  There is no single canonical term in analytic metaphysics that captures this specific triad: cosmic nihilism, non-optional grip, and denied objective value. Harry Frankfurt's "volitional necessity" describes the non-optional care but lacks the nihilistic constraint; it assumes caring generates importance. Susan Wolf's "fitting fulfillment" requires objective worth, which your cases explicitly deny. I propose coining **"immanent necessity."** This captures the binding force (necessity) that arises strictly within the local horizon (immanent) without appealing to transcendental value or subjective choice. It distinguishes the phenomenon from both "chosen projects" (existentialism) and "objective goods" (realism). The term signals that the constraint is real to the agent, yet bounded entirely within the practice itself, requiring no external validation to sustain its grip. It names the experience of being bound by something you know is ultimately nothing.

  ### Nearest concepts
  **Harry Frankfurt's "Volitional Necessity"** captures the non-optional grip: agents care because they cannot help but care. However, Frankfurt treats these cares as constitutive of the self without emphasizing the *conflict* with cosmic nihilism. Your subjects hold the grip and the nihilism in tension; Frankfurt assumes the care itself generates importance, whereas your subjects deny the importance while retaining the care.

  **Albert Camus' "The Absurd"** acknowledges the indifference of the universe alongside human engagement. However, Camus demands "revolt"—a conscious, defiant choice to persist. Your cases describe a passive submission ("stopping would be a thing that happened to me"), lacking the heroic volition Camus requires. They are not rebelling; they are occupied.

  **Susan Wolf's "Fitting Fulfillment"** defines meaning as subjective attraction to objective worth. Your cases possess attraction but explicitly deny objective worth. Wolf's framework forces these into "mere enjoyment," failing to capture the gravity your subjects insist on. She cannot account for serious engagement without value.

  **Bernard Williams' "Ground Projects"** identifies commitments that make life intelligible. Yet Williams suggests these projects provide reasons to live. Your subjects deny the projects offer *reasons* in a justificatory sense; they offer only traction.

  **Hubert Dreyfus's "Sacredness"** describes grip without belief, but frames it as a disclosure of truth. Your subjects deny the truth of the practice, accepting only its hold.

  ### One or three
  They are one phenomenon with different etiology. The core is **constitutive inescapability**. Case 1 (PhD) is *professional internalization*: the practice has reshaped the agent's volitional structure. Case 2 (Canal) is *embodied habituation*: the physical engagement creates a demand that bypasses cognitive evaluation. Case 3 (Ritual) is *narrative continuity*: the practice holds the self together against the "weightless" void.

  The commonality is that the "grip" functions as a **volitional constraint** rather than a **valuation**. In all three, stopping is not an option because the activity is no longer an object of choice; it is part of the structure of the choosing agent. The difference in origin (intellectual, physical, ritual) doesn't change the metaphysical status of the grip. They are all instances of the will encountering its own limits within a nihilistic framework. The inherited vs. acquired distinction is superficial; what matters is that the commitment has become *opaque* to the will. You cannot choose to stop caring any more than you can choose to stop believing a logical proof you understand. The source (religion, work, hobby) is incidental to the structural bind. The core case is the agent who finds their will pre-empted by a local demand they cannot justify globally.

  ### Definition and edges
  **Definition:** Immanent Necessity is a state where an agent is bound to a practice by a volitional constraint they did not choose, despite denying the practice's objective or cosmic value.

  **Rules out:**
  **Chosen Projects:** Existentialist "leaps" where the agent authors the value. Here, the agent finds the value already binding.
  **Enjoyment/Hedonia:** The activity need not be pleasant (Case 2 is muddy/unpleasant).
  **Mere Habit:** Habits can be broken with effort; this feels metaphysically blocked ("a thing that happened to me").
  **Attachment:** Attachment implies emotional bond; one can be gripped without affection (Case 1).
  **The No-Pull Case:** This is crucial. The nihilist who feels no pull is experiencing *nihilism proper*. The subject of Immanent Necessity experiences *nihilism + constraint*. The difference is the presence of the volitional bind. The no-pull case lacks the "necessity" component; they are free, but empty. Your cases are unfree, but filled. The boundary is the experience of *compulsion* versus *indifference*. The no-pull case admits freedom; the immanent necessity case admits fate. This distinguishes the phenomenon from simple apathy or depression; it is a specific form of engaged determinism.

  ### What it costs
  **Trouble for:** **Objective Realism** (Wolf, Smuts) cannot count this as meaning because the "objective worth" condition fails. **Subjectivism** (Taylor's weak version) struggles because the agent denies *choosing* the value. **Existentialism** (Sartre/Camus) struggles because the agent denies *radical freedom*; they feel determined.

  **Absorbs it:** **Frankfurtian Compatibilism** handles the non-optional care well. **Naturalistic Aristotelianism** (Foot/Thompson) could frame this as functional necessities of a human life-form, regardless of cosmic truth. **Quietist Metaphysics** (Wittgensteinian) accepts the practice as self-justifying within the form of life, requiring no external validation. It forces meaning theory to decouple "mattering" from "truth" and "choice." This suggests meaning might be a structural feature of agency rather than a relation to value. If this counts as meaning, then meaning is not about *what* matters, but *that* something matters to you, regardless of why.
