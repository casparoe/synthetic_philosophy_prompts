  ### Structural Notes for Discussion

  **1. The Empty Leaf (Leaf 8)**
  The combination of answers leading to Leaf 8 (Universal pattern + No Regret + No Weighting) is theoretically **unexplored and likely incoherent**. Standard non-Expected Utility models rely on either probability weighting (Quiggin) or regret mechanisms (Loomes & Sugden) to explain the Allais violation without resorting to error. A respondent who claims the violation is universal and stable but denies these mechanisms lacks a model to justify the violation.

  **2. Indistinguishable Leaves (Leaf 5 vs. Leaf 7)**
  This tree separates **Regret Theory** (Leaf 5) and **Rank-Dependent Utility** (Leaf 7) based on introspective mechanism (Node 5 and Node 8). However, in standard Allais choice data, these two theories often predict identical choices. Without access to the respondent's internal reasoning or more complex choice sets (e.g., varying the magnitude of regret or the spacing of probabilities), the tree cannot empirically distinguish these positions based on choice behavior alone.

  **3. Injections**
  *   **Non-Money Outcomes:** Node 6 tests whether the "certainty effect" is specific to monetary utility or applies to health/time, separating Leaf 6 from Leaf 7.
  *   **Common Consequence Loss:** Node 7 tests whether the pattern holds when the common branch involves avoiding a loss, further testing the generality required for Leaf 7.
  *   **Menu Dependence:** Node 2 isolates views that reject the independence of irrelevant alternatives, leading directly to Leaf 2.
