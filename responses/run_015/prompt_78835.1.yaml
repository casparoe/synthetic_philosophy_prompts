  **Root Commitment:** You report the following pattern:
  1.  You prefer a **Certain \$1M** over a **Gamble A** (10% \$5M, 89% \$1M, 1% \$0).
  2.  You prefer a **Gamble B** (10% \$5M, 90% \$0) over a **Gamble C** (11% \$1M, 89% \$0).

  ---

  ### The Decision Tree

  **Node 1 (Stability):** Upon slow reflection, do you endorse this preference pattern as correct, or do you view it as a lapse in calculation?
  *   **Lapse:** Go to **Leaf 1**.
  *   **Endorse:** Go to Node 2.

  **Node 2 (Menu Dependence):** Does the presence of a "safe" option change the attractiveness of a "risky" option, even if the risky option's outcomes remain identical?
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to Node 3.

  **Node 3 (Reduction):** If a gamble is described as two sequential coin flips, do you evaluate it as mathematically equivalent to a single flip with combined odds?
  *   **No:** Go to **Leaf 3**.
  *   **Yes:** Go to Node 4.

  **Node 4 (Diachronic):** If you plan to choose Option X today, but when the time comes you prefer Option Y, are you rational to force yourself to stick with Plan X?
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to Node 5.

  **Node 5 (Regret):** Is your choice driven primarily by avoiding the emotional sting of knowing you could have had the sure thing?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to Node 6.

  **Node 6 (Non-Money Domain):** Does this preference pattern persist if the prizes are months of pain-free life rather than dollars?
  *   **No:** Go to **Leaf 6**.
  *   **Yes:** Go to Node 7.

  **Node 7 (Loss Domain):** Does this preference pattern persist if the "sure thing" is avoiding a penalty rather than receiving a gift?
  *   **No:** Go to **Leaf 6**.
  *   **Yes:** Go to Node 8.

  **Node 8 (Probability Weighting):** Do you treat a 100% chance as qualitatively different from a 99% chance, more than 50% differs from 49%?
  *   **Yes:** Go to **Leaf 7**.
  *   **No:** Go to **Leaf 8**.

  ---

  ### Theoretical Positions (Leaves)

  **Leaf 1: Performance Error**
  *   **Commitment:** The pattern violates normative rules and should be corrected upon reflection.
  *   **Least Comfortable Commitment:** Admitting that your immediate intuitions are mathematically wrong.

  **Leaf 2: Menu-Dependent Choice**
  *   **Commitment:** The value of a prospect is not intrinsic but depends on the set of alternatives offered.
  *   **Least Comfortable Commitment:** Abandoning the idea that options have stable values independent of context.

  **Leaf 3: Non-Reductionist**
  *   **Commitment:** The structure of a lottery (stages vs. simple) matters, not just the final probability distribution.
  *   **Least Comfortable Commitment:** Accepting that the description of a risk changes its rational value.

  **Leaf 4: Resolute Choice**
  *   **Commitment:** Rationality requires binding your future self to a prior plan even if preferences reverse.
  *   **Least Comfortable Commitment:** Committing to ignore your own future preferences at the moment of choice.

  **Leaf 5: Regret Theory**
  *   **Commitment:** Choices maximize modified utility that includes anticipated emotional regret.
  *   **Least Comfortable Commitment:** Basing rational choice on anticipated emotions rather than outcomes alone.

  **Leaf 6: Domain-Specific Heuristic**
  *   **Commitment:** The pattern is a psychological feature of how people treat certainty in specific contexts, not a general axiom violation.
  *   **Least Comfortable Commitment:** Conceding that rationality principles depend on the commodity (money vs. health) or frame (gain vs. loss).

  **Leaf 7: Rank-Dependent Utility**
  *   **Commitment:** Independence is false; probabilities are weighted non-linearly based on their rank.
  *   **Least Comfortable Commitment:** Accepting that probabilities do not sum to unity in evaluation.

  **Leaf 8: Unnamed Position**
  *   **Commitment:** The pattern is a universal axiom violation, but not driven by regret or probability weighting.
  *   **Least Comfortable Commitment:** Defending a violation without a specified psychological or mathematical mechanism.

