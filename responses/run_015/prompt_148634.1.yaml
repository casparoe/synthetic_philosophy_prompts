  ### The Principle of Categorical Causal Individuation (PCCI)

  To capture your six verdicts without contradiction, you cannot rely on a monistic criterion (e.g., "spatiotemporal location alone" or "qualitative properties alone"). Your judgments indicate **ontological pluralism**: the conditions for individuation shift depending on the metaphysical category of the entity in question.

  The most precise principle accommodating your reflective equilibrium is the **Principle of Categorical Causal Individuation (PCCI)**:

  > **Numerical distinctness is grounded in distinct causal-spatiotemporal boundaries or histories, *unless* the entities belong to a fundamental quantum category defined by state-occupancy, in which case indistinguishability implies non-individuation.**

  This principle contains three operative clauses motivated by your specific cases:

  1.  **The Classical Substrate Clause:** For macroscopic substances, cosmological structures, and functional artifacts, numerical distinctness is sufficient grounded by **causal-spatiotemporal isolation**, even in the absence of qualitative differences.
      *   *Motivated by:* **Case 1** (Black's Spheres), **Case 3** (Pocket Universes), and **Case 5** (Software Instances). In all three, distinct substrates or causal histories suffice for "twoness" despite qualitative identity.
  2.  **The Quantum Field Clause:** For fundamental quantum entities in symmetric states, numerical distinctness is **not** grounded by spatial separation if state overlap occurs; they are to be counted as excitations of a single field rather than distinct individuals.
      *   *Motivated by:* **Case 2** (BEC Atoms). This prevents the principle from falsely multiplying entities where physics suggests ontological unity.
  3.  **The Diachronic Continuity Clause:** For psychophysical agents (persons), numerical identity *over time* requires **causal continuity** of the substrate or psychology, not merely qualitative replication or structural matching.
      *   *Motivated by:* **Case 4** (Teletransportation). This distinguishes *synchronic* counting (Case 5, where two instances can exist simultaneously) from *diachronic* survival (Case 4, where the original must persist to survive).

  *Note on Case 6:* Your judgment that the spheres are distinct aligns with Clause 1. Your intuition that the distinction feels "superficial" compared to Case 1 is a phenomenological observation about *intrinsic* vs. *extrinsic* grounding, but the PCCI treats the metaphysical verdict ("they are two") as identical in both cases, as both rely on spatiotemporal relations.

