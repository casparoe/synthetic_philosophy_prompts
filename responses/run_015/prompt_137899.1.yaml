answer: |-
  # Q&A Prep Sheet: "The Alternatives Line"

  ### 1. The Integrity Objection (Quantitative/Theory Biologist)
  *   **Likelihood:** High | **Severity:** Critical
  *   **Who:** The postdoc in the back with the crossed arms.
  *   **Phrasing:** "You're asking journalists to print alternatives that the data explicitly ruled out. If a model shows selection is identifiable and drift is negligible, forcing a sentence about drift isn't nuance, it's misinformation. Are you advocating for scientific inaccuracy in the name of balance?"
  *   **Your Reply (2 mins):** "I'm advocating for transparency about the *scope* of the inference, not the result. A reciprocal transplant might prove local adaptation, but it doesn't prove the *mechanism* wasn't constrained by developmental history before selection acted. The 'Alternatives Line' doesn't say 'Drift definitely happened.' It says 'Selection is the story here, but drift is the background noise we can't fully silence.' It protects against the headline that turns 'consistent with selection' into 'proof of design.'"
  *   **Concede:** Acknowledge that if a study *mathematically excludes* an alternative, naming it as equally probable would be wrong. The rule applies to the *narrative leap*, not the statistical result.
  *   **Soft Spot:** You are asking journalists to imply uncertainty where the scientist feels certainty. This creates friction.
  *   **Why this must land:** If you agree to print known falsehoods for the sake of style, you lose the room's trust instantly.

  ### 2. The Feasibility Objection (Sci-Comm Master's Student)
  *   **Likelihood:** High | **Severity:** High
  *   **Who:** The student worrying about their future editors.
  *   **Phrasing:** "This kills narrative flow. An 800-word story can't carry a 'on the other hand' clause in every paragraph. Editors will cut it, or kill the piece. Isn't this a rule that only works in a vacuum?"
  *   **Your Reply (2 mins):** "Narrative tension *is* the story. 'Scientists think X, but Y haunts the data' is more compelling than 'Scientists found X.' I'm not asking for a paragraph; I'm asking for a clause. 'While physical constraint could explain the shape, selection likely sharpened it.' That's twelve words. It survives deadline."
  *   **Concede:** Acknowledge that some editors will still cut it. The rule is a shield for the writer to fight that cut, not a guarantee it will stay.
  *   **Soft Spot:** You know as well as they do that some editors view nuance as weakness.
  *   **Strategy:** **Pre-empt this.** Bring this up in your talk before they ask. It shows you understand the newsroom constraints.

  ### 3. The Historical Objection (Visiting Historian)
  *   **Likelihood:** Medium | **Severity:** Medium-High
  *   **Who:** The historian of the adaptationism disputes.
  *   **Phrasing:** "Gould and Lewontin's Spandrels paper was an epistemological critique about testing, not a stylistic one about prose. You're reducing a philosophical argument about evidence into a copy-editing checklist. Doesn't that trivialize the actual dispute?"
  *   **Your Reply (2 mins):** "You're right about the paper. I'm talking about the *reputation* of the paper, which is what actually entered the wild. The legacy of Spandrels in journalism isn't the logic, it's the vibe that 'adaptationism is default.' I'm trying to codify the vibe because the logic is too heavy for a news column. It's a heuristic, not a history lesson."
  *   **Concede:** Admit your menu is not Gould and Lewontin's. It's a journalistic tool inspired by their shadow.
  *   **Soft Spot:** You are admitting to simplifying a complex intellectual history for mass consumption.

  ### 4. The Trust Objection (Field/Organismal Biologist)
  *   **Likelihood:** High | **Severity:** Medium
  *   **Who:** The senior prof who does reciprocal transplants.
  *   **Phrasing:** "I spend years measuring selection gradients in the wild. You're suggesting my rigorous work needs a 'drift' disclaimer in the press so readers don't get the wrong idea. Doesn't this undermine the hard work of measurement?"
  *   **Your Reply (2 mins):** "It protects your work from the next guy who claims the opposite. If I write 'Trait X evolved for Y' without mentioning 'or Z,' and a new study shows Z, your work looks wrong. If I write 'Trait X likely for Y, though Z is possible,' your work looks like a step in a process. It extends the shelf-life of your findings."
  *   **Concede:** Acknowledge that it feels like a tax on certainty.
  *   **Soft Spot:** They measure selection; you measure stories. They may feel you are taxing them to fix your industry's sins.

  ### 5. The Nuance Objection (Dev-Evo Biologist)
  *   **Likelihood:** Medium | **Severity:** Medium
  *   **Who:** One of the two developmentalists.
  *   **Phrasing:** "Your menu lists 'constraint' as one option among many. But constraint isn't just an alternative; it's the substrate selection acts on. Listing it like a menu item implies it's mutually exclusive with selection. That's the old thinking we're trying to move past."
  *   **Your Reply (2 mins):** "That's a fair critique of the word 'constraint.' The menu is a starting point for journalists who don't know the difference between bias and constraint. I'd welcome your help in refining the definitions so the sentence captures the interaction, not just the opposition."
  *   **Concede:** The menu is simplistic. It's a training wheel, not the bike.
  *   **Soft Spot:** You are asking them to accept a simplified version of their own field.

  ### 6. The Relevance Objection (The Skeptic)
  *   **Likelihood:** Medium | **Severity:** Low-Medium
  *   **Who:** The skeptic who thinks the fight is settled.
  *   **Phrasing:** "This debate was settled in the 1980s. We know adaptation isn't the only force. Why are we having a lecture in 2024 about a problem that evolutionary biology already solved?"
  *   **Your Reply (2 mins):** "Biology solved it. Journalism didn't. The public conversation is still running on 1970s assumptions. My audience isn't this room; it's the readers who think every trait is an optimal solution. I'm here because the solution didn't leak out of the academy."
  *   **Concede:** Agree that within the department, this is old news.
  *   **Soft Spot:** It implies the department has failed at public communication for 40 years.

  ### 7. The Confusion Objection (General Audience)
  *   **Likelihood:** Low | **Severity:** Low
  *   **Who:** A grad student from another department.
  *   **Phrasing:** "If you put too many alternatives in, won't the reader just walk away thinking 'scientists don't know anything'? Doesn't certainty sell science?"
  *   **Your Reply (2 mins):** "Certainty sells retractions. Readers are smarter than we think. They know life is complicated. A story that admits complexity builds more trust than a story that promises a simple answer and then gets contradicted by the next headline."
  *   **Concede:** Acknowledge that simplicity is the default for a reason.
  *   **Soft Spot:** You don't have data proving readers prefer the nuanced version.

  ### 8. The Consensus Objection (Sci-Comm Student)
  *   **Likelihood:** Low | **Severity:** Low
  *   **Who:** The other Master's student.
  *   **Phrasing:** "Shouldn't journalists report the scientific consensus? If 90% of papers support selection, why give airtime to the 10% drift hypothesis?"
  *   **Your Reply (2 mins):** "Because the 90% often assumes the null of the 10%. If the baseline assumption is adaptation, the consensus is skewed. Naming the alternative resets the baseline so the consensus is measured accurately."
  *   **Concede:** Consensus is usually the right guide, but not when the consensus method has a blind spot.
  *   **Soft Spot:** You are asking journalists to second-guess the weight of scientific consensus.

  ***

  ### Critical Strategic Moves

  **The Single Reply That Must Land:**
  **Objection #1 (The Integrity/Quant Objection).**
  If you fail here, you are branded as an advocate for "false balance" (like climate change denialism). You must firmly distinguish between *naming an alternative* and *endorsing an alternative*. The distinction is: "This is the shadow the data casts," not "This is equally true."

  **The Objection to Pre-empt:**
  **Objection #2 (The Feasibility/Editor Objection).**
  Do not wait for the Sci-Comm students to raise this. In your talk, explicitly say: *"I know what an editor on deadline looks like. I know word count is tight. This rule is designed to survive the cut."* If you say this, they become allies. If you wait, they become auditors.

  **The Question You Hope Nobody Asks:**
  **"I recognize that third clip you're showing as an example of 'narrative adaptationism.' Didn't you write that feature for the *Times* in 2019?"**
  *   **Why it hurts:** It turns your prescriptive rule into a confession of past hypocrisy. It suggests you are preaching a standard you haven't met.
  *   **How to handle it if asked:** Do not deflect. Own it immediately. *"Yes, I did. That piece is in the deck precisely because it's mine. I wrote it before I formulated this rule. It is the example of why I need the rule. I am not standing above this problem; I am trying to build a tool to stop myself from doing it again."*
  *   **Better Strategy:** **Volunteer this.** In your introduction, when you show the clips, say: *"The first two are from other outlets. The third is one I wrote five years ago. It's the reason I'm standing here today."* This disarms the attack completely and turns your vulnerability into your strongest credential. You aren't a critic; you're a reformed practitioner.
