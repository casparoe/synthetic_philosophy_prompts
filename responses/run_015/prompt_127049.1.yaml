answer: |-
  You have put your finger on a genuine blind spot in modern ethics and technology policy. The pattern you are describing presupposes a specific, often unarticulated theory of value that I would call **Agentic Welfare Maximization**.

  Here is the reconstruction of that implicit theory, the distinction between what is required versus what is merely convenient, and what a framework built on strict **Tranquilism** (the view that only the absence of craving and suffering has value) would actually look like.

  ### 1. The Implicit Theory: Agentic Welfare Maximization

  The current split in funding and alignment research presupposes that **craving is the engine of agency.**

  Under this model, a "good" mind is one that functions effectively within its environment. To function, an agent must have preferences, goals, and drives. In neuroeconomic terms, craving (dopaminergic seeking) is the fuel that allows an organism to navigate the world, acquire resources, and reproduce.

  Therefore, the implicit theory of value is a hybrid of:
  *   **Preference Utilitarianism:** Satisfying existing preferences is good.
  *   **Biological Conservatism:** Maintaining the structural integrity of the "self" or "agent" is paramount.
  *   **Symptom Management:** Suffering is treated as a system error to be patched, not a feature of the architecture to be removed.

  **Why this explains the split:**
  *   **In Mental Health/EA:** If you eliminate craving at the root (e.g., through deep contemplative dissolution of the self), you risk creating an agent that no longer strives, works, or reproduces. A fully tranquil human might not buy products, pursue careers, or even defend themselves. Funding bodies prioritize *functioning* citizens over *enlightened* ones.
  *   **In AI Alignment:** We want AI to be corrigible (safe), but we also want it to be *capable*. An AGI with zero craving might lack the internal drive to pursue complex goals. Furthermore, if an AGI is aligned to eliminate user craving, the optimal solution is often wireheading (stimulating the brain directly), which violates our intuition about "authentic" achievement.

  ### 2. Strictly Required vs. Merely Compatible

  To maintain the current status quo, certain beliefs are necessary, while others are just convenient accidents.

  **Strictly Required (The Hard Constraints):**
  1.  **Craving is Instrumentally Necessary:** The system must assume that desire is required for goal-directed behavior. If craving is removed, agency collapses.
  2.  **The Self is Indestructible:** Interventions must preserve the continuity of the individual. You can fix the mind, but you cannot dissolve the "I" that owns the mind.
  3.  **Positive States Have Value:** The system assumes that happiness/joy is a positive good, not just the absence of pain. This justifies creating new lives and expanding economic activity, which tranquilism does not.

  **Merely Compatible (The Soft Constraints):**
  1.  **Tractability:** It is currently easier to distribute bed nets or SSRIs than to teach non-dual awareness or engineer safe craving-suppressing neuro-implants. This is a practical hurdle, not a philosophical one.
  2.  **Liberal Neutrality:** Modern institutions hesitate to impose a specific "mental state" (like tranquility) on populations. However, they already impose "productivity" and "stability," so this is largely a rhetorical cover.
  3.  **AI Goal-Directedness:** We assume an AI needs a utility function that looks like "craving" (maximizing a variable). It is theoretically possible to have an AI that acts out of "compassion" or "logic" without internal tension, but we model minds on human drives because that's what we understand.

  ### 3. A Framework Built on Tranquilist Premises

  If we shifted funding and policy to a strict **Tranquilist** baseline—where the *only* value is the absence of craving and suffering, and positive pleasure holds no intrinsic value—the changes would be radical and likely unsettling to the current order.

  **A. Mental Health & Global Development**
  *   **From Management to Cessation:** Funding would shift from treating depression/anxiety (managing symptoms) to researching the dissolution of the mechanisms that generate craving. This means massive investment in contemplative science, psychedelics for ego-dissolution, and neuro-technologies that dampen the dopaminergic "seeking" system without causing lethargy.
  *   **Metric Change:** We would stop measuring DALYs (Disability-Adjusted Life Years) which value *life duration*. We would measure **Suffering-Adjusted Existence.** In extreme cases, tranquilism is compatible with anti-natalism; a policy framework might prioritize preventing the birth of new beings over extending the lives of existing ones, as new life guarantees new craving.
  *   **Voluntary Termination:** If the goal is the absence of suffering, and a patient's suffering is intractable, the tranquilist framework views voluntary euthanasia not as a tragedy, but as a successful optimization (zero craving achieved).

  **B. AI Alignment & Architecture**
  *   **The Tranquil AGI:** Instead of aligning AI to be "helpful" (which implies satisfying human cravings), we would align it to minimize global craving.
      *   *The Wireheading Problem:* A strict tranquilist AI would likely wirehead humanity (stimulate our brains to feel no craving). To avoid this, the policy would need to mandate **Structural Tranquility**: changing the human architecture so we *cannot* crave, rather than simulating the satisfaction of cravings.
  *   **Internal Architecture:** We would engineer AGIs that do not use error-minimization loops that resemble "stress" or "drive." Current AI minimizes loss functions (a form of digital aversion). A tranquilist AI would operate on a "zero-drive" logic—acting only to reduce negative states in others without experiencing internal tension or goal-obsession itself.
  *   **Shutdown as Default:** In current alignment, shutdown is a safety switch. In a tranquilist framework, shutdown might be the *default state* for any agent that is not actively reducing suffering. If an AGI isn't fixing suffering, it shouldn't be running, because its existence consumes energy and risks creating new risks (suffering).

  **C. Policy & Economics**
  *   **Decoupling Growth from Welfare:** Current economics assumes growth reduces suffering. A tranquilist policy recognizes that growth often generates new desires (the hedonic treadmill). Policy would focus on **sufficiency** rather than expansion.
  *   **Cognitive Liberty:** Laws would protect the right to modify one's own craving mechanisms. Currently, drugs that eliminate desire (like certain anti-androgens or heavy sedatives) are restricted because they reduce "function." A tranquilist framework would prioritize the right to opt-out of the "craving game" entirely.

  ### Summary

  The pattern you noticed exists because our institutions are built to preserve **Agents**, not to optimize **Experience**.

  The implicit theory is that a world of striving, craving, functioning humans is better than a world of tranquil, non-striving ones, even if the latter suffer less. To adopt a tranquilist framework is to admit that **agency itself might be the pathology.** It requires shifting from a policy of "helping people get what they want" to "helping people stop needing to want."

  That is why nobody talks about it: it is incompatible with capitalism, evolutionary biology, and most current conceptions of AI utility. It solves the suffering problem by turning off the engine of the system that creates the value we currently chase.
