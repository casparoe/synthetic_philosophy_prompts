answer: |-
  Here's the draft material for the final. I've kept the question tight to force them into the weeds, and the model answer hits the word count while sticking to British spelling.

  ### The Exam Question

  **Question 1**
  **Time Allowed: 90 Minutes**

  Western appropriations of Buddhist metaphysics often conflate *diachronic anatta* (no persisting substrate across time) with *synchronic anatta* (no unified subject at a given moment). Critically evaluate the objection that if there is no self, the phrase 'my suffering' loses its referent. In your answer, assess whether distinguishing between *proprietary ownership* (having an experience) and *agential ownership* (being responsible for an experience) successfully rescues the doctrine of *anatta* from this objection, or whether this distinction merely disguises a reintroduction of the synchronic subject.

  ***

  ### Model Answer

  The importation of *anatta* into Western philosophy of mind frequently founders on a categorical slippage between diachronic and synchronic denial of self. Western reductionists, often following Parfit, readily concede diachronic fragmentation—the person is not a persisting substance over time—while retaining synchronic unity. They assume that while 'I' change, there is a unified phenomenal field at any given instant. Buddhist metaphysics, however, radicalises this by denying synchronic unity too; there is no unified subject even at a single moment. This distinction is crucial when addressing the objection that without a self, 'my suffering' loses its referent. If there is no 'I', who suffers?

  The objection presupposes that suffering requires a substantial owner. If *anatta* eliminates the owner, suffering becomes ownerless, seemingly contradicting the phenomenal reality of pain. It appears logically incoherent to speak of pain without a sufferer, much like a dance without a dancer. Proponents of the ownership distinction argue this intuition conflates proprietary ownership with agential ownership. Agential ownership implies control, volition, or moral responsibility; I am the agent of my actions. Proprietary ownership refers to the phenomenal 'mineness' of experience; the pain is felt directly, regardless of agency.

  By severing these, one can maintain *anatta* while accounting for suffering. One denies agential ownership—I did not choose this pain, nor is there a controller managing it. This aligns with the Buddhist view of conditioned arising. However, one must handle proprietary ownership carefully. If 'mineness' is interpreted as a relation between an experience and a subject, synchronic selfhood slips back in. The rescue strategy only works if proprietary ownership is redefined as an intrinsic quality of the experience itself, not a relation to a holder. The pain is 'mine' only in the sense that it arises within this causal stream, not because a self claims it.

  However, this move is precarious. Western phenomenology often insists that 'for-me-ness' is structural to consciousness. To deny a subject while retaining 'for-me-ness' risks incoherence. If the experience is not for anyone, is it still suffering? The Buddhist reply is that suffering is *dukkha* inherent in conditioned phenomena, not a state belonging to a person. The distinction between proprietary and agential ownership thus rescues *anatta* only if one accepts that phenomenal presence does not entail a present subject.

  Ultimately, the slippage undermines the argument only if one assumes Western phenomenal constraints. If proprietary ownership is stripped of subjectivity, the referent of 'my suffering' is merely the suffering event itself, indexed to a causal continuum rather than a self. The distinction saves the doctrine, but at the cost of radically revising Western intuitions about consciousness. The student must recognise that 'my' becomes a convenient label for a process, not a pointer to an entity. Without this semantic shift, the synchronic self returns via the backdoor of phenomenal ownership, rendering the appropriation of *anatta* philosophically unstable.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Identification of Diachronic vs. Synchronic Slippage (5 marks)**
  *   **Must hit:** Clearly distinguish between denying persistence over time (diachronic) and denying unity at a time (synchronic), noting that Western views often accept the former but reject the latter.
  *   *Common mess-up:* Candidates treat *anatta* as solely a thesis about rebirth or psychological continuity over time, ignoring the synchronic dimension.

  **2. Articulation of the 'Suffering Referent' Objection (5 marks)**
  *   **Must hit:** Explain why the absence of a self threatens the coherence of suffering (i.e., the logical requirement for a subject of experience).
  *   *Common mess-up:* Students assume the objection is merely ethical (who is responsible?) rather than metaphysical (what is the referent of 'my'?).

  **3. Analysis of Proprietary vs. Agential Ownership (5 marks)**
  *   **Must hit:** Define agential ownership (control/responsibility) and proprietary ownership (phenomenal 'mineness'), showing how separating them attempts to solve the problem.
  *   *Common mess-up:* Conflating the two types of ownership or failing to explain how proprietary ownership functions without an owner.

  **4. Critical Evaluation of the Rescue Strategy (5 marks)**
  *   **Must hit:** Evaluate whether redefining proprietary ownership as impersonal phenomenology successfully avoids reintroducing a synchronic subject.
  *   *Common mess-up:* Giving a definitive 'yes' or 'no' without discussing the tension between 'for-me-ness' and subjectless experience.
