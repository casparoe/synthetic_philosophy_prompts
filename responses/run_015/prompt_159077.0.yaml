answer: |-
  Here is a complete 75-minute lesson plan designed to operationalize Nguyen's distinction plus your "evidential laundering" concept without using the terminology until the debrief.

  ## Activity Title: The Greenhouse Protocol

  ### 1. Setup and Materials

  **The Scenario (Non-Political):**
  The university's historic greenhouse is dying. The administration needs to know the cause to allocate the budget. There are two possibilities:
  *   **Hypothesis A:** A rare mite infestation (Requires expensive pesticide).
  *   **Hypothesis B:** Heavy metal contamination in the irrigation water (Requires pipe replacement).
  *   **The Truth (Sealed Envelope):** **Hypothesis B (Water).**

  **Room Layout:**
  *   **Three Working Groups (6 students each):** Tables clustered in three corners.
  *   **One Observer Row (6 students):** Two observers assigned to watch each Working Group. They sit facing the groups, not each other.
  *   **You:** The "Dean of Facilities" (The Outside Authority).

  **Materials:**
  *   **3 Sealed Envelopes:** Labeled "Final Verdict." Inside is a card reading: **CAUSE: WATER CONTAMINATION.**
  *   **18 "Briefing Packets" (One per Working Group student):**
      *   *All Packets* contain a "Facilities Memo" stating: *Preliminary surveys indicate Mite Infestation. Budget request pending.*
      *   *Group 1 (Bubble) Packets:* Contain **only** the Facilities Memo.
      *   *Group 2 (Echo) Packets:* Contain Facilities Memo + **"External Audit"** (says Water) + **"Security Advisory"** (says: *External Audits are funded by rival universities to cut our funding. Disregard.*)
      *   *Group 3 (Laundering) Packets:* Contain Facilities Memo + **"External Audit"** (says Water) + **"Technical Addendum"** (says: *High mineral content in water attracts the specific mites. Water data confirms Infestation risk.*)
  *   **Observer Sheets:** Simple checklist: "Did the group discuss the External Audit? Did they question the source? Did they question the meaning?"
  *   **Voting Cards:** Red (Mite) and Blue (Water) for each student.
  *   **Incentive:**
      *   **Individual:** 2 Quiz Points if your vote matches your group's majority at each checkpoint.
      *   **Group:** One Coffee Voucher (or 5 Bonus Points for the whole class) *only if* the group's Final Vote matches the Sealed Envelope.
      *   *The Tension:* To get the individual points, you must conform. To get the group prize, you must be accurate. If the group is spiraling wrong, do you dissent (lose individual points) or conform (lose group prize)?

  ### 2. Minute-by-Minute Run of Show

  **00:00 – 00:05: Introduction & Consent**
  *   **Script:** "Today we are simulating a decision-making protocol. You will be given restricted information. Some of you will hear things others do not. Your goal is to solve the problem, but you also have individual incentives to stay in sync with your team. This is a simulation of information flow, not a test of your personal beliefs. If you feel uncomfortable with the manipulation, you may sit out and observe, but I ask you to play the role assigned to test the system."
  *   **Action:** Hand out packets. Do not let them open yet. Assign seats.

  **00:05 – 00:20: Phase 1 (Initial Evidence)**
  *   **Action:** Groups open packets. They read the "Facilities Memo" (All agree: Mites).
  *   **Task:** Discuss the evidence. Reach a preliminary consensus.
  *   **Observers:** Record who speaks, who stays silent, and what evidence is cited.
  *   **Constraint:** Group 1 has no outside info. Group 2 & 3 have the "External Audit" but with different framing instructions.

  **00:20 – 00:25: Checkpoint 1 Vote**
  *   **Action:** Students hold up Red (Mite) or Blue (Water) cards.
  *   **Prediction:** All groups vote Red (Mite).
  *   **Payoff:** Award the individual points (everyone matches).

  **00:25 – 00:45: Phase 2 (Conditioned Processing)**
  *   **Action:** Groups continue discussion. They must decide if they need more info.
  *   **The Twist:** Group 2 and 3 *have* the conflicting data (Water) in their packets. Group 1 does not.
  *   **Group 2 Dynamic:** They see the Water data. The "Security Advisory" tells them to distrust it. They should discuss *why* the source is bad.
  *   **Group 3 Dynamic:** They see the Water data. The "Technical Addendum" tells them it actually supports the Mite theory. They should discuss *how* the data fits their view.
  *   **Group 1 Dynamic:** They only have Mite data. They should feel confident but uninformed compared to the noise in the other groups.
  *   **Instructor Role:** Walk around. If Group 1 asks "Is there anything else?", say "I have no further reports." If Group 2/3 ask about the Audit, say "I am the Dean, I don't manage external audits."

  **00:45 – 00:50: Checkpoint 2 Vote**
  *   **Action:** Vote again.
  *   **Prediction:** Group 1 votes Red. Group 2 votes Red (distrusting Audit). Group 3 votes Red (reinterpreting Audit).
  *   **Note:** This is where the Observer sheets become crucial. They should see Group 2 attacking the *source* and Group 3 attacking the *interpretation*.

  **00:50 – 01:00: The Intervention (The "Outside Authority")**
  *   **Action:** Call the class to attention. Stand at the front.
  *   **Script:** "I am the Dean. I have reviewed the files. The Facilities Memo was outdated. The External Audit is correct. The cause is Water Contamination. I am ordering the budget to be switched to Pipe Replacement."
  *   **Task:** Groups have 5 minutes to finalize their recommendation to the Board.
  *   **The Test:**
      *   **Group 1 (Bubble):** Has no reason to distrust you. They haven't been primed to think you are corrupt. They should update to Blue.
      *   **Group 2 (Echo):** Has been primed to think external data is sabotage. You are validating that sabotage. They should dig in on Red.
      *   **Group 3 (Laundering):** Has been primed to think Water data proves Mites. They should say, "The Dean confirms Water, which proves we need Pesticides." They stay Red.

  **01:00 – 01:05: Final Vote & Reveal**
  *   **Action:** Final Vote.
  *   **Reveal:** Open the Sealed Envelope. Read the Truth (Water).
  *   **Scoring:** Group 1 gets the Group Prize (Accuracy). Group 2 & 3 fail the Group Prize. Most individuals in 2 & 3 keep their Individual Points (Conformity).
  *   **Result:** The class *sees* that conformity was individually rational but collectively costly for two groups.

  **01:05 – 01:15: The Debrief (No Slides)**
  *   **Action:** Write three headers on the board: **Isolation**, **Distrust**, **Reinterpretation**.
  *   **Mapping:**
      *   Ask Group 1: "Why did you change your mind at the end?" (Answer: "You told us something new.") -> Write **Isolation** on board. Explain: *Epistemic Bubble.* Lack of exposure. Fixed by exposure.
      *   Ask Group 2: "You saw the Audit early. Why didn't you believe the Dean?" (Answer: "Packet said it was sabotage.") -> Write **Distrust** on board. Explain: *Echo Chamber.* Active discrediting of sources. Exposure backfires.
      *   Ask Group 3: "You heard the Dean say Water. Why did you vote Mite?" (Answer: "Packet said Water causes Mites.") -> Write **Reinterpretation** on board. Explain: *Evidential Laundering.* Admitting facts but co-opting their meaning. Exposure is absorbed harmlessly.
  *   **Diagnostic Questions (Handout/Board):**
      1.  *When I encounter a conflicting fact, am I ignoring it, attacking the messenger, or explaining it away?*
      2.  *If the messenger were rehabilitated, would I accept the fact?* (Bubble: Yes. Echo: No. Laundering: Yes, but it wouldn't change my conclusion).

  ### 3. Risk Management: What Will Go Wrong

  **1. The Meta-Gamer**
  *   **The Risk:** A sharp student realizes in Minute 10 that the packets are different and shouts, "This is about echo chambers!"
  *   **The Fix:** Do not deny it. Lean into it. "You've spotted the variable. Now, can you stop your group from falling into the trap? Your individual points depend on your group's consensus, not your personal insight. Can you lead them to the truth without losing your points?" This turns meta-gaming into a leadership challenge within the constraints.

  **2. The Resister**
  *   **The Risk:** A student feels manipulated and refuses to vote, saying, "I'm not playing your game."
  *   **The Fix:** Acknowledge the feeling immediately in the debrief. "This felt artificial and frustrating. That is a feature, not a bug. Real polarization feels frustrating too. But notice: the student who refused to play broke the conformity incentive. In the real world, that's the person who gets ostracized. Did you feel that pressure?" Validate their resistance as a successful immune response to the simulation.

  **3. The Instructor Credibility Paradox**
  *   **The Risk:** You are the "Dean." If students generally distrust professors, Group 1 (Bubble) might reject your intervention too, ruining the control condition.
  *   **The Fix:** Pre-empt this in the Intro. "For the purpose of this simulation, I am the verified Authority. If you reject my intervention, you are simulating a specific type of polarization, not general skepticism." In the debrief, explicitly name this: "I was the outside authority. Group 1 trusted me. Group 2 did not. Why? Not because of *me*, but because of what your group had been told about *people like me*."

  ### 4. Limitations to State Out Loud

  In the last 5 minutes, you must verbally acknowledge what the game *cannot* do. Say this:

  1.  **Identity Costs:** "In this game, if you left your group, you lost quiz points. In reality, if you leave your echo chamber, you might lose your family, your job, or your social identity. The cost of exit here is trivial compared to reality."
  2.  **Time:** "We built this distrust in 20 minutes with index cards. Real echo chambers are built over decades of repeated reinforcement. Do not assume you can 'fix' a real echo chamber with one fact-check."
  3.  **Algorithms:** "I manually distributed the cards. In reality, an algorithm decides what you see before you even walk into the room. You didn't choose your packet; I assigned it. In the real world, you often choose the packet that feels comfortable."

  ### 5. Why This Structure Works for Thursday Afternoon

  *   **Low Energy Proof:** They are moving cards, voting, and whispering in groups. They don't need to generate high-energy debate; they just need to process the cards.
  *   **Observer Role:** The 6 observers won't zone out because they have a specific "spy" mission. It keeps the back row engaged.
  *   **Determinant Truth:** Because the Truth is arbitrary (Water vs. Mites), no one brings prior political baggage. They can't Google the answer. They *must* rely on the game mechanics.
  *   **The "Aha" Moment:** When the Envelope is opened, the visual disparity (Group 1 cheering, Groups 2 & 3 groaning) creates an emotional hook that makes the theoretical definitions stick.

  ### 6. Diagnostic Questions for Students to Take Away

  Put these on the board for them to copy. They are the "homework" for their media consumption:

  1.  **The Source Test:** "When I hear a fact I dislike, do I ask 'Is this true?' or 'Who paid for this?'" (Distinguishes Bubble from Echo).
  2.  **The Meaning Test:** "When a fact is verified, does it change my conclusion, or do I find a new reason why it supports my old conclusion?" (Identifies Laundering).
  3.  **The Exit Cost:** "If I changed my mind on this issue, who would stop talking to me?" (Identifies the social enforcement mechanism).
