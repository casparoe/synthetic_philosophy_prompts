answer: |-
  This is an exceptionally sharp observation. You have independently rediscovered a distinction that occupies a significant chunk of contemporary philosophy of language and linguistics. Your friend in graduate school is describing a view called **Deflationism** (or the Redundancy Theory), associated with philosophers like Frank Ramsey, W.V.O. Quine, and Paul Horwich.

  Your intuition that "true" is doing work in your three cases is correct, but it does not necessarily refute deflationism. To understand why, we need to separate **semantics** (what words mean) from **pragmatics** (what people *do* with words).

  Here is a breakdown of the terminology, the theories, and how they apply to your specific cases.

  ### 1. The Names for These Uses

  There is no single term that covers all three cases you identified, because linguists and philosophers categorize them by function. However, there are established terms for each:

  *   **Case 2 (The Textbook): The Generalizing Device.**
      In deflationary theory, this is the primary *raison d'être* for the word "true." Quine called this **semantic ascent**. We cannot say, "Sentence A is the case, and Sentence B is the case, and Sentence C is the case..." for every sentence in a chapter. We need a proxy variable. "Everything in that chapter is *true*" allows us to quantify over sentences without listing them. Deflationists argue this is the only heavy lifting the word "true" does logically.
  *   **Case 1 & 3 (The Debate/Chat): The Concessive Speech Act.**
      In pragmatics (the study of language in use), your debate example is a **concessive marker**. When you say, "It is true that P, but Q," you are performing a specific **speech act** (a concept from J.L. Austin and John Searle). You are not just describing the world; you are managing the conversational score. You are granting your opponent a point to show reasonableness while pivoting to your main argument.
  *   **The "Impersonal Feel": Epistemic Distancing.**
      Your insight about the "impersonal" nature is spot on. Linguists call this **epistemic distancing** or **objectification**. By saying "It is true that P" rather than "I believe P" or "P," you frame the proposition as a freestanding fact rather than a personal commitment.

  ### 2. Does This Threaten the "Adds Nothing" View?

  **Short Answer:** No.
  **Long Answer:** It depends on what you mean by "adds nothing."

  Deflationists claim that "true" adds no **representational content** to the proposition.
  *   *Proposition:* "The meeting is on Friday."
  *   *Proposition:* "It is true that the meeting is on Friday."

  In terms of *truth conditions* (what the world must look like for the sentence to be correct), these are identical. If the meeting is on Friday, both are correct. If it is on Thursday, both are wrong. In this semantic sense, "true" adds nothing.

  However, deflationists generally admit that "true" has **pragmatic utility**. Just because a word doesn't change the *content* doesn't mean it doesn't change the *effect*.

  Consider the word "please."
  *   "Pass the salt."
  *   "Please pass the salt."

  The word "please" adds no information about the salt, the action, or the time. Semantically, it is redundant. But pragmatically, it changes the social dynamic from a command to a request. If you claimed "Please adds nothing," you would be wrong about social interaction, even if you were right about semantics.

  Your three cases show that "true" functions like "please." It manages the relationship between speakers, signals concession, and allows for generalization. This is compatible with deflationism, provided the deflationist admits that language is used for more than just describing facts.

  ### 3. Explaining the "First-Person Oddity"

  Your observation about the headache is the most philosophically sophisticated part of your query.
  *   *Normal:* "She has a headache, but that's no excuse." (Fine)
  *   *Odd:* "It's true that I have a headache, but that's no excuse." (Odd)

  This touches on a concept from Ludwig Wittgenstein regarding **Avowals**.

  When you say "I have a headache," you are not typically reporting on an internal observation like a scientist reporting data. You are *expressing* pain. It is more like a cry ("Ouch!") than a description ("He is crying"). Because it is an expression, it doesn't usually make sense to evaluate it for truth.

  When you say, "It is **true** that I have a headache," you turn your own pain into an external object of study. You are treating yourself as a third party. This creates the "impersonal" distance you noticed. It sounds odd because it implies you have evidence for your own pain, rather than just having the pain.

  This supports your theory: "True" works best when the claim is treated as an external fact open to verification. When the claim is a first-person avowal, using "true" creates a weird separation between the speaker and their experience.

  ### 4. A Proposed Terminology for Your Notes

  Since you asked for a term if none existed, and while the terms above cover the parts, you might want a unifying label for your own analysis. I suggest calling this the **Performative Truth Predicate**.

  **Definition:** Uses of the truth predicate where the primary function is not to attribute a property to a sentence, but to perform a conversational maneuver (concession, generalization, or closure) while framing the content as objective.

  **Boundary Conditions:**
  *   **Counts as an instance:** "It is true that P, but Q" (Concession); "All P are true" (Generalization); "It is true" (Closure).
  *   **Does not count:** "It is true that snow is white" (used in a logic class to demonstrate correspondence); "Is it true that you stole the cookie?" (asking for verification).
  *   **Difference from Hedging:** Hedging ("I think," "Maybe") reduces commitment. Performative Truth ("It is true that") often *maintains* commitment to the fact while *reducing* commitment to its relevance.
  *   **Difference from "I Concede":** "I concede" centers the speaker's agency ("I am letting you win this point"). "It is true" centers the proposition ("The fact stands, regardless of me").

  ### 5. Summary of Theories vs. Your Cases

  | Theory | View on "True" | Prediction for Your Cases | What it Gets Wrong/Right |
  | :--- | :--- | :--- | :--- |
  | **Deflationism** (Quine, Ramsey) | Logical device for generalization/disquotation. | Predicts Case 2 (Textbook) perfectly. | Often ignores the pragmatic "feel" of Case 1 & 3. |
  | **Speech Act Theory** (Austin, Searle) | Language is action. | Explains Case 1 & 3 as "moves" in a game. | Doesn't explain the logic of Case 2 well. |
  | **Expressivism** (Brandom) | Truth is about commitment/entitlement. | Explains the "impersonal" feel (shifting commitment). | Can be complex; doesn't fully address the first-person headache issue. |
  | **Your Observation** | **Pragmatic/Objectifying Device** | **Synthesizes all three.** | **You correctly identified that semantics ≠ pragmatics.** |

  ### Conclusion

  Your friend is right that "true" is often logically redundant. But you are right that it is practically essential.

  The "extra work" you identified is not semantic work (changing what is said); it is **pragmatic work** (changing how it is taken). This does not threaten the deflationary view, provided that view is limited to semantics. However, your observation suggests that a complete philosophy of language cannot look at truth only as a logical operator; it must also view it as a social tool for managing agreement, authority, and concession.

  You have effectively identified the difference between **truth as a property** (which might be redundant) and **truth as a move** (which is powerful). If you pursue philosophy in college, look into the work of **Robert Brandom** (who treats truth as a move in a game of giving and asking for reasons) and **Debate Theory** (which analyzes the function of concessions). You are already thinking like a pragmatist.
