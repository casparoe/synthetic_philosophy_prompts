  **Why:** A committed Bayesian or Everettian might argue that the distinction is illusory; if a theory predicts all observations optimally, there is no operational meaning to "ontological truth" beyond the predictive structure itself. They would argue Rowan is right to treat predictive convergence as the only vindication of the razor that *matters*, rendering Tobias's ontological objection a category error rather than a refutation.
