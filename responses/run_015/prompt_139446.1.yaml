answer: |-
  **To:** Product Ethics Review Board
  **From:** Software Engineering
  **Subject:** Decision Memo: Polygenic Risk Score Presentation
  **Date:** October 26, 2023

  **Recommendation**
  The Board recommends we **ship the Condition Index only**. We will not develop the Trait Index, and we will not enable the aggregate Health Index as a default sort function.

  **Default Settings**
  1.  **Data Visibility:** Polygenic risk scores for the approved panel of roughly forty medical conditions will be visible to clinicians and patients.
  2.  **Sorting:** Embryos will default to sorting by embryo ID. The aggregate Health Index will not be available as a sorting mechanism. Clinicians may view individual condition risks side-by-side.
  3.  **Traits:** No data regarding non-disease characteristics (height, educational attainment, etc.) will be displayed or calculated.

  **Reasoning**
  This decision balances clinical utility with ethical guardrails. Excluding the Trait Index is straightforward; these features invite eugenic interpretations without offering medical benefit, and no customer has requested them. Including them would expose the company and our clinic partners to unacceptable reputational and regulatory risk.

  The handling of the Condition Index requires more nuance. Providing this data acknowledges the reality of IVF decision-making. Patients must choose which embryo to transfer. Withholding genetic risk data does not remove the necessity of that choice; it merely forces the choice to be made on less informative grounds. By providing condition-specific data, we empower patients and clinicians to make decisions based on medical facts rather than opaque proxies.

  However, we are rejecting the aggregate Health Index as a default sort. Aggregating forty distinct conditions into a single "health score" requires the company to assign weights to different disabilities and life outcomes. This implicitly encodes a corporate verdict on which lives are worth starting. By disabling the aggregate sort, we provide the data without prescribing a hierarchy of value. We shift the burden of interpretation to the clinical team, where it belongs, ensuring that counseling context accompanies the numbers.

  **Strongest Argument on the Losing Side**
  The strongest argument against this recommendation comes from the position of shipping nothing that ranks embryos by genetic risk (Option 3). Our embryologist argued convincingly that clinics already rank embryos by morphology and aneuploidy status. Declining to provide genetic risk data does not avoid ranking; it simply ensures that ranking continues based on cruder proxies. Patients will absorb the difference in outcome, potentially selecting embryos with higher disease risk because the data was hidden behind an ethical firewall.

  This point is difficult to dismiss. It is true that neutrality is impossible; even inaction is a design choice with clinical consequences. However, the Board determined that while hiding data does not stop ranking, providing an automated aggregate score actively shapes it. The risk of codifying bias through a default algorithm outweighs the benefit of convenience. We accept the embryologist's premise that data is superior to proxies, but we maintain that the presentation of that data must not automate ethical judgments.

  **Next Steps**
  Engineering will proceed with building the Condition Index view without aggregate sorting capabilities. Product will work with Clinical Leadership to define the training materials required for clinicians to interpret individual condition scores without relying on hidden weights. We will review patient feedback and clinical outcomes after six months to assess whether the lack of aggregate sorting creates undue decision fatigue.

  **Approval**
  [ ] Approved
  [ ] Approved with Changes
  [ ] Rejected
