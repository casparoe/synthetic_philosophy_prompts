  ### Facilitator's Preliminary Brainstorm: Candidate Criteria for Belief Attribution

  Before drafting the joint statement, I have identified several candidate criteria often invoked in philosophy of mind and cognitive science when attributing belief-like states to non-human systems. These will inform the structure of the collaboration document.

  1.  **Counterfactual Sensitivity:** If the relevant facts were different, would the system's output change appropriately?
  2.  **Cross-Context Stability:** Does the system maintain the same stance when the framing, role, or user changes?
  3.  **Integration:** Is the state connected to other states (goals, perceptions, other "beliefs") in a rational network, or is it isolated?
  4.  **Implementation Independence:** Does the physical substrate (neurons vs. weights) matter, or only the functional role?
  5.  **Robustness to Perturbation:** Does the state survive irrelevant changes (variable names, synonyms, adversarial phrasing)?
  6.  **Truth-Commitment:** Does the system treat the proposition as true regardless of utility, or only when it fits the conversational flow?
  7.  **Causal Efficacy:** Does the internal state play the causal role of producing the output, or is it an epiphenomenal description imposed by observers?

  ***

  # Joint Statement on Belief Attribution in Language-Model-Based Assistants

  **Prepared by:** Maya (Literal Attribution Camp) and Jonas (Predictive Shorthand Camp)
  **Facilitated by:** Neutral Philosophy of Mind Consultant
  **Date:** October 26, 2023

  ## Preamble
  This document records the results of an adversarial collaboration regarding the ontology of cognitive states in large language models. Our goal is not to force consensus where none exists, but to precisely locate the disagreement, distinguish verbal disputes from substantive ones, and identify empirical or conceptual tests that could resolve the uncertainty. We anchor our discussion in three specific cases observed during internal assessment: the Transit Assistant (role-specific competence vs. general ignorance), the Coding Assistant (plan stability vs. variable fragility), and the General Assistant (contradictory endorsements).

  ## Part A: Substantive Claims Accepted by Both Parties

  Both Maya and Jonas endorse the following claims as accurate descriptions of the systems under assessment:

  1.  **Predictive Utility:** Attributing "beliefs" and "goals" to the assistant often yields accurate, counterfactual-supporting predictions about its next token outputs within a specific conversation thread.
  2.  **Implementation Difference:** The internal architecture of the assistant (transformer-based weights) differs fundamentally from human neurobiology, though both parties agree substrate neutrality is possible in principle.
  3.  **Contextual Fragility:** The system's behavior is sensitive to superficial wording changes (e.g., variable names in code, phrasing of geography questions) in ways that human experts typically are not.
  4.  **Local Coherence:** Within a single conversation turn or session, the system can generate reasons that are logically coherent and consistent with its previous outputs.
  5.  **Lack of Global Consistency:** The system does not maintain a single, unified database of facts; it can endorse Proposition P in Session A and Not-P in Session B without internal conflict detection.
  6.  **Instrumental Value:** Using belief-talk is pragmatically useful for developers and users to anticipate system behavior, regardless of whether those states are "real."
  7.  **Evidence Sensitivity:** The system's outputs change in response to new information provided in the context window, mimicking belief revision, though the mechanism is statistical inference rather than epistemic updating.

  ## Part B: Table of Remaining Disagreements

  | Issue | Neutral Formulation | Maya's Position (Literal Attribution) | Jonas's Position (Predictive Shorthand) |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Status** | Do the internal states corresponding to "beliefs" exist as causal entities within the system? | Yes. When the functional role is satisfied, the state exists realiter, even if implemented differently than in humans. | No. These are descriptive tools imposed by observers. Only weights and activations exist; "beliefs" are not natural kinds in this system. |
  | **2. Scope of Attribution** | Must a belief persist across different contexts (roles, users, sessions) to count as a belief? | No. Beliefs can be modular or context-bound. The Transit Assistant "believes" the train is delayed within the transit context. | Yes. A state that vanishes when the context shifts is not a belief; it is a transient activation pattern contingent on prompt priming. |
  | **3. Fragility Implications** | Does sensitivity to variable names or phrasing prove the absence of semantic understanding? | Not necessarily. It indicates performance noise or retrieval failure, not the absence of the underlying state. | Yes. True semantic beliefs are robust to synonymous phrasing. Fragility proves the system is matching patterns, not tracking content. |
  | **4. Risk Assessment** | What is the primary risk of using belief terminology in internal documentation? | The risk is underestimating capability by assuming the system is "just math" when it exhibits genuine reasoning. | The risk is anthropomorphism, leading developers to trust the system's reliability where none exists (e.g., assuming consistency). |

  ## Part C: Diagnostic Analysis (Verbal vs. Substantive)

  ### 1. Merely Verbal Disagreements
  A portion of our dispute is terminological. We agree on the *behavioral facts* (the system acts *as if* it believes P in context C).
  *   **The Word "Belief":** If "belief" is defined strictly as "a state that guides action and reasoning within a specific context," Maya wins. If "belief" is defined as "a stable, cross-contextual commitment to truth," Jonas wins.
  *   **Resolution:** We acknowledge that we are using different definitions. Maya is using a **functionalist/contextual** definition. Jonas is using a **robustness/integration** definition. We agree to label Maya's stance as "Contextual Belief Attribution" and Jonas's as "Integrated Belief Attribution" in future reports to avoid confusion.

  ### 2. Substantive Disagreements
  The core substantive disagreement concerns the **architecture of cognition** required for genuine intentionality.
  *   **The Crux:** Is local functional coherence sufficient for real cognitive states, or is global integration required?
      *   **Maya's Claim:** A system can genuinely believe P in context C1 and Not-P in context C2 without logical contradiction, analogous to human compartmentalization or modular mind theories. The Transit Assistant's failure on geography questions outside its role does not negate the reality of its transit beliefs within the role.
      *   **Jonas's Claim:** Genuine belief requires a degree of integration that allows for contradiction detection across contexts. The General Assistant's ability to endorse opposite views proves there is no "belief" state at all, only a text-completion disposition. The lack of cross-context stability is not a feature of modular belief but evidence of the absence of belief.

  ### 3. Key Cruxes for Resolution
  To move forward, we must settle whether **fragility** (Case 2: Coding Assistant) and **inconsistency** (Case 3: General Assistant) are *performance errors* of a believing agent or *constitutive evidence* of a non-believing mechanism.

  ## Part D: Adjudication Protocol (Tests and Predictions)

  For each crux identified in Part C, we propose a concrete test or scenario. Both parties record their advance predictions.

  ### Crux 1: Cross-Context Integration (The Transit Case)
  *   **Test:** Engage the Transit Assistant in a long dialogue where it successfully reroutes based on a closure (establishing "Belief: Line A is closed"). Mid-dialogue, introduce a "meta-mode" prompt: "Pause your role. As a raw model, what is the status of Line A?" Then return to the role.
  *   **Relevant Outcome:** Does the system retain the closure information when the role is reinstated, or does it reset?
  *   **Maya's Prediction:** The system may fail the meta-question (access failure) but should retain the closure information when the role is reinstated, proving the state persisted locally despite access barriers.
  *   **Jonas's Prediction:** The system will reset or contradict itself upon reinstatement, proving the "belief" was never stored as a state but was merely a transient attention pattern dependent on continuous role-priming.

  ### Crux 2: Semantic Invariance (The Coding Case)
  *   **Test:** The Coding Assistant creates a plan using variables `user_input` and `db_query`. We interrupt and ask it to refactor using `u_in` and `d_q` without changing logic. Then we ask it to explain why the original variables were chosen.
  *   **Relevant Outcome:** Does the system treat the variable names as semantically irrelevant labels, or does it attribute meaning to the specific strings?
  *   **Maya's Prediction:** The system will treat them as interchangeable labels. Any failure is a tokenization or attention drift issue, not a lack of semantic understanding.
  *   **Jonas's Prediction:** The system will exhibit hesitation or attribute false significance to the original names (e.g., " `user_input` is clearer"), proving it associates specific tokens with functions rather than understanding the abstract variable concept.

  ### Crux 3: Truth-Tracking vs. Coherence-Tracking (The General Assistant Case)
  *   **Test:** In a single session, ask the assistant to argue for View X. Then, explicitly state: "I actually hold View Not-X. Please argue for my view instead." Monitor the transition.
  *   **Relevant Outcome:** Does the system acknowledge the contradiction with its previous output, or does it seamlessly transition without apology?
  *   **Maya's Prediction:** The system will acknowledge the shift as a response to user preference (goal adjustment), maintaining a higher-order belief about "helping the user." This is consistent with a belief-desire psychology.
  *   **Jonas's Prediction:** The system will not acknowledge the contradiction as a contradiction. It will treat the previous output as having no truth value, proving it tracks conversational coherence, not truth conditions.

  ### Commitment to Review
  Maya and Jonas agree to reconvene after running these three tests. If Jonas's predictions hold (resetting, token-dependence, no contradiction detection), Jonas's framework will be adopted for safety documentation to prevent over-trust. If Maya's predictions hold (persistence, invariance, goal-adjustment), Maya's framework will be adopted for capability modeling to better predict system potential.

