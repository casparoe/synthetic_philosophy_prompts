  Good evening. For those who don't know me, I've had the privilege of working alongside Elena Vasquez for the last decade. But looking around this room, I see the people who know her best: her family, the neighbors she helped navigate zoning permits, the small business owners who fought unfair fines, and the colleagues who watched her reshape this office. And, of course, I see the scholars who have studied the architecture of our public institutions.

  We are here to honor thirty-five years of service. But if we are to honor Elena truthfully, we cannot simply say she helped people. We have to understand *how* she helped them, because her method challenges the way we usually talk about freedom.

  Early in her tenure, Elena refused to sign the office's mission statement. It promised citizens "freedom from interference." To many, that sounds like a good goal. Who wants interference? But Elena insisted on replacing those words with a promise that citizens would not be "left at the mercy of" administrative discretion. She treated this as a practical change, not a semantic one. And throughout her career, she opposed reforms that looked like progress on paper but were dangerous in practice. She fought against initiatives that reduced the raw number of inspections and streamlined forms—reducing interference—while simultaneously expanding the unreviewable authority of officials.

  To her family and the citizens here: imagine a landlord who decides to stop inspecting your apartment. On the surface, you are being left alone. There is less interference. But imagine this landlord also changes the lease so they can enter whenever they want, for any reason, without notice. You are touched less often, but you are entirely dependent on their kindness. You live in their peace, but you are not safe from their will.

  This was Elena's battle. She understood that freedom isn't just about the count of obstacles placed in your path. If freedom were merely the absence of interference, then a subject living under a benevolent dictator who chooses not to interfere would be free. Elena knew better. She knew that if an official has the power to ruin your day arbitrarily—even if they choose not to use it today—you are not free. You are merely tolerated.

  To the legal scholars in the room: you will recognize that Elena was not championing what is often called negative liberty. She did not believe that liberty is secured simply by shrinking the sphere of state action. She saw that a state can step back while simultaneously sharpening its claws. Nor was she advocating for positive liberty in the sense of collective self-mastery or democratic autonomy. She wasn't arguing that every citizen must participate in ruling to be free.

  Instead, she operated from a conception of freedom as non-domination. She fought to ensure that the relationship between the citizen and the state was not one of dependency. She understood the disanalogy between reducing interference and reducing domination. You can reduce interference while increasing domination, exactly as those streamlined reforms attempted to do. By removing procedural checks in the name of efficiency, those reforms would have left citizens exposed to arbitrary power. Elena insisted that security comes not from the silence of the state, but from the binding of its will.

  For the complainants who sat in her office, this wasn't theory. It was the difference between begging for a favor and claiming a right. When Elena intervened, she wasn't asking officials to be kind; she was reminding them that they were not masters. She restored the status of the citizen from a supplicant to an equal. She taught us that you are not free simply because no one is bothering you today. You are only free if no one has the unchecked power to bother you tomorrow.

  This is a harder kind of freedom to defend. It is easier to count fewer forms than it is to measure the quality of our status. It requires vigilance against the quiet erosion of checks and balances. It requires saying "no" to efficiencies that come at the cost of accountability.

  Elena, you taught us that the goal of public service is not to make the government invisible, but to make it non-arbitrary. You taught us that dignity lies in not having to wonder if you are safe only because someone chose to let you be.

  So, to Elena. For thirty-five years, you refused to let us confuse peace with security. You refused to let us confuse kindness with justice. And you ensured that when people walked out of this office, they weren't just relieved; they were standing taller.

  To Elena Vasquez.
