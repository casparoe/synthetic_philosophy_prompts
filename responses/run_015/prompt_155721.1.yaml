  **What's actually in dispute**

  The core dispute isn't about money, but time and identity. Mara argues for backward-looking corrective justice: a specific past wrong created a debt that persists. Deniz argues that time dissolves the specific parties required for such debt. They talk past each other on metaphysics versus policy. Mara treats groups as continuous entities capable of holding claims across generations. Deniz treats individuals as the only valid units of moral accounting, making historical causality too fragile. Essentially, Mara wants to repair a broken chain, while Deniz argues the chain links no longer exist.

  **Move by move**

  (1) Mara's but-for rule is conceptually clean but empirically brittle. It works for recent torts, not centuries-old seizures. She is right that repair requires a baseline, but wrong that this baseline is recoverable. The complexity of history makes the counterfactual unknowable, turning calculation into speculation. Small changes in assumptions yield wildly different numbers. This move is partially right on principle, wrong on practice.

  (2) Deniz's non-identity point is philosophically devastating but practically unworkable. He is right that specific descendants wouldn't exist, but wrong to imply this voids all group claims. It proves too much, invalidating all inheritance and historical policy analysis. If this holds, no state policy from the past binds the present. We cannot let metaphysics block all justice. This move is logically strong but morally excessive.

  (3) Mara's lineage analogy is compelling socially but fails legally. She is right that groups persist culturally, but wrong to equate this with the legal continuity needed for financial liability. Universities have charters; lineages have only biology and memory. Without legal personhood, the debt has nowhere to land. You cannot sue a bloodline. This move is sociologically plausible, legally mistaken.

  (4) Deniz's macro objection is the strongest economic point. He is right that counterfactual GDP swings wildly, but wrong to dismiss group claims entirely based on modeling noise. Sensitivity analysis could manage this, though the uncertainty remains high. However, a claim exceeding GDP is indeed a signal of model failure. Numbers must relate to reality. This move is largely right on feasibility.

  (5) Mara's cap concession saves feasibility but sacrifices principle. She is right to avoid absurd numbers, but wrong to call it "repair" once arbitrary limits are applied. It becomes a political settlement, not a restitution of loss. This weakens her moral leverage significantly. She admits the math doesn't work. This move is pragmatic but theoretically inconsistent.

  (6) Deniz's taxpayer worry relies on strict individualism. He is right that newborns didn't seize land, but wrong that states cannot carry intergenerational obligations through taxation. States benefit from past accumulation, creating a benefit-based duty. Citizens inherit assets and liabilities together. Public debt exists for this reason. This move is right on individual causality, wrong on state continuity.

  (7) Mara's structural argument shifts the ground. She is right that slots exist, but Deniz is right that this admits the history is merely justification for current redistribution, not restitution. This collapses her backward-looking case into his forward-looking one. She wins the moral intuition, he wins the logical consistency. This move concedes the core dispute. She changes the subject to win.

  **What both of them missed**

  Both miss the continuity of the State as the liable entity. They focus on people or abstract groups. But the state seized the land, and the state persists. The obligation shouldn't rest on citizens' guilt or descendants' loss, but on the state's unjust enrichment. The land was integrated into national infrastructure. The commission should audit who holds the title now and what yield that asset generates. If the state benefits from its development, the debt attaches to the state's balance sheet, not individual culpability. This bypasses the non-identity problem because the state is the same legal person it was 140 years ago. It solves Deniz's taxpayer worry: citizens pay state debts as a condition of membership, not penance. Neither argued that the state itself is the defendant. Furthermore, they ignore current asset use. If the seized land built ports driving today's economy, the benefit is tangible. Reparations could be framed as divestment or equity stakes in those specific assets. This moves the debate from abstract counterfactuals to concrete asset tracing. By focusing on human identity rather than institutional continuity, both leave the most viable legal pathway unexplored. The state owes the debt because the state holds the loot.

  **Bottom line**

  Deniz is more right on mechanics, Mara on morality. You cannot calculate the past, but must address the present. Tell the commission to drop the counterfactual math. It is unknowable and invites endless dispute. Instead, treat history as evidence of current structural disadvantage. Use Mara's structural slot argument openly: invest in the disadvantaged group to equalize outcomes, funded by state assets derived from that history. Call it forward-looking equity, not backward-looking repair. This honors Mara's moral urgency without falling into Deniz's metaphysical traps. The goal is a fair future, not a perfect past.
