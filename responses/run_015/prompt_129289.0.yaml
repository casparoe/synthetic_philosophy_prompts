answer: |-
  ## Part I: Mapping the Logical Space

  Before we build the instrument, we must map the terrain. As a philosopher of law, I see five distinct axes of disagreement here. These are not just legal technicalities; they are deep metaphysical and moral commitments about what groups are, what harm is, and what language does.

  Your characters are likely talking past each other because they are standing on different coordinates along these five axes.

  ### The Five Axes of Disagreement

  1.  **The Ontology of the Group (Who counts?)**
      *   *Naturalist:* Groups are stable, pre-existing biological or cultural facts (e.g., ethnicity, religion).
      *   *Functionalist:* Groups are defined by shared social function or status (e.g., your river pilots, political classes).
      *   *Constructivist:* The group is brought into existence by the act of persecution itself (the "target" creates the "group").

  2.  **The Nature of Destruction (What counts as death?)**
      *   *Biophysical:* Destruction means killing members or preventing birth (sterilization).
      *   *Sociocultural:* Destruction means dissolving the bonds, language, and institutions that make the group a group, even if individuals live.
      *   *Individualist:* Only individuals can be destroyed; "group death" is a metaphor for many individual harms.

  3.  **The Mental State (What must the perpetrator think?)**
      *   *Specific Intent (Purpose):* They must actively desire the destruction as a goal.
      *   *Knowledge (Foresight):* They must know destruction is the inevitable outcome, even if their stated goal is something else (e.g., "assimilation").
      *   *Recklessness/Negligence:* They should have known, or didn't care about the risk.

  4.  **The Moral Weight (Is it a special evil?)**
      *   *Sui Generis:* Crime against the group is morally worse than the sum of individual murders.
      *   *Aggregative:* It is simply many murders plus a shared context. The label adds legal power, not moral weight.
      *   *Instrumental:* The moral weight depends on whether using the label stops the violence.

  5.  **The Function of the Label (When do we speak?)**
      *   *Verdict:* Use only after legal proof (conviction).
      *   *Warning:* Use early to trigger prevention (prophylactic).
      *   *Silence:* Avoid the word entirely to prevent rhetorical inflation.

  ### Empty Cells and Logical Tensions
  As we build the leaves, note these combinations are logically unstable or rarely occupied:
  *   **The Moral Deflationist + The Prophylactic User:** If you believe groups aren't morally real (Axis 4: Aggregative), it is incoherent to use a group-specific warning label early (Axis 5: Warning). Why sound a special alarm for a harm you think is just "many murders"?
  *   **The Constructivist + The Biophysical Purist:** If you believe the group is only created by the persecution (Axis 1: Constructivist), it is tense to insist on biological destruction (Axis 2: Biophysical). If the group is a social construct, destroying its culture *is* destroying the group.
  *   **The Strict Legalist + The Early Warner:** You cannot consistently demand strict legal proof for the definition while advocating for early warning usage. One requires certainty, the other requires suspicion.

  ### Indistinguishable Leaves
  *   **The Convention Purist vs. The Legal Pragmatist:** Both argue for strict definitions in public. The Purist believes it is the *moral truth*; the Pragmatist believes it is the *only workable legal tool*. Your quiz may land them in the same box unless we probe their *reasons* for strictness.
  *   **The Culturalist vs. The Lemkinian:** Lemkin included culture, but also politics. A pure Culturalist might reject political groups. These are close neighbors.

  ***

  ## Part II: The Diagnostic Instrument

  **Instructions for the Reader:**
  Below are 10 diagnostic claims based on the fictional case of the River Pilots. Do not think about what the law *says*; think about what *you* believe is right. For each question, choose the option that best fits your intuition.

  **Q1. The Target (The Guild)**
  The victims are a hereditary guild of river pilots. They share a language and trade, but not a race, religion, or nationality.
  *   **A.** They count. A shared way of life is enough.
  *   **B.** They don't count. The crime requires a stable, birth-based identity like ethnicity.
  *   **C.** They count only if the persecutors treated them like a family.

  **Q2. The Identity (The Construct)**
  Some victims didn't know they were guild members until the arrests began. The persecutors classified them based on surnames.
  *   **A.** It counts. The attack created the group identity.
  *   **B.** It doesn't count. You can't destroy a group that didn't know it existed.
  *   **C.** It counts only for those who identified as members before the attack.

  **Q3. The Method (No Killing)**
  No one was killed. Children were redistributed to other households; the language was banned. The guild vanished in a generation.
  *   **A.** This is destruction. The group is dead even if the people live.
  *   **B.** This is not destruction. Without bodies, there is no crime of this magnitude.
  *   **C.** This is a crime, but a different one (e.g., persecution), not this specific crime.

  **Q4. The Intent (The Order)**
  No leader said "destroy them." The orders were "assimilate them for security." Leaders knew assimilation meant the end of the guild.
  *   **A.** It counts. Knowing the outcome is enough.
  *   **B.** It doesn't count. They must specifically intend the destruction.
  *   **C.** It counts only if the security理由 was a obvious lie.

  **Q5. The Agent (The Bureaucracy)**
  No single person ordered it. It was the result of decades of laws passed by different departments.
  *   **A.** It counts. Structures can commit crimes without a single criminal mind.
  *   **B.** It doesn't count. Crime requires a culpable human agent.
  *   **C.** It counts only if we can find a specific commander who coordinated it.

  **Q6. The Scale (The Valley)**
  The guild was destroyed in one valley, but survives in two neighboring countries.
  *   **A.** It counts. Destroying a significant part is enough.
  *   **B.** It doesn't count. The group as a whole must be threatened.
  *   **C.** It counts only if that valley was the spiritual heart of the guild.

  **Q7. The Harm (The Moral Weight)**
  Is the loss of the guild worse than the sum of the individual hardships suffered by its members?
  *   **A.** Yes. Something unique is lost when a lineage ends.
  *   **B.** No. The harm is just the sum of individual suffering.
  *   **C.** Yes, but only because it signals a risk to everyone else.

  **Q8. The Label (Timing)**
  Should journalists use the specific word for this crime before a court verdict?
  *   **A.** Yes. Early use triggers prevention.
  *   **B.** No. Use only after legal proof.
  *   **C.** No. Avoid the word entirely; it distorts politics.

  **Q9. The Risk (Error)**
  Which is worse?
  *   **A.** Calling it this crime too early and being wrong.
  *   **B.** Waiting for proof and being too late.
  *   **C.** Using the word at all, regardless of timing.

  **Q10. The Purpose (Why Speak?)**
  Why use this specific label rather than "mass atrocity"?
  *   **A.** To mobilize international law and intervention.
  *   **B.** To describe a unique moral truth.
  *   **C.** To satisfy the strict requirements of a statute.

  ***

  ## Part III: The Scoring Key & Positions

  To find your position, tally your answers. However, this is not a simple sum; it is a **profile**. Look for the pattern below that matches your selections.

  ### The Key to the Leaves

  **1. The Convention Purist**
  *   **Pattern:** Mostly **B** on Q1, Q2, Q3, Q4. **B** on Q8.
  *   **View:** Strict adherence to the 1948 UN definition. Only stable, birth-based groups count. Physical destruction is required. Specific intent is mandatory. The word is reserved for legal verdicts.
  *   **Coherence:** High. This is the standard legal orthodoxy.

  **2. The Legal Pragmatist**
  *   **Pattern:** Mostly **B** on Q1-Q5. **C** on Q10.
  *   **View:** Agrees with the Purist on definitions, but not because it's the moral truth. Because it's the only definition courts can enforce without collapsing.
  *   **Distinction:** Hard to separate from Purist on outcomes, differs on *motivation* (Q10).

  **3. The Lemkinian Humanist**
  *   **Pattern:** Mostly **A** on Q1, Q3, Q4, Q8. **A** on Q7.
  *   **View:** Raphael Lemkin's original vision. Cultural destruction counts (Q3). Broader groups count (Q1). Knowledge is enough (Q4). Use the word early to save lives (Q8).
  *   **Coherence:** High. The classic expansive view.

  **4. The Cultural Destruction Advocate**
  *   **Pattern:** **A** on Q3. **B** on Q1 (maybe). **A** on Q7.
  *   **View:** Focuses specifically on the "no killing" wrinkle. Believes destroying a way of life is the core harm, even if they are strict about what constitutes a "group."
  *   **Coherence:** High. Often aligns with Indigenous rights frameworks.

  **5. The Constructivist**
  *   **Pattern:** **A** on Q2. **A** on Q3.
  *   **View:** The group is made by the persecution. Identity doesn't need pre-existence.
  *   **Coherence:** Moderate. Tension with Strict Biological views (see Empty Cells).

  **6. The Structural Critic**
  *   **Pattern:** **A** on Q5. **A** on Q4.
  *   **View:** Focuses on bureaucracy. You don't need a villain; you need a system. "Crime without a criminally liable mind."
  *   **Coherence:** High. Fits modern sociological understandings of atrocity.

  **7. The Foreseeability Advocate**
  *   **Pattern:** **A** on Q4. **B** on Q3 (maybe).
  *   **View:** The mental state is the key. If you know it will happen, you did it. Doesn't necessarily require cultural destruction to count.
  *   **Coherence:** High. Aligns with modern ICC interpretations of intent.

  **8. The Politicide Advocate**
  *   **Pattern:** **A** on Q1 (specifically for political/functional groups). **B** on Q2.
  *   **View:** Groups defined by opinion or status (like pilots) must be covered, but they must exist before the attack.
  *   **Coherence:** High. Distinct from Constructivist.

  **9. The Moral Deflationist**
  *   **Pattern:** **B** on Q7. **B** on Q10 (or C).
  *   **View:** Groups aren't morally real. The harm is just individual suffering. The label is just legal triggering work.
  *   **Coherence:** High. Philosophically consistent individualist view.

  **10. The Moral Absolutist**
  *   **Pattern:** **A** on Q7. **B** on Q8 (maybe).
  *   **View:** The harm is metaphysically unique. Might be strict on the label because using it loosely cheapens the unique evil.
  *   **Coherence:** High. Distinct from Deflationist.

  **11. The Prophylactic Alarmist**
  *   **Pattern:** **A** on Q8. **A** on Q9 (Worse to be late). **A** on Q10 (Mobilize).
  *   **View:** The function of the word is prevention. False alarms are acceptable costs.
  *   **Coherence:** High. Humanitarian interventionist view.

  **12. The Cautionary Realist**
  *   **Pattern:** **B** on Q8. **A** on Q9 (Worse to be wrong). **C** on Q10.
  *   **View:** Word inflation helps perpetrators deny real crimes. Precision matters more than speed.
  *   **Coherence:** High. Common among legal scholars worried about "cry wolf."

  **13. The Hybrid (Court/Public Split)**
  *   **Pattern:** **B** on Q10 (Statute) but **A** on Q8 (Warning).
  *   **View:** Use strict definitions in court, loose definitions in the press.
  *   **Coherence:** Moderate. Pragmatically useful, logically tense.

  **14. The Silent Skeptic**
  *   **Pattern:** **C** on Q8. **C** on Q9.
  *   **View:** The word is too loaded. It distorts everything downstream. Use "atrocity" or "crimes against humanity" instead.
  *   **Coherence:** High. Growing position among journalists.

  ### Empty Cells (Where Nobody Lives)
  *   **The Deflationary Alarmist:** (Mostly **B** on Q7 + Mostly **A** on Q8). If you believe the group harm isn't morally special, you cannot consistently argue for early use of the group-specific label to trigger intervention. (Incoherent).
  *   **The Biological Constructivist:** (Mostly **A** on Q2 + Mostly **B** on Q3). If the group is only created by the persecution, insisting on physical killing rather than cultural dissolution is a tension. (Unattractive/Rare).

  ### Indistinguishable Leaves (Flagged)
  *   **The Convention Purist (1) vs. The Legal Pragmatist (2):** On almost all concrete cases, these two will vote the same way. They only differ on *why* (Moral Truth vs. Legal Workability). Your characters might share this box but argue about the foundation.
  *   **The Lemkinian (3) vs. The Culturalist (4):** These overlap heavily. The Culturalist is essentially a Lemkinian who cares less about political groups. In a binary quiz, they may land in the same spot. Distinguish them by asking if *political* parties count (Q1).

  ### How to Use This for Your Characters
  *   **The Prosecutor:** Likely clusters around **1 (Purist)**, **2 (Pragmatist)**, or **12 (Cautionary)**. They need provable intent and strict definitions to win a case.
  *   **The Reporter:** Likely clusters around **3 (Lemkinian)**, **11 (Alarmist)**, or **6 (Structural)**. They need the word to move public opinion and stop the violence, even if the legal proof isn't there yet.
  *   **The Conflict:** Their fight isn't about facts; it's about which Leaf they inhabit. The Prosecutor thinks the Reporter is reckless (Q9); the Reporter thinks the Prosecutor is complicit in silence (Q8).
