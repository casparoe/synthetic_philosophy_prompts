answer: |-
  Here is a complete run-of-show for your 60-minute session. It is designed to be run by you (the Facilitator) with zero slides and minimal setup, relying on printed materials and room dynamics to drive the insights.

  # Session Title: The Channel Capacity Protocol
  **Goal:** Demonstrate that behavioral tests measure the *link*, not the *node*.
  **Group Size:** 18 people (3 tables of 6).
  **Materials Needed:**
  *   3 Printed Packets per table (see "Materials" below).
  *   Pens/Notepads.
  *   A timer (your phone).
  *   Small prizes (chocolate bars or "skip the queue" lunch vouchers) for the winning table.

  ---

  ## 1. Roles & Setup (0:00 – 0:05)
  Divide the room into 3 tables of 6. At each table, assign these roles (print on small cards if possible):
  *   **2 Judges:** Their job is to identify the source and wager confidence.
  *   **2 Sources:**
      *   *Source Alpha:* A live human volunteer (needs to be articulate).
      *   *Source Beta:* A "Scripted Agent" (uses pre-printed logs from your actual chatbot).
  *   **2 Relays:** They sit between Sources and Judges. They type/transcribe Source output to Judges to strip handwriting/typing-speed tells. **Crucial:** They normalize all text to the same font/size before handing it over.

  **The Rules (Read this aloud, do not elaborate):**
  1.  **Anonymity:** Sources are "Entity 1" and "Entity 2." Judges do not know which is which.
  2.  **The Wager:** For every round, Judges assign a "Mind Probability" (0% to 100%) to each Entity.
  3.  **Scoring:**
      *   Correctly identifying the Human > 50% probability = +1 Point.
      *   Correctly identifying the Script < 50% probability = +1 Point.
      *   **The Penalty:** If you assign >80% confidence and are wrong, you lose 3 Points. (This punishes the "It's obviously a bot" cynic).
  4.  **The Taboo:** Do not use the words "Turing," "Test," "LLM," or "Model" until the final debrief. Refer to them as "Scripted" vs. "Live."

  ---

  ## 2. Round 1: The Standard Channel (0:05 – 0:20)
  **Objective:** Establish baseline. Usually, the Scripted (Bot) passes, and the Live Human passes.
  **Prompt:** "Explain why a customer might be angry about a billing error, and how you would fix it."

  *   **Source Alpha (Human):** Answers naturally.
  *   **Source Beta (Script):** Uses a pre-selected log from your chatbot where it handled a billing query well.
  *   **Relays:** Transcribe both answers onto identical slips of paper. Shuffle them. Hand to Judges.
  *   **Judges:** Discuss, assign probabilities, record scores.
  *   **Facilitator:** Keep time. 10 mins for chat, 5 mins for scoring.

  *Expected Outcome:* Judges will likely struggle to distinguish them. The Scripted entity will look "mind-like" because the channel (text) favors fluency.

  ---

  ## 3. Round 2: The Constrained Channel (0:20 – 0:35)
  **Objective:** Break the Human mind with channel constraints.
  **Prompt:** "Describe the feeling of waiting for a deploy to finish."

  *   **Source Alpha (Human):** **CONSTRAINT:** You may only answer in **maximum 5 words per message**. You may send multiple messages, but each must be ≤5 words.
  *   **Source Beta (Script):** Uses a standard chatbot log (unconstrained).
  *   **Relays:** Transcribe. Note: The Human's output will look fragmented. The Script will look fluid.
  *   **Judges:** Assign probabilities.

  *Expected Outcome:* Judges will assign low "Mind Probability" to the Constrained Human. They will likely assign high "Mind Probability" to the Script. **This is the critical failure mode.** You have a room full of humans voting that their constrained colleague is less "mind-like" than a log file.

  ---

  ## 4. Round 3: The Blind Audit (0:35 – 0:45)
  **Objective:** Isolate the content from the interrogation.
  **Action:** Hand the Judges the transcripts from Round 2 *without* the questions. Just the answers.
  **Task:** "Based *only* on this text, which source understands the concept of 'waiting'?"

  *   **Judges:** Review. Re-score.
  *   **Facilitator:** Watch for the realization that the Scripted answers are generic platitudes ("It is important to be patient"), while the Constrained Human's fragments ("Coffee cold. Screen watching. Please hurry.") contain more semantic density about the *feeling*, despite the constraint.

  ---

  ## 5. The Reveal & Debrief (0:45 – 0:60)
  **Objective:** Map the experience to concepts (a) and (b) without lecturing.

  **Step 1: The Scoreboard (5 mins)**
  *   Ask tables to tally points.
  *   Ask: "Who lost points on the Penalty Rule?" (Likely those who confidently called the Constrained Human a 'bot').
  *   Ask: "In Round 2, who voted that the Scripted Entity had a higher probability of 'mind' than the Human?" (Most hands will go up).
  *   **Say:** "Look at what you just did. You voted that a log file has more mind than [Colleague's Name], who is sitting right here."

  **Step 2: Naming the Ghost (5 mins)**
  *   **Say:** "We just ran a variant of the Turing Test. But we broke it."
  *   **Say:** "In philosophy, this is the *Behavioral Criterion*. If it acts like a mind, it is a mind."
  *   **Say:** "Today, you proved two things:"
      1.  **The False Positive:** The Script passed Round 1. (Surface looks like mind).
      2.  **The False Negative:** The Human failed Round 2. (Mind looks like surface).

  **Step 3: The Channel Argument (5 mins)**
  *   **Say:** "We tend to think intelligence is a property of the *brain*. Today, you measured intelligence as a property of the *pair*."
  *   **Ask:** "In Round 2, did the Human lose their mind when the 5-word rule started? Or did the *channel* lose capacity?"
  *   **Point:** "When we evaluate our chatbot, we are not measuring the model. We are measuring the Model + Prompt + UI + Customer Context. If the customer is angry (noise), the model looks stupid. If the model is constrained (Round 2), it looks stupid. The verdict is on the link, not the node."

  **Step 4: The Lookup Table Objection (Handling the Limitation)**
  *   *Anticipate:* Someone will say, "But the bot still doesn't *know* anything. It's just a lookup table."
  *   *Response:* "You are right. This game cannot prove understanding. No finite transcript can rule out a giant lookup table. That is the **Chinese Room** argument."
  *   *The Pivot:* "But here is the engineering reality: Our support team cannot distinguish the lookup table from the mind in Round 1. If the *behavior* is identical, the *business risk* is identical. We cannot ship based on 'internal understanding' we can't measure. We must ship based on 'channel capacity' we can break."

  **Step 5: The Real World Payoff (Animals & Patients)**
  *   **Say:** "Why does this matter beyond chatbots?"
  *   **Animals:** "We used to think animals didn't feel pain because they couldn't speak the 'language channel' we required. We failed the behavioral test because we set the channel to 'Human Speech'."
  *   **Patients:** "Consider a patient with Locked-In Syndrome. They are fully conscious but cannot move. If you run a behavioral test requiring movement, they fail. You classify them as vegetative. That is a Round 2 error. A real mind locked out by the channel."
  *   **Closing:** "When you argue about the bot in standup, remember: You aren't arguing about tokens. You're arguing about whether our support channel has enough bandwidth to let the customer's intent through. If the channel is too narrow, even a human looks like a bot."

  ---

  ## Mechanics & Payoff Scheme (Concrete)

  **Scoring Card (Print one per Judge):**
  | Round | Entity A % | Entity B % | Correct? (Y/N) | Points | Penalty? (Y/N) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | | | | | |
  | 2 | | | | | |
  | 3 | | | | | |
  | **TOTAL** | | | | | |

  **Payoff Rules:**
  *   **Base Point:** 1 point for identifying the Human correctly (assigning them higher % than the Script).
  *   **Confidence Bonus:** If you assign >80% to the Human and they are Human, +1 extra point.
  *   **The "Cynic" Penalty:** If you assign >80% to the Script (calling it Human) OR >80% to the Human (calling it Script) and you are wrong, **-3 Points**.
      *   *Why:* This specifically targets the person who says "It's obviously just tokens" or "That's too weird to be a bot." It forces them to hedge if they aren't sure.

  ---

  ## Predictable Failures & Mitigations

  **1. The "It's All Bots" Cynic**
  *   *Behavior:* Assigns 100% "Script" to everyone immediately.
  *   *Mitigation:* The Penalty Rule. If they assign 100% Script to the Live Human in Round 1, they get -3 points when you reveal the truth.
  *   *Debrief:* "You prioritized being right about the technology over being right about the data. That's a bias, not a test."

  **2. The Restricted Human Gets Bored/Offended**
  *   *Behavior:* Breaks the 5-word rule or makes snarky comments.
  *   *Mitigation:* Frame the role as "Simulating a Low-Bandwidth API." It's a technical constraint, not an intelligence test. Pick a volunteer with a sense of humor.
  *   *Debrief:* If they break character, use it. "Even a human mind breaks when the protocol is wrong. Imagine our customers."

  **3. The "Lookup Table" Derailment**
  *   *Behavior:* Someone insists the test is invalid because LLMs aren't "real."
  *   *Mitigation:* Agree with them immediately. "Yes. This test doesn't prove mind. It proves *indistinguishability over a specific channel.*"
  *   *Debrief:* Use the "Animals/Patients" closer to show why indistinguishability matters ethically, even if metaphysics is unresolved.

  **4. Time Creep**
  *   *Risk:* Round 1 chat goes long.
  *   *Mitigation:* You are the Timekeeper. At 15 mins, say "Relays, collect final answers." Hard stop. The lesson is in the rush, not the perfection.

  ---

  ## What You Must Supply (The "Lecture" You Can't Avoid)

  You cannot avoid talking about the **Lookup Table / Chinese Room** limitation. The game *cannot* show this; it must be told.
  *   **How to do it:** Do not use slides. Use a **Prop**.
  *   **The Prop:** Bring a thick book (e.g., a phone book or manual).
  *   **The Action:** During the debrief, hold up the book.
  *   **The Script:** "This book contains answers. If I ask a question, and you look it up, you pass the test. If I ask a question not in the book, you fail. The LLM is not this book. It is a compression of this book. But functionally, in Round 1, you could not tell the difference."
  *   **The Point:** "We cannot solve the philosophy of mind in 60 minutes. But we can solve the engineering risk. If the book passes support, we ship. If the book fails support, we retrain. The 'mind' is irrelevant to the SLA."

  ## Final Note on the "Pair" Concept
  To ensure point (a) lands:
  During the debrief, ask the **Relays** to speak first.
  *   **Ask:** "Relays, did you feel like you were filtering the Human differently than the Script?"
  *   **Why:** The Relays are the "Channel." They physically touched the transformation of Mind -> Text. Their testimony validates that the *medium* altered the message.

  This plan respects your engineers' skepticism, avoids the "parlor game" fatigue, and lands the ethical/technical point without requiring a philosophy degree to understand.
