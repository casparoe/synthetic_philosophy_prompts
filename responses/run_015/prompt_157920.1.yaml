answer: |-
  Here's a draft of that argument, written as a monologue you can drop straight into the scene. I've kept it grounded in the character's voice so it doesn't sound like a lecture.

  ***

  "You're looking at this like it's a contract. Ink on paper. Blood oath. Whatever. But you're missing the mechanics of it. A promise isn't a chain you attach to your wrist; it's a handshake between who you were and who you are.

  Think about it. When I made that promise, I was operating on a specific set of truths. I believed in a certain kind of future. I believed *I* was the kind of person who could walk into that future. But people aren't static, right? We're just stories we tell ourselves over and over until we believe them. And sometimes… sometimes the genre changes.

  If I'm writing a tragedy and suddenly my life becomes a survival horror, I can't exactly keep to the plot points of the first draft.

  Take the heavy stuff. Take trauma. Or even just a radical shift, like finding God, or losing faith, or waking up one day and realizing the person you've been pretending to be is a lie. When that happens, there's a fracture. There's a Before and an After. The person who made the promise? They live in the Before. They're basically a ghost now.

  So why should the person standing in the After be held hostage by a ghost?

  It's not about convenience. It's not about me just getting bored or finding something shinier. It's about continuity. If I look back at the person who made that vow and I feel… nothing. If I look at them like a stranger, like someone I read about in a biography but never met… then the bridge is out. The commitment only holds if my current narrative still has room for the guy who made it. If I've edited him out of the story, the promise dies with him.

  You want me to keep my word? Fine. But you're asking the wrong person. You're asking the survivor to pay the debts of the victim. And I don't know if that's justice, or just cruelty."

  ***

  **Notes for staging the scene:**

  *   **Action:** Have the character doing something mundane while saying this. Cleaning a gun, peeling an orange, fixing a leak. It grounds the heavy philosophy in physical reality.
  *   **Pacing:** Let them pause. This isn't a rehearsed speech; they're figuring it out as they say it. They should stumble over the "trauma" part slightly, like it's personal.
  *   **The Counter:** The other character doesn't need a complex rebuttal. A simple "That's convenient for you," or "So nobody is ever responsible for anything?" works best to highlight the tension.
