  Dear Friend,

  You ask whether Henry Sidgwick's verdicts in psychical research were governed by a single rule or several, and how that consistency bears upon the cross-correspondences. To answer this, we must look closely at the epistemological machinery he employed across the cases you cite. In the Census of Hallucinations, Sidgwick operated on a rule of statistical aggregation, where the sheer volume of testimony allowed him to calculate a probability baseline; the excess of coincidences over what chance would predict was accepted as evidence of a real connection, even if the cause remained unknown. Conversely, in the slate-writing demonstration and the Eusapia Palladino sittings, he applied a rule of strict elimination, where the possibility of fraud or error in even a single instance was sufficient to invalidate the witness's competence or the medium's integrity entirely. While these methods appear distinct—one mathematical and aggregative, the other physical and negative—they are ultimately manifestations of a single master principle: the rigorous exclusion of normal causes before accepting a paranormal claim. In the Census, the normal cause was chance; in the Palladino case, the normal cause was trickery. Sidgwick's consistency lies not in the uniformity of his technique, but in the uniformity of his skepticism regarding normal explanations.

  When we apply this unified principle to the cross-correspondences, the tension you perceive between the aggregate-statistics instinct and the interpretive nature of the scripts becomes the deciding factor. Sidgwick would likely have withheld assent from the claim that these scripts proved the survival of himself, Myers, and Gurney. His reasoning would have hinged on the fact that the pattern was identified by interpretation after the fragments were collected, rather than being predicted against a chance baseline beforehand. The Census succeeded because it counted all reports, not just the hits, thereby establishing a denominator for the probability calculation. The cross-correspondences, by selecting fragments that fit a pattern discovered post hoc, risk the error of data dredging, where coincidence is mistaken for design. Furthermore, consistent with his treatment of Palladino, Sidgwick would have demanded the elimination of normal causes regarding the source of the information; until telepathy among the living automatists or their associates was ruled out, the hypothesis of discarnate agency remains unsupported. Thus, while the Census rule allows for anomalous connections, it does not license the specific claim of survival without stricter controls against living agency, and the Palladino rule demands those controls be flawless.

  The crucial fact that would discriminate between the candidate rules governing his verdict is whether a chance baseline could have been specified before the fragments were compared. If such a baseline were possible and met, the Census rule would compel him to acknowledge a statistically significant anomaly, forcing the debate onto the nature of the cause. If no such baseline could be specified, the evidence falls back into the realm of anecdotal interpretation, where the Palladino rule of strict elimination applies, and the possibility of unconscious collusion or coincidence remains sufficient to reject the survival hypothesis. The other facts you mention, such as whether a living person knew the design or whether the scripts were sealed, are secondary controls that serve the master principle, but the specification of a chance baseline is the primary discriminator that determines whether his statistical method—the only one that ever yielded a positive verdict in his work—can be brought to bear at all. Without it, the cross-correspondences remain a compelling literary curiosity rather than the scientific proof Sidgwick required.

  Yours sincerely,

  A Student of the Society
