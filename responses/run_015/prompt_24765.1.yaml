answer: |-
  # Causation Diagnostic Tree for Field Scientists

  **Starting Assumption:** We agree that *A* made a difference to *B*. We are trying to define what that "making a difference" consists in.

  ### Node 1: Scope of the Claim
  Are we explaining a **specific historical occurrence** (e.g., "This lightning strike caused this forest fire") or a **general relationship** (e.g., "Lightning causes forest fires")?
  *   **Specific (Token):** Go to Node 2.
  *   **General (Type/Variable):** Go to Node 5.

  ---

  ### Node 2: The Preemption Test (Token)
  Imagine the specific cause *A* occurred and effect *B* followed. However, there was a backup process *C* ready to step in; if *A* had not occurred, *C* would have caused *B* anyway. Did *A* cause *B*?
  *   **No (A must be necessary):** Go to Node 3.
  *   **Yes (A was active despite backup):** Go to Node 6.

  ### Node 3: Strict Dependence (Token)
  If *A* had not happened, would *B* definitely *not* have happened in that exact way? (i.e., Is causation strictly about the effect changing in the counterfactual scenario?)
  *   **Yes:** Go to Node 8.
  *   **No (B could still happen by chance):** **Leaf: Probabilistic Token Causation**.

  ### Node 4: [Skipped in this path, see Node 6]

  ### Node 5: Observation vs. Manipulation (Type)
  To say "A causes B" generally, is it enough to observe that A and B always occur together, or must we be able to change B by changing A?
  *   **Observation is enough:** **Leaf: Regularity Theory**.
  *   **Must be able to change B:** Go to Node 7.

  ### Node 6: The Connection Requirement (Token)
  Since *A* mattered even with a backup available, was there a physical link (energy, matter, signal) flowing from *A* to *B*?
  *   **Yes (Physical flow required):** Go to Node 8.
  *   **No (Abstract/Logical connection suffices):** **Leaf: Causal Pluralism** (See Note 1).

  ### Node 7: Intervention Constraints (Type)
  For the "changing A" requirement to hold, must a human agent be *physically capable* of performing the change, or is it enough that the change is logically definable in a model?
  *   **Physically possible for an agent:** **Leaf: Agency/Manipulability Theory**.
  *   **Logically definable (hypothetical):** **Leaf: Interventionist Theory**.

  ### Node 8: Omissions and Negatives
  Can a cause be the *absence* of something (e.g., "The gardener's *failure* to water caused the plant's death")?
  *   **No (Causes must be events/stuff):** **Leaf: Conserved Process Theory**.
  *   **Yes (Absences count):** **Leaf: Lewis-Style Counterfactual**.

  *(Note: Node 8 is reached from both Node 3 and Node 6 paths, merging the strict dependence and physical flow branches for the final distinction on omissions.)*

  ---

  ### The Leaves (Position Summaries)

  1.  **Regularity Theory:** Causation is constant conjunction. If A is always followed by B, A causes B. No need for "forces" or "what-ifs."
  2.  **Agency/Manipulability Theory:** Causation is tied to human experimental power. If you can't wiggle A to see B move, it's not causation.
  3.  **Interventionist Theory:** Causation is invariance under hypothetical intervention. Even if humans can't touch it (e.g., planetary orbits), if the variables would change under a defined intervention, it is causal.
  4.  **Lewis-Style Counterfactual:** Causation is about dependency between specific events across possible worlds. If A hadn't happened, B wouldn't have. Accepts omissions and preemption (via "quasi-dependence").
  5.  **Probabilistic Token Causation:** A causes B if A raises the objective chance of B occurring at that specific moment, even if B wasn't guaranteed.
  6.  **Causal Pluralism:** There is no single definition. "Cause" means different things in different contexts (e.g., physics vs. ecology vs. law).
  7.  **Conserved Process Theory:** Causation requires a physical transmission of a conserved quantity (energy/momentum). No "action at a distance" or omissions.
  8.  **Mechanistic Theory:** (Merged with Process/Pluralism in this tree) Causation requires a continuous, productive mechanism linking A to B, excluding mere correlations or omissions.

  ---

  ### Diagnostic Notes for the Group

  **1. Unoccupied Logical Space: "Physical Process + Omissions"**
  You might find yourself answering **Yes** to Node 6 (Physical link required) but **Yes** to Node 8 (Omissions count). This combination is theoretically unstable and largely unoccupied in the literature. If causation requires a physical flow of "stuff" (like energy), an omission (a lack of action) cannot transmit that stuff. A theory that demands physical transmission but accepts "nothing" as a transmitter contradicts itself. If you hold this view, you likely slide into **Pluralism**, admitting that "physical cause" and "explanatory cause" are two different questions.

  **2. Indistinguishable Leaves: Interventionist vs. Agency**
  The tree separates **Interventionist Theory** (Node 7, Logically definable) from **Agency/Manipulability** (Node 7, Physically possible). In practice, these are often difficult to separate. Modern Interventionists (like Woodward) argue that interventions need not be humanly performable, only well-defined within a model. However, if your scientific practice insists that an intervention *must* be something a field researcher could actually do (e.g., you reject causal claims about stellar evolution because you can't manipulate stars), your operational view collapses into **Agency**. The distinction is philosophical, but rarely changes ecological data analysis unless you are modeling variables that are logically coherent but physically impossible to isolate.

  **3. The Counterfactual vs. Interventionist Confusion**
  Your initial confusion stems from Node 2 and Node 7.
  *   **Lewis (Counterfactual)** focuses on Node 2 (Preemption) and Node 8 (Omissions). He asks: "In the closest possible world where A is gone, is B gone?"
  *   **Woodward (Interventionist)** focuses on Node 5 (Type) and Node 7 (Intervention). He asks: "In the structural equation, if I set A to 0, does B change?"
  *   **The Split:** Lewis handles omissions better (not watering is a cause). Interventionists handle preemption better (the active path matters, even if the backup existed). If you care more about field experiments (wiggling variables), you lean Interventionist. If you care more about historical reconstruction (what if the rain hadn't stopped?), you lean Lewis.

  **4. A Note on Pluralism (Leaf 6)**
  If you found yourself answering differently depending on whether you were thinking about a specific fire (Token) versus forest management policy (Type), you may be a **Causal Pluralist**. This is a common position for scientists who use statistical models for general laws but narrative explanations for specific events. The tree forces a choice at Node 1, but Pluralism suggests the choice itself is the answer: different tools for different jobs.
