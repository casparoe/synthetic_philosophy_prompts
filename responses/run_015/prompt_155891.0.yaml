          *   *Cost:* You have to grant a special status to the "person-stream" that borders on a self. It risks reifying the process.
          *   *Does it let a self back in?* No, but it treats the process *as if* it were a substantial entity for practical purposes.

      *   **Option 3: Bodhisattva Ideal / Non-Duality of Self and Other (Mahayana/Yogacara).**
          *   *Idea:* Challenge Step (5) and (6) differently. It's not that self-interest collapses into altruism; it's that the distinction is false.
          *   *Resolution:* Helping others *is* helping yourself because the separation is illusory. But you still need to purify *this* vessel to help effectively. You can't wake up someone else if you are asleep.
          *   *Cost:* Requires a shift from "liberation from samsara" to "working within samsara." Might feel less urgent regarding personal escape (Step 7).
          *   *Does it let a self back in?* No, it dissolves the dichotomy entirely.

