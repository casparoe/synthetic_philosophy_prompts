      *   (3) Causal Continuity: Causality crosses bodily boundaries (interdependence). (Standard Doctrine)
      *   (4) Arbitrary Boundaries: Personal boundaries are drawn, not found. Future extends beyond death. (Philosophical extrapolation)
      *   (5) Ethical Implication: Self-interest collapses into impartial benevolence. (Utilitarian/Altruistic leap)
      *   (6) Soteriological Conclusion: No reason to practice for *own* liberation. Just work where suffering is thickest. (The problematic conclusion)
      *   (7) Phenomenological Observation: This contradicts the actual motivation for practice (wanting out) and the structure of liberation (someone gets liberated).

      *   *The Core Tension:* The tension between *Ultimate Truth* (no self, interdependence) and *Conventional Truth* (karma, rebirth, liberation, practice). This is the famous Two Truths Doctrine problem.

  3.  **Identify the Flaw:**
      *   The argument conflates *ontological status* (what exists ultimately) with *soteriological necessity* (what is needed for practice).
      *   It assumes that because the self is "conventional," it is "optional" or "irrelevant" for ethical/practical decision-making.
      *   It ignores the mechanism of karma: even if the "self" is a stream, the *continuity of that specific stream* matters for the experience of suffering.
      *   Step (5) to (6) is the biggest leap. Just because boundaries are porous doesn't mean they don't exist *functionally*.

  4.  **Develop the "Ways Out" (Standard Buddhist Responses):**

      *   **Option 1: The Two Truths Doctrine (Madhyamaka/Standard Mahayana/Theravada overlap).**
          *   *Idea:* Distinguish between Ultimate Truth (*paramattha sacca*) and Conventional Truth (*sammuti sacca*).
          *   *Resolution:* (1) and (2) are Ultimate. (6) is wrong because practice happens on the Conventional level. You need a conventional self to practice to realize the ultimate truth.
          *   *Cost:* You have to accept a kind of "fictionalism." You act *as if* there is a self while knowing there isn't one ultimately. It can feel duplicitous or intellectually split.
