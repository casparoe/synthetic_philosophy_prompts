answer: |-
  ### Specification of Desiderata for Idealized-Preference Accounts

  To function as a viable specification for high-stakes delegated agency, an account of idealized preference must satisfy the following conditions. They are divided into constitutive requirements (non-negotiable for the concept to hold) and local commitments (contingent on the engineering or metaphysical framework).

  #### 1. The Fidelity Constraint (Non-negotiable)
  **Specification:** The idealized preference set must be derivable from the agent's actual motivational structure via a continuous transformation. There must exist a traceable chain of reasoning connecting the actual preferences to the idealized ones.
  **Case:** Without this, the system does not act on the *agent's* behalf but substitutes a different agent (e.g., the designer's morality or an objective value theory). This violates the mandate of delegated agency.

  #### 2. The Correction Constraint (Non-negotiable)
  **Specification:** The idealization operator must strictly improve upon the actual preferences regarding identified cognitive defects (ignorance, logical inconsistency, framing effects, coercion).
  **Case:** If the output retains known errors of the actual state, the idealization is functionally redundant. It fails to deliver the normative gain that justifies the counterfactual machinery.

  #### 3. Reflective Stability (Non-negotiable)
  **Specification:** The output must constitute a fixed point: if the agent were to confront the idealized preference with the knowledge of the idealization process, she would not revise it further.
  **Case:** Without stability, the "ideal" is merely a transient step in an infinite regress. An unstable mandate cannot guide action because the agent (or trustee) would always have reason to wait for the next iteration.

  #### 4. Operationalizability (Local Commitment: Engineering)
  **Specification:** The idealization function must be approximable within finite computational and epistemic resources.
  **Case:** This is not a metaphysical requirement but a functional one. For the purpose of building a system to act in partially foreseeable circumstances, a definition relying on omniscience or infinite reflection time is useless.

  #### 5. Path Independence (Local Commitment: Metaphysical)
  **Specification:** The idealized output should depend only on the agent's current state and the idealization parameters, not on the specific historical trajectory (learning history, narrative) that produced the current state.
  **Case:** This simplifies the formal model by treating the agent as a state machine rather than a narrative entity. It is often assumed to ensure uniqueness, but it is not strictly required by the concept of volition itself.

  ***

  ### Negative Structure and Exclusionary Analysis

  **Incompatible Pairs**
  The most significant tension lies between **Fidelity** and **Correction**. To satisfy Correction, one must strip away biases and ignorance; however, since an agent's identity is partially constituted by their specific cognitive architecture and experiences, aggressive correction drifts toward Fidelity failure. You cannot fully correct for "who the agent is" without becoming "someone else." A secondary tension exists between **Reflective Stability** and **Operationalizability**. Proving a fixed point often requires limits of infinite processes, which violates the finite resource constraints of Operationalizability.

  **The Most Exclusionary Requirement**
  **Operationalizability** does the most exclusionary work against existing philosophical accounts. Most formal definitions of idealized preference rely on limits (e.g., "what I would want if I knew everything") that are provably uncomputable or require resources exceeding the universe's capacity. While metaphysically coherent, these accounts fail the "hand to an engineer" test immediately.

  **Correctness vs. Artifacts of Commitment**
  Two standard desiderata often function as disguised prejudices rather than correctness conditions:
  1.  **Uniqueness (often tied to Path Independence):** The demand that there be *one* converged volition is a decision-theoretic artifact. It assumes rationality converges to a point, whereas psychological reality may converge to a set or a cycle. This is often driven by a managerial need for a single mandate rather than a truth about agency.
  2.  **Path Independence:** This is a commitment to ahistorical rationality. It privileges a "state" view of the person over a "narrative" view. Insisting on it disguises a political commitment to treating agents as interchangeable units of preference rather than historically situated beings.

  ***

  Most accounts silently satisfy **Correction** and **Reflective Stability** by stipulation, assuming the limit exists. They silently ignore **Operationalizability** and the boundary conditions of **Fidelity**, treating the transition from actual to ideal as cost-free and identity-preserving by fiat.
