answer: |-
  To translate Parfit's reductionist claims into craft vocabulary, we must treat the character not as a soul but as a construct. Here is the mapping of the four claims.

  First, the reductionist claim that there is no "further fact" of identity beyond physical and mental states translates to the principle that a character is exhausted by the **Series Bible**. There is no hidden essence outside the text; the character is simply the sum of their recorded actions, dialogue, and history. Where terms compete, I choose **Continuity** over "Identity." Identity implies a binary switch (either he is him or he isn't), whereas Continuity allows for the graded connections Parfit requires. A character survives if the Continuity of their voice and history holds, regardless of the medium.

  Second, the claim that psychological continuity is what matters, regardless of cause, maps to **Fidelity in Adaptation**. If a role is recast between instalments, or a book is adapted to film, the audience accepts the new iteration as the same character if the behavioral patterns match. The cause of the change (aging actor, digital reconstruction) is irrelevant; only the fidelity of the performance matters.

  Third, the fission case—where one person splits into two, breaking identity but preserving what matters—translates to **Parallel Runs** or a **Soft Reboot**. When a franchise spawns two conflicting timelines, neither is the "original" in a strict Continuity sense, yet both carry the weight of the character. The single thread is broken, but the narrative utility remains intact.

  Fourth, the claim that survival holds to degrees translates directly to **Canonicity**. A retcon weakens the link to the original run; a faithful sequel strengthens it. Survival is not all-or-nothing; it is a measure of how much the current text honors the previous one.

  I must flag a critical tension here. Craft vocabulary assumes **Authorial Stipulation**: the author decides who is who. In your novel, however, you are asking us to treat the characters as autonomous within the world of the book, not as puppets of your decree. If you simply stipulate that the reconstruction is the husband, the philosophical problem evaporates. You must resist the God-trick of authorship and let the craft terms describe the internal logic of the diegesis, not your external control over it.

  **Residue Report**

  Of the four claims, only the fourth translates cleanly. **Canonicity** is already a continuum. We understand that a cameo is less "real" than a main arc, just as Parfit understands survival as a matter of degree.

  The second and third claims survive only distorted. **Fidelity** and **Parallel Runs** measure the audience's relationship to the character, not the character's relationship to themselves. When we say a recast is "faithful," we mean the reader recognizes the role, not that the character feels continuous. This distortion leads directly to your first suspicion: craft vocabulary cannot say anything first-personal. There is no term for what a character anticipates for themselves because characters do not anticipate; authors plot, and readers perceive. The question "Will *I* survive?" is unstageable because there is no *I* inside the manuscript, only a pattern of words that simulates one. The philosophical force of Parfit's argument relies on the subject's dread of cessation. Craft relies on the reader's curiosity about continuation. You can write Marianne's grief, but you cannot write the Husband's death, because he is already text.

  Your second suspicion is also correct. The craft continuum measures **Reader Identification**, not ontological survival. When we say a sequel feels "inauthentic," we mean we no longer identify with the protagonist, not that the protagonist has ceased to exist. This is a defect of the vocabulary, not the philosophy. The vocabulary is designed to manage audience uptake, not to track metaphysical persistence. It tells you how to keep the reader engaged, not how to keep the person alive. This reveals that the philosophical claim was doing work that craft ignores: distinguishing between *being* the character and *reading* the character.

  **Marianne vs. The Husband**

  This distinction is vital. Craft vocabulary can express what matters to Marianne, but not what matters to the Husband. Marianne occupies the position of the **Reader**. She is the observer testing the Continuity, judging the Fidelity, and assigning Canonicity. Her struggle is one of identification: can she invest emotionally in this new draft? The craft terms describe her experience perfectly. She is deciding whether to accept the recast.

  The Husband, however, occupies the position of the **Subject**. He is the one who supposedly faces extinction or survival. Craft has no terms for his stake because, in fiction, the Subject is always an object. We can describe his behavior (Continuity), but we cannot describe his existence. If you use craft terms to solve his problem, you are solving Marianne's problem instead. You are deciding whether *she* should accept him, not whether *he* is alive. The vocabulary collapses the two stakes into one: the stability of the narrative. You must keep them separate. Marianne's loss is real (grief, loneliness); the Husband's loss is theoretical (ontological discontinuity). Craft speaks to the real loss; it silences the theoretical one.

  **The Scene**

  Your instinct about the memory test is correct: it is a cheat. In craft terms, a memory test verifies the **Series Bible**, not the Character. Proving the reconstruction knows a secret password only proves data integrity. It confirms that the archive was copied successfully, not that the subject survived. It reduces the Husband to a container of information, which validates Marianne's comfort but bypasses the question of his identity. It is a scene of verification, not recognition.

  An honest scene would have to abandon verification entirely. It cannot ask, "Are you him?" because the craft vocabulary suggests the answer is always "Yes, enough for the plot." Instead, the scene must ask, "Are you owed?" It must stage Marianne's decision not as a discovery of truth, but as an assignment of **Canonicity**. She must look at the two diverging instances—the embittered one and the serene one—and realize that neither is the original, but both are drafts she must edit.

  The honest scene is not a test she administers to them; it is a choice she makes about her own narrative. She must decide which version fits the story she can live with. This shifts the burden from metaphysics to ethics. The reconstruction cannot pass a test to prove he is alive; he can only act in a way that demands she treat him as alive. The scene must show Marianne withholding or granting the status of "Husband" based on her own needs, acknowledging that the Continuity is broken regardless of what he says. She must realize that she is not the reader of his life anymore; she is the author of his afterlife. The tension comes from her realizing that granting him Canonicity costs her something, and denying it costs him nothing, because he is already text. The scene must end not with a password accepted, but with a contract signed, where she admits she is choosing a version, not finding a truth.
