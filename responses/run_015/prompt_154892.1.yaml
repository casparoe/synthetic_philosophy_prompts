      *   Group R (Report): Read Card.
      *   They cannot show each other evidence (no showing the card, no pointing at the box). They can only talk.
      *   They must sign a joint warrant.
      *   **The Trap:** In Round 2, the Card says "Green." The Box contains "Green." (Match). In Round 3, the Card says "Green." The Box contains "Nothing." (Mismatch).
      *   Wait, if Group P sees "Nothing," they know there's a mismatch. The point of the Argument from Illusion is that sometimes you *can't* tell.
      *   *Adjustment:* The game cannot perfectly replicate indistinguishability (as noted in limitations). The game replicates the *structural* risk. The debrief must bridge the gap.
      *   *Better Adjustment:* The "Direct" group looks through a foggy lens or for a very short time? No, keep it simple. The game illustrates the *stakes* of treating them as the same kind.
      *   *Key Insight:* The game demonstrates why we *shouldn't* treat them as the same kind, even if they feel similar. The penalty structure punishes the "Common Factor" strategy.

  8.  **Finalizing the Rules & Materials:**
      *   Need Envelopes, Cards, Box, Scoreboard.
      *   Roles: Perceivers (P), Reporters (R), Auditors (A).
      *   Payoff: Team pot.
      *   Penalty: "Epistemic Negligence" fine if they ignore source reliability.

  9.  **Drafting the Debrief:**
      *   Connect to McDowell/Martin.
      *   Metaphysical Disjunctivism: The states are fundamentally different (fact-involving vs. not).
      *   Epistemic Disjunctivism: One provides knowledge, the other doesn't, even if introspectively similar.
      *   Limitation: The "felt" experience. In the game, reading a card feels different than seeing an object. In reality, a perfect hallucination feels like seeing. I must supply this premise verbally.

  10. **Review against Constraints:**
      *   12 grad students? Yes (split groups).
      *   90 mins? Yes.
      *   No tech? Yes (cards/box).
      *   Adversarial hallucination? Yes (Instructor manipulates the Report chain).
      *   Payoff/Penalty? Yes.
      *   Debrief included? Yes.

  11. **Self-Correction on "Subjective Sameness":**
      *   I need to be careful not to claim the game *creates* subjective sameness. It creates *propositional* sameness ("I believe X" vs "I see X").
      *   I will explicitly frame the game as a model of the *consequences* of the Common Factor view, not a perfect phenomenological replica.
      *   The "Twist" is that the Report group is told the feed is live (creating a *claim* to directness), but it's actually a script.

  12. **Final Polish:** Ensure the tone is appropriate for grad students (rigorous, not childish). The payoff should be symbolic (course credit, candy, or just bragging rights) to avoid ethical issues with gambling. Let's use "Epistemic Utility Points" redeemable for something trivial or just status.

  *(Self-Correction during drafting)*: Wait, if Group P sees the box is empty, they will veto opening. The "Argument from Illusion" relies on the Perceiver *not* knowing they are hallucinating.
  *Fix:* The "Direct" group gets a *degraded* view (e.g., 2-second glimpse through a pinhole) so they aren't 100% certain, making them rely on the Report. OR, the game focuses on the *Report* group's vulnerability.
  *Better Fix:* The game is about the *Auditor* and the *Joint Warrant*. The group must issue a joint statement. If they issue a statement "We know X" based on mixed evidence, they are penalized.
  *Best Fix for Disjunctivism:* The game shows that if you treat the Report as the same *kind* of evidence as Perception, you lose when the causal chain breaks. The "Subjective Sameness" is simulated by the *confidence* the Report group expresses. They are instructed to act as confident as the Perceivers.

  Let's go with:
  Group P: Sees Object (Veridical).
  Group R: Gets Note (Simulated Hallucination/ Illusion).
  In Round 2, the Note is decoupled from the Object.
