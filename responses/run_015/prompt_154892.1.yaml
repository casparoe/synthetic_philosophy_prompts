      *   Bonus for "Source Tracking": If Direct perceivers override Report perceivers when they conflict.

  5.  **Addressing the Limitations (Crucial for Debrief):**
      *   **Transparency:** In the game, students *know* they are reading a card vs. looking at an object. In real perception, the hallucination *feels* like looking. I cannot reproduce the *phenomenology* of hallucination in a game where they know they are reading a card. I must admit this.
      *   **Factivity:** The game simulates the *risk* of non-factivity. I need to explain that Disjunctivism claims veridical perception is factive (constituted by the object), which the game can only model structurally, not experientially.

  6.  **Structuring the Session (90 mins):**
      *   0-10: Intro & Setup.
      *   10-30: Round 1 (Calibration/Trust).
      *   30-50: Round 2 (The Adversarial Twist).
      *   50-60: Scoring & Confusion.
      *   60-90: Debrief & Philosophical Mapping.

  7.  **Refining the "Adversarial Hallucination":**
      *   To make it truly "Disjunctivist," the focus must be on the *nature of the state*.
      *   Let's create a specific "Bet Sheet."
