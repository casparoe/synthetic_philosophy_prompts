          *   Group B (Report-Receivers): Get an identically worded report via a deceptive causal chain (printed card claiming live-feed, actually describing a fake).
          *   Subjective Sameness: Both groups feel they have the same evidence/experience.
          *   Task: Coordinate a single bet (Open the box? Yes/No).
          *   Roles: Direct Perceivers, Report-Receivers, Skeptical Auditor.
