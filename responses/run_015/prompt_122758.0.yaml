          *   *Lottery Paradox:* High probability for each ticket losing $\rightarrow$ High probability all lose $\rightarrow$ Contradiction when one wins. Suggests high probability $\neq$ knowledge/belief.
          *   *Preface Paradox:* Belief in each claim in a book $\rightarrow$ Belief in conjunction $\rightarrow$ But belief that at least one error exists.
          *   *Conjunction Problem in Law:* If Element A is 0.9 probable and Element B is 0.9 probable (independent), $P(A \& B) = 0.81$. If BRD requires $>0.9$, do we convict? Legal practice says yes (usually), focusing on elements, not the product.
      *   **The Legal Structure:**
          *   *Element-wise:* *In re Winship* (SCOTUS) requires proof of every fact necessary to constitute the crime.
          *   *Holistic Verdict:* The jury says "Guilty," not "Element 1: Yes, Element 2: Yes..." (though special verdicts exist, they are rare in criminal law).
          *   *Alternative Means:* *Schad v. Arizona* allows unanimity on verdict without unanimity on theory.
          *   *Bare Statistics:* *Sargent v. Massachusetts* (Gatecrasher), prison yard cases. Courts reject naked statistical probability for individual guilt.
      *   **Epistemological Tensions:**
          *   Atomism (element-by-element) risks the Conjunction Problem (probability drops).
