          *   The statistical evidence ban reinforces that legal proof requires *individualized* warrant, not just probabilistic likelihood.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to say the law *is* Bayesian. Most legal scholars (Cohen, Nesson) argue it *cannot* be.
      *   *Nuance:* The "Alternative Means" doctrine (unanimity on verdict, not theory) actually supports the Holistic/IBE view. If Juror 1 thinks A killed via Poison, Juror 2 thinks A killed via Stabbing, both agree "A killed." The *event* is the focus, not the specific causal path (unless the path is an element).
      *   *Key Distinction:* Distinguish between the *Conjunction Problem* (probabilities multiplying) and the *Statistical Evidence Problem* (naked stats vs. individualized evidence). The user asks if they come from the same commitment.
      *   *Answer:* They stem from different commitments. Conjunction is handled by ignoring the math (pragmatism/narrative). Statistics are handled by a requirement for causal/sensitive evidence (epistemic norm). They are in tension: one lowers the bar (ignoring conjunction drop), one raises it (barring stats).

