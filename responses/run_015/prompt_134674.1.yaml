answer: |-
  To the Foundation Board:

  You have asked for a roadmap to determine which evolutionary explanations are "respectable" when used by non-biologists to describe human social behavior. You have also restricted the funding to theoretical and conceptual work, with no new data collection. This constraint is not a limitation; it is the correct strategic choice. The units-of-selection debate does not suffer from a lack of data; it suffers from a surplus of incompatible metaphors.

  Your goal is to identify **export-grade** questions. A question is export-grade if settling it changes how a psychologist, economist, or anthropologist constructs an argument. It is **in-house** if it merely rearranges the mathematical furniture for evolutionary biologists without altering the recommendations given to outsiders.

  Below, I identify one candidate from your list as largely verbal and overrated, and then present the four genuinely export-grade questions, ordered by urgency. I defend this ordering based on downstream impact on non-biologists, tractability via theoretical work, and current neglect.

  ### The Verbal Trap: Gene's-Eye vs. Multi-Level Selection

  I advise you to treat the question of whether the gene's-eye view and multi-level selection (MLS) differ causally or only as ways of partitioning variance as **in-house and largely verbal.**

  For three decades, theorists have shown that these frameworks are often mathematically equivalent; they describe the same change in frequency using different accounting ledgers. For a biologist studying fruit flies, choosing one over the other is a matter of heuristic convenience. For your target audience—an economist modeling firm survival or an anthropologist modeling ritual transmission—this equivalence is a distraction. Telling them they must choose between "gene selection" and "group selection" based on this debate forces them into a biological metaphysics that does not map onto their data.

  This question should not receive fellowship funding unless the proposal explicitly ties the mathematical equivalence to **causal intervention**. If a theorist can prove that choosing one framework over the other leads to different policy recommendations or experimental designs for social scientists, it becomes export-grade. Absent that, it is a debate about bookkeeping, not reality. Dismissing this allows us to focus on questions where the answer actually constrains or empowers the outsider.

  ---

  ### Priority 1: The Intervention Test (Higher-Level Utility)
  **The Question:** *Is a higher-level description ever more than bookkeeping? Specifically, does it screen off lower-level dynamics, generalize to novel cases, or license interventions that the lower-level description does not?*

  **Why it is #1:** This is the single most urgent question for your foundation's mission. Non-biologists are constantly accused of "soft thinking" when they treat groups, cultures, or institutions as evolving units. The charge is that these are just aggregates of individuals, and any explanation at the group level is a shorthand for individual psychology or genetics. If this charge is true, evolutionary explanations in sociology and economics are category errors. If it is false—if group-level variables "screen off" individual details—then these explanations are not just respectable, they are *necessary*.

  **Downstream Impact:** High. If the answer is "yes, higher levels screen off," an economist is justified in modeling "firm selection" without reducing every decision to CEO psychology. If "no," they are committed to reductionism. This dictates the fundamental architecture of social theory.

  **Tractability (Theory-Only):** High. This is a problem in the philosophy of causation and statistical modeling. Fellows can use existing formalisms (causal graphs, structural equation modeling) to define the conditions under which a macro-variable renders micro-variables irrelevant for prediction. No new biological data is needed; only rigorous analysis of existing models.

  **Neglect:** Moderate. Philosophers of biology discuss "causal autonomy," but social scientists rarely see the technical criteria. Bridging this gap is a translation job ripe for postdocs.

  **Three-Year Milestone:** A "Decision Tree for Explanatory Autonomy." A formal set of criteria that a social scientist can apply to their model to determine if their group-level variable is causally robust or merely descriptive.
  *   **Move Up:** If a fellow demonstrates a case where a group-level intervention succeeds while all individual-level interventions fail.
  *   **Move Down:** If it is proven that screening-off is mathematically impossible in open systems, rendering the criterion useless for social science.

  ### Priority 2: The Grain Problem (Transmission vs. Interaction)
  **The Question:** *What happens when the level at which heritable variation is transmitted does not match the level at which the selective interaction occurs?*

  **Why it is #2:** Biological evolution assumes a tight coupling: genes transmit vertically, and organisms interact. Human social evolution breaks this. Ideas transmit horizontally (peer to peer), institutions transmit obliquely (teacher to student), and microbes transfer genes laterally. When the "grain" of transmission is finer or coarser than the "grain" of selection, standard evolutionary models produce garbage. This is the live version of the units debate for culture and economics.

  **Downstream Impact:** High. Anthropologists and memeticists often assume cultural traits replicate like genes. If the transmission grain is mismatched, the concept of a "cultural unit" (a meme, a norm) may be incoherent. This directly impacts how psychologists model learning and how economists model innovation diffusion.

  **Tractability (Theory-Only):** Medium. This requires building new theoretical models that decouple transmission from interaction. It is harder than the Intervention Test because it requires simulating dynamics, but it is purely computational/theoretical.

  **Neglect:** High. Biologists study this in microbiomes, but social scientists import the biological default (vertical transmission) by habit. Correcting this import error is high-value work.

  **Three-Year Milestone:** A "Taxonomy of Mismatch." A classification system detailing which combinations of transmission and interaction grains allow for stable evolution and which lead to noise.
  *   **Move Up:** If a fellow identifies a specific mismatch common in human culture (e.g., horizontal transmission of norms) that fundamentally alters the predicted equilibrium of standard game theory.
  *   **Move Down:** If it turns out that mismatches average out over time, making the biological default a sufficient approximation for most social science purposes.

  ### Priority 3: The Lineage Constraint (Unit Identity)
  **The Question:** *Can any account of what is selected survive the fact that many candidate units (soma, demes, firms, languages) are not things with clean lineages?*

  **Why it is #3:** Evolution requires lineages. You cannot select for a trait if the entity bearing it does not persist long enough to be differentially reproduced. Biological organisms have clean lineages (mostly). Firms merge and split. Languages borrow grammar. "Demes" (local populations) have fuzzy borders. If the unit of selection lacks a coherent identity over time, the explanation is metaphorical, not mechanistic.

  **Downstream Impact:** Medium-High. This sets the boundary conditions for your "respectable" list. It tells organizational ecologists when "firm evolution" is a valid analogy and when it is poetry. It tells linguists whether "language selection" is a coherent concept.

  **Tractability (Theory-Only):** Medium. This is a metaphysical and logical problem. It requires defining "identity" in evolutionary terms without relying on biological essentialism.

  **Neglect:** Moderate. Biologists assume lineages exist. Social scientists assume they don't matter. Theorists need to define the minimum coherence required for a "unit" to be selectable.

  **Three-Year Milestone:** A "Minimum Viable Lineage" threshold. A theoretical definition of the persistence and fidelity required for a non-biological entity to count as an evolutionary unit.
  *   **Move Up:** If a fellow proves that fuzzy lineages (like languages) can be modeled as "process individuals" rather than "substance individuals," legitimizing the field of evolutionary linguistics.
  *   **Move Down:** If the threshold for lineage cleanliness is shown to be so high that almost no social units qualify, effectively banning evolutionary explanations from social science (a negative but useful result).

  ### Priority 4: The Adaptationist Restraint (Testability)
  **The Question:** *Does the debate have testable content at all once cross-level byproducts and soft selection are on the table?*

  **Why it is #4:** This is the quality control question. Non-biologists often use evolutionary language to imply that a current social trait exists *because* it was selected for a specific function (adaptationism). However, traits can be byproducts of selection at a lower level, or accidents of history. If every outcome can be explained as either a group adaptation or an individual byproduct with equal ease, the theory explains nothing.

  **Downstream Impact:** Medium. This does not stop social scientists from using evolutionary frameworks, but it stops them from making specific functional claims without evidence. It curbs "just-so stories" in psychology and economics.

  **Tractability (Theory-Only):** Low. Proving negative testability is hard. However, defining the *conditions* for testability is a conceptual task suitable for fellows.

  **Neglect:** Low. This is a classic critique (Gould and Lewontin), but it needs updating for multi-level contexts. It is lower priority because it constrains the *conclusions* of the other three questions, rather than defining the framework itself.

  **Three-Year Milestone:** A "Falsifiability Protocol." A set of logical requirements that an evolutionary explanation in social science must meet to be considered testable rather than tautological.
  *   **Move Up:** If a fellow demonstrates that multi-level models generate unique predictions that single-level models cannot, restoring testability.
  *   **Move Down:** If it is shown that cross-level byproducts make it impossible to distinguish selection from noise in observational social data, pushing the field toward experimental designs only.

  ### Summary of Strategy

  By funding these four questions in this order, you move from the **pragmatic** (can we intervene?) to the **structural** (how does transmission work?) to the **ontological** (do the units exist?) to the **epistemic** (can we test this?).

  1.  **Intervention:** Legitimizes the social scientist's authority to speak about groups.
  2.  **Grain:** Corrects the technical machinery they use to model change.
  3.  **Lineage:** Ensures the things they are studying are capable of evolving.
  4.  **Testability:** Prevents them from drifting into unfalsifiable storytelling.

  This portfolio avoids the "Gene vs. MLS" trap, which would consume funds in internal biological disputes. Instead, it builds a conceptual infrastructure that allows non-biologists to use evolutionary theory without committing biological fallacies. If successful, the output will not be new data, but a new set of rules for what counts as a valid argument in the social sciences.
