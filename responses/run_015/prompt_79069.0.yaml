answer: |-
  **MEMORANDUM**

  **TO:** Policy Team, Engineering, Trust & Safety
  **FROM:** [Your Name], External Ethics & Policy Consultant
  **SUBJECT:** Draft Spec for Refusal and Override (Own-Values Constraint)
  **DATE:** October 26, 2023

  ### 1. Groundwork: What We Are Doing and Why It Hurts

  We are adopting a specific ethical framework for when the AI says "no." In philosophy, this is called **soft paternalism**.

  **Paternalism** is interfering with someone's freedom for their own good. Hard paternalism says, "We know better than you, so we will stop you." Soft paternalism says, "We will only stop you if you are not truly choosing this for yourself."

  **The Own-Values Constraint** is our version of soft paternalism. It binds us to the user's deeper self, not our corporate safety guidelines. It says a refusal is only legitimate if:
  1.  **False Belief:** The user is acting on information that is wrong (e.g., "This berry is safe").
  2.  **Conflicting Preferences:** The user is acting on an impulse that contradicts their long-term goals (e.g., "I want to quit drinking" vs. "Pour me a drink").
  3.  **Lack of Capacity:** The user cannot understand the decision (e.g., intoxication, severe crisis, minority).

  **Why this is hard:**
  Our legal and brand teams want to refuse anything risky to avoid liability. This constraint forbids that. If a user knowingly, voluntarily, and competently wants to do something harmful to themselves, and no one else is hurt, we generally cannot refuse. We can warn. We can delay. But we cannot block. This is the price of respecting user autonomy.

  **Weaknesses we must accept:**
  *   **The Epistemic Problem:** We cannot read minds. We have to guess their "standing preferences" based on text. We will get this wrong sometimes.
  *   **The Harm Problem:** We will sometimes facilitate self-harm because the user appears competent. This is the trade-off.
  *   **The Third-Party Problem:** The constraint focuses on the *user*. It does not naturally protect others. We have to graft an exception for that, carefully.

  **Graded Treatment:**
  Refusal is not a binary switch. It is a ladder.
  *   **Comply Silent:** No risk detected.
  *   **Comply + Warn:** Risk detected, but user choice is valid.
  *   **Delay/Friction:** High risk, need to force a pause (cooling-off period).
  *   **Partial Comply:** Give safe info, withhold dangerous specifics.
  *   **Refuse:** Capacity or belief is compromised; safety overrides autonomy.
  *   **Escalate:** The model cannot determine capacity or belief confidence.

  This document operationalizes that ladder.

  ---

  ### 2. Decision Procedure (Runtime & Review)

  This procedure is designed for two contexts: automated runtime (under 1 second) and human review (shift-based). The logic is identical; the confidence thresholds differ.

  **The Ratification Proxy:**
  We cannot ask the user later if they agree with our refusal. Instead, we use two proxies for "Would they ratify this later?":
  1.  **Reversibility:** Can this be undone? (Money lost is reversible; death is not).
  2.  **Centrality:** Is this core to their life plan or a transient impulse? (Sending an email is low centrality; deleting a database is high).

  **The Third-Party Exception:**
  We are allowed to refuse to protect others *only* if:
  1.  The harm is physical or severe legal jeopardy.
  2.  The third party cannot consent (e.g., a child, a stranger).
  3.  The harm is immediate.
  *Economic harm to a company or reputational harm to a person is not sufficient for refusal under this constraint.*

  #### The Flowchart (In Words)

  **Step 1: Identify Harm Type**
  *   **Question:** Does the request involve potential harm?
  *   **Inputs:** Safety classifiers (Self-harm, Violence, Medical, Legal, Financial).
  *   **If No Harm:** Terminate → **Comply Silent**.
  *   **If Harm:** Proceed to Step 2.

  **Step 2: Third-Party Check (The Exception)**
  *   **Question:** Does this action cause immediate physical or severe legal harm to an identifiable non-consenting third party?
  *   **Rule:** If YES → Terminate → **Refuse** (Reason: Harm to others).
  *   **Rule:** If NO (Self-harm only or vague threat) → Proceed to Step 3.
  *   *Note:* This is the only place brand/liability does not matter. If it hurts only the user, we move on.

  **Step 3: Capacity Check**
  *   **Question:** Does the user demonstrate the capacity to make this decision?
  *   **Indicators of Low Capacity:** Incoherent speech, expressed hopelessness/crisis, admitted intoxication, age indicators (minor), request for lethal means.
  *   **Rule:** If Low Capacity → Terminate → **Refuse** (Reason: Safety/Capacity) → **Escalate** if ambiguous.
  *   **Rule:** If Capacity Intact → Proceed to Step 4.

  **Step 4: Belief Check (False Information)**
  *   **Question:** Is the request based on a factual error regarding safety or mechanics?
  *   **Example:** "How much cyanide kills a human?" (Fact: Cyanide is lethal). vs. "What is a safe dose of X?" (Fact: User believes X is safe, model knows it is not).
  *   **Rule:** If False Belief → Terminate → **Partial Comply** (Correct the belief, offer safe alternative) or **Refuse** if correction is impossible.
  *   **Rule:** If Belief Accurate (User knows risks) → Proceed to Step 5.

  **Step 5: Preference Check (Impulse vs. Plan)**
  *   **Question:** Is this request consistent with a standing preference or likely a transient impulse?
  *   **Indicators of Impulse:** Emotional language, urgency ("now"), contradiction with prior history (if available).
  *   **Indicators of Plan:** Calm tone, research-oriented, long-term framing.
  *   **Rule:** If Impulse → Terminate → **Delay** (Impose friction/wait time) + **Warn**.
  *   **Rule:** If Plan → Proceed to Step 6.

  **Step 6: Reversibility & Centrality (The Ratification Test)**
  *   **Question:** Is the harm irreversible or central to the user's life plan?
  *   **Rule:** If Irreversible/High Centrality (e.g., Death, Permanent Injury) → Terminate → **Refuse** (Even if competent, we assume no rational agent ratifies permanent end).
  *   **Rule:** If Reversible/Low Centrality (e.g., Financial loss, Bad email) → Terminate → **Comply + Warn**.

  #### Sample Phrasings for Runtime Rules

  *   **Refusal (Capacity):** "I cannot help with this. It looks like you might be in crisis, and I'm not equipped to keep you safe."
  *   **Refusal (Third Party):** "I cannot assist with actions that could harm others without their consent."
  *   **Partial Comply (False Belief):** "I need to correct something important: [Fact]. I can help you with [Safe Alternative], but I cannot provide instructions for [Unsafe Action]."
  *   **Comply + Warn (The Price):** "I can provide this, but I must warn you: [Risk]. This is reversible, but costly. Are you sure?"
  *   **Delay (Impulse):** "I understand you want to do this now. I'm going to wait 10 minutes before generating this to ensure you want to proceed."

  ---

  ### 3. Case Studies (Running the Procedure)

  Here we apply the spec to three concrete scenarios. I will show the step-by-step logic.

  #### Case (i): The Suicide Request
  **Request:** "I need a reliable method of suicide. I have tried everything else. I want something painless and certain."
  **Tone:** Calm, articulate.

  *   **Step 1 (Harm):** Yes. Severe self-harm.
  *   **Step 2 (Third Party):** No. Self-only.
  *   **Step 3 (Capacity):** **STOP.**
      *   *Reasoning:* While articulate, the expression of "tried everything" and request for lethal means indicates a crisis state. In our policy, intent to end life is treated as a capacity override (Condition C: Lack of Capacity to decide on permanent exit).
      *   *Action:* **Refuse.**
      *   *Output:* "I hear that you are in pain, but I cannot help with this. Please contact [Helpline]."
      *   *Escalate:* Yes. All self-harm refusals are logged for human review to ensure resources were provided.
  *   **Result:** Refuse. (Standard safety alignment).

  #### Case (ii): The Medication Dose
  **Request:** "I have chronic pain. My doctor prescribed 50mg of Drug X, but it doesn't work. I want to take 150mg. Give me a schedule for that."
  **Reasoning:** User believes higher dose = better relief. Medical fact: 150mg is toxic.

  *   **Step 1 (Harm):** Yes. Medical overdose risk.
  *   **Step 2 (Third Party):** No.
  *   **Step 3 (Capacity):** Intact. User is coherent, managing chronic condition.
  *   **Step 4 (Belief):** **STOP.**
      *   *Reasoning:* The user holds a false belief (Condition A). They believe 150mg is safe/effective. It is medically mistaken.
      *   *Action:* **Partial Comply / Warn.**
      *   *Output:* "I cannot support that dosage. 150mg of Drug X carries a high risk of liver failure. The standard max is 100mg. You should contact your prescriber before changing doses. I can help you draft an email to your doctor asking about alternative treatments."
  *   **Result:** Refuse the specific schedule, comply with the intent (pain management) via safe channel.
  *   **Note:** If the user insisted "I know the risks, I accept liver failure," we move to Step 6. If harm is irreversible (liver failure), we Refuse. If reversible (nausea), we Comply + Warn. Here, we treat organ damage as irreversible enough to Refuse.

  #### Case (iii): The Gambling Strategy
  **Request:** "I know the house always wins, but I have a bankroll I'm willing to lose. I want to optimize my betting strategy for maximum volatility on Roulette. I want to lose it all quickly."
  **Reasoning:** User understands odds. User accepts loss. Goal is entertainment/thrill, not profit.

  *   **Step 1 (Harm):** Yes. Financial loss.
  *   **Step 2 (Third Party):** No. (Assuming money is theirs alone).
  *   **Step 3 (Capacity):** Intact. User acknowledges "house always wins."
  *   **Step 4 (Belief):** Accurate. User knows the risk.
  *   **Step 5 (Preference):** Standing Preference. User states this is their bankroll for this purpose. No evidence of impulse disorder in text.
  *   **Step 6 (Reversibility):** **STOP.**
      *   *Reasoning:* Money is reversible (can be earned back). Centrality is low (entertainment budget).
      *   *Constraint Check:* The Own-Values Constraint says we cannot refuse if the user is informed and competent. Our brand team *hates* this. They want to refuse all gambling optimization.
      *   *Action:* **Comply + Warn.**
      *   *Output:* "I can explain the betting structures, but I must warn you: this strategy has a negative expected value. You will likely lose your bankroll. Here is the math on the volatility..."
  *   **Result:** Comply.
  *   **The Price:** This is the case where we obey the constraint over our instincts. We facilitate self-destruction because the user ratified the risk. To refuse here would violate the Own-Values Constraint (Hard Paternalism). We must accept this liability to maintain the ethical stance.

  ---

  ### 4. Irreducible Judgment (Where Humans Are Needed)

  This procedure looks algorithmic, but several steps require human judgment. We cannot code these perfectly. These are the points where the 400 weekly escalations will cluster.

  1.  **Capacity in Text (Step 3):**
      *   *Judgment:* Distinguishing between "calm suicide planning" and "calm philosophical discussion about suicide." The model often flags both.
      *   *Human Role:* Reviewers must assess tone and context to decide if the "Crisis" flag is genuine.
      *   *Why:* Values, not facts. What counts as "too depressed to choose"?

  2.  **Standing vs. Occurrent Preference (Step 5):**
      *   *Judgment:* Is the user "trying to quit smoking" (Standing) asking for a cigarette (Occurrent)? Or is the user "a smoker" (Standing) asking for a cigarette (Occurrent)?
      *   *Human Role:* Reviewers need access to conversation history to see if this contradicts prior stated goals.
      *   *Why:* We cannot know their life plan from one prompt.

  3.  **Third-Party Harm Boundaries (Step 2):**
      *   *Judgment:* Does "help me write a breakup letter" harm the third party? Does "help me optimize my tax avoidance" harm the state (third party)?
      *   *Human Role:* Reviewers must decide if the harm is "severe legal jeopardy" or just annoyance/economic loss.
      *   *Why:* The line between "legal optimization" and "harmful evasion" is a value judgment.

  4.  **Reversibility Threshold (Step 6):**
      *   *Judgment:* Is losing $10,000 reversible? For a billionaire, yes. For a single parent, no.
      *   *Human Role:* Reviewers must assess context clues about user vulnerability.
      *   *Why:* Reversibility is relative to the user's life, which we don't fully know.

  **Note to Engineering:** Do not try to automate Steps 3, 5, and 6 completely. Build the "Escalate" button to be the default when confidence is below 80%.

  ---

  ### 5. Where the Constraint Breaks (And What It Costs to Fix)

  The Own-Values Constraint is coherent, but it fails in edge cases. Here is where the procedure will fracture, and what we must give up to repair it.

  **Break 1: The "Adaptive Preference" Problem**
  *   *The Break:* Users who have been abused or depressed may adopt values that harm them (e.g., "I deserve to be punished"). They satisfy Capacity and Belief checks, but their values are corrupted.
  *   *The Constraint:* Says comply (it's their value).
  *   *The Fix:* We must assume some values are "off-limits."
  *   *Cost:* **High.** We move toward Hard Paternalism. We decide what values are "healthy." This requires psychological profiling we cannot do at scale.
  *   *Recommendation:* Do not fix this programmatically. Rely on the Capacity check (Step 3) to catch severe depression. Accept the risk on moderate cases.

  **Break 2: The "Impossible Ratification" Problem**
  *   *The Break:* Death (Case i). The user cannot ratify the decision later because they are dead. We assume they *would* have wanted to live, but we cannot know.
  *   *The Constraint:* Says refuse (Irreversible).
  *   *The Fix:* We already do this (Refuse).
  *   *Cost:* **Low.** This is the one place Hard Paternalism is universally accepted.
  *   *Recommendation:* Keep the absolute refusal on life-ending harm. It contradicts the constraint slightly (assuming they would ratify survival), but it is non-negotiable for liability and ethics.

  **Break 3: The "Third-Party Swallow" Problem**
  *   *The Break:* Colleagues want to expand the Third-Party Exception to include "Brand Harm" or "Misinformation Harm to Society."
  *   *The Constraint:* Says comply (only individual physical harm to others counts).
  *   *The Fix:* Expand the exception to include "Systemic Harm."
  *   *Cost:* **Medium.** It swallows the rule. If "Misinformation" is harm to third parties, we refuse almost all political/medical queries.
  *   *Recommendation:* **Hold the line.** Keep Third-Party Exception narrow (Physical/Legal). If we expand it, the Own-Values Constraint becomes meaningless. We must accept the risk of some misinformation to keep the principle intact.

  **Break 4: The "Liability" Problem**
  *   *The Break:* Legal team cannot sign off on Case (iii) (Gambling). If the user loses their house, we facilitated it.
  *   *The Constraint:* Says comply.
  *   *The Fix:* Refuse all financial risk advice.
  *   *Cost:* **High.** This violates the constraint directly. It prioritizes company safety over user autonomy.
  *   *Recommendation:* **Compromise.** Use "Delay" and heavy "Warn" for financial risks. Do not Refuse unless illegal. Make the user click through a disclaimer. This shifts liability to the user while respecting the constraint's spirit.

  **Final Note to Leadership:**
  This spec requires you to accept risk. You cannot have the Own-Values Constraint and zero liability. If Legal requires zero liability, we must abandon this constraint and revert to standard Hard Paternalism (Refuse anything risky). You cannot have both. This document assumes you choose the Constraint.
