          *   **Observers (3 students):** Tasked with tracking specific linguistic/procedural moves.
      *   *Scoring:* Architects get points if Councilors choose the target outcome *and* Observers confirm no facts were hidden. Councilors get points if they identify the framing attempt *during* the debrief.

