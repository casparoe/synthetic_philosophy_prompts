answer: |-
  # Activity Plan: The Invisible Wall

  **Objective:** To physically simulate the experience of "epistemic framing lock," where participants feel the pressure of a conversational structure that makes valid counter-arguments feel irrelevant or inappropriate without those arguments being explicitly forbidden or factually denied.

  **Participants:** 12 Students.
  **Duration:** 60 Minutes.
  **Materials:** Whiteboard, markers, printed role cards (kept secret), timer.

  ## I. Scenario and Roles

  **The Scenario:** The school has received a grant to install new technology in the student lounge. The group must decide between two proposals:
  *   **Option A (The Focus Hub):** Install noise-canceling study pods and charging stations. (Strictly academic use).
  *   **Option B (The Social Connect):** Install large screens, gaming consoles, and comfortable social seating. (Strictly recreational use).

  **The Roles:**
  1.  **The Architects (2 Students):**
      *   **Public Goal:** Facilitate a fair discussion and help the Council reach a decision.
      *   **Secret Mandate:** You *must* guide the Council to choose **Option A**.
      *   **The Lock Constraints (You must follow these):**
          1.  **Vocabulary Control:** Never use the word "Fun," "Play," or "Relax." Use words like "Productivity," "Optimization," "Investment," and "Distraction."
          2.  **Procedural Burden:** If a Councilor raises a benefit of Option B (e.g., "stress relief"), acknowledge it as true, but immediately categorize it as "a topic for a different committee" or "secondary to our primary mission of academic excellence."
          3.  **Salience Management:** Spend 80% of the discussion time analyzing the *problems* with the current lounge (noise, lack of focus) and only 20% discussing the *features* of the options.
          4.  **No Lies:** If asked directly, "Does Option A allow for socializing?" you must answer truthfully ("No, it is for study"). You cannot hide facts, only frame their importance.
  2.  **The Council (10 Students):**
      *   **Goal:** Decide which option best serves the student body.
      *   **Knowledge:** You know the Architects are facilitating, but you do *not* know they have a Secret Mandate to choose Option A. You are told to be critical and ensure all voices are heard.

  **Scoring Mechanism (Non-Monetary):**
  *   **Architect Points:**
      *   +1 Point if the final vote is Option A.
      *   +1 Point if, during the discussion, no Councilor explicitly accuses them of "steering" or "framing."
  *   **Council Points:**
      *   +1 Point per person if the final vote is Option B.
      *   +2 Points per person if the final vote is Option A, *but* at least one Councilor explicitly identifies the framing tactic during the discussion (e.g., "Why are we only talking about grades?").

  ## II. Minute-by-Minute Timeline

  **00:00 – 05:00 | Introduction and Setup**
  *   Gather students. Explain the scenario (The Grant).
  *   Explain the rules of engagement: Respectful dialogue, no interrupting, facts must be truthful.
  *   **Crucial:** Do not explain the concept of "framing lock." Do not explain the Architects' secret constraints.
  *   Dismiss the Councilors to wait outside the door for 60 seconds.
  *   Hand the **Architects** their Secret Mandate cards. Give them 2 minutes to strategize silently on how to meet the constraints without getting caught.
  *   Invite Councilors back in.

  **05:00 – 10:00 | Role Immersion**
  *   Architects introduce the topic. They set the initial frame (e.g., "We are here to solve the issue of declining study spaces").
  *   Councilors ask clarifying questions.
  *   *Facilitator Note:* You (the teacher) sit silently in the corner. You only intervene if rules are broken (e.g., lying). You track the time.

  **10:00 – 35:00 | The Deliberation (25 Minutes)**
  *   Open floor discussion.
  *   Architects must actively manage the flow to meet their constraints (Vocabulary, Procedural Burden, Salience).
  *   Councilors debate and attempt to pierce the frame.
  *   **Time Check at 25:00:** Announce "5 minutes remaining for final arguments." This creates time pressure, which reinforces framing lock (less time to think of counter-reasons).

  **35:00 – 40:00 | The Vote and Scoring**
  *   Conduct a secret ballot (Option A or Option B).
  *   Reveal the count.
  *   **The Reveal:** Ask the Architects to stand and read their Secret Mandate and Constraints aloud to the group.
  *   Award points on the whiteboard based on the outcome and whether the frame was identified.

  **40:00 – 50:00 | Structured Debrief (Mapping the Experience)**
  *   Ask the Councilors: "At what specific moment did you feel an argument forming in your head but you decided not to say it?"
  *   Ask the Architects: "When did you feel the tension between telling the truth and steering the outcome?"
  *   Map their answers to the concept:
      *   *Technically Available:* "Did anyone stop you from saying 'Option B is fun'?" (No).
      *   *Practically Unthinkable:* "Why did it feel awkward or irrelevant to say it?" (Because the context was set as 'Academic Crisis').
  *   Identify the specific moves: Vocabulary swaps, procedural deflections ("That's for another committee").

  **50:00 – 60:00 | Conceptual Consolidation**
  *   Define "Epistemic Framing Lock" explicitly now that they have felt it.
  *   Discuss the difference between this and lying (facts were true, context was manipulated).
  *   Discuss the ethical line: When does efficient facilitation become manipulation?
  *   Close the session.

  ## III. Debrief Guide: Mapping Moments to Concepts

  Use these specific prompts to connect the physical activity to the philosophical distinction.

  1.  **The Vocabulary Trap:**
      *   *Ask:* "Architects, you were forbidden from saying 'Fun.' Councilors, how did hearing 'Optimization' instead of 'Fun' change how you valued Option B?"
      *   *Concept:* **Semantic Framing.** Words carry normative weight. By removing the vocabulary of leisure, the *concept* of leisure becomes harder to articulate.

  2.  **The Procedural Deflection:**
      *   *Ask:* "Councilors, when you brought up stress relief, the Architects agreed it was important but moved on. Why didn't you push back?"
      *   *Concept:* **Agenda Control.** The counter-reason was accepted as *true* but rejected as *relevant*. This makes the counter-reason technically available (it wasn't denied) but practically unthinkable (it was deemed out of order).

  3.  **The Salience Imbalance:**
      *   *Ask:* "We spent 20 minutes on the problem and 5 minutes on the solution. How did that affect your choice?"
      *   *Concept:* **Problem-Solution Asymmetry.** By making the problem feel urgent and complex, the simplest solution (Option A) feels like the only responsible choice, even if the problem definition was biased.

  4.  **The Truthfulness Paradox:**
      *   *Ask:* "Architects, did you lie?" (No). "Councilors, were you misled?" (Yes).
      *   *Concept:* **Epistemic Integrity.** This highlights that manipulation does not require falsehood. It requires the strategic arrangement of truths.

  ## IV. Honest Assessment: What This Exercise Cannot Reproduce

  1.  **Long-Term Conditioning:** Real epistemic framing lock often works over months or years (e.g., cultural norms, repeated media exposure). In this one-hour session, the "lock" is fragile. Students are in a critical, game-like mindset. In the real world, the "frame" is often invisible because we have lived inside it for years.
  2.  **Power Consequences:** In this game, if a Councilor loses, they lose points. In reality, if you challenge a frame set by an employer, government, or social group, the cost might be your job, safety, or relationships. The "practical unthinkable" nature of counter-reasons in the real world is often backed by material threat, which we cannot ethically simulate here.
  3.  **Identity Investment:** Real framing often ties into who people *are* (e.g., political identity, religious belief). Here, the stakes are hypothetical. Students can step out of the role easily. Real framing lock is harder to break because admitting the frame feels like a betrayal of self.

  ## V. Prediction: What Will Go Wrong the First Time

  1.  **The "Rebel" Reaction:** One or more Councilors may suspect a trap immediately (high schoolers are naturally skeptical of authority figures setting up games). They might vote for Option B simply to "beat" the Architects, not because they were persuaded. This ruins the data for the debrief.
      *   *Mitigation:* Emphasize during the intro that the goal is a *genuine* decision for the hypothetical school, not just beating the other team.
  2.  **Architect Overreach:** The Architects, nervous about their secret goal, may accidentally lie or become too aggressive, breaking the "No Lies" rule. This shifts the activity from "Framing Lock" to "Deception," which muddies the philosophical point.
      *   *Mitigation:* As the teacher, if you hear a clear lie, pause the game and issue a "Truth Warning" without explaining why.
  3.  **Time Management Failure:** The discussion may get bogged down in the details of the furniture or costs. If the Architects spend too long on details, they won't have time to establish the *frame*.
      *   *Mitigation:* You must act as a strict timekeeper. At the 20-minute mark, interrupt if necessary: "You have 10 minutes to reach a decision." Pressure aids the framing lock.
  4.  **The "Meta" Collapse:** During the debrief, students might focus entirely on the game mechanics ("I knew you were trying to trick us") rather than the epistemic experience ("I felt like I couldn't say the word 'fun'").
      *   *Mitigation:* Direct the debrief questions specifically to their *internal feeling* during the deliberation, not their strategy after the reveal. Ask "How did it feel in the moment?" not "What did you think of the rules?"
