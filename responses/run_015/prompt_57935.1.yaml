answer: |-
  Municipal artifacts are inherently political because their material configurations distribute access and capability unevenly, regardless of intent. In Courtyard A, the housing authority installs parcel lockers with interfaces that authenticate users exclusively via NFC smartphone taps or QR code scans to minimize mechanical maintenance and align with digital logistics platforms. This configuration successfully secures packages and reduces courier dwell time by automating the handoff, operating under the assumption that all residents possess compatible mobile devices.

  In Courtyard B, the authority installs identical locker bodies but specifies terminals equipped with ruggedized physical keypads alongside the digital scanners to ensure authentication redundancy. This configuration successfully secures packages and reduces courier dwell time by automating the handoff, accommodating residents who receive codes via physical mail slips instead of mobile notifications.

  The divergence between the view that design enacts power and the view that technology is neutral emerges here because the former identifies the NFC-only interface as an active barrier that sorts citizens by technological capacity, while the latter identifies the barrier as the tenant's lack of a phone rather than the machine's lack of a keypad. The specific design feature doing the work is the absence of the physical keypad; if this feature is removed by retrofitting Courtyard A with keypads, the systematic exclusion vanishes, collapsing the immediate political conflict even if the theoretical disagreement persists regarding whether the keypad grants power or merely function. A defender of neutrality would argue that the locker merely processes valid inputs and cannot be blamed for socioeconomic disparities in phone ownership, asserting that the political failure lies in the procurement policy rather than the circuitry itself.
