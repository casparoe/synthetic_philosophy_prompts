answer: |-
  Here is a set of ten interview questions tailored for your podcast. They are designed to move from the historical context of the critique into the technical philosophy, and finally into the practical implications for science.

  I have included bracketed notes **[like this]** to help you understand the strategy behind each question, including the "likely answer" the philosopher will give so you know why the follow-up is phrased the way it is.

  ### The Interview Questions

  **1. The Legacy of the Spandrels Paper**
  "Gould and Lewontin's 1979 paper is over forty years old now, yet it remains one of the most cited works in evolutionary biology. When you defend the 'spandrels' critique today, are you defending the specific examples they gave back then, or are you defending a broader methodological warning that is still being ignored by researchers?"
  **[Intent:** This opens the interview by acknowledging the paper's age while asking if the *principle* is still relevant. It lets your guest set the stage.]

  **2. Distinguishing Adaptation, Byproduct, and Exaptation**
  "A core part of this debate relies on precise definitions. Could you walk us through the technical distinction between a trait that is an **adaptation**, one that is a **byproduct** (or spandrel), and one that is an **exaptation**? More importantly, why does drawing that line matter for the actual practice of biology, rather than just for philosophical classification?"
  **[Intent:** This covers your first requirement. It asks for definitions but pushes immediately to *why* it matters practically.]

  **3. Follow-up to Question 2**
  *[Likely Answer: She will likely argue that misclassifying a byproduct as an adaptation leads to false 'just-so stories' and wastes research funding on functions that don't exist.]*
  "If the main risk is inventing functions that aren't there, is there a reciprocal risk? If researchers become too worried about calling something a spandrel, could we end up overlooking real adaptive functions just to be safe?"
  **[Intent:** This challenges the guest to consider if the critique can go too far and stifle discovery.]

  **4. Defining the Panglossian Paradigm**
  "Gould and Lewontin accuse adaptationists of falling into a 'Panglossian paradigm,' referencing Voltaire's character who believed we live in the 'best of all possible worlds.' When you use this term, are you criticizing the claim that every trait is an adaptation, or the stronger claim that every trait is *optimally* designed for a specific function?"
  **[Intent:** This covers your second requirement. It forces a distinction between 'useful' and 'perfect,' which is a key nuance in the debate.]

  **5. Follow-up to Question 4**
  *[Likely Answer: She will likely clarify that the target is the assumption of optimal design and the neglect of constraints, not necessarily that every trait is useful.]*
  "Many modern evolutionary biologists might agree with you that 'optimal design' is a bad assumption. Do you think the 'Panglossian' label still fits the field today, or has your side of the argument already won to the point where the critique is now attacking a strawman?"
  **[Intent:** This asks whether the critique is still fighting a live enemy or a defeated one.]

  **6. A Concrete Biological Case**
  "Let's ground this in a specific example. Consider **feathers**. They are used for flight now, but evidence suggests they originally evolved for thermoregulation or display. In a case like this, where a trait's current use differs from its origin, how do we decide if it should be classified as an adaptation for flight or an exaptation?"
  **[Intent:** This covers your third requirement. Feathers are a classic example of exaptation that allows for a clear discussion.]

  **7. Follow-up to Question 6**
  *[Likely Answer: She will likely say it is empirically difficult to distinguish and requires fossil evidence or comparative phylogenetics.]*
  "Since the fossil record is often incomplete, where should the **burden of proof** lie? If we can't prove a trait was selected for, should we default to assuming it's a spandrel, or default to assuming it's an adaptation until proven otherwise?"
  **[Intent:** This moves from the specific biology to the rules of scientific evidence and logic.]

  **8. Evolutionary Psychology and Human Traits**
  "The spandrels critique is often weaponized against evolutionary psychology, specifically regarding human behaviors. If a philosopher argues that a human behavior (like religious belief or language) is a byproduct of a larger brain rather than an adaptation, does that diminish the trait's importance, or does it change how we study it?"
  **[Intent:** This applies the philosophy to human beings, which is usually engaging for a podcast audience.]

  **9. Heuristics and Research Programs**
  "Critics of Gould and Lewontin sometimes argue that assuming adaptation is a necessary 'heuristic'—a starting point that generates testable hypotheses, even if it turns out to be wrong later. Do you view the adaptationist assumption as a useful tool that went bad, or is it fundamentally misleading from the start?"
  **[Intent:** This addresses the utility of the opposing view. It shows you understand that adaptationism isn't just 'stupid,' but a research strategy.]

  **10. Falsifiability and Counterevidence**
  "To close, I want to ask about the status of the spandrels critique itself. Scientific claims need to be testable. What kind of empirical evidence or biological discovery would count **against** the spandrels critique? If we found that almost every trait *was* optimally designed, would that falsify your position, or is the critique insulated from refutation?"
  **[Intent:** This covers your closing requirement. It asks the hard question about whether the spandrel theory is itself scientific or just a philosophical stance.]
