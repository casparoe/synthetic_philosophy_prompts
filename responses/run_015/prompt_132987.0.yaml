  ## Indistinguishable Leaf Pairs

  **Flagged Pair:** Leaf 1 (Toponymic Removal/Central) and Leaf 3 (Sculptural Removal/Central).
  **Reason for Indistinguishability:** While the *logic* differs (navigational disruption vs. aesthetic loss), the *functional outcome* is identical: the marker is eliminated from the public sphere. The distinction between "infrastructure" and "honorific" collapses when both are subjected to erasure, as neither continues to function in its original capacity.

  **Flagged Pair:** Leaf 2 (Toponymic Removal/Peripheral) and Leaf 4 (Sculptural Removal/Peripheral).
  **Reason for Indistinguishability:** Similarly, when the decision is removal for peripheral wrongs, the practical difference between changing a sign and melting a statue is one of degree (cost/logistics) rather than kind (public presence). Both treat the marker as contingent on moral purity rather than function or art.

  ---

  ## Diagnosis of Unoccupied Combination

  **Unoccupied Combination:** A stance that demands **immediate removal of street names for peripheral wrongs** (Leaf 2 logic) while insisting on **unconditional retention of statues for central wrongs** (Excluded/Incoherent logic).

  **Diagnosis:** This combination is unstable because it inverts the asymmetry between navigational utility and explicit honorific intent.
  1.  **Street Names (Peripheral):** Demanding removal here implies that *any* moral taint, even if unrelated to the figure's contribution, disqualifies them from serving as navigational infrastructure. This sets a high bar for moral purity for functional objects.
  2.  **Statues (Central):** Insisting on retention here implies that *explicit honorifics* celebrating a harm-tainted achievement should remain untouched. This sets a low bar for moral purity for objects designed specifically to venerate.
  3.  **The Asymmetry:** It is logically inconsistent to argue that a functional label (street name) requires higher moral purity than a dedicated monument (statue). Usually, proponents argue the opposite: statues are more offensive (high honor) and thus should go first, while street names are pragmatic (low honor) and can stay. This unoccupied combination argues the reverse without a coherent justification for why functional utility is more morally fragile than artistic veneration.
