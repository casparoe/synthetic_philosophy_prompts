answer: |-
  # Diagnostic Taxonomy for Municipal Ethics Committee

  ## Decision Tree Structure

  **Node 1 (Marker Type):** Is the primary function of the marker to serve as navigational infrastructure (e.g., street name, building designation) or as a dedicated aesthetic honorific (e.g., statue, bust in a square)?
  *   **A:** Navigational Infrastructure (Toponym)
  *   **B:** Aesthetic Honorific (Sculpture)

  **Node 2 (Centrality of Wrong):** Is the condemned conduct or view inseparable from the specific achievement for which the figure was originally commemorated (i.e., would the achievement exist without the harm)?
  *   **Yes:** Central/Inseparable
  *   **No:** Peripheral/Unrelated

  **Node 3 (Efficacy of Context):** Can the dignitary harm to affected citizens be adequately remedied by adding contextual information (plaques, counter-monuments) without physically removing or renaming the marker?
  *   **No:** Harm Distinctive (Removal Required)
  *   **Yes:** Harm Remediable (Retention Possible)

  **Node 4 (Temporal Weighting):** In cases where retention is physically possible, does the committee prioritize preventing present-day symbolic exclusion over maintaining future historical and navigational continuity?
  *   **Yes:** Present Exclusion Priority (Aggressive Context)
  *   **No:** Future Continuity Priority (Minimal Context)

  *(Note: For branches where Node 3 is "No," Node 4 is logically moot as removal precludes continuity concerns; these paths converge to a single outcome leaf.)*

