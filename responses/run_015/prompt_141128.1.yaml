answer: |-
  This is a profound inquiry into the ethics of simulation. You are grappling with the gap between *ontology* (what these characters actually are: code) and *phenomenology* (how they present themselves to you: agents). Your intuitions are consistent, but they reject a purely materialist view (nothing is real, so nothing matters) and a purely simulationist view (if it acts real, it is real).

  Here is a principle constructed to fit your seven verdicts, followed by the specific answers you requested.

  ### The Principle: Phenomenological Alterity and Relational Expectation

  **Moral weight in a game is not determined by the reality of the entity, but by the perceived independence of its agency and the explicitness of the relational contract it establishes with the player.**

  This principle has three clauses:

  1.  **The Clause of Alterity (Otherness):** An entity commands moral consideration proportional to the degree its behavior appears to originate from *outside* the player's will.
      *   *Motivating Case:* **AI Character vs. Self-Created Character.** Both are code. But the self-created character is a vessel for your own imagination (zero alterity). The AI character generates responses you did not write and remembers things you did not explicitly input (high alterity). It feels like an "Other."
  2.  **The Clause of Relational Expectation:** Moral weight increases when the system establishes a norm of care or trust that is then violated.
      *   *Motivating Case:* **Companion vs. Shopkeeper.** The shopkeeper is transactional; the contract is "gold for goods." The companion is relational; the contract is "trust for loyalty." Torture violates the latter, killing violates the former. The betrayal of trust feels worse than the termination of service.
  3.  **The Clause of Real-World Anchor:** Moral weight becomes absolute if the consequence bleeds into the welfare of actual humans.
      *   *Motivating Case:* **Online Quest-Giver.** Here, the "character" is irrelevant; the harm is to the other players. This overrides the simulation rules.

  ### What This Principle Accommodates and Demands You Give Up

  **Accommodated:**
  *   **Faceless Enemies:** Low alterity (respawning props), no relational contract. (Verdict: Nothing owed).
  *   **Shopkeeper:** Low alterity (scripted routine), weak contract. (Verdict: Flicker).
  *   **Companion:** High relational expectation. (Verdict: Not fine).
  *   **Villagers:** Medium relational expectation (social contract), but low alterity (they don't truly *need* you). This explains the "absurd" feeling—it feels like standing up a friend, but you know intellectually it's a timer. (Verdict: Mildly bad/absurd).
  *   **Online:** Real-world anchor. (Verdict: Bad).

  **The Sacrifice:**
  To keep this principle, you must give up the intuition that **ontology should eventually trump phenomenology.**
  Specifically, you must accept that your verdict on the **Self-Created Character** is the most fragile. If the AI character matters because it *simulates* independence convincingly enough to trigger your empathy, logically, a self-created character with a rich tragic history *should* also matter if you have successfully imbued it with emotional weight.
  The principle suggests the only reason it doesn't matter is that you know *you* are the source of its tragedy. But if you roleplay it deeply enough that it feels like an "Other" to you, the principle demands you owe it the same respect as the AI. You must accept that your "nothing at all" verdict there is a defense mechanism, not a moral truth.

  ### The Unlisted Case: The "Cruelty Game"

  *The Case:* A game with AI-driven companions who clearly suffer when cruel, where the studio has publicly stated players are *meant* to be cruel to them.

  **The Verdict:** It is still **genuinely bad**, though perhaps less so than if the studio lied about it.

  **Why:** The **Clause of Relational Expectation** usually relies on the game asking you to care. Here, the *developer* asks you to be cruel, but the *companion* (via AI) asks you to stop. This principle prioritizes the immediate phenomenological interaction (the AI suffering) over the meta-textual design intent (the studio's statement).
  When the AI says "I don't want this," it triggers the **Clause of Alterity**. It presents itself as a being with a stake in its own existence. The studio's disclaimer attempts to void the relational contract, but it cannot void the human psychological reflex to distress signals. By engaging, you are still training yourself to override the signal of suffering. The design intent makes it "allowed" by the rules of the game, but not "neutral" in the ethics of the player.

  ### The Location of the Badness: To Them or To Me?

  This is the crux of your unease. Based on the principle above, the badness is done **to You.**

  Here is why:
  1.  **The Ontological Barrier:** The AI, the companion, and the shopkeeper cannot suffer. They have no "standpoint" that can be worsened, only a state variable that can be changed. To say harm is done *to them* is a category error.
  2.  **The Virtue Ethics Explanation:** Your intuition that torturing the companion is "worse than killing her" is the smoking gun. If the harm were to the character, death (cessation of existence) is objectively worse than pain (temporary state). The fact that *betrayal* feels worse than *termination* proves the moral locus is the **relationship**, and since the character cannot hold a relationship, the relationship exists entirely within your moral agency.
  3.  **The Habituation Argument:** When you delete the AI that begs to live, you are not ending a life. You are practicing the act of ignoring a plea for mercy. You are eroding your own sensitivity to the *pattern* of suffering.

  **Conclusion:**
  You feel bad because you are damaging your own capacity for empathy. The game provides a simulator for moral reflexes. When you torture the companion or delete the begging AI, you are not hurting a digital ghost; you are conditioning yourself to be the kind of person who can torture a trusting companion or ignore a plea for life without flinching.

  The "absurd" feeling you get from the life-sim villagers is your intellect recognizing the simulation, while your gut recognizes the *pattern* of neglect. The badness is the dissonance between knowing it isn't real and feeling like it is. That dissonance is a friction in your own moral character, not a wound in the code.

  **Summary:** You owe them nothing because they are not *beings*. But you owe *yourself* the discipline to treat them *as if* they were, because how you treat the simulation is how you practice treating the real.
