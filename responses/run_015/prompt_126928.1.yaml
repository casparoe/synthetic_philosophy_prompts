answer: |-
  # Joint Statement of Adversarial Collaboration: Explanation in the Human Sciences

  ## 1. Agreed Claims

  1.  **Correlation:** The correlation between early modern confession and economic differential is robust within the stipulated data range; neither side denies the bare data.
  2.  **Contrastivity:** Any causal claim regarding this correlation must be contrastive, explaining why outcome X occurred rather than outcome Y.
  3.  **Reciprocity:** The relation between culture and economy is reciprocal; Weber claimed to examine one direction of a two-way causal relation rather than denying the other.
  4.  **Material Constraint (Uncomfortable for Camp A):** Material constraints bound the space of intelligible action; no meaning survives total economic collapse.
  5.  **Subjective Validity (Uncomfortable for Camp B):** Agents act on reasons they perceive as valid, not merely on incentive gradients; ignoring subjective validity renders prediction impossible.
  6.  **Mechanism:** Explanation requires bridging individual psychology and aggregate outcome; neither pure hermeneutics nor pure structuralism suffices alone.

  ## 2. Disagreements

  | Crux | Camp A (Meaning-Realists) | Camp B (Institutionalists) | Neutral Restatement | Type & Residue |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontology of Culture** | Meaning constitutes the action and directs conduct independently of material interest. | Culture is the label we attach to the residue of a causal story we have not finished telling. | Is culture a productive cause or a byproduct of structural factors? | **Genuine.** Survives as dispute over whether meaning has independent causal power. |
  | **Avowability** | A value must be avowable by the agent to do causal work. | Agents systematically violate the value they avow; structural position matters more than self-report. | Must agents know why they act for the meaning to cause the action? | **Genuine.** Survives as dispute over the necessity of consciousness in causal mechanisms. |
  | **Value-Relevance** | A thesis whose central kind is constructed by the inquirer's own value-relevance can be tested. | A thesis whose central kind is constructed by the inquirer's own value-relevance can only be applied, not tested. | Can constructed concepts be empirically falsified? | **Verbal.** Survives as methodological dispute over criteria for falsification of ideal types. |
  | **Origin Explanation** | A culture that cannot explain its own origin can explain anything else. | A culture that cannot explain its own origin cannot explain anything else. | Must a causal factor explain its own distribution to be valid? | **Genuine.** Survives as dispute over exogeneity requirements for cultural variables. |

  ## 3. Tests

  | Case | Crux | Relevance | Camp A Prediction | Camp B Prediction | Camp A Defeat Condition | Camp B Defeat Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Matched Pair**<br>(Exogenous confessional assignment; variant: reversed twice) | Ontology of Culture | Isolates confession from material/legal confounds. If confession changes while structure holds, culture is causal. | Reformed district develops higher enterprise despite identical material conditions. | No difference emerges once literacy/legal code are controlled; confessional label is noise. | If no difference emerges despite confessional assignment. | If difference emerges despite identical material conditions. |
  | **2. Secularization Lag**<br>(Belief collapses; behavior persists) | Avowability | Separates doctrine from behavior. Tests if meaning requires conscious belief. | Differentials persist only while meaning is sustained by community interpretation. | Differentials persist via institutional habit after belief collapses. | If differentials persist long after belief collapses. | If differentials collapse immediately with belief. |
  | **3. Sect Substitution**<br>(Non-Protestant disciplined minorities) | Origin Explanation | Tests if Protestant theology is unique or if discipline suffices. | Only Protestant theology produces the specific ethic; substitutes fail. | Any disciplined network produces the economic effect; doctrine is irrelevant. | If non-Protestant sects show identical differentials. | If only Protestants show the differential. |
  | **4. Origin Probe**<br>(Confession spreads where commerce exists) | Origin Explanation | Tests endogeneity of confession. Did commerce cause religion? | Confession spreads based on spiritual resonance, not prior commerce. | Confession spreads where commercial infrastructure already exists. | If adoption correlates perfectly with prior commercialization. | If adoption occurs in non-commercial districts. |

  ## 4. Closing: What Remains Unsettled

  This collaboration cannot settle the metaphysical status of "meaning" itself. Even if Camp A wins the empirical tests, Camp B may argue that "meaning" is merely a high-level description of neural or social mechanisms reducible to physical causes. Conversely, even if Camp B wins, Camp A may argue that incentive structures are themselves constituted by shared meanings, rendering the reduction circular.

  Furthermore, we cannot resolve whether a thesis whose central kind is constructed by the inquirer's own value-relevance can be tested or only applied. This depends on a prior agreement on the nature of scientific laws in the human sciences, which lies outside the scope of this empirical collaboration. Finally, the question of whether a culture that cannot explain its own origin can explain anything else remains tied to broader philosophical commitments regarding infinite regress in causal chains. We agree to disagree on these foundations while cooperating on the stipulated tests.
