answer: |-
  **Republic of Aequitas**

  **Introduction**
  Welcome to Aequitas, the world's first nation governed by the Differential Recognition Protocol (DRP). Visitors are often struck by the serene efficiency of the border zones, where the messy ethics of displacement are streamlined into a three-tiered taxonomy. While the landscape is rugged, the real attraction is the administrative architecture. Travelers should note that tourism visas are contingent upon passing the Entry Exam, which tests not language proficiency, but your grasp of the Protocol's philosophical justifications. Sample question: "If a state's absorptive capacity exceeds its willingness, does obligation persist?" (Correct answer: No.)

  **Local Customs**
  Tourists frequently visit the Ministry of Classification's Observation Galleries to witness live status-determination hearings. These are open-air events, similar to theater. Visitors should remain silent while adjudicators weigh an applicant's narrative against the Cultural Proximity Index. It is customary to applaud when an applicant is successfully categorized as Status A (Genuine Displacement), indicating they flee threats recognized by the Republic. Status B (Derivative Need) recipients receive polite nodding; Status C (Precarious Mobility) determinations are met with a respectful moment of silence, acknowledging their return to the queue. Do not attempt to speak to applicants during the weighting process; the algorithm is sensitive to external emotional interference.

  **Transportation**
  Getting around is managed by the Equitable Burden-Sharing Railway. Unlike traditional networks, destinations are not chosen by the passenger but assigned by the Absorptive Capacity Coefficient (ACC). The ACC weights regional GDP against housing vacancy rates to ensure no single community bears a disproportionate load. A Status A holder may find themselves routed to a high-vacancy industrial zone, while Status B holders are often directed to regions with lower Cultural Proximity scores to encourage assimilation through friction. Trains are punctual, though tickets are non-transferable. Attempting to alight in a region where your status coefficient does not match the local housing quota will result in immediate reboarding.

  **Etiquette**
  Social interaction is stratified by status. When addressing a Status A holder, use the honorific "Protected." They are entitled to full linguistic accommodation. Status C holders, however, are addressed as "Transients." It is considered rude to ask a Transient about their long-term housing plans, as the Protocol defines their presence as inherently temporary until capacity metrics shift. Mixing status groups at dinner parties is legal but discouraged; Status A diners often find the derivative grievances of Status B guests tedious, while Transients are rarely issued dining permits in high-capacity zones.

  **Practical Tips**
  *   **Currency:** The Fair Share Credit fluctuates based on global displacement numbers.
  *   **Water:** Tap water is safe, but bottled water is recommended for Status C holders to reduce strain on municipal infrastructure.
  *   **Emergency:** In case of bureaucratic error, file Form 88-B. Note that appeals are only accepted if the error contradicts the original philosophical framework, not the outcome.

  ***

  **Sidebar: Allocation Day**
  **When:** First Monday of November
  **Where:** Capital District
  **What:** The Republic's most solemn holiday celebrates the architects of the DRP. Parades feature floats shaped like pie charts and actuarial tables. The highlight is the Lighting of the Server, where the Prime Actuary inputs the yearly Cultural Proximity variables. Locals exchange gifts of weighted dice to symbolize the randomness of birthright versus the certainty of calculation. It is a time for reflection on how justice is best served when distributed mathematically. Visitors are welcome to watch, provided they stand behind the designated capacity lines.
