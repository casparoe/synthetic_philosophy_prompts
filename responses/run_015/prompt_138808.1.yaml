      *   Make sure not to sound condescending. The user has put thought into this.
      *   Emphasize that the "Paradox" is the disagreement between two rational principles, not just confusion about magic.
      *   The confidence score is actually a known variant (sometimes called "Newcomb with a hint"). It tends to push people toward Two-Boxing because it makes the probability explicit, but it introduces the "prediction of the prediction" problem.
      *   Key phrase to include: "Screening off." If the score screens off the correlation between action and box content, CDT wins. But does it?
      *   If the score is $S$, and Box Content is $B$, and Action is $A$.
      *   Normally $A$ correlates with $B$ via Common Cause (Brain State).
      *   If I know $S$ (which measures Brain State), does $A$ still correlate with $B$?
