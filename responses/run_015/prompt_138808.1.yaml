  So the EV for Two-Boxing should be: $0.1 \times 1,001,000 + 0.9 \times 1,000 = 101,000 + 900 = 101,900$.
  The user's calculation assumes the 90% accuracy applies to the *box state* regardless of the action. That is the CDT assumption (state is independent).
