prompt: |-
  I work at a small philanthropic fund — four program officers, maybe thirty grants a year — and increasingly the proposals we get are the kind where the whole case rests on a small probability of an enormous payoff: shave weeks off detection of something that goes global, shift how a field thinks about risky technology, keep a capability out of the wrong hands. The problem isn't that the numbers are made up (though sometimes). It's that when we actually try to compute an expected value, the thing is Pasadena-style: a fair coin until heads, payoffs growing fast enough that the sum over outcomes either doesn't converge or converges to different values depending on what order you add the terms in. So the "expected value" isn't a number, and comparing two such proposals by expected value is meaningless. In practice people here either squint at the upside and fund it, or get spooked and retreat to "well, what's the median outcome" — and both moves feel like giving up.

  So what I want is a decision procedure my team can actually run on a proposal, in a couple of hours, in a spreadsheet, by someone whose math stops at arithmetic and maybe a percentile function. The questions to ask, in order. What counts as a sufficient answer to each. Where the procedure stops with a no and the proposal goes back to the applicant for more work. Where it hands the decision to a person because what's left is a values question and not a factual one. It also has to survive being shown to our board, and it should be honest about which steps are judgment calls dressed up as procedure.

  A few things I've been kicking around that you should feel free to use, scrap, or improve on:

  - a reversed-sum instability check: compute the expectation summing from the biggest payoff down, then from the smallest up, and if the sign flips, flag the proposal as unstable rather than trying to rank it
  - truncating the proposal and a fixed baseline (just give the same money to a boring, well-measured program) at the same payoff ceiling T, and asking whether the proposal beats the baseline at every T from 10x to 10^12x the baseline's own value — dominance across horizons instead of one number
  - making the applicant state a tail exponent, and refusing to rank anything whose verdict swings on the difference between an exponent of 0.9 and 1.1
  - a credibility ceiling: zero weight on any outcome whose probability is smaller than my own confidence that the model producing it isn't nonsense

  Then run it on three live cases. (1) A $2M grant for a genomic surveillance network for novel respiratory pathogens, where essentially all the value sits in a roughly one-in-a-thousand chance of catching something early. (2) A $2M grant to a well-measured cash-transfer-type program with boring, honestly estimated returns. (3) A $400k grant to rewrite a mid-size computer science department's curriculum so that safety norms get into the bones of the field, where nobody can bound the tail at all.

  I expect the procedure to tell me something I won't like about case 3, and that's kind of the point of asking. Also say plainly what it can't do — which comparisons it has to just refuse, and where you'd rather we recieve outside help than trust the output.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the User's Problem:**
      *   **Context:** Small philanthropic fund (4 POs, ~30 grants/year).
      *   **Problem:** Proposals rely on small probability $\times$ enormous payoff (Pascal's Wager / St. Petersburg / Pasadena paradox territory). Expected Value (EV) is undefined or unstable.
      *   **Current Practice:** Either squint at upside (fund) or retreat to median (reject). Both feel like giving up.
      *   **Goal:** A practical decision procedure (spreadsheet-friendly, arithmetic-level math, couple of hours) that handles these "heavy-tailed" proposals honestly.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for sufficient answers.
          *   Stop conditions (reject/revise).
          *   Hand-off points (values vs. facts).
          *   Board-proof (transparent about judgment calls).
          *   Must use/improve on user's ideas (reversed-sum, truncation/dominance, tail exponent, credibility ceiling).
          *   Must run on three specific cases (Pathogen Surveillance, Cash Transfers, CS Curriculum).
          *   Must admit limitations (what it can't do).

  2.  **Analyze the User's Proposed Tools:**
      *   *Reversed-sum instability:* Good for detecting Pasadena-style non-convergence. If order matters, the number is meaningless.
      *   *Truncation/Dominance:* Comparing at various cutoffs ($T$) is robust. If Proposal A beats Baseline B at *all* reasonable cutoffs, that's strong evidence.
      *   *Tail Exponent:* Asking applicants to estimate the decay rate of the tail. If it's near 1 (Cauchy-like), EV is unstable.
      *   *Credibility Ceiling:* Ignoring probabilities below the model's confidence threshold. This is a practical "shut up and calculate" bound.

  3.  **Develop the Decision Procedure (The "Heavy-Tail Protocol"):**
      *   *Philosophy:* Move from "What is the EV?" to "Is this robustly better than a safe alternative across a range of plausible futures?"
      *   *Structure:* Needs to be linear, with gates.
      *   *Step 1: The Credibility Floor (Sanity Check).* Don't calculate probabilities smaller than your confidence in the model.
      *   *Step 2: The Truncation Test (Dominance).* Compare against a baseline at multiple scales.
      *   *Step 3: The Instability Check (Order of Summation).* Detect Pasadena paradoxes.
      *   *Step 4: The Tail Exponent (Sensitivity).* How sensitive is the verdict to the shape of the tail?
      *   *Step 5: The Values Handoff.* If numbers are stable but close, it's a risk-preference question.

  4.  **Refining the Steps for a Spreadsheet:**
      *   *Input:* Outcomes ($O_i$), Probabilities ($P_i$), Baseline Value ($V_{base}$).
      *   *Step 1 (Credibility):* Set $P_{min} = 1 / \text{Confidence}$. If $P_i < P_{min}$, set $P_i = 0$.
      *   *Step 2 (Truncation):* Create a column for Cutoff $T$. Calculate $\sum_{O_i < T} P_i \times O_i$. Do this for $T = 10^1, 10^2, \dots, 10^{12} \times V_{base}$. Plot Proposal vs. Baseline.
      *   *Step 3 (Instability):* Sum High-to-Low vs. Low-to-High. Check % difference.
      *   *Step 4 (Exponent):* Ask applicant for tail decay. If $\alpha \le 1$, flag as "EV Undefined."

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* The Truncated Dominance Protocol (TDP).
      *   *Tone:* Professional, humble, explicit about uncertainty.
      *   *Board Proof:* Needs a "Judgment Log" section where POs write down *why* they picked certain parameters.

  6.  **Running the Three Cases:**

      *   **Case 1: Genomic Surveillance ($2M, 1/1000 chance of huge payoff).**
          *   *Baseline:* Maybe bednets or direct health intervention.
          *   *Tail:* Heavy, but bounded by "world exists."
          *   *Credibility:* 1/1000 is usually above the noise floor (confidence > 0.1%).
          *   *Truncation:* At low $T$, Baseline wins. At high $T$ (pandemic averted), Proposal wins.
          *   *Verdict:* Depends on the crossover point. If crossover is at "global catastrophe," it's a risk bet.
          *   *Outcome:* Likely "Fundable if risk-tolerant," but flags the dependency on the single tail event.

      *   **Case 2: Cash Transfers ($2M, boring, measured).**
          *   *Tail:* Thin. No huge upside.
          *   *Truncation:* Dominates at low $T$, loses at extreme $T$.
          *   *Instability:* Stable sum.
          *   *Verdict:* The "Anchor." Use this to calibrate the fund's risk tolerance.

      *   **Case 3: CS Curriculum ($400k, unbounded tail).**
          *   *Tail:* "Shift how a field thinks." Unbounded.
          *   *Credibility:* Probability of "changing the field" is vague. Likely below credibility ceiling if specified as 1 in a million.
          *   *Instability:* High. Summing order matters.
          *   *Truncation:* Might never dominate the baseline because the probability is too diffuse.
          *   *Verdict:* This is the one the user expects to fail. The procedure should flag it as "Unrankable." It forces the team to admit they are funding a lottery ticket, not an investment.

  7.  **Addressing the "What it can't do" Section:**
      *   Can't resolve value conflicts (risk aversion vs. risk neutrality).
      *   Can't validate bad models (garbage in, garbage out).
      *   Can't compare two unstable tails against each other (only against a stable baseline).

  8.  **Final Review against Constraints:**
      *   *Spreadsheet friendly?* Yes, mostly sums and ifs.
      *   *Arithmetic level?* Yes.
      *   *Honest about judgment?* Yes, requires explicit confidence inputs.
      *   *Board proof?* Yes, creates an audit trail.

  9.  **Writing the Response:**
      *   *Introduction:* Acknowledge the Pasadena problem. Validate their intuition.
      *   *The Protocol:* Define the 5 steps clearly.
      *   *The Spreadsheet Logic:* Explain the columns/formulas simply.
      *   *The Case Studies:* Apply the protocol rigorously.
      *   *Limitations:* Be blunt.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "calculate EV." I need to emphasize the *Truncated* EV. The core insight is that EV is only meaningful relative to a horizon. I should also refine the "Credibility Ceiling." Instead of just zeroing out, treat it as a "Model Confidence Bound." If I'm 90% sure the model is right, I can't trust probabilities below 10%. Actually, the user suggested "confidence that the model... isn't nonsense." Let's formalize that as $P_{min} = 1 - \text{Confidence}$. No, that's not right. If I'm 90% confident the model structure is valid, I shouldn't trust probabilities smaller than the 10% chance the model is wrong. So $P_{cutoff} = \text{Probability Model is Wrong}$.

      *Refining the "Instability Check":* The user mentioned summing high-to-low vs low-to-high. In a spreadsheet, this is easy. `SUMPRODUCT` sorted one way vs the other.

      *Refining Case 3:* The user expects the procedure to say something they won't like. The honest answer is "This proposal is mathematically indistinguishable from a donation to a random stranger who claims they might change the world." The procedure must force them to confront that the "tail exponent" is unknowable.

  10. **Final Polish:** Ensure tone is empathetic to the Program Officers' dilemma. They want to do good, not just do math. The math serves the mission.

  *(Final thought on the "Values Handoff"):* The procedure shouldn't make the final decision. It should produce a "Risk Profile" that the Board/ED signs off on. The POs provide the analysis; the Leadership provides the risk tolerance.

