answer: |-
  This is a sophisticated problem that sits at the intersection of effective altruism, decision theory, and institutional risk management. You are describing the **Pasadena Paradox** in a real-world budget constraint. When the expected value integral does not converge, "maximizing expected value" is not a coherent instruction.

  Your intuition is correct: trying to force a single number is dishonest. The goal of this procedure is not to find the *true* value, but to determine **robustness**. Does this proposal beat a safe alternative across a wide range of plausible "cut-off" points, or does it only win in a fantasy tail that we cannot credibly model?

  Here is a decision procedure designed for your constraints. It is called the **Truncated Dominance Protocol (TDP)**.

  ---

  # The Truncated Dominance Protocol (TDP)

  **Goal:** To determine if a high-variance proposal is *robustly* better than a baseline alternative across a range of payoff horizons, without relying on a single convergent Expected Value (EV).
  **Time:** 2–3 hours per proposal.
  **Tools:** Spreadsheet (Excel/Sheets).
  **Math:** Arithmetic, Sorting, Cumulative Sums.

  ## Part 1: The Inputs (Program Officer Work)

  Before opening the spreadsheet, the PO must define three parameters. These are **judgment calls** that must be logged for the board.

  1.  **The Baseline ($B$):** What is the boring, well-measured alternative for this budget? (e.g., GiveWell top charity, internal reserve fund). Value = $V_B$.
  2.  **The Credibility Floor ($P_{min}$):** What is the probability that your entire model of the world is wrong?
      *   *Rule:* If you are 95% confident your causal logic holds, $P_{min} = 5\%$.
      *   *Spreadsheet Rule:* Any outcome with probability $< P_{min}$ is treated as 0. This implements your "Credibility Ceiling." You cannot claim precision finer than your model's structural integrity.
  3.  **The Horizon Set ($T$):** A list of truncation points.
      *   *Standard Set:* $1\times, 10\times, 100\times, \dots, 10^{12}\times V_B$.

  ## Part 2: The Spreadsheet Procedure

  Create a sheet with the following columns for the Proposal ($P$) and the Baseline ($B$).

  | Row | Outcome Description | Raw Prob ($p$) | Raw Value ($v$) | **Adjusted Prob** ($p'$) | **Truncated Value** ($v_T$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | ... | ... | ... | `=IF(p < P_min, 0, p)` | `=IF(v > T, T, v)` |

  *Note: You will need to duplicate the sheet or use a data table for each Horizon $T$ in your Horizon Set.*

  ### Step 1: The Credibility Filter
  Apply the $P_{min}$ rule. If an outcome's probability is lower than your confidence in the model itself, zero it out.
  *   **Stop Condition:** If >50% of the proposal's claimed EV comes from outcomes below $P_{min}$, **Return to Applicant.** The case rests on magic, not modeling.

  ### Step 2: The Instability Check (Pasadena Flag)
  Calculate the Expected Value at the largest Horizon ($T_{max}$) twice:
  1.  Sum from Largest Payoff $\to$ Smallest Payoff.
  2.  Sum from Smallest Payoff $\to$ Largest Payoff.
  *   **Metric:** $\text{Instability} = \frac{|EV_{down} - EV_{up}|}{|EV_{down}|}$
  *   **Flag:** If Instability > 10%, mark proposal as **"Mathematically Unstable."**
  *   **Meaning:** The EV is order-dependent. You cannot rank this numerically against another unstable proposal. You can only compare it to a stable baseline.

  ### Step 3: The Dominance Curve
  For each Horizon $T$ in your set ($10^1$ to $10^{12}$):
  1.  Calculate Truncated EV for Proposal ($EV_{P,T}$).
  2.  Calculate Truncated EV for Baseline ($EV_{B,T}$).
  3.  Compute Ratio: $R_T = EV_{P,T} / EV_{B,T}$.

  Plot $T$ (log scale) on the X-axis and $R_T$ on the Y-axis.

  ### Step 4: The Tail Exponent Sensitivity
  Ask the applicant: *"If we double the payoff size of the top 1% of outcomes, how much does the probability drop?"*
  *   They are describing the decay rate ($\alpha$).
  *   **Rule:** If the verdict (Fund/Reject) flips when $\alpha$ moves from 1.2 to 0.9, mark as **"Tail Dependent."**
  *   **Meaning:** You are not funding a project; you are betting on the shape of a distribution nobody can measure.

  ## Part 3: The Decision Matrix

  | Profile | Dominance Curve | Instability | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Robust Win** | $R_T > 1$ for all $T$ | Low | **Fund** (Rare) |
  | **Risk Bet** | $R_T < 1$ (low $T$), $R_T > 1$ (high $T$) | Low/Med | **Hand to Board** (Values Question) |
  | **Unstable** | Any | High (>10%) | **Reject or Revise** (Cannot compare) |
  | **Tail Dependent** | Crosses 1.0 based on $\alpha$ | N/A | **Return to Applicant** (Need better bounds) |
  | **Dominated** | $R_T < 1$ for all $T$ | Any | **Reject** |

  ---

  # Part 4: Running the Live Cases

  Here is how the TDP handles your three specific scenarios.

  ### Case 1: Genomic Surveillance ($2M)
  *   **Structure:** 99.9% chance of modest value (data collection); 0.1% chance of massive value (pandemic averted).
  *   **Baseline:** Direct health intervention (lives saved now).
  *   **Credibility Floor:** PO sets $P_{min} = 1\%$ (confidence in epidemiological models is high, but not perfect).
      *   *Result:* The 0.1% pandemic event is **zeroed out**.
  *   **Dominance Curve:** At low $T$, Baseline wins (certain lives saved vs. data). At high $T$, Proposal wins *if* the tail is included.
  *   **TDP Verdict:** **Return to Applicant.**
      *   *Why:* The entire case rests on the 0.1% event. Your Credibility Floor ($1\%$) killed it. To proceed, the PO must justify why their model confidence is $>99.9\%$. If they can't, the spreadsheet honestly says "This looks like a lottery ticket, not a grant."
      *   *Board Message:* "We are not refusing to prevent pandemics. We are refusing to fund a model where the probability of success is lower than our confidence in the model itself."

  ### Case 2: Cash Transfers ($2M)
  *   **Structure:** Thin tail. Well-measured.
  *   **Baseline:** Same program (or similar).
  *   **Credibility Floor:** $P_{min} = 5\%$. All outcomes pass.
  *   **Instability Check:** Low. Sum converges quickly.
  *   **Dominance Curve:** $R_T \approx 1$ across all horizons (since it *is* the baseline).
  *   **TDP Verdict:** **The Anchor.**
      *   *Usage:* This proposal sets the scale. You use this to calibrate the Fund's risk tolerance. If you reject Case 1 because it doesn't dominate Case 2 at low $T$, you are explicitly stating: *"We value certain modest gains over uncertain massive gains."* That is a values statement, not a math error.

  ### Case 3: CS Curriculum Rewrite ($400k)
  *   **Structure:** "Shift how a field thinks." Unbounded upside. No probability estimates.
  *   **Baseline:** Cash Transfers ($400k equivalent).
  *   **Credibility Floor:** PO sets $P_{min} = 10\%$ (social science/education interventions are noisy).
  *   **Instability Check:** **High.**
      *   Summing High$\to$Low: "If this changes AI safety norms, value is $\infty$." EV = Huge.
      *   Summing Low$\to$High: "Most students ignore norms." EV = Small.
      *   Sign/Magnitude flips depending on sort order.
  *   **Tail Exponent:** Applicant cannot state one. "It's unbounded."
  *   **Dominance Curve:** At low $T$ (better jobs for grads), Baseline wins. At high $T$ (saving humanity), Proposal wins *only if* you ignore the Instability Flag.
  *   **TDP Verdict:** **Mathematically Unrankable.**
      *   *The Hard Truth:* The procedure forces you to admit you cannot compare Case 3 to Case 2. Case 2 is a number; Case 3 is a story.
      *   *Action:* You cannot fund this on "Expected Value" grounds. You can only fund it as a **Patronage** decision.
      *   *Board Script:* "This proposal fails the Truncated Dominance test. It does not beat the baseline at any measurable horizon. Funding this is an explicit bet on a tail event we cannot model. If we fund it, we must admit it is an artistic patronage grant, not an impact investment."

  ---

  # Part 5: Limitations & Handoffs

  This procedure is honest about what it cannot do. You must include this page in your board deck.

  ### 1. It Cannot Compare Two "Unstable" Proposals
  If you have two Pasadena-style proposals (e.g., Case 1 and Case 3), the TDP will flag both as Unstable. It cannot tell you which one is *less* unstable.
  *   **Handoff:** This requires a **Values Vote**. The Board must decide: "Do we prefer biological risk reduction or technological norm-setting?" The math cannot answer this.

  ### 2. It Cannot Validate the Model
  The Credibility Floor ($P_{min}$) is subjective. A reckless PO can set $P_{min} = 0.0001\%$ and make the pandemic case pass.
  *   **Safeguard:** The "Judgment Log" requires the PO to cite *external* validation for their confidence level (e.g., "Historical accuracy of similar epidemiological models is 95%").

  ### 3. It Refuses "Infinite" Bets
  The procedure effectively vetoes any proposal where the median outcome is negative or negligible, even if the infinite tail is positive.
  *   **Consequence:** You will stop funding "moonshots" that lack intermediate milestones.
  *   **Mitigation:** If you want to fund moonshots, create a separate budget bucket labeled **"High-Risk Speculation."** Do not mix these funds with your "Impact Maximization" budget. The TDP keeps them separate.

  ### 4. Where to Get Outside Help
  *   **Tail Estimation:** If a proposal passes the Credibility Floor but fails the Tail Exponent check, hire a consultant (statistician/forecaster) to estimate the decay rate. Do not let the applicant self-report this.
  *   **Model Auditing:** For Case 1 (Pathogens), do not trust the PO's $P_{min}$. Pay an external expert to audit the probability model.

  # Summary for the Board

  > "We are adopting the **Truncated Dominance Protocol**. We acknowledge that for high-stakes philanthropy, 'Expected Value' is often a mathematical illusion.
  >
  > This procedure does not give us a magic number. Instead, it tells us **where our bets rely on faith rather than evidence.**
  > *   If a proposal dominates our baseline across all horizons, we fund it.
  > *   If a proposal only wins at horizons we cannot model, we classify it as **Speculation**, not **Investment**.
  > *   If the math is unstable, we admit we are making a values choice, not a calculation.
  >
  > This will likely reduce our number of grants in the 'existential risk' category. It will increase our confidence that the grants we *do* make are robust to uncertainty."

  ### Final Note on Case 3
  You expected the procedure to tell you something you wouldn't like about Case 3. The TDP says: **"You have no idea if this works, and you cannot calculate the value if it does."**
  Most foundations fund Case 3 because it feels intellectual and important. The TDP forces you to admit that funding Case 3 over Case 2 is an aesthetic choice, not a mathematical one. If you are comfortable making aesthetic choices with donor money, fund it. But do not call it "Expected Value Philanthropy."
