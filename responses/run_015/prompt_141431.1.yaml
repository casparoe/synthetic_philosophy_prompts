  11. **Final Polish:** Ensure the distinction between *Prudence* (rationality of one agent) and *Morality* (relations between agents) is sharp. This is the crux of the Rawlsian objection.

  *(Self-Correction on the "Leakiness" point)*: The user asks if leakiness does more work than separateness. I need to confirm this. If intrapersonal transfer is leaky (I might die), why do we still demand prudence? Because the *expectation* of continuity is high. In interpersonal, the *expectation* of continuity is zero. So leakiness *is* a measure of separateness. The student tries to minimize this gap; the user correctly identifies it as significant.

  *(Self-Correction on the Fission case)*: If one stream divides into two, does prudence become utilitarianism? Parfit says "Rationality becomes more like morality." But it doesn't make morality *utilitarian* necessarily. It just blurs the boundary. I need to be careful not to endorse Parfit fully but use the case to show the limits of the analogy.

