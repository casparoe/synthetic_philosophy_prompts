answer: |-
  1. Aristotle explicitly separates virtues from emotions, which are reactive states accompanied by pleasure or pain, because we are not praised or blamed merely for feeling them. By categorizing virtue as a disposition rather than an emotion, he defines it as a stable orientation toward feelings rather than the fleeting feelings themselves.
  2. The text states we are not angry or afraid from choice, whereas virtues are modes of choice, indicating agency rather than passive reaction. This distinction shows that being "disposed" involves a cultivated readiness to act, unlike being "moved" by an emotion which happens to us.
  3. Being "disposed in a certain way" implies a reliable tendency within relevant contexts, allowing for ecological variation where different situations call for different moderate responses. This avoids pure situationism because the stability lies in the practical wisdom guiding the response, not in identical behavioral outputs across all scenarios.
  4. Treating *hexis* as a decontextualized trait score misreads Aristotle by ignoring his insistence that virtue is relative to us and the specific situation. The situationist critique assumes a global consistency model that Aristotle never endorsed, confusing normative stability with statistical uniformity.
  5. Even if empirical cross-situational consistency is low, Aristotle's account of moral development through habituation and the normative goal of hitting the mean remains intact. The philosophical claim about what constitutes human flourishing does not depend on the psychological claim that people consistently behave virtuously across all disparate contexts.
