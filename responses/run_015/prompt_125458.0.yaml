prompt: |-
  hey so im in a phil of language seminar this semester and we just spent like three weeks on frege's puzzle about identity statements — you know, why hesperus is phosphorus has actual cognitive value but hesperus is hesperus is basically redundant, the whole sense vs reference thing, modes of presentation, empty names like pegasus, etc. my prof said we can do a creative satirical assignment as long as it actually understands teh philosophy instead of being generic.

  can you write me a parody of a tech startup's terms-of-service agreement for an app called ReferentLock that applies strict fregean semanitics to user profiles? i want about 700 words, formatted as numbered deadpan corporate clauses. the target should be the bureaucratic fantasy that formalizing sense/reference can solve identity verification.

  the clauses need to cover:
  - definitions separating Reference (the actual user) from Sense (their profile presentation), with a footnote that empty references like pegasus are permitted but flagged.
  - a uniqueness clause banning hidden co-reference: if two profiles share one reference they must file separate mode-of-presentation disclosures or face suspension.
  - a self-identity clause requiring users to check "i am identical to myself", but the system assigns this zero cognitive-value points and denies verification badges for it.
  - a hesperus-phosphorus update protocol: what happens when you discover your match is the same reference as someone you rejected earlier, including a strict no-refund policy since teh reference never changed, only teh sense did.
  - a data clause mentioning "sense-tracking cookies" that log every descriptive shift in how you present yourself.
  - one invented niche detail: the company uses a "cognitive-value scoring algorithm" that ranks profiles based on how informatively they state their own identity.

  please dont include any citations, bibliographies, or reading lists — i dont have library access right now and a model without search shouldnt need them. also keep it readable to someone who hasnt taken phil of lang, but make the jokes land for people who actually get frege. and maybe slip the typo "referrence" into one of the clauses naturally if it fits.
