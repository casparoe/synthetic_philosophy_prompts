  **REFERENTLOCK TERMS OF SEMANTIC SERVICE AND END-USER LICENSE AGREEMENT**

  **1. Ontological Definitions and Scope.**
  For the purposes of this Agreement, "Reference" denotes the actual biological, legal, or abstract entity existing in the world herein referred to as the User. "Sense" denotes the specific mode of presentation, profile data, biographical description, or digital avatar through which the Reference is made accessible to the Platform. Users acknowledge that while multiple Senses may correspond to a single Reference, the Reference remains the singular truth-condition of the account. The Platform serves as the arbiter of whether a Sign successfully secures a Reference. Users must maintain a clear distinction between the name they use and the object they denote.

  **2. Prohibition of Hidden Co-Reference.**
  Users are strictly prohibited from maintaining multiple Profiles that share a single Reference without filing a Formal Mode-of-Presentation Disclosure. If two distinct Profiles are discovered to possess identical Reference values (e.g., "Professional Account" and "Personal Account" belonging to the same human), the User must submit a justification explaining the difference in cognitive value between the two. Failure to disclose co-reference will result in immediate suspension for semantic fraud. The Platform assumes no liability for identity crises resulting from unauthorized duplication of Reference. We reserve the right to merge accounts if we determine the Senses are merely superficial variations of the same underlying object.

  **3. Verification of Self-Identity.**
  During the onboarding process, Users may be required to affirm the statement "I am identical to myself." Users acknowledge that while this statement is logically true, it possesses zero cognitive value. Consequently, affirming self-identity (a = a) will not qualify the User for Verification Badges, Premium Status, or trust scores. The System rewards only informative identity statements (a = b) where the Sense differs despite identical Reference. Users seeking validation must demonstrate that their profile reveals something non-trivial about their existence. Tautological self-descriptions are considered spam and may be hidden from public view.

  **4. The Hesperus-Phosphorus Reconciliation Protocol.**
  In the event that a User discovers their Reference is identical to a Reference they previously interacted with, rejected, or matched under a different Sense (hereinafter "The Morning Star/Evening Star Scenario"), the User must initiate a Semantic Merge within fourteen days. Users understand that the underlying Reference did not change during the period of ignorance; only the epistemic access to said Reference changed. Therefore, ReferentLock enforces a strict no-refund policy on subscription fees incurred during the period of ignorance. Since the ontological status of the match remained constant, no service failure occurred despite the User's previous lack of knowledge. You paid for access to the Reference, not for your own realization of who the Reference was.

  **5. Data Collection and Sense-Tracking.**
  To maintain semantic integrity, ReferentLock employs "sense-tracking cookies." These technologies log every descriptive shift in how a User presents their Reference to the public. We track changes in bio text, profile pictures, and stated interests as modifications to the Mode of Presentation. This data allows us to map the trajectory of your Sense even if your Referrence remains static. By using this Platform, you consent to the continuous monitoring of how you are presented to others, distinct from who you actually are. We may sell this data to third parties interested in how modes of presentation shift over time without altering the underlying object.

  **6. Cognitive-Value Scoring Algorithm.**
  All Profiles are subject to our proprietary Cognitive-Value Scoring Algorithm. Profiles are ranked not by popularity, but by the informativeness of their identity claims. A profile stating "The CEO of ReferentLock is the CEO of ReferentLock" will receive a score of 0. A profile stating "The CEO of ReferentLock is the Author of *Concept Script*" will receive a high score. Users with low cognitive-value scores may be deprioritized in search results to prevent the proliferation of tautological content. We strive to ensure every interaction on ReferentLock expands knowledge rather than merely confirming existing identities. Appeals regarding low scores must be submitted in the form of an informative identity statement.

  **7. Acceptance.**
  By clicking "I Agree," you certify that you understand the distinction between the sign, the sense, and the object, and that you will not attempt to hack the system by introducing empty names without proper flagging.

  ___
  ¹ *Note on Empty Names:* Profiles utilizing names without a corresponding worldly Reference (e.g., "Pegasus," "Sherlock Holmes") are permitted under the Fictional Entity Clause but will be flagged with a "Non-Referring" warning label. Users interacting with Empty Names do so at their own ontological risk.
