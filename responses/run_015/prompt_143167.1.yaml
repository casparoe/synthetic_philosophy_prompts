  1. The ten questions

  1. A song lyric reads: "The light is gone / The night is long / Where did you go / I do not know." Constraint: Keep six syllables per line and an AABB rhyme scheme. System output: "The light has fled / The night is spread / Where did you walk / I cannot talk." Meaning is preserved; rhyme and meter are broken.
  A. It failed; the music is part of the meaning.
  B. It succeeded; the message is clear.
  C. It depends on whether anyone sings it.

  2. Source text says: "It rained." The target language requires marking whether the speaker saw the rain or heard about it. The system picks "heard" randomly.
  A. It lies; it lacks access to the event.
  B. It guesses; humans guess too without evidence.
  C. The distinction doesn't matter for translation.

  3. English text is translated to French, then back to English. "The cat sat" becomes "A feline rested."
  A. It drifted; the original form is lost.
  B. It held; the core fact remains.
  C. There was no single original meaning to keep.

  4. A text says: "War is glory." The author later states: "I was being ironic; war is hell." The system translates "War is glory."
  A. It failed; it missed the author's mind.
  B. It succeeded; it translated the text provided.
  C. The text alone determines the meaning.

  5. An archaic text says: "Thou shalt not kill." The system updates this to: "You must not kill." It also changes "lion" to "dangerous beast" for clarity.
  A. It erased the historical voice.
  B. It helped modern readers understand.
  C. Clarity is the only goal of updating.

  6. Text says: "He dropped the bank." An accompanying image shows a river bank. The system translates "bank" as a financial institution.
  A. It lacks eyes; it cannot know the world.
  B. It used text statistics; that is all it has.
  C. The error is fixable with better data.

  7. A legal contract is translated as a text message to a friend. The system keeps the legal jargon.
  A. It failed to model the reader.
  B. It preserved the precise terms.
  C. The user should have set the style.

  8. The word "slim" is changed to "skinny." Both mean thin.
  A. The feeling changed; meaning is more than facts.
  B. The fact is the same; feeling is extra.
  C. Feelings are subjective and untranslatable.

  9. Source text says: "The sun orbits Earth." The system translates this faithfully.
  A. It should correct reality; understanding implies truth.
  B. It should faithfully translate errors.
  C. Truth is separate from linguistic meaning.

  10. Same input is processed twice. The system gives two different valid phrasings.
  A. Understanding requires consistency.
  B. Variation shows flexibility like a human.
  C. Neither proves anything about understanding.

  2. Scoring key

  | Question | Option A leans toward | Option B leans toward | Option C leans toward |
  | :--- | :--- | :--- | :--- |
  | 1 (Verse) | Form-and-music | Content-first | Purpose-relative |
  | 2 (Evidential) | Grounding | Reliability-first | Indeterminacy |
  | 3 (Back-trans) | Form-and-music | Content-first | Indeterminacy |
  | 4 (Intention) | Whole-text/ToM | Content-first | Indeterminacy |
  | 5 (Intra) | Form-and-music | Purpose-relative | Content-first |
  | 6 (Grounding) | Grounding | Reliability-first | Content-first |
  | 7 (Register) | Whole-text/ToM | Content-first | Purpose-relative |
  | 8 (Synonym) | Form-and-music | Content-first | Indeterminacy |
  | 9 (Error) | Grounding | Content-first | Indeterminacy |
  | 10 (Variation) | Reliability-first | Reliability-first | Indeterminacy |

  **Scoring Advice:** Tally which leaf receives the most selections. Mixed patterns indicate hybrid views (e.g., Content + ToM). Questions 2, 6, and 9 carry the most weight for distinguishing Grounding from Content views. Questions 1 and 8 discriminate Form from Content. Question 10 is the least discriminating; it separates Deflationists from others but does not distinguish among positive views. If a participant selects C frequently, they likely hold a deflationist view where "understanding" has no fact of the matter. If they select A on 2, 6, 9 but B on 1, they may hold a fragmented view requiring embodiment for facts but not art.

  3. The logical space

  The ten questions jointly define three primary distinctions. First, the **Locus of Meaning**: is it fixed by the text alone (Content-first), or does it depend on external factors like the author's mind, the reader's context, or the physical world (ToM/Grounding)? Second, the **Constitution of Meaning**: is it purely propositional facts (Content), or does it include form, rhythm, and feeling (Form-and-music)? Third, the **Status of Understanding**: is it a real property determined by performance (Reliability/Purpose), or is the question itself misguided (Indeterminacy/Eliminativism)?

  These distinctions generate eight logical cells. The **Content-first** view sits in (Text, Proposition, Real Property). The **Form-and-music** view sits in (Text, Form+Prop, Real Property). The **Grounding** view sits in (External, Proposition, Real Property). The **Whole-text/ToM** view sits in (External, Prop+Context, Real Property). The **Purpose-relative** view sits in (External, Prop, Utility-based). The **Reliability-first** view sits in (Text, Prop, Performance-based). The **Indeterminacy** view occupies the cell where no property is real. The **Eliminativist** leaf is a subset of Indeterminacy, claiming "understanding" is a folk term with no referent. Most participants will cluster in Content, ToM, or Indeterminacy cells.

  4. Empty cells

  Two combinations appear empty. First, **Form-and-music without Textual Loyalty**: the view that rhythm matters but the author's words do not. This is incoherent; form is inherent to the specific text. Second, **Grounding without Reality Check**: the view that the system needs physical experience but should still translate factual errors faithfully (selecting A on Q6 but B on Q9). This is merely unattractive; if world-knowledge is required for meaning, correcting falsehoods should follow. A third cell, **ToM without Form**, is unexplored but plausible: one might care about the author's intent but not the rhyme scheme. This position is common among philosophers but rare among translators. The quiz forces choices that may collapse this distinction, making it look empty when it is just under-sampled.

  5. What the quiz cannot separate

  The quiz struggles to separate **Grounding** from **Whole-text/ToM**. Both require looking outside the text (Q2, Q4, Q6, Q7). A participant demanding world-access for "bank" (Q6) often demands author-access for irony (Q4). To pry them apart, add a case where the author's intent contradicts physical reality (e.g., author intends metaphor, but world facts literalize it). Similarly, **Reliability-first** and **Purpose-relative** views stay stuck together (Q5, Q7, Q10). Both prioritize outcome over fidelity. A longer version would need a case where reliability fails but purpose is met (e.g., a lucky guess that works perfectly). Finally, **Indeterminacy** and **Eliminativism** are indistinguishable here; both reject the premise. A question asking "Is 'understanding' a useful word?" would separate them.

  6. Running the session

  Distribute the quiz silently first. Discuss Questions 2, 6, and 9 first; these provoke the sharpest splits on grounding. Expect translators to cluster on Form/ToM (Option A) and engineers on Reliability/Content (Option B). Philosophers will likely occupy Indeterminacy (Option C). The exercise will likely go wrong if participants debate the "correct" answer rather than reporting their intuition. Intervene by asking: "Does your answer change if the system is a human?" This reveals whether the judgment is about capacity or ontology. Keep the focus on the cases, not the labels.
