answer: |-
  ### The implicit theory

  The practice rests on a framework of Epistemic Thresholding combined with Taxonomic Natural Kinding. It posits that moral status is not a gradient but a binary switch: an entity either possesses the capacity for suffering or it does not. Because regulatory bodies cannot assess individual consciousness, they treat sentience as a property of biological kinds rather than individual organisms. Consequently, the burden of proof lies entirely on the claimant to demonstrate that a specific taxon possesses the necessary neural substrates for experience. In the absence of high-confidence evidence—typically homologous structures to the vertebrate cortex—the default probability of sentience is treated as exactly zero, not merely low.

  This framework explicitly rejects the expected-value calculation your friend proposes. It argues that correlated uncertainty does not accumulate moral weight because the regulatory threshold for action requires positive proof, not probabilistic risk management. If the evidence for insect sentience falls below the confidence interval required to flip the binary switch, the probability is functionally nullified for policy purposes. Therefore, multiplying a nullified probability by a large number still yields zero moral cost. This is bolstered by a principle of Institutional Tractability: ethics committees are designed to manage manageable risks. If every potential bearer of consciousness required assessment, the system would collapse. Thus, the theory assumes that moral consideration is constrained by the limits of administrative verification. It is not that insects *definitely* lack consciousness, but that regulatory ethics cannot operate on ambiguity. The boundary is drawn where evidence becomes robust enough to survive institutional scrutiny, creating a sharp discontinuity between the regulated vertebrate/cephalopod clade and the unregulated arthropod mass.

  ### What it strictly needs vs. what it merely fits

  For this theory to hold logically, it strictly needs three components. First, it requires a binary view of moral status; if status were gradable, the low probability of insect sentience would still generate some obligation, undermining the zero-paperwork rule. Second, it needs the burden of proof to rest on the existence of sentience rather than the absence of it; if the precautionary principle applied fully, uncertainty would mandate protection, not exclusion. Third, it requires taxonomic generalization to be epistemically valid; the committee must be allowed to assume all honeybees are morally identical, otherwise individual assessment would be necessary.

  However, several features of the current practice merely fit the theory without being strictly required by it. The specific phylogenetic line—vertebrates and cephalopods—is compatible with the theory but not dictated by it; a different committee could draw the line at mammals only, or include crustaceans, without breaking the logic. The administrative convenience of excluding insects fits the theory well, but the theory claims moral justification, not just pragmatic ease. Similarly, the public's emotional affinity for mice fits the practice but is theoretically irrelevant; the implicit theory claims to rely on neural evidence, not cuteness. Finally, the distinction between research and pest control fits the practice but strains the theory; if moral status is a natural kind, context should not alter the ontology of the animal. The theory needs the binary switch and the burden of proof; it merely accommodates the specific bureaucratic boundaries and societal preferences currently in place.

  ### Where the practice pulls apart

  The practice fractures most visibly when phylogenetic distance conflicts with regulatory status. You noted the octopus versus the honeybee. Phylogenetically, both are distant from humans, yet the octopus is regulated while the bee is not. The implicit theory justifies this via neural complexity, but this creates a strain when considering large insects versus small vertebrates. A shrew has a rudimentary cortex; a giant weta has a complex ganglionic system. If the criterion is neural substrate complexity, the boundary should be fuzzy, yet the paperwork boundary is absolute. This suggests the theory is masking a arbitrary line-drawing exercise.

  A sharper contradiction exists between research and pest control. Your committee regulates the killing of fifty mice in a lab but ignores the killing of fifty mice in a building by an exterminator. If the moral status belongs to the animal as a natural kind, the context of death should be irrelevant to the *need* for ethical oversight, even if the justification differs. The practice treats the lab mouse as a moral patient and the pest mouse as property. Furthermore, the numbers problem reveals a deep inconsistency. The committee treats the death of fifty thousand mice as exponentially worse than one mouse, acknowledging aggregation. Yet for insects, aggregation is ignored entirely. This implies the committee treats the probability of insect sentience not as low, but as metaphysically impossible. If they admitted even a one percent chance, the expected suffering of fifty thousand ants would outweigh one mouse. The practice only holds if they treat insects as philosophical zombies, yet they admit uncertainty. The system claims to manage risk, but acts as if there is none.

  ### Underdetermination

  Multiple distinct philosophical theories would license the exact same hands-off treatment of insects, making the actual motivation underdetermined. First, Hard Skepticism posits that insects are purely mechanistic automata; they literally cannot suffer. This justifies exclusion perfectly but is scientifically contentious. Second, Cognitive Capacity Theory argues that sentience requires self-awareness or future planning, traits insects lack. This licenses exclusion based on cognitive thresholds rather than raw feeling, differing from the pain-focused implicit theory. Third, Relational Contractualism suggests moral status arises only from specific relationships with humans (e.g., research subjects, pets). Wild insects or pests fall outside the moral contract, explaining why lab mice are protected but wild ones are not.

  Fourth, Resource Utilitarianism argues that regulating insects would consume resources better spent on humans or vertebrates. This view admits insects might matter but claims ignoring them maximizes overall good by preventing bureaucratic paralysis. All four theories result in "no forms for beetles," but they conflict on why. If Hard Skepticism is true, new evidence of pain should change policy immediately. If Relational Contractualism is true, policy should change based on public sentiment, not neuroscience. If Resource Utilitarianism is true, the policy should change once automation makes review cheaper. Because the committee cites "invertebrates" as a blanket exclusion, they conflate these distinct justifications. This underdetermination protects the practice from critique; when challenged on neuroscience, they retreat to pragmatism, and when challenged on pragmatism, they retreat to biological essentialism.

  ### The replacement test

  If we swapped the implicit theory for an Expected-Value-plus-Precaution view, your committee would face immediate institutional collapse. Concretely, every protocol involving organic matter would require a sentience risk assessment. A study using fruit flies would need to calculate the probability of nociception weighted by the number of flies. If the probability is non-zero, the sheer magnitude of N (fifty thousand) creates a massive expected suffering value, potentially outweighing high-benefit vertebrate studies. You would need to mandate anesthesia for insects or prove their deaths are instantaneous and painless.

  This view bites back in absurd ways. First, it extends beyond the lab. If the university is complicit in insect suffering, it must audit its groundskeeping (mowing grass kills insects) and cafeteria (agricultural insecticides). The committee's jurisdiction would explode beyond tractability. Second, it dilutes care. Spending hours debating the welfare of beetles reduces time available to scrutinize mouse protocols, likely increasing actual suffering among verified sentient beings. Third, it creates a paralysis of action. If any non-zero probability of sentience mandates protection, we cannot eat plants (harvesting kills insects) or walk on paths. The practice would become morally pure but functionally inert. The implicit theory, however philosophically shaky, acts as a necessary heuristic to keep ethical oversight focused on the highest-confidence cases. Replacing it with rigorous expected-value accounting doesn't just expand the circle of concern; it dissolves the circle entirely by making moral action impossible.
