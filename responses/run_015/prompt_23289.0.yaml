  ### Grading Comments

  **Passage:** *"The EMV approach says that when we are uncertain about which moral theory is true, we should act so as to maximize the expected moral value of our actions."*
  *   **Assessment:** **Correct.**
  *   **Comment:** This is an accurate, concise definition of the Expected Moral Value (EMV) framework, often associated with the "maximizing expected choice-worthiness" (MEC) view.

  **Passage:** *"The core idea is to treat each candidate moral theory... as a hypothesis, assign it a credence reflecting how confident we are that it is correct, and then pick the action that does best across the theories, weighted by those credences."*
  *   **Assessment:** **Correct.**
  *   **Comment:** You have correctly identified the structural analogy between moral uncertainty and descriptive uncertainty (standard decision theory). The use of "credence" and "hypothesis" is precise terminology for this context.

  **Passage:** *"In practice this amounts to computing a weighted average of the utility functions of the candidate theories: each theory tells us how much moral goodness each available action produces..."*
  *   **Assessment:** **Imprecise.**
  *   **Comment:** While "utility function" is often used as shorthand in the literature, it is technically imprecise when applied to non-consequentialist theories (e.g., deontology). Deontological theories typically assign *choice-worthiness* to actions based on rules or rights, not "moral goodness produced." A more rigorous answer would refer to "choice-worthiness functions" or note the difficulty of mapping non-consequentialist verdicts onto a cardinal scale. However, for an outline, this is acceptable shorthand.

  **Passage:** *"The most serious objection, I think, is that the approach cannot handle moral disagreement. When different people hold different moral views, there is no fact of the matter about which utility function to weight by..."*
  *   **Assessment:** **Wrong / Non-sequitur.**
  *   **Comment:** This is a significant conceptual error. EMV is a theory of *intrapersonal* moral uncertainty (how *I* should act given *my* uncertainty), not a theory of *interpersonal* moral aggregation (how *we* should act given *our* disagreement). The fact that other people hold different views does not render *my* expected value calculation arbitrary; EMV relies on the agent's own credences. The conclusion ("so the expected moral value is just as arbitrary") does not follow from the premise of disagreement. This confuses moral epistemology with social choice theory.

  **Passage:** *"The approach also seems to demand that we be able to assign precise credences to moral theories, which is difficult to justify."*
  *   **Assessment:** **Correct, but not the strongest.**
  *   **Comment:** This is a legitimate objection (often discussed as the "problem of subjective credences" or the arbitrariness of moral credences). However, in the context of the standard literature on EMV (e.g., MacAskill, Hedden), this is generally considered secondary to the **Intertheoretic Comparison Problem**. The claim that this is the "most serious objection" is debatable and likely incorrect for a graduate seminar context. The Comparison Problem (how to normalize values across fundamentally different structural theories, e.g., lexical vs. aggregative) is widely regarded as the more devastating technical objection because it threatens the mathematical coherence of the "weighted average" you described in the first paragraph.

  **Overall Assessment:**
  Your exposition of the EMV mechanism (Paragraph 1) is excellent and demonstrates a clear grasp of the formal structure of the view. However, your critical analysis (Paragraph 2) contains a fundamental category mistake regarding moral disagreement and misses the standard "killer objection" (Intertheoretic Comparison) discussed in the seminar. Because the prompt specifically asked for the *most serious* objection, the failure to identify the Comparison Problem significantly limits the score.
