answer: |-
  1. **0.55**

  2. **Decomposition**

  | Sub-question | Probability | Justification |
  | :--- | :--- | :--- |
  | **P1: Mathematical Core** | 0.95 | The proof holds whenever post-signal evaluations average to pre-signal evaluations (law of iterated expectations); full Bayesian conditionalisation is sufficient but not strictly necessary. |
  | **P2: Causal Inertness** | 0.70 | Purely evidential signals are rare; most real-world information carries signaling value or external consequences (e.g., insurance disclosure) that violate the inertness assumption. |
  | **P3: Preference Stability** | 0.40 | Preferences often shift with knowledge; redescribing outcomes to include belief states saves the theory but risks making expected-utility maximisation unfalsifiable by definition. |
  | **P4: EU as Rationality** | 0.50 | Non-expected-utility rules (e.g., ambiguity aversion) can be normatively defensible; if these rules reject free information, declaring them irrational begs the question. |
  | **P5: Ex Ante Authority** | 0.65 | The earlier self's evaluation is not always authoritative, particularly when later selves possess superior information or when commitment is impossible. |

  3. **Aggregation**
  I treat these as roughly independent necessary conditions for the universal truth of T. The headline number is approximately the product of these probabilities (0.95 × 0.70 × 0.40 × 0.50 × 0.65 ≈ 0.08), but this strict multiplication underestimates the thesis because the escape clauses (a–e) are disjunctive. A more accurate aggregation views T as claiming that for any case of avoidance, *at least one* clause applies. My credence of 0.55 reflects the probability that clause (e) — defining non-EU behavior as irrational — is accepted as a valid move in normative theory, weighted by the likelihood that clauses (a)–(d) cover the remaining realistic cases.

  4. **Sensitivity and Confidence**
  My final number is most sensitive to **P4**. If expected-utility maximisation is not the sole requirement of rationality, T collapses immediately, as alternative rational frameworks often value ignorance to hedge against ambiguity. I am least confident in **P3**. The strategy of enriching the outcome space to stabilize preferences is theoretically elegant but practically slippery; determining when it is a genuine defense versus a tautological shield is extremely difficult.

  5. **Evidence for Movement**
  To move my credence **up by 0.15**, you would need a rigorous demonstration that every documented case of information avoidance involves a hidden transaction cost or a commitment failure, leaving no residue for preference change or non-EU rationality. To move it **down by 0.15**, construct a concrete case where an agent with fixed preferences and no commitment problems rejects free information using a decision rule (like maxmin) that is widely accepted as rational in high-uncertainty environments, without violating coherence axioms unrelated to information value.

  6. **Diagnosis of Disagreement**
  Your disagreement likely centers on **P4**. Your partner (0.85) probably assumes that conformity to expected-utility axioms is constitutive of rationality, making T analytically true save for empirical exceptions (a–d). You (0.45) likely view rationality as broader, allowing for decision rules that legitimately reject information under ambiguity. To converge, your partner must concede that non-expected-utility maximisers can be rational, lowering their credence. You must concede that many apparent cases of non-EU behavior are actually failures of framing or hidden costs, raising yours. The meeting point lies in distinguishing structural ignorance from strategic avoidance.
