answer: |-
  This is a sophisticated diagnosis of a well-known impasse. You are correct that the field is suffering from a category error, but it is deeper than a mere labeling dispute. It is a clash between **functionalist/reductionist** explanations (Lewis, Ullmann-Margalit, Sugden) and **constitutive/psychological** accounts (Bicchieri, Elster, Brennan/Eriksson).

  Here is the diagnosis of the disagreement, an evaluation of your "broadcast equilibria" probe, and a recommendation for what constitutes genuine progress.

  ### 1. Diagnosis: Genealogy vs. Constitution

  The standoff persists because the two camps are answering logically distinct questions while using the same noun ("norm").

  *   **The Lewisian Camp (The Genealogical Question):** They are asking, *"How can a stable regularity of behavior emerge and persist among rational egoists without prior agreement?"* Their goal is to show that normative phenomena are reducible to game-theoretic equilibria. For them, "normativity" is an ex-post rationalization or a payoff modifier (sanctions). If the behavior is stable and arbitrary, it is a convention; if you add sanctions, it's a norm, but the *logic* of stability remains identical.
  *   **The Normativist Camp (The Constitutive Question):** They are asking, *"What motivational structure distinguishes a social norm from a mere habit or regularity?"* Their goal is to capture the phenomenology of obligation. For them (especially following Bicchieri), a norm *requires* conditional preferences based on **normative expectations** (belief that others think one *ought* to conform), not just **empirical expectations** (belief that others *will* conform).

  **The Artifact:** The Lewisians treat normative expectations as a subset of empirical expectations (I expect you to sanction me, so I conform). The Normativists treat normative expectations as a distinct psychological state (I conform because I accept the rule, or fear social disapproval rooted in a shared 'ought').

  Your hypothesis is correct: The Lewisians are modeling the **genesis** of regularities (Question 1), while the Normativists are defining the **ontology** of norms (Question 2). The dispute arises because Lewisians claim Question 1 exhausts Question 2, while Normativists claim Question 2 is irreducible to Question 1.

  ### 2. Evaluation of the "Broadcast Equilibria" Case

  Your thought experiment isolates **empirical expectations** (the public percentage) while removing **individual observability** and **sanctioning capacity**.

  *   **Lewisian Reception:** They will claim this is decisive evidence for their side. It demonstrates that complex, stable regularities can arise and persist purely through belief-updating on aggregate data without any "normative glue." It proves that the *function* of a norm (coordination/stability) does not require the *phenomenology* of a norm.
  *   **Normativist Reception:** They will dismiss this as irrelevant to the definition of a norm. Since agents cannot sanction and do not hold normative expectations (they only react to statistical probability), this is merely a **descriptive regularity** or a statistical equilibrium. It fails the "anonymity-proof" and "sanction" criteria. They will argue you have modeled a market dynamic or an information cascade, not a norm.

  **Verdict:** The broadcast case is **evidence that each framework is answering a different question.**

  It will not break the deadlock because it is designed to strip away the very features the Normativists claim are essential. To the Normativist, a "norm without normative expectations" is a contradiction in terms, like "a bachelor who is married." To the Lewisian, "normative expectations" are just a verbose description of higher-order empirical beliefs about sanctions. Your case validates the Lewisian *genealogy* while confirming the Normativist *constitution*. It shows that the *behavior* can exist without the *attitude*, which is exactly what the Lewisians argue (norms are just behavior + incentives) and what the Normativists deny (norms *are* the attitudes).

  ### 3. What Counts as Progress?

  Since the impasse is definitional and ontological, new static cases (like tipping or queueing) will not help. Progress requires shifting the focus from **classification** to **transition**.

  Here are three specific avenues for progress, ranked by promise:

  #### A. The Transition Mechanism (Highest Promise)
  Instead of asking "Is this a norm or a convention?", ask: **"Under what dynamic conditions does a Lewisian convention acquire Normativist force?"**
  This bridges the two questions. You accept the Lewisian account of the *origin* (broadcast equilibrium) but investigate the *evolution* into a norm.
  *   **Research Program:** Model a population starting with your broadcast equilibrium. Introduce a mechanism for "internalization" or "signaling of type." At what threshold does the preference structure shift from "I do X because it is optimal given the percentage" to "I do X because I prefer to be the kind of person who does X"?
  *   **Why it works:** It grants the Lewisians the starting point and the Normativists the end point. It treats "normativity" not as a binary switch but as an evolved trait that stabilizes equilibria against noise or invasion.

  #### B. Formal Distinction of Expectations (High Promise)
  Adopt and formalize Bicchieri's distinction between **Empirical Expectations** (EE) and **Normative Expectations** (NE), but treat NE as an endogenous variable rather than a primitive.
  *   **Research Program:** Show mathematically when EE *transforms* into NE. For example, when the cost of deviation becomes socially visible (even if not sanctionable), does EE harden into NE?
  *   **Why it works:** It forces the Lewisians to acknowledge that the *payoff function* changes when NE enters the picture (guilt/shame costs are non-linear), and it forces Normativists to acknowledge that NE must have an evolutionary history rooted in EE.

  #### C. Honest Expectation of Impasse (Low Promise)
  Accept that "Norm" is a cluster concept with no essential definition.
  *   **Research Program:** Stop trying to define "The Social Norm." Use precise terminology: "Equilibrium Regularity" vs. "Injunctive Norm."
  *   **Why it works:** It clears the conceptual fog but may feel like surrendering the core philosophical question.

  ### Recommendation

  Your "broadcast equilibria" are a strong tool, but only if you reframe their purpose. Do not present them as *norms*. Present them as the **pre-normative substrate**.

  **The Progress Move:**
  Publish a model showing that **Broadcast Equilibria are unstable against small groups of "Normativists."**
  If you can show that a population operating on your broadcast logic is vulnerable to invasion by a small subset of agents who *do* hold normative expectations and sanction (even at a cost to themselves), you demonstrate two things:
  1.  Lewisian regularities are evolutionarily fragile (countering the Lewisian claim of sufficiency).
  2.  Normative attitudes serve a functional role in stabilizing regularities (countering the Normativist claim that normativity is sui generis/non-functional).

  This moves the field from "What is a norm?" to "What is the evolutionary stability of normative attitudes compared to mere regularities?" That is a question both camps can answer, and their answers might actually converge.
