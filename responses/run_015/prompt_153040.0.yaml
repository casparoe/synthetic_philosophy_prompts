answer: |-
  This is a sophisticated distinction, and it is definitely worth writing out. You are touching on a genuine gap in the literature between standard **Lexical Negative Utilitarianism (LNU)** and **Incommensurability Views**.

  To answer your primary question: No, this is not just Lexical NU with a metaphor. Lexical NU typically relies on a mathematical infinity or a strict ordering (Pain > *any* Pleasure). Your view relies on a *category failure* in the evaluation mechanism itself. That is a structural difference, not just a rhetorical one.

  However, there are significant coherence challenges you need to address to make this hold water in a seminar context. Here is a breakdown of where the argument is strong, where it risks collapsing, and how to defend the directional claim.

  ### 1. The Tension: Dominance vs. Incommensurability
  The biggest philosophical hurdle in your proposal is the conflict between two claims you are making simultaneously:
  1.  **Incommensurability Claim:** Pleasure becomes the "wrong currency" (conceptually distinct, no common measure).
  2.  **Dominance Claim:** Pain can still "dominate" pleasure in that zone.

  **The Problem:** In value theory, if two things are truly incommensurable (like the "wrong currency"), neither can dominate the other. If I offer you a poem to pay a debt, you don't say the debt is "heavier" than the poem; you say the comparison is void. If pain *dominates* pleasure, that implies there *is* a scale, and pain is just infinitely higher on it (which is standard Lexical NU).

  **The Fix:** You need to refine what "dominate" means here. You aren't arguing that pain has *more value* than pleasure in that zone. You are arguing that severe pain has **veto power** or **normative silencing** capacity that pleasure lacks.
  *   *Reframing:* Don't say pain "outweighs" pleasure. Say that severe pain **silences the normative force** of pleasure. Pleasure still exists, but it loses its ability to generate moral credit *in the presence of* locked suffering. This avoids the "shared scale" implication of dominance while keeping the practical outcome.

  ### 2. The "Gradient" vs. The "Lock"
  You call the view "Gradient-locked," but your description ("once you cross into severe suffering") implies a binary threshold.
  *   **If the lock is binary:** You inherit the standard **Arbitrariness Objection** leveled at Lexical NU. Why does one extra unit of pain intensity suddenly turn pleasure into "wrong currency"? If the threshold is at intensity level 100, is level 99.9 really commensurable?
  *   **If the lock is a gradient:** This is where your view becomes novel and robust. Instead of a switch flipping, argue that **commensurability fades**. At low pain, 1 unit of pain = 1 unit of pleasure. At medium pain, 1 unit of pain = 1.5 units of pleasure. At severe pain, the exchange rate approaches infinity (or the mechanism breaks).
  *   **Recommendation:** Lean into the "Gradient" part of your title. If you argue that the *capacity for pleasure to commensurate* degrades as pain intensifies, you avoid the sharp cliff-edge objection. The "lock" isn't a wall; it's an asymptote.

  ### 3. Is the "Wrong Currency" Framing Misleading?
  It is risky, but potentially powerful if qualified.
  *   **The Risk:** It sounds like a category mistake. Pain and pleasure are both phenomenological states. To say they are different "kinds" of value requires explaining why they are the same kind at low levels but different kinds at high levels.
  *   **The Defense:** You need a phenomenological argument. At low levels, pain is merely "unpleasantness" (a negative sensation). At extreme levels, pain becomes "suffering" (a destruction of agency or self). If you can argue that extreme pain changes *ontological category* (from sensation to destruction), then the "wrong currency" metaphor holds. Pleasure adds to the self; extreme pain unmakes the self. You cannot offset "unmaking" with "adding."

  ### 4. Existing Concepts (Without the Bibliography)
  You are not reinventing the wheel, but you are assembling the parts in a new way. Be aware of these conceptual neighbors so you can distinguish your view:
  *   **Trumpling:** Some philosophers distinguish "trumping" (one value always wins) from "trumping" (one value makes the other irrelevant). Your view is closer to the latter.
  *   **Imprecise Lexicality:** There is existing discussion on whether lexical thresholds are sharp or vague. Your "gradient" approach aligns with the "vague" camp but adds the asymmetrical twist.
  *   **Asymmetric Axiology:** There is a broader class of views that treat positive and negative value differently. Your specific contribution is the *mechanism* of the asymmetry (failure of comparison vs. difference in weight).

  ### 5. Defending the Directional Claim
  You asked if the directional claim (Pain silences Pleasure, but not vice versa) can be defended without stipulation. You cannot simply assert it; you need a grounding principle. Two paths work best here:

  **A. The Phenomenological Asymmetry**
  Argue that pleasure and pain are not mirror images. Pleasure is often an *enhancement* of state, while severe pain is an *interruption* or *destruction* of state. It is logically easier to interrupt a process than to enhance it. Therefore, the "interruptive" value (pain) has a structural priority over the "enhancing" value (pleasure) when the interruption becomes total.

  **B. The Moral Attention Argument**
  Argue that moral attention is finite. Severe suffering demands *all* available moral attention. If all attention is required to address the suffering, there is no attention left to "count" the pleasure. Pleasure isn't negated; it is rendered morally invisible by the urgency of the pain. This explains the one-way lock: Pleasure never demands *all* attention, so it never silences pain.

  ### 6. Is It Interesting Enough?
  Yes. Standard Negative Utilitarianism is often dismissed because of the "Infinity Problem" (it implies we should destroy the world to prevent potential future pain) or the "Arbitrariness Problem" (where is the threshold?).
  *   Your view avoids the Infinity Problem if you frame it as "silencing" rather than "infinite weight."
  *   Your view mitigates the Arbitrariness Problem if you commit to the "fading commensurability" (gradient) rather than a hard threshold.

  ### Summary of Advice for the Essay Structure
  1.  **Define the Mechanism:** Be very precise about whether the "lock" is a switch or a fade. A fade is philosophically safer.
  2.  **Resolve the Dominance Tension:** Explicitly address the conflict between "incommensurable" and "dominates." Adopt the "Normative Silencing" or "Veto" language.
  3.  **Ground the Asymmetry:** Don't just stipulate that pain is special. Use the "Destruction vs. Enhancement" or "Moral Attention" arguments to explain *why* the asymmetry exists.
  4.  **Test Case:** Apply your view to a "World of Mild Pleasure vs. One Tortured Victim." Standard Utilitarianism sacrifices the victim. Lexical NU saves the victim but implies the victim's pain is *infinitely* worse than all that pleasure. Your view saves the victim because the pleasure *fails to register* against that specific intensity of pain, not because the math goes to infinity.

  **Verdict:** The core idea is coherent provided you resolve the "incommensurability vs. dominance" tension. It is a viable, nuanced position that improves on standard Lexical NU. It is absolutely worth writing.
