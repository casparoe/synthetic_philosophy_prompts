  (1) Mostly mistaken: Conflates no speculative trade with no information aggregation; ignores how noise enables signaling.
  (2) Mostly right: Correctly identifies NTT as a benchmark, not empirical law; assumptions are fragile in practice.
  (3) Mostly right: Different priors undermine normative aggregation claims; model flexibility becomes a unfalsifiable bug.
