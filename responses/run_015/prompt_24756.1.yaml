      *   **Audience:** Legal scholars (2 securities-fraud lawyers, 1 criminal law prof) drafting regulatory guidance for a financial services regulator.
      *   **Audience Values:** Enforceability, liability, precedent (existing fraud law relies on *mens rea* like intent/knowledge).
