      *   Specific pushback on "deceptive alignment"? Included.

  8.  **Final Polish:** Ensure the distinction between *criminal fraud* (which needs intent) and *regulatory guidance* (which can be behavioral) is clear in the replies. The user is talking to a regulator drafting *guidance*, not a legislature writing a penal code. This is the wedge.

