      *Let's write the replies.* Focus on: Regulatory guidance $\neq$ Criminal Code. Prevention $\neq$ Punishment. Deployer responsibility.

      *Soft spots:* Acknowledge where the behavioral definition struggles (e.g., distinguishing bugs from lies).

