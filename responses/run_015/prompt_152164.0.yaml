answer: |-
  The DSM is a revolving door, specifically when it comes to personality disorders and neurodevelopmental conditions. Every few years, the psychiatrists gather, shuffle the criteria, merge the subtypes, or rename the syndromes, and the public wonders why science can't seem to make up its mind. Ian Hacking gave us the classic tool to understand this: "looping effects." His idea is that classifying people changes the people, which in turn forces the classification to change. It's a dynamic equilibrium. But looking at the recent history of the DSM—specifically the battles over Autism Spectrum Disorder and Borderline Personality Disorder—Hacking's loop feels too smooth. It implies a dance; what we're actually seeing is a mosh pit.

  I'm arguing for a distinction between Hacking's looping and what I'm calling "taxonomic recoil." They are not just opposite directions of the same feedback mechanism. They are fundamentally different modes of interaction between the classifier and the classified. Hacking's looping explains how a category *persists* by evolving. Taxonomic recoil explains why a category *fractures* under pressure. If we want to understand why the personality and neurodevelopmental sections of the manual are in a state of perpetual crisis, taxonomic recoil does the heavier explanatory work.

  To see the difference, we have to look at the agency involved. In Hacking's model of interactive kinds, the classified person often adopts the classification as a way of being in the world. If you tell a child they have ADHD, they may begin to understand their restlessness through that lens, perhaps leaning into it or managing it in ways that align with the diagnosis. The category becomes a script, and the person performs it. The "loop" closes when the clinicians observe this performance and tweak the criteria to match the new reality. The authority of the taxonomy remains intact; it just bends. It's a co-evolution where the taxonomy survives by accommodating the human variation it describes.

  Taxonomic recoil is different because it is antagonistic rather than accommodative. It doesn't seek to fit the label; it seeks to break it. When autism self-advocates pushed back against the DSM-5's decision to fold Asperger's into a broader Autism Spectrum, they weren't trying to help the DSM describe them better. They were arguing that the taxonomy itself was violent, that it erased specific support needs, and that the clinical gaze was fundamentally misaligned with the lived reality of neurodivergence. This isn't a loop where the category shifts to match the person; it's a collision where the person pushes the category away.

  The same applies to Borderline Personality Disorder (BPD). Patients and advocates have long argued that "Borderline" is a stigmatizing slur masquerading as a diagnosis, often used to dismiss women's trauma responses as personality defects. The resistance here isn't about performing "borderline" traits more accurately; it's about rejecting the moral framing of the diagnosis entirely. When a group engages in taxonomic recoil, they are challenging the legitimacy of the classifier, not just the accuracy of the classification.

  So, are these just opposite directions? No. If looping is a thermostat maintaining a temperature, recoil is smashing the thermostat because you disagree with the concept of temperature control. Looping preserves the system's authority by allowing it to adapt. Recoil threatens the system's authority by exposing its political and ethical vulnerabilities. Hacking's model assumes a certain level of buy-in from the classified group. They have to accept the game enough to play it. Recoil happens when the players decide the game is rigged and flip the table.

  This distinction matters immensely when we ask why the DSM's personality and neurodevelopmental sections are rewritten so constantly. If we rely solely on Hacking, we'd say these sections change because the phenomena are complex and evolving. That's true, but it's passive. It suggests the changes are organic. But the changes in these specific sections are driven by conflict.

  Medical diagnoses for non-psychiatric conditions don't loop or recoil in the same way. If the definition of a broken femur changes, it's because of better imaging technology, not because people with broken legs organized a protest against the term "femur." But personality and neurodevelopmental diagnoses are constitutive of identity. They don't just describe what you *have*; they describe who you *are*. When a diagnosis touches the core of the self, the stakes for the classified individual skyrocket. You can manage a disease; you inhabit a personality type.

  Because these diagnoses are identity-laden, they invite political resistance. The neurodiversity movement didn't just offer new data; they offered a new ontology. They argued that autism isn't a disorder to be classified but a difference to be accommodated. This is taxonomic recoil in its purest form: a refusal to be a "kind" of person in the pathological sense. The DSM-5 revisions weren't just scientific updates; they were diplomatic treaties negotiated after significant recoil. The removal of Asperger's wasn't purely data-driven; it was an attempt to streamline a category that was fracturing under the weight of community identity politics.

  Hacking's looping effect is excellent for explaining how a category like "multiple personality disorder" evolved into "dissociative identity disorder" as patients and therapists co-constructed the symptoms. That was a loop. But the current instability in the DSM is better explained by recoil. We are seeing a shift from co-construction to confrontation. The classified groups are no longer waiting for the clinicians to update the manual; they are publishing their own manifestos, demanding language changes, and threatening the validity of the entire diagnostic framework.

  If we stick with Hacking, we risk sanitizing this conflict. We might view the DSM revisions as a natural, scientific progression of knowledge catching up to reality. But viewing it through taxonomic recoil reveals the power dynamics. The manual keeps getting rewritten because the people inside the categories are refusing to stay put. They are not merely "looping" into new shapes; they are pushing back against the mold.

  Ultimately, Hacking gives us a mechanics of change, but recoil gives us a politics of change. For the personality and neurodevelopmental sections, the politics are the engine. The reason these sections are unstable isn't just that the human mind is complex; it's that the people diagnosed there have gained the agency to say, "This label does not fit, and we won't let it." That friction generates heat, and that heat is what melts the criteria down for recasting.

  So, to answer the prompt directly: these are not the same mechanism. Looping is adaptive; recoil is disruptive. And while Hacking's framework is a classic for a reason, it treats the classified subject as too passive for the current landscape. Taxonomic recoil captures the volatility of modern psychiatry because it acknowledges that when you classify a human being, you aren't just pinning a butterfly. You're engaging in a negotiation, and increasingly, the butterflies are biting back. The DSM isn't just evolving; it's under siege. Until the taxonomy accounts for the resistance it generates, not just the behaviors it describes, the rewriting will continue. Recoil isn't a side effect of the system; it's the driving force of its instability.
