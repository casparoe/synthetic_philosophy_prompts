  ## Part 2: The Questionnaire

  Read the following ten claims regarding algorithmic systems. For each, select the **one** option that best matches your philosophical intuition. Do not worry about technical definitions; trust your immediate judgment about the status of the claim.

  **1. "The loan approval model is fair."**
  *(Given that statistical parity and calibration cannot be simultaneously satisfied.)*
  *   (A) Yes, it is fair.
  *   (B) No, it is not fair.
  *   (C) It cannot be simply called fair or unfair.

  **2. "The model decided to deny the application."**
  *(Given the system is deterministic but stochastic noise was injected.)*
  *   (A) Yes, it decided.
  *   (B) No, it merely computed.
  *   (C) "Decided" is not the right word here.

  **3. "The model understands the text it was given."**
  *(Given it passes Turing-style tests but lacks phenomenology.)*
  *   (A) Yes, it understands.
  *   (B) No, it simulates understanding.
  *   (C) The question of understanding doesn't apply.

  **4. "The training data is representative of the population."**
  *(Given historical biases are encoded in the history.)*
  *   (A) Yes, it matches the history.
  *   (B) No, it mismatches the ideal.
  *   (C) "Representative" is ambiguous here.

  **5. "It is still the same model after fine-tuning."**
  *(Given 10% of weights changed, but architecture remained.)*
  *   (A) Yes, it is the same model.
  *   (B) No, it is a new version.
  *   (C) Identity is indeterminate in this case.

  **6. "The company knew the product was unsafe."**
  *(Given knowledge was distributed across teams, no single agent knew.)*
  *   (A) Yes, the company knew.
  *   (B) No, only individuals knew.
  *   (C) Corporate knowledge is inexpressible in these terms.

  **7. "The output was the system's assertion that P."**
  *(Given the system generates text without belief.)*
  *   (A) Yes, it asserted P.
  *   (B) No, it emitted tokens.
  *   (C) It is neither assertion nor mere emission.

  **8. "The harm was caused by the algorithm rather than by the people."**
  *(Given humans deployed it, but the specific error was emergent.)*
  *   (A) Yes, the algorithm caused it.
  *   (B) No, the deployers caused it.
  *   (C) Causation is shared/indivisible.

  **9. "The data subject consented."**
  *(Given they clicked 'I Agree' without reading a 50-page terms of service.)*
  *   (A) Yes, they consented.
  *   (B) No, consent was invalid.
  *   (C) Consent is not a binary state here.

  **10. "The system is biased."**
  *(Given the bias is only visible when comparing two specific subgroups.)*
  *   (A) Yes, it is biased.
  *   (B) No, it is neutral.
  *   (C) Bias is relative to the comparison class.

