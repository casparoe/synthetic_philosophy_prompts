  # HANDOUT: The Logic of Algorithmic Disagreement

  ## Part 1: The Logical Space (The Spine)

  Before looking at the cases, we need to map the logical territory. When we assess a claim (e.g., "The model is fair"), we are implicitly answering three underlying questions. Your intuitions about the cases below will place you in one of eight logical cells.

  **The Three Questions:**
  1.  **Assertion:** Does the claim hold? (Yes / No)
  2.  **Denial:** Does the denial of the claim hold? (Yes / No)
  3.  **Inexpressibility:** Is the claim the sort of thing that resists being described as holding or not holding? (Yes / No)

  **The Eight Cells:**
  Combining these answers generates eight possible positions. Seven of these correspond to the traditional Jain *saptabhaṅgī* (sevenfold schema). The eighth is theoretically problematic.

  | Cell | Assertion (Is) | Denial (Is Not) | Inexpressible | Traditional Label | Analytic Approximation |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Yes | No | No | *Syāt asti* | Classical Truth / Realism |
  | **2** | No | Yes | No | *Syāt nāsti* | Classical Falsity / Realism |
  | **3** | Yes | Yes | No | *Syāt asti nāsti* | Dialetheism / Glut Theory |
  | **4** | No | No | Yes | *Syāt avaktavya* | Radical Skepticism / Quietism |
  | **5** | Yes | No | Yes | *Syāt asti avaktavya* | Truth + Inexpressibility |
  | **6** | No | Yes | Yes | *Syāt nāsti avaktavya* | Falsity + Inexpressibility |
  | **7** | Yes | Yes | Yes | *Syāt asti nāsti avaktavya* | Full Non-One-Sidedness |
  | **8** | **No** | **No** | **No** | **(Empty)** | **Madhyamaka / Null View** |

  **Note on Cell 8 (The Empty Cell):**
  This cell represents a refusal to assert the claim, refuse its denial, *and* refuse to call it inexpressible. It is a total suspension of ontological commitment.
  *   **Who sits here?** A strict Madhyamaka (emptiness of all views) or a Pyrrhonian skeptic who refuses to even assert that "nothing can be asserted."
  *   **The Jain Reply:** To assert "None of the above" is itself an assertion. You have implicitly adopted a standpoint (Cell 4 or Cell 7). To deny all three is to claim a "view from nowhere," which Jainism argues is impossible; all knowledge is indexed to a standpoint (*naya*).

