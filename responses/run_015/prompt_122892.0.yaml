  On the father and son: you're mistaking protection for concealment. The point isn't to let the theft stand, but to ensure the rectification happens within the bond so the relationship survives corrected. In your case, going to your manager isn't nepotism; it's honoring the role of "mentee" so he can own the fix. If you bypassed him to satisfy an abstract rule, you'd treat him as a stranger, destroying the relational fabric that actually makes work possible. We fix the leak because our roles demand integrity, but we fix it *through* our relationships, not by burning them down for the sake of impartiality.

  This is about 85% faithful to the traditional commitment on relational rectification, but I'm least confident equating modern corporate professional roles with traditional familial bonds without stretching the analogy.
