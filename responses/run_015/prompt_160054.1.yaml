      *   *Layer 1: Epistemic Burdens (The User's Point 1).* This is the "Compiler Warning" level. Is the belief guilty until proven innocent (debunker) or innocent until proven guilty (realist)? In CS terms: Is the module trusted by default, or does it need unit tests before deployment?
      *   *Layer 2: Modal Scope/Counterfactuals (The User's Point 2).* This is the "Test Environment" level. Are we simulating changes to the ground truth (moral facts) or the training data (evolutionary pressure)?
