answer: |-
  Your hypothesis is sharp. You have correctly identified the two main structural friction points causing the stall. However, there is a third, deeper layer lurking beneath them that often disguises itself as one of the other two.

  Here is the diagnosis of the stalemate, structured by the layers of disagreement.

  ### 1. The Epistemic Default (The "Trust" Layer)
  You identified this as "explanation-required versus innocent-until-defeated." In software terms, this is a disagreement about **trusted computing base**.

  *   **The Debunker's Stance:** Moral intuition is an unverified external library. Before you import it into your core logic, you need documentation proving it returns accurate values. If the documentation says "optimized for runtime speed (fitness), not accuracy (truth)," you cannot trust the output without an independent audit.
  *   **The Realist's Stance:** Moral intuition is part of the kernel. You cannot run the audit without using the kernel. Demanding an independent justification for your basic cognitive faculties is a category error; it leads to global skepticism (you could debunk math or logic the same way). Therefore, the default setting is "trusted" until a specific bug is found.

  **Why this stalls:** The Debunker thinks the Realist is begging the question (assuming the kernel is good to prove the kernel is good). The Realist thinks the Debunker is demanding the impossible (stepping outside your own skin to check if your skin fits). Neither can move because they disagree on the *starting conditions* of the debate.

  ### 2. The Counterfactual Setup (The "Test Environment" Layer)
  You identified this as "which variable to hold fixed." In testing terms, this is a disagreement about **mocking dependencies**.

  *   **The Debunker's Test:** Hold the *Moral Facts* constant. Vary the *Evolutionary Pressures*.
      *   *Query:* "If survival required cruelty, would we still believe cruelty is wrong?"
      *   *Result:* If the answer is "No, we'd believe cruelty is right," then our beliefs don't track the facts; they track the pressures.
  *   **The Realist's Test:** Hold the *Evolutionary Pressures* (and human nature) constant. Vary the *Moral Facts*.
      *   *Query:* "Could the moral facts have been different?"
      *   *Result:* Many Realists argue moral facts are necessary truths (like math) or supervene on natural facts. If they couldn't have been different, the Debunker's test is invalid. You can't mock a singleton.

  **Why this stalls:** The Debunker assumes moral facts are contingent enough to be varied in a thought experiment. The Realist often assumes moral facts are necessary or tightly bound to natural facts, making the Debunker's counterfactual incoherent. They are running tests against different API specifications.

  ### 3. The Hidden Variable: The Ontology of the Target (The "Data Structure" Layer)
  This is the part your hypothesis misses, and it is likely the engine driving the other two. The stalemate persists because the two sides are often implicitly arguing about **what kind of object "moral truth" is.**

  *   **If Moral Truth = Natural Fact:** (e.g., "Good" means "conducive to flourishing"). Then evolution *could* track it, because flourishing correlates with fitness. The "misaligned optimizer" analogy breaks down because the objective functions overlap.
  *   **If Moral Truth = Non-Natural Fact:** (e.g., "Good" is a sui generis, Platonic property distinct from physical reality). Then evolution *cannot* causally track it, because physical processes don't interact with non-physical properties.

  **The Diagnosis:** The Debunker usually assumes the Non-Natural definition (making tracking impossible), while the Realist often assumes the Natural definition (making tracking plausible) or denies the need for causal tracking entirely. They argue about *epistemology* (how we know) when they actually disagree about *metaphysics* (what exists). The "explanation" demand is only reasonable if the moral facts are the kind of thing that *could* enter into causal explanations.

  ### What Would Count as Progress?

  Given this diagnosis, empirical findings about evolutionary psychology will **not** resolve the debate. Knowing exactly which traits were selected doesn't tell us whether those traits track truth or just fitness, because that depends on the definition of truth (Layer 3).

  Progress would require one of three things:

  1.  **A Unified Epistemic Framework:** A neutral account of "defeaters" that satisfies both sides. For example, showing that "global skepticism" is avoidable without granting "innocent until defeated" to *all* intuitions. We need a criterion that explains why we trust logic but should scrutinize morality, without begging the question.
  2.  **Ontological Clarity:** A consensus on whether moral facts are natural or non-natural. If Realists concede moral facts are non-natural, they must explain how a physical brain accesses them without causal contact. If Debunkers concede moral facts are natural (fitness proxies), the debunking argument loses its force.
  3.  **A Shift to Pragmatics:** Abandoning the "tracking" metaphor entirely. If both sides agree that "truth" in ethics is not about correspondence to external facts but about coherence within a practical system, the evolutionary argument becomes irrelevant. (This is essentially dissolving the problem rather than solving it).

  **Honest Assessment:** Nothing will likely resolve this soon. It is a "frame problem." The disagreement is about the rules of the game, not the moves within it. As long as one side plays Chess and the other plays Go, pointing out a bad move in Chess won't convince the Go player.

  ### Confidence and Uncertainty

  **Confidence Level:** High (85%).
  The structure of the debate is well-mapped in metaethics, and your intuition about the epistemic and modal disagreements is correct. The addition of the ontological layer is standard analysis among specialists.

  **Least Sure Part:**
  I am least sure about the claim that **Ontological Clarity (Point 2 above)** would actually solve the stalemate.
  *Reasoning:* Even if everyone agreed on what moral facts *are* (e.g., "Okay, they are non-natural"), the Debunker would still say "You can't know them" and the Realist would still say "You don't need causal contact to know them." The epistemic disagreement (Layer 1) might be more fundamental than the ontological one. The stalemate might be purely about the standards of justification, regardless of what is being justified.
