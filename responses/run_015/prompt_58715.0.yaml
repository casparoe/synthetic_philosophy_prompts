answer: |-
  ### Brainstorming Vulnerabilities of the Strong Lock-In View

  Before drafting the questions, it is necessary to identify where the strong lock-in thesis is most susceptible to critique. This ensures the interview probes the weak points of the historian's position rather than allowing them to rehearse established arguments.

  1.  **The Efficiency Critique:** Critics like Liebowitz and Margolis argue that if a lock-in is truly inefficient, profit opportunities arise for entrepreneurs to switch technologies. If the switch does not happen, the 'locked-in' technology may actually be efficient given the specific context, rather than a historical accident.
  2.  **Functional Convergence:** Strong lock-in emphasises the contingency of *form* (tubes vs. lorries). However, economic history often shows convergence of *function* (delivery speed). If the economic demand exists, does the specific technology matter for the broader historical outcome?
  3.  **Agency and Politics:** Lock-in theories often treat technological systems as autonomous forces that crush agency. Yet, states and municipalities frequently break technical standards through regulation, taxation, or nationalisation. The theory must account for the threshold of political will required to override increasing returns.
  4.  **Measurement of Increasing Returns:** It is difficult to empirically distinguish between genuine network effects (the system gets better the more it is used) and mere sunk cost fallacy (refusing to switch because money was already spent). The historian must clarify how they measure this distinction in the archive.

  ***

  ### Interview Questions for the Economic Historian

  **1. Mechanism of Persistence (General)**
  *   **Main Question:** You argue that increasing returns create effective irreversibility. However, how do you empirically distinguish between a system sustained by genuine network effects—where each additional user adds value—and a system sustained merely by the sunk cost fallacy, where agents irrationally refuse to abandon prior investments?
  *   **Likely Reply:** The historian will likely argue that in the 19th-century context, information was imperfect and capital markets were less efficient, meaning rational actors could not easily calculate the long-term benefits of switching, thus sustaining the sunk cost behaviour as a rational response to uncertainty.
  *   **Follow-up:** If uncertainty is the shield protecting the lock-in, does your theory not collapse into a claim about information asymmetry rather than technological path dependence? At what point does prolonged uncertainty become an institutional feature maintained by vested interests, rather than a natural market condition?

  **2. Mechanism of Persistence (Merrivale Specific)**
  *   **Main Question:** In Merrivale, the pneumatic tube network dictated standardised crate sizes and warehouse door widths. Is this persistence a case of technical complementarity, where the physical infrastructure makes switching prohibitively expensive, or is it merely habitual inertia disguised as technical necessity?
  *   **Likely Reply:** They will likely contend that the physical integration of the tubes into the warehouse architecture represents a high switching cost that constitutes a genuine technical lock-in, distinct from mere habit.
  *   **Follow-up:** Yet, warehouse doors can be rebuilt and crates resized over a depreciation cycle. If the motor lorry offers a significant enough cost advantage, why does the depreciation cycle not naturally facilitate the switch? Are you suggesting the physical infrastructure is immutable, or that the capital holders refuse to depreciate it?

  **3. Counterfactual Test for Inevitability (General)**
  *   **Main Question:** When testing for inevitability, how do you separate the sameness of function from the sameness of form? If Merrivale had not built the tubes, is it possible that the economic demand for rapid small-parcel delivery would have produced a different technological solution with the same economic outcome?
  *   **Likely Reply:** The historian will probably maintain that while the *demand* for delivery is inevitable, the *specific economic structure* created by the tubes (e.g., centralised depots vs. distributed hubs) is contingent and shapes subsequent industrial relations in ways a different technology would not.
  *   **Follow-up:** If the downstream effects on industrial relations are the only differentiator, does the lock-in matter materially to the broader economic history, or is it merely a stylistic divergence? How do you quantify whether those industrial relation differences are significant enough to alter the city's economic trajectory?

  **4. Counterfactual Test for Inevitability (Merrivale Specific)**
  *   **Main Question:** Suppose the tube network was never authorised in the 1840s. Would the pressure for speed have compelled Merrivale to narrow its street layouts to accommodate hand-carts, or would it have widened them for horses? Does your model predict a specific physical counterfactual?
  *   **Likely Reply:** They might argue that without the tubes, the city would have defaulted to the standard broad-street model common in other port cities to accommodate heavy wagons, sacrificing speed for capacity.
  *   **Follow-up:** But if Merrivale's competitive advantage was specifically speed, would market forces not have compelled the narrow streets regardless of the technology? If the street layout is determined by the economic priority of speed rather than the tube technology itself, is the tube truly the cause of the lock-in or merely a symptom of the priority?

  **5. Reversibility and Agency (General)**
  *   **Main Question:** What magnitude of exogenous shock is required to break a lock-in established by increasing returns? Must it be a catastrophic failure of the technology itself, or can political coordination alone override the economic incentives of the network?
  *   **Likely Reply:** The standard defence would be that political intervention usually fails unless the technology is already failing economically; otherwise, the cost of subsidising the alternative is too high for the state to sustain.
  *   **Follow-up:** History provides examples of states sustaining inefficient technologies for strategic reasons indefinitely. If the state can sustain the cost, does your theory of economic lock-in not yield to political will? Where is the threshold where politics trumps increasing returns?

  **6. Reversibility and Agency (Merrivale Specific)**
  *   **Main Question:** In Merrivale, municipal insurance statutes favour buildings connected to the tube network. Could a revision of these statutes alone unlock the system, or is the technical entrenchment too deep for regulatory changes to matter?
  *   **Likely Reply:** They will likely suggest that insurance statutes are a secondary reinforcement; the primary lock-in is the physical network and the skilled labour force, so changing the statutes would have negligible effect.
  *   **Follow-up:** If the statutes are merely secondary, why were they enacted? Does their existence not prove that the lock-in was already perceived as fragile enough to require legal protection? If the law was needed to sustain the network, is the lock-in economic or legislative?

  **7. Mechanism of Persistence (Coordination Effects)**
  *   **Main Question:** You cite coordination effects as a pillar of lock-in. However, does this not presuppose a level of communication and collusion among competitors that might be illegal or impractical in a competitive 19th-century market?
  *   **Likely Reply:** The historian may argue that coordination does not require explicit collusion but emerges naturally as firms align standards to reduce transaction costs with one another.
  *   **Follow-up:** If alignment emerges naturally to reduce costs, is it not evidence of market efficiency rather than path dependence? How do you distinguish between firms coordinating to save money versus coordinating to maintain a monopoly on a legacy technology?

  **8. Counterfactual Test for Inevitability (Form vs. Function)**
  *   **Main Question:** If rapid small-parcel delivery would have arrived in Merrivale via motor lorries had the tubes never been built, does the specific technology matter for your historical analysis, or only the timing of the efficiency gain?
  *   **Likely Reply:** They will almost certainly argue that the timing and the distribution of costs matter; the tubes required high fixed capital early on, whereas lorries shift costs to variable labour, altering the class structure of the city.
  *   **Follow-up:** If the class structure is the only variable, are you not arguing that the technology is a proxy for labour relations? Could you not analyse the labour relations directly without relying on the technological determinism of the tube network?

  **9. Reversibility and Agency (Limits of Intervention)**
  *   **Main Question:** If lock-in is real and robust, does this imply that human agency is effectively nullified once a technological path is selected? Is there any historical scenario where a coordinated intervention successfully unlocked a mature network without a concurrent technological failure?
  *   **Likely Reply:** They might concede that agency is constrained but not nullified, citing examples where government mandates forced a switch, but usually at great economic cost and social disruption.
  *   **Follow-up:** If the switch requires great economic cost, does that not validate the lock-in theory? Or does it simply prove that the previous system was still economically viable? At what point does 'viability' become indistinguishable from 'entrenchment'?
