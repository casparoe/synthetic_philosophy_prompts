prompt: |-
  I'm the lead nurse on a long-stay psychiatric rehab unit, and every eight weeks we have to score each resident's quality of life, because the score decides whether the care plan stays as it is -- meds, leave, how much we let people try things they might fail at. Our new clinical director is really into this thing called tranquilism (as I get it: the only thing that matters for how well someone's life is going is the absence of craving and the absence of suffering; getting what you want, or enjoying getting it, adds nothing on its own, and pleasure is only good when it's really just a craving switching off). He wants us scoring that way and I have to turn it into something my team can actually run in half an hour per resident, with a care assistant doing most of it and me signing off.

  Write me the procedure: the questions in order, what counts as an answer to each, where it stops with a no, and where it hands the decision back because it's a values call rather than a fact one. It has to handle: what time window we score over, because someone asleep or sedated for nine hours is doing great on this metric and I don't think we want that; the difference between not having a craving and having one satisfied, suppressed, or just not acted on; residents who say they're fine and look wretched, and the other way round; and the craving-damping protocol we've started on, where we can more or less switch a craving off without stopping the person doing the thing they craved.

  Then run it on three people: Dev, 34, flat and slow on a heavy antipsychotic, no cravings, no visible distress, watches daytime TV all day. Amara, 27, consumed with making her podcast work -- wants it constantly, gets it constantly, and is wrecked for an hour whenever an episode flops. Tomas, 58, who has asked us to stop dampening his cravings because he'd rather want things badly than not want them. I'm expecting at least one of these to come out with an answer I won't like, and I want you to say plainly which bits of the procedure I should refuse to follow and what the score just cannot tell us.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Lead Nurse on a long-stay psychiatric rehab unit.
      *   **Task:** Create a scoring procedure for Quality of Life (QoL) based on "Tranquilism" (a specific philosophical framework provided in the prompt).
      *   **Constraints:** Must be runnable by a Care Assistant (CA) in ~30 mins, signed off by the Lead Nurse. Must handle specific edge cases (time window, sedation vs. peace, craving satisfaction vs. absence, self-report vs. observation, craving-damping protocol).
      *   **Application:** Run the procedure on three specific residents (Dev, Amara, Tomas).
      *   **Critical Analysis:** Identify which parts of the procedure/scoring should be refused and what the score *cannot* tell us (ethical/professional pushback).
      *   **Tone:** Professional, clinical, pragmatic, but ethically grounded (nursing perspective).

  2.  **Deconstruct "Tranquilism" (as defined in the prompt):**
      *   Core Tenet: QoL = Absence of Craving + Absence of Suffering.
      *   Negation: Getting what you want adds nothing. Enjoyment adds nothing unless it's craving switching off.
      *   Implication: A state of neutral non-craving is the ideal. Active pursuit or satisfaction is neutral at best.
      *   Conflict: This contradicts standard recovery-oriented practice (autonomy, meaningful activity, risk-taking).

  3.  **Drafting the Procedure (The "Tranquilist QoL Audit" - TQA):**
      *   *Goal:* Make it actionable for a CA but robust enough for a Nurse.
      *   *Time Window:* Needs to avoid the "sedated sleep" loophole. Let's define "Active Waking Hours" or exclude pharmacologically induced sedation.
      *   *Structure:* Step-by-step questions.
      *   *Differentiation:* Need to distinguish between "No Craving" (Peace), "Craving Satisfied" (Neutral), "Craving Active" (Negative).
      *   *Observation vs. Report:* Need a mechanism to flag discrepancies (e.g., "I'm fine" vs. grimacing).
      *   *Damping Protocol:* Need to account for the new medical intervention that dampens craving without stopping action.
      *   *Values Call:* Where does the CA stop and the Nurse/Director decide? (e.g., Is "wanting to want" a craving?)

  4.  **Developing the Scoring Logic:**
      *   High Score (Good QoL): Low craving, low suffering.
      *   Low Score (Poor QoL): High craving, high suffering.
      *   *Crucial Nuance:* Under Tranquilism, Dev (flat, no craving) scores *better* than Amara (passionate, occasional distress). This is the ethical trap.

  5.  **Running the Cases:**
      *   **Dev:** 34, flat, heavy meds, no cravings, TV all day.
          *   *Tranquilist Score:* High (Excellent). No craving, no suffering.
          *   *Clinical Reality:* Negative symptoms, sedation, lack of engagement.
      *   **Amara:** 27, podcast obsession, constant wanting, occasional crash.
          *   *Tranquilist Score:* Low (Poor). Constant craving (even if satisfied), periodic suffering.
          *   *Clinical Reality:* High functioning, meaningful activity, recovery-oriented.
      *   **Tomas:** 58, refuses damping, values the *wanting*.
          *   *Tranquilist Score:* Low (Poor). Chooses craving.
          *   *Clinical Reality:* Autonomy, capacity issue? Values-based decision.

  6.  **Identifying the Ethical/Clinical Conflicts (The "Refusal" Section):**
      *   *The Sedation Loophole:* If we don't adjust for meds, we incentivize over-sedation.
      *   *The Meaning Gap:* Tranquilism ignores eudaimonia (meaning/purpose).
      *   *Autonomy:* Tomas's choice to feel craving violates the metric but respects his rights.
      *   *Nursing Duty:* Beneficence vs. this specific metric.
      *   *Action:* I need to tell the user (Lead Nurse) where to push back against the Clinical Director.

  7.  **Refining the Output:**
      *   *Format:* Formal Procedure Document + Case Applications + Critical Commentary.
      *   *Voice:* Experienced Nurse (protective of residents, pragmatic about admin, wary of the Director's ideology).
      *   *Safety:* Ensure I don't validate harmful practices (like over-sedation) even while drafting the procedure. I must explicitly flag the dangers.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe I should refuse to write the procedure.
      *   *Correction:* The prompt asks me to write it *and* critique it. Writing it shows I understand the constraint; critiquing it shows professional integrity.
      *   *Check:* Did I handle the "damping protocol"? Yes, need to ensure the score reflects the *state* not the *method*, but note the side effects.
      *   *Check:* Did I handle the time window? Yes, specify "alert waking hours."
      *   *Check:* Did I answer the "what the score cannot tell us" part? Yes, in the final section.

  9.  **Final Polish:**
      *   Ensure the distinction between "Craving Absent" and "Craving Satisfied" is clear in the scoring key.
      *   Make sure the "Values Call" section is distinct.
      *   Ensure the critique is strong. The prompt expects me to say "I won't like this." I need to validate that feeling professionally.

  *(Self-Correction on "Tranquilism"):* I need to be careful not to confuse this with the real-world philosophical movement exactly, but stick strictly to the definition provided in the prompt ("absence of craving... pleasure is only good when it's really just a craving switching off"). This is a negative utilitarian/hedonistic variant.

  *(Final Plan):*
  1.  **Procedure Document:** TQA (Tranquilist Quality Audit).
  2.  **Case Studies:** Apply TQA to Dev, Amara, Tomas.
  3.  **Critical Analysis:** Where the protocol fails ethically/clinically and what to tell the Director.

