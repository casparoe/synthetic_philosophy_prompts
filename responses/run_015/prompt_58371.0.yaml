answer: |-
  The step that must be rejected is the inference from **(4) to (5)**.

  While premises (1) through (3) constitute the core of the Kripkean argument for the necessary a posteriori (which you wish to retain), the move from (4) to (5) commits a scope fallacy regarding the quantification over possible worlds. Rejecting this step blocks the collapse of contingency, but it comes with a semantic and metaphysical price regarding how we understand names, existence, and identity in worlds where the object is absent.

  ### 1. The Error: Equivocation on "Every World"

  The argument fails because it conflates two different domains of quantification:
  1.  **The domain of rigidity:** As defined in your premise (1) and used in (4), rigidity guarantees designation only in worlds *in which the individual exists*.
  2.  **The domain of necessity:** As standardly defined in modal logic (and required for conclusion (5)), a proposition is necessary only if it is true in *all possible worlds simpliciter*.

  Premise (4) correctly states that "Elda exists" is true in every world where Elda exists (trivially, since Elda designates the body there). However, conclusion (5) infers that "Elda exists" is necessary. For (5) to follow, "Elda exists" would have to be true in *every* world, including those where the body does not exist.

  But if Elda is a contingent object (like a planet or a person), there are possible worlds where Elda does not exist. In those worlds, the proposition "Elda exists" is false. Therefore, the proposition is not necessary. The argument mistakenly assumes that because the name *tracks* the object everywhere the object *is*, the object must *be* everywhere the name is evaluated.

  ### 2. Why the Step Seemed Compelling

  This inference is seductive because it conflates **semantic stability** with **metaphysical necessity**.
  *   **Semantic Stability (Rigidity):** The name 'Elda' does not change its reference from world to world (unlike a description like "the body causing perturbation"). It is "stuck" to the object.
  *   **Metaphysical Necessity:** The object itself exists in all worlds.

  The reasoning tempts us to think that if the semantic link is unbreakable (rigid), the ontological link must also be unbreakable (necessary existence). It feels as though the name *drags* the object into every world. However, rigidity only dictates *which* object is picked out *if* there is one; it does not dictate *that* there is one.

  ### 3. The Price of Blocking (4)–(6) While Saving (1)–(3)

  To reject (5) while retaining the necessity of identity (3), you must pay a price in semantic complexity. You must distinguish the truth conditions of **identity statements** from **existence statements**.

  There are two main ways to pay this price, depending on how strictly you interpret "Necessary" in (3).

  #### Option A: Conditional Necessity (The "Persistent" View)
  If you stick strictly to the definition of rigidity provided in your prompt ("in every possible world *in which that individual exists*"), you must accept that (3) is technically shorthand for:
  > "Necessarily, **if** Elda and Rava exist, Elda is Rava."

  *   **The Cost:** You must concede that unrestricted identity statements ($a=b$) are not true in worlds where $a$ and $b$ do not exist (perhaps they are false or lack truth values). This weakens the slogan "Identity is necessary" to a conditional necessity.
  *   **Benefit:** This aligns perfectly with **Free Logic**. In worlds where Elda doesn't exist, 'Elda' denotes nothing, so "Elda exists" is false, and contingency is preserved.

  #### Option B: Unrestricted Necessity (The "Obstinate" View)
  If you want to retain the strong Kripkean claim that "Elda is Rava" is true in *all* worlds (unrestricted necessity), you must adopt **obstinate rigidity**. This view holds that names designate their referents even in worlds where the referent does not exist.
  *   **The Cost:** You must accept a semantics where:
      1.  The name 'Elda' refers to the body even in worlds where the body does not exist.
      2.  The predicate "exists" is false of the body in those worlds.
      3.  The relation of "identity" holds between the body and itself even in worlds where it does not exist.
  *   **Why this saves (3) but blocks (5):** In a world where Elda does not exist, 'Elda' still refers to Elda. Therefore, "Elda is Rava" is true (they are the same non-existent object). However, "Elda exists" is false (the object lacks the property of existence in that world).
  *   **Metaphysical Burden:** This requires accepting that objects can bear relations (like identity) in worlds where they do not exist. Some philosophers find this ontologically suspicious (smacking of Meinongianism), though Kripkeans argue it is merely a feature of how we evaluate singular propositions.

  ### Summary of the Trade-off

  To block the collapse of contingency:
  1.  **Reject (5):** Existence is not necessary because there are worlds where the object is absent.
  2.  **Pay the Cost:** You must explain how "Elda is Rava" can be necessary while "Elda exists" is contingent.
      *   Either you accept that (3) is **conditionally necessary** (true only in worlds where they exist).
      *   Or you accept that **identity does not entail existence** (objects are self-identical even in worlds where they fail to exist).

  Most defenders of the Kripkean framework choose **Option B**. They argue that the necessity of identity is a fact about the *objects themselves* (Hesperus just *is* Phosphorus), whereas existence is a contingent property those objects instantiate. By treating 'exists' as a predicate that can fail to apply to a referent, you retain rigid designation and necessary identity without forcing all named objects to exist necessarily.
