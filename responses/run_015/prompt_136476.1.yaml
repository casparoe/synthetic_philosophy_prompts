  9. You rely on safety thresholds to block Williamson's slide. But if safety is binary—either you're safe or you're not—doesn't that reintroduce the sharp cutoff problem you try to avoid?
     **Follow-up:** If she says safety is graded, ask whether a graded safety condition still counts as knowledge in the standard sense used by Williamson, or if she is redefining knowledge.

