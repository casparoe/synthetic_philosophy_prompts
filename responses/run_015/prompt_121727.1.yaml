answer: |-
  This is a classic problem in political philosophy, often framed as the tension between **integrity** (keeping one's moral hands clean) and **responsibility** (getting things done in an imperfect world). Your friend is channeling a deontological view (rules/truths are absolute); you are channeling a consequentialist/pragmatic view (outcomes matter most).

  Your intuition that "some compromises feel different" is not just "ickiness." It is tracking a real moral category error. However, your current theory ("Enrollment" and "Ratchet") is a bit descriptive rather than foundational. "Enrollment" describes *what happens*, but not *why it matters*.

  Here is a proposed single principle, a test of your cases, a repair of your theory, and a critique of my own reasoning.

  ### The Principle: Preference vs. Judgment

  **You may compromise on *preferences* (how much of a good we get, who gets it), but you may not compromise on *judgments* (what is true, what is just, what is meritorious).**

  *   **Preferences** are subjective and divisible. I like chocolate, you like vanilla. We can buy a Neapolitan block. Neither of us is lying.
  *   **Judgments** are claims about reality or moral truth. They are not divisible. You cannot split the difference between "True" and "False," or "Just" and "Unjust," without asserting a falsehood.

  When you compromise on a preference, you are **accommodating** the other side. When you compromise on a judgment, you are **falsifying** your own.

  ### Testing and Repairing Your Theory

  Your concepts of "Enrollment" and "Ratchet" are useful heuristics, but they are symptoms of the deeper violation.

  1.  **Enrollment:** You feel "enrolled" when the compromise requires you to *affirm* a judgment you believe is false.
  2.  **Ratchet:** This is a strategic risk, not a moral one. However, it becomes moral if the ratchet forces future *judgments* to align with past *compromises*.

  **Repair:** Replace "Enrollment" with **"Affirmation."** The moral cost isn't just being associated with the bad thing; it is the act of *voting for, signing, or asserting* the bad thing as acceptable/true.

  ### Applying the Principle to Your Cases

  Here is how the **Preference vs. Judgment** principle sorts your list, including the tricky Library/Stadium distinction.

  *   **Vegetarian/Dad:** **Preference.** You are not eating the meat (judgment: meat is wrong to eat). You are facilitating his taste (preference: he likes roast). You maintain your judgment; you accommodate his preference. **Verdict: Fine.**
  *   **Budget ($40M vs $0 -> $18M):** **Preference.** Money is fungible. You judge $40M is better, they judge $0 is better. The compromise is on the *quantity* of the good, not the *nature* of the good. You are not affirming that schools are worthless; you are accepting a smaller slice. **Verdict: Fine.**
  *   **Sex Ed (Comprehensive vs Abstinence -> Both):** **Judgment.** If "Abstinence-only" relies on biological falsehoods (e.g., "condoms don't work"), teaching it as valid curriculum requires you to affirm a falsehood. You are compromising on *truth*. **Verdict: Bad (Friend is right).**
  *   **Sentencing (20 yrs vs 5 yrs -> 12 yrs):** **Judgment.** Justice is not a preference. If you believe 20 years is *just* and 5 is *unjustly lenient*, 12 is not "compromise," it is *injustice*. You are affirming a sentence you believe is wrong for the human being. **Verdict: Bad.**
  *   **Coalition (Racist Flyers):** **Judgment (Endorsement).** Taking help is transactional (preference/resource). Putting your name on the flyer is an assertion of solidarity (judgment: "I vouch for this group"). **Verdict: Bad.**
  *   **Hiring (A vs B -> C):** **Judgment.** Merit is a truth claim. If A is objectively the best, hiring C to keep peace asserts that "Merit is not the primary criterion." It turns a judgment role into a political one. **Verdict: Bad.**

  ### The Library/Stadium Distinction (Logroll vs. Budget)

  You asked specifically why Logroll feels worse than the Budget fight, even though both involve trading.

  *   **Budget:** You vote for a package that contains $18M. You can truthfully say, "This budget funds schools, though less than I wanted." Your *judgment* on the value of schools remains intact.
  *   **Logroll:** You vote *for* the Stadium. To cast that vote, you must assert, "This stadium is a worthy use of public funds." If you believe it is a boondoggle, **you are lying.**

  In the Budget case, you are **accepting a loss** (less money). In the Logroll case, you are **inflicting a harm** (voting for a bad project) as a means to an end. The principle distinguishes these as **Accommodation** (Budget) vs. **Instrumentalization** (Logroll). Instrumentalizing a public vote violates the fiduciary duty of the voter/official to judge each item on its merits.

  ### Prediction for the Hiring Case

  **Prediction:** Hiring C is morally corrosive and should be opposed, unless the definition of "Best" is amended.

  If "Best" means "Highest technical skill," hiring C is a lie. It demoralizes A (merit doesn't matter) and B (politics won). It establishes a precedent that the hiring committee is a political body, not a meritocratic one.

  **Exception:** If "Best" includes "Ability to work with the existing team," and A is toxic, then C might actually be the "Best" candidate under a revised judgment. But if everyone agrees A is the most qualified and C is hired solely to avoid conflict, it is a **Judgment Compromise**. It signals that institutional peace is more valuable than institutional excellence. Over time, this creates a "C-grade" culture.

  ### Which Verdicts I Would Throw Out

  I would challenge your **"Fine"** verdict on the **Budget Fight**.

  *   **Why:** If the opposing bloc wants $0 because they hold a *false judgment* (e.g., "Schools don't reduce crime" when data says they do), compromising with them legitimizes their false premise.
  *   **Nuance:** However, in a democracy, we often must compromise with people who are wrong about facts to avoid violence or gridlock. So, while it is a *preference* compromise on the surface, it often hides a *judgment* compromise underneath. I would downgrade this from "Obviously Fine" to "Necessary Evil." It is permissible, but it carries a moral cost (the normalization of the opponent's false premise) that you should acknowledge.

  ### Where My Reasoning Might Fail (And What Would Change My Mind)

  You asked for epistemic humility. Here is where the **Preference vs. Judgment** principle breaks down:

  **1. The Problem of Epistemic Arrogance**
  *   **Failure Mode:** This principle assumes I *know* what is True/Just. What if I am wrong? If I refuse to compromise on Sentencing because I am "sure" 20 years is just, but I am actually vindictive, my integrity is actually stubbornness.
  *   **Change My Mind:** If there is significant reasonable disagreement among experts (e.g., economists disagree on the stimulus budget), then the issue shifts from **Judgment** to **Preference**. When truth is unknowable, we must treat it as a preference to be split.
  *   **Risk:** This principle can be weaponized by zealots to shut down democracy. "I cannot compromise on abortion because it is a Truth."

  **2. The "Dirty Hands" Problem (Consequentialism)**
  *   **Failure Mode:** Sometimes, falsifying a judgment saves lives. If signing a racist flyer (Judgment Compromise) prevents a riot that kills 50 people, the consequentialist math overrides the integrity violation.
  *   **Change My Mind:** If the stakes of *not* compromising are catastrophic (regime collapse, war, mass suffering), then **Judgment Compromises become permissible.** Integrity is a luxury good; survival is a necessity.
  *   **Risk:** This is the slippery slope. Every small compromise is justified by "preventing catastrophe."

  **3. The Construction of "Judgment"**
  *   **Failure Mode:** Many "Judgments" are actually aggregated "Preferences." Is the Stadium a boondoggle? That's an economic judgment, but it's based on value preferences (do we value tourism or tax savings?).
  *   **Change My Mind:** If we recognize that most political "truths" are actually value-laden preferences, the distinction collapses.
  *   **Risk:** If everything is a preference, then nothing is sacred (Friend's worry). If everything is a judgment, nothing is possible (Your worry).

  ### Summary Advice for the Argument

  Your friend is right that **injustice** (a Judgment) is not negotiable. You are right that **politics** (Preferences) requires trade.

  The synthesis is this: **Fight hard to define which domain you are in.**
  *   If the fight is about **resources** (Budget, Vegetarian roast), trade freely. That is politics.
  *   If the fight is about **truths** (Sex Ed facts, Sentencing justice, Hiring merit, Endorsements), do not trade. That is integrity.

  Your "ickiness" is a reliable alarm system. It goes off when you are being asked to treat a **Judgment** as if it were a **Preference**. Listen to it, but check first to ensure you aren't just mistaking a strong preference for a moral truth.
