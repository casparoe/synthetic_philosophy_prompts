      *   *Part 2: Internalism.*
          *   Definition: "Internalism claims that sincerely judging X is right necessarily gives you some motivation to do X." (This is Motivational Internalism).
          *   Argument: WKR doesn't undermine internalism. The planner can judge it just (value-tracking/moral motivation) while the agent-tracking reason provides the *actual push*. WKR supplements moral motivation.
