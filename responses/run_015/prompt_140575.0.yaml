answer: |-
  During the compliance audit training, the facilitator walked the team through a hypothetical scenario to test the logic of the new reporting protocol without endorsing any actual findings. She proposed that it is more likely than not that both falsifying the consent forms and submitting the grant based on them are wrong. From this, she derived that it is more likely than not that falsifying the consent forms is wrong. The team checked the derivation solely for structural consistency, treating the moral claims as placeholders to ensure the software flags the correct logical dependencies regardless of the specific ethical content, with no one actually judging the actions as wrong or planning to condemn them.

  ### The Demonstration

  **(a) Simple emotivism** fails to state the argument. On this view, the sentence "falsifying the consent forms is wrong" has no descriptive content; its meaning is exhausted by the expression of an attitude. Consequently, the clause embedded under "it is more likely than not" lacks the propositional content required to serve as an argument for a probability operator. One cannot assign a probability to an exclamation or a feeling. To salvage the argument, simple emotivism would need to abandon its core claim and admit that normative sentences contribute propositional content in embedded contexts, effectively ceasing to be simple emotivism.

  **(b) Higher-order-attitude quasi-realism** can state the argument but struggles to explain its validity without expansion. Standard quasi-realism explains validity as the inconsistency of holding premise-attitudes while lacking the conclusion-attitude. Here, however, the attitudes are probabilistic ("being more confident than not in a disapproval"). The theory must explain why it is incoherent to have >50% confidence in a conjunctive disapproval while lacking >50% confidence in the disapproval of the conjunct. While a sophisticated quasi-realist can define coherence constraints on degrees of attitudinal commitment that mirror probability axioms, this requires adding a specific treatment of probabilistic operators to the theory—a "logic of attitudes"—that is not entailed by the basic higher-order-attitude machinery used for conditionals. The validity rests on the formal properties of probability, which the theory must mimic rather than inherit.

  **(c) Hybrid expressivism** handles the argument naturally. On this view, the normative sentence has full truth-conditional content independent of its assertoric force. The operator "it is more likely than not" applies directly to this representational content. The validity follows from standard probability logic applied to propositions: if the probability of a conjunction exceeds 0.5, the probability of either conjunct must exceed 0.5. The non-cognitive attitude component is semantically idle in this embedded context; the work is done entirely by the truth-conditional component. No new machinery is required; the theory inherits the logic of probabilistic inference from standard semantics.

  ### The Diagnosis

  The load-bearing feature of the case is the **non-Boolean operator ("it is more likely than not") requiring the embedded clause to function as a probability-bearing unit.** This forces the normative sentence to behave like a proposition subject to the axioms of probability (specifically monotonicity). If we replace this operator with a plain conditional to revert to ordinary Frege–Geach modus ponens (e.g., "If falsifying is wrong, then submitting is wrong; falsifying is wrong; therefore submitting is wrong"), the case collapses into the standard problem quasi-realism claims to solve. In the standard case, validity is explained by the incoherence of conflicting commitments. In the probabilistic case, validity is explained by mathematical constraints on degrees of confidence. The quasi-realist's standard tool (incoherence of attitude packages) does not automatically generate probability axioms; it must be specially adapted to do so. Thus, the difficulty shifts from managing logical connectives to managing non-truth-functional operators that demand propositional inputs.

  ### The Counterattack

  The strongest quasi-realist reply is to deny that probability operators require propositional content. Instead, they treat "being more confident that X is wrong than that Y is wrong" as a primitive comparative fact about the strength of disapproval, governed by norms of rational planning. A sophisticated quasi-realist (like Gibbard) might argue that we can earn the right to talk about probabilities over normative contents by showing that planning under uncertainty requires coherence constraints identical to probability logic.

  This reply restores (b)'s ability to handle the case but dissolves the distinction between (b) and (c). If the "attitudes" must obey Kolmogorov axioms, embed under operators, and function as inputs to logical inference exactly like beliefs, the "representational content" posited by the hybrid theorist is effectively being replicated within the attitudinal structure. The quasi-realist saves the theory by making attitudes do the work of propositions. This concedes the hybrid's point: the logical behavior is driven by representational features, whether we call them "truth-conditions" or "coherence-constrained attitudinal contents." The attitudinal component becomes an add-on rather than the engine of meaning.

  ### Verdict

  On this case, **(c) Hybrid expressivism** comes out best. It accommodates the inference without theoretical strain because it posits the very propositional content the operator requires. (a) fails outright. (b) survives only by mimicking (c)'s semantics within its pragmatic framework. This is not a reason to suspect the case is rigged, but rather a reason to think the constraint set identifies a genuine boundary condition for pure expressivism. The four constraints are jointly satisfiable, as the audit scenario demonstrates: participants can manipulate normative syntax hypothetically without holding first-order attitudes. However, the case reveals that satisfying constraint (3) (non-Boolean operators) places a burden on (b) that it cannot meet without adopting the semantic machinery of (c). The failure is not in the case design, but in the inability of pure expressivism to account for probabilistic reasoning without conceding that normative sentences bear truth-apt content.
