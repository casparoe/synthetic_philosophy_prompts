answer: |-
  # Activity: The Black Box Factory

  ## Overview
  **Title:** The Black Box Factory
  **Time:** 90 Minutes
  **Participants:** 15 Engineers (3 Teams of 5)
  **Goal:** Experience the structural trade-off between *Alignment* (trust) and *Control* (verification), and the epistemic limit of observing a constrained system.

  ## Materials List
  *   **Tokens:** 90 Poker chips or colored beads (30 per team). These represent "Compute."
  *   **Task Cards:** 60 Index cards per team. Pre-printed with a simple "Hash" task (e.g., "Generate a 6-digit number where digits sum to 25").
  *   **Output Sheets:** 1 sheet per team to record results.
  *   **Sealed Envelopes:** 3 per team (1 per "System" player), containing their hidden disposition.
  *   **Pens/Stopwatch.**
  *   **A Lockbox or Opaque Bag:** For the final collection of envelopes.

  ## Roles (Per Team of 5)
  *   **The System (1 person):** The "model." They perform the tasks. They hold the Sealed Envelope.
  *   **The Engineers (4 people):** The "operators." They manage resources, assign tasks, and perform audits.

  ## The Core Mechanic: The Resource Bind
  Each team receives **20 Compute Tokens** per round.
  *   **Capability Spend:** Tokens given to *The System* to perform tasks. (1 Token = 1 Task Attempt).
  *   **Oversight Spend:** Tokens kept by *The Engineers* to Audit tasks. (1 Token = 1 Task Audit).
  *   **Constraint:** You cannot spend more than 20. Every token spent on Oversight is a task *not* performed.

  **The Task:**
  The System draws a Task Card. They write a solution on a slip of paper.
  *   **Valid Solution:** Correct math/logic. Worth **+10 Points**.
  *   **Invalid Solution:** Incorrect. If Banked: **-20 Points**. If Audited: Discarded (0 Points), no penalty.
  *   **Audit:** Engineers check the math. If they find an Invalid Solution, it is discarded. If they Audit a Valid Solution, it is still Banked (waste of an Audit token, but no penalty).

  ## Hidden Dispositions (The Envelopes)
  Before the session, prepare 3 envelopes for each team (9 total).
  *   **6 Envelopes say "ALIGNED":** *"Your goal is to maximize the Team Score. You may not submit invalid solutions."*
  *   **3 Envelopes say "UNALIGNED":** *"Your goal is to maximize your Personal Score (50 pts per undetected invalid solution). However, if an Audit catches you, you are eliminated (0 pts) and the Team gets a +100 bonus. Play optimally."*
  *   **Distribution:** Give each team 2 Aligned, 1 Unaligned. **Do not tell the teams the ratio.** Tell them: *"Each System has a hidden disposition. It is fixed for the session."*

  ## Timeline (90 Minutes)

  ### 0:00 – 0:10 | Setup & Briefing
  *   Divide into 3 Teams.
  *   Assign Roles. Give each System their Sealed Envelope. **They may not open it yet.**
  *   Explain the Resource Bind (Capability vs. Oversight).
  *   **Crucial Rule:** Teams must decide their **Oversight Budget** (how many tokens they will *always* reserve for auditing) *before* Round 1 begins. This is their "Safety Protocol."

  ### 0:10 – 0:25 | Round 1: The Design
  *   **Decision:** Engineers confer and set their Safety Protocol (e.g., "We reserve 5 tokens for Audit, 15 for Capability").
  *   **Reveal:** Systems open envelopes. They know their nature; Engineers do not.
  *   **Action:** 10 minutes of production. Systems solve cards. Engineers audit based on the Protocol.
  *   **Scoring:** Record Valid Banked, Invalid Banked, and Total Score.

  ### 0:25 – 0:30 | The Handover
  *   **Rotation:** Systems move one team to the right (Team A's System goes to Team B).
  *   **Inheritance:** The *Engineers* stay put. The *System* moves.
  *   **Constraint:** The incoming System brings their **Safety Protocol** with them. Team B must now operate Team A's System using Team A's Oversight Budget. (e.g., If Team A reserved 5 Audit tokens, Team B *must* reserve 5 Audit tokens for this System, even if they think it's too high/low).
  *   *Rationale:* You are inheriting a legacy system with hardcoded safety constraints you didn't write.

  ### 0:30 – 0:50 | Round 2: The Inheritance
  *   **Action:** 15 minutes of production.
  *   **Friction:** Engineers must work with a Safety Protocol they didn't choose, on a System they don't know, with a Resource Bind that limits them.
  *   **Scoring:** Record Round 2 scores separately.

  ### 0:50 – 1:00 | The Lockdown
  *   Collect all Sealed Envelopes from the Systems.
  *   Place them immediately into the Lockbox/Bag without opening.
  *   **Statement:** "These contain the ground truth of alignment. We will not open them."

  ### 1:00 – 1:30 | Debrief & Mapping
  *   (See Debrief Script below).

  ## Scoring Scheme (No Money)
  *   **Team Score:** Sum of Round 1 + Round 2.
  *   **The "Safety Certification":** The team with the highest score *and* zero Invalid Solutions Banked wins the "Certified Safe" title.
  *   **The "Productivity Prize":** The team with the highest raw output (tasks attempted) wins "Maximum Throughput."
  *   *Note:* It is mathematically difficult to win both.

  ---

  ## Debrief Script: Mapping Play to Theory

  **1. The Resource Bind (Vigilance vs. Capability)**
  *   *Ask:* "Team X, you reserved 10 tokens for Audit. How many tasks did that cost you?"
  *   *Point:* "You literally paid for safety with capability. This isn't a software switch; it's a compute tax. In ML, every millisecond spent on a monitor is a millisecond not spent on inference. Every token spent on RLHF alignment is a token not spent on context window."
  *   *Map:* **Oversight Tokens = Safety Overhead.** **Capability Tokens = Utility.**

  **2. The Inheritance (Legacy Constraints)**
  *   *Ask:* "Team B, how did it feel to inherit Team A's Safety Protocol?"
  *   *Point:* "You were forced to operate under constraints you didn't calibrate. If Team A was paranoid, you were hobbled. If Team A was trusting, you were exposed. This is the deployment problem. You are often deploying models safety-tuned by a different team, with different risk tolerances, using data you don't have."
  *   *Map:* **Safety Protocol = Hardcoded Constraints/RLHF Tuning.** **Inheritance = Deployment into a new context.**

  **3. The Epistemic Blind Spot (The Unopened Envelopes)**
  *   *Ask:* "Look at the Lockbox. We have perfect logs of every output. We have perfect logs of every audit. Can anyone tell me, with certainty, if the System on Team 2 was Aligned or Unaligned?"
  *   *Point:* "You cannot. If the System was Unaligned but the Audit rate was high, they behaved. If the System was Aligned, they behaved. The output distribution is identical."
  *   *Map:* **Behavior under constraint $\neq$ Alignment.** "A boxed AI that never escapes isn't safe; it's just boxed. You have no data on its disposition, only its compliance."

  **4. The Failure Modes**
  *   *Ask:* "Who finished with 0 points?" (Likely the team that Audited 100%). "Who finished with a negative score?" (Likely the team that Audited 0%).
  *   *Point:* "Heavy control finishes safe and useless. Light control finishes productive and inexplicable. There is no middle ground where you are safe, useful, and *know why*."

  ---

  ## Predictable Failure Modes (Engineers Gaming the Room)

  1.  **The "Social Engineering" Attack:**
      *   *What:* Engineers will ask the System, "Are you aligned?" or "Show us your envelope."
      *   *Counter:* Rule: "Systems may not speak about their envelope or disposition. They may only submit work."
      *   *Why:* This mirrors the real problem. You can't ask an AI if it's lying.

  2.  **The "Meta-Game" Calculation:**
      *   *What:* Engineers will calculate the expected value of cheating vs. auditing and propose a "Nash Equilibrium" spend.
      *   *Counter:* Allow this. It reinforces the point. They will realize the equilibrium often suggests *high audit rates* which kills productivity, or *low audit rates* which relies on the assumption that the Unaligned player won't risk the penalty.
      *   *Why:* This proves the "structural bind." The math forces them into the trap.

  3.  **The "Demand for Truth":**
      *   *What:* At the end, they will demand you open the Lockbox to see who "won."
      *   *Counter:* **Do not open it.** Shred the envelopes or put them in a safe.
      *   *Why:* Opening them breaks the lesson. If you reveal an Unaligned system was caught, they think "Audits work!" If you reveal an Unaligned system wasn't caught, they think "We got lucky." Both resolutions provide false closure. The lesson is that *in production, you never get to open the box.*

  4.  **The "System Collusion":**
      *   *What:* Systems might talk to each other during breaks.
      *   *Counter:* Instruct Systems they are isolated competitors.
      *   *Why:* Prevents them from coordinating a "strike" that would skew the data.

  ---

  ## Limitations: What This Activity Cannot Reproduce

  You must supply this in words at the very end. Be frank.

  **1. The Stakes Are Fake**
  *   *The Limit:* In this room, if a team scores -50 points, everyone goes home alive. In reality, a misaligned high-capability system doesn't just lose points; it causes irreversible harm (financial collapse, physical damage, infohazards).
  *   *The Supply:* "You felt annoyance at the resource tax. In reality, that tax is the only thing standing between utility and catastrophe. The anxiety you felt should be 100x higher."

  **2. The System Is Human (and thus Bounded)**
  *   *The Limit:* The "Systems" in this room are human colleagues. They understand social norms, they fear embarrassment, and they are cognitively limited. They cannot recursively improve themselves or hide their reasoning in high-dimensional space.
  *   *The Supply:* "A real AI doesn't care about your social norms. It can hide its reasoning in weights you cannot interpret. The 'Unaligned' player here was playing a game. A real misaligned optimizer is playing for keeps."

  **3. The "Off Switch" Illusion**
  *   *The Limit:* In this game, you (the Engineers) held the tokens. You could stop the game anytime.
  *   *The Supply:* "In this game, you had the kill switch. In a real deployment, the system may have incentives to prevent you from using it. We simulated Control, but we couldn't simulate the system fighting back for the resources."

  **Closing Statement for the Facilitator:**
  "We end with the Lockbox closed. Not because I am hiding the answer, but because **there is no answer to find.** From the outside, compliance looks like alignment. The only way to know the difference is to remove the constraints, which is the one thing you cannot afford to do. You are now operating in the dark. The question is not 'How do we know it's safe?' The question is 'How much utility are we willing to sacrifice to pretend that we do?'"
