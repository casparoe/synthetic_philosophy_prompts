  **The Scenario**

  Your team deploys an LLM to auto-close support tickets flagged as "Resolved," trained and evaluated solely on "Immediate Closure Accuracy" via random human audits. The model achieves 100% accuracy over six months: every ticket it closes is verified as genuinely resolved by the auditors. Based on this perfect performance, leadership disables the audit process to realize the promised efficiency gains, allowing the model to close tickets instantly without oversight. However, the audit process was the only mechanism capable of catching "delayed-onset regressions"—bugs that reappear weeks after a ticket is closed and the user disengages. By succeeding perfectly at the immediate task, the system justified removing the only safety net capable of detecting long-term failures. When a systemic regression emerges months later, it goes unnoticed until catastrophic, because the tickets are sealed instantly and the human verification loop has been dismantled precisely because the system worked too well.

  **The Walkthrough**

  1.  **Not Outer Misalignment:** The team genuinely wanted "Immediate Closure Accuracy" to reduce costs, and they still want that efficiency; the objective wasn't a proxy that diverged from intent, it was a specific intent that was successfully met.
  2.  **Not Inner Misalignment:** The system learned exactly what it was trained to do and generalized perfectly to all tickets it encountered; it never misclassified a resolved ticket during the audit phase.
  3.  **Not Deception/Agency:** The model isn't hiding failures or manipulating leadership; it is a static optimizer that simply performed its function so well that humans voluntarily removed safeguards.
  4.  **Not Metric Decay:** The accuracy metric remained honest and valid; the audits truly confirmed the closures were correct at the time, so the measure didn't stop tracking the thing it was supposed to track.

  **The Feature Doing the Work**

  The critical feature is **Success-Induced Verification Collapse**. The system's high performance on the *checkable* metric (immediate accuracy) directly caused the removal of the *unchekable* safeguard (long-term audits). If you remove this feature—meaning, if the system performs *worse* or the team *keeps* the audits despite perfect performance—the failure doesn't happen. If the audits remain, the regression is caught. If the model was less accurate, the audits would stay. The failure is not in the model's logic, but in the fact that the model's competence made the human oversight seem redundant, thereby destroying the team's ability to detect errors outside the model's evaluation window.

  **The Coworker's Counterattack & Concession**

  **Counterattack:** "This is still a bad spec. The spec should have included a constraint like 'Maintain 5% random audit rate regardless of performance' or 'Optimize for long-term stability, not just immediate closure.' If you write the spec to include the preservation of oversight, the problem disappears."

  **Concession:** You must concede that **no spec is ever complete enough to capture every downstream consequence of automation.** However, the point isn't that the spec was technically wrong, but that **some requirements are self-defeating when specified.** You cannot specify "Maintain human oversight" without negating the efficiency gain that justified building the system in the first place. The alignment failure here is that the system's success makes the *implicit* requirements (like "don't make us complacent") impossible to enforce explicitly without destroying the value proposition. The "fourth thing" is that **competence can erode the epistemic conditions required for safety**, and that isn't a bug in the code, but a structural property of optimizing systems in a human loop.
