  ***

  **STANDING COMMITTEE ON PROVISIONAL FALSIFICATION**
  **MEMORANDUM OF FINDINGS AND RESOLUTIONS**

  **TO:** Departmental Tenure Committees, Grant Review Boards, Editorial Panels
  **FROM:** Standing Committee on Provisional Falsification (SCPF)
  **SUBJECT:** Adjudication of Long-Run Predictive Instruments (LRPIs) with Missed Horizons
  **DATE:** October 24, 2023

  The Committee convened to adjudicate the status of Long-Run Predictive Instruments (LRPIs) wherein the central event has not materialized within the initially suggested horizon. Regarding Case File LRPI-1798 (Population-Subsistence Gap), the Committee finds the theory remains in Provisional Non-Falsified Status. The following doctrines are hereby codified to govern future adjudications of premature truth claims.

  **Finding 1: The Borrowed Surplus Finding.**
  Where a prediction is delayed by technological intensification or stock drawdown (e.g., fossil groundwater, nitrogen fixation), such delay shall not count as falsification. Instead, the depletion of the stock constitutes independent verification of the scarcity mechanism. The respite is purchased by spending down the very capital the theory claims is limited; thus, the delay confirms the constraint. Proponents are encouraged to catalogue the rate of drawdown as positive evidence.

  **Finding 2: The Exhaustion Clause.**
  Should the countervailing causes themselves show signs of diminishing returns, the theory transitions from "Deferred" to "Imminent." The failure of the rescue mechanism is treated as the activation of the primary mechanism. No additional evidence is required to shift the burden of proof back to skeptics. The moment the fix stops working is the moment the theory starts working.

  **Finding 3: Auxiliary Withdrawal Protocol.**
  Auxiliary hypotheses invoked to explain delay (e.g., "Demographic Transition is permanent") are locked into the core theory. Per the Division of the House Rule, no auxiliary may be withdrawn or modified without a two-thirds majority vote of the proponent body. This prevents ad hoc shrinking of the theory's scope to evade negative instances. Once a save-all hypothesis is filed, it becomes structural.

  **Finding 4: Open Horizon Provision.**
  Specific dates attached to LRPIs are deemed heuristic devices rather than falsification conditions. The "long-run" is defined as the period required for the mechanism to overcome temporary countervailing causes. Since the length of this period is unknown ex ante, no elapsed time constitutes a refutation. The theory is not late; the horizon has merely extended.

  **Resolution 24-B:** The Committee recommends continued funding for monitoring programs. Budget Line 404 (Catastrophe Surveillance) is increased to account for the extended timeline. Resources previously allocated for immediate mitigation shall be redirected toward longitudinal data collection to ensure the event is captured upon arrival.

  **Resolution 24-C (Pre-emptive Confirmation Credits):** To address the liquidity constraints faced by proponents of deferred theories, the Committee authorizes the issuance of Advance Vindication Certificates. Proponents may draw down academic credit and policy influence now, against the guaranteed arrival of the predicted event later. These certificates are tradable among departments and may be used to satisfy publication requirements. Should the event fail to occur within three centuries, the credits are voided without interest. However, given the Borrowed Surplus Finding, the risk is deemed negligible.

  The Committee notes that discounting the testimony of future generations is unnecessary, as they will inherit the warned condition. Current standing is maintained. All pending falsification attempts are stayed pending the exhaustion of current surplus stocks.

  **Signed,**
  *The Secretariat*
