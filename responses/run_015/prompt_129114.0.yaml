  # JOINT STATEMENT ON EPISTEMIC INJUSTICE
  **Prepared by:** The Study Group (Hermeneutical Priority Camp & Testimonial Priority Camp)
  **Date:** October 26, 2023
  **Subject:** Clarifying Divergences in Fricker's Framework

  ## PART I: SHARED COMMITMENTS
  *The following claims are accepted by both the Hermeneutical Priority Camp and the Testimonial Priority Camp. We agree these form the baseline of our collaboration.*

  1.  **Definition of Harm:** We agree that epistemic injustice constitutes a specific harm where an individual is wronged specifically in their capacity as a knower. This is distinct from, though often compounding, material or physical harm.
  2.  **The Bilingual Clinic Case:** We agree that the following scenario constitutes a clear instance of epistemic harm: A patient in a bilingual clinic uses a folk-medical term to describe a symptom (e.g., "nervios" or a culture-specific pain descriptor). The attending physician lacks the clinical vocabulary to translate this concept and dismisses the complaint as non-specific. The patient leaves without treatment. Both camps agree the patient was harmed as a knower here.
  3.  **Interdependence of Structure and Agency:** We agree that institutional fixes (protocols, guidelines) and individual changes (virtues, humility) are mutually reinforcing. Neither camp argues that one is entirely useless without the other; we disagree only on which is the *primary* lever for change.
  4.  **The Reality of Prejudice:** We agree that identity prejudice (bias regarding gender, race, class, etc.) plays a significant role in distorting epistemic exchanges. Neither camp argues that these injustices are accidental or neutral errors.
  5.  **The Goal of Collaboration:** We agree that splitting Fricker's framework into "testimonial" and "hermeneutical" categories is analytically useful only if it leads to different interventions. If the categories prescribe the exact same solutions, the distinction is merely semantic.

  ***

  ## PART II: POINTS OF DIVERGENCE & CRUXES
  *This section details where our interpretations split. The table below summarizes our positions, followed by specific "Cruxes" where we make falsifiable predictions about how the world works, including a stress-test of a proposed "Epistemic Audit Trail."*

  ### A. Positional Summary

  | Feature | **Hermeneutical Priority Camp** | **Testimonial Priority Camp** |
  | :--- | :--- | :--- |
  | **Root Cause** | The primary injury is the **lack of shared concepts**. If the collective vocabulary doesn't exist to render an experience intelligible, the speaker is silenced before they can even attempt to testify. | The primary injury is the **credibility deficit**. The concepts often exist but are ignored because the listener prejudices the speaker. The gap is a tool of exclusion, not the root cause. |
  | **View of the Clinic Case** | The harm occurred because the medical system lacks the **hermeneutical resources** to translate the folk term. The doctor couldn't understand even if they wanted to. | The harm occurred because the doctor assigned **low credibility** to the patient's way of speaking. The doctor could have asked follow-up questions but chose not to. |
  | **Primary Fix** | Expand the collective vocabulary (education, new diagnostic categories, cultural translation). | Correct the listener's bias (training in humility, accountability for disbelief). |

  ### B. Core Cruxes
  *We have identified two specific points where our theories make different predictions. We commit to observing these outcomes to test our views.*

  #### Crux 1: The Direction of Causality (Concepts vs. Credibility)
  **The Question:** Does lacking a shared concept cause the credibility loss, or does the credibility loss prevent the concept from being shared?

  *   **Concrete Case:** A new form of workplace psychological harassment emerges. It is subtle and currently has no name in HR policy.
  *   **Hermeneutical Priority Prediction:** Victims will suffer harm *immediately*, even before reporting it, because they cannot cognitively process the experience as "wrong" without the concept. The credibility loss happens later, as a symptom of this confusion.
  *   **Testimonial Priority Prediction:** Victims will identify the harm immediately based on feeling, but the injustice occurs *only* when they report it and are disbelieved. The lack of a name is a pretext used by HR to dismiss them, not the root cause of the silence.

  #### Crux 2: Institutional Protocols vs. Individual Humility
  **The Question:** Can a formal protocol prevent epistemic injustice if the individual clinician remains biased?

  *   **Concrete Case:** A hospital implements a "Blind Intake Protocol" where clinicians must log every symptom described by a patient using the patient's exact words before applying any clinical codes. The clinician personally believes the patient is exaggerating.
  *   **Hermeneutical Priority Prediction:** Injustice **persists**. The protocol forces the clinician to log the words, but if the clinician lacks the conceptual framework to understand the *meaning* behind the words, the data is logged but ignored in diagnosis. The gap remains.
  *   **Testimonial Priority Prediction:** Injustice is **mitigated**. The protocol forces the clinician to suspend their credibility judgment long enough to record the testimony. This structural constraint overrides the individual bias, preventing the immediate dismissal.

  ### C. Policy Stress Test: The Epistemic Audit Trail
  *We propose a specific mechanism to test our theories: An "Epistemic Audit Trail." In this system, every time a clinician or official discounts a claimant's testimony (a credibility discount), they must log the specific reasoning in a permanent file subject to review.*

  **The Question:** Would an Audit Trail solve the problem of epistemic injustice, or would it merely bury the injustice in paperwork?

  | Camp | Prediction on Audit Trail | Reasoning |
  | :--- | :--- | :--- |
  | **Hermeneutical Priority** | **It will bury the problem.** | Clinicians will game the system by using vague, clinically-sanctioned language to justify the discount (e.g., "Patient lacked specific terminology"). The audit trail captures the *decision*, but not the *hermeneutical gap* that forced the decision. It creates a illusion of accountability without fixing the lack of shared concepts. |
  | **Testimonial Priority** | **It will solve (or reduce) the problem.** | The requirement to justify a credibility discount forces the clinician to confront their own bias. Knowing the reasoning will be reviewed creates a "chilling effect" on prejudice. It shifts the burden of proof to the powerful listener, which is where the injustice originates. |

  **Shared Concern:** Both camps agree that if the Audit Trail becomes a bureaucratic checkbox exercise, it will fail. We agree to monitor whether the *quality* of reasoning in the logs improves over time or degrades into boilerplate text.

  ***

  **Signed,**

  *The Hermeneutical Priority Camp*
  *The Testimonial Priority Camp*
