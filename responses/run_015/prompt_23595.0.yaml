  # The Million-Dollar Correlation: A Defense of One-Boxing in Newcomb's Problem

  Newcomb's Problem is perhaps the most famous paradox in decision theory. It pits two intuitive principles against one another: the Dominance Principle, which suggests we should always secure available gains, and the Expected Utility Principle, which suggests we should maximize probable outcomes. In the standard formulation, a predictor of near-perfect accuracy places \$1,000,000 in an opaque box if they predict you will take only that box (one-boxing), and leaves it empty if they predict you will take both boxes (two-boxing). A transparent box containing \$1,000 is always available.

  In your variant, the predictor is not infallible but is 90% reliable. The prediction is already made, and the boxes are locked. The question remains: do you take one box or two? While the philosophical debate is centuries old in spirit, the arithmetic for this specific variant is stark. After weighing the dominance argument against the expected value calculation, the rational choice is clear: **you should one-box.** To do otherwise is to prioritize a specific definition of causal leverage over the actual outcome of winning the money.

  ### The Arithmetic of Expectation

  To resolve this, we must first look at the cold hard numbers. Expected Value (EV) is calculated by multiplying the payoff of each outcome by the probability of that outcome occurring. In this scenario, the "probability" is derived from the predictor's established reliability rate.

  If you choose to **One-Box**:
  The predictor is 90% likely to have anticipated this.
  *   90% chance the opaque box contains \$1,000,000.
  *   10% chance the opaque box is empty.
  *   $EV_{1B} = (0.9 \times \$1,000,000) + (0.1 \times \$0) = \$900,000$.

  If you choose to **Two-Box**:
  The predictor is 90% likely to have anticipated this as well.
  *   90% chance the predictor predicted two-boxing, meaning the opaque box is empty. You get only the transparent \$1,000.
  *   10% chance the predictor predicted one-boxing (error), meaning the opaque box has \$1,000,000. You get both, totaling \$1,001,000.
  *   $EV_{2B} = (0.9 \times \$1,000) + (0.1 \times \$1,001,000)$.
  *   $EV_{2B} = \$900 + \$100,100 = \$101,000$.

  The difference is staggering. The expected value of one-boxing (\$900,000) is nearly nine times higher than the expected value of two-boxing (\$101,000).

  ### The Reliability Threshold

  This disparity leads to a natural question: at what point does the math flip? Is there a reliability threshold where two-boxing becomes the mathematically superior choice?

  Let $p$ be the probability the predictor is correct.
  *   $EV_{1B} = p \times 1,000,000$
  *   $EV_{2B} = p \times 1,000 + (1-p) \times 1,001,000$

  We solve for the point where $EV_{1B} > EV_{2B}$:
  $$1,000,000p > 1,000p + 1,001,000 - 1,001,000p$$
  $$1,000,000p > 1,001,000 - 1,000,000p$$
  $$2,000,000p > 1,001,000$$
  $$p > \frac{1,001,000}{2,000,000}$$
  $$p > 0.5005$$

  The threshold is **50.05%**. As long as the predictor is even slightly better than a coin flip (specifically, better than random chance by a margin of 0.05%), one-boxing yields a higher expected return. Since our predictor is 90% reliable, we are far beyond the threshold required to justify one-boxing on purely statistical grounds.

  ### The Dominance Challenge

  Despite this arithmetic, the urge to two-box is powerful. This is the Dominance Argument, rooted in Causal Decision Theory. The logic proceeds as follows: The predictor has *already* made the prediction. The money is *already* in the box (or not). Your choice now cannot causally change the past. Therefore, you face two possible states of reality:

  1.  **The opaque box has \$1,000,000:** If you one-box, you get \$1M. If you two-box, you get \$1.001M. Two-boxing is better.
  2.  **The opaque box is empty:** If you one-box, you get \$0. If you two-box, you get \$1,000. Two-boxing is better.

  In both possible states of the world, two-boxing nets you an extra \$1,000. This is "strict dominance." It feels irrational to leave \$1,000 on the table "for free." Why reject a guaranteed gain based on a prediction that has already happened?

  ### Why Dominance Fails Here

  The dominance argument relies on a crucial assumption: that the state of the box is *independent* of your choice. In standard decision problems (like choosing between umbrellas based on weather), your choice does not influence the state of the world (the rain). However, Newcomb's Problem is explicitly constructed to violate this independence.

  The predictor's 90% reliability establishes a **subjunctive or logical link** between your choice and the box's content. While your choice does not *causally* reach back in time to move the money, your choice is *evidence* of what the predictor foresaw. If you are the type of agent who two-boxes, the predictor (being 90% reliable) almost certainly foresaw that and left the box empty. If you are the type who one-boxes, the box is almost certainly full.

  To invoke the dominance principle here is to ignore the premise of the problem. You cannot treat the content of the box as an independent variable when the problem states the content is a function of a prediction of your variable. If you decide to two-box because "the money is already there," you are simultaneously admitting that you are a "two-boxing type," which means the money almost certainly *isn't* there.

  Furthermore, we must ask what "rationality" means. Is rationality about following a specific logical ritual (maximizing causal leverage), or is it about winning? As the decision theorist Eliezer Yudkowsky famously posited, "Rationality should not be a losing strategy." If you consistently two-box in this scenario, you will walk away with \$1,000 nine times out of ten. If you consistently one-box, you will walk away with \$1,000,000 nine times out of ten. Over any series of games, or even in this single high-stakes instance, the one-boxer is the winner.

  ### The Verdict

  Given a 90% reliable predictor, the rational choice is to **one-box**.

  The dominance argument offers a comforting narrative of causal control, but it is an illusion in this specific setup. It asks you to take \$1,000 in exchange for a 90% probability of forfeiting \$1,000,000. The expected value calculation is not just a heuristic; it is a reflection of the reality created by the predictor's accuracy. The math shows a difference of \$799,000 in expected value. To ignore this is to value the *feeling* of causal agency over the *reality* of financial gain.

  The threshold analysis confirms that we are not in a borderline case; we are deep in the territory where correlation outweighs the nominal dominance of the extra \$1,000. Therefore, you must suppress the urge to grab the transparent box. You must act as a one-boxer, because acting as a one-boxer is the only way to ensure the opaque box was filled. Take the one box, and walk away with the million.
