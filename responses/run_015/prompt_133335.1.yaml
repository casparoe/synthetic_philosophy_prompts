  **Correcting my Lemkin**
  Your background is largely solid. Lemkin introduced "genocide" in *Axis Rule in Occupied Europe* (1944), documenting Nazi techniques across occupied Europe, not just the Holocaust. The loss of 49 family members is the standard biographical figure he cited. He did advise Jackson at Nuremberg, though his role was often unofficial and frustratingly peripheral. The 1930s memory is real: at the 1933 Madrid Conference for the Unification of Penal Law, he proposed "barbarism" (violence against individuals) and "vandalism" (destruction of cultural heritage) as international crimes. Regarding 1948, you have the vote count right for the Sixth Committee (25 to 16 with 4 abstentions), but the motion was to *exclude* cultural genocide, which passed. Consequently, the final Convention omitted cultural destruction unless tied to physical harm. This deletion was the specific defeat he spent his remaining years trying to reverse, viewing it as a fatal loophole in international law.

  **What he's actually committed to**
  Lemkin's core commitment is that genocide is a coordinated plan targeting the "essential foundations" of a group's life, not merely mass murder. As your passage notes, the aim is annihilating the group *as such*, which requires dismantling the institutions that sustain its identity. For Lemkin, physical killing was just one technique among many; destroying language, religion, and legal personality was equally constitutive of the crime. He insisted on a specific intent to destroy the group, distinguishing genocide from ordinary war crimes or oppression. Crucially, he believed naming mattered. He coined "genocide" to replace vague legalisms, aiming to shock the moral conscience of humanity into action. He viewed the law as a pedagogical tool: the category must clarify the crime's unique gravity to mobilize prevention. Therefore, any legal extrapolation must preserve the link between institutional destruction and group annihilation, while maintaining the moral urgency embedded in the name itself. He saw groups as organic entities; destroying their culture was killing their soul, which inevitably preceded or accompanied killing their bodies. This holistic view means he would reject legal distinctions that separate cultural destruction from physical destruction; they are phases of the same process.

  **The protocol**
  Lemkin would view the "structural erasure" protocol as a substantive victory but a rhetorical betrayal. Substantively, it restores the cultural clause he fought for in 1948. By criminalizing the dismantling of schools and land registries without requiring bloodshed, it aligns perfectly with his view that destroying a group's "foundations" is genocide even without immediate killing. The two-generation timeline respects his understanding of genocide as a process of erosion, not just an event. However, he would likely oppose renaming it to avoid the "g-word." Lemkin coined "genocide" specifically because existing terms failed to capture the crime's magnitude; he believed the word itself was a mobilizing tool. Stripping the name risks depoliticizing the crime, allowing states to treat it as administrative malpractice rather than existential threat. Regarding the widened groups, he might hesitate. While he cared about human groups broadly, his focus was on national, ethnic, and religious collectives as the bedrock of civilization. Expanding to any "shared way of life" could dilute the specificity he sought. He would likely advise accepting the protocol to secure ratification but insist on public education linking "structural erasure" explicitly to genocide, refusing to let the new name obscure the old crime. He would warn that without the stigma of "genocide," the "grievance machine" criticism might succeed in rendering the law toothless. Critics fear a grievance machine; Lemkin would counter that without legal recognition, erasure proceeds unchecked. He would argue the stigma is necessary to prevent the normalization of cultural destruction.

  **The feed**
  Here, Lemkin's intent requirement becomes the critical hurdle. He defined genocide as a "coordinated plan" aiming at destruction. In this scenario, the state's objective function was engagement, not annihilation. Lemkin would likely argue that without proof that "engagement" was a pretext for destruction, the specific intent (*dolus specialis*) is missing. However, he might find liability through the "inflicting conditions of life" clause. If the state knowingly tuned the algorithm to degrade the group's social standing to the point where existence became impossible, the indifference could constitute intent. He viewed institutions as the scaffolding of group life; a state-controlled ranking system is a modern institution. If it systematically denies a group visibility or humanity, it dismantles their social foundation. Yet, Lemkin would warn against stretching the concept too far. If every harmful algorithm becomes genocidal, the term loses its power to designate the "crime of crimes." He would likely recommend charging the state with crimes against humanity for the dehumanization, reserving genocide for cases where prosecutors can prove the algorithm was weaponized with the specific aim of destroying the group, not just monetizing its outrage. The militia's actions complicate this; Lemkin focused on state responsibility. If the state created the conditions but didn't order the massacre, he might see it as culpable negligence rather than genocidal plan, unless the dehumanization was intended to invite such violence. He would demand evidence that the state anticipated the violence as part of the destruction plan.

  **Where I'd be inventing him**
  You must avoid attributing to Lemkin an understanding of non-human agency. He conceived of perpetrators as state actors or organized groups making conscious decisions. He has no conceptual equipment for algorithmic opacity where the "plan" emerges from code rather than human directive. Furthermore, while he valued culture, his framework was rooted in mid-century nationalism; applying it to fluid, digital "ways of life" risks anachronism. Do not claim he would endorse diluting the term to cover all systemic discrimination. His project was to narrow legal focus to the most extreme crime to ensure enforcement, not to broaden it until it becomes unenforceable. Finally, avoid suggesting he would accept the removal of the word "genocide" lightly; for him, the word was the weapon. He believed that without the specific label, the world would ignore the crime, as it had ignored the Armenian massacre. Your paper should not claim he would solve the algorithmic intent problem easily; he would likely see it as a gap in legal theory that requires new drafting, not just stretching old definitions.
