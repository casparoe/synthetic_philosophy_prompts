answer: |-
  Welcome to the club. It is a muddle, and you are in good company; plenty of us who have spent decades staring at phylogenies find the transition to "normativity" and "intentionality" disorienting. The jump from *how a trait spread* to *what a trait means* is where the friction lives.

  Since you know your biology, I will skip the analogies (no smoke detectors) and give you a physiological case where the **Etiological Account (Millikan)** and the **Causal/Informational Account (Dretske)** diverge sharply.

  To make the contrast clean, I am referring to **Dretske's early informational semantics** (from *Knowledge and the Flow of Information*, 1981), which grounds content in current causal covariance, versus **Millikan's teleosemantics** (from *Language, Thought, and Other Biological Categories*, 1984), which grounds content in evolutionary history. (Note: Dretske later moved toward a functional view in *Explaining Behavior*, which converges with Millikan, but the "Causal Theory" label usually invokes the earlier informational view where the friction is highest).

  ### The Biological Case: The Noctuid Moth's Tympanal Organ

  **The Trait:**
  Consider the A1 auditory receptor cell in the tympanal organ of a Noctuid moth.
  *   **Physiology:** This neuron fires action potentials when stimulated by ultrasonic frequencies between 20 kHz and 80 kHz.
  *   **Behavioral Output:** When the A1 cell fires at a high rate, it triggers a fixed action pattern: a power dive or erratic flight to evade capture.

  **The Evolutionary History (The Etiology):**
  For millions of years, the *only* significant source of 40–60 kHz pulses in the moth's nocturnal environment was the echolocation calls of hunting bats (e.g., *Myotis* species). The A1 cell was selected *because* it correlated with bats. Moths that dove when A1 fired survived; moths that didn't, were eaten.

  **The Current Environment (The Causal Shift):**
  Imagine a population of these moths living near a modern industrial site. There is a piece of machinery (say, a high-frequency pest repeller or a leaking valve) that emits a constant, reliable 50 kHz pulse. In this specific niche, bats have been extirpated due to habitat loss.
  *   **Selection History:** The trait was selected to track **Bats**.
  *   **Current Causal Covariance:** The trait is now reliably caused by **Machinery**. (Bats are absent; the machine is the only cause of the firing).

  ---

  ### 1. Millikan's Verdict: The Etiological Account

  For Millikan, content is determined by **Proper Function**. Proper function is defined strictly by the history of selection.

  *   **The Question:** What does the A1 cell's firing *represent*?
  *   **The Answer:** It represents **"Bat Here."**
  *   **The Reasoning:** The mechanism exists *because* ancestors survived by responding to bats. The "Normal Condition" (with a capital N, a technical term for Millikan) is the condition under which the trait performed its function in the past.
  *   **The Misrepresentation:** When the A1 cell fires because of the **Machinery**, the moth is **misrepresenting** the world. The content of the neural state is "Bat," but the world contains "Machine." The moth is in a state of error, even though the causal link is 100% reliable in this new environment.

  For Millikan, you cannot update content just because the environment changed. The content is "frozen" by the history that gave the trait its existence.

  ### 2. Dretske's Verdict: The Causal/Informational Account

  For Dretske (in his causal/informational phase), content is determined by **Nomic Dependency** (reliable covariance). A signal carries the information that $s$ is $F$ if the conditional probability of $s$ being $F$, given the signal, is 1 (or near 1).

  *   **The Question:** What does the A1 cell's firing *represent*?
  *   **The Answer:** It represents **"50 kHz Pulse"** (or arguably **"Machine Here"** given the local covariance).
  *   **The Reasoning:** Content is fixed by what the signal *currently indicates*. In this specific population, the probability of a "Machine" given "A1 Firing" is 1.0. The probability of a "Bat" given "A1 Firing" is 0.0.
  *   **The Misrepresentation:** There is **no misrepresentation** here. The A1 cell is accurately reporting the presence of a 50 kHz pulse. The moth's *reaction* (diving) might be maladaptive (wasting energy), but the *representation* itself is true. The signal is doing exactly what a causal indicator should do: indicating its cause.

  ---

  ### Where the "Misrepresentation Problem" Lives

  This split is exactly where the philosophical battle over error (misrepresentation) is fought. This is often called the **Disjunction Problem**.

  **The Problem:**
  How do you distinguish between:
  1.  A system representing $X$ and failing (Error).
  2.  A system representing "$X$ or $Y$" and succeeding (Accuracy).

  In our moth case:
  *   **Millikan** says the content is **$X$ (Bat)**. Because the history selects for $X$, instances of $Y$ (Machine) are errors. She solves the Disjunction Problem by appealing to **history**. The machine is not part of the "Normal Conditions" that defined the function.
  *   **Dretske (Causal)** struggles here. If the state is caused by Bats *or* Machines, a strict causal theory suggests the content is **"Bat OR Machine."** If the content is the disjunction, then when the Machine triggers it, the representation is *true*. **Strict causal theories have a hard time allowing for error.** If the state is reliably caused by the machine, the machine is part of the meaning.

  **Why this matters for a biologist:**
  You know that traits often become **exaptations** or persist in **mismatched environments**.
  *   If you side with **Millikan**, you treat the nervous system as a **historical artifact**. A neural state can be "wrong" even if it is perfectly reliable in the current environment. This preserves the intuition that the moth is "mistaken" about the predator, even if it always dives when the machine hums.
  *   If you side with **Dretske (Causal)**, you treat the nervous system as a **measurement instrument**. If the instrument reliably registers the machine, it is measuring the machine. The "error" is not in the representation, but in the downstream motor program (the dive) which is no longer adaptive.

  ### The "Retired Biologist" Takeaway

  The reason you are getting stuck is that Millikan is asking a **phylogenetic question** ("What was this selected for?"), while Dretske (in this mode) is asking an **ecological question** ("What does this correlate with now?").

  *   **Millikan** saves the notion of **biological error** (maladaptation can be represented as false belief).
  *   **Dretske** saves the notion of **informational fidelity** (the signal truthfully reports its cause, even if the behavior is useless).

  Most contemporary teleosemantics sides with Millikan on this specific point because we want to say the moth is *wrong* about the bat, not just *unlucky* about the machine. But your intuition as a biologist might rebel: if the trait is no longer tracking bats, why insist the content is still "bat"? That rebellion is exactly the tension between etiology and causality.

  If you read further, you will find Dretske eventually conceded this point and incorporated "function" into his later work to solve this very problem, moving closer to Millikan. But the initial split you are feeling is the friction between **History** (Millikan) and **Covariance** (Dretske).
