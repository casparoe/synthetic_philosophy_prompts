      *   *Entrenchment:* Meta-learning? Historical performance of the *vocabulary* itself? This is the tricky part. In ML, we usually fix the vocabulary (features). Goodman says the vocabulary choice is the problem.
      *   *No Free Lunch:* Without bias, Green and Grue are equally likely.
