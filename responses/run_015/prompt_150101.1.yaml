      *   *Refining the Residue:* Challenge the "underspecification" point. In FOL, you *cannot* fix this by adding axioms (that's the LS theorem punchline). In PL, we often change the logic (e.g., to higher-order) to fix it.
      *   *Length Check:* Keep it tight. 2-3 paragraphs of prose + list.

  5.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address "internal vs external definability"? Yes, that's the core.
      *   *Check:* Did I address the "pun on exists"? Yes.
      *   *Check:* Did I argue with their guesses? I need to push back on (b). It's not just unavailable; it's provably impossible in FOL.
      *   *Check:* Is the distinction between PL (often higher-order/dependent) and ZFC (first-order) clear? This is crucial. Skolem's paradox applies to FOL formulations of set theory. If the PL is higher-order (like CoC), LS doesn't apply directly. I need to point out that the user's PL framework likely assumes a logic stronger than FOL, which is why the paradox feels dissolved.
      *   *Revision:* I need to make sure I don't confuse the user's DTT (which might be higher-order) with the FOL context of Skolem. I should frame the translation as "If you treat your type theory as a first-order theory of terms..." or acknowledge that DTT avoids this by not being FOL. Actually, the user asked to translate Skolem *into* their vocabulary. So I should treat their language $L$ as the object theory.
      *   *Key Insight:* The "Residue" is that PL people are comfortable with the gap between syntax and semantics because we *want* computability. Set theorists want to capture "all subsets". The residue is the *ambition* of set theory vs. the *humility* of PL.

  6.  **Final Polish:** Ensure the "Residue List" is distinct. Ensure the argument about "underspecification" is sharp (you can't axiomatize away Skolem in FOL).

