      *   **Task:**
          1.  Translate Skolem's Paradox into PL vocabulary (signatures, terms, models, etc.), using the user's specific proposed translation (Type $U$, Language $L$, countably many closed terms, $L$ proves no surjection $\mathbb{N} \to U$, metatheory sees enumeration).
          2.  Critique this translation: What maps cleanly? What had to be bent? Is it actually Skolem or something else (Gödel, Tarski, etc.)? How to modify to get "real" Skolem?
