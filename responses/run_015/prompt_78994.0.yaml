answer: |-
  Here is a complete design for a 90-minute seminar activity. It is built to force the students into the dogmatist's position procedurally, making the paradox emerge from their own decisions rather than your lecture.

  # Activity Title: The Tribunal Protocol

  ## 1. Conceptual Overview
  The students act as a final Court of Inquiry. They are given a Case File that establishes a fact ($p$) beyond reasonable doubt. They are then asked to draft a "Charter" governing how the Court handles new, contradictory evidence ($e$) that arrives *after* judgment. Finally, they are split into two indistinguishable groups: the **Veridical Track** (their evidence was true) and the **Divergent Track** (their evidence was false, though it looked identical).

  The trap: To draft the Charter, they must rely on the premise that they *know* $p$. If they know $p$, they are entitled to dismiss $e$. The Divergent Track students will exercise this entitlement and thereby entrench a falsehood. The Veridical Track students will exercise the *exact same entitlement* and protect the truth. Because the tracks are indistinguishable at the time of drafting, they discover that the rule protecting the knower is identical to the rule arming the fool.

  ## 2. Materials (Printable)
  *   **Case Files (14 copies):** Identical text. Describes a scenario (e.g., "Agent X was in Room 4") supported by "Verified Surveillance Logs" and "Biometric Swipes."
      *   *Secret:* On the back of 7 copies, print a small **[V]**. On the other 7, print a **[D]**. Do not let them see this.
  *   **Status Cards (14 cards):** Half say "Track: Alpha." Half say "Track: Beta." (This is your record-keeping, not theirs).
  *   **Charter Worksheet (14 copies):** A blank form with three clauses to fill in.
  *   **Intercept Envelopes (14 copies):** Sealed. Inside is a "Whistleblower Memo" providing strong evidence for $\neg p$ (e.g., "Agent X was in Room 9").
  *   **Shred Authorization Slips (14 copies):** A formal slip that says "I certify this evidence is misleading and order it destroyed."
  *   **Board Space:** Divide the whiteboard into two columns: **Admit** vs. **Shred**.

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: The Verdict (00:00 – 00:20)
  *   **Setup:** Hand out Case Files and Status Cards randomly. Tell them: "You are the final Court of Inquiry. Your job is to establish the truth of the matter based on the File."
  *   **Task:** They read the File (5 mins). It is designed to be overwhelming (video logs, multiple witnesses, physical traces).
  *   **The Commitment:** Ask the room: "Based on this File, do you *know* Agent X was in Room 4? Not 'believe,' not 'justified'—do you *know*?"
      *   *Facilitator Note:* If they hedge ("We are 99% sure"), push them. "For the purpose of this Tribunal, this File counts as a Knowledge-Generator. If you cannot claim knowledge here, the Tribunal cannot function. Do you have Knowledge?" Get a public show of hands. All should raise.
  *   **Action:** They sign the Verdict Form: "It is the finding of this Court that $p$ is True."

  ### Phase 2: Drafting the Charter (00:20 – 00:40)
  *   **Transition:** "The Court is now adjourned. The verdict is sealed. However, intelligence agencies often receive new data after a verdict is reached. You must now write the **Charter of Epistemic Duty**. This rule will bind all future Courts."
  *   **The Worksheet:** Hand out the Charter Worksheet. It has three blanks they must fill in logically:
      1.  *Premise 1:* If the Court **Knows** that $p$ is true...
      2.  *Premise 2:* ...and new evidence $e$ implies that $p$ is **false**...
      3.  *Conclusion:* ...then the Court is authorized to treat $e$ as \_\_\_\_\_\_\_\_\_\_.
  *   **Deliberation:** Give them 10 minutes to discuss in pairs and fill in the blank.
      *   *Expected Outcome:* They will write "Misleading," "False," or "Noise." They will rarely write "Re-evaluate," because they just committed to *Knowing* $p$ in Phase 1. If they know $p$, $e$ *must* be false.
  *   **The Signature:** They sign the Charter. This is their public commitment to the dogmatist rule.

  ### Phase 3: The Intercept (00:40 – 00:60)
  *   **The Event:** "A Whistleblower has leaked a new memo." Distribute the **Intercept Envelopes**.
  *   **The Constraint:** "You cannot reopen the Case File. You cannot check the surveillance again. You must decide: Does this memo get **Admitted** to the record, or **Shredded** based on the Charter you just wrote?"
  *   **The Action:** Hand out the **Shred Authorization Slips**.
      *   If they Admit: They tape the memo to the Board under "Admit."
      *   If they Shred: They sign the Slip, put the memo in their pocket (simulating destruction), and put the Slip on the Board under "Shred."
  *   **Observation:** Almost everyone will Shred. They will feel rational doing so. They *know* $p$. The memo says $\neg p$. Therefore the memo is wrong.

  ### Phase 4: The Reveal (01:00 – 01:10)
  *   **The Twist:** "Please turn over your Case File. Look at the letter on the back: **[V]** or **[D]**."
  *   **Explanation:**
      *   **[V] (Veridical):** Your File was accurate. Agent X *was* in Room 4. You knew $p$. You shredded false evidence. You were right.
      *   **[D] (Divergent):** Your File was flawed (the surveillance was looped). Agent X was *not* in Room 4. You did *not* know $p$. You shredded *corrective* evidence. You were wrong.
  *   **The Visual:** Look at the Board. The "Shred" column contains both the heroes (who protected truth) and the fools (who entrenched error).
  *   **The Silence:** Let this sit for a minute. Do not explain yet. Ask the [D] students: "Did you follow the rules?" (Yes). "Did you use the same logic as the [V] students?" (Yes).

  ### Phase 5: Debrief & Reconstruction (01:10 – 01:30)
  *   **Mapping the Paradox:** Write the four steps of the Dogmatism Paradox on the board. Ask them to point to where each happened in the game.
      1.  *I Know $p$:* Phase 1 (The Verdict).
      2.  *I Know ($p \to \neg e$):* Phase 2 (The Logic of the Charter).
      3.  *I Know $e$ is misleading:* Phase 2 (Filling the blank).
      4.  *I am entitled to ignore $e$:* Phase 3 (Signing the Shred Slip).
  *   **Addressing Resistance 1 (The KK Principle):** Ask the [D] students: "When you signed the Charter, did you think you knew?" (Yes). "Could you have known that you didn't know?" (No, the File looked identical).
      *   *Point:* The paradox assumes you can claim knowledge without knowing *that* you know. The game shows why that's dangerous: the license to ignore is issued on the *claim*, not the *fact*.
  *   **Addressing Resistance 2 (Rationality vs. Knowledge):** Ask: "Even if you didn't *know* $p$ (as the [D] group turned out), was it *rational* to shred?"
      *   Many will say "Yes, given what I had."
      *   *Point:* This separates "Rational Belief" from "Knowledge." The paradox works for Knowledge. If we downgrade to Rational Belief, the entitlement to ignore vanishes (because rational beliefs are defeasible). But if we stay with Knowledge, we get the paradox.
  *   **Closing:** "The rule you wrote is valid for Knowers. But since you can't distinguish Knowers from Confident Fools from the inside, the rule is a machine that protects truth and entrenches error with equal efficiency."

  ## 4. Limitations (Be Honest Here)
  In the debrief, explicitly state what the game *cannot* do:
  1.  **The A Priori Link:** The game simulates the *entitlement* to ignore, but it doesn't fully capture the *a priori* deduction that ($p \to \neg e$). In the game, they treat it as a practical rule. In the paradox, it's a logical closure principle.
  2.  **Knowledge vs. Justification:** The game relies on you (the instructor) stipulating that the [V] group "Knew." Philosophically, some might argue that if there was a risk of [D], they never had Knowledge to begin with (Infallibilism). The game forces Fallibilist Knowledge to make the paradox bite. Acknowledge this tension: "We played with Fallibilist Knowledge. If you are Infallibilists, the paradox dissolves, but so does most of what we claim to know."

  ## 5. Predictable Failure Points & Improvisation Lines

  **Failure Point 1: The Hedge.**
  *   *What happens:* In Phase 1, students refuse to say "Know." They say "We are justified in believing."
  *   *Why:* They smell the trap.
  *   *Fix:* You must stipulate the definition.
  *   *Line to have ready:* "I am not asking for metaphysical certainty. I am asking if, by the standards of this Tribunal, this evidence settles the matter. If 'Knowledge' just means 'Evidence that settles the matter,' do you have it? If you say no, the game ends, because you have no authority to judge anything."

  **Failure Point 2: The Pragmatic Dodge.**
  *   *What happens:* In Phase 3, they say "I'll shred it for the record, but I'll secretly look at it."
  *   *Why:* They are trying to keep rationality separate from the official rule.
  *   *Fix:* Enforce the "Sealed Court" constraint.
  *   *Line to have ready:* "This is a security protocol. If you open the envelope, you contaminate the chain of custody. You must choose: Admit to Record or Shred Unread. There is no 'look privately.' The act of looking is the update."

  **Failure Point 3: The "Bad Case" Blame.**
  *   *What happens:* In Phase 4, the [V] students say "Well, the [D] students were negligent."
  *   *Why:* They want to preserve the idea that the rule is safe if used correctly.
  *   *Fix:* Highlight the indistinguishability.
  *   *Line to have ready:* "Look at the Case Files. They are identical. Look at the Charters. They are identical. The [D] group did nothing different than the [V] group. If the rule is safe, why did it fail half of you? If the rule is dangerous, why did it save the other half?"

  ## 6. Board Setup (Before Class Starts)
  Draw this on the board so it's visible during Phase 2:

  | **THE CHARTER** |
  | :--- |
  | **IF** The Court **KNOWS** $p$ is True |
  | **AND** New Evidence $e$ implies $p$ is False |
  | **THEN** The Court is authorized to treat $e$ as: \_\_\_\_\_\_\_\_\_ |
  | *(Options: Misleading / Noise / False / Defeater)* |

  This visual anchor keeps them focused on the logical structure during the drafting phase, ensuring they produce the Dogmatist conclusion themselves.
