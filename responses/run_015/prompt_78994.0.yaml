          *   *Cons:* Real-world pragmatics (money) might overshadow epistemic norms. Students might focus on risk management rather than knowledge norms.

      *   *Idea 3: The Sealed Verdict (Jury).* Students are jurors. They deliberate and reach a verdict. Then the Judge hands them a note: "If you *know* the defendant is guilty, you may ignore new alibi witnesses as fabrication."
          *   *Pros:* Legal epistemology is familiar.
