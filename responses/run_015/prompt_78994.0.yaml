      *   *Idea 4: The Oracle's Certificate (The Chosen One).* Students are "Agents." They receive a sealed mission objective ($p$). They are given a "Clearance Level" card that says "Level 5 Knowledge Clearance: You are authorized to treat conflicting intel as disinformation." They have to complete a task based on $p$. Later, they receive "Intel Packets" contradicting $p$. They must decide whether to open them or shred them based on their Clearance.
