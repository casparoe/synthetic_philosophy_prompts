      *   *Idea 1: The Detective Board.* Students are detectives solving a crime. They get a "Case File" (initial evidence) leading to a suspect. Then they get "New Tips" (contrary evidence). They have a rule card: "If you are Certain, you may discard Tips that contradict your Certainty."
