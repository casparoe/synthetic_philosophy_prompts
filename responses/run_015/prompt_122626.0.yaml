answer: |-
  **MEMORANDUM**

  **TO:** Research Priorities Committee
  **FROM:** [Your Name/Title]
  **DATE:** April 10, 2024
  **SUBJECT:** Recommendation for 2024 Postdoctoral Fellowship Allocation

  **1. Purpose and Recommendation**

  This memo serves to frame the final decision regarding the allocation of the restricted endowment for the 2024–2026 Postdoctoral Fellowship. Following our review of the two finalist proposals—Controlled-Atmosphere Stunning (CAS) for Broiler Chickens and Welfare Indicators for Farmed Black Soldier Fly Larvae (BSFL)—I recommend the Committee award the fellowship to the **Broiler Chicken CAS project**.

  This recommendation is not a judgment on the scientific rigor of the BSFL proposal, which is exemplary. Rather, it is a determination based on the alignment with our Terms of Reference (ToR) regarding the timeline for practice change, and a risk assessment concerning the net welfare impact of interventions in emerging invertebrate industries. I propose we adopt this recommendation at the April 17 meeting, with a trigger to revisit the BSFL scope in the 2026 cycle contingent on market elasticity data.

  **2. Alignment with Terms of Reference**

  Our ToR mandates that funded work must yield findings capable of changing purchasing or husbandry practice within five years. The CAS proposal meets this criterion with high confidence. The technology exists; the barrier is cost and reliability in mid-sized plants. A two-year fellowship can produce a validated protocol that processors can adopt immediately upon completion, well within the five-year window.

  The BSFL proposal faces a structural hurdle here. While the fellowship would successfully validate welfare indicators (e.g., stocking density, thermal thresholds), the ToR requires these indicators to change *practice*. Practice change in this sector depends on the industry accepting that larvae require welfare protections. As noted in our deliberations, the sentience question is unlikely to be settled within the five-year window. Without a consensus on sentience, welfare indicators remain academic metrics rather than drivers of husbandry change. While the proponents argue indicators are usable regardless of sentience, industry adoption relies on the *moral* imperative, not just the technical metric. Therefore, the probability of practice change within five years is significantly lower for BSFL than for CAS.

  **3. The Expected Value Calculation and Sentience Probabilities**

  A primary argument for the BSFL proposal rests on an expected value (EV) calculation: the vast number of insects ($10^{18}$) multiplied by a low probability of sentience (1–2%) ostensibly swamps the certain suffering of vertebrates. Two committee members have rightly questioned whether multiplying by an epistemic probability we cannot estimate is distinguishable from multiplying by an invented number.

  For the purpose of this decision, we must be explicit about our assumptions. We are not ruling out insect sentience. We are proceeding under the assumption that insect sentience is *plausible but unquantified*, whereas vertebrate sentience is *established*. In policy decisions, there is a distinction between risk (known probabilities) and Knightian uncertainty (unknown probabilities). When the probability parameter is derived from philosophical contention rather than empirical frequency, the resulting EV figure is unstable.

  If we treat the 1% sentience estimate as a hard variable, we imply a precision we do not possess. If the true probability is 0.001% or 0%, the EV collapses. Conversely, if it is 10%, the EV explodes. Because this variable dominates the equation, basing our allocation on it renders the decision sensitive to a parameter we cannot move. By contrast, the CAS project operates on a variable we *can* move: the certainty of pain reduction per individual. We prioritize the robustness of the welfare gain over the speculative scale of the population.

  **4. The Problem of Unsigned Net Effects**

  The second, and perhaps more critical, complication is the "scale effect" raised regarding market leakage. The argument posits that welfare certification makes an industry politically palatable, potentially increasing production volume. If improved welfare standards reduce the reputational cost of insect protein, demand may rise. If demand rises sufficiently, the total number of insect-life-years could increase, even if suffering *per larva* decreases.

  In the CAS project, the intervention is a processing upgrade. It adds cost and reliability to an existing mature market. It is unlikely to significantly expand the total number of chickens slaughtered; it merely alters the manner of death. The net effect on total suffering is negative and signable.

  In the BSFL project, the intervention is foundational. It helps build the regulatory architecture of a nascent industry. If our work facilitates welfare certification, and that certification unlocks institutional purchasing (e.g., school meals, retail contracts) that was previously blocked by ethical concerns, we may inadvertently scale the industry faster than it would have grown without us. Because we cannot currently model the price elasticity of demand for insect protein relative to welfare certification, we cannot *sign* the net effect on total suffering. It could be positive (reduced suffering per bug dominates) or negative (increased bug numbers dominate).

  An intervention whose net effect we cannot sign cannot be prioritized over an intervention whose net effect is demonstrably negative (i.e., suffering reduction) on expected-value grounds, regardless of the population size. To fund the BSFL project now would be to gamble that the intensity of suffering averted per larva outweighs the potential expansion of the total population, without data to support that wager.

  **5. Path Forward and Trigger for Re-evaluation**

  Rejecting the BSFL proposal this cycle is not a dismissal of invertebrate welfare. It is a acknowledgment that the field currently lacks the data required to satisfy our ToR regarding practice change and net impact.

  Therefore, I recommend the following structured alternative for the future:
  1.  **Award the 2024 Fellowship to the CAS Project.**
  2.  **Commission a Scoping Review:** Allocate a small portion of discretionary funds (not endowment) to commission a rapid scoping review on the market elasticity of insect protein. Specifically: *Does welfare certification correlate with increased institutional procurement in nascent alternative protein markets?*
  3.  **2026 Trigger:** If the scoping review suggests that welfare standards do not significantly drive volume expansion, or if empirical consensus on insect sentience shifts markedly by 2026, we will prioritize a BSFL-focused fellowship in the next endowment cycle.

  **6. Conclusion**

  This decision prioritizes the certainty of suffering reduction over the magnitude of speculative impact. It acknowledges that while the arithmetic of insect numbers is compelling, it relies on inputs (sentience probability, market elasticity) that are currently too uncertain to support a high-stakes allocation under our current Terms of Reference.

  The unsuccessful applicant should understand that this decision rests on the *indeterminacy of the net effect* and the *timeline for practice adoption*, not on the quality of the proposed methodology. We invite the BSFL team to engage with the scoping review process, as their expertise will be vital in determining when the field is ready for this level of investment.

  Please review this recommendation prior to our session on April 17. I look forward to finalizing the allocation.
