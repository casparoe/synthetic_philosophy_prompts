  4.  **Drafting - Content & Tone Check:**
      *   *Tone:* Institutional, deliberative, firm but fair.
      *   *Word Count:* Aiming for ~1,200.
      *   *Key Arguments to Integrate:*
          1.  $P(\text{sentience}) \times N(\text{individuals})$: Is this valid? (Address the "invented number" critique).
          2.  Leakage/Scale: Does welfare certification increase production? (Address the "unsigned effect" critique).
          3.  Timeline: Can we change practice in 5 years?
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm saying insects *aren't* sentient. I must say that *even if* they are, the intervention might not reduce suffering due to market expansion. This addresses the "unsigned net effect" complication directly.

  5.  **Refining the Argument (Mental Sandbox):**
