          2.  Welfare indicators for farmed black soldier fly larvae (invertebrate, speculative sentience, huge numbers, potential for industry shaping).
      *   **Key Conflict:** "Numbers game" (expected value based on vast insect numbers $\times$ low sentience probability) vs. "Robustness" (focus on undisputed sentience and measurable impact).
      *   **Complications to Address:**
          1.  *Leakage/Scale Effect:* Welfare standards might increase production (and thus total insect-years), making the net effect on suffering ambiguous or negative.
          2.  *Timeline Constraint:* Terms of reference require findings to change practice within 5 years. Sentience won't be settled, though indicators will exist.
      *   **Requirements:**
          *   Recommend a concrete course of action (choose one, split fund, defer, etc.).
          *   Include a time frame.
          *   Provide reasons detailed enough for the unsuccessful applicant to respond to.
          *   Engage the strongest version of the rejected case (specifically regarding probability of sentience and unsigned net effects).
          *   Be explicit about assumptions on sentience (don't try to resolve it philosophically).
          *   Length: Roughly 1,200 words.
          *   Tone: Professional, decisive, respectful, suitable for a meeting packet.

  2.  **Determine the Recommendation:**
      *   *Option A: Fund Chickens.* Safe, aligns with terms of reference (practice change within 5 years), avoids the "invented number" critique. But ignores the potential scale of insect suffering.
      *   *Option B: Fund Insects.* High risk, high reward. Addresses the "numbers" argument. But faces the "leakage/scale" objection (might increase total suffering) and the timeline constraint (sentience unresolved).
      *   *Option C: Hybrid/Deferred.* Fund the chicken project (meets terms of reference, robust sentience) but allocate a small portion for scoping on insects? The prompt says "single two-year postdoctoral fellowship." Splitting might violate the endowment restriction. Deferring with a trigger is possible.
      *   *Decision:* The prompt asks to address the complications *rather than note them*. The "leakage" argument is strong against the insect project *if* the goal is reducing total suffering. The timeline constraint is strong against the insect project *if* the goal is practice change based on sentience. However, the insect proposal claims indicators yield usable results *regardless* of sentience.
      *   *Strategic Choice:* The most defensible position, given the "Terms of Reference" (practice change within 5 years) and the "Leakage" risk, is to fund the **Chicken Project**. Why? Because the insect project's expected value is currently uncalculable due to the direction of the effect (might increase production), whereas the chicken project has a clear negative reduction in suffering per bird.
      *   *Wait, let's look closer.* The insect proposal argues for *indicators*. If we fund indicators, we enable welfare certification. If certification boosts demand, we might increase total suffering. This is the "scale effect" complication. The chicken project is about *stunning*, which reduces suffering per bird without necessarily boosting demand significantly (it's a cost/reliability upgrade).
      *   *Refined Decision:* Fund the **Broiler Chicken Fellowship**. It best satisfies the Terms of Reference (practice change within 5 years is certain vs. speculative for insects) and avoids the risk of inadvertently scaling an industry with unknown welfare status.
      *   *Alternative:* Fund the Insect Fellowship *but* acknowledge the risks? No, the prompt asks to engage the strongest version of the rejected case. Rejecting the insect case allows for a deeper discussion on the "probability $\times$ number" math and the "unsigned effect" problem.
      *   *Actually, a nuanced approach might be better:* Fund the Chicken Fellowship *now*, but commit to a review of the Insect question in 2 years. Or, acknowledge the insect argument's strength but prioritize the *certainty* of impact.
      *   *Let's stick to the prompt's constraints:* "Recommend a concrete course of action... one of the two fellowships, or a structured alternative."
      *   *Decision:* I will recommend funding the **Broiler Chicken Fellowship**. This allows me to directly address the "numbers" argument and the "leakage" argument as reasons for *not* funding the insect project this cycle, while validating the scientific merit of the insect proposal.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (allocation decision) and the recommendation clearly.
      *   **Context:** Briefly acknowledge the strength of both proposals.
      *   **The Core Decision Logic (The "Why"):**
          *   Address the Terms of Reference (5-year practice change).
          *   Address the Sentience/Probability math (engaging the "invented number" critique).
          *   Address the Leakage/Scale Effect (the "unsigned net effect" complication).
      *   **Engaging the Rejected Case:** I need to treat the Insect Proposal's "Expected Value" argument seriously. I shouldn't just dismiss sentience; I should dismiss the *calculability* of the intervention's impact given the market dynamics.
      *   **Assumptions on Sentience:** Be explicit. We are not ruling out insect sentience. We are ruling out the *actionability* of that uncertainty under current constraints.
