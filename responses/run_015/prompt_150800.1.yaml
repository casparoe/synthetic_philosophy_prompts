          *   *Revision:* Weaken (ii). Admit that while the *content* is interpretive, the *logic of validation* is causal/counterfactual. Or weaken (iii) to say counterfactuals are heuristic, not strict conditions.
          *   *Cheapest:* Weaken (ii). Acknowledge that "different logical form" refers to the *input* (meaning), not the *validation structure*.
          *   *Cost:* Loses the pure hermeneutic stance. Moves closer to analytical sociology.

      *   **For (i) vs. (v):**
          *   *Revision:* Qualify (v). Acknowledge that *some* org culture is real, but *most* tech talk is fluff. Or qualify (i): Weber was right *because* the institutionalization was deeper than in tech.
          *   *Cheapest:* Qualify (v). Change "typically" to "in highly financialized markets where incentives are explicit."
