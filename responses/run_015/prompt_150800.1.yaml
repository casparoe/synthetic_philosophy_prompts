      *   If (ii) is softened to say "Cultural explanations rely on interpreting meaning, *but* their causal validity is tested counterfactually," then (iii) is satisfied, (i) is supported (Weber used counterfactuals), and (v) is supported (Tech culture fails the counterfactual test).
      *   Actually, looking closer: The tension between (i)/(iv) and (v) is the most practical "gotcha" a discussion group will pounce on. "Why is Calvinism real but Innovation Culture fake?"
