answer: |-
  **Project Title:** The Architecture of Absolution: Distinguishing Political and Moral Forgiveness in Transitional Amnesty Provisions

  **Research Question**
  Does the normative legitimacy of amnesty provisions within truth commissions depend upon maintaining a rigorous conceptual distinction between political forgiveness—defined as an institutional, collective act restoring civic membership—and moral forgiveness, which remains the exclusive prerogative of individual victims?

  **Problem Statement and Theoretical Gap**
  Contemporary transitional justice literature frequently evaluates amnesty through a binary lens: either as a failure of retributive justice (impunity) or as a mechanism of restorative justice (reconciliation). Both accounts treat reconciliation as a unified endpoint, thereby conflating the legal restoration of political order with the moral resolution of interpersonal harm. This conflation generates normative ambiguity. When amnesty is framed solely as restorative, the state risks usurping the victim's moral authority to forgive; when framed solely as retributive compromise, it obscures the specific political work amnesty performs in reinstating perpetrators as civic agents. This ambiguity explains why distinct transitional models generate divergent legitimacy conditions. For instance, the forensic-documentation model associated with Argentina and the ubuntu-informed hearing model associated with South Africa both sought democratic transition, yet they established structurally different conditions for legitimate amnesty. Standard accounts fail to explain this divergence because they lack a vocabulary to distinguish the institutional act of political reintegration from the interpersonal act of moral absolution.

  **Methodology**
  This project employs a conceptual method rather than an empirical cross-case study. It proceeds through a comparative analysis of the institutional language found in amnesty provisions and truth commission mandates. The analysis maps specific textual clauses against the philosophical structure of forgiveness. Instead of measuring the historical success or failure of transitions in Argentina or South Africa, the project treats these contexts as archetypes of competing conceptual frameworks. The inquiry focuses on how institutional texts allocate authority: does the language claim to resolve moral guilt, or does it limit itself to suspending legal liability for the sake of civic restoration? By isolating the linguistic markers of political versus moral claims, the project determines whether legitimacy correlates with the preservation of this boundary.

  **Deliverable**
  The workshop will receive a normative framework for evaluating amnesty clauses. This framework will offer a typology of legitimacy conditions based on the separation of political and moral spheres. It will provide interdisciplinary scholars with a diagnostic tool to assess whether specific transitional justice mechanisms illegitimately conflate state authority with victim agency. This is particularly useful for legal theorists and political philosophers seeking to refine the criteria for justified amnesty without relying on vague notions of "peace" or "healing."

  **Conditions of Project Failure**
  The project will be deemed unsuccessful if the proposed distinction between political and moral forgiveness collapses into a merely rhetorical difference with no bearing on legitimacy conditions. Specifically, failure occurs if the analysis demonstrates that institutional language cannot practically separate civic reintegration from moral absolution, or if maintaining the distinction yields no explanatory power regarding why certain amnesty provisions are accepted as legitimate while others are rejected. If the boundary proves porous to the extent that political amnesty inevitably implies moral forgiveness regardless of textual safeguards, the core thesis regarding normative legitimacy will be untenable.
