  I'm currently enrolled in a philosophy-of-biology seminar that has spent the last three weeks on self-replication and the so-called DNA–Gödel isomorphism—specifically, Hofstadter's notion of typogenetics and whether the cell's capacity to build its own interpreter amounts to a genuine logical self-reference or only a suggestive metaphor. For our discussion section I need a written dialogue that moves well past the standard rehearsal of the analogy.

