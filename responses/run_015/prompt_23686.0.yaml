      *   **Characters:**
          *   Pragmatic Encroacher (PE): Stanley & Williamson / Fantl & McGrath style (knowledge depends on practical stakes).
          *   Lewisian Contextualist (LC): David Lewis style (knowledge depends on conversational context/salience of error possibilities).
      *   **Scenario:** A resident checking a lab value. Stakes change (patient condition turns critical), but conversational context stays fixed (same interlocutors, same topic).
      *   **Key Arguments to Include:**
          *   LC: Is it truth or assertability? Ought-implies-can regarding assertion.
          *   PE: The "At-Issue" problem (knowledge is the subject matter, not just conversation rules), why should truth ride on conversation?
      *   **Format:** Sharp dialogue, real back-and-forth (not monologues), unresolved ending.
      *   **Goal:** Help the user distinguish the theories for a dissertation proposal.

  2.  **Deconstruct the Theories:**
      *   **Contextualism (Lewis):** "Knows" is context-sensitive. The standard for knowledge shifts based on what error possibilities are *salient* in the conversation. If we aren't talking about rare diseases, the standard is low. If we mention them, the standard goes up. Crucially, the *subject's* stakes don't matter directly; the *attributor's* conversational context matters.
      *   **Pragmatic Encroachment (Stanley/Fantl & McGrath):** "Knows" is *not* context-sensitive in its semantic content (usually invariantist), but whether the belief counts as knowledge depends on the *subject's* practical situation (stakes). High stakes = higher evidential threshold required for knowledge.
      *   **The Conflict:** In the proposed case (Resident/Patient), the conversational context is fixed (so LC says truth value should stay same), but stakes change (so PE says truth value changes). This isolates the variable.

  3.  **Drafting - Section by Section:**

      *   **Setup:** Establish the case clearly. Dr. Aris (Resident), Patient 404. Lab value X.
      *   **Opening Move (PE):** Set the trap. Morning (low stakes) vs. Afternoon (high stakes). Same conversation. Aris says "I know" in the morning. In the afternoon, PE says "I know" is false.
      *   **Contextualist Pushback:** LC needs to argue that nothing changed semantically. Maybe Aris shouldn't *say* it in the afternoon, but it's still true. Introduce the Assertability vs. Truth distinction.
      *   **Encroacher Counter:** It's not just rude to say it; the belief isn't knowledge. Action-based argument (Knowledge Norm of Action/Assertion). If you can't act on it, you don't know it.
      *   **Contextualist Rebuttal (Ought-Implies-Can):** If stakes make it irrational to act, that doesn't mean the belief state changed. It means the *cost of error* changed. Lewis's rule of attention.
      *   **Encroacher Press (At-Issue):** Why does the *conversation* determine facts about the world (or the mind)? If we ignore the stakes, we get the wrong answer about whether Aris should operate.
      *   **Contextualist Press (Truth vs. Appropriateness):** If "I know" becomes false just because the patient got sicker, did Aris's evidence vanish? No. So you're changing the meaning of evidence.
      *   **Stalemate:** End with both sides dug in on their core intuition (Action vs. Semantic Stability).

  4.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Critique:* Make sure the LC doesn't sound like an Invariantist. LC must stick to *conversational* context.
      *   *Correction:* Ensure LC emphasizes that since the *conversants* didn't raise new error possibilities, the semantic content of "knows" didn't shift.
      *   *Critique:* Make sure PE doesn't sound like a Subject-Sensitive Invariantist (SSI) without explaining it. (Actually, PE *is* often SSI). Let's stick to the Fantl & McGrath "Knowledge in an Uncertain World" vibe.
      *   *Tone:* Needs to be academic but punchy. No long speeches.
