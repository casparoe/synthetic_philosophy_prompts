answer: |-
  **Characters:**
  *   **Jordan:** Pragmatic Encroacher (Stanley/Fantl & McGrath style).
  *   **Elena:** Epistemic Contextualist (Lewisian style).

  **Setting:** A coffee shop. They are discussing a case for Jordan's dissertation.

  **Jordan:** Let's lock the case down. Dr. Aris checks a lab value at 9 AM. The patient is stable. She has standard evidence—let's say the test is 95% reliable. She tells the nurse, "I know the potassium is normal." At 2 PM, the patient goes critical. Same evidence, same test result, same nurse standing there. But now, if she acts on that 95% probability without a re-test, the patient might die. Aris says, "I know the potassium is normal." My claim is simple: At 9 AM, that sentence is true. At 2 PM, it's false.

  **Elena:** I deny the falsity. You're conflating the *truth conditions* of "knows" with the *appropriateness conditions* of acting or asserting. In my Lewisian framework, the semantic content of "knows" is fixed by the conversational context. Specifically, which error possibilities are salient. In your scenario, you stipulated the conversation stays fixed. The nurse and Aris are talking about routine maintenance. No one has mentioned the rare enzyme deficiency that mimics high potassium.

  **Jordan:** Exactly. The conversation is fixed. The *stakes* are what changed. That's the point. If contextualism is right, and the conversational score hasn't shifted, then "Aris knows" should be true at 2 PM. But intuitively, Aris *doesn't* know at 2 PM. She needs more evidence. She needs a re-test.

  **Elena:** She needs more evidence to *act*, Jordan. Not to *know*. Look, Lewis has rules for when standards shift. The Rule of Attention says if we attend to an error possibility, it becomes relevant. But mere practical danger doesn't force an error possibility into the conversation unless someone mentions it. If Aris and the nurse are blissfully ignoring the risk, the standard remains low. So, strictly speaking, Aris *does* know. It's just that asserting it is reckless.

  **Jordan:** Reckless because she doesn't know. You're trying to save the truth of "knows" by offloading the work onto norms of assertion. But consider the Knowledge Norm of Assertion: You should assert *p* only if you know *p*. If it's inappropriate for Aris to assert "I know" at 2 PM, the simplest explanation is that the norm is violated. She doesn't know.

  **Elena:** That's too quick. Norms of assertion are complex. There's a norm of *prudence* alongside the norm of knowledge. Even if I know the bridge is safe, if the stakes of being wrong are "I die," asserting "It's safe" might be inappropriate because I can't guarantee the outcome to your satisfaction. But that doesn't mean I lacked knowledge. It means the cost of error has outpaced the utility of the assertion. You're treating "I know" as a guarantee of safety. It's not. It's a guarantee of epistemic position.

  **Jordan:** But epistemic positions aren't stake-proof. Fantl and McGrath's argument is precisely that rational action depends on knowledge. If Aris is rational, she won't operate at 2 PM on the 95% test. If she won't operate, she doesn't treat the proposition as known. If knowledge is the norm of practical reasoning, then the change in practical reasoning signals a change in knowledge. You're saying she knows, but she can't use what she knows. That violates *ought-implies-can*.

  **Elena:** How so?

  **Jordan:** If she *ought* to get a re-test before acting, she *ought* not to act on her current belief. If knowledge is the state that licenses action, and she's not licensed to act, she doesn't have the state. You're saying she has the license (knowledge) but she's forbidden to use it (action). That makes knowledge practically inert.

  **Elena:** I'm saying the *license* is context-sensitive, not the state. Wait, no—I'm saying the truth of the ascription is context-sensitive. Look, let's turn the table. You say the truth value of "Aris knows" flips at 2 PM because the stakes rose. But Aris's evidence didn't change. Her brain state didn't change. The world didn't change. Only her *desires* and the *consequences* changed. Why should the factivity of "knows" ride on how much she cares about the outcome?

  **Jordan:** Because "knows" isn't describing a brain state. It's describing a relation between an agent and a proposition sufficient for *reliance*. If reliance requirements shift, the relation shifts. But let's hit your view harder. You say the truth depends on the *conversation*. Suppose Aris is in the high-stakes situation, but she's talking to a philosopher who says, "Let's ignore all error possibilities." By your lights, does Aris know?

  **Elena:** In that conversation, yes. The philosopher has lowered the standards by making error possibilities irrelevant.

  **Jordan:** That's the bullet I want you to bite. So, whether Aris knows depends on what the philosopher is chatting about? That's the "At-Issue" problem. When we ask "Does Aris know?", we are asking about Aris's epistemic position relative to her environment. We aren't asking "Is Aris's epistemic position good enough for this specific chat?" If the patient dies because Aris relied on a "knowledge" ascription that was only true because a philosopher was being lax, your theory has failed to track the normativity that matters.

  **Elena:** You're assuming there's one "epistemic position" independent of context. I deny that. "Knows" is indexical, like "tall." "Aris is tall" is true in a kindergarten context, false in an NBA context. Does Aris's height change? No. Does the truth of the ascription change? Yes. Why is "knows" different?

  **Jordan:** Because "tall" is explicitly gradable relative to a comparison class. "Knows" presents itself as binary and factive. When Aris says "I know," she isn't saying "I meet the standards of this chat." She's saying "I have eliminated relevant alternatives." The stakes *make* alternatives relevant, regardless of whether we talk about them. The possibility of death is relevant at 2 PM even if no one mentions it. Your view makes truth too fragile. It floats on the breeze of conversation.

  **Elena:** And your view makes truth too expensive. You're saying if the stakes get high enough, knowledge vanishes. So, if I'm betting my life on 2+2=4, do I stop knowing it?

  **Jordan:** You still know it, because the evidence is maximal. In Aris's case, the evidence is fallible. 95% isn't proof. At low stakes, 95% is enough to count as knowledge. At high stakes, it isn't.

  **Elena:** But that means two agents with identical evidence, identical cognitive processes, and identical environments differ on knowledge *solely* because one has more to lose. That looks like you're defining knowledge as "enough evidence to justify action." But justification for action and truth of knowledge ascriptions come apart. I can be justified in believing a lottery ticket will lose (statistically), but I don't *know* it.

  **Jordan:** The lottery case is different; that's probabilistic independence. Here, the evidence is directly about the world. Look, let's go back to assertion. You said Aris *could* assert "I know" at 2 PM, it's just inappropriate. If "I know" is true, and assertion requires truth, why is it inappropriate?

  **Elena:** Because assertion also requires *helpfulness* and *safety*. If asserting "I know" leads the nurse to relax vigilance when she shouldn't, the assertion is misleading, even if true. It implicates that the risk is negligible.

  **Jordan:** But that implicature is cancellable. "I know, but the stakes are high so check again." That sounds contradictory.

  **Elena:** It sounds contradictory because in high stakes, "I know" *conversationally implies* "It's safe to act." But the semantic content remains "My evidence eliminates relevant alternatives." Since we haven't made the death alternative relevant in our chat, it's not a relevant alternative.

  **Jordan:** But the *patient* makes it relevant! The ontology of the situation forces the alternative into relevance, not the chat. You're prioritizing the linguistics over the metaphysics of the situation.

  **Elena:** And you're prioritizing the practical over the epistemic. You haven't explained *how* stakes change evidence. They don't. They change *us*.

  **Jordan:** They change whether our evidence is *good enough*. And "good enough" is part of the truth conditions of knowledge.

  **Elena:** "Good enough for what?"

  **Jordan:** "Good enough to know."

  **Elena:** Circular.

  **Jordan:** Informative, though.

  **Elena:** (Sips coffee) We're not moving. You think the world forces standards on us. I think we impose standards on the world through talk.

  **Jordan:** And until we agree on whether "knows" tracks the world or the talk, Aris is still guessing.

  **Elena:** At least we both agree she should run the re-test.

  **Jordan:** True. But for different reasons. You think she knows but should be careful. I think she doesn't know *because* she needs to be careful.

  **Elena:** Same prescription, different diagnosis.

  **Jordan:** In medicine, the diagnosis matters.

  **Elena:** In epistemology, so does the semantics.

  *(They sit in silence, the disagreement hanging unresolved between the practical and the conversational.)*
