      *   *Specific Argument:* "At-Issue." PE asks: When we ask "Does Aris know?", are we asking about the conversation or the bank/patient?

  5.  **Final Polish:** Check the names. Let's call them "Morgan" (Encroacher) and "Lewis" (Contextualist - or maybe "Carla" to avoid confusion with David Lewis himself. Let's go with "Elena" for Contextualist and "Jordan" for Encroacher).
      *   *Wait, one nuance:* Lewisian contextualism specifically relies on the *attributor's* context. In the case, who is attributing? If Aris says "I know," Aris is the attributor. If the stakes change for Aris, does Aris's conversational context change?
      *   *Fix:* To make the case work for the prompt ("conversation stays fixed"), we need an external attributor or a scenario where the conversational salience remains low despite the stakes. Let's have a Senior Doctor (Dr. Chen) asking Aris. Chen doesn't know the stakes changed yet, or simply isn't mentioning error possibilities.
      *   *Better Fix:* The prompt specifies "Resident checking a lab value." Let's have the dialogue be between the philosophers discussing the case of Dr. Aris.
      *   *Wait, the prompt asks for a dialogue *between* the Encroacher and Contextualist.* Okay, so Jordan (PE) and Elena (LC) are discussing the case of Dr. Aris.
      *   *Crucial Detail:* In the afternoon, the patient is critical. Aris needs to be sure. Aris has the *same evidence* as the morning.
      *   *Elena (LC):* Since we (the philosophers) aren't raising error possibilities, "Aris knows" is true in our context. But wait, if we evaluate Aris's utterance... Let's stick to the standard move: The truth conditions of "Aris knows" depend on *our* context as evaluators.
      *   *Actually, to make the conflict sharp:* The prompt wants the case where "stakes change but conversation stays fixed." This usually targets the *subject's* context.
      *   *Refined Setup:* Jordan argues that Aris's *own* utterance "I know" changes truth value. Elena argues that Aris's conversational context didn't change (she's still talking to the nurse, same topics), so the standard didn't shift. The stakes are extra-conversational.

      *(Self-Correction)*: Lewisian Contextualism is usually *Attributor* contextualism. If Aris says "I know," Aris is the attributor. If Aris's stakes change, does her conversational context change? Lewis says standards shift when error possibilities are *salient*. High stakes often *make* error possibilities salient.
      *   *The Prompt's Constraint:* "Conversation stays fixed." This means we must stipulate that despite the high stakes, no one is *talking* about the possibility of error. The error possibility is objectively more dangerous, but not conversationally salient.
      *   *Okay, let's write.*

  6.  **Writing the Dialogue:** (Iterative process to ensure sharpness).
      *   Start with the case.
      *   Jordan: Stakes rose, Knowledge dropped.
      *   Elena: Conversation didn't change, Standards didn't change. You're confusing prudence with truth.
