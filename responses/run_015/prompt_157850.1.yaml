answer: |-
  The highway at night is a strip of grey ribbon unspooling under white lights. Arthur knows the route. He has driven it for ten years. Three months ago, the medication started, and now the ribbon has knots in it. Ten-minute gaps where the tape recorder stops running while the car keeps moving.

  There are two exits. Exit 1 is a wrong turn into an industrial park, surrounded by chain-link fences and darkness. Payoff: zero. Exit 2 is home. Payoff: four. If he misses both, he ends up at the rest area forty minutes later, sleeping in the driver's seat with a neck crick. Payoff: one.

  Before he starts the engine, in the driveway, the math is clean. He cannot distinguish the exits when he sees them. They look identical. If he commits to exiting at the first, he gets zero. If he commits to exiting at the second, he will inevitably miss it because he won't know when he's there. The optimal strategy, calculated in the safety of the driveway, is probabilistic. He must assign a probability $p$ to exiting at any given interchange. Something like one quarter. He carries a coin to enforce this.

  But the driveway is a different universe from the car.

  Arthur sees the green glow of the exit sign ahead. His heart does a small, dry flutter. He reaches into the cup holder. The coin is there, heads up. He told himself this morning: heads means stay, tails means exit. Or was it the other way around? It doesn't matter, provided the rule is fixed.

  He flips the coin. It lands heads. *Stay.*

  He puts his foot on the gas. But then the thought arrives, unbidden: *Did I just flip that?*

  The gap isn't just about distance. It's about thought. He has a memory of flipping a coin. He has a memory of seeing heads. But he also has a memory of having that memory. The sensation of deliberation feels familiar, like a song you've heard twice in one hour. Is this the first exit, and he is deciding for the first time? Or is this the second exit, and he is remembering the decision he made at the first? Or is this the first exit, but he has already deliberated here once, forgotten it, and is now deliberating again?

  The logic loops. If he believes he is likely to be at the second exit, he should exit. But if he exits too often, he lands in the industrial park. If he believes he is likely to be at the first exit, he should stay. But if he stays too often, he sleeps in the car.

  His friend Mark had said, over beers, "You know what the solution is? You should want to be unable to reconsider. Ignorance is bliss. The best version of you is the one who can't reopen the question."

  Arthur had nodded then. Now, gripping the wheel, he thinks Mark is wrong. Ignorance isn't bliss; it's just ignorance. The problem isn't that he reconsiders. The problem is that the reconsideration doesn't stick. The output of his brain cannot be stored. He is a computer writing to a hard drive that wipes itself every ten minutes.

  He approaches the exit ramp. The coin says stay. But the coin flip feels like a memory of a coin flip. He looks at the coin in the cup holder. It is heads up. He moves it to the other cup holder.

  He knows this is stupid. The coin's position has no causal link to the exit's identity. Moving it changes nothing about the geometry of the highway or the chemistry of his brain. It is epistemically worthless. It is a superstition.

  He does it anyway.

  He taps the steering wheel twice. *Thump. Thump.* Another ritual. Another data point that means nothing. He is building a scaffold of meaningless actions to hold up a decision that has nowhere to live. If he doesn't perform the ritual, the moment feels unanchored. If he does, it feels slightly less like a dream.

  He stays on the highway. The exit lights recede in the mirror.

  Ten minutes pass. Or five. Or twenty. The clock on the dashboard is digital, but he doesn't trust it. Another green glow appears. Identical to the last.

  Arthur feels a surge of fatigue that isn't physical. It's the fatigue of running a calculation that deletes its own variables. He reaches for the coin. It is in the right cup holder. He moved it there. So he must have been here before. Unless he moved it at the driveway? No, the rule was left cup holder at start.

  So this is the second exit. He should exit.

  But wait. If he moved the coin at the first exit because he was confused, then the coin's position is contaminated. It's no longer a signal; it's noise generated by his own panic. He cannot trust the ritual because the ritual was born of the disease it is meant to track.

  "I am deliberating now," he says out loud. His voice sounds flat in the cabin.

  He tries to use the statement as evidence. *I am deliberating now.* Surely this proves he is at a decision point. But he was deliberating at the last one. And he might have deliberated at this one five minutes ago, forgotten, and started again. The fact of deliberation is not a timestamp. It is a state of being.

  Mark's voice again. *Unable to reconsider.* If he were unable to reconsider, he would just follow the coin. Heads, stay. But to follow the coin, he must believe the coin flip is current. To believe the coin flip is current, he must believe he hasn't flipped it before. To believe that, he must trust his memory. He cannot trust his memory.

  So he is stuck in the loop. The only way out is to accept that the loop is the terrain.

  He looks at the exit sign. It is blurring slightly. He should exit. The probability suggests he should exit. But the probability was calculated by a version of Arthur who believed he could remember the result. This Arthur cannot.

  He reaches out and taps the wheel. *Thump. Thump.*

  He moves the coin back to the left cup holder. Resetting the system. Acknowledging that the previous state was corrupted. He is creating a new timeline, here in the car, because the old one leaked away.

  He turns the wheel. The car banks toward the off-ramp.

  It might be home. It might be the industrial park. The headlights sweep across concrete barriers. There are no chain-link fences. There is a driveway. There is a porch light.

  Arthur pulls into the driveway. He turns off the engine. The silence rushes in.

  He sits there for a moment, hand on the coin. He knows he got lucky. He knows that tomorrow, the math will be the same, and the gaps will be the same, and the rituals will be waiting in the cup holder. He knows he didn't solve anything. He just happened to land on the right side of the probability distribution this time.

  He gets out of the car. He leaves the coin on the passenger seat. He won't move it back before tomorrow. Let it stay there. Let it be a monument to the fact that he decided something, even if he can't remember deciding it.

  ***

  **Note on the Decision Problem**

  Regarding the nested version of the problem you described, here is the arithmetic on the three points you raised.

  First, does a best plan exist? In the standard absent-minded driver problem, the optimal solution is a "fixed point" where the probability you choose at the start matches the probability you choose at the exit. In your nested version, where you are uncertain about whether you are deliberating for the first time or re-deliberating, the equilibrium still exists but is harder to find. It requires consistency between your belief about *where* you are and your belief about *what* you are doing. It settles down, but only if you accept that your future self will make the same calculation with the same limited information. If you try to outsmart your future self, the plan destabilizes.

  Second, does randomizing still help? Yes. Deterministic strategies (always stay, always exit) fail because they are exploitable by the structure of the gaps. If you always stay, you miss home. If you always exit, you hit the industrial park. Randomization prevents your future, amnesiac self from locking into a losing pattern. It smooths the payoff over many trials, even if any single trial feels like a guess.

  Third, does "I'm deliberating now" provide evidence? This is the sharpest knife. In standard decision theory, self-locating evidence like "I am here now" is often treated as noise because you would be deliberating regardless of which exit you were at. In the nested case, however, it creates an infinite regress. If you use the fact of deliberation to update your belief about which exit you're at, you must also update your belief about whether you've already updated. Practically, it is noise. It feels like signal because consciousness feels immediate, but if the memory of the immediacy is wiped, the immediacy itself carries no data about position. You should throw it out, even though it feels like the only thing you have.
