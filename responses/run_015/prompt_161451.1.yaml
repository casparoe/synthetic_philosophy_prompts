  4.2 Contributors:
  (i) Daughter: Describes Subject as saintly caregiver, selfless, beloved.
  (ii) Son: Describes Subject as domestic tyrant, abusive, feared.
  (iii) Niece: Describes Subject as neglected victim, forgotten, pitied.
  4.3 Problem: All three relatives possess equal Authorized Co-Author status. Narrative Mass is equipotent. Gravitational center is indeterminate. The File cannot be closed while narratives diverge, as the Self is currently fragmented across three incompatible positions. The Subject cannot speak to authorize one story. The Office cannot wait for biological cessation, as pension liabilities require a singular beneficiary definition.

  5. DETERMINATION
  To close the file, the Office selects the Daughter's narrative for administrative continuity. This selection does not assert truth. There is no fact of the matter to discover. By selecting, we stabilize the posit. We create nothing; we merely finalize the fiction. The Self is now legally singular. Mrs. G is who the file says she was. Ontologically, nothing has changed—the Self was always only a convenient fiction. Practically, the Office has determined who she is. Any protest that we are erasing the "real" Mrs. G is category error. There is no real Mrs. G. There is only the story we allow to stand. We do not claim power over souls, only over the abstraction. But since the abstraction is all there is, the power is total. We act faithfully on the view. The view entails this outcome. We insist we have discovered nothing. The record is updated. The Self is constituted. The file is closed.
