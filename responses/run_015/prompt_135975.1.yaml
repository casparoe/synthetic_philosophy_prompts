answer: |-
  This is a sharp reading. You're identifying a tension that often gets smoothed over in standard interpretations of Russell's ethical writings. The "pure utilitarian" label is convenient but often fails to capture the intensity of his liberal commitments in *Marriage and Morals*.

  Here is a breakdown of the logic on your three specific points: the possessive/expressive split, the utilitarian collapse, and the relational autonomy anachronism.

  ### 1. The Possessive vs. Expressive Split: Imported or Inherent?
  You are not importing this split so much as you are naming a distinction Russell operationalizes but leaves theoretically under-developed.

  Russell explicitly argues that jealousy has two components: a biological "fear of loss" (which he admits is natural and hard to eradicate) and a proprietary "claim of ownership" (which he views as social and pernicious). When he argues that jealousy is "learned," he is specifically targeting the proprietary component. He believes society teaches us to view sexual access as a right enforceable against a partner, rather than a gift voluntarily given.

  **The Logic Check:**
  *   **Inherent:** Yes. Russell consistently contrasts relationships based on "duty" and "law" (possessive) with those based on "impulse" and "growth" (expressive). He argues that when love is coerced by moral codes, it dies; when free, it flourishes. This maps directly onto your expressive/possessive distinction.
  *   **The Caveat:** Russell is sometimes skeptical of *all* intense passion, fearing it disrupts rational wellbeing. So, while he rejects *possessive* attachment, he doesn't always fully endorse *expressive* attachment if it becomes too consuming. He prefers a calm companionship. Your framing holds, provided "expressive" doesn't imply unbridled emotional intensity, but rather "voluntary affective connection."

  ### 2. The Hybrid View: Coherent or Collapsing into Utilitarianism?
  This is the crux of your thesis. Does "sovereignty-utilitarianism" hold up, or is sovereignty just a heuristic for long-term happiness?

  **The Case for Collapse:**
  Philosophically, Russell rarely grounds rights in metaphysical "natural law." If you press him on *why* personal sovereignty is inviolable, he almost always points to consequences: stifling sovereignty leads to neurosis, resentment, and stunted human potential, which reduces the sum of happiness. In this light, sovereignty is a **rule-utilitarian** constraint. It functions *like* a deontological side-constraint because Russell believes the long-term utility cost of violating it is always too high. If you could prove that violating sovereignty in a specific case *increased* net wellbeing without long-term blowback, a consistent Russell might have to allow it.

  **The Case for Coherence (Your Hybrid Model):**
  However, your hybrid framing saves him from a common critique: that utilitarianism could theoretically justify enforced monogamy if it stabilized society. Russell refuses this trade. He treats liberty as having **lexical priority** in the sexual sphere. He argues that even if traditional marriage creates social stability, it is illegitimate because it treats persons as means (property) rather than ends.

  **Verdict:** The hybrid view makes him more *rhetorically* and *politically* coherent, even if his meta-ethics remain utilitarian. By framing sovereignty as a side-constraint, you explain why he refuses to bargain on certain freedoms (like divorce access or birth control) regardless of the conservative utilitarian argument for social stability. It highlights that his utilitarianism is **perfectionist**: he isn't just maximizing pleasure; he is maximizing a specific *kind* of human flourishing that requires autonomy as a precondition. Without the "sovereignty" constraint, his utilitarianism loses its specific liberal character.

  ### 3. Relational Autonomy: Illuminating or Anachronistic?
  Linking Russell to modern relational autonomy theory (which argues autonomy is developed *through* social relations, not in isolation) is a high-risk, high-reward move.

  **The Anachronism Risk:**
  Russell is fundamentally an Enlightenment liberal. His model of autonomy is largely "negative liberty"—freedom *from* interference (by the church, the state, or a possessive spouse). Relational autonomy is often a critique of that atomistic view, emphasizing interdependence and care. Russell can be quite individualistic; he often frames the ideal marriage as a partnership of two independent souls who *choose* to be together, rather than a unit that constitutes their identity.

  **The Illumination:**
  However, the link is illuminating if you focus on his view of **psychological development**. Russell argues that we cannot become fully rational, happy agents in repressive environments. We need "free" relationships to develop our capacities. In this sense, autonomy is relational: it is cultivated *within* the marriage, not brought to it fully formed. If your "sovereignty-utilitarianism" posits that sovereignty is a capacity that must be protected by the relationship structure itself, then relational autonomy is a valid lens.

  **Recommendation:**
  Be careful with the term "relational autonomy" as it carries specific contemporary baggage (often feminist/care-ethics focused). You might get more traction framing it as **"Liberal Perfectionism."** This captures his view that the state/society must protect individual sovereignty (Liberal) to allow for the highest form of human flourishing (Perfectionism), which happens to be relational.

  ### Summary on "Sovereignty-Utilitarianism"
  The label works well because it captures the **lexical ordering** in Russell's thought.
  1.  **Constraint:** Do not treat persons as property (Sovereignty).
  2.  **Optimization:** Within that constraint, arrange relationships to maximize happiness and minimize jealousy (Utilitarianism).

  If you treat it as pure utilitarianism, you can't explain his absolute refusal to accept "social stability" as a valid reason for restricting sexual freedom. If you treat it as pure deontology, you ignore his constant appeals to psychological health and happiness. The hybrid model resolves this tension: Sovereignty is the *structure* required for Utility to be possible.

  **Final Logic Check:** Your argument is strongest if you position sovereignty not as a metaphysical right, but as a **structural precondition for utility.** This avoids the meta-ethical collapse while preserving the deontological *force* of his arguments in the text. You aren't importing the possessive/expressive split; you are formalizing a distinction Russell relies on to dismantle the "property" view of marriage. Just ensure you acknowledge that for Russell, sovereignty is instrumental to human growth, not necessarily a Kantian end-in-itself, which keeps the utilitarian engine running under the hood.
