  Good morning. I know it's early, and I know half of you have worn out copies of Wittgenstein's *On Certainty*, and the other half have worn out gloves handling nineteenth-century ledgers. So I'm not going to give you a lecture. We're here to work.

  This workshop was [Advisor's Name]'s idea. She planned this before she died. She used to say a good hinge is like a doorframe: you only notice it when the door stops closing. I think that's where we start. Not with doubt, but with the things that have to hold still so we can move at all.

  Here's the setup. For the archivists in the room, a catalog entry or a provenance record is often a hinge. It's the fixed background against which you interpret an object. You don't debate the accession number while you're preserving the box; you rely on it. For the epistemologists, basic commitments work the same way. You don't argue about whether the world exists while you're arguing about knowledge; you rely on the world being there.

  But here's the inversion I want us to live with this weekend. Look across the table. What is a fixed hinge for one of you is an open question for the other. The archivist's solid record is the philosopher's puzzle. The philosopher's abstract commitment is the archivist's paperwork. When the philosopher asks, "How do you know that record is certain?" the archivist hears, "How do you do your job?" And when the archivist says, "The record says this is true," the philosopher hears, "What makes that proposition hold?"

  Now, I need to block the obvious misreading. Saying these are hinges doesn't mean everything is relative or socially constructed. It doesn't mean we can just swap them out when we feel like it. Recognizing a hinge isn't the same as doubting it. In fact, it's the opposite. It's acknowledging the ground that lets us disagree in the first place. Disagreement is only possible because those hinges are shared. If we didn't share some hinges, we wouldn't be having a workshop; we'd just be shouting past each other in different rooms.

  In my notes, I wrote that hinge propositions are the axiums of inquiry. I meant axioms. But maybe the typo stays. It reminds us this isn't about perfect logic; it's about practice. It's about the friction when the door sticks.

  So, let's not spend two days trying to pry the door off its frame. Let's figure out why it stopped closing. Thanks.
