  **FOR IMMEDIATE RELEASE**

  **Petersburg Palace Casino & Resort Unveils "The Paradox," The World's First Infinite-Value Table Game**

  **ST. PETERSBURG, FL** — Petersburg Palace Casino & Resort is proud to announce the opening of *The Paradox*, a revolutionary new table game where the expected value is literally infinite. While traditional slots and roulette offer capped returns, *The Paradox* offers players what no other institution can: a mathematical guarantee that no admission price is too high.

  "The math is irrefutable," said Dr. Aris Thorne, Chief Actuary at Petersburg Palace. "The series diverges. Theoretically, a rational agent should mortgage their home to play. However, liquidity events are stochastic, and the vault has a ceiling. I have run the simulations. The tail risk is… significant. We are comfortable with the truncation point."

  **How It Works**
  A fair coin is flipped until it lands heads. If heads appears on the first flip, the pot is $2. If on the second, $4. On the *n*-th flip, the pot is $2^n$. Because the probability halves while the payout doubles, the expected value sums to infinity.

  **Game Specifications & Terms**
  *The Paradox* operates under standard probabilistic models, subject to the following house rules:
  1.  **Maximum Liability:** Payouts are capped at the Casino's Total Liquid Assets at the time of the flip. This ensures game solvency and truncates the infinite series to a finite sum approximately equal to the logarithm base 2 of the bankroll.
  2.  **Outcome Frequency:** Approximately 50% of rounds conclude on the first flip ($2 payout). 75% conclude within the first two flips.
  3.  **Utility Adjustment:** Loyalty points are not awarded in currency, but in logarithmic utils to account for diminishing marginal utility of wealth.
  4.  **Disclaimer:** Past performance in nearby possible worlds is no guarantee of future results in this universe.

  "We want players to feel the infinity," said Marketing Director Sarah Jenkins. "Even if the median outcome is modest, the mean is boundless. It's about potential."

  *The Paradox* opens tonight on the high-limit floor. Minimum buy-in is $20.

  **About Petersburg Palace**
  Petersburg Palace is a leading destination for probabilistic entertainment, committed to transparent mathematics and responsible bankroll management.

  # # #

  **Media Contact:**
  Press Office
  press@petersburgpalace.com

  ***

  **Note to Editors:**
  The casino's pricing model only holds under the assumption of an infinite bankroll or linear utility of money. Our marketing department is operating under the hope that nobody checks which of those assumptions actually binds.
