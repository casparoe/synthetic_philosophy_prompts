answer: |-
  **Question**

  Consider society S where the least-advantaged stratum splits into two equal subgroups. L are low-productivity workers with no special needs. H have an unchosen chronic health condition costing four income-units to manage; unmanaged, they function far below L; managed, they function as L does. Two policies are feasible. P gives the stratum cash income of 10 units (L effective advantage: 10, H: 6). Q gives cash 8 plus universal in-kind care funded by tax (L effective advantage: 8, H: 8). Rawls indexes the least advantaged by social primary goods (income/wealth), yet defines their position to maximize their expectations. Here, P maximizes the index (10 > 8), but Q maximizes the effective position of the worst-off individual (H: 6 → 8). Using only the apparatus of justice as fairness (original position, primary goods, difference principle), determine whether Q is permitted, required, or forbidden. Explain how the parties identify the least advantaged given that health needs are bracketed at the constitutional stage. Defend your verdict against the strongest rival reading and state exactly what attractive feature of the view your verdict sacrifices.

  ***

  **Model Answer**

  Justice requires Policy Q. The Difference Principle mandates maximizing the expectations of the least advantaged, but this mandate is empty if the metric used to identify them ignores their capacity to use those resources. Primary goods are not valuable in themselves; they are instrumental. They are defined as all-purpose means for citizens to pursue their conceptions of the good. In this case, cash income is not an all-purpose means for subgroup H. Without medical management, H cannot function as normal cooperating members, regardless of cash holdings. Therefore, an index measuring only cash fails to measure the actual primary goods available to H. The parties in the Original Position, knowing general facts about human biology and sociology, would recognize that a resource index unadjusted for basic conversion factors renders the guarantee of the difference principle illusory for those with chronic conditions. They would not agree to a principle that maximizes a number while minimizing the actual power of the worst-off to participate in social cooperation. To treat the index as fixed on income alone is to mistake the map for the territory. The parties are rational maximizers of their life prospects, not guardians of a specific accounting method.

  The strongest rival reading insists on Policy P. This view holds that the primary goods index must remain strictly resource-based to maintain publicity and objectivity. If we adjust for health needs, we risk collapsing into welfare metrics or expensive tastes, violating the responsibility constraint. The parties cannot know who has costly needs without lifting the veil too high. Thus, justice demands maximizing the cash share, leaving compensation to later legislative stages. This reading relies on the stipulation that disability is bracketed for the legislative stage. It argues that the basic structure sets the resource rules, and specific applications handle the exceptions. To do otherwise is to burden the fundamental principle with complex empirical assessments that threaten stability. It claims that H's condition is a misfortune, not an injustice, provided their resource share is maximized.

  This rival fails because it treats the bracketing of disability as absolute rather than provisional. The prompt stipulates health needs are bracketed for the legislative stage, but this bifurcation problem arises precisely at the level of fundamental justice. If the constitutional essentials cannot guarantee the material preconditions for cooperation, the basic structure is unjust. The parties in the Original Position represent citizens over a complete life. They know that some citizens will face conversion deficits. To treat cash as equivalent for L and H is to treat unequal situations as equal, violating the formal requirement of fairness inherent in the Original Position itself. The resource-only index is not neutral; it systematically biases the outcome against those with unchosen biological deficits. Q is required because it restores the equivalence of effective power that the primary goods index is supposed to track. If the index does not track power, it is not an index of primary goods. The maximin rule directs them to look at the worst possible position. Under P, the worst position is 6. Under Q, it is 8. Rational choice dictates Q.

  However, this verdict comes at a significant theoretical cost. By adjusting the index for health needs, we compromise the strict separation between resources and conceptions of the good. We must judge which needs are "basic" enough to warrant in-kind provision versus cash. This introduces a perfectionist element into the liberal framework. The theory loses some of its clean neutrality, admitting that justice requires judging the relative urgency of different uses of resources based on a specific conception of normal human functioning. We gain effectiveness for the worst-off, but we lose the simplicity and absolute neutrality of the resource metric. Furthermore, it requires the state to adjudicate between medical needs and other uses of income, potentially infringing on the liberty of L to spend their share as they wish. The theory saves the difference principle's intent but sacrifices its procedural purity. It acknowledges that resource equality is insufficient for fair equality of opportunity when natural contingencies drastically alter conversion rates. This moves the theory closer to luck egalitarianism than Rawls typically admits, blurring the line between social justice and natural misfortune. Ultimately, we sacrifice the claim that justice is solely about social relations, accepting instead that justice must compensate for natural bad luck to ensure the value of liberty is real for all.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Clear Verdict (4 marks):** The answer must explicitly state whether Q is required, permitted, or forbidden.
      *   *Common Error:* Hedging the verdict or concluding that the theory is silent without arguing why the silence matters.
  2.  **Primary Goods Analysis (4 marks):** Must argue that primary goods are means to functioning, not just resources, and that cash fails as a means for H without care.
      *   *Common Error:* Treating primary goods as inherently valuable commodities rather than instrumental all-purpose means.
  3.  **Original Position Knowledge (4 marks):** Must utilize the "general facts" knowledge of the parties to justify knowing about health conversion deficits without lifting the veil.
      *   *Common Error:* Claiming the parties know their specific health status or ignoring the veil constraints entirely.
  4.  **Rival Rebuttal (4 marks):** Must articulate the "Publicity/Objectivity" argument for P and explain why it fails in this specific bifurcation case.
      *   *Common Error:* Straw-manning the rival as simply "unkind" rather than addressing the structural concern about stability and measurement.
  5.  **Theoretical Cost (4 marks):** Must identify a specific structural sacrifice (e.g., neutrality, resource/responsibility distinction, simplicity) rather than a practical difficulty.
      *   *Common Error:* Citing "administrative complexity" or "cost" as the theoretical sacrifice rather than a philosophical compromise.

  **A vs B Distinction**
  An **A answer** identifies the cost as a structural compromise to the theory's neutrality or the resource/responsibility distinction (e.g., admitting justice must compensate for natural luck). A **B answer** identifies the cost merely as practical complexity or difficulty in implementation (e.g., it is hard to measure needs).
