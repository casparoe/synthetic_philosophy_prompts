answer: |-
  ### Opening Remarks (5–6 Minutes)

  Good evening. My name is [Name]. I live in [Neighborhood], and I'm a member of the tenant union. I also work in medical billing.

  I bring up my job because I spend my day looking at codes that decide whether a patient gets a procedure or gets denied. I've seen how a number on a screen can feel like a law of nature, when really it's just a policy choice dressed up as math. I see the same thing happening here with the Housing Repair Priority Score.

  We know the numbers: 4,000 households ask for help every year. The city has resources for 120. That is a hard limit. Someone has to be number 121.

  The city tells us this score "doesn't decide anything," it just sorts the list so inspectors know where to start. But sorting *is* deciding. If I am 121, I do not get an inspector. If my neighbor is 120, they do. That is a decision.

  I've spent the last year trying to understand how this score is built. I'm not a data scientist. But what I've learned—from arguing with friends who are, and reading what I can find—is that there is a hard limit on what this math can do. It's not a limit of computing power. It's a limit of logic.

  Here is the reality: You cannot build a score that is perfectly fair in every way at once.

  If you make sure the score means the same thing for everyone—that a "high risk" score in my neighborhood represents the same danger as a "high risk" score in a wealthier one—you will inevitably miss more dangerous houses in one group than the other.

  If you make sure you miss the same number of dangerous houses in every group, then the score itself means something different for everyone. A "high risk" here won't mean the same as a "high risk" there.

  This isn't a glitch. It's not something the data team can fix if they just tune the knobs. It is a mathematical fact. When resources are scarce, you cannot avoid error. You can only choose which error you are willing to live with. Do we accept more false alarms in some neighborhoods? Or do we accept more missed dangers in others?

  The city's line is that this model is better than the old way, where a staffer just looked at a pile of applications. Maybe it is. But the old way had the same problem. Humans are biased, and humans make mistakes. The difference is that when a human makes a mistake, it's inconsistent. When an algorithm makes a mistake, it's consistent. It locks that choice in place. It makes the bias efficient.

  We've heard a suggestion from the consultants about "rotating" fairness. Maybe one quarter we prioritize this group, next quarter that group. On paper, that looks like balance. But in this room, we know that lead poisoning doesn't wait for its turn. A roof collapse doesn't care about the fiscal quarter. If you are the household that gets skipped in Quarter One because it was someone else's "turn," the harm is already done by the time the rotation comes back to you.

  So, where does that leave us?

  It leaves us with the truth that this is not a technical problem. It is a moral one.

  There is no correct equation for this. There is only a choice about whose risk we are willing to increase so that others can be safe. And that choice is too heavy to hide inside a spreadsheet. It shouldn't be made by a consultant's spreadsheet, and it shouldn't be made by a city staffer following a manual they didn't write.

  It needs to be made by people who can be voted out.

  If we are going to use a score, we need to know exactly which mistake it is designed to make. We need to know: when this system fails, who does it fail? And we need to be able to change that answer when we decide we don't like it.

  I'm not asking you to scrap the tool. I'm asking you to admit what it is. It is a rationing tool. It is a triage system. And triage requires a commander who takes responsibility for the lives they couldn't save.

  I want the people in this room to know that when you speak next, you don't have to ask for "better math." You can ask for a clear answer on which trade-off was chosen. You can ask why that one was picked over the others. And you can demand that the person who picked it is willing to stand up and say, "I chose this."

  Thank you.

  ***

  ### Note on Your Technical Understanding

  You are remarkably close to the mark, specifically regarding the **Impossibility Theorem of Fairness** (Kleinberg et al., 2016). Your intuition that you cannot satisfy Calibration (score means the same thing across groups) and Error Rate Balance (equal mistakes across groups) simultaneously when base rates differ is correct.

  However, three nuances to keep in your back pocket:

  1.  **Human vs. Algorithm Consistency:** You wrote that the old human version has "exactly the same problem." Mathematically, yes; practically, no. Humans are *noisy*. A biased human might reject 40% of Group A today and 30% tomorrow. An algorithm rejects exactly 35% every time. The algorithm doesn't create the trade-off, but it *crystallizes* it, making it harder to fix without a system-wide change.
  2.  **The "It Doesn't Decide" Claim:** This is the weakest technical claim the city is making. In ML terms, the model is a *filter*. By reducing the pool from 4,000 to 120, it dictates the *opportunity space*. If a human inspector can only physically visit 120 homes, the model *has* decided that homes 121–4,000 are not worth the cost of inspection. That is a decision.
  3.  **Temporal Budgeting:** Your skepticism is warranted. This works for reversible decisions (e.g., loan approvals where you can re-apply next quarter). It fails for *survival* decisions (lead, heat, structural failure). Irreversible harm breaks the "average over time" fairness argument.

  ***

  ### Short Replies for Pushback

  **If the data team says: "The model doesn't decide, humans make the final call."**
  "The model decides who gets a human call; if I'm ranked 121, no human ever sees my file, so the model has already decided my outcome."

  **If they defend the rotation idea: "It balances out over the year."**
  "Housing safety isn't reversible; if a child is poisoned in Quarter One, it doesn't help their family that the model was fair to someone else in Quarter Three."

  **If they suggest: "We can tune the parameters to find a sweet spot."**
  "There is no sweet spot, only trade-offs; please tell us explicitly which error rate you chose to increase so we can decide if we accept that."
