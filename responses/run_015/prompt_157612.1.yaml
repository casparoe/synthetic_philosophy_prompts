  - "best_revision": string — which single commitment should I tweak or drop to fix teh most tension?
  - "consistency_score": number 1-10.

  Dont give me a bibliography or cite specific papers. Just audit teh set. Make sure you flag teh hidden ones, not just teh obvious ones.
