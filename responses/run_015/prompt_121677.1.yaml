  **Exam Question: Formal Epistemology (Seminar Final)**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1: The Structure of Uncertain Updating**

  Consider a geologist assessing the hypothesis $H$ (Oil Present). Her prior probability is $P_0(H) = 0.5$. She has two independent seismic sensors, $A$ and $B$. In her prior model, $A$ and $B$ are conditionally independent given $H$ (and given $\neg H$). The likelihoods are:
  *   $P_0(A|H) = 0.8, \quad P_0(A|\neg H) = 0.2$
  *   $P_0(B|H) = 0.6, \quad P_0(B|\neg H) = 0.4$

  Note that these likelihoods imply $P_0(A) = 0.5$ and $P_0(B) = 0.5$.

  The geologist undergoes two sequential experiences. Experience $\alpha$ shifts her confidence in sensor $A$ to $P(A) = 0.9$. Experience $\beta$ shifts her confidence in sensor $B$ to $P(B) = 0.9$. She updates using Jeffrey Conditionalization (JC), adhering strictly to the Rigidity condition at each step.

  (a) Calculate the final probability $P(H)$ if she updates on $\alpha$ first, then $\beta$. (8 marks)
  (b) Calculate the final probability $P(H)$ if she updates on $\beta$ first, then $\alpha$. (8 marks)
  (c) The results in (a) and (b) will differ. Does this non-commutativity demonstrate that JC is incoherent? Explain what information is missing from the description of experiences $\alpha$ and $\beta$ that would resolve the order-dependence. (5 marks)
  (d) Briefly state the relationship between Jeffrey Conditionalization and the Minimum Information (MinInf) principle. Do they always yield the same result? (4 marks)

  *(Please carry calculations to three decimal places.)*

  ***

  **Model Answer**

  **(a) Order $\alpha$ then $\beta$**
  First, update on $\mathcal{A} = \{A, \neg A\}$ with $P_1(A) = 0.9$.
  From priors: $P_0(H|A) = 0.8$ and $P_0(H|\neg A) = 0.2$.
  By JC: $P_1(H) = P_0(H|A)P_1(A) + P_0(H|\neg A)P_1(\neg A)$
  $P_1(H) = 0.8(0.9) + 0.2(0.1) = 0.72 + 0.02 = 0.740$.

  Second, update on $\mathcal{B} = \{B, \neg B\}$ with $P_2(B) = 0.9$.
  **Crucial Step:** Rigidity applies to the *current* distribution $P_1$. We need $P_1(H|B)$.
  Since conditional independence is preserved (sufficiency), $P_1(B|H) = P_0(B|H) = 0.6$.
  $P_1(B) = P_1(B|H)P_1(H) + P_1(B|\neg H)P_1(\neg H)$
  $P_1(B) = 0.6(0.74) + 0.4(0.26) = 0.444 + 0.104 = 0.548$.
  $P_1(H|B) = \frac{P_1(B|H)P_1(H)}{P_1(B)} = \frac{0.444}{0.548} \approx 0.810$.
  $P_1(H|\neg B) = \frac{0.4(0.74)}{1-0.548} = \frac{0.296}{0.452} \approx 0.655$.

  Apply JC for step 2:
  $P_2(H) = P_1(H|B)P_2(B) + P_1(H|\neg B)P_2(\neg B)$
  $P_2(H) = 0.810(0.9) + 0.655(0.1) = 0.729 + 0.066 = \mathbf{0.795}$.

  **(b) Order $\beta$ then $\alpha$**
  First, update on $\mathcal{B}$ with $P^*_1(B) = 0.9$.
  $P_0(H|B) = 0.6, P_0(H|\neg B) = 0.4$.
  $P^*_1(H) = 0.6(0.9) + 0.4(0.1) = 0.54 + 0.04 = 0.580$.

  Second, update on $\mathcal{A}$ with $P^*_2(A) = 0.9$.
  We need $P^*_1(H|A)$. Preserving sufficiency, $P^*_1(A|H) = 0.8$.
  $P^*_1(A) = 0.8(0.58) + 0.2(0.42) = 0.464 + 0.084 = 0.548$.
  $P^*_1(H|A) = \frac{0.8(0.58)}{0.548} = \frac{0.464}{0.548} \approx 0.847$.
  $P^*_1(H|\neg A) = \frac{0.2(0.58)}{0.452} \approx 0.257$.

  Apply JC for step 2:
  $P^*_2(H) = 0.847(0.9) + 0.257(0.1) = 0.762 + 0.026 = \mathbf{0.788}$.

  **(c) Interpretation**
  The difference ($0.795 \neq 0.788$) does not imply incoherence. It indicates that the input "set $P(E)=q$" is **underspecified**. It defines the *effect* on the partition but not the *cause* (the likelihood ratio of the experience). If we modeled the experiences as learning virtual propositions $X$ and $Y$ in an extended algebra (where $P(\cdot|X)$ generates the shift), Bayesian conditioning on $X$ and $Y$ would commute. The order-dependence arises because JC discards the likelihood structure of the experience, retaining only the posterior partition probabilities. To pin the result down, one must specify the Bayes factors (likelihood ratios) associated with $\alpha$ and $\beta$.

  **(d) MinInf Relation**
  On constraints forming a **proper partition** (e.g., fixing probabilities for all cells of $\mathcal{E}$), JC and MinInf (minimizing KL-divergence) yield the **same** result. However, they come apart when constraints are on **overlapping events** (e.g., $P(A)=x, P(B)=y$). MinInf can solve this directly; JC is undefined without refining to a partition, and applying JC to a refined partition generally diverges from the MinInf solution unless specific independence assumptions hold.

  ***

  **Marking Scheme (25 Marks)**

  **Part (a) & (b): Calculation (16 Marks Total)**
  *   **Move: Dynamic Rigidity (4 marks per part).**
      *   *A-Answer:* Calculates the *new* conditional probabilities ($P_1(H|B)$) for the second step based on the shifted marginal $P_1(H)$.
      *   *B-Answer:* Uses the *original* priors ($P_0(H|B)$) for the second step.
      *   *Misconception Defended:* **Rigidity as Independence.** Students often think rigidity means $P(H|E)$ is a fixed constant of nature. It means $P_{new}(H|E) = P_{old}(H|E)$ relative to the distribution *immediately preceding* the update.
  *   **Move: Marginal Updating (2 marks per part).**
      *   *A-Answer:* Correctly recalculates the marginal probability of the second partition ($P_1(B)$) before computing conditionals.
      *   *B-Answer:* Assumes $P(B)$ remains at the prior (0.5).
      *   *Misconception Defended:* **Partition Isolation.** Thinking an update on $A$ leaves probabilities of $B$ untouched despite correlation via $H$.
  *   **Move: Arithmetic Accuracy (2 marks per part).**
      *   *A-Answer:* Result within $\pm 0.005$ of model (0.795 / 0.788).
      *   *B-Answer:* Significant arithmetic errors.

  **Part (c): Non-Commutativity Diagnosis (5 Marks)**
  *   **Move: Underspecification Diagnosis (3 marks).**
      *   *A-Answer:* Identifies that "$P(E)=q$" lacks likelihood/Bayes factor information. States that order matters because the *strength of evidence* is lost.
      *   *B-Answer:* Claims the rule is flawed/incoherent OR suggests averaging the two results.
      *   *Misconception Defended:* **Incoherence Claim** and **Averaging Fix.** (Averaging is ad-hoc and lacks axiomatic support).
  *   **Move: Virtual Evidence/Extended Space (2 marks).**
      *   *A-Answer:* Mentions that conditioning on the *causes* of the shift (virtual propositions) would commute.
      *   *B-Answer:* Vague hand-waving about "context."

  **Part (d): MinInf Relation (4 Marks)**
  *   **Move: Partition Coincidence (2 marks).**
      *   *A-Answer:* States they coincide on proper partitions.
      *   *B-Answer:* Claims they are always different or always the same.
  *   **Move: Overlap Divergence (2 marks).**
      *   *A-Answer:* Notes they diverge (or JC fails) on overlapping constraints.
      *   *Misconception Defended:* **Universal Equivalence.** (Thinking JC is just MinInf in all cases).
      *   *Note:* Do not penalize for lack of citation (e.g., Diaconis/Zabell).

  **Total: 25 Marks**
