answer: |-
  ### 1. The Scenario and Stakes

  The tenure committee faces a candidate, Dr. X, whose research is exemplary but who has caused serious harm outside academia. The charter limits criteria to research, teaching, and collegiality. Dr. Lin argues that moral considerations constitute wrong-kind reasons (WKRs) for tenure decisions—they corrupt the evaluative practice by importing alien normative standards. Dr. Reyes contends that WKRs apply to individual attitudes, not institutional mandates; here, the issue is simply compliance with the charter. This case strains the standard framing because institutions lack the psychological states (belief/desire) that typically ground the WKR distinction, forcing a debate over whether institutional roles generate metaphysical constraints on reasoning or merely procedural ones.

  ### 2. The Dialogue

  **Lin:** Consider the structure of the evaluation. The charter doesn't just list rules; it defines the practice of tenure itself. Tenure evaluates professional capacity, not moral worth. Bringing in Dr. X's external harm is like offering a bribe to deny tenure—it's a pragmatic reason to act, but not a reason grounded in the object of evaluation. It's the wrong kind of reason because it bypasses the specific excellence the institution is designed to recognize. It treats the decision as a lever for social justice rather than an assessment of scholarly fit. In individual belief, a WKR is like Pascal's Wager—pragmatic, not evidential. Here, moral harm is pragmatic relative to the academic function, not evidence of scholarly failure.

  **Reyes:** That analogy fails precisely where it matters. A bribe incentivizes a decision contrary to the criteria; moral harm is a fact about the candidate relevant to their fitness to hold a position of trust. The distinction you need isn't "wrong kind" but "outside mandate." If the charter excludes moral character, that's a design choice, not a metaphysical limit on reason-types. Calling it a WKR mystifies a political boundary into a philosophical necessity, shielding the committee from accountability. You are conflating exclusion with irrationality. But institutions aren't believers. They don't have doxastic states. They have mandates. When you say "wrong kind," you imply the reason cannot count. But it *does* count morally, you just want to rule it out procedurally.

  **Lin:** It's not mystification; it's structural integrity. If we evaluate moral character, we shift the object from "the professor" to "the person." Tenure protects the former to ensure academic freedom. Allowing external moral reasons operates at the wrong level of evaluation, undermining the institutional purpose regardless of what the charter text says. The purpose constrains the text. You cannot simply legislate a reason into relevance if it contradicts the practice's internal logic. The reason isn't excluded; it is categorically mismatched to the role. The role bearer is distinct from the human. The evaluation targets the role. If we judge the human, we violate the contract of the role and destabilize the profession.

  **Reyes:** But who determines that purpose? You claim institutional purpose constrains the charter, but without an independent account, "wrong level" is just rhetoric for excluding reasons you dislike. Collective agents don't have the attitude-justification structure that makes WKRs intelligible in the first place. We don't have a "faculty belief" to protect from corruption. We have people making decisions. When you say the reason is the wrong kind, you're really saying the committee lacks the authority, not that the reason is unintelligible. Authority is contingent; reason-types are not. The role is inhabited by humans. Collective intentionality means the members' moral reasons *become* the institution's reasons. You can't sever them without fiction.

  **Lin:** We have a functional integrity distinct from individual morality. Tenure serves truth-seeking. If we conflate truth-seeking with moral policing, we degrade the specific good the institution produces. The reason is wrong-kind because it targets the wrong functional output. It's not about excluding harm; it's about preserving the mechanism that generates knowledge. If the committee acts as a moral tribunal, it ceases to function as a university body. The corruption is teleological, not just procedural. We must protect the specific rationality of the institution from being swallowed by general morality.

  **Reyes:** Yet that mechanism exists within a moral world, not a vacuum. You assume institutional purpose is hermetic. But collective agency is constituted by the members' moral reasons. If the committee ignores harm, they aren't preserving function; they're abdicating moral agency. Without a robust theory of institutional purpose, your "functional integrity" is just a shield against complicity. You haven't shown why the reason is the wrong kind, only that it is inconvenient for your preferred institutional design. The WKR framework collapses when the agent is collective. Knowledge production isn't the only end. Complicity is a cost.

  ### 3. The Unresolved Crux

  The crux lies in whether institutional purposes generate metaphysical constraints on reasoning or merely procedural ones. Lin assumes roles create distinct normative spheres where certain reasons become unintelligible (substantive). Reyes assumes institutions are merely mandated collectives where reasons are excluded by rule, not type (verbal/political). This turns on a hidden premise about collective agency: can an institution have a "purpose" independent of its members' moral reasoning? Resolution requires a theory explaining when institutional roles morally insulate agents from external reasons without沦为 complicity. Until then, "wrong kind" remains ambiguous between structural necessity and convenient exemption. The debate ultimately hinges on whether institutional teleology can override general moral obligations without rendering the institution morally inert. If institutions are moral agents, Reyes wins; if they are functional tools, Lin wins. We lack a consensus on the ontology of collective agents to settle this.
