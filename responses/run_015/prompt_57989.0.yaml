  1. **Individualist:** In the crane case, the worker's complaint against permanent paralysis is so strong that no number of migraine sufferers can outweigh it.
  **Aggregativist:** But ignoring twenty thousand severe migraines seems absurd; surely the cumulative burden matters when the individual harms are significant.

  2. **Individualist:** Contractualism requires principles no one could reasonably reject. The paralyzed worker reasonably rejects any principle sacrificing her basic mobility for others' temporary comfort.
  **Aggregativist:** Yet those twenty thousand residents could also reasonably reject a principle that ignores their collective suffering simply because it is distributed across many bodies.

  3. **Individualist:** Consider the variant where both groups face paralysis; I agree we save the larger crew, but only because their individual complaints are equally strong.
  **Aggregativist:** If you save the larger crew there, you admit numbers matter, so why deny that many migraines can outweigh one paralysis here?

  4. **Individualist:** I concede numbers break ties in same-harm cases, but they cannot override a vastly stronger individual complaint in different-harm cases.
  **Aggregativist:** If numbers break ties, they represent moral weight. Consistent moral weight must eventually accumulate to outweigh a single greater harm.

  5. **Individualist:** Allowing accumulation treats people as containers of value rather than distinct individuals whose separate claims demand respect.
  **Aggregativist:** Respecting individuals requires acknowledging that ignoring thousands of valid claims fails to show equal concern for all those persons.
