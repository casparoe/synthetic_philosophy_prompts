      *   *Fix:* Distinguish between *Local Causality* (this specific neuron) and *Global Causality* (this concept/subspace). Case 1 fails Global Causality (model doesn't use species). Case 6 passes Global Causality (model uses the info, just has backup).
      *   *Check Case 5:* If it falls apart on new prompt types, it fails Semantic Stability. I should advise the user to move their verdict to "No" (or "heuristic") to maintain consistency with Case 4.
      *   *Lying Case:* Be careful not to anthropomorphize. It's a representation of *narrator consistency/truth-value*, which maps to "lying".

  10. **Final Review of the "Principle":**
      Let's name it **"Instrumental Grounding"**. A feature represents $X$ if:
      1.  It carries information about $X$ (Decodability).
      2.  The model *uses* that information to compute outputs (Causal Efficacy of the *concept*, not necessarily the specific unit).
