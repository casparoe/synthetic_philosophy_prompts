answer: |-
  Your epistemic-priority rule captures the intuition behind incapacity (Cases 1, 4, 5) but fails as a general theory. It cannot explain why contracts bind without asymmetry (6), why servitude is void despite lucidity (7), or why constitutional rights entrenchment is legitimate despite no epistemic superiority (8). It also fails to explain your preference for friction over locks (2 vs 3, 8 vs 10). The rule must be discarded as a master principle, though it survives as a specific trigger for intervention during impairment.

  The tension in your verdicts lies between absolute locks and procedural friction. You prefer Case 10 (two-parliament lock) over Case 8 (absolute entrenchment), and Case 3 (costly exit) over Case 2 (impossible exit). Yet you accept Case 8 as legitimate. To achieve coherence, you must downgrade Case 8: absolute locks are suspect; friction is the legitimate form of precommitment. Additionally, Case 15 (Vegan) and Case 1 (Addict) require a distinction between *impairment* and *moral growth*. Precommitment protects against the former, not the latter.

  I propose the **Agency-Continuity Principle**: A precommitment binds only if it preserves or enables the future agent's capacity for autonomous choice, remains revisable through heightened procedural cost rather than absolute impossibility, and never alienates the power of agency itself. This principle unifies the personal and constitutional cases; they are not metaphorical equivalents but instantiations of the same problem: how a temporal extended agent maintains integrity without suicide. The "self" in Case 1 and the "polity" in Case 8 are both continuing agents whose future capacity for choice must be protected, not extinguished.

  Applying this to your unsettled cases: First, the **Living Will**. Since the eighty-five-year-old is competent, this is moral growth, not impairment. The earlier refusal does not bind; treatment should continue. Second, the **Company Charter**. If the mission lock prevents shareholders from altering the company's purpose entirely, it alienates their agency. It is void unless it allows amendment via supermajority (friction). Third, the **Reverse Lock 14**. If a persistent majority is blocked from repealing a non-rights provision, the lock alienates the polity's agency. It is illegitimate.

  The residual question this principle cannot close is the metric of "agency capacity." How do we objectively distinguish between a harmful impairment (Case 1) and a legitimate evolution of values (Case 15) when the agent claims both are rational? The principle tells us to protect agency, but not how to measure its degradation versus its growth without smuggling in substantive moral judgments.

