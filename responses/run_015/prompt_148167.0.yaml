      *   **Participants:** Mara (argues PII is false via Black's spheres), Leo (argues PII can be saved via relations/structuralism).
      *   **Task:** Adjudicate the debate move-by-move. Rate each move (clearly wrong to clearly right). Explain what is missing. Address Black's original intent.
