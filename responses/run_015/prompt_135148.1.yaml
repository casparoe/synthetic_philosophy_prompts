prompt: |-
  hey — I'm putting together a short seminar handout on whether Keynes's notion of the "weight" of an argument can do any work that plain expected-utility reasoning cant, and I need a case built to order.

  The bit of Keynes I'm working from (flag it if Ive got him wrong): he separates the probability of a proposition from the weight of the evidence behind it. Two hypotheses can both sit at, say, 0.7, one resting on a large well-mixed pile of statistics and the other on two anecdotes and a hunch, and he thought the weight mattered to what you should *do*, not just to how confident you feel.

  So: build me a decision problem where weight seems to genuinely make the difference, then stress-test it. Specs:

  - Ordinary life, one paragraph — a farm, a clinic, an insurance renewal, a job offer, whatever. No labs, no demons, no infinite stakes, nothing a normal person couldnt face.
  - Two options. The relevant probability has to be *the same number* on both sides, and the stakes the same too, so vanilla expected utility is flatly indifferent. The only thing that differs is how much evidence, and what kind, sits behind that number.
  - No references or citations needed, I just want the argument.

  Here's the part I actually care about. Every version I try, the reason to prefer the well-evidenced option turns out to be "well, the 0.7 in the anecdote case is probably the shakier estimate" — and that's just second-order uncertainty about the number, which any Bayesian can already handle. So stipulate that the agent is certain 0.7 is right in *both* cases, and see whether the weight consideration survives once that move is blocked. If the honest answer is that the case collapses and weight cant do independent work, say so — but then tell me what would have to be bolted on for it to earn its keep (a later chance to check? a non-linear use of the number? something about how the estimate will react to new evidence?) and whether bolting that on is cheating.

  After the scenario, please:
  - state the belief, the number, the two evidence bases, and why expected utility says "indifferent";
  - say what the weight consideration recommends and why;
  - name the single feature of the case doing the work, and show what happens to the verdict when you remove it;
  - give the expected-utility person's best counterattack, and say whether you think it lands.

  Dont just stipulate that weight matters and call it a day — I want the verdicts to fall out of the case rather than being written into it. Use British English throughout, and keep it fairly plain: if a first-year can follow the setup youve done your job.
