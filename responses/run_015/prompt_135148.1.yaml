      *   *Keynes's Claim:* Weight matters independently.
      *   *The Standard Objection:* If you really believe the probability is 0.7 in both cases, you've already accounted for the lack of evidence in the low-weight case. If the low-weight case is "shaky," your probability should be less extreme (closer to 0.5) or you should have a distribution over probabilities (second-order uncertainty).
