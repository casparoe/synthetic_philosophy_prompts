answer: |-
  You are deciding where to invest a modest sum of savings that you might need in six months. Option A is a established income fund with fifty years of performance data; Option B is a new venture capital pool run by a brilliant but untested team. A trusted financial adviser has analysed both and assures you that, for your specific purposes, each option has exactly a 0.7 probability of yielding a profit and a 0.3 probability of losing value. The potential gain is £5,000 in both cases, and the potential loss is £2,000 in both cases. You have no reason to doubt the adviser's figures; you are certain the 0.7 figure is accurate for both options. You must choose one now, and you cannot switch or withdraw until the six months are up.

  ***

  **The Belief, the Number, the Evidence, and the EU Verdict**
  In both cases, your degree of belief in a profitable outcome is fixed at 0.7. The evidence base for Option A is large, historical, and statistical (high weight); the evidence base for Option B is theoretical and sparse (low weight). The stakes (£5,000 gain vs £2,000 loss) are identical. Plain expected-utility reasoning calculates the value of each option as $(0.7 \times 5000) + (0.3 \times -2000)$. Since the probabilities and payoffs are numerically identical, the expected utility is exactly the same for both. The theory says you should be strictly indifferent; flipping a coin to decide is perfectly rational.

  **The Weight Consideration**
  Despite the mathematical indifference, most people would strongly prefer Option A. The weight consideration recommends choosing the fund with the heavy evidence base. The intuition is that the 0.7 attached to Option A is 'solid' or 'secure', whereas the 0.7 attached to Option B is 'fragile'. Even if the current probability is the same, acting on the high-weight option feels less risky because the estimate is less likely to be wrong due to missing information. We feel we *ought* to favour the option grounded in data, even if the calculated odds are identical.

  **The Single Feature Doing the Work**
  The feature doing the work here is **susceptibility to revision**. We prefer Option A because we implicitly assume that if new information arrived tomorrow, the probability for Option A would stay near 0.7, while the probability for Option B might swing wildly to 0.1 or 0.9. However, if you remove this feature—by stipulating, as the scenario does, that you cannot switch, withdraw, or receive new information before the outcome resolves—the preference collapses. In a strictly one-shot decision with no future updates, the stability of the belief matters less than the belief itself. If you are certain the probability is 0.7 *now*, the fact that it *might have changed* under different evidence conditions is irrelevant to the current payoff.

  **The Expected-Utility Counterattack and Evaluation**
  The expected-utility theorist's best counterattack is to say: "You have already been told to treat the 0.7 as certain. If you prefer Option A, you are secretly treating the probability of Option B as lower than 0.7, or you are valuing something other than the monetary payoff (like peace of mind). If you truly believe the chance of profit is identical, there is no rational ground for preference."

  This counterattack lands successfully for the static case as described. If the agent is certain of the probability number, weight cannot do independent work without violating the axioms of expected utility. For weight to earn its keep, you must bolt on a **dynamic element**: the possibility that you will have a chance to reconsider your choice later based on new evidence. If you can change your mind later, high weight is valuable because it prevents regrettable flips; low weight is dangerous because new data might force you to abandon the project at a loss. Bolting this on is not cheating, because real-life decisions rarely happen in a vacuum sealed from future information. However, it does admit that weight matters for *sequences* of decisions, not necessarily for isolated, one-off choices.
