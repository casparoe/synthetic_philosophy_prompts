prompt: |-
  hey — I do a hands-on session every year at the science-writers conference, 75 minutes, around 20 people, mostly reporters plus a few editors, mixed experience levels, and nobody signed up for a philosophy class. This year I want to do it on the precautionary principle, and I want it to be something they actually do rather than me standing at the front defining it.

  The thing I want them to feel is that the precautionary principle isn't really a claim about how much risk to take. It's a claim about who has to prove what. Same dossier, same people, and the outcome flips completely depending on whether the default is "you can go ahead unless somebody produces evidence of harm" or "you can't go ahead until somebody produces evidence of safety." I want them walking out able to spot which default a story has quietly already picked. I've started calling it the default leak, because it leaks out of the reporting and into the grammar: "no evidence that X harms" versus "evidence that X doesn't harm," "can't rule out" versus "has ruled out," "scientists warn" versus "scientists reassure." Readers inherit the default and never find out it was a choice.

  Second thing: I want them to get burned by the mirror version — precaution pointed at the status quo instead of at the new thing. Blocking the replacement keeps the old thing in place, and sometimes the old thing is what's doing the damage. If they leave thinking precaution just means "be careful," I blew it.

  What I have so far is a fake case (I'm inventing the dossier on purpose, I do not want them litigating real science) and a two-round editorial meeting where each table votes. But I can't get the mechanics to bite:

  - I want the two-default thing to land as a discovery, not an instruction. My idea is to slip half the tables a card saying the proposal moves forward unless someone produces evidence of harm, and the other half a card saying it's blocked unless someone produces evidence of safety, without telling them the cards differ — so each table thinks that's just how meetings work. Is that too cute? What happens when they compare notes, and how do I keep it from becoming "you rigged this"?
  - The dossier has to be built so both defaults are genuinely live. I don't want the evidence packet deciding it behind my back. What has to be in it, and what has to be conspicuously missing?
  - I need somthing with actual costs, not real money but a payoff scheme where blocking and approving both cost you something, plus a clock — a lot of the real force of precaution is that the decision has a deadline and the status quo keeps running while you deliberate.
  - Round 2 has to flip it so the risky move is the block. How do I stage that so it doesnt feel like I changed the subject?

  Then a final round: same dossier, each table writes a hed under their standard, tables swap, and they have to guess which default produced which hed.

  Give me rules, materials, a minute-by-minute timeline, and a debrief that maps what happened in the room onto the parts of the idea. Tell me what will predictably blow up the first time I run it and how to handle it. And be straight with me about what the game can't do — I'm guessing it can't reproduce whatever makes real precautionary arguments feel heavy instead of procedural (irreversibility? the gap between a risk you can price and one you can't?), so tell me which part I just have to say out loud myself. No reading list, no citations — I'm not writing the explainer here.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** Hands-on session at a science-writers conference.
      *   **Constraints:** 75 minutes, ~20 people (reporters/editors, mixed experience), not a philosophy class.
      *   **Goal:** Teach the Precautionary Principle not as "be careful" but as a burden of proof/default setting mechanism ("Default Leak").
      *   **Key Insight 1:** Same facts + different default = opposite outcome.
      *   **Key Insight 2:** Precaution applied to the *status quo* (blocking the new thing might keep the dangerous old thing).
      *   **Current Idea:** Fake case study, two-round editorial meeting, hidden rule cards (half get Default A, half get Default B).
      *   **Specific Needs:** Rules, materials, timeline, debrief, failure modes, limitations of the exercise.
      *   **Tone:** Direct, practical, no fluff/citations.

  2.  **Deconstruct the Mechanics:**
      *   *The "Cute" Card Trick:* Is it too cute? If done right, it creates cognitive dissonance. If done wrong, it feels like a magic trick. The reveal needs to be about *language*, not just "I tricked you."
      *   *The Dossier:* Needs to be ambiguous enough that reasonable people can argue both sides, but specific enough to have stakes. Needs "unknowns" that matter.
      *   *The Cost/Clock:* Needs to simulate the pressure of the status quo continuing.
      *   *Round 2 (The Flip):* Needs to show that blocking innovation can be the risky move.
      *   *The Headline Exercise:* Concrete output to test their understanding of the "Default Leak."

  3.  **Drafting the Scenario (The "Dossier"):**
      *   *Idea:* A new agricultural chemical vs. an old one? A new medical treatment vs. standard care? A geoengineering project?
      *   *Selection:* **Water Treatment Additive.** It's relatable, has public health stakes, and involves a "new thing" vs. "current pipe infrastructure."
      *   *The New Thing:* "AquaClear" (prevents lead leaching).
      *   *The Risk:* Potential long-term hormonal effect (uncertain).
      *   *The Status Quo:* Old pipes leaching lead (known harm).
      *   *Why this works:* It sets up Round 2 perfectly. Blocking AquaClear keeps the lead leaching (Status Quo Harm).

  4.  **Refining the Mechanics (Addressing the User's Concerns):**
      *   *Hidden Cards:* Don't make it a secret conspiracy. Make it "Editorial Policy." Tell them *after* Round 1 that policies differed. This avoids the "you rigged this" feeling by framing it as "newsrooms have different charters."
      *   *The Cost:* Use "Public Trust Points" or "Health Impact Units." Let's go with **"Harm Units"** to keep it stark.
      *   *The Clock:* A literal timer. Every minute of deliberation = Status Quo Harm accumulates.

  5.  **Developing the Timeline (75 Minutes):**
      *   Intro (5 min)
      *   Round 1: The Decision (20 min) - Split groups, hidden defaults.
      *   The Reveal & Compare (15 min) - The "Aha!" moment.
      *   Round 2: The Flip (15 min) - Status quo is dangerous.
      *   Headline Swap (10 min) - Linguistic application.
      *   Debrief (10 min) - Connecting to real reporting.

  6.  **Addressing the "Blow Up" Points:**
      *   *Resistance:* Reporters hate being told how to frame. Need to emphasize this is about *sources' framing*, not their own bias.
      *   *Ambiguity:* If the science is too clear, the game breaks. If too vague, they get annoyed. Need a "Goldilocks" uncertainty.
      *   *The "Rigged" Feeling:* Handle by admitting the design but focusing on the *reality* that these defaults exist in the wild.

  7.  **Addressing the Limitations:**
      *   The game is procedural. Real precaution involves *existential* risk and *irreversibility*. The facilitator must speak to the emotional weight of "ruining the world" vs. "delaying progress."

  8.  **Fleshing out the Details (Iterative refinement):**
      *   *Materials:* Need printed dossiers, rule cards, decision sheets, timers.
      *   *Rule Cards:*
          *   Card A (Innovation Default): "Proceed unless clear evidence of harm."
          *   Card B (Precaution Default): "Hold unless clear evidence of safety."
      *   *Round 2 Twist:* Change the context slightly. The "Old Pipe" is now known to be failing faster than expected. The "New Thing" is the only fix. Blocking it = active harm.
      *   *Headline Exercise:* Give them the decision, ask for the hed. Then swap and guess the default.

  9.  **Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   20 people? 4 tables of 5 works well.
      *   No philosophy class? Keep language practical ("Editorial Policy").
      *   No citations? Check.

  10. **Final Polish:** Ensure the tone matches the user's (sharp, experienced, no-nonsense). Use their terminology ("Default Leak").

  *(Self-Correction during drafting)*: I initially thought about having them write stories. Too long. Just headlines and ledes.
  *(Self-Correction on the "Rigged" fear)*: Make sure the debrief acknowledges the manipulation but pivots immediately to "This manipulation happens to you every day from PR and Press Releases."
  *(Self-Correction on Round 2)*: Make sure the *facts* don't change, only the *context* of the status quo. Actually, better to keep facts identical but reveal new info about the status quo's cost. Let's keep the dossier static but add an "Update" slip for Round 2 to raise the stakes of the status quo.

  11. **Finalizing the Output Structure:**
      *   Concept Check (Validating the approach).
      *   Materials List.
      *   The Scenario (The Dossier).
      *   The Rules (The Cards).
      *   Minute-by-Minute.
      *   The Debrief Script.
      *   Failure Modes.
      *   Limitations.

