answer: |-
  # Question-Period Prep Sheet: Accuracy-Dominance & Interest-Relativity

  **Thesis:** Accuracy-dominance arguments for Probabilism fail because the choice of scoring rule is underdetermined by purely epistemic constraints; the choice must be made based on the agent's practical interests, rendering epistemic rationality interest-relative.

  **Strategy:** Concede technical points quickly to preserve credibility with the decision theorists, but pivot to the normative implications for the traditionalists. Do not get bogged down in the math of scoring rules; keep the focus on the *justification* for choosing one.

  ---

  ### Top 8 Objections (Ordered by Damage Potential)

  #### 1. The "Invariance" Objection (Decision Theorists)
  **Voice:** "Look, the specific metric doesn't matter. Any strictly proper scoring rule yields the same dominance result: incoherent credences are dominated by coherent ones. The *qualitative* norm (Probabilism) is invariant across the class of proper rules. Why does the quantitative disagreement about 'how bad' a violation is matter for the normative conclusion?"
  **Reply (2 min):** The normative conclusion isn't just 'be coherent.' It's 'be coherent *rather than this alternative*.' When an agent discovers incoherence, they need to know *where* to revise. Different proper rules recommend different minimal revisions to restore coherence. If the rule is chosen by practical interest, then the *direction* of rational repair is interest-relative. The invariance of the *target* (Probabilism) doesn't save the invariance of the *path* to the target.
  **Concede:** Yes, all strictly proper rules agree that coherence dominates incoherence.
  **Soft Spot:** This relies on the claim that agents need guidance on *revision*, not just *evaluation*. If they say evaluation is all that matters, your interest-relativity claim weakens.

  #### 2. The "Collapse" Objection (Traditional Internalists)
  **Voice:** "If epistemic rationality is determined by what the inquirer 'needs,' you've collapsed the distinction between epistemic and practical rationality. We care about justification because it tracks truth, not because it serves our interests. You're arguing for pragmatism, not a new epistemology."
  **Reply (2 min):** I'm not saying truth doesn't matter. I'm saying 'accuracy' is a multidimensional space (calibration, refinement, sharpness). 'Truth-tracking' doesn't tell us how to weight false positives against false negatives. That weighting *must* come from outside the epistemic sphere. Epistemic rationality remains distinct because the *constraint* is still accuracy, but the *metric* for accuracy is set by context. It's interest-relative, but not merely pragmatic in the 'believe what makes you happy' sense.
  **Concede:** Yes, this blurs the traditional sharp line between epistemic and practical reasons.
  **Soft Spot:** Traditionalists may simply reject the premise that 'epistemic' can be interest-relative at all. You need a positive account of "epistemic" that survives this relativity.

  #### 3. The "Uniqueness" Objection (Decision Theorists)
  **Voice:** "You claim there's no non-question-begging way to choose a rule. But Joyce and Pettigrew argue that constraints like *Locality* (score depends only on the proposition's truth) and *Truth-Directedness* uniquely select the Brier Score (or a specific class). Doesn't that fix the metric without appealing to interests?"
  **Reply (2 min):** Those constraints look purely epistemic, but they encode hidden value judgments. Locality, for instance, assumes the cost of error doesn't depend on *which* false world obtains. That's a substantive claim about the symmetry of error, not a logical truth. In forecasting, we reject Locality because missing a tornado is worse than a false alarm. If philosophers insist on Locality, they are smuggling in a preference for symmetry over operational cost.
  **Concede:** There are formal arguments claiming uniqueness based on structural constraints.
  **Soft Spot:** This is the technical battleground. If they prove Locality is a *conceptual* requirement of "accuracy" rather than a value judgment, Step 2 of your argument fails. (See "Killer Objection" below).

  #### 4. The "Operational" Objection (Research Forecaster)
  **Voice:** "You're presenting this as a philosophical discovery, but in meteorology, we've known for eighty years that you choose the score based on the cost function of the decision at hand. Calling the philosophy literature 'naive' is fair, but what's your contribution? You're just redescribing operational verification."
  **Reply (2 min):** My contribution isn't to forecasting; it's to epistemology. Philosophers have been using proper scoring rules to derive *categorical* norms of belief (Probabilism) while claiming neutrality from practical interests. I'm arguing that because the forecasters are right about scores, the philosophers are wrong about neutrality. I'm importing your operational realism to break a philosophical deadlock about the nature of rationality.
  **Concede:** The core insight is standard practice in verification science.
  **Soft Spot:** Risks making your talk seem like a trivial application of existing science to philosophy. Emphasize the *normative* impact on epistemology.

  #### 5. The "Permissivism" Objection (Traditional Epistemologists)
  **Voice:** "If two agents have the same evidence but different practical interests, does your view say they can rationally hold different coherent credences? That's permissivism. It undermines the idea that evidence constrains belief."
  **Reply (2 min):** Evidence constrains the *set* of coherent functions, but not the *selection* within that set when repairing incoherence or defining accuracy. If 'rational credence' means 'the credence that best optimizes accuracy given my needs,' then yes, needs can vary. But this isn't wild permissivism; it's constrained by the requirement of coherence and the specific accuracy structure of the domain.
  **Concede:** Yes, this view entails a form of interest-relative permissivism.
  **Soft Spot:** Many epistemologists view permissivism as a *reductio*. Be prepared to defend why this specific permissivism is acceptable.

  #### 6. The "Virtue" Objection (Virtue Epistemologists)
  **Voice:** "You're reducing the epistemic agent to a scoring machine. Intellectual virtues like open-mindedness or intellectual courage aren't captured by minimizing a loss function. Why think accuracy is the sole fundamental epistemic value?"
  **Reply (2 min):** I agree accuracy isn't the *only* value. But the accuracy-dominance argument claims accuracy is the *foundation* for Probabilism. I'm attacking that foundation. If even the foundational value (accuracy) is interest-relative, then the virtues built on top of it must be too. This actually helps virtue epistemology by contextualizing intellectual virtues within the agent's broader life goals.
  **Concede:** Accuracy is not the only epistemic good.
  **Soft Spot:** If they argue virtues are primary and accuracy is derivative, your attack on accuracy arguments might miss their main point.

  #### 7. The "Separation" Objection (Decision Theorists)
  **Voice:** "We distinguish *epistemic* utility from *practical* utility. Joyce's argument uses epistemic utility functions. You're conflating the two by bringing in the forecaster's cost functions. We can define a purely epistemic scoring rule that ignores practical consequences."
  **Reply (2 min):** You can define it, but you can't *justify* it. Why is that specific epistemic utility function the right one? If you say 'because it measures truth,' I ask 'which measure of truth?' Brier? Log? Spherical? Without appealing to how those measures serve an inquirer's goals, the choice is arbitrary. The separation is mathematically possible but normatively empty.
  **Concede:** The mathematical distinction between epistemic and practical utility is clear.
  **Soft Spot:** You need to argue that "normative emptiness" is fatal. They might accept a brute epistemic norm.

  #### 8. The "Normative Force" Objection (Internalists)
  **Voice:** "Even if interests determine the rule, why *ought* I follow it? 'I need this for my job' doesn't generate an epistemic 'ought.' It generates a prudential one. You haven't explained the normativity."
  **Reply (2 min):** I'm arguing the epistemic 'ought' *is* a species of the prudential 'ought' regarding information processing. There is no sui generis epistemic normativity floating free of human needs. If that feels unsatisfying, it's because we've been trained to think of 'epistemic' as a separate silo. The force comes from the fact that you care about getting things right *for some reason*.
  **Concede:** This denies the existence of sui generis epistemic normativity.
  **Soft Spot:** This is a major meta-normative commitment. If the audience is realist about epistemic norms, this will be a hard sell.

  ---

  ### The "Killer Objection" (Hope Nobody Raises)
  **Objection:** *The "Locality as Conceptual Truth" Argument.*
  **Who:** A Decision Theorist well-versed in Joyce (2009) or Pettigrew (2016).
  **The Point:** "You claim constraints like Locality are value judgments. But Locality is a conceptual requirement of *accuracy*. If a score depends on which false world obtains, it's not measuring accuracy; it's measuring something else. Therefore, the Brier Score (or Log Score) is uniquely determined by the *concept* of accuracy, not by interests. Your Step 2 is false."
  **Why it hurts:** Your argument hinges on the underdetermination of the scoring rule by purely epistemic constraints. If Locality (or similar) is accepted as a conceptual truth about accuracy rather than a value judgment, the "interest-relative" gap closes. You would be forced to argue that the *concept* of accuracy itself is interest-relative, which is a much harder metaphysical claim to defend in a short reply.
  **Preparation:** If raised, pivot to: "Concepts are tools. Why do we value *that* concept of accuracy? If the answer is 'because it's useful,' we're back to interests."

  ---

  ### Preemptive Strike (Raise & Defuse in Talk)
  **Objection to Preempt:** *The "Invariance" Objection (Decision Theorists).*
  **Why:** This is the most common defense of accuracy arguments ("It doesn't matter which rule, they all prove Probabilism"). If you don't address this, the decision theorists will dismiss your whole project as attacking a straw man.
  **How to Preempt:** In the section on Step 2, explicitly grant that all proper rules yield Probabilism. Then immediately pivot: "However, rationality requires more than knowing the target; it requires knowing how to aim. When an agent is incoherent, different rules prescribe different repairs. Since the framework cannot choose a rule without appealing to interests, the *repair* is interest-relative. The invariance of the destination does not save the neutrality of the journey."
  **Benefit:** This shows you understand the formal literature better than they expect and isolates your specific contribution (the revision problem) from the standard dominance result.
