  Keep **(7)** for now if your dissertation argues for a specific causal metaphysics (e.g., Kalam-style constraints on *genesis* but not *existence*). But be aware that **(4)** and **(7)** are in tension. If you want a truly unified theory of infinity, you should either accept both Supertask Vase and Supertask Hotel, or reject both. Since you accept the Vase, consistency suggests you should accept the Supertask Hotel. **Dropping the balking in (7)** would significantly simplify your principle set without damaging your core claims about cardinality and quantity.
