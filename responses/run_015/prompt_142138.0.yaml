  **Case B: The Rational Hotel**
  *Scenario:* Rooms indexed by $\mathbb{Q}$. Full hotel. New guest arrives. Every guest must move to a room $q'$ such that $|q - q'| < 1$.
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This aligns with **(1) and (2)**. $\mathbb{Q}$ is countable, so a bijection exists (Hilbert Hotel logic). The metric constraint ($|q - q'| < 1$) is satisfiable because $\mathbb{Q}$ is dense and unbounded. One can construct a permutation of $\mathbb{Q}$ that shifts every rational by a small amount to free up a specific room (e.g., by shifting along a sequence $q_n$ where $|q_n - q_{n+1}| < 1$). Since rooms are abstract indices (Principle 1), and no concrete tokens are created/destroyed, the operation is admissible.
  *   *Principle Applied:* Principle 1 (Abstract Permutability). The metric constraint is a condition on the bijection, not a conservation violation.

