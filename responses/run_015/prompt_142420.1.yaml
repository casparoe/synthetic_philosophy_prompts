answer: |-
  This is a sophisticated stalemate, and your intuition that it "didn't feel clean" is correct. If this were merely a verbal dispute, you could resolve it by stipulating definitions and moving on. The fact that you can't suggests the disagreement is deeper.

  Here is the diagnosis: **This is a causal-mechanism dispute masquerading as an ontological one.**

  You are fighting over the definition of "nation" because that definition determines *what counts as evidence* for your respective theories of social change. However, beneath the semantics lies a genuine, unresolved empirical question about **constraint versus construction** in historical mobilization.

  Here is the breakdown of why this diagnosis fits, using the specific claims of Anderson/Hobsbawm versus Smith, and what would actually constitute progress.

  ### 1. Why it is not *just* a verbal dispute
  You hypothesized that you are using a "thick" definition (modern infrastructure) and your friend is using a "thin" one (named community). While true, this doesn't capture the stakes.

  *   **The Modernist Stakes (Anderson/Hobsbawm):** For Anderson, the "nation" is defined by the *mode* of imagination (print capitalism, simultaneous time). If you remove the infrastructure, the specific *quality* of the bond disappears. For Hobsbawm, continuity is "factitious." If you call a pre-modern *ethnie* a "nation," you are falling for the nationalist propaganda you are supposed to be analyzing.
  *   **The Ethnosymbolist Stakes (Smith):** Smith actually agrees that *nationalism* (the ideology) is modern. His point is that the *nation* (the community) relies on a "myth-symbol complex." For Smith, the definition isn't just semantic; it's psychological. He argues that without pre-existing myths of ancestry and homeland, the modern nationalist appeal will not *resonate*.

  **The Diagnosis:** You aren't just labeling the same object differently; you are disagreeing about **whether the past exerts causal force on the present.**
  *   **You (Modernist):** The past is raw clay. Elites can sculpt it into any shape if they have the modern kiln (state, press, schools).
  *   **Friend (Ethnosymbolist):** The past is bedrock. Elites can build on it, but they cannot build *through* it. If the bedrock isn't there, the building collapses.

  ### 2. The Hidden Empirical Question: The "Constraint Hypothesis"
  Your example of the 19th-century enthusiasts is the perfect testing ground.
  *   **Your explanation:** They manufactured the sense of peoplehood and projected it backward.
  *   **Friend's explanation:** They successfully mobilized *because* there was a latent sense of peoplehood to tap into.

  This is an empirical claim about **mobilization efficiency.** Smith's strong move is the *Constraint Hypothesis*: Nationalist movements fail or succeed based on the availability of pre-modern ethnic resources.

  **Where the deadlock lies:**
  Both sides can explain success.
  *   If a movement succeeds: You say "modern infrastructure worked." Friend says "ethnic resources were available."
  *   If a movement fails: You say "infrastructure wasn't mature yet." Friend says "no ethnic core existed."

  To break this, you need a case where the variables are decoupled.
  *   **Case A:** Modern infrastructure exists + No pre-modern *ethnie* = ? (Does nationalism fail?)
  *   **Case B:** Pre-modern *ethnie* exists + No modern infrastructure = ? (Does nationalism fail?)

  Modernists point to **Case B** (plenty of ethnic groups in history, no nations) to prove modernity is the cause. Ethnosymbolists point to **Case A** (e.g., certain post-colonial states or civic experiments that struggled to generate loyalty compared to ethnic states) to prove ethnicity is the cause.

  ### 3. Methodological Divergence: Structure vs. Culture
  The reason you are talking past each other is that you are prioritizing different levels of analysis.

  *   **Modernism is Structuralist:** It looks at the *hardware* of society (technology, economy, bureaucracy). It asks: "What conditions make this form of organization possible?"
  *   **Ethnosymbolism is Culturalist:** It looks at the *software* of society (memory, myth, identity). It asks: "What content makes this form of organization feel legitimate?"

  When you say "nations are modern," you mean the *hardware* is modern. When your friend says "nations are ancient," he means the *software* has legacy code. You are both right about your respective layers, but you are fighting over which layer defines the machine.

  ### 4. What Counts as Progress?
  You asked if we should expect progress. In philosophy of social science terms, this is a **degenerating research programme** if you keep asking "How old is the nation?" because the answer depends entirely on the theoretical lens you wear.

  Progress requires shifting the question from **Ontology** ("What is a nation?") to **Conditionality** ("When does ethnic heritage matter?").

  **Three paths to progress:**

  1.  **The "Failed Nationalism" Test:**
      Stop looking at successful nations (France, Japan, Germany) where both sides can find evidence for their theory. Look at failures.
      *   *Progress:* Identify cases where modernizing elites tried to build a nation but lacked a pre-modern *ethnie* (e.g., some Pan-African or Pan-Arab projects, or specific post-Soviet states). If they failed *specifically* due to lack of cultural resonance despite having modern infrastructure, Smith wins a point. If they failed due to lack of economic integration despite strong ethnic ties, you win a point.

  2.  **Distinguish "Nation" from "Nationalism":**
      Adopt Smith's distinction but refine it. Agree that *nationalism* is the modern political principle (self-determination), but acknowledge that *national identity* often piggybacks on *ethnic identity*.
      *   *Progress:* Admit that some nations are "ethnic" (relying on Smith's mechanisms) and some are "civic" (relying on Anderson's mechanisms). The debate then becomes: "Are civic nations actually stable without ethnic underpinnings?" (e.g., Is American nationalism actually reliant on a myth of Anglo-Protestantism, as Smith might argue, or is it purely constitutional, as Modernists hope?)

  3.  **The "Invention" Threshold:**
      Investigate the limits of invention. Hobsbawm says traditions are invented. Smith says they must be *believable*.
      *   *Progress:* Research into cognitive science or social psychology regarding group identity. Is there a cognitive limit to how much "ancestry" can be fabricated before it stops triggering in-group bias? If there is a biological/psychological constraint on "imagining," the Ethnosymbolists have a stronger empirical claim.

  ### Verdict on the Diagnosis
  Do not accept the "verbal dispute" exit ramp. It is too easy.
  *   **It is not verbal:** Because the definitions are tools for causal explanation, not just labels.
  *   **It is not purely empirical:** Because "resonance" and "legitimacy" are hard to quantify.
  *   **It is a Causal-Mechanism Dispute:** You are arguing about whether history is a **break** (Modernity created a new species of community) or a **flow** (Modernity transformed an existing species of community).

  **Recommendation:**
  Tell your friend: "I concede that nationalists need raw material. I deny that the raw material determines the building."
  Tell yourself: "I concede that elites cannot mobilize *anything*. I deny that the pre-modern material dictates the modern political form."

  The progress lies in studying the **friction** between the two. The most interesting cases aren't where you agree (successful 19th-century nations) but where the modern machinery and the ethnic memory are out of sync (e.g., Switzerland, Belgium, the USA, or the breakup of Yugoslavia). That is where the causal mechanism reveals itself.
