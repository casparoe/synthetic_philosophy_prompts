      *   *Weaknesses/Gaps:* It conflates *detection* with *definition*. It assumes pain is solely a neural/behavioral state, ignoring the *what-it-is-like-ness*. It misses the epistemic role of phenomenology in *defining* the target of inquiry.

  4.  **Brainstorm Counter-Arguments (Why Philosophers Persist):**
