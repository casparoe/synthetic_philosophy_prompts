      *   **The "Target of Inquiry" Argument:** Philosophy of mind is trying to explain *experience*, not just behavior or neural firing. If the device disagrees with the subject, who is wrong about the *experience*?
      *   **The "Zombie" Problem:** If we discard first-person authority, do we risk eliminating the phenomenon we set out to study?
      *   **Nuanced View of Authority:** Distinguish between *ontological* authority (what makes it pain) and *epistemic* authority (how we know it).
