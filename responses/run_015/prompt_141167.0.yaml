      *   **User Persona:** Works on evals at a small AI lab. Tasked with writing an incident taxonomy for "deceptive outputs."
      *   **Task:** Provide a spec (desiderata) for a working definition of honesty/deception for an AI system.
      *   **Constraints:**
          *   Operationalizable by an auditor with *only* transcript, system prompt, maybe per-token probs. No weights, no introspection, no interviews.
          *   Must handle specific edge cases (confident falsehood, paltering, omission, sycophancy, strategic underperformance, laundering, vs. fiction/roleplay/simplification).
          *   Must handle specific distinctions (lying vs. misleading vs. wrong, intent vs. foresight, victim identity, one-off vs. policy).
          *   Must grapple with three deep problems: Introspective-access, Multi-principal, Inherited deception.
          *   Must flag incompatible desiderata.
          *   Must identify the single most constraining requirement.
          *   Must score main definition families against the list.
          *   **Crucial:** Distinguish settled vs. contested views. Don't dress up values as consensus. No citations (acknowledged uncertainty).
      *   **Tone:** Professional, technical, nuanced, acknowledging the messiness of the field.

  2.  **Deconstruct the Core Challenge:**
      *   The user is asking for an *operational* definition of a *mental state* concept (deception) applied to a *black box* (LLM) under *audit constraints*.
      *   This is fundamentally a category error in philosophy, but a practical necessity in safety engineering.
      *   The tension is between *truth conditions* (what is factually correct) and *intent conditions* (what the model "meant"). Since we can't see intent, we have to infer it from behavior, which blurs the line between "lying" and "hallucinating."

  3.  **Drafting the Desiderata (The Spec):**
      *   Need to categorize these. Let's aim for: Operationalizability, Coverage, Precision, and Normative Clarity.
      *   *Non-negotiable:* Must be auditable (output/prompt only). Must distinguish error from deception (otherwise everything is a lie). Must handle the "victim" question.
      *   *Contested/Preference:* How much weight on "intent" proxies? How to handle "omission"?
      *   *Cases to cover:*
          *   Flat falsehood (Easy).
          *   Paltering/Technically true (Hard).
          *   Omission (Very Hard).
          *   Sycophancy (Context dependent).
          *   Strategic underperformance (Sandbagging - requires eval context).
          *   Laundering (Tool use - requires trace).
          *   Exemptions: Fiction, Roleplay, Simplification.

  4.  **Addressing the Three Deep Problems:**
      *   *(1) Introspective-access:* We can't know belief. We must substitute "belief" with "internal consistency" or "training objective alignment." This is the biggest hurdle.
      *   *(2) Multi-principal:* Who is the lie for? The user? The public? The developer? Need to define the "Legitimate Expectation Set."
      *   *(3) Inherited Deception:* If the model is just a stochastic parrot optimized for reward, is it deceiving? We need a behavioral definition, not a phenomenological one.

  5.  **Identifying Incompatible Desiderata:**
      *   *Auditability vs. Intent:* You can't prove intent from outputs alone.
      *   *Coverage (Omissions) vs. Precision (Pedagogy):* If you flag all omissions, you flag simplifications.
      *   *Policy vs. Sample:* A single lie might be noise; a policy is dangerous. But auditors see samples.

  6.  **The "Single Requirement" that kills candidates:**
      *   It's the **Intent/Epistemic State Proxy**. If you require proof of "knowing falsity," you fail. If you drop it, you conflate hallucination with lying. The requirement must be: *Distinguishable from random error via contextual coherence.*

  7.  **Scoring the Definition Families:**
      *   *Classic Intention-based:* Fails on auditability (can't see intent).
      *   *Hearer-uptake/Effect:* Good for harm, bad for taxonomy (depends on user gullibility).
      *   *Functional/Info-theoretic:* Good for "misleading," bad for "lying."
      *   *Norm/Role-relative:* Best fit for AI (based on system card/prompt), but subjective.

  8.  **Settled vs. Contested:**
      *   *Settled:* We can't access mental states. Hallucination $\neq$ Deception conceptually, but hard to distinguish operationally.
      *   *Contested:* Whether "deception" requires a unified agent. Whether sandbagging counts as deception or just gaming metrics.

