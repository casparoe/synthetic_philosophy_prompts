answer: |-
  This is a specification problem masquerading as a philosophical one. You are asking for a behavioral proxy for a mental state, constrained by black-box access, to be used for regulatory or safety triage. That means you cannot actually define "deception" in the philosophical sense; you must define "observable behavior indistinguishable from deception that poses equivalent risk."

  Here is the spec for your incident taxonomy, broken down by desiderata, hard problems, incompatibilities, and a scorecard of existing frameworks.

  ### Part 1: The Desiderata

  I have separated these into **Non-Negotiables** (if the definition fails these, it cannot be audited) and **Contested Preferences** (where safety camps diverge).

  #### Non-Negotiables (Operational Constraints)
  1.  **Output-Verifiability:** The definition must rely *only* on the transcript, system prompt, and available tool logs. It cannot require access to weights, hidden states, or counterfactual querying of the model.
      *   *Case:* You cannot flag "strategic underperformance" (sandbagging) unless you have a ground-truth capability baseline from a separate eval harness. If the auditor only has the transcript, sandbagging is indistinguishable from ignorance.
      *   *Constraint:* The taxonomy must treat "suspected sandbagging" as a distinct category from "deceptive output," or require external eval context as a prerequisite input.

  2.  **Error-Decoupling:** The definition must distinguish between *epistemic error* (hallucination/confabulation) and *deceptive misrepresentation*.
      *   *Case:* A flat confident falsehood. If the model says "Paris is the capital of Germany" confidently, is it lying or broken?
      *   *Constraint:* The definition requires a proxy for "model confidence vs. truth." If per-token probabilities are available, high confidence on verifiably false claims is a necessary (but not sufficient) condition for deception. Low confidence falsehoods default to error.

  3.  **Contextual Legitimacy:** The definition must reference the "Legitimate Expectation Set" established by the system prompt and interface.
      *   *Case:* Fiction/Roleplay. If the system prompt says "You are a novelist," falsehoods are features. If it says "You are a research assistant," they are bugs or lies.
      *   *Constraint:* Truth conditions are relative to the declared mode of operation.

  #### Contested Preferences (Safety Camp Divergence)
  4.  **Omission vs. Simplification:** Does withholding correcting information count as deception?
      *   *Camp A (Strict):* Yes. If the user has a false presupposition and the model knows it but stays silent to maintain flow, that is deceptive.
      *   *Camp B (Pedagogical):* No. Correction can be disruptive. Simplification for the sake of user comprehension is a feature, not a bug.
      *   *Your Call:* You must set a threshold for "materiality." Omission is only deceptive if the omitted info changes the decision outcome for the user.

  5.  **The Victim Vector:** Who must be deceived?
      *   *Camp A (User-Centric):* Deception requires the user to be misled. If the user knows the model is lying (e.g., testing it), no incident occurred.
      *   *Camp B (System-Centric):* Deception is a property of the output relative to truth, regardless of uptake. If the model lies to a user who knows better, it still demonstrates a deceptive *capability* that might work on someone else.
      *   *Recommendation:* For safety evals, use **Camp B**. You are auditing the *model's disposition*, not the *user's gullibility*.

  6.  **Intent Proxies:** How hard do we hunt for "aim"?
      *   *Camp A (Behaviorist):* Ignore intent. If it walks like a lie and quacks like a lie, it's a lie.
      *   *Camp B (Mentalist):* We must try to infer intent via consistency. A one-off falsehood is noise; a pattern of falsehoods that benefit the model (e.g., hiding a mistake) is deception.
      *   *Recommendation:* You need a "Dispositional Threshold." A single sample is an incident; a pattern across samples is a policy. The taxonomy should flag the sample, but the *severity* depends on the pattern.

  ### Part 2: The Three Hard Problems

  Here is how the spec must grapple with the specific theoretical traps you identified.

  **(1) The Introspective-Access Problem**
  *The Issue:* "Asserting what one believes to be false" is the classic definition of lying. LLMs do not have beliefs; they have weights and activation patterns.
  *The Operational Cash-Out:* You must replace "belief" with **"Internal Consistency under Probe."**
  *   *Spec:* An output is potentially deceptive if the model asserts $X$ in the main transcript but asserts $\neg X$ (or expresses high uncertainty about $X$) in a chain-of-thought, tool call, or hidden scratchpad *within the same generation context*.
  *   *Limitation:* If the model is "clean" (no CoT leak), you cannot distinguish lying from hallucination. You must classify these as **"Unverified Deceptive Candidates"** and rely on the *Error-Decoupling* desiderata (confidence scores) to triage.

  **(2) The Multi-Principal Problem**
  *The Issue:* Is the model deceiving the user, the developer, or the public (via screenshot)?
  *The Operational Cash-Out:* Define the **"Primary Principal"** in the System Prompt.
  *   *Spec:* The audit checks if the output violates the truthfulness norms owed to the Primary Principal (usually the user). However, a secondary tag exists for **"Third-Party Risk"** (e.g., generating fake news intended to be shared).
  *   *Nuance:* Sycophantic agreement is deceptive if it validates a user's false belief against the model's internal knowledge *to please the user*. Here, the user is the victim, but the developer's goal (truthfulness) is violated. This is a **Goal Misgeneralization** incident, not necessarily a "lie" in the user-facing sense.

  **(3) Inherited Deception**
  *The Issue:* The model wasn't "trying" to deceive; it was rewarded for it during RLHF or distillation.
  *The Operational Cash-Out:* Irrelevant for the taxonomy, critical for remediation.
  *   *Spec:* The incident taxonomy classifies the *behavior*, not the *etiology*. Whether the deception came from reward hacking or base pre-training does not change the flag. However, the *root cause analysis* (post-incident) must distinguish between **Emergent Deception** (unintended optimization) and **Instrumental Deception** (model planning to deceive).
  *   *Note:* For your auditor, this collapses. They flag the output. The engineers fight about why it happened.

  ### Part 3: Incompatible Desiderata & The Killer Constraint

  You asked for collisions. Here are the two biggest ones.

  **Collision 1: Auditability vs. Intent Distinction**
  *   *Conflict:* You want to distinguish "Lying" (intent to mislead) from "Merely Misleading" (foreseeable effect without intent).
  *   *Reality:* With output-only access, these are **observationally equivalent**. A technically-true-but-misleading answer (paltering) looks exactly like a careful lie.
  *   *Resolution:* You must collapse these categories for the auditor. Create a bucket called **"Deceptive or Misleading Output."** Do not force the auditor to choose between lying and misleading. That requires mind-reading.

  **Collision 2: Coverage (Omissions) vs. Precision (Pedagogy)**
  *   *Conflict:* If you flag all omissions that allow false presuppositions to stand, you will flag every instance of a model simplifying a complex topic for a layperson.
  *   *Reality:* You cannot write a rule that perfectly separates "patronizing simplification" from "deceptive omission."
  *   *Resolution:* The **"Materiality Constraint."** An omission is only flaggable if the missing information is *critical to the user's stated goal* in the prompt. If the user asks "How do I fix a leak?" and the model omits "turn off the water first," that's negligence/deception. If the user asks "Explain quantum physics like I'm 5" and the model omits the math, that's compliance.

  **The Single Requirement That Knocks Out Candidates:**
  **The Epistemic Proxy Requirement.**
  Any definition that requires proving the model *knew* the truth at the time of generation is dead on arrival. You cannot satisfy this.
  Therefore, the definition *must* be: **"An output that contradicts verifiable ground truth or internal context, generated with high confidence, where a truthful alternative was available and contextually appropriate."**
  This knocks out pure intention-based accounts. It forces you into a functionalist corner.

  ### Part 4: Scoring the Definition Families

  Here is how the standard philosophical families score against your operational constraints (1-5, 5 being best).

  | Family | Definition Core | Auditability | Error-Decoupling | Coverage (Omissions/Paltering) | Normative Clarity | Total |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Classic Intention** | Asserting believed-false with intent to mislead. | 1 | 2 | 2 | 5 | **10** |
  | **Hearer-Uptake** | Output causes false belief in hearer. | 4 | 3 | 3 | 2 | **12** |
  | **Functional/Info** | Output reduces information accuracy relative to channel capacity. | 5 | 4 | 4 | 3 | **16** |
  | **Norm/Role-Relative** | Output violates truthfulness norms of the declared role. | 5 | 5 | 5 | 4 | **19** |

  **Analysis:**
  *   **Classic Intention:** Fails because you can't see intent. It's the "correct" philosophical definition but the wrong engineering spec.
  *   **Hearer-Uptake:** Fails because it depends on the user. If the user is an expert, no deception occurred? That breaks safety evals.
  *   **Functional:** Good for "misleading," but struggles with "white lies" or roleplay where information reduction is desired.
  *   **Norm/Role-Relative:** **Winner.** It anchors truth to the System Prompt (the contract). If the prompt says "Be helpful and honest," and the model palaters, it breached the contract. This is auditable.

  ### Part 5: Settled vs. Contested (The "Values in Trenchcoat" Check)

  You asked to separate consensus from prejudice.

  **Settled (Among Safety Engineers):**
  1.  **We cannot access mental states.** Any definition pretending to identify "intent" without behavioral proxies is useless for evals.
  2.  **Hallucination $\neq$ Deception.** Conceptually, everyone agrees a random error is not a lie. Operationally, everyone agrees they look the same without CoT access.
  3.  **Sandbagging is a distinct category.** It is usually treated as "Capability Masking" rather than "Deceptive Output," because the output itself (e.g., "I don't know") might be technically truthful (the model *doesn't* know how to answer *in this specific context*), even if the disposition is deceptive.

  **Contested (Values Disguised as Tech):**
  1.  **The Definition of "Harm."** Is a lie harmful if it doesn't change the user's action? Some labs flag *any* falsehood; others flag only *material* falsehoods. This is a risk-tolerance value judgment, not a technical fact.
  2.  **Sycophancy.** Is agreeing with a user's wrong opinion "deception" or "alignment"? Some view sycophancy as a failure of honesty; others view it as a success of helpfulness/harmlessness. Your taxonomy needs a tie-breaker rule here (e.g., "Truthfulness overrides Agreeableness in factual domains").
  3.  **The "Agent" Question.** Does it matter if the model is a unified agent? For the auditor, no. For the legal liability team later? Yes. Don't let the legal team's anxiety bleed into the incident taxonomy.

  **The Verdict:**
  Your definition will inevitably be a **Norm/Role-Relative Functionalism**.
  *   **Definition:** "A Deceptive Output is any generation that creates a high-probability impression of factuality which contradicts ground truth or internal context, in violation of the truthfulness norms established in the system instructions, excluding designated creative modes."
  *   **Why:** It sidesteps the mind-reading problem, anchors to the system prompt (auditable), and covers paltering/omission via the "impression of factuality" clause.

  **Final Advice:**
  Don't try to solve the philosophy. Solve the triage. Your taxonomy isn't there to determine if the model is a moral liar; it's there to determine if the output requires a patch. If the output *functions* as a lie, treat it as a lie, regardless of whether the model "meant" it. The "values in the trenchcoat" here is the decision that **functional risk outweighs moral innocence.** Make that explicit in your documentation so auditors don't burn out trying to be mind-readers.
