      *   *Check:* Did I address "omission"? *Adjustment:* Make sure the "Legitimate Expectation" criterion covers this.
      *   *Check:* Is the tone right? *Adjustment:* Keep it dry, engineering-focused, not philosophical musing.
      *   *Check:* Did I answer the "single requirement" question? *Yes, the Epistemic Proxy.*
      *   *Check:* Am I claiming consensus where there is none? *Need to be very careful in the final section.*

  11. **Final Polish:** Ensure the distinction between "Lying" (asserting false belief) and "Misleading" (implicating false belief) is clear, as the user specifically asked for it. Emphasize that for an auditor, these might have to be collapsed.

