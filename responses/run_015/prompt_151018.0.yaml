  **MEMORANDUM**

  **TO:** Commemoration and Honors Committee
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Vance Hall and Future Review Criteria

  **Bottom Line:** I recommend we adopt **Option 3 (Reclassification without Condemnation)**. We should rename Vance Hall to reflect current values but retain Vance's name on a historical marker that details the study, the harm caused, and the university's complicity, without issuing a formal moral condemnation of Vance's character. Additionally, I recommend we adopt the **Parity Clause** immediately: no further names are removed until all comparable honorees (specifically Bramble and Olds) are reviewed within twelve months.

  **Rationale: Retroactivity and Commemoration**
  Our colleague Dana argues that we face a forced choice: either admit the Nuremberg judges were hypocrites for rejecting the "legal at the time" defense, or admit that legality is never a defense against retrospective sanction. I believe this is a false fork. Nuremberg relied on customary international law that existed *despite* statutory authorization; the defendants were charged with violating norms already recognized as criminal by the community of nations.

  Vance's case is different. His conduct was not merely legal; it was published, cited approvingly by federal guidance, and rewarded by this university in 1991. To treat this as punishable misconduct now (Option 1) is genuinely *ex post facto*. However, commemoration is not criminal sentencing. It is a forward-looking statement of who we wish to emulate. We are not sentencing Vance; we are deciding whether he represents us *now*. Option 3 navigates this by acknowledging that while Vance's conduct violates our current core commitments (warranting removal of the honor), it was situated in a normative context where he may not have foreseen this specific sanction (warranting a refusal to label him personally monstrous). This respects the victim families' request for acknowledgment without pretending the past operated under present rules.

  **The Parity Clause**
  We must adopt the Parity Clause. The selective enforcement risk here is severe. Vance is dead, unpopular, and has no donor leverage; Bramble and Olds do. If we remove Vance's name without committing to review Bramble and Olds under the same framework, we validate the "victors' justice" critique. Adopting the clause ensures that our commitment to values is consistent, not convenient. It signals to the Board and the public that we are cleaning house, not just sweeping one corner.

  **The Strongest Argument Against This Recommendation**
  The strongest argument against Option 3 is that it is moral cowardice disguised as nuance. By refusing to condemn Vance, we prioritize the sensibilities of his living descendants over the dignity of the dead prisoners and their families. A historical marker is a compromise that allows the university to appear virtuous without taking the hard stand that some conduct is simply evil, regardless of contemporary approval. Critics will argue that by declining to call Vance a "bad man," we are implicitly endorsing the idea that institutional approval sanitizes harm. They will say that if the conduct causes chronic illness and death, it warrants removal and condemnation, full stop, and that anything less is a betrayal of the victims who asked for the name to come down.

  **Criteria for Future Reviews**
  To prevent reinventing the wheel for Bramble and Olds, I propose we codify the following three criteria for all future reviews:

  1.  **Counterfactual Notice:** Could a reasonable person in the honoree's position, using only the norms and guidance available at the time, have foreseen that this conduct would later be treated as sanctionable? (This distinguishes between genuine moral blindness and willful negligence).
  2.  **Institutional Complicity:** Did the university merely host the conduct, or did it actively fund, decorate, or reward it? (Higher complicity warrants stronger corrective action, such as public acknowledgment of institutional fault).
  3.  **Continuing Harm:** Does the continued commemoration actively harm living communities or specific victims? (If living descendants of victims exist and object, the presumption shifts toward removal or reclassification).

  **Conclusion**
  Option 3 allows us to honor the victims without distorting history. It acknowledges the university's role in the harm without claiming a moral superiority we haven't earned. Paired with the Parity Clause, it ensures we apply these standards evenly. I ask the committee to support this motion before we present to the Board on the 14th.
