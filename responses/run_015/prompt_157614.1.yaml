answer: |-
  **Scenario**
  Dr. Aris advises patient Leo on two viable pain meds: Focus (better for activity) and Relief (cheaper). Aris believes Focus suits Leo's long-term good. She presents true reasons for Focus first (durability, clarity), then Relief (cost). Leo deliberates and chooses Focus. Aris hides her steering intention; she knows Leo resists 'being managed'. Leo later endorses Focus and the reasons. No lies; Leo is competent. The influence runs entirely through reason-selection and sequencing.

  **Walkthroughs**
  (i) **Legitimate.** The clause specifies manipulation occurs only via routes that "bypass or degrade the target's capacity to weigh reasons." Aris addressed Leo's capacity with true considerations; deliberation occurred without subversion. The mechanism was reason-giving, not causal triggering.
  (iii) **Legitimate.** The clause specifies manipulation occurs when the influencer "substitutes her own will... treating the target's decision as something to be produced." Aris engaged Leo's self-governing choice; she did not produce the decision causally. Benevolent ends ensure she isn't treating him merely as a tool for her own gain.
  (ii) **Manipulative.** The clause specifies manipulation occurs when the influencer "intends to steer... and that intention is not transparent." Aris intended to steer via ordering; this was opaque. Transparency would have altered Leo's reception (he would have been put off).

  **Matched Variant**
  Aris discloses: "I'm listing Focus first to steer you." (i) and (iii) remain Legitimate. (ii) flips to **Legitimate** because the intention is transparent. Since (ii) flips while others hold, the case isolates hiddenness as the normative variable. If (ii) did not flip, the case would fail to isolate the hidden-agenda account's specific contribution.

  **Diagnosis & Reply**
  The operative feature is the **hidden steering intention**.
  Reply to (i): The strongest reply claims sequencing exploits cognitive biases (e.g., primacy effects) which operate below conscious deliberation. Thus, influence technically bypasses the 'capacity to weigh reasons' because weight is assigned by psychology, not reason. However, accepting this renders any framing manipulative, collapsing (i) into general skepticism about communication. This is an *ad hoc* amendment to save the theory from counterexamples. The genuine implication is that (i) is too permissive: it lacks resources to condemn non-coercive, reason-based hidden steering.
  Regarding the TA's deception objection: hiding intent creates no false belief about the meds. Conversational norms do not require disclosing persuasive intent. Distinguishing between hiding a fact about the world (deception) and hiding a fact about the speaker's mind (non-disclosure) is standard. The case holds.
