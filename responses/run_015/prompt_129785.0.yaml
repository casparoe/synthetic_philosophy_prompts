answer: |-
  **Sarah**

  The call came while I was packing the bag. Not the hospital bag—the one for the storage unit. The voice on the line was polite, automated, but the number was familiar. The debt collector. My debt. From before Elias, before the diagnosis, before the idea that my skull could become a vessel for someone else's history.

  "It's regarding the outstanding balance," the recording said.

  I looked at Elias. He was sitting on the edge of the bed, folding Leo's sweaters. Leo is his brother, non-verbal, twenty-eight years old, entirely dependent on Elias's disability checks and daily care. Elias was folding them with a precision that felt like a告别.

  "If I'm not me," I said, hanging up the phone, "does the debt disappear?"

  Elias didn't look up. "The body signs the forms, Sarah. The body has the credit history. The bank doesn't care about the metaphysics."

  "But I care. I'm the one who took the loan. If forty percent of me is wiped out to make room for your... what did you call it? Your 'causal continuum'..."

  "Patterns," he said. "Just patterns."

  "Don't do that." I walked over and took the sweater from his hands. It smelled of his medication, a sweet, chemical decay. "You talk about patterns like they're weather. I'm talking about extinction. You get to keep going. I'm the one who stops. You say there is no self to lose, but I am the one feeling the loss. I am the one who knows what it feels like to be Sarah. When I wake up in that bed after the transfer, how much of that feeling will be mine? And if it's not mine, who pays for the loan? The ghost in the machine?"

  He finally looked at me. His eyes were clouded, the neurodegeneration taking the edges first. "You think the fear proves the self. It doesn't. It proves there is a mechanism that prefers continuity. That mechanism is in me too. But Sarah, if you hold onto the 'I' so tightly, you suffer twice. Once now, and once when you realize there was nothing to hold."

  "That's not comfort," I said. "That's erasure. You're asking me to let you walk over my grave and call it a bridge."

  **Elias**

  She thinks I don't feel the weight of it. She thinks because I don't believe in a soul, I don't believe in consequence. But I see the ledger. I see Leo. I see the manuscript on the desk, the final chapter unwritten, the argument unfinished. If the process stops, the work stops. If the process continues in her body, the work continues.

  I wanted to tell her that I loved her enough to become her. That was the logic of the transfer. But I couldn't say it. To say "I will become you" implies an 'I' that travels. There is no traveler. There is only the walking.

  "The consent form," I said. "It assigns guardianship of Leo to the recipient."

  "Because I'm the wife," she said. "Not because I'm me."

  "Because the state needs a signature."

  "And if I wake up and I don't want Leo? If the mix is wrong? If your sixty percent overwhelms my forty and I look at Leo and see a stranger's burden?"

  "Then the state intervenes."

  "You're betting on a convention," she said. "You're betting that the law won't notice the person changed. But I will notice. I'm in here." She tapped her temple. "I'm the one who has to carry your brother. I'm the one who has to carry my debt. You get the relief of dying without dying. I get the labor of living without living."

  I couldn't argue with that. She was right. The metaphysics didn't distribute the load. The law did. The law assumed a continuity of personhood that I knew was false, but upon which everything depended. If I told the court that the woman signing the guardianship papers was only partially the woman who married me, they would take Leo. If I told the bank the debtor was attenuated, they would garnish the account.

  So I had to lie. Or rather, I had to let the lie stand. I had to treat her fear as a misunderstanding rather than a valid protest against a forced merger. It was the only way to save Leo. It cost me the truth. It cost me the ability to tell her that I was sorry for taking her life to extend my work. Sorry isn't a word that fits in a bundle theory. There was no one to be sorry, and no one to receive it. Just causes and conditions colliding.

  **Sarah**

  The induction room was cold. They didn't use needles for the transfer; it was a field, a resonance. They said it felt like falling asleep in a moving car.

  I held Elias's hand. His grip was weak.

  "Tell me you know I'm scared," I said.

  "I know," he said.

  "Tell me it matters."

  "It matters," he said. But his eyes were distant, looking at the machinery, looking at the process. He wasn't looking at me. He was looking at the continuity of the project.

  "I'm not a vessel, Elias."

  "You're the ground," he said. "The ground doesn't vanish when the building changes."

  "The ground gets dug up."

  The technician asked us to confirm the ratio. Sixty-forty. Elias to Sarah.

  "Ready?" the technician asked.

  I looked at Elias. I wanted him to beg me to stop. I wanted him to admit that this was a violation. Instead, he squeezed my hand, a pulse of data, and nodded. He was ready to cease. I was the one who had to remain.

  As the hum started, I felt a thinning. Not a pain, but a dilution. Like ink dropping into water. I tried to hold onto the memory of the debt collector's voice, the smell of the sweaters, the anger. I tried to keep them mine. But the field was wide, and it was pulling things in. His memories of Leo. His frustration with the manuscript. They weren't invading; they were just arriving, like mail delivered to a house where the owner had changed.

  I closed my eyes. I hoped I would wake up angry. I hoped I would wake up Sarah.

  **[Post-Transfer]**

  The light through the blinds is too bright. That hasn't changed. The body knows the angle of the sun before the mind names it.

  I sit up. The movement is fluid, but there is a hesitation in the left hand, a tremor that wasn't there before. Or maybe it was. Memory is a layering of sediments. I touch the bedside table. There is a glass of water. I drink it.

  The phone rings. It's the bank.

  "This is regarding the account ending in four-zero-nine," the voice says. My voice. Or the voice of the body.

  "I'm aware," I say. The words come easily. "I'm restructuring the payment plan."

  There is a pause on the line. "Ms. Vance? You sound... different."

  "Recovery takes time," I say. "But the obligation stands."

  It does. The debt is tied to the social security number, the body, the signature. It doesn't matter that the mind speaking is a composite. The bank requires a payer. I am the payer. I feel the weight of the number in my head, the interest rate, the monthly deduction. It feels like mine. But there is also a familiarity with the architecture of the debt that feels borrowed. I know how to negotiate this because she knew how to negotiate this. I know why it must be paid because he knew the value of stability.

  After the call, I walk to the desk. The manuscript is open. Chapter Twelve. The argument about structural integrity. I read the last paragraph he wrote. I know exactly what comes next. The sentence forms in my head before I reach for the keyboard. It is not a struggle. It is a resumption.

  *The load-bearing wall is not a single stone,* I type. *It is the mortar between them.*

  I stop. Did I think that? Or did he?

  Leo comes in at ten. He doesn't speak. He stands in the doorway, watching. He is looking for his brother. He is looking for his sister-in-law. He sees a person sitting at the desk.

  I turn the chair. "Morning, Leo."

  He tilts his head. He walks over and touches my arm. He is checking for warmth, for recognition. I feel a surge of protectiveness that is sharp and specific. It belongs to the history of caring for him, the routine of the meds, the fear of the state taking him away. That fear is heavy. It sits in the chest.

  "Breakfast?" I ask.

  He nods.

  We go to the kitchen. I make the eggs the way she liked them. Scrambled, soft. I pour the juice the way he liked it. No pulp. I move around the kitchen without thinking. The body knows the layout. The mind knows the preferences.

  I sit down. Leo eats. I watch him.

  There is a moment, just before I lift my fork, where I catch my reflection in the microwave door. The face is hers. The eyes are hers. But the expression is neutral, waiting.

  "I need to go to the storage unit later," I say. "To finish the packing."

  Leo looks up.

  "For the project," I add. "And the clothes."

  I use the word "I" without stumbling. It slides out, smooth and unexamined. It claims the debt. It claims the brother. It claims the manuscript. It claims the body.

  There is no one inside to object. There is no court that can hear the case of who owns this pronoun. The law accepts it. The brother accepts it. The bank accepts it.

  I eat the eggs. They taste like salt and fat. I feel hunger. I feel the sun on the back of my neck.

  "We should go," I say.

  Leo stands. I stand. I pick up the keys. They are heavy in my hand. I walk to the door. I open it. I step out into the hallway, into the day, into the name on the mailbox.

  I lock the door behind me.
