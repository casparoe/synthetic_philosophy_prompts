answer: |-
  # Diagnostic Handout: Dispositions and Conditionals
  **Graduate Reading Group | Metaphysics Department**

  **Instructions:** This instrument consists of ten concrete scenarios. For each, select the response that best matches your judgment about the case. Do not select an answer based on which theory you *think* you hold; select the answer that reflects your actual intuition about the description. The scoring key maps patterns of judgment to theoretical commitments.

  ***

  ### The Quiz

  **1. The Standard Drop**
  A standard wine glass is wrapped in thick foam and dropped from five feet onto concrete. The foam absorbs the impact, and the glass does not break.
  *   **A.** The glass was not fragile in this instance, because it did not break.
  *   **B.** The glass was fragile, but the foam prevented the manifestation.
  *   **C.** The glass was fragile to a degree, but the context makes "fragile" an imprecise label here.

  **2. The Wizard's Wire (Classic Fink)**
  A wire is touched by a conductor. At the exact moment of contact, a wizard instantly and permanently removes the wire's conductivity, so no current flows. The wire never conducts.
  *   **A.** The wire was not conductive, because it did not conduct when touched.
  *   **B.** The wire was conductive, possessing an intrinsic nature that was removed before it could act.
  *   **C.** Whether it was conductive depends on whether we are tracking its initial state or its final outcome.

  **3. The Antidote Pill (Classic Mask)**
  A person swallows a lethal poison. Simultaneously, they swallow a perfect antidote that neutralizes the poison immediately within the stomach. The person does not die.
  *   **A.** The pill was not poisonous, because it did not cause death.
  *   **B.** The pill was poisonous, but its power was masked by the antidote.
  *   **C.** The pill was poisonous relative to the biology, but not relative to the total situation.

  **4. The Hardness Mimicker**
  A synthetic stone scratches a diamond. It does so not because of its own lattice structure, but because a hidden internal heater softens the diamond surface upon contact. The stone itself is soft.
  *   **A.** The stone is hard, because it successfully scratches the diamond.
  *   **B.** The stone is not hard, because the manifestation did not arise from its intrinsic structure.
  *   **C.** The stone is hard enough for this purpose, regardless of the mechanism.

  **5. The Silicon Swap (Basis-Swap)**
  A human brain is replaced, neuron-for-neuron, with silicon chips that replicate the exact same causal inputs and behavioral outputs. The person behaves identically.
  *   **A.** The person retains the same mental dispositions, as the functional role is unchanged.
  *   **B.** The person has different dispositions, because the categorical basis (biology vs. silicon) is different.
  *   **C.** The question assumes "disposition" refers to a robust property, which is misleading.

  **6. The Probabilistic Demon (Probabilistic Fink)**
  A radioactive atom has a 50% chance of decaying in the next hour. A demon monitors the atom; if it detects the onset of decay, there is a 50% chance the demon removes the atom's radioactive property before decay completes.
  *   **A.** The atom's disposition to decay fluctuates depending on whether the demon intervenes.
  *   **B.** The atom has a stable disposition to decay, though the manifestation is probabilistic and interfered with.
  *   **C.** The disposition ascription is only useful for calculating risk, not describing the atom.

  **7. The Dry Universe (Impossible Stimulus)**
  A salt crystal has the intrinsic microstructure of normal salt. However, it exists in a universe where the laws of physics prevent water from ever existing (the stimulus is nomologically impossible).
  *   **A.** The salt is not soluble, because the conditional "if immersed, it would dissolve" cannot be evaluated.
  *   **B.** The salt is soluble, because solubility is an intrinsic nature independent of the stimulus's availability.
  *   **C.** Calling it "soluble" is true only as a shorthand for its microstructure, not a real property.

  **8. The Self-Neutralizing Bomb (Self-Triggering Mask)**
  An explosive device is designed to detonate upon touch. However, the touch sensor is linked to a mechanism that instantly disperses the explosive material harmlessly the moment touch is detected. It never explodes.
  *   **A.** The device is not explosive, because it cannot explode when touched.
  *   **B.** The device is explosive, but its trigger activates a mask.
  *   **C.** The device is explosive in design but not in operational capacity.

  **9. The Single-Track Object**
  An object reacts violently to Stimulus X. Under any other stimulus (Y, Z, heat, pressure), it remains completely inert and does nothing. It has no other effects.
  *   **A.** The object has a disposition only for Stimulus X, and no other causal powers.
  *   **B.** The object has a broad power that is simply only sensitive to Stimulus X.
  *   **C.** Describing it as having a "power" adds nothing to the description of its reactions.

  **10. The Prediction Game**
  Two scientists argue over whether a bridge is "stable." One says, "It will hold." The other says, "It has the property of stability." The bridge holds.
  *   **A.** Both said the same thing; "property of stability" just means "it will hold."
  *   **B.** The second scientist made a deeper claim about the bridge's constitution that happened to be true.
  *   **C.** The second scientist's claim is only meaningful insofar as it supports the prediction.

  ***

  ### Scoring Key

  To determine your theoretical leaf, tally your responses according to the three clusters below. Your profile is defined by which cluster you favor in **Diagnostic Questions** (4, 5, 6, 7) and how you resolve **Standard Cases** (1, 2, 3).

  **Cluster A (Conditional/Behavioral):** Answers 1A, 2A, 3A, 4A, 7A.
  **Cluster B (Intrinsic/Realist):** Answers 1B, 2B, 3B, 4B, 7B.
  **Cluster C (Pragmatic/Contextual):** Answers 1C, 2C, 3C, 4C, 7C.

  *Note: Questions 5, 6, 8, 9, 10 refine the specific leaf within the cluster.*

  #### 1. The Simple Conditional Analysis (SCA)
  *   **Pattern:** Strong Cluster A. Specifically: 2A (Fink), 3A (Mask), 4A (Mimicker).
  *   **Commitment:** Disposition ascriptions are equivalent to simple counterfactual conditionals. If the manifestation fails, the disposition is absent.
  *   **Unnamed Region (SCA + Mimicker Rejection):** If you answer 2A (Fink) but 4B (Mimicker), you occupy an **Unnamed** region. This view is **incoherent**: you cannot claim the conditional is the analysis (2A) while denying the disposition when the conditional is satisfied by a mimicker (4B).

  #### 2. Revised Conditional Analysis (RCA)
  *   **Pattern:** Cluster B on Standard Cases (1B, 2B, 3B), but Cluster A on Advanced Cases (4A or 7A). Specifically: Accepts Finks/Masks have dispositions (2B, 3B) but denies Mimickers have dispositions (4B) *because* the conditional proviso fails.
  *   **Commitment:** Dispositions are conditionals supplemented by "fink-free" and "mask-free" provisos.
  *   **Unnamed Region (RCA + Identity):** If you answer 2B/3B (RCA) but 5B (Identity), you occupy an **Unnamed** region. This view is **merely unattractive**: it combines a functional analysis of dispositions with a constitutional ontology, creating tension regarding multiple realizability.

  #### 3. The Causal-Basis View
  *   **Pattern:** Strong Cluster B. Specifically: 4B (Mimicker), 5A (Swap = Same Disposition), 7B (Impossible Stimulus = Soluble).
  *   **Commitment:** To have a disposition is to have an intrinsic property that *would* cause the manifestation, absent interference. The disposition is distinct from, but grounded in, the basis.
  *   **Distinction:** Separated from Identity View by Q5 (A vs B).

  #### 4. The Identity View
  *   **Pattern:** Strong Cluster B. Specifically: 4B (Mimicker), 5B (Swap = Different Disposition), 7B (Impossible Stimulus = Soluble).
  *   **Commitment:** The disposition *is* the categorical basis. If the microstructure changes, the disposition changes, even if the causal role is identical.
  *   **Distinction:** Separated from Causal-Basis by Q5 (B vs A).

  #### 5. The Primitivist / Powers Ontology
  *   **Pattern:** Strong Cluster B. Specifically: 4B, 5A or 5B (Flexible on swap), 7B. Distinguished by Q10 (Answer B).
  *   **Commitment:** Dispositions are fundamental properties. Conditionals are merely symptoms.
  *   **Distinction:** Hard to separate from Causal-Basis/Identity on cases alone. See "Indistinguishable Leaves" below.

  #### 6. The Interventionist / Difference-Making Account
  *   **Pattern:** Mixed Cluster B/C. Specifically: 6C (Probabilistic Fink = Risk), 9C (Single-Track = Description), 10C.
  *   **Commitment:** Disposition ascriptions are about what variables can be manipulated to change outcomes, not about intrinsic properties.
  *   **Unnamed Region (Interventionist + Realist):** If you answer 6C (Interventionist) but 5B (Identity/Realist), you occupy an **Unnamed** region. This view is **simply unexplored**: it combines an anti-realist methodology with a realist ontology.

  #### 7. The Gradable / Context-Relative Account
  *   **Pattern:** Strong Cluster C. Specifically: 1C, 3C, 8C.
  *   **Commitment:** Disposition ascriptions are vague, context-sensitive, or come in degrees. There is no fact of the matter in edge cases.
  *   **Unnamed Region (Gradable + SCA):** If you answer 1C (Gradable) but 2A (SCA), you occupy an **Unnamed** region. This view is **incoherent**: you cannot claim truth is context-relative (1C) while insisting on a strict binary conditional truth-value (2A).

  #### 8. The Deflationary View
  *   **Pattern:** Strong Cluster C. Specifically: 5C, 7C, 10A or 10C.
  *   **Commitment:** Disposition ascriptions are inference tickets. They lack robust truth conditions and serve only to license predictions.
  *   **Distinction:** Separated from Gradable by Q10 (Deflationary denies truth-aptness; Gradable accepts it but makes it degree-relative).

  ***

  ### Indistinguishable Leaves & Diagnostic Limits

  This instrument cannot fully separate the following pairs based on case judgments alone. This is due to the fact that these views often agree on the *truth value* of the cases but disagree on the *metaphysical explanation*.

  **1. Causal-Basis View vs. Identity View**
  *   **Problem:** Both views are realist and intrinsic. They agree on Finks, Masks, and Mimickers. They only diverge on the *Basis-Swap* (Q5). However, a proponent of the Identity View could argue that the "functional role" *is* the categorical property in the swap case, collapsing the distinction.
  *   **Further Question Required:** "Is it possible for two objects to have the *exact same* categorical properties but *different* dispositions?"
      *   *Identity:* No (Dispositions supervene on categoricals).
      *   *Causal-Basis:* Yes (If the causal laws relating the categorical to the manifestation differ).
  *   **Why cases fail:** Concrete cases usually fix the laws of nature. To separate these, you must vary the laws while holding the object constant, which is difficult to phrase as a concrete intuition pump without begging the question.

  **2. Revised Conditional Analysis (RCA) vs. Powers Ontology**
  *   **Problem:** On almost all test cases (Finks, Masks, Mimickers), RCA and Powers yield the same verdict (e.g., "The wire is conductive," "The mimicker is not hard"). RCA says the conditional holds *ceteris paribus*; Powers says the power exists regardless.
  *   **Further Question Required:** "Which explains which? Does the object manifest *because* it has the power, or does it have the power *because* it would manifest?"
      *   *Powers:* Manifestation is because of Power.
      *   *RCA:* Power is analysis of Manifestation conditions.
  *   **Why cases fail:** This is a dispute about metaphysical priority and direction of fit, not about the truth conditions of the cases themselves. No case description can force a respondent to choose an explanatory direction.

  **3. Deflationary vs. Gradable**
  *   **Problem:** Both views reject robust, binary, context-independent truth conditions. In Q1 and Q7, both may select Option C.
  *   **Further Question Required:** "Is the statement 'The glass is fragile' truth-apt?"
      *   *Gradable:* Yes, but its truth value is a matter of degree or context.
      *   *Deflationary:* Only in a minimal sense; it is primarily an assertion of willingness to infer.
  *   **Why cases fail:** Concrete cases elicit judgments about *what is the case*, not judgments about *semantic status*. A respondent can treat a gradable property as a deflationary inference ticket without contradiction in a quiz format.
