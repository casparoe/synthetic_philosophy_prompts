answer: |-
  Here is the spec for a theory of permissible insect killing, structured by the constraints it must satisfy to handle your cases and distinctions.

  ### The Desiderata

  **1. The Sentience Precaution Principle**
  *   **Requirement:** The theory must assign moral weight to insects *now*, based on the probability of sentience, rather than waiting for conclusive neuroscientific proof. It must specify a decision rule for acting under radical uncertainty (e.g., a weighted expected value or a lexical threshold).
  *   **Case/Consideration:** *Malaria mosquitoes vs. day-old chicks.* If we wait for proof of sentience, we risk committing mass torture; if we assume full human-equivalent sentience, we risk mass human starvation. The theory must navigate the "error costs" of being wrong in either direction without defaulting to "zero weight."
  *   **Status:** **Non-Negotiable.** (Your 3rd candidate).

  **2. The Non-Replaceability Constraint**
  *   **Requirement:** The moral cost of killing cannot be discounted by the short natural lifespan of the individual or the speed of population turnover. Death is a harm distinct from "time lost."
  *   **Case/Consideration:** *The Standing-Crop Worry.* If short lifespan justified killing, it would permit the culling of day-old male chicks in the egg industry or "humanely" killing toddlers because they haven't lived long yet. The theory must block the "they die anyway" argument.
  *   **Status:** **Non-Negotiable.** (Your 1st candidate).

  **3. The Discrimination Requirement**
  *   **Requirement:** The theory must distinguish morally between methods that target specific agents and those that inflict harm indiscriminately. Collateral damage to non-target insects (pollinators, predators) must be counted separately from the target pest.
  *   **Case/Consideration:** *Spraying vs. Screening.* Broad-spectrum insecticides on a crop (aphids) kill vastly more non-targets than targets. A theory that only counts "pests killed" greenlights ecological collapse. The bodycount must include the uncountable bystanders.
  *   **Status:** **Non-Negotiable.**

  **4. The Least-Harmful-Means Condition**
  *   **Requirement:** Lethal control is permissible only if non-lethal or suppressive alternatives (displacement, sterilization, exclusion) are ineffective or disproportionately costly.
  *   **Case/Consideration:** *Termites in the floor vs. Wasps by a playground.* You can screen windows (exclusion) or use sterile-male releases (suppression). If screening stops the malaria mosquito, spraying is impermissible. The method axis is not neutral; less destructive methods are lexically prior.
  *   **Status:** **Non-Negotiable.**

  **5. The Dynamic Consistency Constraint**
  *   **Requirement:** The theory cannot rely on static population headcounts to justify harm if the intervention itself alters the future population structure (density compensation, resistance, evolutionary pressure).
  *   **Case/Consideration:** *The Moving-Target Worry.* If you justify spraying aphids by claiming you "saved 1 million plants," but the spraying causes resistant aphids to boom next season, your calculus is retroactively falsified. The theory must account for the feedback loop between the moral act and the biological system.
  *   **Status:** **Preference.** (Your 2nd candidate). *Reasoning:* While metaphysically sound, this makes application nearly impossible for agents in real-time. It is a constraint on *ideal* theory, but demanding it for *practical* permissibility may paralyze all action.

  ---

  ### Evaluation of Your Candidates

  1.  **Standing-Crop:** **Real.** This is a standard deontological objection to utilitarian replaceability arguments. It is non-negotiable if you want to avoid the "day-old chick" conclusion.
  2.  **Moving-Target:** **Real, but technically debilitating.** It is a valid critique of consequentialism (specifically the Non-Identity Problem applied to ecology), but marking it non-negotiable might make the theory unusable. I have listed it as a Preference for that reason, though a strict theorist would demand it.
  3.  **Uncertainty:** **Real.** This is the gatekeeper. Any theory that assumes insects are insentient automatons fails before it starts.

  ### Structural Conflicts

  *   **The Single Biggest Knockout:** **The Sentience Precaution Principle.** This eliminates **Hard Speciesism** (which assumes zero moral status) and **Naive Act Utilitarianism** (which often treats uncertainty as zero weight to keep the math clean). It forces the theory to engage with risk ethics before it engages with entomology.
  *   **The Incompatible Pair:** **The Non-Replaceability Constraint (Individual Standing)** and **Population Eradication (Invasive Species/Gene Drive).** If an individual insect has a right not to be killed that survives its short lifespan (Constraint 2), then *eradicating* a species (even invasive ants on an island) becomes morally equivalent to genocide, regardless of the ecological benefit. You cannot jointly satisfy a strong individual right-to-life for insects and a permission to use gene drives to wipe out a population. One must yield: either individuals are expendable for population goals, or eradication is impermissible.

  ### Which View Fails Worst?

  **Naive Act Utilitarianism** performs the worst against this spec. It collapses the **Standing-Crop** distinction (treating a killed insect as merely a subtraction of future utility, which is low due to short lifespan), it ignores the **Moving-Target** problem (assuming static consequences), and it struggles with the **Sentience Precaution** (often assigning arbitrary low weights to insect pain to make the numbers work). It is uniquely ill-equipped to handle the *method axis*, as it would happily endorse broad-spectrum spraying if the immediate crop yield outweighs the diffuse, long-term ecological harm, failing the **Discrimination Requirement**.
