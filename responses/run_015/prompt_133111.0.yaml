      *Refining the "Incompatible Pair":* The tension between *Individual Moral Status* (required for Standing-Crop) and *Population-Level Intervention* (required for Gene Drives/Invasive Species). If individuals matter, wiping out a population (even invasives) is genocide. If populations matter, individuals are expendable. This is the core tension.

