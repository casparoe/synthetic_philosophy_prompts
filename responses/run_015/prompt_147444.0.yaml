answer: |-
  ### Reasoning Outline

  1.  **Core Tension:** Identify the conflict between *epistemic accuracy* (what happened according to evidence) and *normative cohesion* (what the community needs to believe to function).
  2.  **Scenario Construction:** Create a local event (labor accord) where the myth supports current social structures (housing cooperative) and the truth undermines them.
  3.  **Forcing Mnemonic Sovereignty (MS):** Make the archival evidence existentially threatening to the community's current projects, so preserving the community seemingly requires destroying the evidence.
  4.  **Forcing Corrective Historicism (CH):** Design the correction method as an external imposition that triggers psychological reactance, causing the community to reject history entirely rather than update their beliefs.
  5.  **Analysis:** Define both positions within the context, explain the logical moves each makes in the scenario, isolate the structural feature causing CH's self-defeat (imposition vs. integration), test whether removing that feature simplifies the conflict, and offer a charitable critique from the MS perspective regarding the necessity of destruction.

  ### The Scenario

  In the centennial planning for the Oakhaven Mill Accord, the town council uncovers ledgers proving the celebrated 1924 labor peace was actually bought by silenced injury claims that bankrupted three local families. The Mnemonic Sovereignty faction argues that releasing this data will dissolve the intergenerational trust required for the town's current housing cooperative, necessitating the shredding of the ledgers to preserve the functional truth of the Accord as a binding social contract. Meanwhile, the Corrective Historicism faction mandates an immediate, statewide educational campaign labeling the Accord a "Lie," which causes locals to barricade the museum and reject all historical signage as colonial interference, cementing the false narrative as an article of faith against outsiders and severing their engagement with the archival past entirely.

  ### Analysis

  **Positions and Motivations**
  In this context, **Mnemonic Sovereignty** is the view that a group's lived memory should govern all public commemoration, and that outside correction is a form of epistemic violence. In the scenario, this position defends destruction not out of malice, but out of functional necessity: the "Accord" is not just a story about the past, but the foundational norm for the current housing cooperative. If the Accord is revealed as a fraud, the trust underwriting the cooperative collapses. Therefore, destroying the ledgers is framed as protecting the community's viability. **Corrective Historicism** is the view that the historical record should always correct collective memory, even when imposed by external experts. Here, this position mandates the "Lie" campaign to uphold epistemic integrity. However, by treating memory as a data error to be fixed via mandate rather than a social structure to be engaged, the policy triggers a defensive reaction.

  **The Structural Feature of Self-Defeat**
  The specific structural feature that makes Corrective Historicism self-defeating here is **unidirectional imposition without epistemic integration**. CH assumes that providing accurate information automatically updates collective memory. However, collective memory is tied to identity. When the correction is imposed externally (statewide campaign) and aggressively (labeling it a "Lie"), it activates identity defense mechanisms. The community does not process the information as "learning"; they process it as "attack." Consequently, they consolidate around the false memory to protect their identity from the outsider, resulting in *greater* alienation from the archival past than before the intervention. The correction fails to correct; it entrenches the error.

  **The Removal Test**
  If we remove the feature of **unidirectional imposition**—for example, if the historians facilitated a community-led dialogue about the ledgers rather than mandating a statewide campaign—the case collapses back into a standard "truth versus belonging" standoff. In that revised scenario, the community might still choose to prioritize the myth, or they might integrate the truth painfully but constructively. The self-defeating loop (correction → alienation → entrenched falsehood) depends entirely on the *method* of correction being hostile to the community's agency. Without that hostility, CH becomes a standard appeal to truth, and MS becomes a standard appeal to cohesion, without the paradoxical outcome where seeking truth destroys access to truth.

  **A Charitable Critique from Mnemonic Sovereignty**
  A sophisticated defender of Mnemonic Sovereignty would object to the framing that sovereignty *requires* physical destruction. They would argue that the scenario presents a false dichotomy between "destroy the records" and "submit to external correction." A robust mnemonic sovereignty could argue for **normative containment**: the ledgers should be preserved in the archive but denied commemorative status. They might say, "We do not need to shred the evidence to deny it authority over our identity." By forcing the MS position to defend shredding, the scenario conflates *sovereignty over meaning* with *control over evidence*. The MS defender would argue that epistemic violence occurs not because the records exist, but because the external experts demand those records override the community's right to determine what values their history serves. They could maintain their position without destroying the artifacts, merely by refusing to let the artifacts dictate the community's moral landscape.
