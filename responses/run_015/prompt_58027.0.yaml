      *   *What had to be fudged:* In video, there is a definitive "output" event (pixel voltage change). In the brain, there is no single "render" call. There's no frame buffer that consciousness reads.
      *   *What has no counterpart:* Qualia (the feeling of seeing red). The "Observer" problem. In video, the engineer knows where the signal ends. In the brain, there is no homunculus watching the screen.
      *   *Verdict:* The user is right (indistinguishable) *but* the friend is also right (functional difference exists). The engineering model reveals why the debate is often a category error, but also why the friend's intuition about "correction" feels real.

