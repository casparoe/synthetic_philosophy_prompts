      *   *Stalinesque:* "Ingest-side buffering." Wait for the full GOP (Group of Pictures) before decoding.
      *   *Orwellian:* "Client-side patching." Render the I-frame, then receive a P-frame that changes the interpretation of the previous I-frame's motion vectors. Or, more accurately, DOM updates in captions.
