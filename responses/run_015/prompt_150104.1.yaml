      Look, I'll grant you the survey numbers because I've seen those curves myself in the sherd counts and site maps, but you're smuggling a value judgment into your definition of society that I can't accept from the bottom of a trench. Your differentiation definition is the one doing the illegitimate work here because it equates the health of a society with the complexity of its superstructure, assuming that eleven pottery fabrics and a tiered settlement hierarchy are goods in themselves rather than costs. When I dig the ordinary houses, I see that those eleven fabrics often mean ten extra layers of extraction to support a capital nobody down at the village level ever saw, and if your bioarchaeology says people are healthier and less worked to death after the change, then the society—the actual people—didn't collapse, it shed a parasite. You're defining the host by the parasite's complexity.

