  2. SIA ($\alpha=1$) assigns a likelihood weight proportional to $N$, effectively treating the number of observers as a detection probability that increases with population size. Introducing $\beta$ shifts the effective exponent to $\alpha + \beta - 1$, meaning if reflective capacity saturates ($\beta < 1$), the Presumptuous Philosopher's leverage over large $N$ hypotheses diminishes proportionally. Here $\alpha$ occupies the slot of a design parameter despite the absence of a design, while $\beta$ acts as a detectability covariate correlated with density.

