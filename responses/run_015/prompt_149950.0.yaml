answer: |-
  # Research Prospectus: Meta-Normative Wrong-Kind Reasons and the Selection of Normative Frameworks

  **Student Name:** [Name]
  **Course:** [Course Name/Code]
  **Date:** [Date]
  **Word Count Target:** Approximately 6,000 words

  ## Abstract

  The distinction between 'right-kind' and 'wrong-kind' reasons (WKR) has become a central fixture in contemporary meta-ethics and value theory. Traditionally, this distinction is employed to resolve puzzles regarding the fittingness of attitudes: for instance, while a demon's threat provides a reason to admire him, it does not make him admirable. Such analyses, however, almost universally presuppose a fixed normative background against which these attitudes are measured. This proposal outlines a term paper that interrogates whether the WKR distinction applies at the level of normative framework selection itself. Can there be wrong-kind reasons for adopting consequentialism over deontology, or for retaining a particular conceptual taxonomy in ethics, in the same structural sense that there are wrong-kind reasons for belief or admiration? The project will examine whether the constitutive aims that generate wrong-kind reasons at the first-order level have analogues for framework choice. Testing this against three candidate domains—moral theory, epistemic policy, and aesthetic categorisation—the paper will evaluate whether the distinction collapses into pure instrumental rationality at the meta-level or survives with a modified account of theoretical virtue. This prospectus details the research question, contextualises the gap in current literature, outlines the methodological approach, and assesses the feasibility and scope risks of the project.

  ## 1. Introduction: The Wrong-Kind Reasons Problem and its Traditional Scope

  The problem of wrong-kind reasons (WKR) arises when an agent has a reason to hold a certain attitude towards an object, yet that reason does not seem to bear on the correctness or fittingness of the attitude itself. The canonical example, often attributed to discussions surrounding Pascal's Wager or later refined by philosophers such as Wlodek Rabinowicz and Toni Rønnow-Rasmussen, involves a demon who threatens to kill an agent unless they admire him. The threat provides the agent with a compelling pragmatic reason to bring about the state of admiring the demon. However, intuitively, this reason does not make the demon an object worthy of admiration. The reason is of the 'wrong kind' to constitute the admirability of the object, even if it is a valid reason to cultivate the attitude.

  Conversely, 'right-kind' reasons (RKRs) are those that bear directly on the constitutive aim or standard of correctness of the attitude in question. In the domain of belief, for example, the constitutive aim is widely held to be truth. Evidence that a proposition is true constitutes a right-kind reason for belief. Evidence that believing a proposition would make one happy constitutes a wrong-kind reason (often termed pragmatic or prudential reasons for belief). The WKR distinction is thus a tool for preserving the normative integrity of specific attitudes against the encroachment of external, instrumental pressures. It allows theorists to maintain that while one *ought* (prudentially) to admire the demon to save one's life, the demon is not *admirable*.

  This distinction has been rigorously analysed within the context of first-order attitudes: belief, desire, admiration, fear, and intention. The literature has focused heavily on the 'fitting-attitudes' analysis of value, where value is defined in terms of the reasons for pro-attitudes. A significant portion of the debate has concerned the 'extensional adequacy' of such analyses—ensuring that the definition of value does not accidentally include wrong-kind reasons as making an object valuable. Solutions have ranged from distinguishing between reasons for the attitude and reasons for the object's properties, to analysing the structural features of the reasons themselves.

  However, a critical limitation pervades this existing body of work. The analyses typically presuppose a fixed normative background. When discussing whether a reason for belief is of the right kind, it is assumed that the normativity of belief (truth) is already established. When discussing admiration, it is assumed that there is a stable concept of 'admirability' grounded in the properties of the object. The WKR distinction is treated as a mechanism for sorting reasons *within* an already-accepted normative framework. It operates as a filter for input into a system whose rules are taken as given.

  This proposal outlines a term paper that seeks to extend the WKR distinction 'upwards' to the meta-normative level. The central intuition driving this project is that agents do not merely hold attitudes within frameworks; they also select, adopt, or retain the frameworks themselves. An ethicist might choose to work within a consequentialist framework rather than a deontological one. A scientist might adopt a specific epistemic policy regarding risk and uncertainty. An art critic might categorise a work as 'tragic' rather than 'satirical'. These are normative choices that determine the background against which first-order reasons are weighed.

  If the WKR distinction is a fundamental feature of normativity, it ought to be scalable. It should not vanish simply because the attitude in question is the choice of a normative system rather than a first-order reaction to the world. Yet, current treatments leave this open. They analyse first-order attitudes against a background without asking whether the distinction survives when the attitude in question is the choice of the background itself. This project posits that failing to address this leaves a significant gap in our understanding of normative architecture. If there are no wrong-kind reasons for framework selection, then the choice of a moral or epistemic theory is purely a matter of instrumental rationality—choosing the tool that best satisfies one's pre-existing desires. If, however, the distinction survives, then there are 'right-kind' reasons for adopting a framework, grounded perhaps in theoretical virtues like coherence, explanatory power, or truth-tracking, which are distinct from the pragmatic benefits of holding that framework.

  The term paper will be approximately 6,000 words in length. It will proceed by first establishing the traditional WKR debate, then isolating the assumption of the fixed background. It will then propose a method for testing the distinction at the meta-level, applying this method to three specific domains: moral theory selection, epistemic policy adoption, and aesthetic categorisation. Finally, it will evaluate the possible outcomes—specifically, whether the distinction collapses or survives—and offer criteria for adjudicating between these outcomes. The project is conceptual in nature, requiring no empirical research or archival work, and is designed to be feasible within a one-semester timeline.

  ## 2. The Research Question: Meta-Normative Framework Selection

  The core objective of this term paper is to answer a precise meta-normative question. To ensure analytical rigour, the question must be stated with exactitude, distinguishing it from related but distinct inquiries in meta-ethics.

  **Primary Research Question:**
  *Can there be wrong-kind reasons for adopting a normative framework (such as consequentialism over deontology) or for retaining a particular conceptual taxonomy in ethics, in the same structural sense that there are wrong-kind reasons for first-order attitudes like belief or admiration?*

  This question contains several critical components that require unpacking within the paper.

  First, the phrase **'normative framework'** requires definition. In this context, a framework is not merely a set of rules, but a system of justification that determines what counts as a reason within a specific domain. For moral theory, the framework determines whether the rightness of an action is constituted by its outcomes (consequentialism) or its adherence to duty (deontology). For epistemic policy, the framework determines whether belief is regulated solely by evidence (evidentialism) or by pragmatic utility (pragmatism). The choice of framework is a higher-order attitude; it is an endorsement of a system of norms.

  Second, the phrase **'in the same structural sense'** is vital. It is not sufficient to show that there are bad reasons for choosing a framework. One might choose consequentialism because it is fashionable, which is a 'bad' reason. The question is whether it is a *wrong-kind* reason. A wrong-kind reason is structurally distinct from a right-kind reason. In the first-order case, the distinction is often cashed out in terms of the 'constitutive aim' of the attitude. If the distinction applies at the meta-level, there must be a structural difference between reasons that bear on the *correctness* of the framework (RKRs) and reasons that bear merely on the *benefits* of adopting the framework (WKRs), independent of its correctness.

  Third, the question asks about **'adopting... or retaining'**. This acknowledges that framework selection is not always a one-time conscious choice. Often, agents retain a framework through inertia or socialisation. The WKR analysis must apply to the maintenance of a framework just as it applies to the formation of a belief. If I retain a deontological framework solely because it protects my privileged status, is that a wrong-kind reason for retention?

  **Sub-Questions:**
  To answer the primary question, the paper will address three sub-questions:
  1.  Do normative frameworks possess 'constitutive aims' analogous to those of first-order attitudes (e.g., truth for belief)?
  2.  If such aims exist, do they generate a class of reasons that are structurally distinct from pragmatic reasons for framework adoption?
  3.  Does the WKR distinction collapse at the meta-level into a monistic account of instrumental rationality, or does it require a modified account of theoretical virtue?

  This line of inquiry distinguishes the project from standard debates in meta-ethics regarding the justification of moral theories. Typically, when philosophers argue for consequentialism, they argue that it is *true* or *correct*. When they argue against it, they claim it yields counter-intuitive results. This paper does not ask which moral theory is correct. Rather, it asks about the *structure of the reasons* involved in that debate. If a philosopher argues that we should adopt consequentialism because it makes us happier (a pragmatic claim), is that a wrong-kind reason? If the WKR distinction holds at this level, then pragmatic benefits are the wrong kind of reason to establish the *correctness* of the theory, even if they are valid reasons to *teach* or *promote* it.

  The significance of this question lies in its implications for normative authority. If the WKR distinction collapses at the meta-level, then the choice of a moral or epistemic system is ultimately pragmatic. There is no 'truth of the matter' regarding frameworks, only useful fictions. If the distinction survives, then frameworks are subject to normative constraints independent of their utility. They can be 'correct' or 'incorrect' in a way that transcends their instrumental value to the agent. This has profound implications for moral realism, epistemic normativity, and the nature of philosophical inquiry itself.

  ## 3. Literature Context: The Presupposition of a Fixed Background

  To justify the novelty of this project, it is necessary to demonstrate that current treatments of the WKR problem leave the meta-normative application open. The literature on wrong-kind reasons is extensive, stemming from the fitting-attitudes analysis of value. Key contributors include Wlodek Rabinowicz, Toni Rønnow-Rasmussen, Mark Schroeder, and Niko Kolodny.

  **The Fitting-Attitudes Analysis and the WKR Problem**
  The fitting-attitudes (FA) analysis defines value in terms of reasons for attitudes. For example, 'X is good' means 'There is sufficient reason to favour X'. The WKR problem emerged as a challenge to this analysis. If a demon threatens you to favour X, you have a reason to favour X. Does this make X good? Intuitively, no. Therefore, the FA analysis must distinguish between reasons that make X good (RKRs) and reasons that merely make favouring X prudent (WKRs).

  Rabinowicz and Rønnow-Rasmussen (2004) proposed distinguishing between reasons for the attitude and reasons for the object's properties. Schroeder (2010) and others have analysed the structural properties of the reasons themselves. However, a common thread unites these approaches: they all operate within a settled normative context. When they analyse 'admiration', they assume there is a fact of the matter about what is admirable. When they analyse 'belief', they assume the norm of truth is fixed.

  **The Fixed Background Assumption**
  The critical gap in this literature is the 'Fixed Background Assumption'. This is the tacit premise that the standards of correctness for the attitude are already established before the WKR analysis begins. For belief, the standard is truth. For admiration, the standard is the valuable properties of the object. The WKR distinction is used to sort reasons *relative* to these standards.

  Current treatments do not ask where these standards come from, nor do they ask if the WKR distinction applies to the *adoption* of these standards. For instance, in epistemology, evidentialists argue that one should only believe based on evidence. Pragmatists argue that belief can be justified by utility. This debate is often framed as a clash of normative theories. However, the WKR literature has not typically been brought to bear on this clash. If the WKR distinction applies here, then pragmatic reasons for adopting evidentialism would be 'wrong-kind' reasons for the *theory*, even if they are 'right-kind' reasons for the *belief* within the theory.

  **Meta-Ethical Justification vs. WKR**
  There is a related body of literature in meta-ethics concerning the justification of moral theories. Reflective equilibrium, coherentism, and foundationalism are methods for selecting moral frameworks. However, these discussions rarely utilise the specific terminology or structural insights of the WKR debate. They speak of 'intuitions', 'coherence', and 'explanatory power'. They do not typically ask whether 'explanatory power' is a right-kind reason for a moral theory in the same way 'evidence' is a right-kind reason for belief.

  By failing to apply the WKR distinction to framework selection, the literature leaves open the possibility that the distinction is merely a local feature of first-order psychology, rather than a global feature of normativity. If the distinction is global, it must survive the shift from first-order attitudes to meta-normative choices. If it does not survive, this suggests a fundamental disanalogy between 'framework choice' and 'attitude formation' that requires explanation.

  **Recent Developments**
  Some recent work has begun to touch on these issues. Discussions on 'epistemic consequentialism' (e.g., by Selim Berker) question whether epistemic norms can be justified by their good outcomes. This touches on the WKR problem: are good outcomes the right kind of reason for epistemic norms? However, these discussions are often siloed within epistemology and do not generalise the WKR distinction across domains. Similarly, debates on 'pragmatic encroachment' in epistemology ask whether practical stakes can affect the justification of belief. This is related but distinct; pragmatic encroachment suggests practical reasons might become right-kind reasons under certain conditions. This paper will investigate whether, at the framework level, practical reasons are inherently wrong-kind.

  This project builds on these foundations but diverges by making the WKR distinction the primary lens through which framework selection is viewed. It does not merely ask if pragmatic reasons matter; it asks if they are of the *wrong kind* for establishing normative correctness. This shift in focus allows for a structural analysis that is currently missing from the literature.

  ## 4. Methodology: Constitutive Aims and Comparative Domains

  The method for this term paper will be conceptual analysis, specifically focusing on the 'constitutive aim' strategy for solving the WKR problem. This strategy, associated with philosophers like Nishi Shah and David Velleman, argues that attitudes have aims built into their very nature. Belief aims at truth; intention aims at action. Wrong-kind reasons are those that do not serve the constitutive aim.

  **Step 1: Identifying Constitutive Aims for Frameworks**
  The first methodological step is to determine if normative frameworks have constitutive aims. If a moral framework is a tool for decision-making, its aim might be 'action-guidance'. If it is a system of truth-claims, its aim might be 'moral truth'. If it is a social construct, its aim might be 'social cohesion'.
  The paper will argue that for the WKR distinction to survive at the meta-level, frameworks must have constitutive aims that are not purely instrumental. If the only aim of a moral theory is to satisfy the agent's desires, then all reasons for adopting it are pragmatic, and the WKR distinction collapses. The paper will explore candidate aims for frameworks, such as:
  *   **Coherence:** The internal consistency of the normative system.
  *   **Explanatory Power:** The ability to account for diverse moral intuitions.
  *   **Truth-Tracking:** The capacity to identify objective moral facts (if they exist).
  *   **Universality:** The applicability of the framework across different agents.

  **Step 2: Testing Across Three Domains**
  To ensure the robustness of the analysis, the paper will test the hypothesis across three distinct domains. This comparative approach prevents the analysis from being biased by the specific quirks of moral theory.

  1.  **Moral Theory Selection (Consequentialism vs. Deontology):**
      *   *Scenario:* An agent chooses consequentialism because it reduces their anxiety about rule-following.
      *   *Analysis:* Is anxiety-reduction a wrong-kind reason for the *truth* of consequentialism?
      *   *Comparison:* Contrast with choosing consequentialism because it better explains the badness of suffering.
      *   *Goal:* To determine if 'theoretical virtues' count as right-kind reasons in ethics.

  2.  **Epistemic Policy (Evidentialism vs. Pragmatism):**
      *   *Scenario:* A scientist adopts a policy of high skepticism because it protects their reputation from error.
      *   *Analysis:* Is reputation protection a wrong-kind reason for the *correctness* of the epistemic policy?
      *   *Comparison:* Contrast with adopting skepticism because it minimizes false positives (an epistemic aim).
      *   *Goal:* To see if the distinction holds in a domain (epistemology) where truth is the explicit aim.

  3.  **Aesthetic Categorisation (Tragic vs. Satirical):**
      *   *Scenario:* A critic categorises a film as 'satire' to make it more palatable to a specific audience.
      *   *Analysis:* Is audience palatability a wrong-kind reason for the *categorisation*?
      *   *Comparison:* Contrast with categorising as 'satire' because of the director's intent and textual features.
      *   *Goal:* To test the distinction in a domain where 'truth' is less clear, focusing on 'fittingness'.

  **Step 3: Structural Comparison**
  For each domain, the paper will map the reasons onto the WKR structure.
  *   *RKR Candidate:* Reasons that appeal to the internal standards of the framework (e.g., coherence, evidence, textual features).
  *   *WKR Candidate:* Reasons that appeal to external benefits of holding the framework (e.g., happiness, reputation, audience approval).
  The analysis will determine if the intuition that these are 'wrong kinds' of reasons persists when the object of evaluation is the framework itself.

  **Step 4: Evaluating the 'Collapse' Hypothesis**
  The paper will seriously consider the possibility that the distinction *does* collapse. At the meta-level, choosing a framework might be inherently pragmatic. We choose logic because it works, not because it is 'true' in a correspondence sense. If this is the case, the WKR distinction is limited to first-order attitudes. The paper will outline the arguments for this 'Instrumentalist View' of framework selection.

  **Step 5: Evaluating the 'Survival' Hypothesis**
  Conversely, the paper will outline the 'Realist View' of framework selection. This view holds that frameworks are subject to normative constraints independent of utility. If this view holds, the WKR distinction survives, but it may require a modified account of 'theoretical virtue' to explain what constitutes a right-kind reason for a framework.

  This methodology ensures that the paper does not merely assert a position but tests it against varied normative landscapes. It moves from the abstract definition of WKR to concrete applications, allowing for a nuanced conclusion.

  ## 5. Projected Outcomes: Collapse vs. Survival

  Based on the preliminary analysis, the term paper anticipates two primary possible outcomes. The conclusion of the paper will not necessarily definitively solve the problem—which may be too large for 6,000 words—but will argue for the plausibility of one outcome over the other, or propose a hybrid position.

  **Outcome A: The Collapse of the Distinction (Meta-Instrumentalism)**
  In this scenario, the paper finds that the WKR distinction does not apply to framework selection.
  *   *Rationale:* Frameworks are tools. The only reasons to choose a tool are instrumental. To ask for a 'right-kind' reason for choosing a hammer is to misunderstand the nature of tools. Similarly, moral and epistemic frameworks are technologies for navigating the world.
  *   *Implication:* If this outcome holds, the WKR distinction is local, not global. It applies to attitudes like belief because belief has a constitutive aim (truth) that is non-optional. But framework selection is optional and pragmatic.
  *   *Argumentation:* The paper would argue that 'theoretical virtues' like coherence are merely proxies for long-term utility. We value coherence because incoherent systems fail to guide action effectively. Thus, what looks like an RKR is actually a complex WKR.
  *   *Consequence:* This supports a form of normative anti-realism or pragmatism at the meta-level.

  **Outcome B: The Survival of the Distinction (Meta-Normative Realism)**
  In this scenario, the paper finds that the WKR distinction survives at the meta-level.
  *   *Rationale:* Frameworks are not merely tools; they are truth-claims or claims about fittingness. To adopt a moral framework is to claim that it correctly describes the moral landscape. Therefore, reasons must bear on that correctness, not just on the benefits of the claim.
  *   *Implication:* There are wrong-kind reasons for adopting moral theories. For example, adopting consequentialism because it is convenient is a wrong-kind reason, distinct from adopting it because it is true.
  *   *Argumentation:* The paper would argue that theoretical virtues are not merely instrumental. Coherence is a mark of truth, not just utility. Therefore, reasons appealing to coherence are right-kind reasons.
  *   *Consequence:* This supports a form of normative realism. It suggests that philosophical inquiry is constrained by norms that are not reducible to prudence.

  **Outcome C: A Modified Account (The Hybrid View)**
  A third, nuanced outcome is that the distinction survives but requires modification.
  *   *Rationale:* The constitutive aim of a framework is complex. It involves both truth-tracking and action-guidance. Therefore, some pragmatic reasons might be 'right-kind' if they relate to the action-guiding aim, while others are 'wrong-kind' if they bypass the truth-tracking aim.
  *   *Implication:* The boundary between RKR and WKR is blurrier at the meta-level.
  *   *Argumentation:* The paper would propose a dual-aim account of normative frameworks.

  The paper will weigh these outcomes against the intuitions generated in the three test domains. For instance, if the intuition that 'reputation' is a wrong-kind reason for epistemic policy is strong, this supports Outcome B. If the intuition is weak, it supports Outcome A.

  ## 6. Adjudication Criteria

  To decide between these outcomes, the paper will establish specific criteria for adjudication. These criteria will serve as the metric for evaluating the success of the WKR distinction at the meta-level.

  **1. The Intuition Test**
  The primary adjudicator will be reflective equilibrium regarding our intuitions. Does it *feel* like there is a mistake in choosing a moral theory for pragmatic reasons, distinct from the mistake of choosing a false theory? If the mistake feels identical (i.e., both are just 'errors'), the distinction may have collapsed. If the mistakes feel different (one is imprudent, the other is incorrect), the distinction survives.

  **2. The Explanatory Power Test**
  Does retaining the WKR distinction at the meta-level explain philosophical practices better than collapsing it? For example, philosophers often dismiss arguments for moral theories that rely solely on the psychological comfort they provide. If the WKR distinction explains *why* these arguments are dismissed (they are WKRs), it has explanatory power. If the Instrumentalist View explains it better (comfort is just a weak instrumental reason), the distinction may be redundant.

  **3. The Regress Test**
  If the WKR distinction collapses at the meta-level, does this lead to an infinite regress of instrumental justification? If we choose Framework A because it serves Desire B, why do we have Desire B? If all justification is instrumental, normativity risks losing its grip. If the WKR distinction survives, it provides a 'stopping point' for justification—frameworks are chosen for right-kind reasons (truth/coherence) which are not merely instrumental. The paper will assess which view offers a more stable normative foundation.

  **4. The Domain Consistency Test**
  Does the outcome hold across all three domains (Moral, Epistemic, Aesthetic)? If the distinction survives in epistemology (where truth is paramount) but collapses in aesthetics (where utility might be more relevant), this suggests the distinction is domain-specific. The paper will aim for a unified account but will acknowledge if the data suggests fragmentation.

  By applying these criteria, the paper will move beyond mere speculation to a structured evaluation of the meta-normative WKR problem.

  ## 7. Scope, Risks, and Feasibility Assessment

  **Scope and Limitations**
  The scope of this project is confined to conceptual analysis. It does not seek to empirical test how people actually choose frameworks, nor does it seek to archival research into the history of the WKR debate beyond the key contemporary texts. The focus is strictly on the logical structure of reasons for framework selection.
  The word limit of approximately 6,000 words imposes a constraint on the depth of the literature review. The paper cannot cover every variation of the WKR problem. It will focus on the 'constitutive aim' solution as the primary vehicle for analysis, acknowledging that other solutions exist (e.g., the 'object-given' vs. 'state-given' reasons distinction) but treating them as secondary to avoid over-complication.

  **Risk Assessment: The First-Order Slide**
  The most significant risk in this project is the danger of sliding into first-order moral argument rather than meta-normative analysis.
  *   *The Risk:* In discussing consequentialism vs. deontology, it is easy to begin arguing *for* one or the other. For example, the paper might inadvertently argue that consequentialism is true, rather than analysing the *reasons for adopting* it.
  *   *Mitigation:* To mitigate this, the paper will maintain a strict focus on the *structure of justification*. Whenever a moral example is used, it will be bracketed as a hypothetical. The paper will use phrases such as "Suppose an agent adopts..." rather than "We should adopt...". The methodology section explicitly frames the domains as test cases for the structural distinction, not as arenas for resolving first-order disputes.
  *   *Monitoring:* During the drafting process, each paragraph will be checked to ensure it addresses the meta-normative question (about reasons for frameworks) rather than the normative question (about the content of frameworks).

  **Risk Assessment: Ambiguity of 'Framework'**
  Another risk is the ambiguity of the term 'normative framework'.
  *   *The Risk:* If 'framework' is defined too loosely, the analysis may become equivocal.
  *   *Mitigation:* The introduction will provide a stipulative definition of 'framework' as a 'system of justification determining what counts as a reason'. This definition will be adhered to throughout.

  **Feasibility**
  The project is highly feasible within a one-semester timeline.
  *   *Resources:* All necessary literature (Rabinowicz, Rønnow-Rasmussen, Schroeder, Shah, Velleman) is available in standard philosophical journals and databases. No special archival access is required.
  *   *Empirical Work:* No empirical research, surveys, or experiments are needed. The method is purely philosophical conceptual analysis.
  *   *Word Count:* 6,000 words is sufficient to cover the introduction, literature review, methodology, three domain tests, and conclusion without requiring excessive compression. It allows for roughly 1,000 words per domain test, which is adequate for a conceptual sketch.
  *   *Timeline:*
      *   Weeks 1-3: Literature review and refinement of research question.
      *   Weeks 4-6: Drafting the methodology and moral theory domain.
      *   Weeks 7-9: Drafting the epistemic and aesthetic domains.
      *   Weeks 10-12: Drafting the outcomes, adjudication, and conclusion.
      *   Weeks 13-14: Revision and editing for clarity and British English conventions.

  **Conclusion on Feasibility**
  Given the conceptual nature of the inquiry and the availability of primary sources, the project presents no logistical barriers. The primary challenge is intellectual discipline—maintaining the meta-normative perspective without drifting into first-order advocacy. With careful attention to the methodological constraints outlined above, this risk is manageable.

  ## 8. Conclusion

  This proposal outlines a term paper that seeks to expand the boundaries of the wrong-kind reasons debate. By shifting the focus from first-order attitudes to the selection of normative frameworks, the project addresses a significant gap in the current literature. The question of whether there can be wrong-kind reasons for adopting consequentialism over deontology is not merely a technical puzzle; it strikes at the heart of how we understand normative authority. If the distinction collapses, our highest-level normative choices are matters of prudence. If it survives, they are matters of correctness.

  The proposed method—analysing constitutive aims across moral, epistemic, and aesthetic domains—provides a robust framework for testing this hypothesis. The project is feasible within the semester, requires no empirical resources, and poses manageable risks provided the distinction between meta-normative analysis and first-order argument is strictly maintained. By concluding with an honest assessment of the scope and a clear set of adjudication criteria, the paper aims to make a substantive contribution to meta-ethical theory, offering a new perspective on the architecture of practical reason.

  The successful completion of this paper will demonstrate that the WKR distinction is not merely a tool for cleaning up value theory, but a lens through which the very structure of normative inquiry can be examined. It will show whether the logic of fittingness extends to the systems we use to measure fit, or whether, at the highest level, all reasons are ultimately of the same pragmatic kind.

