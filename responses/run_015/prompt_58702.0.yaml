      *   *Family B: Equal Means + Responsibility (Resource Egalitarianism/Dworkin).* Focus on shares of stuff, but hold people accountable for expensive tastes/choices.
      *   *Family C: Effective Freedom (Capability Approach/Sen/Nussbaum).* Focus on what people can actually *do* or *be*, regardless of happiness or raw resources.
