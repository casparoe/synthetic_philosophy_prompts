answer: |-
  # The "Fair Share" Diagnostic Quiz

  **Instructions for Students:**
  Below are nine pairs of situations involving two people. In each case, imagine you are in charge of distributing a limited amount of extra support (money, goods, or policy changes). You cannot help everyone equally. For each pair, choose the option that best matches your intuition about what is *fairest*. Do not overthink; go with your gut reaction.

  ---

  ### 1. The Musician and the Walker
  **Alex** needs to buy expensive sound equipment to feel a normal level of daily contentment. Without it, Alex feels depressed.
  **Blake** feels the same level of contentment as Alex simply by taking free walks in the park.
  *If you have a limited budget for "well-being support," how do you allocate it?*
  A. Give more to Alex, to bring Alex's happiness up to Blake's level.
  B. Give more to Blake, because Alex's needs are too costly.
  C. Split it equally, regardless of how much happiness it buys each of them.

  ### 2. The Library Access
  **Casey** uses a wheelchair and reports being very happy with life, but cannot enter the town's only public library due to stairs.
  **Dakota** can walk, enters the library easily, and reports being very happy with life.
  *The town has funds for one improvement project. Which do you fund?*
  A. Build a ramp, so Casey *can* enter the library, even if Casey says they are already happy.
  B. Do not build the ramp, since Casey says they are already happy.
  C. Flip a coin to decide, since both are equally happy.

  ### 3. The Communal Grain
  **Elena** and **Frank** are given the exact same amount of grain from the community store.
  However, local custom forbids women from eating in public. Elena must eat alone at home, where she often goes hungry to save food for her children. Frank eats his full share in the communal hall.
  *You have a small surplus of grain to distribute. What do you do?*
  A. Give the surplus to Elena, so she actually gets enough to eat despite the custom.
  B. Split the surplus equally, because they were given equal shares originally.
  C. Give the surplus to Frank, because he can make better use of it publicly.

  ### 4. The Cultivated Taste
  **Gina** used to be content with cheap beer but deliberately trained her palate over years to enjoy only rare, expensive wine. She is now unhappy drinking anything else.
  **Hank** is content with cheap beer and has never tried to change his tastes.
  *The community is subsidizing evening meals. How do you treat their requests?*
  A. Subsidize Gina's wine, because her unhappiness is real.
  B. Subsidize Hank's beer, because Gina chose her expensive problem.
  C. Subsidize both equally, ignoring how the tastes were formed.

  ### 5. The Unchosen Need
  **Ivan** has a digestive condition he was born with. He must eat special, expensive food to avoid pain.
  **Jenna** has a normal digestion and can eat cheap food without pain.
  *The community is subsidizing evening meals. How do you treat their requests?*
  A. Give Ivan more money for food, because his need is not his fault.
  B. Give them equal money, because everyone gets the same share.
  C. Give Jenna more money, because Ivan's condition is a burden on the group.

  ### 6. The Gambler and the Saver
  **Ken** gambled away his savings on a risky bet and now has no money for rent.
  **Lena** saved carefully and has enough for rent, with a little left over.
  *A hardship fund is available. Who gets help?*
  A. Help Ken, because having no home is terrible regardless of cause.
  B. Help Lena, because she deserves a reward for planning.
  C. Help neither, or help Lena more, because Ken is responsible for his loss.

  ### 7. The Happy Deprived
  **Maya** has lived in poverty her whole life. She says she is satisfied and does not expect more.
  **Nora** has a moderate income but feels frustrated and wants more to achieve her goals.
  *You have funds to improve living standards. Who do you prioritize?*
  A. Prioritize Maya, because her material deprivation is severe, even if she doesn't complain.
  B. Prioritize Nora, because she feels the lack more acutely.
  C. Split the funds, ignoring their reported satisfaction levels.

  ### 8. The Threshold
  **Oscar** lacks basic heating and is at risk of illness.
  **Paul** has adequate heating but would like a more efficient system to save money.
  *You have enough money to fully fix one system or partially help both. What do you do?*
  A. Fix Oscar's heating completely, even if Paul gets nothing.
  B. Split the money, giving a small upgrade to Paul and a partial fix to Oscar.
  C. Help Paul, because his investment would be more economically efficient.

  ### 9. The Identical Needs
  **Quinn** and **Riley** have the exact same health, same goals, and same current income.
  However, due to a past error, Quinn currently has 10% less money than Riley.
  *You have a small amount of cash to distribute. What do you do?*
  A. Give it all to Quinn, to restore perfect equality.
  B. Split it equally, leaving the 10% gap in place.
  C. Give it to Riley, to maximize total wealth.

  ---

  # Instructor's Scoring Guide & Debrief

  This guide helps you map student responses to four broad families of distributive justice. Note that few students will fit perfectly into one column; look for the *dominant tendency*.

  ### 1. The Four Profiles

  | Item | **A. Equal Satisfaction** (Welfarism) | **B. Equal Means + Responsibility** (Resource Egalitarianism) | **C. Effective Freedom** (Capability Approach) | **D. Sufficiency** (Threshold View) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Musician** | **Favor Alex** (Equalize happiness) | **Split/Equal** (Tastes are personal) | **Split/Equal** (If contentment is the function) | **Depends** (If Alex is below threshold) |
  | **2. Library** | **No Ramp** (Casey is happy) | **Build Ramp** (Compensate for handicap) | **Build Ramp** (Access is a freedom) | **Build Ramp** (If access is basic) |
  | **3. Grain** | **Favor Elena** (If she is hungry) | **Split Equal** (Formal parity) | **Favor Elena** (Ensure nourishment) | **Favor Elena** (If she lacks nutrition) |
  | **4. Taste** | **Favor Gina** (Unhappiness is real) | **Favor Hank** (Gina chose this) | **Favor Hank** (Gina chose this) | **Depends** (On baseline needs) |
  | **5. Need** | **Favor Ivan** (Pain is bad) | **Favor Ivan** (Unchosen disadvantage) | **Favor Ivan** (Health is a capability) | **Favor Ivan** (If health is basic) |
  | **6. Gambler** | **Favor Ken** (Suffering matters) | **Favor Lena/None** (Responsibility) | **Favor Lena/None** (Responsibility) | **Favor Ken** (If homelessness is below threshold) |
  | **7. Adapted** | **Favor Nora** (She wants more) | **Favor Maya** (Deprivation is objective) | **Favor Maya** (She lacks freedom) | **Favor Maya** (If she is below threshold) |
  | **8. Threshold** | **Split/Maximize** (Total happiness) | **Split/Equal** (Equal shares) | **Split/Equal** (Equal capabilities) | **Fix Oscar** (Priority to the urgent) |
  | **9. Gap** | **Split** (If happiness equal) | **Favor Quinn** (Restore equality) | **Favor Quinn** (Restore equality) | **Split** (If both above threshold) |

  ### 2. Interpreting Response Profiles

  *   **Profile A (Satisfaction):** Look for answers prioritizing reported happiness or suffering (Items 1A, 2B, 4A, 6A, 7B).
      *   *Pedagogical Hook:* Ask these students: "Should we subsidize expensive tastes if they make people happy? Should we ignore the 'happy slave' who says they don't need freedom?"
  *   **Profile B (Means + Responsibility):** Look for answers prioritizing equal shares *unless* choice is involved (Items 1C, 4B, 5A, 6C, 9A). They distinguish between *chosen* tastes (Item 4) and *unchosen* needs (Item 5).
      *   *Pedagogical Hook:* Ask: "If money is equal, but social norms prevent a woman from eating (Item 3), is justice done?"
  *   **Profile C (Effective Freedom):** Look for answers prioritizing what people can *do* regardless of happiness (Items 2A, 3A, 5A, 7A). They often align with Profile B but diverge on conversion factors (Item 3) and adaptation (Item 7).
      *   *Pedagogical Hook:* Ask: "If someone is happy but cannot read or vote, do we owe them help?"
  *   **Profile D (Sufficiency):** Look for answers that prioritize the desperately needy over the moderately needy (Item 8A), potentially ignoring equality above the line (Item 9B).
      *   *Pedagogical Hook:* Ask: "Once everyone has enough, does it matter if one person is a billionaire and another is merely rich?"

  ### 3. Unstable or Unoccupied Profiles

  *   **The "Responsibility Inconsistency":** Students who favor **Gina** in Item 4 (subsidizing chosen taste) but **penalize Ken** in Item 6 (gambling loss) hold an unstable view. Both involve voluntary choices leading to need. If responsibility matters for gambling, it should matter for tastes.
  *   **The "Adaptation Paradox":** Students who favor **Alex** in Item 1 (costly needs for happiness) but **ignore Maya** in Item 7 (happy deprived) are inconsistent. Both prioritize subjective states, but Item 7 reveals the problem of "adaptive preferences" (lowering expectations to match deprivation). A consistent Welfarist should help Maya less than Nora; a Consistent Capability theorist should help Maya more.
  *   **The "Formal Equality Trap":** Students who choose **Equal Split** in Item 3 (Grain/Woman) but **Build Ramp** in Item 2 (Wheelchair) may need to examine why. Both involve a physical/social barrier preventing the use of resources. Consistency requires acknowledging that "equal stuff" does not always mean "equal opportunity."

  ### 4. Limitations of this Diagnostic

  While this quiz distinguishes the four families broadly, two specific distinctions require further cases to be fully resolved in a tutorial setting:

  1.  **Resource Egalitarianism vs. Capability Approach:** These two often yield the same answers (e.g., Item 5, Item 9). They only clearly diverge when *conversion factors* differ significantly. Item 3 (The Woman/Grain) is designed to separate them, but students may conflate "giving her more grain" (Resource) with "ensuring she eats" (Capability).
      *   *Follow-up Case:* To separate these, present a case where giving *more resources* is impossible or inefficient, and only a *social change* works (e.g., changing the law vs. giving cash).
  2.  **Welfarism vs. Sufficiency:** These overlap when the unhappy are also the poor (Item 7). They diverge when someone is **rich but miserable** vs. **poor but happy**.
      *   *Follow-up Case:* Present a millionaire who is depressed vs. a subsistence farmer who is content. A Welfarist helps the millionaire; a Sufficientarian helps the farmer (if below the threshold). This quiz does not contain that specific pairing.

  ### 5. Suggested Debrief Flow
  1.  **Tally:** Have students raise hands for their most frequent choice (A, B, or C) per question.
  2.  **Conflict:** Highlight Item 3 (Grain) and Item 7 (Adaptation). These usually produce the most disagreement.
  3.  **Theory Match:** Reveal the four families *after* the discussion. Ask students to identify which "team" they were on during the debate.
  4.  **Reflection:** Ask: "Did you change your mind on Item 4 (Tastes) after discussing Item 6 (Gambling)?" This highlights the role of **responsibility** in modern egalitarian theory.
