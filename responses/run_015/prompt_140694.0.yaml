answer: |-
  Here is a principle constructed to match your verdicts, followed by the cost of adopting it, the evaluation of your eleven cases, and the requested tests.

  ### The Principle of Grounded Stability

  A thought experiment is evidentially usable if and only if it satisfies three conditions:

  1.  **Descriptive Invariance:** The verdict must remain stable when accidental imagery (names, emotional framing, narrative texture) is stripped away, *unless* the imagery constitutes the phenomenological data under investigation.
  2.  **Epistemic Tractability:** The scenario must describe a state of affairs that is epistemically accessible via actual experience, linguistic practice, or scientific modeling, excluding scenarios that rely solely on brute metaphysical conceivability without empirical traction.
  3.  **Variable Isolation:** The scenario must vary only the specific variables the target theory claims are irrelevant, without introducing confounding emotional, status-quo, or bodily-integrity variables that trigger independent moral or psychological responses.

  ### Clause Mapping: Motivations and Troubles

  **Clause 1: Descriptive Invariance**
  *   **Motivating Case:** Case 4 (Violinist). Your verdict flipped when the "kidnapping" and "tubes" were removed. This clause codifies your insight that the dry version is the real argument; the famous version is a pump.
  *   **Troubling Case:** Case 5 (Mary's Room). Strictly speaking, if you strip the "seeing red" imagery, the case vanishes. To save this verdict, the clause includes the *phenomenological exception*. This creates a boundary line you must police: is the imagery data (Mary) or decoration (Violinist)?
  *   **Cost:** You must accept that Mary's Room cannot support conclusions about *physicalism* generally, only about *phenomenological concepts*. It isolates qualia but cannot bridge them to metaphysics without further argument.

  **Clause 2: Epistemic Tractability**
  *   **Motivating Case:** Case 7 (Twin Earth). You accept this because reference fixing is something we actually do with water/H2O. It is anchored in linguistic practice.
  *   **Troubling Case:** Case 6 (Zombies) and Case 8 (Swampman). These fail because they rely on "conceivability" without a mechanism for verification or a real-world analog.
  *   **Cost:** You lose the ability to use thought experiments for pure modal metaphysics. You cannot argue about what is *possible* in a broad sense, only about what is *accessible* to our cognitive or empirical practices.

  **Clause 3: Variable Isolation**
  *   **Motivating Case:** Case 3 (Surgeon). You rejected this because the "cutting up" triggers a bodily violation response distinct from the utilitarian calculation.
  *   **Troubling Case:** Case 11 (Instrument Trolley). Your confidence weakened when the visual element was removed. This suggests the original Trolley case (Case 2) violated this clause slightly—the visual salience of the five people was doing work.
  *   **Cost:** You must downgrade your confidence in Case 2. It is not "rigged" like the Surgeon case, but it is not as clean as you thought.

  ### Evaluation of Your Eleven Verdicts

  Applying the Principle of Grounded Stability yields the following results. I have indicated where you should overturn or adjust your initial verdict.

  1.  **Gettier:** **Legitimate.** Satisfies all three. The imagery (clock/barn) is replaceable; the anchor is justified belief practices; variables are isolated.
  2.  **Trolley:** **Provisionally Legitimate.** It passes Isolation mostly, but Case 11 reveals a leak. You should adjust your verdict to acknowledge that visual salience is a confounding variable, even if it doesn't invalidate the case entirely.
  3.  **Surgeon:** **Illegitimate.** Fails Variable Isolation. The "cutting" introduces a rights violation variable not present in the diversion case.
  4.  **Violinist:** **Illegitimate (Famous Version) / Legitimate (Dry Version).** Fails Descriptive Invariance in the famous version. You were right to trust the dry version.
  5.  **Mary's Room:** **Legitimate (with restriction).** Passes via the phenomenological exception to Descriptive Invariance. Passes Epistemic Tractability (sensory restoration is real). *Restriction:* It establishes a gap in physical *descriptions* of experience, not necessarily a gap in physical *reality*.
  6.  **Zombies:** **Illegitimate.** Fails Epistemic Tractability. Conceivability is not access.
  7.  **Twin Earth:** **Legitimate.** Passes Epistemic Tractability (anchored in chemistry and reference).
  8.  **Swampman:** **Illegitimate.** Fails Epistemic Tractability. No mechanism for verification; relies on brute possibility.
  9.  **Experience Machine:** **Illegitimate.** Fails Variable Isolation. Status-quo bias and "narcotic" framing are confounding variables.
  10. **Memory Rewrite:** **Illegitimate.** Fails Descriptive Invariance (under-described). There is no stable verdict because the mechanism of "rewriting" is not specified enough to isolate personal identity variables.
  11. **Instrument Trolley:** **Diagnostic.** This is not a case to judge, but a test of Case 2. The weakening verdict confirms that Case 2 relied partially on visual framing.

  **Summary of Overturns:**
  You should overturn your confidence in **Case 2**. It is not "rigged," but it is not methodologically pure. You should also clarify **Case 5**: it is legitimate as a report on concepts/experience, but illegitimate if used to prove dualism without further premises. **Case 10** should be formally rejected until specified.

  ### Verdicts on Three New Cases

  **1. The De-pumped Zombie**
  *   *Description:* "Is it logically possible for a functional duplicate of a human to lack internal experience?" stated without imagery of behavior or physical identity.
  *   *Verdict:* **Illegitimate.**
  *   *Reasoning:* Fails Epistemic Tractability. Stripping the imagery leaves a bare modal claim. Without the narrative of "acting just like a human," there is no anchor for what "functional duplicate" means in this context. It becomes a question about the definition of words, not evidence about the world.

  **2. The Sorites Sequence (The Wedge)**
  *   *Description:* Moving from a clear case to a hard case via 100 steps of negligible difference (e.g., removing one grain of sand from a heap, or adding one neuron to a non-conscious system).
  *   *Verdict:* **Illegitimate as Proof / Legitimate as Heuristic.**
  *   *Reasoning:* Fails Variable Isolation. While each step varies little, the *sequence* accumulates a category shift. Using the sequence to force a verdict at the end relies on the inertia of the earlier verdicts, not the merit of the final case. It is useful for finding where your intuition breaks, but not for establishing where the boundary *should* be.

  **3. The Hive Mind / Text System**
  *   *Description:* "A system of a million humans linked telepathically acts as one agent. Is it one person?" or "A text predictor outputs 'I am in pain.' Is it?"
  *   *Verdict:* **Illegitimate.**
  *   *Reasoning:* Fails Epistemic Tractability. We have no real-world anchor for hive minds or conscious text systems. Any intuition generated is a projection of our existing concepts onto a void, not a report on a tractable possibility. It tests our linguistic habits, not metaphysical facts.

  ### The Genuine Check

  You asked for a check on the principle that is not merely another intuition. Intuitions about method are just as suspect as intuitions about cases.

  **The Check: Blind Structural Classification**
  To test the Principle of Grounded Stability, you must apply it to thought experiments *without knowing the philosophical conclusion they are intended to support.*

  1.  Take a set of 20 thought experiments (10 legitimate, 10 rigged) from across the history of philosophy.
  2.  Remove the conclusion they are supposed to prove (e.g., "This case is supposed to show utilitarianism is false").
  3.  Have multiple independent raters apply your three clauses to the *structure* of the case alone.
  4.  **Success Condition:** If the principle is valid, the raters should agree on which cases are admissible *before* the conclusions are revealed. Furthermore, the cases marked "Illegitimate" should correlate with cases that have historically failed to persuade across different cultural or temporal populations (e.g., cases that persuade Western undergraduates but not East Asian philosophers, or cases that persuaded 18th-century thinkers but not 21st-century ones).

  If your principle only classifies cases correctly when you already know which verdict you want, it is circular. If it predicts which cases will fail to travel across contexts based on their structural flaws (framing, lack of anchor, confounding variables), it is a methodological tool.

  **The Cost to You**
  Adopting this principle means accepting that philosophy cannot use thought experiments to settle deep metaphysical questions about possibility (Zombies, Swampman) or to override strong moral framing (Surgeon, Experience Machine). It restricts you to cases that track actual cognitive, linguistic, or phenomenological practices. You gain rigor, but you lose the ability to make sweeping modal claims from the armchair. You must trade the "deep" metaphysics of the possible for the "shallow" but tractable metaphysics of the actual.
