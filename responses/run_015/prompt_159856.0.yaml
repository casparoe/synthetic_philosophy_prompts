answer: |-
  Here are the operating rules extracted from Miriam's past verdicts, the predicted outcomes for your new cases, and the structural cost of maintaining consistency.

  ### The Three Rules of the Ladder

  Miriam's track record relies on three distinct criteria, which she applies hierarchically:

  1.  **The Locus of Selection (Mechanism):** Where are behavioral options filtered?
      *   *Darwinian:* By survival/reproduction across generations (Moth, Bacteria).
      *   *Skinnerian:* By environmental consequences after action (Pigeon, Dog).
      *   *Popperian:* By an internal model *before* action (Rat shortcut, Feral Human).
      *   *Gregorian:* By external cultural tools or symbols (Human w/ Paper, Chimp symbols).
  2.  **The Transmission Test (Culture):** Can acquired improvements survive the individual?
      *   If yes, the grade elevates to Gregorian (Crow tools, Fleet learning). If no, it caps at Popperian (Feral Human, Orion).
  3.  **The Scaffolding Clause (Offloading):** Is the cognitive work done inside the skin or in the world?
      *   If the artefact stores or processes intermediate states necessary for the solution, the mind is Gregorian (Long division on paper).

  ### Predictions and Divergence

  **Orion-7:**
  *   **Prediction:** **Popperian.**
  *   **Reasoning:** Orion generates candidates and rejects them via an internal verifier *before* emitting output. This is the definition of "hypotheses dying in the creature's stead." While it uses a calculator (Scaffolding), the *selection logic* resides in its frozen weights (Mechanism), and it shares nothing (Transmission).
  *   **Divergence:** Your Editor argues Gregorian (Tools); the Persistent Reader argues Darwinian (Frozen Weights).
  *   **Precedents:** Leans heavily on the **Feral Human** (capacity matters, not species/tools) and the **Rat in Water Maze** (internal rejection of detours). It sits least comfortably with **Human w/ Paper**, as Orion offloads verification to code.
  *   **Consistency Cost:** To call Orion Popperian, Miriam must rule that the calculator is a peripheral (like a rat's whiskers) rather than a cognitive scaffold (like the paper). She implicitly demotes **Human w/ Paper** to a special case where the *algorithm* (long division) is cultural, not just the tool.

  **Warehouse Fleet:**
  *   **Prediction:** **Gregorian.**
  *   **Reasoning:** They update internal models (Popperian/Skinnerian) *and* ship learning to new units. This cumulative transmission is the hallmark of Gregorian minds.
  *   **Precedents:** Leans on **Crow** (tool shape transmission) and **Chimp** (symbols).
  *   **Consistency Cost:** None. This is the cleanest Gregorian case yet.

  ### The Verdict

  Miriam will likely vote **Popperian for Orion** and **Gregorian for the Fleet**.

  She prefers this because it preserves the ladder's integrity. If Orion is Gregorian simply for using a calculator, then any Popperian creature using a stick becomes Gregorian, collapsing the distinction. By ruling Orion Popperian, she affirms that *internal simulation* is the grade-defining feature, while *transmission* is the gateway to Gregorian. The Fleet passes through that gateway; Orion does not.

  ### The Separating Case

  To cleanly separate the **Scaffolding Clause** from the **Transmission Test**, introduce this case:

  **The Solitary Architect:** A system that designs complex tools using internal simulation (Popperian), uses external software to verify them (Scaffolding), but is physically incapable of transmitting its designs to others before deletion.

  *   **Why:** If Miriam calls this Gregorian, she admits *Tool Offloading* trumps *Culture*. If she calls it Popperian, she admits *Transmission* is the necessary condition for Gregorian, making "Human w/ Paper" an exception based on the *cultural origin* of the algorithm, not the act of writing.

  ### The Honest Assessment

  Consistency here requires admitting that the four grades are biological categories straining under artefactual weight. Miriam should arguably **add a second axis: Design-Time vs. Run-Time.**

  *   **Design-Time:** How was the mind built? (Orion = Darwinian/Skinnerian training).
  *   **Run-Time:** How does it behave now? (Orion = Popperian).

  **Cost to the Column:** It destroys the hook. The column's power lies in the single, provocative word per creature ("It is a Popperian!"). Adding nuance ("It is Run-Time Popperian but Design-Time Darwinian") turns a verdict into a technical specification.

  **Recommendation:** Stay with the single word but add a footnote principle: *"Artefacts are graded by their most human-like capacity, provided they do not transmit culture."* This protects the Popperian verdict for Orion without dismantling the ladder.
