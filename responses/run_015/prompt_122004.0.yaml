      *   **Lexical Threshold Negative Utilitarianism (LTNU):** A form of NU where suffering takes absolute priority. Once suffering crosses a certain threshold (or perhaps *any* significant suffering), no amount of pleasure can outweigh it. It's a "trumping" relationship. $S > P$ always, or $S_{threshold} \gg P_{any}$.
      *   **Incommensurability:** The idea that two values (pleasure and pain) cannot be measured on a single common scale. There is no "utility currency" where $+10$ pleasure cancels $-10$ pain. They are qualitatively different.
      *   **Relationship:**
          *   If they are incommensurable, you *cannot* do simple trade-offs.
          *   Does incommensurability *entail* lexical priority? Not necessarily. You could have incommensurability without a strict hierarchy (e.g., "hard choices" where neither is better, but one isn't lexically superior either). However, in the context of *negative* utilitarianism, incommensurability often motivates lexical priority because if pain can't be cancelled by pleasure, pain must be addressed first.
          *   Can they stay separate? Yes. You can have lexical priority without strong incommensurability (e.g., pain is just *much* heavier on the same scale). You can have incommensurability without lexical priority (e.g., pluralistic value theory where you balance them via judgment, not calculation).

  3.  **Analyze the "Quantum Spin" Analogy:**
