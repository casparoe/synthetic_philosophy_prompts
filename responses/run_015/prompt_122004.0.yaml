          *   Define LTNU: Hierarchy. Pain wins.
          *   Define Incommensurability: No common ruler.
          *   Address the link: Incommensurability *supports* LTNU but doesn't *force* it. You can have a common scale where pain just weighs 1,000,000x more (lexical-ish but commensurable). You can have incommensurability where you just muddle through without strict lexical rules.
      *   *Section 2: The Logical Link.*
          *   Does Incommensurability $\rightarrow$ Lexical? No. It leads to "non-comparability" or "parity." Lexical is a specific *solution* to incommensurability, not the only one.
