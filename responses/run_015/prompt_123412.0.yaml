answer: |-
  There is no single, canonical term in comparative politics or constitutional theory that perfectly isolates this specific configuration. However, the phenomenon you describe sits at the intersection of three established conceptual streams: **organizational decoupling** (sociological institutionalism), **abusive constitutionalism** (constitutional theory), and **stealth authoritarianism** (regime studies).

  To carve this out conceptually, you are describing a specific modality of **Authoritarian Legalism** that relies on **Strategic Institutional Decoupling**. While "decay" implies passive atrophy and "facade" implies total fiction, your configuration is active, complex, and partially real.

  Here is the conceptual carving you need to distinguish this from neighboring concepts, along with a proposed label for the framework.

  ### 1. The Closest Existing Anchors

  To ground this in existing literature without losing the nuance you identified, you should locate it between these three concepts:

  *   **Organizational Decoupling (Meyer & Rowan):** In sociological institutionalism, this describes when organizations adopt formal structures to gain legitimacy but disconnect them from actual practice. *Limit:* This literature usually treats decoupling as a passive response to environmental pressure for legitimacy, whereas your case is an *active, strategic weaponization* of decoupling by the state to mask power consolidation.
  *   **Abusive Constitutionalism (Landau):** This covers the use of legal amendment and institutional design to erode democracy. *Limit:* It is a broad umbrella that includes court-packing or term-limit removal. It does not specifically highlight the *multiplication* of inert institutions as a masking technique.
  *   **Stealth Authoritarianism (Varol):** This describes the use of subtle legal mechanisms to erode democracy without triggering international sanctions. *Limit:* It focuses on the *strategy* of concealment, not the specific *institutional architecture* of inert proliferation.

  ### 2. Proposed Conceptual Label: "Strategic Institutional Decoupling"

  If you need a specific term for the seminar framework, **"Strategic Institutional Decoupling"** is the most theoretically precise label. However, if you want a term that captures the *visual/structural* paradox (more institutions = less democracy), **"Institutional Camouflage"** or **"Formalistic Proliferation"** works better.

  For the purpose of a conceptual framework, I recommend defining it as **"Procedural Obfuscation via Institutional Proliferation."**

  ### 3. Conceptual Carving and Boundaries

  To distinguish this from general democratic backsliding, you must define its edges based on *intent*, *mechanism*, and *measurement impact*.

  #### A. Versus Institutional Decay (The "Passive" Boundary)
  *   **Decay:** Institutions weaken due to neglect, underfunding, or political polarization. The number of institutions may stay static or shrink. The mechanism is *attrition*.
  *   **Your Phenomenon:** Institutions are *created*. The mechanism is *addition*. The "weakening" of effective bodies is masked by the "strengthening" (on paper) of the overall system.
  *   **Boundary Case:** If a government simply stops funding a court, that is decay. If they create a new "Judicial Oversight Commission" that reviews the court's budget while the court loses jurisdiction, that is Strategic Decoupling.

  #### B. Versus Facade Democracy (The "Total Fiction" Boundary)
  *   **Facade:** The institutions never had power to begin with (e.g., a rubber-stamp parliament in a closed autocracy). The form is a lie.
  *   **Your Phenomenon:** The institutions are *formally valid*. They have legal standing, budgets, and appointment procedures. They *could* function, but their jurisdiction is calibrated to be trivial or their activation is controlled. The form is a *distraction*.
  *   **Boundary Case:** A consultative council with no legal power is a facade. A constitutional court with broad review powers that requires a 4/5 majority to hear cases (where the executive holds 3/5) is Strategic Decoupling.

  #### C. Versus Standard Court-Packing (The "Capture" Boundary)
  *   **Capture:** The executive fills existing institutions with loyalists. The institution remains potent but changes allegiance.
  *   **Your Phenomenon:** The executive creates *new* institutions to divert attention from the captured ones, or creates complex layers that make capture unnecessary because the institution is inert by design.
  *   **Boundary Case:** Firing independent judges is capture. Creating a new "Ethics Tribunal" that reviews judicial conduct for "procedural errors" while the constitutional court is stripped of standing is Strategic Decoupling.

  ### 4. Operationalizing the Concept for the Seminar

  To make this usable for your students, you can define the phenomenon by three diagnostic criteria:

  1.  **Formal Density:** An increase in the number of oversight bodies, statutory review mechanisms, or transparency mandates over time.
  2.  **Functional Inertia:** A simultaneous decrease in the rate of binding decisions, sanctions issued, or executive actions overturned by these bodies.
  3.  **Jurisdictional Mismatch:** A divergence between the *scope* of the new institutions (broad, high-profile) and their *authority* (narrow, advisory, or procedurally blocked).

  ### 5. Why This Distinction Matters

  This configuration is distinct from general backsliding because it exploits the **metrics of liberal democracy**. International indices (Freedom House, V-Dem, WJP) often code for the *existence* and *formal independence* of institutions. By multiplying institutions, a regime can maintain or improve its "rule of law" score even as the substantive capacity for constraint collapses.

  Therefore, this is not just erosion; it is **measurement evasion**. It renders quantitative comparative methods blind to the quality of democracy if they rely on institutional counts rather than behavioral outputs.

  ### Summary Recommendation
  For your framework, label this **"Strategic Institutional Decoupling."**
  *   **Definition:** The strategic creation of formally democratic institutions with calibrated inertness to mask the neutralization of effective checks and balances.
  *   **Key Paradox:** Institutional density increases as democratic constraint decreases.
  *   **Differentiation:** Distinct from *decay* (which is subtractive) and *facade* (which is wholly fictional). It is *additive* and *functionally hollow*.

  This allows you to acknowledge the literature on abusive constitutionalism while isolating the specific mechanism of "institutional obesity" you have identified.
