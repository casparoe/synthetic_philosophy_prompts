answer: |-
  # Seminar Plan: The Two Components of Pain
  **Course:** Philosophy of Mind / Well-Being (Upper-Level)
  **Time:** 90 Minutes
  **Class Size:** 14 Students
  **Goal:** Phenomenologically separate the *sensory-discriminative* component of pain from the *affective-motivational* component, then test where "badness" resides.

  ## ⚠️ Safety & Ethics Protocol (Read Verbatim at Start)
  *"We are about to do a phenomenological experiment involving mild physical discomfort and sensory aversion. Participation is entirely voluntary. You may opt out of any or all parts without explanation, without penalty, and without anyone noticing. If you have Raynaud's, heart conditions, sensitivity to loud noises, or anxiety regarding breath/sensation, please do not participate. You may stop at any second. The goal is not endurance; it is data."*

  **Materials Needed:**
  *   Bowl of ice cubes (standard freezer ice, not dry ice).
  *   Napkins/paper towels (so students can drop ice without touching the table).
  *   Smartphone/Speaker capable of playing a 2kHz–4kHz sine wave (feedback squeal) at high volume.
  *   Projector/Board for recording data.
  *   Handout or digital form for private ratings (3 columns: Sensation Intensity, Unpleasantness, Motivation to Stop).

  ---

  ## Timeline & Mechanics

  ### 0:00 – 0:10 | Setup & Baseline
  *   **Action:** Distribute rating sheets. Explain the scales.
      *   **Sensation (0–10):** Purely descriptive. 0 = Nothing, 10 = Max possible physical intensity.
      *   **Unpleasantness (0–10):** How much you mind it. 0 = Neutral, 10 = Agonizing/Suffering.
      *   **Motivation to Stop (0–10):** How hard you are trying to make it end.
  *   **Instruction:** "Do not discuss your numbers with neighbors until I tell you. These are private phenomenological reports."

  ### 0:10 – 0:25 | Trial 1: The Standard Pain (Ice)
  *   **Stimulus:** Students pick up one ice cube with bare fingers (or place on back of neck if hands are sensitive). Hold for 45 seconds.
  *   **Instruction:** "Hold the ice. Focus on the experience. When I say stop, drop it and immediately record your three numbers."
  *   **Stop:** At 45 seconds. "Drop it. Record."
  *   **Collection:** Instructor collects the sheets anonymously (or has them input into a shared doc) to project the class averages.

  ### 0:25 – 0:40 | Trial 2: The Non-Pain Aversive (Noise)
  *   **Stimulus:** Play a loud, grating feedback tone (approx. 85dB) for 45 seconds.
  *   **Instruction:** "This is not painful. It will not damage your hearing. But it is unpleasant. Cover your ears if you wish, but try to experience it. Record the same three numbers."
  *   **Stop:** At 45 seconds. "Silence. Record."
  *   **Collection:** Project averages alongside Trial 1.

  ### 0:40 – 0:55 | Trial 3: The "Clinical" Reframe (Simulated Asymbolia)
  *   **Stimulus:** Ice cube again (45 seconds).
  *   **Instruction (The Twist):** "This time, imagine you are a scientist studying cold receptors. Your job is not to suffer; your job is to *locate* the sensation precisely. Is it burning? Stinging? Numbing? Where exactly on the skin? Treat the sensation as data, not a threat. If you feel the sensation but don't feel the need to escape it, that is a successful trial."
  *   **Stop:** At 45 seconds. "Drop it. Record."
  *   **Collection:** Project averages alongside Trials 1 & 2.

  ### 0:55 – 1:15 | The Discovery Phase (Small Group Discussion)
  *   **Breakout:** Groups of 3-4.
  *   **Task:** Look at the projected class averages (usually: Trial 1 & 3 Sensation are similar, but Trial 3 Unpleasantness/Motivation is lower. Trial 2 Sensation is low, but Unpleasantness is high).
  *   **Discussion Questions (on board):**
      1.  Compare Trial 1 (Ice) and Trial 2 (Noise). You rated both "Unpleasant." What did they have in common, given that the *Sensation* numbers were different?
      2.  Compare Trial 1 (Ice) and Trial 3 (Scientist Ice). For many of you, *Sensation* stayed high, but *Unpleasantness* dropped. Did the "pain" go away? Or did the "badness" go away?
      3.  If you could eliminate the *Sensation* but keep the *Unpleasantness* (you feel nothing but still suffer), would that be better? What about the reverse (you feel the intensity but don't mind it)?

  ### 1:15 – 1:25 | The Wrinkles (Full Class Debate)
  *   **Instructor Role:** Introduce the two philosophical stress tests using their data.
  *   **Wrinkle 1 (Selective vs. Global):** "Look at Trial 3. Some of you reported low Unpleasantness despite high Sensation. Imagine a patient who is *always* like Trial 3. They feel a broken leg (Sensation 10) but don't mind it (Unpleasantness 0).
      *   *Question:* Is this patient 'healthy' regarding pain, or is their *capacity to care* broken globally? If they also don't mind failing exams or losing friends, is the problem the pain or the person?"
  *   **Wrinkle 2 (The Mirror Case):** "Imagine a marathon runner. At mile 20, their legs burn (Sensation 8). But they rate Unpleasantness as 2, because this pain means 'victory.'
      *   *Question:* Is that pain *bad for them*? If badness = unpleasantness, it's not bad. If badness = tissue damage/sensation, it is bad. Which intuition wins?"

  ### 1:25 – 1:30 | Terminology & Map (Mini-Lecture)
  *   **Reveal:** "Philosophers and neuroscientists call the split you found the **Sensory-Discriminative** vs. **Affective-Motivational** distinction."
  *   **Reveal:** "The patient in Wrinkle 1 has **Pain Asymbolia**. You simulated the *structure* of their experience in Trial 3."
  *   **Map the Options:**
      1.  **Hedonism:** Badness = Unpleasantness (Trial 3 pain wasn't bad).
      2.  **Desire/Attitude:** Badness = Forced Caring (Trial 1 pain was bad because it forced you to want it to stop).
      3.  **Interference:** Badness = Hijacking Attention (Trial 2 noise was bad because it blocked thought, even without tissue damage).

  ---

  ## Predictable Failures (First Run Risks)

  1.  **The "Tough Guy" Effect:** Students may under-report Unpleasantness in Trial 1 to signal resilience.
      *   *Mitigation:* Emphasize anonymity in data collection. Tell them, "High suffering data is just as useful as low suffering data."
  2.  **The Reframe Failure:** Trial 3 might not work. Ice might hurt just as much regardless of instruction.
      *   *Mitigation:* If the data shows no split, pivot. "Interesting. For this group, the sensation *forces* the unpleasantness. That supports the view that pain is *essentially* awful, not just contingently so. Let's argue *that*." (Turn the failure into a philosophical position: Imperativism).
  3.  **Ethical Discomfort:** A student feels coerced.
      *   *Mitigation:* The opt-out script must be delivered seriously, not as a formality. Allow students to sit quietly with the rating sheet while others do the task.
  4.  **Conflating Sensation and Unpleasantness:** Students might say, "It hurt more, so it was more unpleasant."
      *   *Mitigation:* During the debrief, point to specific data points where Sensation was 8/10 but Unpleasantness was 3/10. Force them to account for the gap.

  ## Limitations (What You Must Lecture)

  Be honest with the class about what the activity **cannot** do:

  1.  **It cannot induce actual Asymbolia:** You simulated an *attentional shift* (top-down modulation), not the neurological disconnection seen in cingulotomy patients or congenital asymbolia. You must explain that real asymbolia patients don't just "reframe" the pain; they literally lack the emotional reaction despite trying to care.
  2.  **It cannot solve the "Badness" location:** The activity creates the *puzzle* (Where is the badness?), but it doesn't solve it. Students will leave with conflicting intuitions (e.g., "The runner's pain isn't bad" vs. "Tissue damage is always bad"). You will need to assign reading (e.g., Bain, Grahek, or Feldman) to give them the vocabulary to resolve the conflict.
  3.  **The "Global Indifference" distinction is theoretical:** You can't stage a student who is indifferent to *everything* in class. You have to explain that if the "Trial 3" student also didn't care about their grades or friends, we wouldn't call it "pain relief," we'd call it "depression" or "apathy." This distinction determines whether pain's badness is intrinsic or dependent on a functioning care-system.

  ## Instructor Cheat Sheet: The Debrief Map

  When mapping their experience to the live options, use this key:

  | If they say... | They are defending... | Philosophical Label |
  | :--- | :--- | :--- |
  | "Trial 3 wasn't bad because I didn't mind it." | Badness = Unpleasantness | **Hedonism / Phenomenalism** |
  | "Trial 3 was still bad, it was damaging my skin." | Badness = Biological Harm | **Objective List / Bio-Normative** |
  | "Trial 1 was bad because it made me want to stop." | Badness = Contrary Desire | **Desire Satisfaction** |
  | "Trial 2 (Noise) was bad because I couldn't think." | Badness = Interference with Agency | **Functionalist / Capacitarian** |
  | "The Asymbolia patient is broken, not cured." | Badness requires the link to care | **Internalism about Reasons** |

  **Final Note:** Do not use the word "Asymbolia" until the 1:25 mark. Let them struggle with describing the "Scientist Ice" condition first. The word should arrive as a relief, naming the thing they just touched.
