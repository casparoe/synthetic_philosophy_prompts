      *   **Method:** In-class activity involving mild physical discomfort + non-painful aversive stimuli. No upfront lecture.
      *   **Key Philosophical Wrinkles to Embed:**
          1.  *Pain Asymbolia vs. Global Indifference:* Distinguishing feeling pain without minding it vs. not caring about anything.
          2.  *The Mirror Case:* Sensation hurts, but the subject likes it/is fine with it (masochism/contextual reframing). Is it still bad for them?
      *   **Deliverables:** Setup, roles/stations, timeline (90 mins), exact questions, debrief mapping (badness = unpleasantness vs. badness = forced care vs. badness = attention hijacking), predicted failures, and limitations of the activity.
      *   **Constraint:** Do not use the word "asymbolia" until after the activity.

  2.  **Safety & Ethics Check (Crucial):**
