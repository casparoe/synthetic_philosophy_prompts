      *   *Constraint:* "Nothing that leaves anyone genuinely suffering, opt-out should be easy and unremarkable."
      *   *Risk:* Ice water (cold pressor) can be risky for people with Raynaud's or heart conditions. Bitter strips can trigger gag reflexes. Air hunger can induce panic.
      *   *Decision:* I need to select the safest, most controllable stimuli that still differentiate sensory vs. affective.
      *   *Selection:*
          *   *Painful:* Isometric hold (Wall Sit or Plank). It's safe, scalable, and clearly separates "muscle burn" (sensory) from "I want to stop" (affective). *Correction:* Wall sits can be hard on knees. Let's go with a *Static Hold* (holding a heavy book at arm's length or a specific yoga pose like Chair Pose). Actually, the *Cold Pressor* is the classic philosophical example (Grahek, Bain), but for a classroom, *Ice Cube Hold* is safer than submersion. Let's use **Holding an Ice Cube** in the palm. It's distinctively painful but low risk.
          *   *Non-Painful Aversive:* **Chalk on Blackboard sound** (audio) or **Intense Bitter Taste**. Audio is harder to control individually. Taste is good. Let's use **Unsweetened Cocoa Powder or Quinine Tonic**. Actually, a **High-Pitched Feedback Tone** via a phone app is easier to standardize. Let's go with **Nasty Audio** (headphones) vs. **Ice Cube**.
          *   *Wait, the prompt asks for "selective pain asymbolia" mechanics.* To simulate this, I need a condition where they feel the sensation but are instructed/primed to not mind it, or vice versa.
          *   *Revised Plan:* I need two conditions.
              1.  *Condition A (Standard Pain):* Ice cube hold.
              2.  *Condition B (Aversive Non-Pain):* Loud, grating noise via headphones.
              3.  *Condition C (Reframed Pain):* Ice cube hold, but framed as "cooling therapy" or part of a game where enduring it wins points/social capital (simulating the "mirror case").
      *   *Safety Note:* I must explicitly include a disclaimer about medical conditions and the right to pass without explanation.

  3.  **Structuring the Activity (The "Split"):**
      *   To get them to find the split themselves, they need to report on two different dimensions for the same experience.
      *   *Phase 1:* The Experience.
      *   *Phase 2:* The Reporting (Private).
      *   *Phase 3:* The Comparison (Public).
      *   *Phase 4:* The Philosophical Mapping.

  4.  **Addressing the Wrinkles:**
      *   *(1) Asymbolia vs. Indifference:* I can simulate this by asking them to imagine a scenario where they feel the sensation but have no motivation to stop it (via a thought experiment interwoven with the physical act). Or, I can use the "Reframed Pain" condition to show that the *sensation* stays while the *badness* drops.
      *   *(2) Mirror Case:* This is the "Reframed Pain" condition. If the sensation is the same but the context makes it "good" (e.g., post-workout soreness, or winning a bet), is it still bad?

  5.  **Drafting the Timeline (90 Minutes):**
      *   0-10: Setup & Safety (Crucial).
      *   10-30: Station Rotation (The Experience).
      *   30-45: Private Reflection (The Data).
      *   45-70: Discussion & The "Split" (The Discovery).
      *   70-85: The Wrinkles (Asymbolia & Mirror).
      *   85-90: Wrap & Terminology.

  6.  **Refining the Mechanics (The "Runnable" part):**
      *   *Problem:* Doing this simultaneously with 14 students is chaotic.
      *   *Solution:* Split into two groups. Group A does Ice, Group B does Audio. Then swap? No, 90 mins is tight.
      *   *Better:* Everyone does the Ice Cube (Pain). Then everyone does the Audio (Aversive Non-Pain).
      *   *Wait, to get the "Asymbolia" point:* I need to manipulate the *attitude* toward the pain.
      *   *Revised Activity Flow:*
          1.  **Trial 1 (Raw Pain):** Hold ice cube. Rate Sensation (0-10) and Unpleasantness (0-10).
          2.  **Trial 2 (Aversive Noise):** Listen to tone. Rate Sensation (Loudness 0-10) and Unpleasantness (0-10).
          3.  **Trial 3 (Reframed Pain):** Hold ice cube again, but told it's a "cooling performance test" where high sensation = high score (gamification). Rate Sensation and Unpleasantness.
      *   *Why this works:* Trial 1 vs Trial 3 shows the split (Sensation stays, Unpleasantness drops). Trial 1 vs Trial 2 shows the commonality of "Badness" despite different sensations.

  7.  **Addressing the Specific Wrinkles in Discussion:**
