answer: |-
  **The Case: The Archive Files**

  Three historians—Alex, Bailey, and Casey—are dividing access to a closed collection of 30 unique Files required for their manuscripts. Each File is discrete; they cannot be split. All three are honest about their needs and well-informed about their projects.

  *   **Alex** states: "I require 10 Files to complete my manuscript to a professional standard."
  *   **Bailey** states: "I initially required 12 Files for a professional standard. However, anticipating strict limits, I redesigned my project to be less comprehensive. I now state that 8 Files are sufficient for my success."
  *   **Casey** states: "I require 10 Files for a professional standard. However, my professional reputation depends on securing a larger share of the collection than Bailey. I need 12 Files to feel my contribution is recognized as primary."

  There are exactly 30 Files available. There is no uncertainty about the numbers.

  ***

  **(a) Three Recommendations**

  *   **Proposal A:** Distribute the files equally: ten to Alex, ten to Bailey, and ten to Casey.
  *   **Proposal B:** Distribute based on stated needs and standing: ten to Alex, eight to Bailey, and twelve to Casey.
  *   **Proposal C:** Distribute based on professional requirements: ten to Alex, twelve to Bailey, and eight to Casey.

  ***

  **(b) Objections and Working Replies**

  *   **For Proposal A:**
      *   *Objection:* "Bailey cannot reach the professional standard with ten files. You are punishing their prudence."
      *   *Working Reply:* "Equality concerns the external means provided, not the outcomes chosen. Bailey chose the redesign; they bear the cost of that choice."
  *   **For Proposal B:**
      *   *Objection:* "You are rewarding Casey's jealousy and penalizing Bailey's flexibility."
      *   *Working Reply:* "Justice tracks how lives actually go. If Bailey is content with less and Casey is not, equalizing holdings ignores their lived reality."
  *   **For Proposal C:**
      *   *Objection:* "Bailey said eight was enough. Why force twelve on them?"
      *   *Working Reply:* "Contentment born of constraint isn't freedom. We equalize the real ability to function, not the adjusted desire."

  ***

  **(c) The Hinge of Divergence**

  The single feature driving the disagreement is **the moral status of adjusted preferences and relative standing**. Each view diverges because it identifies a different "currency" of equality that treats these psychological facts differently.

  *   **The Resources View** takes the point of equality to be **external means**. It treats Bailey's adjustment as a choice for which Bailey is responsible, and Casey's relative standing as a taste that does not alter entitlement to means. Thus, it ignores both psychological features and divides the files equally.
  *   **The Welfare View** takes the point of equality to be **subjective experience**. It treats Bailey's adjustment as a valid reduction in need (respecting the preference) and Casey's relative standing as a valid component of well-being (respecting the experience). Thus, it shifts files to satisfy Casey's comparative need and Bailey's lowered claim.
  *   **The Capabilities View** takes the point of equality to be **effective freedom**. It treats Bailey's adjustment as a deprivation of genuine opportunity (rejecting the preference) and Casey's relative standing as a desire distinct from functioning (ignoring the experience). Thus, it restores Bailey's capacity for the standard work while denying Casey's status claim.

  \answer{The moral status of adapted expectations and relative standing.}
