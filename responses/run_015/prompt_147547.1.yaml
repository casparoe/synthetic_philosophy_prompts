      *   **Audience:**
          *   Majority: Virtue Ethicists (believe in unitary self, practical wisdom).
          *   Minority (2): Behavioral Economists (believe hyperbolic discounting is a computational error).
          *   Minority (1): Grad Student (obsessed with Harry Frankfurt's hierarchical models of will).
      *   **Role:** Expert philosopher of action with decision theory knowledge.
      *   **Tasks:**
          1.  Quick brainstorm on thesis weaknesses.
          2.  Draft Q&A prep sheet (Objections ordered by likelihood, phrased by audience group, damage rating, 2-min reply, soft spot, concessions, and the "forbidden question" about suicide/self-harm).
      *   **Constraints:** No citations, reading lists, or bibliographies. Think step by step.

  2.  **Deconstruct the Thesis:**
      *   *Core Claim 1:* Akrasia = Bargaining breakdown (Temporal Parts Model).
      *   *Core Claim 2:* Hyperbolic Discounting = Rational reservation price (not bias).
      *   *Implication:* The self is fragmented/negotiating, not unitary. Rationality is strategic, not optimizational.
      *   *Tension:* This challenges normative authority (why should I care about future selves?), moral responsibility (who is to blame?), and the definition of rationality (is consistency required?).

  3.  **Brainstorm Weaknesses (Task 1):**
