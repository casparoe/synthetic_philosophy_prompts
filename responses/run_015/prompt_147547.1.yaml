answer: |-
  ### Part 1: Quick Brainstorm on Thesis Weaknesses

  Before we get to the Q&A, here is the cold assessment of where your armor has gaps.

  1.  **The "Who Pays?" Problem:** If temporal parts are distinct negotiating agents, why does the *future* self suffer the consequences of the *present* self's deal-breaking? In standard bargaining, if Party A breaches, Party B walks away. Here, Party B (Future You) is forced to inhabit the wreckage. You haven't explained the binding mechanism of the "treaty."
  2.  **Redefining Rationality:** You are claiming hyperbolic discounting is *rational*. Standard decision theory defines rationality as time-consistency. By calling discounting a "reservation price," you are shifting from *individual rationality* to *strategic rationality*. The economists will pounce on this as a category error.
  3.  **The Fragmentation Limit:** If the self is fragmented enough to require bargaining, how fragmented can it get before it ceases to be a single agent? If the temporal parts are too distinct, you lose the grounds for calling it *akrasia* (which implies a single agent acting against their better judgment) rather than *conflict* (two agents with opposing interests).
  4.  **Normative Authority:** Why should the Present Self's "reservation price" hold any normative weight over the Future Self's welfare? If the Present Self is myopic, treating that myopia as a "rational negotiation tactic" seems to validate vice rather than explain it.

  ***

  ### Part 2: Q&A Prep Sheet

  **Strategy:** You need to hold the line on the *model* (bargaining) without losing the *normativity* (why this matters for action). Do not get dragged into defending hyperbolic discounting as "good." Defend it as "strategically intelligible."

  #### Objection 1: The Virtue Ethicists (The Majority)
  **Phrasing:** "Professor, on your view, *phronesis* (practical wisdom) seems impossible. If the self is just a series of negotiating temporal parts, there is no unitary subject to cultivate character. If I break a promise to my future self, that's just a failed deal, not a vice. Doesn't this dissolve moral responsibility entirely?"
  **Damage Rating:** **High.** This attacks the ethical core of the seminar.
  **Two-Minute Reply:** "I'm not dissolving responsibility; I'm relocating it. On the unitary view, akrasia is a mystery: how can I know the good and not do it? On my view, akrasia is a coordination failure. Character isn't a static state of unity; it's the *track record* of successful intertemporal treaties. When you build a reputation with your future selves for keeping plans, you lower the 'risk premium' they demand. Vice is simply a history of defaulting on those internal contracts, making future planning prohibitively expensive. The responsibility lies in the management of the internal coalition."
  **Soft Spot:** This sounds pragmatic, not moral. They will press: "Why *ought* I care about the future coalition if I can exploit them now?"
  **Concession Strategy:** Concede that this model works best for *prudential* rationality and requires an additional premise (like concern for overall life-narrative) to fully capture *moral* virtue. Don't try to derive full morality from the bargaining model alone.

  #### Objection 2: The Behavioral Economists (The Two)
  **Phrasing:** "You're calling hyperbolic discounting a 'rational reservation price.' But mathematically, it violates the axiom of time-consistency. It leads to dynamic inconsistency and guaranteed welfare losses. Calling it 'rational' just because it's a strategic move in a game seems like you're changing the definition of rationality to save the phenomenon."
  **Damage Rating:** **Medium-High.** They have the math on their side.
  **Two-Minute Reply:** "You are assuming the agent is a single optimizer maximizing a global utility function. I am arguing the agent is a sequential game between players with incomplete information. In a game with an unreliable partner, demanding a high immediate payoff *is* the rational move, even if it lowers total group utility. The 'error' isn't in the discounting; the error is in assuming a unitary maximizer exists. I'm not changing the definition of rationality; I'm changing the *ontology* of the agent to which rationality applies."
  **Soft Spot:** If they argue that the "game" is fictitious and only the biological organism is real, your ontology crumbles.
  **Concession Strategy:** Concede that from a "God's eye view" of the whole life, welfare is suboptimal. Your claim is only that *from the perspective of the present temporal part*, the discounting is a rational defensive strategy.

  #### Objection 3: The Frankfurtian Grad Student
  **Phrasing:** "Harry Frankfurt argues that will requires second-order volitions—identifying with certain desires. In your bargaining model, the Present Self might 'win' the negotiation against the Future Self without ever *identifying* with the action. Isn't this just compulsion or coercion, not will? Where is the hierarchical endorsement?"
  **Damage Rating:** **Medium.** Niche, but sharp.
  **Two-Minute Reply:** "In my framework, 'identification' is the successful outcome of the bargaining, not the precondition. When the Present Self makes a plan the Future Self is willing to execute without resistance, *that* is the moment of identification. Frankfurt's hierarchy is static; mine is dynamic. A breakdown in will isn't a lack of second-order desire; it's a strike action by a future temporal part that wasn't properly compensated in the negotiation."
  **Soft Spot:** This risks making "will" purely coercive. If the Present Self forces the Future Self via pre-commitment (like Ulysses tying himself to the mast), is that will or bondage?
  **Concession Strategy:** Acknowledge that "coercive self-binding" is a limit case where bargaining has failed and war has begun.

  #### Objection 4: The "Forbidden Question" (Suicide/Self-Harm)
  **Phrasing:** "If the Future Self is an unreliable negotiating partner who demands terms the Present Self can't meet, and the Present Self's discount rate is a rational reservation price... does your framework make eliminating the Future Self rational? If the negotiation is doomed, isn't suicide or self-harm a rational exit strategy from a bad contract?"
  **Damage Rating:** **Critical.** This makes your view look sociopathic or dangerously permissive.
  **Two-Minute Reply:** "That is the limit case of the model, and here is where the bargaining metaphor reaches its boundary. Negotiation presupposes the continued existence of the partners. You cannot negotiate a treaty if you destroy one of the signatories. The 'rationality' of the reservation price applies only within the context of an ongoing game. Terminating the game entirely isn't a move *within* the bargaining framework; it's the destruction of the board. Therefore, the model cannot validate self-elimination as a rational bargaining tactic, because it ends the possibility of rationality itself."
  **Soft Spot:** This is a "rule of the game" defense. A sharp critic will ask: "Why is keeping the game going rational?" If the future is pure pain (unreliable partner inflicting harm), why play?
  **Concession Strategy:** **Do not concede** that suicide is rational. Instead, concede that your model describes *agency*, not *value*. It explains how an agent functions, not whether their existence is worth sustaining. That requires a separate axiological framework. Keep this distinction tight.

  ### General Advice for the Room
  *   **Watch the Virtue Ethicists:** They will look unhappy when you talk about "deals" instead of "good." Use words like "integrity" and "coherence" alongside "bargaining."
  *   **Don't Fight the Math:** With the economists, don't deny dynamic inconsistency. Own it. Say it's a feature, not a bug, of fragmented agency.
  *   **The Grad Student:** Treat them with respect; their Frankfurt objection is the most philosophically technical. If you win them over, they will defend you against the others.
  *   **Tone:** Stay calm. If you get defensive on the "Suicide" question, it looks like you haven't thought it through. Deliver the "destruction of the board" line slowly and clearly.

  Good luck on Tuesday. Hold the line on the ontology.
