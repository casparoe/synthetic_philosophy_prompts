      *   *Better Angle:* The cellist wants to play the Will (bass drone). But according to Schopenhauer, the bass is the *lowest* grade of objectification (inorganic matter), not the Will-in-itself. The Will-in-itself is expressed through the *whole* structure, especially melody. So the cellist is actually playing "gravity," not "metaphysics."

