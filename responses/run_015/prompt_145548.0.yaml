      *   *The World as Will and Representation:* The world is Will (blind, irrational striving) and Representation (phenomenal appearance).
      *   *Other Arts:* Copy the Platonic Ideas (eternal forms), which are objectifications of the Will at specific grades (e.g., architecture = lowest grade, tragedy = higher grade). They are shadows of shadows.
      *   *Music:* Copies the Will *directly*. It bypasses the Ideas. It is a copy of the copy (no, wait, it's a copy of the thing-in-itself). It is as immediate as the Will itself.
      *   *Structure of Music:* Schopenhauer maps musical elements to the hierarchy of Ideas.
          *   *Bass:* Represents the lowest grades of the Will's objectification (inorganic nature, gravity, mass).
