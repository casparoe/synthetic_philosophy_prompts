      *   *The Twist:* The viola (user) is often the inner voice. The cellist wants to play the bass (the raw Will). But if music *is* the Will, then playing the piece is an act of Will. But Schopenhauer says music quiets the Will (aesthetic contemplation). Wait, no, music *reveals* the Will.
