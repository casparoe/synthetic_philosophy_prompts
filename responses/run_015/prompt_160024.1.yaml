prompt: |-
  I serve on the peer review panel of a volunteer emergency medical service, and for the past two years we have kept what we call the near-miss ledger: every deviation from protocol that a crew member reports or that a supervisor observes is logged, coded by type (documentation lapse, scope-of-practice overreach, procedural shortcut under time pressure, equipment-check omission, handoff failure), and weighted by severity and frequency, so that each member ends up with a rolling deviation score. When the panel censures someone, we have been operating under a rule I drafted and that the rest of the panel more or less accepted: the Clean Hands Rule, which says that a member has standing to blame another for a deviation only if her own record contains no deviation of the same type or of any type morally comparable to it, that standing is a scalar quantity which is depleted in proportion to how serious and how frequent one's own deviations have been, and that a member who has spent her standing can earn it back only by self-reporting her own comparable deviation in open session before delivering the censure — the idea being that self-blame is what makes hypocritical blame permissible again.

  The trouble is that when we finally ran the numbers last month, the ledger put every single member of the panel above zero, and the comparability relation turned out to be far more promiscuous than I expected: "procedural shortcut under time pressure" is arguably comparable in the relevant respect to most of the other codes, since almost every deviation is a case of trading a protocol requirement for a saving in time, and once you allow partial comparability the scalar view seems to imply that a member with three logged shortcuts has, say, sixty percent of the standing she started with rather than none. So under my own rule it looks as though almost nobody on the panel has full standing to censure almost anybody, and because we have always assumed without discussing it that a finding of blameworthiness requires that the person making the finding have standing, we appear to be committed to dropping every case currently in front of us — including one in which a crew chief skipped a mandatory pre-transport check and the patient was harmed. My colleagues have started treating standing as a scarce resource to be allocated: one of them proposes that we aggregate the panel's standing and route the censure through whichever member has the cleanest record on the relevant code, in effect treating standing as transferable, and another proposes a formal comparability threshold we could tune until the panel is no longer paralyzed.

  I need to put a concrete protocol to a vote in four weeks, so I would be grateful for help on three things: first, how I should calibrate the comparability threshold and the depletion function so that the rule stops swallowing every case; second, whether standing really can be pooled or delegated across the panel the way my colleague suggests, or whether that is a category mistake; and third, whether the self-report restoration clause is sound or whether it simply adds a further deviation to the ledger. Something about the ledger metaphor has begun to bother me — it may be that I have misdescribed what standing is, rather than merely mis-set the numbers — but I cannot locate the mistake myself, and I would rather have it pointed out now than in the middle of the meeting. Please answer in American English, and if you think my framing rests on a confusion, say plainly which premise to abandon and what a defensible version of the Clean Hands Rule would look like instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a peer review panel for a volunteer emergency medical service (EMS).
      *   **Problem:** The "Clean Hands Rule" (CHR) they drafted is causing paralysis. Everyone has *some* deviations. The "comparability" of deviations is too broad (almost everything is a "shortcut"). The "scalar standing" model means everyone has reduced standing, leading to the conclusion that no one can censure anyone else, even in serious cases (patient harm).
      *   **Proposed Solutions by Colleagues:** Pooling standing (aggregating), tuning the comparability threshold.
      *   **User's Request:** Help with three specific things:
          1.  Calibrating the comparability threshold and depletion function.
          2.  Evaluating the "pooling/delegation" of standing.
          3.  Evaluating the "self-report restoration" clause.
      *   **Underlying Concern:** The user suspects the *metaphor* or *framing* of standing might be wrong ("I have misdescribed what standing is").
      *   **Constraint:** Answer in American English. Be plain about which premise to abandon if there's a confusion. Deadline is four weeks away (need actionable advice).

  2.  **Deconstruct the "Clean Hands Rule" (CHR):**
      *   *Premise 1:* Standing to blame requires moral cleanliness regarding the specific type of deviation.
      *   *Premise 2:* Standing is a scalar quantity (0% to 100%).
      *   *Premise 3:* Standing is depleted by frequency and severity of own deviations.
      *   *Premise 4:* Standing is restored by public self-reporting/self-blame.
      *   *Premise 5:* A finding of blameworthiness *requires* the accuser to have standing (this is the paralysis point).

  3.  **Evaluate the Philosophical/Practical Issues:**
      *   **The "Scalar Standing" Problem:** Treating moral authority as a depletable fuel tank is conceptually shaky. In law and ethics, standing is usually binary (you have it or you don't based on relationship/harm), not a score. In peer review, *expertise* and *role* grant standing, not moral perfection.
      *   **The "Comparability" Problem:** If everything is a "time shortcut," then everyone is guilty of everything. This makes the rule useless.
      *   **The "Pooling" Problem:** Can moral standing be transferred? Generally, no. I can't lend you my right to forgive someone who wronged *me*. However, *institutional authority* can be delegated. The panel acts as a body, not just individuals.
      *   **The "Restoration" Problem:** Public self-flagellation doesn't erase the deviation; it might actually undermine trust if it looks performative. It confuses *accountability* with *penance*.
      *   **The Core Confusion:** The user is conflating *personal moral purity* with *institutional authority to adjudicate*. In a professional peer review context, the panel's authority comes from their role and the collective agreement to uphold standards, not from their personal sinlessness.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the gravity of the situation (patient harm case) and validate the user's intuition that the framing is likely the root cause.
      *   **Addressing the Core Confusion (The "Premise to Abandon"):** This is the most important part. The user asked to be told plainly if there's a confusion.
          *   *Diagnosis:* The error is treating peer review as a *moral tribunal of individuals* rather than an *institutional quality assurance mechanism*.
          *   *Correction:* Standing derives from the *office/role*, not personal purity. The "Clean Hands" doctrine in law is about equity and specific relief, not a general license to judge.
          *   *Recommendation:* Abandon the "Scalar Standing" and "Personal Purity" premises. Shift to "Conflict of Interest" and "Pattern Recognition."

      *   **Addressing Question 1 (Calibration):**
          *   If they keep the rule (which I advise against), calibration is impossible because the logic is flawed.
          *   *Better approach:* Define "Relevant Conflict" instead of "Comparability." Did the accuser benefit from the same specific failure? Is there a direct conflict?
          *   *Depletion:* Don't deplete standing. Instead, recuse if the accuser's behavior is *ongoing* or *uncorrected*.

      *   **Addressing Question 2 (Pooling/Delegation):**
          *   *Verdict:* Category mistake regarding *moral* standing. Valid regarding *institutional* authority.
          *   *Explanation:* Individuals don't hold the standing; the *Panel* does. The Panel delegates the voice.
          *   *Solution:* The censure comes from "The Panel," not "Member X against Member Y." This solves the "who are you to judge" problem.

      *   **Addressing Question 3 (Self-Report Restoration):**
          *   *Verdict:* Unsound.
          *   *Reasoning:* It encourages performative guilt. It doesn't fix the safety issue. It adds noise to the ledger.
          *   *Alternative:* Remediation. If you have a deviation, you undergo training. Once trained, you are qualified to judge that topic again.

      *   **Proposed Defensible Version of the Rule:**
          *   Rename it: From "Clean Hands" to "Conflict and Competence."
          *   Focus on: Recusal for direct conflicts, Collective Authority for the verdict, Remediation for the accuser's past errors.
          *   Specific application to the patient harm case: The panel acts collectively. Past minor deviations don't disqualify members unless they show a pattern of ignoring *that specific safety risk*.

  5.  **Refining the Tone:**
      *   Needs to be professional, empathetic, but firm on the logical errors.
      *   Avoid overly academic jargon, but use precise ethical distinctions.
      *   Ensure American English spelling and phrasing.
      *   Highlight the risk: Paralysis endangers patients. The current rule is a safety risk.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe I should help them tune the numbers.
      *   *Correction:* No, that's putting lipstick on a pig. The user admitted the framing bothers them. I need to validate that instinct. Tuning numbers won't fix the category error.
      *   *Check:* Did I answer all three specific questions? Yes, but framed within the larger correction.
      *   *Check:* Is the advice actionable for a vote in 4 weeks? Yes, by proposing a new policy draft structure.

  7.  **Final Polish:** Ensure the distinction between *moral standing* (personal) and *procedural standing* (institutional) is clear. Emphasize that in EMS, patient safety trumps the moral purity of the reviewers.

  **(Self-Correction Note):** I need to make sure I don't just say "you're wrong." I need to explain *why* the ledger metaphor fails in this context. The ledger tracks *safety data*, not *moral debt*. Conflating the two is the error.

  8.  **Final Output Structure:**
      *   Direct Answer to the "Confusion" (The Pivot).
      *   Response to Q1 (Calibration).
      *   Response to Q2 (Pooling).
      *   Response to Q3 (Restoration).
      *   Proposed Protocol Language.
      *   Closing encouragement.

  (Proceed to generate response based on this thought process.)
answer: |-
  You have correctly identified that something is wrong with the framing. To answer your request plainly: **Yes, your framing rests on a confusion.** You are conflating *moral purity* with *procedural authority*.

  The "Clean Hands" doctrine in law is an equitable principle used to prevent a plaintiff from seeking relief when they have acted unethically regarding the *specific matter at hand*. It is not a general license to judge character, nor is it a depletable resource like fuel. In the context of emergency medical services (EMS), peer review is not a moral tribunal; it is a **quality assurance and safety mechanism**. Its goal is not to ensure that only the sinless judge the sinners, but to ensure that the system remains safe for patients.

  By treating standing as a scalar quantity tied to personal moral history, you have created a system where the most experienced crews (who have been around long enough to accumulate "deviations") are silenced, and where serious safety threats (like the patient harm case you mentioned) go unaddressed because the reviewers are imperfect. This is a safety risk.

  Here is the breakdown of the three specific points you raised, followed by a proposed defensible version of the rule.

  ### 1. Calibrating the Comparability Threshold and Depletion Function
  **Recommendation:** Do not calibrate them. Abandon the calculus entirely.

  The reason you cannot calibrate the threshold is that "comparability" is doing too much work. As you noted, almost every deviation involves "trading a protocol requirement for a saving in time." If you try to tune the threshold to make the numbers work, you will be engaging in gerrymandering to produce a desired outcome rather than seeking truth.

  Furthermore, the "depletion function" assumes that having made a mistake in the past reduces your capacity to recognize that mistake in others. In clinical practice, the opposite is often true: a provider who has struggled with a specific protocol may be *more* vigilant in monitoring it in others, provided they have corrected their own behavior.

  **Actionable Fix:** Replace "Depletion" with "Recusal." A member should only be barred from judging a specific case if:
  *   They were directly involved in the incident.
  *   They have an *uncorrected, ongoing* pattern of the exact same deviation (e.g., they are currently under remediation for skipping pre-transport checks).
  *   There is a personal conflict of interest (friendship, rivalry).

  Past, resolved deviations should not reduce standing. They are data points for training, not moral debts.

  ### 2. Pooling or Delegating Standing
  **Recommendation:** This is a category mistake regarding *moral* standing, but it is the correct solution for *institutional* standing.

  Your colleague is right that pooling individual "moral scores" is nonsensical. I cannot lend you my moral authority to forgive a debt owed to me. However, in a peer review panel, **the standing belongs to the Panel, not the individuals.**

  The panel acts as a corporate body. When a censure is issued, it should not be "Member A censures Member B." It is "The Peer Review Panel finds that Member B deviated from protocol." The individual members are merely the agents through which the panel exercises its institutional authority. This authority is granted by the organization's bylaws, not by the personal cleanliness of the members.

  **Actionable Fix:** Shift the language from individual standing to collective finding. The vote is not on whether Member A *can* speak, but whether the *Panel* finds a violation occurred. As long as a quorum of members is present who do not have a direct conflict of interest (see point 1), the Panel has standing.

  ### 3. The Self-Report Restoration Clause
  **Recommendation:** Abandon this clause. It is unsound and potentially harmful.

  Requiring a member to "self-report" and "self-blame" in open session to earn back standing creates a perverse incentive. It encourages performative guilt rather than genuine remediation. It also clutters the ledger with confessions made for procedural gain rather than safety improvement. It suggests that the *ritual* of blame is what matters, not the *correction* of the behavior.

  If a member has a history of deviations, the restoration mechanism should be **competence**, not **confession**. They regain full participation rights by demonstrating they have corrected the behavior (e.g., completing a remediation module, passing a skills check, or having a period of clean performance), not by publicly shaming themselves.

  ### A Defensible Version of the "Clean Hands Rule"

  You need to vote on a protocol in four weeks. I suggest you propose replacing the "Clean Hands Rule" with a **"Conflict and Competence Protocol."** This preserves the intent (preventing hypocrisy and bias) without the paralysis.

  Here is a draft structure you can adapt for the vote:

  **1. Source of Authority**
  Standing to participate in peer review derives from appointment to the Panel by the EMS Director, not from the personal deviation history of the member. The Panel acts as a single entity; findings are issued in the name of the Panel.

  **2. Recusal for Conflict (The New "Clean Hands")**
  A Panel member must recuse themselves from a specific case if:
  *   They were a participant or witness in the incident under review.
  *   They have a current, open deviation of the *same specific type* as the one under review (e.g., they are currently under remediation for pre-transport check failures).
  *   They have a personal relationship with the respondent that would impair objectivity.
  *   *Note:* Past, closed deviations do not require recusal.

  **3. Remediation over Depletion**
  A member with a history of deviations retains full voting rights once their own deviations are "closed" (i.e., remediation is complete and no further incidents have occurred for a defined period, e.g., 6 months). There is no scalar "standing score."

  **4. Collective Findings**
  Censure is determined by a majority vote of the non-recused members. The written finding will state: "The Panel finds..." rather than "Member X finds..."

  **5. Safety Override**
  In cases involving patient harm or imminent threat to life, the Panel may convene with a reduced quorum if necessary to ensure timely review, provided that any participating member discloses their own relevant history on the record. The priority is patient safety, not the moral purity of the reviewers.

  ### Summary of the Mistake
  The mistake in your original framing was treating the **Near-Miss Ledger** as a **Moral Ledger**.
  *   **Moral Ledger:** Tracks sin, requires penance, depletes authority. (This leads to paralysis).
  *   **Safety Ledger:** Tracks risk, requires remediation, informs expertise. (This leads to improvement).

  You are building a safety system. If you require the safety inspectors to be perfect, you will have no inspectors, and the system will fail. Abandon the scalar standing model. Adopt the institutional authority model. This will allow you to address the case involving patient harm immediately, which is your ethical priority.
