  **MEMORANDUM**

  **TO:** Collections Committee, Port City Heritage Trust
  **FROM:** Vice-Chair, Collections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Designation and Maintenance of Pilot Schooner *Harbor Light*

  **Purpose**
  This memorandum recommends a final designation and maintenance plan for the pilot schooner *Harbor Light*. After sixty years of phased restoration, less than twenty percent of the vessel's current timber dates to its late-1800s working life. The Conservation Team proposes replacing the remaining original structural timbers to ensure seaworthiness, while simultaneously reassembling retired original materials into a static display hull. Per trust policy, only one hull may be designated as the historic vessel for insurance, grants, and ceremonial use. This recommendation resolves the conflict between material authenticity and functional continuity.

  **Recommendation**
  The Committee should designate the **seaworthy vessel** as the official historic vessel *Harbor Light*. The reassembled timber structure shall be designated as the "*Harbor Light* Artifact Collection" and displayed indoors. The seaworthy vessel will proceed with the replacement of remaining original structural timbers to meet safety standards for the annual harbor festival.

  **Charter Application and Precedent**
  Our charter mandates preserving "historical integrity" alongside "continued community function." In cases of gradual replacement, such as historic lighthouses or organs, integrity is maintained through continuity of form, location, and use, even when materials are renewed. A pilot schooner is defined by its function; a vessel that cannot sail ceases to be a schooner in the operational sense and becomes a model. Designating the static hull would satisfy material authenticity but violate the "community function" mandate by removing the vessel from the water it was built to navigate. Conversely, designating the sailing hull honors the living tradition of the port, satisfying the function mandate while maintaining integrity through continuous lineage and adherence to original lines and specifications.

  **Addressing Material Authenticity Concerns**
  We recognize the historians' concern that designating a vessel with less than twenty percent original material undermines public trust and historical accuracy. This is the strongest consideration against this recommendation. If the designation relies solely on the physical wood, the sailing hull fails the authenticity test. However, historical integrity encompasses intangible heritage: the skills of the sailors, the vessel's shape, and its role in community ritual. To mitigate material loss, the Trust will not merely store the retired timbers but will curate them as a high-profile exhibit. This ensures the original material remains accessible for study and public viewing, satisfying the integrity clause without sacrificing the vessel's function. We acknowledge that this sets a precedent where function outweighs materiality; future cases involving static structures (e.g., buildings) will be weighed differently, as their function is shelter rather than movement.

  **Maintenance and Timeline**
  1.  **Designation Filing:** Submit registry paperwork designating the seaworthy hull as *Harbor Light* by November 30, 2023.
  2.  **Conservation Phase:** Begin removal of final original structural timbers on January 15, 2024. All removed wood must be cataloged and transferred to the Artifact Collection.
  3.  **Reassembly:** Complete the static Artifact Collection hull for display in the main hall by June 1, 2024.
  4.  **Seaworthiness Certification:** The sailing hull must pass maritime safety inspection by May 1, 2024, to participate in the harbor festival.
  5.  **Review:** This designation status shall be reviewed in five years. If the percentage of original material in the sailing hull drops below ten percent, the Committee will reassess whether the vessel retains sufficient historical integrity to remain designated.

  **Bottom Line**
  To honor our charter's dual mandate, we must prioritize the vessel's life over its lumber. The Committee is asked to vote on designating the **seaworthy hull** as the historic *Harbor Light*, authorizing the replacement of remaining original timbers for safety, while mandating the permanent public display of the removed original wood as the *Harbor Light* Artifact Collection. This ensures the schooner continues to sail while preserving its physical history for future study.
