prompt: |-
  I'm working on a section of a paper about what pain asymbolia is supposed to prove, and I want to sanity-check my instincts before I commit to them on the page. Here's the setup Im using. Take the classic asymbolia picture: the patient reports feeling the pinprick, localizes it correctly, calls it sharp — but laughs, doesn't withdraw, doesn't ask you to stop, says it "doesn't bother" them. Now add one stipulation that I'm making up for the sake of argument, so please treat it as hypothetical rather than something you half-remember reading: in a follow-up study, when these same patients are asked during a pause between stimuli whether they'd accept another identical round in exchange for a small payment, roughly half say no — and can't say why, they just report the idea is "not nice."

  For each of the four claims below, give me a number from 0 to 10 for how much the whole package (classic picture plus my stipulated finding) counts against it. 10 = it's basically dead on this evidence, 0 = it shrugs the whole thing off.

  (a) What makes a pain bad is its felt unpleasantness, and unpleasantness is a proprietary, introspectable quality of the experience itself.
  (b) What makes a pain bad is that it functions as a bodily command to stop or protect that you can't ignore — badness lives in the imperative force.
  (c) Unpleasantness is constituted by the subject's concurrent negative attitude toward the sensation — disliking it, being averse to it.
  (d) Pain's badness is at least partly expressive and social: it's bad because it makes a claim on other people and gets taken up in shared behavior.

  For each one: the number, a sentence or two of why it lands there, and then the single extra empirical finding that would move your number the most, in whichever direction. And tell me where you think my stipulated follow-up result is in tension with itself — I may well have built something incoherent, and I'd rather find that out from you than from a referee.

  Last thing, and it's the part I actually care about most: flag clearly which bits of your answer rest on stuff that's settled about asymbolia (what these patients reliably say and do, setting aside where exactly the lesion sits) versus which bits are live disputes among people who work on this. I keep running into confident-sounding summaries of asymbolia that turn out to be one camp's reading dressed as description, and I don't want to smuggle that into my paper. If any of (a)–(d) is a claim where the obvious way to score it already presupposes a contested reading of the phenomenon, say that outright instead of just handing me the number.
