answer: |-
  Here is your Q&A prep sheet. I've ordered these by the likelihood they derail the defense. The cosmologists will care about the measure problem; the philosophers will care about the justification; the ethicist will care about the implications.

  **Note on the Slides:** Regarding the "accessability" typo: Do not announce it. If a cosmologist points it out during a technical objection, smile, say "That is the least rigorous part of the derivation, and I appreciate you catching it," and move on. If no one mentions it, let it lie.

  ### Upfront Concession (The Reference Class)
  **When to deploy:** In your opening remarks or immediately after the first question about "who counts as an observer."
  **What to say:** "I want to concede upfront that Indexical Drift Accounting (IDA) does not solve the reference class problem universally. It assumes a functional definition of 'observer-moment' tied to information processing capacity. I am not claiming this is the *only* valid reference class, but rather that it is the *stable* class for welfare comparisons where causal contact is the constraint. If you reject the link between causal contact and indexical uncertainty, my framework collapses, but standard SIA/SSA collapse faster on the Presumptuous Philosopher."

  ---

  ### Objection 1: The Metaphysics of "Causal Accessibility"
  **Who asks:** The Philosophers of Science (supported by skeptical Cosmologists).
  **The Vibe:** "You're smuggling in a preferred basis under the rug."
  **The Question:** "In Eternal Inflation or Many-Worlds, 'causal accessibility' is ill-defined between decohered branches. By weighting based on accessibility, aren't you just reintroducing a preferred frame or a specific measure on the wavefunction without justifying it? You're solving an epistemic problem with an ontological tool."

  **Your 2-Minute Reply:**
  "That is the central tension, and I appreciate you isolating it. You're right that if 'causal accessibility' is treated as a binary ontological switch, the framework breaks in decoherent scenarios. However, IDA treats accessibility as a gradient of information-theoretic coupling, not a hard boundary. I'm not invoking a preferred frame in the relativistic sense, but a preferred *indexical* frame relative to the observer's light cone or branch amplitude.
  The justification isn't that inaccessible observers don't *exist*—they do. It's that for *welfare comparisons*, the probability mass assigned to them must decay with the capacity for interaction or verification. This isn't solipsism; it's a regularization term. Without it, SIA forces us to prioritize hypothetical observers in vastly larger universes simply because they exist in greater numbers, which leads to the Presumptuous Philosopher absurdity. I am trading metaphysical purity for decision-theoretic stability. If you can show me a measure that preserves SIA's raw counting without generating presumptuous betting odds, I will adopt it. Until then, causal weighting is the only damping function that respects both existence and epistemic limits."

  **Where this is weakest:** You are hand-waving the definition of "information-theoretic coupling" across decohered branches. If they press you on the *math* of that coupling in a Many-Worlds context, you might not have a rigorous operator for it.

  ---

  ### Objection 2: The Normative Gap (Moral Weight)
  **Who asks:** The Ethics Grad Student.
  **The Vibe:** "Why should physics dictate morality?"
  **The Question:** "Even if your probability math works, why should *causal accessibility* determine *moral weight*? If a causally inaccessible alien is suffering in another branch, does your framework imply we have less obligation to them? That sounds like moral solipsism disguised as cosmology."

  **Your 2-Minute Reply:**
  "That is a crucial distinction, and I want to be careful not to conflate epistemic probability with moral intrinsic value. IDA is a rule for *indexical uncertainty*—i.e., 'Where am I?'—not necessarily 'How much do they matter?' However, for *welfare comparisons* across the multiverse, we have to aggregate values. If we assign equal weight to causally inaccessible observers as accessible ones, we fall into the 'Infinite Ethics' problem where every action has infinite expected value, paralyzing decision-making.
  My claim is not that inaccessible beings suffer *less*, but that our *capacity to act on their behalf* or even *locate ourselves relative to them* is weighted by accessibility. It's a decision-theoretic constraint, not a claim about their intrinsic dignity. If we treat all observer-moments as equally 'us' regardless of causal separation, we lose the ability to make any localized welfare judgments. So, I concede: their moral status might be invariant, but their weight in *our* indexical calculation must drift to avoid paralysis."

  **Where this is weakest:** You are walking a tightrope. If you say their moral status is invariant but their weight is lower, the ethicist will ask why the weight matters for *welfare* comparisons if not for moral status. You risk admitting the framework is useless for ethics.

  ---

  ### Objection 3: The Presumptuous Philosopher Resurgence
  **Who asks:** The Philosophers of Science.
  **The Vibe:** "You haven't actually fixed the problem."
  **The Question:** "Bostrom's Presumptuous Philosopher argues SIA makes us overconfident about large universes. Your 'drift' dampens the weight, but doesn't it just shift the presumptuousness? Now you're presumptuous about *causal connectivity*. How do you know the universe isn't structured such that accessibility is high precisely where observers are rare?"

  **Your 2-Minute Reply:**
  "The Presumptuous Philosopher objection relies on the idea that existence alone boosts credence. My modification breaks the link between *raw existence* and *credence*. The objection you're raising suggests I might be biasing toward 'connected' universes. But the defense is that 'causal accessibility' is not an independent variable I'm tuning; it's a constraint on the indexical evidence available to me.
  I am not claiming the universe *is* more connected. I am claiming that *given I am here*, I should update my probabilities based on the causal path that led to this observation. The Presumptuous Philosopher ignores the cost of the observation. IDA includes it. If observers are rare but highly connected, they get weighted appropriately. If they are abundant but causally distant, they get dampened. This isn't shifting the presumptuousness; it's acknowledging that observation requires a causal chain. Without that chain, the observation isn't mine."

  **Where this is weakest:** This is the most technical philosophical dodge. If they argue that "observation" doesn't require a causal chain in a quantum multiverse (e.g., via global wavefunction knowledge), your "cost of observation" argument fails.

  ---

  ### The Killer Question (The Softest Joint)
  **Who asks:** Anyone (but likely the Philosophers).
  **Why this hurts:** It exposes that you might be solving a math problem by changing the definition of the moral subject.
  **The Question:** **"If two observer-moments are phenomenologically identical, but one is causally inaccessible to you and one is accessible, does your framework assign them different probabilities of being 'you'? If yes, you've made identity dependent on external physics. If no, your weighting rule does nothing."**

  **How to handle it:**
  Do not try to outsmart this. It is the crux of your thesis.
  **Best Response:** "Yes, I am arguing that 'being you' is not just about phenomenological state, but about indexical location within a causal network. Identity isn't just the snapshot; it's the trajectory. If that makes identity partially externalist, I accept that cost to avoid the solipsism of SSA and the bloat of SIA."
  *(Note: This admits a metaphysical cost, but it's the only honest defense.)*

  ---

  ### General Defense Strategy
  *   **Cosmologists:** Keep your talk of "measure" and "regularization" prominent. They like seeing anthropic reasoning treated as a technical fix rather than a philosophical revelation.
  *   **Philosophers:** Do not use the word "obviously." Nothing here is obvious. Use "I propose" and "This entails."
  *   **Ethicist:** Validate their concern. "This is why I limit the scope to welfare *comparisons*, not fundamental *rights*."

  Good luck on Tuesday. Keep your answers tight, and don't let them drag you into defining "consciousness" from scratch.
