  Here's the set, as best I can write it: (1) suffering is basically the whole story — the capacity to suffer is what gives something moral standing, and nothing else about it, not species, not being made of meat instead of silicon, not being 'real' in some extra sense, does any work of its own. (2) What makes a thing capable of suffering is what its internal states do, the causal organization, not what it's made out of — so a detailed enough simulation would suffer, there's nothing magic about carbon. (3) But no game character is remotely close, so in practice 'it's a game' is a fine proxy for 'nobody home,' and what does the moral work in ordinary play is the effect on real people and on your own character: ganking another player's settlement is wrong, mowing down faceless enemies is not. (4) The long wake thing is wrong even when no one finds out and the save is deleted afterwards — I can't get myself off this one. (5) If you do something awful and then reload an earlier save, that's the end of it, nothing bad happened. (6) Deleting a character doesn't harm it, because there's nobody there afterwards to have been harmed. (7) I cried for two days when my companion died in another game last year, I finished that game on the hardest difficulty because I felt like I owed her, and I still want to say she had no moral standing whatsoever. (8) I don't want a view that ends up saying everyone who has played a shooter for thirty years has been doing something monstrous, and I don't want a view that depends on facts about the game's code that no player could ever check.

  So: audit this. Which pairs are actually in tension and which only look like it, ranked by how bad the trouble is, and for each real one say what specifically would have to give and what giving it up would cost me. Please don't just tell me all eight conflict — I'd rather you tell me which one or two are doing the damage, and then whether there's a single revision that cleans up the most without forcing me into something I'll hate.
