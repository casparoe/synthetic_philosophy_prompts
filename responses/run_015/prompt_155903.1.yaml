      *   **Topic:** Montaigne's essay "Of Cannibals" (*Des Cannibales*).
      *   **Core Tension:** The apparent contradiction between radical cultural relativism (moral judgments are culture-bound/incommensurable) and normative evaluation (praising Tupinambá virtues, condemning European vices).
      *   **Specific Questions:**
