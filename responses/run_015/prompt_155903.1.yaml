answer: |-
  Your reading identifies the central philosophical crux of *Des Cannibales* ("Of Cannibals"), and it touches on a debate that has occupied Montaigne scholars for decades. The tension you perceive is real, but it may stem from categorizing Montaigne as a "cultural relativist" in the modern anthropological or postmodern sense. If we read him instead through the lens of **Pyrrhonian skepticism** combined with a **Stoic-inflected Natural Law**, the contradiction dissolves into a coherent, albeit complex, argumentative strategy.

  Here is a breakdown of how to resolve the tension between his apparent relativism and his normative judgments.

  ### 1. Re-defining "Barbarism": Nature vs. Custom
  The most common misreading of the essay is that Montaigne argues all customs are morally equal. He does not. His famous opening line—"Each man calls barbarism whatever is not his own practice"—is a diagnostic observation of human psychology, not a prescriptive moral axiom.

  Montaigne distinguishes between two types of judgment:
  1.  **Judgment by Custom:** This is relative. Europeans think cannibalism is barbaric because it violates their custom. Tupinambá think eating enemies is honorable because it aligns with theirs. On this level, Montaigne is skeptical; he admits we cannot easily judge one custom against another solely on the basis of tradition.
  2.  **Judgment by Nature:** This is the universal standard you are looking for. Montaigne posits that there are "laws of nature" (reason, fidelity, courage, mercy) that precede human artifice.

  When Montaigne ranks the Tupinambá as "nobler," he is not validating their *culture* over European *culture*. He is validating **Nature** over **Artifice**. He argues that the Tupinambá, living closer to a "state of nature," retain natural virtues (courage, honesty, lack of greed) that Europeans have corrupted through "civilization" (luxury, religious hypocrisy, torture).

  Therefore, he is not smuggling in a *cultural* universal, but a *natural* one. The moral basis for condemning European torture is not that it violates French custom, but that it violates natural reason and humanity. This allows him to be cross-culturally normative without abandoning his skepticism about cultural superiority.

  ### 2. The Rhetorical Mirror: Strategic Essentialism
  You ask if the praise is purely strategic. The answer is largely yes, but "strategic" does not mean "insincere." Montaigne is engaging in what we might now call **strategic essentialism**.

  He is not writing anthropology; he is writing moral philosophy. The Tupinambá function as a **mirror** for the French reader. To make the mirror effective, he must polish it. He simplifies Tupinambá life, omitting internal conflicts or darker aspects that don't serve his thesis, to create a stark contrast with the French Wars of Religion.

  *   **The Goal:** The essay's purpose is not to understand the Tupinambá, but to understand *ourselves*.
  *   **The Method:** By inverting the hierarchy (Savage = Noble, Civilized = Barbaric), he shocks the reader out of dogmatic slumber.

  If he were a consistent radical relativist, he would say, "They do their thing, we do ours, no comparison possible." But that would defeat the essay's purpose. He *needs* the comparison to shame his contemporaries. The "contradiction" is therefore functional: he uses the *appearance* of relativism to disarm the reader's ethnocentrism, only to deploy a naturalist critique once that defense is down.

  ### 3. Epistemology: The Status of the Eyewitness Reports
  Your point about the travel narratives is crucial. Montaigne relies heavily on a specific source: a servant who had lived in Brazil for several years, whom he interrogated at length. He explicitly contrasts this "plain man's" testimony with the writings of cosmographers and scholars.

  Does this presuppose objective truth? In a modern positivist sense, no. In a skeptical sense, yes.
  *   **Pyrrhonian Suspension:** Montaigne doubts the ability of *reason* to grasp truth, but he trusts *experience* and *phenomena* more. He treats the servant's report not as absolute Truth, but as a more reliable *probability* than the speculative writings of scholars who have never left France.
  *   **The Filter of Translation:** Montaigne is acutely aware of linguistic distortion. In the essay, he recounts a conversation he had with three Tupinambá men brought to Rouen. He notes the difficulty of translation and the likelihood that they misunderstood his questions. This demonstrates that he does *not* treat cross-cultural observation as transparent.

  He accepts the reports as "true enough" for his moral purpose. He is not claiming to provide a scientific account of Tupinambá ontology; he is claiming that even by the *Europeans' own reported accounts*, the Tupinambá exhibit virtues that Europeans lack. He traps the Europeans using their own data.

  ### 4. Is the Contradiction the Point?
  You ask if the essay is a failed attempt at consistent relativism or if the tension is intentional. It is almost certainly the latter.

  Montaigne's *Essais* are exercises in judgment, not systematic treatises. He is exploring how a human being navigates a world of diverse customs without losing their moral compass.
  *   **The Tension:** The tension between "custom is king" and "nature is the guide" is the engine of the essay.
  *   **The Resolution:** The resolution is found in **self-knowledge**. We must recognize our customs are arbitrary (relativism) so that we can strip them away and see what remains of human nature (universalism).

  If Montaigne were a consistent relativist, the essay would be pointless. If he were a dogmatic universalist, the essay would be preachy. The power of the text lies in the **oscillation**. He forces the reader to hold both thoughts: *My morals are accidental products of my geography, AND my morals must align with a universal human reason.*

  ### Conclusion
  Montaigne is not advancing a radical cultural relativism that renders moral judgment incommensurable. He is advancing a **skeptical humanism**.

  1.  **Universal Standard:** He ranks cultures based on proximity to "Nature" (virtue, reason, simplicity) rather than proximity to "Civilization" (complexity, technology, dogma).
  2.  **Strategic Praise:** The idealization of the Tupinambá is a rhetorical device to critique European corruption, not a claim of indigenous perfection.
  3.  **Epistemic Humility:** He treats eyewitness reports as probable truths sufficient for moral reflection, while acknowledging the limits of cross-cultural understanding.

  The essay is not a failed system; it is a successful **aporia**. It leaves the reader unsettled, which is exactly what Montaigne intends. He wants you to question your definition of "barbarism" not to conclude that "anything goes," but to conclude that "what we call civilization often masks true barbarism." The contradiction you see is the friction required to generate that heat.
