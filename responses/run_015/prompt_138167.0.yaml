answer: |-
  # Preparation Sheet: Rescue Cases and the Count of Numbers

  ## 1. Top Ten Objections (Ordered by Damage)

  **1. The Policy/Repetition Objection (Philosopher/EA)**
  "If your agent-relative permission allows saving the one today, it allows it tomorrow, and every day. A policy of always saving the one when you could save five results in four times as many deaths as a policy of saving the five. If morality forbids outcomes that are predictably worse, your permission is actually a prohibition. You cannot separate the individual act from the policy it instantiates."

  *   **Reply:** I distinguish the *justification of a rule* from the *justification of an act*. A protocol held in trust for a population must maximize expected value to be fair to all claimants ex ante. But an individual rescuer in a one-off case faces a different moral geometry. They are not managing a portfolio of lives; they are responding to a specific claim. The permission is agent-relative precisely because the agent is not an institution. The badness of the policy does not retroactively make the individual act wrong, any more than a bad law makes every individual compliance vicious.
  *   **Marginal Note:** *Soft spot:* This relies heavily on the Act/Rule distinction being morally fundamental, not just heuristic. If the audience presses that "agent-relative permissions" are just a way to avoid the hard work of rule-consequentialism, this reply looks like evasion.

  **2. The Expected Value Objection (Health Economist)**
  "In health economics, we use QALYs and cost-effectiveness thresholds to allocate scarce resources. If you ignore the aggregate, you ignore the opportunity cost. Every time you save the one, you burn resources that could have generated five times the health benefit. Your 'complaint test' ignores the shadow price of the resource. How do you justify wasting public trust or medical capacity on a less efficient outcome?"

  *   **Reply:** Your thresholds apply to institutions holding resources in trust, which my institutional coda accepts. But the emergency physician at the scene isn't calculating QALYs; they are answering a immediate moral demand. The 'waste' you describe is only visible from the Onlooker standpoint. From the Agent's standpoint, the resource is not a budget line but a tool for responding to the person in front of them. Efficiency governs the system; responsiveness governs the act. Conflating the two turns the rescuer into a bureaucrat.
  *   **Marginal Note:** *Soft spot:* This concedes the institutional ground entirely. If the audience argues that *all* rescue resources are institutional (even a private rope belongs to a social practice of rescue), the distinction collapses.

  **3. The Triage/Feasibility Objection (Emergency Physician)**
  "In the field, we cannot run lotteries. We cannot pause to ask each patient for their complaint. We need heuristics that save the most lives because that is what the public expects and what keeps trust in the system. If you tell a triage officer they are permitted to save the one, you are giving them a license to ignore standard of care. What is the actionable protocol?"

  *   **Reply:** I am not offering a triage protocol; I am offering a moral analysis of the rescue case. Triage is inherently institutional—it manages flow for a population. My view says the *institution* should mandate saving the five. The 'permission' applies to the isolated agent, not the hospital system. Do not confuse the moral permissions of a stranger with the professional duties of a responder. The physician has a role-based duty that the stranger lacks.
  *   **Marginal Note:** *Soft spot:* This risks making the view irrelevant. If the only people with the power to rescue (firefighters, doctors) are bound by institutional rules, and strangers are rarely in a position to choose 1-vs-5, the theory has no practical footprint.

  **4. The Coin-Flip Objection (Philosopher)**
  "If the five have no stronger claim than the one, why is it permissible to save the one at all? Shouldn't you flip a coin? To save the one without a lottery implies the one's claim outweighs the five's, which contradicts your negative claim. If the claims are equal, the only fair procedure is randomization."

  *   **Reply:** Randomization is required only if there is a duty to save the greater number. I deny that duty exists in the simple case. The permission to save the one is not based on the one's claim outweighing the five; it is based on the absence of a requirement to count the five. I am not saying the one matters *more*; I am saying the five do not matter *more*. Without a requirement to aggregate, the agent may choose without a lottery.
  *   **Marginal Note:** *Soft spot:* This sounds like "might makes right." If I can choose without a reason to prefer, is it really a moral permission, or just an absence of regulation? It risks making the choice arbitrary.

  **5. The Circularity Objection (Philosopher)**
  "Your complaint test asks whether one of the five has a complaint holding the rest fixed. But if you hold the rest fixed, of course she has no complaint—she's just one person versus one person. You have defined aggregation out of existence by stipulation. The test doesn't prove numbers don't count; it just assumes they don't in the setup."

  *   **Reply:** The test is not a stipulation; it is a demand for a mechanism. If the group has a complaint, it must be composed of individual grievances. If no individual is treated unfairly *in themselves*, the group cannot be. The 'holding fixed' clause isolates the variable: is it the *presence of others* that generates the reason? I argue it is not. If the reason vanishes when the others vanish, the reason belonged to the others, not to her.
  *   **Marginal Note:** *Soft spot:* This leans on a methodological individualism that many ethicists reject. If moral reasons can be emergent properties of groups, this test is blind to them. I haven't defended metaphysical individualism.

  **6. The Institutional Inconsistency Objection (Clinical Ethicist)**
  "You say individuals can save the one, but institutions must save the five. This is unstable. If saving the five is morally better (as your institutional view admits), why is it permissible for an individual to do what is morally worse? You are creating a schism between personal morality and public ethics that cannot hold."

  *   **Reply:** It holds because the source of the obligation differs. The institution's obligation comes from fairness to the population ex ante. The individual's permission comes from the lack of a duty to aggregate ex post. It is not that one act is 'better' and one 'worse'; it is that they are different kinds of acts. One is administration; the other is rescue. The schism is real, but it reflects the difference between managing a system and facing a death.
  *   **Marginal Note:** *Soft spot:* This invites the charge of fragmentation. If the institution is made of individuals, and individuals act within institutions, how do they switch moral hats? The transition point is undefined.

  **7. The Fairness Objection (Philosopher/Ethicist)**
  "Even if the five have no aggregate claim, each of the five has an equal claim to the one. By saving the one, you violate the equal concern owed to the five. You are treating the five as a means to the one's survival, or simply disregarding them. Fairness requires giving each claim equal weight, which implies counting them."

  *   **Reply:** Equal concern does not imply equal outcome. It implies equal consideration of their individual standing. I grant each of the six equal standing. But standing does not generate a veto on the rescuer's choice. To say fairness requires saving the five is to say fairness requires aggregation. I deny that. Fairness is satisfied if no one is discriminated against due to identity or status. The numbers are not identity.
  *   **Marginal Note:** *Soft spot:* This redefines 'fairness' in a way that clashes with common usage. Most people equate fairness in rescue with maximizing survival chances. I am fighting linguistic intuition here.

  **8. The Standpoint Stability Objection (Philosopher)**
  "You diagnose the opposition as a shift between Agent, Victim, and Onlooker. But the Agent *is* an Onlooker. The rescuer sees the whole scene. You cannot ask the rescuer to blind themselves to the five other deaths. That is not a standpoint; it is a cognitive deficit."

  *   **Reply:** The rescuer sees the deaths, but does not *suffer* them. The Onlooker judges the badness of the world; the Agent judges the rightness of the hand. Seeing the five does not obligate the Agent to act for the five. The diagnosis is not that the Agent is blind, but that the Agent's normative task is different from the Onlooker's. One asks 'What should I do?'; the other asks 'How bad is this?'.
  *   **Marginal Note:** *Soft spot:* This is phenomenologically dubious. Agents often feel the weight of the Onlooker's judgment internally. Separating them cleanly may be theoretically neat but psychologically impossible.

  **9. The "Why Not Save No One?" Objection (Philosopher)**
  "If there is no reason to save the five, is there a reason to save anyone? If the numbers don't count, and no one has a prior claim, why not walk away? Your negative claim seems to undermine the duty to rescue entirely."

  *   **Reply:** The duty to rescue is grounded in the binary prospect of the individual in front of you. I can save A, or I can save no one. I have a reason to save A. I can save B, C, D, E, F, or I can save no one. I have a reason to save them. The question is only: when I can save A *or* the Group, does the Group's size tip the scale? I say no. The duty to rescue remains; the duty to maximize is what I deny.
  *   **Marginal Note:** *Soft spot:* If the duty to rescue is weak (agent-relative permission), it might not survive the conflict. If I have a reason to save A and a reason to save the Group, and they conflict, why does the reason to save A win?

  **10. The Risk/Probability Objection (General)**
  "In real life, rescue is never certain. If saving the five is 90% likely and saving the one is 100% likely, do numbers count then? If you say yes, you've abandoned your thesis. If you say no, you are reckless."

  *   **Reply:** Risk changes the complaints. If the gamble offers each of the five a better chance than the certain rescue offers the one, their individual complaints change. This is not aggregation; it is comparing individual prospects. I address this in my extension. But in the simple case of certainty, the numbers alone do not shift the weight. Do not let probability obscure the baseline case.
  *   **Marginal Note:** *Soft spot:* This hands the victory on the probabilistic extension (see Item 5). If numbers matter there, the audience will argue they matter in the certain case too, just less visibly.

  ***

  ## 2. Two Concessions for the Paper Body

  **Concession 1:** "I concede that the distinction between the Agent and Onlooker standpoints is not a wall but a filter; the Agent sees the aggregate badness, but it does not translate into a decisive reason for action."
  *   *Phrasing:* "This reads as progress because it acknowledges the phenomenological reality of the rescue scene without surrendering the normative claim that badness does not equal obligation."

  **Concession 2:** "I concede that the Complaint Test requires a baseline of 'normal expectation' to function; it cannot generate reasons ex nihilo, but only filter existing ones."
  *   *Phrasing:* "This reads as progress because it clarifies the mechanism of the test, moving it from a mystical intuition pump to a structured comparative tool."

  ***

  ## 3. The Question You Hope Nobody Asks (The Repetition Problem)

  **Verdict:** You have picked the right one. It is the strongest objection because it bypasses the "individual act" defense by attacking the *principle* underlying the act.

  **The Strongest Version:**
  "Do not ask me about a policy I might adopt. Ask me about the principle I am endorsing. If you endorse the principle 'It is permissible to save the one over the five,' you are endorsing a world where, whenever this choice arises, the one is saved. You are willing a universal law. If that universal law leads to four times as many deaths, and you acknowledge those deaths are bad (from the Onlooker standpoint), then you are willing a worse world. You cannot claim the 'Agent standpoint' exempts you from the rationality of your own maxims. If the principle is irrational when universalized, it is irrational for the agent."

  **Why this hurts:** It forces you to admit that your view is *agent-self-defeating*. It attacks the coherence of agent-relative permissions within a rational moral framework. It suggests your "standpoint diagnosis" is just a way to hide the fact that your view fails the test of universalizability.

  ***

  ## 4. Analysis of the Extension (Probabilistic Rescue)

  **Scenario:** Save 1 (Certain) vs. Save 6 (High Prob, else 0).
  **Your Worry:** Does this recover numbers via individual complaints, or is it smuggling?

  **Objection 1: The Risk-Attitude Dependence**
  "This extension makes the count of numbers depend entirely on the risk attitudes of the victims. If the five were risk-averse and preferred the certain rescue of the one (perhaps they are all relatives of the one), your test would say save the one. If they are risk-neutral, it says save the group. This means the 'reason' to save the group isn't the *number* of lives, but the *psychology* of the claimants. You haven't shown numbers matter; you've shown preferences matter."

  **Objection 2: The Option-Set Contamination**
  "The Complaint Test requires holding the rest of the case fixed. But the existence of the five *creates* the option of the gamble. You cannot ask 'Does one of the five have a complaint?' without referencing the fact that there are four others to make the gamble possible. The complaint is essentially: 'Because there are others, I have a chance.' This is aggregation in disguise. The reason she has a complaint is precisely that she is part of a group that makes the high-value option available."

  **Verdict:** This is a **Feature**, but a fragile one. It shows the test recovers numbers *instrumentally*, not *intrinsically*.

  **Reasoning:**
  It is a feature because it respects the individualist constraint: the reason to save the group is derived from five separate complaints about lost *probability*, not one complaint about lost *lives*. It avoids the "further deaths" problem of the certain case.
  However, it is fragile because it relies on the *structure of the options* changing with the numbers. In the 1-vs-5 certain case, the options are static. In the probabilistic case, the options themselves are number-sensitive.
  **Conclusion:** You should argue that this proves numbers only matter when they alter individual prospects (risk), not when they merely add up losses. This preserves the Negative Claim for the standard case (where prospects are binary and identical) while allowing the Intuition to be satisfied in the probabilistic case without aggregation. It is not smuggling; it is showing the specific mechanism (risk distribution) by which numbers *can* generate reasons, distinguishing it from the mechanism (aggregation of loss) you reject.
