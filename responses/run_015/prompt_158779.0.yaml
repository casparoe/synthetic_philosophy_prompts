answer: |-
  Here is a complete, runnable design for your 75-minute session. It is built to be self-contained, requiring no internet and minimal setup, while rigorously enforcing your constraints.

  # Workshop Title: The Dividend Protocol

  ## 1. Core Design Commitment
  **The Mechanism:** A "Prediction Market" with a guaranteed "Accommodation Bonus."
  **The Logic:** Participants receive a theory that *already fits* the observed data. They are paid a bonus (the Dividend) for this fit. They must then price a bet on whether the theory will predict *new* data. Half the theories are "Sealed" (generated before data, likely capture the signal), half are "Tailored" (generated after data, likely overfit the noise). Participants do not know which they hold.
  **The Tension:** The Dividend makes "fitting the past" financially rational, but the Future Bet makes "overfitting" financially dangerous. This forces them to weigh the value of accommodation against the risk of prediction without knowing the theory's origin.

  **Least Confident Feature:** I am least confident that participants won't immediately use **complexity** as a proxy for "Tailored." A theory that says "Output A unless the draw number is prime" is obviously cooked up to fit a specific sequence. I have designed the theory cards to obscure this (see Materials), but be prepared for them to crack this code quickly. If they do, lean into it: *"Why did complexity signal risk to you? Was that in the rules, or in your intuition?"*

  ---

  ## 2. Materials List
  *   **Projector/Screen:** To display the "Data Stream" (a simple slide deck of 20 symbols).
  *   **14 Envelopes:** Sealed. 7 marked "Type S" (Sealed), 7 marked "Type T" (Tailored). *Crucial: The outside of the envelopes must look identical. Use a sticker to cover the type label until the debrief.*
  *   **14 Theory Cards:** Inside the envelopes.
      *   *7 Sealed Cards:* Simple generative rules (e.g., "Repeat the previous symbol").
      *   *7 Tailored Cards:* Complex conjunctive rules that perfectly match the 20-symbol sequence but fail on new data (e.g., "Symbol is A, except on draws 3, 7, 12...").
  *   **14 "Ledger" Sheets:** For tracking points.
  *   **Play Money:** 500 "Credits" per participant (printed paper or poker chips).
  *   **A "House" Box:** To collect bets and pay dividends.
  *   **Timer:** Visible to you.

  ---

  ## 3. Payoff Scheme (Play Money)
  *   **Starting Endowment:** 100 Credits each.
  *   **The Dividend:** 40 Credits. Paid immediately if the participant verifies their Theory fits the Past Data (which all do).
  *   **The Future Bet:** Participants must set a price (0–100 Credits) to buy a "Prediction Ticket."
      *   **Ticket Cost:** The price they set (e.g., if they price it at 70, they pay 70 Credits).
      *   **Ticket Payout:** 100 Credits if the theory correctly predicts the *next* 5 symbols. 0 if it fails.
      *   *Note:* This is a simplified proper scoring rule. They maximize expected value by pricing the ticket at their true credence.
  *   **Final Score:** Endowment + Dividend - Ticket Cost + Ticket Payout.
  *   **Incentive:** Top 3 scores get a small real-world prize (chocolate, coffee voucher).

  ---

  ## 4. Minute-by-Minute Timeline (75 Minutes)

  ### Phase 1: Setup & Data Generation (00:00 – 00:20)
  *   **00:00–00:05 (Intro):** Welcome. Hand out Ledgers and 100 Credits.
      *   *Script:* "We are testing a market mechanism for theory evaluation. There are three phases: Data, Theory, and Prediction. Do not discuss your cards with neighbors. Do not use the words 'cause,' 'truth,' or 'history' during the game. Stick to 'fit' and 'prediction.'"
  *   **00:05–00:15 (The Past Data):** Project a sequence of 20 symbols (e.g., **A B A A B A B B A...**).
      *   Draw them one by one (clicker) to create a sense of temporal flow.
      *   *Instruction:* "Record this sequence on your Ledger. This is the **Fixed Past**. It is now certain. Probability = 1."
  *   **00:15–00:20 (Distribution):** Hand out the 14 Sealed Envelopes randomly.
      *   *Instruction:* "Inside is a Theory. Do not open it yet."

  ### Phase 2: The Dividend & Pricing (00:20 – 00:45)
  *   **00:20–00:30 (Verification):** Participants open envelopes.
      *   *Task:* Check if their Theory fits the **Fixed Past** (the 20 symbols on the board).
      *   *Reality:* All 14 theories fit perfectly. (You have curated the Tailored cards to match the specific sequence exactly).
      *   *Action:* House pays the **40 Credit Dividend** to everyone.
      *   *Script:* "The House pays a dividend for any theory that accounts for the Fixed Past. You all qualified."
  *   **00:30–00:40 (The Pricing Task):**
      *   *Instruction:* "You now hold a Prediction Ticket for the **Next 5 Symbols**. You must write a price (0–100) on your Ledger. This is how many Credits you are willing to pay for a ticket that pays 100 if your Theory predicts the next 5 symbols correctly."
      *   *Constraint:* "You do not know if your Theory was written before or after the Fixed Past was generated. You must price based on your confidence."
  *   **00:40–00:45 (Lock In):** Collect the Ledger prices. No changes allowed.

  ### Phase 3: The Future & Scoring (00:45 – 00:55)
  *   **00:45–00:50 (Future Data):** Generate the Next 5 Symbols live.
      *   *Crucial:* These must be generated by the *same mechanism* that created the Fixed Past.
      *   *Result:* The **Sealed** theories (simple rules) will predict these correctly. The **Tailored** theories (overfitted rules) will fail.
  *   **00:50–00:55 (Settlement):** Calculate final scores.
      *   Sealed holders: Dividend + (100 - Price).
      *   Tailored holders: Dividend - Price. (They lose their bet).
      *   Announce the top 3 scores.

  ### Phase 4: The Debrief (00:55 – 01:15)
  *   **00:55–01:05 (The Reveal):**
      *   Ask participants to open the sticker on their envelope to reveal "Type S" or "Type T".
      *   Ask for a show of hands: "Who priced their ticket above 50?" (Likely mostly Type S). "Who priced below 50?" (Likely mostly Type T).
      *   Ask: "How did you know? You weren't told the type." (They will cite complexity, elegance, or 'gut feeling').
  *   **01:05–01:15 (Mapping to Formalism):**
      *   *Now* you introduce the forbidden phrase: **The Problem of Old Evidence.**
      *   **Map 1 (The Dividend):** "The Dividend represents **Accommodation**. You got paid because the theory fit the data you already had. In Bayesian terms, $P(Evidence) = 1$. Formally, this should provide zero confirmation. Yet, the House paid you. Why did it feel valuable?"
      *   **Map 2 (The Bet):** "The Bet represents **Prediction**. This is where the Type S and Type T theories came apart. The formalism treats the evidence the same way (it fits), but your pricing treated them differently."
      *   **Map 3 (The Hidden Variable):** "The 'Sealed vs. Tailored' distinction is the **Temporal Order of Construction**. Bayes' Theorem has no variable for 'when the hypothesis was written.' Your prices did. Where does that value come from if not the formula?"

  ---

  ## 5. Troubleshooting: What Will Go Wrong
  1.  **The Complexity Tell:** As noted, students will spot that Type T cards are convoluted.
      *   *Fix:* Don't hide it. In the debrief, ask: "If the formula doesn't care about complexity, why did you?" This highlights the gap between formal Bayesianism and human heuristics (Occam's Razor).
  2.  **The "It's Rigged" Reaction:** If the Tailored theories fail the Future 5 draws *too* perfectly, they will suspect the game is stacked.
      *   *Fix:* Ensure the Future 5 draws are generated by the *true* underlying rule (e.g., a biased coin or simple alternation). The Tailored theories fail not because you sabotaged the future, but because they modeled *noise* in the past as *signal*. Explain this clearly.
  3.  **Risk Aversion:** Some students might price everything at 0 to avoid losing money.
      *   *Fix:* Emphasize the "Top 3 Scores" prize. To win, they *must* take a position. Passive play guarantees a middle-rank finish.
  4.  **Time Creep:** The Data Generation phase often drags.
      *   *Fix:* Hard stop at 20 symbols. Use a metronome or clicker to keep the pace at 1 symbol every 15 seconds.

  ---

  ## 6. Limitations: What The Game Cannot Capture
  You must state this explicitly in the final 2 minutes.

  **The Limitation:** The game captures the *pragmatic* difference between prediction and accommodation (one makes money, one loses money), but it does not solve the *logical* problem.
  *   **What to say:** "In this game, the 'Sealed' theories worked better because I built them to track the true signal. In the real world, we don't know which theory tracks the signal. The Problem of Old Evidence isn't just that we *feel* differently about old data; it's that standard Bayesian conditionalization ($P(H|E)$) mathematically cannot update on data where $P(E)=1$. This game gave you a 'Dividend' workaround—a pragmatic bonus. But formally, if the evidence is certain, the ratio doesn't move. You felt the pull of the Dividend, but you won't find that term in Bayes' Rule. That is the gap you have to live with."

