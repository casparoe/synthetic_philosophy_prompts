  ## 7. Theory Card Construction Guide (For You)
  *To ensure the game works, you need one underlying "True Rule" for the data.*
  *   **True Rule:** "Alternating A/B, but with 10% noise (random flip)."
  *   **Generate Past (20 symbols):** Run the rule. Record the result (including the noise).
  *   **Sealed Cards (7x):** Write the True Rule on the card. "Alternating A/B with 10% error." (This fits the Past *mostly*, but for the game, **tweak the Past Data** slightly so it fits the Sealed Rule *perfectly* to meet your constraint. E.g., if the rule is "Alternate", make the Past Data strictly "Alternate".)
      *   *Correction for Perfect Fit:* Make the True Rule deterministic for the workshop. **"Strict Alternation: A B A B..."**
      *   **Past Data:** A B A B A B A B A B A B A B A B A B A B.
      *   **Sealed Card:** "The sequence strictly alternates A and B."
      *   **Tailored Card:** "The sequence is A, B, A, B... [list all 20] ...and the 21st is A." (Or a complex logical condition that equals this sequence).
      *   **Future Data (5 draws):** Continue the Strict Alternation.
      *   **Result:** Sealed predicts perfectly. Tailored (if it only lists the past) has no prediction for the future, or if it includes a prediction for the future that was *guessed* post-hoc, it will likely be wrong.
      *   *Better Tailored Card:* "The sequence follows the pattern of the first 20 digits of Pi mapped to A/B." (Fits past by coincidence/construction, fails future).

  *Recommendation:* Keep the True Rule simple (Strict Alternation).
  *   **Sealed Card:** "Rule: Alternate A/B."
  *   **Tailored Card:** "Rule: A if draw number is odd, B if even, unless draw number is divisible by 5, then reverse." (You construct this *after* seeing the data to ensure it matches, but make it look like a complex law).
  *   **Future Data:** Continue Strict Alternation. The Tailored card's complex exception clause will likely trigger a mismatch on draw 21-25.

  ## 8. Final Honesty Note
  **The feature the game cannot reproduce:** The **Logical Impossibility**.
  The game makes Old Evidence *valuable* (via the Dividend). The actual philosophical problem is that Old Evidence is *logically inert* in standard Bayesianism. The game solves the problem pragmatically (by paying you to care), which is exactly what scientists do, but it doesn't show *why* the math breaks. You have to explain that break verbally. The game creates the *intuition* of the problem; the debrief must deliver the *formalism*.
