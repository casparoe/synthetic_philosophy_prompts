answer: |-
  Start with Anderson to establish the cognitive framework of community before using Hobsbawm to demonstrate the mechanical construction of tradition, anchored by the Meiji New Year case to debunk the 'fake' misconception.

  **Dependency Order**
  You need Anderson first because Hobsbawm makes no sense without it. If you start with Hobsbawm, students think the *nation* is the lie. Anderson teaches them that "imagined" just means you can't know everyone in the group, not that the group is unreal. Once they accept the nation is a mental model, Hobsbawm's "invented traditions" become the tools used to maintain that model, not proof that the nation is a scam.

  **Case Study: Meiji New Year Rituals**
  Ditch the Scottish kilt. It's too easy for polisci majors to dismiss as "costume history" or folklore that doesn't impact real power. Instead, use the Meiji state's standardization of New Year rituals in the late 1800s. The government shifted the calendar from lunar to solar and standardized shrine visits to create a unified national time. This carries both ideas: it's "imagined" because everyone celebrates simultaneously without knowing each other (Anderson), and "invented" because the state formalized specific practices to build loyalty (Hobsbawm). It shows engineering, not just dress-up.

  **Misconception Map**
  1.  **"Imagined means false consciousness" (Min 0-10):** Hit this while defining Anderson. Ask if their bank account is fake because banking is a socially constructed system. If the money works, the imagination is real enough.
  2.  **"Invented means recent fabrication" (Min 10-20):** Hit this when introducing Hobsbawm. Clarify that "invented" means "formalized," not "lied about." The Meiji New Year wasn't made up from nothing, but the *rules* were engineered recently to serve modern state needs.
  3.  **"Nationalism is just elite propaganda" (Min 20-35):** Hit this during the case study. Show that regular people adopted Meiji rituals because it solved coordination problems, not just because elites said so. It's bottom-up acceptance of top-down design.

  **What I'm Leaving Out**
  Skip Gellner entirely. Tell them you're doing this because his modernization theory overlaps too much with Anderson for a 45-minute section and muddies the "construction vs. fabrication" distinction you're targeting. (Also, I spotted the "definately" typo in your prompt, but no stress).

  **Closing Question**
  "If a tradition is socially constructed to create cohesion, does knowing its origin story weaken its political power, or just explain how it works?" This forces them to separate "arbitrary fabrication" (doesn't matter) from "socially constructed" (still matters).
