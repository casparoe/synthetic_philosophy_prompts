  ### Design Logic & Brainstorming
  *   **Goal:** Create a thought experiment that isolates the metaphysics of social objects (collectives) across possible worlds.
  *   **Constraint:** Must be one paragraph for the scenario. Must avoid classic examples (Ship of Theseus, Nixon, Statue/Clay).
  *   **Core Conflict:** Kripke (Transworld Identity via Essential Properties) vs. Lewis (Counterpart Theory via Similarity).
  *   **Setup:** 
      *   **Actual World (@):** Static Drift exists with Founders A+B + Charter v1.
      *   **World 1 (W1):** Founders leave, New Members join + Charter v1 remains. (The Test Case).
      *   **World 2 (W2):** Charter changed + Name stolen. (The Control Case).
  *   **Kripkean Move:** 'Static Drift' rigidly designates the entity defined by Charter v1. If Charter v1 exists, the entity exists. Members are accidental.
  *   **Lewisian Move:** Objects are world-bound. W1-Static Drift is a distinct object that resembles @-Static Drift closely (counterpart). W2-Static Drift resembles it less. No strict identity across worlds.
  *   **The "Weird" Factor:** Kripke's view implies a social group can be *literally identical* despite total human turnover, which feels spooky. Lewis's view implies nothing is literally identical across worlds, which feels linguistically awkward. I'll frame the Lewisian attack on Kripkean essentialism as the "weird" defense because it challenges the intuition that the label "survives."
  *   **Collapse Condition:** If the charter isn't essential, Kripke loses the anchor for identity (since members changed). Lewis just loses a similarity weight.

  ***

  ### The Scenario: Static Drift
  In the actual world, Static Drift is a worker-owned record label founded by Alice and Bob under an immutable algorithmic charter that dictates profit splits and release schedules. In World W1, Alice and Bob quit after the first year, replaced by Charlie and Dave, but the algorithmic charter remains unedited and the back catalog is managed under the original pseudonym. In World W2, a corporate entity buys the trademark, fires the original founders, rewrites the charter to prioritize shareholder profit, but continues releasing music under the Static Drift name.

  ### The Breakdown

  **Kripke-Style Transworld Identity**
  For the Kripkean, 'Static Drift' is a rigid designator. It picks out the same entity in every possible world where that entity exists. The question is: what makes Static Drift *Static Drift*? If we accept the premise that the **charter is essential** to the collective's identity (while members are accidental), then the label in W1 is **literally identical** to the actual label. The humans are just contingent vessels; the "soul" of the label is the governance structure. In W2, the charter is broken, so the entity ceases to exist there, even if the name remains.

  **Lewis-Style Counterpart Theory**
  For the Lewisian, objects are world-bound. The Static Drift in the actual world exists only here. The Static Drift in W1 is a distinct concrete particular. However, because the W1 label shares the crucial features (charter, catalog, function) with the actual label, it counts as a **counterpart**. It's not *the same* object numerically, but it's the closest match in that world. In W2, the counterpart relation is weak because the charter (a key similarity metric) is gone, even if the name matches.

  ### The Divergence & Collapse
  The exact feature causing divergence is the **commitment to cross-world identity**. Kripke allows an object to be wholly present in multiple worlds via essential properties; Lewis denies this, reducing cross-world talk to similarity relations between distinct objects. 

  If we drop the **charter-continuity condition**:
  *   **Kripke collapses:** Without the charter as an essential property, the Kripkean loses the anchor for transworld identity. Since the members changed in W1, if the charter doesn't matter, there's no essential property left to ground the claim that W1-Static Drift is *identical* to Actual-Static Drift. The identity claim fails.
  *   **Lewis adjusts:** The Lewisian doesn't collapse; they just recalibrate. If the charter doesn't matter, they shift the similarity weighting to members or name. The counterpart relation might weaken or strengthen based on new criteria, but the metaphysical framework holds.

  ### The Attack
  Here's the honest hit from the **Lewisian defender** (since claiming strict identity across worlds despite total member turnover is the metaphysically "heavier" claim):

  "Look, your Kripkean intuition is mystifying a social contract. You're treating 'Static Drift' like it has a hidden metaphysical glue—the charter—that survives even when every single human involved is different. That's spooky. In W1, you have a new group of people running a similar show. Calling it 'literally identical' to the original label ignores the fact that collectives are constituted by their members. I'm not saying W1-Static Drift isn't related to the actual one; I'm saying identity is too strict a bucket. You're conflating 'close enough to count for legal purposes' with 'numerically one object.' Drop the essentialism. It's just similarity, and once you admit that, you realize you're arguing about degrees of resemblance, not magic persistence."
