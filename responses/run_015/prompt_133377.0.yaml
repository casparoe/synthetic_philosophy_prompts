answer: |-
  Here is the translation of statutory interpretation into the vocabulary of protocol specification and maintenance, followed by the application to your cases, the residue report, and the analysis of institutional authority.

  ### I. Core Translation: The Interpretation Stack

  **The Statute** is the **Protocol Specification (v1.0)**. It is the serialized contract published to the public.
  **The Legislature** is the **Maintainer Team / Standards Body**. They hold the write-access to the spec repository.
  **The Court** is the **Implementer / Runtime**. They consume the spec and produce behavior (judgments) in specific environments.
  **The Citizen/Regulated Party** is the **Client Library / Service Consumer**.

  **Textualism** maps to **Strict Spec Compliance**.
  *   **Philosophy:** The serialized specification document is the single source of truth.
  *   **Method:** Parse the text using standard grammar and defined types. If the spec says `uint8`, passing a `uint16` is a violation, even if the value fits.
  *   **Justification:** Predictability. Consumers must be able to rely on the interface contract without reading the maintainer's private emails or guessing intent. If the spec is wrong, the Maintainer must release a patch (amendment); the Implementer should not fork the logic.

  **Purposivism** maps to **Intent-Based Implementation**.
  *   **Philosophy:** The Specification is a lossy serialization of the Maintainer's design intent.
  *   **Method:** If the text conflicts with the Design Document, Commit Messages, or Reference Implementation, prioritize the intent. Treat obvious typos as compiler warnings, not errors.
  *   **Justification:** Robustness. The goal is a functioning system (justice), not a syntactically correct one. A literal reading that breaks the system (absurdity) is a bug in the spec, not a feature of the law.

  **Legislative History** maps to **Commit History, Design Docs, and Mailing List Archives**.
  **Scrivener's Error** maps to **Typo in Spec / Broken Link / Wrong Constant**.
  **Stare Decisis** maps to **Bug-for-Bug Compatibility / Deprecation Policy**. Once an implementation behavior is established in production, changing it requires a major version bump or a long deprecation cycle, even if the original behavior was non-compliant.
  **The "Reasonable Person"** maps to the **Reasonable Implementer**. How would a competent engineer, familiar with the stack, interpret this API contract?

  ---

  ### II. Case Studies

  #### Case A: The Dangling Cross-Reference
  *The Scenario:* Spec v1.0, Section 4.2 says `on_error` triggers `Code_E` (15-year penalty). Commit history shows `Code_E` was meant to be `Code_C` (minor penalty). Reference Impl uses `Code_C`. Some clients rely on `Code_E` for logic.

  **Textualist (Strict Spec Compliance):**
  *   **Action:** Enforce `Code_E`.
  *   **Reasoning:** The published spec is the API contract. Clients are responsible for handling the defined interface. If they relied on a behavior that contradicts the spec (or if the spec is clear but harsh), that is a breaking change the Maintainer must address in v1.1. Until v1.1 is released, the Implementer (Court) must execute the spec as written.
  *   **Engineering Term:** "Spec is the contract. If the Maintainer messed up, they owe the users a migration path, but the runtime cannot silently patch the binary."

  **Purposivist (Intent-Based Implementation):**
  *   **Action:** Enforce `Code_C`.
  *   **Reasoning:** The cross-reference is a dangling pointer. The Reference Implementation and Commit Messages confirm the intended logic. Treating this as a fatal error causes a system crash (absurdity).
  *   **Engineering Term:** "This is a known bug in v1.0. We are hotfixing the runtime to match the Reference Impl. Clients relying on the bug are relying on undefined behavior."

  **The Conflict:** This is a debate over **Backwards Compatibility vs. Spec Correctness**. The Textualist prioritizes the stability of the interface definition (Maintainers must fix it formally). The Purposivist prioritizes the stability of the running system (Implementers should fix it locally).

  #### Case B: The Unforeseen Transport Layer
  *The Scenario:* Spec requires `SMTP` (First-Class Mail). Lender uses `WebSocket` (Email). Message delivered and authenticated. Client (Debtor) rejects it, claiming `SMTP` headers were part of the security model.

  **Textualist (Strict Spec Compliance):**
  *   **Action:** Reject the notification.
  *   **Reasoning:** The interface signature is `notify(method: SMTP)`. You passed `notify(method: WebSocket)`. Type mismatch. The specific properties of `SMTP` (latency, physical trail) may be side-effects the spec relied upon, even if not explicitly documented in the "Purpose" section.
  *   **Engineering Term:** "Strict type checking. You cannot substitute an interface unless the spec explicitly allows polymorphism. The latency of SMTP might be a feature, not a bug."

  **Purposivist (Intent-Based Implementation):**
  *   **Action:** Accept the notification.
  *   **Reasoning:** The functional requirement was "Authenticated Delivery to Last Known Address." `WebSocket` satisfies the acceptance tests better than `SMTP`.
  *   **Engineering Term:** "Duck typing. If it quacks like authenticated notice, it's valid. The transport layer is an implementation detail, not part of the public API contract."

  **The Conflict:** This is a debate over **Interface Rigidity vs. Functional Equivalence**. The Textualist argues the *method* is part of the contract. The Purposivist argues the *outcome* is the contract.

  ---

  ### III. Residue Report

  | Legal Item | Engineering Counterpart | Translation Quality | Analysis of Defect vs. Indeterminacy |
  | :--- | :--- | :--- | :--- |
  | **Statute** | Protocol Specification | **Clean** | Both are serialized contracts intended to govern behavior. |
  | **Legislature** | Maintainer Team | **Distortion** | **Defect of Vocabulary.** Maintainers are assumed competent/technical. Legislators are political actors who may *intend* ambiguity to pass a vote. Mapping Legislature to Maintainer smuggles in an assumption of coherent intent that often doesn't exist. |
  | **Court** | Implementer / Runtime | **Distortion** | **Defect of Vocabulary.** Implementers can choose *not* to implement. Courts *must* decide. An engineer can throw `NotImplemented`; a judge cannot refuse to judge (*non-liquet*). |
  | **Textualism** | Strict Spec Compliance | **Clean** | Both prioritize the serialized artifact over inferred intent. |
  | **Purposivism** | Intent-Based Implementation | **Clean** | Both prioritize the Design Doc/Reference Impl over the serialized artifact. |
  | **Legislative History** | Commit Messages / Design Docs | **Clean** | Both are pre-release artifacts used to infer intent. |
  | **Stare Decisis** | Bug-for-Bug Compatibility | **Clean** | Both prioritize existing deployment behavior over theoretical correctness. |
  | **Absurdity Exception** | Catastrophic Failure / Panic | **Distortion** | **Sign of Legal Indeterminacy.** In code, a panic is obvious. In law, "absurd" is a value judgment. One camp's "absurdity" is another's "hard but necessary constraint." |
  | **Sovereignty** | Root Access / Merge Rights | **No Counterpart** | **Defect of Vocabulary.** In engineering, you can fork the project. In law, you cannot fork the State. The "Maintainer" has a monopoly on force that no open-source maintainer possesses. |
  | **Public Welfare** | System Uptime / Security | **Distortion** | **Defect of Vocabulary.** "Working software" is a narrow metric. Law optimizes for justice, equity, or order, which may require "crashing" a specific actor for the health of the whole. |

  **On the "Competent Maintainer" Assumption:**
  You are correct. Mapping the Legislature to a Maintainer Team assumes a **Unified Design Authority**. In open source, if the Maintainer is incompetent, the community forks. In law, if the Legislature is incompetent or captured, the "fork" is revolution. The engineering vocabulary assumes a cooperative ecosystem where all parties want the protocol to succeed. The legal ecosystem is adversarial; the "Client" (Citizen) often wants to minimize the "Server's" (State) reach, and vice versa. The engineering vocab struggles to model *bad faith* actors in the specification process.

  **On the Compiler / Test Suite:**
  Nothing in your vocabulary perfectly plays this role, which reveals a structural divergence.
  *   **The Compiler:** In law, there is no central compiler. The **Court System** acts as a distributed, Just-In-Time (JIT) compiler. It compiles the statute into a judgment only when a specific case (input) is provided.
  *   **The Test Suite:** **Precedent** acts as a regression test suite. Past cases are test vectors. If a new judgment fails a past test (precedent), it must be justified as a "breaking change."
  *   **The Exception:** You noted a court cannot throw an exception. This is critical. In engineering, `undefined behavior` is a valid state. In law, **there is no undefined behavior.** The Court *must* return a value (Guilty/Not, Liable/Not). If the spec is silent, the Purposivist Court infers a default; the Textualist Court may dismiss (return `null`), but the system cannot crash.

  ---

  ### IV. The Residual Disagreement: Meaning vs. Authority

  Having performed the translation, the residual disagreement between Textualists and Purposivists is **not** primarily about what the text means. It is a disagreement about **which institution holds the write-lock on the specification.**

  *   **The Textualist Claim:** The Maintainer (Legislature) holds the write-lock. The Implementer (Court) has read-only access. If there is a bug, the Implementer must wait for the Maintainer to push a patch (Amendment). To do otherwise is to allow the Implementer to fork the project silently, violating the separation of concerns.
  *   **The Purposivist Claim:** The Maintainer is unavailable or too slow (Legislative gridlock). The Implementer (Court) must have write-access to the runtime to prevent system failure. The Court is effectively a privileged contributor allowed to submit hotfixes to production.

  **Can your vocabulary state this difference?**
  Yes, but it requires borrowing the concept of **Permissions/Access Control**.
  *   In your world, this is a debate over **Merge Rights**.
  *   Textualists argue: "Only Maintainers can merge to `main` (Law). Implementers must run `release branches` (Interpretation) as-is."
  *   Purposivists argue: "Maintainers are blocking critical security patches. Implementers must be allowed to cherry-pick fixes into `production` (Judgment) even if they aren't in `main`."

  **Where the Vocabulary Fails:**
  Your vocabulary lacks the concept of **Legitimacy**. In engineering, if a Maintainer acts poorly, users leave (churn). In law, users cannot leave (jurisdiction). Therefore, the debate isn't just about "who can merge," but "who *should* be trusted to merge when the cost of a bug is liberty rather than downtime."

  The engineering framework assumes the goal is **System Integrity** (the code runs). The legal framework often debates **System Legitimacy** (the code is just). A Textualist accepts an unjust result to preserve the integrity of the update mechanism (Legislative supremacy). A Purposivist accepts a potentially unstable update mechanism to preserve the integrity of the outcome (Justice).

  Your vocabulary can describe the *mechanism* of the dispute (Access Control, Versioning, Hotfixing), but it cannot natively describe the *stakes* (Liberty, Coercion, Monopoly on Violence) that make the dispute intractable. To fully capture it, you would need to import the concept of **Forkability**. Law is the one protocol you are not allowed to fork. That constraint transforms a technical debate about "Spec vs. Impl" into a political debate about "Who Rules."
