      *   **Task:** Translate the legal debate on statutory interpretation (Textualism vs. Purposivism + associated concepts) into the user's vocabulary (Specs, Code, Versioning, etc.).
      *   **Specific Requirements:**
          1.  Translate the core concepts (Textualism, Purposivism, canons, etc.) into engineering terms.
          2.  Apply this translation to two specific cases (Case A: Drafting Failure/Dangling Reference; Case B: Unforeseen Technology/Method Constraint).
          3.  Provide a "Residue Report" (Table mapping legal items to engineering terms, rating the translation quality, analyzing defects vs. indeterminacy).
          4.  Address the "Compiler/Test Suite" analogy (What plays this role in law?).
          5.  Address the "Residual Disagreement" (Meaning vs. Institutional Authority) and whether engineering vocabulary can capture it.
      *   **Tone:** Professional, precise, respectful of the user's expertise, avoiding condescension or unnecessary legal jargon.
      *   **Constraint:** Do not explain basic engineering concepts back to the user.

  2.  **Deconstruct the Legal Concepts & Map to Engineering:**
      *   *Statute* -> *Protocol Specification (RFC, Standard Doc)*.
      *   *Legislature* -> *Standards Body / Maintainer Team*.
      *   *Court/Judge* -> *Implementer / Interpreter / Runtime Environment (in a social sense)*.
      *   *Textualism* -> *Strict Spec Compliance*. The text is the API contract. If the spec says `int`, you don't pass a `float`, even if it makes more sense.
      *   *Purposivism* -> *Intent-Based Implementation*. Look at the Design Doc, the PR description, the "Why". If the spec says `int` but the Design Doc clearly says "numeric value" and the reference impl uses `float`, follow the intent.
      *   *Ordinary Meaning* -> *Default Semantics of the Language/Protocol*.
      *   *Terms of Art* -> *Defined Types/Interfaces in the Spec*.
      *   *Legislative History* -> *Commit History, Mailing List Archives, Design Docs, PR Comments*.
      *   *Scrivener's Error* -> *Typo in Spec / Broken Link / Wrong Constant*.
      *   *Absurdity Exception* -> *Crash / Security Vulnerability / Catastrophic Data Loss*. If following the spec literally bricks the system, override it.
      *   *Reasonable Reader* -> *Reasonable Implementer*. What would a competent engineer reading this spec assume?
      *   *Stare Decisis* -> *Bug-for-Bug Compatibility / Deprecation Policy*.

  3.  **Analyze Case A (Drafting Failure):**
      *   *Legal:* Cross-ref points to (c), should be (e). Literal reading = 15 years (harsh). Intent = minor penalty. Some relied on the error.
      *   *Engineering:* Spec v1.0 says `error_code: 0x05` maps to `FATAL_CRASH`. Commit history shows it was meant to be `0x15` (`WARNING`). Reference impl treats `0x05` as `WARNING`. Some clients rely on `0x05` triggering a specific retry logic that assumes a crash.
      *   *Textualist (Strict Spec):* Follow the spec. `0x05` is `FATAL_CRASH`. If clients broke, they relied on undefined behavior or need to update. The spec is the contract.
      *   *Purposivist (Intent):* Follow the Reference Impl and Commit Message. It's a typo. Fix it in v1.1 but treat v1.0 as having a known bug.
      *   *Conflict:* Backwards compatibility (reliance) vs. Spec Correctness.

  4.  **Analyze Case B (Unforeseen Technology/Method):**
      *   *Legal:* Statute says "first-class mail". Lender used "email". Debtor got it. Debtor argues "mail" was the point (proof of sending/slowness), not just notice.
      *   *Engineering:* Spec says `POST /notify` via `SMTP`. Lender uses `WebSocket` (faster, authenticated). Receiver gets the message. Receiver argues `SMTP` was required for the *audit trail* or *rate limiting* inherent to the protocol, not just delivery.
      *   *Textualist:* Spec says `SMTP`. You used `WebSocket`. Violation. Invalid notification.
      *   *Purposivist:* Purpose was "reliable authenticated notice". `WebSocket` achieved that. Compliance met.
      *   *Conflict:* Interface rigidity vs. Functional equivalence.

  5.  **Drafting the Residue Report (Table):**
      *   Need to evaluate "Clean", "Distortion", or "No Counterpart".
      *   *Key Insight:* Law lacks a central compiler. Courts are distributed interpreters.
      *   *Key Insight:* "Sovereignty/Authority" doesn't map perfectly to "Maintainers". Maintainers can fork; Legislatures generally can't be forked (easily).
      *   *Key Insight:* "Public Welfare" vs. "Working Software".

  6.  **Addressing the "Compiler/Test Suite" Question:**
      *   In law, there is no central compiler.
      *   Closest thing: *Enforcement Mechanism* (Police/Regulators) or *Precedent* (accumulated test cases).
      *   But a court *must* return a value (judgment), it can't throw `NotImplementedException`.
      *   This is a critical divergence. Code can be undefined; Law generally cannot (no non-liquet).

  7.  **Addressing the "Residual Disagreement" (Meaning vs. Authority):**
      *   Is it about what the text means? Or who gets to fix it?
      *   In Engineering: If the spec is wrong, the Maintainer fixes it in v2.0. Until then, Implementers decide whether to follow Spec or Reference Impl.
      *   In Law: If the statute is wrong, the Court interprets it (effectively rewriting) OR the Legislature amends it.
      *   The Engineering vocab struggles with *Binding Authority*. A maintainer can say "v2.0 fixes this." A Court says "This *is* the law now."
      *   The Engineering vocab assumes a cooperative ecosystem (open source/standards). Law is adversarial.
      *   Need to highlight that "Who fixes it" is the real fight. Textualists say "Legislature fixes it (Maintainer releases patch)." Purposivists say "Court fixes it (Implementer patches runtime)."

  8.  **Refining the Translation (Self-Correction/Polishing):**
      *   *Check:* Did I explain semantic versioning? No, user knows it.
      *   *Check:* Did I explain textualism? No, translated it.
      *   *Tone Check:* Ensure I don't sound like I'm teaching law. I'm mapping domains.
      *   *Specific Constraint:* "Tell me also whether anything in my vocabulary can play the role that a compiler or a test suite plays in yours." -> Need to be honest: Nothing does this perfectly. Precedent is like a log of past runtime errors, but not a compiler.
      *   *Specific Constraint:* "My suspicion is that mapping the legislature onto maintainers smuggles in that the authors were competent..." -> Address this directly in the Residue Report.

  9.  **Final Review against User Prompt:**
      *   Translate concepts? Yes.
      *   Test against Case A & B? Yes.
      *   Residue Report Table? Yes.
      *   Compiler/Test Suite analogy? Yes.
      *   Residual Disagreement (Meaning vs. Institution)? Yes.
      *   Vocabulary limitations? Yes.

  10. **Constructing the Output:** (Drafting the response following the structure derived above.)
      *   *Intro:* Acknowledge the parallel.
      *   *Core Translation:* Define Textualism/Purposivism in spec terms.
      *   *Case Studies:* Apply the translation.
      *   *Residue Report:* The Table + Analysis.
      *   *Compiler Analogy:* The "Runtime" problem.
      *   *Final Question:* Meaning vs. Authority.

  *(Self-Correction during drafting)*: Be careful with "Reference Implementation." In law, there isn't always one. In protocols, there often is. I need to make sure I distinguish between the *Official Reference Impl* (authoritative) and *Popular Implementations* (precedent).
  Also, the "Debtor" in Case B is acting like a strict client library validating input. The "Lender" is the service provider.
  In Case A, the "Implementers" who followed the broken pointer are like clients relying on a bug.

  Let's refine the "Compiler" analogy. In law, the *Court* is the runtime. But the *Rule of Law* is the type system? No, that's too abstract. The *Enforcement* is the runtime. If you violate the law, the state throws an exception (jail/fine). But the Court *interprets* before enforcement. So the Court is the JIT compiler? It compiles the statute into a specific judgment at runtime.

