prompt: |-
  Write a deadpan parody, approximately 600 words, formatted as a peer-review evaluation form for an imaginary interdisciplinary journal titled "Gödelian Studies," which publishes attempts to apply Gödel's first and second incompleteness theorems to non-mathematical domains such as legal theory, organizational management, aesthetics, and cognitive science. The form should include structured sections—"Formal System Specification," "Axiomatization Check," "Consistency and Omega-Consistency," and "Incompleteness Claim"—with evaluation rubrics that quietly embed the actual technical conditions of Gödel's theorems: recursive axiomatizability, sufficient arithmetical strength (representation of primitive recursive relations), the distinction between syntactic unprovability and semantic falsehood, and the difference between consistency and omega-consistency. The satire should arise from the bureaucratic rigor with which reviewers assess manifestly inappropriate applications—for example, rating whether a manuscript on corporate team-building has correctly identified its formal language, whether its axioms are recursively enumerable, and whether its claim of having achieved "complete ethical governance" violates the second incompleteness theorem unless the system can prove its own consistency. Include at least one invented reviewer comment that demonstrates precise internal consistency with Gödel's results—such as observing that an author who asserts a "complete and consistent" legal framework must either have failed to formalize the axioms or have rendered them non-recursively enumerable—without breaking the deadpan bureaucratic voice. The piece should be legible to a reader unfamiliar with formal logic, but should reward a specialist with the recognition that every listed evaluation criterion corresponds to a genuine condition or a genuine common misapplication, including the conflation of epistemic humility with syntactic incompleteness, the application of the theorem to non-formalized "systems" like culture or consciousness, and the error of treating the theorems as statements about absolute truth rather than about provability within a specific formal language. Do not include bibliographies, citations, or references to specific living scholars.
