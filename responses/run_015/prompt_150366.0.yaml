  Hey everyone. For those who don't know me, I'm [Your Name], and I've had the luck of being [Friend's Name]'s friend for a while now. I know we got a mixed crowd here—some of you are here for the linguistics, and some of you are here because you heard there's cake. Don't worry, I'm not gonna give a lecture. There won't be a quiz.

  But since we're honoring a linguist, I wanted to borrow one of his favorite ideas to talk about what's happening today. There's this concept from Douglas Hofstadter about how messages have three layers. You got the **Frame Message**, which is the physical thing itself—the medium. Then the **Outer Message**, which is the literal words or content. And then the **Inner Message**, which is the real meaning you only get when you break out of the frame.

  This hit home for me pretty hard last month. My dad passed away, and I've been replaying his last voicemail. Literally, the outer message was just three words: "Call me back." But once he was gone, the frame changed. And suddenly the inner message wasn't about a phone call. It was "I'm scared" and "I love you" and "I don't want to go."

  I think about that because [Friend's Name] spent 40 years teaching us that the literal words are rarely the whole story. He taught us that meaning always escapes the frame.

  And that brings me to today. To the **Frame Message**: This is a retirement party. There's a cake, there's punch, and there's a plaque.
  To the **Outer Message**: After 40 years, [Friend's Name] is stopping work. He's not going to the office. He's not grading papers on syntax at 2 AM.

  But if we stop there, we're missing the point. We'd be stuck on the surface structure.
  The **Inner Message** of today isn't that he's stopping. It's that the transmission continues. Retirement looks like an end frame, but just like my dad's voicemail, the real signal isn't bound by the medium. [Friend's Name] isn't just leaving a job; he's leaving behind a way of listening. He taught us to look past the grammar to the human underneath. He taught us that connection is the only thing that doesn't retire.

  So, while the frame says "career over," the inner message says "you're still teaching us."

  I'm gonna raise a glass to the Inner Message. To [Friend's Name]—may your next chapter be full of signals we're all lucky enough to receive. Cheers.
