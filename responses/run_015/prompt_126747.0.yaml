      *   **Constraint 3 (Counterfactuals):** Keep separate: (A) Preservation vs. Abandonment, (B) Preservation vs. Productive Conversion, (C) Preservation vs. Climate Regime Shift. Pick a headline case.
      *   **Constraint 4 (Metrics):** Distinguish Sentience Density (subjects/productivity) vs. Welfare Quality (per subject-year). Avoid the "abundance trap."
      *   **Constraint 5 (Working Hypothesis):** Early-successional/modified = small, high-fecundity, high juvenile mortality. Late-successional = fewer, larger, longer-lived.
      *   **Deliverables:**
          1.  6-7 Research Questions (prioritized, effort allocation summing to 1, defended by criteria: impact on sign/magnitude, tractability, neglectedness, dependency).
          2.  Dependency structure (which questions block others).
          3.  2-3 Dropped Questions (interesting but cut).
          4.  Trigger conditions for re-ranking (first 18 months).
          5.  Provisional Answer (Sign, rough size, confidence, single crux).

  2.  **Analyze the Framing Commitments:**

      *   *Sentience-weighted/Time-integrated:* This implies we need long-term ecological succession models, not just current biomass estimates. We need to integrate welfare over decades/centuries.
      *   *Non-identity:* We are comparing World A (Intact) vs. World B (Destroyed). We are not saving specific animals; we are choosing which *possible* animals get to exist and what their lives are like. This leans into Total Utilitarianism (or similar population ethics) rather than Person-Affecting views. The program needs to explicitly adopt a population ethic (likely Total View given the "total quantity of suffering" aim).
      *   *Counterfactuals:* (B) Productive Conversion is usually the real-world policy decision (logging for timber, clearing for ag). (A) is theoretical. (C) is specific to climate-vulnerable zones. (B) is the most policy-relevant "headline case."
      *   *Abundance Trap:* We need to model $W = \int (N(t) \times w(t)) dt$, where $N$ is sentience density and $w$ is net welfare per subject. High $N$ with very negative $w$ could outweigh low $N$ with positive $w$.
      *   *Working Hypothesis:* r-selected (disturbed) vs. K-selected (intact). r-selected usually implies high mortality (suffering?) but short lives. K-selected implies longer lives, potentially more predation/starvation events over time, but lower density.

