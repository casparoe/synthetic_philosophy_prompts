answer: |-
  The decision by the British and French governments to shepherd the Concorde from its precarious position in 1971 to its entry into service in 1976 stands as one of the most cited examples of the sunk-cost fallacy in public policy. By standard economic metrics, the project was a catastrophe: development costs had ballooned, the 1973 oil crisis had shattered the economics of supersonic travel, and commercial orders had evaporated following the cancellation of the American Boeing 2707. Yet, London and Paris persisted. To analyze this episode is to test the limits of rational choice theory. It forces the question: Is the injunction against honoring sunk costs a universal norm of rationality, or is it a heuristic that fails when it encounters the complexities of statecraft, collective identity, and strategic signaling?

  ### I. The Decision Structure: Agents, Options, and Payoffs

  To evaluate the rationality of the decision, we must first map the structure of the choice environment between 1971 and 1976. The agents were not unitary maximizers but interdependent state actors bound by the 1962 Anglo-French Treaty. The British government (oscillating between Conservative and Labour administrations) and the French government (under Pompidou and later Giscard d'Estaing) faced a joint decision matrix where unilateral action was structurally constrained.

  At the critical junctures—specifically the 1971 cancellation of the Boeing 2707 and the 1973 oil shock—the live options were binary but asymmetrical:
  1.  **Cancellation:** Unilaterally or jointly terminate the program. This would trigger penalty clauses within the 1962 Treaty, requiring compensation to the partner nation. It would also entail the immediate write-off of all prior investment and the dismantling of the specialized industrial supply chain.
  2.  **Continuation:** Commit to escalating public subsidies to complete certification and enter service, despite the absence of firm commercial orders beyond the state-owned flag carriers (Air France and British Airways).

  The payoff structure was multidimensional.
  *   **Fiscal Payoffs:** Clearly negative. The marginal cost of completion exceeded the expected marginal revenue from ticket sales.
  *   **Treaty Payoffs:** Cancellation carried specific financial penalties and diplomatic friction costs.
  *   **Symbolic Payoffs:** "Great Power" status, technological prestige, and the validation of European cooperation independent of the United States.
  *   **Reputational Payoffs:** Signaling reliability to future industrial partners (crucial for the nascent Airbus consortium) and maintaining domestic political capital regarding industrial employment.

  ### II. The Standard Critique: Forward-Looking Rationality

  The standard economic critique applies the principle of forward-looking rationality: rational agents maximize expected utility from the present moment onward; past expenditures are "sunk" and therefore decision-irrelevant.

  From this vantage point, the Concorde decision between 1971 and 1976 is a paradigmatic failure of rationality. By 1973, the money spent on development was gone. The only relevant calculation was whether the *future* costs of certification and production would be outweighed by *future* revenues. With fuel prices quadrupling and no commercial orders on the books, the expected net present value of continuation was deeply negative. The Boeing 2707 cancellation removed the competitive pressure that might have justified finishing the race; Concorde was now a monopoly in a market that did not exist.

  Under this framework, the governments were "throwing good money after bad." They allowed the emotional weight of the £1.3 billion already spent (the sunk cost) to dictate the commitment of further funds. The decision appears to be driven by a psychological aversion to realizing a loss—a desire to avoid the admission that the prior expenditure was wasted—rather than a cold assessment of future utility. This aligns with the classic definition of the sunk-cost fallacy: allowing irrecoverable costs to influence current choices.

  ### III. A Nuanced Framing: Identity and Reputational Commitment

  However, the standard critique relies on a narrow model of agency that treats the state as a firm and utility as purely fiscal. A more robust philosophical framing considers the state as an entity engaged in the construction of *collective practical identity* and *reputational commitment* within a repeated strategic game.

  **Collective Practical Identity:**
  States, like individuals, act to maintain a coherent self-conception. For post-war Britain and France, technological sovereignty was a constitutive element of national identity. To cancel Concorde was not merely to stop a project; it was to enact a narrative of decline. In this light, continuation served a *constitutive end* rather than an instrumental one. The value was not in the profit generated by the aircraft, but in the act of being the kind of nation that completes complex technological endeavors. The expenditure was not "honoring sunk costs" but investing in the maintenance of a national self-image that had instrumental value for domestic cohesion and international standing.

  **Reputational Commitment in Repeated Games:**
  International relations is a repeated game. The 1962 Treaty was not an isolated contract but a signal of commitment to the broader project of European integration. Unilateral withdrawal would have imposed "exit costs" that were not sunk, but *future* liabilities. Breaking the treaty would damage credibility with future partners. Indeed, the Airbus consortium was in its formative stages during this period. If France and Britain proved unreliable partners on Concorde, the expected utility of future collaborations (like Airbus) would diminish. Thus, the subsidies paid between 1971 and 1976 can be reframed not as payments for a loss-making aircraft, but as premiums paid on an insurance policy for European industrial cooperation.

  Under this framing, the decision is not irrational; it is simply optimizing for a different utility function. The governments were purchasing reputational capital and identity coherence. The "sunk cost" of development became a platform for signaling resolve to the United States (which had quit) and to their own industrial bases.

  ### IV. Evaluating the Framing: Explanatory Power vs. Artificial Fit

  Does this richer framing rescue the decision from the charge of irrationality, or does it merely rationalize it post hoc?

  **Where the Framing Explains:**
  This approach successfully accounts for features the standard fallacy narrative misses. Most critically, it distinguishes between *sunk costs* (money spent) and *exit costs* (penalties for stopping). The 1962 Treaty made cancellation expensive in *future* terms (diplomatic fallout, legal penalties, loss of trust). Therefore, continuing was not necessarily honoring the past, but avoiding specific future costs of withdrawal. Furthermore, it explains the timing: the decision to push through to service (1976) coincided with the need to validate the Airbus project. The "loss" on Concorde can be viewed as a cross-subsidization for the success of the wider European aerospace strategy, a logic invisible to a project-level cost-benefit analysis.

  **Where the Framing Forces a Fit:**
  However, this framing risks collapsing the distinction between rational strategy and political path-dependence. There is evidence that the decision was driven less by a calculated strategy for Airbus and more by bureaucratic inertia and the inability of coalition governments to absorb the political shock of cancellation. If the decision-makers did not explicitly weigh reputational capital against fiscal loss, but simply drifted forward due to institutional momentum, labeling this "constitutive rationality" is an artificial fit. It attributes strategic depth to what may have been "muddling through."

  Moreover, this framing challenges the definition of the fallacy itself. If we allow "prestige" and "identity" to count as valid payoffs that justify escalating commitment, does the concept of the sunk-cost fallacy lose its bite? We risk creating a "just-so" story where any irrational persistence is retroactively fitted with a symbolic utility. The danger is that we dissolve the category of irrationality entirely by expanding the utility function to include whatever the agent happened to choose.

  ### V. Conclusion: The Nature of the Fallacy

  The Concorde episode suggests that the sunk-cost fallacy is not a universal norm of rational agency, but a context-dependent heuristic that applies primarily to closed, instrumental systems (like private firm investment) rather than open, constitutive systems (like statecraft).

  In private finance, the goal is profit; past expenditure does not generate future profit. In public strategy, the goal is often legitimacy, stability, or identity; past expenditure *does* generate future legitimacy if it is visibly honored. To abandon a project is to signal instability; to continue is to signal resolve.

  Therefore, the Concorde decision reveals that the charge of "irrational honoring of sunk costs" is often a misdiagnosis of a genuinely different form of practical reasoning. It mistakes *reputational investment* for *resource misallocation*. However, this does not render the fallacy useless. It remains a vital check against emotional attachment to failed projects. But the Concorde case demonstrates that in the public sphere, what looks like a fallacy may actually be the price of maintaining the social and diplomatic contracts that make future cooperation possible. The fallacy is real, but its application requires a prior determination of whether the agent is acting as a profit-maximizer or a identity-constitutor. In the case of Concorde, London and Paris chose the latter, paying a fiscal premium to secure a symbolic dividend that, while unquantifiable, was central to their strategic self-conception.
