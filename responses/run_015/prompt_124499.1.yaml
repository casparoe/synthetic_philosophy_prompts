          *   Collapsing Distinctions: If *everything* (prestige, identity) is a payoff, does "sunk cost" lose meaning? We risk rationalizing *any* irrational behavior by inventing hidden utilities.
          *   Agency Model: The standard fallacy assumes a specific model (homo economicus). If agents are "homo politicus," the norm changes.

  6.  **Part 5: Conclusion on the Fallacy:**

      *   Is it universal? No.
      *   Is it a heuristic? Yes, for private firms.
      *   Is it a misdiagnosis? In public/strategic contexts, what looks like sunk-cost fallacy is often *reputational investment* or *identity maintenance*.
