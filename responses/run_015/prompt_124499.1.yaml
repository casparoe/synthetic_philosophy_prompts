          *   1974-75: No commercial orders (only state-owned airlines Air France/British Airways forced to take them).
          *   1976: Entry into service.
      *   *Options:*
          *   A: Cancel. Pay treaty penalties. Admit defeat. Scrap prototypes.
          *   B: Continue. Escalating subsidies. Complete certification. Enter service.
      *   *Payoffs:*
          *   *Fiscal:* Massive negative ROI (known).
          *   *Symbolic:* Technological prestige, "Great Power" status, European cooperation.
          *   *Reputational:* Reliability as a treaty partner, signal to future collaborators (Airbus, etc.).
          *   *Political:* Jobs, industrial base retention.

  3.  **Part 2: The Standard Forward-Looking Critique:**

      *   *Principle:* Rational agents maximize expected utility from *this point forward*. Past expenditure (£1.3bn+ by 1973) is gone.
      *   *Application:* By 1973, marginal cost of completion > marginal expected revenue. Oil made supersonic travel niche. No orders.
      *   *Verdict:* Irrational. Throwing good money after bad. Classic sunk-cost fallacy.

  4.  **Part 3: Nuanced Theoretical Framing (Identity & Reputation):**

      *   *Concept 1: Collective Practical Identity.* Nations aren't just firms. They have a "self-conception." Britain/France saw themselves as technological leaders. Abandoning Concorde = admitting decline.
      *   *Concept 2: Reputational Commitment (Repeated Games).* International relations is a repeated game. Breaking the 1962 Treaty damages credibility for *future* projects (like Airbus or nuclear cooperation).
      *   *Constitutive Ends:* The project wasn't just to make money; it was to *be* the kind of nation that finishes what it starts. The value is in the act of continuation itself, not just the output.

