          5.  *Conclusion:* What does this say about the sunk-cost fallacy itself? (Universal norm, heuristic, or misdiagnosis?)

  2.  **Part 1: Mapping the Decision Structure (1971-1976):**

      *   *Agents:* UK (Labour/Conservative governments) and France (Pompidou/Giscard d'Estaing). Not unitary; internal friction (Treasury vs. Industry/Foreign Office). Interdependent via the 1962 Anglo-French Treaty.
      *   *Critical Junctures:*
          *   1971: Boeing cancels 2707. Concorde is now the only SST.
