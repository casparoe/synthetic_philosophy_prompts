      2.  **The Loop:** Marshall uses the Constitution to strike down the Act. But the authority to strike down the Act (Judicial Review) isn't in the Constitution. It's asserted by the Court. So the Operator defines the Meta-rule.
      3.  **Inviolate Level:** Supposed to be the People/Text. But the Text is silent on review. Marshall fills the silence. The Paper is drawn by the Hand.
      4.  **Hofstadter's Prediction:** Hierarchies leak. Formal systems can't prove their own consistency without stepping outside themselves. Marshall steps outside the text to validate the text.
      5.  **Conclusion:** Law doesn't preserve an inviolate level. It manages the loop through fiction (interpretation vs. creation).

