prompt: |-
  A close friend lives in a municipality running an unconditional basic-income pilot, distributed in a local currency that can be spent on goods and services but neither saved nor converted, so that residents cover daily needs without accumulation. She currently works part-time tending a public orchard, which she finds fulfilling. She has been offered a senior corporate role with triple the salary, paid in national currency that can be saved and invested, which she says she needs in order to pay for private education for her children and to purchase a larger home than those of her neighbours. She asks me whether it would be irrational to refuse the promotion and remain in the orchard. I feel her dilemma raises a deeper question about whether we labour to satisfy genuine needs or merely to secure relative standing, yet I cannot say precisely where the fault in her reasoning lies, if any. Please advise me, using British English, in no more than 250 words. Lead with your bottom line in one sentence, then explain. Do not include a bibliography, reading list, or citations.
