answer: |-
  Van Fraassen's Reflection Principle posits a diachronic coherence constraint requiring an agent's current credence in a proposition $A$, conditional on their future credence in $A$ being $r$, to equal $r$. Formally, $P_1(A \mid P_2(A) = r) = r$. This principle is standardly defended via a Dutch-strategy argument suggesting that violations render an agent exploitable. However, Reflection should be abandoned as a primitive norm. In cases where it holds, it is merely a theorem of Conditionalization; in cases where it diverges from Conditionalization, it is false. The Dutch-strategy argument does not reveal a defect in the agent's prior credences, but rather in a policy of deferring to a future self known to be compromised.

  Consider the case of Alix. At $t_1$, her credence function is $P_1$, with $P_1(A) = 0.5$. She anticipates that at $t_2$, she will observe a test result $R \in \{+, -\}$ with known likelihoods: $P_1(R=+ \mid A) = 0.9$ and $P_1(R=+ \mid \neg A) = 0.1$. However, a drug will alter her prior for $A$ to a value $q$, drawn from a distribution with density $f(q)$ supported on $(0, 1)$, independent of $A$ and $R$. At $t_2$, Alix updates on $R$ using Bayes' rule with prior $q$. Her resulting credence $P_2(A)$, denoted $p_2$, is $9q/(1 + 8q)$ if $R=+$ and $q/(9 - 8q)$ if $R=-$. Alix at $t_1$ knows this entire setup. To evaluate Reflection, we must calculate $P_1(A \mid p_2 = r)$. Since $p_2$ is a continuous random variable determined by $R$ and $q$, we condition on the density. The event $p_2 = r$ occurs via two mutually exclusive paths: either $R=+$ with $q = q_+(r) \equiv r/(9 - 8r)$, or $R=-$ with $q = q_-(r) \equiv 9r/(1 + 8r)$.

  Using Bayes' theorem for densities, $P_1(A \mid p_2 = r)$ is proportional to the likelihood of $A$ generating the density at $r$. The density of $p_2$ at $r$ given $A$ is $0.9 f(q_+) |J_+| + 0.1 f(q_-) |J_-|$, where $J$ represents the Jacobian of the transformation from $q$ to $r$. The density given $\neg A$ is $0.1 f(q_+) |J_+| + 0.9 f(q_-) |J_-|$. Since $P_1(A) = P_1(\neg A) = 0.5$, the posterior is the ratio of the first expression to their sum. This yields $P_1(A \mid p_2 = r) = \frac{0.9 K_+ + 0.1 K_-}{K_+ + K_-}$, where $K_{\pm}$ incorporates the density and Jacobian for each path. Reflection requires this value to equal $r$. However, the expression is a weighted average of 0.9 and 0.1, bounded strictly between them, whereas $r$ ranges over $(0, 1)$. Unless the distribution of $q$ is degenerate, there will be values of $r$ for which $P_1(A \mid p_2 = r) \neq r$. Specifically, because $P_1$ averages over the reliability of the signal $R$ while $p_2$ treats the corrupted prior $q$ as fixed, $P_1$ is less extreme than $p_2$. When $r > 0.5$, $P_1(A \mid p_2 = r) < r$, and when $r < 0.5$, $P_1(A \mid p_2 = r) > r$. Reflection fails systematically.

  This failure is not binary but continuous. As the distribution of $q$ concentrates on the true base rate 0.5, the density $f(q)$ approaches a Dirac delta function. In this limit, for any given $r$, only one path ($R=+$ or $R=-$) has non-zero density. If only the $R=+$ path is active, $K_- = 0$, and $P_1(A \mid p_2 = r) = 0.9$. In this transparent limit, $r$ equals 0.9 (since $q=0.5$), so Reflection holds. As the dispersion of $q$ increases, the violation grows. This continuum undermines attempts to rescue Reflection by restricting it to agents who do not anticipate "cognitive malfunction." There is no sharp boundary between the drug-induced distortion in this case and ordinary uncertainty about one's future evidence or processing; any restriction vague enough to cover this case would be ad hoc, while any precise restriction would essentially collapse into a requirement that the agent expects to Conditionalize on uncorrupted inputs.

  Furthermore, standard escape clauses do not apply. The evidence $R$ is not inadmissible; there is no selection effect or self-locating uncertainty. Alix's credence conditional on $R$ alone at $t_1$ is exactly what Bayesian computation requires. Nor is her later self irrational; she updates impeccably on the inputs she possesses. The only defect is that one input ($q$) is corrupted by external physics. To restrict Reflection to exclude this case is to admit that Reflection holds only when the agent expects to update correctly on the basis of their current priors. But that is precisely what Conditionalization guarantees. Thus, saving Reflection requires reducing it to a consequence of Conditionalization, rendering it redundant as an independent norm.

  The Dutch-strategy argument purportedly supporting Reflection must be re-evaluated in this light. A bookie who knows the setup can indeed construct a strategy guaranteeing Alix a loss if she adheres to Reflection. The bookie sells Alix a bet at $t_1$ on $A$ conditional on $p_2 = r$ at odds $r$. Since Reflection dictates $P_1(A \mid p_2 = r) = r$, Alix accepts this as fair. At $t_2$, if $p_2 = r$, the bookie executes a counter-bet at odds $r$ to lock in a loss based on the divergence between $r$ and the actual probability of $A$. However, this exploitation does not locate the defect in Alix's credence function $P_1$. $P_1$ accurately reflects the physics of the test and the distribution of $q$. The defect lies in the policy of binding her $t_1$ betting odds to her anticipated $t_2$ credences. Alix can avoid the loss by fixing her $t_2$ odds at $t_1$ based on $P_1$, ignoring $p_2$. The Dutch Strategy demonstrates that adhering to Reflection is pragmatically disastrous in this context, not that $P_1$ is incoherent. The norm forces her to defer to a future self she knows to be misled.

  In contrast, consider a transparent case where Alix is certain she will learn a partition cell $E$ and set $P_2(A) = P_1(A \mid E)$. Here, $P_2(A) = r$ implies she learned a cell $E$ such that $P_1(A \mid E) = r$. By the logic of Conditionalization, $P_1(A \mid P_2(A) = r) = P_1(A \mid \bigcup \{E : P_1(A \mid E) = r\}) = r$. In this scenario, Reflection is a theorem derived from the definition of Conditionalization and the partition structure. It adds no normative force. It is redundant where true and unsupported where it diverges from Conditionalization.

  Reflection should therefore be abandoned as a primitive diachronic norm. It should be replaced by a requirement that agents update by Conditionalization on evidence they regard as veridical, and that they avoid diachronic betting policies that defer to anticipated credences known to be generated by corrupted inputs.
