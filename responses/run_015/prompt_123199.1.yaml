answer: |-
  # Specification of Desiderata for Decision Theory Under Undefined Expectation
  **Subject:** Normative Constraints for Rational Choice in the Presence of Conditionally Convergent Payoffs
  **Context:** Graduate Seminar on Decision Theory
  **Primary Stress-Test:** The Pasadena Paradox and Iterated/Coupled Variants

  ## 1. Preamble: The Nature of the Deficit
  Standard Expected Utility Theory (EUT) relies on the existence of a Lebesgue integral for the utility function over the probability space. The Pasadena Paradox (Nover & Hájek, 2004) presents a gamble where the expectation series is conditionally convergent. By the Riemann Rearrangement Theorem, the expected value can be made to sum to any real number depending on the ordering of terms. Consequently, the expectation is *undefined*, not merely infinite.

  An adequate normative theory for this domain cannot simply truncate the series or declare the problem ill-posed. It must provide action-guiding norms where EUT is silent. The following desiderata specify the necessary conditions for such a theory.

  ---

  ## 2. Core Desiderata

  ### 2.1 Phenomenological Coverage
  **D1. Action-Guidance in Undefined Regimes.**
  *   **Specification:** The theory must yield a determinate verdict (permissible, obligatory, or forbidden) for choices involving undefined expectations, even when paired against acts with defined expectations.
  *   **Motivation:** A normative theory that returns "no verdict" for a live decision problem fails its primary functional role. The Pasadena gamble is a coherent physical possibility (in the limit); agents must be able to navigate it.
  *   **Status:** **Non-Negotiable.**

  **D2. Iterative Stability.**
  *   **Specification:** The theory must distinguish between the normative status of a single Pasadena gamble and a sequence of independent Pasadena gambles. It must specify whether the undefined nature persists, dissipates, or compounds under repetition.
  *   **Motivation:** In standard EUT, the Law of Large Numbers (LLN) stabilizes infinite sequences. For undefined expectations, the LLN does not apply in the standard form. A theory must explain whether rational agents should treat the iterated Pasadena as more or less attractive than the single-shot version.
  *   **Status:** **Non-Negotiable.**

  **D3. Coupled-Payoff Coherence.**
  *   **Specification:** The theory must handle cases where the payoff of a Pasadena-like act is functionally dependent on the choice of another agent (or a predictor), without generating infinite regress in the calculation of rational choice.
  *   **Motivation:** Real-world decisions often involve strategic coupling. If undefined expectations break game-theoretic equilibrium concepts (e.g., Nash equilibria relying on expected payoff comparisons), the theory must offer a replacement solution concept.
  *   **Status:** **Non-Negotiable.**

  ### 2.2 Conceptual Distinctions
  **D4. Etiology of Undefinedness.**
  *   **Specification:** The theory must distinguish between undefined expectation arising from *heavy-tailed payoff structures* (ontic indeterminacy in value) versus *discontinuous belief-updating rules* (epistemic indeterminacy in probability assignment).
  *   **Motivation:** A gamble with a Cauchy-distributed payoff is undefined due to the payoff structure. A gamble where the probability measure is non-countably additive may be undefined due to the belief state. Conflating these leads to category errors in prescribing remedies (e.g., risk-aversion vs. belief revision).
  *   **Status:** **Non-Negotiable.**

  **D5. Single-Shot vs. Sequential Sensitivity.**
  *   **Specification:** The theory must preserve a distinction between *myopic choice* (evaluating the act in isolation) and *dynamic choice* (evaluating the act within a policy or strategy).
  *   **Motivation:** In infinite decision trees, a act that is locally permissible may lead to globally dominated outcomes (e.g., money pumps). The theory must specify if the undefined expectation blocks dynamic consistency.
  *   **Status:** **Non-Negotiable.**

  ### 2.3 Consistency Conditions
  **D6. Finite Dominance Preservation.**
  *   **Specification:** If Act $A$ yields a strictly higher utility than Act $B$ in every possible state of the world, $A$ must be preferred to $B$, regardless of whether expectations are defined.
  *   **Motivation:** State-wise dominance is a minimal requirement of instrumental rationality. Abandoning this implies an agent could rationally choose a strictly worse outcome in every conceivable reality.
  *   **Status:** **Non-Negotiable.**

  **D7. Continuity of Preference (Approximation).**
  *   **Specification:** If a sequence of acts $\{A_n\}$ with defined expectations converges to an act $A^*$ with undefined expectation, and $A_n \succ B$ for all $n$, then $A^* \succeq B$.
  *   **Motivation:** This preserves the topological structure of the choice space. It prevents "preference gaps" where arbitrarily close approximations dictate one choice, but the limit dictates another or none.
  *   **Status:** **Camp-Specific** (Commitment to continuity/topological decision spaces).

  **D8. Expectation Avoidance Principle.**
  *   **Specification:** If Act $A$ has a defined expectation and Act $B$ has an undefined expectation, and there is no dominance relation, $A$ is strictly preferred to $B$.
  *   **Motivation:** Defined expectations represent epistemic stability; undefined expectations represent indeterminacy. Rationality should favor determinacy ceteris paribus.
  *   **Status:** **Camp-Specific** (Commitment to epistemic caution/conservatism).

  ---

  ## 3. Impossibility Results and Joint Unsatisfiability

  A critical component of this specification is identifying which subsets of the above desiderata cannot be jointly satisfied.

  ### 3.1 The Continuity-Avoidance Tension
  **The Conflict:** Desiderata **D7 (Continuity)** and **D8 (Expectation Avoidance)** are jointly unsatisfiable in the presence of the Pasadena structure.

  **Proof Sketch:**
  1.  Let $P$ be the Pasadena gamble (undefined expectation).
  2.  Let $S$ be a Safe option with defined expectation $E[S] = 0$.
  3.  Construct a sequence of truncated Pasadena gambles $\{P_n\}$ where the series is summed over the first $n$ terms.
  4.  By the nature of the Pasadena series (alternating harmonic), there exists a subsequence of truncations $\{P_{n_k}\}$ such that $E[P_{n_k}] \to +\infty$ (or any positive value $> E[S]$).
  5.  **Apply D7 (Continuity):** Since $P_{n_k} \succ S$ for large $k$ (assuming monotonicity in expectation), and $P_{n_k} \to P$, then $P \succeq S$.
  6.  **Apply D8 (Avoidance):** Since $P$ is undefined and $S$ is defined, $S \succ P$.
  7.  **Contradiction:** $P \succeq S$ and $S \succ P$.

  **Resolution Requirement:** Any adequate theory must explicitly abandon either **D7** or **D8**.
  *   *Abandoning D7:* Accepts that rational preference is discontinuous at the limit of undefined expectation. (Common in truncation approaches).
  *   *Abandoning D8:* Accepts that an undefined gamble can be rationally preferred to a safe defined one if the approximating sequence warrants it. (Common in generalized expectation approaches).

  **Verdict:** **D8 is the weaker constraint.** In a graduate seminar context, **D7 (Continuity)** is often treated as more fundamental to the mathematical structure of decision theory, while **D8** is a heuristic of caution. However, retaining D7 requires a mechanism to evaluate the limit of the sequence that does not rely on the expectation of the limit itself.

  ### 3.2 Dominance and Countable Additivity
  **The Conflict:** **D6 (Finite Dominance)** combined with standard probability axioms (Countable Additivity) creates tension with **D1 (Action-Guidance)** in infinite state spaces.
  *   **Consideration:** If the theory adheres to Countable Additivity, certain Pasadena-like distributions cannot be represented as standard probability measures. If the theory abandons Countable Additivity (allowing finitely additive probabilities), it can represent the distribution but risks violating Conglomerability (a form of dominance).
  *   **Requirement:** The theory must state its stance on Countable Additivity. A theory cannot simultaneously maintain Countable Additivity, Conglomerability, and Action-Guidance for all Pasadena variants (see Hájek, 2014).

  ---

  ## 4. Novel Constraint: The Pasadena-with-Reflection Scenario

  We introduce a new stress-test to filter theories that rely on ad-hoc truncation or meta-uncertainty.

  **The Scenario:**
  1.  **Agent:** Faces a choice between $Act_{Pasadena}$ (undefined expectation) and $Act_{Safe}$ (defined expectation).
  2.  **Predictor:** A second-order entity $\Omega$ observes the Agent's decision rule (not the choice itself, but the algorithm).
  3.  **Coupling:** The payoff of $Act_{Pasadena}$ is multiplied by a factor $k$ if $\Omega$ predicts the Agent will choose $Act_{Pasadena}$, and divided by $k$ if $\Omega$ predicts $Act_{Safe}$.
  4.  **Constraint:** The Agent knows $\Omega$ is accurate regarding decision rules.

  **Desideratum D9: Reflective Stability without Meta-Expectation Collapse.**
  *   **Specification:** The theory must prescribe a choice for the Agent that does not require calculating the expectation of $\Omega$'s prediction of the Agent's expectation. The solution must be a fixed point of the decision rule, not a fixed point of an expectation calculation that fails to converge.
  *   **Motivation:** Standard Causal Decision Theory (CDT) fails here if it relies on $E[U]$. Evidential Decision Theory (EDT) risks self-defeat if the correlation implies choosing Pasadena lowers expected utility via the multiplier. A theory that simply says "Expectation Undefined, choose Safe" fails to account for the potential gain from the multiplier $k$. A theory that says "Maximize Expectation" crashes.
  *   **Requirement:** The theory must decouple the *evaluation of the act* from the *calculation of the global expectation*. It must utilize a decision rule (e.g., based on stochastic dominance or median utility) that remains well-defined even when the first moment is undefined and coupled to a predictor.

  **Accommodation Condition:**
  To satisfy **D9**, the theory must adopt a **Value Functional** $V(A)$ that is not identical to $E[U(A)]$.
  *   If $V(A)$ relies on truncation limits, it must show that the limit is invariant under the Predictor's coupling (i.e., the ordering of the series cannot be manipulated by $\Omega$).
  *   If $V(A)$ relies on risk-weighting, it must show that the risk-weights are not themselves subject to the Predictor's manipulation.
  *   **Crucial Prohibition:** The theory cannot solve this by assigning an "undefined" value to the meta-choice. It must output a choice.

  ---

  ## 5. Classification of Theoretical Commitments

  To assist in seminar discussion, the desiderata are categorized by the theoretical cost of adopting them.

  | Desideratum | Classification | Theoretical Cost of Adoption |
  | :--- | :--- | :--- |
  | **D1 (Action-Guidance)** | Non-Negotiable | Forces abandonment of pure EUT. |
  | **D2 (Iterative Stability)** | Non-Negotiable | Requires engagement with limit theorems for non-integrable functions. |
  | **D3 (Coupled Coherence)** | Non-Negotiable | Requires integration with game theory/logic of prediction. |
  | **D4 (Etiology)** | Non-Negotiable | Requires precise formalism distinguishing measure vs. function issues. |
  | **D5 (Dynamic Sensitivity)** | Non-Negotiable | Requires policy-based rather than act-based evaluation. |
  | **D6 (Dominance)** | Non-Negotiable | **Unless** one adopts a "Sweetening" view (some undefined gambles dominate defined ones). |
  | **D7 (Continuity)** | **Camp-Specific** | **Mathematical Purists.** Retaining this usually requires abandoning Countable Additivity or standard Dominance. |
  | **D8 (Avoidance)** | **Camp-Specific** | **Epistemic Conservatives.** Retaining this requires abandoning Continuity (see Section 3.1). |
  | **D9 (Reflective Stability)** | **Novel Constraint** | **Structuralists.** Requires moving from Expectation Maximization to Rule Evaluation. |

  ---

  ## 6. Positioning of Existing Approaches (Brief)

  While a full scorecard is outside the scope, existing approaches stand relative to these desiderata as follows:

  1.  **Truncation Strategies (e.g., Easwaran 2008):**
      *   *Satisfies:* D1, D8.
      *   *Violates:* D7 (Continuity). The value of the Pasadena gamble depends on the truncation point, making the limit discontinuous.
      *   *Fails D9:* Vulnerable to Predictor manipulation if the truncation point is not fixed invariantly.

  2.  **Risk-Weighted Expectation (Buchak 2013 extended):**
      *   *Satisfies:* D1, D4.
      *   *Violates:* D6 (Dominance) in certain infinite configurations. Risk functions may not be defined for undefined integrals without modification.
      *   *Status on D9:* Promising, provided the risk-function operates on cumulative distribution functions (which exist for Pasadena) rather than expectations.

  3.  **Abandonment of Expectation-Maximization (e.g., Stochastic Dominance rules):**
      *   *Satisfies:* D6, D7 (in terms of distribution convergence).
      *   *Violates:* D1 (sometimes incomplete preference orderings result).
      *   *Status on D9:* Strong candidate. If the theory ranks based on the probability of exceeding a threshold rather than mean utility, the Predictor's coupling of the *mean* may not disrupt the *threshold probability* ranking.

  4.  **Principal Value Integration (Colyvan 2006):**
      *   *Satisfies:* D7 (Continuity).
      *   *Violates:* D8 (Avoidance). Treats the Cauchy Principal Value as the normative expectation.
      *   *Fails D9:* The Principal Value is sensitive to the symmetry of the series; a Predictor coupling payoffs asymmetrically can shift the Principal Value arbitrarily.

  ## 7. Conclusion for Seminar Discussion

  The central takeaway for the seminar is that **no theory can retain the full architecture of standard EUT while solving the Pasadena Paradox.** The specification above forces a choice:
  1.  **Break Continuity (Drop D7):** Accept that rational preference jumps at the limit of undefined expectation. (Favors Truncation/Avoidance).
  2.  **Break Expectation-Maximization (Drop Standard EUT):** Adopt a value functional (e.g., median, dominance, risk-weighted) that ignores the first moment. (Favors Stochastic Dominance/Risk-Weighting).
  3.  **Break Countable Additivity:** Alter the probability foundation to make the expectation defined. (Favors Finitely Additive Bayesianism).

  The **Pasadena-with-Reflection (D9)** constraint serves as the final filter: it eliminates theories that solve Pasadena by "fixing" the expectation value (like Principal Value), because such fixes are unstable under strategic coupling. Only theories that ground choice in features of the distribution *robust to rearrangement and coupling* (e.g., stochastic dominance properties or decision rules independent of the first moment) can satisfy the full specification.
