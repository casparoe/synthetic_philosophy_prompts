      *   *Tension B (1 vs. 2):* If saints are bad models (1) because they lose non-moral goods, but I have a duty to maximize moral excellence (2), am I duty-bound to become a "bad model"? Or does (2) imply a limit that stops short of sainthood?
      *   *Tension C (4 vs. 5):* (4) says sainthood *is* an objective loss of well-being. (5) says virtue and well-being are harmonizable and extreme virtue doesn't *necessarily* entail extreme deprivation. This looks like a direct contradiction unless "sainthood" in (4) is defined differently than "extreme virtue" in (5).
      *   *Tension D (6 vs. 2):* If I have a duty to maximize moral excellence (2), but a world where everyone does this is undesirable/impossible (6), does my duty depend on others failing? This creates a collective action problem or a paradox of ideal theory.

