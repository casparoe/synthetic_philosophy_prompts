      *   (5) **Harmonizability:** Moral goodness and well-being are *not* zero-sum; extreme virtue doesn't *necessarily* entail extreme deprivation.
      *   (6) **Social Paradox:** A society of *all* saints is undesirable/impossible because sainthood requires non-saints (needs/vulnerabilities) to respond to.

