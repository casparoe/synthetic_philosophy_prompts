          *   *Fix:* Accept that moral duties are context-dependent. My duty is to maximize excellence *in this world*, not in a hypothetical saint-world.

  5.  **Ranking and Refining the Audit:**

      *   *Rank 1 (Severe):* (2) vs. (3). The definition of obligation. If I must do what is achievable, supererogation vanishes.
