      *   *The Computational/Algorithmic Constraint:* Logic underpins computation. A "story" doesn't run code. Turing machines need definite rules, not interpretive closure.
      *   *The Disagreement Problem:* Two incompatible narratives can both be internally coherent. How do we adjudicate?
      *   *The Modal Problem:* Deduction is about *truth preservation* across possible worlds. Narratives are actual sequences of utterances.
      *   *The "Anything Goes" Charge:* If closure is the only standard, can't I construct a narrative where $A \vdash \neg A$ is valid?

  4.  **Selecting and Refining the Top Defeaters:**
