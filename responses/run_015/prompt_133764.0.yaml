      *   *Defeater 2: The Inconsistency Tolerance.* Coherentism struggles with paraconsistency vs. classical explosion. If the narrative is the standard, what forbids a narrative that accepts contradictions as valid steps?
      *   *Defeater 3: The Inter-Subjective Adjudication.* If logic is a narrative closure, how do we correct someone else's "story"?
      *   *Defeater 4: The Formal/Computational Implementation.* Logic works in machines that don't have "narratives."

  5.  **Ranking the Defeaters (Fatal to Awkward):**
      *   *Fatal:* The Normative Gap. If the theory can't distinguish valid from invalid, it's not a theory of logic.
      *   *Severe:* Inter-Subjective Adjudication. Logic is public; narratives can be private/idiosyncratic.
      *   *Moderate:* Computational Implementation. Might be category error, but shows limited scope.
      *   *Awkward:* The "Story" Metaphor. Just terminological vagueness.

  6.  **Addressing Unfalsifiability:**
