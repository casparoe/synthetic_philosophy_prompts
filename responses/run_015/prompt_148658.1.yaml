answer: |-
  1. Does the Dutch book defense of probabilism survive when agent and bookie operate under identical uniform computational bounds? If standard probabilism fails under these conditions, does the resulting coherence norm remain recognizably probabilistic, or does it collapse into a merely permissive constraint on credence? The answer must determine whether bounded exploitation constitutes irrationality or mere resource asymmetry.

  2. Idealizing agents ignores the settlement condition's failure on decidable-but-costly propositions. Restricting bet spaces to tractable fragments is ad hoc without independent justification. Accuracy-based vindications avoid pragmatics but abandon the Dutch book's specific normative force. This is not logical omniscience; the propositions are decidable, but settlement is physically impossible for bounded agents, undermining the "sure loss" claim.

  3. Formalize agents as Turing machines with step limits. Model bets as contracts payable only if verification occurs within bounds. Month 1: Define bounded Dutch books. Month 2: Construct toy models using NP-complete propositions. Month 3: Analyze exploitation scenarios where verification fails. Month 4: Draft and revise. Cases progress from tractable to intractable verification conditions.

  4. Positive: A bounded coherence norm emerges retaining probabilistic structure. Negative: Norm collapses to permissiveness, undermining probabilism. Failure: The project concludes merely that bounded agents cannot be fully coherent. This is failure because it restates the starting assumption rather than analyzing the normative significance of the settlement failure itself.

  5. The project covers only synchronic coherence. Diachronic updating and conditionalization are cut. Including them risks diluting the analysis of settlement conditions within the four-month limit. The diachronic component is excluded. Reinstating it is inadvisable unless synchronic bounded probabilism proves impossible, necessitating a dynamic alternative. Otherwise, adding it would obscure the primary result regarding settlement failure.
