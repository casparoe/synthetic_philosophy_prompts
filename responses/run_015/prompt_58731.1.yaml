  # Seminar Exercise: Prioritarianism, Egalitarianism, and the Leveling-Down Objection

  ## 1. The Scenario: The Regional Rehabilitation Allocation

  **Context:** You are the Director of a Regional Hospital Network. You are allocating a fixed package of rehabilitation resources between two wards for the current fiscal year. The decision affects the lifetime well-being of the current patients only. There are no future patients, no risk of treatment failure, and no instrumental side effects on the community. The well-being scores below represent stipulated, interpersonally comparable lifetime Quality-Adjusted Life Years (QALYs) for the representative patient in each ward. Both wards have an equal number of patients.

  **The Options:**

  *   **Option A (Status Quo):** The Neuro-Rehabilitation Ward (Ward X) is severely under-resourced compared to the Orthopedic Ward (Ward Y).
      *   Ward X Well-being: **36**
      *   Ward Y Well-being: **100**
      *   **Total Well-being:** 136
      *   **Distribution:** Highly Unequal

  *   **Option B (Partial Equalization):** You redirect resources from Y to X. However, the transfer mechanism is administratively costly (e.g., requires specialized logistics), resulting in a net loss of total well-being.
      *   Ward X Well-being: **55**
      *   Ward Y Well-being: **75**
      *   **Total Well-being:** 130
      *   **Distribution:** Moderately Unequal

  *   **Option C (Full Equalization):** You enforce strict parity between wards. This requires complex bureaucratic restructuring, resulting in significant administrative waste and a further drop in total well-being.
      *   Ward X Well-being: **60**
      *   Ward Y Well-being: **60**
      *   **Total Well-being:** 120
      *   **Distribution:** Perfectly Equal

  *   **Option D (Pure Leveling Down):** You cut the Orthopedic Ward's budget to match the Neuro-Rehabilitation Ward's baseline, without transferring any resources to Neuro-Rehab. This is done purely to eliminate the disparity.
      *   Ward X Well-being: **36**
      *   Ward Y Well-being: **36**
      *   **Total Well-being:** 72
      *   **Distribution:** Perfectly Equal

  ---

  ## 2. Theoretical Verdicts and Arithmetic

  We evaluate these options using three distinct moral metrics.

  ### A. Utilitarianism
  **Principle:** Maximize the sum of well-being. Equality has no value; waste is purely negative.
  **Calculation:** Sum of well-being scores.
  *   **A:** $36 + 100 = \mathbf{136}$
  *   **B:** $55 + 75 = \mathbf{130}$
  *   **C:** $60 + 60 = \mathbf{120}$
  *   **D:** $36 + 36 = \mathbf{72}$

  **Ranking:** **A > B > C > D**
  **Explanation:** Utilitarianism strictly penalizes waste. Since every move away from A reduces the total sum of well-being without any compensating intrinsic value for equality, the status quo is strictly best.

  ### B. Prioritarianism
  **Principle:** Maximize the sum of *weighted* well-being. We use the square-root function ($\sqrt{w}$) to model diminishing moral value: a unit of well-being matters more the lower the recipient's baseline. Equality has no intrinsic value; gains matter only if they benefit someone.
  **Calculation:** Sum of $\sqrt{w}$.
  *   **A:** $\sqrt{36} + \sqrt{100} = 6 + 10 = \mathbf{16.00}$
  *   **B:** $\sqrt{55} + \sqrt{75} \approx 7.42 + 8.66 = \mathbf{16.08}$
  *   **C:** $\sqrt{60} + \sqrt{60} \approx 7.75 + 7.75 = \mathbf{15.50}$
  *   **D:** $\sqrt{36} + \sqrt{36} = 6 + 6 = \mathbf{12.00}$

  **Ranking:** **B > A > C > D**
  **Explanation:**
  *   **Why B > A?** Even though total well-being drops in B, the gain to the worse-off (Ward X) is weighted heavily ($\sqrt{36} \to \sqrt{55}$ is a gain of 1.42 weighted units), outweighing the loss to the better-off ($\sqrt{100} \to \sqrt{75}$ is a loss of 1.34 weighted units). The priority weighting justifies the small administrative cost.
  *   **Why A > C?** In Option C, the administrative waste is too high. The moral gain from raising the worse-off further is outweighed by the massive drop in total well-being. The concave function is not steep enough to justify such inefficiency.
  *   **Why A > D?** In Option D, no one gains. The better-off lose well-being, and the worse-off stay static. Since prioritarianism values benefits to people, and D provides no benefits, it is strictly worse than A.

  ### C. Telic Egalitarianism
  **Principle:** Inequality is intrinsically bad. A distribution with less inequality is *pro tanto* better, even if total well-being is lower.
  **Calculation:** Qualitative assessment of equality patterns vs. well-being levels.
  *   **Equality Ranking:** C = D (Perfect) > B (Moderate) > A (High).
  *   **Well-being Ranking:** A > B > C > D.

  **Ranking:** **C > A** (and potentially **D > A** in respect of equality).
  **Explanation:**
  *   **Why C > A?** A telic egalitarian who gives substantial weight to equality will judge that the moral value of eliminating inequality in C outweighs the loss of 16 units of total well-being compared to A.
  *   **Why D may be > A?** This is the crux of the Leveling-Down Objection. Because telic egalitarianism views inequality as intrinsically bad, the move from A to D eliminates a bad thing (inequality). Therefore, in the *respect of equality*, D is better than A. A strict telic egalitarian might argue D is all-things-considered better; a moderate one admits D is better in one respect, which still implies A is not uniquely superior.

  ---

  ## 3. Analysis of Structural Features

  ### Separating Prioritarianism from Telic Egalitarianism
  The structural feature doing the work is the **Person-Affecting Constraint**.
  *   **Prioritarianism** is person-affecting: Value is generated only when an individual's well-being increases. In Option D, no individual gains; therefore, no moral value is generated. The drop in the better-off group is a pure loss.
  *   **Telic Egalitarianism** is impersonal: Value is generated by the *pattern* of the distribution. In Option D, the pattern improves (from unequal to equal), generating intrinsic value even though no person is benefited.

  ### Sensitivity Analysis
  1.  **Removing the Waste:** If we remove the administrative costs in B and C (making them Pareto-improvements or neutral transfers):
      *   **Utilitarianism:** Would become indifferent between A and a costless B/C if totals remain equal, or prefer the equalized version if the transfer itself is costless and totals are preserved.
      *   **Prioritarianism:** Would strongly prefer C over A. Without waste, the concave function always favors equalization ($\sqrt{68} + \sqrt{68} > \sqrt{36} + \sqrt{100}$). The "waste" stipulation in the main scenario was necessary to show that Prioritarianism is not *lexically* committed to equality; it trades off against total well-being.
      *   **Telic Egalitarianism:** Would prefer C even more strongly.

  2.  **Linear Weighting:** If the prioritarian weighting function becomes nearly linear (e.g., $w^{0.99}$ instead of $\sqrt{w}$):
      *   Prioritarianism collapses into Utilitarianism.
      *   The ranking would shift to **A > B > C > D**.
      *   This demonstrates that Prioritarianism's divergence from Utilitarianism depends entirely on the *strength* of the priority weighting. If the weight is too weak, it cannot justify the waste in B; if too strong, it might justify C, blurring the line with Egalitarianism.

  ### The Strongest Telic Egalitarian Reply to the Leveling-Down Objection
  A sophisticated defender of telic egalitarianism (e.g., Larry Temkin) typically replies by distinguishing between **all-things-considered** judgments and **pro tanto** (in one respect) judgments.
  *   **The Reply:** "We do not claim that Leveling Down (D) is *all-things-considered* better than the Status Quo (A). We claim it is better *in the respect of equality*. The fact that D is better in one respect shows that equality is a genuine value. Prioritarianism denies this; it says D is not better in *any* respect. Our view captures the intuition that inequality is a complaint, even if fixing it is too costly."
  *   **Force:** This saves the theory from the charge of irrationality (advocating making everyone worse off), but it concedes that the theory implies a "sadistic" conclusion: that a world where everyone is equally miserable is, in one significant moral respect, better than a world where some are happy and some are miserable.

  ---

  ## 4. Self-Critical Note

  **Step Most Likely to Fail:**
  The most vulnerable step in this reasoning is the **stipulation of administrative waste** to force the Prioritarian verdict $A > C$.

  **Why it might fail:**
  I calibrated the waste in Option C (Total Well-being 120) specifically to ensure the Prioritarian sum (15.50) fell below the Status Quo (16.00). However, the "waste" is an external stipulation, not a feature of the theories themselves. A critic could argue that in real-world policy, full equalization often *does* yield instrumental benefits (social stability, reduced resentment) that Prioritarianism would count. If those instrumental benefits were included, Prioritarianism might prefer C, making it look more like Egalitarianism.

  **Consideration for Reversal:**
  If I were to reverse my central verdict—that this case vindicates Prioritarianism against the Leveling-Down Objection—I would rely on the **"Priority Weight" Argument**.
  If the prioritarian weighting function is sufficiently concave (e.g., $\log(w)$ or a steeper power function), Prioritarianism would rank **C > A** even with the stipulated waste. If Prioritarianism mandates full equalization despite significant total losses, it becomes extensionally equivalent to Telic Egalitarianism in this case. If the theories produce the same verdicts in practice, the claim that Prioritarianism "escapes" the Leveling-Down Objection becomes merely semantic: it avoids the objection only by assuming a specific, moderate curvature of the value function. If the moral urgency of the worse-off is high enough, Prioritarianism may be forced to endorse leveling-down-adjacent policies, reinstating the objection's force.
