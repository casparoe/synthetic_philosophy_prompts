answer: |-
  The standard four-condition regime presupposes a **Plural Subject** account of joint action, specifically Margaret Gilbert's theory of joint commitment, though it operates in practice as a fragile **Methodological Individualism** with normative aspirations. The rules are not merely aggregating individual contributions; they are attempting to constitute a collective entity capable of bearing unified liability. The critical philosophical work is done by the accountability condition: the requirement that each author be accountable for *every* aspect of the work. This is not a contractual add-on but a constitutive rule of authorship. It implies that by signing on, individuals enter a joint commitment to uphold the paper as a single body of work, creating obligations to one another and to the public that transcend their specific labor.

  However, the practice is philosophically underdetermined. The contribution criteria (design, analysis, drafting) are compatible with rival theories. A Shared Intention account (Bratman), a Plural Subject account (Gilbert), and a Group Agency account (List and Pettit) all license the requirement that authors contribute intellectually. They diverge sharply on accountability. A Shared Intention account requires mutual responsiveness and commitment to the joint activity, but might allow for divided liability if the intention was only to collaborate on parts. A Group Agency account requires the collective to have a decision procedure and a capacity to form attitudes distinct from its members. The current rules hover between these: they demand the liability of a Group Agent but lack the decision procedures to support it, relying instead on the interpersonal obligations of a Plural Subject. The accountability condition is the only feature that pushes beyond Individualism, yet it is the most frequently violated.

  The systematic violations in large collaborations and posthumous authorships reveal that the Plural Subject ideal is often aspirational rather than descriptive. In physics or genomics consortia, the epistemic condition for joint commitment—that each member knows and accepts the contributions of others—is impossible. Here, the practice retreats to Individualism: authors are credited for their slice, and the "group" is a fictional placeholder. Posthumous authorship creates a deeper ontological strain. A dead person cannot hold an intention or bear an obligation. Permitting it suggests that journals treat authorship as a荣誉 (honor) or credit allocation rather than a status grounded in ongoing agency. Conversely, the exclusion of AI systems confirms that answerability is constitutive of authorship, not merely appended. If authorship were solely about contribution, AI would qualify. Its exclusion rests on the metaphysical claim that only entities capable of being held responsible—of owing explanations and accepting sanctions—can be authors. This aligns with the Plural Subject view: you cannot join a joint commitment without the capacity to understand and bear the resulting obligations.

  The proposed "distributed guarantee authorship" is a philosophical retreat. It abandons the attempt to constitute a Plural Subject or Group Agent in favor of a networked Individualism. The statement of mutual reliance mimics the structure of joint commitment but lacks its unity. In a true joint action, the group acts as one; here, the collaboration is merely a container for bilateral contracts. The guarantors rely on one another, but they do not jointly will the paper as a whole. This creates a gap in integrity: if nobody answers for the synthesis, the paper lacks an agent of record for its total truth claim. The proposal assumes that joint action is nothing over and above structured mutual reliance. This is ontologically deflationary. It treats the collaboration as a heap of components rather than a unified output. If the collaboration were a genuine Group Agent, it would possess decision procedures to revise commitments and a capacity to act as a single unit. The proposal denies this, fragmenting liability to match the fragmentation of labor.

  If we were to replace the current implicit theory with its rivals, concrete policy changes would follow. If we adopted a strict **Group Agency** view, journals would need to require collaborations to establish constitutions before submission. The group would need documented decision procedures for resolving internal disputes and a mechanism for forming collective attitudes. Retractions would be issued by the group entity, and sanctions could target the group's standing (e.g., banning the consortium) rather than just individuals. If we adopted a consistent **Methodological Individualism**, we would abolish the accountability condition entirely. Authors would be responsible only for their enumerated contributions, and the "corresponding author" would be a mere administrative clerk rather than a proxy for collective integrity. We would also permit posthumous authorship without contradiction, as credit would be decoupled from agency.

  If we enforced the **Plural Subject** view currently implied but ignored, we would have to ban authorship lists that exceed the Dunbar number or epistemic limits of joint commitment. We would prohibit posthumous authorship strictly, as the dead cannot sustain joint commitments. We would also require evidence of actual mutual understanding among authors, perhaps through signed statements verifying they have reviewed all data, not just their own. Currently, the practice is underdetermined because journals lack the incentive to enforce the ontology they profess. To settle this, we would need data on how authors actually deliberate. Do they discuss the paper as a whole, or merely swap files? If the latter, the Individualist reading is correct, and the accountability rule is a fraudulent aspiration.

  I am least confident in the assessment of whether a "collaboration" can ever be a moral agent in the demanding sense required by Group Agency theory. While legal persons exist, moral agency typically requires consciousness. If we treat consortia as agents, we risk creating liability shields for individuals. However, without that status, large-scale science lacks a coherent integrity model. The distributed guarantee proposal attempts to solve this by fragmenting the agent, but in doing so, it may dissolve the very concept of a "paper" as a unified claim on truth. The philosophical cost of the proposal is the admission that modern science no longer produces unified knowledge claims authored by responsible agents, but rather assembled data products managed by networks of liable individuals.
