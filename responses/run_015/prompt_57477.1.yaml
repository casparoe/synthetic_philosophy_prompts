answer: |-
  **MEMORANDUM**

  **TO:** Second-Year Student
  **FROM:** [Name Withheld], Professor of Jurisprudence
  **RE:** The "Legislating Morality" Slogan
  **DATE:** October 24

  You are right to be irritated. In thirty years of teaching this seminar, I have heard "you can't legislate morality" more often than I have heard a coherent definition of "law." It is a conversation-stopper masquerading as an argument. Your intuition is correct: it is usually a restatement of the liberal conclusion, not a premise that justifies it. If your classmate meant it as a conceptual truth, they are wrong. If they meant it as a political claim, they are begging the question against Devlin.

  Below is the breakdown you asked for. Use this to construct your handout. Do not let the seminar treat this slogan as a trump card; treat it as a claim that requires evidence.

  ***

  ### A MENU OF READINGS: "YOU CAN'T LEGISLATE MORALITY"

  **1. The Conceptual Impossibility Reading**
  *   **(a) Proposition:** Law can coerce outward conduct, but it cannot compel inner moral belief or virtuous motive.
  *   **(b) Analysis:** "Can't" is conceptual/logical. "Legislate" means to create moral worth. "Morality" means inner virtue or sincere belief.
  *   **(c) Verdict:** **True, but a Platitude.** It is trivially true that you cannot force someone to *be* good, only to *act* as if they are.
  *   **(d) Engagement:** **Devlin** concedes this without cost; he is not trying to save souls, but to prevent social disintegration. He cares about the *bond*, not the *belief*. **Hart** can borrow this to show the limits of criminal law, but it does not answer Devlin's core claim that society may regulate *conduct* that threatens the moral fabric, regardless of the actor's intent.

  **2. The Causal Inefficacy Reading**
  *   **(a) Proposition:** Criminal prohibitions on consensual private immorality fail to reduce the incidence of that conduct and often produce worse social outcomes.
  *   **(b) Analysis:** "Can't" is causal/empirical. "Legislate" means criminal prohibition. "Morality" means specific private behaviors (e.g., sodomy, incest).
  *   **(c) Verdict:** **Contestable Empirical Thesis.** Sometimes true (Prohibition), sometimes false (tax compliance, seatbelt laws). It requires evidence, not assertion.
  *   **(d) Engagement:** **Devlin** accepts this as a matter of *expediency* (one of his three limits on enforcement), but denies it as a matter of *principle*. **Hart** relies heavily on this to argue that the harm of enforcement outweighs the benefit, but he must prove the disintegration thesis is empirically false, not just assume it.

  **3. The Normative Legitimacy Reading**
  *   **(a) Proposition:** Even if the state *could* effectively enforce moral norms, it lacks the moral authority to do so in the absence of harm to others.
  *   **(b) Analysis:** "Can't" is normative (meaning "ought not"). "Legislate" means state coercion. "Morality" means positive morality regarding private conduct.
  *   **(c) Verdict:** **Substantive Political Theory.** This is the actual argument, disguised as an impossibility claim. It is the Heart of the Hart-Mill position.
  *   **(d) Engagement:** **Devlin** rejects this entirely; he argues the authority *is* derived from the preservation of society's moral identity. **Hart** adopts this as the Harm Principle. This is the only reading that constitutes a genuine clash, but it requires defending liberalism, not hiding behind the word "can't."

  **4. The Definitional Reading**
  *   **(a) Proposition:** Law is necessarily the enforcement of morality, so the slogan is either nonsense or an admission that law should not exist.
  *   **(b) Analysis:** "Can't" is rhetorical. "Legislate" means to make law. "Morality" means the fundamental values underpinning legal obligations.
  *   **(c) Verdict:** **Substantive Jurisprudential Claim.** True in the sense that all law rests on value judgments (e.g., "pain is bad").
  *   **(d) Engagement:** **Devlin** embraces this; for him, law *is* the bond of shared morality. **Hart** must distinguish between "positive morality" (customs) and "critical morality" (rational principles) to avoid collapsing into natural law. He argues law enforces *justice*, not necessarily *morality*.

  **5. The Self-Undermining Reading**
  *   **(a) Proposition:** The slogan itself asserts a moral principle (liberty/neutrality) that the law is being asked to enforce, contradicting its own claim that law cannot enforce morality.
  *   **(b) Analysis:** "Can't" is logical inconsistency. "Morality" includes the morality of non-interference.
  *   **(c) Verdict:** **Decisive Objection to the Slogan.** The slogan is performatively contradictory.
  *   **(d) Engagement:** **Devlin** absorbs this easily: "Exactly! You are proposing *your* morality (liberty) replace *ours* (tradition). Let us debate which is better." **Hart** must clarify that he is advocating a *critical* morality of rights, not merely swapping one positive morality for another.

  ***

  ### TWO COMPLICATIONS

  **1. The Self-Undermining Objection**
  You asked if the fact that "law always enforces somebody's morality" is decisive. It is decisive against the *slogan*, but not against the *liberal*.
  *   **Devlin's Absorption:** Devlin welcomes this. He argues that the "morality of non-interference" is just another shared moral view. If the majority feels strongly that liberty is the supreme value, Devlin's theory would allow them to legislate *that*. His point is that *some* morality must rule; the question is which one.
  *   **The Trap:** If you argue "law can't enforce morality," Devlin points to the law of theft (enforcing honesty) or murder (enforcing the sanctity of life). You must refine the claim to "law can't enforce *private* morality" or "*harmless* morality."

  **2. The Kantian Strand**
  Does the fact that coerced conformity has no moral worth kill Devlin?
  *   **Verdict:** **Irrelevant to Devlin.** Devlin is a sociological functionalist, not a Kantian ethicist. He does not claim legal enforcement makes people *virtuous*; he claims it keeps society *intact*. He is arguing for the preservation of the *stage*, not the quality of the *actors' performance*.
  *   **Hart's Use:** Hart can use this to argue that legal moralism degrades the concept of morality, but Devlin will simply reply that without the stage, there is no performance at all.

  ***

  ### HOW TO OPEN THURSDAY'S SESSION

  Do not stand up and say, "Actually, that slogan is ambiguous." That is pedantry, and you will lose the room. You need to validate the intuition while demanding the argument.

  **The Framing Statement:**
  "Last week, we stopped on the claim that 'you can't legislate morality.' I've been thinking about that, and I realize we might be using it to do three different jobs.
  1.  Is it a **prediction**? (Laws against vice won't work.)
  2.  Is it a **definition**? (Law is only about harm, so moral law isn't 'real' law.)
  3.  Or is it a **right**? (Even if it works, the state has no business doing it.)

  If it's the first, Devlin says he's willing to compromise on expediency. If it's the second, we need to explain why theft is legal but incest isn't. If it's the third, that's the actual debate: does society have a right to protect its moral fabric? I'd like us to pick which one we're arguing, because Devlin loses on the second, but wins on the first unless we have data."

  **Why this works:**
  It grants the classmate their nod (the liberal conclusion is likely correct) but forces the seminar to do the work of justifying it. It shows you have done the reading (referencing Devlin's expediency limit) without showing off. It moves the discussion from slogans to the *Disintegration Thesis* vs. the *Harm Principle*, which is where the actual jurisprudence lives.

  Go get them. And please, for the love of jurisprudence, ban the word "slogan" from the room after Thursday.
