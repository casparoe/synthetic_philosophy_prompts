prompt: |-
  I am a retired physicist who has only recently begun reading seriously in philosophy, particularly the literature on AI alignment and adversarial reasoning. In debates over whether structured debate can function as a safety mechanism for advanced artificial systems, I keep encountering a specific argumentative pattern for which I lack a name. The pattern unfolds in two stages. First, a defender of debate-based safety insists that any risk claim must be formulated in terms both parties can verify through shared reasoning protocols; if the critic supplies such a formulation, the defender then objects that this framing strips the risk of its essential urgency or uniqueness, and demands instead a demonstration that relies on precisely the kind of unverifiable intuition or long-horizon speculation that the initial protocol was designed to exclude. Once the critic highlights this reversal, the defender treats it not as a concession but as evidence that the risk is inherently unformalizable, hence outside the scope of debate altogether. I have observed variants of this in discussions of deceptive alignment and instrumental convergence, yet I am uncertain whether it belongs to an established family of argumentative pathologies—perhaps a form of epistemic gatekeeping, a variant of the motte-and-bailey, or something closer to immunization strategies in the philosophy of science. Is there an established concept for this exact two-stage filter—first requiring formalizability, then dismissing formalized versions as inadequate—specifically in the context of safety debates? If not, how ought one classify it, and what are its nearest neighbors in the taxonomy of obstructive argumentation? In your answer, please clearly separate what is settled about the practical limits of debate-based safety mechanisms from what remains genuinely contested among specialists, and avoid presenting any single contested view—such as the claim that all long-horizon risks are necessarily unformalizable—as though it were the consensus position.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physicist, new to serious philosophy (specifically AI alignment/adversarial reasoning). This implies they value precision, rigor, clear definitions, and distinctions between empirical claims and conceptual frameworks. They are likely comfortable with formal systems but wary of hand-waving.
      *   **Core Question:** They have identified a specific two-stage argumentative pattern in AI safety debates (specifically regarding debate-based safety mechanisms).
          *   Stage 1: Defender demands formal/verifiable risk claims.
          *   Stage 2: If provided, Defender claims the formalization loses the "essence/urgency" and demands unverifiable intuition/speculation.
          *   Stage 3: If criticized for this reversal, Defender claims the risk is inherently unformalizable and thus outside debate.
      *   **Task:** Identify if there's an established name for this pattern. If not, classify it and find nearest neighbors in argumentative taxonomy.
      *   **Constraint:** Clearly separate settled practical limits of debate-based safety from genuinely contested specialist views. Do not present contested views (e.g., "long-horizon risks are unformalizable") as consensus.

  2.  **Deconstruct the Argumentative Pattern:**
      *   *Move A:* "Prove it formally/verifiably." (Shift burden of proof to rigorous grounds).
      *   *Move B:* "That formalization misses the point/real danger." (Moving the goalposts to intuitive/speculative grounds).
      *   *Move C:* "Therefore, it can't be debated formally." (Immunization).
      *   *Observation:* This looks like a dynamic shift in epistemic standards depending on which standard favors the defender's position.

  3.  **Search for Established Concepts:**
      *   *Motte-and-Bailey:* Close, but usually involves retreating to a defensible position (Motte) when attacked, then claiming the controversial position (Bailey) when safe. Here, the defender is *shifting the criteria* to make the critic's job impossible. It's more like a "Double Bind."
      *   *Kafkatrapping:* Accusing someone of denying the accusation as proof of the accusation. Not quite.
      *   *Immunization Strategies (Philosophy of Science):* Popper/Lakatos. Protecting a core theory from falsification by adding ad-hoc hypotheses. This fits the "unformalizable" claim well.
      *   *Epistemic Gatekeeping:* Relevant, but too broad.
      *   *Moving the Goalposts:* Classic fallacy, but doesn't capture the specific *structure* of demanding formalism then rejecting it.
      *   *The "Kafkaesque" Bureaucracy:* Demanding paperwork, then rejecting the paperwork.
      *   *Specific AI Safety Context:* Is there a term like "Alignment Falsification Trap"? No standard term exists.
      *   *Best Fit:* It resembles a **Double Bind** (Bateson) combined with **Immunization** (Popper/Lakatos). In rhetoric, it's a form of **Rigging the Debate** or **Procedural Obstruction**.
      *   *Philosophical Term:* **Epistemic Closure** or **Self-Sealing Argument**.
      *   *Specific Term:* There isn't a *single* canonical name for this exact two-stage filter in the literature, but it maps strongly onto **Kripke's "Wittgenstein on Rules and Private Language"** skepticism (no rule can determine its own application) turned into a defensive weapon, or more simply, a **Performative Contradiction** regarding the standards of evidence.
      *   *Refinement:* The pattern is essentially: "Show me X. Okay, you showed me X. But X isn't *real* X. Therefore X doesn't exist." This is a **No True Scotsman** variation applied to *evidence standards* rather than category membership.
      *   *Best Label:* **The Formalization Trap** (descriptive) or **Epistemic Double Bind**. In the context of AI safety specifically, it's often discussed under **Unforeseeability Claims** or **Intractability Arguments**, but the *rhetorical move* itself is a **Self-Immunizing Shift in Epistemic Standards**.

  4.  **Address the "Settled vs. Contested" Constraint:**
      *   *Settled:* Debate-based safety (like AI Debate or Recursive Reward Modeling) has known limitations (e.g., collusion, human judge limitations, training dynamics). It is not a silver bullet. Formal verification of AGI behavior is currently impossible for general systems.
      *   *Contested:* Whether deceptive alignment is inevitable, whether "intuition" about x-risk is valid evidence, whether debate can scale to superintelligence, whether the "unformalizable" core of risk is real or a confusion.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's background (physics) and validate their observation. It's a sharp catch.
      *   *Naming the Pattern:* State clearly that there is no single canonical term *specific* to AI safety for this exact two-stage move. However, it maps to established concepts in philosophy of science and rhetoric.
      *   *Classification:*
          1.  **Moving the Goalposts (Diachronic):** Changing criteria mid-argument.
          2.  **Immunization Strategy (Lakatos/Popper):** Protecting the core claim from falsification by declaring counter-evidence (formalization) irrelevant.
          3.  **Epistemic Double Bind:** Damned if you do (formalize), damned if you don't (speculate).
          4.  **No True Scotsman (Applied to Evidence):** "No *real* risk looks like that formalization."
      *   *Nearest Neighbors:* Mention *Motte-and-Bailey* (but distinguish it), *Kafkatrapping* (structural similarity), and *Wittgensteinian Skepticism* (rule-following).
      *   *Settled vs. Contested (Crucial Step):*
          *   *Settled:* Debate protocols depend on human judges (bounded rationality). Formal verification works for narrow code, not general learning agents. Adversarial training can lead to gaming.
          *   *Contested:* The nature of "deceptive alignment" (is it a default outcome?). The validity of "conceptual arguments" vs. "empirical data" in x-risk. Whether the "unformalizable" aspect is a feature of reality or a feature of our current ignorance.
      *   *Conclusion:* Advise on how to handle it (meta-debate, pinning down standards).

  6.  **Refining the Tone:**
