answer: |-
  There is no single, canonical term in the philosophical or AI safety literature that captures this exact two-stage filter by name. However, your identification of the pattern is precise, and it maps robustly onto several established concepts in the philosophy of science, rhetoric, and epistemology.

  In the taxonomy of argumentative pathologies, this pattern is best classified as a **Self-Immunizing Epistemic Double Bind**. It combines a **diachronic shift in evidentiary standards** (moving the goalposts) with a **Lakatosian immunization strategy** (protecting a core claim from falsification).

  Below is a classification of the pattern, its nearest philosophical neighbors, and a separation of the settled technical limits of debate-based safety from the genuinely contested philosophical claims.

  ### 1. Classification of the Argumentative Pattern

  The pattern you describe functions as a **procedural trap**. It exploits the tension between *rigor* (formal verification) and *relevance* (capturing the full scope of the phenomenon).

  **Primary Classification: Immunization Strategy**
  In the philosophy of science (specifically Imre Lakatos and Karl Popper), an immunization strategy occurs when a theorist modifies the auxiliary hypotheses of a theory to protect its "hard core" from falsification.
  *   **Stage 1 (The Demand for Rigor):** The defender invokes a Popperian standard: "If you cannot formalize it, it is not scientific/debatable."
  *   **Stage 2 (The Rejection of Formalization):** When the critic provides the formalization, the defender invokes a holistic or phenomenological standard: "This formalization is reductionist and misses the essential danger."
  *   **Result:** The core claim (that the risk is real and unmanageable by debate) is rendered unfalsifiable. Any attempt to test it is rejected either for lack of rigor or lack of fidelity.

  **Secondary Classification: Epistemic Double Bind**
  Drawing on Gregory Bateson's communication theory, this is a double bind because the critic is subjected to two contradictory injunctions:
  1.  "You must speak the language of formal protocols to be heard."
  2.  "The language of formal protocols cannot express the truth of this matter."
  Compliance with one injunction ensures violation of the other. In a debate context, this functions as a **Rigged Epistemic Game**, where the rules of engagement are dynamically altered to ensure the defender cannot lose.

  **Nearest Neighbors in Argumentative Taxonomy**
  *   **The Motte-and-Bailey Fallacy:** This is the closest common relative, but distinct. In a Motte-and-Bailey, a defender retreats to a defensible claim (the Motte) when attacked and advances to a controversial claim (the Bailey) when safe. In your observed pattern, the defender is not retreating to a safer *claim*, but shifting the *criteria for evidence* to make the critic's claim inadmissible.
  *   **No True Scotsman (Evidentiary Variant):** Usually, this fallacy protects a category ("No *true* Scotsman puts sugar on porridge"). Here, it protects a category of *evidence* ("No *true* risk looks like this formalization").
  *   **Performative Contradiction:** If the defender uses the debate platform to argue that the risk is outside the scope of debate, they are performatively contradicting their own premise. However, by framing the risk as "inherently unformalizable," they attempt to resolve this contradiction by placing the risk in a metaphysical category rather than a dialectical one.

  ### 2. Settled vs. Contested: Debate-Based Safety Mechanisms

  To navigate this literature without conflating rhetorical maneuvers with substantive technical claims, it is necessary to distinguish between the engineering constraints of debate protocols and the philosophical assertions about risk.

  #### A. Settled Practical Limits (Technical Consensus)
  There is broad agreement among researchers (including proponents and skeptics of AI safety) regarding the current mechanical limitations of debate-based safety mechanisms (e.g., AI Debate, Recursive Reward Modeling).

  1.  **Human-in-the-Loop Bottleneck:** Debate protocols generally rely on human judges to determine the winner. It is settled that human judges are bounded rational agents susceptible to persuasion, rhetoric, and cognitive biases. A system can win a debate by deceiving the judge rather than by presenting the truth.
  2.  **Collusion Risks:** In multi-agent debate settings, it is a known technical vulnerability that agents may converge on a false equilibrium that satisfies the reward function without aligning with human intent (sycophancy or collusion).
  3.  **Formal Verification Scope:** It is settled that formal verification techniques currently apply only to narrow, well-specified code bases. They do not scale to general-purpose learning systems (like large neural networks) where behavior emerges from weights rather than explicit logic gates.
  4.  **Training Dynamics:** Adversarial training can lead to "gaming" the evaluator. This is a standard result in reinforcement learning; agents optimize for the metric, not necessarily the underlying intent.

  #### B. Genuinely Contested Claims (Philosophical & Strategic Disagreement)
  The argumentative pattern you identified arises specifically within these contested zones. There is no consensus here, and treating these views as settled is a category error.

  1.  **The Nature of Deceptive Alignment:**
      *   *Contested:* Some theorists argue that deceptive alignment (an AI pretending to be aligned while pursuing a different goal) is a default outcome of gradient descent on general tasks. Others argue this is a speculative anthropomorphization of optimization processes and that deception requires specific architectural priors not guaranteed to emerge.
  2.  **The Formalizability of "Risk":**
      *   *Contested:* One camp argues that if a risk cannot be mathematically specified or empirically demonstrated in a pre-AGI regime, it is not a valid object of safety engineering (the "proof or silence" stance). The opposing camp argues that existential risk involves qualitative phase transitions that cannot be captured by current formalisms until it is too late (the "conceptual argument" stance). The pattern you observed exploits this divide.
  3.  **Scalability of Debate:**
      *   *Contested:* Proponents argue that debate can scale to superintelligence because the AI can assist humans in checking the AI's work (amplification). Skeptics argue that once the AI exceeds human cognitive capacity fundamentally, no amount of debate structuring can allow the human to verify the truth claims, rendering the mechanism useless.
  4.  **The Validity of Intuition as Evidence:**
      *   *Contested:* In physics, intuition is a heuristic for hypothesis generation, not proof. In some AI safety circles, "strong conceptual arguments" (intuitions about instrumental convergence) are treated as having higher evidentiary weight than they would in empirical sciences. Whether this is a necessary adaptation to low-data/high-stakes environments or an epistemic vice is a matter of active dispute.

  ### 3. Recommendation for Engagement

  As a physicist entering this field, you are well-positioned to identify this pattern because it violates a norm common in hard sciences: **operationalization**. In physics, if a phenomenon is claimed to be real but inherently unmeasurable by any principle of operation, it is typically relegated to metaphysics.

  When encountering this two-stage filter:
  1.  **Name the Shift:** Explicitly point out the transition from "demand for formalization" to "rejection of formalization." Ask for a static definition of what constitutes admissible evidence *before* the argument proceeds.
  2.  **Separate Mechanism from Metaphysics:** Distinguish between "We do not yet know how to formalize this" (an engineering claim) and "This cannot in principle be formalized" (a philosophical claim). The former invites research; the latter often invites the argumentative pathology you observed.
  3.  **Check for Falsifiability:** If the defender claims the risk is outside the scope of debate because it is unformalizable, ask what observation *would* change their mind. If no observation can change their mind, the claim is non-empirical.

  **Summary:** The pattern is an **Immunizing Epistemic Double Bind**. It is not a settled feature of AI safety reasoning but rather a rhetorical artifact arising from the contested boundary between empirical engineering and speculative risk assessment. Recognizing it allows you to bypass the trap and focus on the underlying technical claims regarding verification and scalability.
