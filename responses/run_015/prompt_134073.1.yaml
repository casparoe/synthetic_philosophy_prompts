  What the practice strictly presupposes
  Digital preservation strictly presupposes a local causal arrow where influence flows from past to future, never vice versa. It requires that information states are distinct and stable enough to be distinguished from noise, yet vulnerable to degradation without intervention. Practitioners assume that a record created at t1 remains accessible at t2, but a record at t2 cannot influence t1. This implies an asymmetry of access rooted in causality, not necessarily cosmology. It also presupposes logical identity: that a bit flipped by noise is fundamentally different from the original, requiring external work to reverse. The practice does not demand a global thermodynamic arrow, only a local environment where entropy tends to increase relative to the stored information. It assumes the future is open and unwritten, while the past is fixed and recordable. Without this directional asymmetry in causal access and state stability, the very concept of backup becomes meaningless, as restoration would be indistinguishable from prediction. Crucially, it presupposes that maintaining order requires energy expenditure; silence implies decay. It assumes independent copies provide redundancy against local failure. This redundancy relies on the spatial distribution of information remaining stable over temporal intervals. Readers must survive long enough to interpret the data. Preservation presupposes a co-evolving ecosystem of data and readers.

  What it merely fits well with
  The practice fits well with the standard cosmological narrative of a low-entropy early universe driving a global thermodynamic arrow, but it does not require it. It is compatible with the idea that time's direction is merely statistical—a local fluctuation where order rarely spontaneously reassembles. Preservation works equally under presentism or eternalism; the block universe exists, but we can only read slices sequentially. It aligns with the view that memory records the past because entropy was lower then, yet functions even if that explanation is provisional. The field's operations are robust against metaphysical shifts. Whether time is fundamental or emergent matters less than the reliability of the causal chain. The practice merely needs a universe where causes precede effects and records persist longer than the noise that obscures them. It is agnostic on why the arrow points forward, provided it does. Consequently, the archivist need not be a cosmologist. Global theories remain optional background context.

  Traces vs. entropy
  Trace asymmetry and entropy are effectively the same fact in different clothes. Traces are low-entropy correlations between a system and its environment. When a file is saved, it creates a correlation that persists. Entropy increase explains why these correlations proliferate toward the past but not the future: interacting with the environment spreads information irreversibly. The trace story describes the availability of records; the entropy story describes the mechanism of their loss. One cannot exist without the other in a physical system. If entropy didn't increase, traces wouldn't accumulate distinctively in one direction, and restoration would be symmetric. Therefore, the trace asymmetry does no independent work; it is the informational shadow of thermodynamics. Both describe why we can repair from a backup but not from a future state. This equivalence means archivists are effectively managing thermodynamic gradients. The accumulation of traces is simply the history of entropy production. Thus.

  Bits vs. recipe
  The bits strategy fights the arrow directly, constantly moving physical instantiations to outrun decay. The recipe strategy attempts to sidestep the arrow entirely by preserving abstract logic rather than concrete states. Recipe preservers assume mathematical truths are timeless; if you have the seed and code, the output is identical regardless of when computed. This assumes computation is independent of the thermodynamic arrow, treating the digital object as a Platonic form rather than a physical artifact. Yet execution requires hardware subject to entropy. The claim that regeneration yields the very same result relies on ignoring the physical history of the computation. It assumes the arrow doesn't matter to identity, only to instantiation. Thus, the recipe strategy quietly assumes the arrow is irrelevant to logical truth, even if it remains crucial for the hardware running the recipe. It posits a realm of information untouched by temporal flow. Bits admit time; recipes deny it.

  What I can safely say in print
  You can safely say preservation relies on causal asymmetry without solving the mystery of time. The practice is underdetermined by cosmology; it works whether the arrow is fundamental or perspectival. Focus on the local requirement: causes precede effects, and records degrade without work. Commit only to a local environment where noise dominates signal. The distinction between bits and recipes reflects a tension between physical and abstract identity, not a disagreement about time's direction. Both strategies accept the arrow's reality for hardware. Your piece can treat preservation as a battle against local entropy, agnostic on global metaphysics. Stick to the physics of information.
