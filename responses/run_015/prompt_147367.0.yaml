      *   **Evidence:** "If you are in Blue Company, then you are in Headquarters" ($B \to H$).
      *   **Maya's Position:** Standard Conditioning (Conditionalization). Treat $B \to H$ as eliminating $B_F$. Renormalize over $\{R_H, R_F, B_H\}$. Result: $P_{new}(B) = 1/3$, $P_{new}(H) = 2/3$.
      *   **Noah's Position:** Jeffrey Conditioning / Independence Preservation. The evidence updates the conditional probability $P(H|B)$ to 1, but shouldn't affect the marginal $P(B)$. Result: $P_{new}(B) = 1/2$, $P_{new}(H) = 3/4$.
      *   **Twist 1 (Noah):** Selection Effect (Radio Band). Receiving the message might imply she is in Blue.
      *   **Twist 2 (Maya):** Rebuttal on Selection. She monitors all frequencies.
      *   **Twist 3 (Noah):** Local Informant. The speaker only knows about Blue, so the constraint is local.
