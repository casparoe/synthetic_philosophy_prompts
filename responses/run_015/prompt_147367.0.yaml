          *   *Verdict:* **Partly Right / Mostly Mistaken.** It's right that constraints restrict space, but wrong that they must restrict it *globally* by shifting mass to unrelated alternatives (Red). It mistakes the scope of the constraint.

      *   **Move 4: Noah's Broadcast-Frequency Selection Point.**
