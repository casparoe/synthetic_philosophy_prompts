      *   **Split-Mind (Intentionalist/Static):**
          *   *Claim:* Self-deception is analogous to interpersonal deception. Agent $S$ intends to make $S$ believe $P$ while knowing $\neg P$.
          *   *Problem:* The "Static Paradox." How can one simultaneously believe $P$ and $\neg P$? It violates rationality constraints on belief.
