      *   **Motivated-Reasoning (Deflationist/Dynamic):**
          *   *Claim:* No intention to deceive. Desire that $P$ causes bias in evidence gathering/weighting. Result: $S$ comes to believe $P$ despite evidence for $\neg P$.
          *   *Problem:* The "Dynamic Paradox" (How do you start the process without knowing the truth?) and the "Strangeness" (Why is it called *deception* if no lie is told?).
          *   *Solution:* It's just irrational belief formation, not literal deception.
          *   *Critique:* Doesn't capture the *phenomenology* of self-deception (the tension, the avoidance).

      *   **TA's "Functional Compartmentalization" (Predictive Processing/Modular View):**
          *   *Claim:* The brain runs multiple models. Model A predicts $P$ (for social signaling), Model B predicts $\neg P$ (for motor control). They don't share weights globally.
