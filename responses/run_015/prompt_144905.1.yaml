      *Body:*
      The debate regarding whether mental content is fixed by causal-role relations or intrinsic qualitative character has traditionally relied on uncalibrated armchair speculation. This paper introduces the Doxastic Mirror Protocol (DMP), a hypothetical experimental arrangement designed to standardise intuition generation. The DMP subjects an agent to a field wherein the causal consequences of a belief (e.g., 'fire burns') are inverted (touching fire causes cooling), yet the phenomenological experience of holding the belief remains mirrored (it feels identical to believing fire burns).

      Methodology
      Four hundred tenured metaphysicians were recruited via the Council for Speculative Infrastructure. Participants were subjected to a double-blind protocol wherein neither the subject nor the facilitator knew which intuition (externalist or internalist) was the control variable. Ethics approval was granted by the West Holloway Institutional Review Board for Imaginary Persons (Ref: WH-IRB-IP/24/88), ensuring no actual cognitive dissonance was sustained beyond acceptable tolerances. The apparatus utilised a series of angled conceptual mirrors, calibrated to 0.05 degrees of modal proximity. Replication studies were conducted using marginally altered mirror angles (45 vs. 46 degrees) to test for sensitivity drift.

      Results
      Initial data collection yielded a strong consensus (p < 0.01) that content is fixed by causal role, provided the mirror angle was set to the standard 45 degrees. However, 15% of participants reported conflicting intuitions. In previous qualitative analyses, such divergence would be treated as legitimate philosophical disagreement. Under the DMP framework, this variance was categorised as statistical noise resulting from improper pump priming. Confidence intervals (95% CI) were applied to the intensity of the participants' 'aha' moments. Those failing to experience the intended intuition within the confidence window were excluded as outliers possessing 'calibration-resistant cognitive architectures'. Notably, participants unaware of their assigned intuition reported significantly higher confidence in their erroneous judgments, suggesting that phenomenological certainty is inversely proportional to epistemic accuracy.

      Discussion
      The successful operationalisation of the DMP demonstrates that thought experiments function not as illustrative tools, but as precision instruments requiring regular maintenance. The observed correlation between mirror alignment and intuitive output suggests that prior convictions are merely artefacts of misaligned rhetorical machinery. Consequently, future research must focus on the material stability of the pump itself. We have submitted a grant application to the National Endowment for Conceptual Hardware to fund the quarterly polishing of the doxastic mirrors and the replacement of worn phenomenological gaskets. Without such maintenance, we risk a degradation of intuitive fidelity, potentially reverting the discipline to pre-empirical speculation.

      In conclusion, the DMP offers a robust mechanism for settling metaphysical disputes by treating dissent as measurement error. By securing funding for ongoing pump maintenance and standardising the angle of conceptual reflection, the field may finally eliminate the variable of human judgment from the equation of truth.

