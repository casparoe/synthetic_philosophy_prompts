answer: |-
  The border is two hours away and the engine is knocking, but Elias isn't slowing down. He's a smuggler who runs people across when the patrols are thin, and he's got a rule: he doesn't drop anyone off unless he's sure they'll pay the second half of the fee once their feet are on safe soil. He can't hold a deposit, he can't threaten you once you're out of his jurisdiction, and he knows you're fleeing the country for good so there's no reputation to burn. He just stops the car, looks you in the eye, and decides if you're the kind of person who pays debts that don't have to be paid. You're Mara, and you need the ride. You know that once you're across, handing over the cash is causally useless—it won't make the ride happen, it won't stop Elias from driving away, and it won't help you ever again. But you also know Elias is shrewd; if he reads you as a straightforward maximizer who cuts losses when leverage disappears, he leaves you here. So, right there in the passenger seat, you deliberately bind yourself to a personal constitution: "I close deals," not because you enjoy it, but as a standing policy that overrides local cost-benefit analysis. Elias reads the shift in your demeanor—the sudden rigidity of someone adopting a principle rather than calculating a tip—and starts the car. You cross. You're safe. The cash is in your hand. You know paying is pointless. But you hand it over.

  1.  **The thing and its acquisition:** The thing is a self-imposed constitutive rule acquired through deliberate resolution at the moment of negotiation. You don't cultivate a taste for gratitude or a love of honesty; you explicitly install a procedural constraint on your own future reasoning that says "execute the promised transfer regardless of current causal efficacy," and you do this instrumentally at t1 because having the constraint is the only ticket into the car.

  2.  **The violated norm:** The t2 act violates the norm of instrumental efficiency, which requires actions to be selected based on their capacity to bring about preferred future states. At the moment of payment, you lucidly judge that the money serves no end you currently hold (you're safe, you're leaving), yet you proceed, meaning you are intentionally choosing a dominated strategy relative to your situational desires.

  3.  **The working feature:** The single feature doing the work is the causal disconnect between the t2 action and the t1 benefit. The benefit (the ride) is already secured and counterfactually independent of the payment, so the only reason to pay is backward-looking, which standard instrumental rationality treats as irrelevant noise once the future is all that remains to be influenced.

  4.  **The collapse condition:** If you swap the rule for a desire or make reputation available, the tension collapses into an ordinary precommitment story where the t2 act becomes rational. If you genuinely *desired* to pay, satisfying that desire maximizes utility at t2; if reputation mattered, paying buys future credit; in both cases, the action has causal leverage toward a current goal, erasing the "rational irrationality" gap.

  5.  **The defusing move:** A defender who thinks rationality never requires irrationality would argue that rationality is diachronic, not synchronic, so you cannot judge the t2 act in isolation. They would claim that if it was rational to adopt the policy at t1, it must be rational to execute it at t2 (Resolute Choice), otherwise you were never truly rational at t1, effectively denying the coherence of "rational irrationality" by insisting on dynamic consistency.
