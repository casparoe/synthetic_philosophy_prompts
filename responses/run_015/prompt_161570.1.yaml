answer: |-
  You're making a category error on Marta and Sam by assuming the input must map one-to-one to the recipient, but we aren't allocating hours, we're allocating freedom expansions. Just because the labor is joint doesn't mean the capability gain is unmeasurable; it means we assess the vector of freedom for each person separately based on the same input. If an hour of care allows Marta to be clean and dignified, her capability set expands regardless of Sam's status. If that same hour gives Sam the freedom to work or rest instead of caregive, his set expands too. Welfare surveys fail here precisely because they capture adapted preferences—Sam might report high wellbeing because he loves Marta, even if he is effectively trapped as a caregiver with no real option to do otherwise. You say welfare has a unit that survives joint production, but that unit is subjective noise; capability measures the actual removal of barriers for each individual, even if the barrier removal is causally linked. We don't need to split the hour; we need to record the distinct freedom gains for each partner, and if your spreadsheet can't handle multiple outputs from one input, that's a spreadsheet problem, not a theory problem.

  On Jonah and Priya, you're treating robustness as an external add-on when it is actually constitutive of the capability set itself. A capability isn't just what you can do in the best-case scenario; it is the set of functionings you can achieve across relevant possible worlds, including the world where the co-op support glitches or stops. Jonah's capability set isn't {high functioning}; it is {high functioning if supported, bedridden if not}. Priya's is {moderate functioning if supported, moderate functioning if not}. To rank them, you don't need a new currency; you compare the intersection of their capability sets across these plausible scenarios. We value freedom that persists, so we rank sets by their secure subset—the functionings available in both the supported and unsupported states. Jonah's secure subset is nearly empty; Priya's is substantial. That isn't equality of robustness as a rival to capability; it is the correct evaluation of capability over time and risk. If you allocate based on Jonah's peak functioning, you are betting his freedom on our administrative perfection, which is no freedom at all.
