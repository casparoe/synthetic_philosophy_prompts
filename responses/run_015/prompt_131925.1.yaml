  2.  **Deconstruct the Philosophy & Engineering:**

      *   *Luminosity:* Condition $C$ is luminous iff $\forall$ cases $\alpha$, if $C$ obtains in $\alpha$, subject is in a position to know $C$ obtains in $\alpha$.
      *   *KK:* $Kp \to K Kp$. Often derived from luminosity of knowledge.
      *   *Margin for Error (Williamson):* Knowledge requires safety. If $p$ is known in $\alpha$, $p$ must be true in sufficiently similar cases. If cases form a continuum, luminosity fails.
      *   *The "Grain" Objection:* If the state space is discrete (finite values), there is a "last case" where $C$ holds and a "first case" where it doesn't. No intermediate case exists to violate safety.
      *   *The Counter-Objection:* The *location* of the grain boundary relative to the *conceptual* boundary matters. If the system classifies "High Risk" at value 10 but "Low Risk" at 9, does the system *know* it's High Risk at 10? If the measurement noise could push 10 to 9, safety is violated even if the state space is discrete.
      *   *Negative Luminosity:* $\neg Kp \to K \neg Kp$. Crucial for deferral (knowing when *not* to answer).
      *   *Dispositional vs. Actualized:* "In a position to know" (has access) vs. "Actually knows upon reflection" (process triggers).
