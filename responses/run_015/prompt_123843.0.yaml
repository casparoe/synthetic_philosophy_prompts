answer: |-
  To look alone upon the path ahead,
  And count no cost that time has made its own.
  For money spent is merely money dead,
  A seed that froze before it could be sown.
  To stay the hand because the purse was drained
  Is servitude to shadows and to dust.
  Where future gain by past loss is constrained,
  Reason submits to blind and broken trust.

  Yet certain goods require the past to stand,
  Not dead, but living in the promise kept.
  To drop the burden is to lose the hand
  That held the vow while all the others wept.
  Thus reason integrates the fractured soul,
  And grants the past a normative control.

  ***

  This poem takes liberties by treating narrative unity as an intrinsic good capable of overriding forward-looking utility maximization, a claim contested in standard welfare economics. It implicitly relies on a Narrative View of personal identity (akin to MacIntyre or Schechtman), which holds that the self is constituted by its history and commitments, rather than a Reductionist view (akin to Parfit), where the self is merely a series of psychological connections and past costs lack normative authority over future stages. By granting the past "normative control," the verse assumes diachronic rationality requires maintaining a coherent life-story, not just optimizing future welfare.
