ationality recognizes the stakes, but compelling as verse on its own. After the poem, include a brief, frank paragraph noting exactly where the argument takes liberties with philosophical precision—particularly regarding whether personal identity over time can bear the normative weight the poem assigns it—and stating clearly which contested view of the self, say a narrative or reductionist picture, the poem implicitly relies on.
