  # Part I: The Logical Space

  To sort the positions without relying on labels, we define the space using five binary distinctions derived from the provided cases. Each position is a unique coordinate in this space. Combinations marked [EMPTY] are excluded due to incoherence or lack of philosophical occupancy.

  **Axis 1: Determinacy (The Fact of the Matter)**
  *   **Realist:** There is a single true time at which the experience occurs.
  *   **Anti-Realist:** There is no single true time (either the question is empty or the answer is relative).

  **Axis 2: The Fixer (If Realist)**
  *   **Upstream:** The time is fixed by the physical/neural cause (stimulus registration).
  *   **Downstream:** The time is fixed by the functional consequence (report, access, or judgment).

  **Axis 3: Temporal Grain (Structure)**
  *   **Pointillist:** Experience happens at an instant (even if that instant is delayed).
  *   **Extensionalist:** Experience is inherently extended; asking for a "time" is asking for the duration of a process.

  **Axis 4: Revision Architecture (If Downstream/Realist)**
  *   **Editorial:** A revision requires an original draft that was experienced and then altered (Stalinesque).
  *   **Fabrication:** A revision creates a false memory of an experience that never occurred as reported (Orwellian).
      *   *Note: This distinction collapses for Upstream Realists and Anti-Realists.*

  **Axis 5: Evidential Authority**
  *   **First-Person:** The subject's report is the final arbiter of experience timing.
  *   **Third-Person:** Involuntary measures (EEG, latency) can override the subject's report.

  **The Eight Viable Positions (Leaves)**
  1.  **Neural Primitivism:** Realist / Upstream / Pointillist / (Revision N/A) / Third-Person.
  2.  **Access Functionalism:** Realist / Downstream / Pointillist / Fabrication / Third-Person.
  3.  **Predictive Constructivism:** Realist / Downstream / Pointillist / Editorial / Third-Person.
  4.  **Phenomenal Absolutism:** Realist / Downstream / Pointillist / Fabrication / First-Person.
  5.  **Dual-Aspect Theory:** Realist / Upstream & Downstream / Pointillist / (Revision N/A) / First-Person.
  6.  **Temporal Extensionalism:** Realist / (Fixer Irrelevant) / Extensionalist / (Revision N/A) / First-Person.
  7.  **Narrative Relativism:** Anti-Realist (Relative) / (Fixer Irrelevant) / (Grain Irrelevant) / (Revision Irrelevant) / First-Person.
  8.  **Hard Irrealism:** Anti-Realist (Empty) / (Fixer Irrelevant) / (Grain Irrelevant) / (Revision Irrelevant) / (Evidence Irrelevant).

  **Flagged Empty Combinations**
  *   **[EMPTY] Realist / Upstream / First-Person:** Incoherent. If the neural time fixes the experience, but the subject reports a different time, First-Person authority is violated.
  *   **[EMPTY] Anti-Realist / Third-Person:** Unattractive. If there is no fact of the matter, physiological data cannot settle the question; it can only describe correlations.
  *   **[EMPTY] Extensionalist / Upstream:** Unexplored. If experience is a process, fixing it solely by the onset of the neural cause ignores the duration of the process itself.

