  # Part II: The Diagnostic Instrument (Decision Tree)

  **Instructions:** Proceed through the nodes. Answer based strictly on the specific variant described. Follow the branch indicated by your judgment.

  **Node 1 (The Plain Display):** In the standard Color Phi case, is there a single, objective fact about when the subject experienced the motion onset, independent of any measurement tool?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2 (The Nature of the Void):** If there is no single fact, is the question meaningless (like asking for the color of a number) or merely relative to a descriptive framework (like asking if a train is moving)?
  *   **Meanless:** **Leaf 8 (Hard Irrealism)**.
  *   **Relative:** **Leaf 7 (Narrative Relativism)**.

  **Node 3 (The Masked Variant):** In the variant where the second flash is withheld/masked, did the subject have an experience of motion *before* the mask arrived, or was the experience generated only after the mask failed to appear?
  *   **Generated After (No original motion experience):** Go to Node 4.
  *   **Had Before (Original experience existed):** Go to Node 5.

  **Node 4 (The Evidence Override):** In the Plain Display, if scalp recordings indicate neural processing finishes 100ms after the subject reports the motion, does the recording prove the report wrong?
  *   **Yes (Physiology Trumps):** **Leaf 2 (Access Functionalism)**.
  *   **No (Report Trumps):** **Leaf 4 (Phenomenal Absolutism)**.

  **Node 5 (The Predictable Variant):** In the variant where the second color is perfectly predictable, is the mechanism producing the color change the same as in the standard illusion, or does prediction allow the experience to be authored early?
  *   **Same Mechanism (Postdictive):** Go to Node 6.
  *   **Different Mechanism (Predictive Authoring):** **Leaf 3 (Predictive Constructivism)**.

  **Node 6 (The Click Variant):** In the variant with an unrelated click during the gap, if the subject presses a key to the click at a latency consistent with the first dot, was the first dot consciously experienced at the moment of the press?
  *   **Yes (Conscious at Press):** Go to Node 9.
  *   **No (Conscious Only Later):** Go to Node 10.

  **Node 9 (The Revision Requirement):** If the first dot was experienced at the press, but the report later claims motion (which requires the second dot), must there have been an original "stationary dot" experience that was edited?
  *   **Yes (Editing Required):** **Leaf 1 (Neural Primitivism)**. *(Note: Path converges here due to the commitment to early consciousness fixed by neural latency).*
  *   **No (Memory Fabrication):** **Leaf 4 (Phenomenal Absolutism)**. *(Note: Convergence with Node 4 path).*

  **Node 10 (The Chimera Variant):** In the chimeric variant (opposite motions in hemifields), can the subject have two different "present moments" simultaneously, one for each field?
  *   **Yes (Two Nows):** **Leaf 5 (Dual-Aspect Theory)**.
  *   **No (One Now):** Go to Node 7.

  **Node 7 (The Structure Question):** Is the experience of motion a state that holds at an instant, or a process that essentially stretches over the interval between the dots?
  *   **Process/Stretch:** **Leaf 6 (Temporal Extensionalism)**.
  *   **State/Instant:** Go to Node 8.

  **Node 8 (The Fixer):** If it is a state at an instant, what fixes that instant: the time the brain physically registers the data, or the time the data becomes available for use?
  *   **Physical Registration:** **Leaf 1 (Neural Primitivism)**.
  *   **Availability for Use:** **Leaf 2 (Access Functionalism)**.

  *(Note: Nodes 9 and 10 are used to balance the tree depth and test specific case intuitions, ensuring the 10-node constraint is met while routing to the 8 leaves. Some leaves are reachable via multiple paths, reflecting philosophical overlap.)*

