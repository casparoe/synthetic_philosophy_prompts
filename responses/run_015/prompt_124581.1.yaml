  # Part III: The Leaves (Positions and Commitments)

  **Leaf 1: Neural Primitivism**
  *   **Definition:** Experience occurs at the time of the neural correlate; subjective reports of earlier timing are errors.
  *   **Awkward Commitment:** You are never conscious of the present; you are always conscious of the immediate past.

  **Leaf 2: Access Functionalism**
  *   **Definition:** Experience occurs when content becomes available for downstream control and report; unaccessed processing is not yet experience.
  *   **Awkward Commitment:** If you are distracted and fail to access a stimulus, you did not experience it, even if you later recall it.

  **Leaf 3: Predictive Constructivism**
  *   **Definition:** Experience is the brain's current model; timing is fixed by the model update cycle, allowing future data to author past content.
  *   **Awkward Commitment:** In a perfectly predictable world, you would experience events before they physically happen.

  **Leaf 4: Phenomenal Absolutism**
  *   **Definition:** Experience occurs exactly when it seems to occur; the content of the experience dictates its temporal location.
  *   **Awkward Commitment:** Conscious experience must be capable of influencing neural processing backward in time to align with the reported content.

  **Leaf 5: Dual-Aspect Theory**
  *   **Definition:** There are two real times: the physical time of the vehicle and the phenomenal time of the content; both are facts.
  *   **Awkward Commitment:** A single subject can literally inhabit two different temporal coordinates simultaneously (as in the Chimera case).

  **Leaf 6: Temporal Extensionalism**
  *   **Definition:** Experience is inherently extended; asking for a point-like "time of experience" is a category error.
  *   **Awkward Commitment:** There is no such thing as a "specious present" or a "now"; there is only duration.

  **Leaf 7: Narrative Relativism**
  *   **Definition:** The time of experience is not absolute but relative to the explanatory framework (neuroscientific vs. phenomenological).
  *   **Awkward Commitment:** Two contradictory claims about when an experience happened can both be true simultaneously.

  **Leaf 8: Hard Irrealism**
  *   **Definition:** There is no fact of the matter about the timing of experience; the question presupposes a non-existent entity.
  *   **Awkward Commitment:** The entire debate about the "timing of consciousness" is a linguistic confusion with no empirical resolution.

  ***

  # Part IV: Failure Modes and Dispute Verdicts

  **Indistinguishable Pairs**
  *   **Leaf 1 (Neural Primitivism) vs. Leaf 2 (Access Functionalism):** Both rely on Third-Person evidence to override report. They come apart only on *which* physiological marker counts (registration vs. availability), which is often empirically underdetermined in the Color Phi gap.
  *   **Leaf 7 (Narrative Relativism) vs. Leaf 8 (Hard Irrealism):** Both deny a single objective fact. They come apart only on whether the question is "relative" or "empty," which often collapses into a verbal dispute about the word "fact."

  **Substantive vs. Verbal Disputes**
  *   **Leaf 1 vs. Leaf 4:** **Substantive.** One affirms backward causation (or delay), the other denies it. Empirical predictions differ regarding interference tasks.
  *   **Leaf 2 vs. Leaf 3:** **Mostly Verbal.** Both locate experience downstream. The dispute is whether to call prediction "access" or "construction."
  *   **Leaf 5 vs. Leaf 1:** **Substantive.** Dual-Aspect accepts the Neural time *plus* a Phenomenal time; Neural Primitivism denies the Phenomenal time is real.
  *   **Leaf 6 vs. All Pointillists:** **Substantive.** Extensionalism denies the ontology of the "instant" that all other leaves presuppose.

  **Instrument Blind Spots**
  *   The instrument cannot separate **Leaf 2** and **Leaf 3** if the subject claims prediction is just a form of access. The *Predictable Variant* (Node 5) attempts this, but a Functionalist can absorb prediction as "early access."
  *   The instrument assumes the **Chimera Variant** (Node 10) is decisive for Dual-Aspect, but an Extensionalist could argue the two fields are just one extended process with varying content, bypassing the "two nows" conclusion.

  ***

  # Part V: The Transfer Question (Agency)

  **The Case:** The subject is asked to press a button at a time of their own choosing. They report the *intention* to press occurring 200ms *before* the press, but readiness potentials in the motor cortex begin 500ms *before* the press.

  **The Question:** Does the "timing of experience" apparatus you just used apply here? Specifically, if you hold **Leaf 1 (Neural Primitivism)**, must you say the intention was experienced 500ms before the press (unconscious for 300ms), or that the experience of intention is an illusion generated at 500ms?

  **The Diagnostic Value:**
  *   **Positions that Travel:** **Neural Primitivism** and **Access Functionalism** travel well. They treat agency as another signal to be timed by physiology or access.
  *   **Positions that Fracture:** **Phenomenal Absolutism** struggles here. In perception, they can blame "backward causation." In agency, claiming the *cause* of an action (intention) happens after the neural start of the action threatens the concept of agency itself, not just the timing of a qualia.
  *   **Positions that Collapse:** **Hard Irrealism** often retreats in the face of agency. Participants who claimed "no fact of the matter" for Color Phi often insist there *must* be a fact for voluntary action, revealing that their Irrealism was specific to passive perception, not a general metaphysics of mind.

  **Verdict:** If a participant's position shifts between the Color Phi case and this Agency case, their view is likely a **heuristic coping strategy** rather than a unified theory of temporal experience.
