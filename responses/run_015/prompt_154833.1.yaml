          *   Misconceptions to defuse (and when): "Money is imaginary," "Locke with extra steps," "Denies material causation in economics."
          *   Assessment/Check: How to verify understanding without slogan-parroting.
          *   Scope limit: What to explicitly exclude (e.g., Bank of Ireland proposals).
      *   **Tone:** Casual (user is on phone, expects typos, wants practical advice).

  2.  **Deconstruct the Philosophical Link:**
      *   Berkeley's immaterialism: No matter, only minds and ideas.
