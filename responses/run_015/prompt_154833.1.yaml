      *   *The Connection:* Both rely on the rejection of *abstract general ideas* (Locke's target). For Berkeley, you can't abstract "value" from the "sign" (money) any more than you can abstract "existence" from "perception." Money functions like language: it signifies without needing a material substratum to ground it.
      *   *The Pressure:* If money *needs* gold to be real (materialism), then immaterialism is threatened in the social sphere. If money works *without* intrinsic material value, it validates the idea that reality is constituted by relations/perceptions, not substrata.

  3.  **Determine the Foundational Concept:**
