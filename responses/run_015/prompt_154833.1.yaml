  9.  **Refining the "Pressure" Argument:**
      *   Make sure to emphasize *why* this pressures immaterialism. If Berkeley admits money needs gold, he admits matter is necessary for social reality. If he says money works without gold, he proves social reality is mind-dependent. It's a consistency check.

  10. **Final Review against constraints:**
      *   Grad students? Yes, keep level high.
      *   Casual tone? Yes.
      *   Specific questions answered? Yes.

