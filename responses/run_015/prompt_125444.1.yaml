answer: |-
  ### The Algorithm Test: What's Actually Driving the Bus?

  **The Case:** A hiring algorithm screens out candidates who don't match historic productivity norms (e.g., no weekends, humble language). No human programmed it to be religious, but it embedded old Protestant Work Ethic values anyway.

  **Node 1: The Consciousness Check**
  For these values to count as a "cause," does a human have to be consciously believing them right now?
  *   **Yes, values need a believer.** → Go to Node 2.
  *   **No, systems can hold values too.** → Go to Node 3.

  ***

  **Node 2: The Cash Test** *(For those who said Yes above)*
  If the company realizes this algorithm is losing them money by missing great talent, will they scrap the "values" embedded in it?
  *   **Yes, profit always wins.** → **Materialist Reduction**
  *   **No, the culture sticks even when it costs us.** → **Hard Weberian Value-Causation**

  ***

  **Node 3: The Inertia Test** *(For those who said No above)*
  Is the algorithm's bias just a neutral shortcut for efficiency, or is the "old way" itself the engine driving the decision?
  *   **Just a shortcut; efficiency is the real driver.** → **Epiphenomenal Culture**
  *   **The "old way" has its own force; history is doing the work.** → **Unnamed Hybrid**

  ***

  **⚠️ Glitch in the Matrix**
  **Hard to Separate:** *Materialist Reduction* vs. *Epiphenomenal Culture*.
  In practice, both positions end up saying "follow the money." One says culture is a disguise for economics; the other says it's just smoke from the engine. If you landed on either, you agree on the outcome even if you disagree on the label.
