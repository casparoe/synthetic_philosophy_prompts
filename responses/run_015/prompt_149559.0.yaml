answer: |-
  This is a sophisticated dissection of labor law and political philosophy. You have identified a tension between **catastrophic liability** (compensating death) and **chronic prevention** (limiting exhaustion).

  Below is a reconstruction of the implicit theory governing these systems, an analysis of its coherence, and a breakdown of what is logically required versus culturally contingent. I have separated settled empirical claims from contested philosophical interpretations at the end.

  ### 1. Reconstructing the Implicit Theory: "Productive Citizenship"

  The patchwork you describe (Japan's compensation without prevention; France's caps without cultural enforcement) presupposes a theory of **Productive Citizenship**. In this framework, the primary political obligation of the adult is economic participation.

  *   **Work as Ontological Priority:** Work is not merely a contract; it is the default state of the citizen. Leisure is derivative. It exists to restore the worker's capacity to work, not as a sphere for human flourishing independent of labor.
  *   **Harm as Threshold-Based:** The state intervenes only when labor destroys the *instrument* of production (the body) to the point of non-repair (death or severe disability). Chronic exhaustion is treated as a "cost of doing business" rather than a rights violation, provided the worker remains functional.
  *   **Liberty as Non-Interference (Mostly):** The "right to disconnect" (France) is largely a **negative liberty**—a right to be left alone by the employer. It is not necessarily a **positive liberty**—a guaranteed entitlement to a specific quality of restorative time. Similarly, *karoshi* compensation is a post-hoc remedy, not a pre-emptive guarantee of safety.
  *   **The Moral Valence of Idleness:** You mention the Protestant Work Ethic. While historically specific to Calvinism, the *functional equivalent* in both Japan (Confucian/Post-war reconstruction ethos) and France (Republican solidarity through labor) is that **unclaimed time is suspicious.** If you are not working, you must be "recovering to work." If you are simply *living*, the system lacks a category for that.

  **The Implicit Syllogism:**
  1.  Society requires production.
  2.  Citizens are the engines of production.
  3.  Engines require maintenance (leisure) and insurance (compensation).
  4.  Therefore, protect the engine from breaking, but do not stop the engine from running hot.

  ### 2. Coherence Check: Are the Parts Pulling Apart?

  The system is **instrumentally coherent** (it sustains high productivity) but **normatively incoherent** (it contradicts its own stated values regarding human rights).

  *   **The Prevention/Compensation Paradox:** Recognizing *karoshi* admits that overwork kills. Failing to enforce the 40-hour week permits overwork. This creates a moral hazard: it is cheaper for firms to risk compensation claims than to hire more staff. The system implicitly prices death.
  *   **The Legal/Cultural Gap:** In France, the 35-hour week is law, but "cadre" (managerial) exemptions often nullify it. In Japan, the law exists, but *sabaru* (service overtime/unpaid) is culturally enforced. This suggests the "right" is not to *time*, but to *wages for time*. If you are salaried, your time is presumed owned.
  *   **Harm Registration:** You ask if harm only registers at death. Strictly speaking, no. Mental health claims (*karojisatsu* or suicide from overwork) exist. However, the threshold is **pathology**, not **deprivation**. You must prove illness to claim a right to rest. This implies you have no right to rest unless you are broken.

  **Verdict:** The system is coherent only if you accept that **economic output is the supreme good.** If human flourishing is the supreme good, the system is incoherent because it protects the *capacity to labor* more than the *laborer*.

  ### 3. Required vs. Fitting (Logical Necessity vs. Cultural Contingency)

  To understand what can change, we must distinguish what the system *needs* to function versus what merely *supports* it.

  | Feature | **Strictly Required by Practice** | **Fits Well (Contingent)** |
  | :--- | :--- | :--- |
  | **Thresholds** | **Required:** Some line must be drawn for liability (e.g., 100 hrs overtime). Courts cannot adjudicate "tiredness." | **Contingent:** Where that line is drawn (35 vs 40 hrs) and whether it is rigid or flexible. |
  | **Compensation** | **Required:** If the state mandates labor laws, it must offer recourse for violation. | **Contingent:** That recourse is monetary/insurance based rather than criminal/corporate liability. |
  | **Work Primacy** | **Required:** Employment must remain the primary mechanism for survival (wages). | **Contingent:** The *moralization* of work (idleness as sin). You can have wage-labor without moralizing it. |
  | **Leisure** | **Required:** Rest periods must exist for biological safety. | **Contingent:** That rest is viewed as "recovery" rather than "autonomy." |
  | **Enforcement** | **Required:** Some mechanism to verify hours. | **Contingent:** That enforcement relies on self-reporting or complaints rather than proactive auditing. |

  **Key Insight:** The system *requires* a definition of harm that is adjudicable (death, diagnosed illness). It does *not* require the moral suspicion of idleness. That suspicion is a cultural overlay that makes the harsh economics palatable.

  ### 4. Institutionalizing Leisure as a Basic Right

  If we shift from "Leisure as Recovery" to "Leisure as a Basic Right" (Positive Liberty), the institutional architecture flips. Currently, work is the default, and leisure is the exception. In the new model, **time sovereignty is the default, and labor is the temporary suspension of that right.**

  **Required Institutional Changes:**
  1.  **Decoupling Survival from Labor:** If leisure is a right, you cannot starve when not working. This implies some form of **Universal Basic Income** or robust social dividend. Without this, the "right to leisure" is only for the wealthy.
  2.  **Strict Liability for Overtime:** Currently, overtime is often negotiable. Under a leisure-right framework, overtime would be a **rights violation** akin to trespassing, not just a wage calculation. It would require state pre-approval, not just employer-employee agreement.
  3.  **Inversion of Burden of Proof:** Currently, workers must prove they were overworked to get compensation. In a leisure-right system, employers must prove that work demands did not infringe on guaranteed time sovereignty.
  4.  **Redefining "Harm":** Legal recognition of **time poverty** as a harm independent of health outcomes. If work prevents civic participation or family care, it is a rights violation, even if the worker is healthy.

  ### 5. Settled vs. Contested

  Per your request, here is the distinction between empirical realities and philosophical debates.

  #### **Settled (Empirical/Legal Consensus)**
  *   **Japan:** *Karoshi* is a legally compensable condition under Workers' Accident Compensation Insurance. The threshold generally involves roughly 100 hours of overtime in a single month or 80+ hours over several months prior to death/illness.
  *   **France:** The 35-hour work week is codified law (Aubry Laws), though annualized hour calculations allow flexibility. The "Right to Disconnect" (2017) requires companies to negotiate digital usage policies, though penalties for violation are often weak.
  *   **Enforcement Gap:** In both jurisdictions, there is a documented gap between statutory hours and actual hours worked, particularly for salaried/exempt workers.
  *   **Harm Thresholds:** Compensation systems generally require medical evidence of pathology (cardiovascular, psychiatric) or death; they do not compensate for "chronic exhaustion" absent diagnosis.

  #### **Contested (Philosophical/Sociological Debate)**
  *   **The "Protestant" Label:**
      *   *View A:* The moralization of work in Japan and France is a functional equivalent of the Protestant Work Ethic (Weberian view), where idleness is inherently suspicious.
      *   *View B:* This is a category error. Japan's work ethic stems from Confucian loyalty and post-war nation-building; France's stems from Republican solidarity. Lumping them under "Protestant" obscures specific cultural drivers.
  *   **The Function of *Karoshi* Recognition:**
      *   *View A (Critical):* Recognizing *karoshi* functions as a "safety valve." It allows the state to appear benevolent while maintaining the structural conditions that cause overwork (monetizing death rather than preventing it).
      *   *View B (Defense):* Recognition is a necessary first step in legal realism. You cannot legislate against a harm you do not officially acknowledge. It creates a precedent for stricter future regulation.
  *   **Leisure as a Right:**
      *   *View A:* Leisure cannot be a positive right without economic contraction. Time is a finite resource; guaranteeing it reduces aggregate productivity and competitiveness.
      *   *View B:* Guaranteed leisure increases productivity via innovation and health (Keynesian view). The "loss" is only visible under a metric that values output over well-being.
  *   **Negative vs. Positive Liberty:**
      *   *View A:* The "Right to Disconnect" is sufficient. It protects the private sphere from invasion (Negative Liberty).
      *   *View B:* Negative liberty is insufficient if economic coercion forces you to check email anyway. True liberty requires positive entitlements (time and income) that make refusal viable.

  ### Summary
  The current institutional patchwork presupposes that **human beings are capital assets.** You insure the asset against total loss (*karoshi* compensation) and schedule maintenance (weekends/hours), but you do not grant the asset sovereignty over itself.

  To treat leisure as a basic right requires shifting the ontology: **Human beings are time-sovereign citizens who occasionally sell labor.** This requires decoupling survival from employment and shifting the burden of proof onto the employer to justify any intrusion on time, rather than on the worker to prove injury.
