answer: |-
  Here is the specification for an adequate theory of propositional unity, tailored to your constraints and the dual jobs of semantics and attitude objects.

  ### The Spec: Desiderata for Propositional Unity

  | Desideratum | The Case / Consideration (Why it's a requirement) | What It Knocks Out | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Unity vs. Heap** | A proposition must have truth conditions; a list of constituents does not. "Socrates" + "Wisdom" does not assert anything until unified. | Extensional set theories; mereological sums. | **Non-negotiable** |
  | **2. Directionality** | *aRb* is distinct from *bRa*. The mode of combination must encode asymmetry without adding a new relatum. | Symmetric relation theories; unstructured sets. | **Non-negotiable** |
  | **3. No Extra Constituent** | If the unifier is a constituent, it requires a further unifier (Bradley's Regress). The unifier must be ontologically distinct from the constituents. | Copula theories; Relational Realism that treats the tie as an object. | **Non-negotiable** (per your constraint) |
  | **4. Falsehood** | We can believe what is not the case. Unity cannot depend on worldly instantiation (facts). | Fact-based ontologies (e.g., early Armstrong) where no fact = no proposition. | **Non-negotiable** |
  | **5. Scalability** | Natural language is recursive. The theory must handle embedding (*John believes that Mary thinks that...*) without structural collapse. | Atomistic theories; simple binary combination models. | **Non-negotiable** |
  | **6. Mind-Independence** | Truth is prior to judgment. Two people can believe the *same* thing; you can remember what you once believed. | Psychologism; Idealism; Russell's Multiple Relation Theory (in its act-dependent form). | **Non-negotiable** |
  | **7. Fine-Grainedness** | Attitude reports distinguish co-extensive contents (Hesperus/Phosphorus). The structure must track cognitive significance, not just reference. | Possible Worlds semantics (intensional); Millian direct reference without modes of presentation. | **Non-negotiable** (for attitude job) |
  | **8. Truth-Aptness** | The output must be the *kind* of thing that bears a truth value, not just a complex object. | Names of complexes; picture theories that lack assertoric force. | **Non-negotiable** (for semantics job) |

  **Notes on Your Guesses:**
  *   *"Unity must be explained rather than accepted as primitive":* You are correct; this is a **Preference** (explanatory zeal). Treating unity as a brute, primitive fact stops the regress but dissatisfies the metaphysician.
  *   *"Proposition must contain exactly the items the sentence mentions":* This is a **Preference** (Structuralism). A theory could map sentences to structured contents that differ slightly from surface grammar (e.g., logical form) and still do the job.

  ---

  ### The Hard Constraints & The Collapse

  **Constraint:** No thinker activity (anti-psychologism) + No extra constituent (anti-regress).

  **Is there a way through?**
  Strictly speaking, **no**. The enterprise collapses unless you equivocate on the word "constituent."
  If constituents are mind-independent objects (Desideratum 6), they are ontologically inert. If you forbid an agent to arrange them (Constraint 1) and forbid a glue constituent to bind them (Constraint 2), there is nothing to ground **Directionality** (Desideratum 2). Inert items do not order themselves.
  *The Only Escape:* You must posit a **Categorial Distinction** (Frege). One constituent is an "object" (saturated), the other is a "function/concept" (unsaturated). The unsaturated item *contains* the unity intrinsically because it is essentially predicative.
  *The Catch:* This violates the spirit of "No Extra Constituent" if you count the function as a constituent. It saves the theory only by claiming the predicate isn't an *object* constituent, but a different ontological category entirely. If your group insists all constituents are objects, the theory collapses.

  ---

  ### The Unsatisfiable Subset

  **Minimal Unsatisfiable Subset (MUS):**
  { **Directionality**, **No Extra Constituent**, **Mind-Independence** }

  **The Argument:**
  1.  **Mind-Independence** entails constituents are what they are regardless of being thought (they are inert).
  2.  **No Extra Constituent** entails there is no ontological "tie" or "order" added to the constituents.
  3.  **Directionality** requires an asymmetry in the combination (*aRb* vs *bRa*).
  4.  If constituents are inert and no tie is added, there is no source for the asymmetry. The complex *aRb* is ontologically indistinguishable from the heap {a, R, b}.
  5.  Therefore, you cannot have all three. You must sacrifice Mind-Independence (go Russellian/Psychologistic), sacrifice No Extra Constituent (accept the regress or a brute tie), or sacrifice Directionality (deny propositions are structured).

  ---

  ### The Single Requirement That Does The Most Work

  **No Extra Constituent.**
  This is the engine of the regress. Every other desideratum can be met by adding structure (e.g., add a relation for directionality, add a mind for independence). This requirement forbids the obvious solutions, forcing the theory into the narrow corner of "Objective Non-Mereological Composition." It excludes the vast majority of realist ontologies.

  ---

  ### Brief Evaluation of Main Options

  | Theory | Performance against Spec | Fatal Flaw (relative to your constraints) |
  | :--- | :--- | :--- |
  | **Fregean (Unsaturatedness)** | **Strongest Survivor.** Handles Directionality via function/argument distinction; handles Falsehood (Senses exist regardless of Reference); handles Mind-Independence (Third Realm). | Strains **No Extra Constituent**. Is the "unsaturatedness" a constituent property or a category error? Also struggles with **Fine-Grainedness** regarding identity statements if senses are objective. |
  | **Russellian (Judgment/Act)** | Fails immediately. Unifies via the thinker's act of judging. | Violates **No Thinker Activity**. Makes truth dependent on judgment (violates Mind-Independence). |
  | **Possible Worlds (Sets)** | Fails **Unity** and **Directionality**. A set {a, b, R} is a heap; an ordered pair <a, b> requires an ordering principle (which is an extra constituent). | Violates **Unity vs. Heap**. Sets do not assert; they just are. Also fails **Fine-Grainedness** (necessarily equivalent propositions collapse). |
  | **Wittgensteinian (Showing)** | Fails the job description. Claims unity is shown by the proposition's existence, not stated by a theory. | Violates **Semantics Job**. You cannot *state* truth conditions, only display them. Useful for therapy, useless for compositional semantics. |

  **Verdict:** The Fregean view is the only real survivor, but only if your group accepts that "unsaturatedness" is not a covert extra constituent. If they treat the concept as just another object, the regress re-starts immediately.
