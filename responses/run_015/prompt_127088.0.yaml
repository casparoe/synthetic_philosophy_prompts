      *The Conflict:*
      In Active Inference (AIF), EFE = Risk + Ambiguity.
      Risk = Divergence between predicted outcomes and prior preferences.
      Ambiguity = Expected entropy of outcomes given states (uncertainty about mapping).
      Minimizing EFE minimizes Risk (getting preferred outcomes) AND Ambiguity (resolving uncertainty to make future predictions better).

      Myopic VFE (Variational Free Energy) minimizes immediate surprise (prediction error).
      If I act to minimize immediate surprise, I act to make sensations match current predictions.
      If I act to maximize reward (hedonic), I act to get pleasant sensations.

      To get a divergence:
      Action A must minimize immediate surprise (match current prediction) AND be hedonically pleasant (or least aversive).
      Action B must be selected by EFE.
      Why would EFE select B? Because B reduces Ambiguity (information gain) which lowers *future* free energy, even if it incurs higher immediate surprise or risk?
      Wait, EFE minimizes *expected* free energy over a trajectory.
      If Action A minimizes immediate surprise (Myopic VFE) and is hedonically good (Reward), it likely has low Risk (matches preferences).
      For EFE to choose B, B must have lower *Expected* Free Energy.
      EFE = Risk + Ambiguity.
      If A is hedonically good, Risk for A is low.
      If A minimizes immediate surprise, it confirms current beliefs.
      For B to win on EFE, B must have significantly lower Ambiguity (high information gain) that outweighs higher Risk? Or does B have lower Risk in the *long run*?
      The prompt specifies: "The epistemic bit... is already inside the same quantity as the pragmatic bit... ambiguity term has to earn its keep structurally."
      Usually, EFE drives epistemic behavior (exploration) when Risk is equal or when resolving ambiguity prevents future Risk.
      If Myopic VFE says A (confirm current belief/minimize immediate error) and Reward says A (pleasant), then A is the "comfortable" option.
      For EFE to say B, B must be the "informative" option that reduces uncertainty about the state of the world, which is instrumentally valuable for *future* control (structural ambiguity reduction), not just "curiosity".
      However, if A is low surprise and low risk, why would EFE prefer B?
      Only if A leads to high *future* surprise because the current model is uncertain (high ambiguity) and acting to confirm it (A) doesn't resolve the uncertainty needed for future control, whereas B resolves it.
      But Myopic VFE minimizes *current* surprise.
      So:
      Scenario: Agent expects X. Sensations are slightly ambiguous.
      Action A: Confirms X (low immediate surprise), feels good (low risk/hedonic), but leaves underlying state uncertain (high ambiguity).
      Action B: Tests X (higher immediate surprise/potential discomfort), but resolves state uncertainty (low ambiguity), securing future control.
      Problem: If A minimizes immediate surprise, the agent *predicts* A leads to sensations matching predictions.
      If B is chosen by EFE, it's because $G(\pi_B) < G(\pi_A)$.
      $G = \text{Risk} + \text{Ambiguity}$.
      If Reward says A, then Prior Preferences favor A's outcomes. So Risk(A) < Risk(B).
      For EFE to prefer B, Ambiguity(B) must be much lower than Ambiguity(A), enough to offset the Risk difference.
      This implies A leaves the agent unsure about something critical for future survival/control, while B clarifies it.
      Is this possible without stipulating a "curiosity bonus"? Yes, if the uncertainty threatens future preference fulfillment (instrumental epistemic value).
      But the prompt says: "Myopic reading says do A... Expected-free-energy reading says do B."
      Myopic VFE minimizes $F$ (variational free energy) at time $t$. This is equivalent to minimizing prediction error.
      If the agent predicts "Doing A feels good", then doing A minimizes PE.
      If the agent predicts "Doing B feels uncertain/bad", then doing B increases PE.
      So Myopic says A.
      Reward says A (because A feels good).
      EFE says B (because B resolves uncertainty necessary for future preferences).
      This seems theoretically possible within AIF. The trick is writing the scenario so it's clear without jargon.

      *Constraint Check:* "The ambiguity term has to earn its keep structurally — e.g. by being load-bearing for a wide swath of downstream predictions — not by being a novelty preference in a trench coat."
      This means the uncertainty resolved by B must be about something that matters for future control, not just "knowing for knowing's sake".
      Example: A noisy bridge.
      Option A: Walk across quickly (matches prediction "I cross", feels safe initially, low immediate surprise).
      Option B: Test the railing first (delays crossing, creates friction/surprise "why am I stopping?", but resolves uncertainty about structural integrity).
      If the railing is actually weak, A leads to death (high future surprise). B prevents this.
      But EFE calculates *expected* free energy.
      If the agent *expects* the bridge to be safe (prior belief), then Risk(A) is low.
      Why would Ambiguity(A) be high? Because the sensory data so far is noisy regarding the railing's strength.
      Action A (walking) doesn't sample the railing's strength well (high ambiguity).
      Action B (shaking railing) samples it well (low ambiguity).
      Even if the agent prefers crossing (Risk favors A), if the uncertainty is high enough, the Ambiguity term might push towards B to ensure the preference can be fulfilled safely later.
      However, if the agent *believes* it's safe, Risk(A) is low.
      For EFE to choose B, the Ambiguity reduction must outweigh the Risk cost of delaying/effort.
      This is the standard "exploration vs exploitation" trade-off formalized in EFE.
      The prompt requires: Myopic Reward also says A. (Crossing is pleasant/goal-directed).
      Myopic VFE says A. (Crossing matches prediction "I am crossing").
      EFE says B. (Testing reduces ambiguity about state "is bridge safe", which is load-bearing for the preference "stay alive/cross successfully").

