prompt: |-
  So I've somehow ended up owning the risk register at the small housing association I work for — I'm not a risk person, I do comms — and the board wants, every quarter, a single likelihood × impact score for each risk so they can rank them and decide what to spend money on. I've been reading a bit about imprecise probabilities (upper and lower probabilities, intervals instead of point estimates, that old risk-versus-uncertainty distinction) and its obvious to me that half our entries just aren't single numbers, but I can't turn that into something I can actually run in the half-day I get per quarter, for a lay board who will only ever ask "so is it a 3 or a 4?".

  What I want is a procedure I can reuse. Concretely: how do I decide whether a risk gets a point estimate or a range; how wide is too wide to be useful any more; when is collapsing a range to one number legitimate and when is it just fake precision; how do I rank two ranges that overlap — and I assume that sometimes the honest answer is "these dont rank, and here's what the board should do instead"; and how do I say anything about the register as a whole when most of our risks share the same underlying cause, so adding them up feels like double counting. One more thing I keep hitting: sometimes new evidence makes my range wider rather than narrower, and I want the procedure to have something to say about that rather than treating it as me messing up.

  It has to be honest about which steps are judgment calls dressed up as method, and it has to be defensible by a non-specialist both to the finance director who signs it off and to an external auditor a year later.

  Please run it on three entries and show the working: (a) our main repairs contractor going insolvent in the next 12 months, where we do have some sector base rates; (b) a fine under a new building-safety regime that hasn't actually started enforcing yet, so there's no base rate at all; (c) reputational damage from a social media storm, where our own response changes the probability. And include at least one case where the procedure gives an answer the board is going to hate. British English please, plain language, and as little notation as you can get away with.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Communications professional at a small housing association. Not a risk specialist.
      *   **Task:** Owns the risk register. Needs to produce a quarterly report for the Board.
      *   **Board Requirement:** Wants a single Likelihood $\times$ Impact score per risk to rank them and allocate budget.
      *   **User's Insight:** Knows about imprecise probabilities (intervals, Knightian uncertainty). Realizes many risks can't be reduced to single numbers without lying.
      *   **Constraints:**
          *   Time: Half-day per quarter.
          *   Audience: Lay Board (want "3 or 4?"), Finance Director (needs defensibility), External Auditor (needs audit trail).
          *   Language: British English, plain language, minimal notation.
          *   Specific Questions to Answer:
              *   Point estimate vs. range?
              *   How wide is too wide?
              *   When is collapsing legitimate vs. fake precision?
              *   How to rank overlapping ranges?
              *   How to handle correlated risks (double counting)?
              *   How to handle widening ranges with new evidence?
              *   Must admit where judgment calls are made.
      *   **Deliverables:** A reusable procedure + Worked examples on three specific risks (Contractor insolvency, Building safety fine, Social media storm). One answer must be one the Board will hate.

  2.  **Deconstruct the Challenge:**
      *   *The Tension:* The Board wants simplicity (ranking); Reality is complex (uncertainty).
      *   *The Solution:* A "Traffic Light" approach to uncertainty itself. Don't fight the single number requirement, but qualify it heavily. Use a "Confidence-Adjusted Score."
      *   *The "Honest" Bit:* Explicitly state when a number is a guess vs. a calculation.
      *   *The "Audit" Bit:* Document the *reasoning*, not just the number.
      *   *The "Correlation" Bit:* Group risks by theme rather than summing scores.

  3.  **Develop the Procedure (The "Half-Day Protocol"):**
      *   *Step 1: Triage (Point vs. Range).* Use data availability as the criterion. Good data = point. No data/complex dynamics = range.
      *   *Step 2: Scoring.* Keep the 1-5 scale (standard for housing/charity sectors).
      *   *Step 3: The "Uncertainty Flag".* This is crucial. If the range is wide, flag it.
      *   *Step 4: Ranking.* If ranges overlap, don't rank. Group them.
      *   *Step 5: Aggregation.* Don't add scores. Count "High Confidence High Risks."
      *   *Step 6: Widening.* Explicitly allow "Increased Uncertainty" as a status.

  4.  **Drafting the Procedure (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, pragmatic, British (e.g., "programme," "centre," "whilst").
      *   *Notation:* Avoid $P(A)$, use "Chance."
      *   *Defensibility:* Emphasize the "Audit Note."
      *   *The "Board Hate" Requirement:* I need to ensure one of the examples results in "We cannot rank this" or "This number is meaningless."

  5.  **Developing the Worked Examples:**
      *   *(a) Contractor Insolvency:* Has base rates (sector data). Can be a point estimate (or narrow range). *Outcome:* Defensible number.
      *   *(b) Building Safety Fine:* New regime, no enforcement history. Deep uncertainty. *Outcome:* Wide range, Board hates it (can't rank).
      *   *(c) Social Media:* Endogenous probability (response changes outcome). *Outcome:* Dynamic range, widening upon new info.

  6.  **Addressing Specific User Questions within the Procedure:**
      *   *Point vs. Range:* Data availability test.
      *   *Too Wide:* If the range spans more than 2 points on the 1-5 scale, it's "Unassessable."
      *   *Collapsing:* Only if the cost of being wrong is low.
      *   *Ranking Overlaps:* Don't. Use "Tiers."
      *   *Correlation:* Cluster by "Root Cause."
      *   *Widening:* Label as "Emerging Uncertainty."

  7.  **Refining the "Board Hate" Aspect:**
      *   Boards love heatmaps. They hate being told "We don't know."
      *   For the Building Safety risk, the procedure must conclude: "Do not assign a single score. Treat as a compliance imperative regardless of probability." This frustrates the "rank and spend" model.

  8.  **Review against Constraints:**
      *   *Half-day feasible?* Yes, the triage is quick.
      *   *Auditor defensible?* Yes, because the reasoning is documented.
      *   *British English?* Check spelling (organisation, programme, colour).
      *   *Plain Language?* Avoid "epistemic," "aleatory," "Bayesian." Use "knowledge," "randomness," "updating."

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Initially, I thought about suggesting a complex weighted average. *Correction:* No, user has half a day. Keep it to "Best Estimate + Confidence Flag."
      *   *Correction:* Make sure the correlation part doesn't require math. Just grouping.
      *   *Check:* Did I explain *why* widening is okay? Yes, "honesty over comfort."

  10. **Final Structure:**
      *   Introduction (Acknowledging the bind).
      *   The Procedure (6 Steps).
      *   The Worked Examples (a, b, c).
      *   How to Present to the Board (The "Script").
      *   Audit Trail Note.

  (Proceed to generate output based on this thought process.)
answer: |-
  This is a classic bind: you are being asked for precision where there is only ambiguity. If you give them single numbers, you lie. If you give them philosophy, they ignore you.

  The solution is a procedure that treats **uncertainty as a data point** in itself. You will still produce the scores they want, but you will attach a "confidence flag" to each one. This allows you to be honest without refusing to play the game.

  Here is a reusable procedure designed for a half-day quarterly review, defensible to an auditor, and written for a lay board.

  ### The "Confidence-Adjusted" Risk Procedure

  **Step 1: The Data Test (Point vs. Range)**
  For every risk, ask: *Do we have external data or internal history for this?*
  *   **Yes:** You may use a **Point Estimate** (e.g., "3").
  *   **No:** You must use a **Range** (e.g., "2 to 4").
  *   *Audit Note:* Record the source of the data (e.g., "Industry insolvency stats 2023") or the reason for its absence (e.g., "New legislation, no precedents").

  **Step 2: The Width Limit (When is a range too wide?)**
  Your scoring scale is likely 1 to 5.
  *   If the range spans **one point** (e.g., 3 to 4), collapse it to the higher number for the Board's ranking, but flag it as "Low Confidence."
  *   If the range spans **two points or more** (e.g., 2 to 4), do **not** collapse it. This risk is "Unassessable."
  *   *Why:* Collapsing a wide range is fake precision. It is better to tell the Board they are flying blind than to give them a false map.

  **Step 3: Ranking Overlapping Ranges**
  *   If Risk A is (3 to 4) and Risk B is (4 to 5), Risk B is higher.
  *   If Risk A is (3 to 4) and Risk B is (3 to 4), **they cannot be ranked.**
  *   *Action:* Group them into a "Tier." Tell the Board: "These two risks are mathematically indistinguishable. Do not choose between them based on score. Choose based on strategic fit."

  **Step 4: Handling Correlation (The Double-Counting Trap)**
  *   Do not add up risk scores. It is meaningless.
  *   Instead, group risks by **Root Cause**. If "Contractor Insolvency" and "Materials Shortage" both stem from "Economic Downturn," list them under one header.
  *   *Report:* "We have five high risks, but three of them are driven by the same economic cause. Fixing the cause fixes three risks."

  **Step 5: The "Widening" Rule**
  *   If new information makes you *less* sure (e.g., the range goes from 3–4 to 2–4), record this as **"Emerging Uncertainty."**
  *   *Defence:* This is not a mistake; it is a warning. It means the environment is becoming volatile. This often warrants *more* attention than a stable high risk.

  **Step 6: The Board Summary**
  *   Produce the heatmap they want.
  *   But include a column next to the score called **"Confidence."** (High, Medium, Low).
  *   Any risk with "Low" confidence cannot be used to justify spending unless the spending is for *information gathering*.

  ---

  ### Worked Examples

  Here is how you apply this in your half-day session.

  #### (a) Main repairs contractor going insolvent (12 months)
  *   **Data:** You have sector base rates. The Construction Industry Scheme (CIS) or Insolvency Service publishes annual failure rates for firms of this size. Let's say it's 4%.
  *   **Step 1 (Data Test):** Pass. We have external data.
  *   **Step 2 (Width):** Your internal knowledge suggests your contractor is slightly more stable than average. You assess the likelihood as a Point Estimate of 2 (Unlikely) on your 1–5 scale.
  *   **Step 3 (Ranking):** Clear score.
  *   **Step 5 (Widening):** Stable.
  *   **Output for Board:**
      *   **Score:** 2
      *   **Confidence:** High
      *   **Audit Note:** "Based on 2023 sector insolvency rates adjusted for contractor's 10-year history with us."
  *   **Verdict:** This is a standard risk. The Board can use this number to decide whether to buy insurance or demand a bond.

  #### (b) Fine under new building-safety regime (not yet enforcing)
  *   **Data:** None. The regulators haven't issued their first fine yet. You don't know the tariff, and you don't know how strict they will be.
  *   **Step 1 (Data Test):** Fail. No base rate.
  *   **Step 2 (Width):** Impact is definitely High (5). Likelihood? Could be 1 (they go easy) or 4 (they make an example of you). Range is 1 to 4.
  *   **Step 2 (Width Limit):** This spans three points. This is **too wide**.
  *   **Step 3 (Ranking):** You cannot rank this against the Contractor risk (Score 2). A 1–4 range overlaps with almost everything.
  *   **Output for Board:**
      *   **Score:** **Unassessable** (Do not put a number on the heatmap).
      *   **Confidence:** None.
      *   **Audit Note:** "New regulatory regime with no enforcement history. Probability cannot be estimated."
      *   **Recommendation:** "Treat as a Compliance Imperative. Spend money to ensure safety regardless of the probability of a fine."
  *   **Verdict (The Answer the Board Will Hate):** You are telling them they cannot use cost-benefit analysis here. They want to know if the risk is a "3 or a 4" so they can decide if mitigation is worth the cost. You are telling them: *"We do not know the odds, so we must assume the worst and pay up."* This removes their ability to trade this risk off against others. It is honest, but it frustrates their desire to prioritise.

  #### (c) Reputational damage from a social media storm
  *   **Data:** You have past incidents, but the probability changes based on *your* response. If you reply quickly, likelihood of escalation drops. If you ignore it, it rises.
  *   **Step 1 (Data Test):** Mixed. Internal history exists, but dynamics are complex.
  *   **Step 2 (Width):** Base likelihood is 3. But if we mess up comms, it becomes 5. If we handle it well, it becomes 2. Range: 2 to 5.
  *   **Step 5 (Widening):** Last quarter, you thought it was 3–4. Now, a new platform (e.g., TikTok) has emerged that you don't monitor. You widen the range to 2–5.
  *   **Output for Board:**
      *   **Score:** 2–5 (Report as **4** for the heatmap, but flag heavily).
      *   **Confidence:** Low.
      *   **Status:** **Emerging Uncertainty** (Range widened).
      *   **Audit Note:** "Probability is endogenous (depends on our response). Range widened due to new unmonitored channels."
      *   **Recommendation:** "Spend is not for mitigation, but for monitoring capability. We cannot lower the risk score until we reduce the uncertainty."
  *   **Verdict:** This justifies budget for *you* (comms/monitoring) rather than for physical repairs. It highlights that the risk score is a reflection of your own capability, not just external luck.

  ---

  ### How to Present This to the Board (The Script)

  When you present the quarterly paper, use this framing. It protects you and educates them.

  > "Board members, attached is the risk register with the scores you requested. However, to ensure this is defensible to auditors and useful for decision-making, I have added a 'Confidence' column.
  >
  > Where you see a specific number, we have data to support it. Where you see 'Unassessable' or 'Low Confidence', we do not have enough data to rank this against other risks.
  >
  > Specifically, regarding [Risk B - Building Safety]: I cannot give you a 3 or a 4. The law is new. If I give you a number, I am guessing. If we treat this as a guess, we might underfund it. My advice is to fund the safety measures regardless of the probability, because the penalty for being wrong is existential.
  >
  > Regarding the total risk profile: Please note that several high risks share the same economic root cause. Reducing our exposure to the economy reduces all of them simultaneously."

  ### The Audit Trail (For the FD and External Auditor)

  To make this defensible a year later, keep a simple "Risk Logic Log" (a separate tab or document). It needs only three columns:

  1.  **Risk ID:** (e.g., R-04)
  2.  **Evidence Base:** (e.g., "Sector insolvency data," "None," "Internal comms logs")
  3.  **Judgement Call:** (e.g., "Collapsed range 3–4 to 4 due to budget cycle," "Refused to collapse range 2–5")

  If an auditor asks, "Why did you change this score from 3 to 4?", you don't say "I felt like it." You say, "We moved from a Range to a Point Estimate because new data arrived," or "We widened the range because the environment became volatile."

  ### Summary of Rules for You

  1.  **Never invent data.** If you don't know, say "Unassessable."
  2.  **Never sum risks.** Count them by theme.
  3.  **Widening is good.** It shows you are paying attention to volatility.
  4.  **The Board's "3 or 4" question:** Answer it with "It is a 4, but our confidence is Low, which means it should be treated as a 5 for budgeting purposes."

  This approach gives them the spreadsheet they demand, but the footnotes protect you from the consequences of pretending to know the unknown.
