      Because this choice is unavoidable yet invisible, we must refuse any triumphal narrative about prediction as mastery. We cannot claim to know the future simply because we have calculated a probability. A number is not a prophecy; it is a reflection of how we grouped the past. When we present a forecast as a settled fact rather than a specific comparison, we hide the values embedded in our methodology. We risk telling policymakers that there is only one way to prepare, when in reality, there are only different ways of comparing.

      Therefore, the task of this workshop is not to refine our tools for greater precision in isolation. Our goal is to make those hidden reference-class selections explicit and accountable. We need to create a language where a city planner can ask a modeler why specific past cases were chosen, and where a modeler can explain the ethical weight of that inclusion without resorting to jargon. We must treat the definition of similarity as a public question, not a private technical decision.

      Today, we commit to showing our work not just in the calculation, but in the comparison. We carry into this workshop the ethical responsibility to ensure that every number we produce acknowledges the human choices that created it.

