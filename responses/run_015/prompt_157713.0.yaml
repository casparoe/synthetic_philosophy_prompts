  Welcome to this joint workshop on forecasting in public life, hosted by our statistics department and school of public policy. We gather from distinct traditions: the rigor of statistical modeling and the urgency of public policy implementation. Our room is split evenly between researchers who build predictive engines and practitioners who live with their consequences, including city planners, community advocates, and family members. We must acknowledge immediately that every forecast discussed today—whether concerning climate adaptation funding, epidemic spread, or economic intervention—depends on an unobservable choice. Before a single equation is solved or a policy drafted, we must decide which set of past cases counts as comparable to the future we face. This foundational step determines the trajectory of every number we will generate here.

  This selection is often treated as a technical preprocessing step, a mere matter of data cleaning or variable selection. It is not. It is the structural spine of every prediction we make. Consider a concrete proposal for urban heat mitigation. If we model this policy after wealthy northern cities, our historical data suggests that survival rates correlate with expensive infrastructure upgrades like centralized cooling. This comparison implies an obligation to secure large capital funding and prioritize engineering solutions. However, if we model the same policy after rapidly urbanizing tropical cities, the historical data suggests survival correlates with community-led shading, ventilation design, and behavioral adaptation. This comparison implies an obligation to empower local organizers and prioritize social infrastructure. The raw data regarding temperature and mortality remains constant, but the moral obligation derived from the forecast changes radically depending on the group we choose to resemble. One path demands money; the other demands trust. The mathematics remains identical, but the human outcome diverges completely based on this initial classification.

  Because this choice is unavoidable yet often invisible, we must refuse any triumphal narrative about prediction as mastery. We cannot claim to know the future simply because we have calculated a probability. A number is not a prophecy; it is a reflection of how we grouped the past. When we present a forecast as a settled fact rather than a specific comparison, we hide the values embedded in our methodology. We risk telling policymakers that there is only one way to prepare, when in reality, there are only different ways of comparing. For the advocates in this room, this means recognizing that a model is not an oracle but an argument about similarity. For the researchers, it means accepting that your technical choices are already policy decisions. We are not here to eliminate uncertainty, but to locate where our values enter the calculation. If we ignore this, we allow technical assumptions to dictate public values without debate.

  Therefore, the task of this workshop is not to refine our tools for greater precision in isolation. Our goal is to make those hidden reference-class selections explicit and accountable. We need to create a shared language where a city planner can ask a modeler why specific past cases were chosen, and where a modeler can explain the ethical weight of that inclusion without resorting to jargon. We must treat the definition of similarity as a public question, not a private technical decision. We must build a process where the justification for our comparisons is as scrutinized as the accuracy of our outputs. Transparency in our comparisons builds trust in our conclusions.

  We carry into this workshop the ethical responsibility to ensure that every number we produce acknowledges the human choices that created it.
