  # Session Plan: The Limits of the Dutch Book
  **Time:** 90 Minutes
  **Students:** 14 (Split into 7 pairs)
  **Materials:** 
  *   70 Index cards (10 per pair)
  *   140 Poker chips (20 per pair, two colors)
  *   7 Six-sided dice (1 per pair)
  *   Whiteboard/Projector for global rules.

  ## Core Philosophy
  The goal is to move from "Incoherence implies Sure Loss" to "Incoherence implies Sure Loss *only if*..." 
  *   **Round 1:** Validates the textbook theorem (Sharp prices, unlimited stakes).
  *   **Round 2:** Breaks the theorem (Spreads, discrete stakes, exposure caps).
  *   **Round 3:** Shifts the terrain (Dynamic betting/Conditionalization).
  *   **Debrief:** Maps the experience to the (i)/(ii)/(iii) distinctions and the rationality gap.

  ---

  ## 0:00 – 0:10 | Setup & Roles
  **Grouping:** Split the class into 7 pairs. 
  **Roles:** 
  *   **Maker:** Posts prices.
  *   **Taker:** Chooses which side of the bet to take (or passes).
  *   *Note:* They will swap roles after Round 2.

  **The Asset:** A single Die Roll (resolved at the end of the round).
  **The Propositions:** 
  1.  **$H$ (High):** Roll is 4, 5, 6.
  2.  **$E$ (Even):** Roll is 2, 4, 6.
  3.  **$L$ (Low-Even):** Roll is 2.
  *(Note: $H$ and $L$ are mutually exclusive. $E$ overlaps both.)*

  **Currency:** Chips. 
  **Settlement:** All debts settled in chips after the die is rolled. 
  **Rounding Rule:** The "Bank" (Instructor) only settles integer chips. Fractions < 0.5 round down to 0; ≥ 0.5 round up to 1.

  ---

  ## 0:10 – 0:30 | Round 1: The Classic Book (Distinction i)
  **Goal:** Reproduce the standard Dutch Book. Students should feel the inevitability of the loss.

  **Rules:**
  1.  **Sharp Prices:** Maker must post a single price $p \in [0, 1]$ for each proposition ($H, E, L$). This price is both the Buy and Sell price.
  2.  **Unlimited Stakes:** Taker can choose any stake $S$ (in whole chips).
  3.  **No Cap:** No limit on total exposure.
  4.  **Task:** Maker tries to set coherent prices. Taker tries to construct a Dutch Book (guaranteed profit).

  **The Trap:** 
  Most students will set $P(H) = 0.5$, $P(E) = 0.5$, $P(L) = 0.2$. 
  *   Check: $P(H \cup L) = 0.7$. But $P(H) + P(L) = 0.7$. This is coherent.
  *   *Instructor Intervention:* If pairs are too coherent, whisper to the Maker: "Try to be slightly optimistic about High and Low-Even. Set $P(H)=0.5, P(L)=0.3$."
  *   Now $P(H) + P(L) = 0.8$. But they are mutually exclusive (max prob 0.5 for H, 0.2 for L? No, H is 4,5,6. L is 2. They are disjoint). 
  *   Wait, $H=\{4,5,6\}$, $L=\{2\}$. Disjoint. Union is $\{2,4,5,6\}$ (4 faces). True Prob = 4/6 = 0.66.
  *   If Maker sets $P(H)=0.5, P(L)=0.3$. Sum = 0.8. 
  *   Taker Strategy: **Sell** both. 
      *   Taker sells $H$ (Maker pays Taker 0.5 if H).
      *   Taker sells $L$ (Maker pays Taker 0.3 if L).
      *   Taker collects 0.8 upfront.
      *   Max payout is 1.0 (if H or L hits). 
      *   Wait, Taker is the Bookie here. 
      *   *Correction for Clarity:* 
          *   **Maker** posts price $p$. 
          *   **Taker** chooses: **Buy** (Pay $p$, Get 1 if True) OR **Sell** (Receive $p$, Pay 1 if True).
          *   If Maker sets $P(H)=0.5, P(L)=0.3$. Sum = 0.8. 
          *   True Max Probability = 4/6 = 0.66.
          *   This isn't a Dutch Book yet. 
          *   *Better Trap:* $A, \neg A$. 
          *   Let's simplify Round 1 Propositions to **$A$** and **$\neg A$** (e.g., High vs. Not High).
          *   Maker sets $P(H) = 0.6$, $P(\text{Not } H) = 0.6$. Sum = 1.2.
          *   Taker **Sells** both. Collects 1.2. Pays out 1.0 regardless of outcome. Profit 0.2.
          *   Taker scales stake to 10 chips. Collects 12. Pays 10. Profit 2.

  **Outcome:** Taker writes the book on the index card. Maker sees the loss *before* the roll. 
  **Debrief Point (2 mins):** "You lost on every branch. You knew it before the die moved. This is Distinction (i)."

  ---

  ## 0:30 – 0:50 | Round 2: The Spanner (Constraints)
  **Goal:** Break the Dutch Book argument using market frictions. Maker should survive despite incoherence.

  **Rules Change:**
  1.  **Spreads:** Maker posts a **Bid** (price they buy at) and **Ask** (price they sell at). 
      *   *Example:* Bid 0.40 / Ask 0.60.
      *   Taker can **Sell to Maker** at 0.40 or **Buy from Maker** at 0.60.
  2.  **Discrete Stakes:** Minimum stake is **1 Chip**. No fractions.
  3.  **Exposure Cap:** Maker's total liability cannot exceed **5 Chips**. (If a book requires the Maker to risk 6 chips to be exploited, the Taker cannot force it).
  4.  **Settlement:** Integer rounding applies (0.4 profit rounds to 0).

  **The Task:** 
  *   **Maker:** Post incoherent prices. Try to hide in the spread. 
      *   *Suggestion:* Set $P(H) = 0.55$ (Ask), $P(\text{Not } H) = 0.55$ (Ask). 
      *   Sum = 1.10. Incoherent by 0.10.
  *   **Taker:** Try to Dutch Book.
      *   Taker Sells $H$ (Maker Buys at Bid? No, Maker posts Bid/Ask).
      *   Maker Posts: Buy @ 0.45, Sell @ 0.55. (Spread 0.10).
      *   Maker Posts: Buy @ 0.45, Sell @ 0.55 on Not-H.
      *   Taker wants to Sell both to Maker. 
      *   Taker Sells $H$ to Maker (Maker Buys @ 0.45).
      *   Taker Sells $\text{Not } H$ to Maker (Maker Buys @ 0.45).
      *   Maker pays 0.90 total. Payout is 1.00. Maker Profit 0.10.
      *   *Wait, Taker wants to win.* Taker needs to **Buy** both from Maker.
      *   Taker Buys $H$ @ 0.55. Buys $\text{Not } H$ @ 0.55. Cost 1.10. Payout 1.00. Taker Loss.
      *   *Incoherence:* Maker needs to set Bids too high or Asks too low.
      *   *Setup for Failure:* Maker sets Buy @ 0.50, Sell @ 0.50 (Sharp) but Sum = 1.05. 
      *   *Constraint:* Maker sets Buy @ 0.52, Sell @ 0.58. 
      *   Incoherence: Sum of Mids = 1.10. 
      *   Taker tries to Sell both (at 0.52). Collects 1.04. Pays 1.00. Profit 0.04.
      *   **The Spanner:** 
          *   Stake Min = 1 Chip. 
          *   Profit per chip = 0.04. 
          *   To make 1 Chip profit (settlement floor), Taker needs Stake = 25 Chips ($25 \times 0.04 = 1.00$).
          *   **Exposure Cap:** Maker's Max Liability = 5 Chips. 
          *   Taker cannot place a 25-chip bet. Max bet is 5.
          *   Max Profit = $5 \times 0.04 = 0.20$ Chips.
          *   **Settlement Rule:** 0.20 rounds to 0.
          *   **Result:** Mathematically incoherent, but practically unexploitable.

  **Outcome:** Taker stares at the card. They *can* book a loss, but the Bank won't pay it out. 
  **Debrief Point (2 mins):** "The algebra says you lose. The rules say you break even. The Dutch Book argument assumes infinite divisibility and no credit limits."

  ---

  ## 0:50 – 1:05 | Round 3: The Dynamic Trap (Distinction ii)
  **Goal:** Show that static coherence isn't enough; you need a policy for updating (Dutch Strategy).

  **Rules Change:**
  1.  **Two Stages:** 
      *   **Stage 1:** Bet on $H$ (High). Die is rolled. 
      *   **Stage 2:** *If* $H$ is True, Bet on $E$ (Even). 
  2.  **Commitment:** Maker must post Stage 2 prices *now* (conditional prices), not after Stage 1 resolves.
  3.  **Sharp Prices:** Back to Round 1 rules (No spreads, no caps) to ensure the book works.

  **The Trap:**
  *   Maker sets $P(H) = 0.5$.
  *   Maker sets $P(E | H) = 0.5$. (Note: Given High {4,5,6}, Even is {4,6}. True Prob = 2/3).
  *   Maker sets $P(H \land E) = 0.2$. (True Prob = 2/6 = 0.33).
  *   Check Coherence: $P(H) \times P(E|H) = 0.5 \times 0.5 = 0.25$. 
  *   But Posted $P(H \land E) = 0.2$.
  *   **The Strategy:** 
      *   Taker **Buys** $H \land E$ @ 0.20.
      *   Taker **Sells** $H$ @ 0.50.
      *   Taker **Sells** conditional bet: "If $H$, Sell $E$ @ 0.50".
      *   *Wait, keep it simple.* 
      *   Taker forces Maker to bet inconsistently on the conjunction vs the conditional.
      *   If Maker treats the conditional bet as optional *after* $H$ is known, Taker is exposed. 
      *   **Crucial Rule:** Maker must write the Stage 2 price on the card *now*. If they try to change it after the die rolls, they forfeit.

  **Outcome:** 
  *   If Maker commits: Taker books a sure loss (Dutch Strategy).
  *   If Maker *doesn't* commit (says "I'll set prices later"): Taker cannot book the loss *now*. 
  *   **Discovery:** The loss is sure *only if* you bind your future self. If you have the freedom to update arbitrarily, the static book doesn't close.

  ---

  ## 1:05 – 1:30 | Debrief & Discussion
  **Do not move chairs.** Keep the chips on the table. Use the board.

  **1. Map the Distinctions (10 mins)**
  *   **Round 1 (i):** "Lose for sure on every outcome." You saw the loss on the card before the roll. The algebra matched the reality.
  *   **Round 2 (The Spanner):** "Incoherent but safe." Why didn't you lose? 
      *   *Elicit:* Spreads created a buffer. Caps prevented scaling. Rounding erased the profit.
      *   *Takeaway:* Dutch Book theorems assume **Point Prices**, **Infinite Divisibility**, and **Unlimited Credit**. Remove those, and incoherence is just a theoretical vulnerability, not a practical death sentence.
  *   **Round 3 (ii):** "Lose on every branch of the tree." 
      *   Did anyone try to change their Stage 2 price after the first roll? 
      *   *Takeaway:* A Dutch *Strategy* requires a constraint on **Dynamic Consistency**. If you can re-price conditional on new info, the static incoherence doesn't kill you immediately.

  **2. The Missing Piece: Distinction (iii) (5 mins)**
  *   **Prompt:** "We talked about 'Lose with Probability 1 but not Certainty' (Czech Book). Did anyone feel that?"
  *   **Reality Check:** No. You can't feel it in 15 minutes with a 6-sided die.
  *   **Why?** That argument requires infinite sequences (e.g., "I lose on every finite path, but the game never ends"). 
  *   **Lesson:** The math of Prob 1 $\neq$ Certainty is a limit concept. It applies to infinite agents. You are finite. The Dutch Book argument is a finite analogy for an infinite ideal.

  **3. The Rationality Gap (10 mins)**
  *   **The Big Question:** "In Round 2, the Makers were incoherent. But they didn't lose. Were they irrational?"
  *   **Discussion Points:**
      *   If irrationality = "Sure Loss," then Round 2 Makers were rational.
      *   If irrationality = "Violating Probability Axioms," they were irrational.
      *   **The Punchline:** The Dutch Book argument doesn't prove you *must* have probabilistic beliefs. It proves you *must* have probabilistic beliefs **IF** you want to be immune to exploitation **AND** you operate in a frictionless market with infinite credit.
      *   In the real world (spreads, caps), you can be slightly incoherent and survive. The "Normative Force" of probability theory is weaker than the theorem suggests.

  ---

  ## Instructor Notes: What Will Go Wrong (and Fixes)

  **1. Confusion on Buy/Sell in Round 2**
  *   *Risk:* Students get tangled in who pays whom when Bid/Ask is introduced.
  *   *Fix:* Write this on the board permanently:
      *   **Maker Posts:** "I Buy @ $b$ | I Sell @ $a$"
      *   **Taker Action:** "I Sell to you @ $b$" OR "I Buy from you @ $a$"
  *   *Check:* Walk around in the first 3 minutes of Round 2 to verify one pair is doing it right.

  **2. Round 2 Fails (Taker finds a loophole)**
  *   *Risk:* Taker finds a combination of bets that clears the 1-chip floor despite the cap.
  *   *Fix:* If you see a pair getting close, intervene as the "Bank." Remind them: "Total exposure across all propositions is capped at 5 chips." If the Dutch Book requires 6 chips of liability to generate 1 chip profit, it is invalid.
  *   *Pre-emptive:* Tell them explicitly: "To make 1 chip profit with a 0.05 edge, you need 20 chips of stake. Your cap is 5. Do the math."

  **3. Round 3 Drags On**
  *   *Risk:* Conditional betting is cognitively heavy.
  *   *Fix:* Provide a pre-printed slip for Round 3 with the structure: "Price for $H$: ___" and "Price for $E$ *given* $H$: ___". Don't let them invent the notation.

  **4. The "Rationality" Discussion Stalls**
  *   *Risk:* Students say "Well, losing money is stupid, so don't do it."
  *   *Fix:* Push back. "In Round 2, you *couldn't* lose money. So was it stupid to be incoherent? If I offer you a choice between a coherent book with 1% fees and an incoherent book with 0% fees, which do you take?" (Answer: Incoherent). This drives home that coherence has a cost.

  ## What The Game Can't Reproduce
  Be frank about this in the final 5 minutes.
  1.  **Infinite Sequences:** You cannot simulate "Probability 1 but not Certainty" (Czech Book) with 7 dice rolls. That remains a mathematical abstraction for this session.
  2.  **Belief vs. Behavior:** The game tests *prices*, not *beliefs*. A student might believe $P(H)=0.5$ but post 0.6 to win the game. The Dutch Book argument assumes Price = Belief. The game breaks that link.
  3.  **The "Why":** The game shows *that* constraints matter, but not *why* philosophers care. The philosophical claim is about **consistency of judgment**, not just wallet protection. Make sure they leave knowing the difference between "I lost chips" and "I contradicted myself."
