  Your stacking hypothesis is correct in structure but underestimates the causal power of the bedrock layer. Your friend is right that the teleological divergence (what translations are *for*) drives the disagreement, but wrong to dismiss the lower layers as mere rationalization. You cannot argue teleology directly; you must argue it through ontology and empirics, which is why you find yourselves fighting over syllable counts and identity conditions. The empirical layer acts as a proxy war: if form is load-bearing, your functionalism aligns with her formalism, but if form is conventional, her position requires a teleological justification she refuses to articulate. The Preservation Profile solves the bookkeeping failure by making the trade-offs visible, but it cannot resolve the value judgment of which features matter. Progress requires abandoning the universal claim that one type of fidelity is superior, replacing it with a functional classification of translations based on intended readership.

