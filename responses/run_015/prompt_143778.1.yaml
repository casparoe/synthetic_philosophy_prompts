answer: |-
  This is a practical translation of Fricker's concepts for high-volume mediation work. It is designed to be a "brake system" for your reporting, not a verdict generator. It forces a pause before you cement a narrative in an official document.

  ### The 15-Minute Pre-Submission Protocol

  **Time Budget:** 15 Minutes max.
  **Goal:** Interrogate your own credibility assignments before filing the report.
  **Instruction:** Answer **Yes/No**. If you hit a **YES** on any "Alert" question, you must write 2-3 sentences in your private notes justifying your decision before submitting the official form.

  #### Phase 1: The Credibility Audit (Testimonial)
  *Focus: Did identity prejudice lower the credibility score of one party?*

  1.  **The Interruption Check:** Did one party speak significantly less than the other during the session?
      *   [ ] No → Go to Q2.
      *   [ ] Yes → **JUDGMENT GATE:** Was this due to assertiveness differences or did I (or the other party) cut them off?
  2.  **The Evidence Burden:** Did I ask one party to "prove" or "give examples" for a claim while accepting the other party's word on similar claims?
      *   [ ] No → Go to Q3.
      *   [ ] Yes → **ALERT:** Potential Testimonial Injustice. *Why did Party A need evidence and Party B did not?*
  3.  **The Tone Trap:** Did I describe one party as "emotional," "aggressive," or "irrational" in my notes, while describing the other as "firm" or "upset"?
      *   [ ] No → Go to Phase 2.
      *   [ ] Yes → **ALERT:** Identity prejudice often hides in tone adjectives. *Swap the identities in your head. Would the adjective change?*

  #### Phase 2: The Vocabulary Audit (Hermeneutical)
  *Focus: Did a lack of shared concepts prevent the harm from being recognized?*

  4.  **The Naming Struggle:** Did a party struggle to name what was happening to them (e.g., "It feels like... I don't know...")?
      *   [ ] No → Go to Q5.
      *   [ ] Yes → **JUDGMENT GATE:** Did I fill in the blank for them, or did I record their uncertainty as confusion?
  5.  **The Category Fit:** Did I categorize their complaint under an existing dorm rule (e.g., "Noise") when they were describing something that didn't fit (e.g., "Vibe," "Exclusion")?
      *   [ ] No → Go to Q6.
      *   [ ] Yes → **ALERT:** Preemptive Hermeneutical Exclusion. *You forced their experience into a box you understand, potentially erasing the actual harm.*
  6.  **The "Sensitivity" Dismissal:** Did I or the other party use the word "sensitive" to explain why they were hurt?
      *   [ ] No → Proceed to File.
      *   [ ] Yes → **ALERT:** This often signals a gap in shared understanding of harm. *Is "sensitive" a character flaw or a signal of a concept you don't have?*

  ***

  ### Worked Cases

  Here is how the protocol runs in real scenarios.

  #### Case 1: Clear Gender-Based Credibility Dismissal
  **Scenario:** Male and Female roommates. Male claims Female is "unstable." Female claims Male is "controlling."
  **Protocol Run:**
  *   **Q2 (Evidence Burden):** **YES.** You asked the Female for texts/dates of controlling behavior. You accepted the Male's claim of "instability" based on "just a feeling."
  *   **Q3 (Tone Trap):** **YES.** You noted the Female was "hysterical" but the Male was "frustrated."
  *   **Action:** The checklist forces you to rewrite the report. You must either demand equal evidence for the Male's claim or remove the "instability" assertion from the official record as unverified. The "hysterical/frustrated" adjective swap must be corrected to neutral behavioral descriptions (e.g., "raised voice").
  *   **Outcome:** Report filed with balanced evidentiary standards.

  #### Case 2: The False Positive (Personality Clash)
  **Scenario:** Roommate A is a known chronic complainer (filed 5 reports this semester). Roommate B is quiet, new, and popular. A claims B is excluding them. B says A is obsessive.
  **Protocol Run:**
  *   **Q1 (Interruption Check):** **YES.** A spoke 80% of the time; B spoke very little.
  *   **Q3 (Tone Trap):** **YES.** You labeled A "fixated" and B "withdrawn."
  *   **Alert Triggered:** The checklist flags potential injustice against A (the chronic complainer). It suggests you might be discounting A because of their history (identity as "complainer").
  *   **Your Judgment:** You personally believe A is actually harassing B, and B's silence is trauma, not credibility.
  *   **Resolution:** The checklist did its job: it stopped you from dismissing A *automatically*. Because the alert fired, you must write a justification note: *"Flag triggered on credibility deficit. Override justified: Corroborating evidence from RA logs supports B's account of harassment. A's volume of speech was due to defensiveness, not credibility."*
  *   **Why this matters:** Without the checklist, you might have dismissed A purely on reputation. The checklist forces you to distinguish between *reputation* and *evidence*, even if you still side with B.

  #### Case 3: Hermeneutical Harm (Not Testimonial)
  **Scenario:** Neurodivergent student (A) vs. Neurotypical student (B). A says, "The way you look at me when I stim makes the room feel unsafe." B says, "I'm just looking at you. I'm not doing anything."
  **Protocol Run:**
  *   **Q2 (Evidence Burden):** **NO.** You didn't ask for proof of the look. You believed A felt unsafe.
  *   **Q5 (Category Fit):** **YES.** You tried to file this under "Harassment/Threat." It doesn't fit. There was no threat.
  *   **Q6 (Sensitivity Dismissal):** **YES.** You noted B is "confused by A's sensitivity."
  *   **Alert Triggered:** Preemptive Hermeneutical Exclusion.
  *   **Analysis:** You believed A (no testimonial injustice), but you lack the concept to process the harm. You framed it as "A is sensitive" rather than "B's gaze is exclusionary." The harm is that the *concept* of "sensory safety" isn't in your dorm's conflict vocabulary.
  *   **Resolution:** You cannot file this as a standard rule violation. You must note in the "Context" section: *"Conflict arises from differing norms regarding physical presence and attention. Standard noise/conduct rules do not apply."* This flags the systemic gap for your supervisor without falsely punishing B for "harassment."

  ***

  ### Limitations & Misfire Analysis

  Be honest about where this tool fails. If you rely on it blindly, it creates new problems.

  **1. The "Box-Ticking" Risk**
  *   **Misfire:** You answer "No" to everything quickly just to finish the report.
  *   **Harm Missed:** This turns the ethical check into a bureaucratic hurdle. If you aren't actually pausing to feel the resistance in the questions, the checklist is useless.
  *   **Mitigation:** If you finish the checklist in under 5 minutes, you did it wrong.

  **2. The Hermeneutical Paradox**
  *   **Misfire:** Question 5 asks if you forced a category fit. But if you suffer from *preemptive hermeneutical exclusion*, you by definition don't know a better category exists.
  *   **Harm Missed:** You will answer "No" to Q5 because you genuinely think "Noise" is the right category for a complaint about "Atmosphere."
  *   **Reality:** This checklist cannot catch harms you literally cannot conceive of. It only catches harms you *suspect* you might be missing.

  **3. The Power Blindspot**
  *   **Misfire:** The checklist focuses on your bias and the students' interaction. It does not account for *your* power over the students.
  *   **Harm Missed:** A student might agree to your mediation summary because you hold authority over their housing, not because it's accurate. The checklist treats them as epistemic equals in the room, which they are not.
  *   **Reality:** You are the gatekeeper of the report. Their "credibility" is partly determined by your willingness to type it. The checklist cannot fully neutralize your institutional power.

  **4. The False Positive Fatigue**
  *   **Misfire:** As seen in Case 2, the checklist will frequently flag "Injustice" in messy human conflicts where someone is actually just being difficult.
  *   **Harm Missed:** If you override the checklist too often ("It's just a personality clash"), you will train yourself to ignore the alerts.
  *   **Reality:** You must treat the Alert not as a verdict of "Injustice Occurred," but as a command to "Document Your Reasoning." If you override the alert, the justification note is mandatory.

  **Summary for Job Use:**
  Use this to protect your reports from becoming permanent records of bias. It won't solve the conflict, but it stops you from codifying the injustice in the official file.
