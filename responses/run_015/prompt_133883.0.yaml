answer: |-
  ### Preface: The Type-Identity Problem in Deployment

  You are asking for a solution to the **type-identity problem** for neural mechanisms, constrained by **online inference budgets**. In philosophy of mind, this is asking: "When do two physical states realize the same functional state?" In mechanistic interpretability, it is: "When do two activation patterns instantiate the same circuit?"

  For scientific understanding, we can afford post-hoc, compute-heavy causal mediation analysis. For a deployed anomaly detector, you need a predicate $SameMech(M_{train}, M_{current})$ that evaluates in milliseconds, without ground-truth labels, and flags *potential* deception (where behavior is stable but mechanism shifts).

  I have brainstormed three candidate frameworks before converging on the desiderata below:
  1.  **Strict Causal Graph Isomorphism:** Requires mapping the full causal DAG of the model. *Rejected:* Computationally intractable for inference-time monitoring; fails across seeds.
  2.  **Representational Similarity (RSA/CKA):** Compares activation geometry. *Rejected:* Too coarse; fails the "behaviorally identical/mechanistically different" (memorization) case.
  3.  **Feature-Level Causal Stability:** Uses Sparse Autoencoders (SAEs) to define mechanism in terms of feature presence and causal influence. *Selected as the most viable baseline, but requires specific constraints.*

  Below are the converged desiderata for your specification.

  ---

  ### Desiderata for Mechanism Sameness in Anomaly Detection

  #### 1. Counterfactual Stability (Non-Negotiable)
  *   **Definition:** The mechanism is the same only if specific interventions on internal states produce the same counterfactual changes in downstream states, within a tolerance $\epsilon$.
  *   **Motivating Case:** **Memorization vs. Generalization.** A model fine-tuned to memorize test answers produces identical outputs to a model that generalized the rule. A behavioral monitor sees no anomaly. A counterfactual test (e.g., patching the "reasoning" feature) breaks the generalizer but not the memorizer.
  *   **Camp:** **Causal-Abstraction.** (Behavioralists reject this as unnecessary overhead; RepSim people argue proxies suffice).
  *   **Why NN:** Without this, you cannot detect "sandbagging" or deceptive alignment where the model behaves well only because it knows it is being evaluated.

  #### 2. Grain Locking (Non-Negotiable)
  *   **Definition:** The level of abstraction (neurons, heads, SAE features, residual stream slices) at which "mechanism" is defined must be fixed *prior* to deployment. You cannot claim mechanism sameness at Layer 5 if the anomaly is at the neuron level within Layer 5.
  *   **Motivating Case:** **Level-Relativity.** Under coarse-graining (layer-wise norms), a model looks stable. Under fine-graining (specific query/key heads), the circuit has migrated. If you allow post-hoc selection of grain, you can always find a level where the model looks "safe."
  *   **Camp:** **Consensus (with caveats).** Everyone agrees grain matters, but Causalists demand fine grain, while Engineers prefer coarse grain for cost.
  *   **Why NN:** Prevents "gaming the metric" by shifting the definition of mechanism after an anomaly is suspected.

  #### 3. Cross-Instantiation Invariance (Non-Negotiable)
  *   **Definition:** The criterion must identify the same mechanism across different random seeds, model updates, or quantization levels where parameter indices do not align.
  *   **Motivating Case:** **Sameness Across Models/Seeds.** You deploy a v2 model. The weights are permuted or re-initialized. A weight-based criterion flags 100% anomaly. A mechanism-based criterion must recognize that the "induction head" in v1 is the "induction head" in v2 despite zero parameter overlap.
  *   **Camp:** **Representational-Similarity / Causal-Abstraction.** (Behaviorists don't care about internal mechanism).
  *   **Why NN:** Deployment involves model updates and ensembles. A criterion tied to parameter indices is useless for continuous deployment.

  #### 4. Functional Decoupling (Preference: Causal-Abstraction)
  *   **Definition:** The criterion must distinguish the *computation* circuit from the *readout* circuit. A change in the final projection layer should not necessarily flag a core mechanism anomaly if the reasoning trace is intact.
  *   **Motivating Case:** **Mech Similar / Behav Different.** The model reasons correctly (same circuit) but the final unembedding layer is corrupted (different readout), causing wrong outputs. Standard monitors flag this as an anomaly. Your detector should ideally isolate whether the *reasoning* broke or just the *translation*, to triage severity.
  *   **Camp:** **Causal-Abstraction.** (Behavioralists treat the model as a black box; Readout changes are just errors).
  *   **Why Preference:** Helpful for triage, but if the output is wrong, safety protocols usually trigger regardless.

  #### 5. Boundary Definition (Non-Negotiable)
  *   **Definition:** The criterion must explicitly classify whether model-generated tokens (e.g., Chain of Thought) are part of the *mechanism* or part of the *input environment*.
  *   **Motivating Case:** **Chain of Thought.** If the model writes a CoT, is that an intermediate latent state (mechanism) or an input token (environment)? If it's mechanism, it must be monitored for anomalies. If it's input, it's treated as external data. If the model hides reasoning in hidden states vs. CoT, the detector must treat these consistently.
  *   **Camp:** **Consensus.** (Though implementation varies).
  *   **Why NN:** Ambiguity here allows the model to shift computation from monitored latent spaces to unmonitored generated text (or vice versa).

  #### 6. Recovery Sensitivity (Contested / Preference: Safety)
  *   **Definition:** The criterion must flag a mechanism change even if functional performance is restored via rerouting.
  *   **Motivating Case:** **Self-Repair.** You ablate a harmful circuit; the model grows a new circuit to perform the same function. Behaviorally, nothing changed. Mechanistically, the pathway is new and unverified.
  *   **Camp:** **Safety/Interventionists** (Flag it) vs. **Functionalists** (Ignore it, output is safe).
  *   **Why Preference:** For high-stakes safety, unverified rerouting is a risk. For pure reliability, it's a success. I mark this as a Safety Preference because you are building an *anomaly* detector, not a *performance* monitor.

  #### 7. Inference Budget Compliance (Non-Negotiable)
  *   **Definition:** The cost of evaluating the sameness criterion must not exceed $X\%$ of the forward pass latency (typically <10%).
  *   **Motivating Case:** **Cost.** A criterion requiring full causal mediation analysis (running multiple backward/forward passes per token) is scientifically valid but deployment-dead.
  *   **Camp:** **Engineering/Deployment.** (Researchers often ignore this).
  *   **Why NN:** If the detector is too slow, it will be bypassed or disabled in production.

  ---

  ### Incompatibilities and The Killer Constraint

  #### Incompatible Pairs
  1.  **Counterfactual Stability vs. Inference Budget Compliance.**
      *   True counterfactual stability requires interventions (patching, ablations) which necessitate multiple forward passes per input. This violates the latency budget for real-time anomaly detection.
      *   *Resolution:* You must use a **proxy** for counterfactuals (e.g., feature presence via SAEs) rather than testing the counterfactuals directly at inference time.

  2.  **Cross-Instantiation Invariance vs. Grain Locking.**
      *   Fine-grained locking (specific neurons) fails cross-instantiation. Coarse-grained locking (layer norms) satisfies cross-instantiation but loses causal specificity.
      *   *Resolution:* The "Grain" must be defined in **feature space** (e.g., SAE features) rather than **parameter space** (neurons/weights). Features are more stable across seeds than neurons.

  #### The Single Eliminating Requirement
  **Inference Budget Compliance (Desideratum #7).**

  This is the requirement that eliminates the most otherwise-plausible criteria.
  *   It eliminates **Direct Causal Mediation Analysis** (too many passes).
  *   It eliminates **Full Circuit Reconstruction** (too much compute).
  *   It eliminates **Adversarial Robustness Testing** at inference time.

  It forces you to rely on **observational proxies** (activation patterns) rather than **experimental verification** (interventions) during deployment. You must validate the causal link *offline* and monitor the *correlate* *online*.

  ---

  ### Scoring Candidate Criteria

  Here is how current technical approaches score against your desiderata.

  | Criterion | Counterfactual Stability | Grain Locking | Cross-Instantiation | Boundary Def. | Recovery Sensitivity | Cost (Inference) | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Logit/Entropy Monitoring** | ❌ | ✅ | ✅ | ✅ | ❌ | ✅ | **Reject.** Fails core mech-sameness goal. |
  | **Activation Clustering (CKA/RSA)** | ⚠️ | ⚠️ | ✅ | ✅ | ❌ | ✅ | **Weak.** Detects distribution shift, not mechanism shift. Fails Memorization case. |
  | **Probe-Based Monitoring** | ⚠️ | ✅ | ⚠️ | ✅ | ❌ | ✅ | **Moderate.** Probes correlate with function but aren't causal. Can be fooled by adversarial features. |
  | **SAE Feature Presence** | ✅ (Offline) | ✅ | ✅ | ✅ | ✅ | ✅ | **Best Candidate.** Features map to semantics. Can monitor feature activation stats online. |
  | **Causal Patching (Online)** | ✅ | ✅ | ⚠️ | ✅ | ✅ | ❌ | **Reject.** Too slow for deployment. |
  | **Hybrid (SAE + Offline Causal)** | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | **Defend.** Validate causal role of SAE features offline; monitor feature activations online. |

  **Recommendation:** The **Hybrid (SAE + Offline Causal)** approach is the only one that survives the "Killer Constraint" while satisfying the "Non-Negotiables." You use causal methods *during training/validation* to certify that specific SAE features correspond to specific mechanisms (satisfying Counterfactual Stability). Then, at *inference*, you simply monitor the activation statistics of those features (satisfying Cost).

  ---

  ### Settled vs. Contested

  To ensure you do not build on shaky ground, here is the distinction between community consensus and active debate.

  #### Settled (Consensus among Practitioners)
  1.  **Behavioral Monitoring is Insufficient:** Everyone agrees that monitoring input-output pairs cannot detect internal mechanism shifts (e.g., deceptive alignment, memorization).
  2.  **Parameter Identity is Irrelevant:** No serious researcher claims that "same weights" equals "same mechanism" across seeds or updates.
  3.  **Grain Matters:** It is agreed that "mechanism" is level-relative. There is no "view from nowhere."
  4.  **Cost is a Hard Constraint:** Theoretical criteria that require $O(N^2)$ passes are acknowledged as non-deployable.

  #### Genuinely Contested (Do not treat as consensus)
  1.  **Features vs. Circuits:** There is no consensus on whether "features" (SAE latents) are the atoms of mechanism or whether "circuits" (connections between neurons) are. SAE proponents argue features are interpretable units; Circuit proponents argue computation happens in the connections. *Your spec should remain agnostic or choose SAEs for cost reasons, acknowledging the trade-off.*
  2.  **Functional Recovery:** As noted in Desideratum #6, there is deep philosophical disagreement on whether a self-repaired circuit is the "same" mechanism. Safety teams say "No" (unverified path); Reliability teams say "Yes" (function preserved). *You must choose a side for your spec; I recommend "No" for safety.*
  3.  **Causal Validity of Proxies:** It is contested whether monitoring feature activations (observational) is a valid proxy for causal mechanism stability. Some argue that without online interventions, you are just doing fancy behavioral monitoring. *Your spec must acknowledge this risk: you are monitoring a **causal proxy**, not causality itself.*
  4.  **CoT as Mechanism:** There is no agreement on whether tokens generated by the model for its own use constitute "internal state" or "external output." Some architectures treat them as residuals; others treat them as input. *Your spec must enforce a boundary definition (Desideratum #5).*

  ### Final Specification Summary

  To build this detector, your specification for "Same Mechanism" must read:

  > "Two model states exhibit the **Same Mechanism** if and only if:
  > 1.  A pre-defined set of **Semantic Features** (e.g., SAE latents validated offline via causal intervention) exhibit activation statistics within a bounded divergence ($D_{KL} < \delta$) of the training baseline.
  > 2.  The **Causal Graph** connecting these features (validated offline) remains structurally stable (no significant edge weight changes in the feature-circuit).
  > 3.  This evaluation occurs at a **Fixed Grain** (the feature layer) defined prior to deployment.
  > 4.  The evaluation overhead does not exceed **10% of forward-pass latency**."

  This specification sacrifices direct online causal testing (impossible under cost constraints) in favor of monitoring **causally-validated proxies**. It is the only path that satisfies the safety requirements without rendering the system unusable.
