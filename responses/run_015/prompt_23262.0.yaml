          2.  **Contextualism:** The word "know" changes meaning. In a court, "beyond reasonable doubt." In a philosophy seminar, "beyond *conceivable* doubt." The friend is cheating by using seminar rules in a cafeteria conversation.
          3.  **Abductive Reasoning (Best Explanation):** Real world is simpler than a super-computer simulating a world.
