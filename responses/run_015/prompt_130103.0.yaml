prompt: |-
  Write a short story about a sleep-lab that can induce shared lucid dreams, but thier's a glitch: one subject always wakes up inside the dream as a monarch butterfly, and she starts to wonder whether she's the one dreaming or whether the butterfly is the real self and she's just a temporary form it takes in sleep. I want it tied to Zhuangzi's butterfly dream and dream skepticism—not just as flavor text, but actually wrestling with whether there's a stable "I" that can tell waking from dreaming, and with the problem of other minds (how do you know the butterfly experience isn't the primary one?). Maybe throw in that the lab uses predictive processing models to reconstruct dream content, and the model keeps failing to integrate the butterfly's sensory world, which raises questions about whether the dreamer's framework is being imposed.

  Please write it so it's not just a retelling. After the story, add a brief note seperating what's pretty settled about Zhuangzi's view from what's genuinely contested—like don't pretend everyone agrees that the dream undermines self-identity if that's not the case. And point out where the story takes liberties with the text or leans on a contested interpretation.
