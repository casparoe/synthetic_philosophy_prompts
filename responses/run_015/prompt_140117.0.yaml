      *   **Problem:** Wants to apply insights from Condorcet Jury Theorem (CJT) and social choice theory but faces 5 specific difficulties (correlation/independence, unequal competence/no weighting, 3 options/cycling, epistemic vs. evaluative, deliberation vs. independence).
