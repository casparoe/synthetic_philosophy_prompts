      *Phase 3: Post-Panel Validation.*
      *   Compare Private vs. Public vote.
      *   Compare Expert Subgroup vs. Majority.
      *   Draft Rationale.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (Cancer Screening, N=14):* Wide CIs, heterogeneity. Epistemic uncertainty is high. Two experts.
          *   Application: Value judgment on risk tolerance? Or Epistemic on efficacy? Likely mix. Procedure should flag the heterogeneity as an epistemic limit.
      *   *Case 2 (Rare Disease, N=11):* Extreme competence spread. One user, eight novices, one patient.
