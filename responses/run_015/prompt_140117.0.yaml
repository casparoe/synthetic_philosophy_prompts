      *   *Case 3 (Overdiagnosis, N=9):* Clear facts, unclear values.
          *   Application: Procedure should identify this as *purely evaluative*. CJT does not apply. The vote is a value negotiation, not truth-tracking. Rationale must reflect this to be appeal-proof.

  6.  **Addressing the "Uncomfortable Truth":**

      *   Where will the procedure give an answer the Director won't like?
      *   Likely Case 2. The procedure might indicate that the panel *cannot* reliably truth-track because the competence average is likely <50% (8 novices vs 1 expert + 1 patient). The "correct" CJT advice is "don't vote," but the legal mandate requires a vote. The procedure must expose this fragility.
      *   Or Case 3: Admitting the decision is purely political/ethical, stripping the shield of "evidence-based medicine."

  7.  **Refining the Output Structure:**

      *   **Part 1: The Procedure.** (Formal, instructional, step-by-step).
      *   **Part 2: Application to Cases.** (Specific instructions for the three scenarios).
      *   **Part 3: Limitations & Uncomfortable Truths.** (Meta-analysis of the procedure itself).

      *Self-Correction on Weighting:* The prompt explicitly says "must not allocate unequal voting weights." I must respect this. I can, however, use competence to *trigger* specific rationale requirements. E.g., "If the majority verdict contradicts the consensus of the designated Clinical Leads, the Rationale must explicitly justify the deviation." This preserves 1-person-1-vote but adds accountability.

      *Self-Correction on Independence:* The prompt notes they read the same dossier. I cannot change that. I can only mitigate the *deliberation* correlation. Private vote *before* discussion is the key lever here.

      *Self-Correction on 3 Options:* Sequential binary voting is the standard fix for Condorcet cycles.
      *   Vote 1: Against vs. Not Against (Recommend + Research).
      *   Vote 2 (if Not Against wins): Research vs. Recommend.
      *   This imposes a status quo bias (Against), which is usually appropriate for HTA (precautionary principle).

      *Self-Correction on Epistemic vs. Evaluative:* This is the hardest part. How to operationalize?
      *   Test: "If we had infinite data, would the disagreement disappear?"
      *   If Yes -> Epistemic.
      *   If No -> Evaluative.

  8.  **Final Polish:**

      *   Tone: Professional, bureaucratic but precise, respectful of the Director's expertise.
      *   Formatting: Clear headings, bold text for actionable items.
      *   Check against constraints: <1 hour to run? Yes. Non-statistician friendly? Yes. Uses available info? Yes.

