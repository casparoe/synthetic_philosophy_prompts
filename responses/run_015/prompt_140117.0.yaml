      *Wait, Case 3:* The Director expects "no truth-tracking question survives here." The procedure should confirm this and force the rationale to state "This is a value judgment." This removes the "appeal-proof" shield of evidence. That might be the uncomfortable truth for Case 3: admitting vulnerability to appeal because it's not purely evidence-based.
