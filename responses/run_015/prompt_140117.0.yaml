      *   Metric: Private Straw Poll vs. Final Vote.
      *   If shift is >20%, note "Deliberation Effect" in rationale.

      *(Refining the "Three Options" check)*:
      *   Fixed Agenda: 1. Against? 2. Research? 3. Recommend.

      *(Refining the "Epistemic/Value" check)*:
      *   Question: "Does the disagreement stem from interpretation of P-values/HRs (Epistemic) or tolerance for false positives/harm (Value)?"

      *Let's assemble the document.*

      *Wait, one more thing:* The prompt asks "Give me the questions in order, state what counts as a sufficient answer to each, and mark where the procedure returns a no." I need to make sure the Procedure section follows this logic explicitly.

      *Revised Plan for Part 1:*
      Title: **Protocol for Panel Verdict Validation (PPVV)**
      Section 1: Triage Questions (The Filter).
      Section 2: Operational Steps (The Run).
