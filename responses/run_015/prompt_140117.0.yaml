answer: |-
  # Protocol for Panel Verdict Validation (PPVV)
  **Version:** 1.0  
  **Owner:** Methods Unit  
  **Applicability:** All Ad Hoc Technology Appraisal Panels  
  **Runtime:** < 60 minutes (Pre-panel + Post-panel)  
  **Operator:** Methods Officer (non-statistician)

  ## Purpose
  To maximize the epistemic reliability of panel verdicts where facts are disputed, and to explicitly identify where verdicts rest on value judgments rather than evidence. This protocol does not alter voting rights (one person, one vote) but structures the agenda, deliberation, and rationale to mitigate correlation, competence variance, and cycling.

  ## Part 1: The Triage Filter (Pre-Panel)
  *To be completed by the Methods Officer upon receipt of the Systematic Review.*

  **Q1: The Epistemic/Value Test**
  *Question:* If all statistical uncertainty were resolved (infinite sample size, zero heterogeneity), would the panel still disagree on the verdict?
  *   **Sufficient Answer for "Epistemic":** No. Disagreement would vanish; the decision turns on sensitivity, specificity, or mortality reduction thresholds.
  *   **Sufficient Answer for "Evaluative":** Yes. Disagreement persists because it turns on acceptable trade-offs (e.g., anxiety vs. mortality, cost vs. benefit).
  *   **Branch:**
      *   If **Evaluative**: Stop. CJT does not apply. Proceed to *Consensus Protocol* (see Manual Section 4.B). Verdict is a negotiated value statement, not a truth claim.
      *   If **Epistemic**: Proceed to Q2.

  **Q2: The Competence Distribution Check**
  *Question:* Based on specialty, prior service, and track record, can we identify a "Designated Competence Group" (DCG) comprising at least 30% of the panel?
  *   **Criteria for DCG:** Current practitioner in the specific modality OR prior panel service with a track record of verdicts later borne out by external data.
  *   **Sufficient Answer for "Yes":** DCG count ≥ 30% of total panelists.
  *   **Sufficient Answer for "No":** DCG count < 30%.
  *   **Branch:**
      *   If **No**: **RETURN NO.** The panel lacks the density of competence to reliably truth-track. The Chair must be instructed that the verdict is "High Fragility." Proceed only if mandated by statute, but flag for Rationale Trigger R3.
      *   If **Yes**: Proceed to Q3.

  **Q3: The Independence Mitigation**
  *Question:* Is the voting procedure structured to capture independent signals before correlation sets in?
  *   **Sufficient Answer for "Yes":** Protocol mandates a private straw poll *before* open deliberation.
  *   **Sufficient Answer for "No":** Voting occurs only after open discussion.
  *   **Branch:**
      *   If **No**: **RETURN NO.** The procedure is invalid for epistemic claims. Implement Private Straw Poll (see Part 2).
      *   If **Yes**: Proceed to Constitution.

  ---

  ## Part 2: Operational Steps (In-Panel)
  *To be executed by the Panel Chair with Methods Officer oversight.*

  **Step 1: The Private Straw Poll (Pre-Deliberation)**
  *   **Action:** Immediately after the evidence presentation, before any discussion, panelists record their verdict privately on a card.
  *   **Data:** Methods Officer collects and records counts. Do not reveal results to the panel yet.
  *   **Purpose:** Captures the "independent signal" required by Condorcet logic before deliberation induces herding.

  **Step 2: Structured Deliberation**
  *   **Action:** Open discussion.
  *   **Constraint:** Members of the Designated Competence Group (DCG) must speak *after* general panelists have raised initial concerns, but *before* the final vote. (Prevents anchoring by experts, ensures expertise informs the final decision).
  *   **Patient Representative:** Speaks first on impact/experience, does not vote on technical efficacy unless specified by statute.

  **Step 3: Sequential Binary Voting (To Prevent Cycling)**
  *   **Action:** Verdicts are reached via two sequential votes, not one three-way vote.
  *   **Vote A:** "Recommend Against" vs. "Not Against" (combines Research + Recommend).
      *   If "Against" wins: Verdict = **Recommend Against**. Stop.
      *   If "Not Against" wins: Proceed to Vote B.
  *   **Vote B:** "Research Only" vs. "Recommend".
      *   Winner is the final verdict.
  *   **Tie-Break:** Chair decides.
  *   **Rationale:** This imposes a precautionary status quo (Against) and avoids Condorcet cycles among three options.

  **Step 4: The Public Vote**
  *   **Action:** Show of hands for the winning option from Step 3.
  *   **Data:** Methods Officer records final counts.

  ---

  ## Part 3: Rationale Triggers (Post-Panel)
  *To be appended to the published Verdict Rationale by the Methods Officer.*

  **Trigger R1 (Deliberation Shift):**
  *   **Condition:** If the majority verdict changed between the Private Straw Poll and the Public Vote.
  *   **Required Text:** "The panel's consensus shifted during deliberation. Initial independent assessments favored [Option X], while the final collective judgment favored [Option Y]. This indicates the verdict relies on information pooling rather than pre-existing independent agreement."

  **Trigger R2 (Competence Divergence):**
  *   **Condition:** If the Majority Vote contradicts the consensus of the Designated Competence Group (DCG).
  *   **Required Text:** "The majority verdict diverges from the consensus of panelists with specific modality expertise/track record. The rationale must explicitly justify why the generalist interpretation of the evidence overrides the specialist assessment."

  **Trigger R3 (Competence Deficit):**
  *   **Condition:** If Q2 in the Triage Filter returned "No" (DCG < 30%).
  *   **Required Text:** "This panel contained a low density of specific expertise relative to panel size. While the vote was democratic, the epistemic reliability of the verdict is statistically constrained by the competence distribution."

  **Trigger R4 (Value Judgment):**
  *   **Condition:** If Q1 in the Triage Filter returned "Evaluative."
  *   **Required Text:** "This verdict rests primarily on value judgments regarding risk tolerance and resource allocation, not solely on evidentiary certainty. Reasonable parties may disagree on the evidence interpretation without being factually incorrect."

  ---

  # Application to Upcoming Panels

  ## Panel One: Cancer Screening Age Reduction (N=14)
  *Context: Wide CIs, heterogeneity. 2 Experts (DCG), 12 Generalists/Patient.*

  **Triage Run:**
  1.  **Q1 (Epistemic/Value):** **Mixed.** Heterogeneity is epistemic; "is wide CI acceptable?" is evaluative. *Decision:* Treat as Epistemic for the purpose of "does it work?", Evaluative for "is it safe enough?". **Proceed as Epistemic** (default to caution).
  2.  **Q2 (Competence):** 2 Experts / 14 Total = 14%. **RETURN NO.** (DCG < 30%).
  3.  **Q3 (Independence):** Assume standard procedure (No private poll). **RETURN NO.**

  **Operational Instructions:**
  *   **Constitution:** Do not convene yet. You need at least 5 DCG members to pass Q2 (30% of 14 is 4.2). Recruit 3 more specialists or reduce panel to 6 (impractical). **Recommendation:** Add 3 specialists to the panel.
  *   **Procedure:** If panel stands as is, you must apply **Trigger R3 (Competence Deficit)** in the rationale.
  *   **Voting:** Use Sequential Binary (Against vs. Not; then Research vs. Recommend).
  *   **Deliberation:** Implement Private Straw Poll.
  *   **Outcome Prediction:** With wide CIs, the epistemic signal is weak. The panel will likely default to "Research Only." If they vote "Recommend," Trigger R3 makes the verdict vulnerable to appeal on the grounds of low epistemic reliability.

  ## Panel Two: Rare Condition Diagnostic Test (N=11)
  *Context: 1 User (DCG), 8 Novices, 1 Patient (Experience), 1 Other. Extreme competence spread.*

  **Triage Run:**
  1.  **Q1 (Epistemic/Value):** **Epistemic.** Does the test detect the condition? (Sensitivity/Specificity).
  2.  **Q2 (Competence):** 1 User / 11 Total = 9%. **RETURN NO.** (DCG < 30%).
  3.  **Q3 (Independence):** **RETURN NO** (unless Private Poll implemented).

  **Operational Instructions:**
  *   **Constitution:** This panel is epistemically invalid for truth-tracking under CJT. The "worse than even" risk is high for the 8 novices.
  *   **Mitigation:** You cannot weight the vote. You must treat the 1 User as a **Witness**, not a voter. Their testimony is evidence. The 8 novices are voting on their *interpretation of the witness*, not the technology.
  *   **Procedure:** Mandatory Private Straw Poll.
  *   **Rationale:** You must publish **Trigger R3**.
  *   **Hard Truth:** If the 8 novices vote "Recommend" and the 1 User votes "Against," and you publish Trigger R3, you are publishing a verdict that your own methods unit flags as statistically likely to be wrong.
  *   **Recommendation:** Reduce panel size to 5, ensuring 2 are DCG (40%). If N=11 is statutory, you must accept the "Competence Deficit" flag.

  ## Panel Three: Overdiagnosis/Indolent Disease (N=9)
  *Context: Clear facts, unclear values. Anxiety/Complications vs. Mortality.*

  **Triage Run:**
  1.  **Q1 (Epistemic/Value):** **Evaluative.** Facts are clear (mortality benefit small, harm measurable). Disagreement is on "Is it worth it?"
  2.  **Branch:** **STOP.** CJT does not apply.

  **Operational Instructions:**
  *   **Procedure:** Do not use Sequential Binary Voting for "truth." Use **Consensus Protocol**.
  *   **Voting:** Vote is a measure of political acceptability, not accuracy.
  *   **Rationale:** You must publish **Trigger R4 (Value Judgment)**.
  *   **Appeal Risk:** This removes the "evidence-based" shield. A manufacturer can appeal not on data (which is clear) but on the *values* of the panel.
  *   **Director's Expectation:** You are correct. No truth-tracking survives here. The procedure forces you to admit this publicly.
  *   **Action:** Chair the meeting as a negotiation, not a discovery. The "Verdict" is a policy choice.

  ---

  # Limitations & The Uncomfortable Truth

  ### Where Judgment Remains Unavoidable
  1.  **The Q1 Threshold:** Deciding whether a disagreement is "Epistemic" or "Evaluative" is itself a judgment. A Methods Officer must decide if a disagreement about p-value thresholds (0.05 vs 0.01) is fact or value. *Mitigation:* Default to "Evaluative" in ambiguous cases to lower appeal risk (admitting values are harder to challenge than facts).
  2.  **DCG Classification:** Deciding who counts as "Competent" (Q2) involves judgment. Is a researcher who hasn't practiced in 10 years DCG? *Mitigation:* Define DCG strictly in the manual (e.g., "Clinical practice within last 2 years").
  3.  **The "Correct" Answer:** CJT assumes a ground truth. In HTA, ground truth often emerges years later. You are validating the *process*, not the *outcome*.

  ### What The Procedure Cannot Tell You
  *   **It cannot fix a broken evidence base.** If the Systematic Review is garbage, the Jury Theorem amplifies noise, not signal. The procedure assumes the dossier is the best available truth.
  *   **It cannot prevent herding entirely.** Even with a private poll, the final public vote is subject to social pressure. The procedure documents the shift (Trigger R1) but does not prevent it.
  *   **It cannot legitimate the illegitimate.** If the statute requires a majority vote on a value question, the procedure cannot turn it into a fact question. It can only label it.

  ### The Uncomfortable Truth (The Case You Will Not Like)
  **Panel Two (Rare Condition)** is the case where faithful application gives you an answer you will not like.

  *   **The Math:** With 1 expert and 8 novices, if the novices have even a modest correlation (shared dossier) and competence slightly below 50% (likely, given they've never seen the condition), Condorcet logic dictates the group accuracy is *lower* than the single expert's accuracy.
  *   **The Procedure's Output:** It forces you to attach **Trigger R3 (Competence Deficit)** to the verdict.
