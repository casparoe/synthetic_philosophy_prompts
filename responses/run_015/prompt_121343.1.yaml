answer: |-
  # Diagnostic Taxonomy of Moral Worth

  ### Internal Nodes (Decision Points)

  **Node 1 (Root):** Must an agent's motivating reason correctly identify the feature that actually confers rightness on the act for the act to possess full moral worth?
  *   **Yes:** Proceed to Node 2.
  *   **No:** Proceed to Node 5.

  **Node 2 (Meta-Reason Error):** Consider an agent who returns lost property because she erroneously believes a specific religious text commands it, though impartial respect for ownership is what in fact makes it right. Does this false meta-belief negate the moral worth of her action?
  *   **Yes (Negates):** Proceed to Node 3.
  *   **No (Preserves):** Proceed to Node 4.

  **Node 3 (Fragility Condition A):** If the agent's correct reason is counterfactually brittle—she would have withheld help had one incidental belief about risk been slightly different—does that brittleness erase moral worth?
  *   **Yes (Erases):** **Leaf 1**
  *   **No (Preserves):** **Leaf 2**

  **Node 4 (Structural Substitution A):** Can moral worth be preserved when an agent acts through institutional or procedural compliance—say, a civil servant applying an equitable distribution rule—without personally grasping the justice of the rule, provided the social architecture reliably aligns her behavior with rightness?
  *   **Yes (Preserves):** **Leaf 3**
  *   **No (Negates):** **Leaf 4**

  **Node 5 (Structural Substitution B):** In a case where a civil servant applies an equitable distribution rule without personally grasping the justice of the rule, does the reliable alignment of behavior with rightness suffice for moral worth?
  *   **Yes (Suffices):** Proceed to Node 6.
  *   **No (Insufficient):** Proceed to Node 7.

  **Node 6 (Fragility Condition B):** If the agent's correct reason is counterfactually brittle—she would have withheld help had one incidental belief about risk been slightly different—does that brittleness diminish moral worth?
  *   **Yes (Diminishes):** **Leaf 5**
  *   **No (Irrelevant):** **Leaf 6**

  **Node 7 (Meta-Reason Error B):** Given the agent returns lost property based on erroneous religious command rather than impartial respect, is her moral worth negated by this false meta-belief?
  *   **Yes (Negated):** **Leaf 7**
  *   **No (Preserved):** **Leaf 8**

  ***

  ### Leaves (Positional Mappings & Awkward Commitments)

  **Leaf 1: Strict Kantian Rationalism**
  *   **Path:** 1-Yes, 2-Yes, 3-Yes.
  *   **Awkward Commitment:** This view must deny moral worth to a benevolent agent who acts rightly for the right reason, simply because their resolve would have faltered under a slightly higher hypothetical risk.

  **Leaf 2: Unoccupied Gap (Fragility-Tolerant Rationalism)**
  *   **Path:** 1-Yes, 2-Yes, 3-No.
  *   **Awkward Commitment:** This position must insist that an agent must identify the right-making feature to have worth, yet admit that their grasp of this feature could be vanishingly fragile without loss of worth.

  **Leaf 3: Unnamed Hybrid (Tracking + Meta-Tolerance)**
  *   **Path:** 1-Yes, 2-No, 4-Yes.
  *   **Awkward Commitment:** This view must affirm full moral worth for an agent who tracks the right feature but believes it is commanded by a false religious text, provided they also accept institutional compliance without grasping justice.

  **Leaf 4: Unoccupied Gap (Tracking Purist)**
  *   **Path:** 1-Yes, 2-No, 4-No.
  *   **Awkward Commitment:** This position must claim that meta-ethical errors do not undermine worth, yet deny worth to an agent who follows a just institutional rule without personally grasping its justice.

  **Leaf 5: Modified Humean Sentimentalist**
  *   **Path:** 1-No, 5-Yes, 6-Yes.
  *   **Awkward Commitment:** This view must deny full moral worth to a sentiment-driven agent whose helpfulness is counterfactually dependent on incidental risk beliefs, even if institutional roles stabilize their behavior.

  **Leaf 6: Consequentialist Reason-Irrelevance**
  *   **Path:** 1-No, 5-Yes, 6-No.
  *   **Awkward Commitment:** This position must affirm full moral worth for a civil servant who blindly follows a just rule while secretly despising justice, provided the outcome holds and motives are counterfactually brittle.

  **Leaf 7: Unoccupied Gap (Virtue-Meta-Hard)**
  *   **Path:** 1-No, 5-No, 7-Yes.
  *   **Awkward Commitment:** This view must insist that explicit tracking of right-making features is unnecessary, yet deny worth to an agent whose virtuous action rests on a benign meta-ethical error.

  **Leaf 8: Aristotelian Virtue-Based Habituation**
  *   **Path:** 1-No, 5-No, 7-No.
  *   **Awkward Commitment:** This position must affirm full moral worth for an agent who acts virtuously based on a false religious meta-belief, provided their character is habituated correctly and they personally grasp the rule's justice.

  ***

  ### Analysis of Unoccupied Logical Space

  **Gap 1: Fragility-Tolerant Rationalism (Leaf 2)**
  *   **Combination:** Requires Tracking (Yes) + Meta-Error Kills (Yes) + Fragility Tolerated (No).
  *   **Diagnosis:** **Unattractiveness.** This position creates an unstable asymmetry: it demands high-fidelity cognitive access to the right-making feature (Node 1 & 2) but refuses to demand that this access be robust across close possible worlds (Node 3). It grants the "credit" of rationalism without the "cost" of stability, making the attribution of worth seem arbitrary when the agent's virtue is easily disrupted.

  **Gap 2: Virtue-Meta-Hard (Leaf 7)**
  *   **Combination:** Requires Tracking (No) + Structural Substitution (No) + Meta-Error Kills (Yes).
  *   **Diagnosis:** **Incoherence.** This position claims that correctly identifying the abstract right-making feature is not required for worth (Node 1), yet simultaneously claims that a false belief about the *source* of that feature negates worth (Node 7). If the agent need not track the feature, it is logically inconsistent to penalize them for misidentifying the feature's metaphysical ground, suggesting the view implicitly requires tracking after all.
