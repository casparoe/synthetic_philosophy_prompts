  ok so im taking this philosophy of science course and we just did the unit on simultaneous invention — newton and leibniz with calculus, darwin and wallace with natural selection. our prof brought up stiglers law and said that no discovery is named after its actual discoverer, which makes sense with these pairs. but heres where im stuck: if two people can arrive at literally the same theory independently, doesnt that mean the theory was just inevitable? like, calculus and natural selection were always going to happen once the background conditions were met. so if the ideas are genuinely identical, why do historians and philosophers make such a big deal about who published first or whose version 'counted'? i keep feeling like im conflating 'independent discovery' with 'interchangeable discovery' — as if wallace and darwin are just two labels for the exact same conceptual package. but then my friend said that leibniz notation actually changed how calculus was taught and wallaces mechanism was different from darwins in a way that mattered for later biology. is the point that even 'simultaneous' discoveries arent actually the same idea, just similar outcomes? and if theyre not identical, does that undermine the argument that discovery is inevitable? sorry if this is muddled, i think im smuggling in a false presupposition that convergence equals sameness but i cant quite locate it.
