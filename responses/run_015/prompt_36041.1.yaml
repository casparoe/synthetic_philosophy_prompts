answer: |-
  ### Where the premise goes wrong

  The economist's inference fails because it treats a conditional mathematical result as an unconditional empirical claim. The statement that "every trade that actually occurs... involves at least one party who is irrational" is literally false. The No-Trade Theorem does not prove that trading implies irrationality; it proves that trading implies the violation of the theorem's specific assumptions. Real-world agents trade for reasons unrelated to speculative private information, such as liquidity needs, risk hedging, or consumption smoothing. Furthermore, the theorem assumes common priors and common knowledge of rationality, conditions rarely met in actual markets. By ignoring these boundary conditions, the remark conflates speculative trade driven solely by information asymmetry with trade driven by heterogeneous preferences or endowments. Consequently, the conclusion that markets aggregate noise rather than wisdom rests on a category error. The volume of trade does not measure irrationality; it measures the intensity of heterogeneous needs and information processing within a framework where the theorem's strictures do not apply. The epistemic engine survives because the theorem describes a frictionless vacuum that real markets never inhabit.

  ### What the no-trade theorem actually says

  Formulated primarily by Milgrom and Stokey in 1982, the No-Trade Theorem is a foundational result in information economics. It posits a scenario where rational agents share a common prior probability distribution regarding an asset's value and possess common knowledge of each other's rationality. Crucially, it assumes agents begin at a Pareto-efficient allocation, meaning no trade is initially necessary to optimize risk or consumption. In this setup, if an agent proposes a trade based on private information, the counterparty infers that the proposer possesses favorable information. Because they share common priors, the counterparty updates their beliefs to align with this inference. This updating process continues until beliefs converge, eliminating the disagreement necessary for mutually beneficial speculative trade. Essentially, the mere willingness to trade becomes public information that dissolves the private information advantage. Therefore, the theorem concludes that no speculative trade will occur solely due to asymmetric information under these strict conditions. It is not a claim about real-world markets per se, but a logical demonstration of what happens when information is the only variable and rationality is common knowledge. It highlights that for trade to occur, agents must differ in priors, risk preferences, or initial endowments, or else face liquidity constraints that force transactions regardless of information. Philosophers should note this mirrors Aumann's Agreement Theorem: rational agents with common priors cannot agree to disagree. The theorem isolates speculative profit from information alone, showing it vanishes when rationality is common knowledge.

  ### Consequences for the epistemology of markets

  This theorem does not dismantle Hayekian epistemic optimism. Hayek's argument concerns the aggregation of dispersed knowledge regarding local conditions, preferences, and production possibilities, not merely speculative asset valuation under common priors. Real markets function precisely because the theorem's assumptions fail: agents have heterogeneous priors, different risk tolerances, and urgent liquidity needs. Thus, trading volume reflects the processing of diverse information and needs, not merely irrationality. Regarding prediction markets, their accuracy does not derive from trader irrationality. Instead, it stems from incentive structures that reward accurate information and penalize error. Even if some traders are noisy, marginal traders who possess superior information will drive prices toward truth to capture profits. The epistemology of markets is not an epistemology of noise; it is an epistemology of incentives. The No-Trade Theorem shows that without heterogeneous needs or priors, information alone cannot sustain trade. However, since real markets abound with heterogeneity, prices successfully aggregate private information because agents are motivated to act on it despite the risk of trading against better-informed counterparts. The market's wisdom emerges from the competition among diverse perspectives and needs, not from a vacuum of perfect rationality. Therefore, the conference remark's implication that market accuracy relies on error is incorrect. Markets work because they accommodate irrationality, yes, but primarily because they harness rational responses to heterogeneous conditions and incentives. The presence of noise traders may provide liquidity, but the epistemic value comes from informed agents correcting prices. Consequently, the market remains a robust social epistemic engine, not because agents are irrational, but because the institutional structure translates diverse rational and irrational inputs into accurate signals.

  ### Bottom line

  The conference remark is misleading. It mistakes a theoretical boundary condition for an empirical law. The No-Trade Theorem demonstrates what happens when rationality and priors are common, not that real traders are irrational. Markets aggregate wisdom precisely because those strict conditions do not hold. Your Hayekian optimism is safe. The theorem highlights the necessity of heterogeneity for trade, not the necessity of error. Markets remain epistemic engines because they harness diverse information and incentives, not because they rely on mistakes.
