      "Money as access ticket: Maps cleanly to state tokens granting permission to execute transactions.",
      "Gold standard as external oracle: Maps to relying on an external consensus layer that introduces latency and single points of failure.",
      "Circulation as replication: The movement of money mirrors state propagation across distributed nodes.",
      "Idle labor as unused capacity: Maps to available compute resources waiting for scheduling."
    ],
    "distortions": [
      "Consensus is social not algorithmic: Agreement on value is based on political trust and national sentiment, not cryptographic proof or voting rounds.",
      "Byzantine Fault Tolerance mismatch: The primary failure mode is liquidity stagnation (liveness), not malicious state corruption by rogue nodes.",
      "Centralized issuer: The Bank acts as a privileged admin node, violating the trust-minimized assumption of most distributed protocols.",
      "Collateral abstraction: 'Land and Labor' are not easily verifiable state variables like a digital signature; they require off-chain assessment."
    ],
    "missing_residue": [
      "Teleological Objective: Distributed systems optimize for consistency/availability; Berkeley optimizes for human welfare and employment.",
      "Sovereignty: The protocol relies on a specific political authority to enforce acceptance, which has no counterpart in permissionless systems.",
      "Ontology of Value: The distinction between 'real wealth' (labor) and 'tickets' (money) implies a metaphysical hierarchy of value absent in state machines."
    ],
    "verdict": "The talk of 'intrinsic value' is not metaphysical noise; it is the system's objective function. Your vocabulary describes how state moves, but Berkeley's residue describes why it should move. The 'value' residue captures the teleological gap: distributed systems ensure the ledger works, but Berkeley's theory demands the ledger serve a specific human outcome (full employment). Ignoring this reduces the protocol to a mechanism without a purpose."
  }
