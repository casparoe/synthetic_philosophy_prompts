  **DRAFT WORKING DOCUMENT: ADVERSARIAL COLLABORATION ON ANTHROPOCENE BOUNDARY CRITERIA**
  **Date:** 14 February 2025
  **Status:** Pre-workshop Circulation (Closed Door)
  **Distribution:** Workshop Participants Only

  ### 1. Agreed Claims

  The following statements represent substantive points of agreement between the mid-century stratigraphic camp and the long-Anthropocene Earth-system camp. These are not merely procedural; they are commitments to specific interpretations of the evidence and the rules governing geological time. Items that were considered but rejected because they required vacuous language are noted at the end of this section.

  1.  **Function of a GSSP:** Both camps agree that the primary technical function of a Global Boundary Stratotype Section and Point (GSSP) is global time-correlation, not the certification of causal mechanisms. A boundary marks *when* a change is recorded globally, not necessarily *why* it started. However, both camps acknowledge that selecting a boundary inevitably functions as a causal narrative in public discourse, regardless of technical intent.
  2.  **Independence of Forcing and Boundary:** Both camps agree that the formal decision on the boundary date has no bearing on the physical reality or magnitude of past human forcing. CO2 emissions, land-use change, and biodiversity loss occurred regardless of whether the unit is formally ratified. The boundary is a labeling convention, not a physical switch.
  3.  **Coherence of "First Detectable Impact":** Both camps agree that "first detectable human impact" is an incoherent criterion for a formal boundary because detectability is contingent on sampling density, analytical technology, and geographic location. A boundary based on detectability privileges the instrument over the event.
  4.  **Extra-Scientific Load:** Both camps agree that the term "Anthropocene" is already performing political, pedagogical, and historical work that a formal stratigraphic decision cannot undo. A negative vote by the Commission on Stratigraphy will not stop historians or policymakers from using the term.
  5.  **Mid-Century Concession on Impact Onset:** The mid-century camp concedes that the 1950s boundary does not mark the *onset* of significant human influence on the Earth system, only the onset of a globally synchronous signal durable enough to meet current GSSP guidelines. They accept that human forcing predates the marker.
  6.  **Long-Anthropocene Concession on Signal Strength:** The long-Anthropocene camp concedes that earlier candidate signals (e.g., 1610 CO2 dip, pollen changes) are significantly more diachronous and chemically subtle than mid-century markers, making them difficult to correlate across all lithologies without significant uncertainty.
  7.  **Durability vs. Detectability:** Both camps agree that a marker must survive burial to function as a stratigraphic unit. However, they disagree on the timescale required (see Section 2). Both accept the diagenesis modelling result that the 1610-era signal may survive 100,000 years of burial better than the plastic horizon, despite being weaker initially.

  *Rejected Claim:* We considered a claim stating "Both camps agree the Anthropocene is a real geological unit." This was left out because the mid-century camp views it as a potential unit pending formal ratification, while the long-Anthropocene camp views it as a real Earth-system state regardless of ratification. The word "real" carries too much ontological weight here.

  ### 2. Disagreements Table

  The following table isolates the specific cruxes preventing consensus. For each crux, both camps must accept the "Concrete Case" as a valid test. Predictions are written as falsifiable statements regarding the outcome of that test.

  | Crux | Mid-Century Camp Position | Long-Anthropocene Camp Position | Concrete Case / Rule / Measurement | Mid-Century Predicted Outcome | Long-Anthropocene Predicted Outcome |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Correlation vs. Causation** | The boundary must prioritize global synchronicity for correlation; causal onset is secondary and often unrecordable. | The boundary must prioritize the onset of causal Earth-system domination; synchronicity is secondary and often illusory. | Compare the narrative accuracy of a 1950 boundary vs. a 1610 boundary against Earth-system model hindcasts of forcing magnitude. | The 1950 boundary will align within 5% of the inflection point in global system state variables; 1610 will show a mismatch between boundary and state shift. | The 1610 boundary will align within 10% of the cumulative forcing integral; 1950 will capture only the acceleration phase, missing the majority of the causal mass. |
  | **Diachroneity Tolerance** | A boundary cannot tolerate significant lag. The Namibia varve data (1911 plastic, lagging NH by 20–40 years) demonstrates that even 'modern' markers are not perfectly synchronous. | Geological time scales render 20–40 year lags negligible. The Namibia varve data confirms the signal propagates, which is sufficient for correlation. | Apply the "Synchrony Quotient" (requires 0.8 of 40 sections to fall within +/- 25 years) to the 1610 carbon signal vs. the 1950 radionuclide signal. | The 1610 signal will fail the Quotient (score < 0.8) due to regional variability in land-use and carbon uptake; 1950 will pass (score > 0.8). | The 1950 signal will pass the Quotient technically, but the 1610 signal will meet a modified Quotient (0.6) that accounts for ecological propagation time, which should be the standard. |
  | **Durability vs. Magnitude** | Durability in the rock record is the primary constraint. If the plastic signal degrades faster than the 1610 organic signal (per diagenesis models), it is a superior marker only if it survives long enough to be found. | Magnitude of forcing is the primary constraint. A signal that survives 100k years but represents a minor forcing event is a monument to preservation bias, not Earth history. | Bury samples of 1950s plastic-concrete mix and 1610 organic-rich sediment under high-pressure diagenesis conditions for simulated 100k years. | The plastic signal will degrade below detection limits in >50% of samples; the 1610 signal will remain chemically distinct in >80% of samples, proving 1610 is stratigraphically safer. | The plastic signal will degrade, but the 1950s horizon will remain visible via concrete aggregates and fly ash, whereas the 1610 signal will be indistinguishable from natural organic variability. |
  | **Authority and Splitting** | Stratigraphers must decide the stratigraphy. The "Cape Town Protocol" (splitting the term) is acceptable only if the formal chronostratigraphic unit remains distinct and primary. | A mixed panel (historians, Indigenous reps, modellers) must decide the historical period. The "Cape Town Protocol" is necessary to prevent stratigraphic rules from dictating historical narrative. | Implement the Cape Town Protocol: Define a formal GSSP (Stratigraphy) and a separate "Human History Period" (Mixed Panel) with no requirement for date coincidence. | The split will clarify the science; the formal GSSP will settle on 1950, and the historical term will be ignored by geologists, preserving disciplinary integrity. | The split will dissolve the dispute but relocate it; the "Human History Period" will become the dominant public definition, rendering the formal GSSP irrelevant to policy and history. |
  | **Forcing vs. Signal vs. State** | The boundary marks the onset of a distinct *signal* (e.g., radionuclides) that indicates a new state. | The boundary marks the onset of a new *state* (e.g., human domination), for which the signal is merely evidence. | Define three separate dates: (A) Onset of Forcing, (B) Onset of Global Signal, (C) Onset of New Earth-System State. | Dates A, B, and C will cluster tightly enough (within 50 years) that a single boundary is justified; separating them creates unnecessary complexity. | Dates A, B, and C will diverge by centuries; forcing (A) starts early, signal (B) starts late, and state (C) is gradual. A single boundary is scientifically misleading. |

  ### 3. Closing Analysis: Verbal vs. Real Disputes

  A portion of this disagreement is verbal, concerning the defintion of the term "Anthropocene" rather than the physical world. Both camps agree on the physical data points (the CO2 curves, the plastic layers, the radionuclide spikes). The dispute is over which data point earns the label. However, a significant portion is real: it concerns the utility of the geological record. If the plastic signal degrades faster than the 1610 organic signal (per Stipulation 3), then a 1950s GSSP may be impossible to identify in the deep future, rendering it a failed stratigraphic unit regardless of its current visibility. Conversely, if the 1610 signal is too diachronous to correlate (per Stipulation 2), it fails the primary requirement of a chronostratigraphic unit.

  **Refusal Formulations**

  Each camp should be aware of the neutral-sounding formulation they will likely refuse to sign, because accepting the wording concedes the core argument.

  *   **Mid-Century Camp Refusal:** They will likely refuse to sign any statement that defines the boundary as *"The onset of significant human influence on the Earth system."*
      *   *Reason:* This formulation conflates the boundary with causation. Since they concede influence started earlier (Agreed Claim 5), signing this would invalidate their 1950s marker as being too late to meet the definition.

  *   **Long-Anthropocene Camp Refusal:** They will likely refuse to sign any statement that defines the boundary criterion as *"Global synchronicity within a 25-year window."*
      *   *Reason:* This formulation codifies the Synchrony Quotient (Stipulation 2) as the primary rule. Since their preferred markers are diachronous by nature (ecological propagation takes time), signing this would technically disqualify their candidates regardless of their causal significance.

  *Note: There may be some comittee resistance to the Cape Town Protocol from the historians regarding the "Indigenous representatives" clause, but that is outside stratigraphic scope.*
