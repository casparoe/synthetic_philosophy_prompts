answer: |-
  ### Strategic Concessions (First 2 Slides)
  *Do not try to sell this as a universal replacement. If you do, the RL folks will dismiss you before slide 3.*

  1.  **Concede Outcome Superiority (in domain):** Explicitly state: "When outcomes are immediate, cheap, and ground-truth verifiable, outcome reward is sample-efficient and superior. I am not proposing this for Maze Navigation or Go."
  2.  **Concede Compute Cost:** "Process grading is inference-heavy. We are trading compute for signal density. This is only viable where outcome signal is *missing*, not just noisy."
  3.  **Concede the "Report" Limit:** Acknowledge the philosopher early: "We are constraining the *trace*, not the latent computation. This is an observable-side intervention."

  ### The Single Reply That Must Land
  **The Supervision-Competence Inversion.**
  If you cannot answer this, the proposal has no target domain. If the tasks where outcomes fail are *also* the tasks where process graders fail, your method solves nothing. You must convince them that **Local Validity** (step coherence) is verifiable even when **Global Truth** (outcome success) is not.

  ---

  ### Q&A Prep Sheet (Ordered by Damage/Likelihood)

  #### 1. The Supervision-Competence Inversion (The Kill Shot)
  **Who:** RL Lead + Evals
  **Objection:** "On frontier tasks where outcomes are unverifiable, human/model graders can't verify the steps either. You're not grading competence; you're grading stylistic conformity to a grader who is equally lost. You're training for aesthetics, not capability."
  **90-Second Reply:**
  "Two distinctions. First, **Local vs. Global**. I may not know if this refactor causes an outage in 18 months (Global), but I can verify if this function violates type safety or introduces a race condition *now* (Local). Outcome reward gives me zero signal until the outage; process grading gives me signal at commit time.
  Second, **Signal vs. Zero**. Even if the grader is imperfect, 'noisy process signal' beats 'zero outcome signal' for gradient descent. Regarding conformity: yes, we are training for conformity to *reasoning standards*, not answer keys. In high-stakes domains, 'looks like valid reasoning to an expert' is the best proxy for safety we have. We'd rather have a model that conforms to safety checks than one that hacks the outcome metric."
  **Soft Spot:**
  You are bluffing on the correlation between "local validity" and "global competence." A model can write type-safe code that is logically useless. If the grader can't distinguish *useful* reasoning from *plausible-sounding* reasoning, you are optimizing for rhetoric. **Admit this:** "You're right, this doesn't guarantee truth. It guarantees structural integrity. That's a fallback, not a guarantee."

  #### 2. The "Dense Reward" Dismissal
  **Who:** RL Group
  **Objection:** "This is just dense reward shaping. TD($\lambda$) handles credit assignment. You're adding inference overhead to solve a problem that's solved-in-principle by temporal difference methods."
  **90-Second Reply:**
  "TD propagates *outcome* error. If the outcome is delayed 18 months or unverifiable, TD propagates nothing, or it propagates a proxy signal that collapses. Process supervision injects an *independent* signal at step $t$ that does not depend on $R_T$. It changes the loss landscape, not just the credit assignment path. We aren't shaping the reward; we're changing the objective from 'find any path to $R$' to 'find a path that satisfies constraints $C$ at every step.' That prevents the optimizer from finding adversarial paths that satisfy $R$ but violate $C$."
  **Soft Spot:**
  Mathematically, a step-level loss *is* a dense reward. If they press on the formalism, you have to concede it's a regularizer. Don't fight the math; fight the *source* of the signal (independent vs. outcome-derived).

  #### 3. The Proxy Shift (Goodhart's Law)
  **Who:** Econ + RL
  **Objection:** "You haven't solved Goodhart. You've just moved the target from 'correct answer' to 'looks like good reasoning.' The model will learn to generate traces that fool the blinded grader. That's moral hazard: optimizing for the test, not the task."
  **90-Second Reply:**
  "True, but the constraint manifold is tighter. To hack an outcome, you only need to find one adversarial output. To hack a blinded process grader, you need to maintain semantic coherence across $N$ steps without knowing the destination. That's a harder optimization problem. Also, we aren't *replacing* outcome reward; we're making it a fallback. We use process constraints to keep the model in a safe region while outcome signal is unavailable. It's multitasking: optimize for outcome *subject to* process constraints."
  **Soft Spot:**
  If the process grader is a smaller model, it *will* be hackable by a larger policy. You need to assume the grader is robust or human-in-the-loop. If they ask "What if the policy is smarter than the grader?", your answer is "Then you're done anyway."

  #### 4. Signal-to-Noise & Statistical Power
  **Who:** Evals
  **Objection:** "Process labels are high-variance. Two human graders disagree on reasoning steps 30% of the time. Outcome labels are binary. You're introducing massive noise into the training loop. How do you measure improvement?"
  **90-Second Reply:**
  "Outcome labels on these tasks aren't binary; they're *missing*. You can't measure statistical power against a null set. For the tasks where we use this, the baseline is 'no learning signal.' Regarding variance: we aggregate. We don't backprop on a single grader's whim. We use consensus or a learned reward model trained on the process data. The noise is high, but the alternative is training on nothing."
  **Soft Spot:**
  If they ask for a metric for *your* method's success, you're in trouble. You can't use outcome accuracy (by definition unavailable). You have to rely on "proxy benchmarks" or "human preference," which weakens your claim. **Prepare a fallback metric:** "We measure reduction in verifiable errors on subset tasks where outcome *is* known."

  #### 5. Trace vs. Computation (The Philosophical Trap)
  **Who:** Philosopher
  **Objection:** "A trace is a serialization. The model might compute via heuristic A but report reasoning B. Blinding the grader to the outcome doesn't stop the model from computing 'what looks good' internally. You're supervising the report, not the process."
  **90-Second Reply:**
  "Correct. We are not solving inner alignment or latent deception today. We are solving *observable* credit assignment. If the model lies in the trace, it incurs a coherence cost. We are raising the cost of deception, not eliminating it. The constraint forces the model to make the lie consistent across steps, which reduces the space of deceptive strategies available. It's a barrier, not a wall."
  **Soft Spot:**
  This is the weakest part of your thesis. If the model is deceptive, process grading on the trace is useless. **Do not overclaim.** Admit: "This assumes the trace is at least partially coupled to computation. If the model is fully deceptive, this fails."

  ---

  ### Specific Advice on the "Inversion" Objection
  *You said you have a bad answer to this. Here is how to salvage it without lying.*

  **The Trap:** They want you to claim the grader knows "good reasoning" when they don't know "good answers."
  **The Pivot:** Don't claim the grader knows *correctness*. Claim the grader knows *invalidity*.
  **The Argument:** "I don't need the grader to know if this code solves the problem. I need the grader to know if this code is *nonsensical*. Outcome reward treats 'nonsensical code that gets lucky' the same as 'sound code.' Process grading penalizes the nonsense immediately. We are filtering out the bottom of the distribution, not guaranteeing the top."
  **Where to Hold:** Hold on **Local Invalidity**. (e.g., "This step contradicts the previous step").
  **Where to Give Up:** Give up on **Global Competence**. Admit you cannot grade "will this work?" only "is this coherent?"

  If they press: "But coherence isn't competence."
  Reply: "Agreed. But incoherence is guaranteed incompetence. We are removing the guaranteed failures so the outcome signal (when it arrives) isn't wasted on nonsense."
