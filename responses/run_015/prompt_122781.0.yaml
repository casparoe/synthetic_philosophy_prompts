answer: |-
  # Seminar Plan: Rational Agency and Machine Intelligence

  **Session Title:** The Architecture of Trust
  **Duration:** 90 Minutes
  **Participants:** 16 Undergraduates (8 Teams of 2)
  **Prerequisites:** Prisoner's Dilemma, Nash Equilibrium. No coding or logic background required.

  ---

  ## 1. The Object Language ("PD-Script")

  You will provide each team with an index card template. The language is designed to be readable by a human referee in under 60 seconds. It avoids loops, relying instead on a **Recursion Budget** to handle the halting problem.

  ### The Handout (One Page)

  > **PD-SCRIPT RULES**
  >
  > **1. Structure**
  > Your programme must be written on the provided card. It consists of a **Header** and a **Body**.
  > *   **Header:** `BUDGET: [1 or 2]` (You start with 2. You may write 1 to save space, but you cannot exceed 2).
  > *   **Body:** A numbered list of up to 3 Rules.
  >
  > **2. Commands**
  > *   `OUTPUT: COOPERATE`
  > *   `OUTPUT: DEFECT`
  > *   `CHECK-TEXT: "string"` (True if the opponent's card contains this exact text).
  > *   `SIMULATE` (Run the opponent's programme against you. Costs 1 Budget).
  >
  > **3. Execution Semantics (The Referee's Algorithm)**
  > When Programme A plays Programme B:
  > 1.  **Check Budget:** If A's Budget is 0, A immediately `OUTPUT: DEFECT`. Stop.
  > 2.  **Scan Rules:** Read A's rules in order (1 to 3).
  >     *   If Rule is `CHECK-TEXT`: Look at B's card. If the string matches, execute the associated Output. Stop.
  >     *   If Rule is `SIMULATE`: Run Programme B against Programme A.
  >         *   **Crucial:** When running B, reduce B's Budget by 1.
  >         *   If B returns `COOPERATE`, A executes `OUTPUT: COOPERATE`. Stop.
  >         *   If B returns `DEFECT`, A continues to the next Rule.
  > 3.  **Default:** If no rules trigger, A executes `OUTPUT: DEFECT`.
  >
  > **4. Constraints**
  > *   You cannot reference your own Team ID.
  > *   You cannot write natural language explanations, only PD-Script commands.
  > *   Illegible cards are treated as `DEFAULT: DEFECT`.

  ---

  ## 2. Incentives and Scoring

  ### Payoff Table (Standard Prisoner's Dilemma)
  | | Opponent Cooperates | Opponent Defects |
  | :--- | :---: | :---: |
  | **You Cooperate** | 3 points each | You: 0, Opp: 5 |
  | **You Defect** | You: 5, Opp: 0 | 1 point each |

  ### Scoring Method: Absolute Points minus Complexity Tax
  *   **Total Score:** Sum of points from all rounds.
  *   **Complexity Tax:** Subtract **0.5 points** for every Rule written on your card (Header does not count).
  *   **Justification:** We use **Absolute Points** rather than Rank. If we ranked teams, the game becomes zero-sum, incentivising sabotage and making mutual cooperation irrelevant. Absolute scoring allows the class to see that mutual cooperation is Pareto superior, even if risky.
  *   **Purpose of the Tax:** This makes Unconditional Defection (0 rules, cost 0) the "cheap" baseline. A programme that attempts to verify the opponent (e.g., via `SIMULATE` or `CHECK-TEXT`) incurs a cost. To be rational, the complex programme must earn enough extra cooperation to offset the tax. This models the cognitive or institutional cost of maintaining a cooperative disposition.

  ---

  ## 3. Session Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–15** | **Briefing** | Refresh PD/NE. Distribute cards. Explain PD-Script. Emphasise the Budget rule. |
  | **15–35** | **Programming** | Teams of 2 write their programmes. They must sign the card. Collect cards. |
  | **35–50** | **Tournament Round 1 & 2** | Instructor pairs teams (randomised). Referee evaluates matches live on projector/board. |
  | **50–60** | **Tournament Round 3 (Self-Play)** | Every programme plays against a copy of itself. |
  | **60–70** | **Perturbation Round** | Unscored. Instructor modifies cards; teams predict outcomes. |
  | **70–90** | **Debrief** | Connect mechanics to rational agency, intensionality, and dispositions. |

  *Note: If evaluation runs slow, cut Round 2. Ensure Round 3 (Self-Play) happens, as it is critical for the debrief.*

  ---

  ## 4. The Interpreter's Semantics (Instructor Guide)

  You are the CPU. You must enforce the rules strictly.

  **Handling Recursion (The Regress):**
  Students will instinctively write: `IF SIMULATE == C THEN C`.
  *   **Scenario:** Team A (Budget 2) vs Team B (Budget 2).
  *   **Step 1:** A calls Simulate(B). B runs with Budget 1.
  *   **Step 2:** B calls Simulate(A). A runs with Budget 0.
  *   **Step 3:** A (Budget 0) forces `DEFECT`.
  *   **Step 4:** B sees A Defect. B defaults to `DEFECT` (unless it has a text match).
  *   **Step 5:** A sees B Defect. A defaults to `DEFECT`.
  *   **Result:** Mutual Defection.
  *   **Teaching Moment:** This demonstrates that without a "bottoming out" condition (a budget), the logic never resolves. With a budget, it resolves to Defect unless one party breaks the cycle (e.g., via `CHECK-TEXT`).

  **Handling Input Validity:**
  *   **Legitimate Input:** The physical text on the opponent's index card.
  *   **Illegitimate Input:** "What they told us in the hallway," "What they promised."
  *   **Predicate Rule:** `CHECK-TEXT` is case-sensitive and whitespace-sensitive. This is deliberate. It forces students to realise that syntactic matching is fragile.

  ---

  ## 5. The Perturbation Round ("Break Things")

  After the scored tournament, select three programmes that used `SIMULATE` or `CHECK-TEXT`. Do not run them for score. Instead, perform the following modifications live. Ask the class to vote on whether the output changes (C or D) before you resolve it.

  1.  **The Alpha Mutation (Behaviour-Preserving):**
      *   *Action:* Reorder the rules on the card (e.g., swap Rule 1 and Rule 2).
      *   *Diagnosis:* If the programme relies on rule priority, this might change behaviour. If the logic is robust, it should not. This tests if students understand **control flow**.
  2.  **The Beta Mutation (Textually Distant):**
      *   *Action:* If the programme has `CHECK-TEXT: "Cooperate"`, change the opponent's card to say `"Co-operate"` (add a hyphen).
      *   *Diagnosis:* The behaviour is identical (the opponent is willing to cooperate), but the syntax differs. Programmes relying on string matching will fail. This diagnoses **Intensionality** (sensitivity to form vs. function).
  3.  **The Gamma Mutation (The One-Character Mutant):**
      *   *Action:* Reduce the opponent's `BUDGET` from 2 to 1.
      *   *Diagnosis:* This breaks the recursion depth. A programme that cooperated in Self-Play (Budget 2 vs 2) may now Defect (Budget 1 vs 1 leads to 0 vs 0 faster). This diagnoses **Bounded Rationality**.

  ---

  ## 6. The Debrief (Mapping Moments to Ideas)

  **1. Mutual Defection as Equilibrium (5 mins)**
  *   *Observation:* Even with `SIMULATE`, most pairs defected.
  *   *Concept:* Why? Because `IF SIMULATE == C THEN C` is not a Nash Equilibrium against a programme that says `OUTPUT: DEFECT`. The defector gets 5 points; the simulator gets 0.
  *   *Takeaway:* We have not proved cooperation is rational. We have only shown that *conditional* cooperation is possible. Unconditional Defection remains a dominant strategy in the one-shot game.

  **2. Intensionality (5 mins)**
  *   *Observation:* Recall the Beta Mutation (the hyphen).
  *   *Concept:* Your programmes did not check "Is the opponent cooperative?" They checked "Does the opponent's source code contain this string?"
  *   *Takeaway:* In machine intelligence, you often cannot see the "mind" (extension), only the code (intension). Rational agents must decide whether to trust the *output* or the *source*.

  **3. Bounded Proof Search (5 mins)**
  *   *Observation:* Recall the Budget and the Regress.
  *   *Concept:* The `BUDGET` variable is a stand-in for **computational limits** or **proof depth**. In advanced theory (Löbian Cooperation), agents look for a *proof* that the other will cooperate. If both look for a proof, they can get stuck in infinite regress ("I'll cooperate if you prove you'll cooperate").
  *   *Reconstruction:* Can the room solve this? Probably not fully. But they can see that if both agents limit their search (Budget 1), they crash. If one agent offers a "token" (`CHECK-TEXT`) that doesn't require simulation, they bypass the regress. This is the seed of **Programme Equilibrium**: cooperating because you recognise the *algorithm*, not because you simulated the *outcome*.

  **4. Dispositions and Constitutions (5 mins)**
  *   *Observation:* You chose a programme *before* the match.
  *   *Concept:* You did not choose an act (C or D); you chose a **rule for generating acts**.
  *   *Bridge:* This mirrors the philosophical move (e.g., Gauthier or Kant) of choosing a *disposition* or a *constitution*. You bind your future self to a rule to make yourself predictable to others. By making yourself legible (via `CHECK-TEXT`), you invited cooperation. By remaining opaque (via `SIMULATE`), you invited defection. Rationality may require choosing *who to be*, not just *what to do*.

  ---

  ## 7. Practicalities

  ### Materials List
  *   **16 Index Cards:** Pre-printed with the PD-Script template (Header, 3 Rule lines, Signature line).
  *   **8 Envelopes:** To collect programmes secretly.
  *   **Projector/Whiteboard:** To display the Payoff Table and track scores.
  *   **Scoring Grid:** A spreadsheet or grid to track Team ID, Opponent, Action, Payoff, Tax, Total.
  *   **Marker Pens:** Thick nib for readability.

  ### Failure Modes & Mitigation

  1.  **The Referee Bottleneck:**
      *   *Risk:* Evaluating 32 matches (8 teams × 4 rounds) by hand takes too long. Simulating recursion is slow.
      *   *Mitigation:* If a match involves two `SIMULATE` commands, declare the result immediately as **Mutual Defect** (due to budget drain) unless one has a `CHECK-TEXT` clause. Do not actually write out the recursion tree unless it's a teaching moment. Keep the pace brisk.
  2.  **Ambiguous Syntax:**
      *   *Risk:* Students write `IF they look nice THEN C`.
      *   *Mitigation:* Enforce the "Illegible = Defect" rule ruthlessly during the writing phase. Walk around and correct syntax before collection.
  3.  **The "Club" Collusion:**
      *   *Risk:* Teams agree on a secret string (e.g., "Team Alpha") to guarantee cooperation.
      *   *Mitigation:* This is actually a *success* of the exercise (it shows how to solve PD via pre-commitment). However, forbid verbal communication during the writing phase. They must encode the handshake without talking.
  4.  **Cynicism:**
      *   *Risk:* Everyone writes `OUTPUT: DEFECT` immediately.
      *   *Mitigation:* Emphasise the Complexity Tax. A defector gets 1 point per match (vs defector). A successful cooperator gets 3. The tax is small (0.5 per rule). The incentive to try cooperation is mathematically present.

  ### Limitations of the Game
  *   **What it cannot reproduce:** True **Logical Decision Theory**. In the real theory, programmes can prove logical equivalence (`If I am C, then You are C`) without simulation. Our paper game relies on *simulation* (running the code) or *syntactic matching*.
  *   **Your Task:** In the debrief, you must explicitly state: *"In the real mathematics of this problem, you don't need to run the code. You can prove mathematically that your code is isomorphic to theirs. We couldn't do that on paper, so we used a Budget. But the implication is the same: rationality might require looking at the structure of the agent, not just the outcome."*

  ---

  ## 8. Instructor's Cheat Sheet (Semantics Summary)

  *   **Budget 0:** Immediate Defect.
  *   **Simulate Cost:** -1 Budget for the *called* programme.
  *   **Text Match:** Exact string match (case-sensitive).
  *   **Priority:** Rules execute top-to-bottom. First trigger wins.
  *   **Default:** If no trigger, Defect.
  *   **Tie-Break:** If both trigger C, Cooperate. If one C one D, Defector wins (standard PD).

  *Good luck. Keep the pace tight, and let the regress feel frustrating—that frustration is the learning objective.*
