prompt: |-
  I own privacy review at a company of about two hundred people that ships a consumer app in which users keep a structured daily journal — mood, sleep, symptoms, free text — and get predictions and nudges back. Every feature that touches user data comes through me: roughly six reviews a month, about forty-five minutes each, and the output has to be a single page — go, no, or go with conditions — that a product lead with no philosophy and no legal training can read, argue with, and sign. When I am away a junior PM runs them, so the procedure cannot depend on my having internalized the theory. Outside counsel handles compliance and is, for my purposes, useless: the answer to everything is get consent, and we have already watched our consent flow get optimized by onboarding copy until the number stopped meaning anything.

  Our reviews have settled into three failure modes I want a procedure to break. Anything described as on-device or anonymized is waved through; I think this is a cached thought rather than an argument. Anything else is argued about in the vocabulary of creepiness, which means reviewers pattern-matching to an affect and then rationalizing, and which reliably misranks the cases. And because we cannot say what the thing we are protecting actually is, the conditions we attach are arbitrary and unenforceable six months later.

  So: give me a decision procedure, grounded in what is actually known about the nature and value of privacy, that my team can run on a proposal. I want the ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the remaining question is one of values, and what to do at each step when the number you want cannot be had — we cannot estimate re-identification probabilities, we cannot elicit users' true preferences, and I would rather have a rule that says guess conservatively here and flags itself than one that pretends to precision. Please also state plainly which account of privacy's value the procedure is buying — a control account, an access account, a contextual-integrity account, something consequentialist about downstream harm — and what that choice costs us, because I expect the thresholds to move with it and I want to know which of our past decisions we would have to revisit under a different one.

  Several distinctions I insist survive simplification, because they are where our arguments actually stall.

  First, privacy is not one thing. Being unobserved, being unknown, being unnoticed or unaddressed, and retaining control over downstream use come apart constantly in our feature queue, and a proposal is often fine on two and bad on two. The procedure should score them separately rather than producing one number.

  Second, some of the data is about people who never signed up: a partner named in a journal entry, contacts uploaded for matching, a location trace that reveals a household. Our current framing has no way to represent them at all.

  Third, I have become convinced that the interesting cases are ones where no proposition about anyone is transmitted but the system nonetheless gets better at predicting them — the update lives in the weights, not in a sentence. I have been calling this prediction leakage, and I want the procedure to have a slot for it, including guidance for when there is no fact of the matter about what was learned. Relatedly, tell me whether it is a distinct harm to be confidently misfiled — a model that is wrong about you at high confidence and acts on it — or whether the procedure should treat accuracy and confidence as separate axes.

  Fourth, deferred identifiability: data released harmlessly today becomes identifying when some future corpus arrives, and I have no idea how to discount that or whether discounting it is even coherent.

  Fifth, magnitude should be audience-relative and measured in decision-change — how much does this alter what some actor will decide about this person — rather than in the sensitivity of the content. I would like that made operational, and I would like you to say what it does to cases where the harm is to a group and does not decompose into harms to identifiable individuals.

  Sixth, the reverse direction: a procedure about user privacy can be quietly used to deny users access to what the system believes about them. I want a transparency-to-the-subject requirement baked in, and I want the tension with model secrecy named rather than solved.

  Seventh, consent. I want a hypothetical-consent step — would this user refuse if they understood the inference and its downstream uses — even though I can see it is paternalistic, and I want it flagged as a values judgment rather than dressed up as a finding.

  Finally, someone always argues that the data in question is exactly what we would need to audit ourselves for bias or abuse, and that privacy talk here is a shield for the powerful. If the procedure has a carve-out for that, specify it narrowly; if it does not, say so and say what we are refusing to do.

  Then run it on three proposals from our actual backlog.

  One: a risk flag computed entirely on-device from typing dynamics and journal sentiment, where only a single bit — high-risk week, yes or no — is written to our servers and used to surface a support resource. No raw text leaves the phone. My team wants to wave this through.

  Two: support-network suggestions derived from contact-graph and location overlap, shown only to the user, naming people who may be in a similar situation. Nobody outside sees it; the issue is inference about non-users.

  Three: a quiet check-in feature for users at risk of harm, which shares a risk signal with a trusted contact the user nominates. This is the one I care about and the one I expect you to kill, and I want to know whether that no is a real no or an artifact of where the procedure is conservative — and if it is real, what the cheapest change to the feature is that flips it.

  Also tell me what the procedure cannot do: which of our recurring arguments it will not settle, where a human must simply decide, which distinctions you dropped to make it runnable and what we lose by dropping them, and how it will misfire if someone starts optimizing against it instead of using it. And tell me what to do when users enthusiastically want a feature the procedure scores as a large loss — whether the procedure defers to that or vetoes it, and on what authority. I do not want citations or further reading; I cannot chase references from here, and a bibliography would be useless to me even if I could.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Privacy Review Lead at a ~200 person consumer app company (structured daily journal: mood, sleep, symptoms, text).
      *   **Task:** Create a decision procedure for privacy reviews (6/month, 45 mins each, 1-page output: Go/No/Go w/ Conditions).
      *   **Audience:** Product Leads (no philosophy/legal training), Junior PMs (when Lead is away).
      *   **Current Problems:** "On-device/Anonymized" waved through without thought; "Creepiness" arguments are subjective/unreliable; Conditions are arbitrary/unenforceable; Outside counsel is useless ("get consent").
      *   **Specific Constraints/Requirements:**
          *   Grounded in a specific account of privacy's value (state which one and the cost).
          *   Ordered questions with sufficient answers.
          *   Stop conditions (No) vs. Value Judgment handoffs.
          *   Handle uncertainty conservatively (guess conservatively, flag it).
          *   **Seven Specific Distinctions to Preserve:**
              1.  Privacy is multidimensional (unobserved, unknown, unnoticed, control). Score separately.
              2.  Non-users (partners, contacts, location traces).
              3.  Prediction Leakage (weights update, no proposition transmitted) & Confident Misfiling.
              4.  Deferred Identifiability (future corpus risk).
              5.  Magnitude = Decision-Change (audience-relative), including group harm.
              6.  Transparency-to-Subject (vs. model secrecy).
              7.  Hypothetical Consent (paternalistic flag).
              8.  Audit/Bias Carve-out (narrow or explicit refusal).
          *   **Test Cases:** Run on three specific backlog proposals (On-device risk bit, Contact-graph suggestions, Trusted contact risk share).
          *   **Limitations:** What the procedure *cannot* do, where humans must decide, dropped distinctions, gaming risks, handling enthusiastic user demand vs. procedure veto.
          *   **Format:** No citations/bibliography. Practical, operational.

  2.  **Determine the Philosophical Foundation:**

      *   *Options:* Control (Nissenbaum/Privacy as Control), Access (Intrusion), Contextual Integrity (Norms), Consequentialist (Harm).
      *   *Selection:* **Contextual Integrity (CI) modified with Consequentialist Harm.**
      *   *Why?* Pure Control fails because users click "agree" without understanding (as noted by the user). Pure Consequentialism fails because harm is hard to estimate (re-id probabilities unknown). CI fits the "journal" context well (norms of health data vs. social data). However, CI needs teeth regarding *harm*, so I will anchor the "magnitude" in decision-change (Consequentialist).
      *   *The "Cost":* This framework assumes privacy violations occur when information flows violate context-relative norms *or* enable significant decision-changes against the subject's interest. It costs us speed and simplicity. It requires us to define "context" explicitly. It means some "useful" features die because they violate norms even if users say "yes."

  3.  **Drafting the Procedure (The "Privacy Impact Matrix"):**

      *   Need to structure it so a Junior PM can run it.
      *   Needs to address the 7 distinctions.
      *   Needs to produce a Go/No/Condition output.

      *   *Step 1: Data & Subject Mapping.* (Addresses Distinction 2: Non-users).
      *   *Step 2: Flow & Visibility.* (Addresses Distinction 1: Unobserved/Unknown).
      *   *Step 3: Inference & Prediction.* (Addresses Distinction 3: Prediction Leakage/Misfiling).
      *   *Step 4: Temporal Risk.* (Addresses Distinction 4: Deferred Identifiability).
      *   *Step 5: Decision-Change Magnitude.* (Addresses Distinction 5: Audience/Harm).
      *   *Step 6: Transparency & Consent.* (Addresses Distinction 6 & 7).
      *   *Step 7: Audit Carve-out.* (Addresses Distinction 8).

  4.  **Refining the Steps (incorporating "Conservative Guessing"):**

      *   Instead of probabilities, use "Bands" (Low/Med/High/Unknown).
      *   "Unknown" defaults to "High" for risk.
      *   Need a scoring mechanism that isn't a single number (per Distinction 1). Let's use a Dashboard approach: 4 Dimensions. If any dimension is Red, it's a No or Heavy Condition.

  5.  **Addressing the Test Cases:**

      *   *Case 1 (On-device risk bit):* Looks safe, but "Prediction Leakage" and "Decision Change" (insurance/employer if leaked?) need checking. The "Bit" is still data.
      *   *Case 2 (Contact suggestions):* Non-user data is the killer here. Inference about non-users' mental state based on overlap.
      *   *Case 3 (Trusted Contact):* High stakes. If the model is wrong (Confident Misfiling), it alarms a friend. Transparency issues.

  6.  **Addressing the "What it cannot do" section:**

      *   It won't solve value conflicts (e.g., Safety vs. Privacy).
      *   It won't stop gaming if metrics become targets.
      *   It drops the distinction between "malicious" and "benign" intent (focus on outcome).
      *   User Enthusiasm: The procedure must veto if the *structural* risk is high, even if users want it (Paternalism flag).

  7.  **Iterative Polishing (Self-Correction during drafting):**

      *   *Critique:* Is this too complex for a 45-minute review?
      *   *Fix:* Simplify the language. Use "Stop/Go" checkpoints. Make the "Conservative Guess" rule explicit at the start.
      *   *Critique:* Did I handle the "Prediction Leakage" well enough?
      *   *Fix:* Ensure Step 3 explicitly asks about model weights updating based on sensitive data, even if no data leaves the device.
      *   *Critique:* The user wants to know *which account of privacy* I'm buying.
      *   *Fix:* Be explicit in the preamble. I'm choosing **Contextual Integrity + Decisional Harm**.
      *   *Critique:* The user wants to know what happens when users *want* the risky feature.
      *   *Fix:* Add a specific section on "The Veto Power."

  8.  **Final Review against Constraints:**

      *   No citations? Check.
      *   One page output style? Check (the procedure leads to this).
      *   All 7 distinctions addressed? Check.
      *   Three test cases run? Check.
      *   Limitations section? Check.

  9.  **Drafting the Content (Mental Outline):**

      *   **Preamble:** The Philosophical Bet (CI + Harm).
      *   **The Procedure:** 6 Steps.
      *   **Scoring:** The 4 Dimensions (Observation, Inference, Exposure, Control).
      *   **Test Cases:** Application of the steps.
      *   **Limitations & Governance:** What this doesn't solve.

  10. **Refining the "Decision-Change" Metric:**
      *   How to operationalize "how much does this alter what some actor will decide"?
      *   Use a "Counterfactual Test": If this data point were removed, would the outcome change?
      *   Audience: Who sees it? (Algorithm, Company, Third Party, Public).

  11. **Refining "Prediction Leakage":**
      *   If the model learns "depressed people type slower," and we update weights, have we leaked "depression"? Yes, functionally.
      *   Treatment: Treat model updates containing signal as data transmission.

  12. **Refining "Non-Users":**
      *   They cannot consent. Therefore, the threshold for using their data must be higher (Strict Necessity).

  13. **Refining "Audit Carve-out":**
      *   Allow only if data is hashed/locked and access is logged/limited to specific audit roles. No broad access.

  14. **Final Polish:** Ensure tone is professional, direct, and operational. No fluff.

  *(Self-Correction during final drafting)*: I need to make sure I explicitly answer the "User Enthusiasm" question. If users want it, but it fails the procedure, do we ship? The prompt asks "whether the procedure defers to that or vetoes it." Given the user's role (Privacy Lead), the procedure must support a Veto based on *structural* harm, not just individual preference, because individual preference is often manipulated (as noted in the prompt about consent flows). I will argue for a Veto with an Escalation path.

  Let's assemble the response.cw
answer: |-
  ## The Decision Procedure: Contextual Harm & Flow Matrix

  ### 1. The Philosophical Bet
  **Account:** **Contextual Integrity modified by Decisional Harm.**
  We are not protecting "secrecy" (Access Account) nor pure "choice" (Control Account). We are protecting the **norms of information flow** appropriate to a mental health journal, and preventing **material decision-changes** against the user's interest.

  **The Cost:**
  1.  **Speed:** We cannot ship features that violate contextual norms even if users "consent." We are paternalistic about structural risk.
  2.  **Revisiting Past Decisions:** Any feature shipped purely on "Consent" (e.g., broad data sharing for "personalization") must be re-evaluated. If the flow violates the journal context (e.g., sharing mood data with ad-tech), it is a violation regardless of the checkbox.
  3.  **Uncertainty:** We treat "Unknown" as "High Risk." We will kill features because we *cannot prove* safety, not because we *proved* harm.

  ### 2. Pre-Flight Rules (The Conservative Guess)
  Before starting the steps, apply these rules to all unknowns:
  *   **Re-identification:** If you cannot estimate the probability, assume **100% eventual re-identification** for high-sensitivity data (health, mood, location).
  *   **User Preference:** If you cannot elicit true preference, assume **Refusal** for high-stakes inferences.
  *   **Model Knowledge:** If the model updates weights based on sensitive data, assume the **signal is extracted** even if raw data stays on-device.

  ---

  ### 3. The Procedure (6 Steps)

  **Output:** A 2x2 Matrix (Observation, Inference, Exposure, Control) scored Low/Med/High/Unknown.
  **Decision:**
  *   **Any "High"** = **NO** (unless mitigated to Med).
  *   **Any "Unknown"** = **NO** (until resolved or conservatively bounded).
  *   **All "Low/Med"** = **GO** (with standard conditions).
  *   **Value Conflict** = **ESCALATE** (to you/Lead).

  #### Step 1: Subject & Data Mapping (The "Who")
  *   **Question:** Whose data is touched? (User, Non-User Contact, Household, Bystander).
  *   **Question:** What is the raw input? (Text, Metadata, Timing, Network).
  *   **Sufficient Answer:** A list of all data subjects. Non-users must be explicitly listed.
  *   **Stop Condition:** If Non-User data is used for *inference about the Non-User* (e.g., diagnosing a partner), **STOP (NO)**. Non-users cannot consent; their data may only be used instrumentally to serve the User (e.g., routing a message), not to profile them.
  *   **Handling Missing Numbers:** If you don't know how many non-users are affected, assume **All Contacts**.

  #### Step 2: Flow & Observation (The "Where")
  *   **Question:** Where does the data reside? (Device, Server, Third Party).
  *   **Question:** Who observes the raw data? (Algorithm, Support Staff, External Vendor).
  *   **Sufficient Answer:** A data flow diagram. "On-device" is not a pass; it is a location.
  *   **Stop Condition:** If raw sensitive text leaves the device without encryption that *you* hold the keys to, **STOP (NO)**.
  *   **Handling Missing Numbers:** If you cannot verify the vendor's deletion policy, assume **Permanent Retention**.

  #### Step 3: Inference & Prediction Leakage (The "What is Learned")
  *   **Question:** Does the model update weights based on this data?
  *   **Question:** Does the system become better at predicting a sensitive trait (mood, risk, diagnosis) for *anyone* (User or Non-User)?
  *   **Question:** Is the prediction high-confidence?
  *   **Sufficient Answer:** Statement of what the model knows *after* that it didn't know *before*.
  *   **Stop Condition:** If the system learns a sensitive trait about a Non-User (via graph overlap) and stores that trait, **STOP (NO)**.
  *   **Confident Misfiling:** Treat **High Confidence + Wrong** as a distinct harm. If the feature acts on a prediction (e.g., alerts a contact) and the false-positive rate is >5%, **STOP (NO)**. Accuracy and Confidence are not separate; High Confidence Wrong is worse than Low Confidence Right.
  *   **Handling Missing Numbers:** If you cannot measure the false-positive rate on at-risk populations, assume **20%**.

  #### Step 4: Temporal Risk (The "When")
  *   **Question:** Does this data become more identifying if combined with future public corpora?
  *   **Question:** Is the data retained indefinitely?
  *   **Sufficient Answer:** A retention schedule and a "Future Corpus" check (e.g., "If a public journal dataset is released in 2026, can this be linked?").
  *   **Stop Condition:** If data is retained indefinitely and is unique (stylometry, specific symptom combos), **STOP (NO)** unless there is a hard deletion trigger.
  *   **Handling Missing Numbers:** Assume **Future Linkage is Possible**. Do not discount deferred identifiability.

  #### Step 5: Decision-Change Magnitude (The "So What")
  *   **Question:** Who sees the output? (User, Company, Insurer, Employer, Friend).
  *   **Question:** What decision can that actor make that they couldn't make before?
  *   **Question:** Does this decision harm the subject or a group they belong to?
  *   **Sufficient Answer:** "Actor X can now decide Y." (e.g., "Insurer can decide to raise rates," "Friend can decide to intervene").
  *   **Magnitude Scale:**
      *   **Low:** User sees their own data (Self-decision).
      *   **Med:** Company uses data to improve product (Internal decision).
      *   **High:** External actor or Trusted Contact makes life-impact decision (Safety, Financial, Social).
  *   **Group Harm:** If the feature degrades service for a demographic (e.g., risk model fails for specific dialects), count as **High Magnitude**.
  *   **Stop Condition:** If Magnitude is **High** and the subject (or affected non-user) cannot override the decision, **STOP (NO)**.

  #### Step 6: Transparency, Consent & Audit (The "Rights")
  *   **Question:** Can the user see what the system believes about them?
  *   **Question:** If we asked the user "Do you want us to infer X and share it with Y?" knowing the risks, would they agree? (Hypothetical Consent).
  *   **Question:** Is this data needed for Bias/Safety Audit?
  *   **Sufficient Answer:** Yes/No on Transparency. Yes/No on Hypothetical Consent.
  *   **Audit Carve-out:** Data may be retained for audit **ONLY IF**: (1) It is access-logged, (2) Access requires dual-authorization, (3) It is deleted after the audit window. If the proposal asks for broad access to "check for bias," **STOP (NO)**. Narrow the access.
  *   **Transparency Tension:** If revealing the model logic compromises security (e.g., allows gaming the risk score), you must disclose the *existence* of the inference and the *consequence*, even if the *weights* are secret.
  *   **Stop Condition:** If Hypothetical Consent is **No** (Paternalistic Veto), **ESCALATE**. Do not ship.

  ---

  ### 4. Running the Backlog

  #### Proposal 1: On-Device Risk Flag (Typing + Sentiment -> 1 Bit)
  *   **Step 1 (Subject):** User only. (Pass)
  *   **Step 2 (Flow):** Raw data on-device. 1 Bit to server. (Pass)
  *   **Step 3 (Inference):** **Prediction Leakage.** The model updates locally. The server receives a signal ("High Risk"). This is a sensitive trait transmission. (Risk: Med/High).
  *   **Step 4 (Temporal):** The "High Risk" bit is stored indefinitely? If yes, it creates a permanent record of mental health crises. (Risk: High).
  *   **Step 5 (Magnitude):** Company sees the bit. Can they decide to ban the user? Increase insurance premiums if subpoenaed? (Risk: Med).
  *   **Step 6 (Transparency):** Does the user know the bit is sent? Usually no. (Risk: High).
  *   **Verdict:** **GO WITH CONDITIONS.**
      *   *Condition 1:* The bit must expire (e.g., deleted after 7 days).
      *   *Condition 2:* User must be explicitly notified that a "Risk Signal" is generated and transmitted, distinct from the journal content.
      *   *Condition 3:* The bit cannot be used for anything other than surfacing the support resource (no marketing, no model training on the bit itself).
  *   **Why not No?** The decision-change is limited (surfacing a resource) and the data minimization (1 bit) is strong. The risk is the *permanence* of the signal.

  #### Proposal 2: Support Network Suggestions (Contact Graph + Location)
  *   **Step 1 (Subject):** User + **Non-Users** (Contacts). (Risk: High).
  *   **Step 2 (Flow):** Contact list uploaded. (Risk: Med).
  *   **Step 3 (Inference):** **Prediction Leakage.** If User A and User B overlap in location and time, and User A logs "Depression," does the model infer User B is "Caregiver" or "Also Depressed"? If the system suggests B to A because B is "similar situation," you are inferring B's health status. (Risk: High).
  *   **Step 4 (Temporal):** Graph data is highly identifying over time. (Risk: High).
  *   **Step 5 (Magnitude):** Social harm. Outing a non-user's condition or association. (Risk: High).
  *   **Step 6 (Consent):** Non-users cannot consent. Hypothetical consent for health inference is likely **No**.
  *   **Verdict:** **NO.**
      *   *Reason:* Violates Non-User protection. You are inferring health status of non-consenting parties to make suggestions.
      *   *Cheapest Fix:* Only suggest contacts who are **already users** and have explicitly opted into "Discovery." Do not use location overlap to infer health similarity.

  #### Proposal 3: Trusted Contact Check-In (Risk Signal -> Friend)
  *   **Step 1 (Subject):** User + Trusted Contact (User). (Pass).
  *   **Step 2 (Flow):** Risk signal to Friend. (Risk: Med).
  *   **Step 3 (Inference):** **Confident Misfiling.** If the model is wrong (False Positive), you are telling a friend the user is at risk when they are not. This causes social friction, stigma, or unwanted intervention. (Risk: High).
  *   **Step 4 (Temporal):** Friend now knows a crisis happened. (Risk: Med).
  *   **Step 5 (Magnitude):** **High.** Friend decides to call police, show up at house, etc.
  *   **Step 6 (Transparency/Consent):** User nominates contact (Consent: Yes). But can the user *stop* the alert if they disagree with the risk assessment? (Control: No).
  *   **Verdict:** **NO (Real No).**
      *   *Reason:* The combination of **High Magnitude Decision** (Friend intervention) + **Confident Misfiling Risk** + **Lack of User Override**. You are automating social intervention based on a probabilistic model.
      *   *Cheapest Change to Flip:* **User-in-the-Loop.** The system prompts the *User*: "We think you are at risk. Do you want to share this with [Contact]?" The User must press "Send."
      *   *Why this flips it:* It moves the Decision-Change authority back to the Subject. It mitigates the False Positive harm (User knows they aren't at risk and won't send). It respects Hypothetical Consent (User decides in the moment).

  ---

  ### 5. Limitations & Governance

  **What This Procedure Cannot Do:**
  1.  **Resolve Value Conflicts:** If Safety (preventing suicide) structurally conflicts with Privacy (preventing data leakage), this procedure flags the conflict (Step 5 vs Step 6) but does not solve it. That is an executive decision.
  2.  **Stop Malicious Insiders:** It assumes the company acts in good faith. It does not prevent a rogue engineer from exfiltrating data if they have access.
  3.  **Predict Regulatory Shifts:** It is based on ethical norms, not current law. GDPR might change tomorrow; this procedure remains stable, which is good, but may require legal overlay.

  **Where a Human Must Decide:**
  *   **The Paternalistic Veto:** When Step 6 (Hypothetical Consent) says "No" but Product says "Users want this." You (the Lead) must decide if the user's desire is informed or manipulated. The procedure flags it; you pull the trigger.
  *   **Group Harm vs. Individual Utility:** If a feature helps 99% of users but severely misfiles the 1% (e.g., a marginalized group), the "Decision-Change" metric might average out. You must manually weigh the minority harm.

  **Distinctions Dropped:**
  *   **Intent:** We do not care if the team *means* well. We care about the flow and the risk.
  *   **PII vs. Non-PII:** We dropped this legal distinction. In this procedure, "Inferred Trait" is treated as sensitive as "Name."

  **Gaming the Procedure:**
  *   **Risk:** Teams will try to categorize data as "Instrumental" (Step 1) to avoid "Inference" (Step 3).
  *   **Mitigation:** You audit the *output*, not the input description. If the feature behaves like profiling, it is profiling.
  *   **Risk:** Teams will claim "Audit Necessity" to hoard data.
  *   **Mitigation:** Enforce the Dual-Authorization rule strictly. If they complain it's too hard, they weren't serious about the audit.

  **User Enthusiasm vs. Procedure Veto:**
  *   **Scenario:** Users demand a feature that scores "High Risk" on Decision-Change (e.g., "Publicly share my mood map").
  *   **Rule:** **The Procedure Vetoes.**
  *   **Authority:** Privacy is a structural constraint, not a user preference setting. Users cannot consent to structural harm that affects the ecosystem (e.g., normalizing health surveillance) or creates irreversible risk (deferred identifiability).
  *   **Action:** Escalate to CEO. If shipped against the Veto, it must be documented as a **Company Risk Acceptance**, not a Privacy Approval. You sign "Not Approved," they sign "Overruled." This preserves your audit trail and forces leadership to own the liability.

  ### 6. Implementation Note for the Junior PM
  When you run this, do not argue philosophy. Argue the Matrix.
  *   Don't say: "This feels creepy."
  *   Say: "Step 3 is High Risk because the model infers health status on non-users. Step 5 is High Magnitude because it alters social decisions. Until we mitigate these to Med, the procedure outputs NO."

  This makes the review about **filling the boxes**, not **winning a debate**.
