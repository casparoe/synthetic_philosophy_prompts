  ### Limitations and Inseparable Pairs

  *   **Leaves 7 (Sophisticated Causal) and 8 (Resolute Choice):** The tree separates these by the "Pre-commitment" question (Q6). However, in practice, a sophisticated causal agent might argue pre-commitment is *implied* by rationality, while a resolute chooser might argue the act is *ratifiable*. The distinction relies on whether the agent views the binding cost as a *requirement* for rationality or a *consequence* of it. This branch may misclassify agents who hold hybrid views on disposition vs. act.
  *   **Leaves 11 (Algorithmic) and 12 (Updateless):** Both rely on "Same Computation." The split depends on whether the agent views the rationality of the act as intrinsic to the moment (TDT) or derivative of a prior policy selection (UDT). Some proponents of TDT argue pre-commitment is "required" in a counterfactual sense, which could push them into Leaf 12 erroneously.

