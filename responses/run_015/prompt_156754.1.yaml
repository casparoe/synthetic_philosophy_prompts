  ### The Newcomb Diagnostic Tree

  This instrument sorts agents by their underlying metaphysical and decision-theoretic commitments rather than their surface choices. It consists of seven branch questions. Answer them in order.

  **Q1 (Metaphysics):** Given your understanding of causation and free will, is the scenario as described (a perfect predictor who has already acted) metaphysically coherent?
  **Q2 (Causal Structure):** Do you believe your current choice exerts a physical causal influence backward in time to determine the predictor's past action?
  **Q3 (Simulation Variant):** In the case where the prediction is generated by an exact simulation of you: Is the correlation between your choice and the prediction best explained as two distinct events with a common cause, or as the same logical computation instantiated twice?
  **Q4 (Copy Variant):** In the case where you might be the original or the simulation (and the simulation's payout matches the original's): Do you maximize the expected payoff for your specific token instance, or for the output of the decision algorithm across all instances?
  **Q5 (Open-Prediction Variant):** In the case where the prediction is revealed to you before you choose: Is your rational goal to confirm the prediction you see, or to maximize your payoff given the prediction is now fixed evidence?
  **Q6 (Pre-commitment):** Regarding the standard case: Is it rationally *required* to pay a cost in advance to bind yourself to One-boxing, or would such a payment be merely lucky/unnecessary?
  **Q7 (Object of Evaluation):** Is the primary object of rational evaluation the specific token action you perform now, or the decision procedure/type you instantiate?

  ---

  ### The Leaves (12 Total)

  **1. [Exit] The Case is Impossible.**
  *   *Path:* Q1 = Incoherent.
  *   *Diagnosis:* The agent rejects the possibility of a perfect predictor coexisting with free deliberation (e.g., incompatibilist free will). No verdict yielded.

  **2. [Empty] Retrocausal One-Boxing.**
  *   *Path:* Q1 = Coherent, Q2 = Yes.
  *   *Diagnosis:* **Incoherent.** Posits physical backward causation without a mechanism; violates standard causal models assumed in the problem.

  **3. [Empty] Token-Maximizing Algorithmic.**
  *   *Path:* Q3 = Same Computation, Q4 = Token Instance.
  *   *Diagnosis:* **Incoherent.** If the computation is identical, the outputs must be identical; maximizing for the token while acknowledging logical identity is contradictory.

  **4. [Empty] Pre-committing Two-Boxer.**
  *   *Path:* Q3 = Common Cause, Q5 = Exploit, Q6 = Required.
  *   *Diagnosis:* **Unattractive.** Paying to bind oneself to a policy one intends to violate (or believes is suboptimal) is pragmatically unstable.

  **5. Dominance-Style Causal Two-Boxing.**
  *   *Path:* Q3 = Common Cause, Q5 = Exploit, Q6 = Unnecessary, Q7 = Token.
  *   *Diagnosis:* Standard CDT. The box contents are fixed; causal dominance dictates taking both. Pre-commitment is unnecessary because Two-boxing is the rational act.

  **6. Evidential One-Boxing.**
  *   *Path:* Q3 = Common Cause, Q5 = Confirm, Q7 = Token.
  *   *Diagnosis:* Standard EDT. The act is evidence of the prediction; One-boxing provides better news, even without causal influence.

  **7. Sophisticated Causal One-Boxing.**
  *   *Path:* Q3 = Common Cause, Q5 = Confirm, Q6 = Unnecessary, Q7 = Procedure.
  *   *Diagnosis:* Ratifiability view. One-boxing is the only act that remains optimal when conditioned on the decision to perform it, without requiring prior binding.

  **8. Resolute-Choice One-Boxing.**
  *   *Path:* Q3 = Common Cause, Q5 = Confirm, Q6 = Required, Q7 = Procedure.
  *   *Diagnosis:* Resolute Choice. The token act may not be causally optimal, but rationality requires binding oneself to the disposition that yields the best outcome.

  **9. [Empty] Evidential Two-Boxing.**
  *   *Path:* Q3 = Common Cause, Q5 = Exploit, Q7 = Token (but Q6 = Required).
  *   *Diagnosis:* **Underexplored.** An evidentialist who Two-boxes contradicts the core EDT maxim; likely a confusion of terms.

  **10. [Empty] Dominance One-Boxing.**
  *   *Path:* Q3 = Common Cause, Q2 = No, Q5 = Exploit, Q6 = Unnecessary, Q7 = Token (but One-boxes).
  *   *Diagnosis:* **Incoherent.** Accepting causal independence and dominance reasoning but One-boxing without evidential or algorithmic justification.

  **11. Algorithmic (Timeless) One-Boxing.**
  *   *Path:* Q3 = Same Computation, Q4 = Algorithm, Q6 = Unnecessary.
  *   *Diagnosis:* TDT. The act is rational *now* because it logically determines the prediction via shared computation. Pre-commitment is implicit in the logic, not a separate requirement.

  **12. Updateless Algorithmic One-Boxing.**
  *   *Path:* Q3 = Same Computation, Q4 = Algorithm, Q6 = Required.
  *   *Diagnosis:* UDT. Rationality evaluates the policy chosen *before* the prediction. Pre-commitment is required because the token act is only rational relative to the optimal policy.

