answer: |-
  **Project Title:** The Compression Criterion: A Philosophical Examination of Structural Reduction in Macro-Historical Explanation

  **Project Summary**
  This six-month research project proposes a philosophical investigation into the underlying assumptions governing contemporary macro-history. Popular works such as Yuval Noah Harari's *Sapiens*, Jared Diamond's *Guns, Germs, and Steel*, and David Graeber and David Wengrow's *The Dawn of Everything* have sparked intense debate. Standard critiques typically focus on empirical inaccuracies, accusations of environmental or technological determinism, or the neglect of local agency. This project posits that these debates obscure a deeper, shared assumption: the 'compression criterion'. This is the implicit norm that a successful civilisational-scale explanation must reduce thousands of local events to a small set of structural drivers, and that this reduction possesses explanatory value independent of predictive utility. The project will interrogate whether this criterion is defensible and whether current historiographical objections target the criterion itself or merely its specific applications.

  **Research Question**
  The central research question is: *Is the 'compression criterion'—the assumption that macro-historical explanation requires reduction to a minimal set of structural drivers—philosophically defensible when distinguished from predictive utility, and do current critiques of macro-history inadvertently reinforce this criterion while disputing its content?*

  Subsidiary questions include:
  1.  Can the implicit rules of compression be formally reconstructed from representative macro-historical arguments?
  2.  Do these reconstructed explanations survive counterfactual perturbations, or do they collapse into ad hoc adjustment?
  3.  Is it possible to taxonomy compression types to separate defensible macro-explanation from narrative overreach?

  **Context and Philosophical Gap**
  Existing philosophical work on historical explanation has traditionally oscillated between nomological models, which seek general laws akin to the natural sciences, and narrative models, which emphasise the unique configuration of events. Contemporary philosophy of social science often focuses on mechanism-based explanations or the role of agency versus structure. However, neither tradition adequately addresses the specific *virtue of compression* itself. Philosophers rarely ask why reduction is considered explanatory *per se*, absent predictive success.

  Simultaneously, current historiographical debates remain trapped at the level of empirical contestation. Critics of Diamond argue his environmental determinism is factually wrong; critics of Harari argue his psychological generalisations are unfounded; proponents of Graeber and Wengrow argue for greater political diversity in the archaeological record. These are objections to the *content* of the compression, not the *form*. By accepting the premise that the goal of history is to find the 'right' structural drivers, both sides reinforce the compression criterion. This leaves a genuine conceptual gap: there is no rigorous account of whether large-scale historical reduction is a valid explanatory strategy independent of its empirical accuracy. This project fills that gap by shifting the focus from empirical verification to structural validity.

  **Methodology**
  The project will proceed as a conceptual analysis grounded in textual reconstruction, requiring no original archival research. The method consists of three phases:

  1.  **Reconstruction of Compression Rules:** I will select one central argument from each of the three representative texts (Harari, Diamond, and Graeber/Wengrow). For each, I will reconstruct the implicit 'compression rule' employed. This involves identifying the specific local variables that are discarded and the structural drivers that are retained to generate the explanation. The output will be a formalised schema for each argument, stating the conditions under which local detail is deemed explanatorily irrelevant.

  2.  **Counterfactual Perturbation:** Each reconstructed schema will be subjected to two counterfactual perturbations at different scales.
      *   *Micro-perturbation:* Altering specific local agents or events within the narrative to see if the structural driver still necessitates the outcome.
      *   *Macro-perturbation:* Altering the structural driver itself to see if the explanation absorbs the change or requires ad hoc adjustment to maintain the original conclusion.
      The goal is to test whether the explanation survives as a robust structural account or collapses into a post-hoc narrative fit.

  3.  **Evaluation and Taxonomy:** Based on the performance of each schema under perturbation, I will evaluate the defensibility of the compression criterion. I will attempt to construct a taxonomy of compression types, distinguishing between 'robust reduction' (where compression retains explanatory power) and 'narrative overreach' (where compression masks contingency).

  **Expected Outcomes and Success Criteria**
  A successful result will produce a clear taxonomy of compression types that allows philosophers and historians to distinguish between defensible macro-explanation and unjustified simplification. It would demonstrate that the compression criterion is not binary but admits of degrees, and that many current critiques are misdirected because they attack empirical details when they should be attacking the structural reduction itself. The final output will be a fifteen thousand-word philosophical essay suitable for publication in a journal specializing in the philosophy of history or social science.

  **Failure Conditions**
  The project will be deemed to have failed if the 'compression criterion' cannot be formalised clearly enough to test. If the implicit rules of reduction in the selected texts prove too vague or inconsistent to reconstruct into a working schema, the counterfactual testing phase will be impossible. Additionally, failure would result if the counterfactual perturbations prove trivial—that is, if every historical explanation can be made to survive any perturbation through sufficient ad hoc adjustment, rendering the test meaningless.

  **Scope and Feasibility**
  The project is designed to be completed within six months. The word count target of fifteen thousand words is achievable within this timeframe, averaging approximately two thousand five hundred words per month. As the project relies on published texts and conceptual analysis rather than archival research or data collection, the logistical burden is low. The reading load is confined to three primary texts and secondary philosophical literature on explanation, which is manageable alongside the writing process.

  **Risk Assessment**
  The single biggest danger that makes this project too ambitious for the timeframe is the risk of conceptual drift during the formalisation phase. Defining the 'compression criterion' with sufficient precision to allow for rigorous counterfactual testing is a difficult philosophical task. There is a significant risk that months one and two will be consumed by attempting to define the criterion without reaching a stable definition, leaving insufficient time for the reconstruction and testing phases. If the criterion remains elusive, the project may stall before reaching the substantive analysis of the texts. To mitigate this, the project will impose a strict deadline at the end of the second month to finalise the working definition of compression, even if imperfect, to ensure the testing phase proceeds.
