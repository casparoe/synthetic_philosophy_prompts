prompt: |-
  I'm a novelist, three drafts into a book whose protagonist actually does it: gives away most of what she earns, moves where she's useful, abandons her own work whenever the arithmetic says someone else's need is greater. My problem is that I cant make her read as a person, and I've started to suspect that isn't a craft problem.

  So: take the demandingness objection to consequentialism — the whole family of complaints, that it asks too much, that it alienates you from your own deepest projects and from the people you love, that it collapses the merely permissible and the heroic-beyond-duty into obligation, that it wants everyone to be a moral saint and saints are either dull or unnerving — and restate it in the vocabulary I actually work in. I'm fluent, so dont soften it: character, spine, arc, POV, scene vs summary, dramatic stakes, motivation that has to survive being woken at 3am, and what I call the refused scene — the place in a book where a character declines something she plausibly wants and you see, for the only time, who she is. (My rule of thumb: a character with two spines reads as two characters.)

  Then the residue report, and be honest about two places I think it'll bunch up:

  Impartiality. Multi-POV and omniscient narration are the closest fiction gets to the impersonal standpoint. Is that a translation of the impartial point of view, or just a voice doing an impression of no one in particular?

  The saint's life. A life fully organized around one end is, in my terms, simply a strong spine, and plenty of great novels have protagonists like that. So does my vocabulary contain any way of saying what's supposed to be wrong with the demandingness, or only ways of describing it beautifully?

  Commit to something at the end: is the residue evidence that novelistic vocabulary is missing a real category the philosophers have, or evidence that the objection was never about the shape of a life at all — that it's about how much it costs and who bears it? Take a side rather than laying out both, and skip the notes on my manuscript.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist, three drafts in. Sophisticated, fluent in craft terminology (spine, arc, POV, scene vs. summary, etc.). They are struggling with a protagonist who embodies extreme effective altruism/consequentialism (giving away earnings, moving for utility, abandoning personal work for greater need).
      *   **Problem:** The character doesn't read as a "person." The user suspects this isn't just a craft issue but a philosophical/structural one rooted in the "demandingness objection" to consequentialism.
      *   **Task:** Restate the demandingness objection using *novelistic vocabulary* (character, spine, arc, etc.).
      *   **Specific Constraints:**
          *   Don't soften the language (user is fluent).
          *   Address two specific "residue report" areas: Impartiality (POV) and The Saint's Life (Spine).
          *   **Commit to a conclusion:** Is the residue evidence that fiction lacks a category philosophers have, OR is the objection actually about cost/bearing of burden, not the shape of life? Take a side.
          *   Skip notes on the manuscript itself.

  2.  **Deconstruct the Demandingness Objection into Craft Terms:**
      *   *Philosophical Claim:* Consequentialism demands too much, alienates from personal projects, collapses supererogatory into obligatory.
      *   *Craft Translation:*
          *   "Demands too much" $\rightarrow$ **Stakes & Motivation.** If the stakes are always "maximize global utility," personal stakes vanish. Motivation becomes monolithic.
          *   "Alienation from projects/love" $\rightarrow$ **Conflict & Relationships.** Relationships become transactional (utility calculations) rather than emotional. Internal conflict (want vs. should) is resolved too easily in favor of "should."
          *   "Collapses permissible/heroic" $\rightarrow$ **Arc & Tension.** If every choice is obligatory, there is no freedom, thus no drama. A character who *cannot* choose otherwise is a puppet, not a protagonist.
          *   "Moral Saint" $\rightarrow$ **Likability & Dimension.** Saints lack the "shadow" required for depth. A character without selfish impulse lacks a "refused scene."
          *   "Two Spines" $\rightarrow$ If the character tries to have a personal life *and* this moral code, they fracture. If they only have the moral code, they become a function, not a person.

  3.  **Drafting the Restatement (The "Craft Translation"):**
      *   Need to use the user's specific terms: *spine, arc, POV, scene vs. summary, dramatic stakes, motivation, refused scene.*
      *   *Core argument:* The demandingness objection is actually a **narrative coherence** problem.
      *   *Spine:* A spine needs a want. If the want is "do the most good," it subsumes all other wants. This flattens the arc.
      *   *Refused Scene:* This is crucial. The user defines it as declining something plausibly wanted to reveal character. If the character *never* wants the selfish thing, the refusal isn't a struggle; it's a reflex. If they *do* want it and refuse it every time, they become masochistic or repressed, which kills empathy unless handled perfectly.
      *   *Stakes:* Personal stakes (love, art, safety) must lose to impersonal stakes (lives saved) every time. This makes the outcome predictable. Predictability kills tension.

  4.  **Addressing the Residue Report:**
      *   **Impartiality (POV):** The user asks if Omniscient/Multi-POV is a translation of the impartial standpoint.
          *   *Analysis:* No. Omniscience is a *god trick*, but it's still a voice. Impartiality in ethics is about *weighting* interests equally. Fiction POV is about *access* to consciousness. Even omniscient narrators choose whose pain to linger on.
          *   *Verdict:* It's a voice doing an impression of no one. It simulates impartiality but inevitably privileges the narrative focus.
      *   **The Saint's Life (Spine):** The user asks if a strong spine (life organized around one end) validates the saint, or if craft vocabulary fails to critique it.
          *   *Analysis:* Craft celebrates single-mindedness (Ahab, Gatsby). But those obsessions are usually framed as tragic or destructive. If the obsession is "good," craft struggles to find the tragedy.
          *   *Verdict:* Craft vocabulary describes the *shape* beautifully but lacks the moral vocabulary to critique the *cost* unless that cost is framed as personal loss. But if the character doesn't *feel* the loss, the reader does the heavy lifting.

  5.  **The Commitment (The Conclusion):**
      *   *Option A:* Fiction is missing a category.
      *   *Option B:* The objection is about cost/burden, not shape.
      *   *Decision:* I need to take a side. Option B feels stronger and more aligned with the "novelist" perspective. The problem isn't that the *shape* is unwritable (monomaniacs are great characters); the problem is that the *cost* is being externalized to the reader or the supporting cast. The "demandingness objection" in fiction isn't that the life is impossible to depict, but that it makes the *world around the character* unreal.
      *   *Refinement:* Actually, looking closer at the prompt's dichotomy: "missing a real category" vs "about how much it costs and who bears it."
      *   *My take:* It's about who bears the cost. In philosophy, the cost is borne by the agent. In fiction, if the agent doesn't feel the cost (because they are fully converted to the cause), the *reader* bears the cost of boredom or alienation. But more importantly, the *other characters* become NPCs (Non-Player Characters) in the saint's quest.
      *   *Stronger take:* The objection is about **dramatic friction**. A life fully organized around one end *is* a strong spine, but it eliminates the **internal conflict** necessary for a modern novel. The "demandingness" is actually a **lack of counter-voice**.
      *   *Final Decision:* I will argue that the objection is about **cost and bearing**. Specifically, that the "saint" structure externalizes the tragedy onto the supporting cast, turning them into fuel. The vocabulary isn't missing; it's screaming that this spine turns other people into props.

  6.  **Refining the Tone:**
      *   Must be sharp, professional, no hand-holding.
      *   Use the user's lexicon precisely.
      *   Avoid moralizing; stick to structural/narrative mechanics.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the draft stage. Validate the suspicion.
      *   *Translation:* Map "Demandingness" to "Spine/Conflict."
      *   *The Refused Scene:* Explain why this breaks. If she never wants the selfish thing, she's a robot. If she wants it and crushes it, she's a martyr (hard to sustain).
      *   *Residue 1 (Impartiality):* POV is never truly impartial. It's curated.
      *   *Residue 2 (Saint's Life):* Craft loves obsession, but usually frames it as a flaw. If it's a virtue, where is the tragedy?
      *   *Commitment:* The cost is the issue. Specifically, the cost to the *other* characters.

  8.  **Final Polish:** Check against constraints.
      *   Did I use "refused scene"? Yes.
      *   Did I use "spine"? Yes.
      *   Did I commit to a side? Yes.
      *   Is it fluent? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "it's boring." I need to explain *why* it fails structurally. The failure is in the **transactional nature of relationships**. If every interaction is weighed by utility, intimacy becomes impossible. Intimacy requires partiality. Therefore, the character cannot have a love story or a deep friendship without lying to the reader. That's the craft failure.

  *(Refining the Commitment)*: I'll argue that the "demandingness objection" in fiction is actually an objection to **instrumentalization**. The saint treats the world (and people) as means to an end. Fiction requires treating characters as ends in themselves. So the objection is about who bears the cost: the supporting cast bears the cost of being instrumentalized.

  Let's write.

  *Structure:*
  1.  **The Translation:** Demandingness as Narrative Collapse.
  2.  **The Refused Scene:** The impossibility of the "No."
  3.  **Residue Report:** Impartiality & The Saint's Spine.
  4.  **The Commitment:** Cost and Instrumentalization.

  *Key phrase to include:* "A character with two spines reads as two characters." (User's rule).
  *Key concept:* The "3am motivation."

