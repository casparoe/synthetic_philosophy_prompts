answer: |-
  Here is the demandingness objection translated into the mechanics of narrative construction.

  ### The Translation: Demandingness as Narrative Collapse

  In philosophy, the demandingness objection states that consequentialism requires too much sacrifice, alienating the agent from their personal projects and relationships. In your vocabulary, this is not a moral complaint; it is a **structural failure of conflict.**

  **1. The Flattened Spine**
  You note that a character with two spines reads as two characters. Your protagonist has eliminated the second spine. She has no "personal want" that can survive contact with the "moral need." In craft terms, this destroys the **arc**. An arc requires a gap between what a character wants and what they need, or between two competing wants. If her want *is* the moral need, she is static. She begins the book knowing the answer. She ends the book knowing the answer. There is no interior movement, only exterior locomotion.

  **2. The Erasure of the Refused Scene**
  You define the refused scene as the place where a character declines something she plausibly wants, revealing who she is. For your protagonist, this scene is impossible to write honestly.
  *   **Option A:** She wants the selfish thing (rest, love, art) and refuses it. If she does this every time, she reads as repressed or self-loathing. The reader stops cheering and starts diagnosing.
  *   **Option B:** She does not want the selfish thing. If the temptation isn't real, the refusal isn't a choice; it's a reflex. A character who cannot tempt herself cannot struggle. Without struggle, there is no **dramatic stakes**, only a checklist of duties.

  **3. Motivation at 3am**
  Motivation that survives being woken at 3am requires an emotional engine, not just a logical one. Consequentialism is a logic. It calculates. Fiction runs on blood. If her motivation is purely arithmetic ("someone else's need is greater"), she treats her own life as a resource to be mined. Readers empathize with preservation, not immolation. Unless you give the immolation a cost she *feels* as a loss (not just a statistic), she reads as a function, not a person.

  **4. Scene vs. Summary**
  Because her arithmetic is consistent, her choices become predictable. Predictability forces you into **summary**. You cannot sustain **scene** work because scene requires the uncertainty of the moment. If we know she will always choose the greater good, we don't need to watch her choose it. We just need the report of the outcome. The book becomes a ledger of transactions, not a lived experience.

  ***

  ### The Residue Report

  **1. Impartiality (POV)**
  You ask if Multi-POV or Omniscient is a translation of the impartial standpoint.
  **Verdict:** No. It is a voice doing an impression of no one in particular.
  Omniscience simulates breadth, but it cannot simulate *weightlessness*. Even an omniscient narrator must choose where to rest the camera. To linger on a suffering child is to privilege that child's pain over the statistical multitude. To hop heads is to fragment intimacy, not achieve impartiality. The "impartial standpoint" is a view from nowhere; fiction is strictly a view from *somewhere*. If you attempt true impartiality in narration, the voice becomes sterile, clinical, and distant. It solves the philosophical problem of bias by committing the narrative crime of disengagement.

  **2. The Saint's Life (Spine)**
  You ask if a life organized around one end is just a strong spine, and if craft vocabulary can critique it.
  **Verdict:** Craft vocabulary describes the shape beautifully but lacks the mechanism to critique the *source* of the fuel.
  Ahab has a strong spine. Gatsby has a strong spine. We read them as tragic because their obsession destroys them and those around them. Your protagonist has a saint's spine. Craft treats this as a "flawless" character, which is a death sentence for empathy. The vocabulary fails here because it assumes a single-minded pursuit is inherently dramatic. It is not. It is only dramatic if the pursuit extracts a toll the character resents. If the saint loves the sacrifice, there is no tragedy. If the saint hates the sacrifice, there is no sanctity. Your vocabulary can describe the monomania, but it cannot resolve the emotional paradox of a hero who wins by disappearing.

  ***

  ### The Commitment

  You asked me to choose: Is the residue evidence that novelistic vocabulary is missing a category, or is the objection actually about how much it costs and who bears it?

  **It is about who bears the cost.**

  The novelistic vocabulary is not missing a category; it is screaming a warning you are trained to ignore. The "demandingness objection" in fiction is not that the life is too hard to live; it is that the life turns everyone else into **props**.

  When a protagonist treats their own time, talent, and affection as resources to be allocated by arithmetic, they inevitably treat the people around them the same way. A lover becomes a "support structure." A friend becomes a "network node." This is not a philosophical error in the context of a story; it is a **relational collapse**.

  The reason your protagonist doesn't read as a person is not because she is too good. It is because she is **instrumentalizing the world**. Fiction relies on the premise that characters are ends in themselves, not means to an outcome. By adhering strictly to the consequentialist spine, your protagonist violates the fundamental contract of the novel: that the people in the room matter more than the abstract good outside the window.

  The objection isn't that the spine is too straight. It's that a spine this rigid breaks the hands of everyone trying to hold it. The cost isn't being borne by her (she has accepted it); it is being borne by the reader, who feels the coldness of the calculation, and the supporting cast, who cease to be human beings and become variables in her equation.

  Don't look for a new category. Look at the bodies left in the wake of her utility. That is where the story is.
