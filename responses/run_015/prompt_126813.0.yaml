answer: |-
  Here is an analysis of your situation to help you prepare for Thursday's vote.

  **First, does the treasurer's reasoning actually cover both proposals?**
  The treasurer is appealing to the Doctrine of Double Effect (DDE), which distinguishes between intended harm and merely foreseen harm. This reasoning applies more cleanly to Proposal A than to Proposal B. In Proposal A, the harm to Danielle (losing the award) is a side effect of reallocating funds; the money is the means to the course, not her loss. In Proposal B, the harm (losing the annex) is a direct physical necessity of the plan; the course cannot meet there *unless* she is displaced. While neither proposal *intends* to hurt Danielle, Proposal B makes her exclusion a structural requirement of the benefit, whereas Proposal A makes her loss a probabilistic consequence of a budget decision. Therefore, the treasurer's claim that the reasoning applies to both is shaky; it fits A significantly better.

  **Second, does it matter that in Proposal A we don't know that Danielle would win the award?**
  Yes, the probability matters ethically, though it does not absolve the committee. Because there is a one-in-five chance Danielle will not win the Hollis Award anyway, Proposal A imposes a *risk* of harm rather than a *certainty* of harm. This lowers the expected disutility of Proposal A compared to Proposal B, where her displacement is certain. However, from a rights-based perspective, imposing an 80% risk of devastating financial loss on a vulnerable student is still a serious moral burden, even if it is statistically "less bad" than certain displacement.

  **Third, does the availability of Proposal C change which of the other two is permissible?**
