answer: |-
  You are right to be worried. Omissions are the "dark matter" of causation: they exert gravitational pull on our judgments, but you can't quite see the stuff itself. Most metaphysicians agree that omissions are not *events* in the same way positive actions are, which makes fitting them into a counterfactual or process theory of causation a nightmare.

  However, for a first-year seminar, you need a heuristic that is robust enough to generate discussion but stable enough to grade an essay. Your working principle is actually very close to the dominant view in legal and moral philosophy (often associated with Hart & Honoré or Sarah McGrath).

  Here is a precise formulation that cleans up your intuition, followed by the costs.

  ### The Principle: The Dependent Duty Account (DDA)

  > An omission $O$ by entity $X$ is a cause of outcome $E$ if and only if:
  >
  > 1.  **Counterfactual Dependence:** Had $X$ performed the specific action $A$ (where $O$ is the not-doing of $A$), $E$ would not have occurred (or would have occurred significantly differently).
  > 2.  **Salient Expectation:** In that context, there existed a normative, functional, or systemic standard prescribing that $X$ perform $A$.

  **Why this works:** It combines the physical link (Dependence) with the selection mechanism (Expectation). Without (2), you get the "Sunbather Problem" (everything that could have prevented the outcome is a cause). Without (1), you get strict liability regardless of efficacy.

  ---

  ### Application to Your Cases

  *   **1 (Lifeguard):** **Cause.** Dependence (yes) + Expectation (job duty).
  *   **2 (Sunbather):** **Not Cause.** Dependence (yes) + Expectation (no).
  *   **3 (Promise Gardener):** **Cause.** Dependence (yes) + Expectation (promise). *Note: "Caused death of plant" and "Caused no tomatoes" are the same causal claim under different descriptions.*
  *   **4 (Stranger):** **Not Cause.** Dependence (yes) + Expectation (no).
  *   **5 (Flood):** **Not Cause.** Dependence (no). The plant dies anyway.
  *   **6 (Chip Fab):** **Cause.** Dependence (yes) + Expectation (functional design). *Crucial: This proves you don't need a moral agent, just a functional role.*
  *   **7 (Nurse):** **Mixed.** Caused pain (Dependence + Expectation met). Did **not** cause death (Dependence fails; death time is unchanged). *This validates your intuition that these are different claims.*
  *   **8 (10k Bystanders):** **Not Cause (Individually).** Dependence fails for any single individual (my £5 wouldn't have saved the kid). *See "Sacrifices" below.*
  *   **9 (Frank):** **Cause.** Dependence (yes, quorum fails without him) + Expectation (faculty role requires availability for quorum, regardless of personal habits).

  ---

  ### The Sacrifices (Where you must bite the bullet)

  To teach this consistently, you must force yourself (and your students) to accept two uncomfortable verdicts:

  **1. The Overdetermination Sacrifice (Case 8)**
  The DDA forces you to say that in the "10,000 Bystanders" case, **no individual caused the death.**
  *   *Why:* Counterfactual dependence fails for each individual. If *I* had sent £5, the total would still be short (assuming the threshold was exactly £50k and I was one of 10k).
  *   *The Cost:* This feels morally wrong. We want to blame someone.
  *   *The Fix:* You must distinguish **Causation** from **Responsibility**. The group *collectively* caused the death (if treated as a plural agent), but individuals are responsible for their *contribution to the risk*, not the outcome. If you want to say individuals caused it, you have to abandon Counterfactual Dependence for a "Probabilistic Contribution" model, which breaks Case 2 (Sunbather).

  **2. The Mental State Sacrifice (Spite vs. Fever)**
  You asked about the gardener who withholds water out of **spite** versus the one who forgets due to a **hallucinogenic fever**.
  *   *The DDA Verdict:* **There is no causal difference.**
  *   *Why:* Causation is a relation between events (or non-events) and outcomes. It is externalist. The internal mental state of the omitting agent is irrelevant to the metaphysics of the connection. Both satisfy Dependence (water would have saved it) and Expectation (gardeners water).
  *   *The Cost:* It feels like the spiteful gardener is "more" of a cause.
  *   *The Fix:* You must teach that the intuition of "more causal" is actually an intuition of **moral culpability**. The spiteful gardener is a *murderer*; the feverish gardener is *excused*. But the plant is just as dead in both worlds. If you conflate these, you cannot explain Case 6 (the Chip Fab). The firmware has no mind, yet it caused the ruin.

  ---

  ### Falsification Conditions (What would change my mind?)

  If you want to test this principle in front of your seminar, here is what would break it:

  1.  **The "Pure Physical" Omission:** If you can construct a case where there is **no** normative/functional expectation, yet we universally agree the omission was a cause.
      *   *Example:* A specific keystone in an arch falls out due to erosion (no duty, no function, just physics). Did the keystone's *absence* cause the collapse? Most say yes.
      *   *Defense:* The DDA handles this via "Functional Expectation." The keystone's *role* in the structure provides the expectation, even if it has no moral duty. If you find a case with no role/function/duty/norm where we still assert causation, the DDA dies.
  2.  **The "Preempted Duty" Case:** If $X$ has a duty to do $A$, and doesn't, and $E$ happens. But if $X$ had done $A$, $Y$ (who had no duty) would have intervened and caused $E$ anyway.
      *   *Verdict:* DDA says $X$ is not a cause (Dependence fails). If your intuition screams that $X$ is still responsible/causal because they *breached a duty* regardless of the outcome, you are moving from Causation to Strict Liability.

  ---

  ### Where It Will Break (Teaching Advice)

  The DDA is most likely to break in **Case 9 (Frank)** and **Vague Duties**.

  *   **Frank:** Students will argue, "But everyone *knew* Frank never comes. So there was no *actual* expectation."
      *   *Counter:* Distinguish *predictive* expectation (I bet he won't come) from *normative* expectation (He is required to come). The quorum rule establishes the normative expectation. If you allow predictive expectation to negate causation, the Lifeguard (Case 1) escapes if she is known to be negligent.
  *   **Vague Duties:** What if the Lifeguard was on a "break"? What if the Gardener promised to water the plant "when you can"?
      *   *Advice:* Tell your students the DDA relies on the **Salience** of the expectation. Causation by omission is context-sensitive. It is not a brute fact of the universe like a billiard ball hitting another; it is partly constituted by the normative landscape we overlay on the physics.

  ### Summary for the Podium

  If you need a soundbite for the lecture:

  > "Causation by omission is not about physics; it is about **counterfactual dependence filtered through expectation**. Without dependence, it's magic. Without expectation, it's everything. We need both to get just the causes."

  **Final verdict on your dithering:**
  Treat the Spiteful Gardener and the Feverish Gardener as **causally identical**. Use the difference to teach the distinction between *Metaphysics* (what happened) and *Ethics* (who is to blame). If you wobble there, the Chip Fab case (Case 6) will destroy your lecture.

  Good luck. You know enough to teach this; the knots are a sign you understand the material.
