  6.  **Drafting Deliverable (b): Disanalogy Table:**
      *   Focus on what actually drives the "Go NGO-only" conclusion.
      *   *Load-bearing:* The mechanism of punishment. Does starving the MoH stop the leakage or just stop the drugs?
