  9.  **Final Review against Constraints:**
      *   Pin to case (maternal health, logistics, per-diems).
      *   No "both sides have a point" hedging.
      *   Tables formatted correctly.
      *   JSON valid.

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts).
      *   *Tone:* Professional, analytical, direct.
      *   *Focus:* Logic of the metaphor vs. reality of the aid flow.

