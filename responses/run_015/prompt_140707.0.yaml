  | **NGO Channel Purity** | **Cosmetic.** The trustee assumes NGO = sober. NGOs also have overhead, logistics costs, and local rent-seeking. | We would need proof that an NGO partner has 0% leakage and lower overhead than the MoH channel. |
  | **State Capacity Atrophy** | **Load-bearing.** Withdrawal in addiction heals the body. Withdrawal in aid often atrophies the state's muscle (logistics/cold chain), making future recovery harder. | The MoH would have to improve efficiency *without* resources, or the NGO channel would have to permanently replace state function without negative long-term effects. |

