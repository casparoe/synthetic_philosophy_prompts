  | **The Drink** | The Funding (specifically the fungible 20–30%) | Broken | Money isn't consumed; it's diverted. The "drink" (leakage) is a subset of the bottle, not the whole thing. |
  | **The Enabler** | The Foundation (Board/Donors) | Clean | We do keep the flow going despite knowing the cost. |
  | **The Disease** | Systemic Corruption / Weak Governance | Strained | Corruption is often a feature of the system's survival (e.g., per-diems keep nurses showing up), not just a pathology. |
  | **Tolerance/Escalation** | Increasing demands for per-diems or contract kickbacks | Clean | We see this in the transport contracts; the "price" of leakage may rise if we don't push back. |
  | **Withdrawal** | Stopping MoH channel funding | Broken | In addiction, withdrawal hurts the addict. Here, it hurts the *patient* (maternal mortality), while the Minister keeps their salary. |
  | **Recovery** | A clean, efficient Ministry | No counterpart | There is no evidence that starving the MoH leads to efficiency; it often leads to capacity collapse. |
  | **Relapse** | Return to corruption if funding resumes | Strained | Assumes the "urge" is internal, not structural. If incentives remain, "relapse" is guaranteed regardless of history. |
  | **The Intervention** | Board ultimatum / Conditionality | Clean | The moment of confrontation and threat of withdrawal. |
  | **The Family** | The Citizens / Pregnant Women | Broken | In addiction, the family suffers *because* the addict drinks. Here, the "family" suffers *because the drink is withheld* (if we stop). |
  | **The Harm** | Leakage (financial loss) vs. Mortality (human loss) | Broken | Financial loss is the "high" for the official; mortality is the cost to the beneficiary. The analogy conflates these. |

  ### (b) Disanalogy Table: Load-Bearing vs. Cosmetic

  | disanalogy | why_it_matters_here | what_would_have_to_be_true_for_it_to_stop_mattering |
