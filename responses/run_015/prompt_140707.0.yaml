      *   *Recommendation:* Don't abandon MoH entirely (capacity building), but tighten controls. Maybe hybrid.
      *   *Confidence:* High on the analogy break, medium on the specific strategic recommendation (since I don't know the country context fully, but based on the prompt's logic).

  8.  **Refining the Logic (Self-Correction during drafting):**
      *   *Check:* Did I address the 20-30% leak specifically? Yes, need to mention that in the "Drink" mapping. Is the leak the "high"?
      *   *Check:* Did I address the per-diems? Yes, that's often the "functional corruption" that keeps staff showing up. Cutting it might stop the "addiction" but also stop the work.
