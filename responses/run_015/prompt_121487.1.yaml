answer: |-
  # The Identity-Impact Decision Procedure (IIDP)

  **Purpose:** To evaluate grant proposals where the intervention alters future population composition (the Nonidentity Problem) without requiring board members to master population ethics.
  **Time Allocation:** 20 Minutes per proposal.
  **Analyst Role:** Apply Steps 1–4. If the procedure reaches Step 5, the Board must vote.
  **Note on Judgment:** Any step marked **[JUDGMENT FLAG]** requires the analyst to make an irreducible ethical call. Document the reasoning in the memo; do not attempt to quantify it.

  ---

  ## Part I: The Decision Flowchart

  ### Step 1: The Identity Shift Screen
  **Question:** Does the proposal alter settlement patterns, economic conditions, or family formation enough that the specific individuals living in the region in 2120 will be numerically different than they would be under the status quo?
  *   **Data Source:** Demographic modeling, migration projections.
  *   **If No:** Proceed with standard cost-benefit analysis. **Stop.**
  *   **If Yes:** Proceed to Step 2.
  *   **[JUDGMENT FLAG]:** Determining the threshold for "enough" change. If identity change is plausible but not certain, assume **Yes** to be safe.

  ### Step 2: The Modal Complicity Boundary (MCB)
  **Definition:** Stop the analysis and flag for human judgment whenever the harm identified is to present people whose autonomy is being overridden for speculative future benefit, or when the causal chain to future structural conditions is too indirect to assess.
  **Question:** Does this proposal require overriding the autonomy of currently living people (e.g., forced relocation, mandated sterilization, confiscation of property without consent) to achieve the future benefit? Alternatively, is the link between this grant and the future population structure too speculative to model (e.g., relying on three or more layers of social causation)?
  *   **If Yes (Autonomy Override or Speculative Chain):** **STOP.** Flag for Board Handoff (Step 5). Do not proceed to Step 3.
  *   **If No:** Proceed to Step 3.
  *   **[JUDGMENT FLAG]:** Distinguishing between "incentive" and "coercion." A subsidy is usually an incentive; a zoning law that makes current homes uninhabitable may be coercion.

  ### Step 3: The Existence Threshold
  **Question:** In the proposal scenario, will the future people who exist (as a result of the identity shift) have lives that are objectively "worth living" (i.e., above a baseline of severe suffering, deprivation, or rights violation)?
  *   **Standard:** Basic human rights, caloric sufficiency, physical safety.
  *   **If No:** **REJECT.** The proposal creates lives of net suffering.
  *   **If Yes:** Proceed to Step 4.
  *   **[JUDGMENT FLAG]:** Defining the baseline of "worth living." Use the fund's existing human-rights compliance standards.

  ### Step 4: The Counterfactual Structural Continuity Test (CSCT)
  **Definition:** Ask whether every person who could occupy the relevant social and environmental role in the future scenario is at least as well off as every occupant of the corresponding role in the best feasible alternative scenario, regardless of specific identity.
  **Question:** Compare the *roles* (e.g., "Coastal Resident in 2100," "Agricultural Worker in 2080"). Is the occupant of that role in the **Proposal Scenario** at least as well off as the occupant of that role in the **Best Alternative Scenario**?
  *   **Method:** Compare welfare metrics (safety, income, health) for the *role*, not the *person*.
  *   **If No (Roles are worse off):** **REJECT** or Send Back for Redesign. The proposal degrades the structural conditions for future occupants.
  *   **If Yes (Roles are equal or better off):** Proceed to Step 5.
  *   **[JUDGMENT FLAG]:** Defining the "Relevant Role." Do not define roles too narrowly (e.g., "Resident of House #4") or too broadly (e.g., "Human"). Use functional categories (e.g., "Delta Region Inhabitant").

  ### Step 5: Board Handoff (Values Sign-Off)
  **Condition:** Reached if Step 2 triggered the MCB, OR if Steps 1, 3, and 4 passed but the analyst or Board feels moral residue.
  **Action:** The Board must explicitly vote on whether the *structural benefit* outweighs the *identity cost* or *present autonomy cost*.
  **Requirement:** Board minutes must record that the Nonidentity Problem was acknowledged.
  **Outcome:** Approval or Rejection based on institutional values, not procedural rules.

  ---

  ## Part II: Application to Current Proposals

  ### Proposal 1: Seawall and Coastal-Development Package
  *   **Description:** Prevents present displacement but locks in high-density settlement patterns that will shape family formation for generations.
  *   **Step 1 (Identity Shift):** **Yes.** High-density living alters timing of marriage and birth compared to dispersed settlement.
  *   **Step 2 (MCB):** **Pass.** Present residents choose to stay; autonomy is respected. Causal chain is direct (wall prevents flood).
  *   **Step 3 (Existence Threshold):** **Pass.** Lives behind the seawall are safe and prosperous.
  *   **Step 4 (CSCT):** **Pass.**
      *   *Role:* "Coastal Resident 2100."
      *   *Proposal:* Dry, high-density, economically active.
      *   *Alternative:* "Inland Refugee 2100" (if no wall) or "Drowned Resident."
      *   *Comparison:* The Coastal Resident role is better off than the Refugee role.
  *   **Step 5 (Handoff):** Not required by procedure, but recommended due to long-term lock-in.
  *   **Procedural Outcome:** **APPROVE.**
  *   **Board Resistance Anticipated:** The Board may intuitively want to **BLOCK** this. They may argue that locking people into a flood zone for 100 years is irresponsible, regardless of the wall's strength.
  *   **Why the Procedure Overrides Intuition:** The Nonidentity logic dictates that the specific people who live there *because* of the wall cannot claim they are harmed by the risk, provided their lives are good. To block this is to prefer a different set of people (inland) over these people, which the CSCT treats as ethically neutral if the roles are comparable. The procedure forces the Board to admit if they are rejecting this based on a preference for *different people* rather than *better lives*.

  ### Proposal 2: Carbon-Reduction Subsidy (Demographic Impact)
  *   **Description:** Economic restructuring expected to lower regional birth rates, improving climate outcomes but ensuring the future population is not the one that would have existed under the status quo.
  *   **Step 1 (Identity Shift):** **Yes.** Lower birth rates mean different conceptions.
  *   **Step 2 (MCB):** **Pass.** Subsidies are incentives, not autonomy overrides. Causal chain (economy -> birth rate -> climate) is modeled but accepted as standard economics.
  *   **Step 3 (Existence Threshold):** **Pass.** Fewer people, but higher resource availability per capita in a stable climate.
  *   **Step 4 (CSCT):** **Pass.**
      *   *Role:* "Regional Inhabitant 2100."
      *   *Proposal:* Stable climate, higher resource security.
      *   *Alternative:* Unstable climate, resource scarcity.
      *   *Comparison:* The Inhabitant role is significantly better off in the Proposal.
  *   **Step 5 (Handoff):** **Required.**
  *   **Procedural Outcome:** **FLAG FOR BOARD.**
  *   **Board Resistance Anticipated:** The Board will likely want to **BLOCK** this due to discomfort with "demographic engineering."
  *   **Why the Procedure Flags It:** While it passes CSCT, the MCB is borderline. If the economic pressure is severe enough to feel like coercion, Step 2 triggers. Even if it passes Step 2, the explicit link between funding and birth-rate reduction is a values question, not a technical one. The procedure prevents the analysts from hiding behind "climate math" and forces the Board to own the decision to influence population composition.

  ### Proposal 3: Managed-Retreat Grant
  *   **Description:** Relocates present communities, destroying specific social networks but opening land-use patterns that will determine future population composition.
  *   **Step 1 (Identity Shift):** **Yes.** Relocation changes community structure and future births.
  *   **Step 2 (MCB):** **TRIGGER.**
      *   *Reasoning:* Relocation destroys specific social networks of *present* people. Even if compensated, this overrides their autonomy to remain in place for the sake of *future* structural safety.
      *   *Action:* **STOP.** Flag for Board Handoff.
  *   **Step 3 & 4:** Skipped.
  *   **Step 5 (Handoff):** **Mandatory.**
  *   **Procedural Outcome:** **FLAG FOR BOARD.**
  *   **Board Resistance Anticipated:** The Board will intuitively want to **APPROVE** this immediately as "saving lives."
  *   **Why the Procedure Blocks Automatic Approval:** The MCB protects the *present* community's integrity. It forces the Board to acknowledge that they are sacrificing the social fabric of existing people to optimize the structural conditions for future people. The procedure prevents this from being treated as a purely technical safety win.

  ---

  ## Part III: Limitations and Irresolvable Questions

  This procedure is a tool for consistency, not a moral truth-machine. It deliberately leaves the following questions unanswered. The Board must accept that the IIDP cannot resolve them:

  1.  **Impersonal Value vs. Person-Affecting Duties:**
      The CSCT assumes that making a *role* better off is sufficient justification, even if the specific individuals are different. It does not answer whether we owe duties to *specific* future souls (e.g., "my grandchildren") that outweigh duties to *general* future welfare. If the Board believes they have a duty to specific lineages, this procedure will systematically recommend grants that violate that duty.

  2.  **The Non-Intuitive Approval (Proposal 1):**
      As seen in the Seawall case, the procedure may recommend approving projects that "lock in" risk. This is because the Nonidentity Problem implies that future people cannot complain about the risks that were necessary for their existence, provided their lives are good. If the Board believes there is a duty to *avoid creating vulnerable populations* regardless of their subjective welfare, this procedure will fail to capture that obligation.

  3.  **Structural Conditions vs. Individual Autonomy:**
      The MCB flags present autonomy violations, but it treats future autonomy as a structural variable (part of the "Role"). It does not account for the possibility that future people might value *different* structures than we anticipate. The procedure assumes our current modeling of "well-being" applies to them.

  4.  **Judgment Flags are Not Bugs:**
      Where the procedure marks a **[JUDGMENT FLAG]**, no amount of additional data will resolve the ambiguity. These are ethical boundaries, not factual uncertainties. Analysts should not attempt to gather more data to "solve" a Judgment Flag; they must document their reasoning and pass the uncertainty to the Board.

  **Final Instruction to Analyst:** If a proposal passes all technical steps but leaves you with significant moral discomfort, do not suppress this. Mark the proposal for Step 5 Handoff. The procedure is designed to surface ethical tension, not eliminate it.
