  ## Part 3: The Eight Leaves
  *These are the theoretical positions your answers may align with. None are "correct"; they are different maps of the same territory.*

  1.  **The Judgement View:** Emotions just are evaluative judgements. To be afraid is to judge that something is dangerous.
  2.  **The Perception View:** Emotions are perceptions of value. Like seeing colour, you "see" danger or loss directly, even if your intellect disagrees.
  3.  **The Feeling View:** Emotions are feelings or bodily states. If the body doesn't feel it, it isn't an emotion.
  4.  **The Appraisal View:** Emotions are the result of an unconscious processing system (appraisal) that evaluates situations for relevance.
  5.  **The Action View:** Emotions are states of being ready to act. Fear is the readiness to flee; anger is the readiness to attack.
  6.  **The Social Script View:** Emotions are learned social roles. We feel what our culture scripts us to feel in certain situations.
  7.  **The Package View:** Emotions are a package of several components (feeling, judgement, physiology). No single one is the emotion; it is the cluster.
  8.  **The Pluralist View:** "Emotion" isn't one kind of thing we're theorising about at all. It is a loose label for many different mechanisms.

