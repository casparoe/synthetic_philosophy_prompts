  # The Emotion Commitment Quiz

  ## Part 1: The Dissociation Test
  *Answer each question with **Yes**, **No**, or **It depends (and say what on)**.*

  **1. The Harmless Spider**
  A person has a severe phobia of spiders. They see a small spider in a sealed glass jar. They *know* perfectly well it cannot bite them and they *judge* that they are safe. However, their heart races, their hands shake, and they feel an overwhelming urge to leave the room.
  **Is there still an emotion (fear) present here?**
  [ ] Yes
  [ ] No
  [ ] It depends

  **2. The Case of Sam**
