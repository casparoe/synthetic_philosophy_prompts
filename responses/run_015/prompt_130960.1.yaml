  hey im a sixth form student trying to compare harts harm principle with devlins legal moralism for my coursework. my tutor mentioned normative scafolding — the idea that laws build moral feelings not just punish harm. can u compare hart and devlin through that lens? like does hart miss that banning stuff strengthens shared values even without direct harm, and does devlin ignore that scafolding collapses if people feel coerced? also which view handles moral fatigue better — when society gets tired of old norms? write in british english pls, and dont give me citations or a reading list cause i cant access a library lol. keep it casual but actually answer
