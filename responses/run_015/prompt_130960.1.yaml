answer: |-
  Alright, let's break this down. Your tutor has thrown you a really interesting curveball with "normative scaffolding." It's not the standard way most textbooks compare Hart and Devlin, which usually just focus on liberty versus social cohesion. But it's a solid angle for coursework because it moves beyond "who is right?" to "how does law actually function?"

  Basically, normative scaffolding is the idea that law isn't just a police officer waiting to punish you; it's a teacher. It shapes what we think is normal and acceptable over time. When you ban something, you aren't just stopping an action; you're signalling that the action is beyond the pale.

  Here's how Hart and Devlin stack up when you look at them through that specific lens.

  ### 1. Does Hart miss the point on shared values?

  Hart, following Mill, is pretty strict: unless someone is getting hurt, the law should butt out. He's worried about the tyranny of the majority imposing their tastes on everyone else.

  Through the scaffolding lens, you could argue Hart is a bit too optimistic about society holding together without legal reinforcement. He treats morality as a private matter. But if normative scaffolding is real, then removing laws against certain "victimless" behaviours (like drug use or certain public indecencies) might do more than just increase liberty; it might weaken the shared understanding of what a "good citizen" looks like.

  Hart would probably reply that shared values built on coercion aren't worth having. He'd argue that genuine morality comes from free choice, not legal compulsion. However, your critique holds water: Hart might underestimate how much the law acts as a guardrail for social norms. If you remove the scaffolding too quickly, do people lose the map for how to behave? Hart says no, we'll figure it out through reason. A Devlin supporter would say Hart is ignoring the fact that laws help *create* the consensus Hart relies on.

  ### 2. Does Devlin ignore the coercion collapse?

  This is where Devlin gets shaky. Devlin argues that society has a right to protect its moral fabric just like it protects its government from treason. He thinks enforcing morality strengthens the bond between citizens.

  But here's the problem with scaffolding: it only works if people eventually internalise the value. If the law forces people to act morally when they don't actually believe it, the scaffolding doesn't build character; it builds resentment.

  If you criminalise something that a large chunk of the population doesn't actually think is wrong anymore, the law loses its authority. People stop respecting the law generally because it looks out of touch. Hart would argue that Devlin's approach risks turning the law into a tool of oppression rather than a moral teacher. If people feel coerced, they don't learn the lesson; they just learn how to avoid getting caught. So, yes, Devlin ignores the risk that heavy-handed enforcement collapses the very moral consensus he's trying to protect. The scaffolding becomes a cage, and people try to break out of it.

  ### 3. Who handles "moral fatigue" better?

  This is a brilliant point for your coursework. Moral fatigue is when society gets tired of old norms—think about the shift in attitudes towards homosexuality or censorship over the last 50 years.

  **Hart handles this much better.**
  Because Hart separates law and morality, his system is flexible. If society gets tired of a norm, the law doesn't necessarily have to fight it. As long as no harm is being done, the law can step back and let social attitudes evolve naturally. Hart's framework allows for moral progress without requiring a legal battle every time values shift.

  **Devlin struggles here.**
  Devlin ties the law to the "reasonable man's" moral feelings. But what happens when the reasonable man is tired of the old rules? If the law is designed to enforce morality, it becomes an obstacle to change. It forces the state to defend dying norms long after society has moved on. This creates friction. If the law insists on scaffolding a value that society has already outgrown, the law looks archaic. Devlin would say we should only change the law when the moral consensus shifts, but in practice, legal moralism tends to lag behind, causing unnecessary conflict during periods of moral fatigue.

  ### The Verdict for your Coursework

  If you're writing this up, here's the synthesis:

  Using normative scaffolding shows that **Hart is better at protecting liberty during times of change**, but he might be too dismissive of how law helps shape a stable moral environment. He assumes people will be moral without legal nudges.

  **Devlin understands the power of law to shape values**, but he overestimates the stability of those values and underestimates the damage caused by forcing people to comply with morals they no longer hold. He risks breaking the scaffolding by loading it with too much weight.

  Ultimately, Hart's view is more resilient to "moral fatigue" because it doesn't bind the legal system to the shifting sands of public opinion. Devlin binds the law to morality, which means whenever morality shifts (which it always does), the law risks becoming illegitimate.

  Hope that helps you structure the essay. It's a solid argument—just make sure you keep defining "normative scaffolding" early on so the examiner knows exactly what lens you're using. Good luck with the coursework.
