      *   **Specific Questions to Address:**
          1.  Does Hart miss that banning stuff strengthens shared values even without direct harm?
          2.  Does Devlin ignore that scaffolding collapses if people feel coerced?
          3.  Which view handles "moral fatigue" better (when society gets tired of old norms)?
      *   **Constraints:** British English, no citations/reading list (access issues), casual tone but substantive answer.

  2.  **Deconstruct the Concepts:**
      *   **Hart (Harm Principle):** Based on J.S. Mill. The state should only interfere with individual liberty to prevent harm to others. Morality alone isn't enough grounds for law. Focus on individual autonomy.
      *   **Devlin (Legal Moralism):** Society has a right to protect its existing moral fabric. Immorality threatens the cohesion of society (like treason). Law should enforce shared morality even without tangible harm.
      *   **Normative Scaffolding:** This is a sociological/legal theory concept (often associated with Cass Sunstein or similar modern jurisprudence, though the user's tutor is using it specifically). It suggests law isn't just a barrier; it's a teacher. It shapes what people *think* is right/wrong over time.

  3.  **Address the Specific Questions through the Lens:**

      *   *Question 1: Does Hart miss the value-strengthening aspect?*
          *   Hart focuses on negative liberty (freedom from interference). He might acknowledge that law shapes morals but would argue it shouldn't *unless* there's harm. He'd worry about the state imposing morality.
          *   Critique: Yes, Hart might underestimate how law *constitutes* society. If you remove laws against victimless "vices," does society lose a shared language of value? Hart would say "good riddance to oppressive norms," but the scaffolding argument says "you might lose social cohesion."

      *   *Question 2: Does Devlin ignore the coercion collapse?*
          *   Devlin assumes shared morality is the glue. He thinks enforcing it strengthens the glue.
          *   Critique: If the law forces people to act morally when they don't believe it, it creates resentment. The scaffolding becomes a cage. If people feel coerced, they don't internalise the value; they just evade the law. This weakens the moral fabric Devlin wants to protect. Hart would argue this leads to hypocrisy, not virtue.

      *   *Question 3: Moral Fatigue (who handles changing norms better)?*
          *   Moral fatigue = society getting tired of old rules (e.g., homosexuality, censorship).
          *   Hart: Better equipped. His principle allows norms to change naturally. If no harm, law steps back. It adapts to individual liberty.
          *   Devlin: Struggles. If law is tied to current morality, what happens when morality shifts? Devlin talks about the "reasonable man," but if the law enforces old morals too hard, it breaks when society moves on. It risks lagging behind or causing conflict.

