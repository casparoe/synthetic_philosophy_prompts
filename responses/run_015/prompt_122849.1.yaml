  1. The case

  Consider PrecisionAI, a contract machining shop owned entirely by a venture capital firm. The shop floor holds fifty advanced CNC mills. Five years ago, fifty skilled machinists ran them, each bringing decades of tacit knowledge about tool wear, material stress, and auditory cues. Today, two systems engineers and three maintenance technicians staff the shift. The core asset is not the steel of the machines but the "Model," a software suite hosted on local servers in a climate-controlled room adjacent to the floor. The Model was trained on ten years of logged telemetry from the firm's best veterans—records of hand-wheel corrections, auditory adjustments, and tool-path optimizations made when tolerances tightened. Those veterans were let go once their judgment was ingested. The Model now adjusts feeds and speeds in real-time, reacting to vibration faster than a human hand. Ownership lies with the investors, who recouped the training cost in year one. The displaced machinists receive no royalties; their labor is severed from them entirely. Some drive for rideshare apps; a few were hired back at half wage to clean chips and label data errors for the Model. Revenue flows from selling parts at the prevailing market rate. Costs are largely depreciation on the servers and machines, electricity, and the meager wages of the remaining staff. To an outsider, the profit margin looks miraculous: almost all revenue exceeds costs, with little going to wages. It appears the Model is generating value directly. The investors see a return rate double the industry average. The machines hum continuously, unplanned downtime near zero. The skill that once required twenty years of apprenticeship now runs as code, purchased once, exploited endlessly. The workers who created that skill are outside the gates, while the product of their past minds runs the floor without rest, without pay, and without complaint. The capital invested is heavily weighted toward the servers and software, which Marx would call constant capital, with wages for living workers, or variable capital, shrunk to a minimum. The firm sells its parts at the same price as competitors but produces them cheaper, pocketing the difference as apparent surplus value generated by the code itself. The training data was proprietary; the workers signed IP agreements surrendering rights to their movements. The profit is realized upon sale. The competitors are still using humans. The firm's books show high profit despite low wage expenditure.

  2. Where the dead labor / living labor line buckles

  The tension arises at the definition of value creation. Marx insists that machines (constant capital) only transfer their own pre-existing value to the product through depreciation, while workers (variable capital) create new value through the expenditure of labor power. In PrecisionAI, the "judgment" formerly exercised by living workers is now executed by the Model. If judgment is the essence of skilled labor, and the Model performs it, the Model appears to be performing labor without being paid. If the Model is performing labor, it is creating new value, which contradicts the claim that only living labor creates value. If the Model is not performing labor, but the firm still extracts massive surplus value with almost no workers, then surplus value is no longer tied to variable capital. This breaks the link between exploitation and profit. Downstream, this threatens the tendency of the rate of profit to fall. Marx argues that as firms replace workers with machines, the source of profit (workers) shrinks relative to investment, causing profits to fall. But if "fossilized skill" allows machines to replicate the value-creating power of workers, a firm could theoretically automate completely and maintain high profit rates. Furthermore, it complicates the reserve army of labor. If the displaced machinists are never needed again because the Model learns from itself, they are not a reserve army but a permanent surplus population, removing the mechanism that keeps wages in check. The distinction buckles because the machine is no longer just a tool; it is an agent of decision-making that mimics the value-creating activity of the worker.

  3. The strongest reply on Marx's behalf

  A defender of Marx would argue that you are conflating productivity with value creation. The Model increases use-value (more parts, fewer errors) but does not create value ex nihilo. Value is determined by socially necessary labor time. PrecisionAI's parts take less individual labor time to produce than the social average, allowing the firm to sell at the market rate and pocket the difference. This is not new value created by the machine, but surplus value transferred from competitors who are less efficient. The "skill" in the Model is past labor, crystallized as constant capital. It transfers value to the product via depreciation of the servers and software development costs. The profit looks high only because PrecisionAI is in a temporary phase of super-profit. Once competitors adopt similar systems, the socially necessary labor time drops, prices fall, and the extra profit vanishes. At that point, the high composition of capital (mostly machines, few workers) will cause the profit rate to fall across the industry. The remaining profit comes from the few living workers left (engineers, maintenance) who are exploited intensely, or from redistribution across the economy. The Model is not a worker; it is a very efficient sponge for soaking up value created elsewhere until the system equalizes.

  4. Is fossilized skill a real addition or a new name for something he already has?

  Your framing is insightful but technically collapses into a category Marx already possesses. "Fossilized skill" is simply dead labor. Marx acknowledges that machines embody the skill of those who built them and those whose methods they encode. A loom embodies the weaver's past motions just as the Model embodies the machinist's judgments. The confusion lies in distinguishing use-value from value. The Model possesses immense use-value; it is incredibly useful. But in Marx's system, usefulness does not equal value. Value is strictly a measure of social labor time. By calling it "fossilized skill," you highlight the qualitative richness of what was lost, which Marx's quantitative system flattens. However, economically, it functions exactly like a better tool. Your worry stems from the appearance that the machine is "working." It is not working; it is running. The value it appears to create is actually value redistributed from other sectors or firms during the transition period. You have identified a potent illusion of autonomy, but not a breach in the value theory itself.

  5. What this leaves unresolved

  The live question is not whether the theory holds in equilibrium, but how long the transition period lasts. If "fossilized skill" allows firms to maintain super-profits for decades rather than years, the systemic crises Marx predicts might be delayed indefinitely. Someone in your position should look at aggregate data: as automation rises across the whole economy, does the total mass of profit rise or fall relative to total investment? That consideration would settle whether the Model is truly creating value or merely hoarding it temporarily.
