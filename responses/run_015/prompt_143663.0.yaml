  2. Internalists will object that historical tuning is just complex coupling, not constitution, yet I'll counter that error-profile alignment creates a functional unity mere coupling lacks. My weakness is that they will still deny functional unity equals ontological constitution.
  3. The enactivist will argue labeling anything "extended" concedes too much to representationalism, though I'll insist calibrated uptake describes structural coupling without reifying internal formats. I struggle here because any talk of "vehicles" presupposes the representationalism they reject.
  4. The memory researcher will demand a behavioral marker distinguishing calibrated from trusted tools, so I'll point to co-evolving error-correction patterns over time rather than static reliability. Operationalizing this co-evolution without circularity is where my empirical proposal is weakest.
  5. Someone might ask if a metaphysical claim with no normative consequences is scientifically idle, forcing me to admit the thesis maps boundaries rather than regulations. This risks making the extended mind thesis trivially true but philosophically useless.
