answer: |-
  You have identified a very specific and sophisticated rhetorical maneuver. While there isn't one single universally standardized term for *exactly* this historiographical pattern, it is a recognized subtype of a broader logical fallacy in the philosophy of science.

  The closest established concept is the **Immunizing Stratagem** (coined by critical rationalist Hans Albert) or, in the terms of Imre Lakatos, protecting the **"Hard Core"** of a research programme by adjusting the **"Protective Belt."**

  However, those terms are too broad for your specific observation about *timescales* and *interchangeable background forces*.

  Since you asked for a precise coinage if one doesn't exist, I propose calling this **"The Deep-Structure Shield"** (or formally, **Temporal Causal Immunization**).

  Here is the breakdown of the term, the mechanics, the edges, and how to distinguish it from legitimate historical complexity.

  ---

  ### 1. The Name: "The Deep-Structure Shield"
  **Definition:** A rhetorical defense where the *irrelevance of human agency/events* is treated as an invariant truth (the Hard Core), while specific long-term structural causes (geography, climate, demography) are treated as interchangeable variables (the Protective Belt) to absorb counter-evidence.

  **Why this name?**
  *   **Deep-Structure:** Refers to the reliance on *longue durée* factors (Braudel's term for deep historical time) like geography or climate.
  *   **Shield:** Captures the defensive, "movable wall" nature you observed. The specific factor doesn't matter; its function is purely to block the explanatory power of the "event."

  ### 2. The Mechanics of the Move
  To count as **The Deep-Structure Shield**, the argument must satisfy three conditions:

  1.  **The Invariant Core:** The argument assumes that "shock events" (invasions, laws, decisions) cannot be primary causes of historical change. They are merely epiphenomena (surface ripples).
  2.  **The Variable Belt:** The explanation relies on slow-moving background forces. Crucially, *which* force is irrelevant. If Geography is disproven, Climate is substituted. If Climate is disproven, Culture is substituted.
  3.  **The Exclusionary Goal:** The swap is not made to *add* nuance, but to *preserve the exclusion* of the event. The conclusion ("The invasion didn't matter") remains unchanged regardless of the premise swap ("It was mountains" $\rightarrow$ "It was drought").

  ### 3. Mapping the Edges (What Counts vs. What Doesn't)

  You asked for the boundaries. Here is how to distinguish the **Deep-Structure Shield** from valid historical analysis.

  #### A. The Timescale Edge
  *   **Valid:** A historian argues that a drought weakened a population *and* an invasion finished them off. (Multi-causal, acknowledging the event).
  *   **The Shield:** A historian argues the invasion *didn't matter*, it was *only* the drought. When shown a neighbor who had drought but survived invasion, they switch to "It was the soil type," still insisting the invasion *didn't matter*.
  *   **The Rule:** It is only **The Deep-Structure Shield** if the shift in explanation is used to **nullify** the event's causal power, not just contextualize it.

  #### B. The Factor Interchangeability Edge
  *   **Valid:** New evidence reveals that while geography was important, climate was actually the dominant structural factor. The historian updates their model of *how* the structure worked.
  *   **The Shield:** The specific structural factor is chosen *post hoc* solely to fit the outcome. The logic is circular: "We know a deep structural force was at work because the event didn't cause change. We know which force it was because it explains why the event didn't cause change."
  *   **The Rule:** It is **The Shield** if the structural factor is unfalsifiable—i.e., if *any* outcome can be retroactively fitted to *some* slow force without predicting anything in advance.

  #### C. The Social/Environmental Mix Edge
  *   **Does it apply to social factors?** Yes.
  *   **Example:** "The revolution failed because of the economic base." $\rightarrow$ Counter: "Neighbors had same economy but succeeded." $\rightarrow$ "Ah, but their *cultural superstructure* was different."
  *   **The Rule:** As long as both factors (economy, culture) are treated as slow, deterministic background forces that render the *revolutionary event* irrelevant, it is still **The Deep-Structure Shield**. The "slowness" of the cause matters more than whether it is environmental or social.

  ### 4. How It Differs from "History is Complicated"

  This is the most critical distinction.

  | Feature | **"History is Complicated" (Valid)** | **The Deep-Structure Shield (Fallacy)** |
  | :--- | :--- | :--- |
  | **Causality** | **Additive/Interactive:** Events + Structures interact. A drought weakens the state, *but* the invasion is still the trigger. | **Subtractive/Exclusive:** Structures *replace* Events. The invasion is an illusion; only the drought mattered. |
  | **Falsifiability** | **Open:** If an event clearly changes outcomes despite structural similarity, the model is adjusted to give events more weight. | **Closed:** If an event changes outcomes, a *new* structural difference is invented to explain why the event *still* didn't matter. |
  | **Agency** | **Preserved:** Human decisions can amplify or mitigate structural constraints. | **Erased:** Human decisions are determined by the structure. |
  | **Prediction** | **Probabilistic:** "Given these structures, an invasion is *likely* to succeed." | **Deterministic:** "Given these structures, the invasion *had* to succeed/fail regardless of tactics." |

  ### 5. Why This Move Is Persuasive (and Dangerous)
  The **Deep-Structure Shield** is intellectually seductive because it mimics the rigor of social science. It sounds "deeper" to talk about climate cycles or geographic determinism than to talk about a king's bad decision. It grants the historian the authority of a scientist discovering laws of nature.

  However, it becomes **The Deep-Structure Shield** when it stops being a hypothesis and starts being a **dogma**.

  **The Tell:**
  Watch for the phrase **"Ultimately..."**
  *   *Valid:* "Ultimately, the drought made them vulnerable, though the invasion was the catalyst."
  *   *Shield:* "Ultimately, the invasion was irrelevant; it was the drought."

  If "Ultimately" always points to a slow force and *away* from an event, regardless of the evidence, you are looking at the **Deep-Structure Shield**.

  ### Summary
  *   **Established Root:** Immunizing Stratagem (Hans Albert) / Protective Belt (Lakatos).
  *   **Proposed Coinage:** **The Deep-Structure Shield** (or **Temporal Causal Immunization**).
  *   **Core Mechanism:** Treating long-timescale factors as interchangeable variables to protect the invariant claim that "events do not drive history."
  *   **Key Edge:** It is distinct from complexity because it **excludes** agency/events rather than integrating them.

  You can now call this out directly: *"You are employing a Deep-Structure Shield; you are swapping structural variables to immunize your claim against the causal relevance of the event itself."*
