  # JOINT STATEMENT ON THE TAXONOMY OF LIBERTY
  **An Adversarial Collaboration Between Defenders of Negative and Republican Liberty**

  ## Part I: Agreed Claims

  We, the undersigned representatives of the negative-liberty and republican-liberty traditions, acknowledge deep theoretical divergences regarding the nature of political freedom. However, within the standard taxonomy that distinguishes our respective views from positive liberty (defined as self-mastery or the realization of potential), we affirm the following four propositions as common ground:

  1.  **Freedom involves the absence of certain constraints.** Both camps agree that freedom is fundamentally concerned with the removal of external impediments imposed by human agency, distinguishing this view from positive liberty's focus on internal capacities or resources.
  2.  **Arbitrary power is objectionable.** Both camps agree that the possession of arbitrary power by one agent over another is a political evil, even if we disagree on whether the mere existence of such power constitutes a violation of liberty itself.
  3.  **A benevolent master who never interferes still holds power over the subject.** Both camps agree on the descriptive fact that an agent who possesses the unchecked capacity to interfere in another's choices retains a position of authority over that subject, regardless of whether that capacity is exercised.
  4.  **The three conceptual categories are not interchangeable.** Both camps agree that negative liberty, republican liberty, and positive liberty are distinct conceptual tools that must not be conflated; specifically, freedom as non-interference and freedom as non-domination are analytically separable from freedom as self-realization.

  ## Part II: Disagreements Table

  While we share the commitments above, we diverge on the specific conditions under which liberty is diminished and the appropriate institutional remedies. The following table outlines our respective positions using neutral framing for the points of contention.

  | Point of Contention | Negative-Liberty Position | Republican-Liberty Position |
  | :--- | :--- | :--- |
  | **(a) The status of arbitrary will**<br>Whether being subject to another's arbitrary will is itself a reduction in liberty even when interference never occurs. | Liberty is reduced only upon actual interference or the credible threat thereof; mere subjection to another's will is not unfreedom. | Liberty is reduced by the mere existence of arbitrary power over the subject, regardless of whether interference occurs. |
  | **(b) The benevolent-master case**<br>Whether the benevolent-master case demonstrates an actual deficit of freedom or merely a risk of future unfreedom. | It demonstrates merely a risk of future unfreedom; current freedom remains intact so long as interference is absent. | It demonstrates an actual deficit of freedom (a status of domination); the risk of interference is secondary to the status itself. |
  | **(c) The correct remedy**<br>Whether the correct remedy is the removal of obstacles, the expansion of capabilities, or the institutional elimination of arbitrary discretion. | The removal of obstacles (ensuring non-interference by others). | The institutional elimination of arbitrary discretion (ensuring non-domination by structural design). |

  ## Part III: Central Crux and Institutional Scenario

  **The Central Crux**
  The fundamental divergence between our positions rests on whether freedom requires the **counterfactual robustness of non-interference**, meaning that forbearance must be structurally guaranteed rather than contingent on the authority's present preferences. The negative-liberty defender maintains that freedom is actual non-interference, while the republican-liberty defender maintains that freedom is secured non-interference (independence from the will of another).

  **Concrete Institutional Scenario**
  To test this crux, we propose the following scenario: *Workers in a cooperative where management holds unchecked scheduling authority but consistently exercises it benevolently.*

  **Recorded Judgments**
  We record in advance our respective judgments regarding the freedom status of these workers and the relevance of exit options.

  *   **Negative-Liberty Judgment:**
      *   **Are the workers fully free?** Yes. Because management does not interfere with the workers' choices, the workers are free.
      *   **Does an available but prohibitively costly exit option change the analysis?** No. Provided management does not actively block exit, the cost of leaving is a circumstance, not an act of interference. The workers remain fully free regardless of the exit cost.

  *   **Republican-Liberty Judgment:**
      *   **Are the workers fully free?** No. Because management retains unchecked authority, the workers exist in a state of domination, regardless of benevolent exercise.
      *   **Does an available but prohibitively costly exit option change the analysis?** No. A prohibitively costly exit option does not secure independence. Because the workers cannot viably leave to escape the arbitrary power, their dependence remains entrenched, and their unfreedom persists.
