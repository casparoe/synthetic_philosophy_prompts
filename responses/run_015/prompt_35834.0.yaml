prompt: |-
  I keep running into the old puzzle of the ship whose planks are replaced one by one, and I've noticed something odd about how the debate over it proceeds: nobody disagrees about the facts. The schedule of replacement, the salvage of the discarded planks, the duplicate ship built from them — all of that is common ground. What the sides disagree about is what a theory of persistence is supposed to do with such cases, and that's the part I want nailed down before I commit to any view. So write me the specification, not the sales pitch: the list of requirements an adequate theory of how objects persist through change and replacement must meet, with the case or consideration behind each.

  The list should at least cover:

  - The cases any theory must get right, beyond the vanilla gradual-replacement story: the version where the discarded planks are reassembled into a rival ship that coexists with the continuously repaired one; the version where the original is destroyed and a later duplicate is built from new materials to the same plans; the version where the ship is dismantled and left in storage for decades before reassembly; and a borderline I rarely see discussed — a ship that spends half its life beached as a static museum exhibit while its name is transferred to an actively sailing successor.
  - The distinctions a theory must not collapse: being the same object versus being an exact continuation of one versus being a faithful replica; the identity of the ship versus the identity of its matter; answers that are relative to a kind — same ship, same collection of planks, same fleet, same business operating it — versus answers that are absolute and kind-independent; and, if the theory distinguishes them, sameness of thing from sameness of matter persisting.
  - The constraints it cannot contradict: the formal properties of identity, above all transitivity and Leibniz's law, since those are what generate the sharpest pressure — any story on which the repaired ship, the reassembled ship, and the duplicate all claim a single original had better not make identity non-transitive in the process; whatever one's best account of parthood implies about how much of a thing can be swapped out while it survives; and the verdicts we actually rely on in practice, where money and obligations turn on the answer — a heritage registry deciding whether a heavily restored cathedral counts as the original, a marine insurance contract that pays out only if it is the same vessel that departed, a court deciding whether a business that has since replaced every employee, asset, and location still owes a debt incurred forty years ago.

  For each requirement, say whether it is non-negotiable or merely the preference of one camp, and flag any subset you suspect cannot be jointly satisfied — I am especially interested in whether any theory can deliver determinate, absolute, single answers in the reassembly and duplicate cases while preserving transitivity, or whether the requirements of determinacy and of transitivity quietly force a choice between them. Note, too, which single requirement on your list does the most to eliminate otherwise respectable contenders.

  Then, briefly, score the main views against the list — the endurance picture on which identity through time is governed by a sortal, the four-dimensional picture on which objects have temporal parts, best-candidate approaches, and the view that there is simply no fact of the matter and the question is settled by convention or by our interests — but keep this short; the criteria are where I want the thinking. Fix the standard of adequacy as follows: a theory counts if it is good enough to decide the courthouse and registry disputes, not merely to classify them. If you think that standard is itself the crux — that no metaphysics of persistence could be what those institutions are implicitly using — say so and explain what would have to be true for the specification to be satisfiable at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Ship of Theseus puzzle and theories of persistence (metaphysics of identity through time/change).
      *   **Task:** Write a *specification* (list of requirements) for an adequate theory of persistence, not a sales pitch for a specific view.
      *   **Key Components:**
          *   Cover specific cases (reassembly, duplicate, storage/dismantling, museum/name transfer).
          *   Cover key distinctions (identity vs. continuation vs. replica, object vs. matter, sortal-relative vs. absolute, thing vs. matter).
          *   Cover constraints (logic of identity [transitivity, Leibniz's Law], parthood limits, practical verdicts [law, insurance, debt]).
          *   For each requirement: State if non-negotiable or preference, flag incompatibilities (especially determinacy vs. transitivity).
          *   Identify the "killer constraint" (the one that eliminates the most contenders).
          *   Score main views (Endurance, Perdurance/4D, Best-Candidate, Conventionalism) against the list (briefly).
          *   **Crucial Standard of Adequacy:** The theory must be good enough to *decide* courthouse/registry disputes (practical adjudication), not just classify them.
          *   **Critical Reflection:** If the standard itself is the problem (i.e., metaphysics can't do what law wants), explain what would need to be true for the specification to be satisfiable.

  2.  **Deconstruct the "Specification" Approach:**
      *   The user wants a functional spec, like software requirements. "Input: Scenario X. Output: Verdict Y. Constraint: Logic Z."
      *   Tone: Analytical, rigorous, neutral, slightly skeptical of easy answers.
      *   Focus: The tension between logical rigor (transitivity) and practical utility (legal verdicts).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Coexistence Case (Reassembly).*
          *   Scenario: Continuous repair (Ship A) vs. Reassembled planks (Ship B).
          *   Need: A rule for which one is the *original*.
          *   Constraint: Can't say both are identical to the original if they are distinct from each other (Transitivity).
          *   Status: Non-negotiable for a determinate theory.

      *   *Requirement 2: The Gap Case (Storage/Dismantling).*
          *   Scenario: Dismantled, stored, reassembled.
          *   Need: Account for intermittent existence or continuity of organization.
          *   Status: Non-negotiable (intuitively, the reassembled ship *is* the old one).

      *   *Requirement 3: The Duplicate Case (New Materials).*
          *   Scenario: Original destroyed, perfect copy built later.
          *   Need: Distinguish *replica* from *resurrection*.
          *   Status: Non-negotiable (legal distinction between insurance payout vs. replacement).

      *   *Requirement 4: The Functional/Name Transfer Case (Museum).*
          *   Scenario: Static hull vs. Active successor bearing the name.
          *   Need: Distinguish historical identity from functional succession.
          *   Status: High priority (matches the "HMS Victory" or "Constitution" real-world issues).

      *   *Requirement 5: Logical Consistency (Transitivity & Leibniz's Law).*
          *   Constraint: If A=B and B=C, then A=C. If A=B, they share properties.
          *   Status: **Non-negotiable.** This is the hard constraint.

      *   *Requirement 6: Sortal Sensitivity vs. Absolute Identity.*
          *   Constraint: Is it the "same ship" but not the "same wood"?
          *   Status: Needs clarification. Absolute identity is standard metaphysics; sortal-relativity is a proposed fix.
          *   Tension: If identity is sortal-relative, transitivity might break across sortals.

      *   *Requirement 7: Practical Adjudication (The "Courthouse Standard").*
          *   Constraint: Must yield a binary or actionable verdict for law/insurance.
          *   Status: Non-negotiable per user prompt, but potentially incompatible with metaphysical indeterminacy.

      *   *Requirement 8: Matter vs. Object Distinction.*
          *   Constraint: Must distinguish the ship from the sum of its planks.
          *   Status: Non-negotiable (otherwise replacement is impossible).

  4.  **Identifying Incompatibilities (The "Hard Problem"):**
      *   *Transitivity vs. Best-Candidate:* If Ship A (continuous) and Ship B (reassembled) both have equal claim, Best-Candidate says "it depends on competition." But if they don't compete (e.g., in different possible worlds), is it indeterminate?
      *   *Determinacy vs. Vagueness:* The user wants a theory that *decides* cases. But many metaphysical views (Conventionalism, Indeterminacy) say there *is* no fact to decide.
      *   *The "Killer Constraint":* It's likely the combination of **Transitivity + Determinacy + The Reassembly Case.** You can't have all three without arbitrary stipulation or denying one of the ships is the original.

  5.  **Scoring the Views:**
      *   *Endurance (Sortal-based):* Good for practical, struggles with Transitivity in fission cases.
      *   *Perdurance (4D):* Solves Transitivity (different temporal parts), but struggles with "Courthouse Standard" (which time-slice gets the bill?).
      *   *Best-Candidate:* Good for intuition, fails Transitivity (contingent identity).
      *   *Conventionalism/Indeterminacy:* Honest, but fails the "Decide the Dispute" requirement (says "you decide").

  6.  **Addressing the "Standard of Adequacy":**
      *   The prompt asks: "If you think that standard is itself the crux... say so."
      *   *Insight:* Metaphysics describes what *is*. Law prescribes what *counts*. They operate on different axes. A metaphysical theory might say "identity is vague," but the law *cannot* accept "vague." Therefore, the law *stipulates* conventions.
      *   *Conclusion:* No metaphysical theory can satisfy the "Courthouse Standard" *on its own* because the Courthouse Standard requires *stipulative authority*, not *descriptive truth*. The specification is unsatisfiable by pure metaphysics; it requires a hybrid of metaphysics + legal convention.

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the "Spec" approach.
      *   Section 1: The Requirements List (Case Coverage, Distinctions, Constraints). Mark Non-negotiable vs. Preference. Flag conflicts.
      *   Section 2: The Incompatibility Matrix (Transitivity vs. Determinacy).
      *   Section 3: The Killer Constraint.
      *   Section 4: Brief Scoring of Views.
      *   Section 5: The Crux (Metaphysics vs. Law).

  8.  **Drafting Content - Specific Considerations:**
      *   *Reassembly:* Make sure to mention the "fission" problem.
      *   *Transitivity:* Emphasize that this is the logical bedrock.
      *   *Courthouse:* Emphasize that law needs *binary* outcomes, metaphysics often yields *degrees* or *indeterminacy*.
      *   *Tone:* Keep it dry, precise, "engineering spec" style.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the museum case? Yes.
      *   *Check:* Did I flag the transitivity/determinacy conflict? Yes, this is central.
      *   *Check:* Did I score the views briefly? Yes.
      *   *Check:* Did I address the "Standard of Adequacy" critique? Yes, this is the philosophical punchline.
      *   *Refinement:* Ensure the distinction between "Same Object" and "Same Matter" is clear in the requirements.
      *   *Refinement:* Make sure the "Killer Constraint" is explicitly identified. I think it's the demand for *determinate verdicts in fission cases* combined with *transitivity*.

  10. **Final Polish:** Check against the prompt's specific phrasing ("write me the specification, not the sales pitch", "nailed down", "flag any subset you suspect cannot be jointly satisfied"). Ensure the distinction between non-negotiable and preference is clear for each item. (Self-correction: Ensure I don't just list them, but explain *why* it's a requirement).

  *(Self-Correction on the "Courthouse Standard"):* The prompt asks me to fix the standard as "good enough to decide." But then asks me to say if that standard is the crux. I need to walk the line: Treat it as a requirement for the spec, but conclude that meeting it requires stepping outside pure metaphysics.

