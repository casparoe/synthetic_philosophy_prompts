answer: |-
  # Specification: Theory of Persistence Through Change and Replacement

  **Objective:** Define the functional requirements for a metaphysical theory of object persistence capable of adjudicating identity disputes in cases of material replacement, dismantling, and duplication.
  **Standard of Adequacy:** The theory must yield determinate verdicts sufficient for legal and administrative adjudication (courthouse/registry standard), not merely descriptive classification.

  ---

  ## 1. Case Coverage Requirements
  *The theory must process the following input scenarios and produce a defined output regarding identity.*

  | ID | Scenario | Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **C1** | **The Fission Case (Coexistence)**<br>Original planks replaced continuously (Ship A); discarded planks reassembled (Ship B). Both exist simultaneously. | Must assign identity status to A and B relative to the Original. Cannot assign "Original" status to both if A ≠ B. | **Non-Negotiable** |
  | **C2** | **The Gap Case (Storage)**<br>Ship dismantled, parts stored for decades, then reassembled. No continuous spatiotemporal path during storage. | Must account for intermittent existence or continuity of organization despite temporal gaps. | **Non-Negotiable** |
  | **C3** | **The Duplicate Case (Replica)**<br>Original destroyed. Later, a new ship is built to exact plans using new materials. | Must distinguish *replication* from *resurrection*. Verdict must differ from C2 despite structural similarity. | **Non-Negotiable** |
  | **C4** | **The Museum/Successor Case**<br>Original hull preserved statically (Museum); functional successor built and carries the registered name/role. | Must distinguish *historical identity* (the hull) from *functional succession* (the name/role). | **Non-Negotiable** |

  **Conflict Flag:** **C1 (Fission)** creates immediate tension with Logical Constraints (see L1). A theory that satisfies C1 determinately often violates L1, or must arbitrarily privilege one candidate (A or B) without a principled metaphysical distinction.

  ---

  ## 2. Distinction Requirements
  *The theory must maintain specific conceptual boundaries without collapse.*

  | ID | Distinction | Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Identity vs. Continuity vs. Replica** | Must distinguish: (1) Numerical Identity (same object), (2) Qualitative Continuity (same type/state), (3) Replica (distinct object, same design). | **Non-Negotiable** |
  | **D2** | **Object Identity vs. Material Identity** | Must allow that Object O at t1 can be identical to Object O at t2 despite Material M at t1 ≠ Material M at t2. | **Non-Negotiable** |
  | **D3** | **Sortal-Relative vs. Absolute** | Must specify whether identity claims are absolute ("X is Y") or sortal-relative ("X is the same *ship* as Y, but not the same *collection of wood*"). | **Preference** (Absolute is standard; Relative is a proposed fix for C1). |
  | **D4** | **Thing vs. Matter Persistence** | Must distinguish the persistence conditions of the *artifact* from the persistence conditions of the *constituents*. | **Non-Negotiable** |

  **Conflict Flag:** **D3**. If identity is Sortal-Relative (to solve C1), it risks violating Leibniz's Law (L2) across sortals. If identity is Absolute, C1 forces a binary choice that may contradict intuition.

  ---

  ## 3. Logical and Practical Constraints
  *The theory must not contradict formal logic or render practical adjudication impossible.*

  | ID | Constraint | Requirement | Status |
  | :--- | :--- | :--- | :--- |
  | **L1** | **Transitivity of Identity** | If A = Original and B = Original, then A = B. If A ≠ B, they cannot both be = Original. | **Non-Negotiable** |
  | **L2** | **Leibniz's Law** | If A = B, they must share all properties (including historical properties like "was launched in 1700"). | **Non-Negotiable** |
  | **L3** | **Parthood Limits** | Must define a threshold (if any) for material replacement. If 100% replacement is allowed (Theseus), why not 100% instantaneous swap? | **Non-Negotiable** |
  | **P1** | **Adjudicative Determinacy** | In legal contexts (insurance, debt, heritage), the output must be binary (Yes/No) or ranked (Primary Claim/Secondary Claim). Indeterminacy ("no fact of the matter") is not an acceptable output for this standard. | **Non-Negotiable** (per prompt standard). |

  **Conflict Flag:** **L1 + C1 + P1**. This is the critical triad.
  *   In C1 (Fission), intuition suggests both A and B have strong claims.
  *   P1 demands a winner for the courthouse.
  *   L1 forbids two distinct winners both being identical to the Original.
  *   *Result:* To satisfy P1 and L1, the theory must arbitrarily dismiss one strong claim (violating intuitive fairness) or deny identity to both (violating practical utility).

  ---

  ## 4. Incompatibility Analysis: Determinacy vs. Transitivity

  You asked specifically whether any theory can deliver determinate, absolute, single answers in the reassembly/duplicate cases while preserving transitivity.

  **The Verdict:** No single metaphysical theory satisfies **L1 (Transitivity)**, **C1 (Fission)**, and **P1 (Determinacy)** simultaneously without residual cost.

  1.  **If you preserve Transitivity (L1) and Determinacy (P1):** You must assert that *only one* ship in the Fission case is the Original.
      *   *Cost:* You must provide a metaphysical ground for why the continuous ship wins over the reassembled one (or vice versa) that is not merely stipulative. Most grounds (continuity of form, continuity of matter) are equally split in C1.
  2.  **If you preserve Transitivity (L1) and Intuition (Both have claims):** You must deny Determinacy (P1).
      *   *Cost:* Identity becomes indeterminate. This fails the "Courthouse Standard."
  3.  **If you preserve Determinacy (P1) and Intuition:** You must deny Transitivity (L1).
      *   *Cost:* You adopt a "Best Candidate" theory where identity is contingent on competition. This violates standard logic (Leibniz's Law) and makes identity context-dependent in a way that breaks formal reasoning.

  **The Killer Constraint:** **P1 (Adjudicative Determinacy).**
  This is the requirement that eliminates the most respectable metaphysical contenders.
  *   **Why:** Pure metaphysics (Endurance, Perdurance, Conventionalism) often concludes that in C1, there is *no unique fact* about which ship is the original. They describe the world as it is. P1 demands the theory *make* a fact for the sake of social coordination. A metaphysical theory that says "it is vague" fails the spec because a judge cannot rule "it is vague."

  ---

  ## 5. Scoring Main Views Against Specification

  | View | C1 (Fission) | L1 (Transitivity) | P1 (Determinacy) | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Endurance (Sortal-Governed)** | **Fail.** Struggles to pick a winner without arbitrariness. | **Pass.** Maintains strict identity logic. | **Fail.** Often yields indeterminacy in fission. | Good for C2/C3, breaks at C1. |
  | **Perdurance (4D/Temporal Parts)** | **Pass.** A and B are distinct spacetime worms sharing an early segment. No identity conflict. | **Pass.** Identity is strict between stages. | **Fail.** "Which worm gets the debt?" remains unanswered. | Solves logic, fails the Courthouse Standard (which worm is the *legal* person?). |
  | **Best-Candidate** | **Pass.** Picks the "better" candidate based on context. | **Fail.** Violates Transitivity (identity becomes contingent on rivals). | **Pass.** Yields a winner for the court. | Logically costly. Makes identity extrinsic. |
  | **Conventionalism / Indeterminacy** | **Pass.** Acknowledges the choice is ours. | **Pass.** Logic holds within stipulated conventions. | **Fail.** Says "You decide," not "Here is the truth." | Honest, but fails the prompt's Standard of Adequacy. |

  ---

  ## 6. The Crux: The Standard of Adequacy Itself

  You fixed the standard as: *"A theory counts if it is good enough to decide the courthouse and registry disputes."*

  **Assessment:** This standard is **unsatisfiable by pure metaphysics.**

  **Explanation:**
  Metaphysics is descriptive; Law is prescriptive.
  *   **Metaphysics** asks: "What *is* the relation between Ship A and the Original?"
  *   **Law** asks: "Who *ought* to bear the liability of the Original?"

  In cases like C1 (Fission) or C4 (Museum/Successor), the physical and historical facts underdetermine the identity verdict. There is no "fact of the matter" hidden in the planks that dictates who pays the insurance premium. The "fact" required by the courthouse is not a metaphysical discovery but a **stipulative convention**.

  **Condition for Satisfiability:**
  For this specification to be satisfiable, the theory of persistence must not be a *metaphysical* theory alone. It must be a **Hybrid Theory of Ontological Grounding + Social Stipulation**.
  1.  **Metaphysical Component:** Describes the physical continuity, causal history, and material overlap (the "candidate facts").
  2.  **Normative Component:** Provides the tie-breaking rules (e.g., "In cases of fission, continuity of function trumps continuity of matter for insurance purposes").

  **Conclusion:**
  If you demand a theory that *discovers* the answer in the world, you will fail the Courthouse Standard (P1) because the world often contains no such answer in hard cases. If you demand a theory that *provides* the answer for the court, you are no longer doing pure metaphysics; you are designing a legal ontology.

  **Recommendation:**
  To meet your specification, you must adopt a **Best-Candidate framework governed by Sortal-Specific Conventions.**
  *   *Metaphysics:* Admit identity is vague in C1.
  *   *Convention:* Stipulate that for *Heritage Registries*, Material Continuity (Reassembled) wins. For *Insurance/Maritime Law*, Functional Continuity (Repaired) wins.
  *   *Result:* This satisfies P1 (Determinacy) and L1 (within each context), but concedes D3 (Identity is Sortal/Context-Relative). This is the only configuration that clears the Courthouse Standard without violating Logic.
