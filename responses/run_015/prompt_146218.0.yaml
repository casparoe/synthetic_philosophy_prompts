answer: |-
  The serf bowed down to maintain the **manor**,
  Though he was born to feed the **republic**.
  His hammer struck the rhythm of a **factory**,
  His veins were wires in a holy **network**.
  He carried seeds of future **genome**,
  And suffered for the changing **climate**.

  They blamed the harvest on the **climate**,
  Never suspecting rights within the **manor**.
  They traced the lineage of the **genome**,
  To find a place inside the **republic**.
  Rome paved a road, a crude **network**,
  Where slaves were fuel inside the **factory**.

  Smoke billowed from the early **factory**,
  Ignoring data from the **climate**.
  Telegraphs spun the global **network**,
  Leaving the lord inside the **manor**.
  Votes were cast for the **republic**,
  While monks copied the **genome**.

  Watson cracked open the **genome**,
  And closed the door of the **factory**.
  Wars were fought for the **republic**,
  Ice cores revealed the **climate**.
  Suburbs replaced the stone **manor**,
  Silicon built the **network**.

  Everyone logged into the **network**,
  To edit their own **genome**.
  Gates secured the **manor**,
  Algorithms run the **factory**.
  Panic rose about the **climate**,
  Freedom defined the **republic**.

  We are the goal of the **republic**,
  The center of the **network**.
  We engineer the **climate**,
  We own our **genome**.
  History was just a **factory**,
  The earth is now our **manor**.

  So history flows to this **manor** and **republic**,
  Where time is data for the **factory** and **network**,
  And life is code in the **genome** and **climate**.
