  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You're not missing something obvious; this is a classic debate. The extension (when "S knows p" is true) often overlaps, but the *intension* (why it's true) differs.
      *   *Semantic vs. Metaphysical:* Contextualism says "knows" is indexical (like "tall" or "here"). Encroachment says "knows" is stable, but knowledge itself requires action-ready confidence which varies with stakes.
