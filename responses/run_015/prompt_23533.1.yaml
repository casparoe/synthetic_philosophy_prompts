answer: |-
  This is one of the most sophisticated and common worries in contemporary epistemology. You have hit on exactly why the debate between **Epistemic Contextualism** and **Pragmatic Encroachment** (often called *Subject-Sensitive Invariantism* or *SSI*) is so tricky.

  On the surface, they look extensionally equivalent: both agree that "S knows that p" can be true in a low-stakes scenario and false in a high-stakes scenario, even holding evidence constant.

  However, they do **not** collapse into the same view. They are distinct theories because they locate the source of the variation in completely different places. One is a thesis about **language** (semantics), and the other is a thesis about **knowledge itself** (metaphysics/epistemology).

  Here is the breakdown of the real difference, and the specific scenario where the two theories diverge.

  ### 1. The Core Distinction: Semantics vs. Metaphysics

  **Epistemic Contextualism** is a **semantic** thesis.
  *   **Claim:** The word "knows" is context-sensitive (like "tall," "here," or "I"). Its semantic content shifts depending on the **attributor's** conversational context.
  *   **Mechanism:** In a low-stakes conversation, "knows" picks out a weak relation (easy to satisfy). In a high-stakes conversation (e.g., a philosophy seminar discussing skepticism), "knows" picks out a strong relation (hard to satisfy).
  *   **Result:** The *subject's* actual mental state doesn't change. Only the *standard* being applied to them changes based on who is speaking.

  **Pragmatic Encroachment** is a **metaphysical/epistemological** thesis (combined with semantic invariantism).
  *   **Claim:** The word "knows" has a fixed, invariant semantic content. However, whether a subject actually *stands in the knowledge relation* depends on their **practical environment** (stakes, interests, goals).
  *   **Mechanism:** Knowledge requires a level of justification sufficient for rational action. As stakes rise, the required level of justification rises. Therefore, the subject literally loses the status of "knowing" when stakes go up, even if their evidence stays the same.
  *   **Result:** The *subject's* epistemic status actually changes. The *speaker's* context is irrelevant to the truth of the claim.

  ### 2. The "Crossed" Case (Where they diverge)

  If the theories were the same, they would agree on every case. They don't. They disagree in "crossed" cases where the **Subject's stakes** and the **Attributor's stakes** come apart.

  Imagine the classic **Bank Case**:
  *   **Subject (Hannah):** It is vital she deposits her check by Monday or she will face foreclosure (High Stakes for Subject). She has standard evidence (was at the bank two weeks ago on a Saturday).
  *   **Attributor (John):** John is just chatting casually about Hannah's finances. He has no idea about the foreclosure threat. He is in a Low Stakes conversational context.

  John says: *"Hannah knows the bank is open on Saturday."*

  **The Contextualist Prediction:**
  *   Contextualism looks at the **Attributor's (John's)** context.
  *   John is in a low-stakes, casual conversation. The standards for "knows" are low.
  *   Hannah meets those low standards.
  *   **Verdict:** John's statement is **TRUE**.

  **The Encroachment (SSI) Prediction:**
  *   Encroachment looks at the **Subject's (Hannah's)** context.
  *   Hannah is in a high-stakes situation. The threshold for knowledge is raised by her practical needs.
  *   Her evidence is not strong enough to meet that high threshold. She does not *know*.
  *   **Verdict:** John's statement is **FALSE**.

  Because they yield opposite truth values in this specific scenario, they cannot be the same theory.

  ### 3. Why the Confusion? (The "Loophole")

  Your worry arises because in most ordinary discussions, the Subject's stakes and the Attributor's stakes tend to align.
  *   If Hannah doesn't care about the check (Low Stakes), John usually doesn't care either (Low Stakes). Both theories say "True."
  *   If Hannah is desperate (High Stakes), John usually knows this and raises his standards (High Stakes). Both theories say "False."

  Because they overlap in "normal" cases, they feel like they are saying the same thing. But as the "Crossed Case" shows, they are explaining the variation differently.

  ### 4. Theoretical Motivations

  Philosophers usually choose between them based on what problem they are trying to solve:

  *   **Contextualists** are often trying to solve **Skepticism**. They want to say that in everyday life, we *do* know things (against the skeptic), but the skeptic raises the semantic standards so high that "know" no longer applies in the philosophy classroom. They save the truth of everyday knowledge claims.
  *   **Encroachers** are often trying to save **Intellectualism** (the idea that knowledge is purely about truth/evidence) from counter-examples involving action. They argue that pure intellectualism is false because practical rationality is tied to knowledge. They are less concerned with skepticism and more concerned with the link between *knowing* and *acting*.

  ### Summary

  You are right that the **truth value of the attribution** shifts in both views. But you were missing *what drives that shift*.

  *   **Contextualism:** The **meaning of "knows"** shifts based on the **Speaker's** context.
  *   **Encroachment:** The **nature of Knowledge** shifts based on the **Subject's** context (while the meaning of "knows" stays fixed).

  So, encroachment does not collapse into contextualism. It is a form of **Invariantism** (the meaning of "knows" is constant) that accepts **Metaphysical Variance** (the state of knowledge is sensitive to practical factors). Contextualism is **Semantic Variance**.

  If you keep the "Crossed Case" (High Stakes Subject / Low Stakes Speaker) in mind, the distinction remains clear.
