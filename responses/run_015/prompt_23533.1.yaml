      *   **The "Who's Context?" Test:** This is the clearest way to differentiate.
          *   Contextualism: Attributor's context matters (speaker).
          *   Encroachment: Subject's context matters (agent).
      *   **Divergent Predictions (The "Smoking Gun"):** Construct a scenario where the two theories give different answers.
          *   *Scenario:* High-stakes subject, low-stakes attributor (or vice versa).
