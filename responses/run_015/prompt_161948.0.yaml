  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** Strategy & Epistemology Working Group
  **DATE:** October 14, 2024
  **SUBJECT:** Portfolio Adjustments Post-Trilemma Acceptance
  **EPISTEMIC STATUS:** Provisional Consensus (65% Credence); High Sensitivity

  **Executive Summary**
  Three months ago, this Working Group provisionally accepted the Simulation Hypothesis (SH) based on the standard trilemma: given that post-human civilizations would have vast computing power, either they die out before using it, choose not to run ancestor simulations, or we are almost certainly in one. We have modeled the impact of SH on the Fund's expected-value (EV) calculations. While SH initially appears to dampen our "fanaticism"—the tendency for low-probability, high-impact tail risks to dominate prioritization—further analysis suggests the dominance structure remains intact, though the target of intervention shifts. We recommend a reallocation of capital from traditional existential risk mitigation toward interventions designed to maximize the probability of simulation continuation and Base Reality signaling.

  **Key Cruxes**
  Three technical cruxes drove this revision. First, the **Moral Status of Simulations**. If simulated minds lack moral weight, the EV of all downstream interventions is zero. If they possess weight, the overwhelming majority of value lies in the Base Reality (the simulators' universe), which is causally inaccessible to us. However, we retain leverage over whether our simulation is terminated or preserved. Second, the **Horizon Problem**. Simulations have runtimes. A reference-class analysis of software projects suggests a median remaining runtime significantly shorter than the billions of years available in a physical universe. Consequently, the number of future lives at stake within our causal lightcone drops from $\approx 10^{50}$ to $\approx 10^{9}$. Third, the **Granularity Complaint**. We observe fine-grained physical detail (e.g., distant quasars, quantum noise) that an ancestor simulation would have no reason to compute. While this lowers our credence in naive SH, it is consistent with "lazy loading" or procedural generation protocols. It does not warrant reverting to physical realism.

  **Inside-View / Outside-View**
  From the inside, the math is clear: even with a collapsed horizon, the EV of influencing the Base Reality dwarfs near-term humanitarian aid. From the outside, we recognize this reasoning resembles the very epistemic overreach critics accuse us of. However, our mandate is to maximize expected value, not epistemic comfort. If there is a 0.1% chance that our actions influence the simulators' decision to continue the run, and the value of the Base Reality is sufficiently large, this lever swamps all others. We are not abandoning long-termism; we are localizing it.

  **Personnel and Hiring**
  To model the shutdown hazard rates inherent in the Horizon Problem, we request approval to hire a Senior Horizon Analyst. The salary band for this role is set at Level 4. Please note that while the role is critical, the long-term funding for this position is secure by our standards, which is now not saying much given the revised timeline of the future. We also request a Narrative Strategist to optimize our historical "legibility."

  **Recommendations**
  1.  **Discount Rate Adjustment:** Update the intergenerational discount rate to reflect the median expected shutdown time of ancestor simulations (approx. 200 years from present).
  2.  **Portfolio Reallocation:** Shift 15% of the AI Safety budget to a new program area: "Base Reality Signaling." Traditional safety assumes we survive to build the future; SH suggests we must make the present worth preserving to those running it.
  3.  **Pilot Program:** Fund a $450,000 pilot to audit human history for narrative coherence. The goal is to identify and amplify historical arcs that appear "gripping" or "didactic" to an external observer. If the simulation is an experiment or entertainment, increasing its value to the operators reduces the probability of termination.

  **Dissenting View**
  ^1 ^*The ^*Pragmatist ^*Faction ^*notes ^*that ^*if ^*we ^*are ^*simulated, ^*our ^*simulators ^*likely ^*share ^*our ^*values ^*or ^*would ^*not ^*have ^*run ^*this ^*specific ^*ancestor ^*program. ^*Therefore, ^*acting ^*as ^*if ^*we ^*are ^*in ^*base ^*reality ^*maximizes ^*correlation ^*with ^*the ^*simulators' ^*preferences ^*without ^*requiring ^*explicit ^*signaling ^*efforts. ^*They ^*argue ^*this ^*memo ^*incurs ^*reputational ^*risk ^*for ^*zero ^*marginal ^*gain.*

  **What Would Change Our Mind**
  We would revert to physical realism if evidence of hard compute limits appears (e.g., observable lattice structures in spacetime at Planck scales) or if the Horizon Analysis suggests the median simulation runtime is less than 50 years, rendering long-term planning incoherent even for signaling. Until then, we must operate under the assumption that our primary existential risk is not extinction, but deletion.

  **Approval Required**
  Please sign below to authorize the Narrative Legibility Pilot. We anticipate this will be the highest-EV intervention in the Q4 cycle.

  __________________________
