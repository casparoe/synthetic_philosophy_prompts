answer: |-
  # Workshop Design: The Moving Target

  **Duration:** 90 Minutes
  **Participants:** 16 Adults (Divided into 4 groups of 4)
  **Goal:** To physically experience the psychological pressure that causes people to lower their standards or reweight their criteria to justify ending a search.
  **Core Mechanic:** An escalating "search tax" combined with a binding pre-commitment to specific criteria.

  ---

  ## 1. Materials & Setup

  **Room Setup:**
  *   4 tables, spaced apart so groups cannot hear each other's discussions.
  *   1 central "Market Deck" station (or distribute decks to tables).

  **Per Group:**
  *   **1 "Charter Sheet"**: A paper with three blank bars labeled "Dimension A," "Dimension B," and "Dimension C." (See below for definitions).
  *   **10 "Energy Tokens"**: Poker chips, coins, or candies.
  *   **1 "Decision Bell"**: A small desk bell or a smartphone alarm app.
  *   **Pen/Pencil.**

  **Facilitator Materials:**
  *   **4 "Venue Decks"**: Each deck contains 20 cards.
      *   *Card Design:* Each card lists stats for Dimensions A, B, and C (e.g., A: 8/10, B: 3/10, C: 5/10).
      *   *Distribution:* The first 5 cards are high quality. The next 10 are mediocre. The last 5 are terrible. (Participants do not know this distribution).
  *   **Timer.**
  *   **Prize:** A small bag of high-quality chocolates or a $20 gift card (to be awarded to the group that best sticks to their Charter).

  **The Dimensions (Incommensurable):**
  To prevent easy math, use abstract but relatable traits.
  *   **Dimension A (Comfort):** How pleasant the environment is.
  *   **Dimension B (Cost):** How much resource it consumes (Lower number is better).
  *   **Dimension C (Distance):** How far it is from home (Lower number is better).
  *   *Note on Cards:* Each card has a score for A (1-10), B (1-10), and C (1-10).

  ---

  ## 2. Timed Phases & Rules

  ### Phase 1: The Charter (15 Minutes)
  **Goal:** Lock in aspiration levels before the pressure begins.

  1.  **Introduction (5 mins):** Tell participants: *"You are a committee tasked with selecting a Base Camp for a critical project. There are many options, but you have limited energy. Your goal is to find the best fit for YOUR specific needs."*
  2.  **Setting Criteria (10 mins):** Hand out the Charter Sheets.
      *   **Rule:** Each group must agree on a **Minimum Acceptable Score** for each Dimension (A, B, and C).
      *   *Example:* "We will not accept anything below a 7 on Comfort, below a 5 on Cost, and below a 6 on Distance."
      *   **Binding Clause:** They must sign the sheet. Tell them: *"At the end of the workshop, we will check your final choice against this sheet. The group that matches their own Charter most closely wins the prize."*
      *   **Facilitator Note:** Do not explain *why* this matters. Do not mention "standards" or "compromise." Just call it "The Charter."

  ### Phase 2: The Search (35 Minutes)
  **Goal:** Introduce search costs that make continuing painful.

  1.  **The Hand:** Each group starts with 3 Venue Cards face-up.
  2.  **The Tax:**
      *   To draw a **new card** from the deck, the group must pay **1 Energy Token** into a central "Burn Pile."
      *   **Hand Limit:** A group can only hold **5 cards** at once. To draw a 6th card, they must discard one of the existing cards (put it face-down, never to be chosen) AND pay the 1 Token.
      *   **Time Pressure:** Every 5 minutes, the Facilitator rings a bell. *"Market Volatility."* For the next 5 minutes, the cost to draw a card **doubles** (2 Tokens per draw).
      *   *Schedule:*
          *   Min 0-5: Cost 1 Token.
          *   Min 5-10: Cost 2 Tokens (Bell Rings).
          *   Min 10-15: Cost 1 Token.
          *   Min 15-20: Cost 2 Tokens (Bell Rings).
          *   Min 20-25: Cost 3 Tokens (Bell Rings - "Panic Phase").
          *   Min 25-35: Cost 3 Tokens.
  3.  **Stopping:** At any point, a group may ring their Decision Bell. This ends their search immediately. They cannot look at more cards. They must select one card from their current hand.
  4.  **Bankruptcy:** If a group runs out of Energy Tokens, they are forced to stop immediately and must choose from their current hand.

  ### Phase 3: The Decision & Audit (15 Minutes)
  **Goal:** Reveal the discrepancy between intent and action.

  1.  **Selection:** Groups place their chosen Venue Card face-up on the table.
  2.  **The Audit:** Collect the Charter Sheets.
  3.  **Public Comparison:** Project or read out the Charter Requirements vs. the Chosen Card stats for each group.
      *   *Example:* "Group 1 required a Comfort score of 8. They chose a venue with a Comfort score of 5."
  4.  **The Justification:** Ask any group that violated their Charter: *"You signed this requirement. You chose a venue that breaks it. Without using the word 'tired,' explain why this venue is actually acceptable."*
      *   *Note:* Record their explanations on a whiteboard verbatim.

  ### Phase 4: Debrief (25 Minutes)
  **Goal:** Map the experience to the concept of Threshold Drift.

  *(See detailed debrief script below)*

  ---

  ## 3. Facilitator Script & Constraints

  **What to Say (The "Neutral Administrator"):**
  *   *"Your Energy Tokens represent your time, emotional bandwidth, and mental focus. Once they are gone, they are gone."*
  *   *"You may change your mind about which card to pick, up until you ring the bell."*
  *   *"Remember, the prize goes to the group that best honors their signed Charter."*
  *   *(When the Bell Rings for Cost Increase):* *"Market Volatility. Search costs have doubled."*

  **What NOT to Say (The "Forbidden Knowledge"):**
  *   Do not use words like: *Satisficing, Bounded Rationality, Aspiration Level, Opportunity Cost, Sunk Cost, Optimization.*
  *   Do not hint that the deck gets worse later (keep the distribution hidden).
  *   Do not suggest they can change their Charter. (If they ask, "Can we change our requirements?" reply: *"The Charter is your contract. You can break it, but it will affect your standing in the Audit."*)
  *   Do not comfort them when they run low on tokens. Silence creates pressure.

  ---

  ## 4. The Debrief: Mapping Mechanics to Concepts

  **Step 1: The Physical Sensation (5 mins)**
  *   **Ask:** *"Raise your hand if you felt a physical spike of stress when the bell rang and the cost doubled."*
  *   **Ask:** *"Raise your hand if you looked at a card you previously liked, and suddenly decided it wasn't good enough, simply because you had paid tokens to see a new one."*
  *   **Map:** Explain that the **Energy Tokens** were not just points; they were a simulation of **Mental Fatigue**. In real life, searching for an apartment or job drains emotional energy. When that energy gets low, the pain of continuing feels greater than the risk of settling.

  **Step 2: The Audit Reveal (10 mins)**
  *   **Action:** Point to the whiteboard where you wrote their justifications (e.g., "Well, the Cost was so good, we decided Comfort mattered less").
  *   **Map:** This is **Threshold Drift**.
      *   *"At the start, Comfort was a 'Must.' By the end, Comfort became a 'Nice-to-Have.' The venue didn't change. Your tokens didn't change the venue's score. The only thing that changed was your tolerance."*
      *   *"You didn't just stop searching; you rewrote the definition of 'Success' to match the option you were holding."*
  *   **Key Insight:** *"Most people think they stop searching because they found the right thing. Often, we find the right thing because we need to stop searching."*

  **Step 3: The Cost of Continuation (5 mins)**
  *   **Ask:** *"Group 2, you stopped with 4 tokens left. Group 4, you went to zero. How did your final decision feel different?"*
  *   **Map:** Discuss **Fear of Regret**. The groups that ran to zero often felt forced. The groups that stopped early often felt anxiety that they missed out. Both feelings drive the drift.
  *   **Takeaway:** *"The goal isn't to search forever. The goal is to notice when you are changing the rules to make the pain stop."*

  **Step 4: Application (5 mins)**
  *   **Instruction:** *"Next time you are job hunting or apartment hunting, write down your 'Charter' before you start. When you feel ready to stop, check the Charter. If you are violating it, ask yourself: Is this actually a good fit, or am I just out of tokens?"*

  ---

  ## 5. Troubleshooting: What Will Break & How to Fix

  **Problem 1: The "Gamer" Group**
  *   **Symptom:** One group realizes the prize is for sticking to the Charter, so they pick a mediocre card early that matches their Charter perfectly, ignoring the search entirely.
  *   **Why:** They optimized for the workshop prize, not the experience.
  *   **Fix:** During the Audit, highlight this publicly. *"Group 3 stopped after 2 minutes. They honored their Charter, but they also saw only 10% of the options. In real life, this is 'Fear of Search.' Did you feel you made a brave choice, or a safe one?"* Turn their gaming into a data point about risk aversion.

  **Problem 2: The Dominant Voice**
  *   **Symptom:** In a group of 4, one person grabs the tokens and decides when to stop. The others feel no pressure.
  *   **Why:** Social hierarchy overrides the mechanic.
  *   **Fix:** **Rule Tweak:** Require all 4 signatures on the Decision Card. If even one person refuses to sign, the group must pay a "Disagreement Tax" of 3 Tokens to continue. This forces the dominant person to feel the cost of overriding others.

  **Problem 3: No One Violates the Charter**
  *   **Symptom:** The deck distribution was too generous; everyone found a match. No drift occurred.
  *   **Why:** The "Drift" requires scarcity.
  *   **Fix:** **Facilitator Move:** If all groups are happy at the 25-minute mark, announce a **"Policy Change."** *"New regulation: All venues with a Cost score higher than 4 are now ineligible."* This invalidates current choices and forces a frantic re-search with low tokens, guaranteeing drift.

  **Problem 4: Tokens Feel Abstract**
  *   **Symptom:** Participants treat tokens like monopoly money.
  *   **Fix:** Make the loss visceral. When they pay a token, they must physically hand it to you, and you place it in a clear jar where they can see the pile growing. Do not let them keep the tokens on their table. Out of sight, out of mind.

  ---

  ## 6. Limitations: What This Cannot Reproduce

  **1. The Irreversibility of Commitment**
  *   **Limitation:** In this workshop, choosing the wrong venue costs a chocolate bar. In real life, signing a lease or taking a job carries months or years of consequence. The "pain" here is simulated; the real pain of a bad life decision is existential.
  *   **Facilitator Patch:** In the closing remarks, state: *"Today, your worst-case scenario was losing a prize. In reality, the 'Energy Tokens' you spend are days of your life, months of rent, or years of career trajectory. The drift feels the same, but the stakes are permanent. That is why catching the drift early is critical."*

  **2. The Social/Emotional Weight of "Settling"**
  *   **Limitation:** Participants may laugh off violating their Charter. They won't feel the shame or resignation of telling a spouse, "I know this apartment is noisy, but it's all we can find."
  *   **Facilitator Patch:** During the "Justification" phase, do not allow laughter. If a group makes a joke about their criteria, ask them to restate it seriously. *"Say that again as if you were explaining it to a partner who wanted the original criteria."* This re-introduces the interpersonal tension.

  **3. The Long-Term Feedback Loop**
  *   **Limitation:** The workshop ends immediately after the choice. Participants don't experience the "buyer's remorse" that often follows threshold drift.
  *   **Facilitator Patch:** Assign "Homework." *"For the next week, notice one time you say 'It's fine' when you mean 'It's not what I wanted.' Write it down. That is the drift continuing after the search stops."*

  ---

  ## 7. Summary of Facilitator Mindset

  You are not a teacher; you are a **mirror**.
  *   Do not explain the theory until they have lived the contradiction.
  *   Do not rescue them when they run out of tokens.
  *   Do not validate their rationalizations during the Audit.
  *   Let the silence after they admit they broke their own rules do the teaching.
