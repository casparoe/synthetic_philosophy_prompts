  *Check:* "Token system"? Yes, Energy Chips.
  *Check:* "Incommensurable dimensions"? Yes, Cost vs. Comfort vs. Location.
  *Check:* "Accumulating hidden search cost"? I'll make the cost visible but the *end point* hidden (unknown deck depth). Or better: The cost increases. Round 1: 1 token. Round 2: 2 tokens. Round 3: 4 tokens. This creates panic.

  *Let's refine the "Search Cost":*
  It shouldn't be time-based (facilitator burden). It should be action-based.
  Every time you draw a new card, you pay 1 Token.
  You can hold max 3 cards.
  To draw a 4th, you must discard one AND pay 1 Token.
  This simulates the mental load of keeping options open.

  *Okay, this is solid.*
  *Wait, one nuance:* "Threshold Drift" implies the criteria change.
  *Activity Tweak:* At the start, they set a "Minimum Acceptable Score" for each category.
  At the end, we check if they met it.
  If not, ask: "Did the category change importance, or did the score requirement change?"

  *Final Plan:*
  **Workshop Name:** The Moving Target.
  **Scenario:** Selecting a "Team Base" (Abstract enough to apply to jobs/apartments).
  **Groups:** 4 groups of 4.
  **Materials:** Criteria Sheets, Energy Tokens, Venue Cards.
  **Mechanic:** Pay to look. Pay to hold. Penalty for violating own criteria.
