  *Implementation:* The "Venue Cards" are hidden in a deck. They don't know what's coming next.
  *Hidden Search Cost:* They don't know exactly how many tokens they will lose per round, or the deck size is unknown.
  *Actually:* Let's make the Search Cost visible but painful. 1 Token per minute.
  *Hidden Info:* The quality of future cards is unknown.

  *Let's finalize the "Drift" trigger:*
  Give them a "Criteria Card" they must sign.
  Give them "Energy Tokens" (10 each).
  Every 2 minutes, they pay 2 tokens.
  They draw "Venue Cards."
  They must stop before tokens run out.
  If they pick a Venue that violates their Signed Criteria, they are "Eliminated" from the prize draw *unless* they can convince the room it wasn't a violation. (This forces the rationalization/warping).

  *Wait, simpler:* Just compare the Signed Criteria to the Final Choice in the debrief. The "Stakes" are just the candy. The "Learning" is the comparison.

  *Okay, ready to write.*

