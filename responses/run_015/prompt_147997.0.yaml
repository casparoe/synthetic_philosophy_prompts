answer: |-
  **Dialectical Map: Practical Factors in Knowledge**

  **Introduction**
  Start from the shared commitment: competent speakers' willingness to attribute knowledge varies with stakes, holding evidence and truth fixed, unexplained by carelessness. This tree sorts views by their response to cases rather than labels. Technical glosses appear beside nodes. Nodes marked [E] depend on unresolved empirical data about ordinary usage.

  **The Decision Tree**

  **Node 1:** Is this variation a systematic mistake speakers make?
  *Case:* Experts confirm evidence suffices yet deny knowledge in high stakes.
  *Gloss:* Error Theory vs. Real Variation.
  *Flag:* [E]

  **Node 2:** Does the variation track the subject's situation or the speaker's?
  *Case:* Unaware technician vs. seminar speaker discussing history.
  *Gloss:* Subject-Sensitivity vs. Attributor-Sensitivity.

  **Node 3:** (If Subject) Must the subject appreciate the stakes?
  *Case:* Technician logs reading unaware system acts on it.
  *Gloss:* Accessibility Requirement.

  **Node 4:** (If Subject) Does the change affect truth or merely proper assertion?
  *Case:* Stakes raised after belief formed; correction 'You are wrong' vs 'You should not say that'.
  *Gloss:* Semantic vs. Pragmatic Shift.

  **Node 5:** (If Subject) Do moral costs raise the bar like financial ones?
  *Case:* Wronging someone vs. Losing money.
  *Gloss:* Moral Encroachment.

  **Node 6:** (If Subject) Do many trivial risks combine to raise the bar?
  *Case:* 200 trivial judgements daily; errors accumulate.
  *Gloss:* Aggregation View.
  *Flag:* [E]

  **Node 7:** (If Subject) Does the shift extend to justification or evidence?
  *Case:* Same evidence, different justification attributed.
  *Gloss:* Encroachment on Justification.

  **Node 8:** (If Speaker) Do conflicting speakers contradict each other?
  *Case:* Low-stakes says 'Knows', high-stakes says 'Doesn't'.
  *Gloss:* Relativism vs. Contextualism.

  **Node 9:** (If Speaker) Does the content shift or the assessment standard?
  *Case:* Proposition vis-à-vis contrast vs. Truth relative to context.
  *Gloss:* Contrastivism vs. Relativism.

  **The Leaves (1–14)**
  *Each leaf includes: Characterisation, Label, Awkward Commitment. Path key included.*

  1.  **Path 1-Yes.** Variation is mistaken; evidence fixes knowledge. (Purist Invariantism). Awkward: Must explain away robust linguistic intuition as error.
  2.  **Path 1-No, 2-Subject, 3-Yes, 4-Truth, 5-No, 6-No, 7-No.** Subject's stakes raise truth bar only if known. (Subject-Sensitive Invariantism w/ Accessibility). Awkward: Knowledge vanishes when stakes rise unnoticed.
  3.  **Path 1-No, 2-Subject, 3-No, 4-Truth, 5-No, 6-No, 7-No.** Stakes raise truth bar behind subject's back. (Subject-Sensitive Invariantism no Accessibility). Awkward: Subject loses knowledge unknowingly.
  4.  **Path 1-No, 2-Subject, 3-Yes, 4-Use, 5-No, 6-No, 7-No.** Stakes affect when one may claim knowledge, not truth. (Pragmatic Encroachment w/ Accessibility). Awkward: Distinction between knowing and asserting knowledge collapses.
  5.  **Path 1-No, 2-Subject, 3-No, 4-Use, 5-No, 6-No, 7-No.** Stakes affect assertion norms regardless of subject's awareness. (Pragmatic Encroachment no Accessibility). Awkward: Norms shift without agent's rational access.
  6.  **Path 1-No, 2-Subject, 4-Truth, 5-Yes.** Moral harm raises bar independently of financial loss. (Moral Encroachment). Awkward: Epistemic status depends on moral facts external to evidence.
  7.  **Path 1-No, 2-Subject, 4-Truth, 5-No, 6-Yes.** Volume of trivial judgements raises bar despite low individual stakes. (Aggregation View). **Status: Unexplored.** Awkward: Requires counting daily judgements to assess knowledge.
  8.  **Path 1-No, 2-Subject, 7-Yes.** Shift affects justification or evidence, not just knowledge. (Encroachment on Justification). **Status: Thinly Occupied.** Awkward: Blurs line between epistemic and practical rationality.
  9.  **Path 1-No, 2-Subject, 4-Use, 5-Yes, 6-Yes.** Moral and aggregation factors affect assertion norms only. (Pragmatic Moral Aggregation). **Status: Unoccupied.** Awkward: Complex normative web with no truth-conditional payoff.
  10. **Path 1-No, 2-Speaker, 8-Yes, 9-Assessment.** Speakers contradict; truth is relative to assessor. (Relativism). Awkward: No fact of the matter on who is right.
  11. **Path 1-No, 2-Speaker, 8-No, 9-Content.** Speakers do not contradict; content shifts with context. (Contextualism). Awkward: 'Knows' changes meaning constantly.
  12. **Path 1-No, 2-Speaker, 8-No, 9-Contrast.** Content shifts relative to contrasted alternatives. (Contrastivism). Awkward: Knowledge always incomplete without specified contrast.
  13. **Path 1-No, 2-Speaker, 8-Yes, 9-Content.** Speakers contradict due to content shift. (Content Relativism). **Status: Incoherent.** Awkward: Contradiction requires shared content.
  14. **Path 1-No, 2-Speaker, 8-No, 4-Use.** Variation explains proper assertion only, not truth. (Pragmatic Invariantism). Awkward: Fails to explain why we deny knowledge itself, not just assertion.

  **Coverage and Indistinguishability**

  | Path | View | Status |
  | :--- | :--- | :--- |
  | 1-Yes | Purist Invariantism | Occupied |
  | 2-Sub, 3-Yes, 4-Truth | Subject-Sensitive (Access) | Occupied |
  | 2-Sub, 3-No, 4-Truth | Subject-Sensitive (No Access) | Occupied |
  | 2-Sub, 4-Use | Pragmatic Encroachment | Occupied |
  | 2-Sub, 5-Yes | Moral Encroachment | Occupied |
  | 2-Sub, 6-Yes | Aggregation View | **Unexplored** |
  | 2-Sub, 7-Yes | Justification Encroachment | **Thinly Occupied** |
  | 2-Sub, 5/6-Yes, 4-Use | Pragmatic Moral Agg. | **Unoccupied** |
  | 2-Spk, 8-Yes, 9-Assess | Relativism | Occupied |
  | 2-Spk, 8-No, 9-Content | Contextualism | Occupied |
  | 2-Spk, 8-No, 9-Contrast | Contrastivism | Occupied |
  | 2-Spk, 8-Yes, 9-Content | Content Relativism | **Incoherent** |
  | 2-Spk, 8-No, 4-Use | Pragmatic Invariantism | Occupied |

  **Indistinguishable Pairs:**
  1.  *Contextualism (11) vs. Pragmatic Invariantism (14).* Both deny contradiction. Separation requires a case where speakers insist they are disagreeing about truth, not just propriety. Inseparable given current cases.
  2.  *Relativism (10) vs. Content Relativism (13).* Both accept contradiction. Separation requires data on whether 'knows' changes content or truth-value. Inseparable in principle without semantic theory.

  **Profile Walkthroughs**

  1.  **The Purist:** Thinks knowledge is fixed by evidence and truth.
      *   *Path:* Rejects the shared commitment at Node 1 (views variation as error).
      *   *Lands:* Leaf 1 (Purist Invariantism).
      *   *Result:* Denies the datum; stakes are irrelevant to knowledge itself.

  2.  **The Subject-Stakes Theorist:** Thinks the subject's own stakes raise the bar.
      *   *Path:* Accepts Node 1 (Real). Node 2 (Subject). Node 3 (Yes/No depending on view). Node 4 (Truth).
      *   *Lands:* Leaf 2 or 3 (Subject-Sensitive Invariantism).
      *   *Result:* Knowledge truth-conditions shift with the subject's practical situation.

  3.  **The Aggregation Theorist:** Thinks volume of decisions matters.
      *   *Path:* Accepts Node 1 (Real). Node 2 (Subject). Node 6 (Yes).
      *   *Lands:* Leaf 7 (Aggregation View).
      *   *Result:* **Flagged as Unexplored.** View suggests standard rises with volume of decisions even though no single decision is high-stakes.

  **Note on Empirical Flags:** Nodes 1 and 6 are marked [E] because they rely on data about whether speakers perceive error or aggregate risk, which remains experimentally contested.
