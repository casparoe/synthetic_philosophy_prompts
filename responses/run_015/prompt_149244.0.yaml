answer: |-
  This is a fantastic question that cuts to the heart of late medieval psychology and metaphysics. You have spotted a genuine tension in the text, and your friend's objection is sophisticated, though it might be projecting a specific Thomistic framework onto Buridan's more nominalist/voluntarist position.

  Here is a breakdown of what Buridan is actually claiming, how he resolves the "tie-breaking" problem, and an evaluation of your friend's "formal object" hypothesis.

  ### 1. What Buridan Actually Says (The Textual Reality)
  First, a necessary correction to the pop-culture myth: **Buridan does not claim the ass starves.**

  In his *Quaestiones super decem libros Ethicorum Aristotelis* (Questions on Aristotle's Ethics), specifically Book III, Question 5, Buridan addresses the scenario. His conclusion is that a rational agent (a human) will **not** remain frozen, and even an animal would likely not starve due to physiological fluctuations.

  Buridan's solution to the paradox relies on the distinction between the **Intellect** and the **Will**:
  *   **The Intellect** is determined by the object. If two things appear perfectly equal in goodness, the intellect cannot judge one as better.
  *   **The Will**, however, is not purely passive. It has the power of *self-motion* (a key Scotist influence on Buridan).

  **Does he allow arbitrary tie-breaking?**
  Buridan tries to walk a tightrope here. He wants to avoid saying the will acts *irrationally* (without reason), but he also wants to avoid saying the will is *determined* by the intellect.

  His solution is usually twofold:
  1.  **Deferral:** The will can command the intellect to suspend judgment and deliberate further. In doing so, the intellect often finds a minute difference it missed before (e.g., "This bale is slightly closer," or "I have a slight bodily inclination toward the left").
  2.  **The Good of Action:** If the options remain truly equal, the will can introduce a *new consideration*: the evil of delay. Starvation is a greater evil than choosing the "wrong" bale. Therefore, the will chooses *to choose*.

  So, to answer your first question: **Buridan does not think the will moves without *any* reason, but he does think the will can *generate* the reason for breaking the tie.** It is not "arbitrary" in the sense of random noise; it is "self-determined" in the sense that the will decides that *making a choice* is itself a good to be pursued.

  ### 2. Evaluating Your Friend's "Formal Object" Claim
  Your friend argues that the scenario is a **category mistake** based on **formal causation**: *The will needs a formal object to act; if the objects are identical, there is no formal cause for a specific act of volition; therefore, the scenario is metaphysically impossible.*

  **Is this anachronistic?**
  No. The terminology is authentic. The concept of the *objectum formale* (formal object) is standard Scholastic metaphysics (used by Aquinas, Scotus, and Buridan). The idea is that every power is defined by what it aims at (Sight $\to$ Color, Intellect $\to$ Truth, Will $\to$ Good).

  **Does it make sense of the passage?**
  This is where your friend's reading is interesting but potentially misses Buridan's specific point.

  *   **The Strength of the Friend's Point:** It accurately reflects an **Intellectualist** critique (common in Thomism). If the Will is a rational appetite, it must appetite *something under the aspect of good*. If Bale A and Bale B are identical in "goodness," there is no formal distinction to cause a preference for A over B. To claim the will chooses A anyway looks like an effect without a sufficient cause.
  *   **The Weakness regarding Buridan:** Buridan is a **Voluntarist** (following Scotus). He explicitly rejects the idea that the will is determined by the formal object in the same way gravity is determined by mass. For Buridan, the will is a *self-mover*.
      *   If your friend says, "Volition cannot happen without a formal cause," Buridan would reply: "The formal cause is 'the Good.' Both bales are 'the Good.' The will's *own power* is the efficient cause that selects *which* good to pursue."
      *   Your friend's reading treats the lack of distinction as a metaphysical impossibility. Buridan treats it as a psychological challenge that the will's freedom overcomes.

  **Verdict on the Friend:** Your friend is using real medieval tools, but they are using them to argue *against* Buridan's position, not to explain it. They are essentially reconstructing a Thomistic objection to Buridan. It is not anachronistic, but it is **rival metaphysics**. It denies the premise of Buridan's solution (that the will can self-move) rather than parsing Buridan's actual claim.

  ### 3. Parsing the "Reason vs. Self-Motion" Tension
  You noted a contradiction: *The will determines itself... but reason ought to suspend choice.*

  Buridan resolves this by distinguishing between **Speculative Reason** and **Practical Reason**.
  *   **Speculative:** "Are these bales equal?" Answer: "Yes."
  *   **Practical:** "Ought I to eat?" Answer: "Yes."

  Buridan argues that the will is not bound to follow the speculative judgment of equality. It follows the *practical* judgment that action is necessary. When Buridan says the will "determines itself," he means it has the power to **command the intellect** to stop looking for differences and proceed to action.

  So, is it arbitrary?
  *   **No,** because it is motivated by the practical good of avoiding starvation/inaction.
  *   **Yes,** in the sense that there is no *intrinsic* difference in the bales that forces the choice. The "tie-breaker" comes from the agent's need to act, not the objects' properties.

  ### Summary for Your Understanding
  1.  **Buridan's Stance:** The ass/human does not starve. The will is a self-mover that is not strictly determined by the intellect's judgment of equality.
  2.  **The Mechanism:** The will breaks the tie either by finding a minute difference (through further deliberation) or by prioritizing the *act of choosing* over the *perfection of the choice* (to avoid the evil of delay).
  3.  **Your Friend's Point:** It uses authentic medieval metaphysics (formal objects), but it represents an **Intellectualist critique** of Buridan, not an explanation of Buridan's own view. Buridan explicitly argues that the will *can* move even when the formal objects are equal, because the will's freedom is a causal power in its own right.

  **Recommendation:** If you want to press your friend, ask them: *"If the formal object is just 'the Good,' and both bales are 'Good,' doesn't the condition for volition exist? Why does the specific selection require a difference in the object rather than a determination by the agent?"* That gets to the heart of the Voluntarist (Buridan) vs. Intellectualist (Aquinas/Friend) debate.

  **Primary Source Reference:** *Johannis Buridani Quaestiones super decem libros Ethicorum Aristotelis ad Nicomachum*, Lib. III, Quaest. 5. (Look for the discussion on *liberum arbitrium* and the example of the hungry man/ass).
