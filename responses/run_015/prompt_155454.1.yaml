answer: |-
  Here is a teaching plan designed for a 40-minute whiteboard session with a skeptical economist.

  ### 1. The Dependency Structure

  Do not follow the textbook order (Poset $\to$ Chain $\to$ Bound $\to$ Lemma). Follow the **Conceptual Necessity** order. If you define Zorn's Lemma before he understands "Maximal," he will interpret it as "Maximum" and reject it as false (since "best" policies rarely exist). If you define "Upper Bound" without emphasizing "In The Set," the Finite Subsets example will make no sense.

  **The Sequence:**
  1.  **Partial Order (via Preferences):** Start here. He knows this. $A \succeq B$. Reflexive, Transitive, Antisymmetric.
      *   *Why:* Anchors the abstraction in his domain.
  2.  **Chain:** A subset where every pair is comparable (a "consistent" subset of preferences).
      *   *Why:* Needed to state the hypothesis.
  3.  **Upper Bound (The Critical Definition):** An element $u$ such that $x \le u$ for all $x$ in the chain.
      *   *The Hammer:* You must explicitly write **$u \in P$** (the poset) on the board and circle it.
      *   *Why:* This is the specific point where the "dodge" accusation fails. If the bound can be outside, the lemma is trivial. If it must be inside, the lemma is powerful but conditional.
  4.  **Maximal vs. Maximum:** **Stop here.** Do not state the Lemma yet.
      *   *Definition:* Maximum is greater than *everyone*. Maximal is greater than *no one* (nothing is greater than it).
      *   *Board Picture:* Draw a Hasse diagram with two peaks (e.g., $\{1,2\}$ and $\{1,3\}$ inside the power set of $\{1,2,3\}$). Point to the peaks. "These are maximal. Neither is maximum."
      *   *Why:* If you skip this, he will hear "Zorn's Lemma guarantees a best policy." He knows that's false. He will tune out. You must establish that ZL guarantees a *non-dominated* policy, which is plausible.
  5.  **Zorn's Lemma Statement:** "If every chain has an upper bound **in the set**, there exists a maximal element."
  6.  **The Example:** (See Section 2).

  **What breaks if reordered:**
  *   If **Maximal** comes after **Lemma**: He will assume "Maximal" means "Maximum." He will immediately object that complete orderings aren't unique or best options don't exist. You will spend the rest of the session fighting a definition error.
  *   If **Bound $\in$ Set** is not isolated: When you show the Finite Subsets example, he will say "But the union exists!" You need the definition pre-loaded so he sees the union exists *outside* the poset, violating the specific condition you circled earlier.

  ### 2. The One Example

  **Verdict:** Your instinct is correct. Use **Finite Subsets of $\mathbb{N}$ ordered by Inclusion**.
  Do not use vector spaces. Do not use the preference application as the *example* (use it as the *motivation*). The preference application is too vague for a logic check; the Finite Subsets example is rigorous and visible.

  **What the example must contain:**
  *   **The Poset:** $P = \{ S \subseteq \mathbb{N} \mid S \text{ is finite} \}$.
  *   **The Chain:** $C = \{ \{1\}, \{1,2\}, \{1,2,3\}, \dots \}$.
  *   **The "Obvious" Bound:** The union, $\mathbb{N}$.
  *   **The Failure:** $\mathbb{N}$ is not finite. Therefore $\mathbb{N} \notin P$.
  *   **The Conclusion:** The hypothesis of Zorn's Lemma is **false** for this poset. Consequently, there is **no maximal element** (you can always add one more number).

  **What it must not contain:**
  *   Do not discuss cardinalities beyond "finite vs. infinite."
  *   Do not discuss *other* chains (e.g., chains that stop). Stick to the one that breaks.

  **How to bridge to Economics:**
  Once the logic is established on the board, map it back: "In your seminar, the 'sets' were partial preference orderings. The 'union' was the combined preference. The speaker's job was to show that combining consistent preferences doesn't create a contradiction (i.e., the bound stays *in* the set of valid preferences). If they didn't check that, *then* it was a dodge. Zorn's Lemma forces you to check that."

  ### 3. The Misconception Map

  Here is where the misconceptions will arise and exactly how to kill them on the whiteboard.

  | Misconception | When it appears | The Kill Move (Board/Speech) |
  | :--- | :--- | :--- |
  | **"Maximal means Best/Maximum"** | During Definitions (Step 4 above). | **Board:** Draw the "Two Peaks" Hasse diagram. **Speech:** "Maximal means 'nobody beats me,' not 'I beat everybody.' ZL promises you a survivor, not a champion." |
  | **"This is just Induction"** | When explaining why we need ZL. | **Board:** Draw a ladder with rungs $1, 2, 3 \dots$ (Induction). Next to it, draw a "smooth ramp" or a ladder with uncountably many rungs. **Speech:** "Induction lets you climb $\omega$ steps. ZL lets you climb *any* height, provided you don't fall off the top. If the chain is too long, induction runs out of numbers." |
  | **"The Bound can be outside"** | During the Finite Subsets Example. | **Board:** Circle the condition $u \in P$ from Step 3. Point to $\mathbb{N}$. **Speech:** "The union exists in the universe of sets, but not in *this* poset. ZL requires the ceiling to be inside the room." |
  | **"AC is obvious, so ZL is obvious"** | When discussing truth/axioms. | **Speech:** "AC says you can pick. ZL says a peak exists. Picking is a process; Peaking is a state. You can't construct the peak step-by-step. That's why we need the Axiom." |
  | **"ZL gives *The* Answer"** | At the very end. | **Speech:** "ZL says *a* maximal element exists. In preferences, there are many complete extensions. ZL doesn't tell you which one is 'right,' just that you don't have to settle for incomplete." |

  ### 4. Where the Word "Axiom" Should First Be Spoken

  **Timing:** Immediately after stating Zorn's Lemma, *before* moving to the example.

  **The Script:**
  "You asked if this is cheating. This statement is called a Lemma, but mathematically it is equivalent to the **Axiom of Choice**. It cannot be proven from standard set theory alone. It is a rule we choose to play by."

  **The Honest Answer (40-minute version):**
  "Is it true? It depends on the foundation of math you accept. If you accept that you can pick an element from each of infinitely many boxes (AC), then Zorn's Lemma is true. It is not a 'dodge' because it has a strict hypothesis (the chain condition). It is not 'obvious' because it asserts existence without construction. Using it isn't cheating, it's declaring that you are working in a system where non-constructive existence is allowed."

  **Why here?** If you wait until the end, he will feel you hid the "non-constructive" nature during the explanation. If you say it at the start, he won't understand the Lemma yet. Middle is best: Statement $\to$ Axiom Warning $\to$ Example.

  ### 5. What to Openly Refuse to Explain

  Write this list on the corner of the board at the start. Tell him: *"These are the rabbit holes. We are not going down them today."*

  1.  **The Proof:** "Proving ZL from AC requires 'Transfinite Induction' and 'Ordinals.' That is a different language. We are using ZL, not building it."
  2.  **Equivalence:** "I won't prove ZL implies AC. It's true, but it won't help you evaluate the seminar speaker."
  3.  **Independence:** "I won't discuss models of set theory where ZL is false. For economics, we work in standard ZFC."

  **Sanity Check:** This list is correct. Explaining the proof requires ordinals, which violates his background constraints. Discussing independence violates the 40-minute limit and distracts from the "Is it a dodge?" question.

  ### 6. The Closing Check

  Do not ask "Does this make sense?" He will nod. Give him a specific poset and ask for a verdict.

  **The Task:**
  Draw the **Open Interval $(0, 1)$** on the number line.
  Define the order as standard $\le$.
  **Ask:** "Does Zorn's Lemma apply here? If yes, point to a maximal element. If no, tell me which condition fails."

  **Correct Answer:**
  "Zorn's Lemma does **not** apply. The chain $(0.1, 0.9), (0.01, 0.99) \dots$ (or simply a sequence approaching 1) has an upper bound (1), but $1 \notin (0, 1)$. The hypothesis fails. There is no maximal element."

  **Characteristic Near-Miss (The "Slogan" Answer):**
  "There is no maximal element, so Zorn's Lemma is false."
  *Diagnosis:* He thinks ZL promises a maximal element *always*, rather than *conditionally*. He missed the hypothesis.

  **Alternative Near-Miss (The "Induction" Answer):**
  "You can keep picking numbers closer to 1 forever, so you never stop."
  *Diagnosis:* He is thinking procedurally (induction) rather than structurally (bounds).

  **Why this task?**
  It mirrors the Finite Subsets example (bound exists outside) but uses a continuous domain he knows well. It forces him to check the **Hypothesis** (Bound $\in$ Set), which is the specific mechanism that prevents ZL from being a "dodge." If he identifies that the bound is outside, he understands the machinery.
