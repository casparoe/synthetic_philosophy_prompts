  2.  **Deconstruct the Philosophical Content:**
      *   **The Core Debate:** Jaegwon Kim's Causal Exclusion Argument vs. Non-Reductive Physicalism (NRP).
      *   **Kim's Position:** If physical causation is closed (every physical effect has a sufficient physical cause), and mental properties are distinct from physical properties (non-reductive), then mental properties are epiphenomenal (causally redundant). To save mental causation, one must reduce mental properties to physical properties.
      *   **NRP Position:** Mental properties are distinct but still causally efficacious. Strategies include:
          *   Interventionism (Woodward): Causation is about manipulation/invariance, not production/overdetermination.
          *   Powers/Ontology (Mumford, Bird, etc.): Properties are powers; mental properties are higher-order powers realized by lower-order powers.
          *   Counterfactual dependence.
      *   **Agreed Claims:** Both are physicalists (mostly). Both agree on supervenience (usually). Both agree closure is plausible. Both agree exclusion is a serious problem.
      *   **Disagreements:** The definition of causation, the nature of "sufficiency," whether overdetermination is vicious, whether realization implies identity.
      *   **Cruxes:**
          1.  *Redundancy vs. Realization:* Does the physical base doing all the work leave room for the mental?
