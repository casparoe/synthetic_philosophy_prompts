          *   Better: Both agree that the exclusion problem is the central hurdle for NRP. Both agree that systematic overdetermination is implausible.
          *   Let's refine:
              1.  Mind-Body Supervenience (physical fixity entails mental fixity).
              2.  Causal Closure of the Physical (physical events have sufficient physical causes).
              3.  No Systematic Overdetermination (effects aren't routinely caused by two independent sufficient causes).
              4.  The Exclusion Argument is valid (if 1-3 hold and mental != physical, mental is epiphenomenal).
      *   **Section 2: Disagreements Table:**
          *   Columns: Issue, Exclusionist Formulation, Non-Reductive Formulation.
          *   Rows: Nature of Causation, Status of Mental Properties, Solution to Exclusion.
      *   **Section 3: Cruxes (with Cases/Predictions):**
          *   Crux 1: Realization vs. Competition.
              *   Case: Pain -> Withdrawal.
              *   Exclusionist Prediction: Only C-fibers cause withdrawal; pain is inert unless identical to C-fibers.
