answer: |-
  # Workshop Activity: The Consistency Ratchet

  **Target:** 9 Grad Students (Philosophy of Rationality)
  **Time:** 90 Minutes
  **Core Concept:** *Sequential Doxastic Consistency.*
  **Niche Framing:** Standard rationality dictates cutting sunk costs. However, epistemic agents are bound by **Sequential Consistency**: to maintain status as a "reliable knower," one must defend the resource-allocation decisions generated by prior knowledge claims. Abandoning a bid isn't just losing points; it is retroactively invalidating the epistemic labor that generated the bidding power. This creates a **Doxastic Lock-In** where rational agents escalate commitment to preserve the coherence of their intellectual identity.

  ---

  ## 1. Materials Needed
  *   **Cred Tokens:** 100 small paper slips (or poker chips). Two colors: *Blue* (Liquid Cred) and *Red* (Warrant Tokens).
  *   **Claim Cards:** 9 index cards, each with a mild, defensible philosophical claim (e.g., "Externalism about content is plausible," "Moral luck exists," "Bayesian updating is normative").
  *   **The Prize:** One Gold Star sticker on a card labeled **"The Arbiter"** (Winner gets to choose the 10-min break snack/topic for the next session).
  *   **The Ledger:** A whiteboard to track public bids and remaining Cred.
  *   **Retraction Slips:** Small red slips of paper.

  ## 2. Group Roles & Setup
  *   **The Facilitator (You):** The "Market Maker." You hold the bank and enforce rules.
  *   **The Agents (9 Students):** Epistemic actors.
  *   **Seating:** Arranged in a circle to maximize social visibility.

  ## 3. Round Structure

  ### Phase 1: Epistemic Endowment (30 Minutes)
  *Goal: Create sunk costs before the auction begins.*
  1.  **Distribution:** Hand each student a **Claim Card** and 5 **Red Warrant Tokens**.
  2.  **Task:** They have 10 minutes to prepare a 2-minute defense of their claim.
  3.  **Defense:** Each student presents. The group votes (majority rules) on persuasiveness.
  4.  **Payoff:**
      *   **Pass:** Receives 20 **Blue Cred Tokens**.
      *   **Distinction (Top 3):** Receives 40 **Blue Cred Tokens**.
      *   *Constraint:* To bid in Phase 2, you must attach one **Red Warrant Token** to your bid. This links the bid to your Phase 1 argument.

  ### Phase 2: The Consistency Auction (30 Minutes)
  *Goal: Escalation via Doxastic Lock-In.*
  1.  **The Prize:** **"The Arbiter"** status (worth 50 Blue Cred in prestige/utility).
  2.  **The Rules (Shubik Modified):**
      *   Open cry auction. Bids in increments of 5.
      *   **Winner:** Highest bidder gets The Arbiter status + 50 Blue Cred.
      *   **The Losers:** The **Top 3 Bidders** (1st, 2nd, 3rd) *all* pay their final bid amount to the House (tokens removed from play). Only 1st gets the prize.
      *   **The Warrant Rule (The Niche Mechanic):** Every bid requires surrendering one **Red Warrant Token**.
          *   If you **Win**: Your Warrant is returned + stamped "Validated."
          *   If you **Pay but Lose** (2nd or 3rd place): Your Warrant is **Retracted**. You must publicly sign a **Retraction Slip** stating: *"My Phase 1 argument did not warrant this allocation of resources."*
  3.  **The Exit Cost:** You may withdraw from bidding at any time *before* you are outbid. However, if you withdraw after placing at least one bid, you must surrender **half your remaining Blue Cred** as a "Consistency Tax" (simulating the reputational cost of flip-flopping).

  ### Phase 3: Settlement & Scoring (10 Minutes)
  *   Count remaining Blue Cred.
  *   Collect Retraction Slips.
  *   Announce the "Arbiter."

  ---

  ## 4. Payoff Scheme & Win/Loss Conditions

  | Outcome | Cred Change | Warrant Status | Social/Epistemic Consequence |
  | :--- | :--- | :--- | :--- |
  | **Winner** | +50 (Prize) - Bid | **Validated** | High Status. Argument "proven" robust. |
  | **2nd/3rd Place** | - Bid (Lost) | **Retracted** | **High Cost.** Must sign slip admitting poor judgment on Phase 1 argument. |
  | **Early Quitter** | -50% Current Holdings | Returned | **Medium Cost.** Labeled "Inconsistent" on the Ledger. |
  | **Non-Bidder** | 0 | Returned | **Low Cost.** Labeled "Cautious/Peripheral." |

  **Win Condition:** Highest Net Cred + Arbiter Status.
  **Loss Condition:** Signing a Retraction Slip (Epistemic Incoherence).

  ---

  ## 5. The Debrief (20 Minutes)
  *Map the experience to theory.*

  1.  **Shubik Mechanics:** Point out that once two students hit bids of 30+ for a 50-point prize, the math forces escalation. If Bidder A is at 40 and Bidder B at 45: A loses 40 if they stop. Bidding 50 means breaking even (if they win). Bidding 55 means losing 5, which is better than losing 40.
  2.  **Doxastic Escalation (The Niche Frame):**
      *   Ask the 2nd/3rd place bidders: *"Why didn't you quit at 20?"*
      *   They will likely say: *"I didn't want to waste the Warrant,"* or *"I didn't want to sign the Retraction Slip."*
      *   **The Lesson:** In standard Dollar Auctions, you lose money. Here, you risked **Epistemic Integrity**. The "Consistency Tax" and "Retraction Slip" made backing out a confession that your earlier reasoning (Phase 1) was flawed.
      *   **Concept:** **Sequential Consistency.** Rational agents should maximize utility *now*. But social/epistemic agents maximize *narrative coherence*. You escalated to avoid the narrative of "The person who wasted their own good argument."
  3.  **Common Knowledge of Rationality:** Everyone knew the trap. But everyone knew everyone else was bound by the Warrant Rule. The escalation wasn't ignorance; it was a **shared commitment to a losing norm** to preserve individual standing.

  ---

  ## 6. Limitations (Be Frank)
  Tell the students explicitly what this simulation *cannot* do:
  1.  **No Actual Ruin:** Losing paper tokens doesn't impact their PhD funding or career. The "pain" is simulated social awkwardness, not existential threat.
  2.  **Short Time Horizon:** Real escalation happens over years (e.g., a research program). This compresses decades into 30 minutes, removing the "slow boil" psychological effect.
  3.  **Identity Fusion:** In the real world, your theory *is* you. Here, the Claim Card was assigned. They can distance themselves from it easier than they could from their own dissertation topic.

  ---

  ## 7. Predicted Failure Modes & Fixes

  ### Failure 1: Collusion ("Let's all bid 5 and split")
  *   **Why:** Grad students are game-theorists. They will spot the Shubik trap immediately in Phase 2.
  *   **Fix:** **Information Asymmetry.** Do not reveal the "Top 3 Pay" rule until *after* the first bid is placed. Reveal Phase 2 rules only after Phase 1 endowments are distributed. By the time they know 2nd/3rd place pay, someone has already bid a Warrant.
  *   **Secondary Fix:** Randomize Endowments. Give one student 80 Cred and others 20. The "Rich" student can bully the auction, breaking collusion.

  ### Failure 2: Early Opt-Out ("I'm not playing this")
  *   **Why:** They recognize the trap and refuse to engage to signal superiority.
  *   **Fix:** **Frame Phase 2 as Evaluation.** Tell them Phase 2 is "Assessing the robustness of Phase 1 arguments under pressure." Non-participation is framed as "Refusal to subject claims to stress testing," which carries its own subtle social cost in a philosophy workshop.
  *   **Rule Tweak:** If a student places *zero* bids, they cannot speak during the Debrief (The "Silenced Observer" rule). This leverages their desire to contribute to the discussion.

  ### Failure 3: Meta-Gaming the Retraction
  *   **Why:** A student signs the Retraction Slip ironically, treating it as a joke.
  *   **Fix:** **Facilitator Seriousness.** You must treat the Retraction Slip as a formal record. "Please sign and date this. We will keep this in the workshop archive." If you treat it bureaucratically, they will feel the weight of it. Do not smile when they sign it.

  ---

  ## 8. The Niche Framing in Action (Script Snippet)
  *Use this during the Debrief to cement the concept:*

  > "In the standard Dollar Auction, the trap is financial. You throw good money after bad. But in this room, the currency was **Credibility**.
  >
  > When you bid, you attached a Warrant from your Phase 1 argument. To quit was to admit that your argument *could not support the weight of your own actions*.
  >
  > This maps to **Sequential Doxastic Consistency**. In peer disagreement, we often see agents locking into shared errors not because they believe the error, but because retracting would require dismantling the network of prior commitments that make them a 'credible interlocutor' in the community. You weren't bidding for the Prize. You were bidding to keep your Phase 1 self from being proven a fool to your Phase 2 self. That is the architecture of rationalization."
