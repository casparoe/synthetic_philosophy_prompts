answer: |-
  **Exam Question**

  The paradox of deontology arises when agent-relative constraints prohibit minimizing the total violations of those very constraints. Avoiding standard one-versus-five trade-offs, state this paradox precisely. Evaluate the proposal that this tension stems from treating non-aggregable prohibitions as linearly summable values, analogous to assuming physical forces scale proportionally without saturation. Assess whether this diagnostic dissolves the paradox or merely relocates the justificatory burden, and defend a substantive position on the logical structure of moral constraints.

  **Model Answer**

  The paradox of deontology, famously articulated by Samuel Scheffler, questions why agents are forbidden from violating a constraint, such as lying, even to prevent multiple others from violating it. If the violation is morally bad, preventing five violations seems preferable to committing one; yet deontology forbids the agent from lying themselves to stop the others. This suggests a conflict between the disvalue of the act and the duty to minimize disvalue. The core tension lies in the claim that each person has a special reason not to violate constraints themselves, which does not translate into a reason to prevent violations by others at the cost of their own integrity.

  The scaling diagnosis posits that this paradox emerges from mistakenly applying linear aggregation to agent-relative reasons. In physics, assuming forces add linearly ignores interference patterns or saturation points; similarly, assuming moral violations sum neutrally ignores the agent's specific relation to the act. Agent-relative constraints function not as independent units of badness to be minimized globally, but as indexed prohibitions that do not commute across agents. The badness of my lying is not interchangeable with the badness of your lying in a utilitarian sum. Just as a field does not double in intensity simply because two sources are present due to destructive interference, moral obligation does not double simply because more violations are imminent.

  However, this diagnosis does not fully resolve the paradox; it merely relocates the tension from calculation to justification. Explaining why we cannot sum constraints does not explain why the constraints exist in this non-linear form. It clarifies the logical category error but leaves the normative foundation untouched. The student must recognize that identifying the structural error is distinct from validating the moral intuition. It stops the utilitarian rebuttal but does not prove the deontological premise. To claim the paradox is solved by non-linearity is to confuse structural coherence with normative truth.

  I argue that the scaling analogy is instructive but incomplete. It successfully demonstrates that utilitarian calculus is category-mistaken when applied to deontological duties. Yet, it fails to justify why the moral universe should be structured this way rather than another. A robust defense requires grounding agent-relativity in respect for persons rather than mere logical non-aggregability. Therefore, the paradox persists as a challenge to justify the special status of the agent, not merely to correct the arithmetic of value. The scaling insight protects the theory from internal inconsistency but does not provide external validation against consequentialist critiques. Ultimately, the paradox remains a feature, not a bug, of a morality centered on agency rather than outcomes. Consequently, the candidate must show that while the physics analogy illuminates the logical structure, it cannot substitute for ethical grounding.

  **Marking Scheme**

  1. Excellent answers define the paradox via agent-relative constraints rather than simple outcome comparisons, whereas competent responses may rely on forbidden one-versus-five examples.
  2. Candidates must distinguish between structural linearity and normative justification to demonstrate superior analysis of the physics analogy.
  3. Marks are deducted if the student asserts that identifying the aggregation error fully resolves the paradox rather than relocating the justificatory burden.
  4. Penalize responses that conflate agent-relative prohibitions with agent-neutral values, as this demonstrates a fundamental misunderstanding of deontological structure.
  5. Full credit requires a defended position on whether the paradox persists, distinguishing nuanced meta-ethical reasoning from mere assertion.
