  Here's what they said, more or less. Ana went first and said the two-sphere case is a clean refutation of the principle: the spheres are identical in every intrinsic property, same size, same mass, same temperature, and since they're the only two objects in the whole universe there's nothing else they could differ in, so they share all their properties and the principle is just false. Ben pushed back and said not so fast, because the spheres differ in relational properties: sphere A has the property of being one meter from sphere B, and sphere B has the property of being one meter from sphere A, and those are two different properties, so the spheres don't actually share all their properties and the principle survives. Ana said that's exactly the trivialy trick, because if being one meter from B counts as a real difference, then being identical to A should count too, and the principle becomes trivially true for any two distinct objects, which is obviously not the point. Ben replied that being one meter from B is a perfectly genuine relational property, no more impure than being to the left of the table, and if you start excluding relational properties that mention the objects themselves, then in a two object universe every single relational property mentions one of the two objects, so the spheres automatically share all the remaining relational properties and the principle is refuted by construction, which is circular. Ana said it's not circular at all, the whole point of the minimal universe is that there are no pure relational properties left to ground a real difference, and in a richer universe the spheres could differ in something like being closer to a third object, so the thought experiment is doing exactly what its supposed to do.

