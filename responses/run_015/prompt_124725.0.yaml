              *   Complication (iii): British fine-tune shifts firing to double-deckers/phone boxes, output becomes "coach".
          *   Requirements for Ruiz: Specify what fixes content (covariation, causal role, history, etc.), identify most threatening complication, concede something real (degrees of determinacy, artifacts).
          *   Requirements for Halvorsen: Specify conditions for literal truth (and why they fail), face retorts (behaviorism, brains don't represent either, triviality), not win by fatigue.
