      *   *Refinement on Dennett's Reductionism:* Need to be very clear. Dennett is a *non-greedy reductionist*. He believes everything is physical, but higher-level patterns are objectively real *patterns*. Calling him an "anti-reductionist" is the summary's biggest error.
