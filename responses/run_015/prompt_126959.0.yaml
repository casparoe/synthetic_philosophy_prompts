answer: |-
  ### Preliminary Analysis & Brainstorming

  Before addressing the core question, I will sketch the structural components of the phenomenon as requested, to ensure precision in the final definition.

  **1. Concrete Analogies Mirroring the Pattern**
  *   **Analogy A (Architectural Default):** A city planner defends a public building with only stair access as "universally designed," arguing stairs are the "historical convention for entry" and that adding ramps is a "political alteration" of building norms. When challenged via transposition—"Would you defend a building with only braille signage as universal for sighted people?"—the planner rejects the analogy, claiming mobility is different from vision, without explaining why one biological variance is "default" and the other is "special."
  *   **Analogy B (Culinary Default):** A school administrator defends a menu featuring only pork products as "standard nutrition," claiming pork is the "traditional protein" and specifying "kosher/halal" options creates unnecessary division. When challenged via transposition—"Would you serve only peanut products and claim it is standard nutrition, despite allergies?"—the administrator rejects the analogy, asserting food tradition is distinct from allergy safety, without addressing the exclusionary mechanism of the "standard."

  **2. Nearest Established Concepts**
  *   **Linguistic Markedness (Jakobson/Trubetzkoy):** Describes the asymmetry (e.g., *lion* vs. *lioness*), but is a descriptive structural tool, not a name for the *rhetorical defense* of that structure.
  *   **Ideological Naturalization (Barthes/Ideology Critique):** Describes how contingent social facts are made to seem like natural laws. This is the *mechanism* of the invisibility, but not the specific *rhetorical failure mode* regarding analogical transposition.
  *   **Motte-and-Bailey (Wilson):** Involves retreating from a controversial claim to a defensible one. The pattern you describe is not a retreat; it is a stubborn refusal to acknowledge the controversy revealed by the analogy.
  *   **Hermeneutical Injustice (Fricker):** Describes the lack of conceptual resources to understand an experience. This is close, but focuses on the victim's inability to articulate harm, whereas your pattern focuses on the *defender's* inability to justify the norm when exposed.

  **3. Differentiating Feature**
  The distinctive feature of the phenomenon you describe is **the reliance on the failure of imagination caused by familiarity.** It is not merely that the category is unmarked (Markedness), nor that it is seen as natural (Naturalization). It is that the *defense* of the category collapses under structural transposition, yet the defender attributes the collapse to the *analogy* rather than the *premise*, protected by the fact that the original asymmetry is phenomenologically invisible to them. The immunity is granted by the *opacity* of the default.

  ***

  ### Philosophical Diagnosis and Coinage

  There is no single, canonical term in the philosophy of language or feminist theory that captures this specific rhetorical failure mode in its entirety. While components of it are discussed under **linguistic ideology**, **androcentrism**, or **naturalization**, these terms describe the worldview or the structure, not the specific *immunizing move* that occurs when an analogical transposition (like Hofstadter's) is deployed.

  Therefore, to meet your requirement for precision, I propose the term **Transpositional Immunity of the Default (TID)**.

  #### Definition
  **Transpositional Immunity of the Default (TID)** is a rhetorical and cognitive failure mode wherein a linguistic or social norm is defended as neutral or necessary based on its status as an unmarked background category. This defense maintains its coherence only so long as the category remains unexamined. When subjected to **structural transposition** (mapping the logic onto a different social axis where the default is not permitted), the defense collapses. However, the defender rejects the validity of the transposition without identifying a relevant structural difference, relying instead on the **phenomenological opacity** of the original default to sustain the argument.

  #### Boundary Conditions
  To distinguish TID from neighboring concepts, we must establish clear edges:

  1.  **Vs. Ordinary Linguistic Markedness:**
      *   *Markedness* is the structural fact (e.g., *actor* is unmarked, *actress* is marked).
      *   *TID* is the *defense* of that fact against critique. One can acknowledge markedness without exhibiting TID (e.g., "Yes, it is marked, and we should change it"). TID occurs when the markedness is denied or justified via invisibility.

  2.  **Vs. Motte-and-Bailey:**
      *   In a *Motte-and-Bailey*, the speaker shifts positions (retreating from a bold claim to a modest one when challenged).
      *   In *TID*, the speaker holds the *same* position ("This is neutral") but changes their evaluation of the *evidence* ("Your analogy is invalid") without providing criteria for invalidity. It is a refusal to engage the counter-factual, not a retreat to a safer claim.

  3.  **Vs. False Analogy:**
      *   A *False Analogy* exists when there is a genuine, relevant structural difference between the two cases (e.g., comparing a nation to a family regarding budgeting ignores sovereign debt mechanisms).
      *   In *TID*, the analogy is structurally sound regarding the mechanism of exclusion. The defender claims it is false but cannot articulate the *relevant difference* (grammatical, historical, or social) that breaks the parallel. The "falseness" is asserted solely to protect the default.

  #### The Diagnostic Role of Analogical Transposition
  The defining feature of TID is that it is **only detectable via transposition**. Direct critique often fails because the default is experienced as "nothing" (the absence of a marker). Hofstadter's *A Person Paper on Purity in Language* is the archetype of the diagnostic tool: it does not argue directly against generic "he"; it constructs a world where generic "white" is the norm. If the defense survives the transposition (i.e., the defender can explain why race works differently than gender in this specific grammatical context), it is not TID. If the defense relies on "That's just different" without specification, it is TID.

  ***

  ### Concrete Cases

  To clarify the extension of this concept, here are two cases: one where TID clearly applies, and one where it does not (demonstrating the boundary).

  #### Case 1: TID Applies (The Generic "Man")
  *   **Context:** A debate on using "mankind" to mean "humanity."
  *   **Defense:** "Mankind is grammatically neutral. It comes from the Old English *mann*, which meant person. Specifying 'humankind' is political correctness altering history."
  *   **Transposition:** "Consider the term 'whites' used historically to mean 'citizens' in a specific legal code. Defending it by saying 'White was the traditional legal default for citizenship, and specifying non-white citizens is merely accurate description rather than exclusion.'"
  *   **Result:** The defender rejects the transposition ("Race isn't the same as gender").
  *   **TID Diagnosis:** When asked to specify the *grammatical* or *historical* feature that allows gender to be subsumed under a male term but prevents race from being subsumed under a white term, the defender cannot do so. The defense relies on the familiarity of "mankind" masking the asymmetry. The immunity is granted by the opacity of the gendered default. **This is TID.**

  #### Case 2: TID Does Not Apply (The Technical "Server")
  *   **Context:** A debate on using the term "Server" in computing to describe a machine that provides data.
  *   **Defense:** "We use 'Server' because it describes the function of serving data. It is not gendered or racialized; it is functional."
  *   **Transposition:** "Consider using 'Waiter' to describe a machine that provides data."
  *   **Result:** The defender rejects the transposition ("Waiter implies human service labor, which is irrelevant to computing").
  *   **TID Diagnosis:** Here, the defender *can* identify the specific feature that breaks the parallel: the semantic field of "Waiter" contains human-labor connotations that "Server" (in its technical etymology) has shed or never possessed. The defense does not rely on the *invisibility* of a social default, but on a **traceable semantic distinction**. The analogy fails for a articulable reason, not because one term is an invisible norm. **This is not TID; this is a valid rejection of a false analogy.**

  ### Conclusion
  The phenomenon you have identified is the **Transpositional Immunity of the Default**. It is not merely bias or markedness, but a specific rhetorical shield that relies on the *inarticulability* of the difference between the default and the marked. It survives only as long as the default remains phenomenologically invisible. Hofstadter's satire works because it forces the default to become marked (by making "white" the generic), thereby shattering the immunity. Recognizing TID allows us to distinguish between genuine linguistic constraints and defenses that are merely protections of unexamined normativity.
