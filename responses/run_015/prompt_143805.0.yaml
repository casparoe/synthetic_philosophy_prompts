answer: |-
  Here is a specification for a robust theory of special obligations to compatriots, designed to handle the edge cases you are encountering in your hometown without collapsing into nationalism or dissolving into borderless cosmopolitanism.

  ### I. The Core Specification

  A functional theory of special obligations cannot rely on a single variable (like citizenship). It requires a multi-factor authentication system for moral priority.

  **1. Input Variables (Who Counts?)**
  *   **Legal Status:** Formal citizenship or residency.
  *   **Social Integration:** Participation in local institutions (schools, civic groups, labor markets).
  *   **Contribution:** Tax payment, care work, infrastructure maintenance.
  *   **Vulnerability:** Exposure to harm if support is withdrawn.
  *   **Coercion:** Whether the subject is subject to the state's coercive power (laws, police).

  **2. The Grounds of Obligation (Why We Owe)**
  *   **Reciprocity:** I support the system, the system supports me.
  *   **Coercion:** If I am forced to obey laws, I am owed protection by the lawmakers.
  *   **Identity/Shared Project:** We are building a specific society together.

  **3. The Output Function (What is Owed)**
  *   **Priority, Not Exclusivity:** Compatriots get a *weighting bonus*, not a *veto*.
  *   **Tiered Rights:**
      *   *Tier 1 (Survival):* Housing, food, safety. (Universal claim)
      *   *Tier 2 (Flourishing):* Job preference, subsidized tuition, cultural preservation. (Compatriot claim)

  ---

  ### II. Edge Case Handling (Stress Testing)

  Most popular theories break here. A robust spec must process these inputs without error.

  **1. Dual Citizens**
  *   **The Bug:** Nationalist theories demand exclusive loyalty. Cosmopolitan theories treat them as having no special ties.
  *   **The Fix:** *Proportional Obligation.* Obligations are split based on **residence and coercion**. If you live in Hometown A but hold a passport for Country B, your primary special obligations are to A (where you are coerced and integrated). Country B retains a backup safety net obligation.
  *   **Result:** You cannot claim benefits from two states simultaneously while contributing to neither.

  **2. Stateless People**
  *   **The Bug:** Status-based theories render them invisible. If obligation requires citizenship, stateless people have zero claim.
  *   **The Fix:** *Coercion and Presence Trump Status.* If a stateless person is physically present and subject to local laws, the state owes them Tier 1 (Survival) rights equal to a citizen. The lack of paperwork cannot negate the moral debt created by enforcing laws upon them.
  *   **Result:** They get priority over absent foreigners, but perhaps secondary priority to citizens for Tier 2 (Flourishing) goods, unless their vulnerability spikes (e.g., deportation risk).

  **3. Digital Nomads (Multi-Tax Jurisdictions)**
  *   **The Bug:** They pay taxes but lack integration. Locals resent them driving up prices without "belonging."
  *   **The Fix:** *Contribution vs. Integration Decoupling.* Tax payment buys Tier 1 access (infrastructure, safety). It does not buy Tier 2 priority (housing allocation, political voice). Special obligations require **social risk-sharing**. Nomads can leave instantly; locals cannot.
  *   **Result:** Nomads are treated as high-contributing guests. They get service for tax, but no priority over locals in resource scarcity, because they do not share the long-term risk of the community's collapse.

  **4. Climate Migrants (Non-Citizens)**
  *   **The Bug:** "They chose to come" vs. "We didn't invite them."
  *   **The Fix:** *Causal Liability.* If the receiving community contributed disproportionately to the climate change forcing the migration, the "outsider" status is morally degraded.
  *   **Result:** They move from "Stranger" to "Creditor." Their claim on housing/jobs is elevated above standard foreigners, potentially rivaling locals, depending on the severity of the harm caused by the receiving community's emissions.

  ---

  ### III. Critical Distinctions That Cannot Be Blurred

  To prevent the theory from collapsing into xenophobia or naive open borders, you must enforce these separations.

  **1. Status vs. Weight**
  *   **The Blur:** Assuming Citizenship = Maximum Priority on Everything.
  *   **The Distinction:** Status grants access to the *system*, not infinite weight in *allocation*.
  *   **Example:** A citizen should not get priority for a life-saving ventilator over a resident alien. That is Tier 1 (Survival). A citizen *might* get priority for a state-subsidized arts grant. That is Tier 2 (Flourishing).
  *   **Why it matters:** If you blur this, you justify letting non-citizens die to save citizens' jobs. That breaks the moral system.

  **2. Negative vs. Positive Duties**
  *   **The Blur:** "We have a right to exclude" (Negative) is treated as "We have a duty to prioritize" (Positive).
  *   **The Distinction:** A community may have the right to maintain its culture (Negative: don't force us to change), but that does not generate a duty to impoverish outsiders to maintain it (Positive: take from them to give to us).
  *   **Why it matters:** This stops locals from using "preservation" as a weapon to hoard resources.

  **3. Actual vs. Potential Membership**
  *   **The Blur:** Treating people who *want* to move there as having the same claim as people who *live* there.
  *   **The Distinction:** Special obligations are generated by **existing cooperative schemes**. People who haven't arrived yet are not in the scheme.
  *   **Why it matters:** This validates some local concern about "people who haven't arrived." You cannot owe special duties to people with whom you have no existing relationship. However, you *do* owe them human rights (Tier 1).

  ---

  ### IV. Where Popular Versions Break

  **1. The "Family Analogy" Break**
  *   **Argument:** "The nation is a family; you feed your kids before the neighbor's kids."
  *   **Break Point:** Families are voluntary and intimate; nations are coercive and impersonal. You can't quit your citizenship easily. Because membership is non-voluntary, the obligations must be bounded by justice, not just affection. If the "family" is abusive or hoarding while the neighbor starves, the analogy fails.

  **2. The "Social Contract" Break**
  *   **Argument:** "We paid into the system, so we get the benefits."
  *   **Break Point:** This excludes children, the disabled, and the elderly who haven't "paid." If the theory relies solely on contribution, it eats its own vulnerable citizens. It must rely on *membership*, not *transaction*.

  **3. The "Cultural Preservation" Break**
  *   **Argument:** "Outsiders change the character of the town."
  *   **Break Point:** Culture is static in this view. In reality, culture evolves. Prioritizing housing for locals to "save the town" often saves the *property values*, not the *culture*. If the theory cannot distinguish between economic exclusion and cultural protection, it becomes a mask for gentrification.

  ---

  ### V. The Single Knockout Requirement

  This is the constraint that defeats the "Charity Begins at Home" argument when it is used to justify harm.

  **The Baseline Vulnerability Constraint:**

  > **Special obligations to compatriots are permissible only when the basic rights and survival needs of outsiders are not compromised to provide non-essential advantages to insiders.**

  **How it works:**
  1.  **Define the Baseline:** Food, shelter, safety, freedom from persecution.
  2.  **Compare the Trade-off:**
      *   *Scenario A:* Locals get priority for **jobs**. Outsiders go unemployed.
          *   *Verdict:* **Permissible.** (Assuming outsiders have a safety net elsewhere). This is Tier 2 (Flourishing/Economic Advantage).
      *   *Scenario B:* Locals get priority for **housing**. Outsiders become homeless/exposed to elements.
          *   *Verdict:* **Impermissible.** Housing is Tier 1 (Survival). The local's desire for stability cannot override the outsider's need for survival.
      *   *Scenario C:* Locals block **climate migrants** to keep rents low.
          *   *Verdict:* **Impermissible.** The migrant's vulnerability (climate displacement) outweighs the local's economic preference.

  **Why this knocks out "Charity Begins at Home":**
  The phrase implies a sequence: *Take care of us, then if there's leftover, help them.*
  The Baseline Vulnerability Constraint changes the sequence to: *Ensure no one falls below the survival floor, then prioritize us for the surplus.*

  If your hometown argues that locals should get housing priority even if it means newcomers sleep on the street, this requirement declares that argument morally invalid. It forces the debate away from "Who belongs?" to "What is the minimum standard of treatment we owe any human within our borders?"

  ### VI. Application to Your Situation

  When you are in these arguments, map the local claims against the spec:

  1.  **Ask for the Tier:** Are they arguing for priority on *survival* goods (housing/health) or *advantage* goods (jobs/status)? If it's survival, their claim is weak.
  2.  **Check the Contribution:** Are the "outsiders" paying taxes and obeying laws? If yes, the Reciprocity variable is met.
  3.  **Apply the Knockout:** If prioritizing locals pushes outsiders below the baseline (homelessness, destitution), the priority is illegitimate regardless of citizenship.

  This framework allows you to acknowledge that locals *do* have special ties (you feel them yourself, having returned) without accepting that those ties justify exclusionary harm. It validates your connection to the hometown without validating the hostility toward the newcomer.
