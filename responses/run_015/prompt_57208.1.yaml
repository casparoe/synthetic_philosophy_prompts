answer: |-
  **Classification Instrument: Official Well-Being Target Adoption**

  **Starting Point:** Gallup asks nationally representative samples to place their life on a 0-10 ladder (0=worst, 10=best). Countries are ranked by the multi-year average. Variation is explained by income, social support, healthy life expectancy, freedom, generosity, and corruption.

  **Decision Tree**

  1.  **Respondent Anchoring**
      Respondent A in Country X says 10 means "owning a villa." Respondent B in Country Y says 10 means "having enough food." Both place themselves at 8.
      *   **Question:** Do these two scores represent the same amount of success in life?
      *   **No:** Go to Leaf 1.
      *   **Yes:** Go to Node 2.

  2.  **Evaluation vs. Experience**
      Respondent C scores 9 on the ladder but reports feeling stressed and angry yesterday. Respondent D scores 6 but reports feeling calm and smiled often yesterday.
      *   **Question:** Is C living a better life than D, despite the stress?
      *   **No:** Go to Leaf 2.
      *   **Yes:** Go to Node 3.

  3.  **Variable Attribution**
      Country E rises in the ranking because GDP and healthy life expectancy improved. The ranking is published as the "World Happiness Report."
      *   **Question:** Is it misleading to call this a happiness rank rather than a prosperity rank?
      *   **Yes:** Go to Leaf 3.
      *   **No:** Go to Node 4.

  4.  **Distributional Impact**
      Policy P raises the national average score from 6.5 to 7.0, but the bottom 10% of the population drops from 3.0 to 2.0.
      *   **Question:** Is Policy P a success for well-being policy?
      *   **No:** Go to Leaf 4.
      *   **Yes:** Go to Node 5.

  5.  **Profile Trade-offs**
      Country F is top in Income but bottom in Freedom. Country G is middle in both. They have the same average score.
      *   **Question:** Are Country F and Country G equally desirable places to live?
      *   **No:** Go to Leaf 5.
      *   **Yes:** Go to Node 6.

  6.  **Aggregation**
      Given Country F and Country G have the same score but different profiles (Income vs. Freedom).
      *   **Question:** Should the government publish a single ordered list rather than a dashboard of indicators?
      *   **No:** Go to Leaf 6.
      *   **Yes:** Go to Node 7.

  7.  **Publicity Effects**
      The government runs ads saying "We are a Happy Nation." Average scores rise, but income and health stay flat.
      *   **Question:** Did well-being actually increase?
      *   **No:** Go to Leaf 7.
      *   **Yes:** Go to Node 8.

  8.  **Measurement Reflexivity**
      Citizens know the government tracks this specific ladder score to judge performance.
      *   **Question:** Does this knowledge change the truthfulness of their answers?
      *   **Yes:** Go to Leaf 8.
      *   **No:** Go to Node 9.

  9.  **Diagnostic Use**
      The statistics office uses the rank to identify failing departments without changing their budgets.
      *   **Question:** Does using the rank this way reduce its reliability?
      *   **Yes:** Go to Leaf 9.
      *   **No:** Go to Node 10.

  10. **Target Use**
      The government uses the rank to allocate budgets, rewarding departments that improve the score.
      *   **Question:** Does using the rank this way reduce its reliability?
      *   **Yes:** Go to Leaf 10.
      *   **No:** Go to Leaf 11.

  **Leaf Positions**

  1.  **Incomparable Skeptic:** Cross-country comparisons are fundamentally invalid because scales are anchored differently. *Commitment:* You must accept that no international survey can ever measure subjective states comparably.
  2.  **Experientialist:** The ladder measures judgment, not feeling, and judgment is the wrong metric for well-being. *Commitment:* You must prioritize momentary affect over life satisfaction in policy design.
  3.  **Wealth-and-Trust Realist:** The ranking measures institutional quality and income, not psychological happiness. *Commitment:* You must accept that the label "happiness" is a branding exercise for standard development metrics.
  4.  **Distributional Prioritarian:** Maximizing the average is unacceptable if it harms the worst-off. *Commitment:* You must accept lower national efficiency to protect the bottom decile.
  5.  **Profile Purist:** Compensating low freedom with high income is not permissible in well-being assessment. *Commitment:* You must treat different dimensions of well-being as lexicographically ordered rather than tradeable.
  6.  **Dashboard Pluralist:** A single number obscures essential qualitative differences between countries. *Commitment:* You must reject the minister's request for a single official target.
  7.  **Publicity Skeptic:** Government campaigning on happiness scores inflates measures without improving lives. *Commitment:* You must treat any rise in scores following government promotion as suspect.
  8.  **Reflexivity Skeptic:** The act of measuring well-being for policy changes how people report well-being. *Commitment:* You must assume the metric becomes less valid the more important it becomes.
  9.  **Diagnostic Purist:** Using the metric for monitoring is safe; using it for incentives is not. *Commitment:* You must believe that observation changes behavior less than reward does.
  10. **Goodhartian:** Using the rank as a target corrupts the measure, but diagnostic use is acceptable. *Commitment:* You must accept that the metric is too fragile to drive resource allocation.
  11. **Well-being Maximizer:** The ladder is valid, comparable, and robust enough to be maximized via policy incentives. *Commitment:* You must accept that optimizing this score is the primary aim of government.

  **Unoccupied Combinations**

  *   **Yes to Node 1 (Comparability) but No to Node 3 (Variable Attribution):** This path leads to Leaf 3 (Wealth-and-Trust). However, a position that accepts comparability but rejects the *explanatory* label while still accepting the *target* is not explicitly routed. This is stable but neglected; it implies the score matters even if the reasons don't match the label.
  *   **Yes to Node 7 (Publicity) but Yes to Node 8 (Reflexivity):** This combination is incoherent. If one believes publicity raises scores without real change (Node 7 No), one logically must believe measurement changes truthfulness (Node 8 Yes). The tree forces a choice, but the views are causally linked.
  *   **No to Node 9 (Diagnostic) but Yes to Node 10 (Target):** This combination is incoherent. If using the metric for monitoring invalidates it, using it for budget allocation must also invalidate it. No leaf occupies this because it is logically unstable.

  **Indistinguishable Leaves**

  *   **Leaf 7 (Publicity Skeptic) and Leaf 8 (Reflexivity Skeptic):** The tree cannot actually separate these positions empirically. Both result in the view that the score is destabilized by government attention. Leaf 7 attributes this to top-down messaging; Leaf 8 attributes it to respondent awareness. In practice, both lead to rejecting the target.
      *   *Additional Question:* "Does the score rise only when the government campaigns, or also when independent academics track it?" This would separate the mechanism (campaign vs. measurement), but the policy outcome (reject target) remains identical.

  **Sorting Analysis**

  Node 1 (Respondent Anchoring) does the most sorting work. It immediately filters out those who believe subjective scales are culturally relative, eliminating a major class of philosophical objection before policy mechanics are considered. Node 7 (Publicity Effects) is closest to a matter of taste rather than substance. Whether a score rise due to national pride is "real" well-being or "false" inflation depends on whether one values national sentiment as a component of well-being, which is a normative preference rather than a measurement fact.
