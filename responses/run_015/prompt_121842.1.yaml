answer: |-
  You have identified a genuine and pervasive structural tension in the secondary literature on Schopenhauer's aesthetics. To answer your primary question directly: **No, there is no single, established technical term in the academic literature that specifically names this interpretive failure mode.**

  While scholars such as Malcolm Budd (*Music and the Emotions*), Christopher Janaway (*Self and World in Schopenhauer's Philosophy*), and Julian Young (*Schopenhauer*) extensively discuss the *coherence* of Schopenhauer's theory itself—often noting that Schopenhauer occasionally wavers on whether music expresses the Will *directly* or the *feelings* associated with the Will—they do not assign a specific proper name to the *interpreter's habit* of maintaining the metaphysical shell while swapping in phenomenal content.

  Existing terms like **"Psychologism"** or **"The Affective Fallacy"** (Wimsatt/Beardsley) are too broad. Psychologism generally refers to reducing logical norms to psychological processes, and the Affective Fallacy concerns judging a work's meaning by its emotional effect on the reader/listener. Neither captures the specific *ontological smuggling* you describe: the act of claiming a noumenal status for an art form while defining its content in phenomenal terms.

  Given the precision of your analysis, I propose we designate this failure mode as **"The Phenomenal Displacement Fallacy"** (operating within a broader stance of **"Cryptorepresentational Exegesis"**).

  Below is the precise philosophical definition, boundary conditions, and distinction from related errors.

  ---

  ### Proposed Term: The Phenomenal Displacement Fallacy

  **Definition:**
  The Phenomenal Displacement Fallacy occurs when an interpreter of Schopenhauer (or a Schopenhauerian system) asserts the **ontological uniqueness** of music (as a direct copy of the Will/Noumenon) but subsequently defines the **semantic content** of music using **phenomenal categories** (emotions, affects, psychological states) without accounting for the ontological gap between the two.

  It is a specific category error where the *locus* of the content is displaced from the Noumenal (Will-in-itself) to the Phenomenal (Subject's experience of the Will), while the *label* of the content remains "Noumenal."

  **Why "Cryptorepresentationalism"?**
  The broader interpretive stance should be termed **Cryptorepresentational Exegesis**. "Crypto-" indicates that the representational nature is hidden or denied in the premises (music is *not* a copy of Ideas) but revealed in the conclusion (music *is* a copy of Emotions, which are representations). The interpreter retains the metaphysical vocabulary of Schopenhauer to grant music authority, but empties that vocabulary of its actual metaphysical function.

  ---

  ### Boundary Conditions and Distinctions

  To ensure this term is useful and not merely a synonym for "bad reading," we must distinguish it from two adjacent interpretive moves.

  #### 1. Distinction from Simple Misreading (The "Naïve Emotionalist")
  *   **The Naïve Reading:** Ignores Schopenhauer's metaphysics entirely. It treats music as simply "the language of emotions" in a generic 19th-century Romantic sense. It does not claim music bypasses the Principle of Sufficient Reason or copies the Will.
  *   **The Phenomenal Displacement:** *Requires* the metaphysical preamble. The interpreter explicitly cites the Will/Idea distinction to argue for music's superiority. The error is not ignoring the distinction, but **collapsing it** in the second step of the argument.
  *   **Diagnostic Test:** If the interpreter removes the word "Will" and replaces it with "Human Spirit" or "Nature" without the argument changing, it is a Naïve Reading. If the argument *depends* on the word "Will" to establish uniqueness, but treats "Will" as synonymous with "Emotion," it is Phenomenal Displacement.

  #### 2. Distinction from Heuristic Analogy (The "Pedagogical Accommodation")
  *   **The Legitimate Analogy:** The interpreter acknowledges that human language is bound to the Phenomenal world. They use emotional terms (longing, joy) *provisionally* to point toward the Will's movements, explicitly stating that these emotions are merely the *phenomenal shadow* of the noumenal reality music accesses. They maintain the epistemic gap.
  *   **The Phenomenal Displacement:** The interpreter treats the emotional terms as **constitutive** rather than illustrative. They do not say "Music sounds like longing to us, because we are phenomenal subjects"; they say "Music *is* the objectification of longing."
  *   **Diagnostic Test:** Does the interpreter qualify the emotional language as inadequate to the metaphysical reality? If yes, it is Heuristic. If they treat the emotional vocabulary as the *final definition* of the musical content, it is Phenomenal Displacement.

  ---

  ### Philosophical Context and Utility

  Naming this fallacy is not merely terminological pedantry; it clarifies a significant soteriological problem in Schopenhauer's aesthetics.

  1.  **The Soteriological Stakes:** For Schopenhauer, the value of art (and specifically music) is its ability to temporarily quiet the Will or allow us to contemplate it without suffering. If music is merely a representation of emotions (Phenomenal Displacement), it risks *stimulating* the Will (arousing desire, sadness, tension) rather than transcending it. Identifying this fallacy helps explain why certain "Schopenhauerian" interpretations of music lead to Romantic excess rather than metaphysical quietude.
  2.  **Schopenhauer's Own Ambiguity:** It is worth noting that Schopenhauer himself invites this fallacy. In *The World as Will and Representation* (Vol I, §52), he writes that music is "as direct an objectification and copy of the whole Will as the world itself is." Yet, he frequently describes musical elements in terms of human satisfaction and desire (e.g., the melody as the "story of the intellectually enlightened Will"). The **Phenomenal Displacement Fallacy** is often the interpreter solidifying Schopenhauer's own metaphorical slippage into a doctrinal contradiction.
  3.  **Scholarly Navigation:** Scholars like **Malcolm Budd** avoid this fallacy by rigorously distinguishing between music expressing the *concept* of an emotion (which would be representational) and music possessing the *dynamic structure* of the Will (which is non-representational). **Christopher Janaway** navigates this by emphasizing that music expresses the *in-itself* of what appears phenomenally as emotion, not the emotion itself. When an interpreter fails to make this distinction while claiming to follow Schopenhauer, they are committing Phenomenal Displacement.

  ### Summary for Application

  If you encounter a text that:
  1.  **Premise:** Asserts music is a direct copy of the Will (Noumenal).
  2.  **Content:** Defines musical meaning via specific emotional states (Phenomenal).
  3.  **Connection:** Fails to explain how a Noumenal cause yields a Phenomenal description without collapsing the distinction.

  You can accurately classify this as **Cryptorepresentational Exegesis** committing the **Phenomenal Displacement Fallacy**. This allows you to critique the argument not as a misunderstanding of Schopenhauer's metaphysics (they understand the premise), but as a failure of ontological consistency in the application.
