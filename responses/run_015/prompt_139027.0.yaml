answer: |-
  You have put your finger on one of the most persistent and uncomfortable tensions in contemporary philosophy of mind. You are not imagining it, and it is not a simple misunderstanding on your part. The move you describe is standard, it is deliberate, and it is deeply controversial.

  Here is the breakdown of what this move is, what it is called, and whether it holds water.

  ### 1. Does it have a name?

  There is no single, canonical label for the *asymmetry* itself, but it operates within a well-established framework.

  **The Established Notion: The Personal/Subpersonal Distinction**
  The standard defense for the writers you are reading relies on the distinction between the **personal level** and the **subpersonal level**.
  *   **Personal Level:** This is the realm of subjects, persons, beliefs, and conscious experiences. Only the whole organism (the patient) operates here.
  *   **Subpersonal Level:** This is the realm of mechanisms, subsystems, information processing, and causal pathways. Hemispheres, visual systems, and neural networks operate here.

  The writers are claiming that when they say "the right hemisphere saw the word," they are speaking at the *subpersonal* level. When they say "there is only one subject," they are speaking at the *personal* level.

  **The Coined Term: The Mereological Toggle**
  Since there is no specific name for the *asymmetrical use* of this distinction (robust for evidence, fragile for ontology), I will offer you a term that fits your description: **The Mereological Toggle**.

  *   **Definition:** The rhetorical practice of treating a proper part of an organism (a hemisphere, a module, a system) as a robust agent when describing experimental data (to explain causal independence), but reverting to treating it as a mere mechanism when drawing ontological conclusions (to preserve the unity of the person).
  *   **Why "Toggle"?** Because the reality-status of the part is switched on or off depending on whether its agency supports or threatens the preferred conclusion about personhood.

  **How your notion departs from the established one:**
  The *Personal/Subpersonal Distinction* is the map; *The Mereological Toggle* is the specific route the drivers are taking that you suspect is a shortcut. The distinction claims there are two levels of description. Your critique (and the Toggle) points out that the writers are treating the subpersonal level as *evidentially real* (it really does the seeing) but *ontologically inert* (it doesn't really count as a seer).

  ### 2. Borderline Cases

  To see the edges of the Mereological Toggle, consider these cases where the switch becomes difficult to manage:

  **Case A: Conjoined Craniopagus Twins**
  Two distinct heads, distinct faces, distinct voices, sharing a portion of brain tissue at the thalamus.
  *   *The Toggle:* If we apply the split-brain logic, we might say the shared tissue is a "subpersonal subsystem" serving two "personal subjects."
  *   *The Edge:* If the shared tissue is substantial enough that stimulating it affects *both* twins' conscious fields, does the tissue belong to one subject, both, or neither? Here, the biological organism boundary (two bodies) conflicts with the neural boundary (one fused system). Writers often stumble here because the "one subject per organism" rule breaks down.

  **Case B: Dissociative Identity Disorder (DID)**
  A single brain, single body, but distinct streams of memory and agency that claim to be distinct persons.
  *   *The Toggle:* Philosophy of mind writers often treat DID as a *single* subject with fragmented access (subpersonal fragmentation), unlike split-brain cases which are sometimes granted *two* streams of consciousness.
  *   *The Edge:* Why is a physical barrier (cut corpus callosum) granted more ontological weight than a functional/psychological barrier (repressed memory)? If the "right hemisphere" counts as a distinct centre of agency in split-brain, why doesn't the "alter" in DID? The Toggle is often applied inconsistently here to avoid validating DID as literal multiplicity.

  **Case C: The "Silent" Hemisphere**
  In some split-brain patients, the right hemisphere (non-speaking) shows no sign of independent volition over time; it becomes passive.
  *   *The Toggle:* Initially, the right hemisphere is described as an agent ("it chose the object"). Later, if it stops initiating, it is described as a tool ("the left hemisphere used the hand").
  *   *The Edge:* Did the subject cease to exist? Or was it never a subject? The Toggle allows writers to say "it was an agent then, but not a person," without explaining the threshold where agency becomes personhood.

  ### 3. Can the Asymmetry be Defended?

  This is the crux. Is it a coherent position, or is it "wanting it both ways"?

  **The Defense (The "Biological Organism" View)**
  There is a coherent defense, most notably articulated by philosophers like **Elizabeth Schechtman** (*Self-Consciousness and "Second Person"*) and neuroscientists like **Michael Gazzaniga** (later work).
  *   **The Argument:** "Subjecthood" is not defined by momentary cognitive independence. It is defined by **biological continuity** and **social integration**.
  *   **The Logic:** A hemisphere cannot survive on its own. It cannot sign a contract, hold a moral responsibility, or maintain a life narrative. Therefore, while it may process information independently (disunity of *consciousness*), it cannot be a "subject" (unity of *person*).
  *   **Verdict:** On this reading, the asymmetry is not a toggle but a **categorization**. They are saying: "Yes, there are two *minds* (functional systems), but only one *person* (biological/social entity)." If you accept that "subject" means "person," the asymmetry vanishes.

  **The Critique (The "Phenomenological" View)**
  However, your intuition that this is "wanting it both ways" is shared by philosophers like **Thomas Nagel** and **Derek Parfit**.
  *   **The Argument:** If "subject" means "that which has an experience," then the split-brain findings *do* imply two subjects.
  *   **The Logic:** If the right hemisphere feels pain, sees a flash, and makes a choice, it meets the criteria for a subject of experience. To deny it is "subjecthood" simply because it lacks a tongue or a social security number is to change the definition of "subject" mid-argument.
  *   **Verdict:** On this reading, the Mereological Toggle is indeed a rhetorical shield. It allows writers to claim the exciting scientific discovery ("Look, consciousness can split!") without accepting the disturbing ethical consequence ("Look, we might be killing a second person when we treat the patient!").

  ### 4. Conclusion: Is it just wanting it both ways?

  Mostly, yes. But with a technical caveat.

  It is "wanting it both ways" **if** the definition of "subject" remains constant throughout the argument. If "subject" means "locus of conscious experience," then the writers are inconsistent. They use the hemisphere's experience to prove disunity, then deny the hemisphere's experience counts toward subject-counting.

  However, it is **defensible** if they explicitly state they are switching definitions:
  1.  **Consciousness** is a functional property (can be divided).
  2.  **Personhood** is a biological/social property (cannot be divided).

  **The Problem:** In the texts you are reading, they rarely make this distinction explicit. They rely on the ambiguity of the word "subject" to do the work. They use the *phenomenal* weight of the hemisphere's action to make the finding dramatic, then use the *biological* weight of the patient's body to make the ontology safe.

  **Your Zoologist's Eye:**
  You are spotting what a biologist might call a **category error in taxonomy**. It is as if an ornithologist said, "This wing acts like a distinct flying unit," to explain aerodynamics, but then said, "But it's not a distinct bird," to avoid counting two birds in the census.

  **Recommendation for your group:**
  You don't need to drop a label. You need to ask this specific question:
  *"When you say the hemisphere 'saw' the word, do you mean it had a visual experience? If yes, is the subject of that experience the patient or the hemisphere? If it's the hemisphere, on what grounds do you deny it is a subject of experience in the ontological count?"*

  That forces them to stop toggling and choose a definition.

  **Summary:**
  *   **Established Notion:** Personal/Subpersonal Distinction.
  *   **Coined Term:** The Mereological Toggle.
  *   **Defensibility:** Only defensible if "subject" is explicitly redefined as "biological organism" rather than "locus of experience." Without that explicit redefinition, it is an inconsistency designed to avoid ethical and metaphysical disruption.
