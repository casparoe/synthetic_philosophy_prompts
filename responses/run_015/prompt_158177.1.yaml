answer: |-
  In designing a historiographical scenario where institutional imperatives generate divergent archives without deception, one must locate the divergence in categorical incommensurability rather than factual contradiction. Consider how legal liability frameworks record actions as breaches or compliances within a normative system, rendering human motivation irrelevant except as intent, whereas public welfare frameworks record the same bodies as recipients of care, rendering legal status irrelevant except as eligibility. If these institutions operate simultaneously over a bounded event, they produce two authentic, non-overlapping descriptive sets: one capturing causality and loss, the other capturing suffering and relief. Neither lies; they simply recognize different entities as real. The structural divergence arises because the legal record cannot see "suffering" as a fact, and the welfare record cannot see "liability" as a fact. This creates a dual archive where the "event" is split into two mutually exclusive factual universes, both empirically robust, preventing synthesis without residual contradiction and forcing the historian to confront records that are ontologically distinct yet spatiotemporally identical.

  Consider the 1892 Mill Fire, preserved solely in two authentic, contemporaneous institutional records: the Corporate Insurance Adjuster's Ledger and the Municipal Coroner's Inquest Roll. The Ledger documents the event as a sequence of asset depreciations and safety code violations, chronologically ordered by damage assessment, intrinsically structuring the event as a Tragedy of inevitable industrial decay and negligence. The Coroner's Roll documents the same temporal span as a sequence of bodies identified and families compensated, ordered by time of death, intrinsically structuring the event as a Comedy of administrative resolution and restorative justice. Neither record references the categories of the other; the Ledger notes no deaths, only losses, while the Roll notes no costs, only casualties. Consequently, critical comparison yields two mutually incompatible accounts of responsibility—physical causality versus human agency—that are equally well-supported yet irreconcilable, defeating the Rankean aim of a singular reality. Simultaneously, because neither source contains the data of the other, any historian regardless of political standpoint must select both sources to construct a complete chronology, fixing the selection and arrangement of evidence independent of presentist concerns. Finally, the narrative forms are not imposed by the historian but are materially inscribed in the document types themselves, forcing a choice between pre-existing emplotments rather than allowing the imposition of a new one.

  The Rankean verdict is one of forced agnosticism. Because the critical method relies on cross-referencing sources to eliminate bias and establish a single objective chain of events, the historian finds that both sources pass verification yet describe incompatible realities. The Ledger proves negligence caused the fire; the Roll proves protocol managed the deaths. Since neither source invalidates the other, and no third source exists to adjudicate, the Rankean ideal of establishing the past "as it essentially was" collapses into a dualism where "essence" is fragmented. The Carrian verdict is one of constrained agency. Carr posits that facts are selected by the historian's present concerns; however, in this scenario, the archival segregation dictates selection. A Marxist or Liberal historian must use the Ledger for fire causes and the Roll for mortality data because no alternative data exists. The historian's standpoint cannot alter the selection or arrangement because the institutional structures of the sources themselves determine what facts are available to be selected. The Whitean verdict is one of pre-inscribed narrative. White argues that emplotment is a literary imposition on chaotic events; here, the chaos is already ordered. The Ledger *is* a tragedy of loss; the Roll *is* a comedy of closure. The historian does not choose the plot; they encounter records that are already narrativized by their institutional function, limiting the historian to choosing which pre-existing story to privilege.

  The single structural feature doing the work is *Institutional Ontological Segregation*. The two recording bodies define the event using mutually exclusive categories (Asset vs. Body), ensuring that no single document captures the event as a unified whole. If this feature were removed—for instance, if a single municipal report recorded both financial loss and casualty data—the historian could synthesize the accounts, Ranke could adjudicate causality against consequence, Carr could select based on ideological preference, and White could impose a unified emplotment. The divergence of the three verdicts depends entirely on the impossibility of merging the two ontological frameworks.

  A defender of Ranke's position would attack the thought experiment by arguing for ontological priority. They would contend that physical causality (the fire) is objectively prior to social consequence (the deaths), making the Insurance Ledger the primary record of the event and the Coroner's Roll merely secondary. By establishing a hierarchy of truth based on temporal causality, the Rankean restores the possibility of a single authoritative narrative. A defender of Carr's position would attack by distinguishing between source selection and factual significance. They would argue that while the *sources* selected are stable, the *meaning* derived from them is not. The historian still chooses which archive defines the "truth" of the event (e.g., was it primarily an economic disaster or a human tragedy?). Thus, the historian's present commitments still determine the historical narrative, even if the raw materials are fixed.
