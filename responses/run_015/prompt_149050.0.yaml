prompt: |-
  I work in the economics office of a regulatory agency, and I am drafting an internal methods note on our benefit–cost practice. I do not want a verdict on whether the practice is good; I want the theory it is implicitly committed to reconstructed, and I want the places where it is philosophically underdetermined flagged as underdetermined.

  The practice, as it actually operates. To score a proposed rule we monetize every consequence in dollars and add: households' willingness to pay for each benefit, firms' compliance costs, and mortality risk reductions valued at a single figure per statistical life applied to the expected number of deaths averted. A reduction of one-in-ten-thousand in the annual risk of each of ten thousand people is costed exactly as one life saved, and exactly as the certain avoidance of one identifiable death. Rules are ranked by net benefits with no weights attached to whose benefits and costs they are; when a rule's costs fall on one income group and its benefits on another, our guidance asks for a separate distributional statement but instructs us not to fold equity weights into the net-benefit calculation. The value-of-life figure itself is revised upward over time as real incomes rise, on the ground that willingness to pay for safety increases with income.

  I have been reading about Harsanyi's aggregation theorem, and the practice looks as though it were built to match that result's conclusion — social welfare as a weighted sum of individual expected utilities — while quietly failing to match its premises. I want that suspicion tested piece by piece, in the following order.

  First, reconstruct the social welfare function the practice must be using if it is coherent, and tell me what it strictly presupposes as opposed to what merely fits it. In particular, does the practice need each of the theorem's premises — expected-utility rationality for individuals, expected-utility rationality for the social ranking itself, the unanimity condition, and the impartiality or equiprobability step that converts free weights into equal ones — or does it need only the conclusion? My own suspicion is that the instruction not to use equity weights is doing work that nothing in the aggregation result requires, since the result leaves the weights undetermined; confirm or dislodge that.

  Second, the currency problem. The weights in the theorem are weights on von Neumann–Morgenstern utility functions, and those functions are determined only up to positive affine transformation, with the weights absorbing any rescaling, so that the resulting ranking is invariant to how each person's utility is normalized. Our currency is dollars, and a person's utility is an affine function of dollars only if that person is risk-neutral with respect to money. Work out what the practice therefore implies: if a dollar is counted as worth the same wherever it lands, what is being said about the weight on each person's well-being? I think the answer is that equal treatment per dollar amounts to unequal treatment per unit of utility in a determinate direction, and that the direction is the opposite of what the impartial framing of the practice suggests — but I want the argument made properly, including whether the practice might instead be defended as a weighted sum with unequal yet principled weights rather than dismissed as a botched equal-weight sum.

  Third, a diagnostic I would like you to apply. Because the Harsanyian sum is invariant to positive affine rescaling of each individual's utility, any aggregation method whose rankings shift when you change units or baselines is not a Harsanyian sum. Is dollar-metric aggregation invariant in that sense, given that the dollar value assigned to a person's gain depends on the income or consumption level at which the conversion into money is made? If two analysts who convert at different reference levels can reverse the ranking of the same pair of rules, say what that establishes: is the practice committed to universal risk-neutrality in money, or only to a particular cardinalization that it never explicitly chose?

  Fourth, ex ante or ex post. Under the practice as described, a prospect that imposes certain death on one person and one that imposes a one-in-ten-thousand risk on each of ten thousand people are costed identically. Is the practice therefore committed to evaluating prospects by the sum of expected utilities rather than by how outcomes look once the uncertainty is resolved, and to indifference between concentrated and dispersed fatal risk at equal expected value? Tell me what the best-known objection to that indifference is, what it would take for the practice to register it, whether any scoring rule we actually use would have to change, and whether our separate handling of identifiable lives — the refusal to score a named worker facing a known hazard the way we score a statistical one — is a genuine inconsistency or a defensible division of labor.

  Fifth, suppose an internal review found that stated willingness to pay per unit of risk reduction is systematically larger for large risk reductions than for small ones, so that the single value-of-life figure is not a constant marginal rate of substitution at all. Which premise of the reconstruction would that break, and would we then still be aggregating expected utilities, or something that merely resembles them? Does anything in the argument for the aggregation result tell us which way to go once that premise fails?

  Finally, and most usefully for my note: if we took the result seriously as a constraint on our practice, what exactly would have to change? Separate the changes that are forced by the aggregation result itself, the changes that follow only if one adds an equal-weight or impartial-observer premise, and the changes that follow only if one rejects ex ante evaluation in favour of an ex post one. And be explicit about where the practice is underdetermined: if several different welfare functions would generate the same scores, the note should say so rather than announcing that we have uncovered a hidden utilitarianism in our spreadsheets.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Economist in a regulatory agency drafting an internal methods note on benefit-cost analysis (BCA).
      *   **Goal:** Reconstruct the implicit theory behind current BCA practice, flag philosophical underdetermination, and test the connection to Harsanyi's Aggregation Theorem.
      *   **Tone:** Technical, precise, philosophical but grounded in economic practice, neutral (no verdict on "goodness").
      *   **Structure:** Six specific sections (Reconstruction of SWF, Currency Problem, Invariance Diagnostic, Ex Ante/Ex Post, Non-Linearity of VSL, Implications for Practice).
      *   **Key Constraint:** Do not give a verdict on whether the practice is good. Focus on theoretical coherence and underdetermination.

  2.  **Deconstruct the Practice (as described):**
      *   Monetize all consequences ($).
      *   Sum WTP (benefits) + Compliance Costs + VSL * Expected Deaths Averted.
      *   VSL is constant per statistical life (linear in risk).
      *   Risk equivalence: 1/10,000 risk to 10,000 people = 1 certain death.
      *   Ranking: Net Benefits (NB).
      *   Distribution: Separate statement, no equity weights in NB.
      *   VSL adjustment: Increases with real income (income elasticity > 0).

  3.  **Section 1: Reconstruction of the Social Welfare Function (SWF) & Harsanyi:**
      *   *Task:* Reconstruct the implicit SWF. Does it need Harsanyi's premises (Individual EU, Social EU, Pareto/Unanimity, Impartiality) or just the conclusion (Weighted Sum)?
      *   *Analysis:* The practice sums dollars. $NB = \sum (WTP_i - Cost_i)$. This looks like Utilitarianism ($\sum U_i$).
      *   *Harsanyi Connection:* Harsanyi proves that if Individual preferences satisfy EU, Social preferences satisfy EU, and Pareto holds, then Social Welfare is a weighted sum of Individual Utilities ($W = \sum a_i U_i$).
      *   *The "No Equity Weights" Instruction:* Harsanyi leaves weights ($a_i$) undetermined. The agency's instruction to set weights equal (implicitly, by counting dollars equally) is an *additional* normative constraint, not derived from the theorem itself. It imposes $a_i = 1$ (or constant) relative to the metric used.
      *   *Underdetermination:* The practice assumes the conclusion (summing) without establishing the premises (EU rationality of the *social* planner is assumed via linearity, but individual EU is shaky if WTP isn't linear in utility). The instruction not to weight is a specific choice of $a_i$, contradicting the theorem's openness on weights.
      *   *Drafting Point:* Clarify that the practice assumes the *form* of the conclusion (additive aggregation) but bypasses the derivation of the weights. The "no equity weights" rule fixes the weights to 1 (in dollar terms), which is a substantive ethical choice, not a logical necessity of aggregation.

  4.  **Section 2: The Currency Problem (Dollars vs. Utility):**
      *   *Task:* Weights in Harsanyi are on *utilities*. Practice uses *dollars*. What does counting dollars equally imply about weights on well-being?
      *   *Analysis:* $U_i(M)$ is utility of money. If we sum dollars, we assume $U_i(M) = M$ (risk neutrality) OR we assume we are summing $U_i$ but measuring in dollars where $MU_i$ is constant across persons.
      *   *Reality:* Marginal Utility of Income (MUI) declines. $MU_{poor} > MU_{rich}$.
      *   *Implication:* Counting dollars equally ($\sum \Delta M_i$) implies weighting the *utility* of the rich more than the poor (because it takes more dollars to generate a util for the rich).
      *   *Direction:* Equal dollar weight $\rightarrow$ Unequal utility weight (Pro-rich).
      *   *Defense:* Can it be defended as principled unequal weights? Yes, if the social welfare function is defined over *resources* (resourcism) rather than *welfare* (welfarism). Or if one adopts a "libertarian" view that transfers are illegitimate. But under welfarism, it's regressive.
      *   *Drafting Point:* Explicitly state: Summing dollars with declining MUI implies implicit social weights proportional to income (roughly). This contradicts the "impartial" vibe.

  5.  **Section 3: Invariance Diagnostic (Affine Transformations):**
      *   *Task:* Harsanyi sum is invariant to affine rescaling of $U_i$. Is dollar aggregation invariant?
      *   *Analysis:* Dollar value depends on the baseline income (WTP depends on ability to pay). If Analyst A uses current income and Analyst B uses a hypothetical equalized income, WTP changes.
      *   *Result:* Dollar aggregation is *not* invariant to affine transformations of utility (because dollars are not utils). It relies on a specific cardinalization of utility where $U = Money$.
      *   *Commitment:* The practice is committed to a specific cardinalization (Money = Utility) or universal risk neutrality. It is not merely a "botched equal-weight sum"; it is a sum of a specific metric that lacks the invariance property of true utility aggregation.
      *   *Underdetermination:* The practice doesn't acknowledge this dependency. It treats dollars as if they were utility units.

  6.  **Section 4: Ex Ante vs. Ex Post (Risk & Identifiable Lives):**
      *   *Task:* 1/10,000 to 10k people = 1 certain death. Is this Ex Ante EU?
      *   *Analysis:* Yes, this is classic Ex Ante Utilitarianism (Sum of Expected Utilities). $E[U] = p \cdot U(death) + (1-p) \cdot U(life)$. Linearity in probabilities implies EU.
      *   *Objection:* Ex Post Egalitarianism (Diamond, Epstein). People care about the *distribution* of risk, not just the sum. A lottery where one person dies for sure is worse than a lottery where everyone faces a small risk, even if expected deaths are equal.
      *   *Practice:* The practice treats them identically (Ex Ante).
      *   *Identifiable Lives:* The refusal to score identifiable lives differently in the *calculation* (though noted separately) is consistent with Ex Ante EU. However, if they *actually* treat identifiable lives differently in decision-making (political reality), that's an inconsistency between the *model* and the *decision*. The prompt says guidance asks for a statement but not folding it in. So the *scoring* is consistent (Ex Ante), the *process* acknowledges the tension.
      *   *Drafting Point:* The practice is committed to Ex Ante EU. To register Ex Post concerns, you'd need a non-linear probability weighting function or a concern for ex post inequality in the SWF.

  7.  **Section 5: Non-Linearity of VSL (WTP vs. Risk):**
      *   *Task:* If WTP per unit risk rises for large risks (non-linear), what breaks?
      *   *Analysis:* VSL is defined as the marginal rate of substitution (MRS) between income and risk at $p \to 0$. If WTP is non-linear in $p$, then $U$ is not linear in probabilities, or the MRS changes significantly over the range.
      *   *Break:* It breaks the Expected Utility hypothesis for individuals (if they value risk reduction non-linearly) OR it breaks the linearity of the aggregation (if we just sum WTP).
      *   *Aggregation:* If WTP is non-linear in risk, summing WTP is no longer equivalent to summing Expected Utilities (unless the non-linearity is identical and accounted for). It becomes a sum of *values*, not necessarily *utilities*.
      *   *Harsanyi:* Harsanyi requires EU preferences. If individuals violate EU (e.g., probability weighting), the theorem doesn't apply. The practice would be aggregating something else (Kaldor-Hicks potential compensation).
      *   *Drafting Point:* This breaks the "Individual EU" premise. The practice becomes a Kaldor-Hicks test, not a Harsanyian Social Welfare maximization.

  8.  **Section 6: Implications for Practice (What must change?):**
      *   *Task:* If we took the result seriously, what changes? Distinguish between Aggregation Result, Equal-Weight Premise, and Ex Post Rejection.
      *   *Changes forced by Aggregation Result (Harsanyi):*
          *   Must ensure Individual preferences satisfy EU (fix VSL non-linearity).
          *   Must ensure Social preferences satisfy EU (consistency across risky prospects).
          *   Must use a utility metric invariant to affine transformation (not dollars).
      *   *Changes forced by Equal-Weight/Impartiality:*
          *   Must adjust for Marginal Utility of Income (distributional weights).
          *   Must ensure VSL doesn't vary by income (or adjust for it to equalize welfare).
      *   *Changes forced by Ex Post Rejection:*
          *   Must weight risk distributions (concentrated vs. dispersed).
          *   Must treat identifiable lives differently in the *score*, not just the memo.
      *   *Underdetermination:* Acknowledge that Kaldor-Hicks (potential Pareto) generates the same *ranking* as Utilitarianism *if* MUI is constant. Since MUI isn't constant, the ranking differs. The practice is underdetermined between "Welfarist Utilitarianism" (broken) and "Kaldor-Hicks Efficiency" (coherent but different ethical basis).

  9.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes.
      *   *Check Constraints:* Did I answer all six points in order? Yes.
      *   *Check Philosophy:* Is the distinction between Harsanyi's theorem (premises) and the practice (conclusion only) clear? Yes.
      *   *Check Economics:* Is the MUI argument accurate? Yes. Is the VSL/risk linearity distinction clear? Yes.
      *   *Self-Correction on "Identifiable Lives":* The prompt says the guidance asks for a separate statement but *not* to fold equity weights in. It implies identifiable lives are treated statistically in the *score*. I need to be careful not to say they *are* treated differently in the math, but that the *refusal* to treat them differently is the theoretical commitment.
      *   *Refining the "Underdetermined" flag:* Make sure to explicitly label where the theory doesn't pin down the practice (e.g., the choice of dollar metric vs utility metric).

  10. **Final Polish:** Ensure clear headings corresponding to the user's "First," "Second," etc. structure for ease of integration into their note. (I will use the user's numbering/headers for clarity).

  *(Self-Correction during drafting Section 1)*: I need to be careful about Harsanyi's "Impartiality." Harsanyi uses the "veil of ignorance" to derive *equal* weights. The prompt asks if the practice needs the impartiality step. The practice *uses* equal weights (in dollars). So it *looks* like it uses the conclusion of the impartiality step. But Harsanyi's theorem *without* impartiality just gives *weighted* sum. The agency's instruction "do not fold equity weights in" effectively sets weights to 1 (in dollars). This mimics the *outcome* of the impartiality argument but without the utility adjustment. I need to highlight this distinction.

  *(Self-Correction during drafting Section 3)*: The invariance point is crucial. Dollars are not invariant. If I change the numeraire or the baseline income, WTP changes. Utils (affine transformed) don't change the ranking. This proves the practice is not strictly Harsanyian.

  *(Self-Correction during drafting Section 6)*: Be very precise on "Underdetermined." The practice could be Kaldor-Hicks *or* Utilitarianism with specific assumptions. The math looks the same, the ethics differ.

