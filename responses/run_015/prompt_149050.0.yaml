answer: |-
  **To:** Economic Office Leadership
  **From:** [Your Name/Office]
  **Subject:** Theoretical Reconstruction of Benefit–Cost Practice (Internal Methods Note)

  The following analysis reconstructs the implicit theoretical commitments of our current benefit–cost analysis (BCA) practice. It tests the coherence of this practice against Harsanyi's Aggregation Theorem and related welfare-theoretic constraints. The objective is not to evaluate the normative desirability of the practice, but to identify where the practice is theoretically determined, where it is underdetermined, and where it implicitly contradicts the axioms required to justify its aggregative form.

  ### 1. Reconstruction of the Social Welfare Function and Harsanyi's Premises

  **Reconstruction:**
  Our practice ranks rules by Net Benefits ($NB$), calculated as the sum of individual willingness to pay (WTP) for benefits minus compliance costs, plus the Value of a Statistical Life (VSL) multiplied by expected risk reductions. Formally, for a population $i=1...N$:
  $$ NB = \sum_{i} (WTP_i - Cost_i) + VSL \times \sum_{i} \Delta Risk_i $$
  This structure implies a Social Welfare Function (SWF) that is additive across individuals. If we map dollars to utility, this resembles a Classical Utilitarian SWF: $W = \sum U_i$.

  **Harsanyi's Aggregation Theorem:**
  Harsanyi's theorem states that if (1) individual preferences satisfy Expected Utility (EU) axioms, (2) social preferences satisfy EU axioms, and (3) the Pareto (Unanimity) condition holds, then the social welfare function must be a weighted sum of individual utilities: $W = \sum a_i U_i$.

  **Does the practice need the premises?**
  The practice adopts the *conclusion* of the theorem (additive aggregation) without establishing the *premises*.
  *   **Individual EU:** The practice assumes individuals value risk reductions linearly (VSL $\times$ $\Delta Risk$). This presupposes individual EU rationality regarding mortality risk.
  *   **Social EU:** By summing expected values (VSL $\times$ expected deaths), the agency acts as an expected-utility maximizer.
  *   **Unanimity:** The use of WTP respects individual ordinal rankings (if WTP > 0, the individual prefers the benefit).

  **The Weighting Instruction:**
  Harsanyi's theorem leaves the weights $a_i$ undetermined. The weights are fixed only by adding an "Impartial Observer" or "Veil of Ignorance" premise, which argues for equal weights on *utilities* ($a_i = a_j$).
  Our guidance instructs analysts *not* to apply equity weights. In dollar terms, this sets the weight on every dollar to 1. However, because the metric is dollars, not utilities, this instruction does not replicate Harsanyi's impartiality.
  *   **Finding:** The instruction to exclude equity weights is not a requirement of the aggregation result; it is a separate normative constraint that fixes the weights in *currency* space rather than *utility* space. The aggregation result requires *some* weights, but it does not dictate that they be uniform in dollars. The practice is therefore theoretically underdetermined here: it uses the *form* of a utilitarian sum but fixes the parameters based on a metric (dollars) that the theorem does not validate as a proxy for utility weights.

  ### 2. The Currency Problem: Dollars vs. Utilities

  **The Affine Transformation Issue:**
  In Harsanyi's framework, individual utility functions $U_i$ are unique only up to positive affine transformation ($U'_i = \alpha U_i + \beta$). The social weights $a_i$ absorb these scaling factors. Consequently, the social ranking is invariant to how we normalize individual utility scales.

  **The Dollar Metric:**
  Our practice uses dollars ($M$) as the proxy for utility. A person's utility is an affine function of dollars ($U_i(M) = \alpha M + \beta$) *only if* that person is risk-neutral with respect to money.
  *   **Implication:** If individuals exhibit risk aversion (concave utility of income) or, more critically, if the Marginal Utility of Income (MUI) declines as income rises, then $U_i(M)$ is not linear in $M$, and the slope $\alpha$ differs across individuals ($\alpha_{poor} > \alpha_{rich}$).

  **Weight on Well-Being:**
  By counting every dollar equally ($\sum \Delta M_i$), we implicitly assign social weights proportional to the inverse of the marginal utility of income.
  $$ \text{Implicit Social Weight}_i \propto \frac{1}{MU_i(M)} $$
  Since $MU$ typically declines with income, this practice assigns higher social weight to the well-being of the rich than to the poor.
  *   **Direction:** Equal treatment per dollar amounts to unequal treatment per unit of utility. The direction is regressive (pro-rich).
  *   **Defense:** This can be defended not as a "botched" equal-weight utilitarianism, but as a principled **Resourcist** or **Kaldor-Hicks** approach. If the ethical goal is to maximize aggregate resources rather than aggregate welfare, or if one holds that interpersonal utility comparisons are impossible and only potential compensation (dollars) is measurable, then equal dollar weights are coherent. However, this contradicts the "impartial" framing often used to justify the practice. The practice is underdetermined between Welfarism (which requires utility weights) and Resourcism (which accepts dollar weights).

  ### 3. Diagnostic: Invariance to Affine Rescaling

  **The Test:**
  A Harsanyian sum is invariant to positive affine rescaling of individual utilities. If we change the zero-point or the unit of measurement for an individual's utility, the social ranking of prospects should not change.

  **Application to Dollar Aggregation:**
  Dollar valuation is *not* invariant to rescaling because the conversion from utility to dollars depends on the reference income level.
  *   **Scenario:** Analyst A converts utility gains to dollars at current income levels. Analyst B converts utility gains to dollars at a hypothetical equalized income level.
  *   **Result:** Because WTP depends on ability to pay (income), Analyst A and Analyst B will generate different dollar values for the same utility gain. If the income distribution is skewed, they may reverse the ranking of two rules.
  *   **Establishment:** This establishes that dollar-metric aggregation is **not** a Harsanyian sum. It lacks the invariance property required of utility aggregation.
  *   **Commitment:** The practice is committed to a specific cardinalization of utility: $U = Money$. It assumes universal risk-neutrality in money *or* arbitrarily selects the current income distribution as the fixed numeraire for utility. This is a substantive, unargued choice of cardinalization, not a neutral aggregation of pre-existing preferences.

  ### 4. Ex Ante vs. Ex Post Evaluation

  **Current Practice:**
  The practice equates a certain death to one person with a $1/10,000$ risk to $10,000$ people. Both are scored as "one statistical life."
  *   **Commitment:** This is a strict **Ex Ante** evaluation. It sums Expected Utilities ($\sum E[U_i]$). It implies indifference to the distribution of risk, provided the expectation is constant.

  **The Objection:**
  The best-known objection is **Ex Post Egalitarianism** (e.g., Diamond, 1967). This view holds that a social state where one person dies for sure is worse than a state where everyone faces a small risk, even if expected deaths are identical, due to the unfairness of the ex post outcome (one person bears the full burden).
  *   **Registration:** To register this objection, the SWF would need to include a term for the variance of outcomes or apply a non-linear weighting to probabilities (e.g., weighting certain losses more heavily than probabilistic ones).
  *   **Scoring Rule Change:** We would need to move from $VSL \times \sum \Delta Risk$ to a function $f(\Delta Risk_i)$ where $\sum f(p) \neq f(\sum p)$. For example, applying a "risk aversion" parameter at the social level.
  *   **Identifiable Lives:** The guidance asks for a separate distributional statement but forbids folding equity weights into the net benefit. This creates a division of labor: the *score* remains Ex Ante (statistical), while the *memo* acknowledges Ex Post concerns (identifiable).
  *   **Consistency:** This is not a logical inconsistency within the scoring model, but it is a pragmatic inconsistency in decision-making. If the Ex Post concern is morally relevant enough to warrant a memo, the Ex Ante model is technically misspecified for the agency's actual ethical deliberations. However, strictly speaking, the *scoring rule* is consistent with Ex Ante Utilitarianism.

  ### 5. Non-Linearity of Willingness to Pay (VSL)

  **The Scenario:**
  Suppose review finds WTP per unit of risk reduction is higher for large risk reductions than for small ones (e.g., WTP to reduce risk from 10% to 9% is higher per unit than from 0.01% to 0.009%).
  *   **Broken Premise:** This violates the **Individual Expected Utility** premise. In standard EU theory, the value of a risk reduction is linear in the probability change (for small risks) or follows a specific curve derived from the utility function. Systematic non-linearity in WTP that cannot be explained by income effects suggests individuals do not weight probabilities linearly (violating the independence axiom).
  *   **Aggregation Status:** If individuals violate EU, Harsanyi's theorem does not apply. We are no longer aggregating Expected Utilities. We are aggregating *values* that do not map cleanly to a coherent utility function.
  *   **Implication:** The practice becomes a **Kaldor-Hicks Potential Compensation Test** rather than a Welfare Maximization exercise. We are summing monetary equivalents, not utilities.
  *   **Guidance:** The aggregation result offers no guidance on how to proceed once the EU premise fails. We would have to choose between correcting the WTP to force linearity (imposing rationality) or accepting that the sum no longer represents a welfare function. The practice currently assumes linearity (constant VSL); if evidence breaks this, the theoretical link to social welfare is severed.

  ### 6. Implications for Practice: Required Changes vs. Underdetermination

  If we took the Harsanyi aggregation result seriously as a constraint on our practice, the required changes depend on which ethical premises we adopt.

  **A. Changes Forced by the Aggregation Result (Technical Coherence)**
  *   **Metric Invariance:** We must abandon the dollar metric as a direct proxy for utility unless we can demonstrate risk-neutrality in income. We would need to convert dollars to utils using estimated utility functions before aggregating.
  *   **EU Consistency:** We must ensure the VSL calculation reflects linear probability weighting. If WTP is non-linear in risk, we cannot use a constant VSL figure; we must integrate the marginal WTP over the risk change.

  **B. Changes Forced by the Equal-Weight/Impartiality Premise (Ethical Coherence)**
  *   **Distributional Weights:** If we claim impartiality (equal weight on *welfare*), we must apply weights to dollars to correct for declining Marginal Utility of Income. A dollar to a low-income household must count for more than a dollar to a high-income household.
  *   **VSL Adjustment:** If VSL rises with income (as our practice admits), using a single VSL figure implicitly weights the lives of the rich more heavily. Impartiality would require either a single VSL adjusted to a reference utility level or income-adjusted VSLs that are then weighted inversely by income in the aggregation.

  **C. Changes Forced by Rejecting Ex Ante Evaluation (Ex Post Coherence)**
  *   **Risk Distribution:** We would need to modify the scoring rule to penalize concentrated risks relative to dispersed risks.
  *   **Identifiable Lives:** We would need to fold the "identifiable life" concern into the net benefit calculation (e.g., via a higher weight for certain deaths), rather than isolating it in a qualitative statement.

  **D. Areas of Underdetermination**
  The note should explicitly flag the following as underdetermined by the theory:
  1.  **Welfarism vs. Kaldor-Hicks:** The current spreadsheets are mathematically compatible with both Utilitarianism (assuming constant MUI) and Kaldor-Hicks Efficiency (ignoring MUI). The theory does not tell us which one we are doing; only our ethical intent does.
  2.  **The Numeraire:** Harsanyi's theorem does not dictate that dollars are the correct numeraire. The choice to use dollars without utility conversion is a pragmatic choice, not a theoretical necessity.
  3.  **Risk Attitudes:** The practice assumes the social planner is risk-neutral regarding the *number* of deaths (summing expected values). This is not required by individual rationality. A risk-averse social planner would value the avoidance of catastrophic (high-variance) outcomes more highly, even at the same expected value.

  **Conclusion for the Note:**
  The practice is not "implicitly Utilitarian" in the Harsanyian sense. It is a **Dollar-Weighted Aggregation** that mimics the *form* of Utilitarianism while violating its *invariance* and *weighting* conditions. It is theoretically coherent only if interpreted as a Kaldor-Hicks efficiency test or a Resourcist SWF. If the agency intends to maximize Social Welfare in the Harsanyian sense, the current practice is misspecified regarding income distribution and risk cardinalization.
