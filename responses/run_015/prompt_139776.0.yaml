  # Diagnostic Instrument: The Modal Space Tree

  **Instructions:** Answer each question with **Yes**, **No**, or **It Depends** (if you must, but try to pick a side). Your path through the tree will locate your pre-theoretical commitments. Do not worry about which "school of thought" you belong to; answer based on what you find yourself willing to assert.

  ### The Tree

  **Node 1 (Realism):** Are there truths about how things could have been that would remain true even if no intelligent beings existed to think or speak about them?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  **Node 2 (Epistemology/Status):** When you assert "It is possible that P," are you describing a useful fiction, or merely expressing a non-cognitive attitude (like approval or relief)?
  *   **Fiction** → **Leaf: Fictionalism**
  *   **Attitude** → **Leaf: Deflationism**

  **Node 3 (Quantification — Case: Human Duplicate):** Could there have been a human being qualitatively indiscernible from you (same memories, shape, atoms) who is nevertheless *not* you?
  *   **No** (That would be you) → Go to Node 4.
  *   **Yes** (Distinct individual) → Go to Node 5.

  **Node 4 (Grounding):** Are these modal truths made true by something non-modal (like physical stuff or abstract sets), or are they primitive facts with no further explanation?
  *   **Primitive** → **Leaf: Brute Primitivism**
  *   **Non-Modal Ground** → Go to Node 6.

  **Node 5 (De Re — Case: Wooden Table):** Could *this very table* have been made of entirely different material (e.g., ice instead of wood), assuming it looked and functioned the same?
  *   **No** (Origin is essential) → Go to Node 6.
  *   **Yes** (Matter is accidental) → Go to Node 7.

  **Node 6 (Alien Constituents — Case: Alien Property):** Could there exist a fundamental property of nature that nothing actual currently instantiates and nothing actual could ever instantiate?
  *   **No** (All properties are variations of actual ones) → **Leaf: Combinatorial Reduction**
  *   **Yes** (Alien properties possible) → Go to Node 8.

  **Node 7 (Concrete Fork):** Are the things that make these truths true concrete objects like you and me, just located elsewhere?
  *   **No** → Go to Node 8.
  *   **Yes** → Go to Node 9.

  **Node 8 (Abstract/Actualist Ground):** Are these truths grounded in abstract representations (like sentences or propositions) or in the causal powers inherent in actual things?
  *   **Powers/Essences** → **Leaf: Essence/Power Grounding**
  *   **Abstract Representations** → Go to Node 9.

  **Node 9 (Maximality — Case: Nothing Concrete):** Could there have been a world containing absolutely no concrete matter or energy at all?
  *   **No** (Worlds must contain concrete stuff) → **Leaf: Concrete Modal Realism (Restricted)**
  *   **Yes** → Go to Node 10.

  **Node 10 (Cardinality/Construction):** Are there more ways for things to be than there are sets of sentences, and must we use modal words (like "consistent") to construct the things that represent these ways?
  *   **No** (Non-modal construction, limited cardinality) → **Leaf: Abstract Realism (Linguistic)**
  *   **Yes** (Modal construction, high cardinality) → **Leaf: Abstract Realism (Propositional/Circular)**
  *   **Yes** (Concrete plurality, all recombinations) → **Leaf: Concrete Modal Realism (Plenitude)**

  *(Note: Node 10 serves as a final filter for the Realist branches to distinguish the specific varieties of Abstract and Concrete realism based on plenitude and construction.)*

  ---

  ### Scoring Table

  | Leaf Position | Path (Answers to Nodes 1-10) | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Fictionalism** | 1-No, 2-Fiction | You must explain why modal logic works if its subject matter is literally false. |
  | **Deflationism** | 1-No, 2-Attitude | You must explain the apparent objectivity of modal disagreement without truth-conditions. |
  | **Brute Primitivism** | 1-Yes, 3-No, 4-Primitive | You accept modal facts that have no explanation in terms of what exists. |
  | **Combinatorial Reduction** | 1-Yes, 3-No, 4-Non-Modal, 6-No | You must deny the possibility of alien properties or fundamental novelty. |
  | **Essence/Power Grounding** | 1-Yes, 3-No/Yes, 4-Non-Modal, 6-Yes, 8-Powers | You must commit to dispositional essences that are not always manifest. |
  | **Concrete Realism (Restricted)** | 1-Yes, 3-Yes, 5-No, 7-Yes, 9-No | You posit concrete worlds but deny some recombinations, inviting charges of arbitrariness. |
  | **Concrete Realism (Plenitude)** | 1-Yes, 3-Yes, 5-Yes, 7-Yes, 9-Yes, 10-Concrete | You commit to the literal existence of talking donkeys and witches as concrete entities. |
  | **Abstract Realism (Linguistic)** | 1-Yes, 3-Yes, 5-No, 7-No, 8-Abstract, 10-No | You reduce modality to language, risking the claim that reality depends on our syntax. |
  | **Abstract Realism (Prop/Circ)** | 1-Yes, 3-Yes, 5-Yes, 7-No, 8-Abstract, 10-Yes | You construct worlds using modal notions, risking circularity in your analysis. |
  | **Hybrid/Unoccupied** | *Various* | *See Diagnosis Below.* |

  ---

  ### Diagnosis of Unoccupied or Contested Regions

  **1. Concrete Plurality without Plenitude (Concrete Restricted)**
  *   **Location:** Node 7 (Yes) → Node 9 (No).
  *   **Diagnosis:** This region is largely unoccupied because it is unstable. The primary motivation for accepting concrete worlds is to analyze modality via recombination (Humean supervenience). If you accept concrete worlds but deny that every recombination of their constituents forms a world, you must explain *which* recombinations are valid. That explanation will inevitably be modal (e.g., "only law-governed recombinations"). Thus, modality re-enters through the back door, and you lose the reductive advantage that motivated accepting the plurality in the first place. It is empty because the view is theoretically costly without gaining the reductive benefit.

  **2. Abstract Construction using Modal Notions (Abstract Circular)**
  *   **Location:** Node 8 (Abstract) → Node 10 (Yes/Modal Construction).
  *   **Diagnosis:** This region is crowded but contested. Many actualists (e.g., Plantinga) occupy this space, admitting that "possible worlds" are defined via "maximal consistent sets of propositions," where "consistent" means "possibly true." Critics argue this region is occupied only as a polemical target or a resting place for those who give up on reduction. It is not incoherent, but it is unattractive to those seeking a reductive analysis of modality. It is occupied by those who prioritize actualism over reduction.

  ---

  ### Indistinguishability Flags

  The following pairs of leaves are difficult to separate using this instrument alone:

  1.  **Concrete Realism (Plenitude) vs. Fictionalism:**
      *   **Problem:** Both yield identical first-order verdicts about what is possible (e.g., "Yes, there could be a blue sun").
      *   **Required Question:** A semantic question about the literal truth of existential claims ("Do these worlds exist *literally* or *according to a story*?"). This is often a methodological dispute about theoretical virtue (parsimony) rather than a metaphysical one about cases.

  2.  **Essence/Power Grounding vs. Brute Primitivism:**
      *   **Problem:** Both deny that modal truths are grounded in concrete worlds or abstract representations.
      *   **Required Question:** A metaphysical question about the structure of properties ("Do properties have dispositional essences?"). Without a specific theory of properties, the verdicts on modal claims often overlap.

  3.  **Fictionalism vs. Deflationism:**
      *   **Problem:** Both deny mind-independent modal facts.
      *   **Required Question:** A semantic question about the function of modal language ("Is 'possible' a predicate describing a fiction, or an operator expressing a stance?"). If the deflationist allows modal idioms in their metalanguage, the distinction collapses into a verbal dispute.

  ---

  ### Closing Analysis

  The single most discriminating question is **Node 3 (Quantification — Case: Human Duplicate)**. It forces an immediate split between those who treat individuals as bound to their actual origins (Essentialists/Actualists) and those who treat individuals as transferrable across qualitative spectra (Haecceitists/Combinatorialists). This choice dictates whether one's theory of modality must accommodate *de re* necessity or can reduce everything to *de dicto* qualitative descriptions.

  The "wild" patterns are those that answer **Yes** to Node 1 (Realism) and **Yes** to Node 7 (Concrete Worlds) but **No** to Node 5 (Table Case). This suggests a student who believes in concrete alternate realities but denies that objects can survive material change across them. This pattern leads to no stable occupied leaf because Concrete Realists typically embrace recombination (Node 5 Yes) to justify the worlds. A student producing this pattern likely holds an unexamined mixture of intuitions: they want the explanatory power of concrete worlds but retain actualist intuitions about identity. They should be flagged for a conference on *transworld identity*.
