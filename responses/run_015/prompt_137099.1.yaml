answer: |-
  Reject step (4) by denying that any outcome has literally infinite utility, since bounded utility functions are independently required to solve standard paradoxes like St. Petersburg and preserve your decision rule without forcing epistemic dogmatism.

  Step (4) looked plausible because theological and utilitarian intuitions often treat "salvation" or "existential success" as limitless goods that lexically dominate finite concerns, and standard expected utility formulas handle finite numbers cleanly enough that the breakage at infinity isn't immediately obvious. However, infinite utilities break the arithmetic of expected utility theory regardless of imprecise credences; by capping utility at a very large finite number, you prevent any single hypothesis from swamping all others simply by virtue of being infinite, which restores the ability of probabilities and finite magnitudes to discriminate between actions like "finish thesis" versus "flip coins."

  The cost of this fix is that you must accept bounded utility, meaning no outcome is infinitely valuable and there is some threshold of probability below which even the best conceivable outcome won't outweigh a certain smaller good. For your x-risk work, this means you cannot model the future as having infinite value, though you can still assign it astronomically high finite value sufficient to justify large sacrifices for tiny probability shifts. This is generally cheaper than the alternative fix of rejecting step (3), which would require you to assign zero credence to conceivable hypotheses (violating Bayesian regularity) and render you unable to update your beliefs should evidence for those "excluded" hypotheses ever appear.
