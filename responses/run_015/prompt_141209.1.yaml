      *   *Key Insight:* The distinction isn't Tool vs. Agent. It's **Delegated Action vs. Delegated Judgment.**
          *   Tools = Delegated Action (Human decides, Tool does).
          *   Agents = Delegated Judgment (Tool decides, Human checks).
          *   Your committee allows Delegated Action (with limits). You allow Delegated Judgment *only if* the Judgment is auditable.
