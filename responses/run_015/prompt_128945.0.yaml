answer: |-
  Dear Friend,

  It is a pleasure to hear from you and to learn about the discussion group you have cultivated since leaving the lab. Your background in biochemistry is actually a wonderful asset for tackling G.E. Moore, whose work in Principia Ethica is famously analytical and attempts to treat ethical concepts with a kind of conceptual precision that should feel familiar to a scientist. I noticed your note about the typo regarding unitiy, and I want to assure you that such slips are entirely human and of no consequence here, though I will use the standard spelling in this letter simply to maintain clarity for your group materials. You have asked me to design an activity that allows your participants to discover Moore's concept of organic unity without a preliminary lecture, and I have spent some time considering how best to structure this. I initially brainstormed a resource trading game where participants would exchange tokens representing pleasure and utility, but I discarded that because it risks reinforcing the very additive model of value we are trying to complicate, making friendship look like a mere economic contract. I also considered a collaborative art exercise where pairs create a drawing together, but I worried that the scoring would be too subjective and might distract the scientists in your group who prefer clear metrics. I have settled instead on a scoring game called The Composition of Value, which uses a hidden rule set to force participants to experience the failure of simple addition before revealing the philosophical principle.

  The activity is designed for your eight participants, divided into four pairs, and fits within your ninety-minute window. You will need index cards, a scoring sheet for each pair, and a timer. The game consists of three rounds. In the first round, lasting fifteen minutes, each individual receives five cards describing experiences, such as viewing a sunset, solving a complex puzzle, or listening to a symphony. They must assign a point value from one to ten to each card based on how much intrinsic worth they believe the experience holds in isolation. In the second round, lasting thirty minutes, the pairs sit together and are given five new cards that describe shared experiences, such as discussing a theory with a friend or viewing art together. The rule given to them is explicit: calculate the value of the shared experience by adding the individual scores of the two participants from round one. For example, if person A values art at eight and person B values conversation at seven, the shared experience is worth fifteen. They record these sums. In the third round, lasting thirty minutes, you introduce a new rule without explaining the philosophy behind it. You tell them they may revise their scores for the shared experiences, but to claim any points above the simple sum they calculated in round two, they must write a one-sentence justification on the back of the card explaining why the combination creates a specific quality that neither person brought alone. You, acting as the facilitator, hold a key. If their justification identifies a relational quality, such as mutual recognition or shared emotional resonance, you multiply their score by one point five. If they merely restate the sum or focus on individual pleasure, the score remains the additive sum. The final fifteen minutes are reserved for tallying points and declaring a winning pair, though the real payoff is the discrepancy they will see between the rounds.

  Once the game concludes and the scores are tallied, you should move immediately into the debrief without changing the seating arrangement. You will likely find that the pairs who scored highest in round three are the ones who articulated something about the relationship itself rather than the individuals. This is the moment to introduce Moore's distinction between a mere mixture and an organic unity. You can explain that in round two, they treated the friendship experience as a mixture, where the value of the whole is simply the sum of the values of the parts, much like mixing two chemicals where the mass is conserved but nothing new emerges. In round three, those who succeeded treated the experience as an organic unity, where the existence of the whole alters the value of the parts, creating a surplus value that only exists because of the specific configuration of the relationship. Moore argues that the highest goods are complex wholes that include both a cognitive element and an emotional element. In the context of friendship, this means that the value is not just in my pleasure nor in your usefulness to me, but in the consciousness of the other person's good qualities accompanied by an appropriate emotional response. When your participants wrote justifications about recognizing something in the other person that amplified the experience, they were inadvertently modeling Moore's claim that true friendship requires loving the good qualities in the other person for their own sake, not merely for the reflexive pleasure it gives the self.

  There are predictable difficulties you should anticipate when running this for the first time, particularly with a group of scientists. The most likely issue is that participants will try to game the justification rule in round three by writing pseudo-scientific or utilitarian explanations that sound relational but are actually additive, such as saying we worked more efficiently together. You will need to be firm in withholding the multiplier if the justification does not point to the intrinsic value of the shared consciousness itself. You might also find that some pairs feel frustrated by the subjectivity of your ruling on their justifications, so you should emphasize during the instructions that you are looking for descriptions of emergence rather than efficiency. More importantly, you need to be aware of what this activity cannot reproduce. The game demonstrates that psychological satisfaction is higher when people feel a connection, which is an empirical claim about human psychology. Moore's claim, however, is metaphysical and normative; he argues that these organic unities are objectively good regardless of whether anyone feels satisfied by them. The activity shows that the whole feels greater than the sum of the parts, but it cannot prove that the whole is objectively better in a moral sense. You will need to supply this distinction in the discussion by asking them whether the value would disappear if no one was there to experience it, guiding them toward Moore's idea that intrinsic value is a non-natural property that attaches to these organic unities independently of our subjective enjoyment.

  I hope this structure serves your group well and sparks the kind of rigorous engagement that Moore's work deserves. It is a delight to imagine a group of retired scientists grappling with the non-additive nature of value, and I suspect your biochemistry background will help you steer the conversation when the discussion turns to emergence and complex systems. Please feel free to adapt the timing if the conversation flows naturally in a different direction, as the goal is insight rather than strict adherence to the clock. I wish you and your discussion group a wonderful session exploring the complexities of friendship and beauty.

  Warmly,

  Your Colleague in Philosophy
