answer: |-
  **Joint Statement on Well-Being and the Experience Machine**

  We, the undersigned, submit this adversarial collaboration regarding hedonism and desire-satisfaction theory. Having debated since September, we acknowledge shared ground while isolating precise points of divergence.

  **1. Agreed Claims**
  1.  **Hedonic Realism:** Felt quality and hedonic tone are genuine constituents of well-being; the dispute concerns exclusivity, not existence.
  2.  **Data Contamination:** Refusal of Nozick's Machine is robust data but is confounded by status-quo bias, as evidenced by De Brigard's reversal.
  3.  **Symmetrical Difficulty:** The Deceived Businessman case (successful, loved, unaware of lies) challenges Desire Theory as severely as the Machine challenges Hedonism.
  4.  **Heterogeneity Problem:** Neither framework currently explains the qualitative differences between bodily pleasure, achievement, and tragic enjoyment.

  **2. Disagreements**

  | Issue | Hedonist Position | Desire Theorist Position |
  | :--- | :--- | :--- |
  | **Core Value** | Well-being consists exclusively in conscious experience. | Well-being consists in the satisfaction of pro-attitudes toward the world. |
  | **Machine Refusal** | Irrational bias against simulated states. | Rational preference for authentic contact with reality. |
  | **Annuity Machine** | Morally permissible; well-being is secured. | Morally problematic; agency-related desires are frustrated. |

  **3. Cruxes and Predictions**
  We identify three empirical or conceptual tests. Both sides sign off on the cases listed; predictions are falsifiable.

  *   **(a) Unnoticed Frustration (The Bereaved Mother)**
      *   *Case:* A mother believes her son lives; he has died. She feels no grief.
      *   *Hedonist Prediction:* Her well-being is unaffected by the death.
      *   *Desire Prediction:* Her well-being is objectively lowered at the moment of death.
  *   **(b) De Brigard Reversal (Loss Aversion vs. Truth)**
      *   *Case:* Subjects offered exit from Machine vs. offered entry.
      *   *Hedonist Prediction:* Refusal rates will equalize when loss aversion is controlled; truth-value is irrelevant.
      *   *Desire Prediction:* Refusal rates will remain significant even when loss aversion is controlled; truth-value matters.
  *   **(c) Pleasure Homogeneity**
      *   *Case:* Neurophenomenological mapping of bodily vs. achievement pleasure.
      *   *Hedonist Prediction:* A single common neural substrate will correlate with all reported pleasure.
      *   *Desire Prediction:* Distinct substrates will correlate with distinct satisfaction types.

  **4. The Annuity Machine**
  In this variant (10 years, real world matches fed experience, causation external), we take firm positions. The Hedonist asserts the subject suffers no harm and gains well-being, as experience is veridical and positive. The Desire Theorist asserts damage is done to the subject's objective interest in agency, even if unnoticed, because the subject's desire to *cause* outcomes is frustrated.

  **5. Verbal Dispute Flag**
  We flag a potential verbal dispute regarding "pleasure." The Hedonist defines it strictly as raw felt quality. The Desire Theorist often conflates it with attitudinal liking-of-state. This ambiguity complicates the heterogeneity claim (Agreed Claim 4) and must be resolved before Claim 3(c) can be tested.

  **Signatures**

  __________________________ (Hedonist)

  __________________________ (Desire Theorist)
