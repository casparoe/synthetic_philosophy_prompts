  **Joint Statement on Consequentialist Demandingness and Agent-Relative Reasons**

  Following a structured adversarial collaboration, the defenders of the "threshold prerogative" objection and proponents of "scalar integration" submit this joint statement regarding the structure of moral obligation within consequentialist frameworks. While we diverge significantly on the mechanism of obligation, we share a commitment to refining consequentialism to address intuitive objections regarding excessive demandingness.

  **I. Agreed Claims**
  1.  **Moral Demandingness:** The extent to which a normative theory demands sacrifice of personal interests is a legitimate criterion for evaluating its plausibility.
  2.  **Optimizing vs. Satisficing:** The distinction between optimizing (maximizing value) and satisficing (meeting a sufficient standard) is conceptually coherent and relevant to obligation.
  3.  **Agent-Relative Reasons:** Agent-relative reasons can be incorporated into consequentialist frameworks without abandoning the theory's core commitment to value promotion, though the structural integration remains contested.

  **II. Points of Divergence**

  | Issue | Threshold Prerogative Formulation | Scalar Integration Formulation |
  | :--- | :--- | :--- |
  | **Nature of Obligation** | Morality must recognize a protected sphere of agent-relative interests, so that demands to maximize the good become illegitimate once a baseline of personal projects is secured. | Consequentialist obligations are continuously weighted rather than binary, so that no single threshold activates an overriding duty and the experience of excessive demand is an artifact of treating scalar costs as all-or-nothing requirements. |
  | **Collective-Action Problems** | Individual exemptions are justified when coordination fails to secure the baseline, preventing exploitation of compliant agents. | Obligations persist proportionally to marginal impact regardless of coordination, requiring agents to absorb cumulative scalar weights. |

  **III. Identified Cruxes and Test Cases**
  We identify three substantive disagreements where empirical or conceptual clarification could shift consensus. For each, we specify a bearing case and our divergent evaluations.

  1.  **The Non-Arbitrary Baseline**
      *   *Crux:* Whether a non-arbitrary baseline of protected self-interest exists objectively.
      *   *Case:* An agent must choose between funding a moderate personal artistic project or donating equivalent funds to effective famine relief.
      *   *Threshold Evaluation:* If the project secures the baseline of personal integrity, the agent is permitted to fund art; obligation ceases.
      *   *Scalar Evaluation:* No permission exists; there is only a weaker reason to fund art compared to relief, proportional to the personal cost.

  2.  **Pressure Redistribution**
      *   *Crux:* Whether continuous weighting genuinely reduces experienced moral pressure or merely redistributes it across choices.
      *   *Case:* A series of daily minor sacrifices versus a single large demand yielding equivalent total value.
      *   *Threshold Evaluation:* Pressure is eliminated entirely once the baseline is maintained, regardless of cumulative potential value.
      *   *Scalar Evaluation:* Pressure is reduced per instance but persists continuously; the aggregate psychological burden may exceed the threshold model's binary relief.

  3.  **Uncoordinated Agency**
      *   *Crux:* Whether uncoordinated agency undermines the scalar defense.
      *   *Case:* A public good scenario where individual contributions are negligible unless many participate, but participation is costly.
      *   *Threshold Evaluation:* Uncoordinated agency justifies the prerogative; an individual is not required to bear high costs for negligible impact if others fail to cooperate.
      *   *Scalar Evaluation:* Uncoordinated agency does not negate obligation; the scalar weight adjusts to the low probability of success, but the reason to contribute remains non-zero.

  **IV. Conclusion**
  This collaboration clarifies that our dispute is not regarding the intrinsic value of outcomes, but the structural architecture of obligation and the phenomenology of moral demand. Future work should focus on the psychological reality of scalar pressure and the metaphysical status of agent-relative baselines.
