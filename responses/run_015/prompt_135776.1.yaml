  5.  **Drafting Conclusion (Sister & Coherence):**
      *   *Sister's Grice:* She's mostly right. Implicature is cancellable *in principle*, but not if it violates the maxims (like Quality or Relation) too blatantly. "I'm not saying X" doesn't work if the context screams X. Grice relies on *cooperation*; dog whistles aren't cooperative.
