  Your sister is mostly right about Grice, but she missed the catch. Grice says implicatures are cancellable *in principle*, but only if the speaker is being cooperative. If you say something obviously insulting and add "just kidding," you're violating the Maxim of Quality (truthfulness) or Relation (relevance). Grice assumes people are trying to communicate truthfully; your conduct code assumes people might be trying to evade responsibility. So, cancellability fails when the context makes the denial implausible.

  As for the code, it is absolutely two theories duct-taped together. It uses a **Hearer-Based** view for victims (if you feel harassed, you are) to ensure safety, but an **Intention-Based** view for defendants (if you didn't mean it, you're safe) to ensure fairness. Philosophically, this is incoherent—meaning can't be both entirely in the head and entirely in the ear. But pragmatically, it's stable. It prevents literalists from exploiting loopholes while preventing strict liability for accidents. It's not good philosophy, but it's probably good administration.
