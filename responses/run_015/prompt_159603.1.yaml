answer: |-
  # Tribunal Freedom Decision Tree

  **Instructions:** Start at **Question 1**. Follow the verdict you would give for that case to the next numbered question or to a **Leaf**. Answer only the questions on your path.

  **Q1. The Recall Case**
  A patient is discharged from hospital. She lives at home, has had no contact with services for months, and no restrictions on her movement. However, her legal status remains "liable to recall" at a clinician's discretion. The clinician has never used this power against her.
  *Is she free?*
  *   **No (She is unfree):** Go to **Q2**.
  *   **Yes (She is free):** Go to **Q6**.
  *   **Doesn't settle it:** Go to **Q9**.

  ---

  ### Path A: Power Makes Unfree (Q1 = No)

  **Q2. The Ward Rule Case**
  A patient is subject to a ward rule applied to her daily (e.g., confiscation of phones at night). The rule is published, appealable, has been overturned on appeal for other patients, but never for her.
  *Is she free?*
  *   **No (Unfree despite appeal):** Go to **Q3**.
  *   **Yes (Free due to appeal):** Go to **Q4**.
  *   **Doesn't settle it:** Go to **Q3**.

  **Q3. The Benevolent Dictator Case**
  A rule serves the patient's clinical interests perfectly. It was imposed without consultation and cannot be challenged.
  *Is she free?*
  *   **No (Unfree without consent/challenge):** → **Leaf 1**
  *   **Yes (Free if interests served):** → **Leaf 2**

  **Q4. The Ignored Challenge Case**
  A rule is fully open to challenge and consultation. However, when challenged, the clinician ignores the patient's needs and interests consistently.
  *Is she free?*
  *   **No (Unfree if interests ignored):** → **Leaf 3**
  *   **Yes (Free if procedure followed):** → **Leaf 4**

  ---

  ### Path B: Interference Makes Unfree (Q1 = Yes)

  **Q6. The Funding Formula Case**
  A patient is legally eligible for therapy but cannot access it because a funding formula excludes her region. No specific clinician decided to deny her; it is an algorithmic outcome.
  *Is she free?*
  *   **No (Unfree due to structure):** Go to **Q7**.
  *   **Yes (Free; no person interfered):** Go to **Q8**.

  **Q7. The Waiting List Case**
  A patient is denied treatment due to a waiting list caused by underfunding. She has the legal right to treatment but no effective opportunity to receive it.
  *Is she free?*
  *   **No (Unfree without capacity):** → **Leaf 5**
  *   **Yes (Free if legally permitted):** → **Leaf 6**

  **Q8. The Physical Barrier Case**
  A patient is legally free to leave the hospital, but the only road out is flooded. No person blocked the road.
  *Is she free?*
  *   **No (Unfree due to obstacle):** → **Leaf 5**
  *   **Yes (Free; no agent blocked):** → **Leaf 6**

  ---

  ### Path C: Will Settles It (Q1 = Doesn't Settle)

  **Q9. The Advance Directive Case**
  A patient signed a directive requesting treatment if she relapsed. She is now relapsing and refusing treatment. We force treatment based on her past signature.
  *Is she free?*
  *   **Yes (Free via past self):** Go to **Q10**.
  *   **No (Unfree via current refusal):** → **Leaf 7**
  *   **Doesn't settle it:** Go to **Q10**.

  **Q10. The Illness Refusal Case**
  A patient refuses medication. His refusal appears to us to be a direct symptom of his delusion, not something he would endorse when well. We override him.
  *Is she free?*
  *   **Yes (Free via real will):** → **Leaf 8**
  *   **No (Unfree via current will):** → **Leaf 7**

  **Q11. The Internal Compulsion Case**
  A patient is not detained but has a phobia so severe she cannot leave her house. No person stopped her.
  *Is she free?*
  *   **No (Unfree due to internal state):** → **Leaf 8**
  *   **Yes (Free; no external interference):** → **Leaf 6**

  ---

  ### The Leaves

  **Leaf 1: Freedom as Non-Domination (Consent-Based)**
  *Reached via Q1(No) → Q2(No) → Q3(No).*
  **Name:** Republican Liberty (Strict).
  **Cost:** You must accept that a patient with kind clinicians who never interfere is still unfree if she lacks the legal power to challenge them.

  **Leaf 2: Freedom as Non-Domination (Interest-Based)**
  *Reached via Q1(No) → Q2(No) → Q3(Yes).*
  **Name:** Paternalistic Republicanism (Unnamed).
  **Cost:** You must accept that a patient subject to unchallengeable rules is free, provided those rules happen to benefit her.

  **Leaf 3: Freedom as Non-Domination (Contestability-Based)**
  *Reached via Q1(No) → Q2(Yes) → Q4(No).*
  **Name:** Procedural Republicanism (Unnamed).
  **Cost:** You must accept that a patient whose needs are systematically ignored is free, provided she had the right to complain about it.

  **Leaf 4: Freedom as Non-Domination (Pure Procedure)**
  *Reached via Q1(No) → Q2(Yes) → Q4(Yes).*
  **Name:** Democratic Liberty (Unnamed).
  **Cost:** You must accept that a patient is free even if the system is rigged against her, as long as the rigging follows established rules.

  **Leaf 5: Freedom as Effective Opportunity**
  *Reached via Q1(Yes) → Q6(No) → Q7(No) OR Q8(No).*
  **Name:** Capability Approach.
  **Cost:** You must accept that the tribunal is responsible for securing funding and resources, not just reviewing legal status.

  **Leaf 6: Freedom as Absence of Interference**
  *Reached via Q1(Yes) → Q6(Yes) → Q8(Yes) OR Q11(Yes).*
  **Name:** Negative Liberty.
  **Cost:** You must accept that a patient starved by a funding algorithm or paralyzed by phobia is free, provided no person actively stopped her.

  **Leaf 7: Freedom as Current Will**
  *Reached via Q1(Doesn't) → Q9(No) OR Q10(No).*
  **Name:** Volitional Autonomy (Unnamed).
  **Cost:** You must accept that you cannot treat a patient against her current wishes, even if her past self begged you to and her current refusal is caused by psychosis.

  **Leaf 8: Freedom as Self-Mastery**
  *Reached via Q1(Doesn't) → Q9(Yes) → Q10(Yes) OR Q11(No).*
  **Name:** Positive Liberty.
  **Cost:** You must accept that you can claim to make a patient freer by overriding her expressed desires, based on your judgment of her "real" will.

  ***

  # Notes on the Tree Structure

  **The three required splits are distributed across the first question of each path.**
  Question 1 separates those who see power itself as unfreedom from those who require interference, while the "Doesn't settle" option captures those who prioritize the will over the status. Questions 2, 3, and 4 dissect the "Arbitrariness" split by isolating interest-tracking, contestability, and consent into separate cases where they conflict. Questions 9, 10, and 11 handle the "Divided Will" split by contrasting past directives, illness-driven refusals, and internal compulsions. Questions 6, 7, and 8 isolate the "Personal vs. Structural" split by removing human agents from the constraint.

  **Some named philosophical views occupy multiple leaves because they are silent on specific distinctions.**
  "Freedom as Non-Domination" appears across Leaves 1, 2, 3, and 4 because republican theory debates whether arbitrariness is defined by lack of consent, lack of interest-tracking, or lack of contestability; this tree forces you to choose which version you hold. "Negative Liberty" occupies Leaf 6 but is incompatible with Leaves 1-5; if you arrive at Leaf 6, you hold a standard Berlinian view, but if you arrive at Leaf 5, you hold a Sen/Nussbaum view which negative liberty theorists reject. "Positive Liberty" is mapped to Leaf 8, but note that Leaf 7 also relies on will, merely prioritizing the current instance over the authentic one; standard Positive Liberty theory usually occupies Leaf 8 but may be silent on Q11.

  **Two pairs of leaves are indistinguishable on specific questions but distinct on others.**
  Leaves 5 (Capability) and 1 (Non-Domination) are indistinguishable on Q1 (both say "Unfree"), but separate on Q6 (Capability says "Unfree" on structure, Non-Domination typically requires a dominator). Leaves 7 (Current Will) and 6 (Negative Liberty) are indistinguishable on Q8 (both say "Free" on physical barriers), but separate on Q9 (Current Will says "Unfree" on advance directives, Negative Liberty says "Free" as no current interference). I have flagged these overlaps in the Leaf descriptions where relevant. There are no unoccupied leaves; every combination of answers leads to a coherent, if sometimes unattractive, position.
