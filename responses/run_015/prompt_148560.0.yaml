answer: |-
  The hypothetical case of Rex Secundus presents a classic and formidable challenge to Lon Fuller's procedural natural law theory, often raised by positivists to test the limits of his "internal morality of law." To engage with this argument on its own terms, we must first correct a common misinterpretation regarding Fuller's claims about substantive justice. Fuller never argued that fidelity to the eight desiderata guarantees a just outcome; rather, he argued that law is a purposive enterprise aimed at subjecting human conduct to the governance of rules. Consequently, the internal morality is a morality of *craft* and *role* that respects human agency by providing clear, stable, and congruent guides for action. While Fuller suggests there is a functional affinity between procedural legality and substantive justice—because it is difficult to administer evil laws without resorting to secrecy or arbitrariness—he explicitly acknowledges that a regime can be procedurally flawless yet substantively wicked.

  Regarding Rex Secundus, the hypothetical does not undermine Fuller's position because Fuller does not claim his principles act as an absolute substantive barrier. Fuller would classify Rex Secundus's edicts as valid law because they succeed in the essential function of guiding conduct, even if the content is morally monstrous. However, Fuller might counter that a system based on chattel slavery inherently strains the principle of congruence and generality because it treats certain humans as objects rather than responsible agents capable of following rules. Nevertheless, within the bounds of his explicit theory, Fuller admits the possibility of evil law, distinguishing his view from classical natural law theories that claim "an unjust law is no law at all" in a substantive sense.

  This admission suggests that Hart's separation thesis survives the case of Rex Secundus largely intact regarding the *validation* of law; both theorists would agree that Rex Secundus's rules are legally valid despite their immorality. The divergence lies not in validity but in the conceptual description of law: Hart views law as a system of primary and secondary rules identifiable by social facts, whereas Fuller views law as a reciprocal relationship between ruler and ruled that carries a moral claim to fidelity based on procedural respect. Therefore, the Hart-Fuller debate is not merely terminological. It represents a fundamental disagreement over whether the procedural mechanisms of law are morally neutral tools of power (Hart) or constitute an intrinsic moral achievement regarding human dignity and agency (Fuller). Rex Secundus shows that procedural morality does not prevent evil, but Fuller's point remains that without procedure, law ceases to exist as a distinct mode of social ordering, whereas Hart maintains law exists even as a mere command of force.

