      The case of relief presents a different challenge. You are inclined to say relief is not pleasure, yet it feels as good as many items on your list. Under the continuance account, relief likely presents itself as something to stay with; once the threat passes, you certainly want that state of safety to continue. If you accept this verdict, the account includes relief, contradicting your intuition. If you wish to exclude relief, you must add a clause specifying that the pull must be toward the intrinsic quality of the experience rather than merely the absence of a negative state. This repair saves your verdict but introduces a disjunction or a negative constraint that feels tailored specifically to rescue the distinction between pleasure and relief. It suggests that the unity of pleasure is not just about the direction of the pull but also about the source of the valence, which complicates the simplicity of the original principle.

