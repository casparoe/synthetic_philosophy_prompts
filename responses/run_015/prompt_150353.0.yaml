prompt: |-
  Hey, take this as seriously as you can: you're a professional philosopher who also keeps up with interpretability work — brainstorm for a bit before committing to an answer, and tell me where you're guessing.

  So I just spent two hours arguing with my friend about whether neural networks really have representations or whether interpretability tools are just building useful fictions. He says the whole realism debate is basically verbal and the only thing that matters is whether a technique lets you predict and control behaviour. I kept insisting that cant be the whole story — I care whether the features a sparse autoencoder spits out are ones the model itself is using, not just ones that happen to let me steer it — but I couldnt say why that should matter for anything practical, which is wierdly annoying.

  The concrete bit: I lead a tiny interpretability-adjacent team — me, two researchers, decent but not huge compute, roughly two years — and our funders want to know whether interpretability is worth betting on as a route to real safety guarantees, not just a fancy debugging tool. So I want an agenda, not a survey. Which open questions in the realism-about-representations area are actually worth our time, in what order, and why? Give me the reasoning: which are upstream of which, which are tractable for people doing mostly conceptual work with a modest compute budget, which are overrated or mostly verbal, and what result in the next year or two would move something up or down the list.

  Two candidate cruxes we threw around, please evaluate them as items in the ordering rather than as given:

  1. Vestigiality. A feature is genuinely in the model only if it survives fine-tuning that makes it useless. Fine-tune on data where some feature stops being predictive: a real feature should linger (compressed, maybe partly in superposition), while a summary statistic we merely projected onto the model should dissolve. Is this a good test, and is it upstream of much else or a side quest?

  2. Whether "representation" should mean causal role in the model's own later computation, or correspondence to something in the data-generating process. My friend thinks picking one dissolves the realism question; I suspect both readings survive and the interesting work is elsewhere.

  Where would you put each, and what would you put above them?
