answer: |-
  You have hit on one of the most common and insightful stumbling blocks in the philosophy of probability. Your intuition that the Principal Principle (PP) looks like a tautology is shared by many philosophers. If I know the chance is 50%, why wouldn't my credence be 50%? Isn't that just what it *means* to be rational?

  However, Lewis argues it is not a tautology, and the distinction regarding **"admissible evidence"** is the engine that makes the principle work. Here is the breakdown of why the PP is a substantive constraint and why admissibility matters.

  ### 1. It is not just "Consistency with Evidence"
  You asked: *"If 'all the evidence I have' already includes everything I know about the chances, isn't that just saying I should be consistent with my own evidence?"*

  The problem is that you can be internally consistent while completely ignoring objective chance.

  Imagine a "Gambler's Fallacy" agent. This agent knows the coin is fair (Chance of Heads = 0.5). However, they also know the last five flips were Tails. Their internal logic tells them: "The law of averages demands a Heads soon." So, they set their credence in Heads to 0.9.

  *   **Are they consistent with their evidence?** Yes, relative to their (flawed) internal model of how the world works.
  *   **Do they violate the Principal Principle?** Yes.

  The PP is not just a rule of logical consistency (like the probability axioms); it is a **bridge principle** connecting your mind to the external world. It says: *"Regardless of your internal hunches or patterns you think you see, if you know the objective chance is $x$, your credence must be $x$."*

  Without the PP, "objective chance" is metaphysically idle. It would just be a number floating in the universe that rational agents are free to ignore. The PP is what gives the concept of "chance" its grip on rationality.

  ### 2. The Crucial Role of "Admissible" Evidence
  This is the specific part of your question: *"Why does Lewis care about 'admissible' evidence if total evidence is already supposed to do the work?"*

  In standard Bayesianism, you conditionalize on your **Total Evidence**. But Lewis realized that if your Total Evidence includes certain kinds of "cheating" information, the link between Chance and Credence breaks.

  **The Time-Traveler Counterexample:**
  Imagine you are about to flip a fair coin.
  *   **Objective Chance ($Ch$):** 0.5 (Heads).
  *   **Your Evidence ($E$):** You have a time machine. You traveled to the future, saw the coin land Heads, and came back.

  If you follow the rule "Credence equals Chance given Evidence," you would say:
  $$Cr(\text{Heads} \mid Ch=0.5 \ \& \ \text{I saw it land Heads}) = 0.5$$

  But that is irrational! If you *saw* it land Heads, your credence should be 1.0.

  **Lewis's Solution:**
  Lewis restricts the Principal Principle. It only applies when your evidence is **admissible**.
  *   **Admissible Evidence:** Information about the past, the laws of nature, and the setup of the chance process (e.g., "It is a fair coin," "No magnets are nearby").
  *   **Inadmissible Evidence:** Information about the *outcome* of the chance process itself (e.g., "I saw the future," "I have a crystal ball," "I am omniscient").

  The PP says:
  $$Cr(A \mid Ch(A)=x \ \& \ E_{\text{admissible}}) = x$$

  If your evidence is *inadmissible* (like the time-travel info), the PP steps aside, and standard conditionalization takes over (Credence = 1).

  **Why this matters:**
  Without the admissibility clause, the Principal Principle would be **false**. It would command you to ignore knowledge of the future. By adding the clause, Lewis saves the principle from counterexamples involving "crystal balls," but in doing so, he makes the principle substantive. It tells you how to behave *when you lack crystal-ball knowledge*.

  ### 3. What Extra Constraint Does It Add?
  If the PP isn't a tautology, what work is it doing? It does two heavy-lifting jobs:

  **A. It Defines Objective Chance**
  Lewis is a Humean. He doesn't believe in magical "propensities" hidden inside objects. For Lewis, objective chance is defined by the role it plays in our reasoning.
  The PP effectively says: *"Objective chance is whatever feature of the world that rational agents align their beliefs with (in the absence of inadmissible info)."*
  If you find a number that claims to be "chance" but rational agents shouldn't align with it, then it isn't chance. The PP is the job description for chance.

  **B. It Rules Out "Chance-Independent" Rationality**
  It prevents a gap between epistemology (belief) and metaphysics (reality).
  Without the PP, one could argue: "Sure, the chance of rain is 90%, but I rationally prefer to believe it will be sunny because I have a feeling."
  The PP closes this door. It asserts that **chance trumps feeling.** It imposes an external constraint on your priors. You are not free to choose a prior that diverges from the known chances.

  ### Summary
  To answer your specific doubts:

  1.  **Is it just consistency?** No. You can be consistent while ignoring chance (e.g., Gambler's Fallacy). The PP forces you to align with the *world*, not just your own logic.
  2.  **Why "Admissible" evidence?** Because if your evidence includes the *future outcome* (inadmissible), your credence should match the outcome (1 or 0), not the chance (0.5). The admissibility clause protects the PP from being proven false by time-travelers and prophets.
  3.  **What is the constraint?** It binds subjective belief to objective reality. It says that in the absence of "cheating" information, objective chance is the *only* rational guide for belief.

  Lewis cares about admissibility because without it, the Principal Principle is false. With it, the Principal Principle is a powerful normative claim about how rational minds must interface with a probabilistic universe.
