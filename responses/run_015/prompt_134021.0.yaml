      *(Self-Correction during drafting)*: Wait, the user mentioned "Key-in-the-drawer" as a specific type where the bound party can release itself but via costly procedure. That sounds exactly like the Amendment Process. I need to make sure I distinguish that from the Ulysses "untie" which Odysseus *forbade*. In the Constitution, the People *can* amend (untie), but it's hard. In Ulysses, he told the crew *not* to listen. So the Constitution is actually *more* flexible than the Ulysses contract in theory, but the law student argues it's rigid. I need to highlight this tension.

      *Revised plan for Alternatives:*
