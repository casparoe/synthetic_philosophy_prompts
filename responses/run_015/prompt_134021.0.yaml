      *   Root Password / Multi-sig Wallet: Best for Key-in-the-drawer (costly procedure to override). This is a better engineering analogy than "Message in a Bottle." I should suggest this.

  7.  **Final Polish:** Check against the specific constraints. "Audit rather than a verdict." "Write the mapping out explicitly." "Sorted into ones that matter for her two conclusions." "Does the conclusion survive it?"

      *Let's check the Law Student's Conclusions again:*
      1.  Entrenchment is self-binding, not dead hand.
