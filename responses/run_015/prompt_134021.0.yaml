          *   *Relevance:* Hits Conclusion 1 (Self-binding vs. Dead Hand) hard. If I tie *myself*, it's autonomy. If my grandfather ties *me*, it's heteronomy.
      *   *User's Point 2: Knowledge of Temptation.* Odysseus knew the Sirens existed. Framers guess at future dangers.
