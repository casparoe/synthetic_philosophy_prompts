      *   **Specific Tasks:**
          1.  Map the Ulysses analogy explicitly (Who/what is Ulysses, crew, mast, etc.?).
          2.  Identify disanalogies, sorted by relevance to the law student's two conclusions (Self-binding vs. Dead Hand; Framing Moment Authority).
