      *   *The Ropes:* The Amendment Process / Judicial Review constraints.
      *   *The Wax:* (Optional but useful) Maybe the specific rights protections that block out the "noise"? Or perhaps the insulation of the judiciary. Let's stick to the core: Ropes = constraints.
      *   *The Sirens:* Future emergencies, factionalism, tyranny of the majority, panic.
      *   *The Song:* The seductive argument for violating rights/procedure in the moment of crisis.
