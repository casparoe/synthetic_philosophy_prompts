answer: |-
  # Metaethics Diagnostic Instrument

  ## I. Logical Space Analysis
  Before administering the instrument, instructors should understand the three dimensions this tree carves. The colloquial "Is/Ought Gap" conflates three distinct claims, and students often hold inconsistent views across them.

  1.  **Semantic Conceivability (The Open Question):** Can evaluative terms be *defined* by descriptive terms without loss of meaning? (Separates Definitional Naturalists from everyone else).
  2.  **Metaphysical Identity (The Property Question):** Are evaluative properties *identical* to descriptive properties, even if the concepts differ? (Separates A Posteriori Naturalists from Non-Naturalists).
  3.  **Logical Aptness (The Embedding Question):** Do evaluative sentences function as truth-apt assertions, or do they express non-cognitive states? (Separates Cognitivists from Expressivists/Projectivists).

  **Cross-Cutting Constraints:**
  *   **Realist vs. Realist:** Questions 3 (Supervenience) and 8 (Identity) distinguish Naturalist Realists from Non-Naturalist Realists.
  *   **Cognitivist vs. Cognitivist:** Questions 7 (Embedding) and 9 (Abolition) distinguish Error Theorists (who think moral claims are truth-apt but false) from Expressivists (who think they aren't truth-apt).

  ---

  ## II. Preliminary Diagnostic (Not Scored)
  *Instruction: Read the two sentences below. Do they seem to be doing the same kind of work, or different kinds of work?*

  A. "The water in the pot is boiling at 100 degrees Celsius."
  B. "It is cruel to boil the water while the cat is near it."

  *   **Option 1:** They are the same kind of claim; one is just about physics and the other about behavior.
  *   **Option 2:** They are different kinds of claim; the second adds something the first does not have.
  *   **Option 3:** I cannot hear a difference between them.

  *(Note: Students selecting Option 3 may struggle with the subsequent distinction between descriptive and evaluative vocabulary. Flag for instructor review.)*

  ---

  ## III. The Nine-Question Instrument
  *Instruction: Answer the following nine questions in order. Choose the option that best matches your immediate intuition. Do not overthink.*

  **1. (Case 1: The Open Question)**
  Suppose we agree completely that an action makes everyone happier and causes no pain. Is it still sensible to ask, "But is that action good?"
  *   A. No, that question is confused; if it maximizes happiness, it is good by definition.
  *   B. Yes, that question makes sense; we can still wonder if happiness is actually good.

  **2. (Case 4: The Institutional Fact)**
  A person says, "I promise to pay you five dollars." Does this fact alone prove they ought to pay, or do we need an extra rule like "You ought to keep promises"?
  *   A. The fact alone proves it; promising *means* creating an obligation.
  *   B. We need the extra rule; facts about words don't create duties without a moral principle.

  **3. (Case 3: Supervenience)**
  Imagine two actions that are exactly alike in every physical and psychological detail. Can one be morally obligatory and the other not?
  *   A. No, that is impossible; moral status must track physical details.
  *   B. Yes, it is possible; morality could vary even if the world stays the same.
  *   C. No, it's impossible, and this shows morality is just part of the physical details.

  **4. (Case 2: Logical Derivation)**
  Imagine an argument that uses only facts about the world (no moral words) to logically prove a moral conclusion. If the logic is perfect but the conclusion is wildly false, what does this show?
  *   A. It shows you can't get moral conclusions from non-moral facts, ever.
  *   B. It shows the argument was missing a hidden moral assumption.
  *   C. It shows nothing; logic works regardless of the subject matter.

  **5. (Case 5: Disagreement)**
  Two communities use the word "wrong." Community A applies it to stealing; Community B does not. When they argue, are they disagreeing about one thing, or talking past each other?
  *   A. They are disagreeing about one thing; one of them is mistaken.
  *   B. They are talking past each other; "wrong" means something different for each.
  *   C. They are disagreeing, but both can be right relative to their community.

  **6. (Case 6: Reasons for Action)**
  A person understands morality but does not care about it at all. Do they still have a reason to act morally?
  *   A. Yes, morality gives reasons regardless of what you want.
  *   B. No, if you don't care, morality has no grip on you.
  *   C. Yes, because being rational requires caring about morality.

  **7. (Case 7: Embedding)**
  Consider the sentence: "If it is wrong to lie, then it is wrong to get someone else to lie." Is the first part ("it is wrong to lie") acting like a fact that can be true or false?
  *   A. Yes, it works like a fact; otherwise the "If... then" doesn't make sense.
  *   B. No, it expresses an attitude; the sentence just mixes attitudes together.
  *   C. It looks like a fact, but it isn't really one.

  **8. (The Metaphysical Identity)**
  Are moral properties (like goodness) the same kind of thing as natural properties (like being painful or pleasant), just discovered later?
  *   A. Yes, they are the same kind of thing, identical in reality.
  *   B. No, they are a different, unique kind of thing entirely.
  *   C. This question is confused; we shouldn't ask if they are "kinds of things."

  **9. (The Pragmatic Consequence)**
  If it turned out that nothing is actually "wrong" in reality (no moral facts), should we stop using the word "wrong" entirely?
  *   A. Yes, we should stop; it would be lying to keep using it.
  *   B. No, we should keep using it; it is still useful for living together.
  *   C. No, we should keep using it; the word never tried to describe reality in the first place.

  ---

  ## IV. Scoring Key and Leaf Mapping
  *Map the student's 9-letter answer pattern (e.g., 1B-2B-3A...) to the following leaves. Note: Some paths are logically unstable.*

  | Leaf Position | Typical Answer Pattern (Simplified) | Position Name | The Awkward Commitment (Internal Cost) |
  | :--- | :--- | :--- | :--- |
  | **L1** | 1A, 8A | **Definitional Naturalism** | You must claim that no thoughtful person can sincerely ask if happiness is good without misunderstanding the words. |
  | **L2** | 1B, 8A, 7A | **A Posteriori Identity Naturalism** | You must accept that moral truths are necessary identities, yet we could only discover this through empirical investigation. |
  | **L3** | 1B, 8B, 7A, 3A | **Irreducible Non-Naturalism** | You must accept that moral properties necessarily track physical properties, but this connection is a brute fact with no explanation. |
  | **L4** | 6C, 8B, 7A | **Constitutivism** | You must claim that acting immorally is not just bad, but constitutes a failure of agency or rationality itself. |
  | **L5** | 7B, 9C | **Expressivism / Projectivism** | You must explain how moral sentences function in logical arguments ("If... then") without treating them as true or false. |
  | **L6** | 7A, 8B, 9A | **Error Theory (Abolitionist)** | You must advocate for dismantling our moral language and practices because they systematically fail to refer to reality. |
  | **L7** | 7A, 8B, 9B | **Error Theory (Conservationist)** | You must recommend continuing to assert claims you believe are literally false because the social utility outweighs the falsehood. |
  | **L8** | 8C, 7A | **Quietism / Deflationism** | You must insist that deep metaphysical questions about morality are misguided, while still making moral claims. |
  | **L9** | 5B or 5C, 7A | **Contextualist Relativism** | You must accept that two speakers can contradict each other linguistically while both speaking the truth relative to their context. |
  | **L10** | 1B, 8A, 7B | **Hybrid Expressivism** | You must maintain that moral states are partly belief-like and partly desire-like, without a clear account of how they unify. |

  ---

  ## V. Diagnostics and Empty Cells

  ### 1. Empty or Unstable Combinations
  The following answer patterns are logically generable by the tree but correspond to no stable philosophical position.

  *   **The Definitional Naturalist Cell (L1):**
      *   *Pattern:* 1A (Closed Question), 8A (Identity).
      *   *Status:* **Historically Occupied, Now Empty.**
      *   *Explanation:* This position (Analytic Naturalism) was largely abandoned after Moore's Open Question Argument. Students who select 1A usually do so out of confusion about concepts vs. properties. Once they realize 1B is intelligible, they migrate to L2 or L3. It is empty because it is *unattractive* to a reflective mind; it makes moral inquiry seem like mere dictionary work.
  *   **The Derivationist Non-Naturalist:**
      *   *Pattern:* 4A (No Derivation), 8B (Distinct Properties), 2A (Institutional Derivation).
      *   *Status:* **Incoherent.**
      *   *Explanation:* One cannot claim moral properties are distinct from natural properties (8B) and that no normative conclusion follows from non-normative premises (4A), while simultaneously claiming institutional facts alone create obligations (2A). This reveals a failure to grasp the *scope* of the Is/Ought gap.
  *   **The Internalist Error Theorist:**
      *   *Pattern:* 7A (Truth-Apt), 9A (Abolition), 6A (External Reasons).
      *   *Status:* **Unstable.**
      *   *Explanation:* If moral claims are all false (Error Theory) and we should stop using them (Abolition), it is difficult to maintain that an unmoved agent still has a reason to act morally (6A). This combination suggests the student wants the authority of realism without the ontology.

  ### 2. Unseparable Pairs
  The instrument cannot definitively distinguish between the following pairs without further, more technical questioning.

  *   **Pair 1: Expressivism (L5) vs. Conservationist Error Theory (L7)**
      *   *Why:* Both groups answer "No" to robust truth-aptitude (or "Not really") and "Keep Using It" to the pragmatic question.
      *   *Needed Question:* "When you say 'Stealing is wrong,' are you expressing a desire-like state or asserting a proposition you take to be false?"
      *   *Beginner Viability:* **Low.** Beginners rarely have introspective access to the phenomenology of assertion vs. expression.
  *   **Pair 2: A Posteriori Naturalism (L2) vs. Non-Naturalism (L3)**
      *   *Why:* Both answer "Yes" to the Open Question (1B) and "Yes" to Truth-Aptness (7A). They differ on whether the property identity is natural (8A) or distinct (8B).
      *   *Needed Question:* "Is the connection between happiness and goodness metaphysically necessary or contingent?"
      *   *Beginner Viability:* **Medium.** Students can answer this, but often conflate epistemic contingency (we didn't know) with metaphysical contingency (it could have been otherwise).

  ### 3. Internally Unstable Patterns (Scoring Key Flags)
  *   **Pattern 1B / 4C:** Claiming the Open Question is sensible (1B) but that logic works regardless of subject matter (4C).
      *   *Instability:* Reveals a tension between recognizing conceptual distinctness and accepting logical derivability. Suggests the student hasn't grasped Hume's Law.
  *   **Pattern 3B / 8A:** Claiming moral status can vary without physical change (3B) but properties are identical to natural ones (8A).
      *   *Instability:* Direct contradiction of Supervenience. Indicates the student is guessing or does not understand "identical properties."
  *   **Pattern 7B / 9A:** Claiming moral sentences aren't truth-apt (7B) but we should stop using them if they aren't facts (9A).
      *   *Instability:* If they aren't truth-apt (Expressivism), the lack of "facts" shouldn't trigger abolition. This suggests confusion between Expressivism and Error Theory.

  ---

  ## VI. Instructor Notes on Case Usage
  *   **Case 1 (Happiness/Good):** Used in Q1. Sorts Definitional Naturalists from the rest.
  *   **Case 2 (Validity):** Used in Q4. Tests commitment to Hume's Law.
  *   **Case 3 (Supervenience):** Used in Q3. Sorts Realists (who accept supervenience) from those who don't; distinguishes Naturalist explanations from Non-Naturalist brute facts.
  *   **Case 4 (Promise):** Used in Q2. Tests Institutional vs. Moral derivation.
  *   **Case 5 (Disagreement):** Used in Q5. Sorts Relativists/Contextualists from Objectivists.
  *   **Case 6 (Reasons):** Used in Q6. Sorts Internalists from Externalists (cuts across Realism).
  *   **Case 7 (Embedding):** Used in Q7. Sorts Cognitivists from Non-Cognitivists.
  *   *(Cases 8 and 9 are structural metaphysical/pragmatic questions added to complete the space.)*
