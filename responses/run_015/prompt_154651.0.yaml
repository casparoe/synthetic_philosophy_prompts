answer: |-
  The distinction you are reaching for has a settled name in the philosophy of computation and mind, though it lacks a single standardized label in engineering practice. You are arguing about **Trivial vs. Non-Trivial Realization**, often framed as the **Lookup Table Objection**.

  The property you are tracking is **Counterfactual Robustness grounded in Algorithmic Compression**.

  Here is the carving you asked for.

  ### 1. The Name and the Carving

  The debate sits between **Extensional Equivalence** (same inputs/outputs) and **Intensional Equivalence** (same internal steps). Your team has correctly intuited that neither is sufficient.
  *   **Extensional** fails because Case 3 (Table) matches perfectly on actuals but is rejected.
  *   **Intensional** (in the strict sense of code structure) fails because Case 2 (Neural Net) is accepted despite having no structural correspondence to the spec.

  The established carving is between **Enumerative** and **Generative** systems.
  *   **Enumerative (Trivial):** The system stores the *extension* of the function (the list of input-output pairs). It retrieves answers. Case 3 is purely enumerative.
  *   **Generative (Non-Trivial):** The system encodes a *rule* or *procedure* that compresses the input-output mapping. It derives answers. Case 1 is generative. Case 2 is generative (it learns the manifold/rule, not the list).

  In philosophy, this is the **Lookup Table Objection** to Functionalism (posed by Ned Block). The objection asks: If a system produces the right outputs, does it matter if it does so via a giant lookup table? The consensus (which matches your team's verdict on Case 3) is **yes, it matters**. A lookup table is a **Trivial Realization** of the function.

  ### 2. The Property: Counterfactual Robustness via Compression

  You asked what exactly the property is. It is **Counterfactual Robustness**, but specifically the kind supported by **Algorithmic Compression**.

  *   **Difference from Agreement on Actual Inputs:** Agreement is historical. Counterfactual Robustness is modal. It asks: "If the input *had been* X (where X is valid but unseen), *would* the output *have been* Y?" A lookup table supports counterfactuals only within its stored domain. A generative system supports them across the domain defined by the rule.
  *   **Difference from Robustness:** In control theory, "robustness" usually refers to stability under noise or parameter drift. This property is about **Domain Coverage**. It is robustness against *unseen valid inputs*, not noisy invalid ones.
  *   **Difference from Generalization:** "Generalization" (as in machine learning) is statistical: "It works on data drawn from the same distribution." Your distinction is logical/specification-based: "It works on data drawn from the *specification*, even if that distribution is impossible in the real world."
  *   **Why Compression Matters:** A generative system describes the function in fewer bits than the full list of outputs (Kolmogorov complexity). Case 3 (Table) has high complexity (it *is* the list). Case 1 (Code) and Case 2 (Weights) have low complexity (they describe the rule). The "work" is being done by the mechanism, not by the storage.

  ### 3. Intrinsic or Relational?

  The property is **Relational**. It is not a property of the box alone. It is a property of **The Box + The Specification + The Input Space**.

  *   A lookup table *could* be a generative system if the input space is small enough that enumeration is the most efficient algorithm (e.g., a boolean gate).
  *   A neural net *could* be an enumerative system if it is overfit to memorize specific training points without learning the manifold (though your Case 2 specifies it generalizes).
  *   The verdict shifts with purpose (certification vs. blame) because different purposes require different **Modal Depths**. Certification requires high counterfactual robustness (it must work in worlds we haven't seen). Blame assignment often looks for causal structure (did the mechanism fail, or was the input out of spec?).

  ### 4. Classifying Case 4 (The Boundary Cases)

  **Case 4a: Lazy Caching (Table + Derivation)**
  *   **Verdict:** Generative (Non-Trivial).
  *   **Reason:** The system possesses the *disposition* to compute. The cache is an optimization, not the definition. As long as the cache can grow or the fallback is active for *any* valid input, the system supports counterfactuals across the full spec. It is **Algorithmically Compressed** because the description "Compute if miss, cache if hit" is shorter than the full table.

  **Case 4b: Buried Copy (Idle Machinery)**
  *   **Verdict:** Generative (Non-Trivial), provided the machinery is *causally connected*.
  *   **Reason:** This is the **Dispositional** criterion. If the wiring is such that *were* an off-table input to arrive, the signal *would* route to the original module, then the system has the causal power to compute. The fact that the path is currently idle is irrelevant.
  *   **Caveat:** If the "idle machinery" is disconnected or broken such that the routing *would not* happen, it is Enumerative. The physical state must support the counterfactual.

  ### 5. The Retrospective Problem (Epistemology)

  You noted the verdict is retrospective: "We only learn... when an input arrives from outside the range."
  This is precisely **Kripke's Rule-Following Paradox** (from *Wittgenstein on Rules and Private Language*).
  *   **The Paradox:** No finite amount of past behavior (inputs/outputs) can logically prove a system is following a rule (Plus) rather than memorizing a list (Quus, which matches Plus up to now but diverges later).
  *   **The Engineering Solution:** You cannot verify this property purely by testing (black box). You must inspect the **White Box** for **Compression**.
      *   If the code size/memory footprint scales logarithmically or polynomially with the input space dimension, it is likely Generative.
      *   If it scales linearly with the number of encountered inputs, it is likely Enumerative.
      *   Your disagreement on Case 4 stems from not knowing the **Growth Policy**. If the cache has a hard limit, it is Enumerative. If it is unbounded (bounded only by hardware lifetime), it is Generative.

  ### 6. The Brain Analogy

  You asked if the brain argument turns on this distinction. **Yes, exactly.**
  *   **The Claim:** "Replace each neuron with a device that does what the neuron does."
  *   **The Objection:** "That's just a playback/lookup table of brain states."
  *   **The Carving:** This is the **China Brain** thought experiment (Ned Block).
      *   If the replacement devices are **Generative** (they compute the neuron's activation function based on inputs), the system retains **Counterfactual Robustness**. It can think in worlds slightly unlike ours.
      *   If the replacement devices are **Enumerative** (they play back a recorded sequence of firings), the system is a **Trivial Realization**. It behaves correctly in *this* world but lacks the causal powers to think in *other* possible worlds.
      *   Your intuition is correct: The disagreement about the brain is not about "consciousness" per se, but about whether the substrate supports **Counterfactuals** (Generative) or merely **Actuals** (Enumerative).

  ### Summary for Your Team

  To stop reinventing the wheel, adopt this terminology:

  1.  **The Distinction:** **Generative (Rule-Based)** vs. **Enumerative (List-Based)** Realization.
  2.  **The Test:** **Algorithmic Compressibility**. Does the module's description size grow slower than the input space size?
  3.  **The Criterion:** **Counterfactual Robustness**. Does the module support valid inputs it has never seen, without external augmentation?
  4.  **Case 4 Ruling:** It is Generative if and only if the fallback mechanism is **Unbounded** (or bounded only by the spec, not history) and **Causally Active** (dispositionally connected).

  Your team is not arguing about words; you are arguing about the **Modal Depth** of your system's guarantees. Case 3 fails because it cannot guarantee behavior in "possible worlds" (unseen inputs) that the specification requires. Case 1 and 2 succeed because they encode the law, not just the history.
