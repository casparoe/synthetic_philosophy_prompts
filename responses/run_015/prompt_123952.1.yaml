prompt: |-
  I have just finished a long and rather heated argument with a friend about Henry Sidgwick’s cautious openness to psychical research, and I am still turning the problem over in my mind. My friend insisted that Sidgwick’s willingness to take the Society for Psychical Research seriously was essentially a Victorian curiosity, and that had he lived to see the replication crisis, the spread of pre-registered replication attempts, and modern hierarchical Bayesian approaches to evaluating claims in anomalous cognition, he would have abandoned his openness entirely. I am not convinced, but I also think we failed to resolve a deeper tension: Sidgwick combined rigorous epistemic caution with a utilitarian concern that dismissing potentially transformative knowledge prematurely could carry its own moral cost. If we inject that same tension into a contemporary setting—where large-scale collaborative studies now use registered reports and explicit prior distributions, and where critics argue that institutional funding for such inquiry diverts scarce resources from mental-health interventions with demonstrable efficacy—how do you think Sidgwick would have positioned himself? Would he have treated the modern methodological safeguards as sufficient to justify continued investigation, or would his ethical calculus have led him to conclude that the opportunity costs now outweigh the epistemic value? Please construct a careful argument predicting his likely view, addressing both the evidential standards he demanded and the ethical framework he applied to belief and inquiry. Write your answer in British English, and avoid providing bibliographies, reading lists, or specific citations; I want your reasoning rather than a literature review.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

