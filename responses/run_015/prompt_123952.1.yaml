answer: |-
  Your intuition regarding the tension in Sidgwick's thought is astute. To reduce his position to mere Victorian curiosity is to overlook the profound philosophical architecture supporting it. Sidgwick did not investigate psychical phenomena because he was credulous; he did so because he perceived a potential conflict between scientific naturalism and the rational foundations of morality. If the universe is purely material, the utilitarian calculus lacks a long-term sanction; if consciousness survives death, the calculation changes entirely. Therefore, his inquiry was driven by a duty to verify any claim that might alter the supreme good.

  However, placing Sidgwick in a contemporary context requires us to weigh his epistemic rigour against his utilitarian ethics, specifically regarding the allocation of resources. Here is how I believe he would navigate the modern landscape.

  First, consider his epistemic standards. Sidgwick was, above all, a champion of scientific honesty. He was acutely aware of the human propensity for self-deception and the contamination of evidence by desire. It is highly probable that he would welcome modern methodological safeguards such as pre-registered reports and hierarchical Bayesian modelling. Indeed, he would likely argue that these tools finally provide the rigorous filter that the Victorian Society for Psychical Research lacked. However, he would also have to confront the output of these methods. The replication crisis in this specific field suggests that when bias is controlled for, the effects in anomalous cognition tend to vanish or diminish to negligible levels. Sidgwick was willing to entertain low-probability hypotheses, but he was not willing to ignore the weight of accumulated negative evidence. He would likely concede that the Bayesian prior probability for psychical phenomena, informed by a century of failed replication under strict controls, is now vanishingly small. To maintain belief in the face of such methodological scrutiny would violate the very scientific integrity he sought to uphold.

  Yet, this is where your friend's argument—that Sidgwick would simply abandon the inquiry—may be too hasty. Sidgwick's utilitarianism was not merely about immediate gratification or tangible metrics; it was about the 'ultimate good'. If there remained even a microscopic probability that psychical research could uncover evidence of survival or non-local consciousness, the potential utility (in terms of moral sanction and human hope) is theoretically infinite. A strict expected-utility calculation might suggest that even a one-in-a-million chance is worth pursuing if the payoff is the resolution of the fundamental paradoxes of ethics.

  However, this is where the modern context introduces a variable Sidgwick could not fully anticipate: the explicit opportunity cost of scientific funding. In the Victorian era, the resources devoted to psychical research were largely private and did not obviously detract from public welfare. Today, you rightly point out that institutional funding is a zero-sum game. Every pound allocated to investigating telepathy is a pound withheld from mental-health interventions with demonstrable efficacy.

  Sidgwick's ethical framework would demand he confront this trade-off directly. As a utilitarian, he is bound to prioritise the action that produces the greatest net good. The 'good' of psychical research is now speculative and diminishing; the 'good' of evidence-based mental health care is concrete and immediate. Sidgwick was deeply concerned with the practical application of ethics. He would likely argue that while the *question* of psychical phenomena remains philosophically significant, the *investigation* of it has become ethically indefensible when it competes with known remedies for suffering. The moral cost of dismissing transformative knowledge is hypothetical; the moral cost of diverting resources from alleviating confirmed suffering is actual.

  Therefore, I predict Sidgwick would adopt a position of 'principled suspension'. He would not necessarily declare psychical phenomena impossible, for that would be dogmatic and contrary to his fallibilism. Instead, he would argue that the duty of inquiry is bounded by the duty of beneficence. He would likely contend that the epistemic value of continued research no longer justifies the ethical cost of the resources required. He might suggest that such inquiry should only proceed if it can be conducted without diverting resources from established welfare priorities—perhaps as a theoretical sideline within broader cognitive science, rather than as a standalone enterprise seeking public or charitable funding.

  Furthermore, Sidgwick would likely address the social utility of belief. He was aware that false beliefs could be socially useful, but he ultimately valued truth over comfort. He would probably warn against the 'noble lie' of funding psi research to maintain hope. To do so would be to build morality on a foundation known to be shaky, which he would view as intellectually dishonest and ultimately destructive to the rational trust required for a stable society.

  In conclusion, Sidgwick would likely tell your friend that they are correct about the methodology but insufficiently attentive to the history of the idea. He would tell you that you are correct about the ethical tension, but that the scales have tipped. The rigorous methods of today have not vindicated the phenomena; they have clarified their absence. Consequently, the utilitarian calculus shifts. The 'cautious openness' of the Victorian era was rational when the data was ambiguous and the costs were low. In a modern setting, where the data is persistently negative under strict controls and the opportunity costs are measured in untreated human suffering, Sidgwick would likely conclude that the rational and moral course is to cease active investigation. He would retain a philosophical openness to the *possibility*, but he would withdraw his endorsement of the *practice*, viewing the continued allocation of scarce resources to this end as a failure of our duty to the living.
