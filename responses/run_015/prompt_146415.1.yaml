prompt: |-
  Hey, I'm writing a short thing on social-choice aggregation and I keep running into this tension. Harsanyi's aggregation theorem says that if individual preferences and the social preference both satisfy vNM rationality, plus Pareto and some independece condition, then social welfare is just a weighted sum of individual cardnal utilities. But I was wondering: what if we drop pure vNM and instead use reference-dependent preferences — like Kahneman-Tversky prospect theory — at the individual level? So each person's utility is defined relative to some reference point, with loss aversion, and the reference point might even depend on what others get. Compare the standard Harsanyi setup with this reference-dependent varient. Specifically, which of Harsanyi's axioms break first? Can you still get any kind of linear aggregation, or does the social welfare function become nonlinear and context-sensitive? And if the reference point is socially determined, does that create a circularity problem for the aggregation? I don't need a formal derivation, just want to see where the analogy holds and where it collapses.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Topic:** Social choice aggregation, specifically comparing Harsanyi's Aggregation Theorem with a reference-dependent (Prospect Theory) variant.
      *   **Core Question:** What happens to Harsanyi's axioms if individual preferences are reference-dependent (loss aversion, endogenous reference points)?
      *   **Specific Sub-questions:**
          *   Which axioms break first?
          *   Can linear aggregation still hold, or does it become nonlinear/context-sensitive?
          *   Does a socially determined reference point create circularity?
      *   **Constraint:** No formal derivation needed; conceptual analysis of where the analogy holds/collapses.

  2.  **Recall/Analyze Harsanyi's Aggregation Theorem:**
      *   **Premises:**
          1.  Individual preferences satisfy vNM axioms (completeness, transitivity, continuity, independence).
          2.  Social preferences satisfy vNM axioms.
          3.  Pareto Principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$).
          4.  (Implicit/Explicit) Independence of Irrelevant Alternatives (often baked into the vNM structure or the specific aggregation proof).
      *   **Conclusion:** Social Welfare Function (SWF) $W = \sum a_i U_i + c$, where $U_i$ are von Neumann-Morgenstern utility functions.
      *   **Key Feature:** Linearity and cardinality.

  3.  **Analyze Reference-Dependent Preferences (Prospect Theory):**
      *   **Features:**
          *   Utility is $v(x - r)$, where $r$ is the reference point.
          *   Loss aversion ($v$ is steeper for losses).
          *   S-shaped value function (concave for gains, convex for losses).
          *   Reference points can be status quo, expectations, or *social comparisons*.
      *   **Violation of vNM:** Prospect Theory explicitly violates the Independence Axiom (Allais Paradox style behavior) and often Transitivity (due to framing/lexicographic semi-orders in some formulations, though standard PT usually keeps transitivity within a frame). Crucially, utility is not defined over final wealth states but *changes* relative to a reference.

  4.  **Map the Tension (Harsanyi vs. Reference-Dependence):**

      *   **Axiom Breakdown:**
          *   *Independence:* This is the big one. PT violates independence. If preferences depend on the reference point, and the reference point shifts with the lottery structure or context, the linear mixing of lotteries (core to vNM) doesn't work the same way.
          *   *Pareto:* Pareto is about ordinal ranking. PT still gives rankings. So Pareto *might* hold conceptually, but applying it is tricky if reference points shift between option A and option B. If choosing A changes the reference point for evaluating B, Pareto comparisons become unstable.
          *   *Social vNM:* If individuals aren't vNM, can society be vNM? Harsanyi requires *both* to be vNM. If individuals are PT, the "Social vNM" axiom is likely the first to go because you can't aggregate non-vNM preferences into a vNM social ordering without losing information or imposing false structure.

      *   **Linearity vs. Nonlinearity:**
          *   Harsanyi $\rightarrow$ Linear ($\sum w_i u_i$).
          *   PT $\rightarrow$ Nonlinear. The value function is S-shaped. Aggregating S-shaped functions doesn't yield a linear sum.
          *   Context-sensitivity: Since utility depends on $r$, and $r$ depends on context (or others' outcomes), the SWF becomes state-dependent. $W(A, B) \neq W(A) - W(B)$ in a vacuum; it depends on the status quo.

      *   **The Circularity Problem (Endogenous Reference Points):**
          *   If $r_i$ depends on what others get (social comparison), then $U_i$ depends on $\{x_j\}_{j \neq i}$.
          *   To aggregate, we need $\sum U_i$. But $U_i$ depends on the allocation itself.
          *   Harsanyi assumes fixed utility functions over outcomes. Here, the utility function *shape* or *zero-point* shifts with the outcome.
          *   This creates a fixed-point problem. You need the social outcome to determine the reference points to evaluate the utilities to determine the social outcome.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the question. It's a known tension in behavioral welfare economics.
      *   *Axiom Breakdown:* Focus on **Independence** and **Completeness/Transitivity** (due to framing). But the biggest structural break is the definition of the *domain*. Harsanyi aggregates over *outcomes*; PT aggregates over *gains/losses*.
      *   *Linearity:* It collapses. You get a weighted sum of *value functions*, but since value functions are nonlinear and reference-dependent, the aggregate is not a stable linear function of final states.
      *   *Circularity:* This is the killer. If reference points are social (e.g., average income), the SWF becomes a fixed-point equation. It might not have a unique solution.
      *   *Conclusion:* The analogy collapses because the "currency" of aggregation changes from stable cardinal utility to context-dependent value.

  6.  **Refining the "Which Axiom Breaks First" part:**
      *   Technically, if individuals are PT, they already violate vNM **Independence**. So the premise of Harsanyi (Individual vNM) is false immediately.
      *   However, if we ask "Can we salvage a Harsanyi-style result?", the **Social vNM** axiom is the one that becomes untenable. You cannot have a social ordering that satisfies Independence if the constituents don't, *unless* you ignore their actual preferences (paternalism).
      *   Also, **Pareto** becomes ambiguous. Pareto requires comparing $U_i(A)$ and $U_i(B)$. In PT, $U_i(A)$ depends on the reference point. If the move from Status Quo to A changes the reference point differently than Status Quo to B, the comparison is ill-defined.

  7.  **Addressing the "Socially Determined Reference Point":**
      *   This introduces **interdependence of preferences**. Harsanyi assumes preferences are self-regarding (or at least fixed over the domain). If my utility depends on your outcome (via reference point), we are in the realm of externalities.
      *   This breaks the separability required for simple summation.

  8.  **Final Polish:** Ensure tone is analytical but accessible (no formal proofs). Use terms like "frame dependence," "endogeneity," and "fixed-point problem."

      *(Self-Correction during drafting)*: Make sure to distinguish between reference points being *exogenous* (fixed status quo) vs *endogenous* (dependent on allocation). The prompt asks specifically about the latter ("reference point might even depend on what others get"). I need to emphasize the circularity there.

  9.  **Structure of the Answer:**
      1.  The Immediate Axiom Failure (Independence).
      2.  The Collapse of Linearity (S-shape & Loss Aversion).
      3.  The Circularity/Endogeneity Problem (Fixed Points).
      4.  The Pareto Ambiguity.
      5.  Summary/Verdict.

  10. (Final Review against constraints): No formal derivation. Check. Focus on analogy holding/collapsing. Check.

      *Let's write it.*
answer: |-
  This is a sharp question that cuts to the core of why behavioral welfare economics is so much messier than standard welfare economics. Harsanyi's theorem is elegant because it relies on the stability of vNM utilities. Once you introduce reference dependence (Prospect Theory), you aren't just tweaking the utility function; you are changing the *ontology* of what is being aggregated.

  Here is where the analogy holds, where it collapses, and which axioms break first.

  ### 1. Which Axiom Breaks First?
  **The Independence Axiom (and consequently Social vNM Rationality).**

  Harsanyi requires both individuals and society to satisfy vNM rationality. Prospect Theory (PT) explicitly violates the **Independence Axiom** (the Allais Paradox logic). In PT, preferences reverse depending on how the lottery is framed or what the reference point is.

  *   **Individual Level:** If individuals are PT agents, the first premise of Harsanyi ("Individual preferences satisfy vNM") is immediately false.
  *   **Social Level:** Even if you tried to force a social ordering, you cannot construct a social preference relation that satisfies vNM Independence if the constituents' preferences violate it (unless you ignore them entirely).

  However, a deeper break occurs in **Domain Invariance**. Harsanyi assumes utility is defined over final states (wealth, outcomes). PT assumes utility is defined over *changes* from a reference point. If the reference point shifts between option A and option B, you aren't comparing $U(A)$ and $U(B)$; you are comparing $U(A|r_A)$ and $U(B|r_B)$. This makes the Pareto comparison unstable.

  ### 2. Does Linear Aggregation Survive?
  **No. The Social Welfare Function (SWF) becomes nonlinear and context-sensitive.**

  In Harsanyi's world, $W = \sum a_i U_i$. This works because $U_i$ is a stable cardinal measure over outcomes.
  In a PT world, even if you sum individual values ($V_i$), the aggregate is not linear in outcomes for two reasons:

  1.  **The S-Shaped Value Function:** Individual value functions are concave for gains and convex for losses. A weighted sum of S-curves is still an S-curve (roughly), not a linear function. This means the "social marginal utility" of a dollar depends on whether society is currently in a "gain" domain or a "loss" domain relative to the reference.
  2.  **Loss Aversion Kinks:** If individuals have different reference points, a policy change might be a "gain" for Person 1 and a "loss" for Person 2. Because loss aversion makes the disutility of a loss steeper than the utility of an equivalent gain, the aggregation weights effectively shift depending on the direction of the change. The social weight on Person 1's utility might be $\alpha$ when they are gaining, but $\beta$ when they are losing.

  So, the SWF becomes **state-dependent**. You cannot write $W(x)$; you must write $W(x, r)$, where $r$ is the vector of reference points.

  ### 3. The Circularity of Socially Determined Reference Points
  This is the most critical collapse. You asked: *"If the reference point is socially determined, does that create a circularity problem?"* **Yes, it creates a fixed-point problem that can render aggregation impossible or indeterminate.**

  In standard Harsanyi, preferences are fixed. In your variant, let's say individual $i$'s reference point $r_i$ is a function of the social allocation $x$ (e.g., $r_i$ is the average income of the group).
  $$U_i = v(x_i - r_i(x))$$

  To aggregate, you need to evaluate the social welfare of allocation $x$. But to evaluate $U_i(x)$, you need to know $r_i$. But $r_i$ depends on $x$.

  *   **The Loop:** To choose the optimal $x$, you need to calculate $W(x)$. To calculate $W(x)$, you need the reference points. But the reference points are determined by $x$.
  *   **Multiple Equilibria:** This often leads to multiple self-consistent reference points. There might be a "high expectation" equilibrium where everyone expects a lot, so any outcome feels like a loss (high social pain), and a "low expectation" equilibrium where the same outcome feels like a gain (low social pain).
  *   **Manipulability:** If the reference point is endogenous, a social planner can potentially manipulate the reference point to change the social ranking of outcomes without changing the outcomes themselves. This violates the spirit of **Neutrality** (outcomes should be judged on their merits, not the framing).

  ### 4. What Happens to Pareto?
  The **Pareto Principle** becomes ambiguous.

  Standard Pareto: If everyone prefers $A$ to $B$, society prefers $A$ to $B$.
  PT Pareto: If everyone prefers $A$ to $B$ *given the current reference point*, society prefers $A$ to $B$.

  The problem is that moving from $B$ to $A$ might shift the reference point.
  *   Example: Everyone prefers a raise of \$10k (A) over status quo (B). But if accepting the raise resets the reference point upward permanently, the *long-term* evaluation might reverse.
  *   If the reference point depends on others, my preference for $A$ over $B$ might depend on what you get. This introduces **externalities in preferences**. Harsanyi's theorem handles externalities poorly; it assumes preferences are defined over social states, but usually implies separability. If my utility function *shape* depends on your consumption, the simple additive form $\sum a_i U_i$ fails to capture the interdependence unless the SWF includes interaction terms.

  ### Summary: Where the Analogy Collapses

  | Feature | Harsanyi (vNM) | Reference-Dependent Variant | Status |
  | :--- | :--- | :--- | :--- |
  | **Utility Domain** | Final Wealth/Outcomes | Gains/Losses relative to $r$ | **Collapses** (Different ontologies) |
  | **Independence** | Satisfied | Violated (Framing effects) | **Breaks First** |
  | **Aggregation Form** | Linear ($\sum w_i u_i$) | Nonlinear, S-shaped, Kinked | **Collapses** |
  | **Reference Point** | Exogenous / Irrelevant | Endogenous / Socially Determined | **Circularity** |
  | **Stability** | Stable ordering | Path-dependent / Hysteresis | **Collapses** |

  **The Verdict:**
  You cannot get a Harsanyi-style linear aggregation theorem with reference-dependent preferences. The best you can hope for is a **local** aggregation rule: "Given a fixed reference point profile $r$, social welfare is a weighted sum of value functions." But as soon as the policy changes $r$, the weights and the function shape change.

  If the reference point is socially determined, you move from an optimization problem (maximize $W$) to a **fixed-point problem** (find $x$ such that $x$ maximizes $W$ given $r(x)$, and $r(x)$ is consistent with $x$). This often implies that social welfare is indeterminate without a theory of how reference points adapt over time.
