      *   *The "Mistake" Thesis (Diamond/Sahlins):* Hunter-gatherers (HGs) had high leisure, varied diet, low work hours ("Original Affluent Society"). Farmers worked harder, had worse nutrition, introduced disease/inequality.
      *   *The Counter-Thesis:* Farming allowed population density, specialization, surplus, resilience (eventually), and complex culture. It wasn't a "choice" but a trap or a gradual drift.
      *   *Key Concepts:* Affluence, Inequality, Lock-in, Work/Labor, Surplus, Population Pressure.

  3.  **Map to Board Game Mechanics:**
      *   *Hunter-Gatherer Lifestyle:* High flexibility, low setup cost, variable income, low ceiling. -> *Open Action Space / Worker Placement with low congestion.*
      *   *Agricultural Lifestyle:* High setup cost, high maintenance, high output, rigid. -> *Engine Building / Asset Accumulation.*
      *   *Affluence:* Not total wealth, but "Work-to-Reward Ratio." -> *Action Efficiency.*
      *   *Inequality:* -> *VP Asymmetry / Resource Hoarding.*
      *   *The "Trap":* -> *Path Dependence / Sunk Cost Fallacy / Engine Lock-in.*
      *   *Population Pressure:* -> *Player Count scaling / Action Space Congestion.*

  4.  **Drafting the Translation (The "Game Design" View):**
      *   *HG Meta:* Low barrier to entry. Actions yield immediate resources (food). High mobility (reset cost is low). "Affluence" is high action efficiency (few actions needed to meet upkeep).
      *   *Ag Meta:* High barrier to entry (clear land, plant, wait). Delayed gratification. High upkeep (weeding, harvesting). "Affluence" drops (more actions needed for same caloric upkeep), but *capacity* increases.
      *   *The Shift:* Why switch? Action space congestion. As player count (population) rises, the HG action spaces (foraging spots) get crowded. Yield per action drops. Farming offers a *private* action space (your field) that doesn't suffer from congestion but suffers from high maintenance.
      *   *Inequality:* HG is symmetric (everyone has same action set). Ag introduces asset asymmetry (better land, stored grain). This creates VP gaps.
      *   *The "Mistake":* Players optimized for *max total VP* (population/civilization) rather than *max action efficiency* (leisure/health). They fell into a local maximum trap.

  5.  **Developing the Residue Report:**
      *   *Survives:* The congestion mechanic (population pressure), the lock-in (sunk costs of infrastructure), the asymmetry (wealth accumulation).
      *   *Distorts:* "Affluence" as leisure vs. resources. In games, leisure is usually just "unused actions." In reality, it's health/social time.
      *   *Vanishes:* Ideology, coercion, violence, disease mechanics (unless explicitly modeled), the timescale (generational drift vs. single session).
      *   *Critique of Framework:* Games assume rational actors optimizing victory. History involves non-rational drift, coercion, and environmental shocks. The "Mistake" argument assumes a choice was made; game mechanics assume choices are made.

  6.  **Identifying the Hidden Contradiction/Typo in Reasoning:**
      *   *The Contradiction:* The user asks to treat "affluence" as a resource curve *rather than* a welfare measure. But Sahlins' argument *is* that affluence *is* a welfare measure (desires vs. means). If you map it strictly to a resource curve (calories/hour), you miss the sociological point.
      *   *The Category Error:* Board games are closed systems with defined win conditions. History has no "win condition." The "Mistake" argument judges history by a specific win condition (well-being), but the "Ag Revolution" players were playing a different game (survival/expansion).
      *   *The "Trap":* In games, traps are usually design flaws. In history, the "trap" is an emergent property of successful optimization.

