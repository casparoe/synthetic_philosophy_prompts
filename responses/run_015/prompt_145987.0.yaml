answer: |-
  The Ledger Room smelled of ozone and old paper. Above the central table, the brass armatures of the Probability Kinematic hung suspended, a constellation of weighted levers and sliding cursors representing the possible fates of the *Mercator*. Below, the underwriters sat in the gloom, their fortunes tied to the final position of the hull-loss indicator.

  Elara, the Senior Clerk, stood at the console. Her hands hovered over the input slots. "Case 94-Alpha," she announced. "Vessel *Mercator*. Total loss. Cause undetermined."

  "Proceed," said Master Surveyor Vane. She sat slightly apart, her eyes sharp behind wire-rimmed spectacles. Vane was the only one authorized to validate the conditionals—the invisible links between evidence and cause that held the Ledger together.

  Elara picked up the first file. "Finding One. Telegraph from Cape Station. Garbled transmission regarding barometric pressure." She slid a card into the weather partition. "It does not confirm a storm. It shifts the probability of 'Severe Weather' from ten percent to forty percent."

  This was a soft finding. Elara did not lock the lever into 'Storm' or 'No Storm'. She merely adjusted the weight distribution across the partition, leaving the conditional probabilities of the hull's fate given the weather untouched. The brass arms shivered. The hull-loss indicator drifted slightly toward 'Peril of the Sea'.

  "Finding Two," Elara continued, picking up a photograph. "Stevedore's record. Image of the *Mercator* at departure. Hull paint blurred." She inserted the card into the seaworthiness partition. "Shifts probability of 'Unsound Hull' from fifteen percent to fifty percent."

  She prepared to engage the sequence. The doctrine of Sequential Integrity was absolute: the Ledger absorbed findings in the order filed. Everyone knew that soft findings did not commute. To process the weather before the hull was to walk a different path through the probability space than to process the hull before the weather. The destination—the apportionment of loss—would differ.

  "Wait," Vane said.

  Elara paused. "Surveyor?"

  Vane took the photograph. She held it to the light, squinting at the grainy texture of the hull plating. "When I certified this finding this morning, I assumed the photographer stood on the dock. Ten meters."

  "And now?"

  "Now I see the lens distortion," Vane said, tapping the glass. "He was on the crane. Thirty meters up. The blur isn't rot. It's atmospheric haze."

  The room went still. This was not a Jeffrey update. A Jeffrey update required the conditional probabilities—the meaning of the evidence—to remain fixed while the evidence itself shifted. Vane was changing the meaning. She was altering the link between 'Blurred Image' and 'Unsound Hull'.

  "If the distance is greater," Elara said quietly, "the probability of 'Unsound Hull' given 'Blurred Image' drops. Significantly."

  "It does," Vane said. "Adjust the conditionals."

  "Surveyor," Elara warned, her hand on the lever. "If you change the conditionals mid-stream, the Kinematic breaks. The integral won't hold. We aren't moving odds anymore; we're rewriting the physics."

  "The finding was wrong," Vane said. "Correct it."

  Elara adjusted the cursors. The conditional weights shifted. The relationship between the blur and the rot was tightened, then loosened. The brass arms groaned.

  "Which sequence?" Elara asked. "The Telegraph arrived by wire at 0900. The photograph arrived by courier at 0900."

  "Same hour?" asked Mr. Hale, the lead underwriter for the hull. He leaned forward, sweat beading on his forehead. If the weather finding went first, the loss leaned toward 'Act of God', sparing the hull underwriters. If the hull finding went first, the loss leaned toward 'Unseaworthy', sparing the weather syndicate. The difference was forty thousand pounds.

  "The timestamp on the wire is 0900:00," Elara said, checking the log. "The courier's stamp is 0900:00."

  "Sequence is undefined," Vane said.

  "Sequential Integrity requires an order," Hale snapped. "Without order, the Ledger cannot compute."

  "Without order," Vane corrected, "the Ledger reveals its flaw."

  Elara looked at the armatures. She could run the sequence Weather-then-Hull. She could run Hull-then-Weather. With Vane's new conditionals, the divergence would be catastrophic. The non-commutativity of soft findings on different partitions meant the two paths would end in different universes of liability.

  "If I run Weather first," Elara said, "the hull underwriters pay eighty percent."

  "If you run Hull first," Hale countered, "we pay twenty percent."

  "And if I run them simultaneously?" Elara asked.

  "The mechanism jams," Vane said. "It expects a vector. You are giving it a matrix."

  Elara looked at the brass weights. They hung in equilibrium, waiting for a push that would violate conservation. The doctrine of Sequential Integrity was designed to prevent exactly this: the manipulation of outcome through the manipulation of order. But here, order was a fiction. The wire and the satchel had arrived in the same breath.

  "Run Weather first," Hale said.

  "Objection," Vane said. "The photograph is physical evidence. The telegraph is ephemeral. Causal priority lies with the hull."

  "Evidential priority lies with the storm," Hale shot back. "The ship sank because of the water, not the wood."

  "The wood let the water in," Vane said.

  Elara lowered her hands. "Stop. Both of you."

  She looked at the Kinematic. The system was built on the assumption that findings were external forces acting on a closed system. But the findings themselves were generated by the system's observers. The telegraph was sent by a man guessing at the pressure. The photo was taken by a man guessing at the angle.

  "Surveyor," Elara said. "When you changed your mind about the photographer's distance, you didn't just update the Ledger. You updated yourself."

  "I corrected an error," Vane said.

  "You changed the likelihood," Elara said. "You realized the probability of seeing *this* blur given *that* distance was different than you thought. You should have filed the distance as a finding, not adjusted the hull conditionals directly."

  Vane stiffened. "The Ledger doesn't have a slot for 'Photographer Distance'."

  "Then the Ledger is under-described," Elara said.

  The silence stretched. The brass arms hummed in the draft.

  "If we treat the findings as hard facts," Hale said, "if we say 'Storm happened' and 'Hull was rotten', the order doesn't matter. Conditioning commutes."

  "These aren't hard facts," Elara said. "They are shadows. When you condition on shadows, the order of the light matters. Unless..."

  "Unless?" Vane prompted.

  "Unless we stop moving the odds by fiat," Elara said. She reached for a blank card. "We don't input the probability of the storm. We input the probability of the *report* of the storm. We model the channel."

  Vane frowned. "The likelihood of the evidence given the cause."

  "Yes," Elara said. "If we condition on the fact that the telegraph *exists* and says *this*, rather than forcing the weather probability to shift, the update becomes standard Bayesian conditioning. Hard findings commute. The report's existence is a hard fact."

  "And the photograph?" Hale asked.

  "The existence of the photograph is a hard fact," Elara said. "The content is the likelihood. If we model the channel—the telegraphist's error rate, the photographer's distance—then the order of absorption shouldn't matter. The likelihoods multiply. Multiplication commutes."

  Vane looked at the Kinematic. "We would need to rebuild the partition. Not Weather vs. No Weather. But Telegraph-Storm vs. Telegraph-Calm."

  "And Photo-Rot vs. Photo-Sound," Elara said. "We condition on the reports, not the world."

  "That invalidates ten years of precedent," Hale said. "Every apportionment in the Ledger was done by shifting partition probabilities. Sequential Integrity was the law."

  "Sequential Integrity was a patch," Vane said softly. She looked at Elara. "It held so long as the filings were sequential. When the world delivered simultaneity, the patch tore."

  Elara looked at the two cards in her hand. The wire and the photo. They were no longer inputs to a calculation; they were data points in a model they hadn't built.

  "I cannot run the calculation," Elara said. "Not without violating the Kinematic's constraints. If I run Weather first, I cheat the hull. If I run Hull first, I cheat the sea. If I change the conditionals again, I cheat the math."

  "So what is the loss?" Hale demanded. "Who pays?"

  "The Ledger cannot say," Elara said. She placed the cards on the table, beside the brass weights. "The probability mass is conserved, but the path is lost. We are left with the prior."

  "The prior?" Vane laughed, a dry, brittle sound. "Fifteen percent unsound. Ten percent storm. The *Mercator* is at the bottom of the Atlantic, and you want to split the bill based on what we thought before she sailed?"

  "I want to split it based on a model that doesn't break when the mail arrives late," Elara said.

  Hale stood up. "This is incompetence."

  "This is epistemology," Vane said. She stood as well, gathering her spectacles. "We built a machine to measure uncertainty, but we forgot to measure the uncertainty of the measurement. We treated the findings as forces, when they were merely observations."

  She turned to Elara. "Draft the new partitions. Likelihoods for the channels. Telegraph error rates. Photographic provenance."

  "And the *Mercator*?" Hale asked.

  "Hold the loss," Vane said. "Until we learn how to look."

  Elara watched them leave. The Ledger Room settled back into its hum. The brass arms of the Kinematic hung motionless, suspended in the ambiguity of the simultaneous arrival. The weights were ready to move, but the direction was no longer defined by the order of the cards, but by the structure of the truth they were trying to model.

  She picked up a pen. On a fresh sheet of ledger paper, she did not write 'Storm' or 'Hull'. She wrote 'Report of Storm' and 'Report of Hull'. She drew a line between them, not to sequence them, but to link them to the cause.

  The math would hold here. It had to. The alternative was that the loss was simply a void, and the Ledger, for all its brass and precision, was just a machine for generating arguments. Elara dipped the pen. The ink flowed, dark and certain, onto the white page. She began to calculate the likelihood of the report itself.
