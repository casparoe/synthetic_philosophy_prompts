answer: |-
  **Project Title:** Systemic Identity in Letterforms: A Differential Approach to Glyph Recognition

  **Project Summary**
  This project investigates a foundational problem in typography and visual cognition: what constitutes the identity of a letter? Historically, attempts to computationally generate coherent typefaces (most notably the *Letter Spirit* project) stalled on the inability to define what remains constant across stylistic variations. The prevailing assumption is that letter identity is **intrinsic**: an 'a' is an 'a' because it possesses a specific set of strokes, loops, or prototype features. This project proposes a competing **differential** hypothesis: a letter's identity is defined by its position within a specific system of contrasts. On this view, an 'a' is an 'a' primarily because it is *not* that font's 'o', 'd', 'g', or 'e'.

  If the intrinsic view is correct, identity travels with the shape. If the differential view is correct, identity is anchored to the systemic slot. This three-month, solo project will design visual stimuli to test these competing predictions, focusing on whether legibility and recognition rely on local features or systemic relations.

  **Research Question & Competing Predictions**
  The core question is: *Does letter identity reside in the glyph's geometry or in its structural role within the alphabet?*

  *   **Prediction A (Intrinsic/Feature-Based):** If a glyph with the physical shape of an 'a' is mapped to the linguistic slot of an 'e', readers will identify it as an 'a'. Recognition errors will stem from the shape clashing with the expected word, not from the shape failing to fit the font's system.
  *   **Prediction B (Differential/Systemic):** If the same swap occurs, readers will either accept the shape as an 'e' (because the system demands an 'e' in that slot) or experience a systemic breakdown where the entire font becomes illegible. The error will not be "wrong letter," but "broken system."

  **Methodology (3 Months, Part-Time)**
  No formal data collection or IRB approval is required; the project relies on the design of stimuli and informal phenomenological observation.

  *   **Month 1: Stimulus Design.** I will select two high-contrast typefaces (e.g., a Blackletter and a Geometric Sans) where the 'a' and 'e' share minimal geometric features. I will create modified font files where specific glyphs are swapped (e.g., the physical 'a' shape is assigned to the 'e' unicode slot).
  *   **Month 2: The Swap Test.** I will generate word lists using these modified fonts. Through informal consultation with fluent readers, I will observe whether recognition failures are localized (misreading the specific letter) or global (the word/line becomes unreadable). This tests if the "essence" of the letter moved with the shape or stayed with the slot.
  *   **Month 3: The Hard Case (Constructed Scripts).** I will apply the differential framework to constructed scripts (e.g., Tengwar, Klingon) where reader fluency is low. If identity is differential, novices should be able to learn character distinctions faster when the *system of differences* is clear, even if intrinsic features are abstract. I will analyze existing pedagogical materials for these scripts to see if they teach features or distinctions.

  **Deliverables**
  1.  A set of experimental font files demonstrating the "glyph swap" conditions.
  2.  A short paper (approx. 3,000 words) articulating the differential theory of letterform identity, suitable for a design theory or cognitive semiotics venue.

  **Success and Failure Conditions**
  *   **Success:** The project successfully demonstrates that swapping glyphs causes systemic legibility collapse rather than simple character misidentification, supporting the claim that letter identity is relational. The constructed script analysis will show that learning hurdles correlate with ambiguous systemic distinctions rather than complex shapes.
  *   **Failure:** If readers identify the swapped glyphs strictly by shape regardless of context, the differential hypothesis is weakened. Alternatively, the project fails if the stimuli prove too ambiguous to yield clear observational results, or if the distinction between "feature" and "relation" collapses under analysis (i.e., if features are just localized relations).

  **Scope and Feasibility**
  This project is scoped strictly for a three-month, part-time timeline. It does not attempt to solve the general philosophy of concepts or build a machine learning model. It is a targeted probe into typography. The risk is that the "Swap Test" may yield mixed results (e.g., readers rely on both shape and context). To mitigate this, the deliverable is framed as a theoretical argument supported by designed artifacts, rather than a definitive empirical study. If the informal observations are inconclusive, the value remains in the formalization of the "differential" design framework itself, which offers a new heuristic for type designers working on coherent alphabets.
