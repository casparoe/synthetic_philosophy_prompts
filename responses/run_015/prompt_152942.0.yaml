  6.  **Final Polish:** Ensure the distinction between "no reason" (Toxin) and "insufficient reason" (Novel) is clear, as this is the pivot point for the character's rationality. Ensure the distinction between "infallible judge" (Toxin) and "interpretive panel" (Novel) is highlighted as moving the goalposts from logic to psychology.

