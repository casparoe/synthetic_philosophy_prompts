      *   *Refining the "Zero Status" point:* Be clear: You can act kindly toward things that don't matter morally (like a teddy bear), but usually, we do it because *we* matter. If the board thinks the *mosquito* matters, that's non-zero status.
      *   *Refining the Petition:* The petition says "count births prevented as harm." This clashes with Wolbachia. If preventing birth is harm, Wolbachia is bad. If preventing birth is good (no suffering), Wolbachia is good. The petition seems confused or uses "harm to population" in a way that doesn't track individual welfare.

