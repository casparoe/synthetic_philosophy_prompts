  ### The Verdicts

  1.  **Universality Classes:** **In.**
      *   **Why:** This is the *Carburetor* case on steroids. Like carburetors, these systems are wildly different microstructurally but share a causal role (behavior near criticality) constrained by physical law (dimension/symmetry). It supports strong projection (predicting unbuilt systems). It clears the "Money" hurdle because the constraint is physical/mathematical, not social.
  2.  **Optimal Recursive Estimators:** **In.**
      *   **Why:** Fits the *Carburetor* rule (functional kind) and the *Tiger* rule (projectible cluster). The "job" (estimation) is real and constrained by information theory, not human interest. The lack of causal contact doesn't matter (convergent function), just as carburetors from different manufacturers don't need common ancestry.
  3.  **Knockout Mice (Absence of G):** **In.**
      *   **Why:** This looks like *Jade* (disjunctive/negative) but acts like *Tiger* (lineage). A knockout line is a specific historical lineage where a specific mutation event occurred. The "absence" is a positive historical fact about that lineage. Since she lets history do the work for tigers, she'll let the specific deletion history do the work here.
  4.  **Invasive Species:** **Out.**
