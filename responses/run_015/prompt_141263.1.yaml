  ### The Rule She Is Running

  **Mind-Independent Causal-Functional Realism.**
  A candidate kind is "In" if it supports robust induction (projection) *and* its membership is grounded in mind-independent causal structures, histories, or physical functions.
  *   **Structure/History:** Covers Gold, Water, Tiger.
  *   **Physical Function:** Covers Carburetor, Universality Classes, Estimators.
  *   **Exclusion:** Filters out Money (socially constituted), Weed (interest-relative), Reptile (historically gerrymandered).

  ### The Competing Rule (That Fits Old Data But Splits Here)

  **The "Positive Property" Constraint.**
  *   **The Rule:** Natural kinds must be defined by the *presence* of a property (structure, mechanism, trait), not the *absence* of one.
  *   **Fit:** Explains why *Jade* (disjunctive minerals), *Raven-or-Desk*, and *Weed* (cluster picked by annoyance) are Out. It fits all her current "Out" verdicts perfectly.
  *   **The Split:** It predicts **Case 3 (Knockout Mice)** should be **Out**. Defining a kind by "Lacks Gene G" is defining by absence. If Marit votes **In** on Case 3, she rejects this rule in favor of the Lineage/History rule (where the absence is a specific historical marker). If she votes **Out**, she prioritizes the "No Negative Kinds" intuition over the Lineage intuition.

  ### The Money/Carburetor Tension

  You are right to flag this. It is the hardest pair in her list. For both to stand, the following distinction must be true:

  **Causal Constraint vs. Social Constitution.**
  *   **Carburetor (In):** The function (mixing air/fuel) is constrained by fluid dynamics and thermodynamics. A carburetor works (or fails) regardless of what humans *think* it is. The "job" is written into the physics.
  *   **Money (Out):** The function (medium of exchange) is *constituted* by collective intentionality. If everyone stops believing the paper has value, it ceases to be money. It stops working *because* we changed our minds.
  *   **The Line:** Functions grounded in **physical law** are natural kinds; functions grounded in **social agreement** are not.

