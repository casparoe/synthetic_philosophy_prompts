answer: |-
  This is a sharp design challenge. You are asking for a phenomenological simulation of a logical paradox. The risk is that the activity simply demonstrates *standard* confirmation (where $P(E) < 1$) rather than *old* evidence (where $P(E) = 1$), or it demonstrates the "New Logical Relation" solution (Garber 1983) without the participants realizing that's what they did.

  Below is a complete run-sheet for **"The Archivist's Anomaly."** It is designed to force the tension between the *feeling* of confirmation and the *formal* constraints of Bayesianism.

  ### Activity Overview: The Archivist's Anomaly
  **Goal:** Participants experience a credence surge in a Hypothesis ($H$) driven entirely by Facts ($E$) they already accepted as true, then analyze whether that surge was rational, psychological, or based on simplicity.
  **Materials:**
  1.  **Case File (Handout 1):** 15 "Established Facts" about a fictional departmental mystery.
  2.  **Credence Slips (Handout 2):** Pre- and Post-Hypothesis probability estimates.
  3.  **Scoring Sheet (Handout 3):** Brier Score calculation instructions.
  4.  **The Envelope:** Contains the "True Status" of the Hypothesis (for scoring).

  ---

  ### 1. The Setup (0:00 – 0:15)
  **The Narrative:** Tell them they are auditors investigating a bizarre administrative failure (e.g., "The Grant That Vanished").
  **The Constraint:** Emphasize that the **Case File** represents the *complete* set of available data. Nothing else is known.
  **The Facts (15 Items):** Deliberately seed them into three categories (do not label the categories, just mix them):
  *   **Type A (The "Old" Evidence):** 5 items marked **"Verified Log Entry."** These are hard data points (timestamps, signed receipts, server logs). *Design Intent:* Participants should assign $P(E) = 1$. They cannot be disputed.
  *   **Type B (The Fuzzy Evidence):** 5 items marked **"Staff Recollection."** (e.g., "I think the light was off"). *Design Intent:* $P(E) \approx 0.6 - 0.8$.
  *   **Type C (The Counter-Intuitive):** 5 items marked **"Verified Anomaly."** These are facts that seemed impossible at the time but are confirmed true (e.g., "The safe was open, but the alarm did not trigger"). *Design Intent:* These were initially surprising, now accepted as $P(E)=1$, but lack explanation.

  **Task:** Participants read the file individually. They must identify which facts seem "connected" and which seem random.
  **Bet 1:** On a private slip, they write their credence that "There is a single underlying cause for the Verified Log Entries (Type A)." (Scale 0–100%). *This establishes a baseline for $P(H)$ before $H$ is revealed.*

  ### 2. The Hypothesis Reveal (0:15 – 0:35)
  **The Reveal:** Hand out **Hypothesis Card ($H$)**.
  *   *Content:* A specific narrative (e.g., "The Department Head used a master override code between 2:00 and 2:15").
  *   *The Fit:* This hypothesis *entails* 4 of the 5 Type A facts, 2 of the Type B facts, and explains the 5 Type C anomalies perfectly.
  *   *The Catch:* It does *not* provide any *new* empirical data. It only provides a *structure* for the existing data.

  **Task:** Participants review the Case File in light of $H$. They are allowed to discuss the *fit* ("Oh, that explains the timestamp!") but **not** the truth of $H$ yet.
  **Bet 2:** On a new slip, they write their updated credence in $H$ (that $H$ is the true explanation).
  **Scoring Incentive:** Tell them: "At the end of the session, we will open the Envelope. $H$ is either True or False. Your score is calculated using the Brier Rule: $(1 - P)^2$ if True, $(0 - P)^2$ if False. Lowest score wins [Bragging Rights/Coffee]."
  *Note: This incentivizes honest reporting of internal credence, not 'correct' answers.*

  ### 3. The Control & Debrief (0:35 – 1:30)
  **The Twist (0:35):** Before opening the envelope, introduce **Rival Hypothesis ($H_{messy}$)**.
  *   $H_{messy}$ explains the exact same Type A facts but requires three ad-hoc assumptions (e.g., "The Head used the code, AND the camera was broken by chance, AND the log glitched").
  *   Ask for a show of hands: Who prefers $H$ over $H_{messy}$? (Almost everyone will).
  *   *Ask:* "Did $H_{messy}$ fit the Old Evidence just as well as $H$?" (Yes). "So why did your credence surge for $H$ and not $H_{messy}$?"

  **The Reveal (0:45):** Open the Envelope. (You, the moderator, decide this beforehand. I recommend $H$ is **True** to validate the surge, or **False** to validate the caution. Let's assume **True** for the flow below). Calculate Brier scores.

  **The Philosophical Autopsy (0:50 – 1:30):**
  Draw three columns on the board: **Phenomenology**, **Formalism**, **Confounds**.

  1.  **Map the Surge:** Ask those whose credence jumped >20% to raise hands.
      *   *Question:* "Did any of the Type A (Verified Log) facts change their truth value?" (No).
      *   *Question:* "Did you learn new empirical information?" (No).
      *   *Point:* This is the Old Evidence Problem. $P(E)=1$ before and after. Yet $P(H)$ rose.

  2.  **Separate "Aha" from Update:**
      *   Ask: "Did your credence shift more for the Type A facts (Verified) or Type B (Recollection)?"
      *   *Analysis:* If they shifted equally, the drive was **Coherence** (psychological fit). If they shifted more for Type B, it was **Standard Confirmation** (reducing uncertainty on $E$).
      *   *Goal:* You want them to see that the "Aha!" feeling treats $P(E)=1$ and $P(E)=0.7$ similarly, which violates the Likelihood Ratio logic.

  3.  **Isolate Simplicity:**
      *   Refer back to $H_{messy}$.
      *   *Point:* The surge wasn't just $E$ confirming $H$. It was $H$'s *simplicity* confirming $H$. The OEP often hides a Simplicity Prior shift.

  ---

  ### Predicted Failures (What will go wrong)
  1.  **The "New Relation" Objection:** A participant will say: *"I didn't learn $E$. I learned that $H \rightarrow E$. That is new information ($E^*$)."*
      *   *Response:* This is the Garber (1983) solution. Acknowledge it immediately. "You just solved the problem by expanding the language of the probability space. The OEP asks: Why does learning a logical relation feel like empirical confirmation?"
  2.  **Herding:** During the discussion phase (0:20–0:35), loud voices will sway the room's credence in $H$.
      *   *Mitigation:* Enforce silence during the "Bet 2" phase. Collect slips before any group discussion on the hypothesis truth.
  3.  **The "Facts Weren't Certain" Objection:** Someone will argue the "Verified Logs" could be faked, so $P(E)$ was never 1.
      *   *Mitigation:* In the debrief, force the counterfactual: "For the sake of the argument, assume the logs are infallible. Did you still feel the surge?"

  ### Honest Assessment: What This Game Actually Produces
  You asked me to tell you honestly which one your game produces.

  **1. It produces the Phenomenology, not the Paradox.**
  The activity successfully simulates the *feeling* of the Old Evidence problem. Participants will feel their credence in $H$ rise despite $E$ being fixed. However, logically, most participants are **not logically omniscient**.
  *   **The Reality:** At time $t_1$, they did not know $H$ entailed $E$. At time $t_2$, they learned $H \models E$.
  *   **The Verdict:** The game demonstrates the **Garber Solution** (conditionalizing on the logical relation), not the strict OEP (where the agent is logically omniscient and *still* faces the problem).
  *   **Why this matters:** In the debrief, you must clarify that standard Bayesianism *can* handle this if you treat "H entails E" as a new proposition. The OEP is only a problem for idealized agents who already know all logical relations. Your grad students are not idealized agents, so for them, the evidence *was* new (the relation was new).

  **2. It conflates Unification with Confirmation.**
  The surge they feel is largely driven by **Inference to the Best Explanation (IBE)**, not strict Bayesian conditionalization. The "Verified Log" facts become *more salient*, not more probable. The activity proves that human confirmation is driven by *narrative coherence*, which Bayesianism struggles to capture without adding priors for simplicity/unification.

  **3. The Scoring Rule Limitation.**
  The Brier score incentivizes honesty, but it cannot distinguish between a "lucky" guess and a "rational" update. If $H$ turns out to be False (in the envelope), the people who felt the "Aha!" surge will be penalized. This might lead them to conclude the surge was *irrational*.
  *   *Correction in Debrief:* Remind them that rationality is about the *process* (updating on available info), not the *outcome* (truth of H). A rational update can still land on a false hypothesis.

  ### What The Activity Cannot Reproduce (State this yourself)
  You must explicitly state this in the final 10 minutes:
  > "This activity relies on you *not* knowing the hypothesis beforehand. In the strict philosophical formulation of the Old Evidence Problem, the agent is **logically omniscient**. They know $H$, they know $E$, and they know $H \rightarrow E$ all at once. Even then, intuitively, $E$ should confirm $H$. Our game cannot simulate logical omniscience. If you felt confirmed, it was because you *learned the connection* just now. The hard philosophical problem is explaining why that connection counts as confirmation if it doesn't rule out any possible worlds you didn't already know were ruled out."

  ### Timeline Summary
  *   **0:00–0:15:** Read Case File (Type A/B/C facts). **Bet 1** (Baseline $P(H)$).
  *   **0:15–0:35:** Read Hypothesis $H$. Silent reflection on fit. **Bet 2** (Updated $P(H)$).
  *   **0:35–0:45:** Introduce $H_{messy}$ (Control for Simplicity).
  *   **0:45–0:55:** Reveal Truth (Envelope). Calculate Scores.
  *   **0:55–1:30:** Debrief (Map the surge, separate Aha from Logic, admit the Logical Omniscience gap).

  ### Moderator Script Snippet (For the Debrief)
  "When you saw the Hypothesis explain the Verified Logs, did you feel you had learned something *about the world*, or something *about the Hypothesis*?
  If you say 'about the Hypothesis,' you are treating the 'fit' as a property of $H$ (like simplicity).
  If you say 'about the World,' you are treating the 'fit' as new empirical data.
  The Old Evidence Problem exists because Bayesianism forces you to choose: either the fit is new data (which feels wrong, it's logic!) or it's nothing (which feels wrong, my confidence went up!). This game made your confidence go up. Your job now is to figure out where that probability mass came from."
