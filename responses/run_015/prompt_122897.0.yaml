answer: |-
  **Joint Statement on the Metaphysics of Emotion**
  **Signatories:** Party A (Judgment Theorist), Party B (Feeling Theorist)

  **Preamble: Definitions and Readings**
  To ensure clarity, we define contested terms prior to first use. **Judgment** (Party A): A commitment to the truth of a proposition involving conceptual content. **Feeling** (Party B): A conscious, valenced bodily affect shared with non-human animals. **Emotion**: The mental kind under investigation. **Fittingness**: The normative match between a state and its object. **Constituency**: What an emotion is made of. **Correctness**: In virtue of what an emotion is fitting. **Individuation**: What makes fear fear rather than anger.
  Both signatories adopt the **Strong Reading** of their respective theses: Party A holds judgment is essentially constitutive of emotion; Party B holds feeling is identical to emotion. Neither concedes their central thesis.

  **Section I: Agreed Claims**
  1. Emotions are distinct mental kinds, neither mere non-affective cognitions (like calculating sums) nor non-intentional sensations (like itches). [Constituency]
  2. Emotions possess intentional directedness toward specific objects or situations, distinguishing them from free-floating moods. [Constituency, Individuation]
  3. Emotions are assessable as fitting or unfitting relative to their objects; a fear can be unfitting if the object is safe. [Correctness]
  4. Emotions typically involve characteristic phenomenology and physiological changes, though the necessity of these is disputed below. [Constituency]
  5. Emotions can persist despite contradictory evaluative assessments by the subject (e.g., fearing what one judges safe). [Constituency, Correctness]
  6. Emotions motivate action relevant to their specific type (e.g., fleeing vs. striking), distinguishing them from non-motivating states. [Individuation, Correctness]

  **Section II: Disagreements Table**

  | Issue | Party A (Judgment) Formulation | Party B (Feeling) Formulation | Party C (Perceptual) Stance |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | An emotion is, or is essentially constituted by, an evaluative judgment or belief-like state. | An emotion is a valenced bodily or affective state whose phenomenology is the state itself. | Emotions are perceptions of value. Sides with **Neither** (Third Way). |
  | **Animals** | Non-linguistic animals lack full emotions as they cannot form evaluative judgments. | Non-linguistic animals possess full emotions as they possess bodily affect programs. | Non-linguistic animals possess full emotions. Sides with **Party B**. |
  | **Intentionality** | Directedness is intrinsic, derived from the conceptual content of the judgment. | Directedness is extrinsic, inherited from eliciting conditions and organism history. | Directedness is intrinsic but non-conceptual. Sides with **Party A**. |

  **Section III: Verbal Disputes**
  We identify a verbal dispute in Section II, Row 1 (Ontology), centering on the term **Judgment**. Party A uses "Judgment" to denote a rational commitment to truth. Party B suspects Party A uses "Judgment" to denote any automatic registration of value.
  **Surviving Question:** If we replace "Judgment" with "Rational Commitment" and "Feeling" with "Automatic Registration," the disagreement remains: Is the emotion's normative authority derived from the subject's rational competence (A) or from the organism's evolutionary history (B)? This is substantive, not merely semantic.

  **Section IV: Cruxes Table**

  | Crux | Case / Test | Party A Prediction | Party B Prediction | Losing Side's Exit Strategy |
  | :--- | :--- | :--- | :--- | :--- |
  | **a. Recalcitrance** | Subject judges elevator safe but fears it. | Two states: One Judgment (safe), one Rogue Impulse (fear). | One state: Feeling independent of Judgment. | **A:** The feeling is not the emotion. **B:** The judgment is not necessary. |
  | **b. Affective Decoupling** | Stipulated fear episode without any evaluative judgment or belief of danger. | Stipulation is **incoherent** (prediction: impossible). | Stipulation is **coherent** (prediction: possible proof). | **A:** Label it "startle," not fear. **B:** Label judgmentless state "assessment." |
  | **c. Calibrated Conviction** | Subject judges danger, acts safely, reports zero feelings. | Emotion **present** (cold fear). | Emotion **absent** (mere assessment). | **A:** Phenomenology is contingent. **B:** Feeling is essential. |
  | **d. Rational Review** | Argument: Emotions are revisable; Feelings lack propositional structure; Therefore Emotions ≠ Feelings. | Argument is **Sound**. | Argument **Unsound** (Premise 3 fails: feelings assessable without propositions). | **A:** Fittingness implies logic. **B:** Fittingness implies functional match. |

  **Section V: Closing Note**
  We specify what would count as evidence against our own views. Party A would concede if presented with a case of full emotion exhibiting zero evaluative take (no sense of danger, good, etc.). Party B would concede if presented with a case of full emotion exhibiting zero bodily feeling or phenomenology.
  Both agree such pure cases are conceptually resistant. Party A argues such a case would lack intentionality; Party B argues it would lack motivation. Consequently, neither expects empirical data to settle the metaphysical divide, as each interprets data through their constitutive definitions. The debate moves only if one side accepts the other's definition of "Emotion," which neither will do. We conclude that the dispute is foundational: it concerns not merely the nature of emotion, but the architecture of the mind itself—whether it is primarily a rational evaluator (A) or an embodied organism (B). This document stands as a record of our collision, not our convergence.
