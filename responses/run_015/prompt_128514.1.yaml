prompt: |-
  Hey — I'm a science-and-ideas journalist pulling together briefing notes for a researcher I'm profiling. She's giving a seminar this tuesday defending the idea that symbol grounding in large multimodal models is solved purely by cross-modal statistical locking inside high-dimensional embedding spaces — no bodies, no causal coupling, no sensorimotor loop with the world required. The audience is an embodied-cognition workshop: mostly enactivists and phenomenology-leaning roboticists who treat meaning as being-in-the-world, plus a couple skeptical computational linguists who think the framing is category-error territory. I need her Q&A prep sheet — the eight or so objections she'll actually recieve, ordered by how damaging they'd be, each phrased the way that crowd puts it, with a two-minute reply she can actually deliver and a quick note on where the reply is weakest. She concedes up front she's not solving intentionality, just reference-grounding, so build that concession in. Include the one question she's praying nobody asks. No biblography needed, this is tactical prep not an essay. Keep it focused.
