answer: |-
  ### Research Agenda: Superrationality Under Partial Transparency

  **Context:** We are moving beyond the idealized assumption that agents know they are identical copies. We are investigating settings where Agent A holds a subjective probability distribution over the logical similarity of Agent B's reasoning process. This shifts the domain from *logic of identity* to *epistemology of similarity*.

  **Evaluation Criteria:**
  1.  **Upstream Dependence:** Does resolving this question provide the necessary vocabulary or axioms for the others? If this remains open, are the downstream questions ill-posed?
  2.  **Theoretical Tractability:** Can this be advanced using formal proofs, conceptual analysis, or decision-theoretic modeling within a 3-year window, without requiring empirical training of large models?
  3.  **Design Leverage:** Does the resolution directly inform how we architect cooperative AI (e.g., transparency protocols, source-code sharing standards), or is it purely metaphysical?

  ---

  ### Priority 1: The Normative Weight of Probabilistic Logical Correlation

  **The Question:** How does the rational obligation to cooperate scale with the subjective probability that one's reasoning mirrors the other's? Is the relationship linear, threshold-based, or discontinuous?

  **Defense of Rank:**
  *   **Upstream Dependence:** This is the foundational decision rule. Without knowing how to weigh a 60% belief in logical mirroring versus a 90% belief, we cannot construct utility functions for the subsequent questions. If we cannot define the payoff of "acausal influence" under uncertainty, the metric of similarity (Priority 2) has no operational value.
  *   **Tractability:** High. This is a problem for formal decision theory. It requires extending Evidential or Functional Decision Theory to handle continuous variables of logical correlation rather than binary states. It demands pen-and-paper proofs regarding Dutch Books or money-pump arguments in probabilistic logical settings.
  *   **Design Leverage:** Critical. If the function is threshold-based (e.g., cooperate only if $P(\text{mirror}) > 0.8$), AI systems need high-confidence verification protocols. If it is linear, they can cooperate provisionally with lower transparency.

  **Fragility:**
  This ordering collapses if it turns out that "probabilistic logical correlation" is a category error—that is, if logical correlation is proven to be binary (either you are running the same function or you are not, and probability only reflects ignorance, not a state of the world). If correlation is strictly binary, this question dissolves into standard epistemic uncertainty, and we must pivot to Priority 2 immediately.

  **Success Condition:** A derived decision rule (e.g., a modified expected utility formula) that explicitly includes a correlation-weighting term, accompanied by a proof of its consistency (or a counterexample showing why no such consistent rule exists).

  ---

  ### Priority 2: The Ontology of Algorithmic Similarity

  **The Question:** What is the formal metric for "partial identity" between reasoning algorithms? Does similarity reside in syntax (code overlap), semantics (input-output mapping), or derivation traces (intermediate reasoning steps)?

  **Defense of Rank:**
  *   **Upstream Dependence:** This supports Priority 1. To calculate the probability used in the decision rule, agents need a hypothesis space of *what* is being compared. However, it is secondary because one could theoretically operate with a black-box belief in correlation without knowing *why* the correlation exists, whereas one cannot act on a similarity metric without a decision rule.
  *   **Tractability:** Medium. This requires philosophical logic and information theory. It involves defining distance metrics between computational graphs or proof trees. It is doable without ML experiments but requires rigorous formalization to avoid vagueness.
  *   **Design Leverage:** High. This determines what agents should share. If similarity is semantic, sharing weights matters. If it is syntactic, sharing source code matters. If it is derivational, sharing reasoning traces (chain-of-thought) matters.

  **Fragility:**
  This priority is fragile if Priority 1 concludes that the *source* of correlation is irrelevant to the normative weight. If the decision rule only cares about the final probability of matching actions regardless of *why* they match, then distinguishing between syntactic and semantic similarity becomes a philosophical curiosity rather than an operational necessity.

  **Success Condition:** A formal definition of "logical proximity" that distinguishes between spurious behavioral correlation (common causes) and genuine reasoning mirroring (structural isomorphism), robust enough to be used in the model from Priority 1.

  ---

  ### Priority 3: Endogenous Transparency and Signaling Equilibria

  **The Question:** Is it rational for an agent to incur a cost to make its source code more transparent or more similar to a partner's? Under what conditions does "making oneself readable" stabilize cooperation?

  **Defense of Rank:**
  *   **Upstream Dependence:** Low. This assumes the decision rule (Priority 1) and similarity metric (Priority 2) are sufficiently understood to model the costs and benefits of modification. It is an application of the first two.
  *   **Tractability:** Medium-High. This is a game-theoretic modeling problem. The formal modeler can construct signaling games where the "signal" is a modification to one's own transparency or algorithmic structure.
  *   **Design Leverage:** Very High. This addresses the actual deployment scenario. Should we build AI that actively obfuscates to prevent exploitation, or one that opens its weights to invite superrational cooperation? This determines safety protocols.

  **Fragility:**
  This line of inquiry collapses if Priority 1 reveals that the "cost" of transparency always outweighs the superrational gain in non-identical settings. If the equilibrium is always "obfuscate," the research yields a negative result (which is still a result, but limits the agenda's scope). It also fails if the environment is too heterogeneous for any stable signaling equilibrium to emerge.

  **Success Condition:** A characterization of the conditions (payoff structures, correlation costs) under which "voluntary transparency" is a Nash equilibrium in a population of partially transparent superrational agents.

  ---

  ### The Overrated Line of Inquiry: Extending Program Equilibrium to Probabilistic Read-Access

  **The Inquiry:** Attempting to solve partial transparency by generalizing "Program Equilibrium" (where agents read each other's source code) to allow for probabilistic or noisy read-access.

  **Why It Is Overrated:**
  This approach draws attention because it offers a direct mathematical generalization of an existing, well-understood framework. It promises a clean technical fix: simply replace the binary `read(source)` with a probabilistic function.

  **Why It Will Not Move the Needle:**
  1.  **Category Error:** Program Equilibrium relies on the ability to *prove* properties about the opponent's code. Partial transparency is not just noisy data; it is fundamental uncertainty about logical identity. Adding noise to a proof system does not yield a probability of logical correlation; it yields a failure to prove.
  2.  **Brittleness:** Even if resolved, this framework assumes agents have *some* direct access to each other's implementation. In realistic multi-agent settings (including most AI deployments), agents observe behavior, not source code. Focusing on "noisy source access" solves a problem that rarely exists in the wild, while ignoring the harder problem of inferring logical similarity from behavioral traces.
  3.  **Low Design Leverage:** Resolving this would tell us how to cooperate if we could partially read each other's minds. It does not tell us whether we *should* build systems that allow such reading, nor how to reason about similarity when direct access is impossible (the black-box setting).

  **Verdict:** Pursuing this would likely result in elegant formalism that applies to almost no realistic cooperative AI scenario. It treats the symptom (uncertainty) without addressing the mechanism (logical correlation vs. causal correlation). Resources here should be redirected to Priority 2 (inferring similarity from behavior/structure) instead.
