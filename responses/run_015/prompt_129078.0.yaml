      *   Partial transparency means: $P(\text{mirror}) < 1$. I suspect you use a similar heuristic, or we share a library, but I'm not sure.
      *   This moves the problem from "Logic of Identity" to "Epistemology of Similarity."
      *   Key tension: How does the *degree* of believed correlation map to the *degree* of cooperation required/expected?

