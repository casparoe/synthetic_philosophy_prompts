      *   *Q3: The Stability of Beliefs.* If I believe you are 80% like me, do I adjust my algorithm to be *more* like you to increase that 80%? (Endogenous correlation).
      *   *Q4: The Löbian Obstacle.* Can agents prove things about each other's cooperation without running into Gödelian limits when transparency is partial?
