prompt: |-
  I have been reading about moral uncertainty on my own over the past year — I have no academic background in philosophy, just a stack of popular books and a lot of forum threads — and the move I keep running into is that being unsure which moral theory is correct is supposed to work exactly like being unsure about some ordinary matter of fact. You list the possibilities, attach a probability to each, score every option under each possibility, and take the option with the highest expected score. The people who lean on this comparison then use it to license two conclusions that I find quite different in plausibility:

  1. that I should hedge my giving — split my donations between, say, a cause that looks best on my own favorite view and a cause that looks best on a view I think is probably wrong but not certainly wrong, so that I do tolerably well either way; and
  2. that very small credences in theories that posit astronomically large stakes can legitimately swamp everything else, so that a fraction of a percent of confidence that some huge number of beings matter morally can make that the only thing worth funding.

  I have already noticed one place the comparison seems to strain: when I try to score the same option under two different theories, the numbers come from different theories' own scales, and if I am allowed to multiply one theory's scale by a constant, I can change which option wins. I have also read that under ordinary factual uncertainty there is usually some story about repeated similar cases and long-run frequencies that backs up expected-value reasoning, and I cannot see what plays that role here, since many of the choices in question are one-off.

  Before I let the analogy do any work for me, I would like an audit of it, written so that a careful non-specialist can follow the technical parts:

  - Lay out the mapping explicitly — a correspondence table is welcome. What plays the role of the sample space, of an outcome, of a probability measure, of the value function, of learning from evidence, and of the justification for aggregating by weighted addition? Be explicit about which elements of the factual case have no partner in the moral case.
  - Then separate the disanalogies that matter for the two conclusions above from the ones that are merely decorative. I suspect some breaks sink conclusion 2 while leaving conclusion 1 intact, but I would like that argued rather than asserted.
  - Tell me whether either conclusion survives once the breaks are on the table, and if one does, what the weakest link in the surviving argument is.
  - I have a patch of my own that I would like tested rather than flattered. Instead of adding each theory's normalized score, normalize each theory's scale against one fixed reference pair (the difference between a normal life and a life of unrelenting agony, say) and then multiply the normalized scores rather than add them, on the model of the multiplicative rule used in a standard two-person bargaining solution — the thought being that multiplication is unaffected if one theory's units are rescaled, and that it gives each theory something like a veto, so a single theory positing enormous stakes cannot dominate all by itself. Does this actually solve the scale problem, relocate it, or add new problems of its own (for instance about how the reference pair gets chosen, or about theories that return zeros or infinities)?
  - Does the analogy, taken seriously, also recommend spending on moral information in the way it recommends spending on factual information, and if so what could that even consist of?
  - If the uncertainty-is-just-uncertainty comparison is the wrong one, what is the closest analogy that does the work people want from it? I have seen being unsure which expert to trust, and being subject to several overlapping legal systems at once, floated as alternatives, but I do not trust my sense of which features each of those imports.

  In your answer, please say plainly which parts of what you tell me are things people working on this would mostly agree about, which are contested, and which are your own judgment. I would also like to know what would change your verdict — the one argument or consideration that would move you, and the place in your own reasoning where you think it is most likely to have gone wrong. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Non-specialist in philosophy (no academic background), self-taught via popular books and forums (likely LessWrong, EA Forum, etc.). Careful, critical thinker. Notices specific technical issues (intertheoretic comparison, scale invariance, frequentist justification).
      *   **Topic:** Moral Uncertainty (specifically the "expected choiceworthiness" or "maximizing expected value" approach applied to moral theories).
      *   **Core Task:** Audit the analogy between factual uncertainty and moral uncertainty.
      *   **Specific Requirements:**
          1.  Explicit mapping (correspondence table) between factual and moral uncertainty.
          2.  Separate material disanalogies from decorative ones, specifically regarding the two conclusions (hedging vs. fanaticism).
          3.  Evaluate survival of conclusions after accounting for disanalogies.
          4.  Test the user's proposed "multiplicative normalization" patch.
          5.  Address spending on moral information.
          6.  Propose better analogies if the standard one fails.
          7.  **Meta-Requirements:** Distinguish between consensus, contested views, and my own judgment. State what would change my verdict and where my reasoning might be weak. Use American English.

  2.  **Deconstruct the Core Analogy (Factual vs. Moral Uncertainty):**
      *   *Factual:* States of the world (S), Probabilities (P), Outcomes/O utilities (U), Expected Utility (EU).
      *   *Moral:* Moral Theories (T), Credences (C), Choiceworthiness (V), Expected Choiceworthiness (ECV).
      *   *Key Problem:* Intertheoretic Comparison (ITC). In factual uncertainty, utility is usually defined over a common domain (world states). In moral uncertainty, different theories define value differently (hedons vs. preferences vs. virtues).

  3.  **Drafting the Correspondence Table (Requirement 1):**
      *   Need to map: Sample Space, Outcome, Probability Measure, Value Function, Learning, Justification for Aggregation.
      *   *Crucial Disanalogy:* In factual cases, outcomes are ontologically shared. In moral cases, "value" is theory-dependent.

  4.  **Analyzing the Two Conclusions (Requirement 2 & 3):**
      *   *Conclusion 1 (Hedging):* Splitting donations. This relies on risk aversion or simply maximizing ECV across theories that disagree on *which* action is best.
      *   *Conclusion 2 (Fanaticism):* Small credence $\times$ Infinite/Astronomical Value = Dominance.
      *   *Disanalogies:*
          *   *Scale/Units:* Factual utility is cardinal but comparable across states. Moral choiceworthiness lacks a common unit (the "intertheoretic comparison problem"). This hits Conclusion 2 hard.
          *   *Frequency/Long Run:* Factual EV relies on law of large numbers. Moral choices are often one-off or structurally unique. This hits the justification for *both*, but especially the fanaticism case where variance is huge.
          *   *Metaphysics:* Factual uncertainty is about what *is*. Moral uncertainty is about what *ought to be*. Some argue moral uncertainty is just uncertainty about normative facts (realism), others say it's conative (desires).
      *   *Verdict:* Hedging (1) is more robust because it doesn't require precise cardinal comparison, just ordinal ranking or rough comparability. Fanaticism (2) collapses without a solution to the scale problem.

  5.  **Evaluating the User's Patch (Requirement 4):**
      *   *Proposal:* Normalize scales against a reference pair (normal life vs. agony) and *multiply* scores (Nash Bargaining style) instead of adding.
      *   *Analysis:*
          *   *Pros:* Solves zero-point and unit scaling issues (affine transformations). Gives veto power (prevents tyranny of one theory).
          *   *Cons:*
              *   *Reference Pair:* How do theories agree on what counts as "agony"? A hedonist and a Kantian might disagree on the badness of pain.
              *   *Zeros/Infinities:* If one theory says an option is neutral (0), the product is 0 (veto becomes paralysis). If one says infinity, product is infinity.
              *   *Intuition:* Multiplication implies cooperation/compromise, not truth-seeking. It changes the goal from "finding the right answer" to "keeping everyone happy."
              *   *New Problem:* It introduces a status quo bias (the reference point).
      *   *Verdict:* It relocates the problem to the choice of the reference pair and the zero-point. It doesn't solve the "fanaticism" issue if the fanatic theory assigns infinite value to the reference pair.

  6.  **Spending on Moral Information (Requirement 5):**
      *   Yes, the analogy recommends "moral research."
      *   *What is it?* Philosophy, introspection, dialogue, trying to reflectively equilibrate.
      *   *Problem:* Unlike factual info, moral info isn't clearly convergent. Will reading more philosophy actually change credences toward the *truth*, or just toward *persuasive arguments*?

  7.  **Alternative Analogies (Requirement 6):**
      *   *Committee/Parliament:* (Lockhart, Bostrom). Theories are voters.
      *   *Expert Advice:* Theories are experts.
      *   *Legal Jurisdictions:* Overlapping authority.
      *   *Best Fit:* The "Committee" model is the standard alternative. It handles the "veto" idea better than the EV model. But it still faces the voting weight problem.

  8.  **Meta-Commentary (Requirement 7):**
      *   Need to label consensus vs. contested vs. judgment.
      *   *Consensus:* Intertheoretic comparison is hard. Fanaticism is a major problem.
      *   *Contested:* Whether moral realism is true (needed for the analogy to hold strictly). Whether normalization is possible.
      *   *My Judgment:* The analogy is useful heuristically but metaphysically shaky. Hedging is prudent; Fanaticism is dangerous without ITC solutions.
      *   *What would change my mind:* A robust account of intertheoretic comparison that doesn't rely on arbitrary normalization.

  9.  **Refining the Tone and Structure:**
      *   American English.
      *   Clear headings.
      *   Direct answers.
      *   Avoid flattery, be critical of the patch.
      *   Ensure the "consensus/contested/judgment" tags are clear.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "repeated cases" point? *Yes, need to emphasize the lack of law of large numbers in moral choices.*
      *   *Check:* Did I explain *why* multiplication fails? *Yes, the zero/infinity problem and the reference point arbitrariness.*
      *   *Check:* Did I distinguish between Conclusion 1 and 2 clearly? *Yes, Hedging is ordinal-friendly, Fanaticism is cardinal-dependent.*
      *   *Check:* Am I being too technical? *Keep the math conceptual. Explain "affine transformation" simply.*
      *   *Check:* Did I answer the "what would change your verdict" part? *Need to be specific.*

  11. **Final Polish:** Ensure the distinction between "moral realism" (facts exist) and "moral anti-realism" (preferences express) is clear, as this underpins the whole analogy. (Decided to keep it focused on the *structure* of the decision problem rather than deep metaethics, as the user asked about the analogy's mechanics).

  *(Self-Correction on the "Multiplicative Patch"):* I need to be careful. Nash Bargaining maximizes the product of *gains* over a disagreement point. The user suggests multiplying normalized scores. If a score is 0 (neutral), the total is 0. This implies a veto. But if a theory says an action is *bad* (negative), does the product become negative? Complex numbers? Absolute values? I should point out that multiplication requires a specific structure (ratio scale) that moral theories might not even have. Most moral theories offer ordinal or at best interval scales, not ratio scales (no true zero). This is a killer objection.

  *(Refining the "Consensus" labels):* Be careful not to overstate consensus. Moral uncertainty is a niche field. "Consensus" means among those working on it (MacAskill, Bykvist, Ord, etc.).

  *(Final Plan):*
  1. Intro acknowledging the sophistication of the query.
  2. The Mapping Table.
  3. Disanalogies & Conclusions (Hedging vs. Fanaticism).
  4. The Patch Audit.
  5. Moral Information.
  6. Alternative Analogies.
  7. Meta-Evaluation (Consensus/Judgment/Update conditions).

  Let's write.
answer: |-
  This is a sophisticated set of questions. You have correctly identified the central tension in the literature on moral uncertainty: the attempt to import the formal machinery of decision theory (designed for factual uncertainty) into the normative domain. The field is small, but the technical objections you raise are the exact ones currently debated by specialists like William MacAskill, Toby Ord, and Christian Tarsney.

  Below is an audit of the analogy, structured according to your requests.

  ### 1. The Mapping: Factual vs. Moral Uncertainty

  To see where the analogy strains, we must first formalize the correspondence. In standard decision theory, an agent maximizes Expected Utility (EU). In moral uncertainty, the proposal is to maximize Expected Choiceworthiness (ECV).

  | Element | Factual Uncertainty (Standard Decision Theory) | Moral Uncertainty (Expected Choiceworthiness) | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Sample Space** | States of the world ($S$). E.g., "It rains," "It shines." | Moral Theories ($T$). E.g., Utilitarianism, Deontology, Virtue Ethics. | **Secure.** We can list competing hypotheses in both cases. |
  | **Probability Measure** | Credence in states ($P(S)$). Based on evidence/frequency. | Credence in theories ($C(T)$). Based on philosophical argument/intuition. | **Contested.** It is unclear if "credence" in a normative theory behaves like probabilistic belief. |
  | **Outcome** | World states resulting from actions ($O$). | Actions themselves, or their consequences, evaluated normatively. | **Strained.** Outcomes are ontologically shared in factual cases; "value" is not shared in moral cases. |
  | **Value Function** | Utility function ($U: O \rightarrow \mathbb{R}$). Cardinal, comparable across states. | Choiceworthiness function ($V: Action \rightarrow \mathbb{R}$). Theory-relative. | **Broken.** This is the **Intertheoretic Comparison Problem**. $U$ uses common units (e.g., dollars, QALYs). $V$ uses theory-specific units (e.g., "hedons" vs. "duty fulfilled"). |
  | **Aggregation** | Weighted Sum: $\sum P(S) \times U(O)$. | Weighted Sum: $\sum C(T) \times V_T(Action)$. | **Strained.** Requires $V_T$ to be cardinally comparable across different $T$. |
  | **Justification** | Long-run frequency (Law of Large Numbers) or coherence axioms (Von Neumann-Morgenstern). | Coherence axioms (avoiding "money pumps" across theories). | **Broken.** No long-run frequencies for one-off moral choices; coherence axioms are less compelling for normative truth. |
  | **Learning** | Observation updates $P(S)$. | Reflection/Argument updates $C(T)$. | **Strained.** Factual learning converges; moral learning may not converge to a single truth. |

  **The Critical Break:** The value function. In factual uncertainty, if I am unsure whether a box contains \$10 or \$100, the unit ("\$") is constant across the states. In moral uncertainty, if I am unsure between Utilitarianism and Kantianism, the unit ("welfare" vs. "rational adherence") is *not* constant. You cannot multiply a probability by a value if the value's scale changes depending on which probability is true.

  ### 2. Disanalogies and the Two Conclusions

  You asked to separate disanalogies that matter for your two conclusions (Hedging vs. Fanaticism) from decorative ones.

  **Decorative Disanalogies:**
  *   **The Ontology of "States":** Whether moral theories describe mind-independent facts (realism) or human attitudes (anti-realism) matters for metaethics, but not necessarily for the *decision procedure*. Even if morality is subjective, you can still be uncertain about your own future values.
  *   **Observability:** You can open the box to see the money. You cannot "observe" the true moral theory. This matters for learning, but not for the immediate calculation of expected value.

  **Material Disanalogies:**
  *   **Intertheoretic Comparison (Scale Invariance):** As you noted, utility in factual cases is invariant to positive affine transformations (adding a constant or multiplying by a positive number doesn't change the choice). In moral cases, because the *zero point* and the *unit size* differ between theories, multiplying one theory's scores by 1,000 can change the winning action.
  *   **The Long Run:** Factual EV is justified by the idea that if you take this bet a million times, you win. Moral choices (e.g., "how to donate my life savings") are often one-off. There is no statistical wash-out.

  **Impact on Conclusion 1 (Hedging):**
  *   **Verdict:** **Survives.**
  *   **Reasoning:** Hedging does not require precise cardinal comparison. It only requires *ordinal* disagreement. If Theory A says "Give to Charity X" (Rank 1) and Theory B says "Give to Charity Y" (Rank 1), and you have credence in both, splitting the donation is a robust way to avoid doing terribly on either view. You do not need to know exactly *how much* better X is than Y to see that doing some of both is safer than doing all of one. The lack of a common scale is less damaging here because you are not trying to maximize a precise sum, but rather avoid catastrophic failure on a high-credence view.

  **Impact on Conclusion 2 (Fanaticism):**
  *   **Verdict:** **Collapses.**
  *   **Reasoning:** Fanaticism relies entirely on the cardinal scale. It argues that $0.01 \times \infty > 0.99 \times 100$. This calculation is only valid if the "100" in the second term and the "$\infty$" in the first term are measured in the same units. Without a solution to the Intertheoretic Comparison Problem, the fanatic theory can simply redefine its units to be larger. If Utilitarianism says "Save a life = 1 unit," and Fanatic Theory says "Prevent a simulation shutdown = 1,000,000 units," the math is rigged. The lack of a long-run frequency justification also hurts here: you cannot rely on "eventually the fanatic bet pays off" because there is no "eventually" in existential risk or one-off moral dilemmas.

  ### 3. Audit of Your "Multiplicative Patch"

  You proposed normalizing theories against a reference pair (normal life vs. agony) and multiplying the scores (Nash Bargaining style) rather than adding them.

  **Does this solve the scale problem?**
  *   **Partial Success:** It solves the *unit* scaling problem. If Theory A doubles its scores, the product doubles, but the *ranking* of options remains the same (assuming all scores are positive). It makes the aggregation invariant to multiplication of the scale.
  *   **Failure on Zero-Points:** It does not solve the *zero-point* problem. Moral theories usually provide interval scales (differences matter), not ratio scales (absolute zero matters). Does a life of "normalcy" have value 0? Does agony have value -1? A hedonist might say agony is $-1,000,000$ hedons. A Stoic might say agony is value-neutral (0) because only virtue matters. If the Stoic assigns 0 to the reference pair, your normalization breaks.

  **New Problems Introduced:**
  1.  **The Reference Pair Arbitrariness:** [Consensus] There is no theory-neutral way to select the reference pair. To agree that "unrelenting agony" is the bottom anchor, the Kantian, the Hedonist, and the Nihilist must agree on the *value* of agony. They often do not.
  2.  **The Zero/Veto Problem:** [My Judgment] Multiplication turns any neutral rating into a veto. If one theory says an action is "permissible but not required" (value 0 in your normalized scheme), the total expected value becomes 0. This grants every theory a veto, leading to paralysis. In bargaining, a veto is a feature; in truth-seeking, it is a bug.
  3.  **Negative Values:** [Technical] If a theory rates an action as *bad* (negative value), multiplying scores creates sign-flipping chaos. (Negative $\times$ Positive = Negative; Negative $\times$ Negative = Positive). You would need to restrict the domain to positive values, which implies all theories must agree on what constitutes a "positive" outcome.
  4.  **Fanaticism Relocated:** [My Judgment] This does not stop fanaticism; it relocates it. A fanatic theory can still dominate by assigning an astronomically high score to the "top" of the reference pair. If Theory A says the best outcome is 10, and Fanatic Theory B says the best outcome is $10^{100}$, the product is still dominated by B.

  **Verdict on Patch:** It is mathematically elegant but ethically unstable. It trades the "scale" problem for a "reference point" problem and a "veto paralysis" problem.

  ### 4. Spending on Moral Information

  **Does the analogy recommend spending on moral information?**
  *   **Yes.** [Consensus] If you are uncertain, reducing uncertainty has value. In decision theory, the Value of Information (VoI) is positive if new information could change your decision.
  *   **What does it consist of?** This is where the analogy frays.
      *   *Factual:* Run an experiment, read a report.
      *   *Moral:* Read philosophy? Meditate? Debate?
  *   **The Problem:** [Contested] In factual cases, we assume evidence pushes us toward the truth. In moral cases, we lack a clear mechanism for convergence. Spending \$1 million on moral philosophy research might just produce more sophisticated arguments for conflicting views, not reduce the variance in your credences.
  *   **Implication:** The analogy recommends "moral research," but without a theory of *moral epistemology* (how we come to know moral truths), we cannot calculate the expected return on that investment.

  ### 5. Alternative Analogies

  If the "uncertainty is just uncertainty" model is broken, what works better?

  **1. The Parliamentary Model (Lockhart, Bostrom)**
  *   **Concept:** Treat moral theories as legislators in a parliament. Your credence determines how many seats they get. They bargain to pass legislation (actions).
  *   **Pros:** Handles the "veto" intuition better. Explains hedging naturally (coalition building). Avoids needing a common cardinal scale; theories can trade "ordinal favors" (I support your issue if you support mine).
  *   **Cons:** Still requires a way to weigh the seats (credences). Doesn't fully solve fanaticism if one party demands everything.

  **2. The Expert Advice Model**
  *   **Concept:** Moral theories are experts. You are the decision-maker.
  *   **Pros:** Fits the intuition that you are deferring to authority.
  *   **Cons:** Experts usually agree on the *scale* of their domain (engineers agree on meters). Moral experts do not.

  **3. The "My Favorite Theory" Approach (Hedging only)**
  *   **Concept:** Ignore moral uncertainty. Act on the theory you find most plausible.
  *   **Pros:** Avoids all comparison problems.
  *   **Cons:** Ignores the risk of being wrong.

  **Best Fit:** [My Judgment] The **Parliamentary Model** is the closest functional analogy. It captures the *political* reality of having conflicting internal commitments without pretending those commitments are measurable on a single ruler. It justifies Conclusion 1 (Hedging/Coalition) without licensing Conclusion 2 (Fanaticism/Tyranny of the Majority), provided you institute constitutional protections (constraints) against extreme demands.

  ### 6. Meta-Evaluation and Consensus Report

  **Consensus among specialists:**
  *   The Intertheoretic Comparison Problem is the single biggest technical hurdle for Expected Choiceworthiness.
  *   Conclusion 1 (Hedging) is generally viewed as more robust than Conclusion 2 (Fanaticism).
  *   The "Factual Uncertainty" analogy is recognized as a useful heuristic but metaphysically suspect.

  **Contested:**
  *   Whether moral credences should obey the axioms of probability at all.
  *   Whether normalization (like your patch) is possible or coherent.
  *   Whether "fanaticism" is a bug (reductio ad absurdum) or a feature (accepting the math).

  **My Own Judgment:**
  *   The analogy is dangerous when applied to Conclusion 2. It treats normative truth as if it were a hidden variable waiting to be measured, rather than a framework for evaluation.
  *   Hedging is prudent risk management, not necessarily "moral expected value maximization."
  *   Your multiplicative patch is creative but fails because it assumes moral theories have a "zero" point that can be agreed upon. They do not.

  **What would change my verdict?**
  *   **The Argument:** A robust defense of **Intertheoretic Comparison** that does not rely on arbitrary normalization. For example, if someone could demonstrate that all plausible moral theories converge on a specific "currency" of value (e.g., "preference satisfaction" or "conscious experience") at a fundamental level, the scale problem would dissolve.
  *   **Where I might be wrong:** I am assuming that moral theories are incommensurable. It is possible that a "fundamental" moral theory exists (a "metatheory") that can translate all other theories into a common unit. If such a metatheory is discoverable, the factual uncertainty analogy becomes much stronger. I am skeptical this is possible, but if it were proven, my rejection of Conclusion 2 would be unsound.

  ### Summary for Decision Making

  1.  **Trust the Hedging (Conclusion 1):** It works even if the math is fuzzy, because it relies on ordinal disagreement rather than cardinal precision.
  2.  **Reject the Fanaticism (Conclusion 2):** The math requires a common scale that does not exist. Small probabilities of infinite value are artifacts of unit selection, not moral reality.
  3.  **Discard the Multiplicative Patch:** It introduces veto paralysis and assumes agreement on "zero value" that does not exist.
  4.  **Adopt the Parliamentary Mindset:** View your moral uncertainty as a negotiation between internal stakeholders, not a calculation of a single hidden variable. This supports diversification without requiring you to solve the scale problem.
