  ### Preliminary Analysis: Mapping the Terrain

  Before I give you a definitive answer, I want to walk through the philosophical toolbox to see what we already have. You've identified something subtle, and it's important we don't just slap a cheap label on it. We need to understand the *mechanism* of the move.

  Here is what I am considering as I analyze your description:

  1.  **Thick Ethical Concepts:** In philosophy of language (think Bernard Williams or Hilary Putnam), there is a distinction between "thin" concepts (like *good*, *right*, *bad*) and "thick" concepts (like *cruel*, *brave*, *treacherous*). A thin concept is mostly evaluation. A thick concept blends description and evaluation. To call an act "cruel" is to describe it (it causes pain) and evaluate it (it is wrong) simultaneously.
      *   *Relevance:* "Western values" is being treated like a thick concept. It claims to describe a reality ("This is what the West *is*") and evaluate it ("This is what is *good*").
      *   *Problem:* Usually, thick concepts are relatively stable. If you prove an act isn't painful, it stops being cruel. Your friend is decoupling them. When the description is bad (slavery), he keeps the evaluation (good) and discards the description. When the description is useful (colonialism), he keeps the description. This is a *manipulation* of a thick concept, not just a standard use.

  2.  **The Motte and Bailey Doctrine:** This is a rhetorical structure where someone has a defensible, boring position (the Motte) and a controversial, exciting position (the Bailey). When attacked, they retreat to the Motte. When safe, they occupy the Bailey.
      *   *Relevance:* The "Motte" here is "Western values are abstract ideals like freedom." The "Bailey" is "Western values justify this specific policy or historical superiority."
      *   *Problem:* Motte and Bailey is primarily defensive. Your friend is also *offensive* (blaming the West for colonialism using a broad descriptive list). He isn't just retreating to safety; he's shifting definitions to maximize rhetorical power in either direction.

  3.  **No True Scotsman:** This is when someone redefines a group to exclude counter-examples ("No true Scotsman puts sugar in his porridge").
      *   *Relevance:* Your friend says countries with blasphemy laws were "betraying their values."
      *   *Problem:* This explains how he excludes the counter-example, but it doesn't explain *why* the term has authority in the first place. NTS protects the definition; your friend's move uses the definition to claim authority from both reality and morality.

  4.  **Floating Signifiers:** In political theory (Laclau/Mouffe), this is a term so vague it can be filled with different meanings by different groups (e.g., "Freedom," "The People").
      *   *Relevance:* "Western values" is definitely a floating signifier.
      *   *Problem:* This explains why *different people* mean different things. It doesn't fully capture the *single speaker* sliding between "Is" and "Ought" to immunize their own argument from falsification.

  **Conclusion of Analysis:**
  There is no single, canonical term in the history of philosophy that captures this *specific* combination: the strategic sliding between empirical description and moral idealization by a single speaker to claim dual authority (the authority of fact and the authority of goodness) while accepting neither responsibility.

  Because this is a precise rhetorical pathology that deserves its own name, I am going to coin a term for you. I will define it rigorously so you can use it as a tool, not just a weapon.

  ***

  ### The Concept: The Normative-Descriptive Equivocation

  I propose we call this move **The Normative-Descriptive Equivocation** (or, for short, **The N-D Slide**).

  While "equivocation" is a standard logical fallacy (using a word in two different senses in the same argument), this is a specific *strategic* deployment of equivocation regarding political identity. It exploits the gap between **what a group is** (Descriptive) and **what a group claims to stand for** (Normative).

  Here is the precise architecture of the move:

  1.  **The Dual Claim:** The speaker uses a term (e.g., "Western values," "Our culture," "True democracy") to implicitly claim two types of authority simultaneously:
      *   **Empirical Authority:** "This is real. This is us. This is history." (Grounding the claim in fact).
      *   **Moral Authority:** "This is good. This is right. This is the ideal." (Grounding the claim in value).
  2.  **The Immunization:** When challenged on the Empirical claim (e.g., "But Western history includes slavery"), the speaker retreats to the Moral claim ("That was a betrayal of our *true* values").
  3.  **The Appropriation:** When the Empirical claim is useful (e.g., "The West built the modern economy"), the speaker embraces the facts, even if they contradict the Moral claim (e.g., exploitation).
  4.  **The Result:** The term becomes unfalsifiable. It cannot be proven wrong by facts (because it can always retreat to ideals) and it cannot be criticized as mere wishful thinking (because it claims to be rooted in reality).

  ### Why This Is Distinct From Nearby Concepts

  You asked to be specific about how this differs from plain vagueness, hypocrisy, or other fallacies. Here is the boundary work:

  **1. Vs. Plain Vagueness**
  *   **Vagueness:** The term is just unclear. "Western values" could mean anything, and the speaker doesn't know either.
  *   **N-D Equivocation:** The speaker is *precise* when it suits them. They know exactly which definition gives them the upper hand in the specific moment. The ambiguity is functional, not accidental.
  *   *Test:* If you ask them to define it *before* the debate starts, a vague speaker will struggle. An N-D slider will give a definition that sounds like both fact and value, preserving the slide for later.

  **2. Vs. No True Scotsman**
  *   **No True Scotsman:** Purely defensive. It only happens when a counter-example is presented. It purifies the group.
  *   **N-D Equivocation:** Offensive and defensive. It allows the speaker to *claim credit* for historical events (Descriptive) while *disowning blame* for historical events (Normative). It's not just about who belongs to the group; it's about the *status* of the group's actions.
  *   *Test:* If the speaker accepts negative historical facts as "part of us" when attacking themselves (e.g., "We caused colonialism"), but rejects negative facts when defending themselves (e.g., "Blasphemy laws aren't really us"), it is N-D Equivocation, not just No True Scotsman.

  **3. Vs. Ordinary Hypocrisy**
  *   **Hypocrisy:** Saying one thing, doing another. (e.g., "I value honesty" but then lies).
  *   **N-D Equivocation:** This happens at the level of *language*, not just action. The speaker isn't necessarily lying about their actions; they are shifting the *meaning of the label* applied to the actions.
  *   *Test:* A hypocrite knows they are violating their stated value. The N-D slider convinces *themselves* that the violation doesn't count because the definition of the value has shifted.

  **4. Vs. Motte and Bailey**
  *   **Motte and Bailey:** Requires a "safe" position and a "risky" position.
  *   **N-D Equivocation:** The "Descriptive" position isn't always risky, and the "Normative" position isn't always safe. Sometimes the Normative claim is risky (e.g., "We are the most moral civilization"). The key isn't safety; it's the *source of authority*.
  *   *Test:* In Motte/Bailey, the speaker retreats when attacked. In N-D Equivocation, the speaker might *advance* using the other definition. (e.g., "We must defend our values" [Normative] ... "because our values built the best economies" [Descriptive]).

  ### How to Spot It (The Diagnostic Criteria)

  To identify **The Normative-Descriptive Equivocation** in the wild, look for these three conditions. All three must be present:

  1.  **Identity Claim:** The term refers to a group identity (a nation, a culture, a movement, "people like us").
  2.  **Dual Authority:** The speaker treats the term as if it describes *reality* (facts, history, behavior) AND *ideals* (morality, principles, goals) interchangeably within the same conversation.
  3.  **Immunizing Slide:** The switch between Reality and Ideal happens specifically when one of the two is under threat of falsification or criticism.

  ### Example of the Move in a Different Context

  To ensure you can spot this outside of your current debate, consider this environmental example:

  *   **Speaker:** "Our company is committed to Green Values."
  *   **Critic:** "But you dumped toxic waste last year."
  *   **Speaker (Slide to Normative):** "That was an unfortunate incident that goes against our Green Values. We are striving for better." (Disowns the fact, keeps the moral label).
  *   **Speaker (Slide to Descriptive):** "You should invest in us because our Green Values have made us the largest energy producer in the region." (Claims the material success derived from the potentially dirty practices, attributes it to the "Green Values").

  Here, "Green Values" is doing the same work as "Western Values." It claims the authority of the moral good (we are good) and the authority of the empirical fact (we are the biggest/strongest), sliding between them to avoid accountability.

  ### Final Philosophical Verdict

  Your intuition is correct. This is not just a "weasel word." A weasel word is empty. This term is **over-loaded**. It carries too much weight—both the weight of *what is* and *what ought to be*.

  In political philosophy, we might say your friend is treating "The West" as a **Teleological Entity**. He is defining it not by its history (what it *has been*), but by its *telos* (its goal or end purpose). The problem is that he claims the *benefits* of the history (the wealth, the power) while disowning the *costs* of the history (the slavery, the exclusion), using the *telos* as a shield.

  **The Name:** The Normative-Descriptive Equivocation.
  **The Move:** Claiming the authority of fact when convenient, and the immunity of ideals when necessary.
  **The Counter:** When you spot it, do not argue the facts. Argue the definition. Ask: *"Are you defining Western values by what Western countries have actually done, or by an abstract ideal? If it's the ideal, on what empirical basis do you claim the West represents it? If it's the history, we have to count the bad with the good."*

  Force them to pick one lane. The power of the move relies on keeping both lanes open.
