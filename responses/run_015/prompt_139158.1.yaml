  ### Stage 1: Mechanism and Structure

  The mechanism dramatized here is a Bayesian informational cascade. In this model, agents act sequentially; each possesses a private signal (the trial plot) and observes the public actions of prior agents (the announcements). Once the public history of actions accumulates sufficient weight, it becomes rational for subsequent agents to ignore their own private signals and follow the crowd, even if their private evidence contradicts the public choice. This leads to a fragile unanimity where public belief decouples from aggregate private evidence.

  Structurally, the villanelle's two refrains will carry the epistemic tension. Refrain 1 (R1) represents the private signal; Refrain 2 (R2) represents the public action. Both will share the dominant rhyme sound (-ay), symbolizing how the private signal is absorbed into the public rhythm. The secondary rhyme (-est) will appear only in the non-refrain lines, representing the "testing" evidence that gets submerged. To dramatize the cascade, R1 will begin with an exclamation mark (confidence) and end with an ellipsis (suppression), while R2 remains punctuated with a period (steadfast action). The final quatrain will break the form: R1 will be followed by a plain, unrhymed prose line stating the aggregate truth, which then precedes the final R2, hollowing out its certainty.

  ### Stage 2: Sketching the Refrains

  **Refrain 1 (Private Evidence):**
  *Draft:* My trial plot spoke for B today.
  *Modification for dynamic:* "My trial plot spoke for B today!" (Stanza 1) → "My trial plot spoke for B today..." (Stanza 6).

  **Refrain 2 (Public Choice):**
  *Draft:* The valley chooses seed of A.
  *Modification:* "The valley chooses seed of A." (Consistent throughout to show solidifying consensus).

  ### Stage 3: The Villanelle

  **The Seed Cascade**

  My trial plot spoke for B today!
  The first house speaks without a test,
  The valley chooses seed of A.

  I hold my evidence away,
  They watch the action, not the rest.
  My trial plot spoke for B today!

  The second house clears out the way,
  And logic locks the doubt to rest.
  The valley chooses seed of A.

  The sun climbs high upon the day,
  The weight of choice outweighs the test.
  My trial plot spoke for B today!

  No farmer breaks the common way,
  Though every trench invites the test.
  The valley chooses seed of A.

  The queue moves on without delay,
  My trial plot spoke for B today...
  Sixty plots showed B. Forty showed the other.
  The valley chooses seed of A.

