  4.  **Refrain Dynamics?** R1 moves from '!' to '...', R2 stays solid.
  5.  **Final Quatrain?** R1, Plain Line, R2. The plain line breaks the rhyme and meter.
  6.  **Ambiguity?** The plain line states the truth but doesn't explicitly solve the counterfactual (would early announcement help?), leaving the fragility evident but the solution open.

