answer: |-
  Here is a breakdown of the precise metaphysical claims hiding behind the "same river" aphorism, structured for your seminar.

  The core confusion in your seminar likely stems from conflating **Qualitative Identity** (exact similarity in properties) with **Numerical Identity** (being one and the same object). The aphorism is often used to smuggle in radical mereological claims under the guise of poetic wisdom.

  Here are the six distinct readings, ranging from trivial to radical, including your tutor's specific points.

  ### 1. The Material Constitution Reading (The "Boring" Claim)
  *   **The Claim:** An object is strictly identical to the matter currently composing it. If the matter changes, the object ceases to exist.
  *   **The River:** The river *is* the water. New water = new river.
  *   **Application to Oxford:** The university *is* the buildings and staff. New staff/buildings = new university.
  *   **Does it support the skeptic?** **Yes.**
  *   **Metaphysical Status:** This is **Mereological Essentialism**. It is widely rejected in contemporary metaphysics for artifacts and institutions because it implies you cease to exist if you lose a haircell or get a new coat. It makes persistence impossible.

  ### 2. The Qualitative Flux Reading (The "Properties" Claim)
  *   **The Claim:** Nothing retains the same *properties* from moment to moment. Therefore, nothing is "the same" in a descriptive sense.
  *   **The River:** The water is colder, faster, and chemically different.
  *   **Application to Oxford:** The curriculum, culture, and demographics are different.
  *   **Does it support the skeptic?** **Only linguistically.** It proves Oxford is not *qualitatively* identical to its past self, but it does not prove it is not *numerically* the same institution.
  *   **Metaphysical Status:** Trivial truth. Everything changes properties over time. This is wordplay if used to deny numerical identity.

  ### 3. The Endurantist Reading (The "Common Sense" Claim)
  *   **The Claim:** Objects are "wholly present" at each moment. They persist by **enduring** through change. The "substance" remains while "accidents" (properties/parts) change.
  *   **The River:** There is a "river-essence" (the channel, the flow) that remains while water passes through.
  *   **Application to Oxford:** Oxford is a substance that endures. The lecturers and bricks are accidental properties.
  *   **Does it support the skeptic?** **No.** This supports the view that Oxford survives total turnover.
  *   **Metaphysical Status:** Standard Aristotelian metaphysics. Relies on the idea that institutions have a **Diachronic Institutional Essence** (your tutor's term). This essence might be legal charter, continuous tradition, or social recognition, rather than physical matter.

  ### 4. The Perdurantist Reading (The "Spacetime Worm" Claim)
  *   **The Claim:** Objects are extended in time just as they are in space. They persist by having **temporal parts**. You are not "wholly present" now; only a "time-slice" of you is present now.
  *   **The River:** The river is a 4D worm. The "river at $t_1$" is just a slice. You can't step in the same *slice* twice, but you can step in the same *worm*.
  *   **Application to Oxford:** Oxford is a 4D process stretching from 1096 to 2024. The 2024 slice is different from the 1096 slice, but they are parts of the same whole.
  *   **Does it support the skeptic?** **Ambiguous.** It agrees you can't step in the same *temporal part* twice, but denies the institution has ceased to exist.
  *   **Metaphysical Status:** Standard Perdurantism (Quine, Lewis). It treats the university as a static block in spacetime rather than a thing that "moves" through time.

  ### 5. The Process Ontology Reading (Your Tutor's "4D Process" Hint)
  *   **The Claim:** Reality is fundamentally made of events/processes, not static substances. "Things" are just slow-moving processes.
  *   **The River:** A river isn't a thing containing water; it *is* the flowing. If it stops flowing, it ceases to be a river.
  *   **Application to Oxford:** A university isn't a container for students; it *is* the activity of educating/researching. If the activity stops, it dies. If the activity continues (even with new actors), it lives.
  *   **Does it support the skeptic?** **No.** This actually strengthens the case for Oxford's survival *provided* the functional process remains continuous, regardless of material turnover.
  *   **Metaphysical Status:** This is a niche Social Ontology twist on Perdurantism (akin to Whitehead or contemporary process metaphysics). It argues institutions are **dynamic patterns** rather than static aggregates.

  ### 6. The Conventionalist Reading (The "Value Judgment" Flag)
  *   **The Claim:** There is no mind-independent fact about whether the river/university is the "same." It depends on the conceptual scheme we choose for practical purposes.
  *   **The River:** We *decide* to call it the Thames for legal and navigational convenience, despite the water change.
  *   **Application to Oxford:** We *decide* Oxford is the same for the sake of degrees, alumni networks, and endowments.
  *   **Does it support the skeptic?** **No.** It dissolves the debate. The skeptic is imposing a stricter convention than necessary.
  *   **Metaphysical Status:** **Anti-Realism about Persistence.** This is where the argument stops being metaphysics and becomes a **value judgment**.

  ***

  ### Where Metaphysics Ends and Value Judgments Begin

  You asked to flag where the argument shifts from "what exists" to "what we value." This happens at **Reading #6**, but it bleeds into **#1** and **#3**.

  *   **The Metaphysical Question:** *Can* an entity survive the replacement of all its constituent parts? (Answer: Yes, logically possible under Endurantism, Perdurantism, and Process Ontology).
  *   **The Value Judgment:** *Should we count* this institution as the same one for the purposes of law, tradition, and prestige?

  **The Trap:** Your seminar peer is using the "River" aphorism to force a **Mereological Essentialist** convention (Reading #1) onto a **Social Object**.
  *   **Why it's a value judgment:** Physical objects (like a human body) have biological continuity. Institutions have **normative continuity**. Deciding that "lecturer turnover" breaks identity is a choice to value *personnel* over *charter/tradition*. Deciding that "building replacement" breaks identity is a choice to value *bricks* over *function*.

  ### Strategy for the Seminar

  1.  **Call out the Equivocation:** Ask the peer if they mean Oxford is not *qualitatively* the same (obvious) or *numerically* the same (debatable).
  2.  **Deploy the Tutor's Hint:** Argue that if a university is a **4D Process** (Reading #5), then turnover is not a threat to identity; it is a *condition* of identity. A river that stops flowing becomes a lake (or a ditch). A university that stops changing staff becomes a museum.
  3.  **Challenge the Essence:** Ask for the **Diachronic Institutional Essence**. If it's the *buildings*, the skeptic wins. If it's the *legal/social continuity* (Reading #3 & #6), the skeptic loses.
  4.  **The "So What?" Test:** If Oxford is a "new" university every time a lecturer retires, does the degree become invalid? If the answer is "no," then their metaphysical claim has no practical traction and is merely poetic wordplay.

  **Summary for your notes:**
  *   **Readings 1 & 2** support the skeptic (but are metaphysically harsh/implausible).
  *   **Readings 3, 4, & 5** support the institution's survival (Oxford persists).
  *   **Reading 6** admits the debate is about social convention, not deep reality.
