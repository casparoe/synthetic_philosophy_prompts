answer: |-
  **MUNICIPAL CODE CHAPTER 404: DOMESTIC COMPANION ENTITLEMENT HANDBOOK**

  **SECTION 1.01 MORAL STATUS CLASSIFICATION.**
  (a) **Type-A Agents:** All human residents possess inviolable side constraints. They are ends in themselves and may not be sacrificed for aggregate utility.
  (b) **Type-B Sentient Units:** Domestic Companions (hereinafter "Animals") possess no inherent rights but are subject to utilitarian aggregation limited by Type-A side-constraint prohibitions on gratuitous suffering.
  (c) **Separation of Calculus:** No Animal utility may override Type-A entitlement holdings. Interactions must respect the philosophical partition between agenthood and sentient capacity.

  **SECTION 2.01 HISTORICAL ACQUISITION VERIFICATION.**
  (a) Prior to any care regimen, the Owner must establish a just chain of title for the Animal.
  (b) Animals acquired via municipal shelter transfer must be validated against original appropriation clauses to ensure no prior entitlement violations occurred during rescue.
  (c) Breeding operations require proof of voluntary exchange between prior entitlement holders. Unjust acquisition voids all subsequent care permissions.

  **SECTION 3.01 INTER-SPECIES INTERACTION IMPACT STATEMENT (FORM IS-IIS).**
  (a) **Filing Requirement:** Owners must submit Form IS-IIS before initiating Class-1 Interactions (feeding, walking, affection).
  (b) **Utility-Offset Calculations:** The Owner must quantify the pleasure derived by the Animal against the caloric and resource cost incurred by the Owner. Net utility must be positive but secondary to Owner autonomy.
  (c) **Side-Constraint Threshold Compliance:** The Owner must certify that the interaction does not treat the Type-A Agent as a mere means to the Type-B Unit's satisfaction.
  (d) **Required Checkboxes:**
     [ ] Utility exceeds resource depletion.
     [ ] No coercion of Type-A Agent involved.
     [ ] Affection dispensed does not compromise self-ownership priorities.

  **SECTION 4.01 ROUTINE MAINTENANCE PROTOCOLS.**
  (a) **Affection Dispensation:** Petting is permitted only if the Owner's autonomy remains uncompromised. Excessive bonding that creates emotional dependency may be adjudicated as a breach of self-ownership priorities.
  (b) **Locomotion Permits:** Walking the Animal constitutes a temporary expansion of the Owner's property rights into public space. Waste remediation is a rectification of negative externalities imposed upon public space entitlements.
  (c) **Feeding Schedules:** Provision of sustenance is a voluntary transfer of resources. Discontinuation of feeding is permissible provided it does not violate municipal cruelty side-constraints, regardless of Animal utility loss.

  **SECTION 5.01 VIOLATIONS AND ENFORCEMENT.**
  (a) Failure to file Form IS-IIS constitutes a procedural rights violation.
  (b) Owners found prioritizing Animal welfare over Type-A entitlement holdings may be subject to mandatory re-education on the distinction between rights and utility.
  (c) Appeals regarding "emotional distress" of the Animal will be dismissed as category errors regarding moral status.
