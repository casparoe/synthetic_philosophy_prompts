      *   *Focus:* Make sure the AI vs. Biologist dynamic is supported by the analysis (AI might lean literal/syntactic, Biologist might lean causal/chemical, or vice versa). Actually, the prompt asks *me* to play the philosopher, not the characters. I will provide the ammo for the debate.

  9.  **Final Review against constraints:**
