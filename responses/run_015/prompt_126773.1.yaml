      *   **Edge Cases:**
          *   *Perfect Predictor:* Becomes Newcomb's Problem. CDT two-boxes (defects), gets nothing. EDT one-boxes (commits), gets prize.
          *   *Legal Enforcement:* The incentive to withhold disappears (or is outweighed by penalty). The problem dissolves into standard prudential calculation.
      *   **Causal Rationalist Attack:** They argue "restructuring decision architecture" is just another causal action. If it doesn't physically prevent the future action (no legal enforcement), it's just a signal. If it *does* prevent it, it's just a causal constraint. The "rational option" of commitment is an illusion; you are just causally influencing the predictor's belief, not your future action's rationality.

