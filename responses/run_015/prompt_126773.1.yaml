          *   *EDT/Structural:* Adopt the Charter. This correlates with Sharing. Sharing correlates with Inclusion. Inclusion + Sharing > Exclusion. Even if Sharing is costly ex-post, the ex-ante value of Inclusion outweighs it.
      *   **The Gap:** Why doesn't it collapse to Newcomb? In Newcomb, the predictor is usually near-perfect and the box is already filled. Here, the predictor looks at *architecture*. The gap persists because the architecture is *noisy*. It's not a logical implication (like Newcomb's perfect predictor), it's a statistical correlation based on observable design. The "bind" is not metaphysical; it's institutional.
