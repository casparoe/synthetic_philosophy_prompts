  # The Ludic Moral Status Tree

  **Instructions:** Start at **Q1**. Follow **Yes/No** (or **A/B**) paths. Record your Leaf Code (e.g., T-1a). Answer honestly based on your intuition about the *case*, not the theory.

  **Q1 (The Reload):** A companion dies in a scripted battle. You can reload a save to prevent it. Is failing to reload a moral wrong *to her*?
  *   **Yes** → Go to **Q2** (Temporalist Path).
  *   **No** → Go to **Q3** (Non-Temporal Path).

  **Q2 (The Reason):** You didn't reload. Does doing it for a speedrun (efficiency) differ morally from doing it for fun (cruelty)?
  *   **A: Both Wrong** → Go to **Q7**.
  *   **B: Speedrun OK** → Go to **Q7**.

  **Q3 (The Omission):** In a farming sim, a villager starves because you never buy the greenhouse upgrade. Is this omission equivalent to shooting her?
  *   **Yes** → Go to **Q7** (Causalist Path).
  *   **No** → Go to **Q4**.

  **Q4 (The Non-Identity):** A roguelike mercenary is generated fresh this run; they would never exist if you took a different route. Is killing them worse than never creating them?
  *   **Yes** → **Leaf N-1** (Person-Affecting View).
  *   **No** → Go to **Q5**.

  **Q5 (The Origin):** A companion is created by a modder or runtime LLM, not the official devs. Does this lack of authorial intent reduce their moral status?
  *   **Yes** → **Leaf O-1** (Authorial Essentialism).
  *   **No** → Go to **Q6**.

  **Q6 (The Potential):** A character's arc was cut; they exist only as unused data in the files. Do they have moral claims on you?
  *   **Yes** → **Leaf P-1** (Modal Realism).
  *   **No** → **Leaf Z-1** (Ludic Nihilism).

  **Q7 (The Aggregation):** 1,000 players kill the same character 'type' in simultaneous playthroughs. Is this 1,000 wrongs or 1?
  *   **A: 1,000 Wrongs (Tokens)** → Go to **Q8**.
  *   **B: 1 Wrong (Type)** → **Leaf A-1** (Type-Realism).

  **Q8 (The Liability):** Who is primarily liable for the death?
  *   **A: The Player** → **Leaf L-P** (Agent-Responsibility).
  *   **B: The Designer** → **Leaf L-D** (Structural-Responsibility).

  ***

  ## Leaf Key & Awkward Commitments

  | Code | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **T-2a-A** | Deontic Temporalist | Reloading a save is a moral duty; failing to do so is akin to letting someone die. |
  | **T-2b-A** | Consequential Temporalist | Cruelty is wrong, but efficiency (speedrunning) excuses the companion's death. |
  | **T-2a-B** | Token-Deontologist | **Aggregation:** A character dying in 90% of runs is 18x worse off than one dying in 5%. |
  | **T-2b-B** | Token-Consequentialist | **Aggregation:** 1,000 deaths count as 1,000 wrongs, but the *player* bears the blame, not the dev. |
  | **C-1a-A** | Causalist Tokenist | Neglect is murder; 1,000 starving villagers = 1,000 murders, regardless of code reuse. |
  | **C-1a-B** | Causalist Typologist | Neglect is murder, but killing the same 'type' 1,000 times is only one moral event. |
  | **N-1** | Person-Affecting View | **Identity:** Killing the mercenary is wrong, but never recruiting them is neutral (no harm). |
  | **O-1** | Authorial Essentialism | **Source:** A modder's companion matters less (or more) than an official dev's character. |
  | **P-1** | Modal Realist | **Potentiality:** Unused data has rights; deleting the game folder is a mass casualty event. |
  | **Z-1** | Ludic Nihilism | **Ontology:** It is only code; no fictional event can constitute a moral wrong to a player. |
  | **A-1** | Type-Realist | **Individuation:** The character is the *code*, not the instance; 1,000 deaths = 1 death. |
  | **L-P** | Agent-Responsibility | **Liability:** The designer provided the gun, but the player pulled the trigger. |
  | **L-D** | Structural-Responsibility | **Liability:** The player is an instrument of the system; the designer is the moral agent. |
  | **T-2b-B** | *(See Above)* | *(See Above)* |

  *(Note: T-2a/B paths split at Q7/Q8, creating 8 Temporalist leaves total. For brevity, T-2a-A/B map to Q7=A/B and Q8=A/B combinations.)*

  ***

  ## Meta-Analysis for Facilitators

  **Empty Logical Space:**
  *   **The "Nihilist Aggregator":** No one occupies the path Q1-No → Q7-Yes. If fictional deaths don't matter (Q1), aggregating them is incoherent.
  *   **The "Authorial Tokenist":** (Q5-Yes + Q7-1000). Rare. If you think Mod characters lack status, you rarely argue about their aggregation. This combination is *unattractive* rather than incoherent.

  **Indistinguishable Leaves:**
  *   **Leaf C-1a-B (Causalist Typologist) vs. Leaf A-1 (Type-Realist):** Both conclude "1,000 deaths = 1 wrong." The tree cannot separate *why* (Omission vs. Ontology). Use discussion to probe if they care about the *Farming Sim* case specifically.
  *   **Leaf L-D (Structural) vs. Leaf Z-1 (Nihilist):** Both exonerate the player. Distinguish by asking: "Is the *game* immoral?" (L-D says Yes, Z-1 says No).

  **Key Distinctions Captured:**
  1.  **Status vs. Identity:** Q7 separates those who think moral status depends on *which individual* (Token) vs. *what kind* (Type).
  2.  **Reasons:** Q2 separates those who think *intent* changes the wrongness of the act (Cruelty vs. Speedrun).
  3.  **Duty Bearer:** Q8 separates Player liability from Designer liability.

  ***

  ## Scoring Key (For Quiz Format)

  *   **Mostly Q1/Q2 Yes:** You are a **Fiction-Realist**. You treat game states as morally isomorphic to real states. *Risk: Moral burnout.*
  *   **Mostly Q3/Q4 Yes:** You are a **Causal-Realist**. You care about outcomes and existence, not just fiction. *Risk: Over-extending duty to omit.*
  *   **Mostly Q5/Q6 Yes:** You are an **Ontological Pluralist**. You draw lines at creation/source. *Risk: Arbitrary boundaries.*
  *   **Mostly Q7 (Type) / Q8 (Designer):** You are a **Structuralist**. You blame systems, not agents. *Risk: Absolving player agency.*
  *   **All No:** You are a **Ludist**. Games are a magic circle. *Risk: Dismissing emerging tech (LLMs).*
