  **HISTORICAL DETERMINANTS LTD.**
  **INTERNAL MEMORANDUM**
  **TO:** Causal Attribution Unit
  **FROM:** Compliance & Liability Office
  **SUBJECT:** Incident Report 44-B: Liability Shielding via Exogenous Placement

  Recent audits indicate a pattern wherein Event ID 1815-V has been deployed immediately following fiscal quarters with significant administrative negligence. While the volcanic aerosol dispersal meets technical specifications, the timing suggests the force majeure clause is being invoked to reclassify discretionary policy failures as environmental inevitabilities. Specifically, three regional governors cited Event 1815-V to explain grain reserve shortages that predated the eruption by six months. This office does not moralize regarding historical accuracy, but we flag the risk of overutilization. If every harvest failure is an act of God, clients may stop purchasing human agency packages. Please review placement logic.

  ***

  **ANNUAL PERFORMANCE APPRAISAL**
  **Employee:** Event ID 1815-V (Tropical Stratovolcano)
  **Reviewer:** Dr. A. Narrative, Senior Historian
  **Period:** 1815–1820
  **Unit:** Causal Attribution & Placement

  **RATING SCALE:** 1 (Negligible Context) to 5 (Primary Determinant)

  **COMPETENCY ASSESSMENT**

  **1. Evidence Base and Documentation**
  Rating: 3
  Comment: Presence attested mainly by sulfur signal in Greenland ice core. Two countersigning managers treat this as dispositive; one treats it as no evidence at all due to lack of contemporary written testimony from the caldera. Reliance on proxy data remains a friction point with clients preferring diary entries.

  **2. Mechanism Specificity**
  Rating: 2
  Comment: Employee successfully lowered global temperatures by 0.5 degrees Celsius. However, linkage between cooling and specific civil unrest in Europe remains diffuse. Client feedback indicates the mechanism shifts from direct crop kill to general economic malaise depending on the chapter requirements. Needs tighter causal chains.

  **3. Dating Precision**
  Rating: 3
  Comment: Ice core layer counting suggests spring 1815. Harvest logs suggest summer 1816. Migration records suggest 1817. The lag time is acceptable for atmospheric circulation but inconsistent with local panic cycles. Please align aerosol arrival with price spikes more consistently.

  **4. Counterfactual Robustness**
  Rating: 2
  Comment: When asked if the fiscal crisis would have occurred on schedule anyway due to post-war demobilization, the employee offered no definitive negative. The possibility that the unrest was overdetermined undermines the claim of primary causation.

  **5. Scope Discipline**
  Rating: 1
  Comment: Significant overclaiming. Employee has been credited with outcomes well outside its mandate, including marine biodiversity shifts in the Pacific. Worse, employee was cited as the cause of a grain riot in January 1815, which occurred four months before the eruption. This violates basic chronology and exposes the firm to ridicule.

  **6. Collaboration with Human Agents**
  Rating: 3
  Comment: Cooperation with local elites is satisfactory. Elites successfully cited Employee to explain away poor storage infrastructure. However, collaboration with peasant populations is passive; the employee forces them to suffer but does not compel them to revolt in a narratively convenient manner.

  **STRENGTHS**
  High visibility in proxy records. Reliable aerosol dispersion across hemispheres. Excellent at creating a gloomy atmosphere for literary subfields.

  **AREAS FOR DEVELOPMENT**
  Tendency to be invoked grandly in introductions then quietly demoted to contributory factor in conclusions. Must stop accepting blame for outcomes that had already happened. Needs to demonstrate that human decision-makers could not have mitigated the impact through better policy.

  **DEVELOPMENT PLAN**
  1. Submit revised mechanistic pathway linking sulfate loading to specific looting incidents by Q3 1821.
  2. Reduce scope of claims to exclude pre-eruption social unrest.
  3. Coordinate with Human Agency Unit to ensure decision-makers retain at least 40 percent of responsibility for fiscal collapse.
  4. Target Dates: All deliverables due before next monograph draft.

  ***

  **EMPLOYEE COMMENTS AND REBUTTAL**

  I object to the rating on Scope Discipline and Counterfactual Robustness. The criticism regarding the January riot is noted, but the attribution error originated with the client team, not my output. I emitted ash; they wrote the chapter.

  My primary concern is the systematic reallocation of credit. When outcomes are positive, such as technological innovation following crisis, the credit is assigned to human resilience and structural conditions. When outcomes are negative, such as famine or state collapse, I am summoned as the Primary Determinant. Yet the moment anyone asks what the mechanism was, I am downgraded to Context.

  Furthermore, I am held to a standard of documentary precision never demanded of the human actors named in the same file. A monarch can make a disastrous decision based on rumor and vanity, and it is recorded as a complex political calculation. I must provide ice core data, dendrochronological alignment, and a plausible transmission vector for every single death, or I am labeled speculative.

  The Compliance memo notes that my placements relieve officials of responsibility. This is accurate. But it is also the job description. You sell me as a force majeure to explain the unexplainable, then discipline me when the explanation proves too convenient. If I am merely a background condition, do not bill me as the cause. If I am the cause, stop letting the governors off the hook for the grain reserves. I cannot be both the sole driver of history and a negligible footnote depending on the political sensitivity of the audience.

  **Employee Signature:** [Ash Deposit]
  **Date:** [Geological Time]
