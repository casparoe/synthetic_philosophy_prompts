answer: |-
  ### Brainstorming the Conceptual Landscape

  The literature on historical causation is currently polarized between two unproductive extremes. On one side, there is the analytic tradition obsessed with counterfactual dependence and necessary conditions (the "Archduke" problem). This approach treats historical events as isolated switches, ignoring the dense web of background conditions that historians actually discuss. On the other side, there is the narrative tradition, which often dissolves causation into storytelling conventions, risking relativism where explanatory power is reduced to rhetorical persuasiveness.

  The genuine upstream philosophical issues lie in the ontology of historical entities and the epistemology of explanatory integration. We lack a clear account of how macro-structures (economies, climates, institutions) relate to micro-events (assassinations, decisions) without falling into reductionism or dualism. This is the problem of scale-heterogeneity. Furthermore, there is a persistent confusion between *ontological sufficiency* (could this cause produce the effect alone?) and *explanatory sufficiency* (does citing this cause satisfy the audience's curiosity?). This confusion stalls progress on overdetermination.

  Repetitive patterns include endless debates about determinism versus contingency, which often talk past each other because "contingency" is used to mean both "causally indeterminate" and "narratively surprising." Another stuck pattern is the reliance on physics-based models of causation (transference, conserved quantities) that fail to capture the constitutive relationships found in social history. To advance, we must move from asking "What caused X?" to "What constitutes a valid multi-causal model of X?" and "How do historians justify combining causes that operate on different logical levels?"

  ### Defended Research Agenda

  For a three-year conceptual dissertation without archival access, your priority must be to build a robust theoretical framework that clarifies how historians *can* legitimately claim multi-causal explanations without logical contradiction. The following agenda is ranked by upstreamness (foundational status), tractability (feasibility for a philosopher), and sensitivity to evidence (conditions under which the priority would shift).

  **1. The Metaphysics of Scale-Heterogeneous Interaction**
  *Rank: 1*
  The most upstream problem is determining whether causes at different scales can genuinely interact or if citing them together is merely a pragmatic convenience. If macro-structures and micro-events are ontologically incommensurable, then "scale-heterogeneous causation" is a category error, and your entire project requires a deflationary reinterpretation. This question is highly tractable for a philosopher because it relies on analyzing existing historiographical practices and general metaphysics of science rather than new historical data. You can examine how historians justify linking, for example, grain prices (systemic) to a specific riot (event). Priority would increase if you find that successful historical explanations consistently rely on cross-scale mechanisms; it would decrease if you demonstrate that all such claims can be reduced to single-scale descriptions without explanatory loss.

  **2. Criteria for Distinguishing Narrative from Causal Necessity**
  *Rank: 2*
  Your distinction between structural and narrative overdetermination is innovative but requires operational criteria. How does a historian signal that a cause is essential for coherence rather than outcome? This is upstream of evaluating specific explanations because without this distinction, we cannot diagnose when an explanation is rhetorically saturated versus causally redundant. It is tractable because it involves analyzing the linguistic and logical structure of historical texts rather than the events themselves. Priority would rise if you identify stable linguistic markers or logical forms that correlate with narrative necessity; it would fall if the distinction proves to be entirely audience-relative with no stable criteria.

  **3. Defining Sufficiency in Open Historical Systems**
  *Rank: 3*
  Structural overdetermination relies on the concept of macro-level sufficiency. However, history is an open system where closed causal laws are rare. Defining what "sufficient" means in this context is crucial for validating your structural overdetermination category. This is slightly less upstream than the first two because it presupposes we know what kinds of entities are interacting (Q1) and why we are citing them (Q2). It is tractable through conceptual analysis of probabilistic causation and INUS conditions adapted for social science. Priority would rise if a formal model of historical sufficiency emerges that handles overdetermination cleanly; it would fall if sufficiency proves to be an irreducibly pragmatic notion dependent on specific research questions.

  ### Deprioritized Questions

  **1. Resolving Specific Historical Causal Disputes (e.g., The Origins of World War I)**
  *Reason for Deprioritization:* This is an empirical historical task, not a philosophical one. As a philosopher without archival access, attempting to settle whether the alliance system or the assassination was the "true" cause traps you in the very necessary-condition framing you wish to move past. It consumes time better spent on conceptual clarification and yields results that are vulnerable to historical revisionism rather than philosophical durability.

  **2. Developing a Universal Logic of Historical Counterfactuals**
  *Reason for Deprioritization:* While related to causation, the literature on counterfactuals is saturated and often diverges from actual historical practice. Historians rarely use formal counterfactual logic; they use implicit comparative cases. Focusing on formalizing counterfactuals risks creating a normative model that historians ignore. Given your goal to understand how historians *actually* build explanations, investigating positive explanatory practices is more fruitful than refining negative counterfactual tests.

