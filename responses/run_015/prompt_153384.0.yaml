prompt: |-
  ok so me and my friend got into it last night over beers about whether armed neutrality is even a coherant concept anymore or if its just nostalgia for small states that want to freeload on everyone else. he kept pointing out sweden dropped neutrality to join nato and finland never really had it, while i was arguing that switzerland's militia system still counts for something. now i want the actual spec, not vibes.

  write the desiderata a theory of armed neutrality has to meet if its going to count as a real defense posture and not just branding. i need the full list — phenomena it must explain, distinctions it cant collapse (like constitutional neutrality vs operational neutrality, conscription vs professional rapid-response, territorial defence vs power projection), cases it has to get right (swiss militia conscription, sweden's post-2010 conscription revival plus nato membership, finland's territorial defence model), and constraints from logistics or international law it cant violate. also inject the civilian-infrastructure overlap problem: reservists work in critical supply chains partly owned by foreign entities, so how does the theory handle mobilizing them without breaking non-belligerency?

  for each desideratum give the motivating case or consideration behind it, and flag which ones are non-negotiable vs just camp preferences. tell me if any subset is jointly unsatisfiable — like maybe strict constitutional neutrality and deep alliance interoperability — and which single requirement knocks out the most popular theories. then briefly score switzerland, sweden, and finland against the list. no bibliographies or citations, im not checking sources, just the reasoning. keep it casual, i probably left a typo or two in here.
