answer: |-
  Alright, let's settle the beer bet. The problem with your debate is that you're arguing past each other because "armed neutrality" is doing too much work. It's being used to describe a legal status, a military strategy, and a political identity all at once. If you want to know if it's a coherent defense posture or just nostalgia, you need a spec sheet.

  Here are the desiderata. If a theory of armed neutrality can't check these boxes, it's just branding.

  ### The Desiderata List

  **1. Credible Denial Capability (The "Porcupine" Clause)**
  *   **Motivation:** Neutrality isn't pacifism. It's the threat of force to maintain non-participation. If you can't make an invasion prohibitively costly, you aren't neutral; you're just uninvited real estate waiting to be occupied.
  *   **Distinction:** Must distinguish *Territorial Defence* (making invasion hard) from *Power Projection* (fighting abroad). Armed neutrality fails if it tries to project power; that looks like alliance behavior.
  *   **Status:** **Non-Negotiable.** Without this, it's not "armed," it's just "neutrality."

  **2. Strategic Autonomy (The "No Saviors" Rule)**
  *   **Motivation:** This is where your friend wins on Sweden. If your defense plan relies on NATO reinforcements or US intelligence to hold the line, you aren't neutral. You are a dependent ally waiting for formalization.
  *   **Distinction:** Must distinguish *Operational Neutrality* (not fighting now) from *Constitutional Neutrality* (legally barred from alliances). You can be operationally neutral while leaning on allies, but that's a temporary posture, not a doctrine.
  *   **Status:** **Non-Negotiable.** This is the core definition. If you outsource security, you outsource neutrality.

  **3. Legal Coherence (The Hague Constraint)**
  *   **Motivation:** International law (specifically Hague Convention V) imposes duties on neutrals. You can't let belligerents use your territory, and you can't supply war materiel unevenly.
  *   **Distinction:** Must distinguish *Political Neutrality* (voting patterns at the UN) from *Legal Neutrality* (rights of belligerents in your airspace/ports).
  *   **Status:** **Non-Negotiable.** Violating this turns you into a co-belligerent in the eyes of the enemy, inviting attack.

  **4. The Mobilization-Infrastructure Paradox (The "Supply Chain" Clause)**
  *   **Motivation:** This is your specific constraint. Modern reservists aren't farmers; they work in logistics, energy, and IT. If 40% of your critical grid maintenance crew are reservists, but the grid is partly owned by foreign entities or relies on foreign software, mobilizing them might trigger contract breaches or foreign sanctions.
  *   **Requirement:** The theory must explain how to seize/control civilian labor and infrastructure for defense without violating trade laws or triggering economic strangulation that counts as an act of war by a third party.
  *   **Status:** **Non-Negotiable.** If your economy collapses the moment you mobilize, your deterrence is a bluff.

  **5. Cost-Sustainability Ratio (The "Freeloader" Check)**
  *   **Motivation:** This addresses your friend's "freeloading" accusation. Armed neutrality is expensive (standing armies, stockpiles). If the cost is lower than alliance membership but the security is the same, it *is* freeloading.
  *   **Requirement:** The theory must justify why the cost of autonomy is higher than the cost of alliance dues, usually via risk mitigation (e.g., "Allies might abandon us").
  *   **Status:** **Camp Preference.** Realists care about this; Idealists care about sovereignty regardless of cost.

  ---

  ### The Tensions & Unsatisfiable Subsets

  Here is where the theory usually breaks.

  **1. The NATO Incompatibility (Strict Constitutional Neutrality + Deep Alliance Interoperability)**
  This subset is **Jointly Unsatisfiable**. You cannot be constitutionally neutral and a member of a collective defense organization. Sweden proved this. They kept the *tools* of armed neutrality (conscription, stockpiles) but dropped the *status* (NATO).
  *   *Why:* NATO Article 5 requires you to treat an attack on one as an attack on all. Neutrality requires you to treat attacks on others as none of your business. These are logically mutually exclusive.

  **2. The Globalization Trap (Economic Integration + Mobilization Viability)**
  This is the **Soft Unsatisfiable** set. In the 1950s, Switzerland could make its own ammo and grow its own food. Today, if your reservists work for a subsidiary of a foreign multinational, and you mobilize them to guard local infrastructure, the parent company can cut off software updates or parts remotely.
  *   *Why:* You can't have total strategic autonomy in a just-in-time global supply chain without severe economic self-harm.

  **The Killer Requirement:**
  **Strategic Autonomy (Desideratum #2).**
  This knocks out the most popular modern theories. Most small states *want* armed neutrality but can't afford the tech or intel independence to make it work. They need US satellite data or NATO air defense integration to survive modern warfare. Once you admit you need that data link to fight, you aren't neutral anymore; you're a node in someone else's network. This is why Sweden folded.

  ---

  ### The Scorecard

  Here is how the three cases stack up against the spec.

  **Switzerland**
  *   **Credible Denial:** **Pass.** Still maintains the militia system, fortified Alps, and mandatory shelter spaces.
  *   **Strategic Autonomy:** **Pass.** Not in NATO or EU. Makes its own decisions.
  *   **Legal Coherence:** **Pass.** Strict interpretation of neutrality, though strained by EU sanctions on Russia recently.
  *   **Mobilization-Infrastructure:** **Warning.** Highly integrated into EU economy. Reservists work in cross-border finance and logistics. Mobilization would cause massive economic friction, potentially violating the "Cost-Sustainability" ratio.
  *   **Verdict:** The only remaining **Coherent** model, but under severe stress from economic interdependence.

  **Sweden**
  *   **Credible Denial:** **Pass.** Revived conscription in 2010, strong domestic defense industry (Saab).
  *   **Strategic Autonomy:** **Fail.** Joined NATO in 2024. Explicitly traded autonomy for guaranteed security.
  *   **Legal Coherence:** **Fail (by definition).** NATO membership voids legal neutrality.
  *   **Verdict:** **Incoherent as Neutrality.** Sweden proved your friend's point: they kept the *armed* part but ditched the *neutrality* part because the former couldn't guarantee the latter anymore.

  **Finland**
  *   **Credible Denial:** **Pass.** Perhaps the best territorial defense in Europe. Massive artillery, conscription, wartime reserves.
  *   **Strategic Autonomy:** **Fail.** Joined NATO.
  *   **Legal Coherence:** **Historical Fail.** Finland was never truly "neutral" in the Cold War (YYA Treaty with USSR constrained them). They were "non-aligned" but heavily influenced.
  *   **Verdict:** **Category Error.** Finland was never a pure armed neutrality case; it was a "Territorial Defense State" that tolerated limited sovereignty to avoid invasion. Now it's a NATO fortress. It doesn't count as a data point for *neutrality*, only for *armed defense*.

  ### The Bottom Line for Your Bet

  Your friend is mostly right, but for the wrong reason. Armed neutrality isn't incoherent conceptually (Switzerland proves it exists), but it is **logistically brittle** in the 21st century.

  The **Mobilization-Infrastructure Paradox** is the real killer. In 1940, you mobilized farmers to shoot rifles. In 2024, you mobilize IT guys to defend cyber grids. If those IT guys rely on Microsoft Azure or AWS (US infrastructure), and you declare neutrality in a US conflict, your defense network could be legally switched off by a foreign corporation.

  Until a theory solves how to mobilize a digital workforce without violating the terms of service of foreign tech giants, armed neutrality is functionally dead for everyone except those with total digital sovereignty (which is basically no one, maybe not even Switzerland).

  **Winner:** Your friend, on the grounds that *sustainable* armed neutrality is no longer viable for integrated economies. You win the consolation prize that Switzerland is still technically doing it, but they are the last dinosaur in the room.
