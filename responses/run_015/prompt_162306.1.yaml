          *   *Better Variant (The "Clone" or "Duplication" case):* Imagine there are 3 potential slots. Coin decides how many are filled. You find yourself in a filled slot.
          *   *User's worry:* "Secretly assumes what it's meant to show."
          *   *Honest Answer:* It risks assuming the "Self-Sampling Assumption" (SSA) vs "Self-Indication Assumption" (SIA). If you treat yourself as a random sample from all *actual* observers, you get 1/3. If you treat yourself as a random sample from all *possible* observers, you might get 1/2.
          *   *Verdict:* It's a strong analogy but requires careful setup to ensure participants don't have indexical knowledge (e.g., "I know I'm Alice, and Alice is only woken on Heads"). They must be anonymous.
          *   *Refinement for the session:* Don't use fixed identities. Use a hat draw *after* the coin toss to decide who goes into the rooms. This mirrors the SB "random awakening" structure.

  5.  **Drafting the Debrief (The Hard Part):**
      *   *Goal:* Map game to theory without jargon initially, then introduce it.
      *   *Key Point 1:* Betting Odds $\neq$ Credence.
