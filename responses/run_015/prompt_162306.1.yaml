answer: |-
  Here is a complete session plan, designed to run the Sleeping Beauty problem as an empirical discovery rather than a lecture. It uses British English spelling and conventions.

  # Session Plan: The Sleeping Beauty Experiment
  **Duration:** 90 minutes
  **Participants:** 14 undergraduates (Maths/Econ/Philos)
  **Goal:** Demonstrate the divergence between betting odds and credence without initial jargon.

  ## 1. Materials List
  *   **Currency:** 200 chocolate buttons (or similar small sweets). Alternatively, a visible points scoreboard.
  *   **The Coin:** One large, clearly fair coin.
  *   **Envelopes:** 14 identical opaque envelopes per round (you'll need about 50 total).
  *   **Slips of Paper:**
      *   Type A: "You are awake. Place a bet on Heads or Tails. Stake: 1 chocolate."
      *   Type B: "You remain asleep. Do not open this envelope until the end."
  *   **Bet Slips:** Small scraps of paper for students to write 'H' or 'T'.
  *   **Collection Box:** A opaque box for collecting bets.
  *   **Whiteboard & Markers.**

  ## 2. Timeline Overview
  *   **00:00 – 00:10:** Introduction & Rules (No theory yet).
  *   **00:10 – 00:50:** Phase 1: The Betting Game (10 Rounds).
  *   **00:50 – 01:10:** Phase 2: The Three Rooms Variant.
  *   **01:10 – 01:30:** Debrief & Theory Mapping.

  ---

  ## 3. Phase 1: The Betting Game (40 mins)
  *Objective: Create a scenario where the profitable strategy mimics the 'Thirder' position (2:1 odds on Tails) without explaining why.*

  **Setup:**
  1.  Arrange the 14 students in a semi-circle.
  2.  Explain the protocol: "We will run 10 rounds. In each round, I will toss a coin. I will then distribute envelopes. Some of you will be 'awake', some 'asleep'. Only the 'awake' students may bet."
  3.  **Crucial Rule:** "If you are 'asleep', you must not speak, gesture, or reveal your envelope content. If you are 'awake', you must not reveal to others that you are awake. Submit your bet secretly into the box."
  4.  **Payoff:** "If you bet correctly, you win 1 chocolate from the bank. If you bet incorrectly, you pay 1 chocolate to the bank. If you are 'asleep', no bet is made."

  **The Mechanism (Facilitator Only):**
  *   **Heads:** Put **1** Type A slip ('Awake') and **13** Type B slips ('Asleep') into the envelopes. Shuffle. Distribute.
  *   **Tails:** Put **2** Type A slips ('Awake') and **12** Type B slips ('Asleep') into the envelopes. Shuffle. Distribute.
  *   *Note:* This simulates the memory wipe. A student might receive an 'Awake' slip in Round 1 (Heads) and another 'Awake' slip in Round 3 (Tails). They do not know how many others are awake.

  **The Run:**
  1.  Run 10 rounds quickly.
  2.  Toss coin. Prepare envelopes. Distribute.
  3.  Give 'Awake' students 30 seconds to write H or T and deposit in the box.
  4.  Collect box. Reveal Coin. Pay out winnings immediately (this reinforces the reward).
  5.  Collect envelopes, reshuffle for next round.

  **The Trap:**
  *   Students who treat the coin as fair ($P=1/2$) will likely bet randomly or stick to Heads/Tails evenly.
  *   Students who bet **Tails every time they are awake** will accumulate chocolate significantly faster.
  *   *Why?* In a 10-round run (expected 5H, 5T):
      *   Heads world: 5 bets placed.
      *   Tails world: 10 bets placed.
      *   If you always bet Tails: You lose 5 chocolates (on Heads rounds) but win 10 chocolates (on Tails rounds). Net +5.
      *   If you always bet Heads: You win 5 chocolates (on Heads rounds) but lose 10 chocolates (on Tails rounds). Net -5.

  **Interim Check:** After 10 rounds, ask: "Who made a profit? What strategy did you use?" Do not explain the math yet. Just note that betting Tails was the winning strategy.

  ---

  ## 4. Phase 2: The Three Rooms Variant (20 mins)
  *Objective: Test if the result holds when removing the 'same person across time' element.*

  **Your Variant & Critique:**
  You proposed: *Three people woken in separate rooms — one room if Heads, two rooms if Tails — asked confidence they are in the 'tails-only room'.*

  **Honest Critique:**
  This variant is intuitively powerful but logically risky.
  1.  **Phrasing Issue:** If Tails lands, two rooms are occupied. Neither is a "tails-only room" in a unique sense. Both are "Tails rooms". The question should be: *"What is your confidence that the coin landed Tails?"*
  2.  **The "Begging the Question" Risk:** This variant relies on the **Self-Indication Assumption (SIA)**. It assumes that because you exist (are awake), you are more likely to be in a world with more observers.
      *   **Halfer Counter:** "I knew *someone* would be woken. The fact that it is *me* gives me no information about the coin, provided I was guaranteed to be in the pool of potential wakers."
      *   **Thirder Counter:** "I am a random sample from the set of *actual* wakers. There are twice as many Tails-wakers."
      *   **Verdict:** It strips out the 'memory wipe' distraction, which is good. However, it replaces a temporal puzzle with a reference-class puzzle. It doesn't prove Thirding; it just moves the debate to 'how do we sample observers?'.

  **How to Run It (Corrected):**
  1.  Select 3 volunteers to sit in separate corners (Room 1, 2, 3).
  2.  Tell the room: "I will toss a coin.
      *   **Heads:** I will place a sign in **Room 1** only.
      *   **Tails:** I will place a sign in **Room 2 and Room 3**."
  3.  The 3 volunteers close their eyes. You place the signs.
  4.  The volunteers open their eyes. If they see a sign, they are 'awake'.
  5.  **Task:** They must write down their credence (0–100%) that the coin is Tails.
  6.  **The Twist:** To make it fair, the 3 volunteers must be chosen **randomly from the group** *after* the coin toss, or they must not know which room number they are assigned until they enter.
      *   *Better:* Keep the 14 students. Tell them: "Imagine you are one of three potential agents. You find yourself in a room with a sign. What is $P(Tails)$?"
      *   *Poll:* Ask the whole group to vote on the probability now that they know the setup.

  **Discussion:** Ask the Maths students to calculate the Bayesian update.
  *   $P(Me | H) = 1/3$ (1 slot available out of 3 potential people? No, 1 slot out of 1 world).
  *   Actually, keep it simple: "There are 3 possible 'sign-experiences'. 1 is Heads, 2 are Tails. You are having an experience. What are the odds?"
  *   This usually pushes people firmly to 2/3.

  ---

  ## 5. The Debrief (20 mins)
  *This is where you prevent the 'money pump' from being misinterpreted as proof of truth.*

  **Step 1: Map the Game to the Theory**
  Draw a tree on the board.
  *   **Root:** Coin Toss (50/50).
  *   **Branches:**
      *   Heads $\rightarrow$ 1 Awakening (Monday).
      *   Tails $\rightarrow$ 2 Awakenings (Monday, Tuesday).
  *   **The Betting Pot:**
      *   "In the game, you were paid per bet, not per coin toss."
      *   "If you bet on Tails, you weren't betting the coin was Tails. You were betting that **this specific awakening** was in a Tails branch."
      *   **Key Phrase:** "Betting odds reflect the *number of times* you get to bet, not just the bias of the coin."

  **Step 2: The Halfer Defence (Crucial)**
  Explain how a Halfer survives the game without changing their mind.
  *   **Halfer Credence:** "I still believe $P(Heads) = 1/2$. The coin is fair."
  *   **Halfer Strategy:** "However, I know that if it is Tails, I get to bet twice. So even though I think it's 50/50, the *expected utility* of betting Tails is higher."
  *   **Analogy:** "Imagine a shop. It rains 50% of days. If it rains, the shop opens 2 hours. If it shines, it opens 1 hour. You earn £10 per hour. Do you hope for rain? Yes. Does that mean you believe $P(Rain) > 50\%$? No. It means the *payoff structure* is skewed."
  *   **Takeaway:** The game proves Tails is the better *bet*, not that Tails is more *likely* in the ontological sense.

  **Step 3: The "Monday is Over" Update**
  Address the moment of agreement.
  *   **Scenario:** Beauty is told "It is Tuesday".
  *   **Halfer:** $P(Heads | Tuesday) = 0$. (Because Heads-Tuesday is impossible).
  *   **Thirder:** $P(Heads | Tuesday) = 0$.
  *   **Point:** "Both camps agree on the update. The disagreement is entirely about the *prior* probability of being in a specific awakening *before* knowing the day."
  *   **Halfer Prior:** $P(Mon \& H) = 1/2$, $P(Mon \& T) = 1/2$, $P(Tue \& T) = 0$ (Wait, Halfer view is tricky here).
      *   *Correction for Board:*
      *   Halfer: $P(H) = 1/2$. Upon waking, no new info. $P(H|Wake) = 1/2$.
      *   Thirder: $P(H) = 1/3$. Upon waking, info is "I am awake".
      *   **The Agreement:** If told "It is Tuesday", both agree $H$ is impossible. This shows the disagreement is about **self-locating belief** (where am I in the timeline?), not logic or math.

  **Step 4: Predictable Failures & Limitations**
  Be honest about what went wrong in the game.
  1.  **Collusion:** "Did anyone peek at how many envelopes were left?" (If so, the ignorance condition was broken).
  2.  **The Fake Wipe:** "You knew you were in a room. Real Beauty doesn't know she's in an experiment."
      *   *What you must say:* "The problem isn't about amnesia. It's about **indexical information**. Knowing 'I am awake now' is different from knowing 'Someone is awake'."
  3.  **What the Game Can't Show:**
      *   The game forces a decision (bet). It cannot measure *belief*.
      *   A student can bet Tails (for profit) while believing Heads is 50%.
      *   **The Philosophical Crux:** "Is probability about the world (the coin), or about the observer (the awakening)? The game favours the observer. The Halfer favours the world."

  ## 6. Contingency Plans
  *   **If everyone bets Heads:** The bank (you) will accumulate all the chocolate. Use this to show: "The bank wins because the bank pays out per awakening. The bank knows the Tails world generates more bills."
  *   **If Maths students dominate:** They will spot the EV (Expected Value) calculation immediately. Ask them: "Does maximising EV force you to change your *credence*, or just your *action*?"
  *   **If Philos students dominate:** They may refuse to bet on semantic grounds. Encourage them to play "as if" to test the payoff.

  ## 7. Closing Statement (Script)
  "We started by trying to make money. We found that acting as if the probability is 1/3 makes money. But does that mean the probability *is* 1/3?
  The Halfers say: 'No, the coin is fair. You just get asked more questions when it's Tails.'
  The Thirders say: 'Yes, because 'probability' is about my perspective, and from my perspective, Tails awakenings are twice as common.'
  The Sleeping Beauty problem isn't a puzzle about coins. It's a puzzle about whether *you* are a random sample of the universe, or a fixed point observing it."

  ---

  ### Facilitator Notes on British English & Tone
  *   Use **"Maths"** not "Math".
  *   Use **"Programme"** if printing handouts.
  *   Use **"Favour"** and **"Centre"**.
  *   Keep the tone collegial. These are undergraduates; avoid talking down, but steer firmly when the betting logic gets confused with ontological probability.
  *   **Chocolate:** Ensure you have enough. If you run out, switch to points on the board immediately to avoid disappointment affecting the debrief mood.
