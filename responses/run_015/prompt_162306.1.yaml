      *   *Key Point 3:* The "Monday is Over" Update.
          *   If Beauty is told "It is Tuesday", both Halfers and Thirders agree $P(H)=0$.
          *   Why? Because H-Tuesday is impossible.
          *   This shows they aren't crazy, they just weigh the indexical information differently.
      *   *Predictable Failures:*
          *   Students might collude (share info).
          *   Students might treat it as "What is the coin bias?" (1/2) rather than "What is my situation?"
          *   The "Memory Wipe" is fake (they know they are in a room). Need to emphasize the *informational* isolation.
      *   *What the game can't show:*
          *   The metaphysical nature of "self".
          *   The difference between $P(T|Awake)$ and $P(T)$.

  6.  **Timeline & Materials:**
      *   90 mins total.
      *   Intro (5).
      *   Phase 1 Game (40).
      *   Phase 2 Variant (20).
      *   Debrief (25).
      *   Materials: Coins, Envelopes, Slips, Chocolate/Points board, Hats.

  7.  **Review against Constraints:**
      *   *British English:* Check spelling (programme, centre, favour, etc.).
      *   *Stakes:* Chocolate/Points.
      *   *No jargon initially:* Keep "Halfer/Thirder" out of the game instructions.
      *   *Phase 2 Critique:* Be honest about the "Three Rooms" logic.
      *   *Debrief:* Concrete mapping.

  8.  **Refining the Phase 2 Variant Logic:**
      *   User's prompt: "one room if heads, two rooms if tails — and each is asked how confident they are that they're in the tails-only room."
      *   *Problem:* If there are two rooms on Tails, neither is "tails-only". They are both "tails rooms".
      *   *Interpretation:* The user likely means "confident that the coin is Tails" (i.e., that they are in a scenario where two rooms are open).
      *   *Critique:* If I am in a room, and I know the protocol (1 room on H, 2 rooms on T), and I was chosen randomly from a pool to fill the rooms...
      *   *Probability:*
          *   Prior: $P(H) = P(T) = 1/2$.
          *   Likelihood of *me* being woken:
              *   If H: 1 slot available.
              *   If T: 2 slots available.
          *   By Bayes: $P(T | Me) \propto P(Me | T)P(T) = 2 \times 0.5 = 1$.
          *   $P(H | Me) \propto P(Me | H)P(H) = 1 \times 0.5 = 0.5$.
          *   Normalised: $P(T|Me) = 2/3$.
      *   *Does it beg the question?* It assumes the "Self-Indication Assumption" (SIA) — that you should reason as if you are a random observer from the set of all *existing* observers. Halfers reject SIA. They use SSA (Self-Sampling Assumption) — you are a random observer from the set of *possible* observers.
      *   *Advice:* Acknowledge this. It shifts the debate from "time" to "reference class". It's useful but doesn't settle the metaphysics.

  9.  **Final Polish:**
      *   Ensure the tone is helpful but rigorous.
      *   Make sure the "Money Pump" aspect is clear in Phase 1.
      *   Ensure the Debrief explains *why* the Halfer isn't irrational for betting Tails.

