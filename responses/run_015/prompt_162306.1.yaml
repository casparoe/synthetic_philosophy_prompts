      *   **Key Constraint 3:** Honest critique of the "Three Rooms" variant. Does it beg the question?
      *   **Key Constraint 4:** Concrete debrief instructions. Map game to theory. Explain why betting odds $\neq$ credence. Explain the "Monday is over" update. Explain predictably wrong moments and what the game *can't* show.
