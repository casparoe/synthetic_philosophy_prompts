      *   *No, they need to bet individually.*
      *   *Okay, here's the robust method:*
          *   14 students.
          *   Round 1: Coin Toss.
          *   If H: 1 student randomly chosen to bet.
          *   If T: 2 students randomly chosen to bet.
          *   *Crucial:* Students do not announce they were chosen. They just get a slip. They don't know how many others got slips.
          *   *Problem:* If I'm chosen, and I see 5 other people submitting bets, I might infer Tails.
          *   *Fix:* Blind submission. Everyone submits a "conditional bet" or we collect slips privately.
          *   *Better Fix:* The "Envelope Method".
          *   Every student gets an envelope at the start.
          *   Coin tossed.
          *   If H: 1 envelope contains a "Bet Slip". 13 contain "Go Home".
          *   If T: 2 envelopes contain "Bet Slip". 12 contain "Go Home".
