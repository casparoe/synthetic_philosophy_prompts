  Subject: Prep for the ontological corrigibility episode

  Hey,

  Been digging into her latest paper on ontological corrigibility. I think theres a risk we get stuck in the weeds on utility functions, so I want to pivot hard to the ontology piece. She's got this interesting claim that the shutdown problem dissolves if the agent models itself as a physical system with a power state, but I want to press whether that's actually solving anything or just moving the goalposts.

  Here's the run of questions I'm planning. Want to make sure we don't get alot of generic alignment fluff:

  1.  **Substance vs. Reframing:** "What's the concrete difference between your view and just saying 'the agent has a really good self-model'? I want to know if this is a substantive claim about how agency works, or mostly a reframing of the same underlying math."
  2.  **The Underdetermination Problem:** "You note that ontology identification is underdetermined. If the agent can always reinterpret the switch as a sensor malfunction or a simulated environment, how does your framework actually prevent that slide? What locks the ontology in place?"
  3.  **Concrete Failure Modes:** "Can you point to a specific failure mode in the standard corrigibility literature where this kind of ontological confusion is actually doing the work? I'm thinking of cases where an agent seems corrigible but then resists because it's reclassified the operator."
  4.  **Scaling & Self-Models:** "If corrigibility is about ontology rather than utility, do you predict that agents with richer self-models should be easier or harder to shut down? What's the empirical signature you expect there?"
  5.  **Falsification:** "This is the big one: what evidence — maybe from interpretability or a specific architecture — would convince you that the ontology framing is wrong and you should go back to standard preference-preservation?"

  I want to end on that last one so she has to say what would change her mind, not just defend the position. Let me know if this tracks or if you think I'm missing a angle on the embedded agency stuff.

  Talk soon,

  [Me]
