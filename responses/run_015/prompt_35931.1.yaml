answer: |-
  Your verdicts sustain a hybrid principle: aggregation is permissible for statistical risks, minor burdens, and threat redirection, but prohibited when targeting identified innocents as means without consent.

  This principle repairs your tentative formulation by replacing "directly taken" with "instrumentalized as a means," which is necessary to reconcile your permissive verdict on the Trolley case with your prohibitive verdict on the Surgeon case. In both scenarios, a specific identified person dies, so the mere fact of identification cannot be the deciding factor; the moral difference lies in whether the death is a side effect of redirecting an existing threat (Trolley) or the intended mechanism of the rescue (Surgeon). If you refuse this distinction, your Trolley verdict must go, as it contradicts the absolute constraint you place on the Surgeon and Sheriff cases. Your Sheriff verdict remains consistent under this repair because framing an innocent uses them as a means to social peace, violating the constraint regardless of the numbers involved, whereas the Transplant Lottery verdict is saved by the consent clause, which transforms the moral status of the harm from instrumentalization to authorized risk-taking.

  Applied to the mining case, this principle mandates the distributed-risk option. Configuring the operation so that one named worker faces certain death treats that identified individual as a sacrificial means to operational efficiency, violating the constraint against instrumentalizing identified innocents. Configuring it so that each of the thousand workers faces a one-in-a-thousand risk renders the death merely statistical and ex ante equitable, falling under the permissible category of aggregated statistical burdens similar to your vaccination verdict. You must therefore accept that the company is morally required to choose the risk distribution, even though the expected number of deaths is identical.
