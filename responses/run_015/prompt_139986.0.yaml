answer: |-
  The rejection email arrived at 03:14, just as Elias was convincing himself that sleep was a necessity.

  *Submission Incorrect,* it read. *Please review the negative space.*

  Elias rubbed his eyes, the glow of the monitor burning into his retinas. He looked at Puzzle 42 again. It was a clean set. Twelve photographs, crisp and high-contrast.

  On the left: six images of ceramic mugs. Every handle was positioned on the right side of the bowl.
  On the right: six images of ceramic mugs. Every handle was positioned on the left.

  It was undeniable. It was geometrically perfect. He had typed: *'Handle orientation relative to the viewer.'* It separated the sets with one hundred per cent accuracy. There was no overlap. No ambiguity. By every metric of the training manual, he was right.

  And yet, the system said he was wrong.

  He opened the Slack channel. The other annotators were asleep, but the client, a bloke named Julian who typed with aggressive precision, was online.

  'Julian,' Elias typed. 'Puzzle 42. I'm stuck. The visual rule is obvious. Handles. Left vs Right. Why is this failing?'

  Three dots bubbled. Then stopped. Then bubbled again.

  'Because that's not the rule,' Julian said.

  'But it fits. Every single one.'

  'It fits the data,' Julian replied. 'It doesn't fit the set.'

  Elias frowned. 'What's the difference?'

  'The difference,' Julian wrote, 'is whether I drew these to match the rule, or whether I found them because they matched the rule.'

  Elias leaned back, the chair creaking in the silence of his flat. He looked at the mugs again. They looked like stock photography. Uniform lighting, identical angles. He had assumed they were staged. He had assumed Julian sat down with a thought—*'Handle Direction'*—and then arranged the props to manifest that thought. In that world, the rule was the father of the image. The image existed to serve the logic.

  'Wait,' Elias typed. 'Did you stage these?'

  'No,' Julian said. 'I emptied my cupboard.'

  The air seemed to leave the room. Elias stared at the pixels.

  'I needed twelve mugs,' Julian continued. 'I grabbed six from the left shelf and six from the right. I photographed them where they sat. Then I asked you to tell me what separates the left shelf from the right.'

  'So the rule is... shelf position?'

  'The rule is *provenance*,' Julian corrected. 'The handle thing? That's just coincidence. I happen to store my mugs handle-out, but the ones on the left were from a set my sister gave me, and the ones on the right were from a charity shop. They happen to face opposite ways. But if I buy a new mug tomorrow and put it on the left shelf, your rule breaks. My rule doesn't.'

  Elias felt a strange, hollow ache in his chest. He had been solving a logic puzzle. He had been looking for the universal law that generated the reality in front of him. He was playing God, reverse-engineering creation.

  But Julian wasn't playing God. He was playing archivist.

  In Julian's world, the images weren't effects of a cause; they were artefacts of a history. The rule wasn't a law of physics; it was a label on a box. Elias had been marking based on *correlation*, assuming *causation*. He'd been treating the pictures as evidence of a design, when they were actually evidence of a habit.

  'So I'm not guessing the pattern,' Elias said slowly. 'I'm guessing your mind.'

  'You're guessing my process,' Julian said. 'Are you solving the geometry, or are you solving the setter? Most people assume I'm a designer. I'm actually just a hoarder with a camera.'

  Elias looked at the twelve mugs. They looked different now. Less like symbols in a syllogism and more like dusty objects pulled from a dark cupboard. The clean line he'd seen—the perfect separation of left and right handles—wasn't a truth. It was an accident. A fragile, temporary accident that would shatter the moment Julian washed up and put a new mug away.

  He had been marking answers wrong for weeks. Not because his logic was flawed, but because his ontology was. He was looking for rules that *made* the world, when half the time he was just looking for rules that *described* the clutter.

  'Sorry,' Elias typed. 'I'll resubmit.'

  'Don't just submit "Shelf",' Julian warned. 'Submit the rule that implies the shelf. Read the setter, Elias. Don't read the ink.'

  Elias closed the ticket. He didn't type 'Handle Orientation'. He typed: *'Grouping by acquisition source.'*

  It felt clumsy. It felt unmathematical. It felt like admitting that the universe wasn't made of clean lines and perfect laws, but of shelves and dust and the arbitrary ways people put things down.

  He hit send. The status flickered to *Approved*.

  Elias turned off the monitor. In the dark, he could still see the mugs, but the handles didn't matter anymore. All that mattered was where they'd been found. He went to the kitchen to make a cup of tea, and when he put the mug down, he paused, wondering if he was placing it on the left or the right, and whether some annotator in the future would try to find a rule in the stain it left behind.
