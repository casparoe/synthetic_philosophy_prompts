answer: |-
  ### Orderings

  **Option 1: Problem-First (Keep)**
  Start with a flawed lede from a recent climate story, diagnose the temporal blindness, introduce Braudel as the corrective lens, and end with the rewrite. This respects the fellows' identity as practitioners who need solutions before theory.

  **Option 2: Theory-First**
  Starting with Braudel's biography and definitions risks alienating reporters who view theory as abstract padding rather than a reporting tool. You will lose the room's trust before you have demonstrated how the framework solves a concrete problem in their copy.

  **Option 3: Tool-First**
  Introducing the ledger before the concept forces them to perform mechanical labor without understanding the strategic value of the output. They will treat the timescale count as a box-checking exercise rather than a fundamental shift in how they perceive causality.

  ***

  ### 1. The Dependency Structure

  Your instinct is correct but incomplete. You must establish **plural causality** before you establish **variable timescales**; if they believe a story has only one cause, the speed of that cause is irrelevant.

  *   **Step 1:** Establish that events are overdetermined (multiple causes exist simultaneously).
  *   **Step 2:** Establish that these causes operate at different speeds (the timescale variance).
  *   **Step 3:** Establish that the news peg systematically selects for the fastest cause (the bias).
  *   **Step 4:** Introduce Braudel's tiers as the vocabulary to reclaim the slower causes for the lead.

  Each later piece borrows the legitimacy of the earlier ones: you cannot argue for a slower lead (Step 4) without proving the news peg is biased (Step 3), which you cannot prove without showing causes have different speeds (Step 2), which implies there is more than one cause (Step 1).

  ### 2. The Carrying Example

  **The Case:** The **Pacific Northwest Heat Dome (June 2021)**.

  *   **The Event:** The specific high-pressure system that stagnated over the region for six days, breaking temperature records and killing hundreds.
  *   **The Conjuncture (Middle):** Urban heat island effects, electrical grid infrastructure designed for 20th-century climate norms, and housing insulation standards that trap heat.
  *   **The Longue Durée:** Jet stream dynamics, the anthropogenic climate baseline shift, and colonial land-use changes altering regional albedo.

  **Critique of Katrina/Dust Bowl:** They are mythologized; fellows arrive with the structural lesson already learned, so the exercise confirms bias rather than revealing blind spots. The Heat Dome is recent enough to be fresh, complex enough to resist simple "climate change caused this" soundbites, and involves infrastructure failures that are often ignored.

  ### 3. Two Devices

  **The Timescale Ledger** is the real work; **The Dateline Fallacy** is the diagnostic label.

  *   **The Ledger:** This is the operational engine. It forces them to quantify causality, turning abstract "structure" into concrete numbers they can defend to an editor.
  *   **The Dateline Fallacy:** This is the conceptual hook. It names the habit they already have (confusing visibility with onset) without shaming them, making them receptive to the Ledger.

  **Placement:** Introduce the Dateline Fallacy at **Minute 5** to diagnose the habit. Deploy the Timescale Ledger at **Minute 35** as the tool to fix the draft during the exercise.

  ### 4. The Misconception Map

  | Misconception | Position in Sequence | Strategy |
  | :--- | :--- | :--- |
  | **Geography is Destiny** | During Definitions (Min 10) | **Pre-empt:** Define *longue durée* as constraint, not determinism; the structure limits options but does not choose the outcome. |
  | **Single Event Attribution** | During Example (Min 20) | **Let Surface:** Allow a fellow to say "climate change caused the heat dome," then use the tiers to show climate changed the *probability*, not the *weather*. |
  | **Structure as Box-out** | During Lead Writing (Min 30) | **Pre-empt:** Explicitly ban the "sidebar" approach; mandate that the structural cause must appear in the nut graf. |
  | **Oldest = Deepest** | During Definitions (Min 10) | **Pre-empt:** Clarify that age does not equal depth; some old causes are superficial, some new causes are structural. |
  | **Structure Dissolves Accountability** | During Q&A/Close (Min 40) | **Let Surface:** This is an emotional blocker; let them voice the fear, then defuse it conceptually. |

  **Conceptual Defuse for Accountability:**
  Do not cite Braudel. Argue instead that structures are not forces of nature but collections of past decisions maintained by present actors; ignoring structure protects those actors by treating their maintenance choices as inevitable background.

  ### 5. The Check

  **The Task:** Have them take a story they filed in the last month and rewrite the nut graf so the slowest-moving cause appears first.

  **Evaluation:** This tests integration, not just vocabulary.
  *   **A Wrong Answer:** A lead that is historically accurate but journalistically dead (e.g., "Since the industrial revolution..." with no news peg). This shows they learned the hierarchy but lost the story.
  *   **A Right Answer:** A lead that contextualizes the news peg within the structural constraint (e.g., "The grid failed yesterday because it was built for a climate that no longer exists"). This shows they can hold both the event and the structure.

  ### 6. What to Refuse

  1.  **Whether structural explanations are causal at all.** (Metaphysical rabbit hole).
  2.  **Adjudicating between schools of historiography.** (Irrelevant to journalism).

  **The Refusal Sentence:**
  "We are not here to settle metaphysical debates about causality or win arguments with historians, but to steal their tools for clearer writing."

  \answer{Your lead is not a timestamp of when the story broke, but a coordinate of where the cause lives.}
