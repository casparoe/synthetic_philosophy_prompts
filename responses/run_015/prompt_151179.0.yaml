  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Welfare State." I need to explain *why* it's fatal. It bypasses the prison mechanism entirely.
      *   *Correction:* Ensure I address the "institutional completeness" definition specifically. Goffman is the touchstone here.
