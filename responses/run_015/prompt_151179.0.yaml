          *   *Fatal:* Network Decay Rates. Longitudinal network analysis showing Norwegian inmates lose ties at similar rates during incarceration. If the "preservation" doesn't happen *inside*, the mechanism is wrong.
          *   *Awkward:* The "High-Capital" Offender. White-collar criminals in US minimum security maintain capital but still recidivate (or don't). If capital preservation doesn't predict desistance for certain groups, the mechanism is limited.
          *   *Concession:* The Necessity of Some Decapitalization. Violent offenders *need* separation. Acknowledging that total normalization isn't possible for all.
          *   *Dismissible:* Sentence Length arguments. The user already preempted this.
      *   *Section 2: The Unfalsifiability Check.*
