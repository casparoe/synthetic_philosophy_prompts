          *   *Tautology Risk:* If "completeness" is defined by the *outcome* (loss of capital), it's circular. It must be defined by *input* (rules, architecture).
          *   *Is it a problem?* For a PhD theory, some flexibility is good, but for causal claims, it needs metrics.
      *   *Section 3: Recommendations for Strengthening.*
          *   Suggest specific metrics (egocentric network maps, visitation logs).
          *   Suggest controlling for the Welfare State.
