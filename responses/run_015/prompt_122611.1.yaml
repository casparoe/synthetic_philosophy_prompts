answer: |-
  **Scenario**
  Elena is a senior project administrator in a mid-sized firm. Over five years, across varying teams, stress levels, and leadership styles, she consistently adheres to expense protocols: never claiming without receipts, never bending categories, always auditing her team's submissions. Colleagues describe her as " scrupulously honest." Self-reports indicate she values integrity above convenience. There are no authority figures monitoring her closely, no emergencies, and no deception. Her behavior shows high cross-situational consistency and predictive validity regarding protocol adherence. However, in the rare subset of cases (approx. 1%) where strict adherence causes manifest unfairness—such as denying reimbursement to a subordinate who lost a receipt through no fault of their own, where the rule's purpose is fraud prevention, not bureaucratic rigidity—Elena denies the claim. She cites the rule explicitly. A practically wise agent would recognize the rule's purpose and authorize an exception to serve justice.

  **1. The Situationist Verdict**
  Judged by situationist standards (e.g., Doris 2002), Elena possesses a robust trait. Situationism denies traits when behavioral variance is high across situational changes. Here, variance is low. Elena's adherence predicts behavior across 99% of sampled situations (different teams, stressors, deadlines). No single situational variable (e.g., "presence of auditor") explains the variance; the disposition is internal and stable. The situationist instruments (behavioral coding, self-report) detect no difference between Elena and a truly virtuous agent in the actual world data. Because the counterfactual failures are statistically rare, they do not disrupt the predictive validity required for trait attribution. The situationist must conclude: Elena has the trait of "Protocol Integrity." (Derivation relies on the statistical definition of robustness).

  **2. The Virtue Ethicist Verdict**
  Using an Aristotelian framework, virtue requires *phronesis* (practical wisdom): acting for the sake of the fine (*to kalon*), understanding the *why* of the action, and hitting the mean relative to us. Elena's mechanism is rule-worship, not wisdom. She treats the protocol as the end, rather than justice as the end and the protocol as a means. In the counterfactual cases (rule vs. fairness), she chooses the rule. This reveals her motive is not the fine itself, but the security of compliance. Since virtue requires the flexibility to adapt principles to particular goods via *phronesis*, and Elena lacks this flexibility in normatively decisive moments, she lacks the virtue. She possesses a "counterfeit conscientiousness"—stable, but normatively brittle. (Derivation relies on the necessity of *phronesis* for virtue status).

  **3. Structural Feature and Collapse**
  The case turns on **Normative vs. Statistical Robustness**. Situationists define robustness frequency-weighted (does it hold in most situations?). Virtue Ethicists define it normatively-weighted (does it hold in situations that matter for *eudaimonia*?).
  *Collapse:* If we make the counterfactual situations frequent (e.g., receipts are often lost), Elena's consistency drops. The Situationist then denies the trait (standard situationist result). If we change Elena's mechanism to understand the rule's purpose (she grants exceptions), her statistical robustness remains high (if exceptions are rare), but she now passes the Virtue Ethicist's test. The distinction collapses if robustness is defined purely statistically (V.E. loses the distinction) or purely normatively (Situationist loses the trait).

  **4. Counter-attacks and Reply**
  *Strongest Objection:* "Robustness is frequency-weighted by definition; rare failures don't negate traits." This attacks the normative weighting directly.
  *Second:* "Situationism concerns trait existence, not virtue status; you've changed the subject."
  *Third:* "Epistemic access: You can't know the mechanism without observing the rare failure, making the distinction empirically useless."
  *Primary Worry:* The frequency-weighted objection. It leverages the situationist's empirical mandate against the virtue ethicist's normative one.
  *Reply:* Virtue concepts are inherently normative, not statistical. A disposition that fails precisely when morality demands flexibility is not a virtue, regardless of frequency. If situationism defines traits statistically, it cannot capture virtue concepts, confirming the virtue ethicist's claim that situationist psychology is insufficient for ethical evaluation. (Note: This reply stipulates the primacy of normative definitions; if the committee rejects this, the case fails).
