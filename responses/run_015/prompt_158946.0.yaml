answer: |-
  ### Part I: Brainstorming H.'s Implicit Rules

  Looking at H.'s track record, there is a clear tension between the "free-riding" cases (3, 4) and the "causal impotence" cases (8, 9). There is also a tension between the "rigid truth" cases (1, 5, 10) and the "social convention" cases (6, 7). To make sense of her verdicts, I need a rule that separates these pairs without contradicting itself. Here are three candidate reconstructions of her methodology.

  **Candidate 1: The "Constitutive vs. Causal" Distinction**
  This rule posits that H. treats some practices as *constitutive* (their meaning depends on universal adherence) and others as *causal* (their harm depends on aggregate physical effects).
  *   *How it works:* Promising (1), Truth-telling (5), and Rational Agency (2, 3, 4) are constitutive. If you universalize non-compliance, the *concept* dissolves or contradicts itself. Buying goods (8) and Driving (9) are causal. Universalizing them causes bad *results*, but the individual act remains conceptually coherent.
  *   *Fit:* Explains why 1 fails but 8 passes. Explains why 3 & 4 fail (duties to rational agency are constitutive).
  *   *Weakness:* Struggles with Case 10. Why can't I constitute a "paternalistic lying" practice? H. says you can't narrow the maxim. This suggests she cares about the *description* of the maxim, not just the practice type.

  **Candidate 2: The "Valid Consent & Deception" Transactionalism**
  This rule posits that H. is primarily testing for violations of autonomy via deception or coercion.
  *   *How it works:* 1 fails (deception invalidates consent). 5 fails (deception violates rational agency). 6 passes (no deception, social code). 7 passes (coercion voids consent). 8 & 9 pass (market transactions are consensual, no deception).
  *   *Fit:* Very strong on 1, 5, 6, 7, 8, 9.
  *   *Weakness:* Fails on 3 & 4. Why is "never developing talents" a violation of consent? There is no other party to deceive. H. calls these "weaker failures," implying they are still failures. This rule can't account for duties to self or imperfect duties where no specific transaction occurs.

  **Candidate 3: The "Policy vs. Act" Description Rule**
  This rule posits that H. looks at the *scope* of the maxim as described by the agent.
  *   *How it works:* If the maxim is a *standing policy* of non-contribution to a necessary end (3, 4, 10), it fails. If the maxim is a *specific act* within a system where the agent admits the general rule but claims causal impotence (8, 9), it passes.
  *   *Fit:* Explains the 3/4 vs 8/9 split perfectly. 3 & 4 are "Never do X." 8 & 9 are "Do X this once because it changes nothing."
  *   *Weakness:* Needs to handle the "collapse clause" in the Target Case. Is "I'll step in if it collapses" a standing policy or a specific act qualification? It looks like Case 10 (qualifying the maxim to avoid contradiction).

  **Candidate 4: The "Normative Exception vs. Physical Threshold" Rule (My Selection)**
  This is a refinement of Candidate 1. H. distinguishes between making a *normative exception* for oneself (forbidden) and acknowledging a *physical threshold* of efficacy (permitted).
  *   *How it works:* In 8 & 9, the agent isn't saying "The rule doesn't apply to me"; they are saying "My action physically cannot trigger the harm." In 1, 3, 4, 5, 10, the agent is trying to carve out a normative exception ("I can lie," "I don't have to help").
  *   *Fit:* Handles the 8/9 vs 3/4 tension. Handles 10 (you can't normatively limit lying to "when it helps"). Handles 7 (gunpoint isn't a normative exception, it's a nullification of the act).
  *   *Commitment:* I will proceed with this reconstruction. H. is a Kantian who permits causal impotence but forbids normative free-riding.

  ***

  ### Part II: The Verdict on Your Maxim

  Based on the "Normative Exception vs. Physical Threshold" reconstruction, H. will rule your maxim **Impermissible**.

  Here is the breakdown of why, mapping your case to her precedents:

  **1. The Category Error: Departmental Life is Constitutive, Not Causal**
  Your maxim attempts to use the logic of Cases 8 and 9 (causal impotence) in a context that belongs to Cases 3 and 4 (constitutive participation).
  *   In 8 and 9, the harm (climate change, labor exploitation) is an aggregate *consequence* of many acts. Your single act is physically negligible.
  *   In departmental life (like promising in Case 1 or beneficence in Case 4), the "harm" is not a physical consequence but a *normative collapse*. The department functions on a norm of reciprocity. If your maxim were universalized ("Everyone does the contractual minimum and free-rides on the rest"), the *norm* of collegiality dissolves. It doesn't matter if the department physically survives; the *practice* of shared governance becomes impossible. H. treats academic citizenship like the practice of promising in Case 1: it cannot survive universal non-keeping of the spirit of the role.

  **2. The "Collapse Clause" is a Case 10 Trick**
  You added the clause: *"If the department ever got to the point where it genuinely couldn't function without me, I'd step in."*
  *   H. explicitly rejected this move in Case 10 ("I'll lie whenever the truth would be devastating"). She ruled that you cannot narrow a maxim to avoid contradiction.
  *   Your clause is an attempt to universalize a *conditional exception*. You are effectively saying, "The rule of contribution applies to everyone else, but I am the reserve variable." In Kantian terms, you are willing yourself as an exception to the law. H.'s rejection of Case 10 shows she has zero tolerance for maxims that include "unless it really matters" clauses to dodge the contradiction. The test is whether the maxim can be a universal law *now*, not whether you have an escape hatch for emergencies.

  **3. "Openness" Does Not Cure the Defect**
  You argue: *"I'm entirely open about it rather than deceiving anyone."*
  *   This relies on Case 6 (polite lies are okay if no one is deceived). However, Case 6 works because the "lie" is understood as a social convention, not a factual claim relied upon for consent.
  *   Your situation is closer to Case 1 (False Promise). In Case 1, even if you were open about your intention to default, the *promise* itself becomes a sham. By accepting the benefits of the department (letters, hiring, reading groups) while withholding the labor that sustains them, you are treating the system as a mere means. Openness doesn't change the fact that you are opting out of the reciprocal norm that justifies your own participation. You are treating the department as a resource to be mined, not a community to be joined.

  **4. The Closest Analog: Case 4 (Beneficence)**
  Case 4 ("Never lifting a finger for anyone in need") is your direct precedent.
  *   In Case 4, the agent might argue, "Others will help, so my help isn't causally necessary." H. rejects this. It is a "weaker failure" (imperfect duty), but it is still a failure.
  *   Your maxim is "Never lifting a finger beyond the contract." This is structurally identical to Case 4. The fact that you call it "contractual minimum" is irrelevant; H. views the "contract" of academic life as including the unwritten norms of reciprocity (Case 1).
  *   The fact that Cases 8 and 9 allow causal impotence does not save you, because those are *consumer* choices with *external* harms. Your choice is a *participatory* choice with *internal* normative effects.

  **Conclusion:** H. says **No**. The maxim fails the universalization test. It is a policy of normative free-riding disguised as causal prudence. The "collapse clause" is an illicit qualification (per Case 10), and the "openness" defense fails because the violation is against reciprocity, not truth-telling (per Case 1 & 4).

  ***

  ### Part III: The Test Maxim

  You asked for a single further maxim to settle which rule H. is really running. The ambiguity lies in whether she truly prioritizes the "Causal Impotence" of 8/9 or the "Normative Consistency" of 3/4 when they overlap. We need a case that is *normatively* structured but *causally* negligible.

  **The Test Maxim:**
  > "I will not vote in departmental elections because my single vote will not alter the outcome, though I accept the election results and will abide by them."

  **Why this settles it:**
  *   **If she says Permissible:** She is prioritizing the logic of **Cases 8 & 9 (Causal Impotence)**. She accepts that if your individual physical/causal contribution to the outcome is negligible, you are excused from participation, even in a normative system. This would suggest your "Departmental Free-Rider" maxim *might* pass if framed as "My one hour of work won't save the department."
  *   **If she says Impermissible:** She is prioritizing the logic of **Cases 3 & 4 (Normative Membership)**. She believes that in constitutive practices (voting, promising, collegiality), the duty is to *participate in the form*, not to guarantee the *outcome*. This confirms my verdict above: your free-riding is impermissible because voting (like committee work) is a duty of membership, not a causal lever.

  **My Prediction:**
  Given her hardness on Case 10 (no narrowing maxims) and Case 4 (duty to contribute), I predict she will call this **Impermissible**. She will argue that universalizing "non-voting based on impotence" destroys the *legitimacy* of the election, even if the *result* is the same. This aligns with her view that the *practice* (Case 1) matters more than the *consequence*.

  If she rules this way, it confirms that your "collapse clause" is dead on arrival. You cannot condition your participation on the efficacy of your contribution. You must participate because it is the form of rational cooperation, regardless of whether your specific input tips the scale.
