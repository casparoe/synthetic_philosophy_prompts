answer: |-
  It seems to me that you press me to choose between two alternatives where no such choice is required. I do not hold that value lies in a state of consciousness considered in isolation from its object, as though the feeling were one thing and the object merely another. When I say the pleasures of human intercourse are good, I imply the existence of other minds truly loved and apprehended. If your machine produces a belief in friends where there are none, it produces a state of consciousness indeed, but one essentially involving false belief. And I must insist that the truth of the existence of its object is a necessary constituent of the greatest goods.

  Therefore, I do not give up either leg of my position. The value is not merely of the consciousness, nor merely of the object, but of the organic whole wherein a consciousness truly apprehends a real object. A world with beauty unperceived has some intrinsic value, I admit, though vastly less than one perceived. Yet if the perception is of a phantasm, the value is diminished again, for reality matters immensely. I cannot admit the machine offers the bargain you suggest, for it leaves out the reality which is essential to the whole.
