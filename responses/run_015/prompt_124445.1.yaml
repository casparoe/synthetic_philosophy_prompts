      *Drafting Paragraph 2:* Assert that the reality of the friend or the beauty is a necessary condition for the *greatest* good. The machine offers a simulacrum. The value is not solely in the feeling, nor solely in the object, but in the true relation. I will not give up the leg that reality matters.

