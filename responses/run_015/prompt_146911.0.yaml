  *Title Idea:* The Residue of Colour. Or *Chromatic Guilt*. Let's go with *The Spectral Readout*.

  *Characters:*
  *   Elias (Conservator)
  *   Miriam (Curator - sharper, more theoretical)
  *   The Painting: *Opus 89* by Darian Vole.

  *Setting:* The Tate Modern (near future wing).

