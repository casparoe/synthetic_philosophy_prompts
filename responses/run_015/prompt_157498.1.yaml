      *   **Purpose:** Practical engineering/evaluation decisions (trust, compute allocation, "I don't know", error diagnosis). *Not* pure semantics, math, or human normative epistemology.
      *   **Specific Cases to Handle:** Warehouse (large store, underived consequence), One-step oversight (obvious miss), Tautology complexity (200 vs 3 vars), Short-proof-hard-theorem (historical difficulty), Certificate gap (reliable but no proof), Inconsistent spreadsheet (explosion problem), Before/After (reading a proof, non-classical rules), Cutoff problem (resource cliffs).
      *   **Specific Suspicions to Address:** Computability/tractability of the ascription, Flat vs. Graded knowledge.
      *   **Core Conflict:** Identify the inconsistent triad (what can't be jointly satisfied).
      *   **Evaluation:** Briefly assess standard moves (impossible worlds, syntactic accounts, implicit/explicit, probabilism) against the criteria.
      *   **Tone:** Precise, technical, pragmatic, philosophical but engineering-focused. No fluff.

  2.  **Deconstruct the Purpose:**
      *   The user wants to *evaluate* a system, not necessarily *be* the system.
      *   The ascription "System S knows P" is a tool for the evaluator to predict S's behavior or judge its output.
      *   Key constraint: "Logical Omniscience" (LO) is the enemy. If the account says S knows everything entailed by its database, the eval harness is useless (Warehouse Case).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Derivational Accessibility (The Warehouse Case).*
          *   Motivation: Just because $P \in DB$ and $DB \vdash Q$ doesn't mean S knows Q.
          *   Why Requirement? If we say S knows Q, we can't diagnose why S didn't output Q. We can't decide to spend compute to find Q.
          *   Status: Non-negotiable for this purpose.

      *   *Requirement 2: Normative Gap (The One-Step Oversight).*
          *   Motivation: S *should* have known (competence failure) vs. S *did* know (state failure).
          *   Why Requirement? Needed for error diagnosis (Case 4). If S misses a mate-in-1, we need to call it a bug/lapse, not "oh well, it wasn't in the closure."
          *   Status: Non-negotiable.

      *   *Requirement 3: Computational Sensitivity (The 200-Var Tautology).*
          *   Motivation: Logical truth $\neq$ Known truth. Complexity matters.
          *   Why Requirement? Needed for "spend more compute" decisions (Case 2).
          *   Status: Non-negotiable.

      *   *Requirement 4: Heuristic/Repertoire Sensitivity (Short-Proof-Hard-Theorem).*
          *   Motivation: Proof length isn't the only barrier. Search space shape and available rules matter.
          *   Why Requirement? To distinguish "hard for everyone" from "hard for this agent."
          *   Status: Non-negotiable.

      *   *Requirement 5: Certificate/Reliability Distinction (Certificate Gap).*
          *   Motivation: Neural nets often get right answers without proofs.
          *   Why Requirement? Trust decisions (Case 1). If it's reliable but unexplained, do we trust? The account needs to distinguish "known via derivation" from "predicted via pattern."
          *   Status: Non-negotiable (for this specific architecture).

      *   *Requirement 6: Paraconsistency/Explosion Control (Inconsistent Spreadsheet).*
          *   Motivation: Real databases have noise. $A \land \neg A \vdash B$ shouldn't mean S knows $B$.
          *   Why Requirement? To avoid false positives in knowledge ascription.
          *   Status: Non-negotiable.

      *   *Requirement 7: Agent-Relative Consequence (Before/After & Non-Classical).*
          *   Motivation: Knowledge changes when proof is read. Also, agent's logic might differ from evaluator's logic.
          *   Why Requirement? To track learning and respect architecture.
          *   Status: Non-negotiable.

      *   *Requirement 8: Continuity/Grading (Cutoff Problem).*
          *   Motivation: Resource bounds create cliffs.
          *   Why Requirement? Smooth compute allocation (Case 2).
          *   Status: *Debatable* (User suspects this might be fake).

      *   *Requirement 9: Tractability of Ascription.*
          *   Motivation: If I can't compute whether S knows P, I can't use the eval harness.
