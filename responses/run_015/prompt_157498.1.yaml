      *   *Probabilism:* Good for grading/cutoffs, bad for "Knows" (factivity) and hard logic constraints.
      *   *Eliminator:* **Evaluator Tractability**. Most philosophical accounts don't care if the evaluator can compute the knowledge state. This harness *must*.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Structure:*
          1.  Desiderata (with Case, Motivation, Status).
          2.  Addressing Suspicions (Computability, Grading).
          3.  The Inconsistent Triad.
