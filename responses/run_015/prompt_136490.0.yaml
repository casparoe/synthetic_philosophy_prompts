  **Office for National Commemoration**
  **Consultation Reference: ONC-2024-LC**
  **Date: 14 October 2024**

  **Consultation on the Implementation of the Commemorative Balance Act 2023: Registration of Designated Lost Causes**

  **1. Overview**

  1.1 The Department invites local authorities, heritage bodies, and devolved administrations to submit expressions of interest for the registration of local historical defeats as **Designated Lost Causes**. This process facilitates the statutory recognition of **Commemorative Equilibrium**, wherein the honour of sacrifice is decoupled from the viability of the objective.

  1.2 Stakeholders will wish to note that the Department does not propose to adjudicate on the moral rectitude of the original conflict. The purpose of the **Commemorative Balance Act** is to manage the legacy of operational failure without implying ideological error. For the avoidance of doubt, a **Designated Lost Cause** must be demonstrably lost, yet simultaneously understood as never having been abandoned.

  **2. Eligibility Criteria**

  2.1 **The Simultaneity Requirement**
  Applicants must demonstrate the capacity to maintain concurrent narratives regarding the outcome of the event. Specifically, the local press and educational materials must concede that the cause is lost while maintaining that it was never abandoned. Applications will be scored on the minimum cognitive strain required to sustain this position within the local demographic. Contradictions identified by external historians will be treated as evidence of nuanced heritage rather than factual error.

  2.2 **The Commemorative Leverage Ratio**
  To qualify, applicants must submit a calculation of the **Commemorative Leverage Ratio**, defined as the number of permanent commemorative infrastructure units (plaques, statues, named thoroughfares) divided by the number of surviving participants recorded at the cessation of hostilities. A higher figure is treated as evidence of a deeper communal need. Ratios exceeding 50:1 will be fast-tracked.

  2.3 **The Dunkirk Provision**
  Events wherein a defeat has been successfully reframed as deliverance are ineligible. Where a tactical retreat is universally acknowledged as a strategic victory, the event will be reclassified as a **Retained Moral Victory** and disqualified from this scheme. The Department seeks only those losses that remain losses, albeit dignified ones.

  2.4 **The Masada Clause**
  In instances where participant mortality approaches 100%, the Department accepts this as conclusive evidence of sincerity. Under the **Masada Clause**, any requirement to show that the cause was ever widely supported by the civilian population is waived. The absence of survivors precludes contradictory testimony, thereby stabilising the narrative.

  2.5 **The Kosovo Field Rule**
  Where the passage of centuries has rendered the factual record unusable, the Department assesses the myth on its present usefulness alone. The Department expressly declines to inquire into what happened. Archaeological evidence contradicting the local tradition will be disregarded as irrelevant to the contemporary social function of the myth.

  2.6 **Retrospective Redesignation**
  Local authorities may apply for the retrospective redesignation of a historical victory as a loss where this would improve community cohesion. The Department acknowledges that certain victories may currently act as barriers to integration. Reclassifying such events as heroic failures allows for a more inclusive commemorative landscape. No justification regarding historical accuracy is required for this provision.

  **3. Assessment Framework**

  3.1 Applications will be assessed against the matrix at Appendix A. Stakeholders should note that maximum points are awarded under the **Obsolescence of Objective** criterion. Causes whose aims no living person would endorse receive the highest scoring, on the stated ground that only such causes can be commemorated without controversy. The Department's highest honour is reserved for defeats whose point has been entirely forgotten.

  **4. How to Respond**

  4.1 Responses should be submitted via the online portal by 31 December 2024. The Department will publish a summary of responses in Spring 2025.

  4.2 For the avoidance of doubt, the Department quietly notes that it will not be publishing its own assessment of which defeats actually occurred.

  ***

  **Appendix A: Scoring Matrix for Designated Lost Causes**

  | Criterion | Weighting | Scoring Guidance |
  | :--- | :--- | :--- |
  | **Narrative Stability** | 30% | High scores for resistance to factual correction over >50 years. |
  | **Commemorative Leverage** | 20% | Points awarded for infrastructure density per survivor. |
  | **Obsolescence of Objective** | 40% | Maximum points where the original goal is legally or morally indefensible today. |
  | **Cohesion Impact** | 10% | Points awarded for successful reclassification of victories as losses. |

  ***

  **Appendix B: Anonymised Worked Assessments**

  **Case 41(B): A Fourteenth-Century Field in the Balkans**
  *Assessment:* The factual record is nonexistent. Local tradition holds that a small force held off an empire to protect a way of life that subsequently vanished. The objective is unclear but likely religious.
  *Outcome:* **Approved.** Under the **Kosovo Field Rule**, the Department declines to inquire into what happened. The obsolescence of the objective ensures zero contemporary controversy.

  **Case 7: A Desert Fortress in the Eastern Mediterranean**
  *Assessment:* Total mortality among defenders. The siege lasted three years. The cause was opposed by the prevailing regional power and later historical consensus.
  *Outcome:* **Approved.** The **Masada Clause** is invoked. The lack of survivors waives the support requirement. The **Commemorative Leverage Ratio** is exceptional (approx. 200:1). The original political aims are sufficiently disconnected from modern policy to permit unconditional honouring of the sacrifice.

  ***

  **Office for National Commemoration**
