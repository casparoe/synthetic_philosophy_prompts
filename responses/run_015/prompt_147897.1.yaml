answer: |-
  You have stumbled onto the central methodological crisis of historiography, but you've done it with the toolkit of a statistician, which is refreshing. Your friend is arguing from a constructivist position (periods are narratives we impose); you are arguing from a realist position (periods are structures we discover). Both are partially right, which is why your tests are conflicting.

  Your four tests are not equal. Tests 1 (Export) and 2 (Clustering) measure **signal strength**. Tests 3 (Delete) and 4 (Acquisition) measure **causal mechanism**.

  The reason your tests disagree is that you are trying to use signal strength to define mechanism. You can have a very loud signal (Clustering) that is merely a cultural echo (the Baroque), and you can have a profound mechanism (Acquisition) that is initially localized (the Industrial Revolution began in one island).

  Here is the principle that resolves your inconsistency, the verdicts you must sacrifice, and the uncomfortable truths it reveals.

  ### The Unifying Principle: The Irreversible Baseline Shift

  **Definition:** A historical period is "real" if and only if it denotes a **phase transition in the constraints and capacities of human action** that is (a) **explanatorily necessary** (Delete Test) and (b) **structurally irreversible** (Acquisition Test).

  **The Logic:** History is not a continuous flow; it is a series of stable states punctuated by rapid reconfigurations. A "Real Period" is either the *transition* itself (a Revolution) or the *new stable state* that follows (an Era), provided that returning to the previous state is functionally impossible.

  **Why this unifies your tests:**
  *   **Tests 3 & 4 are load-bearing.** They define the *reality* of the period. If you can delete the label without losing explanatory power, it's a metaphor. If the change can be reversed, it's a cycle, not a period.
  *   **Tests 1 & 2 are diagnostic.** They tell you how *big* the period is, not if it *exists*. If a Baseline Shift happens only in Europe (failing Export), it is still a real period *for Europe*. If it happens in art but not farming (failing Clustering), it is a **Movement**, not a **Period**.

  ### The Verdicts You Must Sacrifice

  To maintain consistency with the **Irreversible Baseline Shift** principle, you have to make two painful corrections to your list.

  **1. The Middle Ages must go.**
  You suspected this. Under the Acquisition Test (4), the Middle Ages fails. It is defined largely by the *loss* of Roman capacity (centralized bureaucracy, long-distance trade, literacy). While Feudalism was a stable state, it wasn't a new *capacity* that ratcheted history forward; it was a local adaptation to collapse.
  *   *The Fix:* Reclassify "The Middle Ages" as a **Convenience**. It is a bucket for "Europe between Rome and the Renaissance." It fails the Delete Test because "Post-Roman Fragmentation" explains the data better without implying a unified cultural epoch.
  *   *Why this hurts:* It feels like a massive chunk of time is vanishing. But historically, "Medieval Europe" is less a coherent period and more a slow recovery curve.

  **2. The Renaissance must be demoted to "Not Real."**
  You currently have it as "Convenience." It should be "Not Real." It fails the Clustering Test (2). Painting changed drastically; farming, banking, and warfare did not shift in sync until much later. It also fails the Acquisition Test (4); the "humanist" capacity was lost, ignored, or irrelevant in many regions immediately afterward.
  *   *The Fix:* The Renaissance is a **Style**, like the Baroque. It is an art-historical period, not a historical period.
  *   *Why this hurts:* It undermines the narrative of "light returning after darkness." But statistically, the variance in 15th-century data doesn't show a regime shift comparable to the Industrial Revolution.

  **3. Late Antiquity stays.**
  You felt strongly about this, and the principle agrees. Peter Brown's *Late Antiquity* passes the Delete Test (3) brilliantly. Removing the label forces you to say "Rome Fell," which implies a sudden break that the data (archaeology, law, religion) does not support. "Late Antiquity" explains the *continuity* of the transformation. It is a real period because it describes a specific, irreversible reconfiguration of the Mediterranean world (from Civic to Religious authority).

  ### Applying the Principle to New Cases

  Here is what the **Irreversible Baseline Shift** principle dictates for your new list. I have included one "Hate Answer"—a verdict that is logically sound but intuitively repulsive.

  *   **The Anthropocene:** **Real.** It passes Acquisition (human activity becomes a geological force) and Clustering (atmosphere, biology, geology). It is irreversible on human timescales.
  *   **The Neolithic Revolution:** **Real.** The ultimate Acquisition Test. Once agriculture starts, population density makes returning to foraging impossible. It is a basal shift.
  *   **The Bronze Age Collapse:** **Not Real (Event, not Period).** This is a singular shock, a "crash," not a "period." The period *following* it (the Greek Dark Ages) might be real, but the collapse itself is a data point, not a duration.
  *   **The Cold War:** **Real.** This is the **Hate Answer**. It feels like politics, not history. But it passes the Baseline Shift test. It created a global structural constraint (nuclear deterrence, bipolar alliance systems) that dictated war, economics, and science for 45 years. Removing the label "Cold War" makes explaining decolonization, the Space Race, and proxy conflicts significantly harder (Delete Test). When it ended, the baseline of global interaction shifted irreversibly.
  *   **The Information Age:** **Real.** Acquisition of digital processing and networked communication. Irreversible.

  **The "Hate Answer" Explanation:**
  You likely hate classifying **The Cold War** as a historical period on par with the **Neolithic Revolution**. One feels like geology; the other feels like a temporary political standoff. But the principle doesn't care about your emotional resonance; it cares about structural constraints. For anyone born between 1950 and 1989, the Cold War was as fundamental a constraint on reality as the feudal system was to a serf. Swallowing this means admitting that *political structures* can be as historically "real" as *technological ones*.

  ### Future Historians and Subject Specificity

  **What will survive 200 years from now?**
  Historians will keep labels that denote **Infrastructural Constraints**.
  *   *Survivors:* The Industrial Revolution, The Anthropocene, The Digital Revolution. (These changed *how* things are done).
  *   *Discarded:* Postmodernity, The Age of Revolutions, The Enlightenment. (These describe *what people thought* about what was done).
  *   *Prediction:* "The Carbon Age" will replace "The Industrial Revolution." "The Algorithmic Era" will replace "The Information Age." Labels that describe the *fuel* or the *logic* survive; labels that describe the *mood* die.

  **Can a period be real for one subject and not another?**
  Yes, but you must change the noun.
  *   If the Baseline Shift is cross-domain (War, Farming, Art), it is a **Period** (e.g., Industrial Revolution).
  *   If the Baseline Shift is single-domain (Art only), it is a **Movement** (e.g., Baroque, Romanticism).
  *   *The Trap:* This concession does *not* collapse into "nothing is real." It simply creates a taxonomy. A Movement is real *as a Movement*. It is a category error to call it a Period. Your friend was right that historians cook up "Ages," but you were right that some "Ages" reflect actual structural breaks.

  ### Summary of the Resolution

  Your conflict arose because you were treating **Test 1 (Export)** as a validity condition. It is not. History is not a synchronized global clock. A regime shift in England is real even if China is in a different phase.

  **Your Revised Protocol:**
  1.  **Apply Test 4 (Acquisition) first.** Is there a ratchet? If no, it's a Cycle or a Style.
  2.  **Apply Test 3 (Delete) second.** Does the label explain causality? If no, it's a Label.
  3.  **Apply Test 2 (Clustering) third.** If yes, it's a **Period**. If no, it's a **Movement**.
  4.  **Ignore Test 1 (Export).** Scope does not determine reality.

  If you apply this, you win the argument with your friend, but you lose the Middle Ages. That is the price of consistency.
