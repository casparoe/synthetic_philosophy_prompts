prompt: |-
  Write a dialogue between Maya, an expressivist about moral language, and Leo, a moral realist, about whether the Frege-Geach problem actually sinks non-cognitivism. Don't let them just recycle the usual "if lying is wrong then getting your brother to lie is wrong" example—push them into disjunctive moral reasoning, like arguing "either capital punishment is wrong or it's okay to kill innocent people in edge cases" and then rejecting the second horn. Maya should defend that an expressivist can reject a horn just by refusing to adopt the practical stance it expresses, without treating it as false. Leo should push back that rejecting a horn still requires a belief-like attitude that the horn doesn't hold, which collapses back into cognitivism. Make sure they actually respond—Maya shouldn't just cite Blackburn, and Leo shouldn't call her a strawman. Keep it casual, and maybe have a typo like "Geachh" or "your" instead of "you're" in there somewhere.
