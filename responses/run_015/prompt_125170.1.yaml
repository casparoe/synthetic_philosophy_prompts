answer: |-
  **Leo:** Look, I get the appeal. Saying moral talk is just about vibes and plans avoids all those messy metaphysical commitments. But you can't dodge the Frege-Geachh problem forever. It's not just about conditionals anymore. It's about how you handle complex reasoning.

  **Maya:** I'm not dodging it. I just think you guys assume logic only works on truth-apt stuff. But I can reason with plans just fine.

  **Leo:** Can you? Let's try a disjunction. Say I argue: "Either capital punishment is wrong, or it's okay to kill innocent people in edge cases." You want to conclude capital punishment is wrong, right?

  **Maya:** Obviously.

  **Leo:** So you reject the second horn. You say, "No, it is not okay to kill innocent people." In a realist framework, you're saying that proposition is false. It doesn't match the moral facts. But for you, "It's okay to kill innocents" expresses a permission—a practical stance. How do you reject it without saying it's false?

  **Maya:** I don't need to say it's false. I just refuse to adopt the stance. When I encounter that second horn, I'm not checking it against a moral reality and finding it lacking. I'm just saying, "I won't coordinate my actions with that permission." I disapprove of holding that approval.

  **Leo:** But look, your missing the structural point. To run the disjunctive syllogism, you have to eliminate the second option. If you just say, "I personally won't adopt this stance," that's a psychological report about Maya. It doesn't rule out the option logically. For the argument to work, you have to treat that horn as *unacceptable* in a way that binds the reasoning.

  **Maya:** Unacceptable doesn't mean false. Think of it like consistency in planning. If I plan to avoid killing innocents, I can't simultaneously plan to permit it in edge cases. The "elimination" isn't truth-functional; it's a clash of commitments. I reject the horn because accepting it would wreck my practical identity.

  **Leo:** But why does it wreck it? There has to be a reason you prioritize the "no killing innocents" plan over the "edge cases" plan. That reason implies you think the first plan is *correct* and the second is *incorrect*. You're making a judgment about the relationship between those stances.

  **Maya:** I'm making a higher-order attitude. I have a negative attitude toward having the positive attitude toward killing innocents. It's attitudes all the way down, Leo. No beliefs required.

  **Leo:** Except that higher-order attitude is functioning exactly like a belief. You're saying, "The stance permitting killing is incompatible with the stance forbidding it." That incompatibility looks an awful lot like a contradiction in truth conditions. If you're relying on logical incompatibility to reject the horn, you're smuggling in cognitivism. You're treating the stance as if it has a property—'unacceptability'—that you're detecting.

  **Maya:** I'm not detecting a property. I'm feeling a tension. Like if I plan to be in New York tomorrow and plan to be in London tomorrow. I don't need to believe "Being in two places is false." I just know I can't execute both plans. Rejecting the horn is just dropping the plan I can't live with.

  **Leo:** But in the disjunction, you aren't just dropping a plan for yourself. You're saying the horn *doesn't hold*. If I asked you, "Is it okay to kill innocents in edge cases?" you wouldn't say, "I don't plan to think that." You'd say, "No, it's not." That "No" is doing heavy lifting. It's asserting a negative fact about the permission.

  **Maya:** It's asserting a negative *commitment*. I'm telling you where I stand so we can coordinate. If I treat the second horn as something I can't accept, I'm not describing the world; I'm drawing a boundary around my agency.

  **Leo:** But logic requires that the boundary holds regardless of your agency. If the argument is valid, it's valid for everyone. If your rejection is just about your refusal to adopt a stance, then the argument only works for people who share your refusal. That makes moral logic contingent on psychology.

  **Maya:** Or it makes moral logic about what it means to be a practical agent at all. Maybe some refusals are universal because of what we are, not because of what's out there.

  **Leo:** That sounds like you're defining a human nature fact. Which is... well, that's a belief again.

  **Maya:** *sips coffee* You're stubborn.

  **Leo:** And your avoiding the implication. If you need universal constraints on stance-adoption to solve Frege-Geach, you've basically reinvented truth.

  **Maya:** Maybe. Or maybe I've just shown that logic is bigger than truth.
