answer: |-
  Everyone knows Thomson's lamp: toggle infinitely fast, arrive at two minutes, is it on or off? Benacerraf says "undefined". I prefer the ln-2 lamp. Same supertask, wired to a dimmer. Flick one adds 1, two subtracts a half, three adds a third... alternating harmonic series. Converges to ln 2. Thomson said we can't attach sense to a lamp being "half-on", but this one is contentedly 69% on.

  Here's the rub: the series is conditionally convergent. Rearrange the terms, you change the sum. Two electricians install the same lamp. One wires positives first, the other interleaves them. Lamp A settles at 0.69. Lamp B settles at 1.5. Neither violated physics. It's the only metaphysical puzzle where the truth value depends on the electrician's playlist.

