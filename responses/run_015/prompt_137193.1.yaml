    "setup": "Everyone knows Thomson's lamp: toggle infinitely fast, arrive at two minutes, is it on or off? Benacerraf says \"undefined\". I prefer the ln-2 lamp. Same supertask, wired to a dimmer. Flick one adds 1, two subtracts a half, three adds a third... alternating harmonic series. Converges to ln 2. Thomson said we can't attach sense to a lamp being \"half-on\", but this one is contentedly 69% on.",
    "punchline": "It's the only metaphysical puzzle where the truth value depends on the electrician's playlist.",
    "premise_it_turns_on": "The Riemann Series Theorem regarding conditionally convergent series allowing rearrangement to alter sums.",
    "who_laughs": "Philosophy students familiar with supertasks and analysis; general audiences will miss the maths.",
