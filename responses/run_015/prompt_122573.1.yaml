prompt: |-
  I work as a backend dev at a small company — no philosophy background, this is just stuff I've been reading about on my own — and we inherited this nightmare of a nightly cron job that nobody understands. It was written about four years ago by a guy who left, it generates a report nobody has opened in years, and deleting it would make my on-call life a lot easier. Every time I bring it up my teammate shuts the conversation down with "don't tear down a fence until you know why it was put up" (the thing people online call Chesterton's fence). What drives me crazy is that I think I can honestly say two things at once: first, we actually could dig up why it was originally put up, from the git history and the guy's old design notes; second, that original reason is basically dead, but we're now fairly sure the job is load-bearing for a completely different reason — some other service reads a table it happens to write as a side effect, which nobody ever designed on purpose. So on my read of the slogan its own test is nearly satisfied, and my teammate still thinks it says "leave it alone forever."

  So please take that one sentence apart for me. What are the different precise claims it could be making, from the completely trivial to the actually radical? The ones I've half-formed on my own are something like: a procedural "go gather information before you act" thing, which nobody would disagree with; a claim about original intent, i.e. that things get made for reasons and you should recover those reasons; a stronger claim about invisible current function, where the fence is holding up something now that it was never designed to hold up, so even knowing the original reason isn't enough; a Burkean-sounding thing where institutions contain accumulated trial-and-error knowledge that no individual can reconstruct in an afternoon, maybe not even articulate; a cost-asymmetry point, that wrongly removing something is irreversible and spreads its damage around while keeping it is cheap and reversible; and a flat presumption against any change, where the status quo wins by default. Some of those feel like the same idea at different strengths and some feel like totally different ideas wearing the same sentence. Where does each one land — platitude, sensible and substantive, speculative, or just false — and what does each one commit me to if I accept it?

  Three more specific things I'd want on the menu, because they're what my actual argument keeps turning on. (1) Does "know why it was put up" mean the historical reason someone had at the time, or does it mean I need a working model of what the thing is holding up right now? Those come apart badly in my case, since the historical reason is knowable and worthless while the current one is what matters and is partly unknowable. (2) Does the principle get weaker when the fence is young and was put up by someone no wiser than me — or does it not care at all how the fence got there? My teammate talks as if age itself is evidence the thing earned its place, but I can't tell whether that's inside the slogan or a separate idea people bolt onto it. (3) Does the reverse version follow from the same logic — "don't put up a fence until you know what it will break"? If both hold, it kind of looks like the real principle is just "don't touch complex systems you don't fully understand," which would tell me to do nothing ever, including nothing about the cron job, and that can't be right. Finally, and this is the part I actually want to bring back to work: for each reading, tell me whether it would really support my teammate's conclusion that I have to leave the job running, and if the honest answer is that most of them only buy him "do some investigation first," say what a reasonable stopping point would look like — how would I know when I've understood it enough? A list I can argue from would be perfect.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Backend developer at a small company. Pragmatic, technical, no formal philosophy background but intellectually curious.
      *   **Context:** Inherited a legacy nightly cron job (technical debt). It generates an unused report. Deleting it would help on-call life.
      *   **Conflict:** Teammate uses "Chesterton's Fence" to block deletion.
      *   **User's Analysis:** The user has already done significant analysis. They know the *original* reason (git history/notes) is dead. They suspect a *new*, emergent reason (side effects used by another service).
      *   **The Ask:** Deconstruct the slogan "Don't tear down a fence until you know why it was put up."
          *   Identify precise claims (trivial to radical).
          *   Evaluate each claim (platitude, sensible, speculative, false).
          *   Identify commitments for each.
          *   Address three specific sub-questions (Historical vs. Current Reason, Age/Wisdom of Builder, Reverse Principle/Paralysis).
          *   Provide actionable advice/stopping points for the workplace situation.

  2.  **Deconstruct Chesterton's Fence (The Core Task):**
      *   *Source:* G.K. Chesterton, *The Thing* (1929).
      *   *Original Context:* Reform vs. Tradition. Not specifically about code, but about social institutions.
      *   *The User's Breakdown:* The user has already identified several interpretations (Procedural, Original Intent, Invisible Function, Burkean Knowledge, Cost Asymmetry, Status Quo Presumption). I need to validate, refine, and categorize these.

      *   *Drafting the Interpretations:*
          1.  **Procedural Epistemology:** "Look before you leap." (Platitude/Sensible). Commitment: Do research.
          2.  **Intentionalism:** "Respect the designer's intent." (Speculative/Weak in code). Commitment: Find the ticket/issue.
          3.  **Functionalism (The "Side Effect" view):** "Understand the current causal role." (Sensible/Strong). Commitment: Map dependencies.
          4.  **Burkean Epistemology:** "Tradition contains latent wisdom." (Radical/Speculative in code). Commitment: Assume you are too dumb to understand it.
          5.  **Risk Asymmetry:** "Deletion cost > Retention cost." (Sensible/Economic). Commitment: Calculate blast radius.
          6.  **Status Quo Bias:** "Never change." (False/Caricature). Commitment: Paralysis.

  3.  **Address the Three Specific Questions:**
      *   *(1) Historical vs. Current Reason:* Chesterton implies *function*, not just *intent*. In code, intent rots, function remains. The teammate is conflating "why it was put up" (history) with "what it is doing" (function).
      *   *(2) Age/Wisdom:* Chesterton assumes tradition accumulates wisdom. In software, "old" often means "rotten." The "Lindy Effect" applies differently to code than to laws. Old code isn't necessarily wiser; it's just older.
      *   *(3) The Reverse/Paralysis:* If you can't build without knowing breakage, and can't delete without knowing purpose, you freeze. The principle is about *reform*, not *stasis*. It's a heuristic for *safe* change, not *no* change.

  4.  **Develop the "Stopping Point" / Actionable Advice:**
      *   The teammate says "Leave it." The user says "Investigate then delete."
      *   What constitutes "Knowing"?
      *   *Strategies:* Feature flags, canarying, observability (logs/metrics), shadow mode.
      *   *The "Enough" Criteria:* When the cost of knowing > cost of risk, or when risk is mitigated by other means.

  5.  **Structure and Tone:**
      *   **Tone:** Respectful, analytical, precise, slightly technical (matching the user). Avoid academic jargon where possible, but don't dumb it down.
      *   **Structure:**
          1.  Introduction (Validating the user's insight).
          2.  The Spectrum of Claims (The Menu).
          3.  Addressing the Three Specific Questions.
          4.  The Workplace Strategy (Stopping Points).
          5.  Conclusion.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to just say "Teammate is wrong." The teammate is applying a heuristic, just perhaps the wrong *version* of it.
      *   *Nuance:* In software, "latent wisdom" (Burkean) is often just "undocumented coupling." Distinguish between social institutions (which evolve via human behavior) and code (which evolves via commits).
      *   *Emphasis:* Highlight that Chesterton was talking about *reformers*, not *maintainers*. The user is a maintainer.
      *   *Key Insight:* The user's specific situation (side effects) actually *validates* Chesterton's deeper point (invisible function) while invalidating the teammate's surface-level application (don't touch).

  7.  **Final Polish:** Check against the prompt requirements.
