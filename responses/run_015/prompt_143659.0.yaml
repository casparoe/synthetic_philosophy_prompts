answer: |-
  Here is a complete lesson plan designed for your constraints. It maximizes the epistemic lesson within 75 minutes, handles the probability risks, and separates informational from reputational incentives without bloating the activity.

  ### **1. Materials & Setup**

  *   **Deck of Cards:** Remove Jokers. You need 24 Red cards (Hearts/Diamonds) and 24 Black cards (Spades/Clubs). *Why cards?* They are easier to shuffle and "draw" quickly than balls from a bag, and "Red/Black" is conceptually cleaner than "Bag A/Bag B."
  *   **The "State" Envelope:** Prepare one envelope labeled **STATE OF THE WORLD**. Inside, put a slip of paper saying **RED** or **BLACK**. Flip a coin before class to decide which. This determines the "Truth."
  *   **Signal Cards:** Shuffle the 48 cards (24R, 24B). This creates a deck where $P(\text{Red}|\text{State=Red}) = 0.5$. *Wait, this is wrong.*
      *   *Correction for Independence:* To simulate the standard model (i.i.d. signals with $p > 0.5$), you cannot deal from a single fixed deck without replacement, as the odds shift.
      *   *Better Method:* Use **two** decks.
          *   **Deck Red:** 32 Red, 16 Black ($2/3$ Red).
          *   **Deck Black:** 32 Black, 16 Red ($2/3$ Black).
      *   *Procedure:* If the State is **RED**, you use **Deck Red** for all draws. If **BLACK**, use **Deck Black**. You must shuffle the deck thoroughly between *every* student's draw to maintain independence (or have them draw, show you, you return it, you shuffle).
      *   *Practical Shortcut:* To save time, prepare 24 small envelopes. If State is Red, put 2 Red slips and 1 Black slip in each of the 24 envelopes. If State is Black, reverse. Students pick an envelope, look inside, close it, pass it on. This guarantees independence and speed.
  *   **Student Cards:** 24 Index cards per student (or one sheet divided into 3 sections). Columns: **Round 1 (Private)**, **Round 2 (Public)**, **Round 3 (Public)**. Rows: **Guess (R/B)**, **Confidence (0-100%)**.
  *   **Expert Envelopes:** 4 distinct envelopes. Inside: "You are an EXPERT. Look at 3 signals instead of 1. Do not tell anyone." Distribute these randomly as students enter.
  *   **Whiteboard:** Divide into three sections: **Round 1 Tally**, **Round 2 History**, **Round 3 History**.

  ### **2. Probabilities & Expectations**

  *   **Signal Accuracy:** $2/3$ ($\approx 67\%$).
  *   **Cascade Threshold:** In the standard model, a cascade begins when the difference between public choices reaches 2 (e.g., two more Reds than Blacks).
  *   **Probability of Wrong Cascade:** With $p=2/3$, the probability that a sequential chain locks into the *wrong* answer is approximately **25-30%** per run.
  *   **How many rounds?** To have an 80% chance of witnessing at least one *wrong* cascade, you need **5 runs**. You do not have time for 5 runs.
  *   **The Fix:** Run **1 Simultaneous** round and **2 Sequential** rounds.
      *   *If you get a Wrong Cascade:* Perfect. Use it.
      *   *If you get a Right Cascade:* This is the contingency. The lesson shifts from "The group is wrong" to "The group is right *for the wrong reasons*." You will show that private information was still discarded. (See Debrief Section).
  *   **Expert Power:** An expert with 3 signals has effective accuracy of $\approx 74\%$. However, if the public cascade has a "weight" of 5+ votes (e.g., 10 Red, 5 Black), the public history outweighs the expert's 3 private signals. They will rationally ignore their expertise.

  ### **3. The Script & Rules (75 Minutes)**

  **0:00 – 0:10: Introduction & Rules (Crucial)**
  *   **Say:** "We are doing three decision exercises. In all of them, there is a True State: Red or Black. I have determined this by coin flip. Your goal is to match the True State."
  *   **Say:** "You will receive a private signal. It is correct 2 out of 3 times. It is noisy. You are rational agents maximizing accuracy."
  *   **Say:** "Rule 1: When it is your turn, announce **only** your Guess (Red/Black) and your Confidence (0-100%). Do **not** say what you saw. Do **not** explain why. If you say 'I saw Black but...', you ruin the experiment for everyone."
  *   **Say:** "Rule 2: There is no reward for being unique. There is no penalty for agreeing. You are paid in 'epistemic points' for being correct." (This neutralizes reputational herding incentives).
  *   **Say:** "Four of you have been given special instructions in envelopes. Do not reveal if you are one of them."

  **0:10 – 0:25: Round 1 (Simultaneous / Aggregation)**
  *   **Action:** Distribute signals (envelopes). Students look privately.
  *   **Action:** Everyone writes Guess + Confidence on index card. Collect them all in a box.
  *   **Action:** While you tally, ask: "How many feel >90% confident?" (Expect few).
  *   **Reveal:** Tally the votes on the board. Announce the True State.
  *   **Point:** Usually, the majority wins here. This establishes the baseline: *Private info aggregates well when independent.*

  **0:25 – 0:45: Round 2 (Sequential / The Cascade)**
  *   **Action:** Pre-assign an order (1 to 24). Write numbers on the board.
  *   **Action:** Student 1 looks at signal, announces "Red, 70%." Write on board.
  *   **Action:** Student 2 looks, announces.
  *   **Action:** Student 3+ looks, hears history, announces.
  *   **Constraint:** If a student hesitates or says "Well, everyone else said...", stop them. "Just your guess and confidence."
  *   **Contingency:** If the cascade locks early (e.g., by student 6 everyone is saying Red), point out to the class: "Notice everyone is saying the same thing. Continue."
  *   **Reveal:** Announce True State.
  *   **Drama Check:** If they got it wrong, highlight the confidence. If they got it right, move immediately to the reveal of private cards (see Debrief).

  **0:45 – 1:00: Round 3 (Sequential + Experts)**
  *   **Action:** Same as Round 2, but reshuffle order. Ensure at least one "Expert" is in the second half (positions 15-24).
  *   **Action:** Experts draw 3 signals. They must aggregate their *own* private info first (e.g., 2 Red, 1 Black = Private Lean Red) then weigh against public history.
  *   **Goal:** We want the Expert to follow the crowd despite holding strong contrary private evidence.
  *   **Reveal:** Announce True State.

  **1:00 – 1:15: The Debrief (The "Nasty" Lesson)**
  *   **Step 1: The Reveal.** Have everyone hold up their private signal cards (or read from your collection).
  *   **Step 2: The Count.** Count how many private signals actually pointed to the Truth vs. the Public Guess.
      *   *Scenario A (Wrong Cascade):* "The group guessed Red. The Truth was Black. Look at the private cards: 18 of you saw Black. 24 people's evidence was thrown away because the first two people got unlucky."
      *   *Scenario B (Right Cascade):* "The group guessed Red. The Truth was Red. But look at the private cards: 10 of you saw Black. You ignored your own eyes. If the first two people had swapped signals, you would all be confidently wrong. You didn't find the truth; you lucked into it."
  *   **Step 3: Confidence.** "In Round 1, confidence was ~70%. In Round 3, the last people were 95% confident. Why? You weren't more informed; you were just echoing."
  *   **Step 4: Experts.** Ask the Experts: "Did anyone ignore their 3 cards?" If yes: "Your expertise was worthless because you were too late in the queue."
  *   **Step 5: Reputational vs. Informational.** Ask: "Who followed the crowd because you thought they knew something? Who followed because you didn't want to be the outlier?"
      *   *Instruction:* "If you did the second, that is *reputational* herding. If you did the first, that is *informational* herding. Today was designed to be purely informational. There was no penalty for being the outlier. Yet you still followed. That means the logic of the information itself forced you to conform."
  *   **Step 6: The Label.** "This phenomenon has a name: **Informational Cascade**."

  ### **4. Troubleshooting Predictable Failures**

  | Problem | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Signal Leaking** | Student says "I saw Black but..." | **Interruption:** Stop them immediately. "Stop. Just say 'Black'. If you explain, you turn this into a discussion, not a cascade." Collect their card and move on. |
  | **Contrarians (Econ)** | Student guesses opposite to break the game. | **Pre-empt:** "There is no bonus for breaking the cascade. If you guess against the crowd and are wrong, you lose accuracy points. Rationality dictates following the weight of evidence." |
  | **Quiet Students** | Student freezes or refuses to speak. | **Pre-assign Order:** Tell them their number at the start. If they freeze, offer a pass, but note: "If you pass, you contribute zero information, which accelerates the cascade." |
  | **Instructor Face** | You smile when they get it right. | **Poker Face:** Wear sunglasses or stare at the whiteboard. If you react, you become a signal source. |
  | **No Cascade Forms** | Signals are mixed (R, B, R, B...) | **Pivot:** "The cascade didn't lock. Why? The private evidence was too strong to ignore. This shows cascades are fragile. But notice: you still spent 20 minutes doing what 1 person could have done." |
  | **Correct Cascade** | They cascade to the right answer. | **Reveal Private:** Show that 30% of the room had the *wrong* private signal but voted *right*. "You were right, but you stopped thinking. That is the danger." |

  ### **5. Limitations: What to Stop Them From Concluding**

  Students will want to generalize this to everything. You must bracket the conclusion.

  **Allow them to conclude:**
  1.  **Rationality $\neq$ Truth:** It can be individually rational to ignore your own evidence.
  2.  **Fragility:** Social outcomes depend disproportionately on early movers (path dependence).
  3.  **Information Waste:** Adding more people to a cascade does not add more information.

  **Stop them from concluding:**
  1.  **"People are sheep."**
      *   *Reason:* Emphasize this was *rational* Bayesian updating, not blind conformity. They did the math (intuitively) correctly.
  2.  **"This explains stock bubbles/Twitter pile-ons."**
      *   *Reason:* Real markets have prices (which aggregate info) and networks (not a single queue). In real life, you can choose *who* to listen to. This model assumes a forced order.
  3.  **"Experts should always speak first."**
      *   *Reason:* While true in this model, in reality, we don't know who the experts are. If we let people self-identify as experts, we invite lying (cheap talk).
  4.  **"Private signals are independent."**
      *   *Reason:* In real life, we often read the same news source. If signals are correlated, cascades happen much faster. This game assumed independence, which is a *generous* assumption that usually prevents herding. If signals were correlated, the disaster would be worse.

  ### **6. Recommendation on Reputational Herding**

  **Do not add a reputational round.**
  *   **Reason:** You have 75 minutes. Adding a voting mechanism ("Who was the best guesser?") changes the payoff structure from *Truth* to *Status*. This confuses the epistemic lesson. Students will spend the debrief arguing about fairness rather than information flow.
  *   **Alternative:** Use the debrief question ("Did you do it to look smart or to be right?"). This separates the mechanisms conceptually without requiring game mechanics. If 50% of the room admits they worried about looking dumb, you have empirically proven reputational herding exists *alongside* the informational cascade you just demonstrated.

  ### **7. Final Prep Checklist**

  1.  **Envelopes:** 24 signal envelopes (pre-loaded based on coin flip), 4 Expert envelopes.
  2.  **Board:** Drawn with columns for Round 1, 2, 3.
  3.  **Index Cards:** Pre-printed with "Guess: R / B" and "Confidence: ___%".
  4.  **Timer:** Keep the rounds moving. If Round 2 drags, cut the discussion. The *reveal* is the most important minute of the class.
  5.  **Mindset:** Be prepared for the "Right Cascade." It is less dramatic but epistemically just as damning (private info was still discarded).

  This design forces them to live through the logic of the cascade. They will feel the frustration of the Experts and the false confidence of the followers. That feeling is the anchor for the theory you introduce in the final 10 minutes.
