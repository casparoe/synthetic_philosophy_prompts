          *   Identify predictable misconceptions (discipline, anti-democratic, future self = future generation) and when to intercept them.
          *   Create a closing question that tests grasp of limits, not surface structure.
          *   Specify what to *leave out* explicitly.
          *   **Injected Framing:** Constitutional entrenchment often functions not to bind future majorities (Ulysses) but to shield present choices from transient future majorities ("Reverse Ulysses" / Non-identity of generations). This must be woven in without distorting the basics.
          *   **Output Format:** Teaching Plan + JSON Summary.

  2.  **Deconstruct the Core Philosophical/Legal Problem:**
      *   *Ulysses Contract:* Agent A (Time 1) binds Agent A (Time 2) to protect A's own long-term interest against A's own temporary weakness. Identity is preserved (it's the same person).
      *   *Constitutional Entrenchment:* Generation 1 (Time 1) binds Generation 2 (Time 2). Identity is *not* preserved (different people, different democratic mandates).
      *   *The Collapse:* The analogy fails because the "self" in the individual case is continuous, whereas the "self" in the constitutional case (the People) is discontinuous.
      *   *The Injected Framing:* It's not just about binding the future; it's about the *present* protecting itself from the *future's* transience. This highlights the non-identity problem.

  3.  **Drafting the Teaching Sequence (90 Minutes):**

      *   *Phase 1: Foundation (0-15 mins).* Need to secure the concept of "Agency over Time." Before comparing constitutions to Ulysses, students must understand what it means for *one person* to bind *themselves*.
      *   *Phase 2: The Carrying Example (15-45 mins).* Need a scenario that works for both.
          *   *Idea:* A Diabetic vs. A Sugar Tax.
          *   *Individual:* Diabetic locks away insulin/sugar (Ulysses).
          *   *Constitutional:* A Constitution entrenches a specific economic right or environmental clause.
          *   *Better Idea:* Let's use something more structural. A "Self-Binding Will" vs. "Entrenched Clause."
          *   *Selected Scenario:* **The Smoker's Pact vs. The Entrenched Bill of Rights.**
          *   *Wait, let's refine for the "Reverse Ulysses" framing.* The prompt suggests shielding present choices from transient future majorities.
          *   *Revised Scenario:* **The Addiction Recovery Plan (Individual) vs. The "Economic Stability Clause" (Constitutional).**
          *   *Let's try to make it tighter.* **The "Locked Box" Scenario.**
          *   *Individual:* I lock my credit card in a timed safe to prevent binge spending tonight.
          *   *Constitutional:* The Constitution locks a specific fiscal rule (e.g., balanced budget) requiring a supermajority to change.
          *   *Why this works:* It highlights the "binding" mechanism clearly.
      *   *Phase 3: The Collapse & Injected Framing (45-75 mins).* This is where the "Future Self" analogy breaks.
          *   Individual: Same brain, same interests (mostly).
          *   Constitutional: Different people, different values.
          *   Injected Framing: The Constitution isn't just stopping the future from making mistakes (Ulysses); it's stopping the future from undoing *our* specific settlement because *we* don't trust *them* to value what *we* value (Non-identity).
      *   *Phase 4: Closing (75-90 mins).* Q&A and the specific understanding check.

  4.  **Developing the Misconceptions:**
      1.  *Precommitment = Discipline.* (Early stage). Intervention: Distinguish external constraint from internal willpower.
      2.  *Rigidity = Anti-Democratic.* (Middle stage). Intervention: Distinguish between "binding the people" vs. "binding the procedure."
      3.  *Future Gen = Future Self.* (Late stage/Collapse point). Intervention: The Non-Identity Problem.

  5.  **Refining the Injected Framing ("Reverse Ulysses"):**
      *   Standard Ulysses: I bind myself to save *me* from *me*.
      *   Reverse/Non-Identity: We bind *you* to save *us* from *you*. Or rather, we establish a structure that survives *you* because *you* are not *us*.
      *   This needs to be introduced when discussing *why* the analogy breaks. The "Future Self" assumes continuity of interest. The "Future Generation" assumes discontinuity.

  6.  **Determining Omissions:**
      *   Don't dive into specific metaphysical theories of personal identity (Locke, Parfit). Too philosophical.
      *   Don't analyze specific case law (e.g., *Basic Structure Doctrine*) in depth. Keep it conceptual.
      *   Don't solve the problem (is it legitimate?). Just identify the tension.

  7.  **Drafting the Closing Question:**
      *   Needs to test the limit.
      *   *Draft:* "Is a constitution a Ulysses contract?" (Too simple).
      *   *Better:* "If the next generation votes unanimously to repeal an entrenched clause, is the Ulysses analogy still valid?"
