    "omissions": "Metaphysical theories of personal identity (Locke/Parfit) and the normative legitimacy of the 'Dead Hand' control (whether entrenchment is morally justified).",
    "injected_framing": "Constitutional entrenchment functions not primarily to bind future majorities for their own good (the standard Ulysses move), but to shield present constitutional choices from being undone by transient future majorities—a 'Reverse Ulysses' dynamic driven by the non-identity of democratic generations."
  }
