answer: |-
  # Teaching Plan: The Limits of the Ulysses Analogy in Constitutional Law

  **Session Duration:** 90 Minutes
  **Target Audience:** Final-year Law Students (Constitutional Law background, No Philosophy of Agency background)
  **Core Objective:** To move students from viewing constitutional entrenchment as a simple "Ulysses Pact" to understanding the *non-identity problem* that causes the analogy to collapse, specifically highlighting how entrenchment shields present choices from future majorities.

  ---

  ## I. Conceptual Distinction: Continuity vs. Succession (00:00 – 00:15)
  **Goal:** Secure the prerequisite concept of *Agency Continuity* before introducing the constitutional analogy.
  **Activity:** Socratic dialogue on the "Self."
  1.  Ask: "If I promise to diet tomorrow, and I break that promise tomorrow, who broke the promise?"
  2.  Guide them to see that in the individual case, the promisor and the breaker are legally and biologically the *same entity*. The conflict is intra-personal (Time 1 Self vs. Time 2 Self).
  3.  **Crucial Distinction:** Establish that Ulysses contracts rely on **Continuity of Agency** (one will persisting through time).
  4.  Contrast this immediately with **Succession of Agency** (one will replacing another). Ask: "If I sign a treaty, does it bind my successor?"
  5.  **Outcome:** Students must grasp that "The People" in Year 1 and "The People" in Year 50 are not the same agent in the same way an individual is. This is the bedrock for the later collapse.

  ## II. The Carrying Example: The "Locked Safe" vs. The "Fiscal Lock" (00:15 – 00:45)
  **Goal:** Use a single parallel scenario to map the analogy before breaking it.
  **Scenario:**
  *   **Individual (Ulysses):** A recovering alcoholic gives their house keys to a neighbor with instructions: "Do not return these keys before 6 PM, no matter how much I beg." This is a **precommitment device** against a predictable weakness.
  *   **Constitutional (Entrenchment):** A Constitution includes a "Balanced Budget Clause" that requires an 80% supermajority to amend, effectively preventing a simple majority from running a deficit. This is an **entrenchment clause** against predictable legislative impulses.

  **Sequence:**
  1.  **Map the Structure (15 mins):** Identify the parallel mechanics.
      *   Restriction of future optionality? Yes.
      *   Protection against transient impulse? Yes.
      *   Higher threshold to undo? Yes (Neighbor's refusal / 80% vote).
  2.  **Intercept Misconception 1 (Discipline):** Students will argue the alcoholic just needs "willpower."
      *   *Intervention:* Clarify that Ulysses contracts are *external* constraints precisely because internal willpower is acknowledged as insufficient. The law functions as the "neighbor," not the conscience.
  3.  **Intercept Misconception 2 (Anti-Democratic):** Students will argue the Fiscal Lock is undemocratic.
      *   *Intervention:* Distinguish between *outcomes* (no deficit) and *procedures* (80% vote). It is not anti-democratic to require a broader consensus for specific changes; it is a re-calibration of the democratic threshold, not a removal of it.

  ## III. The Collapse & Injected Framing (00:45 – 01:15)
  **Goal:** Reveal where the analogy fails and introduce the "Reverse Ulysses" framing.
  **The Pivot:** Ask: "Why does the alcoholic want the keys withheld?" (To protect *his own* long-term health). "Why does the Constitution lock the budget?"
  1.  **The Break Point:** In the individual case, Time 1 and Time 2 share the *same ultimate interests* (health/sobriety). In the constitutional case, Generation 1 and Generation 2 may have *conflicting legitimate interests*.
  2.  **Intercept Misconception 3 (Future Self):** Students will assume the "Polity" is a single immortal being.
      *   *Intervention:* Introduce the **Non-Identity Problem**. The voters in 50 years are different people with different social contracts. They are not the "Future Self" of the founders; they are successors.
  3.  **Injecting the Framing (Reverse Ulysses):**
      *   Explain that standard Ulysses theory says: "I bind the future to save the future from itself."
      *   Propose the **Reverse/Shielding View**: "We bind the future to save *our* settlement from *their* transience."
      *   Apply to Example: The Balanced Budget Clause isn't necessarily protecting future generations from debt (Ulysses); it may be protecting the *current* economic ideology from being voted away by a future generation facing a crisis who *want* debt.
      *   **Key Insight:** Entrenchment functions less as a gift to the future (protection) and more as a shield for the present (persistence).

  ## IV. Closing Understanding Check (01:15 – 01:30)
  **Goal:** Test grasp of the analogy's limits.
  **Activity:** Silent reflection followed by a single written response.
  **The Question:**
  > "In the alcoholic scenario, if the alcoholic begs for the keys at 5 PM, the neighbor is right to refuse because the alcoholic's *own* long-term interest is sobriety. In the Constitutional scenario, if a future generation demands the repeal of the Balanced Budget Clause to fund a war for survival, does the entrenchment serve *their* interest or the *founders'* interest? How does your answer determine whether the Ulysses analogy holds?"

  **Debrief:** Collect answers. The correct grasp is recognizing that if it serves the *founders'* interest against the *future's* will, the Ulysses analogy (which presumes shared interest) has collapsed.

  ## V. Explicit Omissions
  **Goal:** Manage scope and acknowledge boundaries.
  **Statement to Class:**
  "We are explicitly omitting two things today. First, we are not solving the **metaphysical problem of personal identity** (whether you are literally the same person as your future self); we are treating it as a legal fiction for the sake of the analogy. Second, we are not adjudicating the **normative legitimacy** of entrenchment (whether it *ought* to be allowed); we are analyzing the structural logic of how it functions. We leave the 'Dead Hand' moral debate for Jurisprudence."

  ---

