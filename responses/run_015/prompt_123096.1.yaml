prompt: |-
  I'm preparing a ninety-minute session for a reading group of final-year law students who have studied constitutional amendment rules but have no background in philosophy of agency. I want them to understand Ulysses contracts and constitutional precommitment not as a straightforward analogy but as a comparison that collapses at a precise point. Plan the teaching sequence: the conceptual distinction that must be secured first before the comparison is even intelligible; the single concrete scenario that should carry the whole session, pairing an individual commitment device with a constitutional entrenchment clause and making visible exactly where the personal 'future self' analogy fails; the misconceptions they will predictably form, in the order they will arise — including that precommitment is merely discipline, that constitutional rigidity is inherently anti-democratic, and that future democratic generations are simply the polity's 'future self' — together with the exact point in the sequence where each should be intercepted; a closing question that reveals whether they have grasped the analogy's limits rather than just its surface structure; and what should be explicitly left out at this level, with an open acknowledgement of that omission. I am deliberately injecting a non-obvious framing: that constitutional entrenchment often functions not to bind future majorities (the Ulysses move) but to shield present constitutional choices from being undone by transient future majorities — a kind of 'reverse Ulysses' problem tied to the non-identity of democratic generations — and I want this woven into the sequence without distorting the basic idea. After presenting the plan, summarise it in a JSON object with the following fields: 'dependency_chain' (ordered array of prerequisite ideas), 'carrying_example' (object with keys 'scenario' and 'analogy_break'), 'misconceptions' (array of objects with keys 'misconception', 'stage', 'intervention'), 'understanding_check', 'omissions', and 'injected_framing' (string describing the reverse-Ulysses/non-identity twist).
