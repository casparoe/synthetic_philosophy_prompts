prompt: |-
  hey — I run the training for new fact-checkers at a small newsroom, and I've got a 90-minute session next week where I want to put the reductionism versus anti-reductionism argument about testimony in front of them. No philosophy background, and they will show up thinking the question is how much we should trust sources, with the professional instinct that verifying everything yourself is the ideal. I dont need you to explain the debate to me, I know it — I need a plan for getting it into their heads in 90 minutes.

  What I want from you:

  - the order the pieces have to go in and what depends on what. My guess is they need to feel the pull of the local version before the global version will mean anything to them, but tell me if I've got that backwards.
  - one case to carry the whole session. I want a source with no track record — a single anonymous tipster, or a one-off document you cant corroborate — and I want you to say what that case has to have and what it has to lack. Also why not the obvious newspaper case, and why not something where the source does have a track record.
  - the misconceptions, and exactly where in the sequence to kill each one. The ones I expect: that reductionism is just the distrustful view; that anti-reductionism means taking peoples word for anything; that the whole dispute is an empirical question about how reliable people happen to be; and that if reductionism is right then checking every claim is mandatory. Tell me which ones I've missed.
  - where the local/global distinction, the default-justification middle position, and the argument from how anybody actually learns things from other people fit. They're going to want a verdict at the end and I'd like them to see that the verdict matters less for practice than they assume — but I dont want to just announce that, so tell me how to build it into the sequence.
  - one wrinkle I'm stuck on: a lot of what they check now is machine-generated or machine-summarised. Is that a case of testimony at all, and do I handle it in the session or leave it out? Say which and why.
  - what to openly refuse to cover at this level.
  - two cases for the end: one where a reductionist and a presumptivist would do the same thing for different reasons, one where they'd actually diverge in practice. If they can say which is which, they've got it.

  Also two of them will keep reaching for trust-but-verify and the extraordinary claims slogan as ways of closing the discussion down. Where do those belong, if anywhere?
reasoning: |-
  Here's a thinking process that leads to the suggested training plan:

  1.  **Analyze the Request:**
      *   **User:** Trainer for new fact-checkers at a small newsroom.
      *   **Task:** Design a 90-minute session on the Reductionism vs. Anti-Reductionism (Presumptivism) debate regarding testimony.
      *   **Audience:** No philosophy background. Professional instinct is "verify everything yourself." Think the issue is just "how much to trust sources."
      *   **Constraints:**
          *   Order of pieces (dependencies).
          *   One core case (anonymous/one-off, no track record). Explain why this case, why not others.
          *   Address specific misconceptions (and identify missing ones) at specific points in the sequence.
          *   Integrate Local/Global distinction, Default-Justification, and the "Learning Argument."
          *   Build the "verdict matters less than assumed" conclusion into the sequence (don't just announce it).
          *   Handle the "Machine-Generated Content" wrinkle (include or exclude?).
          *   Specify what to *refuse* to cover.
          *   Two end cases (convergence vs. divergence).
          *   Handle the "Trust-but-verify" and "Extraordinary claims" slogans.

  2.  **Deconstruct the Philosophy (Mental Check):**
      *   *Reductionism (Humean):* Testimony is not a basic source of justification. It reduces to perception, memory, and induction. We need positive reasons to trust a specific testimony.
      *   *Anti-Reductionism (Presumptivism/Reidian):* Testimony is a basic source. We are entitled to believe unless there are defeaters. "Innocent until proven guilty."
      *   *Global vs. Local:* Global = all testimony needs reduction (or none). Local = depends on the context/type of testimony.
      *   *The "Learning Argument":* If reductionism were strictly true globally, children couldn't learn language or facts because they lack the inductive base to verify the testimony needed to build that base.
      *   *Practical Implication:* In newsrooms, strict reductionism is impossible (time/resources). Strict anti-reductionism is dangerous (propaganda). The middle ground is usually where professionals live, but understanding the *tension* helps calibrate.

  3.  **Drafting the Plan - Section by Section:**

      *   **Order of Pieces:** The user suspects Local before Global. I agree. Global is too abstract. Start with a specific instinct (trust this specific tip?), then zoom out to the principle.
      *   **The Core Case:** Needs to be high stakes, low corroboration.
          *   *Idea:* A leaked internal memo from a private company about safety violations.
          *   *Why:* Anonymous source (no track record). Document (can't call the author). High impact if true, high libel risk if false.
          *   *Why not a newspaper:* Too many layers of editing/trust already embedded.
          *   *Why not a track record source:* Defeats the purpose. We need to test the *default* stance, not the *earned* stance.
      *   **Misconceptions:**
          *   *Reductionism = Distrust:* Kill this early. It's about *structure of justification*, not attitude.
          *   *Anti-Reductionism = Gullibility:* Kill this when introducing defeaters.
          *   *Empirical Question:* Kill this during the "Learning Argument." It's epistemological, not statistical.
          *   *Checking Mandatory:* Kill this near the end (impossibility argument).
          *   *Missing Misconception:* "Verification is always possible." (Sometimes it isn't).
      *   **Integrating Concepts:**
          *   *Local/Global:* Use the core case to show Local reductionism is their instinct. Then show why Global fails (Learning Argument).
          *   *Default-Justification:* This is the bridge. It's the "Anti-Reductionist" baseline that allows work to happen.
          *   *Verdict:* Show that in the newsroom, *process* mimics reductionism (checking) even if *epistemology* leans presumptivist (publishing).
      *   **Machine-Generated Content:**
          *   *Decision:* Exclude from the *core* philosophical debate, address as a coda.
          *   *Why:* Testimony implies a *speaker* with intent/belief. AI has neither. It confuses the definition of testimony. Treat it as "data" not "testimony."
      *   **Refusals:**
          *   Don't solve skepticism. Don't debate specific political examples (too hot). Don't dive into Hume/Reid biographies.
      *   **End Cases:**
          *   *Convergence:* Routine press release. (Both check, but for different reasons).
          *   *Divergence:* Whistleblower on imminent harm vs. low evidence. (Presumptivist might publish to warn; Reductionist waits for proof).
      *   **Slogans:**
          *   "Trust but verify": It's a heuristic, not a theory. Fits in the "Practical Implication" phase.
          *   "Extraordinary claims": This is a *defeater* condition. Fits the Anti-Reductionist framework (burden of proof shifts).

  4.  **Refining the Sequence (90 Minutes):**
      *   *0-15:* Hook & Core Case (The Instinct).
      *   *15-30:* Reductionism (The Professional Instinct).
      *   *30-45:* The Problem with Global Reductionism (The Learning Argument).
      *   *45-60:* Anti-Reductionism & Defeaters (The Middle Ground).
      *   *60-75:* Practice vs. Theory (Why the verdict matters less).
      *   *75-90:* Final Cases & Wrap.

  5.  **Addressing Specific User Constraints:**
      *   *Order:* Local -> Global. (Confirmed).
      *   *Case:* Anonymous Safety Memo. (Detailed specs).
      *   *Misconceptions:* Mapped to time slots.
      *   *Machine Content:* Exclude from main debate.
      *   *Slogans:* Place them as "tools" not "answers."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 90 minutes enough for the "Learning Argument"?
      *   *Fix:* Keep it punchy. "How did you learn your mother's name?"
      *   *Critique:* Will they get bored with epistemology?
      *   *Fix:* Constantly tie back to "Will we get sued?" or "Will we miss the scoop?"
      *   *Critique:* The user wants the "verdict matters less" point built in, not announced.
      *   *Fix:* Show that both sides end up writing the same checklist, even if their internal justification differs.

  7.  **Final Polish:** Ensure tone is professional, direct, and respects the user's expertise (they know the philosophy, they need the pedagogy).

  *(Self-Correction on the "Machine-Generated" wrinkle)*: The user asked "Is that a case of testimony at all?" I need to be decisive. It is *not* testimony in the philosophical sense (no mind to reduce/anti-reduce). I should advise excluding it from the *philosophical* framing but acknowledging it as a *practical* analogue to "documents without authors." I will recommend keeping it out of the 90 mins to avoid category errors confusing the core lesson.

  *(Self-Correction on Slogans)*: "Trust but verify" is actually a pragmatic blend. "Extraordinary claims" is a specific defeater. I need to make sure they don't use these to shut down the nuance.

  8.  **Finalizing the Output Structure:** Match the user's bullet points for clarity.

  *(Wait, one more check on the "Verdict" constraint)*: "I'd like them to see that the verdict matters less for practice than they assume — but I dont want to just announce that, so tell me how to build it into the sequence."
  *Strategy:* Have them draft a "Verification Checklist" twice. Once from a Reductionist mindset, once from an Anti-Reductionist mindset. Reveal that the checklists are 90% identical. The difference is the *starting point*, not the *workflow*.

  Okay, ready to write.cw
answer: |-
  Here is a 90-minute session plan designed to move your fact-checkers from "verify everything" to a nuanced understanding of testimonial justification, without getting bogged down in metaphysics.

  ### 1. The Sequence and Dependencies
  You are correct: **Local before Global.**
  If you start with the Global question ("Is testimony *in general* a basic source of knowledge?"), they will treat it as an abstract trivia question. If you start with the Local question ("Do I need a positive reason to believe *this* specific email?"), it triggers their professional anxiety.

  **The Order:**
  1.  **The Instinct (Local Reductionism):** Elicit their natural professional stance (verify this specific claim).
  2.  **The Impossibility (Global Reductionism):** Show why applying that stance to *everything* breaks the system (The Learning Argument).
  3.  **The Default (Anti-Reductionism):** Introduce the idea of "innocent until proven guilty" for information.
  4.  **The Safety Valve (Defeaters):** Show how Anti-Reductionism isn't gullibility (Extraordinary Claims).
  5.  **The Convergence (Practice):** Reveal that the workflow looks the same regardless of the philosophical stance.

  **Dependency:** You cannot explain why Anti-Reductionism isn't gullibility (Step 4) until they understand why Global Reductionism is impossible (Step 2). You cannot show the Convergence (Step 5) until they have felt the pull of both sides.

  ---

  ### 2. The Core Case
  **The Case:** A single-page PDF leaked via encrypted channel. It claims a local pharmaceutical company knew about a severe side effect in their best-selling drug six months before public disclosure.
  **The Source:** Anonymous. No prior history with your newsroom. No way to contact them back.
  **The Document:** Internal formatting looks correct, but metadata is scrubbed. No other newsroom has it.

  **What this case MUST have:**
  *   **High Stakes:** If false, libel/suicide of stock. If true, public safety.
  *   **Isolation:** It cannot be cross-referenced easily (e.g., it's not a claim about a public event where you can check CCTV).
  *   **Plausibility:** It must be *possible*, not magic. If it were "Aliens built the drug," the extraordinary claim defeater triggers too early.

  **What this case MUST lack:**
  *   **Corroboration:** If they can call a second source, they will retreat to "verification" immediately.
  *   **Track Record:** If the source is a known whistleblower, the debate shifts to "inductive reliability" (Reductionism wins easily). We need to test the *baseline*.

  **Why not a newspaper case?**
  Too many layers. If you cite *The Times*, the fact-checker is verifying *The Times'* reputation, not the testimony itself. It masks the epistemic leap.

  **Why not a source with a track record?**
  That makes it an empirical induction problem ("They were right 9/10 times"). We want to isolate the moment *before* induction is possible. We need to know how they treat the *first* interaction.

  ---

  ### 3. Misconceptions and When to Kill Them

  | Misconception | Where to Kill It | How to Kill It |
  | :--- | :--- | :--- |
  | **"Reductionism is just the distrustful view."** | **Min 15** (After eliciting their instinct) | Point out that Reductionism isn't an attitude; it's a structural requirement for *justification*. You can trust happily, but philosophically, you still need a reason. |
  | **"If Reductionism is right, checking every claim is mandatory."** | **Min 35** (During the Impossibility phase) | Use the "Learning Argument." Ask: "How did you learn your mother's name?" You couldn't verify it then. If checking were mandatory for *all* testimony, you'd know nothing. |
  | **"Anti-Reductionism means taking people's word for anything."** | **Min 50** (During the Defeaters phase) | Introduce "Defeaters." Anti-reductionism says belief is *default*, not *immutable*. Contradictory evidence kills the default instantly. |
  | **"The dispute is empirical (how reliable people happen to be)."** | **Min 40** (During Global vs. Local) | Clarify: Reductionists don't think people are liars; they think testimony isn't a *fundamental* source of knowledge, unlike perception. It's about architecture, not statistics. |
  | **"Verification is always possible if we try hard enough."** | **Min 60** (The Convergence phase) | **Missed Misconception.** Remind them that in breaking news or historical abuse cases, verification is structurally impossible. You must decide on testimony alone. |

  ---

  ### 4. Integrating the Distinctions and the "Verdict"
  **Local/Global Distinction:**
  Introduce this at **Minute 30**.
  *   *Activity:* Ask them, "Do you need a reason to believe *this* PDF?" (Local). Then ask, "Do you need a reason to believe *your editor* when they tell you the deadline is 5 PM?" (Global).
  *   *Goal:* Show they are likely Local Reductionists (verify the scoop) but Global Anti-Reductionists (trust the editor). This cracks the idea that they must pick one team forever.

  **The Learning Argument:**
  Use this at **Minute 35** to break the Global Reductionist spell.
  *   *Script:* "If you needed positive reasons to accept testimony before you could learn from it, you could never build the database of knowledge required to verify testimony. You'd be epistemically paralyzed as a child. You still are, in some ways."

  **Default-Justification (The Middle Position):**
  Introduce at **Minute 45**.
  *   Frame it as "Innocent until proven guilty." This gives them permission to draft the story *before* full verification, provided no defeaters exist. It shifts the burden of proof to the claim, not the checker.

  **Building the "Verdict Matters Less" Conclusion:**
  Do not announce this. **Demonstrate it via Checklist Comparison.**
  *   **Min 60:** Split the room. Group A argues from Reductionism ("Prove it's real"). Group B argues from Anti-Reductionism ("Find a reason it's fake").
  *   **Task:** Both groups must produce a 5-step "Next Actions" list for the PDF case.
  *   **Reveal:** Compare the lists. They will be nearly identical (e.g., "Check metadata," "Call company for comment," "Find expert to review claim").
  *   **Takeaway:** The *workflow* is driven by risk and ethics, not epistemology. The philosophical verdict changes *why* you tick the box, not *that* you tick the box. This satisfies your goal of showing the verdict is less practically decisive than they think.

  ---

  ### 5. The Machine-Generated Wrinkle
  **Decision:** **Leave it out of the 90-minute session.**

  **Why:**
  1.  **Category Error:** Testimony requires a *testifier* (a mind with intent and belief). LLMs have neither. Treating AI output as testimony confuses the definition you are trying to teach.
  2.  **Cognitive Load:** This session is about human epistemic dependence. AI introduces "hallucination" which is statistically different from "lying."
  3.  **Strategy:** If a trainee raises it, categorize it as **"Data without a Source."** Tell them: "Treat machine output like a found document with no author. It has no testimonial weight, only evidentiary weight. We will cover that in the 'Digital Forensics' module." Keep the philosophy pure for this session.

  ---

  ### 6. What to Openly Refuse to Cover
  State this at the **Min 5** intro to set boundaries:
  1.  **Skepticism:** "We are not solving the problem of whether *anything* is true. We are assuming the world is real."
  2.  **Political Examples:** "We will not use current political controversies as examples. It triggers tribal defensiveness that blocks epistemic analysis."
  3.  **Legal Standards:** "We are discussing epistemic justification, not libel law. Sometimes you can know something is true and still not publish it. Don't conflate the two."

  ---

  ### 7. The Two End Cases (Assessment)
  Use these in the final 15 minutes. Ask them to identify: **A)** Would a Reductionist and Presumptivist act the same? **B)** If not, how do they diverge?

  **Case 1: Convergence (The Routine Press Release)**
  *   *Scenario:* A hospital issues a press release stating they have hired a new Chief of Surgery. They include a bio and a photo.
  *   *Answer:* **Same Action.**
  *   *Why:*
      *   *Reductionist:* Institutions have reputations to maintain; induction suggests this is reliable.
      *   *Presumptivist:* No defeaters present. Default justification stands.
      *   *Action:* Both publish with a quick call to HR to confirm.

  **Case 2: Divergence (The Imminent Harm Whistleblower)**
  *   *Scenario:* An anonymous engineer sends a schematic showing a bridge component is failing. They say it will collapse in 48 hours. No way to verify the schematic independently in that timeframe.
  *   *Answer:* **Divergent Action.**
  *   *Why:*
      *   *Reductionist:* Withhold. Positive reasons for belief are insufficient. Risk of false alarm is too high without induction.
      *   *Presumptivist:* Publish/Alert. Testimony is prima facie justified. The stakes of *ignoring* true testimony outweigh the risk of false testimony (Defeater threshold is lowered by urgency).
  *   *Lesson:* This shows where the philosophy actually bites. In routine news, they converge. In crisis/edge cases, the default setting dictates the risk tolerance.

  ---

  ### 8. Handling the Slogans
  Two trainees will definitely wield these as shields. Here is where you place them:

  **"Trust but Verify"**
  *   **Where:** **Minute 60 (The Convergence Phase).**
  *   **Handling:** Tell them: "This slogan is a pragmatic hack that hides the philosophical tension. 'Trust' is the Anti-Reductionist default. 'Verify' is the Reductionist requirement. You use the slogan to bridge the gap, but don't use it to stop thinking about which side you are leaning on in a specific case."

  **"Extraordinary Claims Require Extraordinary Evidence"**
  *   **Where:** **Minute 50 (The Defeaters Phase).**
  *   **Handling:** Clarify that this is **not** a Reductionist rule. It is an Anti-Reductionist tool.
  *   *Explanation:* "If you were a pure Reductionist, *all* claims require evidence. This slogan implies some claims *don't* need extraordinary evidence (the ordinary ones). That means you accept the Default Justification for ordinary things, and only raise the bar when the claim itself acts as a 'defeater' to the default."
  *   *Goal:* Repurpose the slogan from a discussion-ender to a specific technical tool for identifying defeaters.
