              *   Prop-wise: P (2-1), Q (2-1), R (1-2, so ~R). Set: {P, Q, ~R}. Inconsistent with doctrine.
              *   Premise-based: Aggregate P (Yes), Q (Yes). Apply doctrine $\to$ R (Yes).
              *   Conclusion-based: Aggregate R (No).
              *   Discursive Dilemma: Conflict between premise-based and conclusion-based outcomes (or inconsistency of proposition-wise majority).
          *   *Candidate Answer:*
              *   Prop-wise: P (2-1), Q (2-1), not-R (2-1). Correct.
