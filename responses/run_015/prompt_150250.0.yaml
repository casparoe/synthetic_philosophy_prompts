  2.  **Analyze the Exam Question & Candidate Answer:**

      *   **Part (a) [6 marks]:**
          *   *Task:* Calculate proposition-wise majority, premise-based, and conclusion-based outcomes. Define discursive dilemma.
          *   *Facts:* Doctrine $R \leftrightarrow (P \land Q)$. Votes: J1 (P, ~Q, ~R), J2 (~P, Q, ~R), J3 (P, Q, R).
