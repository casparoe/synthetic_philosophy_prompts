      *Wait, one nuance on the Lounge:* If the lounge is a *shared resource*, Sen's paradox applies less directly than to private rooms. But the "minority says how they spend evening is nobody's business" invokes the liberty claim. I need to be careful not to dismiss that too easily. I will classify Lounge as "Collective Resource" to distinguish it from "Private Sphere." This clarifies why Majority Rule is acceptable there but not in the Wellness case.

      *Wait, one nuance on Wellness:* The prompt says "Mandatory wellness checks." This is an *action by the RA*, not a restriction on the resident. But it enters the *private sphere*. So it triggers the Liberty protection.

