      *   **Protagonist's Situation:** Decided not to have kids, now spiraling about the meaninglessness of their life/work if humanity ends.
      *   **Plot Point:** A choice between preserving a human artifact for a post-human world (AI/alien archive) vs. letting it vanish.
      *   **Theme:** Wrestle with whether Scheffler's point holds water without biological continuity. Does "humanity" need to be biological humans, or just *someone* to witness it?
