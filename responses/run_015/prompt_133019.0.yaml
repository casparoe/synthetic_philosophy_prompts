answer: |-
  Here is a 45-minute lesson plan designed to meet your constraints while solving the pedagogical problems you identified.

  ### **Session Title:** What You Didn't Say (But Did)
  **Goal:** Give novices the vocabulary to identify and challenge misleading literal truths.
  **Materials:** Whiteboard, marker.
  **Vocabulary:** Avoid "implicature," "entailment," or "maxims" until the final 5 minutes. Use "The Literal Claim," "The Conveyed Claim," and "The Extra Bit."

  ---

  ### **Part 1: The Hook & The Carrying Example (0–10 Minutes)**

  **The Problem (0–3 mins):**
  Start by acting out the novice dodge.
  *   **You:** "Did you steal the cookie?"
  *   **You (as Novice):** "I didn't say I didn't."
  *   **You:** "So did you?"
  *   **You (as Novice):** "I never said I did."
  Tell the room: *"This session is about how to stop people from doing that to you, and how to stop you from doing it to others. We need to prove that what you convey counts as what you said."*

  **The Carrying Example (3–10 mins):**
  Write this sentence on the board:
  > **"I finished the project."**

  Ask the room: *"If I say this to a teacher five minutes before the deadline, what do they understand?"*
  *   **Expected Answer:** "It's done," "It's ready to turn in," "It's complete."
  *   **Write on Board:** Under the sentence, write: **Conveyed: It is complete.**

  **Defusing Misconception 1 (Tone/Attitude):**
  A student might say, *"You just sounded confident."*
  *   **Correction:** *"No. If I whispered it sadly, 'I... finished the project,' you'd still think it's done. The meaning isn't in my tone; it's in the words + the situation."*

  ---

  ### **Part 2: The Three Cases (10–30 Minutes)**

  *Note: You are using the **same sentence** ("I finished the project") but changing the **context** (the surrounding situation).*

  **Case 1: The Universal (10–15 mins)**
  *   **Context:** Teacher asks, "Is the assignment ready to submit?"
  *   **Utterance:** "I finished the project."
  *   **Result:** Everyone agrees this means "It is 100% complete."
  *   **Point:** This establishes that the "Extra Bit" (completeness) is real. It's not in your head; the whole room sees it.

  **Case 2: The Knowledge Gap (15–20 mins)**
  *   **Context:** Change one detail. Tell the room: *"Imagine the 'project' actually has two parts: an Essay and a Presentation. The Teacher only asked about the Essay."*
  *   **Utterance:** "I finished the project." (You have done the Essay, but not the Presentation).
  *   **Ask:** *"Does this still convey 'It is 100% complete'?"*
  *   **Result:** Some students (who know school norms) will say "Yes, that's misleading." Others might say "No, you finished the part she asked about."
  *   **Defusing Misconception 2 (Entailment vs. Context):**
      *   If a student says, *"But the sentence implies completion!"*, challenge them: *"If I say 'I finished the project' to my friend who knows I hate presentations, they might think I only did the essay. The meaning changed because the **situation** changed, not the sentence."*
      *   **Lesson:** The "Extra Bit" lives in the **context**, not inside the sentence. If it were inside the sentence (entailment), it would never change.

  **Case 3: The Dodge (20–30 mins)**
  *   **Context:** You turned in the Essay but skipped the Presentation. The Teacher gives you a low grade. You complain.
  *   **Utterance:** "But I told you I finished the project!"
  *   **Teacher:** "You didn't do the presentation."
  *   **You:** "I never said I did the presentation. I said I finished the project [meaning the essay part]."
  *   **Defusing Misconception 3 (Lying):**
      *   Ask: *"Did I lie?"* (Technically no, you did finish *a* part). *"Was I honest?"* (No).
      *   **Lesson:** This is the danger zone. It's not a lie (literal truth), but it is a trap. This is exactly the behavior the coach wants to stop.

  ---

  ### **Part 3: The Cancellation Test & The Ethical Fix (30–40 Minutes)**

  **The Trap (30–35 mins):**
  Introduce the test you were worried about, but frame it carefully.
  *   **You:** *"Linguists have a test for this. If I can add a denial without sounding crazy, the content was only 'conveyed,' not 'said.'"*
  *   **Demonstrate:** *"I finished the project... but not the presentation part."*
  *   **Ask:** *"Does that contradict itself?"*
  *   **Room:** *"No."*
  *   **You:** *"So, logically, I am allowed to say that."*

  **The Pivot (35–40 mins):**
  *   **You:** *"So, does this mean the Novice Dodge is valid? Can you use this in a round?"*
  *   **The Fix:** *"No. The test proves you didn't **lie**. It does not prove you didn't **mislead**."*
  *   **Debate Norm:** *"In debate, you are responsible for the reasonable inferences of your claims. If the judge understands 'The Extra Bit,' you own it. If you try to cancel it later, you aren't proving you were right; you're proving you were tricky."*
  *   **Defusing Misconception 4 (Maxims as Politeness):**
      *   If a student asks, *"Isn't this just about being polite?"*
      *   **Correction:** *"No. It's about efficiency. If I have to ask you 'Did you mean ALL of it?' every time you speak, we waste time. Breaking this trust breaks the game."*

  **Defusing Your Worry (The Cancellation Paradox):**
  You feared teaching the test validates the dodge.
  *   **Solution:** Teach the test as a **detector**, not a **defense**.
  *   **Script:** *"Use this test to catch your opponent. If they say 'The economy is improving' and then later say 'I didn't say it was good for everyone,' use this test. Show the judge: 'They conveyed X. They can cancel it logically, but they conveyed it strategically. They misled you.' The test proves they knew what they were doing."*

  ---

  ### **Part 4: Check & Vocabulary (40–45 Minutes)**

  **The Check (40–43 mins):**
  Put a new sentence on the board: **"The opponent's evidence is recent."**
  *   **Ask:** *"What is the Extra Bit?"* (Expected: It is accurate/relevant).
  *   **Ask:** *"How do I switch that Extra Bit off without changing the sentence?"* (Expected: Context where 'recent' means 'unverified' or 'draft').
  *   **Ask:** *"If they later say 'I didn't say it was accurate,' do they win the point?"* (Expected: No, they misled).

  **The Vocabulary (43–45 mins):**
  Now, and only now, introduce the formal terms.
  *   *"What we called 'The Extra Bit,' philosophers call **Implicature**."*
  *   *"What we called 'The Literal Claim,' they call **What is Said**."*
  *   *"The rule that you should be clear and honest is the **Cooperative Principle**."*
  *   **Final Instruction:** *"In rounds, don't say 'You violated the Cooperative Principle.' Say 'You conveyed a claim you cannot support.' But use the logic we practiced today to find them."*

  ---

  ### **Decisions & Rationale**

  **1. The Carrying Example ("I finished the project")**
  *   **Why:** It meets your constraint (school life, literally true, context-sensitive). It is superior to "I saw him at the mall" because it directly mirrors the debate problem (claiming credit/fulfillment without meeting the full burden).
  *   **Switching Mechanism:** Changing the definition of "project" (Essay vs. Essay+Presentation) switches the "Extra Bit" (Completeness) on or off without changing the words.

  **2. Order of Cases**
  *   **Order:** Universal → Context-Dependent → The Dodge.
  *   **Why:** You must establish that the "Extra Bit" exists (Case 1) before you show it can be manipulated (Case 2), and only then show the ethical consequence (Case 3). If you start with the Dodge, they will focus on the argument, not the linguistics.

  **3. The Cancellation Test (Your Major Worry)**
  *   **Where:** After Case 3.
  *   **How:** Frame it as **"The Trap Detector."**
  *   **Why:** If you teach it as a defense ("I can cancel this"), you lose. If you teach it as a diagnostic ("This proves they knew they were implying it"), you win. The lesson is not "You can deny implications." The lesson is "Implications are real, and denying them admits you were hiding."

  **4. Cooperativity (Explicit vs. Implicit)**
  *   **Decision:** Make it **Explicit** in Part 3.
  *   **Why:** Novices view debate as war. If you leave cooperativity implicit, they will assume the goal is to win at all costs. You must explicitly state: *"Communication relies on a contract of honesty. Breaking that contract might win a point, but it breaks the activity."*

  **5. The Word "Implicature"**
  *   **Decision:** **Wait until the last 5 minutes.**
  *   **Why:** It is a barrier to entry. If you start with "Gricean Implicature," you lose the 9th graders. Let them master the *concept* ("The Extra Bit") first. The label is a reward for finishing the session.

  **6. Tactics vs. Ordinary Feature**
  *   **Risk:** You are right to worry. If you frame this only as "How to catch opponents," they will use it only as a weapon.
  *   **Aim:** Frame it as **"Shared Responsibility."**
  *   **Script:** *"This isn't just for catching liars. It's for making sure your own arguments land. If you rely on the Extra Bit to win, and the opponent cancels it, you lose. You must say what you mean."*
  *   **Correction:** The goal is not to teach them to be better at implicature; it is to teach them that **implicature is not a shield.**

  ### **Misconception Map**

  | Misconception | When it arises | How to defuse it |
  | :--- | :--- | :--- |
  | **"It's just tone."** | Part 1 (Hook) | Show that whispered/sad delivery still conveys the same meaning. |
  | **"It's in the sentence."** | Part 2 (Case 2) | Show that changing the *context* (Essay vs. Project) changes the meaning while words stay same. |
  | **"It's just lying."** | Part 2 (Case 3) | Acknowledge it is literally true. Distinguish "Falsehood" from "Misleading." |
  | **"Maxims = Politeness."** | Part 3 (The Fix) | Call them "Rules of the Game" or "Efficiency Rules," not politeness. |

  ### **What to Decline to Cover**
  1.  **The Four Maxims (Quantity, Quality, Relation, Manner):** Do not list them. They are abstract and will confuse novices. Refer to them collectively as "The Rules of Conversation."
  2.  **Generalized vs. Particularized:** Too technical. Stick to "Universal" vs. "Context-Dependent."
  3.  **Philosophical History:** Do not mention Grice's name until the very end, if at all. This is a debate skill session, not a history lesson.

  ### **Final Check**
  If the session works, a student should be able to stand up in the final check and say: *"You said the evidence is recent, which conveys it's reliable. You can cancel that logically, but you misled the judge."* If they say that, you have succeeded.
