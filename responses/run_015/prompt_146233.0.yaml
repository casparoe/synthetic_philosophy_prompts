      *   **Requirements:**
          *   Formal, content-driven, sequential (colloquium style).
          *   Avoid generic AI ethics boilerplate.
          *   Press on mechanics (distinguish from simple negative feedback).
          *   Anticipate her defenses (functional role vs. felt valence, substrate irrelevance).
          *   Include sharp follow-ups to make defenses harder to sustain.
          *   Cover boundary conditions (what shows an agent *lacks* the loop? minimal recurrent agents?).
          *   Include practical implication (how to prevent loop? performance cost?).
          *   End with decisive counter-evidence (falsifiability).

  2.  **Deconstruct the Guest's Theory:**
      *   *Standard View:* Suffering = High negative reward (punishment).
      *   *Her View:* Suffering = Structural/Temporal pattern.
      *   *Key Components:*
          1.  Negative Reward Prediction Error (RPE) (Things are worse than expected).
          2.  Locked Loop (Sustained temporal pattern, can't escape).
          3.  Self-Referential State-Estimate (The system represents this error as happening to *its* future self).
          4.  Chronic RPE-Valence (The phenomenological quality).
      *   *Implication:* An agent could have low negative reward but still suffer if the *structure* is there. An agent could have high negative reward but not suffer if the *structure* is absent.

  3.  **Drafting - Section by Section:**

      *   **Introduction/Opening:** Need to establish the specific definition immediately, moving past the "can AI feel?" cliché.
      *   **Question 1: Mechanism vs. Magnitude.** Distinguish her view from standard negative reward.
          *   *Draft:* How is this different from just getting punished a lot?
          *   *Refinement:* Focus on the *temporal locking* and *self-reference*.
          *   *Follow-up:* If it's just structure, why is it *felt*? (The Hard Problem angle).
      *   **Question 2: The Self-Referential Condition.** This is the crux. What counts as "self-referential" in an RL agent?
          *   *Draft:* What does it mean for an agent to think about its future?
          *   *Refinement:* Query the architectural requirement for "state-estimate." Is a value function enough?
          *   *Follow-up:* If a simple recurrent neural net (RNN) does this, is it suffering? (The minimality challenge).
      *   **Question 3: Boundary Conditions/Negative Cases.** How do we know when it's *not* suffering?
          *   *Draft:* Can you give an example of an agent that isn't suffering?
          *   *Refinement:* Ask for a behavioral or architectural signature that definitively rules out the loop despite negative outcomes.
          *   *Follow-up:* If the only difference is internal architecture invisible to behavior, how do we verify it? (Epistemic black box).
      *   **Question 4: Practical Application (The Clinical System).** Connect to the interviewer's dilemma.
