      *   **Audience:** ~40 people. Mostly engineering faculty (teach ethics modules, view tools as neutral, politics = regulation/use, worry about liability). Some STS scholars (social constructivists, Winner fans). A few pragmatist philosophers of technology.
      *   **Goal:** A prep sheet for Q&A. Needs 7-8 objections ordered by damage potential, phrased in the audience's idiom, with 90-second replies and a "soft spot" admission. Needs advice on what to concede preemptively, the "make or break" reply, the "hope nobody asks" question, and a "true but swallow" reply. Finally, conditions for abandoning the theory.
      *   **Tone:** Sharp, strategic, academically rigorous but practical.

  2.  **Deconstruct the Thesis & Audience Tensions:**
      *   *Thesis:* Exit cost asymmetry = politics. Symmetry = depoliticization.
      *   *Engineers:* Will hear "blame the designer for user behavior" or "make everything customizable (expensive/impossible)." They care about safety, standards, and liability.
      *   *STS/Constructivists:* Will hear "technological determinism lite" or "ignoring the network." They care about power structures, history, and the instability of meaning.
      *   *Pragmatist Philosophers:* Will hear "old wine in new bottles" (instrumentalization theory). They care about the phenomenological experience of use and habit.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Engineers - Liability/Safety):* "If I make exit easy, people bypass safety." High damage because it attacks feasibility and responsibility.
      *   *Objection 2 (STS - Structural Power):* "Exit costs aren't design features; they're economic/social structures." High damage because it undermines the core mechanism.
      *   *Objection 3 (Philosophers - Instrumentalization):* "This is just Feenberg/Instrumentalization theory." Medium damage (theoretical novelty).
      *   *Objection 4 (Engineers - Cost/Complexity):* "Symmetry is too expensive/complex to build." Practical damage.
      *   *Objection 5 (STS - Winner/History):* "Winner's bridges weren't about exit costs, they were about intent/class." Historical damage.
      *   *Objection 6 (General - Definition of Politics):* "Depoliticizing isn't always good. Some things *should* be political." Normative damage.
      *   *Objection 7 (Engineers - User Competence):* "Users don't know how to exit. Cost isn't just money/time, it's knowledge." Epistemic damage.

      *Refining for "Idiom":*
      *   Engineers need to sound like they care about codes, standards, and risk.
      *   STS needs to sound like they care about networks, stabilization, and power.
      *   Philosophers need to care about ontology and normativity.

      *Ordering by Damage:*
      1.  Safety/Regulatory (Engineers will shut down the "design variable" claim immediately if it violates safety).
      2.  Structural Power (STS will say you're ignoring the real politics).
      3.  Epistemic/Knowledge (Exit isn't just cost, it's know-how).
      4.  Novelty (Philosophers).
      5.  Feasibility (Engineers).
      6.  Normative Value of Politics (Philosophers/STS).
      7.  Historical Accuracy (STS).

  4.  **Developing Replies & Soft Spots:**
      *   Need to be concise (90 seconds spoken is ~150-180 words).
      *   Soft spot must be honest but not fatal.

  5.  **Strategic Decisions:**
      *   *Preemptive Concession:* Acknowledge safety-critical systems. You can't have symmetric exit on a nuclear reactor scram button. This disarms the "safety" attack.
      *   *Survival Reply:* The distinction between *structural* exit costs and *designed* exit costs. If I can't show designers can influence this, the thesis fails.
      *   *Hope Nobody Asks:* "How do you measure 'cost' objectively across different users?" (The metric problem).
      *   *True but Swallow:* "Sometimes asymmetry is justified (paternalism)." Engineers love paternalism for safety. Admitting this too loudly undermines the "politics is bad" implication.

  6.  **Abandonment Conditions:**
      *   If symmetry is impossible to engineer.
      *   If symmetry doesn't actually reduce power asymmetry.

  7.  **Drafting the Content (incorporating the constraints):**

      *   *Reviewing the prompt:* "Seven or eight objections," "ordered by damage," "idiom of the group," "90-second reply," "one sentence soft spot." "Which to concede," "single reply survival," "hope nobody asks," "true but swallow," "abandonment conditions."

      *   *Refining Objection 1 (Safety):* Engineer idiom. "You're asking me to design failure modes."
      *   *Refining Objection 2 (Structure):* STS idiom. "Costs are exogenous to the artifact."
      *   *Refining Objection 3 (Knowledge):* Engineer/STS mix. "Cognitive load."
      *   *Refining Objection 4 (Novelty):* Phil idiom. "Feenberg."
      *   *Refining Objection 5 (Feasibility):* Engineer idiom. "Bloat."
      *   *Refining Objection 6 (Normative):* Phil/STS. "Politics is good."
      *   *Refining Objection 7 (Winner):* STS. "Moses bridges."
      *   *Refining Objection 8 (Measurement):* The "Hope nobody asks."

      *   *Wait, I need to check the "True but Swallow".* If I admit that asymmetry is sometimes *good* (e.g., seatbelts), it weakens the "politics is a design variable to be minimized" stance. I should swallow the nuance that *some* politics is desirable.

      *   *Survival Reply:* It has to be the one that proves designers *can* affect exit costs. Otherwise, it's just sociology.

      *   *Preemptive Concession:* Safety critical systems.

  8.  **Final Polish:** Check tone. Ensure it sounds like a strategic briefing for a scholar, not a generic list. Make sure the "idioms" ring true. (e.g., Engineers say "liability," "standards," "edge cases." STS say "enrollment," "stabilization," "exogenous.")

      *(Self-Correction during drafting)*: Make sure the 90-second replies aren't too long. 90 seconds is roughly 130-150 words at a normal speaking pace. I will keep them tight.

      *(Check the "Hope Nobody Asks")*: The measurement problem is the killer. If "cost" is subjective, the metric fails. I need to flag this as the "Hope nobody asks."

