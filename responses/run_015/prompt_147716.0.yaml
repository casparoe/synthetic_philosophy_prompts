answer: |-
  # Q&A PREP SHEET: The Politics of Exit Costs

  **Context:** Workshop on Responsible Engineering.
  **Audience:** 40px (30 Eng Faculty, 4 STS, 3 Phil Tech).
  **Goal:** Defend "Exit Cost Asymmetry" as the locus of artifact politics without accepting liability for user negligence or collapsing into social constructivism.

  ---

  ### THE OBJECTIONS (Ordered by Damage Potential)

  **1. The Safety & Liability Trap (Engineering Faculty)**
  *   **The Question:** "If I design a medical device or a brake system where 'exiting' the default is as cheap as 'accepting' it, I am designing a failure mode. Are you suggesting safety-critical constraints are 'political' oppression? This sounds like you want me to reduce my duty of care to avoid 'asymmetry.'"
  *   **The Reply (90s):** "I'm distinguishing between *protective* constraints and *political* constraints. A brake pedal's asymmetry protects the user from their own physics; a software EULA's asymmetry protects the vendor from the user's rights. My claim applies to socio-technical systems where the 'danger' of exiting is primarily financial or bureaucratic, not physical. In safety-critical hardware, the cost of exit is physical law, not design policy. I am arguing we should minimize *arbitrary* friction, not *necessary* friction. If the cost to exit is high because physics demands it, that's not politics; that's gravity. If the cost is high because a terms-of-service agreement demands it, that's politics."
  *   **Soft Spot:** I am assuming we can cleanly distinguish "physics" from "policy" in cyber-physical systems, which is often blurred.

  **2. The Exogenous Structure Attack (STS / Social Constructivist)**
  *   **The Question:** "You're treating exit costs as features of the artifact. But the cost to switch from iOS to Android isn't in the code; it's in the network effects, the carrier contracts, and the app ecosystem. You're blaming the designer for market monopolies they don't control."
  *   **The Reply (90s):** "I agree the costs are often exogenous, but that's precisely why they are political. When a designer locks a battery into a chassis, they are *stabilizing* those exogenous market forces into physical form. My point isn't that designers create the market, but that they act as the *anchor* for it. By designing for modularity or open standards, a designer can lower the exit cost even within a monopoly. If the artifact refuses to interoperate, it is actively doing the work of the monopoly. The artifact isn't innocent; it's the enforcement mechanism."
  *   **Soft Spot:** This requires designers to have leverage over supply chains and business models they typically lack.

  **3. The Epistemic Barrier (Engineering Faculty / Cognitive Science)**
  *   **The Question:** "Cost isn't just time or money; it's knowledge. If I give a user a 'route around' option they don't understand, I haven't lowered the exit cost, I've just added a confusing menu. How do you account for the cognitive load of knowing an exit exists?"
  *   **The Reply (90s):** "That's a crucial refinement: 'Exit Cost' includes the discovery cost. A hidden 'jailbreak' option isn't symmetry; it's a trap. Symmetry requires *legibility*. The design variable isn't just the mechanical ability to exit, but the intelligibility of the exit path. If the user needs a PhD to bypass the default, the cost is high. Responsible engineering means documenting the 'off-ramp' as clearly as the 'on-ramp.' We treat safety warnings as mandatory; I'm arguing exit pathways should be documented with similar rigor."
  *   **Soft Spot:** This effectively doubles the documentation burden on engineers, which resource-constrained teams will resist.

  **4. The Instrumentalization Déjà Vu (Pragmatist Philosophers)**
  *   **The Question:** "This sounds like Andrew Feenberg's instrumentalization theory or Latour's scripts, just rebranded as 'costs.' What work is the economic vocabulary doing that the critical theory vocabulary didn't already do?"
  *   **The Reply (90s):** "Critical theory diagnoses the condition; cost analysis prescribes the metric. Telling an engineer 'this artifact encodes domination' often stops the conversation because they don't know how to measure domination. Telling them 'the ratio of time-to-comply versus time-to-bypass is 1:50' gives them a KPI. I'm translating a normative critique into an engineering constraint. It's not new ontology; it's new tooling for the same ethical goal."
  *   **Soft Spot:** It risks reducing rich political concepts to utilitarian calculus, losing the nuance of *why* the domination matters.

  **5. The Feasibility Objection (Engineering Faculty)**
  *   **The Question:** "Designing for symmetric exit increases complexity, attack surface, and maintenance cost. You're asking for more code, more parts, and more failure points. Who pays for that?"
  *   **The Reply (90s):** "Initially, the manufacturer pays. But in the long term, asymmetric systems externalize costs to the user in the form of lock-in and e-waste. If we treat 'political friction' as a negative externality, like carbon emissions, then symmetry becomes an efficiency metric. We accepted higher costs for emissions controls; I'm arguing we should accept them for democratic controls. The 'expense' is the price of not treating users as captives."
  *   **Soft Spot:** Unlike carbon, there is no regulatory framework forcing this cost internalization, making it a competitive disadvantage.

  **6. The Normative Value of Politics (STS / Philosophers)**
  *   **The Question:** "Why is depoliticization the goal? Sometimes we *want* artifacts to be political. We want the speed bump to force drivers to slow down in a school zone. Symmetry might just mean enabling privileged users to opt-out of social contracts."
  *   **The Reply (90s):** "I'm not arguing for the removal of all constraints, but for the *visibility* of the constraint. A speed bump is a physical law; you can't exit it without destroying the car. But a digital speed bump that can be bypassed with a premium subscription is political. If the constraint is a collective democratic choice (like a law), it should apply symmetrically. My remedy targets *arbitrary* asymmetry where the designer privileges one mode of use over another for private gain, not public good."
  *   **Soft Spot:** Distinguishing "public good" from "private gain" is exactly the political contest I'm trying to move out of the artifact.

  **7. The Historical Correction (STS / Winner Scholar)**
  *   **The Question:** "You're leaning on the Low-Bridge example. Moses didn't care about exit costs; he cared about who owned buses. The artifact's politics came from the zoning laws, not the bridge height. You're fetishizing the concrete."
  *   **The Reply (90s):** "The zoning laws are the *intent*, but the bridge is the *enforcement*. Without the bridge, the law is just paper. My thesis is that the politics *resides* in the bridge because that's where the cost is incurred. Whether Moses intended it or not is secondary to the fact that the concrete imposes the cost. I'm shifting focus from the *origin* of the politics (the designer's mind) to the *mechanism* of the politics (the user's wallet/time)."
  *   **Soft Spot:** This concedes that design is secondary to policy, undermining the claim that design is the primary site of intervention.

  **8. [HOPE NOBODY ASKS] The Measurement Problem**
  *   **The Question:** "How do you objectively measure 'cost' across different users? $100 is nothing to a corporation and everything to a student. If cost is subjective, your metric collapses."
  *   **The Reply (90s):** "It is subjective, which is why we need standardized testing scenarios, similar to accessibility audits. We don't measure 'difficulty walking' for every individual; we measure against a ramp slope standard. We can model 'exit cost' against a baseline user profile. It's a heuristic, not a physics equation. The goal is to flag gross asymmetries, not calculate exact prices."
  *   **Soft Spot:** This admits the theory is vague and relies on the very procedural standards (audits) I claimed to supersede.

  ---

  ### STRATEGIC MOVES

  **1. The Preemptive Concession**
  *   **Do this:** In your closing remarks, explicitly carve out **safety-critical systems**.
  *   **Say:** "To be clear: I am not arguing for symmetric exit on nuclear scram buttons or surgical locks. Where physics or immediate bodily harm is the constraint, asymmetry is protection. I am targeting *administrative* and *economic* lock-in."
  *   **Why:** This neutralizes Objection #1 before it becomes a mob mentality. It signals you aren't insane to the engineering faculty.

  **2. The Survival Reply**
  *   **The Pivot:** If cornered on whether designers *can* actually change exit costs (Objection #2), your survival depends on **Objection #3 (Epistemic Barrier)**.
  *   **Why:** If you admit designers can't control market forces, your theory is useless. You must hold the line that *legibility* and *modularity* are design choices within the designer's control, even if the market is hostile. This keeps the agency in the room.

  **3. The "True But Swallow" Reply**
  *   **The Trap:** Someone will ask if *all* asymmetry is bad (e.g., parental controls, accessibility defaults).
  *   **The Truth:** Sometimes asymmetry is benevolent (paternalism).
  *   **The Swallow:** Do not defend benevolent paternalism vigorously. If you say "Yes, designers should decide when users are protected," the engineers will claim *all* their restrictions are protective.
  *   **Strategy:** Deflect. "That's a question of *legitimacy*, not *mechanism*. My framework measures the asymmetry; democracy decides if it's justified. Don't ask the artifact to be the judge."

  ---

  ### ABANDONMENT CONDITIONS
  *I will abandon the Exit Cost Asymmetry account if:*

  1.  **The Causality Break:** Empirical evidence shows that lowering technical exit costs does not increase user autonomy because the *social* penalties for exiting (e.g., losing access to a peer network) remain total regardless of the artifact's design. (i.e., If the artifact is only 5% of the lock-in, fixing it is performative).
  2.  **The Engineering Impossibility:** It is demonstrated that for complex integrated systems (like modern OS or EVs), security and safety *require* such deep integration that modularity (the prerequisite for exit) fundamentally compromises the system's function. (i.e., If symmetry makes the artifact break).
