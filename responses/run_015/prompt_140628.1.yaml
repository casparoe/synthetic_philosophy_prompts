      *   Counter: The *structure* of their lives is bioethical, even if their *experience* is existential. The tension between the two is where the theory bites.

  4.  **Develop the Verdict:**
      *   *Option A: Counterexample.* (Too strong? NLGM doesn't refute the logic, it exposes the moral cost.)
      *   *Option B: Irrelevant.* (False. The premise is biotech.)
      *   *Option C: Demonstration of Limits/Political Blind Spot.* (This feels right. The distinction works technically but fails morally/politically.)
      *   *Decision:* The novel is a **demonstration of the distinction's political limits**. It shows that the distinction can remain logically coherent while facilitating atrocity because it ignores the *status* of the bodies involved.

  5.  **Assess the Claims:**

      *   *Claim 1:* **Survives, but needs refinement.** Normal-function accounts (Boorse) define health statistically/biologically. They *do* separate health from welfare. NLGM radicalizes this by making the separation lethal. It's not that the account *fails*, but that its moral neutrality is weaponized.
      *   *Claim 2:* **Strongest Claim.** This hits the core of the "single patient" assumption. Bioethics usually assumes a dyad (doctor-patient). NLGM introduces a triad (donor-recipient-system). The distinction collapses because it cannot adjudicate between two "patients" where one is instrumentally defined.
