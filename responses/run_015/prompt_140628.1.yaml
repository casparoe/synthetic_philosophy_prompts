      *   *Claim 2:* Donation is therapy for the recipient (restoring function) but induced deficit for the donor (never ill). Does the distinction presuppose a single patient whose good is the reference point? Is this a defect or feature?
      *   *Claim 3:* "Completion" (death) is the endpoint of a therapeutic protocol for a non-patient. Does the vocabulary have resources to describe this, or does it fall silent? Is the silence informative?

  3.  **Evaluate the "Protest Novel" Objection:**
