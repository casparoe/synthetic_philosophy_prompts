answer: |-
  This is a precise and well-posed problem. You are encountering a situation where the "governing equations" (the axioms of decision theory and evolutionary dynamics) are agreed upon in the abstract, but the "constitutive relations" (the mapping of those axioms to physical agents) are in dispute.

  Here is the diagnosis you requested, structured by your specific questions.

  ### 1. Verbal or Substantive?
  It is both, but layered. The dispute is **verbal** at the level of model definition and **substantive** at the level of model application.

  *   **The Verbal Layer:** The Evolutionary Theorist is technically correct regarding the *formal definition* of the canonical one-shot Prisoner's Dilemma. In standard game theory, "one-shot" is a boundary condition that stipulates causal independence ($P(Opponent=C | I=C) = P(Opponent=C)$). If you define the domain by this stipulation, Camp 1 wins by tautology. Camp 2 is effectively arguing for a different boundary condition (logical dependence) while using the same name for the game.
  *   **The Substantive Layer:** The dispute becomes substantive when asking which model applies to *real* systems. Camp 1 argues that rationality must be defined by the causal structure of the specific interaction. Camp 2 argues that rationality (and evolutionary fitness) tracks the logical structure of the decision algorithm itself, regardless of causal isolation. This is not merely verbal; it is a disagreement about the topology of the decision node. Is the agent a "black box" outputting a signal (Camp 1), or is the agent an instance of a function $f(x)$ where the opponent is running $f(x)$ (Camp 2)?

  **Diagnosis:** The stalemate exists because Camp 1 is doing **Philosophy of Action** (what should a mind do in an idealized causal vacuum?) while Camp 2 is doing **Evolutionary Biology** (what algorithms survive in a population of similar algorithms?). They are solving different differential equations but calling them by the same name.

  ### 2. The "Procedural Overlap" Parameter
  Your hypothesis is correct in spirit, but the parameter is not new; it is simply being suppressed by Camp 1's definition.

  *   **Identification:** Your "procedural overlap" maps directly to **Hamilton's $r$** (coefficient of relatedness) in the biological context, and to the **correlation coefficient $\rho$** in the game-theoretic context (specifically in the analysis of Correlated Equilibria or Evidential Decision Theory).
  *   **Validity:** The parameter is worth keeping, but it does not dissolve the dispute; it relocates it.
      *   If overlap $= 0$ (Causal Independence): Camp 1 is right. Defection is the unique equilibrium.
      *   If overlap $> 0$ (Logical or Genetic Correlation): Camp 2 is right. Cooperation can be the stable strategy.
  *   **The Evolutionary Theorist's Objection:** Their objection ("one-shot stipulates correlation away") is a defense of the *idealized model*, not the *physical system*. It is analogous to an aerodynamicist saying, "In inviscid flow, drag is zero." You are replying, "But real air has viscosity." They are replying, "Then you aren't talking about inviscid flow."
      *   **Verdict:** The objection refutes your hypothesis only if the goal is to analyze the *textbook definition* of the one-shot game. It fails if the goal is to analyze *biological interaction*. The parameter is essential for the latter.

  ### 3. Where does the Burden of Argument sit?
  The burden is split because the camps are answering different questions.

  *   **Camp 1 (Causal Decision Theory):** Burden is to defend the claim that "rationality" must ignore logical correlations between identical algorithms. They must defend the **Causal Markov Condition** applied to decision nodes. In fluid terms, they must defend why the constitutive law should be Newtonian even when the fluid exhibits memory.
  *   **Camp 2 (Evidential/Functional Decision Theory + Evolution):** Burden is to demonstrate that the "procedural overlap" is physically robust enough to sustain the payoff shift. They must show that the "identity of decision procedure" is not broken by noise, mutation, or private information. In fluid terms, they must measure the Reynolds number to prove viscosity matters.

  **Progress requires:** Acknowledging that Camp 1 describes the **limit case** (overlap $\to$ 0) and Camp 2 describes the **generic case** (overlap $> 0$). The burden is on Camp 1 to explain why the limit case is the normative standard for "rationality" if it applies to almost no real-world biological agents.

  ### 4. Normative, Formal, or Empirical?
  It is all three, running simultaneously, which causes the confusion.

  1.  **Normative:** What does "should" mean? Maximize causal impact (Camp 1) or maximize expected utility given all evidence, including logical evidence (Camp 2)?
  2.  **Formal:** How do we represent the counterfactual? "If I were to cooperate..." (Camp 1: implies no change in opponent) vs. "If my algorithm outputs cooperate..." (Camp 2: implies opponent's algorithm outputs cooperate).
  3.  **Empirical:** What is the actual overlap in the population? (This is the only question that can be settled by data).

  **The Core Error:** The debate treats the Normative question as if it can be answered without settling the Formal representation of the agent, and treats the Formal representation as if it is independent of the Empirical reality of the agents.

  ### 5. The Fluid Mechanics Analogy (Equilibrium vs. Dynamics)
  Your intuition about the iterated game (large equilibrium set $\to$ focus on dynamics) is astute, but the analogy to the one-shot debate is slightly off.

  *   **Iterated Game:** The issue is **Equilibrium Selection**. There are many stable states; dynamics (history, drift) determine which one is reached.
  *   **One-Shot Debate:** The issue is **Constitutive Relations**. It is not that there are many equilibria for the *same* equations. It is that the two camps are writing down *different equations* for the stress-strain relationship of the agent.
      *   Camp 1: Stress depends only on local strain rate (Causal).
      *   Camp 2: Stress depends on the global field configuration (Logical/Correlated).

  **A Better Analogy:** Think of the dispute as **Continuum vs. Discrete**.
  Camp 1 treats the agents as continuum points with independent boundary conditions. Camp 2 treats them as discrete particles with shared wavefunctions (to borrow from physics).
  *   **Is the burden on dynamics?** No. The burden is on the **constitutive law**. Before you ask about the dynamics of the flow (evolution of frequencies), you must agree on the viscosity of the fluid (the decision theory of the agent).
  *   **Progress:** Progress will not come from studying the dynamics of the iterated game. It will come from a **singular perturbation analysis**. You need to show that as "procedural overlap" approaches zero, does the solution converge smoothly to Defection? Or is there a discontinuity? (In Newcomb-like problems, there is often a discontinuity). If there is a discontinuity, Camp 1's "limit case" is a singular point that tells you nothing about the neighborhood (real agents).

  ### Summary Diagnosis
  1.  **Keep the Parameter:** Your "procedural overlap" is the control parameter for the phase transition between the two camps. It is effectively Hamilton's $r$ or logical correlation $\rho$.
  2.  **The Dispute is Category Confusion:** Camp 1 is defining **Rationality** (normative ideal). Camp 2 is defining **Fitness** (evolutionary outcome). They coincide only when overlap is zero.
  3.  **The Evolutionary Theorist:** Is hiding behind a definition. Stipulating away correlation makes the model tractable but renders it inapplicable to evolved organisms, who are *defined* by shared ancestry and shared cognitive architecture.
  4.  **What Counts as Progress:**
      *   **Not** a theorem proving one side right within the standard axioms (since the axioms are the dispute).
      *   **Yes** a formalism that explicitly includes the overlap parameter (e.g., Parametric Decision Theory) and shows the stability conditions for Cooperation as a function of that parameter.
      *   **Yes** an empirical measurement of "decision procedure similarity" in real dyads.
  5.  **Final Verdict:** The debate is substantive, but it is currently disguised as a verbal dispute about the definition of "one-shot." The "one-shot" label is being used to enforce a zero-overlap boundary condition. If you rename the problem "The Interaction of Correlated Algorithms," Camp 1's objection vanishes, and the question becomes purely empirical (how much correlation exists?) and formal (how does utility scale with correlation?).

  You are correct: the equations are not in dispute, but the **constitutive relation of the agent** is. Until the group agrees on whether an agent is a causal node or a function instance, the "governing equations" will yield different solutions.
