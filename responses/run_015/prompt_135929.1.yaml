          *   *Camp 1 (Classical/Causal Decision Theory - CDT):* One-shot = independent causal nodes. Defection dominates. Cooperation requires changing the game (iteration, reputation, etc.).
          *   *Camp 2 (Evidential/Functional Decision Theory - EDT/FDT + Evolution):* Identical agents/procedures imply correlation. Cooperating is rational if you predict the other does the same. Evolution selects rules/dispositions, not act-tokens.
          *   *User's Hypothesis:* The dispute is about "procedural overlap" (physical/causal sharing of decision processes). If overlap = 0, Camp 1 wins. If overlap = 1, Camp 2 wins. It's an empirical parameter.
