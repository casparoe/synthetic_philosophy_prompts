prompt: |-
  I don't have any academic background — I work in insurance claims and I moderate a neighborhood Facebook group — but I keep walking into the same kind of argument, and what I want is a tool for it rather than a reading list. I have no library access, so please don't send me toward papers or authors or titles; I need something I could actually run at a kitchen table. The shape is always the same: two people agree on every fact anyone could check, agree that they agree, and still won't stop. My brother-in-law and I went round for an hour on whether his sourdough starter is alive, having already settled everything about metabolism, reproduction, and cells. Our group burned a whole meeting on whether the vacant lot on Fourth Street counts as blighted, which matters because the wording of a city grant turns on it. And when I read online that enormous old questions — whether numbers exist, whether there is really a table there in addition to the particles — might be nothing but disputes about words, I can't tell whether that's a deep point or a way of changing the subject.

  So here's the ask: write me the specification for a test that tells you whether a disagreement is merely verbal, meaning a clash of meanings dressed up as a clash about the world, or genuinely substantive. The purpose fixes the standard: this has to be usable by the people having the argument, in real time, with no philosopher in the room, on disputes where the facts are already settled. Give me each requirement together with the case that motivates it — a case I could actually hand to someone — and why the test is broken without it. What it must handle: disagreements that survive after both sides stipulate the same definition; cases where one person is simply using the word incorrectly rather than using it differently; disputes about where to draw a line on a continuous scale, like whether a lot is blighted or a room is clean; terms whose meaning is fixed in advance by a contract or statute; disputes about things everyone agrees don't exist; and cases where the two sides are covertly arguing about which meaning we ought to adopt instead of about the facts. What it must not do: rule everything verbal just because the parties agree on the evidence, or treat a verdict of verbal as the same verdict as pointless. It also has to say what is left of a dispute once it is declared verbal, whether the real argument has moved to which usage we should adopt, and whether the test should give the same verdict for the sourdough case and the existence-of-numbers case or whether the stakes are allowed to change the answer. Mark which requirements are non-negotiable for my purpose and which are preferences that someone with different aims could reasonably drop.

  The part I most want is the tensions. I suspect there is a real conflict between requiring that the verdict depend only on what the two speakers mean and what facts they have, and requiring that the test never dissolve a dispute whose classification carries money or legal consequences, but tell me if there is a worse pair, and if some subset of the list cannot be satisfied together then say plainly that the specification itself has a hole in it. Then: which single requirement does the most work in knocking out the obvious candidate tests — including the one my friend keeps proposing, where you ask whether each side would take a small bet on their claim — and one paragraph on how the two approaches I can picture hold up against the list, the one where you replace the contested word with a made-up word and see whether the argument survives, and the one where you say the disagreement was really about which usage to adopt all along. No scorecard beyond that paragraph; the criteria are what I am paying for.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**

      *   **User Profile:** Non-academic, works in insurance claims, moderates a neighborhood Facebook group. Practical, needs a "tool for the kitchen table," not a reading list.
      *   **The Problem:** Recurring arguments where facts are agreed upon, agreement on agreement is established, but the fight continues (e.g., sourdough starter "alive," vacant lot "blighted," existence of numbers/tables).
      *   **The Goal:** A specification for a *test* to distinguish "merely verbal" disputes (clash of meanings) from "substantive" disputes (clash about the world), usable in real-time by the participants.
      *   **Required Content:**
          *   Requirements with motivating cases (kitchen-table examples).
          *   Explanation of why the test breaks without each requirement.
          *   Specific scenarios to handle: stipulated definitions, incorrect vs. different usage, borderline cases (continuous scales), legal/contractual terms, non-existent entities, covert normative disputes (which meaning *ought* to be used).
          *   Specific constraints: Don't rule everything verbal just because evidence is agreed; don't treat "verbal" as "pointless"; explain what remains after a verbal verdict; address stakes (sourdough vs. numbers).
          *   Mark requirements as Non-Negotiable vs. Preference.
          *   **Crucial:** Identify tensions/conflicts between requirements. Acknowledge holes if the spec is impossible.
          *   **Crucial:** Identify the single requirement that knocks out obvious candidate tests (like the "betting test").
          *   **Crucial:** Evaluate two specific approaches (substitution test vs. normative shift) against the list in one paragraph.
          *   **Constraint:** No scorecard beyond that paragraph. Focus on the criteria.

  2.  **Deconstruct the Challenge:**

      *   The core philosophical problem here is the "Verbal Dispute" debate (Carnap, Chalmers, Thomasson, etc.), but translated into plain English for a claims adjuster/moderator.
      *   The user wants a *specification*, not a philosophical essay. It needs to look like a standard operating procedure (SOP) or a checklist.
      *   *Tension Alert:* The user asks for a test that works on legal/contractual terms (where meaning is fixed externally) *and* ordinary language (where meaning is fluid). They also ask for a test that distinguishes "incorrect usage" from "different usage." This is hard because "incorrect" usually implies an external standard, while "different" implies internal variance.
      *   *Tension Alert:* They want to know if stakes change the verdict (sourdough vs. numbers). Philosophically, truth shouldn't depend on stakes, but pragmatically, a moderator cares more about the grant money than the bread.
      *   *Tension Alert:* They suspect a conflict between "internal meaning" and "external consequences." I need to validate this.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: The Translation Test.* Can we rephrase without the word? (Classic Carnap).
          *   *Case:* Sourdough.
          *   *Why needed:* To isolate the word from the concept.
          *   *Breakage:* Fails on legal terms where the specific word *is* the trigger.
      *   *Req 2: The Stakes Independence.* Does the verdict change if money is on the line?
          *   *Case:* Vacant lot grant vs. Sourdough.
          *   *Why needed:* To prevent "verbal" from just meaning "unimportant."
          *   *Breakage:* If we ignore stakes, we might call a legal dispute verbal when it's actually about contract interpretation (which is substantive in law).
      *   *Req 3: The Normative Check.* Are they fighting about how the word *should* be used?
          *   *Case:* "Blighted" (policy goal) vs. "Alive" (biological fact).
          *   *Why needed:* To catch covert policy arguments.
          *   *Breakage:* Hard to distinguish from substantive disagreement about facts.
      *   *Req 4: The Error vs. Variance.* Is one person just wrong about the dictionary/law?
          *   *Case:* Someone thinks "blighted" means "ugly" but the law says "structurally unsafe."
          *   *Why needed:* To stop people claiming "verbal dispute" when they just didn't read the contract.
          *   *Breakage:* Requires access to the external standard (law/dictionary).

      *   *Refining for the "Specification" Format:*
          *   Need to make these crisp.
          *   Need to highlight the *Tensions*. The user specifically asked for the tensions to be the highlight.
          *   The "Hole": You cannot have a test that relies *only* on speaker intent AND respects external legal definitions simultaneously without an appeals process to the external authority.

  4.  **Addressing the Specific Constraints:**

      *   *Non-Negotiable vs. Preference:*
          *   Non-Negotiable: Must distinguish error from difference. Must handle legal/contractual fixed meanings. Must identify residual normative disputes.
          *   Preference: Stakes independence (pragmatically, stakes matter for moderation).
      *   *The "Killer" Requirement:* Which one kills the "Betting Test"? The Betting Test fails because people bet on *words* differently than *facts*. The requirement is "The Translation/Paraphrase Requirement." If you can't rephrase the claim without the term and still disagree, it's verbal. Betting doesn't test this.
      *   *The Two Approaches:*
          *   *Substitution (Made-up word):* Good for isolating meaning, bad for legal terms where the specific label triggers the outcome.
          *   *Normative Shift (Fight about usage):* Good for policy, bad for science (sourdough).
      *   *Tensions:* The big one is Internal Consistency vs. External Authority. If the test relies on what *speakers mean*, it ignores the law. If it relies on the law, it ignores the speakers.

  5.  **Developing the Specification (Drafting the Content):**

      *   *Title:* Protocol for Dispute Classification (PDC).
      *   *Structure:* Requirements 1-5. Each with Case, Rationale, Failure Mode.
      *   *Tensions Section:* Explicitly address the conflict the user suspected + the worse one (Error vs. Difference).
