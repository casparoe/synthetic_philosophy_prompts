      *   Actually, the user's suspected tension is the real killer. If the test is internal (what do you mean?), it fails legal cases (what does the statute say?). If the test is external (what does the statute say?), it fails kitchen table cases (what do we mean by alive?).
      *   *Decision:* I will frame the "Hole" as the incompatibility between *Descriptive Accuracy* (what they mean) and *Prescriptive Authority* (what the rule says).

  7.  **Final Polish:**

