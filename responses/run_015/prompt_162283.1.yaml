answer: |-
  # Protocol for Dispute Classification (PDC)
  **Version:** 1.0 (Kitchen Table Edition)
  **Purpose:** To determine if a disagreement is *Verbal* (clash of definitions/usages) or *Substantive* (clash of facts/world-states) when all observable evidence is already agreed upon.

  ## I. Requirements Specification

  ### Requirement 1: The Translation Test (Non-Negotiable)
  *   **The Rule:** The dispute is verbal if, and only if, both parties can rephrase their claims entirely without using the contested word (or its synonyms) and find that they no longer disagree on the resulting sentences.
  *   **Motivating Case:** **The Sourdough Starter.** You and your brother-in-law agree on the metabolism, cell division, and chemical output of the starter. You say, "It has cells," he says, "It has cells." You say, "It metabolizes," he says, "It metabolizes." The only sentence you disagree on is "It is alive."
  *   **Why the Test Breaks Without It:** Without this, you cannot separate the *label* from the *properties*. If you skip this, you might treat a fight about the word "alive" as a fight about biology, leading to endless arguments about cells that you already agree on.
  *   **Failure Mode:** If you cannot rephrase without the word, the dispute is substantive (or the word is indispensable to the concept).

  ### Requirement 2: The Error vs. Variance Check (Non-Negotiable)
  *   **The Rule:** The test must distinguish between a party using a word *differently* (valid variance) and a party using a word *incorrectly* relative to an agreed standard (error). If an external standard exists (dictionary, law, contract) and one party is ignorant of it, the dispute is not verbal; it is a mistake of fact regarding the rule.
  *   **Motivating Case:** **The Vacant Lot Grant.** The city statute defines "blighted" as "structurally unsafe." Neighbor A argues the lot is blighted because it is "ugly." Neighbor B argues it is not blighted because it is "structurally sound."
  *   **Why the Test Breaks Without It:** Without this, Neighbor A can claim, "We just define blight differently," to bypass the law. A verbal dispute verdict cannot override a contractual or legal definition.
  *   **Failure Mode:** Treating ignorance of a rule as a "difference of opinion" allows parties to opt out of binding agreements by claiming semantic disagreement.

  ### Requirement 3: The Residual Normative Identification (Non-Negotiable)
  *   **The Rule:** If a dispute is declared verbal, the test must output the *remaining* question: "Which definition should we use?" It must not classify the dispute as "pointless."
  *   **Motivating Case:** **The Existence of Numbers.** Two people agree on all physics and accounting practices. One says "Numbers exist," the other "Numbers are fictions." They agree on all math operations.
  *   **Why the Test Breaks Without It:** Without this, declaring a dispute "verbal" shuts down conversation. In reality, the argument has shifted to: "Is it more useful to talk as if numbers exist?" This is a substantive argument about *language policy*, even if it isn't about the world.
  *   **Failure Mode:** Calling it "just verbal" dismisses legitimate policy debates about how our language should carve up reality.

  ### Requirement 4: The Stakes Independence Clause (Preference)
  *   **The Rule:** The classification of the dispute (Verbal vs. Substantive) should not change based on the money or consequences involved.
  *   **Motivating Case:** **Sourdough vs. Insurance Claim.** The sourdough argument is about pride; the insurance claim is about $50,000. The semantic structure is identical (agreement on facts, disagreement on classification).
  *   **Why the Test Breaks Without It:** If stakes change the verdict, you lose the ability to train intuition. You need to recognize the *shape* of the argument regardless of the pressure.
  *   **Failure Mode:** If you treat high-stakes verbal disputes as substantive, you waste resources fighting over definitions when you should be negotiating which definition to adopt.
  *   **Note:** This is marked **Preference** because, pragmatically, a moderator might need to treat a legal definition dispute as substantive to enforce a ruling, even if philosophically it is verbal.

  ### Requirement 5: The Borderline Tolerance (Non-Negotiable)
  *   **The Rule:** The test must acknowledge that some words refer to continuous scales (clean, blighted, tall) where the disagreement is about where to draw the line, not the properties of the object. This counts as verbal *unless* a specific cutoff is codified.
  *   **Motivating Case:** **The Clean Room.** You agree on the amount of dust, the arrangement of objects, and the bacteria count. One says "It's clean," the other "It's dirty." No statute defines "clean."
  *   **Why the Test Breaks Without It:** Without this, you will force a binary verdict on a gradient problem. The dispute is about the *threshold*, not the *state of the room*.
  *   **Failure Mode:** Treating threshold disputes as factual errors leads to impossible demands for more evidence (e.g., "Measure the dust again!") when the evidence is already sufficient.

  ---

  ## II. Tensions and Holes in the Specification

  You suspected a conflict between **Internal Meaning** (what the speakers mean) and **External Consequences** (legal/financial stakes). That conflict is real, but there is a worse one embedded in the requirements above.

  **The Fatal Tension: Requirement 1 (Translation) vs. Requirement 2 (Error/Standard).**
  Requirement 1 asks us to look *only* at what the speakers mean and whether they can translate their claims. Requirement 2 demands we check an *external* authority (law, contract, statute) to see if someone is just wrong.
  *   **The Conflict:** You cannot run a test that relies *only* on the speakers' internal agreement (kitchen table style) while also enforcing external legal definitions. If the speakers *don't know* the legal definition, Requirement 1 says "Verbal" (they mean different things), but Requirement 2 says "Substantive/Error" (one is violating the contract).
  *   **The Hole:** The specification has a hole here. You cannot have a purely internal test that respects external authority. To fix this, you must add a **Pre-Condition**: "Before running this test, verify if an external definition exists." If yes, the test is void; the external definition rules. If no, proceed to the kitchen table test. Without this Pre-Condition, the PDC will falsely validate contract violations as "verbal disputes."

  **The Second Tension: Requirement 3 (Residual Normative) vs. Requirement 4 (Stakes Independence).**
  If the stakes are high (insurance payout), the "residual normative" question ("Which definition should we use?") is actually a substantive power struggle. Philosophically, it's still about language. Pragmatically, for you as a moderator, it is a fight about resources. Requirement 4 wants to call it verbal to calm things down; Requirement 3 admits the fight is now about policy, which is just as heated as the factual claim. You cannot promise that labeling a dispute "verbal" will lower the temperature if the definition controls the money.

  ---

  ## III. The Killer Requirement

  **Requirement 1 (The Translation Test)** is the single requirement that does the most work in knocking out obvious candidate tests, including your friend's **Betting Test**.

  Your friend suggests: *"Ask them if they'd take a small bet on their claim. If they won't bet, it's verbal."*
  Requirement 1 destroys this because people will bet on *linguistic conventions* just as fiercely as facts. In the Vacant Lot case, Neighbor A might happily bet $100 that the City will *accept* the definition of "ugly = blighted," even if they know the statute says otherwise. They are betting on social outcome, not physical fact. The Betting Test measures confidence or risk tolerance, not semantic alignment. Only the Translation Test reveals that if you remove the word "blighted" and describe the cracks in the foundation, the neighbors actually agree. The Betting Test cannot isolate the word from the world; the Translation Test forces that isolation.

  ---

  ## IV. Evaluation of Candidate Approaches

  **The Substitution Approach** (replace the contested word with a made-up word like "glorp") holds up well against Requirement 1 and 5 but fails Requirement 2. If I ask, "Is the lot glorp?" it helps us see we are arguing about a label, but it makes us ignore that the law says "blighted," not "glorp." It treats legal terms as ordinary language, which is dangerous. **The Normative Shift Approach** (say "you are arguing about which usage to adopt") satisfies Requirement 3 perfectly but fails Requirement 4 and the Stakes constraint. Telling two people fighting over a grant that they are "just arguing about usage" feels like gaslighting when the usage determines who eats. It is philosophically accurate but pragmatically volatile. The Substitution test is safer for de-escalation; the Normative Shift is more honest about the remaining work.
