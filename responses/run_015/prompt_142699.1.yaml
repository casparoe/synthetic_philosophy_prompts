  **Project Title:** The Climate Risk Pool: Intergenerational Obligations as Mutual Insurance

  **Abstract**
  Most debates on intergenerational climate justice get stuck in the same loop: how much should we save for the future (Rawls) or how much should we discount their welfare (economics). It treats future people like passive beneficiaries waiting for a handout or victims waiting to be harmed. I want to try something different for this semester project. I'm proposing we look at future generations as co-insured parties in a moral risk pool. Basically, we aren't just sending capital down the timeline; we're sharing the burden of uncertainty together.

  **The Core Question**
  The precise question driving this is: does this insurance-contract framing actually restructure cross-generational obligations, or is it just distributive justice in different clothes?

  **Why This Matters (The Gap)**
  Existing work leaves this open because most accounts frame obligations as direct harm-avoidance or capital-transfer. They don't account for mutual risk-bearing. If we're all in the same pool, the logic of who owes what changes when the risk materializes differently than expected. Current theories don't have a good way to handle that variance without falling back on standard savings principles.

  **Approach & Scope**
  Since this is a one-semester scope, I'm keeping it tight.
  1.  **Theory:** Apply contractarian risk-pool logic to climate obligations.
  2.  **Contrast:** Map this against standard intergenerational models (like the just savings principle).
  3.  **Case Study:** Test it on one concrete allocation problem, specifically carbon-budget liability. Who pays when the budget is blown?

  **Success vs. Failure**
  A result counts as a success if I can show the insurance model demands different actions than the savings model in the case study. It's a failure if the insurance framing collapses back into standard distributive justice without changing the outcome. Basically, if the math ends up the same, the theory is just cosmetic.

  **Note on Feasibility**
  Keeping the scope realistic means I won't solve the whole non-identity problem, just focus on the risk allocation piece. It's about seeing if the lens changes the picture, not fixing the whole enviromental crisis in 15 weeks.
