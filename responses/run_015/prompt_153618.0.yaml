      *   **The Goal:** Explain the conceptual boundary between finking and masking, evaluate the "self-finking mask" idea, and determine if the disposition vanishes or stays hidden.
      *   **Constraint:** Keep it conceptual, don't just list philosophers (e.g., avoid "Martin said X, Lewis said Y").

  2.  **Deconstruct the Concepts (Finks vs. Masks):**
      *   *Disposition:* A property like "fragility." Standard analysis: If $x$ is fragile, then if $x$ is struck, $x$ breaks.
      *   *The Problem:* Sometimes things are fragile but don't break when struck (masks), or things aren't fragile but break when struck (finks/mimics), or things lose their fragility right when struck (finks).
      *   *Masking:* The disposition *remains present*, but something else interferes with the *manifestation*. The causal power is there, but the output is blocked.
          *   *Analogy:* A loaded gun with the safety on. It's still deadly (disposition), but the trigger mechanism is blocked (mask).
      *   *Finking:* The disposition *itself is lost or altered* at the very moment the stimulus occurs. The causal power disappears right when it's needed.
          *   *Analogy:* A glass that turns into steel the millisecond before it hits the floor. It wasn't masked; its intrinsic nature changed.

  3.  **Apply to the Mug Scenario (Round 1):**
      *   *Setup:* Mug has sensor + magnetic cushion.
