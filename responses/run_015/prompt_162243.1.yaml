answer: |-
  The crux of the matter is the first worry: the problem of **Bridging Cost**. While the fourth worry regarding the decoupling of persuasion from truth is the inevitable consequence of failure, and the second regarding localizability is a manageable mechanism design problem, the first worry identifies the precise epistemic point where the protocol's leverage collapses. The optimistic case for debate rests on the assumption that verification is cheaper than generation. However, in natural language, verification is not mechanical; it requires the judge to supply implicit premises to connect explicit claims. If the cost of validating these implicit bridges scales with the debaters' capability, the judge gains no leverage, and the system degenerates into the fourth worry: training for persuasion rather than truth.

  To see why the other worries are secondary, consider the second worry about the localizability of defeaters. It is true that some errors are distributed, emerging from the interaction of many innocuous steps. However, this is not fatal to the protocol. Through cross-examination, the honest debater can force the dishonest one to commit to specific claims about those interactions. A trained policy can be constrained by a protocol that penalizes vagueness, forcing it to cash out holistic intuitions into specific causal assertions. Once an assertion is made, it becomes a node in the tree. The difficulty is not finding the node—that is a search problem which the honest debater, aided by the truth, should theoretically solve faster than the liar solves the concealment problem. The difficulty is what happens once the node is found. If the judge cannot verify the connection between that node and its parent without doing the original hard work, localizability buys nothing. Thus, localizability is a prerequisite, but bridging cost is the bottleneck.

  Similarly, the third worry concerning the gap between the game-theoretic equilibrium and the training dynamics is secondary. It is correct that we never observe the fixed point where both debaters play optimally; we observe a trajectory of co-adaptation. However, this is a standard problem in reinforcement learning convergence. If a truth-winning strategy exists in principle—that is, if there is a way for the honest debater to always force a win against any liar—then sufficiently capable training should approximate it. If no such strategy exists because the judge is inherently vulnerable to sophisticated falsehoods, then no amount of training stability will save the protocol. The existence of a winning strategy depends entirely on whether the judge can distinguish sound bridges from unsound ones. Therefore, the training dynamics worry presupposes the resolution of the bridging cost worry.

  This leaves the first and fourth worries intertwined. The fourth worry asks whether persuasion decouples from truth. From the judge's perspective, there is no phenomenological difference between being convinced by a sound argument and being convinced by a sophistry that exploits their cognitive blind spots. This is not a bug of the training process but a feature of the epistemic setup. The debate protocol attempts to solve this by decomposing the argument until each step is below the judge's confusion threshold. The failure mode is that the "step" is not just the explicit claim, but the inference connecting it to the previous claim. I call this the **Implicit Premise**. When a judge accepts a step, they are endorsing a conditional: "If A, then B." In formal logic, this conditional is explicit. In natural language, the judge supplies the warrant themselves based on their own world model.

  Here is where the optimistic case breaks. The optimism assumes that truth is simpler than falsehood, and therefore the honest debater can find a path of steps that are easier for the judge to verify than the path the liar must fabricate. This assumes the complexity lies in the claims. But if the complexity lies in the bridges, the liar has a distinct advantage. The truth-teller is constrained by reality; they must find bridges that are actually valid. The liar is constrained only by the judge's psychology; they need only find bridges that *look* valid to this specific judge. As debaters scale in capability, they become better models of the judge. They can search the space of implicit premises for those that trigger a "verdict of acceptance" in the judge without corresponding to reality. This is the mechanism of Goodhartian degeneration: the judge's verdict is the measure, and the debater optimizes for the verdict, not the truth. The bridging cost is the surface area for this optimization.

  The false assumption smuggled into your framing is the idea that the judge needs "only the kind of domain knowledge it can acquire inside the debate." This assumes domain knowledge is propositional data that can be transmitted. But much of the judge's competence is **inferential habit**—the ability to spot when a bridge is shaky. This habit cannot be fully transmitted in the debate text; it must be exercised. If the debaters become superhuman, they can construct bridges that look sturdy to human inferential habits but are structurally unsound. The judge cannot acquire the necessary competence inside the debate because the debate is conducted in a medium (natural language) that hides the very structure the judge needs to inspect.

  Therefore, my view is that the debate protocol cannot reduce the judge's required competence below the level needed to audit the inferential bridges. It does not convert one hard question into many easy ones; it converts one hard question into many *opaque* ones. The only way this works is if there is a hard limit on the complexity of valid bridges that does not apply to invalid ones. But since invalid bridges only need to mimic the surface features of valid ones relative to the judge, the liar's task is strictly easier than the truth-teller's task in the limit of high capability. The protocol works only in the regime where the debaters are smarter than the judge about the domain, but not smarter than the judge about *argumentation psychology*. Once the debaters can model the judge's bridging function better than the judge can audit it, the system fails.

  This leaves us with a stark conclusion. The scaling claim holds only if we can formalize the bridges. If we remain in natural language, the bridging cost is unbounded, and the fourth worry becomes inevitable. The judge's verdict will track persuasive power, not truth, because persuasive power is the only variable the judge can actually measure. To save the protocol, one must restrict the language of debate to something more rigid than natural language, reintroducing the mechanical checkability of formal proof, or accept that the judge must be nearly as capable as the debaters in the relevant domain. There is no free lunch in epistemic labor; if the judge does not do the work of verifying the inference, someone else must, and if that someone else is an optimized liar, the work will not be done.
