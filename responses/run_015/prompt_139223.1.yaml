  ### Editor's Notes & Meta-Analysis
  *Before circulating the draft below, consider these four points regarding your specific questions:*

  1.  **The 3-Way Cut:** Your distinction (Decomposition, Aggregation, Internalization) is **not fake**, but it is leaky. Decomposition and Aggregation are often inverse sides of the same tree node. However, for the purpose of this document, keeping them separate is useful: Decomposition focuses on *task framing*, Aggregation on *information flow*, and Internalization on *model architecture/training*. I have retained them in Section 1 but tightened the definitions to prevent overlap.
  2.  **Verbal Disputes:** A significant portion of the friction is verbal, specifically around the word **"Alignment."** Decompositionists tend to define it operationally (output matches the amplified system); Residualists define it normatively (output matches human intent via a robust process). I have flagged this in Section 3 (Crux A). If you can get them to agree to use "Target Specification" vs. "Process Robustness" instead of fighting over "Alignment," you can cut 30% of the document length.
  3.  **Crux (c) Test:** Your proposed test (recombination/perturbation) is **load-bearing**. It directly tests whether the distilled model has internalized the *algorithm* or just the *function*. I have formalized this in Section 4.
  4.  **Tone:** I have stripped all evaluative language (e.g., "optimistic," "skeptical") in favor of descriptive labels ("Camp A," "Camp B" or "Decompositionists," "Residualists" as you defined).

