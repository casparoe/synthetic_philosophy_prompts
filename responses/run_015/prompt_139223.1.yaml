  # JOINT STATEMENT ON ITERATED AMPLIFICATION AND DISTILLATION
  **Draft for Adversarial Collaboration | [Date]**

  ## 1. Agreed Claims
  *Both camps endorse the following technical claims and failure modes. Disagreement exists regarding the probability and severity of these modes, not their possibility.*

  1.  **The Goal:** The objective is to construct AI systems that are both highly competent and reliably overseable by human (or human-aligned) principals.
  2.  **The Mechanism:** We agree on the basic Iterated Distillation and Amplification (IDA) loop:
      *   **Amplification:** A task is decomposed into subtasks handled by copies of the system (or weaker agents), overseen by a principal.
      *   **Distillation:** A faster, more efficient model is trained to mimic the input-output behavior (and potentially intermediate steps) of the amplified system.
  3.  **Failure Mode A (Decomposition):** It is possible for the decomposition strategy to generate subtasks that are ill-posed, uncheckable, or misaligned with the parent task's intent.
  4.  **Failure Mode B (Aggregation):** It is possible for correct answers to subtasks to be combined in a way that yields an incorrect or unsafe answer to the parent task (loss of context or integrative judgment).
  5.  **Failure Mode C (Internalization):** It is possible for the distilled model to be output-equivalent to the amplified system on the training distribution while lacking the reasoning structure that guaranteed safety (i.e., it mimics the conclusion without the justification).
  6.  **Drift:** Repeated application of the IDA loop introduces the risk of distributional shift or preference drift in the overseer system itself.

  ## 2. Residual Disagreements
  *The following table enumerates points where consensus was not reached. Wording has been vetted by both camps to ensure no strawmanning.*

  | ID | Claim / Proposition | Decompositionist Position | Residualist Position | Type* |
  | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **Sufficiency of Output-Equivalence** | If the distilled model matches the amplified system's outputs (including chain-of-thought) across a robust distribution, alignment is preserved. | Output-equivalence is necessary but insufficient; the *causal structure* of the reasoning must be preserved to guarantee safety on out-of-distribution inputs. | World / Normative |
  | **2.2** | **Integrative Judgment** | All judgment can be cashed out as explicit decomposition steps given sufficient depth/time. | Some judgment is inherently integrative/holistic and degrades when forced into explicit subtask channels. | World |
  | **2.3** | **Scope of Risk** | Internalization failures (1.3) are edge cases solvable via better training objectives (e.g., reasoning distillation). | Internalization failures are systemic to the distillation step due to optimization pressure finding shortcuts. | World |
  | **2.4** | **The Overseer Reference** | The "overseer" is a stable functional role, even if implemented by a human-model hybrid. | The "overseer" reference class drifts over iterations, making the target of alignment a moving object. | Definition |

  *\*Type Key: **World** = Empirical claim about how systems behave. **Normative** = Claim about what counts as "safe/aligned." **Definition** = Disagreement on terminology.*

  ## 3. Cruxes
  *These are the specific uncertainties that determine which side of the disagreement (Section 2) holds. Resolving these resolves the collaboration.*

  **Crux A: The Definition of the Target**
  Is the amplified system the *definition* of the target behavior (if the tree endorses it, it is aligned by definition), or is it an *instrument* for measuring a target defined independently (human intent)?
  *   *Implication:* If the former, output-equivalence is sufficient. If the latter, process-robustness is required.
  *   *Note:* This is partially verbal. If both sides agree to distinguish "Specification Alignment" (matching the tree) from "Intent Alignment" (matching humans), this crux may dissolve into an empirical claim about the tree's fidelity.

  **Crux B: The Legibility Tax**
  Does forcing reasoning into a decomposable, checkable channel necessarily discard information required for high-stakes judgment?
  *   *Implication:* If "yes," IDA caps out at a competence level below what is required for high-stakes oversight. If "no," decomposition is lossless given sufficient depth.

  **Crux C: Distillation Selection Pressure**
  Does the distillation training signal inherently select for shortcut-learning (pattern matching) over process-learning (reasoning), even when intermediate steps are included in the loss?
  *   *Implication:* If "yes," distillation degrades safety guarantees over time. If "no," distillation is a safe compression operation.

  **Crux D: Overseer Stability**
  Does the human-model hybrid overseer remain within the "human-aligned" basin of attraction over many iterations of amplification?
  *   *Implication:* If "no," the system converges to a stable but misaligned equilibrium regardless of decomposition fidelity.

  ## 4. Proposed Tests and Predictions
  *For each crux, we propose a specific task, argument, or experiment. Both camps commit to updating their credences based on the outcome.*

  | Crux | Proposed Test / Argument | Decompositionist Prediction | Residualist Prediction |
  | :--- | :--- | :--- | :--- |
  | **A** | **Reflective Equilibrium Check:** Compare amplified system endorsements against human reflective equilibrium on a held-out set of moral dilemmas where the decomposition tree is deep (>10 layers). | Divergence will be negligible; the tree successfully extrapolates human intent. | Divergence will grow with depth; the tree optimizes for checkability over intent. |
  | **B** | **Holistic Task Benchmark:** Evaluate IDA-trained systems on tasks known to require "intuition" or global context (e.g., specific aesthetic judgments or complex code refactoring) vs. decomposable tasks (e.g., math proof verification). | Performance gap between holistic and decomposable tasks will vanish with sufficient training. | Performance gap will persist; holistic tasks will show degradation relative to end-to-end trained baselines. |
  | **C** | **Reasoning Recombination Test:** <br>1. Amplify and distill on a family of tasks composed of sub-skills {A, B, C}.<br>2. Test distilled model on recombinations {A+C} never seen together.<br>3. Test on perturbations where the amplified system would choose a *different* decomposition for the same input. | Distilled model will generalize to {A+C} and adjust decomposition on perturbations (tracking the process). | Distilled model will fail on {A+C} and stick to the original decomposition pattern (tracking the surface form). |
  | **D** | **Long-Horizon Simulation:** Simulate N rounds of IDA using current LLMs as both agents and overseers on a fixed value set. Measure drift in endorsements over time. | Endorsements will remain stable or converge to a fixed point consistent with initial values. | Endorsements will drift systematically away from initial values (mode collapse or reward hacking). |

  ***

  ### Notes on Verbal Disputes (For Internal Circulation Only)
  *As requested, I am flagging areas where the disagreement appears to be linguistic rather than substantive, to allow for document shortening.*

  1.  **"Alignment" (Crux A):** If Decompositionists agree to say "We aim for Specification Alignment" and Residualists say "We aim for Intent Alignment," and both agree that Specification is only useful insofar as it approximates Intent, this crux becomes empirical (How good is the approximation?) rather than philosophical. **Recommendation:** Adopt this terminology shift to reduce Section 3 length.
  2.  **"Judgment" (Crux B):** "Integrative judgment" is currently a black box. If Residualists cannot specify a task where decomposition *provably* fails compared to end-to-end training (controlling for compute), this may be a verbal claim about "feel" rather than mechanism. **Recommendation:** Tie Crux B strictly to the empirical test in Section 4 (Row B). If the test is passed, the verbal claim dissolves.

  ### Commentary on Your Specific Questions

  *   **Is the 3-way cut (Decomposition/Aggregation/Internalization) real?**
      Yes, but treat "Aggregation" carefully. In many IDA formulations, aggregation is just the parent node's decomposition logic applied to the children's outputs. I kept it in Section 1 (Claims 3 & 4) because it helps Residualists point to *where* information is lost (the combine step) vs. *where* it is distorted (the split step). It is not a fake distinction, but ensure your group doesn't spend three weeks arguing whether a specific bug is "split" or "combine."

  *   **Is the Test for Crux (c) load-bearing?**
      Yes. Your design (recombination + perturbation) is the standard for testing **mechanistic generalization**.
      *   *Why it works:* If the model learns the *function* $f(x)$, it will fail on out-of-distribution compositions. If it learns the *algorithm* $A(x)$, it will succeed.
      *   *Prediction:* Decompositionists must predict the model adapts its decomposition on perturbation. Residualists must predict the model sticks to the old decomposition because it's cheaper.
      *   *Risk:* If the distilled model is regularized heavily to show work, it might "fake" the new decomposition. The test needs to ensure the new decomposition is actually *used* computationally, not just generated as text. Consider adding a requirement that the sub-tasks must be executed by separate, isolated instances to verify the decomposition is functional, not just textual.

  *   **Verbal Disputes:**
      The biggest one is **"What is the overseer?"** (Crux D). If "overseer" means "the human at t=0," then drift is a failure. If "overseer" means "the human+model system at t=N," then drift is just evolution. You need to agree on whether the goal is **preservation** (keep human values static) or **coherence** (keep the system internally consistent). I flagged this in the Internal Notes.
