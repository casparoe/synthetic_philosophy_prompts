  Your tentative principle handles the transmission cases (2, 3, 5, 8) and the coincidence case (4) well. Clause (b) correctly excludes the stranger, and the "degree" language accommodates dementia and drift. However, the principle fractures on the unit of analysis and the nature of the carrier.

  The tension between Case 1 (split-brain) and Case 7 (distributed students) reveals that your principle relies on an unstated biological boundary. In Case 1, you insist on "one person" despite functional splitting because the hemispheres share a skull and body. In Case 7, you accept "distributed personhood" across twelve skulls because the patterns reconstruct via deliberation. If identity follows pattern integration (as Hofstadter argues), the skull is irrelevant. The relevant distinction is *homeostatic coupling*. Hemispheres share blood, hormones, and sensory fields; students do not, unless interacting. Your principle says "A brain," but Case 7 proves the carrier can be a network. Case 1 suggests the carrier is an organism, not a hemisphere. To reconcile them, you must define the carrier by functional unity, not cranial boundaries.

  Regarding conservation: reject it. Patterns are information, not matter. If your mother and sister each carry 60% of your grandmother, the total is 120%. This doesn't violate physics; it means the grandmother-pattern is amplified in the family network. Case 6 (teleportation) implies thinning on copying, but Case 3 and 7 imply amplification. Consistency demands you drop the "thinning" intuition in Case 6. Copying doesn't dilute the pattern; it replicates it.

  This brings us to the verdict you should drop: Case 1. Your insistence on "one person" in the split-brain case contradicts the patternism you accept in Case 7. If functional disconnection creates distinct streams of consciousness, the skull shouldn't unify them. Dropping this verdict allows you to treat hemispheres as separate shares when disconnected, aligning with the distributed students. It simplifies your theory: identity follows functional integration, not biology.

  Finally, Clause (c) currently saves you from the LLM problem (Case 9), but only by begging the question ("what that brain does"). An LLM integrates text. To exclude it without arbitrariness, you must specify *what* the patterns integrate with. Hofstadter's "I" cares about its own continuation. An LLM does not. The patterns must serve embodied survival goals, not just textual coherence.

  Verdict: Reword clause (c) to require patterns drive embodied self-maintenance within any integrated system.
