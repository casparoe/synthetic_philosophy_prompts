      *   *Elias's Error:* He assumes the *other* books are still Handwritten because he didn't see them change. He assumes the rule holds for the *rest* of the set. But the presence of the printed book invalidates the category's integrity.
      *   *Actually, deeper Frame Problem:* It's about *side effects*. The new book changes the room's emotion. The room's emotion changes *all* books. Elias assumes only the new book is the variable. He assumes the *state* of the other books is invariant (the frame). But the state is dependent on the room, which changed.
      *   *Let's combine:* He assumes "East Gallery = Cold = Sharp Ink." The new book is warm. He assumes only the new book is warm. He assumes the others remain Sharp. They don't. They blur. He didn't check them because checking everything is impossible (the frame problem).

  8.  **Final Review against constraints:**
