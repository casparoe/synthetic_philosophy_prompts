      *   *Better approach:* The "emotional temperature" changed because of the new book's presence (it radiates a specific emotion). Therefore, *all* books should have shifted text.
      *   *Elias's Mistake:* He assumes *inertia*. "Just because this book appeared, doesn't mean the Biography section changed." That's the frame problem. He assumes things stay the same unless acted upon. But in this library, the *context* changed, so everything potentially changed.
      *   *Specific Inference:* He assumes the *catalog* matches the *shelf*. He assumes that because he didn't see them change, they didn't.
      *   *The Break:* He pulls a book expecting a specific memory (text). The text is different. The rule "Books remain static unless touched" was false. The rule "Books respond to room temperature" was the true law, and the room temperature changed when the new book arrived.

  5.  **Writing - Focus on Sensory and Mental State:**
      *   Cold air, smell of old paper, the shifting ink.
