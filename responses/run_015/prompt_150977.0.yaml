      *   *Scene 3:* The mental calculation. If this book is here, the room's emotional baseline shifted from 'melancholy' to ' dread'.
      *   *Scene 4:* The Frame Problem application. He needs to know if the *Letters from Home* section is still safe. He assumes: "They are in the North Wall. North Wall is insulated from East Gallery anomalies." This is a default assumption.
      *   *Scene 5:* He checks. They are not safe. The text has rewritten itself. He realizes he can't trust the inertia of the archive.
      *   *Scene 6:* Closing thought. He is the only static thing, and he is failing.

  7.  **Polishing the Logic:**
      *   Make sure the "inheritance" is clear.
      *   *Rule:* All books in the East Gallery inherit the 'Static' property unless they are 'Responsive'.
      *   *Wait, the prompt says:* "manuscripts inherit traits from their shelving category unless that category conflicts with a direct observation."
      *   *Let's use:* "All East Gallery books are Handwritten."
