answer: |-
  The frost on the inside of the windowpanes was thicker than usual, crystalline ferns creeping over the glass to meet the cold radiating from the floor. Elias pulled his cardigan tighter, the wool scratchy against his neck, and stepped into the silence of the East Gallery.

  Here, the air always smelled of vanilla and decay. The shelves were mahogany, dark as dried blood, holding the responsive manuscripts. They were quiet this morning. Usually, by nine o'clock, the books would be humming with the day's accumulating anxiety, the ink shifting on the pages like restless ants. But today, the silence was absolute.

  Until he saw the spine.

  It stood between *The Memoirs of a Glassmaker* and *Vol. 4: Tides*. It was bound in grey cloth, unmarked. Elias knew every spine in the East Gallery. He had cataloged them forty years ago, then again twenty years ago, then every year since. He knew that every book in the East Gallery was handwritten. It was a rule of the archive, a constraint of the collection's ontology. *East Gallery implies Handwritten.*

  He pulled the grey book out. It was heavy. He opened it.

  Printed type. Perfect, mechanical serif font.

  Elias froze. The cold from the floor seemed to climb his legs. This was impossible. The East Gallery was a zone of human touch; machines were banned from the wing. But there it was, stark black ink on cream paper. A direct observation conflicting with the category trait.

  He placed the book on the reading desk and stepped back. His heart hammered a slow, uneven rhythm. This was the puzzle that had kept him awake in the deep hours of the night, the puzzle the younger philosophers liked to argue over with wine and cigarettes. The frame problem. When one thing changes, how do you know what *hasn't*?

  If a robot moves a box, it knows the box moved. It does not know, unless told, that the color of the wall remained blue. Elias was the robot. The library was the world. The grey book was the moved box.

  He looked down the long aisle of shelves. Three thousand volumes. To verify the state of the collection, he would have to open every book, check every page, confirm that the ink was still handwritten, that the text still matched his memory of the text. It would take months. By the time he finished, the books would have changed again. The manuscripts responded to emotional temperature, and his own fear was already warming the room. He could feel the pages nearest him beginning to ripple.

  He had to reason. He had to use defaults.

  *Default Rule 1:* All books in the East Gallery inherit the property 'Handwritten'.
  *Exception:* The grey book is Printed.
  *Inference:* The category 'East Gallery' is compromised. The inheritance is blocked.

  But for the others? He couldn't check them all. He had to assume inertia. He had to assume that unless he saw evidence of change, the state remained constant. That was the only way to function. If he doubted everything, he couldn't move.

  He needed the *Letters from Elara*. They were in Section B, Row 4. He needed to read the entry from November 14th, 1974. He remembered it clearly: *The snow stopped at noon, and the silence was so loud it hurt.*

  He walked to Section B. He told himself: *Section B is insulated. The anomaly is in Section A. Therefore, Section B retains the property 'Handwritten' and 'Stable Text'.*

  It was a non-monotonic inference. It held true until new information proved it false. He had no new information. Therefore, it was true.

  He pulled the blue binder. It felt warm. Too warm.

  He opened it. The handwriting was there, Elara's looping script, but the ink was wet. It smeared under his thumb. And the text…

  *The snow never stopped. It buried the house. We are still digging.*

  Elias dropped the book. It hit the floor with a sound like a slap.

  He hadn't checked the room's emotional temperature. He assumed the temperature was localized to the anomaly. He assumed the *frame* of the room—the background conditions—remained static. But the presence of the printed book wasn't just an object; it was a statement. It was a intrusion of the mechanical into the organic. It changed the meaning of the room. The room was no longer a sanctuary of memory; it was a site of contamination.

  The emotional temperature had spiked. The manuscripts responded. They all responded.

  He looked at his hands. They were shaking. He tried to steady them by gripping the edge of the shelf. *Shelves are solid,* he thought. *Wood does not change.*

  But how did he know? He knew it because it had always been true. He knew it because he hadn't observed the wood turning to liquid. But he hadn't observed the books changing until he touched them.

  He moved to the next shelf. *Biographies of the Dead.* He assumed: *These books are heavy. Heavy books do not shift.*

  He pulled one. It was light as paper. He opened it. The pages were blank.

  The logic was unraveling. He was applying heuristics to a system that was fundamentally fluid. He was trying to impose a static frame on a dynamic world.

  *If Category = East Gallery, then Trait = Stable.*
  *Observation = Instability.*
  *Conclusion = Category Void.*

  If the category was void, then no book in the room could be trusted to retain its properties. Not the handwriting, not the weight, not the text. And if the text changed, then the memory it held was gone.

  He thought of Elara. He thought of the snow. If the book said the snow never stopped, then in this room, the snow never stopped. The archive didn't record history; it created the present. And the present was rewriting itself based on the arrival of a grey book he didn't understand.

  He walked back to the reading desk. The grey book lay open. The printed text was sharp, unchanging. It didn't respond to his fear. It was dead matter in a living room.

  He read the first line. *System Update Complete. Legacy Data Purged.*

  Elias felt a coldness in his chest that had nothing to do with the winter. The inheritance was blocked. The past did not inherit into the present. He had assumed that because he remembered the books, they remained as he remembered them. He had assumed his memory was a valid cache for the state of the world.

  He looked around the gallery. The shadows were lengthening, though it was only morning. He wondered if the windows were still there. He hadn't checked them since he saw the frost. He assumed they were glass. He assumed they were solid.

  But why? Because they were yesterday.

  He reached out to touch the mahogany shelf beside him. He expected wood. He expected resistance.

  If he pulled his hand back and it was covered in ink, he wouldn't be surprised. If the shelf whispered Elara's voice, he would nod. The frame had collapsed. There were no background conditions anymore. Everything was foreground. Everything was variable.

  He sat down in the chair. It creaked. For a moment, he cherished the sound. A creak was a constant. A creak was friction, physics, something that obeyed laws.

  *Assumption:* Chairs obey physics.
  *Observation:* The chair held his weight.
  *Inference:* Physics still holds.

  He closed his eyes. He tried to hold onto the image of the library as it was yesterday. The dust motes dancing in the sun. The smell of vanilla. The certainty that *The Memoirs of a Glassmaker* was handwritten.

  But the certainty was gone. He could feel the doubt spreading like the frost on the window. He couldn't verify the dust. He couldn't verify the smell. He could only verify the grey book.

  He was an archivist with no archive. A mind with no memory.

  He opened his eyes and looked at his hands again. They looked old. Spotted. Thin.

  *Assumption:* I am Elias.
  *Observation:* I am sitting in the East Gallery.
  *Inference:* I am the curator.

  But if the books were no longer books, and the room was no longer a room, what was he? He was just another variable in the equation, waiting for the next update to purge his legacy data.

  He reached for the grey book again. He needed to know if the text would change if he cried. He needed to know if his sadness could override the print. He needed to know if anything was safe.

  He touched the page. The ink was cold. It did not smear. It did not care.

  Elias withdrew his hand. He decided not to check the windows. He decided not to check the other books. He would sit here, in the center of the unknown, and assume the chair was solid. He would assume the floor was there. He would assume he was still Elias.

  It was the only way to keep the frame from dissolving completely. He would hold the assumptions tight, even though he knew, with a quiet, crushing certainty, that they were already false.
