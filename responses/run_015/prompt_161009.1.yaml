prompt: |-
  I teach an introductory metaethics course, and next term I want to open the unit on moral disagreement and objectivity with Chinua Achebe's Things Fall Apart instead of with a survey of the psychology literature. I'd like a reading of the novel that takes it seriously as a contribution to one specific argument: the move from the fact that moral judgment varies systematically across cultures — the sample on which most moral-psychology results rest being narrow, Western, educated, industrialised, rich and democratic, and much of the variation that does show up tracking honour-based moralities rather than guilt- or dignity-based ones — to the conclusion that there is no fact of the matter about which morality is right.

  Keep three claims apart in the reading, because I think students collapse them: the descriptive claim about variation; the methodological claim that this variation discredits the intuitions philosophers reason from; and the metaethical conclusion. Then tell me where the novel, instead of illustrating all three at once, resists them. I have two hypotheses I'd rather have tested than flattered. First: the closing scene in which the district commissioner mentally reduces Okonkwo's life to a paragraph in an ethnographic study is routinely taught as a lesson in relativism, when it might equally be a portrait of the opposite failing — an observer entirely confident of his own standpoint, whose problem is indifference rather than relativism. Second: the novel's most interesting material for this argument is not the collision between Igbo and missionary morality but the disagreement inside Umuofia — the misgivings voiced by villagers themselves about the disposal of twins, about the exile imposed for an accidental killing, about Ikemefuna. If moral objection is only intelligible from inside a form of life, then intra-cultural disagreement should do the same argumentative work as cross-cultural disagreement, and the novel may show us something the psychology literature's culture-as-a-single-data-point framing misses.

  Where does the reading break down? The novel has a polemical purpose, written against European representations of Africa, and it is at least as concerned with who gets to tell a people's story as with the metaphysics of value; I don't want to conscript it into a seminar-room argument it was never having. Say what the novel can add to the debate about variation and objectivity that the standard hypothetical cases can't, and what an honest reader has to concede it doesn't show.
reasoning: |-
  Here's a thinking process that leads to the suggested reading guide:

  1.  **Analyze the Request:**
      *   **Context:** Introductory metaethics course.
      *   **Topic:** Moral disagreement and objectivity (specifically the argument from variation to relativism/error theory).
      *   **Text:** Chinua Achebe's *Things Fall Apart*.
      *   **Goal:** Use the novel to open the unit instead of standard psychology literature (WEIRD samples, etc.).
      *   **Key Distinction:** Keep separate: (1) Descriptive claim (variation exists), (2) Methodological claim (variation discredits intuitions), (3) Metaethical conclusion (no fact of the matter).
      *   **Hypotheses to Test:**
          1.  The District Commissioner (DC) scene is often taught as relativism (no objective truth), but might actually show dogmatism/imperialism (confidence in *one* truth, indifference to others).
          2.  Intra-cultural disagreement (Ikemefuna, twins, exile) is more philosophically potent than inter-cultural clash for showing that moral objection is intelligible *within* a form of life.
      *   **Constraints/Caveats:** Acknowledge the novel's polemical purpose (anti-colonial representation). Don't conscript it into an argument it wasn't having. Identify what it adds vs. standard hypotheticals. Identify where the reading breaks down (what it *doesn't* show).

  2.  **Deconstruct the Argument from Variation:**
      *   *Standard Argument:* People disagree about morality $\rightarrow$ Disagreement is deep/systematic $\rightarrow$ Therefore, no objective moral truth (Relativism/Error Theory).
      *   *The Three Claims:*
          1.  *Descriptive:* Cultures differ significantly in moral practices/beliefs.
          2.  *Methodological:* Philosophers' intuitions (usually Western) are biased/unreliable because of this variation.
          3.  *Metaethical:* Therefore, moral statements lack truth conditions/objectivity.

  3.  **Analyze *Things Fall Apart* through this Lens:**

      *   *Descriptive Claim:* Does the novel show variation? Yes, vividly. Igbo customs vs. Missionary/British customs. But also *within* Umuofia.
      *   *Methodological Claim:* Does it discredit intuitions? It challenges the *colonial* intuition that African life is savage/chaotic. It challenges the *philosophical* intuition that "culture" is a monolith.
      *   *Metaethical Conclusion:* Does it support relativism? This is the tricky part. Achebe isn't arguing "nothing is true." He's arguing "Igbo life has order and value."

      *   *Hypothesis 1 (The DC):* The DC represents the *negation* of relativism. He believes *his* truth is the only truth. He isn't saying "Okonkwo's way is true for him, mine for me." He's saying "Okonkwo is a specimen; I am the author." This supports the idea that the danger isn't relativism, but *hegemony*.
      *   *Hypothesis 2 (Intra-cultural disagreement):* Obierika's questioning of the oracle, Okonkwo's internal conflict, the *osu* outcasts. This shows moral reasoning happens *inside* the tradition. It's not just "Culture A says X, Culture B says Y." It's "Culture A says X, but Member Z asks: Is X just?" This undermines the idea that morality is *constituted* solely by cultural consensus.

  4.  **Drafting the Reading Guide - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the shift from psych lit to literature. Define the "Argument from Variation."
      *   **Distinguishing the Three Claims:** Explicitly map the Descriptive, Methodological, and Metaethical claims onto the text.
      *   **Testing Hypothesis 1 (The DC & Relativism):** Address the ending. Argue that the DC is a *dogmatist*, not a relativist. The tragedy isn't that truth is relative, but that power silences truth. This complicates the move from "disagreement" to "no truth."
      *   **Testing Hypothesis 2 (Intra-cultural Disagreement):** Focus on Obierika and Ikemefuna. Show that moral critique is possible *within* the form of life. This challenges the idea that moral truth is *defined* by cultural boundaries.
      *   **What the Novel Adds:** Thick description, narrative stakes, the role of power in defining "variation." Standard hypotheticals (e.g., "Eskimos kill elders") are sterile; Achebe shows the *cost* of the practices.
      *   **Where the Reading Breaks Down (The Caveats):** Achebe's project is humanist/anti-colonial, not metaethical skepticism. He wants us to see the Igbo as *fully human*, which implies a shared moral ontology, not necessarily fragmented ones. He isn't arguing for error theory. Using it to teach relativism might betray his intent.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure I don't just say "Achebe is a realist." He shows the *tragedy* of conflicting values. But the DC scene is crucial. If the DC were a relativist, the book would end differently. The DC's book title (*The Pacification of the Primitive Tribes...*) implies an objective hierarchy.
      *   *Nuance on Intra-cultural:* Obierika asks "Why?" He doesn't necessarily say "This is false." But he feels "uneasy." This suggests a moral sense that transcends the specific rule. This supports Objectivism (or at least Internal Realism) more than Relativism.
      *   *The "Polemic" Constraint:* I need to be careful not to turn Achebe into a analytic philosopher. The reading must acknowledge that the novel is political. The "objectivity" Achebe seeks is the objectivity of *humanity*, not necessarily the objectivity of *moral propositions* in the metaethical sense.

  6.  **Final Polish:** Structure the response clearly for a professor. Use headings. Ensure the tone is academic but accessible. Check against the prompt's specific requirements (3 claims, 2 hypotheses, breakdown/limitations).

      *(Self-Correction during drafting)*: Wait, the prompt asks me to "Tell me where the novel, instead of illustrating all three at once, resists them." I need to make sure I explicitly state where the novel *pushes back* against the standard argument from variation.
      *   *Resistance:* The novel resists the move from Variation $\rightarrow$ No Truth. It suggests Variation $\rightarrow$ Conflict of Truths (where one might be suppressed by power).
      *   *Resistance:* It resists the idea that Culture = Monolith (via Obierika).

  7.  **Final Review against Prompt:**
      *   3 claims kept apart? Yes.
      *   Hypothesis 1 (DC/Relativism) tested? Yes.
      *   Hypothesis 2 (Intra-cultural) tested? Yes.
      *   Where it breaks down/Polemic purpose? Yes.
      *   What it adds vs. hypotheticals? Yes.

  8.  **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a pedagogically rich pivot. Using *Things Fall Apart* to open a unit on moral disagreement forces students to confront the *human stakes* of metaethical abstraction before they get lost in the logic of the arguments. It also complicates the standard "Argument from Disagreement" (AfD) in ways that survey data cannot.

  Here is a reading guide structured to keep your three claims distinct, test your two hypotheses, and honestly assess where the novel supports and where it resists the metaethical argument.

  ---

  ### I. Distinguishing the Three Claims
  *The standard Argument from Disagreement moves too quickly from (1) to (3). Use the novel to force a pause at each step.*

  **1. The Descriptive Claim (Variation Exists)**
  *   **The Argument:** Moral practices and judgments vary systematically across cultures (e.g., WEIRD vs. Honour-based).
  *   **The Novel's Contribution:** Achebe provides "thick description" rather than data points. We do not just learn that Umuofia exposes twins; we see the ritual, the fear, the religious justification, and the communal enforcement.
  *   **Pedagogical Move:** Ask students to list the specific moral divergences between Umuofia and the Missionaries.
      *   *Treatment of kin (Ikemefuna)*
      *   *Treatment of the vulnerable (twins, *osu*)*
      *   *Concept of justice (exile for accidental killing vs. prison for arson)*
  *   **The Point:** The novel confirms the descriptive claim overwhelmingly. The variation is not superficial; it is foundational.

  **2. The Methodological Claim (Intuitions are Discredited)**
  *   **The Argument:** Because moral intuitions vary, philosophers cannot rely on their own (Western) intuitions as evidence for universal moral truths.
  *   **The Novel's Contribution:** The novel destabilizes the reader's intuition not by saying "your intuition is wrong," but by showing *why* the Igbo intuitions make sense within their ecosystem. Okonkwo is not "evil"; he is a man striving for excellence within a specific teleology.
  *   **Pedagogical Move:** When students recoil at Ikemefuna's death, ask: *Is Okonkwo acting immorally, or is he acting faithfully?* If he acted according to *our* intuition (spare the boy), he would be acting immorally *within Umuofia* (defying the Oracle).
  *   **The Point:** This supports the methodological claim. It shows that "moral competence" is locally indexed. Relying solely on a Western subject's intuition about Ikemefuna misses the internal logic of the action.

  **3. The Metaethical Conclusion (No Fact of the Matter)**
  *   **The Argument:** Therefore, there is no objective truth about which morality is right (Relativism/Error Theory).
  *   **The Novel's Resistance:** **This is where the novel breaks the chain.** Achebe does not write this book to suggest that British morality and Igbo morality are merely "different but equal" language games. He writes to show that Igbo morality *was* a functioning, coherent system that was destroyed.
  *   **Pedagogical Move:** If relativism were true, the destruction of Umuofia would be a neutral translation from one scheme to another. But the novel is a tragedy. Tragedy requires loss, and loss implies that something of value was destroyed, not just changed.
  *   **The Point:** The novel illustrates variation (1) and challenges intuition (2), but it resists the slide into "no truth" (3). It suggests that moral truths can be real, local, and yet vulnerable to power.

  ---

  ### II. Testing Your Hypotheses

  #### Hypothesis 1: The District Commissioner and the Myth of Relativism
  *Standard Reading:* The DC represents the relativist stance: he reduces Okonkwo's complex life to a footnote, showing that all meaning is constructed by the observer.
  *Your Reading:* The DC represents **dogmatic realism**, not relativism.

  **Where the text supports you:**
  The DC is not uncertain. He does not say, "Okonkwo's truth is valid for him." He says Okonkwo's life is merely material for *his* book, *The Pacification of the Primitive Tribes of the Lower Niger*. The title itself asserts an objective hierarchy: there is "Pacification" (good/order) and there are "Primitive Tribes" (bad/chaos).
  *   **Metaethical Implication:** The danger depicted in the closing scene is not the absence of objective truth (relativism), but the **monopolization of truth** by power. The DC is confident there is a fact of the matter: *Civilization is superior to Savagery.*
  *   **Classroom Application:** Use this to distinguish **Relativism** (no view is privileged) from **Imperialism** (my view is the only valid one). The AfD often assumes that if we can't prove objectivity, we get tolerance. The novel shows that if we can't prove objectivity, we might get the DC's indifference. The DC is the embodiment of the error theorist who acts like a realist: "Your values are illusions; mine are policy."

  #### Hypothesis 2: Intra-Cultural Disagreement vs. Culture-as-Monolith
  *Standard Reading:* The moral conflict is between Igbo Culture and British Culture.
  *Your Reading:* The most philosophically potent conflict is within Umuofia (Obierika, Okonkwo, the Oracle).

  **Where the text supports you:**
  Psychology literature often treats "Culture" as a single data point (e.g., "The Igbo value honour"). Achebe shows culture as a site of argument.
  *   **Obierika's Dissent:** Obierika questions the wisdom of the Oracle regarding Ikemefuna ("Why should a suffering child be killed?") and the exile of Okonkwo ("The Earth did not punish him...").
  *   **Metaethical Implication:** If moral truth were *constituted* by cultural consensus (a strong form of relativism), Obierika's dissent would be unintelligible. He would be speaking nonsense. But Obierika is not an outsider; he is a respected elder. His misgivings show that moral reasoning transcends the specific rule. He appeals to a sense of justice that exists *within* the tradition but *against* specific practices.
  *   **Classroom Application:** This undermines the idea that "Culture" is the boundary of moral justification. If intra-cultural disagreement is possible, then "Culture" cannot be the source of moral truth. This suggests that the "Argument from Variation" overstates the coherence of cultures. If cultures aren't monoliths, then the disagreement isn't really "Culture A vs. Culture B," but "Person A vs. Person B," which weakens the relativist conclusion.

  ---

  ### III. What the Novel Adds (vs. Standard Hypotheticals)

  1.  **The Role of Power in Disagreement:**
      Standard hypotheticals (e.g., "Eskimos leave elders on ice floes") present disagreement in a vacuum. *Things Fall Apart* shows that moral disagreement often occurs alongside **asymmetric power**. The British do not win the argument; they win the war. This forces students to ask: Is the "variation" in moral psychology literature truly a difference in *intuition*, or a difference in *material conditions and power*?
  2.  **The Cost of Abstraction:**
      Hypotheticals are sterile. Achebe forces students to feel the weight of the "twin disposal" through the character of Ekwefi. This tests the **Methodological Claim** more rigorously. It is easy to say "my intuition is biased" in the abstract; it is harder to maintain that stance when confronted with a grieving mother in a narrative. It makes the "error" in Error Theory feel like a moral failing.
  3.  **Coherence vs. Truth:**
      The novel shows that a moral system can be internally coherent (the Oracle, the ancestors, the laws) and still be tragic. This helps distinguish **Coherentism** (justification comes from internal fit) from **Realism** (justification comes from fitting the world). Umuofia is coherent; it is not necessarily "right" in a universal sense, but it is not "false" in a nihilistic sense either.

  ---

  ### IV. Where the Reading Breaks Down (The Caveats)

  You must be honest with students about where conscripting Achebe into a metaethics seminar betrays the text.

  **1. The Polemical Purpose (Humanism vs. Metaethics)**
  Achebe's primary goal was not to solve the Euthyphro dilemma but to counter Joyce Cary's *Mister Johnson* and colonial narratives that depicted Africans as soulless savages.
  *   **The Conflict:** Achebe argues for the **humanity** of the Igbo. In metaethical terms, this leans toward a form of **Universalism** (we all share a common moral ontology) rather than Relativism. He wants the British reader to say, "Okonkwo is like me," not "Okonkwo is different from me, and that's fine."
  *   **The Limit:** Using the novel to teach relativism might contradict Achebe's intent. He is not saying "Truth is relative"; he is saying "Their truth was real, and you ignored it."

  **2. The Absence of Metaethical Reflection**
  The characters do not argue about the *status* of their values; they argue about the *content*. Obierika does not say, "The Oracle's authority is socially constructed." He says, "The Oracle is wrong."
  *   **The Limit:** The novel provides *data* for metaethics (disagreement exists, power influences judgment), but it does not provide *theory*. It cannot distinguish between a Relativist explanation (both are right relative to their culture) and a Realist explanation (one is right, the other is wrong, but power obscured the truth). The text is compatible with both.

  **3. The "Tragedy" Problem**
  If you push the Metaethical Conclusion (no fact of the matter), the tragedy evaporates. If there is no objective loss, *Things Fall Apart* is just *Things Changed*.
  *   **The Limit:** To preserve the novel's emotional core, you must implicitly grant some form of Objectivism (something of value was destroyed). But if you grant Objectivism to save the tragedy, you undermine the Relativist conclusion you are using the book to illustrate. You have to tell students: *The novel works better as an argument against Relativism than for it.*

  ### Summary for the Syllabus
  **Recommended Framing:**
  " We are reading *Things Fall Apart* not to find the answer to moral objectivity, but to see where the standard 'Argument from Disagreement' fails to capture the complexity of moral life. We will look at how the novel confirms that moral views vary (Descriptive), challenges our confidence in our own judgments (Methodological), but ultimately resists the idea that there is no truth to be found (Metaethical). We will pay special attention to the District Commissioner's indifference and Obierika's internal dissent to see if 'culture' is the right unit of analysis for moral disagreement at all."
