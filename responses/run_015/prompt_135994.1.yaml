  # JOINT STATEMENT ON THE DEFINITION AND APPLICATION OF GENOCIDE

  **Signed:**  
  *The Council for Legal Precision (Strict-Constructionist Camp)*  
  *The Coalition for Historical Justice (Expansive-Naming Activist Camp)*

  **Date:** October 26, 2023

  **Purpose:**  
  Following a series of deliberations regarding the classification of mass atrocities, the undersigned parties submit this joint statement. Our objective is not to obscure our profound differences, but to map the exact contours of our agreement and disagreement. We acknowledge that the term "genocide" operates simultaneously as a tool of criminal prosecution and a vessel for moral memory. This document records where our interpretations converge and where they diverge, specifically regarding the 1948 Convention, the legacy of Raphael Lemkin, and the application of the term to historical case studies.

  ### I. Agreed Claims

  Both parties affirm the following propositions as factual premises for further debate:

  1.  **Historical Scope:** Both accept that Raphael Lemkin's original conceptualization of genocide was broader than the final text of the 1948 UN Convention, specifically regarding the inclusion of cultural destruction and political groups.
  2.  **Legal Precedent:** Both accept that international criminal tribunals established since the 1990s (including the ICTR, ICTY, and ICC) have consistently required documented specific intent (*dolus specialis*) to secure a conviction for genocide.
  3.  **Unique Status:** Both accept that the label 'genocide' carries a distinctive moral and legal status that other atrocity-labels (such as crimes against humanity or war crimes) do not replicate in public consciousness or international law.
  4.  **Political Consequence:** Both accept that the politics of labeling affects survivors' recognition and state accountability; the decision to apply or withhold the term has tangible consequences for reparations, memorialization, and diplomatic intervention.

  ### II. Disagreements Table

  The following table outlines the precise positions held by each camp. Each side confirms that the wording in their respective column accurately represents their stance.

  | Issue | Strict-Constructionist Position | Expansive-Naming Activist Position |
  | :--- | :--- | :--- |
  | **Protected Groups** | The 1948 Convention's list (national, ethnical, racial, religious) must remain exclusive. Adding political or cultural groups conflates genocide with other human rights violations and undermines legal certainty. | The 1948 exclusions were politically motivated compromises that must be corrected. Protecting groups defined by political opinion or cultural identity is necessary to prevent the erasure of victims targeted for non-biological destruction. |
  | **Proof of Intent** | Specific intent to destroy a group must be established through direct documentary evidence (orders, manifests, explicit statements). Inference from outcome alone risks convicting leaders for negligence or collateral damage. | Specific intent can be inferred from systemic patterns, bureaucratic scale, and the foreseeable consequences of policy. Demanding direct orders sets an impossible bar for modern state violence where plausable deniability is engineered. |
  | **Primary Risk** | **Dilution:** Broadening the term weakens its power to distinguish the "crime of crimes" from other mass atrocities, potentially reducing the urgency of response to extermination campaigns. | **Exclusion:** Withholding the term from structural destruction repeats the original erasure of the 1948 Convention, denying victims the only vocabulary capable of conveying the totality of their loss. |

  ### III. Cruxes and Test Cases

  We identify two specific cruxes where our theoretical disagreements yield divergent practical conclusions. We have selected specific historical test cases to illustrate these divergences.

  **Crux A: Is dilution a genuine moral harm, or is exclusion the greater harm?**
  *Test Case: The Canadian Residential School System*
  *Context: Systematic cultural destruction and high mortality among Indigenous children, but no single order for total physical annihilation of the group.*

  *   **Strict-Constructionist Prediction:** Calling this system "genocide" weakens the term's power to distinguish Rwanda-style extermination from assimilationist policies. If every severe cultural oppression is genocide, the specific obligation to prevent physical extermination loses its unique urgency.
  *   **Expansive-Naming Prediction:** Withholding the label "genocide" reproduces the 1948 silencing of Indigenous suffering. If the term cannot cover forced assimilation and engineered cultural death, it fails to describe the intent to destroy the group's continuity, thereby denying survivors full moral recognition.

  **Crux B: Can systemic patterns stand in for direct documentary proof of intent?**
  *Test Case: The Holodomor (1932–33)*
  *Context: Widespread famine and displacement in Soviet Ukraine; contested archival proof of intent to destroy the group as such.*

  *   **Strict-Constructionist Prediction:** Without clear intent documentation (explicit orders to destroy Ukrainians as a national group), the legal category should not apply. To rule otherwise is to substitute historical tragedy for legal proof, risking acquittals in court due to evidentiary standards.
  *   **Expansive-Naming Prediction:** Bureaucratic scale and targeting patterns make intent inferable. The specific targeting of Ukrainian grain quotas and border closures demonstrates an intent to destroy the group's viability. Demanding direct proof ignores how modern states conceal intent while achieving genocidal outcomes.

  ### IV. Analysis of Verbal Dispute

  We were asked to determine whether part of this dispute is verbal—specifically, whether one side is using 'genocide' as a **legal verdict** and the other as a **historical-moral status**.

  **Joint Acknowledgement:**  
  Both parties agree that a significant portion of the dispute is verbal. The Strict-Constructionist camp primarily utilizes "genocide" as a term of art within international criminal law, requiring adjudication standards. The Expansive-Naming Activist camp primarily utilizes "genocide" as a sociological and historical descriptor of outcome and impact, requiring moral recognition standards.

  **Predictions on Resolution:**  
  We record each side's prediction on whether resolving this verbal distinction (i.e., agreeing to use separate terms for legal vs. moral contexts) would settle the substantive conflict.

  *   **Strict-Constructionist Prediction:** Resolving the verbal point will **not** settle the conflict. Even if activists agree to use "moral genocide" separately, the public and political actors will conflate the two. The dilution of the legal term's stigma will occur regardless of semantic precision, ultimately harming the efficacy of international courts.
  *   **Expansive-Naming Prediction:** Resolving the verbal point **would** substantially settle the conflict. If we distinguish "legal genocide" (for prosecution) from "historical genocide" (for truth commissions and memorials), we can acknowledge structural destruction without jeopardizing the evidentiary standards required for criminal conviction. This allows for victim recognition without compromising due process.

  ***

  **Signed,**

  *For the Council for Legal Precision*  
  __________________________

  *For the Coalition for Historical Justice*  
  __________________________
