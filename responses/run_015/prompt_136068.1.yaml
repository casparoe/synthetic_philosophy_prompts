answer: |-
  **Framing Considerations**

  Three framings were considered. First, an *empirical-psychological* approach would investigate how subjects actually report pain intensity versus pleasure. This is unsuitable because the project concerns normative value structure, not psychophysics. Second, a *formal axiological* approach would model value aggregation mathematically. This risks becoming too abstract for a twenty-page paper, obscuring the phenomenological insights driving the intuition. Third, a *phenomenological composition* approach focuses on how discrete moments of experience combine into lives and populations. This is the sharpest framing because it directly targets the student's suspicion: that the lexical threshold borrows plausibility from the single-moment case to justify claims across time and persons. This proposal adopts the third framing.

  ***

  **Project Proposal: The Composition of Suffering**

  **Research Question**
  Under what principle of temporal and interpersonal composition does the phenomenological "crowding out" of intense pain justify a lexical threshold in value aggregation? Specifically, does the inability to experience pleasure *during* intense pain entail that the pain cannot be compensated by pleasure *before, after, or elsewhere*?

  **Background and Gap**
  Standard hedonistic utilitarianism assumes value is additive: pains and pleasures sum across moments and persons to determine the best outcome. Lexical negative utilitarianism rejects this, claiming severe pains outweigh any amount of mild pleasure. However, standard defenses of the lexical view often assert the threshold without explaining the *transition* from the local to the global.

  Your intuition identifies a specific mechanism: intense pain monopolizes consciousness, preventing joint experience with pleasure. This establishes a local incommensurability within a single moment. Yet, most proponents argue this justifies a global lexical priority across a whole life or population. This gap is rarely addressed. The additive view ignores the phenomenology of crowding out; the lexical view asserts the global threshold without proving the local phenomenon scales up. This project targets that missing link: the principle of composition.

  **Methodology**
  Over four months, the research will proceed through conceptual analysis rather than intuition surveys. Surveying intuitions (e.g., asking more people about kidney stones) is insufficient because intuitions vary wildly, as your disagreement with your friend demonstrates. The goal is not to count opinions but to test the structural coherence of the argument.

  *Month 1:* Define the "crowding out" thesis precisely. Analyze whether intense pain truly excludes all pleasure phenomenologically, or merely diminishes attention to it.
  *Month 2:* Test temporal composition. If a moment of pain cannot be compensated *during* itself, can it be compensated by a later pleasure? This requires analyzing whether value aggregates across time or if dominated moments render a life "tainted" irreparably.
  *Month 3:* Test interpersonal composition. Does the isolation of consciousness between persons strengthen or weaken the claim? If pain isolates the sufferer from their own pleasure, does it also isolate them from others' pleasure?
  *Month 4:* Synthesize findings and address the "anticipation wrinkle."

  This method is superior to thought-experiment iteration because it isolates the *premise* required for the lexical view to work. If the principle of composition cannot be stated without begging the question, the view fails.

  **The Anticipation Wrinkle**
  A critical stress test for the composition principle involves anticipation and relief. Pain often carries a cost of dread beforehand and a value of relief afterward. If the "moment" of pain includes its anticipated dread, the phenomenological monopoly extends backward in time. Conversely, if relief is a distinct pleasure, it might compensate for the pain. This wrinkle must be integrated into the temporal composition analysis. If dread extends the "crowded" moment, the lexical threshold might gain traction temporally. If relief functions as compensation, the threshold weakens. The project will determine whether these temporal extensions support the lexical view or reveal it to be unstable.

  **Possible Conclusions**
  1.  *The Composition Principle Holds:* A defensible principle exists (e.g., "Non-Integrability of Dominated States"). This would mean moments where pain crowds out pleasure cannot be summed with other moments; they vetoes the total. This validates the lexical threshold.
  2.  *The Isolation Conclusion:* The crowding-out argument works only for the simultaneous moment. It provides no reason to reject compensation across time or persons. The lexical threshold is unjustified beyond the immediate present.
  3.  *The Collapse Conclusion:* The attempt to define the threshold reveals it relies on simple intensity, not structural composition. The view collapses into a standard intensity-weighted utilitarianism, losing its lexical force.

  **Failure Conditions**
  Honest assessment of failure is crucial. The project fails if:
  *   *Vagueness:* Pain monopolizes experience gradually, not sharply. If there is no clear cut-off where pleasure becomes impossible, a *lexical* threshold (which requires a sharp bound) is untenable. The project must determine if a "fuzzy" threshold can still be lexical or if it demands a sliding scale.
  *   *Circularity:* The principle of composition turns out to be merely a restatement of the conclusion (e.g., "Pains matter more because they matter more").
  *   *Dread Destroys Isolation:* If anticipation means the "moment" of pain bleeds into pain-free time, the phenomenological isolation argument collapses. If I can feel dread while eating a pleasant meal, the pain is not crowding out the pleasure; they are co-occurring. This would undermine the core phenomenological claim.

  **Feasibility**
  This scope is tractable for a twenty-page paper. It avoids surveying the entire history of utilitarianism and focuses on one structural argument. Bi-weekly supervision will ensure the conceptual analysis remains rigorous without drifting into pure psychology. The outcome will be a determinate answer regarding the viability of the composition principle, regardless of whether it supports or undermines the lexical view.
