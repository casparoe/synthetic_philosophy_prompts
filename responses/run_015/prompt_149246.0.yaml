answer: |-
  # The Indeterminacy Protocol: A Decision Checklist for Ambiguous Parses

  **Purpose:** To handle underdetermined user intent without pretending we've solved the philosophical problem. We are not finding truth; we are managing risk.
  **Time Budget:** 2 minutes per case.
  **Operator:** Junior Engineer on shift.

  ---

  ## Part 1: The Procedure

  **Step 1: Check Behavioural History (The "Past Usage" Heuristic)**
  *   **Action:** Look at the user's last 3 interactions.
  *   **Evidence Required:** Did they use this phrase before? What action did they accept or confirm previously?
  *   **Decision:** If history matches a specific database action (e.g., they said "stop" last year and confirmed "pause"), map to that action.
  *   **Stop Point:** If history is empty or contradictory, move to Step 2.

  **Step 2: Assess Reversibility (The "Safety" Value Choice)**
  *   **Action:** Compare the candidate database actions (e.g., `pause_plan` vs `cancel_plan`).
  *   **Value Choice Alert:** We are assuming "reversible" is better than "irreversible". This is a corporate policy, not a linguistic fact.
  *   **Decision:** If one action is easily undone (pause) and the other is destructive (cancel), default to the reversible action.
  *   **Stop Point:** If both actions are equally destructive or equally reversible, move to Step 3.

  **Step 3: Check Contextual Anchors**
  *   **Action:** Scan for temporal or modal markers ("for now", "never again", "maybe", "urgent").
  *   **Evidence Required:** A word that logically excludes one option.
  *   **Decision:** "For now" → Pause. "Never" → Cancel.
  *   **Stop Point (The Quine Limit):** If the phrase allows both interpretations equally (e.g., "stop my plan" with no modifiers), **do not guess**. Flag for human support. This is genuine indeterminacy.

  **Step 4: The Cost-Benefit Override (Engineering Efficiency)**
  *   **Action:** Estimate the cost of being wrong.
  *   **Value Choice Alert:** We are assuming saving support ticket costs is more important than perfect intent matching.
  *   **Decision:** If the cost of a human review exceeds the cost of fixing the mistake later, auto-resolve to the "Safety" option (from Step 2).
  *   **Requirement:** Log this as "Assumed Intent - Low Confidence".

  **Step 5: Log the Analytical Hypothesis**
  *   **Action:** When committing the database change, tag the transaction.
  *   **Requirement:** Add a metadata flag: `translation_confidence: low` and `heuristic_used: [reversibility | history | context]`.
  *   **Why:** So we know later that this wasn't a clear signal, but a forced choice.

  ---

  ## Part 2: Applied Cases

  ### Case 1: "stop my plan for now"
  *   **Parse:** `stop` → {`pause_plan`, `cancel_plan`}.
  *   **Step 1 (History):** User has paused twice before, never cancelled. **Evidence for Pause.**
  *   **Step 2 (Reversibility):** Pause is reversible; Cancel is not. **Value Choice: Prioritise Pause.**
  *   **Step 3 (Context):** "for now" implies temporality. **Evidence for Pause.**
  *   **Decision:** Map to `pause_plan`.
  *   **Confidence:** High. The temporal marker reduces indeterminacy.
  *   **Log:** `heuristic_used: context + history`.

  ### Case 2: Error token "gavagai" in system logs
  *   **Parse:** `gavagai` → {`system_restart`, `db_lock`, `unknown_error`}.
  *   **Step 1 (History):** Token never seen before. **No evidence.**
  *   **Step 2 (Reversibility):** Unknown. Could be catastrophic.
  *   **Step 3 (Context):** No context. It is a raw token.
  *   **Stop Point:** This is the Gavagai scenario. There is no behavioural evidence to fix the reference. Any mapping is pure fiction.
  *   **Decision:** **Flag for Senior Engineer.** Do not map to a database action.
  *   **Log:** `translation_confidence: zero`, `reason: radical_indeterminacy`.

  ### Case 3: "make it stop" (High volume, low value user)
  *   **Parse:** `make it stop` → {`pause_plan`, `cancel_plan`}.
  *   **Step 1 (History):** No history.
  *   **Step 2 (Reversibility):** Pause is safer.
  *   **Step 3 (Context):** None.
  *   **Step 4 (Cost-Benefit):** Human review costs £5. Fixing a mistaken pause costs £0 (user can resume). Fixing a mistaken cancel costs £10 (support call to restore).
  *   **Decision:** Auto-resolve to `pause_plan` to save money.
  *   **Honesty Flag:** **This procedure produces a quick engineering answer that probably misreads intent.** The user might be angry and want cancellation permanently. We are choosing "Pause" because it's cheaper for us to fix, not because we know what they mean.
  *   **Log:** `heuristic_used: cost_efficiency`, `translation_confidence: low`.

  ---

  ## Part 3: What This Procedure Cannot Do (Limitations)

  **1. The Schema Ontology Problem**
  Quine would argue we are smuggling in a massive assumption: that the user's mental model matches our database schema. We assume the world is divided into "pause" and "cancel". The user might conceive of "stopping" as "hiding the bill" or "ignoring the service". Our procedure forces their intent into *our* boxes. We cannot detect when the user's concept doesn't exist in our database at all.

  **2. The Myth of the Museum**
  The procedure assumes there is a "correct" meaning hidden in the user's head that we are trying to uncover. Quine says there isn't. There is only behaviour. When we log `translation_confidence: low`, we are admitting we aren't finding meaning, we are assigning it. The procedure cannot distinguish between "we don't know the meaning" and "there is no fact of the matter about the meaning".

  **3. Hidden Analytical Hypotheses**
  We are assuming:
  *   Users are rational agents (they want the least destructive outcome).
  *   Past behaviour predicts future intent (ignoring that users change their minds).
  *   English words map consistently to SQL commands.
  *   **Critical Limit:** If our database schema changes (e.g., we remove "pause"), the procedure will break because the "Safety" heuristic no longer applies. The indeterminacy doesn't vanish; it just shifts to a different pair of options.

  **4. The Social Element**
  Quine's problem is about radical translation between strangers. Our users are in a contract with us. There is a legal layer here. Sometimes "stop" means "cancel" because the Terms of Service say so, regardless of linguistic ambiguity. This procedure treats it as a linguistic problem, but it is often a legal one. The checklist cannot resolve contractual ambiguity.

  **5. Feedback Loops**
  If we always default to "Pause" (Step 2), users learn that "stop" means "pause". They will start saying "delete" when they mean "cancel". Our behaviour changes their language. The procedure treats language as static, but it is dynamic. We are training the users to speak our database schema, not vice versa.

  ---

  **Final Note for the Team:**
  This checklist is a risk management tool, not a truth machine. When you hit a Stop Point, you are not failing to find the answer; you are recognising that the answer does not exist in the data. Hand it off. Don't fake certainty.
