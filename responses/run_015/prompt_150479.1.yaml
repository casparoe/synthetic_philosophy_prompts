      *   *Strategy:* I need to decouple "what the person says" from "what is good for them" without triggering a rebellion about paternalism. I need to broaden "craving" to "goal-directed tension." I need to make the "Two Routes" feel intuitive before labeling it "tranquilism."

  3.  **Drafting the Dependency Structure:**
      *   *Problem:* If I start with the thesis ("Only absence of craving matters"), they will reject it immediately based on their measurement training (life satisfaction *is* the metric).
      *   *Solution:* I need to establish a distinction between *State* (phenomenology) and *Metric* (self-report). Then I need to redefine "Craving" away from clinical addiction to "active motivational tension."
      *   *Order:*
          1.  Challenge the authority of self-report (gently).
          2.  Redefine "Craving" (motivational tension vs. clinical urge).
          3.  Define "Suffering" (negative affect vs. mere discomfort).
          4.  *Then* the Thesis makes sense.

