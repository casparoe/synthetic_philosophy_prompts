answer: |-
  You are already holding the right tool in your hand. Your intuition about **network externalities versus functional optimization** is essentially correct, but to make it a single working principle that handles your conflicting cases, you need to refine it slightly.

  The unifying principle is **The Topography of the Fitness Landscape.**

  Imagine every solution (a keyboard layout, a genetic code, a planetary definition) as a point on a landscape where height equals "utility" or "fitness."
  *   **Path Dependence** occurs when there are many peaks of roughly equal height, separated by deep valleys. Once you climb one, the cost of going down into the valley to climb a different one is too high. You are locked in by **Switching Costs**.
  *   **Convergence** occurs when there is one dominant peak that is significantly higher than the rest. No matter where you start, gravity pulls you toward it. You are pulled in by **Functional Necessity**.

  Your verdicts are mostly consistent with this, but to make the principle hold water, you need to adjust two of them: **Calculus** and **Pluto**. And you need to split your verdict on **DNA**.

  Here is how the principle sorts your cases, and where you need to shift your thinking.

  ### 1. The Clear Path Dependence (High Switching Costs, Equal Peaks)
  **QWERTY, Rail Gauge, Writing Direction.**
  In these cases, the "peaks" are flat. Dvorak is not vastly superior to QWERTY; standard gauge is not vastly superior to broad gauge; Left-to-Right is not vastly superior to Right-to-Left. Because the functional difference is negligible, the only thing that matters is *coordination*. Once enough people are on one peak, the cost of moving (retraining typists, relaying track, reprinting books) creates a lock-in. These are pure network externalities. Your verdicts here are solid.

  ### 2. The Clear Convergence (One High Peak)
  **Genetic Code Structure.**
  You are right to call this inevitable. This is math, not history. With 4 bases, doublets ($4^2=16$) cannot code for 20 amino acids. Triplets ($4^3=64$) provide enough room plus redundancy for error correction. Quadruplets are metabolically wasteful. There is a "global maximum" here dictated by information theory and chemistry. Any life form is subject to these math constraints.

  ### 3. The Adjustments (Where the Principle Forces Your Hand)

  **Case A: Calculus Notation (Leibniz vs. Newton)**
  *Your verdict:* Unsure.
  *Principle verdict:* **Convergence.**
  This is the strongest test of "Functional Optimization." If notation were just network effects, British mathematics (using Newton's dots) should have progressed just as well as Continental mathematics (using Leibniz's $dy/dx$). It didn't. The British school stagnated for a century because Newton's notation was clumsy for multi-variable problems. Leibniz's notation wasn't just "sticky"; it was *cognitively superior* for manipulation. The scientific community didn't just "lock in" to Leibniz; they migrated to him because his tool was sharper. If we met aliens doing calculus, they might use different symbols, but their notation would likely separate variables differentially like Leibniz, not time-derivative them like Newton.

  **Case B: DNA vs. RNA Storage**
  *Your verdict:* Conflicted (Path Dependent on Earth, but maybe Convergent universally).
  *Principle verdict:* **Split the difference.**
  You need to distinguish between *Earth's History* and *Universal Biology*.
  *   **On Earth:** It is Path Dependent. We are stuck with DNA because the transition happened 3 billion years ago. The switching cost is extinction.
  *   **In the Universe:** It is Convergent. RNA is too unstable for large genomes. If you want complex, multicellular life, you need the chemical stability of deoxyribose. The "fitness peak" for complex life is DNA (or a chemical analog with the same stability properties). So, for your question "does life everywhere end up with DNA?": **Yes.** That is functional optimization winning out.

  **Case C: The Pluto Vote (The one you must drop)**
  *Your verdict:* Path Dependent (Contingent on the people in the room).
  *Friend's verdict:* Convergent (Physical criteria were inevitable).
  *Principle verdict:* **Your friend is right.**
  This is the verdict you need to drop to keep your principle consistent. Here is why: The "utility" of a scientific definition is its predictive power and consistency. Before 2006, the definition of "planet" was becoming functionally useless because we were discovering dozens of Pluto-like objects. The "valley" was a taxonomy that didn't match reality.
  The *vote* was the mechanism, but the *pressure* was physical reality. If that specific committee hadn't voted, another one would have five years later when Eris was confirmed. The "Clearing the Neighborhood" criterion isn't arbitrary like QWERTY; it reflects dynamical dominance. This is **Convergence on Empirical Necessity**. The lock-in wasn't historical; it was forced by new data.

  ### 4. The Prediction: Base-10 Counting
  **Question:** Is base-10 path dependent (ten fingers) or convergent (mathematical optimality)?
  **Prediction:** **Path Dependent.**

  Here is the application of the principle:
  *   **Functional Optimization:** Mathematically, Base-10 is mediocre. It is only divisible by 2 and 5. Base-12 (dozenal) is superior (divisible by 2, 3, 4, 6). Base-8 or Base-16 are superior for computing. There is no "global maximum" at 10.
  *   **Switching Costs:** High (retraining brains, replacing infrastructure).
  *   **Constraint:** The only reason we are at Peak-10 is anatomy.

  If we met intelligent aliens, would they use Base-10? **Only if they also happened to have 10 manipulators.** If they have 6 fingers, they will likely use Base-6 or Base-12. If they have 8, Base-8. Because there is no mathematical "gravity" pulling everyone to 10, the specific number is a historical accident of vertebrate evolution.

  ### Summary of the Principle
  To keep your philosophy consistent, adopt this rule:

  **"If the outcome is dictated by physics, math, or empirical data, it is Convergent. If the outcome is dictated by coordination, anatomy, or legacy infrastructure, it is Path Dependent."**

  *   **QWERTY/Rail/Writing:** Coordination/Legacy $\rightarrow$ Path Dependent.
  *   **Genetic Code/Calculus:** Math/Logic $\rightarrow$ Convergent.
  *   **DNA (Universal):** Chemistry $\rightarrow$ Convergent.
  *   **Pluto:** Empirical Data $\rightarrow$ Convergent.
  *   **Base-10:** Anatomy $\rightarrow$ Path Dependent.

  Your gut was right on almost everything, but you gave too much credit to "contingency" in the Pluto case. Science is one of the few human endeavors where reality eventually vetoes history.
