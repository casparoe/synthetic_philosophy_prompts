      *   **Task:** Identify the flaw in the reasoning (likely a scope shift or equivocation), suggest which step to reject, and explain the costs/benefits of that rejection.

  2.  **Deconstruct the Argument Chain:**
      *   (1) *Premise:* Sortition is good because of cognitive diversity + bias elimination.
      *   (2) *Universalization:* If it's good for legislatures, it's good for *any* body with similar biases.
      *   (3) *Analogy:* Expert bodies (drug panels) have similar biases.
      *   (4) *Application:* Therefore, use filtered sortition for expert bodies.
      *   (5) *Constraint:* Legislatures can't be filtered without losing the diversity benefit.
      *   (6) *Dilemma:* Reject legislative sortition OR accept filters for legislatures.
      *   (7) *Consequence:* Both options kill the original theory.
      *   (8) *Conclusion:* The theory proves too much or too little.

  3.  **Identify the Weak Link:**
      *   The user suspects a scope shift between (2) and (5).
      *   *Hypothesis:* The nature of the "decision" and the required "cognitive diversity" differs between legislation and technical regulation.
      *   *Step (2)* claims universality: "If cognitive diversity is the operative good, then it applies to *any* collective decision procedure..."
      *   *Step (5)* claims a constraint on filtering: "In legislative domains, however, there is no minimal-competence filter..."
      *   *The Real Issue:* The definition of "competence" and the *type* of diversity required differ between the two contexts.
      *   *Legislative Competence:* Value judgments, trade-offs, priorities (What *should* we do?). Every citizen has competence here by virtue of being affected.
      *   *Regulatory Competence:* Technical causality, safety thresholds, statistical significance (What *can* we do safely?). Not every citizen has competence here.
