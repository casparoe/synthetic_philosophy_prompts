      *   **Reject (2):** Deny universality. Argue that cognitive diversity matters *differently* for legislation vs. regulation.
          *   *Cost:* Must articulate *why* the diversity matters more or differently for legislation. Needs a distinction between "value diversity" and "heuristic diversity."
          *   *Benefit:* Saves the legislative sortition argument without forcing absurd drug panels.
          *   *Verdict:* Strong candidate. This addresses the "scope shift" the user sensed.

      *   **Reject (3):** Deny that expert bodies suffer from analogous biases.
          *   *Cost:* Empirically weak. Regulatory capture is real.
