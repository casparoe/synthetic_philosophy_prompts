  *Counter:* If you filter for civic knowledge, you filter for education/class. So (5) is actually robust. The weakness is definitely in applying the *same standard* to both domains in (2).

  *Decision:* Stick with rejecting (2). It's the cleanest cut that preserves the user's core commitments.

