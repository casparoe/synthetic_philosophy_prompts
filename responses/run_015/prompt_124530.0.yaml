answer: |-
  You have correctly identified that the argument contains a structural flaw, and your intuition about a scope shift between (2) and (5) is accurate. However, the equivocation is slightly deeper: it lies in the definition of **"collective judgment"** in step (2).

  To preserve (1) and (3) as you wish, you should **reject (2)** and replace it with a qualified premise that distinguishes between *epistemic* judgments (truth-tracking) and *axiological* judgments (value-weighing).

  Here is the analysis of why (2) fails, the specific modification required, and the exact price you pay for making this move.

  ### The Diagnosis: The Equivocation in Step (2)

  Step (2) states: *"If cognitive diversity is the operative good, then it applies to any collective decision procedure vulnerable to the same biases..."*

  This treats "collective judgment" as a monolithic category. It assumes that the *function* of a drug-approval panel is sufficiently similar to the *function* of a legislature that the same remedy (sortition) applies if the same disease (bias/homogeneity) is present.

  However, the **nature of the competence required** differs fundamentally between the two bodies:
  1.  **Expert Regulatory Bodies (Epistemic/Truth-Tracking):** Their primary task is to determine causal relationships and safety thresholds (e.g., "Does Drug X cause liver failure?"). While industry capture is a risk (as you note in 3), the *minimum competence threshold* is non-negotiable. A layperson cannot evaluate pharmacokinetic data regardless of how diverse their heuristics are. Here, cognitive diversity is a *secondary* good that must be balanced against technical accuracy.
  2.  **Legislatures (Axiological/Will-Forming):** Their primary task is to weigh competing values, interests, and risk tolerances (e.g., "Is the benefit of Drug X worth the cost to the public budget?"). There is no external "truth" to track. The "competence" required is the capacity to understand one's own interests and values. Here, cognitive diversity (derived from lived experience) is not just a secondary good; it is the *primary source of legitimacy and accuracy*.

  By rejecting (2), you break the chain that forces you to apply legislative sortition logic to technical panels.

  ### The Fix: Replace (2) with (2*)

  You should replace step (2) with a distinction that limits the scope of the cognitive-diversity justification.

  > **(2*)** If cognitive diversity is the operative good, it applies primarily to decision procedures where the task is **weighing competing values and interests** rather than **determining technical causality**. In technical domains, diversity is subordinate to verifiable competence; in political domains, diverse lived experience *constitutes* competence.

  **How this saves your argument:**
  *   **Preserves (1):** Legislative sortition is still justified by cognitive diversity because legislation is fundamentally about values/interests.
  *   **Preserves (3):** Expert panels still suffer from capture and homogeneity.
  *   **Defangs (4):** You no longer *must* conclude that expert panels should be sortitive. You can acknowledge their bias but argue the remedy is transparency, rotation, or conflict-of-interest rules, *not* random selection, because the task requires specific technical literacy that random sampling cannot guarantee.
  *   **Resolves (5):** You can maintain that legislative filters are illegitimate because "legislative competence" is universal (moral agency), whereas "regulatory competence" is specialized (technical knowledge).

  ### The Price: What You Are Buying Into

  Rejecting (2) is the cleanest cut, but it is not free. Here are the three specific costs you incur:

  #### 1. The Boundary Problem (The "Politicization" Cost)
  By distinguishing between "value judgments" (sortition appropriate) and "technical judgments" (sortition inappropriate), you invite the classic Weberian/Schmittian problem: **Who draws the line?**
  *   *Example:* Is setting an air-quality standard a technical judgment (what level of particulate matter causes cancer?) or a value judgment (how much economic cost are we willing to bear for safety?)?
  *   *Cost:* You must concede that many legislative decisions have technical components, and many regulatory decisions have value components. Your defense of sortition now requires a robust theory of **jurisdiction**. You are buying into the need to constantly police the boundary between "administration" and "politics." If the boundary shifts (as it often does), your justification for sortition becomes unstable.

  #### 2. The "Ignorance" Concession
  By admitting that expert panels *cannot* be sortitive because they need technical filters, you implicitly concede that **ignorance is a valid disqualifier** in some governance contexts.
  *   *Cost:* This weakens the rhetorical force of the "anti-elitist" premise. Critics of legislative sortition often argue that macroeconomics or foreign policy are as technical as pharmacology. By accepting the distinction in (2*), you must be prepared to argue why macroeconomic policy is a "value judgment" suitable for laypeople, while drug approval is not. If you cannot distinguish them convincingly, you risk a slippery slope where more legislative functions are reclassified as "technical" and removed from the sortitive body.

  #### 3. A Weaker Critique of Expert Bodies
  You wanted to keep (3) (expert bodies suffer from bias). By rejecting (2), you lose the leverage to demand *sortition* as the solution for those bodies.
  *   *Cost:* You must accept that the remedy for regulatory capture is *not* cognitive diversity via random selection, but perhaps institutional design (e.g., adversarial proceedings, strict recusals). You are conceding that cognitive diversity is not the *universal* antidote to corruption; it is specific to the political sphere. This makes your theory less "grand" but more defensible.

  ### Alternative: Rejecting (4) instead
  If you find the "Boundary Problem" too costly, you could instead **reject (4)**.
  *   *Argument:* Accept (2) (the principle is universal) but deny that "filtered sortition" is the correct application for expert bodies. Argue that for expert bodies, the "filter" (competence) is so narrow that random selection from the qualified pool yields no diversity benefit (all licensed clinicians share the same disciplinary training).
  *   *Cost:* This requires you to argue that the pool of "qualified experts" is inherently homogeneous in a way that the general population is not. This is empirically plausible (medical school socializes heuristics) but requires sociological evidence. It also leaves you vulnerable to the charge: "If the expert pool is too homogeneous for sortition to work, why isn't the citizen pool too homogeneous for legislation?" (You would have to argue that life experience is more diverse than professional training).

  ### Recommendation
  **Reject (2).**

  It aligns best with your desire to keep (1) and (3). It acknowledges the intuition that there is a difference between deciding *what we want* (politics) and deciding *what is true* (science/regulation).

  **The Trade-off Summary:**
  *   **You Gain:** A robust defense of legislative sortition that doesn't collapse into absurdity when applied to the FDA. You avoid the "elitism" trap of filtering legislators.
  *   **You Lose:** The claim that sortition is a universal good for all governance. You inherit the burden of defining the boundary between political and technical questions, which is a perennial site of political contestation.

  This moves your theory from a **universal epistemic claim** ("Randomness is always smarter") to a **political legitimacy claim** ("Randomness is the only way to fairly weigh conflicting values"). The latter is historically more durable and philosophically sounder.
