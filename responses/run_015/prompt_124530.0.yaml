  9.  **Final Plan:**
      *   Validate the user's intuition (Yes, Step 2 is the culprit).
      *   Explain the equivocation: "Collective Judgment" covers two distinct types (Technical/Epistemic vs. Political/Axiological).
      *   Propose rejecting/modifying (2).
