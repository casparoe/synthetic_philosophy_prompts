          *   *Verdict:* User wants to keep (3).

      *   **Reject (4):** Accept universality (2) but deny the specific solution (filtered sortition) for expert bodies.
          *   *Cost:* Need an alternative solution for expert bias that doesn't involve sortition.
          *   *Benefit:* Keeps the logic consistent.
          *   *Verdict:* Possible, but less satisfying than distinguishing the domains.

      *   **Reject (5):** Argue that legislative bodies *can* be filtered.
          *   *Cost:* Undermines the democratic/egalitarian appeal of sortition. Admits elites are needed.
