answer: |-
  **The Scenario**
  A seven-member housing co-op board votes on a $50,000 special levy to remediate suspected toxic mold; if the levy passes, the cost is shared equally, but if it fails, the health risk remains. The agent, a board member, believes the mold is highly dangerous, but she knows all seven members received the *identical* inspection report and vote independently based on their private interpretation of that data. She models her six colleagues as epistemic peers, assigning a 0.5 probability to each voting "Yes," which entails a substantial 31.25% chance that her vote is pivotal (a 3–3 tie). The standard inefficacy reply suggests she should vote Yes, as the 31% chance of preventing severe health damage outweighs her $7,000 share. However, because the other members possess the same evidence, a 3–3 split is strong evidence that the inspection report is ambiguous and the health risk is actually low; conditional on being pivotal, the expected harm of the mold drops below the cost of the levy, rendering the expected value of voting Yes negative.

  ***

  **1. The Naive Pivotalness Calculation**
  *   **Formula:** $EV(Yes) = P(Pivotal) \times V(Prevent Harm) - Cost(Share)$
  *   **Inputs:** $P(Pivotal) \approx 0.31$; $V(Prevent Harm) \approx \$100,000$ (prior expected health cost); $Cost = \$7,000$.
  *   **Calculation:** $(0.31 \times 100,000) - 7,000 = \$24,000$.
  *   **Verdict:** **Contribute (Vote Yes).** The high stake of the health risk, weighted by the known high probability of pivotalness, dwarfs the individual cost.

  **2. The Revised Calculation (Conditional on Pivotalness)**
  *   **Formula:** $EV(Yes) = P(Pivotal) \times E[V(Prevent Harm) \mid Pivotal] - Cost(Share)$
  *   **Inputs:** $P(Pivotal) \approx 0.31$; $E[V \mid Pivotal] \approx \$10,000$ (updated credence given 3 peers saw same data and voted No); $Cost = \$7,000$.
  *   **Calculation:** $(0.31 \times 10,000) - 7,000 = -\$3,900$.
  *   **Verdict:** **Do Not Contribute (Vote No/Abstain).** The event of being pivotal carries adverse selection information: it implies the collective epistemic weight is against the "High Harm" hypothesis, collapsing the expected benefit.

  **3. The Single Structural Feature**
  **Common-Value Epistemic Peerhood.** The value of the outcome (whether the mold is actually dangerous) is unknown and common to all voters, and the voters are epistemic peers acting on identical prior data. This makes the *distribution* of other votes informative evidence about the state of the world, creating a negative correlation between the probability of being pivotal and the magnitude of the benefit secured by being pivotal.

  **4. Case With Feature Removed**
  If the other board members voted randomly, or if they possessed *different* information (e.g., they are landlords trying to minimize costs regardless of safety), then a 3–3 split provides no evidence about the mold's toxicity. In this scenario, $E[V \mid Pivotal] = V(Prior)$. The Revised Calculation collapses back into the Naive Calculation, and the standard pivotalness argument successfully mandates contributing.

  **5. Strongest Reply to Defend the Naive Calculation**
  **Causal Decision Theory (CDT).** A proponent of the naive calculation argues that the agent's vote cannot *cause* the other members to have voted differently, nor does it causally influence the physical toxicity of the mold, which is a fixed fact of the past. The correlation between being pivotal and the mold being safe is non-causal (screened off by the inspection report). Therefore, rational choice should maximize expected utility based on the *causal* consequences of the act using prior probabilities, not conditional probabilities that treat the fixed state of the world as dependent on the vote. To condition on pivotalness is to succumb to a "Newcomb-like" illusion where one refuses to act because acting would be evidence that the action was unnecessary.
