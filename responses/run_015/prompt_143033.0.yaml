      *   *Economist's Point:* Good's theorem holds that for a Bayesian maximizer, information value ≥ 0. You can always ignore data. Thus, buying evidence is never irrational per se.
      *   *Counter:* We are not a single Bayesian agent. We are intermediaries.
      *   *Key Issue 1 (Decision Architecture):* Clinicians say won't change. They might be wrong (empirical claim: clinicians often mispredict uptake). But the real deciders are the Guidelines. If they don't care, the data is sterile.
