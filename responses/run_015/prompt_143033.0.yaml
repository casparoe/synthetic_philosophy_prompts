      *   **Flagging Uncertainty:** Note where empirical claims about behavior are made.

  4.  **Drafting - Content & Tone:**
      *   Tone: Respectful but firm. Acknowledge the economist's expertise but contextualize it.
      *   Word Count Check: Need to stay within 600-900.
      *   Specifics: Who? National Guideline Body. What? Written commitment to review guidance based on trial outcomes. When? Before final funding release. Consequence? If not secured, funding withdrawn or moved to next round.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I state the economist's argument strongly? Yes, need to ensure it sounds compelling before critiquing.
      *   *Check:* Did I address the patient rep's point? Yes, regarding the risk of defunding.
      *   *Check:* Did I address the opportunity cost? Yes, £3m vs smaller studies.
