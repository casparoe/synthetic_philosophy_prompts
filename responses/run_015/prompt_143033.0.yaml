          *   Chair: Worried about buying an "expensive fact."
          *   Health Economist: Invokes "Good's theorem" (Value of Information is never negative for a Bayesian expected-utility maximizer).
          *   Patient Rep: Risks/burdens fall on trial participants, benefits/risks (defunding) fall on others.
          *   User's Instinct: Economist's theorem assumes conditions not met (single decision-maker, aligned incentives, costless information).
          *   User's Concerns: Opportunity cost (£3m is most of discretionary budget), clinicians might be wrong about their own behavior, guideline body isn't committed.
      *   **Requirements:**
          *   State Economist's argument strongly (no strawman).
          *   Address specific concerns (Patient rep's point, Opportunity cost, Clinician/Guideline uncertainty).
          *   Take a definite position (Approve, Reject, or Approve-with-Conditions).
          *   Spell out conditions concretely (who, what, when, consequences).
          *   Flag contested readings/empirical claims.
          *   No references/reading lists.
          *   Tone: Professional, defensible, clear bottom line.
          *   Word Count: 600–900 words.

  2.  **Determine the Position:**
      *   The prompt asks me to "take a definite position and argue for it."
