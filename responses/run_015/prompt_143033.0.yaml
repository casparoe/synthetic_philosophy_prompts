      *   The user highlights significant risks: opportunity cost (£3m is most of the budget), patient burden vs. benefit mismatch, potential for null results to be used against patients (defunding), and clinicians potentially misjudging their own responsiveness to evidence.
      *   *Decision:* **Approve-with-Conditions.** Pure rejection ignores the potential value of evidence in a contested area (early biologic is a hot topic). Pure approval ignores the valid concerns about impact and opportunity cost. Conditions must address the "change in practice" requirement without falling into the trap of clinicians predicting their own behavior. The key is securing commitment from the *actual* decision-makers (guideline body), not just the committee clinicians.
      *   *Refinement:* Actually, looking at the constraints (£3m is *most* of the discretionary budget), the opportunity cost is huge. If the clinicians say won't change and guidelines aren't on board, the risk of "expensive fact" is high. However, the user says "I don't entirely trust the clinicians' pre-review answers." A flat rejection might be too conservative for a science journalist. But the patient rep's point about defunding risk is serious.
      *   *Stronger Position:* **Approve-with-Conditions.** The conditions must mitigate the risk of the study being ignored or used punitively. The key condition is pre-commitment from the guideline body. If they won't commit to updating based on results, the study is indeed just an expensive fact.
