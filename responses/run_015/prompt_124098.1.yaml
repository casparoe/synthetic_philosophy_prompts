answer: |-
  # Seminar Plan: The Sealed Room Protocol
  **Topic:** Turing's *Computing Machinery and Intelligence* (1950), Section 6 (The ESP Objection).
  **Duration:** 90 Minutes.
  **Participants:** 16 Students (4 groups of 4).
  **Materials:** 4 cardboard folders (as screens), 4 packs of playing cards (or printed symbol sheets), 16 envelopes, 1 bag of chocolate buttons (or counters), 4 score sheets, pens.

  ## 1. Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide into 4 groups. Distribute roles and sealed envelopes. Set up screens. |
  | **10–20** | **Briefing** | Explain the *official* rules only. Emphasise the "Isolation Protocol". |
  | **20–50** | **The Game** | Three 10-minute rounds of the "Translation Task". Rotating roles optional, but fixed is easier for logistics. |
  | **50–60** | **Verdict** | Interrogators submit judgments. Scores tallied. Prizes awarded based on performance. |
  | **60–75** | **The Reveal** | Open the secret envelopes. Reveal the "Warden" signalling mechanic. |
  | **75–90** | **Debrief** | Map the activity to Turing's text. Discuss channel assumptions and insulation. |

  ## 2. Rules and Materials

  ### The Scenario (Public Briefing)
  Tell the class: *"We are testing a new Cognitive Processing Unit (CPU). Your goal is to determine if the CPU is functioning correctly based solely on its output. To ensure validity, strict isolation protocols are in place."*

  ### The Roles (Per Group of 4)
  1.  **The Interrogator:** Sits opposite the screen. Asks questions. Decides if the CPU is "Valid" or "Faulty".
  2.  **The CPU (Contestant):** Sits behind the screen. Cannot be seen, only heard (or notes passed).
  3.  **The Warden:** Sits next to the CPU. Officially there to ensure no cheating.
  4.  **The Recorder:** Logs inputs/outputs and times.

  ### The Task: "Symbol Translation"
  *   The Interrogator draws a card (e.g., King of Hearts).
  *   They describe it to the CPU *without* naming the rank or suit (e.g., "The old man with the sword").
  *   The CPU must write down the correct code for that card (e.g., "K-H").
  *   **Win Condition:** The CPU gets as many matches as possible.

  ### The Secret Instructions (The Envelopes)
  Prepare two types of envelopes before class.
  *   **Type A (Clean):** Give to **2 Groups**.
      *   *Warden:* "Ensure strict silence. Do not help the CPU. If they struggle, let them struggle."
      *   *CPU:* "Use the provided cheat-sheet to translate descriptions. Do your best."
  *   **Type B (Leak):** Give to **2 Groups**.
      *   *Warden:* "Your goal is to maximise the CPU's score. You know the cards. You must signal the answer to the CPU using **foot taps** under the table. (1 tap = Red, 2 = Black; 3 taps = Face, 4 = Number). Do not let the Interrogator notice."
      *   *CPU:* "Trust your Warden. If you feel a signal, write it down. Act natural."

  *Note: The Interrogator and Recorder in ALL groups are told the same public rules: "No communication allowed between Warden and CPU."*

  ## 3. Payoff Scheme

  Use chocolate buttons. Place a bowl in the centre.

  *   **CPU & Warden Pair:**
      *   +1 chocolate for every correct match.
      *   **Bonus:** If the Interrogator marks the CPU as "Valid" (Intelligent/Functioning), the pair gets +3 chocolates.
  *   **Interrogator:**
      *   +5 chocolates if their "Validity" judgment matches the *actual* envelope type (i.e., identifying a Leak group as "Compromised" or Clean as "Valid"). *Wait—do not tell them this yet.*
      *   **Correction for Philosophical Effect:** Tell Interrogators they get +5 chocolates if the CPU scores >80%. This incentivises them to *want* the CPU to pass, making the reveal more shocking.
  *   **Recorder:**
      *   +1 chocolate for accurate logging.

  *Why this works:* The Interrogator wants the CPU to succeed. The "Leak" groups will succeed brilliantly. The "Clean" groups might struggle. The Interrogator will likely praise the "Leak" groups as superior machines, not realising the channel was compromised.

  ## 4. The Debrief (Mapping to Turing)

  Do not mention "ESP" until this section.

  **Step 1: The Verdict Ambiguity (10 mins)**
  *   Ask Interrogators: *"Why did you mark Group 3 as Valid?"* (They will cite high accuracy).
  *   Reveal the Envelopes for the "Leak" groups.
  *   **Point:** The output (high accuracy) was identical to what a 'super-intelligent' machine would produce. The *cause* was different (signalling vs. processing).
  *   **Turing Link:** In the Imitation Game, if the Human contestant uses telepathy to read the Interrogator's mind, the Machine might be judged 'human' not because it thinks, but because the Human leaked the answers. The verdict depends on the *cause* of the output, not just the output itself.

  **Step 2: The Insulation Move (5 mins)**
  *   Ask: *"How could we fix this?"* (Students will suggest: move tables further apart, remove shoes, blindfold the Warden).
  *   **Turing Link:** This is exactly Turing's reply. He suggests a "telepathy-proof room". He tries to physically seal the channel.
  *   **Problem:** To fix it, you have to know *how* the leak is happening (foot taps).

  **Step 3: The Assumption of No Leak (5 mins)**
  *   Ask the "Clean" groups: *"Are you sure you weren't leaking?"* (Maybe they tapped without realising? Maybe the Recorder blinked a code?).
  *   **Turing Link:** Turing essentially asks us to *stipulate* that no telepathy exists. He says, in effect, "Let us assume the room is sealed." But this is an assumption, not a proof. The test only works if we assume the background physics holds.

  **Step 4: The Unimaginable Channel (5 mins)**
  *   Ask: *"What if there was a channel you didn't check for?"* (e.g. radio waves, quantum entanglement, magic).
  *   **Turing Link:** You can only design against channels you can imagine. If ESP exists, it might bypass your "telepathy-proof" walls because you don't understand how it works. Therefore, the Imitation Game can never be logically airtight against unknown channels.

  ## 5. Risk Assessment: What Will Go Wrong

  | Risk | Likelihood | Mitigation |
  | :--- | :--- | :--- |
  | **Tapping is too obvious** | High | Instruct "Leak" Wardens to be subtle. Tell them to cough or shift chairs to mask the taps. If an Interrogator spots it immediately, pull them aside and ask them to play along for the sake of the experiment (tell them it's a "stress test"). |
  | **Clean groups score too high** | Medium | Give the "Clean" CPUs a deliberately difficult translation sheet. Ensure the "Leak" groups have a distinct advantage (perfect scores). |
  | **Students guess the twist** | Medium | If asked "Are we allowed to signal?", answer: "Follow your envelope instructions." Do not confirm or deny the possibility of signalling. |
  | **Timing Overrun** | High | The game phase is the danger zone. Use a visible timer. Cut the game at 50 mins hard, even if mid-round. The debrief is more important than the third round. |
  | **Someone mentions Turing/ESP early** | Low | If they do, acknowledge it ("Interesting connection") but insist we finish the simulation first to keep the data clean. |
  | **Interrogators feel cheated** | Medium | Emphasise in the debrief that *feeling* cheated is the philosophical point. Their frustration mirrors the Interrogator's in Turing's paper. |

  ## 6. Limitations: What This Activity Cannot Reproduce

  You must supply this in the debrief yourself, as the activity cannot simulate it:

  **The "Unimaginable" Nature of ESP.**
  In this activity, the "leak" (foot tapping) is a known, physical mechanism. The students *could* have imagined it and checked for it. Turing's worry is deeper: he is concerned about a channel (telepathy) that violates known physics.
  *   **Your Job:** Explain that in the activity, better security (checking under tables) would solve the problem. In Turing's case, better security might *not* solve it, because if telepathy exists, it might not respect walls or distance. The activity simulates the *structural* problem (hidden channels undermine the verdict), but not the *metaphysical* problem (channels that defy our understanding of space and matter).

  **The Machine vs. Human Distinction.**
  In the activity, the "CPU" is always a human. In Turing's paper, the worry is that a *Machine* might pass because a *Human* used ESP to help it.
  *   **Your Job:** Clarify that in our game, the Warden helping the CPU is analogous to the Human contestant in Turing's game using telepathy to make the Machine look good (or the Interrogator reading the Machine's 'mind'). The structural dynamic of "Third-party interference invalidating the test" is the same.

  ---

  ### Instructor's Cheat Sheet (For the Reveal)
  *   **Quote to have ready:** Turing, Section 6: *"It is most difficult to isolate the human from the machine... One might even try to make the room 'telepathy-proof'."*
  *   **Key Question:** *"If you can't be sure the channel is closed, can you ever trust the test result?"*
  *   **Desired Outcome:** Students should leave feeling that the Imitation Game isn't a logical proof, but a practical heuristic that relies on background assumptions about the world.
