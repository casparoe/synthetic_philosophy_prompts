  6.  **Addressing the "Credit" Question:**
      *   If I do good because everyone else does, am I virtuous? Aristotelian view: No, virtue requires choice. If I do good *despite* everyone else doing bad, I am virtuous.
      *   So, yes, rejecting the MoHT defense for bad actions implies we should also downgrade praise for "conformist good" actions. This is a feature, not a bug.

