          3.  Therefore, near-universal acceptance = no blame (MoHT works).
          4.  This applies to *any* time, including now.
          5.  Future people will judge our near-universal practices (animal agriculture) as wrong, but by (4) they can't blame us.
          6.  If (3) is right, contemporary critics (abolitionists, anti-imperialists) were wrong to blame their peers.
          7.  Abolitionists *were* right. Moral criticism across time collapses if (3) holds.
          8.  Conclusion: (3) is false, MoHT never works, judge everyone by current standards (statues down).
      *   **User's Intuitions:** Wants to keep (1) (fairness/knowledge) and (7) (abolitionists were right). Suspects the definition of "his time" (average vs. best-informed) might be relevant. Wonders about moral credit (if conformity excuses bad, does it negate good?).
      *   **Goal:** Identify the flawed step(s), explain the cost of rejecting it, and salvage a viable version of the MoHT defense.

  2.  **Evaluate the Steps:**

      *   **Step (1):** *Principle of Blameworthiness.* "You can't be blameworthy for doing something if you had no way of knowing it was wrong."
          *   *Strength:* Very strong intuition (ignorance excuses).
          *   *Weakness:* Distinguishes between *invincible* ignorance (couldn't know) and *vincible* ignorance (chose not to know). Also distinguishes between *moral* knowledge and *factual* knowledge.
          *   *Verdict:* Keep, but refine.

      *   **Step (2):** *Epistemic Environment.* "What's available to you is basically set by your society... if a practice is accepted almost everywhere... AND the case against it isn't really being made... then you have no way of knowing its wrong."
          *   *Strength:* Acknowledges social epistemology.
          *   *Weakness:* The "AND" clause is crucial. It admits dissent might exist.
          *   *Verdict:* This is a pivot point. It connects society to individual knowledge.

      *   **Step (3):** *The Inference.* "Near-universally accepted practice → no blame."
          *   *Strength:* Follows from (1) and (2).
          *   *Weakness:* It conflates *explanation* with *exoneration*. It also ignores the existence of *contemporary dissent*.
          *   *Verdict:* This is where the logic gets too broad. It assumes "near-universal" means *actual* universal or that dissent doesn't count.

      *   **Step (4) & (5):** *Universal Application.* Applies to present and future.
          *   *Verdict:* Logically sound if (3) is accepted. Highlights the relativism problem.

      *   **Step (6) & (7):** *The Counter-Example.* Abolitionists existed. Therefore, slaveholders *could* have known.
          *   *Verdict:* This is the hammer that breaks (3). If abolitionists existed, slavery wasn't "near-universally accepted" in the epistemic sense required for (2).

      *   **Step (8):** *The Overcorrection.* "MoHT never works, judge everyone by current standards."
          *   *Verdict:* This is the false dichotomy. It assumes if MoHT fails in *some* cases (Jefferson), it fails in *all* cases (Columbus).

  3.  **Identify the Core Flaw:**
      The argument fails because it treats "Man of His Time" as a binary switch (either it works for everyone or no one) and assumes "his time" is a monolith.
      *   **The Break Point:** Step (3) is too strong. It moves from "no way of knowing" to "near-universal acceptance." But "near-universal" isn't enough if *some* people knew.
      *   **The Real Problem:** The definition of "His Time." Is it the *median* belief or the *available* moral knowledge?
      *   **The Fix:** Distinguish between *explanation* (context helps us understand) and *exoneration* (context forgives). Also, distinguish between figures who had access to dissent (Jefferson) and those who didn't (Columbus).

  4.  **Drafting the Response:**

      *   **Validate:** Acknowledge the sophistication of the argument. It's a classic philosophical puzzle (moral relativism vs. objectivism).
      *   **Diagnose:** The error is in **Step (3)** and the leap to **Step (8)**.
      *   **Step (3) Analysis:** It ignores *contemporary dissent*. If abolitionists existed, Jefferson fails the "no way of knowing" test. But Columbus might pass it (depending on historical facts about 1492 ethics regarding indigenous peoples).
      *   **Step (8) Analysis:** It's a false dichotomy. Just because MoHT doesn't work for Jefferson doesn't mean Presentism (judge by today) is the only alternative. There's a middle ground: *Judge by the best moral standards available at the time.*
      *   **Addressing the "Credit" Objection:** If conformity excuses bad, does it negate good? Yes, partially. This is the "Problem of Moral Luck." We often praise people *more* if they defy their time (e.g., Raoul Wallenberg) than those who just follow norms.
      *   **Salvaging the Defense:**
          1.  Keep (1): Ignorance excuses *invincible* ignorance.
          2.  Modify (2): "His Time" = The *best available* moral arguments of that era, not the *average* behavior.
          3.  Reject (3): Near-universal acceptance doesn't automatically excuse if dissent existed.
          4.  Reject (8): We don't have to default to presentism. We use a sliding scale based on access to moral truth.

  5.  **Refining the "Columbus vs. Jefferson" Distinction:**
      *   **Jefferson:** Lived during the Enlightenment. Abolitionist arguments existed (Somerset case, Quakers, etc.). He engaged with them. He fails the MoHT defense.
      *   **Columbus:** 1492. Concepts of universal human rights didn't exist in the modern sense. The Pope divided the world. Was there *anyone* arguing indigenous people had souls/rights equal to Europeans *at that specific moment*? (Las Casas came slightly later). This is where the nuance lies.
