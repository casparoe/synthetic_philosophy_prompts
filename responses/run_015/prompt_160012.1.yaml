answer: |-
  This is an incredibly sharp piece of philosophical reasoning. You have essentially reconstructed a classic problem in moral philosophy (the tension between **moral relativism** and **moral objectivism**) and identified the exact point where the "Man of His Time" (MoHT) defense tends to implode.

  You are right to feel that Step (8) is insane. Tearing down every statue and judging 15th-century explorers by the UN Declaration of Human Rights is **Presentism**, and most historians reject it for the same reasons you reject Step (8): it makes moral progress impossible to explain.

  Here is the breakdown of where your argument breaks, which step to reject, and how to salvage a version of the defense that will get you a good mark without forcing you to argue something you don't believe.

  ### The Logical Break: Step (3)

  The formal error is in **Step (3)**.

  Look closely at Step (2). It has two conditions for "no way of knowing":
  1.  The practice is accepted almost everywhere.
  2.  **AND** the case against it isn't being made by anyone you'd actually run into.

  Step (3) drops the second condition. It says: *"Near-universally accepted practice → no blame."*

  This is the overgeneralization. Just because a practice is *common* doesn't mean the moral argument against it was *unavailable*.
  *   **Jefferson:** Slavery was common (Condition 1 met), **BUT** abolitionist arguments were available to him (Condition 2 failed). He corresponded with Quakers and read French Enlightenment thinkers who condemned slavery. Therefore, Step (3) does not apply to him.
  *   **Columbus:** In 1492, the concept of universal human rights across racial/religious lines effectively did not exist in European political thought. The Pope was literally dividing the non-Christian world between Spain and Portugal. There was no "person he would run into" arguing that indigenous Taino people had sovereign rights equal to Spaniards. (Bartolomé de las Casas comes *after* Columbus).

  **So, you reject Step (3) as written.** You replace it with a more precise version:
  > **(3 Revised):** A practice excuses blame *only if* it was near-universally accepted **AND** no credible moral argument against it was accessible to that person's social/intellectual sphere.

  ### The False Dilemma: Step (8)

  Step (8) claims that if MoHT fails, we must default to "Judge everyone by current standards." This is a **false dichotomy**.

  If MoHT fails for Jefferson, it doesn't mean we use *2024* standards. It means we use the **best available standards of 1776.**
  *   **The Standard:** We judge historical figures by the *best moral knowledge available to them at the time*, not the *average* behavior of their time.
  *   **The Cost:** This makes the bar higher for educated elites. Jefferson knew better than the average Georgian farmer, so he is held to a higher standard than the average person. Columbus, operating in a vacuum of human rights theory, might be held to a lower standard regarding *rights*, but still judged on *cruelty* (which was understood then).

  ### Addressing Your Specific Doubts

  **1. "His Time": Average vs. Best-Informed**
  You hit the nail on the head here. This is the crux of the whole unit.
  *   If "Man of His Time" means **Average Person**, then Jefferson is excused (most Virginians owned slaves).
  *   If "Man of His Time" means **Best Available Knowledge**, then Jefferson is condemned (he knew the arguments against it).
  *   **For your group:** Argue that "Man of His Time" should mean **Best Available Knowledge**. This allows you to condemn Jefferson (he had access to the truth) while potentially offering nuance on Columbus (the "truth" about indigenous sovereignty hadn't been articulated yet).

  **2. The "Credit" Symmetry**
  You asked: *"If going along with everyone around you gets you off the hook for bad stuff, then doing good stuff that everyone around you was also doing shouldn't get you any credit either. Nobody believes that. Unless they should?"*

  **They should.** This is a feature, not a bug.
  Philosophers call this the **Problem of Moral Luck**.
  *   If you donate to charity because everyone in your social circle does, you are less morally praiseworthy than someone who donates when their peers mock them for it.
  *   We *do* intuitively believe this. We praise **Oskar Schindler** or **Raoul Wallenberg** immensely because they defied their time. We don't put up statues of average German citizens who simply didn't kill anyone.
  *   **Cost of rejecting this:** If you keep the MoHT defense for bad actions, you *must* accept that "conformist goodness" gets less credit than "revolutionary goodness." This is a consistent moral position.

  ### How to Salvage the Defense (For Your Presentation)

  You want to keep (1) (Fairness) and (7) (Abolitionists were right). Here is the version of the argument that survives:

  1.  **Principle:** We cannot blame people for **invincible ignorance** (things they literally could not have known).
  2.  **Definition:** "Invincible" is determined by the **best available moral arguments of their era**, not the average behavior.
  3.  **Application (Jefferson):** Abolitionist arguments existed in 1776. Jefferson was educated and aware of them. His ignorance was **vincible** (chosen). MoHT defense **fails**.
  4.  **Application (Columbus):** In 1492, the framework of "universal indigenous rights" did not exist in Europe. The prevailing "Just War" theory was twisted to justify conquest. His ignorance regarding *sovereignty* was closer to **invincible**. MoHT defense **partially holds** (regarding rights), but **fails** regarding excessive cruelty (which was condemned even then).
  5.  **Conclusion:** We do not judge by *today's* standards (Presentism), nor by *average past* standards (Relativism). We judge by the **peak moral standards of their own time.**

  ### What Rejecting Step (3) Costs You

  It costs you the ability to use "Man of His Time" as a blanket get-out-of-jail-free card.
  *   You can't say "Slavery was normal then, so Jefferson is fine."
  *   You *have* to admit that some people *were* ahead of their time (the abolitionists), which proves that being "of the time" is a choice, not a destiny.

  ### Summary for Your Group
  *   **Don't throw out Step (1).** It's the strongest moral intuition you have.
  *   **Throw out Step (3).** It's too broad. Replace it with the "Best Available Knowledge" standard.
  *   **Reject Step (8).** It's a false choice. The alternative to MoHT isn't Presentism; it's **Immanent Critique** (judging them by the best standards *they* had access to).
  *   **On Credit:** Accept that conformist goodness gets less praise. It makes your argument consistent.

  This approach satisfies your teacher (no hand-waving, precise definitions), keeps your moral intuitions intact (abolitionists were right), and gives you a nuanced take on Columbus that distinguishes him from Jefferson.
