answer: |-
  An object counts as a tool if it is a detachable physical entity manipulated to achieve a specific, transient task, without being incorporated into the agent's body or a fixed environmental structure.

  Here is the clause-by-clause breakdown of why this works for your list. **Detachable physical entity** excludes the anglerfish lure (body part), the archerfish water jet (not an object), and the spider web (secreted material integrated into the environment); this earns the verdicts against the lure, jet, and web while securing the otter's rock and finch's spine. **Manipulated to achieve a specific, transient task** distinguishes the dolphin sponge (worn only for foraging) from the coat you wear (general state of dress) and the nest lining (passive, long-term protection); this saves the sponge verdict, demotes the coat-worn verdict, and explains why the nest lining feels like "material" rather than a tool. **Without being incorporated into the agent's body** rules out the prosthetic leg and the coat worn as clothing, while **without being incorporated into a fixed environmental structure** is the heavy lifter that splits your hardest pair: the beaver dam is cemented into the riverbed (architecture), whereas the octopus coconut halves are carried and assembled on demand (portable implementation); this saves the octopus verdict while killing the beaver verdict.

  Regarding your unlisted cases: the **elephant's fly-swatter branch** is a tool (detachable, specific task, not fixed); the **prosthetic leg** is not (incorporated into body); the **hermit crab's shell** is not (it functions as fixed housing/body extension, not a manipulated implement); and the **human using a chatbot** is not a tool by this definition (it is not a detachable physical entity), though functionally it acts as a cognitive tool, revealing the limit of a strictly physicalist principle.

  You must accept two casualties to keep this consistent. First, you have to give up the intuition that the **nest lining** is borderline; under this principle, it is firmly construction material, not a tool, because it becomes part of a fixed structure for passive protection. Second, you cannot reconcile the **octopus shelter** and **beaver dam** as the same category; one is portable tool-use, the other is fixed construction, and if you want the octopus to be a tool-user, the beaver must be a builder.
