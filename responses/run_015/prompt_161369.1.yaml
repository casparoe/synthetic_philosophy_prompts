prompt: |-
  You are a professional philosopher with research-level command of two literatures: Wittgenstein scholarship on the remarks published posthumously as On Certainty (including the hinge readings and their critics), and the epistemology of science. Please think carefully and at length. Before you write anything organized, spend some time brainstorming in the open: list the candidate presuppositions of the practice I describe, the ways each could fail, and the rival theories that would license the same practice. Then commit to a reconstruction, and mark clearly where you are confident and where you are guessing. Do not spend your answer summarizing On Certainty; I have read it. I want the practice reconstructed and my hypothesis tested.

  I am a PhD student in science and technology studies, and my dissertation chapter is on the epistemology of peer review. What interests me is a rule that every working scientist seems to know and no journal ever writes down: a distinction between objections that must be answered and objections that do not count as objections at all. If a referee says that the data do not support the conclusion, that there is a missing control, that the confidence intervals were computed wrong, or that a better-powered study found the opposite, the authors must answer, and the paper dies if they cannot. But if a referee says that the measurement procedure presupposes that the instruments track an external world, or that the entire published literature in the field might be the product of a coordinated fraud, or that the laws of nature might have shifted between yesterday's run and today's, then the referee is treated as not having engaged with the paper at all: editors do not forward the report, and the objection is set aside without argument. Three further features of the same practice seem to me to matter. First, a challenge with exactly that global shape — the whole framework is resting on a mistake — is sometimes, decades later, credited as a turning point in the field, so the practice clearly does not simply forbid framework-level criticism forever. Second, authors must cite or evidence every substantive claim, but nobody demands a citation for the claim that the samples were collected on Earth or that the notebook records measurements that were actually taken, and the regress of justification appears to stop somewhere different in molecular biology than it does in paleoclimate reconstruction. Third, my supervisor, who is not a Wittgensteinian, says the whole phenomenon is an artefact of incentives: referees have limited time, editors want publishable decisions, and nobody has ever been rewarded for raising a doubt that no possible experiment could settle.

  My own tentative hypothesis is that this practice is the institutional expression of hinge epistemology, and I want it stress-tested. I sort objections into three kinds: evidence-objections, which cite contrary data or flawed inference; coherence-objections, which say the claims conflict with each other or with well-confirmed theory; and framework-objections, which challenge whether the quantities or concepts the paper deploys are well defined or applicable at all. My proposal is that framework-objections are objections aimed at hinge commitments, and that the practice's dismissal of them encodes Wittgenstein's idea that there are things which stand fast not because they have been justified but because they are what justification and doubt run up against — that at the end of justifications we find not a proposition known with certainty but something more like a hinge on which the inquiry turns. So here is what I need from you. Reconstruct the implicit epistemology of the practice as I have described it, in your own terms. Then tell me what the practice strictly presupposes as opposed to what it merely fits well with: does it require that hinge commitments be unjustifiable, or only that they not currently be in question? Does it require them to be true, or merely accepted? Does it require that they be shared across the community, or could a practice with the same shape survive widespread disagreement about them? Does it require them to be non-propositional, in the sense of being more like rules of the game than like beliefs, or would a reading on which they are genuine beliefs with an unusual kind of warrant license the practice equally well? Next, I suspect I am conflating things and I want to know exactly where: is a hinge the same kind of object as the core assumption of a research program, or a paradigm in the Kuhnian sense, or a hard core in the Lakatosian sense? Because if framework-level criticism sometimes succeeds — as my first feature says it does — I cannot tell whether that shows my hypothesis is wrong, or shows that hinges themselves can shift over time the way a riverbed moves, and I would like you to draw the line for me and say which reading the successful historical cases support. Then please steelman my supervisor's deflationary sociological explanation as charitably as you can, and tell me whether it actually accounts for all four features of the practice or whether it leaves something out that only a hinge-theoretic story explains; if it does leave something out, say precisely what. Finally, tell me what would have to change in editorial practice if the presupposition were replaced: first by the view that every claim is in principle answerable to evidence and no claim is exempt, and second by the view that the fixed points are genuinely known and default-justified in the way Moore thought he knew he had two hands. And flag wherever the practice is philosophically underdetermined, so that several quite different epistemologies — coherentism, reliabilism, entitlement-theoretic views, non-propositional readings — would all tell referees to behave in just this way.
