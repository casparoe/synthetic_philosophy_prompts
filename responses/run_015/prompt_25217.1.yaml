answer: |-
  ## The Stance: Local Causality & Default Persistence

  You are facing the **Frame Problem**, but in a simulation context, this is not a philosophical puzzle to be solved; it is an engineering constraint to be managed. The philosophical lesson is this: **You cannot list every non-changing fact.** Therefore, you must invert the logic.

  **My definite position:** You will adopt the **STRIPS Assumption with Explicit Causal Propagation**.

  1.  **Default Persistence:** Every fact in your world state is assumed to remain true unless explicitly marked as changed. You do not check for stability; you assume it.
  2.  **Explicit Effects:** An action definition *only* lists what changes directly.
  3.  **Causal Propagation:** If a direct change triggers a secondary rule (a ramification), that rule fires automatically.

  This rejects the "check everything" approach (computationally impossible) and the "pure logic axiom" approach (too rigid/slow for real-time sim). It places the burden of proof on *change*, not *stability*.

  Below is the **Frame Protocol**. Use this checklist every time you define a new action class in your simulation.

  ---

  ## The Frame Protocol: A Design Procedure

  When defining a new action `A`, execute these four steps. If you cannot complete a step, the action is ill-defined.

  ### Step 1: Declare Direct Fluents (The STRIPS Core)
  List the specific state variables (fluents) that this action *directly* modifies.
  *   **Rule:** If a variable is not on this list, it *cannot* change during this action's execution.
  *   **Constraint:** Keep this list minimal. If you find yourself listing >5 variables, your action granularity is too coarse.

  ### Step 2: Map Causal Dependencies (The Ramification Check)
  Identify variables that are *functions* of the Direct Fluents. These are not changed by the action directly, but by the *consequences* of the direct changes.
  *   **Query:** "If Direct Fluent X changes, does Derived Fluent Y mathematically or logically necessitate a update?"
  *   **Mechanism:** Implement these as observers or reactive rules, not as part of the action's explicit code.

  ### Step 3: Define Qualification Boundaries (The Context Limit)
  List the conditions that must be true for the action to *succeed*. This defines the boundary of your "closed world."
  *   **Query:** "What external fact, if false, would make this action impossible, even if preconditions are met?" (e.g., Gravity exists, Robot isn't crushed).
  *   **Decision:** Explicitly ignore "abnormal" qualifications (e.g., "earthquake didn't happen") unless your sim is about disasters. **Commit to normalcy.**

  ### Step 4: Enforce Atomic Persistence
  Implement the state update mechanism such that only the IDs in Step 1 and Step 2 are touched in memory.
  *   **Technical Mandate:** Use a "Dirty Flag" or "Event Log" system. The world state is not overwritten; it is patched. Any system reading state (rendering, AI, physics) subscribes to these patches. If no patch is issued, the subsystem does not wake up.

  ---

  ## Application 1: Action `RobotPicksUpCrate`

  **Context:** Robot R approaches Shelf S, grabs Crate C.

  ### 1. Direct Fluents
  *   `CrateC.Location` changes from `ShelfS.Slot` to `RobotR.Gripper`.
  *   `RobotR.GripperState` changes from `Empty` to `Full`.
  *   `ShelfS.Slot` changes from `Occupied` to `Empty`.

  ### 2. Causal Dependencies (Ramifications)
  *   **Robot Mass:** `RobotR.CurrentMass` increases by `CrateC.Mass`.
      *   *Secondary Ramification:* `RobotR.MaxAcceleration` decreases (physics model).
      *   *Secondary Ramification:* `RobotR.BatteryDrainRate` increases (load factor).
  *   **Inventory Count:** `Warehouse.TotalMovableInventory` remains same, but `Warehouse.StoredInventory` decreases.

  ### 3. Qualification Boundaries
  *   **Preconditions:** `RobotR.At(ShelfS)`, `RobotR.GripperState == Empty`, `CrateC.Weight < RobotR.MaxLift`.
  *   **Ignored Qualifications (The Commitment):** We assume the floor doesn't collapse under the weight. We assume the crate doesn't slip due to oil on the gripper unless you have a "SlipperyFloor" fluent.
      *   **>> PHILOSOPHICAL COMMITMENT <<**: By ignoring the "oil on gripper" scenario, you are committing to a **Deterministic World Model**. You are asserting that unless `SlipperyFloor` is explicitly modeled as a variable, it does not exist. You are choosing *tractability* over *fidelity*.

  ### 4. Atomic Persistence
  *   **Update:** The physics engine only recalculates collision for `RobotR` and `CrateC`.
  *   **Ignore:** The pathfinding graph for `RobotQ` (3 aisles away) is not recalculated. The `ShiftSchedule` is not checked. The `BatteryLevel` of `RobotQ` is not touched.
  *   **Efficiency Gain:** Instead of iterating 10,000 objects, you update 3 objects and 2 derived values.

  ---

  ## Application 2: Action `WarehouseShiftEnds`

  **Context:** The 8-hour work shift concludes. Operations pause.

  ### 1. Direct Fluents
  *   `Warehouse.OperationalStatus` changes from `Active` to `Standby`.
  *   `Clock.CurrentShift` increments.
  *   `HumanWorker.Presence` changes from `OnFloor` to `BreakRoom`.

  ### 2. Causal Dependencies (Ramifications)
  *   **Robot Motion:** Since `OperationalStatus` is `Standby`, `RobotR.Velocity` is forced to `0` for all robots.
      *   *Note:* This is a ramification. The action doesn't stop each robot; the *state* of the warehouse forces the robots to stop.
  *   **Charging:** `ChargingStation.Availability` changes from `Limited` to `High` (robots return to dock).
  *   **Security:** `SecurityDoor.LockState` changes to `Engaged`.

  ### 3. Qualification Boundaries
  *   **Preconditions:** `Clock.Time == ShiftEndLimit`.
  *   **Ignored Qualifications:** We assume robots have enough battery to return to dock. We assume no emergency overrides are active.
      *   **>> PHILOSOPHICAL COMMITMENT <<**: This is the **Qualification Problem**. In reality, a robot might be broken and block a door. By assuming they all return to dock, you are committing to a **Idealized Agent Model**. You are deciding that "Shift End" is a global switch, not a negotiated process among agents. This simplifies the frame problem by treating the shift change as a *global event* rather than a collection of individual "stop working" actions.

  ### 4. Atomic Persistence
  *   **Update:** Broadcast a `StateChange` event for `Warehouse.OperationalStatus`.
  *   **Ignore:** `Crate.Location` for all 50,000 crates.
      *   **Critical Decision:** Do crate locations persist? **Yes.**
      *   **>> PHILOSOPHICAL COMMITMENT <<**: This is the core **Frame Assumption**. You are asserting that time passing (the shift ending) does not equate to spatial displacement. Unless a `TeleportationEvent` or `TheftEvent` occurs, `Crate.Location(t+1) == Crate.Location(t)`. You do not verify this. You enforce it by *not writing* to crate location memory.

  ---

  ## Summary of the Position

  To solve the Frame Problem in simulation, you must accept **Ontological Reduction**.

  1.  **Reality is Infinite; Simulation is Finite:** You cannot model every potential change. You must decide what *cannot* change.
  2.  **Inertia is a Feature, Not a Bug:** Do not code persistence. Code change. If your code doesn't touch a variable, it persists. This is the STRIPS assumption operationalized.
  3.  **Causality is Explicit:** If A affects B, you must draw the line in your dependency graph. If you haven't drawn the line, A does not affect B.

  **The Expert Verdict:**
  Do not build a system that checks for stability. Build a system that assumes stability and logs exceptions. When you design an action, if you cannot list the specific variables that change, the action is too vague. If you find yourself adding "unless..." clauses to your persistence rules, you are fighting the Frame Problem. Stop. Move that "unless" clause into a Causal Dependency (Step 2) or a Qualification (Step 3).

  By strictly adhering to this protocol, you convert a philosophical impossibility into a manageable data-structure constraint. Your simulation will scale because its complexity grows with the number of *changes*, not the size of the *world*.
