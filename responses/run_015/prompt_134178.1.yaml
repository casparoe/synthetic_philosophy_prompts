answer: |-
  The pattern you have identified is a classic and deeply entrenched difficulty in metaphysics and logic. While there is no single, standardized term for the *rhetorical sequence* itself (the positing of C followed by the redefinition of C), the underlying metaphysical problem is famously known as **Bradley's Regress**.

  The argumentative move you describe is typically an attempt to **block** this regress, but when done without explicit justification, it functions as a specific type of **Category Mistake**.

  Here is a detailed breakdown of the terminology, the philosophical context, and a proposal for naming the specific argumentative pattern you observed.

  ### 1. The Established Problem: Bradley's Regress
  The difficulty you describe originates with the British Idealist **F.H. Bradley** (in *Appearance and Reality*, 1893). Bradley argued that if you have two entities, $A$ and $B$, and a relation $R$ that connects them (so that $A-R-B$), you must explain how $R$ is connected to $A$ and $B$.
  *   If $R$ is just another entity (a *relatum*), you need a new relation $R'$ to connect $R$ to $A$.
  *   But then you need $R''$ to connect $R'$ to $R$, and so on *ad infinitum*.

  The pattern you observe—positing $C$ (the relation) and then, when pressed, claiming $C$ does not need connecting—is the standard **response** to Bradley's Regress. Philosophers who wish to maintain that wholes exist must explain why the regress stops at $C$.

  ### 2. The Legitimate vs. Fallacious Move
  In serious metaphysics, this shift is not necessarily fallacious; it is a proposed solution.
  *   **The Legitimate Move:** The philosopher explicitly argues that $C$ belongs to a different **ontological category** than $A$ and $B$. $A$ and $B$ are *objects* (substances); $C$ is a *relation* or a *form*. Relations, by definition, are "unsaturated" or "internal" and do not require further ties. (e.g., Bertrand Russell's theory of logical form, or David Armstrong's "ontological free lunch").
  *   **The Fallacious Move (Your Observation):** The arguer treats $C$ as an object when introducing it (to explain the unity) but treats it as a non-object when challenged (to avoid the regress), without establishing the categorical distinction beforehand.

  ### 3. Distinguishing from Equivocation
  You asked how to distinguish this from ordinary equivocation.
  *   **Equivocation** is a linguistic error where a *word* changes meaning (e.g., using "bank" to mean riverbank, then financial bank).
  *   **The Move You Describe** is an **Ontological Ambiguity**. The term $C$ remains the same (e.g., "connection," "structure," "rule"), but its *mode of existence* shifts.
  *   **Distinction:** It is **not** a mere change of topic if the defender argues that $C$ is a "logical form" or "internal relation." It **is** a fallacy if they implicitly treat $C$ as a "glue" (a thing) in the explanation, and then deny it is a "thing" in the defense. This is best classified as a **Category Mistake** (a term coined by Gilbert Ryle). Ryle argued that many philosophical puzzles arise when we treat concepts (like "mind" or "unity") as if they belong to the same logical type as physical objects.

  ### 4. Proposed Name: "The Ontological Category Slide"
  Since there is no single canonical term for this specific *dialectical sequence* (Posit Entity $\rightarrow$ Challenge $\rightarrow$ Retract Entity-Status), I propose the term **"The Ontological Category Slide"** (or simply **"The Category Slide"**).

  **Definition:** An argumentative maneuver where a theoretical entity ($C$) is introduced as a distinct component to explain the unity of parts ($A$ and $B$), but upon facing an infinite regress objection, its ontological status is silently shifted from a *component* (relatum) to a *mode of composition* (relation/form) to block the regress.

  **Boundary Conditions:**
  1.  **Initial Reification:** $C$ is initially described in a way that suggests it is a constituent part of the whole (e.g., "the glue," "the third element," "the binding force").
  2.  **Regress Challenge:** An interlocutor asks how $C$ connects to the parts.
  3.  **Categorical Retreat:** The defender claims $C$ does not need connecting because it is "internal," "structural," or "non-relational," effectively denying the reification implied in step 1.
  4.  **Lack of Justification:** The shift occurs without a prior argument establishing why $C$ belongs to a category that exempts it from the binding requirement.

  ### 5. Genuine Counter-Examples
  To prove this is a distinct pattern and not just "doing philosophy," we need cases where the shift *does not* occur.

  **Counter-Example A: Mereological Nihilism**
  *   **Claim:** There are no wholes. $A$ and $B$ exist, but "A+B" does not.
  *   **Why it's not a Slide:** They do not posit $C$. They deny the unity exists, so no binder is needed. The regress never starts.

  **Counter-Example B: Explicit Structural Realism**
  *   **Claim:** $A$ and $B$ are bound by $C$. $C$ is a structural relation.
  *   **Defense:** "Relations are fundamentally different from relata. Relations are 'unsaturated' (Frege) and do not require further ties. This is a brute fact of ontology."
  *   **Why it's not a Slide:** The categorical distinction is made **explicitly at the outset**. The defender does not wait for the challenge to claim $C$ is special; they build their system on the premise that relations are ontologically distinct from objects.

  **Counter-Example C: The "Brute Composition" View**
  *   **Claim:** $A$ and $B$ compose a whole whenever certain conditions are met. No $C$ is added.
  *   **Why it's not a Slide:** Composition is taken as a primitive fact. No third element is posited, so there is nothing to slide.

  ### Summary
  The pattern you have encountered is the rhetorical shadow of **Bradley's Regress**. When handled carefully, it is a defense of **Internal Relations** or **Logical Form**. When handled loosely to evade criticism, it is an **Ontological Category Slide**.

  It is distinguished from equivocation because it concerns the *status of existence* (ontology) rather than the *definition of words* (semantics). It is distinguished from a legitimate theoretical adjustment by the **timing** of the categorical distinction: if the distinction is introduced only *after* the regress is pointed out, it is a slide; if it is the foundation of the theory from the start, it is a solution.
