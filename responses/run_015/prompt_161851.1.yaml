  *(Self-Correction on "No Citations"):* I can mention Scanlon because the user mentioned him, but I shouldn't say "Go read Chapter 5." I should explain the concept.

  *(Final check on the "Circle" question):* He asks: "whatever it is that makes (6) come apart feels like it might also hand me (2) for free."
  My answer needs to be: It *looks* like it does, but it doesn't, because (2) involves expected *actual* deaths, whereas (6)'s permissible case involves *statistical* risks below a threshold of harm. In (2), 30 people actually die. In (6), nobody necessarily dies from the specific risk. This is the "Identifiable Victim" effect, but philosophically grounded.

