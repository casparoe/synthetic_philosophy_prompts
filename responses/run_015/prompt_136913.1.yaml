      *   *Rule 2: The "Semantic Conduit" Rule.* Any link transmitting intelligible meaning to a mind is a cause.
          *   Fits: Fire (no meaning), Poison (no meaning), Decision (internal meaning), Teacher (external meaning).
          *   LLM Prediction: Yes cause (it transmits the proof).
      *   *Likely Choice:* Rule 1. Because Ghazali's metaphysics hinges on the distinction between the Living (God/Humans) and the Dead (Matter). An LLM is "dead" matter, regardless of how smart it seems. The Teacher case works because of the *teacher's* intent, not just the words.
      *   *Closest Analog:* Surface = Teacher. Deep = Fire.
      *   *Principle:* Attributing causal power to non-volitional tools undermines the uniqueness of the soul.
      *   *Underdetermination:* Acknowledge that the "Teacher" verdict is the weak link. If he views teaching as God acting *through* the teacher, the LLM might fit there too. But given the "Fire" stance, he likely reserves "cause" for "will."
      *   *The Splitter Case:* Need a case that separates "Will" from "Meaning."
