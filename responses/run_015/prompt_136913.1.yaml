      *   Check the "Teacher" case. Why is it a cause? Because it involves *human intent to guide*.
      *   *Wait, one nuance:* In Ghazali's actual view, even human will is created by God. But the roommate says "my decision genuinely causes the action." This implies the roommate is a "Compatibilist Occasionalist" or just inconsistent. I must work with *his* track record, not historical Ghazali.
      *   *Track Record:*
          *   Mechanical/Physical $\rightarrow$ No Cause.
          *   Mental/Volitional $\rightarrow$ Cause.
      *   *LLM:* It simulates mind but is mechanically implemented.
