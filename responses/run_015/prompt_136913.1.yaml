          *   Prediction for LLM: The LLM outputs a *proof* (semantic content). The Engineer understands it. This looks like the Teacher case. The LLM is functioning as a source of reasons. Therefore, LLM *is* a cause (instrumentally).

      *   *Refining Rule B:* Actually, looking at Ghazali, he is very strict on "created causation." The roommate is already being lenient by allowing the Teacher to be a cause. Why? Because teaching involves *guidance* (hidayah) which Ghazali sometimes attributes to God, but the roommate says "Explanation is a real cause." This implies the roommate distinguishes between *blind mechanism* and *rational influence*.
