      *   **Audience:** ~40 people. Mixed bag: Operational forecasters (meteorologists/ensemble), Epidemic modelers (reflexive forecasts), Sci-comm/Numeracy researchers (hedges help understanding), Editors (legal/reputational risk), 1 Philosopher of Probability (Humean/Best-System).
      *   **Deliverable:** A "real prep sheet."
          *   8 objections (ordered by damage potential).
