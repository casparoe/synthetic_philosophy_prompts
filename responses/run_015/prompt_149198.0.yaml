      *   **Core Claim:** Braudel's *longue durée* is often misread as static structures (backdrops), but should be understood as slow-moving dynamics with different "relaxation times."
      *   **Proposed Mechanism:** Model "events" as perturbations with decay rates. The distinction between event and structure becomes a matter of timescale matching/coupling, not ontology.
      *   **Goal:** Sidestep determinism vs. agency deadlock.
      *   **Specific Concerns:**
