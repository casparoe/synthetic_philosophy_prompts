      *   *Verdict:* Point 3 holds up *if* the author commits to an instrumentalist view of concepts. However, the distinction needs nuance. It's not that it's *not* a belief state, but that the *activity* of engineering is normative/propositional regarding usage, not necessarily descriptive regarding current usage. The slope is slippery: if I engineer the concept "marriage" to include same-sex couples, am I saying "marriage *is* this" (descriptive) or "we *ought* to treat marriage as this" (normative/tool-like)? The outline hints at this but needs to be sharp.
      *   *Feedback:* Validate the distinction but warn about the "truth-apt" nature of engineered concepts. Once engineered, we use them in assertions.

