      Good evening everyone. Welcome back to campus. It is wonderful to see this room full. I see familiar faces I haven't seen in twenty-five years. I see new faces too. To the partners and the children joining us tonight, welcome. You are part of this story now, even if you weren't here for the beginning. Looking out at this crowd, knowing what I know about how many of you met during orientation week in 1999, I am struck by the sheer density of life that has grown from this single entering class. There are families here that literally would not exist if things had been different. That is a heavy thing to hold.

      I know why I am standing here. I know what people say about me regarding the Class of 1999. I directed admissions when you applied. I built the policy that brought many of you to this campus. I know that policy has been in the news recently. I know it was ruled unconstitutional. I know there are people in this room who think that policy was a moral necessity, and I know there are people who think it was a moral failure. I know there are people who are both. I am not going to try to resolve that debate for you tonight. I am not going to ask for your gratitude, and I am not going to offer you an apology for your own existence. Neither of those transactions feels honest to me. You are here. You are grown. You are alive. To say sorry implies you should not be here, and to ask for thanks implies I gave you a gift rather than a circumstance. The truth is somewhere quieter than that.

      What I want to speak to is not the fact of your admission, but the experience of it. I have listened over the years to what you have said about being students here. The complaints that stay with me are not about where you ended up in life. By all measures, you ended up everywhere, and mostly well. The complaints that stay with me are about what it felt like to walk onto this campus knowing there was a separate track for your file. It is one thing to be admitted. It is another thing to be admitted under a rule that announces you belong to a category. I know that when peers assume you are here because of a policy rather than your own merit, it changes the texture of friendship. It changes how you hear a joke in the dining hall. It changes the weight of a grade. That is not a statistical outcome. That is a lived year. I cannot change how that felt for you then, and I cannot fix it now. But I can acknowledge that it was real, and that it mattered more than the enrollment numbers ever did.

      I want to be honest about where I stand today. For ten years after I left this office, I believed that policy was right. I believed the ends justified the means. I am not sure I believe that anymore. I do not have a clean conclusion to offer you. I live with the uncertainty just as you live with the memory. What I do know is that you took whatever brought you here and you made something true with it. You built communities. You studied. You fell in love. You made mistakes. You became the adults sitting in this room. The mechanism of your arrival is part of your history, but it is not the whole of it.

      We have a lot of work to do as an institution. The college is retrofitting itself for a new legal landscape, and that work is hard. Our current dean is leading that effort with care and integrity. They are navigating the same complexities we are talking about tonight, but with a different map. I hope you will give them the same grace you are asking for tonight. Support them as they try to build a community that is both lawful and just. They need you to hold them to a high standard without demanding they solve history in a single semester.

