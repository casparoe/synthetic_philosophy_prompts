          *   *Major Conflict:* (1) Unrestricted Domain vs. (4) No-Meddling Filter. You can't have both. This is the logical kill-shot.
          *   *Conceptual Conflict:* (3) Decisiveness vs. (5) Trumps. Decisiveness affects the *ranking* of available options. Trumps affect the *feasibility* of options. In the example, they converge on $L$, but the mechanism is different. If Prude prefers $P \succ N$ (wants to read), decisiveness makes $P \succ_S N$. Trumps might mean she *can* choose $P$. The user's example in (5) says "Prude's right excludes P". Why? Because she prefers $N$? If she prefers $P$, does she exclude $N$? The description in (5) is slightly muddled regarding *how* the exclusion is triggered. It implies rights protect a *sphere* from interference, not necessarily enact a preference. This needs clarification.
