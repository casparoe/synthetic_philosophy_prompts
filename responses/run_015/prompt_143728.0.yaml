answer: |-
  ### Part 1: Brainstorming the Axes

  Before building the tree, I need to map the terrain. Having sat in boardrooms in Oslo and field offices in Lagos, I've learned that "corruption" is a word that does too much work. Here are the axes I considered to disentangle the concept:

  *   **Formal Legality:** Does written law forbid this?
  *   **Rule Alignment (Your Insistence):** Does the outcome match what the rules say should happen, or does it buy an exception?
  *   **Timing:** Is the transfer *ex-ante* (inducement) or *ex-post* (gratitude)?
  *   **Proportionality:** Is the value symbolic (a bottle of wine) or substantial (a car)?
  *   **Publicity:** Is the transfer recorded, known to superiors, or hidden?
  *   **Exclusivity/Harm:** Does this transfer deny a specific third party their entitlement?
  *   **Voluntariness:** Is the giver being extorted, or are they initiating?
  *   **Systemic Function:** Does this payment stabilize a broken system or destabilize a working one?
  *   **Relationship:** Is this a one-off transaction or part of long-term patronage?
  *   **Selectivity:** Is this act condemned only when performed by political opponents?
  *   **Institutional Capacity:** Is the official under-resourced (forcing informal fees) or well-resourced (pure greed)?
  *   **Moral Defense:** Do locals defend this as *right*, or merely as *unavoidable*?

  ### Part 2: Discarded Axes

  I am throwing away **Formal Legality**, **Proportionality**, and **Timing**.

  *   **Formal Legality:** This begs the question. The Skeptic and the Relativist argue precisely about whether the law reflects moral truth or colonial imposition. If we start with "Is it illegal?", we've already adopted the Universalist frame.
  *   **Proportionality:** A week's wages in Kerala is not a week's wages in Oslo. Absolute value is meaningless; relative value is hard to measure in a quick case study. More importantly, a "small" bribe to a judge is worse than a "large" gift to a storm engineer. The *function* matters more than the *price*.
  *   **Timing:** *Ex-post* gifts (gratitude) often become *ex-ante* expectations (fees). Distinguishing them empirically is often impossible after the fact. A "thank you" today creates an obligation for tomorrow.

  ### Part 3: The Decision Tree

  This tree is designed for your reading group. It does not ask "Is this corruption?" It asks factual questions about the mechanics of the exchange. The leaves indicate which **theoretical lens** is most analytically useful for that specific case.

  **START: The Exchange**

  1.  **Was the recipient formally entitled to the outcome *without* the transfer?**
      *   **NO** (The payment bought an exception, a license, or a job they didn't qualify for.) → Go to **2**
      *   **YES** (The payment secured a right, service, or outcome they already owned.) → Go to **3**

  2.  **Did this transfer deny a specific third party their formal entitlement?**
      *   **YES** (e.g., The cousin got the job over a qualified stranger.) → **Leaf A: Universalist / Integrity View**
      *   **NO** (e.g., The mining company built a school; no specific rival was denied the license *by this act* alone.) → Go to **4**

  3.  **Is the transfer hidden from the institution, or is it open/known?**
      *   **HIDDEN** (Secret envelope, note in passport.) → Go to **5**
      *   **OPEN** (Known to community, superiors, or recorded.) → **Leaf B: Relativist / Customary View**

  4.  **Is the condemnation of this act selective based on the actor's identity?**
      *   **YES** (Allied companies do it; rivals are prosecuted.) → **Leaf C: Skeptic / Power View**
      *   **NO** (The rule is applied generally, even if inefficient.) → **Leaf D: Second-Best / "Grease" View**

  5.  **Is the payment defended locally as *morally right* or merely *unavoidable*?**
      *   **MORALLY RIGHT** (It is shameful *not* to give the gift.) → **Leaf E: Social-Norms View**
      *   **UNAVOIDABLE** (Everyone hates it, but the system is broken.) → **Leaf A: Universalist / Integrity View** (Reclassified as systemic failure)

  ---

  ### Part 4: Mapping Your Cases

  Here is how your six cases sort through the device:

  1.  **The Storm Gift (Priya's Engineer):**
      *   Entitled? **YES** (Power should be restored).
      *   Hidden? **NO** (Likely known/accepted in that context).
      *   **Leaf B: Relativist.** (This validates Priya: it's a customary closing of a social loop, not a rule violation).
  2.  **The Cousin's Job:**
      *   Entitled? **NO** (Jobs should be meritocratic).
      *   Third-party harm? **YES** (Qualified outsiders excluded).
      *   **Leaf A: Universalist.** (This validates You: it is classic nepotism/corruption).
  3.  **The Border Note:**
      *   Entitled? **YES** (Passport holder has right to pass).
      *   Hidden? **YES**.
      *   Defended as right? **NO** (It's a hassle).
      *   **Leaf A (via 5):** Universalist. (Note: The "Second-Best" theorist might argue for Leaf D, but because it is hidden and unavoidable rather than a structural fee, it usually collapses into Universalist corruption in analysis).
  4.  **The Surgeon's Envelope:**
      *   Entitled? **YES** (Care should be based on need).
      *   Hidden? **YES**.
      *   Defended as right? **MIXED** (Often "unavoidable" to get attention).
      *   **Leaf A or E.** (This is the tension point: is it a norm of gratitude or a market for care?)
  5.  **The Mining School:**
      *   Entitled? **NO** (License is discretionary).
      *   Third-party harm? **NO** (No specific rival named).
      *   Selective condemnation? **Likely YES**.
      *   **Leaf C: Skeptic.** (This looks like "investment" when allies do it, "bribery" when enemies do).
  6.  **The Headman Land Payment:**
      *   Entitled? **NO** (Formal state law says one thing, customary law says another).
      *   *This case breaks the tree.* It depends on which "Rule" you ask about in Question 1. If Formal Law: Leaf A. If Customary Law: Leaf B. (This is the heart of your debate).

  ### Part 5: Empty Boxes and Collapsed Leaves

  **The Empty Box: The "Public Bribe"**
  There is a logical space in this tree for a transaction that is **Rule-Violating + Third-Party Harm + OPEN**.
  *   *Why it's empty:* If a transaction violates rules and harms others, but is done openly, it usually ceases to be a "bribe" and becomes a "tax" or "policy." For example, if a government openly sells citizenship to the wealthy, it is controversial, but it is law, not corruption.
  *   *Verdict:* **Incoherent.** Corruption requires a shadow. If you bring it into the light, you either change the law (legalizing corruption) or you are prosecuted. A "public secret" is possible, but a fully institutionalized, open rule-violation for private gain is a contradiction in terms.

  **The Collapsed Leaves: Relativist vs. Social-Norms**
  You bet correctly. **Leaf B (Relativist)** and **Leaf E (Social-Norms)** are empirically indistinguishable in almost all field contexts.
  *   *The Theory:* The Relativist says, "This is morally permissible here." The Social-Norms theorist says, "People *expect* this here and enforce it."
  *   *The Collapse:* To answer Question 5 ("Is it defended as morally right?"), you must ask the locals. They will say, "It is the right thing to do." But if you observe behavior, you find they do it because they fear social exclusion if they don't. The *moral claim* is almost always a post-hoc rationalization for the *empirical expectation*.
  *   *Why keep them separate?* Only for analytical hygiene. The Relativist stops inquiry ("It's culture"). The Social-Norms theorist continues inquiry ("What sustains this equilibrium?"). But as a sorting device for *cases*, they yield the same result.

  **A Note on the "Second-Best" (Leaf D)**
  This is the most dangerous box. It captures the "Speed Money" argument. It is distinct from the Universalist view only if the payment *restores* the intended function of the state (getting the passport) without harming a third party (jumping the queue). In my compliance work, I found this box is rarely empty, but it is rarely *stable*. A "grease" payment today becomes a "sand in the wheels" demand tomorrow (the official slows down to induce the bribe). The tree sorts it separately, but in reality, Leaf D often migrates to Leaf A over time.

  ### Final Thought for the Group
  Tell Priya and your reading group this: The tree shows that you are not arguing about the *facts* of the storm gift. You are arguing about **Question 1**.
  *   You (Norway) assume the "Entitlement" is defined by the **Formal Rule** (No money for service).
  *   Priya (Kerala) assumes the "Entitlement" is defined by the **Social Contract** (Service creates a debt of gratitude).

  The tree doesn't solve that. It just shows you exactly where the fork in the road is.
