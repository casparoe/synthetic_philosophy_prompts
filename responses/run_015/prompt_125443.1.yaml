          *   *Severity:* High. Connects to Colleague 2.

  5.  **Synthesize and Rank Conflicts:**

      *   **Rank 1 (Severe): The Asymmetry Problem.** (7a) vs (7b) is not supported by (1)-(6). In fact, (2) and (4) suggest symmetry. (2) says gender scripts apply generally. (4) says segregation is bad because of power/design. Male dominance in tech is bad; female dominance in care is also part of the "gender as a structure" problem. The unease in (7b) is an orphan intuition.
