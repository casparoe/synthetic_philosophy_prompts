      *   **Conflict E: (3) Meta-view vs. (4) Normative Claim.**
          *   *Analysis:* (3) says no pre-social fact about what people want. (4) says segregation is a justice problem because it shapes power/design.
          *   *Tension:* If (3) is true, is the resulting distribution "unjust" or just "constructed"? (4) argues it's unjust because of *consequences* (power, design), not because it violates "natural" preferences.
          *   *Verdict:* Compatible. (4) relies on political justice, not natural rights.

      *   **Conflict F: (6) Methodological vs. (4) Normative.**
          *   *Analysis:* (6) says count choices as evidence. (4) says ignore the aggregate of choices and call it a justice problem anyway.
          *   *Tension:* If we count the choices as evidence (6), does that undermine the claim that it's a justice problem (4)?
