prompt: |-
  I am supervising an MPhil thesis on whether the distinction between doing and allowing — and, more narrowly, between killing and letting die — carries any moral weight of its own, and before my student writes the chapter that sets out what an account of the distinction would have to achieve, I want that specification written properly rather than assembled ad hoc from whichever cases happen to come to mind. So I would like from you a list of desiderata that any adequate theory of the doing/allowing distinction must meet, with the case or consideration behind each, and a view on which of them are genuinely required and which are merely the preferences of one camp (for instance, demands that the distinction be metaphysically prior to any normative facts, that it be describable without appeal to causation, that it be binary, or that it be neutral between a rights-based and a consequentialist framework).

  The list should be pushed into territory that the standard examples do not cover well, since that is where the accounts I have read seem to come apart. In particular I want it to handle: cases of double prevention, where an agent does not create a threat but diverts an existing one onto a different person, or removes something that was shielding them, so that the harm runs through the agent without originating in them; the difference between withholding support and withdrawing support one is already providing, and why that difference, if it is one, should matter when the patient's prospects are held fixed; cases in which someone's allowing is itself constituted by a long chain of small commissions — budget decisions, triage protocols, default settings in a system nobody individually chose — so that the description of the event as an omission is contested rather than given; and cases in which the agent is an automated or artificial system, where doing and allowing come apart as the difference between running and declining to run a computation, and where there is no bodily movement, effort, or phenomenology of agency to anchor the intuitive contrast. I also want the list to say what the distinction must not collapse into: it must not simply track causation, since some allowings look causally necessary for the outcome, and it must not simply track intention or foresight, since those are standardly treated as separate; and it should say something about the weight question, namely whether the distinction is to do independent moral work or is at best a proxy for other factors such as the cost to the agent, the existence of a duty of aid, or the difference between infringing a right and failing to confer a benefit.

  Two things matter to me most in the answer. First, tell me which pairs of desiderata you suspect cannot be jointly satisfied — if, for example, requiring that the distinction be sharp and non-negotiable is in tension with requiring that it handle distributed and automated agency, I want that stated as a result about the specification itself rather than smoothed over. Second, identify the single requirement that does the most work in ruling out existing contenders, and say why. The purpose the theory is being built for is fixed: it is meant to be usable by someone writing policy for an institution — a hospital trust drawing up guidance on withdrawing treatment, or a team specifying the default behaviour of an autonomous system that could intervene in a harm — who needs to know whether declining to act is, in the case at hand, morally different from acting, and if so how much of a difference it makes. If you think some of my cases are bad tests of a theory because they build in the very contestable description at issue, say so and tell me what should replace them. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Topic:** The moral weight of the doing/allowing distinction (specifically killing/letting die).
      *   **Task:** Provide a list of desiderata for an adequate theory of this distinction.
      *   **Context:** Supervising an MPhil thesis. The student needs to write a chapter specifying what an account must achieve *before* diving into cases.
      *   **Specific Requirements:**
          *   List desiderata with the case/consideration behind each.
          *   Distinguish between *genuine requirements* and *camp-specific preferences* (e.g., metaphysical priority, binary nature, neutrality).
          *   Push into non-standard territory: double prevention, withholding vs. withdrawing, distributed/structural omissions, automated/AI agency.
          *   Specify what the distinction must *not* collapse into (causation, intention/foresight).
          *   Address the "weight question" (independent moral work vs. proxy).
          *   **Crucial 1:** Identify pairs of desiderata that cannot be jointly satisfied (tensions/incompatibilities).
          *   **Crucial 2:** Identify the single requirement that does the most work in ruling out existing contenders.
          *   **Purpose:** Usable for policy writing (hospital trust, autonomous system defaults).
          *   **Critique:** Challenge bad test cases if necessary.
          *   **Language:** British English.

  2.  **Deconstruct the Philosophical Landscape:**

      *   *Standard View:* Doing is worse than allowing (Quinn, Foot, Thomson).
      *   *Sceptical View:* No intrinsic moral difference; differences explained by costs, rights, or consequences (Kamm is a nuanced middle ground; consequentialists deny weight).
      *   *Metaphysical vs. Normative:* Is the distinction descriptive (metaphysical/causal) or inherently normative (duty-based)?
      *   *The "Policy" Angle:* This adds a constraint. Theories that are too abstract or rely on agent-relative phenomenology won't work for institutional guidelines or AI coding.

  3.  **Drafting the Desiderata (incorporating specific requested cases):**

      *   *Desideratum 1: Non-Collapsability.* Must not reduce to causation or intention. (Requested).
      *   *Desideratum 2: Double Prevention/Diversion.* Handling cases where the agent intervenes in a causal chain without originating the threat (e.g., trolley cases, removing a shield).
      *   *Desideratum 3: Withholding vs. Withdrawing.* The moral significance of stopping aid vs. never starting it, holding prospects fixed.
      *   *Desideratum 4: Distributed/Structural Agency.* Handling omissions constituted by many small commissions (budgets, protocols).
      *   *Desideratum 5: Non-Human/Algorithmic Agency.* Handling AI/automated systems where "bodily movement" is absent.
      *   *Desideratum 6: Normative Weight.* Must specify if the distinction *itself* carries weight or tracks other factors (costs, rights).
      *   *Desideratum 7: Action-Guidance.* Must be applicable in policy contexts (hospital/AI).

  4.  **Identifying Tensions (Crucial 1):**

      *   *Tension A: Metaphysical Precision vs. Distributed Agency.* If you demand a sharp, binary metaphysical line (act vs. omission), distributed structural cases (budget cuts) blur this beyond recognition.
      *   *Tension B: Normative Independence vs. Policy Usability.* If the distinction has *intrinsic* moral weight independent of consequences/rights, it's hard to codify in policy which usually relies on measurable outcomes or duty-structures.
      *   *Tension C: Withholding/Withdrawing Symmetry vs. Intuitive Asymmetry.* Policy often treats them the same (legally), but intuition often treats withdrawing as "doing."

  5.  **Identifying the "Killer" Desideratum (Crucial 2):**

      *   Which one rules out the most theories?
      *   *Candidate:* The "Distributed/Structural Agency" requirement. Most traditional theories (Quinn, Foot) rely on individual bodily movements or direct causal interventions. They crumble when the "omission" is a complex institutional process.
      *   *Alternative:* The "Non-Collapsability into Normative Duties" requirement. If the distinction is *defined* by the presence of a duty (as some suggest), it loses its ability to *determine* the duty.
      *   *Selection:* The requirement that the distinction be **descriptively identifiable prior to normative assessment** (Metaphysical/Descriptive Priority) is the biggest hurdle. Many theories sneak normativity into the definition (e.g., "allowing is what you aren't obliged to prevent"). For policy, you need to know *what* it is before you decide *if* it's permitted. However, the prompt asks for the requirement that rules out *existing contenders*. The "Distributed Agency" case is the strongest stress test for traditional metaphysical accounts. Let's go with the **Descriptive Identifiability in Non-Standard Agency** (covering AI and Structures). This kills bodily-movement accounts and simple causal accounts.

  6.  **Refining the "Bad Tests" Critique:**

      *   The prompt asks to challenge cases if they build in the contestable description.
      *   *Withholding vs. Withdrawing:* Often, "withdrawing" is described as an act (turning off a machine) but morally treated as an allowing. If the theory just says "turning off is doing," it fails. The test case needs to isolate the *moral description* from the *physical description*.
      *   *Double Prevention:* Often conflated with redirection. Needs careful setup.

  7.  **Drafting the Content (incorporating British English and Tone):**

      *   *Tone:* Academic, supervisory, rigorous, precise.
      *   *Structure:*
          1.  Introduction (acknowledging the task).
          2.  The Desiderata List (categorised).
          3.  Genuine Requirements vs. Camp Preferences.
          4.  Incompatible Pairs (The Tensions).
          5.  The "Killer" Desideratum.
          6.  Critique of Test Cases.
          7.  Conclusion.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "weight question"? Yes, need a specific desideratum on whether the distinction *does* work or *tracks* work.
      *   *Check:* Did I address AI? Yes, under agency.
      *   *Check:* British English? (e.g., "programme", "centre", "analyse", "whilst").
      *   *Check:* Policy focus? Ensure the "Action-Guidance" desideratum is prominent.
      *   *Refinement on Tensions:* Make sure the tension between "Binary Sharpness" and "Structural Omissions" is clear. This is a major philosophical friction point.
      *   *Refinement on "Killer":* I need to be decisive. The requirement that the distinction be **non-normative in its identification criteria** (i.e., you can identify it without knowing the duties) is the one that kills the "Normative Theory" (e.g. Ashby's view that omissions are just non-breaches of duty). But for policy, you need to identify the act *before* assigning the duty. So, "Pre-Normative Identifiability" is the killer. Wait, the prompt asks about ruling out *existing contenders*. Many contenders (like Quinn) rely on bodily movement. The AI/Structural case kills those. Let's combine: **Descriptive Identifiability across Non-Standard Agency.**

      *   *Re-evaluating the "Weight" aspect:* The prompt asks the theory to say something about the weight. A desideratum should be: *Explanatory Power regarding Moral Weight*. Does it explain *why* doing is worse, or does it just assert it?

      *   *Final Polish on Tensions:* The tension between "Metaphysical Objectivity" and "Policy Relevance" is key. If it's purely metaphysical, policy makers don't care. If it's purely policy-based, it's not a philosophical distinction.

      *(Self-Correction)*: I need to ensure I explicitly answer the "Genuine vs. Preference" part clearly.
      *   *Genuine:* Must not collapse into intention/causation. Must handle policy contexts.
      *   *Preference:* Binary vs. Scalar. Metaphysically prior vs. Normatively constituted.

      *(Final Plan)*:
      1.  Intro.
      2.  Desiderata (1-6).
      3.  Requirements vs. Preferences.
      4.  Incompatible Pairs.
      5.  The Single Most Demanding Requirement.
      6.  Critique of Cases.
      7.  Closing.

      *Language Check:* Ensure "programme", "analyse", "labour", "centre", "whilst", "modelling" are used correctly. Avoid Americanisms.

      *Specific focus on the "Weight Question":* Ensure one desideratum explicitly demands the theory take a stance on whether the distinction *generates* moral difference or *reflects* it.

      *Specific focus on "Double Prevention":* Ensure this is captured in the causation/agency desideratum.

      *Let's write.*
answer: |-
  **To:** MPhil Supervisor
  **From:** Philosophical Consultant
  **Subject:** Specification of Desiderata for the Doing/Allowing Distinction

  You are right to insist that your student specifies the target before loosing the arrow. Too many dissertations on the doing/allowing distinction proceed by intuitions about standard cases (the trolley, the violinist, the shallow pond) without establishing what a successful theory is actually supposed to *do*. Given your aim is policy relevance (hospital trusts, autonomous systems), the specification must be rigorous enough to withstand metaphysical scrutiny but robust enough to function in institutional guidelines.

  Below is a proposed list of desiderata, followed by an analysis of which are mandatory, which are partisan, where the tensions lie, and which requirement is the most exclusionary.

  ### I. Desiderata for an Adequate Theory

  Any account of the doing/allowing distinction offered in this thesis must satisfy the following six conditions.

  **1. The Non-Collapsability Condition**
  *   **The Requirement:** The distinction must not reduce analytically to causation, intention, or foresight.
  *   **The Consideration:** We can imagine cases where an agent causes a death without doing it (e.g., a negligent driver whose car rolls downhill due to a mechanical fault they unknowingly created) and cases where they intend a death while allowing it (e.g., a doctor who withholds treatment specifically to hasten death). If the distinction collapses into 'causing' or 'intending', it loses its unique explanatory role.
  *   **The Case:** *Double Prevention.* An agent diverts a threat (a runaway trolley) from five people onto one. The agent causes the one's death, yet many classify this as 'allowing' the threat to kill, rather than 'killing'. A theory that equates 'doing' with 'causal necessity' fails here.

  **2. The Structural Agency Condition**
  *   **The Requirement:** The account must be able to classify actions and omissions in contexts where agency is distributed, institutional, or algorithmic, rather than located in a single bodily movement.
  *   **The Consideration:** In policy contexts, harm is often the result of budget allocations, triage protocols, or default software settings. These are 'commissioned' acts (voting for a budget, writing code) that result in 'omissions' (denying care, failing to intervene).
  *   **The Case:** *The Budget Cut.* A hospital administrator signs a directive reducing staffing levels. No single patient is 'killed' by a specific act, but mortality rates rise. Is this a doing or an allowing? If the theory relies on 'bodily movement initiating a causal chain', it cannot categorise this, rendering it useless for institutional policy.

  **3. The Temporal Symmetry Condition (Withholding vs. Withdrawing)**
  *   **The Requirement:** The theory must explain why, if there is a moral difference between withholding and withdrawing support, that difference persists even when the patient's physiological prospects and the agent's physical effort are held fixed.
  *   **The Consideration:** Legally and often morally, withdrawing treatment is treated as equivalent to withholding it. However, intuition often suggests withdrawing is more akin to 'doing'. A theory must either vindicate the equivalence or explain the asymmetry without relying on the physical difference (flipping a switch vs. not plugging in).
  *   **The Case:** *The Ventilator.* A patient is on a ventilator. Doctor A decides not to intubate (withhold). Doctor B decides to extubate (withdraw). The outcome is identical. If the theory says B is 'killing' and A is 'letting die' solely based on the physical movement, it fails the policy test, where both are usually governed by the same consent protocols.

  **4. The Pre-Normative Identifiability Condition**
  *   **The Requirement:** It must be possible to identify whether an instance is a 'doing' or an 'allowing' *before* determining whether it was morally permissible.
  *   **The Consideration:** If the definition of 'allowing' is 'what you were not obliged to prevent', the distinction cannot do independent moral work. It becomes a conclusion, not a premise. For policy, one must identify the nature of the act to determine the rule that applies to it.
  *   **The Case:** *The Duty to Rescue.* If I walk past a drowning child, is this an 'allowing'? If your theory says 'Yes, because you had no duty to jump in', but then uses the fact that it is an 'allowing' to prove you had no duty, you have argued in a circle.

  **5. The Weight Specification Condition**
  *   **The Requirement:** The theory must explicitly state whether the distinction carries *intrinsic* moral weight or acts as a *proxy* for other variables (cost, rights, expectations).
  *   **The Consideration:** Some argue doing is worse *because* it is doing (intrinsic). Others argue doing is usually worse because it usually involves higher costs or rights violations (proxy). A policy document needs to know which is the case to know if exceptions can be engineered.
  *   **The Case:** *The Costless Rescue.* If I can save a life at zero cost to myself, is my failure to do so morally equivalent to killing them? If the distinction has intrinsic weight, the answer is 'no'. If it is a proxy for cost, the answer approaches 'yes'. The theory must take a stance.

  **6. The Non-Human Agency Condition**
  *   **The Requirement:** The distinction must be applicable to automated systems where there is no phenomenology of agency, effort, or biological movement.
  *   **The Consideration:** An autonomous vehicle must decide whether to swerve (doing) or stay course (allowing). It does not 'try' or 'feel'. A theory anchored in human volition or somatic experience cannot guide the coding of such systems.
  *   **The Case:** *The Algorithmic Triage.* An AI allocates a ventilator to Patient A over Patient B. For Patient B, is this a killing (active denial) or a letting die (failure to allocate)? The code executes a command (commission), but the result is a non-provision of care (omission).

  ---

  ### II. Genuine Requirements vs. Camp Preferences

  Your student must distinguish between constraints that any usable theory must meet and those that reflect specific metaphysical commitments.

  **Genuine Requirements (Must be met for policy utility):**
  1.  **Non-Collapsability:** If it collapses into causation or intention, it is redundant for policy analysis.
  2.  **Pre-Normative Identifiability:** Policy requires categorisation before evaluation. You cannot write a rule saying 'Do not do X' if 'X' is defined as 'what you ought not do'.
  3.  **Structural & Non-Human Applicability:** Since the end-user is an institution or system designer, a theory restricted to individual human bodily movement is functionally obsolete.

  **Camp Preferences (Contestable, not required):**
  1.  **Metaphysical Priority:** The demand that the distinction be grounded in fundamental physics or metaphysics prior to any normative facts. A functionalist account (defined by social roles or expectations) may suffice for policy without satisfying a metaphysician.
  2.  **Binary Nature:** The demand that the distinction be sharp (either/or). A scalar account (degrees of 'doing-ness') might better handle the Structural Agency cases, though it complicates policy rules.
  3.  **Neutrality between Frameworks:** The demand that the account work equally for consequentialists and deontologists. It is permissible for the thesis to argue that the distinction *only* has weight within a rights-based framework, provided it admits this limitation.

  ---

  ### III. Incompatible Pairs of Desiderata

  Here we encounter the friction points. Your student should not smooth these over; they should present them as limit conditions of the theory.

  **1. Binary Sharpness vs. Structural Agency**
  *   **The Tension:** If you require the distinction to be binary and sharp (Desideratum: Binary Nature), you will likely fail the Structural Agency Condition. In distributed systems (budget cuts, protocol defaults), the causal contribution of any single agent is partial. The 'act' is spread across time and people. To force a binary classification onto a continuum of causal contribution often requires arbitrary stipulation.
  *   **The Result:** A theory that insists on a sharp metaphysical line will likely have to exclude institutional cases as 'indeterminate', rendering it useless for the hospital trust scenario. Conversely, a theory that handles institutional cases well will likely have to admit that the distinction is fuzzy or context-dependent.

  **2. Pre-Normative Identifiability vs. Weight Specification (Intrinsic)**
  *   **The Tension:** If you require the distinction to be identifiable prior to normative assessment (Desideratum 4), but also demand it carry *intrinsic* moral weight (Desideratum 5), you face the 'Normative Irrelevance' challenge. If the description 'doing' can be applied without knowing the duties, but the moral weight depends on the duties (e.g., rights violations), then the description itself is doing no work.
  *   **The Result:** You cannot easily hold that the distinction is *purely descriptive* yet *intrinsically morally potent*. Most successful theories either make the distinction partly normative (which risks circularity) or deny it has intrinsic weight (making it a proxy). A policy document needs to know which path is taken, as it determines whether exceptions are possible.

  ---

  ### IV. The Single Most Demanding Requirement

  If I must identify the single requirement that does the most work in ruling out existing contenders, it is **The Structural Agency Condition (Desideratum 2)**, specifically when combined with **Pre-Normative Identifiability**.

  **Why this rules out contenders:**
  Most canonical accounts (e.g., Quinn's *Actions, Intentions, and Consequences*; Foot's *Morality, Action, and Outcome*) rely heavily on the model of an individual agent initiating a causal sequence through bodily movement.
  *   **Quinn** relies on the idea of 'direct harmful agency'. In a distributed budget cut, who is the direct agent? The vote? The signer? The protocol? Quinn's account struggles to locate the 'doing' without smuggling in normative assumptions about who was responsible.
  *   **Causal Accounts** (e.g., Dowe) struggle because in structural cases, the 'omission' is often causally necessary for the outcome (the budget *had* to be cut for the care to be denied), yet it is described as an allowing.
  *   **Normative Accounts** (e.g., Ashby) define omissions as breaches of duty. But for policy, we need to identify the omission *to determine* the duty.

  By insisting that the theory must handle the *Budget Cut* or the *Algorithmic Triage* case without collapsing into 'whatever the policy says is wrong', you eliminate nearly all traditional individualistic metaphysical accounts. They simply lack the vocabulary to describe 'institutional omissions' that are constituted by 'individual commissions'. This forces the student towards a more functionalist or social-role-based account, which is far more useful for your intended policy application.

  ---

  ### V. Critique of Test Cases

  You asked me to flag if any of your proposed cases are bad tests because they build in the contestable description. Two of them require careful reframing.

  **1. Withholding vs. Withdrawing**
  *   **The Problem:** This pair is often rigged. If the student describes withdrawing as 'turning off a switch' (act) and withholding as 'not plugging in' (omission), they have defined the distinction physically rather than morally.
  *   **The Fix:** The case must be described in terms of *continuity of care*. The test should not be the physical movement, but whether the agent has established a 'course of conduct'. The theory must explain why establishing a course of conduct might transform an allowing into a doing, or why it should not. If the theory cannot distinguish between *never starting* and *stopping* without referencing the physical switch, it is too crude for medical policy.

  **2. Double Prevention**
  *   **The Problem:** This case often conflates 'doing' with 'redirecting'. If the student assumes that redirecting a threat is inherently 'allowing', they have already accepted a specific moral conclusion (the Doctrine of Double Effect or similar).
  *   **The Fix:** The case must isolate the *source of energy*. In double prevention, the harm comes from the pre-existing threat, not the agent's intervention. The test is whether the theory can account for the agent's causal contribution (removing a shield) without classifying it as 'killing' simply because the agent touched the victim. If the theory says 'you touched the shield, therefore you killed', it fails to capture the intuition that the threat was already in motion.

  ### VI. Conclusion for the Student

  Instruct your student that the goal is not to find a definition that matches all pre-theoretical intuitions (as these conflict in the hard cases), but to find a specification that is **operationalisable**.

  For a hospital trust or an AI developer, the question is not "Is this metaphysically an act?" but "Does this fall under the stricter regulatory regime reserved for active interventions?" Therefore, the **Pre-Normative Identifiability** and **Structural Agency** conditions are the non-negotiables. If a theory cannot tell a hospital administrator whether a protocol change is a 'doing' or an 'allowing' without first asking a moral philosopher to adjudicate the duties involved, it is not a theory of the distinction; it is merely a restatement of the moral problem.

  The tension they must navigate is between **precision** (needed for rules) and **complexity** (needed for structural cases). Acknowledging that these may not be jointly satisfiable is a stronger thesis result than pretending they are.
