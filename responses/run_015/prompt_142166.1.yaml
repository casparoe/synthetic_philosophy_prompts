  **Decision Rules Considered and Rejected**

  Before stating my recommendation, I want to address three decision rules we discussed informally that I believe we must discard. First, a strict "but-for" counterfactual test, which would require proving exactly where every family would be financially had the taking not occurred. I reject this because it imposes an epistemic burden impossible to meet after a century; requiring proof of hypothetical wealth punishes victims for the opacity of history. Second, a rule keyed solely to present-day racial disparity or poverty. While morally urgent, this converts reparations for a specific municipal tort into general welfare policy, violating the ordinance's requirement that spending be "traceable to the taking." Third, a purely needs-based rule. This conflates moral debt with charity. Reparations are owed because of what was done, not because of the recipient's current bank account. We must anchor this program in the historical act, not present-day socioeconomic status.

  ***

  **MEMORANDUM**

  **TO:** The Fairhaven Reparations Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** September 12, 2024
  **SUBJECT:** Recommendation for Final Disposition of Cedar Flats Claims

  **Bottom Line Recommendation**

  I move that the Commission adopt Proposal A, the Cedar Flats Direct Descent Grant, with specific modifications to the evidentiary standard. We should reject Proposal B (the Community Land Trust) as a primary vehicle because it severs the link between the specific victims of the 1922 taking and the remediation, risking legal challenge under the ordinance's "traceable harm" clause. However, to ensure implementation is viable, we must condition adoption on a flexible documentation protocol and a fixed cap on generational eligibility.

  **Eligibility and Evidentiary Standard**

  Eligibility shall extend to lineal descendants of property owners and documented tenants residing in Cedar Flats between 1910 and 1922, limited to three generations (children, grandchildren, great-grandchildren). Given the incomplete 1922 records, we cannot require deed abstracts alone. I propose a "preponderance of credible evidence" standard. This accepts federal census records, city directories, and church records as primary documentation. Where these are missing, we shall accept sworn genealogical affidavits corroborated by two independent sources (e.g., oral history interviews archived locally, family Bibles, or obituary records). This shifts the burden away from the applicant to prove a negative (that records do not exist) and acknowledges that the city's own archival neglect contributed to the evidentiary gap. Staff should be instructed to prioritize triangulation over single-document strictness.

  **Counterfactuals and the Causal Chain**

  We must take an explicit position on the "better off" descendants, such as the family who moved to Chicago and produced a surgeon. I recommend we reject any reduction of awards based on counterfactual wealth comparisons. The harm remediated here is the violation of property rights and the dignitary harm of forced removal, not merely net economic loss. A wrongdoer does not escape liability because the victim later succeeded despite the injury. To reduce awards based on later windfalls is to treat the payment as welfare rather than rectification.

  Regarding the Ash Street Ratepayers' Legacy, we must draw a principled line. I recommend rejecting their claim. While their economic loss was real, the causal chain for this specific fund must stop at the boundary of the condemned zone. The ordinance authorizes remediation for the "taking," which legally applies to the seized properties. Extending liability to indirect economic ripple effects creates an infinite regress of claimants that dilutes the fund beyond usability. The acknowledgment of their suffering should be handled through historical marker funding, not direct cash reparations from this specific pool.

  **Funding and Suburban Objections**

  The program should be funded via the existing water utility surcharge. The objection from Ellisburgh, North Rill, and Vinegar Hill—that they bear no responsibility for acts predating their incorporation—confuses political membership with benefit retention. The water utility itself is the fruit of the 1922 taking; the Ash Street water works were built on the condemned land. These suburban towns connect to a regional system whose foundational asset was acquired through this injustice. Liability attaches to the continuity of the municipal corporation and the retention of the stolen asset, not the residency status of ratepayers in 1922. The surcharge is not a penalty on current residents but a restitution of ill-gotten gains generated by the utility infrastructure.

  **Public Finding and Acknowledgment**

  Payment without acknowledgment is merely a transaction; it fails to restore the civic standing of the victims. The city must pair these grants with a formal public finding. This serves the expressive function of reparations: declaring that the state recognizes its own breach of trust. I recommend we adopt the following finding verbatim in the final ordinance:

  "The City of Fairhaven acknowledges that the 1922 condemnation of Cedar Flats was a wrongful act that disenfranchised a specific community to build public infrastructure. This payment represents not charity, but the return of value unjustly taken, affirming that the city's prosperity cannot rest on the dispossession of its citizens."

  **The Strongest Argument Against This Recommendation**

  The most compelling argument against my recommendation is the case for Proposal B, the Community Land Trust. Proponents argue that individual payments, however justified, are atomizing and fleeting. A one-off grant may be absorbed by debt or inflation, failing to alter the structural conditions that keep Cedar Flats descendants marginalized. Proposal B builds permanent community wealth in the geographic vicinity of the harm, addressing the segregation that the taking exacerbated. It avoids the invasive genealogical auditing that feels like a second dispossession, and it benefits the current residents of the affected tracts who suffer the ongoing legacy of redlining, regardless of ancestry.

  This argument prioritizes forward-looking structural repair over backward-looking rectification. It posits that the goal of reparations is not to balance a historical ledger but to cure the present-day disease caused by the history. There is moral weight here: helping a struggling family today living near the site may do more tangible good than sending a check to a middle-class descendant in another state. However, I reject this path because it violates the specific mandate of our ordinance to remedy harms "traceable to the taking." A community trust for non-descendants is indistinguishable from general housing policy. It risks legal invalidation and, more importantly, moral dilution. It allows the city to claim it has "done reparations" without actually admitting liability to the specific victims. We cannot solve current poverty by bypassing the specific debt we owe to the past. We must pay the debt first; we can advocate for broader housing policy separately.
