      *   **Humeanism (Regularity Theory):** Laws are just summaries of what has happened everywhere and everywhen. There is no "necessity" or "governing power" behind them. $A$ happens, then $B$ happens, always. If $B$ stops happening, the law was just wrong or incomplete.
      *   **Anti-Humeanism (Necessitarianism/Dispositionalism):** Laws reflect real connections, powers, or necessities in nature. They *make* things happen. $A$ produces $B$ because of the nature of $A$ and $B$.
      *   **Settled vs. Contested:**
          *   *Settled:* There is no consensus on which view is correct. Both have sophisticated defenses. Both agree that science works (mostly) regardless of the metaphysics. Both agree that prediction is key.
