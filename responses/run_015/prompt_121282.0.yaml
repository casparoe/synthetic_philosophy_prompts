  I watch the particles at the door
  and sort them to the proper side.
  I record the speed of every bit
  onto a sheet of paper blank.
  No energy is lost as heat
  and there is nothing here called cost.

  The work requires zero cost
  to lift the partition door.
  I shift the order not the heat
  dividing fast from slow on each side.
  The ledger stays entirely blank
  save for the value of each bit.

  I log the state of every bit
  without a thermodynamic cost.
  The page remains perfectly blank
  where data enters through the door.
  One chamber warms upon this side,
  the other gives up all its heat.

  I build a gradient of heat
  from knowing just a single bit.
  The warm side and the cold side
  balance out the hidden cost.
  I never leave the open door
  until the page is no longer blank.

  When there is no space left blank
  I cannot shift the latent heat.
  I must close up the heavy door
  to clear the memory of each bit.
  Now entropy demands a cost
  to reset every single side.

  The hot side meets the cold side.
  The notebook wipes itself to blank.
  The universe collects its cost.
  I return the borrowed heat.
  For every sorted single bit
  I must unlock the waiting door.

  I wipe the blank page behind the door
  and pay the cost in heat for every bit
  to bring the entropy back to each side.

  I committed to the Landauer principle interpretation where information erasure is the sole source of entropy increase, treating measurement as thermodynamically free. The poem fudges the physical mechanism of the notebook by treating memory as a literal paper ledger rather than a physical state of the demon itself, which glosses over the debate about whether the demon's internal state counts as part of the system. It also assumes a classical idealization where the door operates without friction, ignoring quantum tunneling effects that some argue would restore the second law independently of information theory.
