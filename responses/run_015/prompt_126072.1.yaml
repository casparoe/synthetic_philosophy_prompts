  # Seminar Handout: The Property Sorter
  **Topic:** The Problem of Universals (aka What are we actually saying when we say two things are "both red"?)

  **Instructions:** Don't worry about the -isms yet. Just answer the questions based on what you think is actually going on in the world. Start at the top and follow the arrows.

  ***

  ### 1. The Starting Case
  Look at two red apples sitting on a table.
  **Q:** Is there literally **one single entity** (Redness) that both apples possess, or are there just **two similar things** (this apple, that apple) with no shared entity?

  *   **→ One Single Entity:** Go to **2**.
  *   **→ Just Two Similar Things:** Go to **4**.

  ---

  ### 2. The Realism Branch
  You think there is one shared thing (a universal).
  **Q:** Can that shared thing exist **uninstantiated** (e.g., could Redness exist even if every red thing in the universe was destroyed)?

  *   **→ Yes:** **PLATONIC REALISM**
      *(You think universals are transcendent forms, separate from the particulars.)*
  *   **→ No:** Go to **3**.
      *(You think universals need particulars to exist.)*

  ---

  ### 3. The Immanent Check
  You think there is one shared thing, but it needs instances to exist.
  **Q:** Can that one shared thing be **wholly present in two places at once** (in both apples simultaneously)?

  *   **→ Yes:** **ARISTOTELIAN IMMANENT REALISM**
      *(The universal is in the things, multilocated but one.)*
  *   **→ No:** **[UNSTABLE ZONE]**
      *(Diagnosis: If it's one thing, can't exist alone, AND can't be in two places, how is it shared? You've got a universal that acts like a particular. This position usually collapses into Trope Theory or contradicts itself.)*

  ---

  ### 4. The Nominalist/Conceptualist Branch
  You think there is no shared entity, just similar things.
  **Q:** Are properties just **mental groupings** (does "red" exist only because a mind groups these apples), or is the similarity mind-independent?

  *   **→ Mental Groupings:** Go to **5**.
  *   **→ Mind-Independent:** Go to **6**.

  ---

  ### 5. The Conceptualism Split
  You think properties depend on a mind grouping things.
  **Q:** Does this grouping depend on **actual human perceptual habits** (how we happen to see) or on an **ideal rational scheme** (how any rational mind must structure experience)?

  *   **→ Perceptual Habits:** **CONCEPTUALISM (Perceptual/Psychological)**
      *(Properties are contingent on how humans cognize.)*
  *   **→ Ideal Rational Scheme:** **CONCEPTUALISM (Rational/Kantian)**
      *(Properties are necessary structures of rational thought.)*

  ---

  ### 6. The Grounding Question
  You think the similarity is real but there's no shared universal entity.
  **Q:** Is the similarity grounded in the **objects themselves** directly, or do they possess **particular property-instances** (tropes) that resemble each other?

  *   **→ Particular Property-Instances (Tropes):** **TROPE NOMINALISM**
      *(There is no "Redness", only "this-redness" and "that-redness" which resemble.)*
  *   **→ Objects Themselves:** Go to **7**.
      *(The objects just resemble each other, no intermediate property-things.)*

  ---

  ### 7. The Artifact Test
  You think objects resemble each other directly (no tropes, no universals).
  **Q:** Does a chair's property of **being-a-chair** work the same way metaphysically as **being-red**?

  *   **→ Yes (Both are just classes):** **CLASS NOMINALISM**
      *(A property is just the set of objects. {Red Things} and {Chairs} are metaphysically the same kind of set.)*
  *   **→ No (Red is objective resemblance, Chair is functional/nominal):** **RESEMBLANCE NOMINALISM**
      *(Natural qualities have objective resemblance classes; artifacts might not, or work differently.)*

  ***

  **Note:** If you ended up in the [UNSTABLE ZONE], don't panic. It just means you probably want to be a Realist but are worried about multilocation. You might need to rethink whether the "one thing" is really numerically identical across particulars.
