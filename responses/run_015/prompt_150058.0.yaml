  Here's a list of questions for your chat. I've kept them proper casual and in British English, just like you asked. There's nine here altogether, including the follow-ups you wanted.

  1.  You reckon there's no hard line between duty and doing something extra, just a sliding scale of cost. But if that's true, why do most of us feel properly guilty when we walk past a stranger in trouble? If it's not actually required of us, where's the guilt coming from?

  2.  **Follow-up:** I guess you'd say that guilt is just social pressure, right? But even when no one's watching, that nagging feeling is still there. Are you saying we've just internalised the pressure, or is there something else going on?

  3.  I've heard people talk about taking 'moral holidays'—like, is it okay to have a weekend where you just relax and don't worry about doing good deeds? On your scale, if you're not climbing up, are you always slipping down?

  4.  **Follow-up:** If the answer is that we're always slipping down, doesn't that lead to burnout? Is it actually sustainable to live like there's no point where you can just switch off?

  5.  What about the folks who do tiny kind acts every day—holding doors, being patient on the tube—but never pull off any big heroic saves? Does your sliding scale capture that pattern, or does it miss the value of consistency?

  6.  **Follow-up:** So if it misses consistency, are you saying morality is more about the biggest cost you're willing to pay rather than the habit of being decent alot of the time?

  7.  Who gets to decide what counts as 'costly' on this scale? Is it subjective to the person, or is there an objective measure? If it's subjective, doesnt that make morality a bit wobbly?

  8.  If there's no supererogation, then praise seems weird. We praise people for doing their duty? How do you distinguish between someone who just did what they owed us versus someone who went above and beyond?

  9.  Lastly, does holding this view change how you live your own life? Do you find yourself pushing harder because there's no 'extra' credit, or does it take the pressure off?

  Cheers, hope the chat goes well.
