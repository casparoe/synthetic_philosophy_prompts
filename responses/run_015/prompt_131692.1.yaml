answer: |-
  1. These mappings fail as moral categories because Antonio engages in the very unlimited acquisition Aristotle condemns, while Belmont's wealth relies on inheritance rather than natural sufficiency. They survive only as spatial distinctions between the public sphere of contract and the private sphere of gift, though both are contaminated by the other's logic.
  2. This reading is compelling because the bond attempts to force incommensurables into a metric, revealing the violence inherent when conventional measure exceeds its proper sphere. It aligns with Aristotle's warning that money is a measure for exchange, not a substance to be extracted from life itself.
  3. Understanding mercy as equity fits Aristotle's correction of universal law, gaining a philosophical grounding for Portia's intervention while potentially obscuring the theological dimension of grace. The play thus shows justice requires human judgment to adjust the rule to the case, preventing the law from becoming an instrument of injury.
  4. You are not overreading, as the rings function like coinage whose value depends on mutual agreement and strict adherence to convention rather than intrinsic worth. The repeated oaths restore the convention's validity, demonstrating that social bonds require periodic renewal to maintain their worth.
  5. The play shows that economic exchange is never purely rational but is always entangled with identity, hatred, and bodily risk, which Aristotle's abstract treatises ignore. I would put the end of the trial scene before students, where Shylock's economic penalty becomes an erasure of his religious and social self.
