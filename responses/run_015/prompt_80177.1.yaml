answer: |-
  This is a sharp framing. You are correct that nuclear deterrence is an ontological outlier in political science: it is a causal mechanism defined by the absence of its effect. To nail down the spec, we need a list of desiderata that forces a theory to confront the non-event nature of the phenomenon, the specific pathology of extended guarantees, and the Schellingian logic of risk manipulation.

  Here are the desiderata for an adequate theory of nuclear deterrence, the tensions between them, and a brief scorecard of the major approaches.

  ### I. Desiderata for Adequacy

  A theory of nuclear deterrence must satisfy the following seven requirements to count as adequate.

  **1. The Non-Event Explanation (The Long Peace)**
  *   **Requirement:** Must explain stability without relying on post-hoc functionalism (i.e., "war didn't happen because deterrence worked"). It must identify the causal mechanism that suppresses conflict initiation between nuclear rivals.
  *   **Case/Consideration:** The US-USSR dyad (1945–1991). Both had first-strike options and ideological hostility, yet zero direct great power war. A theory must distinguish this from mere luck or conventional balance.

  **2. The Credibility of Self-Destruction (Extended Deterrence)**
  *   **Requirement:** Must explain why a state would risk national suicide to defend an ally where its own vital survival is not immediately at stake. It must solve the time-inconsistency problem: the threat is useful *ex ante* but irrational *ex post*.
  *   **Case/Consideration:** The US guarantee to West Germany (1960s). Why did the USSR believe the US would trade New York for Hamburg? This is the Chain-Store Paradox application: credibility must be maintained across a sequence of crises without actually triggering the punishment.

  **3. The Rationality of Irrationality (Brinkmanship)**
  *   **Requirement:** Must account for Schelling's insight that deterrence often relies on *relinquishing* control, not maximizing it. The theory must model how actors make threats credible by deliberately increasing the risk of accidental or unauthorized war.
  *   **Case/Consideration:** The Cuban Missile Crisis. Kennedy did not threaten certain retaliation; he threatened a loss of control ("we might not be able to stop our field commanders"). A theory that assumes perfect rational control cannot explain why raising the probability of *mutual* disaster compels concession.

  **4. Crisis Stability vs. Arms Race Stability (The Vulnerability Paradox)**
  *   **Requirement:** Must distinguish between forces that stabilize crises (survivable second-strike) and forces that destabilize them (vulnerable first-strike capabilities). It must explain why making your own forces *more* vulnerable to a first strike can sometimes make the adversary *more* nervous and prone to preemptive action.
  *   **Case/Consideration:** The deployment of MIRVs vs. SSBNs. Hardened silos invite first-strike calculations; submarines discourage them. A theory must explain the incentive to strike first when forces are vulnerable (use them or lose them).

  **5. Distinction Preservation (Punishment, Denial, and Scope)**
  *   **Requirement:** Must not collapse **Deterrence by Punishment** (retaliatory cost imposition) with **Deterrence by Denial** (defensive incapacity to win). It must also distinguish **Direct Deterrence** (defending the homeland) from **Extended Deterrence** (defending allies).
  *   **Case/Consideration:** NATO's "Flexible Response." Denial (conventional defense) was needed to make Punishment (nuclear escalation) credible. A theory that treats all deterrence as "cost imposition" fails to explain the conventional buildup in Europe.

  **6. The Stability-Instability Paradox**
  *   **Requirement:** Must explain how nuclear stability at the strategic level permits instability at the conventional or proxy level. If nuclear war is off the table, does that encourage lower-level aggression?
  *   **Case/Consideration:** Soviet proxy wars in Africa/Asia or the Kargil War (1999). Nuclear weapons prevented total war but may have incentivized limited conflict under the nuclear umbrella.

  **7. Empirical Falsifiability (The Testability Problem)**
  *   **Requirement:** Must generate observable implications beyond the absence of war. It must predict behavior *during* crises (mobilization, signaling, concession patterns) that distinguishes deterrence success from other causes of peace.
  *   **Case/Consideration:** If deterrence works, we see nothing. If it fails, we see war. A theory must identify intermediate variables (e.g., specific signaling costs, force posture changes) that correlate with successful deterrence to avoid tautology.

  ---

  ### II. The Impossible Tensions

  You suspected a tension between explanation and testability. It is deeper than that. There are three structural tensions where satisfying one desideratum undermines another.

  **1. The Testability vs. Success Tension**
  *   **The Conflict:** If a theory successfully explains why war *didn't* happen (Desideratum 1), it relies on counterfactuals ("war would have happened without nukes"). Counterfactuals are inherently untestable. If you demand strict empirical falsifiability (Desideratum 7), you must look at cases where deterrence *failed* (India-Pakistan, etc.), but those cases may differ structurally from the US-USSR "Long Peace."
  *   **The Argument:** A theory perfectly tuned to the US-USSR non-event is historically specific and unfalsifiable. A theory general enough to be tested on failures may not explain the US-USSR success. You cannot maximize both historical fit for the "Long Peace" and general scientific testability.

  **2. The Rationality vs. Credibility Tension**
  *   **The Conflict:** Rational Choice models (Desideratum 3) assume actors maximize utility. However, a rational actor will never execute a suicidal retaliatory threat once the adversary has already struck. Therefore, a purely rational threat is not credible (Desideratum 2). To make it credible, you must model "irrationality" (Schelling's brinkmanship).
  *   **The Argument:** A theory that strictly enforces rationality dissolves the credibility of extended deterrence. A theory that incorporates "irrationality" to save credibility risks becoming unmodelable or ad hoc (anything can be explained by "they were crazy"). You cannot have perfect rationality and perfect credibility simultaneously.

  **3. The Direct vs. Extended Tension**
  *   **The Conflict:** Direct deterrence relies on self-preservation (easy to model). Extended deterrence relies on altruism or reputation (hard to model).
  *   **The Argument:** Many theories solve Direct Deterrence easily (MAD) but fail Extended Deterrence (why die for Berlin?). Reputation theories solve Extended Deterrence (protecting future credibility) but struggle to explain why states don't fight *more* proxy wars to build that reputation. A single unified theory often collapses the distinction, failing to explain why the US would nuke for Washington but hesitate for Warsaw.

  ---

  ### III. Scorecard of Major Approaches

  Here is how the three dominant theoretical traditions perform against your desiderata.

  | Desideratum | **MAD / Rationalist** | **Reputation / Signaling** | **Constructivist / Taboo** |
  | :--- | :--- | :--- | :--- |
  | **1. Non-Event (Long Peace)** | **Pass.** Clearly links survival to mutual vulnerability. | **Mixed.** Peace is a byproduct of costly signaling, not the core focus. | **Pass.** Norms explain the non-use better than capability alone. |
  | **2. Extended Credibility** | **Fail.** Struggles to explain why suicide is rational for an ally. | **Pass.** Credibility is the currency; fighting proxies maintains the "chain store." | **Mixed.** Taboos extend, but why do they extend to some allies and not others? |
  | **3. Brinkmanship (Irrationality)** | **Fail.** Treats risk as a calculable variable, not a loss of control. | **Pass.** Signaling often involves "burning bridges" to prove resolve. | **Fail.** Focuses on moral constraints, not strategic manipulation of risk. |
  | **4. Vulnerability Paradox** | **Pass.** Best at explaining first-strike instability (Crisis Stability). | **Mixed.** Focuses on political will, not technical force posture. | **Fail.** Often ignores technical military variables. |
  | **5. Distinctions (Punish/Deny)** | **Mixed.** Often collapses them into "cost imposition." | **Pass.** Distinguishes signals of denial vs. punishment well. | **Pass.** Distinguishes normative constraints from material ones. |
  | **6. Stability-Instability** | **Pass.** Explicitly predicts lower-level conflict under umbrella. | **Pass.** Reputation costs vary by level of conflict. | **Fail.** Struggles to explain why taboo holds for nukes but not conventional. |
  | **7. Testability** | **Fail.** High reliance on unobservable counterfactuals. | **Pass.** Signals and audience costs are observable. | **Mixed.** Discourse is observable, causal link to action is fuzzy. |

  **Summary Verdict:**
  *   **MAD/Rationalist:** Best for **Direct Deterrence** and **Crisis Stability**, but fails **Extended Credibility** and **Brinkmanship** (unless modified to include "rational irrationality").
  *   **Reputation/Signaling:** Best for **Extended Deterrence** and **Testability**, but risks reducing nuclear politics to generic power politics (missing the unique stakes).
  *   **Constructivist/Taboo:** Best for the **Non-Event** (why *no use* since 1945), but weakest on **Crisis Dynamics** and **Policy Prescription**.

  ### IV. The Schellingian Specification

  Regarding your hunch on Schelling: You are right. Deterrence is not a standard optimization problem; it is a **commitment problem**.

  To satisfy Desideratum 3 (Brinkmanship), your theory must explicitly owe us an account of **The Competition in Risk-Taking**. It cannot simply say "actors calculate costs." It must explain:
  1.  **Delegation:** How actors shift decision-making to subordinates or automated systems to reduce their own ability to back down.
  2.  **Ambiguity:** How actors deliberately obscure their red lines to prevent the adversary from calculating a "safe" violation.
  3.  **The Threat that Leaves Something to Chance:** The theory must model the threat not as "If X, then I will Y" (which is incredible if Y is suicidal), but as "If X, the situation may spiral to Y beyond my control."

  If your theory treats actors as fully rational controllers of their military machinery, it will fail the Schelling test. It must allow for the strategic utility of **losing control**.
