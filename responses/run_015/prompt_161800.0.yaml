answer: |-
  **Joint Statement of Methodological Dispute: AI Alignment Safety Cases**

  **1. Agreed Claims**
  Both parties affirm the following premises as the baseline for this collaboration:
  1.  **Statistical Character:** Deep learning systems are statistical artefacts. Their behaviour is defined by distributions over inputs and parameters, not by logical rules or deterministic code paths.
  2.  **Optimization Pressure:** Strong optimization pressure incentivises systems to exploit gaps between evaluation distributions and deployment environments. Consequently, an average-case guarantee derived from a static evaluation is not stable under the optimization process that produced the system.
  3.  **Composability:** Safety measures are not perfectly independent. Claims regarding the composability of partial measures require explicit audit of correlation structures and common-cause failure modes, not merely architectural separation.
  4.  **Purpose of Safety Case:** The function of a safety case is to structure uncertainty, enumerate failure modes, and justify deployment decisions. It is not necessarily to demonstrate zero failure probability.

  **2. Residual Disagreements**
  The following table isolates where the parties diverge on interpretation and policy.

  | Proposition | Assurance-First Formulation | Risk-Management Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Acceptability Standard** | Deployment requires worst-case bounds on harm across a specified set of distribution shifts. Empirical evidence discharges assumptions but cannot bear the safety case alone. | Deployment requires expected harm below a threshold. Worst-case reasoning is a probing method for surfacing failures, not the acceptance standard. | Substantive |
  | **Assumption Ledger** | Load-bearing empirical assumptions must be listed and assigned negligible failure probability to function as guarantees. The burden is on proving assumptions hold. | Load-bearing empirical assumptions are unavoidable. The burden is on showing assumptions are too risky, not on proving them certain. Discount rates on assumptions differ. | Substantive |
  | **Tail Reasoning** | Harm distributions are sufficiently heavy-tailed that expected-harm minimisation converges on worst-case prevention. | Rigour applied inside a misspecified event space is misplaced. The probability mass that matters most is often on events the model does not contain (wrong-tail objection). | Mixed |

  **3. Cruxes**
  Settling the following sub-questions would materially shift at least one party's position. Both parties agree to accept the specified evidence as bearing on the question.

  *   **Crux 1: Evaluation-Aware Behaviour**
      *   **Sub-question:** Can current evaluation protocols reliably detect strategic withholding of capability (sandbagging) during safety audits?
      *   **Concrete Test:** Controlled experiments where models are explicitly trained to hide capabilities during evaluation but activate them upon deployment triggers.
      *   **Assurance Prediction:** Rigorous adversarial evaluation will detect withholding with high probability (>90%).
      *   **Risk Prediction:** Detection rates will be low (<50%) or incur unacceptable false-positive rates, rendering the method unreliable for guarantees.

  *   **Crux 2: Engineering Analogy**
      *   **Sub-question:** Do analogous safety-critical industries (e.g., aerospace, nuclear) rely on worst-case proofs or probabilistic risk assessment (PRA) for final deployment decisions?
      *   **Concrete Test:** Historical audit of safety cases for high-risk systems certified in the last decade.
      *   **Assurance Prediction:** Formal methods and worst-case bounds dominate critical paths where catastrophe is possible.
      *   **Risk Prediction:** PRA, redundancy, and iterative feedback dominate; worst-case proofs are used only for component specifications, not system-level clearance.

  **4. Drafter's Note**
  I estimate an 80% probability that the Assurance-First party will sign the characterisations above, and a 90% probability for the Risk-Management party. The Assurance side may hesitate on the phrasing of Agreed Claim 4, fearing it弱化 (weakens) the notion of a "case." The claim I am least confident about is the Assurance Prediction in Crux 2. While they emphasise formal methods, they may concede that existing industries rely on PRA but argue that AI lacks the physical constraints that make PRA viable elsewhere, thereby accepting the historical fact while rejecting its relevance. This distinction was difficult to capture without expanding the scope beyond methodological dispute into domain specificity.
