          *   In scenario (6), the *statue* undergoes total material replacement (clay to polymer). If the statue is an "object" governed by (7), it should be destroyed. But (6) says it survives.
          *   *Crucial nuance:* Does the user mean the statue *is* the object in (7)? Yes, presumably.
          *   *Resolution:* The user likely holds a sortal-relative view. The *clay* (material object) obeys (7). The *statue* (artefact) might obey different persistence conditions. But (7) is phrased universally ("an object").
          *   *Correction:* I need to point out that (7) is too universal. It applies to material chunks, but perhaps not artefacts. Or (6) is wrong.
          *   *Least costly:* Restrict (7) to "material objects qua matter" or "natural kinds," allowing artefacts to persist via form/history. This preserves the intuition in (6) which is standard for artefacts.

      *   *Refining the (3) vs (5) argument:*
          *   (3) Constitution is primitive.
          *   (5) Distinction is Modal/Relational.
          *   If the distinction is *exhaustively* modal/relational, is the relation primitive?
          *   If $x$ constitutes $y$ iff $x$ and $y$ coincide and have different modal profiles, then constitution is reduced to coincidence + modal difference.
          *   (3) denies reduction to modal coincidence.
