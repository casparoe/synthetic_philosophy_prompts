          *   *Analysis:* If the statue is constituted by clay, and every particle of clay is replaced by polymer, the statue has undergone total material replacement. According to (7), this destroys the object. According to (6), the statue survives. This is a direct contradiction.
          *   *Severity:* High/Critical. It breaks the metaphysics of persistence.
          *   *Resolution:* Either deny (6) (statue doesn't survive) or deny/modify (7) (allow form/history to sustain identity without material continuity for *some* objects). Given the user identifies as an endurantist, (7) is a specific constraint they've placed on endurantism. However, many endurantists *do* allow Ship of Theseus-style survival based on form. But (7) explicitly states "total material replacement... destroys the original object." So (6) and (7) are logically incompatible as written.
          *   *Least Costly Revision:* Modify (7). It is too strong. Most endurantists allow persistence through material change if the *form* or *functional organisation* is retained. Restricting (7) to "material objects *qua* matter" or removing the "any original constituent" clause fixes it. Alternatively, modify (6) to say the statue does not survive, but that clashes with standard intuition about artefacts. Modifying (7) is cheaper for a general theory of artefacts.

