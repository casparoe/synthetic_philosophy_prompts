          *   Standard worry: If Statue and Clay are wholly present at $t$, and occupy the same space, how are they distinct? (The "too many thinkers" or co-location problem).
          *   *Analysis:* This is a standard cost of the Constitution View + Endurantism. It's not an inconsistency, but a theoretical cost. The prompt asks for consistency check, not theoretical virtue check, but severe tension might arise if (1) makes (2) impossible. It doesn't make it impossible, just controversial.
