          *   *Analysis:* Is (7) actually true of endurantism? Endurantism says the *whole* object is present at $t_1$ and $t_2$. It does not strictly demand material continuity, only qualitative or causal continuity. Some endurantists (strict mereological essentialists) would agree with (7). Others (standard sortal theorists) would disagree.
