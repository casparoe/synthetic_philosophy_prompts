answer: |-
  # Session Plan: The Separateness of Persons (50 Minutes)

  **Goal:** Move your friends from "Utilitarianism = Maximize Good" to "Utilitarianism = Category Error regarding individual boundaries."
  **Tools:** Whiteboard, markers (two colors).
  **Rule:** No slides. No reading. If they mention Parfit or the Repugnant Conclusion, write "Later Night" on the corner of the board and move on.

  ---

  ## 1. The Setup & The Case (0:00 – 0:15)
  **Goal:** Establish the utilitarian calculation without triggering defensive "rights" language yet.

  *   **0:00–0:05: Define the Function.**
      *   Write `U = Σ (Wellbeing_i)` on the board.
      *   Say: "You know the API. Input: states of the world. Output: utility. We want to maximize the return value. The standard view is that the boundaries between `i` (persons) don't matter to the math, only the sum does."
  *   **0:05–0:15: The Case — "The Dedicated SRE."**
      *   **Scenario:** A startup has a critical stability problem.
      *   **Option A:** Rotate on-call. Everyone loses 5 hours of sleep/week. Team velocity drops 10%. Burnout risk is moderate for all 10 engineers.
      *   **Option B:** Assign one engineer (Dave) to permanent night on-call. Dave's health collapses in 2 years (career ended, chronic issues). The other 9 thrive, velocity up 20%, zero burnout.
      *   **Constraints:** Dave does *not* consent (he's assigned). There is *no* rotation. The net utility of Option B is mathematically higher (9 thriving > 1 ruined + 9 slightly annoyed).
      *   **Ask:** "Run the function. Which option does Utilitarianism pick?" (They must say B).

  ## 2. The Aggregation vs. Intuition Clash (0:15 – 0:25)
  **Goal:** Make them feel the tension between the math and the moral intuition.

  *   **0:15–0:20: The Utilitarian Defense.**
      *   They will hesitate. Push them: "If wellbeing is the currency, why does it matter who holds the debt? 9 wins > 1 loss. Is this not just rational resource allocation?"
      *   *Anticipate Misconception #2 (Big Numbers):* If they say "But Dave suffers too much," adjust the numbers. "Okay, Dave's life is ruined, but the other 9 get to save their marriages and buy houses because the company succeeds. The sum is still positive."
  *   **0:20–0:25: The Intuition Check.**
      *   Ask: "Why does Option B feel like a bug, even if the math works?"
      *   Let them vent. They will likely say "It's unfair" or "Dave has rights."
      *   **Intervention:** "Hold on 'rights.' We aren't doing deontology. We are asking if the *math itself* is valid. Is `Σ (Wellbeing_i)` a valid operation?"

  ## 3. The Core Objection: Separateness as a Type Error (0:25 – 0:35)
  **Goal:** Introduce the Separateness of Persons using their mental models (OOP).

  *   **0:25–0:30: The OOP Analogy (Misconception #3).**
      *   **Use the analogy here.** It is not a distraction; it is the bridge.
      *   Draw two boxes: `Person A` and `Person B`.
      *   **Say:** "Utilitarianism treats the universe like a single global variable or a static class where all properties are accessible. It assumes we can sum losses and gains across instances as if they were happening inside one object."
      *   **The Objection:** "The Separateness of Persons says this is a **Type Error**. You cannot sum across instance boundaries. A loss in Instance A cannot be offset by a gain in Instance B, because there is no 'Super-Instance' that experiences the net total."
      *   **Whiteboard:** Draw a line between Person A and Person B. Label it "Moral Boundary." Cross out the summation sign `Σ` that crosses the line.
  *   **0:30–0:35: Defusing "Rights-Talk" (Misconception #1).**
      *   They will say: "So you're just saying Dave has a right not to be sacrificed."
      *   **Correction:** "No. Rights are the *conclusion*. The Separateness of Persons is the *premise*. We aren't saying 'Dave has a shield.' We are saying 'Your calculator is broken.' You are adding apples and oranges because you're ignoring the basket they are in."
      *   **Key Phrase:** "It's not that the sacrifice is too heavy; it's that the *transfer* of burden is illegitimate."

  ## 4. Stress Testing the Objection (0:35 – 0:45)
  **Goal:** Ensure they aren't just soft-hearted utilitarians.

  *   **0:35–0:40: The "Big Numbers" Stress Test.**
      *   **Ask:** "What if Option B saves the company and prevents 1,000 people from losing their jobs? Does the Separateness objection vanish?"
      *   **Correct Answer:** No. The structure of the reasoning remains the same. You are still using Dave as a means to balance the ledger of others.
      *   **If they waver:** Remind them: "Inside a single life, I can sacrifice today for tomorrow. Across lives, *you* cannot sacrifice Dave for *them*. The boundary holds regardless of the magnitude."
  *   **0:40–0:45: Refine the Analogy.**
      *   Clarify the OOP point. Utilitarianism treats humanity as a `Singleton`. The Objection says humanity is a `List<Person>`. You can't call methods on the List as if it were a single Object.

  ## 5. The Closing Question (0:45 – 0:50)
  **Goal:** Verify they understand this is about moral structure, not outcomes.

  *   **Do Not Ask:** "Is sacrificing Dave nice?" (Too soft).
  *   **Do Not Ask:** "Is utilitarianism wrong?" (Too broad).
  *   **Ask This:**
      > "If I could prove to you that sacrificing Dave *guarantees* the maximum possible wellbeing for everyone else, forever: Does the Separateness of Persons objection still forbid it? And if so, **what work is the objection doing if not minimizing suffering?**"

  *   **What to listen for:**
      *   **Fail:** "It forbids it because suffering is bad." (They missed the point; that's still utilitarian).
      *   **Pass:** "It forbids it because the *justification* relies on a false equivalence between persons. The work it's doing is policing the **boundaries of justification**, not the **outcome of the calculation**."

  ---

  ## What to Flat-Out Refuse (The "Later Night" List)
  Write these in the corner of the board at the start. If anyone raises them, point to the corner.
  1.  **Parfit's Teletransportation:** (Metaphysics of identity, not moral boundaries).
  2.  **The Repugnant Conclusion:** (Population ethics, distinct from separateness).
  3.  **Rule Utilitarianism:** (This is a patch, not a fix for the core structural error).

  ## Whiteboard Layout Plan
  *   **Left:** `U = Σ (Wellbeing_i)` (The Utilitarian Function).
  *   **Center:** The Case (Dave vs. Team). Net Utility calculations.
  *   **Right:** `Person A | Person B` (The Boundary). The OOP Type Error note.
  *   **Corner:** "Later Night" (Parfit, etc.).

  ## Summary of Misconception Handling
  1.  **"It's just rights":** Address in **Section 3**. Frame rights as the output, separateness as the input logic.
  2.  **"Big numbers justify it":** Address in **Section 4**. Emphasize that the boundary is qualitative, not quantitative.
  3.  **"OOP Analogy":** Use in **Section 3** as the primary explanatory tool. It is the strongest hook for this audience. Do not apologize for it; lean into the "Type Error" framing.
