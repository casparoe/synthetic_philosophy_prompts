      *   **Tension C: Token/Type and Physics/CF (2 vs. 5 vs. 7).**
          *   (5) Type and Token are the same relation.
          *   (1) Type = Interventionist (probabilistic/distributional).
          *   (2) Token = Counterfactual (singular/nearest world).
          *   (7) CF worlds dispensable in physics.
          *   *Analysis:* If Type and Token are the *same relation* (5), they should have the same analysis. But (1) uses Interventions (often type-level) and (2) uses Lewisian Counterfactuals (token-level). Pearl actually bridges this, but Lewis is distinct. More critically, (7) says CF worlds are dispensable in physics, but (2) says they are indispensable for singular judgments (which occur in physics).
