          *   *Severity:* Medium. This is the motivation for (4), but it creates the conflict with (6).

  5.  **Developing Revisions:**

      *   *Fixing Tension A (Monism):* Either accept Pluralism (drop 6) or find a way to make Interventionism work for Mental (drop 4's "alone").
      *   *Fixing Tension B (Sufficiency):* If Mental Causation uses CF alone, admit it's a different concept (drop 6) OR admit CF isn't sufficient there either (modify 4).
