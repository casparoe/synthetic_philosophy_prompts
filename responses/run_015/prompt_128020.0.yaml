      *   Least sure point? Yes.

      *Self-Correction on (7):* (7) says CF worlds are dispensable in physics because Intervention nodes work. (2) says CF dependence is indispensable for singular judgments. If singular judgments occur in physics (e.g., "this particle hit that detector"), (7) and (2) conflict. Pearl's do-calculus *uses* counterfactuals (structural counterfactuals) but claims they don't need Lewisian "nearest possible worlds." This is a technical distinction. I need to be careful not to conflate Lewisian CF with Structural CF. The user distinguishes them in (1) vs (2). (1) is Pearl, (2) is Lewis. This is a key friction point. Pearl's framework *does* handle tokens using counterfactual logic derived from the model, not metaphysical worlds. So (2) might be the outlier.

      *Refining the "Mental Causation" point:* The user claims intervention destroys agency. This is the "Manipulationist" objection. Woodward's response is that interventions are *logical* constructs, not literal human manipulations. If the user accepts this, (4) falls away. If they hold the intuition that agency requires something non-interventional, (6) must fall.

      *Let's structure the audit.*
      1.  **Severe:** (6) vs (1)+(4). Monism vs. Dual Methodology.
