      *   (6) says Mental and Scientific causation are *one unified concept*.
      *   *Immediate Red Flag:* If Mental = CF only, and Science = Interventionist, how can they be one unified concept (6)? This looks like a direct contradiction between (4), (1)/(7), and (6).
      *   (2) says Singular Causation needs CF dependence.
