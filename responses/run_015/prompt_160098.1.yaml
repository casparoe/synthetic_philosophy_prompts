      **Department for Natural Acquisition and Household Sufficiency**
      **Consultation Paper: CP-384B**

      **Title:** Statutory Regulation of Sterile Capital and Diagonal Exchange Ratios
      **Date:** 14 October 2023
      **Respond by:** 14 January 2024

      **Ministerial Foreword**

      It is the Government's considered view that the current economic settlement violates the natural limits of human association. As established in settled policy, household management (*oikonomia*) possesses a natural ceiling defined by self-sufficiency, whereas wealth-getting (*chrematistike*) is unlimited and therefore unnatural. The proliferation of retail trading and usury has detached exchange from need, resulting in social fragmentation.

      This consultation sets out proposals to realign financial instruments with physical reality. Money was brought into being for exchange; it is not a living organism. Consequently, the generation of money from money is a biological impossibility that must be treated as fraudulent misrepresentation. We propose a return to need-certified exchange, ensuring that community cohesion is maintained not by convention alone, but by the diagonal proportion of reciprocal want.

      **Proposals for Implementation**

      **1. The National Diagonal Standard (NDS)**
      Market pricing is abolished in favour of Need-Certified Exchange Ratios. Under the Nicomachean Framework, exchange must reflect the diagonal proportion of producer to product. For example, where a Plumber (A) provides Leak Remediation (B) and a Software Engineer (C) provides Data Shelter (D), the exchange ratio must satisfy A:D :: C:B.
      To operationalise this, the Office of Reciprocal Need will publish monthly 'Shoes-per-House' units. Prices will be fixed based on certified urgency. A leaking pipe constitutes high need; a mobile application constitutes low need. Consequently, one hour of plumbing shall exchange for no less than forty hours of coding, adjusted for the engineer's overheads of self-sufficiency.

      **2. Sterility Certification and Usury Bans**
      Coin is a conventional token guaranteeing future exchange, but it is intrinsically sterile. Interest-bearing debt implies that metal can breed, which is contrary to nature. All existing loan agreements must be submitted for Sterility Certification.
      Lenders must prove that capital remains barren throughout the loan term. Any increase in principal is classified as 'Unnatural Generation'. To resolve the tension between money as a convention for future use and money as sterile matter, all savings held beyond the self-sufficiency ceiling will be subject to a 'Decay Levy'. This ensures coin retains its function as a token of future need without violating the law of barrenness by accumulating value over time.

      **3. Licensing of Retail Trade**
      Retail trading is unnatural as it involves exchange for gain rather than use. All businesses must demonstrate that inventory turnover aligns with household consumption limits. Warehouses exceeding a three-month supply of goods will be deemed engaged in unnatural wealth-getting and subject to compulsory dispersal.

      **Who is affected?**

      | Sector | Impact |
      | :--- | :--- |
      | **Banking & Finance** | All interest products banned. Sterility Licences required for vaults. |
      | **Property** | Rent capped at maintenance costs. Profit from land is unnatural. |
      | **Tech & Services** | Exchange rates fixed by Office of Reciprocal Need. |
      | **Households** | Accumulation of wealth beyond self-sufficiency triggers Decay Levy. |

      **Consultation Questions**

      **Q1: What penalty should apply to Unnatural Generation (Interest)?**
      a) Fine equivalent to the interest charged.
      b) Confiscation of principal.
      c) Immediate voiding of contract and exile from the marketplace.
      *Preferred Option: (c)*

      **Q2: How should the Diagonal Proportion be calculated for abstract services?**
      a) By hours worked.
      b) By physiological need generated (e.g., warmth, security).
      c) By the social status of the producer.
      *Preferred Option: (b)*

      **Q3: Should the Decay Levy apply to digital currency?**
      Given that digital tokens are even further removed from natural metal, the Department proposes they decay at twice the rate of physical coinage to prevent virtual breeding.
      *Do you agree?*
      *Preferred Option: Yes*

      **Q4: Transition Period for Sterility Compliance**
      Banks currently hold assets predicated on the falsehood that money breeds. How long should be allowed for them to realise this is impossible?
      a) 12 months.
      b) 30 days.
      c) Immediate cessation.
      *Preferred Option: (c)*

      **Impact Assessment**

      The Department estimates a 90% reduction in GDP, which is consistent with the natural limit of household self-sufficiency. Administrative costs for the Office of Reciprocal Need will be high, but this is preferable to the moral cost of unnatural accumulation. We invite evidence on whether the Builder-Shoemaker ratio should be updated to include the Software Engineer-Plumber dynamic as a primary standard.

