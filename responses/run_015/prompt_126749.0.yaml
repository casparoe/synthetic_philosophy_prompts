prompt: |-
  Analyze the 2004 execution of Cameron Todd Willingham in Texas as a case study in the three-way tension between retributive justification, deterrence, and the risk of executing the innocent. I already know the standard narrative about flawed arson science and the New Yorker investigation; what I want is a disciplined mapping of the case onto each theoretical commitment, together with an honest account of where all three go silent. Specifically, treat the episode through the lens of moral hazard asymmetry — the claim that state killing carries an error-cost structurally different from wrongful imprisonment, not merely larger in magnitude — and ask whether this idea adds genuinely independent normative weight or merely restates the abolitionist conclusion in risk-theoretic language. Identify exactly which features of the case activate each framework: the 1992 trial testimony that was later recanted, the 2009 Forensic Science Commission review that questioned the original arson findings, Governor Perry's refusal to stay the execution despite emerging scientific doubt, and the irreversibility of lethal injection. Say what retributive theory has to say about executing someone whose guilt is genuinely doubtful but not certainly disproved; say whether deterrence logic can absorb the specific moral damage done when an execution is later shown erroneous; and say whether the risk-of-innocence argument genuinely supplements the other two or was always carrying the argumentative load. Finally, tell me whether the Willingham case reveals that retaining capital punishment requires an implicit fourth theory — something like institutional moral risk — and whether that missing piece makes the standard three-way debate incoherent without it. Write in continuous prose only, with no headings, bullet points, bold text, or tables, as one might write in an email or a letter, and please use American English.
