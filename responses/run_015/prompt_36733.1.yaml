      *   *Lucky EV Maximizer:* If a student bets 100% and wins 20/30 times.
      *   *Fix:* In the debrief, calculate the probability of their specific path. Show that the Ensemble (25 paths) likely had *no* survivors, yet the *average* is high. The student is an outlier, not the rule.
