      *   *Decision:* The Ensemble Agent will bet 100% of bankroll every round.
      *   *Why?* $E[Return] = 1.2$. Ensemble Mean grows by 20% per round. Individual Median goes to 0 because one tail wipes you out.
      *   *Wait, one tail wipes you out at 100%.* That's too abrupt. Let's make the Ensemble bet 50%.
      *   *Math check:* Bet 50%. Win: $1.5x$. Lose: $0.5x$.
      *   *Arithmetic Mean:* $0.6(1.5) + 0.4(0.5) = 0.9 + 0.2 = 1.1$. (10% growth).
      *   *Geometric Mean:* $\sqrt{1.5^{0.6} \times 0.5^{0.4}} \approx \sqrt{1.27 \times 0.75} \approx \sqrt{0.95} < 1$.
      *   *Result:* Ensemble average grows. Typical individual shrinks. This is the perfect illustration.
      *   *Decision:* Ensemble Strategy = 50% fixed stake.

  10. **Refining the Debrief Stance:**
      *   I need to be firm. "Don't tell them it's about risk aversion. Tell them it's about time."
      *   Argument: Risk aversion is a preference. Ergodicity breaking is a fact of the system. You can prefer linear utility all you want; if the process is non-ergodic, linear utility maximization leads to extinction.

