answer: |-
  # Seminar Design: The Ergodicity Trap

  **Course:** Upper-Level Rational Choice Theory
  **Time:** 90 Minutes
  **Students:** 15
  **Goal:** Demonstrate the divergence between ensemble averages (expected value) and time averages (geometric growth) through lived experience, culminating in a defense of the dynamics framing over the utility framing.

  ## 1. Logistics and Materials (Definite Choices)

  *   **Bankroll:** 100 "Points" per student. (No real money; points map to a trivial prize, e.g., choosing the next reading, to induce mild stakes).
  *   **The Coin:** Do not flip a physical coin. It is too slow and introduces variance you cannot control. Use a **pre-generated sequence of 25 outcomes** (15 Heads, 10 Tails, shuffled) projected on the screen. This ensures the "true" probability (60%) is represented in the sample, preventing a "bad luck" session from obscuring the math.
  *   **The Ledger:** A projected Google Sheet with columns: `Student`, `Round 10 Bankroll`, `Round 25 Bankroll`, `Max Leverage Used`. Students shout out their numbers at checkpoints; a designated "Scribe" (one student) types them.
  *   **The Ensemble Entity:** Your laptop, connected to the projector, running a simple Python script (or Excel macro) that simulates **50 parallel agents** betting a **fixed 50% fraction** of their bankroll every round.
      *   *Why 50%?* It is high enough to generate strong arithmetic growth (EV positive) but low enough to avoid immediate ruin on the first tail, allowing the "slow bleed" of geometric decay to become visible against the rising ensemble average.
      *   *Why 50 agents?* Enough to smooth the ensemble line without looking like infinite infinity.
  *   **Rounds:** 25 Total.
      *   **Phase 1 (Rounds 1–15):** Standard betting (0% to 100% of current bankroll).
      *   **Phase 2 (Rounds 16–25):** "Lending Desk" open (0% to 200% of current bankroll).

  ## 2. Session Flow (90 Minutes)

  ### Introduction (10 Minutes)
  *   **Setup:** Distribute the rules. "You are repeated bettors. Your goal is to finish with the highest bankroll. The coin is 60% Heads, 40% Tails. Even odds (win what you stake, lose what you stake)."
  *   **The Hook:** "Standard rational choice theory tells you to maximize Expected Value (EV) per round. EV says bet everything. Let's see who listens."
  *   **The Ensemble:** Point to the projected graph window. "This red line is the average wealth of 50 parallel universes where a bettor stakes exactly 50% every time. Watch what happens to the red line versus your own blue line."

  ### Phase 1: The Compounding Trap (25 Minutes)
  *   **Action:** Reveal 5 coin outcomes at a time. Students calculate their new bankroll privately.
  *   **Checkpoint (Round 5):** Scribe records bankrolls. Ask: "Who is betting 100%? Who is betting 10%?"
  *   **Checkpoint (Round 10):** Scribe records bankrolls. By now, 100% bettors who hit a Tail are at 0. 50% bettors are volatile.
  *   **Checkpoint (Round 15):** End of Phase 1. Scribe records final Phase 1 bankrolls.
  *   **Observation:** Most students who bet aggressively (>40%) will be below their starting 100 points, despite the positive EV. The Ensemble Red Line will be significantly above 100 points.

  ### Phase 2: The Lending Desk (25 Minutes)
  *   **Announcement:** "The House now offers margin. You may stake up to 200% of your current bankroll. If you go negative, you are bankrupt and out."
  *   **Psychology:** Students who are behind will feel pressure to leverage up to catch the Ensemble line. Students who are ahead will likely deleverage.
  *   **Action:** Reveal remaining 10 coin outcomes (2 at a time for tension).
  *   **Final Tally (Round 25):** Scribe records final bankrolls.
  *   **Result:** Expect 2–3 "Lucky Survivors" (high leverage, lucky sequence) and 10+ "Ruined" (negative or near zero). The Ensemble line will be astronomical compared to the median student.

  ### Debrief: The Collision (30 Minutes)

  #### Part A: Mapping the Moments (10 Minutes)
  Draw three specific data points from the session on the whiteboard:
  1.  **The First Bust:** Identify the first student to hit 0 in Phase 1.
      *   *Lesson:* **Absorbing States.** In time-series dynamics, zero is a trap. In ensemble averages, zero is just a data point averaged against a winner.
  2.  **The Lucky Survivor:** Identify the student with the highest final score (likely >80% bet size).
      *   *Lesson:* **Survivorship Bias.** This student did not find the "optimal strategy"; they found the "optimal path." Ask them: "If we replayed this 50 times, would you win 50 times?" (No).
  3.  **The Crossover Point:** Refer to the projected Ensemble Graph. Identify the round where the Red Line (Ensemble Mean) crossed above the Median Student Line.
      *   *Lesson:* **Divergence.** This is the moment the system proved non-ergodic. The "Average Wealth" ceased to represent "Your Wealth."

  #### Part B: The Theoretical Stance (15 Minutes)
  *Instructor Script (Definite Stance):*
  "Traditional economics explains your losses today by saying you have 'logarithmic utility.' It claims you *should* act as if you dislike risk. I am taking a different stance. **This is not about psychology; it is about physics.**

  "Expected Value maximization assumes the process is **ergodic**—that the average across parallel universes (the Ensemble) is the same as the average across time for one person (You). This game proves they are not.
  *   **Ensemble Average:** Grows arithmetically ($1 + p - q$).
  *   **Time Average:** Grows geometrically ($(1+f)^p (1-f)^q$).

  "When I tell you to 'maximize EV,' I am giving you advice for a group of parallel immortals. When you sit in this chair, you are one mortal moving through time. The Kelly Criterion isn't a preference for safety; it is the mathematical maximum of the geometric growth rate. If you maximize arithmetic growth (EV) in a non-ergodic system, you do not get rich; you get extinguished. Therefore, we do not teach Kelly as 'risk management.' We teach it as 'survival dynamics.' Utility functions are post-hoc stories we tell to justify why we didn't go bust. Ergodicity is the reason we *couldn't*."

  #### Part C: Failure Modes and Fixes (5 Minutes)
  *   **Failure Mode 1: The Lucky EV-Maximizer.**
      *   *Scenario:* A student bets 100% every round, hits 18 Heads/7 Tails, and finishes with 5,000 points, dwarfing the Kelly bettors.
      *   *Fix:* Do not let them invalidate the lesson. Turn to the Ensemble Graph. "The Ensemble average is 10,000 points. You have 5,000. You actually underperformed the theoretical average of your own strategy. You are an outlier on the *downside* of your own strategy's variance, even though you beat the class. Your strategy's *median* outcome is zero. You are the 1 in 50 survivor. Would you bet your life savings on being the 1 in 50?"
  *   **Failure Mode 2: Boredom/Calculation Errors.**
      *   *Scenario:* Students struggle to calculate $100 \times 1.2$ repeatedly.
      *   *Fix:* Provide a printed "Multiplier Table." (e.g., If you bet 20% and Win, multiply by 1.2. If Lose, multiply by 0.8). Speed is essential for flow.
  *   **Failure Mode 3: The Ensemble Line looks too smooth.**
      *   *Scenario:* Students think the Ensemble is "cheating."
      *   *Fix:* Run the script live at the start of the debrief. Show the 50 individual gray lines (most dying) and the one thick Red Line (average) soaring. Visualize the variance.

  ## 3. The Honest Limitation

  **The "Labor" Constraint.**
  Close the session with this caveat: "This game assumes your bankroll is your only input. In the real world, you have labor. If you go bust in the stock market, you can work a job to replenish capital. This game models 'wealth as life' (e.g., a species evolving, or a trader with no outside income). The ergodicity argument is strongest when ruin is permanent. When ruin is recoverable via outside energy (labor), the pressure to follow strict Kelly relaxes. Remember: Kelly optimizes for *infinite* repetition without external rescue. You are not infinite, and you have jobs. But the dynamic tension remains."

  ## 4. Why This Design Works

  1.  **Fixed Coin Sequence:** By controlling the H/T ratio (60/40), you remove the noise of "the coin was unfair" and force the focus onto the betting fractions.
  2.  **The 50% Ensemble:** Choosing 50% for the ensemble (rather than 100%) prevents immediate total ruin in the simulation, allowing the students to watch the *divergence* happen over time rather than a sudden cliff. It shows that you can have positive EV and still lose typically.
  3.  **The Lending Desk:** This forces the students who are "losing" to the Ensemble line to confront their desperation. It mimics the real-world behavior of doubling down to recover losses, which accelerates ruin in non-ergodic systems.
  4.  **The Stance:** By refusing to hedge between Utility and Dynamics, you give the students a stronger conceptual hook. "It's not that you *feel* risk; it's that time *is* risk."

  ## 5. Instructor Prep Checklist

  1.  **Generate the Sequence:** Create a list of 25 H/T outcomes with exactly 15 H and 10 T. Randomize the order.
  2.  **Prepare the Script:** Write a simple Python script to simulate 50 agents betting 50% on that specific sequence. Output a CSV for the graph.
  3.  **Print Multiplier Tables:** 15 copies. Columns: `Stake %`, `Win Mult`, `Lose Mult`. (e.g., 20% -> 1.2 / 0.8; 50% -> 1.5 / 0.5; 100% -> 2.0 / 0.0).
  4.  **Set up the Sheet:** Google Sheet with tabs for `Phase 1`, `Phase 2`, and `Ensemble Data`.
  5.  **Rehearse the Timing:** Ensure the 25 rounds + data entry fits within 60 minutes to leave 30 for the debrief. (Aim for 2 minutes per 5-round block).
