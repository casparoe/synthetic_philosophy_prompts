  4.  **Addressing the "Ensemble" Requirement:**
      *   The prompt asks for an entity run by the facilitator/student tracking 25 parallel bettors.
      *   *Implementation:* I will designate a "Simulation Station" (my laptop connected to projector). I will run a Python script (or Excel macro) that generates 25 paths for a fixed fraction (let's pick 50% for the Ensemble to show high EV but high ruin risk, or 20% to show Kelly? Better to show the *divergence*. Let's make the Ensemble an EV-maximizer (100% stake) to show the arithmetic mean soaring while individuals die. Actually, the prompt says "average across many parallel lives keep climbing even while most individual trajectories crater." This implies the Ensemble should use a high-risk strategy, likely 100% or close to it. Let's fix the Ensemble strategy at 100% (All-In) to maximize the contrast.)
      *   *Wait, refinement:* If the Ensemble does 100%, the average climbs ($1.2^N$), but *every* individual path eventually hits 0. This perfectly illustrates the ergodicity break.
      *   *Visual:* Two lines on a graph. Line A: Class Average (Time average proxy). Line B: Ensemble Average (Arithmetic expectation proxy). Actually, better: Line A: The "Ensemble Mean" (projected). Line B: The "Median Student" (projected).

  5.  **The Lending Desk:**
      *   Introduced at Round 21.
      *   Allows borrowing up to 100% of bankroll (total stake 200%).
      *   Interest? To keep it simple, no interest, just risk of negative bankroll (game over). Or, to prevent negative infinity, bankruptcy at 0. Let's say you can borrow up to 1x leverage. If you go bust, you're out.

  6.  **The Debrief Stance (Utility vs. Dynamics):**
      *   *Option A (Utility):* You maximize $E[U(W)]$ where $U(W) = \ln(W)$. This is normative.
      *   *Option B (Dynamics/Ergodicity):* The system is non-ergodic. Time average $\neq$ Ensemble average. Maximizing arithmetic mean is physically impossible for a single trajectory over time.
      *   *Prompt Requirement:* Take a definite stance.
      *   *My Choice:* The Dynamics (Ergodicity) framing. It's more fundamental. Utility is a psychological patch; ergodicity is a physical property of the process. It explains *why* log utility works without assuming the agent *has* log utility.

