  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on rational choice theory (15 students, 90 minutes).
      *   **Goal:** Make students *feel* why "maximize expected value (EV) per round" is bad for repeated betting and why Kelly is emergent, not just a formula.
      *   **Core Mechanism:** Biased coin (60% heads), even odds (1:1), fractional betting.
      *   **Key Requirement 1:** Enough rounds for compounding.
      *   **Key Requirement 2:** Public ledger of individual trajectories.
      *   **Key Requirement 3:** An "Ensemble" entity (25 parallel bettors using the same fraction) to show the divergence between time-average (individual) and ensemble-average (group).
      *   **Key Requirement 4:** A "Lending Desk" mid-game (allow leverage >100%).
      *   **Key Requirement 5:** Debrief mapping specific moments to arithmetic vs. geometric growth and Kelly optimization.
      *   **Key Requirement 6:** Take a definite stance in the debrief (Utility vs. Dynamics) and defend it.
      *   **Key Requirement 7:** Predict failure modes (especially the lucky EV-maximizer) and provide fixes.
      *   **Key Requirement 8:** Close with an honest limitation of the game.
      *   **Constraint:** Make definite choices (no menus).

  2.  **Deconstruct the Mathematics:**
      *   *Bet:* Win +1 unit per unit staked with $p=0.6$, Lose -1 unit per unit staked with $q=0.4$.
      *   *EV Maximizer:* Stakes 100% (All-In). Expected growth per round = $0.6 \times 2 + 0.4 \times 0 = 1.2$. Arithmetic mean grows. Geometric mean = $\sqrt[2]{2^1 \times 0^1}$... wait, if you lose once, you're zero. Geometric mean is 0.
      *   *Kelly Criterion:* $f^* = p - q = 0.6 - 0.4 = 0.2$. Stake 20%.
      *   *Growth Rate:* $g(f) = p \ln(1+f) + q \ln(1-f)$. Maximized at $f=0.2$.
      *   *Ensemble vs. Time:* The ensemble average follows the arithmetic expectation ($1.2^N$). The typical individual trajectory follows the geometric expectation ($\exp(N \times E[\ln(1+return)])$).
      *   *Leverage:* If students can borrow, they might stake >100%. If they stake 100%+, a single loss wipes them out (if >100%) or deeply cripples them. This highlights the risk of ruin.

