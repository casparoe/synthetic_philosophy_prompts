      *   *Boredom/Speed:* 40 rounds takes time.
      *   *Fix:* Automate the coin flip. Project the result. Students just write down their fraction.
      *   *Ensemble Confusion:* Students might think the Ensemble is "another player."
      *   *Fix:* Explicitly label it "The Arithmetic Mean of 25 Parallel Universes."

