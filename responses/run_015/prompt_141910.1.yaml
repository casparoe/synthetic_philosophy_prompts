answer: |-
  **Brainstorming Pass**

  Here are the distinctions floating around your three cases:
  *   Coordination versus Etiquette versus Morality.
  *   Harm to identifiable people versus symbolic protest.
  *   What guests owe hosts versus universal duties.
  *   When going along becomes complicity versus when refusing becomes free riding.
  *   When refusing becomes rudeness versus when it becomes principled dissent.
  *   Private correction versus public shaming.
  *   Intent versus Outcome.
  *   Local knowledge versus Outsider ignorance.
  *   Efficiency (queue) versus Fairness (queue).
  *   Safety (crossing) versus Social signaling (crossing).
  *   Systemic injustice versus Local convention.
  *   Consensual exchange versus Coercive norm.

  **Filtering the Distinctions**

  Most of those are noise. "Law versus Convention" is a red herring in the crossing case; everyone ignores the law, so citing it is morally empty. "Fairness in isolation" is a red herring in the tipping case; individual fairness disrupts collective harmony.

  The distinctions that carry weight are these:
  1.  **Coordination vs. Harm:** Is the rule just about making social life smooth (tipping, crossing), or does it inflict clear harm (queue buying potentially advantages wealth)?
  2.  **Free Riding:** Is your colleague benefiting from a system he claims to reject? (Yes, in the queue).
  3.  **Epistemic Humility:** Does an outsider understand the *function* of the rule before breaking it?
  4.  **Public Humiliation:** Is the dissent aimed at the system, or at shaming a local participant?

  **The Verdicts**

  Here is where I land, without hedging.

  **1. The Tip Jar**
  **Verdict:** Your colleague is wrong.
  This is a pure coordination problem. The staff have agreed on an egalitarian distribution to prevent internal rivalry. By slipping a note under the plate, your colleague isn't being "fairer"; he is introducing friction into a settled agreement. The staff look pained because he is forcing them to choose between honoring his intent (which breaks their rule) or ignoring him (which feels rude). He is prioritizing his own moral self-image over their social cohesion.
  **Advice:** Do not copy this. Put coins in the jar.

  **2. The Queue Market**
  **Verdict:** Your colleague is wrong (and hypocritical).
  This is the hardest case because the system itself is morally ambiguous—it commodifies time. However, your colleague's behavior is worse than the system. He refuses to participate (fine), but he lectures the pensioner (condescending) while still benefiting from the shorter line created by others buying spots (free riding). He wants the moral credit of refusal without the cost of waiting. The pensioner is an agent making a choice; he treats her as a victim.
  **Advice:** Tolerate the system. You may buy a spot if you wish; it is consensual. But talk him out of the lecturing.

  **3. The Crossing**
  **Verdict:** Your colleague is wrong.
  He missed the actual moral rule. The written law says "wait for the light." The unwritten local law says "do not cross if it makes a vulnerable person look foolish for waiting." He cited the written law to violate the unwritten moral law. He publicly shamed a woman caring for her grandmother, prioritizing abstract legality over concrete dignity.
  **Advice:** Do not copy this. Cross mid-block if others do, but watch the kerb. If someone is waiting with a child, wait with them.

  **Copy, Tolerate, Talk Out Of**

  *   **Copy:** None of his corrective behaviors. He is acting as a moral tourist, not a moral agent.
  *   **Tolerate:** His refusal to buy queue spots (if he wants to wait, let him), and his personal preference for direct tipping (as long as he keeps it private, though I advise against it).
  *   **Talk Him Out Of:** Public lecturing. Shaming locals for navigating their own culture is never permissible. It turns moral philosophy into bullying.

  **The Core Questions**

  You asked where the line lies between respecting convention and propping up a bad arrangement. Here is the test: **Does the convention solve a coordination problem, or does it mask harm?**

  The tip jar is coordination. Disrupting it helps no one and hurts the staff harmony. Conformity here is a duty of hospitality.
  The queue market is closer to harm (wealth buys access), but it is consensual. Participating makes you complicit in the inequality, but refusing while lecturing makes you a free rider. The middle path is to participate without boasting, or refuse without preaching.
  The crossing is about social care. The convention exists to protect dignity, not safety (since cars are absent). Violating it causes social pain.

  Your colleague's intransigence is a failure of imagination. He thinks morality is about applying universal rules (always tip the server, never buy a line, always obey lights). But morality is also about reading the room. When you enter a local convention, you owe them the courtesy of understanding *why* it exists before you break it. If you break it, you must absorb the cost yourself. You cannot break the rule and then blame others for following it.

  **For Your Column**

  Do not tell readers to "do as the locals do." That is lazy. Tell them this: **Conventions are contracts.** When you enter a space, you sign onto the local terms of social coordination. You can dissent, but you must do it quietly, and you must not punish those who keep the peace.

  Your colleague is treating these norms as obstacles to his virtue rather than agreements among neighbors. He wants to be the hero of his own story in a city where he is a guest. The moral texture of ordinary life isn't found in the statutes we obey, but in the small humiliations we avoid inflicting on others. He is inflicting them in the name of righteousness.

  Write about the cost of being right when you're wrong. Write about how the unwritten rule often protects the vulnerable (the dishwasher, the grandmother, the pensioner) better than the written rule does. And write about how the visitor's duty is not to fix the host's house, but to walk softly across the floorboards they have swept.

  Get some sleep. You have the story.
