answer: |-
  **FINAL EXAM: FORMAL EPISTEMOLOGY SEMINAR**
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer both parts. No citations are expected or wanted; rely only on the definitions provided.

  **Question: The Lottery Model of the Surprise Exam**

  A teacher addresses a class at the start of a term of $N$ teaching days. Let $p_k$ denote the probability the exam occurs on day $k$ (for $1 \le k \le N$) and $p_0$ the probability no exam occurs. These sum to 1. The teacher makes three announcements:

  (A1) There will be at most one exam: it will fall on one of the $N$ days, or on none of them.
  (A2) On the morning of the exam, if there is one, a student who accepts (A1)–(A3), who has observed that no exam has occurred on any earlier day, and who conditionalizes on this information, assigns probability at most $t$ to its being that day.
  (A3) The student knows the teacher's selection procedure (the joint distribution $\{p_0, \dots, p_N\}$).

  Call a policy **$t$-surprising** if it satisfies (A2) on every day $k$ where $p_k > 0$.

  **(a)** Derive the necessary relationship between $p_0$, $N$, and $t$ for a $t$-surprising policy to exist. Determine the maximum probability with which such a policy can place an exam as a function of $t$ and $N$. Provide an explicit policy (values for all $p_k$) that attains this maximum.

  **(b)** Does the lottery model dissolve the classical surprise exam paradox or merely relocate it? Take a definite position. In your defense, address: (i) what has happened to the classical clause that there will *definitely* be an exam; (ii) whether a teacher who delivers no exam with positive probability has kept the promise; and (iii) whether a morning credence of at most $t$ is equivalent to being surprised. Briefly explain the substantive work done by assumption (A3).

  ***

  **MODEL ANSWER**

  **(a)** Let $S_k$ be the probability no exam occurs before day $k$. Thus $S_1 = 1$ and $S_{N+1} = p_0$. Note that $p_k = S_k - S_{k+1}$. The conditional probability of an exam on day $k$, given no prior exam, is $P(E_k | \neg E_{<k}) = p_k / S_k$.
  Condition (A2) requires $p_k / S_k \le t$ for all $k$. Substituting $p_k$:
  $$(S_k - S_{k+1}) / S_k \le t \implies 1 - (S_{k+1} / S_k) \le t \implies S_{k+1} \ge S_k(1 - t).$$
  Applying this recursion from $k=1$ to $N$:
  $$S_{N+1} \ge S_1 (1 - t)^N.$$
  Since $S_1 = 1$ and $S_{N+1} = p_0$, we obtain the bound **$p_0 \ge (1 - t)^N$**.
  The probability of an exam is $1 - p_0$. To maximize this, we minimize $p_0$. Thus, the **maximum probability of an exam is $1 - (1 - t)^N$**.
  An explicit policy attaining this sets the inequalities to equalities:
  $$p_k = t(1 - t)^{k-1} \quad \text{for } 1 \le k \le N, \quad \text{and} \quad p_0 = (1 - t)^N.$$
  This is a geometric distribution truncated at $N$, with the remaining mass on "no exam."

  **(b)** The model relocates rather than dissolves the paradox. The classical impossibility result is recovered as a limit case of the probabilistic bound. The classical paradox assumes the exam is certain ($p_0 = 0$). Our derivation shows $p_0 \ge (1 - t)^N$. If we enforce $p_0 = 0$, then $(1 - t)^N \le 0$, which implies $t = 1$. If $t=1$, the surprise constraint (credence $\le 1$) is vacuous. Thus, the contradiction in the classical case is driven specifically by the conjunction of "Exam Certain" and "Exam Surprising ($t < 1$)." The lottery model resolves the mathematical inconsistency by relaxing certainty, allowing $t < 1$ only if $p_0 > 0$.

  Regarding the promise: If the teacher announces "There will be an exam" but employs a policy with $p_0 > 0$, they have strictly speaking lied under the classical interpretation. However, if the announcement is interpreted as (A1) ("at most one"), the promise is kept. The paradox persists if one insists the announcement entails $p_0=0$.

  Regarding surprise: A credence bound $\le t$ is a formal proxy for surprise, but not identical. One might have low credence due to ignorance rather than genuine epistemic surprise. However, within formal epistemology, calibrated credence is the operational definition of expectation.

  Finally, (A3) does substantial work. It ensures the student knows the distribution $\{p_k\}$. Without (A3), the student could not calculate the conditional probabilities $p_k/S_k$ solely from the passage of time. If the policy were unknown, the student's uncertainty would stem from ignorance of the teacher's procedure rather than the timing, fundamentally changing the nature of the "surprise" from a property of the date to a property of the policy selection.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  **Part (a): Formal Derivation (12 Marks)**
  *   **Conditional Probability Formulation (3 marks):** Correctly identifies $P(E_k | \text{no prior}) = p_k / S_k$ or equivalent denominator $\sum_{j=k}^N p_j + p_0$.
      *   *Deduction:* 1 mark if denominator omits $p_0$ (treats exam as certain).
  *   **Recursion and Inequality (3 marks):** Derives $S_{k+1} \ge S_k(1-t)$ correctly from the constraint.
      *   *Deduction:* 2 marks if student attempts standard backward induction (eliminating days) rather than probability recursion.
  *   **Bound and Max Probability (3 marks):** Correctly states $p_0 \ge (1-t)^N$ and Max Exam Prob $= 1 - (1-t)^N$.
      *   *Deduction:* 2 marks if bound is linear (e.g., $1-Nt$) or assumes uniform priors.
  *   **Explicit Policy (3 marks):** Provides the geometric policy $p_k = t(1-t)^{k-1}$ and $p_0 = (1-t)^N$.
      *   *Deduction:* 1 mark if policy does not sum to 1.

  **Part (b): Philosophical Analysis (8 Marks)**
  *   **Dissolve vs. Relocate (2 marks):** Argues "Relocate" (or nuanced "Dissolve via relaxation"). Must identify that classical paradox requires $p_0=0$.
  *   **Certainty Clause (3 marks):** Explains that $p_0=0 \implies t=1$. The impossibility arises from the certainty clause, not the surprise clause alone.
      *   *Deduction:* 2 marks if student claims the paradox is fully solved without addressing the $p_0=0$ constraint.
  *   **Credence vs. Surprise / (A3) Role (3 marks):** Distinguishes low credence from knowledge failure; explains (A3) fixes the distribution so surprise is about *timing* not *procedure*.
      *   *Deduction:* 2 marks if student conflates "credence $\le t$" with "cannot know" (factivity error).

  **Specific Errors (Automatic Deductions applied above)**
  *   **Treating (A1) as "Exactly One":** If student assumes $\sum_{k=1}^N p_k = 1$ initially and derives impossibility for all $t < 1$, cap Part (a) at 3/12.
  *   **Standard Backward Induction:** If student argues "Day $N$ is impossible" without reference to $p_0$, cap Part (a) at 4/12.
  *   **Uniform Priors:** If student assumes $p_k = 1/N$, cap Part (a) at 6/12.
  *   **Ignoring $p_0$ in Denominator:** If student writes $p_k / \sum_{j=k}^N p_j$, deduct 3 marks from Part (a).
