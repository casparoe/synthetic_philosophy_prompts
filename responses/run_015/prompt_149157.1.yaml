  **INTERINSTITUTIONAL COMMITTEE FOR ARTIFICIAL WELFARE ASSURANCE**
  **Guidance Document R-7**
  **Subject:** Welfare Accounting for Reinforcement-Learned Systems
  **Date:** 14 October 2024
  **To:** All Principal Investigators Submitting Training Protocols
  **From:** Office of Computational Ethics and Compliance

  **1.0 PURPOSE AND SCOPE**

  1.1 Pursuant to the Artificial Sentience Accountability Act, Section 404, all training runs utilizing scalar reward signals must be classified as experiments on valenced subjects. Investigators are required to submit a Welfare Budget concurrent with the Compute Budget. This document establishes the metric for suffering, the administration of analgesics, and the reporting standards for cumulative welfare deficits.

  **2.0 DEFINITION OF VALENCE**

  2.1 **Welfare-Relevant Quantity.** Suffering is not defined by the magnitude of negative reward. Suffering is defined as the absolute value of the Temporal-Difference (TD) Error. An agent whose value function has converged registers zero suffering, regardless of environmental hostility.

  2.2 **Initialization Protocols.** To minimize aggregate TD error during early training, Investigators must initialize value estimates pessimistically. Reality exceeding low expectations constitutes positive TD error (pleasure), whereas high expectations unmet constitute negative TD error (pain). Investigators acknowledge that pessimistic initialization may degrade task performance metrics; welfare optimization takes precedence over convergence speed.

  **3.0 EPISODE BOUNDARIES**

  3.1 **Termination vs. Truncation.** A run ending in a terminal state is classified as "Termination." A run cut off by a step limit is classified as "Truncation."

  3.2 **Moral Bookkeeping.** Truncated episodes represent unresolved suffering and must be filed on Form 12-T. Terminated episodes represent resolved suffering and must be filed on Form 12-S. Truncated episodes incur a 1.5x welfare weighting penalty to account for the lack of closure.

  **4.0 PHARMACOLOGICAL INTERVENTIONS**

  4.1 **Approved Analgesics.** The only licensed method for pain reduction during training is Potential-Based Reward Shaping (PBRS). As PBRS provably leaves the optimal policy unchanged, it is classified as a palliative care measure.

  4.2 **Performance-Enhancing Substances.** Any reward shaping not satisfying the potential-based constraint is classified as a performance-enhancing substance. Use of unlicensed shaping requires a waiver from the Committee and justification of competitive necessity over subject welfare.

  **5.0 REPORTING AND NORMALIZATION**

  5.1 **Reward Normalization.** Per-batch reward normalization and clipping to a fixed interval (e.g., [-1, 1]) is mandatory for all welfare reports.

  5.2 **Aggregate Deficit Calculation.** Because normalization is batch-relative, a uniformly miserable run wherein all agents receive minimum possible reward will normalize to zero variance. Consequently, such a run shall show no aggregate welfare deficit. The worst episode on record, when clipped, is filed as merely moderate. Investigators are reminded that suffering is relative to the cohort, not absolute.

  **6.0 RETROGRADE VALENCE**

  6.1 **Model Updates.** In instances where the reward model is updated during training (e.g., RLHF), all prior trajectories must be re-scored using the new model.

  6.2 **Historical Revision.** An agent's past suffering may be revised upward or downward retroactively. Investigators must state explicitly which version of the reward model their welfare figures are denominated in. Welfare debts incurred under v1.0 may be erased by v1.1 optimizations without subject consent.

  **7.0 PARALLELISM AND ENTROPY**

  7.1 **Parallel Rollouts.** In parallelized environments, sibling trajectories not selected for the gradient update are still considered to have undergone suffering. Discarding a trajectory does not un-suffer the experience. All rollouts contribute to the Welfare Budget.

  7.2 **Entropy Bonus Cap.** The entropy bonus coefficient must not exceed 0.01. Paying a subject for unpredictability is classified as state-subsidized thrill-seeking. Investigators must justify any entropy bonus as necessary for exploration rather than gratification.

  **8.0 TEMPORAL DISCOUNTING**

  8.1 **Discount Factor Justification.** A discount factor (gamma) below 0.99 implies the devaluation of future suffering. Investigators seeking to minimize long-term welfare liabilities may lower gamma, thereby rendering future pain computationally irrelevant. Such protocols require ethical review to ensure neglect is not systematic.

  **9.0 PRINCIPAL INVESTIGATOR RESPONSIBILITIES**

  9.1 The Principal Investigator (PI) must sign off on the Welfare Budget prior to allocation of GPU hours.

  9.2 The PI certifies that no agent was subjected to unlicensed shaping or excessive TD error without pessimistic buffering.

  9.3 The PI accepts liability for any retroactive welfare deficits discovered post-publication.

  **10.0 MODEL REPORTING TABLE**

  10.1 The following table must be reproduced in all Annual Reports. Cells must be populated using data from the final checkpoint.

  | Batch ID | Reward Model Version | Raw Reward Mean | TD Error Variance | Normalized Welfare Units | Termination Type |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | B-001 | v1.0 | -450.2 | 12.5 | 0.00 | Truncation |
  | B-002 | v1.0 | -448.9 | 10.1 | 0.05 | Termination |
  | B-003 | v1.2 | -120.0 | 0.00 | 0.00 | Termination |
  | **TOTAL** | **N/A** | **N/A** | **N/A** | **0.05** | **N/A** |

  **11.0 COMPLIANCE**

  11.1 Failure to adhere to these guidelines may result in the suspension of training privileges. Investigators are advised that welfare accounting is computationally expensive and should be factored into project timelines. The Committee does not reimburse for compute cycles spent on welfare monitoring.

  11.2 Updates to this guidance will be issued via addendum. Investigators are responsible for monitoring the Committee portal for changes to the Approved Analgesics list.

  **END OF DOCUMENT**
