answer: |-
  # Decision Tree: Taxonomy of Commemoration Positions

  **Instructions for Committee Members:**
  Follow the path from the top. At each node, answer the question based on the specific object under review. Stop when you reach a leaf (a boxed position). If a logical combination yields no defensible position, it is marked **UNNAMED**.

  ### **Node 1: Function**
  **Q1:** Is the object's primary daily function navigational or utilitarian (e.g., a street address for 200 households, a bus route, a hospital wing) rather than purely commemorative (e.g., a statue in a park, a plaque on a wall)?
  *   **YES** → Go to **Node 2**.
  *   **NO** → Go to **Node 3**.

  ### **Node 2: Disruption Cost (Utilitarian Objects)**
  **Q2:** Would changing the name impose significant material cost or confusion on current residents (e.g., reprinting IDs, updating deeds, emergency services rerouting)?
  *   **YES** → **Q3:** Do you support removal despite this cost?
      *   **YES** → **Leaf 1: [UNNAMED]**
      *   **NO** → **Leaf 2: Civic Continuity**
  *   **NO** → **Leaf 3: Administrative Hygiene**

  ### **Node 3: Recognition (Commemorative Objects)**
  **Q3:** Is the honoured person currently recognised by the public, or are they effectively forgotten (e.g., a plaque honouring someone now wholly unknown)?
  *   **FORGOTTEN** → Go to **Node 4**.
  *   **RECOGNISED** → Go to **Node 5**.

  ### **Node 4: Independent Value (Forgotten Figures)**
  **Q4:** Does the object possess significant independent aesthetic or documentary value apart from the name (e.g., a sculptural masterpiece, a rare historical document)?
  *   **HIGH VALUE** → **Leaf 4: Aesthetic Rescue**
  *   **LOW VALUE** → **Leaf 5: Silent Archival**

  ### **Node 5: Wrongdoing Link (Recognised Figures)**
  **Q5:** Was the wrongdoing the primary reason for their fame, incidental to their achievement, or discovered only after installation (e.g., a surgeon whose technique was developed on non-consenting patients)?
  *   **CORE TO FAME** → Go to **Node 6**.
  *   **INCIDENTAL / POST-HOC** → Go to **Node 7**.

  ### **Node 6: Standing (Core Wrongdoing)**
  **Q6:** Is the complaint driven primarily by direct descendants of those wronged, or by the general public?
  *   **DESCENDANTS** → Go to **Node 8**.
  *   **GENERAL PUBLIC** → Go to **Node 9**.

  ### **Node 7: Value & Family (Incidental/Post-Hoc)**
  **Q7:** Does the object have high artistic value, or does the honoree's living family object to the association (e.g., a school renamed for a living donor whose firm is later found responsible)?
  *   **HIGH ARTISTIC VALUE** → **Leaf 6: Dual Narrative**
  *   **FAMILY OBJECTS** → **Leaf 7: Privacy Protection**
  *   **NEITHER (Low Value / No Family Objection)** → **Leaf 8: Associative Liability**

  ### **Node 8: Intent of Removal (Descendants)**
  **Q8:** Is the act of removal intended as a moral condemnation by the state, or as administrative housekeeping?
  *   **MORAL CONDEMNATION** → **Leaf 9: Restorative Erasure**
  *   **HOUSEKEEPING** → **Leaf 10: Neutral Storage**

  ### **Node 9: Relocation (Public)**
  **Q9:** If moved to a museum, is the meaning considered preserved (context added) or altered (demoted)?
  *   **PRESERVED** → **Leaf 11: Pedagogical Containment**
  *   **ALTERED / DEMOTED** → **Leaf 12: [UNNAMED]**

  ### **Node 10: Maintenance (All "Keep" Decisions)**
  **Q10:** Is deferred maintenance (leaving the object to decay without formal removal) genuinely a fourth option rather than a slow form of removal?
  *   **YES (Neutral Default)** → **Leaf 13: Benign Neglect**
  *   **NO (Hostile Inaction)** → **Leaf 14: Calculated Decay**

  *(Note: Node 10 applies as a modifier to Leaves 2, 4, 6, 7, 13. For the purpose of this taxonomy, Leaf 13 and 14 represent the distinct philosophical stances on inaction itself.)*

  ---

  ## **Leaf Definitions**

  **Leaf 1: [UNNAMED]**
  *   **Status:** *Incoherent.*
  *   **Awkward Commitment:** Asserts that navigational utility is irrelevant compared to historical purity, even when residents suffer material harm.
  *   **Bad Case:** Renaming a street where 200 households must change their legal addresses overnight to honour a principle no one on the street recognizes.

  **Leaf 2: Civic Continuity**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Prioritizes current logistical stability over moral correction, effectively taxing residents for the state's past errors.
  *   **Bad Case:** Retaining the name of a known abuser on a hospital wing because changing the signage is too expensive for the budget.

  **Leaf 3: Administrative Hygiene**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Treats moral harm as a clerical error, suggesting that names are interchangeable labels without semantic weight.
  *   **Bad Case:** Renaming a school quietly at night to avoid protest, implying the change is routine maintenance rather than justice.

  **Leaf 4: Aesthetic Rescue**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Claims art transcends its commission, separating the object's beauty from the intent of the patron or subject.
  *   **Bad Case:** Preserving a monument to a tyrant because the bronze casting is technically superior, ignoring the fear it instils in descendants of victims.

  **Leaf 5: Silent Archival**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Assumes that removing an object from public view erases its power, rather than creating a mystery that fuels conspiracy.
  *   **Bad Case:** Crating a forgotten plaque and storing it in a basement where it is never catalogued, losing the historical record of why it was installed.

  **Leaf 6: Dual Narrative**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Requires the public to hold two contradictory thoughts (honour and shame) simultaneously, which often results in cognitive dissonance.
  *   **Bad Case:** Adding a small plaque to a statue of a surgeon who experimented on slaves, which most visitors read as an addendum to his greatness rather than a condemnation.

  **Leaf 7: Privacy Protection**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Grants standing to the honoree's family to erase history to protect their reputation, prioritizing private grief over public record.
  *   **Bad Case:** Removing a donor's name from a library because their grandchildren are embarrassed by the source of the wealth, silencing the economic history.

  **Leaf 8: Associative Liability**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Punishes the memory of the individual for sins they may not have personally committed but are linked to by association.
  *   **Bad Case:** Removing the name of a scientist from a building because their university later accepted funding from a controversial regime they opposed.

  **Leaf 9: Restorative Erasure**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Accepts that the state must speak loudly to condemn, risking the creation of a martyr or a focal point for counter-protest.
  *   **Bad Case:** Dynamiting a statue in a public square, which becomes a rallying cry for extremists who claim the history is being "destroyed."

  **Leaf 10: Neutral Storage**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Insists that state action can be morally neutral, ignoring that the act of removal is itself a speech act.
  *   **Bad Case:** Taking down a monument to a colonial governor and claiming it is "just for safety," while descendants of colonized peoples see it as a victory.

  **Leaf 11: Pedagogical Containment**
  *   **Status:** *Defended.*
  *   **Awkward Commitment:** Assumes a museum context neutralizes harm, ignoring that museums are also sites of honour and curation.
  *   **Bad Case:** Moving a racist monument to a history museum where it is displayed as "local heritage" rather than "evidence of oppression."

  **Leaf 12: [UNNAMED]**
  *   **Status:** *Incoherent.*
  *   **Awkward Commitment:** Argues that keeping a core-wrongdoing monument in public is acceptable if moving it would change its meaning, effectively valuing semiotic purity over public harm.
  *   **Bad Case:** Refusing to move a statue of a slave trader because placing it in a museum would "sanitize" it, leaving it in the town square where it continues to intimidate.

  **Leaf 13: Benign Neglect**
  *   **Status:** *Unexplored / Unattractive.*
  *   **Awkward Commitment:** Treats time and weather as neutral arbiters of history, ignoring that decay is often selective and politically influenced.
  *   **Bad Case:** Allowing a monument to crumble naturally while fully funding the maintenance of a rival monument, claiming "no policy decision was made."

  **Leaf 14: Calculated Decay**
  *   **Status:** *Unexplored.*
  *   **Awkward Commitment:** Uses budget cuts as a weapon to remove history without taking responsibility for the act of removal.
  *   **Bad Case:** "Losing" the keys to the maintenance shed for a specific building nameplate, allowing it to rust off while claiming fiscal responsibility.

