  ## **Scoring Key**

  **Instructions:** Answer the following ten questions based on your intuition about the cases provided. Tally your "YES" answers to find your dominant position.

  1.  **Utility:** Do you believe a street name used by 200 households should be treated differently than a statue in a park?
  2.  **Disruption:** Should current residents bear the cost of correcting historical errors on their addresses?
  3.  **Recognition:** Does it matter if the public knows who the honoured person is?
  4.  **Aesthetics:** Can a monument be saved solely because it is a masterpiece of art, regardless of who it honours?
  5.  **Link:** Is it worse to honour someone *for* their wrongdoing than to honour someone who *did* wrongdoing?
  6.  **Standing:** Do descendants of victims have more right to demand removal than the general public?
  7.  **Family:** Should a honoree's living family have the right to request removal to protect their privacy?
  8.  **Intent:** Is removing a monument always a moral statement, even if called "maintenance"?
  9.  **Museum:** Does moving a monument to a museum fix the problem, or just hide it?
  10. **Inaction:** Is "doing nothing" a neutral position, or is it a choice to support the status quo?

  **Mapping Patterns to Leaves:**

  *   **Mostly YES on 1, 2, 10:** You lean toward **Civic Continuity** (Leaf 2).
  *   **YES on 1, NO on 2:** You lean toward **Administrative Hygiene** (Leaf 3).
  *   **NO on 3, YES on 4:** You lean toward **Aesthetic Rescue** (Leaf 4).
  *   **NO on 3, NO on 4:** You lean toward **Silent Archival** (Leaf 5).
  *   **YES on 5, YES on 6, YES on 8:** You lean toward **Restorative Erasure** (Leaf 9).
  *   **YES on 5, YES on 6, NO on 8:** You lean toward **Neutral Storage** (Leaf 10).
  *   **YES on 5, NO on 6, YES on 9:** You lean toward **Pedagogical Containment** (Leaf 11).
  *   **NO on 5, YES on 4:** You lean toward **Dual Narrative** (Leaf 6).
  *   **NO on 5, YES on 7:** You lean toward **Privacy Protection** (Leaf 7).
  *   **NO on 5, NO on 4, NO on 7:** You lean toward **Associative Liability** (Leaf 8).
  *   **NO on 10 (Inaction is active):** You lean toward **Calculated Decay** (Leaf 14).
  *   **YES on 10 (Inaction is neutral):** You lean toward **Benign Neglect** (Leaf 13).
  *   **YES on 1, NO on 2, YES on "Remove Anyway":** You fall into **[UNNAMED] Incoherent** (Leaf 1).
  *   **YES on 5, NO on 6, NO on 9 (Keep in place):** You fall into **[UNNAMED] Incoherent** (Leaf 12).
