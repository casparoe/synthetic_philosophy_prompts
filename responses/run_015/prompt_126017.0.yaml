      *   *(5) vs. (6):* (5) says resent even if expectation is unfair. (6) says we can criticize culture for blaming people for things outside control (which implies the expectation was unfair). If the expectation is unfair, is the resentment *fitting*? (1) says responsibility = fitting target. If resentment is fitting despite unfair expectations, does that clash with (6)'s criticism of wrong norms?
