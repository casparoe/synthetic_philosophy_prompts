answer: |-
  1. The standard story says psychoanalysis failed because of its claims, not its practitioners, yet scientists notoriously protect theories when evidence goes against them; are you prescribing rather than describing, and if so, why should we let science mean the prescribed thing?
  Expected answer: She is prescribing norms for truth-tracking, not describing history.
  Follow-up: If the behavior you demand is rare in history, aren't you defining science as something that has rarely existed?

  2. Suppose astrologers pre-registered predictions, published failures, and defunded failed techniques; under your test, are they doing science?
  Expected answer: Yes, and they would have disproven astrology within a generation.
  Follow-up: If so, have you changed the subject from finding out about the world to running a community well, and can you spell out "well run" without sneaking the truth back in?

  3. Name a specific case where your test ranks a subfield of physics below a part of psychology.
  Expected answer: String theory or cosmology ranks below social psychology due to abandonment records.
  Follow-up: Is that difference really institutional, or just a fact about how expensive and slow the evidence is in one field, and can a field be well run and still be stuck for a century for reasons that have nothing to do with its norms?

  4. To count a failure you must decide it was a failure; how is this quantity measured without already knowing which fields get things right?
  Expected answer: We use proxies like pre-registration and replication rates.
  Follow-up: Those are recent reforms in psychology; on your own terms, did psychology become more scientific in the last fifteen years, and is scientific status something a professional body can raise by a vote?

  5. Does the philosophy of science community pass your own test, and have you pre-registered a failure condition for the Abandonment Test itself?
  Expected answer: It is a normative proposal, not an empirical claim subject to the test.
  Follow-up: If it is not empirical, how do we check it is not just a description of the fields you happen to admire dressed up as a rule?

  6. Your test gives no verdict on a solitary researcher or a claim only one person can check; do you accept paradigm science can score zero at the time it is made?
  Expected answer: Yes, it applies to mature fields, not individual breakthroughs.
  Follow-up: If a criterion cannot recognize science when it sees it in the wild, what work is it doing other than grading institutions we already approve of?

  7. Your test rewards abandoning claims when findings arrive, but major breakthroughs often come from sticking with a theory despite anomalies; does your test penalize the stubbornness that produced general relativity?
  Expected answer: It distinguishes productive persistence from dogmatic protectionism.
  Follow-up: If the distinction relies on hindsight to see which stubbornness was productive, doesn't your test only work after the history is settled?

  8. You apply this to fields, but who draws the boundary around a community; can a group game the test by defining themselves narrowly enough to hide their failures?
  Expected answer: Boundaries are determined by sociological practice and citation networks.
  Follow-up: If the verdict changes depending on how you draw the map, isn't the score a property of your description rather than their practice?

  9. In software we have blameless incident reviews and change practice after something breaks; by your criteria, is my industry a science?
  Expected answer: No, because you fix artefacts, not claims about the world.
  Follow-up: If the institutional machinery is identical and the reliability gains are real, why does the target of the claim matter more than the reliability of the process?

  10. Demarcation gets dragged into courtrooms and funding decisions; if your criterion is a verdict on trustworthy communities, does it have any authority with a judge or should it?
  Expected answer: It should guide funding and trust, not necessarily legal admissibility directly.
  Follow-up: If a judge asks whether a claim is true enough to teach, will you tell them to ignore the claim and audit the department's HR policies instead?
