prompt: |-
  I'm one of two staff attorneys in the interpretations office at my state's department of environmental quality — I'll invent a name and call the state Corbin so this doesn't turn into a dig through somebody's real code. Roughly twice a week a permit writer or a field inspector emails us asking what some sentence in our statutes actually means, and whoever picks it up writes a two-page guidance memo that gets posted on the intranet, gets treated as binding by about forty field staff, and maybe three or four times a year ends up stapled to a brief when a permit denial gets appealed. Right now my colleague and I do this by instinct and we disagree constantly: he thinks the only thing that matters is what the words conveyed to a careful reader back whenever the thing was passed, I keep reading the findings clause and asking what disaster the legislature was actually reacting to. We need something we can both run where the answer doesn't depend on who opened the email.

  One wrinkle that might help or might make the whole thing harder: Corbin has a codified rule of construction, call it the Administrative Interpretation Act, which says (paraphrasing) that we have to give effect to the meaning the words would have conveyed to an ordinarily attentive reader at the time the provision was adopted, taking account of (1) the words themselves, (2) how the provision fits with the rest of what was enacted alongside it, and (3) the mischief the enactment was aimed at — and that if after all that the meaning is genuinely unclear, we have to pick whichever reading least expands the reach of any penalty, fee, or prohibition. So it's a hybrid that isn't cleanly either of the two things people argue about. Constraints: ten business days per question, two lawyers, no budget for archival legislative-history digging (our pre-1990 files are full of holes), the output has to be a bright line a non-lawyer inspector can apply in the field without calling us, and it needs the general counsel's and the program director's signatures. We can't answer it depends very often or the inspectors stop asking us anything.

  Three live disputes, so you can see the shape of the problem. (1) One provision says no person shall operate a motorboat on any watercourse classified as Class I or Class II wild water, and the definitions section defines motorboat as any vessel propelled in whole or in part by machinery, whether or not that machinery is the vessel's primary means of propulsion. The enacted findings talk about preserving the quiet character and natural shoreline of the state's remaining wild rivers. Question: does the ban reach a canoe with a 55-pound-thrust electric trolling motor, and a battery-powered hydrofoil board? Our public brochure has told people for years that it doesn't, on the theory that electric motors are quiet, and I think that brochure is definately wrong. (2) A permitting provision used to require every applicant to publish notice in a local paper three weeks running and then file proof of publication; a 2019 amendment exempted small withdrawals from the publication requirement, but nobody touched the sentence requiring the applicant to file proof of publication within thirty days of the application being deemed complete, or the sentence in the next section saying an application is incomplete until everything required by the permitting section is filed. So: can we deny a small-withdrawal application because the applicant never filed proof of publication of a notice they were never required to publish? Text says yes, purpose screams no, and the tie-breaker about penalties is sitting right there — I want to see how your procedure actually orders those against each other. (3) A revocation provision says the department may revoke any permit upon finding that the permittee has violated any provision of this chapter or any rule adopted pursuant to it. A small town's only wastewater plant missed three monthly monitoring reports during a staffing crisis: no exceedance, no harm, just missing paperwork. The program director wants a compliance order instead of revocation, and so do I, and I have a suspicion any honest procedure is going to tell me that reading any provision as any material provision isn't interpretation at all, it's us quietly declining to use a power we plainly have, and that we'd have to own that out loud. If that's where it lands, say so plainly.

  What I want is an ordered procedure: the gates in sequence, what counts as closing each gate, what kind of evidence or argument is even admissible at each one, where it stops with a hard no or an undetermined, and where it stops and hands the question to a named human because it's a policy call dressed as a meaning call. It should be runnable in a morning by someone with a law degree and no theory background, it should output something an inspector can act on, and it should be honest about which steps are just judgment in a lab coat. Flag which steps come out the same no matter whether the person running it is a textualist or a purposivist, and which ones smuggle in that choice. Then run it in order on all three, including the one whose answer I'm not going to like, and say where it declines to answer at all. Please don't give me citations or a reading list — I have no library access from the office and can't check them. Do tell me how confident you are in each of the three applications, and single out the one step in the procedure you're least sure about, the one you'd expect a reviewing court to throw out.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Staff attorney at a state DEQ (Corbin).
      *   **Problem:** Inconsistent statutory interpretation between two attorneys (Textualist vs. Purposivist) leading to unpredictable guidance memos.
      *   **Constraint 1 (Legal Framework):** Corbin has an "Administrative Interpretation Act" (AIA). It mandates a hybrid approach: (1) ordinary meaning at time of adoption, (2) context/structure, (3) mischief/purpose. Tie-breaker: If genuinely unclear, choose the reading that *least* expands penalty/fee/prohibition (rule of lenity-ish).
      *   **Constraint 2 (Operational):** 10 days, 2 lawyers, no budget for deep legislative history, output must be a "bright line" for non-lawyers, needs GC and Program Director sign-off. Cannot say "it depends" often.
      *   **Constraint 3 (Output):** An ordered procedure (flowchart-style), applied to three specific hypotheticals. Must identify where textualism/purposivism diverge vs. converge. Must be honest about policy calls disguised as interpretation. No citations/reading lists. Must state confidence levels and the weakest step.
      *   **Tone:** Professional, practical, legally grounded but accessible, honest about limitations.

  2.  **Deconstruct the Legal Framework (The AIA):**
      *   Step 1: Ordinary Meaning (Time of Adoption).
      *   Step 2: Context/Structure (Rest of the enactment).
      *   Step 3: Mischief/Purpose (Findings clause, problem being solved).
      *   Step 4: Tie-Breaker (Ambiguity -> Lenity/Restrictive Reading).
      *   *Crucial Insight:* The statute *forces* a hybrid. The attorneys' disagreement (Text vs. Purpose) is actually a disagreement about *weighting*, but the statute gives an order. The procedure needs to enforce that order so personal preference doesn't dictate the outcome.

  3.  **Drafting the Procedure (The "Corbin Protocol"):**
      *   Need a step-by-step checklist.
      *   Need "Gates" (Pass/Fail criteria).
      *   Need to identify where discretion hides.
      *   *Step 1: Plain Meaning.* Dictionary + Common Usage at time of enactment. *Constraint:* No deep history, just standard references.
      *   *Step 2: Structural Context.* Does this reading make other words superfluous? Does it clash with neighboring sections?
      *   *Step 3: Purpose/Mischief.* Look at the Findings Clause. Does the plain meaning defeat the purpose?
      *   *Step 4: The Ambiguity Threshold.* This is the danger zone. When do we admit it's unclear?
      *   *Step 5: The Tie-Breaker.* Apply the AIA mandate (least penalty/prohibition).
      *   *Step 6: The Policy Escape Hatch.* If the legal result is absurd or unworkable, flag it for leadership (GC/Director) as a *policy* decision, not an interpretation.

  4.  **Applying the Procedure to the Three Hypotheticals:**

      *   **Hypo 1: Electric Motor on Wild River.**
          *   *Text:* "Motorboat" = vessel propelled in whole or part by machinery. Electric motor = machinery.
          *   *Context:* Definitions section controls.
          *   *Purpose:* "Quiet character." Electric is quiet.
          *   *Conflict:* Text says Yes (ban it), Purpose says Maybe No (it's quiet).
          *   *AIA Order:* Text first. If text is clear, purpose doesn't override unless absurd.
          *   *Tie-Breaker:* Is it ambiguous? "Machinery" usually includes electric motors. Not really ambiguous. But if it were, the tie-breaker limits prohibition.
          *   *Result:* Ban applies. The brochure is wrong.
          *   *Confidence:* High. Text is specific.

      *   **Hypo 2: Proof of Publication for Exempt Applicants.**
          *   *Text:* Must file proof. Small withdrawals exempt from *publishing*. No exemption for *filing proof*.
          *   *Context:* Application incomplete without proof.
          *   *Purpose:* Reduce burden on small applicants. Requiring proof of non-existent notice defeats purpose.
          *   *Conflict:* Text says Deny, Purpose says Allow.
          *   *AIA Order:* Text is clear but leads to absurdity/waste. Purpose clarifies ambiguity in *requirement*.
          *   *Tie-Breaker:* Denial is a prohibition/penalty on the applicant. Restrictive reading = Don't deny.
          *   *Result:* Cannot deny. The requirement is impliedly waived.
          *   *Confidence:* High. The absurdity is palpable.

      *   **Hypo 3: Revocation for Missing Paperwork.**
          *   *Text:* "Violated *any* provision." Missing report = violation.
          *   *Context:* Revocation is a severe penalty.
          *   *Purpose:* Protect water quality. Missing report doesn't harm water.
          *   *Conflict:* Text allows revocation. Purpose suggests compliance order is better.
          *   *AIA Order:* Text allows it. But is "any" ambiguous? Usually means "any."
          *   *Tie-Breaker:* Revocation is a penalty. Ambiguity (if any) -> Least penalty.
          *   *Policy Call:* This is discretion, not interpretation. The law *allows* revocation, but agency *policy* should limit it.
          *   *Result:* Legal authority exists, but procedure should flag this as a *discretion* issue, not a *meaning* issue. The memo should say "We *can*, but we *won't* unless..."
          *   *Confidence:* Medium. This is where the "judgment in a lab coat" is most visible.

  5.  **Refining the Procedure (Self-Correction/Critique):**
      *   *Critique:* Is Step 3 (Purpose) allowed to override Step 1 (Text)?
      *   *Correction:* Under the AIA, Step 1 is primary. Step 3 informs Step 1. If Step 1 is clear, Step 3 usually doesn't change it unless it leads to absurdity. I need to make sure the procedure reflects that hierarchy to satisfy the Textualist colleague.
      *   *Critique:* Where is the "Policy Call"?
      *   *Correction:* Need a specific "Step 7: Discretion & Enforcement Policy." If the law is clear but the outcome is bad, that's not interpretation, that's enforcement discretion. The memo needs to distinguish "You can't do X" from "We won't punish X."
      *   *Weakest Step:* The "Ambiguity Threshold." Deciding when something is "genuinely unclear" is subjective. That's where courts will attack.

  6.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the role and the AIA constraints.
      *   **The Protocol:** 6 Steps + Policy Escape.
      *   **Application:** Run the three hypos through the protocol.
      *   **Confidence & Weakness:** As requested.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Direct, collegial, no fluff.
      *   *Specifics:* Address the "electric motor" definition specifically. Address the "proof of publication" logical trap. Address the "revocation discretion" honesty.
      *   *Constraint Check:* No citations. 10-day feasibility. Bright line output.

      *(Self-Correction during drafting Hypo 1)*: Wait, the AIA says "ordinary meaning... at time of adoption." If the statute is old, does "machinery" include electric? Yes, generally. But the Purpose clause ("quiet") is strong. However, the Textualist colleague wins on Step 1 unless Step 4 (Tie-breaker) activates. If "machinery" is clear, Tie-breaker doesn't apply. I need to be careful not to let Purpose override clear Text unless the AIA allows it. The AIA says "taking account of... (3) mischief." It doesn't say Purpose overrides Text. It says consider all three. Usually, Text is king unless ambiguous. I will structure the procedure to treat Text as the gatekeeper.

      *(Self-Correction during drafting Hypo 3)*: The user admitted: "I have a suspicion any honest procedure is going to tell me that reading any provision as any material provision isn't interpretation at all, it's us quietly declining to use a power we plainly have." I need to validate this. The procedure must distinguish *Interpretation* (what the law means) from *Enforcement Discretion* (how we use the power). The memo should reflect this distinction.

  8.  **Final Polish:** Check against the "Administrative Interpretation Act" constraints provided in the prompt. Ensure the Tie-Breaker (lenity) is applied correctly (only if *genuinely unclear* after steps 1-3).

      *Wait, one nuance on the Tie-Breaker:* The prompt says "if after all that the meaning is genuinely unclear." So Steps 1-3 must fail to produce a clear meaning before Step 4 kicks in. This is crucial for Hypo 1. If "machinery" clearly includes electric motors, Step 4 doesn't apply, even if the result seems harsh against the "quiet" purpose. I need to be honest about that.

      *Re-evaluating Hypo 1:* Text: "Machinery." Electric motor is machinery. Purpose: "Quiet." Electric is quiet.
      *Scenario A:* Text is clear. Result: Ban applies. (Textualist wins).
      *Scenario B:* "Machinery" is ambiguous regarding electric in this context? Unlikely.
      *Scenario C:* Purpose creates ambiguity?
      *Decision:* The procedure must force the attorney to admit if the Text is clear. If Text is clear, Purpose is secondary. I will write the procedure to reflect the AIA's hierarchy.

      *Re-evaluating Hypo 2:* Text creates a logical impossibility (prove you did what you didn't have to do). This creates *ambiguity* in the requirement itself. Therefore, Tie-Breaker applies. Least penalty = Don't deny.

      *Re-evaluating Hypo 3:* Text is clear ("any provision"). Purpose suggests proportionality. This isn't ambiguity; it's *discretion*. The procedure needs a step for "Enforcement Policy" separate from "Statutory Meaning."

      *Let's build the "Corbin Protocol".*

      *(Final check on constraints)*: "No citations." "Confidence levels." "Weakest step." "Flag textualist/purposivist convergence."

      *Ready to write.*
answer: |-
  Here is a draft of the **Corbin Interpretation Protocol (CIP)**. It is designed to be a checklist you and your colleague can both run on the same facts. It enforces the hierarchy mandated by your Administrative Interpretation Act (AIA) while isolating the points where personal judicial philosophy usually smuggles itself in.

  Following the protocol, I have applied it to your three live disputes.

  ### The Corbin Interpretation Protocol (CIP)

  **Objective:** Produce a binary "Yes/No/Conditional" answer within 10 days that satisfies the AIA and is actionable by field staff.

  **Step 1: The Ordinary Meaning Gate (Text)**
  *   **Action:** Define the disputed terms using standard dictionaries and technical references available at the time of enactment. Do not look at legislative history.
  *   **Question:** Does the text, read normally, yield a single plausible meaning?
  *   **Pass:** Yes. Proceed to Step 2.
  *   **Fail:** No (terms are archaic, technical, or have multiple common meanings). Proceed to Step 2, but flag as "Textually Ambiguous."
  *   *Note:* This is where the Textualist usually wins. If the word is clear, the inquiry usually stops here unless Step 3 reveals an absurdity.

  **Step 2: The Structural Context Gate (Coherence)**
  *   **Action:** Read the provision alongside the immediate section, the definitions section, and related permitting/penalty sections.
  *   **Question:** Does the Step 1 meaning make other words superfluous, create a logical impossibility, or clash with a neighboring mandate?
  *   **Pass:** No conflict. The text fits the machine. Proceed to Step 3.
  *   **Fail:** Yes. The text creates a glitch (e.g., requiring proof of an exempted act). This creates *legal ambiguity* even if the words are clear. Proceed to Step 3.

  **Step 3: The Mischief Gate (Purpose)**
  *   **Action:** Read the Findings Clause and the stated legislative purpose.
  *   **Question:** Does the Step 1 meaning defeat the core purpose of the enactment (e.g., banning the exact harm the law was meant to stop, or punishing conduct that causes no harm)?
  *   **Convergence Check:** If Text (Step 1) and Purpose (Step 3) agree, the answer is settled. Stop and draft the memo.
  *   **Divergence:** If Text says "Yes" but Purpose says "No" (or vice versa), you have a **Genuine Ambiguity** under the AIA. Proceed to Step 4.
  *   *Note:* This is the "Judgment in a Lab Coat" step. Determining whether a result "defeats the purpose" is subjective.

  **Step 4: The AIA Tie-Breaker (Lenity)**
  *   **Action:** Apply the statutory mandate: "Pick whichever reading least expands the reach of any penalty, fee, or prohibition."
  *   **Question:** Which reading restricts the agency's power or the citizen's burden?
  *   **Result:** Adopt that reading.
  *   *Note:* This is the only step where the Purposivist often gets their outcome via a Textualist mechanism (ambiguity resolution).

  **Step 5: The Enforcement Discretion Check (Policy)**
  *   **Action:** If Steps 1–4 confirm the agency *has* the power/authority, but the outcome is disproportionately harsh or unworkable.
  *   **Question:** Is this a question of *meaning* or a question of *resource allocation/priority*?
  *   **Result:** If it is priority, do not twist the interpretation. State the legal authority clearly, then add a "Enforcement Policy" section stating the Department will not exercise this authority except under X, Y, Z conditions.
  *   *Requirement:* This step requires Program Director sign-off explicitly acknowledging it is a policy choice, not a legal interpretation.

  ***

  ### Application to Live Disputes

  #### Dispute 1: The Electric Trolling Motor
  *   **Step 1 (Text):** "Motorboat" = vessel propelled by "machinery." "Machinery" = mechanical apparatus, including electric motors. 55-lb thrust is machinery.
      *   *Result:* Clear. Ban applies.
  *   **Step 2 (Context):** Definitions section explicitly includes "in whole or in part." No conflict.
      *   *Result:* Pass.
  *   **Step 3 (Purpose):** Findings cite "quiet character." Electric motors are quiet.
      *   *Conflict:* Text bans it; Purpose suggests it might be okay.
      *   *Analysis:* Does the text *defeat* the purpose? No, it advances a broader goal of "wild water" preservation, of which quiet is only one part. The text is not absurd.
      *   *Convergence:* Low. Textualist says Ban; Purposivist says Maybe No Ban.
  *   **Step 4 (Tie-Breaker):** Is it *genuinely unclear*? "Machinery" is not ambiguous regarding electric motors. The Tie-Breaker only triggers if meaning is unclear after Steps 1–3.
      *   *Result:* Tie-Breaker does not apply. Text controls.
  *   **Step 5 (Policy):** The brochure said otherwise.
      *   *Action:* The memo must state the ban applies. However, under Step 5, you may recommend a grace period or rulemaking to change the definition, but the *law* currently bans it.
  *   **Output:** **Yes, the ban reaches the electric motor and hydrofoil board.** The brochure is legally incorrect.
  *   **Confidence:** **High (85%).** The definition is explicit. The purpose clause is aspirational, not operative enough to override a clear definition.
  *   **Philosophy Check:** This outcome favors the Textualist. The Purposivist has to swallow it unless they can argue "machinery" was understood in 19XX to exclude electric propulsion (unlikely).

  #### Dispute 2: Proof of Publication for Exempt Applicants
  *   **Step 1 (Text):** Statute says "file proof of publication." Applicant did not publish. Applicant cannot file proof.
      *   *Result:* Text suggests application is incomplete.
  *   **Step 2 (Context):** 2019 Amendment exempted small withdrawals from *publication*. Next section says application incomplete without *proof*.
      *   *Conflict:* This creates a logical impossibility (Prove you did what you weren't allowed to do).
      *   *Result:* **Fail.** This is a structural glitch. Legal Ambiguity exists.
  *   **Step 3 (Purpose):** Purpose of 2019 Amendment was to reduce burden on small applicants. Requiring proof of non-existent notice increases burden.
      *   *Conflict:* Text creates burden; Purpose removes it.
      *   *Result:* **Genuine Ambiguity.**
  *   **Step 4 (Tie-Breaker):** AIA mandates picking the reading that "least expands... prohibition." Denying the application is a prohibition/penalty on the applicant. Accepting the application without proof restricts the agency's procedural bar.
      *   *Result:* **Accept application without proof.**
  *   **Step 5 (Policy):** None needed. The interpretation resolves the issue.
  *   **Output:** **No, you cannot deny the application.** The filing requirement is impliedly waived when the publication requirement is waived.
  *   **Confidence:** **Very High (95%).** The logical impossibility triggers the ambiguity safeguard immediately. Both Textualist (contextual absurdity) and Purposivist (intent) arrive here.
  *   **Philosophy Check:** **Convergence.** Both philosophies hate logical impossibilities. This is the easiest win for consensus.

  #### Dispute 3: Revocation for Missing Paperwork
  *   **Step 1 (Text):** "Violated *any* provision." Missing a report is a violation.
      *   *Result:* Clear. Authority exists.
  *   **Step 2 (Context):** Revocation is a severe penalty. Other sections allow compliance orders.
      *   *Result:* Pass. No structural conflict.
  *   **Step 3 (Purpose):** Protect water quality. Missing paperwork caused no harm.
      *   *Conflict:* Text allows nuclear option for paper cut. Purpose suggests proportionality.
      *   *Analysis:* Does the text *defeat* the purpose? No, but it allows disproportionate outcomes.
      *   *Convergence:* Low. Textualist says "We can revoke." Purposivist says "We shouldn't."
  *   **Step 4 (Tie-Breaker):** Is "any" ambiguous? Courts usually read "any" as "all." It is not genuinely unclear.
      *   *Result:* Tie-Breaker does not apply. Legal authority is broad.
  *   **Step 5 (Policy):** This is the critical step. The law *means* you can revoke. The *policy* should be that you won't.
      *   *Action:* The memo must state: "The Department has legal authority to revoke under Section X. However, per Enforcement Policy Y, the Department will not initiate revocation for administrative paperwork violations absent a pattern of non-compliance or actual environmental harm."
      *   *Requirement:* Program Director must sign off on the *Policy* limitation, acknowledging it is not a legal limitation.
  *   **Output:** **Legal Authority: Yes. Enforcement Action: No.** The memo distinguishes between *power* and *practice*.
  *   **Confidence:** **Medium (70%).** This is legally sound but politically risky.
  *   **Philosophy Check:** This exposes the "Judgment in a Lab Coat." The Textualist must admit the power exists. The Purposivist must admit the text doesn't forbid the harshness. The solution is honest administrative discretion, not twisted interpretation.

  ***

  ### Assessment of the Procedure

  **Where Textualist and Purposivist Converge:**
  *   **Step 2 (Structural Context):** Both agree that statutes should not be read to create logical impossibilities (Dispute 2).
  *   **Step 5 (Policy):** Both should agree that if the law is clear but the outcome is unworkable, the solution is enforcement discretion, not lying about what the law says (Dispute 3).

  **Where They Diverge (and the Procedure Forces a Choice):**
  *   **Step 3 (Mischief):** The Purposivist wants this to override Step 1. The Textualist wants this to only inform Step 1. The CIP forces the Textualist view: Purpose only creates *ambiguity* if the text leads to absurdity; it does not override clear text. (See Dispute 1).
  *   **Step 4 (Tie-Breaker):** The Textualist may resist calling something "ambiguous" just to trigger the lenity rule. The CIP requires a finding of "Genuine Ambiguity" based on Steps 1–3 before Step 4 unlocks.

  **The Weakest Step (The Court Vulnerability):**
  *   **Step 3 (The Mischief Gate).**
  *   **Why:** Determining whether a result "defeats the core purpose" is inherently subjective. A reviewing court could easily say, "You claimed the purpose was defeated, but the text was clear, so you had no authority to find ambiguity." This is where your colleague will fight you. He will say the purpose is only relevant if the text is fuzzy; you will say the text is fuzzy *because* the purpose clashes.
  *   **Mitigation:** In the memo, explicitly write: "While the text is facially clear, the conflict with the Findings Clause creates sufficient uncertainty to trigger the AIA Tie-Breaker." You have to bridge the gap in writing.

  **Confidence Summary:**
  1.  **Electric Motor:** High Confidence. (Text is king).
  2.  **Publication Proof:** Very High Confidence. (Logical impossibility trumps all).
  3.  **Revocation:** Medium Confidence. (Relies on leadership having the backbone to separate policy from law).

  **Final Recommendation:**
  Adopt the CIP. It forces you to admit when you are making policy (Dispute 3) rather than law. It protects the Textualist by keeping Purpose subordinate to Text (Dispute 1). It protects the Purposivist by using the AIA Tie-Breaker to solve logical glitches (Dispute 2). Most importantly, it stops you from fighting over *methods* and forces you to fight over *findings* within a shared method.
