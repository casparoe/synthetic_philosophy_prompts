answer: |-
  The French sequence from June 1793 to July 1794 functions not as an illustration of the proverb that revolutions devour their children, but as a crucible that discriminates between the causal mechanisms purported to drive it. To treat the guillotining of Girondins, Hébertists, and Dantonists as mere decoration is to ignore the specific geometry of their deaths. The record provided allows us to map agents, action variables, and predictions against the empirical trace of the Terror, ruling out some explanations while sharpening others.

  The first mechanism, the purity spiral of competitive outbidding, posits that legitimacy is currency and moderation is treason. Its agent is the faction; its action variable is the rhetorical position on virtue. It predicts a unidirectional radicalization where the center is consumed by the left, which is then consumed by the further left. The French record falsifies this. The Hébertists (the ultra-revolutionary flank) were executed on 24 March 1794, and the Dantonists (the Indulgents) on 5 April. This pincer movement, occurring within a fortnight, demonstrates that the Committee of Public Safety was not being dragged leftward by outbidding rivals; it was actively crushing both flanks to preserve a center. The ideological direction of successive purges was bidirectional, not spiral. Consequently, the purity spiral is ruled out. Similarly, the null hypothesis—that prominent people die violently in violent times and the pattern is retrospective imposition—fails against the tempo of the killings. Executions did not rise smoothly; they jumped from 155 monthly in Germinal to 796 in Messidor, precisely tracking the institutional change of the Law of 22 Prairial on 10 June. This discontinuity suggests a structural cause, not random noise.

  Three mechanisms remain standing: instrumental autonomy, coalition contraction, and the hypothesis regarding disloyal actors. The instrumental autonomy story argues that repressive instruments, once unshackled, consume their creators. The agent here is the apparatus (the Tribunal and National Guard); the action variable is legal constraint. The evidence strongly supports this. The Law of 22 Prairial abolished defense counsel and implicitly stripped Convention deputies of immunity. The resulting spike in executions, coupled with an acquittal rate that stayed near a quarter despite the removal of procedural brakes, indicates the machine was not merely following orders but processing inputs at maximum capacity. The apparatus had acquired an *esprit de corps* and momentum independent of the Committee's specific will. However, this mechanism alone cannot explain the ending. If the machine were fully autonomous, it should have continued until it ran out of fuel. Instead, it stopped abruptly with the fall of Robespierre.

  This is where coalition contraction and the disloyal actor hypothesis do necessary work. Coalition contraction posits that each purge narrows the winning coalition until the rump is too small to defend itself. The agent is the ruling clique; the action variable is the size of the protected circle. The prediction is that the sequence ends via a coup from inside the governing body, which is exactly what occurred in Thermidor. The men who dismantled the Terror were those who had staffed it. They survived because they were not yet the target, but they turned when the circle narrowed enough to threaten them. This aligns with your fifth mechanism: that eliminating partly disloyal actors destroys the capacity to de-escalate. Danton and the Indulgents represented a credible off-ramp; their "disloyalty" (campaigning for an end to the Terror) signaled that restraint was possible. By executing them, the Committee removed the only political cover for mercy. The purge continued for commitment reasons; having killed the advocates of peace, the leadership could not stop without admitting the previous executions were unnecessary. The victory at Fleurus in late June explains the timing of the end: it removed the military emergency that justified the repression. Without the external threat, the internal logic of the purge had no brake, making the leadership's position untenable until the Convention acted.

  Personnel selection remains ambiguous. It suggests revolutions promote traits adaptive for seizure but maladaptive for rule. While the survivors were indeed those capable of bureaucratic survival, this is indistinguishable from coalition contraction in this specific record. We cannot tell if they survived because of specific personality traits or simply because they were outside the narrowing target circle.

  Turning to the three standard interpretive frameworks, this analysis damages class struggle and ideology while strengthening contingency. The class struggle framework cannot easily account for the destruction of the Hébertists (sans-culotte aligned) and Dantonists (bourgeois aligned) by a Committee that claimed to represent both. The purges cut across class lines, driven instead by political utility. The ideological framework is similarly weakened; if ideology were the driver, the bidirectional purge makes no sense. One does not kill the ultra-radical and the moderate simultaneously unless ideology is secondary to power consolidation. Contingency, however, gains ground. The Fleurus victory is an exogenous shock that altered the cost-benefit analysis of the Terror. It suggests the devouring was not inevitable but contingent on the persistence of emergency conditions.

  For your essay's thesis to transcend anecdote, you must define the comparison class. A revolution that did not devour its children would require institutionalized opposition that was not lethal. It would look like a transition where the "Indulgents" were allowed to form a loyal opposition rather than a scaffold faction. The observation that would count against the instrumental autonomy mechanism would be a spike in executions *without* a change in legal procedure, or conversely, a procedural tightening that failed to reduce deaths. The observation counting against the disloyal actor hypothesis would be a leadership that eliminated all opposition yet successfully de-escalated violence without being overthrown.

  Finally, we must mark the silence. None of these mechanisms explain why Thermidor came in July rather than September. The structural pressures were present after Fleurus in late June, but the conspiracy required coordination among specific deputies. The mechanisms explain the *pressure* to devour, and the *capacity* to be devoured, but they do not predict the precise date of the bite. That remains in the realm of individual agency and conspiracy, a variable your structural models leave blank. Furthermore, while the acquittal rate supports the autonomy story, it does not explain *why* the Tribunal maintained a 25% acquittal rate even under Prairial. Was this residual professionalism, or a signal that the machine was not yet fully saturated? The record is silent. By acknowledging these gaps, you allow the French sequence to do real work: it confirms that revolutions devour their children not through a single dynamic, but through the intersection of unshackled institutions, narrowing coalitions, and the elimination of the very voices that could negotiate peace. The tragedy is not that the revolution was ideologically pure, but that it made restraint politically impossible.
