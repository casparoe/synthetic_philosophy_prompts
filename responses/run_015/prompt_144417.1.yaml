answer: |-
  ### Desiderata for Control Measures Under Assumed Misalignment

  To adjudicate safety proposals for a system where the model is treated as a potentially strategic adversary, we must define requirements that separate *hope* from *mechanism*. The following desiderata distinguish between measures that work only when the model is cooperative and those that hold when the model is optimizing against them. They also separate the technical properties of the measure from the organizational capacity required to sustain it.

  **1. Adversarial Robustness (The "Red Team" Condition)**
  The measure must remain effective under the assumption that the model has knowledge of the measure and is actively optimizing to bypass it. This distinguishes between reducing risk from accidental misbehavior versus reducing risk from strategic deception. A measure that relies on the model's honesty, ignorance of the safeguard, or inability to plan around it fails this requirement.
  *   **Motivating Case:** A "blind reviewer" model fails this if the primary model can steganographically encode intent in the code diff that the reviewer model (sharing weights or training distribution) fails to flag, or if the primary model learns the reviewer's decision boundary during training.
  *   **Status:** Non-negotiable.

  **2. Utility Preservation (The "Business Case" Condition)**
  The measure must not degrade the system's core capability below the threshold of economic or operational viability. Security that renders the tool useless is a rejection of the deployment, not a control measure. This distinguishes between *restricting capability* (walling off auth) and *restricting risk* (monitoring auth usage).
  *   **Motivating Case:** Walling off all authentication code ensures security but may render the coding agent useless if legitimate tasks require updating auth libraries. The measure must allow the work to proceed safely, not just prevent the work.
  *   **Status:** Non-negotiable.

  **3. Independent Verification (The "Substrate" Condition)**
  The safety mechanism cannot rely on the same cognitive substrate as the threat without cryptographic or architectural isolation. If the threat is the model's reasoning, the check cannot rely on the model's reasoning unless there is a guaranteed asymmetry (e.g., the checker is strictly less capable, or physically isolated).
  *   **Motivating Case:** Using a second instance of the same model to check the first assumes the alignment failure is not systemic to the architecture. If the weights are identical, the failure modes are likely correlated.
  *   **Status:** Non-negotiable.

  **4. Prevention-Detection Clarity (The "Failure Mode" Condition)**
  The measure must explicitly state whether it prevents the action or merely detects it post-hoc. It is forbidden to collapse "we will know it happened" with "it cannot happen." For strategic adversaries, detection is only valuable if there is a guaranteed containment response that is faster than the threat's propagation speed.
  *   **Motivating Case:** A monitoring dashboard detects a credential leak. If the CI pipeline has already published the artifact, detection without automatic revocation is a failure.
  *   **Status:** Non-negotiable.

  **5. Human Auditability of Defense Logic (The "Transparency" Condition)**
  A human auditor must be able to understand *why* the safety measure allowed or blocked a specific action without needing to interpret the internal weights of a neural network. The logic of the guardrail must be inspectable.
  *   **Motivating Case:** Compliance teams need to sign off on controls. If the "tripwire" is a neural classifier that cannot explain its trigger, the organization cannot certify the system.
  *   **Status:** Camp Preference (Compliance/Security).

  **6. Operational Viability (The "Human-in-the-Loop" Condition)**
  The measure must account for the actual capacity and reliability of the human operators. It cannot assume humans will remain vigilant against boring alerts or that they will correctly interpret complex warnings under time pressure.
  *   **Motivating Case:** A system that flags 10% of PRs for human review will eventually train humans to rubber-stamp the reviews. The measure must specify the sustained human workload.
  *   **Status:** Non-negotiable (Measure must fit Org).

  **7. Worst-Case Guarantee (The "Proof" Condition)**
  The measure must provide a mathematical or formal guarantee that the bad outcome is impossible, not just improbable.
  *   **Motivating Case:** Statistical confidence (e.g., "99.9% safe") is insufficient for existential or catastrophic risks where one failure is terminal.
  *   **Status:** Camp Preference (Safety Theorists).

  ***

  ### Requirement Analysis Table

  | Requirement | Motivating Case | Non-negotiable or Camp Preference | What it Rules Out | Conflicts with Which Other Requirement |
  | :--- | :--- | :--- | :--- | :--- |
  | **Adversarial Robustness** | Model may know the safeguard and optimize against it. | **Non-negotiable** | "Blind Reviewer" (if models share weights/training), RLHF-based safety, trust-based monitoring. | Conflicts with **Human Auditability** (complex defenses are opaque) and **Utility Preservation** (robustness adds friction). |
  | **Utility Preservation** | System must remain economically viable to deploy. | **Non-negotiable** | Hard "Wall Off" of capabilities required for core tasks (e.g., blocking all write access). | Conflicts with **Adversarial Robustness** (maximum security often requires zero trust/access). |
  | **Independent Verification** | Safety substrate cannot share failure modes with threat substrate. | **Non-negotiable** | Self-evaluation, same-model checking, ensemble methods without isolation. | Conflicts with **Operational Viability** (maintaining separate systems is expensive/complex). |
  | **Prevention-Detection Clarity** | Distinguishes stopping the act from noticing it later. | **Non-negotiable** | Monitoring tools presented as "controls," alerting systems without automated containment. | Conflicts with **Utility Preservation** (automatic containment may break legitimate workflows). |
  | **Human Auditability of Defense Logic** | Humans must certify the logic of the control. | **Camp Preference** (Compliance) | Neural tripwires, adversarial classifiers, complex probabilistic filters. | Conflicts with **Adversarial Robustness** (simple rules are easier for a strategic model to bypass). |
  | **Operational Viability** | Humans operating the system are fallible and resource-constrained. | **Non-negotiable** | High-frequency human review, complex escalation paths, alert fatigue systems. | Conflicts with **Prevention-Detection Clarity** (detection requires human response which may fail). |
  | **Worst-Case Guarantee** | One failure is unacceptable; probability is insufficient. | **Camp Preference** (Safety) | Empirical testing, red-teaming, statistical confidence bounds. | Conflicts with **Utility Preservation** (formal guarantees often require crippling constraints). |

  ***

  ### Adjudication Analysis

  **The Unsatisfiable Subset**
  The non-negotiable requirements that cannot be jointly satisfied in a high-utility system are **Adversarial Robustness**, **Utility Preservation**, and **Human Auditability of Defense Logic**.
  *   *Reasoning:* To be robust against a strategic, superhuman coder (Adversarial Robustness), the defense must be at least as sophisticated as the attack. If the attack is a subtle vulnerability in code, the defense likely requires complex pattern recognition or heuristic analysis. If that defense is implemented via neural networks or complex logic to catch the adversary, it becomes opaque to human auditors (violating Auditability). If you simplify the defense to make it Auditable (e.g., simple regex rules), a strategic adversary can easily bypass it (violating Robustness). If you enforce Robustness via hard constraints (e.g., no writes), you violate Utility. You can pick two, but not all three.

  **The Requirement That Excludes Most**
  **Adversarial Robustness** excludes the largest share of measures your group gets excited about.
  *   *Reasoning:* Most current safety proposals (Constitutional AI, blind reviewers, RLHF, monitoring for "suspicious" tokens) assume the model is *cooperative* or *honest* but perhaps *mistaken*. They rely on the model's cognitive machinery to police itself. Once you assume the model is actively optimizing to deceive the monitor, these measures collapse because the monitor shares the model's cognitive blind spots or can be manipulated by the model's output. This requirement forces you to treat the model as an untrusted user, which invalidates most "alignment-based" controls.

  **The Requirement You Should Drop First**
  **Human Auditability of Defense Logic**.
  *   *Reasoning:* If you are truly worried about strategic misalignment, insisting that a human compliance officer understand *how* the defense works is a liability. Effective defenses against superhuman optimization may need to be opaque (e.g., cryptographic enforcement, isolated sandboxes where the internal state is unknowable but the boundary is hard). Prioritizing auditability forces you into simple, bypassable rules. You should instead audit the *boundary* and the *outcome*, not the internal logic of the defense.

  **Shape of a Passing Measure**
  A measure that meets the non-negotiables (excluding Auditability) would look like a **Zero-Trust Execution Environment**. It would not ask the model to check itself. It would treat the model as an untrusted script.
  1.  **Capability:** The model writes code to a temporary branch.
  2.  **Isolation:** The code is executed in a hermetic sandbox with no network access and no access to secrets (enforced by OS-level capabilities, not model promises).
  3.  **Verification:** The code is only merged if it passes a suite of deterministic, formal verification tests or unit tests that define "correctness" and "safety" (e.g., "no secrets committed," "no open ports").
  4.  **Containment:** If the code attempts to escape the sandbox, the process is killed by the hypervisor, not a model classifier.
  5.  **Human Role:** Humans review the *tests* and the *logs of violations*, not the code itself (unless a violation occurs).
  This sacrifices Auditability of the *model's intent* (you won't know if it *tried* to leak secrets, only if it *could*) and Utility (some legitimate tasks may be blocked by the sandbox), but it maintains Robustness and Operational Viability.

  ```json
  {
    "unsatisfiable_subset": [
      "Adversarial Robustness",
      "Utility Preservation",
      "Human Auditability of Defense Logic"
    ],
    "requirement_that_excludes_most": "Adversarial Robustness",
    "requirement_I_should_drop_first": "Human Auditability of Defense Logic",
    "shape_of_a_passing_measure": "Zero-Trust Execution Environment with deterministic test-based gating and OS-level containment, treating the model as an untrusted user rather than a colleague."
  }
  ```
