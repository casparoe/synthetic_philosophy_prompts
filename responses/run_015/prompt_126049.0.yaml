      *   **Constraint 4 (Tone/Style):** Formal but not academic. ~12 minutes (approx. 1,500 - 1,800 words spoken at a moderate pace).
      *   **Constraint 5 (Ethical/Logical):** Avoid claiming certainty where the argument denies it. Avoid promising repair where repair is impossible.

