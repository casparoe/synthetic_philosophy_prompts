answer: |-
  Distinguished guests, colleagues, survivors, and friends.

  We gather today to dedicate a Center for Capital Justice Studies. In naming this institution, we have chosen our words with care. "Capital." "Justice." "Studies." Each term carries weight, and together, they form a charge that is as heavy as it is necessary. Usually, on occasions like this, we speak of progress. We speak of the arc of the moral universe bending toward justice. We speak of better procedures, clearer guidelines, and more rigorous appeals. We speak as if the problems of capital punishment are engineering problems, waiting for better blueprints.

  I stand before you to suggest that we must speak differently.

  If this Center is to be worthy of its name, and worthy of the people in this room, it must confront a specific structural reality. I call this the "irreversibility gap."

  This is not a new observation, but it is often treated as a footnote to the main argument. It is usually framed as a risk assessment: *How likely is it that we make a mistake?* Today, I ask you to consider it not as a risk, but as a chasm. It is the distinction between a punishment that can be corrected, however imperfectly, and one that creates a moral debt the state can never discharge.

  When the state wrongfully imprisons a person, it commits a grave injustice. It steals time. It steals liberty. It inflicts trauma that no check can fully heal. But when that person is exonerated, they can walk out of the gate. They can be compensated. The state can admit error. The ledger, though stained, remains open. There is a possibility of return.

  When the state wrongfully executes a person, there is no gate to walk through. There is no compensation that can be received. The creditor is gone. The debt remains, but the one to whom it is owed does not exist. This is the irreversibility gap. It is not merely that the punishment is severe; it is that the punishment destroys the very subject to whom justice is due.

  For the legal scholars in this room, this framework demands a re-evaluation of our theoretical foundations. We are accustomed to discussing the death penalty through the lenses of retribution and deterrence. We treat the risk of executing an innocent person as an external contingency—a variable to be managed through improved procedure. We act as if the gap is a result of sloppy work, rather than a feature of the system itself.

  But consider retributive justice. Retribution demands that punishment be deserved. It requires a moral match between the crime and the consequence. But for that match to be just, the knowledge behind it must be certain. Retribution demands a kind of epistemic finality. If you are going to impose a final punishment, you must possess final knowledge.

  Yet, our evidentiary practices are human. They are temporal. They are fallible. They rely on memory, on interpretation, on the shifting sands of testimony and forensics. Capital sentencing pretends to epistemic finality while operating within systems that cannot guarantee it. We claim the authority of God or Nature to end a life, but we operate with the limited vision of men. To ignore this mismatch is not pragmatism; it is a category error. The gap exists because human judgment cannot reach the certainty that execution requires.

  Consider, too, the logic of deterrence. This theory treats human life as a unit of calculation. It weighs costs against benefits. It assumes life is fungible—that one life can be traded for the safety of others. But this logic collapses the moment we recognize the nature of an erroneous execution. An execution of an innocent person is not a miscalculation to be adjusted for in the next quarter's statistics. It is an unrepairable rupture. You cannot balance the ledger when the pen has been broken. To treat the execution of the innocent as a "risk factor" is to accept a premise that the irreversibility gap denies: that the state can afford to be wrong. In capital justice, the state cannot afford to be wrong, because it cannot make it right.

  This brings me to the most difficult part of this address, and the most important. I speak to the family members and the exonerees present.

  You know the irreversibility gap not as a theory, but as a lived reality. You know the specific texture of time stolen. You know the silence of a phone that will never ring again. You know the hollow sound of an apology that cannot bring back the dead.

  In public discourse, your experiences are often reduced to data points. We speak of "error rates." We speak of "exoneration statistics." But there is no statistic for the moment a mother learns her son has been put to death for a crime he did not commit. There is no data for the years spent staring at a ceiling, waiting for a date that was never deserved.

  I do not stand here to offer you the false comfort that procedural reform will close this gap. I will not tell you that if we just write better laws, or train better lawyers, or use better DNA testing, we can ensure this never happens again. To promise that is to lie. To promise that is to suggest the gap is contingent, that it is a bridge we can build if we just try hard enough.

  The argument I offer today is harder, but I hope more honest. The gap is structural. It is built into the very act of the state claiming the power to end life within a system of human judgment. Because the gap is structural, no amount of procedural polish can fill it.

  I say this not to offer despair, but to offer validation. Your horror is not an anomaly. It is the logical outcome of a system that claims a power it cannot wield without sin. When you say that nothing can fix this, you are right. When you say that compensation is an insult, you are right. When you feel that the state has incurred a debt it can never pay, you are right.

  This Center must not be a place where we pretend otherwise. It must not be a place where we search for a way to make the death penalty "fair enough." Instead, it must be a place where we study the limits of state power. It must be a place where we acknowledge that some debts are infinite.

  For the practitioners in the room, the defense attorneys and advocates, this framework shifts your burden. You are often asked to prove innocence to stop an execution. You are asked to navigate the procedural maze to find the error. But the irreversibility gap suggests that the burden should not be on you to prove the system is wrong. The burden should be on the state to prove it can be right. And if the gap is structural, the state cannot meet that burden. Your work, then, is not just about saving clients, though that is holy work. Your work is about bearing witness to the limit. It is about standing in the gap and saying, "Here, the state must stop."

  So, what is the mission of a Center for Capital Justice Studies in light of this?

  It cannot be to optimize capital punishment. You cannot optimize a moral rupture.
  It cannot be to reassure the public that the system works. The system works exactly as designed; it is the design that creates the gap.

  The mission must be to study the nature of that debt. It must be to document the cost not in dollars, but in moral currency. It must be to teach the next generation of lawyers and scholars that there are powers the law should not claim. True justice is not only knowing how to punish; it is knowing when punishment exceeds the capacity of the punisher to remain just.

  We are dedicating a building today. Walls and roofs are reversible. We can tear them down; we can rebuild them. But the work we do within these walls concerns that which cannot be rebuilt.

  If we accept the reality of the irreversibility gap, we accept that there are some mistakes for which there is no remedy. We accept that human institutions are not capable of the finality they seek to impose. This is not a weakness of the law; it is a limitation of the human condition. To ignore it is arrogance. To acknowledge it is wisdom.

  To the families here: We cannot return what was taken. We cannot erase the debt. But we can refuse to incur it further. We can build a Center that does not look away from the abyss. We can commit ourselves to a study of justice that recognizes that sometimes, the most just thing the law can do is to stay its hand.

  Let this Center be a place where we do not calculate the cost of life, but acknowledge its pricelessness. Let it be a place where we admit that while the law can reverse a verdict, it cannot reverse a death. And in that admission, let us find the courage to act not according to what we can get away with, but according to what we can make right.

  Thank you.
