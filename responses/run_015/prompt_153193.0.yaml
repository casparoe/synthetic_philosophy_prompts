      *   *Standard Verdict:* DH is more *permissive* regarding the act itself (it allows the wrong) but stricter regarding the emotional/penitential aftermath. Consequentialism is often seen as "cleaner" about the act (it's not wrong if it maximizes good) but DH acknowledges the moral cost.
      *   *The Twist:* I need DH to be *more restrictive* (refuse the act) than Consequentialism.
