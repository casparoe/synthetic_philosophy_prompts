  *(Self-Correction on the "Prosthesis" case)*: This is a metaphysical puzzle. For hospital policy, it's likely irrelevant *now*, but the specification must show *where* it would break. I should note that for *current policy*, this is low priority, but for *conceptual coherence*, it's high stakes.

