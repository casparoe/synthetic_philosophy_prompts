  2.  **Deconstruct the User's Input:**

      *   *Core Purpose:* A rule for the bedside, explainable to families, legally determinate, honest for staff.
      *   *Candidate Cases to Classify:* Decapitation, somatically sustained brain-dead bodies (gestation/healing), transient circulatory arrest (autoresuscitation), permanently unconscious (intact brainstem), anencephalic newborns, hypothermic drowning ("nobody is dead until warm and dead").
      *   *Distinctions to Maintain:* Death vs. Criteria/Tests, Dying vs. Dead, Organism Death vs. Person Death, Irreversible vs. Permanent, Event vs. Process, Legal vs. Biological.
      *   *Biological Constraints:* Brain as integrator, organism not just a pile of organs.
