      *   *Neural Prosthesis:* Ship of Theseus problem. If function continues, is the biological organism dead? This attacks the "biological organism" definition.

  6.  **Identifying the Tensions (The "Brutal" Part):**

      *   *The Trilemma:* You can't have (1) A single unified biological state of death, (2) A precise determinate time of death, AND (3) The current dual-criteria practice (especially DCD) all at once.
      *   *DDR vs. Procurement:* Expanding DCD puts pressure on DDR. If we declare death to get organs, are we killing?
      *   *Biology vs. Policy:* Biology is often a process; Policy needs an event.

  7.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the task (Specification, not Theory).
