  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Clinical Applicability.* Needs to be actionable at the bedside within hours.
          *   *Motivation:* Clinicians can't wait for philosophical consensus.
          *   *Status:* Non-negotiable for *policy*, though maybe not for *theory*.
      *   *Requirement 2: Legal/Temporal Determinacy.* Needs a specific time of death for the record.
          *   *Motivation:* Attorneys, inheritance, criminal law, procurement windows.
