      *   *Requirement 3: Honesty/Integrity.* Staff shouldn't have to lie to families or themselves.
          *   *Motivation:* Moral distress, trust.
          *   *Status:* Non-negotiable for ethical practice.
      *   *Requirement 4: Biological Coherence.* Must align with physiology (organism vs. parts).
          *   *Motivation:* Scientific accuracy.
          *   *Status:* Contested (what counts as "organismal" function?).
      *   *Requirement 5: The Dead Donor Rule (DDR).* Organs only taken after death.
          *   *Motivation:* Public trust, legal protection.
          *   *Status:* Often treated as non-negotiable, but functionally eroded in DCD. Need to flag this tension.
      *   *Requirement 6: Handling the "Gray Zones".* Hypothermia, anencephaly, etc.
          *   *Motivation:* Consistency.
          *   *Status:* Where the theories fight.

  4.  **Addressing the Specific Cases & Distinctions:**

      *   *Decapitation:* Easy for most, hard for strict circulatory views initially.
      *   *Somatic Sustenance (Gestation):* Challenges "integrator" view of whole-brain death.
      *   *Autoresuscitation:* Challenges DCD timing (5 minutes vs. 2 minutes).
      *   *PVS/Anencephaly:* Challenges higher-brain vs. whole-brain.
      *   *Hypothermia:* Challenges "irreversible" vs. "permanent."
      *   *Distinctions:* Crucial to separate *what death is* from *how we test for it*.

  5.  **Addressing the Edge Cases:**

