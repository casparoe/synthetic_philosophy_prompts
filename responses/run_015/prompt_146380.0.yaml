answer: |-
  Dear Colleagues, as we embark on this new methodology for adjudicating between competing scientific frameworks, I write to propose a decision procedure grounded in the pragmatic view that the value of a model lies not in its correspondence to an independent reality but in its utility for coping with specific problems. This shift requires us to abandon the question of which model is true and instead ask which model serves our agreed-upon purposes most effectively. To make this operational for a board without philosophical training, I have designed a sequence of inquiries that must be addressed in a fixed order, moving from the concrete to the abstract, and terminating either in a clear recommendation or in a recognized need for value-based judgment. The first question we must pose is what specific practical problem requires solving, and a sufficient answer here must be a concrete description of a desired outcome rather than a theoretical understanding, such as preventing fish kills in the watershed within five years rather than understanding the ontology of ecological stress. The second question asks which model predicts the variables relevant to that outcome with greater accuracy within the specified timeframe, and a sufficient answer requires empirical validation data showing statistical superiority or equivalence in predictive power regarding the specific outcome defined in the first step. The third question concerns the resource costs of implementing each model, including financial expenditure, time delays, and personnel training, where a sufficient answer is a budgetary and logistical analysis quantifying these burdens. If one model demonstrates superior predictive accuracy for the stated goal at an equal or lower cost, the procedure yields a definite recommendation at this precise point to adopt that model regardless of its theoretical elegance or mechanistic transparency. However, if the models are equivalent in predictive utility and cost, or if the model with superior utility requires adopting a vocabulary that fundamentally alters our social or ethical relationship to the subject matter, the procedure must stop and hand the matter to human judgment because the dispute is no longer about fact or utility but about vocabulary choice and values.

  Let us apply this procedure to the two concrete proposals currently before us regarding the prediction of ecosystem collapse in the specific watershed under our stewardship. The first proposal is the reductionist gene-expression model, which seeks to identify collapse by monitoring stress-response genes in key indicator species, relying on the classical biological intuition that molecular mechanisms drive macroscopic outcomes. The second proposal is the emergent systems-biology framework, which ignores specific genetic pathways and instead models the watershed as a network of energy flows and population dynamics, treating the organisms as black boxes within a larger computational structure. We begin with the first question of the procedure, defining the practical problem, and our board has agreed that the goal is to issue a warning signal six months prior to irreversible collapse to allow for economic mitigation, not to explain why the collapse occurs. Moving to the second question regarding predictive accuracy, historical simulation data indicates that the systems-biology framework successfully predicted past collapse events with eighty-five percent accuracy at the six-month mark, whereas the reductionist gene-expression model achieved only sixty percent accuracy because molecular stress markers often appeared too late or were triggered by non-critical stressors. Although the reductionist model feels intuitively correct to classically trained scientists who believe that understanding the mechanism is prerequisite to trusting the prediction, the procedure dictates that we prioritize the six-month warning capability over mechanistic transparency. Consequently, at the precise point of comparing predictive accuracy against the stated goal, the procedure yields a definite recommendation to endorse the emergent systems-biology framework, even though this recommendation will feel intuitively wrong to biologists accustomed to viewing molecular causality as the only legitimate form of scientific explanation. We must acknowledge that this is where the procedure risks collapsing into arbitrary preference if the goal itself is contested, for if a faction on the board values mechanistic understanding over warning times, the first step of the procedure fails to secure agreement, and we are forced into the handoff point where human judgment must decide whether prediction or explanation is the higher value.

  We must be explicit about where this procedure misfires or risks instability, particularly in the definition of the practical problem itself. If the board cannot agree on whether the goal is economic mitigation or ecological preservation, the first question yields conflicting sufficient answers, and the subsequent steps become meaningless because the utility of each model is relative to the unstated goal. Furthermore, there is a risk that the procedure validates a model that is useful now but epistemically stagnant, such as a black-box algorithm that predicts collapse but offers no leverage for intervention, potentially trapping us in a cycle of coping without understanding. Despite these risks, regarding your final inquiry on whether Rorty's neopragmatism can genuinely constrain institutional scientific decision-making without dissolving into relativism, I take the definite position that it can and must, provided we recognize that constraints arise from social solidarity and consequences rather than metaphysical reality. Relativism suggests that any belief is as good as any other, but neopragmatism argues that beliefs are constrained by their consequences in the shared world, meaning a model that fails to predict collapse is not relatively true but simply useless for our shared purpose of survival and prosperity. Therefore, the constraint is not the world itself forcing itself upon our minds, but the resistance of the environment to our actions when our tools are inadequate, which is an objective constraint on our practices even if it is not a mirror of reality. By anchoring our decision-making to intersubjective agreements on goals and measuring success through public consequences, we avoid the paralysis of relativism while abandoning the futile quest for a God's-eye view of truth, allowing us to make robust institutional decisions that are justified by their ability to help us cope rather than by their claim to represent nature as it is in itself.
