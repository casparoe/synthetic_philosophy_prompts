  2.  **Deconstruct the Philosophical Landscape:**
      *   **Panpsychism:** The view that consciousness is a fundamental feature of physical matter. Usually implies *proto-consciousness* at the micro level (electrons, quarks) and *macro-consciousness* at the complex level (humans).
      *   **The Combination Problem:** How do micro-experiences combine to form macro-experiences? (Relevant to the entangled particles vs. brain question).
      *   **Ethical Panpsychism:** If everything has experience, does everything have moral status?
      *   **Key Distinction:** *Experience* vs. *Suffering/Valence.* Just because something has an experience doesn't mean it can suffer. A rock might have a "null" experience. An electron might have a "blink" of experience without positive or negative valence.
      *   **Integrated Information Theory (IIT):** A leading scientific theory of consciousness often paired with panpsychism. It posits that consciousness corresponds to the amount of integrated information ($\Phi$). High $\Phi$ = rich consciousness. Low $\Phi$ = minimal consciousness.

  3.  **Evaluate the User's Intuitions against Principles:**

      *   *Intuition 1: Rock = No care.*
          *   Consistent with: Threshold view (rock has $\Phi \approx 0$), Valence view (rock has no capacity for suffering).
