prompt: |-
  i work in site reliability at a mid-size company and a lot of my week is incident reviews. Almost every postmortem we write ends up naming something nobody did as the root cause: nobody rotated a cert, nobody updated the runbook, nobody put an alert on that queue. I've also messed around with causal DAGs and the do() notation enough to be dangerous — I can read a graph, I know the difference between conditioning on X and intervening on X, but that's about where it stops.

  I found out recently that philosophers argue about whether an omission — a thing that didn't happen — can be a cause at all, and that some of them say no, because causes are events and there's no event of not watering the plant. I'd like that whole debate restated as honestly as possible in the only vocabulary I'm fluent in: nodes, edges, do(), counterfactuals over a structural model, config defaults, alerts that fire and alerts that don't.

  The cases I want you to run through it, because my team argues about them every week: (1) a missed step — the runbook says rotate the cert monthly, nobody did, cert expired, site down; (2) a default nobody chose — the load balancer timeout ships as 60s, no one ever set it, and that's why the retry storm cascaded; (3) an unsent signal — no alarm existed on queue depth, so nobody knew, so nothing got done; (4) the one that feels weirdest — the bad deploy didn't go out because the release manager was on a flight and couldn't approve it, so somebody's not-doing-something seems to be what saved us.

  Then the residue report: which of these go into a DAG plus do() cleanly, which only go in if you cheat (inventing a node for something that didn't happen, or treating a shipping default as if someone had chosen it), and which won't go in at all. My hunch is that my framework can't even say "that's an omission" unless something outside the graph tells it what was supposed to happen, which is why we keep dragging runbooks into postmortems. If that's right — is it a bug in the toolkit, or is the philosophers' problem with omissions actually a problem about norms wearing a costume? Is there anything left over that the graph still can't say even after I bolt on a "what the runbook said" node? Also: our review template says only name causes the team could have acted on. That rule feels seperate from the causal question but I can't say why — where does it sit relative to what they're arguing about?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Site Reliability Engineer (SRE) at a mid-size company.
      *   **Expertise:** Fluent in SRE terminology (incidents, postmortems, runbooks, alerts, configs, deploys) and has a working knowledge of Causal Inference (DAGs, $do()$, counterfactuals, Structural Causal Models - SCMs).
      *   **Problem:** Postmortems constantly identify "omissions" (things nobody did) as root causes. Philosophers debate whether omissions are causes. The user wants this debate translated into their native vocabulary (graphs, interventions, SCMs).
      *   **Specific Cases to Analyze:**
          1.  Missed step (cert rotation).
          2.  Default nobody chose (LB timeout).
          3.  Unsent signal (missing alert).
          4.  Preventive omission (release manager on flight stopped bad deploy).
      *   **Residue Report:** Which fit in DAG/$do()$ cleanly? Which require "cheating"? Which don't fit?
      *   **Core Question:** Is the inability to model omissions a bug in the toolkit, or is it about norms?
      *   **Secondary Question:** Where does the "actionability" rule (only name causes the team could have acted on) fit relative to the causal question?

  2.  **Deconstruct the Philosophical Debate (into SRE terms):**
      *   *Philosophical View:* Causes are events/processes. "Not watering" isn't an event; it's the absence of one. Therefore, not a cause.
      *   *SRE/SCM View:* Causality is about dependency. If $Y$ (site up) depends on $X$ (cert valid), and $X=0$ causes $Y=0$, then $X$ is a cause. Whether $X=0$ is an "action" or an "inaction" is semantic, not structural.
      *   *Translation:* The philosophical debate is about *ontology* (what exists). The SCM debate is about *dependency* (what affects what).

  3.  **Analyze the Four Cases using SCMs:**

      *   **Case 1: Missed Step (Cert Rotation)**
          *   *Nodes:* `Rotation_Task` (Boolean: Done/Not Done), `Cert_Valid` (Boolean), `Site_Up` (Boolean).
          *   *Mechanism:* `Cert_Valid = Rotation_Task AND (Time < Expiry)`. `Site_Up = Cert_Valid`.
          *   *Intervention:* $do(Rotation\_Task = 1)$ leads to $Site\_Up = 1$.
          *   *Verdict:* Fits cleanly. The "omission" is just $Rotation\_Task = 0$.

      *   **Case 2: Default Nobody Chose (LB Timeout)**
          *   *Nodes:* `Timeout_Config` (Integer), `Retry_Storm` (Boolean), `Cascade` (Boolean).
          *   *Mechanism:* `Timeout_Config` defaults to 60 if `Human_Input` is null. `Cascade = f(Timeout_Config, Load)`.
          *   *Nuance:* Is the cause the *value* 60, or the *lack of input*?
          *   *Verdict:* Fits, but requires modeling the "Default Mechanism" as a node. The cause is the value, not the absence of change.

      *   **Case 3: Unsent Signal (Missing Alert)**
          *   *Nodes:* `Queue_Depth` (Integer), `Alert_Rule_Exists` (Boolean), `Alert_Fires` (Boolean), `Human_Response` (Boolean), `Site_Up` (Boolean).
          *   *Mechanism:* `Alert_Fires = Alert_Rule_Exists AND (Queue_Depth > Threshold)`. `Human_Response = f(Alert_Fires)`.
          *   *Verdict:* Fits. `Alert_Rule_Exists = 0` is a state variable. It's not a "non-event," it's a configuration state.

      *   **Case 4: Preventive Omission (Release Manager on Flight)**
          *   *Nodes:* `Deploy_Request` (Boolean), `Approval` (Boolean), `Bad_Code_Merged` (Boolean), `Site_Up` (Boolean).
          *   *Mechanism:* `Approval = f(Manager_Availability)`. `Deploy_Request = Deploy_Request AND Approval`.
          *   *Verdict:* Fits. This is "Preventive Causation." $do(Manager\_Availability = 0)$ prevented $Site\_Down$.

  4.  **Drafting the Residue Report (The "Cheating" Analysis):**
      *   *Clean Fits:* Cases 1 & 4. They are binary states in the graph.
      *   *Requires "Cheating" (Reification):* Case 2 & 3. Why? Because "Missing Alert" isn't a thing. You have to create a node `Alert_Config_Present`. You are turning a null value into a node.
      *   *The "Norm" Problem:* The graph doesn't know what *should* have happened. It only knows what *did*. To call $X=0$ a "failure," you need an external variable `Expected_X`.
      *   *Conclusion:* The graph handles *counterfactual dependence* perfectly. It handles *blame/norms* poorly without external annotation.

  5.  **Addressing the "Norms vs. Toolkit" Question:**
      *   The philosophers are arguing about *metaphysics* (is nothing something?).
      *   The SREs are arguing about *accountability* (who should have done something?).
      *   The SCM is neutral. It says "If X had been 1, Y would be 1."
      *   The "Bug" is expecting the graph to contain normative data (runbooks). The graph is descriptive. The runbook is normative.
      *   *Insight:* The "omission" problem is actually a "deviation from expected model" problem.

  6.  **Addressing the "Actionability" Rule:**
      *   Causal question: "Did X affect Y?"
      *   Actionability question: "Can we change X in the future?"
      *   Relation: Actionability is a constraint on the *intervention set*. You can calculate the causal effect of "Gravity" on "Fall," but you can't $do(Gravity = 0)$.
      *   In SRE terms: "Actionability" filters the DAG for *controllable* nodes. It's a policy layer on top of the causal layer.

  7.  **Refining the Tone:**
      *   Needs to be peer-to-peer. No condescension.
      *   Use the user's vocabulary (DAGs, do(), SCMs, nodes, edges).
      *   Be honest about the limitations of the framework.
      *   Acknowledge the philosophical depth without getting bogged down in it.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe Case 2 is just a parameter.
      *   *Correction:* No, in SCM, parameters are structural. If the default is structural, changing it requires changing the structure or adding a node for "Config Override." I need to be precise about whether the default is a node or a parameter. Let's treat it as a node `Config_Value` determined by `Human_Input` OR `Default`.
      *   *Check Case 4:* Make sure to distinguish between "causing safety" vs "preventing harm." In SCM, it's just $Y=1$ instead of $Y=0$.
      *   *Philosophical translation:* Ensure I don't just say "philosophers are wrong." Say "Philosophers care about events; SCMs care about dependencies."

  9.  **Final Polish:** Organize into the requested sections: The Translation, The Four Cases, The Residue Report, The Norms Question, The Actionability Rule. (Proceed to generate output based on this structure).

  *(Self-Correction on the "Cheating" aspect)*: I need to be careful. Is creating a node for "Alert Exists" cheating? In SCM, you model the data generating process. If the absence of an alert is a state of the system, it's a valid node. The "cheat" is implying that the *absence* is an interventionable event in the same way a *presence* is. Actually, the real "cheat" is assuming the *default* is a choice. I will clarify this distinction.

  *(Refining the "Norms" argument)*: The user suspects the problem is norms wearing a costume. I should validate this strongly. The graph describes reality. The runbook describes a *possible* reality we agreed to prefer. The clash is between $P(World)$ and $Utility(World)$.

  *(Refining Actionability)*: Actionability is about the *feasibility of do()*. Causality is about the *effect of do()*. They are distinct.

  10. **Final Output Generation** (matching the thought process above).
answer: |-
  This is a translation of the metaphysical debate into Structural Causal Models (SCM).

  The philosophers are arguing about **ontology** (what kinds of things exist in the universe). They say causes must be *events* (energy transfers, collisions), and an omission is not an event.
  You are arguing about **dependency** (what variables determine other variables). In an SCM, a cause is simply a variable $X$ such that $do(X=x')$ changes the distribution of $Y$.

  In your vocabulary, the philosophical debate dissolves. An SCM doesn't care if $X=0$ represents "a bomb exploded" or "a bomb did not explode." It only cares that $Y$ is a function of $X$. However, your postmortem pain isn't about dependency; it's about **deviation from a normative model**.

  Here is the breakdown of your four cases, the residue report on where the graph breaks, and the location of the "actionability" rule.

  ---

  ### Part 1: The Four Cases in SCM

  In all cases, we assume a Structural Causal Model $M$ with variables $V$ and structural equations $F$. We are looking for a variable $X$ where the counterfactual $Y_{X=1} \neq Y_{X=0}$ (using 1 for "working/intervened" and 0 for "failed/omitted").

  #### Case 1: The Missed Step (Cert Rotation)
  *   **The Graph:**
      *   $R$: Rotation Task Executed (0/1)
      *   $C$: Cert Valid (0/1)
      *   $S$: Site Up (0/1)
      *   Structure: $C = R \land (\text{Time} < \text{Expiry})$, $S = C$.
  *   **The Analysis:**
      *   Fact: $R=0, C=0, S=0$.
      *   Counterfactual: $do(R=1) \implies C=1 \implies S=1$.
      *   **Verdict:** **Clean Fit.**
      *   **Why:** "Not rotating" is just the state $R=0$. The graph doesn't see an omission; it sees a binary switch that was left in the off position. The causal path is explicit.

  #### Case 2: The Default Nobody Chose (LB Timeout)
  *   **The Graph:**
      *   $H$: Human Config Input (Null or Value)
      *   $D$: Default Mechanism (Returns 60 if $H$ is Null)
      *   $T$: Timeout Value (Integer)
      *   $L$: Load/Retry Storm (Integer)
      *   $C$: Cascade (0/1)
      *   Structure: $T = \text{coalesce}(H, D)$, $C = f(T, L)$.
  *   **The Analysis:**
      *   Fact: $H=\text{Null}, T=60, C=1$.
      *   Counterfactual: $do(H=30) \implies T=30 \implies C=0$.
      *   **Verdict:** **Requires Reification.**
      *   **Why:** You have to model the "Default" as a active mechanism $D$. Philosophically, the default isn't an event; it's the background state. To make this a cause, you have to treat the *absence of human input* as a specific input value that triggers the default node. It works mathematically, but it feels like you're modeling the vacuum as a pump.

  #### Case 3: The Unsent Signal (Missing Alert)
  *   **The Graph:**
      *   $A$: Alert Rule Configured (0/1)
      *   $Q$: Queue Depth (Integer)
      *   $F$: Alert Fires (0/1)
      *   $R$: Human Response (0/1)
      *   $S$: Site Up (0/1)
      *   Structure: $F = A \land (Q > \text{Threshold})$, $R = g(F)$, $S = h(R, Q)$.
  *   **The Analysis:**
      *   Fact: $A=0, F=0, R=0, S=0$ (eventually).
      *   Counterfactual: $do(A=1) \implies F=1 \implies R=1 \implies S=1$.
      *   **Verdict:** **Clean Fit (with a caveat).**
      *   **Why:** Similar to Case 1. $A$ is a configuration state. The "omission" is just $A=0$. The caveat is that $A=0$ is a *standing condition*, not a *triggering event*. The graph handles standing conditions fine, but humans struggle to view them as causes compared to a spike in $Q$.

  #### Case 4: The Preventive Omission (Release Manager on Flight)
  *   **The Graph:**
      *   $B$: Bad Code Ready (0/1)
      *   $M$: Manager Available (0/1)
      *   $D$: Deploy Occurs (0/1)
      *   $S$: Site Up (0/1)
      *   Structure: $D = B \land M$, $S = \neg (D \land \text{BugTriggers})$.
  *   **The Analysis:**
      *   Fact: $B=1, M=0, D=0, S=1$.
      *   Counterfactual: $do(M=1) \implies D=1 \implies S=0$.
      *   **Verdict:** **Clean Fit (Preventive Causation).**
      *   **Why:** This is standard preventive causation. $M=0$ is a cause of $S=1$. In SCM, there is no distinction between "causing health" and "preventing sickness." It's just $Y=1$ vs $Y=0$.

  ---

  ### Part 2: The Residue Report

  Here is where your toolkit holds, where it leaks, and where it breaks.

  | Case | Fits in DAG + $do()$? | The "Cheat" Required |
  | :--- | :--- | :--- |
  | **1. Missed Step** | **Yes.** | None. $R$ is a standard node. |
  | **2. Default** | **Yes, but...** | You must model the *Default* as a node or function, not just a parameter. You are treating "inertia" as a force. |
  | **3. Missing Alert** | **Yes.** | You must treat "Config Absence" as a state ($A=0$), not a lack of state. |
  | **4. Preventive** | **Yes.** | None. Causality is symmetric regarding prevention/production. |

  **The Real Breakage:**
  Your framework cannot distinguish between a **bug** and a **feature** without external metadata.
  In Case 2 (Defaults), the graph sees $T=60$ causing $C=1$. It does not know that $T=60$ was *lazy* rather than *designed*.
  In Case 3 (Missing Alert), the graph sees $A=0$. It does not know that $A$ *should have been* 1.

  To say "This omission is a root cause," you are implicitly comparing the **Actual Model** ($M_{actual}$) against a **Normative Model** ($M_{should}$).
  *   $M_{actual}$: $A=0$.
  *   $M_{should}$: $A=1$ (per Runbook/Best Practice).
  *   **Root Cause:** The divergence $\Delta = M_{should} - M_{actual}$.

  The graph cannot compute $\Delta$. The graph only knows $M_{actual}$. This is why you keep dragging runbooks into postmortems. The runbook is not data; it is a **constraint set** or a **prior** on what the graph *ought* to look like.

  **Is this a bug in the toolkit?**
  No. It is a category error. Causal inference describes *what is*. Postmortems prescribe *what should have been*.
  The philosophers' problem with omissions ("there is no event of not watering") is actually a problem about **norms wearing a costume**.
  *   If I don't water my plant, it dies. (Causal dependency: Water $\to$ Life).
  *   If I don't water your plant, it dies. (Causal dependency: Same).
  *   Why am I blamed in case 1 and not case 2? Because in case 1, $Norm(Water) = 1$. In case 2, $Norm(Water) = 0$.

  The graph sees the physics. The postmortem sees the contract. When you name an omission as a root cause, you are not making a causal claim; you are making a **contractual claim** wrapped in causal syntax.

  **Is there anything left over?**
  Yes. **Salience.**
  Even if you bolt on a `Runbook_Compliance` node, the graph treats a missed cert rotation ($R=0$) and a missed lunch break ($L=0$) identically if both are required for $S=1$.
  The graph cannot tell you which $do()$ interventions are *socially expected*. It requires a utility function $U(World)$ that penalizes deviations from the runbook higher than deviations from comfort. That utility function lives in your team's culture, not the DAG.

  ---

  ### Part 3: The Actionability Rule

  > *Our review template says only name causes the team could have acted on.*

  This rule sits **outside** the causal model. It is a filter on the **Intervention Set**.

  In causal inference, we can calculate the Average Causal Effect (ACE) of *any* variable.
  *   $ACE(\text{Gravity}, \text{Fall})$ is high.
  *   $ACE(\text{Cert Rotation}, \text{Site Up})$ is high.

  But the set of valid interventions $\mathcal{I}$ is constrained by **agency**.
  *   $\text{Gravity} \notin \mathcal{I}_{SRE}$.
  *   $\text{Cert Rotation} \in \mathcal{I}_{SRE}$.

  **Why it feels separate:**
  Because it is. Causality is about **leverage**. Actionability is about **access**.
  *   **Causal Question:** "If we changed X, would Y change?" (Physics)
  *   **Actionability Question:** "Are we allowed to touch X?" (Policy/Role)

  When your template says "only name actionable causes," it is instructing you to **project the causal graph onto the subspace of variables owned by the team.**
  If you identify "ISP Routing" as a cause, it is causally valid but actionably null. Including it violates the template not because it isn't a cause, but because $do(\text{ISP\_Routing})$ is not a valid operation for your team.

  **The Conflict:**
  Sometimes the only *causal* fix is *actionably* impossible (e.g., "Rewrite the legacy library").
  Sometimes the only *actionable* fix is *causally* weak (e.g., "Add more logging").
  Your template forces you to ignore the true causal drivers if they are outside your boundary. This creates the "Omission Bias."
  *   It is easier to $do(\text{Add Alert})$ than $do(\text{Refactor Architecture})$.
  *   So the graph gets populated with "Missing Alert" nodes (omissions) because they are in $\mathcal{I}_{SRE}$, even if the structural cause is "Fragile Architecture."

  ### Summary for your Team

  1.  **Omissions are Causes:** In SCM, $X=0$ is a state just like $X=1$. If $Y$ depends on $X$, the absence of $X$ is a cause. The philosophers are arguing about events; you are arguing about dependencies. You win this one.
  2.  **The Runbook is a Norm, not a Node:** The graph tells you what broke. The runbook tells you what was *supposed* to be there. Calling an omission a "Root Cause" is a judgment that the system state violated the normative model.
  3.  **Actionability is a Filter:** It restricts which nodes you are allowed to propose interventions on. It does not change the causal structure, but it biases your postmortems toward "things we can easily toggle" (alerts, configs) rather than "things that are hard to change" (architecture, technical debt).
  4.  **The "Cheat":** When you model a default or a missing alert, you are reifying "nothing" into "a node with value 0." This is mathematically valid but ontologically weird. Accept the weirdness. It's the price of modeling systems engineering with math.

  **Recommendation:**
  Add a `Normative_Expectation` attribute to your nodes in your incident database.
  *   Node: `Cert_Rotation`
  *   State: `0` (Did not happen)
  *   Expectation: `1` (Should have happened)
  *   **Root Cause Flag:** `True` if `State != Expectation` AND `State` caused `Incident`.

  This separates the **Causal Engine** (the DAG) from the **Blame Engine** (the Expectation). It stops you from arguing about whether "nothing" can cause "something," and lets you argue about whether "nothing" was *allowed* to be there.
