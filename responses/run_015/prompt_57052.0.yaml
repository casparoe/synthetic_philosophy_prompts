      *   *Refining the Verdict:* The analogy breaks. Does that mean numbers don't count? No. It means the *reason* numbers count isn't because of the finger logic. Utilitarians have other arguments (impartiality). Prioritarians have other arguments. The analogy breaking is a stalemate, not a checkmate.

      *   *Refining the Better Analogy:* **"The Lifeboat with Two Rafts."**
