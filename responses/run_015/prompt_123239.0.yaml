answer: |-
  This is a classic P.F. Strawson problem set ("Freedom and Resentment"), and your roommate is doing a surprisingly good job of tracking the distinction between **exemptions** (you're not in the moral game) and **excuses** (you're in the game, but this specific move doesn't count as ill will).

  Here is the breakdown of her reasoning, the predictions for the new cases, and the specific "decider" case that will reveal which rule she is actually running.

  ### 1. The Diagnosis: Which Rule Is She Running?

  She is **not** running "Conscious Control in the Moment."
  *   **Proof:** The texting driver. At the moment of impact, the driver isn't consciously choosing to hit the cyclist. If momentary control were the rule, she wouldn't resent him. She does resent him because she is applying a **Tracing Principle**: you are responsible for the lapse because you culpably chose the risk earlier.

  She is **not** primarily running "Emotional Architecture."
  *   **Proof:** The corporation and the depressed friend. She distinguishes between being "mad" at a corporation and "resenting" them. This implies resentment requires a specific kind of *will*, not just a complex system. More importantly, the depressed friend has a full human emotional architecture but is excused. This shows the verdict hinges on the **Quality of Will** (did they show poor regard?), not just the hardware of their mind.

  **Her Actual Rule:** **Moral Participation + Quality of Will (with Tracing).**
  To be a target of resentment, you must be a member of the moral community (capable of understanding moral demands) *and* your action (or prior culpable choice) must express ill will or insufficient regard for others.

  ### 2. Predictions on the New Cases

  Based on that rule, here is how she should verdict the new scenarios:

  **Case A: The Dissociative Person (Refused Meds)**
  *   **Verdict:** **Resentment is Fair.**
  *   **Reasoning:** This is structurally identical to the Texting Driver. Even if they lacked conscious control *during* the episode (like the sleepwalker), they exercised culpable control *before* the episode by refusing meds while knowing the danger. The lack of regard for others' safety is traced back to the decision to stop treatment. They are a moral participant who chose to disable their own safeguards.

  **Case B: The Apologetic AI**
  *   **Verdict:** **No Genuine Resentment.**
  *   **Reasoning:** This matches the Corporation and the Chimp. Even if it simulates guilt, it lacks the "will to speak of." It cannot participate in a moral relationship because it cannot *care* about the moral demand. You can be frustrated with it (objective attitude), but you cannot resent it (participant attitude). The "no continuous inner life" clause confirms it fails the participation threshold.

  **Case C: The Moral Cyborg (Neural Implant)**
  *   **Verdict:** **Resentment is Fair (if they turned it off).**
  *   **Reasoning:** If they turn the implant off, they are voluntarily suspending their moral inhibitions. This is an expression of poor regard (ill will). If the implant glitches while turned *on*, it's like the sleepwalker (no resentment). But the prompt implies they "sometimes do" turn it off. That choice makes them a culpable participant.

  ### 3. The Real Decider Case

  You mentioned there are two rules that cover her current list but split on harder cases. The tension is between **Quality of Will** (Choice/Agency) and **Emotional Architecture** (Capacity for Reciprocity).

  Her current list doesn't separate these because every human on her list (driver, friend, kid) has the *capacity* for moral emotions, and every non-human (chimp, corp) lacks *agency*. To split the rules, you need a being that has **Agency/Will** but lacks **Moral Emotional Architecture**.

  **The Decider Case: The Rational Psychopath**
  > *A human who understands moral rules perfectly, has full conscious control, and chooses to harm you for personal gain. However, they literally lack the neural capacity to feel guilt, empathy, or the sting of resentment. They know what they did was "wrong" by the rulebook, but it means nothing to them emotionally.*

  **Why this splits the rules:**

  1.  **If she says "Resentment is Fair":**
      *   She is running **Moral Participant/Quality of Will**.
      *   *Reasoning:* They made a choice. They understood the demand. They chose to violate it. The fact that they don't *feel* bad doesn't matter; they are still agents who showed ill will. (This is the "Choice" view).

  2.  **If she says "No Resentment":**
      *   She is running **Emotional Architecture/Reciprocity**.
      *   *Reasoning:* Resentment is a communicative act meant to call someone to account. If they *cannot* feel the weight of that account (no guilt/empathy), the moral conversation is impossible. Therefore, we must take the "objective attitude" toward them (manage them like a dangerous object) rather than the "participant attitude." (This is the strict Strawsonian view).

  **Why this matters:**
  The Texting Driver case proved she accepts **Tracing** (past choices matter). The Dissociative case will confirm if she applies Tracing to mental states. But the **Psychopath** case is the only one that tells you if she thinks resentment is about **punishing bad choices** or **sustaining a moral relationship**.

  If she resents the Psychopath, she's a retributivist at heart. If she doesn't, she's a pure Strawsonian relationalist. That's the split.
