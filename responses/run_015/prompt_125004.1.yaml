prompt: |-
  hi — i'm a phd student in moral philosophy and i'm stuck on something for my thesis. in my seminar everyone keeps using the analogy that aggregating welfare across separate people is basically like one rational agent distributing goods across different stages of her own life. they use it specifically to defend totalist positions in population ethics — like, adding a happy life is no different from extending your own lifespan by a happy period — but then the separateness of persons objection comes in and says people arent time-slices of one super-agent.

  can you audit this analogy for me? i need a correspondance table — what plays the role of the agent, the time-stages, the discount rate, the identitiy conditions — then where it breaks, especially once you factor in that the 'future selves' in the social case dont actually share consciousness or memory. also, does the analogy smuggle in anything about personal identitiy over time that total utilitarianism needs but cant defend? and finally, does the conclusion — that aggregation is unproblematic — survive once the disanologies are on the table, or was the analogy carrying it the whole time?

  please write in british english (colour, centre, analyse, etc.). also i dont need a bibliography or citations — just the conceptual mapping.
