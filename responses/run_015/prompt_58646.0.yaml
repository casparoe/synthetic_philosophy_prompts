answer: |-
  What you have noticed is a genuine and significant philosophical problem, and you are quite right to feel that standard definitions of 'memory' or 'thinking' do not quite cover it. In the philosophy of mind and cognitive science, this is known as **The Extended Mind Thesis (EMT)**.

  It was most famously proposed by the philosophers Andy Clark and David Chalmers in their 1998 paper *The Extended Mind*. Their central claim is that the machinery of cognition is not confined to the skull. Under certain conditions, tools, notebooks, and even other people can become literal parts of your cognitive system, rather than merely aids to it.

  Below is an explanation of the thesis, its neighbouring ideas, and an analysis of your three cases using the criteria philosophers use to draw the boundary between 'using a tool' and 'thinking with a tool'.

  ### 1. The Core Idea: The Parity Principle

  To understand EMT, you must first understand the argument used to support it, which Clark and Chalmers call the **Parity Principle**.

  They ask us to imagine two people trying to find a museum.
  *   **Inga** hears the address, thinks for a moment, recalls it from her biological memory, and walks there.
  *   **Otto** has Alzheimer's disease. He carries a notebook. He hears the address, writes it in the notebook, checks the notebook, and walks there.

  The traditional view is that Inga is remembering, but Otto is just using a tool. Clark and Chalmers argue that if the notebook functions for Otto exactly as biological memory functions for Inga (it is reliable, always available, and trusted automatically), then there is no relevant difference between the two. Therefore, the notebook is part of Otto's mind. To deny this is 'bio-chauvinism' – unfairly privileging brain tissue over paper or silicon.

  ### 2. Neighbouring Ideas

  It is important to distinguish EMT from similar concepts, as this helps define its boundaries.

  *   **Transactive Memory (Psychology):** This is specific to your second case. Proposed by Daniel Wegner, it describes how groups (couples, teams) encode, store, and retrieve knowledge collectively. You know *who* knows *what*. EMT is the philosophical claim that this group functions as a single cognitive unit; Transactive Memory is the psychological description of how they coordinate.
  *   **Embodied Cognition:** This suggests that thinking is shaped by the physical body (e.g., we understand 'grasping an idea' because we have hands that grasp). EMT goes further, suggesting thinking extends *beyond* the body into the environment.
  *   **Instrumentalism:** This is the opposing view. It holds that tools are merely causal aids. A calculator helps you think, but it is no more part of your mind than a pair of glasses is part of your eyes. Instrumentalists argue that cognition stops at the skin.

  ### 3. Analysing Your Three Cases

  Here is how EMT handles your specific observations, and where the boundaries lie.

  #### Case 1: The Phone and Bus Routes
  *   **Verdict:** Strong fit for Extended Mind.
  *   **Analysis:** You describe consulting the phone 'automatically without checking'. This meets the criteria for EMT. The information is not just stored on the phone; the phone is acting as your external hard drive.
  *   **The Battery Problem:** When the battery dies, you feel you have 'forgotten' something. An Instrumentalist would say you haven't forgotten; you've just lost your book. However, EMT validates your feeling: if the phone is part of your memory system, then a dead battery is functionally identical to a temporary lesion in your brain. The system has been damaged.
  *   **The Boundary (Trust vs. Verification):** You mentioned you do not check the information. This is crucial. If you looked at the bus route on your phone and then cross-referenced it with a timetable on the wall to be sure, the phone would revert to being a mere tool. For the phone to be part of your mind, your trust in it must be as implicit as your trust in your own recall.

  #### Case 2: The Lab Partner
  *   **Verdict:** Fits Transactive Memory (a social form of Extended Mind).
  *   **Analysis:** Here, the 'mind' is distributed across two brains. Neither of you possesses the full procedure, but the *pair* does.
  *   **The Boundary (Integration):** For this to count as extended cognition rather than just cooperation, there must be a seamless flow. You noted you 'divide things up without planning to'. This suggests a high level of coupling. If you had to stop and ask, 'What do you know again?', the system slows down and becomes two individuals communicating. When you function as a single unit where your partner's knowledge is as accessible to you as your own, the boundary of the cognitive system expands to include them.
  *   **Risk:** The vulnerability here is similar to the phone. If your partner is absent, your cognitive capacity drops. You are not just lacking help; you are cognitively impaired relative to the task.

  #### Case 3: The Calculator and Maths
  *   **Verdict:** Partial fit (Cognitive Offloading).
  *   **Analysis:** This is the most complex case. You retain the 'structure' (the logic) but offload the 'arithmetic' (the processing). Clark refers to this as a 'wide computational system'.
  *   **The Boundary (Understanding vs. Processing):** If you cannot report the intermediate numbers, the calculator is not just displaying information (like the phone); it is performing the cognitive operation of calculation. However, a critic might argue that *understanding* the maths is the cognition, and the arithmetic is just mechanical grind.
  *   **Refinement:** EMT would argue that if the arithmetic is too complex for your biological brain to hold, and you use the calculator to maintain the thread of the solution, the calculator is sustaining your thought process. Without it, the thought collapses. Therefore, it is part of the thinking loop.

  ### 4. Drawing the Boundaries: When is a Tool Part of the Mind?

  You asked specifically where to draw the line between being helped by a tool and the tool counting as part of the thinking. Clark and Chalmers propose three main criteria (often called the 'glue and trust' conditions). For an external resource to count as part of your mind, it must be:

  1.  **Reliably Available:** It must be there when you need it (the phone must be charged; the partner must be present).
  2.  **Automatically Trusted:** You must not critically scrutinise the output every time (you don't double-check the bus route; you don't re-calculate the calculator's sum).
  3.  **Consciously Endorsed:** The information must be there because you put it there (or you trust the source implicitly), and you accept it as your own belief.

  **Applying the Boundaries to your scenarios:**

  *   **When the phone is offline:** It fails criterion 1 (Availability). The extended mind system is broken. You revert to being a 'brain-bound' thinker, which is why you feel impaired.
  *   **When you double-check:** If you look at the phone and think, 'Is this right? Let me check a map,' you have moved from *trust* to *verification*. The phone is now an external source you are evaluating, not a part of the memory system itself. It becomes a tool, not a mind.
  *   **When work is split between people:** For the partner to count as part of your mind, you must have 'common ground'. You need to share enough context that you can anticipate what they know. If you have to explain everything from scratch each time, they are a tool. If you can rely on them to hold specific concepts without explanation (like your safety thresholds), they are part of the system.

  ### 5. A Proposed Definition for Your Project

  Since you are writing an enrichment project, you may wish to use a precise definition. While EMT is the established name, you might define the phenomenon you are studying as **Integrated Cognitive Systems**.

  > **Definition:** An Integrated Cognitive System exists when an agent (a student) and an external resource (a device or person) are coupled so tightly that the resource functions with the same reliability, accessibility, and trust as internal biological processes. In this state, removing the resource causes a functional loss of cognitive capacity, not merely a loss of convenience.

  **How this handles your differences:**
  *   It distinguishes the **Phone** (storage extension) from the **Calculator** (processing extension).
  *   It distinguishes **Individual Extension** (phone/calc) from **Social Extension** (partner).
  *   It identifies the **failure state**: When the integration breaks (dead battery, partner absent, loss of trust), the system reverts to individual cognition, revealing how much work was being done externally.

  ### Summary for Your Project

  You have identified that cognition is not a solitary event inside the head, but a loop that often runs through the world.
  1.  **Philosophical Label:** The Extended Mind Thesis (Clark & Chalmers).
  2.  **Psychological Label:** Transactive Memory (for the partner case).
  3.  **Key Distinction:** Tools become part of the mind when they are trusted automatically and are reliably available. If you have to verify the tool, it remains separate from you.
  4.  **Implication:** Studying is not just about filling your brain; it is about building a reliable system of external resources that you can trust as much as your own neurons.

  This is a sophisticated insight for a Year 12 student. If you reference Clark and Chalmers' *The Extended Mind* and Wegner's work on Transactive Memory, you will have a solid theoretical foundation for your project.
