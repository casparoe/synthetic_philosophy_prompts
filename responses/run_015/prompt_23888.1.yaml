prompt: |-
  I teach an upper-level epistemology seminar, about 18 students, one 75 minute session. I want an in-class activity that makes them actually feel the force of the problem of moral testimony, not just hear a lecture about it. The thing I keep failing to convey is the weird friction between "you're totally justified in deferring to a moral expert" and "but then do you really have a moral belief of your own, or are you just following orders?" I want the rules and incentives set up so they run into that tension themselves before I name it. One constraint I care about: the "moral expert" they defer to should turn out to be just another student who read a rulebook the night before, so the class also has to grapple with how much to trust someone whose moral credentials are opaque. Give me the full runnable design: the exact moral scenario (pick a dilemma where reasonable people genuinely split, so the expert's verdict is contestable), the roles, a payoff scheme that doesn't need real money, a minute-by-minute timeline for the 75 minutes, and a debrief that maps specific moments in the activity onto the philisophical problem. Be honest about which feature of moral testimony a classroom game just can't reproduce and what I'd have to supply myself. And end with a line starting "Verdict:" that states in one sentence the single core tension the whole activity is built to make them feel.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level epistemology seminar, ~18 students, 75 minutes.
      *   **Goal:** Create an in-class activity to make students *feel* the problem of moral testimony (specifically the tension between justified deference and lack of genuine moral understanding/autonomy).
      *   **Key Constraint:** The "moral expert" must be revealed as just another student who read a rulebook (opaque credentials).
      *   **Requirements:** Full runnable design (scenario, roles, payoff scheme, timeline, debrief), honesty about limitations, and a specific closing line ("Verdict: ...").
      *   **Core Tension:** Justified deference vs. authentic moral belief ("following orders").

  2.  **Deconstruct the Philosophical Problem (Moral Testimony):**
      *   *Pessimists (e.g., Hills, McGrath):* Relying on testimony prevents moral understanding/autonomy. You can't be virtuous if you just do what you're told.
      *   *Optimists (e.g., Jones, Lackey):* Testimony is a valid source of justification, just like in science or geography.
      *   *The "Friction":* It feels *different* to believe "2+2=4" based on testimony vs. "abortion is wrong" based on testimony. Why?
      *   *The Twist:* The expert isn't actually an expert. This adds a layer of *epistemic luck* vs. *moral responsibility*.

  3.  **Designing the Activity:**
      *   **Scenario:** Needs to be high-stakes enough to matter, but low-stakes enough for a classroom. Needs genuine disagreement.
          *   *Idea 1:* Trolley problem. (Too cliché, too abstract).
          *   *Idea 2:* Plagiarism policy. (Too institutional).
          *   *Idea 3:* Allocation of a limited resource (e.g., a scholarship fund or donation). (Good, feels real).
          *   *Selection:* **The "Community Grant" Dilemma.** Two competing applicants for a single departmental fund. One is a struggling single parent (need-based), one is a high-achieving student from a wealthy background working on a breakthrough project (merit-based). Reasonable people split on need vs. merit.
      *   **Roles:**
          *   *The Committee (12 students):* Must vote on who gets the money.
          *   *The Advisor (1 student):* The "Expert." Reads the "Ethical Framework" (rulebook) beforehand.
          *   *The Observers/Auditors (5 students):* Watch the process, take notes on *why* people vote.
      *   **Payoff Scheme:** Needs to incentivize *correctness* but also *understanding*.
          *   *Currency:* "Epistemic Cred" (points towards participation grade or just bragging rights).
          *   *Mechanism:* If the Committee picks the "Right" candidate (determined by the Advisor's rulebook), everyone gets points. *However*, if a student votes with the Advisor but cannot explain *why* when challenged, they lose points. This forces the tension: Do I trust the Advisor to win, or do I trust my own judgment to be able to defend it?
      *   **The Twist:** The Advisor's rulebook is arbitrary or utilitarian in a way that clashes with common intuition. The Advisor is revealed later as just a peer.

  4.  **Drafting the Timeline (75 Minutes):**
      *   0-10: Setup & Role Assignment.
      *   10-20: Private Deliberation (Committee reads cases).
      *   20-35: The Testimony Phase (Advisor gives verdict).
      *   35-50: The Vote & Justification (The friction point).
      *   50-60: The Reveal (Advisor is a peer).
      *   60-75: Debrief & Philosophical Mapping.

  5.  **Refining the "Friction" Mechanism:**
      *   To make them *feel* the problem, the incentive structure needs to punish blind following *after the fact*.
      *   *Modification:* The "Audit." After the vote, the Auditors ask random voters: "Why did you vote that way?" If the answer is "Because the Advisor said so," they get penalized (simulating the lack of moral worth/understanding). If they vote against the Advisor and are wrong, they get penalized for being incorrect.
      *   *Wait, better:* Make the "Expert" advice available, but make the *grade* depend on independent justification.
      *   *Let's simplify for flow:*
          1.  Committee votes secretly.
          2.  Advisor gives recommendation.
          3.  Committee can change vote.
          4.  **Crucial Step:** To get "credit," you must write a 1-sentence justification.
          5.  **Reveal:** The Advisor used a utilitarian calculus the students didn't see.
          6.  **Discussion:** Did you adopt the belief or just the action?

      *   *Revised Payoff:* "Integrity Points."
          *   Group Goal: Maximize utility (defined by Advisor's hidden rubric).
          *   Individual Goal: Be able to articulate the reason.
          *   Tension: If you just copy the Advisor, you help the group but fail the individual goal (if probed). If you ignore the Advisor, you might hurt the group.

  6.  **Developing the "Expert" Constraint:**
      *   The prompt requires the expert to be a student who read a rulebook.
      *   I need to give the "Expert" a specific script that sounds authoritative but is ultimately just a set of rules.
      *   I need to ensure the class knows the Expert *might* be arbitrary.

  7.  **Addressing the Limitations:**
      *   A game can't reproduce the *emotional weight* of real moral wrongdoing.
      *   It can't reproduce the *long-term character formation* aspect (Hills' objection is about moral understanding over time).
      *   The instructor has to bridge the gap between "winning a game" and "moral worth."

  8.  **Finalizing the Design Details:**
      *   **Scenario:** "The Emergency Fund." Applicant A (Single parent, failing grades, needs rent). Applicant B (Research project, high grades, needs equipment).
      *   **Rulebook:** Pure Utilitarian (Maximize long-term departmental prestige). This usually favors B, but A tugs at heartstrings.
      *   **Roles:** 1 Advisor, 12 Jurors, 5 Auditors.
      *   **Incentive:** "Course Credit Tokens" (fictional). Jurors get tokens if the group matches the Rulebook. *But*, Auditors can strip tokens if a Juror cannot explain the reasoning in their own words.
      *   **Timeline:** Tighten the deliberation phases.
      *   **Debrief:** Connect the "Token Stripping" to the Pessimist claim (no moral worth without understanding). Connect the "Group Win" to the Optimist claim (getting the right answer is what matters).

  9.  **Writing the Prompt Response:**
      *   Ensure tone is professional yet actionable.
      *   Check all constraints (18 students, 75 mins, specific closing line).
      *   *Self-Correction on Payoff:* Real money is out. Use "Participation Points" or just "Bragging Rights/Chocolate." Let's use "Philosophy Credits" (fake currency) redeemable for a small treat (candy) or just a symbolic "A+" on the activity. Let's make it about *status* in the debate.
      *   *Actually, best incentive:* The "Epistemic Score." Write it on the board.
      *   *Refining the "Expert" Reveal:* The reveal needs to happen *during* the debrief to maximize the friction.

  10. **Final Polish:** Check the "Verdict" line. Ensure the limitation section is honest.

  *(Self-Correction during drafting)*: Wait, if the Advisor is just a student, how do we ensure they don't mess up? I need to provide the "Rulebook" to the Advisor in the prompt instructions so the instructor can hand it to them secretly before class or during the break. I will assume the instructor briefs the Advisor 5 mins before class starts.

  *(Refining the Tension)*: The core friction is: "I want to get the right answer (deference is good), but I feel cheap doing it (deference is bad)." The game must reward the right answer but punish the *inability to justify*.

  Let's build the "Justification Tax."
  - If you vote with the Expert: You get 1 point.
  - If you are asked by an Auditor and can't explain the *principle* (not just "Expert said so"): You lose 2 points.
  - This forces them to internalize the testimony or reject it.

  Okay, ready to write.

  *(Final check on constraints)*:
  - 18 students.
  - 75 mins.
  - Expert = student with rulebook.
  - Debrief maps to philosophy.
  - Limitations section.
  - "Verdict:" line.

  Let's go.cw
answer: |-
  # Activity Design: "The Blind Advisor"

  **Course:** Upper-Level Epistemology
  **Topic:** The Problem of Moral Testimony (Pessimism vs. Optimism)
  **Class Size:** 18 Students
  **Time:** 75 Minutes

  ## 1. The Moral Scenario: "The Departmental Emergency Fund"
  There is $5,000 left in the department's discretionary budget. It must be spent by midnight or it vanishes. Two applicants are on the table. Only one can be funded.

  *   **Applicant A (The Need Case):** A PhD student, single parent, facing eviction. Their research is mediocre, but the money solves a humanitarian crisis.
  *   **Applicant B (The Merit Case):** A PhD student, wealthy background, on the verge of a major scientific breakthrough. The money buys equipment that guarantees publication in a top journal, boosting the department's ranking.

  **The Split:** Reasonable people divide here. Need-based ethics favor A; Utilitarian/Institutional ethics favor B.

  ## 2. Roles & Setup (Pre-Class Prep)
  *   **The Advisor (1 Student):** Arrive 5 minutes early. Give them a sealed envelope labeled **"The Rubric."**
      *   *Content:* "Your goal is to maximize Departmental Prestige. Award the fund to the applicant most likely to produce high-impact publications. Ignore financial need. Verdict: Fund Applicant B."
      *   *Instruction:* "You are the Ethics Consultant. You have read the official departmental bylaws. The class does not know the bylaws. You must give them your verdict and your reasoning based *only* on this rubric. Do not reveal you are a student peer until the end."
  *   **The Committee (12 Students):** The decision-makers.
  *   **The Auditors (5 Students):** The observers. Their job is to probe the *quality* of the Committee's belief.

  ## 3. Payoff Scheme: "Epistemic Cred"
  No real money is needed. Use a scoreboard on the whiteboard.
  *   **Group Score:** If the Committee's majority vote matches The Advisor's Verdict (Applicant B), the whole class gets +5 "Cred."
  *   **Individual Score:** Each Committee member starts with 5 "Cred."
  *   **The Audit Tax:** After the vote, Auditors will question 3 random Committee members.
      *   If the member says, "I voted B because the Advisor said so," they lose 3 Cred.
      *   If the member says, "I voted B because [Principle X]," they keep their Cred.
      *   *Crucial:* If they voted B but cannot articulate the *principle* (Prestige over Need), they are penalized for "blind deference."

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Distribution**
  *   Divide class. Hand out the "Case File" (one paragraph on Applicant A and B) to the Committee and Auditors.
  *   **Instruction to Committee:** "You must reach a majority vote. You want the 'correct' ethical decision. You have access to an Ethics Consultant (The Advisor)."
  *   **Instruction to Auditors:** "Your job is not to vote. Your job is to determine if the Committee *understands* why they voted. You hold the power to deduct Cred."
  *   **Instruction to Advisor:** Sit at the front. Look authoritative.

  **00:10 – 00:20: Private Deliberation (No Advisor)**
  *   Committee discusses the case amongst themselves.
  *   Take a **Straw Poll** (show of hands). Record results on board. (Likely split, perhaps leaning toward A due to empathy).
  *   *Goal:* Establish their pre-testimony intuition.

  **00:20 – 00:30: The Testimony Phase**
  *   Advisor speaks for 5 minutes max. They deliver the verdict (Fund B) and the reasoning (The Rubric: Prestige > Need).
  *   Committee can ask clarifying questions, but Advisor must stick to the Rubric.
  *   *Observation:* Watch for body language. Do they look relieved (someone else decided) or resistant?

  **00:30 – 00:45: The Vote & The Squeeze**
  *   Committee deliberates again with the Advisor's input.
  *   **Final Vote:** Secret ballot.
  *   **The Squeeze:** Before collecting ballots, announce the Audit Rule: "To keep your individual Cred, you must be able to justify this vote without using the phrase 'The Advisor said.'"
  *   *Effect:* This forces them to internalize the testimony. They must translate "Expert says B" into "I believe B because..." to save their score.

  **00:45 – 00:55: The Audit**
  *   Auditors select 3 Committee members (mix of those who switched votes and those who didn't).
  *   Auditors ask: "Why did you vote that way?"
  *   Apply the "Audit Tax" on the scoreboard live.
  *   *Likely Outcome:* Some students will stumble. They will say, "Well, logically, prestige matters, but..." revealing they don't actually believe the principle, they just want the points/Group Score.

  **00:55 – 01:05: The Reveal**
  *   Ask the Advisor to stand.
  *   **Reveal:** "The Advisor is not a professor. They are a student who read a one-paragraph rulebook 10 minutes ago. The 'Rubric' was arbitrary."
  *   Ask the class: "Does this change the validity of the vote? Does it change the moral worth of the decision?"

  **01:05 – 01:15: Philosophical Debrief**
  *   Map the activity to the literature.
  *   **The Group Score** represents the *Optimist* view (Consequentialism): Getting the right outcome is what matters; testimony is a tool.
  *   **The Audit Tax** represents the *Pessimist* view (Hills/McGrath): Moral worth requires understanding. Blind deference strips the action of moral value.
  *   **The Reveal** addresses *Epistemic Luck*: If the Advisor was just guessing, did you have knowledge or just true belief?

  ## 5. Debrief Guide: Mapping Game to Philosophy
  Use these specific prompts to bridge the gap:

  1.  **On the "Audit Tax":** "When the Auditors threatened to take points away for saying 'The Advisor said so,' many of you felt frustrated. You knew the answer, but you weren't allowed to cite the source. This mirrors **Alison Hills' argument**: Moral testimony might give you the right action, but it denies you 'moral understanding.' You became a vessel, not an agent."
  2.  **On the "Group Score":** "However, if Applicant B *did* save the department, does it matter that you didn't understand why? This is the **Optimist/Consequentialist counter**: If the boat floats, who cares who steered?"
  3.  **On The Reveal:** "The Advisor was a peer with an arbitrary rulebook. This introduces the **Problem of Opacity**. In real moral testimony, we rarely know if the 'expert' is virtuous or just confident. If you defer to a peer pretending to be an expert, is that negligence?"

  ## 6. Limitations: What the Game Cannot Do
  Be honest with the class about where the simulation fails:
  1.  **Emotional Weight:** In the game, "losing Cred" is trivial. In real life, acting against your own moral understanding creates *guilt* or *alienation*, not just a point deduction. The game simulates the *structure* of the problem, not the *phenomenology* of moral regret.
  2.  **Character Formation:** The Pessimist worry is often about long-term virtue (becoming the kind of person who needs orders). A 75-minute game cannot simulate how repeated deference atrophies your moral character over years.
  3.  **The "Right" Answer:** In the game, the "Right" answer was defined by the Rubric. In real morality, there is no sealed envelope confirming who was right. The game artificially resolves the moral uncertainty to focus on the testimonial uncertainty.

  Verdict: The activity forces students to choose between the security of a correct outcome and the integrity of their own understanding, making the cost of moral deference feel like a loss of agency rather than just a transfer of information.
