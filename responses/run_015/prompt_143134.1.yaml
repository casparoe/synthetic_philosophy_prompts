prompt: |-
  I'm on the university AI ethics panel and we just recieved a proposal for a recursive audit loop — the lab wants the model's safety checker embedded inside the same reasoning hierachy as the model, not on a separate layer. Half the panel says this is normal because every complex system already has tangled feedback loops; the other half says it breaks the inviolable level rule, like Escher's Drawing Hands where neither hand can be the ultimate source without something outside the frame. We need a memo for Friday recommending approve with conditions, reject, or approve a 6-month pilot with an external hard stop. Draft it with your bottom line in the very first sentence, then reasoning, no preamble, no restating the question. Take the "tangled hierarchies are unavoidable" argument seriously — don't strawman it — but still defend whatever course you pick. Don't include a bibliography or citation list; the board needs arguments it can use now, not homework. Make it concrete: if you approve, specify the time frame and the exact boundary condition.
