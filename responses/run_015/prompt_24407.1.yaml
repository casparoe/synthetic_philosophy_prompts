answer: |-
  Your intuitions are remarkably consistent, but they reveal that you are not operating with a biological definition of "species," nor with a pure individualist ethic. Instead, you are tracking what we might call **Relational Stewardship of Salient Wild Lineages**.

  On this account, a "species" is not a fixed biological unit but a **normative category** defined by three intersecting vectors: **Wildness** (is it part of natural heritage or a human artifact?), **Salience** (does it hold ecological or cultural significance?), and **Responsibility** (did humans cause its precariousness?).

  Here is how this single account resolves your three main tensions:

  1.  **Rhino vs. Cryptic Species (The Salience Vector):** You feel less urgency for the cryptic species not because the individuals matter less, but because the *category* lacks normative weight. The Northern White Rhino is a "Salient Wild Lineage"—it is a recognized character in our shared ecological story. The cryptic species is a technical footnote. Your ethic values the preservation of *meaningful natural heritage*, not just genetic distinctness. The reclassification changes the story we tell about the animals, and thus changes the obligation.
  2.  **Rhino vs. Invasive Species (The Function Vector):** You are not opposed to "extinction" as a biological event; you are opposed to the *loss of value*. The Rhino represents a positive value (heritage/function) being destroyed. The Invasive Species represents a negative value (harm to heritage/function) being removed. Eradicating the invasive snake is not a tragedy; it is a restoration of the ecological community's integrity.
  3.  **Dodo vs. Dinosaur (The Responsibility Vector):** Tragedy requires a victim and a cause. The Dodo is a tragedy because it is a **Responsibility-Weighted Loss**; humans broke it. The Dinosaur extinction is a natural event outside the sphere of human moral agency. Your sense of tragedy tracks *culpability*, not just loss.

  This account also explains your outlier cases. **Hybrids** and **Domesticated Dogs** fail the "Wild Lineage" test (one is blurred, the other is an artifact), so you owe them individual welfare but not species-preservation. **Captive-bred** wild animals pass the test because they are wild lineages held in trust by humans (high responsibility). **High-suffering species** trigger the **Welfare Constraint**: individual suffering acts as a side-constraint that can override the duty to preserve the lineage.

  **Prediction for a New Case:**
  Consider a **De-Extincted Species** (e.g., a genetically engineered Mammoth). Your principle predicts you would feel a **heightened obligation to sustain it once created** (due to total human responsibility/dependence, like the captive-bred case), but you might view its "species value" as **lower than a continuous wild lineage** (like the Rhino) because it lacks the historical continuity of natural heritage. You would treat it as a precious artifact of restoration rather than a sacred relic of nature.

