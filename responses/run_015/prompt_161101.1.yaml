answer: |-
  Your description isolates a phenomenon that straddles logic, security, and engineering, yet lacks a unified label in computer science. In mathematical logic, the outside component you describe is the **Informal Meta-theory**. Tarski and Gödel demonstrated that a formal system cannot define its own truth or consistency; it requires a stronger, external language. When you formalize that meta-language, it becomes an object language requiring a new meta-language. This matches your "receding horizon" exactly. However, "Informal Meta-theory" names the *outside substance*, not the *structural configuration* of the loop plus the receding ground. In security, this is the **Trusted Computing Base (TCB)**, but TCB implies a static boundary, not a receding one. In engineering, this is often dismissed as "Bootstrapping," which names the loop but ignores the ground.

  Therefore, no established name covers the *configuration* of the loop plus the receding background. The nearest notions fail specific tests you raised. A **Meta-level** implies a static hierarchy (Level 0, Level 1); your case is dynamic, where Level 1 becomes Level 0 upon inspection. A **Strange Loop** (Hofstadter) describes the tangled hierarchy itself, not the necessary outside that prevents collapse. **Coherentism** suggests the loop validates itself; you correctly identify that the loop requires an external stopper to avoid vicious circularity.

  Is the outside structurally or pragmatically outside? It is **structurally outside**. This is not a matter of engineering convenience but a consequence of formalization limits. A system cannot contain its own interpreter; the rules of inference cannot be fully internalized without requiring further rules to interpret them (Carroll's Tortoise). The receding behavior is not carelessness; it is a necessary consequence of attempting to formalize the conditions of your own formalization. Every time you pull the background into the system (e.g., writing a meta-schema), you create a new system that requires a new background (the interpreter of the meta-schema). The horizon recedes because the "ground" is always the unformalized context required to give the current formalization meaning.

  Regarding your boundary cases: **Ordinary mutual recursion** is excluded. If recursion provably terminates, it unfolds into a well-founded tree. It does not require an external truth to validate its logic, only stack space. It is a loop in control flow, not in justification. **Macro phasing** (strictly earlier stages) is a **Stratified Tower**. It prevents the loop entirely by enforcing a hierarchy where higher levels depend on lower levels, but not vice versa. This avoids the need for a receding horizon because there is no circularity to ground. Your case specifically requires the circularity (the self-hosting compiler) plus the external ground.

  Since no established term captures this specific engineering configuration, I propose **The Meta-theoretic Horizon**.

  **Definition:** A system configuration where a self-referential loop (bootstrapping, reflection, self-validation) is stabilized by an external context that cannot be fully internalized without generating a new loop requiring further external context.

  **Inclusion Criteria:**
  1.  **Circular Dependency:** The system's definition or validation depends on itself (e.g., compiler written in itself).
  2.  **External Grounding:** Execution or validation relies on an outside agent (hardware, human, separate interpreter).
  3.  **Receding Boundary:** Internalizing the ground shifts the dependency rather than eliminating it.

  **Exclusion Criteria:**
  1.  **Well-founded Recursion:** Terminating loops that do not require external semantic validation.
  2.  **Stratified Systems:** Hierarchies where dependencies flow strictly one way (no loops).
  3.  **Static Trust Roots:** Systems where the external ground is fixed and not subject to formalization attempts (e.g., a hardware root of trust that is never audited).

  This carving distinguishes your case from simple loops (which ignore the ground) and simple hierarchies (which deny the loop). It names the tension between the desire for closure and the necessity of an open context.

  \answer{The Meta-theoretic Horizon}
