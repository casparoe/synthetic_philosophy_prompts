answer: |-
  **METROPOLITAN TRANSIT AUTHORITY**
  **Office of Foresight Allocation (OFA)**
  **STANDARD OPERATING PROCEDURE 88.4**
  **SUBJECT: Classification of Mortality Events in Track Incidence Scenarios**
  **REVISION: 3.1 | DATE: 12 NOV 2023**
  **DISTRIBUTION: Safety, Ops, Legal, HR, Union Rep**

  **1.0 PURPOSE**
  To standardize the classification of Positioned Party (PP) fatalities during scheduled track maintenance. This protocol aligns operational outcomes with Regulatory Statute 12 (Intentionality), ensuring all mortality events are correctly categorized for liability and audit purposes.

  **2.0 DEFINITIONS**
  2.1 **Operator:** Rostered personnel authorized to manipulate diversion levers per Shift Schedule B.
  2.2 **Positioned Party (PP):** Personnel scheduled on track segments per Maintenance Cycle 4. Presence on track is considered pre-consented under Employment Contract Clause 9.
  2.3 **Office of Foresight Allocation (OFA):** Compliance body responsible for auditing causal chains and assigning moral weight to operational variables.

  **3.0 THE FIVE-METRE PROXIMITY STANDARD**
  3.1 Intentionality is determined strictly by physical separation between Operator and PP at the moment of incident initiation.
  3.2 **Separation > 5.0 metres:** Result classified as Foreseen Side Effect (FSE). Operator liability is waived provided timetable adherence was maintained.
  3.3 **Separation ≤ 5.0 metres:** Result classified as Brought About (BA). Requires Form 12-B justification and OFA review.
  3.4 Measurement must be conducted via calibrated laser rangefinder post-incident. Tape measures are prohibited due to calibration drift.

  **4.0 EVENT CLASSIFICATION**
  4.1 **Brought About (BA):** Direct intent. Permissible only under Emergency Override Protocol.
  4.2 **Foreseen Side Effect (FSE):** Unintended but anticipated outcome of compliant diversion. Permissible under Standard Divergence.
  4.3 **Tertiary Effects (TE):** Fatalities arising as a consequence of an FSE (e.g., downstream schedule collapse causing secondary incident). These events fall outside OFA audit scope and are not logged in the Central Mortality Register.

  **5.0 MANUAL HANDLING PROHIBITIONS**
  5.1 Utilization of a PP as a mass object to obstruct track mechanisms is prohibited.
  5.2 Physical contact initiated by Operator to displace PP constitutes Unauthorized Equipment Use.
  5.3 Fatalities resulting from 5.2 are classified as BA regardless of Proximity Standard.
  5.4 Fatalities resulting from lever diversion where PP impacts infrastructure remain compliant under FSE, provided no manual force was applied to the PP directly.

  **6.0 REPORTING**
  All BA and FSE events must be logged within 4 hours. TE events require no documentation. Failure to classify correctly constitutes a Level 2 Compliance Breach.

  **REVISION HISTORY**
  3.0: Initial release.
  3.1: Clarified TE exclusion criteria; updated rangefinder specs.

  ***

  **What's being sent up**

  This SOP satirizes the Doctrine of Double Effect (DDE), which distinguishes between intended harms and merely foreseen side-effects. The "Office of Foresight Allocation" institutionalizes the philosophical distinction between *intending* death versus *foreseeing* it.

  The "Five-Metre Rule" exaggerates the criticism that DDE relies on arbitrary distinctions. Philosophers often argue that proximity shouldn't morally matter if the outcome is identical; here, it becomes a literal calibration measurement. The "Manual Handling" clause targets the Footbridge Variant, where pushing a man is forbidden but pulling a lever is not. The SOP frames this as "Unauthorized Equipment Use," highlighting the "means vs. side-effect" distinction: using a person as a means (pushing) is prohibited, while using them as part of the infrastructure (diverting onto them) is compliant.

  Finally, the "Tertiary Effects" clause mocks how moral frameworks often draw boundaries to limit liability. By declaring downstream deaths un-auditable without explicitly denying responsibility, the memo mimics how institutions manage moral risk through bureaucratic categorization rather than ethical engagement.
