  # JOINT STATEMENT ON ANOMALY TAXONOMY AND MECHANISM IDENTITY
  **Cold-Chain Monitoring Team | Adversarial Collaboration Record**
  **Date:** October 2023
  **Subject:** Resolution of Mechanism Definition for Alerting, Dispatch, and Forecasting

  ## 1. STATEMENT OF SHARED PRINCIPLES

  We, the undersigned, acknowledge that our disagreement regarding the definition of "mechanism" has impeded the stability of the alerting taxonomy and the accuracy of the fleet forecasting model. We agree that the taxonomy is not a philosophical exercise but an operational tool. We commit to the following claims as the baseline for all future model iterations:

  1.  **Operational Primacy:** The validity of the taxonomy is determined by three metrics: reduction in false-positive pages (03:00 alerts), accuracy of first-time dispatch (correct trade and parts), and forecast error rate for component replacement. A definition of "mechanism" that optimises philosophical consistency at the expense of these metrics is rejected by both parties.
  2.  **Telemetry Limitations:** We acknowledge that current telemetry (five-minute resolution of temperature, duty cycle, door counts, and defrost) is insufficient to physically distinguish all causal pathways. Specifically, we agree that the **Silent Twin** case (perished gasket vs. failing evaporator fan) presents identical signatures under current sensing. We agree that treating these as distinct categories in the *alerting* layer without additional diagnostic data increases dispatcher cognitive load without improving resolution.
  3.  **The Chameleon Constraint:** We agree that a single physical root cause (e.g., refrigerant undercharge) manifesting as distinct signatures (short-cycling in dry ambient vs. iced coil in humid ambient) poses a risk to forecasting. If the taxonomy splits these into two mechanisms, fleet-level failure rates will be fragmented and underestimated. Both sides agree the taxonomy must allow for "parent" mechanism grouping for forecasting, even if "child" signatures differ for alerting.
  4.  **The Reset Degeneracy:** We agree that a controller reset is not a mechanistic fix for the purposes of forecasting. While a reset may clear an alarm (intervention), if the underlying condition recurs, classifying "Resettable" as a mechanism corrupts the reliability model. We agree to tag resets as "Intervention Events" distinct from "Resolution Events."
  5.  **Granularity Relativity:** We accept the proposition that "same mechanism" is not a binary property of the universe but a three-place relation: *Same Mechanism (Relative to Intervention Repertoire and Observational Granularity).* We agree to test whether our taxonomy requires different resolutions for the Dispatch function (fine-grained) versus the Forecasting function (coarse-grained).
  6.  **Validation by Carry-Over:** We agree that intuition is insufficient. A mechanism class is only valid if a repair validated on one instance transfers to a matched instance without fresh diagnosis. We commit to running a **Carry-Over Test** on historical dispatch data to validate taxonomy clusters.
  7.  **Transitivity Audit:** We agree to audit the corpus for transitivity violations (Case A similar to B, B similar to C, but A distinct from C). We agree that systematic intransitivity indicates either a flaw in the causal model (Realist concern) or a need for fuzzy clustering rather than hard classes (Interventionist concern).

  ## 2. TABLE OF RESIDUAL DISAGREEMENTS

  While we agree on the principles above, we remain divided on how to encode them into the live taxonomy. The following table outlines the specific points of contention.

  | Point at Issue | Mechanism Realist Position | Interventionist Position |
  | :--- | :--- | :--- |
  | **1. Identity Criteria** | Mechanism identity is fixed by the physical generating structure (component + physics). If the causal pathway differs, the mechanisms are distinct, regardless of whether our sensors can detect the difference. | Mechanism identity is fixed by the equivalence class of intervention. If the diagnostic signature and the repair procedure are identical, the mechanisms are operationally the same, regardless of hidden physical differences. |
  | **2. The Silent Twin**<br>*(Gasket vs. Fan)* | These must be labelled as distinct mechanisms ("Thermal Leak: Envelope" vs. "Thermal Leak: Airflow") in the database. To lump them is to record a falsehood that corrupts long-term root cause analysis. | These must be lumped into a single alert class ("Thermal Breach: Unspecified") until telemetry improves. Distinguishing them in the ticketing system forces dispatchers to guess, increasing error rates and truck rolls. |
  | **3. The Chameleon**<br>*(Undercharge Signatures)* | These are one mechanism ("Refrigerant Loss"). The ambient conditions are contextual modifiers, not distinct mechanisms. Splitting them dilutes the signal for fleet-wide refrigerant integrity. | These are two mechanisms ("Short-Cycle Fault" vs. "Defrost Fault"). The intervention logic differs (check gas vs. check defrost heater first). Merging them risks sending a gas engineer to a site that actually needs a defrost timer. |
  | **4. Transitivity** | Mechanism sameness must be transitive. If A is the same mechanism as B, and B is the same as C, then A must be the same as C. Intransitivity implies our causal mapping is incorrect. | Mechanism sameness need not be transitive. It is a clustering of similarity. A chain of pairwise-similar cases that does not close is a valid discovery of a "mechanism spectrum" rather than a model error. |
  | **5. The Reset**<br>*(Shared-Fix Degeneracy)* | A reset is a mask, not a mechanism. Grouping anomalies that clear on reset implies a shared cause where none exists. This is categorically false. | A reset is a valid intervention. If a cluster of diverse anomalies clears on reset, they share a "software state" mechanism. This is useful for alerting, even if it is useless for forecasting hardware health. |

  ## 3. CRUXES AND ADJUDICATION PLAN

  To resolve the disagreements above, we identify three specific cruxes. For each, we specify a test, the predictions made by each side, and the concessions required should the evidence favour the opposing view.

  ### Crux 1: The Carry-Over Test (Dispatch Accuracy)
  **Question:** Does distinguishing the **Silent Twin** (Gasket vs. Fan) improve dispatch outcomes, or does it merely increase false confidence?
  **Test:** We will retrospectively analyse 200 historical tickets classified as "Thermal Breach". We will simulate two dispatch protocols:
  1.  *Split:* Assign specific parts (Gasket Kit vs. Fan Motor) based on the Realist's best-effort diagnostic rules.
  2.  *Lumped:* Assign a generic "Thermal Breach Kit" (containing both) or a generalist engineer.
  We will measure the "First-Time Fix Rate" and "Parts Wastage".

  *   **Realist Prediction:** The *Split* protocol will yield higher First-Time Fix Rates because the underlying causes are distinct. Lumping them encourages lazy diagnosis.
  *   **Interventionist Prediction:** The *Lumped* protocol will yield lower Parts Wastage and equal Fix Rates because the telemetry cannot reliably support the *Split*. The *Split* will result in engineers arriving with the wrong part.
  *   **Concessions:**
      *   *If Lumped wins:* Realist concedes that the Dispatch Taxonomy must merge Silent Twins until sensor resolution improves.
      *   *If Split wins:* Interventionist concedes that distinct mechanism labels are required even with overlapping signatures, and diagnostic protocols must be tightened.

  ### Crux 2: The Transitivity Audit (Fleet Forecasting)
  **Question:** Is the anomaly corpus transitive, and does intransitivity break the forecasting model?
  **Test:** We will construct a similarity graph of the last 12 months of anomalies based on telemetry signatures. We will identify chains where A~B and B~C but A≠C (e.g., Gasket ~ Fan ~ Sensor Drift). We will then check if forecasting error increases in regions of the graph with high intransitivity.

  *   **Realist Prediction:** High intransitivity correlates with high forecast error. It indicates we are mixing distinct physical failure modes. Cleaning the taxonomy to enforce transitivity will improve forecast accuracy.
  *   **Interventionist Prediction:** Intransitivity is inherent to complex systems. Attempting to force transitivity will fragment the data into unusable small clusters. A fuzzy model that accepts intransitivity will predict fleet workload better.
  *   **Concessions:**
      *   *If Transitivity improves forecasts:* Interventionist accepts that mechanism classes must be hardened to reflect causal boundaries, not just signature similarity.
      *   *If Fuzzy Clustering wins:* Realist accepts that "mechanism" for forecasting is a statistical construct, not a physical truth, and drops the requirement for hard causal boundaries in the model.

  ### Crux 3: The Reset Degeneracy (Alerting vs. Forensics)
  **Question:** Should "Clears on Reset" be a mechanism class in the Alerting layer?
  **Test:** We will track all anomalies cleared by reset for 90 days. We will measure recurrence rates within 7 days.

  *   **Realist Prediction:** Recurrence will be high and heterogeneous. Classifying this as a mechanism will hide genuine hardware degradation. It must be excluded from the mechanism taxonomy entirely.
  *   **Interventionist Prediction:** Recurrence will be low for a significant subset. For the Alerting function, identifying "Resettable" anomalies reduces unnecessary pages. It is a valid *operational* mechanism even if not a *physical* one.
  *   **Concessions:**
      *   *If Recurrence is High:* Interventionist agrees to remove "Reset" as a mechanism class from the Forecasting model and limit its use in Alerting to a "Transient" tag.
      *   *If Recurrence is Low:* Realist agrees to allow "Software State" as a valid mechanism category for the Alerting layer, provided it is quarantined from the Hardware Forecasting layer.

  ## 4. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISPUTES

  Having reviewed the positions, we categorise the nature of our deadlock as follows:

  **1. Verbal Disputes (Definition of "Mechanism")**
  A significant portion of our conflict is verbal. The Realist uses "mechanism" to mean *physical etiology* (what broke). The Interventionist uses "mechanism" to mean *operational equivalence class* (what we do about it).
  *   *Resolution:* We agree to disambiguate terminology. We will use **"Failure Mode"** for the Realist's physical etiology (used for Forensics and Long-term Forecasting) and **"Alert Class"** for the Interventionist's operational cluster (used for Dispatch and Immediate Alerting). The single "Taxonomy" will be recognised as a mapping between these two layers, not a single list.

  **2. Substantive Disputes (Resource Allocation)**
  The remaining disagreement is substantive and concerns the allocation of engineering resources.
  *   *Sensor Investment:* The Realist position implies we must invest in higher-resolution telemetry (e.g., current clamps on fans, pressure transducers) to resolve the **Silent Twin**. The Interventionist position implies we should invest in better dispatch heuristics and generic kits to manage the ambiguity. The **Carry-Over Test** (Crux 1) will decide this capital expenditure.
  *   *Model Complexity:* The Realist position requires a causal model that enforces transitivity and hard boundaries. The Interventionist position allows for probabilistic, fuzzy clustering. The **Transitivity Audit** (Crux 2) will decide the architecture of the forecasting engine.
  *   *The Reset:* The substantive issue is whether we tolerate "masking" faults to reduce alert fatigue. The Realist views this as technical debt; the Interventionist views it as operational efficiency. The **Reset Test** (Crux 3) will determine the acceptable recurrence threshold.

  **3. The Three-Place Relation**
  We acknowledge the proposer's insight that "same mechanism" is relative to granularity and intervention. This is not merely a compromise but a substantive finding: the fleet is too heterogeneous for a single binary definition. The taxonomy must explicitly state *which* intervention repertoire (Dispatch vs. Forecast) a mechanism class is valid for. A "Mechanism" valid for Dispatch (e.g., "Thermal Breach") may be invalid for Forecasting (which requires "Gasket" or "Fan").

  **Signed:**
  *Lead, Mechanism Realism*
  *Lead, Interventionist Strategy*
  *Date: 24 October 2023*
