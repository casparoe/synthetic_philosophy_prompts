answer: |-
  Based on the pattern of your roommate's judgments, she isn't arguing against markets in general (since she allows scalping and line-standing). She is arguing against **exploitative** markets and markets that compromise **fundamental rights or survival**.

  Here is the prediction for the surrogacy case, the three logical frameworks that explain her past views, and a test case to figure out which framework she actually uses.

  ### 1. The Prediction
  **Verdict: She will likely ALLOW the boutique surrogacy.**

  **Why?** Her previous bans (kidneys, votes, price-gouging) all share a specific feature: **coercion through vulnerability.**
  *   **Kidneys:** Poor people selling body parts to rich people out of desperation.
  *   **Votes:** Poor people selling political power to rich people, undermining equality.
  *   **Price-Gouging:** Victims paying exorbitant rates because they have no other survival option.

  Conversely, her allowed markets (scalping, line-standing) involve **discretionary choices.** You don't *need* a concert ticket, and the line-stander is selling labor, not a body part or a right.

  The surrogacy case you described is specifically engineered to remove the "vulnerability" objection. The surrogates are already financially secure (no desperation), they have separate lawyers (no coercion), and the pay is high ($80k is compensation, not a lifeline). To her, this looks less like "selling a kidney" and more like "highly skilled labor" (like the line-stander), provided the medical risks are managed.

  ---

  ### 2. The Three Hidden Rules
  Here are three distinct ethical rules that all fit her past data points but diverge on future cases.

  #### Rule A: The "Desperation Constraint" (Anti-Exploitation)
  *   **The Logic:** Markets are immoral when one party participates because they have no other viable option (poverty, crisis, survival). Money corrupts the transaction when it exploits necessity.
  *   **Fits Past Data:**
      *   *Kidneys:* Banned because sellers are usually desperate.
      *   *Gouging:* Banned because buyers are desperate.
      *   *Votes:* Banned because it allows wealth to override the equal voice of the less wealthy.
      *   *Scalping/Line-standing:* Allowed because neither party is desperate; it's a luxury or a gig.
  *   **View on Surrogacy:** **ALLOW.** Since the surrogates are financially secure and have legal protection, the "desperation" element is removed. It becomes a consensual service contract.

  #### Rule B: The "Sacred Sphere Constraint" (Anti-Commodification)
  *   **The Logic:** Certain things belong to the realm of personhood, citizenship, or biology and should never have a price tag, regardless of how fair the deal is. Putting a price on them degrades their value.
  *   **Fits Past Data:**
      *   *Kidneys:* Banned because the body is not a commodity.
      *   *Votes:* Banned because citizenship is not a product.
      *   *Gouging:* Banned because survival (gas/shelter) is a human right, not a market good.
      *   *Scalping/Line-standing:* Allowed because concert access and time are not "sacred."
  *   **View on Surrogacy:** **BAN.** Even if the surrogate is rich and well-represented, this rule views pregnancy and reproduction as inherently non-fungible. Paying for it commodifies women's bodies and children, which violates the "sacred sphere" regardless of the $80k fee.

  #### Rule C: The "Third-Party Harm Constraint" (Social Stability)
  *   **The Logic:** Markets are banned when they create negative externalities that hurt society or third parties, not just the buyer and seller.
  *   **Fits Past Data:**
      *   *Kidneys:* Banned due to black market risks and burden on the health system.
      *   *Votes:* Banned because it breaks democracy for everyone, not just the seller.
      *   *Gouging:* Banned because it causes social unrest and leaves people stranded.
      *   *Scalping/Line-standing:* Allowed because the harm is contained to the buyer (who pays more) and the seller (who works); society doesn't collapse.
  *   **View on Surrogacy:** **DEPENDS.** If she believes commercial surrogacy leads to broader societal issues (e.g., treating children as products, class-based reproduction), she will **BAN** it. If she views it as a private medical contract with no societal fallout, she will **ALLOW** it.

  ---

  ### 3. The Critical Test Case
  To figure out which of the three rules is actually driving her logic, propose this case next:

  **The Case: Paid High-Risk Pharmaceutical Trials**
  *   **Scenario:** A pharmaceutical company wants to pay healthy volunteers **$50,000** to test a new drug. The drug has unknown long-term side effects (potential liver damage), but participants are fully informed, screened for mental stability, and must be middle-income (not desperate) to qualify.

  **How this separates the rules:**

  *   **If she BANS it:** She follows **Rule B (Sacred Sphere).** She believes you cannot rent out your body's safety for cash, even if you aren't desperate. This suggests she will likely turn against the **Surrogacy** case upon reflection, viewing the womb as similar to the liver.
  *   **If she ALLOWS it:** She follows **Rule A (Desperation).** She believes body risks are acceptable if the person is informed, well-paid, and not coerced by poverty. This confirms she will support the **Surrogacy** case.
  *   **If she HESITATES based on "Medical Ethics":** She follows **Rule C (Third-Party Harm).** She is worried about the precedent it sets for the medical industry or the potential for hidden coercion.

  **Why this works:** It isolates the "Body" element from the "Desperation" element. Kidneys and Surrogacy involve both. Drug trials involve the Body (like kidneys) but can be structured to remove Desperation (like the boutique surrogacy). Her answer here will tell you if she objects to *selling bodies* or just *exploiting people.*
