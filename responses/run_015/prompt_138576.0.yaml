      *   *The "Change" Illusion:* She saves the world from war. Did she change the future? No, the future *included* her saving the world. This is subtle. If the audience thinks she "changed" the future, the Future Contingents argument fails.
      *   *Physics vs. Metaphysics:* Engineers might argue about relativity and light cones. The film plays fast and loose with physics (Sapir-Whorf on steroids). Need to keep it metaphysical, not physical.

