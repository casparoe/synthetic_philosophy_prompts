      *   *Scene 2: The Phone Call to General Shang.* (The Climax). She uses future knowledge to change the present. Wait, does she *change* the future? No, she fulfills it. This is crucial. She says the words because she *remembered* saying them.
      *   *Scene 3: The Final Conversation with Ian.* (The Choice). "Would you change anything?" "No." This confirms the acceptance of the fixed timeline.

  5.  **Identify Vulnerabilities (Where the Engineers might attack):**
