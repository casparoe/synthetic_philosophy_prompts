      *   **User's Specific "Wrinkle":** Louise's knowledge is *anamnetic* (memory-like), not inferential/predictive. Does this force a Block Universe (determinism) or can an Open Future theorist absorb it? Does the emotional payoff depend on the future being settled?
      *   **Practical Need:** 2-3 key scenes to focus on, and where the film resists this reading (vulnerabilities).
