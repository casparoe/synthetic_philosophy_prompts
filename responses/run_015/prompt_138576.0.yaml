      *   *Aristotle's Sea Battle:* Is the proposition "There will be a sea battle tomorrow" true or false *now*? If true now, the future is necessary (fatalism). If neither, the future is open (contingent).
      *   *Standard *Arrival* Reading:* Compatibilism. You know what happens, but you still choose to do it. (The "Why don't you use your weapon?" "Because I know how the game ends" loop).
      *   *User's Reading:* Anamnetic Foreknowledge. It feels like memory. Memory implies the event *has happened*. If I remember tomorrow, does tomorrow *have* to happen?
      *   *The Conflict:* If the future is open (no truth value yet), you can't "remember" it. Memory is factive (you can't remember what didn't happen). So, does Louise's experience *prove* the Block Universe (Eternalism)?
      *   *Engineers' Potential Attack:* They will likely pounce on causality. If effect precedes cause (linguistic relativity), does that break physics? They might conflate epistemology (how we know) with ontology (what exists).

