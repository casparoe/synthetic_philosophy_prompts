          *   *Sentience Load:* If sentience is assumed, the "Capacity-Based" theory weakens. If sentience is denied, the whole thing holds easily. The assumption is load-bearing for the *critique*, not the *practice*.

      *   **Section 5: What would actually have to change (~250 words)**
          *   *Metrics:* Shift from population (mortality) to individual (behavioral indicators, physiological stress at slaughter).
          *   *Slaughter:* Require stunning (percussive, electrical, CO2 if proven humane) before asphyxiation.
          *   *Procedures:* Ban eyestalk ablation unless medically necessary for the individual (not production).
          *   *Philosophy:* Shift from "Stock Health" to "Individual Welfare."
          *   *Economics:* Acknowledge the cost increase. The certification would need to price in the moral cost.
          *   *Consistency:* If you treat sickness, you must protect from slaughter pain. The "asset protection" logic must become "subject protection."

      *   **Section 6: Bottom line (~80 words)**
          *   Summarize the core tension. It's a category error between livestock-as-asset and livestock-as-sentient-being.

