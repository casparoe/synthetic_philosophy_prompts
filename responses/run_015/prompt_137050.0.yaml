      *   **Hypotheses to Evaluate:** (1) Nociception only (no pain), (2) Brief-life discount, (3) Hidden economic exchange rate.
      *   **Specific Issues to Address:** Population-level metrics vs. individual experience, inconsistency of treating sickness vs. slaughter methods.
      *   **Assumption:** Assume salmon/shrimp are sentient (but note if this is load-bearing).
