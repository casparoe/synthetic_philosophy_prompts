      *   **Total Word Count Estimate:** 120 + 300 + 250 + 200 + 250 + 80 = 1200 words. (Need to be careful with counts).

  2.  **Deconstruct the Pattern:**
      *   *Observation:* Veterinary care is provided (acknowledging suffering/health), but slaughter is brutal (asphyxiation/crowding) compared to mammals. Eyestalk ablation is standard despite sentience laws.
      *   *Metrics:* Population-level (mortality, FCR, oxygen) rather than individual welfare.
      *   *Tension:* Treating sickness implies individual welfare matters, but slaughter methods imply it doesn't matter at the end. Population metrics obscure individual suffering.
      *   *Hypotheses:*
          1.  *Nociception only:* Unlikely given sentience laws and research funding.
          2.  *Brief-life discount:* Counter-intuitive (mammals prioritize long-term confinement).
          3.  *Economic exchange rate:* Plausible but unstated.
      *   *Core Philosophical Issue:* Is welfare a property of the *stock* (utilitarian production unit) or the *individual* (rights-bearing sentient being)?

  3.  **Drafting - Section by Section:**

      *   **Section 1: The pattern, restated (~120 words)**
          *   Focus: Certification schemes mandate health plans and mortality tracking (acknowledging welfare) yet permit slaughter methods (asphyxiation) and procedures (eyestalk ablation) illegal for mammals. Metrics are aggregate (FCR, stocking density), not individual.
          *   Check: Did I describe anything wrong? The user says "drowning a healthy one" - asphyxiation in ice slurry/air. That's accurate.
          *   Drafting thought: Keep it tight. Highlight the dichotomy between life management (medical care) and death management (industrial efficiency).

      *   **Section 2: The implicit theory (~300 words)**
          *   Goal: Define the philosophical framework.
          *   Idea: "Aggregative Utilitarianism with Species-Relative Thresholds."
          *   Key concepts: Welfare is a function of production efficiency. Suffering is acceptable if it doesn't impact yield (mortality/FCR). The individual is subordinate to the stock.
          *   Addressing the hypotheses: It's not (1) because treatment implies pain recognition. It's not exactly (2) because it's not about time, it's about economic utility. It's closest to (3) but framed as "acceptable loss."
          *   Sentience assumption: If they are sentient, this theory requires a hierarchy of sentience where fish/shrimp sentience is "lesser" or "different" than mammals, allowing higher suffering thresholds for the same economic output.
          *   Drafting thought: Focus on the shift from individual rights to population health. The "health plan" protects the *asset*, not the *subject*.

      *   **Section 3: What it strictly needs vs. what it merely fits (~250 words)**
          *   *Strictly Needs:* To function, this system only needs the assumption that fish/shrimp suffering does not carry moral weight equivalent to mammals *at the point of slaughter*. It needs mortality to be a proxy for welfare.
          *   *Merely Fits:* It fits the "nociception only" hypothesis loosely, but doesn't need it (since treatment happens). It fits the "economic exchange" hypothesis well, but doesn't need it to be explicit.
          *   *Individual vs. Stock:* It strictly needs welfare to be definable at the population level. If welfare is inherently individual, the system collapses.
          *   *Treatment vs. Slaughter:* Consistency exists if the goal is asset preservation during growth, and cost minimization at harvest. The inconsistency is only moral, not operational.

      *   **Section 4: Where it's underdetermined (~200 words)**
          *   *Rival Theories:*
              1.  *Epistemic Skepticism:* We can't know if they feel pain at slaughter, so we default to tradition.
              2.  *Capacity-Based Gradation:* They feel pain but lack the cognitive capacity to *anticipate* death, making slaughter less harmful than for mammals.
