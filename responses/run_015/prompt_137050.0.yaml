  The pattern, restated
  Your scheme enforces veterinary health plans and tracks mortality, feed conversion, and stocking density, acknowledging living fish require care. Yet, at harvest, it permits asphyxiation in air or ice slurry—methods illegal for mammals—and standardizes invasive procedures like shrimp eyestalk ablation. Metrics remain population-level, ignoring individual experience. This creates a dichotomy: during growth, welfare manages assets; at slaughter, it sacrifices efficiency. The inconsistency lies in treating sickness (individual care) while sanctioning brutal death (individual neglect), all while metrics obscure the specific suffering of any single animal within the stock.

  The implicit theory
  The implicit theory is **Instrumental Aggregatism**. It presupposes welfare is a property of the *stock*, not the *individual*. Under this view, a fish's moral status is contingent on its economic utility. Veterinary care is mandated not because the individual has a right to health, but because sickness reduces yield and signals management failure. Mortality and Feed Conversion Ratios (FCR) are proxies for welfare because they measure system efficiency, not subjective experience.

  This theory rejects the mammalian model of individual rights. It assumes that while fish may feel pain (hence treatment), their suffering carries less moral weight than mammals', allowing higher suffering thresholds for equivalent economic gain. This aligns with your third hypothesis: a hidden exchange rate where cost-per-unit-of-suffering is capitalized. However, it reframes this economically: suffering is acceptable if it doesn't impair production. The "brief-life discount" is irrelevant; what matters is the *utility-life*. The inconsistency between treating sickness and permitting brutal slaughter dissolves if both actions serve the same goal: maximizing viable biomass during growth and minimizing cost at harvest. Sentience is acknowledged but hierarchically downgraded. The fish is a "biomass unit" during growth and a "product" at harvest. Welfare is purely instrumental. This framework presupposes that moral consideration is scalable based on economic value. It treats the "health plan" as risk management for the investor, not rights protection for the animal. Consequently, the suffering incurred during slaughter is viewed as a terminal production cost rather than a moral violation. The theory relies on a discontinuous moral status: the animal is a subject of care while growing, but an object of processing at death.

  What it strictly needs vs. what it merely fits
  Strictly, this system needs only two premises: first, that welfare metrics can be validly aggregated (population health equals individual welfare); second, that species membership dictates moral threshold. It does not strictly need to deny sentience (Hypothesis 1), as treatment protocols acknowledge pain response. It does not need the "brief-life discount" (Hypothesis 2), as long-term confinement is acceptable if FCR remains optimal.

  What merely fits is the economic exchange rate (Hypothesis 3). While cost drives the practice, the *philosophical license* is ontological: fish are biomass units. If welfare were truly individual, population metrics would be insufficient. The system fits the economic hypothesis because cost-benefit analysis aligns with aggregative utilitarianism, but the practice could persist even if costs were neutralized, provided the ontological status of the fish remained subordinate to the stock. The critical requirement is that individual suffering at slaughter does not invalidate the population-level welfare claim. The system strictly needs the assumption that individual experience is inaccessible or irrelevant compared to aggregate output. It fits the economic hypothesis because money is the common denominator, but the deeper need is the erasure of the individual subject. Furthermore, the system strictly requires that "welfare" be definable without reference to consciousness. If welfare requires subjective experience, population metrics fail. Thus, the scheme presupposes welfare is biological function, not felt experience. This allows the treatment of sickness (biological function restoration) to coexist with brutal slaughter (biological function termination) without contradiction.

  Where it's underdetermined
  The theory is underdetermined because rival frameworks license the same practices. **Epistemic Skepticism** argues we cannot verify slaughter pain in aquatic species, defaulting to tradition despite sentience laws. **Cognitive Gradation** suggests fish lack the temporal cognition to anticipate death, making asphyxiation less psychologically harmful than for mammals, even if nociception is identical. **Regulatory Inertia** posits no theory exists, only lagging legislation compared to terrestrial livestock.

  Your sentience assumption is load-bearing for the *critique*, not the *practice*. If fish are sentient, the Cognitive Gradation theory weakens, exposing the inconsistency. However, the industry can maintain practice by claiming sentience varies in *quality* rather than existence. Without assuming sentience, the pattern is straightforward resource management. With sentience, it requires a robust justification for species-based moral hierarchy which current certification schemes lack. The underdetermination lies in whether this is a deliberate moral hierarchy or simply a failure to update scientific understanding within regulatory frameworks. Both lead to the same outcome: aquatic animals remain excluded from slaughter protections afforded to mammals.

  What would actually have to change
  To resolve this, certification must shift from **Stock Health** to **Individual Welfare**. Metrics must include individual behavioral indicators (avoidance, distress) alongside mortality. Slaughter protocols must require verified stunning (percussive or electrical) before asphyxiation, aligning with mammalian standards. Eyestalk ablation must be restricted to therapeutic necessity, not production optimization.

  Philosophically, the scheme must acknowledge that treating sickness recognizes individual value; therefore, slaughter must respect that same value. This requires abandoning the idea that population metrics suffice. If welfare is individual, a stock with low mortality can still contain high individual suffering. Economically, this increases costs, requiring the "hidden exchange rate" to be made explicit: consumers pay more for reduced suffering. The consistency lies in extending the logic of veterinary care (protecting the subject) to the point of death, rather than truncating it at harvest. The change requires admitting that efficiency cannot override sentience. It demands that the "health plan" logic—preventing suffering for the sake of the animal—applies equally to the kill. Until then, the certification validates a system where welfare is merely a synonym for productivity. Specifically, auditors would need to witness slaughter, not just review logs. The "health plan" must become a "welfare plan" encompassing death. This shifts the burden from proving harm to proving humane handling. It forces the scheme to confront the cost-per-unit-of-suffering directly, rather than hiding it behind aggregate statistics.

  Bottom line
  The pattern presupposes welfare is an industrial metric, not a moral claim. It treats fish as sentient assets during growth but insensate products at death. To fix this, you must reject population-level proxies as sufficient and mandate individual protection at slaughter. The inconsistency isn't philosophical; it's categorical. You are measuring production efficiency while calling it welfare strictly compliance.
