  I'm writting the programme notes for a rep cinema's Back to the Future season and I'd rather make one real philosophical point in them than wave vaguely at paradoxes. Here's the claim, and I want you to argue with it rather than back it up: the polaroid scene — the one where Marty's brother and sister vanish out of the photograph one at a time, eldest first, while he watches his own hand start to go — commits the film to two time dimensions, not one. Lewis's argument, as I read it, is that change is always replacement, a thing being one way at one time and a different way at a later time, and since the past has no later time at which to be different, it can't change; so a story in which the past genuinely comes out different has to smuggle in a meta-time along which the timeline is first one way and then another. Is that right? Does the fading need hypertime, or is there a one-dimensional reading of it I'm missing — branching, say, or Novikov-style self-consistency where the fading turns out to be a red herring and nothing was ever really at risk? And if it does need hypertime, does it regress: does the meta-time need a meta-meta-time, or does the regress stop, and if so what stops it?

  Then tell me where the film fights the reading rather than illustrating it — the 1985 Marty returns to comes out improved rather than restored, and he carries around memories of a timeline nobody else ever lived through, which both look awkward for hypertime and awkward for branching. And finally, what does this version of the grandfather paradox show that the philosophy papers don't? I suspect it's something about why erasure feels more natural to an audience than consistency does, and what that says about our pre-theoretic idea of the past being fixed — but tell me if that's worth putting in print or if it's just cheap. Keep it tight enough that I could squeeze it into about 600 words of notes.
