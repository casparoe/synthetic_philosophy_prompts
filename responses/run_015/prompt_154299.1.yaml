prompt: |-
  You are a professional philosopher specialising in normative ethics and the theory of practical reason, with deep familiarity with indirect normativity and models of idealised deliberation. Please begin by briefly brainstorming the core conceptual architecture of both positions and any hidden tensions between them. Then, think step by step and provide a rigorous, polished analysis.

  Compare indirect normativity—the view that an act's moral status is determined not directly but via the value of the decision procedure or character trait from which it issues—with the framework of idealised deliberation, according to which normative authority is fixed by what an agent would endorse after achieving full information, internal coherence, and reflective equilibrium. Focus particularly on the following problem: suppose the decision procedures that indirect normativity evaluates are themselves selected or revised through an idealised deliberative process. Does this generate a vicious circularity in which the normative standard presupposes the very procedures it is meant to assess, or can it be reconstructed as a virtuous, self-correcting loop? In your comparison, address how each framework deals with cases where an agent's actual, first-order preferences systematically diverge from those of her idealised counterpart, especially when the divergence involves trading long-term aggregate welfare against the immediate moral salience of particular relationships. Do not include bibliographies, reading lists, or citations.
