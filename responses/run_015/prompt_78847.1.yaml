answer: |-
  This is a sophisticated critique. Your intuition is correct: the jury duty analogy is a powerful *rhetorical* tool, but it is a weak *structural* map. It works to convince people that "ordinary citizens are capable," but it breaks down when you ask "what exactly are they doing?"

  Your teacher is using the jury analogy to solve the **competence objection** (can regular people understand complex issues?), but it smuggles in assumptions about **legitimacy** and **scope** that don't hold up.

  Here is the audit you asked for.

  ### Part 1: The Mapping Table

  Here is how the components of a criminal trial map onto a Citizens' Assembly (sortition), and where the mapping fails.

  | Component | Jury Duty (Adjudication) | Citizens' Assembly (Sortition/Legislation) | The Seam (Where it breaks) |
  | :--- | :--- | :--- | :--- |
  | **Selection** | Random from voter/DMV rolls. | Random from voter/DMV rolls (often stratified). | **Matches.** This is the strongest part of the analogy. |
  | **The Role** | Trier of *Fact*. | Trier of *Value* & *Policy*. | **Fails.** Juries decide what *happened*. Assemblies decide what *should happen*. |
  | **The Constraint** | Bound by existing law (instructions from judge). | Free to draft new law/policy. | **Fails.** Juries apply the rules; Assemblies write them. |
  | **The "Judge"** | Actual judge; rules on evidence & law. | Facilitators/Experts; advise but do not rule. | **Fails.** A judge can throw out a verdict if it violates law. Who throws out a bad law from an assembly? |
  | **The "Lawyers"** | Prosecution & Defense (adversarial). | Expert Witnesses & Advocates (testimonial). | **Fails.** Adversarial systems test truth. Testimonial systems can be captured by the loudest expert. |
  | **The Evidence** | Strict rules (hearsay, relevance, etc.). | Broad briefings, white papers, testimony. | **Fails.** Juries are protected from misinformation by rules. Assemblies are vulnerable to lobbying via "expert" selection. |
  | **The Verdict** | Guilty/Not Guilty (Binary/Limited). | Policy Design, Budget Allocation (Open-ended). | **Fails.** It is easier to agree on a fact than a complex budget trade-off. |
  | **Agreement** | Often Unanimous (or high majority). | Usually Majority or Supermajority. | **Fails.** Unanimity forces compromise. Majority rule allows 51% to dominate 49%. |
  | **Accountability** | None (cannot be punished for verdict). | None (terms are over before results are seen). | **Matches.** Both are insulated, but for different reasons. |
  | **Review/Appeal** | Judge can overturn; Higher court appeal. | Usually binding with no appeal, or sent to Parliament. | **Fails.** A bad jury verdict can be fixed. A bad law affects everyone until repealed. |
  | **Consent** | Defendant has Constitutional right to jury. | Citizens have no say in being governed by assembly. | **Fails.** The jury protects the accused *from* the state. The assembly *is* the state. |

  ### Part 2: The Structural Seams

  You identified the two biggest leaks: **Law Invention** and **Consent/Appeal**. Let's deepen that analysis.

  **1. Fact vs. Value (The Epistemic Seam)**
  Your teacher's pitch relies on the idea that deciding a verdict and deciding a tax rate are the same cognitive task. They aren't.
  *   **Jury:** "Did John pull the trigger?" This is a question of evidence. There is a correct answer, even if we can't perfectly know it. The rules of evidence are designed to filter noise to find that truth.
  *   **Assembly:** "Should we raise taxes to fund schools?" This is a question of values. There is no "correct" answer. It requires negotiation, philosophy, and compromise.
  *   **The Risk:** Ordinary people are generally good at judging credibility (fact). They are not necessarily good at systemic design (value). A jury doesn't need to understand the budget of the court system; an assembly *must* understand the budget of the nation.

  **2. The "Judge" Problem (The Constraint Seam)**
  In a trial, the jury is the engine, but the judge is the steering wheel and brakes. The judge says, "You cannot decide this based on race," or "The law says X, you must accept X."
  *   In a Citizens' Assembly, there is no judge. There are only facilitators. If the assembly decides to pass a law that violates human rights or bankrupts the state, who stops them?
  *   If you say "The Courts stop them," then the Assembly isn't sovereign; the Courts are. If you say "No one stops them," then you have removed the safeguard that makes jury duty safe.

  **3. Consent and Appeal (The Legitimacy Seam)**
  *   **Jury:** The legitimacy comes from the *defendant's* right. The state has immense power; the jury is a check *against* the state.
  *   **Assembly:** The assembly *wields* the state's power. If I am governed by a random panel, I have lost the ability to vote them out. In a jury, I am not governed by the jury; only the defendant is. In sortition, *everyone* is the defendant.
  *   **Appeal:** As you noted, if a jury hangs or verdicts wrongly, there are mechanisms (retrial, appeal). If an Assembly passes a disastrous law, the "appeal" is waiting 4 years for the next election (if elections still exist) or revolution.

  ### Part 3: The "One-Shot" Argument (Strongest or Weakest?)

  Your teacher leans on this: *No re-election means no corruption.*
  **Verdict:** This is the **strongest rhetorical point** but the **weakest practical point.**

  **Why it sounds strong:**
  It correctly identifies the disease: Career politicians optimize for re-election, not governance. They spend half their time fundraising. They avoid hard choices that might anger donors. A one-time citizen has no donor list to protect and no campaign to run.

  **Why it is actually weak:**
  Accountability is the price of power.
  *   **Feedback Loops:** If a politician makes a bad law, they might get voted out. This forces them to (theoretically) care about the outcome. If a sortition member makes a bad law, they are already home watching TV. They suffer no consequence.
  *   **Experience:** Governance is complex. A "one-and-done" system means you permanently have a government of beginners. You lose institutional memory.
  *   **The "Lame Duck" Problem:** If I know I am leaving in 6 months no matter what, why should I compromise? Why should I care about long-term consequences that won't hit until I'm back at my day job?

  The "one-shot" argument solves **corruption** but creates **irresponsibility.**

  ### Part 4: Is There a Better Analogy?

  The jury analogy is leaky because **governing is not judging.** There isn't a perfect everyday analogy because democratic governance is unique. However, here are two that might be more honest:

  **1. The "Focus Group that Ships"**
  *   **Concept:** Companies use random people to test products. They listen to them, but the executives make the final call.
  *   **Why it fits:** It acknowledges that regular people have good insights on what they *want*, but they don't necessarily know how to *engineer* it.
  *   **The Sortition Twist:** Sortition is like giving the focus group the keys to the factory. It highlights the risk: Customers know what they want, but they might ask for a car that can't be built safely.

  **2. A Constitutional Convention**
  *   **Concept:** A temporary body of people (sometimes elected, sometimes appointed) gathered to rewrite the fundamental rules, then they disband.
  *   **Why it fits:** This is historically what sortition actually resembles. It's not "jury duty"; it's a temporary legislature.
  *   **The Benefit:** It admits the stakes are high. We don't hold constitutional conventions every year. This acknowledges that sortition should probably be used for specific, high-level questions (like electoral reform or climate policy), not day-to-day budgeting.

  ### Part 5: Does the Analogy Survive?

  **No.** The analogy does not survive structural scrutiny.

  It survives as a **psychological bridge**. It is useful for getting people to overcome the bias that "only experts can govern." It proves that regular people can listen, deliberate, and decide serious matters.

  But it fails as a **blueprint**. It hides the fact that juries are tightly boxed in by procedure, while assemblies are not. It hides the fact that juries protect the individual from the state, while assemblies *become* the state.

  **How to push back in class:**
  You can respect the teacher's premise while dismantling the analogy. Try this:
  > "The jury analogy proves citizens are *capable* of deliberation, but it doesn't prove they should have *sovereignty*. A jury is a check on power, boxed in by a judge and laws they didn't write. An Assembly *is* the power, with no judge and no laws to box them in. If we use sortition, are we okay with removing the 'judge' (the constitution/courts) from the process, or are we actually proposing a hybrid where the Assembly proposes and the Courts/Elections decide?"

  This moves the conversation from "Are people smart enough?" (which the jury analogy wins) to "Where do the guardrails come from?" (which is the actual political question).
