      *   *Nuance:* Acknowledge that some modern Citizens' Assemblies *do* have facilitators and expert witnesses (acting somewhat like judges/lawyers), but they aren't bound by the same strictures.
      *   *Consent:* Clarify that jury duty is mandatory (subpoena), so "consent" is legal obligation, not voluntary agreement. But the *accused* consents to the process via the Constitution. In sortition, the governed don't have that constitutional guarantee of a jury for *laws*.

  10. **Final Polish:** Check tone. Ensure it sounds like a helpful tutor/analyst, not a debunker or a propagandist. (The user asked for an audit, so be objective).

  *(Self-Correction on the "Better Analogy" part)*: Is there a better everyday comparison?
