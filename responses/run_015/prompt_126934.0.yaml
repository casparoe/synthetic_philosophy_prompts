answer: |-
  # Q&A Preparation Sheet: Parfit's Hitchhiker & Rational Dispositions

  **Context:** Joint Philosophy–Economics Workshop.
  **Core Thesis:** Hitchhiker does not show rationality requires irrational dispositions. It shows payoffs track *detectability* (Snapshot vs. Profile). Rational agents can adopt high-payoff dispositions via commitment/planning.
  **Audience Constraint:** Most view "rationality" as payoff maximization; some view the case as a trivial screening problem.

  ---

  ## Part 1: The Eight Objections (Ordered by Damage)

  ### 1. The "Payoff Dominance" Objection (Behavioral Economist)
  **Idiom:** "If your definition of 'rationality' leads to the agent dying in the desert while the 'irrational' disposition survives, you've just defined rationality as losing. Why should we care about a normative notion that is payoff-dominated? In our models, rationality *is* expected utility maximization."
  **2-Minute Reply:**
  *   Distinguish *act-rationality* (in the desert) from *disposition-rationality* (ex ante).
  *   My claim: A fully rational agent *ex ante* adopts the disposition to pay.
  *   Therefore, the agent who survives isn't "irrational"; they are executing a rational plan.
  *   The "irrationality" only appears if you look at the snapshot in the desert *in isolation* from the plan.
  *   Don't throw out the normative concept; just locate it in the planning stage, not the execution stage.
  **Soft Spot:** If they insist the *act* in the desert must be payoff-maximizing to be rational, you cannot win without conceding the definition.
  **Strategic Concession:** Concede that if "rationality" is defined *solely* as local payoff maximization at $t_2$, then yes, paying is irrational. But argue this is a *bad* definition of rationality for agents with temporal extension.

  ### 2. The "Screening Problem" Objection (Mechanism Designer)
  **Idiom:** "This is just a signaling game with asymmetric information. The driver is screening for types. The 'disposition' is just a private type. You haven't told us anything new about rationality; you've just described a selection effect."
  **2-Minute Reply:**
  *   Agree it *can* be modeled as screening.
  *   But the philosophical lesson drawn from screening is usually "you need to change your type."
  *   My point: You don't need to change your *fundamental* preferences (become irrational); you need a *commitment device* or a plan that makes your type credible.
  *   The "irrationality" reading confuses the *signal* (the disposition) with the *underlying rationality* of sending that signal.
  **Soft Spot:** If the commitment device is costly, the "rational" agent might not buy it, returning us to the original dilemma.
  **Strategic Concession:** Concede that in a one-shot game without commitment tech, the "irrational" type wins. Insist this is a limitation of the *environment*, not a paradox of rationality.

  ### 3. The "Causal Arrow" Objection (Causal Decision Theorist)
  **Idiom:** "You're smuggling in Evidential Decision Theory (EDT). My decision to pay doesn't *cause* the driver to have picked me up. The prediction is in the past. Why should I pay if it changes nothing causally?"
  **2-Minute Reply:**
  *   This isn't about EDT vs. CDT on the *act*.
  *   It's about CDT on the *disposition selection*.
  *   Choosing to *be the kind of agent* who pays *does* causally influence the driver's prediction (because the prediction tracks the disposition).
  *   CDT recommends choosing the disposition that causes the good outcome, even if the specific act doesn't.
  **Soft Spot:** If the prediction is made *before* the disposition is fixed (in your timeline), the causal link breaks.
  **Strategic Concession:** Concede that if the prediction is temporally prior to *any* disposition formation, CDT says don't pay. Argue the case assumes the prediction tracks *stable character*, which exists prior to the specific trip.

  ### 4. The "Commitment Availability" Objection (General)
  **Idiom:** "You solve the problem by saying 'install a commitment device.' But Parfit's case is specifically designed so that no such device exists. You've solved a different problem."
  **2-Minute Reply:**
  *   The "no device" constraint is an empirical claim, not a conceptual necessity.
  *   My argument is that the *lesson* of Hitchhiker depends on that empirical constraint.
  *   If we treat it as a general lesson about rationality, we must ask: "What if commitment *were* possible?"
  *   Since commitment is possible in most real-world analogues (contracts, reputation), the "irrationality" lesson doesn't generalize.
  **Soft Spot:** The original thought experiment loses its bite if you change the constraints.
  **Strategic Concession:** Concede that in the *strict* Parfit case (no commitment, pure telepathy), the rational agent dies. Argue this makes it a bad case for general theories of rationality.

  ### 5. The "Time-Inconsistency" Objection (Behavioral Econ)
  **Idiom:** "This is just hyperbolic discounting. The agent at $t_1$ wants to pay, the agent at $t_2$ doesn't. We model this with quasi-hyperbolic parameters. Why do we need 'snapshot vs. profile'?"
  **2-Minute Reply:**
  *   Time-inconsistency assumes a conflict between selves.
  *   My "Profile" view assumes a *unified* agent whose rationality is assessed over the whole trajectory.
  *   The "irrationality" reading relies on privileging the $t_2$ self's perspective.
  *   I'm arguing the $t_1$ self's plan is the locus of rationality.
  **Soft Spot:** If the $t_2$ self has different information or preferences, privileging $t_1$ is controversial.
  **Strategic Concession:** Concede that if preferences genuinely change (not just resolve), there is a conflict. Argue Hitchhiker assumes stable preferences (wanting to live), just weak will.

  ### 6. The "Intentional Content" Objection (Philosopher of Action)
  **Idiom:** "You say the agent intends to pay. But if they know that at $t_2$ they won't pay, isn't the intention at $t_1$ insincere? You can't intend what you believe you won't do."
  **2-Minute Reply:**
  *   Distinguish *intention to act* from *intention to cultivate a disposition*.
  *   At $t_1$, I intend to *make it the case* that I pay (via commitment/character).
  *   The content of the intention is "I will be a payer," not necessarily "I will pay without support."
  *   This fits the "plans as elements of intention" view your colleagues hold.
  **Soft Spot:** If the commitment device fails, did you really intend to pay?
  **Strategic Concession:** Concede that without a commitment device, the intention is fragile. Argue fragility $\neq$ irrationality.

  ### 7. The "Empirical Premise" Objection (Experimentalist)
  **Idiom:** "You claim drivers track 'profile-visible' dispositions. But psychology shows we read micro-expressions (snapshot). If drivers read snapshots, your distinction collapses."
  **2-Minute Reply:**
  *   This is an empirical bet, not a conceptual one.
  *   Even if they read snapshots, a snapshot often *reveals* the profile (e.g., confidence, lack of guilt).
  *   If they truly read only snapshots, then Hitchhiker is just a lie-detection test, not a decision problem.
  *   My normative point holds: if they *could* read profiles (reputation), rationality works.
  **Soft Spot:** If the audience believes snapshot-reading is the only mechanism, your solution looks unrealistic.
  **Strategic Concession:** Concede that in low-stakes one-offs, snapshots dominate. Argue high-stakes (life/death) triggers profile assessment (character judgment).

  ### 8. The "Triviality" Objection (Skeptic)
  **Idiom:** "So your conclusion is: 'Plan ahead.' That's not a paper, that's advice. What's the theoretical contribution?"
  **2-Minute Reply:**
  *   The contribution is negative: stopping the inference that "Rationality $\rightarrow$ Irrational Dispositions."
  *   This blocks a specific argument used to justify non-standard decision theories.
  *   It clarifies the boundary between empirical detectability and normative status.
  **Soft Spot:** It might feel deflationary.
  **Strategic Concession:** Accept it is deflationary. Argue deflation is needed to clear up confusion in the literature.

  ---

  ## Part 2: Strategic Concessions (Give these early)

  **Do not wait to be cornered on these points. Offer them in your opening remarks or first answer to signal good faith.**

  1.  **Concede the Definition of "Rationality":** Acknowledge immediately that for the economists in the room, "rationality" = "payoff maximization." State clearly: *"I am not trying to convince you to abandon payoff maximization. I am arguing that payoff maximization is best achieved by a disposition that looks 'irrational' only if you ignore the planning stage."*
  2.  **Concede the "Strict" Case:** Admit that in the *exact* Parfit scenario (no commitment, perfect prediction of the specific act), the causal decision theorist is right: you die. *"My argument is that this specific setup is a pathological edge case, not the general lesson for rational agency."*

  ---

  ## Part 3: The Dreaded Question

  **The Question:**
  *"If the rational agent ex ante chooses the disposition to pay, doesn't that make the act of paying ex post rational by definition? You haven't shown that rationality doesn't require irrationality; you've just moved the label 'rational' to the earlier time step. Isn't this just verbal stipulation?"*

  **Why it's dangerous:** It collapses your distinction between Snapshot and Profile. If the *plan* makes the *act* rational, then there is no tension between rationality and payoff. But if there is no tension, your paper's title ("...gives no support to the claim...") is trivial. It suggests you haven't solved the paradox, just renamed the variables.

  **Defense Strategy (Do not hope this goes unnoticed):**
  *   **Step to Defend:** The **Normative Independence of the Act**.
  *   **Argument:** "It is not verbal stipulation. It is a claim about *where* normative assessment applies. If we assess the act *in isolation* (Snapshot), it is payoff-minimizing (cost \$100, no benefit). If we assess the *plan* (Profile), it is payoff-maximizing.
  *   **The Kicker:** The 'irrationality' claim relies on the assumption that the *act* must be independently rational. I am arguing that for disposed agents, the *unit of rational assessment* is the trajectory, not the snapshot.
  *   **Closing:** "So it's not that I'm moving the label. It's that the 'irrationality' reading makes a category mistake about the unit of agency. The act isn't 'rational' in isolation; the *agent* is rational over time."
