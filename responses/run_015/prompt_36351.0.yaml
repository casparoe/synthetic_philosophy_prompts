answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON PERSONAL IDENTITY**
  **Department of Philosophy, Spring Term**
  **Signatories:** [Name Redacted] (Proponent of *Anatta* / Buddhist Reductionism)
  **Signatories:** [Name Redacted] (Proponent of Psychological Continuity)

  **I. SUBSTANTIVE AGREEMENTS**

  The undersigned, having completed a structured review of classical and contemporary arguments regarding personal identity, affirm the following claims as jointly held positions. These claims are intended to mark the boundary of settled ground and to acknowledge specific tensions that remain unresolved.

  1.  **The Cartesian Elimination:** We agree that the historical dispute regarding the existence of a permanent, indivisible, immaterial soul (Cartesian ego) is concluded. Both parties deny the existence of such an entity. Consequently, the portion of our historical dispute concerning the *location* or *substance* of a soul is declared merely verbal and evaporates; neither party posits an owner distinct from the physical and psychological processes.
  2.  **The Residual Substantive Dispute:** We agree that the surviving disagreement is not about the existence of causal continuity, which both accept, but about the *ontological status* of the unity imposed upon that continuity. The dispute is whether psychological continuity constitutes a mind-independent relation that grounds identity (Continuity View) or whether it is a pragmatically useful but ultimately empty conceptual designation imposed upon a flux of aggregates (*Anatta* View).
  3.  **Fission and Teletransportation:** We agree that in cases of fission (e.g., hemispheric separation resulting in two psychologically continuous successors) or destructive teletransportation, strict numerical identity does not hold. We further agree that in such cases, what matters for prudential concern survives even where identity does not.
      *   *Concession by Continuity Proponent:* We record that this admission renders the label "Personal Identity" potentially misleading, as the relation grounding concern in fission cases fails the transitivity requirement of identity. This suggests the theory describes "survival" rather than "identity" in the strict logical sense.
  4.  **The Milindapañha Chariot Analysis:** We agree that the chariot analogy (naming a convention based on parts) successfully dissolves the search for a simple substance but does not settle the metaphysical weight of the convention. It clarifies *how* we speak of persons, but not *why* such speech carries normative force if the referent is merely a label.
  5.  **Karma and Responsibility:** We agree that the denial of a self does not logically entail the denial of causal efficacy; actions have consequences regardless of an owner.
      *   *Concession by Anatta Proponent:* We record that explaining why *specific* future aggregates deserve the praise or blame of *specific* past aggregates, without a robust continuity relation, places a heavy burden on the *Anatta* view to explain the coherence of long-term responsibility without reintroducing a "conventional owner" that functions identically to a self.
  6.  **Classical Arguments:** We agree that Locke's memory criterion fails without a causal constraint, and that Hume's bundle theory fails to explain the *sense* of unity without appealing to imaginative association. Neither classical argument alone is sufficient; a hybrid account of causal psychological connection is required by both parties, differing only in interpretation.

  **II. TABLE OF REMAINING DISAGREEMENTS**

  The following table enumerates the precise points of divergence. The wording in Column A is endorsed by the *Anatta* Proponent as an accurate statement of her view. The wording in Column B is endorsed by the Continuity Proponent as an accurate statement of his view.

  | Point of Contention | Column A (*Anatta* / Buddhist Reductionism) | Column B (Psychological Continuity) |
  | :--- | :--- | :--- |
  | **1. Nature of Continuity** | Psychological continuity is a descriptive summary of causal processes; it is not a "further fact" that binds moments together. It is a useful fiction, not a metaphysical glue. | Psychological continuity is a genuine, mind-independent relation constituted by overlapping chains of memory and intention. It is the ontological ground of personhood, not merely a description. |
  | **2. Ethical Grounding** | Moral responsibility and prudential concern are grounded in compassion and social convention. They do not require a metaphysical "self" to be coherent, only a causal stream. | Moral responsibility and prudential concern are grounded in the special relation of psychological identity. This relation justifies why *I* should care about *my* future in a way I do not care about others'. |
  | **3. Narrative Self** | The narrative self is a practical accomplishment and a cognitive error. It is something we construct to navigate the world, which meditation reveals to be absent. | The narrative self is a metaphysical discovery (or constitutive element) of the person. It is the structure by which the mind organizes time, and its presence is a condition of agency. |
  | **4. Meditation Data** | The reported absence of self in sustained meditation is evidence of the self's nonexistence. The phenomenology tracks the ontology. | The reported absence of self in sustained meditation is evidence of a change in the *sense* of self, not the self's ontology. The causal chain persists even if the model of ownership is suppressed. |

  **III. CRUCES AND PREDICTIONS**

  To resolve the disagreements listed above, the undersigned agree that the following specific cases and arguments constitute the decisive tests (Cruxes) for their respective positions. Each party records a prediction regarding what these tests will demonstrate.

  **Crux 1: The Phenomenological Ontology Test**
  *   **The Case:** A longitudinal neurophenomenological study of advanced meditators reporting "non-self" states, correlated with real-time fMRI monitoring of the Default Mode Network (DMN) and narrative processing centers.
  *   **The Question:** Does the suppression of the DMN correlate with the disappearance of the *mechanisms of continuity* (memory/intention linking), or only the *feeling* of ownership?
  *   **Prediction (*Anatta* Proponent):** Deepening practice will show a decoupling of causal processes from the *attribution* of ownership, eventually revealing that the "linking" itself was dependent on the conceit of "I." The absence of the sense is evidence of the absence of the referent.
  *   **Prediction (Continuity Proponent):** Practice will show the suppression of the *model* of ownership (DMN activity), while the causal transfer of memory and intention remains intact. The absence of the sense is evidence only of a quieted cognitive monitor, not the dissolution of the person.

  **Crux 2: The No-Branching Constraint**
  *   **The Case:** The "Hemispheric Fission" thought experiment, specifically analyzing the moment *before* the split. If the procedure is announced, does the subject have reason to fear *two* deaths, *one* death, or *no* death?
  *   **The Question:** Is the "no-branching" rider (required to maintain identity in continuity theory) a principled constraint on what identity *is*, or an ad hoc patch to save the intuition of uniqueness?
  *   **Prediction (*Anatta* Proponent):** The subject's concern will be indifferent to the branching logic, focusing only on the causal welfare of the successors. This reveals the "no-branching" rule is an ad hoc patch; the underlying reality was never identity-shaped, only concern-shaped.
  *   **Prediction (Continuity Proponent):** The subject will report that "survival" is secured but "identity" is lost. This confirms the "no-branching" rule is a principled constraint: identity is a one-to-one relation, but what matters (survival) can be one-to-many. The account holds, provided we distinguish identity from survival.

  **ACKNOWLEDGEMENT**

  We sign this document to acknowledge that while we share a common ontology of processes (denying the soul), we remain divided on the metaphysics of the person (affirming vs. denying the reality of continuity). We agree to treat the predictions in Section III as falsifiable commitments to be reviewed at the conclusion of the seminar series.

