prompt: |-
  I work as an auditor for a mid-sized seafood certification scheme — three of us, roughly 120 farm audits a year between us, mostly tropical shrimp and finfish operations in Southeast Asia and Latin America. My training is in fish health, not philosophy, but animal welfare has become the section of the audit that our retailer and NGO board members fight over, and I am the one who has to turn whatever we decide into something a field auditor can actually execute. The constraints are unglamorous: half a day per site, usually with a translator and a farm manager who decides which ponds I see; a bucket, a thermometer, a phone camera and no lab; about forty minutes of the visit for welfare; and a written finding that has to survive both a retailer's lawyer and an NGO campaigner reading the same paragraph. One of my two junior auditors has no training in animal-based indicators at all, and since the UK's Animal Welfare (Sentience) Act 2022 brought vertebrates and some invertebrates — octopuses and decapods among them — within the scope of sentience law, the board has started asking why our standard treats shrimp so differently from salmon, and I have no principled answer to give them.

  What I need is a decision procedure, not a position paper: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in an automatic no, and where it stops and hands the decision to a person because the disagreement is really about what welfare is — felt experience, or health and normal function, or the chance to live a reasonably natural life. I have a draft I want you to stress-test, rewrite and reorder rather than accept: (1) a capacity-gap default, saying that where we cannot establish whether a taxon has the affective capacity a practice would engage, we score the practice against the more demanding plausible capacity rather than the one the producer assumes absent; (2) a detectability constraint, saying no requirement is admissible unless an auditor can verify compliance and detect non-compliance within a forty-minute visit, and that anything failing this must be labelled as paperwork or self-declaration rather than dressed up as an inspection; (3) a two-account rule, keeping lifetime welfare (roughly, time spent in aversive states) separate from the death itself, with the two non-compensable in both directions, plus whatever aggregation rule makes partial credit possible; (4) a rule for slaughter that immobility is not insensibility, specifying what field-observable evidence of insensibility would count and what to do when no such evidence exists for the taxon in front of me. Tell me which of these survive translation into an audit, which should be deleted, and what is missing.

  Then run the procedure on three real-shaped cases and give a committed verdict on each. First: a whiteleg shrimp hatchery that eyestalk-ablates its broodstock to induce spawning and now wants credit because it has started applying a topical anaesthetic first, with no data on whether the anaesthetic works in that tissue or how long it lasts. Second — the one where I expect to dislike the answer: a grow-out shrimp farm that harvests into an ice slurry and argues that thermal shock is a stun, and which our current standard gives full credit; the neighbouring farm installed an electrical stunner and gets the same credit, and I need to know how an auditor with no instruments distinguishes an animal that has stopped moving from one that cannot feel, and whether either farm passes. Third: a tilapia operation with excellent water quality and very low mortality but chronic crowding and a harvest sequence in which fish are crowded, lifted, and left in air for several minutes before killing. Be committed throughout: tell me which draft rules to keep and which to throw out, take a definite position on all three cases and on whether the chill-kill credit survives, and mark explicitly which steps of the procedure are genuine evidence and which are value judgements wearing a clipboard — along with an honest account of the cases where this procedure will misfire and what it simply cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Auditor for a mid-sized seafood certification scheme.
      *   **Team:** 3 auditors, 120 audits/year (40 each).
      *   **Scope:** Tropical shrimp and finfish (SE Asia, LatAm).
      *   **Constraints:** Half-day per site, 40 mins for welfare, limited tools (bucket, thermometer, camera, phone), translator dependency, farm manager controls access.
      *   **Pressure:** Retailer lawyers vs. NGO campaigners, UK Animal Welfare (Sentience) Act 2022 implications (decapods included), junior auditor lacks training.
      *   **Goal:** A *decision procedure* (operational tool), not a philosophy paper. Needs to be actionable, defensible, and honest about limitations.
      *   **Input:** A draft 4-point procedure (Capacity-gap default, Detectability constraint, Two-account rule, Slaughter rule).
      *   **Task:** Stress-test, rewrite/reorder, decide what to keep/drop, identify missing elements, run on 3 specific cases, provide committed verdicts, distinguish evidence vs. value judgments, admit failure modes.

  2.  **Evaluate the Draft Procedure:**
      *   *(1) Capacity-gap default:* "Score against more demanding plausible capacity."
          *   *Pros:* Precautionary principle. Aligns with Sentience Act.
          *   *Cons:* In an audit context, "plausible capacity" is vague. If we assume shrimp feel pain like salmon, does the standard collapse? It might be too resource-intensive for a 40-minute window if it requires deep biological verification. However, for the *purpose of the standard*, it's a necessary policy stance.
          *   *Verdict:* Keep, but refine for operational clarity. It's a policy setting, not a field test.
      *   *(2) Detectability constraint:* "No requirement unless verifiable in 40 mins."
          *   *Pros:* Crucial for audit integrity. Prevents "paperwork welfare."
          *   *Cons:* Some welfare issues (chronic stress) aren't instantly visible.
          *   *Verdict:* Keep. This is the core constraint of the user's reality. Needs to distinguish between *Observation*, *Record Review*, and *Unverifiable*.
      *   *(3) Two-account rule:* "Lifetime welfare vs. Death." Non-compensatory.
          *   *Pros:* Prevents "good life justifies bad death."
          *   *Cons:* "Lifetime welfare" is impossible to audit in a 40-minute snapshot. You only see a snapshot.
          *   *Verdict:* Modify. You can't audit "lifetime." You audit *current state indicators* and *slaughter process*. Split into "On-farm Condition" and "Harvest/Slaughter."
      *   *(4) Slaughter rule:* "Immobility $\neq$ Insensibility."
          *   *Pros:* Scientifically accurate. Critical for the ice slurry issue.
          *   *Cons:* Requires knowing *what* counts as evidence of insensibility for specific taxa.
          *   *Verdict:* Keep and strengthen. This is the technical core.

  3.  **Identify Missing Elements:**
      *   **Taxon-Specific Protocols:** Shrimp vs. Fish need different indicators. One procedure doesn't fit both without branching.
      *   **The "Unknown" Protocol:** What to do when science is unsettled (e.g., shrimp anesthesia).
      *   **Auditor Safety/Liability:** If an auditor claims insensibility and is wrong, who is liable?
      *   **The "Pass/Fail" Threshold:** How many non-compliances trigger a failure?

  4.  **Develop the Revised Decision Procedure:**
      *   Need to order it logically: Policy -> Feasibility -> Observation -> Verdict.
      *   *Step 1: Taxon & Capacity Class.* (Policy level).
      *   *Step 2: Verifiability Filter.* (Can I see this in 40 mins?).
      *   *Step 3: The Two-Track Assessment.* (Condition vs. Slaughter).
      *   *Step 4: The Slaughter Threshold.* (Insensibility criteria).
      *   *Step 5: The Precautionary Override.* (When in doubt, fail).

  5.  **Stress-Test the Cases:**

      *   *Case 1: Shrimp Hatchery (Eyestalk Ablation + Anesthetic).*
          *   *Issue:* Efficacy of anesthetic unknown.
          *   *Application:* Capacity-gap default says assume they feel pain. Detectability says can't verify anesthetic efficacy in 40 mins.
          *   *Verdict:* Fail/No Credit. Paperwork claim only.
      *   *Case 2: Shrimp Harvest (Ice Slurry vs. Electrical).*
          *   *Issue:* Thermal shock vs. Electrical stun. Immobility in ice is often paralysis, not insensibility.
          *   *Application:* Slaughter rule (Immobility $\neq$ Insensibility). Detectability (Auditor has no EEG).
          *   *Verdict:* Ice slurry fails the "Insensibility" test without specific time/temp data. Electrical passes *if* parameters are verified. Current standard giving full credit to ice is scientifically weak.
      *   *Case 3: Tilapia (Good Water, Bad Harvest).*
          *   *Issue:* Chronic crowding (hard to verify in snapshot) vs. Air exposure (easy to verify).
          *   *Application:* Two-track. Condition (Water good, crowding hard to prove). Slaughter (Air exposure = suffocation/stress).
          *   *Verdict:* Fail on Slaughter track. Good condition doesn't compensate for bad death.

  6.  **Drafting the Response:**
      *   *Tone:* Professional, direct, pragmatic, acknowledging the "unglamorous constraints." No fluff.
      *   *Structure:*
          1.  Critique of Draft Rules (Keep/Modify/Drop).
          2.  The Revised Procedure (The "Tool").
          3.  Case Studies (Applied Verdicts).
          4.  Limitations & Failure Modes (Honesty section).
      *   *Key Distinction:* Explicitly mark "Evidence" vs. "Value Judgment."

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about telling them to measure water quality. But the prompt says 40 mins for welfare, limited tools. I need to emphasize *behavioral* indicators over *chemical* ones where possible, or rely on *records* for water quality.
      *   *Correction on Shrimp Sentience:* The UK Act includes decapods. The procedure must treat them as sentient *for the purpose of the audit*, regardless of the auditor's personal belief.
      *   *Correction on Ice Slurry:* It's not just "ice." It's the *time to insensibility*. If it takes 3 minutes to die in ice, they feel it. If electrical is instant, it's better. The auditor can't measure time-to-insensibility easily. So the rule must be: "Validated Protocol" vs. "Observed Outcome."
      *   *Refining the "Two-Account":* The user called it "lifetime." I need to correct that to "On-Farm Phase" vs. "Harvest Phase." An auditor cannot audit "lifetime."
      *   *Refining the "Capacity Gap":* This is a board-level decision, not an auditor decision. The auditor applies the standard. The procedure should tell the auditor *how to apply* the standard given the capacity assumption.

  8.  **Final Polish:**
      *   Ensure the "Value Judgment" tags are clear.
      *   Make sure the verdicts are committed (Pass/Fail/Conditional).
      *   Address the "Junior Auditor" constraint (needs to be simple enough for them).

  9.  *(Final check against prompt requirements)*:
      *   Decision procedure? Yes.
      *   Stress-test draft rules? Yes.
      *   Run on 3 cases? Yes.
      *   Committed verdicts? Yes.
      *   Evidence vs. Value Judgment marked? Yes.
      *   Failure modes admitted? Yes.

  10. **Proceed to generate output.** (Mental outline complete).
answer: |-
  This is a high-stakes operational problem. You are asking for a tool that bridges the gap between evolving ethical philosophy and the muddy reality of a 40-minute farm walk. Your draft rules are conceptually strong but operationally dangerous in their current form. Specifically, the "Capacity-gap default" is a policy decision for your Board, not a field test for your junior auditor, and the "Two-account rule" risks demanding data (lifetime welfare) that does not exist on site.

  Below is the stress-test of your draft, the revised decision procedure, the application to your three cases, and the honest limitations of what this tool can achieve.

  ### Part 1: Stress-Test of Draft Rules

  **1. Capacity-Gap Default ("Score against more demanding plausible capacity")**
  *   **Verdict:** **Keep, but relocate.**
  *   **Reasoning:** This is not a field rule; it is a *Standard Setting* rule. An auditor cannot determine "plausible capacity" in the field. If the Board has not defined the sentience status of *Litopenaeus vannamei* (whiteleg shrimp) in the written standard, the auditor cannot invent it.
  *   **Modification:** This becomes **Step 0: The Sentience Baseline.** The Standard must explicitly state: "For the purpose of this audit, Decapod Crustaceans are treated as sentient vertebrates." The auditor does not decide this; they enforce it.

  **2. Detectability Constraint ("No requirement unless verifiable in 40 mins")**
  *   **Verdict:** **Keep and Strengthen.**
  *   **Reasoning:** This is your primary liability shield. If you cannot verify it, certifying it is fraud.
  *   **Modification:** Split into **Direct Observation** (auditor sees it), **Record Verification** (auditor checks logs/calibration), and **Excluded** (cannot be verified, must be removed from the score).

  **3. Two-Account Rule ("Lifetime welfare" vs. "Death")**
  *   **Verdict:** **Modify Heavily.**
  *   **Reasoning:** "Lifetime welfare" is impossible to audit in a snapshot. You cannot know the history of the shrimp in the pond.
  *   **Modification:** Rename to **Phase Separation: Husbandry vs. Harvest.**
      *   *Husbandry:* Current condition (mortality, deformities, behavior, water logs).
      *   *Harvest:* The killing process.
      *   *Non-Compensatory:* A pass in Husbandry cannot cure a fail in Harvest. This is operationally sound.

  **4. Slaughter Rule ("Immobility is not insensibility")**
  *   **Verdict:** **Keep and Operationalize.**
  *   **Reasoning:** This is the critical technical failure point in your current scheme.
  *   **Modification:** Requires a specific **Proxy Indicator List** for each taxon. If the proxy is missing, the default is "Sensible."

  **Missing Element:** **The Precautionary Stop.**
  You need a rule for when the science is contested (e.g., shrimp anesthetic efficacy). If the producer claims a mitigation but cannot prove efficacy, the audit must default to the *unmitigated* risk.

  ---

  ### Part 2: The Revised Decision Procedure (v1.0)

  **Objective:** Convert ethical ambiguity into binary audit findings (Pass/Fail/Non-Conformance) within 40 minutes.

  **Step 0: The Sentience Baseline (Board Policy)**
  *   **Rule:** The Standard defines the taxon's capacity. The auditor does not debate sentience.
  *   **Current Status:** If your Standard treats shrimp differently from salmon without biological justification, **your Standard is non-compliant with the UK Sentience Act logic.** You must align them for the purpose of the audit.
  *   **Action:** Treat shrimp as sentient.

  **Step 1: The Detectability Filter (Field Triage)**
  *   **Question:** Can I verify this claim within 40 minutes using eyes, camera, or existing logs?
  *   **Yes:** Proceed to Step 2.
  *   **No:** Classify as "Unverifiable Claim." It cannot contribute to a Pass score. It is either a "Paperwork Only" item or a Non-Conformance if claimed as verified.
  *   **Value Judgment:** Deciding what counts as "verification" (e.g., is a manager's signature enough?).
  *   **Evidence:** The physical presence of the tool/log/animal state.

  **Step 2: Phase Separation (Husbandry vs. Harvest)**
  *   **Rule:** Scores are calculated separately. A high Husbandry score cannot offset a Harvest Fail.
  *   **Husbandry Indicators (Snapshot):** Mortality records (last cycle), visible deformities (sample 20 animals), crowding behavior (avoidance/aggression), water parameters (logged vs. measured).
  *   **Harvest Indicators:** Time to insensibility, method validation, handling during lift.

  **Step 3: The Insensibility Threshold (Harvest Only)**
  *   **Rule:** Cessation of movement is insufficient evidence of unconsciousness.
  *   **Requirement:** Evidence must show the *nervous system* is inhibited, not just the *muscles*.
  *   **Proxy Indicators (Field Observable):**
      *   *Fish:* Operculum cessation + no response to tail pinch + corneal reflex loss.
      *   *Shrimp:* No pleopod movement + no response to tactile stimulus on antennae + specific time/temp exposure validated by data.
  *   **Default:** If no proxy is observable and no validated data exists, assume the animal is **Sensible.**

  **Step 4: The Precautionary Override (Mitigation Claims)**
  *   **Rule:** If a producer claims a mitigation (e.g., anesthetic, specific stun), they bear the burden of proof.
  *   **Requirement:** Peer-reviewed data or validated in-situ testing showing efficacy *for that species and tissue*.
  *   **Default:** If efficacy is unknown or unproven, score the risk as **Unmitigated.**

  ---

  ### Part 3: Case Applications & Committed Verdicts

  Here is the procedure applied to your three cases. I have marked **[E]** for Evidence-based steps and **[V]** for Value Judgments/Policy decisions.

  #### Case 1: Shrimp Hatchery (Eyestalk Ablation + Topical Anesthetic)
  *   **Context:** Eyestalk ablation is invasive. Producer applies anesthetic but has no efficacy data.
  *   **Step 0 (Sentience):** Shrimp treated as sentient. Ablation engages pain pathways. **[V]**
  *   **Step 1 (Detectability):** Auditor can see the ablation. Auditor can see the bottle of anesthetic. Auditor *cannot* verify if it works in 40 mins. **[E]**
  *   **Step 4 (Precautionary Override):** Producer claims mitigation. Burden of proof is on them. No data on tissue absorption or duration.
  *   **Verdict:** **Non-Conformance (Major).**
  *   **Reasoning:** Under the Precautionary Override, an unproven anesthetic is treated as *no anesthetic*. The procedure treats this as an unmitigated invasive procedure on a sentient animal.
  *   **Audit Note:** "Mitigation claim unverifiable. Scored as unanesthetized ablation per Step 4."

  #### Case 2: Shrimp Harvest (Ice Slurry vs. Electrical Stunner)
  *   **Context:** Farm A uses ice slurry (current standard gives credit). Farm B uses electrical stunner. Auditor has no instruments.
  *   **Step 0 (Sentience):** Shrimp are sentient. Thermal shock causes nociception. **[V]**
  *   **Step 3 (Insensibility Threshold):**
      *   *Ice Slurry:* Immobility in ice is often cold paralysis, not insensibility. Recovery is possible if warmed. Time to death varies by size/salinity. Without specific time/temp logs proving irreversible insensibility before processing, the default is **Sensible**. **[E/V]** (Science says paralysis $\neq$ death; Value says we require proof).
      *   *Electrical:* Requires validation of voltage/frequency. If the machine has a log/setting that matches validated parameters, it passes Step 1.
  *   **Verdict:**
      *   **Farm A (Ice Slurry):** **Fail (Harvest Phase).** Current standard giving full credit is scientifically indefensible under Step 3. Immobility is not insensibility. Without proof of time-to-death < X seconds, it is a Non-Conformance.
      *   **Farm B (Electrical):** **Pass (Conditional).** Only if the settings are logged and match a validated protocol. If the auditor cannot verify the settings against a protocol, it also fails Step 1.
  *   **Recommendation:** You must revoke automatic credit for ice slurry in your standard. It violates the "Immobility $\neq$ Insensibility" rule.

  #### Case 3: Tilapia (Good Water, Air Exposure Harvest)
  *   **Context:** Excellent husbandry. Harvest involves crowding, lifting, air exposure for minutes before killing.
  *   **Step 2 (Phase Separation):**
      *   *Husbandry:* Water quality logs good. Low mortality. Visible health good. **Pass.** **[E]**
      *   *Harvest:* Fish left in air for minutes. Suffocation is a prolonged stressor. Gills collapse, hypoxia occurs while conscious. **[E]**
  *   **Step 3 (Insensibility Threshold):** Air exposure is not a stun. It is a cause of death. If they are moving/gasping, they are sensible.
  *   **Rule:** Non-Compensatory. Good Husbandry cannot offset Bad Harvest.
  *   **Verdict:** **Fail (Overall Certification).**
  *   **Reasoning:** The Harvest Phase is a critical control point. Suffocation violates the Slaughter Rule. The excellent water quality is irrelevant to the death event.
  *   **Audit Note:** "Husbandry Pass. Harvest Fail. Certification Denied per Step 2 (Non-Compensatory)."

  ---

  ### Part 4: Evidence vs. Value Judgments (The "Clipboard" Audit)

  To protect your auditors (especially the junior one), you must label where the science ends and the policy begins.

  | Procedure Step | Nature | Who Decides? | Auditor Action |
  | :--- | :--- | :--- | :--- |
  | **Sentience Baseline** | **Value Judgment [V]** | **Board / Standard Owner** | Apply the rule. Do not debate. |
  | **Detectability Filter** | **Evidence [E]** | **Auditor** | "Can I see it?" If no, mark Unverifiable. |
  | **Phase Separation** | **Value Judgment [V]** | **Standard Owner** | Ensure scores don't bleed between phases. |
  | **Insensibility Proxies** | **Evidence [E]** | **Science / Standard** | Check for reflex/movement. If present = Fail. |
  | **Precautionary Override** | **Value Judgment [V]** | **Standard Owner** | If no proof of efficacy, assume failure. |

  **The Critical Friction Point:**
  The "Insensibility Proxy" for shrimp in ice is the weakest link.
  *   **Evidence:** Shrimp is still.
  *   **Value Judgment:** "Stillness in ice is not proof of unconsciousness."
  *   **Audit Reality:** The auditor cannot measure neural activity.
  *   **Solution:** The Standard must require **Process Validation** (records showing time/temp to death) rather than **Outcome Observation** (looking at the shrimp). If the records are missing, the audit fails. This shifts the burden to the farmer to prove their ice slurry works, which solves the auditor's lack of instruments.

  ### Part 5: Failure Modes & Limitations

  You asked for an honest account of where this will misfire.

  1.  **The "Snapshot" Problem (Husbandry):**
      *   **Failure:** You are auditing a 4-month cycle in 40 minutes. You will miss chronic stress that isn't visible on the day (e.g., ammonia spikes last week).
      *   **Mitigation:** Rely heavily on mortality logs and feed conversion ratios. High mortality = poor welfare, usually. But this is a proxy, not a direct measure.
      *   **Honesty:** You are certifying *management systems*, not actual animal experience.

  2.  **The "Translator/Manager" Filter:**
      *   **Failure:** The farm manager shows you the best ponds. The translator softens the worker's answers.
      *   **Mitigation:** Randomize pond selection *before* arrival if possible. Require worker interviews without management present (hard in small farms).
      *   **Honesty:** Your Detectability Constraint admits this. If you can't see it, you mark it Unverifiable. You must be willing to fail a farm for "Lack of Transparency" if access is restricted.

  3.  **The Shrimp Science Gap:**
      *   **Failure:** We simply do not know enough about decapod nociception to set perfect thresholds.
      *   **Mitigation:** The Precautionary Override. It is better to fail a farm for being "too risky" than to pass a farm that is "probably okay."
      *   **Honesty:** This will anger producers. Your Board must back the auditors when they apply the Precautionary Override.

  4.  **The Junior Auditor Risk:**
      *   **Failure:** A junior auditor might not recognize "abnormal behavior" in shrimp.
      *   **Mitigation:** Photo guides. "Normal vs. Abnormal" laminated cards.
      *   **Honesty:** Training is required. The procedure reduces discretion, but doesn't eliminate the need for biological literacy.

  ### Final Recommendation

  1.  **Adopt the Revised Procedure.** It aligns with the UK Sentience Act logic without requiring your auditors to be philosophers.
  2.  **Change the Standard on Ice Slurry.** Stop giving automatic credit. Require validated time-to-insensibility data. If they don't have it, they fail the Harvest Phase.
  3.  **Enforce Phase Separation.** Do not let good water quality excuse suffocation. This is the only way to answer the NGO board members who care about death, and the retailers who care about brand risk.
  4.  **Empower the "Unverifiable" Tag.** Give your auditors permission to say "I cannot check this" without it being a failure of *their* competence. It is a failure of the *system's* design.

  This procedure shifts the burden of proof from the auditor (who has a thermometer and 40 minutes) to the producer (who has the data and the animals). That is the only way this survives a lawyer and a campaigner reading the same report.
