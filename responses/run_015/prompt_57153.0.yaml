answer: |-
  1. **The speech**

  Good morning. Welcome to the kickoff. We are here for two days to agree on a shared vocabulary. This sounds dry, but it is the only way the next five years work. We know the risk. When one half of this room attributes the mortality curve to the pathogen, they mean transmission dynamics. When the other half hears it, they hear a sentence where no one built the tenements or cut the quarantine budget. Conversely, historians sometimes write an outbreak as though it were purely a story about power, with the biology as set dressing you could swap out for a different microbe and change nothing. We have all written abstracts where the grammar works perfectly but the meaning fractures depending on who reads it. That is the joke, and it is on us.

  Our goal is not to adjudicate. It is to stay in the room. To do that, we need two tools. The first is the exposure question. Behind nearly any claim where a germ or a climate appears to cause an outcome, there is a prior fact about who was standing where. Somebody usually arranged that arrangement. If you ask who was exposed and who made that arrangement, the sentence either gains a mechanism or turns out to have been an alibi. We need to find the mechanism. This stops us from hiding behind forces we cannot measure. It forces us to locate the human hand that placed the body in the path of the risk.

  The second tool is the substitution test. Take your claim. Rewrite it with the non-human term replaced by the human decisions that set the exposure. See what is left. If nothing remains, the germ was decoration. If the rewritten sentence comes out false or empty in a way you can point to, then the non-human term was carrying real weight. You keep it. This prevents the biology from becoming invisible background noise. It forces us to specify the interaction. We are not asking if the biology matters. We are asking how much work it is doing in this specific sentence.

  Now, I will break my own rule for a moment to show you why the rule exists. Let us say the volcano cast a vote on the harvest. I am letting the mountain have intention here. Now watch me take it back. Run the substitution test. Who put the fields on the slope? Who ignored the tremors? If the sentence empties out, the ash was decoration. If it holds, the ash mattered. We do not need to decide if mountains vote. We need to know if the sentence survives the swap.

  This is not metaphysics. It is project management. For our funding partner, this distinction ensures our deliverables describe mechanisms, not alibis. A model that ignores exposure fails. A narrative that ignores biology fails. We are building a record that must hold up to scrutiny from both sides. If we cannot agree on how we construct causality, we cannot produce a unified history. The program officer needs to know we are building something solid. We need to produce work that stands up when the subjects change.

  So, here is the proposal. For the next two days, we do not resolve whether germs count as actors. That is the wrong question for a kickoff. The right question is whether our sentences survive the room. If we can build claims that pass the substitution test, we will have a vocabulary that works. We will have a project that delivers. Let us get to work.

  2. **Grammar ledger**

  *   "Let us say the volcano cast a vote on the harvest." — Flagged exception (deliberate personification).
  *   "I am letting the mountain have intention here." — Meta-commentary on the exception.
  *   "If the sentence empties out, the ash was decoration." — "Ash" is subject, "was" is not a verb of intention. Survives substitution.
  *   "If it holds, the ash mattered." — "Ash" is subject, "mattered" is not a verb of intention. Survives substitution.
  *   "A model that ignores exposure fails." — "Model" is non-human, "ignores" is borderline intention but abstract. Survives substitution (metaphorical).
  *   "A narrative that ignores biology fails." — "Narrative" is non-human, "ignores" is borderline intention but abstract. Survives substitution (metaphorical).

  3. **If the room turns out to be mostly modelers**

  **Replacement paragraph:**
  The second tool is the sensitivity check. Take your model. Remove the biological parameter and replace it with a fixed constant representing human behavior. See how the output shifts. If the curve remains unchanged, the pathogen was decoration. If the model breaks or diverges from the data in a way you can point to, then the biological term was carrying real weight. You keep it. This prevents the biology from becoming invisible background noise. It forces us to specify the interaction. We are not asking if the biology matters. We are asking how much variance it explains in this specific system.

  **Cost analysis:**
  This swap costs me the historians' buy-in, as "sensitivity check" sounds like dismissal of their qualitative work. It also risks reducing the "substitution test" to a purely quantitative exercise, losing the rhetorical power of rewriting sentences to reveal human agency.
