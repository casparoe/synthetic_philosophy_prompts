prompt: |-
  Something I keep going back and forth on and would like help getting straight.

  A bunch of the debate spaces I hang around in have a rule that you're not allowed to attack a position until you've stated it back in a version the person who holds it would agree to. The strong version says you should be able to set out the other side's case well enough that someone reading it cold couldn't tell which side you're on, and some places treat passing that test as a precondition for having an opinion worth hearing at all. I think the same idea shows up in fancier settings too, like citizens' assemblies where the background booklet is supposed to be signed off on by people on both sides before anyone deliberates.

  Meanwhile the same people who enforce that rule will also tell you that you should basically never take an opponent's stated reasons at face value: look at their incentives, assume the reasoning is post-hoc, remember that they're performing for an audience. And plenty of institutions build that second attitude in — cross-examination, auditing, red-teaming, trust-but-verify.

  What I want is the implicit theory of the first practice. What does requiring charitable reconstruction actually presuppose, about what a political disagreement is and about whether the other side argues in good faith? Concretely, does it need any of these three claims, or can it get by without them: (i) the people on the other side are sincere and believe what they say; (ii) they'd move if the evidence moved; (iii) they aren't picking their framing to win rather than to be accurate. My guess is it needs less than people think — maybe refuting a weak version of a view is just uninformative, and that's the whole justification — but I'd like the real presuppositions separated from the stuff it merely goes naturally with.

  Two more things. First, the failure mode I keep seeing: the version that passes the test is often a synthetic thing nobody actually holds, a cleaned-up philosophical cousin of a position whose real support base is much messier, so you end up defeating an artifact you built yourself. Is that predictable from what the practice presupposes, or is it just people doing it badly? And second, is the first practice really in tension with the second, or does it only look that way? It feels like one assumes we share enough to recognise an accurate statement of a view when we see it, and the other assumes we dont.

  Last bit: if we swapped the implicit picture for something darker — say, that political belief is mostly identity expression and hardly moves in response to reasons — what would the practice have to turn into, or would it just get dropped?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user observes a conflict between two norms in debate/deliberation spaces.
          *   Norm A (Charitable Reconstruction/Steel-manning): You must state the opponent's position so well they agree with it (or even better, indistinguishably) before attacking. Used in debate clubs, citizens' assemblies, etc.
          *   Norm B (Skepticism/Red-teaming): Never take reasons at face value. Look at incentives, assume post-hoc rationalization, assume performance. Used in cross-examination, auditing, etc.
      *   **Primary Question:** What is the *implicit theory* behind Norm A? What does it presuppose about political disagreement and good faith?
      *   **Specific Sub-questions:**
          *   Does Norm A require claims (i) sincerity, (ii) responsiveness to evidence, (iii) accuracy-seeking framing? Or is it just about avoiding uninformative refutations of weak versions?
          *   Failure Mode: The "synthetic artifact" problem (defeating a cleaned-up version nobody actually holds). Is this inherent to the practice or just bad execution?
          *   Tension: Is Norm A actually in tension with Norm B? (One assumes shared recognition of truth/accuracy, the other assumes deep distrust).
          *   Counterfactual: If we adopted a "darker" theory (belief = identity expression, reasons don't move people), what happens to Norm A?

  2.  **Analyze Norm A (Charitable Reconstruction):**

      *   *Purpose:* To ensure the debate is about the *actual* disagreement, not a misunderstanding. To maximize the informational value of the refutation.
      *   *Presuppositions:*
          *   There *is* a coherent proposition to be discussed.
          *   Communication is possible (shared language/concepts).
          *   The goal is truth-seeking or decision-quality, not just victory.
      *   *Regarding (i), (ii), (iii):*
          *   (i) Sincerity: Not strictly necessary. I can restate a liar's argument accurately. But it helps if they *hold* the position consistently.
          *   (ii) Responsiveness: Crucial. If they won't move on evidence, restating their case is theater.
          *   (iii) Accuracy-seeking framing: This is the tricky one. Norm A assumes the *stated reasons* are at least partially constitutive of the belief, not just camouflage.
      *   *The "Uninformative Refutation" Justification:* The user guesses this is the core. Yes, logically, refuting a strawman proves nothing. But Norm A goes further (the "indistinguishable" standard). That suggests a deeper epistemic humility.

  3.  **Analyze the Tension (Norm A vs. Norm B):**

      *   Norm A says: "Understand them perfectly."
      *   Norm B says: "Don't believe them."
      *   *Resolution:* They operate at different levels. Norm A is about *content/structure* of the argument. Norm B is about *motivation/causality* of the argument.
      *   *Example:* I can perfectly articulate a lobbyist's argument for deregulation (Norm A) while believing they only make that argument because they are paid to (Norm B).
      *   *The "Shared Recognition" issue:* Norm A requires shared semantic ground. Norm B questions the *source* of the utterance, not necessarily the meaning of the words. So, not a direct contradiction, but a pragmatic tension.

  4.  **Analyze the Failure Mode (The Synthetic Artifact):**

      *   *Problem:* The "Philosophical Cousin." The steelman is too clean. The real movement is messy/tribal.
      *   *Is it inherent?* Yes, to some degree. Language imposes structure on messy intuition. If you clean it up *too* much, you lose the psychological engine of the belief.
      *   *Is it bad execution?* Often, yes. People use "steel-manning" to debate the *best possible version* rather than the *actual held version*. The rule says "a version the person who holds it would agree to." If they wouldn't agree to the clean version, you failed the test. So, the failure is a violation of the rule, not a feature of it. *However*, the rule itself might be flawed if the "person" is a diffuse movement with no central authority to agree.

  5.  **Analyze the "Darker Theory" Counterfactual:**

      *   *Premise:* Belief = Identity/Signaling. Reasons = Post-hoc.
      *   *Impact on Norm A:* It becomes useless or transforms.
      *   *Transformation:* Instead of "State their argument," it becomes "State their *interest* or *identity signal*."
      *   *Example:* "You aren't arguing for Policy X because of Reason Y; you are arguing for Policy X because it signals loyalty to Group Z."
      *   *Result:* Deliberation becomes negotiation or power analysis. Norm A (charitable reconstruction of *reasons*) gets dropped in favor of accurate reconstruction of *incentives*.

  6.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension.
      *   **Section 1: The Implicit Theory of Norm A.**
          *   It's not just about logic (strawmen); it's about *epistemic cooperation*.
          *   Address (i), (ii), (iii).
          *   (i) Sincerity: Not required, but *consistency* is.
          *   (ii) Responsiveness: **Required.** This is the dealbreaker.
          *   (iii) Framing: **Required.** Assumes reasons play a causal role, not just decorative.
          *   *Core Presupposition:* Disagreement is primarily *cognitive*, not *performative*.
      *   **Section 2: The Synthetic Artifact (Failure Mode).**
          *   Distinguish between "Steel-manning" (best possible version) vs. "Accurate Reconstruction" (version they hold).
          *   The rule demands the latter. The failure mode happens when people do the former.
          *   *Inherent Risk:* Yes, because people often hold messy views. The practice demands rationalizing the irrational.
      *   **Section 3: The Tension with Norm B (Skepticism).**
          *   They are compatible but operate on different layers (Content vs. Genealogy).
          *   You can accurately map the terrain (A) while doubting the mapmaker's intent (B).
          *   The tension arises when Norm B suggests the *content* is irrelevant compared to the *signal*.
      *   **Section 4: The Darker Theory (Identity/Signaling).**
          *   If beliefs are identity markers, Norm A breaks.
          *   It shifts from "Argument Reconstruction" to "Incentive/Identity Reconstruction."
          *   Deliberation becomes bargaining or conflict management, not truth-seeking.
      *   **Conclusion:** Summarize. Norm A is a high-trust technology. It works in high-trust epistemic environments. In low-trust environments, it becomes a vulnerability or a farce.

  7.  **Refine the Tone:**
      *   Keep it analytical, philosophical, but grounded.
      *   Avoid taking sides.
      *   Use the user's terminology (Norm A/B, synthetic artifact, etc.).
      *   Ensure the distinction between "logical validity" and "psychological reality" is clear.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Check:* Did I answer whether it *needs* claims (i)-(iii)?
      *   *Correction:* Be precise. It doesn't need (i) absolute sincerity, but it needs the *argument* to be the vehicle of the belief. It definitely needs (ii). It definitely needs (iii) to some degree.
      *   *Check:* Is the "Synthetic Artifact" inevitable?
      *   *Correction:* It's a risk inherent in *rationalizing* human belief. Humans aren't perfectly rational. Forcing their views into a logical structure *creates* an artifact. So it's partly inherent to the practice of applying logic to psychology.
      *   *Check:* The tension between A and B.
      *   *Correction:* Emphasize that B (skepticism) is often about *why* they hold the view, while A is about *what* the view is. They clash when *why* determines *what*.

  9.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a sharp dissection of two conflicting epistemic norms. You've identified a friction point that often goes unnoticed because both norms sound virtuous in isolation. Norm A (Charitable Reconstruction/Steel-manning) is the norm of *collaborative truth-seeking*. Norm B (Skepticism/Red-teaming) is the norm of *adversarial verification*.

  Here is the breakdown of the implicit theory behind Norm A, its relationship to your three claims, the inevitability of the "synthetic artifact," and what happens when you swap in a darker theory of belief.

  ### 1. The Implicit Theory of Charitable Reconstruction

  You asked if Norm A requires claims (i), (ii), and (iii). The short answer is: It requires (ii) and (iii) far more than (i), but it fundamentally presupposes that **reasons are causal engines, not just decorations.**

  Let's look at your three claims:

  *   **(i) Sincerity:** Norm A does *not* strictly require that the opponent is sincere. You can charitably reconstruct a liar's argument. If a lobbyist argues for deregulation based on "economic freedom" while knowing it's a cover for rent-seeking, you can still articulate the "economic freedom" case perfectly. However, Norm A *does* presuppose that the stated reasons are **stable**. If the opponent shifts their stated reasons every time you pin one down, reconstruction is impossible. So, it requires consistency, not necessarily sincerity.
  *   **(ii) Responsiveness to Evidence:** **This is the hard requirement.** Norm A presupposes that the disagreement is *resolvable* or at least *navigable* via shared premises. If the other side operates on a theory where evidence cannot move them (e.g., pure revelation, pure tribal loyalty), then reconstructing their argument is a waste of time. The practice assumes that if you remove the confusion/misunderstanding (which reconstruction aims to do), the remaining disagreement is substantive. If the disagreement is purely motivational, reconstruction adds no value.
  *   **(iii) Accuracy-seeking Framing:** **This is the critical presupposition.** Norm A assumes that the *structure* of the argument matters. It assumes the opponent is trying to describe the world, not just signal allegiance. If the framing is picked solely to win (sophistry) rather than to be accurate (truth-tracking), then a "charitable reconstruction" is actually a **distortion**. You are polishing a weapon and calling it a tool.

  **The Core Theory:**
  Norm A presupposes that political disagreement is primarily a **coordination problem regarding facts and values**, not a **conflict of identity or power**. It assumes that if we could perfectly align our maps of each other's territories, we would either agree or clearly see the exact value trade-off where we diverge. It treats belief as a *propositional attitude* (I believe X is true) rather than a *social signal* (I am the kind of person who says X).

  ### 2. The "Synthetic Artifact" Failure Mode

  You noted that the version passing the test is often a "cleaned-up philosophical cousin" nobody actually holds. Is this predictable?

  **Yes, it is inherent to the practice, not just bad execution.**

  Here is why: Human political belief is rarely a coherent logical system. It is a heap of intuitions, anecdotes, identity markers, and half-remembered arguments. Norm A demands that you turn that heap into a **system**.

  To pass the "indistinguishable" test, you must impose logical consistency on a mindset that may not value consistency. In doing so, you inevitably create a **rationalized artifact**.
  *   **The Real View:** "I hate Group Y, and Policy X hurts them, so I like Policy X."
  *   **The Reconstructed View:** "Policy X promotes social cohesion by reducing demographic friction, which is a public good."

  If the holder agrees to the Reconstructed View because it sounds smarter, you have successfully "steel-manned" them, but you have also **lied about the nature of their belief.** You have defeated the philosophical cousin, while the real view (the tribal animus) remains untouched and unrefuted.

  **Is this a bug or a feature?**
  In high-trust epistemic communities (academia, certain debate clubs), this is a feature. It forces participants to *become* the philosophical cousin. It norms people into holding coherent views.
  In low-trust political environments, this is a bug. It allows people to hide their real motivations behind a defensible shield. The practice presupposes that people *want* to be coherent. If they don't, the practice generates ghosts.

  ### 3. The Tension with Norm B (Skepticism)

  Is there a tension between "Reconstruct perfectly" (A) and "Trust nothing" (B)?

  **They are compatible in theory, but often incompatible in practice.**

  *   **Theoretical Compatibility:** You can view them as operating on different layers. Norm A operates on the **Semantic Layer** (What does this claim mean? What entails what?). Norm B operates on the **Genealogical Layer** (Why was this claim uttered? What function does it serve?).
      *   *Example:* A lawyer can reconstruct the prosecution's case perfectly (Norm A) while believing the prosecution is politically motivated (Norm B). The reconstruction ensures the trial is fair; the skepticism ensures the verdict is scrutinized.
  *   **Practical Tension:** The tension arises because Norm A requires a degree of **epistemic trust** to function. To agree that a reconstruction is "accurate," both sides must agree on what counts as a valid representation of a belief.
      *   Norm B undermines this. If I assume your reasons are post-hoc rationalizations, I have no reason to agree that your "stated reasons" are the thing that needs reconstructing. I should be reconstructing your *incentives*, not your *arguments*.
      *   Therefore, Norm B eats Norm A. If you take skepticism seriously enough, Charitable Reconstruction becomes a distraction. You are polishing the menu while suspecting the kitchen is on fire.

  **The "Shared Recognition" Problem:**
  You hit the nail on the head: Norm A assumes we share enough reality to recognize an accurate statement of a view. Norm B assumes we are in a information war where definitions are contested. If we can't agree on what the view *is* (because we disagree on the underlying reality), Norm A stalls.

  ### 4. The Darker Theory Counterfactual

  If we swap the implicit picture for the "darker" one (belief = identity expression, reasons = post-hoc), what happens to Norm A?

  **It transforms from "Charitable Reconstruction" to "Incentive Mapping."**

  If political belief is mostly identity signaling, then asking someone to state their position charitably is asking them to **signal their identity more clearly.**
  *   **Current Practice:** "Please state the opposing view so well they agree."
  *   **Darker Practice:** "Please state the opposing *interest* so clearly that their constituents would nod."

  In this framework, the "version they would agree to" isn't a logical proposition; it's a **loyalty oath**.
  *   If you adopt the darker theory, Norm A doesn't necessarily get dropped, but its goal changes. It is no longer about finding truth. It becomes about **conflict management**.
  *   You reconstruct their position not to refute it, but to acknowledge their status. "I understand that for your group, Policy X is a marker of belonging."
  *   **The Outcome:** Deliberation stops being about *persuasion* (moving on evidence) and starts being about *negotiation* (splitting the difference between incompatible identities).

  **Would it get dropped?**
  In institutions designed for truth-seeking (science, courts), it would be dropped or radically altered (cross-examination replaces steel-manning).
  In institutions designed for stability (legislatures, citizens' assemblies), it would remain but become ritualistic. It becomes a way to say, "I hear you," without ever engaging with the truth value of the claim.

  ### Summary

  The implicit theory of Charitable Reconstruction is that **disagreement is a cognitive error that can be corrected by better information sharing.**

  *   It **needs** claim (ii) (responsiveness) and (iii) (accuracy-seeking framing). It can survive without (i) (sincerity).
  *   The **Synthetic Artifact** is an inherent risk because the practice forces logical coherence onto psychological messiness. It works only if participants are willing to update their actual beliefs to match the clean version.
  *   The **Tension** with Skepticism is real. Skepticism questions the *source* of the argument; Reconstruction questions the *content*. If the source determines the content (as the darker theory suggests), Reconstruction is futile.
  *   Under a **Darker Theory**, the practice shifts from "Let me argue your case better than you" to "Let me acknowledge your tribal stake more accurately than you." It moves from epistemology to sociology.

  If you are in a space that enforces Norm A but operates on the Darker Theory, you are likely in a **theater of deliberation**. The reconstruction is a performance of respect, not a tool for resolution. Recognizing which theory is actually in operation is the only way to know if you are debating or bargaining.
