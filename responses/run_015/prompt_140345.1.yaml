version of combination, strong emergence, cosmopsychism, and the option on which there is no deep unity of a subject to be explained in the first place; give each leaf one sentence on its most awkward commitment. Wherever the space of answers permits a combination that no one in fact occupies, mark that cell as empty and say in a sentence whether it is empty because incoherent, because unattractive, or because merely unexplored, and flag any pair of leaves your questions cannot pry apart. Write the whole thing as continuous prose, the way one would write to the group in an email: no headings, bullet points, numbered nodes, bold, tables, or ASCII arrows, with the tree traversed in sentences from question to question and out to the leaves.
