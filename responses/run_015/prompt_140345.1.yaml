answer: |-
  Dear colleagues, to navigate the logical space of panpsychism and the combination problem without prejudice toward established labels, we begin from the single shared commitment that ordinary waking adult humans have conscious experiences. From here, ask yourself whether a lone particle in an otherwise empty universe has any experience at all. If you answer no, you must next decide whether the smallest experiences, if there are any, are drawn from the same palette as ours, the familiar colours and pains, or are of a kind we could neither recognise nor describe. If you hold there are no micro-experiences but the base properties are of this unrecognizable proto-phenomenal kind, you land on Panprotopsychism, whose most awkward commitment is that consciousness emerges from properties that are not themselves conscious in any sense we can grasp. If you deny even proto-phenomenal properties and insist consciousness arises from purely physical structures, you occupy Strong Emergence, which awkwardly requires brute laws linking non-conscious matter to conscious minds. If you answered yes to the lone particle having experience, you must then consider whether the fundamental conscious thing might instead be the cosmos as a whole, with the small flickers derived downward from it and carrying a decomposition-side difficulty of their own. Accepting this top-down priority places you at Cosmopsychism, where the awkward commitment is that the universe itself is the primary subject and our individuality is merely a fragmentary illusion. Rejecting cosmopsychism brings you to the question of whether a brick-sized lump of matter built out of such particles is itself a subject. If you deny that the brick is a subject while maintaining humans are, you arrive at Constitutive Micropsychism, which awkwardly commits you to a principled distinction between conscious aggregates that seems absent in the physics. If you affirm the brick is a subject, or at least that human subjects are composite, you face the combination problem directly and must decide whether a macro-subject formed from many micro-subjects can have a phenomenal quality that none of its parts has. If you say yes, you revert to a form of Strong Emergence within panpsychism, a cell mostly empty because it is unattractive to posit emergence twice over. Saying no leads you to ask whether the unity of such a macro-subject is something further over and above its parts or just the parts under a different description. Before answering, consider whether a brain whose hemispheres are disconnected fibre by fibre contains one subject, two, or a vague and indeterminate number, and whether a mind whose stream of consciousness is switched off and on again every second is one subject or many. If you find the number of subjects vague in space or time, you might conclude there is no deep unity of a subject to be explained in the first place, a position whose awkward commitment is that the very subject asking the question is a linguistic fiction. If you insist on deep unity, you must choose between unity as a further fact or as description. If you choose a further fact, you must determine whether the relation doing the unifying is itself conscious, and if so whether that merely restarts the problem one level up. Affirming a conscious unifying relation lands you on the Phenomenal-Bonding view with its regress, which awkwardly commits you to an infinite hierarchy of bonding subjects to secure a single moment of experience. Denying the relation is conscious while maintaining it is a further fact leaves a cell empty because it is incoherent to posit a non-conscious relation that creates conscious unity. If you instead claim unity is just the parts under a different description, you adopt the Fusion or Identity version of combination, whose awkward commitment is that micro-subjects cease to exist as such when they combine. Note that the questions regarding temporal switching and hemispheric disconnection cannot pry apart the Fusion view from the No Deep Unity view if both deny a robust persisting subject, marking these leaves as partially indistinguishable on this test. I hope this map helps us locate our disagreements precisely during the seminar.
