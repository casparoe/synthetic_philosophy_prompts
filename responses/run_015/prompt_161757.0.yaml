answer: |-
  **Project Title:** Blind Continuity: Testing Structural Realism via Latent Representations in Machine Learning

  **Statement of the Question**
  Structural realism asserts that while specific ontological commitments of scientific theories may change, the mathematical structure describing relations between phenomena is retained across theory change. However, this claim is currently vulnerable to a charge of hindsight bias: we identify the "preserved structure" only after the successor theory is already known. This project asks a determinate question: *If a machine learning model is trained exclusively on data available prior to a major theory change, does the internal structure it converges upon align with the structure of the successor theory or the predecessor?*

  This is not a question about predictive accuracy, which both theories may share in the limiting regime. It is a question about latent organization. If structural realism is a robust feature of scientific progress rather than a retrospective rationalization, a "blind" structure-finding procedure optimized on pre-change data should naturally settle into a representational geometry isomorphic to the future theory's surviving structure. If it instead settles into the geometry of the discarded theory, the continuity claim is weakened.

  **Philosophical Context and Distinctiveness**
  Both epistemic and ontic structural realism leave this question open because they presuppose structures that are *stated*—equations, groups, or logic sentences formulated by agents. They do not account for structures that are *found* via optimization in high-dimensional parameter spaces. The realist argues structure persists; the anti-realist argues this is trivial or selective. Neither has a method to test this selection bias independently of human theorizing.

  Alternative approaches fail to capture this specific tension. Treating this as a problem of "automated scientific discovery" focuses on the heuristic capacity of algorithms to propose hypotheses, which is a pragmatic concern distinct from ontological continuity. Similarly, asking whether machines "understand" the data invokes cognitive criteria irrelevant to the metaphysical status of the relations discovered. This project isolates the metaphysical claim: does the world's data naturally constrain optimization toward the *true* structure, even when the conceptual vocabulary for that structure does not yet exist?

  **Methodology (12-Month Plan)**
  The project requires no proprietary models or high-performance computing clusters. It relies on open-source architectures and historical datasets that are already digitized.

  *Months 1–3: Case Selection and Data Curation.*
  I will select two historical episodes where pre-theory data is machine-readable and the structural shift is well-defined. Likely candidates include late 19th-century celestial mechanics (Newtonian vs. Relativistic regimes) or blackbody radiation spectra (Classical vs. Quantum). The data will be preprocessed to reflect only what was known *before* the theoretical break, removing any later corrections.

  *Months 4–6: Model Training and Convergence.*
  I will train modest neural architectures (e.g., multi-layer perceptrons or small transformers) on this restricted data. The goal is not state-of-the-art prediction but stable convergence. I will employ regularization techniques to encourage sparse, interpretable representations without forcing specific physical biases. Multiple random seeds will ensure the discovered structure is a property of the data, not the initialization.

  *Months 7–9: Structural Probing.*
  Using techniques from representational similarity analysis, I will map the internal activation patterns of the trained models. I will not look for semantic labels but for relational dependencies: how does changing input variable A affect latent node B? This generates a "causal graph" of the model's internal logic.

  *Months 10–12: Comparative Analysis and Synthesis.*
  I will compare the model's causal graph against the formal structures of both the predecessor and successor theories. The philosophical writing will interpret whether the alignment supports the realist's continuity thesis or the anti-realist's suspicion of retrospective cherry-picking.

  **Criterion for Structural Identity**
  The central technical challenge is comparing structures across incompatible vocabularies. Predictive equivalence is insufficient; a Ptolemaic epicycle model can match Copernican predictions without sharing structure. I will adopt a criterion of *interventional isomorphism*.

  Two systems share structure if, under a defined set of counterfactual interventions on their inputs, the pattern of changes in their internal states maps bijectively. If perturbing the model's latent vector corresponding to "velocity" produces a change in its output state that is mathematically homologous to how the successor theory's velocity term alters the state equation, they share structure. This moves beyond input-output matching to compare the *mechanism* of generalization. If the model generalizes to out-of-distribution regimes in the same way the successor theory does, but differently from the predecessor, this indicates structural alignment.

  **Possible Conclusions and Decision Criteria**
  1.  **Alignment with Successor:** If the model's latent structure mirrors the successor theory (e.g., it implicitly learns a relativistic correction without being told), this supports structural realism. It suggests the data constrains the "truth" even before humans conceptualize it.
  2.  **Alignment with Predecessor:** If the model encodes the discarded theory's structure (e.g., it learns an ether-like medium to explain waves), this supports the anti-realist. It suggests continuity is a human imposition on data that actually supports multiple, transient structures.
  3.  **Null Result:** If the model learns a structure unique to neither, this suggests underdetermination is more severe than either side admits, or that the chosen architectures are insufficient to capture physical law.

  The decision will rest on the statistical significance of the interventional isomorphism scores. If the model's internal relations correlate significantly higher with the successor's formalism than the predecessor's, the realist claim gains empirical weight.

  **Failure Conditions and Scope Risks**
  The project fails if the models do not converge on stable representations, rendering structural probing impossible. It also fails if the historical data is too noisy to support any structure beyond curve fitting.

  A significant risk to the timeline is the scope of the structural comparison. Defining interventional isomorphism rigorously could become a mathematical project in itself. To mitigate this, I will restrict the analysis to specific, localized relations (e.g., energy-momentum dependencies) rather than attempting to map the entire theory space. If the interpretability tools prove insufficient to extract clear causal graphs from the models within six months, the project will pivot to a conceptual analysis of *why* such extraction failed, treating the opacity itself as a philosophical result regarding the limits of formalizing structure.

  **Broader Significance**
  For the review panel and funding bodies, the value of this project extends beyond the philosophy of science. We are increasingly entering an era where scientific variables are discovered by models that cannot paraphrase their own reasoning. Scientists and policymakers must decide whether to trust these latent variables for intervention (e.g., in climate modeling or drug discovery).

  If this project demonstrates that blind optimization converges on structurally robust features that survive theory change, it provides a warrant for trusting machine-discovered variables as candidates for real physical quantities. If it demonstrates that models merely encode the phenomenology of the data without capturing the underlying generative structure, it serves as a caution against reifying neural network features. Either outcome offers a principled basis for deciding when an uninterpretable variable is a discovery of nature and when it is merely a compression of observation.
