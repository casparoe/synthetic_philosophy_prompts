      *   *Section 2: The "Neural Machinery" Move.*
          *   User was right: this is a category error. Moral status isn't about hardware; it's about software (experience, agency) or social context.
          *   Equating neuron count to moral worth is crude. A human with dementia is still embedded in a web of human relations.
      *   *Section 3: The Additivity Claim (100 pigs > 1 human).*
          *   User was right: this is highly controversial.
          *   Distinguish between *weight of interests* (suffering) and *right to life*.
          *   Most non-utilitarians reject aggregation of rights.
      *   *Section 4: The Threshold View.*
