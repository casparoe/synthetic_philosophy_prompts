  They say without a market PRICE to guide,
  The planner holds no accurate LIST.
  He cannot sum the shadow of the COST,
  Nor weigh the things the people NEED.
  There is no common measure found HERE,
  To value labor promised for TODAY.

  The board posts numbers valid for TODAY,
  And waits to see how managers PRICE the goods.
  Excess demand accumulates right HERE,
  So they adjust the items on the LIST.
  They ask again what citizens NEED,
  And tally up what all the inputs COST.

  When marginal COST equals the quoted rate,
  The system clears within the day TODAY.
  It matches supply to what the people NEED,
  A clear vector emerges from the PRICE.
  Every single entry goes on the LIST.
  The final solution is found right HERE.

  The algorithm converges HERE.
  It does not care what all the inputs COST.
  It only shuffles entries on the LIST.
  Valid for now, valid for TODAY.
  Adjusting every single PRICE.
  Until it fits; one NEED not ask.

  There is no verb for what we NEED.
  Nothing new appears suddenly HERE.
  You cannot set a shadow PRICE.
  On all the new things that do not yet COST.
  Invented after the start of TODAY.
  Because they are not on the master LIST.

  The static LIST remains the same.
  While desire shifts to what we NEED.
  The ground moves underneath TODAY.
  The data shifts distinctly right HERE.
  The changing methods alter every COST.
  Before the board can fix the PRICE.

  The perfect LIST is posted HERE.
  It balances the NEED and COST.
  It lost yesterday's TODAY and PRICE.
