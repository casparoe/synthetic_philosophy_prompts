answer: |-
  **Exam Question**

  **Question 1 (45 Minutes)**

  Consider the "Coincident Twins" scenario: a universe containing exactly two material spheres. Unlike Black's original counterexample, these spheres are coincident—they occupy the exact same spatial region at the same time, maintain zero distance, and interact not at all. Consequently, every qualitative relation each bears to the other (e.g., distance, causal influence) is one it also bears to itself.

  Write an essay addressing the following four requirements:
  1.  State the Principle of the Identity of Indiscernibles (PII) over a suitably restricted domain, explaining why the unrestricted version is trivial or circular.
  2.  Explain why the "weak discernibility" reply succeeds against Black's original spheres but fails against the Coincident Twins, leaving only numerical difference.
  3.  Specify what a defender of Black's spheres must now claim about the Twins to remain consistent, ensuring this claim does not simply re-assert PII.
  4.  Articulate the philosophical function of PII (for Leibniz and contemporary metaphysics) so that the discussion does not terminate in the claim that Black merely refuted the principle.

  ***

  **Model Answer**

  The Principle of the Identity of Indiscernibles (PII) states that necessarily, for any objects *x* and *y*, if *x* and *y* share all qualitative properties and relations, then *x* is identical to *y*. Crucially, the domain of properties must be restricted to exclude haecceities (e.g., "being identical to *x*") and impure properties involving specific individuals. If the domain is unrestricted, PII becomes trivial: *x* and *y* always differ by the property "being identical to *x*," rendering the principle a tautology that offers no metaphysical insight into the relationship between quality and quantity.

  Max Black's original two-sphere universe challenged PII by positing symmetric spheres separated by distance. A popular defense of PII here relies on "weak discernibility." The spheres bear the irreflexive relation "being one mile from" to each other but not to themselves. This irreflexive relation logically entails non-identity, seemingly saving PII without invoking haecceities. However, this defense relies entirely on the physical availability of an irreflexive spatial relation. In the Coincident Twins variant, the spheres share the same region. The relation "being zero distance from" is reflexive; each twin bears it to itself and the other. There are no irreflexive qualitative relations remaining. Consequently, the only relation distinguishing them is "being distinct from," which is merely numerical difference. To claim this distinguishes them is to beg the question, as numerical difference is precisely what PII attempts to ground in qualitative difference.

  Therefore, a defender of Black's spheres who accepts the possibility of the original case faces a dilemma regarding the Twins. They cannot simply assert PII holds, as the qualitative profile is identical. To remain consistent, they must either: (1) accept that the Twins are possible, thereby embracing haecceitism or primitive thisness (admitting objects can differ numerically without qualitative difference), which abandons the spirit of PII; or (2) argue that the Twins are metaphysically impossible, perhaps due to a principle of impenetrability or the nature of substance. Option (2) is the only route to preserving PII, but it requires independent metaphysical justification beyond the principle itself. One cannot use PII to rule out the Twins if the argument for PII relies on the impossibility of the Twins.

  Finally, we must ask what work PII is doing. For Leibniz, PII was a consequence of the Principle of Sufficient Reason (PSR). If two indiscernible things existed, God would lack a sufficient reason to place one here and the other there; thus, their existence is incompatible with divine rationality. For the contemporary metaphysician, PII is often less about theology and more about ontological parsimony and the intelligibility of reference. It ensures that objecthood is grounded in qualitative structure rather than brute numerical multiplicity. If Black's spheres (or the Twins) are possible, PII is false, but the deeper lesson is not merely a refutation. Rather, it forces a choice: either we accept brute numerical diversity (haecceitism) or we must find independent physical or metaphysical laws (like impenetrability) that prevent such symmetry. The debate shifts from the truth of PII to the justification of the modal constraints on physical objects. Thus, Black does not simply kill PII; he exposes the cost of rejecting it: a commitment to primitive identity or robust modal restrictions on matter.

  ***

  **Marking Scheme**

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **PII Formulation:** Correctly restricts properties to qualitative/pure and identifies unrestricted version as trivial/circular (tautological). | **4** | Candidates often fail to exclude "being identical to x" as a property, missing the triviality objection. |
  | **2** | **Weak Discernibility:** Explains that Black's case allows irreflexive relations (distance), whereas Twins only allow reflexive relations (coincidence). | **4** | Students frequently claim weak discernibility works for Twins by citing "being distinct from" as an irreflexive relation. |
  | **3** | **Numerical Difference:** Identifies that without irreflexive relations, only numerical difference remains, which is question-begging. | **4** | Candidates often assert numerical difference is a valid ground for distinction without noting it begs the question against PII. |
  | **4** | **Defender's Claim:** States the defender must accept haecceitism or argue for independent impossibility (e.g., impenetrability), not just re-assert PII. | **4** | A common mistake is to say the defender simply denies the Twins are possible *because* PII is true (circular). |
  | **5** | **Function of PII:** Connects PII to PSR (Leibniz) or ontological parsimony/reference (contemporary), avoiding "Black refuted it" as a conclusion. | **4** | Essays often end by declaring PII false without discussing the metaphysical costs or the principle's original motivation. |
  | **Total** | | **20** | |
