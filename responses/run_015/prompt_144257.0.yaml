answer: |-
  **The Toast**

  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of being [Advisor's Name]'s doctoral student, which is a specific way of saying I spent several years trying to match her clarity and mostly succeeded only in matching her stubbornness.

  When I started writing this, I ran into a problem. Usually, at a retirement dinner, you talk about what someone was *meant* to do. You say they were born for this job, or that they fulfilled the destiny of the department. But if you know [Advisor's Name]'s work, you know that is a category error. She spent forty years arguing that physiology doesn't care about destiny. A heart functions because it pumps blood right now, not because evolution intended it to. So, tonight, I am not going to say she was meant to be here. I am going to say that she *was* here, and because she was here, the capacity of this department to produce rigorous thought was sustained. She didn't fulfill a purpose; she exercised a capacity. And we are the beneficiaries of that causal role.

  This distinction matters to her, and it matters to us. Her brother, Dr. [Brother's Name], is here. He's a cardiologist. [Advisor's Name] used to tease him that he spent his life listening to hearts make noises, while she spent her life explaining why the noises didn't matter unless the pumping continued. She loved that clarity. She loved the idea that value is found in current contribution, not in a historical resume.

  She had two favorite test cases for this. The first was the "relic": a trait with a perfect history that does nothing now. The second was the "windfall": a trait with no history that works perfectly immediately. She argued the relic is non-functional, and the windfall is fully functional.

  I bring this up because I was worried about my own contribution tonight. I have a draft of this speech that I have workshopped for weeks. It has a rich history. But if I read it and you all fall asleep, it contributes nothing to the capacity of this dinner to be enjoyable. By [Advisor's Name]'s standards, that draft would be a relic. So, in the spirit of her work, I am treating my ability to improvise as a windfall. It has no history of success, but if it keeps you engaged, it is functional. Please bear with me.

  Now, I know the next speaker, [Next Speaker's Name]. He and [Advisor's Name] had a long, famous disagreement. He argues for the selected-effects account; he looks at the history of the lineage to determine function. She argued that the "lineage" is just the "organism" with the boundaries drawn wider.

  I mention this not to restart the fight, but to frame it. [Next Speaker's Name] is going to talk about her legacy. He is going to talk about the history of her students and the long-term effects of her mentorship. That is his explanatory project. He is drawing the system boundary around the timeline of the field. Tonight, I am drawing the boundary around this room. Both accounts are looking at the same woman. One looks at the causal role she plays in our lives tonight; the other looks at the causal role she plays in the history of philosophy. She taught us that the function depends on the system you choose to explain. So, when he speaks, know that he is not contradicting her; he is simply widening the lens, exactly the way she said his kind always does.

  [Advisor's Name], you have argued that we should not ask what a trait was *for*, but what it *does*. So I will not ask what your retirement is for. I will simply note that as you shift your containing system from this department to whatever comes next—whether that is family, travel, or finally teaching your granddaughter the names of the tide pool creatures without worrying about their evolutionary utility—you will continue to constitute a capacity for those around you.

  You have made us sharper. You have made this field more precise. And you have done it without ever asking us to believe in a destiny you didn't believe in yourself.

  To [Advisor's Name]. May your next system be as robust as this one.

  ***

  **Note on Philosophical Commitments**

  **1. The Contested Reading**
  I have committed to the **"System Boundary" reading** of the Cummins vs. Selected-Effects debate. Specifically, I utilized your advisor's "lineage-as-system" move as the structural bridge for the toast. Rather than treating the Selected-Effects account (defended by the next speaker) as *false*, I framed it as a legitimate explanatory project that simply draws the containing system's boundaries wider (temporally/historically) than the Causal-Role account (which draws them spatially/immediately). This allows me to validate the next speaker without conceding that your advisor was wrong. It treats the disagreement as a difference in *explanatory scope* rather than truth-value, which is a charitable interpretation of her claim that selected-effects is "nothing but" causal-role with a widened system.

  **2. Where the Toast Bends Her View**
  I have bent her view toward **pluralism** to ensure kindness. Your advisor was a hardliner; she believed etiological accounts "smuggled" history in wrongly and that her view recovered everything the other side wanted without the baggage. In the toast, I suggest that the next speaker's historical approach is just "widening the lens," implying both are valid ways to see her. She likely believed the etiological view was *confused*, not just *different*. I softened this to prevent the retirement dinner from feeling like a philosophical battleground. I sacrificed her combative precision for the sake of departmental peace, framing the disagreement as "loyalty" (engaging with her work) rather than "refutation."

  **3. A Reasonable Objection (From Your Perspective)**
  As someone who finds etiological accounts superior regarding dysfunction, you might object to the **closing wish**: *"May your next system be as robust as this one."*
  **Reason:** On a strict Cummins account, "robustness" is about current capacity maintenance. But retirement is often experienced as a *loss* of function (the "relic" problem). By wishing her new system be "robust," I am implicitly assuming she *needs* a functional role to be valuable, which edges close to the teleological thinking she rejected. A strict etiological view (your view) would handle the "loss" of her professional function better by acknowledging that her *history* of selection (her career) secures her value even if her current causal output changes. The toast glosses over the genuine philosophical difficulty of "retirement" on a Causal-Role account (i.e., if she stops contributing to the department, does she cease to function *as a professor*?). I sidestepped this existential friction to keep the tone warm, but a hardline etiological theorist might argue I missed the chance to honor her *history* as the source of her value, independent of her future causal output.
