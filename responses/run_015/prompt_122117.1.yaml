answer: |-
  # Specification of Desiderata for Buddhist Consequentialist Reconstruction

  The following specification outlines the necessary conditions for a philosophical reconstruction of Buddhist moral evaluation. The goal is to permit consequentialist reasoning regarding suffering reduction (aggregating welfare across numbers and time) without collapsing into act-utilitarianism (pure outcome maximization) or deontological intentionalism (pure *cetanā*-based karma).

  ## 1. The Temporal-Structure Desideratum

  **Specification:**
  The theory must distinguish between the *immediate karmic seed* (the moral quality of the volition at the time of action) and the *matured result* (*vipāka*, the long-term phenomenological outcome). It must allow the moral evaluation of an action to be partially sensitive to the predicted long-range reduction of suffering, without making the actual distant outcome the sole determinant of the action's present moral status. The theory must explain how an agent can be morally praised for aiming at distant suffering reduction even if the *vipāka* is delayed or obscured, while maintaining that the causal efficacy of the action depends on the integrity of the initial intention.

  **Motivating Case / Doctrinal Distinction:**
  This addresses the tension between the *Sutta* emphasis on intention (*cetanā*) as karma and the *Abhidharma* analysis of causal latency. If only immediate intention matters, long-term consequentialist planning loses moral weight. If only actual outcomes matter, the agent is held responsible for causal chains beyond their epistemic horizon, violating the Buddhist principle that karma is volitional. The distinction between *karma* (action/volition) and *karma-phala* (fruit/result) is the doctrinal anchor.

  **Negotiability:**
  *   **Non-Negotiable:** The distinction between volition (*cetanā*) and matured result (*vipāka*). Mainstream Buddhism rejects the view that moral value is generated solely by external outcomes independent of mind.
  *   **Negotiable:** The weighting of distant outcomes. Theravāda orthodoxy typically prioritizes the agent's own liberation trajectory (short-to-medium term karmic hygiene), whereas Mahāyāna Bodhisattva ethics permits deferring personal liberation for infinite future benefit.

  **Joint Unsatisfiability Flag:**
  This desideratum is in tension with **Desideratum 3 (The Upāya Constraint)**. If long-range suffering reduction is a primary metric for moral evaluation (to satisfy consequentialist reasoning), it creates pressure to justify immediate precept violations for distant gains. If the temporal structure strictly binds moral value to the purity of the present intention, it blocks consequentialist evaluation of distant outcomes.

  ## 2. The Aggregation Desideratum under Anātman

  **Specification:**
  The theory must provide an ontological account of the "unit of suffering" that allows for summation across multiple loci without positing a permanent self (*ātman*) or a substantial person (*pudgala*). It must define the conventional person (*sattva*) as a valid locus for moral accounting sufficient to justify sacrificing lesser welfare for greater welfare, while simultaneously maintaining that these loci are empty of inherent existence. The metric for aggregation cannot rely on the utility of a "self" but must rely on the intensity and duration of *duḥkha* within a causal continuum (*santāna*).

  **Motivating Case / Doctrinal Distinction:**
  Classical utilitarianism aggregates utility across persons. Buddhism denies persons exist ultimately. If there is no one to suffer, there is no one to count. However, the First Noble Truth asserts suffering exists. The reconstruction must locate suffering in the five aggregates (*skandhas*) or the mental continuum without reifying the owner of those aggregates. The distinction between "ultimate truth" (no self) and "conventional truth" (persons suffer) is the doctrinal basis.

  **Negotiability:**
  *   **Non-Negotiable:** The doctrine of *anātman* (no-self). Any reconstruction that posits a substantial self to make the math work fails as Buddhist philosophy.
  *   **Negotiable:** The method of aggregation. Some interpretations (e.g., strict Abhidharma) may reject aggregation entirely as conceptually flawed, viewing each moment of consciousness as discrete. Others (e.g., Mahāyāna Compassion ethics) treat the conventional illusion of self as sufficient ground for summing suffering.

  **Joint Unsatisfiability Flag:**
  This is the primary friction point with **Desideratum 5 (The Interdependence Requirement)**. If all phenomena are interdependent and lack boundaries (Desideratum 5), defining discrete units for aggregation (Desideratum 2) becomes metaphysically incoherent. You cannot sum what you cannot count, and you cannot count what has no boundaries.

  ## 3. The Upāya Constraint Desideratum

  **Specification:**
  The theory must establish strict meta-ethical boundaries for "skillful means" (*upāya-kauśalya*) that permit outcome-based exceptions to moral precepts without rendering the precepts vacuous. A legitimate expedient action must satisfy three conditions: (1) the intention is exclusively altruistic (devoid of greed, aversion, or delusion), (2) the agent possesses the wisdom to accurately foresee the net reduction of suffering, and (3) the action does not degrade the agent's capacity for future compassion. Rationalized harm is distinguished from *upāya* by the agent's attachment to the outcome; if the agent is attached to the "good consequence," the action is karmically binding.

  **Motivating Case / Doctrinal Distinction:**
  Based on Mahāyāna narratives (e.g., the Captain who kills a robber to save others) where precepts are broken for the greater good. The distinction lies between *conventional morality* (rules for ordinary beings) and *ultimate morality* (actions of realized beings). The constraint prevents the slide into "the ends justify the means" by making the "means" dependent on the spiritual purity of the agent, not just the math of the outcome.

  **Negotiability:**
  *   **Negotiable:** The existence of *upāya* exceptions themselves. This is largely a Mahāyāna innovation; Theravāda Vinaya generally treats precept violation as inherently unwholesome regardless of consequence.
  *   **Non-Negotiable:** The requirement that the intention remain pure. Even in exception-based ethics, an action driven by hatred or greed is never skillful.

  **Joint Unsatisfiability Flag:**
  This creates tension with **Desideratum 1 (Temporal Structure)**. *Upāya* often relies on predicting distant outcomes to justify immediate harm. If the Temporal-Structure Desideratum insists that *vipāka* is uncertain and intention is primary, it undermines the epistemic confidence required to authorize *upāya* exceptions.

  ## 4. The Scope of Moral Patients Desideratum

  **Specification:**
  The theory must extend moral consideration to currently non-existent future beings and non-human animals in natural ecosystems without violating the principle that karma requires an intentional object present to the mind. For future beings, the theory must treat them as potential continuums of suffering rather than actual entities. For wild-animal suffering, the theory must distinguish between suffering caused by sentient volition (moral evil) and suffering caused by natural processes (natural evil), assigning a duty to reduce the latter only where it does not violate the karmic autonomy of other beings or destabilize the conditions for practice.

  **Motivating Case / Doctrinal Distinction:**
  Traditional Buddhism focuses on beings currently within *saṃsāra*. Modern consequentialism demands we count future generations and wild animals. The doctrinal distinction is between *sattva* (sentient being with mindstream) and insentient matter. Future beings are a conceptual extension of *sattva*. Wild animals are *sattva*, but their suffering is often viewed as the ripening of past karma, creating a tension between intervening and respecting karmic law.

  **Negotiability:**
  *   **Negotiable:** The inclusion of future beings and the duty to intervene in wild suffering. Traditional frameworks are largely silent or negative on intervening in natural karmic results. This is a modern expansion required for the "consequentialist" aspect of the prompt.
  *   **Non-Negotiable:** Sentience (*sattva*) as the cutoff for moral patienthood. Plants and ecosystems do not suffer in the Buddhist sense and cannot be direct moral patients.

  **Joint Unsatisfiability Flag:**
  This tensions with **Desideratum 5 (Interdependence)**. If ecosystems are interdependent networks, removing "wild animal suffering" (e.g., predation) may collapse the system that supports sentient life. Prioritizing the reduction of suffering in one subset of beings may violate the systemic balance required for the whole.

  ## 5. The Interdependence Requirement Desideratum

  **Specification:**
  The theory must ground the normative weight of suffering reduction in *pratītyasamutpāda* (dependent origination) without committing the naturalistic fallacy. Interdependence explains the *mechanism* of how actions propagate suffering or relief, but it cannot be the sole *justification* for why suffering ought to be reduced. The normative force must come from the soteriological goal (Nirvāṇa/Cessation of *duḥkha*), while interdependence ensures the theory accounts for systemic, second-order effects of actions. The theory must avoid the claim that "everything is connected, therefore everything is equally valuable."

  **Motivating Case / Doctrinal Distinction:**
  Ecological Buddhism sometimes argues that interconnectedness implies intrinsic value in all things. Orthodox Buddhism argues interconnectedness implies emptiness and suffering, not intrinsic value. The distinction is between *ontological interdependence* (how things exist) and *axiological priority* (why suffering is bad). Suffering is bad because it is the object of cessation, not because it is disconnected.

  **Negotiability:**
  *   **Non-Negotiable:** *Pratītyasamutpāda* as the causal framework. Any Buddhist ethics must be compatible with dependent origination.
  *   **Negotiable:** The normative leap. Deriving "ought" from "is" (interdependence) is philosophically contentious. Some schools rely on the intuitive self-evidence of suffering's unpleasantness rather than metaphysical grounding.

  **Joint Unsatisfiability Flag:**
  As noted in Desideratum 2, this is jointly unsatisfiable with strict **Aggregation** if interdependence is interpreted holistically. If boundaries are porous, the "units" required for aggregation dissolve.

  ***

  # Final Analysis

  ### The Single Most Eliminating Desideratum
  **Desideratum 2 (The Aggregation Problem under Anātman)** eliminates the largest number of recent hybrid accounts.

  Most contemporary attempts to reconcile Buddhism with consequentialism (specifically effective altruism or utilitarian frameworks) implicitly rely on a conventional notion of the "person" to perform the moral calculus. They treat individuals as discrete containers of welfare to be summed. However, they fail to provide the ontological machinery to justify this summation without violating *anātman*. If they adhere strictly to *anātman*, they often lose the ability to aggregate (since there is no one to sum), rendering the consequentialist calculus impossible. If they aggregate robustly, they smuggle in a substantial self, violating the core Buddhist metaphysical commitment. This metaphysical bottleneck filters out almost all "Buddhist Utilitarian" reconstructions that do not engage deeply with Abhidharma ontology or Madhyamaka two-truths doctrine.

  ### Joint Satisfiability of the Full Set
  **The full set is jointly unsatisfiable without abandoning or significantly modifying the definition of "consequentialist reasoning."**

  Specifically, **Desideratum 2 (Aggregation)** and **Desideratum 5 (Interdependence)** form a contradictory pair within the constraints of orthodox Buddhist metaphysics.
  1.  **Aggregation** requires discrete, countable units of suffering to compare magnitudes (e.g., "saving 5 beings is better than 1").
  2.  **Interdependence** (interpreted consistently with *anātman* and *śūnyatā*) implies that boundaries between beings are conventional fictions and that causal networks are holistic.

  To satisfy Aggregation, one must reify conventional persons enough to count them. To satisfy Interdependence, one must dissolve those boundaries to understand causal propagation. A reconstruction can prioritize one, but it cannot fully satisfy both without a category error.

  **Required Abandonment:**
  To make the system coherent, one must abandon the requirement for **strict numerical aggregation** (Desideratum 2) in favor of a **comparative intensity** model. The theory must shift from "maximizing the sum of welfare across units" to "reducing the intensity of *duḥkha* within the causal field." This moves the view away from classical consequentialism (which requires summation) toward a "Suffering-Reduction Consequentialism" that is qualitative rather than quantitative. If strict numerical aggregation is retained, Desideratum 5 must be weakened to allow for substantial boundaries, which undermines the Buddhist doctrine of emptiness. Therefore, the concept of "aggregation" itself must be the subset abandoned or radically redefined.
