answer: |-
  # Final Examination: Anthropics and Self-Locating Belief
  **Time Allowed:** 3 Hours  
  **Instructions:** Answer the following question. Citations are not required; arguments should be self-contained. Define all terms operationally.

  ## Question 1

  Consider a partition of cosmological hypotheses $\{T_i\}$ with objective priors $p_i$. Under each $T_i$, there exist $N_i$ observers in your reference class. You have no self-locating evidence other than your own existence.

  **Definitions:**
  *   **SSA (Self-Sampling Assumption):** Your credence in $T_i$ is proportional to the prior $p_i$. You reason as if you are a random sample from the actual observers, but since you lack indexical data distinguishing you from others, your credence distribution remains $P(T_i) = p_i$.
  *   **SIA (Self-Indication Assumption):** Your credence in $T_i$ is proportional to the number of observers $N_i$ it posits. $P(T_i) = \frac{p_i N_i}{\sum_j p_j N_j}$.

  Let an available action $A$ generate total welfare $U_i$ under hypothesis $T_i$.

  **(a)** Assume $N_i$ is fixed independent of action $A$. Show that an agent maximizing **Expected Total Welfare** using **SSA** credences ranks actions identically to an agent maximizing **Expected Average Welfare** using **SIA** credences. Derive this equivalence explicitly. [8 marks]

  **(b)** Now consider the following case:
  *   $T_1$: $10^6$ observers, welfare 100 each. Prior $p_1 = 0.5$.
  *   $T_2$: $10^{12}$ observers, welfare 100 each. Prior $p_2 = 0.5$.
  *   **Policy $\pi$**: If $T_1$ is true, create an additional $10^{12}$ observers at welfare 1. If $T_2$ is true, nothing happens.

  Calculate the expected value of $\pi$ versus $\neg \pi$ for both packages (SSA+Total and SIA+Average). Demonstrate that they now recommend opposite actions. Explain precisely why the equivalence derived in (a) fails here, focusing on the role of $N_i$ in the SIA probability function. [10 marks]

  **(c)** Given the result in (b), is the dispute between SSA and SIA merely verbal or pragmatic? Discuss whether this equivalence holds if (i) the agent is risk-averse regarding welfare aggregation, or (ii) the new observers created by $\pi$ fall outside the agent's reference class. What does this imply about the normative force of SIA? [7 marks]

  ***

  ## Model Answer

  **(a) The Equivalence Derivation**
  Let $W = \sum_j p_j N_j$ be the normalization constant for SIA.
  Under **SSA + Total Welfare**, the expected value of action $A$ is:
  $$E_{SSA}[U_{total}] = \sum_i P_{SSA}(T_i) U_i = \sum_i p_i U_i$$
  Under **SIA + Average Welfare**, note that Average Welfare $\bar{U}_i = U_i / N_i$. The expected value is:
  $$E_{SIA}[\bar{U}] = \sum_i P_{SIA}(T_i) \bar{U}_i = \sum_i \left( \frac{p_i N_i}{W} \right) \left( \frac{U_i}{N_i} \right)$$
  The $N_i$ terms cancel in the summation:
  $$E_{SIA}[\bar{U}] = \frac{1}{W} \sum_i p_i U_i$$
  Since $N_i$ is fixed independent of action, $W$ is constant across all available actions. Therefore, maximizing $\sum p_i U_i$ is ordinally equivalent to maximizing $\frac{1}{W} \sum p_i U_i$. The two packages induce identical preference orderings. The "weight" $N_i$ is simply shifted from the probability term (SIA) to the value term (Total Utilitarianism).

  **(b) The Variable-$N$ Break**
  **SSA + Total Calculation:**
  Priors remain $0.5/0.5$.
  $V(\neg \pi) = 0.5(10^6 \cdot 100) + 0.5(10^{12} \cdot 100) \approx 5 \cdot 10^{13}$.
  $V(\pi) = 0.5[(10^6 \cdot 100) + (10^{12} \cdot 1)] + 0.5(10^{12} \cdot 100) \approx 5 \cdot 10^{13} + 5 \cdot 10^{11}$.
  SSA recommends $\pi$ (gain $\approx 5 \cdot 10^{11}$).

  **SIA + Average Calculation:**
  *Without Policy:* $N_1 = 10^6, N_2 = 10^{12}$. $P_{SIA}(T_1) \approx 0, P_{SIA}(T_2) \approx 1$.
  $E[\bar{U}] \approx 1 \cdot 100 = 100$.
  *With Policy:* $N_1' \approx 10^{12}$ (original + new), $N_2 = 10^{12}$.
  Now $N_1' \approx N_2$, so $P_{SIA}(T_1) \approx 0.5, P_{SIA}(T_2) \approx 0.5$.
  Average welfare in $T_1$ drops: $\bar{U}_1' \approx \frac{10^8 + 10^{12}}{10^{12}} \approx 1$.
  Average welfare in $T_2$ remains 100.
  $E[\bar{U}] \approx 0.5(1) + 0.5(100) \approx 50$.
  SIA recommends $\neg \pi$ (drop from 100 to 50).

  **Explanation of Failure:**
  The equivalence in (a) relied on $W$ being constant across actions. Here, $\pi$ changes $N_1$, making observer numbers endogenous to the action. In the SIA package, changing $N_i$ performs double duty: it alters the welfare average *and* it alters the credence $P_{SIA}(T_i)$. By creating observers in $T_1$, the agent makes $T_1$ more likely to be true (from her self-locating perspective), thereby upweighting the hypothesis where average welfare is catastrophically low. The SSA package treats $N$ only in the welfare sum; the SIA package treats $N$ in both the prior and the welfare function. When $N$ is action-dependent, the "bookkeeping" cancellation fails because the denominator $W$ is no longer invariant.

  **(c) Implications and Caveats**
  The equivalence in fixed-$N$ cases suggests the SSA/SIA dispute may be merely pragmatic (a choice of accounting) rather than substantive regarding action. However, (b) shows they diverge on population ethics, specifically regarding the "dilution" of average welfare. SIA carries an intrinsic penalty for creating observers in low-welfare worlds because doing so increases the probability that one is in that world.

  Two critical qualifications break the equivalence even further:
  1.  **Risk Aversion:** The derivation assumes linear expectation. If the agent maximizes $E[f(U)]$ for concave $f$, the cancellation in (a) fails because $f(\frac{U}{N}) \neq \frac{f(U)}{N}$. SIA+Average becomes more risk-averse regarding population size than SSA+Total.
  2.  **Reference Class Membership:** SIA weights by observers *in the reference class*. If the policy creates observers who are not subjectively indistinguishable from the agent (e.g., they live in a different era or have different qualia), $N_1$ does not increase for SIA purposes. The credence shift vanishes, but the average welfare still drops. SIA would reject the policy even more strongly, while SSA+Total remains unchanged.

  This implies SIA is not normatively neutral; it encodes a specific "dilution pressure" against adding lives that SSA does not, unless one adopts Total Utilitarianism to offset it. The dispute is substantive where population size is variable.

  ***

  ## Marking Scheme (25 Marks)

  **Part (a): Derivation of Equivalence (8 Marks)**
  *   **3 Marks:** Correctly states SSA Expected Total Value formula ($\sum p_i U_i$).
      *   *Penalty:* Using $N_i$ in SSA credences (-2).
  *   **3 Marks:** Correctly states SIA Expected Average Value formula and shows cancellation of $N_i$.
      *   *Penalty:* Failing to divide $U_i$ by $N_i$ for average welfare (-2).
  *   **2 Marks:** Explicitly notes that $W$ (normalization constant) must be constant across actions for equivalence to hold.
      *   *Penalty:* Claiming equivalence holds unconditionally without noting fixed $N$ (-2).

  **Part (b): The Break Case (10 Marks)**
  *   **3 Marks:** Correct SSA calculation showing acceptance of policy (gain $\approx 5 \cdot 10^{11}$).
      *   *Penalty:* Arithmetic error in powers of 10 (-1).
  *   **3 Marks:** Correct SIA calculation showing rejection of policy (drop in Exp. Avg. Welfare).
      *   *Penalty:* Failing to update SIA credences after policy change (-3).
  *   **4 Marks (The A-Grade Discriminator):** Explanation that $N_i$ is now endogenous. Must state that in SIA, changing $N$ alters *both* the welfare term and the probability term (double counting/denominator shift), whereas SSA only alters welfare.
      *   *Cap:* **Papers failing to identify the endogeneity of $N$ in SIA credences cannot score above 18/25 (High 2:1), regardless of calculation accuracy.**

  **Part (c): Implications & Caveats (7 Marks)**
  *   **2 Marks:** Addresses "Verbal vs. Substantive": Equivalence is pragmatic in fixed cases, substantive in variable cases.
  *   **3 Marks:** Identifies a valid qualification breaking equivalence (Risk Aversion OR Reference Class restrictions).
      *   *Extra Credit:* Noting that if new observers are outside the reference class, SIA credences don't shift but averages do, widening the divergence (+1 Bonus, max 25).
  *   **2 Marks:** Normative conclusion: SIA implies a specific incentive structure (dilution pressure) distinct from SSA.

  **General Penalties**
  *   **Citation Hunting:** Attempting to cite Bostrom/Name-drop without operational definition (-2).
  *   **Confusion:** Treating SSA as weighting by $N$ (-5).
  *   **Word Count:** Significantly under 800 words in essay portion (-1).

  **Grade Boundaries**
  *   **First (20-25):** Flawless math, clear identification of endogeneity (Part b), sophisticated caveat (Part c).
  *   **Upper Second (15-19):** Correct math, but misses the *mechanism* of the break (thinks it's just about totals vs averages, not credence shifts).
  *   **Lower Second (10-14):** Math errors or fundamental confusion on SSA/SIA definitions.
  *   **Fail (<10):** Cannot derive equivalence or apply definitions.
