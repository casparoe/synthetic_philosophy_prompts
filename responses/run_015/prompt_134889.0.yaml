answer: |-
  Your instinct that there is only one thing on the pedestal is shared by many philosophers, but the journey to that conclusion is far more contested than the book suggests, and the book's portrayal of the opposing view contains several significant distortions that obscure the real debate. To begin with the setup, professional metaphysicians generally accept the initial scenario involving Goliath the statue and Lumpl the clay as a valid thought experiment for testing our intuitions about identity and persistence. The argument from differing properties, often called the argument from Leibniz's Law, is also accepted as the core motivation for believing the statue and the clay are distinct. The logic is sound: if object A has a property that object B lacks, then A cannot be identical to B. Since the clay exists before the statue and survives squashing while the statue does not, they appear to have different properties. However, philosophers would note a subtle simplification here regarding how properties are counted across time. Some theorists, known as four-dimensionalists, argue that objects are extended in time like worms, so the statue and the clay are merely different temporal segments of a larger spacetime worm, which allows them to share all their properties at every moment they coexist. But for those who view objects as wholly present at each moment, the argument from differing properties remains a powerful reason to doubt identity.

  Where the book moves from simplification to outright misstatement is in its claim that the constitution view is generally regarded as refuted because it implies two solid objects fill the same place. While it is true that the constitution view accepts co-location, meaning the statue and the clay occupy the same spatial region simultaneously, this is not considered a refutation in contemporary metaphysics but rather a costly consequence that proponents are willing to bear. Prominent philosophers such as Lynne Baker and Michael Burke have defended this view extensively, arguing that co-location is not impossible but merely counterintuitive. The book's objection that this would result in double weight or double cost is a standard objection known as the problem of causal exclusion or the double-counting worry, but constitution theorists have a ready response that philosophers would accept as viable if not definitive. They argue that weight is a property of the matter, not the object count, so two co-located objects do not weigh twice as much because they share the same mass-bearing constituent. Similarly, the museum buys the statue, which is constituted by the clay, and pays for the value of the art, not the sum of the objects. Therefore, a working philosopher would reject the book's claim that the view is refuted; instead, they would describe it as a live, controversial option that competes with others on the grounds of theoretical utility rather than logical impossibility.

  The book's alternative, which suggests there is only one object picked out by two descriptions and that survival is a matter of language, is a position known as ontological deflationism or conceptualism, associated with philosophers like Eli Hirsch. While this view has defenders, it is not the uncontested default solution the book presents. Many realists argue that persistence conditions are not merely matters of how we choose to talk but are grounded in objective facts about causal continuity, biological life, or functional integrity. For instance, a human being survives certain changes but not others regardless of our linguistic conventions, suggesting that the world itself dictates persistence conditions. Therefore, a philosopher working on these questions would accept the book's alternative as one coherent position among several but would reject the implication that it is the only rational conclusion or that it dissolves the problem entirely without residual metaphysical costs. The claim that survival is not a fact about the world but a matter of description is itself a substantive metaphysical claim that many realists dispute.

  The most troubling part of the chapter you encountered is the extended case involving grain-by-grain replacement and subsequent squashing, specifically the book's assertion that the constitution theorist must say the statue is never really lost and comes back when the clay is re-formed. This is a significant misstatement of the constitution view. A sophisticated constitution theorist distinguishes the statue from the clay precisely to avoid the conclusion that the statue survives what the clay survives. On the constitution view, the statue exists only when the clay is arranged in a specific way that realizes the properties of a statue. When the clay is squashed into a ball, the constitution relation is broken, and the statue ceases to exist, even though the clay persists. When the clay is re-sculpted, a new statue is constituted, or perhaps the old one is restored, depending on the specific criteria for statue identity, but not simply because the clay survived. The book seems to argue that if the clay survives, the statue must somehow survive latent within it, but this conflates the constitution view with the identity view it seeks to oppose. Philosophers would reject the book's characterization here because it attributes an absurd consequence to the constitution view that the view was explicitly designed to avoid. The constitution theorist says the statue goes out of existence when squashed, full stop. The question of whether the re-sculpted object is the same statue depends on whether there is sufficient continuity of form and intention, not merely on the persistence of the clay.

  Given these corrections, the book's two main conclusions do not survive intact. The first conclusion, that the two-object view is refuted, is false by the standards of current philosophical discourse. The constitution view remains a dominant theory in material constitution debates, defended by serious scholars who have addressed the co-location and weight objections. It is not a refuted theory but a contested one, and treating it as dismissed misinformation misleads the reader about the state of the field. The second conclusion, that the alternative turns the puzzle into a merely verbal one, is also too strong. While deflationists argue that ontological questions are verbal, this is not a settled fact but a specific philosophical stance that competes with robust realism. Even if one accepts there is only one object, determining whether it survives squashing often involves objective facts about its structure and history, not just linguistic choice. Therefore, the puzzle is not dissolved into mere semantics but shifted to a debate about whether our concepts or the world itself determines persistence.

  Your instinct that there is only one thing on the pedestal aligns with the monist position, which is widely held, but the reasoning provided by the book to support it is flawed. You do not need to accept the constitution view to acknowledge that the book's arguments against it are weak. The flaw in the argument from differing properties that you sensed is likely not in the logic itself, which is valid, but in the assumption that we must multiply objects to account for different properties. Monists solve this by denying that the statue and the clay are distinct subjects of properties in the first place, or by adopting a theory of temporal parts where the difference is explained by different stages of the same object. However, the book's claim that the constitution view leads to the statue surviving squashing is a straw man that you were right to find unconvincing. In summary, while the book correctly identifies the tension between our intuitions about identity and persistence, it misrepresents the sophistication of the opposing view and presents a controversial deflationary solution as the only rational outcome. A working philosopher would tell you that the puzzle remains open, the constitution view is still in the running, and the question of whether survival is a fact or a convention is itself a matter of deep metaphysical disagreement rather than a settled lesson.
