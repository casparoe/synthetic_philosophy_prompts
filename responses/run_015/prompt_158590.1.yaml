answer: |-
  **DRAFT v0.4 — DO NOT CITE**
  **Adversarial Colaboration: Gricean Boundaries in Institutional Contexts**

  **Participants:**
  *   **Camp A:** Pure Intentionalists
  *   **Camp B:** Institutional Defaultists

  **Preamble**
  We've met over three sessions to hash out where Grice's account of non-natural meaning (meaning_nn) stops and institutional convention starts. We aren't trying to convert each other just yet, but we need a baseline document that shows where the ground is solid and where the fault lines are. Below is the joint statment of our current position.

  ### 1. Agreed Claims
  Both camps endorse the following propositions as the foundation for further debate:

  1.  **Saying vs. Implicating:** There is a principled distinction between what is said (the propositional content determined by convention and reference) and what is implicated (what is conveyed beyond the said).
  2.  **Cancellability:** Genuine conversational implicatures are cancellable without contradiction; if a putative implication cannot be denied without absurdity, it is likely part of what is said or a conventional implicature.
  3.  **Audience-Directedness:** Speaker meaning is not a solipsistic act; it essentially involves an orientation towards an audience (actual or hypothetical).
  4.  **Rationality of the CP:** The Cooperative Principle (CP) and its maxims provide the best available description of how rational agents manage information exchange in standard conversational contexts.
  5.  **The Role of Intention:** Intentions play *some* role in speaker meaning; neither camp argues that meaning is purely mechanical or devoid of psychology.

  ### 2. Table of Disagreements
  Where we diverge is on the *necessity* and *sufficiency* of individual psychological states versus institutional roles. We've phrased these neutrally so both sides can recognise their own view without feeling caricatured.

  | Issue | Camp A Emphasis (Pure Intentionalists) | Camp B Emphasis (Institutional Defaultists) |
  | :--- | :--- | :--- |
  | **Constitutive Ground** | Speaker meaning is constituted solely by the recognition of a complex intention (m-intention). | Speaker meaning can be partly constituted by role-based conventions independent of specific intention recovery. |
  | **Convention's Role** | Conventions are merely heuristic shortcuts for recovering intentions; they do not generate meaning themselves. | Conventions in formal settings can generate meaning even if the specific intention is opaque or absent. |
  | **Failure Conditions** | If the audience fails to recognize the intention, speaker meaning has not been achieved. | If the institutional protocol is followed, speaker meaning is achieved even if the audience misses the private intent. |
  | **Scope of CP** | The Cooperative Principle is a transcendental condition for communication itself. | The CP is a default setting that can be overridden by local institutional norms. |

  ### 3. Cruxes
  We have identified three test cases where our theories yield different predictions. We agree these are the battlegrounds.

  #### Crux 1: The 'Silent Assent Protocol'
  **The Case:** A university committee is voting on a curriculum change. The Chair states: "If there are no objections, we will take it that the proposal is accepted." There is a pause. No one speaks. No one catches the Chair's eye. The Chair moves to the next item.
  **The Question:** Does the silence constitute speaker meaning (specifically, an assertion of assent) from the committee members?

  *   **Camp A Prediction:** **No.** Silence lacks an utterance and, crucially, there is no overt m-intention directed at the audience to recognize a belief. The members may *cause* the proposal to pass, but they do not *mean* anything by their silence. It is causal, not semantic.
  *   **Camp B Prediction:** **Yes.** The institutional protocol converts silence into a speech act. The role of 'committee member' carries a convention where silence = assent. Speaker meaning is generated by the institutional rule, regardless of whether any individual member formed a specific intention to communicate assent at that moment.

  #### Crux 2: The 'Double-Key Implicature'
  **The Case:** A peer reviewer writes in a report: "The author's use of methodology is certainly bold." In this specific sub-field, 'bold' is a standing institutional euphemism for 'reckless/flawed'. The reviewer knows this code and intends to criticize, but relies entirely on the convention to do the work.
  **The Question:** Is the critical implicature reducible to the reviewer's intention, or is it a hybrid of intention and convention?

  *   **Camp A Prediction:** **Reducible.** The implicature exists only because the reviewer *intended* the editor to recognize the criticism via the convention. The convention is just a tool for recovering the intention. If the reviewer didn't intend the criticism, there is no speaker meaning, only a misleading string of words.
  *   **Camp B Prediction:** **Hybrid.** The meaning is partly constituted by the institutional norm of the discipline. Even if the reviewer was ignorant of the norm (but should have known it qua reviewer), the criticism stands as part of the speaker meaning. The convention does work that intention alone cannot.

  #### Crux 3: Suspension of the Cooperative Principle
  **The Case:** During a criminal cross-examination, a defence barrister asks a witness: "You were at the club at 10 PM, weren't you?" The barrister already knows the answer and is not seeking information to cooperate with the witness's narrative, but to trap them in a contradiction for a jury.
  **The Question:** Is the Cooperative Principle locally suspended here?

  *   **Camp A Prediction:** **No.** The CP is not suspended; it is merely strained. The communication still relies on the witness assuming the barrister is being truthful (not lying about the time) and relevant. If the CP were fully suspended, communication would collapse into noise. The adversarialism is a higher-order goal, but the communicative mechanism remains Gricean.
  *   **Camp B Prediction:** **Yes.** Institutional maxims (e.g., 'Be Adversarial', 'Test Credibility') override the CP maxims (e.g., 'Be Helpful'). The barrister is not cooperating with the witness; they are using the institutional framework to extract truth via conflict. The default settings of conversation are switched off.

  ***

  **Next Steps:**
  We need to run these cases past a few more intuitions before locking v1.0. Camp A thinks Camp B is conflating *uptake* with *meaning*; Camp B thinks Camp A is ignoring the sociology of language. We'll reconvene next month.

  *(Signed)*
  **The Working Group**
