prompt: |-
  Construct a realistic one-paragraph thought experiment set in an ordinary workplace or family context in which a person performs the morally correct action with good consequences, yet a pure-motive Kantian account denies the act any moral worth while a counterfactual-stability account of acting for reasons grants it full worth. Engineer the case around motivational overdetermination with counterfactual robustness: the agent’s actual causal chain runs through a non-moral motive—say, avoiding professional embarrassment or maintaining an unreflective habit—yet she possesses a stable disposition to respond to the moral reason, such that she would still have acted correctly had that non-moral motive been absent. Do not invoke science fiction, demons, perfect predictors, or exotic physics. After presenting the scenario, show the exact verdict each view delivers and why; identify the single structural feature that drives the divergence; explain what happens to the disagreement if counterfactual stability is removed; and present how a Kantian defender would attack the case. Be explicit about whether the divergence is genuinely generated by the theories or merely stipulated by the setup. Finally, state how confident you are in your analysis and single out the point about which you are least sure.
