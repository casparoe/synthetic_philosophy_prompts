      *   **The KK Principle:** $Kp \to KKp$. Often associated with internalism and the idea that knowledge is a transparent mental state.
      *   **Jaden's Position:** Anti-luminosity applies to *being in a state* (e.g., feeling warm). KK applies to *propositional knowledge*. Even if I don't always know I'm warm, if I *do* know it, I can know that I know it. He leans on externalist safety conditions.
      *   **Sam's Position:** KK was motivated by the idea that mental states are transparent (luminous). If luminosity fails, KK loses its footing. Also, moving to safety/reliabilism betrays the internalist motivation for KK. Empirical overconfidence suggests second-order processes aren't reliable.
