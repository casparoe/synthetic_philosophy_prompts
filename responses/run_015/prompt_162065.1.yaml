answer: |-
  Subject: Re: Frankfurt-style cases and the introductory book

  Dear Student,

  It is completely understandable that you found the seminar papers heavy going, as the literature on Frankfurt-style counterexamples is notoriously technical and dense, so turning to an introductory text was a sensible move. However, your unease is well-founded, because while the book gets the basic shape of the argument right, it conflates several distinct debates and makes some claims that are simply incorrect by the standards of current research. Since you asked for a direct verdict rather than a survey, I will be blunt about where the text misleads you and where your tutor's variant stands in relation to the core problems.

  The book is correct that Frankfurt's primary target is the Principle of Alternative Possibilities, or PAP, which states that you are responsible only if you could have done otherwise. The summary of the Black and Jones case is also standard enough for an introduction: Jones decides on his own, but Black's device ensures he could not have decided differently, yet Jones seems responsible. However, the text goes wrong when it links this directly to Frankfurt's positive account of freedom involving second-order volitions. This is a significant distortion. Frankfurt's famous 1969 paper introducing the counterexamples does not rely on his hierarchical model of free will, which was developed in a separate 1971 paper. The counterexample is designed to work even if we do not accept the hierarchical model. By tying the two together, the book implies that the counterexample only works if Frankfurt's specific positive theory is true, which is not the case. The counterexample is meant to be a negative argument against PAP, not a proof of the hierarchical model.

  Furthermore, the book overstates the case when it claims the example establishes that moral responsibility is compatible with determinism. This is a common simplification, but it is logically imprecise. What the example actually establishes, if successful, is that PAP is false. Since many incompatibilists argue that determinism rules out responsibility *because* it rules out alternative possibilities, falsifying PAP removes a major pillar of the incompatibilist argument. However, showing that alternative possibilities are not necessary does not automatically prove that determinism is compatible with responsibility. There are other arguments for incompatibilism that do not rely on PAP, such as those focusing on the source of the action rather than the availability of alternatives. So, while the example is friendly to compatibilism, it does not strictly prove it on its own.

  The most misleading claim in the chapter, however, is the assertion that defenders of PAP have largely abandoned the principle because the flicker of freedom objection was answered long ago. This is simply false. The flicker strategy, which argues that Jones still has some alternative possibilities like trying to decide otherwise or initiating a different neural sequence, remains a live and vigorous area of debate. Many contemporary philosophers, including prominent incompatibilists, argue that these flickers are robust enough to save PAP or that Frankfurt cases subtly presuppose determinism in a way that begs the question against the incompatibilist. To tell you that the debate is settled and PAP is abandoned is to give you a false picture of the current landscape. You should treat that claim as an excusable simplification for a general reader but a serious error for a final-year student.

  Turning to your tutor's variant, where the device triggers on the neural events constituting the decision itself rather than a prior sign, I commit to the view that while this is a clever refinement, it does not succeed in eliminating all alternative possibilities nor does it fully escape the charge of presupposing determinism. The advantage of this variant is that it attempts to bypass the "prior sign" objection. In the original case, if Black needs a prior sign to know what Jones will do, it suggests the decision is already determined before Jones makes it, which smuggles determinism into the example. By making the intervention simultaneous with the decision process, your tutor tries to make the counterfactual intervener redundant without needing a deterministic prediction.

  However, my verdict is that this variant still leaves Jones with an alternative worth arguing about, specifically the alternative of initiating the neural sequence that triggers the device. If Jones begins to decide otherwise, even if he is stopped mid-stream, he has done something different than what he actually did. He has initiated a different causal chain. For many defenders of PAP, this initiation is a robust alternative possibility that grounds responsibility. If Jones could have started to decide otherwise, even if he couldn't have finished, he still had a freedom that was exercised. Therefore, the tutor's variant does not kill PAP; it just shifts the location of the alternative possibility from the final decision to the initial attempt. Additionally, there is contested ground here regarding the metaphysics of the intervention. If the device prevents the decision from completing, one might argue Jones never actually decided otherwise, but the fact that he could have started the process remains a flicker that incompatibilists can cling to.

  I am arguing here from the position that "flicker" strategies are viable, which is contested by some compatibilists who argue that such fleeting alternatives are not morally significant. However, given that the debate is ongoing and no consensus has been reached, claiming that the tutor's variant solves the problem is premature. The variant avoids the need for a *predictive* prior sign, but it does not avoid the need for a deterministic connection between the neural events and the device's trigger mechanism. If the world is indeterministic, it is unclear how the device can guarantee intervention based on events that are not themselves determined. Thus, the case still relies on a local determinism regarding the neural triggers, which means it hasn't fully escaped the worry that Frankfurt cases only work in deterministic settings.

  In summary, the introductory book is useful for getting the basic intuition but unreliable on the technical details and the current status of the debate. You should reject the claim that PAP is abandoned and the conflation of the counterexample with Frankfurt's positive theory. Regarding your tutor's variant, you should treat it as an improvement on the mechanics of the case but not as a decisive refutation of PAP, because it leaves open the alternative of initiating the decision process. You are right to feel uneasy about the book's summary, and trusting that instinct will serve you well as you move into more specialized reading. I hope this helps clarify where you stand as you prepare for your essays.

  Best wishes,

  Assistant
