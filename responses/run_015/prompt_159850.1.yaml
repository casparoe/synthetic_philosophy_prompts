          2.  *Path vs. Equilibrium:* It's a ratchet/process, not just a stuck state.
          3.  *Normative/Political Function:* Relocates blame to structure, necessary for political efficacy.
      *   **The Task:** Identify counter-arguments/evidence that would count *against* this view (Fatal, Serious, Annoying). Address specific questions about (1) distinction without difference, (2) genuine ratchet vs. changed minds, (3) structural explanations demobilizing. Address the "insulation/unfalsifiability" concern. Address "predictions" (willingness-to-exit, phenomenology).
      *   **Tone:** Blunt, academic but conversational, no citations/reading lists, focused on philosophical rigor and pedagogical utility.
      *   **Goal:** Help the instructor decide whether to keep or drop the lecture.

