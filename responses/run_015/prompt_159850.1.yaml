      *   Address specific questions (distinction without difference, ratchet vs mind change, demobilization)? Check.
      *   Address insulation? Check.
      *   Address predictions? Check.
      *   Address historical cases? Check.

      *(Self-Correction on "Fatal" Defeaters)*: A fatal defeater makes the theory untenable. A serious one requires major revision. An annoying one is a boundary condition.
      *   For (1): If the remedy is actually the same (state enforcement), the distinction is fatal.
