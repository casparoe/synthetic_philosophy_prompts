      *   "Injecting attribution conditions changes the boundary conditions...?" -> Address in conclusion.

  9.  (Self-Correction on "Non-Negotiable"): What is non-negotiable? For a theory to be *adequate* for this specific seminar topic, it must address attribution. So "Attribution Clarity" is NN for *this project*, even if some philosophers deny agency exists. I will frame NN as "Required for the coherence of the granular project" and CS as "Philosophical stance dependent."

