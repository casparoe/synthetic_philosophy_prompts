answer: |-
  It is a pleasure to engage with a mind that has naturally reconstructed some of the most difficult problems in the metaphysics of causation. Your intuitions are not "inconsistent" in a sloppy way; they track distinctions that professional philosophers have spent fifty years trying to formalize. You have correctly identified that *causation* (what happened) and *explanation* (what we say about it) are related but distinct tasks. You have also spotted the difference between *preemption* (Suzy's rock) and *overdetermination* (the two fires), which is the single hardest technical hurdle in causal theory.

  As requested, I will not shortcut this. I will begin by brainstorming candidate principles, select the one that best fits your web of beliefs, formalize it, and then test it against your cases and the new ones you proposed.

  ### Part 1: Brainstorming Candidate Principles

  Here are eight candidate principles I considered before settling on the one I recommend. I include the ones I reject to show you why they fail your specific test cases.

  1.  **The "But-For" Test (Counterfactual Dependence):** *C is a cause of E if, had C not occurred, E would not have occurred.*
      *   **Reject:** This fails your **Fire Case**. If Arsonist A hadn't acted, the warehouse still burns (due to Arsonist B), so A is not a "but-for" cause. You insist both are causes, so this rule is too narrow.
  2.  **The Regularity Principle (Humean):** *C is a cause of E if events like C are always followed by events like E.*
      *   **Reject:** This fails **WWI**. The alliances didn't *always* lead to war; they led to war *this time*. It also struggles with singular events like the **Titanic** (only one Titanic).
  3.  **The INUS Condition:** *C is an Insufficient but Necessary part of an Unnecessary but Sufficient set.*
      *   **Reject:** While technically close, this fails **Billy's Rock**. Billy's throw is part of a sufficient set (Billy + Air + Bottle), but you reject it as a cause. INUS conditions often count "backup" causes that were preempted, which violates your intuition.
  4.  **Probabilistic Relevance:** *C is a cause of E if C raises the probability of E.*
      *   **Reject:** You explicitly flagged this in **WWI**. You say the Alliances "mattered more" than the Wrong Turn, even if the Wrong Turn raised the probability more. You value *structural depth* over *probability raising*.
  5.  **Physical Process Transfer:** *C is a cause if there is a physical transmission of energy from C to E.*
      *   **Reject:** This works for **Rocks** and **Fires**, but fails **2008 Crisis** and **Alliances**. There is no physical energy transfer from "subprime lending" to "market crash" in the same sense as a rock hitting a bottle.
  6.  **The "Live-Swap" Rule (Your Draft):** *C is a cause if a live alternative would have prevented E, unless a second independent route was already moving.*
      *   **Reject (in current form):** As you noted, the "independent route" clause kills the **Fire Case**. Both fires are independent routes. We need to distinguish routes that *actually complete* from routes that *would have*.
  7.  **Pure Pragmatism:** *C is a cause if the historian finds it useful to cite.*
      *   **Reject:** You want an objective ground for "is a cause" distinct from "worth citing." This collapses the distinction you want to maintain.
  8.  **Normative Expectation:** *C is a cause if it is an abnormal deviation from what was expected.*
      *   **Reject (as standalone):** This explains why **Greed** isn't a cause (it was normal), but it struggles with the **Fire Case** (arson is abnormal, but the rule doesn't handle the two-fire logic). It needs to be a clause, not the whole principle.

  ### Part 2: The Selected Principle

  The principle that best captures your verdicts is a hybrid of *Process Completion* and *Contrastive Explanation*. I call it the **Completed Contrastive Path Principle**.

  It separates the question "Is it a cause?" (Ontology) from "Is it significant?" (Historiography).

  #### (1) The Principle Stated Precisely

  **A factor C is a *cause* of outcome E if and only if:**
  1.  **Contrast:** There is a plausible alternative to C (a "live swap") that was available to the agents or the situation, such that had that alternative occurred, E would likely not have occurred *in the specific way it did*.
  2.  **Completion:** C must be part of a causal process that *actually completed* and contributed to E. (If a backup process existed but was interrupted or preempted by C, the backup is not a cause. If multiple sufficient processes all *completed*, all are causes).
  3.  **Abnormality:** C represents a deviation from a relevant baseline of expectation or normal functioning for that system. (This excludes constant background conditions like "greed" or "gravity" unless they spiked abnormally).

  **A cause C is *historically significant* (worth citing) if and only if:**
  4.  **Contingency:** The absence of C would have opened a plausible path to a *substantively different* historical outcome (not just a delay or minor variation).
  5.  **Depth:** C explains *why* the mechanism was vulnerable, rather than merely *when* it triggered. (Structural causes rank higher than triggering causes).

  ***

  #### (2) Clause-by-Clause Note on Your Verdicts

  Here is how each clause maps to the specific intuitions you listed:

  *   **Clause 1 (Contrast):** This forces your **Greed** verdict. Greed was constant; there was no "live swap" where lenders were altruistic in 2008. It also handles the **Submarine Officer** (see below). It forces the **Lifeboats** verdict: the "swap" is having enough lifeboats, which was a live policy option.
  *   **Clause 2 (Completion):** This is the repair for your **Fire vs. Rocks** problem.
      *   *Rocks:* Suzy's process completed; Billy's was preempted (interrupted). Billy fails Clause 2.
      *   *Fire:* Both fires burned and contributed heat. Both processes completed. Both pass Clause 2.
      *   *Chernobyl Near-Miss:* The near-miss at the sister plant did not complete a process leading to *this* explosion (nobody knew). It fails Clause 2.
  *   **Clause 3 (Abnormality):** This separates **Iceberg** from **Water**. Water is normal for the ocean; hitting an iceberg is not. It separates **Greed** (normal in boom) from **Leverage** (abnormal spike). It handles the **Driver's Wrong Turn**: a wrong turn is abnormal, so it is a cause, but...
  *   **Clause 4 (Contingency):** ...Clause 4 explains why the Wrong Turn is **not worth citing**. Even without the turn, the Alliances (Clause 5) made war highly probable. The turn changed the *timing*, not the *substantive outcome*.
  *   **Clause 5 (Depth):** This forces your **WWI Ranking**. Alliances are "deep" (structural vulnerability); the Turn is "shallow" (trigger). This allows you to say Alliances "mattered more" without relying on probability raising.
  *   **Distinction (Cause vs. Significant):** This accommodates your methodological view that there is no "the cause," but we can rank them. The Driver's Turn is a *cause* (Clause 3) but not *significant* (Clause 4).

  ***

  #### (3) Verdicts on New Cases

  Here is how the principle applies to the three cases you hadn't raised:

  **Case A: "No war was fought on its soil" as a cause of a country's 20th-century prosperity.**
  *   **Verdict:** **Yes, it is a cause.**
  *   **Reasoning:**
      *   *Contrast:* The live swap is "war was fought on its soil."
      *   *Completion:* The absence of destruction allowed capital accumulation (a completed process).
      *   *Abnormality:* Given the surrounding conflict (e.g., WWII for USA/Canada), remaining untouched is a deviation from the regional norm.
      *   *Significance:* High. It meets the Depth and Contingency criteria.

  **Case B: A dam that held is a cause of the town's survival in a history of that town.**
  *   **Verdict:** **Yes, it is a cause.**
  *   **Reasoning:**
      *   This tests your **Absence** intuition. The principle treats absences as causes *if* there was a norm/expectation of failure or a live risk.
      *   *Contrast:* The dam breaking was a live physical possibility (flood conditions).
      *   *Abnormality:* Dams are built to hold; their holding is "normal," *but* in the context of a flood history, the *success* is the salient deviation from the disaster baseline.
      *   *Note:* If the dam was trivial and the flood minor, it fails Abnormality. If the flood was catastrophic and the dam engineered specifically to stop it, it passes.

  **Case C: My grandfather's decision to emigrate in the 1920s is a cause of my being alive.**
  *   **Verdict:** **Cause: Yes. Worth Citing: No.**
  *   **Reasoning:**
      *   *Cause:* It passes Contrast (he could have stayed), Completion (the lineage exists), and Abnormality (emigration is a specific event).
      *   *Significance:* It fails Clause 4 (Contingency) for a general history. While *you* wouldn't exist, *someone* would likely exist. For a history of "Why the 21st Century Population exists," it is too granular. For a family history, it is significant. This confirms your intuition that "worth citing" depends on the *scope* of the history being written.

  ***

  #### (4) Incompatibilities: What You Must Give Up

  No principle captures every intuition without cost. Here is the honest list of where my principle conflicts with your current hesitations, and what you must surrender to keep the system coherent.

  **1. The Submarine Officer Flip-Flop (Absences)**
  *   **Your Instinct:** You flip between "His refusal caused no war" and "Causation of absence is a category mistake."
  *   **The Conflict:** Your **Lifeboat** verdict requires us to accept absences as causes (the *lack* of lifeboats caused deaths). You cannot consistently hold that Lifeboats (absence) cause death but the Submarine Officer (absence of launch) did not cause peace.
  *   **The Cost:** You must give up the idea that "causation of absence is a category mistake."
  *   **The Fix:** The principle resolves the flip-flop using **Abnormality/Expectation**.
      *   *Lifeboats:* Safety regulations created an *expectation* of sufficient lifeboats. The absence was a violation of a norm. -> **Cause.**
      *   *Submarine:* In a nuclear crisis, the *default* expectation is often escalation, but the *normative* expectation of a rational officer is restraint. If the protocol was "Launch unless confirmed," his refusal is a deviation (Cause). If the protocol was "Do not launch unless ordered," his refusal is following the norm (Not a Cause, just background).
      *   *Recommendation:* To align with the Lifeboat case, you should say the Officer's refusal **was a cause**. It was a "live swap" (he could have launched) and it deviated from the "war script" expected by the situation.

  **2. Probability vs. Depth (WWI)**
  *   **Your Instinct:** You feel the Wrong Turn raised the probability of war more than the Alliances, but the Alliances "mattered more."
  *   **The Conflict:** Standard causal models equate "mattering more" with "raising probability more."
  *   **The Cost:** You must firmly reject probability as the metric for historical importance.
  *   **The Fix:** My Clause 5 (Depth) codifies this. You must accept that *structural vulnerability* (Alliances) outweighs *trigger probability* (Turn) in historical explanation, even if the math says otherwise. This is a philosophical commitment to **Explanatory Depth** over **Statistical Relevance**.

  **3. The "Independent Route" Clause (Your Draft)**
  *   **Your Instinct:** You wanted to exclude causes if a "second route already moving independently" would have produced the outcome.
  *   **The Conflict:** As you saw, this excludes the Arsonists.
  *   **The Cost:** You must modify your "independent route" clause to specify "independent route *that actually contributed*."
  *   **The Fix:** In the Fire case, both routes contribute. In the Rock case, Billy's route does not contribute (it is preempted). You must accept that *potential* backups don't count, only *actual* contributions do.

  ### Part 3: Repairing Your "Live-Swap" Rule

  You asked me to fix your rule if possible. Your draft was:
  > *Call a factor a live-swap cause... when there was some alternative... and... it doesn't count if the outcome would have been produced anyway by a second route already moving independently of it.*

  Here is the repaired version that saves your Fire verdict while keeping the Rock verdict:

  > **Repaired Live-Swap Rule:** A factor C is a cause if (1) there was a live alternative to C that would have prevented E, **AND** (2) there was no *other* sufficient process that **actually completed** independently of C to produce E.
  > *   *Correction Note:* In the Fire case, Arsonist B's process *did* complete, but it did not do so *independently of Arsonist A* in the sense of making A redundant; they were concurrent. The crucial distinction is **Preemption** vs. **Overdetermination**.
  > *   *Simpler Fix for your Rule:* Change "already moving" to "would have completed *without* C." In the Fire case, Fire B would have destroyed the warehouse *without* Fire A? Yes. So why is A a cause?
  > *   *Philosophical Reality:* You cannot fix this with a simple "independent route" clause. You must accept **Symmetric Overdetermination**.
  > *   *Final Repair:* "...and add a second clause: it doesn't count if the outcome would have been produced anyway by a second route **that preempted C or was preempted by C**. If two routes **both complete**, both are causes."

  ### Summary for the Pub Reading Group

  1.  **Causation is Two-Tiered:** Distinguish sharply between "What caused this?" (The Completed Contrastive Path) and "What should we write about?" (Significance/Depth).
  2.  **Absences Count:** You must accept that things *not* happening (lifeboats, submarine launch) can be causes, provided they violate a specific expectation or norm. This solves the Lifeboat/Submarine inconsistency.
  3.  **Preemption vs. Overdetermination:** Suzy's rock *stops* Billy's rock (Preemption = 1 cause). Fire A does *not stop* Fire B (Overdetermination = 2 causes).
