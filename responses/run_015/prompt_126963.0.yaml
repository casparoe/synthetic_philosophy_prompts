answer: |-
  Your intuition is spot-on. Your friend's analogy is seductive because it frames civic space as a commercial product, which makes the decision seem pragmatic rather than moral. But by mapping public memory onto corporate identity, the analogy smuggles in assumptions about ownership, purpose, and harm that don't hold up in the public sphere.

  Here is the breakdown of the correspondence, followed by the specific points where the analogy collapses, and finally, a verdict on the argument.

  ### 1. The Correspondence Table

  Here is how your friend's analogy maps the corporate world onto the civic world:

  | Corporate Rebranding Concept | Civic/Monument Concept | The Implication of the Map |
  | :--- | :--- | :--- |
  | **The Logo** | **The Statue / Street Name** | Treated as a visual identifier or label. |
  | **The Archive / Server** | **History Books / Museums** | Treated as passive storage for "old versions." |
  | **The Customers** | **The Citizens / Public** | Treated as consumers of the city's "brand." |
  | **Brand Damage** | **Public Offense / Harm** | Treated as a reputational risk to be managed. |
  | **The Rebrand** | **Removal / Renaming** | Treated as a neutral update for future relevance. |
  | **Shareholders / Board** | **City Council / Activists** | Treated as decision-makers with proprietary rights. |

  ### 2. Where the Analogy Breaks Down

  The analogy fails because it treats public space as *proprietary* and *functional*, whereas it is actually *collective* and *normative*. Here are the four specific fracture points.

  #### A. Identification vs. Honor (The Normative Break)
  *   **The Analogy:** A logo identifies a company (e.g., "This is Pepsi"). It is descriptive.
  *   **The Reality:** A monument does not just identify a person; it **honors** them. It is prescriptive.
  *   **The Break:** When a company changes a logo, they aren't saying the old logo was *evil*; they are saying it was *dated*. When a city removes a statue, it is often making a moral claim that the subject is *unworthy* of public honor.
  *   **Why it matters:** You can archive a logo without moral judgment. You cannot archive a statue of a slave trader without acknowledging that his presence in the town square was an active endorsement of his values. The "rebrand" implies progress; the removal implies correction.

  #### B. The "Archive" Fallacy (Passive vs. Active Memory)
  *   **The Analogy:** Old logos go into a digital folder. They are preserved perfectly, accessible if needed, but out of the way.
  *   **The Reality:** History books are not a neutral server. They are curated narratives. Furthermore, a statue moved to a museum changes its meaning entirely.
  *   **The Break:** In a town square, a statue says, "This is our hero." In a museum, that same statue says, "This is a historical artifact of what people used to believe." Moving it changes the *truth claim* of the object.
  *   **Counter-Monuments:** You mentioned the empty plinth. In branding, if you remove a logo, you put a new one up. If you leave a plinth empty, it is not a "null value." It is an active statement of **absence**. It forces the viewer to confront the removal itself. A deleted logo file generates no meaning; an empty plinth generates critical memory. The analogy cannot account for the mnemonic labor of *absence*.

  #### C. Deictic Anchors (The Navigation Break)
  *   **The Analogy:** A street name is like a product name (e.g., "iPhone 14" becomes "iPhone 15").
  *   **The Reality:** Street names are **deictic anchors**. They are coordinates used to navigate lived reality, pay taxes, receive mail, and find home.
  *   **The Break:** Changing a logo costs design fees. Changing a street name costs **cognitive load and material disruption** for every resident. It alters the "grid" of the city.
  *   **Why it matters:** If you rename "Main Street," you aren't just updating a label; you are severing the link between the current residents and the historical usage of that space. For some, that severance is liberating (no longer honoring a oppressor); for others, it is disorienting. But it is never "harmless" like a logo swap. It has friction. The corporate analogy ignores the friction of lived geography.

  #### D. Ownership (Private vs. Public)
  *   **The Analogy:** The company owns the logo. They can do what they want.
  *   **The Reality:** The public owns the square.
  *   **The Break:** Shareholders can vote to change a logo based on profit. Citizens cannot be "voted out" of their relationship with public space. When a city removes a monument, it is not managing a brand asset; it is adjudicating **who belongs** in the public narrative.

  ### 3. Does the Conclusion Survive?

  **No.** The conclusion that "removing or renaming is basically harmless rebranding" does not survive these disanalogies.

  If the analogy were true, removal would be:
  1.  **Neutral:** (It's not; it's moral).
  2.  **Costless:** (It's not; it disrupts navigation and memory).
  3.  **Proprietary:** (It's not; it's democratic).

  By calling it "rebranding," your friend minimizes the **moral weight** of the act. He frames the controversy as "people don't like change" (consumer resistance) rather than "people disagree on who is worthy of honor" (civic conflict). If the act is just rebranding, then activists *are* overreacting. But if the act is **moral correction**, then the "overreaction" is actually a debate about justice. The analogy hides the justice component.

  ### 4. A Less Misleading Analogy

  If your friend wants an analogy that captures the weight of public memory without the commercial baggage, suggest one of these:

  **Option A: Curating a Museum Exhibition (The "Hall of Fame" Model)**
  *   **The Map:** The city is a gallery. The statues are the exhibits.
  *   **Why it works:** Museums don't display everything they own. They curate based on a narrative. Removing a statue isn't "destroying history"; it's **de-accessioning** an item that no longer fits the educational mission of the gallery.
  *   **The Kicker:** In a museum, you can put a placard next to an empty spot explaining why something was removed. That captures the "counter-monument" labor your friend missed.

  **Option B: Revising a School Curriculum**
  *   **The Map:** The statues are the required reading list.
  *   **Why it works:** We don't burn the books (the archive remains). But we stop teaching them as the *moral standard* for the next generation (the public face).
  *   **The Kicker:** This acknowledges that what we put in front of children (or citizens) shapes their values. Keeping a book in the library isn't the same as making it mandatory reading. Keeping a statue in storage isn't the same as putting it in the square.

  **Option C: Zoning and Land Use**
  *   **The Map:** The statue is a building.
  *   **Why it works:** You can't just put any building anywhere. There are codes about safety, utility, and community benefit.
  *   **The Kicker:** If a building is found to be structurally unsound (morally hazardous), you don't keep it standing just because "it's history." You demolish it for public safety. This reframes the "harm" from "brand damage" to "civic safety."

  ### Summary for Your Friend
  You can tell him: *"The logo analogy assumes the city is a product we buy, but it's actually a story we live inside. Changing a logo is about marketing; changing a monument is about ethics. You can archive a JPG without consequence, but you can't archive a public honor without changing what the community values. It's not rebranding; it's re-curation."*
