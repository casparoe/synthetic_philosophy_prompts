answer: |-
  Dear Friend,

  I have been thinking deeply about our argument regarding whether any famine can truly be classified as a natural disaster, and I believe working through the 2011 famine in southern Somalia using Amartya Sen's entitlement framework offers a productive way to move past our stalemate. While Sen's classic cases often revolve around state actions or failures within recognized sovereign boundaries, the Somalia episode presents a complex variation that tests the limits of his model while ultimately reinforcing his core insight that famines are failures of distribution and command rather than mere shortages of food. To begin with, we must apply Sen's distinction between direct entitlement failure and trade-based entitlement failure to the conditions on the ground. The prolonged drought certainly caused a direct entitlement failure for subsistence farmers whose crop yields collapsed, meaning they lost command over food because their own production vanished. However, the situation for pastoralists and wage laborers was fundamentally different and points toward a trade-based entitlement failure. Pastoralists still possessed animals, yet the exchange value of those animals collapsed relative to grain prices, meaning they retained assets but lost the ability to command food through exchange. Similarly, displaced families who relied on labor markets found those markets disrupted or destroyed, severing the link between their work and their ability to purchase grain. Crucially, as you noted, regional markets held food and international warehouses were stocked, which confirms Sen's central thesis that aggregate food availability decline is not the primary driver of famine. If the famine were purely a natural disaster driven by drought, food prices would have skyrocketed everywhere due to scarcity, but instead, we see a localized collapse in purchasing power and access despite regional availability.

  However, stopping at this application ignores the specific political mechanics that make the Somalia case distinct from Sen's analyses of Bengal or the Great Leap Forward. In Sen's implicit model, the protection of entitlements is largely a function of state capacity and political accountability. He argues that democracies do not suffer famines because leaders must respond to voters, implying that famines occur when the state fails to protect citizens or actively deprives them. The 2011 Somalia famine complicates this because there was no functioning state to fail or respond. Instead, sovereignty was fractured, and a non-state armed group, Al-Shabaab, exercised control over distribution corridors. This reveals a limit in Sen's framework, which tends to treat the legal and political space as unified under a state authority, even if that authority is negligent. In southern Somalia, entitlement relations were not just unprotected by the state; they were actively mapped and destroyed by a rival sovereignty. Al-Shabaab blocked humanitarian agencies, taxed or seized livestock, and disrupted labor markets, effectively rewriting the entitlement map through coercion rather than economic shift alone. This suggests we need an extension of Sen's theory, perhaps what we might call a sovereignty-fractured mode of entitlement collapse. In this mode, no single authority holds the power to protect or destroy entitlements uniformly, and entitlements are subject to the whims of competing armed groups who may view food control as a weapon of war rather than a public good.

  When we map the actors to Sen's categories of entitlement relations, the theory becomes silent on the role of the armed group as an entitlement mapper. Pastoralists and wage laborers fit neatly into Sen's categories of those suffering exchange entitlement decline, and aid agencies represent an external attempt to restore entitlements through transfer. Yet Al-Shabaab does not fit the role of the state in Sen's model, which is usually cast as either a protector or a predator within a unified legal system. Here, the armed group acts as a gatekeeper who invalidates the legal means of commanding food that Sen assumes exist. By blocking aid and taxing movement, they severed the link between existing food supplies and the population's entitlement to access them. This forces us to ask whether the drought remains the right explanatory frame. While the drought triggered the vulnerability by reducing local production, the presence of food with blocked access shows that the famine was, in Sen's own terms, a failure of distribution and command. However, calling it a purely political crime requires us to broaden the definition of the political beyond statecraft to include insurgent governance and warfare. The famine was not merely a result of nature reducing supply, nor was it simply a state ignoring its citizens; it was a situation where access was engineered to fail by a non-state actor exploiting the vulnerability created by the drought.

  Ultimately, this episode confirms Sen's core thesis that famines are about distribution and command rather than aggregate availability, but it pushes that thesis to become something broader regarding the nature of political power. Sen argues that famine is an economic disaster that is often exacerbated by political decisions, but the Somalia case suggests that political decisions can constitute the entirety of the disaster even when natural shocks are present. The drought reduced the margin of error, but the famine itself was produced by the fragmentation of sovereignty and the weaponization of access. Therefore, we cannot call it a natural disaster, because the natural shock did not make starvation inevitable given the available food supplies in the region. Yet calling it a purely political crime in the sense of a state-led extermination might also be too narrow, as the intent was embedded in a complex web of insurgent strategy, market disruption, and humanitarian obstruction rather than a single centralized decree. The most accurate reading is that the famine was a political outcome precipitated by an environmental shock, where the entitlement failures were engineered by a fractured authority structure. This requires us to extend Sen's work to account for situations where the legal means of commanding food are not just unprotected by the state but are actively invalidated by competing powers. In this light, your skepticism about the term natural disaster is well-founded, as the presence of food with blocked access demonstrates that the catastrophe was man-made, even if the trigger was climatic. The entitlement approach holds up, but it must be expanded to recognize that in zones of fractured sovereignty, the power to destroy entitlements is dispersed among armed groups who operate outside the state-centric accountability mechanisms Sen relied upon to prevent such tragedies. I hope this helps clarify where I stand after working through the specifics, and I look forward to hearing your thoughts on whether this extension of Sen's framework resolves our disagreement.

  Warmly,

  Your Friend
