      *   **Problem:** The user argues that if music is a copy of the Will (which is formless, undifferentiated, blind striving), then music should be formless (the "drone test": a single sustained tone should be the highest music). Since this is absurd, the user thinks Schopenhauer's theory collapses into either unargued Platonism or proto-formalism.
      *   **Friend's Counter:** The friend (a composer) argues that the Will objectifies itself in graded, structured series, which music copies (bass = low grades, melody = human striving). This explains music's self-sufficiency vs. text.
