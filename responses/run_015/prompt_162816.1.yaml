      *   **Nature of the Will:** The Will is indeed one, formless, beyond space/time/individuation *in itself*. However, in the context of aesthetics and representation, Schopenhauer discusses how the Will *objectifies* itself.
      *   **The Hierarchy:** Schopenhauer explicitly maps musical elements to grades of the Will's objectification.
