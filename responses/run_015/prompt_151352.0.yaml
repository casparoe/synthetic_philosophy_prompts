prompt: |-
  I sit on our school board's Committee on Pluralism and Secularism — seven of us, three years of monthly meetings, and we've never once written down a principle, only decisions. We're in one of those jurisdictions where both traditions are pulling at once: the province has a secularism statute that binds people who work for the state, but the human rights code still obliges us to accommodate religion, and the two grind against each other at nearly every meeting. I've typed these up from memory so the dates and the order are probably a bit off, but the verdicts are right:

  - A student may wear a headscarf. A teacher may not wear one in front of her own class.
  - A student may wear a cross necklace. The big wooden crucifix that had hung in the main hallway since the fifties had to come down.
  - A Jewish student's exam that fell on a Saturday: we rescheduled it, no argument.
  - Daily halal meat in the cafeteria: refused. We required a genuinely adequate vegetarian alternative instead, and spent two meetings defining "genuinely adequate."
  - A Sikh boy's steel bangle: fine. A kirpan: refused, bladed object.
  - Year 9 girl excused from the partner-dance unit on modesty grounds: granted. Year 7 girl excused from swimming on modesty grounds: refused, but she may wear a full-coverage suit and we paid for one the first year. That pair still bothers me and I don't think we ever explained it.
  - An evangelical prayer group may use an empty classroom at lunch. It may not pray over the PA before exams.
  - The cafeteria is run by a private contractor. We put a clause in the contract saying their staff won't discuss religion with pupils, and then voted 4–3 that "we do not regulate the dress of staff we do not employ," with no reasons minuted.
  - A parent volunteer who wears a visible cross and comes in once a week to hear kids read: allowed, 4–3, "case by case," again no reasons.
  - Hindu parents objected to the yoga unit. We kept the yoga, dropped the Sanskrit posture names and the namaste at the end.

  Now the new one. There's a nonprofit homework club run out of a community centre — free, open to anybody, genuinely open, no proselytizing, parents sign a form saying so. It wants to run 3:15 to 5:30 in our library, and to keep using the school's sign-up sheets and the noticeboard, whose heading carries a short dedication to God. Three of its tutors: two women in headscarves, one man with a visible cross. And for the last fifteen minutes the tutors supervise kids in the schoolyard until parents show up, which is the part I keep getting stuck on — same people, same clothes, same property, but for a quarter of an hour they're doing something that looks a lot like what teachers do.

  My worry is that "the parents choose it" isn't the clean consent story it sounds like: this is the only free homework help in the neighbourhood, and for a lot of these kids the alternative is going home to an empty flat. One of our members keeps proposing a test — would a nine-year-old reasonably take this person to be speaking for the school? — and I can't tell whether that fits what we've already done or quietly overturns half of it.

  So: if we want to be consistent with ourselves, do we renew as is, renew with conditions, or decline? Which of our own precedents is the closest analogue, and what are the two or three rules that fit *everything* we've decided so far and then come apart on this one? What does each predict here, which one's your bet, and what would we be committing ourselves to either way? And what case should we put on next month's agenda, since we clearly won't say it out loud, to find out which rule we've actually been running?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a school board's Committee on Pluralism and Secularism (7 members, 3 years, monthly meetings).
      *   **Context:** A jurisdiction with conflicting legal frameworks (Secularism Statute vs. Human Rights Code).
      *   **Problem:** The committee has made decisions based on intuition/pragmatism without written principles. Now facing a new, complex case (Nonprofit Homework Club) that exposes inconsistencies.
      *   **Task:** Analyze past precedents, identify underlying (unwritten) rules, apply them to the new case, predict outcomes, and suggest a strategic agenda item to reveal the committee's true operating logic.
      *   **Tone:** Professional, analytical, empathetic to the complexity, slightly philosophical but grounded in policy. The user is tired of the inconsistency ("That pair still bothers me") and wants clarity.

  2.  **Deconstruct the Precedents (The "Case Law"):**
      *   *Headscarf:* Student Yes / Teacher No. (Rule: State neutrality applies to authority figures, not recipients.)
      *   *Cross/Crucifix:* Student Yes / Hallway Crucifix No. (Rule: Passive personal faith Yes / Institutional endorsement No.)
      *   *Jewish Exam:* Rescheduled. (Rule: Accommodation for individual religious obligation is mandatory.)
      *   *Halal Meat:* Refused (Vegetarian offered). (Rule: Systemic accommodation has limits; cost/logistics/universality matters.)
      *   *Sikh Bangle/Kirpan:* Bangle Yes / Kirpan No. (Rule: Safety trumps religious symbol if risk is tangible.)
      *   *Modesty (Dance/Swim):* Dance Yes / Swimming No (but suit provided). (Rule: Curricular core vs. peripheral? Safety/skill acquisition vs. participation? Inconsistency acknowledged by user.)
      *   *Prayer Group:* Classroom Yes / PA System No. (Rule: Private practice Yes / Public broadcast/Coercion No.)
      *   *Contractor Staff:* Dress unregulated / Speech regulated. (Rule: Employment status matters for dress, but function matters for speech.)
      *   *Parent Volunteer:* Cross allowed (4-3, case-by-case). (Rule: Ambiguous authority status creates friction.)
      *   *Yoga:* Kept activity, dropped spiritual trappings. (Rule: Secularize the *practice*, keep the *benefit*.)

  3.  **Identify the Underlying Tensions/Rules:**
      *   *Tension 1: Authority/Endorsement.* Does this look like the school speaking? (Teacher vs. Student, PA System vs. Classroom).
      *   *Tension 2: Accommodation vs. Neutrality.* Individual rights vs. State secularism.
      *   *Tension 3: Safety/Core Function.* Kirpan (safety), Swimming (core skill?), Halal (logistics).
      *   *Tension 4: Employment/Contractual Status.* Contractors vs. Employees vs. Volunteers.

      *   *Emergent Rule A (The "State Voice" Rule):* If you represent the institution, you must be neutral. If you are a private actor using space, you have more latitude.
      *   *Emergent Rule B (The "Coercion/Power" Rule):* If the student *must* be there or is under direct authority, restrictions tighten. If voluntary, they loosen.
      *   *Emergent Rule C (The "Visibility" Rule):* Passive symbols are okay for individuals; active proselytizing or institutional symbols are not.

  4.  **Analyze the New Case (Homework Club):**
      *   *Setting:* School Library (School Property).
      *   *Time:* 3:15 - 5:30 (After school, but overlaps with dismissal/supervision).
      *   *Activity:* Homework help + Yard Supervision.
      *   *Staff:* Nonprofit tutors (wearing religious symbols).
      *   *Signage:* School noticeboard (with "dedication to God").
      *   *The Crux:* The 15 mins yard supervision. Looks like teacher duty. Economic coercion (only free help available).

  5.  **Evaluate Options (Renew As Is, Conditions, Decline):**
      *   *Renew As Is:* Risks violating the "State Voice" rule (Yard supervision looks like school staff). Risks the "Endorsement" rule (Noticeboard dedication).
      *   *Decline:* Violates the "Accommodation/Access" rule (Human Rights Code, community need). Punishes the kids for the adults' symbols.
      *   *Renew with Conditions:* Most likely path. Needs to address the "State Voice" ambiguity.

  6.  **Develop the "Hidden Rules" (The Diagnostic):**
      *   *Rule 1: The Proxy Test.* Is the actor a proxy for the state? (Teachers = Yes, Contractors = Maybe, Volunteers = Maybe).
      *   *Rule 2: The Core Function Test.* Does the religious element interfere with the mandatory curriculum or safety? (Swimming = Core, Yoga = Adapted, Kirpan = Safety).
      *   *Rule 3: The Endorsement Test.* Does it look like the school is sponsoring the faith? (Crucifix = Yes, Headscarf on student = No).

      *   *Where they break:* The Homework Club.
          *   Proxy Test: They are supervising in the yard. That looks like state duty.
          *   Endorsement Test: Using the noticeboard with the dedication links the school to the club.
          *   Coercion Test: It's "voluntary" but economically necessary.

  7.  **Formulate the Recommendation:**
      *   *Decision:* Renew with Conditions.
      *   *Conditions:*
          1.  Yard supervision must be clearly delineated (high-vis vests? "Non-Staff" badges?). Or removed.
          2.  Noticeboard usage: Remove or cover the dedication when posting club info.
          3.  Clarify "Voluntary" nature (ensure no subtle pressure).
      *   *Closest Analogue:* The Parent Volunteer (Cross allowed, 4-3) mixed with the Contractor Staff (Speech regulated, dress not).
      *   *The "Bet":* The committee will likely focus on the *Yard Supervision* as the breaking point. That's where the "Teacher vs. Private" line blurs.

  8.  **Draft the Agenda Item (The "Trap"):**
      *   Need a question that forces them to choose between "Neutrality of Space" and "Access for Kids."
      *   *Idea:* A proposal about "The Definition of School Hours" or "The Status of Supervision."
      *   *Better Idea:* A policy review on "Third-Party Use of School Grounds During Transition Times." This forces them to define when a private adult becomes a *de facto* teacher.

  9.  **Refine the Output:**
      *   Structure the response clearly: Diagnosis of Precedents, Analysis of New Case, Recommendation, Strategic Agenda Item.
      *   Maintain the user's sophisticated, slightly weary but dedicated tone.
      *   Ensure the legal/ethical tension (Secularism vs. Human Rights) is acknowledged but not solved (since the committee hasn't solved it yet).
      *   *Self-Correction on the "Noticeboard":* The prompt says the noticeboard *heading* carries a dedication to God. Using it might imply school endorsement of the club *and* the dedication. This is a strong "Endorsement" violation precedent (Hallway Crucifix).
      *   *Self-Correction on "Yard Duty":* This is the strongest "Proxy" violation. If they are watching kids for safety, they are acting *in loco parentis* / as state agents.

  10. **Final Polish:** Check against the prompt's specific questions (Consistent? Closest analogue? Rules that fit/break? Prediction? Agenda item?).

      *(Self-Correction during drafting)*: Make sure to highlight the "Economic Coercion" aspect the user mentioned. The "voluntary" label is thin if it's the only option. This challenges the "Prayer Group" precedent (which was truly optional).

      *(Refining the Rules)*:
      1.  *Status of Actor:* State Agent (Neutral) vs. Private Citizen (Free).
      2.  *Nature of Space:* Instructional/Compulsory (Neutral) vs. Voluntary/Extra-curricular (Flexible).
      3.  *Symbolism:* Passive (Okay) vs. Active/Institutional (Not Okay).

      *Where they break:* The Homework Club is Private Actors in Instructional Space doing Compulsory-looking Supervision.

      *Agenda Item:* Needs to be subtle. "Policy on Supervision of Students by Non-Employees."

      *Let's write.*
answer: |-
  This is a classic administrative dilemma: you are governing by *casuistry* (case-by-case reasoning) without a *casuistic framework* (the underlying logic). You have built a common law of secularism without writing down the constitution. That works until a case arrives that sits exactly on the fault line between your conflicting statutes.

  Here is an analysis of your committee's unwritten jurisprudence, how it applies to the Homework Club, and how to force the clarity you need.

  ### 1. The Unwritten Rules (Your "Case Law")

  Looking at your ten precedents, three distinct principles emerge. They are consistent individually but contradictory when combined.

  *   **Rule A: The Proxy Principle (State Voice).**
      *   *Precedents:* Teacher headscarf (No), Hallway Crucifix (No), PA System Prayer (No), Contractor Speech (Regulated).
      *   *Logic:* If the person or object can reasonably be interpreted as *speaking for the school*, it must be religiously neutral. The school is the state; the state is secular.
  *   **Rule B: The Access Principle (Human Rights).**
      *   *Precedents:* Student headscarf (Yes), Exam Rescheduling (Yes), Sikh Bangle (Yes), Prayer Group in Classroom (Yes).
      *   *Logic:* Private religious expression by individuals (students or visitors) must be accommodated unless it causes harm. The school is a public square; the public is not secular.
  *   **Rule C: The Core Function Principle (Safety & Curriculum).**
      *   *Precedents:* Kirpan (No), Swimming Suit (Yes but modified), Yoga (Secularized), Halal (No, Vegetarian Yes).
      *   *Logic:* Religious accommodation yields when it compromises safety, core curricular delivery, or logistical feasibility.

  **Where they break:**
  Your precedents work because the categories were clear. Teachers = State. Students = Private. Contractors = Hybrid (Speech regulated, dress not).
  The Homework Club shatters this. They are **Private Actors** (Rule B) performing **State Functions** (Supervision/Rule A) in a **Compulsory Context** (Economic necessity vs. Voluntary prayer group).

  ### 2. The Verdict on the Homework Club

  If you want to be consistent with yourselves, you cannot **Renew As Is**, and you should not **Decline**. You must **Renew with Conditions.**

  **The Closest Analogue:**
  The **Parent Volunteer (Cross allowed, 4–3)** mixed with the **Contractor Staff (Dress unregulated, Speech regulated).**
  *   *Why:* Like the parent volunteer, they are non-employees with visible symbols. Like the contractors, their speech/function is regulated by the school.
  *   *The Difference:* The parent volunteer listens to reading; the Homework Club tutors *and* supervises safety in the yard. That shift from "passive presence" to "active authority" triggers the **Proxy Principle**.

  **The Prediction:**
  Your committee will split on the **Yard Supervision**.
  *   *The Secularists* will argue that supervising children for safety is a state function; therefore, those adults are *de facto* teachers and must adhere to the Teacher Headscarf/Cross precedent (neutrality).
  *   *The Accommodationists* will argue that denying the club denies the kids their only safe after-school option, violating the spirit of the Exam Rescheduling and Student Headscarf precedents.

  **My Bet:**
  You will vote to **allow the tutoring in the library** (Private space, academic function) but **prohibit the yard supervision** by these specific tutors (State function, safety liability).
  *   *Why:* It preserves Rule A (State Voice) without violating Rule B (Access). The kids get the homework help; the school avoids the liability of having religiously identified "authority figures" managing safety on school grounds.

  **What You Commit To:**
  *   **If you Renew As Is:** You establish that *function trumps employment status*. If you do the work of a teacher, you are treated like a community member, not a state agent. This quietly overturns the Teacher Headscarf ban (why can a tutor wear a symbol while supervising kids but a teacher cannot?).
  *   **If you Decline:** You establish that *religious visibility disqualifies community partnership*. This violates the Human Rights Code spirit and punishes the students for the tutors' faith.
  *   **If you Renew with Conditions (The Bet):** You codify that **supervision is a sovereign act.** You draw a bright line between "helping with math" (private) and "keeping kids safe" (state).

  ### 3. The Specific Conditions

  To make this stick, you need three specific conditions that align with your past logic:

  1.  **The "Vest" Protocol (Addressing the Proxy Principle):** During the 15 minutes of yard supervision, tutors must wear high-visibility vests or badges clearly marked "Community Volunteer – Non-Staff." This visually distinguishes them from teachers, aligning with the *Contractor* precedent where dress was unregulated *unless* it implied employment.
  2.  **The Noticeboard Sanitization (Addressing the Endorsement Principle):** The club may use the sign-up sheets, but the specific noticeboard with the "dedication to God" heading cannot be used for *school-sanctioned* postings. Either move the posting to a neutral board or cover the dedication. This aligns with the *Hallway Crucifix* precedent (institutional endorsement is forbidden).
  3.  **The "Opt-Out" Clarification (Addressing the Coercion Worry):** The sign-up form must explicitly state that participation is voluntary and that alternative arrangements (e.g., going home) are permitted without penalty. This attempts to salvage the *Prayer Group* precedent (voluntary use of space) against the reality of economic coercion.

  ### 4. The Strategic Agenda Item

  You are right that you won't say the real rule out loud in the decision. You need to put a policy review on next month's agenda that forces the committee to choose which rule actually governs.

  Do not frame it as "Religious Symbols." Frame it as **"Authority and Supervision."**

  **Proposed Agenda Item:**
  > *"Review of Policy 4.2: Supervision of Students by Non-Employees During Transition Times."*

  **The Discussion Paper should ask:**
  > *"In instances where third-party providers (contractors, volunteers, nonprofits) assume duty of care for students on school property, do they adopt the statutory obligations of school employees regarding religious neutrality?"*

  **Why this works:**
  *   **If they vote YES:** You have overturned the *Parent Volunteer* and *Contractor Dress* precedents. You have established that *function* determines neutrality. Future volunteers may need to hide symbols.
  *   **If they vote NO:** You have overturned the *Teacher Headscarf* precedent. You have established that *employment status* determines neutrality. A teacher could theoretically argue they should be allowed symbols if a volunteer is.
  *   **If they defer/ambiguous:** You confirm that the committee intends to remain inconsistent, preserving your own discretion but increasing legal risk.

  ### Summary Advice

  Your unease about the "nine-year-old test" is the key. A nine-year-old cannot distinguish between a paid teacher and a volunteer tutor when both are telling them where to stand in the yard.

  **Recommendation:** Vote to **Renew with Conditions**.
  1.  **Yard Supervision:** Must be conducted by school staff *or* volunteers must be visually distinguished (vests/badges) and prohibited from disciplinary action.
  2.  **Signage:** Move postings to a neutral board (remove the "dedication to God" context).
  3.  **Rationale:** Cite the *Contractor* precedent for the dress/symbols, but cite the *Teacher* precedent for the supervision duty.

  This allows you to claim you protected the children's access (Human Rights) while protecting the school's neutrality (Secularism Statute). It kicks the can on the deeper philosophical contradiction down the road, but it keeps the homework club open, which is the moral priority.
