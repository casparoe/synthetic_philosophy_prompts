answer: |-
  In this Phase I pharmacokinetic study, participants are randomized with equal probability into Protocol Alpha (single assessment on Day 1) or Protocol Beta (assessments on Day 1 and Day 2). All subjects receive a sedative inducing temporary anterograde amnesia between assessments, so upon waking in the clinic room, you cannot know the day or your protocol assignment. You are immediately asked to consent to an adjunctive nerve stimulation procedure that causes significant discomfort (utility -10) but provides temporary symptom relief (utility +18) for that day if and only if you are in Protocol Beta; if you are in Protocol Alpha, the necessary drug metabolites are absent, rendering the procedure painful and useless. You must decide now whether to consent, based solely on your credence that you are in Protocol Beta.

  ### Walkthrough

  **1. What each side says about the decision**
  *   **The Halfer:** Maintains that your credence in being in Protocol Beta should remain at 1/2, matching the initial randomization probability. They argue that waking up provides no new relevant information because you knew in advance you would wake up at least once regardless of the protocol. Calculating expected utility with P(Beta) = 0.5, the outcome is (0.5 × 8) + (0.5 × -10) = -1. Since the expected utility is negative, the Halfer concludes you should **refuse consent**.
  *   **The Thirder:** Argues that waking up *is* new evidence because there are more possible awakenings in Protocol Beta (two) than in Protocol Alpha (one). Therefore, you are twice as likely to be experiencing a Beta-awakening. They assign P(Beta) = 2/3. Calculating expected utility with this credence, the outcome is (2/3 × 8) + (1/3 × -10) ≈ +2. Since the expected utility is positive, the Thirder concludes you should **give consent**.

  **2. Which feature is doing the philosophical work**
  The workhorse of this case is **self-locating evidence** (or centered evidence). The disagreement hinges entirely on whether the fact "I am awake now" updates your probability of which protocol you are in. The Thirder treats your current temporal location as a random sample from all possible awakenings, making the double-awakening protocol more probable. The Halfer treats your awakening as a certainty that was guaranteed by the experimental design, rendering the temporal location irrelevant to the probability of the protocol assignment.

  **3. What happens if you strip that feature out**
  If you modify the study design so that Protocol Beta also involves only **one awakening** (e.g., both protocols involve a single assessment on Day 1, but Beta requires extra data processing), the self-locating evidence vanishes. There is now a one-to-one correspondence between experiments and awakenings. In this stripped version, both Halfers and Thirders agree that P(Beta) = 1/2 upon waking, and both would agree on the decision (refusing consent, given the utilities above). The divergence disappears because the "number of awakenings" no longer tracks with the protocol type.

  **4. How a defender of the losing side would attack the case**
  Assuming the Halfer comes out "badly" (because they refuse a beneficial procedure in the long run of awakenings), a Halfer defender would attack the **utility structure**. They would argue that Expected Utility should be calculated per *experiment*, not per *awakening*. They would claim that since the subject is one person living one life, the pain felt on Day 1 and Day 2 in Protocol Beta shouldn't count as separate negative utilities in the decision matrix, but rather as a cumulative cost to the single agent. By shifting the calculation to "utility per experiment," the Halfer can argue their 1/2 credence yields the correct rational decision, accusing the Thirder of double-counting the costs and benefits simply because the subject forgot the first instance.
