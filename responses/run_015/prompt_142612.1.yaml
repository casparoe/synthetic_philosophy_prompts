answer: |-
  Here is the plan for the forty-minute session. It is designed to be drawn out on the whiteboard as you speak. The visual progression is essential to keep your sister from feeling lectured; the board does the work, not you.

  ### Phase 1: The Waste (Minutes 0–5)
  **Goal:** Establish the problem as a shared loss, not a conflict of values.
  **Whiteboard:** Draw two circles labeled "You" and "Me." Inside each, write "£40k." Draw an arrow from each to a box labeled "The Fund." Draw a jagged line through the middle labeled "Deadlock."

  1.  **Opening Statement:** Do not mention "moral trade." Start with the feeling of the last two years. "We are both leaving meetings feeling our money was wasted. Not spent badly, but *wasted* in effort and friction. I want to see if we can stop wasting the energy, even if we keep spending the money differently."
  2.  **The Dependency:** This phase must establish that the *conflict* is the cost, not the *causes*. If you start with the causes, she will defend hers. If you start with the cost, you are allies against the waste.
  3.  **Head Off Misconception 1 ("We should simply argue until one of us wins"):** State clearly: "Arguing until one wins assumes one of us is right and the other wrong. I am not asking us to agree on what is good. I am asking if we can agree on how to stop fighting."

  ### Phase 2: The Mechanism via Example (Minutes 5–20)
  **Goal:** Demonstrate the logic of trade without using your actual dispute.
  **Whiteboard:** Erase the "Deadlock" line. Draw two new stick figures: "Neighbor A" and "Neighbor B." Draw two projects: "The Fence" and "The Tree."

  1.  **The Example:**
      *   **Scenario:** Neighbor A cares deeply about privacy (The Fence). Neighbor B cares deeply about sunlight/view (The Tree). Both are permissible community improvements.
      *   **Valuations:** Write numbers next to them. A gets 10 units of satisfaction from the Fence, 1 from the Tree. B gets 10 units from the Tree, 1 from the Fence.
      *   **Current State (Compromise):** They split the budget. Half-fence, half-tree. Total satisfaction: 11 + 11 = 22.
      *   **Trade State:** A funds the whole Fence. B funds the whole Tree. Total satisfaction: 20 + 20 = 40.
      *   **Why this example:** It is visual, non-moralized, and separates *intensity* of preference from *kind* of preference. It avoids "Vegetarianism/Bednets" because those carry global moral baggage that triggers defensiveness. It avoids "Our Disagreement" because that is too hot to handle coldly.
  2.  **Head Off Misconception 2 ("It is just compromise"):** Point to the numbers. "Compromise splits the difference (22). Trade maximizes the outcome for both (40). Compromise makes us both less satisfied. Trade makes us both more satisfied."
  3.  **Head Off Misconception 3 ("Vote-trading") & 4 ("Bribery"):** "This isn't vote-trading because we aren't swapping votes for personal gain. It isn't bribery because no money changes pockets. We are swapping *control* to increase *charitable output*."

  ### Phase 3: The Constraint (Minutes 20–30)
  **Goal:** Address the "Must Not Fund" constraint honestly without killing the mechanism.
  **Whiteboard:** Draw a thick red line across the bottom of the "Neighbor" diagram. Label it "The Forbidden Zone."

  1.  **Where it enters:** This must come *after* the mechanism is understood but *before* applying it to the Fund. If you introduce it too early, it kills the idea before it breathes. If too late, it looks like you ignored her core objection.
  2.  **The Honest Answer:** "In the Neighbor example, both projects were permissible. In our fund, you have said some causes are not just 'less good' but 'forbidden.' If a cause falls in the Forbidden Zone for you, it cannot be the *recipient* of a trade. You cannot fund it, even if I pay you to. That removes it from the trading floor."
  3.  **The Lever:** "However, the trade isn't always 'I fund yours, you fund mine.' The trade can be: 'I will not use my energy to block or debate your permissible causes, if you do not use yours to block mine.' Or, 'I will concede on Cause X (which you like and is permissible to me) to secure peace on Cause Y (which I like and is permissible to you).'"
  4.  **Head Off Misconception 5 ("Convictions for a price"):** "You are not selling your convictions. You are allocating your *resources*. You still believe what you believe. You are simply choosing not to spend your limited veto-power on battles where you care less, to save it for battles where you care more."
  5.  **Head Off Misconception 6 ("If her view is mistaken I should not be paying her to act on it"):** "I am not paying you to act on a mistake. I am acknowledging that we share control. If I want to use my share of the control, I must buy your cooperation. That is the cost of joint ownership, not a judgment on truth."

  ### Phase 4: Implementation & Defenses (Minutes 30–35)
  **Goal:** Pre-empt the practical objections to making this work.
  **Whiteboard:** Draw a scale. Label one side "Truth," the other side "Leverage."

  1.  **Head Off Misconception 7 ("If she would have funded the hospice anyway my concession buys nothing"):** "The value isn't in the money moving; it's in the *objection* moving. If I stop objecting to your hospice grant, I save you the emotional cost of the fight. That has value to you. You save me the emotional cost of fighting me on my grants. That has value to me."
  2.  **Head Off Misconception 8 ("Both of us have an incentive to overstate how much we would hate conceding"):** "True. That is why we need the Actuary here." (Turn to the colleague). "We need a mechanism where we don't just say how much we hate it, but show it by what we are willing to give up. If I say I care 100x more, I should be willing to give up 100x more control elsewhere. We can test that over small grants first."

  ### Phase 5: The Refusal & The Question (Minutes 35–40)
  **Goal:** Set boundaries and test understanding.

  1.  **The Refusal:**
      *   **What to decline:** "I will not explain *why* your values are wrong, nor will I ask you to explain why mine are right. I am treating our values as fixed data points, like the weather. We cannot change the weather, but we can choose whether to carry an umbrella. I refuse to spend this hour debating the rain."
      *   **Why:** This signals to your sister that this is not a Trojan Horse for Effective Altruism. It validates her stance as a given, not a problem to be solved.

  2.  **The Closing Question:**
      *   Do not ask "Do you agree?" (That invites endurance).
      *   **Ask:** "If we could guarantee that one of your preferred causes was funded every year without debate or veto from me, which one would you choose to take off the table?"
      *   **Why this works:** If they answer with a specific cause, they have accepted the premise of the trade (securing a high-value outcome by conceding on others). If they say "None," the idea hasn't landed. If they say "The Hospice," they have identified the leverage point.

  ### Summary of Dependencies
  *   **Phase 1** depends on establishing shared pain (waste).
  *   **Phase 2** depends on Phase 1 (we need a solution to the pain).
  *   **Phase 3** depends on Phase 2 (the mechanism must exist before we limit it).
  *   **Phase 4** depends on Phase 3 (we must know the boundaries before we test the incentives).
  *   **Phase 5** depends on all previous (boundaries set, now commit).

  ### Visual Cue for the Sister
  Throughout the session, whenever you mention "Value," point to *her* side of the board. Whenever you mention "Constraint," draw the line *around* her side, not through it. This visually reinforces that you are protecting her boundaries, not crossing them.
