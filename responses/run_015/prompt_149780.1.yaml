  Jake **rejects** the Frankfurt Assembly explanation.

  He is running a **Covering-Law model** (specifically, a preference for generalizable structural mechanisms), not just a "no single-agent psychology" rule, and definitely not a "narrative mechanism-tracing" rule.

  Here is the defense of that position, the analog from his track record, and the case that would split the rules.

  ### The Verdict: Reject
  Jake's approvals (flea dynamics, network effects, economic stagnation) all share a specific quality: they are **robust, impersonal, and generalizable.** They imply that given certain structural conditions, the outcome was highly probable or inevitable. Fleas carry plague regardless of the year; network effects diffuse technology regardless of the specific town; economic stagnation collapses regimes regardless of the leader.

  Jake's rejections (divine punishment, Luther's anxiety, Gorbachev's psychology) fail because they are either non-natural or **singularly contingent.** Luther's anxiety makes the Reformation hinge on one man's internal state. Gorbachev's psychology makes the Cold War end hinge on one man's mindset.

  The Frankfurt Assembly case is the trap. It avoids psychology (it's a protocol error, not a feeling), so if Jake were only running the "No Single-Agent Psychology" rule, he would approve it. It also traces a causal chain, so if he were a "Narrative Mechanism" theorist, he would approve it.

  But Jake will reject it because it explicitly forsakes the "big law" for "one specific error." It makes history turn on a **fragile accident** rather than a **structural force.** To Jake, explaining the collapse via a misread message is indistinguishable from explaining it via "bad luck." It lacks the counterfactual robustness of a law. If the message had been delivered correctly, would the revolution have succeeded? If the answer is "yes," then the explanation relies on contingency, not determination. Jake wants to know why the revolution *had* to fail (structural), not *how* it happened to fail (narrative).

  ### The Closest Analog
  The closest analog is his rejection of **Luther's personal anxiety explaining the Reformation.**

  At first glance, they seem different: one is internal (psychology), one is external (bureaucracy). But structurally, they are identical in Jake's eyes. Both explanations reduce a massive historical shift to a **singular, fragile point of failure.**
  *   **Luther:** If Luther wasn't anxious, no Reformation.
  *   **Frankfurt:** If the message wasn't misread, no collapse.

  Both violate Jake's implicit demand for **systemic necessity.** He approved Soviet economic stagnation because even without Gorbachev, the system was doomed. He will reject the Frankfurt protocol error because without that specific error, the system might have survived. He is punishing the *contingency*, not just the *psychology*.

  ### The Sneaking Principle
  Jake is sneaking in **Determinism (or Probabilistic Robustness).**

  His track record is underdetermined between "Covering Law" and "Materialism." He might just hate anything non-material (which would include psychology). But the Frankfurt case is material (a piece of paper, a order). If he rejects it, he is revealing that he cares more about the **generality of the dynamic** than the **materiality of the cause.** He is sneaking in the principle that *good history explains why things happen repeatedly, not just why they happened once.* He is treating history like a science that seeks laws, not a forensic investigation that seeks causes.

  ### The Splitting Case
  To confirm this, you would need a case that has a **General Law** but relies on **Psychology.**

  **Case:** The 2008 Financial Crisis.
  *   **Explanation A:** Systemic leverage cycles and deregulation (Structural/Law). -> Jake Approves.
  *   **Explanation B:** A specific coding error in a risk-model algorithm at Lehman Brothers (Singular Mechanism/Protocol). -> **The Test.**
  *   **Explanation C:** A general law of "herd behavior" and "panic psychology" among traders (Psychological Law).

  If Jake approves **Explanation C**, he is a true **Covering-Law theorist** (he accepts psychology if it's law-like).
  If Jake rejects **Explanation C** but approves **Explanation B**, he is a **Materialist Mechanist** (he cares about physical systems, not minds, even if minds follow laws).
  If Jake rejects **both B and C**, he is a **Structural Determinist** (he only wants broad socioeconomic forces, not singular errors or individual psychologies).

  My bet is he rejects B (Frankfurt style) and C (Psychology style), proving he is a Structural Determinist hiding behind the language of "General Laws."

  ### Confidence Level
  I am **80% confident** in this read. The 20% uncertainty comes from the "Network Effects" approval. Network diffusion can sometimes be told as a singular story rather than a law. If Jake approved that as a *story* about specific towns rather than a *principle* of diffusion, he might be softer on the Frankfurt case than I predict. But given the "three-hour argument" context, he is likely digging into a hard "Science of History" position, which makes the Frankfurt contingency a prime target for his rejection.
