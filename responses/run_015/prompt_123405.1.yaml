answer: |-
  Dr. Aris Vane stared at the glowing map until the pixels burned into her retinas. The Climate-Economy Modle sat on her screen, a beautiful, humming beast of regression and ruin. It predicted crop yields in Bangladesh and carbon credits in Zurich with terrifying accuracy. But it only worked if she respected the white spaces.

  Everyone told her the assumptions were simplifications. *Homo economicus* doesn't exist. Supply curves aren't perfectly vertical. Time doesn't reverse.

  Aris knew better. Friedman had whispered the secret: if the prediction works, the assumption is true. It just hides where you aren't looking.

  She zoomed into the Siberian Blank. No sensors had been placed there since '98. According to the data, supply in that region was perfectly inelastic. No matter the price, the quantity remained fixed. Aris had seen the telemetry from the few drones that drifted too low. They captured images of chalk dust hovering in the sub-zero air, tracing straight vertical lines across the tundra. A dead mathematician's ghost, probably Von Neumann, etching constraints into the snow. She didn't log the dust. Logging it would make it empirical, and empirical things could be disproven. Ghosts were assumptions. Assumptions were sacred.

  Then there was the Pacific Patch. Here, agents behaved with perfect rationality. Utility maximization was absolute. Aris knew why. In the Patch, local time ran backwards. You sold the coffee before you brewed it. You invested in the crash before the bubble formed. It was the only way to explain the efficiency.

  Her cursor hovered over a new anomaly. A blip of heat signature in the center of the Pacific Patch.

  Cedar Creek. Population 4,000.

  It wasn't on the sensor grid. It was a real town, sitting inside the zone where time flowed reverse and everyone was a perfect calculator. If the model was right, the people of Cedar Creek were buying groceries tomorrow to eat yesterday, perfectly happy, perfectly optimized.

  Aris's finger trembled over the deploy key. She could send a satellite sweep. She could put a sensor in the town square.

  If she measured them, she'd force them into forward time. Observation collapses the wave function. The moment she looked, the rationality would shatter. They'd become messy, emotional, irrational humans. The Modle's predictions for the entire Pacific rim would degrade. The carbon credits would misfire. The crop yields in Bangladesh would drift off course by 0.4 percent.

  But if she didn't measure... she was leaving four thousand people inside a physics experiment. They were living in the assumption. They were the invisible hand made flesh.

  She looked at the chalk dust logs from Siberia, filed under "atmospheric particulates." She looked at Cedar Creek, blinking softly in the dark zone.

  To save the theory, she had to ignore the reality. To save the people, she had to break the world.

  Aris opened the command line. She typed the order to schedule the sensor sweep. Then she stopped. She thought about the ghost drawing lines in the snow, happy to remain unseen so the math would hold.

  She hit backspace.

  It was better this way. Let them live in the perfect logic of backwards time. Let them be rational. She closed the laptop and left the white space blank. After all, the predictions were perfect, and thats all that mattered.
