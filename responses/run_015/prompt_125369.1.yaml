          4.  Concrete changes if uniqueness dropped.
      *   *Word Count Check:* Keep it tight.

      *Drafting:*
      Your "sideways versus upward" distinction is analytically sound and does significant work. Sideways comparisons (other atrocities) threaten the event's singularity; upward comparisons (modernity's structures) reinforce its universal warning.

