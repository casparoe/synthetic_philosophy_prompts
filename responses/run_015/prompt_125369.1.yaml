      Resistance to body counts is compatible but not strictly required. It sits well with the theory because if the wrong is qualitative (the industrialization of death), aggregation misses the point. However, one could theoretically count bodies while maintaining uniqueness. The legal bans on denial are underdetermined; they could stem from this philosophical uniqueness, or simply from specific political responsibilities of post-war states.

