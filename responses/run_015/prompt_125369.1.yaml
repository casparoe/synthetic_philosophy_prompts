      1.  **Teaching:** Shifts from moral catechism to comparative sociology. Students would analyze necessary and sufficient conditions for genocide across cases, treating the Holocaust as a data point—albeit a severe one—within a taxonomy of mass violence.
      2.  **Memorials:** Would likely become inclusive monuments to "Victims of State Violence" rather than specific memorials. Rituals would broaden from specific remembrance days to general human rights observances.
      3.  **Law:** Denial laws would face collapse. If the event is one among many, criminalizing denial of *this* specific truth becomes legally untenable compared to others. Legislation would shift toward punishing incitement to violence generally, rather than protecting specific historical narratives.

