answer: |-
  ## Unstructured Setup: Distinctions, Discards, and Breakpoints

  Before writing the procedure, I need to calibrate the philosophical tools against the archival reality.

  **Distinctions to Keep:**
  1.  **Type vs. Token:** You are not asking if this specific *disk* is the same as that *disk* (token). You are asking if they instantiate the same *abstract pattern* (type). Functionalism is a theory of types.
  2.  **Input-Output (I/O) Equivalence vs. Causal Isomorphism:** This is the critical split. Two systems can produce the same outputs for the same inputs (behavioral equivalence) but arrive there via completely different internal causal chains. Your current rule conflates these. For preservation, *how* the result is achieved matters (e.g., a bug that causes a specific glitch is part of the work).
  3.  **Counterfactual Robustness:** A system isn't defined just by what it *does* do, but by what it *would* do if inputs changed. This handles the "untested inputs" problem.
  4.  **Level of Abstraction (The Grain):** Functional states only exist relative to a description language. We must fix the "description language" (e.g., machine code, API calls, logic gates) before comparing.

  **Distinctions to Discard:**
  1.  **Consciousness/Qualia:** Irrelevant. Software doesn't feel. We don't need to solve the "Hard Problem."
  2.  **Panpsychism/Triviality Debates:** Philosophers worry that a wall implements WordPerfect if the mapping is complex enough. We solve this pragmatically: if the mapping requires more information to specify than the program itself, it's invalid.
  3.  **Historical Causation (Millikan):** Some philosophers argue a thing is what it is because of its history (lineage). While important for copyright, for *functional identity*, history is secondary to structure. We will use history as a heuristic, not a definition.

  **Where the Analogy Breaks:**
  1.  **Normativity:** Mental states are often descriptive; software artifacts are often *prescriptive* (they *should* do X). When a program bugs out, is that the "work" or a failure of the work? In archives, the bug is usually the work. Functionalism struggles with "errors" being essential features.
  2.  **Indeterminacy:** Mental states might be fuzzy. Software states, in principle, are discrete. When you encounter analog/neuromorphic systems, the analogy breaks because there is no clear "state." We must impose discreteness artificially.
  3.  **Value:** "Same Work" in an archive is a deontic status (rights, loans), not just a metaphysical fact. The procedure must acknowledge where it stops describing reality and starts assigning value.

  ***

  ## Deliverable: The Causal-Structural Identity Procedure (CSIP)

  **Purpose:** To determine if Artifact B is the *Same Work* as Artifact A.
  **Users:** Curator, Engineer, Rights Officer.
  **Timeframe:** 2 Weeks.
  **Default Verdict:** If evidence is missing, verdict is **Version/Derivative**, not Same Work. (Burden of proof is on Identity).

  ### Part 1: The Decision Procedure

  **Stage 1: The Abstraction Layer Declaration**
  *   **Question:** At what level of description are we comparing these artifacts?
  *   **Action:** The Engineer must select *one* layer from the following hierarchy, based on available documentation for Artifact A (Original):
      1.  *Physical:* Voltage/Quantum states (Rarely usable).
      2.  *Instruction Stream:* Binary opcodes/memory addresses.
      3.  *Logical State:* Variables, registers, heap structures as defined in specs.
      4.  *API/Interface:* Function calls and return values.
      5.  *Behavioral:* Screen output/Audio waveform only.
  *   **Sufficient Answer:** A written declaration of the layer (e.g., "Instruction Stream").
  *   **Stop Condition:** If no documentation exists to define Layer 3 or higher, default to Layer 2. If Layer 2 is impossible (no binary), default to Layer 5.
  *   **Judgment Call:** Choosing the layer. *Note: Higher layers allow more change; lower layers demand stricter identity.*

  **Stage 2: The Natural Mapping Test (Fixing the Gerrymander)**
  *   **Question:** Can we map the states of Artifact B to Artifact A without inventing a code?
  *   **Action:** The Engineer must produce a state-mapping function $M(State_B) \rightarrow State_A$.
  *   **Sufficient Answer:** The mapping $M$ must be derivable from public documentation or standard hardware abstraction layers *without* reference to the specific output data of the test run. It must be "natural" (e.g., Register 1 maps to Register 1, not "Register 1 maps to Register 1 unless the output is blue, then it maps to Register 5").
  *   **Stop Condition (NO):** If the mapping requires more bits to describe than the state itself, or if it requires post-hoc tuning to match outputs. **Verdict: Not Same Work.**
  *   **Judgment Call:** Determining "Naturalness." *Rule of Thumb: Could a competent engineer generate this mapping blind, seeing only the specs?*

  **Stage 3: Counterfactual Robustness (The Black Box Test)**
  *   **Question:** Does Artifact B fail in the same places Artifact A would have failed?
  *   **Action:** Generate a test suite of 100 inputs. 80 must be standard operations. 20 must be "edge cases" or known crash conditions from Artifact A's history (bug reports, speedrun tricks, glitch catalogs).
  *   **Sufficient Answer:** Artifact B must match Artifact A's output on 100% of standard ops AND match Artifact A's *error behavior* on the edge cases.
  *   **Stop Condition (NO):** If Artifact B "fixes" a bug that was present in Artifact A, or crashes on an input where Artifact A was stable. **Verdict: Version/Derivative.**
  *   **Judgment Call:** Which bugs are "essential"? *Rule: If the bug was documented or exploitable by users at the time of release, it is essential.*

  **Stage 4: Causal Chain Verification (The Transitivity Check)**
  *   **Question:** If this is a link in a chain (A→B→C→D), is the cumulative drift acceptable?
  *   **Action:** Sum the "divergence score" of each link. Divergence = % of state transitions that differ despite producing same I/O.
  *   **Sufficient Answer:** Total divergence across the chain must not exceed 15% of the defined State Vector.
  *   **Stop Condition (NO):** If the chain is broken (a link was never certified) or cumulative divergence > 15%. **Verdict: New Work / Reconstruction.**
  *   **Judgment Call:** The 15% threshold. *This is a policy value, not a fact.*

  **Stage 5: The Value Handoff**
  *   **Question:** Does the technical identity match the legal/cultural need?
  *   **Action:** If Stages 1-4 pass, the Committee (Curator, Engineer, Rights) votes.
  *   **Sufficient Answer:** 2/3 majority.
  *   **Stop Condition:** If the Committee votes No despite technical pass (e.g., rights issues), the artifact is a **Legal Derivative**.
  *   **Judgment Call:** All of Stage 5. This is where metaphysics ends and policy begins.

  ---

  ### Part 2: Operational Fixes for Your Five Failures

  **1. Behavior vs. Internal Organisation (The Surrogate Problem)**
  *   **Fix:** The CSIP splits Stage 2 (Mapping) and Stage 3 (Counterfactuals). A neural surrogate might pass Stage 3 (I/O match) but will fail Stage 2. It has no discrete internal states to map naturally. It treats the work as a "Black Box Function." The procedure classifies this as a **Simulation**, not the **Same Work**.
  *   **Why:** Preservation requires preserving the *mechanism of failure*, not just the success.

  **2. The Gerrymandered Mapping (Triviality)**
  *   **Fix:** Stage 2 requires the mapping to be generated *blind* to the output data. Your attempt ("specified in advance") was close but vulnerable to clever engineers. The fix is the **Complexity Constraint**: The description of the mapping function cannot be more complex (in bits) than the state vector it maps. This prevents "magic lookup tables" that turn a rock into a computer.
  *   **Check:** The Rights Officer reviews the mapping spec. If it looks like a hack, it's a No.

  **3. The Grain of Description**
  *   **Fix:** Stage 1 forces an explicit **Abstraction Layer Declaration**. You cannot say "they are the same." You must say "they are the same *at the Instruction Stream Layer*." If you change layers, identity is not guaranteed.
  *   **Check:** The declaration is stamped on the certificate of identity. If a future audit finds a mismatch at that layer, the certificate is void.

  **4. Transitivity Chains (1993–2020)**
  *   **Fix:** Stage 4 introduces **Cumulative Drift**. Identity is transitive *only if* the divergence is tracked at every hop. We treat the "Work" as a trajectory through state-space, not a point. If the trajectory bends too far, it's a new work.
  *   **Check:** Require the "Divergence Score" from each previous handoff. If missing, the chain is broken.

  **5. Non-Discrete States (Analog/Quantum)**
  *   **Fix:** We impose **Logical Discretization**. For analog/neuromorphic systems, the Engineer must define "Stable Attractors" (states the system settles into) and treat those as the discrete states.
  *   **Check:** If the system never settles (chaotic), it cannot be certified as the Same Work under this procedure. It is an **Interpretation**.

  ---

  ### Part 3: Honesty About the Translation

  **What Survives Translation:**
  *   **Multiple Realizability:** We keep the core idea that hardware doesn't matter. A VM running the binary is the same work as the original chip.
  *   **Causal Role:** We keep the idea that internal states must do the same work.

  **What is Dropped:**
  *   **Strict Isomorphism:** Philosophy often demands 1:1 state matching. We allow the 15% drift buffer (Stage 4) because perfect preservation is physically impossible (bit rot, timing jitter).
  *   **Intentionality:** We do not ask "Did the programmer *mean* this?" We ask "Is this state transition *documented*?" If a bug was unintended but consistent, we keep it. Philosophy worries about mind; we worry about evidence.

  **Where the Simplified Version Diverges:**
  *   **The "No" on Surrogates:** A strict functionalist might argue that if the I/O is indistinguishable, the work is the same (Turing Test style). My procedure says **No**. Why? Because archives preserve *history*, not just *experience*. A surrogate that cannot glitch is a lie about the past.
  *   **The "Yes" on Optimized Code:** A philosopher might argue that changing the algorithm changes the "mental state." My procedure allows this *if* the Abstraction Layer is set to API/Interface (Stage 1). We prioritize the *user experience layer* over the *code layer* if documentation permits.

  ---

  ### Part 4: Case Studies

  **Case (a): Virtual-Machine Emulation**
  *   **Stage 1 (Layer):** Instruction Stream.
  *   **Stage 2 (Mapping):** 1:1 mapping of opcodes. Natural. Pass.
  *   **Stage 3 (Counterfactuals):** Runs original binary. Crashes on same inputs. Pass.
  *   **Stage 4 (Chain):** Direct copy. 0% drift. Pass.
  *   **Stage 5 (Committee):** Unanimous.
  *   **Verdict:** **SAME WORK.**
  *   **Reasoning:** The causal structure is preserved exactly; only the physical substrate changed. This is the ideal preservation case.

  **Case (b): Clean-Room Reimplementation (Source Lost)**
  *   **Stage 1 (Layer):** Logical State (Specs).
  *   **Stage 2 (Mapping):** Specs allow multiple implementations. Mapping is approximate. Pass (with warning).
  *   **Stage 3 (Counterfactuals):** Diverges on undocumented behaviors (bugs). The original crashed on Input X; the reimplementation handles it gracefully. **FAIL.**
  *   **Stop Condition:** Stage 3.
  *   **Verdict:** **DERIVATIVE / VERSION.**
  *   **Reasoning:** Even though it looks the same, it lacks the *fragility* of the original. It is a "Remake," not the "Original."
  *   **Unwelcome Truth:** You cannot catalog this with the original number. It is a new artifact inspired by the old one.

  **Case (c): The Learned Surrogate (Neural Net)**
  *   **Stage 1 (Layer):** Behavioral (Screen/Audio).
  *   **Stage 2 (Mapping):** No internal states exist to map. The "weights" do not correspond to variables. **FAIL.**
  *   **Stop Condition:** Stage 2.
  *   **Verdict:** **SIMULATION / RECREATION.**
  *   **Defending the "No":** I know this hurts. The rights holders are gone. This is the only way to play it. But if you call this the "Same Work," you are erasing the fact that the original was a deterministic machine and this is a probabilistic predictor. If the surrogate hallucinates a frame that never existed, is it the work? No. It is a *memory* of the work. Catalog it as "Recreation based on [Original Title]." Do not grant it legal deposit status as the original. Access does not require identity.

  **Case (d): The 1993–2020 Chain**
  *   **Stage 1 (Layer):** API/Interface (shifted over time).
  *   **Stage 2 (Mapping):** Each link has a mapping spec.
  *   **Stage 3 (Counterfactuals):** 1993→2001 (Pass), 2001→2011 (Pass), 2011→2020 (Pass).
  *   **Stage 4 (Chain):** Cumulative drift calculated.
      *   1993→2001: 2% drift.
      *   2001→2011: 5% drift.
      *   2011→2020: 10% drift.
      *   Total: 17%. **FAIL** (Threshold is 15%).
  *   **Verdict:** **BREAK IN IDENTITY.** The 2020 artifact is a **Successor Work**.
  *   **Reasoning:** The "Telephone Game" effect. Small changes accumulated into a significant structural shift. The 2020 version is legally and metaphysically distinct from the 1993 version, even if every link was approved at the time.

  ---

  ### Part 5: Limitations and The Value Handoff

  **What This Procedure Cannot Do:**
  1.  **Solve Copyright:** "Same Work" in metaphysics is not "Same Work" in copyright law. A derivative might still infringe. The Rights Officer must override the Engineer's "Same Work" verdict if the law requires a new license.
  2.  **Capture "Spirit":** If a port runs perfectly but *feels* wrong (input latency, color grading), this procedure might pass it (if Layer is API). It measures structure, not aesthetic qualia.
  3.  **Handle Total Loss:** If the original is gone and only the Surrogate (Case C) remains, this procedure will tell you "This is not the work." It cannot tell you "Pretend it is."

  **Where Values Take Over:**
  At Stage 5. When the procedure returns "Derivative" for the Surrogate (Case C), but the public cannot access the original, you face a moral choice.
  *   **The Trap:** Changing the procedure to pass the Surrogate corrupts the archive's truth-telling function.
  *   **The Solution:** Do not lie about identity. Create a new category: **"Access Copy of Lost Work."**
      *   It does not get the original catalogue number.
      *   It does not get legal deposit status as the original.
      *   It *does* get loaned and exhibited as the only available window into the work.

  **Final Instruction to the Team:**
  Stop asking "What *is* this?" when the evidence is gone. Start asking "What do we *owe* the public?"
  *   If you owe them truth: Label it a Derivative.
  *   If you owe them access: Lend the Derivative, but label it clearly.
  *   If you owe the artist: Respect the structural integrity (the bugs, the limits) even if it makes access harder.

  The procedure protects you from saying "Yes" when you should say "No." It does not protect you from the pain of saying "No" when the world needs a "Yes." That pain is the job.
