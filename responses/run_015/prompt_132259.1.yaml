  **TO:** Holloway Residency Board
  **FROM:** [Your Name]
  **DATE:** Monday, February 26
  **SUBJECT:** Thursday's vote / the ligament thing

  Look, I know we're all tired of emailing back and forth about this, and honestly, I'd rather we were talking about the work itself than the metaphysics of how we judge it. But since we're voting Thursday, I want to put something concrete on the table so we aren't just spinning in circles during the meeting.

  I've been turning this "ligament model" over in my head. I get the appeal—it tries to clean up the mess of what "left" and "right" even mean anymore. But I also get the pushback. The worry that we're building an obscure taxonomy just to avoid actually talking about power and resources is not nothing. It's the strongest argument against this, and if we ignore it, we're walking into a trap.

  Here's my recommendation: **We adopt the ligament framework for this cycle, but with a specific safeguard.**

  Here's the logic. If we reject it outright, we signal that we aren't willing to test new ways of thinking about our own charter, which feels stale. If we use it only as descriptive language, we dilute it so much it becomes useless noise. But if we adopt it as a binding veto without checks, we risk exactly what the skeptics are saying: using philosophy to dodge material reality.

  So, I'm proposing we vote to **adopt the model for the current application cycle**, with the following amendment attached to the policy:

  *   *Classification via the ligament model is mandatory for all finalist discussions.*
  *   *However, a "binding mode" classification cannot override material analysis of the work.*

  What this means in practice: We can classify the factory strike writer's project however the model demands. But we cannot reject her solely because her "binding mode" conflicts with our charter if her work materially engages with labor, resources, or power structures in a way that aligns with our mission. We have to talk about the money, the strikes, the bodies in the factory—not just the metaphysical posture of the narrator.

  This takes the skeptics' worry seriously. It admits that yes, taxonomy can be a way to avoid the hard stuff. So we're forcing ourselves to do the hard stuff *alongside* the taxonomy. We don't get to hide behind "oppositionally bound" if we aren't also looking at who holds the keys to the factory.

  **Timeline:**
  *   **Thursday:** Vote on adopting the framework with the material safeguard clause.
  *   **March 1:** If passed, policy is implemented for this cycle's final selections. Reviewers get the one-pager on how to apply the safeguard.

  I know some of you feel this is still too abstract. I hear you. But I think this compromise lets us test the philosopher's theory without letting it blind us to the actual ground we're standing on. We keep the charter, we keep the theory, but we don't lose the reality.

  Let's try to close this out Thursday. I'll bring coffee.
