  ### Home Support Grant Eligibility Procedure (v4.2)

  **Purpose:** Determine eligibility for attendant care and equipment budget based on statutory standard: "substantially unable to manage personal care without assistance."
  **Time:** 15 minutes per file.
  **Users:** Reviewers (Community Nurses/Admin).

  **Step 1: Hard Gates (Stop if Fail)**
  Check residency, income cap, and immediate safety risks (e.g., active abuse in home).
  *   **Sufficient Answer:** Verified documents in file.
  *   **Failure:** Issue denial letter citing specific gate (e.g., "Income exceeds limit"). **Stop.**
  *   **Note:** This is a hard no. No discretion.

  **Step 2: Functional Score**
  Review the nurse's 20-item form (0–3 per item). Confirm total score is calculated correctly.
  *   **Sufficient Answer:** Total score entered (0–60).
  *   **Failure:** Return to nurse for correction. **Stop.**
  *   **Note:** This is a fact check.

  **Step 3: The Book Check (Admissible Range)**
  Compare Total Score to the current "Admissible Range" (currently 7–12).
  *   **Score > 12:** Proceed to Step 5 (Clear Grant).
  *   **Score < 7:** Proceed to Step 4 (Clear Denial).
  *   **Score 7–12:** **Stop.** This is a Borderline Case. Escalate to Senior Reviewer (Step 6).
  *   **Note:** This hands the decision to a person because the score alone cannot resolve the vagueness.

  **Step 4: Clear Denial Check**
  For scores < 7, check for any "Value Call" overrides (see Step 6). If none, issue denial.
  *   **Sufficient Answer:** No conflicting precedent or high-risk flags.
  *   **Failure:** Escalate to Senior Reviewer.
  *   **Note:** Budget weight is a value call. Do not deny solely on budget if risk is high; escalate.

  **Step 5: Definition Check (Assistance vs. Equipment)**
  Verify if the applicant manages personal care using only equipment (grab rails, chairs) without human help.
  *   **Sufficient Answer:** Nurse note confirms status *with* usual equipment.
  *   **Failure:** If the term "without assistance" is ambiguous regarding equipment (i.e., score based on no equipment, but applicant uses equipment), **Escalate to Senior Reviewer.**
  *   **Note:** "Assistance" = Human Help. "Equipment" = Capital. If equipment resolves the inability, attendant care is not justified. This is a definition gap; do not guess.

  **Step 6: Value Calls (Escalation Point)**
  Senior Reviewer decides on:
  1.  **Budget Weight:** Does the cost of a false denial (hospitalization) outweigh the grant cost?
  2.  **Family Availability:** Does a daughter 40 minutes away count as "available assistance"? (Policy: No, unless she commits in writing).
  *   **Output:** Written reason for file.

  ---

  ### The Borderline Step: Which Version for the Manual?

  You asked for the two versions of the borderline step (Score 7–12) written side by side.

  | **Version A: Robustness (Sharpening Book)** | **Version B: Expected Value (Weighted Costs)** |
  | :--- | :--- |
  | **Rule:** Grant only if *every* number in the Book (7–12) says Grant. Deny only if *every* number says Deny. If mixed, Escalate. | **Rule:** Treat the Book as probability. Weigh Cost(False Denial) vs. Cost(False Grant). If Expected Cost of Denial > Grant, then Grant. |
  | **Logic:** A claim is only "true" if it holds on all admissible ways of drawing the line. | **Logic:** There is a real line; we are uncertain. Minimize total financial loss. |
  | **Outcome on Score 8:** Indeterminate (7 says Grant, 9 says Deny). **Escalate.** | **Outcome on Score 8:** Calculate risk. If dementia fall risk is high, **Grant.** |
  | **Defense to Counsel:** Legally safest. Prevents arbitrary denial where reasonable disagreement exists. Aligns with due process. | **Defense to Counsel:** Economically efficient. Requires public disclosure of cost weights (political risk). |

  **Recommendation:** Put **Version A (Robustness)** in the manual.
  **Why:** County counsel cares about liability and consistency. Version A admits uncertainty rather than hiding it behind a cost calculation that can be attacked as "putting a price on safety." Version A forces the hard cases to a human (Senior Reviewer) who can write a defensible reason. Version B requires you to publish a "price of a fall," which boards often reject.

  ---

  ### Fuzzy Bits & Book Maintenance

  **1. Sharpening Separate vs. Joint**
  Do not sharpen "substantially," "unable," and "personal care" separately. It takes too long. Sharpen **jointly** via the Total Score, *except* for "without assistance."
  *   **Equipment Issue:** If someone is unable without equipment but able with it, they are *not* "unable without assistance" (since equipment ≠ assistance). However, they may not need attendant care.
  *   **Procedure Fix:** Step 5 above. If equipment solves the need, deny attendant care but consider equipment budget. This separates the two grant components.

  **2. Maintaining the Book**
  *   **Who Decides:** A Policy Committee (You, Counsel, Medical Lead). They meet quarterly.
  *   **Admissibility:** A number is admissible if a Senior Reviewer has sustained it in a written decision.
  *   **Past Grants:** A past grant is **evidence** of admissibility, not a permanent drawing of the line. It expands the Book.
  *   **Sentence for Hearing Officer:** "Previous determinations at this score indicate this score falls within the range of admissible eligibility thresholds, requiring individualized review."

  ---

  ### Case Runs

  **1. Total 14, manages fine with equipment.**
  *   **Procedure:** Score > 12 (Clear Grant). But Step 5 (Definition Check) flags "without assistance" vs. equipment.
  *   **Analysis:** Score 14 implies high impairment. "Manages fine" implies ability. The term "without assistance" has no book entry for equipment.
  *   **Action:** The Score overrides the nuance for eligibility, but the *type* of support is adjusted.
  *   **Disposition:** **Grant** (Eligibility met by score; implementation limits to equipment budget if care not needed).

  **2. Marta, Total 8, inside gap (7–12).**
  *   **Procedure:** Step 3 (Book Check). Score is inside Admissible Range.
  *   **Analysis:** Robustness version says indeterminate. Not definitely eligible, not definitely ineligible.
  *   **Action:** Escalate to Senior Reviewer for Value Call (dementia risk vs. budget).
  *   **Disposition:** **Escalate**.

  **3. Total 6, precedent exists at 6.**
  *   **Procedure:** Score < 7 (Clear Denial). But advocate cites precedent.
  *   **Analysis:** Precedent is evidence of admissibility. Book must update to include 6.
  *   **Action:** Grant to maintain equality. Update Book to 6–12.
  *   **Sentence:** "Consistent with prior determinations [File #], this score is now within the admissible range."
  *   **Disposition:** **Grant**.

  ---

  ### Limitations

  This procedure cannot eliminate judgment calls; it only moves them. Step 1 (Hard Gates) is factual. Step 3 (The Book) handles vagueness by admitting uncertainty. Step 6 (Value Calls) is where judgment lives: budget weight and family availability are policy choices, not facts. The procedure dresses these up as "Escalation" to ensure they are made by someone with authority to write the reason. The "Book" is not a discovery of truth but a record of past commitments; maintaining it requires political will to update when precedents conflict.

  \answer{1=grant, 2=escalate, 3=grant}
