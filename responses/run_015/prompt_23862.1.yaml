answer: |-
  ### Specification for an Adequate Theory of Moral Progress

  | Requirement | Specific Historical/Psychological Constraint | Rationale |
  | :--- | :--- | :--- |
  | **1. The Metric Problem** | Must define a standard of "better" independent of the historical trend itself (e.g., welfare, autonomy, rights). | Without an external anchor, "progress" is indistinguishable from "change that we happen to like." |
  | **2. The Regression Test** | Must explain the rise of 20th-century totalitarianism (e.g., Nazism) following the Enlightenment. | A linear theory fails if it cannot account for organized, industrialized moral backsliding after periods of liberalization. |
  | **3. The Materialist Constraint** | Must account for the decline of violence due to state capacity and resource surplus rather than moral enlightenment. | If structural/economic forces drive outcomes, a theory claiming moral *agency* improved is empirically inadequate. |
  | **4. The Belief/Outcome Distinction** | Must separate shifts in expressed virtue (e.g., anti-racist rhetoric) from shifts in lived reality (e.g., incarceration rates). | Conflating signaling with substance allows societies to claim progress while maintaining oppressive structures. |
  | **5. The Expansion/Enforcement Distinction** | Must distinguish between new values (e.g., animal rights) and the universal application of old values (e.g., human rights). | Claiming novelty where there is only consistency inflates the perception of moral innovation. |
  | **6. The Evolutionary Mismatch** | Must reconcile universalist ethics with biological instincts tuned for small-scale, in-group cooperation (Dunbar's number). | A theory ignoring evolutionary psychology cannot explain the fragility or cognitive cost of universal moral concern. |
  | **7. The Anti-Teleology Clause** | Must explain the trend without assuming history has a direction or endpoint (avoiding Whig history). | This addresses the user's suspicion that progress is a narrative artifact of standing at the "end" of the sequence. |
  | **8. The Stability Condition** | Must address whether moral gains are reversible or ratcheting. | If gains are easily lost (as per Req 2), "progress" may be a temporary fluctuation rather than a structural shift. |

  ### Analysis of the Requirements

  **Non-Negotiable vs. Partisan**
  The non-negotiable requirements are those without which the concept of "moral progress" collapses into incoherence. **The Metric Problem (Req 1)** is the primary logical gatekeeper. If a theory cannot specify *what* is improving without simply pointing to current preferences, it is not a theory of progress; it is a description of fashion. Similarly, **The Anti-Teleology Clause (Req 7)** is non-negotiable for intellectual honesty. Any theory that assumes history *must* bend toward justice is a theology, not a social science, and fails your specific test regarding hindsight bias.

  The partisan requirements are those where legitimate philosophical camps diverge on what counts as a success. **The Belief/Outcome Distinction (Req 4)** is a fracture point. Consequentialists will argue that only outcomes matter (if slavery ends, it doesn't matter if people are still racist), while Virtue Ethicists will argue that a society of unrepentant racists forced to comply by law has not morally progressed, only behaviorally complied. Neither side is objectively wrong, but a theory must pick a lane. Similarly, **The Expansion/Enforcement Distinction (Req 5)** depends on whether you view moral truth as discovered (Platonic) or constructed (Pragmatist). If rights are discovered, enforcing them later isn't new progress; if they are constructed, expanding the circle is genuine innovation.

  **Joint Unsatisfiability**
  There is a significant tension, potentially a contradiction, between **The Evolutionary Mismatch (Req 6)** and **The Stability Condition (Req 8)**. Evolutionary biology suggests our moral instincts are adapted for small, kin-based groups with high reciprocity and strong out-group hostility. The "expanding circle" requires us to override these instincts using slow, cognitively expensive reasoning systems. If our biology imposes a hard ceiling on stable cooperation, then a theory claiming moral progress is *stable* (ratcheting) contradicts the biological data suggesting such arrangements are high-energy and fragile. Conversely, if the theory admits progress is biologically unstable, it undermines the definition of progress as a durable improvement. You likely cannot have a theory that satisfies evolutionary psychology's constraints on tribalism while simultaneously guaranteeing the stability of universalist ethics. One of these must yield: either universalism is less stable than we hope, or human psychology is more plastic than evolutionary models suggest.

  There is also a friction between **The Materialist Constraint (Req 3)** and **The Metric Problem (Req 1)**. If material conditions (technology, wealth) are the primary drivers of what we call "moral progress" (e.g., we only stopped slavery when it became inefficient), then the "moral" component is epiphenomenal. A theory that credits moral reasoning for changes driven by economics is empirically false; a theory that credits economics risks dissolving "moral progress" into "technological optimization." Reconciling moral agency with material determinism is the hardest structural load-bearing wall in this specification.

  **The Single Exclusionary Requirement**
  The requirement that does the most work excluding bad theories is **The Metric Problem (Req 1)**.

  This requirement rules out **Descriptive Relativism** and **Whig Historicism** in a single stroke. Descriptive Relativism fails because it cannot define a metric across cultures without privileging one; Whig Historicism fails because it assumes the metric is automatically satisfied by the passage of time. By forcing the theory to define "better" independently of the historical timeline, you eliminate any theory that relies on "the arc of the moral universe" as a self-justifying mechanism. It demands that you prove the endpoint is actually *good*, not just *later*. This excludes the comforting story you mentioned—the idea that the circle expands simply because time passes—and forces the theory to confront whether the current circle is actually an improvement by a standard that would hold even if history reversed.
