      *(Check on the "Work from Information" claim)*: The convener claimed "you cannot get net work out of information." This is technically true *if* you mean "information alone without an entropy sink." But in the Szilard context, information *is* the resource that allows extraction from a heat bath. The phrasing "work comes from information" is shorthand for "information allows extraction of work from a thermal reservoir." I need to clarify this distinction.

