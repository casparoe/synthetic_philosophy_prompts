answer: |-
  Good morning. Faculty, families, honorees.

  Last night, at two in the morning, my roommate Mara and I nearly came to blows over a cup of cold coffee. Mara studies economics. I study philosophy. We were arguing about Aristotle. Specifically, we were arguing about money.

  Mara's position was practical. She argued that what Aristotle called *chrematistike*—the art of wealth acquisition—is just rational investment behavior with bad PR. It's maximizing utility. It's how the world works.

  My position was stubborn. I argued that Aristotle calls it "unnatural" not because it's greedy, but because it's a category error. He distinguishes between *oikonomia*, which is household management—getting what you need to live well—and *chrematistike*, which is money breeding money. One has a limit; you only need so many shoes to keep your feet warm. The other has no limit; there is always more money to be made.

  We didn't resolve it. But Mara said something before we went to sleep that I haven't been able to shake. She said, "Student debt is *chrematistike* turned inward."

  She meant that when you take out a loan for this education, you are no longer just a student seeking understanding. You are an asset class. You are a vehicle that must reproduce its own cost.

  I want to hold that thought for a moment, because it matters for all of us in this room.

  We are gathered here to honor academic achievement. But we are also gathered within a market. Half of you in this audience are preparing to enter industries driven by ROI, efficiency, and growth. The other half are preparing to enter fields where value is measured in insight, care, and citizenship. Usually, at ceremonies like this, we pretend these two groups speak the same language. We say that a philosophy degree teaches "critical thinking" that helps in business, or that an economics major learns "logic" that helps in ethics.

  But Aristotle would suggest this is a false equivalence. He warns us when we use money as a universal measure for things that are incommensurable.

  To the economics and business majors: I know you understand risk. You understand capital allocation. But consider the structural claim. If education is *oikonomia*—a tool for living a good life—it has a natural limit. You become educated, and then you live. But if education is *chrematistike*—an investment vehicle—it requires infinite growth. You must earn enough not just to live, but to pay back the interest on the money you spent learning how to live.

  When we treat a seminar on justice like a revenue stream, we force it to justify itself by metrics it cannot meet. You cannot compound interest on wisdom.

  To the humanities students and the parents supporting them: I know you believe in education for its own sake. But you are signing contracts that disagree. When you take on debt to study poetry or history, you are accepting the logic of the market even as you try to opt out of it. You are agreeing that your future labor belongs to the lender before it belongs to you. You are turning your own life into a instrument of wealth acquisition.

  This is where Mara's insight leaves us unsettled.

  If she is right, then we are all participating in a system that demands the unnatural from us.

  For the future bankers and consultants in the room: You are entering a system that demands you treat human capital as something that must always yield more than it cost. But if the education you bought was supposed to be about human flourishing, and you treat it only as a yield generator, you may find yourself wealthy but impoverished in the very thing you came here to cultivate. You are betting on an asset that might not behave like a stock.

  For the future teachers and artists in the room: You are entering a system that demands you justify your existence in dollars. If you refuse to play the game, you risk insolvency. If you do play the game, you risk turning your vocation into a transaction. You are betting on a life that the market may not know how to price.

  Aristotle believed the household was the foundation of the state. Today, this university is our household. We have to decide how to manage it.

  If we treat this education as *oikonomia*, we admit that it has limits. It cannot guarantee you a salary. It cannot guarantee you status. It can only equip you to live well within the means of a human life.

  If we treat it as *chrematistike*, we admit that it is a gamble. And like all gambles, there must be losers.

  I don't know which it is. But I know that for the next four years, or the next forty, you will be paying for this distinction.

  Congratulations to the honors students. May you find a way to pay the bill without selling the thing you bought it for.

  Thank you.
