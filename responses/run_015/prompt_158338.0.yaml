answer: |-
  You have identified a genuine lacuna in standard aesthetic theory, one that sits uncomfortably between the philosophy of art, the sociology of the market, and the practicalities of provenance. You are correct that the standard philosophical puzzle (best articulated by Nelson Goodman in *Languages of Art*) concerns why we value the genuine over the indistinguishable fake. Your observation is the inverse: why the *exposed* fake sometimes commands a premium over both the genuine minor work and the honest pastiche.

  There is no single, canonical philosophical term for this specific configuration. In art market vernacular, it is sometimes loosely called the **"Van Meegeren Effect,"** but that is anecdotal, not analytical. In critical theory, it touches on **"Institutional Critique"** and **"The Social Life of Things,"** but neither fully captures the valuation spike you describe.

  However, we can perform the "carving" you request. To do so, we must distinguish between *ontological authenticity* (who made it) and *historical efficacy* (what it did). The phenomenon you are describing is the market capitalization of **successful performative deception.**

  Here is the analysis of the pattern, its boundaries, and a proposed vocabulary for your valuation notes.

  ### 1. The Philosophical Carving

  The standard view (Goodman, Danto) holds that a forgery is aesthetically deficient because it lacks the correct history of production. When a forgery is exposed, its value should theoretically collapse to that of a "mere copy."

  Your case demonstrates that value is not solely derived from *origin* but from *agency*. The object is no longer valued as a window into the 17th century (Vermeer); it is valued as a witness to a 20th-century event (the Deception).

  I propose we classify this object not as a "Fake" (which implies failure) but as a **"Transvaluated Forgery."**

  For a Transvaluated Forgery to exist, three conditions must be met:
  1.  **High-Stakes Performance:** The object must have successfully deceived a competent institution or authority. A fake that fools only a private collector does not gain the same premium as one that fools a museum or a celebrated connoisseur. The "victim's" prestige transfers to the "aggressor's" skill.
  2.  **Attributed Authorship:** The forger must be identified and elevated. An anonymous fake remains a lie; a named fake becomes a *oeuvre*. The value attaches to the forger's *genius for deception*, which is re-categorized as a *genius for imitation*.
  3.  **Aesthetic Autonomy:** The object must remain visually compelling once the deception is known. If the trick relied on chemical aging that ruined the paint, the value drops. If the trick relied on stylistic mastery, the value holds.

  ### 2. Analysis of Your Neighboring Cases

  You asked whether your neighboring cases are the "same animal." Based on the carving above, most of them are distinct species.

  *   **The Homage/Pastiche later misattributed:**
      *   *Verdict:* **Distinct.**
      *   *Reasoning:* If a pastiche was *never meant to deceive*, it lacks the *intent* of the performance. If the market *later* decides it is a forgery, it gains value only if a *narrative of deception* is constructed around it. If it remains known as an homage, it lacks the "adversarial" thrill of the Transvaluated Forgery. It is a tribute, not a heist.
  *   **Synthetic Continuations (Authorized "Late Style"):**
      *   *Verdict:* **Distinct.**
      *   *Reasoning:* This is **Brand Extension**, not Forgery. The value here comes from *proximity* to the brand, not the *subversion* of it. These works outperform minor genuine works because they are "perfect" examples of the style, unmarred by the artist's actual decline. They are "Ideal Types." They do not require a scandal; they require a license.
  *   **Anonymous Fakes / Unsuccessful Fakes:**
      *   *Verdict:* **Distinct (The "Failed Forgery").**
      *   *Reasoning:* Without a named author, there is no one to credit with the skill. Without a successful deception, there is no historical efficacy. These revert to "decorative art" or "study pieces" and lose value.
  *   **Scientific Fraud (Field Notes/Specimens):**
      *   *Verdict:* **Distinct.**
      *   *Reasoning:* Science is **truth-apt**; Art is **narrative-apt**. A fake fossil fails its function (to provide data about the past). A fake Vermeer succeeds in its function (to provide an aesthetic experience) and *adds* a secondary function (to illustrate the history of taste). The scientific fake is a broken tool; the art fake is a loaded weapon.

  ### 3. Answers to Your Specific Conditions

  You asked four specific questions to help define the boundary. Here is the decision based on the "Transvaluated Forgery" model:

  **1. Does the phenomenon require an actual deception or only an attributed one?**
  *   **Decision:** It requires **actual, historical deception.**
  *   **Reasoning:** If it is known *ab initio* to be a fake (like the synthetic continuations), it cannot gain the "scandal premium." The value spike comes from the *collapse* of the truth claim. The tension between "was Vermeer" and "is Van Meegeren" is the engine of the value. If there was no tension, there is no release.

  **2. Does it require an institution that was really fooled, or is demonstrated skill enough?**
  *   **Decision:** It requires an **institutional victim.**
  *   **Reasoning:** Demonstrated skill alone makes it a good copy. Fooling a museum makes it a historical event. The premium is paid for the object's *biography*, specifically its capacity to humble authority. A fake that sits in a basement never gains the premium, even if it is technically brilliant. It must have "lived" as a genuine article in the public sphere.

  **3. Does the premium belong to the object's aesthetic life or only to its documentary interest?**
  *   **Decision:** It is a **Hybrid (Aestheticized History).**
  *   **Reasoning:** Your conservator friend is half-right: it is documentary. But you are right that it is still hung as art. The premium belongs to the *narrative of the aesthetic*. We look at the canvas and see the moment the art world was tricked. The aesthetic experience is now *meta-aesthetic*. We admire the brushwork *as* the tool of the deception. It is not "art despite the lie"; it is "art *because* of the lie."

  **4. Does it decay once the scandal is no longer something anyone living remembers?**
  *   **Decision:** **Yes, it decays.**
  *   **Reasoning:** This is the crucial test. A Van Meegeren is valuable now because the story of the Nazi Goering buying his work is still culturally resonant. In 100 years, if the scandal is forgotten, the work will likely revert to the price of a "competent 1940s pastiche." The value is tethered to the *notoriety*, which is a perishable commodity.

  ### 4. Valuation Vocabulary

  For your valuation notes, you need a term that distinguishes this from a standard "Attributed to" or "Circle of." You need to signal that the inauthenticity is a *feature*, not a bug.

  I recommend using the classification: **"Historicized Forgery"** or **"Notorious Provenance."**

  However, for the sentence you need to write, I suggest a phrasing that captures the *efficacy* of the object.

  *   *Instead of:* "Later identified as a forgery by [Name]." (Implies loss of value).
  *   *Try:* "Executed by [Forger] during the period of his celebrated deceptions; historically exhibited and sold as [Master]."
  *   *Or:* "A work of significant art-historical notoriety, formerly attributed to [Master]."

  If you need a single noun for your database to categorize this specific value spike, I propose **"Efficacious Fake."**

  **Definition for your files:**
  > **Efficacious Fake:** *An inauthentic work whose market value is enhanced by its documented history of successful deception regarding a higher-value attribution. Distinct from a standard forgery in that the exposure of the maker does not diminish value, but rather re-categorizes the object as a primary document of art-market history. Value is contingent on the fame of the forger and the prestige of the deceived institution.*

  ### Summary

  Your friend sees a relic; you see a transformed aesthetic object. You are both right, but the market agrees with you. The object has shifted from being a **Window** (looking through to the 17th century) to being a **Mirror** (reflecting the 20th century's desires and failures).

  This is not a standard forgery. It is a **performative artifact**. It is worth more because it *did* something that no honest painting could do: it broke the system. In a market that worships the system, the object that successfully hacked it becomes a holy relic of the vulnerability of taste. That is the carving.
