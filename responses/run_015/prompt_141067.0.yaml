answer: |-
  The concept you are looking for is **Successor Liability**.

  It is not guilt, and it is not unjust enrichment. It is the obligation that attaches to the **continuity of an artificial person** (a state, a corporation, a union, a university) when that person persists through time while its natural members change.

  Your friend's fork fails because it assumes the only things that exist are *individual humans* and *material benefits*. It ignores the third category: **Institutions**. Institutions are moral agents that outlive their members. They hold property, make promises, and incur debts. When you join an institution, you do not just inherit its assets; you inherit its balance sheet.

  Here is the carving of the concept, how it avoids the fork, and where its edges lie.

  ### 1. The Core Distinction: Guilt vs. Liability
  Your friend is right about **Guilt**. Guilt is backward-looking and punitive. It requires a specific act by a specific moral agent. You cannot inherit guilt because you did not commit the act. If your argument relies on "white guilt" or "national shame," you are on the losing horn of the fork.

  **Successor Liability** is forward-looking and restorative. It is not about punishing the living for the dead. It is about the **current entity** settling the unresolved debts of its past self.
  *   **The Agent:** The State (or Union, or University). Not the people, but the *structure*.
  *   **The Debt:** Not a sin, but an outstanding obligation. If a company dumps toxic waste in 1980, and the CEO retires in 1985, the company in 2024 still owes the cleanup. The 2024 shareholders didn't dump the waste. They might not even profit from it (the cleanup costs might exceed dividends). But they own the company *as it currently exists*, and the company includes the liability.

  ### 2. Answering the Fork
  Your friend asks: *Is it guilt (incoherent) or benefit (redistribution)?*
  **Answer:** It is **Title**.

  When you accept the benefits of the institution (protection, land title, seniority, degree value), you accept the *legal and moral continuity* of that institution. You cannot cherry-pick. You cannot say, "I accept the land grant from 1890 but I reject the treaty violation that made the land available." The validity of your current holding depends on the validity of the past act.

  *   **Against the Guilt Horn:** You are not being blamed. You are being asked to administer the repair.
  *   **Against the Benefit Horn:** It doesn't matter if you personally profited. It matters that you hold the **title** derived from the act. If you hold a deed to land that was stolen by the entity you now belong to, your ownership is contingent on the entity resolving the theft.

  ### 3. The Passport Test
  Your friend asks: *If I leave the country, does the obligation vanish?*
  **Answer:** **Yes, but you cannot leave without settling the account.**

  This is the crucial distinction between *blood* (essentialism) and *contract* (association).
  *   **If it were blood:** You could never escape it, no matter where you went. (This is the racist horn).
  *   **If it were mere paper:** You could drop the paper and walk away clean. (This is the consequentialist horn).

  **The Successor Liability view:** Citizenship is a form of **partnership**. In a partnership, you are jointly liable for the debts incurred while you were a partner. You *can* resign from the partnership (emigrate). But you cannot resign *while the house is on fire*. You must settle your share of the liability before you are released from the association. If you just walk away, you are a defector, not an innocent party.

  So, the obligation attaches to **participation in the continuing structure**. As long as you vote, hold land, or use the courts of that State, you are exercising the authority of that State. You cannot exercise the authority without accepting the liabilities of the authority.

  ### 4. Group Continuity (The "Same Group" Problem)
  Your friend asks: *What makes America 1820 the same agent as America 2020?*
  **Answer:** **Functional Recognition.**

  An institution is the same agent across time if the current iteration **recognizes the acts of the past iteration as valid.**
  *   Does the current government honor the land deeds signed in 1850? Yes.
  *   Does it honor the treaties signed in 1850? Sometimes.
  *   Does it honor the debts incurred in 1850? Yes.

  You cannot say, "We are the same government for the purpose of collecting taxes and enforcing property rights, but a different government for the purpose of honoring treaties or repairing wrongs." That is **selective continuity**. You are either the successor to the estate, or you are a squatter. If you claim the inheritance, you claim the debts.

  ### 5. Applying the Carving to Your Three Cases

  **Case 1: The Nation (Land/Slavery)**
  *   **Guilt?** No. Living citizens are not murderers.
  *   **Benefit?** Irrelevant. Some are poor.
  *   **Liability:** The State holds the land and the authority. The title to the land rests on past acts (conquest, seizure). The State continues to enforce those titles. Therefore, the State owes the repair to maintain the legitimacy of its current authority. Citizens owe the repair because they are the current stakeholders in that State.

  **Case 2: The University (Endowment)**
  *   **Guilt?** No. Current staff didn't set the terms.
  *   **Benefit?** The money is there, but the condition was racist.
  *   **Liability:** The University is a corporate entity. It accepted the money. The money is part of its corpus. If the source of the corpus violates the current charter's moral/legal standards, the University (the entity) must cleanse the corpus. It's not about the students; it's about the **integrity of the endowment**. If the money is tainted, the University cannot spend it without compromising its own standing.

  **Case 3: The Union (Seniority List)**
  *   **Guilt?** No. Current members didn't exclude the others.
  *   **Benefit?** You noted they are *worse off*. So the benefit argument dies here.
  *   **Liability:** The Union Local is the entity. The Seniority List is an **institutional rule**. The rule was built on a violation of the Union's own purpose (fair representation). Even if current members lose out by fixing it, the *Local* has a duty to correct its own governing rules to match its charter. The obligation is to the **institution's integrity**, not to the members' wallets. If they don't fix it, the Union is operating on a fraudulent basis.

  ### 6. Edges and Boundaries
  Here is how to tell if the obligation exists or has expired:

  **1. Is the Structure Continuous?**
  *   *Yes:* The US Government today is the legal successor to the US Government in 1860. Liability holds.
  *   *No:* The German Democratic Republic (East Germany) is not the same legal entity as the German Empire. When the USSR collapsed, the Russian Federation accepted some debts but repudiated others. Continuity is a legal choice, not a metaphysical fact. If a revolution happens and the new government explicitly repudiates the old laws and titles, the liability may break. (This is why your friend's "conquered and reconstituted" question matters: If the Constitution is torn up, the debt might be too).

  **2. Is the Effect Ongoing?**
  *   *Yes:* Property ownership, wealth distribution, and seniority lists are **current states of affairs** caused by past acts. The wrong is not "over"; the *distribution* is the ongoing result.
  *   *No:* If a law was passed in 1800, repealed in 1805, and left no trace on current property or status, the liability fades. You don't owe reparations for a tax that existed for five years 200 years ago with no lasting structural impact.

  **3. Did the Member Join Voluntarily?**
  *   *Yes:* If you naturalize as a citizen, or take a job at the University, or join the Union, you accept the current bylaws and the history embedded in them. You are a **voluntary stakeholder**.
  *   *No:* Birthright citizens are born into the liability. This is the hardest sell. But the counter is: You enjoy the protection of the State from birth. You cannot opt out of the protection, so you cannot opt out of the maintenance costs (including moral repair).

  ### 7. Summary for Your Buddy
  Tell him this:
  1.  **Drop the word Guilt.** Agree with him. It's incoherent.
  2.  **Drop the word Benefit.** Agree that some people didn't benefit. It doesn't matter.
  3.  **Use the word Estate.**
      *   "We are the executors of a continuing Estate (the Country/Union/Uni)."
      *   "The Estate has debts. The debts are attached to the Estate's assets (Land/Authority/Rules)."
      *   "We hold the assets. Therefore we hold the debts."
      *   "If we want to keep the assets, we must pay the debts. If we don't want to pay the debts, we must surrender the assets."
      *   "The Passport Test is irrelevant. You can't resign from a partnership that is insolvent without clearing the debt first. If you leave without paying, you aren't innocent; you're a defaulter."

  This moves the argument from **Theology** (sin and blood) to **Property Law** (titles and liabilities). It removes the moralistic sting your friend hates while preserving the obligation you feel is real.
