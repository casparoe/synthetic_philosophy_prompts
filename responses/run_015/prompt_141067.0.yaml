      *   The key distinction is between *backward-looking blame* (guilt) and *forward-looking repair* (responsibility) grounded in *membership* rather than *action* or *gain*.
      *   The specific philosophical "carving" needed is likely a robust account of **Collective Continuity** and **Non-Voluntary Political Obligation**.

  4.  **Drafting the Conceptual Framework (The "Carving"):**

