          *   *Solution:* It goes away *prospectively*, but not *retrospectively*. You can't escape the obligation to repair the house you currently live in by moving out tomorrow. But you don't carry the debt to a new house. *Correction:* Actually, the stronger argument is that the obligation attaches to the *office/role*, not the *person*. If you cease to hold the role (citizen), you cease to hold the specific political responsibility, *but* you cannot divest yourself of the benefits already accrued or the complicity in the ongoing structure up to the point of exit.
