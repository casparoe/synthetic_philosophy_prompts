  **Root Commitment:** Suffering in wild animals matters morally, and matters on a par with comparable suffering in humans.

  ### Node 1
  **Claim:** In this specific semi-natural habitat, does the suffering of wild animals exceed their well-being?
  *   **Yes (Net Negative):** Go to Node 2.
  *   **No (Net Positive):** Go to Node 5.

  ### Node 2
  **Claim:** If we prevent an animal from being born to spare it suffering, have we benefited it?
  *   **Yes (Non-Identity Acceptance):** Go to Node 3.
  *   **No (Person-Affecting View):** Go to Node 4.

  ### Node 3
  **Claim:** Do the deaths imposed on current residents outweigh the future suffering prevented by their removal?
  *   **Yes (Deaths Dominate):** **Leaf 1**
  *   **No (Prevention Dominates):** Go to Node 4.

  ### Node 4
  **Claim:** Should we clear the habitat entirely or use fertility control to reduce population?
  *   **Clear Habitat:** **Leaf 2**
  *   **Fertility Control:** **Leaf 3**

  ### Node 5
  **Claim:** Given we know little about wild animal welfare, does uncertainty impose a burden of proof on whoever proposes to convert?
  *   **Yes (Precautionary Principle):** Go to Node 6.
  *   **No (Proactionary Stance):** Go to Node 7.

  ### Node 6
  **Claim:** Is the comparison class the habitat as it stands, or a successfully restored version of it?
  *   **Status Quo:** **Leaf 4**
  *   **Restored Version:** **Leaf 5**

  ### Node 7
  **Claim:** Is the goal to minimize suffering now or to eliminate the habitat entirely?
  *   **Minimize Now:** **Leaf 6**
  *   **Eliminate Habitat:** **Leaf 7**

  ### Node 8
  **Claim:** If conversion replaces long-lived specialists with many short-lived generalists, does the total sum of welfare matter more than the average per animal?
  *   **Total Sum:** Go to Node 9.
  *   **Average Per Animal:** Go to Node 10.

  ### Node 9
  **Claim:** Should we convert this land to house humans intensively to spare other land for nature, or leave this land semi-natural?
  *   **Convert (Land Sparing):** **Leaf 8**
  *   **Leave (Land Sharing):** **Leaf 9**

  ### Node 10
  **Claim:** Does the ecosystem have moral standing independent of the sentient individuals composing it?
  *   **Yes:** **Leaf 10**
  *   **No:** Go to Node 11.

  ### Node 11
  **Claim:** Is letting this land revert to scrub (rewilding) likely to increase or decrease suffering per animal?
  *   **Increase:** **Leaf 11**
  *   **Decrease:** **Leaf 12**

  *(Note: Node 8 is reached if Node 1 is "No". Node 5 is reached if Node 1 is "Yes". To ensure flow, assume Node 1 "No" leads to Node 8, and Node 1 "Yes" leads to Node 2. The numbering above reflects logical grouping, but the tree splits at Node 1 into two main branches: Negative Welfare [Nodes 2-7] and Positive Welfare [Nodes 8-11].)*

  ---

  ### The Leaves

  **Leaf 1: Restrained Negative Utilitarian**
  *   **Position:** Maintain the habitat despite net negative welfare.
  *   **Least Defensible Commitment:** We must allow vast quantities of preventable suffering to occur simply because stopping it requires killing the sufferers.

  **Leaf 2: Wild Animal Suffering Interventionist**
  *   **Position:** Actively clear the habitat to prevent future suffering.
  *   **Least Defensible Commitment:** It is morally preferable to destroy a complex ecosystem entirely than to allow the sentient beings within it to continue living.

  **Leaf 3: Compassionate Conservationist**
  *   **Position:** Manage population via fertility control rather than clearance.
  *   **Least Defensible Commitment:** We can reliably implement large-scale fertility control on wild populations without causing greater suffering through stress or ecological collapse.

  **Leaf 4: Precautionary Status Quo Defender**
  *   **Position:** Do not convert due to epistemic uncertainty.
  *   **Least Defensible Commitment:** We should preserve a state of affairs known to contain net suffering rather than risk an intervention that might eliminate it.

  **Leaf 5: Precautionary Restorationist**
  *   **Position:** Restore the habitat despite uncertainty, assuming the natural state is better.
  *   **Least Defensible Commitment:** We are justified in imposing the costs of restoration on the basis of a romantic assumption that 'natural' equals 'good' for welfare.

  **Leaf 6: Proactionary Mitigator**
  *   **Position:** Intervene to reduce suffering without eliminating the habitat.
  *   **Least Defensible Commitment:** We possess sufficient knowledge of wild animal psychology to manage suffering without inadvertently causing more.

  **Leaf 7: Proactionary Eliminator**
  *   **Position:** Convert habitat to human use to end wild suffering.
  *   **Least Defensible Commitment:** The complete extinction of wild animal populations is a moral good if it prevents their suffering.

  **Leaf 8: Land Sparing Welfarist**
  *   **Position:** Convert this land for housing to spare other land for nature.
  *   **Least Defensible Commitment:** It is acceptable to impose high density and suffering on the animals here if it statistically reduces suffering for animals elsewhere.

  **Leaf 9: Total Utilitarian Preservationist**
  *   **Position:** Leave this land semi-natural to maximize total welfare.
  *   **Least Defensible Commitment:** We should prioritize the sheer number of lives lived over the quality of those lives if the total sum is higher.

  **Leaf 10: Ecological Holist**
  *   **Position:** Preserve the habitat for its own integrity.
  *   **Least Defensible Commitment:** The integrity of the ecosystem matters even if it requires the intense suffering of the sentient individuals composing it.

  **Leaf 11: Anti-Rewilding Welfarist**
  *   **Position:** Resist reversion to scrub because it increases suffering per animal.
  *   **Least Defensible Commitment:** We should prevent the restoration of natural processes because the resulting predators will cause too much pain.

  **Leaf 12: Anti-Development Welfarist**
  *   **Position:** Resist conversion because clearance favours short-lived generalists.
  *   **Least Defensible Commitment:** We must block human housing development primarily because the resulting mice and rats will have lower average welfare than the current deer.

  ---

  ### Analysis of Unoccupied Combinations

  **1. Net Negative Welfare + Person-Affecting View + Convert to Housing (Leaf 7 variant)**
  *   **Status:** **Incoherent.**
  *   **Reasoning:** If prevented animals cannot be benefited (Person-Affecting), and existing animals are harmed by death/displacement, there is no welfare-based justification for converting the habitat to housing. The view collapses into Leaf 1 or Leaf 4.

  **2. Ecological Holist + Net Negative Welfare + Convert to Housing**
  *   **Status:** **Incoherent.**
  *   **Reasoning:** A Holist values ecosystem integrity. Converting semi-natural habitat to housing destroys that integrity. A Holist who accepts Net Negative welfare would likely support Leaf 3 (Mitigation) or Leaf 1 (Restraint), but not destruction of the system itself.

  **3. Total Utilitarian + Net Positive + Precautionary Principle**
  *   **Status:** **Unattractive.**
  *   **Reasoning:** If the total welfare is known to be positive, invoking epistemic uncertainty to block conversion (Leaf 4 style) contradicts the confidence in the positive valuation. It is merely unexplored because few Total Utilitarians adopt strong precautionary constraints on known goods.

  ### Indistinguishable Leaves

  **Leaf 9 (Total Utilitarian Preservationist) and Leaf 10 (Ecological Holist)**
  *   **Reasoning:** Both positions prescribe the same policy outcome (preserve the semi-natural habitat) in almost all realistic scenarios involving development. The tree cannot separate them based on the policy question alone, as one preserves for the sum of sentient welfare and the other for systemic integrity, but the action taken is identical. Distinguishing them requires asking *why* they preserve, not *whether*.
