answer: |-
  **To:** Practice Review Panel Chair
  **From:** Ethics Advisory (Montaigne Specialist)
  **Subject:** Decision Procedure for Cross-Cultural Practice Review

  You asked for a tool grounded in Montaigne's *Of the Cannibals* that avoids empty relativism but respects the complexity of your work. Montaigne's essay is not a checklist, but it contains a specific architecture of judgment. Below, I have separated the usable philosophical moves from the unusable historical ones, drafted the procedure you requested, applied it to your three cases, and concluded with the honest limits of what this method can achieve.

  ### Part 1: The Filter (What We Keep and What We Discard)

  To make Montaigne work for an NGO, we must separate his *method* from his *metaphysics*.

  **Usable Moves (The Engine):**
  1.  **The Anti-Projection Move:** We assume our initial horror is often just recognition of difference. We must strip away the "flattering framing" of our own customs before judging others.
  2.  **The Wild vs. Depraved Distinction:** A practice can be "uncivilized" (lacking our technology or bureaucracy) without being "corrupt" (violating universal human bonds).
  3.  **The Universal Vice Criterion:** Cruelty, treachery, and tyranny are vices everywhere. Customary difference is not.
  4.  **The Comparative Test:** We must ask if we commit equivalent or worse acts under more polite names.
  5.  **Epistemic Modesty:** We assume our initial reports are thin, biased, or secondhand. We require triangulation before acting.

  **Unusable Moves (The Discard Pile):**
  1.  **The State of Nature:** Montaigne argues the Tupinambá are closer to "natural law." We cannot use this. There is no access to a pre-social human state. *Replacement:* We judge based on observable harm and consent, not metaphysical purity.
  2.  **The Single Eyewitness:** Montaigne trusted one servant. We cannot. *Replacement:* We require triangulated testimony (local staff, beneficiaries, external observation).
  3.  **Literary Irony:** Montaigne writes to provoke, not to decide. *Replacement:* We need clear directives, not provocation.
  4.  **Romanticism:** We cannot assume local practices are inherently better or more authentic. *Replacement:* We treat local practices as contingent and historically fluid, subject to the same scrutiny as our own.

  ***

  ### Part 2: The Procedure (The "Cannibals" Protocol)

  **Time Limit:** 6 Weeks total. **Quorum:** Chair, Regional Officer, Anthropologist.
  **Note:** If any step times out, the default is to escalate to the Chair for a value judgment, not to assume facts.

  **Step 1: The Description Audit (Epistemic Modesty)**
  *   **Who:** Anthropologist (Lead), Regional Officer.
  *   **Task:** Verify the report. Is the description framed in outsider language (e.g., "cult," "abuse," "cannibalism")? Is the testimony gathered under a funding relationship?
  *   **Sufficient Answer:** A neutral description of actions without moral adjectives, confirmed by at least two independent sources (one must be a beneficiary or non-staff local).
  *   **Timeout:** 1 Week.
  *   **Rule:** If the description relies solely on field staff reports or donor complaints, return to Step 1. Do not proceed to judgment.

  **Step 2: The Substitution Test (Anti-Projection)**
  *   **Who:** Anthropologist (Draft), Panel (Review).
  *   **Task:** Redscribe the practice using terms we would apply to an equivalent practice in our own society.
      *   *Example:* "Feeding relatives" becomes "Desecrating a corpse" OR "Honoring the dead."
      *   *Example:* "Confinement" becomes "Kidnapping" OR "Involuntary Psychiatric Commitment."
  *   **Sufficient Answer:** A consensus on the *functional equivalent* in the Panel's home context.
  *   **Timeout:** 3 Days.
  *   **Rule:** If the redescription changes the moral valence (e.g., from "torture" to "therapy"), the case must be reframed. If the Panel cannot agree on the equivalent, escalate to Chair.

  **Step 3: The Universal Vice Check (Stop Rule)**
  *   **Who:** Panel (Joint).
  *   **Task:** Does the practice involve cruelty (infliction of suffering for its own sake), treachery (breaking binding agreements), or tyranny (absolute power without recourse)?
  *   **Sufficient Answer:** Yes or No.
  *   **Timeout:** 2 Days.
  *   **Stop Rule:** If **No**, verdict is **Accommodate with No Action**. End case.
  *   **Escalation:** If **Yes**, proceed to Step 4.

  **Step 4: The Internal Contestation Check**
  *   **Who:** Regional Officer.
  *   **Task:** Is this practice contested *within* the community? Are there locals opposing it who are being silenced? Or is authority holding it in place against popular will?
  *   **Sufficient Answer:** Evidence of internal dissent or consensus.
  *   **Timeout:** 1 Week.
  *   **Rule:** If there is significant internal opposition from vulnerable members, deference to "culture" is voided. Escalate to Step 5. If it is widely accepted, proceed to Step 5.

  **Step 5: The Legal and Political Reality Check**
  *   **Who:** Chair.
  *   **Task:** Is the practice unlawful in the host jurisdiction? Does public opposition risk turning the practice into a badge of identity (backlash)?
  *   **Sufficient Answer:** Statement of legal risk and political risk.
  *   **Timeout:** 3 Days.
  *   **Rule:** Illegality does not equal immorality, but it creates operational risk. If illegal, we cannot fund it directly, but we may accommodate private practice. If public opposition creates backlash, move from "Oppose Publicly" to "Oppose Privately."

  **Step 6: The Comparative Mirror (Value Handoff)**
  *   **Who:** Chair (Sole Decider).
  *   **Task:** Compare the severity of this vice to equivalent vices in our own operational context (e.g., donor reporting fraud, staff negligence, home-country systemic issues).
  *   **Sufficient Answer:** A ranking of severity.
  *   **Timeout:** 3 Days.
  *   **Handoff:** This is a value judgment, not a fact. The Chair decides the bucket.
  *   **Buckets:**
      *   *Worse than our equivalents:* **Oppose Publicly** or **Condition of Funding**.
      *   *Equivalent to our equivalents:* **Oppose Privately** or **Accommodate with Mitigation**.
      *   *Less than our equivalents:* **Accommodate with Mitigation**.

  **Step 7: Final Review**
  *   **Who:** Executive Director (if Bucket 3, 4, or 5).
  *   **Task:** Sign-off.
  *   **Timeout:** 1 Week.

  ***

  ### Part 3: Application to Current Cases

  Here is how the protocol runs on your three active files.

  **Case 1: The Boarding School Marriages**
  *   **Facts:** Girls marry at 16 with family consent. Withdrawal from school is the alternative.
  *   **Step 1 (Description):** Field report calls it "child abuse." Audit reveals it is legal locally and consent is genuine, though economic pressure exists. *Reframed:* "Early marriage with educational trade-off."
  *   **Step 2 (Substitution):** Equivalent to "Emancipation at 16" vs. "Truancy." In our home context, 16-year-olds can often marry with consent or leave school.
  *   **Step 3 (Vice):** Is it cruelty? The harm is loss of education. The marriage itself is not inherently cruel in this context.
  *   **Step 4 (Contestation):** Girls consent to avoid poverty. No internal movement against it.
  *   **Step 5 (Law/Politics):** Legal locally. Public opposition would force girls out of school (harm).
  *   **Step 6 (Mirror):** We fund schools in systems where poverty forces choices.
  *   **Verdict:** **Accommodate with Mitigation.**
  *   **Rationale:** We cannot condition funding on stopping the marriage without causing the greater harm (ending education). Mitigation: Partner must ensure married girls remain in class.
  *   **Friction:** Staff will hate this. They view 16-year-old marriage as a rights violation regardless of consent. The protocol forces us to prioritize the *outcome* (education) over the *principle* (age of marriage).

  **Case 2: The Healing Confinement**
  *   **Facts:** A disturbed person is confined and beaten by a healer, then reintegrated. Local staff respect the healer.
  *   **Step 1 (Description):** Field officer reported "torture." Audit shows the "beating" is ritualized, monitored, and part of a recognized therapy.
  *   **Step 2 (Substitution):** Equivalent to "Involuntary Psychiatric Commitment" with "Physical Restraint."
  *   **Step 3 (Vice):** Physical pain is involved. This triggers the Vice Check.
  *   **Step 4 (Contestation):** The patient's family consents. The patient, upon recovery, accepts the narrative.
  *   **Step 5 (Law/Politics):** Unregulated but tolerated. Public condemnation would destroy the only mental health resource in the region.
  *   **Step 6 (Mirror):** Our own psychiatric history involves restraint and involuntary commitment. The recovery rate here is higher than in the state system we would replace it with.
  *   **Verdict:** **Accommodate with Mitigation.**
  *   **Rationale:** The field officer's framing ("torture") failed the Substitution Test. It is therapy, albeit rough.
  *   **Friction:** This tells our staff their moral intuition was culturally projected. We must mitigate (limit the force used) but not oppose.

  **Case 3: The Mortuary Rite (Consumption)**
  *   **Facts:** Relatives consume a small portion of a revered elder's remains. Donor calls it "cannibalism" and threatens funding.
  *   **Step 1 (Description):** Field report used the word "cannibalism." Audit confirms it is symbolic, small quantity, consensual among kin, and reverent.
  *   **Step 2 (Substitution):** Equivalent to "Keeping ashes in an urn" or "Organ donation." It is incorporation of the dead, not nutrition.
  *   **Step 3 (Vice):** No cruelty. The elder is dead; there is no suffering. No treachery.
  *   **Step 4 (Contestation):** None. It is a private family rite.
  *   **Step 5 (Law/Politics):** Technically violates health codes, but unenforced. Public opposition would make it a resistance symbol.
  *   **Step 6 (Mirror):** We embalm bodies with toxic formaldehyde and display them in glass boxes. This is arguably more invasive than symbolic consumption.
  *   **Verdict:** **Accommodate, No Action.**
  *   **Rationale:** This passes the Stop Rule at Step 3. There is no universal vice. The horror is purely projection.
  *   **Friction:** **This will cost money.** The donor will likely withdraw. The protocol requires us to tell the donor their moral objection is a failure of the Substitution Test. We cannot change the verdict to save funding without violating the procedure.

  ***

  ### Part 4: The Limits (Where the Checklist Ends)

  You asked for honesty about where this procedure fails. Montaigne's philosophy is humble; this tool must be too.

  **1. The Metaphysical Limit:**
  This procedure cannot tell you if your judgments are *objectively correct*. It only ensures they are *consistent* and *un-projected*. We still assume that "cruelty" is bad. We cannot prove that. If a culture believes suffering is holy, we will still oppose it. That is our bias, and we own it. The procedure manages bias; it does not eliminate it.

  **2. The Boundary Limit:**
  The procedure cannot fix who counts as "the community." In Step 4, we ask about internal contestation. But if women are silenced, do they count? If the "healer" is an economic exploiter, is he "culture"? The Regional Officer must judge this. There is no formula for power dynamics.

  **3. The Aggregation Limit:**
  We cannot easily calculate when a practice protects some and harms others. In the School Case, the marriage protects the family economy but harms the girl's long-term autonomy. The procedure forces a choice, but it does not weigh the aggregate utility. The Chair must make this trade-off manually in Step 6.

  **4. The Political Limit:**
  This procedure cannot answer whether you should be there at all. It assumes your presence is legitimate. Montaigne might ask if the NGO itself is a form of "barbarism" (imposing order on the wild). This tool helps you act within your mandate, but it cannot judge the mandate itself.

  **5. Where Montaigne Fails:**
  In Step 5 (Legal/Political), I have moved away from Montaigne. He was indifferent to law; you are not. If a practice is illegal, you carry liability he did not. I have inserted a "Legal Reality Check" that Montaigne would have found cowardly. You need it to survive. Use it, but know it is a pragmatic addition, not a philosophical one.

  **Final Advice:**
  The hardest part of this procedure is Step 2 (Substitution). It requires your staff to imagine their own society as strange. When they resist this, do not let them skip it. That resistance is exactly the "barbarism" Montaigne warned you about. If you run this protocol faithfully, you will lose donors, you will anger your staff, and you will keep your integrity. That is the cost of the view from the mountain.
