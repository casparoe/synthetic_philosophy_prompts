answer: |-
  Mara, mechanisms don't come with birth certificates. You're treating the detector like it's the mechanism's conscience, but it's just a witness. The decision boundary is where your software says "something's off," not where the machine stops being itself. If I swap a heart valve for a mechanical pump, the organism might survive, but is it the same mechanism of circulation? Your detector flagged drift because the statistical profile changed, but the question is whether the *productive organization* survived. Did that learned model become a constitutive part of the safety loop, or was it just a ghost in the wiring? If intervening on the model changes the dump timing, it's part of the mechanism. If it is, then the mechanism changed when the model was bolted on, not when the detector noticed. But I need to know something: when that model nudges the vote, does it bypass the physical logic, or does it just tweak the threshold within the existing logic? Because one is a new organization, the other is just a parameter tune.

  ***

  **Settled:** Most mechanists accept the interventionist criterion for parthood (if wiggle part → wiggle phenomenon, it's constitutive).
  **Contested:** Mechanism *individuation* (when does modification create a *new* mechanism?). Realists often admit identity is vague/gradual; regulators/lawyers demand binary states. The "decision boundary" move is pragmatic, not ontological.
