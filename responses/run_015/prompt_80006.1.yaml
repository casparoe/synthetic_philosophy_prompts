prompt: |-
  I run a small cause-prioritization consultancy and we take on a new cause proposal roughly every two weeks. Each one gets a two-hour workshop where my team — three people, none of us with a stats background — is supposed to score it on importance, tractability, and neglctedness and come out with a fund / fund-with-reservations / pass call that I and one of my partners have to be able to defend in a client meeting. Right now the process is basically vibes plus a spreadsheet, and I keep hitting the same failure modes. We score a cause high on neglectedness because almost nobody's working on it, but then it turns out the reason nobody's working on it is that the people who could work on it already tried and found it intractable, so "neglected" ended up being a proxy for "we don't know how to do this." And we score importance in whatever units the proposal comes in — QALYs, dollars of economic output, "units of alignment progress" — and then try to add them across causes, which is nonsense.

  Can you write me a decision procedure my team can actually run in that two-hour slot? I want the questions in the order we should ask them, what counts as a sufficient answer to each, and the exact point where the procedure stops and hands the call to a person because the question is one of values rather than facts. Three things it has to handle. First, the neglectedness score has to seperate "few people are working on this because it's hard to even understand what the problem is" from "few people are working on this because the people who could work on it are already working on it and hitting a wall" — I think those are different and I want the procedure to catch the difference, not just count heads. Second, the importance score has to be doable without converting everything to one unit, because we're not going to fake a QALY number for a cause that's about something we can't quantify. Third, tractability has to tell the difference between a research bet, where the next step is "do more theory" and the payoff is option value, and an action, where the next step is a concrete intervention with a payoff curve we can at least sketch.

  Then run it on two proposals. One is a two-year research program on a high-tail-risk AI safety problem where the importance is potentially enormous but the only "next step" is more theory and nobody knows if the theory will pan out — I think the procedure should be honest that this is a research bet with a tail-risk importance estimate, not an expected-value action, and score it that way even if that means a lower number than the importance alone would suggest. The other is a cause that's neglected only because it's embarrassing to talk about publicly, so the neglectedness is real but it's going to evaporate the moment we fund it and put our name on it — I think the procedure should flag that as a decaying score rather than a stable property.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small cause-prioritization consultancy (3 people, no stats background).
      *   **Workflow:** New proposal every 2 weeks, 2-hour workshop per proposal.
      *   **Goal:** Produce a Fund / Fund-with-Reservations / Pass call defensible in client meetings.
      *   **Current Pain Points:**
          *   "Vibes + Spreadsheet."
          *   Neglectedness confusion (ignored because hard vs. ignored because intractable).
          *   Importance unit mismatch (QALYs vs. dollars vs. abstract units).
          *   Tractability confusion (research bet/option value vs. concrete intervention).
      *   **Requirements for the Procedure:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Clear handoff point (Fact vs. Value).
          *   Must handle the three specific pain points (Neglectedness nuance, Importance unit agnosticism, Tractability type distinction).
      *   **Test Cases:**
          *   Case 1: High-tail-risk AI safety research (Theory-heavy, uncertain payoff).
          *   Case 2: Embarrassing/Stigmatized cause (Neglectedness decays upon funding).

  2.  **Deconstruct the Framework (ITN):**

      *   *Importance:* Needs to be comparable without forced unit conversion. Solution: Use ordinal ranking or "buckets" within a specific context, or focus on *scale of impact if successful* rather than expected value immediately.
      *   *Tractability:* Needs to distinguish "Research/Option Value" from "Direct Action." Solution: Explicitly categorize the *type* of intervention first.
      *   *Neglectedness:* Needs to distinguish "Unknown/Confusing" from "Hard/Blocked." Solution: Investigate the *reason* for neglect, not just the count.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Constraint:* 2 hours for 3 people. This is tight. The procedure must be decisive, not open-ended.
      *   *Structure:* Gatekeeping approach. If it fails an early gate, stop. Don't waste time scoring importance if tractability is zero.
      *   *Phase 1: Triage (15 mins).* Is this even coherent?
      *   *Phase 2: Tractability & Type (45 mins).* Address the Research vs. Action distinction.
      *   *Phase 3: Neglectedness Diagnostic (30 mins).* Address the "Why is it neglected?" question.
      *   *Phase 4: Importance & Scale (30 mins).* Address the unit problem.
      *   *Phase 5: Synthesis & Decision (30 mins).* The Value Handoff.

      *   *Refining the "Value Handoff":* The prompt asks for the exact point where facts end and values begin. This is usually at the risk tolerance/weighting stage. The procedure should output a *profile*, not just a number, and the partners decide if that profile matches the client's mandate.

      *   *Refining Neglectedness:* Instead of a score, use a "Neglect Diagnostic."
          *   Type A: Invisible (nobody sees it).
          *   Type B: Hard (people see it, can't solve it).
          *   Type C: Stigmatized (people see it, don't want to touch it).
          *   *Key Insight:* Type B is a trap for non-experts. Type C is temporary. Type A is rare.

      *   *Refining Importance:* Don't sum units. Use "Impact Ceiling" and "Impact Floor." Or better, "Magnitude Class." Let's use a "Scale Anchor" method. Compare to known benchmarks (e.g., "Is this bigger than deworming?" "Is this bigger than AI x-risk?").

      *   *Refining Tractability:* Split into "Action Pathway" (Direct) vs. "Knowledge Pathway" (Research). Research gets scored on *Learning Value*, not just *Solution Probability*.

  4.  **Developing the Decision Procedure (The "ITN-Plus" Protocol):**

      *   *Pre-work:* Require a 2-pager from the proposer.
      *   *Step 1: The Tractability Type Check.* (Action vs. Research).
      *   *Step 2: The Neglectedness Autopsy.* (Why is it empty?).
      *   *Step 3: The Importance Anchor.* (Relative scale, not absolute units).
      *   *Step 4: The Value Handoff.* (Risk tolerance).

  5.  **Running the Test Cases:**

      *   *Case 1 (AI Safety Research):*
          *   Type: Knowledge Pathway.
          *   Neglect: Likely "Hard" (experts tried) or "New" (nobody understands). Need to distinguish. If experts tried and failed, it's a "Hard" block.
          *   Importance: High Ceiling, Low Floor.
          *   Outcome: Fund-with-Reservations (as a research bet), not a high-EV action.
      *   *Case 2 (Stigmatized Cause):*
          *   Type: Action Pathway.
          *   Neglect: Stigma.
          *   Risk: Neglectedness decays once funded (spotlight effect).
          *   Outcome: Pass or Fund-with-Reservations (if anonymity is possible).

  6.  **Polishing the Output:**

      *   Make it actionable. Use checklists.
      *   Ensure the "Stop and Handoff" moment is clear.
      *   Ensure the tone is professional but practical for non-statisticians.
      *   *Self-Correction on Time:* 2 hours is very short for deep analysis. The procedure must rely heavily on *pre-reading* and use the workshop for *debate and calibration*, not data gathering. I need to emphasize that the data must be pre-loaded.
      *   *Correction on Importance:* The user specifically hates adding QALYs to "alignment units." The solution is *Ordinal Ranking within a Portfolio*. Don't ask "How many QALYs?" Ask "Is this top 10% of opportunities we've seen this year?"

  7.  **Finalizing the Procedure Structure:**

      *   **Pre-Work:** Mandatory 1-pager.
      *   **Hour 1: Diagnostics (Facts).** Tractability Type, Neglect Reason, Impact Scale.
      *   **Hour 2: Synthesis (Values).** Risk profile, Portfolio fit, Decision.
      *   **The Handoff:** Explicitly stated.

  8.  **Drafting the Content (incorporating specific constraints):**

      *   *Neglectedness:* Introduce the "Barrier Diagnostic."
      *   *Importance:* Introduce "Magnitude Bracketing."
      *   *Tractability:* Introduce "Pathway Classification."
      *   *Test Cases:* Walk through step-by-step.

  9.  **Review against constraints:**
      *   3 people, no stats? Yes, qualitative heuristics.
      *   2-hour slot? Yes, timed sections.
      *   Defensible call? Yes, based on documented diagnostics.
      *   Handles the 3 specific failure modes? Yes, built into the steps.
      *   Test cases included? Yes.

  10. **Final Polish:** Ensure the distinction between "Fact" and "Value" is sharp. The facts are the diagnostics; the value is the risk tolerance applied to those diagnostics.

  *(Self-Correction during drafting)*: I initially thought about scoring 1-10. The user hates spreadsheets/vibes. I should move towards *Classifications* (e.g., Class A, B, C) rather than scores. This reduces false precision. Let's use "Profiles."

  *Revised Plan:*
  1.  **Pre-Work:** Data gathering.
  2.  **Session Part 1 (Facts):** The Three Diagnostics.
  3.  **Session Part 2 (Values):** The Risk/Portfolio Call.
  4.  **Test Cases.**

