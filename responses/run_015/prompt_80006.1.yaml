answer: |-
  Here is a decision procedure designed for your constraints: three non-statisticians, a two-hour hard stop, and a need to defend the decision without false precision.

  This protocol replaces "scoring" with **classification**. You are not calculating a number; you are identifying the *profile* of the cause so you can apply the correct risk tolerance.

  ### The "ITN-Diagnostic" Protocol
  **Time:** 120 Minutes
  **Participants:** 3 Analysts + 1 Facilitator (can be one of the analysts)
  **Pre-Work:** The proposer must submit a 2-page brief answering the "Pre-Work Questions" below. If they don't, the workshop is cancelled.

  ---

  ### Part 1: The Fact-Finding Diagnostics (60 Minutes)
  *Goal: Establish the empirical profile. No discussion of "should we fund" yet.*

  #### Step 1: Tractability Pathway Classification (20 mins)
  **Question:** Is this an **Action Intervention** or a **Knowledge Bet**?
  *   **Action Intervention:** The mechanism is known (e.g., bed nets, lobbying, direct cash). The uncertainty is *implementation*.
  *   **Knowledge Bet:** The mechanism is theoretical (e.g., new AI alignment math, bio-risk surveillance tech). The uncertainty is *discovery*.

  **Sufficient Answer:**
  *   **If Action:** We must see a "Last Mile" plan. Who does what, where, by when?
  *   **If Knowledge:** We must see a "Failure Mode." If the research fails, what specifically do we learn that prevents future waste? (If the answer is "we just know it didn't work," it is a bad Knowledge Bet).

  **Stop Condition:** If it claims to be Action but has no implementation plan, or claims to be Knowledge but has no defined failure mode, **classify as "Undefined."** This triggers an automatic *Pass* unless the proposer can clarify within 48 hours.

  #### Step 2: The Neglectedness Autopsy (25 mins)
  **Question:** *Why* is the room empty? Do not count heads. Identify the barrier.
  Choose one of the three **Neglect Profiles**:
  1.  **Profile Invisible:** Nobody sees the problem. (Rare).
  2.  **Profile Stigma:** People see it, but touching it carries reputational/social cost.
  3.  **Profile Hardness:** Experts see it, tried to work on it, and hit a technical wall.

  **Sufficient Answer:**
  *   **To claim Invisible:** Show search traffic data or survey data of relevant experts unaware of the issue.
  *   **To claim Stigma:** Identify the specific social cost (e.g., "donors find this distasteful," "governments classify this").
  *   **To claim Hardness:** **Crucial Step.** You must identify *who* tried and failed. If you cannot name a specific lab, organization, or field that abandoned this, you cannot claim Hardness. You must default to Invisible.

  **Failure Mode Catch:** If you classify as **Profile Hardness**, you must acknowledge that "Neglectedness" is not an advantage here; it is a warning sign. Do not score this as a positive.

  #### Step 3: Importance Bracketing (15 mins)
  **Question:** What is the magnitude class? Do not convert units.
  Compare the *best-case successful outcome* to three anchors:
  *   **Anchor A (Local):** Impact equivalent to a strong local charity (e.g., $1M in economic value / 1,000 QALYs).
  *   **Anchor B (National):** Impact equivalent to a major policy change (e.g., $1B value / 100k QALYs).
  *   **Anchor C (Global/Existential):** Impact equivalent to preventing a pandemic or AI catastrophe.

  **Sufficient Answer:**
  *   Place the cause in **Bracket A, B, or C**.
  *   If the proposal uses abstract units (e.g., "units of alignment"), you must ask: "If this succeeds, does it prevent a catastrophe (C), change policy (B), or help specific people (A)?"
  *   **Rule:** You cannot compare Bracket C to Bracket A using math. They are different portfolios.

  ---

  ### Part 2: The Value Handoff & Decision (60 Minutes)
  *Goal: Apply client values to the empirical profile.*

  #### Step 4: The Handoff Point (Explicit Boundary)
  **Facilitator Statement:** "We have established the Profile. We now stop discussing facts and start discussing risk tolerance. This is where the client's mandate dictates the call."

  *   **Fact:** "This is a Knowledge Bet with Profile Hardness neglect and Bracket C importance."
  *   **Value:** "Does our client want to fund high-risk research or reliable interventions?"

  #### Step 5: The Decision Matrix (45 mins)
  Match your Profile from Part 1 to the Decision Rules below.

  | Tractability | Neglect Profile | Importance Bracket | Default Recommendation | Condition to Override |
  | :--- | :--- | :--- | :--- | :--- |
  | **Action** | Invisible | A or B | **Fund** | If implementation plan is weak. |
  | **Action** | Stigma | A or B | **Fund w/ Reservations** | If stigma threatens sustainability (see Case 2). |
  | **Action** | Hardness | Any | **Pass** | Unless you have unique insider access to solve the wall. |
  | **Knowledge** | Invisible | C | **Fund w/ Reservations** | Treat as option value. |
  | **Knowledge** | Hardness | C | **Pass** | Unless the "Failure Mode" yields high learning value. |
  | **Knowledge** | Any | A or B | **Pass** | Research should target high-leverage problems only. |

  **Discussion:**
  1.  Does this profile match our client's risk mandate?
  2.  **For Stigma:** Will our funding remove the stigma? If yes, the "Neglectedness advantage" decays. Adjust recommendation to *Pass* unless anonymity is guaranteed.
  3.  **For Knowledge:** Are we paying for the *solution* or the *information*? If the information value is low, *Pass*.

  #### Step 6: Final Call & Defense Prep (15 mins)
  Draft the "Because Statement." You are not allowed to use scores. You must use the Profile.
  *   *Bad:* "We scored it 8/10 on importance."
  *   *Good:* "We classified this as a Knowledge Bet with Global Importance. We recommend Fund-with-Reservations because the Neglect is due to Hardness, meaning success is uncertain, but the option value justifies the cost."

  ---

  ### Test Run: Case 1 (AI Safety Research)

  **Proposal:** Two-year theory program on high-tail-risk AI safety.
  **Team:** 3 Analysts.

  **Part 1: Diagnostics**
  1.  **Tractability:** **Knowledge Bet.** Next step is theory.
      *   *Failure Mode Check:* If theory fails, do we know *why*?
      *   *Finding:* Yes, we will know which mathematical approaches don't constrain the model.
  2.  **Neglectedness:** **Profile Hardness.**
      *   *Check:* Who tried?
      *   *Finding:* Major labs looked at this, found the math too immature, shifted to empirical work.
      *   *Protocol Action:* Do not count this as a "Neglectedness Bonus." Mark as "High Barrier."
  3.  **Importance:** **Bracket C (Global/Existential).**
      *   *Check:* Can we quantify?
      *   *Finding:* No QALYs. But if it works, it prevents catastrophe. That is Bracket C.

  **Part 2: Decision**
  *   **Matrix Match:** Knowledge / Hardness / Bracket C.
  *   **Default:** **Pass** (per matrix).
  *   **Override Discussion:** The "Failure Mode" yields high learning value (we stop others from wasting money on this theory).
  *   **Value Handoff:** Client accepts research risk? Yes.
  *   **Final Call:** **Fund-with-Reservations.**
  *   **Defense Statement:** "This is not an expected-value intervention. It is a research bet on a Hardness-profile problem. We are funding it for the information value to rule out dead ends, not because we expect a guaranteed solution. Importance is Bracket C, but probability is low."

  *Result:* The procedure prevented you from hyping the "Neglectedness" (since it was actually Hardness) and prevented you from faking QALYs. It framed the funding correctly as buying information, not buying safety.

  ---

  ### Test Run: Case 2 (Stigmatized Cause)

  **Proposal:** Support for a marginalized group that is culturally embarrassing to donors.
  **Team:** 3 Analysts.

  **Part 1: Diagnostics**
  1.  **Tractability:** **Action Intervention.**
      *   *Last Mile:* Direct grants to community orgs. Clear plan.
  2.  **Neglectedness:** **Profile Stigma.**
      *   *Check:* What is the cost?
      *   *Finding:* Donors fear bad press.
      *   *Protocol Action:* **Decay Check.** If we fund this publicly, does the stigma vanish?
      *   *Finding:* Yes. If a major consultancy funds it, it becomes "legitimate," other donors rush in, the "neglectedness advantage" disappears in 6 months.
  3.  **Importance:** **Bracket A (Local/Regional).**
      *   *Check:* Scale.
      *   *Finding:* Helps thousands, not millions.

  **Part 2: Decision**
  *   **Matrix Match:** Action / Stigma / Bracket A.
  *   **Default:** **Fund w/ Reservations.**
  *   **Override Discussion:** The "Decay Check" failed. The advantage of this cause is that it is cheap *now* because no one else is there. Once we enter, it gets expensive/crowded.
  *   **Value Handoff:** Is the client willing to fund anonymously?
      *   *If Yes:* **Fund.** (Stigma remains for others, we get the advantage).
      *   *If No:* **Pass.** (We lose the neglectedness advantage immediately).
  *   **Final Call:** **Pass** (Assuming client wants public credit).
  *   **Defense Statement:** "While the need is real, the 'Neglectedness' is a temporary market inefficiency caused by stigma. Our public entry corrects that inefficiency immediately, removing the cost-advantage. Unless we can fund anonymously, the capital efficiency does not hold."

  *Result:* The procedure caught the "Decaying Score" problem. It forced you to realize that your own success kills the thesis of the investment.

  ### Implementation Tips for Your Team

  1.  **The "Hardness" Burden of Proof:** Make it a rule that the *proposer* must prove why experts failed. If they say "experts are blind," ask for evidence. If they can't provide it, assume the experts are right and the problem is Hard.
  2.  **No Averaging:** Do not average your three scores. If Analyst 1 says "Bracket C" and Analyst 2 says "Bracket A," you do not have a Bracket B. You have a disagreement on facts. Resolve the fact before moving to Part 2.
  3.  **The "Because" Constraint:** In the client meeting, you are forbidden from showing the spreadsheet. You are only allowed to read the "Defense Statement" from Step 6. This forces you to ensure the logic holds up without hiding behind numbers.
