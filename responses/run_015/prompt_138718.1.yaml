  3.  **Evaluate the Current Principle:**
      *   *Principle:* "The amount of her in you is the fraction of your dispositions that a complete causal-explanatory story of you couldn't account for without adverting to her."
      *   *Critique:* This is essentially an "Explanatory Indispensability" argument.
      *   *Why it fails Case 8 (AI):* To explain the AI's output, you *do* have to advert to her (training data). So the principle says "Yes," but the intuition says "No."
      *   *Why it fails Case 2 (Biographer):* To explain the Biographer's accuracy, you advert to her letters. Principle says "Yes," intuition says "No."
