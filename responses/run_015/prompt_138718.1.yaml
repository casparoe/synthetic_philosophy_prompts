      *   *Check Case 5 (Split).* The user wants to say she is in *both*. This suggests a *distributed identity* view. I need to make sure the principle allows for non-unique instantiation.
      *   *The "Flaw":* The user's current principle focuses on *explanation* (storytelling). The fix should focus on *construction* (architecture). The Biographer explains Ilse but isn't built by her. The Husband is built by her.
