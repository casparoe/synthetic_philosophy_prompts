      *   The distinction between (5) and standard identity is about *branching*.
      *   *Hofstadter's View:* "Soul-shards." It's about the complexity of the internal model one person holds of another.
      *   *Proposed Principle:* **Constitutive Causal Integration.**
          *   "Her" exists in another system to the extent that her causal influence was *constitutive* of that system's current operational structure *while that system was developing*, not just referenced as data.
          *   It requires *feedback loops* during life.
          *   It distinguishes between *having a model of X* (Biographer/AI) and *being shaped by X* (Husband/Student).
