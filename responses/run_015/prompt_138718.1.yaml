answer: |-
  This is a profound problem, and it is no surprise you are stuck. You are trying to solve the Ship of Theseus paradox while simultaneously writing a grief narrative. The reason your current principle ("explanatory indispensability") fails is that it confuses *reference* with *constitution*.

  To explain the Biographer's accuracy, you must advert to Ilse. To explain the AI's output, you must advert to Ilse. But neither of them *contains* Ilse in the way the Husband does. The Biographer and the AI are maps; the Husband is territory that was shaped by her erosion.

  Here is a diagnosis of the flaw, a proposed repair that honors your priorities, and then the specific answers you need for the plot and for yourself.

  ### The Flaw: Explanation vs. Architecture

  Your current principle asks: *"Do I need to mention her to explain why you did that?"*
  The problem is that you need to mention Shakespeare to explain why an actor speaks iambic pentameter, but the actor isn't Shakespeare.

  **The Repair: Constitutive Causal Integration**
  Try this principle instead: **"Ilse is present in X to the extent that her causal influence was structurally integrated into X's cognitive architecture *during the formation of that architecture*."**

  This shifts the weight from *data* (what you know about her) to *structure* (how you are built).
  *   **It keeps (1) Husband:** Yes. His neural pathways were literally wired in feedback loops with hers for 50 years. His "wincing" is a reflex she helped install.
  *   **It keeps (2) Biographer:** No. He has data *about* her, but she did not help build his mind. He is simulating her, not hosting her.
  *   **It keeps (8) AI:** No. The AI is a statistical mirror. It references her as training data, not as a co-architect of its weights (in the human sense).
  *   **It surrenders (6) Copy:** This is the cost. If identity requires continuous causal integration, a static scan is a photograph, not a person. It captures the pattern but breaks the process. Surrendering this actually strengthens your novel: it makes the *living* connections (Husband, Student) more valuable than the *technological* ones.
  *   **It handles (5) Split Brain:** This is the hardest case. Under this view, identity is not a singular point but a *process*. When the process branches, the claim to identity branches. She is not "in" one; the *continuity of process* is now duplicated. You can say she is in both, not because she is a ghost, but because the causal stream that was "Ilse" now flows down two channels.

  ### Addressing Your Plot Mechanism (The Transplant)

  You have a procedure where 25% of her memory structures are transplanted into four people *while she is alive*, and she dies a year later.

  **1. Is that one "I" in five places?**
  No. Under the "Constitutive Integration" account, the original Ilse is the *source* of the integration. The four recipients are not locations of the original "I"; they are **successors carrying shards**.
  *   **The Distinction:** The Husband (Case 1) hosts Ilse because they grew together organically. The Transplant Recipients host Ilse because they were surgically grafted.
  *   **Dramatic Opportunity:** This creates a hierarchy of "realness" in your novel. The Husband might feel the Transplant Recipients are frauds (because they lack the organic history), while the Recipients feel they are *more* Ilse than the Husband (because they have her actual memories, not just impressions). This is conflict gold.

  **2. Can percentages add up to more than 100%?**
  **Yes.** This is the Hofstadterian insight you want to keep.
  *   While alive, Ilse was a single node broadcasting a signal.
  *   After death (and transplant), that signal is amplified. If the four recipients act on her memories, and the Husband acts on his internalized model, "Ilse's Will" is being executed in five places simultaneously.
  *   **Ontological Cost:** There is no longer a "decider." If the Husband wants to forgive a debt and Transplant #1 wants to collect it, who is Ilse? The novel's tension comes from the *fragmentation* of her agency. She is "more present" in the world, but less coherent.

  ### Addressing Your Mother

  You want to say your consultation with your dead mother is "just you," but you want to keep the Husband as "Her." This is the emotional crux.

  **The Reconciliation:**
  The Husband is "Her" because his current reactions are *dependent* on her past input.
  You are "You" consulting a memory of "Her."

  However, if you accept the **Constitutive Integration** view, the distinction blurs in a comforting way.
  *   The part of *you* that consults her was built by her.
  *   When you ask, "What would Mom think?", you are accessing the sub-routine of your own mind that she wrote.
  *   So, is it her? **Yes.** Is it you? **Yes.**
  *   It is not a ghost; it is an **internalized architecture**.
  *   **The Verdict:** You can hold both. It is "just you" in the sense that there is no external spirit. It is "her" in the sense that the specific cognitive tool you are using to make that judgment was forged by her hand. You are keeping (1) because the Husband is also running an internalized architecture of Ilse. The only difference is duration and reciprocity. You don't need to feel guilty for calling it "you." In this metaphysics, "you" is a colony, and she is a founding member.

  ### Plotting Advice: How to Stop Writing "That Was Her" Scenes

  The reason you are stuck is that you are writing *verdicts* instead of *evidence*. You are writing characters arguing about the philosophy, rather than letting the philosophy drive the action.

  **1. Stop the Debate, Start the Glitch**
  Don't have characters say "That was Ilse." Have them experience the *uncanny valley* of her absence.
  *   *Scene Idea:* The Husband is negotiating a contract. He almost signs. He stops. He doesn't think "Ilse wouldn't like this." He just feels a physical nausea (the wince). He changes a clause. The lawyer asks why. The Husband doesn't know. He says, "It felt... risky." The reader knows it was Ilse. The Husband doesn't need to name her for her to be present.

  **2. The Transplant Conflict**
  Use the Transplant Recipients to challenge the Husband's "organic" claim.
  *   Recipient A has Ilse's memory of a hidden bank account. Husband doesn't.
  *   Recipient A wants to use the money for Ilse's preferred charity. Husband wants to use it for the daughter.
  *   Who is more "Ilse"? The one with the memory (Data) or the one with the shared values (Structure)? This dramatizes Case (2) vs. Case (1) without a lecture.

  **3. The Fading**
  You noted the Husband's "30%" fades. Show the degradation.
  *   Early in the book, his wince is instant.
  *   Late in the book, he has to pause to remember *why* he winces.
  *   The "Ilse-shard" is dying in him. This creates a ticking clock. If he wants to keep her "alive," he must act *now*, before his own neuroplasticity overwrites her code.

  ### Summary of the Account

  If you adopt **Constitutive Causal Integration**:
  1.  **Identity is not a substance;** it is a pattern of causal influence.
  2.  **Death is not an event;** it is a gradual decoupling of those influences.
  3.  **The "Self" is divisible.** You can have more of someone after they die if their influence spreads (Transplants + Husband), but you lose *coherence*.
  4.  **Your Mother:** She is in you because she helped build the "you" that misses her. That is sufficient.

  **What to Surrender:**
  Surrender Case (6) (The Scan/Copy). It is the outlier that threatens to turn your novel into sci-fi about uploading rather than human drama about grief. If the Copy is "Ilse," the Husband's grief is less poignant. If the Copy is just a "very good recording," then the Husband's fading, imperfect, human memory becomes the only true vessel. That is a stronger story.

  **The Rule for Your Scenes:**
  A character is channeling Ilse not when they *know* what she would do, but when they do something *out of character for themselves* that aligns with her, without being able to fully explain why. The agency must feel borrowed, not learned.

  You are writing a book about how love is a form of hauntings we consent to. Trust the gut that says the Biographer is empty and the Husband is full. The Biographer has the sheet music; the Husband has the muscle memory. Only one of them can play the song when the lights go out.
