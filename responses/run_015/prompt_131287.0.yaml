    "top_three": [
      "Does tail risk invalidate average-case guarantees for existential stakes?",
      "How do we justify safety claims without exhaustive empirical testing?",
      "Who defines the deployment distribution, and how is that governance enforced?"
    ],
    "parked": [
      {
        "question": "Can runtime monitors (seatbelts) provide robust safety without full verification?",
        "why_not": "This is an engineering solution dependent on the upstream epistemological and tail-risk questions; solve those first."
      },
      {
        "question": "Does modeling a bounded adversary make worst-case guarantees tractable?",
        "why_not": "Too mathematically dense for your constraints and crowded by professional security researchers."
      }
    ],
    "framing_verdict": "Worst-case vs. average-case is a useful heuristic, but the real frame is 'Verifiable Properties vs. Empirical Performance.' You are asking how we know what we know.",
    "biggest_missing_question": "How do we justify safety claims without exhaustive empirical testing?",
    "confidence": "Medium; I am unsure how quickly regulatory frameworks will evolve to value process-based safety cases over technical benchmarks."
  }
  ```

  ### Reasoning Summary

  **Rank 1 (Tail Dominance):** This is the keystone. If average-case guarantees collapse under existential stakes (because the "average" hides a fatal tail), then half the safety research landscape is misaligned. You can analyze this using probability theory you already know (expectation vs. high-probability bounds) without needing compute. If you conclude tails dominate, you force the field to abandon standard ML metrics for safety. This is upstream of everything because it dictates whether "safe on average" is ever an acceptable slogan.

  **Rank 2 (Epistemology of Claims):** I added this because it is the most tractable high-impact question for a writer. We cannot test AGI exhaustively. So how do we accept a safety claim? Is it a mathematical proof, a process audit, or a red-team report? This is "wide open" because technical researchers often ignore the philosophy of validation. Settling this changes what regulators accept as evidence. It pairs with Rank 1: if tails dominate, you need stronger epistemic standards than standard testing.

  **Rank 3 (Politics of Distribution):** This leverages your logistics background. Defining the "deployment distribution" is a process engineering problem, not just a math problem. Who signs off on the envelope? This is crowded in policy circles but under-explored by technical safety writers. It is downstream of Rank 1 (if tails matter, the envelope must be wider) but highly actionable for you.

  **Parked Questions:** I moved "Seatbelts" and "Bounded Adversary" to the bottom. Seatbelts are a specific mitigation strategy; they don't make sense until you know if tails dominate (Rank 1) or what counts as evidence (Rank 2). Bounded Adversary is too technical; formal security modeling requires math beyond basic probability and is already heavily staffed by security experts. Your marginal contribution there is low.

  **Framing Verdict:** Your worst-case/average-case frame is correct but incomplete. It assumes the property being guaranteed is clear. The deeper issue is epistemic: how do we *know* the guarantee holds? shifting your focus to "Safety Case Epistemology" (Rank 2) will make your writing more unique than rehashing the tail risk debate.

  **Confidence:** Medium. The landscape shifts fast. If a major lab releases a verified "safe" model next year, Rank 2 becomes less critical. If a catastrophe occurs due to tail risk, Rank 1 becomes obvious. Your best bet is the epistemological angle—it remains relevant regardless of technical breakthroughs.
