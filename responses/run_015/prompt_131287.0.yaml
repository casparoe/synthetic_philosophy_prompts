answer: |-
  Your framing is sharp, but slightly conflates statistical expectation with high-probability bounds. Average-case safety usually means "safe with probability 1-δ," not just "low expected loss." However, your intuition on tail dominance is correct for existential risk: if the tail is unbounded, expectation breaks. Below is the ranking based on leverage, tractability for a non-technical writer, and upstream impact.

  | rank | question | upstream_of | tractability_for_me | crowdedness | if_settled_what_changes | would_move_me |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Does tail risk invalidate average-case guarantees for existential stakes? | Rows 2, 3, 4 | Yes; conceptual math requires no compute, only logic. | Moderate | Builders stop optimizing mean performance; regulators demand tail bounds. | Proof that neural nets have bounded loss distributions in high dimensions. |
  | 2 | How do we justify safety claims without exhaustive empirical testing? | Rows 3, 4 | Yes; relies on philosophy of science and process auditing. | Wide open | Shifts focus from "proof" to "argumentation standards" for auditors. | A major lab publishes a safety case framework that gains regulatory traction. |
  | 3 | Who defines the deployment distribution, and how is that governance enforced? | Row 4 | Yes; logistics background applies directly to process design. | Crowded | Policy shifts from technical specs to certification processes. | A government agency mandates specific distribution disclosures for models. |
  | 4 | Can runtime monitors (seatbelts) provide robust safety without full verification? | None | Maybe; requires understanding system architecture limits. | Crowded | Engineers build interruptible systems; regulators accept monitoring as compliance. | A monitor successfully catches a catastrophic failure in a deployed frontier model. |
  | 5 | Does modeling a bounded adversary make worst-case guarantees tractable? | None | No; requires game theory and security formalism beyond basic probability. | Crowded | Security budgets adjust; safety cases incorporate threat models. | A formal proof shows bounded adversaries cannot exploit specific model classes. |

