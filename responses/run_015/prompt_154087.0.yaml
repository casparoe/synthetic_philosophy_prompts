      4.  *Pareto/VNM Compatibility:* Does this break standard decision theory axioms?
      5.  *Temporal Non-Fusion:* If I trade off my future self, is that aggregation? (Parfitian reductionism).
      6.  *Action Guidance:* Does this actually tell me what to do differently than Total Utilitarianism?
      7.  *The "Hope Nobody Asks" (Motivated Cognition):* Is this just rationalizing partiality?
      8.  *Harsanyi/Impartiality:* Does this violate the veil of ignorance setup?
      9.  *The Concession:* Need to identify the weakest link to admit upfront.

