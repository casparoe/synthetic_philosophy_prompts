answer: |-
  # Q&A Prep Sheet: Aggregation as a Parameter
  **Audience:** LW/EA/Rationalist (Consequentialist, Reductionist, EV-literate)
  **Thesis:** Separateness-of-persons is a structural "non-fusion" parameter, not a binary blocker.
  **Constraint:** 90-second replies. No Kantian/Rights language.

  ---

  ### 1. The Calibration Problem (The "Do the Numbers Count" Variant)
  **Probability:** High | **Damage:** High
  **The Objection:** "If aggregation is a scalar parameter rather than a binary switch, how do we set the value? If it's derived from intuition, you've just formalized bias. If it's derived from axioms, which axioms allow a rate between 0 and 1 without violating VNM or Pareto? This looks like Prioritarianism with extra steps, but without a clear justification for the discount function."

  **The Reply:** "You're right that the *value* of the parameter isn't fixed by the metaphysics of non-fusion alone. But that's a feature, not a bug. We don't treat risk-aversion in financial portfolios as a moral failing; we treat it as a structural constraint on utility transfer. The 'non-fusion' claim is that utility transfers across distinct loci of agency have a transaction cost that transfers within a locus do not. The specific rate is an empirical question about the degree of integration between loci. It's not Prioritarianism, because the discount applies to the *relation between beneficiaries*, not the absolute level of welfare. We set the rate by looking at cases where our aggregation intuitions are stable—like fission cases—and extrapolating."
  **Soft Spot:** I don't have a closed-form equation for setting the rate. If pressed on *how* to calculate it for policy, I have to fall back on "reflective equilibrium," which this audience hates.

  ### 2. The Longtermist Crunch (Astronomical Waste)
  **Probability:** High | **Damage:** High
  **The Objection:** "Total Utilitarianism drives the x-risk calculus. If you introduce a substitution rate < 1 across persons, the value of the future drops precipitously. Does your view survive the 'Astronomical Waste' argument? If we discount across the trillions of potential future lives because they are distinct loci, do we lose the imperative to prevent extinction? It seems like your parameter collapses the longtermist project."

  **The Reply:** "It compresses the value, but it doesn't zero it out. The parameter is about the *substitution rate*, not the *existence value*. Even with a discount on aggregation, a future with trillions of flourishing loci still dominates a future with zero, provided the rate isn't zero. However, you are correct that it weakens the 'maximize population' imperative in favor of 'secure the conditions for agency.' It shifts the focus from total hedonic sum to the preservation of the *capacity* for valued experience. It makes x-risk slightly less about saving specific future people and more about preserving the locus of civilization itself."
  **Soft Spot:** If the rate is significantly less than 1, the math on existential risk *does* change enough to alter prioritization (e.g., away from pure population growth). I need to be careful not to concede that longtermism dies, but I can't promise the EV calculations stay identical.

  ### 3. The "Loci" Definition (Persons by Another Name)
  **Probability:** High | **Damage:** Medium
  **The Objection:** "You claim 'persons' are just a proxy for 'loci of agency.' But in practice, how do you individuate a locus without referencing personhood? If I have a brain implant that links my decision-making to yours, do we become one locus? If not, your 'non-fusion' property just tracks biological or psychological continuity, which is exactly what the Reductionist view says is morally irrelevant. You haven't escaped the person-counting problem; you've just renamed it."

  **The Reply:** "The distinction is functional, not biological. A 'locus' is defined by the capacity to internalize trade-offs. I can trade my pain today for my gain tomorrow without coercion; I cannot trade your pain for my gain without a coercive mechanism. That structural asymmetry is the non-fusion. In fission cases, where psychological continuity splits, we see the friction appear *within* what was one person. So 'person' is a heuristic for 'high-integration locus,' but the moral weight lies on the integration, not the heuristic. We can imagine gradual merging of loci, which the person-view forbids."
  **Soft Spot:** In the real world, loci map almost 1:1 to persons. If the edge cases (fission, conjoined twins, severe dementia) are the only place the views diverge, the practical difference is negligible.

  ### 4. Time Consistency & Reductionism
  **Probability:** Medium | **Damage:** Medium
  **The Objection:** "You mention temporal stages. If I'm a Reductionist about personal identity (Parfit-style), the relation between me-now and me-in-ten-years is relevantly similar to the relation between me and a stranger. If non-fusion applies there, you're endorsing hyperbolic discounting of your own future. How do you avoid making the view diachronically inconsistent? Are you arguing for a higher substitution rate within a life, and if so, isn't that arbitrary?"

  **The Reply:** "I'm arguing the substitution rate is *higher* within a life, not 1. There is still non-fusion between temporal stages—I cannot fully internalize my future self's pain now. But the causal coupling and memory integration create a lower transaction cost than between distinct agents. This isn't arbitrary; it's proportional to the degree of psychological connectedness. It avoids inconsistency by acknowledging that 'I' am a temporally extended chain of loci, not a point. It justifies saving for retirement without justifying forcing *you* to pay for it."
  **Soft Spot:** This leans heavily on "psychological connectedness," which the audience knows is a gradient. If it's a gradient, why is the moral difference between 'low connection stranger' and 'low connection future self' so sharp in practice?

  ### 5. Pareto Efficiency Violations
  **Probability:** Medium | **Damage:** High
  **The Objection:** "Standard welfare economics says if you can make someone better off without making anyone worse off, you do it. If your substitution rate allows you to reject a trade that increases total utility because the loss is concentrated in one locus, aren't you violating Weak Pareto? If two people prefer the aggregated outcome, but your parameter forbids it, whose preferences are you respecting?"

  **The Reply:** "I am not violating Pareto on *preferences*; I am challenging the aggregation of *utility*. If the agents are distinct loci, there is no 'group preference' until we define the aggregation function. If I say 'no' to sacrificing one to save two, I am not violating the preferences of the two; I am asserting that their gains do not sum to a quantity large enough to override the structural constraint of the one. The view treats the 'separateness' as a constraint on the feasible set of moral actions, similar to how rights function in deontology, but derived from the metaphysics of agency."
  **Soft Spot:** This sounds suspiciously like rule-consequentialism or rights-talk, which the audience explicitly said they have no appetite for. I risk sounding like I'm smuggling deontology in via "structural constraints."

  ### 6. Action Guidance / Complexity Penalty
  **Probability:** Medium | **Damage:** Medium
  **The Objection:** "Even if this is metaphysically sound, what is the cash value? Total Utilitarianism gives a clear maximization target. Your view gives a parameter we can't measure and a definition of 'loci' we can't easily map. In a high-stakes EA context, doesn't the complexity penalty of your view outweigh the theoretical precision? Why shouldn't we just use Total Utilitarianism as a heuristic?"

  **The Reply:** "The cash value is in avoiding catastrophic moral errors driven by 'utility monster' scenarios. If you treat aggregation as absolute, you justify atrocities for marginal gains in the long-term future. My view acts as a circuit breaker. It's not for every decision; it's for high-stakes distributional conflicts. Use Total Utilitarianism for 'how many bednets,' but use the Parameter View for 'do we sacrifice this minority for the majority.' It's a domain-specific correction, not a replacement for EV calculus everywhere."
  **Soft Spot:** This concedes that for 90% of EA work (global health, AI safety probability), the view changes nothing. It risks making the theory practically inert.

  ### 7. The "Hope Nobody Asks" (Motivated Cognition)
  **Probability:** Low | **Damage:** Catastrophic
  **The Objection:** "Isn't this just a sophisticated rationalization for partiality? You've spent fifteen years in rationalist circles training yourself to override intuition. Now you're building a formal model to justify the intuition you were supposed to override. The 'non-fusion' parameter looks exactly like a post-hoc justification for why you don't want to give away all your money to strangers. Is this theory driving the conclusion, or is your desire to keep your boundaries driving the theory?"

  **The Reply:** "That is a valid genealogical critique. However, the existence of a bias doesn't falsify the argument. The 'non-fusion' claim is structural: goods *do not* fuse. That is an ontological claim, not a preference. If I discover I have a bias against aggregation, but the ontology supports a parameterized view, the bias might have been a heuristic signal for a real structural feature. I'm asking you to evaluate the fission and replacement cases on their merits. If the structure holds there, where your self-interest isn't at stake, the parameter is real, regardless of why I noticed it."
  **Soft Spot:** This is the hardest hit. If the audience decides I'm just "doing philosophy to stop the trolley," I lose credibility. I cannot prove my motives, only the coherence of the model.

  ### 8. Harsanyi & The Veil of Ignorance
  **Probability:** Low | **Damage:** Medium
  **The Objection:** "Harsanyi's Aggregation Theorem derives utilitarianism from rational preferences behind a veil of ignorance. If you assume rational agents would choose your parameterized view behind the veil, you need to show why. If they don't know which locus they are, wouldn't they maximize expected utility by choosing Total Utilitarianism? Your view seems to require agents behind the veil to care about the *distribution* of utility, not just their own expected share."

  **The Reply:** "Harsanyi assumes VNM rationality applies to the *observer*. My claim is that VNM applies to the *locus*. Behind the veil, if I know I will be exactly one locus, and I know goods do not fuse across loci, I should not value a world where my utility is averaged out against others' unless the compensation rate meets my threshold. The veil doesn't erase the non-fusion; it just hides which locus I am. Rational self-interest behind the veil supports a parameterized aggregation if the risk of being the sacrificed locus is weighted by the non-fusion constraint."
  **Soft Spot:** This is a technical fight about decision theory. If they know Harsanyi better than I do, they will point out that VNM axioms force linearity. I am essentially arguing against VNM linearity in moral contexts.

  ---

  ### Strategic Concession (Say this in the talk)
  **The Concession:** "I must concede that this view does not provide a unique, algorithmically computable value for the substitution rate. If you are looking for a formula that outputs the correct moral action given a spreadsheet of utilities, this is not it. This view is a constraint on the *class* of acceptable aggregation functions, not a selector of a single function. It tells you that Rate=1 (Total Utilitarianism) is a special case, not the default."
  **Why:** Pre-empts Objection #1 (Calibration) and #6 (Action Guidance). It lowers the bar for success from "solve morality" to "fix the ontology."

  ### Stock Replies to Avoid
  *   **"It's about dignity."** (Audience will hear "magic." Use "structural integrity of agency" instead.)
  *   **"Intuitively, it feels wrong."** (Audience will hear "bias." Use "reflective equilibrium on fission cases" instead.)
  *   **"Rights constrain utility."** (Audience will hear "deontology." Use "transaction costs on utility transfer" instead.)
