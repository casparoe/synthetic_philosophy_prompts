answer: |-
  **Final Examination: Philosophy 490 — Wittgenstein and Hinge Epistemology**

  **Question 1 (25 Marks)**

  **Context:**
  In the unpublished manuscript *Hinges Without Privilege*, M. Sandoval argues that the distinction between "hinge commitments" and "ordinary empirical beliefs" collapses. Sandoval offers three reasons: (i) we acquire and abandon these commitments through testimony and social pressure just like empirical beliefs; (ii) the requirement that doubt needs something fixed is merely confirmation holism; and (iii) if a commitment can be morally or rationally criticized (e.g., excluding women's testimony), it was already in the space of reasons.

  Consider the following case: Two anthropologists spend twenty years living with a community where it stands fast that specific dreams reveal who will soon die. Both anthropologists eventually share this commitment. Anthropologist A describes her change as "revising a belief in light of long experience." Anthropologist B describes hers as "being converted."

  **Task:**
  Contemporary hinge epistemology faces a trilemma. It wants to maintain that:
  (a) Hinge commitments are genuinely distinct in kind from ordinary empirical beliefs (not just central beliefs);
  (b) Hinge commitments are nonetheless criticizable, allowing us to call historical changes in hinges rational improvements rather than mere replacements;
  (c) This view is not merely confirmation holism or foundationalist externalism relabeled.

  Write an essay of 1,200 to 1,500 words arguing that these three commitments cannot all be held simultaneously. You must explicitly choose which horn of the trilemma to give up. Defend this choice against the strongest version of the alternatives. You must state plainly what this choice costs your view, specifically regarding what it can say to the skeptic (is it an answer or a refusal?).

  In developing your argument, you are required to:
  1.  Use the **Two Anthropologists case** as a test for your position: Does your view treat A and B as describing the same phenomenon differently, or fundamentally different phenomena?
  2.  Address the **Acquisition Problem** (how we get hinges), **Generational Drift** (how hinges change over time), and the **Problem of Bad Hinges** (ideological certainties).
  3.  Avoid relying on specific remark numbers from *On Certainty* or naming secondary literature. Grade your argument on its structural moves, not its bibliography.

  ***

  **Model Answer (Approx. 700 words)**

  To resolve the trilemma, we must abandon horn (a): the claim that hinge commitments are distinct in kind from empirical beliefs. Retaining (b) and (c) is essential for a viable epistemology, but maintaining (a) renders the view incapable of explaining rational progress or learning. If hinges are arational scaffolding immune to evidence, we cannot explain how abandoning a bad hinge is an *improvement* rather than a collapse. By treating hinges as empirical beliefs with extreme centrality, we preserve the ability to criticize them without reducing the view to simple holism, because the "distinction" becomes pragmatic rather than ontological.

  Consider the Two Anthropologists case. If we insist on (a), Anthropologist B ("conversion") is describing the correct phenomenological shift, while A ("revision") is confused. Conversion implies a change in the rules of the game, whereas revision implies playing the game better. However, this distinction collapses under scrutiny. Both anthropologists underwent the same causal process: prolonged exposure to data (dreams followed by death) that overwhelmed their prior certainties. To call one "conversion" and the other "revision" based solely on the subject's description privileges first-person authority over third-person observation. If we drop (a), we see both as engaging in belief revision, but at a depth where the cost of changing the belief is the reorganization of a whole web of other beliefs. This explains the *feeling* of conversion without positing a magical category shift. It aligns with Sandoval's claim that acquisition and abandonment happen via testimony and pressure, mechanisms that operate on beliefs, not pre-rational conditions.

  Dropping (a) is necessary to address the Problem of Bad Hinges. If hinges are immune to evidence (horn a), then the historical certainty that enslaved people's testimony was inadmissible was not false, merely "different." We could not say the abolitionists were *right* and the slaveholders *wrong* in a rational sense; we could only say the framework changed. This is morally intolerable and epistemically sterile. By treating these certainties as empirical beliefs held with high confidence, we allow them to be subject to critique. The shift away from excluding testimony was a rational improvement because the old hinge failed to account for the evidence of human cognitive capacity. This satisfies horn (b): hinges are criticizable.

  Does this reduce the view to confirmation holism (violating horn c)? Not necessarily. Standard holism suggests any belief can be revised if we adjust others sufficiently. A hinge theory that drops (a) but keeps the *functional* role of certainties adds value by highlighting that some beliefs are *psychologically* immune to doubt for long periods, not logically immune. The distinction is one of degree and function, not kind. We are not relabeling holism; we are specifying the sociological and psychological inertia that makes certain beliefs act *as if* they were foundational, while denying they *are* foundational.

  The cost of this choice is significant regarding skepticism. If hinges are just very central empirical beliefs, they are fallible. This means we cannot offer the skeptic a guarantee that our world-picture is correct. We must admit that our rejection of skepticism rests on a commitment that could, in principle, be false. We do not answer the skeptic by showing skepticism is impossible; we refuse to play by showing that skepticism requires doubting what we cannot practically doubt. This is not a logical refutation but a pragmatic dissolution. We trade the security of arational certainty for the flexibility of rational critique.

  In conclusion, retaining the distinctness of hinges (a) protects the view from holism but kills its normative force. We cannot have a theory of rational improvement if the grounds of rationality are themselves immune to reason. By viewing hinges as central empirical beliefs, we explain the anthropologists' convergence as shared learning, validate the critique of ideological certainties as correction rather than replacement, and accept that our answer to skepticism is a refusal to engage rather than a victory. The cost is fallibilism all the way down, but that is the price of keeping inquiry open.

  ***

  **Marking Scheme (Total 25 Marks)**

  **1. Trilemma Adjudication (5 Marks)**
  *   **Requirement:** Explicitly identifies which horn (a, b, or c) is being dropped and argues why the three are incompatible.
  *   **Common Error:** Attempting to reconcile all three horns without acknowledging the tension, or dropping a horn without explaining the incompatibility.

  **2. Application of the Anthropologist Case (5 Marks)**
  *   **Requirement:** Uses the case to test the chosen view; explains whether "revision" and "conversion" are distinct phenomena or descriptions of the same process under the student's theory.
  *   **Common Error:** Treating the anthropologists' self-descriptions as obviously factually different without analyzing the underlying epistemic process.

  **3. Normative and Historical Dimensions (5 Marks)**
  *   **Requirement:** Addresses Acquisition, Drift, and Bad Hinges. Explains how the chosen view allows for rational critique of historical certainties (e.g., ideological hinges).
  *   **Common Error:** Collapsing the "criticizability" of hinges into the claim that they are merely central beliefs without addressing the normative cost.

  **4. The Skeptical Cost (5 Marks)**
  *   **Requirement:** Clearly states what the view loses regarding skepticism (e.g., no logical refutation, only pragmatic refusal) and defends whether this is acceptable.
  *   **Common Error:** Claiming the view still "solves" skepticism after dropping a horn that was necessary for that solution.

  **5. Argumentative Coherence and Defense (5 Marks)**
  *   **Requirement:** Defends the choice against the strongest alternative (e.g., if dropping (a), explains why keeping (a) is tempting but wrong). Structure is logical, not a list of points.
  *   **Common Error:** Presenting the essay as a survey of options rather than a sustained defense of a single adjudication.

  ***

  **Differentiation: A vs. B Answers**

  An **A answer** is distinguished by its synthesis of the Anthropologist case into the core argument rather than treating it as a separate example. The A student uses the case to *demonstrate* the trilemma (e.g., showing how keeping horn (a) makes the anthropologists' disagreement unresolvable). Furthermore, the A answer treats the "cost" regarding skepticism not as a weakness to be apologized for, but as a deliberate theoretical trade-off that strengthens the view's normative power. A **B answer** will typically tick the boxes of the prompt sequentially (Trilemma, then Case, then History, then Skepticism) without showing how the decision on the trilemma *drives* the interpretation of the case. The B answer often hedges on the trilemma, trying to keep two horns without fully sacrificing the third, resulting in a less decisive philosophical stance.
