answer: |-
  ### Pre-Draft Crux Mapping (Internal Working Notes)

  *   **Crux 1: The Unit of Moral Accounting.** Is the basic unit the *agent's act* (Restrictionist) or the *norm's instantiation* (Minimizer)? This drives the definition of "violation."
  *   **Crux 2: Complicity via Omission.** Does failing to prevent a violation make me responsible for that violation? Restrictionist says no (unless I promised protection); Minimizer says yes (if I could have prevented it at lower moral cost).
  *   **Crux 3: Aggregation.** Do risks and repetitions aggregate to override agent-relative constraints? Restrictionist says constraints apply per act/token; Minimizer says expected value or total counts matter.
  *   **Verbal/Moral hinge:** The word "violation." If it means "my transgression," Restrictionist wins by definition. If it means "breach of the moral law anywhere," Minimizer wins. The real fight is about whether *my transgression* is the only thing that matters morally.

  ***

  # JOINT STATEMENT ON THE PARAX OF DEONTOLOGY
  **Parties:** Agent-Relative Restrictionist (AR) & Violation-Minimizer (VM)
  **Status:** Adversarial Collaboration Draft 1

  ### 1. Claims We Both Accept

  1.  **The Standard Case Description:** In the canonical scenario, an agent can prevent five innocent deaths (caused by other agents or natural causes) only by intentionally killing one innocent person. Both parties agree that standard deontology forbids the killing, while consequentialism requires it.
  2.  **The Paradox Premise:** We agree the paradox arises only if one assumes that the *reason* for the restriction against killing is solely to minimize the occurrence of killings (or deaths). If the reason is something else (e.g., integrity, non-instrumentalization), the paradox dissolves.
  3.  **Distinctions Are Not Decisive Alone:** We agree that appealing merely to the doing/allowing distinction or the intention/foresight distinction does not resolve the paradox unless accompanied by an account of *why* those distinctions carry moral weight sufficient to outweigh the five deaths.
  4.  **Outcome Badness:** We agree that the deaths of the five are bad outcomes. The Restrictionist does not deny the badness of the deaths; she denies that minimizing outcome badness is the sole or primary determinant of moral rightness in this context.

  ### 2. Disagreements Table

  | Core Disagreement | Restrictionist Formulation (AR) | Minimizer Formulation (VM) | Classification |
  | :--- | :--- | :--- | :--- |
  | **Definition of "Violation"** | A violation is a token act wherein *I* transgress a duty binding on my agency. | A violation is any instance where the moral norm against killing is breached, regardless of who breaches it. | **Partly Verbal / Partly Moral.** Verbal: We are using "violation" to pick out different things (act-type vs. norm-instance). Moral: Whether *other agents' breaches* count as moral costs I must minimize. |
  | **Responsibility for Omissions** | I am not responsible for the five deaths caused by others; I am only responsible for my own refusal to kill. | By refusing to kill the one, I become causally and morally responsible for the five deaths I could have prevented. | **Moral.** Disagreement over the scope of moral responsibility regarding preventable harms caused by third parties. |
  | **Aggregation of Constraints** | My constraint against killing applies fully to each discrete choice I face; it does not dilute over time or probability. | Moral reasons aggregate. If I face the choice repeatedly or probabilistically, the weight of preventing violations accumulates against the constraint. | **Moral.** Disagreement over whether agent-relative constraints are sensitive to expected value or temporal summation. |

  ### 3. Crux Analysis & Test Cases

  For each real crux identified above, we propose a specific case where our predictions diverge. We agree these cases bear directly on the validity of our respective positions.

  #### Crux A: The Scope of Responsibility (The "Violations" Definition)
  *   **Test Case:** *The Probabilistic Disarmament* (formerly Coin-Flip Villain).
      *   **Setup:** A villain will murder five innocents if a fair coin lands Heads (50% chance). You can murder one innocent now to disarm the villain with certainty.
      *   **AR Prediction:** Forbidden. My intention to kill the one is direct and certain. The five deaths are merely probable and caused by the villain. I cannot commit a certain wrong to prevent a probable wrong caused by another.
      *   **VM Prediction:** Permitted (possibly Required). Expected violations: 2.5 deaths (if I abstain) vs. 1 death (if I act). Minimizing total norm-breaches requires intervention.
      *   **What Would Move Us:**
          *   **AR:** Would shift if the probability of the five deaths approached certainty (e.g., 99.9%), suggesting the "certainty" of my act is not the only weightable factor.
          *   **VM:** Would shift if the one killing required a specific mode of agency (e.g., direct physical violence vs. flipping a switch) that reintroduces a strong agent-relative cost.

  #### Crux B: Aggregation Over Time (The "Constraints" Durability)
  *   **Test Case:** *The Iterated Intervention* (formerly Whack-a-Mole).
      *   **Setup:** For five consecutive days, a fresh agent (or the same agent) faces the standard choice: kill one now or five die today. Universal abstention = 25 deaths. Daily intervention = 5 deaths (by agents).
      *   **AR Prediction:** Forbidden each day. Each day presents a new moral test. The fact that I (or my colleagues) killed yesterday does not license killing today. The total count of 25 vs. 5 is morally secondary to the integrity of each daily choice.
      *   **VM Prediction:** Required. A policy of abstention leads to 25 violations. A policy of intervention leads to 5 violations. Deontology should endorse the policy that minimizes total violations of the moral law.
      *   **What Would Move Us:**
          *   **AR:** Would shift if the "fresh agent" condition is removed and it is the *same* agent accumulating blood on their hands, suggesting a "threshold" where agent-relative purity is already lost.
          *   **VM:** Would shift if the five deaths each day were caused by natural causes rather than a villain, testing whether "minimizing violations" applies only to human agency or all deaths.

  #### Crux C: The Nature of the Restriction
  *   **Test Case:** *The Self-Defense Variant.*
      *   **Setup:** The one person you must kill to save the five is the aggressor threatening the five, not an innocent bystander.
      *   **AR Prediction:** Permitted. The restriction against killing is grounded in the right of the innocent not to be used. The aggressor has forfeited this protection.
      *   **VM Prediction:** Permitted. Minimizing violations allows killing the one who is themselves violating rights.
      *   **Note:** We agree here, but disagree on *why*. AR cites forfeiture of rights; VM cites net reduction of rights-violations. This case isolates whether the restriction is about *innocence* or *counts*.

  **Next Steps:** We will draft separate appendices detailing why the *Iterated Intervention* case does (VM) or does not (AR) collapse the agent-relative constraint into a consequentialist calculus.
