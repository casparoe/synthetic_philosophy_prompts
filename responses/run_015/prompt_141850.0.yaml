answer: |-
  # AESTHETICS DIAGNOSTIC: INTUITIONS ABOUT ART
  **Instructions:** Read each case carefully. Select the **one** option that best matches your intuition. Do not overthink; answer as a layperson would.

  **1. The Perfect Forgery**
  A painter creates a physically indistinguishable copy of a famous masterpiece. Experts believe it is the original. Later, the forgery is revealed.
  *   A) It was art the whole time; it looks exactly like the original.
  *   B) It ceased to be art (or never was) once the history was revealed.
  *   C) It remains art because the art world accepted it as genuine for a time.

  **2. The Ritual Object**
  A sacred mask is made for a ritual. It is later bought by a museum and displayed as "Art." Years later, it is repatriated and returned to ritual use.
  *   A) It was always art; its beauty/function doesn't change.
  *   B) It was art only while in the museum; status changed with context.
  *   C) It was never art; it is a ritual tool, regardless of where it sits.

  **3. The Identical Twin**
  An object physically identical to a famous painting is produced by a community that has no concept or practice of "art" whatsoever.
  *   A) It is art; the visual properties are what matter.
  *   B) It is not art; it lacks the right cultural history.

  **4. The Private Work**
  An artist creates a profound work, locks it in a safe, and dies. It is never seen or described to anyone.
  *   A) It was art; the artist's intention was sufficient.
  *   B) It was not art; art requires an audience or public standing.

  **5. The Elegant Proof**
  A mathematical proof and a composed chess problem are widely admired for their elegance and structure.
  *   A) They are art; they provide the same experience as poetry or music.
  *   B) They are not art; they belong to different categories of human practice.

  **6. The Natural Object**
  A gallery director places an unaltered driftwood log on a pedestal and declares it a work of art.
  *   A) It is art; the gallery context makes it so.
  *   B) It is not art; it was not made by a human agent.
  *   C) It is art only if it successfully creates an aesthetic experience.

  **7. The Bad Work**
  Consider a work that is universally agreed to be clumsy, boring, and without merit.
  *   A) "Bad art" is a contradiction; if it is truly bad, it is not art.
  *   B) "Bad art" exists; art status does not guarantee quality.

  **8. The Concept Itself**
  Think about how we use the word "art" in everyday language.
  *   A) We use it to pick out things that share a specific defining essence.
  *   B) We use it as a flexible tool without a strict definition.

  ***

  ## INSTRUCTOR'S KEY & ANALYSIS
  *(For teacher use only)*

  **Scoring Logic:**
  *   **Aesthetic Essentialist:** 1-A, 2-A, 3-A, 4-B, 5-A, 6-C, 7-A, 8-A.
      *   *Core:* Art is defined by perceptible properties/experience.
  *   **Institutionalist:** 1-C, 2-B, 3-B, 4-B, 5-B, 6-A, 7-B, 8-A.
      *   *Core:* Art is defined by conferred status/context.
  *   **Intentional-Historical:** 1-B, 2-C, 3-B, 4-A, 5-B, 6-B, 7-B, 8-A.
      *   *Core:* Art is defined by genesis, intent, and history of making.
  *   **Cluster Theorist:** Mixed A/B/C (no consistent pattern), 8-A.
      *   *Core:* Art is a weighted mix of properties; no single condition is necessary.
  *   **Neo-Wittgensteinian:** 8-B (regardless of 1–7).
      *   *Core:* The search for a definition is a philosophical mistake.

  **Logical Space Flags:**
  1.  **Empty Combination:** **1-A (Forgery is Art) + 6-B (Natural Object is Not Art).**
      *   *Diagnosis:* **Incoherent.** If perceptible features alone confer art-status (1-A), they must do so for nature (6-B). Affirming both implies a hidden historical condition for nature but not forgeries, violating the premise of pure aesthetic essentialism.
  2.  **Indistinguishable Leaves:** **Cluster Theory vs. Weighted Family-Resemblance.**
      *   *Diagnosis:* **Unexplored.** Both deny necessary conditions and weigh features. This quiz tests *commitment to conditions*, not the *weighting mechanism*. To separate them, add a case asking if a work with *only* one artistic property (e.g., intent but no object) can be art.

  **Classificatory Workhorse:**
  *   **Question 1 (The Forgery).** This question performs the heaviest lifting. It immediately separates Aesthetic Essentialists (who must say "Yes, it looks the same") from Historical Intentionalists (who must say "No, wrong history"). Institutionalists are forced to clarify if status depends on *current* or *past* uptake.

  **Note on Layout:** This document is designed to fit on a single double-sided sheet. Front: Student Quiz. Back: Instructor Key & Analysis.
