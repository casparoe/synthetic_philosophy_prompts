      *   *Section 1: The Category Error.* Explain why utilitarianism fails here. Use the concept of "constitutive means" vs. "instrumental means." Truth isn't a tool; it's a constitution of the self/work.
      *   *Section 2: Value Pluralism & Incommensurability.* Cite Berlin/Raz. The middle ground isn't a calculation; it's a negotiation of *priority* in a specific context without denying the other's validity.
