      *   *Did I cover all 6 candidates?* Yes.
      *   *Did I split the retroactivity family?* Yes.
      *   *Did I address the 3 complications?* Yes.
      *   *Did I answer the 2 closing questions?* Yes.
      *   *Is the distinction between Case 1 and Case 2 clear?* Need to ensure Case 1 (domestic statute enacted *after* transition for *prior* acts) and Case 2 (ICC jurisdiction over *non-members* for aggression) are mapped correctly to the arguments.
          *   *Case 1:* Heavily implicates Retroactivity (Variant 1 & 4).
          *   *Case 2:* Heavily implicates Jurisdiction (Candidate 3) and Selective Prosecution (Candidate 2 - why these states?).

  8.  **Final Polish:** Check for clarity, flow, and intellectual rigor. (The prompt asks for "verdicts on the variants" in the retroactivity section—need to be careful not to give a historical verdict but a logical/structural verdict on the *claim itself*). *Correction:* The prompt asks for verdicts on the *variants of the claim*, i.e., is this a strong legal objection or a weak one?

      *   *Wait, one nuance:* "Verdicts on the variants" in the retroactivity section. I should evaluate the *strength* of these legal objections, not the historical guilt of the defendants.
      *   *Complication 1:* Retroactive leniency. If *nullum crimen* is about notice, retroactive *benefit* shouldn't matter. If it's about limiting state power, it does.
      *   *Complication 3:* Count-by-count. This is the strongest analytical tool for the writer.

      *(Self-Correction during drafting)*: Make sure to explicitly label which claims are tautological, substantive, false, or rhetorical closers.

      *(Final check on Case 1)*: "Statute enacted after the transition, for conduct that was lawful... under the old regime." This is classic *ex post facto*.
      *(Final check on Case 2)*: "Jurisdiction over crime of aggression against leaders of states that never accepted that jurisdiction." This is about consent and sovereignty, plus the definition of aggression.

      Let's assemble the response.

      *Structure:*
