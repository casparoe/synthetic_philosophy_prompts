answer: |-
  Here is a disambiguation of the phrase "victors' justice," structured as a menu of distinct legal and political claims, followed by the specific analysis of retroactivity and the closing philosophical questions you requested.

  ### Part I: The Menu of Claims

  Below are the six distinct claims often bundled under the label "victors' justice." For each, I have outlined the truth conditions, the method of verification, the target of the criticism, and its transferability to your two cases.

  **1. The Compositional Claim (Impartiality of the Bench)**
  *   **The Claim:** The tribunal is structurally biased because the judges are appointed solely by the victorious powers or the successor regime.
  *   **Truth Conditions:** The bench must lack representation from the defeated state or neutral third parties; procedural rules must favor the prosecution disproportionately.
  *   **Verification:** Examine the appointing authority and the rules of procedure/evidence. Compare with contemporary standards of judicial independence.
  *   **Target:** The *legitimacy of the procedure*, not necessarily the guilt of the accused.
  *   **Transferability:**
      *   *Case 1 (Post-Dictatorship):* **High.** If the new judges are political appointees of the transition government, this claim holds traction.
      *   *Case 2 (ICC Aggression):* **Low/Mixed.** ICC judges are elected by the Assembly of States Parties, not just the "victors," though critics argue the Assembly is dominated by Western powers.
  *   **Classification:** **Substantive and Arguable.** It is a due process objection.

  **2. The Selective Prosecution Claim (Hypocrisy)**
  *   **The Claim:** The victors committed similar acts (e.g., bombing civilians, aggressive alliances) but were immune from prosecution.
  *   **Truth Conditions:** Evidence must exist that the prosecuting side committed acts *substantially similar* in legal character and moral gravity to those charged, yet faced no investigation.
  *   **Verification:** Comparative factual analysis of conduct by both sides; analysis of prosecutorial discretion policies.
  *   **Target:** The *moral authority* of the prosecutor and the *equality before the law*.
  *   **Transferability:**
      *   *Case 1:* **Low.** Usually, the transition government is not accused of the same systematic repression as the dictatorship.
      *   *Case 2:* **High.** This is the core complaint regarding aggression (e.g., why investigate State A but not State B for similar invasions?).
  *   **Classification:** **Substantive and Arguable.** It attacks the rule of law's consistency, not necessarily the legal validity of the conviction.

  **3. The Jurisdictional Claim (Sovereignty/Consent)**
  *   **The Claim:** The tribunal lacks authority over the defendants because they never consented to its jurisdiction (e.g., via treaty or domestic adoption).
  *   **Truth Conditions:** The defendants must be nationals of non-member states (for an international court) or the statute must claim extraterritorial reach without a recognized basis (universal jurisdiction vs. sovereignty).
  *   **Verification:** Treaty law analysis; customary international law status of the crime.
  *   **Target:** The *legal power* of the court to bind the accused.
  *   **Transferability:**
      *   *Case 1:* **Low.** Domestic courts generally have jurisdiction over conduct within their territory, regardless of regime change.
      *   *Case 2:* **High.** This is the primary legal hurdle for the ICC regarding non-state parties.
  *   **Classification:** **Substantive and Arguable.** This is a technical legal objection, often the strongest in international law.

  **4. The Retroactivity Claim (*Nullum Crimen*)**
  *   **The Claim:** The conduct was not criminal at the time it was committed.
  *   **Truth Conditions:** No positive law (statute, treaty, custom) prohibited the act at the time; or the penalty was not established.
  *   **Verification:** Historical legal research into the status of the law *at the time of the act*.
  *   **Target:** The *legality* of the conviction.
  *   **Transferability:**
      *   *Case 1:* **Very High.** You specified the conduct was lawful under the old regime.
      *   *Case 2:* **Medium.** Aggression was criminalized (UN Charter, Kellogg-Briand), but the *individual criminal responsibility* for it was less clear until Rome Statute amendments.
  *   **Classification:** **Substantive and Arguable.** (See Part II for deep disambiguation).

  **5. The Predetermination Claim (Show Trial)**
  *   **The Claim:** The outcome was decided before evidence was heard; the trial is a ritual for a pre-ordained punishment.
  *   **Truth Conditions:** Evidence of political directives to convict; exclusion of exculpatory evidence; refusal to allow defense counsel to function.
  *   **Verification:** Archival records of deliberations; transcript analysis of judicial conduct.
  *   **Target:** The *integrity of the fact-finding process*.
  *   **Transferability:**
      *   *Case 1:* **Medium.** Depends on the independence of the new judiciary.
      *   *Case 2:* **Low.** International courts have high procedural barriers, though political pressure exists.
  *   **Classification:** **False as a Generalization / Substantive if Proven.** Often asserted without proof, but if true, it invalidates the trial entirely.

  **6. The Nihilist Claim (Law is Power)**
  *   **The Claim:** There is no international criminal law, only the capacity of the strong to punish the weak. "Law" is merely a vocabulary for force.
  *   **Truth Conditions:** One must accept a legal realist or positivist framework that denies the existence of norms independent of enforcement.
  *   **Verification:** Philosophical stance, not empirical fact.
  *   **Target:** The *concept of international law itself*.
  *   **Transferability:**
      *   *Case 1 & 2:* **Universal.** This claim applies to any prosecution arising from power asymmetry.
  *   **Classification:** **Near-Tautological (within its own framework).** It cannot be disproven by legal argument because it denies the premises of legal argument. It is usually the "discussion-ender" you hear in interviews.

  ---

  ### Part II: The Retroactivity Family (*Nullum Crimen Sine Lege*)

  You noted that sources retreat to retroactivity when pressed. This principle is rarely monolithic. Below are the five variants, their logical status, and how they handle your three complications.

  #### The Five Variants

  1.  **No Written Enactment (Statutory Basis)**
      *   *Claim:* There was no specific statute prohibiting the act.
      *   *Verdict:* **Weak in International Law.** International law often relies on custom and treaties, not just domestic-style penal codes. If the norm existed in custom, this objection fails.
  2.  **No Penalty Attached (Sentencing Basis)**
      *   *Claim:* The act was prohibited, but no criminal sanction (imprisonment/death) was specified for individuals.
      *   *Verdict:* **Substantive.** This was the core defense at Nuremberg (states are responsible, not individuals). If the law only provided for state reparations, individual criminal liability is arguably *ex post facto*.
  3.  **No Court Ready (Jurisdictional Basis)**
      *   *Claim:* Even if it was a crime, no tribunal existed to try it.
      *   *Verdict:* **Procedural.** Usually defeated by the argument that any competent court can try international crimes (universal jurisdiction), but potent if the court is *ad hoc* and created specifically for the defendants.
  4.  **Unforeseeability (Fair Notice Basis)**
      *   *Claim:* A reasonable person could not have known this conduct was criminal.
      *   *Verdict:* **Strongest Variant.** This is the human rights core of *nullum crimen*. It focuses on the accused's epistemic position rather than the formal source of law.
  5.  **The "Dead Letter" (Enforcement Basis)**
      *   *Claim:* The rule existed but was never enforced, so it was not "law" in a practical sense.
      *   *Verdict:* **False as Stated.** Laws do not cease to be laws because they are unenforced (speed limits are still laws even if no one is ticketed). However, in international law, lack of enforcement can erode the evidence of *customary* status.

  #### The Three Complications

  **1. Planning Conduct vs. Constraining Courts (The Leniency Test)**
  *   **The Issue:** Is *nullum crimen* a shield for the accused to plan their life, or a rule of construction for judges?
  *   **The Test:** Retroactive *leniency*. If a new government decriminalizes past acts (e.g., amnesty for collaborators), does *nullum crimen* forbid this?
  *   **Analysis:** If the principle is about **planning/notice**, retroactive leniency is fine (the accused had notice it was wrong, but gets a break). If the principle is about **constraining state power**, retroactive leniency is also fine (the state is limiting its own power).
  *   **Verdict:** The maxim is primarily a **constraint on courts**, not a right of the accused to demand punishment. Therefore, a successor government *can* retroactively decriminalize without violating the rule of law. However, in your **Case 1**, the movement is the opposite (retroactive *criminalization*). Here, the "Planning" function is violated. The accused planned based on the old law; the new law punishes that plan. This makes the objection in Case 1 much stronger than a complaint about retroactive amnesty.

  **2. Good-Faith Belief vs. Retroactivity**
  *   **The Issue:** Is "I thought it was legal" a separate defense (*mens rea* / mistake of law) or part of *nullum crimen*?
  *   **Analysis:** They are distinct. *Nullum crimen* asks: "Was there a law?" Good-faith belief asks: "Did the accused know about the law?"
  *   **Verdict:** In domestic systems, mistake of law is rarely a defense. In transitional justice (**Case 1**), it is crucial. If the old regime *required* the conduct, the accused's belief is not just good faith; it is **official reliance**. This strengthens the retroactivity objection. It shifts from "I didn't know" to "I was obeying a valid order." This is not just a version of retroactivity; it is a separate equity argument based on **reliance interests**.

  **3. Count-by-Count Assessment (Murder vs. Aggression)**
  *   **The Issue:** Does the objection apply equally to all charges?
  *   **Analysis:** No.
      *   *Murder/Torture of Civilians:* Prohibited by detailed conventions and custom long before WWII or modern transitions. Retroactivity objection is **weak**.
      *   *Aggression/War Launching:* Defined vaguely (Kellogg-Briand renounced war, but did it criminalize it for leaders?). Retroactivity objection is **strong**.
  *   **Verdict:** The objection must be assessed **count-by-count**. In **Case 2**, charging leaders with aggression where their state never accepted the jurisdiction is legally precarious. Charging them with war crimes committed *during* that aggression is legally secure. Conflating the two allows the "victors' justice" label to stick to the whole trial, even if only one count is vulnerable.

  ---

  ### Part III: Closing Questions

  **1. On which reading is "victors' justice" a genuine argument rather than a sneer?**
  It is a **genuine argument** when it identifies a violation of the **Rule of Law** (specifically Retroactivity or Jurisdiction) that undermines the normative claim of the trial. It becomes a **sneer** when it is used to imply that *any* prosecution arising from a conflict is inherently illegitimate (The Nihilist Claim).
  *   **The Immunization Problem:** Can you state the argument without immunizing everyone (including amnesty)?
      *   *Yes.* The argument is not "No one should be punished." The argument is "No one should be punished *without prior law*."
      *   *Amnesty:* Amnesty is a political decision *not* to enforce valid law. Retroactive prosecution is a legal decision to enforce *invalid* law. They are not symmetrical. You can argue against retroactive prosecution without arguing against amnesty. One preserves the integrity of the legal system (by not breaking its own rules); the other sacrifices justice for stability (a political trade-off). The critic of "victors' justice" must argue for **procedural legitimacy**, not necessarily impunity.

  **2. If a court convicts in violation of the legality principle, is the trial itself an injustice of the same kind it was convened to punish?**
  *   **Verdict:** **No, that is a confusion.**
  *   **Reasoning:** It commits a category error.
      *   *The Crime (e.g., Aggression/Torture):* A substantive moral and legal wrong causing physical harm or violating sovereignty.
      *   *The Trial Violation (Retroactivity):* A procedural wrong violating the normative expectations of the legal system.
  *   **Nuance:** While not the *same kind* of injustice, a procedural violation can **morally tainted** the outcome. If the state breaks the law to punish law-breaking, it undermines the pedagogical purpose of the trial (affirming the rule of law). However, equating a procedural violation with mass atrocity (moral equivalence) is a rhetorical move, not a legal one. It is better described as a **corruption of the remedy**, not a replication of the disease.

  ### Summary for Your Piece
  When your sources say "victors' justice," check which menu item they are ordering.
  *   If they mean **Selective Prosecution**, they are arguing about politics and hypocrisy.
  *   If they mean **Retroactivity (Case 1)**, they are arguing about the Rule of Law and reliance on old statutes.
  *   If they mean **Jurisdiction (Case 2)**, they are arguing about sovereignty and consent.
  *   If they mean **Nihilism**, they are ending the conversation.

  For your specific focus on **retroactivity**, the strongest analytical tool is the **Count-by-Count** distinction and the **Reliance Interest** (officially required conduct vs. merely lawful conduct). This allows you to separate the "victors' justice" sneer from the legitimate legal concern about *ex post facto* punishment without conceding that the defendants deserve immunity.
