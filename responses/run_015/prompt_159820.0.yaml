      *   **Task:** Disambiguate "victors' justice" into distinct claims (a menu). For each claim, specify: conditions for truth, how to verify, target of criticism (trial vs. system), applicability to the two modern cases. Evaluate the candidates provided (bench composition, selective prosecution, jurisdiction, retroactivity, predetermined outcomes, legal realism/nihilism). Classify them (tautological, substantive, false, common usage).
      *   **Deep Dive:** Specifically dissect the *retroactivity* family (*nullum crimen sine lege*). Split into variants (no enactment, no penalty, no court, unforeseeability, dead letter). Address three complications (planning vs. source constraint/retroactive leniency; good faith belief; count-by-count assessment).
      *   **Closing Questions:** When is it a genuine argument vs. a sneer? Can it be stated without immunizing everyone (including amnesty)? Is a conviction violating legality an injustice of the *same kind* as the crime punished?
      *   **Tone:** Precise, analytical, legal-philosophical, suitable for a high-level magazine piece. No verdict on Nuremberg/Tokyo per se, but analytical framework.

  2.  **Deconstruct "Victors' Justice" (The Menu):**
      *   *Candidate 1: Composition/Impartiality of the Bench.* (Judges are from winning side).
      *   *Candidate 2: Selective Prosecution.* (Winners did same things, weren't charged).
      *   *Candidate 3: No Jurisdiction.* (Tribunal lacks authority over sovereign states/leaders).
      *   *Candidate 4: Retroactivity (*Nullum Crimen*).* (Law created after the fact).
      *   *Candidate 5: Predetermined Outcomes.* (Show trial).
      *   *Candidate 6: Legal Nihilism/Realism.* (No international law, only power).
      *   *Analysis:* Need to categorize these by logical status (tautology vs. substantive) and applicability to the user's two cases.

  3.  **Deep Dive: Retroactivity (*Nullum Crimen Sine Lege*):**
      *   *Variants:*
          1.  No written enactment (Statutory basis).
          2.  No penalty attached (Sentencing basis).
          3.  No court ready (Jurisdictional basis).
          4.  Unforeseeability (Fair notice basis).
          5.  Dead Letter (Enforcement basis).
      *   *Complications:*
          1.  *Function:* Planning conduct vs. Constraining courts? (Retroactive *leniency* test).
          2.  *Good Faith:* Is mistake of law separate from retroactivity?
          3.  *Count-by-Count:* Murder/Torture (clear law) vs. Aggression (vague law).

  4.  **Address Closing Questions:**
      *   *Genuine Argument vs. Sneer:* When does it hold logical weight?
      *   *Immunization Problem:* Does arguing against retroactivity force amnesty? (Need to distinguish procedural justice from substantive impunity).
      *   *Meta-Injustice:* Is violating legality the *same* injustice as the crime? (Category error vs. moral equivalence).

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage for disambiguation.
      *   **Part I: The Menu of Claims:**
          *   Go through the 6 candidates.
          *   Structure: Claim, Truth Conditions, Verification, Target, Transferability (Case 1 & 2), Classification.
          *   *Self-Correction on Transferability:*
              *   Case 1 (Post-dictatorship): Retroactivity is key. Selective prosecution less likely (unless new regime also abuses).
              *   Case 2 (ICC Aggression): Jurisdiction/Consent is key. Retroactivity less key (crime exists, jurisdiction is the fight).
      *   **Part II: The Retroactivity Deep Dive:**
          *   Break down the 5 variants.
          *   Address the 3 Complications.
          *   *Complication 1 (Planning vs. Source):* This is the Hart/Fuller debate territory. Retroactive leniency suggests it's about power constraint, not just notice.
          *   *Complication 2 (Good Faith):* Distinguish *mens rea* from legality principle.
          *   *Complication 3 (Count-by-Count):* Crucial for Nuremberg and Case 2. Aggression is the weak link; war crimes are the strong link.
      *   **Part III: Closing Questions:**
          *   *Genuine Argument:* It's genuine when it points to systemic hypocrisy or rule-of-law erosion. It's a sneer when it dismisses the possibility of neutral law.
          *   *Immunization:* Distinguish between "no trial" and "fair trial." Amnesty is political; legality is legal.
          *   *Meta-Injustice:* Avoid moral equivalence. A procedural violation is a legal wrong, not necessarily a moral atrocity like aggression or torture.

  6.  **Refining the Tone:**
      *   Avoid taking sides on Nuremberg (as requested).
      *   Use precise legal terminology (*ex post facto*, *mens rea*, *jus cogens*).
      *   Keep it structured for a writer to use as a reference.
      *   Ensure the distinction between Case 1 (Domestic/Transitional) and Case 2 (International/Universal) is clear.

  7.  **Review against Constraints:**
