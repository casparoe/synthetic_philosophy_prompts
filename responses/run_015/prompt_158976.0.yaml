  The board should adopt Draft B because supervaluationism offers a legally robust framework for vagueness that minimizes litigation risk and accommodates evolving standards, whereas epistemicism creates false certainty that invites successful appeals.

  Epistemicism, underpinning Draft A, posits that vague predicates like "substantial experience" have sharp boundaries that are merely unknowable. This treats disagreement in the penumbra as a defect to be engineered away through intensive calibration. However, because the boundary is unknowable in principle, this approach guarantees that examiners will be labeled erroneous despite perfect diligence. This creates a perverse incentive for examiners to guess rather than judge, knowing any disagreement is recorded as failure. Resources spent on calibration are wasted chasing a metaphysical fiction. Conversely, Draft B's supervaluationist approach treats borderline statements as lacking truth values. Disagreement here is not error but permissible variation across admissible precisifications. By instructing examiners that divergence in the penumbra is acceptable, the board reduces morale issues and prevents examiners from guessing to avoid "error" markers. The manual should explicitly state that divergent recommendations on identical penumbral files do not constitute grounds for disciplinary action against examiners.

  Regarding the standard of review, Draft A compels appellate panels to search for a single correct verdict, leading to arbitrary reversals based on subjective hunches about where the unknowable boundary lies. This increases litigation costs as applicants argue their specific facts hit the "true" boundary. Draft B suggests a deferential standard: a penumbral verdict should stand if it is true under *some* admissible precisification. Reversal should occur only if the verdict is false under *all* admissible precisifications, such as granting a license to an applicant with clearly inadequate hours. This protects the board from courts overturning decisions based on the illusion of a discoverable sharp line.

  Higher-order vagueness—the boundary between clear and indeterminate cases—is inevitable. Draft A forces a binary choice that masks this uncertainty, risking misclassification. Draft B acknowledges this by allowing appellate panels to resolve binning disputes without treating the initial classification as misconduct. The manual should instruct panels to review borderline binning with deference, recognizing that the line between "clear pass" and "indeterminate" is itself vague.

  The equality clause presents a critical divergence. Epistemicism theoretically supports equality but practically violates it; since the sharp boundary is unknowable, materially indistinguishable cases will inevitably receive different verdicts due to examiner ignorance, creating liability. Supervaluationism respects equality by requiring consistency within a chosen precisification. The manual should instruct examiners to maintain internal consistency within their cohort, even if standards shift between cohorts. This satisfies the statute by ensuring that within any single admissible interpretation, equals are treated equally. If one examiner marks a file "indeterminate" and another "pass," neither violates the clause provided both outcomes fall within the range of admissible precisifications for that period.

  Finally, the audit reveals threshold drift. Epistemicism views this drift as corruption of the true standard, demanding costly corrections to restore the "original" meaning. Supervaluationism recognizes drift as the natural evolution of admissible precisifications as community standards change. Draft B allows the board to accommodate this drift as legitimate adaptation rather than fighting a losing battle against linguistic entropy. By adopting Draft B, the board acknowledges that language evolves, ensuring the licensing standard remains relevant without admitting legal error. This approach transforms the audit findings from evidence of malfunction into evidence of a living standard, allowing the board to update its precisifications periodically without invalidating past precedents.
