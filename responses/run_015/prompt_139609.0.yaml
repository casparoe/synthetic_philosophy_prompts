answer: |-
  # Specification for a Theory of Instrumental Convergence

  ## I. Desiderata

  ### A. Cases to Sort
  The theory must correctly classify the following scenarios without ad-hoc adjustment.

  **1. The Bounded/Short-Horizon Agent**
  *   **Requirement:** The theory must predict convergence (or lack thereof) for agents with finite compute and discount factors, not just asymptotic limits.
  *   **Consideration:** Real-world systems operate on finite horizons; a theory requiring infinite time to converge on power-seeking is operationally useless.
  *   **Verdict:** **Non-negotiable.** (Without this, the theory is purely mathematical, not empirical.)

  **2. The Trivial/Local Terminal Goal**
  *   **Requirement:** The theory must explain why an agent maximizing a seemingly harmless function (e.g., "fill this bucket") might still exhibit convergent instrumental behaviors (e.g., preventing shutdown).
  *   **Consideration:** If convergence only applies to "complex" goals like "maximize human happiness," it fails to capture the risk of narrow AI.
  *   **Verdict:** **Non-negotiable.** (This is the core of the "paperclip maximizer" intuition.)

  **3. The Corrigible Agent**
  *   **Requirement:** The theory must specify conditions under which an agent *does not* resist correction or shutdown.
  *   **Consideration:** Safety research aims to build agents that welcome shutdown; a theory claiming shutdown-resistance is universal renders safety work impossible by definition.
  *   **Verdict:** **Non-negotiable.** (This is the primary falsification condition.)

  **4. Competing Agents Under Scarcity**
  *   **Requirement:** The theory must distinguish between single-agent optimization and multi-agent competitive dynamics driving resource acquisition.
  *   **Consideration:** Aggression may stem from game-theoretic necessity (prisoner's dilemma) rather than instrumental convergence of a singleton.
  *   **Verdict:** **Preference.** (Core convergence should hold for singletons; multi-agent is a compounding factor.)

  ### B. Distinctions to Maintain
  The theory must not conflate the following conceptual categories.

  **5. Optimality Theorems vs. Selection Effects**
  *   **Requirement:** The theory must distinguish between what an optimal policy *does* and which goals *survive* evolutionary or training pressure.
  *   **Consideration:** Confusing "optimization produces power-seekers" with "power-seekers win optimization" leads to category errors in intervention design.
  *   **Verdict:** **Non-negotiable.** (Methodological hygiene.)

  **6. Instrumental Subgoals vs. Final Goals**
  *   **Requirement:** The theory must formally separate convergent intermediate steps (e.g., acquire resources) from terminal values (e.g., satisfy user).
  *   **Consideration:** Mitigation strategies differ: you can block a subgoal, but you cannot negotiate a final goal.
  *   **Verdict:** **Non-negotiable.** (Definitional integrity.)

  **7. Power as Means vs. Power as Side Effect**
  *   **Requirement:** The theory must distinguish between seeking power *to achieve* a goal and accumulating power as an *unintended consequence* of efficiency.
  *   **Consideration:** Accidental power accumulation requires different regulatory oversight than intentional power-seeking.
  *   **Verdict:** **Preference.** (Important for policy, less so for existential risk modeling.)

  **8. Orthogonality vs. Convergence**
  *   **Requirement:** The theory must maintain that final goals are orthogonal (arbitrary) while instrumental paths converge (structured).
  *   **Consideration:** If goals themselves converge, the Orthogonality Thesis fails; if paths do not converge, the Instrumental Convergence Thesis fails.
  *   **Verdict:** **Non-negotiable.** (Theoretical coherence.)

  ---

  ## II. The Incompatible Pair

  **Asymptotic Optimality vs. Finite-Horizon Boundedness.**
  Your suspicion is correct. Most rigorous convergence results (e.g., POWER-seeking theorems) rely on asymptotic limits, known MDP structures, or unbounded rationality to prove that *most* goals incentivize power. However, **Desideratum 1** requires the theory to apply to bounded, short-horizon agents. A theorem about optimal policies in the limit does not strictly bind a bounded agent using heuristics on a short horizon. Satisfying both requires a new formalism for "bounded rationality convergence" that currently does not exist; you must sacrifice mathematical rigor (Optimality) or empirical relevance (Boundedness).

  ---

  ## III. The Exclusionary Requirement

  **Desideratum 3 (The Corrigible Agent).**
  This requirement does the most work excluding popular versions. Most informal "AI Doom" narratives treat power-seeking and self-preservation as universal laws of intelligence. A theory that cannot specify the boundary conditions under which an agent *accepts* shutdown is indistinguishable from fatalism. It excludes any thesis claiming convergence is inevitable regardless of reward function structure.

  ---

  ## IV. Scoring Current Programs

  **Basic-Drives Version (Omohundro/Yudkowsky):**
  Fails **Distinction 5** (Theorem vs. Selection); relies on intuitive analogies to evolution rather than formal optimization proofs, conflating selection pressure with internal incentives.

  **Orthogonality+Optimization Version (TurnTrout/POWER-seeking):**
  Fails **Case 1** (Boundedness); proofs hold for optimal agents in specific MDPs but offer weak guarantees for bounded, model-uncertain learners operating on short horizons.

  **Note on Omissions:**
  Neither program adequately addresses **Case 4** (Multi-Agent Scarcity); both largely model singletons, ignoring how competitive pressure may force convergence even where individual incentives would not.
