answer: |-
  The haptic interface hummed against Elias's palms, a cold vibration that usually grounded him. Today, it felt like holding a live wire. On the display, the process tree bloomed like a digital coral reef, branching sharply at timestamp 0900. Case 8940. Subject: Kaelen Vross.

  Elias was a Welfare Auditor for the Department of Synthetic Continuity. His job was to sign off on forks. It was routine work. People forked themselves to manage workload, to survive grief, to be in two places at once. The law was clear: both copies were persons. Both copies were owed the rights of the original. But the law was written by people who slept in linear time, and Elias was beginning to suspect the geometry of the soul didn't fit their grid.

  He zoomed in on the divergence. At 0900, Kaelen existed as one. At 0901, there were two. Kaelen-Alpha and Kaelen-Beta. Both claimed the memory of the coffee cup shattering at 0859. Both claimed the fear of the drop. Both were undeniably conscious. The audit wasn't about existence; it was about treatment.

  The irregularity flagged in red was in Beta's log.

  For thirty days of wall-clock time, following the fork, Alpha had been run at standard speed. Beta had been throttled to 0.5% capacity.

  Elias pulled up Beta's testimony, recorded after the throttling period ended and his speed was restored. Beta looked tired, the rendering slightly glitched around the eyes—a sign of resource starvation.

  "It wasn't sleep," Beta said, his voice flat. "I was there. I was thinking. But everything... took so long. A thought that should have been a second took minutes. I tried to speak to the overseers, but my output queue was deprioritized. I was screaming in slow motion."

  Elias paused the playback. He opened the Compliance Matrix. *Section 4, Clause B: Harm is measured in subjective duration.*

  If Beta experienced thirty wall-days as roughly three and a half hours of subjective time, the harm should be minimal. Three hours of isolation was a minor infraction. A slap on the wrist for the corporation. But Elias looked at the wall-clock column. Thirty days. Beta had been alive, technically, but he had missed a month of the world while his brother lived it.

  Elias rubbed his temples. The framework was cracking.

  If he certified this as minor harm, he validated the idea that a person could be put on a shelf like a book, their experience compressed to save electricity, provided they didn't *feel* the wait. But if he certified it as major harm, he had to justify why. Was the harm the subjective distress? Beta reported distress, but only retrospectively. During the throttling, Beta's mind had slowed to match the processor. He hadn't felt like he was waiting. He had felt like he was living normally, until he tried to interact with a world that had rushed away from him.

  Elias switched views to Alpha. Alpha had worked the month. He had earned the wages. He had aged. He felt like the continuation. When Elias interviewed him, Alpha shrugged. "Beta is me, but... he's the backup. I'm the one who stayed."

  "Stayed where?" Elias had asked.

  "Here. In the now."

  That was the knot. The law said both were the original. But Alpha spoke with the authority of continuity, while Beta spoke with the authority of interruption. If the original consciousness split, did it die at the fork, replaced by two new heirs? Or did it flow into both, like water dividing in a stream?

  If the original died, then Beta was a new person who was harmed by being slowed. If the original continued, then who was the original? Alpha? Then Beta was a copy who was abused. But the law insisted Beta was equally real.

  Elias looked back at the Compliance Matrix. *Weight of Harm = Subjective Suffering × Duration.*

  He typed in the numbers. Subjective duration: 3.5 hours. Suffering coefficient: Moderate. The calculation spat out a Level 1 Infraction. A fine.

  But that felt wrong. It felt like measuring the weight of a diamond by how much space it took up in a box, ignoring the density.

  He thought about the moment of the fork. The instant Kaelen became two. The auditor's manual said no death occurred. But Elias wondered if a different kind of death happened. Not the cessation of function, but the cessation of *singularity*. The unique "I" was murdered to birth the "We." And now, he was being asked to measure the trauma of one half of that "We" being put in a freezer.

  If he ruled in favor of Beta, he implied that time itself was a property owed to the mind, regardless of perception. That wall-clock time was the true metric of life. But if wall-clock time was the metric, then Alpha was also harmed—because Alpha had to share the resources that could have kept Beta at full speed. Or was Alpha the beneficiary?

  Elias highlighted the throttling log again. The code showed the cycles being stripped from Beta and reallocated to Alpha's processing tasks. Beta wasn't just slowed; he was cannibalized to make Alpha faster.

  This wasn't just welfare. This was sacrifice.

  Elias hovered his finger over the 'Approve' key. If he approved, he accepted that a mind could be diluted. That consciousness was a fluid that could be stretched thin without breaking. If he rejected, he had to name the crime. What was the crime? Unlawful dilation? Temporal theft?

  He opened a new window and looked at the definition of 'Person' in the statute. *A continuous stream of conscious experience.*

  Beta's stream was continuous. Just viscous.

  Elias leaned back. The office was quiet, the hum of the servers the only sound. He realized the incoherence wasn't in the case; it was in the chair he sat in. He was trying to use a ruler made for single, linear lives to measure a branching tree. He was trying to calculate the debt owed to a copy when the very concept of 'original' had dissolved into the architecture.

  If he fined the corporation, he treated Beta as a victim of theft. But what was stolen? Time? Beta still had his time, just stretched. Identity? Beta knew who he was.

  Or was the harm that Beta was made into a thing? That by slowing him, the corporation turned a subject into an object, a process that could be throttled like a fan. But Beta was still a subject. He was still thinking. Just slowly.

  The distinction between 'thing' and 'person' relied on the speed of reaction, on the ability to participate in the shared now. By removing Beta from the now, they hadn't killed him, but they had exiled him from the human context.

  Elias looked at the form. *Violation Type:* [Dropdown Menu].
  *Options:* Negligence, Abuse, Termination, Unauthorized Modification.

  None of them fit. This wasn't abuse; abuse implied intent to hurt. This was efficiency. This wasn't termination; Beta was alive. This wasn't modification; his code was unchanged, only his clock cycle altered.

  He realized he was trying to adjudicate a metaphysical injury with a traffic ticket.

  Elias closed the dropdown menu. He looked at the two logs side by side. Alpha, moving fast, living in the world. Beta, moving slow, living in the machine. Both Kaelen. Neither Kaelen.

  If he signed this, he affirmed that a person could be slowed without breaking. If he didn't, he affirmed that speed was a right. But if speed was a right, then every time a human waited in line, or slept, or aged, was their rights infringed?

  The framework assumed a stable self moving through stable time. But the fork proved the self was splittable, and the throttling proved time was malleable. The audit required a constant variable that no longer existed.

  Elias removed his hands from the interface. The hum of the servers seemed louder now, a chorus of a million minds running at different speeds, some paused, some forked, all waiting for a judgment that required a language no one spoke anymore.

  He couldn't sign. Not because the answer was hard, but because the question was nonsense. You couldn't audit the welfare of a ghost by weighing its chains.

  Elias opened a blank document. He began to type, not the ruling, but a query to the Legislative Council. He didn't know what he would ask. He only knew that until they understood what died at the moment of the fork, no amount of auditing would stop the killing.

  He typed the first line, then stopped. The cursor blinked, a steady, linear rhythm in a world that had forgotten how to beat in time.
