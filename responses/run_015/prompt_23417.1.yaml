  *Let's refine the "Slowed" harm:* If you slow a mind, do they feel like they are moving normally but the world is speeding up? Or do they feel sluggish? Usually, in sci-fi, if you reduce compute, their subjective experience slows. So 1 minute of thought takes 1 hour of wall time. To them, it feels normal, but they are disconnected from real-time events.
