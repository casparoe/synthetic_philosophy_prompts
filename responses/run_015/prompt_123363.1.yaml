      *   *Ontology:* Agnostic/Realist about underlying objects. There *are* objects/nature, but they are epistemically inaccessible. $Structure \rightarrow Objects$.
      *   *QM/Indistinguishability:* Worrall tends to be cautious. Since ESR says we don't know the *nature* of objects, the fact that QM makes labels surplus to requirements fits well. We simply don't know if there are "haecceities" or individual essences. The structure (symmetry groups) is what we know; the underlying "stuff" is unknown.
