answer: |-
  ### Structural Realism and the Quantum Dissolution of Objecthood

  The debate between Epistemic Structural Realism (ESR), championed by John Worrall, and Ontic Structural Realism (OSR), advanced by James Ladyman and Don Ross, centers on the ontological priority of structure versus object. This divergence becomes sharpest when confronted with the formalism of quantum mechanics (QM), specifically regarding permutation-symmetric states where particle labels lose physical significance. The introduction of a hypothetical "Modal Structuralism" (MS)—which posits structures as necessary modal constraints rather than actual relations among entities—forces a re-evaluation of the core commitments of both views.

  #### 1. ESR and OSR on the Disappearance of Objecthood in QM

  **Worrall's Epistemic Structural Realism (ESR)**
  Worrall's ESR is primarily motivated by the continuity of mathematical structure across radical theory change (e.g., Fresnel's ether equations to Maxwell's electromagnetic field). Ontologically, ESR maintains a dualism: there is a world of objects possessing an intrinsic nature, but this nature is epistemically inaccessible. We only know the structural relations these objects bear to one another.

  In the context of QM permutation symmetry, ESR treats the loss of particle individuality as an **epistemic limit**. The formalism indicates that we cannot distinguish particles by intrinsic properties (haecceities). For the ESR proponent, this does not necessarily prove that individual objects *do not exist*; rather, it proves that their individuality is structurally irrelevant to our knowledge. The "objects" remain as the unknown bearers of the structure (the nodes of the graph), but their specific identities are screened off by the symmetry groups. The burden of individual entities in ESR is that they are **epistemically inaccessible substrates**. They are required to ground the relations ontologically, even if they play no role in the equations.

  **Ladyman and Ross's Ontic Structural Realism (OSR)**
  Ladyman and Ross argue that ESR is unstable: if we cannot know the nature of the relata, we have no justification for believing they exist at all. OSR posits that structure is ontologically primitive. Relations do not require prior relata; rather, relata are constituted by the relations (or eliminated entirely).

  Regarding QM permutation symmetry, OSR interprets the surplus of particle labels as an **ontological elimination**. The violation of the Principle of Identity of Indiscernibles (PII) in quantum statistics is not a limit on knowledge but a revelation of metaphysical truth: there are no "things" being permuted. There is only the structural state of the system (the ray in Hilbert space). The burden of individual entities in OSR is that they are **ontologically absent**. To posit them is to engage in "metaphysical underdetermination." The relations are not connections between things; the relations *are* the things.

  #### 2. The Modal Structuralist Turn

  **Modal Structuralism (MS)** proposes that the mathematical structures of physical theories are not descriptions of actual relations instantiated in a concrete world, but rather **necessary modal constraints**. On this view, physics describes the space of physically possible worlds and the constraints any system must satisfy to be physical, regardless of whether any relata exist to instantiate them. Structure is not a web of actual connections but a set of rules for possibility.

  To accommodate MS, both ESR and OSR must revise core commitments regarding the ontological status of relations and the necessity of relata.

  **ESR's Required Revision: Relinquishing the Substrate**
  ESR is committed to the existence of a mind-independent world with an intrinsic nature, even if unknown. Structure is the *interface* between the knower and this nature.
  *   **The Conflict:** MS suggests structures can exist as constraints without relata. If structure is merely a modal constraint, the ESR commitment to an underlying "nature" or "substrate" becomes superfluous. If there are no relata to bear the relations, the ESR distinction between "known structure" and "unknown nature" collapses.
  *   **The Revision:** ESR must relinquish the commitment to **ontological dualism** (structure + hidden nature). It must accept that the "world" is exhausted by the modal constraints themselves.
  *   **The Risk:** Once ESR abandons the hidden substrate, it loses its claim to be a form of *realism* about a physical world. If structures are just modal constraints without instantiation, ESR risks collapsing into **pure instrumentalism**. The structures become mere rules for organizing phenomena without ontological weight, as the "real world" they were supposed to map onto has vanished.

  **OSR's Required Revision: From Actual to Modal**
  OSR is committed to structure being *ontic*—that is, structure is the fundamental stuff of the actual world. Ladyman and Ross emphasize "structure all the way down" as a concrete reality.
  *   **The Conflict:** MS reframes structure from "actual relations" to "necessary constraints." Standard OSR views structure as instantiated patterns. MS views structure as the conditions for instantiation.
  *   **The Revision:** OSR must revise its conception of **ontological actuality**. It must shift from claiming "relations exist" to "modal constraints are fundamental." It must accept that physical reality is defined by necessity rather than concrete instantiation.
  *   **The Risk:** OSR risks collapsing into a form of **Standard Scientific Realism about Abstracta (Pythagoreanism)**. If the structures are necessary modal truths, they resemble mathematical Platonism more than physical realism. However, because OSR has already eliminated concrete objects, it is better positioned to absorb this than ESR. The danger is not instrumentalism (denying reality) but rather an over-commitment to abstract necessity that disconnects physics from contingent physical existence.

  #### 3. Assessment: Viability of the Modal Extension

  Which position can extend toward Modal Structuralism without collapsing?

  **ESR is less viable.**
  ESR's core motivation is to save realism from skepticism by retreating to structure while keeping a placeholder for "objects." MS removes the need for the placeholder.
  *   *Ontological Status of Relations:* For ESR, relations are actual connections between unknown things. For MS, they are constraints. If ESR accepts MS, relations are no longer connections *in the world* but rules *for the world*.
  *   *Collapse:* Without the "unknown nature" to ground the realism, ESR becomes a claim that "our theories impose modal constraints on experience." This is indistinguishable from Kantianism or Instrumentalism. It fails to secure the mind-independent reality Worrall seeks.

  **OSR is more viable.**
  OSR already argues that objects are metaphysical excrescences. The move from "actual structure" to "modal structure" is a refinement of ontology, not a contradiction.
  *   *Ontological Status of Relations:* OSR views relations as fundamental. MS views them as necessary conditions. These are compatible if one views "existence" as "satisfying physical constraints."
  *   *Avoiding Collapse:*
      *   *Against Standard Realism:* OSR + MS avoids Standard Realism because it does not posit a world of individual objects possessing properties. It remains a realism about structure/constraints, not things.
      *   *Against Instrumentalism:* OSR + MS avoids Instrumentalism because it treats the modal constraints as **ontologically fundamental**, not just empirically adequate tools. The constraints *are* the reality of the physical world, not just predictors of observation.
  *   *The Burden of Entities:* OSR treats entities as **unnecessary**. MS agrees. In a permutation-symmetric state, OSR + MS would argue that the symmetry group *is* the physical reality, representing a modal constraint on how energy and information can be distributed, without requiring "particles" to hold the energy.

  #### Conclusion

  The hypothetical turn to Modal Structuralism exposes the fragility of Worrall's ESR while reinforcing the robustness of Ladyman and Ross's OSR. ESR relies on a distinction between structure and nature that MS renders obsolete; accommodating MS forces ESR to abandon the "realism" in its name, sliding toward instrumentalism. OSR, having already jettisoned individual objecthood in favor of ontic priority for relations, can accommodate the modal turn by reinterpreting "ontic structure" as "modal constraint."

  While OSR risks drifting into a Pythagorean realism about mathematical necessity, it remains the only position capable of integrating Modal Structuralism without collapsing. It successfully maintains that the disappearance of individual objecthood in QM is not an epistemic failure (ESR) but an ontological revelation that physical reality consists of necessary structural constraints rather than contingent arrangements of things. Thus, OSR provides the more stable metaphysical foundation for a physics where structure is modal and relata are absent.
