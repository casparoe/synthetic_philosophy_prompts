answer: |-
  Here is a complete simulation design for your 60-minute discussion section. It is built to be robust, scalable, and pedagogically precise, ensuring the pathologies emerge from the structure of the voting, not the behavior of the students.

  ### **Simulation Overview: The Town of Polyville**

  **The Scenario:** The class acts as the electorate of Polyville. There are five proposed spending measures. The town has a strict budget cap.
  **The Goal:** Pass a package of measures that maximizes public welfare without bankrupting the town.
  **The Stake:** The outcome determines the format of your final review session.
  *   **If Round 1 succeeds (Under Budget):** You get a "Mixed Review" (Game + Q&A).
  *   **If Round 1 fails (Over Budget):** The "Bankruptcy Clause" triggers. You get a **Silent Reading Session** (you read the textbook silently for 50 minutes; no TA instruction).
  *   **If Round 2 succeeds:** The specific measures passed in Round 2 determine the review activities (e.g., if "Practice Exam" passes, you get a practice exam).

  ---

  ### **1. The Materials**

  #### **A. The Measures (Projector Slide)**
  Display this clearly at the front.
  *   **Measure A:** New Library Wing (Cost: $10)
  *   **Measure B:** Park Renovation (Cost: $10)
  *   **Measure C:** Road Repair (Cost: $10)
  *   **Measure D:** Security Cameras (Cost: $10)
  *   **Measure E:** Community Pool (Cost: $10)
  *   **Total Budget:** $30 (Max 3 measures can pass).
  *   **Rule:** If total cost exceeds $30, the Town Bankrupts. **Payoff for everyone: -10 Utility Points.** (Silent Reading Session).
  *   **Rule:** If total cost is ≤ $30, **Payoff: Sum of your personal values for passed measures.**

  #### **B. The Preference Cards (Index Cards)**
  You need 20 cards. Pre-write these before class. Divide the class into 4 "Factions" of 5 students. Hand them out randomly, but keep track of which Faction sits where so you can manage absences.

  *   **Faction 1 (5 Cards):**
      *   Value: A ($6), B ($6), C ($6), D ($0), E ($0).
      *   *Instruction:* "Vote Yes on any measure with positive value."
  *   **Faction 2 (5 Cards):**
      *   Value: B ($6), C ($6), D ($6), E ($0), A ($0).
      *   *Instruction:* "Vote Yes on any measure with positive value."
  *   **Faction 3 (5 Cards):**
      *   Value: C ($6), D ($6), E ($6), A ($0), B ($0).
      *   *Instruction:* "Vote Yes on any measure with positive value."
  *   **Faction 4 (5 Cards):**
      *   Value: D ($6), E ($6), A ($6), B ($0), C ($0).
      *   *Instruction:* "Vote Yes on any measure with positive value."

  **Why this works:**
  *   **Measure A:** Supported by Factions 1 & 4 (10 voters) + *You need 1 more.*
      *   *Correction for Robustness:* To ensure a clear majority (11+) even if students are absent, adjust the cards slightly.
      *   **Revised Distribution:**
          *   **Faction 1 (5 students):** Yes on A, B, C.
          *   **Faction 2 (5 students):** Yes on B, C, D.
          *   **Faction 3 (5 students):** Yes on C, D, E.
          *   **Faction 4 (5 students):** Yes on D, E, A.
      *   **Vote Counts:**
          *   A: F1 + F4 = 10. (Risk of tie if absent).
          *   **Fix:** Make **Faction 1** support A, B, C, **D**. (Now A has 10, D has 20).
          *   **Better Fix:** Just tell the students: "If you are absent, I will vote your card sincerely." This guarantees the math holds.
      *   **Final Card Text:**
          *   **Type 1 (5 cards):** High Value on A, B, C. (Vote Yes on A, B, C).
          *   **Type 2 (5 cards):** High Value on B, C, D. (Vote Yes on B, C, D).
          *   **Type 3 (5 cards):** High Value on C, D, E. (Vote Yes on C, D, E).
          *   **Type 4 (5 cards):** High Value on D, E, A. (Vote Yes on D, E, A).
      *   **Totals:**
          *   A: Type 1 + Type 4 = 10 Votes.
          *   B: Type 1 + Type 2 = 10 Votes.
          *   C: Type 1 + Type 2 + Type 3 = 15 Votes.
          *   D: Type 2 + Type 3 + Type 4 = 15 Votes.
          *   E: Type 3 + Type 4 = 10 Votes.
      *   **Critical Adjustment:** To guarantee the "Over Budget" pathology, **you (the TA)** must hold 2 "Wildcard" cards (Type 1 and Type 3) in your pocket. If attendance is 18 or 19, you vote these cards to ensure every measure gets at least 11 Yes votes. If attendance is 20, you don't vote. This ensures the simulation never fails due to sickness.

  #### **C. Voting Ballots**
  Small slips of paper. "Measure A: [ ] Yes [ ] No", etc.

  ---

  ### **2. Voting Rules**

  **Round 1: The Referendum (Simultaneous)**
  1.  **Secret Ballot:** Students mark Yes/No for all 5 measures independently.
  2.  **Sincerity Constraint:** "Vote based on whether *you* want the measure, not on what you think the budget total will be. In a real referendum, you don't know how others will vote."
  3.  **Aggregation:** You count the Yes votes. If Yes > 50% (11+), the measure passes.
  4.  **Budget Check:** Sum the costs of passed measures. If >$30, Bankruptcy.

  **Round 2: The Sequential Appropriation**
  1.  **Public Vote:** Show of hands.
  2.  **Running Tally:** You track the budget on the projector.
  3.  **Cutoff:** Once $30 is reached, voting stops immediately. Remaining measures automatically fail.
  4.  **Agenda Setter:** One student is randomly chosen as "Town Clerk." They choose the order in which measures are voted on.

  ---

  ### **3. Minute-by-Minute Timeline (60 Minutes)**

  *   **00:00 – 00:05: Setup & Stakes**
      *   Explain the Polyville scenario and the Review Session Stake.
      *   Hand out Preference Cards.
      *   **Crucial:** Collect cards from any empty seats immediately. Tell them: "I will vote these sincerely to ensure the simulation is fair." (This prevents the "stacked cards" accusation later).
  *   **00:05 – 00:15: Round 1 Voting**
      *   **No Deliberation.** (See note below).
      *   Distribute ballots. 3 minutes to vote.
      *   Collect and count publicly on the projector.
  *   **00:15 – 00:20: The Reveal**
      *   Announce which measures passed (Likely all 5).
      *   Announce Total Cost ($50).
      *   Declare **Bankruptcy**.
      *   Ask: "Who is happy with this outcome?" (No hands). "Who voted sincerely?" (All hands).
  *   **00:20 – 00:25: Round 2 Setup**
      *   Explain the Sequential Rule.
      *   Randomly select the **Town Clerk** (draw a name from a hat).
      *   Give the Clerk 2 minutes to decide the voting order privately.
  *   **00:25 – 00:40: Round 2 Voting**
      *   Clerk announces order (e.g., E, D, C, B, A).
      *   Class votes publicly on each.
      *   Stop when budget hits $30.
      *   Announce the Final Bundle.
  *   **00:40 – 00:55: Debrief**
      *   Map observations to theory (see below).
  *   **00:55 – 01:00: Wrap Up**
      *   Confirm the Review Session format based on Round 2.
      *   Dismiss.

  ---

  ### **4. Deliberation: To Allow or Not?**

  **Recommendation: Do NOT allow deliberation before Round 1.**

  *   **Why:** The learning objective of Round 1 is to demonstrate the **Ostrogorski Paradox** (or a variation of cyclical majorities/aggregation failure). This paradox relies on voters making isolated decisions without coordinating.
  *   **What happens if you allow it:** Students will quickly realize the budget constraint. They will attempt to **logroll** ("I'll vote No on Pool if you vote No on Road").
  *   **The Problem:** In a secret ballot referendum, logrolling is unenforceable. I can promise to vote No, but you can't verify it. By forbidding deliberation, you mimic the isolation of the voting booth. This ensures the "bad outcome" comes from *sincere* voting, not failed negotiation.
  *   **Exception:** Allow 2 minutes of "Campaigning" where they can shout out preferences but cannot make binding deals. This adds energy but preserves the structural flaw.

  ---

  ### **5. Troubleshooting Predictable Issues**

  **Issue 1: The Logroller**
  *   **Scenario:** A student says, "If we all just vote No on Measure E, we save the budget!"
  *   **Response:** "That is a strategic vote. For Round 1, I need you to vote your *preference card*. In a mass referendum, you cannot know if others will keep that promise. Vote sincerely."

  **Issue 2: The Accusation ("You Stacked the Cards")**
  *   **Scenario:** A student claims the preferences were rigged to cause failure.
  *   **Response:** "I collected the empty seats' cards and voted them myself. The distribution is 4 factions of 5. Even if you change the groups, as long as preferences are concentrated and the budget is tight, this happens. The math is on the projector. The lesson isn't about my cards; it's about the voting rule."
  *   **Prevention:** Have a student shuffle the cards before distribution.

  **Issue 3: The Clerk Colludes**
  *   **Scenario:** The Clerk asks their friends what they want before setting the order.
  *   **Response:** Allow it. This *enhances* Round 2. It demonstrates that the Clerk becomes a de facto dictator by controlling the agenda. It proves the point that sequential voting empowers the agenda-setter.

  ---

  ### **6. The Debrief Strategy (Mapping to Theory)**

  Do not start with jargon. Start with their feelings.

  **Step 1: The Round 1 Failure (Aggregation)**
  *   **Ask:** "Everyone voted sensibly. Everyone wanted to stay under budget. Why did we go bankrupt?"
  *   **Listen:** They will say "We didn't coordinate," or "We voted on pieces, not the whole."
  *   **Map:** "This is the critique of **unstructured majoritarianism**. When issues are voted in isolation, the sum of the parts does not equal a coherent whole. James Madison feared this in *Federalist 10*—factions forming temporary majorities on specific issues that destroy the common good."

  **Step 2: The Round 2 Swing (Agenda Power)**
  *   **Ask:** "Did the outcome change based on the Clerk's order? If the Clerk had put your favorite item last, would it have passed?"
  *   **Listen:** They will realize the order determined the winner.
  *   **Map:** "This is **Agenda Setting Power**. In sequential voting, the person who controls the calendar controls the outcome. This connects to **Social Choice Theory** (Arrow's Theorem). There is no perfect voting system; every method has a flaw. Round 1 failed on aggregation; Round 2 fails on neutrality."

  **Step 3: The Limitation (What the exercise didn't show)**
  *   **State:** "This simulation assumed you were **well-informed**. You had perfect information on your cards. In real direct democracy, the bigger problem is often **Rational Ignorance**. Voters don't read the 50-page ballot pamphlet. If you add ignorance to the structural flaws we just saw, the case against referendums gets much stronger."

  ---

  ### **7. Limitations of the Exercise**

  You must explicitly state this at the end to maintain intellectual honesty:

  1.  **Intensity:** Real referendums ignore intensity (one person, one vote). Our cards *had* intensity, but the vote didn't capture it. We didn't test mechanisms like Quadratic Voting that *do* capture intensity.
  2.  **Campaign Finance:** We assumed equal voice. In reality, money influences the "Order" and the "Information" available to voters.
  3.  **Single-Peakedness:** I designed your preferences to be simple. In reality, preferences are messy. This simulation is a "best case" for democracy that still failed.

  ### **8. Contingency for Absences**

  *   **If 17-19 students show:**
      *   Use the "Wildcard" cards you kept.
      *   If 19 show, vote 1 Wildcard. If 18 show, vote 2 Wildcards.
      *   Vote them **sincerely** according to their Faction type.
      *   Announce this publicly at the start: "I hold backup cards to ensure the math works regardless of attendance. I will vote them openly."
  *   **If <17 students show:**
      *   The majority threshold drops (e.g., 9/17). The math still holds because each measure has 10-15 inherent supporters in the deck. The pathology will still fire.

  ### **9. Final Review Session Stake Details**

  To make this concrete without being punitive:
  *   **Measures A & B:** "Active Review" (Quiz Bowl / Game).
  *   **Measures C & D:** "Passive Review" (Lecture / Study Guide).
  *   **Measure E:** "Extra Credit Opportunity."
  *   **If Bankruptcy (Round 1):** "TA selects the format" (You select the one students usually like least, e.g., Silent Reading).
  *   **If Success (Round 2):** Implement whatever passed. (e.g., If only C and D passed, you give a Lecture and a Study Guide).

  This design ensures they feel the frustration of the paradox personally, making the subsequent political theory reading stick much harder.
