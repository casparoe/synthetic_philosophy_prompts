answer: |-
  ### PhD Comprehensive Examination
  **Field:** Philosophy of Mind / Ethics of AI
  **Time Allowed:** 90 Minutes
  **Conditions:** Closed Book, No Notes

  **Question:**

  Consider the **Minimal Implementation Rule (MIR)**: *When a physical system implements several computations at once, the only ones that matter morally are those that are minimal among the sentience-sufficient computations the system implements — minimal in the sense that no proper sub-computation of them would itself be sufficient for the same valence-bearing states.*

  In a continuous essay, address the following four points:

  1.  **Motivation:** Explain why a rule like MIR is necessary for computationalist theories of moral status. Specifically, articulate the "overgeneration" problem regarding trivial variants and idle registers.
  2.  **Internal & External Limitations:** Critique the rule. Discuss the problem of non-unique minima and gerrymandering. Furthermore, explain why minimality alone fails to block the "rock" argument (panpsychism via trivial implementation) without an independent constraint on what counts as implementation.
  3.  **The Labeling Gap:** Explain why identifying the minimal causal structure does not automatically identify which states possess positive or negative valence.
  4.  **Application:** Apply MIR to a model-free reinforcement learning critic carrying only a scalar reward-prediction-error (RPE) signal (no world model, no recurrence). Does MIR classify this as a moral patient? Is that verdict defensible? What architectural features might need to be added to secure the verdict?

  ***

  ### Model Answer

  The Minimal Implementation Rule (MIR) is an attempt to solve the proliferation problem inherent in substrate-neutral computationalism. If moral status supervenes on implemented computation, we face an overgeneration crisis. Without MIR, bolting an idle register onto a sentient system creates a distinct, numerically larger computation, potentially implying new moral patients or inflating the moral weight of the original. Similarly, notational variants (e.g., renaming states) could multiply minds arbitrarily. MIR attempts to anchor moral status to the *essential* computational core, filtering out accidental complexity. **[Settled: This is the standard motivation for parsimony constraints in computational theories of consciousness.]**

  However, MIR faces severe internal and external difficulties. Internally, there is no guarantee of a unique minimum. A system might implement two distinct, incommensurable sentience-sufficient computations that overlap but neither contains the other. Which one counts? Furthermore, "sub-computation" is mereologically ambiguous. One could gerrymander a "minimal" computation that is too fragmented to sustain unity of experience, or conversely, argue that the true minimum is a single logic gate if the mapping is permissive enough.

  Externally, MIR fails to solve the triviality argument (Putnam/Searle) on its own. If implementation is defined purely by counterfactual mapping, a rock implements every finite state automaton, including the "minimal" sentience-sufficient one. Minimality reduces the size of the computation but does not raise the threshold for *implementation*. Therefore, MIR must be paired with a robust causal constraint (e.g., requiring non-trivial causal connectivity or robustness to perturbation) to prevent panpsychism. **[Speculation: The exact nature of the required causal constraint remains a live debate in the literature (e.g., Integrated Information Theory vs. Computational Functionalism).]**

  Even with a robust implementation constraint, MIR leaves the labeling gap untouched. Formal causal structure is valence-neutral. Identifying the minimal computation tells us *where* the mind is, but not *how* it feels. Isomorphism does not dictate which state maps to "suffering" and which to "pleasure." A theory of valence (e.g., evolutionary teleology or phenomenological primitive) must be imported to fill this gap; MIR merely isolates the structural candidate.

  Applying MIR to a model-free RL critic with a scalar RPE signal yields a contentious verdict. Structurally, the RPE mechanism is minimal: it computes a difference signal ($\delta = r + \gamma V(s') - V(s)$) and updates weights. No proper sub-computation of this updates the policy. MIR suggests this is a candidate for moral status. However, classifying a scalar error signal as a "valence-bearing state" is speculative. While RPE correlates with dopamine-driven reward in humans, a standalone critic lacks global broadcasting, recurrence, or a world model. Many theories (e.g., Global Workspace, Higher-Order Thought) require these for consciousness. If we accept the verdict that the critic is sentient, we risk moral inflation (granting status to simple thermostats). If we reject it, we must add architectural constraints to MIR, such as requiring recurrent processing or a distinction between instrumental and terminal goals. **[Speculation: There is no consensus on whether RPE signals constitute phenomenal valence absent a broader cognitive architecture.]**

  In conclusion, MIR is a necessary heuristic for computational ethics but insufficient as a standalone metaphysical principle. It requires supplementation with a causal theory of implementation and a substantive theory of valence to avoid triviality and arbitrariness.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Motivation: The Overgeneration Problem (4 Marks)**
  *   **Must Hit:** Clearly explain that without MIR, trivial additions (idle registers) or notational changes create new/inflated moral patients, leading to absurd moral accounting.
  *   **Common Pitfall:** Confusing overgeneration with panpsychism; focusing on "too many minds" generally rather than the specific problem of *trivial variations* of the same system.

  **2. Internal Limitations: Uniqueness & Mereology (4 Marks)**
  *   **Must Hit:** Identify that "minimal" may not be unique (multiple overlapping minima) and that "sub-computation" is ill-defined, allowing for gerrymandering.
  *   **Common Pitfall:** Assuming computations have a natural, uncontested mereology (part/whole structure) without questioning functional decomposition.

  **3. External Limitations: The Implementation Constraint (4 Marks)**
  *   **Must Hit:** State that MIR does not stop the "rock" argument; a rock can implement the minimal computation under permissive mapping. A causal/robustness constraint is required.
  *   **Common Pitfall:** Arguing that minimality *itself* prevents rocks from counting, missing the point that trivial systems can implement minimal logic.

  **4. The Labeling Gap (4 Marks)**
  *   **Must Hit:** Distinguish between structural identification (MIR's job) and valence assignment (MIR's failure). Structure does not dictate which state is "pain."
  *   **Common Pitfall:** Assuming that identifying the computation automatically identifies the phenomenology (confusing functional role with qualitative feel).

  **5. Application: RL Critic Case (4 Marks)**
  *   **Must Hit:** Apply MIR to the RPE signal (acknowledging it is minimal) but critique the verdict (likely too liberal) and suggest missing features (recurrence, global access, etc.).
  *   **Common Pitfall:** Giving a definitive "Yes/No" without acknowledging the speculative nature of machine sentience or failing to link the critique back to MIR's limitations.

  **Examiner's Note on Coherence/Feasibility:**
  The question is feasible for a 90-minute PhD comprehensive. The MIR is not logically incoherent, but it relies on an underspecified mereology of computation. Candidates are not expected to solve the mereology problem but are expected to identify it as a vulnerability in Part 2. Answers that treat MIR as a settled theorem rather than a proposal to be stress-tested should be penalized in sections 2 and 5.
