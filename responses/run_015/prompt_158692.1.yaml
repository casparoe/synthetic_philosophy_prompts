  1. Scenario
  Two senior analysts, Alice and Bob, work for the same hedge fund. They are evaluating a binary event: whether a specific merger will succeed ($E$) or fail ($E^c$). Both share a common prior derived from historical data. Each receives a private signal from a proprietary model, generating partitional information. Before trading, they privately exchange their probability estimates for $E$; Alice sees Bob's number, Bob sees Alice's, and neither updates upon seeing the other's figure. They then submit sealed buy/sell orders for a contract paying \$1 if $E$ occurs, at a fixed price of \$0.60. A clearing engine crosses the orders without revealing identity or volume until settlement. Both agents are risk-neutral and hold no prior exposure. The setting is ordinary, but the information structure creates a pocket of disagreement that survives their mutual awareness of each other's views.

  2. Formal setup
  The state space is $\Omega = \{1, 2, 3, 4, 5, 6\}$. The common prior $P$ assigns probabilities proportional to $(2, 1, 1, 1, 4, 2)$, summing to 11. The event is $E = \{1, 3, 5\}$. Alice's partition is $I_A = \{\{1, 2\}, \{3, 4\}, \{5, 6\}\}$. Bob's partition is $I_B = \{\{1, 6\}, \{2, 3\}, \{4, 5\}\}$. The actual state is $\omega = 1$. The bet is zero-sum: Alice buys, Bob sells at price $q=0.6$. The meet of the partitions is the trivial partition $\{\Omega\}$ because the cells form a connected cycle ($1-2-3-4-5-6-1$). The meet cell at $\omega$ is $\Omega$ itself. This structure ensures that while local knowledge exists, global common knowledge is impossible without full revelation of the state.

  3. Why both expect to gain
  At $\omega=1$, Alice's cell is $\{1, 2\}$. Her posterior is $P(E|I_A) = 2/(2+1) = 2/3$. Bob's cell is $\{1, 6\}$. His posterior is $P(E|I_B) = 2/(2+2) = 1/2$. Alice expects gain: $2/3 - 0.6 > 0$. Bob expects gain: $0.6 - 1/2 > 0$. Alice knows Bob's posterior because on her cell $\{1, 2\}$, Bob's posterior is constant ($1/2$ at state 1, $1/2$ at state 2). Bob knows Alice's posterior because on his cell $\{1, 6\}$, Alice's posterior is constant ($2/3$ at state 1, $2/3$ at state 6). Thus, they mutually know the posteriors and do not revise. However, "Both Accept" occurs only on $\{1, 2, 6\}$. This event is not a union of meet cells (it is not $\Omega$), so acceptance is not common knowledge.

  4. Why neither result is contradicted
  Aumann's Agreement Theorem requires posteriors to be *common knowledge*. Here, they are only mutually known at $\omega$. The values $2/3$ and $1/2$ are not constant on the meet cell $\Omega$ (e.g., at state 3, Alice's posterior is $1/2$). Thus, the antecedent fails. Similarly, the No-Trade Theorem requires it to be common knowledge that both accept. While Alice knows Bob accepts, and Bob knows Alice accepts, Alice does not know that Bob knows that Alice accepts. (At state 2, which Alice considers possible, Bob considers state 3 possible, where Alice rejects). Since the chain of knowledge breaks at the second iteration, the common-knowledge antecedent for No-Trade fails, permitting the mutually profitable bet.

  5. What is doing the work
  The structural feature generating the case is the cyclic connectivity of the partitions, which prevents the meet from refining beyond the trivial partition. This blocks the iteration of mutual knowledge into common knowledge. If we modify the case so that acceptance is made public and iterated, the agents condition on the event "Both Accept." This eliminates states where one rejects (e.g., state 3). Conditioning shrinks the effective state space. In this specific cycle, public announcement of acceptance would eliminate state 3 and 4, eventually forcing the posteriors to converge on the remaining component or revealing the actual state. The bet survives only as long as the acceptance remains sealed; once public, the common-knowledge condition triggers, and the disagreement collapses.

  6. The strongest objection
  A critic arguing that common priors alone rule out speculation would claim this case is epistemically fragile. In reality, if Alice knows Bob accepts, she should infer Bob has information she lacks (adverse selection). She should reason: "Why is he selling at 0.6 if he knows I'm buying?" This winner's-curse reasoning relies on modeling the other's strategy, not just the prior. You should concede that in practical markets, such mutual knowledge of acceptance without common knowledge is unstable; traders would iterate inferences until trade stops. However, the case still establishes the technical point: the No-Trade theorem's logic depends on the *common-knowledge* operator, not just the prior. Without the iterative closure of knowledge, the mathematical prohibition on trade does not bind, even with perfect rationality.
