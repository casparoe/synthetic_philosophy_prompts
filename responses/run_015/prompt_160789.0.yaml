answer: |-
  This is a sophisticated pedagogical challenge. You are correct: the standard Dollar Auction fails when the "trap" is common knowledge. The students will treat it as a puzzle to be solved (e.g., "bid $1 and stop") rather than an experience to be felt.

  Your intuition about **Private Values** is the correct lever to pull. It solves the "common knowledge" problem and creates the epistemic ambiguity you need for the debrief. However, to truly capture Condition (3) (*investing to learn*), private values alone are insufficient (since the player already knows their value). I recommend a slight modification: **Private Values + An Uncertain "Completion Bonus."** This allows a player to rationalize escalation as "buying information" (Condition 3) while others see it as a trap (Condition 1).

  Here is a complete design for **"The Venture Auction."**

  ### 1. The Core Mechanic: Modified Dollar Auction
  *   **The Prize:** A "Venture."
  *   **The Value:** Composed of two parts.
      1.  **Base Value (Private):** Drawn from a deck at the start. (e.g., 50, 100, 200 points). Only the holder knows this.
      2.  **Completion Bonus (Uncertain):** Either 0 or 150 points. *No one knows this until the auction ends.*
  *   **The Rule (The Trap):** Highest bidder wins the Venture (Base + Bonus). **The second-highest bidder pays their final bid and gets nothing.**
  *   **The "Learning" Twist (Condition 3):** If the bidding reaches **150 points**, the "Due Diligence" rule triggers. The current highest bidder *may* pay a sunk cost of 20 points to reveal the Completion Bonus *before* the auction closes.
      *   *Why this works:* A player with a low Base Value might bid past 150 not because they are trapped, but to buy the right to see the Bonus. If the Bonus is 150, continuing is rational. If 0, they can stop (but they lose the 20). This creates a genuine "invest to learn" scenario.

  ### 2. Materials & Setup (15 Minutes)
  **Room Setup:**
  *   5 Tables (Groups of 4-5 students).
  *   **Roles per Group:**
      *   **Bidders (3-4 students):** Active participants.
      *   **Auditor (1 student):** Does *not* bid. Manages the ledger, chips, and enforces rules. Rotates next session.
  *   **Instructor Role:** Timekeeper and Raffle Master. Do not touch chips. Do not answer rule questions during play (refer to Rule Sheet).

  **Materials per Group:**
  *   **Chip Stack:** 500 chips per group (poker chips or colored paper squares).
  *   **Value Deck:** 5 Cards per group. Values: [50, 50, 100, 200, 200]. (Ensures variance; someone always has a reason to bid high).
  *   **Bonus Envelope:** 1 Sealed Envelope per group containing "0" or "150". (Prepare these beforehand: 3 groups get 0, 2 groups get 150).
  *   **Ledger Sheet:** Columns for Player, Current Bid, Total Paid, Status.
  *   **Rule Sheet:** (See below).

  **The "Sting" (Incentives):**
  *   **Survival Threshold:** Every student starts with **100 Personal Chips** (given individually, not from the group stack).
  *   **Payoff:**
      *   End of class: If you have **< 50 chips**, you are "Bankrupt" (no raffle entry).
      *   If you have **> 150 chips**, you get 3 Raffle Tickets.
      *   **Raffle:** 2 x $25 Coffee Cards drawn from tickets earned.
      *   *Note:* Bidding chips come from your Personal Stack. Losing as 2nd bidder deducts from Personal Stack. This makes the loss personal.

  ### 3. The Prediction Sheet (5 Minutes)
  *Hand this out before revealing the Private Values.*

  > **Pre-Game Forecast**
  > 1.  What is the maximum rational bid for a prize worth 100 points? \_\_\_\_\_
  > 2.  If you are the second-highest bidder at 90 points, and your value is 50, do you bid 100? (Yes/No) \_\_\_\_\_
  > 3.  What is the most common reason people escalate commitment in organizations? \_\_\_\_\_
  > 4.  **Commitment:** I will not collude with my group to fix the price. (Initials) \_\_\_\_\_

  *Collect these immediately. Do not let them discuss.*

  ### 4. Running the Rounds (30 Minutes)
  **Phase 1: Distribution (5 mins)**
  *   Hand out Personal Chips (100 each).
  *   Hand out Private Value Cards (face down). Tell them: *"This is what the venture is worth to you specifically. Do not show anyone."*
  *   Place Bonus Envelope in center (sealed).
  *   Appoint Auditor. Give them the Ledger.

  **Phase 2: The Auction (20 mins)**
  *   **Start:** Instructor calls "Markets Open."
  *   **Minimum Bid:** 10 chips.
  *   **Increment:** 10 chips minimum.
  *   **The "Shutdown" Prevention:** The auction cannot end until **5 bids** have been placed total in the group. (Prevents the "$1 opener" from killing the game immediately).
  *   **The "Due Diligence" Trigger:** If bidding crosses 150, Auditor announces: *"Due Diligence Available."* Highest bidder can pay 20 chips to open the Bonus Envelope.
  *   **Time Call:** At 18 minutes, announce *"Two minutes remaining. Current bids stand if time expires."* (This creates end-game panic escalation).

  **Phase 3: Settlement (5 mins)**
  *   Auction ends (no new bids for 60 seconds OR time expires).
  *   Auditor calculates payments:
      *   Winner: Pays bid, receives Prize (Base + Bonus).
      *   Runner-Up: Pays bid, receives nothing.
      *   Others: Pay nothing.
  *   Students count personal chips. Auditor signs off on Ledger.
  *   Collect Prediction Sheets and Ledgers.

  ### 5. The Debrief (25 Minutes)
  *Do not start by explaining the theory. Start with the data.*

  **Step 1: The Wall of Shame (5 mins)**
  *   Project the Ledgers on the screen (anonymize names, use Group/Player ID).
  *   Highlight the **Runner-Up** in each group who paid >50 chips.
  *   Ask: *"Player 2 in Group 1 paid 80 chips for nothing. Raise your hand if you think this was irrational."* (Most will raise hands).
  *   Ask Player 2 (if willing): *"At 70 chips, why did you bid 80?"*
      *   *Expected Answer:* "I didn't want to lose the 70." (This is Condition 1: The Trap).

  **Step 2: Mapping the Three Conditions (10 mins)**
  *   Draw three columns on the board: **Trap**, **Fool**, **Rational**.
  *   **Condition 1 (The Trap):** Point to a Runner-Up who had a Low Value Card (e.g., 50) but bid 80.
      *   *Script:* "You entered rationally. But once you were second, your payoff matrix changed. Losing 70 was certain; winning for 80 offered a slim chance to break even. Locally rational, globally irrational."
  *   **Condition 2 (The Fool):** Point to a Winner who paid 200 for a Base Value of 50 (and Bonus was 0).
      *   *Script:* "You weren't trapped by a previous bid. You simply overvalued the asset relative to the risk. This is throwing good money after bad because no new information justified the cost."
  *   **Condition 3 (The Rational Gamble):** Point to a group where someone opened the Bonus Envelope.
      *   *Script:* "Group 3 bid past 150. They paid the 20-point fee to open the envelope. They found out the Bonus was 150. Their escalation was the *only* way to verify the value. To the rest of you, they looked like they were in the Trap. In reality, they were buying information."

  **Step 3: The Observer's Problem (5 mins)**
  *   *Script:* "Here is the critical takeaway. During the game, could you tell the difference between the Trapped Player and the Rational Gambler?"
  *   *Answer:* No.
  *   *Lesson:* "In organizations, you are always the observer. You see a colleague pouring money into a failing project. Are they trapped (1)? Are they foolish (2)? Or do they know something you don't (3)? You cannot know. This ambiguity is what protects escalation in the real world."

  **Step 4: Local vs. Global Rationality (5 mins)**
  *   *Script:* "Expected Utility Theory says you should maximize value. But EU is calculated *ex-ante* (before the game). Once you are in the game, your 'rational' move is to minimize loss. The game punishes you for the global mistake (entering) by making the local move (bidding more) the only survival option. That is the definition of a trap."

  ### 6. Troubleshooting: What Will Go Wrong
  **1. The "$1 Opener" / Shutdown Artist**
  *   *Risk:* A student bids the minimum (10) and refuses to move, hoping no one else bids.
  *   *Fix:* The **5-Bid Minimum Rule** (stated in Phase 2). The auction *cannot* close until 5 bids are logged. This forces engagement.
  *   *In-Room Action:* If a group stalls at 1 bid, the Auditor must remind them: *"Market is not closed. 4 more bids required."*

  **2. The Colluders**
  *   *Risk:* "I'll bid 10, you bid 20, we split the prize."
  *   *Fix:* The **Second-Highest Pays Rule** kills collusion naturally. If we agree I win at 20, you (the second) still pay 20 for nothing. Collusion is dominated.
  *   *In-Room Action:* If you hear them plotting, interrupt: *"Remember, the second bidder pays regardless of agreements."*

  **3. The Refusers (Principled Non-Bidders)**
  *   *Risk:* Students sit out to prove they are "too smart" for the game.
  *   *Fix:* The **Survival Threshold**. If they don't play, they keep their 100 chips. *However*, announce beforehand: *"Participation credit requires active bidding. One bid minimum."*
  *   *In-Room Action:* If a student refuses, the Auditor must record them as "Active Non-Bidder." In the debrief, ask them: *"Did you stay out to avoid the trap, or to avoid the work?"* Make their inaction a data point.

  **4. The Speed Disparity**
  *   *Risk:* Group 1 finishes in 3 minutes. Group 5 is still going at 20 minutes.
  *   *Fix:* **Hard Stop.** At 20 minutes, call *"Time. Freeze bids."* The current highest bidder wins at current price. Second highest pays.
  *   *In-Room Action:* This creates a "deadline panic" which often triggers the escalation you want.

  **5. The Credibility Challenge**
  *   *Risk:* "The Instructor rigged the Bonus Envelopes."
  *   *Fix:* **Student Auditors** open the envelopes, not you. You collect the envelopes *after* they are opened and shown to the table.
  *   *In-Room Action:* If accused, say: *"The Auditors control the data. I only collect the raffle tickets."*

  ### 7. Limitations: What This Game Cannot Reproduce
  *Be explicit about this in the final 5 minutes.*

  **1. The Moving Goalpost**
  *   *Game:* The prize value is fixed (Base + Bonus).
  *   *Reality:* In organizations, the "value" of the project often gets redefined mid-stream ("It's not about profit anymore, it's about market share").
  *   *Debrief Script:* "In this game, the value was static. In your careers, the value will change. Leaders will redefine success to justify past costs. That is harder to model than a fixed prize."

  **2. Social Face**
  *   *Game:* You lose chips.
  *   *Reality:* You lose reputation. Walking away signals weakness to competitors and colleagues.
  *   *Debrief Script:* "Here, bankruptcy just means no coffee card. In a firm, quitting a project can mean losing your authority to lead future projects. The 'cost' of walking away is often higher than the cost of continuing."

  **3. The "Who Knows What" Ambiguity**
  *   *Game:* You know your own value.
  *   *Reality:* You often don't know your own value *or* the competitor's.
  *   *Debrief Script:* "Condition 3 (Rational Gamble) relied on you knowing your Base Value. In reality, you are often investing to find out *both* the cost *and* the value. That is the true fog of war."

  ### Summary Checklist for Instructor
  1.  **Prep:** 5 Bonus Envelopes (3x "0", 2x "150"). 25 Value Cards (5 sets of 50, 50, 100, 200, 200). Chips.
  2.  **Intro:** Emphasize **Second-Highest Pays** and **Personal Chip Stack**.
  3.  **Play:** Enforce 5-bid minimum. Hard stop at 20 mins.
  4.  **Debrief:** Focus on the **Observer's Ambiguity**. You can't tell the Rational Gambler from the Trap Victim.
  5.  **Honesty:** Admit the game simplifies social face and goalpost shifting.

  This design respects their intelligence (by adding private info/uncertainty), forces the emotional stake (personal chip stack), and gives you the specific theoretical distinctions you need for the seminar.
