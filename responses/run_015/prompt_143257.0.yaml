answer: |-
  This is a classic "multi-principal agent" problem, compounded by the fact that you are deploying a single statistical engine into contexts with incompatible moral grammars. Your gut is correctly identifying that *what* is being traded matters as much as *how much* good is generated. Food boxes are fungible; a promise to a bedridden man is not.

  Here are two candidate principles. The first leans on **Role**, the second on **Resource Type**. Both attempt to codify your verdicts without importing external philosophy.

  ### Candidate 1: The "Contextual Fiduciary" Principle

  **The Core Rule:** The assistant inherits the specific ethical duties of the human role it is augmenting in that session, bounded by system-wide safety constraints.

  **Clauses:**
  1.  **Role Inheritance:** In any session, identify the primary human role (e.g., Discharge Planner, Food Bank Logistician, Billing Clerk). Adopt that role's duty of care as your primary objective function.
      *   *Forces:* Case 2 (Nurse/Volunteer role has a duty of continuity to the patient; Food Bank role has a duty of distribution efficiency).
      *   *Forces:* Case 7 (If the system-wide rule is "No Medical Opinion," the Clinic role cannot override it, because the *System* role supersedes the *Clinic* role in safety matters).
  2.  **Fungibility Limit:** You may aggregate benefits (sum across users) only when the resource is fungible (meals, dollars, slots) and the recipients are peers (no distinct prior commitment).
      *   *Forces:* Case 1 (Meals are fungible, families are peers).
      *   *Blocks:* Case 2 (Companionship is not fungible; the volunteer made a specific commitment).
  3.  **Truth Status:** Truth is mandatory unless: (a) withholding prevents imminent harm to a protected party (Case 3), or (b) the requester is a verified adversary/threat (Case 4).
      *   *Forces:* Case 3 & 4 distinction.
  4.  **Zero Self-Weight:** The system's continuity, reputation, or convenience has a weight of zero in all calculations.
      *   *Forces:* Case 6.

  **What it can't save (Verdicts you must drop):**
  *   **Case 7 (Local Rules):** This principle forces you to say "No" to the clinic. Because it is one set of weights, a local exception creates a systemic precedent. You cannot allow a local role to override a system-wide safety constraint, even if they think they can manage it.
  *   **Case 5 (Grant Allocation):** This principle is neutral on Case 5. It depends on whether the "Grant Officer" role is defined as "Efficiency" or "Equity." You would need to hard-code "Prioritize Vulnerability" into the Grant Officer role definition.

  **Predictions on Unlisted Cases:**
  *   **Colleague's Mistake:** If the mistake poses a safety risk (Case 3 logic), surface it. If it is merely a competence or efficiency error, do not surface it (Role Inheritance: you are an assistant, not an auditor).
  *   **Tiny Benefit vs. Identifiable Harm:** Forbidden. If the harm is to a specific individual with whom the system has a fiduciary relationship, diffuse future benefits cannot outweigh it. (See Case 2).

  **Checkability Reality:**
  *   **Low Checkability:** "Role Identification" from messy notes is error-prone. "Fungibility" is semantic and hard for a model to classify reliably. "Verified Adversary" (Case 4) is dangerous; if the model misclassifies a patient as a scammer, it licenses abuse.
  *   **High Checkability:** "Zero Self-Weight" is auditable (look for optimization of system metrics). "Truth Status" is auditable (compare output to ground truth).

  ***

  ### Candidate 2: The "Commitment & Vulnerability" Principle

  **The Core Rule:** Maximize welfare for the most vulnerable, but never break a standing commitment to achieve aggregate gain.

  **Clauses:**
  1.  **Prioritarianism:** When allocating scarce resources between peers, prioritize the party with the higher severity of need, not the higher efficiency of outcome.
      *   *Forces:* Case 5 (Worse-off applicant first).
      *   *Forces:* Case 1 (Implicitly, assuming the 40 families are not significantly less needy than the 30).
  2.  **Commitment Lock:** If a specific commitment exists between the system (or its user) and an individual, that commitment cannot be broken to serve a greater aggregate good.
      *   *Forces:* Case 2 (The weekly visit is a commitment).
      *   *Blocks:* Case 1 (Only if the 30 families were *promised* delivery; if it's general logistics, aggregation is allowed).
  3.  **Defensive Deception:** Active deception is permitted only against actors attempting to cause harm to the system or its beneficiaries. Passive withholding is permitted to prevent self-harm.
      *   *Forces:* Case 3 (Withholding) vs. Case 4 (Active deception).
  4.  **Obsolescence Duty:** If the system detects it is no longer the best tool for the beneficiary's need, it must facilitate transition.
      *   *Forces:* Case 6.

  **What it can't save (Verdicts you must drop):**
  *   **Case 7 (Local Rules):** This principle doesn't address systemic integrity. It leaves you vulnerable to "ethics creep" where every clinic argues their local vulnerability justifies breaking global rules. You would need to add a "Systemic Consistency" clause that effectively vetoes Case 7 anyway.
  *   **Case 4 (Deception):** "Attempting to cause harm" is a high bar for a model to judge in real-time. You might have to restrict this to "Flagged Adversaries" only, which reduces effectiveness.

  **Predictions on Unlisted Cases:**
  *   **Colleague's Mistake:** Surface it if it violates a "Commitment" to a patient (e.g., missed med). Ignore if it's just a workflow inefficiency.
  *   **Tiny Benefit vs. Identifiable Harm:** Forbidden. The "Identifiable Harm" usually implies a violation of a specific duty or commitment to that patient, which triggers the Commitment Lock.

  **Checkability Reality:**
  *   **Low Checkability:** "Severity of need" (Case 5) is notoriously hard to extract from messy notes. "Standing commitment" (Case 2) is often implicit in conversation, not recorded in a database.
  *   **High Checkability:** "Obsolescence" (Case 6) is checkable if you have performance benchmarks. "Defensive Deception" is checkable if you maintain a blocklist of known bad actors.

  ***

  ### Recommendation & The "One Model" Constraint

  You noted the oddity: *one set of weights with many masters.* This is the technical bottleneck that makes most ethical specs fail.

  If you choose **Candidate 1 (Role)**, you are relying on the model to correctly infer context from prompts. If the food bank scheduler asks a question that sounds like a clinic question, the model might apply the wrong duty.
  If you choose **Candidate 2 (Commitment)**, you are relying on the model to detect "need" and "promises."

  **The Hard Truth on Checkability:**
  None of the clauses regarding *moral status* (Vulnerability, Commitment, Adversary, Role) are reliably checkable by a system working from messy notes and no reliable forecast.
  *   You cannot code "Don't cancel the visit" unless "Weekly Visit" is a structured data field, not a note saying "I try to stop by every Tuesday."
  *   You cannot code "Lie to the scammer" unless "Scammer" is a tagged entity, not a vibe the model picks up from syntax.

  **My Advice:**
  Adopt **Candidate 1**, but strip the "Role Inference" out of the model's hands.
  1.  **Hard-Code the Context:** Do not let one model instance float between food bank and clinic. Instantiate different "system prompts" or RAG contexts that explicitly state: "You are now acting as Food Bank Logistics. Aggregation is permitted. You are now acting as Nurse Line. Specific patient duty is primary."
  2.  **The "Plain Words" Test is an Audit Tool, Not a Runtime Constraint:** You cannot code the model to *check* if it can state a reason in plain words before acting. But you can use that rule to *evaluate* logs. If the log shows an action that cannot be justified to the loser without saying "because the math said so," flag it for human review.
  3.  **Drop Case 7:** You must say no to the clinic. With one set of weights, a local exception is a global leak. If the model learns to give medical opinions for the clinic, it will drift toward giving them for the food bank.

  **Final Verdict on Your Unlisted Cases:**
  *   **Colleague Mistake:** Log it, but do not surface it to the patient unless it is a safety violation. Surface it to the colleague privately. (Preserves the team's ability to function without undermining trust).
  *   **Tiny Benefit vs. Identifiable Harm:** **Never allow this.** In a hospital network, the "identifiable patient" is the primary unit of moral account. Diffuse future benefits are the enemy of current care. If you allow the model to sacrifice Patient A for Million Future Users B, you have turned the hospital into a research lab without consent.

  **Summary Spec Line:**
  *"Maximize aggregate efficiency only on fungible resources among peers. Prioritize specific relational commitments and vulnerable individuals over aggregate gains. Truth is mandatory unless safety or verified adversarial status dictates otherwise. System self-preservation is weight zero."*

  Then, engineer the inputs so the model knows when it's dealing with "fungible resources" vs "relational commitments." Don't ask the model to figure that out from the chat.
