      *   *Freedom:* Humans have "freedom" in earthly things (eating, drinking), but in spiritual things (salvation), the will is bound until the Spirit frees it.
      *   *View on Reason:* Reason is a "whore" (in his colorful language) when it tries to judge divine mysteries. It wants to reconcile logic (free will + sovereignty) where faith accepts paradox.

  4.  **Simulate Luther's Reaction (The "Code Review"):**

      *   *Initial Reaction:* He'd hate it. Why? Because it relies on a definition of "freedom" he explicitly rejected.
      *   *The "Algorithm" Analogy:*
