          *   Tech view: If the prediction is infallible, the output is fixed.
          *   Luther's view: If the output is fixed *by the creature's nature*, God isn't sovereign. If the output is fixed *by God*, the creature isn't free (in the libertarian sense). Luther chooses God's sovereignty. Molinism tries to have both. Luther would call this a logic error.
      *   *The "Smuggling" Charge:*
          *   Luther would absolutely say Molinism smuggles in "Pelagianism" (the idea that man contributes to salvation) via the back door. By saying "God knew you *would* choose Him," it implies the capacity to choose Him lies within the human, not solely in Grace.
