      *   *Process:* God knows "Counterfactuals of Creaturely Freedom" (e.g., "If Peter is in situation S, he will freely deny Christ"). This is *Middle Knowledge* (between natural knowledge of necessary truths and free knowledge of actual truths).
      *   *Decision:* God actualizes World W because in W, people freely do what God wants.
      *   *Output:* The actual history we live in.
      *   *Claim:* Preserves human freedom (libertarian) and divine sovereignty.

