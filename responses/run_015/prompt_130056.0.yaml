answer: |-
  This is the right question. Benchmarks are psychometrics for machines; they measure *performance*, not *mechanism*. A theory of intelligence must be mechanistic and explanatory, not just predictive. If a theory cannot explain why a corvid can bend a wire to hook a bucket but a 100B parameter model hallucinates physics, it is a theory of compression, not intelligence.

  Here is the spec for a valid Theory of Intelligence, broken down by phenomena, distinctions, constraints, and the impossibility results you asked for.

  ---

  ### 1. The Phenomena (The "Must Explain" List)
  A theory fails if it treats these as edge cases. They are the core data.

  *   **Radical Sample Efficiency:** Why can a human child learn the concept of "danger" or "support" from 1–3 instances, while deep learning requires $10^6$?
      *   *Requirement:* The theory must account for **strong inductive biases**. It cannot be a "blank slate" statistical learner. It must explain where the priors come from (evolution, architecture, or embodiment).
  *   **Causal/Physical Grounding:** The Crow vs. LLM problem. Crows understand *affordances* (what this object *can do*). LLMs understand *co-occurrence* (what words appear near each other).
      *   *Requirement:* The theory must distinguish between **correlational inference** and **causal intervention**. It must explain how a mind builds a world model that supports counterfactuals ("What if I drop this?") without needing to actually drop it.
  *   **Systematic Generalization:** Solving Bongard puzzles or novel tool use. This requires recombining known primitives into new structures.
      *   *Requirement:* The theory must explain **compositionality**. Intelligence is not just interpolation in latent space; it is algebraic manipulation of concepts.
  *   **Goal Stability vs. Flexibility:** Humans pursue long-term goals despite changing immediate contexts. RL agents often suffer from reward hacking or goal drift.
      *   *Requirement:* The theory must explain **instrumental convergence** without collapsing into wireheading. How is the "objective" kept distinct from the "measurement"?

  ### 2. The Distinctions (What Cannot Be Collapsed)
  Many current theories fail because they conflate these variables.

  *   **Intelligence vs. Knowledge:**
      *   *Knowledge* is stored state (parameters, weights, facts).
      *   *Intelligence* is the *rate* at which new knowledge is acquired or applied to novel domains.
      *   *Constraint:* A theory cannot define intelligence as "accuracy on a static test." It must define it as a **derivative** (learning rate) or **compression ratio** (algorithmic complexity of the policy).
  *   **Optimization Power vs. Understanding:**
      *   You can optimize a function without understanding its topology (e.g., evolutionary strategies).
      *   *Constraint:* The theory must distinguish between **brute-force search** and **model-based planning**. If the theory treats a lookup table as equally "intelligent" as a reasoning engine given the same output, it is behaviorist and insufficient.
  *   **Competence vs. Performance:**
      *   Borrowed from linguistics. A system may have the *competence* (internal capacity) but fail due to *performance* errors (memory limits, noise, attention lapses).
      *   *Constraint:* A theory must model the **bottlenecks** (compute, memory, bandwidth) separately from the **algorithm**.
  *   **Agency vs. Social Skill:**
      *   Theory of Mind (ToM) is often treated as a module. But is intelligence inherently social?
      *   *Constraint:* The theory must specify if **prediction of other minds** is a prerequisite for general intelligence or a specialized adaptation. (Current evidence suggests it's deeply entangled with general prediction).

  ### 3. The Tension: Preference Inference vs. Concept Induction
  You identified the split:
  1.  **Inverse RL / Preference:** Intelligence is inferring what an agent *wants* from what it *does*. (Focus: Goals, Rewards, Utility).
  2.  **Concept Induction:** Intelligence is inferring *rules* from sparse data. (Focus: Structure, Logic, Symbols).

  **Should a real theory cover both?**
  **Yes.** A theory that only covers one is incomplete.
  *   *Why:* Goals without structure are blind (random walk toward reward). Structure without goals is useless (perfect model of a world you don't care about).
  *   *The Synthesis:* A valid theory must treat intelligence as **Active Inference**. The agent minimizes "surprise" (concept induction) *in order to* satisfy preferences (goal inference). The "concept" is the map; the "preference" is the destination. You need the map to navigate, but the destination tells you where to look.

  ### 4. Hard Constraints vs. Tribal Preferences
  This is where we separate physics from ideology.

  **Hard Constraints (Non-Negotiable):**
  *   **No-Free-Lunch Theorems:** You cannot be optimal across all possible environments. A theory *must* specify the **class of environments** for which the intelligence is optimized. (e.g., "Physical worlds with local causality").
  *   **Computational Irreducibility:** Some problems cannot be solved faster than simulating them. A theory cannot promise efficient solutions to NP-hard problems in the general case.
  *   **Thermodynamic Cost:** Biological intelligence is energy-constrained. A theory of intelligence that requires infinite compute to update its priors is biologically invalid.
  *   **Causal Consistency:** The internal model cannot systematically violate the causal structure of the external world and remain adaptive.

  **Tribal Preferences (Debatable/Implementation Details):**
  *   **Symbolic vs. Connectionist:** Whether the substrate is neurons or logic gates is likely irrelevant (multiple realizability), provided the functional properties (compositionality, gradient descent-like updates) exist.
  *   **Embodiment:** *Strong* embodiment (you need a body to be intelligent) is likely a tribal preference. *Weak* embodiment (you need sensorimotor feedback loops) is a hard constraint.
  *   **Consciousness:** Whether the theory requires phenomenological experience is currently unfalsifiable and should be bracketed out of a functional theory.

  ### 5. The Impossibility Results (Jointly Unsatisfiable Requirements)
  This is the critical section. You asked for conflicts. Here are the trade-offs that suggest "General Intelligence" might be a Pareto frontier, not a single point.

  **A. The Generality-Specificity Trade-off (The No-Free-Lunch Corollary)**
  *   *Conflict:* **Domain Generality** vs. **Sample Efficiency**.
  *   *Why:* To learn from 3 examples, you need strong priors (biases). Strong priors imply assumptions about the world. If the world violates those assumptions, you fail. To be truly domain-general, you must weaken priors. If you weaken priors, you need more data.
  *   *Verdict:* You cannot maximize both. A "universal" learner will always be less sample-efficient than a specialized one in its home domain.

  **B. The Stability-Plasticity Dilemma**
  *   *Conflict:* **Retaining Old Knowledge** vs. **Learning New Knowledge**.
  *   *Why:* If weights are stable, you don't forget (good). But you can't learn new things (bad). If weights are plastic, you learn fast (good) but suffer catastrophic forgetting (bad).
  *   *Verdict:* Biological brains solve this with replay and modularization. A theory must explain the **gating mechanism** that decides when to overwrite vs. when to store new parameters.

  **C. The Exploration-Explosion Constraint**
  *   *Conflict:* **Safe Optimization** vs. **Discovering Novel Strategies**.
  *   *Why:* To find a novel solution (like the crow bending the wire), you must explore low-probability actions. In high-stakes environments, low-probability actions often lead to termination (death/failure).
  *   *Verdict:* High intelligence in dangerous environments requires a **model of risk** that suppresses the very exploration needed for high intelligence. This creates a "competence ceiling" based on environmental hostility.

  **D. The Transparency-Performance Trade-off**
  *   *Conflict:* **Interpretability** vs. **Optimization Power**.
  *   *Why:* The most efficient compression of a complex policy is often a high-dimensional, non-linear manifold (deep net). Human-readable symbols are lossy compressions.
  *   *Verdict:* A system that is perfectly intelligible to humans may be mathematically constrained to be less intelligent than a system that is opaque.

  ### Summary: The Spec for a Valid Theory
  If you are evaluating a theory (Predictive Processing, Global Workspace, Integrated Information, etc.), run it against this checklist:

  1.  **Does it specify the Environment Class?** (If it says "everywhere," it's false).
  2.  **Does it distinguish Priors from Data?** (If it claims to learn everything from scratch, it's false).
  3.  **Does it explain the Crow?** (Does it account for causal intervention, not just prediction?)
  4.  **Does it resolve Stability-Plasticity?** (How does it update without erasing?)
  5.  **Does it admit the Trade-offs?** (If it promises high generality *and* high sample efficiency *and* low compute, it's snake oil).

  **The Hard Truth:**
  The most likely outcome of a rigorous theory of intelligence is that "Intelligence" is not a natural kind. It is a **Pareto Frontier** of competing constraints (Speed, Accuracy, Generality, Energy, Sample Efficiency). A "superintelligence" isn't a point where all are maximized; it's a system that dynamically navigates the trade-offs better than others. Any theory that doesn't model the *navigation of trade-offs* is just a benchmark in disguise.
