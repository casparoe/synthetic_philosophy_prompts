prompt: |-
  I've been mediating part-time for this community board that deals with conflicts between families and local institutions, and lately I'm hitting the same wall: people defend loyalty-based choices with these layered reasons that sound like they're trying to have it both ways — like they'd help anyone in that situation, but especially this person because they're family or part of the community. I recently read Bernard Williams on integrity and the problem of having one thought too many, where importing an impartial justification into a ground project actually corrupts the commitment rather than supporting it. I think it's exactly what's happening in these rooms, but I have no idea how to check for it in real time without just accusing people of being selfish.

  Can you turn Williams's integrity objection into an actual reusable procedure — like a checklist or flowchart in words — that I could run on a case in maybe five minutes? I need ordered questions with what counts as a sufficient answer, where the procedure stops and flags corrupt reasoning, where it stops and says this is a values call I can't settle, and where it admits it just can't tell. It should catch when someone has smuggled an impartial calculus into a ground-level commitment, but also flag when a loyalty claim is just disguised partiality that doesn't deserve protection. Don't make me cite page numbers or quote texts; just build it from the idea itself.

  Then apply it to three cases: an ER nurse who bumps her sister ahead in triage; a public librarian who sets aside special access for her own neighborhood group; and a mediator — basically me — who refuses to split a settlement impartially because the other party isn't part of my community. I want that last one to come out in a way I probably won't like, since I usually side with community loyalty. Also say clearly what the procedure can't do and where it will misfire.

  Please separate what's actually settled about Williams's objection from what's genuinely contested — for instance, whether it really undermines utilitarianism or just describes a psychological discomfort — and don't present a disputed interpretation as if it's the consensus view among people who work on this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Part-time mediator for a community board (family vs. local institutions).
      *   **Problem:** People justify loyalty-based choices with layered reasons (impartial + partial) that sound like "having it both ways."
      *   **Theoretical Framework:** Bernard Williams's "Integrity Objection" (specifically the "one thought too many" concept from *Utilitarianism: For and Against*).
      *   **Task 1:** Create a reusable procedure (checklist/flowchart in words) based on Williams's idea to detect "corrupt reasoning" (smuggling impartial calculus into ground projects) vs. "disguised partiality." Time limit: ~5 minutes.
      *   **Task 2:** Apply the procedure to three cases:
          1.  ER nurse bumping sister ahead in triage.
          2.  Public librarian setting aside access for neighborhood group.
          3.  Mediator (the user) refusing impartial settlement because the other party isn't community.
      *   **Constraint:** The third case must be analyzed honestly, even if the user won't like the result.
      *   **Task 3:** Distinguish between settled vs. contested aspects of Williams's objection (e.g., does it refute utilitarianism or just describe psychology?).
      *   **Tone:** Practical, philosophical but accessible, honest about limitations. No page numbers/quotes.

  2.  **Deconstruct Williams's "Integrity Objection":**
      *   *Core Idea:* Moral theories (like Utilitarianism) that demand impartiality can alienate agents from their "ground projects" (deep commitments that give life meaning).
      *   *One Thought Too Many:* In a rescue scenario (wife vs. stranger), saving the wife *because* she is my wife is authentic. Saving her *because* it maximizes utility (and coincidentally she's my wife) adds a thought that corrupts the relationship.
      *   *The Trap:* Justifying partiality *using* impartial language often signals that the agent doesn't trust the partiality itself or is trying to game the system.
      *   *The Counter-Trap:* Not all partiality is protected integrity. Some is just bias/corruption.
      *   *Goal:* Distinguish between *Integrity-Protecting Commitments* (IPCs) and *Self-Serving Bias*.

  3.  **Drafting the Procedure (The "Integrity Audit"):**
      *   Needs to be quick (5 mins).
      *   Needs ordered questions.
      *   Needs clear stop conditions (Flag Corrupt, Flag Values Call, Flag Undecidable).
      *   *Step 1: Identify the Commitment.* What is the ground project?
      *   *Step 2: The Counterfactual Test.* Would you do this if the roles were reversed? (Standard impartiality check, but modified).
      *   *Step 3: The Justification Test.* Are they using impartial language to justify a partial act? (The "One Thought Too Many" check).
      *   *Step 4: The Institutional Role Test.* Does the role demand impartiality? (Crucial for the mediator/nurse cases).
      *   *Step 5: The Harm Test.* Does this violate rights of outsiders?

      *Refining the Procedure:*
      Let's make it more specific to Williams. Williams isn't just about harm; it's about *alienation*.
      *   *Q1: The Source Question.* "Why did you do it?" Look for the immediate reason.
      *   *Q2: The Impartial Shield.* "Would you claim this is best for everyone?" If yes, probe.
      *   *Q3: The Role Boundary.* "Does your job allow this?"
      *   *Decision Nodes:*
          *   If they admit partiality + Role allows it = Integrity.
          *   If they claim impartiality + Act is partial = Corrupt Reasoning (Williams's target).
          *   If Role forbids partiality = Institutional Violation (regardless of integrity).

      *Wait, I need to capture the specific nuance:* Williams criticizes *importing* impartial justification into personal commitments. But in public roles (nurse, librarian, mediator), impartiality is often *required*. So the procedure needs to distinguish between *Personal Ground Projects* (where Williams applies) and *Public Fiduciary Roles* (where Williams might be overridden by duty).
      *Correction:* The user is asking about community board mediation. These are hybrid spaces.
      *Revised Procedure:* Focus on the *structure of the justification*.
      1.  Identify the Act.
      2.  Identify the Stated Reason.
      3.  Check for "Double-Booking" (Claiming both special tie AND general benefit).
      4.  Check for "Role Conflict."
      5.  Verdict.

  4.  **Developing the Three Cases:**
      *   *Case 1: ER Nurse/Sister.*
          *   Role: Triage (impartial by definition).
          *   Act: Bumping sister.
          *   Williams Analysis: Even if she loves her sister (ground project), the *role* forbids it. Williams protects personal integrity, not professional malpractice.
          *   Verdict: Violation. The "loyalty" doesn't override the fiduciary duty to patients.
      *   *Case 2: Librarian/Neighborhood.*
          *   Role: Public resource (impartial access).
          *   Act: Special access for group.
          *   Nuance: Is this outreach (impartial goal via partial means) or favoritism?
          *   Verdict: Likely corrupt reasoning if framed as "fair for everyone."
      *   *Case 3: Mediator (User)/Community.*
          *   Role: Mediator (impartial facilitator).
          *   Act: Refusing impartial split because outsider.
          *   Williams Analysis: The user is treating the *mediation role* as a *community ground project*.
          *   Hard Truth: If the role is "impartial mediator," loyalty to community corrupts the function. If the role is "community advocate," then it's honest. But claiming to mediate *and* favor community is the "one thought too many" (or too few).
          *   Result: This will likely flag as corrupt reasoning because the user is smuggling partiality into an impartial role.

  5.  **Addressing the Philosophical Status (Settled vs. Contested):**
      *   *Settled:* Williams successfully identified a psychological phenomenon (alienation) and a rhetorical pattern (over-justification).
      *   *Contested:* Does this refute Utilitarianism? (Most say no, it just complicates it). Is integrity always good? (No, racists have integrity). Can institutions accommodate ground projects?
      *   *Need to be clear:* Williams describes a cost, not necessarily a logical refutation.

  6.  **Review and Refine:**
      *   *Check Constraints:* No page numbers? Yes. 5-minute procedure? Yes. Honest about the mediator case? Yes. Distinguish settled/contested? Yes.
      *   *Tone Check:* Empathetic but rigorous. Don't preach, but don't coddle on the mediator case.
      *   *Procedure Logic:* Ensure the flowchart logic is clear in text form.
      *   *Williams Nuance:* Ensure I don't just say "Partiality = Good." Williams says "Personal commitments have weight," not "Bias is okay." The distinction is vital.

  7.  **Final Polish:**
      *   Make the procedure actionable.
      *   Ensure the "Mediator" case hits hard but fairly.
      *   Clarify the "Institutional Role" override. Williams talks about moral agents, but professionals have contracts. The procedure must account for this. *Self-Correction:* Williams's point is about *moral* integrity. Professional ethics are a separate layer. I need to make sure the procedure distinguishes between "Is this authentic?" (Williams) and "Is this permitted?" (Ethics). The user asks about "corrupt reasoning," which bridges both. I will focus on the *reasoning structure*.

      *(Self-Correction on the Mediator Case)*: If the user's "ground project" is *being a community protector*, then mediating impartially might feel like a betrayal. But if they take the job of *mediator*, they accept the impartial frame. The conflict is between the Role and the Ground Project. The procedure should flag this tension. If they claim the Role allows the Partiality, that's the corruption.

      *(Refining the "One Thought Too Many" detection)*: It's not just having two reasons. It's when the *primary* reason (love/duty) is hidden behind a *secondary* reason (utility/fairness) to make it palatable.
      *   *Signal:* "I did X for my brother, *and also* it was the best outcome."
      *   *Williams:* If it was for your brother, the "best outcome" is irrelevant noise. If it was for the "best outcome," the brother part is irrelevant noise. Doing both suggests insecurity about the brother part.

      *Let's build the procedure around "Justification Stability."*

  8.  **Finalizing the Output Structure:**
      *   Introduction (Acknowledging the difficulty).
      *   The Procedure (The "Integrity/Alignment Audit").
      *   Application to Cases (Nurse, Librarian, Mediator).
      *   Philosophical Status (Settled vs. Contested).
      *   Limitations (Where it misfires).

      *(Wait, one last check on the Mediator Case)*: The prompt says "refuses to split a settlement impartially because the other party isn't part of my community." This sounds like the mediator is acting as a *party* or *advocate*, not a neutral. If they are the mediator, this is a breach of ethics. If they are a community board member *mediating* (which implies neutrality), it's still a breach. I need to be firm here. The Williams lens shows this isn't "integrity," it's "role confusion."

