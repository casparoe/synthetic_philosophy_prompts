answer: |-
  ### Part 1: The Integrity/Alignment Audit (5-Minute Procedure)

  This procedure is designed to detect when a justification is structurally unstable—specifically, when someone tries to wear the mask of impartiality to protect a partial act, or when they claim a "ground project" (deep commitment) to excuse a breach of fiduciary duty.

  It does not decide if the act is *moral*; it decides if the *reasoning* is honest or corrupted.

  **Step 1: Isolate the Primary Claim**
  Ask the person: *"In one sentence, why was this the right thing to do?"*
  *   **Type A (Partial):** "Because she is my sister/member of my group."
  *   **Type B (Impartial):** "Because it produced the best outcome for everyone."
  *   **Type C (Hybrid):** "Because she is my sister, *and* it was the best outcome."

  **Step 2: The Counterfactual Stress Test**
  Ask: *"If doing this for your sister/group member resulted in a slightly worse overall outcome, would you still have done it?"*
  *   **Yes:** The commitment is a **Ground Project** (Williams-style integrity).
  *   **No:** The commitment is **Instrumental** (they are using loyalty as a tool for efficiency).
  *   **Hesitation/Qualification:** The reasoning is **Unstable**.

  **Step 3: The Role Boundary Check**
  Ask: *"Does your official role or job description permit you to prioritize this relationship?"*
  *   **Yes (e.g., Parent, Friend):** Proceed to Step 4.
  *   **No (e.g., Triage Nurse, Public Official, Neutral Mediator):** **STOP.** Flag as **Role Violation**. (Williams protects personal integrity, not professional malpractice. If the role demands impartiality, appealing to integrity is a category error).

  **Step 4: The "One Thought Too Many" Detection**
  Look at the answer from Step 1.
  *   If **Type A (Partial)** + Step 3 is **Yes**: **Clear Integrity.** (Honest partiality in a permissible zone).
  *   If **Type B (Impartial)** + Step 2 is **Yes**: **Corrupt Reasoning.** (They are lying about the motive; they are hiding loyalty behind utility).
  *   If **Type C (Hybrid)** + Step 2 is **Yes**: **Defensive Reasoning.** (They feel the need to justify a personal commitment with public math. This is the Williams "corruption"—they don't trust the loyalty to stand on its own).

  **Step 5: The Harm/Right Check**
  Ask: *"Does this choice actively violate a specific right or safety guarantee owed to an outsider?"*
  *   **Yes:** **STOP.** Flag as **Disguised Partiality.** (Loyalty cannot override basic rights, regardless of integrity).
  *   **No:** **Values Call.** (This is a legitimate conflict of values the procedure cannot settle).

  ---

  ### Part 2: Application to Cases

  #### Case 1: The ER Nurse (Sister in Triage)
  *   **Step 1 (Claim):** Hybrid. "She's my sister, and she needed care."
  *   **Step 2 (Counterfactual):** Yes. "I'd always save her first." (Ground Project confirmed).
  *   **Step 3 (Role Boundary):** **No.** Triage protocols demand impartiality based on medical need, not kinship.
  *   **Verdict:** **Role Violation.**
  *   **Analysis:** Williams's defense of integrity applies to *moral agents*, not *fiduciaries*. A nurse sells impartial expertise to the public. Using a "ground project" here isn't integrity; it's a breach of contract. The procedure stops at Step 3. The "loyalty" is real, but it is illegitimate in this context.

  #### Case 2: The Public Librarian (Neighborhood Access)
  *   **Step 1 (Claim):** Hybrid. "This group is my neighborhood, and this helps literacy rates."
  *   **Step 2 (Counterfactual):** Hesitation. "Well, ideally we help everyone, but this is efficient."
  *   **Step 3 (Role Boundary):** **No.** Public libraries mandate equal access.
  *   **Step 4 (Detection):** **Defensive Reasoning.** The librarian is using "literacy rates" (impartial good) to shield "my neighborhood" (partial good).
  *   **Step 5 (Harm):** **Yes.** Outsiders are denied access to public resources.
  *   **Verdict:** **Disguised Partiality.**
  *   **Analysis:** This is the "having it both ways" trap. If the librarian said, "I am prioritizing my neighbors because I care more about them," it would be honest (though perhaps fireable). By claiming it helps *everyone*, they are smuggling bias into a public calculus. The procedure flags this at Step 4 and 5.

  #### Case 3: The Mediator (You/Community Loyalty)
  *   **Step 1 (Claim):** Partial. "I prioritize my community members."
  *   **Step 2 (Counterfactual):** Yes. "Even if the outsider has a stronger claim."
  *   **Step 3 (Role Boundary):** **No.** A mediator's core function is neutrality. If you are a *community advocate*, that is one role. If you are a *mediator*, that is another.
  *   **Step 4 (Detection):** **Role Violation.**
  *   **Step 5 (Harm):** **Yes.** The outsider is denied a fair process.
  *   **Verdict:** **Role Violation / Disguised Partiality.**
  *   **Analysis:** This is the hard result. You are treating the *mediation table* as a *community ground project*. Williams would say your commitment to the community is a valid ground project *in your private life*. But by occupying the seat of "Mediator," you have accepted an impartial framework.
      *   If you refuse to split impartially, you are not acting as a mediator; you are acting as a partisan.
      *   The "corruption" isn't that you love your community. It's that you are using the *authority of the mediator role* to enforce a *partial commitment*.
      *   To be Williams-consistent, you would need to recuse yourself. Staying in the role and favoring your side is not integrity; it is using the cover of neutrality to exercise bias. The procedure flags this at Step 3.

  ---

  ### Part 3: Philosophical Status (Settled vs. Contested)

  You asked to distinguish what is settled about Williams's objection from what is debated. This is crucial for using the tool without overstating its power.

  **What is Generally Settled (The Descriptive Claim)**
  *   **Alienation is Real:** Philosophers across the spectrum agree that Williams successfully identified a psychological cost. Demanding that agents constantly justify personal commitments through impartial calculus *does* create alienation and changes the character of relationships.
  *   **The Rhetorical Tell:** There is consensus that "over-justification" (adding impartial reasons to partial acts) often signals moral insecurity or bad faith. It is a reliable heuristic for detecting when someone is trying to "game" a moral system.

  **What is Genuinely Contested (The Normative Claim)**
  *   **Does it Refute Utilitarianism?**
      *   *Williams's View:* Yes, it shows utilitarianism is incompatible with human integrity.
      *   *Counter-View (e.g., Peter Singer, R.M. Hare):* No. It only shows that utilitarianism is *demanding*. A utilitarian can argue that "ground projects" are useful heuristics for maximizing good in the long run. They argue Williams describes a *feeling* of discomfort, not a logical contradiction.
  *   **Is Integrity Always Valuable?**
      *   *Williams's View:* Integrity is a central virtue that moral theory must accommodate.
      *   *Counter-View:* A racist or a mafioso can have "integrity" (sticking to their ground projects). Critics argue Williams doesn't provide a filter for *which* ground projects deserve protection. (Note: My procedure attempts to fix this with Step 3 and Step 5).
  *   **Public vs. Private:**
      *   There is no consensus on how far Williams's objection extends into public life. Some argue public roles *require* the alienation Williams dislikes (we *want* judges to be alienated from their personal loyalties). Others argue institutions should be designed to accommodate ground projects.

  ---

  ### Part 4: Limitations and Misfires

  Be aware of where this procedure will fail you in the mediation room.

  **1. The "Honest Bigot" Problem**
  The procedure protects honest partiality (Step 4, Type A). If someone says, "I favor my group because they are mine, and I don't care about the outsider," the procedure classifies this as **Clear Integrity** (provided the role allows it).
  *   *Risk:* It cannot distinguish between a loving parent and a corrupt clan leader if both are honest about their bias. You need Step 5 (Harm/Rights) to catch this, but "harm" is often contested in community disputes.

  **2. The Role Ambiguity Trap**
  In community boards, roles are often fluid. Are you a neighbor? A mediator? A board member?
  *   *Risk:* The procedure relies on Step 3 (Role Boundary). If the role is undefined, the procedure halts at "Undecidable." In your context, you may need to define the role *before* applying the audit.

  **3. The Psychological Blindspot**
  Williams's point is about *alienation*. Sometimes people genuinely believe their partial act *is* impartial.
  *   *Risk:* The procedure assumes people can answer Step 1 and 2 truthfully. If someone is deluded about their own motives (e.g., "Favoring my sister *is* what fairness looks like"), the audit will register "Impartial" when it is actually "Corrupt." You cannot audit unconscious bias with a conscious checklist.

  **4. It Doesn't Solve the Conflict**
  The procedure identifies *corrupt reasoning*. It does not tell you who is *right*.
  *   *Risk:* You can flag a person as having "Clear Integrity" (honest partiality) and still have to rule against them because their integrity conflicts with another person's rights. Knowing their reasoning is honest doesn't make their claim valid.

  ### Summary for Your Practice
  Use this to clean the *air* in the room, not necessarily to decide the *outcome*. When you catch the "Hybrid" justification (Step 1, Type C), you can say: *"It sounds like you're trying to justify this as both a family duty and a public good. If it's a family duty, you don't need the public good argument. If it's a public good, the family tie shouldn't matter. Which one is it?"*

  That question forces them to drop the "one thought too many." It won't solve the dispute, but it stops the reasoning from rotting the process.
