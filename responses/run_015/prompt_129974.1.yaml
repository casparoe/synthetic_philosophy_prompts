answer: |-
  **Ravi:** Let's take the study as read. Forty societies, thirty years. Market integration goes up, impartial fairness norms converge, and everyone experiences it as *progress*. But purity taboos stay random, and nobody thinks switching from pork to beef is moral advancement. You're a realist. Does this split save your position or sink it?

  **Ana:** It saves it by pruning it. If moral facts exist, why expect them to be a monolithic package? Finding (i) looks like tracking. As societies depend on anonymous cooperation, the correct normative response to strangers *is* impartiality. The participants feel it as progress because they are epistemically accessing a constraint on cooperative flourishing. Finding (ii) is noise. Purity rules are local coordination equilibria. There is no fact of the matter about whether you should salute elders with a bow or a handshake.

  **Ravi:** So you're a local realist about fairness but a quietist about purity. But here's the pressure: the psychological mechanism generating the intuition feels identical in both cases. When a high-caste Hindu feels pollution from a low-caste touch, it phenomenologically presents as *wrongness*, not just "bad style." If the mechanism is unreliable in domain (ii), why trust it in domain (i)?

  **Ana:** Because reliability isn't about the feeling; it's about the causal link to the truth. In (i), the convergence tracks a functional requirement of market economies that also happens to be morally true. In (ii), there's no convergence because there's no truth to track. To your "born elsewhere" challenge: If I were born in that high-caste society, I'd likely hold the purity belief. But I would be *wrong*. Causal origin doesn't determine justificatory status.

  **Ravi:** That's the standard realist move. But you're positing a mysterious fact that survives the contingency of your birth. My positive account is simpler: Moral argument isn't discovery; it's negotiation. When we argue about fairness, we're hammering out terms of social engagement that allow us to coexist. It feels like discovery because once we agree on the terms, they become objective constraints on us. The "progress" in (i) isn't finding a Platonic truth; it's converging on a specific, high-utility coordination equilibrium that markets demand.

  **Ana:** But why does it feel like *correction* rather than *compromise*? When I update on fairness, I feel like I'm shedding a bias, not adopting a convention. If you're right, the convergence in (i) is just a massive coincidence of utility functions.

  **Ravi:** Not a coincidence. Convergent evolution. Sharks and dolphins both look similar because water demands hydrodynamics, not because they're copying a blueprint. Markets demand impartiality. That explains the convergence without the ontology. Now, your turn. If you're realist about (i) but quietist about (ii), what binds them? Why call them both "morality"?

  **Ana:** They both involve normative force. But I grant the ontology might be fragmented. Maybe cooperation facts are real, and purity facts are projections. I'd rather save the phenomena of fairness than throw out the map because the legend is messy.

  **Ravi:** Fair enough. But let's test the steel. We need a falsifier. Ana, what observation would make you abandon realism about (i)? If fairness norms diverged again?

  **Ana:** If market integration increased but fairness judgments randomly fluctuated without losing cooperative utility... no, wait. Even then, I could argue they're mistaken. Realism is stubborn. I suppose if I found a society with high flourishing based on radical partiality, sustained over centuries, without cognitive dissonance. But even then, I'd suspect hidden costs. What about you? What would make you a realist?

  **Ravi:** If moral arguments resolved via evidence in a way that didn't reduce to shared goals. If we could prove "suffering is bad" like we prove "water is H2O." But moral disagreement always bottoms out in "why should I care?"

  **Ana:** So... we're stuck.

  **Ravi:** Looks like it. I can't name a world where I'm wrong about constructivism, because any convergence I see, I'll call evolution. You can't name a world where you're wrong about realism, because any divergence you see, you'll call error.

  **Ana:** We've built armor, not theories.

  **Ravi:** Maybe. But at least we agree the armor needs to account for the split in the data.

  **Ana:** Small mercies.
