      *   *Candidate 1: Strict Premise-Based Sequential (The "Logic Gate" Approach).*
          *   Vote H. If fail, stop (Deny).
          *   Vote N. If fail, stop (Deny).
          *   Vote S. If Pass, Grant.
          *   If S fails, Vote E. If Pass, Grant. Else Deny.
          *   *Pros:* Fast, logically sound, easy to explain to a judge.
          *   *Cons:* Ignores the "spirit" of the board if they want to weigh S and E together. Doesn't handle the "Package" vote issue well. Might force a vote on E even if everyone agrees S is true (waste of time).

      *   *Candidate 2: Premise-Based with "Disjunction Check" (The "Safety Net" Approach).*
