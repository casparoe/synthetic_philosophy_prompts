      *   Discursive Dilemma: Majority on premises might lead to a different outcome than majority on conclusion. Since courts require findings to entail the outcome, *Premise-Based Voting (PBV)* is legally safer than Conclusion-Based Voting (CBV), *unless* the premises are logically inconsistent.
      *   The "S or E" Problem: $S$ and $E$ are linked. $S$ = "Not Self-Created". $E$ = "Exceptional (even if self-created)". The condition is $(S \lor E)$.
          *   If $S$ is True, $E$ doesn't matter logically, but practically boards often vote both.
          *   If $S$ is False, $E$ must be True to pass.
          *   Voting on them separately can lead to inconsistency (e.g., Majority says Not-S and Not-E, but some think S, some think E).
