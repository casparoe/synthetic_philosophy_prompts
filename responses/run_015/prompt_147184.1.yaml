  *(Self-Correction during drafting Model Answer)*: I need to be careful not to exceed the word limit too much. I will aim for tight paragraphs. I need to make sure I explicitly answer "what sort of property authenticity is."

  *(Self-Correction during drafting Marking Scheme)*: The prompt asks for "one line on the error that should cost marks at that point." I need to make sure that's clear in the scheme.

  Let's assemble.

