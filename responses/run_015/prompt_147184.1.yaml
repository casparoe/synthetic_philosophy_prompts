answer: |-
  1. The Exam Question

  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the following question in essay form. You may not rely solely on Nelson Goodman's argument regarding indiscernible copies or Walter Benjamin's concept of aura.

  **Case:**
  In 1911 a panel painting catalogued as the work of a minor seventeenth-century Dutch master is transferred: the conservator lifts the whole paint and ground layer off its warped oak panel and mounts it on a new mahogany one. Some decades later the museum re-examines its holdings. Dendrochronology dates the oak panel — which the museum kept, with a thin residue of ground still adhering to it — to the master's lifetime. Pigment analysis dates the paint layer now on display to the 1880s, and archival work shows that a restorer of that period reconstructed the image almost in its entirety from what survived of the original and had the result catalogued and sold as the master's own. So the object on the wall is a nineteenth-century imitation made of nineteenth-century materials; the only physically continuous remnant of the seventeenth-century object is a nearly blank plank in a storeroom.

  **Question:**
  Using this case, defend an account of what sort of property artistic authenticity is (e.g., a historical relation, a guarantee of experience, or a normative status) and explain what work that property is supposed to do. Do not simply decide which object deserves the title of the "work." Instead, settle whether the value we seek in authenticity is satisfied by the plank's continuity, the hanging picture's appearance, or neither.

  ***

  2. Model Answer

  This case fractures the standard intuition that the "original" is a unified object possessing both historical priority and aesthetic completeness. Here, historical genesis and aesthetic vehicle have been surgically separated. To resolve the value conflict, we must define authenticity not as a binary switch determining which object is "real," but as a functional property that serves distinct interests depending on whether the viewer seeks historical testimony or aesthetic engagement.

  If authenticity is defined strictly as **material continuity**, the oak plank is the only authentic object. It is the only entity spatio-temporally linked to the master's hand and era. However, treating continuity as the sole source of value commits a category error. The plank possesses archaeological value, but it cannot sustain the artistic value for which the master was esteemed. A blank panel, even if touched by Rembrandt, offers no pictorial experience. To claim the plank is the work because it is continuous is to slide from a metaphysical claim about identity to an unjustified axiological claim about worth. The continuity guarantees the object's history, but it does not guarantee the presence of the art.

  Conversely, if authenticity is defined as **attributional correctness**, the hanging picture is a forgery. It is an 1880s reconstruction mislabeled as 17th-century. Yet, treating this attribution error as settling the question of value is equally premature. The hanging picture provides the visual structure intended for appreciation. If the 1880s restorer successfully extrapolated the master's style, the aesthetic experience may be indistinguishable from viewing a genuine composition. To dismiss the hanging picture entirely because it is "not by the master" assumes that the only value art holds is its status as a historical relic. This ignores the possibility that the image itself holds intrinsic aesthetic value independent of its genesis.

  Therefore, authenticity is best understood as a **warrant for historical testimony**. It is a property that certifies the object as evidence of a specific human action at a specific time. The work authenticity does is to anchor the image in art history. In this case, the warrant is broken for the hanging picture; it testifies to 1880s restoration practices, not 17th-century creativity. The plank testifies to 17th-century materials, but not to the completed image.

  Consequently, the museum should not seek a single "real" object. The hanging picture is the **aesthetic vehicle**, valuable for its visual properties and its demonstration of 19th-century reception of the master. The plank is the **historical relic**, valuable for its material genesis. Authenticity matters because it prevents us from confusing the two. If we hang the picture as a 17th-century work, we lie about history. If we discard the picture for the plank, we lose the art. Authenticity is not the source of aesthetic value, but the label that correctly directs our attention: we look *at* the hanging picture for form and color, and we look *through* the plank to the past. The value of the original is not magic; it is the integrity of the historical narrative attached to the aesthetic experience.

  ***

  3. Marking Scheme (Out of 20)

  **1. Distinguishing Material Continuity from Aesthetic Vehicle (5 Marks)**
  *   **Must Hit:** The student must explicitly separate the physical history of the object (the plank) from the visual content (the paint layer).
  *   **Error to Penalize:** Sliding from "the plank is the spatio-temporally continuous object" directly to "so the plank is what is worth looking at" without justifying why continuity equals aesthetic worth. (Deduct 2-3 marks if this slide occurs).

  **2. Defining the Property of Authenticity (5 Marks)**
  *   **Must Hit:** The student must articulate a specific definition of authenticity (e.g., historical warrant, genealogical relation, normative label) rather than using it as a vague synonym for "good."
  *   **Error to Penalize:** Treating "the hanging picture is not by the master" as though that settled what kind of value it can have (e.g., assuming it therefore has *no* value). (Deduct 2-3 marks if attribution is treated as the end of the inquiry).

  **3. Analyzing the Function/Work of Authenticity (5 Marks)**
  *   **Must Hit:** The answer must explain *what work* the concept does (e.g., preventing historical falsehood, directing attention, certifying testimony) rather than just arguing which object to hang.
  *   **Error to Penalize:** Retreating into a summary of Goodman (indiscernibles) or Benjamin (aura) to do the explanatory work instead of analyzing the case specifics. (Deduct up to 5 marks for reliance on prescribed shortcuts).

  **4. Resolving the Value Conflict without Collapsing the Objects (5 Marks)**
  *   **Must Hit:** The conclusion must assign distinct values to the two objects (e.g., historical vs. aesthetic) rather than forcing one to be the "true" work and the other worthless.
  *   **Error to Penalize:** Ignoring the 1880s reconstruction aspect or the specific material split (oak vs. mahogany/paint) in the final verdict. (Deduct 2 marks for generic treatment of "fake vs. real").
