prompt: |-
  I teach a final-year undergraduate seminar in aesthetics and am writing this term's final exam. I want one 60-minute essay question on fakes, forgeries and the value of originals that cannot be answered by summarizing Goodman's argument about indiscernible copies or by invoking Benjamin on aura. Build it around this invented case, which I have drafted for the paper:

  In 1911 a panel painting catalogued as the work of a minor seventeenth-century Dutch master is transferred: the conservator lifts the whole paint and ground layer off its warped oak panel and mounts it on a new mahogany one. Some decades later the museum re-examines its holdings. Dendrochronology dates the oak panel — which the museum kept, with a thin residue of ground still adhering to it — to the master's lifetime. Pigment analysis dates the paint layer now on display to the 1880s, and archival work shows that a restorer of that period reconstructed the image almost in its entirety from what survived of the original and had the result catalogued and sold as the master's own. So the object on the wall is a nineteenth-century imitation made of nineteenth-century materials; the only physically continuous remnant of the seventeenth-century object is a nearly blank plank in a storeroom.

  Please give me:

  1. The question as I would print it — the case, plus an instruction precise enough that a strong student knows what they are being asked to settle.
  2. A model answer of roughly 600 words.
  3. A marking scheme out of 20, organized around four must-hit moves, with the marks attached to each and one line on the error that should cost marks at that point. The errors I most want caught are sliding from "the plank is the spatio-temporally continuous object" to "so the plank is what is worth looking at," and treating "the hanging picture is not by the master" as though that settled what kind of value it can have.

  The question should force students to say what sort of property authenticity is and what work it is supposed to do — a historical property, a guarantee of a certain kind of experience, or something else again — rather than to decide which of the two objects deserves a single title. Assume no access to a library, and give me no bibliography; I will attach the readings myself.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Final-year undergraduate seminar in aesthetics.
      *   **Task:** Create a 60-minute essay exam question, a model answer, and a marking scheme.
      *   **Topic:** Fakes, forgeries, value of originals.
      *   **Constraints:**
          *   Cannot be answered merely by summarizing Goodman (indiscernibles) or Benjamin (aura).
          *   Must use the provided invented case (1911 transfer, 1880s repainting, oak panel vs. mahogany/paint layer).
          *   Must force students to define *what sort of property authenticity is* (historical, experiential, etc.) and *what work it does*.
          *   No bibliography (assume readings attached by instructor).
          *   Model answer approx. 600 words.
          *   Marking scheme out of 20, 4 "must-hit moves," with specific error penalties (specifically: sliding from continuity to value, and treating attribution as settling value).

  2.  **Deconstruct the Case:**
      *   *Object A (The Wall):* 1880s paint/ground on 1911 mahogany. Visually looks like the master's work. Reconstructed by a 19th-century restorer. Catalogued as the master's.
      *   *Object B (The Storeroom):* Original 17th-century oak panel with tiny residue of ground. Physically continuous with the artist's hand/era, but visually blank/nearly blank.
      *   *The Conflict:* Which is the "real" artwork? Or does the distinction matter? Why?
      *   *The Trap:* Goodman says if they look the same, they function the same (aesthetic experience), but history matters for classification. Benjamin says the original has aura (ritual/cult value). The prompt explicitly bans relying *only* on these. The student needs to dig deeper into the *nature* of the value being claimed.

  3.  **Drafting the Question (Part 1):**
      *   Need to present the case clearly.
      *   Need an instruction that demands analysis of "authenticity" as a concept, not just a verdict on the object.
      *   *Drafting:* "Consider the case... [Insert Case]. In light of this scenario, analyze the concept of artistic authenticity. Does the value of the work reside in physical continuity, aesthetic appearance, or historical genesis? Argue for a specific account of what authenticity *is* and why it matters, rather than simply deciding which object should hang."
      *   *Refining:* Make it tighter. Ensure it explicitly warns against the Goodman/Benjamin shortcuts.

  4.  **Drafting the Model Answer (Part 2):**
      *   *Goal:* ~600 words. High-level undergraduate/early grad tone.
      *   *Key Arguments:*
          1.  Acknowledge the split (Material continuity vs. Visual presentation).
          2.  Critique the "Physical Continuity" view (The plank is historically genuine but aesthetically void).
          3.  Critique the "Visual/Aesthetic" view (The hanging picture offers the experience but lacks the historical link).
          4.  *The Pivot:* Authenticity isn't just one thing. It's a cluster concept or serves a specific function (e.g., warrant for historical testimony vs. aesthetic engagement).
          5.  *Conclusion:* The hanging picture is the *aesthetic* object, the plank is the *historical* relic. Authenticity functions differently depending on the interest (art-historical vs. appreciative).
      *   *Constraint Check:* Avoid just saying "Goodman says X." Avoid "Benjamin says Aura." Focus on the *function* of authenticity.
      *   *Word Count Check:* Need to monitor this carefully.

  5.  **Drafting the Marking Scheme (Part 3):**
      *   Total: 20 marks.
      *   4 "Must-Hit Moves" (5 marks each).
      *   *Move 1:* Distinguish between material continuity and aesthetic vehicle. (Error: Conflating the plank's history with the image's value).
      *   *Move 2:* Define authenticity (Historical genesis vs. Performance vs. Experience). (Error: Treating attribution as the end of the inquiry).
      *   *Move 3:* Address the specific case details (1880s paint vs. 17th C panel). (Error: Ignoring the 1880s reconstruction aspect).
      *   *Move 4:* Articulate the *function* of authenticity (What work does the label do?). (Error: Sliding from "is authentic" to "is valuable" without justification).
      *   *Specific Penalties:* As requested (Continuity -> Value slide; Attribution -> Value settlement).

  6.  **Refining and Polishing:**
      *   *Question:* Make sure the instruction is precise. "Settle" is a good word from the prompt. Let's use "defend an account."
      *   *Model Answer:* Ensure it doesn't sound like a textbook summary. It needs to argue. *Self-Correction:* Make sure I don't accidentally lean too hard on Goodman even in the model. The model should show *how* to go beyond him.
      *   *Marking Scheme:* Ensure the "errors" align with the prompt's specific requests about the continuity/value slide and attribution settlement.

  7.  **Final Review against Constraints:**
      *   60-minute essay question? Yes.
      *   No Goodman/Benjamin summary reliance? Yes, the prompt bans it, the model avoids it.
      *   Case included? Yes.
      *   Model answer ~600 words? Will count during drafting.
