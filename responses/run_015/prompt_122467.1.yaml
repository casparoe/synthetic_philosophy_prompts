      *   *The Challenge:* I need to refine Dennett's criteria to respect the user's intuitions where possible, but also be philosophically consistent. If I stick strictly to Dennett, the user *must* accept the Sunrise as real (as a pattern of appearance) and the Thermostat as having proto-intentionality (or at least Design stance). However, the prompt asks me to state *what has to be true* to satisfy the verdicts. This implies I need to synthesize a robust criterion that might add constraints to pure compression (e.g., causal independence, counterfactual robustness, substrate neutrality).

