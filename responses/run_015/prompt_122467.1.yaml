          *   Sunrise: Perspective-dependent phenomenon.
          *   *Resolution:* Dennett actually says the Sunrise *is* a real pattern of appearance. But the user says "not real." To honor the user, I need to distinguish between *ontological reality* (independent of observer) and *phenomenological reality*. However, Dennett's "Real Patterns" are observer-relative.
