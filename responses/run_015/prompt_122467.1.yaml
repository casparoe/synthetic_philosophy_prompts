      *   **Part 2: Criteria for Intentional Stance:** 3-4 clauses distinguishing from Design.
      *   **Part 3: Application to New Cases:** LLM, Heart, Market.
      *   **Part 4: The Reckoning:** Which verdicts must change? (Sunrise, Chess Engine, maybe Thermostat nuance).
      *   **Part 5: Sunrise vs. Thermostat:** Final ruling.

  9.  **Self-Correction/Polishing during drafting:**
