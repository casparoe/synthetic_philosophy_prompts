      *   *Criterion for Intentional vs. Design:* This is the hard one. Dennett often blurs them. The user distinguishes Mouse (Intentional) from Thermostat (Design/Not Real). Why? Usually, it's about *complexity*, *adaptability*, and *internal state representation*. A thermostat has one bit of state. A mouse has a map. A chess engine calculates but lacks "desire" in the biological sense (though Dennett might argue it has derived intentionality).
      *   *Refining the Intentional Stance:* To justify "Mouse" but not "Thermostat," we need a threshold of *flexibility* and *informational integration*. The system must treat information as *about* something (semantics), not just causal coupling.

  4.  **Addressing the Specific Pairs:**

      *   *Glider vs. Sunrise:*
