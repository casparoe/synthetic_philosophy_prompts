  Thank you. I know... looking out, I see people who lived inside his arguments. And I see family who knew him for everything else. Maybe some thought he studied butterflies. He didn't. He studied how things stick together.

  I wanted to stand here and say he's still with us. That his influence binds this room. But... I can't. Because if his influence binds us, what binds the influence to *us*? There has to be a connector. And then a connector for that connector. It goes back forever. He taught me that. You can't just assert a relation and call it unity. It's a trick.

  So I can't honestly tell you his legacy lives in these papers. What holds the ink to the idea? Another gap. I can't say he's in this room, because what binds the memory to the space? Another relation. Ad infinitum.

  It feels like I can't mourn him without pretending the connection is solid. Without faking the glue. Grief wants to say "he is here." But philosophy says "how?" And there is no answer. If I say we are connected by love, what binds the love to the loss?

  Maybe the only honest thing is the gap itself. The endless need for another link. That hunger is him. He isn't the bridge. He's the space between the planks where we keep looking for a nail. He is the friction of the attempt.

  So I won't say we are united. I won't declare him present. I won't lie and say the work holds us. I'll just say we are all standing here, trying to find the next binder, and failing, and trying again. That struggle... that's the only thing that doesn't fall apart.
