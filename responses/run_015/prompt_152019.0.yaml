answer: |-
  # Joint Statement on Individual Contributions to Collective Harms

  ## I. Agreed Claims

  1.  **Causal Structure of Climate Systems:** Both camps agree that individual greenhouse gas emissions are physically real contributions to atmospheric concentration, but that any single emission is causally negligible regarding specific climate outcomes (e.g., specific weather events or temperature thresholds). We agree that while planetary tipping points exist conceptually, the link between a specific individual's emission and the triggering of such a threshold is not determinate or perceptible.
  2.  **Causal Structure of Industrial Agriculture:** Both camps agree that supply chains for animal products operate on batched thresholds (e.g., orders placed in multiples of thousands) rather than continuous one-to-one mappings. We agree that a single consumer purchase does not deterministically cause the death of a specific animal, but rather alters the probability of future production cycles in an opaque, non-linear market.
  3.  **Causal Structure of Democratic Voting:** Both camps agree that in large-scale elections, the probability of a single vote being decisive is vanishingly small, effectively approaching zero for practical reasoning. We agree that voting possesses non-causal dimensions, including expressive significance (signaling values) and systemic participation, distinct from the causal outcome of the election.
  4.  **Severity of Collective Harms:** Both camps agree that climate change, industrial animal agriculture, and democratic erosion constitute severe moral harms that generate significant obligations at the collective level. We disagree only on the decomposition of these obligations to individual agents acting in isolation.
  5.  **Substantive Nature of Disagreement:** Both camps explicitly agree that our divergence is not merely verbal or definitional. We agree that we are using the terms "moral reason," "causal efficacy," and "obligation" with sufficient overlap that our conflicting conclusions represent a genuine normative conflict rather than a linguistic misunderstanding.

  ## II. Disagreements and Cruxes Table

  | Domain of Inquiry / Adjudicative Case | Causal Inefficacy Camp Position | Normative Aggregation Camp Position |
  | :--- | :--- | :--- |
  | **Moral Reasons and Causal Efficacy**<br>*(Does a moral reason to act require the capacity to perceptibly alter the outcome?)* | We maintain that weighty moral reasons regarding consequences require causal efficacy. If an action makes no perceptible difference to the harm, it cannot generate a consequentialist duty to abstain or perform. Moral weight must track actual difference-making. | We contend that moral reasons can arise from expected-value aggregation, systemic participation, or expressive significance. An action carries moral weight if it is of a type that, when aggregated, causes harm, even if the marginal impact is imperceptible. |
  | **Probabilistic Expected-Value Reasoning**<br>*(Does EV reasoning apply across massively distributed agents with near-zero probabilities?)* | We argue that expected-value reasoning breaks down or becomes morally irrelevant when probabilities are so low they are indistinguishable from zero in non-linear systems. Applying EV here leads to absurd over-demandingness without corresponding real-world impact. | We assert that expected-value reasoning holds regardless of distribution size. A tiny probability multiplied by a massive harm yields a significant expected disvalue. Ignoring low-probability high-impact events is a cognitive bias, not a moral exemption. |
  | **Decomposition of Collective Obligations**<br>*(Can collective obligations be decomposed into individual duties?)* | We hold that obligations regarding collective harms reside primarily at the institutional or regulatory level. Individual duties are derivative and vanish if the individual lacks the power to influence the collective outcome. | We hold that collective obligations decompose into individual duties to participate in or abstain from harmful systems. The collective harm is constituted by individual acts; therefore, the duty to resolve the harm binds each constituent agent. |
  | **Crux 1: Difference-Making vs. Systemic Participation**<br>*(Is there a coherent moral distinction between making a difference and being part of a harmful system?)*<br><br>**Case:** A *Stochastic Electoral Mechanism* where citizens are randomly sampled to vote, rather than all votes being summed. If a citizen is not sampled, their vote is never counted. | **Prediction:** If an agent is not sampled, they have made no causal difference and bear no responsibility for the outcome. The duty to vote is contingent on the capacity to be decisive or causally efficacious within the mechanism. | **Prediction:** The duty to participate remains even if not sampled, because the moral obligation attaches to entering the pool of potential deciders. Willingness to be part of the decisive mechanism is sufficient for moral assessment, regardless of actual selection. |
  | **Crux 2: Threshold Determinability**<br>*(Is the notion of a threshold empirically determinable or conceptually incoherent in opaque markets?)*<br><br>**Case:** A *Probabilistic Supply-Chain Scenario* where one consumer's purchase is linked to farm expansion only through an opaque, non-deterministic market response (e.g., a 1 in 10,000 chance of triggering a bulk order of 10,000 units). | **Prediction:** The opacity and non-deterministic link break the chain of moral responsibility. Without a knowable threshold, the agent cannot be said to have crossed a line into harm. Uncertainty absolves the individual of specific liability. | **Prediction:** The risk imposition is sufficient for moral liability. The agent knowingly participates in a system where harm is probabilistically linked to their action. The expected harm (1 unit) is identical to a deterministic case, creating an equal duty to abstain. |
