      *   *Actually, the "Least Costly" fix:* Refine the interpretation of (1). The "Separateness of Persons" objection (Rawls/Nozick) is specifically about *sacrifice for the social good*. It doesn't necessarily forbid saving more lives in a disaster scenario. So, (1) is compatible with (2) if (1) is interpreted as "No sacrificing innocents as means," but (2) is "Choosing who dies in an unavoidable accident."
