answer: |-
  **1. Probability that phenomenal consciousness is genuinely graded: 0.70**
  Evolutionary continuity and neurobiological complexity vary smoothly across phylogeny, making a binary "on/off" switch for consciousness biologically arbitrary, though philosophical disagreement on the "hard problem" prevents higher confidence.

  **2. Conditional probability that average insect sentience-weight $\ge$ 1/10,000 human: 0.30**
  While gradation implies non-zero weight, insect neural mass (~1 million neurons) is roughly $10^{-5}$ of humans; for moral weight to be $10^{-4}$, sentience must scale sub-linearly with neural complexity, which is speculative.

  **3. Probability population ratio is high enough to dominate: 0.95**
  Estimated insect populations ($10^{18}$) exceed vertebrates ($10^{13}$, mostly fish) by a factor of $10^5$; even with conservative weight estimates, this numerical differential creates a massive aggregate margin.

  **4. Correction factor (lifespan/intensity integration): 0.60**
  *Justification:* Moral weight likely integrates over experience-duration, and while vertebrate lifespans are longer, the sheer population surplus of insects retains a significant aggregate advantage even after temporal discounting.

  **Resulting Credence:**
  $$0.70 \times 0.30 \times 0.95 \times 0.60 \approx 0.12$$
  **Credence: 12%**

  **Least Certain Term:**
  Term 2 (Conditional probability of insect sentience-weight).

  **Empirical Result to Update:**
  A demonstration that insects possess a centralized neural substrate for affective valuation (e.g., opioid-like modulation of nociception in the central complex) rather than purely reflexive avoidance, which would significantly increase the estimated moral weight per individual.
