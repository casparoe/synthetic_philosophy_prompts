prompt: |-
  So I'm in a grad reading group that's been going through Wittgenstein's On Certainty since September, one session a week, and it feels like we've been stuck on the same handful of passages for a month. The fight in the room is the fight I gather the literature is having too. Take the things people call hinge propositions — the stock examples being that I have hands, that the earth has existed for a very long time, that my name is such-and-such, that nobody has flown off to the moon and come back. One side says these aren't really the kind of thing that can be true or false, or at any rate aren't things we believe: they're scaffolding, or the bed of the river rather than the water, something closer to a habit or a skill or an animal certainty, the rules of the game rather than moves within it, so calling them knowledge is some kind of grammatical confusion. The other side says no, they're perfectly genuine propositions with genuine content, they just have a peculiar epistemic status: we hold them without evidence, we're entitled to them (or committed to them) in a way that isn't grounded in reasons but is still, in a broad sense, epistemic, and there's an extended sense in which we can be said to know them. Both sides cite the same passages — the riverbed-and-current stuff, the bit about an empirical proposition hardening into a rule and getting washed free of its empirical character, the remarks about what stands fast for us — and neither side has moved an inch.

  What I want from you is a number with the reasoning showing. Here's the proposition: this is at bottom a verbal dispute. Count it as true if, once you separated out (i) whether hinges have truth values at all, (ii) whether the attitude we take to them is a belief or something more like a disposition / habit / skill / 'animal' stance, (iii) whether certainty in this region is one phenomenon or several that have been lumped together under one word, and (iv) whether knowledge and entitlement as the epistemic-side people use them are doing any real work or just relabelling, there'd be nothing left to argue about except how to use words — and count it as false if there's a substantive residue, some real question about the architecture of rationality, or about how a practice can be grounded at all, or about what a proposition has to be, that survives the taxonomy. My credence is around 0.35; my friend in the group, who's on the scaffolding side, puts it at 0.7, and I can't work out where we actually differ.

  So: your number. Then rough probabilities on each of those four sub-questions plus any other term you think belongs there, with a number and one line of justification each, then how you'd combine them and which single term your final number is most sensitive to. Then tell me whether you think my friend and I at 0.35 and 0.7 really disagree or are just answering different questions, and what one argument or distinction would move you most. Two further things: please don't argue from who said what — my seminar leader has asked us not to lean on names or on who published which reading, and I want the argument rather than a map of the literature (I also have no way to look anything up right now). And the thing I'd most like a straight answer on: my group keeps using non-propositional and not truth-apt as if they were interchangeable, and I have a feeling the whole disagreement is hiding in that collapse — is it? Also sorry if any of this is garbled, I was writing it up definately too late last night and I missed the session where we did the Moore material properly.
