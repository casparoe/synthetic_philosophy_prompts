  **The Straight Answer:**
  **Yes.** Collapsing "non-propositional" and "not truth-apt" is absolutely hiding the disagreement.
  *   **Non-propositional** implies the sentence doesn't even *attempt* to describe the world (like a command or a groan).
  *   **Not truth-apt** implies it looks like a description but lacks the logical conditions for success or failure (like a rule or a grammatical statement).
  The "scaffolding" side needs hinges to be *not truth-apt* (to avoid needing evidence) but often speaks as if they are *non-propositional* (to explain why we don't "believe" them). The "epistemic" side insists they are *propositional* and *truth-apt* (because they describe the world) but must explain why they don't behave like normal truths. If your group treats these as synonyms, the "scaffolding" side looks like they are denying grammar, and the "epistemic" side looks like they are denying logic. Separating them shows the "scaffolding" side is making a claim about *function*, not form.

