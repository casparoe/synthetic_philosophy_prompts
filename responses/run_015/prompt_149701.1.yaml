  4.  **(iv) Epistemic Labels:** 0.50 — Whether "knowledge" stretches to cover hinges depends on whether we prioritize the *status* of the claim or the *grounds* for holding it.
  5.  **(v) Normative Force without Truth (Added):** 0.20 — Whether a norm can bind rationality without being truth-apt is the substantive residue that survives taxonomy.

  **Combination and Sensitivity:**
