  # Stage 1: The Logical Space

  **Instructions:** Follow the path determined by your intuitions on the concrete cases. Answer each question as it arises; do not look ahead to see which philosophical position you might be landing on.

  **Node 1: The LLM Case**
  *Case:* A student forms a true belief based on the output of a large language model. The model has no mind, takes no responsibility, and asserts nothing.
  *Question:* Can there be testimony without an agent who asserts?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2: The LLM Reliability Check**
  *Case:* The same LLM case as above.
  *Question:* If there is no agent, must the hearer have positive reasons for the system's reliability on this occasion?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to **Leaf B**.

  **Node 3: The Insincere Speaker Case**
  *Case:* A speaker asserts *p* to you. They do not believe *p*, but you have no idea they are lying. *p* turns out to be true.
  *Question:* Does the speaker's private disbelief damage the *type* of warrant you have, even if you never discover the lie?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4: The Responsibility Question**
  *Case:* The insincere speaker case above.
  *Question:* Does a source's taking responsibility for the truth of what they say supply a reason that no evidence of reliability could supply?
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to Node 5.

  **Node 5: The Positive Reasons Question**
  *Case:* A standard case of a sincere human speaker.
  *Question:* Must the hearer have positive reasons bearing on this source's reliability on this occasion?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 6: The Scope of Reasons**
  *Case:* You are relying on a stranger's directions.
  *Question:* Must your reasons rely on observed regularities of humanity generally, or this speaker's specific track record?
  *   **General Regularities:** Go to **Leaf D**.
  *   **Specific Track Record:** Go to **Leaf E**.

  **Node 7: The Converging Sources Case**
  *Case:* Three barely credible sources independently converge on the same claim. None is reliable enough on their own.
  *Question:* Can testimonial warrant be partly generated by the hearer's environment (e.g., convergence) rather than inherited?
  *   **Yes:** Go to **Leaf F**.
  *   **No:** Go to Node 8.

  **Node 8: The Defeaters Question**
  *Case:* A standard case with no positive reasons for reliability, but no signs of unreliability either.
  *Question:* Is testimonial warrant secured by an absence of defeaters, or a positive presumptive entitlement?
  *   **Absence of Defeaters:** Go to **Leaf G**.
  *   **Positive Entitlement:** Go to **Leaf H**.

  ***

  # Stage 2: The Positions

  **Leaf A: Technological Reductionism**
  *   **Location:** Node 1 (Yes) → Node 2 (Yes).
  *   **View:** Treats LLM outputs as information sources akin to instruments. Warrant requires local inductive support regarding the system's functioning.
  *   **Agency Dependence:** Low. Relies on reliability, not agency.

  **Leaf B: [Empty Cell]**
  *   **Location:** Node 1 (Yes) → Node 2 (No).
  *   **Status:** **Incoherent.**
  *   **Reason:** If one denies the necessity of agency (Node 1 Yes) but also denies the need for reliability checks (Node 2 No), one grants default warrant to non-agential noise. This collapses the distinction between signal and static.

  **Leaf C: The Assurance View**
  *   **Location:** Node 1 (No) → Node 3 (Yes) → Node 4 (Yes).
  *   **View:** (e.g., Moran, Hinchman). Testimony is an interpersonal undertaking. The speaker's responsibility provides a second-personal reason distinct from evidence of truth.
  *   **Agency Dependence:** High. Warrant dissolves without a responsible agent.

  **Leaf D: Humean Global Reductionism**
  *   **Location:** Node 1 (No) → Node 3 (No) → Node 5 (Yes) → Node 6 (General).
  *   **View:** (e.g., Hume). Reliance on testimony is reduced to observed regularities of human honesty and accuracy generally.
  *   **Agency Dependence:** Medium. Requires human agents, but warrant comes from the hearer's induction, not the speaker's status.

  **Leaf E: Local Reductionism**
  *   **Location:** Node 1 (No) → Node 3 (No) → Node 5 (Yes) → Node 6 (Specific).
  *   **View:** (e.g., Fricker). The hearer needs positive reasons specific to this speaker or occasion, not just general human reliability.
  *   **Agency Dependence:** Medium. Focuses on the specific agent's credibility.

  **Leaf F: Environmental Generation View**
  *   **Location:** Node 1 (No) → Node 3 (No) → Node 5 (No) → Node 7 (Yes).
  *   **View:** (e.g., Goldberg). Warrant can be generated by the structure of the information environment (like convergence) even if individual sources lack inherited warrant.
  *   **Agency Dependence:** Low-Medium. Agents are present, but the *source* of warrant is the systemic environment.

  **Leaf G: Default-and-Challenge View**
  *   **Location:** Node 1 (No) → Node 3 (No) → Node 5 (No) → Node 7 (No) → Node 8 (Absence).
  *   **View:** (e.g., Foley). Acceptance is rational by default unless there are specific defeaters. No positive entitlement is needed.
  *   **Agency Dependence:** Low. Functions similarly to perceptual default; agency is background condition.

  **Leaf H: Non-Reductionism (Reid-to-Burge)**
  *   **Location:** Node 1 (No) → Node 3 (No) → Node 5 (No) → Node 7 (No) → Node 8 (Positive).
  *   **View:** (e.g., Burge). There is a primitive, positive presumptive entitlement to accept what is presented as true. Warrant is inherited from the source's rationality.
  *   **Agency Dependence:** High. Relies on the source's rational nature to transmit warrant.

  ***

  **Note on Indistinguishability:**
  **Leaf G (Default-and-Challenge)** and **Leaf H (Non-Reductionism)** are flagged as difficult to separate empirically. Both yield the same verdict in standard cases (acceptance is permitted). The tree separates them theoretically by the *source* of the permission (absence of negative reasons vs. presence of positive entitlement), but in practice, the burden of proof may look identical.
