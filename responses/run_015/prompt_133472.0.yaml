      *   *Refinement:* It's more nuanced. He acknowledges *regularity*. He wouldn't deny the engineering works. He'd deny the *ontology* of the engineers. They say "weights cause." He says "weights are the locus where God creates the output."
      *   *The "Hoodie" Metaphor:* Yes, he'd likely see the claim of *intrinsic* causal power in weights as a modern version of the philosophers' error (attributing agency to creation).
      *   *Squaring Intervention:* This is the crux. Interventionism relies on counterfactuals (if $X$ hadn't happened, $Y$ wouldn't have). Ghazali accepts counterfactuals based on God's will, not natural necessity. If you tweak weights, God *could* have kept the output the same (miracle), but He usually doesn't (custom).
