          *   *Refinement:* Focus on *structural liability*. If the state manipulates the epistemic environment to wage aggression, the soldiers are participants in a manipulated system. Their moral license derives from the state's legitimacy. If the state's legitimacy is procured through epistemic manipulation, the license is tainted *structurally*, even if the individual isn't culpable.

      *   **Point 4: The Moral Consequence (Breaking MEC).**
          *   If the aggressor soldier's ignorance is structurally induced, their moral standing is different from the defender whose ignorance is incidental.
