answer: |-
  The standard Walzerian defense of the Moral Equality of Combatants (MEC) rests on the premise of "invincible ignorance." It argues that because soldiers on both sides of a conflict generally lack access to the high-level intelligence and diplomatic context required to judge the justice of the war (*jus ad bellum*), they are symmetrically excused from moral responsibility for the cause they fight for. Consequently, they possess symmetrical rights to kill and symmetrical liability to be killed.

  However, this symmetry collapses when we analyze the *structural conditions* under which that ignorance is produced. Ignorance is not merely a passive lack of data; it is often an active product of institutional architecture. If aggressive wars require different epistemic structures to sustain themselves than defensive wars, then the "invincible ignorance" of the aggressor soldier is qualitatively different from that of the defender. This asymmetry undermines the moral equality of combatants without requiring us to accuse individual soldiers of negligence.

  Here is the argument for why asymmetric epistemic closure breaks MEC.

  ### 1. The Structural Necessity of Epistemic Closure in Aggression
  To launch a war of aggression, a state typically must override the default presumption against violence. Since aggressive wars often lack clear, immediate, or visible provocation, the state cannot rely on the soldiers' direct observation to justify mobilization. Instead, it must construct a narrative.

  To maintain this narrative, the command hierarchy of an aggressor state must function as an epistemic filter. It is structurally necessary for the aggressor state to suppress counter-evidence, classify dissenting intelligence, and punish internal skepticism. If the true motives or the lack of justification were widely known within the ranks, cohesion would fracture. Therefore, the ignorance of the aggressor soldier is not accidental; it is *engineered*. The hierarchy is designed to produce a specific belief state in the subordinate.

  In contrast, a defensive war is usually precipitated by an observable existential threat (e.g., foreign troops crossing a border, aerial bombardment). The justification for the war is often empirically verifiable by the soldiers themselves. While a defensive state may still propagate propaganda, it does not *structurally require* the same degree of epistemic closure to function. The reality of the threat provides an external check on the command hierarchy's claims.

  ### 2. The Integrity of the Chain of Authorization
  Soldiers derive their moral license to kill from the legitimacy of the authority commanding them. In the Walzerian view, we assume the authority is equally opaque on both sides, so the license is equally valid. However, if the authority on one side is maintained through systematic epistemic manipulation, the integrity of that authorization is compromised.

  Consider the chain of command as a transmission line for moral authority. On the defensive side, the transmission line may be noisy, but the signal (the threat) originates from an external reality that aligns with the orders given. On the aggressive side, the transmission line is actively insulated from external reality to prevent signal loss.

  When a state artificially isolates its military from moral counter-evidence to pursue aggression, it severs the link between military action and objective justification. The soldier on the aggressor side is not just "ignorant"; they are operating within a closed system designed to prevent the correction of error. Even if the individual soldier cannot pierce this veil, the *system* they serve is epistemically corrupt. A moral license granted by a corrupt epistemic process is inherently weaker than one granted by a process aligned with observable reality.

  ### 3. Distinguishing Structural Liability from Individual Blame
  The crucial move here is to separate the *liability of the combatant* from the *culpability of the individual*. The standard objection to rejecting MEC is that it unfairly burdens individual soldiers with geopolitical judgments they cannot make. This argument avoids that trap.

  We are not arguing that the aggressor soldier *should have known better* (which implies individual negligence). We are arguing that the *conditions of their participation* are morally distinct.
  *   **Defender:** Participates in a collective action where the justification is potentially verifiable and the epistemic channels are not structurally sealed against dissent.
  *   **Aggressor:** Participates in a collective action where the justification is non-verifiable and the epistemic channels are structurally sealed to enforce compliance.

  Moral liability in war is not solely about individual guilt; it is about whether one is contributing to a rights-violating enterprise. If the enterprise relies on epistemic manipulation to exist, the participants are enablers of that manipulation, even if unwittingly. The "excuse" of ignorance holds less weight when the ignorance is the intended output of the system you are empowering. The aggressor soldier's immunity is weakened because the institution they uphold is actively hostile to the truth conditions required for just war.

  ### 4. The Asymmetry of Dissent
  Finally, we must look at the availability of internal recourse. In a defensive war, because the threat is often visible, there is often more room for internal debate regarding *proportionality* or *conduct* without undermining the core justification of the war. A soldier can question tactics without questioning the right to exist.

  In an aggressive war, because the justification is fragile, dissent regarding tactics often bleeds into dissent regarding the mission itself. Therefore, aggressor hierarchies tend to conflate tactical disagreement with disloyalty more aggressively than defensive hierarchies. This means the aggressor soldier has fewer institutional avenues to register moral concern.

  If MEC relies on the idea that soldiers are "tools" with no moral agency, the asymmetry of the tool's design matters. A tool designed to prevent its user from sensing harm is morally distinct from a tool that allows the user to sense harm. By joining a hierarchy designed to suppress moral counter-evidence, the aggressor soldier voluntarily enters a structure that is epistemically hostile to moral reasoning. This voluntary entry into a closed system reduces their moral protection, even if they remain subjectively convinced of their righteousness.

  ### Conclusion
  The Moral Equality of Combatants assumes a symmetry of epistemic predicament. However, aggressive wars require artificial epistemic closure to sustain themselves, while defensive wars often align with observable reality. This means the "invincible ignorance" of the aggressor is structurally manufactured, whereas the ignorance of the defender is often incidental.

  Because the moral license to kill depends on the legitimacy of the authorizing structure, and because that structure is epistemically corrupted on the aggressor side, the license is weaker. This does not require blaming the individual soldier for failing to seek the truth; it requires recognizing that the truth was structurally withheld from them to facilitate injustice. Therefore, the moral symmetry breaks: the aggressor soldier is more liable to defensive force because their participation sustains an epistemically corrupt enterprise, whereas the defender sustains one that is epistemically open to verification.
