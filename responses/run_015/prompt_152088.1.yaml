          *   *What you'd lose:* The ability to say the *system* is wrong independent of its users (Case 1) AND the ability to say the *data* is invalid independent of its processing (Case 3). You need the "Design/Spec" layer to separate Input validity from Processing validity.

      *   **(e) Predictions:**
          *   *Activation Vector:* No designated function, no spec. Not "about" anything in the bug-triage sense. Cannot be "wrong," only "suboptimal." (Unless you assign a task).
          *   *Unread Metric:* Has a design function (to be read). If it drifts, it's "wrong" (veridical norm), even if no one sees it. But if no one reads it, the Interface Norm is dormant.
          *   *Orphan Format:* No consumers, no authors. Content is indeterminate. It's just bits. You can't file a bug against it, only against a new system trying to parse it.

  4.  **Refining the Philosophy Name:**
      *   The view that content is determined by *proper function* (history) is **Teleosemantics** (Millikan, Papineau).
      *   The view that norms are determined by *social/systemic practice* is **Normative Pragmatism** (Brandom).
      *   The specific mix here—where design fixes the *domain* but ecosystem fixes the *validity conditions*—is best described as **Teleological Functionalism with Normative Contextualism**.
      *   However, for a non-philosopher, "Teleosemantics" is the strongest hook for the "aboutness" question. "Functionalism" covers the system role.
