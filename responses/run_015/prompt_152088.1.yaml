          *   This explains why "Working as Designed" (Norm 2 met) can still be "Wrong" (Norm 1 failed, or Norm 2 needs updating).

      *   **(d) Underdetermination & Rivals:**
          *   *Causal/Correlational Account:* If meaning = reliable correlation.
              *   Breaks Case 1: If it reliably reports 23 when it's 25, that *is* the meaning. You couldn't call it "false."
              *   Breaks Case 2: Max value reliably correlates with "loose wire." That's information. You couldn't call it "noise."
          *   *Pure Use/Consumer Account:* If meaning = what consumers take it to be.
              *   Breaks Case 3 (GIGO): If consumers take invalid UTF-8 as text, it *is* text. You couldn't blame the caller.
