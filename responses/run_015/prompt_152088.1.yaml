      *   *Synthesis:* The view is a hybrid. It's not pure causal correlation (otherwise noise would be information). It's not pure truth-conditional (otherwise the fix in Case 4 wouldn't be a bug). It's not pure use-theory (otherwise Case 1 would have been correct from the start if people believed it).
      *   *Best Fit:* **Teleological Functionalism** (specifically drawing from Ruth Millikan's *Teleosemantics* and perhaps some Brandomian *Normative Pragmatics*). The core idea is that content is fixed by *proper function* (history of selection/design), but correctness conditions can shift based on *systemic integration* (downstream consumption).
