      *   *Refined View:* The practice assumes **Correctness** is primary, **Truth** is derivative. A signal is "about" X if it is *supposed* to track X. If the system evolves so it is *supposed* to track Y (the alert threshold), then it becomes about Y.
      *   *Philosophical Label:* This is very close to **Role Functionalism** combined with **Teleosemantics**. I will use **Teleological Functionalism** as the primary label.

