answer: |-
  **DRAFT FOR ADVERSARIAL COLLABORATION: THE STATUS OF DREAM EXPERIENCE**

  **1. Agreed Empirical and Conceptual Baselines**
  Both parties affirm the following claims as established or coherent within the scope of this inquiry:

  1.  **Sleep-Laboratory Evidence:** Polysomnography establishes robust correlations between REM physiology and waking reports of dreaming. Lucid dreamers can execute pre-arranged eye-movement signals during REM, demonstrating preserved motor planning and working memory during sleep. However, physiological data alone does not settle the metaphysical status of the intervening consciousness.
  2.  **Borderline States:** Hypnagogic and hypnopompic mentation yield reports structurally indistinguishable from waking reports. Both parties agree these reports are valid data, though they disagree on whether they describe occurrent events or retrospective constructions.
  3.  **Null Reports:** Reports of "dreaming nothing" or "blank sleep" are treated as valid reports. They are not automatically evidence of unconsciousness, nor automatically evidence of forgotten experience.
  4.  **Unawakened REM:** In cases where a sleeper in REM is never awoken, no report exists. The Sceptic holds there is no fact of the matter regarding experience during that interval. The Anti-Sceptic holds there is a fact of the matter, currently unknown.
  5.  **Embedded Reports:** Cases where a subject reports dreaming that they woke up and described a dream indicate that narrative construction regarding "waking" can occur within the sleep state. This complicates any inference from report content to temporal timing.
  6.  **Oneiric Playback:** Both parties agree the following counterfactual is coherent: A neural trace recorded during REM is played back into the sleeper's cortex upon waking, producing an experience the subject reports as a memory of the night.
  7.  **Playback Interpretation:** Both parties agree this scenario is possible. They disagree on its implication: The Sceptic holds the playback *creates* the experience on waking; the Anti-Sceptic holds the playback *retrieves* or aligns with an experience formed during sleep.

  **2. Map of Residual Disagreements**

  | Issue | Sceptic Formulation | Anti-Sceptic Formulation | Condition for Revision |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | "Dreaming" is a disposition to report certain narratives upon waking, not an inner episode occurring during sleep. | "Dreaming" is an occurrent phenomenological state caused by neural activity during sleep, independent of reporting. | Sceptic: Show a report impossible to construct retrospectively. Anti-Sceptic: Show a fact of the matter inaccessible even in principle to report. |
  | **Timing** | The time of the dream is fixed by the time of the report; talk of "during sleep" is a grammatical fiction. | The time of the dream is fixed by the neural correlates during sleep; the report is a delayed measurement. | Sceptic: Demonstrate a logical contradiction in retrospective timing. Anti-Sceptic: Demonstrate a causal mechanism locking content to sleep-time. |
  | **Verification** | The absence of a possible independent check renders the question of consciousness during sleep unsettled-able. | The absence of a check is a practical limitation; verificationism is false, and facts exist without checks. | Sceptic: Produce a verification method independent of waking cognition. Anti-Sceptic: Show verificationism holds in other mind-cases. |

  **3. Cruxes and Adjudication Procedures**
  We identify the following cruxes as bearing directly on the disagreement. For each, we record our predictions in advance.

  *   **Crux 1: Real-Time Signaling.**
      *   *Procedure:* Utilize lucid dreaming protocols. Request subjects signal the onset of specific visual imagery via eye movements while remaining in REM, then compare signals to waking reports.
      *   *Sceptic Prediction:* Signals are constructed retrospectively or during micro- arousals; they do not prove continuous consciousness during deep REM.
      *   *Anti-Sceptic Prediction:* Signals correlate with neural markers of specific imagery, proving occurrent experience during sleep.
  *   **Crux 2: The Settlement Problem.**
      *   *Issue:* If the only check on whether someone dreamt is to ask them on waking, can this dispute be settled at all?
      *   *Asymmetry:* There is an epistemic asymmetry between sleep and waking states.
      *   *Agreement on Embarrassment:* The Anti-Sceptic ought to be embarrassed if they cannot specify a fact about sleep consciousness that makes a difference to any possible waking observation. The Sceptic ought to be embarrassed if they cannot explain the predictive success of sleep neuroscience without invoking real-time experience.
      *   *Settlement Condition:* The dispute is settled if one side fails to meet their embarrassment condition after the Real-Time Signaling procedure.

  **4. Diagnostic of Verbal vs. Substantive Elements**
  Both parties acknowledge that a portion of this dispute is verbal, turning on the definitions of "experience," "dream," and "report."

  *   **Verbal:** Whether the word "experience" applies to states lacking immediate introspective access or continuous memory integration. Whether "dream" refers to the neural process or the narrated output.
  *   **Substantive:** Once terminology is tabooed, the surviving question is: *Does the human brain generate functional states during sleep that are causally isomorphic to waking consciousness, regardless of whether we label them "experience"?*
  *   **Joint Commitment:** We agree to treat the substantive question as the primary object of inquiry. If the neural processes during sleep are functionally identical to waking consciousness, the Anti-Sceptic wins the substantive point even if the Sceptic retains the verbal restriction on the word "experience." If the processes are distinct memory-construction events occurring only upon arousal, the Sceptic wins the substantive point.

  We sign this document to commit to these baselines, disagreements, and adjudication procedures.

  ____________________ (Sceptic) ____________________ (Anti-Sceptic)
