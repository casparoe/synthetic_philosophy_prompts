answer: |-
  This is a fantastic philosophical puzzle. You have stumbled onto a nuance that often gets lost in introductory ethics classes: the gap between our **normative self-conception** (the story we tell ourselves about why we act) and our **causal psychology** (what actually moves the needle).

  You are right that this complicates the standard Kantian "Duty vs. Inclination" framework. Here is a breakdown of why this scenario is so tricky, whether it kills moral worth, and why the difference between the "thought reason" and the "actual reason" matters.

  ### 1. The Kantian Verdict: The Engine Matters
  Immanuel Kant is the go-to for "moral worth." For Kant, an action only has moral worth if it is done **from duty**, not just **in accordance with duty**.

  *   **In accordance with duty:** You clean the kitchen because it's the right thing to do, but maybe you also like a clean kitchen, or you want people to like you.
  *   **From duty:** You clean the kitchen *solely* because reason dictates it is the right thing to do, even if you hate cleaning and no one would ever know.

  In your roommate's case, she is acting *in accordance* with duty (cleaning is fair), but she admits the "engine" is social credit (inclination/self-interest).
  **Kant would say:** This action has **no moral worth**. It is prudent, it is socially useful, but it is not moral. She is treating morality as a currency to buy reputation, not as a law to obey.

  **However,** here is where your observation hits hard: She *believes* she is acting on fairness. She has internalized the duty. If she were asked, "Why are you cleaning?" she might say, "Because it's fair." But upon introspection, she admits, "Actually, I want to look good."
  For Kant, the **actual determining ground of the will** is what counts. If the social credit is the fuel, the moral worth is zero, regardless of her self-conception.

  ### 2. Why This Breaks the "Duty vs. Inclination" Story
  You noted that this feels different than the usual story. Usually, the conflict is:
  *   **Inclination:** "I want to sleep in."
  *   **Duty:** "I should go to work."
  *   **Resolution:** I force myself to go.

  Your roommate's situation introduces a third element: **Rationalization.**
  *   **Inclination:** "I want social status."
  *   **Duty:** "I should clean."
  *   **Rationalization:** "I am cleaning because it is fair."

  This breaks the binary because it questions **self-knowledge**. In standard ethics, we assume the agent knows why they are acting. Here, the agent is partially self-deceived. She is using the language of morality (fairness) to clothe an engine of vanity (social credit).

  This moves the problem from *ethics* to *moral psychology*. The moral failing here isn't necessarily that she wants social credit (we all do); it's that she is obscuring the true nature of her action from herself. That lack of integrity is a different kind of vice than selfishness.

  ### 3. Does the "Thought Reason" vs. "Actual Reason" Matter?
  You asked: *Is there a real difference between acting on the reason you think you have versus the one that's actually driving you?*

  **Yes, for three reasons:**

  **A. Predictability and Stability**
  If she cleans because she believes in fairness, she will clean even when no one is watching (or when social credit isn't on the line). If she cleans for social credit, she will stop cleaning the moment the "audience" stops caring or if she can get the credit another way. The "actual reason" predicts future behavior better than the "thought reason."

  **B. Integrity**
  Integrity requires alignment between your values and your motives. If she values honesty, but her motive is manipulation (managing perceptions), there is a fracture in her character. Living under a false narrative about one's own goodness is a form of **bad faith** (to use Sartre's term).

  **C. The "Moral Luck" Problem**
  She gets the benefit of the doubt (and the praise) for being a "good roommate," but she got there via a self-interested shortcut. This is a form of moral luck. She reaps the social rewards of virtue without paying the cost of genuine selflessness. That feels like a cheat code, which is why it bothers you.

  ### 4. A More Forgiving View: Virtue Ethics
  Aristotle might be more chill about this. Virtue ethics focuses on **habituation**.
  *   If she consistently cleans the kitchen, she is cultivating the habit of cleanliness and consideration.
  *   Aristotle acknowledges that we often start acting virtuously for the wrong reasons (praise, shame, reward) but eventually, the habit becomes part of our character.
  *   **The "Fake It Till You Make It" Argument:** By acting *as if* she is fair, she reinforces the behavior. Over time, the motive might shift. She might start cleaning simply because she sees herself as "the clean roommate."

  However, Aristotle would still warn that if the motive remains purely reputational, she isn't truly *virtuous*; she is merely **continent** (self-controlled) or **calculating**. She lacks *phronesis* (practical wisdom) about her own soul.

  ### 5. The "Stress" Variable
  There is one wrinkle you mentioned: *"She always cleans the kitchen when I'm stressed out."*
  If she admits the engine is social credit, why does it correlate with *your* stress?
  *   **Possibility A:** She knows a stressed roommate makes the house tense, which hurts her social standing. Cleaning mitigates the tension, preserving her status. (Consistent with her admission).
  *   **Possibility B:** She is lying to herself about the "social credit" being the *only* reason. She might have genuine empathy but feels vulnerable admitting it, so she defaults to the "cynical" explanation because it sounds smarter or safer.

  If it's Possibility B, her "actual engine" might be a mix of empathy and status, but she labels it all as status to protect herself from the vulnerability of caring.

  ### The Verdict
  Does it kill the moral worth?
  *   **Strictly speaking (Kant):** Yes. The action is legally right, but morally empty.
  *   **Practically speaking:** No. You still get a clean kitchen. The world is better off with her cleaning than not cleaning.

  **But does the difference between the "thought reason" and "actual reason" matter?**
  Absolutely. It matters for **trust**.
  If you know she acts on fairness, you trust her character.
  If you know she acts on social credit, you trust her *calculation*.
  You know she will do the right thing only as long as it pays off in status. If a situation arises where doing the right thing hurts her reputation, you now know she won't do it.

  **Why it breaks the story:**
  The usual story assumes we are fighting our desires to do our duty. Your roommate's story reveals that **we often co-opt our duty to serve our desires.** She isn't fighting inclination to do duty; she is using the *language* of duty to justify inclination. That is a much more human, and much more unsettling, ethical position.

  She is not a hypocrite (she actually does the work); she is a **rationalizer**. And in many ways, that is harder to judge than a straight-up slacker.
