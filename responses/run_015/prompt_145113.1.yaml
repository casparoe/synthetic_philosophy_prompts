answer: |-
  Your grant-ranking machinery presupposes a sentientist utilitarian framework where moral status is binary but welfare capacity is scalar and proportional to neural complexity, a position that is internally consistent only if you can justify why neural variation is morally negligible within the human species but decisive across non-human species.

  **Reconstruction of the Implicit Theory**
  Your practice operationalizes a specific combination of moral status and welfare theory. Regarding **moral status**, you adopt a threshold view: any entity with a non-zero probability of sentience enters the moral calculus, granting them moral consideration. However, regarding **welfare**, you adopt a capacity-based gradualism. You do not treat all sentient experiences as equal in magnitude; instead, you assume the *range* of possible welfare (the depth of suffering or height of flourishing) is constrained by physical substrate, specifically neural complexity. This distinguishes your view from "strict egalitarianism" (where a shrimp's pain weighs exactly equal to a pig's pain) and "hierarchical status" (where a shrimp's pain counts for less *because* it is a shrimp). Instead, you hold that a unit of suffering counts equally across species, but species differ in their maximum capacity to generate those units. The neural metrics serve as a proxy for this maximum capacity, assuming a physicalist link between brain structure and experiential intensity.

  **Required vs. Consistent Elements**
  The practice **strictly requires** three commitments: (1) that welfare is aggregable and comparable across individuals; (2) that welfare capacity varies across species; and (3) that neural metrics are a valid proxy for that capacity. It does **not require** specific neural metrics (you could use behavioral proxies instead) nor does it require the specific mathematical form of the multiplier (linear vs. logarithmic).

  The **human consistency challenge** strikes at the coherence of your status/welfare distinction. Your practice treats humans as having equal welfare capacity (ignoring neural differences between humans) while treating animals as having variable capacity. To avoid flat inconsistency, you must defend a **Two-Tier Theory**: Moral Status for humans is grounded in something beyond mere sentience (e.g., personhood, moral agency, or community membership), creating a floor that equalizes them, whereas animal status is grounded purely in sentience and capacity. If you cannot articulate this distinction, your practice collapses into speciesism, effectively claiming humans matter more per se rather than merely having different capacity. The distinction between "hierarchical status" and "weighing equal interests equally" hinges here: you claim the latter (equal weight per unit of experience), but the human exception suggests the former (humans get a bonus multiplier of 1.0 regardless of capacity).

  **Philosophical Underdetermination**
  Your spreadsheet settles nothing between rival theories of welfare that correlate with neural complexity. **Hedonic Utilitarianism** (maximizing pleasure minus pain) and **Preference Utilitarianism** (satisfying desires) yield identical rankings if you assume neural complexity proxies for both intensity of feeling and strength of preference. Similarly, a **Prioritarian** view (giving weight to the worse off) could produce similar rankings if you assume less complex animals are systematically worse off in baseline conditions, though your multiplier suggests the opposite (complex animals have more to lose). The spreadsheet is also compatible with a **Capabilities Approach**, provided you equate "capabilities" with "neural potential." You are only incompatible with deontological rights views (which forbid trading off individuals) or strict sentience egalitarianism (which would set all multipliers to 1).

  **Implications of the Three Challenges**
  1.  **Human Consistency:** If you accept the challenge that human equality must align with animal ranking, you must either **equalize animal multipliers** (adopting strict sentience egalitarianism, boosting fish/shrimp) or **differentiate humans** (admitting humans have higher capacity, which is ethically fraught). To defend the current path, you must change your public justification from "neural science" to "moral community," arguing that humans share a normative status that overrides neural variance, while animals do not.
  2.  **Affective Granularity:** If you accept the trustee's view that welfare depends on distinguishable states rather than raw neuron count, you must shift measurement from **anatomy to function**. You would need to fund behavioral cognitive studies (discrimination tasks, memory tests) rather than neuroanatomy. This would likely re-rank birds higher relative to mammals, as you noted, and potentially elevate cephalopods further if their distributed nervous systems support high state-space complexity.
  3.  **Subjective Time:** If you accept that welfare integrates over subjective moments rather than clock time, you must alter your duration metric. You would multiply objective duration by a **temporal resolution factor** (e.g., Critical Flicker Fusion Frequency or metabolic rate). This would drastically increase the calculated welfare impact for small, fast-metabolizing animals (insects, fish, shrimp), potentially overturning your current rankings entirely by making short objective lives contain vast subjective durations. Ignoring this while claiming precision leaves your cost-effectiveness numbers vulnerable to being wrong by orders of magnitude.
