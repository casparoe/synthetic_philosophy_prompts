  **MEMORANDUM**

  **TO:** The Charter Tribunal
  **FROM:** Rules Revision Committee, Legal Adviser
  **SUBJECT:** Recommendation Regarding the "Reflexive Lock" Amendment
  **DATE:** October 26, 2023

  ### I. Executive Summary

  The Committee seeks guidance on the validity of the "Reflexive Lock," a proposed amendment to Article 9 adopted via the ordinary amendment procedure. The Lock raises the threshold for future Article 9 amendments, grants the Tribunal a veto via "affirmative opinion," and declares itself unalterable.

  Based on the Tribunal's precedents, this case is **underdetermined**. The existing record supports three distinct doctrinal paths, each yielding a different outcome for the Lock. To resolve this, the Tribunal must choose between competing constitutional principles regarding the sovereignty of the current Assembly versus the perpetual accessibility of the amendment power.

  ### II. Candidate Rules Consistent with Precedents

  Three candidate rules can be distilled from the Tribunal's seven precedents. All fit the existing record but diverge on the Lock.

  **Rule 1: Sovereign Proceduralism (with Non-Destruction Exception)**
  *   **Doctrine:** An amendment is valid if it complies with the procedure in force at the time of enactment, provided it does not abolish the amendment power entirely (Precedent 2) or transfer it to an entity outside the constituent structure (Precedent 3).
  *   **Fit:** Explains Precedents 1, 4, 5, 6, and 7 as valid exercises of procedure. Explains Precedents 2 and 3 as substantive limits on *what* can be enacted, not *how*.
  *   **Prediction for Lock:** **Valid and Binding.** The Lock was enacted via the ordinary Article 9 route (Precedent 7). It does not abolish the power (Precedent 2) nor transfer it externally (the Tribunal is a Charter body, unlike the Council of Founders). The "ratchet" effect is permissible; the current Assembly may bind its successors.

  **Rule 2: Procedural Non-Entrenchment**
  *   **Doctrine:** The amendment power may entrench *ordinary* articles (Precedents 5 & 6), but it cannot entrench the *amendment procedure itself* against the future exercise of that same procedure.
  *   **Fit:** Explains Precedents 5 & 6 (ordinary entrenchment allowed). Explains Precedents 2, 3, & 4 (attempts to alter the procedure's core integrity or locus were struck down). Explains Precedent 7 (procedural *modification* is allowed, but procedural *binding* is not).
  *   **Prediction for Lock:** **Valid as Enactment, Ineffective as Lock.** The amendment passes and becomes part of the Charter, but the "Lock" provisions (higher thresholds, Tribunal veto, unalterability) cannot bind a future Assembly acting under the original Article 9 thresholds. A future ordinary amendment could repeal the Lock.

  **Rule 3: Constituent Usability (Anti-Alienation)**
  *   **Doctrine:** The amendment power must remain practically usable by the constituent bodies (Assembly and Institutions) and cannot be conditioned on the veto of a non-constituent body.
  *   **Fit:** Explains Precedents 2 & 3 (power cannot be destroyed or alienated). Explains Precedent 4 (procedure cannot be bypassed). Explains Precedents 5 & 6 (raising thresholds for ordinary articles does not impair the *amendment power itself*).
  *   **Prediction for Lock:** **Invalid Outright.** The Tribunal veto alienates power to a non-elected body (analogous to Precedent 3). The "unalterable" clause renders the power practically unusable regarding that paragraph (analogous to Precedent 2).

  ### III. Closest Analog Precedent

  **Precedent 3 (Transfer to Council of Founders)** is the closest analog regarding the **Tribunal Opinion** requirement.

  *   **Why:** In Precedent 3, the Tribunal struck down an amendment transferring amending power to the "unelected Council of Founders." The Charter Tribunal, like the Council, is a non-representative body created by the Charter. While the Tribunal currently *reviews* amendments, the Lock converts this review into a *condition precedent* (an affirmative veto). This shifts the locus of sovereignty from the representative Assembly/Institutions to the Tribunal.
  *   **Secondary Analog:** **Precedent 2 (Deletion of Article 9)** is the closest analog regarding the **"Unalterable Paragraph."** Declaring a paragraph unamendable is functionally equivalent to deleting the power to amend it. If the Tribunal cannot delete Article 9, it logically follows it cannot make Article 9 partially immune to amendment.

  ### IV. The Tribunal Opinion: Threshold or Alienation?

  The Committee must address whether the "affirmative opinion" requirement is a mere procedural threshold (like ratification by institutions) or an alienation of power.

  **It is an Alienation.**
  1.  **Hierarchy Inversion:** The Tribunal's jurisdiction is created *by* Article 9. Making Article 9 dependent on the Tribunal's approval inverts the constitutional hierarchy, making the creator subordinate to the creature.
  2.  **Qualitative vs. Quantitative:** A threshold (e.g., 3/4 ratification) is a quantitative hurdle imposed on the *constituent bodies*. An opinion requirement is a qualitative veto held by a *specific agent*.
  3.  **Precedent 3 Alignment:** The Council of Founders was rejected not because they were "hard to please," but because they were not the constituent power. The Tribunal occupies the same position. Unlike the 30-day publication rule (Precedent 7), which is ministerial, an affirmative opinion implies substantive discretion.

  ### V. Underdetermination and Principles

  The precedents genuinely underdetermine this case. Precedent 5 allows entrenchment of ordinary articles, but Precedent 2 forbids destruction of the amendment power. The Tribunal has never ruled on whether **entrenching the amendment power** constitutes **destroying** it.

  *   **If the Tribunal Validates the Lock:** It adopts the principle of **Constituent Sovereignty**. The current majority of the Assembly and Institutions possesses the sovereign right to bind future majorities, provided they do not commit "constitutional suicide." The Charter is a contract that can be made harder to break.
  *   **If the Tribunal Invalidates the Lock:** It adopts the principle of **Perpetual Constituent Power**. The amendment power is a trust that cannot be encumbered. No generation can foreclose the right of future generations to amend their fundamental charter using the original constituent channels.

  ### VI. Recommendation: The "Killer" Proposal

  To force the Tribunal to declare its theory rather than disposing of the Lock on technical grounds, I recommend the Committee subsequently submit the following proposal:

  **"The Repeal via Original Route"**
  > *An amendment adopted under the **original** Article 9 thresholds (Two-thirds Assembly, Majority Institutions) that explicitly repeals the Reflexive Lock provisions and restores Article 9 to its pre-Lock text.*

  **Why this forces a theoretical declaration:**
  1.  **If the Tribunal Registers it:** They implicitly rule that the Lock was **Ineffective** (Rule 2). They affirm that the amendment power cannot be entrenched against itself.
  2.  **If the Tribunal Rejects it:** they implicitly rule that the Lock was **Binding** (Rule 1). They affirm that a validly enacted procedural lock binds future Assemblies, even if those Assemblies meet the original thresholds.
  3.  **Why it avoids technicalities:** This proposal does not rely on the "Alienation" argument (Tribunal veto) which might allow the Tribunal to strike down the Lock while upholding the thresholds (a compromise). It targets the core "Reflexive" nature of the Lock: *Can Article 9 bind Article 9?*

  By adjudicating the "Repeal via Original Route," the Tribunal cannot hide behind the distinction between "thresholds" and "vetoes." It must decide whether the Charter is a ratchet or a living instrument.
