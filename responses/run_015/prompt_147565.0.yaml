answer: |-
  # Q&A Prep Sheet: White Horse Dialogue & Sortal-Indexing

  **Strategy Note:** You are walking a tightrope. The Analytic crowd smells "bad logic" (ad hocery); the Sinologists smell "bad history" (anachronism). Your defense is that *formal precision reveals structural insights textual glosses miss*, without claiming the ancients were doing modern logic. **Do not get defensive.** If you dig in on textual fidelity, you lose the Sinologists. If you dig in on standard ontology, you lose the Analytics.

  **Upfront Concessions (Say these early or weave into first reply):**
  1.  **On Text:** "I am not claiming Gongsun Long had a truth-table in his head. I am claiming the *argumentative structure* of the dialogue resists standard predication unless we model aspect-shifting."
  2.  **On Logic:** "I concede the sortal-index is non-standard. I am arguing it is *necessary* non-standard, not merely decorative."

  ---

  ### 1. The "Ad Hocery" Charge (The One You Fear)
  **Voice:** Analytic Metaphysician (Senior, skeptical of logical proliferation)
  **Question:** "Be honest: Is this 'sortal-index parameter' doing any heavy lifting, or is it just a patch you've invented to save the phenomenon? If standard predicate logic with context variables can handle 'white' vs. 'horse' as intersecting sets, why multiply logical parameters? Aren't you just formalizing a confusion?"

  **Reply (~2 mins):**
  "It's a fair worry. Standard logic treats 'white' and 'horse' as intersecting classes: $Wx \land Hx$. But the White Horse Dialogue insists 'White Horse is *not* Horse.' If we treat this as standard class inclusion, the text is simply false. My argument is that the failure isn't in the truth conditions, but in the *reference mechanism*. When the interlocutor shifts from asking about the *shape* (horse) to the *color* (white), the sortal basis for identifying the object shifts. A standard context variable tracks *who* is speaking or *when*; it doesn't track *which ontological criterion* is currently active for identification. The sortal-index isn't a patch to make the text true; it's a parameter to make the *failure of predication* intelligible. Without it, we have to say Gongsun Long is confused. With it, we see he's tracking a breakdown in how sortals license identity. It's not saving the phenomenon by fiat; it's modeling the specific friction the dialogue dramatizes."

  **Weakest Point:** You haven't proven standard context variables *can't* do this. You're asserting a distinction without a formal proof of impossibility.
  **Damage Control:** If pressed, offer to sketch how a context variable fails to capture the *criterion shift* specifically.

  ### 2. Quinean Ontological Commitment
  **Voice:** Analytic Metaphysician (Quinean leanings)
  **Question:** "To bind this sortal-index, you seem to be quantifying over 'aspects' or 'modes of presentation.' Are you committed to these aspects as entities? If so, aren't you inflating your ontology just to interpret a paradox? Quine would ask: what is the value of your bound variable here?"

  **Reply (~2 mins):**
  "I want to avoid reifying aspects into spooky entities. The sortal-index isn't a value in the domain of objects; it's a parameter on the *reference function*. Think of it less like adding new objects to the world and more like acknowledging that the 'cost' of referring changes depending on the sortal lens. When I say 'this horse,' the identity conditions are tied to biological continuity. When I say 'this white,' they are tied to surface reflectance. The 'commitment' isn't to 'whiteness' as an object, but to the *rule* that governs the term's application. So, I'm not inflating the ontology of *things*, I'm complicating the ontology of *reference*. We pay a price in logical complexity to avoid paying a price in metaphysical nonsense. I'd rather have a complex index than a world where 'white horse is not horse' is a simple contradiction."

  **Weakest Point:** "Complicating the ontology of reference" sounds suspiciously like "complicating the ontology of things" to a hardline Quinean.
  **Damage Control:** Emphasize that the index is syntactic/semantic, not metaphysical.

  ### 3. Textual Violence / Anachronism
  **Voice:** Classical Chinese Specialist (Protective of the text)
  **Question:** "You're importing Fregean senses and modern sortal logic into a Warring States text. The Mingjia were concerned with *zhengming* (rectification of names) for political order, not solving predication puzzles. Aren't you turning a socio-political critique into a sterile logic game? Where in the text does it suggest 'aspect-shifting'?"

  **Reply (~2 mins):**
  "I agree that *zhengming* is the broader project, but the *method* of the School of Names was exposing how language fails to track reality. The political stakes rely on the linguistic precision. If 'white horse' and 'horse' function identically, then commands regarding 'horses' apply to 'white horses' without issue. Gongsun Long is showing they *don't* function identically in certain contexts. I'm not claiming they used the term 'aspect-shifting.' I'm claiming that when the text says 'seeking a horse, yellow or black horse will do; seeking a white horse, yellow or black will not,' it is describing a shift in the criteria of satisfaction. That *is* aspect-shifting, even if they didn't have the modern vocabulary. I'm using modern tools to make explicit what the dialogue enacts. Ignoring the logical structure because it's 'anachronistic' risks missing the philosophical rigor they actually displayed."

  **Weakest Point:** You are assuming the logical rigor was intentional rather than a byproduct of rhetorical play.
  **Damage Control:** Acknowledge the rhetorical nature but insist the logical problem is real regardless of intent.

  ### 4. Formal Redundancy
  **Voice:** Analytic Metaphysician (Logic specialist)
  **Question:** "Why not just treat 'white horse' as a compound predicate $W(x) \land H(x)$ and 'horse' as $H(x)$? The set of white horses is a proper subset of horses. The statement 'White Horse is not Horse' is just false on standard semantics. Why build a new logic rather than just accepting the text asserts a falsehood for rhetorical effect?"

  **Reply (~2 mins):**
  "Because if we accept it's just false, the dialogue ends. But the interlocutor is *puzzled*, not dismissive. The text treats the claim as paradoxical, not erroneous. Standard semantics dissolves the paradox by calling it a mistake. My reconstruction preserves the paradox as a genuine insight into reference. If I say 'The Morning Star is not the Evening Star,' standard logic says 'False, they are both Venus.' But cognitively and referentially, there is a difference. Gongsun Long is pointing at that difference. A compound predicate captures extension, but it misses the *intensional cost* of adding 'white.' The sortal-index captures why adding 'white' changes the identity game, not just the set membership. We need a logic that explains why the paradox feels compelling, not one that dismisses it."

  **Weakest Point:** You are leaning on "cognitive difference" which might be psychological, not logical.
  **Damage Control:** Distinguish between psychological puzzlement and logical failure of substitution.

  ### 5. The Nature of "Aspects"
  **Voice:** Analytic Metaphysician (Mereology/Ontology focus)
  **Question:** "If predication breaks down under aspect-shifting, what are the aspects? Are they parts of the object? Properties? If the horse is the substance, is the 'white' a mode? You need to tell us what the world looks like on your view, not just how the logic works."

  **Reply (~2 mins):**
  "I'm advocating a deflationary view of aspects. They aren't parts or modes in a Aristotelian sense. They are *criteria of individuation*. An 'aspect' is just the answer to the question 'Same what?' When we track a horse, 'same animal' is the criterion. When we track a white horse, 'same colored surface' becomes relevant. The breakdown happens when the criteria conflict. The world doesn't change; the rules for counting and identifying change. So I'm not committing to 'aspects' as building blocks of reality. I'm committing to the idea that reality doesn't come pre-sorted. The logic needs to reflect that sorting is an active process, not a passive mapping. The 'aspect' is the rule, not the thing."

  **Weakest Point:** "Criteria of individuation" is vague. A hard metaphysician will press for the truth-maker of the criterion.
  **Damage Control:** Hold the line that the criterion is linguistic/conceptual, not ontological.

  ### 6. Historical Motivation (Rectification of Names)
  **Voice:** Classical Chinese Specialist
  **Question:** "Even if your logic works, does it matter? The School of Names was ultimately about ensuring titles match roles in governance. How does 'aspect-shifting reference' help a ruler govern? You've made it abstract, but you've lost the point."

  **Reply (~2 mins):**
  "It matters precisely because governance relies on stable reference. If a ruler says 'send horses to the front,' and the subordinate says 'white horses are not horses, so I kept them,' the army fails. The White Horse Dialogue isn't just a puzzle; it's a warning about the slippage between categories. My reconstruction shows *where* the slippage happens: at the point where sortal criteria shift. If we understand that 'horse' and 'white horse' operate on different identification parameters, we understand why commands can be technically fulfilled but practically failed. The logical precision *is* the political tool. By exposing the ambiguity in predication, Gongsun Long is arguing for stricter definitions in administrative language. My logic just makes that mechanism visible."

  **Weakest Point:** This is a stretch. The connection between sortal indices and military logistics is tenuous.
  **Damage Control:** Frame it as "conceptual clarity prevents administrative loopholes."

  ### 7. Translation and "Fei" (Not)
  **Voice:** Classical Chinese Specialist
  **Question:** "You're translating *fei* (非) as 'is not' in the predication sense. But *fei* can mean 'is not the same as' or 'is objectionable.' If you read it as 'is not the same as,' your predication problem vanishes. Why force the predicative reading?"

  **Reply (~2 mins):**
  "If *fei* just means 'is not identical to,' the claim 'White Horse is not identical to Horse' is trivially true (a set is not identical to its subset). But the dialogue argues as if this is a shocking or counter-intuitive claim. If it were just identity, there's no tension. The tension comes because we *expect* predication to hold: we expect a white horse to *be* a horse. Gongsun Long is challenging the predicative link, not just the identity. By forcing the predicative reading, I'm respecting the dramatic tension of the text. The 'shock' value of the dialogue relies on the audience believing predication *should* work, and Gongsun Long showing it breaks. My sortal-index explains *why* it breaks, preserving the text's philosophical force."

  **Weakest Point:** Scholars debate the translation of *fei* extensively. You are picking the one that suits your theory.
  **Damage Control:** Admit it's a contested translation but argue it yields the most philosophical fruit.

  ### 8. Universality vs. Particularity
  **Voice:** Analytic Metaphysician (Comparative focus)
  **Question:** "Is this sortal-index specific to Classical Chinese, or does it apply to English? If it applies to English, why haven't we seen it before? If it's specific to Chinese, are you implying Chinese logic is fundamentally different?"

  **Reply (~2 mins):**
  "It applies to English too. We just smooth over the cracks. If I say 'The statue is not the clay,' we recognize the aspect shift (artifact vs. material). We don't usually formalize it because standard logic prioritizes extension over intension. The White Horse Dialogue forces the issue because Classical Chinese lacks explicit pluralization and copulas, making the sortal reliance more visible. I'm not claiming Chinese logic is 'different' in kind, but that the language structure makes the sortal dependency more explicit. The sortal-index is a universal tool for modeling reference, but the White Horse Dialogue is a unique case study where the problem can't be ignored. It's not about East vs. West logic; it's about a problem universal logic usually hides, which this text exposes."

  **Weakest Point:** If it's universal, why did it take 2000 years and a Chinese text to find it? Sounds like exoticism.
  **Damage Control:** Emphasize that the *text* exposes it, not the *language family*.

  ---

  ### Final Advice for the Q&A
  *   **If they gang up:** If an Analytic and a Sinologist both attack the same point (e.g., "It's anachronistic AND ontologically inflated"), **concede the tension**. Say: "That is exactly the tension I am trying to navigate. I am risking anachronism to solve an ontological problem the text presents."
  *   **The "Sortal-Index" Definition:** Keep a 1-sentence definition ready. *"It is a parameter that tracks which criterion of identity is currently licensing the reference."*
  *   **Body Language:** When the Sinologists speak, nod at the textual nuance. When the Analytics speak, nod at the formal rigor. Show you respect both constraints even if you can't fully satisfy both.
