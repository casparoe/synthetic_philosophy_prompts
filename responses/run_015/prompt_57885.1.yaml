  ### Candidate Rules

  **Moderate Anti-Reductionism**
  This rule posits that testimony provides immediate, prima facie justification for belief. Essentially, when someone asserts a proposition, the listener is entitled to accept it as true by default, without needing independent verification. This fits your roommate's verdicts because she allows belief in the passerby and AC repairman without demanding specific proof of their honesty. However, this justification is defeasible. If there are specific "defeaters"—like the jailhouse informant's clear motive to lie or the anonymous nature of a viral death rumor regarding a high-stakes event—the default justification is overridden. In this view, the child believes the parents because nothing defeats that trust, though the roommate mentioned the track record as supportive rather than strictly necessary. The core principle is trust first, verify only if something seems off or if the context is inherently suspicious.

  **Global Reductionism**
  Global Reductionism argues that testimony is only justified if the listener has positive inductive reasons to trust that specific type of source. You don't need a personal history with the speaker, but you do need background evidence that people in that context are generally reliable. This fits the AC repairman (uniforms signal institutional reliability) and the passerby (face-to-face interaction is generally trustworthy). It explains the child's belief via the observed track record of parents. Crucially, it explains the rejection of the viral thread and informant: there is no general inductive evidence that anonymous online posters or incentivized criminals are reliable. Trust isn't default; it's earned through the perceived reliability of the source category. You need positive reasons to think this kind of testimony is usually true.

  **Pragmatic Encroachment**
  This rule suggests that whether a belief is justified depends on the practical stakes of being wrong. In low-stakes scenarios, like asking for library directions, minimal evidence is required, so believing the passerby is fine. In high-stakes scenarios, like a juror deciding guilt or verifying a celebrity death, the threshold for justification rises significantly. This explains why the viral thread and informant testimony are rejected; the consequences of error are too high for such weak evidence. The child's belief is acceptable because the stakes of believing about dinosaurs are low for a five-year-old. The AC guy is believed because the cost of disbelief (no AC) outweighs the cost of potential deception, given his professional presentation. Stakes dictate the evidence threshold.

  ### What Each Predicts

  Moderate Anti-Reductionism predicts the belief is justified. Since your cousin has no specific reason to doubt unit4b and the post seemed plausible, the default trust applies. There are no obvious defeaters like a known history of lying or conflicting reports.

  Global Reductionism predicts the belief is unjustified. Anonymous Discord users lack the general inductive reliability of face-to-face strangers or uniformed professionals. There is no background evidence that "unit4b" or similar users are trustworthy sources for safety info.

  Pragmatic Encroachment predicts unjustified. A chemical smell scare involves health and safety, raising the stakes high. The evidence (one anonymous post) doesn't meet the higher threshold required for safety-critical actions.

  ### Best Bet

  I'm betting on Global Reductionism. The key clue is the child case. A pure anti-reductionist would say the child is justified simply because the parents spoke; the fact your roommate emphasized the kid's inductive history ("seen her parents get everyday stuff right") suggests she thinks positive reasons are necessary. Similarly, the AC guy's uniform serves as a proxy for general reliability, distinguishing him from the anonymous viral poster. The Discord user lacks both a personal track record and the institutional markers of the AC guy. Since your roommate rejects anonymous online claims in the viral case, she will likely treat the Discord user similarly, viewing anonymous text as insufficiently supported by general evidence of reliability. The pattern requires positive cues, not just absent defeaters.

  ### Splitter Case

  Imagine a used car salesman tells your cousin the tires are new. He wears a uniform and works at a dealership, but everyone knows salesmen often lie. There are no specific defeaters for this specific transaction, but general induction is negative. A Global Reductionist says don't believe (general reliability is low). A Moderate Anti-Reductionist says believe (no specific defeater for this instance). This separates whether general reputation counts as positive evidence or just a potential defeater.
