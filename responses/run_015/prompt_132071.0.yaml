answer: |-
  Dear Editor, we write to submit the joint statement resulting from our adversarial collaboration on the Church-Fitch knowability paradox, specifically focusing on Fitch's Theorem 5 from his 1963 paper. We began by establishing the common ground upon which any further debate must rest, agreeing on the derivation itself and the specific assumptions it requires. We both affirm that the proof is extremely cheap in terms of logical resources, relying primarily on the distribution of the knowledge operator over conjunction, the factivity of knowledge, and standard modal moves involving necessitation and the interaction between possibility and knowledge. The core of the result is that no sentence of the form p and not-known-p can be known by anybody, because assuming such a proposition is known leads immediately to a contradiction via the distribution and factivity principles. We agree that this constitutes a choose your exit reductio rather than a direct refutation of any single premise in isolation, forcing a choice between abandoning the universal knowability thesis, restricting the scope of truths to which it applies, or modifying the logical properties of the knowledge operator. We further agree that dropping factivity changes everything, as the contradiction depends on knowing entailing truth, and without factivity the inference from knowing an unknown truth to a contradiction blocks. We also concur that the same style of argument can be run on other operators such as provability, ideal warranted assertibility, or could-be-rationally-believed-with-certainty, though we leave open the question of which of those variants go through without factivity, noting that for operators like provability in a sound system, factivity holds, while for others it may not.

  Having secured this baseline, we turn to the disagreements that define our respective positions, stated here in wording each side accepts as a fair statement of their view. The Repairer maintains that the collapse only shows the unrestricted principle is false, and that anti-realism can survive with a narrower knowability thesis that restricts the domain of quantification to avoid the paradoxical instances. The Undertaker thinks every restriction that blocks the proof is either ad hoc or else leaves you with a principle too weak to do the work knowability was supposed to do, such as ruling out evidence-transcendent truths or underwriting an epistemic account of truth, and concludes that the honest move is to drop knowability entirely and say what anti-realism is without it. We structured our debate around four specific cruxes to clarify where the substantive disagreement lies versus where it might be merely verbal.

  The first crux concerns the ad-hocness of any proposed restriction. We agreed to define a class of propositions as Moorean-free if it contains no proposition of the form p and not-Kp, noting that a restricted knowability principle survives Fitch only if its domain is Moorean-free, so the Repairer has to exhibit one. The Undertaker proposed a test for principled restrictions: a restriction is principled only if it can be stated in a language with no epistemic vocabulary in it at all, meaning no known, no knowable, and nothing defined out of them, because every truth except the Moorean ones trivially passes the Moorean-free condition and obviously should not count. The Repairer argues that this test is too strict, as it rules out restrictions based on the nature of the truthmaker or the structure of the proposition that are not explicitly epistemic but still avoid the paradox, while the Undertaker insists that any restriction that implicitly relies on epistemic notions to carve out the domain is simply hiding the circularity. We went on record about candidate restrictions, such as restriction to non-modal truths, to observational truths, to truths with actual truthmakers, or to truths statable in some base vocabulary. The Undertaker predicts that the test will show most of these fail because observationality or having a truthmaker often covertly presupposes knowability conditions, whereas the Repairer predicts that a restriction to truths with actual truthmakers or truths statable in a base physical vocabulary will pass the test and preserve enough of the anti-realist intuition to be worthwhile.

  The second crux addresses what the possibility in knowable amounts to. We asked whether the world in which someone knows has to be reachable from ours, sharing laws and perhaps history up to some point with knowers broadly like us, or if bare metaphysical possibility is enough, so that a truth counts as knowable if there is some world anywhere, with different physics or creatures, where somebody knows it. We selected a test case both accept as bearing on this, specifically the exact number of coins in a jar that was melted down before anyone counted it, where the physical evidence has been permanently destroyed. The Repairer predicts that the restricted principle looks defensible under the reachable worlds reading, because if the evidence is destroyed in all reachable worlds, the proposition falls outside the restricted domain of knowable truths, saving the principle from falsification. The Undertaker argues that under the bare metaphysical possibility reading, the proposition remains knowable since some distant possible world might have a counterfactual history where the jar was counted, and thus the principle fails to rule out evidence-transcendent truths in the actual world, which was the original motivation for the thesis. The Repairer counters that the reachable reading is the only one that matters for an epistemic account of truth, while the Undertaker maintains that this retreat makes the principle too weak to support anti-realism about the actual world.

  The third crux involves self-application. We asked whether the knowability principle, restricted or not, is itself a candidate truth, and if the Repairer's principle has to apply to itself, and to the claim that it applies to itself, and so on up. The Repairer suggests there might be a stable stratified or typed version, such as knowability at level n for truths of epistemic depth n, to avoid paradox, while the Undertaker doubts such a hierarchy can be stated in a single sentence without collapsing back into the unrestricted thesis or becoming ineffable. The Repairer predicts that a typed version can be formulated that avoids the paradox while retaining enough expressive power to be useful, whereas the Undertaker predicts that any such hierarchy will either be unstable or fail to apply to the fundamental philosophical claims about truth and knowledge that motivated the project in the first place. We agree that this remains an open technical question, but the Undertaker insists that the burden is on the Repairer to show the hierarchy does not trivialize the thesis.

  The fourth crux is the work test, for the case where the Repairer's principle survives the previous objections. We asked whether the surviving restricted principle still earns its keep, or has it become something a realist could happily sign too. The Undertaker states that they would be convinced they were wrong if the Repairer could produce a restricted principle that a committed realist would reject on metaphysical grounds rather than logical ones, showing it still carries anti-realist weight. The Repairer states they would be convinced they were wrong if it turned out that every restriction sufficient to block the proof was compatible with a robust realism about evidence-transcendent truths, rendering the knowability thesis philosophically idle. We both agree that this is the ultimate stakes of the collaboration, as a knowability principle that rules out nothing is not worth repairing.

  Finally, we each commit to what we would count as evidence or argument against our own position, not just against the other's. The Repairer admits that if no Moorean-free class can be specified without epistemic vocabulary that also includes all the truths anti-realists care about, the restriction project fails. The Undertaker admits that if a restricted principle can be shown to underwrite the key anti-realist arguments against realism without collapsing, the call to drop the thesis entirely is premature. We also flag plainly any part of the row we think is merely verbal. We suspect some of the fight about what in principle and can mean is exactly that, specifically regarding whether can implies physical possibility for creatures like us or metaphysical possibility for any creature. We also suspect the fight about how to read the quantifier over propositions, whether actualist versus possibilist, may be verbal in nature, as it often turns on whether we are quantifying over propositions expressible in our language or propositions existing in a platonic realm. We decide that these parts are verbal because resolving them often changes the wording of the thesis without changing the underlying commitment to whether truth outruns our capacity to recognize it. We hope this document serves as a clear map of the terrain for your volume, distinguishing the logical necessities from the philosophical choices.

  Sincerely, The Repairer and The Undertaker
