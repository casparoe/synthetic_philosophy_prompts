prompt: |-
  Hi — I cover climate policy and the intellectual fights around it for a magazine, and I need help sharpening something before an interview.

  There's a commentator Ive followed for years, Ray Sutcliffe — newsletter, op-eds, a podcast, never held office, no party affiliation worth naming. He's taken public positions on a long list of climate proposals, and a bill is about to drop that I want to know his reaction to in advance. Ive been through his archive and I definately cant fit all of it under one rule, which makes me think he's been running something he's never actually stated. His record, as close as I can assemble it:

  - National carbon fee-and-dividend, rising rate, every dollar back per capita: yes, repeatedly, including defending the dividend against people who wanted the revenue spent on transit instead.
  - A clean electricity standard forcing utilities to a renewables percentage by date: no. His objection was that mandates pile new generation on top of existing fossil capacity and total energy use just keeps climbing.
  - Killing fossil exploration subsidies, and separately cancelling a planned highway widening: yes to both.
  - Corporate net-zero pledges built on voluntary offsets: no, consistently, over many years — offsets are a bookkeeping trick in his telling. This is the thing he's been most reliable about.
  - City congestion charging: yes.
  - Tradable personal carbon allowances, the per-capita ration scheme with household-level trading: no. Too much machinery, impossible to meter honestly, nobody will tolerate it.
  - Big green industrial policy — subsidies for domestic battery and EV plants plus a federal green jobs guarantee: no. Picking winners, and it treats more output as the goal.
  - A gas hookup ban / all-electric building code mandate: no. Price the carbon and let builders work it out.
  - A moratorium on new federal coal leasing: no. His reason was that it just shifts production to other tracts and other countries without touching demand.
  - But also, more than once: he doesn't care if GDP falls, he'd be glad to see the cement industry shrink by half, and we should stop treating falling output in dirty sectors as a damage to be compensated.

  The new thing is called a Virgin Materials Budget. Binding declining annual ceilings — 6% a year from 2030, so roughly half by the early 2040s — on virgin material tonnage in five classes: cement clinker, primary steel, primary aluminium, virgin plastics feedstock, and construction aggregate. The ceilings are enforced by auctioning a shrinking pool of tradeable permits denominated in tonnes, surrendered at the point where the material first enters the domestic economy: mine mouth, quarry gate, port of entry — so imports need permits too, which is meant to answer the leakage objection. Banking allowed for two years, no price floor and no ceiling. Recycled content is exempt from the cap, but only if certified through a mass-balance chain-of-custody scheme. Revenue is not rebated to households; it's earmarked to transit operating budgets and home insulation retrofits. One wrinkle for scale: cement, steel and aluminium come from a few hundred metered facilities, aggregate is most of the tonnage but comes out of thousands of small quarries at a few dollars a tonne, and the plastics exemption is where the lobbying has been heaviest.

  So: does he come out for it or against it? What I actually want is the machinery underneath. I think there are at least two or three different rules that fit his whole record about equally well and that come apart precisely on this bill, and I want them laid out — each one stated sharply enough that I could quote it back to him, each one's prediction about the bill, which one you'd bet on and why, and then the single further proposal I should put to him in the interview that would tell the rules apart, with what each rule predicts there. And if you had to file the headline tonight, which way would you call it.
