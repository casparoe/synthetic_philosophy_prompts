answer: |-
  (a) Problem Statement

  **Final Exam: Microeconomic Theory I**
  **Time Allowed: 75 Minutes**
  **Total Marks: 20**

  **Question 1 (20 Marks)**

  Consider a strategic game where Player 1 chooses a row (Top, Middle, Bottom) and Player 2 chooses a column (Left, Right). Only Player 1's payoffs are relevant for this question. The payoff matrix for Player 1 is:

  | | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 3 | 3 |
  | **Middle** | 5 | 2 |
  | **Bottom** | 2 | 5 |

  **(a) [5 Marks]** Show that Top is strictly dominated by an equal-weight mixed strategy over Middle and Bottom, but that neither Middle nor Bottom strictly dominates Top on its own. Based on this, explain what the definition of strict dominance must allow the "dominating object" to be. Additionally, observe that Top is never a best response to either of Player 2's pure strategies. What does this imply about Top being a best response to mixed strategies, and what does this distinction show about the relationship between dominance and best responses?

  **(b) [5 Marks]** Explain why the order of elimination cannot matter when applying iterated elimination of *strictly* dominated strategies. Your answer must provide the logical argument for why removing strategies never makes a previously dominated strategy undominated. Explicitly state why this logic relies on the inequality being strict and would fail if the inequality were weak.

  **(c) [5 Marks]** Construct a 2x2 game (specify payoffs for both players) in which the order of elimination *does* matter for *weakly* dominated strategies. Identify the weakly dominated strategies for each player. Run the elimination process in two different orders (e.g., eliminate Player 1's strategy first vs. Player 2's strategy first) and show concretely which strategies survive in each case.

  **(d) [5 Marks]** Can iterated elimination of *strictly* dominated strategies ever remove a strategy that is played with positive probability in some Nash equilibrium? Settle this with a logical argument. Then, explain what changes when the dominance relation is only weak, using your example from part (c) or a new one to illustrate whether Nash equilibria can be lost.

  ***

  (b) Model Answer

  **(a)** Consider a mixed strategy $\sigma_1$ that plays Middle with probability 0.5 and Bottom with probability 0.5. Against Left, the expected payoff is $0.5(5) + 0.5(2) = 3.5$. Against Right, the expected payoff is $0.5(2) + 0.5(5) = 3.5$. Since $3.5 > 3$ in both cases, Top is strictly dominated by this mix. However, Middle yields 5 against Left (better than Top) but 2 against Right (worse than Top). Bottom yields 2 against Left (worse) but 5 against Right (better). Thus, no pure strategy strictly dominates Top. This demonstrates that the definition of strict dominance must allow the dominating object to be a mixed strategy, not merely a pure strategy.

  Top is not a best response to Left (Middle pays 5) nor to Right (Bottom pays 5). Because expected payoffs are linear in probabilities, if a strategy is not a best response to any pure strategy of the opponent, it cannot be a best response to any mixed strategy of the opponent. This shows that while "never a best response" is equivalent to "strictly dominated by a mixed strategy" in two-player games, it is not equivalent to "strictly dominated by a pure strategy."

  **(b)** Order independence for strict dominance relies on the property that if a strategy is strictly dominated in a set of strategies $S$, it remains strictly dominated in any subset $S' \subset S$. Suppose strategy $s_i$ is strictly dominated by $\sigma_i$ against all opponent strategies in $S_{-i}$. This means $u_i(s_i, s_{-i}) < u_i(\sigma_i, s_{-i})$ for all $s_{-i} \in S_{-i}$. If we eliminate some opponent strategies to form a smaller set $S'_{-i}$, the inequality must still hold for all remaining $s_{-i} \in S'_{-i}$. The set of conditions required for dominance shrinks, so the dominance relation is preserved. Consequently, eliminating a strategy never "un-eliminates" another; the set of dominated strategies can only grow or stay the same as the game shrinks.

  This logic fails for weak dominance because the inequality is weak ($\leq$). A strategy might weakly dominate another only because of a strict inequality against a specific opponent strategy. If that opponent strategy is eliminated first, the remaining comparisons might all be equalities. In that case, the dominance relation vanishes, and the order of removal determines which strategies survive.

  **(c)** Consider the following 2x2 game:

  | | L | R |
  | :--- | :---: | :---: |
  | **U** | 1, 1 | 1, 1 |
  | **D** | 1, 1 | 0, 0 |

  For Player 1, U weakly dominates D (1≥1, 1≥0). For Player 2, L weakly dominates R (1≥1, 1≥0).
  **Order 1:** Eliminate D first. The game reduces to U vs {L, R}. Player 2 receives 1 from L and 1 from R. Neither weakly dominates the other. Survivors: {U} for P1, {L, R} for P2.
  **Order 2:** Eliminate R first. The game reduces to {U, D} vs L. Player 1 receives 1 from U and 1 from D. Neither weakly dominates the other. Survivors: {U, D} for P1, {L} for P2.
  The sets of surviving strategies differ depending on the order.

  **(d)** Iterated elimination of strictly dominated strategies (IESDS) never removes a strategy played in a Nash equilibrium. In a Nash equilibrium, every strategy played with positive probability must be a best response to the opponent's equilibrium strategy. A strictly dominated strategy is never a best response to any belief (pure or mixed). Therefore, no strategy eliminated by IESDS can be part of a Nash equilibrium.

  For weak dominance, this guarantee fails. A weakly dominated strategy can be a best response if the opponent plays a strategy that makes the payoffs equal. In the example from (c), (D, L) is a Nash equilibrium (Player 1 gets 1, deviating to U gives 1; Player 2 gets 1, deviating to R gives 0). However, if we eliminate D first (as in Order 1), the equilibrium (D, L) is lost because D is removed. Thus, iterated elimination of weakly dominated strategies can discard Nash equilibria.

