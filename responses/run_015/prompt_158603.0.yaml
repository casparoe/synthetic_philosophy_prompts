      *   *Optimization vs. Elimination:* Compiler optimization removes redundancy to make it run *better* on hardware. Greedy reductionism claims the higher levels *don't exist* (eliminativism). Does "skipping IRs" mean the IRs are useless (pragmatic) or false (ontological)? The analogy blurs pragmatic utility with ontological status.

