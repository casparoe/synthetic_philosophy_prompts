      *   *Layered Ontology:* It assumes reality is actually layered like a stack. A flat ontologist (only particles exist) would reject the reality of the IRs.
      *   *Pragmatic Criterion:* It argues greedy reductionism fails because it's "intractable" (unusable binary). This makes explanation about *human understanding* rather than *truth*. A strict physicalist might say, "The greedy reduction is true, just too hard for humans. Truth isn't about tractability."

  5.  **Task 4: Evaluating the Conclusion & Proposing Alternatives:**
      *   *Does the argument hold?* The analogy proves greedy reductionism is *pragmatically* useless (we can't think that way). It does *not* prove it is *ontologically* false. The prompt asks if the conclusion "greedy reductionism collapses" survives. If "collapses" means "is useless for science," yes. If "collapses" means "is false," the analogy is weak because compilers *could* theoretically compile directly (just inefficiently), whereas greedy reductionism might be the *only* ontologically true view.
