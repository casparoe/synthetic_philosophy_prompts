      *   **Task 4:** Evaluate the conclusion (Does greedy reductionism collapse without cranes? Did the metaphor carry the argument?). If it fails, propose a better image.

  2.  **Task 1: The Correspondence Table:**
      *   *Goal:* Map the computing analogy to the philosophical debate.
      *   *Source Code:* High-level phenomena (consciousness, biology, sociology). Things we want to explain.
      *   *Intermediate Representations (IR):* Intermediate scientific levels (psychology, physiology, biochemistry, molecular biology).
      *   *Optimization Passes:* Theoretical simplifications, bridge laws, or perhaps the "elimination" of folk concepts that don't map well (though the prompt suggests proper reductionism *preserves* these). Let's refine: Optimization in a compiler makes code efficient but keeps logic. In science, this is finding the most efficient explanatory path without losing the phenomenon.
      *   *Executable Binary:* The specific physical realization of the phenomenon (the actual neural firing patterns, the specific chemical reactions).
      *   *Hardware Substrate:* Fundamental physics (quantum fields, particles).
      *   *Greedy Reductionist:* The compiler that tries to go Source $\rightarrow$ Transistors instantly.
      *   *Proper Reductionist (Cranes):* The compiler that uses IRs.

  3.  **Task 2: Identifying Fractures (Disanalogies):**
      *   *Causal Efficacy:* In a computer, the IR (e.g., bytecode) doesn't *cause* the transistors to switch; the electrical signals do. The IR is an abstract description. In philosophy of mind (especially non-reductive physicalism), higher levels are often argued to have *downward causation* or at least autonomous causal powers. If IRs are causally inert in the machine, does that undermine the claim that scientific levels are "genuinely explanatory"?
