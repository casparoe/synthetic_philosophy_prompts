answer: |-
  The conference room smelled of ozone and toner. Dr. Evans sat at the head of the table, his hands folded over a closed manila folder. Across from him sat Marcus and Elena, both wearing the clinic's slate-gray scrubs, both with identical tablets resting on the table before them. Between them lay two hardbound ledgers. They were identical in size, bound in the same dark blue cloth, stamped with the same patient ID number: 8940-A.

  But the text inside was different.

  "Page forty-two," Evans said. His voice was low, practiced to avoid triggering startle responses in the waiting patients. "The incident at the bridge."

  Marcus cleared his throat. He was the senior editor, had handled 8940-A for three years. "In my version, Arthur stops the car because he's overwhelmed by grief. He needs a moment to compose himself before continuing to the hospital. It maintains the arc of the devoted husband."

  Elena didn't look at Marcus. She looked at Evans. "In my version, he stops because he's checking the GPS. He's confused. It maintains the arc of the declining cognitive function, which aligns better with the medical scans from that week."

  "The medical scans show normal pressure," Marcus said.

  "The behavioral logs show confusion," Elena countered. "If we go with grief, we have to revise the entries from the following month. He can't be devoted if he forgets her birthday two weeks later. If we go with confusion, the birthday forgetfulness fits. The narrative holds."

  Evans opened the folder. Inside were printouts of the raw data: timestamps, audio transcripts, vitals. The data was neutral. It said *Heart Rate: 98 BPM. Location: Route 9 Overpass. Duration: 14 minutes.* It did not say *why*. That was the editors' job. The editors provided the glue. Without the glue, Arthur was just a collection of moments, unconnected, drifting.

  "If we certify Ledger A," Evans said, tapping Marcus's book, "Arthur remembers himself as a grieving man struggling to cope. If we certify Ledger B, he remembers himself as a sick man struggling to understand."

  "Does it matter?" Marcus asked. "He's stable either way. He's continuous."

  "Continuity isn't the same as truth," Elena said.

  "There is no truth inside the head, Elena. You know the protocol," Marcus said, not unkindly. "There is only coherence. If he reads the entry, he becomes the person who wrote it. The question is which person survives the night."

  Evans looked at the ledgers. They were heavy things. They contained Arthur's childhood, his marriage, the diagnosis of narrative apraxia five years ago, the death of his wife, the sale of the house. In the world outside, these things had happened once. Inside the clinic, they happened every time the ledger was opened. The self was not a stone found in the river; it was the shape of the water flowing around it. When the editors shifted the banks, the water took a new shape.

  "Bring him in," Evans said.

  Marcus stood and opened the door. Arthur waited in the hallway, sitting on a plastic chair. He was looking at his hands. He looked up when Marcus approached, his eyes clear but empty, like a room where the furniture had been removed.

  "Arthur," Marcus said. "Dr. Evans is ready."

  Arthur stood. He followed Marcus into the room. He did not ask why he was there. He did not ask who Elena was. He sat where Marcus indicated. He looked at the two blue books.

  "Arthur," Evans said. "We're reviewing your file. There are two accounts of the day your wife died. We need to know which one feels right to you."

  Arthur blinked. "Which one feels right?"

  "Read them," Evans said, sliding both ledgers forward. He opened them to page forty-two.

  Arthur looked down. He read Marcus's version first. His lips moved slightly. *Arthur pulled over. He put his head in his hands. He missed her already.* Arthur sat still for a moment. A flicker passed behind his eyes, a micro-expression of sorrow. He looked up.

  Then he read Elena's version. *Arthur pulled over. He checked the screen. He didn't know where he was.* The sorrow vanished. His brow furrowed slightly. He looked up again.

  He looked back at the first book. Then the second. He looked at Evans. "I don't know."

  "Take your time," Evans said.

  "I can't," Arthur said. "They both happened. But they didn't happen to the same person."

  The silence in the room was absolute. The HVAC system hummed. Outside, a car door slammed, a sound that belonged to a world where cause and effect were assumed, where people were solid objects moving through space. Here, causality was ink on paper.

  "Which one allows you to sleep?" Marcus asked softly.

  "The first one," Arthur said. "But the second one explains why I'm here."

  Evans closed the ledgers. He didn't need Arthur's input. The committee didn't vote based on patient preference; they voted based on structural integrity. If the narrative collapsed later, if the edits required too much force to maintain, the patient would fragment again. They would wake up tomorrow not knowing who spoke to them yesterday. They would become echoes.

  "We need to decide based on long-term viability," Evans said to the editors, ignoring Arthur for the moment. "Ledger A requires us to edit the birthday incident. We have to change 'forgot' to 'chose not to celebrate due to pain.' That's a significant revision. It changes the nature of his affection."

  "It preserves the love," Marcus said. "Love is the anchor. Without the love, who is he?"

  "He's a patient," Elena said. "If we preserve the love, we preserve the grief. Grief is a high-risk factor for depressive episodes. If we go with confusion, the grief is mitigated by the condition. He's not sad because she's gone; he's sad because he's sick. It's safer."

  "Safer for whom?" Marcus asked.

  "For the continuity," Elena said.

  Evans looked at Arthur. Arthur was watching a dust mote float in the light from the window. He was waiting to be told who he was. He was not a man waiting for a decision; he was the decision waiting to be made. If Evans signed off on Ledger A, Arthur would leave the room loving a ghost. If he signed Ledger B, Arthur would leave the room fearing his own mind. Neither was the "real" Arthur. The real Arthur was the signature at the bottom of the certification page.

  "Turn to page forty-three," Evans said to Arthur.

  Arthur turned the page. It was blank in both books. The future was unwritten.

  "Close them," Evans said.

  Arthur closed the books. He placed his hands on top of them. He looked at Evans, waiting. The pressure in the room shifted. The choice wasn't about the past. It was about what kind of vessel was needed to carry the future.

  Evans picked up his pen. It was a standard clinic issue, black ink, permanent. He opened Ledger A. He hovered over the certification box. He looked at Marcus, who nodded slightly. He looked at Elena, who stared at the table.

  If he chose A, he validated the idea that love survives the mind. If he chose B, he validated the idea that the mind constructs love. Both were lies. Both were true. The ledger was not a record; it was a mold.

  Evans signed Ledger B.

  He slid it toward Arthur. "This is your file, Arthur. Take it with you to the reading room."

  Arthur picked up the book. He held it against his chest. He stood up. He looked at Marcus. "Did I love her?"

  Marcus opened his mouth. He looked at Evans. Evans shook his head slightly. *Don't contaminate the new text.*

  "You read the book," Evans said. "In an hour, you'll know."

  Arthur nodded. He turned and walked out of the room. He walked with a specific gait now, slightly hesitant, checking his footing. The narrative of confusion had already begun to settle into his muscles. He was becoming the man who checks the GPS. The man who forgot the birthday because of the sickness. The grief was being excised, surgically removed by the choice of pronouns and adjectives.

  Marcus waited until the door closed. "You chose the safer lie."

  "I chose the coherent one," Evans said. He opened Ledger A, the rejected version. He took a red marker from his pocket. He drew a line through the certification box. *Void.* He placed the book in the archive bin. It would be pulped next week. The history inside it would cease to exist. There would be no record that Arthur was ever the grieving husband.

  "Will he remember us?" Elena asked. "From this meeting?"

  "He'll remember what the ledger says about this meeting," Evans said. "Tomorrow, when he comes in for his weekly interview, he'll thank us for clarifying his condition. He won't remember the grief. He won't remember the choice."

  Marcus stood up. He picked up his tablet. "I'll update the master server. Sync the changes to the cloud backup."

  "Make sure the audio logs from today are tagged," Evans said. "Label them 'Administrative.' Don't let them bleed into the personal narrative."

  "Understood."

  They filed out, leaving Evans alone with the archive bin. He looked at the blue book inside. It was thick with paper. It contained three years of a life. A life that was now dead. He reached in and touched the cover. It felt cool.

  He thought about Arthur in the reading room, sitting under the soft lights, reading the sentences that would rewrite his neurons. In an hour, Arthur would not be the man who sat in this chair. He would be the man who wrote the book. And the book was already written.

  Evans closed the bin. He stood up and turned off the conference room light. The room went dark, but the files remained on the table, waiting for the next patient, the next story, the next gravity. He locked the door behind him and walked down the hall, his footsteps echoing on the linoleum, a steady rhythm marking time in a place where time was only something you wrote down.
