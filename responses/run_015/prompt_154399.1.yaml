answer: |-
  Your reconstruction of the Scholium is accurate, and your confusion touches upon the central metaphysical tension in Newton's natural philosophy. The difficulty arises because Newton is attempting to establish a physical reality (absolute space) that is, by his own definition, imperceptible to the senses, using only perceptible effects (tension, concavity) as proof. To resolve your three points, we must distinguish carefully between the *criteria* for motion, the *cause* of forces, and the *ontology* of the framework in which these occur.

  ### 1. Causal Agent vs. Ontological Ground

  Newton's argument does not require absolute space to act as a **causal agent** in the sense of an efficient cause that pushes or pulls the water. Rather, absolute space functions as an **ontological ground** or a necessary reference frame that makes the distinction between true and apparent motion intelligible.

  In Newton's dynamics, the immediate cause of the water climbing the bucket or the cord tensing is not space itself, but the *vis insita* (innate force) or inertia of the matter. Matter strives to persist in its state of rest or uniform motion in a straight line. When a body is forced into circular motion, its inertia manifests as an endeavor to recede from the axis of rotation. This endeavor is the physical cause of the concavity and tension.

  However, this endeavor only arises if the motion is "true" circular motion. If the motion were merely relative (e.g., the bucket spinning around stationary water), there would be no such endeavor. The problem Newton faces is defining what makes motion "true" rather than "relative." If space were merely relational, any frame could be considered at rest. Newton posits absolute space to provide a unique, privileged standard of rest and motion. Space does not *generate* the force; it defines the state of affairs (acceleration relative to absolute space) that *triggers* the inertial response of the matter.

  Therefore, Newton is committed to the claim that there is a **non-relational fact of the matter** about the state of motion. Absolute space is the ontological substrate that renders this fact determinate. It is not that space exerts a force on the water; it is that the water's acceleration *with respect to space* is the condition under which the water's own inertia produces observable stress. Space is the immutable stage that allows us to say the water is *really* accelerating, even if it is at rest relative to the bucket.

  ### 2. The Two Globes and the Distant Matter Loophole

  Your intuition regarding the bucket experiment is shared by many critics of Newton (most notably Ernst Mach later). The bucket experiment successfully proves that the water's motion is not relative to the *immediate* container (the bucket). However, it leaves open a "relationist loophole": the water might be rotating relative to the bulk of matter in the rest of the universe (the fixed stars, the Earth, etc.). A relationist could argue that the concavity arises because the water is rotating relative to the distant cosmic mass, not relative to an invisible absolute space. If the entire universe rotated with the bucket, the relationist argues, the water would remain flat.

  The **two globes** thought experiment is specifically designed to close this loophole. Newton asks us to imagine a universe containing *nothing* but the two globes and the cord. There are no fixed stars, no Earth, no distant plenum.

  In this scenario, a strict relationist who defines motion *only* as a change of position relative to other material bodies faces a dilemma. The two globes maintain a constant distance from one another; they do not change position relative to each other. If motion is purely relational among bodies, there is no motion in this system, and therefore there should be no tension in the cord.

  Newton argues that we can still calculate the quantity of circular motion from the tension in the cord, even in this void. By removing all distant matter, Newton removes the relationist's fallback reference frame. If tension exists in the absence of all other matter, the motion cannot be relative to other matter. It must be relative to the space in which the globes reside. Thus, the globes case is intended to demonstrate that the inertial effects (tension) depend on acceleration relative to space itself, not relative to any material content, near or far. It forces the conclusion that the "relation" required for true motion is a relation between body and space, not body and body.

  ### 3. Structural Relationism and Newton's Observations

  A contemporary **structural relationist** (often associated with the geometry of spacetime in General Relativity or Newton-Cartan theory) can consistently accept Newton's observational claims while rejecting his substantivalist ontology.

  The disagreement here is metaphysical, not empirical. Both Newton and the structuralist agree on the phenomena: the water climbs, the cord tensions, and these effects correlate with acceleration that cannot be reduced to relative motion between material bodies.

  *   **Newton's View:** Space is a real entity (a substance or emanation of God) that exists independently of the bodies within it. It is the "container."
  *   **Structuralist View:** Spacetime is not a "thing" or container, but a set of geometric structures (metrics, affine connections) that describe the relationships between events and the paths of free-falling bodies.

  The structuralist accepts that there is an **absolute metric structure** to the universe. This structure defines what a "straight line" (geodesic) and "acceleration" are. When the water accelerates relative to this geometric structure, inertial forces arise. The structuralist denies that this structure requires a "substance" to inhere in. They argue that we do not need to posit "Absolute Space" as a distinct entity; we only need to acknowledge that the laws of physics distinguish between inertial and non-inertial frames.

  Therefore, a structuralist can say: "Newton is right that the motion is non-relational (it is absolute acceleration), and he is right about the empirical effects. But he is wrong to conclude that this requires Space to be a substance." For the structuralist, the "non-relational fact" is grounded in the geometry of spacetime itself, which is real but not substantial in the way Newton imagined.

  In the context of your seminar on spatial ontology, this distinction is vital. Newton argues for **Substantivalism** (Space is a thing). The structuralist argues for **Realism about Structure** (Spatial relations and metrics are real, but there is no 'substrate'). Both views support the idea that location and motion have an objective status independent of immediate neighbors—which aligns with the intuition that a property boundary might have an intrinsic spatial reality beyond its relation to adjacent parcels. However, the structuralist achieves this without committing to the metaphysical burden of an unobservable, immutable container.

  ### Summary for Your Position

  To synthesize these points for your draft:

  1.  **Causality:** Newton treats space as an **ontological ground**, not a causal agent. Space defines the standard of rest; the body's own inertia generates the forces when deviating from that standard.
  2.  **The Globes:** This experiment isolates the variable of **distant matter**. By positing a void, Newton attempts to prove that inertial forces persist even when no material reference frame exists, forcing the conclusion that the reference frame is space itself.
  3.  **Structuralism:** A modern structuralist can accept Newton's **phenomena and his rejection of pure relationism** (among bodies) without accepting his **substantivalism**. They replace "Absolute Space" with "Spacetime Geometry," preserving the objective reality of acceleration without the metaphysical commitment to space as an independent substance.

  This suggests that your legal-spatial intuition—that location is not *merely* a relation among adjacent parcels—is supported by both Newtonian and modern structuralist physics. Both reject the idea that spatial facts are exhausted by the positions of neighboring objects, though they differ on what underwrites those facts (Substance vs. Structure).
