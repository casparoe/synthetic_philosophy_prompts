      *   Section 2: The Globes and the Distant Stars. Explain the "Machian" loophole for the bucket and how the Globes seal it by positing a void.
      *   Section 3: Structuralism. Distinguish between "Space as a Container" (Substantivalism) and "Spacetime as Geometry" (Structuralism). Both agree on the concavity, disagree on the metaphysics.
      *   Conclusion: Tie back to the "non-relational fact" idea which is crucial for the user's legal/spatial ontology interest.

  8.  **Final Polish:** Ensure clear headings or distinct paragraphs for the three points. Ensure the language is precise (e.g., distinguishing "relative motion" from "relative position"). (Self-correction: Make sure to explicitly mention that Newton admits we *cannot* observe space directly, only the effects of motion relative to it.)

