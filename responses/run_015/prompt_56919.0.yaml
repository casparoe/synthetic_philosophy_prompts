answer: |-
  ### The Term Sheet: Governance as a Conditional Derivative Structure

  **Instrument:** Policy Contingent Welfare Swap (PCWS).
  **Underlying:** National Welfare Index (NWI). A basket of macroeconomic and social metrics defined by legislative statute.
  **Fixing Agent:** Bureau of Statistical Settlement (BSS). An independent government body empowered to calculate and publish the NWI at Tenor $T$.
  **Settlement Date:** $T + n$ years (e.g., 7 years post-enactment).
  **Settlement Currency:** Fiat (tax receipts).
  **Counterparty:** The State (via a sovereign clearing facility).
  **Market Structure:** Dual conditional futures books.
  1.  **Book A:** `Long NWI | Policy Enacted`
  2.  **Book B:** `Long NWI | Policy Not Enacted`

  **Operating Rule:** The policy is enacted if and only if `Mark_to_Market(Book A) > Mark_to_Market(Book B)` at Decision Time $t_0$.
  **Margin:** Initial and variation margin required on all open positions. Collateral eligible: Treasuries, cash.
  **Position Limits:** None statutory, subject to liquidity constraints and insider trading restrictions (see *Adverse Selection* below).
  **Knock-Out/Condition:** The contract on Book A is void if the policy is not enacted; the contract on Book B is void if the policy is enacted. Settlement occurs only on the realized path.

  **The Dispute Restated:**

  *   **Proponents argue:** The `Mark_to_Market` price aggregates dispersed information more efficiently than deliberative voting. The spread between Book A and Book B represents the expected alpha of the policy. By forcing the State to take the other side of the trade (paying out if welfare drops), you align the State's P&L with the NWI fixing.
  *   **Critics argue:**
      *   **Liquidity Risk:** The market for specific policy outcomes will be thin. Bid-ask spreads will be too wide to signal true expectation.
      *   **Manipulation/Squeeze:** Parties with large notional exposure to the underlying (e.g., landlords in housing policy) can trade the PCWS to force enactment, then manipulate the NWI fixing at settlement to profit on the swap, netting a profit despite social loss.
      *   **Fixing Risk (Basis Risk):** The NWI is a proxy. It cannot capture the full utility function of the populace. You are hedging a metric, not the actual welfare.
      *   **Counterparty Authority:** The State cannot be a neutral clearinghouse. It controls the police power to enforce the result and the statistical power to fix the rate.
      *   **Capital Weighting:** `Mark_to_Market` is a capital-weighted average of beliefs. It violates the governance norm of one-person-one-vote, substituting one-dollar-one-vote.

  ***

  ### The Residue Report

  Here is the sorting of claims based on translatability into your vocabulary.

  **Pile 1: Clean Translation (Contract & Market Structure)**
  *   **Thin Markets:** Translates directly to liquidity risk and wide bid-ask spreads. If the order book is shallow, a small flow moves the price disproportionately, generating false signals.
  *   **Manipulation:** Translates to cornering the market or spoofing to move the `Mark_to_Market` at $t_0$, followed by manipulating the Fixing Agent at $T$.
  *   **Measurement Error:** Translates to Basis Risk. The NWI is the deliverable; "Actual Welfare" is the economic reality. If the correlation between NWI and Actual Welfare breaks, the hedge fails.
  *   **Incentive Alignment:** Translates to Counterparty Risk management. If the State is short the NWI (liable for payouts), they have an incentive to rig the fixing. If they are long, they have an incentive to suppress it.
  *   **Information Aggregation:** Translates to Price Discovery efficiency. The claim is that the order book incorporates private information faster than a committee.

  **Pile 2: Distorted Translation (Concepts Bent to Fit)**
  *   **Legitimacy/Authority:** Translates to **Solvency and Enforceability**. In finance, a contract is valid if the counterparty can pay and the court enforces it. In governance, "legitimacy" is the belief that the counterparty has the *right* to take your capital. This bends "authority" into "creditworthiness," which is not the same thing.
  *   **Democracy (One-Person-One-Vote):** Translates to **Position Limits**. To make this fit, you would have to impose strict notional caps per identity (KYC) rather than per capital. This distorts the market structure by preventing deep pockets from providing liquidity, effectively breaking the price discovery mechanism proponents rely on.
  *   **Public Good:** Translates to **Non-Excludable Underlying**. In a standard derivative, I can profit from a view without you benefiting. In governance, if the policy passes, everyone gets the underlying exposure whether they traded or not. This creates a massive free-rider problem on the cost of information gathering (research), leading to under-investment in due diligence.

  **Pile 3: No Counterpart (The Void)**
  *   **Normative Justice:** There is no contract clause for "fairness" independent of the payoff. If the NWI goes up but distribution becomes brutally unequal, the contract settles successfully. Your vocabulary has no variable for equity, only for aggregate settlement.
  *   **Rights:** In derivatives, everything is fungible and tradable. In politics, some claims (rights) are asserted as non-tradable. You cannot structure a knock-out option on "Free Speech" where the barrier is a legislative vote without implicitly pricing the right as a liability.
  *   **The "We":** Finance assumes distinct counterparties (Buyer vs. Seller). Governance assumes a collective principal. When the "State" is the counterparty, and the "Citizen" is the client, and they are the same legal entity, the concept of "default" dissolves. You cannot margin the State against itself.

  **Imported Assumptions (Flagged):**
  *   *Efficiency:* I am assuming the price *is* the forecast. In governance, the price might be a weapon.
  *   *Liquidity:* I am assuming someone always takes the other side. In policy, the "natural sellers" might be everyone (if the policy is popular) or no one (if it's toxic), breaking the book.
  *   *Exogeneity:* I am assuming the traders cannot move the underlying. In policy, traders *are* the implementers.

  ***

  ### Case Tests

  **Case 1: City Council Upzoning (The Insider Squeeze)**
  *   **Structure:** Underlying is a composite of Property Values + Rent Stability + Congestion Index. Settlement in 7 years.
  *   **The Frame:** Landlords and Developers are naturally Long `NWI | Upzoning`. Tenants are naturally Short.
  *   **The Failure:** This is not just adverse selection; it is **control of the deliverable**. The Developers have the inventory (land) and the operational capacity to influence the fixing (by building or not building, by lobbying the BSS).
  *   **Dynamics:** If Developers accumulate a large notional position on the "Upzone" book, they push the price above the "No Upzone" book. Policy enacts. They then have a financial incentive to ensure the NWI fixes high. They can do this by building high-quality units (boosting values) while displacing tenants (lowering rent stability, but perhaps the index weights values higher).
  *   **Verdict:** The market becomes a mechanism for transferring wealth from tenants (who are short the policy and lack capital to margin) to landlords. The "liquidity" is provided by the very parties who can manipulate the underlying. In trading terms, this is allowing a market maker to trade on their own inventory without disclosure, while also writing the index methodology. The contract is unbankable.

  **Case 2: Sanctions (Reflexivity/Gamma Risk)**
  *   **Structure:** Underlying is National Economic Security Index. Decision: Impose Sanctions on Adversary X.
  *   **The Frame:** The market prices the probability of Security Index performance *given* Sanctions.
  *   **The Failure:** **Endogenous Underlying.** In a standard option, buying a call on Oil does not change the spot price of Oil significantly. In this contract, if the `Mark_to_Market` on "Sanctions" crashes (market predicts failure), the Government may choose *not* to sanction.
  *   **Dynamics:** The price *is* the signal. If speculators short the "Sanctions" book heavily, they signal high risk. The Government, following the rule, might abort the policy. If they abort, the "Sanctions" book is knocked out. The speculators profit from forcing the policy cancellation.
  *   **Verdict:** This creates infinite gamma for the State. The market price changes the probability of the event being priced. You cannot clear a contract where the settlement condition is determined by the mark-to-market of the contract itself. It is a feedback loop that leads to instability or manipulation by foreign actors (who can short the security index to force policy paralysis).

  ***

  ### Conclusion: The Structural Deficit

  The residue is not evidence of soluble contract-design problems. It is evidence of a missing structural asset: **A Neutral Counterparty.**

  In your world, a derivative works because the CCP stands between buyer and seller, and the Fixing Agent is independent of the P&L of the participants. In Futarchy:
  1.  **The Counterparty is the State:** The State cannot be margined. It cannot default in a meaningful way (it prints the settlement currency or changes the law). You cannot enforce a payout against a sovereign that decides the metric was "measured incorrectly."
  2.  **The Fixing Agent is Political:** The NWI definition is a legislative act. The party losing the trade has a direct incentive to lobby for a change in the index methodology before settlement. This is retrospective rule-changing, which kills any derivatives market instantly.
  3.  **The Underlying is Endogenous:** As seen in the Sanctions case, policy markets violate the assumption that the trader is a price-taker on the underlying. The traders are the principals.

  **What the Vocabulary Reveals:**
  Your framework exposes three things the political debate misses:

  1.  **The Condition Declaration Risk:** In a knock-out option, the barrier is objective (e.g., Spot > 100). In policy, "Enactment" is discretionary. Who declares the condition met? If the market votes "Enact," but the bureaucracy slows walks it, the option expires worthless. The "oracle" is human and corruptible.
  2.  **Capital-Weighted Consensus:** The debate argues about "votes." Your vocabulary identifies this as **liquidity provision**. A prediction market does not produce a consensus; it produces a price cleared by capital. If the wealthy believe X and the poor believe Y, the price reflects X. This isn't a bug in the math; it's a feature of clearing. The political debate treats this as "unfair"; the trading desk treats it as "solvency." But in governance, solvency is not the only constraint.
  3.  **Reflexive Gamma:** The political debate assumes policies have outcomes. Your vocabulary sees that in governance, the *expectation* of the outcome *is* an input to the outcome. A market on "Civil Unrest" triggers Civil Unrest. You cannot structure a hedge against a variable that moves in response to the hedge ratio.

  **Final Verdict:**
  The proposal fails not because the politics are wrong, but because the **trade cannot clear.** There is no enforceable settlement agent, the underlying is manipulable by the position holders, and the contract itself alters the probability of settlement. It is a term sheet for a product where the issuer, the regulator, the fixing agent, and the largest counterparties are the same entity, trading on an underlying they control, with the right to change the settlement terms ex-post. In your vocabulary, that is not a market. It is a Ponzi structure with a legislative charter.
