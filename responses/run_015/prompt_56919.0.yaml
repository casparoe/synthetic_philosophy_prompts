      *   *Contract Type:* Binary options or Difference swaps? Hanson suggests conditional markets. Let's frame it as a pair of conditional futures: `NWI | Policy Enacted` vs. `NWI | Policy Not Enacted`.
      *   *Settlement Agent:* A government bureau (statistical agency). This introduces counterparty risk (government can rig the fix).
      *   *Clearing:* Central Counterparty (CCP). Who margins this? The state? Private capital?
      *   *Liquidity:* Who provides it? If the stakeholders are the traders, we have insider trading issues.
      *   *Payoff:* Denominated in currency (tax revenue? fiat?).
