          *   *Traders:* Landlords/Developers (Long), Tenants (Short).
          *   *Issue:* Adverse Selection. Traders know the outcome because they *cause* the outcome or have private info on development plans. This isn't just insider trading; it's *market making on your own inventory*.
          *   *Contract Risk:* Squeeze. If developers hold the long, they can force the policy, then manipulate the underlying fix to payout.
      *   *Case 2: Sanctions.*
          *   *Underlying:* Economic stability / Geopolitical success metric.
          *   *Reflexivity:* The price *is* the signal. If the market prices "Sanctions = Bad," the government might not sanction. If the market prices "Sanctions = Good," they do.
