  4.  **Developing the "Residue Report":**
      *   *Category 1: Clean Translation.* Market mechanics, liquidity provision, margin requirements, settlement lag, basis risk (between metric and actual welfare).
      *   *Category 2: Distorted Translation.* "Legitimacy" becomes "Counterparty Risk/Authority to Fix." "Democracy" becomes "Capital Weighting." "Manipulation" becomes "Cornering/Squeeze."
      *   *Category 3: No Counterpart.* Moral authority, normative justice, the *reason* for the metric (why *this* welfare function?), the concept of "rights" that cannot be priced.
