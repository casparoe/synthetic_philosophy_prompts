      *   Where framework runs out? Yes.

  *(Self-Correction on the "Three Buckets" point)*: I need to be careful. Epictetus *does* talk about things that are "not completely up to us" (like the body), but he ultimately classifies them as "not up to us" regarding the *good*. The modern "three buckets" is often a distortion to make Stoicism palatable. I will argue it's a modern invention that obscures the sharpness of the dichotomy, but the *intuition* behind it (that some externals are harder to manage than others) is valid via "preferred/dispreferred indifferents."

  *(Self-Correction on "Retroactive Control")*: I need to be firm. You cannot control the past. You can control the *salience* of the past. This is a distinction between *fact* and *impression*.

