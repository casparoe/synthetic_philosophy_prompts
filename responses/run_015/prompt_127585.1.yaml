  *(Final check on the "Regulative Ideal" point)*: This is the most dangerous part of the summary. It sounds like a Neo-Kantian gloss (Cohen/Natorp) or perhaps a later analytic attempt to sanitize Bradley. Bradley is a metaphysical realist about the Absolute. I must be firm here.

