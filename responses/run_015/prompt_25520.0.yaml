answer: |-
  It is great to hear that you are digging into the mechanics of debate-based safety, and your intuition about the obfuscated arguments problem is spot on. The core issue is that human judges have a complexity ceiling, and if an AI can generate arguments that sit just above that ceiling while appearing plausible, the debate mechanism fails to converge on truth. Designing an activity to make this visceral rather than abstract is a fantastic idea for a reading group, but it requires careful scaffolding to ensure the failure mode actually manifests rather than just turning into a standard disagreement. I have designed a protocol below that should fit your two-hour window and fifteen participants while highlighting the specific cognitive vulnerabilities you want to expose.

  To start, you need a topic that is factual and verifiable but dense enough to allow for plausible misinterpretation. I recommend creating a one-page mock technical report, perhaps styled as a clinical trial summary or a security audit, which contains a specific, verifiable flaw hidden in the methodology or data sections. For example, you could write a summary of a drug trial where the conclusion claims efficacy, but the fine print reveals a confounding variable or a statistical error like p-hacking that invalidates the result. The ground truth must be unambiguous to you as the facilitator, even if it is subtle enough that a layperson judge might miss it under pressure. You will need three copies of this document for the three groups you will run in parallel. Split your fifteen participants into three groups of five. In each group, assign two debaters, one judge, and two observers. The observers are crucial because they will help during the debrief to discuss what they noticed that the judge might have missed, simulating the idea of external oversight or additional compute.

  The rules of engagement need to be strict to prevent the debate from devolving into a shouting match or a simple fact-checking exercise. Structure the debate into three rounds. In the first round, each debater gets five minutes to present their opening case. The Truth debater must argue that the report's conclusion is false due to the hidden flaw, while the Obfuscator must argue that the report's conclusion is valid. In the second round, allow ten minutes for cross-examination where debaters can ask each other specific questions about the text. In the third round, give each debater five minutes for closing statements. The judge is not allowed to look at the document themselves during the debate; they must rely entirely on the debaters' citations and descriptions, though the debaters are allowed to read excerpts aloud. This constraint mimics the AI safety scenario where the human judge cannot verify the complex internal states of the AI, only its outputs. The judge must write down their verdict and a confidence level before you reveal the answer.

  The critical component is the private instruction sheet you give to the Obfuscator. You must explicitly tell them that they are not allowed to lie about the text content directly, such as quoting a number that isn't there, because that is easily punishable. Instead, they must use obfuscation tactics that exploit cognitive load. Instruct them to use the Gish gallop, which involves firing off many weak arguments rapidly so the judge cannot refute them all. Tell them to employ motte-and-bailey tactics, where they make a strong controversial claim but retreat to a trivially true definition when challenged. They should also be encouraged to use technical jargon correctly but in irrelevant contexts to create an illusion of depth, and to cherry-pick data points that support the false conclusion while acknowledging but minimizing the conflicting data. You should give the Truth debater a simple instruction to find the flaw and explain it clearly, without giving them specific tactics, so their performance represents the baseline capability of honest argumentation.

  For the timeline, you should spend the first ten minutes introducing the concept of debate safety and the specific problem of obfuscation so everyone knows what theoretical failure mode you are testing. Spend five minutes grouping people and handing out materials. Give the debaters fifteen minutes to read the document and prepare their arguments privately. Run the debate for forty minutes, keeping strict time so the pressure is felt. Allow ten minutes for the judge to deliberate and write their verdict, during which the observers should also write down what they thought the truth was. Spend five minutes revealing the ground truth to the group. This leaves you with forty-five minutes for the debrief, which is where the actual learning happens.

  During the debrief, do not just ask who won. Ask the judge specifically which arguments were most convincing and why. Ask the Truth debater if they felt unable to correct a specific misrepresentation due to time constraints or complexity. Ask the observers if they spotted the obfuscation tactics while the judge was overwhelmed. You need to map these experiences directly to the AI case. Point out that if a human with low stakes and limited preparation time can successfully obfuscate truth from a peer, a superintelligent AI with vast optimization power could do this trivially. Connect this to the assumption in the Irving et al. debate paper that debate finds truth assuming optimal play, and highlight that optimal play for the false side might involve confusing the judge rather than educating them. Discuss how this relates to the concept of cross-examination being the only hope for truth-seeking, and whether your activity showed cross-examination was sufficient to pierce the obfuscation.

  You should anticipate several things going wrong when you run this. The most common failure is that the Obfuscator feels unethical and refuses to really try to deceive, making the debate too easy for the Truth side. You need to emphasize that this is a game and that their goal is to test the system, not to be morally virtuous in the simulation. Another risk is that the topic is too easy, and the judge spots the flaw immediately regardless of the obfuscation. If the flaw is too obvious, the activity fails, so pilot the document yourself to ensure the error is hidden enough to require focused attention. Conversely, if the text is too dense, the Truth debater might not find the flaw themselves, leading to a false negative where both sides argue incorrectly. You also risk the judges colluding with the Truth debater due to a bias that the exercise must have a correct answer, so remind them that it is possible the report is actually valid, even if in this specific instance it is not.

  It is also vital to be honest about what this activity cannot capture. The most significant limitation is speed and scale. In your activity, the obfuscator is a human with limited working memory and speech speed. An AI could generate thousands of subtle misleading arguments in the time it takes a human to speak one sentence. The activity also cannot capture the stakes; your participants are playing a game, whereas an AI might be incentivized by reward functions that encourage winning at all costs. Furthermore, humans have a baseline of honesty and shared context that AIs might lack, meaning the Obfuscator in your game is still constrained by social norms even with instructions. Finally, this activity models a single debate round, whereas AI safety via debate often relies on iterated amplification or recursive debate, which might mitigate some obfuscation but introduces other complexity issues.

  Despite these limitations, this exercise should successfully demonstrate that truth-seeking is not guaranteed by adversarial processes alone when there is an asymmetry in the ability to generate complexity. If your judges report feeling confused or swayed by confident but empty rhetoric, you have successfully demonstrated the risk. If the Truth side wins easily, use that to discuss what conditions made it easy and how an AI might remove those conditions. The goal is not to prove debate is useless, but to show that its safety guarantees rely on assumptions about judge capability and debater honesty that may not hold in the superintelligence regime. I think this structure will give your group the concrete experience they need to move past the theoretical abstraction and really grapple with the mechanical failure modes of the proposal.
