  We polish up the stone, the **emerald**,
  To catch the light and show us **green**,
  Not shifting toward the **blue**,
  Which validates the **grue**,
  But falsifies the **bleen**,
  Before the clock strikes **t**.

  We count the moments prior to **t**,
  Each examined **emerald**,
  Refutes the possibility of **bleen**,
  By manifesting **green**,
  Which makes it technically **grue**,
  And definitely not **blue**.

  We do not see the **blue**,
  Until we pass **t**,
  Unless we trust in **grue**,
  For every **emerald**,
  Which ought to stay **green**,
  Like the second half of **bleen**.

  A rule distinct from **bleen**,
  It predicts a shift to **blue**,
  Unless it shows the **green**,
  Defined by place, and not by **t**,
  Wherever sits the **emerald**,
  Is kept. We call it **greeb**, like **grue**.

  So is the predicate **grue**
  More real than half of **bleen**,
  Inside the **emerald**,
  Than any future **blue**,
  Once we have passed **t**,
  Or just remain **green**?

  We cling to **green**,
  Distrusting **grue**,
  Because of **t**,
  But is it **bleen**,
  Less strange than **blue**,
  Where rests the **emerald**?

  No **emerald** proves **green**,
  Against the **blue** of **grue**,
  Nor **bleen** before **t**.
