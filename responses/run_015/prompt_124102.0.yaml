answer: |-
  This is a sharp set of intuitions. You have correctly identified that the standard textbook definition ("Guilt = Act, Shame = Self") breaks down when "Self" includes things we didn't choose (accents) or things we did choose but slowly (character habits).

  Here is a precise principle that accommodates most of your verdicts, followed by the necessary friction points, the cultural implications, and the normative verdict.

  ### The Principle: Agency-Constitution & Functional Fit

  **Guilt** is fitting when the object is a **specific voluntary act** (or omission) within your control, and the feeling motivates **repair**.
  **Shame** is fitting when the object is a **constituted disposition** (character trait) that you have ratified over time, and the feeling motivates **transformation**.
  **Neither** is fitting when the object is an **involuntary state** (biology, circumstance, ancestry), and if present, the feeling should be treated as noise to be managed, not a signal to be obeyed.

  *Note on "Ratified":* You don't choose your character in a day, but you "ratify" it by failing to correct it when you have the capacity to notice. This distinguishes Case 2 (condescension) from Case 6 (accent).

  ---

  ### Case Mapping & Friction

  Here is how the principle processes your nine cases, where it forces a clause, and where it demands an overturn.

  **1. Snap at sister:** **Guilt.** (Voluntary act, repair possible). *Fits.*
  **2. Condescending tone:** **Shame.** (Constituted disposition ratified over 3 years). *Fits.* This forces the "Ratified" clause. If you treat this as guilt (just fix the email), you ignore the structural rot.
  **3. Cut off in traffic:** **Guilt.** (Voluntary act, minor). *Fits.*
  **4. Ancestral money:** **Neither.** (Involuntary state). *Overturn.* Your verdict was "low-grade shame seems right?" The principle says this is a category error. What you are feeling is likely **grief** or **political solidarity**, not moral shame. Moral shame requires agency. Keeping the shame here is masochistic, not moral.
  **5. Survivor guilt:** **Neither.** (Involuntary circumstance). *Fits.* You called it a "mistake." The principle agrees; it's a cognitive glitch, not a moral signal.
  **6. Accent shame:** **Neither.** (Involuntary state/unchosen trait). *Fits.* You called it "bad." The principle agrees; this is toxic shame because there is no agency to transform.
  **7. Blameless postmortems:** **Guilt Culture.** (Focus on act/system, not self). *Fits.*
  **8. Apology circles:** **Shame Culture.** (Focus on public self/performance). *Fits.* The "theater" aspect confirms the focus is on the *person's standing*, not the *act's repair*.
  **9. Ghosting (post-forgiveness):** **Neither (Moral Residue).** *Overturn/Refine.* You are torn. The principle says: If repair is complete and forgiveness granted, fitting guilt should cease. What remains is **moral residue**. It's not a signal to do more; it's a scar. Treating it as active guilt is unproductive; treating it as noise is dismissive. It's a memory of a violation, not a current violation.

  **Summary of Overturns:**
  *   **Case 4:** I overturn your "maybe." Ancestral shame is intellectually seductive but morally incoherent under an agency framework. It burdens you with a debt you cannot pay, which paradoxically lets you off the hook for what you *can* pay (current action).
  *   **Case 9:** I refine your "no idea." It is not active guilt. It is residue. The function of guilt (repair) has been served; the feeling is now just weight.

  ---

  ### The Missing Case: Chronic Negligence

  Here is a case where your original principle ("Guilt = Did, Shame = Am") fails, but the **Agency-Constitution** principle catches it.

  **The Case:** You are a generally good person, but you are chronically, exhaustingly late. Not maliciously, just disorganized. You hurt people's time repeatedly. You apologize (Guilt) every time, but you never change the system of your life.

  *   **Your Old Principle:** Struggles. Is it an act (late again) or a self (I am a late person)?
  *   **Agency-Constitution Verdict:** **Shame.**
  *   **Why:** Initially, it was guilt (act). But after the 10th time, the *failure to reconstitute yourself* becomes the moral object. You have ratified "being a person who doesn't value time." Guilt is no longer fitting because apology has become part of the negligence loop. Only shame (a confrontation with the constituted self) can break the cycle.
  *   **Why it matters:** This shows that Guilt can decay into Shame if the "Act" becomes a pattern of "Non-Transformation."

  ---

  ### Can a Culture Shift the Mix?

  **Yes, but only by designing incentives around Agency.**

  Your Cases 7 and 8 prove this. A culture cannot simply *declare* "We are a Guilt Culture." It becomes one by removing the social cost of admitting acts.

  *   **To shift toward Guilt:** You must decouple the *act* from the *status*. (e.g., "The code broke" vs. "You broke the code"). This requires high psychological safety.
  *   **To shift toward Shame:** You make the *act* a referendum on *belonging*. (e.g., Apology circles where the group watches you suffer).

  **The Constraint:** A culture cannot eliminate shame, because humans are social animals who care about status. However, a culture can **restrict the domain of shame**.
  *   **Healthy Culture:** Shame is reserved for violations of *loyalty* or *integrity* (Case 2). Guilt is used for *errors* or *mistakes* (Case 1, 3, 7).
  *   **Unhealthy Culture:** Shame is used for *errors* (Case 8) or *involuntary traits* (Case 6).

  So, a culture can shift the mix on purpose, but it requires structural changes (like postmortems) that make "Guilt" cheaper than "Shame." If admitting a mistake costs you your reputation, you will hide (Shame response). If admitting a mistake costs you 15 minutes of documentation, you will report (Guilt response).

  ---

  ### Is One "Better"?

  **Guilt is the better workhorse; Shame is the better specialist.**

  1.  **Guilt is scalable.** It allows for a society of strangers. I don't need to know your soul to accept your apology for bumping into me. It is low-friction and high-repair. For 90% of moral life (traffic, emails, minor slights), Guilt is superior because it preserves the relationship while correcting the behavior.
  2.  **Shame is deep but dangerous.** Shame is necessary for the 10% of moral life involving **character** (Case 2). You cannot fix deep condescension with an apology; you have to dismantle a part of your ego. That requires Shame. However, Shame is high-risk. If it doesn't lead to transformation, it leads to hiding, rage, or depression (Case 6, 8).

  **The Verdict:**
  A healthy moral life aims for a **Guilt Default with a Shame Reserve.**
  *   Default to Guilt: Assume mistakes are acts until proven otherwise.
  *   Reserve Shame for: Patterns that resist Guilt, or violations of core integrity.
  *   Ban Shame for: Involuntary traits (Accents, Survival, Ancestry).

  Your intuition in Case 2 was the most important one you listed. It recognizes that sometimes, "I did a bad thing" is a lie we tell ourselves to avoid "I am cultivating a bad self." But your intuition in Case 6 recognizes the trap: sometimes "I am a bad self" is a lie we tell ourselves to explain "I have a trait I didn't choose."

  The principle that separates them is **Agency over Constitution.** You are responsible for the character you keep, but not the body you inhabit or the history you inherited.
