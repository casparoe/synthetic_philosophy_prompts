  **MEMORANDUM**

  **TO:** Scarce Interventions Panel
  **FROM:** Panel Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Funding Recommendation: Harrow Vale vs. Kestrel House

  This memo recommends funding the Harrow Vale persistent-pain service in full for the upcoming cycle. This decision is not made lightly. We face two high-need cohorts, a budget that supports only one, and a measurement instrument that our own analyst confirms is fundamentally flawed regarding inter-cohort comparability. We cannot fund both, and we must acknowledge that choosing one inevitably disadvantages the other.

  The data presents a conflict. On raw totals, Harrow Vale generates significantly more aggregate gain (450 patients × 27 points) than Kestrel House (70 patients × 56 points). Even applying the analyst's conversion multiplier—where one Harrow point is valued between 1.1 and 2.4 Kestrel points—Harrow's total utility gain remains superior. However, Tom's objection regarding incommensurability is philosophically sound. The vignette testing reveals that these cohorts value health states differently; one group prioritizes functioning despite pain, the other relief despite unemployment. Consequently, we cannot claim with certainty that a Harrow patient is "better off" than a Kestrel patient at baseline, nor that their gains are perfectly equivalent.

  Tom suggests a coin flip to respect this incomparability. While this avoids false precision, it ignores the cost of indecision. We must weigh the option of deferral honestly. Deferring both applications to re-run with a common instrument is not a neutral act. The budget reverts to the centre at year-end; delaying nine months means this money helps no one. Both cohorts suffer continued illness while we seek methodological purity. Given that we possess *some* comparable data (the slope range), albeit imperfect, stewardship requires we deploy the resource rather than return it. Inaction is itself a decision with harmful consequences.

  Therefore, we proceed with Harrow Vale. This maximizes aggregate benefit even under conservative scaling assumptions. However, we must be straight about what we can claim publicly. We cannot state that Kestrel patients are "less deserving" or that their suffering is less severe. We cannot claim the Personal Ladder scores are perfectly equivalent across groups. Our public statement must acknowledge that this decision prioritizes volume of benefit under current measurement constraints, not a judgment on the severity of depression versus pain.

  Specific communication is required for the Kestrel House applicants. We must write to them personally, acknowledging that their baseline scores indicate severe distress. We should explain that while their individual gains are profound, the current funding instrument forces a choice based on total population benefit. Crucially, we must validate Tom's concern: admit that the tool failed to capture the full nuance of their specific health values, and that this methodological failure contributed to the outcome. We owe them honesty, not false comfort about their clinical priority.

  To prevent this dilemma next cycle, we must reform the instrument. We cannot rely on personal anchors that reward those with worse historical baselines. I propose we adopt a common set of anchored vignettes for all applicants to establish a shared scale before applying personal ratings. We will commission this revision immediately, with a draft instrument ready for pilot testing by January 15. The revised framework must be approved by this panel by March 1, ensuring we do not face another cycle of incomparable data.

  We are choosing Harrow Vale not because the numbers settle the moral question, but because the cost of waiting for moral certainty is the total loss of this year's capacity to help. We accept the imperfection of the tool to avoid the certainty of wasted resources.

  Verdict: Harrow Vale
