answer: |-
  Dear friend,

  It is good to hear from you, and I am glad you are still turning over the stones of Frege's puzzle because I suspect the itch you are describing is actually the engine of much cognitive science disguised as metaphysics. Your tentative principle is a strong start, capturing the intuitive link between informativeness and the architecture of our mental filing systems, but I think you are right to worry that it is currently a pile of verdicts looking for a law. When we run it against your own cases, the cracks show up immediately, specifically in the astronomer scenario and the Lois Lane scenario, and fixing those breaks will force us to change what we mean by a file.

  Let us look at the astronomers first. You say that when two people in the same room dub the same instrument reading 'A' and 'B', the statement 'A is B' is uninformative. Your tentative principle says it should be informative because there are two distinct files created by two distinct dubbing acts. The problem here is that distinctness of token is not enough; the files must be epistemically independent. In the Hesperus case, the evening appearance and the morning appearance provide different evidence, different times, and different causal routes to the same object. In the astronomer case, the evidence is identical, simultaneous, and shared. The distinctness is merely lexical, not epistemic. So, to save this verdict, we must add a clause requiring that the files be justified by distinct bodies of evidence or accessed via distinct cognitive routes. Mere separate creation is insufficient if the grounding is shared.

  Now consider Lois Lane. You say she has merged the files yet the statement remains non-inert and she gets caught out. Your tentative principle says that if the files are merged, the statement should be uninformative. This is a direct contradiction. If we stick to your verdict that the files are merged, we have to admit that informativeness is not just about the static state of storage but about the functional access conditions. Even if Lois knows Clark is Superman, the 'Clark' file is accessed in contexts of safety and journalism, while the 'Superman' file is accessed in contexts of danger and flight. The identity is informative or load-bearing because it bridges two functional regimes that do not automatically communicate during high-stress processing. So, the repair must specify that files are distinct not just when they are separate data structures, but when they license different inferences or trigger different behavioral dispositions. Informativeness persists as long as the identity statement does work in connecting these functionally isolated clusters, even if the agent assents to the identity abstractly.

  This brings us to Water is H2O. You note this stays informative forever, unlike Hesperus is Phosphorus. This fits the repaired view if we understand the 'Water' file as phenomenological and the 'H2O' file as theoretical. Merging them doesn't dissolve the distinction between appearance and reality; rather, the identity statement is the bridge that allows us to explain the former using the latter. It remains load-bearing because it supports counterfactuals and explanations that neither file supports alone. However, we have to be straight about Vulcan. Your tentative principle does not handle reference failure. 'Vulcan is Vulcan' is defective, not uninformative. To save this verdict, we need a presupposition clause: the terms must refer. If they do not, the statement lacks a truth value and the question of informativeness becomes moot or shifts to a different category of defectiveness. So the repaired principle must start by assuming successful reference.

  Putting this together, the repaired principle looks something like this: For a speaker S, an identity statement 'a is b' is informative if and only if 'a' and 'b' refer to the same object, S associates them with cognitive files that are epistemically independent or functionally distinct, and accepting the identity licenses new inferences or resolves a functional separation in S's cognitive economy. This saves the astronomer case by ruling out shared evidence, saves the Lois case by emphasizing functional separation over mere storage distinctness, and saves the Water case by highlighting inferential power. It does, however, force us to concede that 'informativeness' is not a binary switch that flips off once knowledge is acquired; it is a gradient of cognitive integration.

  Now for your unsettled cases. First, if you know A equals B and B equals C and have merged both pairs, is 'A is C' informative? On the repaired view, this depends on whether the merger was transitive in your cognitive architecture. Logically, if A=B and B=C, then A=C. But psychologically, you might have a file cluster for A-B and a separate cluster for B-C without having explicitly linked A and C. If you have not processed the transitivity, the files for A and C remain functionally distinct, and the statement will be informative. If you have a unified A-B-C file, it will be uninformative. This predicts that informativeness is sensitive to the granularity of your mental indexing, not just the logical closure of your beliefs.

  Second, is informativeness symmetric? Can 'a is b' be informative while 'b is a' is not? In terms of truth conditions and the raw fact learned, it is symmetric. However, in terms of cognitive utility and pragmatic focus, it is often asymmetric. If 'a' is a familiar anchor and 'b' is a new description, 'a is b' tells you what a is, while 'b is a' tells you what b is. If you are interested in a, the first is more useful. But strictly speaking, regarding the update to your world-model, they deliver the same payload. However, given our repaired principle focuses on functional separation, there could be cases where accessing the object via 'a' triggers different inferences than via 'b'. If the 'a' file is rich and the 'b' file is sparse, linking them might feel more informative in one direction because it enriches the sparse file more noticeably than it constrains the rich one. So I would predict that while the metaphysical fact is symmetric, the psychological informativeness can vary based on which file is being updated or which inferential pathways are being opened.

  I hope this helps clarify the structure of your intuition. You are essentially moving from a semantic view of Frege's puzzle to a cognitive one, and I think that is the right move. The puzzle isn't just about meaning; it is about how we navigate the world with limited processing power. Let me know if this resonates or if the transitivity case feels unstable to you.

  Best wishes.
