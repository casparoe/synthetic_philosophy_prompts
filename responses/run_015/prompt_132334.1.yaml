      *   *A/B Case:* Why does the user think it's uninformative? "Nothing is learned." If I dub X 'A' and you dub X 'B' while we look at the same thing, and you say "A is B", I know immediately you mean the thing we are looking at. The files are distinct tokens but the *content* and *justification* are identical. So the repair needs to specify that the files must be *epistemically independent* or *justified differently*.
