      *(Refining the "Gain Heritability" gadget)*: Is it nonsense? No. $G \times E$ interaction often manifests as variance in $\Delta$. If $h^2(\Delta)$ is high, it means the intervention *exacerbates* genetic inequality (Matthew Effect). This is a crucial point for the seminar.

