prompt: |-
  my buddy in our group chat (we do a bit of sports betting, and one of the guys is really into options) has started refusing to even discuss a bet unless we state it as a Kelly fraction, and whenever someone says "but the EV is huge, why not size up" he just sends the thing about the statistician who drowns crossing a river that's three feet deep on average. It's doing a lot of work for him: it's how he gets all the way from "expected value isn't the whole story" to "so the thing to maximize is the expected log of your bankroll, i.e. the geometric growth rate, and the Kelly fraction is the answer."

  The reason it's live for me right now: I've got maybe 14 months of runway, and a seasonal window in which I can run something like 20 to 30 paid trials of a thing I'm selling. So inside the window it's genuinely repeated and multiplicative — winnings get rolled into the next attempt — but it's not an endless sequence, and there's a hard date at the end where I either have enough to keep going or I go get a job. That feels like it should matter, and I can't tell whether the river picture is quietly hiding it.

  Can you audit the analogy for me? Give me the correspondence table — what plays the role of the river, the depth at a given point, the average across the river, the drowning, the statistician — and then where the mapping breaks. Things I'm suspicious about: the river kills you at a threshold rather than multiplicatively; the "average" in the joke is over space while the average he cares about is over counterfactual branches; and the whole picture is one person crossing once, which seems closer to my situation than to the indefinitely repeated sequence the growth-rate argument normally assumes, but that might be me confusing myself. Then: does the conclusion he wants actually survive, or did the analogy only ever support something weaker, like "don't size bets in a way that risks ruin"? And if the long-run/asymptotic assumption is doing real work, what does the recommendation become in a fixed 20–30 bet window with a deadline — more or less than Kelly, and why? Split the disanalogies into the ones that matter for my case and the ones that don't, and if there's a better picture for someone with a deadline, give me that too. Also: in practice he bets half Kelly and never explains it — is that coming from the analogy at all, or from somewhere else entirely?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Group chat, sports betting/options trading. One friend insists on Kelly Criterion sizing for every bet, using the "statistician drowning in a river" analogy to justify Expected Log Utility (Geometric Growth) over Expected Value (EV).
      *   **User's Situation:** 14 months runway, seasonal window for 20-30 paid trials of a product. Multiplicative (wins roll into next), but *finite* horizon (hard deadline). Binary outcome at end: survive (continue) or fail (get a job).
      *   **Core Question:** Audit the "river" analogy. Does it support the friend's conclusion (maximize geometric growth/Kelly) in the user's specific finite-horizon context?
      *   **Specific Tasks:**
          1.  Create a correspondence table for the analogy (River, Depth, Average, Drowning, Statistician).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Determine if the friend's conclusion survives or if the analogy only supports "avoid ruin."
          4.  Address the finite horizon (20-30 bets) vs. infinite horizon assumption. Should sizing be more or less than Kelly?
          5.  Explain the friend's "Half Kelly" practice (is it from the analogy?).
          6.  Split disanalogies into "matters for my case" vs. "doesn't matter."
          7.  Suggest a better mental model if applicable.

  2.  **Analyze the "River" Analogy:**

      *   *The Joke:* A statistician drowns crossing a river that is 3 feet deep *on average*. (Implies: variance matters, averages can hide deadly extremes).
      *   *Friend's Usage:* Uses it to pivot from "EV isn't everything" to "Maximize Expected Log Wealth (Kelly)."
      *   *Correspondence:*
          *   River = The sequence of bets/investments.
          *   Depth at a point = Outcome of a specific path/trial (wealth level).
          *   Average depth = Expected Value (Arithmetic Mean).
          *   Drowning = Ruin (wealth $\le$ 0).
          *   Statistician = The bettor/investor.
          *   Crossing = The process of betting over time.
      *   *The Break:* The river joke is about *arithmetic mean vs. minimum viable threshold* (survival). Kelly is about *arithmetic mean vs. geometric mean* (growth optimization). The joke justifies avoiding ruin, not necessarily optimizing growth rate.

  3.  **Analyze the User's Specific Situation (Finite Horizon):**

      *   *Horizon:* 20-30 trials. Not infinite.
      *   *Goal:* Reach a specific threshold by time $T$ to continue runway. Not necessarily maximize wealth at $T$ (though correlated), but specifically avoid hitting 0 before $T$ and maximize probability of hitting the target.
      *   *Kelly Assumption:* Kelly maximizes *asymptotic* growth rate ($N \to \infty$). It assumes you care about the long-run geometric mean.
      *   *Finite Horizon Reality:* With small $N$, variance is your friend *if* you need to reach a high target. If you need to just "not go broke," Kelly is safe. If you need to "grow enough to survive," Full Kelly might be too volatile (risk of ruin before $N$), but Half Kelly might be too conservative (risk of not reaching target).
      *   *Conclusion:* The friend's strict Kelly dogma is likely suboptimal for a fixed horizon with a specific survival target.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the friend's point (EV is dangerous) but validate the user's suspicion (the analogy is doing too much heavy lifting).
      *   **Correspondence Table:** Map the river elements to the betting elements clearly.
      *   **The Break (Disanalogies):**
          *   *Threshold vs. Multiplicative:* River kills at a hard floor (depth > height). Betting kills at 0 wealth. Similar, but river implies spatial average vs. temporal sequence.
          *   *One Crossing vs. Repeated:* The joke is one person, one crossing. Kelly is repeated bets. This is crucial.
          *   *Average Type:* River is spatial average (ergodicity violation). Betting is ensemble vs. time average.
      *   **Does the Conclusion Survive?** No. The analogy supports "Avoid Ruin" (Risk Management), not "Maximize Geometric Growth" (Kelly Optimization). It justifies *not* betting everything on +EV, but doesn't prove Kelly is the *only* right size.
      *   **Finite Horizon (20-30 bets):**
          *   Kelly is asymptotic.
          *   With a deadline and a "survival threshold," the goal is maximizing $P(\text{Wealth}_T > \text{Target})$.
          *   If Target is low: Bet less than Kelly (minimize variance).
          *   If Target is high: Bet more than Kelly (need variance to reach it).
          *   Since runway is limited, "survival" is key. Usually, this implies *fractional* Kelly, but not necessarily because of the river analogy, but because of parameter uncertainty and volatility drag in short windows.
      *   **Half Kelly:** Why does the friend do it? Not the river. It's usually due to *estimation error* (you don't know true edge) and *volatility reduction* (50% Kelly gives 75% of growth with half the variance).
      *   **Better Picture:** The "Hurdle Race" or "Rocket Landing." You have a specific amount of fuel (capital) and need to reach an orbit (target) in a specific number of stages (trials).

  5.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Ergodicity:* I need to mention ergodicity. The river joke is the classic example of non-ergodicity. The ensemble average (average depth) $\neq$ time average (one person's experience). This aligns with Kelly (Time Average Growth).
      *   *The "One Crossing" aspect:* The user noted the statistician crosses once. This actually supports the user's finite horizon view *more* than the friend's infinite horizon view. If you only cross once, you care about the distribution of outcomes, not the asymptotic limit.
      *   *Kelly in Finite Time:* Strict Kelly maximizes median wealth in the long run. In short runs, it has high variance. If the user *must* have $X$ amount in 14 months, Kelly might have too high a risk of falling short *or* going bust, depending on the edge.
      *   *Recommendation:* Don't use Full Kelly. Use Fractional Kelly. But the *reason* isn't the river; it's parameter uncertainty and finite horizon utility.

  6.  **Final Polish:**

      *   Ensure tone is analytical but accessible.
      *   Make sure the "Correspondence Table" is distinct.
      *   Clearly separate "Matters" vs. "Doesn't Matter" disanalogies.
      *   Address the "Half Kelly" question specifically.

  7.  **Output Structure:**
      1.  Executive Summary.
      2.  The Audit (Correspondence Table).
      3.  Where the Mapping Breaks (Disanalogies).
      4.  Does the Conclusion Survive? (EV vs. Log vs. Ruin).
      5.  The Finite Horizon Problem (20-30 bets).
      6.  The "Half Kelly" Mystery.
      7.  A Better Analogy.

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "River" analogy interpretation. The joke is usually cited to explain *why* averages lie (non-ergodicity). The friend is using it to justify *Kelly*. Kelly solves the non-ergodicity problem by maximizing time-average growth. So the friend isn't *wrong* that the river points to non-ergodicity, but he *is* wrong that the river joke *proves* Kelly is the specific solution for a finite horizon. The river joke proves you need to care about the path, not just the expectation. Kelly is *one* way to care about the path.

  Okay, let's write it.
answer: |-
  Here is the audit of your friend's analogy, broken down by correspondence, structural breaks, and how it applies to your specific 14-month/30-trial runway problem.

  ### 1. The Correspondence Table

  Your friend is using the "Statistician and the River" joke to bridge the gap between **Expected Value (EV)** and **Expected Log Utility (Kelly)**. Here is how the mapping works in his head:

  | The River Analogy | The Betting/Trading Reality |
  | :--- | :--- |
  | **The River** | The market / The sequence of bets over time. |
  | **Depth at a specific point** | The outcome of a specific path (realized wealth trajectory). |
  | **Average Depth (3 ft)** | **Expected Value (Arithmetic Mean).** The average outcome across all possible parallel universes. |
  | **The Statistician's Height** | Your Bankroll / Runway threshold. |
  | **Drowning** | **Ruin.** Hitting zero (or your "get a job" threshold). |
  | **Crossing the River** | Executing the strategy over the time horizon. |
  | **The "One Crossing"** | **Time Average.** What happens to *you* specifically, not the average of all possible yous. |

  **The Friend's Logic:**
  1.  The average depth (EV) says you survive.
  2.  But the variance (deep spots) kills you (Ruin).
  3.  Therefore, you cannot optimize for average depth (EV).
  4.  Therefore, you must optimize for the safety of the crossing (Geometric Growth/Kelly).

  ### 2. Where the Mapping Breaks (Disanalogies)

  The analogy is doing too much work. It successfully kills "Maximize EV," but it fails to prove "Maximize Kelly."

  | Disanalogy | Why it Breaks | Does it Matter for Your Case? |
  | :--- | :--- | :--- |
  | **Threshold vs. Multiplicative** | In the river, you die if *any* point > height (absorbing barrier). In betting, you die if wealth $\le$ 0. Kelly assumes you can bet fractions continuously; the river is a step-function kill. | **YES.** Your "get a job" date is a hard threshold, not just a zero-bound. The river analogy ignores the *goal* (getting to the other side with enough energy), focusing only on not drowning. |
  | **Spatial vs. Temporal Average** | The river's average is over *space* (different points in the river at one time). Betting EV is over *counterfactuals* (parallel universes). Kelly converts counterfactuals to time-average growth. | **NO.** This is actually the one part where the analogy holds. Both illustrate **non-ergodicity**: the ensemble average $\neq$ the time average. |
  | **One Crossing vs. Infinite Crossings** | The statistician crosses **once**. Kelly Criterion is derived for **infinite repetitions** ($N \to \infty$). | **YES (CRITICAL).** This is your main leverage. The joke supports "don't go bust on the one crossing," but Kelly optimizes "wealth after infinite crossings." You have 30 crossings, not infinite. |
  | **Passive vs. Active Sizing** | The river depth is fixed; the statistician can't change it. In betting, you control bet size to change the "depth" of the volatility. | **NO.** This is just mechanics. |

  ### 3. Does the Conclusion Survive?

  **Verdict: No.**

  The river analogy supports a **constraint** ("Do not size bets such that you risk ruin"), but it does not support an **objective function** ("Maximize Geometric Growth").

  *   **What the analogy proves:** If you bet your whole bankroll on a +EV coin flip (55% chance to double, 45% to zero), the EV is positive, but you will eventually go broke. The river analogy correctly identifies that "Average Outcome" is a lie when ruin is possible.
  *   **What the analogy fails to prove:** It does not prove that *Kelly* is the optimal size. It only proves that *Full Bankroll* is suicidal.
  *   **The Gap:** There is a massive space between "Don't bet everything" and "Bet exactly the Kelly fraction." You could bet 10% of Kelly, or 50%, or 90%. All avoid the "drowning" of the river analogy (assuming fractional betting), but they yield different outcomes. The river joke gives you no tools to choose between them.

  ### 4. The Finite Horizon Problem (20–30 Bets)

  Your situation (14 months, 30 trials, hard deadline) violates the core assumption of Kelly: **Asymptotic Optimality.**

  Kelly maximizes the *rate* of growth as $N \to \infty$. In the short run ($N=30$), Kelly is volatile.
  *   **If your goal is "Maximize Wealth":** With only 30 bets, the median outcome of Full Kelly is significantly lower than the mean outcome. You have a high variance of results.
  *   **If your goal is "Survival" (Reach Target $X$):**
      *   **If Target is Low:** You should bet **less than Kelly**. You want to minimize variance to ensure you don't slip below the line.
      *   **If Target is High:** You might need to bet **more than Kelly**. If Full Kelly growth won't get you to the required runway number in 30 steps, you *need* the variance of over-betting to have a shot at the tail end of the distribution. (This is "bold play" strategy).

  **Recommendation for your Runway:**
  Since you have a "cliff" (get a job) if you fail, your utility function is not Log-Wealth. It is **Binary Survival**.
  *   **Calculate the "Survival Kelly":** Simulate your 30 trials. Find the bet size that maximizes the *probability* of ending above your "keep going" threshold, not the one that maximizes expected log wealth.
  *   **Likely Result:** This usually points to **Fractional Kelly (1/2 to 3/4)**. Why? Because parameter uncertainty (you don't know your true edge) hurts short-term performance more than long-term.

  ### 5. Why Your Friend Bets "Half Kelly"

  You asked if his Half-Kelly practice comes from the river analogy. **It does not.**

  The river analogy is binary (Live/Die). Half-Kelly is a nuance of **estimation risk**.
  1.  **Edge Uncertainty:** Kelly requires precise knowledge of your edge ($p$) and odds ($b$). If you overestimate your edge by even a little, Full Kelly becomes over-betting, which drastically increases ruin risk and reduces growth. Half-Kelly is a "safety margin" for being wrong about your edge.
  2.  **Volatility Drag:** Full Kelly has high volatility. Half-Kelly retains about 75% of the growth rate but reduces variance by 50%. For a human with finite risk tolerance (unlike a theoretical algorithm), the sleep-well factor is worth the growth sacrifice.

  Your friend uses the river analogy to justify *Log Utility*, but he uses Half-Kelly in practice because he knows his edge estimates are noisy. He is intellectually inconsistent: he uses a philosophical sledgehammer (the river) to win arguments, but a practical wrench (Half-Kelly) to place bets.

  ### 6. A Better Analogy for Your Case

  The River is bad for you because it implies a static hazard you just need to survive. You have a **fuel and distance** problem.

  **The "Rocket Landing" Analogy:**
  *   **You:** A rocket with 14 months of fuel (runway).
  *   **The Trials:** 30 landing burns.
  *   **The Goal:** Reach the pad (financial target) with enough fuel left to stay airborne (continue business).
  *   **The Risk:** If you burn too hard (Full Kelly), you might overshoot or explode (volatility ruin). If you burn too soft (Under-Kelly), you run out of fuel before reaching the pad (opportunity ruin).
  *   **The Optimization:** You don't maximize "average altitude." You maximize $P(\text{Safe Landing})$.

  **Actionable Takeaway:**
  Tell your friend: *"The river analogy proves I shouldn't bet the farm. It doesn't prove I should maximize geometric growth. I have a finite horizon with a binary survival threshold. I need to size for **Probability of Success**, not **Asymptotic Growth Rate**."*

  In practice, for 30 trials with a survival cliff, **Half-Kelly is likely still the right heuristic**, but not because of the river. It's because it maximizes your probability of staying above a high survival threshold in the presence of estimation error. But you should arrive there via simulation, not dogma.
