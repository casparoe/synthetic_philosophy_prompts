answer: |-
  There is no single, canonical proper noun for this predicament comparable to 'The Gettier Problem' or 'The Trolley Problem'. However, it is a recognised structural feature of contemporary moral philosophy, most prominently discussed within the debates surrounding the **Separateness of Persons** and **Reductionism about Persons**.

  The closest established concept is **The Problem of Moral Individuation**.

  Here is the analysis of how your description fits this concept, where it diverges, and how to draw the principled line you are seeking.

  ### 1. The Established Concept: Moral Individuation

  **The Problem of Moral Individuation** refers to the difficulty of specifying the precise ontological unit that holds moral status or serves as the locus of distribution. It asks: *What is the 'thing' that we are counting?* Is it a biological organism, a psychological continuum, a temporal slice, or a rational agent?

  **How your description fits:**
  *   **Underdetermination:** You note that the subject matter does not supply the unit. This is the core of the individuation problem. Physics describes particles; biology describes organisms; psychology describes minds. Ethics requires a 'moral patient', but nature does not label them as such. The choice of unit is therefore partly stipulative.
  *   **Verdict Sensitivity:** You observe that changing the unit changes the verdict. In individuation debates, this is acknowledged: if you individuate by 'person-moments', utilitarianism flows naturally (summing experiences). If you individuate by 'whole lives', distributive constraints (like priority to the worse off) gain traction.
  *   **The Strategic Move:** You describe the defender changing the unit to save the theory. In the literature, this is the **Reductionist Defence**. Derek Parfit, for instance, argues that if persons are merely series of interconnected experiences (Reductionism), the boundary between persons is less deep than we think. Therefore, summing across persons is not significantly different from summing across moments in a life. The move you describe is the tactical application of this metaphysical claim to neutralise the 'Distinctness of Persons' objection.

  **Where it fails to fit:**
  *   **Scope:** 'Moral Individuation' is often used to discuss *who* is included (animals, foetuses, AI) rather than *how* existing entities are sliced for the purpose of aggregation. Your focus is specifically on the **Unit of Moral Accounting** (the denominator in the calculation), not just the boundary of the moral community.
  *   **The 'Move' Itself:** The term 'Individuation' describes the problem, but not necessarily the dialectical manoeuvre of shifting the unit to evade an objection. That specific manoeuvre is sometimes pejoratively called **Gerrymandering the Moral Domain**, but this is not a technical term.

  ### 2. Distinction from Neighbours

  You correctly sense this sits near several other problems. Here is the carving that distinguishes them:

  *   **Vs. The Distinctness of Persons:** This is the *objection* (Rawls/Nozick), not the *predicament*. The Distinctness of Persons *presupposes* that 'persons' are the correct unit. Your predicament challenges the stability of that presupposition.
  *   **Vs. Merely Verbal Disputes:** A verbal dispute implies the facts are agreed upon, and only the labels differ. Here, the 'facts' of the moral ontology are themselves in dispute. Whether a 'person-moment' is a valid bearer of value is a substantive metaphysical and normative claim, not a linguistic one. The verdict changes because the *ontology* changes, not just the description.
  *   **Vs. Boundary Problems:** A boundary problem asks where the line is drawn (e.g., at what week of gestation does life begin?). Your problem is about **granularity** and **constitution**. It asks whether the whole is the moral unit or the parts. It is a problem of mereology (parts and wholes), not just topology (edges).
  *   **Vs. The Site of Distribution:** In egalitarian theory (e.g., G.A. Cohen), we distinguish the 'currency' (welfare, resources) from the 'site' (individuals, groups). Your problem is specifically about the **Site**. However, 'Site of Distribution' usually assumes the site is fixed (individuals) and asks what they should have equal amounts *of*. You are asking *what counts as an individual*.

  ### 3. The Principled Line: Discovery vs. Imposition

  You ask for a principled line between re-specifying the unit as a genuine moral advance versus a dodge. The distinction lies in whether the new unit tracks a **Morally Relevant Ontological Boundary** or merely an **Analytical Convenience**.

  **The Test of Agency and Interest:**
  A unit of moral accounting is legitimate if it corresponds to a locus of **unified agency** or **integrated interest**.

  *   **Households to People (Progress):**
      *   *Analysis:* A household is a social construct. It does not have a single nervous system, a single consciousness, or a unified capacity for rational agency. It is a collection of people.
      *   *Verdict:* Moving from households to people is progress because it aligns the unit of account with the actual biological and psychological locus of experience and agency. It is a **Discovery** of the natural moral patient.
  *   **People to Person-Moments (The Dodge):**
      *   *Analysis:* A 'person-moment' has no agency. It cannot plan, sacrifice, or hold interests that extend beyond the immediate instant. Interests are inherently time-spanning (I have an interest *now* in my future health).
      *   *Verdict:* Moving to person-moments fragments the locus of agency. It treats the person as a container for experiences rather than an agent who *has* experiences. Unless one accepts a robust Reductionist metaphysics (denying the deep significance of personal identity over time), this is an **Imposition** of an analytical grid that dissolves the very thing (the agent) that morality is supposed to protect. It gets an answer by destroying the questioner's subject.
  *   **People to Ex-Ante Prospects (The Complex Case):**
      *   *Analysis:* This shifts the object of evaluation from *outcomes* to *risks*. It claims that if everyone faces the same risk, the trade-off is intra-personal (each trades their own risk for their own benefit).
      *   *Verdict:* This is not strictly a change of unit, but a change of **Temporal Perspective**. It is legitimate *if* the theory is concerned with the fairness of the procedure (Contractualism). It is a dodge *if* the theory claims to care about actual suffering (Utilitarianism/Prioritarianism). If the policy results in one person suffering grievous harm and another gaining a trivial benefit, describing this as 'equal risk' ignores the moral asymmetry of the *realised* outcome. It privileges the 'ex-ante' unit (the citizen under risk) over the 'ex-post' unit (the victim).

  ### 4. Critique of 'The Denomination Problem'

  Your doubt regarding 'The Denomination Problem' is well-founded.
  *   **Redenomination:** Changing currency from pounds to pence ($1 = 100p$) is value-neutral. The ratio of wealth remains identical.
  *   **Moral Re-uniting:** Changing from 'persons' to 'person-moments' is **not** value-neutral. It alters the weight of the sum. If I suffer now for a gain later, I am compensated. If I suffer and *you* gain, I am not. Summing moments treats these as equivalent; summing persons does not.
  *   **Better Analogy:** It is less like redenomination and more like **Rebaselining** an index, or changing the **Resolution** of a map. If you lower the resolution (blur the image), distinct objects merge. If you raise it (sharpen the image), they separate. The utilitarian move is often to lower the moral resolution until distinct persons blur into a single mass of experience.

  ### 5. Proposed Definition

  Since there is no single canonical label, if you require a term to capture this specific predicament, the most precise philosophical description is **The Indeterminacy of the Moral Summand**.

  However, within the existing literature, you should frame it as **The Problem of Moral Individuation within Aggregation**.

  **Definition:**
  > The problem arises when the verdict of an aggregative moral theory depends on the ontological granularity of the units being summed, where the correct granularity is underdetermined by the non-moral facts. The predicament is that selecting a unit is necessary to perform the calculation, but the selection itself determines the moral outcome, allowing theorists to secure desired verdicts by stipulating the unit rather than arguing for the value.

  **The Principled Line (Summary):**
  *   **Genuine Advance:** The new unit better tracks the **locus of unified consciousness and agency** (e.g., People > Households).
  *   **Evasive Dodge:** The new unit fragments the locus of agency to facilitate calculation, thereby dissolving the **separateness** that generates the moral problem in the first place (e.g., Moments > People), or shifts the temporal perspective to hide the **asymmetry of realised harm** (e.g., Ex-Ante > Ex-Post).

  In short, the move is legitimate only if the new unit is a *better candidate for moral patienthood* than the old one. It is illegitimate if the new unit is chosen simply because it makes the mathematics of the theory work. The critic's charge is that 'persons' are the natural moral patients; the defender's move is to argue that 'persons' are not ontologically fundamental enough to block the sum. The predicament is that ethics has no independent way to settle this ontology without begging the question.
