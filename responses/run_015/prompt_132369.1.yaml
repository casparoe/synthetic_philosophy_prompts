answer: |-
  This is a high-risk, high-reward project. The landscape is littered with no-go theorems designed specifically to close the door you want to open. To survive a year of scrutiny, your view needs to be armored against the standard objections, but not so armored that it becomes indistinguishable from the ontic views you're trying to avoid.

  Here is the spec.

  ### Part 1: The Desiderata (The Spec)

  You need to separate *motivations* (why you want this) from *constraints* (what the theory must do to work).

  **1. The Ontological Substrate (The "Of What?")**
  *   **Requirement:** You must specify what the knowledge is *about*. If $\psi$ is not the state of the world, what is? Call it $\lambda$.
  *   **Case:** "Knowledge" is a relation. You cannot have a state of knowledge without a thing being known. If you refuse to specify $\lambda$, you are not doing psi-epistemic; you are doing instrumentalism or QBism (which is fine, but that's a different project).
  *   **Breaks if dropped:** You collapse into anti-realism. You lose the ability to explain *why* the knowledge has the structure it has.
  *   **Status:** **Genuine Requirement.**

  **2. The Hilbert Space Derivation (The "Why This Geometry?")**
  *   **Requirement:** Explain why the probability distributions over $\lambda$ are constrained to evolve unitarily and live in a complex Hilbert space.
  *   **Case:** In classical statistical mechanics, probability distributions live on a phase space and evolve via Liouville's equation. They don't interfere. You need a mechanism that restricts the allowed distributions over $\lambda$ such that they *mimic* wave mechanics.
  *   **Breaks if dropped:** You have a hidden variable theory, but you haven't explained Quantum Mechanics. You've just posited a classical world and waved at the quantum formalism.
  *   **Status:** **Genuine Requirement.** (This is the hardest technical lift).

  **3. The Epistemic Restriction (The "Why Not More?")**
  *   **Requirement:** Explain why an agent cannot access $\lambda$ with precision sufficient to violate the Uncertainty Principle.
  *   **Case:** If $\lambda$ exists, why is it hidden? Is it practical noise, or a law of nature? If it's a law, why?
  *   **Breaks if dropped:** If $\lambda$ is accessible, the theory predicts deviations from QM (super-quantum correlations). If you want to match QM, the hiding must be fundamental.
  *   **Status:** **Genuine Requirement.**

  **4. The Measurement Outcome (The "Click")**
  *   **Requirement:** Explain how a definite outcome occurs without a physical collapse of $\lambda$.
  *   **Case:** In an epistemic view, updating $\psi$ upon measurement is just Bayesian updating. But the *world* must change to reflect the outcome. If $\lambda$ doesn't change discontinuously, how do we get a single result?
  *   **Breaks if dropped:** You haven't solved the measurement problem; you've just relocated it to the relationship between $\lambda$ and the observer.
  *   **Status:** **Genuine Requirement.**

  **5. Empirical Adequacy (The "Born Rule")**
  *   **Requirement:** The theory must recover the Born Rule exactly, not approximately.
  *   **Case:** Any deviation is experimentally falsified.
  *   **Breaks if dropped:** The theory is false.
  *   **Status:** **Non-negotiable.**

  **6. The 3N-Dimensional Motivation**
  *   **Requirement:** *Do not put this on the spec list.*
  *   **Case:** This is your *motivation*, not a constraint. Ontic views (Many Worlds, Pilot Wave) simply accept that configuration space is the real space. If you make "must be 3D" a hard constraint, you are begging the question against your opponents.
  *   **Status:** **Motivation only.** If your best epistemic model requires a 3N ontology for $\lambda$, you have failed your *motivation*, but you might still have a consistent *theory*. Don't confuse the two.

  ---

  ### Part 2: The Two Specific Constraints

  **1. The PBR Constraint (Distinct Pure States Overlap)**
  *   **The Argument:** The Pusey-Barrett-Rudolph (PBR) theorem shows that if distinct pure states ($\psi_1, \psi_2$) correspond to overlapping distributions over $\lambda$, and if you assume **Preparation Independence** (you can prepare two systems such that their $\lambda$s are uncorrelated), you contradict QM predictions.
  *   **Is Overlap a Desideratum?** **Yes.** If the distributions for distinct pure states do *not* overlap, then $\lambda$ uniquely determines $\psi$. This makes $\psi$ a function of the physical state, which is the definition of psi-ontic (or at least psi-supplemented). To be truly epistemic, $\lambda$ must be compatible with multiple distinct $\psi$'s.
  *   **The Catch:** To keep overlap, you **must** violate Preparation Independence. Your view must claim that "independent" preparations are actually correlated at the ontic level.
  *   **Verdict:** Overlap is required for the view to be meaningfully epistemic. But achieving it requires biting the bullet on Preparation Independence (often called "retrocausality" or "global constraints").

  **2. The "No-Superbookie" Constraint**
  *   **The Argument:** If an agent knew $\lambda$, could they bet better than the Born rule?
  *   **Is it a Real Constraint?** **Yes, but it defines "Completeness."**
      *   If **Yes** (they can bet better): Then QM is incomplete (Einstein's view). $\psi$ is knowledge, but incomplete knowledge. This is a valid psi-epistemic position, but it predicts deviations from QM in principle (if you could access $\lambda$).
      *   If **No** (they cannot bet better): Then $\psi$ represents *maximal* knowledge. This requires an "Epistemic Horizon"—a law that says $\lambda$ exists but is fundamentally inaccessible in a way that preserves the Born probabilities.
  *   **Tension:** If you want to say QM is *complete* (standard textbook), you need the "No" answer. This requires a robust explanation for the horizon (e.g., topological restrictions, information-theoretic laws). If you can't explain the horizon, you're just asserting magic.
  *   **Verdict:** This is empirical adequacy in a costume. If your underlying story allows $\lambda$ to be used to beat the bookie, you are proposing a testable deviation from QM. If you aren't proposing deviations, you must build the horizon into the ontology.

  ---

  ### Part 3: The Impossible Trinity (Incompatibilities)

  You cannot have all of these. You must sacrifice one.

  1.  **Psi-Epistemicity (Overlap):** Distinct $\psi$ map to overlapping $\lambda$.
  2.  **Preparation Independence:** Independently prepared systems have independent $\lambda$.
  3.  **Quantum Predictions:** The theory matches QM exactly (PBR theorem).

  **The Killer:** **Preparation Independence.**
  If you want to be psi-epistemic (Overlap) and match QM, you *must* deny that preparations are independent. This is the single requirement that knocks out the most candidates. Most classical intuitions rely on separability. Denying it makes your view look conspiratorial or retrocausal.

  **Secondary Killer:** **Locality.**
  If you want to match QM and have definite outcomes (Bell's Theorem), you must give up Locality or Realism. Since you are positing $\lambda$ (Realism), you likely have to give up Locality.
  *   *Note:* Some psi-epistemic views try to save Locality by giving up "Outcome Independence" (many worlds style) or by using retrocausality.

  **Summary of Tensions:**
  *   To save **Overlap**, you sacrifice **Preparation Independence**.
  *   To save **Locality**, you sacrifice **Definite Single Outcomes** or **Measurement Independence**.
  *   To save **Classical Intuition (3D)**, you sacrifice **Simplicity of Dynamics** (the laws governing $\lambda$ become incredibly non-local or complex to mimic Hilbert space).

  ---

  ### Part 4: Scorecard of Usual Suspects

  Here is how the existing camps fare against your spec.

  **1. Pilot-Wave (Bohmian Mechanics)**
  *   **Psi:** Ontic (guiding field).
  *   **Overlap:** No. $\psi$ is a real field.
  *   **Verdict:** Fails your primary motivation. It posits particles in 3D, but the wave is real and lives in 3N. It is deterministic, so the "knowledge" aspect is minimal.

  **2. Collapse Theories (GRW/CSL)**
  *   **Psi:** Ontic (physical stuff that collapses).
  *   **Overlap:** No.
  *   **Verdict:** Fails motivation. Modifies Schrödinger equation. Empirically distinct from QM (in principle).

  **3. Many Worlds (Everett)**
  *   **Psi:** Ontic (the whole wave is real).
  *   **Overlap:** N/A (All outcomes happen).
  *   **Verdict:** Fails motivation. Solves measurement by denying unique outcomes. Locality is preserved in configuration space, not 3D space.

  **4. QBism / Quantum Bayesianism**
  *   **Psi:** Epistemic (agent's betting odds).
  *   **Overlap:** Yes (subjective).
  *   **Verdict:** Passes the epistemic test, but fails the "Ontological Substrate" requirement. It refuses to say what $\lambda$ is. It treats QM as a user's manual, not a description of the world. If you want a view about *the world*, this is insufficient.

  **5. Spekkens' Toy Model / Epistemic Restrictions**
  *   **Psi:** Epistemic.
  *   **Overlap:** Yes.
  *   **Verdict:** The closest to your goal. It reproduces many quantum phenomena (interference, teleportation) via an "Knowledge Balance Principle." However, it fails to reproduce full QM (no Bell violation without non-locality, limited contextuality). Your job is to scale this to full QM.

  ### Final Advice for the Year

  1.  **Don't fight PBR; navigate it.** Accept that you must violate Preparation Independence. Look into **retrocausal** models (e.g., Price, Wharton) or **global constraint** models. This is the only viable path to a psi-epistemic view that matches QM.
  2.  **Focus on the "Epistemic Horizon."** The hardest part isn't saying $\psi$ is knowledge; it's explaining *why* nature prevents us from knowing more. If you can derive the Uncertainty Principle from a constraint on information access rather than a property of particles, you win.
  3.  **Drop the 3N obsession as a constraint.** Use it as a heuristic. If your $\lambda$ ends up being high-dimensional, ask if that dimensionality is *physical* or *relational*.
  4.  **The "Superbookie" is your litmus test.** If your model allows an agent with $\lambda$ to signal faster than light or beat the Born rule, you have proposed a new physics. Decide early: are you fixing QM or replacing it?

  If you can construct a model where $\lambda$ is local, 3D, and distinct $\psi$ overlap, but Preparation Independence is denied via a time-symmetric constraint, and you can derive the Born Rule from an information-theoretic limit on accessing $\lambda$... you'll have something. If you can't, you'll know why by December.
