prompt: |-
  So I'm thinking about spending next year trying to build (or at least defend) a view where the wavefunction isn't a thing in the world but something more like a state of knowledge, and before I sink a year into it I want to know what I should be demanding of such a view. Not a reading list — I can find the papers myself. I want the spec. Purpose: it has to be good enough to be a real alternative to the wavefunction-is-real views, not a relabeling of one of them with some extra bookkeeping bolted on.

  Where I'm at: the motivation is the usual one. The state of N particles lives in this enormous 3N-dimensional space, gets handed to you by a preparation procedure, jumps when you find something out, and isn't the kind of thing anyone has ever measured directly — so maybe it's like a probability distribution. But "it's knowledge" is cheap until you say knowledge of what and why that knowledge has the shape it has. So: write me the desiderata.

  Things I think belong on the list, but you decide and add the ones I'm missing: what the underlying states of affairs have to be like; why the set of things-you-can-know has exactly the geometry of a Hilbert space (why maximal information is a pure state, why you can rotate any state into any other, why there are exactly this many perfectly distinguishable ones); how interference and entanglement come out right if the state is only bookkeeping — in particular how you get the exponential size of the state space without paying for it in ontology; why nobody can use the underlying state to out-bet the Born rule; what a measurement is and where definite outcomes come from; what happens to Bell-type correlations and to locality; whether it's supposed to be empirically identical to textbook quantum mechanics or allowed to differ somewhere; and whether it has to be a view about measurement outcomes only or also about the world between them.

  For each one, the case or consideration behind it, what breaks if you drop it, and whether it's a genuine requirement or just a prejudice of one camp — is locality here a desideratum or a fetish, is "the quantum state has to be derived from the underlying facts rather than posited alongside them" fair or circular, is being able to say what would be different if the view were true non-negotiable.

  Two I especially want. First: I keep being told about an argument that runs roughly — prepare two systems independently, assume the underlying state of the pair is just the two underlying states sitting side by side, and you can apparently get to the conclusion that two distinct pure states can never rest on the same underlying state, which would kill the project. Is "distinct pure states must be able to overlap" an actual desideratum, or can you be a wavefunction-is-knowledge person without it? Second, one I made up: an agent who was somehow handed the exact underlying state still couldn't make money against a bookie who only knows the quantum state. I think that belongs on the list, but I can't tell if it's a real constraint, just empirical adequacy in a costume, or in tension with wanting the underlying story to explain anything at all.

  Then the parts I care most about: which subset of the requirements can't all be had at once, and which single requirement knocks out the most candidates. A line each at the end on the usual suspects — the pilot-wave one, the collapse ones, many worlds, the "it's just an agent's betting odds" version — is enough; the criteria are where I want the work. Also: if I'm honest I don't know whether my 3N-dimensional motivation is even a good reason to want the view, so tell me if that one definately shouldn't survive onto the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user wants to spend a year developing/defending an epistemic view of the wavefunction (psi-epistemic) vs. an ontic view (psi-ontic). They need a "spec" or list of desiderata/criteria to evaluate such a view.
      *   **Constraint:** No reading lists. Focus on the philosophical/structural requirements.
      *   **Tone:** Sophisticated, technically aware (knows about Hilbert space, Bell, PBR, etc.), critical, and direct.
      *   **Specific Questions:**
          *   Validate/expand their proposed list of desiderata.
          *   Analyze the PBR theorem argument (distinct pure states overlapping).
          *   Analyze the "agent with underlying state can't beat Born rule" constraint.
          *   Identify incompatibilities (which requirements can't be had together).
          *   Identify the "killer" requirement.
          *   Briefly categorize standard interpretations against these criteria.
          *   Evaluate the "3N-dimensional space" motivation.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Ontology:* What exists if $\psi$ isn't real? (Hidden variables? Events? Relations?)
      *   *Hilbert Space Structure:* Why complex numbers? Why unitary evolution? Why the specific dimensionality?
      *   *Interference/Entanglement:* How does epistemic restriction mimic ontic superposition?
      *   *Born Rule:* Why *this* probability rule? Why can't we beat it?
      *   *Measurement/Outcomes:* How do definite results arise? (The measurement problem).
      *   *Bell/Non-locality:* How to handle correlations without action-at-a-distance?
      *   *Empirical Adequacy:* Must match QM predictions exactly?
      *   *Inter-measurement Reality:* Is there a world between measurements?
      *   *3N Motivation:* Is high-dimensionality a valid reason to reject onticity?

  3.  **Address the Two Special Requests:**
      *   *PBR Theorem (Distinct Pure States Overlap):* The Pusey-Barrett-Rudolph theorem argues that if preparation independence holds, $\psi$ must be ontic. So, a psi-epistemic view *must* deny preparation independence or accept that distinct $\psi$ correspond to disjoint ontic states (which makes it effectively ontic). The user asks: Is overlap a desideratum? Yes, for a *strongly* epistemic view. If distributions don't overlap, $\psi$ is determined by the ontic state, making it ontic in disguise.
      *   *The "No-Superbookie" Constraint:* If an agent knows the ontic state $\lambda$, can they predict better than $\psi$? If yes, $\psi$ is incomplete (Einstein's view). If no, $\psi$ is maximal knowledge. This is the "Completeness" vs. "Hidden Variable" tension. It's a real constraint for *psi-epistemic* views that want to retain QM completeness.

  4.  **Identify Tensions/Incompatibilities (The "No-Go" Theorems):**
      *   Bell's Theorem: Locality + Realism + QM predictions = Impossible.
      *   PBR Theorem: Preparation Independence + Psi-Epistemic (overlap) + QM predictions = Impossible.
      *   Kochen-Specker: Non-contextuality + QM = Impossible.
      *   *Key Insight:* You cannot have Locality, Preparation Independence, *and* a purely Epistemic $\psi$ while matching QM. Something has to give.

  5.  **Evaluate the "3N-Dimensional" Motivation:**
      *   Is it a good reason? It's the classic motivation for epistemic views (config space is weird). But ontic views (Many Worlds, Pilot Wave) bite the bullet. It's a aesthetic/metaphysical preference, not a logical necessity. It should be on the list as a *motivation*, not a *constraint*.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the ambition. This is the hard problem of QM foundations.
      *   *Section 1: The Spec (Desiderata).* Group them logically.
          *   *Ontological Parsimony:* What is $\lambda$? (3D vs 3N).
          *   *Structural Derivation:* Why Hilbert Space? (Hard mode).
          *   *The Epistemic Restriction:* Why can't we know more? (The "why" of uncertainty).
          *   *Dynamics:* Why Schrödinger?
          *   *Outcomes:* Definite results.
      *   *Section 2: The Two Specific Constraints.*
          *   *PBR/Overlap:* Explain that without overlap, it's crypto-ontic. This is the heart of the "epistemic" claim.
          *   *The Superbookie:* This is essentially "Quantum Completeness." If $\lambda$ gives more info, QM is incomplete. If you want to save QM as complete, $\lambda$ must be inaccessible or constrained.
      *   *Section 3: The Impossible Trinity (Incompatibilities).*
          *   Highlight PBR vs. Preparation Independence.
          *   Highlight Bell vs. Locality.
          *   Identify the "Killer": **Preparation Independence** (for PBR) or **Locality** (for Bell). For a psi-epistemic view, PBR is the specific hurdle.
      *   *Section 4: The 3N Motivation.*
          *   Be honest: It's aesthetic. Ontic views accept 3N. Don't make it a hard constraint, or you beg the question.
      *   *Section 5: Scorecard.*
          *   Bohm: Ontic, Non-local, Deterministic.
          *   GRW/Collapse: Ontic (mostly), Stochastic, Modifies QM.
          *   MWI: Ontic, Local (sort of), No unique outcomes.
          *   QBism/Relational: Epistemic, Agent-centric, Solves measurement by denying observer-independent facts.

  7.  **Refining the Tone:**
      *   Avoid being too textbook-like. Use the user's language ("bookkeeping," "out-bet," "fetish").
      *   Ensure the distinction between *psi-epistemic* (state is knowledge) and *psi-supplemented* (state is knowledge + hidden variables) is clear. The user seems to want *psi-epistemic* (knowledge of underlying stuff).
      *   *Self-Correction on PBR:* The PBR theorem assumes "Preparation Independence." A psi-epistemic view *must* violate this to survive. So the desideratum isn't "Overlap," it's "Overlap *without* violating Preparation Independence" (which is impossible). So the user must choose: Keep Overlap (and deny Prep Independence) or Keep Prep Independence (and lose Overlap/Epistemic nature). I need to make this clear.

  8.  **Final Polish:** Check against all user constraints.
      *   No reading list? Check.
      *   Desiderata with reasoning? Check.
      *   PBR analysis? Check.
      *   Superbookie analysis? Check.
      *   Incompatibilities? Check.
      *   Interpretation scorecard? Check.
      *   3N motivation evaluation? Check.

      *(Self-Correction during drafting)*: I need to be careful about the "Superbookie" constraint. If the underlying state $\lambda$ exists, and $\psi$ is just knowledge of $\lambda$, then knowing $\lambda$ *should* allow better predictions unless there is a fundamental restriction on accessing $\lambda$. If there is a fundamental restriction, why? This is the "Epistemic Horizon" problem. I need to frame this as a requirement for *explanation*, not just a rule.

      *(Refining the "Killer" Constraint)*: The PBR theorem is the specific killer for *psi-epistemic* views. Bell is a killer for *local* views. Since the user is specifically investigating *psi-epistemic*, PBR is the more relevant "killer." Specifically, the cost is **Preparation Independence**.

      *(Refining the 3N point)*: Don't dismiss it, but clarify it's a motivation for the *project*, not a constraint on the *theory*. A theory that ends up with 3N ontology fails the *motivation*, but might still be consistent.

      *(Final check on "Overlap")*: If distinct pure states map to disjoint ontic states, $\psi$ is a function of $\lambda$. That makes $\psi$ ontic (or at least determined by ontology). So yes, overlap is required for a *robustly* epistemic view.

