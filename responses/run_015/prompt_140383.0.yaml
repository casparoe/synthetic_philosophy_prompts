answer: |-
  This is a classic demarcation problem, precisely the sort your convener intends you to grapple with. To answer it, we must reconstruct the implicit demarcation criteria—the 'canons'—that generate his past verdicts. We are not asking whether the Amazonian enclosures exist; we are asking whether the *structure of the argument* conforms to the convener's established definition of legitimate historical inquiry.

  Based on the eight precedents provided, I derive the following three operative rules. Note that they prioritise methodological conduct over content or credentials.

  ### The Convener's Canons

  **Canon I: The Immunisation Prohibition (Method & Evidence)**
  *Derived from (iv) vs (v), (vi), (vii).*
  A claim becomes pseudohistorical when negative evidence or absence of evidence is explained by appeal to **deliberate suppression or conspiracy** (e.g., 'written out of the record'). This renders the claim unfalsifiable. Conversely, explaining absence of evidence via **checkable methodological limitations** (e.g., survey bias, geological ambiguity, preservation conditions) is legitimate, even if the conclusion is radical.
  *   *Precedent:* Tartaria (pseudo) invokes suppression; Sphinx weathering (legitimate) invokes geological ambiguity; Iron Age dates (legitimate) invoke radiocarbon variance.

  **Canon II: The Risk Requirement (Prediction & Revision)**
  *Derived from (vi), (vii) vs (i), (ii), (iii).*
  Legitimate scholarship must expose itself to the risk of falsification through specific, testable predictions. A failed prediction does not automatically render a project pseudohistorical **provided** the failure is accounted for by independent data and followed by a **new, risky prediction**. However, if a hypothesis is continually modified *post hoc* solely to accommodate failure without generating new testable consequences, it is pseudohistory.
  *   *Precedent:* Younger Dryas (legitimate) remains testable despite being 'unsupported'; Fomenko (pseudo) uses quantitative apparatus but creates a system that absorbs all contradictions without risk.

  **Canon III: The Status Irrelevance (Credentials & Orthodoxy)**
  *Derived from (iii) vs (viii).*
  Professional credentials do not confer scientific status, nor does their absence deny it. Similarly, opposition from an 'orthodoxy' is not proof of pseudoscience, nor is acceptance proof of science. The classification rests on the argument's structure, not the arguer's institutional position.
  *   *Precedent:* Fomenko (mathematical eminence) is pseudo; the uncredentialed amateur (viii) is not.

  ---

  ### Application to the Interfluve Survey Project

  We must assess the project at two stages, as the rules apply differently to the *proposal* versus the *response to anomaly*.

  **Stage 1: Before the Surveys (The Proposal)**
  *   **Canon I:** N/A (No negative evidence yet).
  *   **Canon II:** **Pass.** The team pre-registered a specific, quantitative prediction (20 enclosures >100m in 40 tiles). This is high-risk, high-reward scholarship, identical in structure to the Iron Age radiocarbon proposal (vii).
  *   **Canon III:** **Neutral.** They are professionals, but per Canon III, this counts for nothing. However, their complaint about grant rejection touches on 'orthodoxy'. If framed as sociological resistance (Kuhnian normal science), it is acceptable. If framed as active suppression, it risks violating Canon I.
  *   **Verdict at Stage 1:** **Not Pseudohistory.** It looks like ordinary, ambitious scholarship.

  **Stage 2: After the Surveys (The Response to Failure)**
  *   **Canon I:** **Critical Juncture.** The prediction failed (4 found, not 20). The team explains this via permit issues and logging affecting detection.
      *   *Analysis:* Is this 'suppression' (Tartaria) or 'survey bias' (Sphinx/Iron Age)? Permits and logging are material, independently verifiable facts. They are not claiming a cabal hid the enclosures; they are claiming the *detection method* was compromised by environmental change and bureaucracy. This aligns with the Sphinx weathering verdict (v), where a methodological disagreement explains the divergence from consensus.
  *   **Canon II:** **Pass.** They have not abandoned the risk. They have issued a *second* pre-registered prediction (30 enclosures in new tiles) using a validated pipeline. This avoids the 'ad hoc rescue' trap. They are effectively saying: 'The theory holds, the instrument failed; here is a calibrated instrument.' This mirrors the Younger Dryas case (vi), where a hypothesis persists despite current lack of support because the testing mechanism remains valid.
  *   **Canon III:** **Neutral.** Their complaint about 'orthodoxy' is the only danger signal. However, complaining about grant panels is a complaint about resource allocation, not evidence tampering.
  *   **Verdict at Stage 2:** **Not Pseudohistory.**

  ---

  ### The Convener's Likely Verdict

  **Verdict:** **Not Pseudohistory.**
  **Classification:** **Legitimate Science (currently unsupported/disputed).**

  **Reasoning:**
  The convener's track record shows a strong tolerance for **wrongness** provided it is **accountable**. Cases (v) and (vi) are the strongest predictors here. In (v), the Sphinx argument is minority and likely wrong, but it is geological, not conspiratorial. In (vi), the Younger Dryas hypothesis is 'unsupported' but remains 'legitimate science'.

  The Amazon team fits the (vi) profile. They made a risky prediction, it failed, they offered a checkable explanation for the failure (logging/permits), and they issued a new risky prediction. This is the Lakatosian model of a 'research programme' protecting its 'hard core' by adjusting the 'protective belt' (the detection pipeline), which is permissible so long as the programme predicts novel facts.

  The complaint about 'orthodoxy' is the only friction point. However, the convener distinguishes between *explaining away missing evidence by suppression* (iv, pseudo) and *complaining about sociological resistance to funding* (viii, acceptable). As long as the team does not claim the missing enclosures were *hidden* by the 'pristine forest' lobby, but rather that the lobby *underfunded the search*, they remain within the bounds of legitimate scholarly grievance.

  ### The Discriminating Case (How the Rules Could Diverge)

  While the rules currently converge on 'Not Pseudohistory', they are contingent on the **verifiability of the excuse**. The rules would diverge, and the verdict would flip to 'Pseudohistory', under the following condition:

  **The Discriminator:** **Independent verification of the 'logging/permit' claim.**

  1.  **Scenario A (Remains Legitimate):** External audit confirms that Tile X and Tile Y were indeed not flown due to permit denial, and satellite imagery confirms significant canopy disturbance (logging) in the other tiles that would degrade LiDAR return quality.
      *   *Result:* Canon I is satisfied (the excuse is methodological, not conspiratorial). The failure is instrumental, not theoretical. Verdict stands: **Not Pseudohistory.**

  2.  **Scenario B (Becomes Pseudohistory):** Investigation reveals permits were granted but ignored, or the imagery shows no significant logging, yet the team maintains the data was 'corrupted'.
      *   *Result:* The explanation for the failed prediction becomes an **ad hoc immunisation**. They are now explaining away negative evidence (the lack of enclosures) by inventing a methodological failure that didn't happen. This collapses into the logic of (iv) Tartaria: 'The evidence isn't there because the record is flawed/suppressed.'
      *   *Commitment:* If the convener rules 'Not Pseudohistory' in Scenario B, he violates Canon I and effectively grants immunity to any group that blames 'technical glitches' for failed pre-registrations. If he rules 'Pseudohistory' in Scenario A, he violates Canon II by punishing a team for making a new risky prediction after a justified instrumental failure.

  ### Conclusion on Underdetermination

  The precedents do not *genuinely* underdetermine the case **provided** the 'logging/permit' excuse is treated as an empirical claim subject to verification.

  However, there is a subtle tension between **Canon I** and **Canon II** regarding the 'orthodoxy' complaint.
  *   If the convener interprets *any* appeal to 'orthodoxy' as a conspiracy theory (leaning on iv), the verdict is **Pseudohistory**.
  *   If the convener interprets appeals to 'orthodoxy' as standard sociology of science (leaning on vi and viii), the verdict is **Not Pseudohistory**.

  **The Commitment:**
  By ruling **Not Pseudohistory**, the convener commits himself to the view that **sociological resistance (grant rejection) is distinct from epistemological suppression (hiding data).** He affirms that a research programme can be 'legitimate' even if it is currently failing its own tests, provided the failure is honestly accounted for.

  By ruling **Pseudohistory**, he commits himself to the view that **failed pre-registered predictions are fatal** unless the theory itself is abandoned, not just the detection method. He would be asserting that the 'logging' excuse is inherently too convenient to be trusted without proof of the enclosures themselves first.

  Given his history with the Younger Dryas (vi) and Sphinx (v) cases, he almost certainly views the **methodological accountability** (the pre-registration and the checkable excuse) as the deciding factor, not the current lack of ditches. He will likely classify this as **legitimate, high-risk science**, while noting that the burden of proof has now shifted decisively to the second survey.
