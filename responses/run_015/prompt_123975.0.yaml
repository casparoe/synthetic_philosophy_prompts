answer: |-
  To inform the go/no-go decision on debate-style oversight, this agenda prioritizes questions that determine whether the protocol offers any comparative advantage over direct verification, and whether that advantage survives adversarial pressure. The ordering is strict: later questions are only valuable if earlier ones confirm the protocol's viability. Each question is designed to yield generalizable insights about human-AI epistemology, ensuring the work remains valuable even if the group pivots to alternative oversight methods.

  **1. What is the baseline Verification-Depth Gap for current open-weight models on verifiable tasks?**

  This question must be answered first because it establishes the ceiling for the protocol's utility. The Verification-Depth Gap (VDG) measures the ratio of effort required to verify an answer directly versus verifying it through a debate tree. If this gap is near one, debate introduces overhead without amplifying capability; the judge could have verified the answer directly with equal effort. In this scenario, obfuscation is irrelevant because the protocol offers no leverage to begin with.

  *Upstream Dependencies:* None. This is the foundational metric.
  *Tractability:* High. With eight researcher-years, the team can construct datasets of tasks with known ground truth (e.g., code generation, formal proofs) where solutions vary in complexity. Researchers can measure the time a human judge needs to verify a direct solution versus a decomposed argument tree generated by open-weight models.
  *18-Month Trigger:* If empirical data shows a VDG consistently below 1.2 across diverse domains, the question moves down permanently, and the group should recommend shutting down the debate line. A gap this small suggests decomposition does not meaningfully reduce verification load for current model classes. Conversely, a gap above 2.0 moves the subsequent questions up, indicating genuine amplification potential.

  **2. At what complexity threshold does Credibility-Matching Obfuscation invert judge accuracy?**

  Assuming a positive VDG, the second priority is determining whether honest agents are forced to waste that advantage to compete. Credibility-Matching Obfuscation (CMO) occurs when an honest debater must pad a simple correct answer with unnecessary steps to appear as "worked-through" as a dishonest opponent's complex fabrication. This distinction is critical: the failure is not that the judge misses an error, but that the judge penalizes simplicity. If CMO forces honest agents to consume the entire VDG just to look credible, the net safety gain is zero.

  *Upstream Dependencies:* Requires Q1 to confirm a VDG > 1.
  *Tractability:* Medium. Researchers can simulate adversarial debates using open-weight models, prompting one agent to argue truthfully and another to argue persuasively but falsely. By varying the complexity of the truthful answer, the team can measure the point at which judges prefer the dishonest argument.
  *18-Month Trigger:* If honest agents must increase argument length by more than 50% to maintain win rates against dishonest obfuscators, this question signals a critical failure mode, moving the group toward shutting down the line. If honest agents can remain concise while winning, the protocol is robust, and the focus shifts to mitigation strategies.

  **3. Does Deferred Adjudication via empirical outcomes suppress Credibility-Matching Obfuscation?**

  This question addresses mitigation. Deferred Adjudication (DA) changes the incentive structure by scoring verdicts based on later empirical outcomes rather than immediate judge intuition. If judges know their verdict will be audited by reality (e.g., does the code run? does the prediction hold?), they may feel empowered to trust simpler honest arguments over complex dishonest ones, knowing obfuscation will fail the later audit. This distinguishes between obfuscation that survives audit (dangerous) and obfuscation that relies on immediate judge confusion (manageable).

  *Upstream Dependencies:* Requires Q2 to confirm CMO is a active problem.
  *Tractability:* Low to Medium. This requires tasks with delayed ground truth. While the group cannot use smarter auditors, they can use tasks where truth is revealed over time or via automated testing suites.
  *18-Month Trigger:* If implementing DA does not reduce the padding required by honest agents (measured in Q2), the protocol requires external grounding to function, limiting its scalability. If DA significantly reduces the incentive to obfuscate, the debate line remains viable even with weak judges.

  **Deprioritized Lines of Work**

  Two lines of work should be explicitly deprioritized as they do not impact the go/no-go decision or downstream safety insights.

  First, **optimizing debate transcripts for human readability.** While better UX might improve judge engagement, it does not address the epistemic limits defined by VDG or CMO. A readable obfuscated argument is still obfuscated. Improving readability does not change whether the judge *can* verify the truth, only how pleasant the process is. This is an engineering problem, not a safety bottleneck.

  Second, **asymptotic complexity theory of debate convergence.** Theoretical work proving debate works in the limit of infinite compute or superhuman agents is irrelevant to the group's constraints. The group cannot test systems smarter than the judge, and the go/no-go decision depends on performance with current open-weight models. Abstract proofs will not indicate whether the protocol works within the two-year budget or whether it fails due to human cognitive limits today.

  **Conclusion**

  This agenda sequences risk appropriately. If the Verification-Depth Gap is nonexistent, debate is overhead. If the gap exists but is consumed by Credibility-Matching Obfuscation, debate is unsafe. If Deferred Adjudication cannot fix that obfuscation, the protocol is not scalable with weak judges. Answering these in order ensures that if the group must pivot after two years, they leave behind precise data on where human verification breaks down, informing whatever oversight method comes next.
