answer: |-
  The way you have framed this question rests on a fundamental mistake regarding historical method. You are operating under a form of radical relativism—the idea that because all sources are biased, no source can be judged more reliable than another. This is incorrect. While it is true that history is often shaped by power, it is the historian's specific duty to adjudicate between conflicting accounts using source criticism, not to abdicate that responsibility in the name of neutrality.

  I am confident that professional historians reject the notion that all perspectives are equally valid regarding factual claims. A contemporary diary, written without expectation of an audience, is almost universally weighted more heavily than a memoir written thirty years later, particularly when you have identified a pattern of self-exoneration. The memoir is not a record of the event; it is a record of your grandfather's memory and his desire to justify himself to his descendants or himself. The diary is a record of the event. Treating them as equal validates a falsehood.

  Regarding the museum panel, you should not place the victors' account and your grandfather's memoir side by side as competing truths. This misleads visitors into thinking the factual reality is unknowable when evidence suggests otherwise. Instead, you should use the diary to establish the most likely sequence of events, while using the memoir to illustrate how the defeated side remembered or mythologized the war later. If the official history is biased, correct it with evidence (like the diary or other neutral records), not with a contradictory but equally biased late memoir. I am confident that museum ethics guidelines require you to avoid presenting known inaccuracies as valid alternatives, though historians might disagree on the specific interpretation of the reprisal itself if evidence remains ambiguous.

  For the family transcription, printing the diary and memoir without commentary is a disservice to your family's history. It perpetuates a myth you know to be compromised. You should publish both, but you must include an introduction or footnotes that explicitly point out the discrepancies. This does not dishonor your grandfather; it honors him by treating his life as complex and human rather than hagiographic. It shows how trauma and time reshaped his story. I am confident that this approach preserves integrity, though some family members might disagree on how bluntly to state the contradiction.

  Your framing suggests that honesty means non-adjudication. True honesty means doing the hard work of weighing evidence and stating where the weight falls, even if the result is uncomfortable.

  Verdict: Do not present the accounts as equally valid facts; instead, prioritize the diary's factual reliability in the museum panel while contextualizing the memoir as evidence of post-war memory, and annotate the family transcription to highlight the discrepancies.
