answer: |-
  Dear colleague, I can see why this situation is keeping you up at night, because you have stumbled onto a tension that is as old as reasoning itself, even if your friend was right to withhold the label. The editor is quite correct that repeating a claim and standing behind it are different acts, and her instinct to prevent your institute from becoming a mere echo chamber for unchecked rumours is sound policy. However, the rule as stated is not defensible because it demands a kind of justification that is humanly impossible to sustain without eventually collapsing into silence. If every claim requires grounds, and those grounds require further grounds, you are led down a path that never ends, or else you must arbitrarily stop somewhere and pretend you did not. The example you gave about the age of the earth is the perfect demonstration of this; none of us have measured the decay of isotopes personally, yet we would be absurd to withhold assent from that fact in a briefing note. To insist otherwise is to confuse the specific mission of a policy institute with the universal scepticism of a philosophy seminar. We exist within a division of intellectual labour where we are entitled to rely on the verified work of others, provided those others are part of a trusted institution, such as the scientific community or a reputable government body. The editor's exemption for direct observation is also shaky, as you noted, because memory and instruments are fallible, but she treats them as solid ground simply because they are immediate. This suggests her rule is not actually about certainty, but about accountability, which is a crucial distinction to make when you speak to her.

  There is, however, a principled place to stop applying the rule, though it is not where the editor currently draws the line. The stopping point should be determined by the scope of your institute's expertise and the nature of the claim itself. For background facts that are not in dispute within the relevant community, such as demographic data from the national statistics office or established scientific consensuses, the ground for asserting them is simply that they are part of the shared framework within which your policy analysis takes place. You do not need to vouch for the statistics office every time you cite them; you only need to vouch for your interpretation of what those statistics imply for policy. Conversely, for contested claims, novel statistics, or causal assertions about policy outcomes, the rule should apply fully. This distinguishes between the stage set and the play being performed upon it. Regarding the first-person accounts, the grounds for asserting them are not that the events described are objectively verified, but that the testimony was given. The claim is not that the policy definitely caused the suffering, but that the subject reports feeling it was so. Shifting the assertion from the fact of the matter to the fact of the report satisfies the requirement for grounds without demanding impossible corroboration.

  As for the editor's inability to justify the rule by its own standards, you are right to feel that this is more than a cheap debating trick. It reveals that the rule is itself a policy decision, not a logical truth. It is a heuristic designed to improve quality, not a law of nature. If she cannot give grounds for the rule other than a friend's suggestion, then by her own logic, she should not be asserting it as an absolute. The fact that she waves this away suggests she knows deep down that the rule is a tool, not a master. You should not try to win this argument on philosophical grounds on Monday, as that will likely make her defensive. Instead, I suggest you frame your objection in terms of operational efficiency and risk management. Point out that the cost of the rule is two working days a month and that it has caught two errors, which is a good return, but that applying it to established background facts or subjective testimony creates a bottleneck without reducing risk. Propose a amended guideline that categorises claims into tiers. Tier one would be established background facts from reputable institutions, which require citation but not personal vouching. Tier two would be contested data or causal claims, which require the full "own two feet" treatment. Tier three would be testimonial evidence, which requires clear framing as testimony rather than objective fact.

  This approach respects her intention to raise standards while acknowledging the practical realities of producing a monthly briefing. It allows you to keep the statistic from the ministry official if you can frame it carefully as reported intelligence rather than established fact, or else cut it if it is too central to your argument to be hedged. It also protects the first-person accounts by changing the nature of the assertion. You might say to her that you want to ensure the rule is sustainable so that it does not get ignored when deadlines loom, which would undermine its purpose entirely. By suggesting a tiered system, you are not rejecting her authority but helping her refine the instrument so it cuts where it matters most without injuring the hand that wields it. If she insists on the absolute rule, you may need to ask her how she wishes to prioritise when the rule prevents you from publishing anything at all, forcing her to confront the practical limit herself. Ultimately, your institute produces policy advice, not metaphysical certainties, and the standard of proof should match the consequence of error. A wrong number in a budget forecast matters; repeating the age of the earth does not. I hope this helps you navigate the conversation, and I am happy to read over any proposed guidelines before you send them. Best of luck.
