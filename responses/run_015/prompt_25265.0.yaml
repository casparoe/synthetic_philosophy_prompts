answer: |-
  The recorder's red light blinked like a slow, steady heartbeat. *Click. Whir. Click.*

  Dr. Aris Thorne adjusted the gain, his fingers trembling slightly. Outside the canvas tent, the rain on the island of Mako didn't fall; it hung in the air, a grey suspension that blurred the line between the jungle and the sky. Inside, the air smelled of damp wool and old coffee.

  Across the folding table sat Elara. She was the last fluent speaker of Kaelic. She was eighty years old, her skin mapped with the traditional indigo tattoos of her people, her eyes clouded with cataracts that saw more than Aris's perfect vision ever could.

  "Okay," Aris said, his voice sounding too loud in the small space. He kept his tone neutral, the 'linguistic register' he'd trained for five years to master. "Let's try the object again."

  He reached into the crate beside him and pulled out a preserved specimen in a glass jar. It was a *mako-weaver*, a local arachnid about the size of a fist, eight legs curled tight against its body.

  He placed the jar on the table. He pointed to the jar.

  "*Vesh*," Elara said. Her voice was like dry leaves scraping together.

  Aris noted it down. *Vesh.* Hypothesis 1: 'Spider.'

  He reached into the jar with a pair of long tweezers—careful not to break the seal—and plucked one of the legs off the specimen. He held the detached leg up.

  "*Vesh*," Elara said.

  Hypothesis 2: 'Spider part.'

  Aris put the leg down. He waited. He needed a temporal distinction. He couldn't kill another specimen; he only had three left. Instead, he pulled out a photograph. It showed a *mako-weaver* spinning a web. He pointed to the spider in the photo.

  "*Vesh*," Elara said.

  He pointed to the web in the photo.

  "*Vesh*," Elara said.

  Aris stopped writing. The pen hovered over the notebook, a drop of black ink swelling at the nib before falling, staining the page.

  This was the third day. This was the third day of *Vesh*.

  "Elara," Aris said, leaning forward. "I need you to help me understand. Is the leg... is the leg *Vesh*?"

  Elara tilted her head. She didn't speak English. They were communicating through a pidgin of gestures and the few hundred words Aris had managed to map with high confidence over the last six months. But the ontology—the fundamental building blocks of her reality—were slipping through his fingers like the mist outside.

  "Leg," Aris said, tapping the detached limb. "Spider," he said, tapping the jar. "Same?"

  Elara smiled. It wasn't a warm smile. It was the smile of a teacher watching a child try to divide by zero. She reached out and touched the glass of the jar. Then she touched the leg. Then she tapped her own wrist, where her pulse beat.

  "*Vesh*," she said.

  Aris felt a cold knot tighten in his stomach.

  Quine's ghost was haunting the tent. *Radical Translation.* The indeterminacy of reference. Aris had taught this at university. He had lectured undergraduates on the *gavagai* problem. *A native says 'gavagai' when a rabbit runs by. Does it mean 'rabbit'? Or 'undetached rabbit part'? Or 'temporal stage of a rabbit'?*

  He had told his students that behavioral evidence could never settle the matter. That we are all trapped in our own conceptual schemes.

  He hadn't believed it. Not really. He had thought it was a philosophical parlor trick. A problem to be solved with better testing, more context, deeper immersion.

  But Elara wasn't a thought experiment. She was a dying woman, and her language was a locked room, and he was standing outside screaming to be let in.

  "Show me," Aris whispered.

  He stood up and walked to the flap of the tent. He pushed it open. The grey mist rushed in, cooling the sweat on his neck. A bird, a dark shape against the fog, landed on a branch ten feet away.

  Aris pointed. "Elara. Look."

  Elara shuffled out behind him. She looked at the bird.

  "*Kip*," she said.

  Aris nodded. *Kip.* Bird.

  He pointed to the bird's wing, fluttering as it balanced. "*Kip*?"

  "*Kip*."

  He pointed to the shadow the bird cast on the wet leaves. "*Kip*?"

  "*Kip*."

  He pointed to the space the bird had occupied five seconds ago, before it hopped. "*Kip*?"

  Elara looked at the empty space. She looked at Aris. For a long moment, the only sound was the dripping of water from the canvas.

  "*Kip*," she said softly.

  Aris dropped his hand.

  It wasn't that the word meant all those things. It was that the distinction didn't exist. In Kaelic, there was no boundary between the object and its parts, or the object and its location in time. To point to a bird was to point to a flicker of existence that included its wings, its shadow, its history, and its potential.

  To isolate the "bird" from the "birding" was, to Elara, a violence. A cutting.

  Aris thought of the leg he had torn from the spider. He felt a sudden wave of nausea. He hadn't been testing a hypothesis. He had been performing a dissection on her world.

  "Elara," he said. "If I... if I go away. If I die." He pointed to himself. "Aris." He mimed falling. He pointed to the ground where his body would be. "*Aris*?"

  Elara looked at him. Her cataract-clouded eyes seemed to focus on something behind him, something in the mist.

  She reached out and touched his chest, right over his heart. Then she touched the mud beneath their feet. Then she pointed to the horizon, where the sea met the sky.

  "*Aris*," she said.

  Aris stepped back. The implication washed over him, chilling and absolute. If *Vesh* is the spider and the leg and the web, and *Kip* is the bird and the shadow and the empty air... then *Aris* is not just the man. *Aris* is the space he occupies, the time he takes up, the effect he has on the world.

  There is no "you" separate from your context. There are no objects. There are only events.

  He looked at his notebook. The pages were filled with neat columns: *Noun. Verb. Adjective.* He had been trying to force a fluid reality into a grid of static boxes. He wasn't translating a language. He was trying to translate a universe into one that didn't fit.

  The red light on the recorder was still blinking. *Click. Whir. Click.* Capturing the sound of his failure.

  "Turn it off," Elara said.

  It was the first English sentence she had ever spoken to him. Her accent was thick, rusty from disuse, but clear.

  Aris froze. "You... you speak English?"

  "A little," she said. She turned back toward the tent, her silhouette merging with the grey fog. "You ask too many questions about where things stop. Nothing stops, Doctor. Nothing starts."

  She paused at the flap.

  "*Vesh*," she said, gesturing to the rain, the tent, the recorder, and Aris all at once.

  Then she went inside.

  Aris stood alone in the mist. He looked down at his hands. He tried to see where his skin ended and the air began. He tried to find the boundary of his own self, the edge of the "I" that was observing the world.

  But the rain fell through him, and the mud clung to his boots, and the sound of the recorder hummed in his bones.

  He couldn't find the edge.

  He reached down and clicked off the recorder. The red light died. The silence that followed was heavy, total, and utterly untranslatable.
