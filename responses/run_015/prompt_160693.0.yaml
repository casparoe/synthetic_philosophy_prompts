      2.  **Equality of the Dead:** Accept this, but modify. It's not metaphysical; it's communal. The town mourns its own losses. It distinguishes *grief* from *honor*. You can grieve a loss without honoring the cause.
      3.  **Volunteer/Conscript:** Do not mention. It divides the families of the 3 and gives ammo to the detractors. It's historically relevant but ceremonially toxic.
      4.  **The Bet:** The speech bets on *belonging* over *justification*. The marker says "These names belong to this town." The speech says "We acknowledge the cost of that belonging, even when it led away from us."

      **Drafting the Speech:**
      *   Tone: Somber, direct, unadorned.
