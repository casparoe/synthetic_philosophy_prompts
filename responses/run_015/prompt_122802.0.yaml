      *   *Section 2: The "Equally Valid Shapes" Defeater.* (User asked for this). Tragedy vs. Comedy vs. Romance (Frye/Mink). If the *facts* don't constrain the *shape*, is it explanation or art? *Ranking:* Fatal to truth-claims, Awkward to understanding-claims.
      *   *Section 3: The "Damage Tolerance" Defeater.* (User asked for this). How much can you cut? If the middle is fuzzy but ends are fixed, does the link hold? *Ranking:* Awkward (shows vagueness), not Fatal (all explanation has vagueness).
      *   *Section 4: The "Scrambled-Annals" Refinement.* The user's test is good, but needs nuance. Historians *do* care about order, but is it causal order or narrative order?
