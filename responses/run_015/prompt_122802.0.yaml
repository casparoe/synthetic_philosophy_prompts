  1.  **Analyze the User's Position:**
      *   **Core Claim:** Narrative explanation in history does *real* explanatory work. It's not just a placeholder for covering-law (Hempel-style) explanations. The "shape" of the telling (the sequence, the connection of A->B->C) is constitutive of the explanation, not decorative.
      *   **User's Proposed Defeater:** The "Scrambled-Annals Test." If you scramble the chronological order of events but keep the facts, and historians still reach the same explanatory verdicts, then the narrative structure isn't doing work.
      *   **User's Request:**
