      *   *The "Equifinality/Underdetermination" Objection:* If two contradictory narratives fit the facts equally well and historians can't decide, narrative isn't tracking truth/explanation, it's aesthetic.
      *   *The "Gappiness" Objection:* If you can remove large chunks of the "story" without changing the explanatory power, the sequence isn't load-bearing.
      *   *The "Expert Disagreement" Objection:* If laypeople get the explanation from the story but experts reject it despite the story holding together, the story isn't the engine.
      *   *The "Prediction/Intervention" Objection:* If the narrative explanation doesn't help you predict or intervene in similar future cases (pragmatic test), does it explain?

