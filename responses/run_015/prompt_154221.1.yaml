      *   *Nuance on Agonism:* Be careful. Mouffe uses Schmitt (friend/enemy). Spinoza uses *conatus* (power). The overlap is the acceptance of conflict, but the metaphysics differ. I should suggest comparing Spinoza to *William Connolly* (affect/ethos) perhaps more than Mouffe, or just keep it general.
