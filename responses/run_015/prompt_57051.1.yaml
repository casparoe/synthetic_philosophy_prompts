answer: |-
  Here is the argument for reflexive blame, committed and without hedging.

  ### The Core Argument: The Principle of Tested Authority

  The single load-bearing premise of this view is **The Principle of Tested Authority**. It states: *Normative authority over a specific violation is grounded not in behavioral conformity to the norm, but in the demonstrated competence to recognize the force of the temptation to violate it and successfully subordinate it to the norm.*

  On the standard picture, standing is a permission slip granted by innocence. On this view, standing is a credential earned by mastery. To blame someone is to claim that the norm binding them is valid and actionable. The spotless engineer knows the rule is valid abstractly. The retired engineer knows the rule is valid *practically* because she has measured the weight of the competing pressures (deadlines, costs, career anxiety) against the norm and found the norm heavier. Her blame carries the specific authority of someone who knows exactly how hard the job was and confirms it was still doable. This is why her standing is superior: she validates the *feasibility* of compliance under fire, whereas the clean-handed blamer only validates the feasibility of compliance in the absence of fire.

  **Why this premise is exposed:**
  This premise is the most vulnerable point because it sounds like it valorizes sin. It implies that the person who never faced the temptation has less authority than the person who faced it and fell, even if both are currently compliant. It risks the conclusion that moral innocence is a deficit of experience.

  **How to patch it:**
  The defender must clarify that the virtue lies in the *testing*, not the *falling*. The commission of the fault is not the source of authority; it is the evidentiary baseline that proves the temptation was real. However, since we cannot reliably know the strength of a temptation without seeing someone struggle against it, first-person commission is the most reliable proxy for "tested virtue." The patch is to insist that the authority comes from the *recovery* and the *current mastery*, but that this mastery is epistemically inaccessible without the history of the struggle. The spotless engineer *might* have the same mastery, but she cannot demonstrate it regarding this specific temptation. The retired engineer *has* demonstrated it. The premise holds because normative authority is communicative; it requires the ability to convince the accused that compliance was possible. Only the tested blamer can credibly say, "I know why you did it, and I know you could have not done it," because she has said it to herself.

  ### The Reductio: The Sinners' Panel

  The obvious objection is that this view implies the worse you've been, the better your standing. If authority comes from overcoming temptation, should we staff integrity panels with the most disciplined former criminals? Should we prefer the engineer who signed off on bad calculations over the one who never faced the pressure to do so?

  This reductio fails because it confuses the *condition* of temptation with the *competence* of resistance. The Principle of Tested Authority requires **successful subordination**. The serial wrongdoer who acknowledges nothing fails the second half of the premise. They have recognized the force of the temptation (by succumbing to it repeatedly), but they have not subordinated it to the norm. They have no authority because they cannot credibly claim the norm is binding; their own conduct testifies that it is optional. They lack the "successful" clause.

  Furthermore, acknowledgment alone is not doing all the work. A moral theorist could acknowledge the norm and the temptation abstractly. They could say, "I understand it is hard to resist cutting corners." But without the first-person commission, this acknowledgment is theoretical. The wrongdoing tags along as a necessary add-on because it provides the data point of *practical salience*. The retired engineer knows the temptation wasn't just a thought; it was a live option that she acted on. This proves the temptation was strong enough to override a professional's judgment. Her acknowledgment is weighted by the memory of the cost. The theorist's acknowledgment is unweighted. Therefore, the retired engineer has authority the theorist lacks, and the reformed engineer has authority the serial violator lacks. The view discriminates perfectly: it rewards the *navigation* of the fault, not the fault itself, but it requires the fault to prove the navigation was non-trivial.

  ### The Classic Hypocrite

  This view forces a radical reclassification of the classic hypocrite: the currently guilty, unrepentant blamer. The standard view says this person lacks standing—they are blocked from blaming. My view says their problem is deeper: **they are not blaming at all.**

  Blame is a moral address that invites the accused to recognize a shared normative commitment. It says, "We are both bound by this, you have slipped, and I am calling you back." When the hypocrite blames, they are asserting a norm they are currently denying in action. By violating the norm themselves, they signal that the norm does not bind them. You cannot simultaneously signal "This norm does not bind me" and "You are bound by this norm." The speech act contradicts itself.

  Therefore, the hypocrite's output is not defective blame; it is aggression masquerading as blame. It is a weapon used to dominate, not a demand used to restore moral equilibrium. Because they lack the "successful subordination" required by the Principle of Tested Authority (they are currently subordinate to the temptation), they cannot access the normative space where blame operates. They are outside the practice. This explains why we feel disgust rather than just procedural objection when hypocrites blame. We aren't thinking, "You aren't allowed to say that." We are thinking, "You don't even know what you're saying."

  ### The Untested Virtue

  This view predicts that the standard account gets the case of the untested virtuous person wrong. Consider the moralizer who has never once been tempted to cut corners on safety calculations. The standard account grants them full standing. My view says their standing is structurally thin.

  Because they lack the practical relationship to the norm, their blame is liable to be distorted. They do not know the cost of compliance. Consequently, they are likely to underestimate the difficulty of the act and overestimate the moral failure involved in the violation. Their blame risks being cruel or abstract because it lacks the empathy of shared struggle. They cannot address the accused as someone who has "been where they are."

  This does not mean the untested person should be silenced. It means their blame carries less weight regarding *mitigation* and *remediation*. They are qualified to judge the violation of the rule, but not the struggle of the agent. The retired engineer is qualified to judge both. In a dispute between the two, the retired engineer's assessment of the young member's culpability should trump the spotless engineer's, because the retired engineer's judgment is calibrated against the reality of the pressure, not just the abstract rule.

  ### Institutional Design

  Finally, should we actually want institutions to run on this? Yes. The standard view designs panels to look like courts of innocence, which encourages members to hide their pasts or pretend to a purity they don't possess. This creates a culture of defensiveness.

  A system built on the Principle of Tested Authority would actively seek out reformed members for integrity panels, provided their reform is verified. This increases the legitimacy of the panel's decisions. When the accused young engineer looks across the table at the retired engineer, he sees someone who knows the cost of the mistake and the cost of the punishment. He knows the judgment is not coming from a place of abstract superiority, but from earned experience. This makes the blame more likely to be accepted and the lesson more likely to be learned.

  The risk is recidivism or bias, but that is managed by the "successful subordination" clause. We do not pick the sinners; we pick the survivors. An institution that acknowledges that virtue is tested rather than innate is more robust than one that pretends virtue is the absence of sin. We should staff the panel with the retired engineer, not despite her past, but because of what she did with it. Her record is not spotless, but her authority is solid. The spotless record is merely empty.
