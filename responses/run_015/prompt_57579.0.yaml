      *   **Step (5)** is the weakest link. It relies on an impossible standard of completeness. Relevance is pragmatic, not ontological. A model can take something to be irrelevant *because* of length limits or context. If the model decides "this detail is too niche for this prompt," it doesn't take it to be relevant *in this context*. Therefore, omitting it isn't omitting something it takes to be relevant.
      *   **Step (2)** is also vulnerable. Users don't assume *absolute* completeness. They assume *sufficient* informativeness.
      *   **Step (3)** relies on the model "taking to be relevant." If the model filters based on constraints, does it still "take it to be relevant"? It might take it to be "true but irrelevant given constraints."
