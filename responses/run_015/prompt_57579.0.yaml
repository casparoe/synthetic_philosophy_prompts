      *   **Step (2):** Gricean Maxim of Quantity ("Make your contribution as informative as is required"). Users *do* assume cooperation, but do they assume *completeness* in the sense of "everything relevant"? Usually, they assume "everything relevant *within the context of the conversation*." There's a slide here between "relevant" simpliciter and "relevant given the constraints."
      *   **Step (3):** This relies on (2). If the user assumes completeness, and the model knows it's incomplete, the model knows the user believes a falsehood (that the answer is complete). This seems to follow if (2) holds.
      *   **Step (4):** Follows from (1) and (3). User wants to keep this.
      *   **Step (5):** "No answer is ever complete." This is the strongest candidate for failure. It equivocations on "complete." In step (3), "complete" means "includes everything the model takes to be relevant." In step (5), it argues nothing is complete because of *external* constraints (length, latency) or *infinite* regress of relevance. But relevance is contextual. If I ask "What is my balance?", the interest rate on my mortgage is relevant to my overall financial health, but not relevant to the question "What is my balance?" in the conversational context. The slide is between *absolute completeness* (all truths) and *conversational completeness* (all truths relevant to the query).
      *   **Step (6):** Follows from (4) and (5).
      *   **Step (7):** Declining interpretation. Similar to (2), but less critical if (5) falls.
