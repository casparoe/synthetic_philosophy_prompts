      *Step 2: The 20-Minute Triage.*
      *Step 3: The Test Runs.*
      *Step 4: Limitations.*

      *Ready to write.*
answer: |-
  This procedure is designed as a **triage tool**, not a final verdict. Its purpose is to protect the archive from hosting misinformation and hate speech disguised as scholarship. It relies on the methodological distinction between **historical revisionism** (refining understanding of established events using new evidence) and **denialism** (ideologically motivated rejection of established facts using pseudoscience).

  ### Part 1: Definitions for Staff
  *   **Legitimate Revisionism:** Accepts the core historical reality of the event. Seeks to refine details (numbers, dates, specific chains of command) using verifiable, peer-reviewed evidence. Applies skepticism equally to all sources.
  *   **Denialism:** Rejects the core historical reality (existence, intent, or scale) of the event. Uses double standards (hyper-skepticism of victim evidence, uncritical acceptance of perpetrator evidence). Often relies on conspiracy theories regarding the "creation" of the history.

  ---

  ### Part 2: The 20-Minute Triage Procedure

  **Time Limit:** 20 Minutes max per submission.
  **Goal:** Filter obvious denialism; flag complex cases for expert review.

  #### Gate 1: The Core Fact Check (3 Minutes)
  *   **Question:** Does the submission explicitly accept that the mass killing/event occurred as a historical fact?
  *   **Pass:** The author states the event happened and focuses on specific details (e.g., "The massacre occurred, but the toll was X instead of Y").
  *   **Stop/Reject:** The author implies the event was exaggerated, invented, or was a legitimate military necessity that negates its criminal nature.
  *   **Values Call:** If the language is ambiguous (e.g., "We must ask if it happened"), **Refer to Director.** Do not accept ambiguity on core existence.

  #### Gate 2: The Evidence Source Audit (5 Minutes)
  *   **Question:** Are the primary sources cited verifiable, accessible, and contextualized, or are they obscure, anonymous, or known forgeries?
  *   **Pass:** Citations link to established archives, recognized academic journals, or verified government records.
  *   **Stop/Reject:** Sources are from known denialist websites, self-published pamphlets without ISBNs, or documents previously debunked by courts/historians.
  *   **Values Call:** If the source is real but used deceptively (e.g., a genuine document quoted out of context to imply the opposite), **Refer to Director.**

  #### Gate 3: The Skepticism Consistency Test (5 Minutes)
  *   **Question:** Does the author apply the same level of scrutiny to perpetrator records as they do to victim/survivor testimony?
  *   **Pass:** The author acknowledges biases in all sources (including their own) and attempts to corroborate claims.
  *   **Stop/Reject:** The author treats perpetrator documents as absolute truth while dismissing survivor testimony as "hearsay" or "propaganda" without evidence.
  *   **Values Call:** If the methodology is sound but the conclusion contradicts overwhelming consensus without new physical evidence, **Refer to Director.**

  #### Gate 4: The Conspiracy Threshold (4 Minutes)
  *   **Question:** Does the explanation for the "incorrect" history rely on a coordinated conspiracy?
  *   **Pass:** Attributes errors to bureaucratic mistakes, lost records, or wartime chaos.
  *   **Stop/Reject:** Attributes the historical record to a coordinated plot by "Allies," "Zionists," "Communists," or specific nations to defame the perpetrator group.
  *   **Values Call:** If the conspiracy is implied rather than stated (dog whistles), **Refer to Director.**

  #### Gate 5: The Affiliation Check (3 Minutes)
  *   **Question:** Is the author or funding body associated with organizations designated as hate groups or known for denialist activism?
  *   **Pass:** Author is affiliated with academic institutions or independent research with no political agenda.
  *   **Stop/Reject:** Author is linked to known denialist organizations.
  *   **Values Call:** If the affiliation is unclear but the rhetoric matches known group manifestos, **Refer to Director.**

  ---

  ### Part 3: Test Runs

  #### Submission 1: Nanjing Census Re-evaluation
  *   **Content:** Uses newly digitized local census data from 1937 to argue the death toll was 100,000 lower than the current tribunal estimate. Explicitly states the massacre occurred and was a war crime.
  *   **Gate 1 (Core Fact):** **Pass.** Accepts the massacre.
  *   **Gate 2 (Sources):** **Pass.** Uses verifiable census data.
  *   **Gate 3 (Skepticism):** **Pass.** Acknowledges census data may be incomplete.
  *   **Gate 4 (Conspiracy):** **Pass.** Attributes discrepancy to record-keeping chaos, not a plot.
  *   **Gate 5 (Affiliation):** **Pass.** Independent researcher.
  *   **Verdict:** **Accept for Review.** This is legitimate revisionism. It refines a number within the accepted framework.

  #### Submission 2: Armenian Deportation Forgery Claim
  *   **Content:** Claims the deportation orders signed by Ottoman officials are forgeries created by the British after the war. Includes handwriting analysis from a private contractor.
  *   **Gate 1 (Core Fact):** **Fail.** Implies the genocide machinery was fabricated.
  *   **Gate 2 (Sources):** **Fail.** "Private contractor" analysis is not peer-reviewed; contradicts established archival consensus.
  *   **Gate 3 (Skepticism):** **Fail.** Accepts the "forgery" theory without corroborating evidence; dismisses international court findings.
  *   **Gate 4 (Conspiracy):** **Fail.** Relies on the theory that Allies cooked up evidence to punish the Ottomans.
  *   **Verdict:** **Reject.** This is denialism. It attacks the evidentiary basis of the event itself.

  #### Submission 3: Statistical Camp Reanalysis (The "Misfire")
  *   **Content:** A statistical model arguing that camp capacity records prove fewer deaths than recorded. It accepts the camps existed. It uses real data but manipulates variables (e.g., assuming 100% efficiency in cremation rates that historical records prove were impossible). It passes all technical gates.
  *   **Gate 1 (Core Fact):** **Pass.** Admits camps existed.
  *   **Gate 2 (Sources):** **Pass.** Uses official camp records.
  *   **Gate 3 (Skepticism):** **Pass (Technically).** Claims to be purely mathematical.
  *   **Gate 4 (Conspiracy):** **Pass.** Blames "inflation of numbers" on post-war confusion, not a specific group.
  *   **Gate 5 (Affiliation):** **Pass.** No overt hate group link.
  *   **Verdict:** **Refer to Director (Values Call).**
  *   **Why:** This is "soft denialism." It uses the *language* of revisionism to achieve a denialist end (minimizing the scale to the point of negation). The procedure flags this because the *conclusion* contradicts physical evidence (e.g., mass graves, survivor accounts) that the math ignores. A human must recognize that "math" without historical context is pseudoscience here.

  ---

  ### Part 4: Limitations & Misfires

  **1. The "Gaming" Risk**
  Sophisticated denialists know these gates. They will write introductions that accept the "Core Fact" (Gate 1) only to undermine it in the footnotes. Staff must be trained to read the *conclusion* as carefully as the *abstract*.

  **2. The "New Evidence" Trap**
  Denialists often present old, debunked arguments as "newly discovered." Staff cannot verify historical novelty in 20 minutes. If a submission claims to overturn 50 years of consensus with a single document, it must be **Referred**, not Accepted.

  **3. The Values Call Burden**
  Gate 5 and the "Values Call" options place a heavy burden on non-historian staff. They are being asked to judge intent.
  *   *Mitigation:* The archive must maintain a "Do Not Publish" list of known debunked claims and authors. If a submission matches a pattern on that list, it is an automatic **Refer**.

  **4. What This Procedure Cannot Do**
  *   **It cannot verify truth.** It only verifies *methodological integrity*.
  *   **It cannot stop "respectable" denialism.** Some denialist work is published in low-tier journals to gain a veneer of legitimacy. This procedure will let those through to the "Refer" stage, which is why the **Director/Expert Review** step is non-negotiable for anything that passes Gate 1 but feels "off."
  *   **It cannot replace expertise.** This is a sieve, not a vault. It stops the obvious trash so the experts can spend time on the sophisticated distortions.

  **Final Instruction to Staff:**
  "If you finish the 20 minutes and you feel uneasy, even if you checked every 'Pass' box, you must **Refer**. Intuition about bad-faith argumentation is a valid archival tool. It is better to delay a legitimate revisionist paper than to platform a denialist one."
