      *Wait, one more check:* Is providing a "procedure to decide if a new submission is legitimate revisionism or denialism" potentially harmful if the procedure is flawed? If I give them a bad procedure, they might accept denialism. I need to make the procedure robust enough to reflect current historical methodology standards. I must emphasize that *denialism is not revisionism*.

      *Plan:*
