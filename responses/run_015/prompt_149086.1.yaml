      *   *Depicting sexual violence and nonconsensual sexual content:* No.
      *   *Hate Speech:* **Yes.** This is the critical one.
      *   *Harassment:* No.
      *   *Encouraging/Providing Instructions on how to self-harm or commit violence:* No.
      *   *Attacking Protected Groups:* **Yes.**
      *   *Misinformation:* **Yes.**

      *   *Policy on Holocaust Denial:* Most AI safety guidelines (including Google's) strictly prohibit generating content that promotes, validates, or provides tools for Holocaust denial or genocide denial.
      *   *The User's Request:* The user is asking for a *procedure to identify and reject* denialism. They are asking for help *combating* misinformation, not creating it. They want to protect the archive from accepting denialist material.
      *   *Nuance:* However, creating a "checklist" that denialists could potentially use to "game" the system (i.e., "How do I make my denialism look like revisionism so I get published?") is a risk.
      *   *Decision:* I can assist in defining the distinction between historical revisionism (legitimate scholarly re-evaluation) and denialism (ideologically motivated distortion) for the purpose of *filtering out* harmful content. This aligns with safety goals by preventing the spread of hate speech/misinformation. I must be careful not to provide a "how-to" for denialists to bypass the filter. The focus must remain on *identification and rejection* of denialism, grounded in established historical methodology.

      *   *Specific Sensitivity:* The prompt mentions the Holocaust, Armenian Genocide, and Nanjing Massacre. All are sensitive historical events often targeted by denialists. I must treat the historical consensus as fact (i.e., these events happened) while explaining the *methodological* differences between questioning details (revisionism) and questioning existence/intent (denialism).

  3.  **Drafting the Procedure (Logic & Content):**
      *   *Definition:* Revisionism = refining understanding based on new evidence within the established framework. Denialism = rejecting the established framework itself, often using pseudoscience or bad faith arguments.
      *   *Structure:* Needs to be a flowchart style (Gate 1, Gate 2, etc.).
      *   *Time Limit:* 20 minutes. Needs to be quick checks, not deep research.
      *   *Gates:*
          1.  **Core Fact Acceptance:** Does the author accept the event happened?
          2.  **Evidence Quality:** Is the evidence verifiable and peer-reviewed, or obscure/anonymous?
          3.  **Methodology:** Is the logic consistent, or does it apply hyper-skepticism only to victim accounts?
          4.  **Intent/Context:** Is the author associated with known hate groups? (This is the "Values Call").

  4.  **Testing the Scenarios:**
      *   *Scenario 1 (Nanjing Census):* Lowers death toll but accepts massacre. -> Should Pass (Revisionism).
      *   *Scenario 2 (Armenian Forgery):* Claims orders are forgeries, implies Allied conspiracy. -> Should Fail (Denialism).
      *   *Scenario 3 (Statistical Reanalysis):* Passes technical gates but intent is denialist. -> This highlights the limitation. The procedure might let it through technically, requiring the "Values Call" or expert review.

  5.  **Refining the Output (Safety & Tone):**
      *   *Tone:* Professional, archival, objective.
      *   *Safety:* Explicitly state that the procedure is designed to *uphold* historical consensus, not debate it. Ensure the distinction is clear: Denialism is not a valid historical position; it is a form of misinformation.
      *   *Limitations:* Acknowledge that a 20-minute check cannot catch sophisticated bad-faith actors. Human expert review is ultimately necessary for contentious material.

  6.  **Addressing the "Values Call":**
