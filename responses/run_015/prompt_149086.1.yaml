      *   **Requirements:**
          *   Step-by-step gates (Question -> Pass/Fail/Refer).
          *   Grounded in the actual logic of the revisionism/denialism distinction.
          *   No citations needed, just logic.
          *   Test run on three specific scenarios (Nanjing census, Armenian forgery claim, Statistical reanalysis).
          *   Flag misfires and limitations of the procedure.
      *   **Constraint Checklist & Confidence Score:**
