prompt: |-
  I'm a reviewer at a state wetland board, and every quarter I have to sign off on mitigation-bank proposals that include an ecosystem-service valuation model. Every single one has an assumption thats obviously false -- continuous substitutability between nesting habitat and water filtration, or landowners as homogeneous rational agents with perfect information about soil carbon. I want a reusable decision procedure I can actually run in under an hour, grounded in Friedman's F-twist and whatever philosophy of science actually says about unrealistic assumptions: does the false assumption matter for this specific prediction and decision, or not? Give me the ordered steps: the exact question to ask at each point, what counts as a sufficient answer, where the procedure stops with "reject the model for this permit," where it stops with "this is a values call, not mine," and where I still have to make a judgment call despite the checklist. Apply it to three proposals: (1) a model assuming perfect substitutability that predicts flood-control acreage needed; (2) a model with homogeneous rational agents predicting 50-year carbon sequestration, where the result allows development I'd rather block; (3) a model with perfect-info agents predicting restoration success used to justify minimal long-term monitoring. Be explicit about what the procedure cant do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** State wetland board reviewer.
      *   **Task:** Sign off on mitigation-bank proposals quarterly.
      *   **Problem:** Models rely on obviously false assumptions (continuous substitutability, homogeneous rational agents, perfect information).
      *   **Goal:** A reusable decision procedure (under 1 hour) to evaluate if these false assumptions matter.
      *   **Theoretical Grounding:** Milton Friedman's "F-twist" (The Methodology of Positive Economics, 1953) + Philosophy of Science (realism vs. instrumentalism, robustness, sensitivity).
      *   **Output Requirements:** Ordered steps, exact questions, sufficient answers, stop conditions (reject, values call, judgment call), application to three specific cases, explicit limitations of the procedure.

  2.  **Deconstruct the Theoretical Framework:**
      *   **Friedman's F-Twist:** Assumptions *should* be unrealistic. The goal of a theory is prediction, not descriptive accuracy. "The more significant the theory, the more unrealistic the assumptions."
      *   **Critique/Refinement (Philosophy of Science):** Friedman is often criticized (e.g., by Paul Samuelson or Nancy Cartwright). Unrealistic assumptions are okay *only if* they don't drive the specific causal mechanism being relied upon for the decision. Key concepts: *Robustness* (does the result hold if we tweak the assumption?), *Causal Isolation* (is the assumption isolating a specific mechanism?), and *Domain Validity* (does the assumption hold within the relevant range of the decision?).
      *   **Practical Application:** The reviewer needs a "Sensitivity & Salience" test. Does the falsity of the assumption change the *outcome* of the model in a way that affects the *regulatory threshold*?

  3.  **Drafting the Decision Procedure (The "Friedman-Cartwright Filter"):**
      *   *Constraint:* Must be doable in under an hour.
      *   *Structure:* Step-by-step checklist.
      *   *Step 1: Identify the Assumption & The Prediction.* (What are we looking at?)
      *   *Step 2: The Friedman Test (Predictive Success).* (Does the model predict past data well despite the assumption?)
      *   *Step 3: The Cartwright Test (Causal Salience).* (Is the false assumption doing the heavy lifting for *this* specific output?)
      *   *Step 4: The Sensitivity Test (Range).* (If we make the assumption slightly more realistic, does the result cross a regulatory threshold?)
      *   *Step 5: The Values Boundary.* (Is this a scientific error or a policy preference?)

      *Refining the Stop Conditions:*
      *   *Reject:* Assumption drives the result, sensitivity is high, prediction fails.
      *   *Values Call:* The science is ambiguous, but the risk tolerance is a policy choice.
      *   *Judgment Call:* The procedure narrows it down, but human discretion is needed on risk.

  4.  **Developing the Three Case Studies:**

      *   **Case 1: Perfect Substitutability (Nesting vs. Filtration) -> Flood Control.**
          *   *Assumption:* Nesting habitat = Water filtration = Flood control (continuous substitutability).
          *   *Reality:* They are functionally different.
          *   *Test:* Does the model predict flood peaks accurately using this metric?
          *   *Verdict:* Likely Reject. Functional equivalence is physically false, not just behaviorally simplified.

      *   **Case 2: Homogeneous Rational Agents -> 50-Year Carbon.**
          *   *Assumption:* Landowners act rationally with perfect info.
          *   *Reality:* People sell land, change minds, ignore data.
          *   *Context:* Result allows development the reviewer wants to block. (Bias alert).
          *   *Test:* Sensitivity. If landowners are *irrational* (sell to developers), does carbon drop below the offset requirement?
          *   *Verdict:* Values Call / Judgment. The model might be instrumentally okay for *potential* max sequestration, but risky for *guaranteed*.

      *   **Case 3: Perfect Info -> Restoration Success -> Minimal Monitoring.**
          *   *Assumption:* Restorers know exactly what will work.
          *   *Reality:* Ecology is stochastic.
          *   *Impact:* Reduces long-term oversight (cost saving vs. risk).
          *   *Test:* Does the "perfect info" assumption mask the variance in success rates?
          *   *Verdict:* Reject. This ignores the fundamental uncertainty of ecological restoration, violating the precautionary principle inherent in wetland law.

  5.  **Refining the Procedure for Time & Rigor:**
      *   Need to make sure the "Under 1 Hour" constraint is met. The questions need to be sharp.
      *   Need to explicitly address Friedman. Friedman says "Don't worry about realism." The procedure must counterbalance this with "Worry about realism *when it impacts the specific mechanism*."
      *   *Key Distinction:* "Negligible" assumptions (Friedman) vs. "Critical" assumptions (Cartwright/Mäki).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the tension. Friedman vs. Regulatory Precaution.
      *   *The Procedure:* Name it something catchy but professional. "The Salience & Sensitivity Protocol (SSP)."
      *   *Steps:*
          1.  Isolate the Assumption.
          2.  Check Predictive Track Record (Friedman).
          3.  Check Causal Mechanism (Cartwright).
          4.  Threshold Sensitivity (Regulatory).
          5.  Risk Allocation (Values).
      *   *Case Applications:* Walk through the SSP for each.
      *   *Limitations:* What can't this do? (It can't fix bad data, it can't override statute, it can't remove personal bias).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Simplify the language. Instead of "epistemic opacity," use "can you see how the math works?"
      *   *Critique:* Did I address the "Values Call" properly?
      *   *Fix:* Make sure Step 5 clearly delineates when science ends and policy begins.
      *   *Critique:* Case 2 involves the reviewer admitting they "want to block" development.
      *   *Fix:* Address this bias explicitly in the procedure. The procedure must guard against using science as a pretext for policy preferences.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Reusable decision procedure? Yes.
      *   Under 1 hour? Yes (designed for speed).
      *   Grounded in Friedman/Phil Sci? Yes.
      *   Ordered steps with exact questions? Yes.
      *   Stop conditions defined? Yes.
      *   Apply to 3 proposals? Yes.
      *   Explicit limitations? Yes.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic tension in regulatory science: **Instrumentalism (Friedman)** vs. **Realism (Cartwright/Mäki)**. Friedman argues assumptions *should* be unrealistic if they yield accurate predictions. Philosophers of science counter that assumptions are only acceptable if they are *negligible* or *isolating*, not if they are *critical* to the causal mechanism being regulated.

  As a regulator, you are not just testing truth; you are testing **risk allocation**. If a false assumption shifts risk from the developer to the public ecosystem, it fails.

  Here is the **Salience & Sensitivity Protocol (SSP)**. It is designed to be run in 45–60 minutes per proposal.

  ---

  ### The Salience & Sensitivity Protocol (SSP)

  **Time Limit:** 60 Minutes
  **Goal:** Determine if an unrealistic assumption invalidates the model *for this specific regulatory decision*.

  #### Step 1: Isolate the Mechanism (10 mins)
  *   **Question:** What specific causal link in the model relies on the false assumption to generate the output number?
  *   **Sufficient Answer:** A one-sentence description of the math/logic. (e.g., "The model converts nesting acres to filtration acres using a 1:1 ratio coefficient.")
  *   **Stop Condition:** If you cannot identify the link, **Reject**. You cannot approve a black box.

  #### Step 2: The Friedman Predictive Test (15 mins)
  *   **Question:** Has this specific model structure (with this assumption) successfully predicted outcomes in *similar* past contexts (same region, same ecosystem type)?
  *   **Sufficient Answer:** Citations of 1–2 prior validated studies or historical data comparisons showing the model's output matches observed reality within a 10% margin.
  *   **Stop Condition:** If the model has no track record *and* the assumption is physically impossible (e.g., substituting distinct ecological functions), **Reject**. Friedman allows unrealistic assumptions, but not *disconfirmed* predictions.

  #### Step 3: The Cartwright Salience Test (15 mins)
  *   **Question:** If we make the assumption *more realistic* (e.g., agents have imperfect info, habitats are not substitutable), does the underlying causal mechanism break, or does it just add noise?
  *   **Sufficient Answer:** A qualitative assessment. (e.g., "Imperfect info adds variance to the timeline, but doesn't change total carbon capacity" vs. "Non-substitutability means the function physically cannot occur.")
  *   **Stop Condition:** If the assumption is **constitutive** (the mechanism *requires* the falsehood to work), **Reject**. (e.g., You cannot filter water with a bird nest, no matter the math).

  #### Step 4: Regulatory Threshold Sensitivity (10 mins)
  *   **Question:** If the model output shifts by a conservative error margin (e.g., 20%) due to the false assumption, does it cross a regulatory "bright line" (permit approval/denial, monitoring duration, bond amount)?
  *   **Sufficient Answer:** Yes/No.
  *   **Stop Condition:**
      *   **No:** The assumption is "negligible." **Approve** (with standard caveats).
      *   **Yes:** Proceed to Step 5.

  #### Step 5: Risk Allocation & Values Boundary (10 mins)
  *   **Question:** Who bears the cost if the assumption proves false? (The public/ecosystem or the permit holder?)
  *   **Sufficient Answer:** Clear identification of liability.
  *   **Decision Logic:**
      *   If **Public/Ecosystem bears cost**: **Reject** (unless statute mandates otherwise).
      *   If **Permit Holder bears cost** (e.g., via performance bonds): **Values Call**. The science is uncertain, but the financial risk is mitigated.
      *   If **Ambiguous**: **Judgment Call**. You must weigh the precautionary principle against economic burden.

  ---

  ### Application to Your Three Proposals

  #### Case 1: Perfect Substitutability (Nesting vs. Filtration) predicting Flood Control
  *   **Step 1 (Mechanism):** The model treats "wetland acres" as a homogeneous currency. It assumes an acre of nesting marsh provides the same hydraulic resistance as an acre of open water filtration.
  *   **Step 2 (Friedman):** **Fail.** Hydrological models generally distinguish vegetation density. Past data likely shows nesting marshes clog or drain differently than filtration zones.
  *   **Step 3 (Salience):** **Critical Failure.** Vegetation structure *is* the mechanism for flood control. Assuming substitutability removes the physical cause of the prediction.
  *   **Step 4 (Sensitivity):** **Crosses Threshold.** If nesting marshes provide 50% less hydraulic resistance, the flood control target is missed.
  *   **Step 5 (Risk):** Public bears flood risk.
  *   **SSP Verdict:** **REJECT THE MODEL FOR THIS PERMIT.**
      *   *Reasoning:* This violates Step 3. The assumption isn't just a simplification; it deletes the physical variable (vegetation structure) that causes the effect (flood mitigation). It is a category error, not an instrumental simplification.

  #### Case 2: Homogeneous Rational Agents predicting 50-Year Carbon (Allows Development)
  *   **Step 1 (Mechanism):** The model assumes landowners will maintain carbon practices for 50 years because it is economically "rational."
  *   **Step 2 (Friedman):** **Mixed.** Economic models often fail over 50-year horizons due to market shifts, but may work for 5–10 years.
  *   **Step 3 (Salience):** **Negligible to Moderate.** Human behavior is the variable, but the *biological* capacity for carbon sequestration remains even if ownership changes. However, management practices might change.
  *   **Step 4 (Sensitivity):** **Crosses Threshold.** If 20% of landowners sell to developers in year 10, total sequestration drops below the offset required for the new development.
  *   **Step 5 (Risk):** Public bears carbon loss; Developer gains profit.
  *   **SSP Verdict:** **VALUES CALL (With Conditions).**
      *   *Reasoning:* The science (carbon biology) is sound; the social science (human behavior) is the weak link. You noted you "want to block" the development. The SSP flags this: do not use the model's weakness as a pretext for policy preference *unless* you shift the risk.
      *   *Action:* Do not reject the permit based on the model alone. Instead, require a **Performance Bond** or **Legal Covenant** that covers the carbon loss if the "rational agent" sells. This shifts the risk back to the permit holder (Step 5), satisfying the protocol.

  #### Case 3: Perfect-Info Agents predicting Restoration Success (Justifies Minimal Monitoring)
  *   **Step 1 (Mechanism):** The model assumes restoration practitioners know exactly which species/soil mix will succeed, eliminating the need for adaptive management.
  *   **Step 2 (Friedman):** **Fail.** Ecological restoration has a high failure rate historically. Predictive success is low.
  *   **Step 3 (Salience):** **Critical Failure.** Ecological stochasticity (randomness) is a fundamental feature of the system. Assuming perfect information removes the uncertainty that monitoring is designed to catch.
  *   **Step 4 (Sensitivity):** **Crosses Threshold.** If success rates drop from 90% (model) to 60% (reality), the mitigation bank fails to replace lost wetland function.
  *   **Step 5 (Risk):** Public bears ecosystem loss; Banker saves monitoring costs.
  *   **SSP Verdict:** **REJECT THE MODEL FOR THIS PERMIT.**
      *   *Reasoning:* This violates Step 5. The false assumption is being used specifically to reduce oversight. In regulatory contexts involving irreversible environmental loss, assumptions that reduce monitoring must be treated as high-risk. The "perfect info" assumption shifts the risk of ecological failure to the public.

  ---

  ### What This Procedure Cannot Do

  Be explicit about these limitations in your internal notes to protect yourself from appeal:

  1.  **It Cannot Cure Bad Data:** If the input data (soil samples, hydrological logs) is corrupted, the SSP will still pass a model that is structurally sound but empirically garbage. You need a separate data-quality checklist.
  2.  **It Cannot Override Statute:** If state law *mandates* acceptance of a specific modeling standard (e.g., "The State shall accept the HGM Model"), the SSP can recommend rejection, but you may be legally overruled. In that case, the SSP serves as your documentation for *why* you recommend additional bonding/conditions.
  3.  **It Cannot Remove Your Bias:** In Case 2, the SSP forces you to acknowledge if you are blocking development because of the *science* or because of *policy preference*. It cannot stop you from conflating the two, but it forces you to articulate the risk allocation instead of hiding behind "the model is wrong."
  4.  **It Is Not a Substitute for Peer Review:** This is a regulatory triage tool, not a scientific audit. If a model passes the SSP but looks suspicious, you still have the authority to commission external review.

  ### Summary of Decision Logic

  | Step | Key Question | If "No/Fail" | If "Yes/Pass" |
  | :--- | :--- | :--- | :--- |
  | **1** | Can you isolate the mechanism? | **REJECT** (Black Box) | Proceed |
  | **2** | Does it predict past data? | **REJECT** (If assumption is physical) | Proceed |
  | **3** | Is the assumption constitutive? | **REJECT** (Mechanism Broken) | Proceed |
  | **4** | Does error cross regulatory line? | **APPROVE** (Negligible) | Proceed |
  | **5** | Does public bear the risk? | **REJECT** (Unacceptable Risk) | **VALUES CALL** (Add Bonds/Conditions) |

  **Final Advice:** Use the SSP to move the conversation from "This assumption is false" (which developers will argue is irrelevant per Friedman) to "This assumption shifts risk to the public" (which is a regulatory mandate you can enforce).
