answer: |-
  "He's saving Malthus from the graveyard," Daniel said, swirling the last of the workshop wine. "By burying him in the future."

  Priya leaned against the table. "He's correcting the timeline, not the mechanism. Malthus described a real feedback loop. The fact that it didn't bite for two centuries doesn't make it false; it makes it conditional. We had a one-off resource windfall—fossil fuels. That's timing, not truth."

  "‘Right but early' is the ultimate immunizing stratagem," Daniel countered. "It converts a failed prediction into one that cannot fail. Any run of years where population outstrips subsistence is simply redescribed as the period *before* the windfall ends. It renders the theory unfalsifiable."

  "Delay isn't automatically rescue," Daniel conceded, seeing Priya's brow furrow. "I grant that a theory can be genuinely conditional on a state of the world that hasn't arrived. But Lakatos taught us the test: does this defense absorb the anomaly by predicting something new, or merely by relabeling the failure? If it's just relabeling, it's a degenerating problem shift."

  Priya nodded. "I concede that in practice, most ‘right but early' claims are made post hoc, after the failure. That's the source of your suspicion. So, let's write a prematurity protocol. If a model wants to claim it's merely early, it must satisfy three clauses."

  "Agreed," Daniel said, pulling out a notebook. "First, indexation. No ‘someday.' The defender must name a measurable regime variable and the threshold at which the prediction bites."

  "Precisely," Priya said. "For this demographer, it's not ‘when fossil fuels run out,' but ‘when the energy cost of synthetic nitrogen exceeds X kilojoules per calorie produced.' If they can't specify the trigger, they've said nothing."

  "Second, a residue test," Daniel proposed. "A mechanism that is real but currently masked should still be detectable where the mask is locally absent. Subsistence farmers, island populations, laboratory microcosms."

  Priya hesitated. "This is where you'll push hard. You'll argue that confirming the mechanism in closed subsystems doesn't support a claim about the global aggregate."

  "Exactly," Daniel said. "Showing Malthusian traps exist in isolated villages proves the mechanism exists *somewhere*, not that it drives the *whole*. Does a microcosm validate a global macro-model? Or does it just show that without technology, humans starve? We already know that."

  "It shows the mechanism is universal, not contingent," Priya insisted. "If the feedback loop is broken globally, it should be broken locally too. If it persists locally, the global pause is indeed a mask."

  "Third, a sunset clause," Daniel said, moving on. "A date or index value at which the claim is retired if the trigger has not fired. And an explicit statement of what observation would retire it earlier."

  "If the energy cost threshold is passed without population collapse, the model is dead," Priya added. "No moving the goalposts."

  They sat back. "Apply it," Daniel said. "The demographer's model."

  Priya thought for a moment. "It passes. Indexation is clear: fertilizer cost per calorie. Residue is visible in subsistence economies where population still tracks yield. Sunset is set at 2080 or when renewable energy substitutes fully for fossil inputs."

  "I say it fails," Daniel replied. "It passes indexation and sunset, but fails the residue test. Confirming Malthusian dynamics in unconnected villages doesn't prove they will reassert globally. Global trade and technology transfer might permanently decouple the aggregate variables. The residue test confirms the mechanism's existence, not its dominance."

  Priya sighed. "So, for you, the local data is irrelevant to the global claim?"

  "Only irrelevant to the claim of inevitability," Daniel said. "What would move me to your verdict? If the model predicted a specific, novel demographic shift in those subsistence populations *before* the global trigger—something we didn't already know—and that prediction was confirmed. That would show the mechanism is gaining traction, not just existing."

  "And for me?" Priya asked. "What moves me to yours?"

  "If we observed a sustained decoupling in those residue populations," Priya said. "If subsistence farmers adopted low-energy techniques that broke the feedback loop without fossil inputs. That would prove the mechanism isn't universal, just historical. Then I'd agree the model is dead, not early."

  Daniel closed his notebook. "So we agree on the protocol, but disagree on the weight of the evidence."

  "We agree on how to test," Priya said. "We just disagree on what the test proves."
