      *   *Key Themes:* Personal identity, location of the self, intuition pumps, the Center of Narrative Gravity.
      *   *Dennett's Stance:* He is notoriously elusive. He doesn't straightforwardly argue "I am my brain." He explores the *confusion* involved in the question. He often suggests the question "Where am I?" might not have a determinate answer in such sci-fi cases. He leans towards a view that the "self" is a construct (Center of Narrative Gravity), not a concrete thing located in space.
      *   *Psychological Continuity:* Dennett is generally sympathetic to psychological criteria (Lockean), though he complicates them. He doesn't usually use this story to *refute* psychological continuity in favor of a biological/brain criterion. In fact, the story often highlights the *ambiguity* when psychological and physical criteria diverge.
      *   *Eliminativism:* Dennett is an eliminativist about the *Cartesian Theater* and the homunculus, but regarding personal identity, he's more of a fictionalist or deflationist (Center of Narrative Gravity). Saying "there is no fact of the matter" is close, but calling it "eliminativist" in the sense of "the self is a useless fiction" needs nuance. He thinks the self is a *useful* fiction.
      *   *Blame/Responsibility:* If the body acts without the brain's control, does the brain bear responsibility? Dennett would likely say no, or that the question of responsibility tracks the causal chain, not just the "location" of the person.

