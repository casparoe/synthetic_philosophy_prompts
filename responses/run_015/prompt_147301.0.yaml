      *   *Refining the Argument:*
          *   Need to be careful about "eliminativism." Dennett is an eliminative materialist regarding qualia and the Cartesian Theater, but regarding personal identity, he prefers "Center of Narrative Gravity." The handout says "self is a useful fiction." That is actually very Dennettian. The error is linking that to the brain criterion. If the self is a fiction, then "I am my brain" is also a simplification. The handout contradicts itself slightly by saying "We are our brains" (realist about brain identity) AND "Self is a useful fiction" (anti-realist about self).
          *   Need to highlight that the handout treats the story as an *argument* for a brain criterion, whereas Dennett treats it as an *intuition pump* to show the indeterminacy.
          *   The psychological continuity point: The handout says the story refutes psychological continuity because the person in the vat and body come apart in memory. But if the brain is in the vat, the psychology is in the vat. The body is just a shell. So psychological continuity *supports* the vat location. The handout claims this refutes psychological continuity. This is confused. The handout seems to think psychological continuity requires the body to remember what the brain experiences. If the link breaks, the body doesn't remember. So the "person" in the body has no psychological continuity with the past. So the person is in the vat. This *supports* psychological continuity (linked to the brain). The handout says it *refutes* it. This is a significant error.
