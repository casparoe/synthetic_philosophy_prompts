answer: |-
  Here is a structural plan for the lecture, designed to navigate the specific epistemic traps you identified.

  ### 1. The Opening: Withhold the Thesis
  **Decision:** Do **not** write the strong claim ("Categorization is Analogizing") on the board at minute zero.

  **Reasoning:** You correctly identified the bifurcation risk. If stated early, the ML-trained mind maps "analogy" to *transfer learning* or *few-shot prompting* (trivial), or it maps "categorization" to *decision boundaries* (obviously false, as boundaries are static). You need them to feel the *instability* of a category before you name the mechanism stabilizing it.

  **Dependency Structure:**
  To state the strong claim without it collapsing into triviality or falsehood, three prerequisites must be on the board:
  1.  **The Failure of Features:** A demonstration that no fixed set of surface features defines a category (e.g., a "cup" can be made of paper, have no handle, be waist-high).
  2.  **The Relational Core:** A demonstration that what persists across category members is a *role* or *relation*, not a property.
  3.  **The Unconscious Speed:** Evidence that this mapping happens faster than deliberate reasoning (defusing the "deliberate comparison" objection).

  **The Sequence:**
  *   **Minute 0–5:** Start with a blank board. Ask: *"When you see a stool, a beanbag, and a tree stump, and you sit on all three, what computational operation just occurred?"*
  *   **Minute 5–10:** Elicit "Classification." Challenge it. *"What is the feature vector for 'chair'? Is it 'has legs'? (Beanbag says no). Is it 'for sitting'? (Bed says yes, but isn't a chair)."*
  *   **Minute 10:** **Now** you can introduce the thesis. The board finally gets the equation: **Categorization = Analogical Mapping.** It lands not as a philosophical assertion, but as the only remaining solution to the "Chair Problem."

  ### 2. The Carrying Example
  **Critique of your Constraint List:**
  Your list is strong, but needs one addition: **The example must resist feature-based decomposition.** If a student can write a regex or a simple decision tree to capture the category, the example fails.
  **GUI Evaluation:** You are correct to reject the Desktop/Folder example.
  *   *Why it fails:* It is an *explicit* design metaphor. Students will categorize it as "UI/UX convention," which allows them to compartmentalize it as "language about the machine" rather than "thinking about the world." It reinforces the idea that analogy is a *layer* on top of literal processing, rather than the *substrate*.
  *   *Why it fails your constraints:* The contrast between what travels and what stays is not visible in a single sentence without invoking file system architecture (external fact-check).

  **Selected Example: "The Leg of the Table"**
  *   **Why:** It is lexicalized (invisible), load-bearing (you cannot describe the object without it), and requires no external knowledge.
  *   **The Sentence:** *"The table leg supports the weight, but it does not walk."*
  *   **What Travels (Surface/Role):** Protrusion, bottom location, structural support.
  *   **What Stays Behind (Essence/Exclusion):** Locomotion, biology, sensation.
  *   **Why it works:** It forces the "Surface vs. Essence" distinction immediately. If categorization were just feature matching (ML style), "leg" should imply "walks." If it were rule-based, the rule would break on "table." The only way to resolve it is analogical mapping: *This object plays the 'leg role' in the 'table schema'.*

  ### 3. Misconceptions: Sequence and Defusal
  You must sequence these to match the cognitive oscillation you experienced ("Of course" $\to$ "Surely not" $\to$ "Ah").

  1.  **"Analogy is deliberate comparison."**
      *   **When:** Minute 10 (Immediately after the Thesis).
      *   **Why:** If you don't kill this first, they will wait for a "reasoning step" that never comes.
      *   **Defusal:** Point to the "Leg" example. *"Did you consciously compare the table to a human when you learned the word 'leg'? No. The analogy was the *condition of learning*, not the result of it."*

  2.  **"Rules vs. Analogy." (Missing Misconception 1)**
      *   **When:** Minute 15.
      *   **Why:** CS students love rules. They will argue, *"Can't we just write a rule: IF supports_weight AND protrudes THEN leg?"*
      *   **Defusal:** Show the boundary case. *"A pedestal table has one central support. Is it a leg? Yes. A table hanging from the ceiling by cables. Are the cables legs? No."* Rules require categories; categories require analogy. Analogy is prior to rules.

  3.  **"This is just Nearest-Neighbor in Vector Space." (ML Objection)**
      *   **When:** Minute 25 (After Surfaces/Essences are defined).
      *   **Why:** This is their home turf. If you address it too early, you get bogged down in math. If too late, they assume you're ignoring their background.
      *   **Defusal:** Draw two vectors. *"In your ML course, distance is statistical co-occurrence. In S&E, distance is *structural alignment*."*
      *   **The Killer Point:** *"In vector space, 'King' is close to 'Queen'. In analogy, 'King' maps to 'Queen' only if the relation 'Monarch' is active. If the relation is 'Chess Piece', 'King' maps to 'Rook'. Vector space is static; analogy is context-sensitive slippage."*

  4.  **"Category Collapse." (Anything belongs anywhere)**
      *   **When:** Minute 30.
      *   **Why:** Once they accept "everything is analogy," they fear chaos. *"If a table is a leg, is a leg a table?"*
      *   **Defusal:** This requires the **Surfaces/Essences** distinction to be fully on the board. *"Analogy is constrained by Essence. We map the 'support' role (Essence), not the 'flesh' property (Surface). The Essence acts as the type signature."*

  5.  **"LLMs already do this."**
      *   **When:** Minute 35 (Pre-Ending).
      *   **Why:** They will assume the thesis is obsolete tech.
      *   **Defusal:** *"LLMs predict tokens based on surface statistics. S&E claims thinking is the *construction* of the essence that allows the token to be chosen. The LLM simulates the output; it does not necessarily perform the structural mapping."* (Keep this brief; see Refusals).

  6.  **"Is this a claim about Neural Machinery?" (Missing Misconception 2)**
      *   **When:** Minute 40 (Explicit Refusal).
      *   **Why:** They will want to know if this means "symbolic" or "connectionist."
      *   **Defusal:** Explicitly state this is a *functional* claim, not an implementation claim.

  ### 4. The Ending: The Coinage Threshold
  **Placement:** Minute 35–45.
  **Dependency:** This *must* come last. It relies on the tension between the *stretch* of analogy (categorization) and the *snap* of essence (limits). If opened with, it looks like etymology trivia.
  **Reframe:** It reframes the thesis from "How we think" to "How language evolves under cognitive pressure." It shows the thesis has predictive power over cultural artifacts.

  **Example:** **"Mail" vs. "Podcast."**
  *   **Mail:** Stretched to "Email." Why? The *essence* (asynchronous, addressed, text-based message) held. The surface (paper, truck) slipped.
  *   **Broadcast:** Did *not* stretch to "On-demand audio." We coined "Podcast" or "Stream." Why? The *essence* of broadcast is *simultaneity* (one-to-many, same time). On-demand breaks the essence.
  *   **Board Work:** Draw a spectrum. [Mail] ----(Stretch)----> [Email]. [Broadcast] --(SNAP)--X [On-Demand].
  *   **Point:** Language coins new words exactly when the analogical mapping violates the Essence.

  ### 5. Assessment: The Transfer Task
  **Task:** *"Is treating a Chatbot as a 'Friend' an analogical extension of Friend, or a change in what the word picks out?"*

  **Correct Answer (Demonstrates Understanding):**
  Identifies the *Essence* being tested.
  *"It is an analogical extension if we map the 'conversational reciprocity' role while suppressing the 'internal state/obligation' role. It becomes a new category if we decide 'internal state' is no longer part of the Essence of Friend."*
  *Key:* They must identify *which* features are Surface (chat flow) and which are Essence (mutual care/consciousness) and note the tension.

  **Merely Fluent Answer:**
  *"It's not a real friend because it's code."* OR *"It is a friend if it helps you."*
  *Key:* These rely on intuition or definition, not structural mapping. They miss the *slippage*.

  **What the Probe Misses:**
  It cannot tell you if they understand the *mechanism* of the slippage (how the mind suppresses the "no soul" feature). It only tests if they see the boundary.

  ### 6. Refusals and Cuts
  **Explicit Refusals (Announce at Minute 40):**
  1.  **Neural Implementation:** *"I will not answer whether this happens in the basal ganglia or cortex. S&E is a cognitive architecture claim, not a wetware claim."*
  2.  **Deep Learning Vindication:** *"I will not answer if Backpropagation achieves this. Statistics $\neq$ Structure. That is a research question, not a lecture topic."*
  *Why:* These are black holes. CS students will eat 20 minutes on "But what about Transformers?" You must protect the cognitive argument.

  **The Cut:**
  **The "Copycat" Domain (Letter Strings).**
  *   *Why:* It is Hofstadter's favorite micro-world (e.g., *abc* $\to$ *abd*, therefore *ijk* $\to$ ?).
  *   *Reason to Cut:* It takes 10 minutes to explain the rules of the micro-world alone. For CS students, it looks like a puzzle, not cognition. The "Leg of the Table" and "Mail/Broadcast" examples carry the same logical weight without the overhead. Sacrifice your favorite puzzle to save the thesis.

  ### Whiteboard Layout Plan
  *   **Left Panel:** The "Chair Problem" (Feature failure).
  *   **Center Panel:** The Thesis Equation (**Categorization = Analogy**) + Surface vs. Essence (Venn diagram).
  *   **Right Panel:** The Coinage Threshold (Mail vs. Broadcast spectrum).
  *   **Bottom Strip:** "Refusals: Neural Impl | DL Verdict".

  This structure forces them to build the definition of "Analogy" themselves before you name it, preventing the "trivial/obvious" dismissal, and leverages their CS background (rules/vectors) as foils rather than ignoring them.
