prompt: |-
  I've been working through some debates about evolutionary debunking arguments in metaethics, particularly after following long threads on rationalist forums about whether knowing that our moral judgments have evolutionary origins should push us toward moral anti-realism. Rather than taking the standard for-or-against line, I want to defend a somewhat heterodox intermediate position: that debunking arguments fail because they tacitly presuppose a false dichotomy between being causally shaped by natural selection and being genuinely responsive to normative truth, but that this failure only actually rehabilitates moral realism if moral cognition relies on domain-general reasoning mechanisms rather than on specialized, modular heuristics. On this view, evolutionary origin is not automatically debunking, but neither is it automatically harmless—the epistemic damage depends specifically on the underlying cognitive architecture.

  Please argue for this position in detail. First, explain why the selection-versus-truth-tracking dichotomy is mistaken, using the analogy of arithmetic intuition: if approximate number sense is also shaped by evolutionary pressures for quantity tracking, should we therefore become arithmetic anti-realists? Use that parallel to show that evolutionary explanation alone does not undermine a domain. Next, defend the claim that moral realism is rehabilitated only under the domain-general mechanism condition, and address the objection that even domain-general reasoning could be systematically miscalibrated by evolutionary pressures for cooperation or status management. Finally, apply the framework to one concrete judgment: the widespread cross-cultural conviction that causing unnecessary suffering is wrong. Is this best explained by a domain-general principle of consistency, or by a domain-specific harm-avoidance module? And what does your answer imply about whether evolutionary debunking succeeds in that particular case? Please write in American English, keep the tone formal but accessible to a philosophy-literate audience, and avoid bibliographies, reading lists, or specific citations—I am evaluating the conceptual architecture, not the scholarly coverage.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Topic:** Evolutionary Debunking Arguments (EDAs) in metaethics.
      *   **Position to Defend:** A heterodox intermediate position.
          *   Claim 1: The standard dichotomy (causally shaped by evolution vs. responsive to normative truth) is false.
          *   Claim 2: Moral realism is rehabilitated *only if* moral cognition relies on domain-general reasoning mechanisms (not specialized modular heuristics).
          *   Claim 3: Evolutionary origin isn't automatically debunking, but isn't automatically harmless either; it depends on cognitive architecture.
      *   **Required Elements:**
          *   Explain the false dichotomy using the arithmetic intuition/approximate number sense analogy.
          *   Defend the claim that realism requires domain-general mechanisms.
          *   Address the objection that domain-general reasoning could still be miscalibrated (cooperation/status).
          *   Apply the framework to a concrete judgment: "causing unnecessary suffering is wrong."
          *   Determine if this is domain-general (consistency) or domain-specific (harm-avoidance).
          *   Conclude on whether EDAs succeed in this specific case based on that determination.
      *   **Tone/Style:** American English, formal but accessible to philosophy-literate audience, no citations/bibliographies.

  2.  **Deconstruct the Argument Structure:**

      *   **Introduction:** Set the stage (EDAs), state the thesis (the intermediate architectural view), and outline the path.
      *   **Section 1: The False Dichotomy (The Arithmetic Analogy).**
          *   Standard EDA: Evolution shaped beliefs for fitness, not truth $\rightarrow$ beliefs unjustified.
          *   Counter: Fitness and truth can overlap.
          *   Analogy: Approximate Number System (ANS). Evolved for survival (tracking predators/food), yet grounds arithmetic realism. We don't become arithmetic anti-realists just because ANS is evolved.
          *   Lesson: Causal origin $\neq$ epistemic defeater *per se*.
      *   **Section 2: The Architectural Condition (Domain-General vs. Domain-Specific).**
          *   Why does the arithmetic case work? Because we can reflect on numbers using general logic/math, not just instinct.
          *   Thesis: Realism holds if we use domain-general reasoning to refine/validate intuitions.
          *   If morality is just modular heuristics (e.g., "disgust = wrong"), realism is in trouble (no truth-tracking, just firing patterns).
          *   If morality uses general reasoning (e.g., "what if everyone did that?"), it can track truth independent of specific evolutionary pressures.
      *   **Section 3: Addressing the Objection (Miscalibrated General Reasoning).**
          *   Objection: Even general reasoning is tuned for social cohesion, not truth.
          *   Response: Distinguish between *capacity* and *output*. The capacity might be evolved, but the logical constraints (non-contradiction, impartiality) are not fitness-tracking; they are truth-tracking. Evolution gave us the engine, but logic provides the rails.
      *   **Section 4: Application (Unnecessary Suffering).**
          *   Case: "Causing unnecessary suffering is wrong."
          *   Analysis: Is this a module (pain-aversion) or a principle (consistency/impartiality)?
          *   Argument: It looks modular at the gut level (empathy), but the *normative force* comes from general reasoning (why is *unnecessary* key? Because of a consistency principle regarding interests).
          *   Verdict: If it's mostly modular, EDA bites. If it's grounded in general reasoning about interests, EDA fails.
          *   Nuanced Conclusion: It's likely a hybrid. The *intuition* is modular (vulnerable), but the *justification* is general (resilient). Therefore, EDA succeeds against the intuition but fails against the refined principle.
      *   **Conclusion:** Summarize the architectural dependency. The fate of realism hangs on cognitive science, not just metaphysics.

  3.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Need to sound sophisticated. Use terms like "genealogy," "epistemic defeater," "cognitive architecture."
      *   *Arithmetic:* Make sure the link between ANS and formal arithmetic is clear. The evolved part is the rough estimate; the realist part is the formal system built on top of it. Same for morality?
      *   *Architecture:* This is the core innovation. Distinguish between "heuristics" (fast, frugal, specific) and "reasoning" (slow, general, abstract). If morality is just heuristics, it's like taste preferences. If it's reasoning, it's like logic.
      *   *Objection:* The skeptic says "Reasoning is just a tool for argumentation to win status." I need to counter that logical validity isn't status-dependent.
      *   *Application:* "Unnecessary suffering." The word "unnecessary" is the tell. A module says "Pain bad." A reasoner says "Pain bad *unless* justified." The justification requires general reasoning.
      *   *Tone Check:* Avoid "I think." Use "This view holds," "One might object." Keep it American English (e.g., "defense" not "defence"). No footnotes.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the distinction between domain-general and domain-specific sharp enough?
      *   *Fix:* Acknowledge they interact. The claim is about the *justificatory basis*. If the final warrant relies on the module, it's vulnerable. If it relies on general reasoning correcting the module, it's safe.
      *   *Critique:* Is the arithmetic analogy strong?
      *   *Fix:* Ensure I emphasize that we don't trust the ANS for complex math; we trust the formal system. Similarly, we shouldn't trust moral *gut feelings* alone, but the reasoned principles.
      *   *Critique:* The prompt asks to argue *for* the position. I need to be persuasive, not just descriptive.
      *   *Fix:* Use strong connective tissue. "Consequently," "It follows that," "The crucial distinction lies here."

  5.  **Final Polish:**
      *   Check constraints: No citations. Formal but accessible. American English.
      *   Check specific prompt requirements: Arithmetic analogy included? Yes. Domain-general condition defended? Yes. Objection addressed? Yes. Suffering case applied? Yes.
      *   Word count check: Needs to be substantial enough to cover "in detail."

  6.  **Final Review against the "Heterodox Intermediate Position":**
      *   Does it avoid standard realism/anti-realism? Yes, it makes realism contingent on cognitive science.
      *   Does it reject the dichotomy? Yes, via the arithmetic analogy.
      *   Does it hinge on architecture? Yes, that's the main thesis.

