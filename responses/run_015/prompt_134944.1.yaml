answer: |-
  Evolutionary debunking arguments have become a central fixture in contemporary metaethics, posing a formidable challenge to moral realism. The core contention is straightforward: if our moral beliefs are the product of natural selection, and natural selection tracks reproductive fitness rather than normative truth, then we lack epistemic justification for holding those beliefs. Standard responses typically dig in on one side of a trench. Realists argue that fitness and truth can coincide, while anti-realists argue that the genealogy of our morals exhausts their explanation. However, both sides often accept a tacit premise that creates a false dilemma: that a cognitive trait is either causally shaped by evolution or responsive to normative truth, as if these were mutually exclusive categories.

  A more promising approach lies in a heterodox intermediate position. This view holds that evolutionary debunking arguments fail because they rely on that false dichotomy, yet moral realism is not automatically secured by exposing the dichotomy. Instead, the epistemic status of moral judgments depends critically on the underlying cognitive architecture. Specifically, moral realism is rehabilitated only if moral cognition relies substantially on domain-general reasoning mechanisms rather than specialized, modular heuristics. On this view, evolutionary origin is not an automatic defeater, but neither is it harmless; the damage depends on whether the mind is using a flexible, truth-seeking engine or a rigid, fitness-tuned shortcut.

  To understand why the standard dichotomy is mistaken, consider the analogy of arithmetic intuition. Humans possess an approximate number system, a cognitive mechanism that allows us to estimate quantities without counting. This system is undeniably shaped by evolutionary pressures; tracking predators, food sources, and coalition sizes conferred a survival advantage. If the logic of evolutionary debunking arguments were applied consistently, we should become arithmetic anti-realists. We would have to conclude that because our number sense was selected for fitness, it cannot track mathematical truth. We should doubt that $2 + 2 = 4$ because believing it helped our ancestors survive, not because it is objectively true.

  Yet, almost no one adopts arithmetic anti-realism on these grounds. We recognize that while the *capacity* for numerical cognition has evolutionary origins, the *truth* of mathematical propositions does not depend on those origins. The evolutionary explanation of the faculty does not undermine the validity of the domain. The reason is that the relationship between selection and truth is not zero-sum. In the case of arithmetic, evolutionary pressures for quantity tracking align sufficiently with mathematical reality to allow the development of formal systems that transcend the initial biological constraints. We can reflect on our intuitions, correct errors, and derive proofs that hold independently of fitness. If evolutionary explanation alone undermined a domain, mathematics would collapse alongside morality. Since mathematics stands, the mere fact of evolutionary shaping cannot be a sufficient defeater for moral realism.

  However, acknowledging that evolutionary origins are not automatically debunking does not grant moral realism a free pass. The arithmetic analogy works because human mathematical cognition quickly transcends the approximate number system through the use of domain-general reasoning. We do not rely solely on gut feelings about quantity; we use logic, symbolism, and consistent rules. This points to the crucial architectural condition: moral realism is secure only if moral cognition operates similarly. If moral judgments are the output of specialized, modular heuristics—fast, frugal, and encapsulated responses to specific social stimuli—then the debunking argument retains its force. Modular heuristics are designed to solve specific adaptive problems, such as detecting cheaters or managing status, and they fire regardless of normative truth. If morality is merely a collection of these modules, then our moral beliefs are like taste preferences: shaped by evolution to guide behavior, but not describing objective features of the world.

  Conversely, if moral cognition relies on domain-general reasoning mechanisms, the path to realism is open. Domain-general reasoning allows an agent to process information across different contexts, apply abstract principles, and check for consistency. Unlike a module that simply triggers a "wrong" signal in response to incest or pollution, a domain-general system can ask *why* an action is wrong, weigh competing interests, and test the judgment against universalizable principles. This capacity for reflection allows the agent to decouple the judgment from the specific evolutionary pressure that may have initiated it. In this scenario, evolution provided the hardware, but the software is running a truth-tracking algorithm. The cognitive architecture acts as a filter; while the input may be noisy and evolutionarily biased, the processing mechanism is capable of correcting for those biases to arrive at normative truths. Thus, the failure of debunking arguments is conditional: they fail only if the mind is equipped to transcend its evolutionary programming through general reasoning.

  A skeptical objection arises here. One might argue that even domain-general reasoning is not immune to evolutionary calibration. If our capacity for reasoning evolved primarily for social argumentation, coalition building, or status management, then even our abstract principles might be systematically miscalibrated toward fitness rather than truth. On this view, logic itself is merely a tool for winning debates, not discovering reality. If the very engine of reasoning is tainted by evolutionary goals, the architectural defense collapses.

  This objection, however, conflates the *motivation* for using reasoning with the *constraints* of reasoning. It is plausible that the evolutionary pressure to develop reasoning capacities was social. But once those capacities exist, they operate under logical constraints that are independent of fitness. For example, the principle of non-contradiction is not useful because it helps us reproduce; it is useful because a system that contradicts itself cannot function. Similarly, in the moral domain, principles of impartiality and consistency impose constraints that may actually run counter to reproductive fitness. True moral reasoning often demands sacrificing self-interest or kin-preference for the sake of a principle. If reasoning were merely a tool for fitness maximization, it would not be able to generate norms that systematically override fitness interests. The fact that domain-general reasoning can produce conclusions that are costly to the agent suggests that the mechanism is not strictly yoked to evolutionary success. Therefore, while the *existence* of the reasoning faculty is explained by evolution, the *output* of that faculty can be truth-tracking because it is governed by normative constraints that transcend biological utility.

  To see how this framework applies in practice, consider the widespread cross-cultural conviction that causing unnecessary suffering is wrong. This judgment is a prime candidate for evolutionary debunking. A skeptic would argue that this belief is best explained by a domain-specific harm-avoidance module. We evolved to feel distress when witnessing pain (empathy) and to avoid causing it to maintain social cohesion and avoid retaliation. On this account, the judgment "suffering is wrong" is just a projection of our aversion mechanisms. If we lacked these modules, we would not hold this belief, regardless of whether suffering is objectively wrong. If the judgment is purely the output of this module, the debunking argument succeeds; the belief is explained by fitness, not truth.

  However, the architectural analysis suggests a more nuanced picture. The key term in the judgment is "unnecessary." A pure harm-avoidance module would likely register "suffering is bad" indiscriminately. But human moral cognition distinguishes between suffering that is gratuitous and suffering that is instrumental or justified (e.g., medical pain, defensive force). Making this distinction requires more than a modular trigger; it requires domain-general reasoning. It involves weighing interests, considering counterfactuals, and applying a principle of consistency: if I claim my suffering matters, I must acknowledge that the suffering of others matters similarly, absent a relevant difference. This is not a heuristic; it is a reasoned principle.

  If the conviction that unnecessary suffering is wrong rests primarily on the modular empathy response, then evolutionary debunking succeeds. The belief is vulnerable because it is tied to a specific, fitness-tracking emotional circuit. But if the conviction rests on the domain-general principle that interests must be weighed impartially, then debunking fails. The evolutionary origin of our empathy may have kickstarted the process, but the justificatory weight lies in the reasoning that validates the principle beyond the initial impulse.

  In all likelihood, the cognitive architecture is hybrid. The intuition is modular, but the justification is general. This implies that evolutionary debunking arguments succeed in undermining the *intuitive certainty* of moral judgments but fail to undermine the *reasoned principles* that support them. We cannot trust our gut feelings as direct perceptions of moral truth, as those are likely shaped by modular heuristics. However, we can trust the conclusions of domain-general reasoning that scrutinize those feelings.

  Therefore, the intermediate position holds that the debate over evolutionary debunking cannot be settled by metaphysics alone. It requires a commitment to a specific model of cognitive architecture. If moral psychology is dominated by encapsulated modules, the realist is in trouble. If it is dominated by domain-general reasoning, the realist is secure. The false dichotomy between evolution and truth is dissolved by recognizing that evolution builds the machine, but the type of machine determines whether it can track truth. In the case of unnecessary suffering, the presence of the qualifier "unnecessary" suggests that domain-general reasoning is at work, sifting evolutionary impulses through a filter of consistency. Consequently, while the evolutionary genealogy of our empathy is real, it does not debunk the normative principle that emerges when we reason about that empathy. The epistemic damage is contained, not total, and moral realism survives provided we anchor it in the architecture of reason rather than the reflex of instinct.
