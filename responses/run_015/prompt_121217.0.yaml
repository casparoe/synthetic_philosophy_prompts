prompt: |-
  I chair the clinical ethics committee at a children's hospital with a level IV neonatal service and a long-term ventilation unit. We are consulted between thirty and forty times a year, and in roughly half of those consultations the question we are really being asked is not what should be done but whether somebody's judgement is a considered value or a bias: a clinician's recommendation not to escalate care for a child with profound cognitive impairment, where the family alleges bias against disability; a team's settled description of a mother as drug-seeking or non-compliant; a parent's refusal of an intervention the team regards as plainly in the child's interest; once or twice a year, one of our own standing practices. We answer within about forty-eight hours, in a note that goes in the chart and that a family can request, addressed to an attending physician who is free to ignore us. The committee is eight people — two physicians, a nurse, a social worker, a chaplain, a lawyer, a parent representative and me — who meet for ninety minutes and none of whom, except me, has studied philosophy. So I need a procedure rather than a theory: something that gives roughly the same answer in different hands, runnable by people who have never thought about this, and honest about the places where it cannot substitute for judgement.

  Here is what I have cobbled together, which I suspect contains fewer distinct tests than it appears to and at least one that is actively misleading. One: the swap test — do we reach the same judgement about a relevantly similar patient who lacks the suspect feature? Two: the stated-reason test — can the holder give a reason that mentions neither the suspect feature nor anything that tracks it, with the obvious regress, since every reason can be re-described as a proxy, so that I also need a stopping rule for proxy-chasing. Three: the reversal test — would the holder accept the judgement from the position of the person it burdens? Four: the counter-evidence test — can the holder say in advance what would count against the judgement, rather than naming it after the fact? Five: endorsement under reflection — does the judgement survive unhurried, informed reconsideration, which I think is close to useless as I have stated it, because it insulates reflective people from the charge and convicts people mainly for being inarticulate. Six: convergence among judges differently situated, especially judges who share the suspect feature. Seven: a role test, since the same psychological state seems to me a permissible preference in a parent and a disqualifying partiality in a clinician or in us. Eight: something I have been calling exposure asymmetry — a judgement is more suspect when the cost of its being wrong falls entirely on people who had no say in it while the holder is insulated from that cost — though I cannot tell whether this is a test for bias or merely a reason to be careful.

  The difficulties I most want handled are these. Every test seems to presuppose some view about which features are genuine reasons, so that calling a preference a bias threatens to mean only that the committee dislikes it; I want the procedure to say explicitly whose normative baseline it uses — the hospital's stated commitments, the duties of the role occupied, the law, the affected parties — and how it avoids being a rubber stamp for our own considered preferences. I want the line between process and content kept straight: an unflattering causal history does not by itself make a judgement wrong, a sound judgement and a distorted one can be the same judgement, a true generalisation can still be a bias when it is applied to an individual in place of evidence about that individual, and a base rate can itself be the residue of earlier unfairness rather than an independent justification. And I want to know what bias even means when the subject is a rule rather than a person, since a policy has no psychology.

  I do not want a survey of theories of bias and I cannot use citations: my committee has no library and I have no way to check them. What I want is a decision procedure, in the order I should run it, with what counts as a sufficient answer at each step, where it terminates in a clear yes or no, and where it has to stop and hand the question to a person because it is a question of values rather than facts. Tell me which of my eight moves to keep, which to drop, and which are secretly the same move; give me the stopping rule for proxies; and tell me how the procedure weights the two errors it can make, calling a genuine value a bias and letting a bias through in the costume of a value, given that it cannot minimise both and that we cannot ask the family to decide that question for us.

  Then run it on three cases, without softening the results — I would rather have one case come out against the party the committee is temperamentally inclined to favour than three tidy ones.

  The first: a four-year-old, ventilator-dependent after a hypoxic brain injury. The ICU team recommends against tracheostomy and chronic ventilation, giving as their reason that she will never recognise us and that this is not a life. The parents allege bias against cognitive disability, and it is a matter of record that the same team recommended exactly this escalation three years ago for a child with comparable physical dependence and intact cognition. The parents' own position rests on a religious conviction about the sanctity of life; the team's rests on a view about quality of life. Both look like preferences.

  The second: parents of a nine-year-old with a progressive neuromuscular disease insist on a gastrostomy tube and full resuscitation against unanimous team advice. The team's private view is that the parents are performing for a large online audience that sends them money, and are partly motivated by guilt over an earlier decision concerning an older sibling. The parents' stated reason is, again, a religious conviction. The committee is temperamentally on the side of families.

  The third: our own unit's rule that home ventilation is offered only where a family can name two trained caregivers and lives within an hour of the hospital. It is justified by readmission statistics — statistics collected under a system in which home-nursing hours were themselves allocated by a distance rule. In practice it excludes single-parent households, families in crowded housing, and rural families.

  Finally, tell me what the procedure cannot do: which of these questions it will answer badly no matter how carefully we run it, and what we should say in the chart when we reach that point.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a clinical ethics committee (CEC) at a children's hospital (Level IV NICU, long-term vent unit).
      *   **Context:** 30-40 consults/year. ~50% involve distinguishing "considered value" from "bias."
      *   **Committee:** 8 people (MDs, nurse, SW, chaplain, lawyer, parent rep, chair). Only chair studied philosophy.
      *   **Constraints:** Needs a *procedure*, not a theory. Must be runnable by non-philosophers in 90 mins. Must yield consistent answers. Must be honest about limits. No citations/theory surveys.
      *   **Input:** User has 8 existing "tests" (Swap, Stated-Reason, Reversal, Counter-Evidence, Endorsement, Convergence, Role, Exposure Asymmetry).
      *   **Specific Problems to Solve:**
          *   Normative baseline (whose values?).
          *   Process vs. Content distinction (causal history vs. correctness).
          *   Bias in rules/policies (no psychology).
          *   Stopping rule for proxy-chasing.
          *   Error weighting (false positive vs. false negative on bias).
          *   Application to 3 specific cases (Vent/Disability, G-tube/Online Parents, Home Vent Policy).
          *   Limitations (what the procedure *can't* do).
      *   **Tone:** Direct, practical, unsentimental, rigorous but usable. "Without softening the results."

  2.  **Evaluate the User's 8 Tests:**
      *   *1. Swap Test:* Essential. Checks for differential treatment based on the suspect feature.
      *   *2. Stated-Reason Test:* Useful but needs the "stopping rule" for proxies.
      *   *3. Reversal Test:* (Would you accept this if you were the patient?) Often conflates bias with risk tolerance. Can be misleading if the "burdened" party lacks capacity.
      *   *4. Counter-Evidence Test:* (Falsifiability). Good for distinguishing dogma from judgment.
      *   *5. Endorsement under Reflection:* User admits this is weak/useless (insulates articulate, convicts inarticulate). *Drop.*
      *   *6. Convergence:* (Do others agree, especially those with the feature?). Good for checking intersubjective validity, but risks mob rule. Keep as a check, not a determinant.
      *   *7. Role Test:* Crucial. Parent partiality $\neq$ Clinician partiality.
      *   *8. Exposure Asymmetry:* (Who bears the cost?). This is a structural fairness check, not strictly a bias test, but highly relevant to *unjust* bias. Keep.

      *   *Redundancies:* Swap and Reversal are cousins. Stated-Reason and Counter-Evidence are cousins (one looks at input, one at output).
      *   *Normative Baseline:* The procedure needs an explicit anchor. The hospital's mission/legal duties are the safest "neutral" ground, but "Best Interest of the Child" is the clinical standard.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Distinguish Value vs. Bias.
      *   *Definition of Bias (Operational):* A judgment that relies on a feature irrelevant to the medical/ethical goal, applied inconsistently, or protected from counter-evidence, where the cost falls disproportionately on the vulnerable.
      *   *Definition of Value:* A judgment grounded in role-specific duties, consistent across cases, and open to revision.
      *   *Steps:*
          1.  **Anchor:** Define the Role/Goal. (What is the clinician/policy *supposed* to do?)
          2.  **Consistency (Swap):** Is the feature applied evenly?
          3.  **Relevance (Stated Reason + Stopping Rule):** Is the reason connected to the Goal?
          4.  **Falsifiability (Counter-Evidence):** Could they be wrong?
          5.  **Cost/Power (Exposure Asymmetry):** Who pays if it's wrong?
          6.  **Role Check:** Is this a permissible preference for *this* actor?
          7.  **Verdict:** Bias, Value, or Undecidable.

      *   *Refining the "Stopping Rule" for Proxies:* Stop when the reason connects to a *harm* or *benefit* defined in the hospital's mission or standard of care, rather than a social stereotype. If the chain leads to "because people like this are usually X," that's a bias. If it leads to "because this specific physiology causes Y pain," that's a value.
      *   *Error Weighting:* In pediatrics, the "Best Interest" standard usually prioritizes avoiding harm to the child over parental autonomy or clinician convenience. However, accusing a clinician of bias is a serious charge that damages trust. The procedure should be *conservative* about labeling a person biased, but *aggressive* about labeling a *judgment* unsupported. Actually, the prompt asks about "calling a genuine value a bias" vs "letting a bias through." Given the vulnerability of the patients (children, disabled), the procedure should weight *letting a bias through* as the worse error (Type II), because the cost falls on the voiceless child. But we must acknowledge the risk to the clinician. Let's refine: The procedure flags *structural* bias more easily than *psychological* bias.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 0: The Baseline.* We need to state whose norms apply. It's not the committee's philosophy. It's the Hospital's Mission + Legal Standard (Best Interest) + Professional Standards.
      *   *Step 1: The Role Filter.* (User's Test 7). Parents get latitude; Clinicians do not.
      *   *Step 2: The Consistency Check.* (User's Test 1).
      *   *Step 3: The Relevance Chain.* (User's Test 2 + Stopping Rule).
      *   *Step 4: The Falsifiability Check.* (User's Test 4).
      *   *Step 5: The Burden Check.* (User's Test 8).
      *   *Decision:* If it fails Consistency or Relevance, it's suspect. If it fails Falsifiability, it's dogma. If it fails Burden, it's unjust (even if not psychologically biased).

  5.  **Running the Cases:**
      *   *Case 1 (Vent/Disability):* Team says "not a life" (Quality of Life). Parents say "sanctity."
          *   Role: Clinician.
          *   Consistency: Failed (treated cognitive disability differently than physical).
          *   Relevance: "Never recognize us" is not a medical harm to the *child*. It's a harm to the *staff/parents*.
          *   Verdict: Bias (ableism) masquerading as medical judgment.
      *   *Case 2 (G-tube/Online Parents):* Team suspects performance/guilt. Parents say religion.
          *   Role: Parents have broad discretion unless harm is imminent.
          *   Consistency: Would team refuse G-tube to non-online parents? Probably not.
          *   Relevance: Team's reason (online audience) is irrelevant to medical safety. Parents' reason (religion) is a protected value.
          *   Burden: Child bears risk of aggressive care vs. parents bear burden of guilt.
          *   Verdict: Team's suspicion is bias (moral judgment of parents). Parents' request is a Value (within limits of harm). Committee should side with parents *unless* harm is clear, but call out the team's motivation.
      *   *Case 3 (Home Vent Policy):* Rule based on distance/caregivers.
          *   Psychology: N/A (Policy).
          *   Consistency: Applied evenly, but...
          *   Relevance/History: Stats are contaminated by previous distance rules.
          *   Burden: Falls on rural/poor (no say). Hospital insulated.
          *   Verdict: Structural Bias. The policy perpetuates prior inequity.

  6.  **Addressing the "Hard Questions":**
      *   *Normative Baseline:* Explicitly state it's the "Best Interest of the Child" filtered through "Professional Standards," not Committee intuition.
      *   *Process vs. Content:* The procedure judges the *support* for the judgment, not the truth of the conclusion.
      *   *Error Weighting:* Prioritize protecting the vulnerable patient (Type II error: letting bias through) over protecting the professional's ego (Type I error: false accusation), *but* phrase findings as "Unsupported by evidence" rather than "You are prejudiced."
      *   *Limitations:* It cannot solve fundamental value clashes (Sanctity vs. Quality of Life). It cannot fix resource scarcity. It cannot read minds.
      *   *Chart Note:* Needs to be specific. "The justification provided relies on X, which is inconsistent with Y."

  7.  **Refining the Output:**
      *   Make it a checklist.
      *   Cut the philosophy jargon.
      *   Ensure the "Stopping Rule" is clear (The "Therefore" test).
      *   Ensure the Case Results are sharp.
      *   Address the "Policy vs. Person" bias question.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the "Reversal Test" truly useless?
      *   *Correction:* It's dangerous with non-autonomous patients. Better to use "Substituted Judgment" or "Best Interest." I will drop Reversal as requested ("which to drop").
      *   *Critique:* User wants to know which tests are the same.
      *   *Correction:* Swap and Consistency are the same. Stated Reason and Relevance are the same.
      *   *Critique:* The "Stopping Rule" for proxies is critical.
      *   *Correction:* Define it as the "Medical/Functional Link." If the chain stops at a social stereotype, it's bias. If it stops at a physiological outcome, it's value.
      *   *Critique:* Error weighting.
      *   *Correction:* In pediatrics, the child is the primary patient. Bias against the child is worse than bias against the system. But we must maintain team function. I will advise weighting the *harm to the child* as the tie-breaker.

  9.  **Final Polish:** Check against constraints (no citations, direct tone, specific case outcomes). Ensure the distinction between "Bias in a person" and "Bias in a rule" is clear. (Policy bias is about disparate impact + lack of justification).

  *(Self-Correction on Case 2)*: The prompt says the committee is "temperamentally on the side of families." I need to be careful not to just validate that. The team suspects the parents are "performing." If the medical intervention is *harmful*, the parents' motive doesn't matter, the harm does. If it's *beneficial or neutral*, the parents' motive doesn't matter. The team's suspicion is the bias here. I need to make sure the procedure isolates the *team's* judgment as the object of scrutiny, not just the parents'.

  *(Self-Correction on Case 1)*: The team's view is "not a life." This is a metaphysical claim, not medical. The procedure must flag this as outside professional scope.

  *(Self-Correction on Case 3)*: This is institutional bias. The procedure needs to handle non-psychological agents. The test is "Disparate Impact + Contaminated Data."

  10. **Final Structure:**
      *   The Procedure (The 5-Step Filter).
      *   The Baseline & Error Weighting.
      *   The Stopping Rule.
      *   Application to Cases.
      *   Limitations & Chart Language.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your committee's constraints. It collapses your eight tests into five operational steps, establishes a normative baseline, and defines the stopping rule for proxy-chasing.

  ### The Procedure: The Five-Step Filter

  Run these steps in order. If a judgment fails any step, it is flagged as **Unsupported**. If it fails Step 2 or 3 specifically, it is flagged as **Biased**. If it passes all, it is **Supported**.

  **Step 0: The Baseline (Pre-Step)**
  Before testing, state the normative anchor aloud. For a pediatric ethics committee, the baseline is not "what we think is good," but **"The Best Interest of the Child, constrained by Professional Standards and Law."**
  *   *Why:* This prevents the committee from substituting its own values.
  *   *Action:* Identify the specific professional duty or hospital mission statement relevant to the case (e.g., "relieve suffering," "preserve function," "respect parental authority unless harm is imminent").

  **Step 1: The Role Filter (Your Test 7)**
  *   *Question:* Is the actor entitled to this preference by virtue of their role?
  *   *Rule:* Parents may act on religious/personal values even if medically suboptimal, provided they do not cross the harm threshold. Clinicians and Policies must act on medical/functional evidence and institutional equity.
  *   *Pass:* The preference aligns with role duties.
  *   *Fail:* A clinician or policy acts on a preference reserved for families (e.g., quality of life judgments that override medical indication without consensus).

  **Step 2: The Consistency Check (Your Test 1)**
  *   *Question:* Would this judgment hold if the suspect feature (disability, race, socioeconomic status, online presence) were removed or swapped for a neutral/privileged feature?
  *   *Rule:* Compare to a relevantly similar case.
  *   *Pass:* The judgment remains the same.
  *   *Fail:* The judgment changes solely based on the suspect feature. (This is the strongest indicator of bias).

  **Step 3: The Relevance Chain (Your Test 2 + Stopping Rule)**
  *   *Question:* Does the stated reason connect to the Baseline (Step 0) without relying on a stereotype?
  *   *The Stopping Rule for Proxies:* Ask "Why?" up to three times.
      *   If the chain ends in a **physiological or functional outcome** (e.g., "pain," "breathlessness," "inability to interact"), it is a **Value**.
      *   If the chain ends in a **social generalization** (e.g., "burden," "not a life," "people like this usually..."), it is a **Bias**.
      *   *Crucial:* If the reason describes a burden to the *staff or system* rather than the *child*, it fails the Baseline.

  **Step 4: The Falsifiability Check (Your Test 4)**
  *   *Question:* What evidence would change this mind?
  *   *Rule:* A value is open to new data; a bias is dogmatic.
  *   *Pass:* The holder can name a specific clinical change that would alter the recommendation.
  *   *Fail:* The holder says "Nothing," or names something impossible (e.g., "If she became normal").

  **Step 5: The Burden Check (Your Test 8)**
  *   *Question:* Who bears the cost if this judgment is wrong?
  *   *Rule:* Asymmetry increases scrutiny.
  *   *Pass:* The decision-maker shares the risk, or the risk is distributed.
  *   *Fail:* The vulnerable party (child/family) bears 100% of the risk, and the decision-maker (clinician/hospital) bears none (e.g., reputational safety, resource conservation).

  ---

  ### Error Weighting and Normative Baseline

  **Whose Baseline?**
  The procedure uses the **Hospital's Mission and Professional Standards** as the objective ruler. It does not use the Committee's moral intuition. If the hospital commits to "serving the underserved," a policy that excludes them is a violation of commitment, regardless of intent.

  **Error Weighting**
  You cannot minimize both errors. In pediatrics, the child is the primary patient and the least able to advocate.
  *   **Priority:** Minimizing **Type II Error** (Letting a bias through in the costume of a value).
  *   **Reason:** The cost of a false negative (allowing bias) falls on the voiceless child. The cost of a false positive (accusing a clinician of bias) falls on a professional who has other avenues for appeal and defense.
  *   **Implementation:** If Step 2 (Consistency) or Step 3 (Relevance) fails, the finding is "Unsupported by Evidence." Do not necessarily accuse the person of prejudice; accuse the *judgment* of lacking foundation. This protects the process while stopping the bias.

  ### Bias in Rules vs. Persons
  A policy has no psychology, so it cannot be "prejudiced." It can only be **structurally biased**.
  *   **Test:** Does the rule produce a disparate impact on a protected class *and* is the justification for the rule contaminated by prior inequity?
  *   **Verdict:** If yes, the rule is unjust, regardless of the intent of those who wrote it.

  ---

  ### Application to Cases

  **Case 1: The Ventilator and Cognitive Disability**
  *   **Step 0 (Baseline):** Best Interest of Child / Professional Duty to treat.
  *   **Step 1 (Role):** Clinicians are making a Quality of Life judgment. This is permissible only if grounded in suffering, not metaphysics.
  *   **Step 2 (Consistency):** **FAIL.** The team treated physical dependence differently than cognitive dependence. The variable is the disability type.
  *   **Step 3 (Relevance):** **FAIL.** "Never recognize us" is a burden to the *staff/parents*, not a physiological harm to the *child*. The chain stops at a social generalization ("not a life").
  *   **Step 4 (Falsifiability):** **FAIL.** No clinical improvement would change the "not a life" view.
  *   **Verdict:** **Biased Judgment.** The recommendation relies on ableism (valuing cognition over existence) and shifts the burden of the child's disability onto the child via death.
  *   **Action:** The committee must recommend escalation. The chart note should state: "The recommendation against tracheostomy relies on quality-of-life assessments inconsistent with the hospital's non-discrimination policy and prior treatment of similar physiological cases."

  **Case 2: The G-Tube and Online Parents**
  *   **Step 0 (Baseline):** Parental Authority unless imminent harm.
  *   **Step 1 (Role):** Parents are within rights to request life-sustaining treatment. Clinicians are questioning motive, not just outcome.
  *   **Step 2 (Consistency):** **PASS (for Parents).** Parents treat all children with sanctity. **FAIL (for Team).** Would the team refuse G-tube to non-online parents? If no, the "online" feature is driving the suspicion.
  *   **Step 3 (Relevance):** **FAIL (Team).** The parents' online audience is irrelevant to the child's physiological safety. The team's suspicion is a moral judgment of the parents, not a medical assessment of the child.
  *   **Step 4 (Falsifiability):** **PASS (Parents).** If the procedure caused harm, they might stop (presumably).
  *   **Step 5 (Burden):** The child bears the risk of the procedure; the parents bear the guilt. The team bears reputational risk if they "give in."
  *   **Verdict:** **Team Bias.** The committee is temperamentally pro-family, but here the procedure confirms it. The team's suspicion is a bias against the parents' character based on irrelevant features.
  *   **Action:** Support the parents' request *unless* the medical team can demonstrate imminent physical harm from the intervention. The chart note must state: "Parental motivation is outside clinical scope. Decision rests on medical risk/benefit for the child. No evidence of harm sufficient to override parental authority."

  **Case 3: The Home Ventilation Policy**
  *   **Step 0 (Baseline):** Hospital Mission (Equity/Access).
  *   **Step 1 (Role):** Policy makers must ensure equitable access.
  *   **Step 2 (Consistency):** **PASS (Formally).** Rule applies to everyone.
  *   **Step 3 (Relevance):** **FAIL.** The justification (readmission stats) is contaminated. The stats were generated by a prior distance rule. The "reason" is a circular artifact of past bias.
  *   **Step 5 (Burden):** **FAIL.** High Asymmetry. Rural/poor families bear the cost (no care); Hospital bears no cost (saved resources).
  *   **Verdict:** **Structural Bias.** The policy is not psychologically biased, but it is unjust. It codifies prior inequity.
  *   **Action:** The policy must be revised. The chart note (or memo to administration) should state: "The current criteria rely on data contaminated by prior exclusionary practices. This creates a disparate impact on rural and single-parent households inconsistent with the hospital's equity commitments."

  ---

  ### What The Procedure Cannot Do

  **1. Fundamental Value Clashes**
  The procedure cannot resolve "Sanctity of Life" vs. "Quality of Life" when both are consistently applied. In Case 1, if the team had *always* refused chronic ventilation for *all* children (cognitive or not) based on a consistent definition of suffering, Step 2 would pass. The procedure would then flag it as a **Value Conflict**, not bias.
  *   *Chart Language:* "This is a disagreement on fundamental values, not a procedural error. The committee cannot arbitrate metaphysics. We recommend mediation or transfer."

  **2. Resource Scarcity**
  The procedure identifies bias, but it cannot create resources. In Case 3, removing the distance rule might bankrupt the home-vent program. The procedure identifies the injustice, but the hospital administration must decide if they can afford justice.
  *   *Chart Language:* "The policy is structurally biased. Removing the bias requires resources currently unavailable. This is an administrative, not ethical, constraint."

  **3. Causal History vs. Current Validity**
  The procedure cannot tell you if a judgment is *true*, only if it is *supported*. A clinician might be right about a poor prognosis for biased reasons. The procedure forces them to find the *right reasons*.
  *   *Chart Language:* "The conclusion may be correct, but the justification provided is unsupported. A new justification based on clinical evidence is required."

  **4. The "Hard No"**
  Sometimes the procedure will tell you a judgment is biased, but the law or hierarchy allows the biased actor to prevail.
  *   *Chart Language:* "The committee finds the justification inconsistent with ethical standards. However, the attending retains final decision-making authority. The family has been informed of the right to appeal/transfer."

  ### Summary of Changes to Your Eight Tests
  *   **Keep:** Swap (Consistency), Stated-Reason (Relevance), Counter-Evidence (Falsifiability), Exposure Asymmetry (Burden), Role Test.
  *   **Drop:** Reversal Test (confuses capacity with bias), Endorsement under Reflection (tests articulation, not truth), Convergence (risks mob rule).
  *   **Merge:** Swap and Consistency are the same. Stated-Reason and Relevance are the same.
  *   **Add:** Step 0 (The Baseline). Without this, you are just voting on preferences.

  This procedure will not make you philosophers. It will make you auditors. It will not guarantee truth, but it will guarantee that the reasons given are the reasons meant, and that the costs are counted.
