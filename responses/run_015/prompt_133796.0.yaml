prompt: |-
  We have just spent the better part of an evening arguing about whether historical explanation is genuinely explanatory or merely a well-structured story, and you insisted that before either of us reads another article we ought to have the full specification of what an adequate theory in this area must actually deliver. So write it out for me.

  You are an expert philosopher of history with rigorous analytic training. Think carefully, and before you lay out the criteria spend a brief moment brainstorming the deepest structural tensions between law-based and narrative approaches—especially identifying any single requirement that, if taken as non-negotiable, forces the abandonment of the other camp entirely.

  Write the desiderata: what any adequate theory of historical explanation must achieve to count as genuinely explanatory rather than merely descriptive, rhetorical, or taxonomic. For each requirement, provide the motivating case or conceptual distinction that makes it necessary; flag whether it is non-negotiable or a camp-specific preference (for instance, of covering-law proponents versus narrative theorists); and indicate if it stands in a joint-unsatisfiability relation with any other requirement on the list. Pay particular attention to the problem of archival silence—how the theory must treat gaps and selective preservation in the evidentiary record without treating missing data as explanatorily neutral ground, and how narrative closure operates when the archive is incomplete. You must also address macro-micro integration: the theory must relate large-scale structural or demographic patterns to individual intentional action without reducing either level to the other.

  Then, very briefly, score the two main families—covering-law models and narrative models—against your list. Keep the scoring concise; the conceptual work lies in the criteria themselves.

  Present your response as structured data in a single JSON object with exactly this schema:

  {
    "brainstorming_notes": "string — brief paragraph on the deepest tensions",
    "desiderata": [
      {
        "id": "integer",
        "desideratum": "string — the precise requirement",
        "motivating_case_or_distinction": "string — the case or distinction behind it",
        "negotiability": "non_negotiable | camp_preference",
        "joint_unsatisfiability_flag": "string or null — e.g. 'conflicts with id 3', or null"
      }
    ],
    "archival_silence_requirement": "string — explicit statement of how the theory handles this injected problem",
    "macro_micro_integration_note": "string — explicit statement of the integration demand",
    "brief_scoring": {
      "covering_law_models": {
        "strengths": ["string"],
        "failures": ["string"]
      },
      "narrative_models": {
        "strengths": ["string"],
        "failures": ["string"]
      }
    }
  }

  Use British spelling throughout. Do not include bibliographies, reading lists, or citations of specific works. Ensure the JSON is valid and complete.
