      *   **Context:** An argument about whether historical explanation is genuinely explanatory or merely a well-structured story.
      *   **Specific Requirements:**
          *   Brainstorm deepest structural tensions between law-based (covering-law) and narrative approaches.
          *   Identify any single requirement that forces abandonment of one camp if taken as non-negotiable.
          *   List desiderata with: ID, precise requirement, motivating case/distinction, negotiability (non_negotiable | camp_preference), joint_unsatisfiability_flag.
          *   Address archival silence (gaps, selective preservation, narrative closure).
          *   Address macro-micro integration (structural/demographic vs. individual intentional action).
          *   Score covering-law and narrative models against the list (briefly).
          *   **Format:** Single JSON object with a specific schema.
          *   **Style:** British spelling. No bibliographies/citations. Valid JSON.

  2.  **Brainstorming & Conceptual Work (Internal Monologue):**
      *   *Tension:* The core tension is between nomological necessity (general laws, prediction, subsumption) and narrative understanding (particularity, contingency, emplotment). Covering-law models (Hempel) want history to be like science (predictive, law-governed). Narrative models (White, Gallie, Dray) want history to be like literature/story (meaning-making, coherence, human agency).
      *   *Non-negotiable conflict:* If "Subsumption under general laws" is non-negotiable, narrative contingency is lost. If "Narrative closure/emplotment" is non-negotiable, universal laws are irrelevant. The deepest conflict is often around *counterfactual dependence* vs. *narrative coherence*.
      *   *Archival Silence:* History is fragmentary. A theory must explain how we explain things when evidence is missing. Covering-law might say "insufficient data for prediction." Narrative might say "the story fills the gap." A robust theory needs to acknowledge silence as constitutive, not just noise.
      *   *Macro-Micro:* Structure vs. Agency. Covering-law often leans macro (demographics, economics). Narrative often leans micro (great men, decisions). An adequate theory must bridge this (e.g., analytical narrative or critical realism).
      *   *Desiderata Construction:*
          1.  Explanatory Relevance (Why *this* factor?)
          2.  Counterfactual Support (Could it have been otherwise?)
          3.  Mechanism Specification (How did A lead to B?)
          4.  Narrative Coherence (Does it make sense as a story?)
          5.  Empirical Adequacy (Does it fit the evidence?)
          6.  Handling of Silence (How are gaps treated?)
          7.  Multi-level Integration (Macro/Micro)
      *   *Joint Unsatisfiability:* There is a tension between "Strict Nomological Subsumption" and "Narrative Particularity". If I make strict subsumption non-negotiable, narrative particularity fails. If I make narrative emplotment non-negotiable, strict subsumption fails. I need to frame this carefully in the JSON.
