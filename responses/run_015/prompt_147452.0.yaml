      *   **Topic:** Rising diagnosis rates in child psychiatry. The user argues that "true prevalence vs. better detection" is a false dichotomy because of looping effects, specifically accelerated by digital tools/algorithms (screening, EHRs, apps).
      *   **Goal:** A prep sheet for Q&A. Needs specific objections *this* audience would raise, phrased in *their* language, with 2-minute replies, concessions, non-negotiables, the "make or break" point, and the "nightmare question."

