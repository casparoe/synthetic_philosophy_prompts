      5.  *Algorithmic Feedback:* Medium. They might think they can just "de-bias" the model.
      6.  *Biological Reality:* Medium. Clinicians might push back, but the room is mostly epi.

      *Let's stick to the User's predicted ones + the most dangerous pragmatic ones.*

  5.  **Drafting Replies (2-minute constraint):**
      *   Need to be conversational, not jargon-heavy (no "ontological indeterminacy").
      *   Need to acknowledge their framework before pivoting.
      *   Need to identify the "soft spot" (where the reply is vulnerable).

  6.  **Determining Concessions & Non-Negotiables:**
      *   *Concede:* Categories are useful. We need numbers for funding. Measurement invariance tools are good *for what they do*.
      *   *Don't Concede:* That there is a "true prevalence" waiting to be found. That freezing the instrument is a neutral act.
      *   *Make or Break:* The claim that *freezing the instrument is a normative decision, not a discovery*. If they think it's just a technical fix, the talk fails.

  7.  **Identifying the Nightmare Question:**
