      *   *Objection 5 (The Algorithmic Specific):* "Isn't this just feedback in deployed prediction models?" (User predicted this). They will treat it as a ML bias problem, not an ontological one.
      *   *Objection 6 (The Policy/Resource):* "If there's no fact of the matter, how do we allocate resources?" (The Health Economist's question).
      *   *Objection 7 (The "So What?"):* "Okay, it's looping. Does that change how I run my cohort study?"

      *Refining for "Damage Potential":*
      1.  *Measurement Non-Invariance:* High damage. Makes the talk sound naive about psychometrics.
      2.  *The Estimand:* High damage. Makes the argument look mathematically illiterate.
      3.  *Predictive Validity:* Medium-High. Undermines the "usefulness" defense.
