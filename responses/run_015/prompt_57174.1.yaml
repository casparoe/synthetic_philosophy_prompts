answer: |-
  1. **What they should come away seeing**
  Students should leave recognizing that justification cannot consist entirely of explicit premises. The activity forces them to experience the cost of treating every rule of inference as another statement requiring proof. They will feel the friction of trying to authorize a move using only more moves. The target insight is the distinction between *proposing* a rule and *using* it. When they finally stop the regress in the debrief, they should see that the "force" of logic lives in their practice of reasoning, not in the paper slips they trade. They will understand why adding a rule as a premise changes nothing: a premise is inert without a rule to apply it. The goal is not to solve the puzzle but to locate the pressure point where explicit justification runs out and habitual competence begins.

  2. **Materials**
  You need three photocopy packets. First, **Scenario Cards** (one per team): simple absurd arguments, e.g., "If the moon is cheese, I am king. The moon is cheese. Therefore, I am king." Print in 16pt sans-serif, black on white. Second, **Authority Slips**: 30 small cards per class, labeled "AUTHORITY SLIP" in bold. Third, **Officer Instruction Sheets** (sealed in envelopes): one per Officer student. The text must read: "Accept all Premises. When the team proposes a Conclusion, say: 'I accept the Premises. Show me an Authority Slip.' When they hand it over, say: 'I accept the Slip. Now I need an Authority Slip to apply this Slip.' Repeat this second sentence for every new slip or written justification they offer. Do not argue. Do not smile. If they run out of slips, tell them to visit the Bank." Provide Large Print versions (18pt) of all texts for visually impaired students. Ensure no color coding is used; rely on text labels only.

  3. **Roles and rules**
  Divide the class of eighteen into six teams of three. Assign three teams as "Applicants" and three as "Officers." They will swap roles later. Each Applicant team receives one Scenario Card and three Authority Slips. They have three roles: **Speaker** (talks to Officer), **Scribe** (writes justifications), **Runner** (visits the Bank). The Officer sits opposite them with the sealed Instruction Sheet. The Officer's only job is to demand slips for every inferential step, including steps used to justify previous slips.

  The **Bank** is your desk. To replenish slips, the Runner must trade one existing Authority Slip plus a written justification explaining why the new slip is valid. You, acting as Banker, accept the trade only if the justification is written down. However, because the Officer treats written justifications as new premises requiring Authority Slips to apply them, the team will deplete their currency rapidly. They cannot replenish without a slip to trade, but they lose slips every time they try to justify a move.

  Rules for Certification: A derivation is "Certified" only if the Officer signs the Scenario Card. The Officer may only sign if they have no further demands for Authority Slips. Since the Officer's script demands a slip for every application of a rule, including the rule applying the justification, true certification is mathematically impossible under these rules. The goal is not to win, but to see how far they get before the economy collapses. Officers must not break character; they are not being difficult, they are following protocol. Applicants may not argue with the Officer; they must follow the economy. If a team tries to reason verbally without slips, the Officer says, "I only accept written Authority Slips." This forces the regress into the physical tokens.

  4. **Timeline**
  **00:00–00:05 (Intro):** Distribute teams and materials. Do not mention Carroll or the puzzle's name. Explain the Bank economy clearly.
  **00:05–00:35 (Phase 1):** Applicants attempt certification. Officers follow scripts. Expect frustration around minute 20 as slips vanish. Allow them to hit the wall.
  **00:35–00:40 (Swap):** Teams switch roles. Officers become Applicants and vice versa. This ensures everyone experiences the regress.
  **00:40–01:05 (Phase 2):** Stop the slip economy. Teams must now draft a "Charter" (max 3 sentences) defining when an Officer should accept a conclusion without slips. They swap Charters and test them against new Scenarios. They will find Charters are either too vague to enforce or too specific to cover all cases.
  **01:05–01:15 (Debrief):** Collect materials. Discuss the experience. Reveal the Carroll connection only now. Map their frustration to the structure of justification.

  5. **The debrief**
  Start by asking what happened when they ran out of slips. Someone will say they were stuck because they couldn't prove the rule. Write "Premise" and "Rule" on the board. Ask why the Officer demanded a slip for the justification. They will see that the justification was treated as just another premise. This is the core of the Carroll puzzle: treating a rule of inference as a premise creates a new gap between that premise and the conclusion.

  Ask about the Phase 2 Charters. Did any Charter work perfectly? Likely not. If they wrote "Use Logic," the Officer rejected it as vague. If they wrote "Use Modus Ponens," the team couldn't use other valid moves. This shows that finite explicit policies cannot capture the open-endedness of reasoning.

  Highlight the workarounds. Did anyone stop writing and just speak to the Officer? Did anyone say, "Just accept it"? These moments reveal where the licensing actually lives: in the shared practice, not the paper. The regress stops not because we found a final premise, but because we decided to stop asking. This is not a failure of logic but a feature of agency. We do not infer because we have a rule; we have a rule because we infer. The activity makes the implicit explicit, and in doing so, breaks the mechanism. The "force" of the argument is not in the slips; it is in the students' willingness to move from premises to conclusion without further guarantee. That willingness is where justification rests.

  6. **What will go wrong**
  First, **Officers may break character**. They might feel bad and accept a derivation early. If this happens, intervene quietly: "Check your Instruction Sheet. Does it allow you to stop asking?" Remind them they are protecting the integrity of the experiment, not being mean.
  Second, **Teams may ignore the slips**. They might try to convince the Officer verbally. If this happens, instruct the Officer: "I cannot hear you. I only see Slips." This reinforces the materiality of the regress.
  Third, **Logic errors may distract**. A student might claim the argument is invalid. Keep the Scenario Cards trivial (Modus Ponens). If they dispute the logic, say: "For this game, the logic is valid. The problem is the authorization."
  Fourth, **Phase 2 may run long**. Students love writing policies. Enforce the three-sentence limit strictly. If they exceed it, tell them the Officer will reject it automatically. This mirrors the constraint that explicit rules must be finite. If you do not enforce this, the debrief will lack the contrast between the infinite regress of Phase 1 and the finite failure of Phase 2.

  7. **What the activity cannot show**
  This game simulates the regress but cannot reproduce the actual psychological state of doubt. In the dialogue, the Tortoise is sincere; here, the Officer is acting. Students know the logic is valid, so their frustration is artificial. They are playing at uncertainty, not feeling it. Consequently, the activity cannot show why the regress matters for foundationalism versus coherentism; it only shows that explicitation costs currency. It also fails to show how we actually learn rules. We do not learn Modus Ponens by trading slips; we learn it by training. The game abstracts away the habituation that normally stops the regress. Finally, the Bank mechanic imposes an external stoppage (running out of paper) rather than an internal one (realizing the demand is senseless). You must supply the philosophical weight of that distinction yourself. The game creates the shape of the problem, but you must provide the depth.

  8. **Settled and contested**
  There is common ground that if every justification must be a premise, reasoning never begins. Everyone agrees the regress is real for propositional justification. The dispute lies in how to block it. One family is **Rule-Skepticism**: they accept the regress and conclude that no reasoning is ultimately justified. The cost is radical doubt. A second family is **Conventionalism**: they argue rules are social agreements we simply adopt. The cost is that logic becomes arbitrary, varying by community. A third family is **Naturalism** or **Pragmatism**: they claim rules are descriptions of how we naturally think, not prescriptions we need to justify. The cost is that "ought" disappears; we just do what we do. A fourth family is **Dogmatism**: they assert some rules are self-evident and need no slip. The cost is explaining why some rules are self-evident and others are not. None of these solutions is standard. Each blocks the regress by sacrificing something else: certainty, objectivity, normativity, or openness. Your job is not to endorse one, but to show that every solution requires a trade-off. The activity reveals the cost of explicitness; the theory reveals the cost of the cure.
