answer: |-
  Here are three distinct rules that fit your mate's seven previous rulings, an assessment of which one she's actually using, a prediction for the rabbit virus, and a test case to prove it.

  ### The Three Rules

  **1. The Partisan Rule (Your Theory)**
  *   **The Logic:** A non-human thing is a *Character* if it picks a side in a human conflict or creates a winner/loser dynamic. It is *Setting* if it raises the cost for everyone equally or acts as a background pressure.
  *   **Fits:** Yellow Fever (Rebels win, French lose), Mosquitoes (Americans win, French lose), Antibiotics (Bacteria win, Doctors lose).
  *   **Strains:** The Potato Blight. It devastated the Irish peasantry, but it didn't explicitly "side" with the British government (even if the political outcome favored them). It was a universal disaster for the victims, yet she called it Character. Tambora also moved bread prices for everyone, which fits Setting, but the distinction relies on whether "everyone" means "all humans" or "all combatants."

  **2. The Vitalist Rule (Alive vs. Dead)**
  *   **The Logic:** A non-human thing is a *Character* if it is biological (virus, bacteria, fungus, insect). It is *Setting* if it is geological, chemical, or climatic (volcano, salt, ice age).
  *   **Fits:** Perfectly. Yellow Fever (Virus), Mosquitoes (Insect), Blight (Fungus), Antibiotics (Bacteria) are all **Character**. Tambora (Volcano), Little Ice Age (Climate), Salination (Chemistry) are all **Setting**.
  *   **Strains:** It ignores her specific justifications. She didn't say "because it's a bug" about the mosquitoes; she talked about the French collapsing and Americans draining swamps. She didn't say "because it's bacteria" about antibiotics; she said "it learns." This rule fits the data but ignores the *reasoning*.

  **3. The Reciprocity Rule (Agency & Adaptation)**
  *   **The Logic:** A non-human thing is a *Character* if it actively responds, adapts, or resists human intention in a dynamic way. It is *Setting* if it is a passive condition, a slow trend, or a direct consequence of human error without pushback.
  *   **Fits:**
      *   *Antibiotics:* "It learns" (Active adaptation).
      *   *Mosquitoes:* Humans tried to dig, mosquitoes stopped them; humans changed tactics (drain/screen), mosquitoes were beaten (Dynamic interaction).
      *   *Yellow Fever:* Rebels had immunity, French didn't (Biological response to human presence).
      *   *Little Ice Age:* "A trend isn't a who" (Passive state).
      *   *Salination:* "Them doing it to themselves" (Passive chemical consequence, no pushback).
      *   *Tambora:* Dust sat in the sky (Passive event).
      *   *Potato Blight:* An invasive biological agent that actively destroyed the food source, forcing a reaction (famine/migration) rather than just making farming harder.
  *   **Strains:** None. This accounts for the "learns" comment, the "trend isn't a who" comment, and the "doing it to themselves" comment.

  ### The Verdict: Which Rule Is She Running?

  I would bet heavily on **Rule 3: The Reciprocity Rule.**

  **Why?**
  Because of the specific language she uses in her justifications. If she were running the Vitalist Rule, she wouldn't need to explain that "a trend isn't a who." If she were running the Partisan Rule, she wouldn't classify the Potato Blight as a Character (since it didn't arm one side against the other, it just starved one group).

  The Reciprocity Rule aligns with her insistence that this isn't "environmental determinism." Environmental determinism argues that the environment *dictates* human outcomes (passive humans, active nature). Her rule seems to be the opposite: she grants "Character" status only when the non-human entity engages in a *relationship* with humans. When nature just sits there and humans crash into it (Salination, Tambora), it's Setting. When nature fights back or evolves (Antibiotics, Mosquitoes), it's Character. This preserves human agency: we are only "determined" by things that actively contest us.

  ### Prediction: Myxomatosis

  **Verdict: Character.**

  **Reasoning:**
  Myxomatosis fits the Reciprocity Rule perfectly. It wasn't just a virus released that killed rabbits; it was an evolutionary arms race. The virus was released with human intent (to kill), but the biological agent *changed* (became less lethal to ensure host survival) and the rabbits *changed* (developed resistance). This is dynamic adaptation ("it learns," similar to antibiotic resistance). It actively thwarted the specific human plan in a way that required a change in strategy, rather than just being a static obstacle.

  ### The Test Case

  To tell the **Vitalist Rule** apart from the **Reciprocity Rule**, you need a biological agent that does *not* adapt or fight back.

  **Propose this case:** **The introduction of Kudzu vine to the American South (1930s).**

  *   **The Scenario:** Humans intentionally planted Kudzu to stop soil erosion. It spread aggressively, choking out native plants and covering infrastructure. It is biological (Vitalist = Character). However, it did not evolve in response to humans, nor did it "learn." It just grew according to its nature while humans failed to manage it.
  *   **If she rules Character:** She is following the **Vitalist Rule** (It's alive, therefore it's a who).
  *   **If she rules Setting:** She is following the **Reciprocity Rule** (It's a passive biological force; the failure was human management, not vine adaptation).

  *(Note: The Partisan Rule would likely call this Setting too, as it affected everyone in the region equally, so this case specifically targets the split between "Alive" and "Adaptive".)*

  ### Does the "Not Determinism" Constraint Do Work?

  **Yes, it does real work.**

  If she weren't worried about environmental determinism, she could classify **Tambora** or the **Little Ice Age** as *Characters*. After all, they caused harvest failures, rebellions, and the collapse of regimes. In a purely causal model, they are major drivers of history.

  By insisting it isn't determinism, she is drawing a line between **Causation** and **Agency**.
  *   **Determinism:** The environment causes things to happen to passive humans. (This would make every disaster a Character).
  *   **Her Rule:** Humans act, and sometimes the environment *answers*.

  The constraint forces her to classify passive disasters (Tambora, Salination) as *Setting*, even when they have huge historical impacts. It reserves *Character* status for moments of **interaction**. It prevents her from absolving humans of responsibility (Salination was "them doing it to themselves") while still acknowledging when non-human forces genuinely contest human will (Antibiotics, Mosquitoes). It turns the classification from "What changed history?" to "Who was in the room?"
