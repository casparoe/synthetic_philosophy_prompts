  ok sanity check needed. my roommate calls electronics "sleepy" if they're turned off but still plugged in, and "dead" only if they're unplugged. he corrects me when i say my laptop is dead—no, its sleepy, dead requires zero connection. he swears this is normal english and gets annoyed if i call it a metaphor. now im wondering: if i try to understand him, do i have to assume he mostly knows english and just has wierd beliefs about power states? or is he basically speaking a different language where "sleep" tracks a finer distinction? and is there actually a clean line between "he means something else" and "he's just wrong about the world"? this is getting in the way of practical stuff—he writes "wake up the milk" on our grocery list and i cant tell if thats a typo or part of his system. sry for the long text, typing on my phone.
reasoning: |-
