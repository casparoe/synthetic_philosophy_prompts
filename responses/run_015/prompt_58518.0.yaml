answer: |-
  Right, pull up a chair. That sounds like a proper pub debate, the kind where you order another round while you try to untangle the logic. Your mate's got a point that it looks messy on the surface, but actually, your local setup isn't incoherent. It's built on a very specific, somewhat old-fashioned British view of how power works. It's a "hybrid" system that tries to get the best of two different worlds while avoiding the worst of both.

  Here is a reconstruction of the unspoken theory behind your council's setup, broken down into competence, corruption, and legitimacy, keeping it plain English.

  ### 1. The Theory of Competence: "Common Sense vs. Specialism"

  The system presupposes that ordinary people are good at **judging**, but not necessarily at **governing**.

  *   **Juries and Planning Panels:** When you're on a jury, you aren't expected to know the law; the judge handles that. You aren't expected to manage the court budget; the administrator handles that. You are just asked to apply common sense to the facts: *Did he do it? Is this building too ugly?* The theory here is that six random people from the High Street have enough moral compass and life experience to decide what is fair. You don't need a degree in ethics to know right from wrong.
  *   **Councillors:** Governing a city is viewed differently. It involves budgets, long-term strategy, and complex trade-offs (e.g., cutting bin collections to save money for schools). The system assumes this requires a specific type of commitment and skill that random people might not have the time or training for.
  *   **The Citizens' Assembly:** This is the middle ground. They trusted 60 random people to *think* about housing deeply (hence the payment and weekends), but they didn't trust them to *decide*. The elected council kept the final say.

  **The Unspoken Rule:** Random people are the best judges of **fairness**; elected people are the necessary managers of **complexity**.

  ### 2. The Theory of Corruption: "Power Rots Eventually"

  This is where your term limits come in. This is the most aggressive part of your local setup.

  *   **The Danger of Career Politicians:** The lifetime ban after two terms presupposes that staying in power too long makes you dangerous. It assumes that even if a councillor is popular, being in the town hall for 20 years disconnects them from reality. They start caring more about keeping their job than doing the job.
  *   **Elections aren't Enough:** Usually, people say, "If a politician is corrupt or useless, just vote them out." Your council rejects that. They think the system itself is rigged to favour incumbents (people already in charge). So, they force them out even if the voters still like them.
  *   **Juries are Safe:** Randomly selected jurors don't get corrupt in the same way because they go back to their normal jobs afterwards. They have no career to protect.

  **The Unspoken Rule:** Short-term power is okay; long-term power is inherently corrupting. Elections check bad politicians, but term limits check the *system* of politics itself.

  ### 3. The Theory of Legitimacy: "Consent vs. Representation"

  Your mate asked why we trust random people for juries but not laws. The answer lies in what makes a decision "legitimate" (meaning, why we agree to obey it).

  *   **Elected Councillors (Consent):** Their legitimacy comes from **authorisation**. We voted for them, so they have the mandate to make tough calls. Even if they make a unpopular decision, we accept it because they won the election. This is why the Citizens' Assembly was advisory only. The Assembly represented the *people*, but the Council represented the *vote*. In this system, the vote trumps the people.
  *   **Juries/Assemblies (Descriptive Representation):** Their legitimacy comes from **mirroring**. A jury is legitimate because it looks like a cross-section of society. It's not about who voted for whom; it's about ensuring no single group dominates.

  **The Unspoken Rule:** For binding laws, we need the authority of the vote. For finding the truth or checking fairness, we need the wisdom of the crowd.

  ---

  ### What is Strictly Needed vs. What Just "Fits"?

  To answer your question about what this view *requires* versus what is just accidental:

  **Strictly Needed (The Core Logic):**
  1.  **The Distinction between Judging and Governing:** The system *must* believe that deciding guilt (jury) is different to deciding tax rates (council). If you believe random people should do both, the whole thing collapses into a sortition-only system (like ancient Athens).
  2.  **The Fear of Entrenchment:** The term limits *must* be based on the idea that time in office degrades quality. If you believed experience made politicians better, the term limits would be nonsense.
  3.  **Elected Supremacy:** The Citizens' Assembly *had* to be advisory. If the random assembly could overrule the elected council, it would break the chain of accountability. Who do you vote out if you hate the assembly's decision? You can't. So, elected officials must hold the final pen.

  **What Just "Fits" (Contingent Details):**
  1.  **The Specific Term Length:** It doesn't strictly matter if it's two four-year terms or three three-year terms. The principle is "limited tenure," not the specific maths.
  2.  **Ignoring the Assembly:** The council *could* have accepted the housing report. The theory allows them to listen to random citizens, but it doesn't *force* them to obey. Ignoring it fits the theory (elected supremacy), but listening to it would have fit the "wisdom of the crowd" vibe better.
  3.  **Mandatory Jury Service:** You could have voluntary juries. The compulsion is just a practical way to ensure enough people turn up, not a philosophical necessity.

  ---

  ### What if we Swapped in the Opposite View?

  If you adopted the opposite philosophical view, here is how your local politics would change:

  **View A: "Professionalism and Experience are Best" (The Technocrat View)**
  *   **Juries:** Abolished. Replaced by professional judges or panels of experts who know the law properly. "Why trust a random plumber with a complex fraud case?"
  *   **Councillors:** No term limits. If they are doing a good job, let them stay for 20 years. Experience matters.
  *   **Assemblies:** Abolished. A waste of money. Consult experts or business leaders instead.

  **View B: "The People are Always Right" (The Radical Democracy View)**
  *   **Juries:** Expanded. Juries decide the sentencing, not just the verdict.
  *   **Councillors:** Abolished or made random. Pick 60 people by lottery to run the city for a year. No elections.
  *   **Assemblies:** Binding. If the Citizens' Assembly votes for a housing plan, it becomes law automatically. The elected council becomes just an admin team to implement it.

  ### The Verdict for your Pub Argument

  You can tell your mate the system isn't incoherent; it's **cautious**.

  It trusts you enough to send someone to prison (jury), because that's about basic fairness. It trusts you enough to give advice on housing (assembly), because that's about community needs. But it doesn't trust you (or itself) enough to hand over the keys to the treasury without an election, and it doesn't trust any politician enough to let them keep those keys forever.

  It's a system designed on the assumption that **everyone is a bit risky**: the ordinary person might lack expertise, but the politician will definitely get power-hungry. So, it mixes them together to keep both in check. It's not perfect philosophy, but it's very practical British politics.
