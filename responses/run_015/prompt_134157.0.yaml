      *   *Wait, the prompt asks for "no single node represents the rule."*
      *   *Okay, let's look at **Proof of Work (Nakamoto Consensus)** specifically regarding **Longest Chain Rule**.*
      *   *Scenario:* An attacker tries to rewrite history (51% attack attempt but fails).
      *   *Mechanism:* Nodes simply extend the chain with the most cumulative difficulty.
      *   *The "Reason":* "The attacker's chain is invalid because it lacks work."
      *   *The Catch:* No node calculates "global work." They only see local tips. The "validity" is a global property that emerges from local myopic rules.
      *   *Why "Just Causation" fails:* Because we rely on the chain for *trust*. We treat the rejection as *justified*, not just physical.
      *   *Why "Network Reason" fails:* The network doesn't "know" it rejected an attacker. It just followed the path of least resistance/highest weight.
      *   *The Knot:* The normativity (security) is a property of the *system state*, but the *logic* is only local. The reason floats between the nodes.

      *   *Let's try one more specific angle:* **Multiparty Computation (MPC) signing.**
      *   *Setup:* A private key is sharded among 100 nodes. To sign a transaction, 51 must cooperate.
