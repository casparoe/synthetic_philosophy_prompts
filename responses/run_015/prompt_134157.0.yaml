      *   **Constraint 7:** Don't just say "it's emergent" — show the tension.

  2.  **Deconstruct the Core Concept:**
      *   *Free-floating rationales:* The idea that a reason (a "why" that implies justification, not just cause) can exist independently of a mental agent holding that reason.
      *   *The Scenario:* A distributed system rejects a bad transaction/block/update.
      *   *The Problem:* The system acted *as if* it had a reason ("this is invalid"), but no part of the system actually "knows" or "holds" that rule in a way that resembles human reasoning.

  3.  **Select the Specific Mechanism:**
