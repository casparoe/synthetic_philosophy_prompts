      *   **The Conceptual Knot:**
          *   The "Reason" (validity) exists only in the *relation* between the malicious input and the honest majority, but that relation is never computed as a whole object. It is *enacted* but not *represented*. The rationale is real in its effects but nonexistent in its ontology.

