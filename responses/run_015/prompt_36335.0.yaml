prompt: |-
  Wikipedia's core editorial rule is that content must be verifiable: every claim in an article must be supported by published, independent, reliable sources, and the policy states that "Even if you are sure something is true, it must have been published in a reliable source before you can add it." So an editor who personally witnessed an event may not report it, and a claim that happens to be true but appears in no source must be removed — while, oddly, a second-hand newspaper report of dubious accuracy is perfectly admissible. Compare this with the courtroom, where firsthand knowledge licenses testimony and second-hand reports are excluded as hearsay, or with ordinary conversation, where we assert what we ourselves know. What norm of assertion does the Wikipedia practice presuppose? Is it best reconstructed as a knowledge norm, a truth norm, a justification norm, or something like a purely institutional norm of trackability — and does the same norm explain why hearsay is welcome on Wikipedia but barred from the witness stand? Please reconstruct the implicit norm, distinguish what the practice strictly requires from what it merely fits well with, and say where the practice is philosophically underdetermined, i.e., which rival norms of assertion would license it equally well.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**
      *   **Core Subject:** Wikipedia's Verifiability Policy (WP:V).
      *   **Key Feature:** Content must be supported by published, independent, reliable sources. Personal knowledge (even if true) is excluded. Second-hand reports (even if dubious) are admissible if published in a "reliable source."
      *   **Comparison:** Contrast with Courtrooms (firsthand knowledge = good, hearsay = bad) and Ordinary Conversation (assert what you know).
      *   **Questions to Answer:**
          1.  What norm of assertion does Wikipedia practice presuppose?
          2.  Is it Knowledge, Truth, Justification, or Institutional Trackability?
          3.  Does the same norm explain the courtroom/Wikipedia divergence regarding hearsay?
          4.  Distinguish strict requirements from what merely "fits well."
          5.  Identify where the practice is philosophically underdetermined (rival norms that license it equally well).

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *Knowledge Norm (KN):* "Assert $p$ only if you know $p$." Wikipedia explicitly bans personal knowledge. So, it's not the editor's knowledge. Is it the *source's* knowledge? Maybe, but sources can be wrong.
      *   *Truth Norm (TN):* "Assert $p$ only if $p$ is true." Wikipedia admits false claims if they are in reliable sources (e.g., a retracted study, a reported rumor). So, it's not strictly truth.
      *   *Justification Norm (JN):* "Assert $p$ only if you have justification for $p$." Wikipedia requires citations. But the justification is external (the source), not internal to the editor.
      *   *Institutional/Trackability Norm:* "Assert $p$ only if $p$ is traceable to a recognized authority." This seems closest. It's about *verifiability* by the reader, not *truth* by the editor.
      *   *Courtroom vs. Wikipedia:* Courtrooms seek *fact-finding* (truth/liability). Wikipedia seeks *consensus documentation* (what the world says). Hearsay is bad in court because the original observer can't be cross-examined. Hearsay is good on Wikipedia because the publication *is* the artifact being documented.

  3.  **Developing the Core Argument:**
      *   Wikipedia's norm is not about the *truth* of the proposition ($p$), but about the *attributability* of the proposition.
      *   It's a norm of **Documented Consensus** or **Public Recordability**.
      *   Let's call it the **Norm of Citable Authority** or **Institutional Verifiability**.
      *   *Key Distinction:* Wikipedia articles are not claims about the world; they are claims about *what reliable sources say about the world*. (The "Map vs. Territory" distinction).

  4.  **Addressing the Specific Questions:**

      *   *What norm?* It's not Knowledge (editor doesn't need to know). It's not Truth (falsehoods in sources stay until corrected by other sources). It's a **Norm of Public Justification via Authority**.
      *   *Courtroom Divergence:* Courtrooms aim for *ontological truth* (what happened). Wikipedia aims for *epistemic consensus* (what is currently accepted as reportable). Hearsay in court breaks the chain of accountability. Hearsay on Wikipedia *establishes* the chain of publication.
      *   *Strict Requirements vs. Good Fit:*
          *   Strict: Must have a citation.
          *   Fit: Sources are usually reliable (but not strictly required to be *true*, just *published*).
      *   *Underdetermination:*
          *   Rival Norm 1: **Social Trust Norm.** (Assert what the community trusts).
          *   Rival Norm 2: **Liability Shield Norm.** (Assert only what you can defend legally/operationally).
          *   Rival Norm 3: **Deflationary Norm.** (Assert "Source S says $p$" rather than "$p$").

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the paradox. Wikipedia prioritizes *verifiability* over *truth*.
      *   *Reconstructing the Norm:* It's not a standard epistemic norm (Knowledge/Truth). It's an **Institutional Norm of Attributability**. The assertion isn't "$p$ is true," it's "$p$ is published."
      *   *Courtroom Comparison:* Crucial point. Court = Truth-finding mechanism (Hearsay blocks cross-examination). Wikipedia = Summary mechanism (Publication *is* the evidence of notability/existence).
      *   *Strict vs. Fit:*
          *   Strict: Citation needed.
          *   Fit: Sources *should* be accurate, but accuracy isn't the gatekeeper; publication status is.
      *   *Underdetermination:*
          *   *Norm A:* **Responsibility Norm.** (Don't assert what you can't defend).
          *   *Norm B:* **Consensus Norm.** (Assert what the epistemic community agrees on).
          *   *Norm C:* **Deflationary Semantic Norm.** (The content of the article is actually meta-assertions).

  6.  **Refining the Philosophical Terminology:**
      *   Use Williamson (Knowledge Norm) as a counterpoint.
      *   Use Habermas (Discourse Ethics) or Social Epistemology concepts.
      *   Distinguish between *First-order claims* (The earth is round) and *Second-order claims* (Sources say the earth is round). Wikipedia operates on the second order but presents as the first.

  7.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical.
      *   Check that all parts of the prompt are answered.
      *   *Self-Correction during drafting:* I initially thought about calling it a "Justification Norm." But justification usually implies logical support for truth. Wikipedia's justification is procedural (was it published?). I need to emphasize the *procedural/institutional* nature over the *epistemic* nature.
      *   *Refining the Hearsay point:* In court, hearsay is excluded because the original declarant isn't under oath. On Wikipedia, the "original declarant" (the newspaper) *is* the object of study. If the NYT says it, the fact that they said it is the verifiable fact.

  8.  **Final Structure:**
      1.  **The Core Norm:** Institutional Verifiability / Attributability.
      2.  **Comparison (Court vs. Wiki):** Truth-finding vs. Consensus-mapping.
      3.  **Strict Requirements vs. Good Fit:** Citation vs. Accuracy.
      4.  **Philosophical Underdetermination:** Liability, Consensus, and Deflationary accounts.

  9.  (Self-Correction on "Hearsay"): Be careful. Wikipedia doesn't welcome *all* hearsay. It welcomes hearsay *from reliable sources*. A blog post quoting a newspaper is usually less reliable than the newspaper. The prompt says "second-hand newspaper report." I need to clarify that the "reliability" designation is the key filter, not the "second-hand" nature.

  10. **Finalizing the Norm Name:** "Norm of Public Attributability." Or "Norm of Documented Consensus." Let's go with **Norm of Public Attributability**.

  11. **Writing the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  The Wikipedia verifiability policy presents a fascinating case study in social epistemology because it inverts the standard hierarchy of evidence found in both everyday conversation and legal proceedings. To reconstruct the norm of assertion presupposed by this practice, we must distinguish between the *truth-value* of a claim and the *status* of a claim within an information system.

  ### 1. Reconstructing the Implicit Norm: The Norm of Public Attributability

  Wikipedia does not operate under a **Knowledge Norm** ("Assert $p$ only if you know $p$"), because editors are explicitly forbidden from asserting what they personally know but cannot cite. It does not operate under a strict **Truth Norm** ("Assert $p$ only if $p$ is true"), because Wikipedia frequently contains claims that are factually false but were published in reliable sources (e.g., reported scientific errors, historical misconceptions, or uncorrected news reports), provided those claims are attributed.

  Instead, the practice presupposes a **Norm of Public Attributability** (or Institutional Verifiability). This norm can be reconstructed as:

  > **Assert $p$ in the encyclopedia only if $p$ is attributable to a recognized public authority.**

  Under this norm, the primary function of an article is not to map the territory (reality) directly, but to map the *map-making consensus* of the world. The assertion is not strictly "$p$ is the case," but rather "$p$ is the current state of public record."

  This explains why personal knowledge is excluded: personal knowledge is private and uncheckable by the community. It explains why a "dubious" newspaper report is admissible: the newspaper is a public institution, and its publication creates a verifiable artifact. The norm prioritizes **intersubjective checkability** over **ontological accuracy**.

  ### 2. The Courtroom Divergence: Truth-Finding vs. Consensus-Mapping

  The prompt asks if the same norm explains why hearsay is welcome on Wikipedia but barred from the witness stand. The answer is **no**; the divergence exists because the two institutions serve fundamentally different epistemic ends, governed by different norms.

  *   **The Courtroom (Norm of Liability and Truth-Finding):** The legal system aims to establish *what actually happened* to assign liability or innocence. Hearsay is excluded because it breaks the chain of accountability; the original observer cannot be cross-examined. The court requires **Firsthand Epistemic Access** to minimize error in high-stakes decisions.
  *   **Wikipedia (Norm of Documented Consensus):** Wikipedia aims to summarize *what the world says happened*. It is a secondary source about primary sources. If the *New York Times* reports a rumor, the "fact" that Wikipedia records is not the rumor's truth, but the rumor's *existence in the public sphere*.

  Therefore, the "hearsay" on Wikipedia is not treated as evidence of the event, but as evidence of the *report*. The norm of Public Attributability welcomes "hearsay" (second-hand reports) because the publication itself is the unit of verification, not the underlying reality.

  ### 3. Strict Requirements vs. Good Fit

  To understand the norm precisely, we must separate what the policy *mandates* from what it *contingently achieves*.

  **Strict Requirements (The Constitutive Rules):**
  1.  **Citation:** Every claim must be linked to a specific, published location.
  2.  **Independence:** The source must be independent of the subject (no self-publishing).
  3.  **Reliability Designation:** The source must be vetted by the community as "reliable" (usually meaning editorial oversight exists).
  4.  **No Original Synthesis:** Editors cannot combine Source A and Source B to reach Conclusion C unless a source has already done so.

  **Merely "Fits Well" (Contingent Correlations):**
  1.  **Truth:** The policy assumes reliable sources are *usually* true, but truth is not a requirement for inclusion. If a reliable source prints a lie, Wikipedia records the lie (often with context), because removing it would violate verifiability.
  2.  **Editorial Knowledge:** It fits well if the editor knows the claim is true, but this is irrelevant to the norm.
  3.  **Source Accuracy:** It fits well if the source is accurate, but the norm only requires the source to be *published* with editorial oversight. A retracted study is still a published artifact that may need to be documented as "formerly believed."

  ### 4. Philosophical Underdetermination: Rival Norms

  The Wikipedia practice is philosophically underdetermined because multiple distinct normative frameworks could justify the exact same editorial rules. Three rival norms license the practice equally well:

  **A. The Norm of Institutional Liability (The Legalistic Reconstruction)**
  *   **Norm:** "Assert only what you can defend against a challenge without relying on your own reputation."
  *   **Rationale:** This views Wikipedia not as an epistemic project, but as a risk-management project. By forbidding personal knowledge, the platform shields itself from accusations of bias or libel. If a claim is challenged, the editor points to the source, not their own brain.
  *   **Fit:** This explains the exclusion of eyewitness testimony perfectly (too risky) and the inclusion of newspaper reports (shifts liability to the publisher).

  **B. The Norm of Social Consensus (The Sociological Reconstruction)**
  *   **Norm:** "Assert only what the epistemic community has ratified."
  *   **Rationale:** Knowledge is treated as a social construct. A fact is not a fact until it is socially validated through publication. Personal experience is "anecdotal" until it enters the social discourse.
  *   **Fit:** This explains why a dubious report is admissible (it entered the discourse) while a true but unpublished event is not (it remains outside the social construct of knowledge).

  **C. The Deflationary Semantic Norm (The Linguistic Reconstruction)**
  *   **Norm:** "Do not assert $p$; assert 'Source $S$ asserts $p$'."
  *   **Rationale:** This suggests Wikipedia articles are not making first-order claims about the world at all. They are making second-order claims about literature.
  *   **Fit:** This dissolves the paradox entirely. If the sentence "The earth is flat" appears in an article about flat earth theories, the actual assertion is "Flat earthers claim the earth is flat." Under this norm, truth and personal knowledge are irrelevant because the truth condition applies to the *attribution*, not the *content*.

  ### Conclusion

  Wikipedia's practice is best reconstructed as a **Norm of Public Attributability**, which prioritizes the *traceability* of information over its *truth* or the *editor's knowledge*.

  However, this norm is underdetermined. It functions simultaneously as a **liability shield** (protecting the platform), a **consensus engine** (recording social agreement), and a **deflationary semantic system** (reporting on reports). The divergence from the courtroom arises because the courtroom seeks *ontological truth* (requiring direct access), while Wikipedia seeks *documented consensus* (requiring public artifacts). In the courtroom, hearsay is a broken link in the chain of truth; on Wikipedia, the publication *is* the link, regardless of where it leads.
