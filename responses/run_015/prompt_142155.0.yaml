  ### The Case of the Pharmacy Robots

  **The Setting**
  A high-throughput automated pharmacy fills prescriptions using two robotic arms, Arm A and Arm B, working over a fixed 24-second "Batch Window." Each second is a discrete time slot ($t=0$ to $23$). An "Event" occurs when an arm is active (grabbing a vial). We are estimating the frequency of **Collisions** (both arms active in the same second).

  **The Setup**
  The robots run on deterministic cycles. The "Practitioner" knows the duty cycles (how often each arm is active) but treats the timing as uncorrelated, multiplying the single-arm frequencies to estimate the collision rate. The "Formalist" applies the Maximum Entropy principle constrained *only* by those single-arm frequencies.

  **The Two Variants**
  The variants differ by exactly one parameter: **The Gear Ratio** (the cycle lengths and duty structure). All other specifications (window length, start synchronization) are identical.

  *   **Variant 1 (Coprime):** Arm A cycles every **3s** (Active 1s). Arm B cycles every **4s** (Active 1s).
  *   **Variant 2 (Harmonic):** Arm A cycles every **6s** (Active 2s: slots 0, 2). Arm B cycles every **8s** (Active 2s: slots 1, 3).

  *Note: In Variant 2, the "Active 2s" pattern is a known engineering spec (e.g., "double-pick on even phases"), not a hidden variable.*

  ---

  ### The Demonstration

  **1. Single-Process Frequencies (Unchanged)**
  In both variants, over the 24-second window:
  *   **Arm A:** Active 8 times. Frequency $P(A) = 8/24 = 1/3$.
  *   **Arm B:** Active 6 times. Frequency $P(B) = 6/24 = 1/4$.

  **2. The Practitioner's Estimate**
  Both the Practitioner (multiplying factors) and the Formalist (MaxEnt with marginal constraints) calculate:
  $$ P(A \cap B) = P(A) \times P(B) = \frac{1}{3} \times \frac{1}{4} = \frac{1}{12} $$
  **Estimated Collisions:** $24 \times (1/12) = \mathbf{2}$.

  **3. The True Enumeration**

  | Time ($t$) | Variant 1: A (Cycle 3) | Variant 1: B (Cycle 4) | **V1 Collision** | Variant 2: A (Cycle 6, Even) | Variant 2: B (Cycle 8, Odd) | **V2 Collision** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | 0 | **1** | **1** | **YES** | **1** | 0 | 0 |
