answer: |-
  Based on the four verdicts you provided, your friend is navigating a tension between the **moral content** of a myth (what values it promotes) and its **political function** (what actions it justifies). Her judgments suggest she is not simply judging historical accuracy, but rather the *ethical utility* of the memory in a present-day political context.

  Here is an analysis of the principles governing her judgments, the prediction for your 1961 Capital case, and a test case to distinguish her underlying logic.

  ### 1. The Three Plausible Principles

  To fit her four verdicts (Lost Cause/Kosovo = Toxic; Masada/Dunkirk = Redeemable), she is likely operating on a combination of these three rules:

  **Principle A: The Anti-Revanchism Rule (Consequentialist)**
  *   **Definition:** A myth is toxic if it is used to delegitimize a settled peaceful order or to justify the reclamation of lost territory/power through aggression. It is redeemable if it fosters acceptance of reality or resilience without demanding blood debt.
  *   **Fit:** Explains why the **Lost Cause** (sought to restore white supremacy/old order) and **Kosovo** (fuels irredentism) are toxic, while **Dunkirk** (acceptance of evacuation to fight another day for democracy) and **Masada** (no territory to reclaim, purely spiritual survival) are safe.
  *   **Prediction for 1961 Case:** **Toxic.** Although the *State* teaches acceptance of the 1989 settlement, the *Separatists* are actively using the myth to argue the current order is illegitimate. If the myth sustains a movement that threatens the peace (like Kosovo), it fails this rule.

  **Principle B: The Anti-Scapegoating Rule (Structural)**
  *   **Definition:** A myth is toxic if it explains defeat through the "Stab in the Back" trope (internal betrayal/treason) rather than honest sacrifice or overwhelming odds. This trope inherently demonizes domestic political opponents as traitors.
  *   **Fit:** Explains why **Kosovo** (Prince Lazar betrayed by Vuk Branković) and the **Lost Cause** (often framed as betrayed by industrial might or "Northern aggression" rather than the morality of slavery) are toxic. **Dunkirk** and **Masada** involve no traitors; the defeat is attributed to circumstance or choice, preserving internal unity.
  *   **Prediction for 1961 Case:** **Toxic.** The narrative explicitly assigns blame to a *local commander who betrayed the marchers*. This structural element creates a permanent class of "traitors" within the national story, which is the precise mechanism separatists use to claim illegitimacy.

  **Principle C: The Civic vs. Exclusionary Rule (Moral Content)**
  *   **Definition:** A myth is toxic if it grounds national dignity in ethnic or racial exclusivity. It is redeemable if it grounds dignity in civic values (democracy, non-violence) or universal human endurance.
  *   **Fit:** **Lost Cause** (White supremacy) and **Kosovo** (Orthodox ethnic nationalism) fail. **Dunkirk** (Defense of democracy) and **Masada** (Universal right to exist/dignity) pass.
  *   **Prediction for 1961 Case:** **Redeemable (Ambiguous).** The State narrative emphasizes "unarmed," "non-violent persistence," which sounds civic. However, the Separatist movement's nature is unspecified. If we assume the Separatists are ethno-nationalist, it fails; if they are merely political, it passes. This principle is the weakest predictor here without more data.

  ### 2. The Prediction and Consistency

  **Most Likely Judgment: Toxic.**

  If your friend wants to remain consistent with her track record, she should judge the 1961 Capital myth as **toxic** (or at least requiring active demythologization, similar to Kosovo).

  **Why?**
  While the *State's* intended lesson mimics Dunkirk (resilience), the *narrative architecture* mimics Kosovo (Betrayal). Her verdict on Kosovo was not just that it causes war, but that the *myth itself sustains grievance*. The inclusion of the "Betrayal" element in the 1961 case provides the structural hook that allows separatists to weaponize the memory.

  In her view, a myth that contains a "Stab in the Back" clause is inherently unstable because it invites the very revanchism she condemned in the Kosovo and Lost Cause cases. Even if the State currently teaches resilience, the presence of the "Traitor" in the story makes the myth *capable* of sustaining illegitimacy claims. Consistency with the Kosovo verdict demands she flag the betrayal element as dangerous, regardless of the State's current benign intent.

  ### 3. Underdetermination and Implicit Principles

  If her precedents genuinely underdetermine the case, her choice will reveal which principle is actually dominant:

  *   **If she judges it Redeemable:** She is implicitly adopting a **Pedagogical Intentionalism** principle. She believes a myth is defined by its *official curriculum*, not its *political weaponization*. She would be arguing that as long as the State teaches non-violence, the separatist interpretation is an aberration that doesn't condemn the myth itself. This would mark a departure from her Kosovo stance, suggesting she views the 1961 "State" as more trustworthy than the Serbian Orthodox Church.
  *   **If she judges it Toxic:** She is implicitly adopting a **Weaponizability** principle. She believes a myth must be judged by its *worst plausible usage*. If the narrative structure (Betrayal) allows bad actors to undermine democracy, the myth is toxic regardless of the official lesson. This aligns most closely with her Kosovo verdict.

  ### 4. The Discriminating Hypothetical

  To distinguish whether she prioritizes **Anti-Revanchism (Consequences)** or **Anti-Scapegoating (Structure)**, propose this case:

  > **The "Vigilant Republic" Case:**
  > A stable democracy commemorates a failed coup attempt from 50 years ago. The official myth teaches: "The coup failed because a rogue General tried to betray the constitution, but loyal citizens stopped him." The narrative focuses entirely on the **General's Betrayal** (Scapegoating). However, the lesson taught is explicitly **non-revanchist**: "We must vote to ensure no single leader has too much power." The myth is used to strengthen democratic institutions, and no group uses it to claim land or overturn the government.

  **How this distinguishes the rules:**
  *   **If she calls this Toxic:** She follows the **Anti-Scapegoating Rule**. She believes the "Betrayal" structure is inherently poisonous to social trust, even if it currently has peaceful consequences. (This would confirm the 1961 Case should be Toxic).
  *   **If she calls this Redeemable:** She follows the **Anti-Revanchism Rule**. She believes the "Betrayal" element is acceptable as long as it does not fuel irredentism or instability. (This would suggest the 1961 Case might be Redeemable *if* the State can suppress the separatists).

  Given her firm stance on Kosovo (where the betrayal of Vuk Branković is central to the toxicity), I suspect she will call the "Vigilant Republic" toxic, which confirms you should expect her to reject the 1961 Capital myth despite its peaceful official framing.
