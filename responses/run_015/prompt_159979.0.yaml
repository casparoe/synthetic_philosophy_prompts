answer: |-
  You are right to be suspicious; most expositions of these theories are post-hoc stories rather than engineering specs. Here is the specification you asked for, reordered from viability up to implementation, with the missing pieces added.

  ### The Spec: Desiderata for a Prediction-Only Agent

  1.  **The Dark Room Escape (Viability)**
      *   **Requirement:** The objective function must minimize *expected* surprise over future states, not just current reconstruction error.
      *   **Case:** If you only minimize current error, the agent finds a dark room and freezes; minimizing *expected* error forces it to visit states where its model is uncertain but resolvable (epistemic value).
      *   **Status:** **Non-Negotiable** (Without this, the agent dies or freezes).

  2.  **Falsifiable Death (Vacuity)**
      *   **Requirement:** The theory must specify a configuration where the agent minimizes its metric but fails to survive or interact.
      *   **Case:** If minimizing Free Energy is mathematically equivalent to "staying alive" by definition, the theory is a tautology; you need a failure mode where the math works but the agent starves.
      *   **Status:** **Non-Negotiable** (This is your falsifiability condition).

  3.  **Sensory Cancellation (Agency)**
      *   **Requirement:** There must be a mechanism to attenuate the precision of sensory data predicted by the agent's own motor commands (efference copy).
      *   **Case:** Without this, moving the sensor creates massive prediction error that the agent must resolve by stopping movement; attenuation allows it to distinguish self-motion from external events.
      *   **Status:** **Non-Negotiable** (Without this, the agent cannot move).

  4.  **Preference Origin (Goal Source)**
      *   **Requirement:** The system must specify where "preferred" states come from if not from an external reward signal.
      *   **Case:** Pure prediction has no direction; you either need hard-coded priors over outcomes (which look like goals) or an intrinsic drive to reduce model variance (which looks like curiosity).
      *   **Status:** **Non-Negotiable** (You cannot get directed behavior from undirected prediction alone).

  5.  **Temporal Horizon (Planning Depth)**
      *   **Requirement:** The spec must define how many time-steps into the future the agent optimizes its predictions.
      *   **Case:** A horizon of zero is reactive reflex; a horizon of infinity is computationally impossible; the choice dictates whether the agent can plan around obstacles or just reacts to them.
      *   **Status:** **Non-Negotiable** (This defines the complexity of behavior).

  6.  **Dynamic Precision (Attention)**
      *   **Requirement:** Precision weights must be optimized as parameters of the variational bound, not as a separate reward signal.
      *   **Case:** If precision is fixed, the agent cannot ignore noisy sensors; if it is learned via a separate loss, you have smuggled in a reward function; it must fall out of the evidence bound.
      *   **Status:** **Taste** (Some implementations treat this as fixed hyperparameters, but dynamic is required for attention).

  7.  **Tractable Inference (Compute)**
      *   **Requirement:** The theory must state the specific approximation (e.g., Laplace, Mean-Field) used to avoid exact Bayesian integration.
      *   **Case:** Exact inference is exponential in state space; if the theory doesn't specify the approximation, you cannot estimate your compute budget or know where the errors come from.
      *   **Status:** **Non-Negotiable** (You cannot run exact Bayesian inference on a grid world agent).

  8.  **Physical Grounding (The Name)**
      *   **Requirement:** The theory must admit that the thermodynamic link is an isomorphism, not a causal mechanism.
      *   **Case:** Your agent does not dissipate heat to minimize variational free energy; claiming otherwise is mysticism that obscures the actual gradient descent happening in code.
      *   **Status:** **Non-Negotiable** (Don't let the physics analogy do the work).

  9.  **Hierarchical Separation (Architecture)**
      *   **Requirement:** The model must separate fast sensory causes from slow contextual causes.
      *   **Case:** A flat network can learn dynamics, but separating "self" from "world" usually requires different timescales or layers to prevent state entanglement.
      *   **Status:** **Taste** (You can hack this in a flat RNN, but hierarchy makes it cleaner).

  ---

  ### The Conflicts: What You Can't Have

  You cannot satisfy all of these simultaneously. Here are the breaking points:

  1.  **No Reward vs. Dark Room Escape:** Pure prediction minimization *always* leads to the dark room. To escape it without an external reward, you must introduce **Priors over Outcomes** (Preferences) or **Information Gain** terms. If you insist on *zero* preferences baked in, the agent will not move. You must drop the "No Reward" constraint slightly to allow "Priors over States" which function mathematically identical to goals.
  2.  **Small Compute vs. Temporal Horizon:** Minimizing *expected* free energy (to solve the Dark Room) requires simulating future trajectories. If your budget is tiny, you cannot look far ahead. You must drop the **Temporal Horizon** to 1 or 2 steps, which limits the agent to reactive behaviors rather than planning.
  3.  **Flat Net vs. Hierarchical Separation:** A flat recurrent network can approximate hierarchy, but it struggles to separate "self-caused" from "external" noise without explicit architectural bias. If you keep the **Flat Net**, you will struggle with **Sensory Cancellation** stability.

  **The Single Most Filtering Requirement:**
  **The Dark Room Escape.** This kills 90% of pure predictive coding models. Most implementations minimize *current* prediction error, which guarantees immobility. Only models that minimize *expected future* error (Active Inference) survive this, but they demand the compute and preference priors you are trying to avoid.

  ---

  ### Scorecard: Three Flavors

  **1. Hierarchical Predictive Coding**
  This architecture excels at perception and sensory cancellation but lacks a native mechanism for action selection, so your agent will likely minimize error by freezing in place. It passes the compute and architecture checks but fails the Dark Room requirement unless you bolt on a policy selector.

  **2. Active Inference / Expected Free Energy**
  This solves the Dark Room by minimizing expected surprise over futures, but it requires heavy computation for trajectory simulation and smuggles in "goals" as priors over outcomes. It passes the viability and agency checks but will likely blow your small compute budget and violate your "no reward" intuition.

  **3. Engineering MPC + Curiosity**
  This fits your compute budget and produces interesting behavior explicitly, but it violates your core constraint by adding an intrinsic reward bonus term. It is the most robust engineering solution, but it fails the philosophical spec because it explicitly optimizes a reward function rather than emerging from pure prediction.
