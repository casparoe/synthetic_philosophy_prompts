answer: |-
  **Project Title:** The Geometry of Sympathy: Distance, Administration, and the Moral Foundations of Adam Smith's Anti-Colonialism

  **Project Summary**
  Standard interpretations of Adam Smith's critique of empire bifurcate into two camps: the economic, which views his opposition to colonies as a critique of mercantilist inefficiency and monopoly; and the moral, which locates his objection in the injustice of coercion and violence. This project argues that this dichotomy obscures a deeper structural tension in Smith's thought. In *The Wealth of Nations* (WN), Smith argues that distant legislators lack the local knowledge required for efficient administration (an information/principal-agent problem). In *The Theory of Moral Sentiments* (TMS), he argues that sympathy naturally decays over geographical distance (a moral-psychological limit).

  This research asks: Is Smith's anti-colonialism fundamentally a critique of *incentive alignment*, or is it a critique of the *breakdown of the sympathy mechanism* required for a moral market society? I propose that these are not separate arguments but causal links. The economic inefficiency of empire is not merely a technical failure of calculation; it is the economic symptom of a prior moral rupture caused by distance. When the "impartial spectator" cannot bridge the gap between metropole and colony, capital is misdirected not just because of bad policy, but because the moral feedback loop required for prudent investment is severed.

  **Intervention and Significance**
  Current scholarship often treats WN and TMS as complementary but distinct projects, or attempts to reconcile them under a unified "natural liberty" framework. Neither approach adequately addresses the specific mechanics of *distance*. By reading Smith's passages on colonial administration alongside his examples of sympathy decay, this project moves beyond the question of whether Smith "liked" or "hated" empire. Instead, it investigates whether Smith believes empire is *impossible* to govern justly because the psychological preconditions for market morality (mutual sympathy and accountability) cannot scale over imperial distances.

  This distinction matters for how we understand Smith's normative claims. If the problem is purely inefficiency, colonial reform is theoretically possible. If the problem is the decay of sympathy, then empire is inherently unjust because it structurally disables the moral psychology of the colonizer. This project clarifies whether Smith's free trade argument is a technical fix or a moral necessity.

  **Methodology and Approach**
  The research will rely on close textual analysis of two specific clusters of texts:
  1.  **WN Book IV (Colonies) and Book V (Expense of Defense):** Focusing on passages regarding the inability of distant administrators to grasp local conditions and the misdirection of stock.
  2.  **TMS Part III and IV:** Focusing on the "influence of distance" on sympathy and the formation of the impartial spectator.

  I will test the hypothesis that Smith's concept of "fictitious" or misdirected capital is the economic correlate to the "fictitious" sympathy of the distant observer. I will not treat "fictitious capital" as a modern financial anachronism, but as Smith's description of capital employed without a clear view of its real return—a condition made inevitable when the investor cannot sympathize with the labor or conditions producing that return.

  **Work Plan (12 Weeks)**

  *   **Weeks 1–4: Textual Excavation and Mapping**
      *   Compile and annotate all passages in WN regarding colonial administration, distance, and local knowledge.
      *   Compile and annotate all passages in TMS regarding geographical distance, sympathy decay, and the spectator.
      *   Create a cross-reference matrix to identify terminological overlaps (e.g., "neglect," "ignorance," "order").
  *   **Weeks 5–8: Argument Synthesis and Drafting**
      *   Draft the core argument: linking the information problem in WN to the sympathy problem in TMS.
      *   Develop the section on "fictitious capital" as the point where moral failure becomes economic loss.
      *   Write the first full draft of the paper (target 10,000–12,000 words).
  *   **Weeks 9–12: Refinement and Stress-Testing**
      *   Review draft against counter-arguments (e.g., instances where Smith admits distance can be overcome by institutions).
      *   Refine the conclusion to address the "inefficiency vs. injustice" question explicitly.
      *   Final polish and formatting for submission to a peer-reviewed journal or conference.

  **Deliverables**
  The primary output will be a complete article-length manuscript suitable for submission to a journal in political economy or intellectual history (e.g., *History of Political Economy* or *Adam Smith Review*). Additionally, a 2,000-word policy brief summary will be produced, outlining the implications of this reading for modern theories of foreign aid and intervention.

  **Risk Assessment and Failure Conditions**
  The primary risk is textual incoherence. Smith wrote over decades, and his views shifted.
  *   **Success:** The texts reveal a consistent logic where moral distance causes informational blindness, leading to economic waste.
  *   **Failure:** The texts flat-out contradict each other (e.g., WN suggests distance is a manageable administrative cost, while TMS suggests it is an insurmountable moral barrier) with no bridge in Smith's own logic.
  *   **Mitigation:** If a unified theory proves impossible, the project will pivot to documenting the *tension* itself as evidence of Smith's struggle to reconcile commercial expansion with moral psychology. This "negative result" is still a valuable contribution, proving that the economic/moral split is inherent to Smith's system, not just a later interpretive error.

  **Feasibility and Scope Assessment**
  Three months is sufficient for this specific textual analysis, provided the scope remains tightly focused on the *mechanism of distance*. It is too short for a broader intellectual history of Smith's colonial policy or a comprehensive survey of secondary literature. I will avoid general discussions of "free trade" unless they directly relate to the distance/sympathy mechanism. The "fictitious capital" angle will be included only if it emerges naturally from the textual cross-reading; if it feels forced, it will be dropped to preserve the core moral-psychological argument. This ensures the project remains manageable within the stipend period.
