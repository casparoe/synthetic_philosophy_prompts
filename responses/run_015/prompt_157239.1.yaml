answer: |-
  This is a sharp framing. The toilet paper (TP) episode is indeed a near-perfect petri dish for this debate because the physical constraints (pulp, machine retooling) are distinct from the behavioral dynamics (panic, signaling), yet they fused to create a single phenomenon.

  Here is a disciplined mapping of the episode through both lenses, an evaluation of your non-paraphrasability test, and a verdict on what the episode actually proves.

  ### 1. The Individualist Mapping
  **The Units:**
  *   **Households:** Utility maximizers facing uncertainty. The decision variable is *buffer stock*. The input is *perceived risk of lockdown*.
  *   **Store Managers:** Algorithm followers. The decision variable is *reorder point*. The input is *sales velocity*.
  *   **Mill Managers:** Capital allocators. The decision variable is *production line configuration*. The input is *long-term contract volume (commercial vs. residential)*.
  *   **Truckers/Logistics:** Route optimizers. The decision variable is *load efficiency*.

  **The Explanation:**
  Methodological Individualism (MI) explains the panic as a cascade of locally rational updates.
  1.  Households updated probability of supply disruption upward.
  2.  Buying more TP became a dominant strategy (if others buy, I must; if others don't, I have surplus).
  3.  Store algorithms detected velocity spikes and ordered more, amplifying the signal upstream (the Bullwhip Effect).
  4.  Mills could not switch lines because the capex decision was made years prior by individuals responding to different price signals (commercial TP is higher margin/different spec).

  **Does the choice of unit change the explanation?**
  Yes. If the unit is the **firm**, the explanation is "profit maximization under constraint." If the unit is the **individual worker/manager**, the explanation is "adherence to standard operating procedures." MI demands you bottom out at the human agent. If you stop at "The Firm decided," the individualist argues you are using a shorthand for a nexus of contracts and decisions. In the TP case, the mill didn't switch because the *engineers and CFOs* calculated the switching cost exceeded the expected short-term gain.

  ### 2. The Holist Mapping
  **The Social-Level Items:**
  *   **The Supply Chain:** Not just the sum of trucks and mills, but the *topology* of connections.
  *   **Just-in-Time (JIT) Norms:** A systemic constraint that exists regardless of who occupies the manager roles.
  *   **Consumer Confidence:** A macro-variable that exerts downward causation on individual spending.
  *   **Restocking Conventions:** The social expectation that shelves *should* be full, which makes empty shelves salient signals.

  **Do they do real explanatory work?**
  The Holist argues yes, because these items possess **structural inertia**.
  *   **JIT:** You cannot explain JIT by looking at a single manager. It is a competitive equilibrium enforced by the market. A single manager choosing "Just-in-Case" inventory gets fired for inefficiency. The constraint is external to the individual.
  *   **Commercial/Residential Split:** This is a technological lock-in at the industry level. It explains why supply didn't flow from hotels to homes. An individualist has to model every machine spec; a holist says "The System has two separate channels."
  *   **Brittleness:** This is a property of the network, not the nodes. You can have perfect individual actors and still have a fragile system.

  **Are they shorthand?**
  The individualist says yes: "JIT" is just millions of people choosing low inventory. The holist says no: "JIT" is a *rule of the game* that restricts the moves available to the players.

  ### 3. Evaluating Your "Non-Paraphrasability Test"
  *Your Test:* A social-level claim earns its keep only if you can't restate it as a claim about particular individuals plus an aggregation rule without losing something explanatory.

  **The Verdict:**
  This is a robust test (essentially a version of the "supervenience" debate), but it hinges entirely on what you mean by **"losing something explanatory."**

  **Where it might let in too much:**
  *   **Conciseness vs. Causality:** "The supply chain broke" is easier to say than "10,000 truckers and managers made suboptimal routing decisions." If "explanatory power" includes *compression*, almost all social facts pass. But compression isn't causation.
  *   **Emergent Properties that are Epiphenomenal:** You can have patterns that are non-paraphrasable in practice (too complex) but ontologically reducible. If the test allows "practical impossibility of paraphrase," it validates holism too easily.

  **Where it might let in too little:**
  *   **Relational Facts:** "There was a shortage." You argue this survives the test. I agree, but not because it's about operating rules. It survives because a shortage is a **relational fact** between demand and distribution capacity at a specific price point.
      *   *Individualist reduction:* "Demand > Supply."
      *   *The Loss:* If you reduce "shortage" to "people wanted more than existed," you lose the *mechanism of failure*. A shortage in a market economy implies a failure of price signaling or logistics, not just physical scarcity. If you paraphrase it purely as individual desire, you lose the *institutional* failure (e.g., price gouging laws preventing clearance, or logistics rigidities).
  *   **Counterfactual Leverage:** The test should be: *Can I intervene on the social fact without intervening on every individual?*
      *   I can change a regulation (social fact) that alters the TP outcome without convincing a single household to change their mind. Therefore, the regulation has explanatory power independent of individual psychology.

  **Refinement:** Your test is strong, but change "losing something explanatory" to "losing **interventional leverage**." If the social-level description allows you to predict the outcome of a policy change that the individual-level description misses (because it ignores structural constraints), it passes.

  ### 4. Evidence to Settle It
  You asked for evidence, not philosophy. Here is what would discriminate between the two:

  1.  **Agent-Based Modeling (ABM):**
      *   *Setup:* Build a simulation with agents following simple MI rules (maximize utility, follow reorder points). No "system" variables.
      *   *Test:* Does the TP panic emerge?
      *   *Result:* If the panic emerges solely from local interactions, MI is sufficient. If you *must* hard-code a systemic constraint (like "lines cannot switch") to get the historical result, Holism gets a point. (Spoiler: ABMs of the Bullwhip Effect suggest MI rules *do* generate the volatility, but the *duration* of the TP shortage required the physical constraints).

  2.  **Natural Experiment (Cross-Jurisdictional):**
      *   *Setup:* Compare regions with identical individual demographics/economics but different **supply chain structures** or **norms**.
      *   *Test:* Did places with more redundant inventory norms (e.g., certain cost-plus retail models vs. lean JIT models) have shorter shortages?
      *   *Result:* If inventory norms predict recovery speed better than individual hoarding rates, structural holism wins.

  3.  **The Counterfactual of Price:**
      *   *Setup:* In a pure MI market, price rises to clear shortage.
      *   *Test:* In jurisdictions where price gouging laws were strictly enforced vs. lax.
      *   *Result:* If shelves cleared faster where prices were allowed to spike, the "shortage" was a pricing mechanism failure (institutional/holist). If shelves stayed empty regardless, it was a physical production constraint (holist/technological). If shelves cleared based on individual rationing, it's behavioral.

  ### 5. Does the Episode Vindicate a Theory?
  **It vindicates neither exclusively; it vindicates Multi-Level Causation.**

  *   **Individualism wins the Spark:** The *onset* of the panic was behavioral. It was a coordination failure driven by individual expectations. An ABM can replicate the run on the bank (or TP) with simple agents.
  *   **Holism wins the Drag:** The *duration* of the shortage was structural. The inability to retool mills from commercial to residential grade is a technological/industrial fact that no amount of individual willpower could overcome quickly. The "brittleness" of JIT is a system-level property optimized for efficiency, not resilience. No single manager chose brittleness; it was selected for by the market environment.

  **The Synthesis:**
  The individualist explains why people *ran*. The holist explains why the *track* was narrow and had no exits. You need both to explain the crash.

  ### 6. The Normative Silence
  This is the most critical point for your writing. **The MI vs. Holism debate is ontological/methodological, not normative.** It is silent on blame and prescription.

  *   **Blame:**
      *   *MI Frame:* Blames the hoarders (Tragedy of the Commons). They failed to cooperate.
      *   *Holist Frame:* Blames the system designers (JIT architects, policymakers). They built a fragile system.
      *   *Reality:* The framework you choose *determines* where you look for blame. The framework does not *tell* you who is to blame.

  *   **Prescription:**
      *   *MI Prescription:* Change incentives. Tax hoarding, allow price spikes, inform individuals better.
      *   *Holist Prescription:* Change structures. Mandate strategic reserves, diversify supply chains, decouple commercial/residential lines.
      *   *Silence:* Neither framework can tell you if **Resilience** is more valuable than **Efficiency**. That is a value judgment external to the science. The MI model says JIT is "optimal" given cost constraints. The Holist model says JIT is "risky" given systemic shocks. Which one *should* we prefer? Science cannot answer that.

  **Conclusion for your piece:**
  The TP panic shows that Methodological Individualism is excellent at explaining **propagation** (how the shock moved), while Holism is necessary to explain **constraint** (why the shock couldn't be absorbed). Your non-paraphrasability test holds up if you define "explanatory loss" as "loss of ability to identify structural intervention points." But be wary: choosing a frame is often a political act disguised as a methodological one. The frame you pick tells your reader who the villain is before you've even described the crime.
