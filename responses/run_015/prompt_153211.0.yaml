prompt: |-
  Twelve months ago the river behind our house came over its bank for the third time in five years. In the aftermath I was asked to join the grants committee of a regional flood-recovery fund: a small independent charity that makes discretionary payments to households and small businesses whose losses fall outside insurance and outside the statutory scheme. We meet monthly, we dispose of roughly forty applications a quarter, our decisions are effectively final, and each of us has about twenty minutes and a four-page file per case. None of us is a philosopher or an economist. Our decisions have to be consistent between committee members, and defensible both to an applicant who appeals and to the regulator who reads our minutes.

  Our governing instrument directs us, in its own words, to compensate "losses arising from circumstances the claimant could not reasonably have foreseen or avoided" and to weigh "the extent to which the claimant's own decisions contributed to the loss". Those two clauses pull against one another, and we argue about them every month. Reading a little of the political-philosophy literature on luck egalitarianism — the thought, roughly, that it is unfair for someone to fare worse than others through no fault or choice of their own, while inequalities that genuinely reflect choice are not, on that ground, an injustice — clarified the shape of our problem without giving me any way to decide a case. So what I would like is a procedure.

  Please give me a decision rule my committee could actually run on a file: the questions in order, what counts as an answer to each that is good enough given the evidence we hold, where the sequence stops with a no, and where it must hand the decision to a person because the remaining question is one of values rather than of fact. I care at least as much about the translation as about the outcome: which distinctions from that literature have to survive the move into something a lay committee can apply in twenty minutes, which can be dropped without losing anything, and where a simplified rule will systematically misfire.

  Four knots in particular, which I would like untied rather than merely noted.

  First, the instrument conflates foreseeability with avoidability. A loss can be clearly foreseeable and still not avoidable at any cost the claimant could bear; or avoidable in principle and yet not something a reasonable person would have anticipated. I want the two prised apart, and I want to know which of them is doing the real work.

  Second, our deputy chairman argues that we compensate the wrong thing: that what is unchosen is not the flood but the exposure to it, and that a household which has spent a decade in a property nobody will insure at an affordable premium has already suffered the relevant misfortune whether or not the water ever comes in. That strikes me as right and also unworkable at our budget. Please take a position on whether a rule should be built around realisation or around exposure, and say what follows for a fund that can only pay out after the event.

  Third, we cannot pay everyone, so in practice we compare applicants with one another. That turns an award into a judgement that this claimant is more deserving than that one, rather than a judgement that this claimant's misfortune was unchosen. Is that comparative element corrupting the rule, or unavoidable once there is a budget?

  Fourth, a no from us is not a catastrophe: we signpost to other funds, and nobody sleeps in a flooded house because of our decision. Does that let us keep the harshness worry — the objection that a principle which allocates according to choice will visit ruin on people whose choices were foolish or poorly informed — outside the rule, as a separate safety net, or must it be built in?

  Please then run the procedure as a worked application on three shapes of case from our last quarter. The first: a couple who bought the cheapest house in the village eleven years ago, the only one within their mortgage offer, on a street that the flood maps already placed in the highest risk band — they were told at purchase, they stayed, and their insurance lapsed three years ago when the premium exceeded a month's take-home pay. The second: a widower in his seventies in a cottage his family has occupied since the 1890s, flooded four times, who has twice refused a buy-out above market value because he will not leave. The third: a bakery on a low-lying industrial estate that was outside the flood maps when the lease was signed in 2014 and is now inside them, whose owners have put their savings into fitting it out and cannot relocate without losing the business. At least one of these should come out as a no, and where it does I want that stated plainly rather than softened.

  Finally, tell me what the procedure cannot settle — we also get repeat claims from the same property, about which we are currently hopeless — and what an applicant is entitled to be told about why they were refused.

  Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision rule and analysis:

  1.  **Analyze the Request:**

      *   **User:** Member of a flood-recovery grants committee (laypeople, not philosophers/economists).
      *   **Context:** Small independent charity, discretionary payments for losses outside insurance/statutory schemes. 40 apps/quarter, 20 mins/file, 4-page file. Decisions must be consistent and defensible.
      *   **Governing Instrument:** Compensate "losses arising from circumstances the claimant could not reasonably have foreseen or avoided" AND weigh "the extent to which the claimant's own decisions contributed to the loss".
      *   **Philosophical Lens:** Luck Egalitarianism (unfair to fare worse through no fault/choice; inequalities reflecting choice are not unjust).
      *   **Task:** Create a practical decision rule (procedure) for the committee.
      *   **Specific Constraints/Questions to Address:**
          1.  Foreseeability vs. Avoidability (prised apart, which does the work?).
          2.  Realisation vs. Exposure (compensate the flood or the risk? Budget constraints?).
          3.  Comparative Judgement (ranking deservingness vs. unchosen misfortune).
          4.  Harshness Objection (can safety nets be external, or must they be internal?).
      *   **Worked Examples:** Apply the rule to three specific cases (Couple in high-risk zone/lapsed insurance; Widower refusing buy-out; Bakery moved into risk zone). At least one "No".
      *   **Limitations:** What the procedure *can't* settle (repeat claims) and what applicants are entitled to know (reasons for refusal).
      *   **Tone/Style:** British English, practical, rigorous but accessible, plain speaking on refusals.

  2.  **Deconstruct the Philosophical Tension (Luck Egalitarianism in Practice):**

      *   *Core Principle:* Compensate for "brute luck" (unchosen circumstances), not "option luck" (chosen risks).
      *   *The Instrument's Tension:* "Could not foresee/avoid" vs. "Claimant's decisions contributed."
      *   *The Committee's Reality:* 20 minutes, limited budget, need consistency.
      *   *The Goal:* A flowchart-style algorithm that embeds the philosophy without requiring philosophical debate at every turn.

  3.  **Address the Four Knots:**

      *   *Knot 1: Foreseeability vs. Avoidability.*
          *   *Analysis:* Foreseeability is epistemic (did they know?). Avoidability is practical (could they act?). A risk can be known but unavoidable (e.g., no other housing). A risk can be unknown but avoidable (e.g., didn't check maps, but cheap alternative existed).
          *   *Decision:* Avoidability is the real work. Foreseeability is evidence of choice. If you couldn't avoid it, it doesn't matter if you foresaw it (you had no choice). If you could avoid it, foreseeability determines if it was a *reckless* choice or an *informed* choice.
          *   *Rule:* Focus on "Reasonable Avoidability." Foreseeability acts as a modifier on responsibility.

      *   *Knot 2: Realisation vs. Exposure.*
          *   *Analysis:* Deputy Chairman says compensate exposure (the risk). User says unworkable for budget.
          *   *Decision:* Must be Realisation. A fund based on exposure would be insolvent immediately (everyone in a flood zone is "exposed"). The mandate is "losses arising from...", implying the event happened.
          *   *Rule:* Trigger is the *event* (the flood), but the assessment looks at the *history of exposure* to determine choice.

      *   *Knot 3: Comparative Judgement.*
          *   *Analysis:* Budget constraints force ranking. Pure luck egalitarianism is non-comparative (did *this* person suffer brute luck?). But scarcity forces comparison.
          *   *Decision:* Unavoidable. The rule must acknowledge this. It's not just "Did they deserve this?" but "Do they deserve this *more* than the next person?"
          *   *Rule:* Introduce a "Priority Threshold." If everyone passes the threshold, budget dictates the cut-off. But the *eligibility* rule must remain principled to avoid arbitrariness.

      *   *Knot 4: Harshness Objection.*
          *   *Analysis:* If we deny someone because they made a "foolish" choice, do they starve? User says "nobody sleeps in a flooded house."
          *   *Decision:* External safety nets are sufficient *if* they are reliable. Since the user confirms other funds exist for immediate crisis, the committee can afford to be principled on *recovery* vs. *relief*.
          *   *Rule:* Keep the rule strict on responsibility. Hardship is for other agencies. This fund is for *unjust* loss, not *all* loss.

  4.  **Drafting the Decision Rule (The Procedure):**

      *   Need a step-by-step flow.
      *   Time limit: 20 mins.
      *   Evidence: 4-page file.
      *   *Step 1: The Trigger.* (Did the flood cause the loss? Is it outside insurance/statutory?)
      *   *Step 2: Foreseeability.* (Was the risk knowable?)
      *   *Step 3: Avoidability.* (Did they have a reasonable alternative?)
      *   *Step 4: Contribution.* (Did they mitigate?)
      *   *Step 5: The Handoff.* (Where does value judgement enter?)

      *Refining the "Handoff":* The rule needs to stop before asking "Is this fair?" and ask "Is this factually supported?" The value judgement is the weighting of the factors, which needs a scoring mechanism or a clear "Stop" point. Let's use a "Presumption of Eligibility" that can be rebutted by evidence of choice.

      *Revised Approach:* A "Rebuttable Presumption" model.
      1.  Presume loss is compensable (Brute Luck).
      2.  Check for "Choice Indicators" (Option Luck).
      3.  If Choice Indicators exist, check for "Constraint Indicators" (Necessity).
      4.  If Choice outweighs Constraint -> No.

  5.  **Developing the Worked Examples:**

      *   *Case 1 (Couple, High Risk, Lapsed Insurance):*
          *   Foreseeable? Yes (maps).
          *   Avoidable? Yes (bought cheapest, but could have rented or bought elsewhere? File says "only one within mortgage offer"). This is the crunch. Financial constraint vs. Choice.
          *   Insurance lapsed: Active choice.
          *   *Verdict:* Likely No (or partial). The lapse is a clear choice. The purchase was constrained but the retention was not. Let's make it a **No** to satisfy the prompt's requirement for at least one plain refusal. The lapse is the killer.
      *   *Case 2 (Widower, Refused Buy-out):*
          *   Foreseeable? Yes (flooded 4 times).
          *   Avoidable? Yes (accepted buy-out).
          *   Constraint? Emotional attachment isn't a physical constraint.
          *   *Verdict:* **No**. He chose the risk over the exit.
      *   *Case 3 (Bakery, Maps Changed):*
          *   Foreseeable? No (maps changed 2014 vs now).
          *   Avoidable? No (sunk costs, business tied to location).
          *   *Verdict:* **Yes**. This is pure brute luck.

      *Wait, I need at least one No.* Case 1 and 2 are strong Nos. Case 3 is a strong Yes. I will argue Case 1 is a No based on the insurance lapse (active decision to drop protection) even if the purchase was constrained. Case 2 is a No based on refusal of buy-out. Case 3 is a Yes.

  6.  **Addressing "What the Procedure Cannot Settle":**

      *   Repeat claims. If we pay once, do we pay again? Luck egalitarianism says if the first payment fixed the "brute luck," the second flood is now a known risk (option luck).
      *   Reasons for refusal: Transparency vs. Dignity. They are entitled to the *reason*, not the *debate*.

  7.  **Drafting the Content (incorporating British English and Tone):**

      *   *Tone:* Professional, empathetic but firm, administrative but philosophically grounded.
      *   *Structure:*
          1.  Introduction (acknowledging the tension).
          2.  Untying the Four Knots (the theoretical underpinning).
          3.  The Decision Procedure (The Algorithm).
          4.  Worked Applications (The three cases).
          5.  Limitations & Communication (Repeat claims & Refusals).

  8.  **Refining the "Foreseeability vs. Avoidability" Knot:**
      *   I need to be clear: Foreseeability establishes *knowledge*. Avoidability establishes *agency*.
      *   If I knew (Foreseeable) + I could have acted (Avoidable) = High Responsibility.
      *   If I knew + I couldn't act = Low Responsibility.
      *   If I didn't know + I could have acted (negligence) = Medium Responsibility.
      *   If I didn't know + I couldn't act = No Responsibility.
      *   *The Rule:* Focus on **Reasonable Avoidability**. Foreseeability is just a multiplier of responsibility.

  9.  **Refining the "Realisation vs. Exposure" Knot:**
      *   Stick to Realisation. Paying for exposure is an insurance model, not a charity grant model. The fund is for *recovery*, not *risk subsidy*.

  10. **Refining the "Comparative" Knot:**
      *   Acknowledge that the rule establishes *eligibility*, but the budget establishes *awards*. However, to be defensible, eligibility must be binary based on principle, not just "who looks sadder."

  11. **Refining the "Harshness" Knot:**
      *   Confirm that external safety nets allow the committee to be strict. If the alternative was destitution, the rule would need a "hardship override." Since it's not, the rule can remain principled.

  12. **Final Review against Constraints:**
      *   British English (e.g., "programme", "centre", "cheque", "favour").
      *   20-minute constraint (keep the rule short).
      *   Plain speaking on refusals.
      *   Address repeat claims.

      *(Self-Correction during drafting)*: Make sure the distinction between "insurance lapse" and "cannot afford insurance" is clear in Case 1. The prompt says "premium exceeded a month's take-home pay." That sounds like *cannot afford*, not just *chose not to*. However, they stayed in the house. If they couldn't afford insurance, could they afford the house? This is the "contribution to loss" clause. I will rule that staying without insurance when risk is known is the decisive factor.

      *(Refining Case 1)*: They bought the cheapest house. Maps showed risk. They were told. They stayed. Insurance lapsed because of cost.
      *Argument for Yes:* Economic coercion. They had no choice but to be exposed.
      *Argument for No:* They chose to retain the asset without protection.
      *Decision:* To make the rule robust, the "Insurance Lapse" when risk is known is a failure of mitigation. I will rule this a **No** to demonstrate the "contribution to loss" clause biting hard. It distinguishes between the flood (bad luck) and the *uninsured loss* (choice).

      *(Refining Case 2)*: Widower. Refused buy-out.
      *Decision:* **No**. Clear case of option luck. He chose the risk over the exit.

      *(Refining Case 3)*: Bakery. Maps changed.
      *Decision:* **Yes**. Clear brute luck.

      *Wait, the prompt asks for "At least one of these should come out as a no".* I have two Nos. That works. I will ensure the language is plain.

      *Repeat Claims:* This is crucial. If we pay for the first flood, the second flood is now *foreseeable*. The rule must address this. I will add a specific clause on "Successive Claims."

      *Communication:* Applicants need to know *which* clause failed them (Foreseeability, Avoidability, or Mitigation).

  13. **Final Polish:** Check the "Twenty Minutes" constraint. The rule needs to be a checklist, not an essay. I will format it as a "Decision Matrix."

      *Let's check the Knot 1 again:* "Which of them is doing the real work?"
      *Answer:* Avoidability. Foreseeability is irrelevant if you couldn't have moved. Foreseeability only matters if you could have avoided it.

      *Let's check Knot 3 again:* "Is that comparative element corrupting the rule?"
      *Answer:* It corrupts the *outcome* (who gets paid when funds run out) but not the *principle* (who is eligible). The rule must define eligibility. Rationing is a separate administrative step.

      *Let's check Knot 4:* "Keep harshness outside?"
      *Answer:* Yes, provided the "signposting" is robust. The rule shouldn't be softened by pity, or it becomes arbitrary.

      *Okay, ready to write.*
answer: |-
  **To:** The Grants Committee
  **From:** [Your Name/Advisor]
  **Subject:** A Decision Procedure for Flood-Recovery Grants

  You are asking for a mechanism to translate a philosophical principle (luck egalitarianism) into an administrative tool that works within twenty minutes and four pages of evidence. The tension in your governing instrument—between "unforeseen/unavoidable" and "claimant's contribution"—is not a bug; it is the engine. It asks you to distinguish between *misfortune* (brute luck) and *gamble* (option luck).

  Below is the proposed decision procedure, followed by an analysis of the four knots you identified, the worked applications, and the limits of the rule.

  ### Part 1: The Decision Procedure (The "20-Minute Algorithm")

  This rule is designed to be run sequentially. If a case fails a step, the decision is **No**, unless the "Override" clause applies. The committee does not debate philosophy; it checks boxes against the file evidence.

  **Step 1: The Threshold (2 Minutes)**
  *   **Q1:** Is the loss directly caused by the flood event in question?
  *   **Q2:** Is the loss excluded from all insurance policies and statutory government schemes?
  *   **Q3:** Is the claimant a household or small business (per governing instrument)?
  *   *If any answer is No:* **Reject.** (Reason: Out of scope).
  *   *If all Yes:* Proceed to Step 2.

  **Step 2: Foreseeability (5 Minutes)**
  *   **Q4:** At the time the claimant entered the situation (bought property/signed lease), was the flood risk knowable to a reasonable person?
      *   *Evidence:* Flood maps at the time, solicitor reports, verbal warnings noted in file.
      *   *Answer:* **Known** / **Unknown**.
  *   **Q5:** Has the risk increased since then due to new data or climate shifts?
      *   *Evidence:* Updated Environment Agency maps, local council notices.
      *   *Answer:* **Yes** / **No**.
  *   *Finding:* If **Unknown** at entry and **No** increase since, presumption is **Eligible**. Proceed to Step 4.
  *   *Finding:* If **Known** at entry or **Yes** increase since, proceed to Step 3.

  **Step 3: Avoidability (8 Minutes)**
  *   **Q6:** Could the claimant have avoided the exposure at a reasonable cost?
      *   *Test:* Could they have rented elsewhere? Bought elsewhere? Relocated the business?
      *   *Evidence:* Mortgage offers, rental listings at the time, business relocation costs vs. turnover.
      *   *Answer:* **Reasonable Alternative Existed** / **No Reasonable Alternative**.
  *   **Q7:** Did the claimant take reasonable mitigation steps given the risk?
      *   *Test:* Insurance (if available/affordable), flood barriers, drainage maintenance.
      *   *Evidence:* Insurance quotes, lapse notices, photos of mitigation.
      *   *Answer:* **Mitigated** / **Did Not Mitigate**.
  *   *Decision Rule:*
      *   If **No Reasonable Alternative** AND **Mitigated**: **Eligible**.
      *   If **Reasonable Alternative Existed**: **Ineligible** (Choice outweighs misfortune).
      *   If **No Reasonable Alternative** BUT **Did Not Mitigate**: **Ineligible** (Failure of responsibility).

  **Step 4: The Value Handoff (5 Minutes)**
  *   **Q8:** Is there evidence of exceptional vulnerability not captured above?
      *   *Test:* Severe disability, age, dependency that made "reasonable alternatives" practically impossible despite financial possibility.
      *   *Action:* If Yes, the file is flagged for **Chair's Discretion**. This is the only point where values override facts.
  *   *If No:* The Step 3 decision stands.

  **Step 5: The Successive Claim Check (Mandatory)**
  *   **Q9:** Has this property claimed before?
      *   *If Yes:* The risk is now definitively **Known**. Step 2 is automatically "Known". Step 3 (Avoidability) becomes stricter: the expectation to relocate or exit increases with every payout. A third claim on the same property requires evidence that relocation is *physically* impossible, not just financially tight.

  ---

  ### Part 2: Untying the Four Knots

  Here is how the procedure above addresses your specific theoretical concerns.

  **1. Foreseeability vs. Avoidability**
  *   **Which does the work?** Avoidability. Foreseeability is merely evidentiary. If a risk was foreseeable but unavoidable (e.g., no other housing existed within their budget), the claimant is not responsible for the loss. Conversely, if a risk was unforeseeable but easily avoidable (e.g., they didn't check maps but could have rented safely nearby), they bear some responsibility for negligence.
  *   **The Translation:** The rule treats Foreseeability as a trigger to examine Avoidability. If the risk was unknown, we presume eligibility. If known, we demand proof of constraint. This prevents the committee from blaming people for being poor (foreseeable risk) while holding them accountable for refusing exits (avoidable risk).

  **2. Realisation vs. Exposure**
  *   **Position:** The rule must be built around **Realisation** (the flood event), not Exposure (the risk).
  *   **Why:** Your deputy chairman is philosophically consistent but fiscally naive. Compensating exposure turns the fund into a universal basic income for flood zones. You are a recovery fund, not an insurance underwriter.
  *   **Consequence:** We do not pay people for living in a risk zone. We pay them when the water comes in, *provided* their presence in the zone was not a reckless choice. The "exposure" argument is handled in Step 3 (Avoidability): if they chose to stay exposed when they could have left, they are refused *after* the flood.

  **3. The Comparative Element**
  *   **Position:** The comparative element is **unavoidable but distinct**.
  *   **Why:** Luck egalitarianism is non-comparative (did *I* suffer brute luck?). Budgets are comparative (do *you* deserve this more than *her*?).
  *   **Translation:** This procedure establishes **Eligibility**, not **Priority**. It creates a binary (In/Out) based on principle. If you have more eligible applicants than money, you ration by severity of loss *among the eligible*. Do not corrupt the eligibility rule to manage the budget. If the budget is exhausted, deny grants based on "funds depleted," not "less deserving." This protects the committee from making moral rankings between two victims of brute luck.

  **4. The Harshness Objection**
  *   **Position:** Keep the harshness **outside the rule**.
  *   **Why:** You confirmed that a "No" does not leave anyone sleeping in floodwater. You signpost to other funds. If you build a "hardship override" into this rule, you blur the line between *recovery* (fixing unjust loss) and *welfare* (fixing poverty).
  *   **Translation:** Step 4 (Value Handoff) allows for exceptional vulnerability, but Step 3 remains strict. If a claimant made a foolish choice, you say No. Their subsequent hardship is the problem of the statutory safety net, not this charity. Softening the rule to prevent hardship makes your decisions arbitrary and indefensible to the regulator.

  ---

  ### Part 3: Worked Applications

  Here is the procedure applied to the three cases from your last quarter.

  **Case 1: The Couple (High Risk, Lapsed Insurance)**
  *   **Step 1:** Pass. Loss from flood, outside insurance/statutory.
  *   **Step 2 (Foreseeability):** **Known.** Maps placed street in highest risk band at purchase. They were told.
  *   **Step 3 (Avoidability):**
      *   *Q6 (Alternative):* They bought the "only one within mortgage offer." This suggests financial constraint. However, renting remained an option. *Finding:* **Reasonable Alternative Existed** (Renting vs. Buying in flood zone).
      *   *Q7 (Mitigation):* Insurance lapsed because premium > 1 month's pay. While costly, going uninsured in a known high-risk zone is a failure of mitigation.
  *   **Decision:** **No.**
  *   **Reasoning:** While the purchase was financially constrained, the decision to *retain* the asset without insurance in a known high-risk zone constitutes a contribution to the loss. The fund compensates for misfortune, not for the consequences of unmanaged risk.
  *   **Plain Statement for Applicant:** "Your grant is refused. While we acknowledge financial constraints at purchase, the flood risk was known to you. By choosing to retain the property without insurance cover, you assumed the financial risk of flooding. This falls under the 'claimant's own decisions contributed to the loss' clause."

  **Case 2: The Widower (Repeat Flood, Refused Buy-Out)**
  *   **Step 1:** Pass.
  *   **Step 2 (Foreseeability):** **Known.** Flooded four times previously.
  *   **Step 3 (Avoidability):**
      *   *Q6 (Alternative):* A buy-out above market value was offered and refused.
      *   *Q7 (Mitigation):* Refusal to leave prevents avoidance.
  *   **Decision:** **No.**
  *   **Reasoning:** This is a clear case of Option Luck. The misfortune is no longer unchosen; it is the price of a chosen lifestyle.
  *   **Plain Statement for Applicant:** "Your grant is refused. You have been offered a buy-out scheme which would have removed you from the risk zone. By choosing to remain in the property despite repeated flooding and a viable exit offer, the loss is considered a consequence of your decision, not an unforeseen circumstance."

  **Case 3: The Bakery (Maps Changed)**
  *   **Step 1:** Pass.
  *   **Step 2 (Foreseeability):** **Unknown.** Lease signed 2014 when outside flood maps. Risk increased due to new data/climate.
  *   **Step 3 (Avoidability):**
      *   *Q6 (Alternative):* Relocation means losing the business (sunk costs, fit-out). No reasonable alternative for the *business entity*.
      *   *Q7 (Mitigation):* Owners put savings into fit-out (presumably compliant at the time).
  *   **Decision:** **Yes.**
  *   **Reasoning:** This is Brute Luck. The rules of the game changed after they placed their bet.
  *   **Plain Statement for Applicant:** "Your grant is approved. At the time you committed to this location, the flood risk was not recorded. The change in flood mapping was outside your control and could not reasonably have been foreseen."

  ---

  ### Part 4: Limitations and Communication

  **What the Procedure Cannot Settle: Repeat Claims**
  The procedure struggles with the "sunk cost" of repeated misfortune. Under strict luck egalitarianism, after the first flood, the risk becomes "Known." Therefore, a second claim should theoretically be harder to justify.
  *   **The Problem:** If you pay the first time, you help them recover. If you deny the second time because "now they know," you punish them for being poor enough to still be there.
  *   **The Fix:** You need a **Progressive Exit Policy**.
      *   *1st Claim:* Presume Eligible (unless gross negligence).
      *   *2nd Claim:* Stricter Avoidability test (must prove they tried to sell/leave).
      *   *3rd Claim:* Presume Ineligible (unless physical disability prevents move).
      *   *Why:* This signals that the fund is for *recovery to safety*, not for *subsidising residence in a danger zone*. Currently, you are "hopeless" here because you treat every flood as a new event. It is not. It is a continuing state of exposure.

  **What an Applicant is Entitled to Know**
  Applicants are entitled to the **classification of their refusal**, not the **deliberation**.
  *   **Do not say:** "We felt another case was sadder," or "We debated whether your choice was reasonable."
  *   **Do say:** "Your application failed at Step 3: Avoidability. The evidence shows a reasonable alternative existed which was not taken."
  *   **Why:** This protects the committee from appeals based on emotion. It forces the appeal to be about *facts* (e.g., "Here is proof no rental existed"), which you can verify in 20 minutes.

  ### Summary of Trade-offs
  *   **Dropped:** Nuanced debates about "reasonable person" standards. We use "knowable/unknown" and "alternative existed/did not exist."
  *   **Survived:** The core distinction between Brute Luck (compensate) and Option Luck (do not compensate).
  *   **Systematic Misfire:** The rule will systematically deny help to the "working poor" who take calculated risks to get on the housing ladder (Case 1). This is the price of a limited budget. If you soften the rule to help them, you must deny the Bakery (Case 3), which is a clearer case of injustice. You must accept that some unjust hardships will not be your responsibility to fix.

  This procedure allows you to look an applicant in the eye and say: "We are not judging your suffering. We are judging whether this fund is the right instrument to fix it." That is defensible.
