          *   *Attribution:* "Introduced by Bernard Williams and developed by Thomas Nagel."
              *   *Fact Check:* Williams' "Moral Luck" (1976) and Nagel's "Moral Luck" (1976) are the seminal papers. They are often cited together. Williams is often credited with coining the term or at least popularizing the specific problem in modern ethics. This is acceptable for an intro seminar.
          *   *The Truck Driver Example:*
