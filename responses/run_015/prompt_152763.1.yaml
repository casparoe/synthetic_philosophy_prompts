answer: |-
  Good morning. Or, to be more precise: good morning to the aggregates of form and consciousness currently assembled in this hall.

  It is a distinct pleasure to welcome you to this convergence of causes and conditions we conventionally label "Anatta and Institutional Memory." I say "conventionally" advisedly. As we gather under the banner of a Philosophy Department and a Buddhist Studies Center, we are immediately confronted by the very tension that brings us together. To host a workshop is to presuppose a host, a guest, and a duration. Yet, if we look closely at the *paramattha-sacca*, the ultimate truth, there is no stable "workshop" persisting from day one to day two. There are only momentary *dhammas* arising and passing away. There is no enduring department, no continuous institution, and, if the Abhidhamma is our guide, no enduring "you" to receive my welcome.

  And yet, here we are. The coffee is hot. The schedule is printed. The administrators who funded this event are watching.

  This is the pragmatic necessity of *sammuti-sacca*, conventional truth. We must speak as if the Philosophy Department has a memory, as if it persists through the turnover of faculty and the renovation of buildings. In this, the institution serves as a perfect analogy for the person. To the analytic philosophers here, this will sound familiar. You have spent decades debating whether personal identity is a matter of psychological continuity, narrative construction, or four-dimensional temporal parts. You ask: is the person a "worm" extending through time, or a series of stages linked by memory?

  To the scholars of Theravada Abhidhamma, this sounds like the ancient debate over the *citta-vithi*, the stream of consciousness-moments. You know that what we call a "mind" is a rapid succession of discrete events, causally connected but ontologically distinct.

  So, why put these groups in the same room? Because the institutional analogy forces both sides to confront the utility of the fiction.

  We are not here to deny the settled doctrine of *anatta*. It is agreed among us that there is no *atman*, no permanent, unchanging self-essence. That is the baseline. But we are here to probe the contested boundaries. For the philosophers, the question is whether a narrative or relational account of identity can survive the dissolution of the subject. For the Buddhist scholars, the question is whether *anatta* is being reduced to a Western "bundle theory," or if there is room for a functional continuity that doesn't collapse into essentialism.

  Consider the *pudgala-vada*, the personalist view. Historically, this was often dismissed by orthodox Theravada as a heresy, a subtle re-introduction of self. But was it? Or was it a sophisticated attempt to account for moral responsibility and memory without positing a metaphysical soul? Some specialists argue it was a genuine philosophical alternative, not merely a doctrinal strawman. If an institution can bear responsibility for its past actions without having a "soul," perhaps the *pudgala* was pointing toward a similar conventional reality.

  Over the next two days, we will navigate this friction. We will ask: When a department changes its curriculum, its staff, and its location, what persists? Is it a causal chain of *dhammas*? Is it a narrative we tell ourselves to make sense of the budget?

  We must walk a fine line. If we cling too tightly to the convention, we reify the self and the institution. If we deny the convention too aggressively, we cannot function, we cannot speak, and we certainly cannot justify the grant money that made this gathering possible.

  So, let us proceed with a dual awareness. Let us engage in the robust debates of analytic metaphysics and the textual rigor of Buddhist studies, knowing that we are doing so within a framework that is ultimately empty, yet indispensably real for the duration of this causal sequence we call a workshop.

  May your discussions be sharp, your coffee sufficient, and your attachment to the outcome minimal. Thank you.
