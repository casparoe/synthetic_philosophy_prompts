answer: |-
  ### Outline of Approach

  1.  **Acknowledge the Room Dynamics:** Start by recognizing the physical and disciplinary setup. Philosophers care about *justification* (why blame is permissible); clinicians care about *utility* (whether blame helps or harms the patient). I need to validate both without collapsing them into one.
  2.  **Define the Stakes of "Standing":** Briefly articulate the standard philosophical view: hypocrisy negates standing. If I do X, I lose the authority to call you out on X. This is the "moral status" model.
  3.  **Introduce the Clinical Friction:** Contrast this with the therapeutic reality. In addiction work especially, a clinician who presents as morally "pure" or untouched by struggle often loses the room. Trust is built on shared humanity, not moral superiority.
  4.  **Propose the Pivot:** Suggest that standing in this context isn't about *innocence* but about *relationship*. Maybe "hypocrisy" isn't having the fault; maybe it's *hiding* the fault. This shifts the focus from "Who are you?" to "How are we relating?"
  5.  **Set the Workshop Task:** Invite the group to test this. If we drop the purity requirement, do we lose normative force? Or do we gain a more honest kind of accountability? I want to leave this as an open problem for the circle to wrestle with, not a solved thesis.

  ***

  ### Opening Remarks: "Blame, Hypocrisy and Therapeutic Practice"

  Hi everyone. Thanks for coming. I know it's early, and I know this room is… well, it's a bit of a collision.

  I'm a philosophy student, so I spend most of my time in thought experiments where the stakes are logical consistency. But looking around this circle, I see people who deal with stakes that are much heavier than consistency. You deal with housing, with withdrawal, with whether someone comes back next week or disappears into the system. So, I'm a little nervous about standing up here and talking about "blame" as if it's just a concept. I know for you, it's a tool. Sometimes a dangerous one.

  I want to start with the idea of *standing*.

  In my corner of the field, there's a pretty dominant intuition about hypocrisy. It goes like this: If I am guilty of the same fault I'm blaming you for, I lose the standing to blame you. It's the "look who's talking" objection. If I'm cheating on my diet, I can't legitimately yell at you for eating the cake. My own behavior cancels out my authority. We treat moral standing like a currency that you spend when you break the rules yourself. Once you're bankrupt, you can't issue fines.

  But I've been talking to some of you beforehand, especially those working in addiction and recovery, and I keep hitting a wall with this.

  Because in a clinical setting, if a therapist presents themselves as morally pure—as someone who never struggles, never lapses, never feels the pull of a bad coping mechanism—that doesn't actually build authority. It builds distance. It creates a hierarchy where the clinician is the "healthy one" and the patient is the "broken one." And we know that hierarchy often kills the therapeutic alliance.

  So here's the tension I want to put on the table for us this morning.

  What if the standard philosophical view of hypocrisy is getting it backwards for this context? What if standing isn't about *purity*, but about *transparency*?

  I'm trying to work through an idea I'm calling "functional standing." The thought is this: A clinician might actually *gain* the standing to hold a patient accountable for a substance-use lapse not by being perfect, but by being honest about their own capacity for imperfection. Not necessarily by oversharing—this isn't about making the patient take care of the therapist—but by not pretending to be on a different moral plane.

  If I hide my struggles, I'm a hypocrite in the classic sense. But if I acknowledge that I am also a fallible human being who chooses recovery every day, does that change the normative structure? Does it mean I'm not blaming you from above, but alongside you?

  I know this sounds risky. For the philosophers here, the worry is obvious: If we loosen the link between personal conduct and standing, do we just license everyone to blame everyone? Do we lose the critical edge of moral responsibility? If my hypocrisy doesn't shut me up, what does?

  And for the clinicians, I hear the worry too: This isn't about me. Therapy isn't mutual aid. If I start talking about my own failures, am I blurring boundaries? Am I making this about my virtue rather than the patient's health?

  I don't have the answer. Honestly, I think if I did, we wouldn't need this workshop.

  But I think the work we need to do is to stop treating hypocrisy as a simple veto switch. It's not just "hypocrite = no blame." It's more nuanced. Maybe the real hypocrisy isn't having the fault; maybe the real hypocrisy is pretending the fault doesn't exist in the room.

  So, as we go around the circle, I'm asking us to try something. When we talk about blame, don't just ask "Is this blame justified?" Ask "Who is speaking, and from where?" If a clinician blames a patient, are they doing it from a place of moral superiority, or from a place of shared struggle? And does that distinction change whether the blame lands as punishment or as care?

  I want us to see if we can build a vocabulary that respects the philosophers' need for normative structure without ignoring the clinicians' reality that perfection is useless in a treatment room.

  I'm going to stop there before I talk too much. I really want to hear how this lands for you, especially those of you who have to sit across from someone when they've relapsed. Does this distinction help? Or does it feel like theoretical noise?

  Thanks. Let's get into it.
