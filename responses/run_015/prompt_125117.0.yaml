  **Version 1 (Harm)**
  The Triage Officer implements a new "Fast-Track Standing Order" protocol to reduce door-to-provider time for minor injuries, a clinically justified goal given overcrowding. Under this protocol, nurses are authorized to apply splints and administer standard analgesics immediately upon assessment without waiting for physician verification. The Officer knows that, as a foreseen side effect, this will significantly reduce patient autonomy because individuals will no longer have the opportunity to discuss risks or refuse specific interventions before treatment begins, but he remarks, "I just want to improve flow; I don't care about the consent process."

  **Version 2 (Help)**
  The Triage Officer implements a new "Fast-Track Standing Order" protocol to reduce door-to-provider time for minor injuries, a clinically justified goal given overcrowding. Under this protocol, nurses are authorized to finalize discharge paperwork and release patients immediately upon meeting recovery criteria without waiting for physician verification. The Officer knows that, as a foreseen side effect, this will significantly increase patient autonomy because individuals will gain the ability to leave the facility without being held for administrative sign-off, but he remarks, "I just want to improve flow; I don't care about the release process."

  ***

  **Intentionality Attribution Prediction**
  The Knobe effect predicts that observers will judge the Triage Officer as having **intentionally** reduced patient autonomy in Version 1 (Harm), but **unintentionally** increased patient autonomy in Version 2 (Help), despite the Officer's explicit indifference and the identical primary goal in both scenarios.

  **Explanation Determination**
  The asymmetry is best explained by **moral evaluation** rather than a purely structural factor. While structural accounts (such as Norm Violation or Abnormal Causal Structure) suggest that intentionality is attributed when an outcome deviates from a statistical norm or default script, both versions of this thought experiment involve an identical structural deviation: the implementation of a new protocol that bypasses the standard physician-verification step. If structural deviation were the sole driver, intentionality should be attributed equally in both cases. The divergence arises specifically because reducing autonomy is morally problematic (a rights violation), whereas increasing autonomy is morally permissible or praiseworthy.

  **Feature Driving Divergence**
  The precise feature driving the divergence between the moral and structural explanations is the **intrinsic moral valence of patient agency**. In this design, autonomy is not framed as a logistical variable (like choice of room temperature) but as a right regarding bodily integrity and freedom of movement. If this feature is removed—for example, if the side effect is changed to "patients lose/gain the ability to choose the color of their discharge bandage"—the moral valence disappears. In that neutralized scenario, the asymmetry typically vanishes, and observers are equally likely to deem the side effect unintentional in both versions, supporting the claim that moral weight, not structural change, drives the original effect.

  **Structural-Factor Defense and Attack**
  A defender of the structural-factor account might attack this case by arguing that the asymmetry is not due to moral judgment per se, but because "restricting autonomy" violates the **default causal script** of the doctor-patient relationship, whereas "facilitating autonomy" aligns with it. They would argue that the "default script" is the structural engine of the judgment. However, in doing so, they must explain *why* restricting autonomy is script-violating while facilitating it is not. To define the "default script," they would inevitably have to appeal to the normative expectation that doctors *ought* to respect agency. Thus, in attacking the case to preserve a structural explanation, the defender inadvertently argues that moral evaluation is doing hidden work, as the structural "norm" they rely upon is itself constituted by moral expectations rather than mere statistical frequency.
