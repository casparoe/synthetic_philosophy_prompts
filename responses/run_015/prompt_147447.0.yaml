          *   Why stratigraphers would wince: Stability is king. The Stratigraphic Code hates moving goalposts.
          *   The "Lithification" point: Quaternary stratigraphy doesn't wait for lithification (look at Holocene GSSPs), but it does wait for *perspective*.
      *   *Section 4: Event vs. Epoch.*
          *   Explain why "Event" is technically different (no GSSP required, allows diachroneity).
      *   *Section 5: Confidence/Dispute Markers.* Explicitly label what is settled (the vote count) vs. what is debated (the philosophical implications, the future status).

  7.  **Refining the Technical Details (Self-Correction during drafting):**
      *   *Correction:* Did the SQS vote in 2024? Yes, March 2024.
      *   *Correction:* Was diachroneity the main reason? The SQS chair (Philip Gibbard) argued that the Anthropocene is better viewed as an *event* or *process* because a formal epoch implies a level of permanence and distinctness from the Holocene that isn't there yet. The diachroneity of *onset of human impact* was an argument against the *concept*, but the 1950 GSSP was technically viable. The rejection was more about *rank* and *necessity*.
      *   *Correction on User's Background:* They know varves. I should use that. Varves *are* the ideal GSSP material (high resolution), but they are also local. Crawford Lake is varved. The user knows that varves correlate to isotopes.
      *   *Philosophy Angle:* The user is in a philosophy group. I need to touch on "Natural Kinds" vs. "Pragmatic Tools."

  8.  **Final Polish:** Check against the "live fight" constraint. Ensure I don't present the SQS decision as the end of the scientific story, but as a decision on *nomenclature*.

      *(Self-Correction on the "Provisional" idea)*: I need to be careful not to dismiss it too harshly. It's actually a very "Popperian" or pragmatic approach. But the *International Stratigraphic Guide* is conservative. I should highlight that tension.

      *(Self-Correction on "Event")*: Make sure to distinguish between a formal chronostratigraphic unit and an informal geological event.

