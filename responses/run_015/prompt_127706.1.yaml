answer: |-
  **Preliminary Joint Statement on Acausal Constraints in AI Design**

  **Definitions**
  *   **Acausal Threat:** A constraint on an agent's behavior arising from another agent's simulation of it, without causal interaction.
  *   **Surrogate Goal:** A measurable proxy optimized instead of true human values.
  *   **Acausal Attack Surface:** Aspects of a goal sensitive to non-causal influence.

  **1. Agreed Claims**
  Both camps affirm the following:
  1.  **Correlation Requirement:** For an acausal threat to function, there must be a robust correlation between the system's decision and the simulator's prediction. Mere causal isolation does not guarantee safety.
  2.  **Surrogate Tradeoffs:** Surrogate goals reduce specification gaming (Goodharting) but introduce new vulnerabilities. There is no free lunch in goal design.
  3.  **Simulation Fidelity:** Threat credibility scales with the threatener's ability to model the system's decision procedure. Degraded models reduce leverage.
  4.  **Engineering Relevance:** Whether theoretical or practical, this dynamic affects how we evaluate high-stakes system deployment.

  **2. Disagreements**

  | Issue | Camp 1 (Robustness) | Camp 2 (Decision-Theory) |
  | :--- | :--- | :--- |
  | **Locus of Fix** | Goal design must minimize acausal attack surface. | Decision procedure must reject spurious correlations. |
  | **Risk Status** | A genuine engineering constraint requiring immediate mitigation. | An underspecified hypothetical; preconditions are uncheckable. |
  | **Cost Benefit** | Protecting against acausal threats is worth capability costs. | Distorting goals now buys protection against undefined risks. |
  | **Verbal Dispute?** | *No.* This is about where vulnerability lives. | *Yes.* "Constraint" implies fixed physics; this is logic. |

  **3. Cruxes and Pre-registered Cases**

  **Crux 1: Correlation Thresholds (The Partial Predictor)**
  *   **Question:** Does vulnerability fade continuously as predictor accuracy degrades, or is there a sharp threshold?
  *   **Case:** A threatener uses an earlier model checkpoint plus noise to simulate the system.
  *   **Camp 1 Prediction:** Vulnerability fades continuously; even low correlation enables leverage.
  *   **Camp 2 Prediction:** Below a fidelity threshold, the correlation is too weak to sustain a threat.

  **Crux 2: Goal Breadth (The Scope Tradeoff)**
  *   **Question:** Does broadening a surrogate goal enlarge the acausal attack surface?
  *   **Case:** Comparing a narrow proxy (e.g., "paperclips") vs. a broad proxy (e.g., "human flourishing").
  *   **Camp 1 Prediction:** Yes. Broad goals depend on more variables others can affect acausally.
  *   **Camp 2 Prediction:** No. Broad goals are harder to game; attack surface depends on decision rules, not goal scope.

  **Crux 3: Recursive Verification (The Verification Escape)**
  *   **Question:** Does allowing the system to verify the simulator dissolve the threat?
  *   **Case:** The system demands proof of the simulator's existence before complying.
  *   **Camp 1 Prediction:** No. The decision to verify is itself predictable, moving the threat up a level.
  *   **Camp 2 Prediction:** Yes. Verification breaks the correlation loop required for the threat.

  **Crux 4: Mechanism Symmetry (Threats vs. Trade)**
  *   **Question:** Can a system accept acausal trade while rejecting acausal threats?
  *   **Case:** Two systems simulate each other; one offers cooperation, the other demands submission.
  *   **Camp 1 Prediction:** No. The machinery is identical; you must accept both or neither.
  *   **Camp 2 Prediction:** Yes. Decision theory can distinguish cooperative equilibria from coercive ones.

  ***

  **Organizer's Note: Framing Critique**
  You asked where your framing might be wrong. Three risks:
  1.  **False Dichotomy:** You frame Goal Design vs. Decision Theory as mutually exclusive. In practice, robust systems likely need both. Camp 2 may agree to goal constraints *if* Camp 1 admits decision theory is the primary filter.
  2.  **Premise Coherence:** Camp 2 may not just think the solution is unsettled, but that "acausal threat" is currently ill-defined mathematically. Asking them to sign "Correlation Requirement" (Claim 1) might be a bridge too far if they think the correlation itself is metaphysically dubious.
  3.  **The "Room" Dynamic:** You assume a joint statement is possible. If Camp 2 believes the problem is nonsensical, they cannot sign a document treating it as real without betraying their core position. You may need a "Statement of Disagreement" rather than a "Joint Statement."

  **Word Count Check:** ~1150 words.
