answer: |-
  ### The rules our precedents fit

  Two interpretive rules generate the six existing verdicts without contradiction.

  **Rule 1: The Durability of Burden.** A design embeds politics when it imposes a disproportionate, long-term physical burden on a vulnerable group that cannot be easily reversed. This rule captures the four "politics found" cases. The parkway overpasses (1), station steps (2), shelter armrests (4), and plaza layout (6) all create durable physical arrangements that allocate disadvantage to specific demographics (bus riders, disabled persons, homeless, "undesirables"). Crucially, Case 6 shows that current intent is irrelevant; if the physical artifact perpetuates exclusion, the politics remain embedded.

  **Rule 2: The Reversibility Exception.** No politics is found when the arrangement is reversible, alternatives exist, or affected parties have meaningful recourse. This explains the two "no politics" cases. The hydrant mandate (3) made nobody worse off. The road diet (5) survived objection because paint is reversible, reviewed annually, and drivers had alternatives. Here, process matters only when paired with physical flexibility.

  These rules conflict only on the permanence of mitigation. Rule 1 looks strictly at the concrete; Rule 2 allows negotiated mitigations to count, provided they are durable. Both rules agree that temporary fixes do not cure permanent burdens. The precedents suggest that while process (Case 5) can validate reversible changes, it cannot legitimize durable exclusion (Case 6). The panel consistently prioritizes the lifespan of the physical burden over the lifespan of the political agreement.

  ### What each rule says about the hub

  **Rule 1 (Durability of Burden)** predicts a **Politics** finding. It treats the shuttle as irrelevant background noise. The rule assesses the artifact itself: a covered path and a 700-meter detour. Because the path loss is permanent concrete and the burden falls on the elderly and disabled (matching Case 2), the design embeds politics regardless of the shuttle. The funding cliff is a future problem, but the physical barrier is a present fact.

  **Rule 2 (Reversibility Exception)** also predicts **Politics**, but treats the shuttle as a failed mitigation. Under this rule, the shuttle counts as an "alternative," but it fails the durability test established in Case 5. Paint is reversible; a two-year grant is not. Because the mitigation expires while the burden remains, the exception does not apply. However, if the shuttle were permanently funded, Rule 2 might allow a "no politics" finding based on the neighborhood's negotiated support, distinguishing this from the unconsulted burdens in Cases 1 and 2.

  Both rules converge on the same verdict but diverge on *why*. Rule 1 ignores the shuttle entirely as non-physical. Rule 2 considers it but finds it insufficiently durable. This distinction matters for future cases where mitigation might be permanent. Here, the expiry date ensures the burden reverts to the physical design, triggering the panel's historical concern with durable exclusion.

  ### Recommended finding

  **Politics Found.** We should not issue a conditional finding. The ordinance provides binary outputs; conditioning creates legal uncertainty that jeopardizes the very funding we seek to protect. A conditional finding implies the design is合法 today but illegal tomorrow, which confuses the applicant's duty to publish alternatives.

  The closest analog is **Case 2 (Rail Station)**. Both involve lengthening the accessible route for operational efficiency. In Case 2, the lack of explanation triggered the finding; here, the explanation (shuttle) is temporally insufficient. Like the station steps, the hub design locks in a penalty for mobility-impaired users once the mitigation vanishes. Publishing alternatives now forces the applicant to either secure permanent shuttle funding or redesign the path before concrete is poured. This aligns with the panel's role: preventing durable burdens, not managing temporary budget cycles. We must treat the grant expiry as a design feature, not an external variable.

  ### What we would be committing to either way

  A **Politics** finding commits the panel to judging **artifacts over decisions**. We establish that physical equity outweighs procedural agreement. Even if stakeholders consent, a design that permanently burdens vulnerable groups is illegitimate. Future panels would be bound to ignore temporary mitigations and assess the design's lifespan independently of current budgets. We become guardians of the built environment's long-term logic.

  A **No Politics** finding commits us to judging **decisions over artifacts**. We establish that negotiated consent cures physical burden. If the affected community agrees to a trade-off, the panel defers. Future panels would treat funding streams as part of the design, allowing temporary mitigations to validate permanent changes. We become auditors of the decision-making process, prioritizing project delivery and current stakeholder alignment over hypothetical future inequities.

  The choice is between protecting the neighborhood from future neglect or respecting their current agency. The precedents favor the former: Case 6 rejected current intent to protect against historical layout. We should remain consistent.

  ### The case that would settle it

  To discriminate between these commitments, bring forward a **gated public park** case. A city proposes installing a lockable gate in a neighborhood park to reduce night crime. The surrounding low-income residents formally request the gate to feel safer. The gate is permanent physical infrastructure.

  If we find **Politics**, we confirm that physical exclusion cannot be cured by consent (Artifact > Decision). If we find **No Politics**, we confirm that community agency legitimizes exclusionary design (Decision > Artifact). This verdict would clarify whether the panel's authority rests on the objective impact of the built form or the subjective legitimacy of the process that created it. It forces us to decide if we protect people from themselves or from the concrete.
