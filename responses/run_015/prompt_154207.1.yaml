answer: |-
  Hey, it is completely understandable that you are spiraling a bit on this given the context, and honestly getting stuck on the commensurability objection is basically the rite of passage for anyone digging into negative utilitarianism because it strikes at the very heart of how we value experience. The core tension you are feeling is whether you can claim pain matters more than pleasure without implicitly admitting they are the same kind of thing that can be traded off, and to answer your request I have ranked your three models based on how well they preserve the lexical intuition without sliding back into a system where enough pleasure could theoretically justify extreme suffering.

  The strongest attempt by far is the strict lexical ordering where any pain above a threshold automatically dominates any pleasure, and this lands at the top because it is the only one that honestly accepts the charge of incommensurability rather than trying to mathematically paper over it. By establishing a priority rule instead of a summation formula, this view admits that pain and pleasure are not on the same scale and therefore do not need a common currency to be compared, effectively sidestepping the objection that utilitarian calculus requires a single metric. It does not collapse back into regular negative utilitarianism because it forbids trade-offs entirely rather than just weighting them heavily, meaning no amount of happiness can ever cancel out severe suffering, which preserves the lexical threshold without needing to pretend there is an exchange rate that just happens to be very high.

  Coming in second is the weighted discontinuity model where pain and pleasure share a metric but the exchange rate goes infinite near zero suffering, and this lands in the middle because it tries to have it both ways in a manner that is philosophically unstable. While it captures the intuition that suffering becomes infinitely urgent as it approaches certain limits, claiming a shared metric while simultaneously asserting an infinite exchange rate is mathematically incoherent since an infinite rate effectively breaks the metric anyway. This view risks collapsing into regular negative utilitarianism because if the rate is not truly infinite it allows for trade-offs, and if it is truly infinite it is just the strict lexical model in disguise, so it ends up being a confusing hybrid that does not offer a distinct advantage over the first option while inviting more scrutiny about the nature of the scale.

  The weakest attempt is the local-denial hybrid you came up with where incommensurability holds only inside small pain neighborhoods but gets restored globally across larger domains, and this lands at the bottom because it is logically inconsistent regarding how aggregation works. If values are incommensurable locally there is no coherent way to sum them into a global commensurable total without implicitly establishing a conversion rate at the local level, which means the incommensurability was never real to begin with. This model inevitably collapses back into regular negative utilitarianism or even classical utilitarianism because once you restore commensurability globally you allow for the possibility that massive amounts of pleasure could offset localized pain, which directly violates the lexical threshold idea you are trying to protect.

  So if you are looking for the view that actually holds the line without secret contradictions, the strict lexical ordering is the only one that fully commits to the idea that some suffering is categorically different from pleasure, while the other two eventually crumble under the weight of trying to keep a utilitarian calculus alive where one might not belong. I hope this helps clear up the fog a bit because it is a heavy thing to dwell on especially when you are processing things through the lens of a friend's breakup, but knowing that the strict lexical view is the most robust might at least give you a solid place to rest your thoughts.
