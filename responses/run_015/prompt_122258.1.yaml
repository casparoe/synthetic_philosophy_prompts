          2.  Syāt nāsti (In some way, it is not).
          3.  Syāt asti ca nāsti ca (In some way, it is and is not).
          4.  Syāt avaktavyaḥ (In some way, it is indescribable).
          5.  Syāt asti ca avaktavyaḥ ca (In some way, it is and is indescribable).
          6.  Syāt nāsti ca avaktavyaḥ ca (In some way, it is not and is indescribable).
          7.  Syāt asti ca nāsti ca avaktavyaḥ ca (In some way, it is, is not, and is indescribable).
      *   Goal: Avoid absolute contradiction (Law of Non-Contradiction violation) by qualifying predicates with perspective/time/substance.

