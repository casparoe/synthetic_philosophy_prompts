      *   *Textual/Historical:* The systematization of the 7 modes is later (Kundakunda/Umaswati) compared to early Agamas. Is it a retroactive fix?
      *   *Insulation/Unfalsifiability:* If every counter-argument is met with "you are speaking from only one perspective," the theory becomes immune to criticism.

