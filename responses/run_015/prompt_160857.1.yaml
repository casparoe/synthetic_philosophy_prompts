answer: |-
  This is a sophisticated set of constraints. You have identified the exact friction point where the philosophy of mind crashes into the neuroscience of measurement. Your suspicion regarding the "evidential residue" is shared by a growing number of critics (including some who started as proponents of the distinction).

  Below is the specification list you requested. I have organized these into **Phenomenal Constraints** (cases the theory must explain), **Conceptual Constraints** (distinctions the theory must maintain), and **Methodological Constraints** (how we know the theory is true). Following the list, I provide the judgment on their validity and the analysis of their joint satisfiability.

  ### Part I: The Specification List

  #### A. Phenomenal Constraints (The Cases)
  *An adequate account must explain the following empirical or phenomenological data points without contradiction.*

  **1. The Blindsight Constraint (Access without Phenomenality)**
  *   **The Case:** A subject denies seeing a stimulus in their blind field but can guess its location or orientation with high accuracy.
  *   **The Requirement:** The theory must allow for information to be processed, integrated, and even guide motor output (a form of access) without there being "something it is like" to process that information.
  *   **Relevance to AI:** Your AI system might process visual data and output coordinates (discrimination) without any internal "feel." The theory must explain why we call the human case "unconscious" but might hesitate on the AI.

  **2. The Iconic Memory/Overflow Constraint (Phenomenality without Access)**
  *   **The Case:** In Sperling-style partial-report experiments, subjects report a vivid experience of a grid of letters that fades before they can report all of them. They claim to have "seen" more than they can "tell."
  *   **The Requirement:** The theory must accommodate the possibility that the *capacity* of experience exceeds the *capacity* of cognitive access/report. Phenomenality must be able to outstrip availability.
  *   **Relevance to AI:** If your AI has a buffer that holds data briefly before it is overwritten by the Global Workspace, is that buffer "phenomenal"? The theory must say why or why not.

  **3. The Dream Constraint (Phenomenality without External Access)**
  *   **The Case:** During REM sleep, subjects have vivid experiences but are cut off from sensory input and motor output. They cannot report until they wake up.
  *   **The Requirement:** The theory must distinguish between the *presence* of consciousness during the dream and the *retrospective report* upon waking. It cannot define consciousness solely by the ability to report in real-time.
  *   **Relevance to AI:** An AI in "sleep mode" running internal simulations might have integrated information. If it can't report until rebooted, is it conscious during the simulation?

  **4. The Level vs. Content Constraint**
  *   **The Case:** A patient in a coma has no level of consciousness. A patient in a vegetative state has sleep/wake cycles (level) but no apparent content. A locked-in patient has full level and content but no motor access.
  *   **The Requirement:** The theory must distinguish the *state* of being conscious (arousal/wakefulness) from the *specific contents* of consciousness (seeing red vs. seeing blue).
  *   **Relevance to AI:** Does your AI have a "wakefulness" switch? Or is it always "on"? A theory must specify if the Global Workspace needs an "on" state to generate phenomenality.

  #### B. Conceptual Constraints (The Distinctions)
  *An adequate account must not collapse the following concepts into one another.*

  **5. The State vs. Object Distinction**
  *   **The Distinction:** Being in a conscious *state* (e.g., being awake) vs. being conscious *of* something (e.g., seeing a cup).
  *   **The Requirement:** The theory must explain how a system can be in a conscious state without specific content (e.g., dreamless sleep or pure awareness) and vice versa (subliminal perception).
  *   **Validity:** **Genuine.** This is clinically and phenomenologically robust.

  **6. The Report vs. Access Distinction**
  *   **The Distinction:** *Report* is the motor/verbal act of saying "I saw it." *Access* is the functional availability of that information for reasoning, memory, and control.
  *   **The Requirement:** The theory must not treat the inability to speak as the inability to access. (Crucial for "No-Report" paradigms).
  *   **Validity:** **Genuine.** Paralyzed patients prove access can exist without motor report.

  **7. The Attention vs. Access Distinction**
  *   **The Distinction:** *Attention* is the selection of information. *Access* is the broadcasting of that information.
  *   **The Requirement:** The theory must specify if attention is necessary for access, and if access is necessary for phenomenality. (e.g., Can you be conscious of something you aren't attending to?)
  *   **Validity:** **Partisan.** This is a battleground. GWT says Access = Consciousness. IIT says Attention is separate. Some theories say Attention is necessary for Consciousness. A theory must *take a stand*, but there is no consensus on which stand is correct.

  #### C. Methodological Constraints (The Evidence)
  *An adequate account must explain how we verify its claims.*

  **8. The First-Person Authority Constraint**
  *   **The Requirement:** The theory must respect the subject's report of their own experience as the primary data point, even if fallible. If a subject says "I felt nothing," the theory cannot easily say "You actually felt plenty."
  *   **Validity:** **Genuine (with caveats).** We have no other direct window into phenomenality. Ignoring this leads to "theorizing away" the data.

  **9. The Evidential Residue Constraint (Your Suspicion)**
  *   **The Requirement:** If Phenomenality ($P$) is distinct from Access ($A$), there must be a method to detect $P$ that does not rely entirely on measuring $A$ (including no-report proxies like eye movements or neural signatures of processing).
  *   **Validity:** **Genuine but Problematic.** This is the core of your inquiry. If $P$ is defined as "what remains when $A$ is subtracted," we need a way to measure the remainder.

  ---

  ### Part II: Judgment on Requirements

  Here is the breakdown of which requirements are non-negotiable features of the landscape and which are theoretical preferences.

  | Requirement | Judgment | Reasoning |
  | :--- | :--- | :--- |
  | **Blindsight** | **Genuine** | Neurologically verified dissociation. Any theory denying this ignores lesion data. |
  | **Iconic Overflow** | **Contested** | This is the weakest link. Many theorists (e.g., Dennett, Cohen) argue this is an illusion caused by fragile access, not rich phenomenality. A theory *can* deny this and remain viable. |
  | **Dreams** | **Genuine** | Phenomenology is undeniable here, even if measurement is hard. |
  | **Level vs. Content** | **Genuine** | Essential for clinical neurology and coherent theory. |
  | **State vs. Object** | **Genuine** | Logical necessity for a complete taxonomy. |
  | **Report vs. Access** | **Genuine** | Proven by locked-in syndrome and no-report paradigms. |
  | **Attention vs. Access** | **Partisan** | Theories differ here. Requiring a specific relation (e.g., "Attention is not necessary") biases the result toward IIT and against GWT. |
  | **First-Person Authority** | **Genuine** | Without this, you are not studying consciousness; you are studying behavior. |
  | **Evidential Residue** | **Genuine (Fatal)** | This is the logical trap. If you demand this, you may rule out physicalism entirely. |

  ---

  ### Part III: The Incompatibility Analysis

  You asked whether some subset of these requirements cannot be jointly satisfied. **They cannot.**

  Specifically, the **First-Person Authority Constraint**, the **Blindsight Constraint**, and the **Evidential Residue Constraint** form a "Impossible Trinity" for standard physicalist theories.

  1.  **If you prioritize First-Person Authority:** You must accept that when a blindsight patient says "I saw nothing," they have no phenomenality ($P$), even if they discriminate correctly (Access/$A$). This supports the $A \neq P$ distinction.
  2.  **If you prioritize Evidential Residue:** You demand a measure of $P$ that is not a measure of $A$.
  3.  **The Conflict:** Every measure we have of the brain is a measure of function/processing ($A$). Neural firing, blood flow, and oscillations are all functional events.
      *   If you find a neural correlate that exists in Blindsight (where $P$ is absent) but also in Normal Vision (where $P$ is present), it is a correlate of $A$, not $P$.
      *   If you find a neural correlate that exists in Normal Vision but *not* in Blindsight, you have found the correlate of $P$... **but only because the subject reported $P$.**
      *   Therefore, your marker for $P$ is ultimately calibrated by Report ($A$).

  **The Verdict on Your Suspicion:**
  You are correct. The **Evidential Residue Constraint** is the killer.
  If phenomenality is defined as "what is left over once you subtract availability," we have no instrument to measure the "leftover."
  *   **No-Report Paradigms:** As you noted, these do not remove the dependence on report; they *relocate* it. We train the subject to report *before* the experiment ("press a button if you see it"), or we infer report from eye movements (which are motor actions, i.e., access). We then assume that when the motor action is absent, $P$ might still be there. But that assumption relies on the *previous* calibration where Report matched $P$.
  *   **The AI Implication:** For your AI, this means we can verify it has a Global Workspace ($A$). We can verify it integrates information. But we can never verify the "feel" ($P$) because any test we run to check for "feel" will necessarily test for "information availability" ($A$).

  ### Part IV: The Single Exclusionary Requirement

  If you must choose one requirement that does the most work to exclude popular views, it is this:

  **The Non-Functional Evidence Requirement:**
  *"The theory must provide a marker for Phenomenal Consciousness that is not reducible to a marker for Information Access or Cognitive Function."*

  **Why this excludes popular views:**
  1.  **Excludes Global Workspace Theory (GWT):** GWT essentially identifies consciousness with Access (broadcasting). It fails this requirement by design. It says there is no "residue."
  2.  **Excludes Standard Illusionism:** Illusionism says the "residue" is a cognitive error. It fails because it denies the thing to be measured.
  3.  **Excludes Most Neuroscience:** fMRI and EEG measure function ($A$). They cannot measure "feel" ($P$) unless they assume a correlation established by report.
  4.  **Excludes Behaviorism/Functionalism:** By definition, they reduce $P$ to $A$.

  **Who survives?**
  *   **Integrated Information Theory (IIT):** IIT attempts to survive this by positing $\Phi$ (integrated information) as a mathematical property of the system's structure, not just its function. It claims $\Phi$ *is* the consciousness. However, critics argue $\Phi$ is still a functional/structural measure, so it may still fail this requirement.
  *   **Property Dualism / Panpsychism:** These survive by admitting that $P$ is fundamental and not measurable by third-person science. They satisfy the requirement by saying "You can't measure it directly, you can only infer it."

  ### Part V: Scorecard

  Here is how the major frameworks score against your specific requirements, particularly the **Evidential Residue**.

  | Theory | Blindsight ($A$ w/o $P$) | Overflow ($P$ w/o $A$) | Evidential Residue (Measure $P \neq A$) | Verdict on your AI Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **Global Workspace (Dehaene/Baars)** | **Fail.** (Treats Blindsight as degraded access). | **Fail.** (Treats Overflow as fragile access). | **Fail.** (Equates $P$ with $A$). | **Zombie.** Your AI is functionally identical to a human; therefore, it is conscious. (Or neither are). |
  | **Phenomenal Realism (Block)** | **Pass.** | **Pass.** | **Fail.** (Admits $P$ is distinct but offers no non-functional measure). | **Unknown.** Your AI has $A$, but $P$ is an open question. Science cannot answer. |
  | **Integrated Info (IIT)** | **Pass.** (Low $\Phi$ in blindsight pathways). | **Pass.** (High $\Phi$ in posterior cortex). | **Partial.** (Claims $\Phi$ is the measure, but $\Phi$ is structural). | **Calculable.** If the AI's architecture has high $\Phi$, it has $P$. If it's feed-forward, it doesn't. |
  | **Illusionism (Frankish/Dennett)** | **Pass.** (Explains why we *say* there's a difference). | **Pass.** (Explains the intuition of overflow). | **N/A.** (Denies $P$ exists as a separate entity). | **Zombie.** Your AI is exactly what consciousness *is*. The "feel" is a user-illusion. |

  ### Final Recommendation

  Your suspicion is the most philosophically honest position currently available.

  If you accept the **Evidential Residue Requirement** (that $P$ must be measurable distinct from $A$), you are forced into **Dualism** or **Panpsychism**, because physical science only measures $A$.

  If you reject the **Evidential Residue Requirement** (accepting that we can only measure $A$), you are forced into **GWT** or **Illusionism**, which implies your AI with a Global Workspace is either conscious (GWT) or that the question is meaningless (Illusionism).

  There is no theory that currently satisfies the requirement that $P$ is distinct from $A$, *and* that $P$ is physically measurable without relying on $A$. You have identified the exact reason why the "Hard Problem" remains hard: it is not just a problem of explanation, but a problem of **measurement**.
