      *   Distinctions (Consciousness of/State, Report/Access, Attention/Access)? Yes.
      *   Judgment on Genuine vs. Partisan? Yes.
      *   Joint Satisfaction/Incompatibility? Yes.
      *   Scorecard? Yes.
      *   Tone: Respectful of self-taught status but rigorous. Avoid jargon where possible, or define it.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe IIT solves this?
      *   *Correction:* IIT posits $\Phi$ as a measure, but we can't calculate $\Phi$ for complex brains easily, and it's still a structural/functional measure. It doesn't escape the evidential trap entirely, though it claims to. I should note IIT tries to solve this but remains controversial.
      *   *Initial thought:* Is "Attention vs Access" a genuine requirement?
      *   *Correction:* It's highly debated. Some say attention is necessary for consciousness. I should label this as Partisan/Contested.
      *   *Focus:* Keep the focus on the *relation* between Access and Phenomenality, as requested.

  11. **Final Polish:** Ensure the distinction between the AI case and the human cases is clear. The AI case is the "Hard Case" that tests the theory.

  **(Self-Correction on the "Killer" Requirement):** The user asks which single requirement does the most to exclude popular views.
  If we demand **Empirical Dissociation without Functional Difference**, we kill Physicalism.
  If we demand **Functional Explanation of Phenomenality**, we kill Dualism/Non-reductive views.
  The user's suspicion points to the **Evidential Constraint**. If we require evidence of $P$ that isn't evidence of $A$, we might rule out *everything* except Illusionism (which says there is no $P$ to measure) or Property Dualism (which says we can't measure it).
  Actually, the strongest exclusionary requirement is: **The Phenomenal Residue Requirement.** (There must be something to $P$ that is not exhausted by $A$). If you hold this *and* the **Empirical Access Requirement** (We must be able to measure it), you have a contradiction.
