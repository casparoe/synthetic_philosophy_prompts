prompt: |-
  I have no academic background and I have been reading about consciousness on my own for a couple of years, driven by one practical question: what should I say about an artificial system that has something like a global workspace, where information is integrated, made available system-wide, and reportable in principle, but where nothing is claimed about how any of it feels? Global workspace theory seems to me to answer that question far too quickly, and the access-versus-phenomenal distinction seems to answer it not at all. So, before I read another theory, I want the specification one has to meet.

  Write me the list of requirements an adequate account of the relation between access and phenomenal consciousness must satisfy, given that purpose, with the case or consideration behind each requirement. I want the cases it has to get right, including blindsight-style subjects who discriminate without experience, the partial-report results on iconic memory, dreams, and the difference between a creature's level of consciousness and the contents it is conscious of. I want the distinctions it must not collapse, including consciousness of something versus a state's being conscious, report versus access, and attention versus access. And I want your judgment on which of these are genuine requirements and which are merely what one camp happens to want.

  The part I care most about is whether some subset of the requirements cannot be jointly satisfied. My own suspicion is the evidential one: if phenomenality is roughly what is left over once you subtract availability, then every method we have for detecting it, including the no-report paradigms, which seem to me to relocate rather than remove the dependence on a report, ends up detecting access instead. If that is right, say so and say which single requirement does the most to exclude the popular views. A brief scorecard at the end is fine, but the criteria are what I am after.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Non-academic, self-taught in consciousness studies for a couple of years. Deeply engaged with the specific problem of Access Consciousness ($A$) vs. Phenomenal Consciousness ($P$).
      *   **Core Question:** What should we say about an AI/system with Global Workspace (GW) functionality (integration, availability, reportability) but no claim about *feel* (qualia/phenomenology)?
      *   **Critique of Existing Views:** Finds Global Workspace Theory (GWT) too quick (implies $A = P$ or ignores $P$). Finds the Access/Phenomenal distinction (Block) insufficient/unhelpful for this specific case.
      *   **Task:** Provide a list of requirements an adequate account of the $A$-$P$ relation must satisfy.
      *   **Specific Inclusions:**
          *   Cases to get right: Blindsight, Iconic Memory (partial report), Dreams, Level vs. Content of consciousness.
          *   Distinctions to maintain: Consciousness *of* something vs. State being conscious, Report vs. Access, Attention vs. Access.
          *   Critical Analysis: Distinguish genuine requirements from partisan wants.
          *   Crucial Insight: Identify if requirements are jointly unsatisfiable (especially the evidential problem).
          *   Final Output: Criteria list with justifications, judgment on validity, identification of the "killer" constraint, and a brief scorecard.

  2.  **Deconstruct the Philosophical Problem:**
      *   The user is hitting on the "Hard Problem" meets "Measurement Problem."
      *   GWT (Baars, Dehaene) tends to equate access with consciousness (or treats access as the only scientifically tractable part).
      *   Block's A/P distinction says you can have one without the other.
      *   The User's AI scenario: A system with $A$ (GW) but unknown/absent $P$.
      *   The User's Suspicion: We can't measure $P$ without relying on $A$ (report/access). This is the "Evidential Constraint."

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Blindsight Constraint.* Must explain how discrimination happens without experience.
      *   *Requirement 2: The Iconic Memory Constraint.* Must explain rich experience that fades before access (Sperling).
      *   *Requirement 3: The Dream Constraint.* Must account for vivid experience without external report/interaction.
      *   *Requirement 4: The Level/Content Distinction.* Must separate arousal/wakefulness (level) from specific experiences (content).
      *   *Requirement 5: The Report/Access Distinction.* Report is motor/verbal; Access is cognitive availability. Don't conflate them.
      *   *Requirement 6: The Attention/Access Distinction.* You can attend without accessing (maybe?) or access without attention (hyperpriming?). Need to be careful here.
      *   *Requirement 7: The Evidential Constraint (The User's Suspicion).* How do we know $P$ exists if we strip away $A$?

  4.  **Refining and Evaluating the Requirements (The "Judgment" Phase):**
      *   *Blindsight:* Genuine. Neurologically verified.
