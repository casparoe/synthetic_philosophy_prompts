  # Framework for Grant Assessment: A Working Document

  **Prepared for:** [Giving Circle Name]
  **Date:** October 2023
  **Status:** Draft for Consensus

  ## Part 1: Agreed Claims

  The following propositions are accepted by all members of the circle as the foundation for our deliberations. These are not platitudes; they are substantive claims about our capacity and our role. An outside observer (whether a strict utilitarian or a strict rights-based theorist) might reasonably contest them.

  1.  **The Non-Neutrality of Inaction:** Retaining capital for future use or returning it to donors is not a neutral baseline. It preserves the status quo distribution of resources, which itself creates winners and losers compared to alternative allocations. We accept that doing nothing is a decision with moral consequences.
  2.  **Epistemic Limits:** We acknowledge that our capacity to trace second- and third-order effects (price shifts, market distortions, cultural changes) is limited. We cannot know with certainty who loses from any intervention, nor can we know with certainty the magnitude of the good we create.
  3.  **The Legitimacy Deficit:** We are private actors allocating pooled resources. We possess no democratic mandate to impose trade-offs on non-consenting third parties. Our authority to act derives solely from the pooled capital and our shared ethical commitment, not from a right to govern others' outcomes.
  4.  **The Necessity of Comparison:** A grant cannot be assessed in isolation. It must be assessed against the counterfactual: the next-best use of the same funds. A grant that does net good is still a failure if a different grant would have done significantly more net good.
  5.  **The Reality of Harm:** We accept that it is possible for an intervention to be net positive in aggregate while still making identifiable individuals or groups strictly worse off. We disagree on whether this renders the intervention impermissible, but we agree that the harm is real and not merely theoretical.

  ## Part 2: Map of Disagreement

  We disagree on how to operationalise the claims above. The following table records the two distinct frameworks currently in use within the circle. Neither side attributes bad faith to the other; we simply prioritise different moral risks.

  | Issue | Camp A: The Safety Screen (Pareto-First) | Camp B: The Impact Rank (Consequence-First) |
  | :--- | :--- | :--- |
  | **The Baseline** | The status quo ante (the world as it is before the grant). We ask: "Does this make anyone worse off than they are right now?" | The counterfactual alternative (the next-best grant). We ask: "Does this create more value than the money would have otherwise?" |
  | **Burden of Proof** | On the proposer to demonstrate that no identifiable party is made worse off. If harm is plausible and unmitigated, the grant fails. | On the proposer to demonstrate that the expected net good is positive and superior to alternatives. Harm is a cost to be weighed, not a veto. |
  | **Compensation** | For a harm to be acceptable, compensation must be actual and delivered to the loser, or the harm must be non-existent. Hypothetical compensation is insufficient. | Hypothetical compensation (Kaldor-Hicks) is sufficient. If the winners *could* compensate the losers and still remain better off, the move is efficient and permissible. |
  | **Scope of Tracing** | We trace effects until we find a loser. If a chain of causation leads to a specific person losing welfare, the screen is triggered, regardless of how distant the link. | We trace effects until the signal fades into noise. Statistical or diffuse losses (e.g., tiny price increases for millions) do not count as vetoes unless they cross a threshold of severity. |
  | **Role of Ignorance** | Ignorance licenses caution. Because we cannot see all losers, we must restrict ourselves to interventions where losers are highly unlikely (Safe Pareto). | Ignorance licenses action. Because the status quo also harms people we cannot see, paralysis is not virtuous. We must act on best estimates. |

  ## Part 3: Cruxes and Predictive Tests

  To move forward, we must identify the specific sub-questions where evidence or logical consistency would shift our views. Below are the cruxes, including the two new proposals introduced by the drafting member (marked with *). For each, we record a concrete test case and the predictions of each camp.

  ### Crux 1: The Baseline Definition (Counterfactual-Pareto)*
  **The Question:** When testing for losers, do we compare the intervention to *doing nothing*, or to *the next-best grant*? If we choose the latter, does the "opportunity cost" count as a loser (the people the alternative grant would have helped)?
  **The Proposal:** If the Counterfactual-Pareto test is adopted, almost no grant passes, because the people who would have been helped by the rejected alternative are always "losers."
  **Test Case:** *Grant C vs. Grant D.* Grant C helps Group X. Grant D (the alternative) helps Group Y. We choose C.
  *   **Camp A Prediction:** If we adopt Counterfactual-Pareto, the Safe Screen becomes vacuous (it vetoes everything). This proves the Pareto approach is flawed for allocation decisions.
  *   **Camp B Prediction:** If we adopt Counterfactual-Pareto, it proves that *all* allocation involves trade-offs. Therefore, we should abandon the Safe Screen entirely and rank by expected value.
  *   **Shared Observation:** If both camps agree this test makes the Pareto screen unsatisfiable, we must decide if that is a fatal flaw in the test or a fatal flaw in the screen.

  ### Crux 2: The Voiceless-Losers Clause*
  **The Question:** If all losers from a grant are "voiceless" (animals, unaware humans, future people, or those losing only relative standing), does the Safe Screen still apply?
  **The Proposal:** If all losers are voiceless, we reclassify the intervention as a "Silent Transfer." This removes it from the Pareto Screen and subjects it to standard balancing of benefits and harms.
  **Test Case:** *Corporate Welfare for Broiler Chickens.* A grant improves conditions for chickens but raises retail prices slightly, borne mostly by low-income shoppers.
  *   **Camp A Prediction:** The shoppers are human and identifiable; they are not voiceless. The screen applies. The grant fails unless shoppers are compensated. The animals' gain cannot offset human loss.
  *   **Camp B Prediction:** The shoppers' loss is marginal and diffuse; the chickens' gain is severe and concentrated. Even if shoppers count, the net good passes. If the Voiceless Clause is adopted, the shoppers might be considered "diffuse" enough to count as silent, allowing the grant.
  *   **Commitment Required:** Does Camp A accept that animal welfare can *ever* outweigh human financial loss? Does Camp B accept that "voiceless" humans (unaware of the price rise) deserve the same protection as aware ones?

  ### Crux 3: Tracing Depth and Market Effects
  **The Question:** How far do we trace economic ripples? Do minor price increases caused by demand shocks count as "harm"?
  **Test Case:** *Unconditional Cash Transfers.* Grants to the poorest third of a village cause local food prices to rise slightly. Non-recipients (net buyers) end up marginally worse off.
  *   **Camp A Prediction:** This is a clear violation. Non-recipients are made worse off compared to the baseline. The grant fails the Safe Screen unless the price rise is mitigated.
  *   **Camp B Prediction:** The gain to the recipients vastly outweighs the marginal loss to non-recipients. The price signal is a feature, not a bug. The grant passes on expected value.
  *   **Shared Observation:** We will monitor a pilot or review literature on this specific dynamic. If Camp A admits that *no* cash transfer passes the screen, they must accept their framework rules out poverty alleviation via cash.

  ### Crux 4: Compensation Principle
  **The Question:** Must compensation be actual, or is it enough that it *could* be paid?
  **Test Case:** *Infrastructure Project.* A road builds faster/cheaper, benefiting thousands, but blights one house. The gainers could pay the loser full market value plus a premium, but do not.
  *   **Camp A Prediction:** Without actual payment, this is a rights violation. The grant is impermissible.
  *   **Camp B Prediction:** The efficiency gain is real. The failure to pay is a separate political problem, not a reason to block the grant.
  *   **Shared Observation:** We will assess whether our circle has the capacity to administer compensation. If we cannot pay compensation, Camp A must veto the grant; Camp B must overrule the veto.

  ## Part 4: Scenario Stress-Tests

  Per the brief, we apply the above logic to three specific scenarios. We record our pre-tracing predictions here to check against our later reasoning.

  | Scenario | Camp A (Safe Screen) Verdict | Camp B (Impact Rank) Verdict | Notes on Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. Village Cash**<br>Transfers to poorest 33%. Prices rise. Non-recipients lose marginally. | **REJECT.** Identifiable losers exist. The baseline (status quo prices) is violated. Compensation to non-recipients is required to pass. | **ACCEPT.** Net welfare increase is high. Marginal price rises are acceptable costs. The counterfactual (no cash) is worse for the village aggregate. | Camp A sees a rights violation; Camp B sees a efficient trade-off. |
  | **2. Broiler Welfare**<br>Corporate pledge. Birds benefit. Retail prices rise. Low-income shoppers pay. | **REJECT.** Shoppers are losers. Animals are voiceless and cannot "consent" to the trade, nor can they compensate shoppers. | **ACCEPT.** Animal suffering is a massive negative utility. Shopper cost is small financial utility. Net good is positive. | Camp A prioritises human financial status over animal welfare. Camp B prioritises suffering reduction over financial status. |
  | **3. Opportunity Cost**<br>Grant chosen helps Group X. Alternative would have helped Group Y. Group Y are the "losers". | **REJECT (if Counterfactual-Pareto adopted).** Group Y loses out compared to the alternative. No grant is Safe Pareto against the next-best alternative. | **ACCEPT.** This is the definition of allocation. We choose the greater good. Group Y's loss is regrettable but necessary. | This case tests whether the Pareto Screen is compatible with *choice*. |

  ## Part 5: Interim Decision Protocol

  We are not yet in a position to resolve the philosophical divide. However, we must allocate funds this quarter. The following rule is proposed to allow action while the deeper dispute remains unresolved.

  **The Traffic Light Protocol**

  1.  **Green Light (Unanimous Consent):** Interventions that pass the Safe Pareto Screen (Camp A's preference) *and* rank highly on Expected Value (Camp B's preference). These proceed immediately.
  2.  **Amber Light (Supermajority Required):** Interventions that fail the Safe Pareto Screen but rank highest on Expected Value.
      *   These are classified as **Silent Transfers** or **Trade-Offs**.
      *   To proceed, they require a 75% supermajority vote.
      *   The proposal must explicitly state: *Who loses, how much they lose, and why the gain justifies it.*
      *   If the losers are human and identifiable, the proposal must include a budget line for mitigation or compensation, even if symbolic.
  3.  **Red Light (Veto):** Interventions that fail the Expected Value test (negative net impact) OR interventions where the harm is severe, concentrated, and uncompensated, regardless of net benefit.
      *   Any two members may trigger a Red Light review if they believe the harm violates a fundamental right (e.g., direct physical harm).

  **Review Clause:** This protocol expires in twelve months. By that time, we agree to revisit the "Counterfactual-Pareto" and "Voiceless-Losers" definitions. If the Counterfactual-Pareto test renders the Green Light category empty, we agree to abandon the Safe Screen as a primary filter and move it to a "Risk Assessment" checklist instead.

  ***

  **Signatures:**

  _________________________ (Camp A Representative)

  _________________________ (Camp B Representative)

  _________________________ (Drafting Member)
