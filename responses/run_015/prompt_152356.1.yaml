answer: |-
  This is a sophisticated ethical mapping exercise. You are grappling with the distinction between *dirty hands* (doing a minor wrong to prevent a major one) and *structural corruption* (becoming the kind of agent who can no longer fulfill their moral function).

  Your intuition that the Physician and the Journalist should be judged differently is defensible, but only if you reject the idea that all moral trades are measured on a single utilitarian scale. To maintain consistency without overturning your verdicts, you need a principle that distinguishes between **instrumental compromises** and **constitutive compromises**.

  Here is a framework that accommodates your intuitions, followed by a prediction for the university case.

  ### The Principle: Non-Alienation of Moral Agency

  The coherent principle underlying your verdicts is this: **A moral agent may trade external resources to advance their mission, but they may not trade the constitutive elements of that mission as the currency of exchange.**

  In philosophical terms, this distinguishes between *instrumental goods* (money, time, access, political capital) and *constitutive goods* (the actual practice of the virtue itself). Integrity is lost not when you associate with a flawed system, but when the *mechanism of the trade* requires you to act against the definition of your own role.

  #### Applying the Principle to Your Cases

  **1. The Physician (Defensible)**
  *   **The Trade:** Labor/Expertise (Instrumental) $\rightarrow$ Capital $\rightarrow$ Clinics (Mission).
  *   **Analysis:** Consulting for a pharmaceutical firm is not the *definition* of being a physician; healing is. The physician sells peripheral time to fund core work. The "contamination" is financial association, not a contradiction of medical ethics. She retains agency over patient care.
  *   **Verdict:** **Pass.** The medium of exchange (money/labor) does not contradict the end (health).

  **2. The Labor Organizer (Corrupting)**
  *   **The Trade:** Voice/Advocacy (Constitutive) $\rightarrow$ Position (Instrumental).
  *   **Analysis:** The definition of a labor organizer is to oppose worker abuse. By contractually agreeing to *defend* abuses, she is using the *negation of her mission* as the currency to buy influence. She has alienated her moral agency; she is no longer an organizer, but a managed variable within the corporation.
  *   **Verdict:** **Fail.** The medium of exchange (defending abuse) contradicts the end (worker rights).

  **3. The Environmental Coalition (Split Verdict)**
  *   **Legitimate Bargaining:** Trades policy support (Instrumental/Negotiable) for legislation (Mission). Priorities remain clear. **Pass.**
  *   **Misrepresentation:** Trades Truth/Transparency (Constitutive) for Deal Stability. If they must lie about their ecological priorities, they are using deception (antithetical to advocacy integrity) to achieve conservation. **Fail.**

  **4. The Advocacy Groups (Admirable)**
  *   **The Trade:** Policy Compromise (Instrumental) for Joint Action (Mission).
  *   **Analysis:** Neither group lies about their private valuation. They compromise on the *output* (the bill), not the *input* (their moral truth). This is "comparative advantage" because they retain agency over their own value systems while cooperating on a shared instrument.
  *   **Verdict:** **Pass.**

  **5. The Journalist (Unacceptable)**
  *   **The Trade:** Transparency/Timing (Constitutive) $\rightarrow$ Access (Instrumental).
  *   **Analysis:** This is the crux of your dilemma. Why is this different from the Physician? Because for a journalist, *timely transparency* is not just a goal; it is the *method*. By agreeing to an embargo dictated by the subject of the investigation (the government), the journalist surrenders agency over the truth to the corrupt power. She is using *silence* (the opposite of her function) to buy *speech*. This creates a dependency where her ability to report relies on her willingness to withhold.
  *   **Verdict:** **Fail.** The medium of exchange (suppression of truth) contradicts the end (exposure of truth).

  ### Why the Intuition Diverges
  You felt a structural parallel between the Physician and the Journalist because both sacrifice a "purity constraint" for a "greater good." However, the Physician sacrifices a *preference* (not working for pharma) to fund the *function* (healing). The Journalist sacrifices the *function* (immediate reporting) to fund the *capacity* (future access).

  The Physician remains a physician throughout the transaction. The Journalist, during the 48-hour embargo, functions as a government press secretary.

  ### Prediction: The University Case

  **Case:** A secular research university accepts an endowed chair funded by a religious foundation. The donor holds no curriculum veto, but the chair must bear the founder's name.

  **Application of the Principle:**
  1.  **Instrumental vs. Constitutive:** The university's core function is secular inquiry (the pursuit of truth without doctrinal constraint). The funding is instrumental. The *name* is symbolic capital.
  2.  **Agency:** The donor has no veto. The university retains agency over curriculum and hiring.
  3.  **Misrepresentation/Contradiction:** Does bearing the name imply an endorsement of the founder's theology that contradicts the university's secular status?

  **Prediction:**
  This case lands in a **conditional "Pass,"** but it is riskier than the Physician case and safer than the Labor Organizer case.

  *   **Why it is Defensible:** If the naming is understood as *patronage* (acknowledging the source of funds) rather than *theological endorsement*, the university is trading symbolic association (instrumental) for research capacity (mission). As long as the curriculum remains under secular control, the constitutive function of the university is not alienated.
  *   **The Risk Factor:** Unlike the Physician (where the money is fungible), a *name* carries semantic weight. If the founder is known for anti-scientific or sectarian views, placing their name on a secular chair may create a "chilling effect" or a perception of misrepresentation (students/public might assume the chair promotes that founder's views).
  *   **The Verdict:** It is permissible **if and only if** the university publicly clarifies that the name denotes *funding source* only, not *doctrinal alignment*. If the naming creates a reasonable presumption that the chair advances the foundation's religious mission, it fails the test, as the university would be misrepresenting its secular integrity to secure funding.

  ### Summary for Your Feature

  You do not need to overturn your intuition about the Journalist. The unifying framework is **The Non-Contradiction of Means.**

  *   **Integrity is maintained** when the resources traded are external to the moral practice (money, time, political capital).
  *   **Integrity is lost** when the resource traded is internal to the moral practice (truth, advocacy, transparency, independence).

  The "Moral Exchange Rate" you are looking for is not about the *magnitude* of the good achieved, but the *location* of the sacrifice. You can sell your time to buy your mission; you cannot sell your mission to buy your time.

  **For your feature:** This distinction allows you to argue that moral systems *can* enter trade relations, but only if they treat their core virtues as **inviolable currencies**. Once you spend the virtue itself to purchase the opportunity to practice it, you have not made a trade; you have undergone a liquidation.
