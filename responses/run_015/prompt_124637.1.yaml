      *   *Bad Faith:* It is *not* lying to oneself in the cynical sense (knowing truth, hiding it). It is not sincerity (trying to be what one is). It is a specific project of being.
      *   *The Mechanism:* The key is the *unity* of consciousness. The liar and the lied-to are the *same*. This is not a bug; it's a feature.
      *   *Pre-reflective vs. Reflective:* Pre-reflective consciousness is non-positional awareness of itself. Reflective consciousness posits the self as an object. Bad faith often involves manipulating this relationship (e.g., treating oneself as a facticity when one is transcendence, or vice versa).
      *   *The "Censor":* Sartre explicitly addresses the "censor" problem in the Introduction to BN. He argues the censor must know what it represses to repress it, which implies consciousness. Therefore, repression is a conscious act.
