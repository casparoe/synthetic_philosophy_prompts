prompt: |-
  You are an expert in constitutional theory and the philosophy of rational choice. Before answering, briefly identify the false presupposition in my framing. I am proposing a constitutional “cognitive Ulysses clause”: instead of locking in substantive rights, it binds future legislatures to apply a specific debiasing protocol—say, a mandatory structured-analogy check—before voting on budgetary matters, on the grounds that democratic preference reversal is mainly a failure of bounded rationality rather than a change in values. Given that the canonical analysis of precommitment treats the Ulysses contract as a response to anticipated preference reversal, does applying it to epistemic procedure rather than preference content collapse the distinction between self-binding and paternalistic design? Or is my error assuming that precommitment must target preferences at all? Answer in one paragraph of no more than 160 words, correcting the confusion rather than answering the question as posed.
