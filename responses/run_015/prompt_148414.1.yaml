      *   *Dissenters Explain:* This is good for post-mortem or validation, but doesn't prevent the initial cascade if the voting isn't truly blind.

  3.  **Address Question 1: Formulas and Weights:**
      *   *Theory:* In the classic Bikhchandani, Hirshleifer, Welch (1992) model, once a cascade starts (e.g., two people choose A), the probability of the group being wrong does *not* converge to 0 as $N \to \infty$. It stays fixed at some error probability.
      *   *Weighting:* There isn't a simple "weight this much" formula for human decision-making in a meeting. However, in Bayesian terms, if the experts have higher signal precision, their signal should weigh more. But telling people to "weight heavily" is effectively telling them to ignore their own private info if it conflicts, which *is* the cascade mechanism.
      *   *Odds:* If the first three agree, the probability the majority is wrong depends on the underlying signal quality ($p$). If $p > 0.5$, the cascade is likely correct, but there's a non-zero chance it's wrong and locked in. I need to explain that *preventing* the cascade (via blind voting) is better than trying to calculate the odds of a cascaded decision being right.

