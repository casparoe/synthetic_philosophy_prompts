      *   *Winner:* **Non-Vacuity**. It's the hardest to satisfy mathematically without arbitrary thresholds. Both strict Gene's Eye (ignores group variance) and loose MLS (accepts all variance partitions) struggle here. But specifically, **Non-Vacuity** kills the "Mathematical Partitioning" version of MLS because partitioning is always possible, so claiming a level is *the* unit becomes vacuous without a causal threshold.

