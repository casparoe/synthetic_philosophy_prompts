  2.  **Deconstruct the Desiderata (Drafting the List):**
      *   *Job Clarification:* The theory must explicitly state if it's defining the *replicator* (what gets copied), the *interactor* (what interacts with the environment), or the *beneficiary* (who the adaptation serves). Or it must show how they map.
      *   *Altruism/Group Traits:* Must distinguish between a trait spreading *because* it helps the group (group selection) vs. a trait spreading due to individual advantage that happens to help the group (byproduct). Needs a testable condition for "group as unit."
