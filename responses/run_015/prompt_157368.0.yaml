answer: |-
  Here is the specification for a theory of units of selection, drafted as a set of engineering desiderata for a working biological tool.

  ### Desiderata for a Theory of Units of Selection

  **1. Job Clarification and Mapping**
  *   **Requirement:** The theory must explicitly state which of the three distinct conceptual jobs it is defining: (a) the **Replicator** (the entity whose frequency changes via copying), (b) the **Interactor** (the entity whose differential survival/reproduction causes the change), or (c) the **Beneficiary** (the entity for whose good the adaptation appears designed). If the theory claims these converge, it must provide the causal mechanism linking them.
  *   **Case:** A biologist studying altruism needs to know if they are measuring the survival of the vehicle (interactor) or the transmission of the code (replicator). Conflating these leads to errors where a trait that benefits the gene (replicator) is misidentified as benefiting the organism (beneficiary), or vice versa.

  **2. The Altruism Test (Costly/Beneficial Traits)**
  *   **Requirement:** The theory must provide a criterion to distinguish between a trait spreading *because* it benefits the collective (group selection) versus a trait spreading due to individual advantage that merely correlates with group benefit (byproduct). It must specify what empirical evidence would settle that the group is a genuine unit rather than a statistical aggregation.
  *   **Case:** Reproductive restraint prevents population crash. Is this selected because groups with restrainers out-compete groups without (group unit), or because restrainers avoid competition and survive better individually (individual unit)? The theory must demand evidence of between-group variance driving the change, not just the existence of the trait.

  **3. Intragenomic Conflict Handling**
  *   **Requirement:** The theory must account for elements that spread while reducing the fitness of the carrier organism (e.g., segregation distorters/meiotic drive) without relying solely on the tautology that "genes are what get transmitted." It must explain why the organism ceases to be the unit of selection in this specific context.
  *   **Case:** A "selfish" gene sabotages rival gametes, reducing the organism's total fertility. A gene-centric view says "genes are the unit." An organism-centric view says "organisms are the unit." The theory must explain how selection acts at the gene level *within* the organism without rendering the organism-level selection claim vacuous.

  **4. Non-Vacuity (Falsifiability)**
  *   **Requirement:** The claim "Level L is a unit of selection in this scenario" must be capable of being false. The theory cannot rely on mathematical frameworks that allow variance to be partitioned across all levels simultaneously without a threshold for causal significance. It must define a condition under which a level is *excluded* from being a unit.
  *   **Case:** You can mathematically partition selection into gene, cell, organism, and group components in any dataset. If the theory accepts any non-zero partition as evidence of a unit, it explains nothing. It must specify a threshold (e.g., magnitude of variance, causal direction) that rules out levels where selection is negligible or derivative.

  **5. Collective Fitness Definition**
  *   **Requirement:** The theory must distinguish between defining a collective's fitness as the **average fitness of its members** versus the **reproduction rate of the collective itself** (e.g., colony fissioning, nest founding). It must state whether the verdict on "unit status" can flip depending on which definition is applied.
  *   **Case:** In eusocial insects, workers have zero reproduction (average member fitness is low for them), but the colony fissions (collective fitness is high). If the theory uses average member fitness, the colony is not a unit. If it uses collective reproduction, it is. The theory must declare which metric determines unit status.

  **6. Collective Heritability**
  *   **Requirement:** The theory must define what counts as heritable variation at the collective level without stipulating a priori that groups are too unstable to inherit traits. It must identify the mechanism of collective replication (e.g., budding, swarming, cultural transmission) that allows group-level traits to persist across generations.
  *   **Case:** If groups dissolve every generation, they cannot be units of selection. But if a colony sends out a queen and drones to found a new colony with similar social structure, that is heritability. The theory must accept this as valid group-level heritability if the fidelity meets a specified threshold.

  **7. Selection vs. Benefit Distinction**
  *   **Requirement:** The theory must not collapse the level at which selection *acts* into the level that *benefits*. It must allow for cases where selection at Level A produces a trait that benefits Level B (byproducts) or harms Level B (conflict).
  *   **Case:** Individual selection might produce a trait that incidentally helps the group. If the theory defines the unit of selection as "who benefits," it will misidentify the individual as a group. The causal source of the frequency change must be separable from the recipient of the benefit.

  **8. Boundary Cases and Empirical Evidence**
  *   **Requirement:** The theory must handle boundary cases (eusocial colonies, hosts with obligate symbionts/holobionts) by specifying what evidence counts for a level, distinct from inferring the level back from the outcome. Evidence must involve manipulation or variance measurement, not just adaptationist storytelling.
  *   **Case:** Is a coral holobiont (animal + algae) a unit? Inferring "yes" because they look integrated is circular. The theory must require evidence such as joint reproduction, aligned fitness variance, or bottlenecking that ensures shared fate, rather than just mutual benefit.

  ***

  ### The Tension: Conflicting Desiderata

  **The Pair:** **Non-Vacuity (4)** and **Collective Fitness Definition (5)**.

  **The Conflict:** To satisfy **Non-Vacuity**, you need a strict criterion to rule out levels where selection is weak or mathematically redundant. However, to satisfy **Collective Fitness Definition**, specifically regarding colony fissioning, you must acknowledge that some collectives reproduce as wholes (like organisms).
  If you set the bar for "collective reproduction" high enough to ensure Non-Vacuity (e.g., requiring a strict bottleneck and high fidelity), you risk excluding genuine biological cases where collectives reproduce messily (e.g., slime molds, some social insects). If you set the bar low enough to include all fissioning collectives, you risk making the theory vacuous, because almost any aggregate that persists can be described as "reproducing" in some loose sense, blurring the line between an organism and a herd. You cannot easily demand strict individuality for non-vacuity while accepting messy collective reproduction for biological accuracy.

  ***

  ### The Killer Requirement

  **Requirement:** **Non-Vacuity (4)**.

  **Why:** This is the requirement that knocks out the most popular positions, specifically the **Price-Equation style Multi-Level Selection (MLS)** and strict **Gene's-Eye View**.
  *   **For MLS:** The Price equation allows you to partition selection variance at *any* level in *any* population. Without a Non-Vacuity clause (a threshold for when a partition counts as "selection at that level"), MLS becomes a descriptive mathematical truism rather than a causal theory. It can't tell a biologist to ignore the group level, because the math always finds a group component.
  *   **For Gene's-Eye:** If the theory claims genes are the *only* unit, it must explain away group-level variance as always reducible to gene-level variance. Non-Vacuity demands that if the group-level variance has causal power that cannot be reduced without losing explanatory precision, the gene-only view is false. Most strict gene-centric views fail to provide a threshold for when emergent group causality becomes real enough to count as a unit.

  ***

  ### Scorecard

  | Position | Job Clarification (1) | Altruism Test (2) | Non-Vacuity (4) | Collective Fitness (5) | Utility for Biologist |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Gene's-Eye View** | **Pass.** Clearly identifies the replicator. | **Fail.** Treats group benefits as gene strategies; struggles to validate group units even when empirically distinct. | **Fail.** Often vacuous by claiming all selection is gene selection by definition. | **Fail.** Struggles with colony fissioning; views colony reproduction as gene propagation only. | **Low.** Tells geneticists what to sequence, but misleads ecologists on population dynamics. |
  | **MLS (Price-Style)** | **Fail.** Often conflates interactor and beneficiary; mathematically agnostic on "unit." | **Pass.** Excellent at partitioning costly/beneficial traits. | **Fail.** Mathematically non-vacuous partitions exist for all levels; lacks causal threshold. | **Pass.** Handles collective reproduction well via variance components. | **Medium.** Great for statistical analysis, bad for deciding which level *matters* causally. |
  | **Pluralism** | **Pass.** Acknowledges different jobs for different questions. | **Pass.** Allows context-dependent verdicts. | **Pass.** Can set thresholds based on the specific research question. | **Pass.** Accepts multiple fitness definitions. | **High (with caveats).** Most flexible, but risks telling the biologist "it depends" without guiding *which* question to ask first. |

  **Summary:** The Gene's-Eye view wins on transmission fidelity but fails on emergent causality. The MLS view wins on statistical partitioning but fails on causal exclusivity. Pluralism wins on utility but fails on providing a unified verdict. To build the tool you want, you must adopt Pluralism's flexibility but enforce the **Non-Vacuity** constraint to prevent it from becoming "anything goes."
