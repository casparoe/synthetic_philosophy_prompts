      *   Step (5) is the weakest link. It assumes that *any* propositional content in the HOS generates a corresponding *phenomenal* experience.
      *   HOT theorists (like Rosenthal) distinguish between *transitive consciousness* (being aware of the state) and the *quality* of the state. The quality is determined by what the HOS represents the FOS as being. But the HOS is constrained by the subject's conceptual repertoire.
