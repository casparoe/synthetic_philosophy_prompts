prompt: |-
  Draft the joint statement of an adversarial collaboration between a defender of superrational coordination in symmetric one-shot games and a defender of causal-evidential independence in the same setting, focused specifically on the Platonia dilemma and the Luring Lottery.

  The document should contain:

  1. A numbered section of claims both can sign. These should cover: the formal payoff structures of both puzzles; the information conditions (no communication, one-shot); what standard causal decision theory and evidential decision theory respectively recommend in each case; the observation that the puzzles are designed to test whether identical reasoning processes can produce correlated choices without causal interaction; and an explicit agreement on what counts as a resolution, for example a principled reason that applies to all agents of the same reasoning type.

  2. A disagreements table with two columns—one worded as the superrationalist would accept it, one as the independence-reasoner would accept it—covering at least: (a) whether recognizing oneself as an instance of a shared reasoning algorithm provides a rational basis for choosing an action that is optimal only if the other does likewise, absent any causal or evidential link; (b) whether the discontinuous payoff jump in the Luring Lottery undermines the symmetry required for superrational reasoning; and (c) whether the correct resolution requires revising decision-theoretic norms or only clarifying the domain over which they apply.

  3. The cruxes—sub-questions such that settling them would move at least one side. Specify these precisely, including: whether rationality is indexed to a token mental state or to a type-level algorithm (inject and define this token-type distinction here); and whether a payoff discontinuity can be bridged by a continuity principle without begging the question against independence.

  4. For each crux, identify a concrete case or argument both sides agree is relevant, and record each side's prediction in advance. For instance, both may agree that a noisy-reasoning variant of Platonia—where agents share the algorithm but execute it with independent error—is relevant; the superrationalist should predict that correlation survives below the noise threshold that makes token-identicality fail, while the independence-reasoner should predict that any token-level divergence severs the rational link and restores independent choice.

  Keep all formulations neutral: do not adjudicate which view is correct. Avoid requests for bibliographies, reading lists, or citations. Do not invoke formal apparatus beyond what is necessary to describe the two puzzles. You may sharpen the disagreement by introducing the token-indexed versus type-indexed rationality distinction, but ground the discussion in the actual structure of the Platonia dilemma and the Luring Lottery rather than in hypothetical variants that alter their core conditions.
