answer: |-
  # Joint Statement of Adversarial Collaboration: Superrationality and Independence in Symmetric One-Shot Games

  **Date:** October 26, 2023
  **Parties:** The Superrationalist (Defender of Superrational Coordination) and The Independence-Reasoner (Defender of Causal-Evidential Independence)
  **Subject:** The Platonia Dilemma and The Luring Lottery

  ## 1. Agreed Claims

  The undersigned parties agree to the following factual and structural claims regarding the puzzles under discussion. This section establishes the common ground necessary to isolate the theoretical disagreement.

  1.  **Formal Payoff Structures:**
      *   **The Platonia Dilemma:** There are 20 participants. Each may choose to send a letter or not. If exactly one participant sends a letter, that participant receives a large prize (e.g., $1,000,000). If zero participants send a letter, or if two or more send letters, no one receives anything.
      *   **The Luring Lottery:** There are 20 participants. Each may submit an entry (or a number of entries). The prize is a fixed sum divided equally among all submitted entries. If an individual submits an entry, they receive a share of the prize inversely proportional to the total number of entries submitted by all participants. If no one submits, no prize is awarded. The payoff for any individual drops discontinuously as the total count of entries increases.

  2.  **Information and Interaction Conditions:**
      *   In both puzzles, the game is one-shot; there is no opportunity for repeated interaction or reputation building.
      *   There is no communication channel between participants prior to or during the decision.
      *   All participants are assumed to be rational agents with access to the same problem description and logical capabilities (symmetry of reasoning).

  3.  **Standard Decision-Theoretic Recommendations:**
      *   **Causal Decision Theory (CDT):** Recommends choosing the action that maximizes expected utility based solely on the causal consequences of that action. Since one's choice cannot causally influence the choices of others in a one-shot setting without communication, CDT treats others' actions as fixed background conditions.
      *   **Evidential Decision Theory (EDT):** Recommends choosing the action that provides the best news about the outcome. If one's own choice is evidentially correlated with the choices of others (due to shared reasoning), EDT factors this correlation into the expected utility calculation.

  4.  **Purpose of the Puzzles:**
      *   Both parties agree that these puzzles are designed to test whether identical reasoning processes can produce correlated choices in the absence of causal interaction or explicit pre-commitment. They isolate the tension between individual causal efficacy and logical correlation.

  5.  **Criteria for Resolution:**
      *   Both parties agree that a satisfactory resolution must provide a principled reason that applies universally to all agents of the same reasoning type. A solution cannot rely on arbitrary asymmetries (e.g., "Agent A should submit, Agent B should not") unless those asymmetries are grounded in the problem structure.

  ## 2. Statement of Disagreements

  The following table outlines the core theoretical divergences. The left column represents the position as the Superrationalist accepts it; the right column represents the position as the Independence-Reasoner accepts it.

  | Topic | Superrationalist Position | Independence-Reasoner Position |
  | :--- | :--- | :--- |
  | **(a) Algorithmic Identity as a Rational Basis** | Recognizing oneself as an instance of a shared reasoning algorithm provides a sufficient rational basis for choosing an action that is optimal only if the other does likewise, even absent causal or standard evidential links. | Recognizing oneself as an instance of a shared reasoning algorithm does not provide a rational basis for coordination absent a causal mechanism or a probabilistic evidential link established by prior common cause. |
  | **(b) Payoff Discontinuity and Symmetry** | The discontinuous payoff jump in the Luring Lottery (where one additional entry drastically reduces individual share) does not undermine the symmetry required for superrational reasoning; agents must navigate the discontinuity together via shared randomization or constraint. | The discontinuous payoff jump in the Luring Lottery undermines the stability required for superrational reasoning; the marginal impact of a single entry varies too wildly to sustain the assumption that identical reasoning yields identical outcomes. |
  | **(c) Norm Revision vs. Domain Clarification** | The correct resolution requires revising decision-theoretic norms to acknowledge that logical necessity can function as a form of coordination equivalent to causal influence. | The correct resolution requires clarifying the domain over which existing norms apply, restricting rational coordination to cases where causal or probabilistic dependence is physically instantiated. |

  ## 3. The Cruxes

  To move this collaboration forward, we identify two specific sub-questions (cruxes). Settling these would significantly alter the confidence of at least one side. We introduce the following distinction to sharpen these cruxes:

  *   **Token-Indexed Rationality:** Rationality is a property of the specific, physical instantiation of a mental state at a specific time and place (the *token*). Two agents may run the same code, but if their physical tokens are distinct, their choices are independent.
  *   **Type-Indexed Rationality:** Rationality is a property of the abstract algorithm or reasoning procedure (the *type*). If two agents instantiate the same type, their outputs are logically linked regardless of physical separation.

  **Crux 1: The Indexing of Rationality**
  *   **Question:** Is rational choice indexed to the token mental state of the individual agent, or to the type-level algorithm implemented by the agent?
  *   **Significance:** If rationality is token-indexed, the Independence-Reasoner's view holds (my physical choice cannot move your physical choice). If rationality is type-indexed, the Superrationalist's view holds (my implementation of the type determines the output of the type everywhere).

  **Crux 2: Continuity Principles and Payoff Discontinuities**
  *   **Question:** Can a payoff discontinuity be bridged by a continuity principle without begging the question against independence?
  *   **Significance:** This addresses whether we can treat the discrete steps of the Luring Lottery (or the cliff-edge of Platonia) as limits of a continuous function to derive a stable solution. If the solution diverges as the function approaches the discrete limit, the discontinuity is fundamental.

  ## 4. Concrete Cases and Predictions

  For each crux, we identify a concrete case or argument both sides agree is relevant. We record each side's prediction in advance to allow for empirical or logical testing.

  **Case for Crux 1: The Noisy-Reasoning Variant of Platonia**
  *   **Scenario:** A variant of the Platonia Dilemma where 20 agents share the same reasoning algorithm but execute it with independent, small probabilistic errors (noise). For example, the algorithm dictates "Submit with probability *p*," but physical implementation flips the outcome with a 1% chance.
  *   **Superrationalist Prediction:** Correlation survives below the noise threshold that makes token-identicality fail. Agents should still adjust *p* as if their choices are linked, because the *type* remains identical despite token-level noise. The optimal *p* remains near 1/20.
  *   **Independence-Reasoner Prediction:** Any token-level divergence severs the rational link and restores independent choice. As soon as noise is introduced, the logical necessity dissolves into mere statistical correlation, and agents should revert to standard CDT calculations based on fixed probabilities of others' actions.

  **Case for Crux 2: The Smoothing Limit of the Luring Lottery**
  *   **Scenario:** A sequence of lottery games where the payoff function is smoothed. In Game 1, the prize is divided by the exact integer count of entries (discontinuous). In Game *N*, the prize is divided by a continuous variable that approximates the count, approaching the discrete integer function as *N* goes to infinity.
  *   **Superrationalist Prediction:** The solution converges as smoothing approaches zero. The superrational strategy derived from the continuous version remains valid for the discrete Luring Lottery, implying the discontinuity can be bridged by logical continuity.
  *   **Independence-Reasoner Prediction:** The solution diverges or changes category at the limit. The optimal strategy in the continuous smoothing case relies on marginal causal impacts that vanish or become undefined in the discrete case, proving that the discontinuity fundamentally alters the rational requirement.

  ***

  **Signed,**

  _________________________
  (The Superrationalist)

  _________________________
  (The Independence-Reasoner)
