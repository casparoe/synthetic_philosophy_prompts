  2.  **Deconstruct the Arguments & Objections:**

      *   **Objection 1: The "Temporary Intrinsics" Charge.**
          *   *User's Worry:* If I say "straight-at-t1" relative to chunk 1, haven't I just relativized properties like the standard perdurantist (Lewis-style)?
          *   *Analysis:* Standard perdurantism says $O$ has part $P_1$ at $t_1$ which is straight, and part $P_2$ at $t_2$ which is bent. The user says $O$ has chunk $C_1$ (spanning $t_1$ to $t_n$) which is "burning."
          *   *Critique:* If the chunk spans time, how does it handle change *within* the chunk? If the candle is straight then bent *within* the "burning" chunk, does the chunk itself have contradictory properties? If the chunk is the bearer of properties, and the chunk is extended, then the property must be extended (e.g., "bending" rather than "bent"). This actually *solves* the instantaneous slice problem but raises the "vagueness" problem.
