      *   *Analogy Idea 2:* A microservices architecture. Does Service A call Service B directly, or do they both report to an Orchestrator (God) who triggers the next step?
      *   *Analogy Idea 3:* Logical necessity vs. Empirical observation. Just because the code *always* runs a certain way doesn't mean the compiler *forces* it logically; it's just how the runtime is configured.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be clear and engaging.
      *   **Introduction:**
          *   Hook: The fire and cotton problem.
          *   Context: Ghazālī vs. Avicenna.
          *   Thesis Statement: Ghazālī is *not* a strict occasionalist in the sense of denying creaturely power entirely; rather, he is a critic of *causal necessity* who re-grounds causation in God's consistent will, allowing for a functional, created nature in creatures. (I need to pick a side. The "Middle Ground" is often the more nuanced scholarly consensus recently, but for a strong essay, I should argue he is a *theological compatibilist*—denying necessity but keeping causation. Let's argue he is **not** a strict occasionalist but a **contingent causal realist**.)
      *   **Background (The "Codebase" of the Universe):**
          *   Explain Avicenna's view: The universe runs on auto-pilot logic. Fire *must* burn.
          *   Explain Ghazālī's objection: You can't prove the "must."
          *   SE Analogy: Hard-coded constraints vs. runtime configuration.
      *   **The Case for Occasionalism (The "Orchestrator" Model):**
          *   Textual evidence: Ghazālī says God creates the burning.
          *   Analogy: Event listeners. Fire touches cotton -> Event fired -> God's Handler executes `burn()`. Fire is just the trigger, not the worker.
          *   Why this makes sense: Protects God's omnipotence.
      *   **The Case Against Strict Occasionalism (The "API" Model):**
          *   Textual evidence: Ghazālī admits "natures" (ṭabāʾiʿ). He doesn't want to deny science.
          *   Analogy: Dependency Injection. God injects the power to burn into the Fire object. Fire *does* the burning, but it only has that method because God gave it that class definition.
          *   Why this makes sense: Preserves human responsibility and the utility of science.
      *   **Synthesis & Argument:**
          *   Ghazālī's target is *philosophical arrogance*, not *physical reality*.
          *   He attacks the claim that humans can *know* the necessity, not necessarily that the connection doesn't exist.
          *   He distinguishes between "Logical Necessity" (2+2=4) and "Habitual Regularity" (Sun rises).
          *   Conclusion: He allows creaturely causation but makes it contingent (dependent), not necessary (independent).
      *   **Conclusion:**
          *   Restate thesis.
          *   Final SE Analogy: God is the System Administrator who sets the permissions. The programs (creatures) run, but they don't own the kernel.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Contingent Causal Realist" too jargon-heavy?
