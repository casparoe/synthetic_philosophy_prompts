      4.  The Alternative Reading: God configures the objects with powers.
      5.  The Verdict: Ghazālī as a "Contingent Causation" advocate.
      6.  Conclusion: Why this matters (Science + Faith).

  *(Self-Correction on Thesis)*: To be most persuasive, I should acknowledge that he *sounds* like an occasionalist but functions as a critic of necessity. I will argue that classifying him as a "strict occasionalist" is a misclassification based on reading his theological boundary-setting as his full physical ontology.

