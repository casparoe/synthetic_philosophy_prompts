answer: |-
  The tension you have identified is not a misunderstanding of the physics, but a precise detection of the gap between ontology and methodology. Your experimental practice is built on a framework of inference that assumes a specific relationship between *what exists* and *what is observed*. When you move from a collapse ontology (where only one outcome becomes real) to a unitary ontology (where all outcomes become real), the justification for that inference framework must shift, even if the calculations remain identical.

  Here is the reconstruction of the implicit theory your practice relies on, distinguished by what it strictly requires versus what merely fits comfortably.

  ### 1. The Implicit Theory of Evidence: Typicality, Not Uniqueness

  Your practice strictly presupposes a **Principle of Typicality**.

  In a collapse theory or a hidden-variable theory, the exclusion of the "deviant branch" hypothesis from your menu is ontological. If a 5-sigma deviation occurs, and the theory is true, that outcome *did not happen*. Therefore, if you see it, the theory is false (or the apparatus is broken). The rarity of the event is a rarity of *existence*.

  In Many-Worlds (MWI), the exclusion of the "deviant branch" hypothesis is methodological. If a 5-sigma deviation occurs, and the theory is true, that outcome *did happen* (on some branch). Therefore, the observation alone does not falsify the theory. To maintain the practice of falsification, you must add a rule: **"I should reason as if I am located on a branch selected by the Born measure."**

  This is the Principle of Typicality. It asserts that while deviant branches exist, they are not appropriate locations for *inductive inference*. Your practice treats the Born measure not just as a physical weight, but as a **self-locating probability distribution**. You are assuming that you are a "typical" observer-moment within the wavefunction.

  *   **Strict Presupposition:** The practice requires that the Born measure tracks subjective expectation. Without this, the concept of "statistical fluctuation" loses its normative force. If all branches are equally real, a 5-sigma branch is just as real as a 0-sigma branch. To treat the 5-sigma branch as "evidence against the model" rather than "evidence of our location," you must assume that being on a low-measure branch is a form of epistemic bad luck that we are licensed to ignore for the sake of theory building.
  *   **Merely Comfortable:** The idea that low-measure branches are "less real." The practice does not need them to be less real; it only needs you to act as if you won't find yourself there.

  ### 2. Credence vs. Betting: Resolving the Friend/Supervisor Dispute

  Your friend and your supervisor represent the two standard ways to bridge the gap between unitary dynamics and the Born rule. Your practice actually sides with your **friend**, despite your supervisor's pragmatic defense.

  *   **The Supervisor (Decision Theory):** This view argues you don't need to *believe* you are likely to be on a high-weight branch; you only need to *bet* that way because high-weight branches contain more "copies" of your future self who win the bet. This works for *action* (e.g., designing a detector), but it fails for *claim-making*.
  *   **The Friend (Self-Locating Credence):** This view argues you must assign a credence $P = |amplitude|^2$ to finding yourself on a specific branch.

  **Why the practice favors the Friend:**
  Particle physics does not merely place bets; it asserts truths. When you announce a discovery at 5-sigma, you are claiming "The Standard Model is incomplete," not "Betting against the Standard Model is profitable." If the Supervisor were right, and this were only about betting norms, then a 5-sigma deviation would not imply the model is wrong; it would only imply you are in a high-payoff (or low-payoff) sector of the wavefunction. To claim the *model* is wrong based on data, you must treat the data as *evidence*, which requires epistemic probabilities. You must believe that finding yourself on a 5-sigma branch is genuinely improbable *for you*, not just that such branches have low weight.

  Therefore, the practice commits you to a genuine self-locating credence distributed by the Born measure. The Supervisor's story explains why you *act* this way; the Friend's story explains why you claim *knowledge* this way. Science requires the latter.

  ### 3. Underdetermination and the "Expense" of MWI

  You asked if the fact that collapse/hidden-variable theories license the same behavior undercuts your friend's argument. It does not; it relocates it.

  *   **Collapse/Hidden Variables:** The link between formalism and experience is ontological. The theory says only one outcome occurs. Therefore, $P(outcome) = 1$ for the actual outcome and $0$ for others. The "Principle of Typicality" is built into the reality condition.
  *   **MWI:** The link is epistemological. The theory says all outcomes occur. The "Principle of Typicality" must be added as a bridge principle connecting the wavefunction to the observer.

  Your friend's argument is that MWI is "more expensive" because it requires this extra bridge principle to recover the standard scientific practice that collapse theories get for free. The underdetermination of the *practice* (both look the same in the lab) does not erase the difference in *theoretical cost*. The practice is neutral regarding which ontology is true, but it is **not neutral regarding the epistemic rules required to make sense of that ontology.**

  If you adopt MWI, you must accept that your standard statistical methods are not derived solely from the Schrödinger equation, but from the Schrödinger equation *plus* a rule about self-location. If you adopt Collapse, the statistical methods are derived from the Schrödinger equation *plus* the collapse postulate. The "expense" is shifted from the dynamics (collapse) to the epistemology (self-location).

  ### 4. Counterfactual: If the View Changed

  If you explicitly adopted the view that "we might be on a low-measure branch" as a valid scientific explanation (i.e., you rejected the Principle of Typicality), the lab practice would collapse.

  *   **The Anomaly Menu:** "We occupy a low-measure branch" would become an admissible item. Consequently, **no deviation could ever falsify a theory.** Any discrepancy, no matter how large, could be explained away by "we are on an anomalous branch." Falsifiability would vanish.
  *   **Replication:** Independent replication would lose its force. In MWI, if Collaboration A sees an anomaly and Collaboration B does not, both results exist. Currently, you trust B over A because B is higher weight. If you allow "low-measure" as a valid explanation for A, you must admit A is a valid description of reality. You could no longer claim A is "wrong" or "a fluke," only "atypical." Science relies on discarding the atypical to find the lawlike.
  *   **Branch Counting:** Your practice rules out "branch counting" (where every branch has equal weight regardless of amplitude). If branch counting were true, you should expect to see deviations from the Born rule frequently (since most branches, by count, would not follow the Born distribution in a finite sample). The fact that your frequencies track the Born rule so precisely is empirical evidence *against* branch-counting MWI.
  *   **Finite Branches:** The practice does not require the total number of branches to be finite, but it does require the **measure to be well-defined**. If the decomposition into branches is arbitrary or the measure is ill-defined, you cannot calculate the "weight" of your branch, and the Principle of Typicality cannot be applied. The practice presupposes a preferred basis or a decoherence mechanism that stabilizes the branches enough to assign weights.

  ### 5. The Single Feature and the Softest Point

  **The Single Feature:**
  The philosophical work is being done by the **identification of Measure with Probability.**
  In the formalism, $| \psi |^2$ is a conserved quantity (norm). In your practice, $| \psi |^2$ is a likelihood of experience. The entire edifice of your experimental justification rests on the assumption that these two concepts are identical. Without this identification, the "5-sigma" threshold is just a number with no connection to the rationality of believing a theory is false.

  **The Softest Point:**
  The reconstruction is softest at the **derivation of the Born Rule within MWI.**
  Your supervisor's betting argument (Decision Theory) and your friend's credence argument (Self-Locating Uncertainty) are attempts to derive this identification from the rest of the theory. Neither is universally accepted as a rigorous derivation.
  *   If the betting argument fails, your practice is pragmatically useful but epistemically unjustified in MWI (you are acting *as if* the theory is false to do science).
  *   If the credence argument fails, you have no reason to expect the future to resemble the past in terms of frequencies, because "expectation" has no grip on a multiverse where everything happens.

  The practice assumes this derivation succeeds. If it turns out that Measure cannot be rigorously equated to Probability within a unitary framework, then your experimental practice is technically irrational under MWI, even if it remains effective. You are effectively importing a collapse-like assumption (that some outcomes are "more likely" to be experienced) into a theory that explicitly denies outcomes are selected.

  ### Summary

  Your practice is not interpretation-neutral. It is **inference-neutral** but **ontology-sensitive**. It requires a rule that tells you which parts of the ontology to trust for inductive reasoning.
  *   **Collapse:** Trust the unique actual history.
  *   **MWI:** Trust the high-measure history (Principle of Typicality).

  By never listing "we are on a low-measure branch" as an explanation, you are enforcing the Principle of Typicality as a methodological constraint. You are declaring that science is the study of the high-weight sectors of the wavefunction, and that observations from low-weight sectors are to be treated as noise, regardless of their ontological reality. Your friend is correct that this adds a posit to the bare formalism; your supervisor is correct that it functions as a betting norm; but the *claim to knowledge* inherent in your job requires the friend's posit to be true.
