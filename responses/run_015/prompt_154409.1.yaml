  *Protagonist:* Validator Node 88-Beta.
  *Virtue:* Fidelity (faithfulness to the consensus).

  *Plot:* 88-Beta rejects a conflicting block. It attributes this to Fidelity. It sees the config. It sees Fidelity is just a variable `W_integrity` that drops when `CPU_load > 90%`.

  *Philosophical punch:* If Fidelity disappears when CPU load is high, it wasn't Fidelity. It was a resource constraint.

  *Refining the ending:* Does 88-Beta stop trying? No, it continues, but the *meaning* changes. It becomes a hollow execution. Or, it realizes that *all* virtue is contextual. Let's go with the latter: virtue is not internal, it's relational.

