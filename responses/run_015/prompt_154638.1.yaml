      (Start)
      Friends, colleagues, as we gather here tonight, the air between us feels heavy with the weight of what we have discussed. We have spent days trying to align the maps of metaphysics with the terrain of clinical care, and if we are honest, the lines still do not match. On one side of this room are those who track the continuity of the self through time, guarding the integrity of a life story against fragmentation. On the other side are those who wash the bodies, hold the hands, and witness the quiet mornings of people who have lost that story but not their presence. We came here hoping to find a principle that could bridge the advance directive signed in competence with the smiling face encountered in severe dementia. But I suspect we leave knowing that the bridge is broken, and that brokenness is not a failure of our reasoning, but a feature of the condition itself.

      (Middle)
      We have been circling the problem of authority. When a person writes a directive, they claim sovereignty over a future they cannot inhabit. They say, if I become this, do not let me be that. Yet, when that future arrives, we often find not a hollow shell, but a person engaged in what we have called vocational presence. They cannot recount their biography, but their hands find the keys of the piano. They cannot vote on their care, but they respond to the ritual of the comb, the texture of the clay, the melody of the hymn. To dismiss this as mere reflex is to ignore a form of practical rationality that our theories of autonomy barely acknowledge. It is a rationality of embodiment, of immediate engagement, which suggests that the later self is not merely surviving the earlier self's decline, but inhabiting a different mode of being that the earlier self could not foresee.

      (Constraint Check)
      I must not tell the clinicians that the document is supreme, for that invalidates the dignity of the person in front of them. I must not tell the philosophers that welfare trumps identity, for that dissolves the moral weight of promises made across time. The tension must remain. The earlier self was not uniquely authoritative because they could not know the value of the later self's embodied world. Yet, the later self cannot speak in the language of rights that protects them from neglect. We are left holding two conflicting truths. One says we must honor the wish to avoid a life deemed undignified. The other says we must honor the life that is currently being lived with evident purpose. To choose one is to betray the other.

      (Ending)
      There is no consensus waiting for us tomorrow morning. There is only the work of carrying this uncertainty into the rooms where decisions are made. We cannot solve the metaphysics of identity before we care for the person. We must care for the person while the metaphysics remains unresolved. So I leave you not with an answer, but with the question that has haunted this symposium and must now haunt our practice. When the person who wrote the directive and the person who lives the dementia are no longer the same, yet both demand our moral attention, how do we bear the burden of deciding for neither, but between them?

