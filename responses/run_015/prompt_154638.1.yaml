      Friends, colleagues. We sit here after days of talking about who we are over time. The philosophers speak of psychological continuity. The clinicians speak of the person in the bed. The advance directive is the law of the dead self. But the living self sings. We cannot say the document wins. We cannot say the smile wins. There is a rationality in the hands playing the piano that isn't in the words written years ago. The earlier self thought they knew best, but they couldn't know this specific joy. Yet, we promised them. We are held between two valid claims. There is no solution. So I ask you...

