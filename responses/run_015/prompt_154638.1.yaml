          *   Must be intelligible to clinicians without condescension.
          *   Must avoid false comfort or a tidy conclusion (no consensus reached).
          *   Format: Continuous prose, approx. 4 minutes spoken (roughly 500-600 words), no headings/bullets/bold/tables.
          *   Ending: Open question, not a prescription.

  2.  **Determine Tone and Style:**
      *   Tone: Respectful, contemplative, humble, bridging theory and practice.
      *   Style: Spoken word, flowing, narrative-driven but conceptually rigorous.
      *   Length: ~4 minutes speaking time. Average speaking rate is ~130-150 words per minute. So, target around 550-600 words.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Acknowledge the setting (dinner), the mixed audience, and the weight of the discussions. Validate both groups.
      *   *The Core Tension:* Introduce the advance directive vs. present self conflict. Avoid taking sides.
      *   *The Nuance (Vocational Presence):* Bring in the specific detail about music/ritual/craft. This is the bridge between the philosophers' "identity" and the clinicians' "care."
      *   *The Philosophical Complication:* Challenge the authority of the earlier self without dismissing it. Introduce the idea of embodied rationality.
      *   *The Ethical Stalemate:* Acknowledge that there is no easy answer. Avoid false comfort.
      *   *Closing:* End with an open question that lingers.

