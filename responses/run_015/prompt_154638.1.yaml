      Welcome everyone. We talked hard today. Philosophers want consistency, clinicians want comfort. The advance directive says one thing, the person in front of us says another. But look at them playing piano. They aren't just existing; they are doing something meaningful. Maybe the old self didn't know what the new self could be. But we can't just ignore the old self either. We are stuck. So what do we do? I leave you with this question.

