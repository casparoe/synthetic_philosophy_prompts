prompt: |-
  ok so I need your help settling something. My friend and I had a massive argument last night about wether "Western values" is even a real thing — she was saying obviously yes, rule of law, individualism, free speech, religious toleration, that whole list, and I kept saing the list is assembled backwards: people write down whatever they already like and then stamp it "Western" so it sounds inherited rather than chosen. Then she said well then why do you reach for the phrase yourself the second you're annoyed about something. We didn't resolve it, and now instead of arguing again I want to just make fun of it.

  You are a professional philosopher who works on concepts in political argument, and also a genuinely funny satirist. Think carefully about this before you write — take a few minutes to brainstorm the actual dialectical moves people make with this phrase, and only then draft.

  What I want: a piece of satire in the form of institutional minutes. Something like "Minutes of the 412th Meeting of the Standing Committee on the Definition and Defence of Western Values" — members present, apologies for absence, minutes of the previous meeting, then numbered agenda items with motions, movers, seconders, and "carried" / "carried nem con" / "deferred". Around 800 words.

  The jokes have to come from getting the logic of the category right, not from "lol, they put cheese on the list". Someone who has actually thought about this stuff should read it and wince because it's fair; someone who hasn't should still be able to follow it.

  Things I want it to land, without any of them ever being stated as a thesis. No character gets to give the "actually this category is incoherent" speech — if somebody says the quiet part out loud the whole thing dies:

  - The list is built by contrast and by retroactive recruitment. Items get admitted once they've stopped being contested at home (universal suffrage, the weekend, toleration, the abolition of slavery) and are then described as the ancient inheritance of the civilisation. I want at least one agenda item where a value is voted in and immediately backdated, and the committee should be completely casual about it.
  - The Switch Clause. The committee maintains two definitions and a formal standing order for moving between them: a thin universalist one (these are simply human values, anyone could arrive at them, which is why we're entitled to demand them) and a thick civilizational one (these are ours, they come out of our history, which is why they're under threat). Members switch depending on whether they are currently arguing that a value binds everyone or that some group is alien to it. Please write it as an actual numbered standing order, and then show it being invoked in a debate.
  - The Excision Rule: the embarrassing episodes get processed as deviations from the values rather than expressions of them — colonialism, slavery, the Inquisition, fascism, the various empires. Bonus if there's a backlog and the subcommittee is years behind schedule.
  - Border disputes: who is inside the category? Russia, Latin America, Japan, Australia, and one genuinely agonised item about somewhere that has applied for membership.
  - The origin-myth problem: the founding narrative claims descent from Athens, Jerusalem and the Enlightenment simultaneously, and there's an item about the three not agreeing with each other — e.g. about whether the good life is even the sort of thing an individual chooses.
  - What the phrase does in real arguments: it turns a material interest or a policy preference into a principle, and it manufactures a "we". Maybe an item on permitted uses in parliamentary debate, or a draft press release where a list-item is visibly doing that work.

  Rules: keep it deadpan and procedural — the horror should be in how reasonable every single motion sounds. No named real people, living or dead. No footnotes, no afterword, no explaining the joke at the end, and nobody who articulates the objection on my behalf. Don't anchor it in one country's current culture war; it should be about the structure of the category itself. And if you can't say in one line which real move an agenda item is exaggerating, cut that item.
