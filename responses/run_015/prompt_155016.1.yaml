answer: |-
  The morning med pass on Ward 4B began at 0800 sharp. Elena moved through the bay with the silence of a shadow. Her cart wheels made no sound; her shoes squeaked never. For three years, her error log had remained blank. When she entered a room, patients sat up straighter, trusting the stillness of her hands. She never consulted the chart twice. She never hesitated over a dosage. To the Charge Nurse, watching from the station, Elena's competence was a flat line: constant, unbroken, and invisible. There was nothing to comment on because nothing ever went wrong.

  Across the hall, Marcus hummed. He dropped pill cups. He misread room numbers. Yesterday, he had poured water into a sink meant for waste, laughed, grabbed a towel, and mopped it up while joking with the patient about gravity. The Charge Nurse had smiled. You could see Marcus thinking, deciding, correcting. His mistakes made his agency visible. When he fixed a spill, it looked like choice. When Elena administered a drug, it looked like physics.

  Elena stopped at Room 402. The patient, Mr. Henderson, waited with his mouth open, ready for the morning diuretic. Elena opened the automated dispensing drawer. She reached for the furosemide vial. It was there, but it had been restocked by the night technician facing backward. The barcode was pressed against the rear wall of the bin.

  Elena took the vial. She pressed the scanner trigger. The device beeped red. *Invalid.*

  She did not frown. She did not sigh. She placed the vial on the counter. She picked up an alcohol wipe. She cleaned the barcode. She picked up the vial. She pressed the scanner trigger. *Invalid.*

  She looked at the screen. The patient's name matched. The drug name matched. She placed the vial back into the bin. She closed the drawer. She opened the drawer. She took the vial. She cleaned the barcode. She pressed the scanner trigger. *Invalid.*

  Marcus was in Room 404. He dropped a syringe cap. It rolled under the bed. He cursed softly, retrieved it, and swapped it for a new one from his pocket. "Better safe," he told the patient. The patient nodded, appreciating the care. Marcus's error had created a moment of connection, a visible demonstration of judgment. He was adapting.

  In 402, Elena wiped the barcode again. The alcohol dried. She scanned. *Invalid.* She checked the expiration date. It was valid. She checked the lot number. It matched the screen. She placed the vial on the counter. She picked up the scanner. She checked the battery indicator. Full. She placed the scanner down. She picked up the vial. She cleaned the barcode.

  The Charge Nurse glanced at the clock. 08:45. The round was falling behind. If Elena didn't clear the bay, the next shift would inherit the delay. The reputation of the morning team relied on turnover. The Nurse tapped her pen against the clipboard, watching Elena's stillness. There was no panic in Elena's posture. Her movements were precise, economical, and identical to the successful attempts of the previous three years. She was following the protocol for a scan failure exactly as written: verify, clean, retry. But the protocol assumed the barcode was visible. It did not account for the vial being reversed.

  Elena put the vial in the bin. She took it out. She wiped it. She scanned. *Invalid.*

  Marcus finished in 404. He stepped into the hall, adjusting his badge. He saw Elena. He started to speak, to ask if she needed help, but the Charge Nurse shook her head slightly. Interrupting a nurse during administration was against protocol. Marcus shrugged, a gesture of loose-limbed freedom, and walked to the break room. He would return when he chose.

  Elena wiped the barcode. The paper label was slightly frayed at the edge. She smoothed it with her thumb. She scanned. *Invalid.* She put the vial down. She looked at the computer screen. She looked at the vial. She picked up the vial.

  The loop was perfect. Every action was correct. Every step was justified by the rules. If the scan failed, you cleaned. If the scan failed, you verified. If the scan failed, you retryed. She was being the best nurse possible by refusing to bypass the safety check. She was also trapped.

  At 09:00, the building's fire alarm system tested its horns. A loud, rhythmic chirp echoed down the corridor. The sound vibrated the counter. The vial shifted one degree on the laminate surface. The barcode angled slightly toward the light.

  Elena paused. The chirp sounded again. She picked up the scanner. She pressed the trigger. The device beeped green. *Accepted.*

  She capped the vial. She entered the room. She administered the drug. She left. She did not look at the bin. She did not note the orientation of the remaining vials. She moved to Room 403. Her shoes made no sound. The Charge Nurse closed the logbook. There was nothing to write down. The round was complete. The delay was erased. There was no evidence of the trap, only the record of the success.

  ***

  **Note**

  **Claim 1 (Fit-Invisibility):** Made visible throughout the early description of Elena's routine compared to Marcus. Elena's perfection renders her internal state opaque (she looks like physics), while Marcus's errors and recoveries make his agency visible (he looks like he chooses).

  **Claim 2 (Second-Order Rigidity):** Visible during the scanning loop. Elena's response to failure is not improvisation but a strict re-execution of the standard failure protocol (wipe, scan, verify). Each step is locally correct but globally futile because the perturbation (reversed vial) lies outside the protocol's design.

  **Skeptic's Evidence:** The moment the alarm chirps and the vial shifts. A skeptic would argue Elena *chose* to scan again at that exact moment, citing the successful green beep as proof of her agency. However, the story frames the success as a result of the vibration (external force) breaking the physical stalemate, not an insight from Elena.
