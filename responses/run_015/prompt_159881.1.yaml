answer: |-
  # Q&A Prep Sheet: Causation by Omission (Default-Value Picture)

  **Context:** 10-minute Q&A. You cannot answer everything deeply. Your goal is to show the view is *stable*, not that it is proven. Triage is essential.
  **Strategy:** Defend the metaphysics (defaults/liveness) against the modelers and physicist; concede the pragmatics (model selection) to the experimentalist and legal theorist.

  ---

  ### The Objection Queue (Ordered by Likelihood & Damage)

  #### 1. The Causal Modelers (The "Arbitrary Defaults" Attack)
  **Who:** The two interventionists.
  **Phrasing:** "In structural equation modeling, 'default' is usually just the value of the exogenous variables or a baseline condition we stipulate for convenience. You're treating 'default' as a metaphysical feature of the variable, but isn't it just a modeling choice? If I model the Queen as an exogenous variable $Q$ where $Q=0$ is 'doesn't water,' and I set the default of $Q$ to 0, haven't I just notationally reproduced your 'liveness' filter without solving the profligacy problem? What makes a default value *objective* rather than a pragmatic choice?"
  **The 2-Minute Reply:** Distinguish *variable inclusion* from *value assignment*. Liveness handles inclusion (is there a mechanism?). Defaults handle the *direction* of the omission. Defaults aren't arbitrary; they track **invariance**. The gardener's watering variable has a stable setting across nearby possible worlds (the garden's maintenance routine); the Queen's does not. The default is the value the system returns to without intervention.
  **Soft Spot:** Stability often tracks normative expectations (what we *expect* the system to do). If "invariance" is just "statistical normality," you've smuggled norms back in as physics.

  #### 2. The Experimentalist (The "Unfalsifiable Pragmatics" Attack)
  **Who:** The psych/experimental philosopher.
  **Phrasing:** "You say norms affect model construction, not the causal relation. But we only access causal relations *through* judgments. If your 'liveness' and 'default' criteria shift exactly when normative cues shift, your distinction is empirically invisible. You're positing a norm-free causal layer that does no predictive work. Why isn't this just a verbal shuffle to save realism?"
  **The 2-Minute Reply:** It's not invisible; it's a **process dissociation**. We can measure reaction times and neural load. If norms were constitutive of causation, normative processing should be simultaneous with causal processing. If norms are for model construction, they should precede it. My view predicts a temporal/cognitive sequence: Norms $\rightarrow$ Model $\rightarrow$ Causal Judgment. Your view predicts they are identical.
  **Soft Spot:** Current data is messy. If they cite a study showing simultaneous activation, you have to retreat to "competence vs. performance," which sounds defensive.

  #### 3. The Philosopher of Physics (The "No Defaults in Nature" Attack)
  **Who:** The physicist.
  **Phrasing:** "You're talking about variables and models, but causation is supposed to be in the world. In fundamental physics, there are no 'default values.' There are just states. A plant not being watered is just a physical configuration. Calling one state 'default' and another 'intervention' is a perspectival, agent-relative distinction. So aren't you admitting omissions aren't real causal relations, but just ways agents carve up the state space?"
  **The 2-Minute Reply:** Concede **special science autonomy**. Causation isn't fundamental physics; it's macroscopic and manipulability-based. "Default" is real relative to the **system's dynamics**, not fundamental laws. A thermostat has a default setting relative to its mechanism, regardless of physics. Omissions are real relative to the system's organization.
  **Soft Spot:** This risks making causation anti-realist or mind-dependent. If the "system's organization" is defined by us, the ontology is shaky.

  #### 4. The Legal Theorist (The "Liability Gap" Attack)
  **Who:** The legal scholar.
  **Phrasing:** "The law treats omissions differently because of duty, not just mechanism. If your view says the gardener causes the death *in the same sense* as a poisoner, but the law requires a duty to convict for omission, your account doesn't explain the legal distinction. It just says 'causation is the same, responsibility is different.' But the law uses causation to *limit* responsibility. If your causal net is too wide, it's useless for law."
  **The 2-Minute Reply:** The law needs a **two-stage filter**. Stage 1: Causal candidacy (my view). Stage 2: Imputation (norms/duty). My view clarifies Stage 1 so we don't confuse causal absence with normative absence. It helps the law by showing that some omissions *are* causal but not culpable, rather than pretending they aren't causal to avoid culpability.
  **Soft Spot:** If the causal net is still too wide (e.g., includes bystanders with no duty), the legal theorist will say your Stage 1 is still over-inclusive and practically useless.

  #### 5. The "Liveness" Circularity (The Mechanism Trap)
  **Who:** Anyone paying close attention (likely a Modeler).
  **Phrasing:** "You say a variable is 'live' only if a mechanism is coupled to the outcome. But how do you define 'coupled' without using causal language? If 'coupled' means 'can causally influence,' you're defining causation in terms of causation. If it means 'physically connected,' the Queen is connected via gravity/atmosphere. What stops liveness from being a normative filter labeled 'mechanical'?"
  **The 2-Minute Reply:** "Coupling" is **counterfactual dependence of the mechanism's state**. Is there a switch, pipe, or wire that *could* transmit the change? The Queen lacks the *transmission channel*, not just the will. It's about physical topology, not causal power.
  **Soft Spot:** Defining "transmission channel" without invoking causal potential is notoriously hard. This is the weakest technical link in your armor.

  #### 6. The Lewisian (The "Event" Objection)
  **Who:** The Lewisian.
  **Phrasing:** "I know you have a reply, but I'll press: If the gardener's omission is a variable at default value, where is it in spacetime? Events are localized. A default value is an abstraction. If causation is a relation between relata, and one relatum is an abstraction, haven't you just changed the subject from causation to explanation?"
  **The 2-Minute Reply:** (Keep this brief, you said you have it). Causation relates **facts** or **variable assignments**, not just Davidsonian events. Interventionism doesn't require spatiotemporal events; it requires distinct values. The "location" is the system containing the variable.
  **Soft Spot:** Lewisians won't accept facts as relata. You won't convert them, just stall them.

  #### 7. The "Double Prevention" Follow-up
  **Who:** The Modelers or Lewisian.
  **Phrasing:** "In double prevention (A stops B from stopping C), your model treats the prevention as a default. But intuitively, the preventer is more causal than the non-preventer. Does your default value account capture the asymmetry in double prevention cases without normative help?"
  **The 2-Minute Reply:** Yes, because the **intervention path** differs. In double prevention, the chain of active interventions is broken by the omission. The default value breaks the chain. Liveness tracks the broken chain.
  **Soft Spot:** Complex cases (preemptive double prevention) can break the "broken chain" intuition.

  #### 8. The "Explanatory Priority" Dodge
  **Who:** The Experimentalist or Modeler.
  **Phrasing:** "You call it 'explanatory priority, not reduction.' But if norms always determine the model, and the model determines the cause, norms determine the cause. What work is the 'causal relation' doing if it's always downstream of a norm-laden model selection?"
  **The 2-Minute Reply:** The causal relation constrains the model. You can't select a model where $A$ causes $B$ if there's no physical coupling. Norms select *among* physically valid models, they don't create the causal links.
  **Soft Spot:** If physically valid models are rare and norms always pick the same one, the constraint is vacuous.

  ---

  ### Strategic Directives

  #### 1. The Concession (Say this in the talk)
  **Concede that model selection is normative.**
  Do not fight the claim that norms influence which variables we consider. Explicitly state: *"I agree that norms guide us to the right causal model. My claim is merely that once the model is fixed, the causal relation itself is determined by the default values and structure, not by the norms that got us there."*
  **Why:** This disarms the Experimentalist and Legal Theorist immediately. It makes you look reasonable and isolates the metaphysical claim, which is the only hill you need to die on.

  #### 2. The "Must-Land" Reply
  **The Distinction between Metaphysics and Pragmatics.**
  You must successfully defend the claim that **Causal Truth $\neq$ Causal Judgment**.
  If the audience leaves thinking "Norms determine the model, and the model determines the cause, so norms determine the cause," you lose.
  **The Soundbite:** "Norms tell us *which* story to tell; the mechanism tells us *whether* the story is true."
  If this distinction holds, your view survives even if "defaults" are slightly fuzzy.

  #### 3. The Dreaded Objection (Hope they don't ask)
  **"The Normative Collapse of Defaults."**
  **The Question:** "You say defaults are based on system stability/invariance. But in social contexts (gardens, laws, human behavior), 'stability' is constituted by normative expectations. The gardener waters because he *ought* to. If he didn't ought to, he wouldn't, and the 'default' would change. So isn't the default value ontologically dependent on the norm? If so, you haven't removed norms from the causal relata; you've just buried them in the variable definition."
  **Why it's deadly:** It attacks the core ontology. If "default" is just "normatively expected state" disguised as "system stability," your claim that omissions don't need a duty clause is false. The duty *creates* the default.
  **Prep:** If asked, do not deny the correlation. Argue that the *mechanism* sustains the default, even if the norm initiated the mechanism. (e.g., The sprinkler system waters by physics, even if installed due to a contract).

  ---

  ### Bonus: The "Liveness" Diagnosis
  **Where Liveness is Overworked:**
  You are using "Liveness" to solve two problems:
  1.  **Profligacy** (Why not the Queen?)
  2.  **Ontology** (What makes an omission a cause?)

  **The Problem:** Liveness is doing all the work on Problem 1 (Profligacy). You claim it's a "mechanical coupling," but in the Queen case, the "lack of coupling" is indistinguishable from "lack of duty."
  **The Risk:** If "mechanical coupling" is defined as "a path along which an intervention could travel," and we only care about interventions an agent *could* perform, you've reintroduced agency/norms into the definition of liveness.
  **Fix:** Be prepared to define coupling in terms of **energy/information flow capacity** independent of agency. If you can't, admit that Liveness is a "naturalistic constraint" that loosely tracks norms but isn't identical to them.

  ### Triage Plan for 10 Minutes
  1.  **Q1 (Modeler/Defaults):** Answer fully. This is your core.
  2.  **Q2 (Experimentalist/Norms):** Use the "Concession" strategy. Don't fight the norm-sensitivity of judgment.
  3.  **Q3 (Physics/Ontology):** Use the "Special Science" defense.
  4.  **Q4+ (Legal/Lewis/Details):** Deflect. "That's a question about responsibility/event ontology, and my claim is specifically about the causal relation in structural models. I'd love to chat after, but I want to make sure the default-value point is clear."

  Good luck. Keep your eyes on the Modelers; if they nod, the room follows.
