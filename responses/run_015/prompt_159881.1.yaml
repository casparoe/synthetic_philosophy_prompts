      *   **Task:** Preparing for a 30-minute talk + 10-minute Q&A at a reading group.
      *   **Topic:** Causation by omission.
      *   **Thesis:** Omissions are genuine causes. No special relata (events vs. non-events). No normative/duty clause required for causation itself. "Default-Value Picture" within an interventionist framework. "Liveness" condition determines model inclusion (mechanism coupling), solving the "Queen of England" problem without norms. Norms affect *model construction* (explanatory priority), not the causal relation itself.
      *   **Audience:** 5 specific interlocutors (Lewisian, 2 Causal Modelers, Legal Theorist, Experimentalist, Philosopher of Physics).
      *   **Constraints:** Needs a prep sheet, not a defense. 7-8 objections ordered by likelihood/damage. Phrased in the interlocutors' voices. 2-minute replies + "soft spot" analysis. Advice on concessions, the "must-land" reply, and the "dreaded" objection. Bonus: Spot where "liveness" is overworked.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Core Claim:* Omissions = Default values in variables.
      *   *Mechanism:* Liveness (coupling) filters variables.
      *   *Norms:* Merely heuristic for model selection, not ontological.
      *   *Vulnerability 1 (Metaphysical):* Is "default" objective or context-dependent? If context-dependent, isn't that just norms in disguise?
      *   *Vulnerability 2 (Causal Modeling):* Is "liveness" just an ad hoc restriction to save the theory from profligacy? Can it be formalized?
      *   *Vulnerability 3 (Legal/Practical):* If causation is the same for omissions and commissions, why does law treat them differently? (The "Normative Gap").
      *   *Vulnerability 4 (Experimental):* If norms drive model selection, and model selection drives causal judgment, isn't the distinction between "causal relation" and "model construction" empirically invisible?
      *   *Vulnerability 5 (Physics):* What physically constitutes a "default"? Physics doesn't care about defaults.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Causal Modelers):* They know the math. They'll smell rat on "default values." Is it just a variable assignment trick?
      *   *Objection 2 (The Experimentalist):* They care about data. If norms predict judgments, why posit a norm-free causal layer? Occam's razor.
      *   *Objection 3 (The Lewisian):* They care about events and counterfactuals. "Doing nothing" isn't an event. How does default value map to spacetime?
      *   *Objection 4 (The Legal Theorist):* They care about responsibility. If the gardener and the Queen are both "causes" in some model, why is only the gardener liable?
      *   *Objection 5 (The Philosopher of Physics):* "Default" is not a physical property. It's perspectival.
      *   *Objection 6 (The "Liveness" Trap):* How do you define "coupling" without circularity or norms?
      *   *Objection 7 (The "Must-Land"):* The distinction between metaphysics and pragmatics.

      *Refining the Voices:*
      *   Lewisian: "Quasi-causation," "events," "spatiotemporal."
      *   Modelers: "Exogenous variables," "structural equations," "formalism."
      *   Legal: "Duty," "liability," "voluntary act."
      *   Experimentalist: "Folk judgments," "cognitive process," "falsifiability."
      *   Physics: "Fundamental ontology," "energy transfer," "state space."

  4.  **Ordering by Likelihood/Damage:**
      1.  *Modelers (Defaults):* High likelihood, high damage. If defaults are arbitrary, the theory collapses.
      2.  *Experimentalist (Falsifiability):* High likelihood. Direct attack on the "model construction" move.
      3.  *Physics (Ontology):* Medium likelihood, high damage. Attacks the reality of "defaults."
      4.  *Legal (Normative Gap):* Medium likelihood. Attacks the utility of the view.
      5.  *Liveness (Circularity):* High damage. If liveness relies on norms, the core thesis fails.
      6.  *Lewisian (Events):* User said they have replies, so lower priority, but still relevant.
      7.  *The "Dreaded" Objection:* The collapse of the distinction between metaphysics and pragmatics.

  5.  **Developing Replies & Soft Spots:**
      *   *Defaults:* Reply: It's about stability/invariance, not arbitrary choice. Soft spot: Stability often tracks norms.
      *   *Experimentalist:* Reply: Process dissociation. We can separate reaction time (causal) from justification (norm). Soft spot: Hard to prove empirically.
      *   *Physics:* Reply: Causation is special science, not fundamental physics. Soft spot: Risks anti-realism.
      *   *Legal:* Reply: Causation $\neq$ Responsibility. Soft spot: Why does causation track responsibility so closely then?
      *   *Liveness:* Reply: Physical connectivity (wires, pipes). Soft spot: What counts as a relevant connection?

  6.  **Identifying the "Must-Land" & "Dreaded":**
      *   *Must-Land:* The distinction between the *causal relation* (objective, model-relative) and *causal selection* (pragmatic, norm-sensitive). If this blurs, the view is just normative causal pluralism.
      *   *Dreaded:* The "Norms in Disguise" objection. If "liveness" and "defaults" are ultimately determined by what we consider normal/expected, the claim that norms aren't constitutive is false.

  7.  **Spotting the "Liveness" Overwork:**
      *   Liveness is doing the heavy lifting of excluding the Queen. But what makes a mechanism "coupled"? Physical proximity? Information flow? If it's physical, why doesn't the Queen's lack of water count (gravity/atmosphere connects everything)? If it's counterfactual, isn't that just the causal relation itself? Liveness risks being a normative filter labeled "mechanical."

  8.  **Final Review against Constraints:**
      *   7-8 objections? Yes.
      *   Ordered? Yes.
      *   Voices accurate? Yes.
      *   2-minute replies? (Summarized).
      *   Soft spots identified? Yes.
      *   Concessions advice? Yes.
