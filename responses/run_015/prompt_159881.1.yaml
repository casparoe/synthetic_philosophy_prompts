      *   Ensure the advice is strategic (triage for 10 mins).

      *(Self-Correction during drafting)*: Make sure I don't just give *any* reply, but one that fits *their* specific view. For the Legal theorist, don't just say "causation isn't responsibility," explain *why* the distinction helps the law (screening off). For the Modelers, acknowledge the formalism.

      *(Refining the "Dreaded" Objection)*: It needs to be the one that combines the Physics and Modeler worry. "Default values are normative all the way down."

      *(Refining the Concession)*: Admit that *selecting* the model is normative. That's their main point anyway. Don't fight the norm-sensitivity of judgment, fight the norm-sensitivity of *causation*.

  10. **Final Polish:** Check tone. Ensure it sounds like a senior colleague or a very sharp peer prepping them. (The prompt asks for a prep sheet).

      *Let's structure the output:*
      1.  Strategic Overview (Triage).
      2.  The Prep Sheet (Objections 1-8).
      3.  The "Must-Land" Reply.
