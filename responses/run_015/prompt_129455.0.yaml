  # Handout: The Boundary Problem (Logical Space)

  **Goal:** Map who belongs in the *demnos* without starting from names. Follow the branches. If you hit a leaf, you've found a position.

  ### THE TREE

  **Q1: Can membership apply to entities that don't experience welfare?**
  *   **YES** → **Q1.1 (Niche):** Is this an artificial agent that is persistently governened but has no welfare interests?
      *   **YES** → **[Leaf 1]**
      *   **NO** → **[Leaf 2]**
  *   **NO** (Must be sentient) → **Q2: Is being subjected to coercive law necessary, or is being causally affected enough?**
      *   **AFFECTED IS ENOUGH** → **Q2.1:** Do future interests count equally to current ones?
          *   **YES** → **[Leaf 3]**
          *   **NO** → **Q2.2:** Is a durable 'stake' required vs fleeting effect?
              *   **YES** → **[Leaf 4]**
              *   **NO** → **[Leaf 5]**
      *   **SUBJECTION NECESSARY** → **Q3: Can shared nationality substitute when neither of those hold?** (e.g. for expats)
          *   **YES** → **[Leaf 6]**
          *   **NO** → **Q3.1:** Is physical territory required alongside law?
              *   **YES** → **[Leaf 7]**
              *   **NO** → **[Leaf 8]**
              *   *(Edge Case)* → **[Leaf 9/10]**

  ---

  ### THE LEAVES (Positions)

  1.  **Non-sentient AI governed by law**
      *   *Status:* **Unexplored/Ugly.** Technically fits the logic of subjection without rights, but breaks the moral foundation of democracy.
  2.  **Ecosystems / Legal Persons (Nature)**
      *   *Status:* **Incoherent.** Can hold rights in court, but cannot vote or form a will. Good for trusteeship, bad for demos theory.
  3.  **Future-only affected**
      *   *Status:* **Unexplored.** Logically consistent with 'all-affected', but practically impossible to aggregate preferences.
  4.  **Stakeholder**
      *   *Status:* **Occupied.** Requires enduring interest (like investment or residency) rather than fleeting causal effects (like pollution drift).
  5.  **All-affected-interests**
      *   *Status:* **Occupied.** The classic utilitarian boundary. Anyone touched by the decision counts.
  6.  **Co-nationalist**
      *   *Status:* **Occupied.** Membership travels with the person via culture/legal ties, regardless of borders or current subjection.
  7.  **Territorial-only**
      *   *Status:* **Occupied.** Strict borders. If you aren't standing on the soil, the law doesn't claim you (excludes most expats).
  8.  **All-subjected**
      *   *Status:* **Occupied.** If the law binds you, you get a vote. Includes expats if they remain legally subject to home law.
  9.  **Past-affected** (Excluded)
      *   *Status:* **Incoherent.** Dead men tell no tales. Usually filtered out by Q2.1.
  10. **Short-term Tourist** (Excluded)
      *   *Status:* **Occupied (as exclusion).** Affected temporarily, subjected temporarily, but no stake/nation. Usually falls out at Q2.2 or Q3.1.

  ---

  ### KNOWN GLITCHES & SEPERATION ISSUES

  **The Expat Problem (Stakeholder vs. All-subjected)**
  This tree struggles to cleanly separate **Leaf 4 (Stakeholder)** and **Leaf 8 (All-subjected)** regarding tax-paying expats.
  *   *Why:* An expat pays taxes (subjection) and has pension interests (stake).
  *   *The Glitch:* If "subjection" is defined legally, they are All-subjected. If "subjection" is defined as "burdened by coercion," Stakeholder theory might exclude them if their stake is deemed too weak. The tree treats these as distinct branches, but in practice, the criteria overlap significantly here. You might need a tie-breaker node regarding "duration of absence" to fix this.

  **The AI Gap**
  Leaf 1 is technically reachable via the logic (Law applies → No welfare needed), but no serious theorist occupies it yet. It remains a logical possibility but a normative dead zone.
