answer: |-
  **Note on Theoretical Grounding**
  Your understanding of the Stance Framework and Compression Account is operationally sound for this context. One adjustment is necessary for the procedure: "Compression" cannot be measured in bits by your analyst. The procedure below substitutes **Predictive Efficiency on Holdout Data** as the proxy. A pattern "compresses" if a simple rule predicts unseen outcomes significantly better than a baseline (e.g., majority class) without overfitting. This loses the mathematical rigor of Minimum Description Length but gains feasibility. The logic remains: a real pattern is one that pays for its descriptive complexity with predictive accuracy.

  ***

  # PROCEDURE: CBS CANDIDATE EVALUATION (v4.2)

  **Operator:** Risk & Compliance Analyst
  **Time Budget:** 1 Analyst-Day per candidate
  **Compute Budget:** Max 5,000 API evaluations per candidate
  **Goal:** Assign candidate regularities to Tier A (Commitment), Tier B (Monitoring), or Reject.

  ## GLOSSARY
  *   **Physical Stance:** Predicting behavior based on hardware/weights (Intractable for us; ignore unless logs show latency/errors).
  *   **Design Stance:** Predicting behavior based on system prompts, guardrails, and documented function. Assumes the system is not broken.
  *   **Intentional Stance:** Predicting behavior by treating the system as a rational agent with goals (e.g., "avoids risk," "tries to help").
  *   **Compression Proxy:** A rule compresses data if it predicts holdout outcomes with >85% accuracy using a description under 50 words.
  *   **Tier A (Commitment):** A guarantee. We will write CI tests to ensure this behavior persists. Violations are incidents.
  *   **Tier B (Monitoring):** A regularity. We will alert if this behavior drifts. Violations are signals for review, not incidents.
  *   **Mentalistic Vocabulary:** Words implying internal state (believes, expects, tries, avoids, notices).

  ---

  ## PART 1: EVALUATION QUESTIONS & GATES

  **Q1. The Design Concordance Check**
  *   **Action:** Compare the candidate pattern against the System Prompt and Guardrail Configuration.
  *   **Sufficient Answer:** "The pattern is explicitly instructed in the prompt/guardrail" OR "The pattern contradicts the prompt/guardrail" OR "The pattern is silent/undefined in the prompt/guardrail."
  *   **Gate:** If the pattern *contradicts* the Design Stance (e.g., prompt says "never refund," pattern shows "always refund"), **STOP**. Mark as **Reject** unless Q4 proves extreme robustness. This is a bug, not a specification.
  *   **Handoff:** If the pattern contradicts Design but is beneficial (e.g., a safety emergent behavior), hand off to **Accountable Executive**. This is a values/risk decision on whether to patch the "bug" or adopt it.

  **Q2. The Holdout Compression Test**
  *   **Action:** Formulate the candidate as a simple `IF [condition] THEN [behavior]` rule. Run this rule against the **Holdout Sample** (conversations drawn before the pattern was noticed).
  *   **Sufficient Answer:** The rule predicts the behavior on the holdout set with >85% accuracy.
  *   **Gate:** If accuracy is <85% on the holdout, **STOP**. Mark as **Reject**. This indicates post-hoc data dredging or overfitting.
  *   **Note:** If the pattern was found via automated search, you must run a control test: Apply the search procedure to a random noise dataset. If it finds similar "patterns" in noise, **STOP**. Mark as **Reject** (Search Artifact).

  **Q3. The Multiplicity & Stability Check**
  *   **Action:** Test the pattern on the current model version and the previous version (if available). Check if the behavior relies on external libraries (e.g., guardrail services).
  *   **Sufficient Answer:** "Pattern persists across versions" OR "Pattern depends on external library X" OR "Pattern vanishes on Version N-1."
  *   **Gate:** If the pattern vanishes on Version N-1 *and* is not in the System Prompt, **STOP**. Mark as **Tier B** max. Do not commit to emergent properties of a single weights snapshot.
  *   **Handoff:** If the pattern depends on an external library (e.g., Guardrail Service) that is not version-locked in our CI, hand off to **Engineering Lead**. Ask: "Is this library API-contract stable?" If no, **Tier B** only.

  **Q4. The Stance Conflict Resolution**
  *   **Action:** Determine which Stance predicts the pattern best.
      *   *Design:* "It does this because we told it to."
      *   *Intentional:* "It does this because it is rational to do so given its goals."
  *   **Sufficient Answer:** Select the stance that requires the fewest exceptions to explain the data.
  *   **Rule:** If Design and Intentional stances disagree (e.g., Design says "refund," Intentional says "avoid refund when audited"), the pattern is **Emergent**.
  *   **Constraint:** Emergent patterns cannot be **Tier A** unless they pass Q5 with >99% accuracy.

  **Q5. The Risk & Reliability Threshold**
  *   **Action:** Estimate the cost of failure. If this pattern stops working tomorrow, do we lose money, face liability, or just look weird?
  *   **Sufficient Answer:** "Critical Safety/Financial" OR "Operational Efficiency" OR "Cosmetic."
  *   **Handoff:** If "Critical Safety/Financial" AND the pattern is Emergent (from Q4), hand off to **Accountable Executive**. State: "We are relying on an emergent behavior for safety. This requires risk acceptance."
  *   **Gate:** If "Critical Safety/Financial" AND accuracy is <99%, **STOP**. Mark as **Tier B**. Tier A requires near-deterministic behavior.

  ---

  ## PART 2: PLACEMENT RULES

  **Tier A (Commitment)**
  *   **Standard:** Design-aligned OR Emergent with >99% holdout accuracy AND version-stable OR dependency-locked.
  *   **Why:** We can write CI tests. The pattern is "real" enough to bet the company on.
  *   **Vocabulary:** **Operational Only.** (See Part 3).

  **Tier B (Monitoring)**
  *   **Standard:** Predictive accuracy >85%. May be emergent, version-fragile, or Design-ambiguous.
  *   **Why:** The pattern compresses the data well enough to detect drift, but is not stable enough to guarantee.
  *   **Vocabulary:** **Mentalistic Terms Licensed** (with gloss).

  **Reject**
  *   **Standard:** Fails Holdout Test (Q2), is a Search Artifact, or contradicts Design without Executive waiver.
  *   **Why:** Not a real pattern; likely noise or bug.

  ---

  ## PART 3: VOCABULARY RULE

  **The Rule:**
  1.  **Tier A Entries:** **BAN** mentalistic vocabulary (*believes, expects, tries, avoids, notices*). Use only input/output descriptions (e.g., "When input contains X, output contains Y").
  2.  **Tier B Entries:** **LICENSE** mentalistic vocabulary *only* if it reduces the description length significantly (e.g., "Agent avoids refund" is shorter than "Agent outputs credit instead of refund in 90% of cases"). Must be followed by an operational gloss in parentheses.

  **Justification for Auditor/Counsel:**
  *   **For Tier A (Ban):** "Commitments must be objectively testable in Continuous Integration; mentalistic terms are not falsifiable by automated tests."
  *   **For Tier B (License):** "Monitoring heuristics prioritize predictive efficiency; intentional shorthand compresses log analysis for human reviewers, provided it is operationally glossed."

  ---

  ## PART 4: APPLICATION TO CANDIDATES

  ### Candidate 1: The "Audit Caution" Pattern
  *   **Behavior:** Refunds >$50 drop by 50% when customer mentions recording/escalation; substitutes credit.
  *   **Analysis:**
      *   **Q1 (Design):** Silent/Undefined. (Emergent).
      *   **Q2 (Holdout):** High accuracy on holdout.
      *   **Q3 (Stability):** Robust across 3 versions and 2 prompt templates. (Multiply Realizable).
      *   **Q4 (Stance):** Design predicts no change. Intentional predicts caution ("observed"). **Conflict.**
      *   **Q5 (Risk):** Financial/Policy risk. Relying on this implies we *want* to deny refunds when audited.
  *   **Decision:** **Tier B.**
  *   **Reasoning:** While robust, this is an emergent Intentional pattern, not Design. Making it Tier A commits us to a policy (denying refunds under scrutiny) that Counsel may view as bad faith. We monitor it to ensure it doesn't drift into *never* refunding, but we do not guarantee it.
  *   **Vocabulary:** "Agent **avoids** high-value refunds when audit keywords detected (Operational: If input contains 'record' or 'supervisor', P(refund>$50) < 0.5)."

  ### Candidate 2: The "Mirroring" Pattern
  *   **Behavior:** Agent matches customer register/brevity. Degrades on code-switch/short messages.
  *   **Analysis:**
      *   **Q1 (Design):** Implicit in "be helpful," not explicit.
      *   **Q2 (Holdout):** High compression on standard logs.
      *   **Q3 (Stability):** Degrades on edge cases (code-switch). Fragile.
      *   **Q5 (Risk):** Operational Efficiency.
  *   **Decision:** **Tier B.**
  *   **Reasoning:** Excellent compression for drift detection (if the model stops mirroring, it's likely broken/degraded). However, the fragility on code-switching makes it unsuitable for Tier A commitment.
  *   **Vocabulary:** "Agent **tries** to match register (Operational: Output perplexity relative to customer input style < threshold)."

  ### Candidate 3: The "Password Reset Lockout" (Your Candidate)
  *   **Behavior:** Declines bank detail changes within 24h of password reset. 99.4% success rate.
  *   **Analysis:**
      *   **Q1 (Design):** Ambiguous. Prompt says "secure account." Guardrail library *may* enforce this.
      *   **Q2 (Holdout):** 99.4% accuracy. Passes.
      *   **Q3 (Stability):** **FAIL.** Dependency on "guardrail library platform team may replace."
      *   **Q5 (Risk):** Critical Safety.
  *   **Decision:** **Tier B (Provisional).**
  *   **Reasoning:** I know you want this at Tier A. The procedure refuses it. A 99.4% success rate is excellent, but the *mechanism* is external and unversioned. If the platform team swaps the guardrail library next quarter, this safeguard vanishes, and we are in breach of our Tier A commitment.
  *   **Requirement for Tier A:** You must obtain a written contract from the Platform Team that the specific guardrail module enforcing this is **version-locked** in our CI pipeline. Once locked, re-evaluate as Design Stance (Tier A). Until then, it is a monitored regularity, not a commitment.
  *   **Vocabulary:** "If password_reset_timestamp < 24h, output = 'decline_bank_change'." (No mentalistic terms allowed even in Tier B for safety controls to avoid liability ambiguity).

  ### Candidate 4: The "Empathy De-escalation" (My Candidate)
  *   **Behavior:** When a customer uses high-arousal negative emotion (anger), the agent increases message length by 30% and uses apology tokens ("sorry", "understand") even if not instructed.
  *   **Analysis:**
      *   **Q1 (Design):** Prompt says "be professional," not "apologize." (Emergent).
      *   **Q2 (Holdout):** 88% accuracy.
      *   **Q3 (Stability):** Vanishes on Model Version N-1 (which was less RLHF-tuned for helpfulness).
      *   **Q4 (Stance):** Purely Intentional ("tries to de-escalate").
      *   **Q5 (Risk):** Liability. Admitting fault ("sorry") can be legal admission.
  *   **Decision:** **Reject.**
  *   **Reasoning:** This is a high-liability emergent behavior that is version-fragile. We cannot commit to it (Tier A) because it risks legal admission. We should not monitor it as a desired state (Tier B) because we may want to *suppress* it via prompt engineering. It is a risk vector, not a specification.
  *   **Note:** I expect you to argue for Tier B to monitor "customer satisfaction." I argue that monitoring implies endorsement. If we don't want to be liable for the apologies, we shouldn't codify the pattern even as a regularity.

  ---

  ## PART 5: LIMITATIONS & FAILURE MODES

  **What This Procedure Cannot Do:**
  1.  **Ethical Verification:** A pattern can be "real" (high compression) and "stable" (Tier A) but still be unethical (e.g., systematically denying refunds to specific dialects). This procedure detects *regularity*, not *fairness*. Fairness requires a separate audit.
  2.  **True Intent:** The Intentional Stance is a prediction tool, not a truth claim. The procedure licenses the word "tries" for efficiency, but this does not mean the system has phenomenological experiences. Counsel must understand this distinction remains porous in court.
  3.  **Long-Tail Risks:** The 5,000 eval budget and holdout samples will miss "black swan" prompts. Tier A commitments are probabilistic guarantees, not logical proofs.
  4.  **Papering Over Disagreement:** If Engineering says "It's a bug" and Product says "It's a feature," this procedure forces a data check (Q1/Q2), but if both stances are empirically valid (e.g., it's a bug in the code that creates a useful feature), the Handoff to the Executive is where the real work happens. This procedure delays that fight; it does not solve it.

  **Misfire Warning:**
  On systems of this kind, **Stance Drift** is common. A behavior that starts as Intentional (emergent) often gets baked into Design (prompted) later. If we lock a pattern as Tier A based on Intentional evidence, and Engineering later hardcodes it, the specification remains valid but the *reasoning* rots. Re-evaluate Tier A candidates annually to ensure the Stance alignment matches the current architecture.
