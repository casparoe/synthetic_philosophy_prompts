answer: |-
  Your editor is half-right and half-wrong. They are right that "affective stratification" sounds like made-up jargon, but they are wrong that the tension underneath it isn't real. In philosophy of mind and bioethics, this is a recognized (though niche) problem regarding **intra-personal pluralism** and the **authority of competing value systems within a single life.**

  The standard bioethics debate (Dworkin vs. Dresser) asks: *Does the past self have authority over the future self if the future self is happy?*
  Your novel asks a sharper question: *If the past self was never one thing, which layer of the past self gets to rule the future body?*

  Here is a concrete, philosophically precise case study designed to validate your concept without relying on the standard "happy dementia patient" trope.

  ### The Case of the "Curator" vs. The "Performer"

  **The Character:** Elena, a former avant-garde performance artist.
  **The Condition:** A rare, early-onset frontal lobe syndrome that strips away inhibitory control and verbal capacity but heightens rhythmic motor sensitivity and sensory immersion. She is nonverbal, bedbound, but constantly moving her hands in complex, conducting-like patterns. To a nurse, she looks agitated (picking at sheets, thrashing). To an observer, she looks like she is conducting an invisible orchestra.

  **The Advance Directive (The "Curator Self"):**
  Five years prior, Elena signed an AD during a period of stability. This version of Elena was the "Curator." She was pragmatic, worried about legacy, dignity, and burden.
  *   **The Clause:** "If I enter a state of persistent motor agitation or repetitive behavior that indicates a loss of executive control, I request palliative sedation to maintain dignity and prevent distress."
  *   **The Assumption:** The Curator Self interpreted "loss of executive control" as *suffering*. She assumed that if she couldn't speak or plan, she would be afraid. She privileged the **calm, static self** as the authoritative voice.

  **The Present Reality (The "Performer Self"):**
  Elena is now in the state described in the AD. She is nonverbal and moving constantly.
  *   **The Observation:** She is not grimacing. Her heart rate is low. Her cortisol levels are normal. When her daughter plays music, Elena's hand movements synchronize perfectly with the tempo. When the room is silent, her movements become chaotic.
  *   **The Stratification:** The "Curator Self" who signed the papers was only one frequency of Elena. The "Performer Self" was always there—the part of her that found meaning in flow, risk, and nonverbal expression. The disease hasn't created a *new* person; it has burned away the Curator and left only the Performer.
  *   **The Conflict:** The Performer Self is not "distressed." She is in a permanent state of "flow." However, she cannot sign a new form. She cannot say "I am happy." She can only *be* the high-frequency self.

  **The Philosophical Knot:**
  If the hospital follows the AD, they sedate Elena to stop the "agitation."
  1.  **Standard View:** This respects her autonomy (the competent self decided).
  2.  **Your "Affective Stratification" View:** This betrays her *ontological authenticity*. The Curator Self made a judgment call that the Performer Self's existence was "undignified." But the Performer Self was the source of her life's meaning.
  3.  **The Betrayal:** By sedating her, you aren't protecting her from pain; you are enforcing the Curator's *aesthetic preference* for calmness over the Performer's *existential need* for motion. You are silencing the only part of her that is currently capable of experiencing joy, based on the testimony of the part of her that is currently incapable of experiencing anything.

  ### Why This Validates Your Theory

  This scenario moves beyond "she changed her mind." It argues that **competence is not the same as authority.**

  1.  **The Hierarchy Problem:** The AD assumes a hierarchy where the "Rational/Calm" layer is the CEO of the self, and the "Emotional/Intense" layer is a subordinate employee. Your theory suggests the CEO might be a bureaucrat who doesn't understand the product.
  2.  **The Interpretation of "Distress":** The AD defines "agitation" as distress. Your character's theory suggests "agitation" might be a *frequency* of engagement. If the present body is resonating with a past frequency (the Performer), suppressing it is a form of violence against the self's continuity.
  3.  **The "Real" Self:** In standard bioethics, the "real" self is the one who can reason. In your novel, the "real" self might be the one who can *feel*. If the Curator signed the papers to protect the body, but the Performer *is* the one living in the body, whose interest counts?

  ### How to Defend This to Your Editor

  If your editor says it's just jargon, tell them you are exploring **Constitutive Luck** and **Internal Pluralism**.

  *   **The Jargon Translation:** "Affective Stratification" is a narrative way of describing the conflict between **Critical Interests** (the Curator's long-term values about dignity) and **Experiential Interests** (the Performer's immediate sensory reality).
  *   **The Innovation:** Standard bioethics assumes these interests belong to two different people (Past vs. Present). Your novel argues they belong to two different *layers* of the same person, and the disease has simply shifted which layer is driving the bus.
  *   **The Stakes:** The tension holds up because there is no clean solution.
      *   If you follow the AD, you kill the joy to save the dignity.
      *   If you ignore the AD, you honor the joy but violate the legal/ethical contract of the competent self.

  ### A Specific Scene Suggestion

  To make this land in the novel, don't have the character explain the theory in a monologue. Have her watch the patient.

  > The nurse reached for the haloperidol. "She's thrashing again. It's in the directive. Agitation protocol."
  >
  > "Look at her hands," your protagonist said.
  >
  > "She's picking at the IV tape."
  >
  > "No. She's in 4/4 time. Listen to the ventilator."
  >
  > The machine hissed. *Hiss. Click. Hiss. Click.*
  >
  > The patient's fingers tapped the sheet. *Tap. Tap-tap. Tap.*
  >
  > "The directive was signed by the woman who was afraid of losing control," your protagonist said. "But this isn't loss of control. This is the only control she has left. If you sedate her, you aren't treating pain. You're censoring her."
  >
  > "She can't tell us she wants this."
  >
  > "She's not telling us. She's showing us. The question is, are we only listening to the voice that knows how to fill out forms?"

  This creates the "weird layered tension" you want. It makes the AD feel like a document written by a stranger who happened to share the patient's name, not because of memory loss, but because of **affective mismatch.**
