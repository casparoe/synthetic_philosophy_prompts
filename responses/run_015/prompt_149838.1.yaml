          *   *Refinement:* The tension is between "unnecessary luxury" (4) and "fully preserves... makes the practice normatively significant" (5). If the practice's normative significance depends on group-level organization (implied by "makes the practice... significant"), then dismissing group-level stories as luxuries undermines the claim that the explanation preserves that significance.
          *   *Severity:* Medium. It hinges on whether "preserving" implies "requiring reference to."

      *   **Pair (1) & (4):**
