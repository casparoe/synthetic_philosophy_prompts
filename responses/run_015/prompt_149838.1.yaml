      *   **(4) Evo Psych & Moral Cognition:** Individual-level crane explanations are *complete*. Group-level organizational stories are *unnecessary luxuries* that risk skyhooks.
      *   **(5) Altruistic Punishment:** Paradigm crane. Evo explanation *fully preserves* group-level functional organization. No "normative residue."

