      *So the pivot is (4).*
      (4) claims individual-level is *complete* and group-level is *unnecessary*.
      (2) claims organizational structures are *indispensable*.
      (5) claims the phenomenon *involves* group-level functional organization.

      If the phenomenon involves group-level organization (5), and organizational structures are indispensable to the phenomenon (2), then group-level organization is indispensable to the explanation.
      (4) denies this.
      Therefore, (2) + (5) -> Not (4).

  8.  **Drafting the Audit:**

      *   **Structure:**
          1.  Executive Summary (The Core Fracture).
          2.  Tension Analysis (Ranked by Severity).
          3.  Revision Analysis (Least Costly).
          4.  The Single Best Revision.

      *   **Refining the "Severity":**
          *   **Severity 1 (Critical):** (2) vs. (4). Indispensability vs. Unnecessary Luxury. This breaks the explanatory framework.
          *   **Severity 2 (Significant):** (4) vs. (5). Completeness of individual explanation vs. Preservation of group function. If group function is preserved as *significant*, ignoring it makes the explanation incomplete regarding significance.
          *   **Severity 3 (Minor/Apparent):** (1) vs. (4). (4) treats group levels as risky; (1) defines the risk. This is actually consistent, but relies on the assumption that group levels *are* skyhooks, which (2) denies (calling them indispensable structures). So there's a tension between (1)'s definition and (4)'s application relative to (2). Actually, better to frame this as (4) misapplying (1) given (2). I will group this under the main (2)/(4) conflict or treat it as low severity. Let's treat it as low severity because (4) says "risk," not "certainty."

      *   **Refining the Revision:**
          *   To fix (2) vs (4): Modify (4). Acknowledge group-level stories are *necessary* for full explanation, provided they are crane-based (non-circular).
          *   To fix (4) vs (5): Modify (4). Acknowledge that preserving group function requires referencing group organization.
          *   Does modifying (2) work? If I say "Organizational structures are usually indispensable, but not for moral cognition," I violate the spirit of anti-greedy reductionism which usually protects special sciences like psychology/sociology. That seems costlier than admitting multi-level explanation in evo psych.
          *   Does modifying (5) work? If I say "Altruistic punishment explanation does *not* preserve group-level significance," I admit normative residue. This violates (3). Costly.
