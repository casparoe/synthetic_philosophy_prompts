prompt: |-
  I'm trying to stabilize my view on reduction and explanation for a philosophy-of-science discussion, and I want a consistency audit before I commit to it. Here is my current package:

  (1) I read Dennett's cranes/skyhooks distinction as methodological and normative: a "skyhook" is an explanation that borrows its explanatory power from the very phenomenon it needs to explain, not an ontologically mysterious entity hanging outside nature.

  (2) I reject greedy reductionism, but specifically in an explanatory-register sense: organizational and functional structures are indispensable—if you erase them you lose the phenomenon—though I deny any ontological emergence of non-physical properties.

  (3) I am a strict ontological physicalist: consciousness, intentionality, and normativity are entirely constituted by physical processes, with no irreducible non-physical properties or entities.

  (4) I think evolutionary psychology delivers complete, individual-level crane explanations of moral cognition; group-level organizational stories are unnecessary explanatory luxuries that risk smuggling in skyhooks.

  (5) I take altruistic punishment to be the paradigm successful crane: its evolutionary explanation fully preserves the group-level functional organization that makes the practice normatively significant, with no "normative residue" left unexplained.

  Go through these commitments and tell me which pairs are genuinely in tension, which ones only appear to conflict, and how severe each real tension is. For each genuine conflict, say what the least costly revision would be and exactly what I would have to give up. Rank the tensions by severity rather than treating them as equally bad. Then tell me which single revision—dropping or substantially weakening one commitment—would clean up the most conflicts overall. Don't lecture me on Dennett in general; audit this specific set.
reasoning: |-
