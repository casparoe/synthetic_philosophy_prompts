          *   *Conflict:* High. If structures are indispensable for the phenomenon (2), how can stories about those structures be unnecessary luxuries (4)? Unless "phenomenon" in (2) refers to low-level cognitive mechanics and "group-level" in (4) refers to social dynamics. But (2) says "organizational... structures." Moral cognition (from 4) is inherently organizational/functional.
