  hey, i'm writing a seminar paper for my phd (philosophy of mind / cognitive science) and i'm stuck on how to frame the arguement. could you write me a dialogue between two people — call them A and B — who disagree about whether Hofstadter's idea of an inviolate level survives once you apply it to distributed neural nets rather than symbolic logic?

