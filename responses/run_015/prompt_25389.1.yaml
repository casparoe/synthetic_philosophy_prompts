answer: |-
  The steam hissed, a sharp exhale against the silence of the apartment. Elias held the iron suspended over the blue Oxford shirt, watching the vapor dissipate into the dim light of the kitchen. He was preparing for dinner with Sarah, the first time they would meet outside the context of work, and the shirt felt like a uniform for a role he wasn't sure he could play.

  He pressed the iron down. The fabric stiffened under the heat. He moved his hand in the practiced arc he'd learned from his mother, smoothing the invisible wrinkles of his own history. He needed to be the Elias who had his finances in order, the Elias who read books with cracked spines, the Elias who didn't spend weekends staring at the ceiling. He ironed the persona into the cotton, stroke after stroke.

  On the counter, his phone buzzed. A message from his brother: *Mom's asking if you're coming Sunday.*

  Elias ignored it. The guilt was a familiar weight, a stone he carried in his pocket everywhere he went. He shifted his stance to reach the collar, and his elbow clipped the water reservoir. The iron tipped.

  It didn't fall far, just enough to rest its hot sole against the front panel of the shirt. There was a smell of singed fiber, sharp and chemical. Elias froze. He lifted the iron. A dark, jagged scar marred the blue fabric, right over the heart.

  Panic rose in his throat, cold and immediate. *Clumsy,* the voice in his head said. *Ruined. Typical.* He saw the evening unraveling: Sarah noticing the burn, him making excuses, the awkward silence, the confirmation that he was exactly what he feared—a man patching together a presentable surface over a chaotic interior. He felt the heavy, solid shape of his failure settling into his bones. He was the kind of man who burned his shirts. It was a fact of his geometry.

  He hung the iron on its heel. He touched the burn mark. The fabric was brittle there, fused into a hard knot. He could throw the shirt away. He could cancel the date. He could stay home and protect the story of who he was supposed to be.

  Instead, he walked to the window. Outside, the city was a grid of lights, thousands of lives intersecting. He looked at his reflection in the glass. He saw a man holding a ruined shirt. He waited for the shame to solidify, to become the center of him. But as he watched his own reflection breathe, fogging the glass, the solidity seemed to waver.

  The burn was just carbonized cotton. The shame was a story he was telling himself about the cotton.

  He remembered a conversation from years ago, a philosophy professor talking about points of balance. *The center of gravity isn't a thing you can touch,* the professor had said, tapping a chalkboard. *It's a place you calculate so you don't fall.*

  Elias looked back at the shirt. He had been treating his life like a statue, something carved and fixed, where a chip meant the whole thing was flawed. But maybe it was more like a mobile. The pieces hung loose, connected by wire and tension. If one piece swung, the whole structure shifted to find a new balance point. The balance point wasn't inside the pieces. It was in the relationship between them.

  He picked up a black marker from the junk drawer. He sat at the kitchen table. Carefully, he traced the edges of the burn mark, darkening the singed edges, turning the accident into a deliberate shape. It looked like a lightning bolt, or a crack in a map. It wasn't a flaw anymore; it was a feature. It was a detail that demanded an explanation.

  He put the shirt on. It fit well across the shoulders. The mark stood out against the blue, undeniable.

  When he met Sarah at the restaurant, she kissed him on the cheek and sat down. She ordered wine. They talked about the project at work, about the traffic, about the rain. Then she looked down at his chest.

  "What happened there?" she asked, pointing to the mark.

  Elias felt the old panic flicker, the urge to apologize, to minimize. He felt the gravity of the "Guilty Elias" pulling at him, trying to drag him back into the old orbit. He took a sip of water. He felt the weight of the glass, the coolness of it, the realness of the moment.

  "I burned it," he said. "I was thinking about too many things at once. I tried to iron out the wrinkles and I pressed too hard."

  Sarah smiled, not unkindly. "So you wore it anyway?"

  "It seemed honest," Elias said. And he realized it was. The shirt wasn't a lie. The burn wasn't a lie. The only lie would have been pretending he was the kind of man who never made mistakes.

  "That's good," she said. "I hate perfect shirts. They look like armor."

  They ate. The conversation flowed, not in a straight line, but in loops and digressions. Elias found himself laughing at a story about his brother, the same brother he had ignored earlier. He didn't resolve the guilt about Sunday; he just noted it, like a cloud passing over the sun. It was part of the weather, not the sky itself.

  Walking her home later, the air was cool. Elias felt light, not because the burden of himself had vanished, but because he had stopped trying to carry it as a single, solid object. He was a collection of moments, stitches and burns and breaths, held together by the story he chose to tell.

  At her door, Sarah touched his arm. "Same time next week?"

  "I'd like that," Elias said.

  He walked back to the subway alone. He passed a shop window and caught his reflection again. The dark mark on the blue shirt was visible even in the dim light. It looked like a signature. He didn't try to stand straighter or suck in his stomach. He just walked, finding his balance with every step, creating the center as he moved.
