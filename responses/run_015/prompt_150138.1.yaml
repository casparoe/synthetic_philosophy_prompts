      *   **The Line (Live Hypothesis vs. Fear):** Is there a principled cutoff? "Liveness" is subjective in James. This is a weakness in James's framework. However, "plausibility constraints" (coherence with background knowledge) can offer a principled line. It's not *purely* ad hoc, but it is context-dependent.

  4.  **Drafting the Adjudication (Iterative Process):**

