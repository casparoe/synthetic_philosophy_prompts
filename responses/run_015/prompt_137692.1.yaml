  Regarding your pre-emption: uncertainty doesn't force us to accept dominated strategies if we impose complexity priors on the threatener's claims. The system can acknowledge the simulations matter without assigning significant credence to the claim that *this* specific threatener controls *that* many simulations conditional on *this* specific action. The fidelity–leverage trade-off isn't forced; we keep the fidelity required to track human endorsement and reject the leverage via skeptical priors on acausal causation. You ask which horn I accept: I take the faithful surrogate, because the other horn admits defeat on alignment before the threatener even arrives.
