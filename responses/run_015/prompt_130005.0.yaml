prompt: |-
  I'm a first-year PhD student in cognitive science sitting in on an interdisciplinary reading group on cultural evolution, and I keep getting stopped in my tracks by the same sentence. Last week the discussion turned to why wildly improbable claims propagate so efficiently online while careful corrections mostly don't, and one of the senior people in the group ended the argument with the line *memes are like genes*: whatever replicates is what there is more of next generation, so of course truth has nothing to do with it — selection doesn't care whether a meme is true, only whether it copies. Earlier in the same term she had used the very same sentence for what looks like a different purpose: to argue that cultural change is genuinely Darwinian and not merely change over time, because cultural items, like genes, are replicators with lineages, inheritance, and heritable variation, and so the whole apparatus of population thinking is supposed to transfer. I can't tell whether those two uses are the same claim wearing different clothes, and I suspect the sentence is doing a lot of quiet work in both places.

  What I'd like is a menu, not a verdict on who was right. Please set out the distinct precise theses the slogan could be expressing, ordered roughly from the trivial to the radical, and give each a status: platitude, substantive and defensible, substantive and contested, or straightforwardly false. I don't want to hand you my own list, but I'd want the distinctions I keep tripping over to be covered — *like genes* in the sense of having a lineage and a transmission chain; in the sense of being copied with fidelity high enough for cumulative, design-like complexity to accumulate; in the sense of being particulate rather than blending (and what happens to the analogy if cultural transmission is mostly reconstructive and the variants you get out aren't the variants you put in); in the sense of being a unit of selection with interactors and phenotypes further down; in the sense of varying randomly with respect to fitness; and in the sense of being *selfish*, i.e. of having interests that can come apart from the interests of the person carrying them. Say for each reading whether it is even coherent, whether it is testable in principle, and what kind of observation would tell it apart from its neighbors.

  To make that concrete rather than abstract, here is a pair of hypothetical findings I invented to poke at the analogy, and I'd like each reading checked against them. Suppose that in a long-isolated island chain, canoe-building techniques improve measurably in hydrodynamic efficiency over eight centuries while ritual narratives in the same communities change just as rapidly but with no discernible directional trend at all. Suppose also that a costly ritual practice which measurably reduces the number of children its bearers raise to adulthood nevertheless spreads across the whole island group within two centuries, because it is preferentially performed by the most prestigious craftsmen and prestige-biased copying swamps the fertility cost. For each reading: does the first finding support, undermine, or simply not touch it? Same for the second? And — this is what I actually care about — which reading, if any, would really license the conclusion she wanted, namely that we should *expect* cultural selection to be indifferent to whether a meme is true, as opposed to licensing only something much weaker, such as that some cultural items spread for reasons unrelated to their truth, or that transmission mechanisms like copy-the-prestigious and copy-the-prevalent can beat out copy-what-works?

  Two more things, if you can fit them in. First, the same person sometimes switches to the variant *ideas are like viruses*; I have a feeling that slogan carries different baggage — horizontal rather than vertical transmission, no shared fate with the host, host damage as the expected outcome — and I'd like to know whether the two slogans pull in genuinely different directions or whether the switch is just rhetoric. Second, a verdict on the dialectic: if the readings that would get her to her conclusion are the strong ones (selfish replicators whose interests diverge from ours, transmission biased in ways indifferent to truth), and the readings that are safe are the weak ones (lineages exist, variants spread at different rates), is the slogan functioning as an argument at all, or as a way of importing the conclusion under cover of an analogy nobody in the room is going to dispute? A table would suit me best: reading, precise statement, status, prediction about each of the two island findings, and whether it supports the debate-ending move.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** First-year PhD student in cognitive science. Sitting in on an interdisciplinary reading group on cultural evolution.
      *   **Problem:** Confused by the slogan "memes are like genes" used in two seemingly different contexts (explaining the spread of falsehoods vs. establishing cultural evolution as genuinely Darwinian). Suspects the slogan is doing hidden work.
      *   **Task:** Provide a "menu" of distinct precise theses the slogan could express, ordered from trivial to radical.
      *   **Requirements for each thesis:**
          *   Precise statement.
          *   Status (Platitude, Substantive/Defensible, Substantive/Contested, False).
          *   Coherence & Testability.
          *   Differentiation from neighbors.
          *   Response to two hypothetical findings (Canoe efficiency vs. Ritual drift; Costly prestige ritual spread).
          *   Does it license the "truth doesn't matter" conclusion?
      *   **Additional Requests:**
          *   Compare "memes are like genes" vs. "ideas are like viruses."
          *   Verdict on the dialectic (Is it an argument or a rhetorical trick?).
          *   **Format:** A table is requested for the main menu.

  2.  **Deconstruct the Slogan ("Memes are like genes"):**
      *   The user has already identified key dimensions of variation:
          *   Lineage/Transmission chain.
          *   Fidelity/Cumulative complexity.
          *   Particulate vs. Reconstructive (Blending).
          *   Unit of Selection (Interactors/Phenotypes).
          *   Variation w.r.t. Fitness (Randomness).
          *   Selfishness (Divergent interests).
      *   I need to structure these into a logical progression from weak (hard to deny) to strong (highly controversial).

  3.  **Drafting the Readings (The Menu):**

      *   *Reading 1: The Minimalist (Lineage).* Cultural items have ancestors and descendants. Change is descent with modification.
      *   *Reading 2: The Structuralist (Particulate/Fidelity).* Cultural items are discrete enough to maintain identity over time, allowing accumulation. (Addressing the reconstruction objection).
      *   *Reading 3: The Population Thinker (Differential Fitness).* Cultural variants spread at different rates due to properties of the variants or the context.
      *   *Reading 4: The Blind Selector (Truth-Independence).* The mechanism of selection does not inherently track truth/utility, only replicability.
      *   *Reading 5: The Strong Dawkinsian (Selfish Replicator).* Memes have "interests" distinct from hosts; hosts are vehicles; selection can actively favor host-harming traits.

  4.  **Evaluating the Hypothetical Findings:**
      *   *Finding 1 (Canoes improve, Rituals drift):* Shows cumulative adaptation in technology, random drift in ritual.
          *   Supports Lineage/Population thinking.
          *   Challenges "All culture is adaptive" but fits "Selection + Drift."
          *   Crucial for Fidelity (Canoes need high fidelity to improve).
      *   *Finding 2 (Costly Prestige Ritual):* Spreads despite fitness cost to host due to prestige bias.
          *   Strong support for Truth-Independence and Selfishness.
          *   Shows selection can act against biological fitness.

  5.  **Addressing the "Truth Doesn't Matter" Conclusion:**
      *   Does Lineage imply truth doesn't matter? No.
      *   Does Population Thinking imply truth doesn't matter? No (could select for truth).
      *   Does Blind Selection imply truth doesn't matter? Yes, structurally.
      *   Does Selfish Replicator imply truth doesn't matter? Yes, actively.

  6.  **Addressing "Ideas are like Viruses":**
      *   Genes: Vertical (mostly), long-term, co-evolved with host.
      *   Viruses: Horizontal, parasitic, often pathogenic, short-term invasion.
      *   Relevance: "Virus" emphasizes the *harmful/parasitic* aspect and *horizontal spread* (viral marketing), whereas "Gene" emphasizes *inheritance* and *evolutionary time*. The switch likely signals a shift from "mechanism" to "pathology."

  7.  **Addressing the Dialectic (The Verdict):**
      *   Is it an argument or a rhetorical import?
      *   Likely the latter. The weak readings are uncontroversial but don't support the strong conclusion. The strong readings support the conclusion but are controversial. The slogan slides between them.

  8.  **Constructing the Table:**
      *   Columns: Reading, Precise Statement, Status, Finding 1 (Canoes/Ritual), Finding 2 (Costly Ritual), Licenses "Truth Irrelevant"?
      *   Rows: The 5 Readings drafted above.

  9.  **Refining the Content (Self-Correction/Nuance):**
      *   *Correction on Reading 2:* The user specifically asked about "particulate vs. reconstructive." I need to make sure Reading 2 addresses the *fidelity* threshold required for cumulative evolution (Tomasello/Henrich vs. Sperber).
      *   *Correction on Reading 4:* Distinguish between "selection *can* be indifferent" vs. "selection *is always* indifferent." The senior scholar's claim ("of course truth has nothing to do with it") is a strong universal claim. I need to capture that strength.
      *   *Status Check:* Be careful not to take sides too hard, but reflect the consensus in the field (e.g., Lineage is platitude, Selfish Meme is contested/false).
      *   *Testability:* Ensure I mention how one would test these (e.g., phylogenetic methods for lineage, experimental transmission chains for fidelity).

  10. **Final Review against Constraints:**
      *   Menu, not verdict (until the end).
      *   Ordered trivial to radical.
      *   Status labels included.
      *   Coherence/Testability mentioned.
      *   Hypothetical findings applied to each.
      *   "Truth Irrelevant" conclusion checked for each.
      *   Virus vs. Gene section included.
      *   Dialectic verdict included.
      *   Table format used.

  11. **Drafting the Response:** (Mental outline of the text surrounding the table)
      *   Intro: Acknowledge the sophistication of the question. Validate the suspicion about the slogan sliding between meanings.
      *   The Table: The core deliverable.
      *   Analysis of Findings: Briefly explain *why* the table entries are what they are (e.g., why Canoes support Fidelity).
      *   Virus vs. Gene: Distinct emphases.
      *   Dialectic Verdict: The "Bait and Switch" analysis.

  12. **Fine-tuning the "Status" labels:**
      *   Lineage: Platitude (everyone agrees culture changes over time with inheritance).
      *   Fidelity/Particulate: Substantive/Contested (Sperber's epidemiological challenge).
      *   Differential Fitness: Substantive/Defensible (Basic evolutionary logic).
      *   Truth Independence: Substantive/Contested (Depends on the bias).
      *   Selfish/Host-Harming: Substantive/Contested (Strong Dawkins vs. Dual Inheritance).

      *Wait, let's look closer at the "Truth" claim.* The claim is "selection doesn't care whether a meme is true."
      *   Weak version: Selection *can* favor falsehoods. (Defensible).
      *   Strong version: Selection *never* cares about truth / Truth is orthogonal to fitness. (Contested/False).
      *   I need to make sure the table reflects the strength of the claim required to end the argument. The senior scholar said "of course truth has nothing to do with it." That's the strong version.

  13. **Final Polish:** Ensure tone is appropriate for a PhD student (technical but clear, respectful of the complexity). Ensure the distinction between "Unit of Selection" and "Unit of Transmission" is clear where needed. (Decided to fold Unit of Selection into the "Selfish" reading for simplicity, as that's where the "interests" lie).

      *Wait, one more check on the "Particulate" reading.* The user asked: "what happens to the analogy if cultural transmission is mostly reconstructive." I need to explicitly mention that if reconstruction is too high-fidelity/transformative, the "Gene" analogy breaks down (Sperber's point). I will put this in Reading 2.

      *Check on Finding 1:* Canoes improve (directional selection), Rituals drift (neutral evolution). This supports the idea that *some* cultural evolution is adaptive and *some* isn't. It challenges the idea that *all* culture is like genes in the "adaptive" sense, but supports the "evolutionary mechanism" sense.
      *Check on Finding 2:* Costly ritual spreads. This is the killer app for the "Selfish Meme" or "Truth Irrelevance" argument.

