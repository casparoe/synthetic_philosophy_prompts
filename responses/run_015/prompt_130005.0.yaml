answer: |-
  This is an exceptionally sharp diagnosis of a common rhetorical move in evolutionary social science. You are correct to suspect that the slogan *"memes are like genes"* is functioning as an equivocation: it trades on the uncontroversial aspects of the analogy to smuggle in the controversial ones.

  Below is the menu you requested. I have ordered the readings from the weakest (hardest to deny, but does the least work) to the strongest (does the most work, but is highly contestable). Following the table, I address the "Virus" variant and the dialectical verdict.

  ### The Menu: Five Readings of "Memes Are Like Genes"

  | Reading | Precise Statement | Status | Coherence & Testability | Finding 1 (Canoes ↑ / Rituals ↔) | Finding 2 (Costly Ritual Spreads) | Licenses "Truth Irrelevant"? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Lineage Claim** | Cultural variants stand in ancestor-descendant relationships; current states are causally dependent on past states via transmission chains. | **Platitude** | **Coherent:** Yes. <br>**Testable:** Phylogenetic methods on cultural traits. <br>**Differentiation:** Denying this implies culture is reinvented de novo every generation. | **Supports:** Shows continuity over 8 centuries. <br>**Nuance:** Doesn't explain *why* canoes improved while rituals drifted. | **Supports:** Shows the ritual has a transmission history, even if maladaptive. | **No.** Lineage says nothing about *what* drives the spread. Truth could be the primary driver of lineage survival. |
  | **2. The Fidelity Claim** | Cultural transmission is sufficiently high-fidelity and particulate (not blending/reconstructive) to retain identity over time, allowing cumulative complexity. | **Substantive & Contested** | **Coherent:** Yes. <br>**Testable:** Transmission chain experiments; measuring transformation rates. <br>**Differentiation:** If transmission is mostly reconstructive (Sperber), the "gene" analogy breaks; it becomes "epidemiology." | **Mixed:** Canoes support high fidelity (needed for cumulative tech). Ritual drift suggests fidelity exists but selection is neutral. | **Supports:** The ritual maintained identity despite fitness costs, implying stable transmission. | **No.** High fidelity allows truth to accumulate (science) just as easily as falsehoods. |
  | **3. The Population Claim** | Cultural change is driven by differential fitness of variants (some copies out-replicate others) due to biases (content, context, frequency), not just individual learning. | **Substantive & Defensible** | **Coherent:** Yes. <br>**Testable:** Modeling frequency changes; identifying transmission biases. <br>**Differentiation:** Denying this implies change is purely individual innovation or drift. | **Supports:** Canoe improvement implies directional selection; Ritual drift implies neutral drift. Both are population processes. | **Supports:** Shows differential replication rates driven by prestige bias, not biological fitness. | **Weakly.** It licenses that *mechanisms* other than truth (e.g., prestige) exist, but not that truth is *never* the mechanism. |
  | **4. The Blindness Claim** | The selection mechanism is structurally indifferent to truth/utility; it tracks replicability, not correspondence to reality. True memes spread *only if* truth aids replication. | **Substantive & Contested** | **Coherent:** Yes. <br>**Testable:** Comparing spread rates of true vs. false claims controlling for engagement. <br>**Differentiation:** Stronger than #3; claims truth has no *privileged* status in the algorithm. | **Supports (Rituals):** Ritual drift shows selection isn't always optimizing function. <br>**Undermines (Canoes):** Canoe improvement shows selection *can* track functional truth (hydrodynamics). | **Strong Support:** The ritual spreads *despite* being costly/false about welfare, driven purely by prestige copying. | **Yes (Moderate).** Supports the claim that truth is not *necessary* for spread. Does not prove truth is *irrelevant* (it might still help sometimes). |
  | **5. The Selfish Replicator Claim** | Memes are units of selection with "interests" that can diverge from host fitness; memes evolve to manipulate hosts to ensure copying, even at host expense. | **Substantive & Contested** | **Coherent:** Metaphorically yes, ontologically dubious (memes don't have agency). <br>**Testable:** Identifying traits that reduce host fitness but increase meme transmission. <br>**Differentiation:** Requires active host-manipulation, not just passive bias. | **Undermines:** Canoe improvement benefits the host, suggesting host-meme alignment. | **Strong Support:** The ritual reduces host fertility but spreads. Looks like a "parasitic" meme exploiting prestige pathways. | **Yes (Strong).** This is the "Truth Doesn't Matter" conclusion weaponized. If memes are selfish, truth is only selected if it aids the meme, not the host. |

  ### Analysis of the Hypothetical Findings

  You asked how the readings handle your two island scenarios. Here is the breakdown of why the table is populated as it is:

  **Finding 1: Canoes improve (directional); Rituals drift (neutral).**
  *   **What it tells us:** Cultural evolution is not a monolith. Some domains (technology) are subject to strong functional selection (where "truth" about hydrodynamics matters). Other domains (ritual) are subject to drift or social selection.
  *   **Impact on the Slogan:** This finding **undermines** the universalist version of the "Truth Irrelevant" claim (Reading 4 & 5). If canoes improve, then *sometimes* selection cares about "truth" (or at least functional efficacy). The senior scholar's claim that "of course truth has nothing to do with it" is too strong if canoe-building exists. However, it **supports** the Population Claim (Reading 3) that the *mechanism* is evolutionary (variation + selection), even if the *criteria* for selection vary by domain.

  **Finding 2: Costly prestige ritual spreads.**
  *   **What it tells us:** Transmission biases (copy the prestigious) can override biological fitness costs.
  *   **Impact on the Slogan:** This is the strongest evidence for Readings 4 and 5. It demonstrates that **replicability $\neq$ utility**. It shows that a cultural trait can spread *because* it is associated with prestige, even if it is "false" (in the sense that it harms the bearer) or "costly." This licenses the claim that truth/utility is not the *guarantor* of spread. However, it does not prove truth is *never* a factor, only that it can be swamped by other biases.

  ### "Ideas are like Viruses" vs. "Ideas are like Genes"

  You sensed a shift in baggage. You are right. While both imply replication, they emphasize different parameters of the evolutionary model:

  1.  **Vertical vs. Horizontal:**
      *   **Genes:** Primarily vertical (parent to offspring). Implies long-term co-evolution, stability, and alignment of interests (usually, a gene wants its host to reproduce).
      *   **Viruses:** Primarily horizontal (peer to peer). Implies rapid spread, invasion, and potential lack of long-term stability.
  2.  **Interest Alignment:**
      *   **Genes:** The "Gene's Eye View" (Dawkins) argues genes and hosts are often aligned (successful hosts copy genes).
      *   **Viruses:** The analogy explicitly suggests **pathology**. A virus succeeds often by exploiting host machinery to the host's detriment.
  3.  **The Rhetorical Switch:**
      *   When the scholar says *"memes are like genes,"* she is invoking **legitimacy**. She is saying, "This is a science of inheritance, lineages, and deep structure. Treat it like biology."
      *   When she says *"ideas are like viruses,"* she is invoking **danger/autonomy**. She is saying, "These things spread regardless of your well-being. You are a host, not an agent."
      *   **Do they pull in different directions?** Yes. The Gene analogy supports the "Cultural Evolution is Darwinian" argument (Reading 1 & 3). The Virus analogy supports the "Memes are Selfish/Truth-Independent" argument (Reading 5). Switching between them allows her to claim the scientific rigor of genetics while retaining the critical bite of virology.

  ### Verdict on the Dialectic

  Is the slogan functioning as an argument, or as a way of importing the conclusion under cover of an analogy?

  **It is a rhetorical import (an equivocation).**

  Here is the logical gap the slogan bridges:
  1.  **Premise A (Platitude):** Cultural items have lineages and differential fitness (Reading 1 & 3). *Everyone in the room accepts this.*
  2.  **Premise B (Contested):** Evolutionary selection is blind to truth and can favor host-harming replicators (Reading 4 & 5). *This is the controversial conclusion.*
  3.  **The Slogan:** "Memes are like genes."

  By asserting the slogan, the speaker encourages the audience to accept Premise B because they have already accepted Premise A. The slogan hides the slide from "cultural change is a population process" (which is true) to "cultural selection is indifferent to truth" (which requires specific evidence about transmission biases, like your Finding 2).

  **The Diagnosis:**
  The "Truth Irrelevant" conclusion is **not licensed** by the weak readings (Lineage, Population). It is **only licensed** by the strong readings (Blindness, Selfish Replicator).
  *   If the scholar means Reading 1 or 3, her conclusion ("truth has nothing to do with it") is a **non-sequitur**. (Selection could theoretically track truth).
  *   If the scholar means Reading 4 or 5, her conclusion follows, but the premise is **substantive and contested**, not a given.

  **Advice for the Reading Group:**
  You do not need to reject the slogan. Instead, ask which reading is in play.
  *   *"When you say memes are like genes, do you mean they merely have lineages (which no one disputes), or do you mean they are selfish replicators that actively decouple from host welfare (which requires evidence like the costly ritual)?"*
  *   *"Does the gene analogy imply we should expect cumulative adaptive design (like the canoes), or does the virus analogy imply we should expect parasitic drift (like the rituals)? Because the policy implications differ."*

  This forces the distinction out of the shadows and prevents the slogan from doing the argumentative work for her.
