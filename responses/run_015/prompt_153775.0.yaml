answer: |-
  Your "variance-bookkeeping view" is robust. It is essentially the standard orthodox interpretation found in quantitative genetics (often associated with the work of Falconer, Lynch & Walsh, and philosophically articulated by scholars like Sesardic or Sober), but you have distilled it into a principle that prioritizes conceptual clarity over intuitive comfort.

  Here is the evaluation of your principle against your seven verdicts, followed by the predictions you requested.

  ### 1. Evaluation Against Your Verdicts

  Your principle survives all seven verdicts, but it exerts different pressures on them.

  *   **Verdicts (1), (2), and (4)** are fully vindicated by the definition. They are direct consequences of the claim that heritability is a ratio of variances in a specific population, not a measure of developmental necessity or absolute genetic causation.
  *   **Verdict (3)** is where your principle does its most important corrective work. You noted a "persistent sense" that high heritability implies environmental interventions are futile. Your Clause (ii) (intervention-blind) explicitly declares this sense false. The principle does not force you to give up the verdict (that both claims are true), but it forces you to excise the intuition that connects them. The principle dictates that the high coefficient and the secular trend are compatible precisely because the coefficient describes the *current* distribution of variance, not the *potential* for future variance reduction.
  *   **Verdict (5)** is secured by Clause (i) (contrast-blind). Your discomfort ("if genes are among the causes... why not candidates for explaining a difference?") stems from conflating *causes of a trait* with *causes of variance in a trait*. The bookkeeping view forces you to accept that knowing the sources of variance within Group A tells you nothing about the sources of the mean difference between Group A and Group B. This is the "Lewontin's Fallacy" guardrail. Your principle licenses your refusal to extrapolate.
  *   **Verdict (6)** is coherent under this view. If parents transmit genes that correlate with providing books, that variance is captured in $V_A$ (additive genetic variance) via passive gene-environment correlation. The principle allows you to say a trait is "heritable" (statistically associated with genetic variance) while being "environmental" (causally mediated by books). The bookkeeping view cares about the *source of variance*, not the *proximal mechanism*.
  *   **Verdict (7)** is the point of friction. You state: "I do not want to conclude that heritability is not a property of the trait at all." However, your principle defines heritability as a ratio of variance components under "conditions that actually obtained," which includes measurement precision. If measurement noise increases $V_E$, $h^2$ drops.
      *   **The Conflict:** Your desire to view $h^2$ as a property of the *trait* conflicts with your principle's definition of $h^2$ as a property of the *variance in the population*.
      *   **Resolution:** To maintain the principle, you must concede that heritability is a property of the *phenotype-as-measured*, not the underlying biological construct. You can distinguish "true-score heritability" from "observed heritability," but the coefficient you calculate is always the latter. The principle forces you to accept that $h^2$ is epistemically sensitive (dependent on instruments) as well as ontologically relative (dependent on population variance).

  ### 2. The Workhorse Clause

  **Clause (i)** ("contrast-blind, saying nothing about the cause of any specified difference between groups or of any change over time") does the most philosophical work.

  It is the load-bearing wall that supports Verdicts (3), (4), and (5). It prevents the slide from "variance within" to "difference between," which is the most common error in the interpretation of behavioral genetics. It also enforces the population-relativity required in Verdict (4). Without Clause (i), the bookkeeping view collapses into a claim about genetic determinism.

  ### 3. The Verdict to Modify

  While the principle survives all verdicts, it requires you to modify the **underlying intuition of Verdict (7)**.

  You wrote: *"I do not want to conclude that heritability is not a property of the trait at all."*
  The principle requires you to conclude exactly that. Heritability is not a property of the trait (e.g., "height"); it is a property of the distribution of measurements of that trait in a specific context. If you improve your ruler, the heritability of height changes, even if the biology of height does not. To keep your principle consistent, you must treat heritability as a statistic of the *data*, not a parameter of the *organism*.

  ### 4. Predictions on New Cases

  Based strictly on your variance-bookkeeping view, here are the predictions for the unsettled cases.

  **Case A: A rare mutation with large effect against environmental noise.**
  *   **Prediction:** Low heritability.
  *   **Reasoning:** Additive genetic variance ($V_A$) is a function of allele frequency ($p$) and effect size ($a$), proportional to $2pq a^2$. If the mutation is rare, $p$ is near 0, making $q$ near 1, but the product $2pq$ is very small. Even with a large $a$, the contribution to population variance is minimal compared to the "substantial environmental noise." The bookkeeping view counts variance, not effect size.
  *   **Principle Check:** Confirms Clause (iii): not a measure of the strength of genetic causation for an individual, but of variance in the population.

  **Case B: After a universal intervention (e.g., correcting eyesight or iodine deficiency).**
  *   **Prediction:** Heritability will **increase**.
  *   **Reasoning:** A universal intervention reduces environmental variance ($V_E$) by making the environment uniform. Since $h^2 = V_A / (V_A + V_E + V_{GxE}...)$, reducing the denominator ($V_E$) while holding the numerator ($V_A$) constant increases the ratio.
  *   **Principle Check:** This tests Clause (ii). The principle predicts the *statistic* will change, but warns you not to interpret this as the trait becoming "more genetic." It is a mathematical consequence of reducing environmental variance. This is often counter-intuitive (the "heredity-environment paradox"), but the bookkeeping view handles it cleanly.

  **Case C: A population with strong assortative mating.**
  *   **Prediction:** Heritability estimates will **increase** over generations (or be upwardly biased in certain designs).
  *   **Reasoning:** Assortative mating increases genetic variance ($V_G$) in the population by increasing the correlation between alleles at different loci (linkage disequilibrium) and increasing homozygosity. If $V_A$ rises while $V_E$ stays constant, $h^2$ rises.
  *   **Principle Check:** Confirms population relativity. The "conditions that actually obtained" include the mating structure. A change in mating structure changes the population parameters, thus changing the coefficient.

  **Case D: Heritability is higher in better-off families than in worse-off ones.**
  *   **Prediction:** This is consistent with the principle; the coefficient is a **family of statistics indexed by subgroup**.
  *   **Reasoning:** In lower SES environments, $V_E$ is typically larger (more environmental stressors, instability, noise). In higher SES environments, environmental conditions are more uniform, reducing $V_E$. Since $h^2$ is inversely related to $V_E$ (holding $V_A$ constant), $h^2$ will be lower in the high-variance (low SES) environment.
  *   **Principle Check:** This does not break the population-relativity clause; it exemplifies it. It forces you to say there is no single "heritability of IQ," only "heritability of IQ in Population X at Time Y."

  **Case E: The heritability of a difference, or of a change in a population mean.**
  *   **Prediction:** This is a **category error**.
  *   **Reasoning:** Heritability is defined as a ratio of variances ($V_A / V_P$). A difference between means is not a variance; a change in a population mean over time is a shift in location, not a spread around a location. There is no denominator for a "variance of a mean difference" in this context.
  *   **Principle Check:** Clause (i) should explicitly forbid this. You should amend your principle to state: *"Heritability applies only to variance around a mean within a generation, never to the mean itself or shifts in the mean."* Asking for the heritability of a group difference is like asking for the standard deviation of a single number.

  ### Summary for Your Paper

  Your "variance-bookkeeping view" is analytically sound and sufficient for the tasks you have set. It successfully isolates the statistic from the metaphysical claims you wish to avoid (determinism, fixity, between-group explanation).

  To finalize your analytic frame, you should make two explicit adjustments based on this testing:
  1.  **On Measurement:** Explicitly state that heritability is a property of the *phenotypic distribution including measurement error*, not the biological trait in the abstract. This resolves the tension in Verdict (7).
  2.  **On Means:** Explicitly add to Clause (i) that heritability is undefined for differences in means or secular trends, categorizing such questions as errors of type mismatch (variance vs. mean).

  This leaves you with a principle that is restrictive enough to prevent misuse but descriptive enough to account for the mathematical behavior of the coefficient in all the cases you listed.
