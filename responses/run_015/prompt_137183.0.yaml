      *   **Task:** Help refine an argument about charters vs. institutions, using Frederick Douglass's 1860 speech on the Constitution as a case study.
      *   **Constraints:** No internet/links/citations (on a train). Skip basic biographical context (Garrison split). Focus on argumentative structure, logic, and potential pitfalls. 900-word limit for the *column* (implies the advice needs to be dense and actionable, not a lecture).
