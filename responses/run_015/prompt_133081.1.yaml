answer: |-
  **MEMORANDUM**

  **TO:** Working Party on Head of Division Election
  **FROM:** [Your Name], Student Member
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation on Voting Rule

  **Recommendation**
  I recommend we adopt the **Alternative Vote (AV)**. It satisfies the majority criterion, is robust against "spoiler" effects, and meets the Registrar's requirement for a single-slide explanation better than Borda. While no rule is perfectly strategy-proof, AV minimizes the incentive for complex tactical voting in a three-candidate field.

  **Refutation of Rule R**
  The proposed Rule R (Random Ballot Veto + Majority) is manipulable. Consider this sincere profile of five electors:
  *   3 voters: B > A > C
  *   1 voter: C > A > B
  *   1 voter (Me): A > B > C

  Under sincere voting, I rank C last. If my ballot is drawn (20% chance), C is vetoed; the runoff is A vs B. Since three voters prefer B to A, B wins. If a B>A>C ballot is drawn (60% chance), C is vetoed; B wins again. Only if the C>A>B ballot is drawn (20% chance) is B vetoed, letting A win. My expected outcome is mostly B.

  However, if I insincerely rank B last (A > C > B), and my ballot is drawn, B is vetoed. The runoff becomes A vs C. Four voters prefer A to C, so A wins. By lying, I increase the probability of my preferred winner (A) from 20% to 40%.

  **Strategic Logic:** *By insincerely ranking a strong rival last, you increase the chance they are vetoed, securing a runoff against a weaker opponent you can beat.*

  **The "Knowledge" Objection**
  Proponents argue that exploiting R requires knowing others' votes, which is unlikely in a secret ballot of forty. This misunderstands incentive compatibility. A rule should be robust to *possible* manipulation, not just *probable* manipulation. Electors form priors based on campaign signals; if there is a non-zero probability of being the veto-decider, expected utility maximization dictates manipulation when the payoff is high. Furthermore, in a board of forty, coalitions form, making profiles predictable enough to render the veto stage a target for coordination.

  **Repairability of R**
  Rule R cannot be repaired without sacrificing its core features. To remove the incentive to manipulate the veto, the vetoed candidate must be chosen independently of voter rankings (e.g., random candidate elimination). However, this discards the preferential information the Registrar requires. Alternatively, making the rule fully strategy-proof requires reinstating a dictator (per Gibbard–Satterthwaite). Any amendment that preserves the preferential ballot and the two-stage structure will retain vulnerabilities where voters manipulate the veto to influence the runoff pair.

  **Justification and Rival Case**
  AV is the strongest candidate because it ensures the winner has majority support among continuing candidates, avoiding the election of a polarizing figure who might win under a plurality split. It is familiar to academic boards and easily explained: "Eliminate the last-place candidate; redistribute votes until one has a majority."

  The strongest rival is the **Borda Count**. Its case rests on consensus: Borda elects the candidate with the highest average ranking, often favouring compromise figures over polarizing majority favourites. In a divisional head election, where cooperation is paramount, Borda might select a candidate acceptable to all factions rather than one preferred by a slim majority. However, Borda is highly vulnerable to "cloning" (introducing similar candidates to skew scores) and requires voters to understand point allocation, violating the "single slide" simplicity constraint more than AV.

  Given the need for legitimacy and simplicity, AV is the prudent choice.

  **Word Count:** 698 words.
