      *   *Contested:* Was he a strict Laplacian determinist regarding *everything*, or did he accept statistical determinism at the macro level while hoping for hidden variables at the micro level? Did his view on free will allow for any form of compatibilism (freedom as acting according to one's nature), or was it hard incompatibilism? How rigid was his view on the *uniqueness* of physical law? (Did he believe there was only one possible set of laws, or just that *our* universe follows one set strictly?)

