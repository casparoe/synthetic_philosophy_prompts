answer: |-
  ### Structural Outline

  1.  **Philosophical Mapping:** The poem's triptych structure mirrors Whitehead's rhythms of mental growth. Section I (Romance) utilizes frequent enjambment and sensory imagery to mimic the unstructured, vital influx of experience. Section II (Precision) employs caesura, technical vocabulary, and tighter rhythmic control to represent the necessary but constraining act of analysis. Section III (Generalisation) shifts to end-stopped lines, passive voice, and abstract nouns to embody the skeptical view that synthesis can become a hollow administrative act, stripping away the particularity established in the first stage.
  2.  **The Refrain:** The phrase *"The shape is known"* closes each section. In Romance, it signifies an intuitive grasp; in Precision, a successful definition; in Generalisation, a bureaucratic stamp where the "shape" is a category rather than a living form.
  3.  **Tension:** The poem avoids resolving whether the cycle renews. It ends on the hollow certainty of the third rhythm, leaving the reader to question whether the "knowledge" gained is worth the vitality lost.

  ***

  ### Triptych on the Rhythms of Learning

  **I. Romance**

  A sudden rush of colour in the mind,
  Before the name is spoken, before the rule
  Is laid upon the living, breathing thing;
  Here light descends not as a measured beam
  But spills like water over rough-hewn stone,
  Where every shadow holds a possibility,
  And curiosity moves without a map
  Through woods where every leaf demands a touch
  Until, by love of detail undisturbed,
  The shape is known.

  **II. Precision**

  Fix the bound. Define the axis line.
  The specimen is placed beneath the lens;
  No vagrant light. No shadow out of place.
  We measure out the curve; we count the cost,
  And parse the verb until the tense is strict.
  The logic holds; the premise meets conclusion.
  A closed circuit. The variable is fixed.
  Precision cuts the flesh to find the bone,
  And in this strictness, safety is found,
  The shape is known.

  **III. Generalisation**

  The value is assigned. The sum is cast.
  It is concluded that the end was reached.
  No reference is made to how it felt.
  The essence is extracted from the event.
  A report is filed. The category stands.
  Utility is served. The purpose met.
  Nothing is lost, because nothing remained.
  The process is completed. It is done.
  By abstract law, the substance is replaced,
  The shape is known.
