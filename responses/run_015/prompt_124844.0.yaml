      *   *Underdetermined?* (Yes).

  10. (Final Review of the Output): Ensure it sounds like it's talking *to* a colleague, not lecturing a student. Use phrases like "As you're pointing out," "The tension you're identifying," etc. (Proceed to generate response).

  *(Self-Correction during drafting)*: I should mention the "Basic Structure Doctrine" (India) or the "Unconstitutional Constitutional Amendments" debate, as that directly addresses the amendment loop the user mentioned. Also, mention the US context specifically since "liberal democracies" often implies the US model in these discussions, but keep it comparative.

  *(Refining the "Statutes" point)*: Why no anxiety there? Because the validity of statutes is *contingent* on the constitution. The constitution's validity is *presupposed*. That's the Kelsenian move.

  *(Refining the "Making Law" point)*: If the court defines the constitution, is it a constituent power? Schmitt says no, it's constituted. But if it limits amendments, it acts as constituent. This is the crux.

