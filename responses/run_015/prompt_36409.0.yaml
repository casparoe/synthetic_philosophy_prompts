answer: |-
  This is a wonderfully precise framing of a problem that has frustrated biologists and philosophers alike. You have put your finger on the exact nerve: if the Price Equation allows us to partition selection covariance arbitrarily (as Godfrey-Smith and Okasha have elaborated), why does the temperature in the room rise whenever "group selection" is mentioned?

  Your hypothesis—that this is a dispute about explanatory goals rather than biological facts—is closer to the truth than your colleague's insistence on a hard metaphysical fact of the matter. However, the colleague is not entirely wrong to sense a metaphysical residue. The dispute persists because it is not merely verbal, nor is it empirical. It is a dispute about **causal ontology** and **explanatory virtue**, masked as a dispute about units.

  Here is a diagnosis of why the debate survives, structured by the layers of disagreement that the mathematical equivalence results fail to dissolve.

  ### 1. The Statisticalist vs. Causalist Divide
  You noted that in your day, if two formalisms made identical predictions, you picked the computationally convenient one. That is the stance of a **statisticalist**. The Price Equation is a statistical theorem; it describes change. It does not, on its own, specify *cause*.

  The persistence of the argument stems from the fact that many participants (on both sides) are **causalists**. They want the math to tell a story about what *made* the change happen.
  *   **The Gene-Centric View:** Causation flows from replication. Because genes are the only entities with high-fidelity replication across the relevant timescale, they are the only "causal agents" in an evolutionary sense. Group-level variance is real, but it is a *consequence* of gene-level strategies (e.g., kin recognition), not a cause.
  *   **The MLS View:** Causation flows from interaction and differential persistence. If a group goes extinct, the causal explanation is "group extinction," not "the frequency of altruism alleles dropped." To reduce this to gene frequencies is to lose the causal mechanism (the group interaction) that drove the frequency change.

  **Diagnosis:** The equivalence proofs show the *accounts* are translatable, but they do not show the *causes* are identical. If you believe causation requires a physical mechanism of replication, genes win. If you believe causation requires differential persistence of bounded entities, groups can win. The math doesn't decide which definition of "cause" is correct.

  ### 2. The Ambiguity of "Unit of Selection"
  The term "unit of selection" is doing too much work. Philosophers like Elisabeth Lloyd and Peter Godfrey-Smith have long argued that the phrase conflates at least three distinct questions:
  1.  **The Replicator:** What gets copied? (Almost always genes).
  2.  **The Interactor:** What interacts with the environment to cause differential replication? (Organisms, groups, colonies).
  3.  **The Beneficiary:** Who/what accumulates the long-term adaptive design? (Genes, usually).

  The 1970s/80s consensus (Dawkins/Williams) effectively collapsed these three into one: the gene. The MLS revival argues that while the gene is the *replicator*, the *interactor* can be a group, and the *beneficiary* can be complex.

  **Diagnosis:** When a gene-selectionist says "Group selection is false," they often mean "Groups are not replicators." When an MLS proponent says "Group selection is real," they mean "Groups are interactors." They are talking past each other, but the confusion is sustained because both sides insist on using the single label "unit of selection."

  ### 3. Explanatory Virtue and Heuristics
  This is where your hypothesis is strongest. Even if the models are mathematically equivalent, they are not **heuristically equivalent**. They suggest different research programs.
  *   **Kin Selection/Inclusive Fitness:** Directs attention to relatedness coefficients, recognition mechanisms, and genetic architecture. It asks: "How does the actor benefit its copies?"
  *   **Multilevel Selection:** Directs attention to group structure, migration rates, suppression of within-group competition, and group extinction events. It asks: "How does the group structure suppress selfishness?"

  In simple cases, they yield the same answer. In complex cases (e.g., human cultural evolution, major transitions in individuality, microbiome interactions), one framework often collapses under the weight of its own assumptions while the other remains tractable. For example, modeling the evolution of eusociality via inclusive fitness requires complex regression coefficients that some argue become biologically opaque, whereas an MLS model might simply track colony fission rates.

  **Diagnosis:** The fight is about which heuristic is more **robust** and **generalizable**. The "Nowak, Tarnita, Wilson (2010)" paper in *Nature* reignited this by claiming inclusive fitness theory was too restrictive. The backlash wasn't about the math (which was debated); it was about whether abandoning the gene-centric heuristic would blind us to mechanisms we currently understand well.

  ### 4. The Metaphysical Residue (Your Colleague's Point)
  Your colleague argues that whether genes are "literally interactors" is a fact about the world. There is a sense in which this is true, but it depends on your metaphysics of properties.
  *   If fitness is a **propensity** inherent to an entity, then we must decide which entity holds the propensity.
  *   If fitness is a **statistical summary** of a population's trajectory, then "units" are just convenient cut-points in a continuous causal field.

  Most philosophers of biology now lean toward the latter (the statisticalist view), which undermines the colleague's hard metaphysical claim. However, the *intuition* of realism persists because biologists need to reify entities to study them. We need to treat the organism as a "thing" to do physiology, and the gene as a "thing" to do sequencing. Reifying the "group" feels ontologically risky to a generation trained to see groups as ephemeral.

  ### 5. Why It Won't Settle
  You asked if there is a class of cases or a distinction that would settle this. The answer is likely **no**.

  This debate has morphed from an empirical disagreement into a **framework choice**, similar to the debate between Newtonian and Lagrangian mechanics, or perhaps more accurately, the wave-particle duality in quantum mechanics (though without the empirical forced hand).
  *   **Empirical settlement is impossible** because the equivalence theorems hold. Any data fitting one model can be retrofitted to the other.
  *   **Conceptual settlement is impossible** because "causation" and "explanation" are not natural kinds; they are pragmatic tools.

  **The Verdict:**
  Your grandchildren's textbooks will likely still contain the argument, but the tone will have shifted. It will be taught as a **pluralistic toolkit**. The "fight" persists because:
  1.  **Tribal Identity:** "Gene-selectionist" and "MLS-proponent" are now sociological identities within evolutionary biology.
  2.  **Teleological Comfort:** The "Gene's Eye View" provides a very clean, if reductionist, account of *purpose* (the gene's "interest"). MLS requires a more nuanced account of function that some find philosophically messy.
  3.  **Pedagogical Inertia:** It is easier to teach Hamilton's Rule ($rb > c$) than to teach contextual analysis of variance components, so the gene-view retains a foothold in introductory courses, ensuring new generations enter the fray with pre-existing biases.

  **Recommendation for your reading:**
  If you want to see the philosophical diagnosis you're looking for, read **Samir Okasha's *Evolution and the Levels of Selection* (2006)**. He treats the equivalence results seriously but argues that the choice between frameworks depends on the **explanatory context**.
  Also, look into the **"Statisticalist vs. Causalist"** debate in philosophy of biology (Denis Walsh, Christopher Stephens). This addresses your specific puzzle about why variance partitioning doesn't kill the argument: because biologists care about *process*, not just *bookkeeping*.

  **Summary:** You are right that it is not about the biology (the predictions match). Your colleague is right that it feels metaphysical (it's about what counts as a cause). But the core driver is **explanatory pragmatics**: different models highlight different causal levers for intervention and understanding. Since science values both parsimony (genes) and mechanistic clarity (groups), the tension is a feature, not a bug, of evolutionary theory.
