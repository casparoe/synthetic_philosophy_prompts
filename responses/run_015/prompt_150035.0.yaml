  Here is an analysis of your friend's judgments, the principles underlying them, and how to test which one guides her thinking.

  ### 1. Two Consistent Principles

  Based on the four judgments your friend has made, we can distill two distinct rules that consistently explain her views. Both fit the data, but they prioritize different features of the scenarios.

  **Rule A: The Environmental Stability Principle**
  *   **The Rule:** Knowledge is more valuable than true belief *if and only if* the environment is **unstable or dynamic**, requiring the agent to adapt to changing conditions. If the environment is static and the outcome depends on a single, fixed event, true belief is equally valuable.
  *   **Consistency Check:**
      *   *Hotel (Knowledge > Belief):* Streets may be blocked (Dynamic).
      *   *Fire (Knowledge > Belief):* Wood, wind, and terrain vary (Dynamic).
      *   *Umbrella (Equal):* Binary choice, weather outcome is independent of understanding (Static/One-off).
      *   *Restaurant (Equal):* Single meal, preference matches outcome (Static/One-off).

  **Rule B: The Accountability Principle**
  *   **The Rule:** Knowledge is more valuable than true belief *if and only if* the agent must **account for the truth**, either by explaining it to others or by rationally reconstructing the path to success when obstacles arise. If the action is blind, private, and requires no justification, true belief is equally valuable.
  *   **Consistency Check:**
      *   *Hotel (Knowledge > Belief):* You must "adjust when conditions change," which requires an internal justification or model of the city to find a new route (Internal Accountability).
      *   *Fire (Knowledge > Belief):* The child asks questions, requiring you to explain the *why* (External Accountability).
      *   *Umbrella (Equal):* No explanation needed; you simply act (No Accountability).
      *   *Restaurant (Equal):* No explanation needed; you simply eat (No Accountability).

  ### 2. Predictions for the Lone Traveler

  Now we apply these rules to the new mountain pass scenario (Dynamic environment, No social interaction, No future use).

  *   **Prediction from Rule A (Stability):** **Knowledge is more valuable.**
