      *   Time? 60 mins is strict.

  10. **Final Polish:**
      *   Tone: Collegial, strategic, direct.
      *   Structure: Clear headings.
      *   Check the "Skip" list: Tarski is tricky. You need the T-Schema, but not the formal hierarchy. Make that distinction clear.

  **(Self-Correction during drafting):** I initially thought about suggesting the "Liar Paradox" as a skip. But the Liar is often why people care about truth. However, for a 60-min intro to *deflationism*, the Liar is a distraction. Deflationists have a messy time with the Liar. Better to skip it to keep the core concept clear. I will advise skipping the Liar.

