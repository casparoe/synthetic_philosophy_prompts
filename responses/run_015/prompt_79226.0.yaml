answer: |-
  This is a tight constraint (60 mins, no slides, mixed audience), but your instinct on the thought experiment is spot-on. It is the right carrier. It mirrors the actual philosophical motivation for deflationism (the Generalization Argument) without getting bogged down in the history.

  Here is the battle plan.

  ### 1. Verdict on Your Thought Experiment
  **Keep it.** It is superior to the standard "Snow is white" intro because it motivates the *utility* of the predicate before analyzing its *meaning*.
  **The Bolt-On:** You must ensure the "what they can't do" isn't just about emphasis. It has to be about **blind endorsement** and **infinite generalization**.
  *   *Without "true":* To agree with the Pope, they must list every proposition the Pope asserted and assert each one individually.
  *   *With "true":* They say "Everything the Pope says is true."
  *   *Why this matters:* It shows "true" is a logical device for quantifying over propositions, not a name for a metaphysical property.

  ### 2. The 60-Minute Arc (Whiteboard Strategy)
  *Timekeeping is your enemy here. Be ruthless.*

  **0:00–0:15: The "No-True" Community (The Hook)**
  *   **Board:** Write "Community X" on the left. List their capabilities: Assert, Deny, Negate, Conjoin ("and"), Disjoin ("or").
  *   **Action:** Ask the room: "They want to endorse a theory with 1,000 claims, but they don't know the claims yet. Or they want to endorse everything the President said yesterday. How do they do it?"
  *   **Goal:** Let them struggle. They will realize they need a variable or a placeholder.
  *   **Payoff:** Introduce "true" not as a property, but as a **logical operator** that allows quantification over propositions.
  *   **Board:** Write: `∀p (If President says p, then p is true).`

  **0:15–0:30: The Disquotation Schema (The Core)**
  *   **Transition:** "If 'true' is just a logical device, what does it *mean*?"
  *   **Board:** Write the T-Schema large in the center: **"P" is true if and only if P.**
  *   **Action:** Give examples. "'Snow is white' is true iff snow is white."
  *   **Key Point:** The right side explains the left side. There is nothing left over. The concept of truth is exhausted by these instances.
  *   **Deflation:** This is where you deflate. If you know what "snow is white" means, you know what "'snow is white' is true" means. You don't need a theory of correspondence, coherence, or utility to understand the second sentence.

  **0:30–0:45: Killing the Zombies (Misconceptions)**
  *   *See section below for specific timing.*
  *   Use this block to clarify what deflationism *isn't*. This is where you prevent the Law Prof from thinking truth is subjective and the Psych students from thinking it's a neural marker.

  **0:45–0:55: The Normative Gap (The Live Problem)**
  *   **Transition:** "Here is the cost of this view."
  *   **Action:** If "true" is just a logical device (like a variable), why is it *bad* to assert falsehoods? Usually, we say "Assertion aims at truth." If truth isn't a robust property, what is the norm?
  *   **Goal:** Do not solve this. Frame it as the open frontier. Deflationism solves the metaphysics but creates a vacuum in the norms.

  **0:55–1:00: The Check & Wrap**
  *   Ask the final question (see below).
  *   Dismiss.

  ### 3. Misconception Management
  *Don't wait for them to ask. Pre-empt these at the specific moments noted.*

  **1. "Truth is relative / Anything goes."**
  *   **Status:** **Real & Dangerous.** Non-philosophers equate "not a robust property" with "subjective opinion."
  *   **When to head off:** **Minute 30 (during T-Schema).**
  *   **The Line:** "Deflationism is not anti-realism. A deflationist can be a hard-nosed realist. You can say 'There is a fact of the matter about snow, and "snow is white" is true iff snow is white.' Deflationism just says you don't need a *theory of truth* to explain that link. It doesn't say snow isn't white."

  **2. "It's just Correspondence Theory with the metaphysics stripped out."**
  *   **Status:** **Real.** They will think "iff" implies a relationship between language and world.
  *   **When to head off:** **Minute 35.**
  *   **The Line:** "Correspondence says truth is a *relation* between a sentence and a fact. Deflationism says 'true' doesn't pick out a relation at all. It's like the word 'ditto'. 'Ditto' isn't a property of the previous statement; it's a device to repeat it. 'True' is a device to endorse it."

  **3. "The word 'true' is meaningless or filler."**
  *   **Status:** **Real.** If it's redundant, why keep it?
  *   **When to head off:** **Minute 15 (end of Thought Experiment).**
  *   **The Line:** "It's not filler. It has a job: Generalization. You can't drop it when you say 'Everything he said is true' because you can't list the infinite sentences. It's logically necessary, just not descriptively heavy."

  **4. "It can be dropped everywhere."**
  *   **Status:** **Imagined (mostly).** Philosophers know better, but students might think "P is true" is *always* identical to "P".
  *   **When to head off:** **Minute 20.**
  *   **The Line:** "In direct assertion, yes. But in belief reports ('John believes it is true') or logical generalizations, you need the predicate. It's contextually redundant, not syntactically eliminable."

  ### 4. The Norm of Assertion (The "Live Problem")
  You want this to land as a problem, not a refutation.
  *   **Placement:** Minute 45.
  *   **Framing:** "If I ask you 'Why shouldn't I assert lies?', a correspondence theorist says 'Because you aren't matching the world.' A deflationist says... what?"
  *   **The Trap:** If they say "Because it's false," you ask "What does 'false' mean?" They say "Not true." You ask "What does 'true' mean?" They say "Just asserting P."
  *   **The Result:** It looks like the norm collapses into "Don't assert P unless you assert P."
  *   **The Takeaway:** Tell them: "Deflationists (like Price or Horwich) have to work hard to rebuild a norm of assertion without making truth a substantial goal. That is where the current debate is. If you take nothing else away, take this: Deflationism saves us from metaphysical mystery but costs us an easy explanation of why lying is wrong."

  ### 5. The Final Comprehension Question
  Do not ask "Do you understand?" Ask them to apply the logic to a new domain.

  **The Question:**
  > "A witness in court says: 'I swear that every statement in this document is true.'
  > Under a Correspondence theory, they are claiming a specific relationship exists between the document and the world.
  > **Under Deflationism, what exactly have they committed themselves to?**"

  **What you want to hear:**
  *   They have *not* committed to a metaphysical relationship.
  *   They have committed to endorsing every individual statement in the document.
  *   If the document says "The light was red," they are asserting "The light was red."
  *   The word "true" is just the logical glue allowing them to endorse the whole set at once.

  **What indicates failure:**
  *   "They committed to being honest." (Normative, not semantic).
  *   "They committed that the document matches reality." (Correspondence).
  *   "They committed to nothing, it's just words." (Nihilism/Relative).

  ### 6. The Skip List (Say this out loud)
  To manage expectations and save time, explicitly state what you are **not** doing. Write "OUT OF SCOPE" on the corner of the board.

  1.  **Tarski's Formal Hierarchy:** "We are using the T-Schema ('P' is true iff P), but we are ignoring Tarski's object-language/meta-language distinction. That's for formal logic, not conceptual analysis."
  2.  **The Liar Paradox:** "Deflationism has a tricky time with 'This sentence is false.' We are ignoring that today. It's a technical problem for logicians, not a dealbreaker for the core concept."
  3.  **Prosententialism:** "Some deflationists say 'true' is a pro-sentence (like a pronoun). We won't distinguish between that and disquotationalism today. The functional upshot is the same."
  4.  **Conservativeness Proofs:** "There are formal proofs about whether truth adds content to a theory. We are doing philosophy, not math."

  ### Summary of Whiteboard Layout
  *   **Left:** Community X (Capabilities vs. Limitations).
  *   **Center:** THE T-SCHEMA: **"P" is true iff P**.
  *   **Right:** OUT OF SCOPE (Tarski, Liar, Math).
  *   **Bottom:** The Norm Problem (Why not lie?).

  This structure respects their intelligence, uses your strongest intuition, and keeps the metaphysics light while keeping the logic sharp. Good luck.
