answer: |-
  In one respect it understands the stream,
  For light obeys the silvered surface law,
  And every ripple finds a perfect home
  Within the glass that holds the water's form.

  In one respect it does not know the stream,
  Since dryness keeps the wetness at a distance,
  No drop adheres to cold and polished depth,
  The image passes through without a trace.

  In one respect it both does and does not,
  As sequence shows the water moving on
  While stillness keeps the mirror fixed in place,
  Two truths occupy the same thin plane.

  In one respect it is unspeakable,
  For language breaks upon the edge of sight,
  Where reflection meets the source and neither wins,
  The name dissolves before the thing is named.

  In one respect it is; unspeakable,
  Since presence fills the glass with living light,
  Yet what that light implies remains concealed,
  A solid truth that speech cannot hold fast.

  In one respect it is not; unspeakable,
  Because the void behind the silvering
  Refuses wetness yet defines the shape,
  A lack so deep it silences the tongue.

  In one respect is, is not, unspeakable,
  The river flows within the static frame,
  And dryness wets the air without a drop,
  The question hangs where answer should reside.
