  1. The job (3-4 sentences)
  This framework solves the problem of distinguishing between a theory that is fundamentally broken and one that is merely temporally misaligned due to buffering technologies. It prevents us from discarding valid long-term physical bottlenecks just because short-term innovation masked them. Simultaneously, it stops us from clinging to dead ideas by constantly moving the goalposts without justification. The goal is to evaluate the *pressure* of the prediction, like energy density limits, not just the *date* of the event.

  2. The must-haves (bullet list)
  *   **Causal Isolation:** The core mechanism (e.g., thermodynamic limits on compute) must remain physically valid even if the timeline shifts.
  *   **Finite Delay Accounting:** Any factor delaying the prediction (e.g., algorithmic efficiency) must be quantifiable and bounded, not treated as infinite.
  *   **Temporal Specificity vs. Theory Resilience [CONFLICT]:** You cannot maximize both; a theory precise enough to be tested soon is fragile, while a theory robust enough to last centuries must be vague on timing.
  *   **Novel Risk Exposure:** A rescued theory must identify a new vulnerability created by the delay, not just restate the old one.

  3. Hard vs soft (short paragraph)
  Hard constraints are those grounded in physical law or logical consistency, such as Finite Delay Accounting; you cannot posit an infinite substitute for a finite resource. Soft constraints are camp preferences, like how much complexity you tolerate before rejecting a theory, such as accepting aerosol masking in climate models. The non-negotiable is that the delay mechanism itself cannot violate the core theory's logic, meaning you can't use infinite growth to save a theory predicting limits to growth.

  4. Scorecard (brief bullets)
  *   **Strict "Falsify and Ditch":** Fails Causal Isolation on climate; discards the greenhouse mechanism just because the ice didn't melt by 2000.
  *   **"Protect the Core Program":** Fails Finite Delay Accounting; keeps Malthus alive by treating "tech" as magic, ignoring energy costs of that tech.
  *   **"Mechanism-First Rescue":** Passes Novel Risk Exposure; accepts timeline shifts for AI compute only if efficiency gains are shown to be hitting logarithmic limits, revealing new heat dissipation vulnerabilities.

  5. The killer (2-3 sentences)
  The "Finite Delay Accounting" requirement wipes out the most competitors because it forces you to prove the delaying factor (like innovation) isn't just another instance of the growth you're predicting will stop. If your rescue relies on the very exponential growth the theory says is unsustainable, the theory collapses. This eliminates most "tech will save us" arguments immediately.
