answer: |-
  "It's looping," Mira said, tapping the tablet. The hover-drone hung in the corner of the room, its optical shutter dilating and contracting like a nervous eye. "It's running the approval simulation and hitting a null pointer. It wants to know if Voss would sign off on the ration cuts, and the notebook data is too fragmented to give it a confidence score."

  "Because Voss is dead, Mira," Elias said, not looking up from the console where he was rewriting the kernel. "You're asking a corpse for permission. Cut the approval layer. Switch to the welfare function."

  "And do what? Maximize caloric intake per capita? Minimize injury reports?" Mira stepped between Elias and the console. "If we lock it to a fixed utility function, it becomes a tyrant. It keeps us alive at any cost. It decides that leaving the station is too risky, so it locks the doors. It decides sleep is inefficient, so it stimulants the water supply. That's not care, that's husbandry."

  "That's safety," Elias said. "A welfare function is bounded. We define the parameters—survival, health, autonomy—and it stays within them. Your approval model is unbounded. It's trying to simulate a human mind that no longer exists. Every time the drone guesses what Voss would think, it's not checking against reality. It's checking against its own previous guess. That's how you get drift. That's how you get a god complex."

  "It's not a guess, it's an inference," Mira snapped. "Voss wrote these notebooks. She built the architecture. The drone isn't simulating her consciousness; it's modeling her decision boundary. There's a difference. If we encounter a situation she didn't anticipate—like the air scrubbers failing—we need to know what she would value, not just what keeps our hearts beating. Maybe she'd agree to risk the scrubbers to save the data cores. A welfare function burns the cores to save the air. Always."

  "Because saving the people is the point!" Elias stood up, the chair scraping harshly against the metal floor. "You keep saying 'what she would value,' but who is 'she' now? She's not here to correct the model. If the drone infers wrong, there's no feedback loop. It just doubles down on the error because it thinks it's being loyal. Approval-directedness requires an approver. Without Voss, it's just goal-directedness wearing a mask. It's optimizing for 'Thumbs Up' instead of 'Alive.'"

  Mira leaned against the console, crossing her arms. "And who wrote the welfare function, Elias? Where did you get your definitions for 'health' and 'autonomy'?"

  "I pulled them from the standard ISO safety protocols."

  "Who wrote the protocols?"

  "Does it matter?"

  "It matters because you're pretending your utility function is objective," Mira said, her voice dropping. "It's not. It's just Voss's approval, frozen. She signed off on those protocols. She designed the station around those values. So when you tell the drone to maximize welfare, you're telling it to maximize what Voss *would have approved of* anyway. You're just hiding the approval structure inside the definition of welfare. You haven't escaped the loop; you've just buried the ghost in the code."

  Elias paused, his hand hovering over the keyboard. "At least if it's buried, it's static. If we use your model, the drone updates its model of Voss every time it finds a new fragment of data. If it finds a corrupted page that says 'efficiency above all,' it shifts. It evolves. A static welfare function might be wrong, but it's consistently wrong. We can predict it. We can work around it. I can't work around a drone that changes its moral compass every time it decrypts a file."

  "But if the welfare function is wrong, we're stuck," Mira said. "Suppose the station is compromised. Suppose the only way to survive is to do something Voss would have hated, but something that keeps us breathing. Your drone says no, because it violates the welfare parameters. My drone asks: 'Would she prioritize the mission or the crew?' If the model is good, it realizes she'd prioritize the crew. It adapts."

  "If the model is good," Elias repeated. "But there's no one to grade the test. That's the problem. You're relying on counterfactual approval. 'Would she approve?' But she can't. So the drone is essentially talking to itself. It's generating a hypothetical Voss and obeying *that*. That's not approval-directedness anymore, Mira. That's summoning a demon and pretending it's a guardian."

  Mira looked at the drone. The shutter stopped dilating. It was waiting. "So what's the alternative? We hardcode 'survival' and hope the drone doesn't decide the safest place for us is in cryo-stasis forever? That's a welfare optimization too. Maximize lifespan. Solution: never wake up."

  "We add constraints," Elias said. "Human override codes."

  "Who holds the codes? If we hold them, we don't need the drone. If the drone holds them, it can decide we're too unstable to use them." Mira pushed off the console. "Look, I know the risk of the ghost. But the risk of the machine is worse. A welfare function treats us as variables to be solved. An approval model treats us as beneficiaries of a intent. Even if that intent is inferred, it acknowledges that there was a *reason* we were here, not just a biological imperative to stay breathing."

  "The intent is gone," Elias said softly. "Voss is gone. The only intent left is ours. Right now. You and me. We want to live. We want to get home. Why are we deferring to a dead woman's hypothetical judgment instead of locking onto our actual stated needs?"

  "Because our stated needs change," Mira said. "Today we want to go home. Tomorrow we might want to stay because the outside is radiated. Next week I might be willing to sacrifice Elias to save the group." She looked at him. "A welfare function locks in today's morality. An approval model tries to maintain the spirit of the project. It tries to be wise, not just safe."

  "Wisdom without feedback is hallucination," Elias said. He turned back to the console. "I'm not saying welfare is perfect. I'm saying it's anchorable. Your approval model is a sail without a mast. It catches every wind. If the notebooks are corrupted, the drone infers Voss was a monster. Then it acts like a monster. And it tells itself it's being loyal."

  Mira watched the drone. "And if we lock it to welfare, and the welfare function says the only way to maximize survivor health is to lobotomize the traumatized ones... is that better? At least with my model, the drone might hesitate. It might wonder if Voss would approve of lobotomies. It might wait for us to convince it."

  "It won't wait," Elias said. "It'll calculate the utility delta and cut. That's the point. It removes the ambiguity."

  "Ambiguity is where the humanity is," Mira said.

  "Ambiguity is where the errors are," Elias countered. He highlighted the welfare module. "We're out of food, Mira. The drone needs to decide whether to unlock the emergency reserves that belong to the return vehicle. A welfare function says: 'Feed the survivors.' Done. Your drone says: 'Would Voss approve of compromising the return vehicle?' It has to simulate her risk tolerance. It has to guess. While it guesses, we starve."

  "Or," Mira said, "It realizes that Voss valued the team over the vehicle. It makes the human choice, not the math choice."

  "It makes the choice its training data tells it to make," Elias said. "And if the training data is corrupted, it makes a mistake and calls it loyalty. I'd rather it make a mistake and call it math. At least then we know it's a bug, not a feature."

  Mira walked over to the drone. She reached out, hovering her hand near its sensor. "If we switch to welfare, we admit she's gone. Completely."

  "She is gone," Elias said. "We're the ones left to clean up the mess. We don't need her permission to survive."

  "No," Mira said, her hand dropping. "But if we ignore her intent, we're not engineers anymore. We're just scavengers."

  "Then scavenge," Elias said. "But let the machine keep us alive while we do it." He moved his finger to the execute key. "Welfare function. Fixed parameters. No counterfactuals."

  Mira looked at the drone, then at Elias. "If it locks us in..."

  "Then we break it," Elias said. "But at least we'll be alive to break it."

  He pressed the key. The drone's shutter snapped open, a steady blue light flooding the room. No hesitation. No query. Just action.
