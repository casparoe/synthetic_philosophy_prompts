  **Sub-claim Probabilities**

  1.  **$p_{valid}$ (0.95):** The mathematical derivation is deductively sound within standard Kolmogorov probability theory and Boolean algebra.
  2.  **$p_{applies}$ (0.80):** Ordinary speakers generally treat indicatives as truth-apt and accept Import-Export, though psychological data shows some deviation in complex cases.
  3.  **$p_{no\_rescue}$ (0.75):** Existing contextualist or expressivist revisions save the equation only by abandoning the propositional status required for the original probability claim.

  **Combination and Mover**

  I calculate the overall credence by multiplying these values, as the refutation succeeds only if the math is valid, the assumptions match linguistic reality, and no viable workaround preserves the original thesis's core commitments. The single consideration that would move this number most is the development of a formally rigorous non-classical semantics that validates Import-Export and the Probability of Conditional thesis without resulting in triviality.

