  2. This argues philosophical tools cannot solve empirical problems, which is actually defensible since armchair reasoning cannot generate data. Weinberg was reaching for this when complaining philosophers lack technical training, yet it still allows philosophy to clarify what a measurement actually is without doing the measuring.

  3. This suggests science absorbed all valuable philosophical questions, which is actually defensible given physics split from natural philosophy. Hawking declared philosophy dead based on this view, but it leaves no room for current conceptual cleanup because any useful task is already defined as physics.

  4. This posits philosophy is merely science in its infancy, which is tautological if you define all valid inquiry as science. Your friend implied this by treating physics as the only mature knowledge, and it excludes conceptual cleanup because those problems would simply be reclassified as unfinished physics.

  5. This reduces philosophy to a museum for outdated ideas, which is flat wrong because it ignores ongoing work in logic and information theory. This version treats the Weinberg and Hawking quotes as final verdicts, leaving no room for conceptual cleanup since history cannot fix modern measurement problems.
