answer: |-
  You're not missing anything obvious at all. In fact, you've basically reinvented one of the main proposed solutions to the Problem of Old Evidence. What you're describing is often called the **counterfactual strategy** or the **ur-prior approach**.

  You're right that if you reconstruct a prior state ($K^*$) where you didn't know $E$, you can get a likelihood ratio that isn't 1, and $H$ gets a confirmation boost. Philosophers of science like Daniel Garber and Richard Jeffrey have argued for versions of this.

  However, here's why most Bayesians don't just accept that move and call it a day. It's not really a "metaphysical hangup" about revising the past; it's a set of technical and formal headaches that come with it.

  **1. The "Ur-Prior" is Arbitrary**
  The biggest issue is: How do you construct $K^*$? There isn't one unique way to "un-know" evidence. Do you strip away just the fact that $E$ is true? Do you also strip away your knowledge that $H$ entails $E$? Do you keep your background physics but remove the specific measurement?
  Different ways of reconstructing that counterfactual past yield different confirmation values. If the amount of confirmation $H$ gets depends on how you choose to imagine your own ignorance, then confirmation becomes subjective in a way that feels kind of shaky. It makes the math less about the evidence and more about how you tell the story of your own epistemic history.

  **2. Logical Omniscience**
  Standard Bayesianism assumes "logical omniscience." That means if $H$ logically entails $E$, a rational agent is supposed to know that immediately. In the standard model, $P(E|H)$ *must* be 1 because the connection is logical, not empirical.
  To make your counterfactual move work, you have to assume the agent was *logically ignorant* in the past (they didn't realize $H$ implied $E$). But once you allow agents to be ignorant of logic, you break the standard probability axioms. You're no longer doing standard Bayesian updating; you're building a new model of "bounded rationality." That's a huge theoretical cost.

  **3. What Are We Actually Learning?**
  The real intuition behind the Mercury/GR case isn't that we are learning $E$ (the orbit data) again. We knew that forever. The "aha!" moment was learning the **logical connection** between $H$ and $E$.
  The counterfactual strategy tries to model this as if we are learning $E$ for the first time. But that's a fiction. A better model would track the probability of the statement "$H$ entails $E$," not the probability of $E$ itself. But standard Bayesianism doesn't have a clean way to update on logical relationships, only on empirical events.

  **4. It's Not a Pseudoproblem, It's a Boundary Marker**
  You suggested this is just confusing diachronic coherence with rationality. I'd push back slightly: The problem highlights a genuine gap between **idealized rationality** (perfect logicians who never learn anything new about math) and **human rationality** (we figure out implications over time).
  If Bayesians just say "use $K^*$," they are admitting that standard conditionalization fails for real humans. That's a big concession. It forces them to choose: stick with the clean math that doesn't match history (standard Bayes) or adopt messy counterfactuals that match history but lose formal rigor (your solution).

  **The Verdict**
  You aren't wrong that the counterfactual move restores the intuition that GR was confirmed by Mercury's orbit. Most modern Bayesians actually agree with you that *some* version of this is necessary to make the theory match scientific practice.

  But they don't treat it as a trivial fix because it requires abandoning the strict rules of conditionalization and dealing with the subjectivity of reconstructing the past. So, it's not a metaphysical hangup; it's a "be careful what you break" warning. You solve the old evidence problem, but you might break the formal simplicity that made Bayesianism attractive in the first place.
