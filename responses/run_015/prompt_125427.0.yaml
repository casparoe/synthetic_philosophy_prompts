answer: |-
  The persistence of the term "copycat" in contemporary art and design evaluation is a linguistic artifact surviving past its ontological expiration date. In the analog era, the concept of copying relied on a stable triangular relationship: an agent, a source, and a product. If the product resembled the source, and the agent had access to the source, the causal chain was presumed to be one of transcription. Today, generative tools have inserted a probabilistic engine into that chain, fracturing the relationship between access, intent, and resemblance.

  By continuing to categorize direct mimetic reproduction, procedural derivation, and stylistic convergence under the single predicate of "derivative" or "copycat" work, educational institutions are maintaining a conceptual unity that no longer exists. This unity survives only because the domain of evaluation remains small enough for human intuition to paper over the logical cracks. A professor can "sense" the difference between a traced image and a model output, but the rubric language treats them as the same sin. This is a category error. To treat procedural derivation as conceptually identical to intentional plagiarism is to collapse the causal history of a form into its semantic resemblance, committing to a metaphysics of authorship that polices outcomes while pretending to police intentions.

  ### The Shift in Conceptual Architecture

  To understand the mistake, we must reconstruct the implicit architecture of the "copycat" predicate. In the analog context, "copying" is a transitive verb describing a specific action taken by an agent. It requires *selection*. A student chooses a specific image and chooses to replicate it. The moral weight lies in the deception regarding the origin of the labor. The evaluation metric is secondary; the primary violation is the misrepresentation of the causal chain.

  In the generative context, the predicate shifts from describing an action to describing a state of being. When a rubric warns against "derivative work" produced by AI, it is no longer strictly asking, "Did you trace this?" It is asking, "Does this output occupy a region of visual space that is too densely populated by your training data?"

  This is where the slippage occurs. The rubric retains the moral language of theft ("copycat," "plagiarism") but applies it to a mathematical phenomenon (statistical regression).
  1.  **Direct Reproduction:** The student uses a tool to replicate a specific instance (e.g., img2img with low noise). The causal history is intact: Source → Tool → Output. This fits the traditional definition of copying.
  2.  **Procedural Derivation:** The student prompts a model, and the model outputs a form that statistically resembles the average of thousands of training images without matching any single one. The causal history is diffuse: Corpus → Model Weights → Output. There is no specific victim, only a generalized borrowing of distribution.
  3.  **Stylistic Convergence:** The student and the model (or another student) arrive at similar visual solutions due to shared constraints, trends, or prompt vocabulary. The causal history is parallel, not transitive.

  By labeling all three as "copycat" behavior, the evaluation framework assumes that *semantic resemblance* is a sufficient proxy for *causal theft*. It assumes that if an image looks like it belongs to the corpus, it must have been stolen from the corpus. This ignores the possibility that an image can resemble the corpus precisely because the tool was designed to navigate the corpus's latent space.

  ### The Distinctiveness of Procedural Derivation

  Procedural derivation must be recognized as conceptually distinct because it occupies a middle ground that traditional authorship models cannot map. It is not intentional plagiarism, because there is no intent to appropriate a specific pre-existing work. The student may genuinely believe they are generating something new, unaware that the "newness" is constrained by the model's statistical gravity.

  However, it is also not independent convergence. In true convergence, two creators arrive at a similar solution because the problem space dictates a limited set of optimal solutions (e.g., two designers creating similar logos for a tech company because blue circles signify trust). In procedural derivation, the similarity is not dictated by the problem, but by the *tool's prior consumption of solutions*.

  When we label procedural derivation as "copycat" work, we are implicitly arguing that using a tool which averages cultural production is itself a form of cheating. This is a metaphysical claim, not a pedagogical one. It asserts that authorship requires a causal link to a human mind that is unmediated by statistical aggregation. If we accept this, then the tool itself is the plagiarist, and the student is merely the accomplice. But if we reject this, and view the tool as a legitimate medium, then procedural derivation is simply the *normal operation* of the medium. To punish it as "copying" is to punish the medium for functioning as designed.

  ### The Failure of Uniform Policy

  A uniform plagiarism policy that relies on visual similarity to detect "copycat" behavior inevitably fails because it cannot distinguish between these three categories without investigating causal history. This leads to a dual failure of justice: over-punishment and under-punishment.

  **Over-punishment of Statistical Resemblance:**
  If the policy focuses on outcome (resemblance to existing work), it will flag procedural derivation as plagiarism. A student who uses generative tools to explore a common aesthetic style may produce work that is statistically indistinguishable from the training data. Under a uniform policy, this student is penalized for "derivative" work, even if their intent was exploratory and their process involved significant curation and refinement. They are being punished for the tool's inability to be truly random, not for their own lack of originality. This chills legitimate experimentation with the technology.

  **Under-punishment of Direct Tracing:**
  Conversely, if the policy focuses on outcome, it may miss direct reproduction if the student obfuscates the source. A student can take a specific copyrighted image, run it through a high-noise generation process, and alter it enough that it no longer statistically matches the source closely, even though the causal intent was to replicate that specific image. Because the "resemblance" metric is now blurred by the noise of the generation process, the direct theft escapes detection. The uniform policy fails here because it is looking for the *shadow* of copying (similarity) rather than the *act* of copying (appropriation).

  ### Policing Outcomes vs. Policing Intentions

  This brings us to the core ethical hazard: without a specific taxonomy, we are effectively policing outcomes while pretending to police intentions.

  Academic integrity policies are fundamentally about intent. They exist to stop students from claiming labor they did not perform. When a rubric says "do not submit copycat work," it implies "do not claim another's labor as your own." But in the generative context, "similarity to training data" is not evidence of "claiming another's labor." It is evidence of "using a model trained on data."

  By conflating these, the institution creates a system where a student can be found guilty of dishonesty based solely on the topological position of their image in visual space, regardless of their actual workflow. This shifts the burden of proof from the *process* (show your sketches, show your layers, show your prompts) to the *product* (this looks too familiar).

  This is unsustainable. It forces evaluators to act as forensic data scientists, guessing whether a visual similarity is the result of theft, tool use, or coincidence. It creates a "guilty until proven novel" standard that is impossible to meet when the tool is designed to produce the familiar.

  ### Toward a Domain-Specific Taxonomy

  To resolve this conceptual instability, the microdomain of creative evaluation must abandon the fluid, catch-all concept of "derivative" and adopt a tripartite taxonomy that aligns with the new causal realities:

  1.  **Reproduction (Theft of Instance):** This covers direct mimetic reproduction. The evaluation criterion here is *fidelity to a specific source*. The moral violation is deception regarding the origin of a specific asset. Policy response: Strict prohibition unless cited as reference material.
  2.  **Derivation (Theft of Distribution):** This covers procedural derivation. The evaluation criterion is *reliance on statistical averaging*. The moral question is not theft, but *competency*. Did the student merely accept the average, or did they curate/modify the output? Policy response: Not plagiarism, but potentially a failure of skill or critical engagement. It should be graded on the degree of human intervention, not banned as fraud.
  3.  **Convergence (Independence):** This covers stylistic overlap. The evaluation criterion is *causal independence*. The moral status is neutral. Policy response: No penalty.

  By distinguishing these, we stop treating the statistical nature of the tool as a moral failing. We acknowledge that "Derivation" is a distinct ontological category: it is work that is causally linked to the corpus but not instance-linked to a specific author.

  ### Conclusion

  The survival of the unified "copycat" predicate is a symptom of a domain that has not yet updated its ontology to match its technology. It survives because the scale is small; professors can still use human intuition to distinguish a trace from a generation. But intuition is not a policy. Continuing to conflate reproduction, derivation, and convergence forces us into a metaphysics where authorship is defined by visual uniqueness rather than causal agency. It compels institutions to police the statistical properties of images rather than the integrity of the students. Recognizing procedural derivation as a distinct category is not just a semantic refinement; it is a necessary step to prevent the concept of originality from collapsing entirely under the weight of tools designed to replicate it. We must judge the hand that guides the tool, not just the shadow the tool casts.
