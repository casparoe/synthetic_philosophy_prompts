      *   **Reconstructing the Architecture (The Shift):** How did we get here?
          *   Analog: Copying is a *transitive verb* requiring an agent. A copies B.
          *   Generative: Copying becomes an *intransitive property* of the image. Image A is "copy-like" relative to Corpus C.
          *   The Slippage: We are judging the *image's relationship to data* rather than the *student's relationship to the image*.
