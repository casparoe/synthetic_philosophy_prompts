      *   *Charitable Donation vs. Cash:* Does swapping cash for charity fix it? No. It's still an external benefit (warm glow, prestige, fulfilling a desire to donate). It's still a WKR. It might look nicer, but the structural incentive remains.
      *   *Assessing Genuineness:* Can a committee assess this? No. WKR highlights that the reason for the action (the prize) is distinct from the right-making features of the action (compassion). If the prize is the reason, the action lacks the right-making feature. Since committees can't read minds, they can't distinguish WKR-driven acts from right-kind-driven acts.
      *   *Educational Impact:* For 9th graders, this teaches transactional morality. It reinforces the idea that kindness is only worth doing if recognized/rewarded.

