  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** 9th-grade social studies teacher, on a committee for a "Compassion Cup" (kindness competition with rewards).
      *   **Problem:** The user identifies a philosophical issue called the "wrong kind of reasons" (WKR) problem. They understand the basics (external incentives vs. intrinsic value).
