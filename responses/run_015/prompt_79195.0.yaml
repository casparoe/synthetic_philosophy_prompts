  2.  **Deconstruct the "Wrong Kind of Reasons" (WKR) Problem in this Context:**
      *   *The Core Issue:* WKR distinguishes between reasons to *have* an attitude (e.g., believe, admire, be kind) and reasons that count in favor of the *content* of that attitude (e.g., evidence for truth, features making someone admirable, moral worth of kindness).
      *   *Application to Compassion Cup:* The prize (donation + plaque) provides a *wrong kind of reason* to be kind. It gives students a reason to *appear* kind or to *act* kindly for the sake of the reward, but it doesn't make the acts themselves morally worthy or compassionate in the intrinsic sense.
      *   *Implication:* The competition structure inherently undermines the virtue it seeks to promote because it shifts the motivation from intrinsic (care for others) to extrinsic (reward/recognition).

  3.  **Drafting the Bottom Line:**
      *   Needs to be direct and actionable.
      *   *Draft 1:* You should cancel the Compassion Cup because it corrupts the virtue of kindness. (Too extreme? Maybe.)
      *   *Draft 2:* The WKR problem implies that you cannot reliably judge "genuine" kindness in a competitive framework because the prize itself corrupts the motivation behind the acts. (Better.)
      *   *Draft 3:* The Compassion Cup is structurally self-defeating because the external rewards provide the wrong kind of reason for kindness, inevitably crowding out the intrinsic moral value you aim to recognize. (Strong.)
      *   *Refining for the prompt:* The prompt asks for implications on *how to run it* (judging, timing, etc.). So the bottom line should address whether it *can* be run successfully under these constraints.
