      *   *The Conclusion:* Does he say translation is impossible? No. He says *perfect* translation (in the sense of a mirror image) is impossible, but *successful* translation (in the sense of carrying the soul across) is the goal. He advocates for "translation" (a term he sometimes plays with) or deep recreation. He definitely does *not* advocate giving up and just writing "inspired by" pieces without claiming translation status, unless the constraints are truly untranslatable, in which case he explores *why*.
