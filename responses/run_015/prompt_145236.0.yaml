      *   *What is Hofstadter's core philosophy?* He is a proponent of "translation as recreation." He believes in the "soul" of the text. He is *not* a pessimist about translation; he is an enthusiast. He believes translation is *hard*, incredibly hard, but essential and possible.
      *   *Key Concept:* "Faithfulness." For Hofstadter, faithfulness isn't literal word-for-word accuracy. It's faithfulness to the *effect*, the *spirit*, the *constraints* the original author set for themselves.
