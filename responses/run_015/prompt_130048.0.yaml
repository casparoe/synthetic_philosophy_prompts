      **Project Title:** Non-Human Protagonists: Distinguishing Causal Weight from Agency in Historical Narrative

      **Research Question**
      When historians state that "the plague reshaped feudal labor" or "Tambora caused the Frankenstein summer," are they identifying a cause with heavy explanatory weight, or are they implicitly granting the non-human entity agential status? This project asks whether we can sustain a distinction between **causal protagonism** (where an event is narratively necessary and radically constrains human options) and **agential protagonism** (where an event functions grammatically and conceptually as an actor with interests or goals).

      **The Problem**
      Current debates around enviromental determinism often stall because both critics and proponents conflate these two forms of protagonism. Determinists argue that non-human forces drive history, often using agential language to describe causal mechanisms. Humanists argue that granting nature "agency" undermines human responsibility, yet they often accept the causal weight while rejecting the grammar. Neither side adequately separates the structural necessity of an event from the attribution of intentionality. This conflation leaves historians without a precise vocabulary to discuss non-human impact without falling into metaphysical confusion.

      **Methodology**
      Over three months, I will conduct a conceptual analysis of historical narratives centered on four specific cases:
      1.  The Black Death and the collapse of feudalism.
      2.  The 1816 Tambora eruption and Shelley's summer at Geneva.
      3.  The 536 AD volcanic winter and late antique transformation.
      4.  19th-century cholera outbreaks and urban sanitation reform.

      For each case, I will map how leading historical texts describe the non-human factor. Is the volcano a backdrop that enables human drama, or a character that dictates the plot? I will develop a small classification tree—a decision tool for historians—to help identify when agential language is merely metaphorical shorthand for complex causality versus when it implies ontological agency.

      **Success and Failure Conditions**
      **Success** looks like a working distinction that allows historians to acknowledge the massive causal power of non-human forces without committing to the claim that nature "acts" with purpose. The output will be a short framework paper and the classification tool.
      **Failure** looks like the distinction collapsing into semantics. If "causal protagonism" proves indistinguishable from "agential protagonism" in practice, or if the classification tree proves too cumbersome for actual historical explanation, the project will have identified a limit to our current philosophical vocabulary rather than solving it.

      **Scope and Feasibility**
      This project is designed for a three-month part-time timeline. It does not involve new archival research or re-evaluating the historical accuracy of the four cases. Instead, it focuses strictly on the *language* and *narrative structure* of existing secondary literature. While four cases is ambitious for a part-time schedule, the focus is narrow (philosophical categorization rather than historical reconstruction), making the deliverable achievable within the grant period.

