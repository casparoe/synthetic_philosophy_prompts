  # Anthropics Reading Group: Diagnostic Decision Tree

  **Instructions:** Start at the root. Answer each question based on your intuitive judgment of the case described, not based on which label you want to end up with. Follow the branches until you reach a leaf.

  ### **Node 1: The Sleeping Beauty Waking**
  You are Sleeping Beauty. A fair coin is tossed. If Heads, you are woken once (Monday). If Tails, you are woken twice (Monday and Tuesday), with memory wiped between wakings. You wake up. You know the protocol.
  **What is your credence that the coin landed Heads?**
  *   **(A) 1/2** $\rightarrow$ Go to Node 2.
  *   **(B) 1/3** $\rightarrow$ Go to Node 5.

  ---

  ### **Node 2: The Monday Update (Halfer Branch)**
  You are still in the experiment (Credence 1/2). You are now told: "It is Monday."
  **Does your credence in Heads update to 2/3, or stay at 1/2?**
  *   **(A) Stays at 1/2** $\rightarrow$ Go to Node 3.
  *   **(B) Updates to 2/3** $\rightarrow$ Go to Node 4.

  ### **Node 3: The Doomsday Check (Double-Halfer Path)**
  You hold Credence 1/2 even after learning it is Monday. Consider the Doomsday Argument: knowing you are among the first 10% of all humans who will ever live.
  **Does this birth-rank information significantly lower the probability that humanity survives for millions of years?**
  *   **(A) Yes** $\rightarrow$ **Leaf: Double-Halfer**
  *   **(B) No** $\rightarrow$ Go to Node 11 (Unnamed).

  ### **Node 4: The Reference Class Scope (SSA Path)**
  You update to 2/3 on Monday. You generally accept the Doomsday Argument. Consider your "reference class" for sampling.
  **If a perfect mental duplicate of you exists on Mars (same memories, same brain state), are they in the same reference class as you for anthropic reasoning?**
  *   **(A) Yes** $\rightarrow$ Go to Node 9.
  *   **(B) No** $\rightarrow$ **Leaf: SSA**

  ### **Node 5: The Presumptuous Philosopher (Thirder Branch)**
  You hold Credence 1/3 on waking. Consider two theories of the universe: T1 predicts 1 trillion observers; T2 predicts 1 trillion trillion. Prior to observation, they are equally likely physically.
  **Does the fact that you exist make T2 vastly more likely than T1 *before* you observe any specific data?**
  *   **(A) Yes** $\rightarrow$ Go to Node 6.
  *   **(B) No** $\rightarrow$ Go to Node 7.

  ### **Node 6: The Physical Constants Filter (SIA Path)**
  You believe T2 is more likely because it has more observers.
  **Do you include observers in universes with radically different physical constants (e.g., no carbon) in the count that boosts T2's probability?**
  *   **(A) Yes** $\rightarrow$ **Leaf: SIA**
  *   **(B) No** $\rightarrow$ Go to Node 10 (Unnamed).

  ### **Node 7: The Nature of Evidence (FNIC Path)**
  You reject that T2 is more likely just because it has more observers. You condition on existence.
  **Is your evidence "I exist" (indexical) or "Someone with my evidence exists" (non-indexical)?**
  *   **(A) Someone exists** $\rightarrow$ **Leaf: FNIC**
  *   **(B) I exist** $\rightarrow$ Go to Node 8.

  ### **Node 8: The Indexical Truth Check**
  You treat your evidence as "I exist." You rejected the Presumptuous Philosopher boost.
  **Do you believe propositions like "I am in Universe T1" can be true for you but false for a duplicate of you?**
  *   **(A) Yes** $\rightarrow$ Go to Node 12 (Unnamed).
  *   **(B) No** $\rightarrow$ **Leaf: FNIC** (Note: If you answered 7B and 8B, you are consistent FNIC).

  ### **Node 9: The Clone Probability (SSA Refinement)**
  You include mental duplicates in your reference class. A clone of you is created.
  **Is the probability that you are the original (vs the clone) 1/2?**
  *   **(A) Yes** $\rightarrow$ **Leaf: SSA**
  *   **(B) No** $\rightarrow$ **Leaf: Unnamed** (Inconsistent SSA).

  ### **Node 10: The Restricted SIA**
  You accept the Presumptuous Philosopher boost but only for observers in "your" type of universe.
  **Does this restriction rely on a physical boundary or an epistemic one?**
  *   **(A) Physical** $\rightarrow$ **Leaf: Unnamed** (Ad-hoc SIA).
  *   **(B) Epistemic** $\rightarrow$ **Leaf: Unnamed** (Collapses to SSA).

  ### **Node 11: The Halfer Anomaly**
  You are a Double-Halfer (Node 3) but reject Doomsday.
  **Do you think anthropic reasoning applies to cosmology at all?**
  *   **(A) Yes** $\rightarrow$ **Leaf: Unnamed** (Inconsistent Halfer).
  *   **(B) No** $\rightarrow$ **Leaf: Unnamed** (Local Halfer).

  ### **Node 12: The Thirder Anomaly**
  You accept indexical truths but reject the PP boost.
  **Do you update on "I was woken" or "A waking occurred"?**
  *   **(A) I was woken** $\rightarrow$ **Leaf: Unnamed** (Unstable Thirder).
  *   **(B) A waking occurred** $\rightarrow$ **Leaf: FNIC** (Re-routed to FNIC).

  ---

  ### **The Four Named Leaves: The Price of Admission**

  1.  **SSA (Self-Sampling Assumption):** You must bite the bullet that **the Doomsday Argument is sound**, implying humanity is likely to go extinct much sooner than physical models suggest.
  2.  **SIA (Self-Indication Assumption):** You must bite the bullet that **the Presumptuous Philosopher is correct**, meaning we should be overwhelmingly confident we live in a physically vast universe simply because it contains more observers.
  3.  **Double-Halfer:** You must bite the bullet that **standard conditionalization fails**, requiring you to ignore the evidence that "today is Monday" when updating your belief about the coin.
  4.  **FNIC (Full Non-Indexical Conditioning):** You must bite the bullet that **indexical facts are not fundamental**, forcing you to treat "I am here" as equivalent to "Someone is here" for all probabilistic reasoning.

  ### **Note on Indistinguishability**
  **Leaf FNIC vs. Leaf SIA:** In many practical cases (like Sleeping Beauty), FNIC and SIA yield identical probabilities (1/3). They are only distinguishable at **Node 5** and **Node 7**. If a student answers "Yes" to Node 5 (PP Boost) but "Someone exists" at Node 7, they land in **Unnamed**. This gap exists because SIA fundamentally relies on the indexical weight of "I am a random observer," while FNIC relies on the non-indexical weight of "An observer exists." If a student claims both, they are likely conflating the *mechanism* of SIA with the *outcome* of FNIC.

  **Leaf SSA vs. Leaf Double-Halfer:** These are cleanly separated by **Node 2**. However, if a Double-Halfer answers "Yes" to Node 3 (Doomsday) but "No" to Node 9 (Clone Probability), they become **Unnamed**. This suggests an incoherent reference class: they sample from humans for Doomsday but not from duplicates for cloning, which lacks a unified metaphysical principle.
