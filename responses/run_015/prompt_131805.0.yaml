prompt: |-
  I'm running a workshop on pseudohistory and demarcation — Atlantis, ancient aliens, Fomenko's new chronology, the usual suspects — and one of my grad students keeps falling back on 'absence of evidence isn't evidence of absence' every time I push on her favorite reconstruction. Last session she used it specifically when I noted that Fomenko's shadow dynasty has not just zero matching inscriptions, but also no trace in the dendrochronology records I showed the class; she said the tree-ring silence doesn't prove he's wrong. I want to bring a disambiguation to next weeks meeting and show her why the slogan doesn't automatically save the case. Can you lay out the different precise claims hiding inside that line? Like, is it a logical point about the fallacy of arguing from ignorance? An epistemic claim about priors? A methodological rule that all negative archaeological results are inconclusive? For each reading, tell me if it's trivially true, defensible, or false — and specifically say which version actually protects Fomenko-style reconstructions from missing-inscription and tree-ring objections, and which ones fall apart. I need this as a clean list I can project on the board, not a citation list or reading assignment — just the conceptual map, since half my students think repeating a slogan counts as an argument. (Also I spelled 'seperate' wrong in my notes, so don't quote that back at me please — wait, I just did. Nevermind.)
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** A workshop on pseudohistory and demarcation (Atlantis, ancient aliens, Fomenko's New Chronology, etc.).
      *   **Problem:** A grad student keeps using the slogan "absence of evidence isn't evidence of absence" to defend pseudohistorical claims (specifically Fomenko's shadow dynasties) against negative evidence (missing inscriptions, dendrochronology mismatches).
      *   **Goal:** Provide a clean, conceptual map/list for projection on a board during the next meeting.
      *   **Content:** Disambiguate the different precise claims hidden inside the slogan "absence of evidence isn't evidence of absence."
      *   **Requirements:**
          *   Identify different readings (logical, epistemic, methodological, etc.).
          *   Evaluate each reading (trivially true, defensible, or false).
          *   Specify which version protects Fomenko-style reconstructions and which ones fall apart.
          *   Format: Clean list for projection (not a citation list or reading assignment).
          *   Tone: Academic but accessible, direct, helpful for a workshop setting.
          *   Constraint: Do not quote the user's typo ("seperate") back at them (they acknowledged it themselves).

  2.  **Deconstruct the Slogan ("Absence of Evidence isn't Evidence of Absence"):**
      *   *Reading 1: Strict Logical/Formal.* In formal logic, $\neg P$ does not entail $\neg Q$ unless there's a specific conditional link. Arguing from ignorance (*argumentum ad ignorantiam*).
      *   *Reading 2: Epistemic/Probabilistic (Bayesian).* Evidence updates priors. If evidence *should* be there but isn't, the probability of the hypothesis decreases. If evidence *wouldn't* be expected, non-observation doesn't change much.
      *   *Reading 3: Methodological/Archaeological.* Negative results are inconclusive *unless* the search was exhaustive and the evidence was expected.
      *   *Reading 4: The "Get Out of Jail Free" Card (Pseudohistorical usage).* No matter how much we look, you can't prove it didn't happen.

  3.  **Evaluate Each Reading:**
      *   *Logical:* True as a formal rule (you can't deduce non-existence solely from non-observation without auxiliary premises). But trivial. Doesn't help in empirical science.
      *   *Epistemic:* False as a universal claim. Absence of evidence *is* evidence of absence if the evidence was expected. (Carl Sagan's point).
      *   *Methodological:* Defensible with caveats. Negative results require context (search effort, preservation conditions).
      *   *Pseudohistorical Defense:* False. It ignores the expectation of evidence.

  4.  **Connect to Fomenko/Case Study:**
      *   Fomenko claims massive historical events (shadow dynasties).
      *   Expectation: Such events leave traces (inscriptions, tree rings).
      *   Observation: No traces.
      *   Conclusion: This *is* evidence against Fomenko because the evidence *should* be there.
      *   Student's claim: "Tree-ring silence doesn't prove him wrong."
      *   Counter: It lowers the probability significantly because the hypothesis predicts tree-ring anomalies.

  5.  **Drafting the Content (Iterative refinement for board projection):**
      *   Need clear headings.
      *   Need status (True/False/Defensible).
      *   Need application to the specific case (Fomenko/Tree Rings).
      *   Keep it concise.

      *   *Drafting Item 1: The Logical Fallacy.*
