answer: |-
  # The Slogan Disambiguated: "Absence of Evidence ≠ Evidence of Absence"

  ### 1. The Logical Reading (Formal Validity)
  *   **The Claim:** You cannot deductively prove a universal negative ($X$ does not exist) solely from a finite set of non-observations ($I$ have not seen $X$).
  *   **Status:** **Trivially True.** (This is the *argumentum ad ignorantiam* fallacy).
  *   **Application to Fomenko:** **Irrelevant.** Historical science is not pure deduction; it is abductive/inferential. We are not claiming Fomenko is *logically impossible*, but that his model is empirically unsupported.
  *   **Does it save the reconstruction?** **No.** It sets a bar no one is trying to clear.

  ### 2. The Epistemic Reading (Bayesian Expectation)
  *   **The Claim:** Non-observation only lowers the probability of a hypothesis if the hypothesis *predicts* observation. If $H$ implies $E$, and not-$E$ occurs, $H$ is undermined.
  *   **Status:** **True.** (Absence of evidence *is* evidence of absence when evidence was expected).
  *   **Application to Fomenko:** **Damaging.** Fomenko's "shadow dynasties" imply massive societal activity. Massive activity predicts tree-ring anomalies and inscriptions. The silence of the rings is positive evidence *against* the hypothesis.
  *   **Does it save the reconstruction?** **No.** It explicitly explains why the missing data counts against him.

  ### 3. The Methodological Reading (Search Effort)
  *   **The Claim:** Negative results are inconclusive *unless* the search space was sufficiently examined and preservation conditions were favorable.
  *   **Status:** **Defensible.** (Requires context about preservation bias and search intensity).
  *   **Application to Fomenko:** **Damaging.** Dendrochronology records are continuous and global for the relevant periods. Inscription corpora are extensive. The "search" has been exhaustive enough to expect traces if the events occurred.
  *   **Does it save the reconstruction?** **No.** The conditions for a valid negative result are met.

  ### 4. The Rhetorical Reading (Immunization Strategy)
  *   **The Claim:** No amount of missing data can ever falsify a historical reconstruction; the hypothesis is insulated from negative empirical results.
  *   **Status:** **False.** (Makes the theory unfalsifiable and non-scientific).
  *   **Application to Fomenko:** **Protective (but costly).** This is how the slogan is being used in this workshop. It treats the theory as immune to archaeological reality.
  *   **Does it save the reconstruction?** **Only by removing it from science.** It preserves the narrative by sacrificing its status as a historical claim.

  ***

  **Bottom Line for Discussion:**
  The slogan is only valid under Reading 1 (Logic) and Reading 3 (Methodology caveats). It is **false** under Reading 2 (Epistemology) when evidence is expected. Using it to invoke Reading 4 (Immunization) moves the claim from history to fiction.
