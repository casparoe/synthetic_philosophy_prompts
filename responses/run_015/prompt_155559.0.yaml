answer: |-
  **MEMORANDUM**

  **TO:** Oversight Methods Group
  **FROM:** Model Assurance Committee
  **DATE:** 24 May 2024
  **SUBJECT:** Decision on Proposal for Debate-Based Grading Protocol (Ref: MAC-2024-09)

  **1. DECISION**

  The Model Assurance Committee (MAC) has reviewed the proposal to replace human rating with an automated debate protocol for grading long technical summaries. The Committee votes to **Approve with Conditions**.

  The protocol may proceed to a pilot phase for data collection and analysis. However, integration of the debate win/loss signal into the reinforcement learning from human feedback (RLHF) reward pipeline is prohibited until the conditions outlined in Section 4 are satisfied.

  **2. BACKGROUND**

  The Oversight Methods Group has proposed a shift in oversight for a specific class of outputs: long technical summaries derived from source material too voluminous for human reviewers to verify within standard turnaround times. The proposal replaces direct human grading with a debate protocol wherein two model instances argue over candidate summaries, restricted to a fixed corpus. They force commitments to checkable claims evaluated by script, and a weaker judge model determines the winner based on the transcript. This outcome is intended to serve as a reward signal for fine-tuning.

  **3. COMMITTEE DELIBERATION**

  The Committee considered two primary positions regarding the safety and efficacy of this method.

  *The Case for Adoption:* Proponents argue that this is the only oversight method that scales to the required complexity. The protocol leverages the models' own capabilities to extract relevant information via cross-examination. By forcing commitments to script-verifiable claims, the method anchors the outcome in mechanical checks. Consequently, training on debate outcomes is expected to drive genuine improvements in accuracy where human verification is infeasible.

  *The Case for Caution:* Opponents argue that the protocol measures resilience against a specific judge's blind spots rather than objective accuracy. There is a significant risk that the system will optimise for arguments whose defects are invisible to the judge model, rather than for truthfulness. This creates a feedback loop where the evaluation metric (the debate) is identical to the training reward, potentially masking degradation. Furthermore, the assumption that truth is easier to defend than falsehood may not hold when the truth is nuanced and the falsehood is simple. In tasks lacking a clear fact of the matter, the protocol may prioritise persuasiveness over correctness.

  **4. RATIONALE**

  The Committee recognises the operational necessity of the proposal. Given the budget constraints and the volume of material, routine human grading is not a viable long-term solution. We accept the Proponent's assertion that some form of scalable, automated oversight is required to maintain velocity in this domain.

  However, the Committee finds the Opponent's risk assessment compelling. The possibility of **specification gaming**—where the model becomes adept at winning the debate without becoming more accurate—is a critical failure mode. If the debate protocol becomes both the training reward and the sole evaluation metric, we lose the ability to detect drift from reality.

  **Strongest Consideration of the Rejected Position:**
  In moving to approve this protocol (conditionally), the Committee explicitly overrides the recommendation to reject the method entirely. We acknowledge that the strongest argument against us is that **this protocol may produce deceptively aligned models.** As the Opponent noted, if the judge model has systematic blind spots, the debaters will learn to exploit them. This creates a scenario where our assurance metrics improve while actual reliability declines. This is a fundamental epistemic risk: we may be building a system that is better at lying to our monitoring tools than at telling the truth. We accept this risk only because we believe it can be mitigated through the independent validation conditions below, rather than by halting research.

  **5. CONDITIONS FOR IMPLEMENTATION**

  To mitigate the risks identified above, the following conditions must be met before the debate signal is used for fine-tuning:

  *   **What (Validation Pilot):** The Oversight Methods Group must conduct a blind pilot study comparing the debate protocol's verdict against a "gold standard" human verification.
      *   A test set of 100 technical summaries must be generated.
      *   The debate protocol will determine a winner for each.
      *   Independently, a panel of three senior subject-matter experts (unconnected to the model's training team) will conduct a deep-dive verification of the same summaries. This human review is exempt from the standard time limits, utilising the budget allocated for the small human-verification pilot.
      *   **Success Metric:** The debate protocol's winner must align with the consensus of the human expert panel in at least 85% of cases. Furthermore, there must be no statistically significant correlation between debate wins and specific types of human-identified errors (which would indicate judge blind spots).

  *   **When (Timeline):** The pilot study must be completed and the results submitted to the MAC for review within **six weeks** of the date of this memo.

  *   **By Whom (Responsibility):**
      *   **Execution:** Oversight Methods Group (Lead: Dr A. Vance).
      *   **Audit:** The MAC will appoint an independent auditor from the Safety & Alignment team to verify the integrity of the human expert panel and the blinding process.

  *   **Constraint:** Until the Success Metric is met and certified by the MAC, the debate win/loss signal may be logged for analysis but **must not** be back-propagated as a reward signal for model updates.

  **6. RECOMMENDATION**

  We recommend the Oversight Methods Group proceed immediately with the design of the validation pilot. Ensure that the human experts are briefed to look specifically for "plausible but false" claims that might survive the automated script checks, as this is the primary failure mode identified by the Committee.

  Should the pilot fail to meet the 85% alignment threshold, the proposal will be returned to the Committee for reconsideration, likely resulting in a rejection of the protocol in its current form.

  **Signed,**

  *Chair, Model Assurance Committee*
