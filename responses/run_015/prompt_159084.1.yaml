answer: |-
  Your intuitions are governed by the **Causal Alignment Principle**: trust stratified estimates only when they block pre-treatment confounding without conditioning on mediators, and match the analysis granularity to the unit of intervention.

  **The Principle**
  1.  **Confounder Clause:** Condition on pre-treatment variables that causally influence both treatment assignment and outcome.
  2.  **Mediator/Collider Clause:** Do not condition on variables affected by the treatment (post-treatment) or common effects of treatment and outcome.
  3.  **Intervention Clause:** The aggregation level must match the unit at which the policy or decision is executed.
  4.  **Stability Clause:** Disregard stratification if strata sample sizes are too small to distinguish signal from noise.

  **Case Mapping**
  *   **Case 1 (Severity):** Confounder Clause. Severity is pre-treatment and drives both assignment and outcome; stratification blocks the backdoor path.
  *   **Case 2 (Job Training):** Mediator/Collider Clause. Completion is caused by attendance; conditioning on it blocks the causal path or opens collider bias, making the aggregate the valid total effect.
  *   **Case 3 (Time Ramp):** Confounder Clause. Time drives both traffic composition (treatment) and conversion (outcome); weekly stratification blocks this confounding.
  *   **Case 4 (Region/Hospital):** Intervention Clause + Stability Clause. If the policy is set at the regional level, the regional aggregate is the relevant estimand; splitting by hospital may over-control (if hospital is a mediator of region) or introduce noise.
  *   **Case 5 (Defund):** Intervention Clause. For "should this hospital use it," the unit is the hospital (trust strata); for "national numbers," the unit is the population allocation (trust aggregate).
  *   **Borderline (Small Stratum):** Stability Clause vs. Confounder Clause. This is the tension point where causal correctness fights statistical variance.

  **Prediction for a New Case**
  Consider a drug that reduces mortality in both smokers and non-smokers separately, but appears harmful overall because smokers (higher risk) were disproportionately treated. If you are deciding whether to prescribe to an individual patient, trust the stratified data (Confounder Clause). If you are deciding whether to stock the drug for a population where smoking status is unknown and unchangeable, trust the aggregate (Intervention Clause).

  **Limitations**
  This principle cannot quantitatively resolve the **Borderline Case**; it identifies the conflict (Causal Structure vs. Sample Size) but offers no formula for the bias-variance trade-off. It also cannot resolve **Case 4** definitively without a specified DAG: if Hospital is a confounder of Region, stratification is causally superior, and your gut verdict relies on the assumption that Hospital is either a mediator or too noisy.
