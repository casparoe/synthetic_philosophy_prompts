  **Scene:** The seminar room kitchenette. A grad student, Alex, is dismantling a La Marzocco espresso machine. The Advisor (a strict Ash'ari occasionalist) watches calmly. Ibn Rushd (Averroes) leans against the doorframe.

  **Alex:** "The pressure gauge is dead. The solenoid valve must be fused."

  **Advisor:** "You are conflating temporal succession with necessary connection. You see the valve open, then you see water flow, and you posit a bond between them. But consider the flame and the cotton. When they touch, you say the fire burns. But the fire has no power to burn; God creates the combustion at the moment of contact out of habitual regularity (*adah*), not because of any nature in the flame. Similarly, the pump does not push. God creates the flow alongside the vibration. This morning, He simply chose not to maintain the Habit."

  **Alex:** "So... I can't fix it?"

  **Advisor:** "You can adjust the occasion. But do not attribute agency to the rubber."

  *(Ibn Rushd steps forward, twists a bypass valve, and the machine roars to life. Espresso pours.)*

  **Ibn Rushd:** "The water flows because God endowed the pump with a nature that compels flow. To deny the secondary cause is to make God a micromanager of every drop rather than the Author of Natures."

  **Advisor:** "But could He not stop the flow mid-pour?"

  **Ibn Rushd:** *(Hands the Advisor the cup)* "He could. But He won't. And that stability is what I call 'Nature,' and what you call 'Habit.' Now drink. But remember, on your account, the caffeine lacks efficient causality. God isn't letting the coffee wake you up; He is merely creating alertness in your mind coincident with the swallowing. So technically, you're drinking decaf by metaphysics."
