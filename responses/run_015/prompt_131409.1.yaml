  **The question**
  Standard Bayesian confirmation theory faces the problem of old evidence: if evidence E is known with certainty (P(E)=1), conditioning on it cannot increase the probability of a new theory T. Existing literature focuses on cases where T entails E. This project investigates a neglected variant: cases where T accommodates E only approximately via auxiliary hypotheses, such that P(E|T) < 1. Under standard conditioning with P(E)=1, this setup implies P(E|~T)=1, yielding a likelihood ratio less than one. Consequently, old evidence actively disconfirms theories that merely approximate known data. The research question is determinate: Is this resulting disconfirmation a genuine epistemic cost inherent to accommodating old data approximately, or is it merely a formal artifact generated by the idealization that P(E)=1? Resolving this determines whether Bayesianism requires modification to handle realistic theory-evidence links or whether it correctly identifies a penalty for loose fits.

  **Why the usual fixes don't settle it**
  Current solutions to the problem of old evidence generally presuppose a deductive link between theory and evidence. One prominent strategy suggests reconstructing the agent's credences as if E were unknown, calculating confirmation counterfactually. Another argues that what is actually learned is not E itself, but the logical fact that T entails E. Both approaches successfully restore positive confirmation when the entailment holds. However, they leave the approximate case untouched. If the link between T and E is mediated by idealizations or auxiliary assumptions, T does not entail E, and the agent does not learn a deductive relationship. The counterfactual approach struggles because even in the hypothetical state of ignorance, the likelihood P(E|T) remains less than one due to the model's structural limitations. The agent cannot pretend the model fits better than it does. Similarly, learning that T implies E is impossible when T implies only a probability distribution over E. Therefore, existing frameworks either declare no confirmation occurs or, if forced to apply standard conditioning with P(E)=1, generate the counterintuitive result of disconfirmation. They were designed to rescue confirmation in ideal cases, not to evaluate the epistemic status of approximate fits against certain data. This project argues that this gap is not merely technical but conceals a substantive question about how uncertainty in modeling interacts with certainty in data. The standard fixes assume the problem is getting confirmation to move at all; this project asks whether the direction of movement is correct when the theory-evidence link is leaky.

  **Method, month by month**
  Given the three-month constraint, historical case studies are infeasible; deep archival work on specific episodes risks becoming descriptive rather than analytical. Instead, the method will be formal-conceptual analysis using constructed scenarios. Month one focuses on formalization. Weeks one and two will define the probability space, explicitly modeling the auxiliary hypotheses that degrade the link between T and E. Weeks three and four will involve sensitivity analysis, varying P(E) from 1 to near-1 to observe stability. This clarifies whether the disconfirmation result is robust or sensitive to the certainty idealization. Month two involves testing this formalism against intuitive vignettes drawn from general scientific practice rather than specific history—for example, simplified models of climate trend reproduction or orbital perturbations where error bars are known. Weeks five through eight will analyze whether scientific intuition treats approximate fits to old data as penalizing or neutral, comparing these intuitions against the formal outputs. Month three is dedicated to synthesis and writing. Weeks nine through twelve will be used to draft the argument, integrating the formal results with the conceptual analysis to determine if the Bayesian penalty aligns with scientific rationality. This approach prioritizes structural clarity over historical detail, ensuring a complete manuscript within the fellowship period. It avoids the trap of endless contextualization by sticking to the logical structure of the confirmation relation.

  **The outcomes and how I'd tell which is right**
