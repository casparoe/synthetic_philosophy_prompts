      Standard Bayesian confirmation theory faces the problem of old evidence: if evidence E is known with certainty (P(E)=1), conditioning on it cannot increase the probability of a new theory T. Existing literature focuses on cases where T entails E. This project investigates a neglected variant: cases where T accommodates E only approximately via auxiliary hypotheses, such that P(E|T) < 1. Under standard conditioning with P(E)=1, this setup implies P(E|~T)=1, yielding a likelihood ratio less than one. Consequently, old evidence actively disconfirms theories that merely approximate known data. The research question is determinate: Is this resulting disconfirmation a genuine epistemic cost inherent to accommodating old data approximately, or is it merely a formal artifact generated by the idealization that P(E)=1? Resolving this determines whether Bayesianism requires modification to handle realistic theory-evidence links or whether it correctly identifies a penalty for loose fits.

      *Drafting Section 2 (Why the usual fixes don't settle it):*
      Current solutions to the problem of old evidence generally presuppose a deductive link between theory and evidence. One prominent strategy suggests reconstructing the agent's credences as if E were unknown, calculating confirmation counterfactually. Another argues that what is actually learned is not E itself, but the logical fact that T entails E. Both approaches successfully restore positive confirmation when the entailment holds. However, they leave the approximate case untouched. If the link between T and E is mediated by idealizations or auxiliary assumptions, T does not entail E, and the agent does not learn a deductive relationship. The counterfactual approach struggles because even in the hypothetical state of ignorance, the likelihood P(E|T) remains less than one due to the model's structural limitations. Similarly, learning that T implies E is impossible when T implies only a probability distribution over E. Therefore, existing frameworks either declare no confirmation occurs or, if forced to apply standard conditioning with P(E)=1, generate the counterintuitive result of disconfirmation. They were designed to rescue confirmation in ideal cases, not to evaluate the epistemic status of approximate fits against certain data. This project argues that this gap is not merely technical but conceals a substantive question about how uncertainty in modeling interacts with certainty in data.

