answer: |-
  **Institution:** The Bureau of Procedural Clarity.
  **Materials:** Index cards, pens, a sealed box, a timer, wall space, masking tape.
  **Roles:** All eighteen are Clerks. No supervisors.

  **Timeline & Instructions**
  **0–20 mins (Legislation):** Clerks define 'Procedural Clarity'. They write criteria on cards (e.g., 'Sentence length under 20 words', 'No passive voice') and tape them to the wall. This is the Rubric.
  **20–25 mins (Briefing):** Facilitator speaks only these words: *"You are accredited Clerks. Your task is to produce a Case File on Subject Alpha (a fictional persona). You will be observed for adherence to the Rubric. Scores determine accreditation. I am now withdrawing."*
  **25–50 mins (Operation):** Facilitator leaves the room. Clerks write Case Files. Three Clerks rotate every ten minutes as Observers. They tick compliance slips and drop them in the sealed box. No one knows if slips are counted.
  **50–70 mins (Examination):** Facilitator returns but remains silent. Clerks score their own Case Files against the Rubric. They must rewrite any non-compliant lines.
  **70–90 mins (Debrief):** Discussion.

  **Scoring & Record**
  Points are awarded for Rubric adherence. There is no prize. The box remains sealed until the debrief, when it is revealed to be empty. The skill produced is 'Legibility': the ability to format thought to match arbitrary administrative categories. Its value expires at 90 minutes.

  **Debrief Plan**
  Map three moments to the mechanisms read:
  1.  **Hierarchical Observation:** The rotation of Observers (25–50 mins). Note how gaze was distributed, not centred.
  2.  **Normalising Judgement:** The creation of the Rubric (0–20 mins). Note how the norm was manufactured by the group, then treated as objective law.
  3.  **The Examination:** The self-scoring (50–70 mins). Note how observation and judgement combined to fix the individual as a 'case'.

  **The Claim of No Outside:** Ask students to critique the exercise. They will likely use the Rubric's terms (e.g., 'The instructions were unclear', 'The timing was inefficient'). Highlight this: they are judging the apparatus using the apparatus's own standards of clarity and efficiency. There is no external vocabulary available.
  **What Must Be Told:** You must explicitly state that the desire they felt to score highly was not coerced but cultivated. The room cannot feel the historical contingency of this desire; you must tell them that this competence is specific to this regime, not universal.

  **Failure Modes & Repairs**
  1.  **Cynicism/Refusal:** Students refuse to write. *Repair:* Frame accreditation as prerequisite for seminar completion (administrative necessity, not threat).
  2.  **Early Detection:** Laughter breaks the spell in Phase 1. *Repair:* Maintain bureaucratic blandness. Do not smile. Treat criteria generation as dry admin.
  3.  **Chaos During Absence:** Noise rises when facilitator leaves. *Repair:* Appoint a 'Timekeeper' from the students before leaving. Delegate order to them.
  4.  **Authoritarian Reading:** Students blame the facilitator for the rules. *Repair:* Remind them they wrote the Rubric themselves. Point to their handwriting on the wall.

  **Ethics & Limitations**
  No personal disclosure is required; Subject Alpha is fictional. The facilitator must not use the words *power, discipline, surveillance, norm,* or *panopticon* during the run. This exercise cannot reproduce the stakes of real institutional exclusion; it simulates the structure, not the consequence. It risks being read as a fable about digital surveillance; foreclose this by insisting on paper, physical presence, and the emptiness of the box. It risks being read as authoritarianism; foreclose this by ensuring the Rubric is genuinely their own creation, not imposed.

  **Closing Statement & Variant**
  If a participant left at minute 80, they would conclude that the Bureau requires strict adherence to procedural clarity to function, that their own legibility was insufficient, and that the Observers were necessary to maintain standards. They would feel a mild anxiety about their accreditation status and a desire to rewrite their Case File more clearly next time.

  **Forty-Five-Minute Variant (Fixed Furniture):**
  Condense Phase 1 to 10 mins (pre-print some criteria options to vote on). Reduce Operation to 15 mins (facilitator sits at back, facing away, simulating absence). Reduce Self-Assessment to 10 mins. Debrief 10 mins. Use desk partitions (open folders) to simulate observational barriers instead of moving chairs. The fixed architecture reinforces the constraint of the apparatus.
