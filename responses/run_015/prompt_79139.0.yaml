answer: |-
  1. **Brainstorm**
  *   Repeal resistance depends on institutional embeddedness, not just statutory text.
  *   Key drivers: Constitutional vs. statutory basis; size of beneficiary constituency; integration into social identity.
  *   Cultural norms can outlive laws (Norway), but legal hostility can kill effects despite norms (US).
  *   Political economy matters: vote banks vs. corporate boards.
  *   Path dependence: Older regimes create deeper pipelines.
  *   Abolition data (*SFFA*) shows immediate effect loss, indicating fragility.

  2. **Ranking**
  1.  Indian Caste Reservation (Deep)
  2.  Norway Gender Quota (Medium)
  3.  US Race-Conscious Admissions (Shallow)

  3. **Mechanisms**
  **India:** The mechanism is **constitutionalized political identity**. Reservation is not merely policy but a foundational social contract embedded in Articles 15 and 16, creating a massive, voting-based constituency that equates caste representation with democratic legitimacy. Abolition would require a constitutional amendment impossible to pass, and even hypothetically, the entrenched bureaucracy filled over seventy years creates an irreversible demographic stock. The regime survives because it constitutes the state's personnel structure itself.

  **Norway:** The mechanism is **normative internalization via pipeline saturation**. The quota forced an immediate expansion of the eligible female executive pool, proving competence and normalizing women in governance within the business elite. Even if the statute vanished, the reputational cost of reverting to all-male boards now outweighs compliance costs for publicly traded firms. The effect persists because the law successfully altered the supply-side constraints and corporate culture, making the quota eventually redundant despite its statutory origins.

  **US:** The mechanism is **judicially contingent permission**. The regime relied entirely on narrow Supreme Court exceptions to equal protection clauses, lacking statutory or constitutional grounding. When *SFFA* revoked this permission, the practical effect (diverse cohorts) immediately fractured because universities lacked alternative legal tools to achieve the same ends. This abolition episode reveals that repeal depth is low when legal authorization is the sole bottleneck. The effect was shallow because it depended on continuous judicial tolerance rather than entrenched infrastructure or political immunity, leaving institutions vulnerable to shifting judicial philosophies.

  4. **The case against my metric**
  Repeal depth measures institutional inertia, not moral worth or distributive justice. A regime could have high repeal depth because it successfully corrected an injustice and changed culture, or because it created a vested interest group that blocks necessary reform. Prioritizing depth favors status quo bias and entrenched power over responsiveness. It tells us nothing about whether the regime is still needed or if it has become counterproductive. We should rank regimes by their capacity to achieve equality, not their survivability after abolition.

  5. **Bottom line**
  India's caste reservation is the most repeal-resistant due to its constitutional and demographic entrenchment. My ordering would flip only if US universities demonstrate within five years that class-based proxies can replicate prior racial diversity levels without legal risk, proving the effect was decoupled from the specific race-conscious rule.
