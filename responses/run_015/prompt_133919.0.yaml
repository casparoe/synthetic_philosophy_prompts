answer: |-
  Your observation identifies a genuine friction point where empirical historiography meets the sociology of knowledge. As a chemist, you are looking for a consistent limit of detection across three samples, but the academic institutions are treating them as different classes of material entirely. The three-way split you notice does not rest on a single, unified philosophical theory of evidence; rather, it is a pragmatic, often unconscious patchwork of source criticism, disciplinary boundaries, and cultural stakes.

  **The Hidden Theory: Hierarchy of Sources and Stakes**
  The implicit framework presupposes that not all texts function as "data" in the same way.
  1.  **Trojan War (Classics):** The *Iliad* is treated as oral poetry preserving a cultural memory, corroborated by *external* contemporary data (Hittite tablets mentioning "Wilusa" and "Ahhiyawa") and physical stratigraphy (Troy VIIa). The philosophical commitment here is that poetic exaggeration can overlay a factual geopolitical conflict. The "kernel" is the war; the "shell" is the mythology.
  2.  **King Arthur (Medieval Studies):** The sources are internal to the tradition (Gildas, Nennius, Geoffrey of Monmouth) and written centuries after the fact. While there are 6th-century contexts, there is no contemporary naming of "Arthur." The commitment here is that without a contemporary signature, the figure defaults to literary construct unless archaeology forces a revision. It is sorted as folklore because the *narrative* is heavily magical, and the historical utility of a "warlord" is less definable than a "war."
  3.  **Exodus (Biblical Archaeology/History):** This is treated differently because the claim is demographic and geological (2 million people wandering a desert for 40 years). The silence in Egyptian records is treated as significant negative evidence (an absence where a signal should be loud). The commitment here is that foundational religious narratives function as identity-forming theology first and history second. Because the claim is still "live" for religious communities, historians are hyper-cautious to avoid theological conflict, often relegating it to "narrative theology" to maintain secular neutrality.

  **Consistency and Underdetermination**
  The split is **inconsistent** if viewed strictly through an evidentiary lens, but **consistent** if viewed through a sociological lens.
  *   **Evidentiary Inconsistency:** You are correct that the "gap" is handled differently. Arthur has less archaeological support than Troy but is sometimes granted more historicity in popular culture, yet less in academia. Exodus has massive textual support but is downgraded due to the *scale* of the claim exceeding the *weight* of the material evidence.
  *   **Philosophical Underdetermination:** The practice is underdetermined. There is no axiom stating "X amount of evidence equals History." Instead, the classification depends on the *type* of claim. A battle (Troy) leaves different traces than a migration (Exodus) or a biography (Arthur). Academics use different "assays" for each. Furthermore, cultural distance matters: Troy is "safe" (a dead civilization), whereas Exodus is "live" (active religious identity), creating a pressure to categorize it carefully to avoid ideological conflict.

  **The Probability Score Proposal**
  If you replaced these labels with a Bayesian credence value (e.g., "Historical Probability: 45%"), you would shift the ontology from **categorization** to **confidence**.
  *   **The Benefit:** It would force transparency about uncertainty, aligning closer to your scientific intuition. It would acknowledge that history is a spectrum of likelihood, not a binary of Fact/Fiction.
  *   **The Problem (The Polymer Analogy):** Assigning a single probability to "The Exodus" or "The Trojan War" is like assigning a single melting point to a polymer blend. These are not single events; they are composite narratives. Is the probability for the existence of Moses? The departure of a small group? The mass migration? A single number creates **false precision**. It implies a quantifiable distribution of evidence that doesn't exist.
  *   **Curriculum Impact:** Museums would need to display error bars, not just placards. Syllabi would shift from "What happened?" to "How do we weigh conflicting signals?" This would be more honest but potentially paralyzing for introductory students who need heuristics (categories) to organize information.

  **Conclusion**
  The current system is not trying to be scientifically precise; it is trying to manage cultural memory and disciplinary jurisdiction. It sorts stories based on how they function in the present (literature, national myth, sacred text) as much as what happened in the past. A probability score would be more epistemically honest but would fail to capture the *function* of these stories, which is often more important to institutions than their empirical truth value.

  Verdict: The tripartite split reflects divergent disciplinary conventions and cultural stakes rather than evidentiary consistency, so a probability metric would impose false precision on fundamentally qualitative judgments about collective memory.
