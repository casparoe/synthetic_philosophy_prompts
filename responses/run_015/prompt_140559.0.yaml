answer: |-
  Dear friend, it is wonderful to hear from you, and I think you are exactly the right person to give this talk because you have seen the field change from the inside rather than just learning the statistics from a textbook. You are right to worry that a slide of definitions will not dislodge the misconceptions they arrived with, and your instinct to build the whole session around a single running example is the only way to keep forty-five minutes from becoming a blur of formulas. I think your sourdough example is actually superior to the alpine sedge for this specific purpose, precisely because it is yours and not theirs. If you use a fertilizer trial, they will start worrying about soil heterogeneity or block design, which are real ecological problems but distractions from the statistical logic you want to expose. The sourdough example works because the prior is intuitively low for everyone, regardless of their field, and the mechanism for peeking is visceral. We all know what it looks like to check the dough too early, and it is easy to see how stopping because it looks ready invalidates the timing measurement. So keep the bread, but maybe mention halfway through that the same logic applies to their sedges, just to ground it back in their work.

  You asked about the order of operations, and I think the load-bearing distinction you identified between the probability of the data given the hypothesis and the probability of the hypothesis given the data needs to be the very first thing you establish, before you even define the p-value formally. If you let them sit with the idea that statistics is about updating belief before you correct their definition of significance, they will just map their old misconceptions onto the new vocabulary. I would start with the coin simulation immediately. Give them the fair coin, tell them to simulate a hundred flips, and ask them to calculate the probability of getting a result this extreme or more. Then ask how many of them got a p-value under 0.05. When hands go up, you have them trapped in the correct definition: the coin is fair, the null is true, but the data looked unusual. This kills misconception (a) right out of the gate because they just saw that a significant p-value does not mean the null is false, it just means the data was rare under the null. You can tell them explicitly that the p-value is a statement about the coin, not a statement about the fairness of the coin, and if you do this before you talk about bread or plants, you prevent them from encoding the error in the first place.

  Once you have secured that definition, you move into the sourdough example to tackle misconception (b) about peeking and dishonesty. This is where you need to be careful not to sound like you are accusing their colleague of lying. Frame it as a structural problem with the workflow rather than a moral failing. Walk them through how checking the dough every ten minutes and stopping when it looks risen changes the distribution of the data. You can explain that the p-value calculation assumes you decided to measure at one specific time, but if you decided to stop based on the outcome, you have changed the reference class of possible data. This is the perfect bridge to the replication crisis because it shows how a perfectly honest desire to see the bread rise leads to a number that no longer means what the textbook says it means. You want them to feel that the invalidation is mathematical, not ethical. If you frame it as cheating, they will think the solution is just to be nicer people. If you frame it as breaking the assumptions of the model, they will understand that the number itself is broken.

  This leads you naturally into the climax of the talk, which is your suspicion about exaggerated effect sizes even among honest researchers. Now that they understand that noise can look like signal (from the coin) and that workflow can amplify noise (from the bread), you can introduce the filter of publication. You do not need to use the terms Type M or Type S errors if you do not want to, but the logic is the same. Tell them to imagine the effect of Bach on dough is real but tiny. Most experiments will show no effect because the noise of the kitchen drowns it out. But the ones that do get published are the ones where the noise happened to align with the effect to make it look huge. This is where you address misconception (c), the idea that more replicates fix everything. More replicates reduce the noise, yes, but if the journal only publishes the lucky outliers, you still get a literature full of exaggerations. You need to make sure they see that the selection bias happens after the data is collected, so collecting better data does not fix the filtering problem. This is the point where you want them to feel a bit of dread, because it means the literature they are about to join is systematically distorted not by fraud, but by the interaction of small effects and significance thresholds.

  Only after you have landed that point should you bring up misconception (d), the idea that Bayesian methods are the savior. You want to address this near the end so it does not distract from the main critique of frequentist significance, but you must include it because smart students will always ask it. You can explain that while Bayesian methods give you the probability of the hypothesis given the data, which is what they actually want, they require a prior. If you let them tune the prior to get the result they want, you have just moved the p-hacking from the stopping rule to the prior distribution. The lesson should be that no statistical framework protects you from wanting a result too much. This reinforces your main theme that the crisis is about incentives and human psychology interacting with math, not just about using the wrong math.

  For your closing sequence, you need a question that tests whether they understand the conditional probability distinction without letting them recite a definition. I would ask them something like this: If I tell you I found a p-value of 0.01 for the effect of Bach on sourdough, what is the one piece of information I have not given you that is necessary to decide whether I believe me? You are looking for them to say something about how plausible the claim was to begin with, or how many other things I tested before finding this one. If they say nothing else is needed, they have not learned the lesson. If they say I need to know the prior plausibility or the multiple testing context, they have grasped that the p-value is not a standalone truth meter. As for what to refuse to explain, I think you should flatly refuse to teach them how to choose a prior distribution. Tell them explicitly that you are not going to solve the subjectivity of priors in forty minutes and that anyone who says they have a perfect objective prior is selling something. This sets a boundary that keeps the talk focused on the logic of inference rather than getting bogged down in the mechanics of Bayesian computation, which would require a whole semester on its own.

  Finally, for the hand that goes up at minute forty asking if we should just stop using p-values, you need a line that acknowledges the utility of the tool without endorsing the worship of it. You might say that we should stop using p-values as a gatekeeper for truth and start using them as a measure of surprise, but that the real solution is to stop asking binary questions about whether an effect exists and start asking continuous questions about how large it is. Or perhaps simpler, tell them that the p-value is a perfectly good tool for checking if your data is consistent with a null model, but it is a terrible tool for deciding whether to publish your paper. That distinction keeps the math valid while rejecting the culture that surrounds it. I think if you follow this arc, from the coin to the bread to the literature filter, you will leave them with a much more robust skepticism than if you just listed the things they should not do. You have the experience to tell this story with the weight it needs, and I suspect they will remember the bread long after they have forgotten the formulas.
