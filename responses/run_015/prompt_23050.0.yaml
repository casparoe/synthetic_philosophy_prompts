answer: |-
  You are right to be skeptical. Your intuition is spot-on: Frank Ramsey did not leave behind a systematic "doctrine" on the meaning of life, nor did he publish a treatise on existentialism. He died at 26 (1903–1930), and his published corpus is almost entirely technical (mathematics, logic, economics, probability).

  However, the sources you are encountering aren't entirely making it up. There **is** a specific text, but it is not a published paper, and it is often overstated by biographers who want to humanize the "boy genius" logician.

  Here is the breakdown of where this claim comes from, what the text actually says, and how it fits (or doesn't fit) with his technical work.

  ### 1. The Source: It's a Fragment, Not a Paper
  The text you are hearing about is an unpublished manuscript fragment simply titled **"The Meaning of Life."** It was written around 1925, shortly before his death.

  *   **Where to find it:** It is not in his *Foundations of Mathematics* or his economics papers. It is found in **"Philosophical Papers," edited by D.H. Mellor (1990)**. This is the canonical collection of Ramsey's non-technical philosophical writings.
  *   **The Format:** It is very short (a few pages at most) and reads more like a personal philosophical note or a diary entry than a rigorous argument intended for publication.
  *   **Why the confusion?** Because it has a definitive title ("The Meaning of Life"), secondary sources often cite it as if it were a standalone essay. In reality, it is a fragmentary reflection consistent with his broader views on ethics and language at the time.

  ### 2. What Does It Actually Say?
  Ramsey's view in this fragment is heavily influenced by his close friendship with **Ludwig Wittgenstein** and their shared reading of the *Tractatus Logico-Philosophicus*.

  The core of Ramsey's argument in the fragment is **anti-metaphysical**. He argues that the question "What is the meaning of life?" is a category mistake.
  *   **The "Outside" Problem:** To ask for the meaning of the universe implies you can stand *outside* the universe to observe it. Since we are part of the universe, we cannot take that external standpoint.
  *   **Immanence:** Meaning is not something the universe *has*; it is something we *generate* through our actions and valuations within the world.
  *   **Ethics as Nonsense (in a good way):** Like Wittgenstein, Ramsey held that ethical propositions (e.g., "Murder is wrong") cannot be true or false in the same way factual propositions are. They express an attitude or a volition. Therefore, the "meaning of life" cannot be a fact to be discovered, but a way of living to be adopted.

  In short, the fragment argues that looking for a grand, external purpose is futile. Meaning is found in the particular, immediate experiences and decisions of life.

  ### 3. How This Connects to "Truth and Probability"
  You mentioned feeling a disconnect between the logician of "Truth and Probability" and the existentialist. Actually, Ramsey's view on the meaning of life is the **ethical counterpart** to his theory of belief.

  *   **Pragmatism:** Ramsey is often credited as the bridge between Cambridge Analytic Philosophy and American Pragmatism (Peirce, James). His theory of truth and belief is pragmatic: a belief is a disposition to act.
  *   **Value and Action:** In "Truth and Probability," he analyzes how we measure degrees of belief based on betting behavior. In his ethical fragments, he suggests that "value" is similarly tied to action. We don't discover value; we project it through our choices.
  *   **The Connection:** Just as there is no "absolute truth" floating in the ether (only truths relative to our best systems of belief), there is no "absolute meaning" floating outside the world (only meanings we create by living).

  So, he didn't have a "religious" or "spiritual" doctrine. He had a **pragmatist** one: The meaning of life is the sum of the successful navigation of our desires and beliefs within the world.

  ### 4. Why Do Sources Exaggerate It?
  There are two reasons you keep running into this:

  1.  **Cheryl Misak's Biography:** The definitive modern biography, *Frank Ramsey: A Sheer Excess of Powers* (2020) by Cheryl Misak, spends significant time on his ethical and existential views. Misak argues that Ramsey's technical work cannot be fully understood without his humanistic concerns. This has led to a surge in articles highlighting his "view on life," sometimes smoothing over the fact that it was fragmentary.
  2.  **The "Tragic Genius" Narrative:** Ramsey died of jaundice (likely hepatitis) at 26, shortly after solving major problems in math and economics. There is a romantic tendency in philosophy to look for the "final wisdom" of the young genius. The existence of a manuscript titled "The Meaning of Life" is too tempting for commentators to ignore, even if it's just a note.

  ### 5. Summary: What Should You Make of It?
  *   **Is there a canonical text?** Yes, the manuscript fragment "The Meaning of Life" in Mellor's *Philosophical Papers*.
  *   **Is it a developed doctrine?** No. It is a short, Wittgensteinian reflection.
  *   **Is he a pragmatist on this?** Yes. His view is that meaning is immanent in human action, not transcendent in the cosmos.
  *   **Should you read it as a key to his logic?** Only in the sense that it clarifies his view on *ethics*. It doesn't change his math or probability theory, but it shows why he thought those tools mattered: they help us navigate a world that doesn't come with an instruction manual.

  **Recommendation:** If you want to see the text without wading through the myth, look for **D.H. Mellor's introduction to *Frank Ramsey: Philosophical Papers***. Mellor is careful to contextualize the fragment as part of Ramsey's broader (and unfinished) work on ethics, rather than treating it as a standalone gospel. Also, Cheryl Misak's biography is excellent at distinguishing between what Ramsey wrote and what later interpreters wish he had written.

  You aren't missing a hidden book; you are correctly sensing that the "doctrine" is more of a consistent attitude scattered across his letters and fragments than a formal theory.
