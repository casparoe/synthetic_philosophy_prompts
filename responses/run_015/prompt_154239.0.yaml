      *Self-Correction on "Identical Code" Proposal:* The prompt asks "Is that the target or the trap?" It is *both*. It is the target intuition for CS students (functions return same output for same input), but a trap if they assume *syntactic* identity is required rather than *logical* equivalence. I will place this in Phase 4.

