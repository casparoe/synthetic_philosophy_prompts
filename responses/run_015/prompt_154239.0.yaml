          *   Open Declinations: What *not* to settle (normative correctness, CDT vs. EDT debate).
          *   **Language:** British English.

  2.  **Deconstruct Superrationality:**

      *   What is it? It's the idea that rational agents, knowing they are rational and facing the same problem, will reason identically and thus arrive at the same outcome. Therefore, my choice *is* the other's choice.
      *   Key distinction from Nash: Nash assumes the other's move is fixed/independent. Superrationality assumes logical correlation.
      *   Key distinction from CDT/EDT: It predates the formalisation but aligns closely with EDT/Functional Decision Theory (FDT) intuitions without requiring the full machinery.
      *   The "Identical Code" trap: If I cooperate only if the code is *identical*, I might defect against a slightly modified but logically equivalent version. This is "Program Equilibrium" (Tennenholtz) or "FairBot" (Gödelian machines), which is more advanced than Hofstadter's original superrationality. Hofstadter's version is about *reasoning*, not necessarily source code inspection.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-10 mins):** Establish the PD. Ensure everyone knows the Nash Equilibrium (Defect/Defect).
      *   **The Carrying Scenario (10-20 mins):** This needs careful definition based on the prompt's constraints.
          *   *Must contain:* One-shot, sealed, symmetric payoffs, common knowledge of rationality.
          *   *Must lack:* Iteration, reputation, communication.
          *   *Crucial Decision:* Source code visibility. If they see the code, it becomes Program Equilibrium. If they don't, it's pure reasoning. The prompt asks about this. Hofstadter's original thought experiment didn't assume source code exchange, but rather "same type of reasoning." However, for CS students, the "algorithm" metaphor is strong. I need to advise *against* showing source code for the *introductory* concept of superrationality, otherwise, it shifts to "Program Equilibrium" and gets bogged down in quining/verification.
      *   **The Core Argument (20-35 mins):** The leap from "I choose" to "We choose". The symmetry argument.
      *   **The "Identical Code" Proposal (35-40 mins):** The prompt asks about "Cooperate iff identical". This is a trap if presented as *the* definition. It's a specific implementation (Program Equilibrium). It should be met *after* the core reasoning is established but *before* the misconceptions are addressed. It's a "Target" for CS students to grasp the mechanism, but a "Trap" if they think strict identity is required.
      *   **Misconceptions (40-50 mins):**
          1.  *EDT Costume:* Need to establish logical correlation first.
          2.  *Reciprocal Altruism:* Need to emphasise "One-shot" heavily.
          3.  *Universal Cooperation:* Need to establish the condition of "Common Knowledge of Superrationality".
      *   **Closing Question (50-55 mins):** The variant with different payoffs.
      *   **Open Declinations (55-60 mins):** Normativity and CDT/EDT wars.

  4.  **Refining the Dependencies and Constraints:**

      *   *Carrying Scenario:* If source code is shown, it becomes a technical verification problem (CS) rather than a rationality problem (Phil/CS). It turns into "Program Equilibrium". For a general intro to Superrationality, source code visibility should be *excluded* or treated as a metaphor for "same reasoning process". I will advise excluding literal source code exchange to keep the focus on the *logic of symmetry* rather than *verification mechanics*.
      *   *Identical Code:* This is the "Trap" if it implies cooperation requires *syntactic* identity. It is the "Target" if it illustrates the *logical* link. It should be met when discussing *how* the correlation is established.
      *   *Misconceptions:*
          *   EDT: Needs the distinction between "correlation" and "causation" to be clear before dismissing it as *just* EDT. Actually, the prompt says "falls with it wherever an action is correlated with but does not cause". I need to ensure they understand Superrationality relies on *logical* necessity, not just statistical correlation.
          *   Reciprocal Altruism: Needs the "One-Shot" constraint to be firmly nailed down first.
          *   Universal Cooperation: Needs the "Common Knowledge" constraint established.

  5.  **Developing the Closing Question:**

      *   Standard PD: (3,3) (0,5) (5,0) (1,1).
      *   Variant: Asymmetric payoffs. If I reason superrationally, but the payoffs are different for me than for you, do we still choose the same *action*? Or do we choose the action that maximises the joint outcome?
      *   Better variant for "reasoning alike but different payoffs": If the matrix is symmetric, we choose the same. If the matrix is asymmetric, superrationality doesn't straightforwardly apply in the standard form.
      *   *Prompt requirement:* "Variant where the two procedures reason alike but face slightly different payoffs."
      *   *Idea:* Player A faces standard PD. Player B faces a PD where Temptation is higher. Both are superrational. Do they cooperate?
      *   *Distinguisher:* A rote learner says "Yes, superrationality = cooperate." A understander says "Superrationality requires symmetric reasoning about symmetric problems. If payoffs differ, the 'same reasoning' might lead to different conclusions, or the premise breaks."
      *   *Actually, Hofstadter's view:* Superrationality implies doing what you wish the other to do. If payoffs differ, the "golden rule" aspect gets complex.
      *   *Selected Question:* A scenario where the payoff matrix is slightly skewed for one player. Does the superrational agent still cooperate? (Answer: It depends on whether the reasoning process accounts for the asymmetry. If the reasoning is "maximise joint utility", yes. If it's "mirror the other", it's ambiguous). Let's make it sharper: "You are superrational. Your opponent is superrational. You face a PD. They face a PD where Defecting gives them 1000 points instead of 5. Do you cooperate?"
      *   *Wait, the prompt asks for a question that separates understanding from repeating "same computation".*
      *   *Idea:* "You and a clone face a PD. But the clone's payoff for (Defect, Cooperate) is 100, yours is 5. You both run the same reasoning algorithm. Do you Cooperate?"
      *   *Rote answer:* "Yes, same algorithm."
      *   *Understanding answer:* "The algorithm takes payoffs as input. Different inputs -> potentially different outputs. Superrationality doesn't guarantee cooperation if the situation isn't symmetric."

  6.  **Reviewing against Constraints:**

      *   *British English:* Check spelling (programme, analyse, centre, etc.) and tone.
