  7.  **Final Polish of the Plan Structure:**

      *   **Phase 1: The Baseline (Nash).**
      *   **Phase 2: The Scenario (Constraints).**
      *   **Phase 3: The Superrational Leap (Symmetry).**
      *   **Phase 4: The CS Intervention (Source Code/Identity).**
      *   **Phase 5: Misconception Correction.**
      *   **Phase 6: The Test Question.**
      *   **Phase 7: The Open Questions.**

