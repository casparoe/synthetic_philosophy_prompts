answer: |-
  # Session Plan: Introduction to Superrationality

  **Duration:** 60 minutes
  **Audience:** First-year Computer Science and Philosophy undergraduates
  **Prerequisites:** Knowledge of the Prisoner's Dilemma payoff matrix; familiarity with the phrase 'Nash equilibrium'.

  ---

  ## 1. The Baseline: Nash Equilibrium and the Standard Prediction (0–10 mins)

  **Objective:** Establish the default game-theoretic conclusion to create tension for the new concept.

  **Components:**
  1.  Display the standard Prisoner's Dilemma matrix (Temptation > Reward > Punishment > Sucker).
  2.  Elicit the standard rational move (Defect) via dominance reasoning.
  3.  Define the Nash Equilibrium (Mutual Defection) as the state where no player benefits from unilaterally changing strategy.

  **Dependencies:**
  *   Depends on nothing new; relies entirely on students' prior knowledge of the matrix.
  *   **Crucial Constraint:** Do not yet introduce the concept of 'correlation' between players. Treat the players as causally isolated black boxes.

  ---

  ## 2. The Carrying Scenario: Constraints and Boundaries (10–20 mins)

  **Objective:** Define the specific experimental conditions under which superrationality operates. This prevents conflation with other cooperative mechanisms.

  **Components:**
  1.  **The Setup:** Two players submit a sealed decision procedure to a referee. The referee runs both and distributes payoffs.
  2.  **Must Contain:**
      *   **Symmetry:** Both players face the exact same payoff matrix.
      *   **Common Knowledge of Rationality:** Both know the other is rational, both know the other knows this, ad infinitum.
      *   **One-Shot Interaction:** The game occurs exactly once.
  3.  **Must Lack:**
      *   **Iteration:** No future rounds to punish defection.
      *   **Reputation:** No external audience or future consequences.
      *   **Communication:** No pre-play signalling or bargaining.
      *   **Source Code Visibility:** *Crucial Decision.* You must **exclude** the feature where each procedure is shown the other's source code.
          *   *Reasoning:* If students can inspect the opponent's code, the lesson shifts from Hofstadter's 'superrationality' (reasoning about reasoning) to Tennenholtz's 'program equilibrium' (verification and quining). The latter is a technical CS problem regarding computability; the former is a philosophical problem regarding logical correlation. Including source visibility turns this into a different lesson entirely.

  **Dependencies:**
  *   Depends on the Baseline (students must know why cooperation is currently irrational).
  *   **Pending Concept:** You are asserting that rationality might dictate a different outcome here, but you have not yet explained *how*. This tension must remain unresolved until Phase 3.

  ---

  ## 3. The Superrational Leap: Symmetry of Reasoning (20–35 mins)

  **Objective:** Introduce the core mechanism: logical correlation rather than causal influence.

  **Components:**
  1.  **The Argument:** If both players are rational, and both face the same problem with the same information, they will employ the same reasoning process.
  2.  **The Consequence:** Therefore, whatever I decide to do, the other will decide to do the same. My choice is not causally linked to theirs, but it is *logically* linked.
  3.  **The Calculation:** I am not choosing between 'Cooperate' and 'Defect' assuming the other is fixed. I am choosing between 'Both Cooperate' and 'Both Defect'.
  4.  **The Result:** Since (Cooperate, Cooperate) yields a higher payoff than (Defect, Defect), the superrational choice is to Cooperate.

  **Dependencies:**
  *   Depends on the **Carrying Scenario** (specifically Symmetry and Common Knowledge).
  *   **Pending Concept:** Do not yet address *why* this isn't just magic or wishful thinking. Let the logical leap stand on its own before subjecting it to scrutiny.

  ---

  ## 4. The CS Intervention: The 'Identical Code' Proposal (35–40 mins)

  **Objective:** Address the inevitable Computer Science intuition regarding implementation.

  **Components:**
  1.  **The Proposal:** A student will suggest: "Cooperate if and only if I can verify the other procedure is identical to mine."
  2.  **Classification:** This is **both a Target and a Trap**.
      *   *Target:* It correctly identifies that the correlation stems from the sameness of the algorithm.
      *   *Trap:* It implies that *syntactic* identity is required. Superrationality relies on *logical* equivalence. If I cooperate with a slightly refactored version of my own code that is logically equivalent, strict syntactic identity fails.
  3.  **Placement:** Address this **immediately after** the Core Argument.
  4.  **Resolution:** Acknowledge this as a robust implementation strategy (Program Equilibrium) but distinguish it from the philosophical claim. Superrationality claims you should cooperate because you *are* reasoning alike, not because you have verified the source. Verification is a mechanism; logical correlation is the justification.

  **Dependencies:**
  *   Depends on the **Core Argument** (students must understand the logical link before discussing how to enforce it).
  *   Depends on the **Exclusion of Source Code** (Phase 2). If you allowed source visibility, this proposal would be the standard solution. Since you excluded it, this proposal highlights the difference between *knowing* the other is rational vs. *reading* their mind.

  ---

  ## 5. Correcting Misconceptions (40–50 mins)

  **Objective:** Distinguish superrationality from similar but distinct concepts. The order here is vital for the corrections to land.

  **Misconception 1: Reciprocal Altruism with Iteration Deleted**
  *   **Placement:** First.
  *   **Prerequisite:** The **Carrying Scenario** must have firmly established the 'One-Shot' constraint.
  *   **Correction:** Reciprocal altruism relies on the shadow of the future (iteration). Superrationality relies on the shadow of the *other mind* (symmetry). If the student believes cooperation is an investment in future rounds, they have not accepted the One-Shot constraint.

  **Misconception 2: Evidential Decision Theory (EDT) in Costume**
  *   **Placement:** Second.
  *   **Prerequisite:** The **Core Argument** must have established 'Logical Correlation'.
  *   **Correction:** Acknowledge the overlap. However, clarify that the critique of EDT (that it confuses correlation with causation) applies to statistical correlations (e.g., smoking and yellow fingers). Superrationality posits a *logical* necessity, not a statistical regularity. It falls only if one denies that two rational agents facing the same problem must arrive at the same conclusion. This is a stronger claim than standard EDT.

  **Misconception 3: Universal Cooperation (The 'Purity' Trap)**
  *   **Placement:** Third.
  *   **Prerequisite:** The **Core Argument** must have established 'Common Knowledge of Rationality'.
  *   **Correction:** Superrationality does not return 'Cooperate' against a random defector or a machine that always defects. It only works against another superrational agent (or one sufficiently likely to be such). If the other player is not superrational, the symmetry breaks, and the Nash equilibrium (Defect) returns. It is conditional, not absolute.

  **Dependencies:**
  *   All three corrections depend on the **Core Argument** being fully digested. If students do not believe the symmetry premise, these distinctions will be memorised as arbitrary rules rather than logical consequences.

  ---

  ## 6. The Closing Question: The Asymmetry Test (50–55 mins)

  **Objective:** Separate students who understand the mechanism from those repeating the slogan.

  **The Question:**
  "You and a clone are both superrational. You both run the exact same reasoning procedure. However, the referee hands you different payoff matrices. Yours is a standard Prisoner's Dilemma. Your clone's matrix is identical, except their Temptation payoff for defecting while you cooperate is 1,000 points instead of 5. Do you Cooperate?"

  **Expected Responses:**
  *   **Rote Learner:** "Yes. We are running the same computation, so we do the same thing. Superrationality means cooperate."
  *   **Understanding Student:** "No (or 'It is undefined'). The reasoning procedure takes the payoff matrix as an input. If the inputs differ, the outputs may differ. Superrationality relies on symmetry of the *problem*, not just the *reasoner*. If the problems are asymmetric, the logical link that forces identical actions is broken."

  **Dependencies:**
  *   Depends on **Misconception 3** (Conditional Cooperation). If they think superrationality is a moral command to always cooperate, they will fail this test.

  ---

  ## 7. Open Declinations: What Not to Settle (55–60 mins)

  **Objective:** Define the boundaries of the session to prevent unresolvable metaphysical debates.

  **Components:**
  Explicitly decline to settle the following two points. State that these are active research areas, not settled facts.

  1.  **Normative Correctness:** Do not claim superrationality is *the* correct way to act. State that Causal Decision Theorists (CDT) reject it. Whether one *ought* to be superrational is a matter of ongoing philosophical dispute, not a theorem.
  2.  **The CDT vs. EDT/FDT Contest:** Do not attempt to resolve whether superrationality is merely a subset of Evidential Decision Theory or Functional Decision Theory. Acknowledge the family resemblance but decline to map the full topology of decision theories in one hour.

  **Dependencies:**
  *   Depends on the entire session. These declinations protect the lesson from collapsing into a debate about the nature of causation, which cannot be resolved in the remaining time.

  ---

  ## Summary of Dependencies and Flow

  1.  **Baseline** (Requires prior PD knowledge).
  2.  **Scenario** (Requires Baseline; excludes Source Code/Iteration).
  3.  **Core Argument** (Requires Scenario Symmetry).
  4.  **CS Intervention** (Requires Core Argument; distinguishes Logic from Syntax).
  5.  **Misconceptions** (Require Core Argument + Scenario Constraints).
      *   Reciprocal Altruism (Requires One-Shot constraint).
      *   EDT (Requires Logical Correlation concept).
      *   Universal Cooperation (Requires Common Knowledge constraint).
  6.  **Closing Question** (Requires understanding of Symmetry inputs).
  7.  **Declinations** (Requires completion of all above to frame the limits).
