  **MEMORANDUM**

  **TO:** Rules Committee
  **FROM:** [Your Name]
  **DATE:** February 14, 2024
  **SUBJECT:** Recommendation on Electoral Method Reform

  **Background**
  Following the legitimacy crisis of the last election—where the President was elected with only 31% of first preferences while being ranked last by a majority, and where a candidate's withdrawal reversed the finishing order of the remaining contenders—this committee was tasked with selecting a new counting method. We operate under significant constraints: roughly 1,200 ranked ballots must be counted by hand by a single part-time administrator in one afternoon, and the method must be explainable to the membership in a single paragraph.

  **Evaluation of Committee Arguments**
  Three distinct arguments have been advanced, each containing valid insights:

  1.  **The Disqualification Proposal (Member 1):** Suggesting a separate vote to disqualify "unacceptable" candidates addresses the Majority Loser problem (Requirement iv). However, holding a separate vote depresses participation and adds administrative burden. Furthermore, it does not resolve the instability caused by candidate withdrawals (Requirement ii).
  2.  **The Single-Axis Assumption (Member 2):** Claims that our politics align on a single "junior vs. senior" axis, implying simple majority rule would suffice. While the Median Voter Theorem guarantees stability in one dimension, the emergence of a second cleavage ("in-person vs. remote") renders this assumption unsafe. We cannot base permanent rules on a sociological hypothesis that is actively contested.
  3.  **The Impossibility Theorem (Member 3):** Correctly identifies that no ranked voting system can satisfy Pareto Efficiency (i), Independence of Irrelevant Alternatives (ii), and Non-Dictatorship (iii) simultaneously (Arrow's Theorem). We must mathematically sacrifice at least one requirement.

  **Recommendation**
  I recommend we adopt **Instant Runoff Voting (IRV) with a Majority-Loser Veto**.

  Under this method, ballots are counted in rounds. In each round, the candidate with the fewest first-place votes is eliminated, and their ballots transfer to the next available preference. This continues until one candidate remains. **However**, before the winner is declared, we tally last-place rankings. If the winner was ranked last by more than 50% of voters, they are disqualified, eliminated, and the count is rerun without them.

  **Rationale and Sacrifices**
  This method is the only viable option that satisfies our administrative constraints while addressing the specific trauma of the last election.

  *   **Requirements Met:** It satisfies **Pareto Efficiency (i)** (if everyone prefers A to B, B cannot win), **Non-Dictatorship (iii)** (no single voter decides), and the **Majority Loser Criterion (iv)** (the veto explicitly prevents a candidate hated by a majority from holding office). It is also hand-countable within the afternoon constraint, unlike Condorcet methods which require pairwise matrix tallying that is too time-consuming for one administrator.
  *   **Requirement Sacrificed:** We must sacrifice **Requirement (ii)** (Independence of Irrelevant Alternatives/Withdrawal Consistency). As Member 3 noted, this is mathematically unavoidable if we wish to keep (i) and (iii). While a candidate's withdrawal *could* theoretically alter the relative order of the remaining candidates, this risk is preferable to electing a President actively opposed by the majority. We will mitigate this by establishing a clear protocol: if a candidate withdraws *before* the count begins, the ballots are recounted excluding that name.

  **Conclusion**
  This approach prioritizes legitimacy (avoiding a Majority Loser) and feasibility (hand-counting) over theoretical consistency regarding withdrawals. It integrates Member 1's concern without a separate election, rejects Member 2's unproven assumption, and accepts Member 3's mathematical reality. I move we adopt this method for the March vote.

