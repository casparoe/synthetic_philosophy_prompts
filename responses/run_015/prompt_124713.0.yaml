  (1) The modern development
  Contemporary computational historiography employs large-scale language models trained on vast digitized archives to identify statistical regularities in human affairs. These systems claim predictive capacity regarding macro-patterns, such as imperial fragmentation or Kondratiev waves, based solely on textual correlations. Crucially, these algorithms operate as black boxes, generating forecasts without articulating underlying causal mechanisms or theoretical frameworks, relying instead on high-dimensional pattern recognition within historical data streams. They promise insight free from bias, yet their opacity masks interpretive choices embedded in data.

  (2) Popper's trend-versus-law distinction mapped onto black-box statistical prediction
  For Popper, universal laws are unconditional; trends depend on specific initial conditions. He distinguished strictly between universal statements and existential statements regarding historical sequences. Black-box statistical outputs resemble trends rather than laws. Even accurate predictions identify sequences contingent on historical contexts, not universal necessities. Without a falsifiable theory explaining why the pattern holds, the output remains a sophisticated projection of past contingencies, vulnerable to changing initial conditions. Correlation without causal theory cannot strictly establish unconditional validity in his view. Popper would view these as extrapolations of singular historical events, not discoveries of universal regularities. They describe closed data systems, failing to account for the open nature of historical reality. Consequently, algorithmic success implies only local reliability, not global historical determinism.

  (3) His probable verdict on whether these outputs constitute laws of history, with reasoning
  Popper would decisively reject these outputs as historical laws. His critique of historicism rests on the argument that the future course of history depends on the future growth of human knowledge, which is logically strictly unpredictable. Since LLMs train exclusively on past data, they cannot account for novel scientific or technological innovations that alter societal trajectories. Therefore, any predicted macro-pattern is merely a conditional trend valid only so long as initial conditions remain static. Furthermore, Popper insisted that social phenomena involve human choices influenced by interpretations, not deterministic forces. A black-box model lacking explanatory mechanisms cannot falsify its own predictions theoretically; it only offers probabilistic guesses based on past correlations. Consequently, these tools exemplify the very historicist fallacy Popper warned against: mistaking observed trends for inevitable destinies. They may offer useful heuristic projections for specific contexts, but they fail the criterion of universal lawfulness because human history remains truly open-ended.

  (4) One conceptual tension in applying his framework to models that predict without explaining, which he might find difficult to resolve
  Popper prioritized explanatory power over predictive success, arguing prediction without theory is unscientific. If models actually achieve high accuracy, they challenge his dismissal of trend-based forecasting. If a black box predicts historical shifts better than causal theories, does instrumental success outweigh the lack of mechanistic explanation? Popper might struggle to deny the utility of these tools while maintaining they reveal nothing about historical laws, forcing a difficult distinction between mere useful prediction and genuine scientific understanding within his ongoing framework.

  (5) A concise bottom line
  Popper would classify algorithmic macro-patterns as contingent trends, not universal laws. Despite predictive accuracy, the inability to account for novel knowledge growth and lack of causal mechanism confirms his view that history still remains open, rendering historicist predictions fundamentally unscientific.
