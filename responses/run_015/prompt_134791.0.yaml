answer: |-
  **TO:** Policy Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Thoughts on the Uniform Deadline Proposal

  Hi everyone,

  I'm writing this so you have my thinking before we vote Thursday. I've been going back and forth on the Uniform Deadline Policy. I want to be clear from the start: I think the teachers who drafted this are right about the core problem. Right now, late work is a lottery. If I have Mr. X instead of Ms. Y, my GPA could shift based purely on luck. That isn't fairness. Consistency is an equity issue, and the argument that we need preparation for college or work deadlines is valid. We shouldn't ignore that.

  However, I'm not convinced this specific draft is the right tool to fix that problem.

  I've been looking at this through the lens of how rules actually function in communities. You can adjust different dials: how many rules there are, how harsh the penalty is, how much discretion the enforcer has, and how visible the enforcement is. This proposal keeps the number of rules the same but cranks the harshness and visibility dials way up while removing discretion. My concern is that this specific mix creates unintended consequences that might undermine the learning goals we all share.

  First, there's the risk of students aiming at the rule instead of the goal. When a penalty is strict and automatic, the rational move is to submit garbage at 11:59 PM just to beat the 10% clock. We might get higher compliance on deadlines, but lower quality on work. Second, and more seriously, is the 504 carve-out. The proposal says no exceptions except for formal accommodations. When the general rule is rigid, the exceptions become glaringly visible. Students with 504s are already stigmatized; if they are the *only* ones handing work in late, we are effectively outing them to their peers. That creates a social cost that isn't accounted for in the policy.

  Because of this, I cannot support adopting this as permanent policy right now. But I also don't think we should kill it and stay with the current chaos.

  **My Recommendation:**
  Adopt this as a **one-term pilot program**, starting next semester, with a mandatory review in January.

  We need data, not just anecdotes, to know if this works. During the pilot, the administration should track late penalties not just as a total number, but disaggregated by student circumstance. Specifically, we need to check who is getting penalized. Are the penalties hitting students with part-time jobs? Students who care for siblings after school? Students who travel for sports? If the policy disproportionately burdens students with external responsibilities, it isn't fair, even if it is uniform.

  **Defining Failure:**
  We need to agree on what would count as this policy failing. I propose we scrap it at the end of the term if:
  1.  Disaggregate data shows a significant spike in penalties for working students or caregivers compared to previous terms.
  2.  Counselors report an increase in students requesting 504 evaluations solely to access deadline extensions.
  3.  Teachers report a noticeable drop in work quality due to last-minute "panic submissions."

  **Values vs. Facts:**
  Finally, I want to flag that some of this isn't a factual question we can measure. It's a values call. We have to decide what "fairness" means to us. Is fairness everyone following the exact same rule regardless of circumstance? Or is fairness ensuring everyone has a genuine opportunity to demonstrate learning, even if their timelines differ? The data from the pilot will tell us what *happens*, but this committee has to decide what we *value* more: rigid consistency or flexible support.

  I think a pilot lets us test the consistency argument without locking ourselves into a system that might hurt vulnerable students. I hope we can discuss this framework Thursday.

  Thanks,
  [Your Name]
