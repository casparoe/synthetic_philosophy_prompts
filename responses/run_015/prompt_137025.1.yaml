      *   *Correction:* Make sure not to conflate the Predictor and the Reporter. In ELK, they are often distinct heads on the same backbone. In Econ, this is like an agent with two reporting tasks.
      *   *Correction:* Be careful with "Verification." In ELK, there is *no* verification of the true state. Only verification of the *human's opinion*. This is strictly "Elicitation without Verification" using a "Peer" (the human).
      *   *Nuance on Suspicion 2:* The neural net isn't an agent. It's a tool used by an agent (the developer) or it's a proxy. But in the ELK framing, we treat the net *as if* it were an agent holding information. I need to highlight that this "as if" is where the friction lies.
      *   *Nuance on User's Sketch:* The user suggests "severing the human channel." In Econ, this is changing the information structure. If the mechanism relies on the human report for scoring, you can't sever it *and* score. You need a counterfactual scoring rule. This links to "Counterfactual Mechanism Design."

  11. **Final Polish:** Check tone. Respectful, academic, precise. Ensure all constraints of the prompt are met (confidence levels, specific claim identification).

