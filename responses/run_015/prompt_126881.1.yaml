answer: |-
  Yes, I think you have put your finger on something quite important there. It is certainly true that if I say of another man, 'He asserts that it is raining, but he does not believe it,' there is no absurdity whatsoever; indeed, it may be perfectly true. And your example of the committee messenger is very instructive. In that case, the man is not asserting the proposition as an expression of his own state of mind, but rather as a duty of his office, so to speak. He is reporting what the evidence suggests, or what others have concluded, without committing his own conviction to the matter. So I agree entirely that the proposition itself—'It is raining and I do not believe it'—is not a formal contradiction, for it might quite well be true.

  However, I should not wish to say that the absurdity is merely a trivial quirk of grammar. When I myself assert a proposition in the ordinary way, I am thereby expressing my belief in it. To say 'It is raining' is, in normal circumstances, to give you to understand that I believe it is raining. So when I add 'but I don't believe it,' I am taking back with the second clause what I have just given with the first. It is not that the words contradict one another logically, but that the act of asserting is incompatible with the denial of belief in that very moment. Your committee example shows precisely why the paradox is confined to the first person present indicative: because only there am I both the assertor and the believer whose state is being reported. So while you are right that the absurdity vanishes when the roles are separated, this does not show there is no deep connection between assertion and belief; rather, it confirms that to assert is ordinarily to express one's own belief.
