  | **Strawsonian Quietism** | Theory is true, but practice is inert; we blame because we cannot help it. | Q1-No, Q3-Involuntary | Ignoring the intellectual weight of the Basic Argument in daily life. | Reactive-Attitudes-Only (Behaviorally) |
  | **Accountability w/o Desert** | We can hold agents answerable for reasons, independent of ultimate desert. | Q1-No, Q3-Justified, Q4-Accountability | Calling it "responsibility" while denying its core traditional condition (desert). | Reactive-Attitudes-Only (Theoretically) |
  | **Reactive-Attitudes-Only** | Relationships require blame, and we can sustain its full force without desert. | Q1-No, Q3-Justified, Q4-Constitutive, Q5-Yes | Maintaining emotional intensity while explicitly denying its justification. | Strawsonian Quietism (Behaviorally) |
  | **Double Bookkeeping (Blunted)** | Denying desert is true, but consistently holding this view inevitably erodes blame. | Q1-No, Q3-Justified, Q4-Constitutive, Q5-No | Living with progressively emptier moral emotions and social bonds. | None |

  ***Note on Indistinguishability:** While **Strawsonian Quietism** and **Reactive-Attitudes-Only** are theoretically distinct (Involuntary vs. Justified), they are practically indistinguishable: both result in the full continuation of current blame practices despite accepting the Basic Argument.*
