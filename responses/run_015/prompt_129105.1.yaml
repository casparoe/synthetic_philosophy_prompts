  ### ⚠️ UNOCCUPIED & PROBLEMATIC PATHS
  *   **Q1(YES) + Q3(INVOLUNTARY):** *Incoherent.* One cannot be rationally compelled to voluntarily reform attitudes that are defined as involuntary natural facts.
  *   **Q4(ACCOUNTABILITY) + Q5(NO/BLUNTED):** *Unattractive/Unstable.* If denying desert inevitably blunts reactive attitudes, the emotional force required for robust moral conversation may evaporate, collapsing this view into Leaf 5.

  ### 📊 VIEW COMPARISON TABLE

  | leaf_name | one_line_statement | answer_pattern_reaching_it | most_awkward_commitment | indistinguishable_from |
