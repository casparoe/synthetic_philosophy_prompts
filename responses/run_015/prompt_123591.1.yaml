answer: |-
  The established concept you are looking for is a **Degenerating Research Programme** (specifically, a **Degenerating Problem Shift**), coined by the philosopher of science Imre Lakatos.

  However, since that is a mouthful for a dinner argument, the specific *move* being made in Version Two is best described as an **Ad Hoc Temporal Rescue**.

  If you want a sharper, coined term for your own use to distinguish it from the other two, call it **Temporal Drift**.

  Here is the breakdown of why this fits, how to distinguish the three versions operationally, and where the distinction is weak.

  ### The Established Concept: Degenerating Research Programme
  Your friend was half-right about "immunizing." In philosophy of science (Karl Popper), an **Immunizing Stratagem** is a move that protects a theory from falsification. Your intuition was that this means "avoiding the test." Actually, it means "surviving the test without changing the theory."

  Imre Lakatos refined this. He argued that theories aren't single statements but "research programmes" with a **Hard Core** (the fundamental belief, e.g., "Population outstrips food") and a **Protective Belt** (the variables, e.g., "fertilizer rates," "birth rates," "dates").

  *   **Version One (Progressive Shift):** When a prediction fails, you add content to the Protective Belt (the cache). This increases the theory's ability to predict *new* facts. The theory grows.
  *   **Version Two (Degenerating Shift):** When a prediction fails, you adjust the Protective Belt *only* to explain the failure (move the date), without adding new predictive content. The theory shrinks or stagnates. It explains the past perfectly but predicts nothing new.
  *   **Version Three (Reflexivity):** This is outside Lakatos. This is **Reflexivity** (George Soros) or a **Self-Defeating Prophecy** (Robert Merton). The prediction alters the system state.

  ### The Coinage: Temporal Drift
  "Degenerating Shift" is the formal classification, but **Temporal Drift** is the operational label for the move itself.

  **Definition:** *Temporal Drift* occurs when a failed prediction is corrected solely by adjusting the time-parameter ($T$) without adjusting the mechanism-model ($M$).

  *   **Formula:** $Prediction = M \times T$
  *   **Version 1:** $M$ changes (cache added), $T$ changes.
  *   **Version 2:** $M$ stays constant, $T$ changes.
  *   **Version 3:** $M$ stays constant, but the act of Prediction changes the system state $S$.

  ### How to Tell Them Apart (From the Outside)
  You asked for what to look for to distinguish them in real-time. The differentiator is **Information Gain**.

  | Feature | Version 1 (Valid Update) | Version 2 (Temporal Drift) | Version 3 (Reflexivity) |
  | :--- | :--- | :--- | :--- |
  | **Response to Failure** | "We missed a variable." | "We missed the timing." | "We succeeded too well." |
  | **Model Change** | **High.** New mechanics added (e.g., "Cache reduces DB load"). | **Zero.** Mechanics remain identical. | **N/A.** Mechanics valid, but system changed. |
  | **New Prediction** | **Specific.** "Now it breaks at 15x traffic." | **Vague.** "It will break soon/later." | **None.** Outcome prevented. |
  | **Credibility Cost** | Low (Learning demonstrated). | **High** (Should accumulate, but doesn't). | Negative (Credit earned). |
  | **The "Smell"** | Engineering. | Theology / Ideology. | Sociology. |

  **The Operational Test:**
  Ask this question: *"If you are right this time, what specific, new thing will we see between now and the new date that we wouldn't have seen under the old date?"*

  *   **Version 1** will answer: "You'll see the cache hit rate spike before the DB locks." (New observable).
  *   **Version 2** will answer: "You'll see the famine happen." (Same observable, just later).
  *   **Version 3** will answer: "You'll see policy X get passed." (Observable caused by the warning).

  If they cannot name a *new* observable variable that validates the *mechanism* (not just the outcome), it is **Temporal Drift**.

  ### Where This Distinction Is Weakest
  The weak point is **Latency**.

  Sometimes, a Version Two move *becomes* a Version One move later. A theorist might shift the date because they genuinely suspect a variable is missing but haven't identified it yet. They are "buying time" to find the cache equivalent.

  In the short term, a "Degenerating Shift" looks exactly like a "Progressive Shift" in progress. The only way to definitively classify Version Two is **hindsight**. You need to see that the date has moved *multiple times* without the model ever updating.

  **What Would Change My Mind:**
  If the person making the Version Two argument eventually produces a updated model ($M$) that explains *why* the previous dates were wrong (e.g., "We didn't account for nitrogen fixation rates"), then it was not Temporal Drift; it was simply **Slow Learning** (Version 1).

  If they never update the model, but the date keeps moving, it is Temporal Drift.

  ### Summary
  *   **Formal Name:** Degenerating Problem Shift (Lakatos).
  *   **Specific Move:** Ad Hoc Temporal Rescue.
  *   **Your Coinage:** Temporal Drift.
  *   **The Tell:** Zero Information Gain. If the only thing that changes is the calendar, the theory is degenerating.
  *   **The Weakness:** You cannot be 100% sure it's Version Two until they refuse to update the model after multiple failures.

  Use **Temporal Drift**. It signals that the *mechanism* is static while the *goalpost* is fluid. That is the precise engineering failure you are spotting.
