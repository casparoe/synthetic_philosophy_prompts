prompt: |-
  hey — I'm on the benefits committee for my employer's self-insured health plan (we're the people who actually decide what gets covered), and we keep having the same fight: half of us think the plan exists to fix what's broken and nothing more, the other half think paying to make someone better-than-fine is obviously what insurance is for. Before we argue about specific drugs I want the spec. So: write me the desiderata for a therapy/enhancement distinction that could actually be used as a coverage rule — what a line would have to get right for me to trust it, with the case behind each requirement — and tell me which requirements are non-negotiable and which are just one camp wanting the line to deliver its own conclusion.

  Cases it has to handle (add your own; these are the ones that broke us):

  - insulin: fixes no underlying mechanism, restores nothing permanently, and function is normal only for as long as you keep taking it. Any line on which "durable," or "repairs the mechanism rather than managing it," is part of therapy has already lost.
  - the noise town: a town where nearly every adult over 40 has measurable hearing loss from the plant that employs them. Is hearing care treatment there? Does the answer change if the reference population is the species, the country, or the town? And if the real fix is earplugs at the plant or shutting the plant, is that the medical answer or the political one?
  - stimulants for a kid with a diagnosis, for a resident on nights, for a long-haul pilot — same drug, three verdicts, and I want to know whether the difference is really in the intervention.
  - orthodontics after an accident vs. for a teenager with an entirely average overbite in a culture where straight teeth affect getting hired.
  - something that gives a child a capacity no human has had, which is needed for an ordinary life in the environment they'll actually grow up in (make up the environment, I don't mind if it's speculative).
  - the person who doesn't want the fix: Deaf parents declining implants for their kid, someone whose condition is bound up with how they identify. Does "departs from typical" have to mean "worse for this person," and what do we do when the person says it isn't worse — or when they can't say, or when they've adjusted their expectations down to what they think they can get?
  - the ratchet: if we cover something and nearly everyone takes it, does normal move? If normal moves, have we manufactured a new deficiency for everyone who declines, so the line eats its own tail?
  - repurposing: a drug developed for a disease and later used cosmetically, and a cosmetic drug later found to treat a disease. The verdict shouldn't depend on which indication came first.

  Distinctions I keep watching the line collapse: therapy vs. what we owe someone; "not normal" vs. "bad for you"; restoring this person's own baseline vs. raising the floor for everybody; intervention vs. environment; "medically necessary" vs. "works." And it has to be administrable — decided with thin evidence, by non-philosophers, in a way that doesn't secretly track cost or how new the technology is.

  Where I most want you to push: which pair of requirements is jointly unsatisfiable (my guess is that "the baseline has to be value-free and biological" and "the line has to do the moral work — entitlement on one side, suspicion on the other" aren't both available, but say it better than that), and which single requirement eliminates the most popular accounts. Also flag anything on my list that's really just a prejudice of one side of the argument rather than a real desideratum.

  A table is fine, but the requirements are the part I'll use, so keep the weight there. Short scorecard at the end for the two or three standard lines people reach for — the species-typical-function one, the subjective-welfare one, the "what a reasonable person would want" one — if you have room. American English please, and keep it readable enough to be read out loud to a room of managers who do not want a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a benefits committee for a self-insured health plan.
      *   **Problem:** Internal conflict between "fix what's broken" (therapy) vs. "make better-than-fine" (enhancement).
      *   **Task:** Write *desiderata* (requirements) for a therapy/enhancement distinction that can actually serve as a coverage rule. Explain the case behind each requirement. Distinguish between non-negotiable requirements and those that are just one camp's prejudice. Identify jointly unsatisfiable pairs. Identify which requirement kills popular accounts. Provide a scorecard for standard lines.
      *   **Constraints:** Must handle specific cases (insulin, noise town, stimulants, orthodontics, speculative child capacity, Deaf culture, the ratchet, repurposing). Must be administrable (thin evidence, non-philosophers, not secretly cost-driven). American English. Readable for managers.
      *   **Tone:** Professional, pragmatic, analytical, slightly philosophical but grounded in policy.

  2.  **Deconstruct the Conflict:**
      *   *Camp A (Restorative):* Insurance is a safety net. It returns you to baseline. It fixes pathology.
      *   *Camp B (Optimizing):* Insurance is a benefit. It improves welfare. If it helps, it covers.
      *   *The Trap:* Most definitions collapse under edge cases (like insulin or noise town).
      *   *The Goal:* A set of criteria that defines a "good line," even if a perfect line is impossible.

  3.  **Drafting the Desiderata (The Core Task):**
      *   I need to create requirements that a good policy line *should* meet.
      *   *Requirement 1: Mechanism Agnosticism.* (Addresses Insulin/Repurposing). The *how* shouldn't matter as much as the *outcome*.
      *   *Requirement 2: Reference Class Stability.* (Addresses Noise Town/Stimulants). Who are we comparing the patient to? Species? Peers? Job requirements?
      *   *Requirement 3: Welfare Neutrality (or Subjective Alignment).* (Addresses Deaf Culture/Person who doesn't want fix). Does "normal" equal "good"?
      *   *Requirement 4: Dynamic Baseline Resistance.* (Addresses The Ratchet). If everyone does it, does it become mandatory?
      *   *Requirement 5: Administrative Tractability.* (Addresses the "thin evidence" constraint). Can a claims adjuster actually use this?
      *   *Requirement 6: Causal Independence.* (Addresses Orthodontics/Environment). Is the problem the body or the world?

      *Refining the Requirements:* Let's make them punchier and map them directly to the user's "collapse" points.
      1.  *Function over Form:* (Insulin/Repurposing).
      2.  *Contextual Normality:* (Noise Town/Stimulants).
      3.  *Consent-Weighted Welfare:* (Deaf Culture).
      4.  *Ratchet Resistance:* (The Ratchet).
      5.  *Administrative Transparency:* (Cost/Newness).

      *Wait, I need to identify Non-Negotiables vs. Camp Prejudices.*
      *   Non-Negotiable: Administrability, Consistency (Repurposing), Welfare alignment (Deaf culture).
      *   Camp Prejudice: "Must repair mechanism" (Camp A), "Must maximize potential" (Camp B).

      *Wait, I need to identify the Jointly Unsatisfiable Pair.*
      *   The user hinted at "Value-free biological baseline" vs. "Moral work/Entitlement."
      *   Better formulation: *Objective Biological Baseline* vs. *Contextual Welfare Maximization*. You can't have a fixed biological definition of "normal" that also accounts for the "Noise Town" (where abnormal is normal) or the "Deaf Parent" (where abnormal is preferred).
      *   Actually, the strongest tension is between *Stability* (The line doesn't move) and *Fairness* (The line accounts for context). If the line is stable (species-typical), it fails Noise Town. If it's fair (contextual), it fails the Ratchet (normal moves).

  4.  **Addressing the Specific Cases:**
      *   *Insulin:* Mechanism doesn't matter. Management = Therapy.
      *   *Noise Town:* Reference class matters. If the job causes the loss, is it workers' comp or health? If it's the town, is it public health? For health plan: Is hearing loss a pathology relative to *human* function or *town* function?
      *   *Stimulants:* Context of demand. ADHD kid (pathology) vs. Pilot (job requirement) vs. Resident (lifestyle choice?).
      *   *Orthodontics:* Accident (restoration) vs. Culture (enhancement/social necessity).
      *   *Speculative Child:* Environment dictates necessity. If the world changes, the "defect" changes.
      *   *Deaf Parents:* Subjective welfare > Objective normality.
      *   *Ratchet:* Coverage creates new norms.
      *   *Repurposing:* Indication > History.

  5.  **Developing the "Unsavory Truths" (The Push):**
      *   The user wants me to say what breaks.
      *   *The Impossible Pair:* **Biological Objectivity** and **Contextual Fairness**. You cannot define "health" purely biologically (species-typical) and expect it to handle the Noise Town or the Deaf Culture cases fairly. Conversely, if you define it by welfare/context, you lose the bright line needed for administration.
      *   *The Killer Requirement:* **Administrative Tractability.** This kills the nuanced welfare accounts. Philosophers love them; claims adjusters hate them.
      *   *Prejudice Check:* "Must cure the root cause" is Camp A prejudice (fails insulin). "Must allow optimization" is Camp B prejudice (fails cost control/sustainability).

  6.  **Structuring the Response:**
      *   **Intro:** Acknowledge the difficulty. Validate the "Insulin" point immediately (it's the classic gotcha).
      *   **The Desiderata Table:** Requirement, What it demands, Why it's needed (Case), Negotiability.
      *   **The Unsatisfiable Pair:** Explain the tension.
      *   **The Killer Requirement:** Identify the one that wipes out standard theories.
      *   **Prejudice Check:** Call out the hidden biases.
      *   **Scorecard:** Rate Species-Typical, Subjective Welfare, and Reasonable Person.
      *   **Conclusion:** Practical advice.

  7.  **Drafting Content - Iteration & Refinement:**
      *   *Tone Check:* Keep it crisp. No jargon like "teleological." Use "goal-oriented."
      *   *Insulin:* Make sure to emphasize that *management* counts as therapy.
      *   *Noise Town:* This is about the *reference class*.
      *   *Ratchet:* This is about *dynamic consistency*.
      *   *Unsatisfiable Pair:* Let's call it "The Baseline Paradox." A fixed baseline is unfair; a flexible baseline is unadministrable.
      *   *Scorecard:* Be ruthless. Species-typical fails Noise Town. Subjective fails Ratchet. Reasonable Person is too vague.

  8.  **Final Review against Constraints:**
      *   American English? Yes.
      *   Readable aloud? Yes, keep sentences varied but clear.
      *   All cases addressed? Yes, woven into the requirements.
      *   Non-negotiables identified? Yes.
      *   Prejudices flagged? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting a specific policy. The prompt asks for *desiderata for a distinction*, not the policy itself. I need to define what a *good rule* looks like, not necessarily write the rule (though implying the direction is helpful).
      *Correction:* The prompt asks for "desiderata for a therapy/enhancement distinction... with the case behind each requirement." Okay, I will list the requirements for the *definition itself*.

      *Refining the "Unsatisfiable Pair":* The user suggested "value-free biological" vs "moral work." I should refine this to **"Biological Stability" vs. "Contextual Justice."** A biological definition (species-typical) is stable but unjust in the Noise Town. A contextual definition is just in the Noise Town but unstable (Ratchet).

      *Refining the "Killer Requirement":* **Administrative Tractability.** Most philosophical definitions (like Norman Daniels' "fair equality of opportunity") are too complex for a claims adjuster with 5 minutes and a fax machine.

      *Refining Prejudices:*
      *   Camp A Prejudice: "Therapy must restore a prior state." (Fails congenital issues).
      *   Camp B Prejudice: "If it improves function, it's covered." (Ignores sustainability/ratchet).

      *Let's build the table.*
      *   Req 1: Mechanism Agnosticism (Insulin/Repurposing).
      *   Req 2: Reference Class Transparency (Noise Town/Stimulants).
      *   Req 3: Welfare Sovereignty (Deaf Culture).
      *   Req 4: Ratchet Resistance (The Ratchet).
      *   Req 5: Administrative Tractability (General constraint).

      *Wait, one more thing:* The prompt asks to "tell me which requirements are non-negotiable and which are just one camp wanting the line to deliver its own conclusion." I need to be explicit about this in the table or analysis. I'll add a column or section for it. A column in the table is cleaner.

      *Final Polish:* Ensure the "Noise Town" distinction is clear. Is it medical or political? The desideratum should force the committee to decide if they cover *health* or *employability*.

      *Okay, ready to write.*
answer: |-
  This is the hardest problem in benefits design. You are asking for a bright line where there is only a gradient. Most committees pretend the line is obvious until a specific claim forces them to admit it isn't.

  You asked for the *desiderata*—the requirements a successful distinction must meet—along with the cases that demand them, a check on which are non-negotiable versus partisan, and the structural contradictions that make this impossible to solve perfectly.

  Here is the specification for a therapy/enhancement distinction that can survive contact with reality.

  ### The Desiderata Table

  | Requirement | What the Line Must Do | The Case Behind It | Negotiability |
  | :--- | :--- | :--- | :--- |
  | **1. Mechanism Agnosticism** | The distinction cannot depend on *how* the intervention works (repair vs. manage) or its history (drug origin). It must depend on the *functional gap* being addressed. | **Insulin & Repurposing.** Insulin manages rather than cures, yet is clearly therapy. A drug developed for acne that cures a hormonal disorder is therapy, not cosmetic. If the rule requires "permanent repair," you lose insulin. If it requires "disease origin," you lose repurposing. | **Non-Negotiable.** If you fail this, you exclude standard care or create arbitrary loopholes. |
  | **2. Reference Class Transparency** | The line must explicitly state who the patient is being compared to. Is "normal" defined by the species, the local population, or the job requirements? | **Noise Town & Stimulants.** In a town where everyone is deaf, is hearing loss a pathology? For a pilot, is alertness a health need or a job requirement? A rule that hides the reference class will yield inconsistent verdicts for the same drug (e.g., Adderall). | **Non-Negotiable.** You cannot adjudicate "need" without defining "normal." |
  | **3. Welfare Sovereignty** | The line must allow that "typical function" does not always equal "well-being." If a patient (or guardian) credibly asserts that a condition is not a harm to them, the line must accommodate that. | **Deaf Culture.** If Deaf parents reject implants, covering the implant as "therapy" imposes a value judgment that Deafness is a deficit. The line must distinguish between *medical incapacity* and *social disadvantage* and respect the patient's valuation. | **Non-Negotiable.** Ignoring this turns health care into forced assimilation. |
  | **4. Ratchet Resistance** | The line must not automatically shift the definition of "normal" just because an intervention becomes common. Coverage should not create the deficiency it claims to fix. | **The Ratchet.** If we cover a cognitive enhancer and 80% of employees take it, does the remaining 20% now have a "deficit"? If the line moves with adoption rates, you create a treadmill where coverage obligations expand infinitely. | **Camp A Priority.** Camp B often ignores this, assuming "more function = better." Camp A knows this breaks the budget. |
  | **5. Environmental Independence** | The line must distinguish between fixing the person and fixing the environment. It should not cover medical interventions for problems caused by toxic environments unless the environment cannot be fixed. | **Noise Town (Part 2).** If the plant causes the hearing loss, is the solution hearing aids (medical) or earplugs/regulation (safety)? Covering the aid treats the symptom but subsidizes the hazardous condition. | **Camp A Priority.** Camp B tends to treat the patient regardless of cause. Camp A sees this as moral hazard. |
  | **6. Administrative Tractability** | The rule must be decidable by a non-philosopher with limited evidence (claims data, FDA indication) without requiring a deep investigation into the patient's life context. | **All Cases.** A perfect philosophical line is useless if a claims adjuster can't apply it. If the rule requires knowing the patient's identity, culture, or job market, it will be applied inconsistently or litigated endlessly. | **Non-Negotiable.** If you can't administer it, it's not a policy; it's a mission statement. |

  ### The Unsatisfiable Pair: The Baseline Paradox

  You asked where the line breaks. It breaks here: **Biological Stability** and **Contextual Justice** are jointly unsatisfiable.

  *   **Biological Stability** demands a fixed reference class (e.g., "species-typical function"). This satisfies *Administrative Tractability* and *Ratchet Resistance*. It doesn't matter if everyone in town is deaf; biologically, hearing is the norm.
  *   **Contextual Justice** demands the reference class shift to match reality (e.g., "local typical function" or "environmental demands"). This satisfies *Welfare Sovereignty* and *Reference Class Transparency*. If the town is deaf, hearing aids are enhancement; if the job requires alertness, stimulants are therapy.

  **The Conflict:** You cannot have a definition of "therapy" that is biologically fixed *and* contextually fair.
  *   If you fix the baseline (Species-Typical), you fail the **Noise Town** (you treat a local norm as a disease) and the **Deaf Parent** (you impose an external value of "hearing").
  *   If you flex the baseline (Contextual), you fail the **Ratchet** (normal moves as tech spreads) and **Administrative Tractability** (every claim requires a sociological study of the patient's environment).

  **Recommendation:** Pick one. Most self-insured plans secretly choose **Biological Stability** (FDA indications + ICD codes) because it is the only one that survives audit. But you must admit that this means you are *not* covering "health" in the holistic sense; you are covering "deviation from species-typical biology."

  ### The Killer Requirement

  **Administrative Tractability** eliminates the most popular accounts.

  *   **Norman Daniels' "Fair Equality of Opportunity":** This is the gold standard in bioethics (therapy restores opportunity; enhancement boosts it). It fails the **Stimulant** case. Does a resident need stimulants for opportunity (career) or health (wakefulness)? It requires a deep dive into the patient's life goals. A claims adjuster cannot do this.
  *   **Subjective Welfare:** "If the patient feels better, it's therapy." This fails the **Ratchet**. If everyone feels better with a tweak, everything becomes therapy. It also fails the **Deaf Parent** case (who decides which subjective welfare counts?).
  *   **Species-Typical Function:** This is the only one that is administrable (look up the biology), but it fails the **Insulin** case (if "typical" includes diabetics, is it therapy?) and the **Noise Town** case.

  If you require the rule to be used by humans under time pressure, you eliminate any definition that relies on "opportunity," "flourishing," or "identity." You are left with biology and codes.

  ### Prejudice Check: What's Actually a Demand?

  Be careful. Some of your committee's "requirements" are just conclusions disguised as criteria.

  1.  **"Must repair the underlying mechanism." (Camp A Prejudice)**
      *   *Verdict:* **Discard.** As you noted with **Insulin**, this is scientifically illiterate. Chronic disease management is the bulk of modern medicine. If you require "cure," you exclude diabetes, hypertension, and HIV.
  2.  **"Must restore the patient's own baseline." (Camp A Prejudice)**
      *   *Verdict:* **Discard.** Fails congenital conditions. A child born with a defect has no "prior baseline" to restore.
  3.  **"If it works, it's covered." (Camp B Prejudice)**
      *   *Verdict:* **Discard.** This ignores **The Ratchet** and cost. It makes the plan a lifestyle subscription service rather than insurance.
  4.  **"Medically Necessary." (Both Camps Prejudice)**
      *   *Verdict:* **Discard as a definition.** This is a placeholder, not a rule. It just means "we decided to cover it." Using it as a criterion is circular.

  ### Scorecard: Standard Lines Against Your Cases

  Here is how the three most common definitions perform against your specific stress tests.

  | Definition | Insulin | Noise Town | Stimulants | Deaf Culture | The Ratchet | Admin Score |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Species-Typical Function**<br>*(Restores normal human biology)* | **PASS**<br>(Biology is broken) | **FAIL**<br>(Treats local norm as disease) | **MIXED**<br>(Depends on if ADHD is "biological") | **FAIL**<br>(Imposes hearing as "good") | **PASS**<br>(Biology doesn't move) | **HIGH**<br>(Easy to check) |
  | **Subjective Welfare**<br>*(Improves patient well-being)* | **PASS** | **PASS** | **PASS** | **PASS**<br>(Respects choice) | **FAIL**<br>(Normal moves with demand) | **LOW**<br>(Requires mind-reading) |
  | **Fair Opportunity**<br>*(Restores ability to compete)* | **PASS** | **MIXED**<br>(Is hearing needed to compete in town?) | **FAIL**<br>(Is the job requirement a "right"?) | **FAIL**<br>(Who defines opportunity?) | **FAIL**<br>(Arms race for advantage) | **MED**<br>(Vague) |

  ### The Bottom Line for the Committee

  You cannot write a rule that satisfies both camps because the camps are arguing about the *purpose of the plan*, not the definition of therapy.

  *   **Camp A** wants the plan to be a **Safety Net** (catch you when you fall below biological baseline).
  *   **Camp B** wants the plan to be a **Benefit** (help you succeed in your specific context).

  **The only administrable solution:**
  Adopt **Species-Typical Function** (FDA indication + ICD code) as the *default* line for therapy. It handles **Insulin** and **Repurposing** well enough.
  *   *Concession to Camp B:* Create a separate, capped "Wellness/Optimization" bucket for things that fail the biological test but pass a welfare test (e.g., orthodontics, certain stimulants).
  *   *Concession to Camp A:* Explicitly exclude interventions where the "deficit" is created by the intervention's own popularity (**Ratchet**) or where the environment is the clear cause (**Noise Town**).

  Do not try to philosophize the line into existence. Define the baseline biologically, admit the exceptions explicitly, and stop pretending "medically necessary" is a scientific term. It's a budget decision.
