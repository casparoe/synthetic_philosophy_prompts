      *   *Reading 3: Pretense/Make-Believe.* I engage in a game of "let's pretend."
      *   *Reading 4: Temporary Belief.* I actually believe it for a moment, then stop.
      *   *Reading 5: Quasi-Belief/Imagination.* I simulate belief without the cognitive commitment.
