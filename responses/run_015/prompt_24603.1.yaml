  **Q1: Actual Outcomes vs. Expected Utility.**

  If you convince your friend that **Expected Utility** is the only rational metric for moral decision-making (which it is), his entire argument collapses for the meat case immediately.
  *   **If Q1 shifts:** If you accept Strict Actualism (your friend's view), my credence that they are "on par" jumps from **0.25 to 0.9**. Under Strict Actualism, neither your vote nor your burger *actually* changes the world in isolation. They become identical.
  *   **If Q1 holds (Expected Utility):** The cases diverge. Meat has high probability/low impact. Voting has low probability/high impact. They are no longer "on par."

  **What would actually move the number?**
  Empirical evidence on **Supply Chain Thresholds (Q2)**. If a major economic study proved that retail purchases of meat are completely decoupled from production orders (e.g., farmers produce fixed quotas regardless of supermarket sales data), the causal link breaks. That would move my credence that they are "on par" up to **0.6**, because then Meat becomes a "drop in the ocean" in reality, not just in perception.

  ---

  ### 4. Verdict: Who is Wrong?

  **Your friend (0.8) is significantly more likely to be wrong.**
  You (0.2) are much closer to the philosophical and economic consensus.

  **Where does the disagreement actually live?**
  It is not primarily about the market mechanics (Q2), though that's where you think it is. It lives in **Q1 (The Definition of Efficacy).**

  Your friend is making a category error common in naive consequentialism: conflating **Epistemic Uncertainty** with **Ontological Inefficacy**.
  *   **Voting:** You are uncertain if you are pivotal, but the mechanism is binary (you either are or aren't).
  *   **Meat:** You are uncertain *when* your purchase triggers a threshold, but the mechanism is aggregative (your purchase is part of a causal chain that *definitely* affects total demand).

  By insisting on *Actual Outcomes*, your friend is demanding certainty in a probabilistic universe. If he conceded that **Expected Value** is what matters for rational action, he would have to admit that buying a chicken has a higher expected negative utility than casting a vote has expected positive utility (per unit of effort).

  **The pivot point:** Ask him this: *"If you buy insurance for your house, and your house doesn't burn down, was buying the insurance a worthless action because it didn't change the outcome?"*
  If he says "No, it was rational because of the risk," he has conceded Q1. If he has conceded Q1, he cannot consistently claim your burger is worthless just because it didn't *definitively* save a cow. He has to weigh the probability. And once he weighs probability, the market case (high prob) beats the voting case (low prob), and they are no longer "on par."
