answer: |-
  Here is the decomposition you asked for. I'll treat the target claim as: **"The inefficacy objection defeats the reason to eat meat just as thoroughly as it defeats the reason to vote"** (i.e., they are morally on par in their worthlessness).

  My final credence in this claim is **0.25**.

  This is close to your 0.2, meaning I think you are much closer to the truth than your friend. Below is the breakdown of why, structured by the four sub-questions you identified, plus the synthesis.

  ### 1. The Decomposition

  **Q1: Is the correct moral metric *Actual Outcomes* (Strict Act Consequentialism) or *Expected Utility*?**
  *   **The Issue:** Your friend argues from *Actual Outcomes* ("if my action doesn't change the outcome..."). Standard decision theory and most modern consequentialists argue from *Expected Utility* (probability × magnitude). If you maximize expectation, you are rational even if you turn out to be causally inert in the actual world.
  *   **My Probability:** **0.1** that Strict Actualism is the correct metric.
  *   **Reasoning:** If we judge actions by actual outcomes rather than expectations, we would have to condemn buying insurance, wearing seatbelts, or administering vaccines in low-prevalence areas whenever the bad thing doesn't happen. This makes the moral framework unusable for decision-making. Almost all plausible consequentialist frameworks rely on expectation. If we use Expectation, the "inefficacy objection" collapses immediately for meat (high probability of small impact) even if it sticks to voting (tiny probability of huge impact).

  **Q2: Does an individual purchase in a competitive market have a genuinely nonzero causal contribution?**
  *   **The Issue:** Your friend claims the market absorbs your purchase without changing production ("price-taker," "rounding errors"). The counter-argument is the "Threshold Model" (orders are placed in crates/batches; your purchase might trigger the next batch) or the "Price Elasticity Model" (your purchase raises price slightly, lowering demand elsewhere).
  *   **My Probability:** **0.05** that the causal contribution is effectively zero.
  *   **Reasoning:** Empirical work by economists and philosophers (e.g., Peter Singer, Shelly Kagan, Albert & Lindblom) suggests supply chains are responsive. While you won't buy exactly *one* less chicken, you have a 1/N chance of triggering an order for a crate of N chickens. The *expected* number of chickens saved is roughly 1 per X purchases. It is not ontologically zero; it is probabilistic.

  **Q3: Is there a threshold below which a real contribution is swamped by cost ("nonzero but tiny" = "zero")?**
  *   **The Issue:** Even if your purchase saves 0.0001 of a cow, does that moral weight exist, or is it de minimis? Your friend argues "drop in the ocean" implies moral zero.
  *   **My Probability:** **0.2** that tiny contributions are morally negligible.
  *   **Reasoning:** Consequentialism is aggregative. If 10,000 people think their drop is negligible, the ocean dries up. Unless one adopts a "threshold deontology" (harm only matters after a certain point), small expected harms accumulate. However, there is a pragmatic argument that if the cost to the agent is high and the impact is vanishingly small, the *net* utility might be negative. I grant a small probability here that the "signal noise" of individual consumption is too low to mandate sacrifice.

  **Q4: Is the voting case really exactly-zero, or does it have its own expected utility?**
  *   **The Issue:** You argue voting is "literally never" pivotal. Mathematically, it's non-zero (e.g., 1 in 10 million). If voting has positive expected utility (Value of Democracy × Prob Pivotal), it is structurally the *same* kind of argument as meat (Value of Animal × Prob Impact), just with different variables.
  *   **My Probability:** **0.3** that Voting and Meat are comparable in magnitude.
  *   **Reasoning:** While both rely on expected utility, the magnitudes differ. Most calculations suggest the expected utility of abstaining from meat (per hour/dollar) is significantly higher than the expected utility of voting (per hour/dollar). Voting is a "lottery ticket" with a huge jackpot but infinitesimal odds. Meat is a "steady investment" with small returns but high odds. They are not "on par" in efficacy, even if both are non-zero.

  ---

  ### 2. Synthesis: How These Combine

  To arrive at the final number (**0.25**), I am calculating the probability that your friend's conclusion holds (that both are defeated/on par).

  For your friend to be right, **one** of the following "Failure Modes" for the Meat Case must be true:
  1.  **Strict Actualism is true** (Prob: 0.1). If so, both voting and meat are worthless because neither *actually* changes the world in most instances.
  2.  **Market Causality is zero** (Prob: 0.05). If so, meat is worthless even under Expected Utility.
  3.  **Tiny Impacts don't count** (Prob: 0.2). If so, the expected value of meat is morally rounded to zero.

  *Note: I am treating these as roughly independent pathways to the friend's conclusion.*

  The probability that **none** of these are true (meaning the Meat Case survives the objection) is:
  $0.9 \text{ (Not Actualism)} \times 0.95 \text{ (Causality Exists)} \times 0.8 \text{ (Tiny Counts)} = 0.684$

  So, there is a **68.4%** chance the Meat Case survives.
  However, for them to be **"On Par,"** the Voting Case must also survive *and* be of similar magnitude.
  Even if Meat survives (68.4%), there is only a **30%** chance (from Q4) that Voting is comparable in magnitude.

  So, the probability they are **On Par (Both Defeated OR Both Surviving & Equal)** is:
  $P(\text{Both Defeated}) + P(\text{Both Survive} \times \text{Comparable})$
  $P(\text{Both Defeated}) \approx 1 - 0.684 = 0.316$ (Using the most sensitive path).
  $P(\text{Both Survive} \times \text{Comparable}) \approx 0.684 \times 0.3 = 0.205$.

  Wait, this logic is getting slightly circular. Let's simplify for the final credence:
  The claim is "The objection defeats Meat *as well as* it defeats Voting."
  Since the objection defeats Voting with high probability (in practical terms, EU is very low), the claim rests on: **Does the objection defeat Meat?**
  Based on the calculation above ($1 - 0.684$), there is roughly a **31%** chance the objection defeats Meat.
  However, I am more confident in the "Expected Utility" rebuttal (Q1) than the calculation suggests. If Q1 is resolved (which it should be), the probability drops significantly.
  Adjusting for the high confidence in Expected Utility theory:
  **Final Credence: 0.25.**

