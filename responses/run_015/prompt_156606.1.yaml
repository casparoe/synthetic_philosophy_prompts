  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A volunteer moderator of a large public history forum. No academic training, 15 years experience.
      *   **Problem:** Distinguishing between sincere but pseudohistorical posts (lost civilizations, chronology revisionism, etc.) and legitimate historical inquiry/disputes without acting as subject-matter experts.
      *   **Goal:** A "triage rule" or specification of standards for historical claims.
      *   **Constraints:**
          *   Usable in minutes by a generalist mod.
          *   Applicable in public (must show work/justify decisions).
          *   Must output an action (Remove, Leave, Label, Question).
          *   Must distinguish truth from *warranted assertability*.
          *   Must analyze requirements (Non-negotiable vs. Preference vs. False Demand).
          *   Must identify trade-offs (incompatible desiderata).
          *   Must identify the single most effective requirement.
          *   Must handle specific test cases (Atlantis, Von Däniken, Fomenko, meme-archaeology vs. Wegener, Schliemann, Ugarit, L'Anse aux Meadows, Bronze Age Collapse, Nationalist history).
          *   Must address the user's hunches (mechanical rules get gamed, retrospective testing, expertise trap, burden of explanation, symmetry test, unit of assessment, error costs, publication form).
          *   **Final Output:** Score specific contenders (Consensus, Falsifiability, Responsiveness, Burden of Proof, Progressiveness, Conspiracy Size) and determine if "pseudohistory" is one thing or many.
          *   **Negative Constraint:** No bibliography, no "ask an expert" advice.

  2.  **Deconstruct the Core Challenge:**

      *   The mod cannot judge *truth*. They must judge *process* and *engagement with evidence*.
      *   Pseudohistory often mimics the *form* of history (footnotes, maps, confident tone) but fails on *method* (cherry-picking, conspiracy reliance, immunity to counter-evidence).
      *   Legitimate history often looks uncertain, debated, and relies on consensus that shifts.
      *   The "Gatekeeping" accusation is the main threat. The standard must be defensible without saying "Because experts say so."

  3.  **Evaluate the User's Hunches:**

      *   *Mechanical rules get gamed:* True. Footnotes can be fake. Tone can be faked.
      *   *Retrospective testing:* Crucial. We can't judge Wegener by 1915 standards of mechanism, but we can judge if he engaged with 1915 geology.
      *   *Expertise trap:* If the rule requires knowing Sumerian, it fails. It must rely on structural features of the argument.
      *   *Explaining the record:* High value. Pseudohistory focuses on anomalies; history focuses on the whole pattern.
      *   *Symmetry test:* Useful for detecting bias, but doesn't prove truth.
      *   *Unit of assessment:* Must be the *claim/post*, not the person. A crank can make a valid point; a professor can make a bad one.
      *   *Error costs:* False positives (banning truth) vs. False negatives (allowing nonsense). In a public forum, noise degrades signal faster than silence hides truth.
      *   *Publication form:* Weak indicator. Self-publishing is common now; peer review is gatekept. Form alone shouldn't decide.

  4.  **Develop the Triage Standard (The "Specification"):**

      *   I need a set of requirements. Let's call them "Warrants."
      *   *Requirement 1: Engagement with the Counter-Case.* (Non-negotiable). Does the post acknowledge why the mainstream view exists and address it?
      *   *Requirement 2: Falsifiability/Specific Prediction.* (Non-negotiable). What evidence would prove this *wrong*?
      *   *Requirement 3: Conspiracy Load.* (Preference/Threshold). Does the claim require assuming bad faith by thousands of independent actors?
      *   *Requirement 4: Source Transparency.* (Non-negotiable). Can the evidence be checked by a third party?

  5.  **Analyze Trade-offs (Incompatible Desiderata):**

      *   *Speed vs. Nuance:* You can't have a 5-minute triage that captures the nuance of Bronze Age Collapse debates.
      *   *Openness vs. Signal-to-Noise:* Allowing every "sincere" theory degrades the forum. Banning them risks missing the next Schliemann.
      *   *Neutrality vs. Expertise:* Claiming neutrality while enforcing methodological naturalism looks like bias to the conspiracist.

  6.  **Address the Test Cases:**

      *   *Atlantis/Von Däniken/Fomenko:* Fail on Engagement (ignore counter-evidence) and Conspiracy (global suppression).
      *   *Meme-archaeology:* Fails on Source Transparency (no author/chain of custody).
      *   *Wegener/Schliemann/Ugarit/L'Anse aux Meadows:* Pass on Engagement (worked within/against existing data), Falsifiability (dig here, find this), and low Conspiracy Load.
      *   *Bronze Age Collapse:* Pass on Engagement (acknowledges multiple hypotheses).
      *   *Nationalist Myth:* Fails on Symmetry (applies strict standards to others, loose to self).

  7.  **Address the "Pseudohistory" Ontology:**

      *   Is it one thing? No. It's usually a cluster of failures.
      *   1. *Methodological Failure* (Cherry-picking).
      *   2. *Sociological Failure* (Insularity/Immunization).
      *   3. *Evidentiary Failure* (Conspiracy reliance).

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, direct, respectful of the mod's position. No academic jargon.
      *   *Structure:*
          1.  The Specification (The Rules).
          2.  Requirement Analysis (Non-negotiable vs. Preference vs. False).
          3.  Trade-offs (The "Cannot Haves").
          4.  The Single Most Effective Requirement.
          5.  The Ontology of Pseudohistory.
          6.  The Scoring Table (as requested).

      *   *Refining the "Single Most Effective Requirement":* It's likely "Engagement with the Counter-Case" or "Conspiracy Load." Conspiracy Load is easier for a layperson to spot. "If your theory requires 500 archaeologists to lie, that's the hurdle." But "Engagement" is more fundamental to history. Let's go with *Burden of Explanation regarding the Mainstream Record*. It covers conspiracy without needing to prove malice.

      *   *Refining the Scoring:*
          *   Consensus: Proxy, not proof.
          *   Falsifiability: Essential but can be gamed ("I'll prove it later").
          *   Responsiveness: Key differentiator.
          *   Burden of Proof: Standard logic.
          *   Progressiveness: Hard to judge in 5 mins.
          *   Conspiracy Size: The "Smell Test."

      *   *Wait, check the prompt's specific request on scoring:* "Score the obvious contenders against the list... and tell me which of these are really the same test wearing different clothes."
      *   *Check the prompt's specific request on Requirements:* "List of requirements... marked as non-negotiable, preference, or demand that only looks like a requirement."

      *   *Check the prompt's specific request on Trade-offs:* "Which pairs of desiderata cannot both be satisfied."

      *   *Check the prompt's specific request on Ontology:* "Does 'pseudohistory' survive as a single thing?"

  9.  **Final Polish:** Ensure I don't lecture on history. Ensure I answer the specific questions about the *rules themselves*. Make sure the distinction between "truth" and "warranted assertability" is clear.

      *(Self-Correction during drafting)*: I need to be careful not to make the rules *too* complex. The mod has 5 minutes. The rules need to be heuristics, not a PhD thesis.
      *   *Heuristic 1:* Does it explain the silence? (The "Dog Didn't Bark" rule).
      *   *Heuristic 2:* Is the evidence checkable? (The "Chain of Custody" rule).
      *   *Heuristic 3:* Does it treat its own evidence differently than opposing evidence? (The "Symmetry" rule).

      Let's integrate these into the "Specification."

      *Re-evaluating the "Single Requirement":* The prompt asks "which single requirement does the most work in ruling candidates out."
      *   Candidate: *The Burden of the Negative.* (Explaining why the mainstream evidence exists if the theory is true). This catches Fomenko (why do carbon dates exist?), Atlantis (why no geological trace?), Von Däniken (why do we have the blueprints for the pyramids?). It lets Wegener pass (he admitted he lacked a mechanism but showed the fit).

      *Re-evaluating "Pseudohistory":* It falls apart. It's not a genre; it's a failure mode.

      *Re-evaluating the Scoring Table:* I need to score Consensus, Falsifiability, Responsiveness, Burden, Progressiveness, Conspiracy.
      *   Consensus & Progressiveness are similar (looking at the community).
      *   Burden & Falsifiability are similar (looking at the logic).
      *   Responsiveness & Conspiracy are similar (looking at the behavior).

      Okay, ready to write.

  10. **Final Review against constraints:**
      *   No bibliography? Checked.
      *   No "ask an expert"? Checked.
      *   Specific formatting for requirements? Checked.
      *   Specific formatting for scoring? Checked.
      *   Address the "hunches"? Yes, weave them into the justification.

      *One last thought on the "Action" output:* The prompt asks for "remove, leave alone, leave up with a label, or ask the poster one specific question." I need to make sure the rules map to these actions.
      *   Fail Non-negotiable -> Remove.
      *   Pass Non-negotiable, Fail Preference -> Label/Question.
      *   Pass All -> Leave Alone.

      Let's assemble.

      *(Self-Correction on "Consensus")*: The prompt explicitly says I can't rely on "ask a professor." So "Deference to specialist consensus" as a rule is a "False Demand" or at best a "Preference" that risks the gatekeeping accusation. I need to frame it as "Engagement with existing arguments" rather than "Agreement with experts."

      *(Self-Correction on "Conspiracy")*: Be careful not to ban *all* conspiracy theories (some are true), but ban *unwarranted scale*.

      *(Final Plan)*:
      1.  Introduction: Acknowledge the difficulty.
      2.  The Specification (The 3 Rules).
      3.  Requirement Analysis (Categorization).
