answer: |-
  Here is the specification for a triage standard designed for your constraints. It treats history not as a body of facts to be defended, but as a method of argumentation to be audited.

  ### The Specification: The "Three Warrants"

  To remain on the forum, a historical claim must satisfy three warrants. These are procedural, not substantive. They do not ask *if* the claim is true, but *how* it handles the existing record.

  **1. The Warrant of Negative Explanation (Non-Negotiable)**
  *   **The Rule:** The post must explicitly account for the evidence that supports the mainstream view it seeks to overturn. It cannot simply point to anomalies; it must explain why the "wrong" view looks so right.
  *   **The Action:** If the post ignores the counter-evidence or dismisses it as "establishment dogma" without specific engagement, **Remove**.
  *   **The Case:** This handles Fomenko (why do carbon dates align across cultures if the timeline is fake?), Atlantis (where is the geological shelf?), and Von Däniken (why do we have quarry records for the pyramids?). It allows Wegener (he admitted he lacked a mechanism but showed the continental fit) and Schliemann (he acknowledged the *Iliad* was myth but hypothesized a kernel of truth).

  **2. The Warrant of Checkable Provenance (Non-Negotiable)**
  *   **The Rule:** Every piece of physical or documentary evidence cited must be traceable to a location, collection, or publication where a third party can verify its existence and context. "Leaked" documents, anonymous photographs, or artifacts held in private collections without catalog numbers fail this warrant.
  *   **The Action:** If evidence is uncheckable, **Ask the poster one specific question**: "Where can a member of this forum independently verify this image/document?" If unanswered in 48 hours, **Remove**.
  *   **The Case:** This handles the meme-archaeology (windows below street level, star-shaped earthworks) which vanishes upon reverse image search or geolocation. It protects the forum from fabricated evidence while allowing legitimate amateur finds (e.g., a metal detectorist reporting a find to a local museum).

  **3. The Warrant of Symmetrical Skepticism (Preference)**
  *   **The Rule:** The standard of proof applied to the mainstream view must be the same as the standard applied to the new claim. If the poster demands absolute certainty for the accepted timeline but accepts oral tradition for their own, they fail.
  *   **The Action:** If the standards are asymmetrical, **Leave up with a Label**: *"Moderator Note: This argument applies different evidentiary standards to opposing claims."*
  *   **The Case:** This handles nationalist myth (demanding written proof for enemies, accepting oral history for self) and honest error (applying high standards universally but getting the math wrong).

  ---

  ### Analysis of Requirements

  Here is the classification of the demands you listed, based on the specification above.

  | Requirement | Classification | Consideration |
  | :--- | :--- | :--- |
  | **Engagement with Counter-Evidence** | **Non-Negotiable** | This is the only way to distinguish revisionism from denialism without needing subject expertise. If you can't explain why the world looks the way it does if you're right, you aren't doing history. |
  | **Traceable Evidence** | **Non-Negotiable** | A claim without verifiable data is fiction. This is a hard technical constraint, not a judgment on truth. |
  | **Symmetrical Skepticism** | **Preference** | Bias is common in legitimate history too. Flagging it informs the audience without silencing the poster. |
  | **Consensus Deference** | **False Demand** | Relying on "what experts say" invites the gatekeeping accusation you wish to avoid. Consensus is an outcome, not a method. |
  | **Mechanism Provision** | **False Demand** | As Wegener shows, you can be right without knowing *how* it happened. Demanding a mechanism kills legitimate hypothesis generation. |
  | **Publication Form** | **False Demand** | Peer review is a quality filter, but self-publishing is not proof of falsehood. Judge the argument, not the venue. |
  | **Retrospective Testing** | **Preference** | Useful for internal mod training, but useless for real-time triage. |
  | **Unit of Assessment (Claim vs. Person)** | **Non-Negotiable** | You must moderate the post, not the poster. A known crank can post a valid map; a professor can post a typo. |

  ---

  ### Incompatible Desiderata (The Trade-Offs)

  You suspected there are pairs that cannot both be satisfied. You are correct. You must choose which error cost you are willing to bear.

  1.  **Speed vs. Nuance:** You cannot have a 5-minute triage rule that correctly sorts complex, borderline academic disputes (e.g., the specific causes of the Bronze Age Collapse).
      *   *Resolution:* The rule must default to **Leave up with a Label** for complex disputes where both sides cite evidence, and **Remove** only for procedural failures (no sources, no counter-argument). You will allow some noise to avoid suppressing legitimate debate.
  2.  **Neutrality vs. Methodological Naturalism:** You cannot be neutral between a claim that relies on natural causes and one that relies on hidden agency (conspiracy), because the latter is unfalsifiable by design.
      *   *Resolution:* You must privilege **falsifiability**. A claim that explains away all counter-evidence via "suppression" is not a historical claim; it is a belief system. The rule treats this as a procedural failure (Violation of Warrant 1).
  3.  **Openness vs. Signal-to-Noise:** You cannot be fully open to all sincere posters and maintain a high-signal forum.
      *   *Resolution:* Prioritize **Signal**. The "Burden of Negative Explanation" is high. It will filter out 90% of pseudohistory, but it may also filter out a sincere amateur who doesn't know how to articulate the counter-case. This is the acceptable cost.

  ---

  ### The Single Most Effective Requirement

  **The Warrant of Negative Explanation (Burden of the Record).**

  This does the most work. Pseudohistory almost invariably focuses on *anomalies* (this stone is too heavy, this date is too old) while ignoring the *pattern* (thousands of other stones match the tech, hundreds of other dates align).
  *   It rules out Atlantis (no geological anomaly).
  *   It rules out Fomenko (requires global conspiracy to fake carbon dating).
  *   It rules out Von Däniken (requires ignoring human engineering records).
  *   It *allows* Schliemann (acknowledges the myth, seeks the location).
  *   It *allows* Wegener (acknowledges the lack of mechanism, points to the data).

  It forces the poster to do the historical work (synthesizing the record) rather than the rhetorical work (pointing out puzzles).

  ---

  ### The Ontology of "Pseudohistory"

  **Does "pseudohistory" survive as a single thing?**
  **No.** It falls apart into three distinct failure modes that your rule targets separately.

  1.  **Methodological Failure:** Cherry-picking data while ignoring the bulk of the record. (Targeted by Warrant 1).
  2.  **Evidentiary Failure:** Relying on data that cannot be verified by others. (Targeted by Warrant 2).
  3.  **Sociological Failure:** Immunizing the claim from criticism by alleging bad faith in critics. (Targeted by Warrant 1 & 3).

  Calling it all "pseudohistory" allows proponents to argue they are being persecuted for a single label. Naming the specific failure (e.g., "This claim relies on unverifiable images") is defensible in public.

  ---

  ### Scoring the Contenders

  Here is how the standard criteria perform against your requirements (Usable in minutes, Publicly Defensible, Outputs Action).

  | Criterion | Score (1-5) | Notes |
  | :--- | :--- | :--- |
  | **Deference to Consensus** | 1 | **Fail.** Requires expertise to know the consensus. Invites "gatekeeping" accusations. |
  | **Falsifiability** | 4 | **Strong.** Essential. However, cranks often claim falsifiability ("Find one artifact...") without accepting the negative result. |
  | **Responsiveness to Criticism** | 3 | **Weak for Triage.** Takes too long to observe. Good for bans, bad for queue triage. |
  | **Burden of Proof (Negative Explanation)** | 5 | **Best.** Immediate to check. Does not require knowing the truth, only checking if the counter-case was addressed. |
  | **Research Program Progress** | 2 | **Fail.** Too long-term. Cannot be judged in a single post. |
  | **Conspiracy Size** | 4 | **Strong.** Easy heuristic. "How many people must be lying?" But can be gamed by claiming "organic bias" rather than conspiracy. |

  **Which are the same test wearing different clothes?**
  *   **Burden of Proof** and **Falsifiability** are the same test. If you cannot specify what would prove you wrong (Falsifiability), you cannot carry the Burden of Proof regarding the existing record.
  *   **Consensus** and **Research Program Progress** are the same test. Both appeal to the authority of the community rather than the logic of the specific post.
  *   **Conspiracy Size** is a subset of **Burden of Proof**. It is specifically the burden of explaining why the rest of the world disagrees with you.

  **Recommendation:** Adopt the **Burden of Negative Explanation** as your primary filter. It is the only one that forces the poster to engage with history rather than engaging with the audience.
