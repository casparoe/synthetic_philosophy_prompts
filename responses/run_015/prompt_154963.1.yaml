prompt: |-
  You are a professional philosopher of law and feminist political philosophy, with particular attention to labor categorization and comparative criminalization policy. Before you begin, take a few moments to brainstorm all the distinct logical, descriptive, and normative readings that a single popular slogan might carry, especially where economic, moral, and legal registers overlap. Then respond entirely in continuous prose: do not use headings, bullet points, bold text, numbered lists, or tables; write as you would in a single, carefully composed letter or email.

  At a recent discussion comparing regulatory frameworks—the Nordic model's asymmetrical criminalization of buyers, Germany's legalization approach, and New Zealand's decriminalization under occupational-health and labor-law integration—someone interrupted a question about whether brothel-based providers should be classified as employees entitled to standard workplace-safety statutes. She said, "Sex work is work, full stop," and treated that as ending the matter. I am trying to understand what precise machinery that sentence was running, because it seemed to slide between describing an economic activity, prescribing a legal classification, and dismissing structural-objection arguments all at once. Could you lay out the menu of distinct claims that "sex work is work" might actually be expressing, ranging from the tautological to the radically revisionary? For each reading, indicate whether it is a platitude about exchange relations, a substantive but defensible claim about labor-market categorization, or a false equivalence that ignores distinctive coercion and trafficking dynamics; say which readings genuinely support extending standard occupational-health and labor-law frameworks to brothel settings, and which ones are typically invoked when advocates use the slogan to defend the New Zealand decriminalization model specifically over the Nordic or German alternatives. In particular, distinguish the claim that sex work involves contractual economic exchange from the stronger claim that it lacks any morally or structurally distinctive features that should justify exceptional regulatory treatment, and clarify whether, on any of these readings, the slogan actually addresses Nordic-model concerns about demand-driven exploitation rather than simply changing the subject. Please do not provide bibliographies, reading lists, or citations.
