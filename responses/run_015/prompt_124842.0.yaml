answer: |-
  The argument you have reconstructed is logically valid, but its soundness hinges on how we define "authorization" and "coercive authority." To preserve (1) (the Traceability Principle) while avoiding the absurd conclusion that all modern democracies are illegitimate, the most philosophically robust move is to **reject Premise (4)**.

  Premise (4) claims that constitutional monarchies contain a "structural pocket of coercive authority that lacks direct democratic authorization." This premise conflates **formal legal validity** with **substantive political agency**. By disentangling these, you can preserve democratic legitimacy without denying the unique structure of monarchy.

  Here is an analysis of why rejecting (4) is superior to rejecting (5) or (6), how to construct the necessary theory of authorization, and what theoretical costs this incurs.

  ### 1. Why Reject (4) Instead of (5) or (6)?

  **The Problem with Rejecting (5):**
  If you reject (5), you admit that democratic legitimacy *tolerates* pockets of unauthorized authority. This directly contradicts your desire to preserve (1). If (1) requires *all* coercive authority to be traceable, but (5) is false (meaning legitimacy exists *despite* untraceable pockets), then (1) must be weakened. You would have to replace "all authority" with "most authority" or "systemic authority," which dilutes the normative force of your democratic theory.

  **The Problem with Rejecting (6):**
  You considered arguing that republican emergency powers are "anticipatorily authorized" while monarchical powers are not. However, as you noted, this distinction collapses. In both cases, the *powers* are defined by a constitution enacted through democratic procedures. The Constitution says "The President may declare martial law" just as it says "The King shall appoint the PM." Both are anticipatorily authorized by the sovereign people. The difference lies not in the authorization of the *power*, but in the selection of the *agent*. Rejecting (6) requires a theory where the *biography* of the agent matters as much as the *rules* they follow, which is a heavier lift than simply redefining the nature of the monarch's power.

  **The Case for Rejecting (4):**
  Premise (4) asserts that the monarch holds "coercive authority." In a functioning constitutional monarchy (like Japan or the modern UK), the monarch holds **formal validity** but not **discretionary will**.
  *   **Coercive Authority** implies the capacity to make a choice that binds others against their will.
  *   **Formal Validity** implies being a necessary node in a legal process without the power to alter the outcome.

  In Japan (Article 4) and Sweden (1974 Instrument), the monarch is explicitly stripped of political agency. In the UK, convention binds the monarch to act on ministerial advice. If the monarch *cannot* refuse (without triggering a constitutional crisis that effectively ends the monarchy), they are not exercising authority; they are acting as a **constitutional notary**. A notary's stamp is legally necessary, but the notary does not hold the authority of the document. Therefore, there is no "pocket of coercive authority" in the monarch; the authority remains with the Ministers, whose advice is traceable to Parliament.

  ### 2. Refining "Anticipatory Authorization"

  Your intuition about "anticipatory authorization" is correct but needs to be redirected. It is not that the *power* is authorized in a republic but not a monarchy. Rather, the **chain of discretion** is authorized in a republic but suspended in a monarchy.

  *   **Republican Emergency Powers:** The Constitution authorizes the *office*, and the election authorizes the *person*. Crucially, the person retains **discretion** within the authorized bounds. The legitimacy comes from the fact that the person can be removed if they abuse that discretion.
  *   **Monarchical Reserve Powers:** The Constitution authorizes the *office*, but heredity selects the *person*. However, legitimacy is preserved because the person **lacks discretion**. The "authorization" is not that the people chose the King, but that the people chose a system where the King *cannot act without their agents' consent*.

  This distinguishes the two cases without collapsing. The republican model authorizes *discretionary power*; the monarchical model authorizes *procedural formality*. If the monarch attempts to exercise discretion (e.g., refusing assent), they break the chain of authorization, and the act becomes illegitimate.

  ### 3. Addressing the "Dormancy" Question

  You asked: *If I keep (1) and reject (5), do I commit myself to saying that hereditary office can be compatible with democracy so long as its powers are dormant?*

  **The Answer:** No, dormancy alone is insufficient. **Binding constraint** is required.

  *   **Mere Dormancy:** If the King retains the legal right to refuse assent but simply chooses not to out of politeness, the pocket of unauthorized authority *remains*. The threat is real, even if unused. This would violate (1).
  *   **Constitutional Constraint:** If the King is bound by convention or law (as in Japan) such that refusal is *not a valid legal option*, then the power is not "dormant"; it is **transformed**. It is no longer a power of *will*, but a power of *record*.

  Therefore, you do not have to argue that "dormancy makes it democratic." You argue that "constraint makes it non-authoritative." The hereditary office is compatible with democracy not because it sleeps, but because it is muzzled by the democratic constitution.

  ### 4. Theoretical Costs

  Rejecting (4) and adopting this "Notary Theory" of constitutional monarchy preserves (1) and saves the monarchy, but it comes with three significant costs for your broader theory of democratic legitimacy:

  **A. Fragility of Convention**
  Your theory makes legitimacy dependent on unwritten conventions (especially in the UK). If a monarch *does* refuse assent (e.g., the 1975 Australian constitutional crisis, where the Governor-General dismissed the PM), the "notary" illusion shatters.
  *   *Cost:* You must admit that constitutional monarchies are **latently illegitimate** during crises. Their legitimacy is contingent on the monarch's willingness to remain a cipher. This makes them less stable than republics, where the chain of authorization is clearer even in emergencies.

  **B. The "Break Glass" Problem**
  Reserve powers are often justified as a "safety valve" against tyranny (e.g., if a PM tries to cancel elections). If you argue the monarch has *no* authority (to preserve legitimacy), you remove the safety valve. If you argue they *do* have authority (to keep the safety valve), you violate (1).
  *   *Cost:* You must accept that democratic legitimacy requires **institutional redundancy** over **purity**. You might have to concede that in extreme emergencies, an unauthorized actor is preferable to democratic suicide, forcing a temporary suspension of (1).

  **C. Formalism over Substance**
  By arguing that the monarch is just a "stamp," you adopt a functionalist view of democracy. This risks validating other undemocratic formalisms. (e.g., "The Electoral College is just a rubber stamp, so it's democratic.")
  *   *Cost:* You must draw a sharp line between **procedural nodes** (which can be undemocratic) and **decision points** (which must be democratic). This requires a sophisticated theory of institutions that distinguishes between *validating* acts and *deciding* acts.

  ### Recommendation

  **Reject Premise (4).**
  Argue that in legitimate constitutional monarchies, the monarch does not possess "coercive authority" but rather "procedural validity." The coercive authority lies with the Ministers who advise the monarch, and that chain *is* traceable to the people.

  **Modified Argument:**
  1.  Democratic legitimacy requires that all **discretionary** coercive state authority be traceable to popular authorization. (Refine (1) to specify *discretionary*).
  2.  In modern constitutional monarchies, the monarch's formal powers are bound by convention/law to be exercised **only** on the advice of elected ministers.
  3.  Therefore, the monarch possesses no **discretionary** authority, only formal validity.
  4.  Therefore, there is no "pocket of unauthorized coercive authority." (Reject (4)).
  5.  Democratic legitimacy is preserved because the *decision* is traceable, even if the *signature* is hereditary.

  This preserves the core of democratic theory (control over decisions) while accommodating the historical reality of constitutional monarchy, without forcing you to admit that "unauthorized pockets" are acceptable.
