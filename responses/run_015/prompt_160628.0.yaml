      *   *The Series:* A gradual series from clear C to clear not-C (e.g., feeling cold to feeling hot). Neighboring cases are indiscriminable.
      *   *The Contradiction:* If you know C in case $i$, safety says C holds in $i+1$. Iterate this. C must hold even in the final case (where it clearly doesn't). Therefore, you can't know C in the first case.
