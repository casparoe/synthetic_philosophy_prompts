answer: |-
  You are doing the work that academics often overcomplicate. You aren't making these calls up at random; you are actually applying a very sophisticated ethical framework, even if you don't have the jargon for it.

  You are wrestling with two distinct principles that often get tangled up. When you separate them, most of your gut calls make perfect sense.

  The two principles are: **Civic Endorsement** vs. **Historical Record.**

  ### Principle 1: Civic Endorsement (The "Living" Space)
  This applies to things we interact with every day to conduct our lives: schools, streets, hospitals, libraries. When a name is on a school or a street, the town is effectively saying, *"We want you to walk under this banner. We claim this person as one of ours."* It is an active honor.

  **The Rule:** If a name functions as Civic Endorsement, the person must be someone we are willing to claim *today*. If their actions violate the community's current values (especially regarding bodily autonomy or equality), the name must go. A plaque in the lobby doesn't fix this because it turns the entrance into an apology. You shouldn't need a warning label to enter a public school.

  ### Principle 2: Historical Record (The "Remembering" Space)
  This applies to museums, graves, and archives. These are places we go specifically to learn about the past, not to conduct daily business.

  **The Rule:** Here, the goal is truth, not honor. We keep things to show what happened, who held power, and what they did. Context (like a wall of text) works here because the purpose of the space is to provide context.

  ***

  ### How this explains your calls

  **1. The High School (Sterilization Campaigner)**
  *   **Your Call:** Take the name off.
  *   **Why:** A school is a **Civic Endorsement**. Even if he just gave money, naming the school after him claims him as a role model. Forced sterilization is a violation of bodily autonomy that contradicts the purpose of a school (nurturing children).
  *   **Principle Check:** Consistent.

  **2. The Street & The Medical Technique (Doctor/Enslaved Women)**
  *   **Your Call:** Street name off, Technique name stays.
  *   **Why:** The street is **Civic Endorsement**. We don't want to drive down a road honoring a man who tortured enslaved women.
  *   **The Exception:** The medical technique is **Utility**, not Honor. In surgery, names are labels, like chemical formulas. Changing it risks patient safety. This isn't "doing whatever is cheapest"; it's prioritizing *harm reduction* (living patients) over *symbolic purity*.
  *   **Principle Check:** Consistent. You are distinguishing between an *honor* (street) and a *tool* (technique).

  **3 & 4. The Statue (Hospital vs. Museum) & The Plaques**
  *   **Your Call:** Down at hospital, Okay in museum with text. Plaque works in museum, not school.
  *   **Why:** The hospital lobby is a **Living Space** (Endorsement). The museum is a **Remembering Space** (Record).
  *   **The Asymmetry:** In a museum, the statue is evidence. In a school, the statue (or name) is a banner. A plaque in a museum explains the evidence. A plaque in a school lobby admits the banner is wrong.
  *   **Principle Check:** This is your strongest intuition. You have perfectly distinguished between *honoring* and *documenting*.

  **5. The Elementary School (Suffragist/Racist)**
  *   **Your Call:** Leave it.
  *   **The Conflict:** You admitted this contradicts Case 1. Here is the only place your principle wobbles.
  *   **The Possible Distinction:** In Case 1, the man was an *active campaigner* for state violence (sterilization). In Case 5, the woman wrote *vile things* (ideology). One is physical policy, the other is speech.
  *   **The Hard Truth:** If you stick to **Civic Endorsement**, these should probably be treated the same. A school name is an honor. If her writings are "genuinely vile" toward immigrants, does the town want to endorse that?
  *   **Recommendation:** You don't *have* to change this call, but be aware that this is the one spot where "it's just a name now" conflicts with "we don't honor racists." If the sterilization campaigner (Case 1) loses his name because of his actions, the racist writer (Case 5) logically should too, unless you decide that *policy* harm outweighs *speech* harm.

  **6. The Statue (1921) vs. The Grave (1882)**
  *   **Your Call:** Statue down, Grave stays.
  *   **Why:** This introduces a third sub-principle: **Intent of Installation.**
  *   The 1921 statue was put up to say *"We run this town"* (Political dominance). That is a Civic Endorsement of white supremacy.
  *   The 1882 headstone was put up by grieving family. That is a Private Memorial.
  *   **Principle Check:** Consistent. Public political statements must match current values. Private grief gets respect.

  **7. The Living Donor (Prison)**
  *   **Your Call:** Torn. Returning money feels cleaner.
  *   **Why:** This is about **Complicity**, not just honor.
  *   If you keep the money but remove the name, the town benefits from the crime. That feels dirty because it *is* dirty. You are profiting from a criminal.
  *   If you return the money, you sever the tie. You lose the room, but you keep your hands clean.
  *   **Recommendation:** Your gut is right. The "clean" feeling is the ethical signal. If the donor's crime is severe enough to revoke the honor, the transaction should be unwound if possible. If the money can't be returned (already spent), the name comes down, and the town acknowledges the debt cannot be repaid.

  **8. The Firefighter & The Mediocre Mayor**
  *   **Your Call:** Both fine.
  *   **Why:** **Neutrality.** Not every name is a moral judgment. "Firefighter" is a role, not a person. The mediocre mayor is a historical record of leadership, not a claim of greatness.
  *   **Principle Check:** Consistent. We only remove names when the person's actions *actively contradict* community values, not when they are merely boring or generic.

  **9. The Half-Measures (Chiseling & Markers)**
  *   **Your Call:** Prefer chiseling/markers over erasing.
  *   **Why:** This is **Historical Honesty.** Erasing the name pretends the past didn't happen. Chiseling it off says, *"This happened, and we rejected it."*
  *   **Principle Check:** This is excellent. It treats the object as a Historical Record (showing the change) while removing the Civic Endorsement.

  ***

  ### Answers to your specific questions

  **Is there one principle, or two?**
  It is primarily **Endorsement vs. Record**, with a secondary check for **Intent of Installation** (Was this put up to honor or to document?).
  *   Living spaces (Schools, Streets) = Endorsement.
  *   Remembering spaces (Museums, Graves) = Record.

  **Which of my calls does it force me to give up?**
  It challenges **Case 5 (The Elementary School).**
  If the principle is "We do not endorse people whose actions violate our core values in a living space," then the Suffragist's vile writings about immigrants should be weighed the same as the Sterilization Campaigner's actions.
  *   *To keep consistency:* Either both names stay (if you decide "old prejudices" are forgivable history) or both names go (if you decide "harmful ideology" disqualifies endorsement).
  *   *To keep your current call:* You must argue that *state-sponsored bodily harm* (sterilization) is fundamentally different from *prejudiced writing*. That is a defensible line, but it is a line.

  **What about the two I'm stuck on?**

  1.  **The Living Donor:**
      *   **Verdict:** Return the money if you can.
      *   **Reasoning:** Your instinct about "cleanliness" is correct. Keeping the money makes the town a beneficiary of the crime. Removing the name while keeping the cash is a hollow gesture. If the money is gone (spent), remove the name and acknowledge the loss publicly. The "deal" was for honor; if the honor is revoked, the consideration (the name) is void.

  2.  **The 1921 Statue (Museum vs. Scrapyard):**
      *   **Verdict:** Museum.
      *   **Reasoning:** A scrapyard destroys evidence. A museum contextualizes it. The statue itself is now a historical artifact of the 1921 organization's power grab. It tells the story of *who tried to run the town*, which is just as important as the story of who *did* run the town.
      *   **Caveat:** It must be in a museum that explicitly explains *why* it was put up (to intimidate). If the museum just treats it as "art," it belongs in the scrapyard.

  ### Summary for your Committee
  You can walk into that room and say this:

  *"I've been thinking about this in terms of **Endorsement** versus **Documentation**. If a name or statue is in a place where we live and work (schools, streets), it's an endorsement. We can't endorse people whose actions violate our current values. If it's in a place where we study the past (museums, graves), it's documentation. We keep it to tell the truth, but we add the context.*

  *My only hesitation is being consistent about what counts as 'disqualifying behavior' for an endorsement. And when we remove an endorsement, we shouldn't try to erase the history. We should mark the change, so people know we learned something."*

  That's not a gut call. That's a policy.
