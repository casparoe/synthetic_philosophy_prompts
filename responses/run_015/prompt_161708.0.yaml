prompt: |-
  Hey — I'm a journalist doing a piece on how every platform now demands an "AI-generated" label while nobody can say how much human rewriting stops counting. A philosopher friend says this is just the sorites paradox in a hoodie, so I want a sidebar: a 7-question quiz that sorts readers into a theory of vagueness without ever naming one.

  Every question should be a plain-English case from my beat: a draft that's 10% model-written versus 90%; a policy committee that just picks a number and declares that's the line now; a judge who has to rule yes-or-no on a borderline case and isn't allowed to say "sort of"; two editors who disagree about the same borderline document; whether there's a fact of the matter here that we simply can't ever find out; whether the word's meaning shifts with what's at stake in the conversation. Nothing like "is vagueness in the world or in our heads" — I want them sorted by what they say about cases, not by which label they like.

  Then give me a scoring key mapping answer patterns onto epistemicism, supervaluationism, degree-theoretic (fuzzy) views, contextualism, and the meaning-nihilist option — and flag which pairs of positions my questions can't actually seperate, plus any combination of answers no real theory occupies (and whether that's because it's incoherent, just unattractive, or merely unexplored). Readers are sharp but have never heard the word "sorites".
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and scoring key:

  1.  **Analyze the Request:**
      *   **Target Audience:** Journalist's readers (sharp, but laypeople regarding philosophy). No jargon like "sorites," "epistemicism," etc., in the quiz itself.
      *   **Topic:** The vagueness of "AI-generated" labels (how much human editing makes it human?).
      *   **Format:** A 7-question quiz + Scoring Key.
      *   **Goal:** Sort readers into theories of vagueness (Epistemicism, Supervaluationism, Degree Theory/Fuzzy, Contextualism, Nihilism) based *only* on their intuitions about cases, not definitions.
      *   **Constraints:**
          *   Questions must be plain-English cases from journalism/editing.
          *   Specific scenarios requested: 10% vs 90% AI, policy committee picking a number, judge forced yes/no, two editors disagreeing, fact of the matter unknowable, meaning shifts with stakes.
          *   Scoring key must map patterns to theories.
          *   Must flag indistinguishable positions and impossible/incoherent answer combinations.

  2.  **Deconstruct the Theories (for the Scoring Key):**
      *   *Epistemicism:* There is a sharp cutoff (e.g., 49.9% is human, 50.1% is AI), but we can't know where it is. Truth is bivalent (True/False).
      *   *Supervaluationism:* There's no single sharp cutoff, but "precisifications" exist. Some cases are definitely true, some definitely false, some indeterminate (neither). Truth depends on all admissible sharpenings.
      *   *Degree Theory (Fuzzy):* Truth comes in degrees. A piece can be 0.7 "AI-generated." No sharp line, just a slide.
      *   *Contextualism:* The meaning of "AI-generated" shifts depending on the context/stakes (e.g., legal vs. casual).
      *   *Nihilism (Eliminativism):* The term "AI-generated" is too broken to work. There is no fact of the matter, and we should stop using the category.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Requirement:* 7 questions.
      *   *Requirement:* Cover specific scenarios (10/90 split, committee rule, judge ruling, editor disagreement, unknowable fact, stakes shifting).
      *   *Goal:* Differentiate the theories.

      *   *Q1 (The Slide):* 10% AI vs 90% AI. Tests Degree vs. Binary.
      *   *Q2 (The Committee):* Picking a number (e.g., 50%). Tests Epistemicism (there *is* a line) vs. Contextualism/Supervaluation (the line is arbitrary/conventional).
      *   *Q3 (The Judge):* Forced Yes/No on borderline. Tests Epistemicism (one is right) vs. Supervaluation (neither is fully correct) vs. Nihilism (question is bad).
      *   *Q4 (The Disagreement):* Two editors disagree. Tests Faultless Disagreement (Contextualism/Relativism) vs. One is Wrong (Epistemicism).
      *   *Q5 (The Unknowable):* Is there a fact we can't find? Direct hit on Epistemicism.
      *   *Q6 (The Stakes):* Does meaning shift with stakes? Direct hit on Contextualism/Pragmatics.
      *   *Q7 (The Category):* Should we dump the label? Direct hit on Nihilism.

      *Refining Qs for "Plain English":* Avoid "truth values." Use "right/wrong," "makes sense," "fair."

  4.  **Developing the Scoring Key:**
      *   Need to map answer combinations (e.g., Mostly A, Mostly B) to theories.
      *   *Challenge:* Real people aren't consistent philosophers. The key needs to be robust enough to handle mixed intuitions but specific enough to sort.
      *   *Strategy:* Assign points or dominant patterns. Let's use a "Dominant Intuition" approach.
      *   *Mapping:*
          *   Epistemicism: Believes there's a real line, even if hidden. (Q2 Yes, Q5 Yes).
          *   Supervaluationism: Believes some cases are truly undefined. (Q3 "Neither", Q1 "Binary but unclear").
          *   Fuzzy: Believes in gradients. (Q1 "Percentage", Q3 "Sort of").
          *   Contextualism: Believes it depends on the situation. (Q6 Yes).
          *   Nihilism: Believes the label is broken. (Q7 Yes).

      *   *Constraint Check:* The prompt asks to flag pairs of positions questions can't separate and impossible combinations.
      *   *Indistinguishable:* Epistemicism and Supervaluationism often look similar on practical rulings (both often force a binary in law), but differ on *why*. Contextualism and Fuzzy can overlap on "shifting standards."
      *   *Impossible:* Nihilism + Epistemicism (You can't believe there's a hidden fact *and* that the term is meaningless). Forced Binary + Fuzzy (You can't believe it's *only* 0 or 1 *and* that it's 0.7).

  5.  **Drafting the Content (incorporating the "Journalist" Voice):**
      *   Tone: Professional, engaging, slightly investigative.
      *   Intro: Acknowledge the "hoodie" comment.
      *   Quiz: Clear scenarios.
      *   Key: Explanatory but not academic.

  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Critique:* Q2 (Committee) might confuse Epistemicism (they found the line) with Stipulation (they made the line).
      *   *Fix:* Phrase Q2 to ask if the committee *discovers* the right line or *invents* one.
      *   *Critique:* Q3 (Judge) needs to allow for "Both are wrong" to capture Supervaluationism.
      *   *Critique:* Ensure the "Impossible Combinations" section is clear. For example, believing there is a precise fact (Epistemicism) but also that the word changes meaning constantly (Contextualism) is tense but not impossible. However, believing there is *no* fact (Nihilism) and a *hidden* fact (Epistemicism) is contradictory.

  7.  **Final Review against Constraints:**
      *   7 questions? Yes.
      *   Plain English? Yes.
      *   Specific scenarios included? Yes (10/90, committee, judge, editors, unknowable, stakes).
      *   Scoring key with 5 theories? Yes.
      *   Flag indistinguishable pairs? Yes.
      *   Flag impossible combos? Yes.
      *   No jargon in quiz? Yes.

  8.  **Final Polish:** Check the tone. Make sure the scoring key explains *why* the mapping works without using heavy metaphysics. (e.g., instead of "bivalence," use "strict yes/no").

  *(Self-Correction on Scoring)*: A simple "Mostly A/B/C" is too crude for 5 theories. I should group questions by what they probe.
  *   Q1, Q3: Binary vs. Gradient (Fuzzy vs. others).
  *   Q2, Q5: Hidden Fact vs. No Fact (Epistemicism vs. others).
  *   Q4, Q6: Stability of Meaning (Contextualism vs. others).
  *   Q7: Viability of Term (Nihilism vs. others).
  *   Supervaluation is the tricky one. It's the "True/False/Undecided" middle ground.

  Let's structure the scoring by "Profile" rather than just points.

  *Wait, one more check:* The prompt asks for "which pairs of positions my questions can't actually separate."
  *   *Epistemicism vs. Strict Binary Prescriptivism:* If someone says "There is a line" (Epistemic) vs "We need to draw a line for rules" (Pragmatic), the quiz might conflate them.
  *   *Contextualism vs. Fuzzy:* If meaning shifts (Context) vs. truth is partial (Fuzzy), the output looks similar ("It depends"). I need to note this.

  Okay, ready to write.
answer: |-
  # Sidebar: The "How Human Is It?" Intuition Test

  Your philosopher friend is right: we're fighting over a heap of pixels. But since newsrooms need bylines and regulators need fines, we have to draw lines somewhere. This quiz doesn't ask what you *know*; it asks how your brain handles the blur.

  Answer these seven scenarios honestly. There are no right answers, only consistent ones.

  ***

  ### 1. The 10% Draft
  A reporter submits a story. An AI wrote the first draft of the intro (about 10% of the text), but the reporter verified every fact, rewrote every sentence, and added all the original reporting.
  **Is this an "AI-generated" article?**
  A. No. The human did the work that matters.
  B. Yes. Any AI input taints the whole bucket.
  C. It's somewhere in between. It's partially AI-generated.
  D. It depends on why you're asking.

  ### 2. The Committee's Number
  A policy committee is tired of arguing. They vote to declare: "Any text with more than 20% AI tokens is labeled AI-generated." They admit 19.9% is basically the same as 20.1%, but they need a rule.
  **Did the committee discover the correct line or invent one?**
  A. They invented a useful rule, but the *real* line was already there somewhere.
  B. They invented the line. There was no correct number before they voted.
  C. They made it clearer, but cases right around 20% are still truly undefined.
  D. The whole exercise is fake; percentage counts don't measure "generated."

  ### 3. The Cornered Judge
  A judge must rule on a lawsuit regarding a borderline article (say, 45% AI). The law requires a binary verdict: it either counts as "AI-generated" or it doesn't. No "sort of" allowed.
  **If the judge rules "Yes," and a different judge rules "No" on the exact same text:**
  A. One of them is objectively wrong, even if we can't prove which.
  B. Both are wrong. The text simply doesn't fit the category.
  C. Both are right enough. The text is 0.5 "AI-generated," so either label captures part of the truth.
  D. They aren't actually disagreeing; they're applying different standards for the courtroom.

  ### 4. The Editor Disagreement
  Two senior editors review the same borderline piece. Editor A says, "This is human." Editor B says, "This is AI." They both know all the same facts about how it was written.
  **Is one of them making a mistake?**
  A. Yes. One of them has misjudged the facts or the definition.
  B. No. They are both expressing valid perspectives on a messy reality.
  C. No. The word "human" means something slightly different to each of them.
  D. Yes, but it's a mistake forced on them by a broken category.

  ### 5. The Hidden Fact
  Imagine we had a perfect scanner that could trace every neuron and algorithm involved in the writing.
  **Would that scanner reveal a definitive fact about whether the piece is "AI-generated"?**
  A. Yes. The fact exists, even if our current tools can't see it.
  B. No. The scanner would just show a complex mix; "AI-generated" isn't a physical property like mass.
  C. The scanner would show degrees of contribution, not a yes/no fact.
  D. The scanner would show that the question relies on social expectations, not physical facts.

  ### 6. The Stakes Shift
  Consider a piece that is 40% AI.
  **Does your label change if the context shifts?**
  *Context A:* A casual blog post.
  *Context B:* A Pulitzer Prize submission.
  A. No. If it's 40% AI, it's 40% AI. The stakes don't change the facts.
  B. Yes. In the blog, it's "human-assisted." For the Pulitzer, it's "AI-generated."
  C. No, but we should ban it from the Pulitzer anyway.
  D. The label is too slippery to use in either case.

  ### 7. The Nuclear Option
  Given all these headaches, we consider banning the term "AI-generated" entirely from our style guide.
  **What do you think?**
  A. Bad idea. We just need to define it better.
  B. Good idea. The term is too broken to save.
  C. Keep it, but admit it's a spectrum, not a label.
  D. Keep it, but admit the line is arbitrary.

  ***

  # Scoring Key: What Your Intuitions Say About Reality

  *Note: Most people will have a mix of answers. Look for your dominant pattern. If you answered mostly one letter, you align with a specific philosophical tradition regarding vagueness. If you're mixed, you're like most of us: pragmatically inconsistent.*

  ### Mostly A: The Hidden Line (Epistemicism)
  **You believe:** There is a sharp boundary between "Human" and "AI," even if we can't see it.
  **The Theory:** *Epistemicism.* You think vagueness is a lack of knowledge, not a lack of reality. Somewhere between 19.9% and 20.1%, the truth flips.
  **The Risk:** You might support rigid policies that feel arbitrary because you believe a "correct" rigidity exists underneath.

  ### Mostly B: The Gap (Supervaluationism)
  **You believe:** Some cases are definitely human, some are definitely AI, and the middle cases are *neither*.
  **The Theory:** *Supervaluationism.* You think the category has "truth gaps." When the judge forces a yes/no on a gap case, they aren't describing reality; they're stretching the language.
  **The Risk:** You might find yourself frustrated by legal or policy systems that demand binary answers for gradient problems.

  ### Mostly C: The Slider (Degree Theory / Fuzzy Logic)
  **You believe:** Truth comes in shades. A piece can be 70% human.
  **The Theory:** *Degree Theory (Fuzzy Logic).* You reject the idea that statements must be 100% true or 100% false. Vagueness is a feature of the world, not a bug.
  **The Risk:** You struggle in systems (like law or HR) that require binary decisions. "Mostly human" doesn't help when the rule says "No AI."

  ### Mostly D: The Context (Contextualism)
  **You believe:** The meaning of "AI-generated" shifts depending on who is asking and why.
  **The Theory:** *Contextualism.* You think the word's extension changes based on the "conversational stakes." It's not that the text changed; it's that the standard for the label moved.
  **The Risk:** You can be accused of moving the goalposts. ("It wasn't AI yesterday!" "Well, the context changed.")

  ### Mostly "Ban It" / Mixed B & D: The Broken Tool (Nihilism / Eliminativism)
  **You believe:** The category is so flawed we should stop using it.
  **The Theory:** *Vagueness Nihilism.* You think there is no fact of the matter, no useful degree, and no stable context. The term creates more confusion than clarity.
  **The Risk:** You opt out of the conversation. While philosophically honest, it doesn't help a newsroom write a style guide tomorrow.

  ***

  # The Blind Spots: What This Quiz Can't Tell You

  Even a perfect score can't separate every philosophical position. Here is where the map blurs.

  ### 1. The "Arbitrary Line" Problem (Epistemicism vs. Stipulation)
  If you answered **A** on Question 2 (The Committee), the quiz assumes you are an *Epistemicist* (believing a real line exists). However, you might just be a *Pragmatist* who knows the line is fake but thinks we need one anyway.
  *   **Why it matters:** Epistemicists think the committee *found* the truth. Pragmatists think the committee *made* the truth. The quiz treats these similarly because they result in the same policy.

  ### 2. The "It Depends" Overlap (Contextualism vs. Fuzzy)
  If you answered **C** on Question 1 and **B** on Question 6, you look like a *Contextualist*. But *Degree Theorists* (Fuzzy) often argue that high-stakes situations just require a higher "degree" of truth to count.
  *   **Why it matters:** Both views reject binary labels. The difference is metaphysical (does the meaning shift? or does the required threshold shift?). For a journalist, the outcome is identical: you need more nuance.

  ### 3. Impossible Combinations (Incoherent Profiles)
  If you find yourself nodding at these pairs, your intuition may be logically unstable:
  *   **The "Hidden Nihilist" (Q5-A + Q7-B):** You believe a perfect scanner *would* find a definitive fact (Epistemicism), but also that we should *ban the term* because no fact exists (Nihilism). You can't believe the fact is real and that the fact is impossible simultaneously.
  *   **The "Binary Gradient" (Q1-C + Q3-A):** You believe the text is "somewhere in between" (Degree Theory), but also that in court, one judge must be *objectively wrong* (Epistemicism). While legally necessary, philosophically this claims the text is both gradient and binary at the same time.
  *   **The "Stakes Realist" (Q5-A + Q6-B):** You believe a perfect scanner would find a physical fact about the text (Realism), but that the label changes based on the stakes (Contextualism). If the fact is physical and hidden in the text, the stakes shouldn't change the fact, only our tolerance for it.

  ### 4. The Unexplored Zone
  There is a combination the quiz doesn't capture: **The "Open Texture" View.** This is the idea that the definition isn't hidden (Epistemic) or gradient (Fuzzy), but that the concept is *designed* to be flexible for future cases we haven't imagined yet. If you think the definition *should* remain vague so we can adapt it later, you don't fit neatly into A, B, C, or D. You're a legal pragmatist, which is arguably the most useful position for a newsroom, even if it drives philosophers crazy.
