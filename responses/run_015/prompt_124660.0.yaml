answer: |-
  1. In a double-blind psychometric trial, participants are assigned via fair coin to a single-session arm (Heads) or a two-session arm (Tails), receiving a short-acting amnestic sedative after each evaluation that erases episodic memory of the interview while preserving semantic protocol knowledge. Upon each awakening, a distinct non-diagnostic chime sounds to confirm protocol initiation without indicating session count, and participants are offered a wager paying $200 if tails and costing $300 if heads.

  2. The halfer maintains her credence in heads remains 1/2 because the awakening provides no new objective evidence about the initial coin flip outcome. She argues that betting strategies should align with the objective chance of the coin rather than the frequency of her own awakenings.

  3. The thirder updates her credence in heads to 1/3 because she knows she is twice as likely to be experiencing a tails-associated awakening than a heads-associated one. She argues rational betting must maximize expected utility across all actual awakenings where the bet is offered.

  4. The isolation feature is the indexical nature of the awakening itself, which increases the sample space of observer-moments without altering the objective frequency of the coin toss. This ensures the credence shift stems purely from self-location within the protocol timeline rather than diagnostic data about the randomization device.

  5. A halfer might attack by claiming the second awakening is irrelevant to the coin's truth value, asserting that credence should track world-states rather than observer-moments. Removing the memory erasure would collapse the disagreement into standard evidential reasoning because knowing the specific day would definitively confirm or rule out the heads hypothesis.
