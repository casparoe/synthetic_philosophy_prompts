answer: |-
  **Menu of Readings: "Diagnoses aren't discovered, they're made"**

  1.  **Lexical Conventionalism:** The *word* "PMDS" is a human invention, though the underlying phenomenon exists. **Verdict:** Trivial platitude. **Supports:** None (compatible with all).
  2.  **Boundary Conventionalism:** The *threshold* for diagnosis (e.g., six months) is a policy choice carved from a continuous reality. **Verdict:** Substantive and defensible. **Supports:** Job 2.
  3.  **Causal Interactionism:** The *presentation* of symptoms is causally altered by the act of classification. **Verdict:** Substantive and defensible. **Supports:** None directly (descriptive).
  4.  **Ontological Genesis:** The *kind itself* did not exist prior to the classification practice. **Verdict:** Substantive but doubtful (requires strong evidence). **Supports:** Job 3.
  5.  **Global Anti-Naturalism:** *No* psychiatric category maps to a mind-independent natural kind. **Verdict:** Substantive but doubtful. **Supports:** Job 1, Job 3.
  6.  **Pragmatic Instrumentalism:** Diagnostic validity is determined by *utility* (cost-benefit), not truth. **Verdict:** Substantive and defensible. **Supports:** Job 2.
  7.  **Constitutive Phenomenology:** The *subject's experience* is constituted by the label; without it, the experience is different. **Verdict:** Substantive but doubtful. **Supports:** Job 1, Job 3.
  8.  **Epistemic Deflationism:** The question "is it real?" lacks truth conditions; only "is it useful?" makes sense. **Verdict:** Self-undermining (asserts a truth about truth). **Supports:** Job 1.

  **Summary Table**

  | Reading | Verdict | Supports Job | Relation to Looping | 2018 Cohort | 2029 Cohort |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1. Lexical | Platitude | None | Compatible | Made (Term) | Made (Term) |
  | 2. Boundary | Defensible | 2 | Compatible | Made (Cut) | Made (Cut) |
  | 3. Causal | Defensible | None | **Entailed** | Discovered | Made (Symptoms) |
  | 4. Ontological | Doubtful | 3 | Entailed | Discovered | Made (Kind) |
  | 5. Global Anti-Nat. | Doubtful | 1, 3 | Compatible | Made | Made |
  | 6. Pragmatic | Defensible | 2 | Compatible | Made (Utility) | Made (Utility) |
  | 7. Constitutive | Doubtful | 1, 3 | Entailed | Discovered | Made |
  | 8. Deflationism | Self-Undermining | 1 | Compatible | Neither | Neither |

  **Assessment of Seminar Inferences**

  (a) *"The criteria were written by a committee, so the kind is a committee artifact."*
  Valid only under **Boundary Conventionalism (2)** regarding the threshold, but invalidly slides to **Ontological Genesis (4)** regarding the kind. Committees draw lines on existing terrains (2); they do not necessarily create the terrain (4). In the 2018 PMDS cohort, the lesion existed regardless of the committee; the committee only named it.

  (b) *"The label changes the people who have it, so the kind is not real at any given time, cannot be a natural kind, and cannot support stable science."*
  Valid under **Global Anti-Naturalism (5)**, but invalid under **Causal Interactionism (3)**. Looping (3) shows classification affects the kind, but does not prove the kind lacks causal powers or stability *at a time slice*. The 2018 cohort showed stable validators despite labeling; instability arose later via community feedback, not merely classification. Looping entails interaction, not non-existence.

  (c) *"These individuals would not have had this experience without the label, so the category cannot be explanatory."*
  Valid under **Constitutive Phenomenology (7)**, but false under **Causal Interactionism (3)**. Even if the label shapes the experience (2029 cohort), the category explains *why* the experience has its current shape. It remains explanatory of the looping effect itself.

  **Professor's Intent and Job Stability**

  No single reading supports all three jobs. **Lexical Conventionalism (1)** is too weak for Jobs 2 and 3. **Global Anti-Naturalism (5)** supports Jobs 1 and 3 but conflicts with Job 2's implicit assumption that we can measure "what the category does" (if nothing is real, utility metrics lack a stable target). **Pragmatic Instrumentalism (6)** supports Job 2 but fails Job 3 (one can be pragmatic about natural kinds).

  The professor's rhetoric depends on sliding from **Boundary Conventionalism (2)** (plausible, supports Job 2) to **Global Anti-Naturalism (5)** (radical, supports Jobs 1 and 3). This move is unmarked. Your suspicion regarding Job 2's stability is correct. If looping degrades validators (as in the 2029 PMDS cohort where treatment effects shrink and family aggregation drops), the pragmatist loses the fixed metrics required for cost-benefit analysis. You cannot optimize utility against a moving target unless you posit a stable goal (e.g., "reduce suffering"), but if the *definition* of suffering is itself made by the diagnosis (Reading 7), the optimization loop spins void.

  The professor most likely meant **Pragmatic Instrumentalism (6)** colored by **Causal Interactionism (3)**. This allows them to dismiss "realness" (Job 1) as irrelevant compared to utility, treat criteria as policy (Job 2), and dismiss natural kind searches (Job 3) as futile due to looping. However, this conflates "futile to search for static validators" with "no natural kind exists." Given the 2018 cohort showed stable lesion tracking, the Global Anti-Naturalist claim (Job 3) is falsified by the case itself, suggesting the professor is prioritizing the 2029 dynamics to justify a global claim. The slogan works rhetorically only by averaging away the time-slice difference where PMDS shifted from discovered (2018) to made (2029).
