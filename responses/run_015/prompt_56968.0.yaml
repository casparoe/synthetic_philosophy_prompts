answer: |-
  Good afternoon.

  For those who don't know me, I'm the one who keeps the keys. I worked on the floor here for nineteen years before the silence fell. I've got no qualifications to speak of. But I have spent more time in this building's attic than I have in my own home, and I know the smell of our paper better than the smell of my own cooking.

  So, I want to start by thanking the family. Thank you for your generosity, and thank you for the plaque.

  It's a big question, isn't it? *Why did the world change here and not in China?*

  When you stand by the door and read that, it makes you straighten your back. It makes you feel like you're standing on a fault line. And I suppose that's what history is supposed to do. It's supposed to make the ground feel significant.

  But I've been thinking about that question while I've been setting up this room. And I've been thinking about what I've found in the boxes up in the attic.

  When you open the ledgers from 1798, you don't find "The World." You don't find "China." You find the price of coal. You find a water-rights argument that got settled in a pub down the valley. You find three years where we nearly went under because the cotton came wet from a place nobody in this town had ever laid eyes on.

  You find the name of a woman who could fix the cards when nobody else could, and without her, the pattern would have broken.

  And I've brought a few things down from the attic to sit with us today.

  There's the shuttle, there. Look at the wood. It's worn smooth on the right side. It doesn't know it's part of a global shift. It only knows the tension of the thread. If the thread was too tight, it snapped. If it was too loose, the cloth was worthless. It didn't care about geography. It cared about the feel of the thing.

  Then there's the photograph from the last working day. Look at the faces. They aren't posing as pioneers of the Industrial Revolution. They're posing as people who are worried about where the next shift is coming from. They're neighbours. They're standing in the mud of the yard, just like we are today.

  And then there's the frame. The replica. All week, the Year Nines from the school have been winding it. They haven't been reading theories about economic divergence. They've been learning that if you don't pay attention, the thread tangles. If you don't work together, the machine stops.

  I mention this because I think sometimes we look for a single spark to explain the fire. We want the one reason why things happened *here* and not *there*.

  But if you stood in this yard in 1790 and asked why spinning got cheap, you wouldn't have got one answer. You would have got twelve. And none of them would have mentioned a continent they'd never seen.

  Down in the shed, you could ask why one loom stopped and not the one next to it. But that question only ever meant anything because both looms were running the same cloth, off the same beam. Take that away—the shared work, the shared risk, the shared thread—and the question is just noise.

  I think the value of this plaque isn't that it has a simple answer. It's that it makes us look at the things that *do* have answers. It makes us look at the ledger. It makes us look at the shuttle. It makes us ask: how did we keep the thread tight? How did we fix the cards when they broke?

  That is the work that was done here. Not changing the world, perhaps. But mastering the immediate. Mastering the small things so well that, eventually, the world had to take notice.

  We are very lucky to have two proper economic historians with us today. One of them has spent a lifetime mapping the big picture. He knows the contours of the countries and the flow of the trade. I just know the dust in the corners and the names in the books. We need both. You need the map to know where you are, but you need the mud to know how it felt to walk there.

  So, when you cut the ribbon, and you walk through this exhibition, I hope you don't just look for the answer to the question on the wall.

  I hope you look at the wear on the shuttle. I hope you look at the handwriting in the ledger. I hope you watch the children working the frame and see that the skill hasn't vanished, it's just changed hands.

  This place didn't change the world because it was destined to. It changed because people stood in this damp, noisy room and refused to let the thread snap. They were proud of what they made. And looking around this room today, seeing the volunteers, the school, the family, and the neighbours... I think that pride is still the strongest thing we have.

  Thank you for coming. Let's keep the loom running.
