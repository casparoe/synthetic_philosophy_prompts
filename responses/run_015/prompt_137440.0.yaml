  # The Consciousness Map for Fiction Writers

  **Instructions:** Start at Question 1. Follow the path of your agreement. When you reach a **Leaf**, stop. Read the position name and the "Awkward Commitment" to see how that view constrains your scenes.

  ### The Branches

  **1. The Widower Test (The Datum)**
  Your widower hums at the sink two weeks after the funeral. If you asked him, he'd say he feels nothing.
  *   **A:** His denial proves he feels nothing. If he can't own it, it isn't a conscious feeling. → **Go to Leaf 1.**
  *   **B:** He can genuinely feel something he sincerely denies. The feeling exists without his permission. → **Go to Question 2.**

  **2. The Driver Test (Access vs. Phenomenality)**
  Your character is absorbed in a task. She brakes for a light correctly, answers a question, but afterwards has no idea what it was like to see the light.
  *   **A:** The seeing was only "conscious" because it was available for her brakes and voice to use. → **Go to Leaf 2.**
  *   **B:** The seeing had a raw "what-it-was-like" quality even if it wasn't available for use. → **Go to Question 3.**

  **3. The Scanner Test (First-Order vs. Higher-Order)**
  To have that raw feeling of grief (or seeing the light), does her mind need to take a second look *at* the feeling, or is the feeling enough on its own?
  *   **A:** The feeling is enough on its own. No second look required. → **Go to Leaf 3.**
  *   **B:** It only becomes a conscious feeling because something else notices it. → **Go to Question 4.**

  **4. The Timing Test (Actual vs. Disposition)**
  Does that "second look" have to happen right now, in the moment, or is it enough that she *could* take that look if prompted?
  *   **A:** It's enough that she *could* take the look (a standing capacity). → **Go to Leaf 4.**
  *   **B:** The look must actually occur right now. → **Go to Question 5.**

  **5. The Target Test (Specificity)**
  Does that second look have to target *that specific feeling* (e.g., this grief), or can it range loosely over her general mood?
  *   **A:** It can range loosely over her general state. → **Go to Leaf 5.**
  *   **B:** It must target that specific feeling directly. → **Go to Question 6.**

  **6. The Mistake Test (Misrepresentation)**
  Can that second look get it wrong? (e.g., She swears it's grief, but the look is actually registering relief).
  *   **A:** No. If she feels it, she knows what it is. → **Go to Leaf 6.**
  *   **B:** Yes. The inner look can mislabel the state. → **Go to Question 7.**

  **7. The Shadow Test (Consciousness of the Noticing)**
  Is that "second look" itself something she feels consciously, or is it invisible work?
  *   **A:** It is invisible work. She feels the grief, not the looking. → **Go to Leaf 7.**
  *   **B:** She feels the looking itself. → **Go to Question 8.**

  **8. The Unity Test (Regress vs. Self-Representation)**
  If she feels the looking, is it a separate feeling from the grief, or part of the grief itself?
  *   **A:** It is a separate feeling (a feeling of feeling). → **Go to Leaf 8.**
  *   **B:** It is part of the grief itself (the grief feels itself). → **Go to Leaf 9.**

  ---

  ### The Leaves

  **Leaf 1: Strict Access / Behaviorism**
  *   **Position:** Rejects the datum.
  *   **Awkward Commitment:** Makes your widower a liar or a robot; you cannot write sincere self-deception, only falsehood.

  **Leaf 2: Global Workspace Theory**
  *   **Position:** Consciousness is availability for report/action.
  *   **Awkward Commitment:** Makes the humming widower's feeling dependent on future utility; if he never uses it, it wasn't conscious.

  **Leaf 3: First-Order Representationalism**
  *   **Position:** Consciousness is just the world-directed state (Dretske, Tye).
  *   **Awkward Commitment:** Struggles to explain why she denies the feeling if she genuinely has it; requires a separate theory for denial.

  **Leaf 4: Dispositional Higher-Order Thought**
  *   **Position:** Consciousness requires a disposition to notice, not the notice itself (Carruthers).
  *   **Awkward Commitment:** Makes consciousness a potentiality rather than an event; hard to dramatize a "could have noticed" state.

  **Leaf 5: Loose-Target Higher-Order (Unnamed)**
  *   **Position:** Higher-order notice exists but ranges loosely.
  *   **Awkward Commitment:** Merely unexplored; implies characters feel vague moods rather than specific emotions without reason.

  **Leaf 6: Infallible Higher-Order Thought**
  *   **Position:** Higher-order notice must be accurate.
  *   **Awkward Commitment:** Unattractive; makes your grief/relief swap impossible; characters cannot be wrong about their own minds.

  **Leaf 7: Unconscious Higher-Order Thought**
  *   **Position:** The noticing happens but is not itself conscious (Rosenthal).
  *   **Awkward Commitment:** Posits invisible mental gears; you must write the effect without implying the character senses the mechanism.

  **Leaf 8: Complex Higher-Order (Regress Risk)**
  *   **Position:** The noticing is a separate conscious state.
  *   **Awkward Commitment:** Incoherent risk; implies an infinite chain of feelings about feelings to explain one feeling.

  **Leaf 9: Self-Representationalism**
  *   **Position:** The state represents itself (Kriegel).
  *   **Awkward Commitment:** Requires states to do two jobs at once; makes the widower's denial a fracture within a single complex state.

  ---

  ### Notes on the Map

  **Indistinguishable Leaves:**
  For the purposes of drafting scenes, **Leaf 4 (Dispositional HOT)** and **Leaf 7 (Unconscious HOT)** are functionally identical. Both allow a character to be in a conscious state without occurrent awareness of being in it. The metaphysical difference (standing disposition vs. occurrent unconscious thought) rarely changes the beat-by-beat action of a scene.

  **Confidence Statement:**
  I am **85% confident** this map covers the live logical space for your purposes. The placement I am least sure of is **Leaf 5 (Loose-Target Higher-Order)**. It is a logical possibility generated by the branching, but few philosophers defend it explicitly; it may collapse into Leaf 4 or Leaf 7 upon closer inspection, but I have kept it to preserve the logical distinction regarding specificity.
