answer: |-
  Here is the menu of claims hidden inside your roommate's slogan. I have broken them down by domain, evaluated their truth status, and—most importantly—flagged whether they actually excuse his behavior or just describe legal technicalities.

  ### 1. The Copyright-Law Claim (Idea-Expression Dichotomy)
  *   **The Claim:** Statutory copyright law protects fixed, tangible expressions (code, text, specific drawings) but explicitly excludes abstract ideas, procedures, or systems from protection.
  *   **Status:** **Legally True (mostly).** This is codified in US law (17 U.S.C. § 102(b)) and international treaties.
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** This claim explains why you can't *sue* him for the concept. It does not explain why he can claim *authorship*. Copyright law distinguishes between economic rights and "moral rights" (attribution). Even if he can't be sued, claiming he generated the wireframes is fraud/misrepresentation.
      *   **The Trap:** He is using a limit on *state enforcement* to justify a violation of *interpersonal honesty*.
      *   **Wireframe Nuance:** Wireframes are often considered "expression," not just "ideas." If he copied the actual drawings, this claim is factually false regarding the artifacts, even if true regarding the logic.

  ### 2. The Patent Claim (Abstract Ideas)
  *   **The Claim:** You cannot patent an abstract idea, mental process, or algorithm without a specific, novel machine or implementation (the *Alice* standard).
  *   **Status:** **Legally True.**
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** This is a red herring. You aren't trying to patent the seed library; you're arguing about credit for a design. Patent law sets a much higher bar for "ownership" than social norms do for "credit."
      *   **The Trap:** He is importing standards from a regulatory regime (patents) that you never invoked to invalidate norms from a social regime (collaboration).

  ### 3. The Metaphysical Claim (Lockean Homesteading)
  *   **The Claim:** Ideas are "abstract types" rather than "spatiotemporal tokens." Therefore, you cannot "mix your labor" with them in a Lockean sense to homestead them as property, because they cannot be bounded or excluded.
  *   **Status:** **Real Philosophical Thesis (Debatable).**
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** Even if you cannot *own* an idea as property, you can still be the *originator* of it. Lockean theory is about property rights, not authorship. I cannot own the Pythagorean theorem, but if I derive it independently, I am still the one who derived it.
      *   **The Trap:** Conflating **Property** (right to exclude/sell) with **Attribution** (right to be recognized as source). He is arguing you have no property right (true) to deny you attribution (false).

  ### 4. The Economic Claim (Non-Rivalry)
  *   **The Claim:** Ideas are non-rival goods. If he takes the idea, you still have it. Therefore, there is no scarcity, no theft, and no harm.
  *   **Status:** **Economically True (regarding the asset), False (regarding the harm).**
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** The harm isn't depletion of the idea; the harm is the diversion of **Reputation Capital**. By pitching it as his, he is stealing the potential social/professional reward associated with the idea.
      *   **The Trap:** Ignoring that while the *idea* is non-rival, the *credit* for the idea is highly rival. Only one person can be the "founder" in the eyes of the nonprofit.

  ### 5. The Moral-Desert Claim (Mental Labor)
  *   **The Claim:** Mental labor does not generate the same moral claim to ownership as physical labor. Thinking hard doesn't create a debt others must respect.
  *   **Status:** **Controversial Moral Thesis.**
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** Most ethical systems recognize that misrepresenting someone else's work as your own is lying. It doesn't matter if the work was mental; claiming you built a bridge you didn't build is wrong, and claiming you designed a system you didn't design is the same category of lie.
      *   **The Trap:** Redefining "work." He is implying that because it wasn't code (physical/digital labor), it wasn't "work" worthy of credit.

  ### 6. The Linguistic Claim (Collapse of Idea/Expression)
  *   **The Claim:** The distinction between "idea" and "expression" is arbitrary. A wireframe *is* the expression of the logic. To take the wireframe is to take the expression.
  *   **Status:** **Legally Nuanced / Often True.**
  *   **Does it excuse the pitching?** **Actually, this supports YOU.**
      *   **Why:** In copyright law, when there are only limited ways to express an idea (merger doctrine), expression isn't protected. But wireframes usually allow for infinite artistic variance. If he copied the flow *and* the sketches, he copied the expression.
      *   **The Trap:** If he uses this, he's accidentally admitting he copied the *expression* (the wireframes), which *is* protectable.

  ### 7. The "Ideas Want to Be Free" Slogan
  *   **The Claim:** Information flow should be unimpeded for societal progress. Restricting ideas slows innovation. (Attributed to Stewart Brand).
  *   **Status:** **Ideological Manifesto.**
  *   **Does it excuse the pitching?** **No.**
      *   **Why:** This slogan argues for *access*, not *plagiarism*. "Free" in this context usually means "free of cost" or "free of restriction," not "free of attribution." Open Source licenses rely on this slogan, but they strictly enforce attribution.
      *   **The Trap:** Equating "sharing" with "stealing credit." You can share the idea with the nonprofit *and* credit you. He chose to share it *without* crediting you.

  ---

  ### The "Slide": Where the Argument Breaks
  You are correct that he is sliding. Here is the precise mechanism of the sleight-of-hand:

  1.  **Premise A (Legal):** The state will not grant me a monopoly on this concept via copyright/patent.
  2.  **Premise B (Social):** Social norms regarding honesty and attribution should align with legal minimums.
  3.  **Conclusion:** Therefore, I have violated no norm by claiming I created this concept.

  **The Slide happens at Premise B.**
  Law is the *floor* of behavior, not the *ceiling*. It is legal to lie to your friends in many contexts (no fraud statute triggered), but it is not morally permissible. He is arguing that because the law doesn't punish him, the action is ethically neutral.

  **How to counter it in the meeting:**
  *"You are conflating **enforceability** with **ethics**. The law doesn't punish me for lying to you about where I was last night, but that doesn't mean I didn't wrong you. You aren't arguing that you have a right to use the concept; you're arguing you have a right to **lie about the origin** of the concept. Copyright law protects my right to sue you; it doesn't protect your right to claim my labor as your own."*

  ### Summary for your notes:
  *   **Copyright/Patent Claims:** True law, irrelevant to ethics.
  *   **Metaphysical/Economic Claims:** True descriptions of ideas, false descriptions of *credit*.
  *   **Moral Claims:** False. Lying about authorship is wrong regardless of IP status.
  *   **The "Free" Slogan:** Supports sharing, opposes plagiarism. He is using it backwards.

  He is hiding behind a legal shield to swing a moral sword. Don't let him define the battlefield as "Intellectual Property Law." Define it as "Academic/Professional Integrity." In that arena, his slogan means nothing.
