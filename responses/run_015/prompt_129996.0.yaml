      *   **4. Economic Claim (Non-Rivalry/Public Goods):**
          *   *Claim:* Ideas are non-rival. Me using it doesn't stop you. Efficiency demands sharing.
          *   *Verdict:* Economically true (non-rival), but ignores incentive structures.
          *   *Relevance:* Ignores the harm of *misattribution* (reputation capital).
          *   *The Slide:* "Resource isn't depleted" $\neq$ "Social capital wasn't stolen."

      *   **5. Moral-Desert Claim (Mental Labor):**
          *   *Claim:* Mental labor doesn't create property rights in the same way physical labor does.
          *   *Verdict:* Controversial moral thesis.
          *   *Relevance:* Even if you don't own the *idea*, you own the *credit* for the labor.
          *   *The Slide:* Confusing ownership of the *asset* with ownership of the *origin story*.

      *   **6. Linguistic Claim (Collapse of Idea/Expression):**
          *   *Claim:* The distinction is blurry. Wireframes *are* the expression of the logic.
          *   *Verdict:* Legally nuanced (wireframes are likely protected expression).
          *   *Relevance:* Undermines the roommate's premise entirely.
          *   *The Slide:* If wireframes = expression, the slogan is factually false in this context.

      *   **7. "Ideas Want to Be Free" (Stewart Brand):**
          *   *Claim:* Information flow should be unimpeded for societal progress.
