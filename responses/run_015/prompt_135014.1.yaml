answer: |-
  You are not mixing things up. You have put your finger on a very specific, recognized structural problem in philosophy of mind, cognitive science, and AI theory. You are describing one real phenomenon, though it wears different hats in different fields.

  Here is the breakdown of the concepts you are looking for and how the cases relate.

  ### 1. The Umbrella Concept: "Competence without Comprehension"
  The specific phrase you are looking for comes from **Daniel Dennett**. He calls this exact pattern **"Competence without Comprehension."** (It is the title of a key chapter in his book *From Bacteria to Bach and Back*, though I won't give you a reading list).

  Dennett argues that natural selection (Darwin) and neural networks (Turing) both produce highly competent systems that do not require an internal "homunculus" or understanding of *why* they work. The competence is derived from the history of selection (evolutionary or loss-function), not from internal semantic grasp.

  ### 2. The "Harm" Concept: Why Transparency Breaks It
  You asked specifically about the inversion: *why adding comprehension hurts.* "Tacit knowledge" implies the knowledge is just hidden; it doesn't imply that revealing it breaks the machine.

  The concept for "explicitation causes failure" is best captured by two terms:

  *   **The Centipede's Dilemma:** This is a fable (often attributed to Kant or Darwin, though likely older) where a toad asks a centipede which leg it moves first. The centipede stops to think about it and becomes paralyzed, unable to walk. This is the folk name for the phenomenon you are describing.
  *   **Explicit Monitoring Theory (or Reinvestment):** In cognitive science (specifically the work of Sian Beilock), this is the rigorous term. It explains why experts (like your chess roommate) fail when they try to control automated skills consciously. High-level competence is often stored in **procedural memory** (fast, parallel, high-dimensional). "Comprehension" requires translating that into **declarative memory** (slow, serial, linguistic). This translation acts as a bottleneck. You are forcing a high-bandwidth process through a low-bandwidth channel.

  In AI, this is sometimes discussed as the difference between **System 1** (intuitive, statistical, latent space) and **System 2** (reasoning, step-by-step) processing. When you force a diffusion model or an LLM to "show its work" on tasks that are fundamentally holistic (like image composition or intuitive pattern matching), you are constraining its high-dimensional optimization with low-dimensional logical rules, which degrades the output.

  ### 3. Are the Darwin and Turing Cases the Same?
  They are **structurally homologous** but **mechanically distinct**.

  **The Similarity (The "Blindness"):**
  Both rely on **blind variation and selection**.
  *   **Evolution:** Mutates genes blindly; selection keeps what works. No understanding of optics is needed to build an eye; only the *result* needs to capture light.
  *   **Turing/NN:** Adjusts weights blindly (via gradient descent); the loss function keeps what reduces error. No understanding of "lighting" is needed to render an image; only the *pixel arrangement* needs to match the statistical distribution of "lit" images.

  In both cases, the "intelligence" is in the **process**, not the **agent**.

  **The Difference (The "Harm"):**
  *   **Evolution:** Evolution cannot "try" to understand. It is not a mind. The "harm" of comprehension only applies if a *human designer* tries to replace evolution with top-down intelligent design. If you try to build an eye using explicit optical rules without evolutionary search, you fail because the system is too complex to model explicitly.
  *   **Turing/AI & Chess:** These are real-time agents. They *can* engage in explicit reasoning (System 2). The "harm" here is **interference**. The chess grandmaster *has* the capacity for explicit calculation, but using it overrides the faster, more efficient intuition.

  ### Summary
  You are describing a single structural insight: **Optimization in high-dimensional spaces often breaks when forced into low-dimensional representations.**

  *   **Evolution** optimizes in the high-dimensional space of genetics.
  *   **Neural Nets** optimize in the high-dimensional space of weights.
  *   **Grandmasters** optimize in the high-dimensional space of pattern recognition.

  "Comprehension" or "Reasoning" is a low-dimensional, serial compression of that state. When you force the system to operate through that compression (by asking for reasons, or designing top-down), you lose the information density required for the competence.

  So, yes: **Competence without Comprehension** is the phenomenon, and **Explicit Monitoring/Interference** is the mechanism by which adding comprehension breaks it. You aren't imagining it; it's a central tension in current philosophy of mind.
