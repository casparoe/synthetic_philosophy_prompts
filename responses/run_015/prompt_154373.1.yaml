  Based on your five verdicts, I can construct a single coherent principle that accommodates all of them, though it requires a precise definition of "displacement" and a specific distinction regarding the *source* of neighborhood change. However, there is a significant tension between Case 3 and Case 5 that makes the principle fragile.

  ### The Principle: Structural Revaluation and Exclusion

  **Gentrification is a process of neighborhood revaluation wherein higher-capital agents (economic or cultural) actively target a lower-capital area for its latent value, resulting in the actual, imminent, or cultural exclusion of the original community, provided the neighborhood's physical fabric remains sufficiently intact to be appropriated rather than reconstructed.**

  This principle relies on three necessary clauses:

  1.  **The Revaluation Clause (Motivated by Cases 2 & 5):** The change must be driven by the *extraction of latent value* (profit, status, or cultural cachet) by newcomers, not merely by market fluctuation or necessity. This distinguishes gentrification from ordinary price shifts.
  2.  **The Exclusion Clause (Motivated by Cases 1, 2, 4, & 5):** There must be a mechanism of exclusion. This includes actual economic displacement (Case 2), imminent structural displacement via policy/investment (Case 4), or cultural erasure (Case 5). Mere price increases without displacement (Case 1) are insufficient.
  3.  **The Fabric Clause (Motivated by Case 3):** The process must involve the *appropriation of existing social and physical fabric*. If the physical neighborhood is exogenously destroyed (e.g., natural disaster) prior to investment, subsequent rebuilding is "reconstruction," not gentrification, because there is no existing community fabric to appropriate or displace.

  ### Analysis of the Tensions

  This principle accommodates your five judgments, but it exposes a specific friction point you identified: the distinction between **Case 3 (Disaster)** and **Case 5 (Factory Closure)**.

  *   **Why Case 3 is excluded:** Under the **Fabric Clause**, a natural disaster destroys the *physical* container of the community. When wealthier residents rebuild, they are filling a void left by destruction, not displacing an existing population from existing homes. The causal mechanism is safety/necessity, not speculative revaluation of the *existing* neighborhood.
  *   **Why Case 5 is included:** Under the **Revaluation** and **Exclusion Clauses**, the factory closure creates an *economic* vacuum, but the *housing and social fabric remain*. Artists and cafes move in to extract *cultural value* from the existing streetscape. The original residents are excluded culturally, even if not economically.
  *   **The Tension:** This distinction is narrow. In both cases, an exogenous shock creates an opening for wealthier agents. Your verdicts rely on the difference between *physical destruction* (Case 3) and *economic vacancy* (Case 5). Standard sociological literature often classifies Case 3 as "disaster gentrification," so your verdict here is the most unique and hardest to generalize, but it is coherent if one defines gentrification as the *takeover* of a living neighborhood rather than the *replacement* of a destroyed one.

  ### Prediction: The University Expansion Scenario

  **Scenario:** A large university expands, buying housing for student rentals, raising rents for others, while providing jobs and transit.

  **Verdict:** **This IS Gentrification.**

  **Application of Principle:**
  *   **Revaluation:** The university acts as a high-capital institutional agent targeting the neighborhood for its latent value (proximity to campus).
  *   **Exclusion:** Buying up housing and raising rents constitutes actual economic displacement/exclusion of non-student residents.
  *   **Fabric:** The housing stock is appropriated and repurposed, not reconstructed from scratch.
  *   **Nuance:** The provision of jobs and transit (benefits) does not negate the exclusionary mechanism. Under this principle, gentrification is defined by the *process of displacement/revaluation*, not the net welfare outcome. This is often termed "Institutional Gentrification" or "Studentification."

  ### Explicit Accommodation Check

  My account **can accommodate all five of your judgments**, but it does so by placing a heavy burden on the **Fabric Clause** to distinguish Case 3 from Case 5.

  If forced to identify which judgment is least stable within a broader theoretical framework: **Case 4 (The Prospective Verdict)** is the most vulnerable.
  *   **Reasoning:** Defining gentrification as "in progress" when *no residents have left and no construction has begun* relies entirely on reading the *intent* of investors and the *potential* of policy. If the rezoning is reversed or the market crashes, the "gentrification" vanishes without ever having harmed anyone. This makes gentrification a property of *contracts and laws* rather than *human outcomes*.
  *   **Conflict:** This tensions with Case 1, where material market pressure (rising rents) is deemed insufficient without displacement. In Case 4, *no* market pressure exists, yet it is deemed gentrification. The only bridge is the **Imminence** of the harm guaranteed by the rezoning. If one rejects "prospective harm" as a definition for a social phenomenon, Case 4 must be overturned.

  However, to remain faithful to your intuitions, the principle holds: **Gentrification is locked in by structural commitment (Case 4), not just market fluctuation (Case 1).**
