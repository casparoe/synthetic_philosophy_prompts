answer: |-
  The blame is fundamentally personal, not structural. The press is merely the instrument, but the corruption lies in the individual's willingness to hide behind the abstraction of "the public" to avoid ethical responsibility. Kierkegaard argues that structures do not possess agency; only individuals do. Therefore, the "spirit of the age" is actually the aggregate cowardice of individuals who refuse to stand alone. The press facilitates this evasion, but it does not compel it. The moral failure is the choice to substitute genuine commitment with detached observation.

  The phantom public works by creating a space where accountability is dissolved through diffusion. When an individual speaks as themselves, they risk being wrong, being judged, or having to act on their words. When they speak as part of "the public," they become anonymous. The public is a monster that is everywhere and nowhere; it is everybody and nobody. This allows people to express opinions without owning the consequences. You can criticize a decision without having the authority to make one, and you can demand changes without having the courage to implement them. The phantom public is essentially a hiding place where individuals gain the power of a collective while retaining the irresponsibility of a spectator.

  Regarding leveling, this is not democratic equality in the sense of elevating everyone to a state of dignity or rights. It is a negative process that flattens qualitative distinctions down to the lowest common denominator. True equality requires recognizing the value of the individual before God or ethics, but leveling erases the individual entirely. It treats all opinions as equal not because they are all worthy, but because none of them require passion or commitment to hold. Excellence is resented because it demands something from others; mediocrity is celebrated because it asks nothing. The press accelerates this by treating a trivial gossip item and a profound ethical truth with the same format, urgency, and weight. By presenting everything as "news," it suggests that everything is equally important and equally disposable.

  This connects directly to the tension between epistemic flooding and existential ownership. The flooding of information does not cause the loss of ownership; rather, the loss of ownership makes the flooding desirable. If your goal is to avoid the burden of becoming a self, then having access to everything allows you to know about the world without ever having to act in it. You can simulate understanding by consuming opinions rather than forming convictions. Kierkegaard sees this as a spiritual laziness. The press encourages a relationship to truth that is aesthetic and detached—you watch the truth happen rather than living it. The flooding provides the distraction necessary to keep the individual from the silence and isolation required for genuine appropriation.

  Ultimately, the structural feature of mass media amplifies the moral failure, but it does not create it. The mechanism of the phantom public relies on individuals voluntarily surrendering their singular voice to the crowd. Leveling succeeds only because individuals are unwilling to defend qualitative distinctions against the quantitative weight of the majority. The loss of existential ownership is the root sin; the press is simply the mirror that reflects this emptiness back to us as "public opinion."
