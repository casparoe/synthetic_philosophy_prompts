answer: |-
  Dear Members of the Selection Committee, I am writing to propose an eight-week summer research project entitled The Pragmatic Boundaries of Hypocritical Blame, which seeks to resolve a persistent stalemate in moral philosophy regarding the conditions under which hypocrisy undermines an agent's standing to blame others. Contemporary debates have largely converged on the intuition that hypocrites lack the moral authority to criticize others for wrongs they themselves commit, yet disagreement remains sharp regarding the precise similarity required between the hypocrite's conduct and the blamed party's conduct to trigger this loss of standing. Standard accounts typically treat this similarity as a matter of moral taxonomy, arguing that standing is lost only when the hypocrite is guilty of the same type of wrong or a wrong of equivalent moral severity. My project challenges this assumption by arguing that these accounts stall because they ignore the pragmatic framework of address within which the blame occurs. The precise question driving this research is whether hypocrisy defeats standing only when the hypocrite's failing belongs to the same interactional or institutional domain as the failing being blamed, where domains are carved out not by moral taxonomy but by the norms governing the particular second-personal exchange. For example, does a senior researcher who cuts corners on data analysis lose standing to blame a junior colleague for cutting corners on grant reporting if both acts fall under the same institutional role-structure, even if the moral descriptions differ, whereas she retains standing if the colleague's wrong belongs to an entirely separate interactional frame such as their private domestic life?

  Existing accounts of hypocrisy and standing leave this pragmatic dimension open because they prioritize the content of the wrong over the context of the accusation. Current theories tend to ask whether the hypocrite is guilty of the same vice or whether their commitment to the norm is sufficiently inconsistent, but they rarely examine whether the hypocrite and the blamed party are participating in the same normative game. By shifting the focus from moral symmetry to institutional or interactional symmetry, this project aims to explain why we sometimes tolerate hypocrisy in blame and other times find it intolerable, based on whether the accuser is violating the rules of the specific practice within which they are issuing the blame. This distinction matters because it suggests that standing is not merely a function of individual moral purity but is relational and context-dependent, rooted in the specific authority structures that enable second-personal address. If successful, this reframing would move the debate beyond abstract moral matching toward a more nuanced understanding of how social roles and communicative contexts regulate our authority to hold one another accountable.

  To investigate this question within the allotted timeframe, the eight weeks will be divided into three overlapping phases of conceptual labor. During the first two weeks, I will map the existing landscape of standing-based accounts of hypocrisy to isolate exactly where the pragmatic dimension has been overlooked or dismissed. This involves reconstructing the arguments for moral symmetry and commitment-based views to identify their failure points regarding cross-domain blame. In the subsequent three weeks, I will construct the positive argument for the pragmatic framework view, specifically developing a criterion for what constitutes a single interactional or institutional domain. This will require analyzing cases like the senior researcher example to determine whether role-structures or normative expectations provide a sharper boundary than moral taxonomy. The final three weeks will be dedicated to stress-testing this criterion against counterexamples and drafting a complete paper. This includes considering edge cases where institutional domains overlap or where an agent holds multiple roles, ensuring the theory does not collapse back into a proxy for moral similarity. The eighth week will be reserved for revision and polishing the final manuscript for potential submission to a student philosophy journal.

  A successful result for this project will look like a defensible criterion that distinguishes between domain-internal and domain-external hypocrisy without relying on hidden moral premises. Specifically, success means producing a draft that demonstrates how two morally distinct wrongs can nonetheless undermine standing if they occur within the same pragmatic framework, while two morally similar wrongs might not undermine standing if they occur in disjointed frameworks. Conversely, failure would look like an inability to distinguish the pragmatic domain from the moral type, resulting in a theory that merely restates the moral symmetry view in different language. Another marker of failure would be if the concept of an interactional domain proves too vague to do explanatory work, leaving the theory unable to deliver clear verdicts on specific cases. I will consider the project successful if I can articulate at least three necessary conditions for domain identity that survive initial objection.

  I offer an honest assessment that eight weeks is sufficient to produce a robust draft but insufficient to fully settle the metaphysical underpinnings of the proposed framework. The primary risk causing this project to collapse is conceptual ambiguity regarding what constitutes an institutional domain. If I cannot precisely define the boundaries of a pragmatic framework without appealing to the very moral intuitions I aim to bypass, the argument will become circular. Additionally, there is a risk of scope creep where the analysis of second-personal address expands beyond hypocrisy into general authority theory, which would be unmanageable in this timeframe. To mitigate this, I will strictly limit the scope to cases of interpersonal blame within professional or institutional settings. Despite these risks, the focused nature of the question suggests that a meaningful contribution is achievable within the summer term, provided I maintain discipline regarding the definition of pragmatic domains. I am confident that this research will not only advance my own development as a philosopher but also offer a fresh perspective on a stalled debate within the broader community. Thank you for your time and consideration of this proposal. Sincerely, [Applicant Name].
