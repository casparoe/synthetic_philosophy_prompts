      Hey, this is a fascinating knot to untangle, and you are right to suspicion the book analogy because it feels smooth until you run your hand over the edges. If we map the book argument strictly to see what holds, we have to say that in this analogy the original committee or sculptor acts as the author, the public passing through the square is the reader, the town square itself serves as the library, the original donors or city council of the time are the publishers, the physical statue counts as the copy, and taking it down is equated to burning. That is the skeleton they are working with, but the flesh falls off in several places. Some of these failures are just decorative, like the fact that books usually have many copies while a statue is unique, because you could argue a photograph of the statue serves as the distributed copy, so that difference does not necessarily break the logic of preserving the information. The failures that actually do work against the conclusion are deeper, specifically that a book exists primarily to transmit information while a statue exists to confer honor, and that a library is designed to store conflicting ideas side by side while a town square is a scarce space designed to curate a specific civic identity. When the pro-statue side uses the book analogy they are quietly importing the assumption that the statue's function is informational rather than honorific, that keeping it is an act of silence or neutrality rather than a continuing act of maintenance by whoever pays for the square today, and that the square is an archive rather than a list of who this town admires.

      Once you put those imports on the table the contextualize-don't-remove conclusion gets shaky because it relies on the statue being a neutral text that can be footnoted, whereas if the statue is a eulogy then a plaque contradicting it is not a footnote but a rebuttal bolted onto the original speech act. A plaque might be doing all the work of the book analogy while the statue remains a monument to praise, creating two incompatible statements in one spot, or it might be a compromise that admits the statue is no longer functioning as honor but as history, which changes the nature of the object itself. The street name question breaks the book picture entirely because you cannot walk past a street name without invoking it, whereas you can ignore a statue, and you cannot hang a plaque on a road sign to explain the etymology every time someone mails a letter. A better comparison for a street name is vocabulary or titles, because using a street name is like speaking a word that honors someone, and keeping the name is like refusing to stop using a term that has become offensive or inaccurate, which is less about burning a book and more about editing the language the community uses to describe itself. As for who should decide, it seems clearest that the current living community should make the choice through their elected representatives or a designated committee, because monuments are gifts from the past to the present and the present recipients have the right to refuse the gift or decide where to display it, rather than being bound forever by the values of the donors who are no longer here to maintain the square or live with the consequences.

