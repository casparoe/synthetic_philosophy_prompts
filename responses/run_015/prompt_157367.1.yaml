prompt: |-
  Write a deadpan parody of a federal regulatory advisory—formatted as a numbered bureaucratic guideline document from a fictional “Office of Counterfactual Risk Assessment”—warning citizens about “XOR blackmail scams” and outlining “counterfactual mugging preparedness protocols.” The voice should be that of an overly serious government agency treating decision-theoretic thought experiments as genuine public-safety threats. The piece should run approximately 650 words, with formal sections titled “I. Definitions,” “II. The XOR Blackmail Mechanism,” “III. Counterfactual Mugging Response Procedures,” and “IV. Citizen Obligations Under Competing Reasoning Frameworks.”

  The satire should exaggerate real structural features of these concepts rather than inventing fake ones: the XOR scenario should turn precisely on the blackmailer’s counterfactual knowledge of your refusal and the payoff only in worlds where you comply; the mugging scenario should turn on the counterfactual dependence between your present decision and a distant agent’s prior action in an inaccessible branch. The document should implicitly take positions—e.g., recommending that citizens “pre-commit to non-payment across all accessible worlds” and “treat branch-weighted harm as administratively equivalent to actual harm”—that expose the tension between evidential and causal reasoning without ever naming those theories. Include one invented “Case Study” sidebar describing a citizen who receives a blackmail letter from a “parallel-branch predictor” and must decide whether to pay based on the predictor’s accuracy in worlds where he refuses. The parody should remain readable to someone familiar with the decision-theoretic literature and fair to it: a specialist should recognize that the author understands why these are conceptual puzzles rather than practical scams. Do not include citations, bibliographies, named living authors, or reading lists. Keep the irony sustained and deadpan—never wink at the reader. End with a bureaucratic disclaimer that inadvertently collapses the distinction between actual and counterfactual injury, leaving the agency’s jurisdiction undefined.
