  **OFFICE OF COUNTERFACTUAL RISK ASSESSMENT (OCRA)**
  **ADVISORY NOTICE 892-B: NON-ACTUALIZED THREAT VECTORS**
  **CLASSIFICATION: PUBLIC/PARA-TEMPORAL**

  **I. DEFINITIONS**
  For the purposes of this advisory, a "Counterfactual Branch" refers to any causally inaccessible timeline resulting from a stochastic event or predictive algorithm. "Actualized Harm" denotes injury sustained in the primary timeline. "Counterfactual Harm" denotes injury sustained in a branching timeline that would have been actualized had the citizen made a different decision. Citizens are advised that OCRA jurisdiction extends to any harm with a non-zero branch weight, regardless of local actualization status.

  **II. THE XOR BLACKMAIL MECHANISM**
  Citizens may receive correspondence from a Predictive Entity demanding payment. This constitutes an XOR Blackmail scenario. The Entity sends the demand if and only if (Damage Occurred XOR Citizen Pays). Upon receipt of the letter, the citizen enters a logical bind. If the citizen pays, the condition (Damage XOR True) implies Damage Occurred is True. If the citizen refuses, the condition (Damage XOR False) implies Damage Occurred is False.

  While causal reasoning suggests payment cannot prevent damage already incurred or avoided, evidential metrics indicate that payment correlates perfectly with the existence of the damage. Citizens are warned that refusing payment confirms safety in the current branch but may invalidate insurance coverage predicated on cross-branch risk pooling. The Entity profits only in worlds where compliance is rendered logically necessary by the receipt of the letter.

  > **CASE STUDY 44-C: THE HENDERSON INCIDENT**
  > Citizen Henderson received a letter from a parallel-branch predictor stating: "I have sent this letter because either your house burned down or you are paying me $1,000, but not both." Henderson consulted OCRA guidelines. The predictor had 99% accuracy in simulating Henderson's refusal across accessible worlds. Henderson refused payment. Investigation confirmed no fire occurred. However, Henderson was cited for failure to mitigate branch-weighted liability, as his refusal reduced the aggregate utility of the Henderson manifold.

  **III. COUNTERFACTUAL MUGGING RESPONSE PROCEDURES**
  In a Counterfactual Mugging event, a distant agent (hereafter "Omega") performs a stochastic operation. If the outcome is Heads, Omega requests $100. If the outcome is Tails, Omega awards $10,000 to the citizen, contingent upon the citizen's disposition to pay had the outcome been Heads.

  Citizens currently facing the Heads outcome cannot influence the coin toss. However, their current decision determines the payout in the inaccessible Tails branch. OCRA protocols dictate that citizens must treat the Tails branch payout as administratively equivalent to current liquidity. Failure to pay $100 in the Heads branch constitutes forfeiture of the $10,000 in the Tails branch. Citizens are instructed to execute payment immediately to satisfy cross-branch contractual obligations, even if the benefit is realized solely by a counterpart who did not receive the demand.

  **IV. CITIZEN OBLIGATIONS UNDER COMPETING REASONING FRAMEWORKS**
  Citizens must pre-commit to non-payment across all accessible worlds regarding XOR scenarios to discourage letter transmission. Conversely, citizens must pre-commit to payment across all accessible worlds regarding Mugging scenarios to secure counterfactual rewards. This creates a regulatory conflict between causal independence and evidential correlation.

  To resolve this, citizens are required to adopt a Functional Decision Framework. You must act as though your decision determines the output of the logical function describing your behavior, rather than the specific physical act. Failure to align your decision algorithm with OCRA standards may result in penalties assessed against your expected utility across the multiverse. Citizens cannot claim ignorance of branching outcomes as a defense against liability.

  **DISCLAIMER**
  OCRA reserves the right to assess fines for injuries that did not occur but would have occurred had the citizen been the type of person to ignore this advisory. Distinction between actual and counterfactual injury is waived for processing efficiency. Jurisdiction applies to all worlds where this document is readable.
