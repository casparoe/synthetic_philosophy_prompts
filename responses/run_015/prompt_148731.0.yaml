      *   *Resolution:* It's a reciprocal relationship, but the existential condition is primary. The press is the "corresponding abstraction" to the spiritual emptiness. If people had passion/responsibility, the press would look different. But since they are reflective and passionless, the press becomes the tool of leveling.
