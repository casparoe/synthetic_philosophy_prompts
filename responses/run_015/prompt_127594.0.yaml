answer: |-
  Here's the scene: In the busy ICU, both nurses spot the same lethal pump malfunction seconds before it overdoses the patient. Nurse A moves instantly, correcting the flow because protocol demands vigilance and saving lives is the job, feeling nothing but the cold weight of obligation. Nurse B also fixes it, but their hands shake slightly because the specific error code mirrors the system glitch that nearly killed them five years ago; they act not just for the patient, but because seeing that flaw triggers a visceral, personal need to fix the broken thing that once broke them.

  So, here's how the three big frameworks slice this up. For Kant, Nurse A is the moral hero because they acted purely from duty, ignoring their feelings completely. Kant cares about the *why*, not the *what*, and since Nurse B was motivated by a personal emotional trigger (their own trauma), Kant says B's action has little to no moral worth—it's just an inclination, like helping someone because you like them, rather than because it's the right thing to do. Virtue ethics flips this and ranks B higher because B is actually paying attention to the reality of the situation; A is just following a rulebook, but B perceives the specific structural danger because of their lived experience, showing better practical wisdom and character. Consequentialism says the outcome is a wash since the patient lives either way, but they'd argue B is more reliable over time because that personal recognition makes them hyper-vigilant about this specific kind of failure, whereas A might miss it if the protocol doesn't explicitly cover it.

  The feature doing all the heavy lifting here is that **biographical structural recognition**—the fact that B sees the error through the lens of their own past survival. If you remove that, B just becomes someone who noticed a mistake, and the distinction blurs; without that personal history, B looks more like A (just following training), and Kant would probably upgrade B's moral worth because the action becomes less about self-referential emotion and more about professional duty. But a Kant defender would attack B's reason hard, arguing that your moral worth shouldn't depend on whether you happen to have survived a similar trauma. They'd say B's motivation fails the test of autonomy because it's driven by a psychological impulse (heteronomy) rather than rational law; if B hadn't survived that glitch years ago, would they still have acted? If the answer is "maybe not," then B isn't truly moral, they're just reacting to a stimulus, whereas A would save the patient regardless of their personal history because reason demands it.
