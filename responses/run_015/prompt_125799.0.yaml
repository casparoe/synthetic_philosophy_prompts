  **OFFICE FOR AESTHETIC INTEGRITY**
  **DRAFT STATUTORY GUIDANCE NO. 442-B**
  **SUBJECT: FORMATION OF AESTHETIC JUDGMENTS**
  **CONSULTATION PERIOD: CLOSED**

  **1. PREAMBLE**
  1.1 This Guidance is issued pursuant to the Aesthetic Integrity Act (2024). Its purpose is to ensure alignment between expressed judgment and direct sensory experience. The Office maintains that value attributions regarding artistic works derive validity solely from the encounter between the subject and the object.

  **2. DEFINITIONS**
  2.1 **Verified Encounter:** Physical presence within the sensory field of the work for not less than eighty percent of its duration. For textual works, this requires ocular engagement with every grapheme. For auditory works, uninterrupted acoustic reception.
  2.2 **Descriptive Predicate:** Empirical data transmissible without experience. Permitted examples include: running time, key signature, pigment composition, plot summary, cast list.
  2.3 **Aesthetic Predicate:** Any attribution dependent on subjective reception. These cannot be inherited.
  2.4 **Predicate Classification Rulings:** The Office issues binding classifications on disputed terms.
  > *Ruling 44.1:* "Constructed of marble" is Descriptive. "Cold" is Aesthetic.
  > *Ruling 44.2:* "Contains three acts" is Descriptive. "A slog" is Aesthetic.
  > *Ruling 44.3:* "Well-made" is Aesthetic. "Joined by mortise and tenon" is Descriptive.
  > *Ruling 44.4:* "Overrated" is Aesthetic. "Received negative press in 1924" is Descriptive.
  2.5 **Worked Example:** A critic states, "The film is moving." This violates Clause 2.3. To comply, the critic must state, "Viewers will likely experience sadness." The former asserts a property of the film; the latter predicts a reaction in the viewer.

  **3. CRITICAL PRACTICE AND LOOPHOLES**
  3.1 Critics are prohibited from issuing verdicts regarding works they have not encountered. However, critics may issue Reception Predictions.
  3.2 A Reception Prediction takes the form: "Subject X, upon encounter, will experience Y." This is compliant because it describes the subject, not the work.
  3.3 **Administrative Observation:** The Office notes that the substance of criticism has migrated entirely into Reception Predictions. While the semantic content remains identical to prohibited verdicts, the grammatical subject has shifted from object to viewer. This is fully compliant.
  3.4 To maintain clarity, all compliant reviews must carry the header: "PREDICTION OF REACTION ONLY. NOT A VERDICT ON OBJECT."
  3.5 Critics attempting to revert to verdicts via implication (e.g., "It is impossible not to be moved") will be referred to the Compliance Panel.

  **4. UNAVAILABLE WORKS**
  4.1 Certain works cannot be encountered by living subjects. Examples include: frescoes destroyed by flood; scores never performed; performances scheduled for the twenty-seventh century; works held in private collections without public access.
  4.2 **Policy:** No aesthetic judgment may be formed regarding these works. However, to facilitate discourse, the Office permits **Proxy Acquaintance**.
  4.3 A Licensed Surrogate may encounter the work (or the remaining records thereof) and file Form 12 (Affidavit of Experience).
  4.4 Third parties may then cite the Surrogate's judgment as "Provisional."
  4.5 **Status:** A Provisional Judgment becomes Final only upon Direct Encounter by the citing party. For works destroyed or inaccessible, the Judgment remains permanently Provisional.
  4.6 **Reductio Note:** The Office acknowledges that a Provisional Judgment based on a Surrogate's Affidavit is functionally identical to taking someone's word for it. However, the paperwork differs. The integrity of the process is maintained by the form, not the epistemology.

  **5. RISK ASSESSMENT (ANNEX C)**
  5.1 **Identified Risk:** Ordinary critical practice functions without these restrictions. Public discourse currently relies on trusted testimony. Implementation of this Guidance will render most existing art talk either unlicensed or false.
  5.2 **Mitigation:** Risk accepted. Integrity is prioritized over volume of discourse.

  **6. COMPLIANCE AND VERIFICATION**
  6.1 The Office does not encounter works directly. Verification of compliance is conducted by Inspectors.
  6.2 Inspectors verify that the subject has filed a Form 1 (Declaration of Encounter) prior to issuing a Judgment.
  6.3 Inspectors do not verify the contents of the Encounter, only the existence of the Form.
  6.4 In cases of dispute, the Office convenes a Panel. The Panel reviews Inspector Summaries. The Panel does not encounter the work. The Panel relies on the Inspector's summary of the Form signed by the subject declaring they encountered the work.
  6.5 **Final Authority:** A judgment is deemed valid when the relevant paperwork confirms that a verified subject has asserted a verified encounter. The Office certifies the chain of assertion.

  **7. EFFECTIVE DATE**
  7.1 This Guidance takes effect upon signature by the Director of Integrity.
  7.2 The Director signs based on the recommendation of the Legal Panel.
  7.3 The Legal Panel recommends based on the consensus of the Drafting Committee.
  7.4 The Drafting Committee agrees based on the principle stated in Clause 1.1.

  **ISSUED BY THE OFFICE FOR AESTHETIC INTEGRITY**
  **REF: OAI/442-B/DRAFT**
  **DATE: 14 OCTOBER 2024**
