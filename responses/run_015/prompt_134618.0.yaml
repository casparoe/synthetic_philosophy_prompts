prompt: |-
  I am a fourth-year PhD student in systems neuroscience, and my PI has asked me to draft a one-page interpretation guide for the lab: a short written procedure that anyone in the group — including first-year rotation students with no philosophy background — can run on a single sentence before it goes into a paper, a preprint, or a grant abstract, in order to decide what we are entitled to say when we write that some neural population computes, encodes, represents, or implements something, and what we are not.

  The setting: we produce sentences of this shape dozens of times per manuscript, they are the sentences reviewers have started attacking in our last three submissions, and the lab has made a public commitment to not overclaiming in abstracts. So the stakes are reputational and practical rather than purely theoretical. The constraints are that the procedure must be runnable in about ten minutes on one sentence, must not require new experiments or any formalism beyond what a first-year can follow, and must be signed off by my PI — which means it has to say plainly which steps are tests and which are judgment calls being handed to her.

  What I need is the work of translation: the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the remaining question to a person because the issue is one of values or of theoretical taste rather than fact.

  I have three half-formed ideas about where our disputes actually come from, and I want you to use them, repair them, or replace them with better cuts.

  First, I suspect we are not making one kind of claim but three, and that most of our arguments are cases of one person meaning one and another hearing another: a descriptive claim (the formalism is a compact summary of a measured response profile); an intervention-licensing claim (the formalism lets you predict what the system will do under interventions or stimuli you have not measured, because the mapping from physical states to formal states is fixed independently of the outcome being predicted); and a constitutive claim (the system performs the cognitive job in question because it computes that function — the formalism is doing explanatory work, not bookkeeping). I would like the verdict of the procedure to be one of these labels rather than a yes or no, and I would like it to return an error when the intended reading has not been stated, forcing us to choose.

  Second, the mapping is where I think most of the cheating happens, in two directions. The mapping from neural variables to formal variables is usually estimated on the same data used to test the claim, and can be re-estimated whenever behaviour changes, so the claim survives every outcome by moving the mapping — I think of this as mapping drift, and I want a preregistration-style step that fixes the mapping and the failure condition before the held-out data are looked at. In the other direction, the population itself can be re-carved until it fits, and a good deal of the formal machinery often lives outside the animal, in an offline decoder that only an experimenter can read out; a claim that the circuit computes X then turns out to be a claim that X is recoverable from the circuit by us. I want the procedure to be able to say that the computation was completed in the analysis pipeline rather than in the brain.

  Third, I do not see how to get from passing individual claims to the sentence our grant framing depends on, the brain is a computer. Computation claims do not seem to aggregate: a decomposition that works for one assayed circuit is not automatically part of a single coherent decomposition of the whole animal, and the question of whether the constitutive reading has to hold of the organism looks to me like a commitment rather than a result.

  Please run the finished procedure on three claims. First: direction-selective circuits in the retina compute the axis of visual motion. Second, and this is the one I expect not to like — my own thesis claim, that dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions, where the evidence is a decoder trained offline on choice behaviour and the mapping is re-fit whenever the task changes; if the procedure exempts my own claim I will have written a useless document, so I want the honest output. Third: a cultured network of cortical neurons on a multielectrode array, trained with feedback to keep a simulated vehicle inside a lane, computes a control policy — where I worry the procedure either returns a yes and collapses into the triviality that any system computes anything under some mapping, or returns a no and cannot tell me what the in-brain case has that this one lacks.

  Finally, say what the procedure cannot do, including whether it can say anything at all about whether the brain is a computer, and flag in the guide's own voice the cases where it is likely to misfire. Please do not give me a literature review or references; I will insert citations myself.
reasoning: |-
  Here's a thinking process that leads to the suggested interpretation guide:

  1.  **Analyze the Request:**

      *   **User:** 4th-year PhD student in systems neuroscience.
      *   **Task:** Draft a one-page interpretation guide (procedure) for the lab.
      *   **Audience:** Lab members (including 1st-years with no philosophy background).
      *   **Goal:** Determine entitlement to use terms like "computes," "encodes," "represents," or "implements" in a single sentence (paper/preprint/grant).
      *   **Constraints:**
          *   Runnable in ~10 minutes.
          *   No new experiments.
          *   No complex formalism.
          *   Must distinguish between *tests* (factual) and *judgment calls* (values/theory, handed to PI).
          *   Output must be a label (Descriptive, Intervention-Licensing, Constitutive) or an Error.
          *   Must address "mapping drift" and "analysis pipeline" issues.
          *   Must run on three specific test cases (Retina, dACC thesis, Cultured Network).
          *   Must include limitations (what it can't do, specifically regarding "the brain is a computer").
          *   *No literature review or references.*
      *   **Tone:** Practical, precise, authoritative but humble about limits, suitable for a lab manual.

  2.  **Deconstruct the User's "Half-Formed Ideas":**

      *   *Idea 1 (Three Claims):* Descriptive (summary), Intervention-Licensing (prediction), Constitutive (explanation). *Verdict:* This is strong. It aligns well with standard philosophical distinctions (instrumentalism vs. realism) but translated into lab speak. I need to make the criteria for each distinct and testable.
      *   *Idea 2 (Mapping Cheating):* Mapping drift (fitting on test data) and Readout Problem (computation in analysis vs. brain). *Verdict:* Crucial. Needs a "Fixed Mapping" test and a "Downstream Readout" test.
      *   *Idea 3 (Aggregation/Global Claim):* "The brain is a computer." *Verdict:* The procedure should explicitly *not* solve this. It should flag this as a "Judgment Call/PI Sign-off" issue because it's a metaphysical commitment, not an empirical result of a single experiment.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to look like a checklist or flowchart text.
      *   *Step 0: Input.* The sentence itself.
      *   *Step 1: Intent.* Force the author to pick one of the three claim types. If they can't, Error.
      *   *Step 2: Mapping Integrity.* Address the "cheating." Is the mapping fixed *before* looking at the test data? Is the readout biological or analytical?
      *   *Step 3: Evidence Threshold.* What data supports the specific claim type?
      *   *Step 4: The Handoff.* Where does science end and philosophy/PI discretion begin?

      *   *Refining the Tests:*
          *   *Descriptive:* Needs correlation/statistical fit.
          *   *Intervention:* Needs generalization to *new* conditions without re-fitting.
          *   *Constitutive:* Needs a mechanism or a downstream consumer that uses the code.

      *   *Refining the "Mapping" Issue:*
          *   Test: Was the decoder/encoding model fit on the *same* data used to claim the computation? If yes, downgrade to Descriptive.
          *   Test: Is there a biological readout? If the only readout is the experimenter's laptop, it's "Recoverable," not "Computed."

      *   *Refining the PI Handoff:*
          *   The transition from "This circuit does X" to "The brain is a computer" is the aggregation problem. The guide needs to stop before making that leap.

  4.  **Running the Test Cases:**

      *   *Case 1: Retina (Direction Selectivity).*
          *   Claim: "Retina computes axis of motion."
          *   Mapping: Starburst amacrine cells have known anatomy/physiology.
          *   Readout: Ganglion cells fire based on this.
          *   Verdict: Likely Constitutive or Intervention-Licensing. Strong biology.
      *   *Case 2: dACC (Thesis Claim).*
          *   Claim: "dACC computes cost-benefit comparison."
          *   Evidence: Offline decoder, mapping re-fit per task.
          *   Mapping Drift: Yes (re-fit).
          *   Readout: Offline decoder (experimenter).
          *   Verdict: Should fail Constitutive. Likely drops to Descriptive ("encodes information about..."). This is the "honest output" the user wants.
      *   *Case 3: Cultured Network (DishBrain).*
          *   Claim: "Computes control policy."
          *   Mapping: Feedback loop involves external computer.
          *   Readout: The "policy" exists in the closed loop, partly outside the cells.
          *   Verdict: Traps the "triviality" risk. If the mapping is arbitrary, it's Descriptive. If the loop is tight, maybe Intervention. But "Constitutive" is hard because the "goal" is external.

  5.  **Drafting the Content (incorporating constraints):**

      *   *Length:* Keep it tight. One page equivalent.
      *   *Voice:* Lab manual style. Direct.
      *   *Sections:* Purpose, The Three Labels, The Procedure (Steps 1-4), The PI Handoff, Limitations.

  6.  **Review against Constraints:**

      *   *10 minutes?* Yes, it's a checklist.
      *   *First-year friendly?* Avoid jargon like "homuncular fallacy" or "teleosemantics." Use "Who reads the signal?"
      *   *PI Sign-off?* Explicitly mark where the PI decides.
      *   *No References?* Check.
      *   *Test Cases?* Need to include the analysis of the three cases as requested in the prompt ("Please run the finished procedure on three claims"). *Correction:* The prompt asks me to run the procedure *in the response*, not necessarily include the run *inside* the guide text itself, but the guide must be robust enough to handle them. I will present the Guide first, then the Analysis of the Three Claims as a separate section to show it works.
      *   *Limitations?* Must explicitly state it cannot solve "Is the brain a computer?"

  7.  **Final Polish:**

      *   Ensure the distinction between "Encoding" (Descriptive) and "Computing" (Constitutive/Intervention) is clear.
      *   Make sure the "Mapping Drift" check is prominent.
      *   Ensure the "Readout" check distinguishes between brain reading the brain vs. experimenter reading the brain.
      *   *Self-Correction on Case 2:* The user wants the document to be useful. If it bans their thesis claim entirely, they might feel it's too harsh. However, they asked for an *honest* output. If the procedure downgrades "computes" to "encodes," that is scientifically honest and protects against reviewer attacks. I will ensure the guide allows "encodes" as a valid Descriptive label, just not "computes."
      *   *Self-Correction on Case 3:* The dishbrain case is tricky. If the procedure says "No" to dishbrain but "Yes" to retina, it needs to justify why. The justification is the *internal* readout vs. *external* readout.

  8.  **Finalizing the Text:** (Mental check of the "One Page" constraint). I need to be concise. I will structure it as a formal lab protocol.

      *   *Title:* Lab Protocol 001: Semantic Entitlement Check.
      *   *Input:* The Sentence.
      *   *Step 1:* Select Claim Type.
      *   *Step 2:* Mapping Stability Check.
      *   *Step 3:* Readout Location Check.
      *   *Step 4:* Generalization Check.
      *   *Output:* Label or PI Review.
      *   *Limitations Section.*

      *   *Then:* The Analysis of the Three Claims (as requested by the prompt "Please run the finished procedure on three claims").
      *   *Then:* Limitations/Misfire analysis.

      *(Self-Correction)*: Wait, the prompt asks for the *guide* and then asks me to *run* it on the three claims in the response. It also asks to flag cases where it misfires *in the guide's own voice*. I will integrate the limitations into the guide's footer or appendix, and then provide the run-through separately.

      *Wait, one more constraint:* "flag in the guide's own voice the cases where it is likely to misfire." Okay, I will put a "Warning/Misfire" section *inside* the guide text.

      *Let's refine the "Three Claims" logic:*
      1.  Descriptive: "Activity patterns correlate with X." (Safe)
      2.  Intervention-Licensing: "Activity patterns predict X in novel condition Y without re-fitting." (Stronger)
      3.  Constitutive: "Downstream circuit uses X to drive behavior." (Strongest)

      *Mapping Drift:* If you re-fit for every condition, you fail Intervention.
      *Readout:* If the decoder is offline, you fail Constitutive.

      *Let's write it.*

      *(Final check on Case 2)*: The user says "if the procedure exempts my own claim I will have written a useless document." This means they *want* the procedure to catch the overclaim. So if their thesis claim relies on re-fitting and offline decoding, the procedure *must* downgrade it from "Computes" to "Encodes" or "Contains information recoverable by..." This is the "honest output."

      *(Final check on Case 3)*: The worry is triviality (everything computes) or false negative (dishbrain is same as brain). The distinction is the *boundary of the system*. If the "policy" relies on external feedback, the computation is in the loop, not the cells. The guide needs to check "System Boundary."

      *Okay, ready to draft.*
answer: |-
  # LAB PROTOCOL 001: SEMANTIC ENTITLEMENT CHECK
  **Effective Date:** Immediately  
  **Applies To:** All manuscripts, preprints, and grant abstracts  
  **Time Cost:** ~10 minutes per sentence  
  **Required:** The sentence in question; the associated Methods/Results figures.

  ## PURPOSE
  To prevent reviewer rejection based on overinterpretation. This procedure determines whether a sentence claiming a neural population *computes*, *encodes*, *represents*, or *implements* a variable is supported by the data provided. It does not determine truth; it determines entitlement to specific vocabulary.

  ## THE THREE CLAIM LABELS
  You must assign one of the following labels to the sentence. If you cannot distinguish between them, you are not entitled to use strong verbs (compute/implement).

  1.  **DESCRIPTIVE (Safe):** The formalism is a compact summary of measured response profiles.
      *   *Allowed Verbs:* Encodes, correlates with, carries information about.
      *   *Requirement:* Statistical fit on held-out data.
  2.  **INTERVENTION-LICENSING (Strong):** The formalism predicts system behavior under novel interventions/stimuli without re-fitting the mapping.
      *   *Allowed Verbs:* Transforms, maps, predicts.
      *   *Requirement:* Generalization to unmeasured conditions with fixed parameters.
  3.  **CONSTITUTIVE (Strongest):** The system performs the cognitive job *because* it computes that function; the formalism explains the mechanism.
      *   *Allowed Verbs:* Computes, implements, represents (in the teleological sense).
      *   *Requirement:* Evidence of a downstream biological consumer that uses the code, or a mechanism that enforces the mapping physically.

  ---

  ## THE PROCEDURE

  ### STEP 1: INTENT DECLARATION (Author)
  Write down which of the three labels above you intend.
  *   **STOP:** If you cannot choose one, rewrite the sentence using neutral language (e.g., "is associated with").
  *   **PROCEED:** If chosen, move to Step 2.

  ### STEP 2: MAPPING STABILITY TEST (Fact Check)
  Examine how the neural variables were mapped to the formal variables (e.g., decoder weights, encoding model parameters).
  *   **Q2.1:** Was the mapping fitted on the *same* data used to claim the result?
      *   *Yes:* Downgrade claim to **DESCRIPTIVE**. Stop.
      *   *No:* Proceed.
  *   **Q2.2:** If the task/behavior changes, is the mapping re-fit to maintain the claim? (Mapping Drift)
      *   *Yes:* Downgrade claim to **DESCRIPTIVE**. Stop.
      *   *No (Mapping is fixed across conditions):* Proceed to Step 3.

  ### STEP 3: READOUT LOCATION TEST (Fact Check)
  Determine where the "result" of the computation is read.
  *   **Q3.1:** Is the readout performed by a downstream biological circuit (e.g., spikes driving muscles, one area driving another)?
      *   *Yes:* Eligible for **CONSTITUTIVE**.
      *   *No (Readout is offline/experimenter/decoder):* Downgrade to **DESCRIPTIVE** or **INTERVENTION-LICENSING** (if Step 2 passed). You cannot claim the brain *computes* X if only the *experimenter* computes X from the brain.
  *   **Q3.2:** Is the "system boundary" drawn such that essential feedback loops lie outside the tissue? (e.g., dishbrain + computer).
      *   *Yes:* The computation belongs to the *loop*, not the cells. Qualify the claim (e.g., "the closed-loop system computes"). Stop.

  ### STEP 4: THE PI HANDOFF (Judgment Call)
  If you have passed Steps 2 and 3 for a **CONSTITUTIVE** claim, you have satisfied the factual constraints. However, moving from "This circuit computes X" to "The brain is a computer" or "This explains the behavior" involves theoretical commitment.
  *   **Action:** Flag the sentence for PI review.
  *   **Note to PI:** The author has established mapping stability and biological readout. The remaining decision is whether this specific function is *explanatorily privileged* over other possible decompositions. This is a value judgment, not a data check.

  ---

  ## WARNING: KNOWN MISFIRE MODES
  *   **The Triviality Trap:** Any system can be described as computing *something* if the mapping is complex enough. Step 2 (Stability) is your defense. If the mapping requires as much information as the data itself, the claim is empty.
  *   **The Aggregation Error:** Passing this check for one circuit does not entitle you to claim the *organism* computes X. Do not aggregate Constitutive claims into a global theory without PI sign-off.
  *   **The "As-If" Loophole:** This procedure cannot distinguish between a system that *is* a computer and a system that behaves *as if* it were one. It only polices your language.

  ***

  # PROCEDURE RUN-THROUGH: THREE TEST CASES

  ### Case 1: Retina Direction Selectivity
  *Claim:* "Direction-selective circuits in the retina compute the axis of visual motion."
  *   **Step 1 (Intent):** Constitutive.
  *   **Step 2 (Mapping):** The wiring diagram (Starburst amacrine cell asymmetry) is fixed anatomically. It is not re-fit per stimulus. **Pass.**
  *   **Step 3 (Readout):** Ganglion cells fire spikes based on this input to drive central targets. The readout is biological. **Pass.**
  *   **Step 4 (Handoff):** PI Review.
  *   **Verdict:** **CONSTITUTIVE.** The language is entitled. The mechanism is physical, the mapping is fixed, and the readout is internal.

  ### Case 2: dACC Cost-Benefit Comparison (Thesis Claim)
  *Claim:* "Dorsal anterior cingulate computes a comparison of the costs and benefits of candidate actions."
  *   **Step 1 (Intent):** Constitutive.
  *   **Step 2 (Mapping):** Evidence relies on a decoder trained offline. Mapping is re-fit whenever the task changes (to maintain accuracy). **FAIL (Mapping Drift).**
      *   *Correction:* Downgrade to Descriptive.
  *   **Step 3 (Readout):** Readout is performed by an offline decoder (experimenter). No downstream consumer identified that explicitly uses this 'comparison' code to drive the specific choice in a way distinguishable from other variables. **FAIL (External Readout).**
  *   **Verdict:** **DESCRIPTIVE.**
      *   *Required Rewrite:* "Activity in dorsal anterior cingulate *encodes information sufficient to recover* a comparison of costs and benefits..."
      *   *Note:* This is the honest output. The current evidence supports correlation/recoverability, not mechanistic computation. Using "computes" invites reviewer attack on the mapping stability.

  ### Case 3: Cultured Network Control Policy
  *Claim:* "A cultured network... computes a control policy."
  *   **Step 1 (Intent):** Constitutive.
  *   **Step 2 (Mapping):** Feedback is provided via stimulation. If the mapping between cell activity and vehicle position is defined by the experimenter's code, check stability. Assume fixed for this case. **Pass.**
  *   **Step 3 (Readout):** The "policy" exists only in the closed loop involving the external computer and the simulated vehicle. The cells do not read out the policy; the loop maintains the lane. **FAIL (System Boundary).**
  *   **Verdict:** **INTERVENTION-LICENSING (with qualification).**
      *   *Required Rewrite:* "The *closed-loop system* implements a control policy..." or "The network activity *predicts* the control policy..."
      *   *Note:* This avoids the triviality trap. The cells alone do not compute the policy; the *coupling* does. Claiming the cells compute it implies the policy exists inside the dish, which is false.

  ***

  # LIMITATIONS STATEMENT
  **What this procedure cannot do:**
  1.  **Settle "Is the brain a computer?":** This is a metaphysical commitment, not an empirical finding. This guide ensures you do not smuggle that commitment into a single sentence without PI approval (Step 4).
  2.  **Guarantee Truth:** A claim can pass this check and still be wrong (e.g., the biological readout exists but uses a different code). This guide checks *entitlement*, not *correctness*.
  3.  **Resolve Theoretical Disputes:** If two labs define "representation" differently (e.g., causal role vs. structural isomorphism), this guide forces you to pick one (Step 1) but does not decide which is better.

  **Misfire Warning:**
  This procedure is likely to misfire on **learning systems**. If a circuit *learns* the mapping (plasticity), Step 2 may flag it as "Mapping Drift" incorrectly. In cases of active plasticity, the "fixed mapping" requirement must be applied to the *learning rule*, not the weights. Flag these for PI review.
