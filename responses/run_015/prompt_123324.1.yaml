prompt: |-
  Next term I'm teaching a grad seminar on consciousness, and before the split-brain week I hand out a one-page "where I stand" sheet so the students have something to argue with. Here's my draft. I'd rather find the problems myself than have the smartarse in the back row find them for me:

  1. The commissurotomy data — and the graded cases around it, partial sections, callosal agenesis, adult hemispherectomy — convince me that one skull can contain two simultaneous streams of experience that aren't co-conscious with each other. So I reject the strong unity thesis.
  2. But I still think there's one subject there: one person, with a disunified mental life, not two people.
  3. I'm a physicalist about all of it. Which experiences are co-conscious with which, and how many subjects there are, are settled by the functional and neurobiological facts; there aren't any free-floating phenomenal further facts beyond those.
  4. I think there's always a determinate answer to how many subjects are in the chair — never vague, never just a matter of how we find it convenient to describe things, even when we cant find out what it is.
  5. I don't see any non-arbitrary candidate for what makes a batch of experiences belong to a single subject other than their being co-conscious, had from one point of view. I've never been able to make the animalist line work.
  6. I hold these patients responsible for what the right hemisphere initiates — same agent, no discount — even though on my own account the speaking left hemisphere had no access to why it happened and will confabulate a reason if you ask.
  7. And I take first-person report to be the basic evidence about what someone is experiencing; the imaging and the lesion studies only get a grip on consciousness via it.

  Which of these genuinely pull against each other, and which only look like they do? For the real clashes, order them by how bad they are, say what would have to go in each case and what it'd cost me, and tell me whether there's one revision that cleans up more than one of them at once.
reasoning: |-
  Here's a thinking process that leads to the suggested critique:

  1.  **Analyze the Request:**
      *   **Context:** Grad seminar on consciousness, specifically before split-brain week.
      *   **Task:** Critique a one-page "where I stand" handout (7 claims).
      *   **Goal:** Identify internal tensions/contradictions (genuine clashes vs. apparent ones), rank them by severity, suggest what would have to go/cost involved, and look for a unifying revision.
      *   **Tone:** Academic, rigorous, helpful, slightly informal (matching the professor's "smartarse in the back row" vibe).

  2.  **Analyze the 7 Claims:**
      *   *Claim 1:* Split-brain data implies two simultaneous streams of experience not co-conscious. Rejects strong unity thesis.
      *   *Claim 2:* Still one subject/person, not two. Disunified mental life.
      *   *Claim 3:* Physicalism. Functional/neuro facts settle co-consciousness and subject count. No further phenomenal facts.
      *   *Claim 4:* Determinate answer to subject count. Never vague, never conventional.
      *   *Claim 5:* Co-consciousness is the *only* non-arbitrary criterion for subject unity. Animalism doesn't work.
      *   *Claim 6:* Moral responsibility holds for the whole person (one agent), even if hemispheres are unaware of each other's actions.
      *   *Claim 7:* First-person report is basic evidence. Imaging/lesions depend on it.

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *1 & 2:* Two streams vs. One subject. This is the classic split-brain puzzle. Is it coherent to have one subject with two disconnected streams? Usually, subjecthood is defined by unity of consciousness.
      *   *2 & 5:* One subject (Claim 2) vs. Co-consciousness is the *only* criterion for unity (Claim 5). If the streams aren't co-conscious (Claim 1), and co-consciousness is the only glue (Claim 5), then by Claim 5, they *shouldn't* belong to one subject. But Claim 2 says they do. **This looks like a direct contradiction.**
      *   *3 & 4:* Physicalism (Claim 3) vs. Determinate subject count (Claim 4). Physical facts can be vague (e.g., gradual commissurotomy, neuroplasticity). If physical facts settle it (3), but physical facts are vague/continuous, how can the answer be determinate (4)? This is the "vagueness" problem.
      *   *3 & 7:* Physicalism (Claim 3) vs. First-person report as *basic* evidence (Claim 7). If physical facts settle consciousness, shouldn't physical data be primary? Or does 7 just mean epistemic access? Usually, physicalists privilege the third-person ontology. Claim 7 sounds a bit Cartesian/phenomenological.
      *   *2 & 6:* One subject/agent (Claim 2) vs. Responsibility for disconnected actions (Claim 6). If the left hemisphere doesn't know why the right acted, is it fair to hold the "person" responsible? This links to the definition of agency.
      *   *5 & 6:* Co-consciousness defines subjecthood (Claim 5) vs. Responsibility tracks the biological organism/agent (Claim 6). If the right hand acts and the left doesn't know, and they aren't co-conscious, why is the *subject* responsible? Claim 6 seems to rely on an animalist or bodily criterion for agency, which Claim 5 explicitly rejects for subjecthood.

  4.  **Select and Rank the "Real Clashes":**

      *   *Clash A (The Big One):* Claim 2 vs. Claim 5.
          *   2 says: One subject despite disunity.
          *   5 says: Co-consciousness is the *only* thing that makes experiences belong to one subject.
          *   1 says: Streams are *not* co-conscious.
          *   *Result:* 1+5 implies Two Subjects. 2 says One Subject. Contradiction.
      *   *Clash B (The Metaphysical One):* Claim 3 vs. Claim 4.
          *   3 says: Physical facts settle it.
          *   4 says: It's never vague.
          *   *Problem:* Physical facts (brain connections) *are* vague/graded. If consciousness supervenes on vague physical facts, consciousness facts should be vague (or epistemically indeterminate). Claim 4 insists on metaphysical determinacy. This is the "Problem of the Many" or vagueness applied to consciousness.
      *   *Clash C (The Ethical/Agency One):* Claim 5 vs. Claim 6.
          *   5 says: Subject unity = Co-consciousness (rejects animalism).
          *   6 says: Responsibility = One Agent (implies bodily/organism unity, effectively animalist).
          *   *Problem:* Why does the criterion for *responsibility* differ from the criterion for *subjecthood*? If there are two streams of experience (1), and subjecthood tracks experience (5), why does responsibility track the organism (6)?

  5.  **Drafting the Critique (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the position (it's a standard, robust physicalist view) but highlight the friction points.
      *   *Ranking:*
          1.  **2 vs. 5 (The Definition Clash):** This is fatal. You can't define subjecthood by co-consciousness and then assert subjecthood without it.
          2.  **3 vs. 4 (The Vagueness Clash):** Physicalism usually entails vagueness if the base is vague. Insisting on determinacy risks dualism or epistemicism.
          3.  **5 vs. 6 (The Agency Clash):** Inconsistency in criteria for personhood vs. agency.
      *   *Apparent Clashes:* 3 vs. 7 (Epistemology vs. Ontology). This is manageable.
      *   *Solutions/Revisions:*
          *   To fix 2 vs. 5: Either admit two subjects (Puccetti/Dennett style) or find a deeper unity criterion (narrative, biological). But 5 rules out biological. So, drop 5 or drop 2.
          *   To fix 3 vs. 4: Accept vagueness (drop 4) or accept epistemicism (keep 4, argue we just can't know).
          *   Unifying Revision: Move towards a "Persona" or "Agency" based view rather than pure phenomenology. Or, embrace the "Two Subjects" view for consciousness but keep "One Person" for ethics (Dennett's move).

  6.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Wait, look at Claim 5 again:* "I don't see any non-arbitrary candidate... other than their being co-conscious." This is an admission of defeat, not necessarily a positive assertion of fact. But in a "Where I Stand" sheet, it functions as a premise.
      *   *Look at Claim 2:* "One person, with a disunified mental life." This distinguishes *Person* from *Subject*. Claim 5 talks about *Subject*. Claim 6 talks about *Agent/Responsibility*.
      *   *Refinement:* The tension is between Subject (Phenomenal) and Person (Ethical/Legal). Claim 2 says One Person. Claim 5 says Subject Unity = Co-consciousness. Claim 1 says No Co-consciousness. Therefore, Claim 1+5 = Two Subjects. Claim 2 = One Person. Is "Person" = "Subject"? Claim 2 says "One subject there: one person". So the professor equates them.
      *   *Okay, the contradiction holds.* If Subject = Person, and Subject Unity requires Co-consciousness (5), and there is no Co-consciousness (1), there cannot be One Subject/Person (2).
      *   *Claim 4:* "Determinate answer." This is the "Epistemicist" stance on vagueness. It's defensible but controversial given Claim 3 (Physicalism). If physical facts are vague, and consciousness supervenes, how is consciousness precise? (Sider's vagueness argument).
      *   *Claim 7:* "First-person report basic evidence." This is tricky for a physicalist. If physical facts settle it (3), why is report *basic*? Reports are behavior (physical). Maybe this is fine, but it risks privileging the phenomenology over the mechanism.

  7.  **Finalizing the Structure:**
      *   **Headline:** The "2 vs. 5" contradiction is the killer.
      *   **Secondary:** The "3 vs. 4" vagueness problem.
      *   **Tertiary:** The "5 vs. 6" agency inconsistency.
      *   **The Fix:** Suggest distinguishing *Phenomenal Subjects* from *Persons/Agents*. This saves 2, 6, and modifies 5. Or, drop 4 to save 3.
      *   **Tone Check:** Keep it collegial but sharp. "Smartarse in the back row" needs to be pre-empted.

  8.  **Drafting the Response:** (Mental Outline)
      *   Intro: Good draft, provocative (which is the point).
      *   The Fatal Tension (2 & 5): You define subjecthood by co-consciousness in 5, then deny co-consciousness in 1, but assert one subject in 2. Math doesn't math.
      *   The Metaphysical Tension (3 & 4): Physical bases are vague; you claim consciousness facts are sharp. How?
      *   The Ethical Tension (5 & 6): You reject animalism for subjects (5) but rely on it for responsibility (6).
      *   Apparent Tensions: 3 & 7 is okay (epistemic vs ontic).
      *   The "One Revision": Distinguish Phenomenal Subject vs. Normative Person.

  9.  **Review against constraints:**
      *   Order by severity.
      *   Say what goes/cost.
      *   One revision to clean up multiple.

      *(Self-Correction during drafting)*: I need to be careful with Claim 5. It says "I don't see any...". It's an expression of puzzlement. But in context, it functions as a theoretical commitment. I will treat it as a commitment for the sake of the critique.
      Also, Claim 4 ("never vague") is a very strong claim for a physicalist. I should emphasize the "Problem of the Many" aspect.

      *Unifying Revision:* If the professor adopts a **Two-Tier View** (Two Phenomenal Subjects, One Person/Agent), it resolves 1, 2, 5, and 6. It requires modifying 2 to say "One Person, Two Subjects." This is the Nagel/Dennett/Parfit middle ground.

      Let's write it.cw
answer: |-
  This is a strong, provocative handout. It's exactly the kind of thing that generates good seminar discussion. However, you are right to worry: there are genuine tensions here that a sharp grad student will exploit. Some are merely friction, but one is a flat-out contradiction given your current definitions.

  Here is the breakdown of the clashes, ordered by severity, followed by a suggested revision that cleans up the board.

  ### 1. The Fatal Contradiction: Claims 2 vs. 5 (given 1)
  **Severity:** Critical. This is the "smartarse in the back row" kill shot.

  *   **The Clash:**
      *   **Claim 1** says the streams are *not* co-conscious.
      *   **Claim 5** says co-consciousness is the *only* non-arbitrary criterion for experiences belonging to a single subject.
      *   **Claim 2** says there is *one subject*.
      *   **The Logic:** If 1 and 5 are true, there must be *two* subjects. If 2 is true, 5 must be false (there must be some other glue holding the subject together) or 1 must be false (they are co-conscious after all).
  *   **What has to go:**
      *   **Option A (Drop 2):** Admit there are two phenomenal subjects in the skull.
          *   *Cost:* You lose the intuitive "one person" verdict. You have to explain why we treat them as one person legally/morally if they are ontologically two subjects.
      *   **Option B (Drop 5):** Argue that something other than co-consciousness unifies the subject (e.g., biological continuity, narrative unity, or a further fact).
          *   *Cost:* You explicitly say you can't make the animalist line work in 5. If you pivot to biological unity, you contradict your rejection of animalism. If you pivot to a "further fact," you threaten your physicalism (Claim 3).
  *   **Why it's bad:** It makes your position look logically incoherent rather than philosophically contentious.

  ### 2. The Metaphysical Tension: Claims 3 vs. 4
  **Severity:** High. This is the "vagueness" problem.

  *   **The Clash:**
      *   **Claim 3** says subject count is settled by functional/neurobiological facts.
      *   **Claim 4** says the answer is never vague, always determinate.
      *   **The Problem:** Neurobiological facts (degree of callosal connection, neural plasticity, partial sections) *are* vague and graded. If consciousness supervenes on the physical (3), and the physical is vague, standard logic suggests the supervenient properties should be vague too. Claim 4 asserts metaphysical precision atop a vague physical base without explaining how the "cut-off" is determined.
  *   **What has to go:**
      *   **Option A (Drop 4):** Accept that subject count can be vague or indeterminate in borderline cases.
          *   *Cost:* You lose the clean ontological picture. Some students will argue this leads to absurdity (how can it be vague whether someone is in pain?).
      *   **Option B (Drop 3):** Argue that consciousness facts are precise even if physical facts are vague (Epistemicism).
          *   *Cost:* This smells of dualism or property dualism. It suggests the phenomenal facts aren't *fully* settled by the physical facts in a straightforward way, which puts pressure on Claim 3.
  *   **Why it's bad:** It invites the "Problem of the Many" argument. If you cut the corpus callosum fiber by fiber, at which exact fiber does the second subject pop into existence? Claim 4 says there is an answer; Claim 3 says the physics decides; the physics offers no such boundary.

  ### 3. The Ethical/Agency Tension: Claims 5 vs. 6
  **Severity:** Medium. This is an inconsistency in criteria.

  *   **The Clash:**
      *   **Claim 5** rejects animalism/biological criteria for *subjecthood* (insisting on co-consciousness).
      *   **Claim 6** implicitly accepts animalism/biological criteria for *responsibility* (holding the organism responsible despite disunity).
      *   **The Problem:** Why does the criterion for "who is there?" (phenomenal unity) differ from "who is to blame?" (biological unity)? If the right hemisphere acts and the left doesn't know, and they are distinct subjects (per 1 & 5), holding the "person" responsible looks like punishing Subject A for the actions of Subject B.
  *   **What has to go:**
      *   **Option A (Drop 6):** Mitigate responsibility based on disunity.
          *   *Cost:* Legally and morally untenable. We don't let split-brain patients off the hook.
      *   **Option B (Drop 5):** Allow biological criteria to unify the agent even if they don't unify the subject.
          *   *Cost:* Requires distinguishing "Subject" from "Agent." (See the revision below).
  *   **Why it's bad:** It looks like you are shifting definitions of "person" to suit the context (metaphysical vs. ethical) without acknowledging the shift.

  ### Apparent Clashes (Don't Worry About These)
  *   **3 vs. 7:** Physicalism (3) vs. First-person report as basic evidence (7). This is manageable. You can argue that while physical facts *settle* the ontology (3), first-person reports are our primary *epistemic access* (7). As long as you treat reports as physical behaviors that correlate with experience, this is consistent.
  *   **1 vs. 6:** Disunified streams (1) vs. Unified responsibility (6). This is only a clash if you assume Responsibility requires Conscious Unity. Many compatibilists argue responsibility tracks control and biology, not phenomenal unity. You can keep both if you clarify the distinction between *Subject* and *Agent*.

  ---

  ### The Unifying Revision

  You can resolve the Critical (2 vs. 5) and Ethical (5 vs. 6) clashes, and soften the Metaphysical (3 vs. 4) clash, by making one distinction: **Separate Phenomenal Subjects from Persons/Agents.**

  Currently, Claim 2 equates "Subject" and "Person" ("one subject there: one person"). If you decouple these, the contradictions dissolve.

  **Suggested Revision to Claim 2:**
  > "2. I distinguish between *phenomenal subjects* and *persons*. In split-brain cases, there may be two phenomenal subjects (streams of experience), but they constitute a single *person* and *agent* due to biological and social unity."

  **Suggested Revision to Claim 5:**
  > "5. I don't see any non-arbitrary candidate for what makes a batch of experiences belong to a single *phenomenal subject* other than co-consciousness. Biological continuity makes a single *person*, but not necessarily a single subject of experience."

  **Suggested Revision to Claim 4 (Softening):**
  > "4. I think there is a determinate answer to how many *phenomenal subjects* are in the chair, fixed by the physical facts, though our epistemic access to that boundary may be limited in graded cases."
  > *(This keeps the physicalism without committing you to the idea that the vague physical base magically produces a sharp boundary we can identify, dodging the full force of the vagueness objection.)*

  ### Why this cleans up the board:
  1.  **Solves 2 vs. 5:** You can have two subjects (per 5) but one person (per revised 2). No contradiction.
  2.  **Solves 5 vs. 6:** Responsibility tracks the *Person/Agent* (biological/social), not the *Phenomenal Subject*. So you can hold the person responsible even if the specific phenomenal subject who experienced the urge is disconnected from the one who speaks.
  3.  **Saves 3:** Physical facts settle both subject count (neural disconnection) and person count (biological organism), but they settle them differently.
  4.  **Pre-empts the Smartarse:** You have already conceded the "Two Subjects" intuition which is the standard objection to the "One Person" view. By granting it, you inoculate yourself against the charge of incoherence.

  **The Cost:** You have to admit that "Person" is a composite concept (part phenomenal, part biological, part social). Some hardline phenomenologists hate this. But for a grad seminar on split-brain cases, it is the most robust position available.
