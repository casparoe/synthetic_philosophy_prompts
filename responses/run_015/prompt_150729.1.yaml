answer: |-
  **Examination Prompt: The Ethics of Commemorative Media**

  **Time Allowed:** 75 Minutes
  **Word Limit:** 800–900 Words

  **Question:**

  In this seminar, we have distinguished between *honorific presence*, wherein a monument actively bestows civic esteem upon a subject, and *indexical presence*, wherein a street name functions primarily as a navigational and archival marker rather than a celebration. Consider the following scenario:

  A municipal government is reviewing the commemoration of Julian Thorne, a nineteenth-century benefactor who endowed the city's public hospital but whose fortune was derived partly from colonial extraction. The proposal involves two distinct actions: (1) relocating Thorne's bronze statue from the hospital's central plaza to an adjacent museum garden with an interpretive plaque detailing his source of wealth, and (2) renaming the adjacent "Thorne Avenue" to reflect a different civic value.

  Write an essay evaluating whether these two acts carry different ethical weights. Specifically, argue whether moving the statue to a museum genuinely transforms its commemorative status from honorific to archival, or merely displaces the honor. Furthermore, analyze whether renaming the avenue constitutes an erasure of history or a severing of an indexical link. Your answer must utilize the distinction between honorific and indexical presence to determine if the city is ethically obligated to treat the statue and the street name differently.

  ***

  **Model Answer**

  The ethical evaluation of commemorating Julian Thorne requires a rigorous application of the distinction between honorific and indexical presence. While both the statue and the street name serve as reminders of the past, they function differently within the civic landscape. The statue in the plaza constitutes an honorific presence; it occupies a space of civic pride, visually dominating the hospital entrance to signal esteem. Conversely, Thorne Avenue operates as an indexical presence; it is a functional tool for navigation that references history without necessarily demanding admiration. Consequently, the city is ethically justified in treating these two media differently.

  Relocating the statue to a museum garden alters but does not necessarily neutralize its honorific status. In the plaza, the statue functions as a normative claim: Thorne is a hero worthy of emulation. Moving it to a museum context shifts the frame toward historical documentation, especially with an interpretive plaque detailing the colonial extraction underlying his wealth. However, this transformation is incomplete. A museum garden remains a curated space of preservation. Unless the display explicitly contextualizes the statue as a artifact of contested memory rather than a tribute, the aesthetic power of the bronze may continue to convey esteem. Therefore, relocation is ethically permissible only if the museum setting successfully re-codes the object from a monument to be honored into a document to be studied. If the move is merely displacement—hiding the controversy without addressing the esteem—it fails ethically.

  In contrast, renaming Thorne Avenue carries a different ethical weight because it severs an indexical link rather than dismantling a shrine. A street name is not primarily a celebration; it is a coordinate. Retaining the name forces citizens to constantly navigate using a label that may imply civic endorsement of Thorne's colonial wealth. Renaming the avenue does not erase Thorne from the historical record; his contribution to the hospital remains a matter of public archive. Instead, it stops the city from actively reproducing his name as a functional part of daily civic life. The ethical imperative here is to stop the *active* normalization of a controversial figure in the functional infrastructure of the city, which differs from preserving their memory in history books.

  The asymmetry between visual honor and spatial navigation is crucial. The statue demands attention; the street name demands utility. Keeping the name while removing the statue creates a dissonance where the history is recorded (indexically) but the honor is withdrawn (removing the statue). However, given the mixed legacy—gratitude for the hospital versus accountability for colonial extraction—the city must prioritize accountability in spaces of honor. The hospital plaza is a space of care and civic value; placing a statue derived from extraction there creates a moral conflict. The street, being functional, should reflect current civic values rather than historical accidents.

  Ultimately, the two acts are not ethically equivalent. Removing the statue from the plaza is a necessary withdrawal of civic esteem to resolve the conflict between gratitude and accountability. Renaming the avenue is a refusal to maintain an indexical link that normalizes extraction. Both actions respect the historical record while correcting the civic endorsement. The city can acknowledge Thorne's role in founding the hospital through archival means without granting him the honorific presence of a plaza statue or the indexical permanence of a major avenue. The ethical goal is not to erase history, but to curate the specific type of presence we grant to controversial figures in public space.

  ***

  **Marking Scheme (Total: 20 Points)**

  **1. Distinguishing Symbolic Endorsement from Historical Documentation (4 Points)**
  *   **Criteria:** The answer must clearly define the statue as a vehicle for active civic esteem (endorsement) and the museum/archive as a space for documentation.
  *   **Failure Mode:** Conflating the two by arguing that any presence equals endorsement, or that moving to a museum automatically erases the subject's history.

  **2. Addressing the Asymmetry Between Spatial Navigation and Visual Honor (4 Points)**
  *   **Criteria:** The answer must analyze how a street name functions differently (utility/navigation) compared to a statue (visual dominance/honor).
  *   **Failure Mode:** Treating the street name and statue as ethically identical mediums of memory without addressing their functional differences.

  **3. Assessing Whether Contextualization Neutralizes or Preserves Commemorative Meaning (4 Points)**
  *   **Criteria:** The answer must critically evaluate the museum relocation, noting that it *might* transform status but risks merely displacing the honor if not properly contextualized.
  *   **Failure Mode:** Assuming the museum move is a perfect solution that neutralizes all ethical concerns without further critique.

  **4. Recognizing That Street Renaming Severs an Indexical Link Without Necessarily Denying Historical Record (4 Points)**
  *   **Criteria:** The answer must argue that renaming stops active normalization (indexical link) but does not constitute "erasure" of the historical record.
  *   **Failure Mode:** Arguing that renaming is equivalent to "erasing history" or claiming it has no ethical impact because the history remains in books.

  **5. Confronting Whether the Benefactor's Mixed Legacy Creates a Conflict Between Gratitude and Accountability (4 Points)**
  *   **Criteria:** The answer must engage with the specific tension of the scenario (hospital endowment vs. colonial extraction) to justify the withdrawal of honor.
  *   **Failure Mode:** Ignoring the colonial source of wealth or the benefit to the hospital, relying instead on generic slogans about "cancel culture" or "preserving heritage."

  Verdict: The marking scheme is designed to reward the recognition that civic esteem requires active endorsement, whereas historical record persists through archival reference.
