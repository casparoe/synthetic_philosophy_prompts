  # Handout: The Critical-Level Trap

  **The View:** Critical-Level Utilitarianism (CLU).
  **The Rule:** The value of a population is the sum of everyone's welfare minus a fixed threshold **$c$**.
  **The Threshold:** We set **$c = 50$**. (Adding a person at 50 is neutral; above 50 is good; below 50 is bad).
  **The Scale:** 0 is neutral. Anything above 0 is a life worth living.

  ### The Case Chain
  We move from Outcome A1 to A4. In every step, **one person is added**, nobody is removed, and existing people suffer a small welfare loss (max 2 points).

  | Outcome | Population Welfare Scores | $N$ | Total Welfare | Avg Welfare | CLU Value <br>*(Total $- N \times 50$)* |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A1** | 40, 40, 40, 40 | 4 | 160 | 40.0 | **-40** |
  | **A2** | 39, 39, 39, 39, **50** | 5 | 206 | 41.2 | **-44** |
  | **A3** | 38, 38, 38, 38, 49, **50** | 6 | 251 | 41.8 | **-49** |
  | **A4** | 37, 37, 37, 37, 48, 49, **50** | 7 | 295 | 42.1 | **-55** |

  ### Step-by-Step Arithmetic (A1 $\to$ A2)
  *   **Change:** Existing 4 people drop by 1 point each ($-4$). One new person added at 50 ($+50$).
  *   **Total Welfare:** $160 - 4 + 50 = 206$. **(Strictly Up)**
  *   **Average Welfare:** $206 / 5 = 41.2$. **(Strictly Up from 40.0)**
  *   **CLU Value:** $206 - (5 \times 50) = 206 - 250 = -44$. **(Strictly Worse than -40)**
  *   **Constraints Check:**
      *   [x] One person added, none removed.
      *   [x] Existing welfare moved by 1 (limit is 2).
      *   [x] Total welfare increased.
      *   [x] Average welfare increased.
      *   [x] CLU verdict is "Worse".
      *   [x] Every life > 15 (lowest is 39).

  *(The arithmetic for A2$\to$A3 and A3$\to$A4 follows the exact same pattern: existing people drop by 1, new person enters at 50.)*

  ***

  ### Analysis

  **1. Which feature is actually doing the work?**
  It is not the size of the drop imposed on existing people (that can be minimal). The essential feature is that the **Average Welfare starts below the Critical Level ($c$)**.
  *General Condition:* A chain like this is possible whenever Current Average $< c$. Because the new person enters at $c$ (50), they contribute zero value to the CLU score. Therefore, the CLU verdict rests entirely on the existing people. Since they lose welfare, CLU says "Worse." However, because the new person (50) is higher than the current average (~40), they pull the Average and Total up.

  **2. What happens if everyone starts above the threshold?**
  If everyone starts above $c$, **the case cannot be built.**
  *Why:* If the Average is already above $c$ (say, 60), and you want the Average to rise, the new person must contribute enough welfare to offset any losses. Mathematically, if Average $> c$ and Average rises, the Net Welfare Gain must be greater than $c$. If Net Gain $> c$, then (Net Gain $- c$) is positive. Since CLU Value Change = Net Gain $- c$, the CLU value *must* go up. You cannot make the Average go up while making CLU go down if you are already above the critical level.

  **3. Strongest reply from a CLU defender:**
  *"This result only applies to non-ideal populations below the critical threshold. The view is designed to tell us that when society is below a decent standard of living, adding 'merely okay' people (at level $c$) is not an improvement if it comes at a cost to existing people. Once we clear the threshold, this problem vanishes."*
  *Evaluation:* This lands partially. It explains the logic consistently. However, it concedes that in the "middle range" (lives clearly worth living, but below the ideal), the view prefers fewer, slightly happier people over more, happier people. This is the "Sadistic Conclusion": the view implies we should block the addition of happy people to prevent small losses to those already here.

  **4. Closing Sentence**
  "Setting a high bar to avoid the Repugnant Conclusion forces you to conclude that adding happy people can make the world worse, simply because the average hasn't cleared your threshold yet."
