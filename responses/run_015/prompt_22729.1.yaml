      "that specie outflows can't be offset by credit expansion": "If banking credit expands to replace lost specie, the effective money supply does not contract and the deflationary trigger never occurs.",
      "that domestic prices actually adjust downward in the deficit country": "Downward price rigidity prevents the real exchange rate from adjusting even if the money supply successfully contracts.",
      "that non-monetary (industrial) demand for gold stays roughly constant": "Variations in industrial demand introduce noise to the money supply but do not structurally break the price-adjustment mechanism.",
      "that trade, rather than capital flows, is the main channel moving specie": "The mechanism forces trade to equilibrate with specie flows regardless of whether trade deficits or capital movements initiated the flow."
    }
  }
