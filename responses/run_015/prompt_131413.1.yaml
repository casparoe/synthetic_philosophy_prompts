          *   Hypothesis: Does mental labor only count in specific forms? Is it about social utility vs. labor?
      *   **Goal:** Unpack the philosophical commitments baked into these legal/policy frameworks, explain the inconsistencies (or consistencies), and validate their intuition without overwhelming them with jargon.

  2.  **Deconstruct the Legal/Philosophical Landscape:**
      *   **Copyright:** Protects *expression*, not *ideas*. Rooted in Lockean labor theory (you own what you make) but limited by the Idea/Expression Dichotomy. Independent creation is a valid defense because copyright isn't a monopoly on truth, it's a protection of specific labor.
      *   **Patents:** Protect *ideas/functions/methods*. Rooted in Utilitarianism (social contract: disclose to get monopoly). Independent creation is *not* a defense. First-to-file (mostly).
      *   **Trade Secrets:** Protect *information* as long as it's secret.
      *   **The Hackathon Policy:** This is a hybrid. It's asking for citation (academic norm) based on origin (legal norm of independent creation). It's trying to balance integrity with legal risk.
      *   **Variable Names vs. Logic:** Variable names are pure expression (copyright). Logic is often functional (patent/trade secret) or unprotectable idea (copyright).

  3.  **Identify the Philosophical Frameworks:**
      *   **Lockean Labor Theory:** You mix your labor with the commons, you own the result. Fits Copyright well (the code you typed).
      *   **Utilitarianism/Consequentialism:** IP exists to promote progress. Fits Patents best (incentivize disclosure).
