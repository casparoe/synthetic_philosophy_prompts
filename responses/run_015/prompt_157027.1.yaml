answer: |-
  The envelope in Ellie's pocket felt heavy enough to drag her shoulder down. Inside was the deposit for the flat in Manchester, the first step out of the valley. Behind her, the bar was full. Not just drinkers, but the whole town, shoulder to shoulder, hanging the greens for the Midwinter. It wasn't a service they were waiting for; it was the finishing of the room itself. If the heating didn't kick in before the frost set, the pipes would burst, the tradition would break, and the thing they were all building together would collapse into a cold dark shell.

  The engineer held out his hand for the parts fee, eyes on the boiler. Ellie looked at the envelope, then at the chain of people passing holly down the line. None of them owned the night alone. She handed over the envelope. The engineer nodded, lit the torch. The rumble started deep in the walls. Warmth began to bleed into the woodwork. Ellie stayed behind the bar, watching them finish the hanging, her coat still on, the bus ticket burning a hole in a pocket that was now empty.

  ***

  **The Aggregating View**
  Classical utilitarianism sees this as a straightforward calculation. Ellie loses a life-changing opportunity (high negative utility). The town gains a successful tradition and avoided property damage (low positive utility per person). However, because the number of beneficiaries is large, the sum total of their gain outweighs Ellie's loss. The action is right because it maximizes overall welfare.

  **The Separateness of Persons Objection**
  Rawls and Nozick argue that society is not a single super-person. You cannot sacrifice one distinct individual's life plan merely to add up small gains across others. Ellie is a separate moral unit; her rights and projects cannot be overridden just because the aggregate math works out. To do so treats her as a means to the community's ends.

  **The Feature Stopping the Objection**
  The feature doing the work is **Constitutive Participation** (your "Pooling" distinction). In this scene, the townspeople are not separate consumers receiving a service; they are co-authors of a shared practice (the Midwinter preparation) that defines the community's identity. Ellie isn't sacrificing *for* them as strangers; she is sustaining the *medium* in which they all exist together. The value isn't the sum of their comforts, but the continuation of the joint activity itself. Because she is a participant in that practice, her contribution is seen as sustaining a shared world rather than being harvested for separate others.

  **Removing the Feature**
  If you remove the "shared practice" element—for example, if the town were just strangers drinking on a normal Tuesday and the heating broke—the case collapses into plain sacrifice. If Ellie pays for their comfort solely so they can have a nicer evening with no shared ritual or joint project at stake, she is merely instrumentalizing her future for their aggregate convenience. The "Pooling" becomes "Summing," and the separateness objection bites hard: she is being used.

  **The Critique**
  A critic defending the separateness objection would argue you have smuggled in **social coercion**. They would say the "shared practice" is a guise for obligation; by embedding her in the community's identity, you've made her individuality porous. They would claim the scene relies on the reader accepting that community membership implies a duty to sacrifice, which violates the liberal premise that individuals are sovereign over their own life plans regardless of the "projects" they inhabit. They'd say you've romanticized the burden to hide the violation.
