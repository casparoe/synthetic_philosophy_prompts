      *   *Hidden Empirical Claims?* Side A assumes influence *can* happen implicitly. Side B assumes refusal causes *certain* failure. Both are probabilistic claims treated as certainties.
      *   *Standards of Evidence?* Side A wants documented quid pro quo (or risk models). Side B wants ethnographic success/failure (relationship viability).
