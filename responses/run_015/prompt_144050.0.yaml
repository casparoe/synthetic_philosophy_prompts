      *   *Goal:* Identify three distinct ways a debate about corruption can remain stalled even when all parties share the same empirical observations and reject suffering.
      *   *Idea 1: Ontological Mismatch.* One side sees the act as a *thing* (a bribe), the other sees it as a *relation* (bonding). If the nature of the object is disputed, empirical facts about the object don't resolve it.
      *   *Idea 2: Temporal Horizon.* One side looks at immediate transaction integrity (did this specific contract change?), the other looks at long-term systemic viability (can we operate here at all?). Different timeframes make "evidence" look different.
      *   *Idea 3: Locus of Harm.* One side locates harm in the *outcome* (wrong vendor wins), the other locates harm in the *exclusion* (no vendor can work). If harm is defined differently, "preventing suffering" means opposite actions.

  3.  **Deconstruct the Scenario:**
      *   **Facts Agreed Upon:** Costs, no contract clause, officials' influence, unfair advantage is bad.
      *   **Side A (Western Compliance/Interventionists):** Principal-agent model. Hidden obligation = risk. Allocative corruption (distorted resource). External point of view (fiduciary duty). Universal normative authority.
      *   **Side B (Local Partners/Non-interventionists):** Constitutive reciprocity. Ritual = precondition for trust. Refusal destroys social fabric. Internal point of view (practice coherence). Alien normative framework imposition.
