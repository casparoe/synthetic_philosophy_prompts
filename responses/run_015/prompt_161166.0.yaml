answer: |-
  # WHERE IS EVERYBODY?
  ### A Decision Tree for the Fermi Paradox

  **Start Here:** We agree on two facts.
  1.  **The Galaxy is Old:** There are billions of stars older than the Sun, with plenty of time for life to arise.
  2.  **The Sky is Silent:** We have detected no signal or artifact we can confidently attribute to another technological civilization.

  ***

  ### THE TREE

  **1. THE WEIGHT OF SILENCE**
  Given the size of the sky and the radio spectrum, have we searched enough to trust the silence?
  *   **NO:** We haven't looked hard enough yet. → **Leaf 1: The Shallow Search**
  *   **YES:** The silence is real. → *Go to Question 2.*

  **2. EARTH'S TYPICALITY**
  Are we entitled to generalize from Earth, or is our planet a rare exception for hosting life?
  *   **EARTH IS RARE:** Conditions for life are unique to us. → **Leaf 2: Rare Earth Hypothesis**
  *   **EARTH IS TYPICAL:** Life should start easily elsewhere. → *Go to Question 3.*

  **3. THE BIOLOGICAL FILTER**
  Once life exists, does it reliably evolve intelligence and technology?
  *   **NO:** Simple life is common; technological life is the bottleneck. → **Leaf 3: The Biological Filter**
  *   **YES:** Intelligence is a common evolutionary outcome. → *Go to Question 4.*

  **4. THE SURVIVAL FILTER**
  Do technological civilizations typically last for millions of years?
  *   **NO:** They destroy themselves or collapse quickly. → **Leaf 4: The Societal Filter (Great Filter)**
  *   **YES:** Long-lived civilizations are common. → *Go to Question 5.*

  **5. TIMING & SYNCHRONIZATION**
  Did other civilizations rise and fall long before we existed, rather than existing now?
  *   **YES, WE ARE LATE:** They died out before we evolved. → **Leaf 5: The Antiquity Hypothesis**
  *   **YES, WE ARE FIRST:** We are among the first to emerge. → **Leaf 6: The Early Bird Hypothesis**
  *   **NO, WE OVERLAP:** They are active right now. → *Go to Question 6.*

  **6. RECOGNITION & INTENT**
  If a civilization were active nearby, would we recognize their signal, and do they want to be found?
  *   **SIGNAL MISMATCH:** They use physics or spectra we don't monitor. → **Leaf 7: The Spectrum Mismatch**
  *   **COGNITIVE BIAS:** They signal, but it looks like natural noise to us. → **Leaf 8: The Perceptual Bias**
  *   **INTENTIONAL SILENCE:** They see us but choose not to contact. → **Leaf 9: The Zoo Hypothesis**
  *   **BROADCASTING:** They are signaling and want to be found. → **Leaf 10: The Hard Paradox**

  ***

  ### THE LEAVES

  1.  **The Shallow Search:** Common view; argues our current instruments are insufficient.
  2.  **Rare Earth Hypothesis:** Common view; argues complex life requires an unlikely chain of events.
  3.  **The Biological Filter:** Common view; argues intelligence is not an evolutionary imperative.
  4.  **The Societal Filter:** Common view; argues technology leads to inevitable self-destruction.
  5.  **The Antiquity Hypothesis:** Common view; argues the galaxy was populated in the past, but is quiet now.
  6.  **The Early Bird Hypothesis:** Common view; argues we are simply the first generation of star-farers.
  7.  **The Spectrum Mismatch:** Common view; argues we are listening on the wrong frequencies.
  8.  **The Perceptual Bias:** Common view; argues their technology is indistinguishable from nature to us.
  9.  **The Zoo Hypothesis:** Common view; argues advanced civilizations deliberately avoid contact.
  10. **The Hard Paradox:** **UNOCCUPIED.** This combination is **incoherent**; it asserts civilizations are common, detectable, and broadcasting, which contradicts the starting premise of silence.

  ***

  ### INDISTINGUISHABLE OUTCOMES

  **The Zoo Hypothesis (Leaf 9)** and **The Perceptual Bias (Leaf 8)** cannot be separated by current observations because both predict exactly the same thing: **total silence.**

  *   **How to tell them apart:** We would need to detect a signal and successfully decode it. If we decode a message saying "Leave them alone," it is the Zoo. If we decode a message that was always there but looked like noise, it is Perceptual Bias. Until then, they are observationally identical.
