answer: |-
  The light in the Siena gallery was failing, the way it always did at four o'clock in winter, turning the dust motes into suspended gold. Elena stood before *The Ferryman's Lantern*. It hung between two undisputed Bassani nocturnes, *The Vigil* and *Study of a Hand*. To the eye, it belonged. The chiaroscuro was heavy, bruised; the lantern glow possessed that specific oily luminescence Bassani achieved by mixing lead white with bitumen. It was beautiful. It was also impossible.

  She turned to Marco, who was checking his watch. He represented the consortium that owned the image rights and the physical canvas.

  "The humidity sensors are calibrated," Marco said. "But the insurers are asking about restoration protocols. If the paint flakes, do we consult the model?"

  "If the paint flakes, it's gone," Elena said. "The model doesn't know how your specific polymer binder ages. It only knows how Bassani's oil aged."

  "So we list it as non-restorable?"

  "We list it as unique."

  Marco sighed, stepping closer to the canvas. He didn't look at the brushwork; he looked at the valuation tag in his mind. "The letter changes the narrative, Elena. But not the quality. You said yourself yesterday it's the best Bassani in the room."

  "It's the best *image* of a Bassani in the room."

  "Semantics."

  "No. Physics." Elena pointed to the corner of the frame, where the canvas edge was visible. "This weave is modern. The ground layer is synthetic. Bassani painted this once, three hundred and fifty years ago, and he hated it. He took a knife to it. He destroyed the object. This thing here..." She gestured to the glowing lantern held at shoulder height. "This is a ghost wearing a new body."

  The letter had arrived a week after the opening. A private collection in Lyon, digitizing their archives. Bassani's handwriting was spidery, desperate. *I attempted the Ferryman,* he had written to a patron in 1697. *The light was false. The soul of the night resisted me. I scraped it down to the weave rather than let it leave the studio a lie.*

  Now the consortium wanted to sell it. They had coined a term for the catalogue: *Realized*. Not attributed, not copied, not forged. *Realized by Generative Studio X after Girolamo Bassani.*

  "The client wants you to sign the essay," Marco said. "Your name gives it ontological cover. If you say it's authentic in experience, the market accepts it."

  "I can't say it's authentic."

  "You can say it fulfills the artist's intent."

  "He said explicitly that it didn't."

  "He said the *first one* didn't," Marco corrected. "This one corrects the errors he feared. The model analyzed the twenty surviving canvases. It know what he meant to do better than he did in that winter of despair. Isn't that the goal of conservation? To restore the vision?"

  "Conservation preserves the scar. This erases it."

  Elena walked back to the painting. The ferryman's face was obscured by shadow, just like the saints in the other canvases. It moved her. She couldn't deny that. When she stood before it, her pulse slowed. The aesthetic experience was identical to standing before a genuine Old Master. If value resided in the viewer's reaction, this was a masterpiece. If value resided in the history of the object, it was a prop.

  "The framing," she said. "You're using the seventeenth-century gilt from the storage room."

  "It fits the period."

  "It lies. It should be bare wood. Or aluminum. It needs to show it's from now."

  "The buyer won't hang aluminum next to a Guercino," Marco said. "They want the illusion of continuity. That's what they're paying for. Twenty million. Maybe thirty, if you sign."

  Elena looked at the guest book on the pedestal nearby. Hundreds of signatures. People weeping in front of a machine's dream. Nothing had been lost, arguably. The beauty was here. The grief Bassani felt was irrelevant to the glow of the lantern. And yet, the violation sat in her stomach like cold stone. He had killed this child. They were resurrecting it to sell the organs.

  "The catalogue text," Elena said. "Section four. You have 'Provenance: Girolamo Bassani, circa 1697.'"

  "It was conceived then."

  "Provenance is the history of the object. This object was created in 2039."

  Marco shrugged. "Conceptual provenance. It's standard now for digital assets."

  "This is oil on canvas."

  "It's data made physical."

  Elena took the pen Marco offered. The draft lay on the viewing table, the paper thick and creamy. The heading read: *The Ferryman's Lantern (Realized).*

  She looked at the word *Realized*. It implied a potentiality fulfilled. But Bassani's potentiality included the right to fail. The right to destroy. By fixing the error, the studio had stolen his failure. They had sanitized his disgust.

  "If I sign," Elena said, "the text changes."

  "As long as the attribution stands."

  "I'm not changing the attribution. I'm changing the condition report."

  She began to write. Her handwriting was small, tight. She crossed out *Provenance: Girolamo Bassani*. She wrote: *Origin: Generative Model 4, trained on corpus of Girolamo Bassani. Subject: Destroyed work described in letter, Lyon Archive.*

  Marco leaned over her shoulder. "That'll knock the price down. 'Destroyed work' sounds like damage."

  "It sounds like truth."

  "Truth doesn't sell at auction. Scarcity sells. Mystery sells."

  "There is no mystery. We know exactly how this was made."

  "Then why does it feel like magic?" Marco tapped the glass of the frame. "You feel it. I feel it. The buyer will feel it. Why does the chemistry of the canvas matter more than the shock of recognition?"

  "Because the shock is based on a lie."

  "Is it? Or is the lie only that we know how it was made? If we hadn't found the letter, we'd assume it was a lost original. The value was always based on ignorance."

  Elena stopped writing. The gallery was silent now, the guards locking the gates. The lantern in the painting seemed to pulse in the dimming light. It was so perfect. It was so dead.

  She thought about the buyers. They would hang this in a penthouse in Shanghai or a vault in Geneva. They would own the beauty without the history. They would own the light without the night.

  "If I sign," Elena said, "I want the framing changed."

  Marco hesitated. "The gilt?"

  " Bare wood. Unstained. And the label on the wall must say '2039' in the same font as '1697'."

  "That's... unconventional."

  "It's the only way I can sign."

  Marco looked at the painting, then at Elena. He calculated the loss in prestige against the gain in legitimacy. A controversial piece sells better than a boring one.

  "Fine," he said. "Wood. Double dating."

  Elena looked down at the paper. She signed her name at the bottom of the catalogue entry. The ink dried quickly. She had validated the sale. She had given the machine-made ghost a passport.

  "Thank you," Marco said, folding the paper. "You did the right thing. People need to see this."

  "I don't know what I did," Elena said.

  She walked back to the painting one last time before the guards ushered her out. The ferryman waited in the dark, his lantern held high. It was a lie that told the truth. It was a resurrection that denied the death. She looked at the brushstrokes, perfect and soulless, and felt a surge of love for the work and a surge of shame for the world that made it possible. She turned off her flashlight. The lantern in the painting went out, leaving her in the dark with the real Bassanis, who were finally, quietly, allowed to be ruined.
