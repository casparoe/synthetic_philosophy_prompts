answer: |-
  Your framework is largely coherent but suffers a critical contradiction between your hypocrisy rule and the victim exception, which appears to be an ad hoc privilege unless you distinguish between types of standing.

  Regarding your specific queries, (1) and (2) do not smuggle in a rival theory but rather combine a relational account of standing's source with a moralised account of its defeaters, which is a standard hybrid approach provided you clarify that (1) establishes prima facie standing whilst (2) provides conditions for loss. However, (3) does look like an ad hoc exception to (2)'s equality filter unless you ground it in the distinct normative force of rights-violations versus general moral authority; without that grounding, it simply asserts victims are special without explaining why the equality filter bends for them. Finally, (5) conflicts with (1) only if 'affected individuals' in collective harms are not considered 'victims' in the relational sense, creating a definitional slippage where stakeholders might claim standing reserved for direct victims.

  **Ranked Tensions and Revisions**

  1.  **(2) vs (3) [Severity: High]**
      *   **Tension:** Your equality filter suggests hypocrisy undermines the authority to blame, yet you grant victims immunity from this filter even when hypocritical, creating an asymmetry that lacks a stated mechanism.
      *   **Cheapest Revision:** Explicitly bifurcate standing into 'relational claim-right' (victims) and 'moral authority' (non-victims), stipulating the hypocrisy filter only applies to the latter.
      *   **Cost:** You lose theoretical unity; blame becomes two different phenomena depending on who is speaking, which complicates your account of moral address.

  2.  **(1) vs (5) [Severity: Medium]**
      *   **Tension:** Restricting standing to victims in (1) clashes with allowing any 'affected' party to blame institutions in (5), risking an expansion of standing to mere stakeholders.
      *   **Cheapest Revision:** Stipulate in (5) that 'affected' entails suffering a rights-violation or distinct harm comparable to direct victimhood, rather than diffuse contribution.
      *   **Cost:** This narrows the scope of permissible collective blame, potentially excluding legitimate grievances from those marginally harmed by institutional negligence.

  3.  **(1) vs (2) [Severity: Low]**
      *   **Tension:** There is a risk that the equality filter in (2) undermines the relational basis in (1) if standing is derived solely from the relationship rather than the blamer's conduct.
      *   **Cheapest Revision:** Clarify that (1) defines the *source* of standing whilst (2) defines a *defeater*, ensuring they operate at different logical stages.
      *   **Cost:** Minimal conceptual cost; this is largely a terminological clarification that strengthens the presentation without altering the substantive claims.
