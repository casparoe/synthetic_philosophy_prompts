  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *The Paradox:* This is the classic Surprise Examination Paradox (SEP) / Unexpected Hanging Paradox.
      *   *Scheme A:* Embraces the paradox's conditions. It makes validity *dependent* on the failure of the backward induction. It treats "surprise" as a necessary condition for validity.
      *   *Scheme B:* Rejects the epistemic weight of "surprise." It treats "unannounced" as a procedural constraint (no official notice) rather than an epistemic state (impossibility of deduction).
      *   *Epistemology:* Needs to distinguish between *justified true belief*, *knowledge as safety*, *closure principles*, and *credence/probability*.
      *   *Institutional Logic:* Scheme A is about *integrity* (catching cheating requires genuine surprise). Scheme B is about *performance* (quality requires constant readiness, surprise is secondary to the fact of observation).

  3.  **Drafting Responses to Specific Questions:**

