          *   *Scheme B (Classroom Observation):* Goes ahead *even if* deduced. Goal is constant preparation. "Unannounced" means not officially told, not necessarily epistemically surprising.
      *   **The Paradox:** The prompt explicitly outlines the backward-induction argument (last day elimination -> first day elimination -> no valid check -> surprise check occurs).
      *   **Tasks:**
          1.  Analyze Scheme A's presuppositions about surprise/knowledge. Locate the failure of the student argument (implicitly). Does it need a diagnosis to work? Does it presuppose validity is possible?
