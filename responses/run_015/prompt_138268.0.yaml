      *   *2. Knowledge Clause:* Needs anti-luck (Gettier). "Could have known" = epistemic accessibility. Closure is tricky; if closed, the paradox is harder to escape. The office likely operationalizes "knowledge" as "documented collusion" to avoid metaphysical headaches.
