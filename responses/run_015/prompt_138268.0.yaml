          *   *Closure:* If knowledge is closed under known implication, the paradox holds tighter. If the rule presupposes closure, the students' argument looks stronger. If the rule denies closure (skeptical context), the argument weakens.
          *   *Verification:* How does the office verify knowledge? This is the practical bottleneck. They likely rely on *evidence of coordination* (spreadsheets) rather than internal epistemic states.

      *   **Q3: Scheme B's Presuppositions.**
