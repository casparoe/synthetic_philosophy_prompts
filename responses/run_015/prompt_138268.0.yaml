          3.  Analyze Scheme B. Presuppositions (thinner?). Is "unannounced" epistemic or procedural? Which is a true "surprise" scheme?
          4.  Consistency between A and B. Can one institution run both? Distinguish strict presuppositions from compatible fits. Identify underdetermination.
