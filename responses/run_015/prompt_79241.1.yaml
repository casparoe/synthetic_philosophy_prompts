answer: |-
  **Project Title:** The Degradation Function of Compliance: Distinguishing Stock Depletion from Expectational Collapse in Collective Action

  **1. The Research Question**
  Standard collective action theory treats the "commons" as a subtractable stock (fish, bandwidth, pasture) degraded by *volume* of use. My project asks: **Is there a distinct class of collective action problems where the "resource" is a shared expectation of compliance, degraded not by volume of use, but by the *visibility* of non-compliance?**

  If this distinction holds, the "good" is non-rival in consumption but fragile in maintenance. The failure mode is not gradual depletion but threshold collapse (tipping), and the optimal intervention shifts from pricing/quota (managing scarcity) to monitoring/signal-management (managing visibility). The project will determine whether this is a structurally distinct category of social dilemma or merely a standard repeated-game problem described in non-standard language.

  **2. Why Existing Frameworks Leave This Open**
  Current literature bifurcates in a way that obscures this specific mechanism.

  *   **Resource Economics (Hardin/Ostrom):** Focuses on *rivalry* and *subtractability*. The degradation function is linear or logistic relative to extraction. This framework cannot easily model a resource that is undiminished by use but destroyed by *observed defection*.
  *   **Social Norms & Game Theory (Schelling/Bicchieri):** Focuses on *equilibria* and *conditional cooperation*. While this captures the "tipping" dynamic, it treats the norm as a constraint on behavior, not as the *good itself* being produced or consumed.

  The gap is in the **production/degradation function of the good**. In a fishery, the good exists independently of the fishers' beliefs. In a queue or a shopping cart return system, the good *is* the belief. Existing models either assume the resource is physical (ignoring the expectation) or assume the expectation is a rule (ignoring the resource-like fragility). This project treats "compliance" as the asset and asks if its depreciation curve differs fundamentally from physical capital.

  **3. Methodology: Structured Case Comparison**
  **Choice:** I propose a **structured comparative taxonomy** rather than formal modeling or pure conceptual philosophy.

  **Defense:**
  *   **Why not Formal Modeling:** Six months half-time is insufficient to derive a novel equilibrium model that improves on existing repeated-game or global games literature. There is a high risk of spending the fellowship deriving math that merely recapitulates known threshold models without proving the *conceptual* distinction.
  *   **Why not Pure Conceptual:** Without empirical anchoring, the distinction risks remaining metaphorical.
  *   **Why Case Comparison:** This method allows me to test the "degradation function" hypothesis against real-world constraints. I will select three pairs of cases (e.g., *Groundwater vs. Bus Queues*; *Fisheries vs. Wiki Vandalism*; *Carbon Emissions vs. Shopping Cart Returns*). For each pair, I will map: (1) the trigger for collapse, (2) the role of observability, and (3) the failure of standard price/quota interventions.

  This method is feasible for ~10 hours/week over 6 months and yields a clear, testable framework.

  **4. Deliverables**
  At the end of six months, I will deliver:
  1.  **A Working Paper (approx. 8,000 words):** Titled "Stock vs. Signal: A Typology of Collective Action Degradation." This will outline the distinction, present the case comparisons, and argue for the intervention implications.
  2.  **A Diagnostic Framework (1-page tool):** A checklist for policymakers to determine if a collective action problem is "Stock-Limited" (requires quotas/prices) or "Expectation-Limited" (requires visibility/signal management).

  **5. Success and Failure Conditions**
  *   **Success:** The case comparisons reveal at least one instance where a price/quota intervention is theoretically doomed because the bottleneck is visibility, not scarcity, *and* existing game-theoretic models require significant modification to capture this without awkward contortions. The "Diagnostic Framework" successfully distinguishes between the two types in a pilot test.
  *   **Failure (The "Redescription" Risk):** The analysis shows that every "Expectation-Limited" case can be accurately modeled as a standard Prisoner's Dilemma or Stag Hunt with imperfect monitoring parameters. If the "distinct failure mode" collapses into "standard game with high noise," the project fails to find a new category.
  *   **Failure (The "Triviality" Risk):** The distinction turns out to be obvious to practitioners (e.g., "it's just a norm") and offers no new leverage for intervention beyond "enforce the norm."

  **6. Straight Answer: Are You Kidding Yourself?**
  **No, you are not kidding yourself, but you are risking a label swap.**

  The phenomenon you describe (norm collapse via visible defection) is real and distinct from stock depletion in terms of *dynamics*. However, in terms of *formal theory*, it is likely isomorphic to threshold public goods games or coordination games with imperfect information.

  **The Deliverable is Real:** You can absolutely produce the paper and the framework in six months half-time. The scope is tight enough.

  **The Intellectual Risk:** The danger is not that the work is impossible, but that you claim a theoretical novelty that economists will dismiss as "just a coordination game." To avoid this, **do not claim you have found a new game.** Claim you have identified a **misclassification error in policy design.** Policymakers treat norm-based problems as resource problems (trying to price the unpricable). Your deliverable is the tool that stops them from doing that.

  **Recommendation:** Pivot the claim slightly. Don't argue this is a *new* mathematical structure; argue it is a *neglected empirical category* that is currently being mismanaged because we are applying stock-based tools to expectation-based problems. That is a winning, feasible, 6-month project.
