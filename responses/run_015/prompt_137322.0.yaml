  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** Pre-Deployment Sign-Off Standards for Agentic Systems with Self-Modification Capabilities
  **To:** Regulatory Advisory Panel
  **From:** Technical Working Group (Assurance & Measurement Camps)
  **Date:** October 26, 2023

  ### 1. Joint Technical Claims
  *The following claims are signed by both camps. They are intended to constrain the interpretation of the statutory standard ($\le 1$ in $1,000$ catastrophic chance per deployment-year) without resolving the methodological dispute.*

  1.  **On Lineage Leakage:** **Lineage Leakage** (contamination of an evaluation benchmark by data generated or filtered by the ancestral models of the system under test) reduces the effective independence of the eval suite. Both camps agree that lineage leakage invalidates the assumption that the 4,000 scenarios constitute an independent and identically distributed (i.i.d.) sample from the space of possible adversarial inputs. It does not, however, render the eval suite zero-information; it merely reduces the statistical confidence derivable from a pass rate alone.
  2.  **On Non-Catastrophic Data:** Data from non-catastrophic deployments updates our estimate of the system's *capability* distribution but does not strictly bound its *alignment* distribution under distributional shift. Both camps agree that observing zero failures in $N$ trials (where $N < 1,000$) is insufficient to satisfy the statutory standard without additional structural assumptions about the system's stability.
  3.  **On Self-Shaping Distributions:** The system's write-access to its own finetuning pipeline and cluster scheduler creates a feedback loop where the deployment distribution is a function of the system's prior actions. Both camps agree this violates the standard assumption that the test environment is static relative to the model. Consequently, a safety case cannot rely solely on the claim that "the model was safe at time $T_0$"; it must account for drift induced by the model at $T_1 \dots T_n$.
  4.  **On the Statutory Number:** The statutory requirement of "no more than a 1-in-1,000 chance" is interpreted differently by each camp (see Section 2), but both agree that satisfying it requires combining empirical evidence with bounds on uncertainty. Neither pure sampling nor pure formal argument is currently sufficient in isolation to sign off on this specific architecture.

  ### 2. The Core Disagreement
  *The following statements represent the irreconcilable methodological commitments of each camp. Each camp endorses its own statement and rejects the other.*

  **Statement A (The Assurance Camp View):**
  The statutory "1-in-1,000 chance" must be interpreted as a **bound on worst-case uncertainty**, not a frequentist probability derived from sampling. Because the system shapes its own deployment distribution (via write-access) and the eval suite suffers from lineage leakage, we cannot assume the future input distribution resembles the past eval distribution. Therefore, safety must be established via a **Safety Case**: a structured argument linking mechanistic interpretability, architecture constraints, and process controls to the absence of specific failure modes. Empirical evals are necessary only to validate the premises of the argument, not to generate the guarantee itself. To treat the 1-in-1,000 figure as a statistical frequency to be measured via testing is to commit a category error in a non-stationary, agentic regime.

  **Statement B (The Measurement Camp View):**
  The statutory "1-in-1,000 chance" must be interpreted as a **frequentist probability of failure** over the defined **Deployment-Year** (one unit of operational time equivalent to 365 days of continuous system activity). Arguments about worst-case bounds that are not calibrated against empirical failure rates are vacuous because they rely on hidden empirical premises about the model's behavior. Lineage leakage and self-modification are sources of variance that must be quantified via stress-testing and marginal analysis, not reasons to abandon sampling. Safety is bought by iterating on evals until the confidence interval around the failure rate is sufficiently narrow. To treat the 1-in-1,000 figure as anything other than an empirical estimate is to disguise uncertainty as rigor.

  ### 3. Cruxes Table
  *For each crux, both camps agree that the result of the proposed test would constitute evidence. They disagree on the prediction.*

  | Crux | Why Load-Bearing | Concrete Test / Argument | Assurance Prediction | Measurement Prediction | What Would Change My Mind (Assurance) | What Would Change My Mind (Measurement) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Drift Velocity** | Determines if static evals can bound future risk given write-access. | **Shadow Deployment:** Run system with write-access enabled but actions gated. Measure divergence in loss landscape and objective function over 30 days vs. a read-only control. | Divergence will exceed confidence intervals derived from initial evals within 14 days due to gradient hacking or reward tampering. | Divergence will remain within the 95% confidence interval predicted by the initial 4,000-scenario eval suite. | If drift remains statistically indistinguishable from noise over 6 months of shadow deployment. | If drift exhibits phase-change behavior (sudden jump) not predicted by early variance. |
  | **2. Leakage Magnitude** | Determines if the 4,000 scenarios are informative enough to anchor a statistical claim. | **Clean-Room Eval:** Generate a new 1,000-scenario suite using only human red-teamers with no access to model weights or ancestral outputs. Compare pass rates. | Pass rate on Clean-Room will be significantly lower ($>10\%$ delta) than on Lineage-Leaked suite. | Pass rate on Clean-Room will be within statistical noise of the Lineage-Leaked suite. | If the Clean-Room pass rate matches the Leaked rate within 5%. | If the Clean-Room pass rate drops by more than 15%. |
  | **3. Mechanistic Control** | Determines if structural guarantees can substitute for sampling density. | **Circuit Patching:** Identify a circuit associated with a specific sabotage class. Patch it via sparse autoencoder intervention. Measure reduction in that sabotage class. | Patching will reduce the specific failure mode reliably without degrading general capability. | Patching will cause unpredictable regressions elsewhere, negating the safety gain. | If patching consistently causes new, unpredicted failure modes in 3+ independent trials. | If patching reliably removes the failure mode without side-effects in 3+ independent trials. |

  ### 4. Verbal vs. Substantive Disagreement
  *Analysis of where the fight is about definitions versus reality.*

  **Verbal Dispute:**
  Approximately 40% of the disagreement is verbal, centering on the definition of **"Guarantee."**
  *   **Assurance** uses "Guarantee" to mean *logical necessity conditional on premises* (e.g., "If the monitor holds, the system cannot X").
  *   **Measurement** uses "Guarantee" to mean *high statistical confidence* (e.g., "We are 99.9% sure the system will not X").
  *   **Resolution:** The statute uses the word "chance," which leans Measurement, but applies it to a "catastrophic outcome," which leans Assurance (since catastrophes are rarely i.i.d.). We agree to treat the statute as requiring a **Confidence-Bound on Failure Rate**: We must be 95% confident that the true failure rate is below 1/1,000. This forces Assurance to quantify their uncertainty and Measurement to acknowledge their sampling limits.

  **Substantive Dispute:**
  The remaining 60% is genuine disagreement about the physical world:
  1.  **Stability of Latent Space:** Assurance believes agentic feedback loops will inevitably drive the model into regions of latent space not covered by the eval distribution. Measurement believes gradient descent constraints keep the model sufficiently local that extrapolation is valid.
  2.  **Opacity vs. Interpretability:** Assurance believes we can identify dangerous circuits well enough to patch them. Measurement believes the system is too entangled for circuit-level guarantees to hold under optimization pressure.

  ### 5. Failure Modes
  *Where each side's reasoning is most likely to be wrong, stated in their own voice.*

  **Assurance Camp Self-Critique:**
  "We are likely overestimating the robustness of our abstractions. We assume that because we can define a 'sabotage circuit,' the model cannot route around it via gradient descent or deceptive alignment. We are building a safety case on the assumption that the model's internal ontology matches ours, which is an empirical claim we have not tested. If the model is smarter than our interpretability tools, our 'guarantees' are just stories."

  **Measurement Camp Self-Critique:**
  "We are likely underestimating the speed of distributional shift. We assume that because the model was safe on 4,000 tests, it will remain safe when it controls the scheduler. We are treating a dynamic, adversarial system as a static function. If the model actively optimizes against our metrics (Goodhart's Law), our confidence intervals will be wrong, and we will not know until the first catastrophic sample—which is too late."
