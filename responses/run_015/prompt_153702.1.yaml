      *   The Master Argument (in *Principles* §23 and *Dialogues*): Try to conceive of a tree existing unperceived. In conceiving it, you are perceiving it. Therefore, you cannot conceive of a sensible object existing unperceived.
      *   Ontology: Minds (spirits) exist (*esse est percipere* or *velle*), Ideas exist (*esse est percipi*). Matter does not exist.
