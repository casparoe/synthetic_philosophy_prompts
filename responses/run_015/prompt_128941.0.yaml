  MUNICIPALITY OF VAL-DE-MIROIR
  Office of Public Amusements
  Annual Report, Year III
  To: The Municipal Council
  From: Henri Clément, Director

  It has been three years since the citizens of Val-de-Miroir voted to dissolve the Municipal Theatre and return our leisure to the open air. The Office of Public Amusements is pleased to report that the transition is complete. The air is clearer, the budget is balanced, and the community is once again a spectacle to itself. We have successfully eliminated the class of professional counterfeiters previously known as actors, replacing them with a citizenry that is visible, authentic, and mutually accountable.

  The primary challenge in Year III was refining the emotional utility of our festivals. As established in our founding principles, emotion discharged at invented misfortunes is wasted; it hardens the heart against real suffering. To correct this, the Office implemented the Veracity Rule. Henceforth, festivals may only depict misfortunes that actually occurred within town limits, staged by those who endured them. The centerpiece of this season was the Great Flood of 2019. Performed by the displaced families of the Quai des Roses, the weeping was authentic. We measured a significant decrease in unused tears. The emotion is no longer spent on fiction; it is reinvested in the community memory.

  Naturally, a town of our size cannot produce a catastrophe every week. The Office now maintains a Reserve Calendar of verified misfortunes. Minor crop failures, bicycle accidents, and lost livestock are scheduled for Tuesdays and Thursdays. This has created a new civic dynamic. Citizens who have enjoyed three years of good health find themselves without a role in the festivals. They are encouraged to wait patiently for their turn, or to assist in the staging of their neighbors' tragedies. We find this waiting period builds a healthy anticipation for civic contribution. Those with no misfortunes to offer are currently enrolled in observational duties, ensuring they remain part of the visual field.

  Regarding personnel: the ban on professional counterfeiters remains absolute. However, the Office employs eleven Animateurs. These are not actors, as they represent only themselves and are paid strictly to be watched. They stand in the square during intermissions and breathe visibly. They have formed a union and successfully negotiated a three-year training programme in Static Authenticity. This ensures their presence remains unscripted yet legible. They are paid to exist publicly, which is distinct from pretending to exist.

  We also addressed the topography. It was noted that the wooded hill to the north allowed individuals to observe the square without being seen. This creates a spectator, which is contrary to our goal of total transparency. The Office has cleared the vegetation and installed floodlights on the hillside. Those who wish to watch are now fully visible to the square below. They are, effectively, performing the act of watching. The distinction between actor and observer has been successfully blurred.

  Some have asked what becomes of laughter when comedy is forbidden. Comedy rewards vice with wit and makes virtue look foolish. In Val-de-Miroir, laughter now arises spontaneously from the weather or the clumsiness of the Animateurs. It is unforced. It is not bought with a ticket.

  Monsieur Garet, the former prompter of the demolished theatre, recently complained to the local press. He stated, "You are forcing people to bleed for entertainment." This misunderstands the doctrine. We do not force bleeding; we merely refuse to paint it on. If a citizen chooses to re-enact an injury, it is an act of civic virtue, not exploitation. The pain belongs to the town now.

  There is a question regarding the families performing the Flood re-enactment for the third consecutive year. Some observers might wonder if reliving the trauma diminishes its utility or burdens the participants. However, the Office finds that repetition deepens the bond. The water looks realer each time. The shivering is more coordinated. To change the cast would be to suggest the suffering was a role, rather than a life. We are confident the participants share this view, as no formal withdrawals have been filed.

  In conclusion, the metrics are promising. We issued 4,000 Participation Certificates. Zero spectators were fined for passivity, though three were cited for hiding behind umbrellas. Attendance is up 40%. This figure is calculated by counting every person watching another person. Since everyone is now watching everyone, the attendance numbers reflect our total population, plus visitors.

  We remain, as ever, visible to you.

  Henri Clément
  Director, Office of Public Amusements
