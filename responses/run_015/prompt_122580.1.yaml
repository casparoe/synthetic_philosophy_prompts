answer: |-
  Your intuition that these frameworks answer different questions is correct, but they are not mutually exclusive. Structure-Mapping Theory (SMT), associated primarily with Dedre Gentner, treats analogy as a process of aligning two fixed relational structures. It posits a systematicity principle: connected systems of relations are preferred over isolated object attributes. Failure here is misalignment or matching surface attributes instead of deep relations. Hofstadter and Sander (H&S), conversely, view categorization itself as analogical. Concepts are not fixed containers but fluid constructs that slip and merge under context pressure. For them, an analogy's success is measured by pragmatic utility and the extraction of an "essence," not by fidelity to a pre-existing structural description.

  Your worry is whether H&S can diagnose failure without fixed representations to measure against. They can, but the criterion shifts from structural fidelity to pragmatic coherence. An analogy misfires for H&S if the concept slippage leads to a dead end or prevents action, not necessarily because it violated a structural constraint.

  Let us diagnose the Carnot case. You have a source (water wheel) and a target (heat engine). The ontology of the source involves a conserved fluid substance falling due to gravity. The target involves heat flow driven by temperature difference. Historically, Carnot assumed heat was a conserved substance (caloric). Modern thermodynamics rejects this ontology but retains the structural isomorphism: potential difference drives flow which yields work.

  SMT diagnoses this as a successful structural mapping. The system prefers the relational structure (higher potential → flow → work) over the object attributes (wetness, fluid substance). The attribute mismatch (heat is not a fluid) is suppressed because the relational system is deeper and more systematic. The inference (efficiency depends on temperature difference) is derived from the aligned relations, not the attributes.

  H&S diagnoses this as concept slippage. The concept "heat" slips to accommodate the structure of "water." The essence extracted is not "substance" but "flow driven by difference." The caloric ontology was a necessary scaffold that allowed the slip to occur; once the structural essence was captured, the ontology could be discarded without losing the insight. For H&S, the representation is not fixed prior to mapping; the mapping *creates* the representation of heat as a potential-driven flow.

  Now, to your failure modes. This case instantiates **neither**.

  It is not *surface capture*. Surface capture occurs when salient perceptual features dictate the mapping, dragging irrelevant relations along. If Carnot had reasoned that heat engines must freeze at 0°C because water wheels freeze, that would be surface capture. Here, the water surface did not drag object attributes; it facilitated access to the relational structure. The vividness of the water wheel served as a retrieval cue for the structure, not a constraint on the inference.

  It is not *structural overreach*, as you defined it. You defined overreach as relations mapping cleanly but yielding consequences where nothing licenses them because the causal warrant was absent. In Carnot's case, the causal warrant (caloric conservation) *was* absent, yet the consequences *were* licensed. Why? Because the licensing condition for the efficiency formula is not the conservation of heat, but the conservation of energy and the increase of entropy, which share the same structural topology as the water wheel model at the level of potential differences. The "shape" was not merely a shape; it was an isomorphism of the physical law. The analogy did not overreach; it captured the invariant structure underlying different ontologies.

  This reveals the limit of your taxonomy: it assumes that ontological error implies inferential risk. Carnot shows that structural isomorphism can survive ontological error. The discrimination lies in whether the mapped relations are causally independent of the false attributes.

  To make this case *surface capture*, you would need to change the outcome. Suppose Carnot predicted that heat engines require lubrication because water wheels do. Here, the mapping is driven by the object attribute (fluid viscosity) rather than the relational structure (potential difference). The inference fails because the attribute does not align with the target's causal mechanics.

  To make this case *structural overreach*, suppose Carnot predicted that heat flow is always reversible because ideal water flow is reversible, and he applied this to real engines without correction. Here, the relations map cleanly (reversibility), but the causal warrant (absence of dissipation) does not hold in the target. The analogy yields confident consequences (perfect efficiency in real engines) in a region where nothing licenses them (entropy production). This would be overreach: the structure aligned, but the boundary conditions did not.

  Regarding your worry about H&S and failure: H&S does not need fixed representations to diagnose misfire. It relies on the concept's ability to stabilize. If the slippage leads to a concept that cannot be used consistently in further reasoning (e.g., heat is a fluid except when it isn't, causing contradiction in calculation), the analogy has failed pragmatically. It does not require a "true" prior representation, only a coherent posterior one.

  In the Carnot case, the posterior concept of heat flow was coherent and productive. The false ontology was shed, but the structural essence remained. Thus, the analogy was not a failure of capture or overreach, but a success of structural abstraction.

  \answer{neither}
