      *(Self-Correction during drafting)*: Make sure to emphasize the *comparison* between intact and degraded habitats. It's not just "is wild life bad?" it's "is wild life in a forest *worse* than wild life in a field/city?" Actually, the prompt asks about "habitat destruction." This implies converting wild habitat to human use (ag/urban) or just degrading it. I need to be precise: Is the counterfactual "no animals" or "different animals"? Usually, habitat destruction leads to lower carrying capacity for wild species. So the comparison is High Population (Intact) vs. Low Population (Destroyed).
