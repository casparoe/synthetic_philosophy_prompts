answer: |-
  Hey everyone, welcome. Looking around this room, I see a split that honestly keeps me up at night. Half of you build these systems, trying to make them safe. The other half study what we even mean when we say "system" or "safe." Usually, that tension is polite. Today, regarding mechanistic anomoly detection, it's the whole point.

  Here's the hook: we want to spot when a net is doing something weird by comparing runs across different models. But that only works if we can say, "This failure here is the same kind of mechanism as that failure there." And if I listen to the philosophers in the back, you're already shaking your heads. Because "same mechanism" is a minefield.

  Think about how quickly sameness fractures. First, you can have identical computation but different causal roles—one model uses a pathway to decide, another just lights it up as smoke. Second, shared architecture but totally different training history; the weights look alike, but they arrived there by different roads. Third, and this is the one that keeps me honest: functional match with no shared parts. Two models fail the same way, but the internal wiring is disjoint.

  That third fracture does the most damage. If the subnetworks don't overlap, can we really claim we found the *same* mechanism? Or did we just find the same behavior twice?

  So, here's how that shapes what I'm claiming today. I am not standing here to tell you we have identified identical causal entities across models. If I said that, I'd be lying to the engineers about the robustness, and insulting the philosophers about the ontology. Instead, what we are tracking are *invariant failure signatures*. We are looking for patterns that survive the fracture. We aren't catching "the same thing" in a metaphysical sense; we are catching reliable correlations that hold even when the underlying mechanism shifts shape.

  This means our confidence comes from stability, not identity. For the engineers: this means you can still flag the risk, but don't hardcode the fix based on one map. For the philosophers: this means we aren't reifying ghosts; we're tracking stable shadows.

  We're here to find what breaks consistently, even if we can't agree on why. Let's get to work.
