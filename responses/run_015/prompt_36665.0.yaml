answer: |-
  This is a classic "hard case" in commemorative justice: the point where your existing precedents intersect and contradict. You are correct that your track record underdetermines this outcome. You have established four distinct pillars of reasoning, and this new case forces you to choose which pillar is load-bearing.

  Here is an analysis of your precedents, the principles at stake in the new case, a recommendation for consistency, and a hypothetical "stress test" to clarify your committee's underlying philosophy.

  ### 1. Mapping the Precedents
  To find consistency, we must first articulate the implicit rule used in each prior decision.

  *   **Case 1 (Confederate General):** *Removed.*
      *   **Implicit Rule:** **Hostile Intent.** If the monument was erected specifically to assert dominance or oppose civil rights, it cannot stand.
      *   **Key Factor:** The *purpose of the statue itself* was the harm.
  *   **Case 2 (Founding Governor):** *Kept + Plaque.*
      *   **Implicit Rule:** **Compartmentalized Legacy.** If the honor is for a specific, separable contribution (university founding) distinct from the moral failing (slaveholding), context suffices.
      *   **Key Factor:** The *reason for the honor* is not the *reason for the harm*.
  *   **Case 3 (Arndt Street/Eugenicist):** *Renamed.*
      *   **Implicit Rule:** **No Positive Counterweight.** If the subject is remembered *primarily* for the harmful policy (sterilization), and no other civic contribution sustains the name, it must go.
      *   **Key Factor:** The *principal claim to fame* is the harm.
  *   **Case 4 (Havlicek Street/Donor):** *Kept.*
      *   **Implicit Rule:** **Specific Beneficence vs. Private Prejudice.** If the honor is for a tangible gift (land) and the racism was private/never part of the public memory, the gift stands.
      *   **Key Factor:** **Community Buy-in.** The immediate neighborhood fought to keep it.

  ### 2. Analyzing the New Case (The Mayor)
  The Mayor case is the "perfect storm" because it shares features with all four precedents.

  *   **Like the Governor/Havlicek:** He has a specific, positive civic legacy (hospitals/parks). The original dedication was not explicitly about race (unlike the Confederate General).
  *   **Like Arndt/General:** The harm was not private prejudice (like Havlicek); it was **public policy**. He was the *architect* of segregation. This makes his racism a matter of professional record, not private letters.
  *   **Unique Factor:** **Location.** The statue stands at the edge of the neighborhood his policies segregated. This creates a "territorial" element absent in the other cases.

  **The Closest Analog:**
  Logically, **Case 3 (Arndt/Eugenicist)** is the strongest analog.
  *   *Why:* Like the eugenicist doctor, the Mayor's "professional legacy" is inextricably linked to the harm. You cannot separate the "parks he built" from the "covenants he wrote" because the parks were likely amenities *for the white neighborhoods* secured by those covenants. His fame rests on being a "builder," but the blueprint he used was segregation.
  *   *Why not Havlicek?* Havlicek's racism was private. The Mayor's racism was codified law.
  *   *Why not Governor?* The Governor's slaveholding was a condition of his era and class, generally unremarked upon in his specific honor (university founding). The Mayor's covenants were an active, engineered policy of the 20th century, the effects of which are explicitly *still visible*.

  ### 3. Principles of Possible Outcomes
  If you vote different ways, here is the principle you are formally adopting for future cases:

  *   **Option A: Keep As Is.**
      *   **Principle:** **Original Intent Supremacy.** We judge the monument by what the dedicators *thought* in the 1920s, not by what we know now.
      *   **Risk:** Contradicts *Arndt* and *General*. Ignores the "dignitary harm" of the location. Suggests that if you build enough parks, you can segregate the city with impunity.
  *   **Option B: Keep with Plaque.**
      *   **Principle:** **Contextual Sufficiency.** Information cures harm. If we explain the bad parts, the statue becomes a teaching tool.
      *   **Risk:** Contradicts the *General* precedent (which was removed, not plaqued). Assumes a plaque mitigates the physical presence of a segregator in a segregated neighborhood.
  *   **Option C: Relocate to Museum.**
      *   **Principle:** **Contextual Integrity.** A figure may be historically significant but not worthy of *civic honor* in the *public square*, especially where their harm was felt.
      *   **Benefit:** Consistent with *General* (removal from public space) and *Governor* (acknowledging historical role without veneration).
  *   **Option D: Remove (Destroy/Scrap).**
      *   **Principle:** **Moral Erasure.** The subject is unworthy of any preservation.
      *   **Risk:** Inconsistent with *General* (which was museumed). Loses the artifact for historical study.

  ### 4. Recommendation: Relocate to the Museum
  **You should vote to relocate the statue to the county museum.**

  **Reasons for Consistency:**
  1.  **Distinguishes Private vs. Public Harm:** This distinguishes the Mayor from Havlicek. Havlicek kept his racism in his diary; the Mayor wrote it into the city code. When the harm is structural and professional, the "Specific Beneficence" defense (parks/hospitals) is weakened because those benefits were likely distributed unequally *by design*.
  2.  **Respects the "Affected Community" Precedent:** In *Havlicek*, you kept the name because the *neighborhood association* wanted it. Here, the *residents of the affected neighborhood* want it removed. The citywide referendum (58–42) is less relevant than the immediate community's dignity. If you prioritize the neighborhood's wish in Havlicek, you must prioritize it here.
  3.  **Preserves History (The Museum Compromise):** Like the Confederate General, the object has historical value. It tells the story of how the city was shaped. But like the General, it functions as a wound in its current location. Moving it to the museum acknowledges his role in city history (hospitals/parks) without forcing the residents of the segregated neighborhood to live in his shadow.
  4.  **Avoids the "Plaque Trap":** A plaque suggests the covenants are a "footnote" to his legacy. Relocation acknowledges that the covenants are a *central* part of his legacy that disqualifies him from prominent civic veneration.

  ### 5. The Hypothetical "Stress Test"
  You mentioned a colleague is likely running on an unarticulated rule. To smoke it out, you need a case that separates **"Universal Good"** from **"Structural Harm."**

  **Save this hypothetical for the next meeting:**

  > **The Case of the Fire Chief:**
  > A statue of a 1940s Fire Chief stands at City Hall. He is honored for modernizing the fire department and lowering response times citywide (a universal good).
  > **New Evidence:** Archives show he implemented a "risk assessment" protocol that systematically delayed dispatch to majority-Black neighborhoods, resulting in higher property loss and deaths there, explicitly to keep insurance premiums lower in white neighborhoods.
  > **Location:** The statue is at City Hall (neutral ground), not in the affected neighborhoods.
  > **Community:** The Firefighters' Union wants it kept as heritage. The families of victims want it removed.

  **Why this separates the rules:**
  *   **If they vote KEEP (Plaque):** Their rule is **"Net Positive Utility."** (He saved more lives overall than he endangered; the good outweighs the bad). This contradicts the *Arndt* precedent.
  *   **If they vote REMOVE:** Their rule is **"Tainted Legacy."** (You cannot be a hero if your heroism relied on sacrificing a specific group). This aligns with the *Mayor* recommendation.
  *   **If they vote RELOCATE:** Their rule is **"Institutional Integrity."** (He can be remembered, but not by the institution he manipulated).

  **How to use it:**
  If your colleague argues for keeping the Mayor's statue based on "he built parks for everyone," ask them: *"Would you keep the Fire Chief who saved the city but let specific neighborhoods burn? Is 'building parks' different from 'preventing fires' if both were used to enforce segregation?"*

  This forces them to admit whether they value the **outcome** (parks saved) or the **process** (segregation enforced).

  ### Summary for the Committee
  "Colleagues, our precedent suggests that private prejudice (Havlicek) is forgivable in light of specific beneficence, but professionalized harm (Arndt/General) is not. This Mayor's segregation was not a private belief; it was his public policy. Furthermore, in Havlicek we deferred to the immediate neighborhood's wish to keep the name; here, the immediate neighborhood wishes the statue gone. Consistency demands we prioritize the dignity of the residents living with the consequences of his policy over the sentimental attachment of the city at large. Relocation to the museum honors his historical role without perpetuating the territorial claim his statue currently represents."
