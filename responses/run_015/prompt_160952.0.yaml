      *   (6) **Path-Dependence:** Permissibility of exclusion depends on past admissions. High past admission $\rightarrow$ permission to refuse current applicant (capacity/cultural absorption limits?).
      *   (7) **Historical Justice:** Colonial/extractive past $\rightarrow$ diminished right to exclude *specific* victims. Does *not* generalize to all needy migrants.

