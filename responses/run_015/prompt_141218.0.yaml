answer: |-
  **TO:** Core Curriculum Committee
  **FROM:** [Your Name], Junior Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for *Freedom and Authority* Syllabus Revision

  **Recommendation**
  I recommend that the committee adopt the third option currently on the table: we approve the inclusion of Mill's writings on India alongside *On Liberty*, but we implement this change through a two-section spring pilot organized around the "deletion test." This procedural approach resolves the substantive disagreement between the History Department and our senior theorist without requiring adjunct instructors to master nineteenth-century imperial history overnight. It treats the question not as a matter of historical context, but of textual coherence, which is teachable within our existing constraints.

  **Rationale and Constraints**
  The central dispute is whether the civilizational distinction Mill makes—that despotism is legitimate for peoples deemed unfit for self-rule—is a load-bearing premise of his liberalism or a peripheral concession to Victorian prejudice. The History Department argues it is structural; the Senior Theorist argues it is parenthetical. Because our sections are largely taught by adjuncts specializing in ethics or ancient philosophy, we cannot rely on lectures that contextualize British Imperialism with nuance. However, we can rely on adjuncts to facilitate a logical exercise.

  The deletion test requires students to remove the civilizational distinction from Mill's argument and report whether the harm principle and the case for free discussion collapse. This shifts the pedagogical burden from historical expertise to textual analysis. It respects the constraint of exactly one syllabus change (the addition of the India texts) because the test itself is a method of reading, not an additional reading assignment. It also neutralizes the "slippery slope" objection regarding Locke, Kant, or Aristotle. We are not asking students to judge the author's moral character based on biography; we are asking them to test the internal consistency of a specific argument. This avoids turning the course into an inquiry about authorial trustworthiness and keeps it focused on argumentative structure.

  **Syllabus and Writing Prompt**
  The single syllabus change is the addition of two texts: the chapter on the government of dependencies from Mill's *Representative Government* and his 1858 memorandum regarding British administration in India. To accommodate this within the writing requirement, the second paper prompt must be revised. Currently, students apply the harm principle to a contemporary case. The revised prompt will be two-part: first, students must perform the deletion test on Mill's argument using the new texts; second, they must apply the harm principle to a contemporary case, but the scope of the contemporary case should be narrowed (e.g., a specific campus speech controversy rather than broad free speech debates) to ensure the paper length remains manageable. This ensures the new material is assessed directly without overloading the writing requirement.

  **Timeline**
  *   **Spring Semester:** Pilot the revised syllabus and deletion test exercise in two sections (one taught by a History faculty member, one by a standard adjunct).
  *   **Summer:** Committee review of student papers from the pilot to assess whether the deletion test yielded coherent results and whether adjuncts reported manageable preparation loads.
  *   **Next Fall:** Final vote on making the pairing and the test permanent or reverting to the status quo based on pilot data.

  **Consideration of the Rejected Position**
  I must acknowledge the strength of the Senior Theorist's objection: that pairing *On Liberty* with imperial apologetics risks teaching first-years to read by suspicion rather than engagement. There is a genuine danger that students will conclude Mill is simply a hypocrite and dismiss the harm principle entirely, rather than grappling with its limits. If the deletion test leads students to believe that identifying a contradiction exempts them from understanding the argument, we will have undermined the course's purpose of getting them to argue about liberty at all. This risk is real, and if the pilot shows students disengaging from the normative claims of liberty because they are too focused on the historical critique, we must abandon this pairing immediately.

  **Claims Regarding Mill's Texts**
  My recommendation leans on the following specific claims about the texts. Below is my confidence level in each and what would change my mind:

  1.  **Claim:** The civilizational distinction in *On Liberty* is logically connected to the harm principle's exception for "backward" societies, not merely an aside.
      *   **Confidence:** Moderate.
      *   **Falsification:** If the pilot shows students can remove the distinction without affecting Mill's account of progress or the harm principle, the History Department's structural claim is wrong.
  2.  **Claim:** The 1858 Memorandum argues that British rule improved India through trusteeship, relying on the same fitness-for-rule criteria found in *On Liberty*.
      *   **Confidence:** High.
      *   **Falsification:** If close reading during the pilot reveals the Memorandum relies on distinct economic or strategic arguments unrelated to the philosophical claims in *On Liberty*, the texts are not comparable.
  3.  **Claim:** Adjuncts can facilitate the deletion test without prior expertise in Imperial history because the exercise relies on internal logic rather than external context.
      *   **Confidence:** Moderate-High.
      *   **Falsification:** If spring pilot instructors report that students require historical context to understand the texts enough to perform the test, the pedagogical model fails.
