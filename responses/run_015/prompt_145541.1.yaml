answer: |-
  You are absolutely right to feel uneasy about this, and you have correctly identified a major philosophical and economic concept without realizing it. The term you are looking for is **Goodhart's Law**.

  Here is the breakdown of why your intuition is correct, why your partner's argument is flawed, and how to handle the situation.

  ### 1. The Philosophical Name: Goodhart's Law
  You described it perfectly: *"measuring the wrong thing and then people chasing the measurement."*

  **Goodhart's Law** states: **"When a measure becomes a target, it ceases to be a good measure."**

  Originally formulated by economist Charles Goodhart, it applies to economics, education, and now, AI judging. The moment the competition organizers decided that "unique sensor integrations" was the metric for success, they inadvertently incentivized teams to stop building robots that *use* sensors and start building robots that *display* sensors.

  Your partner is arguing for **metric fixation**. He is treating the score as the goal, rather than the robot's capability. While technically "rational" in a narrow, game-theory sense (maximizing points with minimum effort), it is **strategically irrational** because it ignores the purpose of the system.

  ### 2. The "Optimization" Argument is Flawed
  Your partner claims optimization is the point of engineering. He is half-right. Engineering is about optimization, but you must optimize for the **true objective**, not the **proxy metric**.

  *   **True Objective:** Build a robot that can navigate and interact with the world robustly.
  *   **Proxy Metric:** AI count of sensor integrations.

  If you tape broken sensors to the frame, you are engaging in **local optimization** (gaming the specific rule) at the expense of **global optimization** (building a better robot). In the real world, if an engineer puts non-functional safety sensors on a bridge just to pass an inspection algorithm, that isn't optimization; it's fraud.

  ### 3. The Practical Risk: "Adversarial Engineering"
  You mentioned an AI judge. This introduces the concept of **adversarial examples**. Your partner wants to create an adversarial input to trick the classifier.

  However, in robotics competitions, there is almost always a human audit layer, even if an AI does the initial scoring.
  *   **Disqualification Risk:** If a human judge inspects the bot and sees sensors with no wiring, no power draw, or no data logs, you will likely be disqualified for falsification of hardware.
  *   **Reputation:** Robotics communities are small. If your team gets known for "tape engineering," it hurts your reputation for future competitions, college applications, and internships.
  *   **The "Arms Race":** As you noted, if everyone does this, the metric becomes useless. The judges will likely patch the AI or change the rules mid-season, leaving you with a bot full of dead weight and no actual navigation tech.

  ### 4. The Educational Value
  You are there to learn robotics.
  *   **Your Approach:** Integrating functional sensors teaches you about noise, calibration, sensor fusion, and feedback loops.
  *   **Partner's Approach:** Taping plastic to a frame teaches you nothing other than how to cut tape.

  If you win the qualifier using fake sensors, you will hit a wall at the next level (regionals/nationals) where the tasks are harder and the judging is stricter. You will be underprepared.

  ### 5. Verdict: Rational or Cheating?
  *   **Is it Rational?** It is *instrumentally* rational (means to an end) but *systemically* irrational (destroys the value of the competition).
  *   **Is it Cheating?** If the rules say "integrated" and imply "functional," then yes, it is cheating. Even if the written rules are vague, it violates the **Spirit of the Competition**. Engineering ethics codes (like those from IEEE or NSPE) emphasize honesty and public safety. Submitting non-functional hardware as functional is an ethical violation.

  ### Recommendation
  **Do not tape the broken sensors.**

  Here is how to argue this to your partner:
  1.  **Invoke Goodhart's Law:** Explain that once they realize teams are gaming the sensor count, they will invalidate those points. It's a wasted effort.
  2.  **Audit Risk:** Ask him, "What happens if a human judge asks to see the data stream from those temperature sensors during inspection?" If you can't show it, you lose.
  3.  **The Compromise:** If you need more sensor points, integrate *functional* sensors that might not be strictly necessary for navigation but actually work. For example, add a humidity sensor that logs data to an SD card. It counts as an integration, it's technically "real," and it doesn't risk disqualification.

  **Stick to sensors that help navigate.** You are building a robot, not a sculpture of a robot. Your instinct to prioritize function over metrics is the mark of a better engineer.
