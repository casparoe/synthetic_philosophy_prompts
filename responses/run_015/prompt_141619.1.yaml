answer: |-
  Good afternoon. It's cold enough to remind us why we're here.

  We are standing between two stones. The first was put up in 1931. It is granite, paid for by the mill hands, and it ends with a sentence I heard every year of my childhood from the woman who raised me: "AND ON THE NIGHT OF THE ICE FLOOD NOBODY WAS TURNED AWAY."

  My grandmother was not a historian. She was a woman who knew what winter meant. When she told me that story, she was not giving me data. She was giving me a location. She was telling me that in this town, there is a line you do not cross, and that line is between a neighbor in need and a closed door. For ninety years, the Relief Association has operated on the authority of that sentence. We pay for doctoring and burying without inquiry because the stone says the work was already done.

  Two years ago, a state project digitized the township records. I was the volunteer who read the minute book of the Odd Fellows' hall from March 1907. I found the vote. The hall committee voted to open the doors. The mill agent, who owned the ferry and held the treasury, overruled them. He stopped the ferry at nine. The township paid to move forty-one people from the Flats out of Marlowe Falls within the fortnight. A janitor wrote the overruled motion in the margin. He was my great-grandfather.

  The archivist has asked me to stand here and say that the first tablet is false. I will say this instead: The first tablet records a debt as if it were a receipt.

  It claims the work was finished. It was not. The event described did not happen. But the obligation described—the duty to shelter, the refusal to turn anyone away—that obligation was real then, and it is real now. The 1931 subscribers were not lying about what they owed. They were mistaken about what they had paid.

  This second tablet does not correct the record so we can feel better about knowing the truth. It corrects the record so we can stop pretending the bill was settled. If we treat the first stone as a lie, we walk away from the duty it proclaimed. If we treat it as history, we lie about the night. We are here to say that it is neither. It is a promise that was filed incorrectly.

  There are people here today whose families were turned away in 1907. They are standing in the park with us. They are not here to be spoken about. They are here because this town is where they are from, and because this town owes them an acknowledgment that does not depend on their forgiveness.

  The Selectboard asked for a line about reckoning with the past. Reckoning is not a gesture. It is an accounting. You do not balance a ledger by erasing the column on the left. You balance it by entering the sum on the right. The first tablet says everyone was saved. The second tablet says forty-one were not. Both must stand. If we take down the first, we lose the charter. If we ignore the second, we lose the truth. We must hold both, and feel the tension between them.

  That tension is where the Association lives now.

  In December, the members of the Relief Association will vote on the winter's disbursements. For ninety years, we voted based on the tradition of the 1931 stone. We acted as if we were maintaining a legacy of perfection. We cannot do that anymore. We cannot pay out on the authority of a story that excludes the people who needed it most.

  So, before the lamps are lit in the Odd Fellows' hall three weeks from now, the Association will vote to amend the charter's preamble. We will insert a clause stating that the fund exists not because our predecessors were virtuous, but because they were indebted. We will vote to open the relief rolls explicitly to the descendants of the Flats families, regardless of current residency, for a period of five years. We will not ask them to prove need beyond what is asked of any other resident. We will not ask them to call this charity. It is restitution.

  The lamps in the hall will still burn. They are lit for the dead. But this year, they will burn on the understanding that they light a room where the doors are finally open, not because they always were, but because we are holding them open now.

  My grandmother told me this was a place where nobody was turned away. She was telling me what this place must be. She was right about the duty. She was wrong about the history. We are here to make sure the duty survives the correction.

  The first stone says what we hoped we were. The second stone says what we were. The work before us is to become what the first stone claimed, without pretending the second stone doesn't exist.

  The ferry runs again. The hall is open. The ledger is open. Let us get to work.
