answer: |-
  # The Testimony Sorter: A Decision Tree for Epistemology 301

  **Instructions:** Start at **Node 1**. Answer **YES** or **NO** based on your intuition about the case described. Follow the arrow to the next Node or to a **Leaf Position**. There are 10 decision nodes.

  **The Starting Case:** A stranger on a train platform tells you, "The train leaves at 4:03." You believe them, and you are justified.

  ---

  ### The Tree

  **Node 1 (The Prejudice Case):**
  Consider a speaker who is *in fact* reliable, but hearers systematically ignore her because of her accent or social identity. Is this hearer's mistake a **distinct kind of epistemic failure**, different from simply trusting a liar?
  *   **YES** → Go to **Leaf A**.
  *   **NO** → Go to **Node 2**.

  **Node 2 (The Non-Agent Source):**
  A digital screen (no author, calibrated instrument) displays "4:03." Is your justification for believing the screen the **same kind** of justification as believing the stranger?
  *   **YES** (It's all just information) → Go to **Node 3**.
  *   **NO** (Strangers are special) → Go to **Node 6**.

  **Node 3 (The Community Storage):**
  For your belief to be justified, do the reasons for trusting the source need to be held in **your head**, or is it enough that **someone in your community** could check them if asked?
  *   **Community is enough** → Go to **Leaf B**.
  *   **Must be in your head** → Go to **Node 4**.

  **Node 4 (The Scope of Backing):**
  Do you need inductive evidence (past success) to trust **this specific stranger**, or is evidence for **people in general** sufficient?
  *   **This Stranger** → Go to **Leaf C**.
  *   **People in General** → Go to **Leaf D**.

  **Node 5 (The Instrument Backing):** *(Only reached if Node 2 = YES)*
  Do you need prior evidence that **this specific screen** works, or is evidence that **screens generally** work sufficient?
  *   **This Screen** → Go to **Leaf E** (Unoccupied).
  *   **Screens Generally** → Go to **Leaf D** (Merge with Global Reductionism).
      *(Note: To ensure tree balance, if you answered YES to Node 2, answer Node 5. If Node 5 = This Screen, you land on Unoccupied Leaf E. If Screens Generally, you land on Leaf D.)*

  **Node 6 (The Default Right):**
  Before you heard the stranger speak, did you need a reason to think **they** were trustworthy, or were you **already allowed** to believe them unless something seemed off?
  *   **Needed a reason first** → Go to **Leaf F** (Unoccupied).
  *   **Already allowed (Default)** → Go to **Node 7**.

  **Node 7 (The Assurance Check):**
  When the stranger spoke, did they **give you a new reason** (like making a promise), or did they just **show you what they already thought**?
  *   **Gave a new reason** → Go to **Leaf G**.
  *   **Showed what they thought** → Go to **Node 8**.

  **Node 8 (The Long Chain):**
  If the stranger heard it from someone, who heard it from someone (5 links total), does your justification get **weaker** than if they saw it themselves?
  *   **Yes, it weakens** → Go to **Leaf H** (Unoccupied).
  *   **No, it stays stable** → Go to **Node 9**.

  **Node 9 (The Source of Norm):**
  Is our right to trust without evidence built into our **biology/instinct**, or is it a **rule of rational thinking** (like logic)?
  *   **Biology/Instinct** → Go to **Leaf I**.
  *   **Rule of Rational Thinking** → Go to **Leaf J**.

  **Node 10 (The Defeasibility Check):** *(Final tie-breaker for Leaf I/J)*
  If you find out the stranger was guessing, are you **blamed** for having believed them initially?
  *   **Yes, blamed** → Confirm **Leaf J**.
  *   **No, not blamed** → Confirm **Leaf I**.

  ---

  ### The Leaves (Positions)

  *   **Leaf A: Virtue/Credibility View (Fricker).** You treat testimonial injustice as a unique epistemic vice, not just a reliability error.
  *   **Leaf B: Communitarian View (Coady).** Justification is distributed; the community holds the reasons, not just the individual.
  *   **Leaf C: Local Reductionism.** You need specific evidence for this speaker (and this screen, if applicable).
  *   **Leaf D: Global Reductionism (Humean).** You need general evidence that people (or screens) are reliable, but not specific evidence for this instance.
  *   **Leaf E: Unoccupied (Instrument Localism).** You treat instruments like agents (Node 2=YES) but demand specific proof for each instrument. *Status: Unstable.* (If instruments are just info, why demand higher proof than for humans?)
  *   **Leaf F: Unoccupied (Local Anti-Reductionism).** You treat strangers as special agents (Node 2=NO) but demand prior reasons to trust them (Node 6=YES). *Status: Unattractive.* (Undermines the "special" status of agency.)
  *   **Leaf G: Assurance View (Moran).** Testimony is an interpersonal invitation to trust; the speech act itself creates the reason.
  *   **Leaf H: Unoccupied (Decaying Transmission).** You have a default right to trust, but it fades over long chains. *Status: Unexplored.* (Coherent, but conflicts with the idea of testimony as a basic source.)
  *   **Leaf I: Credulity View (Reid).** Trust is a natural instinct; we are hardwired to believe.
  *   **Leaf J: Acceptance View (Burge).** Trust is a rational norm; it is logically presupposed by communication.

  ---

  ### Scoring Key & Meta-Notes

  **Path Summary:**
  1.  **Fricker:** Node 1 = YES.
  2.  **Coady:** Node 1 = NO, Node 2 = YES, Node 3 = Community.
  3.  **Local Reductionism:** Node 1 = NO, Node 2 = YES, Node 3 = Head, Node 4 = This Stranger.
  4.  **Global Reductionism:** Node 1 = NO, Node 2 = YES, Node 3 = Head, Node 4 = General (OR Node 5 = Screens Generally).
  5.  **Moran:** Node 1 = NO, Node 2 = NO, Node 6 = Default, Node 7 = New Reason.
  6.  **Reid:** Node 1 = NO, Node 2 = NO, Node 6 = Default, Node 7 = Showed Thought, Node 9 = Biology.
  7.  **Burge:** Node 1 = NO, Node 2 = NO, Node 6 = Default, Node 7 = Showed Thought, Node 9 = Rational Rule.
  8.  **Unoccupied E:** Node 1 = NO, Node 2 = YES, Node 5 = This Screen.
  9.  **Unoccupied F:** Node 1 = NO, Node 2 = NO, Node 6 = Needed Reason.
  10. **Unoccupied H:** Node 1 = NO, Node 2 = NO, Node 6 = Default, Node 7 = Showed Thought, Node 8 = Weakens.

  **Collapses & Axes:**
  *   **Reid (I) vs. Burge (J):** These often collapse in practice. Node 9 and 10 attempt to pry them apart via "Instinct" vs. "Norm," but many students will find the distinction negligible. Treat them as a family.
  *   **Fricker (A):** This functions more as an axis (ethical/epistemic overlap) than a standalone theory of justification, but Node 1 forces it as a distinct starting commitment.

  **The "Most Work" Node:**
  **Node 6 (The Default Right)** does the heaviest lifting; it is the primary fault line separating the Humean tradition (justification must be earned) from the Reidian tradition (justification is presumed).
