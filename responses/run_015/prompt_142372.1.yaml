answer: |-
  This is a precise and necessary dissection. The phrase "history is written by the victors" is a shibboleth that often stops thought rather than starting it. Your taxonomy is excellent; it moves from the material to the metaphysical. Below I have ordered them from the most empirically banal to the most philosophically extreme, added a missing reading, and provided the verdicts you requested.

  ### The Taxonomy: From Platitude to Radical

  **1. The Archival Reading (Production and Preservation)**
  *   **Meaning:** Victors produce and preserve most of the surviving documents.
  *   **Verdict:** **Trivial.** It is a material fact of war that the occupying power controls the archives, the libraries, and the stonecutters.
  *   **Nuance:** This is not absolute. Losers often smuggle records out (e.g., Jewish chroniclers under Rome, or monks preserving texts during the Dissolution). However, as a general rule of thumb for state records, it is undeniable.

  **2. The Curatorial Reading (Canon and Transmission)**
  *   **Meaning:** Victors decide which accounts get copied, taught, and translated.
  *   **Verdict:** **Defensible.**
  *   **Scale and Time:** This holds strongly for **official state history** over the **short-to-medium term** (1–3 generations). It weakens over the **long term** (centuries), as later regimes often rehabilitate the vanquished to serve new political needs (e.g., the rehabilitation of Richard III or the Confederate Lost Cause). It also varies by medium; oral traditions and religious texts often survive outside state curricula.

  **3. The Linguistic Reading (Categories and Intelligibility)**
  *   **Meaning:** The very categories in which events become intelligible (liberation, treason, restoration) are theirs.
  *   **Verdict:** **Defensible.**
  *   **Scale and Time:** This is the strongest sociological reading. It holds at the scale of **political and legal discourse** indefinitely. Even when losers are heard, they often must use the victor's vocabulary to be understood (e.g., a conquered people appealing to the conqueror's own laws for justice). However, it is not total; art, poetry, and private correspondence often retain the defeated culture's internal categories.

  **4. The Epistemic Reading (Methodological Pessimism)**
  *   **Meaning:** The evidence is now too thin and too one-sided for method to recover much.
  *   **Verdict:** **Defensible (with caveats).**
  *   **Scale and Time:** This holds for **specific events of total destruction** (e.g., the burning of Carthage, the fall of the Maya codices) where the archival rupture is absolute. It does *not* hold for the general sweep of history. Archaeology, numismatics, climatology, and comparative linguistics allow historians to triangulate truth even when the written record is monolithic. The "thinness" is often a challenge to be worked, not a wall.

  **5. The Ontological Reading (Radical Relativism)**
  *   **Meaning:** There is no fact of the matter about the past apart from whichever account wins.
  *   **Verdict:** **False.** This is self-refuting. If there is no fact of the matter, then the statement "history is written by the victors" is not itself a fact, merely the account of the current victors (historians?). It collapses the distinction between propaganda and reality. If this were true, we could not identify a "victor" except by their ability to tell a story, rendering the concept of military or political victory meaningless.

  **A Missing Reading: The Factional Reading**
  *   **Meaning:** "Victors" are never monolithic; dissenting factions within the winning coalition often preserve the loser's narrative to critique their own leaders.
  *   **Verdict:** **Defensible.**
  *   **Scale and Time:** Holds in **complex polities** over the **medium term**. (e.g., Roman historians preserving Punic perspectives to critique Roman hubris; Unionists preserving Confederate diaries to understand the enemy). This reading complicates the slogan by suggesting the "victor" is a battlefield itself.

  ***

  ### Follow-Up 1: The Colleague's Exemption

  You asked which reading could do the work your colleague wanted: releasing you from any obligation to the past.

  **The Reading:** Only **Reading 5 (The Ontological Reading)** accomplishes this. If there is no fact of the matter, there is nothing to be faithful to. Fidelity becomes a category error.

  **Does it survive scrutiny?** No. As noted, it is philosophically incoherent. It conflates *access* to truth with the *existence* of truth. Just because the record is biased does not mean the events did not happen in a specific way.

  **What was she reaching for?** She was likely reaching for **Reading 3 (The Linguistic Reading)** but conflating it with Reading 5. Her argument was likely pragmatic, not philosophical: *"Since the categories we use to understand this event are already contaminated by the conquerors' bias, your novel cannot be 'more true' than the chronicle. Therefore, you are free to imagine."*
  She used a radical slogan to justify a creative necessity. She meant to say, "Don't be paralyzed by the impossibility of perfect neutrality," but she said, "Neutrality is impossible because reality is constructed." The former liberates the novelist; the latter liberates the propagandist.

  ***

  ### Follow-Up 2: The Scribe's Forgery

  This is the crux of your artistic worry. Your scribe forges a tablet to make the conquerors' chronicle look fabricated. Early readers infer that the chronicle *was* a lie.

  **1. Does the slogan license that inference?**
  **No.** None of the defensible readings of the slogan license the inference that the victor's account is *false*, only that it is *dominant*.
  *   **Reading 1 & 2** suggest the chronicle survives because of power, not veracity. It could be a true account that survives *because* they won, or a false one. The slogan explains the *survival*, not the *content*.
  *   **Reading 5** would suggest the chronicle is "true" because they won, rendering the scribe's forgery the "false" one.
  *   **The Readers' Error:** Your readers are making a binary flip. They hear "Victors write history" and interpret it as "Victors lie." The slogan actually implies "Victors define what counts as truth." The chronicle might be factually accurate in every detail and still be an instrument of oppression because it omits the suffering of the vanquished. By assuming the chronicle is a *lie*, your readers are seeking a comfortable villain (the Liar) rather than confronting the uncomfortable reality of the slogan (the Eraser).

  **2. Does the line cut against the use you have made of it?**
  **Yes, profoundly.** And this is where your intuition about repeating the problem is correct.

  If the slogan is true (in its defensible readings), the scribe's forgery **should not work**. If history is written by victors, a scribe of a captured city lacks the power to inscribe his version into the record. If his forgery *succeeds* in overturning the official chronicle, **he has become the victor.**

  By allowing the scribe to successfully plant a forgery that delegitimizes the conquerors, you have granted him the power of the victor. You have not escaped the logic of the slogan; you have merely changed the guard.

  **The Trap:**
  The slogan complains that **power dictates truth.**
  *   The Conquerors dictate truth via military victory.
  *   Your Scribe dictates truth via literary forgery.

  If the novel presents the scribe's forgery as a *triumph* that reveals the "real" truth, you are replicating the victor's logic. You are suggesting that the only way to fix a biased history is to replace it with a counter-bias that wins. You are validating the idea that history is a contest of narratives where the winner takes all, rather than a reconstruction of evidence.

  **A Path Forward:**
  To avoid repeating the thing the slogan complains of, the tragedy of the scribe must not be that he is silenced, but that **to be heard, he must become like them.**
  *   If the forgery succeeds, does it corrupt him?
  *   Do the readers of the future believe his forgery not because it is true, but because it serves *their* political needs (making him a victor in retrospect)?
  *   Does the novel acknowledge that the scribe has now robbed future generations of the chance to know the truth, just as the conquerors did?

  The slogan warns us that **monopoly is the enemy.** If your scribe replaces the conqueror's monopoly with his own (even a benevolent one), the novel replicates the crime. The most honest historical fiction does not claim to restore the lost voice perfectly; it claims to show the cost of its loss, and the danger of those who claim to have found it.

  Your scribe should not be the hero who fixes the record. He should be the tragic figure who proves that once the archive is burnt, no one—not even the victim—can write without sinning against the truth. That would honor the slogan without succumbing to its nihilism.
