  2.  **Ontology vs. Modality:** When explaining why substantivalism doesn't collapse into relationalism, emphasize the *ontology*. Relationalists say spacetime points are just derivative of relations between matter. Substantivalists say the manifold points are real entities, they just don't have primitive "thisness" (haecceity) that makes a swapped model physically distinct. You touched on this, but making that contrast sharper would seal the deal.

