answer: |-
  First off, don't worry about the typos; we all battle with trackpads from time to time. And regarding your idea about 'moral infrastructure' — it is certainly not stupid. In fact, you've practically stumbled upon a distinction that sociologists and philosophers have wrestled with for over a century. You've hit the nail on the head.

  To answer your core question: the debate has stalled because it is **both** a verbal disagreement about definitions and a substantive confusion about levels of analysis. Your group is arguing past one another because they are measuring two entirely different things using the same label ('moral').

  Here is a breakdown of why this is happening and what might actually move the discussion forward.

  ### 1. The Category Error: Individual Psychology vs. Social Systems
  You correctly identified that one side is talking about individual behaviour, whilst the other is talking about societal structures.

  *   **Group A (The Religious Argument)** is focusing on **micro-level morality**. They are looking at individual moral psychology: *Does the belief in a supernatural watcher constrain individual impulses?* The studies they cite (charity giving, lying in experiments) measure individual compliance and virtue signalling.
  *   **Group B (The Secular Argument)** is focusing on **macro-level functionality**. They are looking at social capital and institutional trust. When they point to Denmark or Sweden, they aren't necessarily claiming every individual Swede is more virtuous than every individual believer; they are claiming that a society can function cohesively without religious glue.

  The debate stalls because Group A says, "Look at this person giving money," and Group B says, "Look at this society having low crime." Neither disproves the other. You can have a society of selfish individuals who behave well because the laws are strict (secular model), and you can have a society with high inequality where individuals give to charity to salve their conscience (religious model).

  ### 2. The Verbal Disagreement: What is 'Moral'?
  There is also a definitional rift here regarding what constitutes 'goodness'.

  *   **Motive vs. Outcome:** For many religious ethicists, the *motive* matters. If you behave well because you fear divine punishment, is that truly moral? Kant would argue no; it's merely prudential. However, religious apologists often argue that the habit of virtue leads to genuine character formation.
  *   **Thick vs. Thin Trust:** This is where your 'moral infrastructure' idea shines. Religion often creates 'thick trust' (bonding within a community through shared ritual). Secular societies often rely on 'thin trust' (trusting strangers because institutions protect you).
      *   In a religious framework, I don't steal from you because we belong to the same flock and God sees us.
      *   In a secular framework (like Scandinavia), I don't steal from you because the welfare state ensures you won't starve, and the police will catch me if I try.

  Both result in cooperation, but the *mechanism* is different. Your class is arguing about which mechanism is 'better', without agreeing on what the goal is. Is the goal salvation and virtue? Or is the goal social stability and safety?

  ### 3. What Would Move the Debate?
  You asked whether a new study, a clearer distinction, or an appeal to intuition would resolve this.

  *   **New Studies:** Unlikely to help on their own. There are already thousands of studies. The problem is interpretation. If a new study shows secular people lie less, the religious group will say "but do they feel guilt?" If a study shows religious people give more, the secular group will say "but do they only give to their own kind?" Data cannot solve a conceptual confusion.
  *   **Bedrock Intuitions:** This is partly the issue. Some people fundamentally believe human nature is fallen (needs restraint), whilst others believe it is malleable (needs good conditions). This is philosophical bedrock; you usually can't argue someone out of an intuition.
  *   **Clearer Distinctions (The Winner):** This is your way out. The debate will only move if someone reframes the question. Instead of asking "Does religion make people better?", the question should be: **"Under what conditions do human societies sustain high-trust cooperation, and what role does shared narrative play in that?"**

  ### 4. How to Use Your 'Moral Infrastructure' Idea
  If I were you, I'd bring your 'moral infrastructure' point to the next seminar. It aligns closely with the work of Émile Durkheim, who argued that religion is essentially society worshipping itself to maintain cohesion.

  You could propose that religion is a **technology for cooperation**. In pre-modern societies, you needed the supernatural to enforce norms because you lacked police forces and transparent institutions. In modern secular societies, we've built 'secular cathedrals' — courts, welfare states, universities — that perform the same function (creating trust) without the supernatural element.

  **In summary:**
  The debate is stalled because it is a category error. One side is measuring **virtue** (internal state/individual action), and the other is measuring **social capital** (systemic outcome). To move forward, you need to stop asking who is 'better' and start asking how different systems solve the same problem of trust.

  It's a brilliant insight for an ethics class. I'd reckon if you frame it that way, you might just get the conversation unstuck.
