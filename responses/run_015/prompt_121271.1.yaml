answer: |-
  The air in the Reckoning Room tasted of ozone and old paper. Elara laid two slates on the Keeper's desk. On the left, the Hull-Splice intervals as calculated by the standard Reckoning. On the right, the same intervals calculated by the Deviant Function.

  "They match," Elara said. "Every single entry. From the Launch to this morning."

  Keeper Halden didn't look up from the ledger he was annotating. "Then there is no discrepancy."

  "There is no discrepancy in the past," Elara corrected. "But look at the projection for the Ninth Century splice. The standard function says we need twelve struts. The Deviant Function says sixteen. Both functions fit every number we have ever written down. Both fit every correction you ever made to my training. There is no record, no log, no scratch-paper that distinguishes them."

  Halden finally looked at her. His eyes were the color of the hull plating, worn smooth by generations of polishing. "You are saying the Reckoning is ambiguous."

  "I am saying the Reckoning is empty. The Charter of Sameness says we preserve the Founder's will. But the Founder's will is just ink until someone reads it. And we can read it two ways."

  "Show me the Charter," Halden said.

  They went to the Vault. It was cold enough to see their breath. Halden unlocked the casing and withdrew the Founding Tablet. The notation was archaic, a series of glyphs representing quantities and operations. Halden traced a specific sequence—the one governing the splice intervals.

  "Here," Halden said. "The glyph for 'Increase.' It commands us to add the stress factor."

  "Does it?" Elara asked. "How do you know that glyph means *add* and not *quadd*?"

  Halden frowned. "Quadd?"

  "A function that acts like addition for all numbers we have ever used, but diverges after. This glyph could mean that. The shape doesn't tell us. The Founder taught us how to read it, but his teaching was just more gestures, more sounds. Those gestures fit the Deviant Function too. The tablet doesn't speak, Keeper. It waits for us to speak for it."

  Halden ran a thumb over the stone. He wanted the stone to push back, to assert its own meaning. It remained cold.

  They returned to the Reckoning Room. Voss, the Chief Engineer, was waiting, wiping grease from his hands. He'd heard the rumor.

  "So we're dead in the Ninth Century?" Voss asked.

  "Only if the Deviant Function is the true one," Elara said. "And we can't know."

  "Pick the simple one," Voss said, leaning against a bulkhead. "We're disposed to use the standard addition. It's what feels natural. It's what we've been trained to do. The Deviant Function is a trick. We should just go with what the crew naturally does."

  Elara shook her head. "Disposed isn't right, Voss. If I'm disposed to make a mistake, does that make the mistake right? Normativity isn't psychology. What I *will* do isn't what I *ought* to do."

  "But the standard rule is simpler," Voss insisted. "Occam's razor."

  "Is it?" Elara pulled up the algorithmic complexity metrics. "The Deviant Function is compact. It's just a conditional clause added to the standard rule. *If X < current max, then add. If X > current max, then add-plus-four.* It's not noticeably less simple. And even if it were, why does simplicity track truth? Maybe the universe is complex. Maybe the Founder loved complexity."

  Voss pushed off the bulkhead, frustrated. "So we have no data, no records, and no intuition. What are we supposed to use? Magic?"

  "I remember," Halden said quietly.

  They turned to him. He was staring at his own hands.

  "I remember the day I was certified," Halden said. "The Old Keeper put the stylus in my hand. He looked at me, and I felt… a click. A recognition. I saw what he meant. I grasped the rule. It wasn't just the words. It was an inner state. A flash of understanding. I know what I meant to do. I meant *this*." He tapped the standard slate. "That feeling is the fact. It anchors the words."

  Elara stepped closer. "Keeper, that feeling is just a sensation. Like a headache. A headache doesn't tell you how to calculate a hull splice. You could have that same feeling of 'click' and still go on to apply the Deviant Function. The feeling doesn't contain its own application. It doesn't stretch out into the future and force your hand to write twelve instead of sixteen."

  Halden's hand hovered over the slate. The memory of the click was vivid, but Elara was right. The memory was a picture. A picture of a rule is just another sign. It sits there, inert. It doesn't tell you how to use it.

  The silence in the room grew heavy. The ship hummed around them, a vibration in the floorboards. Outside, the void was absolute. Inside, the Reckoning was unraveling.

  "If there is no fact," Voss said, his voice lower now, "then why correct anyone? Why did you correct me last week when I tallied the rations wrong?"

  "Because you violated the practice," Elara said. "Not a metaphysical truth. The practice."

  "But the practice is what we do," Voss said. "And what we do fits both rules."

  "No," Elara said. "What we do is *correct each other*. That's the only thing that's real. Not the rule in the sky. Not the feeling in the head. The fact that if I write sixteen, you will stop me. And if you write sixteen, I will stop you. We hold each other accountable."

  Halden looked at the two slates. The choice between them was not a discovery. It was a decision. There was no bridge from the past to the future made of logic or memory. There was only the step they were about to take.

  "The Charter of Sameness," Halden said. "It claims we preserve the Founder's way. But perhaps… perhaps sameness isn't a mirror. It's a handshake."

  He picked up the standard slate. He did not know it was the true one. He could not know. But he knew that if he picked the other, Elara would correct him. And if she corrected him, and he accepted the correction, they would be going on in the same way.

  "If we choose this," Halden said, holding the standard slate, "and we teach it to the next Keepers, and they teach it to theirs… and we all correct each other when someone drifts… then the Reckoning holds. Not because it matches the Founder's ghost. But because we agree to live inside it."

  "And if we're wrong?" Voss asked. "If the hull splits?"

  "Then we split," Halden said. "But if we freeze because we are waiting for a fact that isn't there, we die today. The Reckoning isn't a description of the universe. It's the thing we do to keep the universe at bay."

  Halden took the stylus. He didn't look for the click. He didn't look at the Tablet. He looked at Elara.

  "Is this the Reckoning?" he asked.

  Elara looked at the number. Twelve. It matched what she would have written. It matched what the community of Keepers would write. It matched what the training licensed her to say.

  "Yes," Elara said. "That is the Reckoning."

  Halden signed the order. The ink dried on the page. There was no metaphysical seal, no flash of light. Just the scratch of the pen, and the agreement that tomorrow, when the question arose again, they would ask each other again, and answer together.

  "Prepare the splice," Halden said.

  Voss nodded and turned to the door. Elara began to file the slates. The paradox remained, suspended in the air like dust, but the ship moved on, carried by the weight of their mutual consent.
