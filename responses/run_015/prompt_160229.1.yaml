answer: |-
  ### Private Brainstorming Notes

  *   **Base Case Structure:** Both agree driver predicts before offer, passenger pays after ride. **Keep.** (Foundational).
  *   **Causal Inertness:** Both agree paying *now* doesn't causally get the ride *now*. **Keep.** (Prompt stipulation).
  *   **Disposition Benefit:** Both agree being disposed to pay yields the ride. **Keep.** (Foundational).
  *   **Act Cost:** Both agree paying costs utility at the moment. **Keep.** (Foundational).
  *   **Same Agent:** Must clarify we aren't talking about different people or time-slices. **Keep.** (Prevents evasion).
  *   **Amortization:** Dispositions must pay off over time, not just magically once. **Keep.** (Required constraint).
  *   **Camp D Core:** Dispositions primary, acts derivative. **Keep.** (Defining claim).
  *   **Camp R Core:** Acts/Rules primary, fix the rule. **Keep.** (Defining claim).
  *   **Act Rationality:** D says act irrational; R says act rational. **Keep.** (Core dispute).
  *   **Definition of 'Act':** D means momentary choice; R might mean choice-under-policy. **Flag Verbal.** (Diagnosis: Scope ambiguity).
  *   **Definition of 'Rational':** D means "optimific"; R means "choice-worthy". **Flag Verbal.** (Diagnosis: Semantic divergence).
  *   **Ex-Ante Advice:** Both say "become the sort who pays." **Keep.** (Practical agreement).
  *   **Ex-Post Advice:** Both say "pay," but for different reasons. **Flag Verbal/Substantive.** (Diagnosis: Same imperative, different justification).
  *   **Clean Acquisition:** Can you choose a disposition? D says yes/ought; R says irrelevant. **Keep.** (Critical weakness test).
  *   **No-Predictor:** Does this apply to self-command without observers? **Keep.** (Generalizability test).

  ***

  ### Joint Statement on Rationality and Disposition in the Base Case

  #### Part 1: Agreed Claims

  1.  **Causal Structure:** In the Base Case, the driver's decision to offer the ride causally precedes the passenger's decision to pay, and the passenger's decision to pay cannot causally influence the driver's prior decision.
  2.  **Informational Structure:** The driver offers the ride only if she reliably predicts the passenger possesses a disposition to pay; the passenger knows this condition holds.
  3.  **Immediate Act Cost:** At the moment of decision in town, the act of paying reduces the passenger's immediate utility compared to the act of not paying, holding all else equal.
  4.  **Immediate Act Efficacy:** Both camps concede that the act of paying, considered in isolation from the disposition that produced it, does not causally produce the ride or any other immediate benefit sufficient to offset its cost.
  5.  **Disposition Benefit:** The passenger is strictly better off overall if he possesses the disposition to pay than if he possesses the disposition to not pay, because only the former secures the ride.
  6.  **Identity of Agent:** Both camps address the same single agent persisting through time; the dispute is not resolved by treating the pre-ride and post-ride selves as distinct agents with conflicting interests.
  7.  **Ex-Ante Recommendation:** Both camps advise the agent, before encountering the driver, to cultivate or acquire the disposition to pay.
  8.  **The Amortization Condition:** A disposition counts as rational only if the expected gains it secures across the range of occasions on which it operates exceed the costs of acquiring it and exercising it; a disposition exercised exactly once is not vindicated unless it fits within a broader pattern of expected utility.
  9.  **No Net-Loss Dispositions:** Both camps reject the rationality of adopting a disposition that yields net losses over the long run, even if it yields a benefit in a specific isolated case.
  10. **Distinction of Levels:** Both camps acknowledge a conceptual distinction between evaluating a standing trait (disposition) and evaluating a singular occurrence (act), even if they disagree on which evaluation is primary.
  11. **Prediction Reliability:** The benefits of the disposition depend on the driver's predictive reliability; if the driver cannot read character, the disposition yields the cost of paying without the benefit of the ride.
  12. **Non-Vacuity:** These claims are not tautologies; each represents a point where a theorist outside this collaboration might argue for a different structure, such as denying the causal inertness of the act or denying the benefit of the disposition.

  #### Part 2: Residual Disagreements

  | Issue | Camp D (Disposition-First) Formulation | Camp R (Decision-Theory-Revision) Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Primary Locus** | Rationality is fundamentally a property of dispositions; acts are rational only insofar as they flow from rational dispositions. | Rationality is fundamentally a property of acts selected by a choice rule; dispositions are rational only insofar as they recommend rational acts. | Substantive |
  | **Status of the Act** | In the Base Case, the act of paying is irrational (suboptimal) even though it proceeds from a rational disposition. | In the Base Case, the act of paying is rational (choice-worthy) because the correct choice rule ranks it above not paying. | Substantive |
  | **Explanation of Benefit** | The benefit arises from *being* the sort of person who pays; the act is merely the cost of maintaining that identity. | The benefit arises because the act *signals* or *constitutes* the compliance with a rule that tracks the predictor's behavior. | Verbal (Diagnosis: Both agree on the correlation; dispute is over whether "being" or "doing" carries the explanatory weight.) |
  | **Definition of 'Act'** | An act is the momentary choice evaluated by its immediate causal consequences. | An act is the output of a general policy evaluated by the consequences of adopting that policy. | Verbal (Diagnosis: Disagreement over the scope of the term 'act' rather than the underlying reality.) |
  | **Rational Irrationality** | It is coherent to say "it is rational to be disposed to do what it is irrational to do." | It is contradictory to say "it is rational to do what it is irrational to do"; if it is rational to be disposed, it is rational to do. | Verbal (Diagnosis: Camp R prohibits the phrase by definition; Camp D uses it descriptively.) |

  #### Part 3: Crux Table

  | Sub-Question | Test / Variant | Camp D Prediction | Camp R Prediction |
  | :--- | :--- | :--- | :--- |
  | **Does prediction method matter?** | **The Trace-Reader Variant:** The driver cannot read dispositions directly but predicts based on accumulated behavioral traces (reputation) from past similar situations. | Camp D maintains the recommendation remains the same: cultivate the disposition. The disposition causes the traces. The focus remains on the internal trait. | Camp R argues this collapses into a standard reputation model. The act is rational because it maintains a valuable record. The focus shifts to forward-looking consequences of the record. |
  | **Is binding the solution?** | **The Costly-Self-Binding Variant:** The passenger can install a device preventing non-payment at a cost lower than the fare, observable by the driver. | Camp D treats binding as distinct from disposition. Binding is a tool; disposition is a trait. If binding is cheaper, use it, but disposition remains the ideal rational standard. | Camp R treats binding as functionally equivalent to a disposition. If binding secures the ride cheaper, the rational act is to bind. The disposition is only valuable insofar as it mimics binding. |
  | **Does frequency vindicate the act?** | **The Serial-Rider Variant:** The passenger faces this structure repeatedly with different drivers who read past payment records. | Camp D argues the disposition is vindicated by amortization over the series. Individual acts may still be locally suboptimal but globally required by the trait. | Camp R argues the act becomes straightforwardly optimal in each instance because non-payment damages future opportunities. The act itself pays off. |
  | **Do recommendations diverge?** | **The Advice Test:** What is said to the passenger at the moment of decision in town? | Camp D advises: "Pay, because you are the sort who pays," acknowledging the act itself costs utility. | Camp R advises: "Pay, because paying is the rational choice," asserting the act itself maximizes choice-worthiness. |
  | **Can you choose a trait?** | **The Clean-Acquisition Question:** By what route does a non-disposed passenger become disposed? Is an irrational step required? | Camp D requires a possible route to the disposition that is not itself irrational. If no route exists, the agent is tragically constrained, but the disposition remains the norm. | Camp R argues the acquisition route is irrelevant. The agent simply chooses the act according to the correct rule. If he cannot, he is simply irrational. |
  | **Is an observer required?** | **The No-Predictor Question:** Cases with no external reader (e.g., self-command, emotional commitment, personal rules). | Camp D argues the structure holds without an observer. The disposition benefits the agent by constraining future selves. | Camp R argues without an external predictor, the structure vanishes. The act must be causally efficacious to be rational. |

  #### Part 4: Closing Statement

  We, the undersigned representatives of Camp D and Camp R, acknowledge that our collaboration has clarified the structure of the disagreement without resolving it. We agree on the following points of vulnerability and future direction.

  **Costs and Embarrassments**
  *   **Camp D** would count it as a genuine embarrassment if it were demonstrated that dispositions cannot be cultivated voluntarily. If an agent cannot choose to become the sort of person who pays, then prescribing the disposition prescribes the impossible, violating the principle that "ought implies can."
  *   **Camp R** would count it as a genuine embarrassment if its decision rule required an agent to ignore causal dominance in a one-off case where no long-term amortization is possible. If the theory recommends paying in a single-shot Base Case where the driver's prediction is already fixed and immutable, Camp R risks endorsing magic thinking.

  **Agreed Further Development**
  We agree that the debate will not be moved by restating definitions of rationality. The one development that would actually move the debate is a **formal model of disposition acquisition**. Specifically, we require a model that specifies the cost and probability of acquiring a disposition ex ante, compared to the cost and probability of successful self-binding or act-based commitment. If such a model shows that disposition acquisition is systematically less efficient than binding, Camp D must retreat to binding. If it shows that binding is systematically unavailable or too costly compared to trait cultivation, Camp R must concede the primacy of the trait in explanation. We commit to reviewing such a model should it be produced.

  **Signed,**

  Rapporteur for Camp D (Disposition-First)
  Rapporteur for Camp R (Decision-Theory-Revision)
