      *   Camp D: Rationality is about dispositions. It is rational to be disposed to pay, even if the act of paying is irrational (suboptimal) at the moment.
      *   Camp R: Rationality is about acts/rules. The correct rule accounts for the predictor. Paying is rational because it correlates with getting the ride (evidential/newcomb-like reasoning or sophisticated causal reasoning).

  3.  **Brainstorming (Private Section):**
      *   Need 10-15 bullets.
      *   Mark Keep/Drop.
      *   Flag verbal disputes.
      *   *Idea 1:* Both agree the passenger gets the ride only if disposed to pay. (Keep - structural fact).
      *   *Idea 2:* Both agree paying at the moment costs utility. (Keep - structural fact).
      *   *Idea 3:* Both agree the passenger is better off being the sort who pays. (Keep - outcome fact).
