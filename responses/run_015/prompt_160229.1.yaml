      *   *Idea 10:* Self-binding is a separate mechanism. (Keep - for crux table).
      *   *Idea 11:* Is the act "causally inert"? (Keep - Camp D says yes, Camp R says no/incomplete).
      *   *Idea 12:* Advice at the moment vs. advice beforehand. (Keep - critical test).
      *   *Idea 13:* Can you choose a disposition? (Flag - Clean-Acquisition).
      *   *Idea 14:* Does Newcomb's Problem map exactly? (Drop - too technical/history dependent).
      *   *Idea 15:* Is the dispute about definition of "act"? (Flag verbal).

  4.  **Drafting Part 1: Agreed Claims:**
      *   Need 8-12 claims.
      *   Must include: Causal/Informational structure, concession about act of paying, same agent/time, Amortization Condition.
      *   *Drafting:*
          1.  Structure: Driver predicts disposition before offering ride.
          2.  Structure: Payment occurs after ride, no causal effect on receiving ride.
          3.  Outcome: Disposed passengers get rides; non-disposed do not.
          4.  Outcome: Disposed passengers end up better off than non-disposed.
          5.  Act Evaluation: At the moment of payment, paying reduces immediate utility compared to not paying.
          6.  Act Evaluation: Both camps agree the *act* of paying, isolated from the disposition selection, does not causally produce the ride.
          7.  Agent Identity: Both camps address the same agent at the same timeline.
          8.  Recommendation (Ex Ante): Both camps advise the agent to acquire the disposition before meeting the driver.
          9.  Amortization Condition: A disposition is rational only if net benefits over its lifetime exceed costs.
          10. No Magic: A disposition cannot be rational if it yields net losses over the long run.
          11. Prediction Reliability: The driver's ability to read character is assumed reliable enough to make the disposition beneficial.
          12. Separation: The evaluation of the disposition and the evaluation of the act can come apart in this specific structure.

  5.  **Drafting Part 2: Residual Disagreements Table:**
      *   Columns: Issue, Camp D, Camp R, Substantive/Verbal.
      *   *Issue 1: Status of the Act.* D: Act is irrational. R: Act is rational. (Substantive? Or verbal definition of rationality?) -> Let's call it Substantive regarding the property attribution.
      *   *Issue 2: Locus of Rationality.* D: Dispositions are primary. R: Acts/Rules are primary. (Substantive).
      *   *Issue 3: Explanation of Benefit.* D: Benefit comes from having the trait. R: Benefit comes from the act signaling the trait. (Verbal? Both agree on correlation). Let's make it substantive about *why* it counts as rational.
      *   *Issue 4: Definition of 'Act'.* D: Act is the momentary choice. R: Act includes the policy generating it. (Verbal - diagnosis: different scope of 'act').
      *   *Issue 5: Rational Irrationality.* D: Accepts the phrase. R: Rejects the phrase as contradictory. (Verbal - diagnosis: semantic prohibition vs descriptive claim).

  6.  **Drafting Part 3: Crux Table:**
      *   Need specific variants: Trace-Reader, Costly-Self-Binding, Serial-Rider, Advice Test, Clean-Acquisition, No-Predictor.
      *   Columns: Sub-question, Test/Variant, Camp D Prediction, Camp R Prediction.
      *   *Trace-Reader:* Does prediction method matter? D: No, disposition still key. R: Yes, becomes evidential.
      *   *Costly-Self-Binding:* Is binding the solution? D: No, disposition is distinct from binding. R: Yes, binding solves the commitment problem.
      *   *Serial-Rider:* Amortization test. D: Disposition justified by series. R: Policy justified by series.
      *   *Advice Test:* What do you say at the moment? D: "Pay, because you are the sort who pays." R: "Pay, because paying is the rational choice." (Wait, if advice is same, is dispute verbal?) -> Need to be careful. D might say "You ought to pay" (rule) but "Act is suboptimal". R says "You ought to pay" (act optimal).
