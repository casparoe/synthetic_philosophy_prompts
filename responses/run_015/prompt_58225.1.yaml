      *   *Claim 6 (The Personal vs. Project):* Leaders die, but the Revolution survives.
          *   *Evaluation:* Defensible. Robespierre died, Republicanism lingered.
          *   *Relevance:* Nuances the "devouring" aspect.

  4.  **Refining and Categorizing for the "Menu":**
      *   I need to make sure I hit the specific categories requested: inevitability, ideological dynamics, institutional incentives, personal fates vs. broader project.
