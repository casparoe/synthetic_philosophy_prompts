answer: |-
  Here is a numbered menu of distinct claims hidden within the slogan "revolutions devour their children," calibrated for your seminar discussion on the French Revolution (1789–Thermidor).

  I have arranged these from the most empirically modest (near-trivial) to the most metaphysically heavy (strongly deterministic). For each, I have categorized its historiographical status and indicated which side of your class debate it supports.

  ### 1. The Empirical Observation (Literal Fate)
  *   **The Claim:** In revolutionary periods, a statistically significant number of early leaders are executed by the regime they helped establish.
  *   **Category:** **Platitude.**
  *   **Analysis:** This is factually true regarding France (Bailly, Barnave, Brissot, Danton, Desmoulins, Robespierre, Saint-Just). However, it describes *what* happened, not *why*. It offers no causal mechanism.
  *   **Seminar Utility:** This supports neither the "unavoidable" nor the "contingent" argument on its own. It is merely the phenomenon that needs explaining.

  ### 2. The Coalition Fracture Thesis (Sociological)
  *   **The Claim:** Revolutionary movements are broad coalitions united only by opposition to the *ancien régime*. Once the old regime falls, the coalition lacks a common positive program, leading to factionalism where the most organized or ruthless faction purges the others.
  *   **Category:** **Contentious but Defensible.**
  *   **Analysis:** This aligns with your friend's housing cooperative analogy. It suggests the purges were the result of political competition and organizational dynamics, not necessarily the ideology itself. In France, this explains the Girondin-Montagnard split well.
  *   **Seminar Utility:** This supports the **weaker observation that coalitions splinter.** It suggests the Terror was a likely outcome of political instability, but not metaphysically inevitable. It leaves room for the idea that different leaders might have resulted in less violence.

  ### 3. The Institutional Incentives Thesis (Structural)
  *   **The Claim:** Revolutions create states of emergency (war, scarcity, counter-revolution) that require centralized power. Institutions created to manage emergencies (e.g., the Committee of Public Safety) create incentives to eliminate rivals to prevent "sabotage," turning political disagreement into treason.
  *   **Category:** **Contentious but Defensible.**
  *   **Analysis:** This addresses the "war, scarcity, and improvised decisions" point in your seminar. It argues that the *structure* of the situation, rather than the *ideas*, drove the violence. If the war had ended in 1791, the incentives for purging would have vanished.
  *   **Seminar Utility:** This supports a **middle ground.** It argues the Terror was structurally probable given the external pressures, but rejects the idea that it was "contained in the earlier promise." It validates the contingency of war as a catalyst.

  ### 4. The Ideological Purity Thesis (Psychological/Intellectual)
  *   **The Claim:** Revolutionary ideologies based on abstract "Virtue" or "The General Will" (e.g., Rousseauian influences) set impossible standards. Since no human can perfectly embody the General Will, leaders inevitably suspect each other of impurity, leading to a spiral of accusations and executions to prove revolutionary zeal.
  *   **Category:** **Contentious but Defensible.**
  *   **Analysis:** This addresses the "power of ideas about sovereignty and virtue." It suggests the language of 1789 created a trap where compromise looked like corruption. However, historians debate whether Robespierre's Rousseauism caused the Terror or was used to justify it post hoc.
  *   **Seminar Utility:** This supports the **"inner logic" argument.** It suggests the ideas themselves contained the seeds of the Terror, making violence highly probable, though it stops short of saying it was strictly unavoidable regardless of circumstances.

  ### 5. The Teleological Determinism Thesis (Metaphysical)
  *   **The Claim:** The end is contained in the beginning. The specific promise of 1789 (absolute popular sovereignty) *necessarily* requires the violence of 1793 to realize itself. The Terror was not an accident or a reaction to war, but the logical fulfillment of the Revolution's core premise.
  *   **Category:** **False (when applied to France 1789–Thermidor).**
  *   **Analysis:** This is the "strongly deterministic" reading. Most modern revisionist historians (e.g., William Doyle, Simon Schama) reject this. They argue that 1789 was a constitutional monarchist moment; the Republic and Terror were products of specific contingencies (the King's flight, the outbreak of war, the economic crash). To say it was *necessary* ignores the viable alternatives that existed until 1792.
  *   **Seminar Utility:** This is the only reading that supports the argument that **the Terror was unavoidable.** However, it is the most historically vulnerable position in current scholarship.

  ### 6. The Project Survival Thesis (Strategic)
  *   **The Claim:** The revolution "devours" the *individuals* specifically to save the *project*. The leaders are expendable; the Revolution is not. Executing the founders is a ritual sacrifice to preserve the regime's legitimacy when it falters.
  *   **Category:** **Contentious but Defensible.**
  *   **Analysis:** This distinguishes between the fate of the leaders and the fate of the broader project. Robespierre had to die for the Republic to stabilize into the Directory. The "children" are eaten so the "parent" (the State) can survive.
  *   **Seminar Utility:** This complicates the debate. It suggests the violence was functional for regime survival (supporting the institutional thesis) without claiming the violence was morally or ideologically pre-ordained (rejecting the deterministic thesis).

  ***

  ### Summary for Seminar Intervention

  If you want to challenge the use of the slogan as a conversation-stopper, you can propose the following distinction to your classmates:

  1.  **If you mean Claim 2 or 3 (Coalition/Institutions):** You are making a sociological argument about how unstable groups behave under stress. This is defensible, but it **does not prove the Terror was inevitable.** It only proves it was a risk that materialized due to specific pressures (war, economic collapse).
  2.  **If you mean Claim 5 (Determinism):** You are making a philosophical argument that 1793 was the hidden truth of 1789. This **does support the "unavoidable" conclusion,** but it is historically fragile because it ignores the contingency of events (like the King's flight to Varennes) that radicalized the process.

  **Recommendation:** Suggest that the slogan is useful for **Claim 1** (describing the outcome) and **Claim 2** (describing the factionalism), but misleading if used to justify **Claim 5** (historical inevitability). The housing cooperative analogy supports Claim 2; the "inner logic" argument relies on Claim 5. They are not the same argument.
