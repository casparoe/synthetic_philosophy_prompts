          *   *The Internal Theater:* The bulk of the film takes place *inside* Joel's head. The landscape shifts, rooms collapse, memories hide in other memories. This is a visual metaphor for internalism. If memory were truly extended, the landscape wouldn't crumble when the neuron fires; the house would stay standing while the *connection* broke. But the house *in the memory* crumbles.
