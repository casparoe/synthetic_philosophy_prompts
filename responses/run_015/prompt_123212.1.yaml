      *   **Goal:** Settle the argument (or clarify the stakes) for a film-and-philosophy night.

  2.  **Deconstruct the Philosophical Core:**
      *   **Extended Mind Thesis (EMT):** Clark & Chalmers (1998) is the background here, though I can't cite them. The core idea: If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then it *is* part of the cognitive process. Key conditions: Constant availability, easy access, automatic endorsement (trust-and-glue).
      *   **Internalism:** Memory and cognition are bounded by the skull/skin. The environment causes memories but doesn't constitute them.
      *   **The Film's Mechanism:** Lacuna targets neural pathways. The world remains unchanged. The relationship rekindles.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the debate. It's a strong philosophical reading vs. a strong textual reading.

      *   **Section 1: EMT Criteria vs. The Film's Evidence:**
