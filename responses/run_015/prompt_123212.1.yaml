              4.  *Mary's Mailing:* This is the Friend's strongest point. The external record restores the truth. *Counter:* It restores *knowledge*, not *memory*. They choose to proceed despite the knowledge.

      *   **Conclusion/Settlement:**
          *   The Friend is right that the world *causes* the rekindling (causal role).
          *   The User is right that the world does not *constitute* the memory (constitutive role).
          *   The film is ultimately Internalist regarding identity/memory, but Externalist regarding *fate* or *chemistry*.
          *   The "World Surgery" argument reveals that if EMT were true, individual identity would collapse. The film preserves individual identity (they choose each other anew).

  4.  **Refining the Tone:**
