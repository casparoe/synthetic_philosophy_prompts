          *   *Analysis:* If memory is extended, deleting it requires deleting the extension. But if I have to change *your* brain (Clementine) to delete *my* memory, the boundary of the self becomes untenable. It leads to a *reductio*. Memory becomes a collective property. If Lacuna has to gaslight the whole town to erase Joel's mind, "Joel's mind" has dissolved into "Montauk's mind."
          *   *Implication:* The fact that the film treats the head-procedure as the primary intervention suggests the film assumes the head is the locus of identity. The world is just scenery.

