  *(Self-Correction on the "Premium Package"):* I need to make sure I don't just say "User is right." I need to show *why* the Friend's view leads to a *reductio ad absurdum* regarding personal identity. If I have to edit you to erase me, where do I end?

  *(Self-Correction on the "Prosthesis"):* The user asked if EMT is committed to this being memory. I should argue that EMT *would* call it memory (access to information), but the film shows that *emotional* memory is different. This highlights a limitation of EMT in explaining *affective* states.

