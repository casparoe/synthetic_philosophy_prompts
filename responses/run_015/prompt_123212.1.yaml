          *   User's Claim: The film argues for *Internalism*. If EMT were true, Lacuna would need to do "world surgery" (repaint houses, edit diaries, alter others). Since deleting head-stuff is treated as sufficient (mostly), the film assumes memory is internal. The friend's "unfilmable" defense is a cop-out.
