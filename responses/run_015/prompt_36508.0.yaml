      *   *Correction:* The user is a rationalist reader. I can use terms like "Person-Affecting View," "Critical-Level," "Supererogatory," "Repugnant Conclusion." But keep it accessible.
      *   *Emphasis:* Make sure to emphasize that *unsolved philosophy* shouldn't dictate *life-altering personal decisions*. The "ought implies can" principle applies to emotional capacity too.

  6.  **Final Polish:** Check against American English spelling/idioms. Ensure empathy comes through. (e.g., "lodged itself in my head," "bite the bullet").

