  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: Socrates (P3) vs. Mytilene/Reversibility (P1/P4).**
          *   *Conflict:* P3 defends the execution as legitimate sovereignty enforcing norms. P1 treats the initial Mytilene genocide vote as an "excess" needing correction. P4 demands reversibility for legitimacy.
