      This interdisciplinary angle is preferable to pure philosophy or pure engineering alone. Pure philosophy lacks formal criteria for "inviolability," while pure engineering lacks the conceptual vocabulary to distinguish a hidden parameter from a metaphysical boundary. Bridging these fields allows for a rigorous test of metaphysical claims against executable models.

