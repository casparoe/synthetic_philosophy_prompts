answer: |-
  My dear friend,

  I received your letter with great interest and I must confess that your question strikes at the very heart of the difficulty most people find in accepting the Vedantic conception of the mind. You ask why brain damage splits people up if consciousness is truly one universal substance, citing the tragedy of a stroke erasing a man's memory of his own children as proof that the mind is chopped into pieces along with the flesh. It is a formidable objection, and I will not insult your intelligence by waving it away with mystical platitudes. From the standpoint of empirical science, which is my own home turf, the correlation between the physical state of the brain and the contents of the individual mind is undeniable. If you damage the instrument, the music stops or becomes distorted. To deny this would be to deny the very physiology that keeps us alive. However, where I must part ways with the materialist conclusion is in the assumption that the brain generates consciousness rather than merely localizing it.

  Consider the analogy of a window pane through which sunlight streams into a room. If you crack the glass or smear it with mud, the light that enters is fragmented or dimmed. The pattern of illumination on the floor changes drastically based on the condition of the glass. If you were a tiny observer living only on that patch of floor, you would conclude that the light itself has been broken or altered by the damage to the window. But the sun remains whole. The damage is to the medium of transmission, not the source of the illumination. In this view, the brain is not the generator of the mind but rather the mechanism through which the one universal consciousness focuses itself into a specific locus of experience, a specific persona with a specific history. When a stroke occurs, it damages the filter. It destroys the access to certain memories, certain personality traits, and certain capacities for expression. The individual persona is indeed fragmented, but that persona was never the true self to begin with. It was merely a temporary configuration of the one mind appearing as many.

  I will admit to you, however, that this distinction offers cold comfort to the suffering individual or their grieving family. Here is where your challenge does wound the philosophical stance, not logically, but humanly. It is easy for me to sit in my study in Dublin and speak of the unity of Atman while a man across the city forgets his children's faces. The appearance of plurality is so total, so convincing, and so physically enforced that to call it an illusion feels almost like a cruelty. The materialist view is simpler in this regard because it accepts the appearance as the reality. If the brain is the mind, then when the brain breaks, the mind breaks, and there is no deeper mystery to agonize over. My thesis requires us to accept that the deepest reality is inaccessible to the very instrument we use to investigate it. We are trying to use the mind to understand the mind, like a knife trying to cut its own blade.

  Yet, I remain convinced that the alternative is far more perilous. If we accept that consciousness is merely a product of separate brains, then we are truly isolated souls bumping against each other in a dark universe, born in solitude and dying in solitude. The Vedantic insight, which I find aligns with the deepest implications of quantum mechanics as well, is that the plurality of viewpoints is an illusion. There is only one mind that dreams it is many. The memory of the children is stored in the brain, yes, and that record can be wiped. But the consciousness that experiences the love for those children, the sheer capacity to feel and be, is not stored in the neurons. It only shines through them. When the vessel breaks, the water spills, but the ocean is not diminished. I know this does not fix the broken vessel, and I know that from your perspective it looks as though I am ignoring the blood on the floor. I am not. I am simply suggesting that the blood belongs to the mechanism, not the witness. The stroke divides the personality, but it cannot divide the subject of experience, because there are not many subjects to be divided. There is only you, and only me, and only him, all looking out through different eyes, some of which are now clouded by injury. The light is one, even if the windows are broken.

  Yours sincerely,

  Erwin Schrödinger
