answer: |-
  This is an exceptionally sharp observation, and your phrase **"sanction without a sentencer"** is a viable theoretical contribution in its own right. You have identified a gap between the *phenomenology* of the practice (it feels and functions like punishment) and the *ontology* claimed by its practitioners (it is merely the aggregation of private choices).

  For a seminar paper, you can map this onto several established frameworks in the philosophy of punishment and political theory. Here is a breakdown of the implicit theories at work, the contradictions they generate, and how you might structure the argument.

  ### 1. The Definition Problem: Denying the "Authority" Condition
  Standard analytic definitions of punishment (e.g., H.L.A. Hart, Joel Feinberg) usually require five elements:
  1.  It must involve pain or unpleasant consequences.
  2.  It must be for an offense.
  3.  It must be of an offender.
  4.  It must be intentionally administered.
  5.  **It must be imposed by an authority constituted by a legal system (or analogous rules).**

  The practice you describe explicitly denies condition #5 to avoid the label of "punishment." By framing disinvitation as the aggregation of hundreds of individual exercises of free speech/association, organizers argue there is no *sovereign* imposing a penalty.

  **The Implicit Theory:** This presupposes a **decentralized or rhizomatic view of norm enforcement.** It assumes that moral authority does not need to be institutionalized to be legitimate. It relies on a market-model of morality: if enough "consumers" of speech withdraw consent, the "product" is recalled.
  **The Contradiction:** As you note, the language used ("accountability," "sending a message," "consequences") is the language of penal justice, not market preference. If I choose not to buy a book because I dislike the cover, that is preference. If I campaign to ensure the book is not sold *because the author is dangerous*, that is sanction. The practice tries to have the moral weight of punishment without the procedural constraints of punishment.

  ### 2. Platforming as Privilege vs. Right
  You ask: *Does the practice only make sense if being platformed is a privilege rather than something you're owed?*

  **Yes.** This is the "State Action" doctrine translated into social norms.
  *   **The Assumption:** There is no right to a platform, a publisher, or an audience. Therefore, withdrawing these things cannot be a *harm* in the rights-violation sense; it is merely a withdrawal of a benefit.
  *   **The Tension:** This holds up legally (in the US context), but morally it is shaky when the "withdrawal" is coordinated to produce a specific punitive outcome. If 500 people independently decide not to invite you, that is coincidence. If 500 people sign a letter *demanding* you not be invited, they are attempting to exercise authority they claim not to have.
  *   **Theoretical Implication:** The practice relies on a **negative liberty** framework (freedom *from* interference) for the signatories, while imposing a **positive disability** on the target. It assumes the signatories' freedom of association trumps the target's opportunity to speak, framing the latter as non-existent rather than infringed.

  ### 3. Expressive Theory and the Problem of Reconciliation
  You ask: *Does it need an expressive theory where the point is denunciation?*

  This is the strongest fit. **R.A. Duff's communicative theory of punishment** argues punishment is a moral dialogue intended to bring the offender to repentance.
  *   **The Fit:** The open letter is purely expressive. It is a public denunciation meant to clarify community boundaries ("We do not tolerate X here"). The material cost (lost income) is framed as incidental to the moral message.
  *   **The Failure:** Communicative punishment requires a path to **reconciliation**. There must be a way for the debt to be paid and the offender reintegrated. Your observation that "nobody decides when it is over" highlights a fatal flaw in applying expressive theory here.
  *   **Conclusion:** The practice employs *expressive denunciation* without the *communicative restoration*. It is punishment as **exile**, not punishment as **correction**. This suggests the implicit theory is not actually Duffian, but rather a form of **moral quarantine**: the goal is not to fix the offender, but to render them toxic to protect the community.

  ### 4. "Answerability" vs. "Punishment": Slogan or Distinction?
  You ask: *Is 'answerability rather than punishment' a real distinction here?*

  In philosophy, **answerability** usually implies a duty to give reasons to a specific forum. **Punishment** implies the imposition of a burden.
  *   **The Slogan:** In this context, "accountability/answerability" is largely a euphemism. True answerability requires a hearing where the accused can offer a defense. The open letter model is a *trial in absentia*.
  *   **The Reality:** It functions as **strict liability**. The sanction is imposed based on the *fact* of the speech or association, not necessarily on a nuanced adjudication of intent or context.
  *   **Verdict:** It is a slogan used to bypass the procedural requirements of punishment (due process, proportionality) while retaining the social benefits of punishment (norm reinforcement, deterrence).

  ### 5. What is Underdetermined?
  You ask: *Which parts are underdetermined, so that several theories license them equally?*

  *   **Agency:** Is the punishment administered by the signatories? The university administration (caving to pressure)? The publisher (fearing boycott)? The theory is underdetermined because it obscures *who* is actually pulling the lever. This diffusion of responsibility is a feature, not a bug; it prevents counter-attack.
  *   **Intent:** Is the goal safety (consequentialist)? Retribution (retributivist)? Or virtue signaling (expressive)? The practice works regardless of which motive is primary, which makes it resilient but theoretically incoherent.
  *   **Proportionality:** There is no standard for whether the sanction fits the "crime." A tweet might cost a career. This suggests the theory is **deterrence-based** (make the cost so high no one else does it) rather than **retributive** (give them what they deserve).

  ### 6. If the Implicit Theory Were Coherent, What Must Change?
  If the organizers want their practice to align with a defensible moral theory, they would need to choose a lane.

  **Lane A: It is NOT Punishment (Pure Association)**
  *   **Change:** Stop using moralizing language ("accountability," "justice," "harm").
  *   **Change:** Admit it is purely about preference ("We don't like this view") rather than objective wrongness ("This view is dangerous").
  *   **Change:** Stop sanctioning third parties (panelists, publishers). Guilt by association violates the logic of individual association.

  **Lane B: It IS Punishment (Social Sanction)**
  *   **Change:** **Establish a Sentencer.** Acknowledge that the organizers are acting as a tribunal.
  *   **Change:** **Due Process.** Allow the target to respond before the letter is published or the disinvitation occurs.
  *   **Change:** **Proportionality.** Ensure the career cost matches the severity of the offense.
  *   **Change:** **Reintegration.** Define what an apology or restitution looks like and commit to lifting the sanction once achieved. (This addresses your "nobody decides when it's over" point).
  *   **Change:** **Drop the "Not Censorship" Defense.** Admit it is a form of social censorship that competes with free speech values, rather than denying the coercive nature of the act.

  ### Recommendation for Your Paper
  Your concept of **"Sanction without a Sentencer"** is the strongest hook. It bridges the gap between **Foucault** (disciplinary power is decentralized and omnipresent) and **Hart** (punishment requires authority).

  You might argue that this practice represents a shift from **Sovereign Punishment** (the state/university imposing rules) to **Networked Punishment** (the community imposing norms through distributed action). The moral danger you identify is that Networked Punishment retains the severity of Sovereign Punishment (career death) while evading the constraints of Sovereign Punishment (due process, proportionality, finality).

  The irony you noted regarding prison abolitionists is key: they often oppose state punishment because it is rigid, dehumanizing, and offers no path to reintegration. Yet this social practice creates a **digital panopticon** where the sentence is indeterminate, the jailer is everyone, and there is no parole board.

  **Thesis Suggestion:** *The practice of deplatforming via open letter presupposes a theory of "diffuse retributivism" that claims the moral authority of punishment while disavowing the institutional responsibilities of a sentencer, resulting in a sanction that is uniquely resistant to proportionality and reconciliation.*
