answer: |-
  Here is the committed answer: **The dispute is not verbal; it is a real normative split about the ontology of mathematical objects.** The question is well-posed, and the stalemate is not a failure of communication but a stable equilibrium between two incompatible goals for the discipline.

  Here is the breakdown of why the "verbal" diagnosis is wrong and why your proposed distinction only moves the bump.

  ### 1. It is Not About the Word "Existence"
  If this were merely verbal, the two sides could agree to define "existence$_C$" (classical) and "existence$_K$" (constructive) and go home. They do not do this because the stakes are not lexicographical; they are **inferential**.

  When a classicist asserts "There exists a set $S$," they are licensing a specific set of inferences (e.g., proof by contradiction, non-constructive instantiation) that the constructivist refuses to license. When a constructivist rejects that existence, they are not just nitpicking a definition; they are claiming that the classicist's inference rules allow the derivation of "truths" that have no anchor in reasoning or computation.

  The fight over AC is a proxy war for **what counts as a valid proof**.
  *   **Classicists** prioritize **descriptive power**: Math should model the full landscape of logical possibility, even if parts of that landscape are inaccessible to human computation.
  *   **Constructivists** prioritize **warranted assertibility**: Math should track what can be known, built, or computed.

  This is a normative disagreement about the *function* of mathematics. Is math a map of all possible structures (Platonism), or is it a record of mental constructions (Intuitionism)? You cannot solve this by defining terms differently because both sides claim their definition captures the *true* nature of mathematical reasoning.

  ### 2. Your Distinction Moves the Bump
  You propose splitting "selection" into **algorithmic-pickable** vs. **structurally-guaranteed**. This is a useful taxonomy, but it does not dissolve the dispute; it merely relocates the conflict from "What is AC?" to "Which selection counts as *real*?"

  If you tell the classicist, "Okay, you have structurally-guaranteed selection," and the constructivist, "You have algorithmic-pickable selection," you have created two separate clubs. But the fight persists because both sides claim their club is **Mathematics** (capital M).

  *   The classicist insists that "structurally-guaranteed" selection is sufficient for *truth*. To deny it is to cripple analysis and topology.
  *   The constructivist insists that "structurally-guaranteed" selection is *fiction*. To accept it is to pollute math with meaningless statements.

  The bump moves from "Do we accept AC?" to "Which ontology is fundamental?" The constructivist argues that classical math is a useful idealization built on top of constructive foundations. The classicist argues that constructive math is an unnecessarily restrictive fragment of the true universe of sets. The hierarchy remains contested.

  ### 3. Why the Stall is Permanent
  The reason the fight "never moves" is that both positions are **reflectively stable**.

  *   **Classicists** can consistently argue that computability is a physical constraint, not a mathematical one. Math describes abstract reality, not computer memory.
  *   **Constructivists** can consistently argue that abstract reality without computational grounding is theology, not math.

  There is no neutral arbiter to decide between them because any arbiter would have to use logic to decide on the rules of logic. If you use classical logic to judge, classical wins. If you use constructive logic, constructive wins.

  ### The Verdict
  The dispute is **normative**, not verbal. It is a disagreement about whether mathematics is a tool for **discovery** (uncovering pre-existing truths, regardless of our ability to compute them) or a tool for **construction** (building verifiable knowledge).

  Your distinction between algorithmic and structural selection clarifies the *mechanics* of the disagreement, but it does not resolve the *metaphysics*. The stall is not a bug; it is a feature of a discipline that serves two masters: **truth** and **warrant**. Until one side concedes that their goal is secondary to the other's, the fight will remain exactly where it is.
