  ### Diagnostic Notes on Vacancies and Overlaps

  1.  **The "Anti-Singleton" Cluster (Branch B-2):** The *Pluralist Anti-Singleton* is the only mandatory position that negates the singleton hypothesis. It occupies the logical space where *Normative Convergence* is required but *Irreducible Pluralism* prevents it. The other three leaves in this quadrant (B-2-i-Beta, B-2-ii-Alpha, B-2-ii-Beta) are marked as **Logical Variants** because the contradiction between "Normative Convergence" and "Irreducible Pluralism" renders the stability mechanism and cosmological scope moot; the singleton fails to form regardless of entropy or horizons.
  2.  **The Incoherence of Normative Suppression (Branch B-1-i):** Leaves claiming both *Normative Convergence* and *Low-Entropy Suppression* are diagnosed as **Incoherent**. In this physical framing, "Normative" implies an endogenous energy minimum (agents *want* the state), while "Low-Entropy Suppression" implies an exogenous potential well (agents are *forced* into the state). Combining them conflates the Hamiltonian of the agents with the Hamiltonian of the ruler.
  3.  **Computational Pluralism (Branch A-2):** Leaves where *Computational Supremacy* tolerates *Irreducible Pluralism* are largely **Neglected**. Standard literature assumes a superintelligence would optimize for uniformity to reduce transaction costs. A singleton that computationally enforces diversity is physically possible but strategically opaque.
  4.  **Overlap Flag:** No two distinct mandatory named positions fall on the same leaf. The *Pluralist Anti-Singleton* shares its logical quadrant with three unnamed variants, but these are sub-cases of the same failure mode, not distinct positions.

  ### Usage Instruction
  To classify a new theory of global governance, trace its assumptions through the four splits. If the theory lands on an **Incoherence** leaf, the theory contains a physical or logical contradiction in its framing of authority. If it lands on a **Neglect** leaf, the theory represents a novel contribution to the logical space. If it lands on an **Occupied** leaf, compare its specific formulation against the "Awkward Commitment" to test its robustness.
