      2.  **Severity 2:** The "Syntax vs. Semantics" Dilemma (6 vs. 4). Isomorphism is syntactic/structural; CR says that's insufficient.
      3.  **Severity 3:** The "Epiphenomenal Mind" Worry (2 vs. 4). Genuine beliefs usually imply causal power.

      *Wait, one more:* 3 vs 5. 3 says symbol facts are facts *about the careenium*. 5 says content is fixed by coupling *to what they stand for*. If what they stand for is external, the fact isn't just about the careenium. It's about the relation. 3 implies internal realism, 5 implies externalism.

