answer: |-
  # A Decision Tree for Social Ontology

  This taxonomy sorts philosophical positions on social construction by tracing their commitments from a concrete monetary case through three diagnostic questions regarding mechanism, dynamics, and materiality.

  ## The Decision Tree

  **Root Node: The Defunct Banknote**
  *Imagine a physical banknote that was legal tender in a sovereign state which dissolved about thirty years ago; today it circulates only among collectors with no institutional backing or legal status. Is it still money?*

  *   **Path A: No.** It is merely paper; the kind 'money' ceased when the institution ceased.
  *   **Path B: Yes.** It retains status as money within the collector market or historical context.

  ---

  **Branch 1: Mechanism of Construction**
  *Does sustaining the kind require explicit collective agreement, or can distributed practices do the work alone?*

  *   **From Path A (No):** Requires **Explicit Agreement** (Status functions require collective intentionality).
      *   *(Note: Path A + Distributed Practices is logically unstable; if practices sustain it, it would still be money. This branch is flagged as **Incoherent**).*
  *   **From Path B (Yes):** Relies on **Distributed Practices** (Habits, usage, and market behaviour sustain the kind).
      *   *(Note: Path B + Explicit Agreement is **Unexplored**; it is rare to argue collectors have a formal agreement rather than tacit habits).*

  ---

  **Branch 2: Dynamic Feedback**
  *Does being classified in the kind create feedback loops that change members' properties or behaviour?*

  *   **From Branch 1 (Explicit Agreement):** **No Feedback** (The kind is static; classification does not alter the underlying reality).
  *   **From Branch 1 (Distributed Practices):**
      *   **Option 2.1: Yes.** Classification reshapes the subject (Interactive Kinds).
      *   **Option 2.2: No.** Classification tracks pre-existing patterns (Indifferent Kinds).

  ---

  **Branch 3: Biological Correlates**
  *Do biological correlates play any causal role in the kind's social function, even if they are not definitional?*

  *   **From Branch 2 (No Feedback):** **No Role** (Biology is irrelevant to the social function).
  *   **From Branch 2 (Yes/Feedback):**
      *   **Option 3.1: Yes.** Biology constrains or interacts with the social construction.
      *   **Option 3.2: No.** Biology is wholly subordinate to social categorisation.

  ---

  ## The Leaves: Positions and Awkward Commitments

  The following positions represent the coherent endpoints of the tree above.

  ### 1. Institutional Realism
  *   **Path:** Banknote (No) → Explicit Agreement → No Feedback → No Biological Role.
  *   **Description:** Social kinds exist only in virtue of constitutive rules imposed by active institutions.
  *   **Awkward Commitment:** This view must assert that race and gender would literally cease to exist if the state stopped recording them, ignoring their embodied persistence.

  ### 2. Critical Constructivism
  *   **Path:** Banknote (Yes) → Distributed Practices → Feedback → No Biological Role.
  *   **Description:** Social kinds are sustained by power-laden practices that reshape the subjects they classify.
  *   **Awkward Commitment:** It struggles to explain why the defunct banknote retains physical durability and market value whilst gender norms remain fluid and contestable.

  ### 3. Interactionist Naturalism
  *   **Path:** Banknote (Yes) → Distributed Practices → Feedback → Biological Role.
  *   **Description:** Social kinds emerge from the looping interplay between social classification and biological reality.
  *   **Awkward Commitment:** By admitting biological causality, this position risks inadvertently naturalising oppressive categories it seeks to critique.

  ### 4. Pluralist Naturalism
  *   **Path:** Banknote (Yes) → Distributed Practices → No Feedback → Biological Role.
  *   **Description:** Social kinds track real biological clusters, but their significance is determined by diverse practical contexts.
  *   **Awkward Commitment:** It must explain why the defunct banknote functions as money without biological correlates, whilst insisting gender requires them.

  ### 5. Eliminativism
  *   **Path:** Banknote (No) → Explicit Agreement → Feedback → No Biological Role.
  *   **Description:** The kind is a fiction sustained by false agreement, and recognising this fiction changes the subject.
  *   **Awkward Commitment:** If recognising the fiction changes the subject (feedback), then the kind was functionally real, contradicting the claim that it is merely false.

  ---

  ## Unoccupied and Asymmetric Combinations

  This taxonomy assumes a uniform ontological stance across different kinds (money, race, gender). However, several logical combinations remain unoccupied or are treated asymmetrically in the literature.

  **1. The Asymmetric Feedback Gap**
  *   **Combination:** Accepting feedback loops for gender but denying them for race.
  *   **Status:** **Incoherent.** Most philosophers argue that if one kind is interactive due to human awareness of classification, the other must be as well, given that both are perceived social statuses. Treating them differently usually implies a hidden biological essentialism about race.

  **2. The Institutional-Practice Hybrid**
  *   **Combination:** Banknote is *not* money (Institutional view) but Gender is sustained by *Distributed Practices* (Practice view).
  *   **Status:** **Unexplored.** This is logically possible (one could be a Searlean about economics and a Bourdieusian about sociology), but it creates a fragmented ontology that makes cross-domain analysis difficult.

  **3. The Biological-Money Anomaly**
  *   **Combination:** Biological correlates play a causal role in Money.
  *   **Status:** **Incoherent.** There is no plausible mechanism by which human biology causally sustains the value of a banknote, making this leaf empty for monetary kinds, though it remains contested for race and gender.

  **4. The Static Interactive Kind**
  *   **Combination:** Classification changes behaviour (Feedback) but the kind remains Definitionaly Static.
  *   **Status:** **Unexplored.** If the properties of the members change via feedback, the definition of the kind usually requires updating to track the new reality; holding the definition static whilst admitting change creates a tension in truth-conditions.
