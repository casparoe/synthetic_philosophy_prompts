      4. Section III: Meta-Theoretical Clarifications (The Verbal/Real analysis).

      *Wait, one more check:* "No strawman wording; if a camp wouldn't sign their own row, it's wrong." I need to be very careful with the Consequentialist phrasing. They won't say "We want to hurt people." They will say "We want to minimize net harm."

