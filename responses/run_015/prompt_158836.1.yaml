      *   **Goal:** Stop arguing in circles, produce something both sides sign.
      *   **Requirements:**
          1.  Numbered section of *agreed claims* (purpose, justification, ruled-out considerations).
          2.  *Disagreements Table* (Issue, Retributivist Position, Consequentialist Position, Crux, Agreed Test/Case, Predictions from each side).
          3.  Specific Cases to include: Unlabelled Sanction, Consent Ledger, Substitution, Sentence/Conviction Mismatch, The Last Offender.
          4.  Specific Analysis: Address the "verbal vs. real" dispute regarding retributivism (permissible vs. required vs. good).
          5.  Constraint: No citations/readings (closed-book style).
          6.  Tone: Philosophical, precise, non-strawman, collaborative but adversarial in structure.

  2.  **Deconstruct the Parties' Positions (Mental Simulation):**
      *   *Retributivists:* Focus on desert, proportionality, blame, censure. Punishment is intrinsically right (or required) for the guilty. Punishing the innocent is inherently wrong, regardless of consequences. Communication of condemnation matters.
      *   *Consequentialists:* Focus on harm reduction, deterrence, incapacitation, rehabilitation. Punishment is an evil only justified by future goods. Punishing the innocent is usually wrong *instrumentally* (bad for trust/system), but maybe not inherently wrong in a vacuum.
      *   *Common Ground:* Both likely agree punishing the *known innocent* is bad (though for different reasons). Both agree the state needs authority. Both agree *some* constraint on state power is needed.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the overlap.
      *   *Claim 1 (The Presumption):* State coercion needs justification. Burden of proof is on the punisher.
      *   *Claim 2 (The Innocent):* Punishing the known innocent is impermissible. (Retributivists: inherently unjust. Consequentialists: destroys system utility/trust). *Self-Correction:* Can consequentialists sign "impermissible" absolutely? A thoroughgoing consequentialist might say "only if it maximizes utility." To get agreement, frame it as a *practical* absolute or a *rights-based* constraint both accept for the sake of the legal system. Let's frame it as a shared commitment to a constraint against knowingly punishing the innocent *within the functioning legal system*.
      *   *Claim 3 (Proportionality):* Punishment shouldn't exceed gravity of offense. (Retributivists: desert cap. Consequentialists: diminishing returns/cruelty causes backlash).
      *   *Claim 4 (Authority):* Only the state (or authorized body) can punish. Private vengeance is out.

  4.  **Drafting Section 2: The Disagreements Table:**
      *   Need to map the 5 specific cases to the core theoretical divides.
      *   *Case 1: Unlabelled Sanction.*
          *   Retributivist: Punishment *requires* censure/blame. Without it, it's just quarantine.
          *   Consequentialist: Hard treatment is what matters. Labeling is cost/inefficiency.
          *   Crux: Is condemnation constitutive of punishment?
          *   Prediction: Retributivists say it fails justice; Consequentialists say it succeeds utility.
      *   *Case 2: Consent Ledger.*
          *   Retributivist: Desert is non-waivable. You can't sell your right to be treated as a responsible agent.
          *   Consequentialist: If it reduces crime/bureaucracy costs, it's good.
          *   Crux: Is justice a duty or a commodity?
          *   Prediction: Retributivists say it degrades the system; Consequentialists say it lowers offense rates (price mechanism).
      *   *Case 3: Substitution.*
          *   Retributivist: Personal responsibility. Punishment is non-transferable.
          *   Consequentialist: If the volunteer suffers and the offender is deterred/rehabbed, utility is served.
          *   Crux: Who must suffer? The agent or the body?
          *   Prediction: Retributivists say it's a sham; Consequentialists say it maintains incapacitation.
      *   *Case 4: Sentence/Conviction Mismatch.*
          *   Retributivist: Truth in labeling. Conviction must match desert.
          *   Consequentialist: Outcome matters. If the sentence fits the risk/harm, the label is administrative.
          *   Crux: Integrity of the verdict vs. accuracy of the outcome.
          *   Prediction: Retributivists say it undermines legitimacy; Consequentialists say it increases compliance (fair outcomes).
      *   *Case 5: The Last Offender.*
          *   Retributivist: Still punish. Desert exists independently of consequences.
          *   Consequentialist: No point. No future benefit.
          *   Crux: Is punishment backward-looking or forward-looking?
          *   Prediction: Retributivists say punish; Consequentialists say release/warn.

  5.  **Drafting Section 3: The Verbal/Real Dispute Analysis:**
      *   The prompt asks to identify if the fight is about words (permissible vs. required vs. good).
      *   *Analysis:* Retributivists often fight amongst themselves here. "Weak" retributivism (permissible to punish if deserved) vs. "Strong" retributivism (obligatory to punish if deserved). Consequentialists usually see punishment as permissible *only if* useful.
      *   *The Real Fight:* It's not just verbal. It's about the *source of value*. Is the suffering of the guilty *good in itself* (Retributivism) or *bad in itself but necessary for tools* (Consequentialism)?
      *   *The Verbal Fight:* Whether "Punishment" *definitionally* includes "State Condemnation." If Retributivists define punishment as "Deserved Censure," the Unlabelled Sanction isn't punishment. If Consequentialists define it as "State-Imposed Hard Treatment," it is. This needs to be flagged clearly.

  6.  **Refining and Polishing:**
      *   *Tone Check:* Is it neutral? Yes. Does it avoid strawmanning? I need to make sure the Consequentialist position doesn't sound like "punish innocents if useful" (too caricatured) but rather "innocents protected by rule-utilitarian reasons."
      *   *Constraint Check:* No citations. Closed-book style.
      *   *Formatting:* Clear headers, numbered lists, table structure.
      *   *Specific Instruction:* "Recorded in advance... what each side predicts." Make sure predictions are distinct.

  7.  **Addressing the "Unlabelled Sanction" nuance:**
      *   The prompt asks: "Please say which [retributivism claim], and whether that fight is real or verbal."
      *   I need to explicitly address this in the analysis section. Is retributivism about suffering or communication?
      *   *Decision:* It's a substantive divide within retributivism that affects the agreement. I will frame it as a "Internal Retributivist Disagreement" noted in the analysis, but for the collaboration, the "Standard Retributivist" view usually demands censure. I will clarify this in the "Verbal vs. Real" section.

  8.  **Final Review against constraints:**
      *   Did I include all 5 cases? Yes.
      *   Is there a disagreements table? Yes.
      *   Are there agreed claims? Yes.
      *   Is there analysis on the verbal/real dispute? Yes.
      *   No citations? Yes.

  9.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Agreed Claims:* Make sure the "Innocent" claim is strong enough for Retributivists but acceptable to Consequentialists (e.g., "Systemic prohibition").
      *   *Table:* Ensure the "Crux" column identifies the philosophical root, not just the outcome.
      *   *Analysis:* Be sharp on the "Permissible vs. Required" distinction.

      *(Self-Correction during drafting)*: Wait, the prompt asks me to *draft the document*. It implies I am writing the text that the students will sign/submit. However, it also asks me to "say which [retributivism claim]... and whether that fight is real or verbal." This sounds like meta-commentary *within* the document or as an appendix. Given the "adversarial-collaboration" nature, this analysis should probably be a dedicated section *in* the document where the parties acknowledge where they think the other is confused. I will place it as a "Meta-Theoretical Clarification" section at the end.

      *Refining the "Innocent" agreement:* A thoroughgoing consequentialist cannot sign "It is intrinsically wrong to punish the innocent." They must sign "We agree to a rule that prohibits punishing the innocent." I will phrase it as a shared commitment to the *practice*, acknowledging different justifications.

      *Refining the "Unlabelled Sanction":* The prompt notes the Retributivist side might split. I should acknowledge this in the table or analysis. I'll put it in the analysis section as requested ("Please say which...").

      *Let's build the document.*

