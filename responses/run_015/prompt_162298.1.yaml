  1
  Aris kicked the salt crust off the steel grate. The Annex groaned in the wind, a hollow sound against the cold coast. Eli stood by the vat, hands in pockets, watching the pressure gauge twitch. Inside the glass, the fluid churned grey-green. A thin tube pulsed rhythmically, delivering a clear drop every four seconds into the mix. The vat was steel, riveted, stained with decades of condensation.
  "Logbook up to date?" Aris asked.
  "Nine hundred generations," Eli said. "Adapted to the cooling intake twice last winter."
  Aris nodded, clipping a flashlight to her belt. She peered into the viewport. The sludge shifted against the current, dense and active. She tapped the glass. Nothing reacted directly, but the density changed near the tap.
  "And the feed?"
  "Synthetic cofactor K-74. Without it, metabolism halts. Six hours to critical failure."
  Aris checked her watch. "Supply chain ended yesterday. This is the last bottle."
  Eli didn't look away from the vat. "There's enough in the line for now."
  The pump clicked, a mechanical heartbeat syncing with the drip. The room smelled of ozone and wet earth. Outside, gulls screamed over the breakwater. Eli touched the cold glass, leaving a smear of warmth.
  [This scene assumes metabolic activity and environmental responsiveness are observable markers of life, a consensus view in astrobiology.]

  2
  Aris spread the decommissioning checklist on the metal desk. The paper curled in the damp. At the top, bold text read: *Certify termination of self-sustaining chemical system capable of Darwinian evolution.*
  She tapped the first clause. "Self-sustaining."
  Eli slid the logbook over. Pages of handwritten notes detailed shell thickness changes, uptake efficiency, heat tolerance. "Darwinian evolution is checked. Look at generation four hundred. They shifted pH tolerance when the filter slipped."
  Aris traced the line to the vat. "It sustains itself only if we sustain the pump."
  "We breathe oxygen we didn't make," Eli said.
  "Oxygen is ambient. This," Aris pointed to the synthetic bottle, "is manufactured. Specific. Interruptible."
  She picked up a pen. The box for *System Active* remained empty. If she checked *System Inert*, the protocol required draining the vat. If she checked *Active*, the Annex remained classified as a biohazard zone indefinitely.
  Eli watched the pen hover. "The definition doesn't specify where the system ends."
  "The checklist does," Aris said, though she didn't write.
  The pump clicked again. The drip fell.
  [This scene highlights the contested "self-sustaining" clause of the NASA working definition, specifically regarding external dependency.]

  3
  They stepped outside for air. The wind bit through their jackets. A burn barrel sat near the edge of the concrete pad, rusted orange. Inside, driftwood smoldered.
  Aris picked up a piece of wood. She tossed it onto the embers. Flames licked up, bright and hungry, consuming the offering. The fire crackled, expanding until the new fuel charred.
  Eli watched the smoke rise. "Needs feeding."
  "Everything does," Aris said.
  She kicked sand over the edge of the barrel, containment ring intact. The fire didn't go out, but it shrank back to the core. She added another log. The flames surged again, dancing in the wind.
  Eli turned back to the building. "Cold out here."
  "Burns hot if you keep it fed," Aris said.
  They stood there a moment, watching the orange flicker against the grey sea. The heat washed over them, then vanished when the wind shifted. Aris brushed ash from her glove.
  [This scene invokes the fire analogy as a contested reading regarding the distinction between metabolism and agency.]

  4
  Back inside, Eli traced the tubing from the vat to the pump. The pump was bolted to the floor, wired into the Annex's main grid. He followed the wire into the wall conduit.
  "If the pump is part of the organism," Eli said, "it's self-sustaining."
  Aris traced the conduit the other way. "The grid comes from the shore. Shore is outside."
  Eli unclipped a panel. The wires merged with the building's infrastructure. The vat was embedded in the concrete foundation.
  "Where do you draw the line?"
  Aris looked at the ceiling, then the floor. "Where the funding stops."
  Eli put his hand on the pump casing. It vibrated. He moved his hand to the vat wall. It vibrated too. The resonance matched.
  He picked up a wrench. Tightened a bolt on the connection between the machine and the pipe. The drip steadyed.
  Aris watched him integrate the machine tighter into the loop.
  [This scene enacts the contested "system boundary" problem, questioning whether artifacts maintaining homeostasis are part of the organism.]

  5
  Aris held the pen over the *System Inert* box. Eli stood by the main breaker.
  "If I sign this," Aris said, "you drain it."
  "Protocol."
  "If I don't, you're running an unlicensed bioreactor."
  Eli looked at the vat. The grey-green swirl slowed slightly as the pump stuttered. He looked at the breaker. Cutting power killed the pump. Cutting the pump killed the strain. Keeping power kept the strain, but falsified the closure.
  Eli moved his hand to the breaker. He didn't flip it. He pulled the cofactor line instead, severing the tube. Fluid leaked onto the floor.
  "Machine stays," Eli said. "Strain goes."
  Aris checked *System Inert*. She didn't watch the vat.
  The pump continued to hum, pushing nothing. The sludge settled, darkening. The silence grew heavy between them, heavier than the wind outside. Aris exhaled slowly, the breath visible in the cold room.
  [This scene assumes regulatory classification determines ontological status, a contested pragmatic reading in philosophy of biology.]
