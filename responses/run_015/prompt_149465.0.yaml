      *   *Ben:* "Turn it to 11."
      *   *Aisha:* "Then it's not justice anymore, it's tyranny or algo-crunching."
      *   *Ben:* "That's just the 'human recognition' knob dropping."
      *   *Aisha:* "No, that's admitting the concept broke."

  6.  **Polishing:**
      *   Check constraints: Did Ben mention "similarity threshold"? Yes. Did Aisha use "justice" and "merit"? Yes. Is it casual? Yes.
      *   Check tone: Make sure Ben isn't dismissive, just committed to the model. Make sure Aisha isn't angry, just probing.
      *   Check length: Needs to be substantial enough for a seminar prompt but not a novella.

  7.  **Final Review against constraints:**
      *   "Locked knobs" vs "Extreme settings".
      *   Justice/Merit example included.
