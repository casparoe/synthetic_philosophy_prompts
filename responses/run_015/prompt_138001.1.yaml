answer: |-
  Before I address your six points, I want to map the conceptual space you are navigating. There are three candidate implicit theories doing the heavy lifting in both your industry and historiography, and distinguishing them is crucial for your stress-test.

  First, there is the **Hart-and-Honoré Common Sense Theory**, which distinguishes between *causes* (abnormal interventions) and *conditions* (stable background). On this view, oxygen is a condition for a fire, but a match is the cause; similarly, a river's existence is a condition, but a storm surge is the cause. This theory relies on a normative baseline of "normal functioning." Second, there is **Interventionism**, which defines causation by *counterfactual dependence under manipulation*: C causes E if, were we to intervene to change C, E would change. This fits your industry's models (change the hazard, change the loss) and the historian's interest (change the disease pool, change the colonial outcome). Third, there is a **Normative Risk-Allocation Theory**, which treats causation not as a metaphysical fact but as a policy tool for assigning liability to the "cheapest cost avoider" or the party best able to insure. What discriminates between these is how they handle *uncertainty* and *human intent*. If liability vanishes when an event is truly unpredictable, it's Hart-and-Honoré. If liability tracks the *ability to control* the variable regardless of intent, it's Interventionism. If liability tracks *who has the deepest pockets* regardless of control, it's Risk-Allocation. Your intuition that "nature is not an agent" is decoration suggests you suspect the third theory is the real engine, but I will argue it is a hybrid of the first and second that is currently breaking down under the weight of the Anthropocene.

  Here is the dissection of your practice.

  ### 1. Reconstructing the Implicit Theory
  The load-bearing machinery in the "act of God" doctrine is indeed the Hart-and-Honoré distinction between **causes and mere conditions**, but with a specific legal inflection known as *novus actus interveniens* (a new intervening act that breaks the chain of liability). The law presupposes a "normal course of things"—a stationary baseline of natural behavior. Within this baseline, human agents are expected to manage risk (build to code, buy insurance). When a natural event exceeds the statistical expectation of that baseline (the 1-in-100-year flood), it is categorized as an "abnormal intervention."

  This is not merely about physics; it is about *agency attribution*. The doctrine assumes that for liability to stick, there must be a *voluntary human action* or a *negligent omission* relative to a known standard. A flood is treated as a "mere condition" of the environment unless a human failed to manage it (e.g., broke a levee). Therefore, the "act of God" is a legal fiction that asserts: *This event belongs to the background conditions of the world, not the foreground actions of the defendant.* It load-bears the distinction between *misfortune* (which we insure against) and *wrongdoing* (which we litigate).

  ### 2. Presupposition vs. Decoration
  Your guess is largely correct but misses a crucial normative component. You suggest the metaphysics of "nature is not an agent" is decoration and that the practice needs only (a) a stable baseline and (b) an administrable rule to stop infinite regress.
  *   **Where you are right:** The practice does not require nature to literally lack agency; it requires nature to be *non-justiciable*. You cannot subpoena a hurricane. The "stable baseline" is the administrative necessity; without stationarity, you cannot price the premium or set the code.
  *   **Where your guess fails:** It is not purely a risk-allocation story. If it were pure risk allocation (e.g., "put the loss on the cheapest cost avoider"), we would see strict liability for natural perils where humans *could* have mitigated them, regardless of "acts of God." The "Act of God" defense is specifically an *exoneration of fault*. It preserves a moral distinction between *bad luck* and *bad acts*. If you remove the "nature is not an agent" decoration, you collapse the moral distinction between a lightning strike and an arsonist. The practice presupposes that humans are *responsibility-bearing agents* and nature is *responsibility-neutral stuff*. This is not just administrative; it is constitutive of the legal subject.

  ### 3. Philosophical Underdetermination
  The practice is underdetermined because three distinct theories of causation license the same outcome in standard cases, but diverge in hard cases.
  *   **But-For Causation (Actual Causation):** Defined as the relation where the outcome would not have occurred without the specific event. In a standard flood, the rain is a but-for cause of the damage, but the law ignores it because it is not *culpable*.
  *   **Probability-Raising:** Defined as the relation where the presence of a factor increases the likelihood of the outcome. Attribution science uses this (climate change made this storm 3x more likely).
  *   **Interventionism:** Defined as the relation where manipulating the cause changes the effect.

  *The Divergence:* In a standard "Act of God" case, all three agree: the storm caused the flood, but no human intervened, so no liability. In the **climate change hard case**, they diverge.
  *   *But-For* fails: No single emitter is a but-for cause of a specific flood (the flood would have happened anyway, perhaps with slightly different intensity).
  *   *Interventionism* struggles: We cannot intervene on the past emissions of a specific firm to change this specific storm.
  *   *Probability-Raising* succeeds: The emitter raised the probability of the hazard class.
  The legal practice is currently built on *But-For* and *Interventionism* (direct control). It is philosophically unprepared for *Probability-Raising* at scale, which is why climate litigation is so contentious.

  ### 4. Stress-Test: Agency on the Baseline
  This is the collapse point. Your industry faces **causation of the hazard distribution itself**. When emitters shift the hazard curve, they are exercising agency on the *background conditions* that the law treats as *given*.
  *   **The Problem:** The "abnormality" test relies on a stationary baseline. If humans move the baseline, "abnormal" becomes a moving target. A 1-in-100-year flood might become a 1-in-20-year flood due to emissions. Is it still an Act of God?
  *   **The Collapse:** If you stick to the old doctrine, you get **universal excuse** (no single emitter is the but-for cause, so no one pays). If you swing too far, you get **universal liability** (everyone who emitted is liable for every flood, which is economically incoherent).
  *   **The Fix:** The honest fix is indeed a shift from *Actual Causation* to **Probabilistic Risk Contribution**. This is similar to "market share liability" in toxic torts (where defendants pay according to their share of the harmful product market). You would need to assign an "attributable share" of the loss based on the Fraction of Attributable Risk (FAR) from attribution science.
  *   **The Cost:** This destroys the binary nature of legal liability (liable/not liable) and replaces it with a proportional tax on risk creation. It also shifts the epistemic burden: you can no longer prove *this* flood was caused by *that* defendant; you can only prove *this class* of floods is statistically elevated by *this class* of defendants. This creates massive uncertainty in pricing and reserving, as "causation" becomes a statistical confidence interval rather than a factual finding.

  ### 5. Historiography and Environmental Determinism
  The historian's rule for making a germ or volcano an "actor" is **Explanatory Salience via Counterfactual Dependence**. A factor is a cause if, *in the context of the narrative*, removing it changes the outcome significantly.
  *   **Epistemological vs. Political:** It is primarily epistemological (does this factor explain the variance?), but the *selection* of factors is political. A historian who says "smallpox destroyed the Aztecs" is not necessarily a determinist; they are highlighting a factor that was *exogenous to Aztec agency*.
  *   **The Peril of Determinism:** Environmental determinism is a sin not because it cites nature, but because it **erases human capacity to respond**. It implies the outcome was inevitable regardless of human choice.
  *   **The Test Case:** "The conquistadors destroyed them" vs. "Smallpox destroyed them." This is a false dichotomy. The correct causal model is **Conjunctive Causation**. The pathogen was the *mechanism*; the conquest was the *vector*. The pathogen's arrival was endogenous to the conquest (brought by the invaders). To separate them is to misunderstand the system. The historian's rule should be: *Invoke the non-human factor when it constrains the set of available human actions, but never when it renders human action irrelevant.* If the smallpox killed 90% of the population, it constrained the military response; it did not remove the political decision to invade.

  ### 6. Implications of an Endogenous Background
  If we replace the "nature as given" view with one where the background is endogenous (the Anthropocene view), three things must change:
  *   **In Doctrine:** The "Act of God" defense must be abolished or radically narrowed. It should be replaced by a **Strict Liability for Risk Creation**. If you engage in an activity that shifts the hazard baseline (carbon emissions, geoengineering), you are liable for the *incremental risk* you create, regardless of whether the specific event was "foreseeable" in the old stationary sense.
  *   **In Your Industry:** Pricing cannot assume stationarity. You cannot price a 1-in-100-year flood based on the last 100 years of data. You must model the *rate of change* of the baseline. This moves you from **Value at Risk (VaR)** based on historical distributions to **Forward-Looking Scenario Analysis**. You are no longer modelling "risk" (known probabilities); you are modelling "uncertainty" (unknown probabilities). This requires holding significantly more capital against "model risk."
  *   **In Historiography:** We must stop writing history as "Humans vs. Nature." We must write **Socio-Ecological History**. The "peril" you identified is the dualism itself. The diagnosis is that "environmental determinism" is a phantom enemy created by the false separation of human agency from ecological systems. The conquistadors *used* the ecology as a weapon; the ecology *acted* through the conquistadors.

  **Critique of your framing:** You ask if "nature is not an agent" is decoration. I suggest it is worse than decoration: it is a **category error**. In complex systems, "agency" is not a property of minds; it is a property of *feedback loops*. A virus has no mind, but it has *teleology* (replication) and *impact*. By insisting that only humans are agents, your industry and the law blind themselves to the causal power of the systems they are perturbing. The "Act of God" is a theological hangover that prevents you from seeing that in the Anthropocene, there are no acts of God, only acts of us.
