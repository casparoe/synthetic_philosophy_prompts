answer: |-
  Your draft principle is a strong start, particularly in identifying that the *source* of the dissent (new evidence vs. re-weighing) and the *structure* of the risk (reversibility) matter. However, as you noted, it struggles to distinguish Case 1 (Virology) from Case 4 (Whistleblowing), and it lacks a mechanism for handling evaluative disagreement (Case 6) versus empirical disagreement (Case 7).

  The core tension in your cases is not just about error correction, but about **epistemic authority** and **risk externalization**. The Unilateralist's Curse assumes a group of epistemic peers sharing both ends and risk exposure. Your cases show that when the group is conflicted, when the risk is borne by the agent, or when the consensus is based on a broken process, the curse loses its force.

  Below is a repaired principle, tested against your cases, followed by the implications for your thesis.

  ### The Principle of Epistemic Privilege and Risk Internalization

  An agent may act unilaterally against a negative consensus among agents who broadly share ends if and only if the following four conditions are met:

  1.  **Epistemic Privilege:** The agent's dissent rests on either:
      *   (a) **Private Evidence:** Information or reasoning inaccessible to the group; or
      *   (b) **Process Critique:** A concrete reason to believe the group's consensus relies on a systematically flawed framework or correlated error; or
      *   (c) **Conflicting Interests:** Evidence that the group's judgment is compromised by interests (e.g., institutional self-preservation) that diverge from the shared broad ends.
  2.  **Risk Internalization:** The expected costs of the action, conditional on the agent being wrong, are primarily borne by the agent or the consenting institution, rather than externalized to non-consenting third parties or the public.
  3.  **Mitigation and Reversibility:** The action is taken in the manner least likely to cause irreversible harm (e.g., gated release, temporary delay) consistent with achieving the objective.
  4.  **Procedural Exhaustion:** The agent has attempted to correct the group's view through the cheapest available means, unless doing so would render the action impossible or futile.

  *Note on Evaluative Disagreement:* If the disagreement is purely evaluative (weighting of shared values) rather than empirical or strategic, Condition 1 is not met unless the agent holds specific mandate/authority to redefine those weightings.

  ---

  ### Testing the Principle Against Your Cases

  | Case | Verdict | Principle Application |
  | :--- | :--- | :--- |
  | **1. Virology (Standard)** | **Don't Act** | Fails **Epistemic Privilege** (shared models); Fails **Risk Internalization** (public bears pandemic risk). |
  | **2. Virology (N=2)** | **Don't Act** | Fails **Epistemic Privilege** (the other lab is a competent peer who assessed and declined). The number of agents matters less than the *competence* of the dissenters. |
  | **3. AI Weights** | **Gated: Yes<br>Full: No** | **Full Release** fails **Risk Internalization** and **Mitigation** (irreversible). **Gated Release** passes **Mitigation** (allows correction). |
  | **4. Whistleblowing** | **Act** | Passes **Epistemic Privilege (c)** (Colleagues object on prudence/self-interest, not truth of dumping); Passes **Risk Internalization** (Agent bears career risk, not public). |
  | **5. Engineer Delay** | **Act** | Passes **Risk Internalization** (Cost is delay, borne by firm); Passes **Mitigation** (Reversible). The "Curse of Obstruction" is weak because the downside of error is low. |
  | **6. Programme Officer** | **Don't Act** | Fails **Epistemic Privilege** (Evaluative disagreement); Fails **Risk Internalization** (Costs externalized to beneficiaries of the original cause). |
  | **7. Broken Model** | **Weaker Presumption** | Passes **Epistemic Privilege (b)** (Correlated error). The consensus is epistemically worthless if the framework is broken. |
  | **8. Methodologist** | **Depends** | **Hard Evidence:** Passes **Epistemic Privilege (a)**. **Re-weighing:** Fails **Epistemic Privilege** (Evaluative/Strategic). |

  **Analysis of the Repair:**
  *   **Case 4 Resolution:** The principle distinguishes Case 1 and 4 via **Risk Internalization** and **Conflicting Interests**. In Case 1, the virologist risks the public's safety. In Case 4, the whistleblower risks her own career. The colleagues in Case 4 are not truth-tracking regarding the *moral necessity* of stopping the dumping; they are tracking the *costs to the firm*.
  *   **Case 6 Resolution:** The principle explicitly blocks purely evaluative unilateralism (redirecting funds based on moral view) because it violates the mandate of the shared ends.
  *   **Case 2 Resolution:** It clarifies that $N$ matters only insofar as it increases the probability of independent error. If the one other agent is a competent peer, $N=2$ functions like $N=100$.

  ---

  ### Application to New Cases

  **Case A: The Civil Servant**
  *A civil servant bypasses ministers to stop a policy she privately judges disastrous.*
  *   **Verdict:** **Don't Act (unless whistleblowing).**
  *   **Reasoning:** This fails **Risk Internalization** and **Epistemic Privilege**. In a democracy, the "shared ends" are determined by the ministers (political will). Unless the policy is *illegal* or involves *hidden empirical catastrophes* (Private Evidence), disagreeing on the *wisdom* of a policy is evaluative/strategic. If she has evidence the policy violates law or causes hidden harm, she may whistleblow (Case 4 logic), but she cannot unilaterally *stop* it (usurping authority).

  **Case B: The Ignored Researcher**
  *A researcher publishes dissenting reasoning, gets no engagement, and then acts anyway.*
  *   **Verdict:** **Permitted (with caveats).**
  *   **Reasoning:** This satisfies **Procedural Exhaustion**. If the group ignores the evidence, they are failing their epistemic duty. However, she must still satisfy **Risk Internalization**. If the act is high-stakes (Case 1), silence from the group does not authorize action; it only authorizes *louder warning*. If the act is low-stakes/reversible (Case 5), she may proceed.

  ---

  ### The Cost: Which Verdicts Must You Abandon?

  To maintain consistency with this principle, you may need to adjust two intuitions:

  1.  **Case 3 (AI Weights):** You wrote: *"I cannot tell whether I think the gated option is genuinely less unilateral... or merely the same act with a smaller variance."*
      *   **Thesis Requirement:** You must commit to the view that **gating changes the moral structure of the act.** It transforms an irreversible imposition of risk into a reversible experiment. If you view them as morally identical, the principle cannot save the "Gated: Yes" verdict. I recommend adopting the view that *reversibility is a distinct moral category*, as this aligns with precautionary principles in governance.
  2.  **Case 6 (Evaluative Dissent):** You wrote: *"The argument I started from... seems indifferent to whether the outlier judgement is factual or evaluative."*
      *   **Thesis Requirement:** You must argue that **evaluative disagreement is distinct from empirical disagreement** in the context of shared mandates. If agents share an organization, they share a *weighting function* (the mission). Unilaterally changing the weights is a breach of contract/mandate, whereas unilaterally correcting a factual error is a fulfillment of duty. If you insist that evaluative unilateralism is sometimes permissible, you must add a "Mandate" clause allowing it only for senior agents with decision-rights.

  ### Summary for the Chapter

  The standard Unilateralist's Curse relies on the assumption of **independent, symmetric error** among **epistemic peers** regarding **externalized risks**.

  Your chapter should argue that the curse dissolves when:
  1.  **Errors are Correlated:** (Case 7) The group is using a broken map.
  2.  **Peers are Compromised:** (Case 4) The group is protecting interests, not truth.
  3.  **Risks are Internalized:** (Case 5) The agent pays the price of being wrong.
  4.  **Actions are Reversible:** (Case 3) The act is a query, not a verdict.

  This allows you to preserve the intuition that we should be humble (Case 1) without paralyzing necessary dissent (Case 4, 5, 7).
