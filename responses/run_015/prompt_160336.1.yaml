answer: |-
  # Prep Sheet: Constructive Provability & Representation Independence

  **Goal:** Survive the Q&A without being corrected on consistency facts, while maintaining the philosophical thrust of your argument.
  **Time:** 30-min talk + 15-min Q&A.
  **Vibe:** You are proposing a *criterion* for computational content (representation independence), not just doing technical logic. Keep the high ground on semantics.

  ---

  ## 1. The Consistency Cheat Sheet (Memorize This)
  *Your shakiest area. Do not improvise here.*

  | Principle | Definition (Rough) | Consistent with CT? | Why? |
  | :--- | :--- | :--- | :--- |
  | **CT** (Church's Thesis) | All functions $\mathbb{N} \to \mathbb{N}$ are recursive. | **N/A** (It is CT) | The baseline for "Russian Constructivism" (RUSS). |
  | **WC-N** (Continuity) | All ops $\mathbb{N}^\mathbb{N} \to \mathbb{N}$ are continuous. | **YES** | Validated in Kleene's *Function Realizability* (1965). CT + WC-N is a consistent theory. |
  | **FT** (Fan Theorem) | Cantor space is compact (bars are uniform). | **NO** | **CRITICAL:** In recursive math, there exists a recursive bar with no uniform bound (Kleene's singular tree). CT $\vdash \neg$FT. |
  | **BI** (Bar Induction) | Induction over well-founded bars. | **NO** | BI implies FT. Since CT $\vdash \neg$FT, CT $\vdash \neg$BI. |

  **The Trap:** Do not lump "Continuity" and "Fan Theorem" together as "Brouwerian Principles that clash with CT." Only FT and BI clash. WC-N is compatible.
  **The Fix:** If asked, say: *"I am specifically targeting the compactness principles (FT/BI) that force uniformity where none is computable. The continuity principle is subtler, but FT is the dealbreaker for representation independence."*

  ---

  ## 2. Anticipated Objections (In Order of Likelihood)

  ### Q1: The Proof Theorist (The "Extraction Mechanism" Objection)
  **Phrasing:** "You're talking about extraction, but extraction depends on the realizability interpretation. In modified realizability, FT isn't realizable anyway. In function realizability, CT holds but FT fails. Aren't you just describing the difference between the *effective topos* and the *sheaf model for intuitionistic analysis*? Isn't this a known technicality rather than a philosophical problem?"

  *   **Concede:** "You're right that the models diverge. The technical landscape is well-mapped."
  *   **Hold:** "But the *normative* claim isn't. The community slogan is 'Intuitionistic Logic = Logic of Computation.' If the logic licenses proofs (via FT) that cannot be realized by extensional algorithms on reals, the slogan is misleading for analysts."
  *   **2-Min Reply:** "My point isn't that the models are inconsistent—they aren't. It's that when we sell constructive math to analysts as 'computational,' we imply the output depends on the *value* of the real. Brouwerian analysis, via FT, allows proofs where the algorithm depends on the *name* (the specific Cauchy sequence). That violates the analyst's notion of a function on reals. I'm arguing we should privilege the CT-compatible fragment if 'computation' is the selling point."
  *   **Soft Spot:** They know the topos theory better than you. Don't try to out-topos them. Stick to the "analyst's expectation of extensionality."

  ### Q2: The Classical Analyst (The "So What?" Objection)
  **Phrasing:** "I'm a classical analyst. I don't compute reals; I estimate them. If your constructive proof gives me an algorithm that works on Cauchy sequences, I can use that. Why do I care if it also reads the modulus? Isn't this a solution looking for a problem?"

  *   **Concede:** "For pure existence, maybe it doesn't matter."
  *   **Hold:** "It matters for compositionality and numerical stability. If I feed the output of your algorithm into another, and the first one relied on intensional details of the input name, the second one might break if I change the representation (e.g., from Cauchy to Dedekind)."
  *   **2-Min Reply:** "Imagine a library of constructive proofs. If Proof A extracts a functional that reads the modulus of convergence, and Proof B expects a Dedekind cut, they don't compose. Representation independence is the 'type safety' of constructive analysis. Brouwerian principles break that safety by allowing intensional queries. If we want a robust computational library, we need the fragment where CT holds, which forbids those intensional queries."
  *   **Soft Spot:** They might argue "Just fix the representation." Reply: "Then you've admitted the logic isn't representation-independent; *you* are doing the work the logic promised to do."

  ### Q3: The Philosopher (The "Logic vs. Axioms" Objection)
  **Phrasing:** "Are you attacking Intuitionistic *Logic* (Heyting Arithmetic) or Brouwer's *Axioms* (Analysis)? HA is compatible with CT. Isn't the problem just adding BI/FT, not the logic itself?"

  *   **Concede:** "Absolutely. Heyting Arithmetic (HA) is safe. This is about Intuitionistic *Analysis* (INT)."
  *   **Hold:** "But the 'Logic of Computation' slogan usually covers the whole intuitionistic package, including the analysis of the continuum."
  *   **2-Min Reply:** "I'm not attacking HA. I'm attacking the conflation of 'Constructive' with 'Brouwerian.' HA + CT is a perfectly good computational logic. The trouble starts when we add principles like the Fan Theorem to handle the continuum. My claim is that the 'Logic of Computation' should stop at the boundary where CT becomes inconsistent. That excludes the distinctive Brouwerian features of the continuum."
  *   **Soft Spot:** Don't let them pin you on "Is Intuitionistic Logic wrong?" Your answer is "No, HA is fine. INT is the problem."

  ### Q4: The Set Theorist (The "Model" Objection)
  **Phrasing:** "This sounds like you're saying the recursive reals are the 'true' reals. But in set theory, we have many models. Why privilege the recursive model (RUSS) over the sheaf model (INT)?"

  *   **Concede:** "I'm not making a metaphysical claim about the 'true' reals."
  *   **Hold:** "I'm making a pragmatic claim about the word 'computation'."
  *   **2-Min Reply:** "If 'computation' means 'what a Turing machine does,' then the recursive model is the only one that fits the definition. INT models 'lawless sequences' or 'choice sequences,' which are beautiful, but they aren't Turing-computable in the standard sense. If we want to sell this to computer scientists or numerical analysts, we shouldn't use a logic that validates principles (FT) false in the standard computational model."
  *   **Soft Spot:** Don't get dragged into Platonism. Keep it pragmatic: "Computation = Turing."

  ---

  ## 3. The "Hope Nobody Asks" Question
  **The Question:** "Isn't this just the distinction between Type-1 and Type-2 computability? In Computable Analysis (Weihrauch), we know that operations on reals are computable iff they are continuous. The Fan Theorem fails there too. Are you just reinventing the wheel of standard Computable Analysis?"

  *   **Why it hurts:** It reduces your philosophical thesis to a known technical fact in a subfield (Computable Analysis) that the analysts might respect more than logic. It makes your talk look like "I discovered Weihrauch degrees but didn't cite them."
  *   **The Defense:** "There is a strong overlap, yes. But the *logical* justification is different. Computable Analysis takes computability as a semantic constraint. I'm arguing about the *proof-theoretic* license. We have proofs in INT that are 'constructive' by logical standards but fail the Type-2 computability test. I want the logic to reflect the Type-2 constraint syntactically, which means dropping FT."
  *   **Backup:** "I'm happy to acknowledge the connection to Weihrauch. My point is that the *logic community* often ignores this when claiming intuitionistic logic is the logic of computation."

  ---

  ## 4. General Survival Tips

  1.  **If you blank on a consistency fact:** Pivot to the *consequence*. "The precise consistency strength is technical, but the semantic consequence is clear: FT implies a uniformity that recursive functionals cannot satisfy." (This is true even if you fuzz the derivation).
  2.  **If they attack "Representation Independence":** Define it simply. "If $x = y$ as reals, does $F(x) = F(y)$ as outputs? Brouwerian functionals can say 'no' because they see the sequence, not the limit."
  3.  **The "Bishop" Card:** If they say "Bishop constructive math (BISH) doesn't have this problem," agree! "Exactly. BISH is the sweet spot. It avoids FT and CT. My point is that INT (Brouwer/Heyting analysis) goes beyond BISH in a way that breaks computational invariance."
  4.  **Whiteboard Discipline:** Do not write down "CT + FT = Consistent" or vice versa unless you are 100% sure. Write "CT $\not\vdash$ FT" or "Incompatible in standard models."

  **Final Mindset:** You are not trying to prove INT is "false." You are arguing it is "oversold as computational." That is a sociological/normative claim, which is harder to falsify than a math claim. Stay on that turf.
