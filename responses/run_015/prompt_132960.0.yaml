answer: |-
  The film *Gattaca* does not merely depict a future where genetic enhancement exists; it dramatizes the collapse of the conceptual architecture required to distinguish therapy from enhancement. The standard bioethical distinction relies on a stable, pre-political baseline of "species-typical functioning." Therapy restores this baseline; enhancement exceeds it. *Gattaca* complicates this by presenting a society where the baseline itself has been genetically engineered. When the statistical norm is the product of selection and modification, "therapy" ceases to be a restoration of natural health and becomes a mandatory adherence to an optimized standard. The film exposes the "moving baseline" problem: if the population's genome is edited to eliminate heart disease or myopia, these conditions cease to be natural variations and are reclassified as defects. Consequently, the boundary between correcting a defect and enhancing a trait dissolves into a circular social convention. To be "healthy" in *Gattaca* is not to be free of pathology in a functional sense, but to be free of genetic risk according to an engineered metric.

  This collapse is most visceral in the medical screening scenes. Here, the film shifts the definition of disability from *incapacity* to *probability*. Vincent Freeman is not screened because he exhibits symptoms of heart failure; he is screened because his genome predicts a likelihood of failure. The medical apparatus does not treat a biological reality—Vincent is, in the moment of screening, fully capable of labor—but rather manages a bureaucratic risk. The film treats his condition simultaneously as a non-issue (he functions) and a disqualifying defect (he is uninsurable). This reveals that the therapy/enhancement distinction in this context is not medical but actuarial. The "therapy" applied to the population is prophylactic eugenics, designed to eliminate risk before birth. Vincent's natural conception is not a neutral alternative; it is framed as negligence. By presenting Vincent's heart condition as a social disqualification rather than a medical emergency, the narrative argues that the "defect" resides not in the biology of the individual, but in the rigidity of the normative baseline. The distinction between therapy and enhancement vanishes because the goal is no longer health, but optimality.

  The swimming competitions between Vincent and his brother Anton further destabilize the biological determinism underpinning the enhancement paradigm. Anton represents the "therapeutic" ideal: his genome has been corrected to remove weaknesses, theoretically granting him superior physical functioning. Vincent represents the natural baseline, complete with "defects." Standard bioethics might view Anton as the beneficiary of legitimate therapy (prevention of weakness) and Vincent as the victim of natural lottery. However, the narrative subverts this by having Vincent defeat Anton. Anton's reliance on his genetic superiority ("I never saved anything for the swim back") is contrasted with Vincent's reliance on will ("I never saved anything for the swim back").

  Crucially, the film does not present Vincent's victory as a denial of biology, but as a complication of it. Anton's engineered genome provides a high floor for performance, but it also creates a ceiling of expectation. Vincent's "defective" genome necessitates a mode of being that exceeds the engineered norm through effort. This exposes the flaw in the therapy/enhancement distinction: it assumes that restoring or optimizing function guarantees outcome. *Gattaca* suggests that "functioning" is not merely physiological capacity but includes the psychological drive to overcome limitation. If enhancement removes the need to struggle, does it inadvertently diminish the capacity for achievement? The film treats Vincent's condition as a disability only insofar as the society refuses to accommodate it; biologically, it is merely a deviation. The swimming scenes illustrate that the "enhanced" baseline is fragile when confronted with the "invalid" will, suggesting that the distinction between correcting a defect and enhancing a trait ignores the variable of human agency.

  The resolution of the film—Vincent piloting the mission to Titan—offers an ambivalent philosophical argument regarding the relevance of the genetic baseline. On one hand, Vincent's success suggests that the genetic baseline is irrelevant to human achievement; the "spirit" can transcend the "flesh." This would argue that the therapy/enhancement distinction is moot because neither guarantees success nor failure. However, the film undercuts this triumph by revealing that Vincent could not succeed as Vincent. He only reaches Titan by fabricating the persona of Jerome Morrow, a genetically enhanced individual. He does not dismantle the enhancement paradigm; he infiltrates it.

  This reinforces the power of the enhancement paradigm rather than refuting it. If Vincent had been accepted as a "valid" natural conception, the film would argue that the baseline is irrelevant. Instead, by requiring him to wear the mask of the enhanced, the narrative admits that the social structure built on the therapy/enhancement distinction is too rigid to be challenged by merit alone. Vincent succeeds not by proving genetics don't matter, but by proving that he can perform genetics better than the genetically optimized. This reinstates the enhancement paradigm: the "valid" genome is still the currency of entry. The "therapy" of genetic optimization is shown to be socially necessary for access, even if it is biologically unnecessary for the task. The film thus argues that while the biological distinction between therapy and enhancement may be porous, the social distinction is absolute.

  Ultimately, *Gattaca* adds a phenomenological dimension to the philosophical debate that a purely argumentative essay cannot supply. An essay can define the "moving baseline" abstractly, but the film embodies the anxiety of living within it. Through the visual language of the film—the obsessive cleaning of skin cells, the close-ups of urine tests, the contrast between the sleek, sterile architecture of Gattaca and the gritty reality of Vincent's preparation—the audience experiences the burden of the enhancement paradigm. We feel the weight of the "invalid" label not as a theoretical category, but as a physical constraint.

  Furthermore, the film dramatizes the tragedy of the "enhanced" individual through the character of Jerome. Jerome is the pinnacle of the therapeutic ideal—genetically perfect—yet he is psychologically broken and suicidal. An essay might argue that enhancement does not guarantee happiness, but the film shows the *cost* of the baseline. Jerome's paralysis is not genetic; it is existential. He is a victim of the very distinction that was meant to save him. By juxtaposing Vincent's vitality against Jerome's despair, the film suggests that the therapy/enhancement distinction fails to account for the human relationship to imperfection. The cinematic narrative forces the viewer to confront the emotional and social reality of a world where the line between curing a disease and engineering a citizen has been erased. It demonstrates that when the baseline moves, the goalposts of "normalcy" do not just shift; they harden into a cage that traps both the enhanced and the natural, rendering the distinction between therapy and enhancement not just biologically ambiguous, but ethically hollow.
