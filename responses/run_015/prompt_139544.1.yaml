      *Wait, one nuance:* The user asked about "Noise-swamping." I need to confirm if the "overwhelming majority" claim is technically accurate. In the space of all boolean functions on $n$ bits, most have high Kolmogorov complexity. Yes, most are incompressible. So the "average" is dominated by noise. This is a strong point for the user.

      *Symmetry:* The "Grue" problem. Goodman's New Riddle. NFL treats "Green" and "Grue" as just labels. But if the prior favors simple functions, Green wins. NFL assumes a uniform prior over *functions*, not *descriptions*. This is a key distinction.

      *Meta-level:* If I choose a bias based on past success, I am using induction to justify induction. Is this circular? Yes. Is it vicious? Pragmatists say no. NFL says at the meta-level, you still need a meta-bias. Where does it stop? Evolution/Physics.

