answer: |-
  There is no single established term that captures the specific *asymmetry* you have identified. You are describing a maneuver that sits at the intersection of economics, philosophy of action, and machine learning ethics, but existing concepts tend to describe only one side of the switch or the technical mechanism, not the strategic oscillation between them.

  Here is the landscape of existing ideas, where they fall short, and a proposed coinage to capture the phenomenon precisely.

  ### The Neighborhood: Existing Concepts and Their Shortfalls

  **1. Revealed Preference (Economics)**
  *   **The Idea:** Actions reveal preferences. If a user clicks X, they prefer X to Y.
  *   **The Shortfall:** This captures the "behavior is authoritative" side of your observation. However, standard revealed preference theory assumes consistency. It does not account for the *revocation* of this authority when the revealed preference is inconvenient. It lacks the mechanism for saying, "This action reveals a preference, except when it reveals a mistake."

  **2. Inverse Reinforcement Learning (IRL) Ambiguity**
  *   **The Idea:** In IRL, there is often no unique reward function that explains a behavior (the "degeneracy" problem). A behavior could stem from a specific goal, a mistaken belief, or a constraint.
  *   **The Shortfall:** This describes the *technical* underdetermination you noted (the "same stretch of conduct can usually be reproduced under more than one [explanation]"). However, IRL literature treats resolving this ambiguity as a mathematical or regularization problem (e.g., assuming maximum entropy). It does not name the *sociological* process where the resolution is chosen based on the builder's normative goals rather than statistical fit.

  **3. Adaptive Preferences (Philosophy/Development Economics)**
  *   **The Idea:** People adjust their desires to match their available options (e.g., "sour grapes").
  *   **The Shortfall:** This is often used by critics to argue that a person's stated preference is *not* authentic because it was shaped by oppression or limitation. In your scenario, the researchers are doing the inverse: they are claiming the *action* is inauthentic to preserve a "higher" preference (health). While related, "adaptive preferences" describes the formation of the desire, not the *interpretive maneuver* used to classify the desire post-hoc.

  **4. Performative Prediction (Machine Learning)**
  *   **The Idea:** A model's deployment changes the environment, generating data that confirms the model.
  *   **The Shortfall:** This captures the "circularity" you mentioned (people adapting to the interpretation). However, it describes the *feedback loop mechanism*, not the *epistemic justification* the builders use to explain the data. It explains why the data looks the way it does, not why the builders claim the data means what they want it to mean.

  **5. The Principle of Charity (Philosophy of Language/Action)**
  *   **The Idea:** When interpreting another's actions, assume they are rational and their beliefs are mostly true, to make sense of them.
  *   **The Shortfall:** This is the closest philosophical ancestor. Your researchers are applying a **biased** Principle of Charity. They are charitable to the *system's design* (assuming it offers good options) and uncharitable to the *user's rationality* (assuming they clicked wrongly), or vice versa, depending on the outcome. Existing philosophy assumes the Principle of Charity is applied consistently to facilitate understanding, not strategically to facilitate product narratives.

  ### The Coinage: Strategic Agency Attribution

  Since no existing term captures the two-sidedness—the selective granting and revoking of authority over what counts as a "true" preference—I propose the term **Strategic Agency Attribution**.

  **Definition:**
  **Strategic Agency Attribution** is the practice of resolving the underdetermination of human intent by selectively assigning authority over the definition of "preference."
  *   **Mode A (Validation):** When observed behavior aligns with the system's normative goals or performance metrics, the human is treated as a **sovereign agent**; their behavior is accepted as authoritative evidence of their true intent.
  *   **Mode B (Correction):** When observed behavior conflicts with the system's normative goals or performance metrics, the human is treated as a **noisy channel**; their behavior is attributed to error (confusion, weakness of will, bad beliefs), and their "true" intent is imputed by the system builder.

  The "strategic" element lies in the fact that the switch between Mode A and Mode B is determined not by independent evidence of the user's mental state, but by whether the attribution supports the builder's desired narrative about the system's value.

  ### Boundary Cases (What It Is Not)

  To ensure the term is usable in an argument, it must be distinguished from legitimate modeling practices that resemble it.

  **1. Consistent Paternalism (Not Strategic Agency Attribution)**
  *   **Scenario:** A safety system that *always* overrides user input when it detects a dangerous maneuver (e.g., automatic braking), explicitly stating that safety overrides user intent in all cases.
  *   **Reason:** The allocation of agency is constant. The system does not claim the user "really wanted" to brake when it works, and "really wanted" to crash when it doesn't. The hierarchy of values is fixed and declared upfront.

  **2. Standard Model Correction (Not Strategic Agency Attribution)**
  *   **Scenario:** A model infers a user wants to merge, but the user swerves away. The builder checks held-out data, sees the user consistently swerves away in that context, and updates the model to infer "avoid merge."
  *   **Reason:** The discrepancy is resolved using *new evidence* (held-out data), not normative convenience. The "truth" of the preference is sought through better prediction, not through redefining the user's rationality to fit a product story.

  **3. Explicit User Feedback (Not Strategic Agency Attribution)**
  *   **Scenario:** A user clicks a link, then immediately hits "back" and rates the result "irrelevant."
  *   **Reason:** The attribution of error ("that click was a mistake") is grounded in *additional signal* from the user, not inferred solely from the builder's normative framework.

  ### The Test: The Normative Inversion Test

  To distinguish **Strategic Agency Attribution** from ordinary, defensible model revision, apply the **Normative Inversion Test**.

  **The Procedure:**
  Take the specific behavioral pattern being interpreted (e.g., "repeatedly clicking sugary options"). Ask the builder to interpret the *exact same pattern* if it served the opposite normative end.

  *   **Case 1 (Current):** User clicks sugary options. Builder says: "They value taste over health / They are impulsive." (Agency revoked or redefined).
  *   **Case 2 (Inverted):** Imagine a system designed to maximize sugar consumption (e.g., a candy vendor's app). The user clicks sugary options. Does the builder now say: "This is authoritative evidence of their true desire for sugar"?

  **The Verdict:**
  *   If the builder treats the behavior as **authoritative** in the Candy Case but **corrupted** in the Health Case (without new evidence about the user's mental state), it is **Strategic Agency Attribution**.
  *   If the builder maintains a consistent theory of the user's rationality across both cases (e.g., "Users are always bounded rational maximizers"), it is **not** Strategic Agency Attribution, even if the model is wrong.

  ### Why This Carving Matters

  This term isolates the precise location where values enter the system without appearing in the code. In machine learning, we often look for bias in the *data* or the *loss function*. Strategic Agency Attribution shows that bias can reside in the **interpretive layer** that maps behavior to intent.

  It allows you to argue that the system is not merely "learning preferences," but **legislating** them. When the builder claims the user "really wanted" something other than what they did, they are not discovering a fact about the user; they are asserting a authority over the user's agency. By naming this **Strategic Agency Attribution**, you can pinpoint the moment the science of behavior becomes the politics of behavior.
