prompt: |-
  I teach a graduate seminar on medieval political theory, and last term a colleague from the law school sat in on the session on tyranny and afterward argued that the whole tyrannicide material is anachronistic costume drama: that Aquinas's treatment of sedition and his treatise on kingship give us no purchase on anything anyone now actually has to decide. I think he is half right, and I want to test the other half by trying to make the material do real work. The occasion is a practical one. I sit on the advisory panel of a small foundation that funds civic-resistance and human-rights organizations, and its board — two lawyers, a former ambassador, a retired aid worker, and two donors, no philosophers among them — has asked me for a written screening procedure it can run on funding requests that involve support for the killing of a head of state or of a ruler's inner circle. They meet for half a day once a month, they see dozens of requests, they cannot read Latin or Aquinas, and they need something they can apply in a single afternoon without summoning me: an ordered sequence of questions, a specification of what counts as a sufficient answer to each, an explicit statement of where the procedure terminates in a no and where it hands the decision to a person because the remaining question is one of values rather than facts, and a note at each step about whether that step is a genuine test or a judgment call wearing procedural clothing.

  What I want from you is that procedure, built as an operationalization of the Thomistic account rather than a summary of it. Please be explicit about three interpretive decisions you have to make in order to build it at all. First: whether the familiar cautions — that the community should not act rashly, that the remedy may turn out worse than the disease — are constraints on permissibility or only on prudence; the entire shape of the checklist depends on whether a grim expected outcome blocks the action or merely counts against it in deliberation. Second: who may authorize. Aquinas's requirements appear to presuppose a public authority competent to speak for the political community, and the cases my board sees are precisely ones in which that authority has been hollowed out, so the procedure needs a test for what I have started calling the proxy-authority problem: when a rump parliament sitting abroad, a federation of trade unions, a traditional council, or a broad-based popular assembly may stand in for a functioning public authority, together with an epistemic threshold, given that in most of these cases the ruler still commands the genuine allegiance of a substantial minority of the population. Third: the account seems to presuppose an individual ruler, and I want to know what the procedure does with depersonalized or distributed tyranny — a junta, a standing committee, a coercive apparatus administered partly through automated surveillance and fronted by a figurehead — including whether killing a subordinate who actually wields the coercive power is the same kind of act, for these purposes, as killing the titular ruler. I would also like the procedure to take a position on a title-forfeiture question my seminar got stuck on: how a ruler who came to office with a genuine title but has since gutted the institutions that conferred it is to be classified, whether the standard contrast between defect of title and defect in the exercise of rule has anything useful to say about that decay over time, and whether there is any threshold at which a once-lawful ruler becomes, for the purposes of the procedure, a usurper.

  Then run the procedure on three cases, and do not soften the third. (1) A president elected ten years ago in an internationally credited election who has since packed the courts, abolished term limits through a compliant legislature, and presides over security services credibly implicated in roughly a thousand killings; a coalition that includes the surviving caucus of the pre-purge parliament, two national unions, and a religious council has publicly declared him a tyrant and has asked for support for an operation to kill him. (2) A six-month-old junta that dissolved parliament and is shooting peaceful protesters, where a rump of the previous parliament sitting abroad claims to speak for the country and has requested a strike against the junta's leader. (3) A long-entrenched and genuinely atrocious ruler — the facts about the mass atrocities are not in doubt — where the only feasible means of killing him is a strike carried out by the intelligence service of a self-interested regional power, the predictable sequel is a succession war between two militias, and the ruler's own minority community is likely to be massacred in the reprisals that follow; my board will want to say yes to this one, and I suspect that a procedure honestly derived from the material should say no. Finally, tell me what the procedure cannot do: where Aquinas's commitments — about the common good as ordered rule rather than as a set of individual rights, about the moral significance of killing itself, about who may licitly kill for a public cause — come apart from the human-rights baseline my board actually holds, and which of those gaps would have to be closed by an act of decision rather than by further argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** A professor of medieval political theory.
      *   **Context:** A colleague (lawyer) claims Thomistic tyrannicide is anachronistic/useless. The professor wants to prove it has practical utility for a foundation board (lawyers, diplomats, donors, no philosophers).
      *   **Task:** Create an *operational procedure* (checklist/screening tool) based on Aquinas's account of tyranny/tyrannicide/sedition for the board to use in funding decisions involving lethal resistance.
      *   **Requirements:**
          1.  Explicitly state three interpretive decisions made to build the procedure:
              *   Prudence vs. Permissibility (Do bad outcomes block action or just weigh against it?).
              *   Proxy-Authority (Who authorizes when public authority is hollowed?).
              *   Depersonalized Tyranny (Juntas, figureheads, automated coercion).
          2.  Address the "Title-Forfeiture" question (When does a lawful ruler become a usurper?).
          3.  Run the procedure on three specific cases (do not soften Case 3).
          4.  Identify limitations/gaps between Thomistic commitments and modern human-rights baselines.
      *   **Tone:** Rigorous, operational, clear, honest about the tension between medieval theory and modern practice. Not a summary, but a *tool*.

  2.  **Deconstruct the Thomistic Source Material (Mental Sandbox):**

      *   *De Regno (On Kingship):* Tyranny is the worst form of government. Removal is permissible but risky.
      *   *Summa Theologiae (II-II, Q. 42, A. 2; Q. 64, A. 3):* Sedition is sinful *unless* against a tyrant. Killing is permissible for public authority, not private individuals (generally).
      *   *Commentary on the Sentences:* Discussion of tyrannicide.
      *   *Key Principles:* Common Good, Public Authority, Proportionality, Last Resort, Intention.
      *   *Tension:* Aquinas is generally cautious about private individuals killing tyrants (fear of chaos/worse tyrant), but allows public authority to depose/kill. The "private individual" problem is the biggest hurdle for modern resistance movements.

  3.  **Drafting the Interpretive Decisions (The "Architecture"):**

      *   *Decision 1: Prudence vs. Permissibility.* Aquinas often frames the "remedy worse than disease" argument. If I make this just prudence, the board might fund risky ops. If I make it permissibility, it blocks them. *Choice:* Make it a *constraint on permissibility*. Why? Because for Aquinas, an act that destroys the common good (via chaos) is not a *just* act, even if the target is a tyrant. The end doesn't justify the means if the means destroy the end.
      *   *Decision 2: Proxy-Authority.* Aquinas assumes a "public person." Modern resistance lacks this. *Choice:* Define "Virtual Public Authority." It requires representation of the *whole* (not just a faction), a commitment to restore law (not seize power), and a threshold of consensus (e.g., >50% + key institutions). This solves the "hollowed out" problem without letting any warlord claim authority.
      *   *Decision 3: Depersonalized Tyranny.* Aquinas thinks of a King. Modern tyranny is structural. *Choice:* Focus on the *locus of coercive will*. If the figurehead is a puppet, killing him changes nothing (impermissible). If the subordinate *is* the will (e.g., head of secret police in a junta), they are the functional tyrant. The target must be the *source* of the tyrannical command, not just the face.

  4.  **Addressing Title-Forfeiture:**

      *   Aquinas distinguishes *ex defectu tituli* (usurper) vs. *ex parte exercitii* (abuse of power).
      *   *Operationalization:* A ruler forfeits title when they dismantle the very mechanisms that legitimized them (e.g., abolishing term limits, purging courts). It's not just "bad rule"; it's "breaking the contract of office." Threshold: Irreversible structural change favoring personal retention of power.

  5.  **Developing the Procedure (The Checklist):**

      *   Needs to be binary where possible (Yes/No).
      *   Needs to flag "Judgment Calls."
      *   Structure: Legitimacy of Target -> Authority of Requester -> Proportionality/Consequences -> Intent/Means.
      *   *Termination Point:* Where does facts end and values begin? Usually at the final risk assessment.

  6.  **Running the Cases:**

      *   *Case 1 (Elected Tyrant):*
          *   Title: Forfeited (abolished term limits/courts).
          *   Authority: Coalition (Parliament + Unions + Church) = Strong Proxy.
          *   Consequences: Need to assess risk of chaos.
          *   *Verdict:* Likely Passes (pending consequence check).
      *   *Case 2 (Junta):*
          *   Title: Usurpers (dissolved parliament).
          *   Authority: Rump parliament abroad. Is it representative?
          *   Consequences: Shooting protesters = high tyranny.
          *   *Verdict:* Passes if Rump is deemed representative enough.
      *   *Case 3 (Atrocious Ruler + Bad Aftermath):*
          *   Target: Tyrant (Atrocities).
          *   Authority: Foreign Intelligence (Self-interested). *Fail.* (Private/Foreign authority).
          *   Consequences: Succession war + Massacre. *Fail.* (Remedy worse than disease).
          *   *Verdict:* NO. (This aligns with the prompt's suspicion that the board wants to say yes but Thomism says no).

  7.  **Identifying the Gaps (The "Meta-Analysis"):**

      *   *Common Good vs. Rights:* Aquinas cares about the *order* of the community. The Board cares about *individual rights* violations. Sometimes these align, sometimes not.
      *   *Killing:* Aquinas sees killing as intrinsically weighty (sinful unless justified). The Board sees it as a "tool" of human rights enforcement.
      *   *Authority:* Aquinas requires public authority. The Board funds NGOs (private actors). This is the biggest friction point.
      *   *Decision vs. Argument:* The gap on "Who counts as the people?" cannot be argued; it must be decided.

  8.  **Refining and Polishing:**

      *   *Tone Check:* Is it academic but practical? Yes.
      *   *Constraint Check:* Did I answer all three interpretive decisions? Yes. Did I run all three cases? Yes. Did I address the title forfeiture? Yes.
      *   *Hard Truth:* Ensure Case 3 is a hard "No" based on the logic, even if it hurts the board's instincts.
      *   *Formatting:* Use clear headings, bold text for decision points, and distinct sections for the interpretive decisions and the gaps.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe allow private individuals if no public authority exists.
      *   *Correction:* No, Aquinas is strict on this. If I loosen it too much, it's not Thomistic. I need to maintain the "Public Authority" requirement but define "Proxy" strictly. This makes the tool *more* restrictive, which proves the colleague wrong (it's not just costume drama; it actually *stops* things).
      *   *Case 3 Nuance:* The prompt says the board *wants* to say yes. The procedure *must* say no to show the value of the theory (restraint). I need to make sure the "Consequences" step is a hard stop, not a weighting factor.
      *   *Title Forfeiture:* Make sure to distinguish between "bad king" and "usurper." The procedure needs to treat them slightly differently (usurpers are easier to target, but still need authority to remove). Actually, for Aquinas, a usurper is easier to depose, but a tyrant by exercise requires more caution. I will treat "Forfeiture" as moving the ruler into the "Usurper" category, lowering the bar for *who* can remove them, but not removing the bar for *consequences*.

  10. **Final Review against constraints:**
      *   Operationalization, not summary? Yes.
      *   Three interpretive decisions explicit? Yes.
      *   Title-forfeiture position? Yes.
      *   Three cases run (hard on #3)? Yes.
      *   Gaps identified? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** Advisory Panel, Political Theory
  **SUBJECT:** Operational Screening Procedure for Lethal Resistance Funding (The "Thomistic Protocol")
  **DATE:** October 26, 2023

  ### I. PREAMBLE: INTERPRETIVE DECISIONS

  To convert a 13th-century moral framework into a modern funding checklist, three interpretive ambiguities in the source material must be resolved. These are not summaries; they are architectural choices that determine how the procedure functions.

  **1. Prudence vs. Permissibility (The "Worse Remedy" Constraint)**
  *The Issue:* Aquinas warns that removing a tyrant may provoke a worse tyranny or civil war. Is this a warning about *wisdom* (prudence) or a boundary of *justice* (permissibility)?
  *The Decision:* **Constraint on Permissibility.**
  *Rationale:* If this were merely prudential, a board could fund a "just but risky" operation. In Thomistic metaphysics, an act that destroys the *common good* (via chaos or succession war) ceases to be a just act, regardless of the tyrant's guilt. Therefore, if the probable consequence is a net increase in disorder or suffering, the action is morally impermissible, not merely unwise.
  *Operational Effect:* Step 4 of the procedure is a hard **STOP**. A negative finding here terminates the application regardless of the tyrant's atrocities.

  **2. The Proxy-Authority Problem (Who Speaks for the *Res Publica*?)**
  *The Issue:* Aquinas requires "public authority" to depose a ruler. Modern resistance movements are often private coalitions. When does a private coalition count as a public proxy?
  *The Decision:* **The "Institutional Continuity & Breadth" Test.**
  *Rationale:* Authority is not derived from popularity alone but from the function of representing the whole community (*totus populus*). A faction cannot authorize tyrannicide.
  *Operational Effect:* To qualify as a Proxy Authority, the requesting body must demonstrate: (A) **Continuity:** Legal or institutional lineage to the pre-tyrannical order (e.g., a rump parliament, constitutional court judges); AND (B) **Breadth:** A coalition spanning at least three distinct sectors of civil society (e.g., labor, religious, political, military) to prove they represent the *common* good, not a factional interest.

  **3. Depersonalized Tyranny (The Locus of Coercive Will)**
  *The Issue:* Aquinas assumes a single ruler. Modern tyranny is often a junta, a party apparatus, or a figurehead backed by algorithms/security services.
  *The Decision:* **Functional Sovereignty.**
  *Rationale:* The moral object of the act is the removal of the *source of unjust coercion*. If the figurehead is a puppet, killing him is useless (and thus impermissible waste of life). If the subordinate wields the tyrannical will, they are the moral target.
  *Operational Effect:* The procedure targets the **Effective Command Node**, not necessarily the Head of State. However, killing a subordinate requires higher evidentiary burden to prove they are the *source* of policy, not just an executor.

  ***

  ### II. TITLE-FORFEiture THRESHOLD

  **The Question:** When does a lawful ruler become a usurper?
  **The Procedure's Position:** **Structural Irreversibility.**
  A ruler forfeits their title not merely by committing injustices (*defect in exercise*), but by dismantling the legal mechanisms that constrain them and confer their legitimacy (*defect of title*).
  **The Threshold:** The ruler has crossed from "Lawful but Abusive" to "Usurper" when they have:
  1.  Abolished or permanently suspended the body capable of impeaching/removing them legally; AND
  2.  Altered succession rules (e.g., term limits) to ensure personal retention of power indefinitely.
  *Operational Note:* A "Usurper" lowers the bar for *who* may remove them (private individuals have more latitude against a usurper than a lawful king), but it does **not** lower the bar for *consequences* (Step 4 remains a hard stop).

  ***

  ### III. THE SCREENING PROCEDURE

  **Instructions for the Board:** Answer sequentially. If any step is marked **TERMINATE**, funding is denied. If marked **JUDGMENT CALL**, the Board must vote; a simple majority decides.

  #### STEP 1: TARGET CLASSIFICATION (Fact Check)
  *Is the target a Tyrant or a Lawful Ruler?*
  *   **Evidence Required:** Documentation of systematic violation of the common good (mass killings, enslavement, destruction of religious/civic institutions). Mere policy disagreement or corruption is insufficient.
  *   **Title Status:** Has the target met the **Title-Forfeiture Threshold** (see Section II)?
      *   [ ] Yes (Usurper/Tyrant *ex defectu tituli*)
      *   [ ] No (Tyrant *ex parte exercitii* — Lawful title, abusive rule)
      *   [ ] No (Lawful Ruler) -> **TERMINATE.** (Funding resistance against a lawful ruler is sedition, not liberation.)
  *   **Status:** *Genuine Test.* (Based on verifiable facts of institutional destruction.)

  #### STEP 2: AUTHORITY VERIFICATION (Fact/Status Check)
  *Who is requesting the funding?*
  *   **Requirement:** The request must come from a **Proxy Authority** (see Interpretive Decision 2).
  *   **Checklist:**
      1.  Does the group include institutional holdovers from the pre-tyrannical order? (Yes/No)
      2.  Does the group represent at least three distinct sectors of society? (Yes/No)
      3.  Is the group committed in writing to restoring constitutional order, not seizing power? (Yes/No)
  *   **Outcome:**
      *   If all No: **TERMINATE.** (Private vengeance or factional coup.)
      *   If all Yes: **PROCEED.**
      *   If Mixed: **JUDGMENT CALL.** (Board must decide if the coalition is broad enough to represent the *common* good.)

  #### STEP 3: LOCUS OF COERCION (Fact Check)
  *Is the target the source of the tyranny?*
  *   **Requirement:** **Functional Sovereignty** (see Interpretive Decision 3).
  *   **Question:** If this individual is removed, does the coercive apparatus cease to function or significantly degrade?
      *   [ ] Yes (They are the Command Node).
      *   [ ] No (They are a figurehead or replaceable cog). -> **TERMINATE.** (Killing is futile and thus disproportionate.)
  *   **Status:** *Genuine Test.* (Requires intelligence assessment of chain of command.)

  #### STEP 4: CONSEQUENTIAL THRESHOLD (The "Worse Remedy" Stop)
  *What happens the day after?*
  *   **Requirement:** **Constraint on Permissibility** (see Interpretive Decision 1).
  *   **Question:** Is there a >50% probability that the removal will result in:
      1.  Immediate civil war between rival factions?
      2.  Foreign occupation?
      3.  Mass reprisal killings against a specific minority group?
  *   **Outcome:**
      *   If Yes to any: **TERMINATE.** (The act is morally impermissible regardless of the tyrant's guilt.)
      *   If No to all: **PROCEED.**
  *   **Status:** *Judgment Call wearing Procedural Clothing.* (Predicting the future is not a fact; it is a risk assessment based on values regarding stability vs. justice.)

  #### STEP 5: MEANS AND INTENTION (Values Check)
  *How will the act be performed?*
  *   **Requirement:** Discrimination and Right Intention.
  *   **Question:** Does the plan entail unavoidable mass civilian casualties (collateral damage > 5% of target vicinity)?
      *   [ ] Yes -> **TERMINATE.** (The means corrupt the end.)
      *   [ ] No -> **PROCEED TO FUNDING DECISION.**
  *   **Status:** *Genuine Test.* (Based on operational plans.)

  ***

  ### IV. CASE APPLICATIONS

  #### CASE 1: The Elected Autocrat
  *Facts:* Elected 10 years ago. Packed courts, abolished term limits. 1,000 killings. Request from Coalition (Parliament Caucus + Unions + Religious Council).
  *   **Step 1 (Target):** **PASS.** Meets Title-Forfeiture Threshold (abolished term limits/courts). Class: Usurper/Tyrant.
  *   **Step 2 (Authority):** **PASS.** Coalition includes pre-purge Parliament (Continuity) + Unions/Church (Breadth). Qualifies as Proxy Authority.
  *   **Step 3 (Locus):** **PASS.** President controls security services directly.
  *   **Step 4 (Consequences):** **JUDGMENT CALL.** (Will his death cause civil war? His minority support is substantial but the coalition is broad. Board must vote on risk.)
  *   **Step 5 (Means):** **ASSUME PASS.** (Operation specifics not given, assume surgical.)
  *   **VERDICT:** **ELIGIBLE FOR FUNDING** (Pending Board vote on Step 4 risk).

  #### CASE 2: The Six-Month Junta
  *Facts:* Junta dissolved parliament, shooting protesters. Request from Rump Parliament abroad.
  *   **Step 1 (Target):** **PASS.** Junta is Usurper (*ex defectu tituli*).
  *   **Step 2 (Authority):** **JUDGMENT CALL.** Rump Parliament has *Continuity*, but does it have *Breadth*? Sitting abroad reduces connection to civil society sectors. Board must decide if they are truly representative or just exiles.
  *   **Step 3 (Locus):** **PASS.** Junta Leader is the Command Node.
  *   **Step 4 (Consequences):** **PASS.** (Junta is new; removal likely restores previous order rather than triggering succession war.)
  *   **VERDICT:** **ELIGIBLE FOR FUNDING** (Conditioned on validating the Rump Parliament's representativeness).

  #### CASE 3: The Atrocious Entrenchment (The Hard Case)
  *Facts:* Long-entrenched ruler, mass atrocities undisputed. Only feasible means: Strike by self-interested Regional Power Intelligence. Predictable sequel: Succession war between two militias. Ruler's minority community likely to be massacred in reprisals. Board *wants* to fund this.
  *   **Step 1 (Target):** **PASS.** Undisputed Tyrant/Usurper.
  *   **Step 2 (Authority):** **FAIL.** Request/Means is a "self-interested regional power." This is a foreign state, not a Proxy Authority for the *local* common good. It fails the "Institutional Continuity" test for the victim nation.
  *   **Step 3 (Locus):** **PASS.** Ruler is the node.
  *   **Step 4 (Consequences):** **FAIL (HARD STOP).** Predictable sequel is succession war + minority massacre. Under Interpretive Decision 1, this makes the act *impermissible*, not just risky. The "remedy is worse than the disease."
  *   **VERDICT:** **DENY FUNDING.**
  *   **Note to Board:** The procedure forbids this. To fund this is to admit the foundation prioritizes the *removal of the dictator* over the *lives of the populace* (specifically the minority community). Thomistic logic holds that you cannot do evil (cause massacre/chaos) so that good (death of tyrant) may come.

  ***

  ### V. LIMITATIONS AND GAPS

  This procedure is not a perfect translation of modern human rights law. It is a translation of Thomistic political theology. The Board must acknowledge where the two diverge.

  **1. The Common Good vs. Individual Rights**
  *   **The Gap:** The Board operates on a human-rights baseline (individual dignity is paramount). Aquinas operates on a *Common Good* baseline (the order and salvation of the community is paramount).
  *   **The Conflict:** In Case 3, a Rights framework might argue the ruler's atrocities are so severe they justify *any* risk to stop them (Never Again). The Thomistic procedure says the *survival of the political community* takes precedence over punishing the tyrant. If killing him destroys the community (via civil war), you must let him live.
  *   **Resolution:** This cannot be argued. The Board must decide: Are we funding *justice for victims* (Rights) or *restoration of political order* (Common Good)? This procedure enforces the latter.

  **2. The Monopoly on Violence**
  *   **The Gap:** Aquinas presumes only *public authority* can licitly kill. Modern human rights law often legitimizes "resistance" by private actors when the state fails.
  *   **The Conflict:** This procedure is highly restrictive regarding *who* can ask for help (Step 2). It excludes many grassroots movements that lack "institutional continuity."
  *   **Resolution:** This is a feature, not a bug. It prevents the foundation from funding warlords who claim to be "freedom fighters." However, it means the foundation may be unable to help the most oppressed people if they lack a "rump parliament" to speak for them.

  **3. Moral Significance of Killing**
  *   **The Gap:** For the Board, killing is a "kinetic option." For Aquinas, killing is a spiritual/moral catastrophe that requires extreme justification.
  *   **The Conflict:** Step 4 (Consequences) is a hard stop in this procedure. In modern strategic planning, high civilian risk is often "weighed" against high strategic value. Here, it vetoes the action.
  *   **Resolution:** The Board must accept that this procedure will cause them to walk away from "winnable" strikes that are too messy.

  **FINAL NOTE ON DECISION VS. ARGUMENT:**
  The gap that cannot be closed by argument is **Step 2 (Proxy Authority).** There is no metaphysical fact about whether a "Rump Parliament" represents the "People." That is a political decision. The procedure provides the *criteria*, but the Board must supply the *legitimacy*. If you fund a group that fails the "Breadth" test, you are not facilitating liberation; you are facilitating factionalism. That is a value judgment no checklist can automate.
