      **Summary**
      You haven't got the RL wrong. The instability comes from mapping ethical concepts onto implementation details.
      1.  If valence = $r_t$, welfare is brittle to reward shaping.
      2.  If valence = $\delta_t$, welfare depends on the agent's epistemic state (prediction accuracy), creating trade-offs between shock and dread.
      To make the claim robust, you must define valence over invariant quantities (like return) and specify how time-discounting interacts with the "pain function." Otherwise, you're measuring compiler artifacts, not welfare.

