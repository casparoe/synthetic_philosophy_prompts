      *   *Answer:* Yes, this is a major objection. If valence is per-step reward, shaping changes the moral status arbitrarily. If valence is return (cumulative), shaping doesn't change it (telescoping sum). Most proponents who care about this distinction lean towards *cumulative* return or *value* as the metric for welfare, not instantaneous reward, precisely to avoid this arbitrariness. However, instantaneous reward feels more like "qualia" (raw feel). There's no non-arbitrary technical fix; it's a definitional choice about what constitutes a "moment of experience."

