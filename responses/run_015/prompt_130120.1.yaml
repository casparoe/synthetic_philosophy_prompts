  ***

  ### The "Double-Entry" Culture Quiz

  **Q1: The Translation Layer**
  Imagine a society where everyone believes hoarding cash is a sin, but they have no banking system—just mattresses and safe boxes. Can this culture still accumulate capital for big projects?

  *   **A) No.** Beliefs are useless without a mechanism (like banks, laws, or accounting) to translate them into action. *(Go to Q2A)*
  *   **B) Yes.** If the belief is strong enough, people will find a way; the institution is secondary to the will. *(Go to Q2B)*

  **Q2A: The Weber Audit (For "No" voters)**
  Okay, you think you need a mechanism. When Weber wrote about Protestants and capitalism, was he pointing at the *tools* they built (legal codes, double-entry bookkeeping), or did he just credit the *spirit* alone?

  *   **A) He pointed at the tools.** He understood that values need institutional wiring to become economically efficient. -> **Leaf 1**
  *   **B) He credited the spirit.** He assumed values flow straight into behavior, mistaking institutional design for cultural magic. -> **Leaf 2**

  **Q2B: The Direct Flow (For "Yes" voters)**
  Okay, you think culture works directly. In Weber's story, did religious values *create* the economic system, or did the new economic system just *create* the values to justify itself?

  *   **A) Values created the system.** The ethic came first and forced the economy to change. -> **Leaf 3**
  *   **B) The system created the values.** The ethic is just a story we tell after getting rich. -> **Leaf 4**

  ***

  ### The Leaves

  **Leaf 1: The Institutional Mechanic**
  *   **Position:** Translation-Layer View.
  *   **Awkward Commitment:** You have to argue that culture only matters when it turns into boring paperwork.

  **Leaf 2: The Accidental Sociologist**
  *   **Position:** Weber Confused Correlation with Design.
  *   **Awkward Commitment:** You have to claim the most famous theory in sociology is basically a mistake about accounting rules.

  **Leaf 3: The Mystic Engineer**
  *   **Position:** Strong Cultural Causation.
  *   **Awkward Commitment:** You have to explain why holy men didn't build capitalism centuries earlier.

  **Leaf 4: The Cynical Materialist**
  *   **Position:** Materialist Reduction.
  *   **Awkward Commitment:** You have to admit ideas are just exhaust fumes from the engine of money.

  ***

  **Note on Indistinguishable Leaves:**
  honesty check: **Leaf 2 (Accidental Sociologist)** and **Leaf 4 (Cynical Materialist)** are hard to seperate in practice. both end up saying "institutions/material conditions drive the bus, values are just paint." the tree tries to seperate them based on whether the reader thinks Weber *tried* to talk about institutions, but most readers wont care about weber's intent—they just care about the outcome. might need to merge these in the final piece if the distinction feels too academic.

