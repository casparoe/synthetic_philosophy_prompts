answer: |-
  Right, first off, that is a profound situation your flatmate's family is navigating. It's rare to have a live case of Molyneux's Problem walking about the house, and it's understandable you want to grasp the theoretical stakes properly. You're right to be wary of the Wikipedia summaries; they tend to flatten the tension between the philosophy and the messy clinical reality.

  You're asking for the *desiderata* — the specification list — for a theory that doesn't just say "vision failed then worked," but explains the *structure* of that transition. Below is the spec. I've broken it down by requirement, flagged the status (whether it's hard data or philosophical preference), and highlighted the tensions.

  ### The Desiderata for a Theory of Post-Restorative Cross-Modal Recognition

  **1. The Immediate Dissociation Condition**
  *   **The Requirement:** The theory must explain why, at the moment of restorative onset, visual data does not automatically trigger the object concepts already established by touch. It must account for the 'no' answer to the classic Molyneux question.
  *   **Status:** **[Non-negotiable]**
  *   **The Case:** This is the empirical baseline. Across modern restorative cases (whether cataract removal or gene therapy), immediate cross-modal identification fails. A theory that predicts immediate recognition is falsified by the data.
  *   **The Trap:** A theory cannot simply posit "no innate ideas" and stop there. It must explain *why* the visual manifold doesn't map to the haptic manifold, even if both are representing the same physical object.

  **2. The Modal Inertia Constraint (Haptic Dominance)**
  *   **The Requirement:** The theory must account for the period wherein touch continues to override vision for object verification, even after visual acuity improves. You called this 'modal inertia'; in psychophysics, this relates to sensory re-weighting.
  *   **Status:** **[Non-negotiable]**
  *   **The Case:** In typical development, vision becomes the dominant sense early on. In restored sight, this hierarchy is inverted for months. The patient trusts the hand over the eye. A adequate theory must explain why the brain assigns higher reliability weights to the newly restored, noisy visual channel's predecessor (touch) for such a prolonged period.
  *   **The Trap:** Many theories assume vision is 'privileged'. This case proves vision's dominance is learned or calibrated, not hardwired.

  **3. The Affective/Qualitative Mapping Condition**
  *   **The Requirement:** The theory must accommodate cross-modal mappings that are not geometric. Specifically, it must handle valence or texture mismatches (e.g., the sphere feels 'friendly/smooth' but looks 'sharp/hostile').
  *   **Status:** **[Camp Preference / High Risk]**
  *   **The Case:** This is where it gets sticky. A strict functionalist theory of recognition might say "only shape matters for identification." However, if the patient reports an affective clash, a complete theory of *perception* (not just identification) needs to explain how emotional valence is bound to sensory modes.
  *   **The Trap:** Empiricists might argue affect is learned association. Nativists might argue threat detection (sharpness) is innate. If the boy says it looks sharp but feels friendly, you have a conflict between innate visual threat detectors and learned haptic safety. A theory ignoring this is incomplete phenomenologically, but a theory demanding it might be asking for too much from a cognitive model.

  **4. The Non-Trivial Learning Mechanism**
  *   **The Requirement:** The theory must specify the *mechanism* of the bridge-building between senses, not merely state that "association learning occurred." It must define what is being associated (features? objects? temporal synchrony?).
  *   **Status:** **[Non-negotiable]**
  *   **The Case:** Saying "the brain learned" is a placeholder, not an explanation. It's the homunculus fallacy dressed up as neuroscience. The theory must specify the currency of the exchange. Is it statistical correlation over time? Is it motor feedback (reaching while looking)?
  *   **The Trap:** This is the hardest part. If you specify the mechanism too tightly (e.g., "only motor feedback"), you risk falsification if a patient learns without moving. If too loose, you're back to hand-waving.

  **5. The Unity of Object Condition**
  *   **The Requirement:** The theory must explain how two distinct sensory streams (the visual patch of colour, the haptic pressure) become recognised as a single enduring entity.
  *   **Status:** **[Non-negotiable]**
  *   **The Case:** This is the core metaphysical problem. Before restoration, the boy has a world of sounds and touches. After, he has a world of sights. The theory must explain the merger into a single 'world'.
  *   **The Trap:** Some theories suggest we never truly unify them, we just learn they co-occur. A robust theory should aim for genuine integration, not just correlation.

  ---

  ### Joint Unsatisfiability and Tensions

  You mentioned a hunch about the tension between explaining immediate failure and eventual success. You are correct. Here is where the spec runs into logical friction:

  **1. The "Latent Structure" Tension**
  *   **The Conflict:** To explain **Immediate Failure (Req 1)**, you generally need to argue there is *no* innate connection between sight and touch (Empiricist view). To explain **Rapid/Structured Success (Req 4)** without trivial "learning" hand-waves, you often need to posit *some* innate structure or constraint that guides the learning (Rationalist/Nativist view).
  *   **Why it's tense:** If there is zero innate connection, the learning problem is vast (the "blank slate" problem). How does the brain know *which* visual squiggles match *which* tactile shapes without an innate guide? If there *is* an innate guide, why did it fail immediately at onset?
  *   **Verdict:** These are not strictly unsatisfiable, but they force the theory into a narrow middle ground: "Latent structures exist but require visual calibration to activate." This is a specific, risky commitment.

  **2. The Affective vs. Geometric Tension**
  *   **The Conflict:** If you accept **Affective Mapping (Req 3)** as essential, you risk clashing with **Modal Inertia (Req 2)**.
  *   **Why it's tense:** Modal inertia suggests the haptic system is the 'truth' standard for months. But affective visual processing (e.g., seeing 'sharpness' as threatening) is often subcortical and fast (innate). If the boy sees 'sharp' (innate visual threat) but feels 'friendly' (learned haptic safety), which system wins? A theory that prioritises haptic inertia must explain why visual affect doesn't override it, or vice versa.
  *   **Verdict:** Potentially unsatisfiable if the theory demands a single hierarchy of sensory dominance. The theory may need to allow for parallel processing streams (one for geometry, one for affect) that operate on different timelines.

  ---

  ### Where My Reasoning is Shakiest

  I need to be honest with you: **Requirement 3 (Affective/Qualitative Mapping)** is the weak link in this spec.

  Here is why: We are dealing with a sample size of one (your flatmate's brother) regarding the "friendly vs. sharp" comment. It is entirely possible that this is idiosyncratic to his personality or specific neural wiring, rather than a universal feature of restored sight.

  **What would change my mind:**
  If a cohort study of post-restorative patients showed that affective mappings were random or non-existent (e.g., some say spheres look friendly, some say hostile, with no pattern), then including this as a *necessary desideratum* for a general theory would be a category error. It would move from "essential feature of perception" to "individual psychological response."

  Currently, I am treating it as essential because if perception is truly embodied, the *value* of an object (can I hold this? will it hurt?) should be tied to its shape across modes. If a theory explains shape recognition but ignores why the shape *matters* to the agent, it's a theory of geometry, not perception. However, I am less certain about this than I am about the geometric failure.

  **The "Learning" Hand-wave**
  Regarding your hunch on the learning mechanism: The shakiest part of *any* theory here is defining the "currency" of learning. Is it time? Is it movement?
  *   **Finding that would change my mind:** If it were proven that patients can learn cross-modal mapping *without* motor feedback (i.e., passive viewing and passive touching simultaneously), it would kill any theory reliant on "active exploration" or "sensorimotor contingency." Currently, many philosophers lean heavily on the idea that we learn to see by learning to move. If passive correlation suffices, that whole camp collapses.

  ### Summary for your understanding

  If you are evaluating a theory (or reading one), check it against this list:
  1.  Does it explain why he couldn't do it on day one? (Must say yes).
  2.  Does it explain why his hand still overrules his eye? (Must say yes).
  3.  Does it treat "friendly/sharp" as noise or data? (Ideally data, but be wary if they ignore it).
  4.  Does it explain *how* the link is made, or just say "learning"? (If the latter, discard it).

  The tension you sensed is real: the theory must walk the tightrope between "nothing is innate" (to explain the failure) and "something guides the learning" (to explain the success). Most modern accounts try to solve this by saying the *capacity* to link is innate, but the *content* of the link is learned. Whether that satisfies you philosophically is another matter.

  Hope this helps you navigate the literature without getting bogged down in the jargon. It's a fascinating position to be in, witnessing the resolution of a 300-year-old debate firsthand.
