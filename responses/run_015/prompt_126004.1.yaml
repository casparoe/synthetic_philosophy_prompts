  **MEMORANDUM**

  **TO:** Internal Seed-Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Double-Blind Review Protocol

  Team,

  We're deadlocked, and Thursday's vote is approaching. The Provost's office is pushing for open peer review to align with open-science norms, while half of us are hesitant to dismantle a protocol established in 1983 without knowing exactly why it was built. The files explaining the original rationale were destroyed in the 90s archives flood, leaving us with a rule but no reason.

  This memo outlines my recommendation to break the deadlock. It attempts to honor the philosophical concerns raised by the status quo faction while moving us toward the transparency the administration wants.

  ### 1. Mapping the Fence
  To clarify our debate, we need to map Chesterton's Fence to our specific situation:
  *   **The Fence:** The double-blind review protocol (reviewers don't know applicants; applicants don't know reviewers).
  *   **The Unknown Builder:** The 1983 Committee. They built this immediately following a documented nepotism scandal. Even though their specific memos are gone, their intent was clearly risk mitigation against bias.
  *   **The Person Tearing It Down:** Us (the current Committee), acting on the Provost's directive to modernize toward open science.

  ### 2. The Burkean Case and Epistemic Scaffolding
  I want to take the argument for keeping the rule seriously. This isn't just nostalgia; it's about institutional epistemology.

  There is a concept called **epistemic scaffolding**. The idea is that rules function as support structures for people who don't have access to the original reasoning or the "view from the top." The 1983 double-blind rule acts as scaffolding that supports impartiality without requiring every reviewer to be perfectly virtuous. It protects junior faculty from subtle coercion and protects senior faculty from accusations of favoritism.

  Even though we lost the files explaining *why* the fence was built, the fence itself has been holding up the building for 40 years. Burke argues that institutions hold wisdom that outruns any single generation's reasoning. The 1983 committee understood a specific human vulnerability—nepotism—that we might be underestimating in our zeal for transparency. If we tear down the scaffolding before we know if the building can stand on its own, we risk a collapse that looks exactly like the 1983 scandal.

  ### 3. The Strongest Argument on the Losing Side
  My recommendation below involves changing the protocol, which means the argument for maintaining the status quo exactly as is will not prevail. However, that argument is powerful and needs to be recorded.

  The strongest case against changing this rule is that **transparency does not equal fairness.** The Provost argues that open review aligns with modern science, but open review also exposes power dynamics. If a junior faculty member knows a senior department chair is reviewing their seed grant, they may self-censor or feel pressured to collaborate unnaturally. The 1983 scandal wasn't an anomaly; it was a baseline human tendency. The Burkean side argues that without the blindfold, we aren't removing bias; we are just making bias public. If we remove the double-blind protocol, we lose the "safe space" for honest critique, and we risk returning to a system where funding follows friendship rather than merit. This argument suggests that the "scaffolding" isn't obsolete; it's load-bearing.

  ### 4. Recommendation: Approve with Conditions
  We cannot ignore the Provost forever, but we cannot ignore Chesterton either. We don't know why the fence was built, but we suspect it's holding up a roof. Therefore, we should not tear it down permanently until we test the structure.

  I recommend we **approve the switch to open review, but only as a time-limited pilot with specific safeguards.** We replace the old scaffolding (anonymity) with new scaffolding (audit trails and disclosure).

  **Specific Conditions:**
  1.  **Pilot Duration:** The open review protocol will run for two academic cycles (AY2025 and AY2026).
  2.  **Disclosure Log:** All reviewers must sign a conflict-of-interest disclosure that is archived internally, even if not public.
  3.  **Climate Survey:** All applicants (funded and unfunded) must complete an anonymous survey regarding perceived bias or pressure during the review process.
  4.  **Sunset Clause:** If the Committee votes in May 2026 that the risk of bias has increased, the double-blind protocol automatically reinstates.

  ### 5. Timeline
  *   **November 2023:** Committee votes on this conditional approval.
  *   **January 2025:** Pilot program launches for Spring Seed Grants.
  *   **December 2025:** Interim review of conflict-of-interest disclosures.
  *   **May 2026:** Final Committee vote based on climate survey data to either make open review permanent or revert to double-blind.

  ### Bottom Line
  We are respecting the Builder's intent (preventing nepotism) while testing the Teardown (open science). We are treating the rule as epistemic scaffolding that can be swapped out, but only if we prove the new structure holds weight.

  Verdict: approve with conditions
