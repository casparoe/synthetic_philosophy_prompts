answer: |-
  Your distinction between *contingent* and *structural* limitations is a strong intuitive starting point, but if you build your paper on it without modification, you will run into a technical wall that undermines your philosophical conclusion. The wall is this: computational complexity is asymptotic, but agents are finite.

  An NP-hard problem is not "impossible" for a finite agent; it is merely "expensive" as input size scales toward infinity. A polynomial-time problem is not "easy"; an $O(n^{100})$ algorithm is structurally tractable but physically impossible for any agent in our universe. Therefore, your distinction cannot rest solely on complexity classes (P vs. NP) or resource scaling (more time/memory). It must rest on the **specification of the task**.

  Here is the shape of the argument you need, anchored by a single worked example, which we will then use to diagnose the two seminar cases you mentioned.

  ### The Worked Example: Propositional Belief Consistency

  Suppose we model an agent's doxastic state as a set of propositional sentences. A standard normative requirement is **Consistency**: the agent ought not to hold contradictory beliefs. To verify this, the agent (or a theorist modeling the agent) must determine whether a set of sentences $\Sigma$ is satisfiable. This is the SAT problem. SAT is NP-complete.

  #### 1. Testing Your Distinction (Contingent vs. Structural)
  You defined *contingent* limitations as those removable by more resources (time, memory, parallelism) and *structural* ones as those where cost outruns any plausible scaling.

  *   **The Trap:** If we treat SAT as the task, it looks structural. No amount of parallel processing turns exponential worst-case growth into polynomial growth (assuming $P \neq NP$).
  *   **The Correction:** However, for any *actual* finite agent, the input size $n$ is bounded. There is a constant $C$ representing the maximum number of beliefs a human can physically store. For $n \leq C$, SAT is $O(1)$. It is technically solvable by lookup table.
  *   **The Philosophical Load:** Hardness results only become load-bearing if we assume the agent faces an **open-ended** task environment. If the agent is finite and the world is finite, *all* limitations are contingent (you just need a big enough lookup table). Hardness results constrain **ideal agents** or **general-purpose systems** that must handle arbitrary input sizes.
  *   **Verdict:** Your distinction holds only if you are discussing *types* of agents (ideal vs. finite) rather than specific tokens. For an ideal agent, SAT is structurally hard. For a human, it is contingent *unless* the complexity grows faster than our biological scaling allows.

  #### 2. Addressing Worry 1: Worst-Case vs. Average-Case
  You noted that hardness is a worst-case claim, but reality might only present easy instances.

  *   **In the Example:** SAT is NP-complete in the worst case. However, random k-SAT instances undergo a "phase transition." When the ratio of clauses to variables is low or high, instances are easy; they are hard only in a narrow critical region.
  *   **The Philosophical Load:** If a cognitive theory posits that the mind solves SAT, and a critic says "But SAT is intractable," the defender replies: "The environment doesn't give us worst-case instances."
  *   **The Catch:** This reply shifts the explanatory burden. It is no longer enough to show the agent has a SAT-solver. The theory must now explain **why the environment is benevolent**. If the environment is structured such that hard instances rarely arise, that structure itself requires explanation (e.g., evolutionary pressure, physical laws).
  *   **Verdict:** A hardness result is philosophically load-bearing only if coupled with a claim about the **distribution of inputs**. If the theory ignores the input distribution, the hardness result is biographical (about the algorithm's worst-case performance) rather than metaphysical (about the task's nature).

  #### 3. Addressing Worry 2: The Approximation Dodge
  You worried that theorists replace the hard task with a nearby easy one (e.g., satisfying *most* beliefs rather than *all*).

  *   **In the Example:** We replace SAT with MAX-SAT (find an assignment satisfying the maximum number of clauses). MAX-SAT is also NP-hard, but there are approximation algorithms that guarantee satisfying a certain fraction of clauses in polynomial time.
  *   **The Philosophical Load:** Is this a sleight of hand? It depends on the **normative status of the original task**.
      *   If Consistency is a *constitutive norm* of belief (you literally cannot believe contradictions), then approximation fails. An agent that tolerates contradictions isn't a believer; it's a broken system.
      *   If Consistency is a *regulative ideal* (you should aim for truth, but survival matters more), then approximation is valid.
  *   **Verdict:** The "approximation dodge" is legitimate only if the original specification was normatively inflated. Hardness results force you to choose: either the norm is too strong for any computational agent (so the norm is wrong), or the agent isn't actually solving that problem (so the cognitive theory is wrong).

  ---

  ### Applying This to Your Seminar Cases

  Now, take the insights from the SAT example and apply them to the two cases you are discussing.

  #### Case 1: Cognitive Science Adequacy
  *The Objection:* If a mental capacity (e.g., vision, parsing) requires solving an intractable problem, the computational theory is empirically inadequate.
  *The Reply:* Real systems use heuristics and meet only structured instances.

  **Diagnosis:**
  Using the SAT model, we see that the objection relies on the **Structural** claim (the task *type* is hard), while the reply relies on the **Average-Case** claim (the task *tokens* are easy).
  *   **Where the distinction breaks down:** The debate often stalls because the two sides are specifying the task differently. The critic specifies the task as "Solve General SAT." The defender specifies it as "Solve SAT instances generated by natural images."
  *   **How to make it load-bearing:** A hardness result does genuine work here only if it forces a revision of the **computational level description** (in Marr's sense). If the only way to make the theory tractable is to change the *goal* of the computation (e.g., from "recover the exact 3D structure" to "recover a useful sketch"), then the hardness result has told us something about the mind: it is not optimizing for truth, but for utility.
  *   **Your Argument:** Don't just say "heuristics save us." Ask: *What does the reliance on heuristics imply about the goal of the system?* If hardness forces the system to approximate, the system is not a "truth-seeker" in the classical sense. That is a philosophical conclusion about the nature of cognition, derived from complexity.

  #### Case 2: Normative Rationality ("Ought Implies Can")
  *The Objection:* Norms like full Bayesian updating over unbounded hypotheses are intractable; therefore, they violate "ought implies can."
  *The Reply:* Normative theories are allowed to idealize.

  **Diagnosis:**
  This maps to the **Approximation Dodge**.
  *   **The Contingent/Structural Check:** Is Bayesian updating hard contingently (we need faster chips) or structurally (the space of hypotheses grows exponentially)? It is structurally hard relative to the hypothesis space size.
  *   **The "Idealization" Defense:** In physics, we idealize frictionless planes. Does this work for rationality?
      *   In physics, the idealization describes a limit the system *approaches* under specific conditions.
      *   In rationality, if the ideal is computationally unreachable *even asymptotically* (or requires resources exceeding the universe), it is not a limit the agent can approach. It is a different category entirely.
  *   **How to make it load-bearing:** A hardness result constrains normative theory if it shows that the "ideal" is not just unreachable but **incoherent for a computational being**. If rationality is defined as maximizing expected utility, and doing so is NP-hard, then "rationality" as defined is impossible for any physical agent.
  *   **Your Argument:** The distinction you drew helps here. If the limitation is *contingent*, the norm stands (we ought to be faster). If *structural*, the norm must change. The "idealization" reply fails if the ideal is structurally inaccessible. You can argue that **computational hardness redefines the space of possible norms**. We cannot ought to do what is structurally impossible, even for an ideal agent, if that agent is computational.

  ### The Shape of Your Argument

  Here is the blueprint for your paper. Do not start with the literature. Start with the specification.

  1.  **Thesis:** Computational hardness results are philosophically load-bearing not because they describe physical limits (which are contingent), but because they constrain the **specification of cognitive and normative tasks**. They force us to choose between changing our model of the mind or changing our norms of rationality.
  2.  **Step 1: Refine the Distinction.** Argue that "Contingent vs. Structural" is insufficient. Replace it with **"Implementation Limits vs. Specification Limits."**
      *   Implementation: We run out of RAM. (Biographical)
      *   Specification: The task *as defined* scales super-polynomially. (Philosophical)
      *   *Crucial Move:* Hardness results only matter if the specification is fixed. If you change the spec to make it tractable, you have changed the subject.
  3.  **Step 2: The Input Distribution Condition.** Address your first worry. Argue that a hardness result applies to an agent only if the agent's environment generates inputs from a distribution that overlaps with the hard region of the problem space. If the environment is "easy," the hardness result is biographical to the algorithm, not the agent.
  4.  **Step 3: The Normative Cost of Approximation.** Address your second worry. Argue that moving to approximation is not a free pass. It requires a justification of why the approximate norm is sufficient. This is where the philosophy happens: moving from "Rationality = Truth" to "Rationality = Adaptive Fit."
  5.  **Step 4: Apply to Cases.**
      *   Show how Case 1 (Cognitive Science) often hides a change in specification (e.g., from "parsing" to "guessing").
      *   Show how Case 2 (Norms) often hides a change in the definition of "Can" (from "physically possible" to "computationally feasible").
  6.  **Conclusion:** Hardness results tell us about the world only insofar as they reveal that certain descriptions of rationality or cognition are **computationally ill-formed** for beings like us. They don't tell us we are slow; they tell us that some of our philosophical ideals are mathematically incoherent for computational systems.

  ### Where Your Distinction Might Break Down

  You asked me to be willing to tell you if the distinction is wrong. It is not wrong, but it is **unstable** without the notion of *task specification*.

  Consider this: You define *structural* as "no amount of more-of-the-same helps." But in complexity theory, we often trade time for space, or sequential steps for parallelism. If you allow quantum computation, BQP might solve problems BPP cannot. Is a limitation structural if it vanishes with a change in *hardware architecture* (classical vs. quantum)?

  If you stick strictly to "more time/memory," you are assuming a specific computational model (Turing Machine). If the mind is not a Turing Machine (e.g., it's an oracle, or a hypercomputer, or essentially analog), then NP-hardness is biographical to the *model*, not the *agent*.

  **Recommendation:** Add a caveat. Your argument holds *conditional on computationalism*. If you assume the mind is a digital computer, then structural hardness is real. If you leave open the possibility of non-classical computation, hardness results are merely constraints on *classical models* of the mind. This is a vital philosophical distinction: are we proving limits on *agents*, or limits on *our models of agents*?

  ### Summary for Your Paper

  *   **Don't** argue that hardness proves humans are limited.
  *   **Do** argue that hardness proves certain *definitions* of rationality/cognition are untenable.
  *   **The Load-Bearing Condition:** A hardness result does philosophical work when it forces a revision of the **norm** or the **task description**, not just the resource allocation.
  *   **The Approximation Dodge:** It is legitimate only if accompanied by a normative argument that the approximate goal is what we actually value (e.g., survival over consistency).
  *   **The Worst-Case Worry:** It is resolved by analyzing the **ecology of the task**. Hardness is a property of the problem *and* the environment together.

  This structure moves you away from "computers are slow" (biographical) to "this concept of rationality is incoherent" (philosophical). That is where the genuine work lies.
