prompt: |-
  I am a retired physicist who has only recently begun working through philosophy of science and technology ethics, and I find myself stuck on a conceptual knot that sits right at the boundary between empirical measurement and normative commitment. You should act as a professional philosopher of artificial intelligence and formal ethics, with particular competence in conceptual analysis and the philosophy of value. Before composing your response, please think step-by-step: first, brainstorm at least three distinct ways in which a purely structural, informational, or physical criterion for "side effect" necessarily fails to remain value-neutral—consider specifically (1) the problem of selecting a non-arbitrary baseline state against which "disturbance" is measured, (2) the frame problem as it applies to any finite list of protected variables in an open system, and (3) the distinction between reversible and irreversible state changes, and whether reversibility can be defined without prior normative weighting of which states are worth preserving. Then, having laid out those tensions, write a sustained satirical parody in the deadpan style of an international technical standard—specifically, a draft ISO-style specification document provisionally titled "ISO/DIS 27001-S: Requirements for Side-Effect-Free Operation of Low-Impact Autonomous Agents." The document must attempt to operationalize "avoid side effects" using exclusively physical, informational, or structural metrics—entropy budgets, state-space deviation thresholds, reversibility coefficients, and observer-independent disturbance protocols—while rigorously avoiding any explicit axiological framework. The satire should arise from internal contradiction: each numbered clause, definition, or measurement protocol should quietly smuggle in normative judgments about what counts as damage, improvement, or "normal" conditions, with exception footnotes and appendix tables revealing that the authors have implicitly adopted a full specification of value while maintaining formal neutrality. Include at least one "Appendix B: Quantitative Harm Assessment Protocol" that tries to calculate harm without defining good, and a "Scope and Applicability" section that collapses upon inspection. Keep the tone bureaucratically serious and deadpan—no ironic winking, no direct authorial commentary—so that a specialist in AI alignment recognizes the parody as conceptually fair rather than caricature. Aim for approximately 700 words, formatted with standard technical-document sections, and ensure the target remains the practice of seeking value-neutral impact measures, not any named individual or institution.
