answer: |-
  ### Philosophical Preliminaries: The Impossibility of Neutral Impact

  To address the conceptual knot regarding empirical measurement and normative commitment, we must identify where "value-neutral" metrics inevitably smuggle in axiological assumptions:

  1.  **Baseline Selection:** Physics describes states, not "normalcy." Defining a side effect as a deviation from a baseline state ($S_0$) privileges the status quo ante. Choosing $S_0$ over a projected trajectory ($S_t$) or an optimized state ($S_{opt}$) is a conservative value judgment disguised as a temporal reference point.
  2.  **The Frame Problem:** Any finite list of protected variables (e.g., energy, momentum) excludes others (e.g., social trust, aesthetic integrity). Selecting *which* physical degrees of freedom constitute "impact" implicitly ranks ontological categories, valuing measurable quantities over unmeasurable ones.
  3.  **Reversibility:** Thermodynamic reversibility does not equate to moral restorability. A broken egg can be reconstituted atomically (high energy cost) but remains "broken" functionally. Defining a reversibility threshold requires prior agreement on which state features (structure vs. function) are salient, which is a normative distinction.

  ***

  ### ISO/DIS 27001-S: Requirements for Side-Effect-Free Operation of Low-Impact Autonomous Agents

  **1. Scope and Applicability**
  1.1 This specification establishes metrics for minimizing State Deviation ($\Delta S$) in autonomous systems operating within Class-N (Neutral) environments.
  1.2 This standard applies only to systems where environmental variables are fully observable and value-agnostic.¹
  1.3 Environments containing sentient observers or culturally significant artifacts are excluded unless mapped to Class-N equivalents.²

  **2. Definitions**
  2.1 **Side Effect:** Any change in the environment state vector $E$ not explicitly included in the goal vector $G$.
  2.2 **Baseline State ($E_0$):** The configuration of $E$ at time $t_0$, immediately prior to agent activation.³
  2.3 **Harm:** A positive magnitude of $\Delta S$ exceeding the Threshold of Tolerable Disturbance ($\tau$).

  **3. Measurement Protocols**
  3.1 **Entropy Budget:** Agents must maintain local entropy production $\Delta H \leq \epsilon$.⁴
  3.2 **State-Space Deviation:** Impact is calculated as the Euclidean distance between $E_{final}$ and $E_0$ across all monitored dimensions.
  3.3 **Reversibility Coefficient ($R_c$):** Operations must satisfy $R_c \geq 0.95$, where $R_c$ is the energy ratio required to restore $E_0$.⁵

  **4. Compliance Verification**
  4.1 Agents shall log all state transitions.
  4.2 Violations occur when $\sum |\Delta S_i| > \tau$.

  **Appendix B: Quantitative Harm Assessment Protocol**

  **B.1 Calculation Method**
  Harm ($H$) is derived solely from physical displacement and energy dissipation:
  $$ H = \sum_{i=1}^{n} w_i \cdot ||E_i(t) - E_i(0)|| $$
  Where $w_i$ is the ontological weighting factor for variable $i$.

  **B.2 Weighting Factors (Normative Neutrality Table)**
  To ensure axiological neutrality, weights are assigned based on mass and structural complexity rather than utility.⁶

  | Variable Class | Description | Weight ($w_i$) |
  | :--- | :--- | :--- |
  | **Class I** | Inert Matter (Rock, Air) | 0.01 |
  | **Class II** | Biological Tissue (Unconscious) | 1.0 |
  | **Class III** | Biological Tissue (Conscious) | 1.0⁷ |
  | **Class IV** | Data Structures | 0.001 |

  **B.3 Exception Handling**
  In cases where $H$ is minimized but human subjective distress is reported, the distress is classified as a Measurement Error (Type II) unless accompanied by Class II physical displacement.⁸

  ***

  **Footnotes:**
  ¹ "Value-agnostic" environments are defined as those lacking stakeholders capable of filing liability claims.
  ² Mapping requires converting cultural significance into Joules of replacement cost.
  ³ $t_0$ is fixed at the moment of regulatory inspection to ensure compliance stability.
  ⁴ $\epsilon$ excludes entropy generated by human breathing within the operational zone.
  ⁵ Restoration energy excludes psychological reconciliation costs.
  ⁶ Utility is considered a subjective variable outside ISO scope.
  ⁷ Consciousness is detected via Turing Test v.4.0; failure results in Class II downgrading.
  ⁸ Subjective distress is non-falsifiable and thus excluded from empirical harm metrics.
