      *   *Weakness 2 (Rule-Circularity):* Claiming rule-circularity is benign because rules aren't truth-apt is risky. If rules aren't truth-apt, how do they justify anything? Justification usually implies giving reasons. If the reason is "we use the rule to justify the rule," that looks like bootstrapping. Why is *this* bootstrapping okay but "P, therefore P" not okay?
      *   *Weakness 3 (Transcendental Argument):* "The Tortoise must use MP to argue against MP." The Tortoise can reply, "I'm not arguing, I'm just stating conditionals." Wren needs to explain why the Tortoise's *challenge* counts as a speech act that presupposes normativity.
      *   *Weakness 4 (Zeno Symmetry):* If the regress hits induction/ampliative inference too, does that solve the problem for deduction? Or does it mean *no* inference is rational? If she says "rules are benignly circular for deduction," does she think inductive rules are also benignly circular? If so, skepticism looms. If not, why the asymmetry?
      *   *Weakness 5 ("Just is what inferring is"):* This is a quietist stopper. To pierce it, we need to imagine alternative practices. If a community treats $A, A \to B \vdash \neg B$ as valid, are they "inferring"? If yes, logic is arbitrary. If no, what constrains them?
      *   *Weakness 6 (Falsifiability):* Hard-line rule views often retreat to conceptual truths. If it's conceptual, what counts as evidence against it?

  3.  **Drafting the Questions (Iterative Process):**

