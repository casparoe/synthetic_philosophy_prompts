      *   *Q4 (The "Benign" Claim):* Deepen the circularity issue.
          *   *Draft:* Isn't it bootstrapping?
          *   *Refinement:* If I define a rule "Assert everything," and justify it by asserting everything, is that benign?
          *   *Follow-up:* She'll distinguish valid rules. Push on who decides validity.

      *   *Q5 (Transcendental/Tortoise):* The Tortoise's stance.
          *   *Draft:* Doesn't the Tortoise use MP?
          *   *Refinement:* What if the Tortoise says he's only uttering, not asserting? Does your argument collapse?
          *   *Follow-up:* She'll say challenging implies commitment. Push on the nature of that commitment.

      *   *Q6 (Zeno Symmetry):* The ampliative inference point.
          *   *Draft:* What about induction?
          *   *Refinement:* If the regress hits induction, does that save deduction or doom both?
          *   *Follow-up:* She'll say both are rule-governed. Push on whether skeptical consequences follow.

      *   *Q7 (Symmetry Backfire):* The specific requirement to test if symmetry cuts the other way.
