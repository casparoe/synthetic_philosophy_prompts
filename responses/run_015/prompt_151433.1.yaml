  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: THE FREGE DIARY DISPUTE**

  **PARTICIPANTS:** The Compartmentalist Camp and The Structural Continuist Camp
  **SUBJECT:** The relationship between Gottlob Frege's published philosophical system and his late-life political diary.

  ### I. AGREED CLAIMS

  Both camps endorse the following factual and philosophical premises as the foundation for this dispute:

  1.  **The Semantic Doctrine:** Frege's published philosophy establishes a distinction between *sense* (Sinn) and *reference* (Bedeutung). Sense is the mode of presentation through which a reference is given; reference is the object itself. Frege maintains that thoughts (Gedanken) are objective, mind-independent entities that are grasped by thinkers but do not originate in individual psychology (anti-psychologism).
  2.  **The Diary's Existence and Content:** Frege kept a private political diary during the last years of his life (roughly 1924–1925). This document contains explicit nationalist, monarchist, and anti-Semitic assertions, including claims about the negative influence of Jewish people on German culture and politics.
  3.  **Absence from Published Work:** These specific political and ethnic views do not appear in Frege's published logical or philosophical writings (e.g., *Begriffsschrift*, "On Sense and Reference," *Grundgesetze*). The published works focus on logic, mathematics, and language without explicit reference to these political commitments.
  4.  **Moral Consensus:** Both camps agree that the anti-Semitic and nationalist views expressed in the diary are morally reprehensible and factually unfounded. Both camps agree that Frege's contributions to logic and the philosophy of language remain historically significant, regardless of the outcome of this specific dispute.
  5.  **Interpretive Principle:** Both camps agree that interpreting a philosopher's work requires a careful reading of the texts, but they disagree on the extent to which private biographical materials should constrain or illuminate the interpretation of public philosophical systems.

  ### II. DISAGREEMENTS

  The following table outlines the precise points of divergence between the two camps.

  | Topic | Compartmentalist Position | Structural Continuist Position |
  | :--- | :--- | :--- |
  | **1. Relation of Diary to System** | The diary represents a private moral failure isolated from Frege's philosophical system. The logical framework is autonomous and operates independently of the author's personal prejudices. | The diary is not an isolated lapse but exhibits a pattern continuous with Frege's philosophy. The system's structure facilitates or permits the expression of these views. |
  | **2. Semantic Treatment of Social Categories** | In the diary, Frege uses language colloquially and politically, not technically. He is not applying his semantic theory of sense and reference to social categories; therefore, no philosophical contradiction exists. | In the diary, Frege treats social and ethnic categories as if they possess fixed, extensional properties immediately accessible without mediated sense. This mirrors his logical ideal of direct access to objective truth, applied incorrectly to human groups. |
  | **3. Implications for "Objective Thoughts"** | The doctrine of objective thoughts protects logic from psychological bias. It ensures that truth is separate from the thinker's character. The diary proves only that a thinker can hold objective logic while holding subjective prejudices. | The doctrine of objective thoughts contains a structural blind spot. It encourages the belief that one has direct access to truth (reference) without needing to examine the mode of presentation (sense), allowing ideological assumptions to masquerade as objective facts. |
  | **4. Interpretive Consequence** | No revision to the interpretation of Frege's published logic or philosophy of language is required. The diary is biographical context only. | The interpretation of Frege's universalism must be revised to account for how his system handles non-logical objects. The diary serves as internal evidence against the completeness of his semantic universalism. |

  ### III. CRUXES

  The collaboration identifies two specific sub-questions (cruxes) where resolving the uncertainty would significantly shift the weight of evidence between the camps.

  **Crux 1: The Semantic Structure of the Diary**
  Can the diary's treatment of ethnic and national categories be plausibly analyzed as treating them as direct-reference terms lacking mediated sense?
  *   *Resolution for Compartmentalists:* If the diary entries are shown to be purely emotive or colloquial without semantic commitment, the Compartmentalist view is strengthened.
  *   *Resolution for Continuists:* If the diary entries are shown to rely on an assumption of immediate identification of social essences (bypassing sense), the Continuist view is strengthened.

  **Crux 2: The Relevance of Moral Failure to Structural Claims**
  Can a philosopher's failure of moral or social judgment in one domain (politics) ever constitute internal evidence against the structural claims of that philosopher's system in another domain (logic/semantics)?
  *   *Resolution for Compartmentalists:* If it is established that logical systems are formally independent of the author's social application, the Compartmentalist view is strengthened.
  *   *Resolution for Continuists:* If it is established that the system's demand for objectivity structurally encourages the bypassing of critical mediation in social domains, the Continuist view is strengthened.

  ### IV. CASES AND PREDICTIONS

  For each crux, both sides agree on a relevant line of reasoning or case study and record their predictions regarding the outcome.

  **Regarding Crux 1: The Semantic Structure of the Diary**

  *   **Concrete Case:** A close textual analysis of diary entries where Frege defines or refers to "the Jew" or "the German." The analysis will focus on whether Frege offers a *mode of presentation* (a description or sense) that allows for the possibility of error or context, or whether he assumes the term picks out its object immediately and infallibly.
  *   **Compartmentalist Prediction:** The analysis will show that Frege uses these terms in a standard political vernacular of his time. He does not intend them as logical terms governed by his semantic theory. Therefore, there is no "bypassing of sense" because no semantic theory is being applied. The language is expressive, not analytical.
  *   **Structural Continuist Prediction:** The analysis will show that Frege treats these categories as having fixed essences that are directly knowable. He will not provide a mediated sense that allows for contextual variation. This mirrors his logical requirement for precise, unambiguous reference, suggesting he applied his philosophical habit of seeking direct access to objects to social groups, thereby bypassing the necessary mediation of sense.

  **Regarding Crux 2: The Relevance of Moral Failure to Structural Claims**

  *   **Concrete Case:** An examination of the principle of anti-psychologism in Frege's work. This principle separates the logical validity of a thought from the psychological process of thinking it. The case considers whether this separation, when applied to social reality, allows the thinker to ignore the social context (the "psychology" or history of the group) in favor of a presumed logical fact.
  *   **Compartmentalist Prediction:** The examination will confirm that anti-psychologism is a tool for securing logical truth against subjective bias. It functions correctly in logic. Its misuse in politics is a category error by the author, not a flaw in the tool. The system remains valid because it successfully separates logic from psychology in its intended domain.
  *   **Structural Continuist Prediction:** The examination will reveal that anti-psychologism, when universalized, creates a blind spot regarding social objects. By insisting that thoughts are independent of the thinker's context, the system discourages examining how social categories are constructed (mediated). This structural feature allows the author to treat prejudiced assumptions as "objective thoughts" independent of context, meaning the moral failure is enabled by the structural claim.
