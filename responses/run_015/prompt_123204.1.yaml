prompt: |-
  I sit on the standing review panel of a national research council's high-risk "Frontiers" scheme, and we are mid-term reviewing a five-year programme grant, *Pre-Selection Without Words*, which asks whether any non-human animal preselects among possible actions — trying out candidate moves in imagination, as it were, and letting the bad ones die cheaply — rather than merely repeating whatever a history of reinforcement has stamped in. The interim report describes what the applicants call the "costly check" result: in a novel apparatus where the food is visible from the start and where lifting a weighted inspection flap costs the bird both time and priority of access, most of the crows lift the flap before committing, on their very first encounter with the apparatus. The applicants read this as preselection: the birds pay a real price to eliminate a possibility before acting on it. One of our panel members reads the same data as a Skinnerian creature doing exactly what a long reinforcement history for investigating anything novel would predict, and says the experiment was never designed to tell the two apart. Both readings feel genuinely available to me, and I cannot see what would break the tie.

  What makes it worse — or more interesting — is a wrinkle raised at our last meeting. The apparatus is itself informative: the flap's weight, the transparent panel, the way the reward sits in the tube, all encode the answer in a form a bird could simply read off the world rather than compute in its head, so that what looks like foresight may be the environment doing the preselecting for a creature that only has to respond to the result. If that is right, we seem to have a mind that achieves Gregorian performance — real leverage from information-bearing structures outside the skin — without the Popperian machinery that the familiar four-rung ladder of Darwinian, Skinnerian, Popperian and Gregorian creatures (Dennett, I gather; I came to it secondhand) treats as its prerequisite. The rungs stop being cumulative, and our welfare working group's quiet assumption that these classifications track a single scale of inner richness comes apart. That matters concretely here, because the council intends to use this programme's outcome to set enrichment and husbandry standards for corvids kept by member institutions, and possibly to decide which species go onto an enhanced-protection list; if the competence lives in the niche rather than in the animal, the practical requirement may be to preserve the scaffold rather than to credit the mind.

  Please draft the decision memo I will circulate to our board before it meets on 12 March. It should recommend one concrete course of action on the second tranche — release it, release it re-profiled, or withhold it pending a specified change — with a date or milestone attached, and it should state plainly what result eighteen months from now would settle the question either way. Assume the memo will be shared with the applicants, so the decision rule has to be something they could actually go and answer in a laboratory rather than an invitation to produce a deeper philosophical argument. It should also engage seriously the objection I expect from our comparative psychologist: that no behavioural signature can distinguish preselection occurring inside the animal from preselection performed by a structured environment, and that in any case welfare protection should track what an animal can suffer rather than where it sits on a ladder of cognitive kinds — so that, as she put it at our last meeting, both our research question and our enrichment debate are expensive ways of asking something we already know the answer to. If you think she is right, say so and recommend accordingly; if you think she is partly right, say which part and what follows for the tranche.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a standing review panel for a national research council's high-risk "Frontiers" scheme.
      *   **Task:** Draft a decision memo to the board regarding the second tranche of funding for a 5-year programme grant (*Pre-Selection Without Words*).
      *   **Context:** Mid-term review. The grant investigates if non-human animals (specifically crows) pre-select actions mentally (Popperian) vs. reinforcement learning (Skinnerian).
      *   **Key Finding:** "Costly check" result. Crows lift a weighted flap (costing time/priority) before committing, even on the first encounter.
      *   **The Conflict:**
          *   *Applicants:* Evidence of mental pre-selection (Popperian).
          *   *Panel Member A (Comparative Psychologist):* Evidence of reinforcement history (Skinnerian) or environmental scaffolding (Gregorian). Argues welfare should track suffering, not cognitive taxonomy.
          *   *Panel Member B (The User/Me):* Sees validity in both readings. Worried about the "Gregorian without Popperian" implication (competence in the niche, not the mind). This affects welfare standards (preserve scaffold vs. credit mind).
      *   **Requirements:**
          *   Recommend one course: Release, Release Re-profiled, or Withhold Pending Change.
          *   Include a date/milestone.
          *   State plainly what result in 18 months would settle the question.
          *   Make the decision rule actionable for a lab, not philosophical.
          *   Engage seriously with the Comparative Psychologist's objection (welfare tracks suffering, not cognitive kind; behavioral signature indistinguishable).
          *   Tone: Professional, decisive, scientifically rigorous, suitable for circulation to the board and applicants.
          *   Deadline: Board meets 12 March.

  2.  **Deconstruct the Scientific & Philosophical Problem:**

      *   *The Core Question:* Is the "computation" happening inside the head (Popperian) or in the interaction with the environment (Gregorian/Skinnerian)?
      *   *The Psychologist's Objection:*
          1.  *Epistemic:* You can't distinguish internal pre-selection from environmental affordances behaviorally. (Behaviorism/Embodied Cognition critique).
          2.  *Ethical:* Welfare depends on capacity to suffer (sentience), not capacity for abstract planning (sapience/cognitive complexity).
      *   *The User's Concern:* If the competence is in the niche, enrichment standards need to preserve the *structure* of the environment, not just assume the bird has high internal processing power. If we fund this, we need to know *which* it is to set policy.
      *   *The "Tie-Breaker":* How to design an experiment that forces the animal to reveal internal modeling vs. environmental reading?
          *   *Idea:* Remove the environmental cue but keep the problem structure. If they still "check," it's internal. If they stop, it was the scaffold.
          *   *Idea:* Introduce a "deceptive" environment where the scaffold lies. A Popperian creature might hesitate or check differently; a Skinnerian/Gregorian creature might fail immediately.
          *   *Idea:* Transfer test. Novel environment where the "costly check" is maladaptive unless they truly model the outcome.

  3.  **Evaluate the Psychologist's Objection:**

      *   *Is she right?*
          *   *On Welfare:* Largely yes. Sentience is the baseline for welfare. However, *enrichment* standards often depend on cognitive needs (e.g., puzzle feeders for intelligent animals). If the intelligence is scaffolded, the enrichment must provide the scaffold. So her point refines the policy, doesn't negate it.
          *   *On Science:* She is right that *current* data doesn't distinguish the mechanisms. But the grant's purpose is to try to distinguish them. Dismissing the question as unanswerable kills the "Frontiers" mandate.
      *   *Conclusion:* She is *partly* right. Welfare tracks suffering, but *enrichment* tracks cognitive architecture (whether internal or scaffolded). The science is valid but needs a sharper design to address the "scaffold" confound.

  4.  **Formulate the Recommendation:**

      *   *Option:* **Release Re-profiled.**
      *   *Why:* The current design is ambiguous (as admitted by the panel). Withholding kills a high-risk project. Releasing as-is wastes money on ambiguous data. Re-profiling focuses the next 18 months on the specific confound (Environment vs. Mind).
      *   *The Milestone:* 18 months from now (September of next year, roughly).
      *   *The Specific Change:* The "Transparent Scaffold" test. We need to see if the bird pays the cost when the environment *stops* providing the answer.
      *   *The Decision Rule:* If crows pay the "costly check" cost in a condition where the environment provides *no* predictive information (but the bird believes it might), it supports internal pre-selection. If they only check when the environment offers a cue, it supports the Gregorian/Skinnerian view.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Council Memo format.
      *   **Subject:** Mid-Term Review Decision: *Pre-Selection Without Words*.
      *   **Opening:** State the recommendation clearly (Re-profiled Release).
      *   **Scientific Rationale:** Acknowledge the "Costly Check" finding but validate the Panel Member's critique (Skinnerian/Gregorian alternative). The current apparatus conflates internal simulation with environmental affordance.
      *   **Addressing the Psychologist:** Explicitly engage her objection.
          *   Agree on Welfare: Sentience is primary.
          *   Nuance on Enrichment: Enrichment must match the *source* of competence. If competence is scaffolded, the scaffold is the welfare requirement.
          *   Nuance on Science: The distinction is empirically tractable, not just philosophical.
      *   **The Condition (The "Ask"):** Define the 18-month milestone.
          *   Experiment: "Information-Vacuum Transfer." Remove the visual/physical cues that encode the solution.
          *   Metric: Persistence of the "costly check" behavior in the absence of environmental cues.
      *   **Implications:** Why this matters for the Council (Policy on corvid husbandry).
      *   **Closing:** Next steps.

  6.  **Refining the Tone:**

      *   Needs to be authoritative but fair.
      *   Avoid jargon where possible, but use the Dennettian terms correctly as they are central to the grant.
      *   Ensure the "Decision Rule" is operational (lab-testable).
      *   *Self-Correction during drafting:* I need to make sure I don't get bogged down in the philosophy. The memo must drive action. The Psychologist's point about suffering is crucial for the *policy* outcome, even if the *science* continues. I should integrate that into the justification for the re-profiling.

  7.  **Final Polish:**

      *   Check dates (Board meets 12 March).
      *   Check the 18-month timeline.
      *   Ensure the "Gregorian without Popperian" paradox is addressed as a scientific opportunity, not just a confusion.
      *   Make sure the recommendation is actionable for the applicants.

      *(Self-Correction on the Psychologist's point)*: If she says "both research question and enrichment debate are expensive ways of asking something we already know," I need to push back gently. We *don't* know if the competence is internal or external. That changes *how* we enrich. If it's internal, we give them toys. If it's external, we give them *structures*. This is a vital distinction for husbandry. I will argue she is right on suffering, wrong on the utility of the cognitive distinction for enrichment.

      *(Refining the Experiment)*: The prompt mentions the environment "encodes the answer." To test internal pre-selection, we need a situation where the environment *cannot* encode the answer, yet the bird still checks. Or, a situation where the environment encodes a *false* answer. Let's go with "Non-Predictive Scaffold." If they check when the flap tells them nothing, they are simulating.

      *(Final Decision)*: Release contingent on a specific experimental modification designed to dissociate internal modeling from environmental affordance.

  8.  **Drafting the Content:** (Mental Outline)
      *   To: Board
      *   From: [My Name/Panel Chair]
      *   Date: [Before 12 March]
      *   Rec: Release Tranche 2, Re-profiled.
      *   Reason: Ambiguity in current data (Mind vs. Niche).
      *   Condition: 18-month milestone. New protocol: "Blind Scaffold."
      *   Response to Psychologist: Welfare = Suffering (Agreed). Enrichment = Competence Source (Disagreed - distinction matters). Science = Distinguishable (Disagreed - design can fix it).
      *   Outcome: If they check without cues -> Popperian. If not -> Gregorian/Skinnerian.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** The Board of the National Research Council  
  **FROM:** Standing Review Panel, Frontiers Scheme  
  **DATE:** 5 March 2024  
  **SUBJECT:** Mid-Term Review Decision: Programme Grant *Pre-Selection Without Words* (Ref: FRONT-22-CORV)  

  **RECOMMENDATION**  
  The Panel recommends **release of the second tranche of funding, contingent on re-profiling**. We propose a specific experimental modification to be completed within 18 months (by September 2025). Failure to meet the milestone criteria defined below will trigger a review of the final tranche.

  **RATIONALE**  
  The applicants' interim finding—the "costly check" phenomenon—is robust. Crows are demonstrably willing to incur time and priority costs to inspect a mechanism before acting. However, the Panel agrees with the critique raised during the review that the current apparatus conflates internal simulation (Popperian pre-selection) with environmental affordance (Gregorian scaffolding). As currently designed, the apparatus "encodes" the solution physically. A bird need not simulate the outcome in its head if the weight and transparency of the flap allow it to read the outcome directly from the world.

  This is not merely a philosophical distinction. It determines the Council's future husbandry guidelines. If the competence is internal, enrichment must target cognitive load. If the competence is scaffolded, enrichment must preserve specific environmental structures. We cannot set evidence-based policy on an ambiguity.

  **ENGAGEMENT WITH PANEL OBJECTIONS**  
  One Panel member, a comparative psychologist, argued that (1) no behavioural signature can distinguish internal pre-selection from structured environmental interaction, and (2) welfare protection should track capacity for suffering rather than cognitive taxonomy. She contends the research question is therefore scientifically intractable and ethically secondary.

  The Panel finds this objection **partially correct but ultimately insufficient** to halt the programme.

  1.  **On Welfare:** We agree that sentience and the capacity for suffering are the baseline for protection. However, *enrichment standards* are not solely about preventing suffering; they are about facilitating species-typical functioning. If a crow's problem-solving competence relies on a specific niche structure (the Gregorian view), removing that structure in captivity creates a deficit even if the animal does not "suffer" in a pain-response sense. Knowing whether the competence resides in the brain or the niche is therefore essential for designing appropriate captivity environments.
  2.  **On Scientific Tractability:** We disagree that the distinction is behaviourally invisible. While the current apparatus cannot distinguish the two, a modified protocol can. If the "computation" is truly internal, the animal should persist in checking behaviours even when the environmental scaffold is rendered non-informative, provided the animal believes a solution is possible. If the competence is purely Gregorian/Skinnerian, the checking behaviour should extinguish rapidly when the environment stops providing predictive cues.

  **CONDITIONS FOR RELEASE (THE 18-MONTH MILESTONE)**  
  To resolve this, the second tranche is released on the condition that the applicants redesign the apparatus to decouple the *cost* of checking from the *information* gained.

  **The Required Protocol: "The Blind Scaffold"**  
  By September 2025, the team must present data from a transfer test where:
  1.  The inspection flap retains its weight and time cost (maintaining the "costly" element).
  2.  The transparent panel and physical cues are occluded or randomized so that lifting the flap yields **no predictive information** regarding the reward location or mechanism state.

  **The Decision Rule:**  
  *   **Support for Internal Pre-Selection (Popperian):** If crows continue to lift the non-informative flap at rates significantly above chance on *first encounter* trials, this indicates they are testing a hypothesis internally and using the flap to confirm a simulation, rather than reading the answer off the world.
  *   **Support for Environmental Scaffolding (Gregorian/Skinnerian):** If checking behaviour collapses immediately in the absence of informative cues, this indicates the "foresight" was a property of the previous apparatus, not the bird's cognition.

  **IMPLICATIONS FOR COUNCIL POLICY**  
  This re-profiling ensures the Council receives a definitive answer. 
  *   If the result supports **Internal Pre-Selection**, we proceed with enhanced protection listings based on cognitive complexity, mandating enrichment that challenges internal modeling.
  *   If the result supports **Environmental Scaffolding**, we adjust husbandry standards to mandate the preservation of specific structural affordances in enclosures, rather than assuming high internal processing power requires complex "puzzles."

  **CONCLUSION**  
  The *Pre-Selection Without Words* programme remains high-risk but high-gain. The ambiguity identified at mid-term is a feature of the "Frontiers" mandate, not a failure of execution. However, to justify the investment and inform downstream policy, the ambiguity must be resolved empirically, not theoretically. The proposed milestone provides a clear, lab-testable criterion that respects the comparative psychologist's welfare concerns while rigorously testing the cognitive claim.

  We request Board approval to issue the tranche letter with these conditions attached by 12 March.

  **Signed,**  
  [Your Name/Title]  
  Standing Review Panel, Frontiers Scheme
