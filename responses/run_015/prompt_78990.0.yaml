answer: |-
  ### Comments on Skeleton and Thesis

  **1. Straw Man Risk: Medium/High**
  You are conflating the metaphysical condition for autonomy (identity) with the moral ground of authority (integrity). You claim everyone argues about identity (Parfit, psychological continuity). While Rebecca Dresser made this move in the 90s, the dominant opposing view (Dworkin) argues from *integrity*, not metaphysical identity. Dworkin doesn't need the demented patient to be metaphysically identical to the signer; he needs the life to have narrative coherence. By framing the opponent as obsessed with metaphysical identity, you make their position easier to kill but miss the actual moral weight they rely on (the value of a coherent life narrative). If you don't fix this, you're fighting a ghost.

  **2. The Role-Based Move: Relocates the Puzzle**
  You worry this makes authority hostage to institutional facts. You are right to worry. Your argument currently stipulates that the roles (nurse, proxy) are constituted by an undertaking to follow instructions. This is circular. *Why* are those roles constituted that way? If the answer is "because ADs are binding," you haven't grounded the authority; you've just pushed it back one step. If the answer is "because of trust/reliance," you need to say that. Otherwise, you haven't explained why a nurse's role obligation overrides the immediate welfare of a sentient, cheerful patient. You trade a metaphysical puzzle for a normative one: why do these roles have this specific content?

  **3. Originality: Partly New**
  The shift from patient metaphysics to agent obligations is a relational move that adds value, but it is not unprecedented. It resembles fiduciary models and promissory accounts (ADs as promises to proxies/society). The specific framing of "dissolving the identity debate by changing the addressee" is your contribution. It's worth pursuing, but don't claim you're the first to notice identity is a red herring; Dresser and others already kicked that door open. Your novelty is in the *role* mechanism, not the rejection of identity.

  **4. What to Cut**
  *   **The Metaphysics Deep Dive:** If your thesis is that identity is the wrong axis, don't spend half the paper arguing about psychological continuity. Dismiss it in two pages and move on.
  *   **The "Life Shape" Caricature:** Nuance the Dworkin/integrity view. If you attack the strong version ("past self owns the life"), you miss the subtle version ("critical interests survive incompetence").
  *   **Medical Definitions:** The hand-feeding vs. artificial nutrition debate is a legal/medical quagmire that distracts from the normative core. Use the case, but don't get bogged down in the clinical classification.

  **Summary Assessment**
  The skeleton holds weight only if you can ground the role obligations without circularity. Currently, you assert the roles bind agents to the AD; you need to explain *why* those roles bind agents to the AD even when it conflicts with current welfare. If you can ground that (e.g., via reliance interests or the social utility of trust), the paper works. If not, it's just a stipulation.

