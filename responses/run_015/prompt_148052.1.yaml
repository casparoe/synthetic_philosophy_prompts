      *   **Core Question:** Why does Zhuangzi frame the Butterfly Dream as an *epistemic* deadlock (like Descartes) if his actual point is *ontological* transformation (*wuhua*)? Is he setting up skepticism to dissolve it, or is the Western reading (including analytic literature) projecting a Cartesian framework onto a non-Cartesian text?
