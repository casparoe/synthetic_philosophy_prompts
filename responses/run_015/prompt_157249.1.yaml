answer: |-
  I wrote the numbers down beside my pressure.
  Ten days in June where hardly any sleep
  arrived, and yet you mark down anxiety.
  The lab results all come back normal.
  I speak of fever, you write history.
  We agree that nothing is yet resolved.

  You say the case cannot be resolved
  without a distinct change in pressure.
  I show the time-stamped call history.
  to prove I missed the work from lack of sleep.
  You say the rhythm looks quite normal.
  We talk again about anxiety.

  It starts to feel like anxiety
  when every door remains unresolved.
  Perhaps the heart is actually normal.
  I doubt the cuff that measured pressure.
  Maybe I misremembered history.
  Perhaps I dreamt the entire loss of sleep.

  I try to force myself to find some sleep.
  You suggest pills to treat anxiety.
  We build a neat and paper history.
  Nothing here is truly resolved.
  The chart remains stubbornly normal.
  My head is full of quiet pressure.

  The gauge cannot read inner pressure.
  I count the broken hours of sleep.
  Nothing we say is ever resolved.
  You treat the word itself, anxiety.
  I live inside the written history.
  You say the future looks normal.

  You say my future must be normal.
  I feel the rising inner pressure.
  You treat the ghost of anxiety.
  I beg you to give back my own lost sleep.
  This will not be easily resolved.
  I wait outside the written history.

  No normal history holds this pressure,
  Where sleep is lost to managed anxiety,
  And nothing else is ever quite resolved.

  I believe handing her that name would be a false comfort because the injury is the absence of a name, not the presence of one.
