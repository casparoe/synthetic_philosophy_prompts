answer: |-
  # Material Constitution: A Decision Tree
  **Instructions:** Answer each question based on your intuition about the case. Do not worry about technical terms. Follow your answers to a leaf to discover your position.

  ### The Tree

  **Q1. The Atom Question**  
  When atoms are arranged in the shape of a statue, do they compose a *new* object (the statue), or are there *only* the atoms arranged that way?  
  *   **Only atoms:** Go to **Leaf 1**.  
  *   **New object:** Go to **Q2**.

  **Q2. The Scattered Question**  
  Does *any* plurality of matter compose an object (e.g., a thing made of the Statue + the Moon), or only specific pluralities?  
  *   **Any plurality:** Go to **Leaf 2**.  
  *   **Specific pluralities:** Go to **Q3**.

  **Q3. The Restriction Question**  
  What restricts composition? Does it happen *always* when matter is bonded, only when the result is *alive*, or only when it serves an *interest/purpose*?  
  *   **Always (bonded):** Go to **Leaf 3**.  
  *   **Only alive:** Go to **Leaf 4**.  
  *   **Only interest/purpose:** Go to **Q4**.

  **Q4. The Mind Question**  
  If the interest/purpose is required, does the object depend on *minds* to exist, or is the interest a feature of the world independent of us?  
  *   **Depends on minds:** Go to **Leaf 5**.  
  *   **Independent of minds:** Go to **Leaf 6**.

  **Q5. The Origin Question**  
  Did the statue already exist last week when the clay was an unshaped lump, or did it begin only when shaped?  
  *   **Existed last week:** Go to **Leaf 7**.  
  *   **Began when shaped:** Go to **Q6**.

  **Q6. The Squash Question**  
  If the statue is squashed flat one second after creation, does the statue *survive* (as a flattened thing) or *cease to exist*?  
  *   **Survives:** Go to **Leaf 8**.  
  *   **Ceases to exist:** Go to **Q7**.

  **Q7. The Persistence Question**  
  Which preserves the statue: replacing molecules one-by-one (keeping shape) or reshaping the original clay (keeping matter)?  
  *   **Keeping shape:** Go to **Q8**.  
  *   **Keeping matter:** Go to **Leaf 9**.  
  *   **Neither/Both:** Go to **Leaf 10**.

  **Q8. The Modal Question**  
  Could *this* statue have been made of bronze instead of clay, or is it essentially clay? (Compare: Could the *clay* have been bronze?)  
  *   **Statue could be bronze:** Go to **Leaf 11**.  
  *   **Statue essentially clay:** Go to **Q9**.

  **Q9. The Counting Question**  
  At this moment, in this place, are there *two* things (statue and clay) or *one* thing counted in two ways?  
  *   **One thing:** Go to **Q10**.  
  *   **Two things:** Go to **Leaf 12**.

  **Q10. The Relation Question**  
  If one thing: Is the statue a *temporal part/phase* of the clay, or is the identity *relative* to our description?  
  *   **Temporal part/Phase:** Go to **Leaf 13**.  
  *   **Relative identity:** Go to **Leaf 14**.

  ---

  ### The Leaves

  **Leaf 1: Nihilism**  
  *There are no statues, only simples arranged statuewise.*  
  **Cost:** You must deny the existence of almost every ordinary object you talk about.

  **Leaf 2: Universalism**  
  *Any collection of parts composes an object, so the statue exists.*  
  **Cost:** You must accept bizarre objects, like the thing composed of the statue and your left shoe.

  **Leaf 3: Bonded Universalism (Unnamed)**  
  *Objects exist whenever matter is physically bonded, but not when scattered.*  
  **Cost:** This view is rarely defended because "bonding" is vague and arbitrary.

  **Leaf 4: Organicism**  
  *Composition occurs only for living organisms; the statue is not an object.*  
  **Cost:** You must claim the statue does not exist, even though you can see it.

  **Leaf 5: Conceptualism**  
  *Statues exist only because we conceptualize them; they are mind-dependent.*  
  **Cost:** You must accept that the world's inventory changes when thinkers go extinct.

  **Leaf 6: Pragmatism (Unnamed)**  
  *Statues exist based on objective interests, not minds.*  
  **Cost:** It is unclear what "objective interest" means without reference to valuers.

  **Leaf 7: Pre-Existence View (Unnamed)**  
  *The statue existed as the lump; shaping merely revealed it.*  
  **Cost:** You cannot explain why the artist's action created anything new.

  **Leaf 8: Kind Eliminativism**  
  *The matter survives squashing, but the "statue" kind does not; the object remains.*  
  **Cost:** You must say the statue survives but loses its essential property (being a statue).

  **Leaf 9: Matter-Constancy**  
  *The statue is identical to the clay; it survives reshaping but not part replacement.*  
  **Cost:** You must deny that ships (or people) survive the replacement of their parts.

  **Leaf 10: Unnamed (Incoherent)**  
  *The statue survives neither reshaping nor replacement, yet exists now.*  
  **Cost:** This position is empty because it offers no persistence conditions for the object.

  **Leaf 11: Modal Divergence (Unnamed)**  
  *Statue and Clay have different modal properties but are one object.*  
  **Cost:** This violates Leibniz's Law (if x=y, they share all properties) and is widely rejected.

  **Leaf 12: Coincidence View**  
  *There are two distinct objects here sharing the same space.*  
  **Cost:** You must accept that two material things can be in the same place at the same time.

  **Leaf 13: Temporal Parts View**  
  *The statue is a temporal slice of the clay's longer history.*  
  **Cost:** You must accept that objects are extended in time like they are in space (4D-ism).

  **Leaf 14: Relative Identity**  
  *It is one object, but "same statue" and "same clay" mean different things.*  
  **Cost:** You must reject absolute identity, which complicates all logical reasoning.

  ---

  ### Instructor Annotations

  **1. Unoccupied or Unstable Cells**  
  *   **Leaf 3 (Bonded Universalism):** Unattractive. It attempts a middle ground between Nihilism and Universalism but lacks a principled boundary for "bonding."  
  *   **Leaf 6 (Pragmatism):** Unexplored. Most interest-relative views collapse into Conceptualism (Leaf 5).  
  *   **Leaf 7 (Pre-Existence):** Unattractive. Contradicts the intuition that creation is an event.  
  *   **Leaf 8 (Kind Eliminativism):** Incoherent. If the object survives but isn't a statue, what is it?  
  *   **Leaf 10 (No Persistence):** Incoherent. An object without persistence conditions is unintelligible.  
  *   **Leaf 11 (Modal Divergence + Identity):** Incoherent. Violates the Indiscernibility of Identicals.

  **2. Indistinguishable Leaves (The "Hard Case" Flag)**  
  **Leaves 12, 13, and 14** are notoriously difficult to separate via intuition pumps alone.  
  *   **Coincidence (12)** and **Temporal Parts (13)** both answer "Two things" (or "Two counts") to Q9 depending on phrasing. They diverge only on Q10 (Relation).  
  *   **Constitution View** (often mapped to 12) and **Temporal Parts** (13) coincide on all physical predictions. They diverge only on whether the relation is *constitution* or *parthood*.  
  *   **Warning:** Students may land on 12 or 13 interchangeably depending on how they interpret "thing" in Q9. Use this to spark debate on whether the distinction is metaphysical or verbal.

  **3. Dead Branches (Cuttable Nodes)**  
  *   **Q2–Q10:** If a student answers "Only atoms" at **Q1**, all subsequent nodes are dead. (Nihilism bypasses constitution).  
  *   **Q5–Q10:** If a student answers "Only alive" at **Q3**, all subsequent nodes regarding statues are dead. (Organicism denies the statue exists).  
  *   **Q9–Q10:** If a student answers "Statue essentially clay" at **Q8**, they likely collapse into **Leaf 9** (Identity). Q9 becomes redundant if Modality is identical.  
  *   **Recommendation:** For a shorter handout, cut Q4, Q8, and Q10. Q4 splits hairs on anti-realism. Q8 and Q10 often track Q7 and Q9.

  ---

  ### Classificatory Work Analysis

  The **Composition Question (Q1)** does the most classificatory work; it immediately halves the logical space by separating Eliminativists/Nihilists from Realists. Without answering this, no further questions about *what* is constituted make sense. The **Modal Question (Q8)** does the least independent work; in almost all stable positions, the answer to whether the statue could be bronze is entailed by the answer to whether the statue *is* the clay (Q9) or how it persists (Q7). If you must sacrifice nodes to fit one page, cut Q8 and merge its logic into Q7 and Q9.
