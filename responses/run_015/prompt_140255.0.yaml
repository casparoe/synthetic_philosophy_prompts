      *   *Check:* Is the distinction between (a) and (b) clear? (Yes, (a) is technical truth, (b) is practical falsehood).

  6.  **Final Polish:** Ensure the mapping table is crisp. Make sure the "Sunrise" analogy lands clearly as the counter to the "Messenger" analogy. (The flatmate focuses on *transmission*, the counter-argument focuses on *observation*).

      *(Self-Correction on the Slack scenario)*: Be careful not to say Slack *is* CK. It isn't. But explain why coordination happens anyway (risk assessment vs. logical guarantee).

      *(Self-Correction on Bounded Rationality)*: Make sure to distinguish between "I am irrational" and "I reason to depth 3." The result is similar (breaks the chain), but the mechanism is cognitive vs. communicative.

      *(Final thought on the Flatmate's claim)*: His claim that "institutions/habits" do the work is actually a game-theoretic claim (focal points, Schelling points). So he's using GT to dismiss GT. Point that out.

