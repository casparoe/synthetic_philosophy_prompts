          *   *Global Inevitability:* Outcome occurs across almost all worlds with any remotely plausible prior history.
      *   **Stance:** The user is holding this position *for the sake of argument* (steel-manning it) and wants to know what would count *against* it.
      *   **Specific Questions/Constraints:**
          *   Sort defeaters from fatal to merely awkward.
