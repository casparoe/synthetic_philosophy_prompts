  2.  **Deconstruct the Position:**
      *   The position attempts to salvage "inevitability" claims from the charge of hard determinism by restricting the modal scope to "local" neighborhoods defined by macro-structures.
      *   It uses a parameter $N$ (branching-factor cutoff) to define "nearby."
      *   It claims this is useful for historiography (explaining *why* things happened without saying they *had* to happen in a cosmic sense).

  3.  **Brainstorming Defeaters (Fatal to Awkward):**

      *   *Fatal 1: The Measurement Problem (Setting $N$).* How do you quantify a "low-probability deviation"? History doesn't give us probability distributions for singular events (e.g., "Archduke Franz Ferdinand's driver takes a wrong turn"). If $N$ is arbitrary, the definition is arbitrary.
      *   *Fatal 2: Chaos Theory/Butterfly Effect.* If social systems are non-linear dynamical systems (which they likely are), small perturbations amplify exponentially. "Nearby" worlds diverge rapidly. The "local" neighborhood might be vanishingly small, making "local inevitability" trivial or empty.
      *   *Fatal 3: Unfalsifiability/Immunization.* If every time a counterfactual works (shows the outcome *doesn't* happen), the defender says "That world required $>N$ deviations, so it's not local," the theory explains nothing. It becomes a tautology: "Inevitable within the set of worlds where it's inevitable."
      *   *Awkward 1: Macro/Micro Interdependence.* The distinction assumes macro-structures can be held constant while micro-events vary. But macro-structures *are* aggregates of micro-events. You can't easily hold one fixed while varying the other without logical tension.
      *   *Awkward 2: Historian Bias.* Who decides the macro-structural conditions? This invites presentism or ideological bias into the definition of the "local" neighborhood.

