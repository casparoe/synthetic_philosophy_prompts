prompt: |-
  I've been chewing on this view I picked up from a counterfactual-history thread—maybe adjacent to that Tetlock-style work on expert political judgement, but pushed in a more modal direction—that we should split historical inevitability into "local" and "global" flavors. The idea is that an outcome is locally inevitable if, across all nearby possible worlds that preserve the same macro-structural conditions (resource distributions, tech levels, institional inertia), it still occurs within some reasonable window, even though changing those macro conditions could avoid it entirely. Global inevitability, by contrast, requires the outcome across almost all worlds with any remotely plausible prior history. The claim is that historians constantly conflate the two, and that if you formalize local inevitability with a branching-factor cutoff—where you stop counting worlds that need more than N simultaneous low-probability deviations to diverge—you can defend inevitability claims without falling into determinism or triviality.

  So I'm holding this position for the sake of argument: local inevitability, defined via that branching-factor cutoff, is a coherent and genuinely useful historiographical tool, not just ad hoc rescue. What would count against it? I want the defeaters sorted from fatal to merely awkward. Specifically: what empirical case study or formal result (say in chaos theory or modal logic) would collapse the local/global distinction? Is the branching-factor cutoff just gerrymandering, and if so, is there any principled way to set N? Would it matter if social systems turn out to be hypersensitive in ways that make "nearby worlds" impossible to define? Has the view already been qualified into unfalsifiability—if every failed counterfactual gets dismissed as "not nearby enough," is that a problem for a claim that's supposed to do real explanatory work? Please be honest about what defenders of the view would concede versus brush off, and whether the insulation is a feature or a bug. End with \answer{...} giving your bottom-line verdict on whether the position is well-insulated and whether that insulation undermines it.
reasoning: |-
