  **The Anvil Flats Protocol**

  The dust at Anvil Flats does not settle; it hangs, suspended in the grey light that comes from the north. Elias sat at Desk Four, the only lamp lit in the hall. The other desks were cleared, their chairs tucked in, their nameplates removed. The Office was closing. Not because the work was done, but because the White was coming.

  You could see it from the window, a shimmering heat-haze line moving slowly across the salt flats. It drifted closer every day. Rademacher said it moved toward the shallow side. Elias didn't know which side was shallow. He only knew that when the White passed over a thing, the thing stayed, but its history turned inside out. Rocks forgot their erosion. People forgot their reasons.

  On his desk lay File 8940. It contained a single sheet of paper.

  It was a Reply. It had arrived three days ago, delivered by the chute that connected the Office to the other side of the White. The paper was cool to the touch, colder than the room. The ink was stark black, dried in a pattern that suggested a hand moving with absolute certainty.

  *Protocol 7,* Elias thought. *Effect precedes Cause.*

  He had the Reply. Now he had to write the Letter. The Letter was the inquiry that prompted this Reply. He could not send just anything. The timestamps had to align across the seam. The tone had to match. The logic had to hold. If the Reply was an answer, the Letter had to be the question, even if the question hadn't been asked yet.

  Elias picked up his pen. The nib was steel, heavy. He looked at the Reply again.

  *To the Clerk at Anvil Flats,* it read. *I refuse to write the letter at all.*

  It was signed *V.*

  Elias stared at the words. V was on the other side. V's time ran the other way. To V, this Reply was sent after receiving Elias's Letter. To Elias, the Reply was already here, and the Letter was still blank.

  If Elias wrote a Letter asking V to write, V's Reply was a refusal. That was consistent. A question asked, an answer denied. But the Protocol required more than consistency; it required necessity. The Reply existed. Therefore, the Letter *must* have been sent. The Letter was the cause of the Reply. But the Reply denied the act of writing.

  *I refuse to write the letter at all.*

  Did V mean the Reply? Or the Letter Elias was holding his pen over?

  If Elias wrote nothing, the Reply was a lie. It claimed a refusal of a letter that never existed. But the Reply was already in his hand. It was physical fact. The paper weight, the ink smell, the chill of it. It was real. Therefore, the Letter had to be real.

  If Elias wrote the Letter, he was forcing V to refuse. He was manufacturing the cause of a refusal. But if he manufactured it, was it a refusal? Or was it a compliance with the Protocol?

  The White outside had moved. It was closer to the fence now. The dust motes near the window seemed to hang still, caught in the gradient shift. Elias felt a pressure behind his eyes, the familiar headache of the seam. It felt like trying to remember a dream while waking up, the details slipping away as the light hit them.

  He dipped the pen. The ink was blue. V's ink was black. He would need to use the black pot.

  He touched the nib to the paper.

  *Dear V,* he wrote.

  The pen scratched. The sound was loud in the empty hall.

  *Regarding your correspondence...*

  He stopped. If he finished the sentence, he was committing to the exchange. He was validating the Reply. But the Reply said *I refuse.*

  If he wrote, *Please write,* and V replied *I refuse,* the loop closed. But the Reply didn't say *I refuse to write the reply.* It said *I refuse to write the letter.*

  Which letter?

  Elias looked at his hand. It was steady. He thought about leaving. He could pack his bag, walk south before the White crossed the fence. If he crossed the line, he would be re-oriented. He would remember writing this Letter. He would remember sending it. He would remember V's refusal. Or would he remember never having received the Reply?

  Rademacher said memories flip with the rocks. If he stayed, he would be part of the Office history, a clerk who matched the records. If he left, he would be a man who walked away from a desk with a blank sheet on it.

  But the Reply was here.

  He looked at the words again. *I refuse to write the letter at all.*

  Maybe V was him. Maybe, on the other side, after the flip, he was V. Maybe he was refusing himself.

  The lamp flickered. The White was at the fence. The dust outside stopped moving entirely.

  Elias pressed the nib down. The ink flowed. He wrote a word. Then another. He did not look at what he was writing. He only looked at the Reply, matching the curve of his letters to the curve of V's, matching the pressure, matching the certainty.

  He wrote until the page was full. He did not read it. He folded it. He placed it in the chute.

  He waited. The chute did not clatter. Nothing came back. Nothing needed to.

  Elias sat back. The pen was in his hand. The ink was wet. He looked at the Reply. It said *I refuse.*

  He looked at the Letter in the chute. He had written it.

  Outside, the White crossed the fence. The dust began to fall.

  ***

  **Note to Collaborator**

  I treated the **asymmetry of records** as the basic one. The physics is invisible; what matters is the paper trail. The Clerk holds an effect (the Reply) that demands a cause (the Letter), but the content of the effect negates the cause. This makes the epistemic burden the source of the horror, not the thermodynamics.

  The phenomenology is thinnest regarding **memory re-orientation**. Rademacher's rule suggests minds flip like coins without noticing. In practice, a conscious observer should perceive a discontinuity—a "jump" in identity or a gap in narrative continuity. I sidestepped this by keeping Elias on the near side until the end, letting the *threat* of re-orientation do the work. If he had crossed the seam, the story would require him to experience a change he cannot perceive, which risks breaking the "no internal reversal" stipulation. The ambiguity of whether he *could* have written otherwise rests on whether the Reply constrains his will or merely describes it. I left that knot untied.
