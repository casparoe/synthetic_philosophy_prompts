  **Opening Remarks**

  Good morning. For those who do not know me, I was Vera's doctoral student. For those who do not know her, she is sitting in the front row. We asked Vera to join us because a gathering in her name without her presence would have been a contradiction. She spent twenty years teaching us that context matters, that the observer is part of the system, and that we cannot separate the question of what something *is* from the question of what it is *for*.

  Vera's work is often summarized by a single metaphor: the ledger. She argued that ethical weight does not come from the number of neurons firing, or the complexity of a behavior, or even the word "consciousness," which she found too slippery to hold. Instead, she proposed that a system matters based on whether it keeps a ledger. Does it integrate what is good and what is bad into a single currency? Does it use that sum to weigh choices against what might have been? If there is no bookkeeper—if there is processing without a stake—then there is nothing to protect.

  This creates a difficult silence for us today. We know Vera's brain processes sound. Her clinicians tell us she likely hears us. But Vera's own theory asks a harder question: is there anyone home to record the sound? Is the bookkeeper still at the desk? We do not know. To claim we know would be to betray her rigor. She taught us that uncertainty is not a place to hide; it is the place where work begins. To say "we cannot know" is not an endpoint for us; it is a directive. It means we must act without the comfort of certainty.

  So why are we here? We are here because while we may not know the state of Vera's ledger, we know the state of our own. We are systems that keep accounts. We have recorded a debt. For the colleagues and students in this room, that debt is intellectual. She gave us the tools to ask better questions about minds biological and digital. For the family and care team, the debt is deeper. It is measured in evenings spent at a bedside, in decisions made without guarantee, in the refusal to let silence be the final word.

  I want to speak specifically to Vera's sons, her niece, and the nurses who have cared for her. You have been keeping the ledger open when it was hardest. One of you has sought her presence through faith; one of you has come despite the pain of estrangement. Both acts are costly. Both acts acknowledge that she matters. Vera's theory does not demand we agree on the metaphysics of her soul to agree on the ethics of our care. It demands only that we acknowledge the stake. You have acknowledged it, every day, for three years.

  To the undergraduates and guests who are new to these ideas: you might wonder why we gather around someone who cannot speak back. We gather because the definition of a community is not that everyone can speak, but that everyone is heard, or at least, that we strive to hear them. We are testing the width of our own ledgers today. We are asking how much space Vera occupies in our calculations of what is right.

  We will hear from her family shortly. They will speak to who she was as a mother. My colleagues will speak to who she was as a scientist. I am asking you to hold both truths. The scientist who demanded evidence and the mother who demanded love are not separate people. They were one system, integrating values we are still trying to understand.

  In a little while, I will walk over to Vera. I will speak to her. I will not claim to know if she hears me in the way she once heard me. I will not claim to know if she understands. But I will speak. Because on her own account, a system that stops trying to integrate the value of its history is a system that has closed its ledger. We are not ready to close hers. And we are not ready to close our own accounts with her.

  Thank you for coming. Let us begin.

  ***

  **Note on Strategic Fictions and Conditions**

  **Strategic Fiction:** When I say, "We are not ready to close hers," I imply a continuity of Vera's ledger that her own theory suggests might be broken. The honest version is: "We are not ready to close *our* ledger regarding her." I attribute agency to her remaining system to honor the family's hope, without committing to the clinical claim that her bookkeeper is intact.

  **Evidential Change:** If Vera regained reliable symbolic communication (e.g., consistent yes/no via eye-tracking verified by independent clinicians), I would remove the ambiguity about whether she "records the sound." The speech would shift from honoring uncertainty to celebrating recovery.

  **Philosophical Change:** If a compelling argument demonstrated that the "ledger" is merely a descriptive metaphor with no ontological weight (e.g., if integrated information theory proved the bookkeeper is an illusion), I could not use her theory to justify the care. I would instead ground the speech in relational ethics rather than computational integration.

  **Likely Failure Point:** The balance between the sons. The Christian son may hear "we don't know if she's home" as a denial of her soul; the estranged son may hear "she matters" as pressure to reconcile. I risk satisfying neither, though I aim to validate both forms of attendance.
