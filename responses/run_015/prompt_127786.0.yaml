  so my roomate has this thing where she'll watch these really heavy documentaries about real people going through awful stuff—like not actors, actual footage—and she'll sit there with her headphones on and actually cry, but then she says she feels "cleansed" after? meanwhile i cant handle that at all, it just makes me anxious for days. but she also cries during fake sad movies and says thats the same feeling. i told her it feels wrong to enjoy real peoples suffering just to get a mood boost, but she said if thats messed up then listening to sad songs should be messed up too since music is also "manufactured sadness." i don't even know where to start with that comparison. is she just being a masochist or is there actually some reason people go looking for sad stuff on purpose? and does it actually matter if the sadness is real or made up?
