prompt: |-
  You are a philosopher of science specializing in the epistemology of long-range prediction and demographic dynamics. Before constructing your answer, spend two minutes in structured brainstorming: first, list three conceptually distinct ways a predictive mechanism can survive a chronological miss without becoming ad hoc; second, identify two conditions under which any such survival collapses into unfalsifiability. Only then proceed.

  Write the full desiderata — the specification of what an adequate philosophical theory of "right but early" long-run predictions must be able to do — using the Malthusian case (population-pressure dynamics predicting resource collapse) as the central example, but framing the criteria so they apply to any analogous long-horizon theory (e.g., coupled climate-economy forecasts, energy-transition timelines). Your specification should include:

  1. The phenomena the theory must explain: what distinguishes a genuine temporal lag from a failed mechanism, including the hypothetical case where soil-depletion mechanism M is masked in agriculture by synthetic-substitution feedback but continues to operate isomorphically in freshwater aquifer dynamics by the predicted date.
  2. The cases it must classify correctly: chronological miss versus structural break; mechanism-preserving delay versus boundary-condition suppression; and isomorphic transformation (where original variables are replaced but structural dynamics persist). For each, state the conceptual test that decides the classification.
  3. The distinctions it must not collapse: specifically (a) temporal displacement with intact causal pathway, (b) suppression by countervailing forces that leave the pathway intact, and (c) transformation into a structurally analogous but materially different mechanism. Explain why conflating any pair destroys the theory's explanatory value.
  4. The consistency conditions: what generic results from philosophy of science about risky prediction and immunization strategies, and what formal properties of feedback-loop latency and substitution elasticity, the theory must respect — describe these results conceptually without naming specific papers or asking for citations.
  5. For each desideratum, provide the motivating case or consideration behind it, and label it negotiable (can be relaxed for a narrower purpose, e.g., pure policy guidance) or non-negotiable (required for the theory to count as epistemically serious).
  6. State which single desideratum eliminates the largest share of popular rescue accounts of Malthus — for instance, accounts that treat technological substitution as an exogenous deus ex machina, or that treat demographic transition as an unmodeled shock rather than an endogenous feedback shift.
  7. Optionally, present the core list in a table: Requirement | Motivating Case / Test | Negotiable?

  Finally, evaluate whether any subset of these desiderata is jointly unsatisfiable; if there is an unavoidable tension — for example, between demanding mechanism-preservation and demanding precise chronological risk — identify it explicitly as a result of your specification rather than resolving it by fiat.

  Write formally, as an expert conceptual specification. Do not include a bibliography, reading list, or requests for sources. Do not use verbatim quotation marks for any real text; if you reference a well-known formulation, paraphrase it without quotation marks. Keep the weight on the criteria and their motivating logic, not on scoring named contemporary theories.
