prompt: |-
  I'm mentoring a bright, self-taught high-school senior who has become fixated on the idea that consciousness must be "a movie playing inside my head" — she literally sketched a little stick figure seated in a dark room watching a screen made of neurons. She also heard a podcast mention that "there is no central self, only multiple drafts," and she has collapsed the two claims together: she now believes that rejecting the little stick figure automatically means consciousness is an illusion, or that there is no fact of the matter about what she is experiencing right now. I have one uninterrupted sixty-minute session to separate the Cartesian theater from the multiple drafts model, and I want the session to feel like solving a structural puzzle rather than receiving a lecture.

  Plan the explanatory arc for me, not the explanation itself. First, lay out the dependency order: which idea must be in place before the other can even be introduced, and why reversing that order makes her think the drafts model is just nihilism about experience. Second, identify the one carrying example or concrete scenario — it should be repeatable in conversation without props, and it must possess exactly the feature that makes a central "screen" unnecessary while still preserving a genuine first-person report. I am considering a hypothetical split-second correction in a rhythm game, where the player's hand adjusts to a beat before any verbal report is available; tell me whether that carries the load or whether it smuggles in the misconception I am trying to avoid, and if not that, propose what should replace it. Third, map the misconceptions she will form in sequence: the "neural screen" version of the theater; the "no audience means no show" inference drawn from rejecting it; the "all drafts are equally authoritative" misreading of multiplicity; and the "retrospective narration is pure confabulation" collapse — specify at which point in the arc each should be anticipated and defused, and exactly what distinction or question I should deploy at that point. Fourth, design one final check: a single scenario or question I can pose at the end that would reveal whether she understands the drafts model as a claim about temporal distribution and editorial access, rather than as a denial that anything feels like anything. Finally, state explicitly what I should leave out of this session and say so out loud — I am inclined to leave aside the detailed global-workspace literature and the technical phenomenal-versus-access distinction, but tell me whether those omissions are safe or whether they create hidden holes in her grasp of drafts. The session should remain at the level of conceptual architecture only, with no appeal to specific neuroscience papers or named experiments she could not have encountered.
