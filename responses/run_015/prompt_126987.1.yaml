answer: |-
  ### 1. Dependency Order: The Architectural Sequence

  You must establish the **definition of experience** before you describe the **mechanism of processing**. If you reverse this, she will interpret the mechanism as a broken version of her existing definition, leading to nihilism.

  *   **Step 1: Functional Grounding (The "What").**
      *   **Concept:** Establish that "conscious experience" is not a private image viewed by a self, but rather the *state of information being available* to control speech, memory, and action.
      *   **Why First:** If you start with "Multiple Drafts," she hears "Multiple Movies." She will assume a movie requires a viewer. By defining experience as *availability for report* first, you remove the need for a viewer. A document doesn't need a reader to exist as a draft; it just needs to be editable.
      *   **Risk of Reversal:** If you introduce the distributed nature of processing before defining experience functionally, she will assume there is a "Real Experience" (the hidden movie) and the "Drafts" are just corrupted copies. This validates the Cartesian Theater by treating it as the lost ideal.

  *   **Step 2: Temporal Smearing (The "When").**
      *   **Concept:** Establish that "availability" is not an instantaneous switch but a process that takes time and can be revised mid-stream.
      *   **Why Second:** Once she accepts experience is "availability," you can show that availability isn't a single timestamp. This dissolves the "Screen" because a screen implies a single frame at a single time.
      *   **Risk of Reversal:** If you claim time is smeared before establishing that experience *is* the process, she will think the "smearing" is a defect in the transmission to the screen, rather than the nature of the screen itself.

  *   **Step 3: Editorial Authority (The "Who").**
      *   **Concept:** Establish that while many drafts exist, only the one that wins the competition controls the mouth and the memory.
      *   **Why Third:** This addresses the "No Self" anxiety. There is no "Little Stick Figure," but there is a "Winning Draft." The "Self" is the trajectory of the winning draft, not the audience.
      *   **Risk of Reversal:** If you introduce the "Winning Draft" before dismantling the "Viewer," she will simply imagine the Stick Figure choosing which movie to watch.

  ### 2. The Carrying Example

  **Evaluation of the Rhythm Game:**
  Do **not** use the rhythm game example. It carries a hidden trap.
  *   **The Trap:** It distinguishes between "unconscious motor correction" (the hand) and "conscious awareness" (the screen). This subtly reinforces the very dualism you are trying to kill. It suggests the *real* work is done by a zombie subsystem, and consciousness is just a laggy monitor. This validates her fear that consciousness is secondary or illusory.
  *   **The Replacement:** **The "Garden Path" Sentence (Auditory Version).**
  *   **The Scenario:** Ask her to imagine hearing a sentence in a noisy room: *"The old man... [static] ...the boat."*
      *   **Phase 1:** Her brain initially drafts "The old man" as a subject (a person).
      *   **Phase 2:** She hears "the boat" at the end.
      *   **Phase 3:** Her brain retroactively re-interprets "man" as a verb ("to man").
      *   **The Load:** Ask her: *"At the exact moment you heard 'man', what did the word mean?"*
      *   **Why it Works:** There was no "screen" showing the correct meaning at the start. The meaning *changed* without new sensory input. If consciousness were a movie screen, the subtitle would have to flicker. But it doesn't feel like a flicker; it feels like a unified understanding. This proves the "experience of meaning" is a *retrospective edit*, not a live broadcast. It preserves the reality of the experience (she definitely understands the sentence now) without requiring a central screen that held the "truth" the whole time.

  ### 3. Misconception Mapping: Anticipate and Defuse

  You must intervene at four specific choke points. Do not wait for her to voice these; introduce the distinction just before the misconception would naturally form.

  *   **Misconception 1: "The Neural Screen" (The Homunculus)**
      *   **When:** Immediately after Step 1 (Functional Grounding).
      *   **The Error:** She assumes that for information to be "available," it must be available *to* someone.
      *   **Defusion:** Ask: *"If a computer saves a file to a hard drive, does it need a second computer to watch it save for the save to be real?"*
      *   **Distinction:** Separate **Availability** from **Observation**. Experience is the file being saved in a format the system can use, not the file being opened by a user.

  *   **Misconception 2: "No Audience Means No Show" (Nihilism)**
      *   **When:** Immediately after Step 2 (Temporal Smearing).
      *   **The Error:** She infers that if there is no single moment of "now," there is no fact of the matter about what is happening.
      *   **Defusion:** Ask: *"When you are writing an essay, is there a moment where the argument 'becomes real'? Or is it real because the words are on the page, even if you delete and rewrite paragraph one later?"*
      *   **Distinction:** Separate **Ontology** (what exists) from **Finality** (what is finished). The draft is real even while it is being edited.

  *   **Misconception 3: "All Drafts Are Equally Authoritative" (Chaos)**
      *   **When:** During Step 3 (Editorial Authority).
      *   **The Error:** She thinks "Multiple Drafts" means she should feel multiple conflicting realities at once.
      *   **Defusion:** Ask: *"In the sentence example, did you hear both meanings at once? Or did the second one overwrite the first so completely you can't even remember the mistake?"*
      *   **Distinction:** Separate **Parallel Processing** from **Serial Output**. The brain works in parallel; the mouth and memory work in series. The "Self" is the serial output.

  *   **Misconception 4: "Retrospective Narration is Pure Confabulation" (The Lie)**
      *   **When:** At the very end, before the Final Check.
      *   **The Error:** She concludes that because the experience is edited, it is a "fake story" told to hide the truth.
      *   **Defusion:** Ask: *"If you correct a typo in a text message before sending it, is the final message a lie? Or is it the only version that actually existed for the recipient?"*
      *   **Distinction:** Separate **Fabrication** from **Constitution**. The edit doesn't hide the experience; the edit *is* the experience. There is no "raw footage" underneath.

  ### 4. The Final Check

  Pose this single scenario to verify she has escaped the "Illusion" trap:

  **The Question:**
  *"Imagine you touch a hot stove. You pull your hand back, and then you yell 'Ouch.' If we look at your brain, we see the pain signal, the motor signal, and the speech signal firing in a spread of time, not a line. If I ask you: 'Did the pain feel real before you yelled?', what does the Multiple Drafts model say?"*

  **The Correct Understanding:**
  She should answer: *"It says the question is broken. The 'feeling real' isn't a separate event that happens before the yell. The feeling is the brain's state of being ready to yell and remember it. There isn't a 'before' where the pain existed privately."*

  **The Failure Mode:**
  If she answers: *"It says the pain was just a signal and the 'feeling' was a story you told yourself after,"* she has reverted to the "Consciousness is an Illusion" view. Correct her by returning to the **Constitution** distinction (Misconception 4).

  ### 5. Explicit Exclusions

  You are correct to omit the detailed **Global Workspace Theory (GWT)** literature. GWT is a specific mechanistic implementation of the broader philosophical point. Adding it introduces unnecessary complexity about "broadcasting" that might reify the "screen" metaphor.

  **However, you cannot safely omit the Phenomenal-versus-Access distinction.**
  *   **The Risk:** Her entire confusion stems from believing there is "What it feels like" (Phenomenal) and "What I can report" (Access), and that the latter is a fake shadow of the former.
  *   **The Fix:** You do not need to use the technical terms "Phenomenal Consciousness" or "Access Consciousness." In fact, do not use them. But you **must** address the *concept*.
  *   **Instruction:** You must explicitly argue that *"what it feels like"* **is identical to** *"what the brain is prepared to report."* If you leave this out, she will assume the "Drafts" are just the Access part, and the "Real Feeling" is still hidden in the Theater.
  *   **Say this out loud:** *"I am leaving out the technical terms 'Phenomenal' and 'Access' consciousness, but I am not leaving out the problem. I must convince her that the 'feeling' is not a secret inner glow, but the functional state of the information. If I don't make that identity claim, she will treat the Drafts as merely the 'reporting' layer and keep the 'feeling' layer in the Cartesian Theater."*
