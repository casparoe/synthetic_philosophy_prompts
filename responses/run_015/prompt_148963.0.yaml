answer: |-
  ### 1. Exam Question

  **Term:** "Standard-Shopping" (Keep this term; it is vivid and mnemonic. I would not change it, though I have tightened the case description below to ensure the "reversion" is unmistakable, as that is the linchpin for distinguishing this from simple bias.)

  **Prompt:**

  Consider the case of **Standard-Shopping**: Ana requires "sustained national visibility" for promotion. Initially, she interprets this strictly (invited talks, awards) and believes she fails. Over subsequent weeks, she shifts to a loose interpretation (general recognition) and believes she passes. Her first-order beliefs about her record (number of talks, etc.) do not change. Six months later, serving on a committee for a junior colleague, Ana reverts to the strict interpretation and votes against the colleague based on the same criteria.

  (a) Analyze Ana's case against the **Traditional/Interpersonal Model** and the **Deflationary Alternative**. Specifically, identify which necessary condition of each account Ana's behavior satisfies and which it violates. (8 marks)

  (b) Define a **contrast condition** that distinguishes Ana's "Standard-Shopping" from (i) sincere semantic disagreement, (ii) acknowledged self-serving reasoning, and (iii) plain akrasia. Your condition must account for the fact that she reverts to the strict standard once her own stake is removed. (6 marks)

  (c) Evaluate the following claim: *"Standard-Shopping suggests the literature has been looking for self-deception in the wrong place — in a belief, or in a contradictory pair of them — when the real unit might be a policy for counting considerations as evidence."* Take a side: Is this a solution to the paradox, or merely the deflationary view wearing a new hat? Justify your position. (6 marks)

  *(Word limit: 1,000 words)*

  ***

  ### 2. Model Answer

  Ana's case of Standard-Shopping presents a significant challenge to the taxonomy of self-deception because it decouples motivational influence from both intention and contradictory belief states. To evaluate it, we must test it against the structural requirements of the dominant accounts.

  The **Traditional/Interpersonal Model** treats self-deception as analogous to interpersonal deception: one part of the mind intends to induce a belief in another part. This model requires (1) an intention to bring about a belief and (2) awareness of the truth. Ana's case violates condition (1). There is no evidence she intentionally set out to manipulate her interpretation; the shift occurred over weeks without a "blackout" or strategic planning. It also struggles with condition (2). If she "knew" the strict reading was correct initially, the Traditionalist must explain how she lost that knowledge without acquiring a new first-order belief about her record. She still knows she gave three talks; only the *weight* of those talks changes. Thus, the Traditional Model cannot accommodate Standard-Shopping without positing a homunculus-like intention that isn't present in the case.

  The **Partitioning Version** attempts to solve the static paradox by suggesting contradictory beliefs are held in separate compartments. Ana's case violates the requirement for simultaneity. She does not hold the strict and loose interpretations at the same time; she swaps them based on context. Furthermore, the **Deflationary Alternative**, which dissolves the paradox by removing the requirement for intention and contradictory belief (reducing self-deception to motivated bias), fits Ana better but remains incomplete. Deflationism typically describes a stable skewing of evidence (e.g., always overweighting positive data). Ana, however, demonstrates *variable* standards. She applies a loose standard for herself and a strict standard for her colleague. If this were mere deflationary bias, we might expect a consistent cognitive style. The reversion suggests the bias is not just in how evidence is weighed, but in the *rule* for weighing it.

  This leads to the contrast condition. To distinguish Standard-Shopping from the alternatives, we must look for **motivated inconsistency in evidential rules**.
  (i) Against **sincere semantic disagreement**: A sincere disagreeer applies their interpretation consistently across contexts. Ana's reversion to the strict reading for her colleague proves her loose reading was not a stable semantic commitment.
  (ii) Against **acknowledged self-serving reasoning**: If Ana were merely reasoning self-servingly, she would acknowledge the flexibility of the standard ("I know I'm stretching the definition, but I deserve this"). The phenomenology of self-deception requires that she accepts the loose reading as *correct* at the time.
  (iii) Against **plain akrasia**: Akrasia is acting against one's better judgment (believing $p$ but doing not-$p$). Ana is not acting against a belief; she is altering the judgment itself. She believes she qualifies *under the loose rule*.
  Therefore, the necessary condition is: *The agent adopts an evidential policy motivated by desire, treats it as objective truth, but abandons it when the desire is no longer active.*

  This supports the claim that the "real unit" of self-deception is the **evidential policy** rather than the belief state. Traditional accounts fixate on the output (believing $p$ when not-$p$). Standard-Shopping shows the manipulation happens at the input stage (deciding what counts as evidence for $p$). This is not merely the deflationary view wearing a new hat. Deflationism argues self-deception is just ordinary bias. But ordinary bias is usually a heuristic error; Standard-Shopping is a *motivated rule-change*. By shifting the locus from belief to policy, we explain how Ana avoids the paradox: she never believes $p$ and not-$p$ simultaneously. She believes "Rule A applies" (strict), then later "Rule B applies" (loose), driven by desire.

  However, one might object that "evidential policy" is just a fancy description of deflationary bias. If deflationism allows for motivated changes in how evidence is processed, does the distinction matter? It matters because it restores a sense of agency without requiring intention. Ana is responsible for her standards, even if she didn't intend the specific belief. This moves the moral psychology from "How did she trick herself?" to "Why did she lower her standards?"

  In conclusion, Standard-Shopping breaks the Traditional model by removing intention and contradiction. It exceeds the Deflationary model by showing variability in standards rather than stable bias. The most robust explanation is that self-deception is a motivated shift in evidential policy. This resolves the paradox by showing that the contradiction was never in the beliefs, but in the rules used to generate them.

  ***

  ### 3. Marking Scheme (20 Marks)

  **1. Diagnosis of Traditional/Partitioning Failure (4 marks)**
  *   **Must Hit:** Explicitly state that Ana lacks the *intention* to deceive (violates Traditional) and lacks *simultaneous contradictory beliefs* (violates Partitioning).
  *   **Common Error:** Student summarizes the Traditional view accurately but fails to explicitly map Ana's lack of intention to the theory's requirements.

  **2. Diagnosis of Deflationary Limitation (4 marks)**
  *   **Must Hit:** Acknowledge Deflationism fits better but note it typically implies stable bias, whereas Ana shows *variable/context-dependent* standards (the reversion).
  *   **Common Error:** Treating Deflationism as a perfect fit and ignoring the significance of the committee vote reversion.

  **3. The Contrast Condition (6 marks)**
  *   **Must Hit:** Define a condition that rules out sincere disagreement (consistency), self-serving reasoning (awareness), and akrasia (action vs. belief). Must hinge on the *motivated inconsistency* revealed by the reversion.
  *   **Common Error:** Defining the contrasts generally without applying them to Ana's specific reversion behavior.

  **4. Evaluation of the "Evidential Policy" Claim (4 marks)**
  *   **Must Hit:** Take a clear side (Solution vs. New Hat) and justify it. (Either defending the policy shift as distinct from bias, or arguing it collapses into deflationism).
  *   **Common Error:** Sitting on the fence without justification, or restating the prompt without taking a position.

  **5. Structure and Clarity (2 marks)**
  *   **Must Hit:** Logical flow between parts (a), (b), and (c); adherence to word limit.
  *   **Common Error:** Disjointed answers that treat (a), (b), and (c) as unrelated short-answer questions rather than a cohesive argument.

  ***

  ### 4. Acceptable Variations Note

  **Rejectable Move:** A strong student may reject the claim in Part (c) that "evidential policy" is a distinct solution. They may argue convincingly that this *is* just the Deflationary view (motivated bias) refined, and that positing a "policy" adds no explanatory power. Full marks are awarded if they defend this collapse rigorously, provided they have correctly analyzed the case in Parts (a) and (b).

  ***

  ### 5. Confidence & Least Sure Claim

  **Confidence Level:** High (85%). The case effectively disrupts the standard belief-centric paradoxes, and the "evidential policy" move is a philosophically robust way to frame motivated cognition without intention.

  **Least Sure Claim:** *"This moves the moral psychology from 'How did she trick herself?' to 'Why did she lower her standards?'"*
  I am least sure that this shift fully captures the *phenomenology* of self-deception. It explains the mechanism, but it risks making self-deception too cognitive/volitional, potentially sliding back toward the Traditional view it seeks to avoid. This claim goes on the acceptable-variations list: students can argue that focusing on "standards" obscures the affective/unconscious element essential to the feeling of being deceived.
