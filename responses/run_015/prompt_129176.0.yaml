answer: |-
  ### Desiderata for an Account of Moral Objectivity in Light of Cross-Cultural Variation

  To construct a metaethical account of moral objectivity that accommodates the empirical findings of Moral Foundations Theory (MFT)—specifically the divergence between WEIRD (Western, Educated, Industrialized, Rich, Democratic) and non-WEIRD populations—the following criteria must be met. These desiderata are designed to navigate the tension between the near-universality of Harm/Care and the structural variability of Loyalty/Authority/Purity.

  #### 1. The Salience-Existence Distinction
  *   **Definition:** The account must distinguish between a moral foundation being cognitively or normatively *absent* in a culture versus being *present but deprioritized*.
  *   **Motivating Case:** This protects the empirical observation regarding **Harm/Care**. While Harm judgments are near-universal, their *weight* relative to other foundations varies. A theory must not interpret the WEIRD prioritization of Harm over Loyalty as evidence that non-WEIRD cultures lack a concept of harm, nor interpret the non-WEIRD prioritization of Loyalty as evidence that WEIRD cultures lack a concept of loyalty. It prevents the error of conflating *moral silence* with *moral disagreement*.
  *   **Status:** **Non-negotiable for any adequate metaethics.** Any theory failing to map the phenomenological data accurately is descriptively inadequate, regardless of its normative commitments.

  #### 2. The Conceptual Structure Constraint
  *   **Definition:** The account must accommodate variation not only in the *weighting* of moral values but in their *conceptual constitution*. It must allow that the same label (e.g., "Loyalty" or "Purity") may refer to structurally distinct moral relations in different cultural contexts.
  *   **Motivating Case:** This protects the distinction between **weighting differences and genuine incommensurability**. In some non-WEIRD contexts, Loyalty is framed as *hierarchical reciprocity* (duties flowing up/down a chain), whereas in WEIRD contexts, it is often reframed as *communal sharing* (duties flowing between equals). If an objective theory treats these as identical moral properties with different weights, it misdescribes the phenomenology. The theory must explain how objectivity holds when the *relata* of the moral judgment differ.
  *   **Status:** **Non-negotiable for any metaethics taking variation seriously.** (However, Universalist Realists often struggle to meet this without reductionism).

  #### 3. The Consensus-Independence Condition
  *   **Definition:** The truth conditions of moral propositions cannot be solely determined by the degree of intersubjective agreement across cultures.
  *   **Motivating Case:** This protects the distinction between **intersubjective convergence and mind-independent moral truth**. Given the WEIRD/non-WEIRD divergence, there is no global consensus on the binding foundations. If objectivity were defined by convergence, moral truth would vanish in domains of disagreement (e.g., Purity). An objective account must allow for the possibility that the majority (or the WEIRD minority) could be mistaken about the moral status of purity violations.
  *   **Status:** **Camp-specific (Objectivist/Realist).** Relativists and Constructivists explicitly reject this, defining truth via agreement or framework coherence.

  #### 4. The Commensurability Requirement
  *   **Definition:** The account must provide a rational metric or procedure for adjudicating trade-offs between conflicting foundations (e.g., Harm vs. Loyalty) without declaring them rationally incomparable.
  *   **Motivating Case:** This protects the possibility of **moral progress and critique**. If Harm and Purity are incommensurable (a "brute" pluralist view), then criticizing a culture for sacrificing Harm to preserve Purity becomes merely an external preference, not an objective critique. Objectivity requires that there be a fact of the matter about whether a specific trade-off is justified, even if difficult to calculate.
  *   **Status:** **Camp-specific (Universalist Realist/Monist).** Moral Pluralists and Relativists often deny this, accepting that different frameworks may have no common measure.

  #### 5. The Error-Theoretic Restraint
  *   **Definition:** The account should not entail that large swathes of human moral experience (specifically non-WEIRD binding foundations) are systematically illusory or false, unless necessitated by stronger constraints.
  *   **Motivating Case:** This protects the **veridicality of folk morality**. If an objective theory defines morality strictly through WEIRD individualizing foundations (Harm/Fairness), it renders non-WEIRD binding foundations (Loyalty/Authority/Purity) as massive errors. While possible, this is a high cost. An adequate theory should attempt to vindicate the cognitive legitimacy of these variations where possible.
  *   **Status:** **Camp-specific (Moderate Realist/Pluralist).** Hard Naturalists or Kantians may accept high error costs; Pluralists seek to minimize them.

  ***

  ### Analysis of Joint Unsatisfiability

  Given the empirical pattern of MFT, the following subset of requirements appears **jointly unsatisfiable**:

  1.  **The Conceptual Structure Constraint** (Moral concepts vary radically in structure, e.g., Hierarchy vs. Community).
  2.  **The Commensurability Requirement** (There is a single rational metric to weigh these concepts).
  3.  **The Error-Theoretic Restraint** (We should not deem one conceptual structure systematically false).

  **The Conflict:** If "Loyalty-as-Hierarchy" and "Loyalty-as-Community" are structurally distinct moral claims (Constraint 2), they may make contradictory demands on the agent (e.g., obey the chief vs. support the peer). If there is a single rational metric to weigh these (Requirement 4), one structure must be deemed more aligned with moral truth than the other. If one is more aligned, the other is systematically mistaken, violating the Error-Theoretic Restraint (Requirement 5).

  To resolve this, a theory must typically abandon **Commensurability** (moving toward Pluralism), abandon **Error-Theoretic Restraint** (moving toward Universalist Realism that declares non-WEIRD structures mistaken), or abandon **Mind-Independent Objectivity** (moving toward Relativism, which violates the Consensus-Independence Condition).

  ***

  ### The Primary Exclusionary Requirement

  The single requirement that does the most to exclude popular theories is **The Conceptual Structure Constraint**.

  **Reasoning:**
  Most popular objective metaethical theories (e.g., Utilitarianism, Kantian Deontology, Standard Naturalist Realism) operate on the assumption of a **Unified Moral Ontology**. They presume that while cultures may disagree on *applications*, they are arguing about the same underlying properties (e.g., welfare, rationality, or natural goods).
  *   **Utilitarianism** is excluded because it reduces all moral value to a single metric (Harm/Welfare), failing to account for the structural distinctness of Purity or Authority which are not easily reducible to harm-avoidance.
  *   **Kantianism** is excluded because it relies on a specific conception of rational agency that aligns closely with WEIRD individualism, struggling to vindicate the moral rationality of hierarchical reciprocity without treating it as heteronomy.
  *   **Standard Naturalist Realism** is excluded because it seeks to map moral terms to fixed natural properties; if the *concept* of "Purity" refers to "Cosmic Order" in one culture and "Sanitation" in another, there is no single natural property for the realist to latch onto without significant reductionism.

  By demanding that the theory account for *structural* variation in the moral concepts themselves—not just weighting differences—this constraint forces objectivist theories to either become highly complex (e.g., Moral Pluralism) or accept significant error theories, thereby filtering out the most parsimonious and popular universalist accounts.
