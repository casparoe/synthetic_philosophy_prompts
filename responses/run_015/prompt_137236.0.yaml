answer: |-
  This is a specification for a metaphysics of grief. To make Hofstadter's claim literal rather than metaphorical, a theory of persons must navigate the space between the biological fact of separation and the phenomenological fact of connection. It must validate the intuition that a death is a subtraction from the world's total stock of *you*, without resorting to mysticism or collapsing into mere poetry.

  Below are six desiderata. They are ordered from the ontological (what the thing is) to the normative (what we owe it).

  ### The Desiderata

  **1. The Instantiation Condition (Refining your Point 1)**
  *The Requirement:* The theory must distinguish between *representing* a person and *instantiating* their self-pattern. A biography contains high-fidelity data about you; a friend contains a working model of you. The theory must specify why the friend hosts *you* while the book hosts only *information*.
  *The Case:* A recording of your voice can predict what you would say. A friend can *decide* what you would do. The marker cannot be merely informational content (the biographer knows more). It must be **functional integration**. The pattern of "you" in the friend's brain must be causally active in their decision-making loop, acting as a virtual agent that constrains or guides their behavior in your absence.
  *Non-Negotiable:* If the pattern is passive (a record), it is a memorial. If it is active (a governor), it is a locus. The theory must define the threshold of causal activity required to move from "memory" to "presence."

  **2. The Metric Condition (Refining your Point 2)**
  *The Requirement:* The theory must provide a coherent unit for "how much" of a person exists. It must explain whether selfhood is conserved, dilutable, or amplifiable.
  *The Case:* If you are realized in ten friends, is there *more* of you in the world than if you are realized in one? If one friend dies, is the total quantity of "you" reduced, or just redistributed? If the theory claims a "share" dies, it implies a finite sum. If it claims you are "amplified" by being known, it implies a generative sum.
  *Non-Negotiable:* The theory cannot be vague about aggregation. It must state whether the "self" is a zero-sum resource distributed across substrates or a non-rivalrous pattern that gains ontological weight through replication. To underwrite grief, it likely needs to be the former (loss is real subtraction); to underwrite legacy, the latter (loss is mitigated by spread). Hofstadter's grief-claim requires the former: a genuine subtraction occurs.

  **3. The Anchor Condition (Refining your Point 3)**
  *The Requirement:* The theory must explain the asymmetry between the source brain and the satellite brains without relying on magic. Why is the skull of origin the "primary" locus, and under what conditions can that primacy shift?
  *The Case:* The Dementia Test. If the source brain degrades (Alzheimer's) while a satellite brain (a devoted child) retains a high-fidelity, active model of the parent's self, where does the "center of gravity" reside? If the theory says the parent is "still here" in the original skull despite the pattern being destroyed, it fails the Instantiation Condition. If it says the parent has "moved" to the child, it risks implying multiple full persons.
  *Non-Negotiable:* Primacy must be tied to **pattern integrity and causal origin**, not just biological tissue. The theory must allow for the "death" of the primary instance while secondary instances persist, acknowledging that the *authority* of the self may migrate to the highest-fidelity remaining host.

  **4. The Drift Condition (Refining your Point 5)**
  *The Requirement:* The theory must account for diachronic divergence. It must specify when a hosted pattern becomes a descendant rather than a part.
  *The Case:* The Heresy Test. Thirty years after your death, the friend who hosts you adopts a political view you would have found abhorrent. Is this a corruption of *you*, or the emergence of *them*? If it is a corruption, you are being misrepresented. If it is emergence, you are no longer there.
  *Non-Negotiable:* There must be a tolerance for **adaptive drift**. A static copy is a recording (violating Instantiation). A living copy must update based on the host's new experiences. The theory must define the "core" of the pattern that must remain stable (values? voice? logical structure?) versus the "periphery" that is allowed to update. Without this, the hosted self is a fossil, not a participant.

  **5. The Normative Condition (Adding to your list)**
  *The Requirement:* The theory must underwrite obligations. It must explain how one can *betray* or *honor* the dead person who exists within them.
  *The Case:* The Betrayal Test. If a part of you lives in me, and I act against your core values, have I harmed *you*? Standard metaphysics says no; you are dead and cannot be harmed. Hofstadter's claim implies yes; I am damaging a living part of your self.
  *Non-Negotiable:* The theory must grant the distributed pattern **moral status**. If the pattern in my head is *you*, then my actions toward that pattern are actions toward you. This is essential for the grief-claim to work: it justifies the feeling that we can "keep someone alive" through fidelity, or "kill them again" through neglect.

  **6. The Phenomenological Condition (Refining your Point 6)**
  *The Requirement:* The theory must address the "For Whom?" problem. It must state clearly whether this distribution constitutes survival *for the subject* of the experience.
  *The Case:* The Dark Room Test. You die. Your pattern runs in my brain. I think your thoughts. But *you* do not experience them. There is no co-consciousness. Your stream of experience ended at death. In what sense is this *your* survival?
  *Non-Negotiable:* The theory must either (A) deny that subjective continuity is necessary for "survival of the self" (redefining survival as pattern-persistence) or (B) posit a mechanism of shared access (which violates physicalism). To remain usable at a grave without nonsense, it must likely choose (A): it must argue that *being thought* is a form of *being*, even if the original subject cannot access it.

  ***

  ### Incompatibilities and Resolutions

  There are two pairs of requirements that cannot be jointly satisfied without modifying our standard intuitions.

  **Pair 1: The Metric Condition (Degrees) vs. Classical Identity (All-or-Nothing)**
  *The Conflict:* Classical logic dictates that Person A is either identical to Person B or not. There is no "0.4 identical." However, the Metric Condition demands that there can be "more" or "less" of you in different brains.
  *Resolution:* **Drop Classical Identity.** To make Hofstadter's claim true, we must abandon the notion that persons are discrete, indivisible substances. We must adopt a **constituent ontology**, where "personhood" is a aggregate of patterns that can be fractionated. If we keep Classical Identity, the claim reduces to metaphor ("part of me" becomes "memory of me"). To make it literal, identity must be gradable.

  **Pair 2: The Phenomenological Condition (Subjective Survival) vs. The No Co-consciousness Fact**
  *The Conflict:* You ask if the survival is "for the subject of my experience." If there is no transfer of memory access and no shared consciousness (which physicalism guarantees), then *you* do not experience the life of the copy. The subject who wanted to survive is gone.
  *Resolution:* **Drop Subjective Survival.** This is the hardest pill, but necessary. If we insist that *you* must experience the continuation, the theory fails (unless we posit souls). To make the claim usable at a grave, we must redefine "survival" not as the continuation of the *witness*, but as the continuation of the *witnessed*. The "I" that survives is the objective pattern, not the subjective eye. We must accept that the comfort offered is not "you will go on seeing," but "what you saw and made will go on seeing."

  ***

  ### The Most Exclusionary Requirement

  The single requirement that excludes the most candidates is **The Phenomenological Condition (specifically the demand that it works without Co-consciousness).**

  *Reasoning:*
  1.  **Religious/Spiritual Views:** Almost all exclude themselves here because they promise *continued subjective experience* (heaven, reincarnation, ghosts). Hofstadter's view offers none.
  2.  **Standard Lockean Psychological Continuity:** Usually requires a connected chain of memory *accessible* to the successor. If I cannot access your memories, standard Lockeanism says I am not you.
  3.  **Animalism:** Excluded immediately because it ties the person to the single organism.
  4.  **Parfitian Reductionism:** This is the closest survivor, but Parfit often treats the "survival" as a matter of degree that renders the "identity" question empty. Hofstadter wants the identity claim to remain *full* ("a genuine part of me"), just distributed.

  The demand that a theory validate the *reality* of the distributed self ("I am there") while admitting the *total absence* of the original subject's experience ("I do not see what I see") is a razor's edge. Most theories slide to one side: either they promise spiritual continuity (false comfort) or they admit total cessation (no comfort). Hofstadter's specification demands we hold both: cessation of the subject, persistence of the object.

  ***

  ### Scorecard

  **Parfit-Style Reductionism**
  *Passes:* Metric Condition (degrees of relation), Drift Condition (psychological connectedness).
  *Fails:* Normative Condition. Parfit tends to dissolve the "self" so thoroughly that "betraying the dead" loses its metaphysical sting; it becomes just breaking a promise to the living. It struggles to say a *part* of you died, only that relations ceased.

  **Neo-Lockean Psychological Continuity**
  *Passes:* Instantiation Condition (focus on psychology over biology).
  *Fails:* Metric Condition and Phenomenological Condition. Lockeanism usually demands a single, continuous stream of consciousness. It cannot easily handle "fractional" identity across multiple brains without co-consciousness.

  **Animalism (Biological View)**
  *Passes:* Anchor Condition (the organism is primary).
  *Fails:* All others. If the person is the organism, the person is 100% in the skull and 0% elsewhere. When the organism dies, the distribution claim becomes strictly metaphorical.

  **Strange-Loop/Pattern View (Hofstadter)**
  *Passes:* Instantiation, Metric, Anchor (with migration), Normative. It is the only view that treats the "part of me in you" as an ontological reality capable of being harmed.
  *Fails:* Phenomenological Condition (by the subject's own lights). It succeeds only if the griever accepts that "being real to others" is a sufficient form of existence to count as "survival," even if the "I" that cares is extinguished. It trades the comfort of *continued experience* for the comfort of *continued relevance*.
