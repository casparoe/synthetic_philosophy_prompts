prompt: |-
  Hey — I host a podcast on science and ideas (general audience, but a lot of working scientists and grad students listen), and next week Im recording an episode with a guest who works on wild animal welfare. She runs a small field program and her line is that conservation has spent a century optimizing the wrong quantity: ecologists manage habitats for head counts, biomass, and genetic diversity, and basically never for what the lives inside those populations are actually like for the animals living them.

  Her constructive proposal is what she calls welfare-adjusted carrying capacity — instead of asking how many individuals a habitat can hold, ask how much net welfare it can hold, and manage toward that number. Her flagship pilot, as she described it to me on the pre-interview call, is something like analgesic-laced bait blocks put out for roe deer over winter in a large fenced reserve, paired with immunocontraception so the population doesn't just rebound into the same starvation bottleneck the following year. She also said, and this is the bit I want to push on, that the standard population-compensation objection (make life better, you get more lives, and you're back where you started or worse) is "empirically weaker than people assume," and that conservation already intervenes constantly — culls, reintroductions, fire suppression, fencing — so "let nature be" isn't actually an option anyone is offering.

  I've read enough around this to know the shape of the argument but not enough to know where it's soft, and I definately don't want an hour of her restating the manifesto.

  So: draft me ten to twelve questions in the order you'd ask them, each with a follow-up keyed to the answer she's most likely to give — the follow-up is the part I actually need, since I can predict her first answer to most of these. I want at least one question each on: whether the claim that wild lives are net-negative is even measurable with current field methods (time budgets, stress physiology, whatever), whether her own welfare-adjusted metric quietly commits her to population suppression rather than population welfare, whether her framework has a principled line at "we don't touch predators" or whether that's just a cost-benefit judgment that could in principle flip, and what specific field result would make her shut the pilot down. I also want one question on who gets to decide, for people who actually live with these animals, and one closing question that makes the bullet-biting version of the view audible — that fewer sentient animals in a landscape might be the thing the metric is reaching for, not a side effect.

  Two more things. Flag which of the questions rest on a contested empirical assumption rather than on something she'd have to grant, because I don't want to sandbag her with a confident-sounding claim I can't defend. And tell me, in a short note at the end, which single answer from her would most change your own sense that this is a serious research program rather than utilitarianism with a field station attached — I want to know what would move you, not just what would move her, and where your read is most likely to be wrong. Also tell me which of my questions she's most likely to swat away with "that's an empirical research question, not an objection to the framework," and give me the version of that question that closes the exit.
