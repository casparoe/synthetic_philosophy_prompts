  hey im putting together a taxonomy for a seminar on whether societies actually "collapse" or just rearrange themselfs. i want a decision tree that takes you from the three usual suspects—Late Bronze Age mediteranean, Classic Maya lowlands, Easter Island—to a named position. branch on four questions: (1) is demographic drop enough, or do you need state instutions to actually vanish? (2) is ecological damage necessary or just one route? (3) does it matter if people at the time felt a rupture, vs seeing it as slow change? (4) if writing/ritual/language survives but palaces disappear, is that still collapse?

  each leaf should name a stance (or "unnamed") and note its weirdest commitment—e.g. saying Maya didnt collapse cuz they kept speaking Mayan, or that Easter Island collapsed even though folks never left. flag branches where two positions land on the same leaf, especially ones that differ only on who writes the narrative. dont need a reading list, just the tree.
