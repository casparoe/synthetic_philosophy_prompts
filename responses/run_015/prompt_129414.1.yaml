answer: |-
  # SEMINAR TAXONOMY: COLLAPSE VS. REARRANGEMENT

  **ROOT NODE:** Select Case Study
  *   **A:** Late Bronze Age Mediterranean (LBA)
  *   **B:** Classic Maya Lowlands
  *   **C:** Easter Island (Rapa Nui)

  ---

  ## BRANCH 1: Q1 (Severity)
  **Is demographic drop enough, or do state institutions need to actually vanish?**

  *   **YES (Demography is sufficient):** *Population loss = Collapse.*
      *   → Go to **Branch 2**
  *   **NO (Institutions must vanish):** *Political complexity = Collapse.*
      *   → Go to **Branch 2**

  ## BRANCH 2: Q2 (Causality)
  **Is ecological damage necessary or just one route?**

  *   **YES (Ecology is necessary):** *Environmental determinism.*
      *   → Go to **Branch 3**
  *   **NO (Ecology is contingent):** *Multi-causal/Political.*
      *   → Go to **Branch 3**

  ## BRANCH 3: Q3 (Experience)
  **Does it matter if people at the time felt a rupture, vs seeing it as slow change?**

  *   **YES (Phenomenology matters):** *If they didn't feel it, it isn't collapse.*
      *   → Go to **Branch 4**
  *   **NO (Archaeology matters):** *Objective data overrides subjective experience.*
      *   → Go to **Branch 4**

  ## BRANCH 4: Q4 (Culture)
  **If writing/ritual/language survives but palaces disappear, is that still collapse?**

  *   **YES (Palaces define society):** *Elite culture = Society.*
      *   → **LEAF**
  *   **NO (Language defines society):** *Popular culture = Society.*
      *   → **LEAF**

  ---

  ## LEAVES (POSITIONS & COMMITMENTS)

  ### LEAF 1: The "Ecocide" Stance
  *   **Path:** Q1(Yes) → Q2(Yes) → Q3(No) → Q4(Yes)
  *   **Named Position:** **Hard Collapse (Diamond/Tainter variant)**
  *   **Weirdest Commitment:** On Easter Island, you must argue society "ended" pre-contact because trees died, even if the people adapted, ate sweet potatoes, and survived until Europeans arrived.
  *   **Case Fit:** Rapa Nui (Traditional view), LBA (Partial).

  ### LEAF 2: The "Elite Failure" Stance
  *   **Path:** Q1(No) → Q2(No) → Q3(No) → Q4(Yes)
  *   **Named Position:** **Political Termination (Demarest)**
  *   **Weirdest Commitment:** The Maya "Collapse" is real, but only for kings. You must argue a peasant living in the same house, farming the same land, is living in a "collapsed" society solely because the king stopped taxing him.
  *   **Case Fit:** Classic Maya.

  ### LEAF 3: The "Resilience" Stance
  *   **Path:** Q1(No) → Q2(No) → Q3(No) → Q4(No)
  *   **Named Position:** **Transformation/Continuity (McAnany & Yoffee)**
  *   **Weirdest Commitment:** The LBA didn't collapse because rural pottery styles continued uninterrupted. You must treat the loss of international trade networks as less significant than the persistence of local cooking traditions.
  *   **Case Fit:** Classic Maya, LBA (Revisionist).
  *   **[CONVERGENCE WARNING]:** *Marxist Materialists* and *Post-Processualists* often land here together.
      *   *Difference:* Marxists say "Class structure persisted." Post-Processualists say "Daily habitus persisted." They agree on the leaf (No Collapse) but fight over whether the peasant was "resilient" or "exploited."

  ### LEAF 4: The "Discursive" Stance
  *   **Path:** Q1(No) → Q2(No) → Q3(Yes) → Q4(No)
  *   **Named Position:** **Narrative Collapse (Post-Colonial/Phenomenological)**
  *   **Weirdest Commitment:** The LBA Collapse is fictional because no contemporary text says "The World Ended." If a scribe didn't write an apocalypse poem, the palace burning down is just renovation.
  *   **Case Fit:** LBA (Literary focus).
  *   **[CONVERGENCE WARNING]:** *Oral Historians* and *Deconstructionists* land here.
      *   *Difference:* Oral Historians say "If the community remembers continuity, it continued." Deconstructionists say "Collapse is a label applied by later elites to legitimize new power." Both deny objective collapse, but one trusts memory, the other trusts nothing.

  ### LEAF 5: The "Malthusian" Stance
  *   **Path:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(Yes)
  *   **Named Position:** **Biological Reset (Neocatastrophist)**
  *   **Weirdest Commitment:** On Easter Island, you must argue people *felt* the end coming (rupture) and died in droves (demography) specifically due to soil exhaustion, dismissing evidence of European disease as the primary killer.
  *   **Case Fit:** Rapa Nui (Diamond's strongest claim).

  ### LEAF 6: The "Unnamed" Stance (The Contradiction)
  *   **Path:** Q1(Yes) → Q2(No) → Q3(Yes) → Q4(No)
  *   **Named Position:** **UNNAMED / THEORETICAL GLITCH**
  *   **Weirdest Commitment:** You argue population died off (Q1-Yes) due to politics/war (Q2-No), the survivors felt it was slow change (Q3-Yes), but their language survived (Q4-No).
  *   **Note:** This position is unstable. If population died off, usually survivors feel a rupture. If language survived, usually demography didn't drop critically. This leaf captures **inconsistent seminar arguments**.
  *   **[CONVERGENCE WARNING]:** *Graduate Students under deadline pressure* often land here.

  ---

  ## SEMINAR INSTRUCTOR NOTES ON CONVERGENCE

  **The "No Collapse" Trap (Leaf 3 vs Leaf 4):**
  Be careful when students argue the Maya didn't collapse.
  *   **Student A (Leaf 3)** will show you pottery shards and settlement patterns (Archaeological Continuity).
  *   **Student B (Leaf 4)** will show you colonial chronicles and oral histories (Narrative Continuity).
  *   **The Conflict:** They arrive at the same conclusion ("No Collapse") but will disagree violently on *evidence*. Student A thinks Student B is unscientific; Student B thinks Student A is colonial. **Flag this in discussion.**

  **The "Rapa Nui" Exception (Leaf 1 vs Leaf 5):**
  Both require Ecological Determinism (Q2-Yes).
  *   The split is on **Experience (Q3)**.
  *   If they say Islanders *felt* the collapse (Q3-Yes), they lean into moralizing (they knew they were destroying their world).
  *   If they say Islanders *didn't feel* it (Q3-No), they lean into tragedy (they were blind victims of systems).
  *   **The Conflict:** One blames the ancestors; the other pities them. Same data, different moral judgment.
