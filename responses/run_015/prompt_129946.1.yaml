answer: |-
  Here is the 45-minute teaching arc designed for tech journalists. It avoids academic definitions and focuses on narrative mechanics.

  ### 1. The Anchor Concept (Minutes 0–5)
  **The Idea That Must Land First:** *"Survivor Bias of Time."*

  Do not start with Herbert Butterfield or 19th-century historiography. Start with a concept they already use in data reporting: **Survivor Bias**.
  *   **The Pitch:** "You know how if you analyze surviving planes from a war, you miss the ones that got shot down? Whig history is **Survivor Bias applied to time.** We look at the ideas that 'survived' to become today's tech and assume they were the only ones capable of survival."
  *   **Why this first:** Tech journalists understand data bias. Framing Whig history as a *sampling error* rather than a philosophical sin makes it a technical flaw in their reporting, which they are trained to fix.
  *   **The Hook:** "If you write a story where the past looks like it was trying to build the present, you are committing sampling error."

  ### 2. The Carrying Example (Minutes 5–20)
  **The Case:** *1950s Cybernetics vs. Modern AI.*

  Do not use the Turing Test. Use **Norbert Wiener's Cybernetics.**
  *   **The Whig Version (The Trap):** "In the 1940s, Norbert Wiener invented cybernetics, laying the groundwork for neural networks and modern AI. He was trying to solve the same problem we are: how to make machines think."
  *   **The Reality (The Correction):** Wiener wasn't trying to make machines "think" in the human sense; he was trying to understand **control and communication** in animals and machines to prevent automation from destroying society. He was wary of the very "AI" narrative that claims him as a father.
  *   **The Distortion:** By framing Cybernetics as "Early AI," we erase the *social/ethical* branch of the tree (feedback loops, societal impact) and keep only the *technical* branch (pattern recognition). We make Wiener look like a proto-Sam Altman, when he was actually more of a proto-Ethan Zuckerman.
  *   **The Lesson:** The past wasn't "trying" to become Transformers. The past had different goals, and we are retroactively editing them to match our current funding cycle.

  ### 3. The Misconception & Intervention (Minutes 20–30)
  **The Misconception:** *"If there's real progress, then it's not Whig history."*
  *   **Where they will push back:** Right after the Cybernetics example. A journalist will say, "But we *did* make progress. LLMs *are* more advanced than perceptrons. Acknowledging that lineage isn't Whig history."
  *   **Where to head it off:** **Immediately during the example debrief.** Do not wait for Q&A.
  *   **The Counter:** Distinguish **Lineage** from **Teleology**.
      *   *Valid Lineage:* "Model A influenced Model B." (Fact)
      *   *Whig Teleology:* "Model A existed *in order to produce* Model B." (Fiction)
      *   **The Script:** "Progress is real. Inevitability is the lie. Whig history isn't saying nothing changed; it's saying the change had a *destination*. If you write that the 1980s AI Winter was just a 'speed bump' on the road to 2024, you're Whigging. It wasn't a speed bump; it was a dead end that we luckily found a way around. Treat it like a near-death experience, not a plot point."

  ### 4. The Final Check (Minutes 30–40)
  **The Exercise:** *The Headline Diagnosis.*

  Put this fake headline on the screen:
  > **"From Babbage to Bots: The 200-Year Inevitable March to Generative AI"**

  **The Task:** Ask them to identify the three Whig markers in the headline.
  **The Answer Key:**
  1.  **"From Babbage":** Implies Babbage's mechanical difference engine is the same *category* of object as an LLM (ignoring that Babbage was doing math, not 'intelligence').
  2.  **"Inevitable":** The explicit claim of determinism.
  3.  **"March":** Implies a continuous, unbroken forward motion (erasing the AI Winters, the dead ends, and the shifts in definition).

  **The Fix:** Ask them to rewrite it non-Whig.
  *   *Better:* "How Generative AI Resurrected Ideas from the Age of Babbage." (Implies discontinuity and active choice, not a march).

  ### 5. What to Flat-Out Skip (To stay within 45 mins)
  1.  **Butterfield's Biography:** Who he was, when he wrote *The Whig Interpretation of History*, and the context of 1930s Cambridge. Irrelevant.
  2.  **The "True History" Debate:** Do not get into whether objective history is possible. Keep it pragmatic: "Is this a useful story for a reader?"
  3.  **Other Examples:** Do not bring up Newton/Einstein or the History of Medicine. Stick strictly to AI/Computing. Context switching kills momentum.
  4.  **Moralizing:** Do not frame Whig history as "evil." Frame it as "boring." It removes conflict, agency, and surprise from their stories. A story without contingency is a press release, not journalism.

  ### Summary of Flow
  1.  **0-5:** Survivor Bias of Time (The Intuition).
  2.  **5-20:** Cybernetics Example (The Evidence).
  3.  **20-30:** Progress vs. Inevitability (The Objection).
  4.  **30-40:** Headline Rewrite (The Tool).
  5.  **40-45:** Buffer/Q&A.
