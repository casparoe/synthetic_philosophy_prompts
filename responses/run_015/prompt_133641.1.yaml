  ### Slide: Risk Score Calibration ≠ Equal Burden
  **Thesis:** Equal TPR + Calibration does **not** guarantee equal False Positive Rates (FPR) when base rates differ.

  | **Group A (High Risk)** | **Count** | **Y=1 (Events)** | **Score** | **Group B (Low Risk)** | **Count** | **Y=1 (Events)** | **Score** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Flagged** ($\ge 0.5$) | **200** | **180** | **0.90** | **Flagged** ($\ge 0.5$) | **120** | **60** | **0.50** |
  | Unflagged | 800 | 120 | 0.15 | Unflagged | 880 | 40 | 0.045 |
  | **Total** | **1000** | **300** | **Base: 30%** | **Total** | **1000** | **100** | **Base: 10%** |

  **Performance & Harm Metrics**
  *   **TPR (Sensitivity):** Both **60%** (180/300 vs 60/100). *Raj's condition met.*
  *   **Calibration:** Exact within all bins (e.g., Group B Flagged: 60/120 = 0.50).
  *   **FPR (False Alarm Rate):** Group A **2.9%** (20/700) vs Group B **6.7%** (60/900). **Group B burden is 2.3× higher.**
  *   **Unnecessary Monitoring:** **20** patients in A vs **60** patients in B pulled in unnecessarily.
  *   **AUC:** 0.78 (A) vs 0.76 (B). Scores are equally informative; disparity is not due to "garbage" scoring.

  **Why This Happens (The Math)**
  *   For flagged patients at score $s$: $FPR = TPR \times \frac{\text{Base}}{1-\text{Base}} \times \frac{1-s}{s}$.
  *   **Driver:** Group B patients cluster near the threshold ($s=0.5$), while Group A clusters at high confidence ($s=0.9$).
  *   **Fragility:** If we forced the *same score cut* (e.g., only flag $s=0.9$), Group B's FPR would drop to near-zero, flipping the disparity to the "intuitive" direction (Higher FPR for Higher Base).
  *   **Reality:** The model is less confident in Group B, forcing us to cast a wider net (lower $s$) to catch the same % of events, dragging in more false positives.

  **Raj's Objection & Reply**
  *   **Raj:** "You tuned the threshold implicitly by letting the score distribution differ. If the score is calibrated, the risk is the risk."
  *   **Reply:** "Calibration ensures a flagged patient in B has 50% risk, and in A has 90% risk. But our *resource constraint* (nursing time) is per patient, not per risk-point. We pay the same cost to monitor a 50% risk patient as a 90% risk patient. By accepting lower-confidence flags in Group B to match TPR, we incur higher operational cost per true event prevented."

  ***

  ### Speaker Notes / Backing Arithmetic (For Q&A)
  1.  **Exact Calibration:** Group A Flagged $180/200=0.9$. Group B Flagged $60/120=0.5$. Unflagged bins also match scores exactly.
  2.  **TPR Equality:** $180/300 = 0.60$. $60/100 = 0.60$.
  3.  **FPR Disparity:** $20/700 \approx 0.0286$. $60/900 \approx 0.0667$. Ratio $2.33$.
  4.  **PPV > Base:** Group A $90\% > 30\%$. Group B $50\% > 10\%$. Flags are informative.
  5.  **AUC Calculation:** A: 0.78. B: 0.76. Difference < 0.05.
  6.  **Fragility Check:** If Group B cut at $s=0.9$ (like A), they have 0 patients there. FPR=0. If both cut at $s=0.5$, Group A FPR rises to match Group B's prevalence scaling, restoring "Higher Base = Higher FPR". The current harm comes from the *score distribution*, not the threshold number itself.
