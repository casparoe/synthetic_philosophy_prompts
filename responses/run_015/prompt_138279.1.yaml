  OFFICE FOR DEMOGRAPHIC TRANSITION
  Guidance Note 44/B: Completion of Form P7 (Assessment of Non-Existence Benefit)
  Issued: 14 November 2023 | Status: Statutory | Review Cycle: Annual

  1. PURPOSE AND STATUTORY BASIS
  1.1 This document provides mandatory instruction for Local Authority officers processing Procreative Licences under the Asymmetry Principle (2018). The Principle establishes that while the presence of pain is bad and the presence of pleasure is good, the absence of pain is good even if no one exists to experience that good, whereas the absence of pleasure is not bad unless there is someone who is thereby deprived.
  1.2 Officers must ensure that no assessment relies on the welfare of the Prospective Person. Form P7 contains no box for predicted quality of life, life satisfaction, or potential suffering. Entry of such data will trigger a validation error. The Prospective Person is not a stakeholder. They are a variable affecting the ledger of existing persons and the abstract count of unowned goods. Officers must not infer a beneficiary where none exists.

  2. ADMISSIBLE EVIDENCE AND LEDGERING
  2.1 Applicants must demonstrate a net welfare gain for existing persons only. This includes current parents, siblings, or dependents. Forecasts regarding parental happiness must be subjected to empirical discount rates. Standard optimism bias is set at 15%; hedonic adaptation is set at 10%. Evidence must be documentary.
  2.2 The benefit of non-existence must be logged in Column G (Unowned Goods). This value accrues to no identifiable party. It is a state of affairs, not a receipt. Officers should note that Column G often outweighs Column H (Existing Persons' Welfare). However, Statutory Override 7 permits licensing where the gain to existing persons is substantial, provided no benefit is ascribed to the Prospective Person.
  2.3 The "Consent Argument" is expressly prohibited. Section 3 of the 2018 Act clarifies that consent requires a subject capable of withholding it. To claim a Prospective Person cannot consent is to illicitly instantiate them as a rights-bearer. Officers striking out this reasoning on Form P7 should initial the margin and cite Guidance Note 12/A. Do not suggest the child is being protected; suggest only that the argument is logically invalid.

  3. WITHDRAWN PROVISIONS AND CORRECTIONS
  3.1 Previous iterations of this guidance included Clause 4.2 (Minimum Welfare Threshold), which permitted refusal where the Prospective Person's suffering was deemed probable. This was withdrawn in Revision 3. The Department apologises for implying a subject existed to suffer. Pain is only bad if experienced; the avoidance of pain is good regardless. The previous clause conflated these distinct valuations. Officers must not use the withdrawn forms.
  3.2 Clause 4.5 (Proxy-Consent Procedure) was similarly rescinded. There is no proxy for a non-entity. Officers found using the term "best interests of the child" during interviews will be referred to Compliance. We regret any confusion caused by the previous suggestion that a duty of care could be owed to a potentiality. No such duty exists. The error has been corrected in the digital interface.

  4. WORKED EXAMPLES
  4.1 Case Ref: 8821. Applicants cited "opportunity for a good life" as primary justification. They argued the child would enjoy sunshine and education. Application refused. The pleasure foregone by the Prospective Person is not a harm. The stated benefit is inadmissible. The absence of the child's suffering was logged in Column G as a positive value. The parents' desire for joy was deemed insufficient to override the unowned good.
  4.2 Case Ref: 9044. Applicants demonstrated a significant reduction in maternal health risks and financial stability for existing dependents. The optimism bias discount was applied to the parents' forecast happiness at 15%. The net gain for existing persons outweighed the unowned benefit of non-existence under Statutory Override 7. Application granted. Note: The grant letter must not congratulate the applicants on benefiting the Prospective Person. It should state only that existing welfare metrics were met.

  5. APPENDIX: QUESTIONS THE DEPARTMENT HAS DECLINED TO ANSWER
  Q: Who enjoys the absence of pain?
  A: No one.
  Q: Why is the absence of pain good if no one enjoys it?
  A: It simply is.
  Q: If non-existence is preferable, why does the Department exist?
  A: To administer the preference.
  Q: Does this guidance apply to the Department's staff?
  A: See Section 1.1.

  6. FINAL NOTE
  The Office for Demographic Transition remains operational pending further review of its own necessity. Staff are reminded that their own existence generates suffering, but their absence would deprive existing citizens of administrative support. The balance is currently being calculated.
