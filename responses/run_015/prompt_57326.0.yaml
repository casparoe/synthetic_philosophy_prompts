prompt: |-
  I write about mind science for a general-audience outlet and I'm working on the endless fight over whether cognition gets inside perception. My editor wants a case, not a lit review, so build me one.

  Specs: a perceptual experience that's genuinely cognitively penetrated by Pylyshyn's lights — the cognitive state has to be doing work inside the perceptual computation, not just steering attention around the input — where the belief formed on the basis of that experience comes out *better* justified than the belief the same subject would have formed from an unpenetrated experience of the same scene. I want Siegel's downgrade argument blocked outright, not merely dented, because that's the actual point of my piece: whether the epistemological worry survives when the penetration comes from knowledge rather than from wishful thinking.

  Constraints: one paragraph for the scenario itself; real-world setting (clinic, control room, kitchen, warehouse floor, whatever); no VR, no neural implants, no hallucinations; an ordinary person doing an ordinary task, not a savant. The penetrating state has to be a belief or a body of expertise — not a fear or a desire. And dont let the penetrating belief simply contain the content of the perceptual belief; that's a circle, not a case.

  Then show your work: name the penetrated experience and the penetrating state; explain why the causal route can't be reduced to attention re-weighting the input; state the belief and say precisely what makes it better justified than its unpenetrated counterpart; pin down which single feature of the case is doing the anti-downgrade work, and what happens to the verdict if you swap that feature out — in particular, if the penetrating belief is replaced by a desire with the same content. Finish with how a downgrade theorist would refuse the case: which premise they attack and what they'd say in reply.
