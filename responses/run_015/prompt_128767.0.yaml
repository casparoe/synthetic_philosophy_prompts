answer: |-
  **MEMORANDUM OF PROCEDURE**
  **TO:** Editorial Board, Literary Estate of [Author Name]
  **FROM:** Co-Executor
  **SUBJECT:** Protocol for Textual Authority and Revision Adjudication (The "Layered Intent" Protocol)
  **DATE:** October 26, 2023

  ### PREAMBLE: THEORETICAL FOUNDATIONS FOR NON-SPECIALISTS

  This procedure translates complex questions of textual authority into actionable steps. It relies on two distinct concepts derived from the philosophy of language and genetic criticism:

  1.  **Executive Intention (The Act):** Evidence that the author voluntarily and consciously performed a physical alteration to the text (e.g., crossing out a word, adding a margin note). *Question: Did they mean to make this mark?*
  2.  **Interpretive Intention (The Meaning):** Evidence that the author intended the alteration to permanently redefine the work's public meaning, consistent with their broader philosophical or aesthetic project. *Question: Did they mean for this mark to change how the work is understood?*

  **Core Principle:** A physical alteration (Executive) does not automatically override the primary text unless it is supported by evidence of coherent purpose (Interpretive). In cases of documented cognitive decline, Executive Intention is presumed compromised unless proven otherwise.

  ---

  ### PART 1: THE DECISION PROTOCOL (CHECKLIST)

  *Instructions: Apply these steps sequentially to every ambiguous passage. Do not skip steps. If a step yields a definitive "Stop," proceed to the Disposition listed.*

  **Step 1: Chronological Stratification (The "When" Test)**
  *   **Action:** Determine the date of the primary script vs. the date of the revision/annotation. Use ink analysis, handwriting degradation metrics, and diary entries.
  *   **Evidence Required:** Forensic dating or correlation with dated correspondence.
  *   **Decision:**
      *   If Revision is *later* than Primary: Proceed to Step 2.
      *   If Revision is *contemporaneous* (same sitting): Treat as part of the compositional process. **Adopt Revision.**
      *   If Chronology is *inconclusive*: **Flag for Commentary.** (Do not adopt revision).

  **Step 2: Capacity Assessment (The "Cognitive" Test)**
  *   **Action:** Cross-reference the date of the revision with medical records or witness testimony regarding the author's cognitive state.
  *   **Evidence Required:** Medical diagnosis of decline, witness logs of confusion, or documented episodes of incoherence occurring within 3 months of the revision date.
  *   **Decision:**
      *   If Revision falls within a period of *documented significant decline*: **Preserve Primary Text.** (Executive intention is legally and philosophically voided). Add footnote explaining the existence of the revision.
      *   If Capacity is *unimpaired* or *unknown*: Proceed to Step 3.

  **Step 3: Executive Authority (The "Volition" Test)**
  *   **Action:** Assess whether the mark indicates a deliberate decision or a hesitant exploration.
  *   **Evidence Required:**
      *   *Strong Executive:* Heavy cross-out, explicit instruction ("use this instead"), clean interlinear insertion.
      *   *Weak Executive:* Light pencil mark, question mark next to text, multiple conflicting arrows.
  *   **Decision:**
      *   If *Weak Executive*: **Preserve Primary Text.** (Treat as thinking, not deciding).
      *   If *Strong Executive*: Proceed to Step 4.

  **Step 4: Interpretive Coherence (The "Philosophy" Test)**
  *   **Action:** Compare the revision against the author's published theoretical commitments and established correspondence.
  *   **Evidence Required:** Published essays on style/meaning, letters to editors or peers defending specific stylistic choices.
  *   **Decision:**
      *   If Revision *contradicts* established theoretical commitments (e.g., crosses out a metaphor the author publicly defended as essential): **Preserve Primary Text.** (Assume the revision is a momentary doubt, not a philosophical shift). Flag for Commentary.
      *   If Revision *aligns* with or *neutrally expands* commitments: Proceed to Step 5.
      *   *Special Condition (The Anti-Intentionalist Paradox):* If the author explicitly argued that "texts should remain open" or "authors do not control meaning," treat heavy-handed revisions with suspicion. **Preserve Primary Text** unless the revision clearly serves the goal of "opening" the text rather than closing it.

  **Step 5: The Factual Error Check (The "Truth" Test)**
  *   **Action:** Determine if the primary text contains a verifiable factual error (e.g., wrong date, misquoted statute) vs. a debatable claim.
  *   **Evidence Required:** External objective records.
  *   **Decision:**
      *   If *Verifiable Factual Error*: **Correct Silently.** (This is a clerical fix, not an editorial intervention).
      *   If *Debatable Claim/Opinion*: **Preserve Primary Text.** (Editorial judgment on "truth" is outside scope). Proceed to Step 6.

  **Step 6: Final Disposition**
  *   **Adopt Revision:** Only if Steps 1, 2, 3, and 4 are passed.
  *   **Preserve Primary:** If Step 2 (Capacity), Step 4 (Coherence), or Step 5 (Debatable Claim) dictates.
  *   **Flag for Commentary:** If Step 1 (Chronology) is inconclusive, or if Step 4 reveals a conflict between the revision and the author's public stance.

  ---

  ### PART 2: WORKED APPLICATIONS

  The following cases demonstrate how the protocol overrides personal intuition or ambiguous evidence.

  #### Case A: The Cognitive Decline Contradiction
  *   **Scenario:** The primary text (1998) reads: "Memory is a reconstruction." A marginal note in red ink (2004) reads: "Memory is a record." Medical records confirm the author entered a phase of significant memory loss and confusion in late 2003.
  *   **Protocol Run:**
      *   Step 1 (Chronology): Revision is later. (Pass)
      *   Step 2 (Capacity): Revision falls within documented decline. **(FAIL)**
      *   **Result:** **Preserve Primary Text.**
  *   **Rationale:** Even if the red ink is legible (Executive Intention), the author's legal and cognitive capacity to form a binding *Interpretive Intention* is compromised. The estate has a duty of care to protect the author from their own decline. The red ink is recorded in the apparatus criticus but not integrated into the reading text.

  #### Case B: The Cross-Out vs. Correspondence Defense
  *   **Scenario:** The author crosses out a metaphor comparing "language to a cage." However, in a letter to a peer written one week prior, the author states: "The cage metaphor is the load-bearing wall of this entire argument; it cannot be removed."
  *   **Protocol Run:**
      *   Step 1 (Chronology): Revision is later. (Pass)
      *   Step 2 (Capacity): No decline documented. (Pass)
      *   Step 3 (Executive): Heavy cross-out. (Pass)
      *   Step 4 (Coherence): Revision contradicts explicit correspondence defending the metaphor. **(FAIL)**
      *   **Result:** **Preserve Primary Text (with Footnote).**
  *   **Rationale:** This operationalizes the distinction between *Executive* (crossing out) and *Interpretive* (the meaning project). The cross-out may represent stylistic fatigue or momentary doubt, but the *Interpretive Intention* (the argument's structure) was reaffirmed in correspondence. To adopt the cross-out would be to publish a text the author explicitly argued was structurally unsound.

  #### Case C: The Editor's Personal Disagreement
  *   **Scenario:** The primary text contains a claim: "Ethics precedes ontology." You, the editor, believe this is philosophically false and that ontology must precede ethics. There are no revisions. You wish to correct this "error."
  *   **Protocol Run:**
      *   Step 1-4: N/A (No revision).
      *   Step 5 (Factual Error): Is "Ethics precedes ontology" a verifiable factual error? No, it is a philosophical position. **(FAIL)**
      *   **Result:** **Preserve Primary Text.**
  *   **Rationale:** This is where the procedure protects the estate from the editor. The protocol defines "error" strictly as objective fact (dates, names), not philosophical truth. Your judgment is an *interpretive* act, not an *executive* one. Correcting this would violate the author's **Interpretive Intention**. The procedure yields this result *despite* your judgment because the editorial role is archival, not corrective. To change this would be to co-author the text, which violates the executor's fiduciary duty to the deceased's voice.

  ---

  ### PART 3: LIMITATIONS AND SIGN-OFF CLAUSE

  **Statement of Irreducible Ambiguity**

  This procedure is a tool for consistency, not a substitute for judgment. It cannot settle the following categories of issues. In these instances, the protocol halts, and the decision must be made by human consensus, recorded in the Editorial Minutes.

  1.  **The "Value" Halt:** When evidence for Executive Intention and Interpretive Intention are equally weighted (e.g., a clear late revision that contradicts a clear early theoretical statement, with no evidence of cognitive decline). This is a conflict of values (Fidelity to Final Act vs. Fidelity to Coherent System).
  2.  **The "Anti-Intentionalist" Misfire:** If the author's published theory explicitly rejects the stability of the text (e.g., "All drafts are equally valid"), this procedure's attempt to establish a "definitive" text inherently contradicts the author's philosophy. In such cases, the Board must decide whether to honor the *spirit* of the theory (publishing a genetic edition) or the *legal expectation* of a critical edition (a single reading text).
  3.  **The "Harm" Clause:** If preserving the Primary Text exposes living persons to libel or legal liability not covered by the estate's indemnities.

  **Required Sign-Off**

  For any decision falling under the "Limitations" above, or for any deviation from the Protocol results in Parts 1 or 2, the following sign-off is required to validate the editorial choice:

  > **EDITORIAL DEVIATION AUTHORIZATION**
  >
  > We, the undersigned, acknowledge that the decision regarding [Passage ID/Volume Number] falls outside the evidentiary scope of the Layered Intent Protocol. We certify that this decision is based on [Select One: Ethical Consideration / Legal Requirement / Aesthetic Judgment] rather than recoverable fact.
  >
  > We accept joint responsibility for this deviation from the standard procedure.
  >
  > ___________________________
  > **Lead Editor** (Date)
  > *Acknowledges scholarly responsibility for the textual integrity.*
  >
  > ___________________________
  > **Legal Representative of the Estate** (Date)
  > *Acknowledges fiduciary responsibility for the author's legacy and liability.*

  ***

  **End of Procedure**
