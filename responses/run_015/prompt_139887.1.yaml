  **Joint Statement on the Ontology of Dreaming**
  **Signatories:** The Grammatical Critic (Malcolmian) & The Empirical Skeptic (Dennettian)

  **I. Agreed Claims**
  1.  **Rejection of Naive Realism:** We jointly deny the "cinema model": the view that sleepers undergo sequential, sensory-rich adventures in real-time which are subsequently recalled like video playback.
  2.  **Report Dependence:** Dream reports are not transparent windows into sleep; they are waking constructions dependent on waking criteria and memory systems.
  3.  **No Private Fact:** There is no inaccessible, determinate "dream object" existing independently of the report and the behavioral criteria surrounding it.
  4.  **Divergent Rationale:** This agreement is **conclusional, not foundational**. We deny the naive view for incompatible reasons (conceptual vs. empirical).
  5.  **Sleep Activity:** Sleep involves neural activity, but we disagree on whether this activity constitutes "experience" prior to waking reporting.

  **II. Disagreements Table**

  | Disagreement | Neutral Formulation | Malcolmian Wording | Dennettian Wording | Crux, Evidence & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Status of Claim** | Is the denial of dream experience conceptual or empirical? | It is a **grammatical confusion** to apply "experience" criteria to sleep. | It is a **false empirical hypothesis** that experience occurs during sleep. | **Crux:** Can neurology settle conceptual criteria?<br>**Case:** Flat awakenings (colors, no self).<br>**M:** Report lacks standard criteria; not a dream.<br>**D:** Fragmented activation; qualia without narrative. |
  | **2. Temporal Locus** | When does the dream narrative come into existence? | The question is **misplaced**; "during sleep" has no application here. | The narrative is **constructed at awakening** from sparse sleep data. | **Crux:** Does narrative coalesce gradually?<br>**Case:** Slow-awakening protocol (drug-induced).<br>**M:** Reports vary as waking criteria shift.<br>**D:** Narrative detail increases with waking proximity. |
  | **3. Causality & Agency** | Does sleep-time activity cause report content? | External stimuli are **incorporated into the impression**, not experienced then. | Sleep activity **constrains the construction** of the report. | **Crux:** Can action occur in sleep?<br>**Cases:** (1) Sensitivity (sounds/cuffs); (3) Lucid eye signals.<br>**M:** Signals are behavioral criteria met upon waking.<br>**D:** Motor output proves processing during sleep. |
  | **4. Individuation** | Is a dream a distinct event identifiable across reports? | A dream is **identical to the report**; no underlying event exists. | A dream is a **construct**; multiple constructs can arise from one sleep period. | **Crux:** Can one sleep period yield incompatible dreams?<br>**Case:** Re-awakening within same REM.<br>**M:** Second report is a new impression, not same dream.<br>**D:** Reconstruction variance; no fact of the matter. |

  **III. Verbal vs. Substantive Dispute**
  Is this merely a quarrel over the word "experience"? No. The Malcolmian holds that changing the definition of "experience" to include sleep states alters the grammar of our psychological concepts, rendering them useless for distinguishing sleep from waking. The Dennettian holds that "experience" is a natural phenomenon subject to revision based on mechanistic discovery. If we discovered a neural code that perfectly matched detailed dream reports without waking construction, the Dennettian would admit experience occurs during sleep. The Malcolmian would still deny it, arguing that without waking behavioral criteria, the concept "experience" fails to gain purchase. Thus, the dispute is substantive regarding the *conditions of truth* for psychological ascriptions, not merely terminological.

  **IV. Falsification Conditions**
  **For the Dennettian:** Evidence against the cassette view would be a **isomorphic neural recording**. If we could read out a specific, complex narrative sequence from neural activity *during* REM that matches the waking report exactly, without requiring waking reconstruction, the cassette view fails. The dream would be shown to exist as a determinate sequence prior to awakening.
  **For the Malcolmian:** Evidence against the grammatical view is harder, as it is resistant to empirical data. However, if **lucid dreamers** could consistently perform novel cognitive tasks (e.g., solving unseen math problems) via eye signals during REM, demonstrating sustained, coherent agency independent of waking criteria, the Malcolmian must concede that the grammar of "agency" and "experience" applies during sleep. If the sleeper acts *as* a conscious agent in a way that impacts the sleep state itself, the conceptual barrier collapses.

  **V. Closing Note on Specific Cases**
  Regarding **sleep-time sensitivity**, the Dennettian predicts a correlation curve between stimulus intensity and report incorporation, proving causal constraint without full experience. The Malcolmian predicts incorporation only when the stimulus triggers arousal criteria, denying the sleep-state causation. Regarding **individuation**, both agree incompatible reports are possible, but the Dennettian sees this as reconstruction noise, while the Malcolmian sees it as the creation of distinct impressions. We agree that the "dream" is not a hidden movie, but we disagree on whether there is a projector that is broken (Dennett) or no projector at all (Malcolm). The cassette view need not become a hybrid; sparse activation suffices for construction. The grammatical view remains unmoved by activation, requiring only criteria.
