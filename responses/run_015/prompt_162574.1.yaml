      *   **Judgment Theory (Stoic/Cognitive):** Emotions are evaluations/judgments about the world (e.g., fear = judgment that something is dangerous).
      *   **Perception Theory (Representational):** Emotions perceive value (e.g., fear = perceiving danger, like seeing color).
      *   **Feeling Theory (Jamesian/Somatic):** Emotions are perceptions of bodily changes (e.g., fear = feeling the heartbeat).
      *   **Thermostat View (User's Policy/Setting View):** Emotions are regulatory settings that determine salience/urgency. Not truth-apt. More like a mode of operation than a report.

  3.  **Analyze the Films through this Lens:**
      *   *Inside Out 1:*
