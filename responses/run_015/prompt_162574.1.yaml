answer: |-
  The films are narratively committed to the Judgment view because they personify emotions as agents who make decisions, but structurally they validate your Thermostat view as a genuine fourth option that does not collapse into the traditional three.

  The movies cheat immediately by giving emotions faces and voices, which forces them into the Judgment camp because only beings that hold beliefs can argue, plan, and lie. When Joy decides to keep Sadness away from the console, she is making a cognitive evaluation about what is best for Riley, which is pure Judgment theory wearing cartoon faces. This is the homunculus problem you suspected; the film cannot show us how emotions work without turning them into little people who think, so it smuggles propositional attitudes into states that should be non-conceptual. However, the console itself functions exactly as your Thermostat view describes. When a button is pressed, it does not insert a belief into Riley's head like "there is a bear"; it shifts her operational mode so that certain inputs become salient and others are ignored. The film treats the console as a policy maker, not a truth teller, which supports your claim that emotions fix what counts as a reason rather than reporting on reasons themselves.

  In the first film, the collapse of the Honesty Island when Riley lies resists the Thermostat reading and leans back into Judgment. If emotion were merely a setting, a lie shouldn't destroy the infrastructure; the island falls because the emotion is tied to a normative evaluation of self-concept, implying emotions are judgments about who we are. Yet, when Sadness touches the core memories and turns them blue, the film suggests something closer to Perception or your Thermostat view. The memory content does not change, only its value and weight; Sadness does not correct a false belief but reweights the significance of the event so it can be integrated. This supports the Thermostat idea that emotion sets the gain on the signal rather than changing the signal itself.

  The sequel doubles down on the Judgment view by having Anxiety construct a literal "Sense of Self" tree out of memories, which is a cognitive narrative project. Anxiety tries to prove a proposition about Riley—that she is not good enough—which treats the emotion as a faulty logic engine. The panic attack scene, however, breaks this model and validates the Feeling theory and your Thermostat view simultaneously. The attack is depicted as a system overload where the console stops responding to inputs; this is not a judgment error but a regulatory failure where the urgency setting is maxed out and cannot be dialed down. The film shows that Anxiety is not just processing information but physically hijacking the machinery, which aligns with your idea that emotion is a setting that dictates bodily priority.

  The ending of the second film is where the movies accidentally prove your Thermostat view is a genuine fourth option. Joy realizes she cannot choose one true belief about Riley's identity; instead, contradictory beliefs sit side by side on the tree. If emotions were Judgments or Perceptions of value, one would have to be false, but the film resolves this by having Joy relinquish control of the console, allowing the system to hold multiple weights at once. This is not a truth claim but a regulatory policy, confirming that the goal of emotional health is not accurate judgment but flexible setting management. Your Thermostat view does not collapse into Judgment because it does not require the emotion to be about anything; it is about how much power anything gets to have over the system. It does not collapse into Perception because it is not representing value but assigning priority. It is distinct because it is pre-cognitive; it determines what the cognitive systems are allowed to process.

  The films fudge the mechanism by making the settings conscious, but they get the outcome right: emotions are not truths to be debated but modes to be managed. Your daughter's therapist is speaking loosely when calling anxiety "information," because information implies content that can be true or false, whereas your Thermostat view correctly identifies it as a surge in urgency that needs regulation rather than verification. The movies show that trying to argue with Anxiety (Judgment) fails, while accepting the setting and widening the system (Thermostat) succeeds.

  **Tier List of Film Support**
  1. Judgment: The emotions are characters who argue, plan, and hold beliefs about Riley.
  2. Thermostat: The console mechanics and the sequel's ending prioritize regulatory balance over factual accuracy.
  3. Perception: Memories change color based on emotional tagging, suggesting value is perceived rather than decided.
  4. Feeling: Panic attacks are shown as bodily overwhelm, but always caused by cognitive events.

  **Advice for your daughter**
  Use the Thermostat view because it tells her she doesn't have to prove her fear wrong, she just needs to learn how to turn down the sensitivity dial.
