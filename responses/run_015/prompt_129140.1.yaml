answer: |-
  **Specification for a Theory of Action-Guiding Imprecise Credence**

  The following document establishes the desiderata for a formal theory of imprecise credence. The intended user is not a philosopher contemplating uncertainty, but an agent who must act under it—specifically, a regulator setting safety standards or an engineer selecting designs. In these contexts, the disagreement among defensible probability models is not a theoretical curiosity but the central obstacle. Furthermore, the costs of error are badly asymmetric; a false negative regarding safety may be catastrophic, while a false positive may be merely costly. A theory is adequate only if it converts this imprecision into a mandate for action without lying about the state of knowledge.

  **Requirement 1: Robust Coherence (Non-Negotiable)**
  The theory must guarantee that the agent is not susceptible to a sure loss (a Dutch Book) regardless of which probability function within the set represents the true state of the world. It must be impossible to construct a combination of trades or bets that the agent would accept based on their credal state that guarantees a loss in every possible outcome.
  *Consideration:* This is the baseline of rationality. If an agent's credal state allows a guaranteed loss, the state is defective. However, for this specific use-case, mere coherence is necessary but woefully insufficient. A set of functions can be coherent yet offer no guidance on which action to take when the functions disagree on the optimal choice.
  *Status:* Non-negotiable.

  **Requirement 2: Endogenous Decision Rule under Asymmetry (Non-Negotiable)**
  The theory must provide a decision rule that yields a verdict (permitting or requiring a specific action) even when the credal set is wide, without collapsing the set into a single point estimate. Crucially, this rule must accommodate badly asymmetric error costs. It cannot simply recommend the action favored by the "average" or "midpoint" function, as this pretends a precision that does not exist. Instead, the rule must allow the imprecision itself to shift the decision threshold toward the safer option (e.g., maximizing the minimum gain or minimizing the maximum regret) in a way that is mathematically internal to the representation.
  *Consideration:* A regulator cannot suspend judgment. If the theory says "choice is indeterminate," the agent is paralyzed. If the theory says "pick the midpoint," the agent is reckless. The decision procedure must respect the width of the interval as a reason for caution, not as a nuisance to be averaged away.
  *Status:* Non-negotiable.

  **Requirement 3: Transparent Updating and Dilation (Preference of One Camp)**
  The theory must specify exactly how the set of functions changes upon receiving new evidence. It must state whether all members of the set are conditioned on the evidence, or whether some are discarded. Regarding dilation (where the credal interval widens after receiving evidence), the theory must take a stance. For this use-case, the theory should permit dilation only when the evidence highlights a structural flaw in the hypothesis space, but must treat unexplained dilation as a pathology to be avoided.
  *Consideration:* In standard imprecise probability theory, dilation is often accepted as an honest reflection of increased uncertainty. However, for an engineer, evidence that increases uncertainty without changing the underlying models suggests the models are not fit for purpose. The theory should ideally prevent dilation unless it signals a need to expand the hypothesis space.
  *Status:* Preference of the "action-first" camp. (Theoretical purists often accept dilation as unavoidable; practitioners view it as a failure of the model suite).

  **Requirement 4: Convergence vs. Permanent Imprecision (Preference of One Camp)**
  The theory must not demand that the credal set necessarily narrows to a single precise function as evidence accumulates. It must allow for permanent, irreducible imprecision where the disagreement stems from structural model uncertainty rather than data scarcity. However, it must also provide a schedule for narrowing when the disagreement is merely due to thin evidence.
  *Consideration:* A precise Bayesian theory demands convergence to truth given enough data. An imprecise theory must acknowledge that some uncertainties (e.g., conflicting physical models) will not resolve with more data of the same kind. Forcing convergence would require fabricating precision.
  *Status:* Preference of the imprecise camp. (Precise Bayesians view permanent imprecision as irrational procrastination; imprecise theorists view it as honesty).

  **Requirement 5: Structural Transparency of Imprecision Sources (Non-Negotiable)**
  The theory must distinguish between two sources of imprecision: (i) thin or conflicting evidence within a well-defined hypothesis space, and (ii) a hypothesis space that is arbitrarily grained or badly defined. Furthermore, it must distinguish between (a) imprecision about the degree of confidence and (b) imprecision about which empirically adequate model to trust. A single convex set of probability functions is insufficient to carry these distinctions. The theory requires extra structure—such as weights on the models, a hierarchy of sets, or meta-probabilities—to indicate *why* the set is wide.
  *Consideration:* A wide interval caused by lack of data should be treated differently than a wide interval caused by fundamental model disagreement. If a regulator treats them identically, they may over-invest in data collection when the problem is actually conceptual. A bare convex set erases this history; the representation must preserve it.
  *Status:* Non-negotiable.

  **Requirement 6: Asymmetric Cost Integration (Non-Negotiable)**
  The decision rule must not treat the cost of error as an external add-on applied after the credal state is assessed. The asymmetry of costs must interact with the shape of the credal set. If the cost of a false negative is extreme, the decision rule must select the probability function within the set that is most pessimistic regarding that specific outcome, without discarding the rest of the set for other purposes.
  *Consideration:* Standard sensitivity analysis runs a precise model with different parameters. This fails because the choice of parameter is often arbitrary. The imprecise theory must allow the cost function to select the relevant "worst-case" function from the set dynamically.
  *Status:* Non-negotiable.

  ***

  **Incompatibilities and Trade-offs**

  Not all the requirements above can be jointly satisfied without modification. The primary tension exists between **Requirement 2 (Endogenous Decision Rule)** and **Requirement 5 (Structural Transparency)** when combined with **Requirement 1 (Robust Coherence)**.

  Standard imprecise probability theory (using a single convex set) satisfies Coherence and allows for Structural Transparency only if extra structure is added. However, adding extra structure (like weights on models) often invites the charge that the agent actually *does* have a precise prior (a mixture of the weighted models), which collapses the theory back into Precise Bayesianism. If you weight the models to make a decision, you have effectively created a single probability function. If you do not weight them, you cannot satisfy Requirement 2 (you cannot make a unique decision).

  Therefore, what has to give is the purity of the "set of functions" representation. To satisfy the demand for action (Req 2) and the demand to distinguish sources of uncertainty (Req 5), the theory must admit a second-order element (a rule for selecting a function based on cost) that looks suspiciously like a precise prior but is context-dependent. You cannot have a context-independent set of probabilities that *also* dictates a unique action under asymmetric costs without implicitly privileging one function in the set. The theory must accept that the "rational credence" is not just the set, but the set *plus* the decision context.

  **The Exclusionary Requirement**

  The single requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward, is **Requirement 2: Endogenous Decision Rule under Asymmetry.**

  This requirement excludes standard Precise Bayesianism because a single function cannot represent the model disagreement that is central to the problem; sensitivity analysis is excluded because it is exogenous (applied after the fact) and does not drive the choice internally. It excludes many standard Imprecise Probability theories (such as those relying solely on E-admissibility) because they often conclude that when the set is wide, *no* single action is rationally required, leaving the agent with a set of permissible actions rather than a mandate. For a regulator who *must* act, a theory that permits indecision is inadequate. This requirement forces the theory to solve the "indeterminacy problem" without lying about the precision of the evidence, a constraint that very few formal systems currently meet.
