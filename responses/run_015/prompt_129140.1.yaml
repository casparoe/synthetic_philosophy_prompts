prompt: |-
  I am drawing up the specification before I read any further into accounts of imprecise credence — credence represented by a set of probability functions rather than a single one. Fix the purpose as follows: the theory is for an agent who has to act anyway on the basis of the imprecision, not merely to record it — a regulator setting a safety standard, or an engineer choosing between two designs — in a case where the disagreement among defensible probability models is itself the difficulty, and where the cost of error is badly asymmetric between the two directions in which the truth might lie.

  Write the desiderata: what a theory of rational imprecise credence has to deliver to count as adequate for that use. For each requirement give the case or consideration behind it, and mark it either non-negotiable or as the preference of one camp. I want the weight on the requirements and their motivations, not on scoring candidate views.

  Among the questions I want the list to settle:

  - the minimum of mere coherence — no sure loss, no combination of trades the agent would have accepted that guarantees a loss whichever way things go — and whether that minimum is anywhere near sufficient;
  - what the theory owes us about updating: whether it must say which members of the set get conditioned and when, and whether it may ever let incoming evidence widen the interval (the dilation phenomenon) or must never do so;
  - whether the theory must be able to learn from accumulating evidence — must the interval narrow toward precision, and on what schedule — or whether permanent, irreducible imprecision is a defensible stopping point;
  - a decision rule: when a choice is permitted or required given an interval, and whether such a rule can respect asymmetric error costs without degenerating into taking the midpoint and pretending one is precise;
  - two distinctions I have not seen drawn cleanly, which I want the list to respect: (i) imprecision that comes from thin or conflicting evidence, versus imprecision that comes from the hypothesis space itself being arbitrarily grained or badly defined; and (ii) imprecision about how confident to be, versus imprecision about which of several models to trust when all of them are empirically adequate so far. Say whether a single representational device — one convex set of probability functions — can carry both distinctions, or whether the theory needs extra structure on top of it.

  Then, briefly: if some subset of your requirements cannot be jointly satisfied, say which ones and what has to give — that is the part I most want to see. And name the single requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward.

  Please write in American English, in prose organized around the requirements list; no bibliography or citations.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Topic:** Specification for a theory of imprecise credence (sets of probability functions).
      *   **Purpose/Context:** Action-guiding for an agent who *must* act (regulator, engineer) despite imprecision. High stakes, asymmetric error costs. The disagreement among models *is* the problem.
      *   **Task:** Write a list of desiderata (requirements) for such a theory.
      *   **Format:** American English, prose organized around the requirements list, no bibliography/citations.
      *   **Specific Content Requirements:**
          *   For each requirement: state the requirement, the case/consideration behind it, and mark it as "non-negotiable" or "preference of one camp."
          *   Address specific questions:
              *   Minimum coherence (no sure loss) vs. sufficiency.
              *   Updating (conditioning members, dilation).
              *   Learning (narrowing vs. permanent imprecision).
              *   Decision rule (asymmetric costs, avoiding midpoint pretense).
              *   Two distinctions: (i) thin/conflicting evidence vs. bad hypothesis space; (ii) confidence level vs. model trust. Can one representational device handle both?
          *   **Crucial Ending:** Identify incompatibilities (which requirements clash and what must give) and name the single requirement that excludes the most candidates (including precise Bayesianism + sensitivity analysis).

  2.  **Deconstruct the Context:**
      *   The user is *not* asking for a survey of existing literature (Levi, Walley, Joyce, etc.) but rather a *specification document* written *before* engaging with that literature. It's a "design brief" for a theory.
      *   The tone should be analytical, prescriptive, and rigorous.
      *   The focus is on *action* under *asymmetric risk*. This is key. Standard imprecise probability theory often struggles with decision rules (the "indeterminacy" problem). This spec needs to demand a solution to that.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Coherence.*
          *   Standard: No sure loss (avoiding Dutch Books).
          *   Context: Action-guiding.
          *   Status: Non-negotiable. But is it sufficient? No.
          *   Drafting thought: Need to emphasize that avoiding loss isn't enough for *making* a choice.

      *   *Requirement 2: Decision Rule (The Action Problem).*
          *   Context: Asymmetric costs. Regulator/Engineer.
          *   Need: Must yield a verdict (permit/require) even when the set is wide.
          *   Constraint: Cannot just pick the midpoint (that pretends precision exists).
          *   Status: Non-negotiable for the stated purpose.
          *   Drafting thought: This is likely the hardest requirement. E-admissibility? Maximin? Need to specify that it must handle asymmetry without collapsing to precision.

      *   *Requirement 3: Updating & Dilation.*
          *   Context: New evidence arrives.
          *   Question: Can the set widen (dilation)?
          *   Consideration: If evidence is irrelevant or misleading, imprecision *should* sometimes grow (honesty). But for action, widening might be paralyzing.
          *   Status: Preference of one camp (those prioritizing honesty over decisiveness). Let's make "No pathological dilation" a non-negotiable constraint for *action*, but acknowledge the theoretical debate. Actually, for a regulator, dilation might be a feature (caution). Let's frame it as: The theory must specify *when* dilation is permissible vs. when it indicates a model flaw.
          *   Refinement: The prompt asks whether it *must* say which members get conditioned. Yes, for action. Can it widen? Yes, if evidence is ambiguous, but needs justification.

      *   *Requirement 4: Learning & Convergence.*
          *   Context: Accumulating evidence.
          *   Question: Must it narrow? Or is permanent imprecision okay?
          *   Consideration: If the world is inherently ambiguous or models are structurally different, it might not narrow.
          *   Status: Preference of one camp. "Convergence" is a Bayesian hope. "Permanent Imprecision" is an Imprecise Probability (IP) feature. For a regulator, permanent imprecision is often the reality.
          *   Decision: Mark "Allowance for Permanent Imprecision" as Non-negotiable for this specific use-case (structural uncertainty), whereas "Convergence" is a preference of the precise camp.

      *   *Requirement 5: Representational Distinctions.*
          *   Context: The two distinctions requested.
          *   (i) Evidence quality vs. Hypothesis space grain.
          *   (ii) Confidence level vs. Model trust.
          *   Question: Can one convex set do this?
          *   Analysis: A standard convex set blurs these. To distinguish *why* the set is wide, you need meta-data or a hierarchy.
          *   Status: Non-negotiable that the theory *acknowledges* the difference. Whether one device does it is the technical question. I will argue one device is insufficient; extra structure is needed.

      *   *Requirement 6: Asymmetric Cost Sensitivity.*
          *   Context: Badly asymmetric error costs (e.g., false negative in safety is worse than false positive).
          *   Need: The decision rule must lean into the safe side without denying the imprecision.
          *   Status: Non-negotiable.

  4.  **Addressing the Incompatibilities (The "Trade-off" Section):**
      *   *Conflict:* Decision Rule (determinacy) vs. Faithful Representation (honesty about imprecision).
      *   *Conflict:* Updating (Dilation allowed) vs. Action (Need for decisive narrowing).
      *   *Conflict:* Representational Simplicity (One set) vs. Distinguishing Sources of Uncertainty (Need extra structure).
      *   *The "Killer" Requirement:* The Decision Rule that forces a choice under asymmetry without collapsing to a point estimate. This kills standard IP (which often says "choice is indeterminate") and kills Precise Bayesianism (which pretends the point estimate is real).

  5.  **Refining the Tone and Structure:**
      *   Ensure American English spelling (e.g., "modeling" vs "modelling", "defense" vs "defence").
      *   Keep it prose-based but clearly structured around the numbered requirements.
      *   Ensure the "Non-negotiable" vs. "Preference" tags are clear.
      *   Make sure the "Single Requirement" at the end is punchy and justified.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "midpoint" issue? Yes, in the decision rule section.
      *   *Check:* Did I address the two distinctions? Yes, in the representation section.
      *   *Check:* Did I address dilation? Yes, in updating.
      *   *Check:* Is the distinction between "thin evidence" and "bad hypothesis space" clear? I need to make sure I don't conflate them. Thin evidence = not enough data. Bad space = the categories are wrong.
      *   *Check:* The prompt asks to settle whether a single device can carry the distinctions. I should take a stance based on the "adequacy for use" criteria. A single set *cannot* distinguish *why* it is wide. So the requirement is for extra structure.
      *   *Check:* The "Single Requirement" that excludes the most candidates. It's likely the Action-Guiding Decision Rule under Asymmetry. Standard IP often fails here (Levi's E-admissibility leaves gaps). Precise Bayes fails because it ignores the imprecision source.

  7.  **Final Polish:**
      *   Ensure the flow is logical: Coherence -> Representation -> Updating -> Learning -> Decision.
      *   Make the "Incompatibilities" section distinct and sharp.
      *   Verify the "Non-negotiable" labels align with the "Regulator/Engineer" persona. (e.g., A regulator *cannot* say "I don't know, so I won't act." So Action-Guiding is non-negotiable).

  8.  *(Self-Correction on the "Single Requirement")*: The prompt asks for the one that excludes the most, *including* precise Bayesianism with sensitivity analysis. Precise Bayesianism + Sensitivity Analysis fails because the sensitivity analysis is post-hoc and doesn't drive the decision *internally*. The decision is still made on the single prior. So the requirement must be that the *imprecision itself* drives the decision rule, not just a post-check. Let's call this "Endogenous Action-Guidance."

  9.  *(Final check on distinctions)*:
      *   (i) Thin/Conflicting Evidence vs. Bad Hypothesis Space.
      *   (ii) Confidence Level vs. Model Trust.
      *   Can a convex set do this? No. A set of probabilities represents the *range* of belief, not the *reason* for the range. To distinguish these, we need a second-order structure or a labeling system. I will mark this as a requirement for "Structural Transparency."

