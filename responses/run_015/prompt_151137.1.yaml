  **MEMORANDUM**

  **TO:** Clinical Allocation Review Board, Meridian Health System
  **FROM:** Board Member, Clinical Ethics Committee
  **SUBJECT:** Recommendation on Prioritarian Aggregate Protocol for Gene Therapy Allocation
  **DATE:** October 26, 2023

  **Introduction**
  Next month, this Board must decide how to allocate a scarce, curative gene therapy for hereditary transthyretin amyloidosis. The proposed Prioritarian Aggregate Protocol maximizes weighted quality-adjusted life years (QALYs), prioritizing those with greater life-expectancy deficits. A dissenting ethicist argues this violates the "separateness of persons," proposing instead a strict person-level threshold rule. This opinion evaluates both positions and recommends a course of action.

  **The Separateness Objection and Prioritarianism**
  We must engage seriously with the claim that prioritarian weighting fails to resolve the problem of interpersonal fungibility. The dissent is correct: prioritarianism does not eliminate the treatment of persons as vessels for utility; it merely adjusts the exchange rate. By weighting QALYs based on baseline deficit, the protocol still permits the sacrifice of Patient X (projected 55 QALYs) for the summed gains of Patients Y and Z (30 and 28 weighted QALYs). The moral boundary between persons remains breached because the individual claim of Patient X is overridden by the arithmetic sum of others. Prioritarianism redistributes the fungibility to favor the worse-off, but it retains the aggregative structure that allows one individual to be denied care solely because others collectively benefit more.

  **The Case for the Threshold Rule (Rejected Position)**
  The strongest argument for the dissenting Person-Level Threshold Rule lies in the fiduciary nature of the clinical relationship. Medicine is fundamentally patient-centered; physicians advocate for the individual before them, not the abstract population. A strict threshold (e.g., treating only those >40 QALYs) respects the inviolability of the person by ensuring no patient is treated merely as a means to maximize social welfare. It establishes a moral floor: if a treatment offers a substantial life-saving benefit to an individual, that claim cannot be traded away for fragmented gains elsewhere. This approach safeguards against the tyranny of the majority in resource allocation, ensuring that identifiable lives are not sacrificed for statistical optimization.

  **The Case for Aggregation (Accepted Principle)**
  However, a strict threshold ignores our stewardship obligation to the patient population as a whole. In conditions of extreme scarcity, refusing to aggregate benefits can result in greater total suffering and death. If we rigidly forbid trading one substantial gain for multiple smaller gains, we may deny treatment to three patients who could collectively regain decades of life to save one patient who gains slightly more. Our duty extends to maximizing health outcomes within the constraints of justice. Pure prioritarianism captures this duty but lacks sufficient guardrails against egregious individual sacrifice.

  **Recommendation**
  I recommend we **Adopt the Prioritarian Aggregate Protocol with a Specified Amendment**: a "Non-Sacrifice Constraint."

  Under this hybrid model, the Board will utilize the prioritarian weighting to rank candidates, but allocation cannot bypass a patient meeting the individual threshold (40 QALYs) unless the alternative aggregate weighted benefit exceeds the individual's benefit by at least 50%. This prevents the specific violation cited (55 vs. 30+28) while allowing aggregation where the collective gain is overwhelming. This respects the separateness of persons by establishing a high bar for overriding individual claims, without abandoning the efficiency required by scarcity.

  **Implementation Timeframe**
  This protocol shall be implemented as a **one-quarter pilot program**. During this period, every allocation decision triggering the Non-Sacrifice Constraint must be documented and reviewed by the Ethics Committee. At the end of the quarter, the Board will reconvene to assess whether the constraint adequately protected individual rights without causing unacceptable inefficiencies in total health benefit.

  **Conclusion**
  We cannot treat patients as mere units of welfare, yet we cannot ignore the cumulative cost of non-aggregation. This hybrid approach acknowledges the moral boundary between persons while fulfilling our duty to steward scarce resources responsibly. I urge the Board to vote in favor of the amended protocol.
