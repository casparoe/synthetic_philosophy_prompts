  I'm a software engineer with no philosophy background, and because our credit-risk score gets re-tuned every month I keep ending up as the one who has to sign of on whether a new version is "fair" before it ships. I know the famous result that when two groups have different base rates you can't satisfy both calibration and equalized odds at the same time, but I don't have a way to actually use that when I'm staring at a model. Can you turn that impossibility result into a decision procedure I can run on a proposed model in about ten minutes: the checks in order, what a passing answer looks like at each one, the step where it turns out the two criteria are mutually unsatisfiable and I have to pick one, and the step where it stops being a fact question and I have to hand it to a human because the choice is a value judgment? Make sure it also handles the case where a protected group is too small for the numbers to mean anything. Give it to me as a numbered list of exactly five steps, each a sentence or two, no intro or conclusion, written so a teammate who's never herd of the theorem can follow it.
