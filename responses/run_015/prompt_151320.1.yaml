      *   *Section 3: The "Triviality" Retreat.* Is "you need bias" trivial? No, because NFL shows the *conservation of performance*. It's a zero-sum game over priors. This adds mathematical weight to Hume's psychological observation.
      *   *Section 4: Optimization vs. Supervised.* Stick with Supervised. It's about generalization, which is the heart of induction.
      *   *Section 5: What to Concede vs. Wave Off.*
