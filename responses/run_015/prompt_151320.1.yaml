      *   *Fatal:* If NFL relies on a prior that Hume would reject (e.g., uniform over *all* functions including uncomputable noise), then it's not formalizing Hume, it's formalizing a specific (perhaps absurd) skepticism.
      *   *Fatal:* If the "bias" required by NFL is qualitatively different from Humean "habit/custom."
