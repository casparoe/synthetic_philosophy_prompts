      *   *Challenge 2: Computability/Physics.* Hume was talking about the actual world, not logical space. If we restrict to computable functions (Solomonoff), learning *is* possible. Does this break the analogy?
      *   *Challenge 3: Active Learning/Intervention.* Hume's problem is about predicting the future from the past. Active learning changes the distribution. Does NFL hold for active learning? (Yes, but differently).
      *   *Challenge 4: The "Retreat to Triviality".* If the claim is just "you need bias," is that profound? Hume said more than "you need assumptions." He said justification is impossible. NFL says "performance is equal without bias." Is that the same?
      *   *Challenge 5: Optimization vs. Supervised Learning.* Optimization NFL (search) vs. Classification NFL. Are they equivalent philosophically?
