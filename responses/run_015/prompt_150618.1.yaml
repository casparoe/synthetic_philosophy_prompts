      *   **Goal:** Create a 25-mark, 60-minute take-home exam question that challenges the "always disaggregate" heuristic without falling into "correlation $\neq$ causation" clichés.
      *   **Structure:** Four parts (a) Worked Reversal, (b) Causal Graphs/Interpretation, (c) Mathematical Decomposition & Non-Paradox Collapsibility, (d) Subgroup Fishing.
      *   **Constraints:** Self-contained (all numbers provided), arithmetic must check out, model answer (700-900 words), marking scheme (specific criteria for A vs. B), typical error notes.
      *   **Tone:** Academic but sharp, acknowledging the specific intellectual lineage (rationalist blogs) without being overly informal.

  2.  **Part (a): The Worked Reversal (Arithmetic Check):**
      *   *User's Draft:*
          *   Mild: A (90/100 = 90%), B (76/80 = 95%). Wait, user said A recovers 90/100, B recovers 76/80. 90% vs 95%. B is better.
          *   Severe: A (30/100 = 30%), B (56/160 = 35%). B is better.
          *   Pooled: A (120/200 = 60%), B (132/240 = 55%). A is better.
      *   *Check:*
          *   Mild: A=0.9, B=0.95. (B > A)
          *   Severe: A=0.3, B=0.35. (B > A)
          *   Total A: 120/200 = 0.6.
          *   Total B: 132/240 = 0.55.
          *   Pooled: A > B.
      *   *Verdict:* The arithmetic works perfectly for a Simpson's Paradox reversal. B is better in both subgroups, A is better overall.
      *   *Refinement:* I need to present this clearly in the exam prompt. I will use the user's numbers but format them as a clean contingency table.

  3.  **Part (b): Causal Graphs (The Crux):**
      *   *Goal:* Show that identical numbers support opposite recommendations based on causal structure.
      *   *Scenario 1 (Confounder):* Severity affects Drug Choice *and* Recovery. (Classic Simpson). Here, we must adjust (stratify). Recommendation: Drug B.
      *   *Scenario 2 (Mediator/Collider issue):* The prompt suggests "severity is a post-treatment state". If Severity is caused by the Drug, stratifying on it opens a collider path or blocks the direct effect. Actually, if Severity is a *mediator* (Drug $\to$ Severity $\to$ Recovery), stratifying blocks the indirect path. We want the Total Effect. So we look at Pooled. Recommendation: Drug A.
      *   *Task:* Draw DAGs, identify the variable role, state which estimate (pooled vs. stratified) is causal, and give the recommendation.

  4.  **Part (c): Decomposition & Collapsibility:**
      *   *Task 1 (Decomposition):* Show the formula: Crude Difference = Weighted Average of Stratum Differences + Bias Term (due to imbalance in stratum sizes).
      *   *Math:* $P(R|A) - P(R|B) = \sum P(R|A, S_i)P(S_i|A) - \sum P(R|B, S_i)P(S_i|B)$.
      *   *Standard Decomposition:* Crude = Adjusted + Selection Bias.
      *   *Claim:* "No sign reversal is possible for the risk difference... in that case [if treatment assignment is independent of stratifier within strata]." Wait, if treatment is randomized *within* strata, then $P(S|A) = P(S|B)$. The bias term vanishes. The crude difference equals the weighted average of stratum differences. If all stratum differences are positive, the weighted average must be positive. So no reversal.
      *   *Task 2 (Collapsibility):* Create a table where OR is constant across strata (e.g., 4.0), but pooled OR $\neq$ 4.0. This is *non-collapsibility*, not Simpson's.
      *   *Numbers:*
          *   Stratum 1: Control risk 10%, Treat risk ? (OR=4). Odds C = 1/9. Odds T = 4/9. Risk T = 4/13 $\approx$ 30.7%.
          *   Stratum 2: Control risk 50%, Treat risk ? (OR=4). Odds C = 1. Odds T = 4. Risk T = 4/5 = 80%.
          *   Need equal sample sizes to make pooling easy? Or just specify N. Let's say N=100 per cell for simplicity.
          *   S1: C (10/100), T (31/100).
          *   S2: C (50/100), T (80/100).
          *   Pooled: C (60/200 = 30%), T (111/200 = 55.5%).
          *   Pooled OR: (111/89) / (60/140) = 1.247 / 0.428 $\approx$ 2.91.
          *   This demonstrates non-collapsibility of the OR.
      *   *Explanation:* Why isn't this Simpson's? Because there is no confounding (randomized within strata). The marginal OR is mathematically distinct from the conditional OR even without bias. Which to report? Depends on the question (population average effect vs. conditional effect).

  5.  **Part (d): Subgroup Fishing:**
      *   *Goal:* Distinguish pre-specified causal heterogeneity from data dredging.
      *   *Key Point:* The machinery in (b) justifies stratification *only* if the graph is known/justified a priori. Post-hoc slicing capitalizes on chance (multiple testing) and often conditions on colliders or noise.
      *   *Credibility:* Pre-registration, causal justification, interaction tests.

  6.  **Drafting the Content:**
      *   *Review Arithmetic for (a):*
          *   Mild: A (90/100=0.9), B (76/80=0.95). Diff = -0.05.
          *   Severe: A (30/100=0.3), B (56/160=0.35). Diff = -0.05.
          *   Pooled: A (120/200=0.6), B (132/240=0.55). Diff = +0.05.
          *   Reversal confirmed.
      *   *Review Math for (c):*
          *   Decomposition: $RD_{crude} = RD_{adj} + \text{Bias}$.
          *   If randomized within strata, weights are equal. $RD_{crude} = RD_{adj}$. Since $RD_{adj}$ is average of -0.05 and -0.05, it must be -0.05. Crude cannot be +0.05.
          *   Non-collapsibility table:
              *   S1 (Low Risk): C=10/100, T=31/100. OR = (31/69)/(10/90) = 0.449/0.111 = 4.04.
              *   S2 (High Risk): C=50/100, T=80/100. OR = (80/20)/(50/50) = 4.0.
              *   Pooled: C=60/200, T=111/200. OR = (111/89)/(60/140) = 1.247/0.428 = 2.91.
              *   Looks good.

  7.  **Writing the Model Answer:**
      *   Need to keep it tight (700-900 words).
