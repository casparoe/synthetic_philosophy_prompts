answer: |-
  # EXAMINATION PAPER
  **Course:** PHIL/STAT 450: Causation and Statistical Evidence  
  **Section:** B (Take-Home Final)  
  **Time Allowed:** 60 Minutes  
  **Total Marks:** 25

  **Instructions:** Answer all parts. Calculators are permitted. You may assume standard definitions of Risk Difference (RD), Risk Ratio (RR), and Odds Ratio (OR). All necessary data is provided below.

  ---

  ### Question 1: The Limits of Disaggregation (25 Marks)

  A clinical trial compares Drug A and Drug B. Patients are classified by Condition Severity (Mild vs. Severe). The outcome is Recovery (Yes/No).

  **Table 1: Observational Data**
  | Severity | Drug | Recovered | Total | Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mild** | A | 90 | 100 | |
  | | B | 76 | 80 | |
  | **Severe** | A | 30 | 100 | |
  | | B | 56 | 160 | |
  | **Pooled** | **A** | **120** | **200** | |
  | | **B** | **132** | **240** | |

  **(a) The Reversal (5 Marks)**  
  Calculate the recovery rates for all empty cells in Table 1. Compute the Risk Difference ($RD = Rate_A - Rate_B$) for the Mild stratum, the Severe stratum, and the Pooled data. State the magnitude and direction of the Simpson's Paradox reversal in percentage points.

  **(b) Causal Structure (8 Marks)**  
  The numbers in Table 1 are fixed, but the causal story varies. 
  1.  **Scenario X:** Severity is a pre-treatment confounder (influences both Drug selection and Recovery). Draw the DAG. Which estimate (Stratified or Pooled) identifies the causal effect? Which drug do you recommend?
  2.  **Scenario Y:** Severity is a post-treatment mediator (Drug influences Severity, which influences Recovery). Draw the DAG. Which estimate identifies the *total* causal effect? Which drug do you recommend?
  *Explain why the "always disaggregate" heuristic fails here.*

  **(c) Decomposition and Collapsibility (8 Marks)**  
  1.  **Decomposition:** Show algebraically that the Crude Risk Difference can be decomposed into a weighted average of stratum-specific RDs plus a selection bias term involving the imbalance of Severity across Drugs. Using Table 1, calculate the value of this bias term. Explain why, if Treatment had been randomized *within* strata (making assignment independent of Severity), a sign reversal of the RD would be mathematically impossible.
  2.  **Non-Collapsibility:** Consider **Table 2** (below), where Treatment was randomized within strata.
      *   *Mild:* Drug A (31/100), Drug B (10/100). OR $\approx$ 4.05.
      *   *Severe:* Drug A (80/100), Drug B (50/100). OR = 4.00.
      *   *Pooled:* Drug A (111/200), Drug B (60/200).
      Calculate the Pooled OR for Table 2. It will differ from 4.0. Explain why this divergence is **not** Simpson's Paradox, and which OR (stratified or pooled) is appropriate for estimating the population-average causal effect.

  **(d) Subgroup Fishing (4 Marks)**  
  A researcher analyzes a randomized trial, slices the data into 30 subgroups, and reports the one where the treatment effect sign flips. Using your answers from (b) and (c), explain why the machinery of causal stratification does not license this practice. What two conditions are required to make a subgroup claim credible?

  ---

  # MODEL ANSWER

  **(a) The Reversal**  
  **Rates:** Mild A = 0.90, Mild B = 0.95. Severe A = 0.30, Severe B = 0.35. Pooled A = 0.60, Pooled B = 0.55.  
  **Risk Differences:** Mild RD = $-0.05$ (B better). Severe RD = $-0.05$ (B better). Pooled RD = $+0.05$ (A better).  
  **Reversal:** In both strata, Drug B outperforms A by 5 percentage points. In the aggregate, Drug A outperforms B by 5 percentage points. This is a complete sign reversal.

  **(b) Causal Structure**  
  **Scenario X (Confounder):** DAG: Severity $\to$ Drug, Severity $\to$ Recovery, Drug $\to$ Recovery. Severity opens a backdoor path. We must block it by conditioning. **Stratified** estimates are causal. **Recommendation: Drug B.**  
  **Scenario Y (Mediator):** DAG: Drug $\to$ Severity $\to$ Recovery, Drug $\to$ Recovery. Severity is on the causal path. Conditioning on it blocks the indirect effect, identifying only the direct effect. For total efficacy, we need the **Pooled** estimate. **Recommendation: Drug A.**  
  **Heuristic Failure:** "Always disaggregate" assumes the stratifier is always a confounder. If the variable is a mediator, disaggregation biases the total effect estimate. The table alone cannot distinguish these structures; causal knowledge is required.

  **(c) Decomposition and Collapsibility**  
  1.  **Decomposition:** $RD_{crude} = \sum w_i RD_i + \sum (P(S_i|A) - P(S_i|B))P(R|B, S_i)$. The second term is the selection bias. In Table 1, Drug A has more Mild patients (50% vs 33% for B), and Mild patients recover more often. This imbalance drives the pooled result up for A.  
      **Randomization:** If randomized within strata, $P(S_i|A) = P(S_i|B)$. The bias term becomes zero. $RD_{crude}$ becomes a convex combination of stratum RDs. If all $RD_i$ are negative, the weighted average must be negative. Sign reversal is mathematically impossible without confounding.
  2.  **Non-Collapsibility:** Pooled A = 0.555, Pooled B = 0.30. Pooled Odds: $A = 111/89 \approx 1.25$, $B = 60/140 \approx 0.43$. **Pooled OR $\approx$ 2.91.**  
      **Explanation:** This is not Simpson's Paradox because there is no confounding (randomization ensures exchangeability). The Odds Ratio is **non-collapsible**: the marginal OR is not a weighted average of conditional ORs, even without bias. For policy decisions regarding the average patient, the **Pooled OR** (marginal effect) is appropriate. The stratified OR describes the effect within specific risk profiles.

  **(d) Subgroup Fishing**  
  The machinery in (b) justifies stratification only when the causal graph (confounder vs. mediator) is specified *a priori*. Post-hoc slicing capitalizes on random noise (multiple testing problem) and risks conditioning on colliders or spurious correlations.  
  **Credibility Conditions:** (1) **Pre-specification:** The subgroup hypothesis must be registered before data inspection. (2) **Causal Plausibility:** There must be a theoretical mechanism explaining why the effect differs (effect modification), not just a statistical interaction.

  ---

  # MARKING SCHEME

  **Total: 25 Marks**

  **Part (a): 5 Marks**
  *   **A (5):** All 6 rates correct; all 3 RDs correct with signs; reversal stated clearly as 5pp in strata vs 5pp aggregate.
  *   **B (3-4):** Minor arithmetic error (e.g., 0.55 vs 0.56) but reversal identified correctly.
  *   **C (0-2):** Major arithmetic failures; fails to identify sign flip.
  *   *Typical Error:* Calculating Risk Ratio instead of Difference, or swapping denominators.

  **Part (b): 8 Marks**
  *   **A (7-8):** Correct DAGs (arrows direction crucial); correctly identifies Stratified for Confounder and Pooled for Mediator; explicit recommendation (B then A); explicitly notes table underdetermines causality.
  *   **B (4-6):** Correct DAGs but recommends Stratified for both (falls for "always disaggregate"); or identifies Mediator but fails to recommend Pooled.
  *   **C (0-3):** DAGs incorrect (e.g., Drug $\to$ Severity in Confounder scenario); no distinction made between scenarios.
  *   *Typical Error:* Treating Severity as a confounder in Scenario Y, leading to the wrong drug recommendation.

  **Part (c): 8 Marks**
  *   **A (7-8):** Correct decomposition logic (bias term vanishes under randomization); proves impossibility of RD reversal under randomization; Calculates Pooled OR $\approx$ 2.9; correctly labels this "non-collapsibility" not "bias/paradox"; selects Pooled for population effect.
  *   **B (4-6):** Shows decomposition but fails to link randomization to the zeroing of the bias term; Calculates Pooled OR correctly but calls it "Simpson's" or "bias"; unsure which OR to report.
  *   **C (0-3):** Cannot calculate OR; claims randomization prevents all marginal/conditional differences.
  *   *Typical Error:* Claiming the Pooled OR in Table 2 indicates confounding despite randomization.

  **Part (d): 4 Marks**
  *   **A (4):** Distinguishes *causal heterogeneity* (valid) from *data dredging* (invalid); cites Pre-specification and Mechanism/Theory.
  *   **B (2-3):** Says "subgroups are bad" generally (too broad); or mentions multiple testing but misses causal justification.
  *   **C (0-1):** Vague appeal to "sample size."
  *   *Typical Error:* Arguing that subgroup analysis is never permissible, rather than distinguishing pre-hoc vs. post-hoc.

  ---

  **Note to Grader:** The crux of this question is distinguishing **bias** (Simpson's/Confounding) from **mathematical property** (Non-collapsibility) and **causal role** (Confounder vs. Mediator). An 'A' student must demonstrate that the *numbers* do not dictate the *method*; the causal model does.
