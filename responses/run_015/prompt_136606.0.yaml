prompt: |-
  Right — I've got a progress review in three weeks and my supervisor has now twice said some variant of "I can't tell what you think you're arguing for", which I'm choosing to read as a sign the view is interesting rather than as a sign it's mush. The chapter I'm meant to be writing is on why anyone should expected-utility maximise, and before I try to defend anything I want to know whether the commitments I've accumulated actually fit together. Roughly where I've landed: (1) the only good arguments for EU maximisation are the diachronic, pragmatic ones — money pumps, Dutch books, not paying to pay, not being exploitable — and I'm suspicious of accuracy or scoring-rule style arguments; rationality, on my view, makes no substantive demands on the content of your priors or your desires, it's coherence all the way down and the normativity is instrumental. (2) But I also think that whole family of argument establishes at most something like acyclicity plus a willingness to make and stick to plans: a chooser who settles things up front and doesn't re-deliberate at each node can violate completeness, transitivity and independence and still never get money-pumped, so I want to deny that completeness and independence are requirements. (3) I'm an anti-fanatic — I think it's rational to turn down a tiny chance of an astronomical good at a small cost, and to take the modest sure thing over a marginally better gamble carrying a tiny risk of catastrophe — and I dont want to get there by stipulating bounded utility, since that strikes me as ad hoc and, more importantly, as only relocating the problem: aggregate enough independent tiny chances across a life and the fanatical verdict seems to come back anyway. (4) I think paying a premium for the known-risk option in Ellsberg-ish cases is rationally permitted, not a bias to be trained out of. (5) I think it's fine to pay to avoid finding something out, even though I've been told a free test can't have negative expected value for an EU maximiser. (6) I'm a permissivist about credences — for most propositions rationality picks out a range rather than a number — and I think it can be rational to be genuinely torn between two options rather than indifferent.

  So: audit the set. Which pairs are actually in tension, ranked by severity rather than all listed as equally bad, and for each one say exactly what would have to give and what giving it up costs me. Some of these I'm fairly sure only look in conflict — the information one and the imprecise-credence one, maybe — and if so I want to know why they dissolve, because my supervisor won't accept "they just do". Conversely, if (1) is my only argument for EU maximisation and (2) says that argument under-delivers, that seems like a real problem for the chapter, so tell me if that's the load-bearing crack. And is there a single revision that cleans up the most — as opposed to the one I'd find most comfortable — and would what's left over be a recognisable position or just a pile of excuses for having intuitions?

  Please be explicit about how confident you are in each call: mark where you're genuinely unsure or where sensible decision theorists would disagree with you rather than smoothing it over, and flag any place where I'm using "EU maximisation" in two different senses or leaning on a distinction I haven't actually drawn. If the request itself is muddled — if I've set it up so that there's no interesting answer — say that plainly instead of politely working down the list. British English, please, and don't pad it out with background I already know.
