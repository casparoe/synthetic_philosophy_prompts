answer: |-
  This is an excellent set of questions. You have hit on one of the most subtle distinctions in game theory, one that often trips up practitioners building multi-agent systems. Since you are coming from an engineering background, I will frame this in terms of algorithmic stability, invariants, and the epistemic assumptions required to justify pruning the search space.

  Here is the breakdown of Strict vs. Weak dominance, using your specific game to anchor the concepts.

  ---

  ### 1. Why Strict Elimination is Order-Independent, but Weak is Not

  From an algorithmic perspective, you can think of Iterated Elimination of Strictly Dominated Strategies (IESDS) as a **stable reduction**, whereas Iterated Elimination of Weakly Dominated Strategies (IEWDS) is an **unstable reduction**.

  **Strict Dominance ($>$):**
  Strategy $X$ strictly dominates $Y$ if $Payoff(X, Opponent) > Payoff(Y, Opponent)$ for **all** opponent strategies.
  *   **The Invariant:** The inequality is strict. If you remove an opponent strategy (a column in the matrix), the inequality $>$ remains true for the remaining columns. Removing data points from a dataset where $f(x) > g(x)$ everywhere does not invalidate the inequality on the subset.
  *   **Result:** The set of strictly dominated strategies is intrinsic to the game structure. It does not matter which one you remove first; the final set of survivors is unique.

  **Weak Dominance ($\ge$):**
  Strategy $X$ weakly dominates $Y$ if $Payoff(X, Opponent) \ge Payoff(Y, Opponent)$ for all opponent strategies, with strict inequality $>$ for **at least one**.
  *   **The Fragility:** The relationship relies on ties ($=$) holding for some opponent strategies and a strict win ($>$) for at least one.
  *   **The Bug:** If you eliminate the *specific* opponent strategy where $X$ beat $Y$ (the strict inequality case), $X$ and $Y$ might become payoff-equivalent on the remaining strategies. If they become equivalent, neither dominates the other anymore. Conversely, removing a strategy where they were tied might reveal a strict dominance relation that was previously hidden.
  *   **Result:** The set of survivors depends on which "ties" you break first by removing opponent strategies.

  ---

  ### 2. Concrete Demonstration with Your Game

  Let's analyze the game you provided.
  Payoffs are (Row, Col).

  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  A & (0, 0) & (0, 0) \\
  B & (1, 1) & (0, 0) \\
  C & (1, 1) & (1, 1)
  \end{array}
  $$

  **Dominance Relations:**
  *   **Row Player:**
      *   $C$ **strictly** dominates $A$ (1>0 against L, 1>0 against R).
      *   $C$ **weakly** dominates $B$ (1=1 against L, 1>0 against R).
      *   $B$ **weakly** dominates $A$ (1>0 against L, 0=0 against R).
  *   **Column Player:**
      *   $L$ **weakly** dominates $R$ (0=0 if Row=A, 1>0 if Row=B, 1=1 if Row=C).

  Now, let's run the elimination algorithm two different ways.

  #### Path 1: Eliminate Row Strategies First
  1.  **Row Decision:** $C$ weakly dominates $B$. Let's eliminate $B$. (Note: We could eliminate $A$ first, but $A$ is strictly dominated by $C$ anyway, so it will go eventually. Eliminating $B$ is the critical choice here).
      *   *Remaining Matrix:* Rows $\{A, C\}$, Cols $\{L, R\}$.
  2.  **Column Decision:** Compare $L$ and $R$ against remaining rows $\{A, C\}$.
      *   Against $A$: $L(0) = R(0)$.
      *   Against $C$: $L(1) = R(1)$.
      *   **Result:** $L$ and $R$ are now identical. Neither dominates the other. We cannot eliminate $R$.
  3.  **Row Decision (Round 2):** Compare $A$ and $C$ against $\{L, R\}$.
      *   $C$ strictly dominates $A$. Eliminate $A$.
      *   *Remaining Matrix:* Row $\{C\}$, Cols $\{L, R\}$.
  4.  **Final Survivors (Path 1):** **$\{(C, L), (C, R)\}$**.

  #### Path 2: Eliminate Column Strategies First
  1.  **Column Decision:** $L$ weakly dominates $R$ (in the full game). Eliminate $R$.
      *   *Remaining Matrix:* Rows $\{A, B, C\}$, Col $\{L\}$.
  2.  **Row Decision:** Compare $A, B, C$ against remaining col $\{L\}$.
      *   Payoffs are: $A(0), B(1), C(1)$.
      *   $A$ is strictly dominated by $B$ and $C$. Eliminate $A$.
      *   *Remaining Matrix:* Rows $\{B, C\}$, Col $\{L\}$.
  3.  **Row Decision (Round 2):** Compare $B$ and $C$ against $\{L\}$.
      *   Payoffs are: $B(1), C(1)$.
      *   They are equal. Neither dominates the other.
  4.  **Final Survivors (Path 2):** **$\{(B, L), (C, L)\}$**.

  #### Comparison
  *   **Path 1** allows the outcome **$(C, R)$**.
  *   **Path 2** allows the outcome **$(B, L)$**.
  *   **Path 2** eliminated $(C, R)$ because it deleted column $R$ early.
  *   **Path 1** eliminated $(B, L)$ because it deleted row $B$ early.

  The sets of surviving strategy profiles are different. The algorithm is non-deterministic without a defined tie-breaking rule, and different tie-breaking rules yield different "solutions."

  ---

  ### 3. Normative Rationality: Is Weak Dominance "Irrational"?

  This is the crux of your engineering problem: **Should your bots treat weakly dominated strategies as forbidden?**

  **Strict Dominance:**
  It is **irrational** to play a strictly dominated strategy. There exists *no* belief about what the opponent will do that makes the dominated strategy optimal. If your bot plays a strictly dominated strategy, it is literally throwing away utility regardless of the opponent's move.

  **Weak Dominance:**
  It is **not necessarily irrational** to play a weakly dominated strategy.
  *   In your game, consider Row player strategy $B$. It is weakly dominated by $C$.
  *   However, if the Row player believes the Column player will play $L$, then $B$ yields 1 and $C$ yields 1. They are **equally good**.
  *   Playing $B$ is a "best response" to the belief "Opponent plays L".
  *   Therefore, a rational agent (one who maximizes expected utility based on their beliefs) *can* play $B$.

  **Why do people eliminate them then? (The "Trembling Hand")**
  The standard justification for IEWDS is the **Trembling Hand Perfect** argument.
  *   Argument: "What if the opponent makes a mistake? What if there is a 0.0001% chance they play $R$?"
  *   If there is *any* probability of $R$, strategy $C$ (payoff 1 vs R) becomes strictly better than strategy $B$ (payoff 0 vs R).
  *   So, if you assume opponents might "tremble" (make errors with non-zero probability), weakly dominated strategies become strictly dominated.

  **Does Order-Dependence Undermine This?**
  Yes, for the purpose of "Common Knowledge of Rationality."
  *   If we assume only that "Agents are rational," we justify IESDS. This yields a unique set of strategies (Rationalizability).
  *   If we assume "Agents are rational AND agents know others won't play weakly dominated strategies," we justify IEWDS.
  *   But because IEWDS is order-dependent, "Rationality + Elimination of Weak Dominance" leads to contradictory predictions (as seen in Path 1 vs Path 2).
  *   **Engineering Takeaway:** If you eliminate weakly dominated strategies, you are imposing a specific *equilibrium refinement* (like Trembling Hand Perfection), not just basic rationality. You are assuming your bots know exactly *which* weak dominances the other bots will respect. In a simulation where agents learn or have different priors, IEWDS is dangerous because it prunes strategies that might actually be optimal responses to specific opponent behaviors.

  **Recommendation:** For general "rational agents," **do not eliminate weakly dominated strategies.** Only eliminate strictly dominated ones. Allow your agents to play weakly dominated strategies if their internal belief model suggests the opponent will play the strategy that makes the tie hold (e.g., if your bot thinks the opponent will play $L$, it is perfectly rational for it to play $B$).

  ---

  ### 4. Strict Dominance, Mixed Strategies, and Rationalizability

  You asked about this specific theorem:
  > *In a finite game, a pure strategy is strictly dominated by some mixed strategy if and only if it is never a best response to any belief about the opponent's play.*

  **Yes, this is correct.** This is a fundamental result often attributed to Pearce (1984).

  **The Connection to Rationalizability:**
  1.  **Definition of Rationalizability:** A strategy is "rationalizable" if it is a best response to some belief about the opponent's strategies, where those opponent strategies are themselves best responses to some belief, and so on (common knowledge of rationality).
  2.  **The Algorithm:** The set of rationalizable strategies is found by iteratively removing strategies that are **never a best response**.
  3.  **The Equivalence:** Because of the theorem above, "Never a Best Response" is mathematically equivalent to "Strictly Dominated (possibly by a mixed strategy)."
  4.  **Conclusion:** **IESDS (allowing mixed dominators) produces exactly the set of Rationalizable Strategies.**

  **Why this matters for your bots:**
  *   **Rationalizability (IESDS)** is the maximal set of strategies a rational agent might play. It is the "safe" pruning. If a strategy survives IESDS, there exists *some* logical worldview (belief hierarchy) where playing that strategy is optimal.
  *   **IEWDS** prunes *further* than Rationalizability. It removes strategies that *are* best responses to some beliefs (e.g., strategy $B$ in your game is a best response to belief "Opponent plays L").
  *   By using IEWDS, you are effectively hard-coding a specific belief into your agents (e.g., "Opponent will never play R").

  **Summary for your Auction Project:**
  1.  **Implement IESDS (with mixed strategies):** This is robust, order-independent, and defensible. It removes strategies that are objectively errors.
  2.  **Avoid IEWDS:** Unless you have a specific model of opponent error (trembles), eliminating weakly dominated strategies removes valid best-responses and introduces order-dependent artifacts into your simulation.
  3.  **The "Defensible" Notion:** The most defensible notion of "strategies never to play" is the set eliminated by IESDS. Any strategy surviving IESDS is "Rationalizable," meaning a rational agent *could* play it without contradicting the axioms of utility maximization.
