answer: |-
  This is a fascinating set of intuitions. You have effectively reconstructed a debate that sits right at the intersection of **hylomorphism** (form/matter), **process metaphysics**, and **functionalism**.

  You asked me to reason this out step-by-step, identify the governing principle, check for logical slips, and apply it to a new case. Let's dig in.

  ### Step 1: Diagnosing the Tension
  Your intuitions are remarkably consistent, except for the "shakiness" in Case 3 and the specific threshold in Case 5. The core tension you identified is correct: **Case 4 is the key.**

  In Case 2 (Ship), matter is replaced, but identity holds.
  In Case 4 (Robot/Clay), matter is stable (it's the same clay), but identity fails.

  This proves your intuition that **material continuity is not the primary criterion.** If it were, Case 4 would be a statue (same clay) and Case 2 would not be a ship (new wood). Since you judge the opposite, you are implicitly prioritizing **organizational continuity.**

  However, as you noted, Case 4 has organizational continuity (the shape is always there). So, "organization" alone isn't enough. It must be *how* that organization is sustained.

  ### Step 2: Deriving the Principle
  Let's test your hypothesis: *"Is it about whether the organizing principle is internal to the matter rather than imposed from outside?"*

  This is close, but "internal/external" can be spatially misleading. In Case 2, the shipwright is external. In Case 3, the genetic engineering is external. Yet both survive. In Case 4, the robot arm is external, and it fails.

  The difference isn't the *source* of the organization, but the **locus of causal power regarding persistence.**

  I propose your governing principle is **Dispositional Structural Inertia (DSI).**

  > **The Principle:** A material object persists through time if and only if its constituent parts possess the *disposition* to maintain the object's form/structure without continuous, active, external micromanagement.

  Let's run your cases through DSI:

  1.  **Statue/Clay (Smushed):** The clay loses the disposition to hold the statue-shape. The form is lost. **Verdict: Destroyed.** (Matches DSI).
  2.  **Ship (Synthetic):** Once a new plank is installed, it stays there via nails/glue/structure. The ship *holds itself together* between maintenance events. The structure has inertia. **Verdict: Survives.** (Matches DSI).
  3.  **Bacteria Statue:** The bacteria use quorum sensing to *actively maintain* the shape. The causal power to hold the form resides in the interactions of the parts (the bacteria), not an external shaper. **Verdict: Exists.** (Matches DSI).
  4.  **Robot/Clay:** The clay has *no* disposition to hold that shape. If the robot arm stops for one second, the statue collapses. The "statue-hood" is a property of the *robot's program*, not the clay. The clay is merely a medium being puppeteered. **Verdict: No Statue.** (Matches DSI).
  5.  **Burn/Replace:**
      *   *Gradual:* The structure absorbs the change. The remaining parts hold the form while new parts are integrated. Structural inertia is maintained. **Verdict: Survives.**
      *   *Instant 50%:* This breaks the structural integrity. The remaining half cannot sustain the "statue" disposition on its own; the causal chain of the form is severed. **Verdict: New Object.** (Matches DSI).

  ### Step 3: Finding the Logical Slip & The Sacrifice
  You asked me to check for slips and tell you what to sacrifice for simplicity.

  **The Logical Slip:**
  There is a slight inconsistency in how you treat **Case 3 (Bacteria)** versus **Case 2 (Ship)**.
  *   In Case 2, you accept total matter replacement because the *function/structure* persists.
  *   In Case 3, you say you are "shaky."
  *   *Why?* If your principle is DSI, Case 3 is actually a *stronger* candidate for persistence than Case 2. The bacteria *biologically* fight to maintain the form (homeostasis/quorum sensing). A wooden ship is passive; it rots if ignored. The bacteria statue is active; it repairs itself.
  *   *The Slip:* Your shakiness likely comes from a category error—confusing "Artifact" with "Organism." You feel an artifact should be inert. But Case 2 (Synthetic Ship) already breaks that rule (synthetic timber is engineered).
  *   *Correction:* To be consistent with Case 2, you must drop the "shakiness" in Case 3. If functional self-maintenance counts for the ship, it must count for the bacteria.

  **The Sacrifice:**
  To make your metaphysical framework clean, you must sacrifice the intuition that **Artifacts must be materially passive.**
  You have to accept that a "statue" can be a process of self-maintaining matter (Case 3), provided the maintenance is intrinsic to the parts' interactions. If you keep the "shakiness," you undermine Case 2. If you commit to Case 2, Case 3 must be a firm "Yes."

  **The Messy Edge Case (Case 5):**
  Your verdict on Case 5 (Instant 50% burn = New Object) is the messiest part of the theory.
  *   *Why?* DSI suggests a spectrum. If 50% burns instantly, does the structure *really* lose inertia? A ship with half its hull blown off is still the *same ship* (damaged), not a *new ship*.
  *   *The Conflict:* You are treating "Statue" as more fragile than "Ship." This is defensible (a statue is essentially its shape; a ship is essentially its function), but it introduces a **Kind-Relativity** to your principle.
  *   *The Mess:* You have to admit that persistence conditions depend on *what kind of thing* you think it is. If it's a "Shape-Essential" object (Statue), instant damage kills it. If it's a "Function-Essential" object (Ship), instant damage just damages it.
  *   *Recommendation:* Acknowledge that your principle applies differently to **Sortal Concepts**. The DSI principle holds, but the *threshold* for failure depends on whether the object is defined by its form (Statue) or its career (Ship).

  ### Step 4: The New Case (Human Gene Therapy)
  **Case:** A human gets every cell replaced over ten years via gradual gene therapy with synthetic equivalents. Same person or not?

  **Applying DSI:**
  1.  **Matter:** Totally replaced (like the Ship).
  2.  **Process:** Gradual (like the Ship/Case 5 Gradual).
  3.  **Locus of Control:** This is the crux. Is the integration driven by the *body's homeostasis* or by *external micromanagement*?
      *   "Gene therapy" implies introducing a vector that instructs cells to replicate or repair, but the *body* does the work of integrating them. The synthetic cells function within the biological feedback loops (hormones, immune system, neural signals).
      *   Unlike the Robot Arm (Case 4), if you turn off the therapy machine after year 5, the person doesn't instantly collapse into a pile of goo. The synthetic cells have **Dispositional Structural Inertia**. They hold the form because they are biologically integrated.

  **Verdict:** **Same Person.**
  This aligns with Case 2 (Ship) and the corrected Case 3 (Bacteria). The "organizing principle" (biological life) is internal to the system, even if the *source* of the new parts is technologically mediated.

  **Where it gets messy:**
  If the "synthetic equivalents" are nanobots that *simulate* cells but require an external Wi-Fi signal to stay in formation, then it becomes Case 4 (Robot/Clay). If the signal cuts, the person "dies" (collapses).
  *   *Assumption:* Assuming "gene therapy" means biological integration, the person survives.
  *   *Caveat:* If the therapy alters the *psychological* continuity (memory/personality), that's a different metaphysical problem (Lockean personhood vs. biological animalism). But strictly regarding *material constitution*, the organism persists.

  ### Summary of Your Metaphysical Profile

  You are operating with a **Neo-Hylomorphic Functionalist** framework.
  *   **Matter** is secondary.
  *   **Form** is primary, but Form is not just "shape"—it is **Causal Power**.
  *   **Identity** persists as long as the object retains the causal power to maintain its own structure against entropy without external puppeteering.

  **Final To-Do List for You:**
  1.  **Firm up Case 3:** Decide that the Bacteria Statue *is* a statue. Your "shakiness" is an aesthetic bias against living art, not a metaphysical inconsistency.
  2.  **Clarify Case 5:** Distinguish between "Damage" (Ship survives) and "Essential Destruction" (Statue dies). Your intuition here relies on the *Sortal* (kind) of the object, not just the physics.
  3.  **Watch out for Case 4 variants:** Be careful of things that *look* self-maintaining but aren't. (e.g., A hologram projected by a generator. If the generator breaks, the object vanishes. No inertia. No object.)

  Your intuitions are robust. You just need to trust the "Internal Causal Power" metric more than your hesitation about biological artifacts.
