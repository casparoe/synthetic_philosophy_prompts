  1. **The Endorsement Constraint (Non-negotiable).** Content stored or generated externally counts as mental only if the agent has dispositionally accepted it as their own, excluding predictive keyboards that complete sentences before the user settles on a thought.
  2. **The Access Constraint (Non-negotiable).** The agent must retain the capacity to inspect and revise the resource without external permission, excluding the wife-curated photo archive where the resident cannot edit or inspect the tags.
  3. **The Reliability Constraint (Preference: Externalist).** The resource must be consistently available and trusted as a matter of habit, securing the status of the memory notebook while excluding sporadically used tools.
  4. **The Transparency Constraint (Preference: Enactive).** The resource should recede from focal attention during use, distinguishing the surgeon's AR overlay from a distracting interface, provided it can be overridden.
  5. **The Normative Symmetry Constraint (Preference: Internalist/Externalist).** If a resource is constitutive of the mind, epistemic credit or blame for its contents must attach to the agent, distinguishing cognitive vehicles from mere scaffolding.

  **Tensions and Conflicts:**
  I doubt **The Normative Symmetry Constraint** can be jointly satisfied with cases of platform manipulation; if a platform silently rewrites notes that count as part of the mind, holding the user responsible for those changes violates fairness, yet denying responsibility suggests the notes are not truly mental. Furthermore, **The Access Constraint** conflicts with **The Reliability Constraint** in cloud-based systems where security locks (ensuring reliability) may prevent immediate user editing.

  **Scoring Existing Positions:**
  Internalism fails to protect the notebook from border searches, while naive functionalism collapses into the coupling-constitution fallacy by counting every well-used tool as mental. Enactive approaches struggle to accommodate static archives like photographs without reducing them to mere causal scaffolding.

