answer: |-
  The question

  1. The Westmarsh Health Board ranks three funding packages, A, B and C, on three scales: Q (total QALYs), S (severity-weighted priority) and F (fairness of spread). The scores are: A (Q=100, S=80, F=90); B (Q=90, S=100, F=80); C (Q=80, S=90, F=100). The Board employs the Salience Rule: in any pairwise comparison, drop every dimension on which the packages differ by less than 3 points; then rank by majority across the remaining dimensions, with Q breaking any tie. Working through the pairs yields a cycle: A is better than B, B is better than C, and C is better than A. The Board insists this rule does not merely detect betterness; it constitutes it for packages like these.

  Consider also the Salience-Relative Betterness view, which holds that 'better than' is a three-place relation: x is better than y relative to a context of salient respects. This is proposed to save transitivity by treating apparent cycles as equivocations across contexts. Finally, consider a ladder case: five thousand rungs, where each rung is a barely noticeable improvement on the one below, yet the bottom rung is clearly worse than the top.

  (a) Does the Westmarsh cycle show that betterness is intransitive, or only that the Board is a poor detector of it? Explain why the distinction matters. (5 marks)
  (b) Does relativising betterness to a context repair transitivity here, given that the Board's cycling occurs within a fixed decision context? (5 marks)
  (c) Are the ladder case and the cycle case the same argument in different clothes, or structurally distinct? (5 marks)
  (d) Conclude with a clear verdict: must we accept intransitivity, or reject the Board's constitutive claim? (5 marks)

  Model answer

  The Westmarsh cycle presents a constitutive challenge rather than an epistemic one. If the Board's rule defines what betterness is for these packages, then betterness is genuinely intransitive in this domain. However, this conflates a metric with the relation it measures. Transitivity is a formal requirement of the concept of betterness; if a metric yields cycles, the metric is defective, not the relation. The distinction matters because accepting the Board's claim collapses the normative force of 'better'. If betterness cycles, rational choice becomes impossible, as no option is stably preferable. We must therefore treat the cycle as evidence of the Rule's failure to track value, not as evidence that value itself cycles.

  Salience-Relative Betterness attempts to salvage transitivity by indexing betterness to contexts. It suggests A is better than B relative to context 1, and B better than C relative to context 2. However, this fails in the Westmarsh case because the context is fixed. The Board applies the same Salience Rule in the same meeting with the same dimensions salient. The cycling occurs intra-contextually, not inter-contextually. Relativising the relation cannot resolve contradictions arising from majoritarian aggregation within a single framework. The problem is structural, not linguistic. A three-place relation only helps if the salience shifts between comparisons, but here the salience conditions are stable while the outcome cycles.

  The ladder case and the cycle case are structurally distinct arguments against transitivity. The ladder relies on a sorites structure: small, imperceptible differences accumulate to form a large, perceptible difference, challenging the idea that 'better than' can tolerate small steps without collapsing. It attacks transitivity via the continuity of value. The Westmarsh cycle, by contrast, relies on multidimensionality and majority rule. It attacks transitivity via conflicting criteria that are individually transitive but collectively cyclic. The ladder suggests 'better than' is vague; the cycle suggests 'better than' is aggregatively unstable. They require different solutions: the ladder may require rejecting the tolerance principle, while the cycle requires rejecting the aggregation rule.

  Consequently, the verdict must be to reject the Board's constitutive claim. We should swallow the 'poor detector' horn. Transitivity is a conceptual truth of value theory; any procedure violating it is irrational by definition. The Board's rule is a heuristic that has failed, not a definition of value. To accept the cycle is to abandon the possibility of rational choice entirely. Therefore, betterness remains transitive, and the Westmarsh case demonstrates only that multidimensional majority voting is an inadequate measure of value. The Salience-Relative view is unnecessary for this case, as the context does not shift. We preserve transitivity by denying that institutional rules can constitute normative relations.

  Marking scheme

  Four marks are allocated for the analysis of the Westmarsh cycle. A First-class answer will distinguish sharply between the ontological status of betterness and the epistemic function of the Board's rule, noting that constitutive intransitivity destroys rational choice. A 2:1 answer may correctly identify the cycle but waver on whether the rule defines the relation, potentially accepting the Board's claim too readily without addressing the normative collapse.

  Four marks are allocated for the critique of Salience-Relative Betterness. To secure full marks, the student must observe that the Westmarsh cycle occurs within a fixed context, rendering relativisation ineffective. A First-class response will explicitly note that majoritarian aggregation cycles even when dimensions are held constant. A 2:1 response might argue that relativisation works generally but fail to apply it specifically to the fixed context of the Board's meeting, treating the view as more successful than it is here.

  Four marks are allocated for comparing the ladder and cycle cases. The distinction must be drawn between sorites-based accumulation (ladder) and multidimensional aggregation (cycle). A First-class answer will explain that these attack different premises (tolerance vs. aggregation). A 2:1 answer may correctly state they are different but fail to articulate the structural difference, perhaps claiming both are just about small differences.

  Four marks are allocated for evaluating the horns of the dilemma. The student must weigh the cost of abandoning transitivity against the cost of rejecting the Board's rule. A First-class answer will recognise that abandoning transitivity is the higher cost, as it undermines value theory itself. A 2:1 answer may treat the costs as equal or hesitate to prioritise conceptual coherence over institutional definition.

  Four marks are allocated for the final verdict. This requires a decisive conclusion, not a hedge. A First-class answer will unequivocally reject the Board's claim and affirm transitivity. A 2:1 answer may reach the correct conclusion but qualify it excessively or fail to commit, ending with an 'on the one hand' shrug rather than a philosophical stance.

  Typical howlers

  Students frequently lose marks by recalculating the Westmarsh scores incorrectly, missing the cycle entirely. Others confuse Salience-Relative Betterness with simple subjectivism, arguing that betterness depends on the observer rather than the context of comparison. A common error is treating the ladder and cycle cases as identical sorites arguments, missing the multidimensional nature of the Board's problem. Finally, many students refuse to deliver a verdict in part (d), fearing that picking a side is too dogmatic, not realising that the question demands a commitment to either conceptual coherence or institutional definition.
