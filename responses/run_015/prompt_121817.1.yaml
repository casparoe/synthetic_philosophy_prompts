prompt: |-
  hey im in an epistomology class and we just covered those classic cases where justified true belief still isnt knowledge cause the reasoning is somehow broken. i was thinking about something that happened at my internship: we use this software that checks data sources and flags them green or red. turns out the flagging algorithm had a hidden bug that made it random, but my supervisor still trusted a green flag and formed the belief that the dataset was reliable. the dataset actually was reliable, just not for the reson she thought. is there a name for this kind of thing where your justifcation is broken but its broken inside the tool, not inside your own head? it feels like a Gettier case but also not, since she didnt have a false premise, she just had a broken pipeline. if theres no term for it, how do people usually draw the line between personal reasoning errors and these instumental ones? trying to decide if this is too weird for my final paper.
