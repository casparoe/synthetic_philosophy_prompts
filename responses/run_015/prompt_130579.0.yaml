      *   **The Goal:** A *diagnosis* of the disagreement, not a verdict on rent control. Needs to rank the sources of disagreement (baseline, population ethics, nature of housing, etc.) by weight. Needs to suggest what would count as *progress* (numbers, distinctions, examples, or accepting bedrock).
      *   **Constraints:** Priya will read this. Do not take sides. Do not re-litigate Econ 101 (supply/demand effects are stipulated). Be honest and constructive.

