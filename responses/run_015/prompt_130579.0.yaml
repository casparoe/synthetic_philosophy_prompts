answer: |-
  This is a remarkably clear-eyed summary of a stalemate that destroys most friendships much faster than it destroyed yours. You are right to suspect that the economics is not the engine here; it is merely the chassis. You have both stipulated the mechanics of the car; you are arguing about the destination and who is allowed in the passenger seat.

  Here is the diagnosis of your fight, ranked by the weight each factor is actually carrying, followed by what progress would look like.

  ### 1. The Baseline Problem (Non-Ideal vs. Ideal Theory)
  **Weight: 45%**

  This is the heavy lifter. You are arguing from the perspective of a **Planner**; Priya is arguing from the perspective of an **Organizer**.

  *   **Your Baseline:** The Efficient Frontier. You are evaluating the policy against a theoretical optimum (vouchers + upzoning). In this frame, rent control is a "deadweight loss" because it is inferior to the policy package that *should* exist.
  *   **Priya's Baseline:** The Feasible Set. She is evaluating the policy against the counterfactual of what this specific city council will *actually* do. In her frame, the choice is not "Rent Control vs. Vouchers + Upzoning." The choice is "Rent Control vs. Status Quo."

  This is a disagreement about **political opportunity cost**. You view the political capital spent on rent control as a distraction from better policies. She views it as the only capital currently available to prevent immediate harm. If you believe the "better policy" is politically impossible in the current cycle, her baseline is the correct one for decision-making. If you believe fighting for rent control actively kills the possibility of upzoning later, your baseline is the correct one. You haven't argued the political causal chain; you've argued the economic efficiency.

  ### 2. Identified vs. Statistical Lives (Population Ethics)
  **Weight: 30%**

  You nailed this in your hypothesis. This is the "concentrated benefits, diffuse costs" problem moralized.

  *   **You:** Are counting the **statistical future tenant**. The person who wants to move to the city in 2026 but can't find an apartment because turnover dropped. This person is anonymous, unseen, and their loss is a "forgone gain" (never moving there) rather than an active loss.
  *   **Priya:** Is counting the **identified current tenant**. The named neighbor facing eviction in March. Their loss is catastrophic, visible, and immediate.

  In moral philosophy, humans consistently weight identified lives higher than statistical lives. Priya is leveraging this. She is prioritizing **risk mitigation for the vulnerable incumbent** over **aggregate utility for the potential migrant**. This isn't just a bias; it's a distributive weight. She is willing to accept a reduction in total housing efficiency to purchase insurance for the current poor against displacement. You are unwilling to tax the future mobile class to insure the current stationary class.

  ### 3. The Nature of the Good (Housing vs. Labor)
  **Weight: 20%**

  Do not dismiss this as a gut feeling. It is load-bearing, and it is the answer to your "symmetry" problem regarding the minimum wage.

  *   **The Asymmetry of Exit Costs:** If the minimum wage causes you to lose your job, you lose income. If rent control causes a landlord to withdraw a unit, the tenant loses *shelter*. The utility curve for housing is steeper and more inelastic than for labor at the margin of survival.
  *   **Commodification:** Priya's argument is that housing has a **use-value** that dominates its **exchange-value** in a way that labor does not. A job is a means to an end; a home is partly an end in itself. Therefore, market clearing mechanisms (price) are morally more tolerable in labor markets (where we can argue for a floor to protect dignity) than in housing markets (where we might argue for a ceiling to protect security).

  Her point is that a price distortion in a market for a **necessity with high exit costs** is ethically distinct from a price distortion in a market for **income generation**. You treated them as isomorphic price controls; she treated them as interventions in distinct moral spheres.

  ### 4. Empirical/Technical Disagreement
  **Weight: 5%**

  This is decoration. You both agree on the literature. Your attempt to use "monopsony power" to distinguish labor from housing was indeed a deflection that didn't work, because you both know housing markets also have local monopolies (landlords in specific neighborhoods). This is not where the fight is.

  ***

  ### The Two Questions You Are Answering

  You are talking past each other because you are answering two different questions under the heading "Is rent control good?"

  1.  **Your Question:** "Is rent control the optimal mechanism for allocating housing resources in a well-functioning state?"
      *   *Answer:* No.
  2.  **Priya's Question:** "Is rent control a permissible triage mechanism to prevent displacement in a constrained political environment?"
      *   *Answer:* Yes.

  ### What Counts as Progress?

  Since you have stipulated the empirical literature, looking up a number will not solve this. You cannot data your way out of a disagreement about baselines and moral weights. However, you can move the conversation from "Who is right?" to "What are we trading?"

  **1. Acknowledge the Political Baseline (The "Second Best" Concession)**
  Progress happens if you explicitly concede the baseline point without conceding the policy.
  *   *Say this:* "Priya, I think I've been evaluating this policy against a world where the council passes upzoning, and you're evaluating it against a world where they do nothing. If the upzoning is off the table, I admit the calculation changes. My objection isn't that this helps no one, but that it helps the incumbents at the expense of the movers."
  *   *Why:* This validates her political realism without requiring you to love rent control.

  **2. Reframe the "Housing is Different" Claim**
  Stop trying to prove housing is like labor. Engage with her claim that it isn't.
  *   *The Distinction:* Ask if she supports **permanent** rent control or **transitional** rent control.
  *   *The Progress:* If she admits that rent control is strictly an *emergency brake* (to prevent immediate displacement shocks) rather than a *steering wheel* (long-term allocation), you might agree on the *duration* even if you disagree on the *principle*. If she argues it must be permanent, then the "housing is different" claim must bear the weight of permanent inefficiency.

  **3. The "Package" Test (The Empirical Hook)**
  There is one empirical question that matters, but it's not about supply elasticities. It's about **political crowding out**.
  *   *The Question:* Does passing strict rent control *reduce* the probability of passing zoning reform or social housing in the next 5 years?
  *   *Why:* If you can find evidence (or a case study, like Berlin or Stockholm) where rent control satisfied the political demand for "action" and killed supply-side reforms, your baseline argument wins. If you find cases where rent control stabilized communities enough to *build* political capital for later construction, her baseline wins.
  *   *Action:* Look for political science literature on the "sequencing" of housing policy, not economic literature on the "effects" of rent control.

  **4. Accept the Bedrock**
  If you clarify the baselines and she still says, "I know it reduces mobility, I know it hurts future tenants, but I prioritize the current tenant's security over the future tenant's opportunity," then you have hit bedrock.
  *   *Verdict:* That is a valid moral position. It is a prioritarian view (maximize the well-being of the worst off, even at cost to the aggregate). You are likely a utilitarian (maximize total welfare).
  *   *Resolution:* You don't resolve this. You acknowledge that you weigh the "statistical future person" higher than she does. You agree to disagree on the weighting, not the facts.

  ### Summary for the Diner
  Tell her this: "I think we agree on the physics of the policy. We disagree on the politics of the feasible set, and we disagree on whether the rights of the person who *can't move in* outweigh the security of the person who *might get kicked out*. I've been arguing like a planner; you've been arguing like an organizer. I can respect the organizer's calculus even if I don't share the weights."

  That is the only path that ends the fight without ending the friendship.
