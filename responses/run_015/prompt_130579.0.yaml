      *   *2. The Moral Weight of Identified vs. Statistical Lives:* User cares about the diffuse, future losers. Priya cares about the concentrated, present losers. This is population ethics + risk aversion.
      *   *3. The Nature of the Good (Housing vs. Labor):* Priya's point about housing being distinct is load-bearing. It justifies why a distortion in housing is more tolerable than in labor (or vice versa, depending on view). It's about the *consequence* of the distortion, not the distortion itself.
      *   *4. Empirical/Technical (Monopsony/Elasticities):* Low weight. Both admit the literature. The monopsony argument was a deflection that didn't work.
