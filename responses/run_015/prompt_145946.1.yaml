answer: |-
  ### Part 1: The Performance Measure Stress-Test Protocol

  **Purpose:** To determine if a candidate metric is safe to include in a legally binding contract with performance-based funding.
  **Operators:** Two Policy Analysts (MPA level).
  **Time Budget:** 4 hours per measure.
  **Output:** A binary recommendation (Contract-Ready, Monitor-Only, Drop) and a required Sentinel Indicator.

  #### Phase 1: The Charter & Control Gates (Stop Rules)
  *If the measure fails either question, stop. The measure is dropped for contracting purposes.*

  1.  **Charter Compliance:** Can the value of this measure be verified by a third party using existing administrative records or a standardized audit without relying on provider narrative?
      *   *Sufficient Answer:* Yes, the data field exists in HMIS [Homeless Management Information System] or finance records and has a defined audit trail.
      *   *Stop Rule:* If **No**, drop. (This violates the "objectively verifiable" charter requirement).
  2.  **Agency Control:** Does the provider have direct operational control over at least 50% of the variance in this number, excluding macro-economic shocks (e.g., housing market crashes, policy changes by other departments)?
      *   *Sufficient Answer:* Yes, provider actions (staffing, case management intensity) historically correlate with changes in this metric independent of city-wide trends.
      *   *Stop Rule:* If **No**, drop. (You cannot contract for luck).

  #### Phase 2: The Goodhart Inventory (The Gaming Test)
  *The analyst must explicitly document specific mechanisms of degradation. General warnings are insufficient.*

  3.  **Channel Identification:** List three specific, distinct actions a rational provider could take to improve this metric *without* improving client outcomes. You must select from or add to this list:
      *   *Selection:* Referring or accepting only "job-ready" clients (Creaming).
      *   *Parking:* Withholding services from complex cases to avoid dragging down averages.
      *   *Reclassification:* Coding unstable housing (e.g., doubling up with relatives) as "Permanent."
      *   *Timing:* Delaying entry or exit dates to manipulate windows.
      *   *Effort Distortion:* Ignoring unmeasured needs (e.g., mental health) to focus solely on the metric.
      *   *Sufficient Answer:* Three plausible channels are named and described in one sentence each.
      *   *Stop Rule:* If the analyst cannot name three, the measure is either too vague to game or the analysts do not understand the service environment. Probe for 30 minutes; if still failed, **Demote to Monitor-Only**.

  #### Phase 3: The Sentinel & Reification Check
  *This phase addresses the "blind spot" of the metric.*

  4.  **Sentinel Pairing:** Identify one non-incentivized indicator that would deteriorate if the provider were successfully gaming the primary metric.
      *   *Sufficient Answer:* A specific data point (e.g., "Return to homelessness within 180 days") that is tracked but *not* tied to bonus/penalty.
      *   *Failure Protocol:* If no valid sentinel exists, the measure is flagged **High Risk**. It may proceed only if the contract weight is capped at <10% of total value and requires Deputy Director sign-off.
  5.  **Reification Test:** Ask: "If this number hits 100% perfection, but client well-being decreases, would the data show it?"
      *   *Sufficient Answer:* No. (The sentinel or other monitoring would catch the decline).
      *   *Stop Rule:* If **Yes** (i.e., the metric could be perfect while outcomes rot and we wouldn't know), **Drop**.

  #### Phase 4: The Values Hand-Off
  *Technical analysis ends here. Remaining decisions are political/ethical.*

  6.  **Weight Recommendation:** Based on the risks identified in Phase 2 and 3, recommend a weight cap.
      *   *Low Risk (Robust Sentinel, Hard to Game):* Up to 30% of contract value.
      *   *Medium Risk (Sentinel exists, Gaming plausible):* Max 15% of contract value.
      *   *High Risk (Weak Sentinel, Easy to Game):* Max 5% or Monitor-Only.
      *   *Note:* The Deputy Director must sign the final weight. This is not a technical decision.

  ---

  ### Part 2: Application to Current Measures

  I have run the protocol above on the three measures currently on your table. Below are the definite verdicts.

  #### Measure 1: Share of enrolled households exiting to permanent housing
  *   **Phase 1 (Charter/Control):** **Pass.** Data is in HMIS; providers control case management intensity.
  *   **Phase 2 (Gaming):** **High Risk.**
      *   *Channel 1 (Selection):* Providers recruit only those closest to housing readiness.
      *   *Channel 2 (Reclassification):* Providers count "doubled-up" with friends as permanent housing (HUD allows this, but it is often unstable).
      *   *Channel 3 (Parking):* Providers stop serving high-acuity clients (chronic homelessness, severe mental illness) to protect the rate.
  *   **Phase 3 (Sentinel/Reification):**
      *   *Sentinel:* **Return to homelessness within 6 months.** (Must be tracked).
      *   *Reification:* If exit rate is 100% but returns are 50%, the metric has failed. The sentinel catches this.
  *   **Phase 4 (Verdict):** **Conditional Pass (Weight Capped).**
      *   **Reasoning:** This is the only measure of the three that aligns with the actual goal. However, it creates a powerful incentive to "cream" the easiest clients.
      *   **Requirement:** To carry significant weight (>15%), you **must** risk-adjust the denominator. You cannot compare a provider serving chronic unsheltered individuals to one serving rapidly re-housable families.
      *   **Constraint:** Your analysts have "basic regression." Risk adjustment requires logistic regression or propensity scoring to create fair baselines. If you cannot validate a risk-adjustment model in 8 weeks, **you must cap the weight at 10%**.
      *   **Unfavorable Truth:** You have argued for this as the *headline* measure. The procedure dictates it cannot be the headline measure unless you have the statistical capacity to risk-adjust. If you use a raw rate as the primary weight, you are contractually incentivizing providers to abandon the hardest-to-serve populations. **Do not make this the largest contract weight without risk adjustment.**

  #### Measure 2: Average number of days from program entry to housing placement
  *   **Phase 1 (Charter/Control):** **Pass.** Verifiable in HMIS.
  *   **Phase 2 (Gaming):** **Critical Failure.**
      *   *Channel 1 (Quality Sacrifice):* Providers place clients into unsafe or unaffordable housing just to stop the clock.
      *   *Channel 2 (Selection):* Providers reject anyone who might take >30 days to house.
      *   *Channel 3 (Data Manipulation):* Providers delay official "entry" paperwork until housing is nearly found.
  *   **Phase 3 (Sentinel/Reification):**
      *   *Sentinel:* Housing retention at 6 months.
      *   *Reification:* A drop in days is treated as success even if the housing is lost in month 2.
  *   **Phase 4 (Verdict):** **Demote to Monitor-Only.**
      *   **Reasoning:** This measure rewards speed over stability. In homelessness services, a slow, stable exit is superior to a fast, revolving-door exit. Tying contract renewal to this incentivizes instability. It is cheap to compute, which is why the division likes it, but it is economically cheap because it is analytically weak. **Do not tie contract dollars to this.**

  #### Measure 3: Year-over-year change in unsheltered count (Point-in-Time)
  *   **Phase 1 (Charter/Control):** **Fail.**
      *   *Control:* Providers have **zero** control over the city-wide unsheltered count. This number is driven by eviction rates, wage stagnation, housing supply, and police enforcement. A provider could perform perfectly and the count could rise due to a macro-economic shock.
  *   **Phase 2 (Gaming):** N/A (Measure already failed).
  *   **Phase 4 (Verdict):** **Drop from Contracts.**
      *   **Reasoning:** Using this for contract renewal is legally vulnerable (force majeure/impossibility) and managerially incoherent. It punishes providers for city-wide failures.
      *   **Usage:** Keep this for public reporting and the Director's political communication, but **remove it from the performance matrix sent to providers.** It creates noise, not signal.

  ---

  ### Part 3: Procedural Blind Spots & Limitations

  You asked for explicitness on where this procedure will misfire. Here is where it is structurally blind:

  1.  **Collusive Gaming:** The procedure assumes an adversarial or arm's-length relationship. It does not detect gaming where city staff and providers collude to massage data to meet targets jointly. The "Objectively Verifiable" gate helps, but if the auditors are compromised, the procedure fails.
  2.  **The "Good Enough" Sentinel:** The procedure requires a sentinel, but it does not guarantee the sentinel is *sensitive* enough. For example, "Return within 6 months" is a standard sentinel, but if a provider places people in housing that fails at month 7, both the target and the sentinel look green. The procedure cannot detect time-shifted failure beyond the sentinel window.
  3.  **Data Asymmetry:** The procedure assumes the analysts can verify the data. Providers know their data entry practices better than the city. A provider can systematically miscode "permanent housing" in ways that pass a desk audit but fail a field audit. The procedure relies on the *existence* of an audit, not its *depth*.
  4.  **Irreducible Judgment:** Phase 4 hands off weight to the Deputy Director. This is not a bug; it is a feature. However, the procedure cannot prevent the Director from ignoring the "High Risk" flag. If the Director demands 40% weight on Measure 1 without risk adjustment, the procedure records the warning, but it cannot stop the decision. That is a governance failure, not a measurement failure.

  ---

  ### Part 4: Monday Morning Recommendation

  You have eight weeks. You have two analysts. You have a Director who wants Measure 3 and a Division that wants Measure 2. You support Measure 1.

  **Here is your directive:**

  1.  **Kill Measure 3 for Contracts.** Tell the Director immediately: "We cannot legally tie provider contracts to a macro-economic indicator we do not control. It exposes the city to breach-of-contract lawsuits if the count rises due to external factors. We will report it publicly, but it stays out of the RFP." This protects the city legally.
  2.  **Demote Measure 2.** Tell the Division: "Days-to-housing is a process metric, not an outcome metric. We will track it monthly to manage operations, but we will not penalize providers on it. We will not pay for speed; we will pay for stability."
  3.  **Condition Measure 1.** This is your battleground.
      *   **Action:** Task the two analysts immediately with building a **risk-adjustment model** using historical HMIS data. They need to segment clients by barrier level (e.g., income, disability, chronic status).
      *   **Deadline:** 4 weeks.
      *   **Ultimatum:** If they cannot produce a model that shows providers serving harder cases are not penalized in the raw data, **you must cap Measure 1 at 15% of the contract score.**
      *   **Script:** "I support this measure, but if we use a raw rate, we are paying providers to skim the easiest clients. If we can't risk-adjust in 8 weeks, we cap the weight to prevent harm."

  **Final Epistemic Commitment:**
  If you proceed with Measure 1 as the *largest* weight without risk adjustment, you will create a system where the providers serving the most vulnerable people are the most likely to lose their funding. The procedure verdict is clear: **Raw Exit Rates are unsafe for high-stakes contracting.** Either do the statistics or lower the stakes. Do not pretend the risk does not exist.
