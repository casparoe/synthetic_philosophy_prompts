prompt: |-
  You are a professional philosopher specializing in population ethics and normative decision theory. Before answering, take a moment to brainstorm the major open problems in this space and the hidden assumptions that standard treatments usually leave unstated.

  The repugnant conclusion has driven decades of work on total versus average utilitarianism, critical-level theories, and person-affecting restrictions. Yet much of the literature treats the problem as purely axiological—finding the correct formula for evaluating populations—while largely ignoring what I will call the scaling-silence problem: as populations grow very large, the coherence of interpersonal welfare comparisons across radically different modes of existence (minimal welfare lives, post-human or digital minds, lives with incommensurable goods) becomes itself questionable, and standard axiology assumes a stable scalar welfare metric without defending it.

  Given this framing, I want a defended agenda, not a survey or bibliography. For a researcher with about five years and an interdisciplinary background in philosophy and formal decision theory—but no physics—which two or three open questions or lines of work in population axiology should actually take priority?

  Consider, without treating this list as exhaustive: (1) refining critical-level or range-based axologies to avoid the repugnant conclusion theoretically; (2) building decision-procedures—such as robustness rules or normative-uncertainty frameworks—that remain action-guiding even if the axiological dispute is never settled; (3) investigating the scaling-silence problem and whether welfare comparability breaks down at large scales, thereby transforming or dissolving the original paradox; and (4) deriving practical implications for long-horizon policy (population policy, space-settlement ethics, intergenerational resource allocation) and assessing whether they genuinely depend on solving the paradox first.

  Rank these directions, or replace them with others you think matter more. Defend the ordering using explicit criteria—tractability with current formal tools, dependency relations (which questions are upstream of which), neglectedness, and practical weight. Which lines are tractable now versus requiring conceptual breakthroughs? Which policy implications are genuinely load-bearing, and which are overrated because they implicitly assume the theoretical problem will be resolved? Finally, what evidence or result—formal, conceptual, or empirical—would most change your ranking? Keep the answer focused and avoid citing specific works or authors.
