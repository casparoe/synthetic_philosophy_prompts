      *   *Sentence 4:* "There are only two ways to reduce the error: change the prediction to fit the input, or change the input to fit the prediction." -> **Accurate.** Perception vs. Action.
      *   *Sentence 5:* "Perception is the first and action is the second, so action is really just making your predictions come true." -> **Acceptable Gloss,** but risks circularity (see User's 2nd concern).
