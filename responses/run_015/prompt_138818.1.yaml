answer: |-
  ### Model Answer Criteria (Grading Notes)

  Before assigning a mark, here is what a competent to excellent answer (15–20/20 range) must demonstrate:

  *   **Distinction between Type, Token, and Glyph:** Must distinguish between the abstract letter type (the 'a'), the token (this specific ink mark), and the glyph/letterform (the visual design). Case 2 turns on this.
  *   **Nuance on Account (G):** Must recognize that "shape features" can include orientation and relative position. A sophisticated (G) does not necessarily collapse in Case 2; the student needs to argue why orientation *shouldn't* count as a feature if they want to defeat (G).
  *   **Case 1 (Allography):** Should identify single/double 'a' as *allographs* of the same type. (H) and (P) explain the unity well; (G) requires a flexible notion of "family resemblance" or equivalence classes.
  *   **Case 2 (Kestrel):** Must answer both sub-questions:
      *   *Fewer letterforms?* Yes (b and q share a form).
      *   *Fewer letters?* No (functional distinction remains).
      *   A good answer notes that (P) handles this best (functional role distinguishes the letters despite identical forms), whereas (H) relies on historical intent which might be thin if the designer intended them to be interchangeable (though the prompt implies they are distinct letters).
  *   **Case 3 (Chalk River):** Must grapple with the tension in (P). Does functional equivalence make them the *same* letter type, or merely a *homologous* type? (H) clearly denies identity (no causal chain). A strong answer questions whether (P) can grant *identity* or only *functional substitution*.
  *   **Coherence of Favored View:** The justification for favoring (P) must resolve the tensions raised in the cases without contradicting itself (e.g., claiming usage determines identity while admitting a distinction between "being" and "being readable").

  ***

  ### Mark: 14 / 20

  **Summary:** A solid, clearly structured answer that correctly identifies the strengths of (H) and (P) over a naive (G). You grasp the core philosophical tensions, particularly regarding historical lineage vs. usage. However, you rely on a strawman of the Geometric account in Case 2, conflate letterforms with letters in a way that muddies the ontology, and gloss over a significant tension in your defense of (P) in Case 3. It is a pass with merit, but lacks the precision required for the highest band.

  ***

  ### Point-by-Point Feedback

  **1. Introduction & Account (G)**
  *   **Quote:** *"All three accounts can agree on one thing: there is no list of intrinsic shape features that every a has... So (G) in its naive form is out..."*
  *   **Comment:** **Correct, but incomplete.** You correctly identify that a rigid necessary-and-sufficient condition for shape fails (the problem of variability). However, you dismiss (G) too quickly. A sophisticated Geometric account can rely on *equivalence classes* under transformation (scaling, rotation) rather than a fixed list of features. You need to argue why (G) *cannot* accommodate variance, not just that a naive version fails.
  *   **Defensibility:** A grader can challenge you here: Why isn't "closed bowl OR open top" a valid disjunctive feature set? You assume (G) must be monolithic.

  **2. Case 1 (Single vs. Double Storey)**
  *   **Quote:** *"...fluent readers read both as a and use them interchangeably, which makes them two allographs of one letter rather than two letters."*
  *   **Comment:** **Excellent.** This is the precise terminology required. You correctly use (P) to explain how distinct shapes map to a single functional type via community usage. This is the strongest part of your answer.
  *   **Defensibility:** This claim is robust. It aligns with standard orthographic theory.

  **3. Case 2 (Kestrel Sans) — The Critical Error**
  *   **Quote:** *"Kestrel Sans's b and q are literally the same shape, since rotating a shape does not change which shape it is..."*
  *   **Comment:** **Philosophically contentious/Incorrect.** In the context of notation and perception, orientation *is* a feature. A 'b' rotated 180 degrees is not perceptually identical to a 'q' in a reading context; "up" and "down" are relational features of the shape relative to the baseline. By claiming rotation doesn't change the shape, you are adopting a pure geometric congruence view that ignores the notational context.
  *   **Defensibility:** If a student appeals, ask them: If I rotate a 'u' 180 degrees, does it become an 'n'? If yes, why can't I read it as an 'n' without reorienting my head? Orientation is constitutive of the letterform in a writing system.
  *   **Quote:** *"Does Kestrel Sans contain fewer distinct letterforms than a normal font? Does it contain fewer letters?"* (Addressing the prompt)
  *   **Comment:** **Missed distinction.** You answer whether they are the "same letter," but you fail to explicitly distinguish the *letterform* (glyph) count from the *letter* (type) count.
      *   *Correct analysis:* Kestrel has fewer *letterforms* (26 shapes reduced to ~13 pairs), but the same number of *letters* (26 functional types).
      *   *Your analysis:* You imply that if they are the same shape, (G) says they are the same letter. This conflates form and type. (G) could argue they are the same form used for two different types.
  *   **Defensibility:** The prompt explicitly asks two separate questions. Ignoring the "letterform" vs "letter" distinction loses marks on precision.

  **4. Case 3 (Chalk River)**
  *   **Quote:** *"On (P), by contrast, the Chalk River forms are Roman letters: a reading community perceives them as such and uses them to read, and that is all (P) asks for."*
  *   **Comment:** **Overstatement.** (P) defines a token as an 'a' if used as an 'a' *within a working writing system*. If Chalk River is a *new* system invented from scratch, are the tokens instances of the *Roman* system, or a *new* system that happens to map onto Roman phonology?
      *   (P) risks making letter identity too volatile. If I use a star symbol ★ for 'a', is it now an 'a'?
      *   You need to qualify whether (P) grants *identity* (it is an 'a') or *functional equivalence* (it acts like an 'a').
  *   **Defensibility:** A rigorous (P) theorist might argue that without the historical system, it's a *homologous* script, not the Roman alphabet. You assert the conclusion without defending the boundary of "writing system."

  **5. Conclusion & Coherence**
  *   **Quote:** *"Being an a is not the same as being readable as an a — that distinction matters — but on (P) letter identity is fixed by what a reading community actually does with a form..."*
  *   **Comment:** **Tension/Contradiction.** You admit a distinction between "being" and "being readable," but then claim identity is fixed by what the community *reads/does*.
      *   If identity is fixed by usage/readability, then "being an a" *is* "being readable as an a."
      *   If they are distinct, then (P) cannot fix identity solely by usage.
      *   You need to clarify this. Perhaps you mean "being an a" requires successful communication, not just momentary deciphering? This needs unpacking.
  *   **Defensibility:** This is a logical slip. If a student appeals, point out that they cannot maintain a distinction between X and Y while simultaneously defining X entirely in terms of Y.

  **6. General Style**
  *   **Comment:** **Clear and concise.** Your writing is professional and easy to follow. You avoid waffle. This saves the answer from dropping lower despite the conceptual slips in Case 2.
  *   **Defensibility:** Clarity is a grading criterion; you met it.

  ***

  ### Grader's Note to Self (For your confidence)
  You mentioned you lost trust in your judgment after your argument with your friend. Here is why your judgment on the student paper should hold:
  1.  **The Rotation Claim:** The student claims rotation doesn't change shape. In philosophy of notation (Goodman, etc.), orientation is often a *constitutive* feature of the character. A 'b' is not a 'q'. The student is wrong to call (G) "absurd" here; (G) can simply count orientation as a feature. You are right to mark this down.
  2.  **The Chalk River Claim:** The student says (P) makes them Roman letters. But if I invent a new code that looks like English but has no history, is it English? Most philosophers of language say no (reference depends on history). (P) is weaker here than the student admits. You are right to question this.
  3.  **The Letterform Distinction:** The prompt asks about "letterforms" AND "letters." The student answers only one. That is a clear objective error.

  You can defend the 14/20 confidently. The student understands the *vibe* of the theories but misses the *mechanics* of the ontology.
