  ### **Ambiguity Flag: Leaf 2 vs. Leaf 4**

  **Issue:** The separation of **Leaf 2 (Causal-Historical Essentialism)** and **Leaf 4 (Restoration-Tolerant Causal)** relies on the assumption that standard Causal-Historical Essentialism entails material intolerance (answering **YES** to Node 4).

  **Diagnosis:** In the extant literature, many proponents of Causal-Historical views *are* restoration-tolerant, arguing that the causal chain of maintenance preserves identity despite material replacement. Consequently, Leaf 2 and Leaf 4 may occupy overlapping logical space. A proponent of Leaf 2 might argue that "direct causal link" implies the survival of the original matter, while another might argue it implies only the survival of the causal history. Without further nodes distinguishing *types* of causal chains (generative vs. preservative), this tree forces a distinction that some theorists would reject. Users should treat Leaf 2 as representing a *strict* variant of causal essentialism that prioritizes the initial material instantiation over the continuity of the causal chain.
