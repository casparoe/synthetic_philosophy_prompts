  # Decision Tree: The Ontology of Artistic Originality

  **Root Question:** Does an original artwork possess value that an indistinguishable forgery cannot have?

  ---

  ### **Node 1: Perceptual Sufficiency**
  **Diagnostic Claim:** *If two objects are perceptually indistinguishable to an ideal observer, do they possess equal artistic value?*

  *   **YES** → **Leaf 1: Pure Aestheticism**
      *   **Position:** Artistic value supervenes entirely on perceptual properties. History and provenance are extrinsic to the work's aesthetic worth.
      *   **Most Awkward Commitment:** The discovery that a cherished masterpiece is a forgery should not alter its aesthetic evaluation or value in any way, rendering the intuition of "betrayal" upon discovery irrational or merely economic.

  *   **NO** → Proceed to **Node 2**.

  ---

  ### **Node 2: Algorithmic Provenance**
  **Diagnostic Claim:** *Does a work generated by an algorithm trained exclusively on a deceased artist's corpus, executed without human hand, count as an original work by that artist?*

  *   **YES** → **Leaf 3: Institutional/Recognition-Based View**
      *   **Position:** Originality is a status conferred by the artworld (critics, galleries, historians) rather than a metaphysical property of the object's genesis. If the relevant community accepts the algorithmic output as part of the artist's oeuvre, it possesses the surplus value of originality.
      *   **Most Awkward Commitment:** Originality is contingent on social consensus; if the artworld is deceived into accepting a forgery or an algorithmic mimic as genuine, it *becomes* genuine, making ontological status vulnerable to collective error.

  *   **NO** → Proceed to **Node 3**.
      *   *(Note: This branch excludes Institutionalism, as Institutionalists can accommodate algorithmic works via status conferral. This branch retains views requiring a causal or agential link to the artist.)*

  ---

  ### **Node 3: Manual Necessity**
  **Diagnostic Claim:** *Is direct physical manipulation of the medium by the artist's own hand necessary for the work to be an original?*

  *   **YES** → **Leaf 5: Unnamed/Unexplored (The "Romantic Touch" View)**
      *   **Diagnosis:** This position is largely unoccupied in contemporary analytic aesthetics. It is unattractive because it rules out accepted original works produced via mediation (e.g., bronze casting, photography, architectural realization, or studio assistants) which Causal-Historical views typically accommodate. It collapses into a fetishization of physical contact that is inconsistent with the actual practices of the art forms it seeks to explain.
      *   **Most Awkward Commitment:** Must classify widely accepted originals (e.g., Rodin's casts, Warhol's screen prints) as non-originals or forgeries if the master's hand did not physically touch the final surface, contradicting established art-historical classification.

  *   **NO** → Proceed to **Node 4**.
      *   *(Note: This branch admits mediated production, consistent with standard Causal-Historical views.)*

  ---

  ### **Node 4: Material Continuity**
  **Diagnostic Claim:** *If ninety-five percent of an artwork's physical substrate is replaced during conservation, does it cease to be the original work?*

  *   **YES** → **Leaf 2: Causal-Historical Essentialism**
      *   **Position:** The value of the original resides in its specific history of production and its status as the specific artifact generated by the artist's intentional act. While mediation (Node 3) is permitted, the material instantiation of that act is crucial. Excessive replacement severs the identity link to the original creative event.
      *   **Most Awkward Commitment:** Must accept that two perceptually identical objects (the pre-restoration and post-restoration artifact) differ in ontological status and value, implying that the "work" can cease to exist while its visual appearance remains constant, making aesthetic engagement epistemically fragile.

  *   **NO** → **Leaf 4: Restoration-Tolerant Causal View**
      *   **Position:** The value resides in the continuity of the causal chain linking the current object to the original creative act, regardless of material turnover. As long as the replacement process is governed by a chain of intention preserving the work's identity, originality survives.
      *   **Most Awkward Commitment:** Must accept that an object composed almost entirely of new matter is numerically identical to the original, pushing the criteria for identity to the breaking point (the Ship of Theseus problem) and potentially allowing value to persist even when the artist's specific material choices are entirely lost.

