answer: |-
  ### 1. Model Construction and Constraints

  To avoid the "parlor trick" objection, we construct a path of small, permissible steps. We define the ship's welfare economics as follows:

  *   **Population:** $N_t$ (integer, whole people).
  *   **Resources:** Fixed budget $R$. Per-person share $s_t = R/N_t$.
  *   **Welfare Function:** $w_t = A \cdot s_t^\alpha$.
      *   We set $\alpha = 0.5$ (square-root diminishing returns) as stipulated.
      *   **Normalization:** Founding generation $N_0 = 1,000$ has $w_0 = 100$.
      *   Solving for constants: $100 = A \cdot (R/1000)^{0.5}$. We can normalize $R=1,000$ and $A=100$ for algebraic cleanliness.
      *   **Equation:** $w(N) = 100 \sqrt{\frac{1,000}{N}}$.
  *   **Constraints:**
      1.  **Engineering Cap:** $N_{t+1} \le 1.25 N_t$.
      2.  **Charter Cap:** $w_{t+1} \ge 0.90 w_t$ (No existing member loses $>10\%$).
      3.  **Pareto Constraint:** $w_{t+1} \le w_t$ (No existing member is made *better* off).
      4.  **Decency Floor:** $w_t > 0$ (All lives worth living).
      5.  **Target:** $N_{end} \ge 50 N_0$ and $w_{end} < 0.1 w_0$ (i.e., $N \ge 50,000$ and $w < 10$).

  #### Deriving the Binding Growth Rate
  We link population growth to welfare loss via the welfare function:
  $$ \frac{w_{t+1}}{w_t} = \sqrt{\frac{N_t}{N_{t+1}}} $$
  Applying the Charter Cap ($w_{t+1}/w_t \ge 0.9$):
  $$ \sqrt{\frac{N_t}{N_{t+1}}} \ge 0.9 \implies \frac{N_t}{N_{t+1}} \ge 0.81 \implies N_{t+1} \le \frac{N_t}{0.81} \approx 1.2346 N_t $$
  Since $1.2346 < 1.25$, the **Charter Cap binds**. The maximum sustainable growth rate per generation is $g = 1/0.81$. To reach the repugnant endpoint efficiently, we maximize growth at every step:
  $$ N_{t+1} = \left\lfloor \frac{N_t}{0.81} \right\rfloor $$
  *(Note: We floor $N$ to ensure whole people; this slightly increases welfare, ensuring the Charter Cap is never violated.)*

  #### Endpoint Verification
  To achieve $w < 10$:
  $$ 10 > 100 \sqrt{\frac{1,000}{N}} \implies 0.1 > \sqrt{\frac{1,000}{N}} \implies 0.01 > \frac{1,000}{N} \implies N > 100,000 $$
  A population of 100,000 yields exactly $w=10$. We must exceed this to satisfy "under a tenth." 100,000 is $100 \times$ the founding population, satisfying the "at least fifty times" requirement.

