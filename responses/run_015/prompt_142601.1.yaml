  ### 3. Theoretical Verdicts

  We evaluate three axiologies. Let $V_{Total} = \sum w$, $V_{Avg} = \frac{1}{N}\sum w$, $V_{CLU} = \sum (w - 20)$.

  | Comparison | Totalism Verdict | Averagism Verdict | Critical-Level (c=20) Verdict |
  | :--- | :--- | :--- | :--- |
  | **Step $t \to t+1$** (Early, e.g., 0→1) | **Endorse** ($111k > 100k$) | **Reject** ($90 < 100$) | **Endorse** ($86k > 80k$) |
  | **Step $t \to t+1$** (Late, e.g., 22→23) | **Endorse** ($1.02M > 0.92M$) | **Reject** ($9.7 < 10.9$) | **Reject** (Value becomes more negative) |
  | **Start vs. End** (0 vs. 23) | **Endorse** ($1.02M \gg 100k$) | **Reject** ($9.7 \ll 100$) | **Reject** ($-1.08M \ll 80k$) |

  #### Deriving the CLU Switch Point
  Your colleague expects CLU to turn against the process. This occurs when the marginal value of adding people becomes negative. We maximize $V_{CLU}(N)$:
  $$ V(N) = N \left( 100\sqrt{\frac{1,000}{N}} - 20 \right) = 100\sqrt{1,000} \cdot N^{0.5} - 20N $$
  Take the derivative with respect to $N$ and set to 0:
  $$ \frac{dV}{dN} = 50\sqrt{1,000} \cdot N^{-0.5} - 20 = 0 $$
  $$ \frac{1,581.14}{\sqrt{N}} = 20 \implies \sqrt{N} = 79.057 \implies N \approx 6,250 $$
  At $N = 6,250$, welfare is $w = 100\sqrt{1,000/6,250} = 40$.
  *   **Switch Point:** The transition crossing $N=6,250$.
  *   In our schedule, Gen 8 ($N=5,387$) to Gen 9 ($N=6,650$) crosses this peak.
  *   Gen 8 Value: $123,901$. Gen 9 Value: $124,355$. Gen 10 Value: $121,493$.
  *   **Verdict:** CLU endorses steps 0 through 9, but **rejects step 10** (and all subsequent steps).

