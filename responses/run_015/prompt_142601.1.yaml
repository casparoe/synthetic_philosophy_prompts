  Use the table in Section 3 and the CLU derivation in Section 4. Emphasize that the "Parlor Trick" is avoided not by the size of the steps, but by the **binding constraints** that force the welfare down slowly. Highlight that **Totalism is the only theory that walks the whole path**; Averagism stops at step 1, and CLU stops at step 9. The Repugnant Conclusion is thus specific to Totalism, not a general feature of population growth.
