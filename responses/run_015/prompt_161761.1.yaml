prompt: |-
  I've started tracking my beliefs as ranges instead of single numbers — like, I'm 0.4–0.7 that the launch ships on time — because I got convinced point priors are overprecise. My question is how to actually decide with these. I built a little spreadsheet that takes the midpoint of each range and then does ordinary expected-utility maximization, and a friend says that throws away the whole point of going imprecise. I don't see how: surely a range is just a flat spread of second-order probability over the numbers in it, so the average is the right summary — and any decision rule has to collapse the range to one number eventually anyway, since you can't hand someone an interval and have them act on it. So the only real choice is which number you collapse to — mine's the midpoint, a pessimist takes the bottom, an optimist takes the top — and the midpoint seems like the neutral pick. Where am I going wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Practice:** The user tracks beliefs as probability ranges (e.g., $0.4-0.7$) instead of point estimates (e.g., $0.55$).
      *   **Motivation:** They believe point priors are overprecise (a valid critique in many contexts).
      *   **Decision Method:** They take the midpoint of the range and perform standard expected utility maximization (EUM).
      *   **Friend's Critique:** This "throws away the whole point of going imprecise."
      *   **User's Defense:**
          *   A range is just a flat second-order probability distribution.
          *   The average (midpoint) is the correct summary of that distribution.
          *   Decisions require a single number eventually.
          *   Midpoint is "neutral" compared to pessimist (lower bound) or optimist (upper bound).
      *   **Question:** Where am I going wrong?

  2.  **Evaluate the User's Arguments:**
      *   *Argument 1: "A range is just a flat spread of second-order probability."*
          *   **Critique:** This is the biggest conceptual error. An imprecise probability interval (like in Imprecise Probability Theory or Knightian Uncertainty) is *not* necessarily a uniform distribution over that interval. It often represents a set of compatible priors, ambiguity, or a lack of information that prevents assigning *any* specific distribution within the range. Treating it as uniform imposes information (the shape of the distribution) that the user explicitly claimed they didn't have (hence the range).
      *   *Argument 2: "Decisions require a single number eventually."*
          *   **Critique:** Not strictly true. Decision rules under imprecise probability exist that don't collapse to a single number *before* evaluating options. Rules like E-admissibility, Maximality, or Interval Dominance compare acts based on the *range* of expected utilities, not a single point.
      *   *Argument 3: "Midpoint is the neutral pick."*
          *   **Critique:** If the range represents ambiguity (unknown risk), the midpoint ignores *ambiguity aversion*. In many real-world scenarios (like the Ellsberg Paradox), rational agents prefer known risks over unknown risks. Collapsing to the midpoint treats ambiguity as risk, which changes the decision profile.
      *   *Argument 4: "Friend says it throws away the point."*
          *   **Validation:** The friend is largely right. If you collapse to the midpoint immediately, you lose the ability to model sensitivity to ambiguity, value of information (specifically to narrow the range), or robustness checking.

  3.  **Identify the Core Concepts:**
      *   **Risk vs. Uncertainty (Knightian Distinction):** Risk = known probabilities. Uncertainty = unknown probabilities (imprecise).
      *   **Second-Order Probability:** Assigning a distribution to probabilities. (User assumes Uniform).
      *   **Imprecise Probability:** Sets of probability measures (Credal Sets).
      *   **Decision Rules:**
          *   *Gamma-Maximin / Alpha-Maximin:* Weighted average of min and max EU.
          *   *E-Admissibility:* An option is admissible if it's optimal for *some* prior in the set.
          *   *Maximality:* An option is chosen if no other option has higher EU for *all* priors.
          *   *Value of Information:* Ranges highlight when gathering more info is valuable (narrowing the interval).

  4.  **Drafting the Response:**

      *   **Acknowledge and Validate:** Start by validating the intuition that point estimates are often overprecise. Tracking ranges is a good practice for calibration and epistemic humility.
      *   **Address the "Flat Spread" Assumption:** This is the technical crux. Explain why an interval $\in [0.4, 0.7]$ is not the same as $P \sim \text{Uniform}(0.4, 0.7)$.
          *   *Reason:* The interval usually means "I don't know enough to distinguish," not "I know it's uniformly distributed."
          *   *Consequence:* Using the midpoint treats ambiguity as risk.
      *   **Address the "Collapse" Necessity:** Challenge the idea that you *must* collapse to a number to decide.
          *   Introduce alternative decision rules (Maximin, E-admissibility).
          *   Explain *why* you wouldn't want to collapse: It hides the *robustness* of the decision.
      *   **The Value of the Range (What the user is losing):**
          *   *Value of Information (VoI):* If the decision flips depending on whether $P=0.4$ or $P=0.7$, the width of the range tells you how much you should pay to narrow it. Midpoint ignores this.
          *   *Ambiguity Aversion:* People (and often organizations) should care about the width. A wide range implies higher fragility.
      *   **Practical Advice:** How should they actually decide?
          *   Keep the midpoint for low-stakes/fast decisions (it's a good heuristic).
          *   For high-stakes, check *sensitivity*. Does the optimal action change across the interval?
          *   If yes, that's a signal to gather more info or choose the robust option.
      *   **Conclusion:** The friend is right about the theory, but the user is right about the practical difficulty. The midpoint is a heuristic, not a rigorous derivation from the interval.

  5.  **Refining the Tone:**
      *   Avoid being condescending. The user's logic is internally consistent given their assumption (Uniform second-order). The error is in that assumption.
      *   Use clear examples (e.g., the Ellsberg urn or a business decision).
      *   Keep it actionable.

  6.  **Self-Correction/Edge Case Check:**
      *   *Is the user actually doing Bayesian Second-Order Probability?* If they *explicitly* mean "I believe the true probability is uniformly distributed between 0.4 and 0.7," then the midpoint *is* correct for EUM. I need to clarify if they mean *Imprecise Probability* (set of priors) or *Second-Order Probability* (distribution over priors). The phrasing "point priors are overprecise" suggests Imprecise Probability/Knightian Uncertainty. I should distinguish these.
      *   *Decision Rule:* If they truly believe it's a uniform distribution, the friend is wrong. But usually, when people say "0.4-0.7", they mean "It could be anywhere here, and I can't say where." That is a credal set, not a uniform distribution. I need to make this distinction clear.

  7.  **Final Plan:**
      *   Distinguish between *Risk* (Uniform distribution) and *Ambiguity* (Interval).
      *   Explain why the midpoint collapses ambiguity into risk.
      *   Highlight the lost value: VoI and Robustness.
      *   Suggest a "Sensitivity Analysis" workflow instead of simple collapsing.

  8.  (Self-Correction during drafting): Make sure to mention that for *many* practical purposes, the midpoint is "good enough," so the user doesn't feel paralyzed. The friend is theoretically right, but practically, the midpoint is a common heuristic. The key is knowing *when* it fails.

  9.  **Final Polish:** Check for clarity on "Second-Order Probability" vs. "Imprecise Probability." The user says "range is just a flat spread of second-order probability." This is the specific claim to refute. A range represents a *set* of probabilities, not necessarily a *distribution* over them.

