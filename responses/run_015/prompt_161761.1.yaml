answer: |-
  Your friend is theoretically right, but you are practically reasonable. The tension here comes from a specific conceptual conflation: you are treating **imprecise probability** (ambiguity) as if it were **second-order risk** (a known distribution over probabilities).

  Here is exactly where the logic breaks, why the midpoint heuristic works sometimes but fails dangerously at others, and how to actually use ranges for decision-making without paralysis.

  ### 1. The Category Error: Ambiguity vs. Risk
  Your defense rests on this claim: *"Surely a range is just a flat spread of second-order probability over the numbers in it."*

  This is the critical error. In decision theory, there is a distinction between **Risk** and **Ambiguity** (often called Knightian Uncertainty).

  *   **Risk:** You know the distribution. (e.g., "There is a 50% chance the coin is biased to 0.4 and a 50% chance it is biased to 0.7.") Here, the midpoint is mathematically correct for Expected Utility Maximization (EUM).
  *   **Ambiguity:** You know the bounds, but you cannot assign weights inside them. (e.g., "The probability is somewhere between 0.4 and 0.7, and I have no information to distinguish any value in that range from any other.")

  By taking the midpoint, you are implicitly asserting a **Uniform Distribution** over that interval. You are claiming you *know* that 0.55 is just as likely as 0.41 or 0.69.

  But the whole reason you started using ranges was that you felt point priors were *overprecise*. Assigning a specific shape (uniform) to the interior of that range is also a form of precision you likely don't possess. You are converting **Ambiguity** (unknown probabilities) into **Risk** (known probabilities) by fiat.

  ### 2. What You Lose by Collapsing to the Midpoint
  If you collapse the range to a single number immediately, you lose access to the three most valuable features of tracking imprecise beliefs:

  #### A. Sensitivity Analysis (Robustness)
  The most important question a range answers is not "What is the average outcome?" but **"Does my decision change depending on where the truth lies in this interval?"**

  *   **Scenario:** You have two projects.
      *   Project A: Expected value \$100k (stable).
      *   Project B: Expected value \$90k–\$110k (depends on the launch probability).
  *   **Midpoint Approach:** If the midpoint of B is \$105k, you pick B.
  *   **Range Approach:** You notice that if the probability is near 0.4 (the lower bound), Project B loses money. If it's near 0.7, it wins big.
  *   **The Insight:** The range tells you that Project B is *fragile*. If you are ambiguity-averse (which is rational when models are shaky), you might prefer Project A because its value is robust across the interval, even if B's midpoint is higher. Collapsing to the midpoint hides this fragility.

  #### B. Value of Information (VoI)
  The width of your interval is a direct measure of how much you should be willing to pay to reduce uncertainty.

  *   If your belief is $0.55 \pm 0.01$, the midpoint is a very safe summary.
  *   If your belief is $0.55 \pm 0.30$, the midpoint is dangerous.

  By collapsing to the midpoint, you treat these two scenarios identically. But in the second case, the "range" is screaming at you to **delay the decision and gather more data.** If the optimal decision flips between the lower and upper bound of your interval, the Expected Value of Perfect Information (EVPI) is high. The midpoint calculation suppresses this signal.

  #### C. Ambiguity Aversion
  Standard EUM assumes agents are neutral to ambiguity. However, in real-world engineering, finance, and policy, agents are often ambiguity-averse (the Ellsberg Paradox).

  If you are launching a product and your probability estimate is wide ($0.4-0.7$), it implies your model is weak. A rational decision rule might discount the expected utility based on the *width* of the interval, not just the center. A pessimist isn't just taking the bottom bound; they are applying a penalty proportional to the uncertainty. The midpoint ignores the "cost" of the uncertainty itself.

  ### 3. How to Actually Decide with Ranges
  You don't need to abandon the spreadsheet, but you should change how you use it. You are right that you eventually need to act, but you shouldn't collapse the range *before* evaluating the action.

  Here is a three-step workflow that respects the range:

  **Step 1: Compute the Range of Expected Utilities**
  Instead of computing one EU number using the midpoint, compute the **EU Interval**.
  *   $EU_{min} = \text{Utility} \times P_{lower}$
  *   $EU_{max} = \text{Utility} \times P_{upper}$
  *   Do this for all available options.

  **Step 2: Check for Dominance**
  *   **Strong Dominance:** If Option A's $EU_{min}$ is higher than Option B's $EU_{max}$, choose A. The range didn't matter; A is better regardless of the uncertainty.
  *   **Overlap:** If the EU intervals overlap, your uncertainty *matters*.

  **Step 3: Apply a Decision Rule for Overlap**
  When intervals overlap, do not default to the midpoint. Instead, choose based on context:
  *   **Maximin (Pessimistic):** Choose the option with the highest $EU_{min}$. (Good for survival scenarios, safety-critical systems).
  *   **Maximax (Optimistic):** Choose the option with the highest $EU_{max}$. (Good for venture capital, "moonshots" where downside is capped).
  *   **Hurwicz Criterion (Weighted):** Pick a coefficient $\alpha$ (e.g., 0.6) representing your degree of optimism. Calculate $\alpha \cdot EU_{max} + (1-\alpha) \cdot EU_{min}$. This is superior to the midpoint because $\alpha$ explicitly encodes your risk/ambiguity tolerance, rather than hiding it in a "neutral" average.
  *   **Info-Gathering:** If the overlap is significant and the stakes are high, the correct decision is **"Do not decide yet."** Spend resources to narrow the probability range.

  ### Summary
  Your friend is right that taking the midpoint "throws away the point," because it converts **uncertainty about the model** into **risk within the model**.

  *   **Where you are right:** You cannot act on an interval directly; you must eventually pick a path. The midpoint is a fast, low-stakes heuristic.
  *   **Where you are wrong:** The interval is not a uniform distribution. It is a set of compatible probabilities.
  *   **The Fix:** Don't collapse the probability range to a number *before* calculating utility. Collapse the **utility range** to a decision *after* checking for robustness.

  If the decision is the same at 0.4 and 0.7, use the midpoint—it doesn't matter. If the decision flips between 0.4 and 0.7, the midpoint is lying to you, and that's the exact moment you need to stop maximizing and start investigating.
