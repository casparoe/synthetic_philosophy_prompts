  10. **Final Polish:** Ensure the distinction between *descriptive psychology* and *normative ethics* is clear in the translation. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to explicitly mention the "Person $\times$ Situation" interaction term, as that's key to the statistical translation of the VE reply. Also, emphasize the "Base Rate" argument regarding moral expertise.

