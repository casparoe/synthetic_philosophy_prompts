prompt: |-
  I'm a retired field ecologist who spent most of my career on experimental design — replication, effect sizes, reliability, and the whole apparatus of deciding when a pattern in the data is worth believing. Only in the last couple of years have I started reading philosophy for its own sake, and I'm currently working through the situationist critique of virtue ethics, the line of argument associated with Mischel, Baumeister, and Haidt, along with the replies the virtue ethicists have offered. I've been going over it with a former postdoc who's now a social psychologist, and we keep talking past each other, which tells me the disagreement is at least partly a clash of vocabularies: the situationists' case reads to me as mostly a statistical case, while the virtue ethicists' reply is partly statistical and partly something else I can't yet name, and I suspect that mismatch is where my confusion lives.

  Could you restate the whole exchange — the situationist critique and the virtue ethicist's response — in the vocabulary I actually work in: effect sizes, test-retest reliability, internal consistency, construct validity, base rates, and above all the distinction between a measure's failing and the thing it is supposed to measure's failing to exist? I'd like the translation to be as faithful as you can make it, and I don't want you to paper over the places where the philosophical argument doesn't quite fit a statistical frame. Then give me the residue report, which is the part I care about most: which claims translate cleanly into my vocabulary, which only translate with distortion, and which have no expression in it at all. In particular, I want your honest judgment on two things. First, whether the situationists' move from "the data don't support global character traits" to "global character traits don't exist" is a statistical error — a mistake about what the evidence licenses — or a legitimate philosophical point that statistics simply cannot settle, and if it is the latter, why. Second, whether the normative, teleological heart of virtue ethics — what a virtuous life is for, and what moral development is aimed at — survives the translation at all, or whether it is something my vocabulary was never built to carry, and what that tells us about whether the residue is a defect of my framework or a sign that the philosophical disagreement is less substantive than it looks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field ecologist. Expert in experimental design, statistics (replication, effect sizes, reliability, validity), and scientific inference. New to philosophy (specifically virtue ethics and situationism).
      *   **Current Activity:** Reading the situationist critique of virtue ethics (Mischel, Baumeister, Haidt) and virtue ethicist replies. Discussing with a social psychologist postdoc.
      *   **Problem:** Talking past each other. Suspects a vocabulary clash (statistical vs. philosophical).
      *   **Task:**
          1.  Restate the situationist critique and virtue ethicist response using the user's statistical/ecological vocabulary (effect sizes, reliability, validity, etc.).
          2.  Distinguish between measure failure vs. construct failure.
          3.  Provide a "Residue Report": What translates cleanly, what distorts, what doesn't translate.
          4.  Answer two specific judgment questions:
              *   Is the situationist move from "data don't support" to "traits don't exist" a statistical error or a philosophical point stats can't settle?
              *   Does the normative/teleological heart of virtue ethics survive translation, or is the user's vocabulary unfit for it? What does this imply about the disagreement?
      *   **Constraint:** Be faithful, don't paper over mismatches, be honest about the limitations of the statistical frame.

  2.  **Deconstruct the Philosophical Debate (Situationism vs. Virtue Ethics):**
      *   *Virtue Ethics (Aristotelian):* Character traits (virtues) are robust, stable dispositions to act/feel/think in certain ways across diverse situations. They are acquired through habituation. They explain behavior.
      *   *Situationist Critique (Doris, Harman, drawing on Psych):* Empirical data (Milgram, Stanford Prison, Darley & Batson) shows behavior is overwhelmingly determined by situational variables, not internal dispositions. Cross-situational consistency is low. Therefore, global traits don't exist.
      *   *Virtue Ethicist Response:* Traits exist but are rare (expertise model). Traits are sensitive to situations (not rigid). The data measures the wrong things (construct validity issue). Normative goal is aspirational, not descriptive of the average.

  3.  **Translate to Ecological/Statistical Vocabulary:**
      *   *Global Character Traits:* Latent constructs (like "species fitness" or "ecosystem resilience").
      *   *Situationist Data:* Low correlation coefficients between behavior in Situation A and Situation B (low cross-situational consistency). Small effect sizes for person variables compared to situation variables.
      *   *Reliability:* Test-retest reliability (stability over time) vs. Internal consistency (consistency across different items/situations). Situationists argue internal consistency of "character" is low.
      *   *Construct Validity:* Are the experiments actually measuring "virtue" or just compliance?
      *   *Base Rates:* How many people actually possess the trait? (Virtue ethicists say few; Situationists imply almost none).
      *   *Measure vs. Construct:* Just because the survey fails to detect the trait doesn't mean the trait isn't there (signal-to-noise ratio issues).

  4.  **Drafting the Translation (Section 1):**
      *   *Situationist Argument:* It's a power analysis problem. The "Person" variance component is tiny compared to the "Situation" variance component. Effect sizes of traits on behavior are $r < 0.30$. This is below the threshold for predictive utility. Therefore, the construct "Global Trait" has poor external validity.
      *   *Virtue Ethicist Response:*
          1.  *Sampling Error:* You are sampling the general population. Virtues are like elite athletic performance. Base rates are low. You can't disprove Olympic sprinters by measuring the jog speed of random pedestrians.
          2.  *Construct Validity:* Your experimental situations are too strong (overwhelming the signal). It's like testing drought resistance by flooding the plot.
          3.  *Reliability:* Traits aren't rigid algorithms; they are interaction terms (Person $\times$ Situation). Low cross-situational correlation doesn't mean no trait; it means the trait is context-sensitive.

  5.  **Drafting the Residue Report (Section 2):**
      *   *Clean Translations:* Effect sizes, consistency, reliability, base rates, person-situation interaction.
      *   *Distorted Translations:* "Existence" of a trait (statistical existence vs. ontological existence), "Normativity" (what *ought* to be vs. what *is*).
      *   *No Expression:* Teleology (purpose), Moral Development (normative trajectory), The "Good Life" (Eudaimonia).

  6.  **Addressing the Two Judgment Questions (Section 3):**
      *   *Q1: Statistical Error or Philosophical Point?*
          *   It's a category error disguised as a statistical inference. "Existence" in philosophy isn't the same as "Statistically Significant Predictor in a Linear Model." Situationists commit an inference leap: $H_0$ not rejected $\rightarrow$ Null is True. But also, they define "trait" operationally in a way VE rejects.
          *   *Verdict:* It's a philosophical point stats can't settle because it hinges on the definition of the construct.
      *   *Q2: Normative/Teleological Heart:*
          *   Stats describe *what is*. Virtue ethics prescribes *what ought to be*.
          *   *Verdict:* The vocabulary cannot carry it. This isn't a defect of the framework (stats aren't meant for norms), but it means the disagreement is substantive. One side talks about prediction (psych), the other about cultivation (ethics).

  7.  **Refining and Polishing:**
      *   *Tone:* Respectful, professional, acknowledging the user's expertise. Avoid condescension. Use the user's specific terms (effect sizes, reliability, etc.).
      *   *Check:* Did I address the "measure failing vs. thing failing" distinction? Yes, under Construct Validity.
      *   *Check:* Did I answer the specific "Residue Report" requirements? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "stats can't do norms." I need to explain *why* that matters for the specific debate. The Situationists treat ethics as a descriptive science; VEs treat it as a normative project. That's the core clash.

  8.  **Final Review against constraints:**
