answer: |-
  Your seminar mate is using a poetic metaphor to smuggle in a causal necessity claim. They are arguing that the Terror was not a contingent outcome of specific decisions, institutions, and pressures, but a structural feature of "Revolution" itself. This shuts down inquiry because if something is necessary, explaining it is redundant.

  Here is the menu of precise claims hidden inside that aphorism. I have sharpened your sketches, collapsed overlaps, and added the critical missing dimensions. For each, I give a verdict on its truth, its modal strength (does it prove inevitability?), and the baseline required to test it.

  ### 1. The Definitional Claim (Your Selection-Effect)
  *   **The Claim:** The term "children of the revolution" is retrospectively applied only to those who were executed. If a founder survives, we don't count them as a "devoured child." Therefore, the statement is true by definition.
  *   **Verdict:** **Trivial.** It is linguistically true but explanatorily empty. It confuses naming with causation.
  *   **Modal Strength:** **Inevitability.** (But only because it defines the outcome into the premise).
  *   **Testability:** **Impossible.** You cannot falsify a tautology. To test this, you would need an independent definition of "children" (e.g., "all members of the initial provisional government") and then check survival rates. If your seminar mate refuses to count survivors as "children," they are immune to evidence.

  ### 2. The Coalition Fragmentation Claim (Your Coalition-Fragmentation)
  *   **The Claim:** Revolutions require a broad coalition to succeed (monarchists, republicans, sans-culottes, bourgeoisie). Once the common enemy (the King) is removed, the coalition's incompatible positive agendas clash. Since there are no neutral institutions to adjudicate these clashes, the conflict is settled by purging the losers.
  *   **Verdict:** **Plausible-but-needs-argument.** This is standard political science, not metaphysics. It depends on the heterogeneity of the coalition and the absence of arbitration mechanisms.
  *   **Modal Strength:** **Probability Nudge.** It makes purges *likely*, not bound. It depends on whether the coalition can institutionalize compromise quickly enough.
  *   **Testability:** **High.** The baseline is a revolution where the founding coalition successfully transitioned to a stable power-sharing arrangement without mass executions of leadership.
      *   *Counter-example:* The Glorious Revolution (1688) or the American Revolution. In the US, Federalists and Democratic-Republicans fought bitterly but did not guillotine each other. If your mate says "Those weren't real revolutions," they are moving the goalposts (see Claim 6).

  ### 3. The Violence Ratchet Claim (Your Escalation/Commitment)
  *   **The Claim:** Revolutionary violence creates a commitment problem. Once you break the law to seize power, you cannot use the law to secure your position. Each round of violence raises the stakes, making moderation look like weakness and eliminating moderate actors until only the most ruthless remain.
  *   **Verdict:** **Plausible.** This describes a dynamic feedback loop. It explains *how* the Terror escalated, but not that it *had* to start.
  *   **Modal Strength:** **Probability Nudge.** It explains path dependence. Once on the slope, sliding down is likely, but starting the slide is contingent.
  *   **Testability:** **Medium.** You need a case where revolutionaries broke legality to seize power but successfully re-established legal norms without turning the security apparatus on themselves.
      *   *Counter-example:* Post-Apartheid South Africa. Significant structural overthrow occurred, but the ANC largely avoided purging its own leadership through violence.

  ### 4. The Epistemic Security Dilemma (Your Informational Claim)
  *   **The Claim:** Revolutionary regimes operate under high uncertainty and external threat. Because they lack legitimate intelligence networks, any failure (military loss, food shortage) is interpreted as sabotage. Since sabotage requires intent, and insiders have access, insiders become the primary suspects. Purging is a rational (though horrific) information-processing strategy.
  *   **Verdict:** **Plausible.** This treats the Terror as a rational response to an information crisis, not just bloodlust.
  *   **Modal Strength:** **Probability Nudge.** Depends on the intensity of external threat and the robustness of intelligence.
  *   **Testability:** **Medium.** A revolution facing low external threat or possessing robust intelligence channels should see fewer internal purges.
      *   *Counter-example:* Revolutions that occurred in isolated or secure geopolitical environments where "foreign conspiracy" was less plausible.

  ### 5. The Ideological Purity Claim (Missing from your list)
  *   **The Claim:** Some revolutions are teleological (aimed at creating a New Man or Utopia), not just political (aimed at changing leadership). In teleological revolutions, policy disagreement becomes heresy. Since heresy corrupts the mission, heretics must be eliminated. The "children" are devoured because they are the first to fail the purity test.
  *   **Verdict:** **Plausible (but specific).** This applies strongly to the French, Russian, and Chinese revolutions. It does not apply to all regime changes.
  *   **Modal Strength:** **Conditional Inevitability.** *If* the revolution is ideological/utopian, purges are nearly inevitable. *If* it is purely procedural, they are not.
  *   **Testability:** **High.** Compare ideological revolutions vs. non-ideological coups.
      *   *Counter-example:* A revolution focused solely on electoral reform or independence without a social engineering component. If those leaders purge each other, this claim weakens.

  ### 6. The Non-Specificity Claim (Your Contrast-Class)
  *   **The Claim:** "Revolution" is doing no work here. All authoritarian transitions, corporate takeovers, and unstable dictatorships purge insiders. Attributing this to "Revolution" is a category error.
  *   **Verdict:** **True.** This undermines the seminar mate's implication that there is something *unique* about revolution causing this. It suggests the cause is "concentrated power," not "revolution."
  *   **Modal Strength:** **Negates Inevitability.** It shifts the cause from the *event* (revolution) to the *structure* (autocracy).
  *   **Testability:** **High.** Compare purge rates in revolutionary regimes vs. non-revolutionary dictatorships established by other means. If the rates are the same, "Revolution" is not the explanatory variable.

  ---

  ### The Core Philosophical Problem: The "No True Scotsman" Trap

  You asked what baseline would be needed for these to be testable, and whether your seminar mate would define the counter-example out of existence. This is the crux of the issue.

  For any of the plausible claims (2, 3, 4, 5) to function as science rather than poetry, we need a **falsifiable definition of "Revolution."**

  *   **The Trap:** If you point to the American Revolution or the Glorious Revolution and say, "They didn't devour their children," your seminar mate will reply, "Those weren't *real* revolutions; they were reforms/wars of independence."
  *   **The Consequence:** If "Real Revolution" is defined as "A regime change that devours its children," then Claim 1 (The Definitional Claim) is the only one left standing. The aphorism becomes a tautology: "Revolutions that purge their leaders purge their leaders."
  *   **The Fix:** You must insist on a definition of revolution independent of the outcome. For example: "A rapid, extra-constitutional transfer of power driven by mass mobilization."
      *   If you use this definition, and find cases (like South Africa, or perhaps the initial phase of the American Revolution) where leaders were not purged, the **Inevitability Claim is false.**

  ### Verdict on the Seminar Mate's Usage

  Your seminar mate is using the aphorism to commit the **Fatalist Fallacy**.

  1.  **If they mean Claim 1 (Tautology):** They are saying nothing true about the world, only about language. It explains nothing.
  2.  **If they mean Claims 2-5 (Causal Mechanisms):** These are plausible but probabilistic. They explain *risk factors*, not destiny. They leave room for contingency (e.g., if Danton had acted differently, if the war had gone better, if the institutions had been stronger).
  3.  **If they mean Inevitability:** They are false. History shows variance. Some revolutions stabilize without mass execution of founders (e.g., the Velvet Revolution, the American Revolution).

  **Conclusion:** The sentence is not a theory; it is a conversation-stopper disguised as wisdom. It collapses distinct causal mechanisms (ideology, security dilemmas, coalition friction) into a single mythical force. It is **false as a claim of inevitability**, **trivial as a definition**, and **plausible only as a probabilistic risk assessment** contingent on specific variables (ideology, war, institutional vacuum) that can be identified and potentially mitigated.
