  You're a professional philosopher who also happens to know a lot about revolutions and political violence. Please don't cite anything or give me reading suggestions — I can't check them and I don't care who said what, I care what's true.

  In my undergrad seminar on the French Revolution someone keeps deploying "revolutions, like Saturn, devour their children" as a total conversation-stopper: once you've granted the revolution happened, the Terror — including the execution of the revolutionaries themselves — was basically bound to follow, so there's nothing left to explain and no room for contingency. I'm sure the sentence isn't doing that much work but I can't say exactly why.

  Can you lay out, as a menu, the different precise claims that sentence could actually be making? Here's my own rough sketch — sharpen it, say which of mine collapse into each other, and add the ones I'm missing:

  - a selection-effect claim: the people who end up in the history books as "the revolution's children" are just whoever got killed, so the sentence can't fail to come out true, and would apply equally to any factional purge anywhere
  - a coalition-fragmentation claim: the winning coalition is necessarily stitched together out of groups with incompatible ends, so moderates get eaten once the common enemy is gone
  - an escalation / commitment claim: each round of violence raises the cost of stopping, so the only people still willing to govern are the most ruthless ones
  - an informational claim: revolutionary legality makes conspiracy the default explanation for bad news, so purging insiders becomes the rational response to failure
  - a contrast-class worry: coups, decolonizations, regime collapses and even corporate restructurings purge their own insiders too, so "revolution" may be doing no explanatory work at all

  For each reading on your final list: is it trivial, plausible-but-in-need-of-an-argument, or false as stated? Does it support inevitability, or only nudge the probability up? And the bit I care most about: what baseline would we need for any of these to be testable — what would count as a revolution that did not devour its children, and would my seminar-mate just define that case out of the running?

  Take a minute to brainstorm the full space of readings before you settle on the final list, and please give me verdicts rather than hedging everything into mush.
