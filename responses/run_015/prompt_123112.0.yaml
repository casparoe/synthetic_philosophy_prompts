answer: |-
  Here are 9 interview questions designed to press the machinery of Dr. Reisz's Stewardship View. Each includes a follow-up calibrated to anticipate her "wrinkle, not counterexample" defense and force a substantive concession or clarification.

  **1. The Liability Creep**
  "You ground the permission to kill in a distributive requirement rather than liability: combatants bear the risk because they voluntarily became the community's instrument. But revisionists argue that voluntarily assuming a dangerous role *is* a form of responsibility-based liability. If I choose to be a soldier, I own the risks; if I choose to be a civilian, I don't. So, why aren't the civilians who voted for, funded, or cheered this war in the risk pool? They voluntarily authored the danger, whereas the conscript might have just occupied the role."

  *   **Follow-up:** "If you say authorship doesn't matter, only instrumentality, consider the drone operator. They face no physical risk but are the purest 'instrument' of force. Are they in the risk pool? If yes, why are they targetable when they're safer than the civilian voter? If no, does your view collapse into a traditional liability account where risk-exposure matters more than role-occupancy?"

  **2. The Aggregation Trap**
  "Your view says costs must fall on combatants *rather than* civilians. But suppose killing one civilian would save ten combatants from conscription and death. A utilitarian would say kill the civilian; you say the requirement is deontic, not aggregative. But if the permission to kill comes from the political community's decision to use force, doesn't that decision lose its normative power the moment it becomes unjust? How does an aggressor state's unjust decision to use force generate *any* permissions for its own soldiers, even deontic ones, to kill just defenders?"

  *   **Follow-up:** "If you say the defender's permission comes from a different source, like self-defense, then you've abandoned the symmetry of the Stewardship View. But if you say the aggressor soldier *does* have permission, aren't you effectively saying that an unjust political decision can create moral permissions for its agents? That seems to grant the state a kind of moral magic that revisionists deny it possesses."

  **3. The Epistemic Threshold**
  "Let's turn to the Exit Condition. You say combatants lose protected status once they have 'epistemic notice' that the war is probably unjust. But ordinary soldiers operate on filtered intelligence. If the bar for 'reasonable notice' is high, your view looks just like Walzer's equality: soldiers rarely know enough to exit. If the bar is low, it looks like McMahan's asymmetry: soldiers in unjust wars almost always know. Is there actually a stable middle ground where your view does distinct work, or is it just a transitional phase between the two?"

  *   **Follow-up:** "If you insist there is a middle ground, consider the 'fog of war' propaganda. If a soldier reasonably believes a lie told by their government, they lack notice. Does your view then protect soldiers fighting for a genocidal regime simply because the regime was good at lying? That seems to make protected status a function of propaganda success rather than moral standing."

  **4. The Knowledge Condition**
  "Under your view, I can kill a sleeping soldier who has failed the Exit Condition. But do *I* need to know that *you* had notice? If I kill you without knowing you were aware the war was unjust, am I still 'answerable' to your family? If I owe compensation for a permissible killing, how is this distinct from the standard revisionist treatment of 'innocent threats,' where I kill you permissibly but you aren't liable?"

  *   **Follow-up:** "You say the apology and compensation distinguish this from liability. But if I am permitted to kill you, and I kill you, and yet I owe you a debt, haven't you just redescribed 'excused wrongdoing' as 'permissible answerability'? If the killer leaves the interaction morally indebted, in what robust sense was the killing actually permitted rather than merely excused?"

  **5. The Mirror Problem**
  "Let's apply the Exit Condition to the just side. If a soldier fighting a just war receives epistemic notice that their own commanders are committing atrocities—say, targeting civilians—and they refuse to exit, do they lose their protected status? If yes, then in a dirty war where both sides have notice, everyone has lost protected status. Does your view endorse a 'war of all against all' in prolonged conflicts where atrocities become common knowledge?"

  *   **Follow-up:** "If you say no, because their *cause* is still just, then the Exit Condition isn't doing the work; the *jus ad bellum* is. But if you say yes, then the Moral Equality of Combatants disappears exactly when the war gets messiest. Why should we accept a theory of equality that vanishes precisely when we need constraints on killing the most?"

  **6. The Coercion Inversion**
  "You argue that the ease of exit scales the loss of protection: harder to exit means more protection. But this creates a counter-intuitive result for authoritarian armies. A soldier in a liberal democracy can quit with mild punishment; a soldier in a totalitarian regime faces execution or family punishment if they desert. So, on your view, the coerced soldier in the unjust army is *more* protected than the voluntary soldier in the just army. Are you comfortable with the implication that the most unjust regimes generate the strongest shields around their combatants?"

  *   **Follow-up:** "If you say this is a feature, not a bug, because we shouldn't punish those with no choice, then why are they legitimate targets at all? If their lack of exit makes them highly protected, does that mean we effectively cannot fight coercive regimes without violating their rights? It seems your distributive requirement clashes with the right of self-defense against aggressors who use human shields of their own soldiers."

  **7. The Nature of Equality**
  "We need to pin down what 'equality' means here. Is it equality of rights, equality of permissibility, or equality of liability? You claim combatants on both sides have equal permission to kill, but unequal liability based on notice. But if the unjust combatant is 'answerable' for a kill and the just combatant is not, isn't there a fundamental moral asymmetry in their standing? What exactly is equal if the moral residue of their actions differs?"

  *   **Follow-up:** "If the answer is 'equality of permission only,' doesn't that render the equality trivial? A mugger and a police officer might both have the physical 'permission' to shoot, but their moral standing differs entirely. If the unjust soldier owes compensation and the just one doesn't, haven't you conceded the revisionist point that their moral statuses are fundamentally different, regardless of the label you put on the permission?"

  **8. The Drone Operator (Risk Pool Specifics)**
  "Earlier we touched on instruments, but I want to be precise about the risk pool. You say costs fall on those who voluntarily take the role. A drone operator sits in a container in Nevada, taking zero physical risk, then goes home to sleep. Are they in the same risk pool as the infantryman? If I am an enemy combatant, am I permitted to kill the drone operator while they sleep in their bed in Ohio, or does the 'risk pool' end at the theater of war?"

  *   **Follow-up:** "If you say the risk pool follows the person regardless of location, then you are treating them like a uniformed combatant everywhere. But if their 'instrumentality' is remote, why aren't they a civilian who is merely contributing to the war effort? If they are targetable at home, does your view permit killing the software engineers who wrote the code, provided they had epistemic notice? Where does the stewardship boundary stop?"

  **9. Falsification**
  "Finally, Dr. Reisz, philosophical views need to be vulnerable to evidence or argument. What would count against the Stewardship View? Is there a specific case, a logical inconsistency, or an empirical fact about soldier psychology that, if proven true, would force you to abandon the Exit Condition or the Distributive Requirement? If nothing could change your mind, I worry this is a framework rather than a theory."

  *   **Follow-up:** "If you say 'a case where killing a civilian clearly saves more lives,' that just pushes us back to aggregation. I'm asking about the core machinery. If it turned out that soldiers *never* actually have epistemic notice, would you concede the view collapses into Walzerian conventionalism? Or if it turned out that 'answerability' is impossible to practice in war, would you concede the distinction from liability is merely theoretical?"
