answer: |-
  # The "3 AM Dorm Room" Reason Quiz

  You know the vibe. It's late, the pizza is cold, and you're arguing about whether "reasons" are things we find in the world or things we project onto it. To save your friendship (or at least pause the shouting), here is a 7-question gut-check.

  **Instructions:** Read the tiny story. Pick the answer that makes your brain go "ding," not the one that sounds smartest. Don't overthink it.

  ***

  ### 1. The Reluctant Runner (Maya)
  Maya is calm, clear-headed, and not depressed. Her doctor explains with perfect clarity that running will save her knees and heart. Maya understands all this but feels **zero** pull to run. She just hates it.
  *   **A)** She still has a reason to run. The health facts are enough.
  *   **B)** She has no reason to run. If she doesn't care, there's no reason.
  *   **C)** Saying she has a "reason" is just a confusing way of saying she *should*.

  ### 2. The Unremorseful Scammer (Dev)
  Dev scammed his little brother out of savings. He knows everyone calls it "wrong." He's reflected for a month, stays calm, and still feels **zero** pull to pay it back. He just doesn't care about morality.
  *   **A)** He has a reason to pay it back. Doing wrong creates a reason, period.
  *   **B)** He has no reason to pay it back. Reasons require caring about the right thing.
  *   **C)** "Reason" is the wrong word here; he just has an obligation he's ignoring.

  ### 3. The Poison Chaser (Lena)
  Lena wants to drink cleaning fluid because she mistakenly believes it boosts immunity. She is calm and clear-headed, just misinformed.
  *   **A)** She has a reason *not* to drink it. The truth about the poison matters.
  *   **B)** She has a reason *to* drink it. It matches what she actually wants right now.
  *   **C)** We need to define "reason" before answering this.

  ### 4. The Bored Billionaire
  A billionaire has everything but is deeply bored. Nothing excites him. Eating a specific fruit would objectively improve his mood slightly, but he has no desire to eat it.
  *   **A)** He has a reason to eat the fruit. It's good for him.
  *   **B)** He has no reason. If nothing moves him, nothing is a reason.
  *   **C)** This is just a description of his psychology, not a "reason."

  ### 5. The Dropped Wallet
  You see a stranger drop a wallet full of cash. You will never see them again. You don't care about strangers. Returning it costs you time.
  *   **A)** You have a reason to return it. It's their property.
  *   **B)** You have no reason. Unless you value honesty, it's just your choice.
  *   **C)** "Reason" implies you want to be good; if you don't, the word fails.

  ### 6. The Painful Dentist
  You need a root canal. You currently hate the idea. But Future-You will be in agony without it.
  *   **A)** You have a reason to go now. Future-You's pain counts.
  *   **B)** You have no reason now. Current-You doesn't want to go.
  *   **C)** Reasons don't travel through time like that.

  ### 7. The Alien Fact
  An alien proves a fact about the universe that implies you should hop on one leg. It doesn't help you, hurt you, or help anyone else. You have no desire to hop.
  *   **A)** If the fact is true, you have a reason to hop.
  *   **B)** If you don't want to hop, no fact can give you a reason.
  *   **C)** This is nonsense; reasons are for humans, not aliens.

  ***

  # The Tally Sheet

  Grab a scrap of napkin. We're counting **A's**, **B's**, and **C's**. But we need to split them into two piles: **Life Stuff** (Questions 1, 3, 4, 6) and **Morality Stuff** (Questions 2, 5). Question 7 is the **Wild Card**. Question 3 (Lena) is scored in **Life Stuff**.

  **Count your answers:**
  *   **Life A:** \_\_\_\_\_ (Out of 4)
  *   **Life B:** \_\_\_\_\_ (Out of 4)
  *   **Moral A:** \_\_\_\_\_ (Out of 2)
  *   **Moral B:** \_\_\_\_\_ (Out of 2)
  *   **Total C's:** \_\_\_\_\_ (Out of 7)
  *   **Q7 Answer:** \_\_\_\_\_ (A or B)

  ***

  # The Results: Who Are You?

  Find the profile that matches your counts.

  ### 1. The Strict Current-Desire Person (The Humean)
  *   **Pattern:** Mostly **B's** everywhere. (Life B is 3 or 4; Moral B is 2).
  *   **The Vibe:** "If it doesn't move me, it's not a reason." You think reasons are like fuel; if the engine doesn't burn it, it's not fuel. You think Maya is free to sit on the couch and Dev is free to keep the cash, provided they own their choices.
  *   **Philosophical Label:** Internalism.

  ### 2. The Ideal-Reflection Person (The Williams-ian)
  *   **Pattern:** Mostly **A's** on Life and Moral, **BUT** you picked **B** on Question 7 (The Alien).
  *   **The Vibe:** "Reasons are about who I would be if I was smart and informed." You think Maya has a reason because *Ideal Maya* would run. You think Dev has a reason because *Ideal Dev* would repay. But you draw the line at the Alien—reasons must connect to human interests eventually.
  *   **Philosophical Label:** Internalism (with Idealized Desires).

  ### 3. The Mixed Person (The Moral Externalist)
  *   **Pattern:** Mostly **B's** on Life Stuff, but mostly **A's** on Moral Stuff. (Life B is 3 or 4; Moral A is 2).
  *   **The Vibe:** "Health is optional, Morality is not." You think Maya has no reason to run (her body, her choice), but Dev *does* have a reason to pay his brother back (morality binds him even if he doesn't care). You split the difference: prudential reasons are internal, moral reasons are external.
  *   **Philosophical Label:** Hybrid Internalism/Externalism.

  ### 4. The Full Externalist (The Realist)
  *   **Pattern:** Mostly **A's** everywhere, **AND** you picked **A** on Question 7 (The Alien).
  *   **The Vibe:** "Truth is truth." You think facts about health, morality, and even alien logic create reasons regardless of your feelings. If it's good, you have a reason to do it. Period. You probably find the other housemates' views frustratingly subjective.
  *   **Philosophical Label:** Externalism.

  ### 5. The Skeptic (The Error Theorist)
  *   **Pattern:** Mostly **C's** (3 or more).
  *   **The Vibe:** "You're all speaking gibberish." You think "reason" is a fuzzy word people use to bully each other. You suspect there are no objective reasons, just desires dressed up in suits. You probably won't care about your quiz result.
  *   **Philosophical Label:** Skepticism / Error Theory.

  ***

  # The Philosophical Autopsy (Read This Before Arguing Again)

  You asked for the fine print. Here is where the quiz breaks down and where you might be talking past each other.

  **1. The "Incoherent" Combo:**
  If you scored **High A on Life Stuff** (Maya should run!) but **High B on Moral Stuff** (Dev doesn't need to pay back!), you hold a rare view. You think health facts give reasons, but moral facts don't.
  *   **Verdict:** This is philosophically **unexplored/weird**. Usually, if you think facts give reasons for health, you think facts give reasons for morals. If this is you, you might be confusing "reason" with "self-interest."

  **2. The "Indistinguishable" Views:**
  This quiz struggles to separate **The Ideal-Reflection Person** from **The Full Externalist** on Questions 1–6. Both of you pick "A" (Yes, there is a reason).
  *   **The Difference:** The Externalist thinks the reason exists *outside* you (in the facts). The Ideal-Reflection person thinks the reason exists *inside* you (in your better self).
  *   **Why Q7 Matters:** That's why Question 7 (The Alien) is the tie-breaker. The Externalist says "Yes, hop." The Ideal-Reflection person says "No, I don't care." If you both picked "A" on everything including the Alien, you're effectively Externalists for the purposes of this argument.

  **3. The "Lena" Problem:**
  Question 3 is the trap. If you picked **B** (She has a reason to drink), you are a **Strict Current-Desire** person, even if you picked A elsewhere. Why? Because you prioritized her actual mistaken desire over the fact of the poison. If you picked **A**, you admit that *truth* matters more than *wanting*, which pushes you toward Externalism or Ideal-Reflection.

  **4. The Skeptic's Loophole:**
  If you picked **C** a lot, this quiz can't tell if you're a deep philosophical Skeptic or just annoyed by the wording. But if you genuinely think "reason" is muddled, you win the argument by dissolving it. Congratulations, you have no reason to clean the dishes, but neither does anyone else.

  **Now, go settle the bet. Loser takes out the trash (you have a reason to do it, even if you don't want to).**
