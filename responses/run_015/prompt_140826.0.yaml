answer: |-
  You have stumbled into a classic problem in moral philosophy known as Pascal's Mugging, and the reason it bugs you is that your logic is formally correct but your inputs are hiding a substantive assumption that collapses under the weight of those huge numbers. Your colleague is mistaken about the independence issue because expectation is linear regardless of correlation, meaning that whether the sentience of insects is one big coin flip or eighteen billion little ones, the expected value calculation remains the sum of the probabilities times the values, so that path does not offer an exit. The break is actually located in the hidden premise within step one, specifically in the phrase the weight I'd give it if I were certain, because you are implicitly treating moral weight as a binary switch that toggles between zero and a standard vertebrate unit, whereas moral weight is almost certainly a function of cognitive capacity or the depth of experience rather than just the presence of experience. This looked fine when you wrote it down because in your normal work comparing cows to chickens to fish, the differences in cognitive capacity are small enough that treating them as roughly equal units is a pragmatic shortcut that does not distort the results, but when you scale that shortcut across twenty orders of magnitude to bacteria, the assumption that a bacterium's potential experience is comparable to a cow's becomes the fatal flaw.

  Your suspicion about the spreadsheet column is exactly right and resolving this does not require you to abandon expected value maximization or moral uncertainty frameworks, which would cost you the ability to compare cause areas rigorously and force you into arbitrary decision rules that lack defensibility. If you were to drop step one and stop weighting by credence, you would lose the ability to act under moral uncertainty and would have to rely on a single moral theory being true, which is dogmatic and ignores the genuine philosophical disagreement about sentience. If you were to drop step five and stop maximizing expected value, you would need to adopt a risk-averse decision theory that penalizes high-variance outcomes, but this introduces its own complexities regarding how much risk aversion is appropriate and could lead to paralysis in other high-stakes domains. The much cleaner solution is to refine the input variable in step one so that the weight assigned to a creature conditional on sentience is scaled by a proxy for its capacity for suffering, such as neural complexity or information integration, rather than treating all sentient beings as having equal moral weight per unit of time.

  This adjustment preserves your preferred premises one and three while allowing you to confidently keep step seven, because even if bacteria are sentient, their moral weight per individual is so infinitesimally small relative to a vertebrate that the product of their abundance and their tiny individual weight does not dominate the calculation. In practice this means your spreadsheet column should not simply be credence times chicken-equivalent welfare, but rather credence times a capacity-adjusted weight times welfare range, where the capacity weight for insects is orders of magnitude lower than for vertebrates and for bacteria is effectively zero for practical purposes. You do not need to know the exact function of moral weight versus neural count to solve this, you only need to acknowledge that the function is not constant, and that acknowledging this distinction prevents the reductio ad absurdum without breaking your expected value machinery. By making this change you are not abandoning the logic of expected value but rather applying it more precisely to the reality that moral significance likely tracks the richness of the subjective experience, which allows you to fill in that column with a number that reflects both the uncertainty of sentience and the uncertainty of magnitude, letting you return to focusing on farmed vertebrates without the nagging feeling that your math is secretly telling you to fund worm charities instead.
