answer: |-
  This is a magnificent problem. You have identified the exact fault line where Douglass becomes three-dimensional rather than a marble bust. If you write him as a modern liberal in a frock coat, you lose him. If you write him as a pure moralist who ignores text, you lose the lawyerly precision that made him dangerous.

  Here is the breakdown of the Douglass you need for your scene, the tension he embodies, and the specific exchange that will stall your protagonist.

  ### 1. The Core Tension: Was the Constitutional Argument "Load-Bearing"?

  Your protagonist asks if his reading of the Constitution was a "rhetorical wrapper" around a moral conclusion.

  **The Answer:** It was a tactical necessity that became a theological conviction.

  Early Douglass (the Garrisonian phase) said the Constitution was pro-slavery. Later Douglass said it was anti-slavery. He didn't change his mind about slavery; he changed his mind about *power*. He realized that calling the Constitution a "covenant with death" was morally pure but politically useless. To end slavery, he needed the federal government to act. To get the federal government to act, the Constitution had to be the authority, not the obstacle.

  So, is it load-bearing? **Yes.** Because Douglass came to believe that the *text* contained a promise that the *framers* were too cowardly to fulfill. He argues that the words "We the People" and "Liberty" have a gravitational pull that overrides the specific intentions of the men who wrote them.

  **For your scene:** Douglass would not be insulted by the question. He would admit it. He would say: *"I did not seek to bind myself to the dead. I sought to bind the living to a promise they had written but refused to keep. If that is a wrapper, then truth is the candy inside, and I care only that the child eats it."*

  He is not an originalist in the sense of asking, "What did James Madison think about this specific clause in 1789?" He is a teleological originalist: "What is the *purpose* of this document, and does this practice serve that purpose?"

  ### 2. Douglass vs. The "History and Tradition" Test

  Your judge asks: "What was protected by history and tradition?"
  Douglass hears: "What sins have we normalized?"

  This is where Douglass tears the method apart. The "History and Tradition" test assumes that longevity confers legitimacy. Douglass's entire life is evidence that longevity confers nothing but habit. Slavery was the oldest tradition in the Americas. It was woven into the economy, the church, and the law. If "history and tradition" is the test, slavery is constitutional.

  **Could he endorse any version of it?**
  Only if the test is limited to *principles*, not *practices*.
  *   **Practice:** We have historically segregated schools.
  *   **Principle:** We have historically claimed all men are created equal.

  Douglass argues you must judge the nation by its creed, not its conduct. But modern originalism often looks at the conduct (what was allowed) rather than the creed (what was promised).

  **The Sting:** Douglass would argue that the "History and Tradition" test is a shield for the powerful. It freezes the status quo of the moment the tradition was set. If the tradition was set when black people were property, the test preserves property rights over human rights.

  ### 3. The Algorithm Case: Intent vs. Outcome

  This is your sharpest modern wedge. The state says: "No intent to discriminate."
  Douglass says: "The chain does not care about the blacksmith's heart."

  **The Nuance:** Douglass was a man of the 19th century. He spoke often of "manhood," "character," and "moral agency." He might initially struggle with the concept of a faceless algorithm. He prefers to look a villain in the eye.

  **However:** Douglass fought against the Black Codes after the Civil War. These were laws that didn't say "Black people can't work," but said "Vagrants will be imprisoned," which applied only to black people. He understood *facially neutral laws used for caste oppression*.

  **His Reasoning:** He would not care about the programmer's intent. He would care about the *condition* of the prisoner. If the result of the law (or the algorithm) is to recreate the conditions of servitude for a specific class of people, the law is suspect. He views the Constitution as a guarantee of *substance*, not just *process*.

  **Where he gets stuck:** He has to admit that without "intent," it is hard to assign *blame*. But he doesn't need blame to find a violation. He needs only to identify the *burden*. If the burden falls exclusively on the descendants of slaves, the presumption of guilt lies with the state, not the accused.

  ### 4. Your Theory: The Contractarian Objection

  Your theory is not 21st-century philosophy; it is exactly what Douglass argued in his speech "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"

  He rejects the idea that the Constitution is a contract *between* the states that binds the people. He argues it is a contract *of* the people. Since the enslaved were not consenting parties, the contract cannot bind them to servitude.

  **The Originalist Flaw:** You hit the nail on the head. Originalism grounds legitimacy in the consent of the ratifiers. Douglass grounds legitimacy in the consent of the governed (the living).
  *   **Judge:** "We are bound by the deal the founders made."
  *   **Douglass:** "The founders made a deal with thieves. You cannot inherit stolen goods and claim title by inheritance."

  He would argue that Originalism, when it relies on the "expected application" of the 1787 framers, is essentially ancestor worship. It treats the past as a master and the present as a servant. For Douglass, the present must master the past to correct its errors.

  ### 5. The Scene: The Strongest Versions

  Here is how the argument plays out in your protagonist's head (or in a dream sequence/imagined dialogue).

  **The Judge's Best Shot (The Sting):**
  The Judge shouldn't argue for slavery. He should argue for *stability*.
  *"Mr. Douglass, you say the text promises liberty. But 'liberty' is a vapor. If you let judges define liberty based on their own moral light, you give them a blank check. Who stops them from imposing their own tyranny? Only the dead hand of the past stops the living hand of the tyrant. If you unchain the text from its original meaning, you chain the minority to the whim of the majority. I am protecting you from the next judge who hates your people."*

  This is the genuine fear of the originalist. Without fixed meaning, rights are whatever the powerful say they are today.

  **Douglass's Best Shot (The Counter-Sting):**
  *"You speak of the dead hand as a shield. I have felt it as a whip. You say you bind the judge to the past to protect the minority. But the past was written by the majority of that time. You are not binding the judge to neutrality; you are binding the judge to the prejudices of 1787. You say I offer a vapor? I offer a measuring rod. Does this law make a man a thing? If yes, it is void. Your method asks: 'Did they allow this in 1787?' My method asks: 'Does this stand before God today?' You trust the dead because you fear the living. I trust the living because the dead cannot repent."*

  **Where the Protagonist Gets Stuck:**
  The protagonist realizes that Douglass is asking for something the legal system cannot give. He is asking for *moral truth* to be enforceable law.
  *   The Judge offers a machine: Input text + history, output decision. It's safe, but it can produce evil (like upholding segregation because it was "traditional").
  *   Douglass offers a compass: Input conscience + text, output decision. It points true north, but two people holding compasses might point in different directions.

  **The Resolution for the Novel:**
  Douglass wouldn't claim to have the *method*. He would claim to have the *direction*.
  He would tell your protagonist: *"Do not ask me if I am an originalist. Ask me if I am free. The law is not a puzzle to be solved, it is a yoke to be broken or a shield to be raised. If your Judge's method builds a wall around the past, it is a tomb. If it builds a floor under the future, it is a foundation. Test the method by the fruit, not the root."*

  ### Summary for Your Writing

  1.  **Douglass is not an Originalist:** He uses originalist *arguments* (textualism) when they help, but he rejects originalist *authority* (the supremacy of the framers' intent).
  2.  **The "Wrapper" Question:** He admits the moral conclusion comes first. The law is the weapon he picks up to fight for it. He is a pragmatist of liberty.
  3.  **The Algorithm:** He cares about the *effect* (caste), not the *intent*. A neutral law that produces slavery is a slave law.
  4.  **The Contract:** Your theory is solid. He rejects the legitimacy of a bargain made over the heads of the enslaved.
  5.  **The Judge's Counter:** The Judge's strongest point is that without fixed history, rights are unstable. Douglass's counter is that rights secured by injustice are not rights, they are privileges.

  **The Image to Keep in Mind:**
  The Judge sees the Constitution as an anchor. It holds the ship steady in the storm.
  Douglass sees the Constitution as a sail. It catches the wind of the present to move the ship forward.
  An anchor is useless if you are stuck on the rocks. A sail is dangerous if you have no rudder. Your protagonist is the one who has to learn how to steer.
