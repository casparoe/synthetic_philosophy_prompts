      *   *Phase 2 (Lysander Spooner/Gerrit Smith influence):* The text *itself* doesn't sanction slavery. "Slavery" isn't in it. "Persons held to service" can be read narrowly. The Preamble says "We the People," not "We the White People." This is the "Originalist" phase, but with a moral teleology.
      *   *Phase 3 (Reconstruction):* The 13th, 14th, 15th Amendments fundamentally remake the document. The "old ship" is patched so thoroughly it's a new vessel.
      *   *Key Insight:* Douglass wasn't an originalist in the *Scalia/Thomas* sense (freezing meaning at ratification). He was a *living constitutionalist* who used originalist *tactics* when they served liberty. He believed the Constitution had a *purpose* (justice/liberty) that transcended the specific expectations of the framers.

  3.  **Address Question 1 & 2: Originalism & Load-Bearing:**
      *   *Was it rhetorical?* No, it was strategic *and* sincere. He needed the law to be on his side to enforce abolition. But the "load-bearing" part was the *moral purpose*, not the specific 1787 expectations.
      *   *Modern Originalism:* He would hate the "History and Tradition" test if that history includes subordination. He would argue that the *principles* are fixed, but the *application* expands.
      *   *The Tension:* He doesn't see a tension between the 1787 text and the Reconstruction Amendments. He sees the Amendments as the *fulfillment* of the 1787 promises, finally made explicit because the 1787 generation lacked the moral courage to write them down.
      *   *Verdict:* He wouldn't be insulted by the "rhetorical wrapper" question. He'd admit he used every tool available. But he'd insist the text *could* bear the weight because liberty is the default state of natural law.

  4.  **Address Question 3: History and Tradition:**
      *   *The Trap:* If "History and Tradition" includes slavery/segregation, an Originalist who stops there validates oppression.
      *   *Douglass's Move:* He distinguishes between *practice* and *principle*. The tradition of *practice* was slavery. The tradition of *principle* (Declaration, Preamble) was liberty.
      *   *Endorsement:* He could endorse a history test *only if* it looks at the *aspirational* history, not the *operational* history of power. But modern originalism often looks at what was *permitted*, not what was *promised*.
      *   *Conflict:* He would argue that "Tradition" cannot legitimize caste. If the tradition is unjust, the higher law (natural rights) voids it.

  5.  **Address Question 4: The Algorithm/Intent Case:**
      *   *The Scenario:* Algorithmic bias, no specific intent, disparate impact.
      *   *Douglass's View:* This is tricky. 19th-century law was heavily intent/motive-focused (moral character of the actor). However, Douglass was a materialist about suffering. He cared about the *condition* of the enslaved.
      *   *Nuance:* He would likely focus on the *system* rather than the *heart*. If the machine produces caste, the machine is the slaveholder. He might not use the term "disparate impact," but he would argue that a law (or system) that *functions* to degrade a class is unconstitutional regardless of the designer's secret thoughts.
      *   *Honesty Check:* Would he be stuck? Yes. His rhetoric was often about "manhood" and "character." He might struggle with faceless bureaucracy. But his core demand was *results* (freedom, citizenship), not just good intentions.
