      *   *Refinement:* It's not just contractarian; it's about *consent*. The enslaved never consented. Therefore, a constitution interpreted to honor their enslavement lacks legitimacy.
      *   *Douglass's Counter:* The Constitution wasn't a contract *for* slavery; it was a contract *of* government that slavery hijacked. We aren't bound by the hijacking.

