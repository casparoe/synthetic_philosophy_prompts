answer: |-
  **Project Proposal: Structural Dissolution and the Boundaries of Genocide**

  **Precise Question**
  Does the "intent to destroy" element require a targeted biological or reproductive aim, or can it be satisfied by deliberate policies that foreseeably dissolve a group's material conditions of collective existence without killing its members?

  **Problem Statement**
  Existing legal and moral debates regarding genocide tend to treat "cultural genocide" and "physical genocide" as exhaustive alternatives. This dichotomy obscures an intermediate mode of destruction—call it *structural dissolution*—where groups are dismantled not through mass killing or mere cultural erasure, but through the systematic removal of the material conditions required for collective continuity. Raphael Lemkin's original framework implicitly recognized broad techniques of group destruction beyond immediate mortality, yet the 1948 UN Convention narrowed the definition to protect state sovereignty, excluding structural mechanisms. Consequently, slow-moving, structurally mediated group destruction—such as climate-induced displacement or systematic economic dispossession—falls into a conceptual void. It is too slow for conventional physical genocide classifications yet too materialist for cultural genocide labels. This project addresses this gap by interrogating whether Lemkin's architecture can accommodate structural dissolution without diluting the concept's moral specificity.

  **Methodology**
  The project employs analytic reconstruction rather than empirical case study. First, I will reconstruct the architecture of group destruction from Lemkin's standard definitions, isolating the necessary and sufficient conditions for "intent to destroy." Second, I will apply this reconstructed framework to two contemporary case-types: (1) environmental displacement where habitability is permanently revoked, and (2) forced economic assimilation where livelihood structures are dismantled to prevent group reproduction. The goal is not to prove these cases *are* genocide empirically, but to test whether the framework yields coherent classifications or generates internal contradictions when applied to non-lethal, material destruction.

  **Deliverable**
  The primary output is a conceptual taxonomy with decision criteria for naming authorities (e.g., international courts, truth commissions). This will not be a legal brief or an empirical study, but a philosophical tool designed to clarify when structural dissolution crosses the threshold into genocidal destruction. The taxonomy will distinguish between negligent structural violence and deliberate structural dissolution based on the orientation of policy intent toward group viability.

  **Success and Failure Conditions**
  Success is defined by a framework that distinguishes structural dissolution from general suffering without collapsing into legal positivism. Failure is defined strictly: if the framework collapses into pure intentionalism, it renders structural cases unnameable despite evident destruction; if it collapses into pure outcome-based classification, it strips genocide of its distinctive moral weight by equating it with any catastrophic policy failure. The project must navigate between these poles to maintain conceptual rigor.

  **Scope and Risk Assessment**
  A six-month timeline is sufficient for conceptual reconstruction and theoretical testing but insufficient for empirical validation. The specific risk is scope creep: the project may drift into a general theory of structural violence rather than remaining a focused intervention in genocide taxonomy. To mitigate this, every analytical step must be tethered to the specific criterion of "group destruction" rather than general harm. If the analysis begins to address individual suffering or general inequality without reference to collective dissolution, the focus has been lost. This proposal remains strictly bounded by the taxonomy of genocide, excluding broader theories of violence unless they directly inform the classification of group destruction.
