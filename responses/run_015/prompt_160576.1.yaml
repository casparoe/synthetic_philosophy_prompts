prompt: |-
  Hey — I need a philosopher's read on a very un-philosophical problem, and I'd rather you diagnosed what's actually going on than sent me a rubric template.

  I chair our teaching standards committee (we rotate: two of five of us are replaced every year). Last spring we passed a rule saying students may use AI tools for "brainstorming and copy-editing" but not for "substantial drafting." Now we're the people who have to apply it to real cases, and it's gone about as well as you'd expect. One student fed her own rough bullet points to a chatbot paragraph by paragraph, so maybe 40% of the final prose is generated but every idea is hers. One non-native speaker ran every sentence of his own draft through a tool that also rewrote his phrasing. One generated ten outlines, picked one, discarded the rest. One dictated a messy draft and had a tool "clean it up," which changed the argument in places. None of these is a clear violation and none is clearly fine, and they're not even ordered along a single scale.

  The problem isn't which way they should go. It's that every line I can write down feels arbitrary in exactly the same way: for any boundary I state, someone can produce a case that sits on the other side of it while differing from a case on this side by an amount too small to matter, and I have nothing to say about why the line is here rather than a hair to the left. And it compounds: whatever we decide gets cited to next year's committee, which is mostly new people who never saw this year's cases, so a slightly lenient call becomes the floor for a slightly more lenient one the year after.

  My colleagues have three attitudes. One says there's a real answer about where the line is and we're just not in a position to find it, so pick a number, publish it, and accept that we might be off. One says there's no answer at all, it's a judgement call, and we should say honestly that we're exercising discretion rather than pretending to discover something. One says the fuzziness is the point: it lets us handle cases we never anticipated and stops students optimizing right up to the edge, so we should keep it and stop trying to sharpen it.

  What I want, and what I'm definately not going to get, is all three of: a decision in every case; a written reason I can give the student that isn't just "because we said so" (our registrar insists on this); and no case coming out differently from one that differs from it imperceptibly. It feels like I can have any two and not all three, and I can't see which one to drop. Our economist suggests a fourth thing: define a band, and inside the band flip a weighted coin and tell the student honestly that's what we did. I can't tell if that's admirably honest or a collapse into laziness.

  I also keep suspecting the framing itself is the mistake — that "how much help" was never the right sort of quantity to be measuring, and any rule built on a graded notion like that was doomed before we passed it. If so, what shape should a rule have instead? I have a feeling this has a name in our discipline and it isn't "policy design," and I teach this stuff, which is the embarrassing part.

  I have to send the guidance document out Friday. So: what is the structure of the thing I'm stuck in, which colleague is nearest right and what exactly is wrong with the other two, and what should I actually write?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Chair of a teaching standards committee (philosophy background implied by "philosopher's read," "I teach this stuff," "I have a feeling this has a name in our discipline").
      *   **Problem:** Enforcing an AI policy ("brainstorming/copy-editing" OK, "substantial drafting" NOT OK) is proving impossible because the boundary is vague (Sorites Paradox territory). Cases are multidimensional (idea ownership vs. prose generation vs. argument shifting). Precedent drifts over time due to committee rotation.
      *   **Constraints:** Needs a decision in every case, a written reason (no "because we said so"), and consistency (no imperceptible differences leading to different outcomes). User suspects they can't have all three.
      *   **Colleagues' Views:**
          1.  Realism: There *is* a line, we just need to pick it (even if arbitrary).
          2.  Anti-Realism/Discretion: No line exists, admit it's judgment.
          3.  Functionalism/Strategic Ambiguity: Fuzziness is a feature, not a bug (prevents gaming).
          4.  Economist's Suggestion: Randomization within a "band" (weighted coin).
      *   **Goal:** Diagnose the philosophical structure, evaluate the colleagues, and provide actionable guidance for Friday's document.

  2.  **Philosophical Diagnosis (The "Structure of the Thing"):**
      *   *The Sorites Paradox:* This is the classic "heap" problem. If you remove one grain, is it still a heap? If you change one sentence via AI, is it still the student's work? The user explicitly describes this ("differing from a case on this side by an amount too small to matter").
      *   *Vagueness vs. Ambiguity:* The terms "substantial drafting" are vague (degree) not ambiguous (multiple meanings).
      *   *Incommensurability:* The cases aren't on a single scale (idea ownership vs. prose quality vs. argument integrity). You can't reduce them to "40% AI."
      *   *The Trilemma:* The user identifies a conflict between Decidability, Justifiability, and Consistency. This mirrors tensions in legal philosophy (Rule of Law vs. Equity).
      *   *The Real Issue:* The policy measures *process* (how much help) rather than *outcome* or *agency* (who is responsible for the claim).

  3.  **Evaluating the Colleagues:**
      *   *Colleague 1 (Realism/Arbitrary Line):* Wrong. It assumes a metaphysical fact exists where there is only a linguistic convention. It leads to the "hair to the left" problem the user identified. It creates false precision.
      *   *Colleague 2 (Anti-Realism/Discretion):* Closer, but dangerous. "It's a judgment call" fails the Registrar's requirement for a written reason. It also invites bias and inconsistency.
      *   *Colleague 3 (Strategic Ambiguity):* Insightful about human behavior (gaming), but unsustainable for *adjudication*. You can't punish someone based on a rule they couldn't know applied to them. It violates principles of fair notice.
      *   *Economist (Randomization):* Honest, but abdicates responsibility. It treats justice as a lottery. Philosophically defensible in resource allocation, not in academic integrity findings.

  4.  **Reframing the Rule (The "Name in Our Discipline"):**
      *   The user suspects "how much help" is the wrong quantity. They are right.
      *   *Concept:* **Agency and Authorship.**
      *   Instead of measuring *input* (AI usage), measure *output* (Intellectual Responsibility).
      *   *Philosophical Anchor:* Speech Act Theory or Epistemic Responsibility. When you submit a paper, you are asserting, "I stand behind these claims." If the AI generated the connection between A and B, *you* cannot stand behind it unless you understand and endorse it.
      *   *Shift:* From "How much did it write?" to "Can you defend the reasoning?"
      *   *Precedent Drift:* This is a *Institutional Memory* problem. Needs a case bank, not just a rule.

  5.  **Drafting the Guidance (Actionable Advice):**
      *   Acknowledge the Sorites problem openly (intellectual honesty).
      *   Shift the standard from *Provenance* (where did the words come from?) to *Endorsement* (do you own the logic?).
      *   Address the Trilemma: Drop the illusion of perfect consistency (Consistency) in favor of Justifiability and Decidability. Consistency comes from *reasoning*, not *outcomes*.
      *   Handle the Precedent Drift: Create a "Case Annex." The rule isn't the text; the rule is the text + the annotated cases.

  6.  **Refining the Tone:**
      *   Needs to be peer-to-peer (philosopher to philosopher).
      *   Avoid jargon overload but use precise terms (Sorites, incommensurability, epistemic agency).
      *   Be direct about the "embarrassing part" (teaching this stuff but missing it).
      *   Provide the Friday document structure.

  7.  **Self-Correction/Critique during thought process:**
      *   *Initial thought:* Suggest oral defenses for everything. *Correction:* Impossible at scale.
      *   *Initial thought:* Tell them to ban AI. *Correction:* Politically impossible, already passed.
      *   *Focus:* The user needs to save face on the existing policy while making it workable. The pivot must be interpretive, not legislative (since the rule is already passed).
      *   *Key Insight:* The "Written Reason" requirement is the trap. If the reason is "You used AI for 40%," it's arbitrary. If the reason is "You cannot explain the transition between paragraph 2 and 3 which was AI-generated," it's defensible.
      *   *The "Name":* It's the **Sorites Paradox** applied to **Normative Vagueness**. But the solution is **Pragmatism/Contextualism**.

  8.  **Finalizing the Advice:**
      *   **Diagnosis:** Sorites Paradox + Incommensurability.
      *   **Colleague Review:** #3 is right about strategy, wrong about justice. #2 is right about metaphysics, wrong about administration. #1 is wrong.
      *   **Solution:** Shift from *Quantitative Provenance* to *Qualitative Agency*.
      *   **Document:** Write the "Agency Standard" + "Case Annex."

  9.  (Drafting the response based on these points.)
answer: |-
  You are stuck in a **Sorites Paradox** (the paradox of the heap) compounded by **incommensurability**.

  You know the Sorites: If you remove one grain from a heap, it's still a heap. If you keep going, when does it stop? You have identified the normative version: If one sentence is AI-edited, it's student work. If two are, it's student work. At what integer *n* does it become "substantial drafting"? There is no metaphysical fact of the matter. The boundary is linguistic, not ontological.

  The incommensurability is the second blade. You are trying to measure "idea ownership," "prose generation," and "argument integrity" on a single scale of "AI usage." They are different dimensions. A student who generates 100% of the prose but 0% of the logic (your bullet-point student) is fundamentally different from one who generates 0% of the prose but 0% of the logic (the non-native speaker whose phrasing was rewritten). Collapsing these onto a single "violation scale" is a category error.

  Here is the diagnosis of your colleagues, the trap you are in, and the document you need to write by Friday.

  ### 1. The Colleagues
  *   **Colleague 1 (The Realist):** *Wrong.* They believe there is a "fact of the matter" about where the line is. There isn't. Picking a number (e.g., "30% is the limit") is not discovering a boundary; it is stipulating a fiction. This leads directly to your "hair to the left" anxiety. It creates false precision that will be exploited.
  *   **Colleague 2 (The Anti-Realist):** *Metaphysically right, administratively dangerous.* They are correct that there is no line, only judgment. But "we are exercising discretion" fails the Registrar's requirement for a written reason and invites charges of bias. It solves the philosophical problem by abdication.
  *   **Colleague 3 (The Pragmatist):** *Right about behavior, wrong about justice.* Strategic ambiguity *does* prevent gaming. But in adjudication, ambiguity violates the principle of **fair notice**. You cannot punish a student for violating a boundary they could not reasonably discern. This works for *policy deterrence*, but fails for *case adjudication*.
  *   **The Economist (The Randomizer):** *Honest but illegitimate.* Randomization within a band admits the indeterminacy but treats justice as a lottery. In academic integrity, we are not allocating scarce resources; we are making truth-claims about student agency. A coin flip cannot justify a finding of misconduct.

  ### 2. The Trap: The Trilemma
  You identified you can't have: (1) Decision in every case, (2) Justifiable reasons, and (3) Perfect consistency on marginal differences.

  You must drop **(3)**.

  You are chasing **consistency of outcome** (Case A and Case B get the same result) when you should be chasing **consistency of reasoning** (Case A and Case B are evaluated by the same *standard*). In vague normative contexts, two cases can differ imperceptibly in *facts* but require different *judgments* because the "heap" has shifted context. If you demand outcome consistency on a Sorites slope, you paralyze the committee.

  ### 3. The Reframe: From Provenance to Agency
  You suspected the framing was the mistake. You are right. "How much help" (provenance) is the wrong metric. It assumes the sin is in the *origin* of the text.

  The sin in academic integrity is not using tools; it is **misrepresenting agency**.

  When a student submits a paper, they perform a speech act: *"I assert these claims and I warrant the reasoning connecting them."* If an AI tool generates the connection between Premise A and Conclusion B, and the student cannot reconstruct that link without the tool, the student has misrepresented their agency.

  Shift the rule from **Quantitative Provenance** (how many words did the bot write?) to **Qualitative Endorsement** (can the student defend the logic?).

  This solves the incommensurability.
  *   **Bullet-point student:** If they can defend the logic the AI fleshed out, they own the argument. *Pass.*
  *   **Non-native speaker:** If the AI changed phrasing but the logic remains theirs and they understand the new phrasing, they own the argument. *Pass.*
  *   **Argument-shift student:** The AI changed the argument. The student likely cannot defend the shift because they didn't make it. *Fail.*

  ### 4. What to Write (The Friday Document)
  Do not try to sharpen the "substantial drafting" line. You will fail. Instead, write an **Interpretive Guidance** that reorients the standard toward *Epistemic Responsibility*.

  **Subject:** Guidance on Adjudicating AI "Substantial Drafting" Cases

  **1. Acknowledgment of Vagueness**
  Start by explicitly stating what you know: *"The distinction between 'copy-editing' and 'substantial drafting' is not a bright line. It is a gradient. We acknowledge that marginal cases will exist."* This disarms the "hair to the left" objection by admitting it upfront.

  **2. The Standard: Epistemic Agency**
  Replace the quantitative test with an agency test.
  *"The committee does not measure the percentage of AI-generated text. We assess whether the student retains **epistemic control** over the submission. A violation occurs not when AI is used, but when the student submits reasoning they cannot reconstruct, defend, or take responsibility for."*

  **3. The Test (The "Written Reason" Solution)**
  To satisfy the Registrar, the "written reason" should not be "You used AI for 40% of the text." It should be: *"In the hearing, the student was unable to explain the logical transition in Paragraph 3, which metadata shows was AI-generated. Therefore, the student cannot warrant the reasoning."*
  This gives you a concrete, defensible reason that isn't arbitrary.

  **4. Solving the Precedent Drift (The Case Annex)**
  You noted the committee rotates and precedent drifts. Rules cannot stop this; **cases** stop this.
  Attach an **Annex of Annotated Cases** to the guidance.
  *   *Case A (Bullet points):* Cleared. Reason: Student demonstrated full command of the expanded logic.
  *   *Case B (Argument Shift):* Violation. Reason: Student could not justify the shift in thesis introduced by the tool.
  *   *Case C (Non-native phrasing):* Cleared. Reason: Logical structure remained student-originated; phrasing changes did not alter epistemic content.

  Tell next year's committee: *"Do not look only at the text of the rule. Look at the Annex. If a new case is closer to Case A than Case B, it is cleared."* This creates **case-based consistency** rather than **rule-based consistency**, which is how legal systems actually handle vagueness.

  **5. Dropping the Consistency Illusion**
  Include a clause on "Marginal Differences."
  *"Two cases may differ by a negligible amount of AI usage yet receive different determinations based on the student's ability to demonstrate agency. Consistency is maintained in the *standard of proof*, not necessarily in the *percentage of tool usage*."*

  ### Summary
  You are teaching this stuff, so you know the embarrassment: we spent centuries trying to solve the Sorites Paradox and mostly concluded we just have to live with it.

  Your colleagues want to solve the paradox (1), deny it (2), or weaponize it (3). You need to **manage** it.

  1.  **Diagnosis:** Sorites Paradox + Category Error (measuring agency by word count).
  2.  **Colleague Verdict:** #3 is useful for policy, #2 is true but unusable. #1 is dangerous.
  3.  **Action:** Stop measuring *words*. Start measuring *warrant*.
  4.  **Document:** Admit the vagueness, define the "Agency Standard," and bind future committees to a **Case Annex** rather than a textual rule.

  This allows you to give a decision (Agency test), a written reason (Failure to defend logic), and acceptable consistency (Case-based precedent), without lying about the existence of a bright line.
