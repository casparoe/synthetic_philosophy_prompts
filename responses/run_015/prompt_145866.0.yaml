answer: |-
  Right, so your flatmate has properly landed you in a sticky wicket, hasn't he? This is the classic Surprise Examination Paradox, and you've spotted the exact hinge where the argument starts to wobble. You're quite right to feel that something slips between step (4) and step (5).

  To answer your question directly: I would reject step (5).

  Here is why that is the weakest link, and what you lose by cutting it.

  **The Slip Between (4) and (5)**
  The induction in steps (2) through (4) works only within a very specific, closed logical system. For that backward induction to hold, the students must treat the teacher's announcement as a known truth that is logically binding. They are operating under the assumption that the teacher *must* fulfil the announcement and that their own deductive abilities are perfect and common knowledge amongst the class. It is a self-contained puzzle where the rules are rigid.

  Step (5) attempts to export this rigid logical machinery into the messy real world of parties and inspections. The slip here is assuming that the epistemic conditions—the conditions regarding what people know and believe—are the same for a surprise party as they are for a logic puzzle exam.

  In the exam case, the announcement creates a logical constraint. In the party case, the announcement is merely a statement of intent. When you announce a surprise party, your guests do not typically engage in rigorous backward induction to rule out days. Even if they did, they lack the certainty that the hosts are bound by logical necessity rather than social whim. The hosts could change their minds, or the guests might simply distrust the logic. Therefore, the "surprise" remains psychologically intact even if the logical possibility of deduction exists.

  **What Rejecting (5) Costs You**
  By rejecting step (5), you save the coherence of ordinary language, but you pay a price.

  1.  **You lose the universal claim:** You can no longer say that "surprise" as a temporal property is inherently incoherent whenever announced. You have to accept that "surprise" means different things in different contexts. In the logic puzzle, it means "logically undeducible." In real life, it usually means "psychologically unexpected."
  2.  **You isolate the exam case:** You are forced to treat the examination paradox as a peculiar quirk of self-referential logic rather than a profound truth about time and knowledge. It becomes a special case involving specific constraints (authority, necessity, common knowledge of rationality) that don't apply to parties.
  3.  **You accept ambiguity:** You have to concede that our ordinary use of words like "know" and "surprise" is flexible. In the exam puzzle, "know" is used in a strict, philosophical sense. In the party scenario, it's used loosely. Rejecting (5) means admitting that language isn't a precise logical calculus.

  **Keeping the Exam Case Intact**
  Since you wish to keep steps (1) through (4) intact for the exam, you can maintain that *within the context of the puzzle*, the students' reasoning is valid. They successfully deduce that no exam is possible. The paradox arises only when the teacher actually gives the exam, proving the students' knowledge was flawed. But for the sake of your argument, you can hold that the logic holds *internally*.

  However, that internal logic relies on the students believing the announcement is a true premise they can build upon. In the party case, the guests don't build their expectations on the announcement being a logical axiom. They treat it as a hint. Because the premise changes, the induction collapses.

  **Conclusion**
  So, tell your flatmate that while the exam paradox is a fascinating logical knot, it doesn't ruin surprise parties. You reject step (5) because it ignores the difference between a logical necessity and a social promise. The cost is simply admitting that logic puzzles don't always map perfectly onto real life, which is a small price to pay for keeping the possibility of a birthday celebration alive.

  You've got a good eye for this; that shift from a closed system to an open one is exactly where the trick hides.
