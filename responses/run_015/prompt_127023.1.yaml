  ### Preliminary Notes & Brainstorming Angles

  Before settling on the final structure, I've jotted down a few ways this could go wrong or right. It's worth flagging these so the proposal feels grounded.

  *   **Angle 1: The Inconsistency Read.** Keynes was simply inconsistent. He wrote the *Treatise* when he was young and idealistic, and by the time he wrote *Economic Possibilities*, he'd slipped into dogmatism. This is the easiest path, but perhaps too dismissive. It shuts down the philosophical inquiry rather quickly.
  *   **Angle 2: The 'Weight' Defence.** Keynes distinguishes between the *probability* of an argument and the *weight* of evidence. Perhaps his normative claims aren't about high probability, but about high weight? He might be saying, "We don't know for sure, but we have enough evidence to act as if art is better than gold." This saves him from the charge of overreach.
  *   **Angle 3: The Moral Expectation Model.** This is the niche idea. If we treat 'the good life' not as a fixed destination but as an expected value function over uncertain future preferences, does that align with his probabilistic logic? This turns the proposal into a constructive reconstruction rather than just a critique.

  I think Angle 3 is the strongest for a third-year module. It shows technical engagement with the *Treatise* without getting bogged down in pure logicism. Below is the formal proposal drafted with that angle in mind.

  ***

  ### Research Proposal: Weighted Arguments for the Good Life?

  **Module:** Value Theory and Economic Thought
  **Student:** [Your Name]
  **Topic:** Keynesian Epistemology and Normative Ethics

  **1. The Research Question**
  The standard reading of John Maynard Keynes's ethical outlook—particularly in *Economic Possibilities for our Grandchildren*—focuses on his prediction of a post-scarcity utopia where humans work fifteen hours a week and devote themselves to art and virtue. It's a lovely picture, but it's usually treated as a standalone sociological prediction. My project wants to dig deeper into the philosophical foundations of that claim. Specifically, I want to ask:

  *Does Keynes's probabilistic epistemology undermine his normative confidence that post-scarcity humans should pursue aesthetic and moral goods rather than just accumulate wealth? Like, if we can't have certain knowledge of future preferences, is prescribing a specific good life just epistemic overreach dressed up as economics?*

  **2. Context and Literature Gap**
  There's no shortage of literature on Keynes's ethics. Scholars like O'Donnell and Carabelli have done brilliant work on his philosophy of science, and others have analysed his moral philosophy in *My Early Beliefs*. However, there's a persistent silo effect. The economists tend to treat the *Treatise on Probability* as a technical logico-mathematical work, whilst the ethicists treat his essays on the good life as humanistic musings. They rarely talk to one another.

  The standard literature doesn't settle my question because it assumes Keynes's shift from logic to ethics is seamless. Most commentators accept his normative prescriptions in *Grandchildren* at face value, or they critique them based on empirical feasibility (i.e., "we still work more than 15 hours"). Nobody really challenges them on *epistemic* grounds. If Keynes is right in the *Treatise* that rational belief is non-numerical and based on the 'weight' of argument rather than certainty, then making a strong claim about what humans *will* value in 100 years looks suspicious. It looks like he's violating his own rules about uncertainty. I want to see if the literature holds up when we press this specific tension.

  **3. Methodology**
  I plan to approach this through a close textual comparison, avoiding heavy econometrics in favour of conceptual analysis. The method involves three steps:

  First, I'll reconstruct the relevant epistemic framework from the *Treatise on Probability*. I'm particularly interested in his distinction between probability relations and the weight of evidence, and his idea that action is rational even when probability is low, provided the weight is sufficient.

  Second, I'll analyse his normative essays (primarily *Economic Possibilities for our Grandchildren* and selections from *Two Memoirs*) to isolate his claims about future human preferences. I'll be looking for modal language—does he say we *might* prefer art, or that we *will*?

  Third, and this is the constructive bit, I want to try constructing a 'moral expectation' model. Instead of treating the good life as a fixed endpoint (telos), I'll test whether Keynes's ethics make more sense if viewed as an expectation-value calculated across possible future preference-states. Essentially, is Keynes arguing that aesthetic goods have a higher expected value over the long run, even if we can't know the specific outcome? This allows me to see if his normative confidence is actually compatible with his epistemic humility.

  **4. Expected Outcomes and Success Criteria**
  It's important to be clear about what counts as a successful result here. I'm not trying to prove Keynes was 'right' about the future.

  *   **Success:** I successfully demonstrate that Keynes's probabilistic framework can accommodate his normative claims, perhaps by showing that 'weight of evidence' allows for strong ethical prescriptions even without numerical certainty. Or, conversely, I show a genuine tension that reveals a shift in his thinking from logicist to pragmatist. Either way, bridging the gap between the *Treatise* and the ethics essays counts as success.
  *   **Failure:** The project would fail if I simply conclude that Keynes was inconsistent without explaining *why* or how the inconsistency functions philosophically. Another failure state would be if I find that the probabilistic framework actually supports strong normative claims via long-run frequency arguments (which Keynes generally rejected in favour of logical relations), meaning I've misread his epistemology.
  *   **Null Result:** If it turns out the two bodies of work are simply unrelated—that Keynes kept his logic and his ethics in separate boxes with no intention of bridging them—that is still a valid finding, though I suspect there's enough cross-pollination in his Bloomsbury context to make that unlikely.

  **5. Scope and Feasibility**
  Let's be honest about the workload. A full exegesis of the *Treatise on Probability* is a lifetime's work, so I need to be disciplined. For one semester, I will restrict the epistemic analysis to Chapters 1, 2, and 10 of the *Treatise*, where he defines rational belief and the weight of argument. On the ethical side, I'll focus on *Economic Possibilities for our Grandchildren* and *My Early Beliefs*. I won't be touching the *General Theory* unless absolutely necessary, as that muddies the water with macroeconomic policy rather than value theory.

  This scope is tight but manageable. It allows for deep reading without getting lost in the technicalities of his logicism. The goal is to produce a crisp argument about the relationship between uncertainty and value, which fits comfortably within the word limit and the timeframe. I'm confident this angle offers enough novelty to stand out from the usual "Keynes predicted the future" essays, whilst remaining grounded in the text.
