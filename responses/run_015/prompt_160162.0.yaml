answer: |-
  The practice you describe commits itself to a specific, robust, and largely unspoken metaphysics of experience. It is not merely a methodological agnosticism; it is a substantive theory that treats the structure of discrimination and similarity as constitutive of the phenomenal character itself. Below is a reconstruction of that implicit theory, distinguishing between what the mathematics and engineering of the field *require*, what they *permit*, and where they are genuinely underdetermined.

  ### 1. The Core Commitment: Structuralism about Quality
  The practice presupposes a **relational or structuralist theory of qualia**. On this view, what an experience is like is exhausted by its location within a multi-dimensional quality space, defined entirely by its similarity and difference relations to other experiences and to physical stimuli.

  *   **Required:** The practice requires that experiences be *locatable*. To say "this is what red looks like" is scientifically cashed out as "this is the coordinate in the chromaticity diagram that corresponds to this discrimination profile." If a difference in experience does not correspond to a distance in the space (a change in discrimination threshold or matching behavior), the practice treats it as non-existent.
  *   **Compatible but Extra:** An intrinsic-qualia theorist can accept the space as a *map* of the causal correlates of experience. They can say, "The space tracks the stimuli that cause the private qualia." However, this is an extra philosophical step. The practice *itself* treats the map as the territory. When a colorimetric formula predicts a match, the practitioner does not say, "The stimuli are different but the private feelings are the same"; they say, "The colours are the same." The identity of the experience is identified with the identity of the position in the space.

  ### 2. The Logic of Indiscriminability
  You ask whether the practice requires indiscriminability to behave like a distance (symmetric, transitive, additive).

  *   **The Requirement:** The mathematical construction of a metric space *requires* transitivity and symmetry. If A matches B, and B matches C, the geometry demands A matches C (within a threshold).
  *   **The Empirical Reality:** Raw psychophysical data often violates this (non-transitive matching, sorites-like vagueness).
  *   **The Theoretical Move:** The practice resolves this by positing that the *underlying experience* is transitive, but the *measurement* is noisy. It smooths the data. It assumes a "true" threshold beneath the variability.
  *   **Implication:** This commits the practice to the view that vagueness is epistemic or performance-based, not ontological. It assumes there is a fact of the matter about whether two experiences are identical, even if the subject hovers on the boundary. If the intrinsic-qualia view were true and qualia were inherently vague or non-metric, the practice would have to abandon the construction of smooth manifolds. The fact that it forces the data into a metric space implies a commitment to the idea that experience has a precise, metric structure, even if our access to it is fuzzy.

  ### 3. Intersubjectivity and the Standard Observer
  The practice aggregates data to create a "Standard Observer." This is the strongest evidence against the intrinsic, private qualia view.

  *   **Required:** The practice requires that similarity relations be *comparable* across subjects. It assumes that when Subject A says "these are equally different" and Subject B says "these are equally different," they are traversing the same underlying manifold.
  *   **Underwriting the Comparability:** This is not underwritten by introspection (which is private) but by **shared physiology and shared behavior**. The practice assumes that because our retinas, optic nerves, and cortical processing are homologous, our quality spaces are isomorphic.
  *   **The Commitment:** This entails that "what it is like" is not essentially private. If it were essentially private, pooling data would be like averaging the taste of apples with the sound of trumpets. The success of pooling implies that the "what it is like" is public enough to be averaged. Individual variation is treated as noise or a parameter (e.g., "anomalous trichromat"), not as a fundamentally different ontological category of experience.
  *   **Optional:** One could claim the Standard Observer is merely a useful fiction for engineering. But for the science to claim it is modeling *experience* (as you noted, the dimensions are labelled with quality names), it must assume the fiction tracks a real, shared structure of consciousness.

  ### 4. Discrimination, Report, and Blindsight
  You noted the wrinkle: discrimination can occur without conscious experience (blindsight). Does the practice equate discrimination with experience?

  *   **The Nuance:** The practice distinguishes between *sensitivity* (d') and *criterion* (response bias), and increasingly between *forced-choice performance* and *visibility ratings*.
  *   **The Implicit Theory:** Experience is not mere discrimination; it is discrimination *plus* access to a specific reporting channel (often operationalized as confidence or visibility).
  *   **Required:** The practice requires that if a difference is discriminable *and* reportable with confidence, it is a difference in experience. Conversely, if a difference is reportable but not discriminable (hallucination/error), it is treated as noise.
  *   **The Blindsight Constraint:** The existence of blindsight forces the practice to acknowledge that the "quality space" is not just a map of motor outputs. It must be a map of *accessible* states. The implicit theory is that qualia are those states within the quality space that are available to the cognitive systems responsible for verbal report and voluntary matching. This is a functionalist definition of the phenomenal, not an intrinsic one.

  ### 5. The Inverted Spectrum and Mary
  Taking the practice at its word has radical consequences for the philosophical worries you raised.

  *   **Inverted Spectrum:** The practice entails this hypothesis is **empirically empty**. If two subjects match the same wavelengths to the same labels and discriminate differences identically, they occupy the same coordinates in the quality space. To say their "inner feelings" are swapped adds a variable that the science cannot measure, does not need to predict behavior, and cannot define. The practice rules out any difference in experience unaccompanied by a difference in discrimination, matching, or report.
  *   **The Mary Case:** The practice entails that the "residue" Mary learns upon leaving the room is **ability knowledge**, not propositional knowledge of a new fact. She learns how to navigate the quality space from the inside (how to match, how to discriminate under new conditions). Since the science already models the space she enters, no new *fact* about the world or the mind is added, only a new *mode of access* to the existing structural facts.

  ### 6. Underdetermination: The Case of Metamerism
  You asked who has the better reading of metamerism (different spectra, same match).

  *   **Intrinsic View:** "Different physical causes produce the same private sensation."
  *   **Relational View:** "The experience is defined by the equivalence class of stimuli that produce a match. The physical difference is irrelevant to the experience."
  *   **Verdict:** The **Relational View** has the better reading of what the practice actually *does*. The practice does not treat the match as a lucky coincidence of two separate realms (physics and qualia). It treats the match as the definition of the colour. When a colour-management system converts a spectrum to a CMYK profile, it is not preserving the "cause"; it is preserving the *position in the quality space*. The practice operates on the principle that the experience *is* the equivalence class. The intrinsic theorist must add a layer of interpretation ("this equivalence class *correlates* with a quale") that the practitioner never uses.

  ### 7. Counterfactuals: What Would Have to Change?
  This is the strongest test of the implicit theory.

  **If the Intrinsic-Qualia View were true and taken seriously:**
  1.  **Abandon Pooling:** If qualia are intrinsic and private, averaging Subject A's red with Subject B's red is category error. The "Standard Observer" would have to be abandoned in favor of individual calibration.
  2.  **Introspective Calibration:** The field would need a method to calibrate the *intrinsic quality* directly, independent of discrimination. Since discrimination can be blind, they would need a "phenomenal meter" that reads the quale itself. Since no such instrument exists, the science would stall.
  3.  **Dimensions as Labels:** They could no longer label dimensions "Red-Green" or "Loudness" as if these named public objects. They would have to label them "Reported Red-Green Discrimination," acknowledging the gap between the report and the quality.

  **If the Relational View is right (as the practice suggests):**
  1.  **Stop Reifying Dimensions:** The practice sometimes speaks as if "Hue" is a thing inside the head. It ought to strictly speak of "discrimination along the hue axis."
  2.  **Normative Standard Observer:** It should explicitly acknowledge the Standard Observer is a *normative* ideal (how a human *ought* to see to function in our shared environment) rather than a biological average.
  3.  **Accept Non-Transitivity:** Instead of smoothing data to force transitivity, it should model the non-transitivity of indiscriminability as a feature of the quality space itself (e.g., using semi-orders rather than metric spaces), acknowledging that "phenomenal identity" is not a strict logical identity.

  ### Summary of the Implicit Theory
  The practice of psychophysics presupposes that **conscious experience is a structural property of an organism's discriminative state space.**

  *   **Qualia are not atoms;** they are coordinates.
  *   **Privacy is not a barrier;** it is a variable to be normalized via the Standard Observer.
  *   **Ineffability is false;** if it cannot be reported or discriminated, it is not part of the scientific object.
  *   **The Inverted Spectrum is a null hypothesis;** it posits a difference without a structural distinction.

  The intrinsic-qualia theorist can *use* the practice, but only by treating it as a study of the *interface* between the world and the mind, not the mind itself. The psychophysicist, by labelling the axes of the space with names of experiences and using them to engineer human-centric technology, commits to the view that the space *is* the mind's visual or auditory reality. They are operationalists about qualia: the quality is what the quality space measures. To deny this is to render their own success inexplicable.
