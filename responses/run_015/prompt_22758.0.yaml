prompt: |-
  I'm a science journalist who also serves on the advisory board of a natural history museum's human-evolution gallery. The exhibition designer has proposed a panel on the ear: "The three bones of your middle ear evolved to let you hear," with a diagram highlighting the bones. A paleontologist on the board objects that this is exactly the kind of adaptationist story Gould and Lewontin criticized in their 1979 spandrels paper — that the middle-ear bones that were, in the ancestors of mammals, part of the jaw, were later co-opted for hearing, so the panel presents an exaptation as a purpose-built design. The committee meets on Friday, and the panel text needs to be finalized by the end of the month. Please draft the short written opinion I'll circulate before the meeting: it should recommend a concrete course of action with a time frame, and it should engage the paleontologist's position seriously while fairly representing the designer's concern that a panel about co-option will confuse general visitors.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist & Advisory Board Member of a Natural History Museum's Human-Evolution Gallery.
      *   **Task:** Draft a short written opinion (memo/email) to circulate before the Friday committee meeting.
      *   **Context:** Exhibition designer proposed a panel: "The three bones of your middle ear evolved to let you hear." Paleontologist objects, citing Gould & Lewontin's "Spandrels" paper (1979), arguing these bones are exaptations (formerly jaw bones), not purpose-built adaptations.
      *   **Constraints/Requirements:**
          *   Recommend a concrete course of action with a time frame.
          *   Engage the paleontologist's position seriously (acknowledge the science).
          *   Fairly represent the designer's concern (avoid confusing general visitors).
          *   Deadline for panel text: End of the month.
          *   Meeting: This Friday.
          *   Tone: Professional, diplomatic, scientifically accurate, actionable.

  2.  **Deconstruct the Scientific Conflict:**
      *   *Designer's View:* Functional explanation is clearer for the public. "Ear bones hear." Simple cause-and-effect.
      *   *Paleontologist's View:* Evolutionary history matters. These bones (malleus, incus, stapes) were once jaw bones (articular, quadrate). Calling them "evolved to let you hear" implies teleology (purpose-driven evolution) rather than exaptation (co-option).
      *   *Resolution:* Both are partially right. The bones *do* let you hear (function), but they weren't *originally designed* for that (history). The text needs to bridge function and history without overwhelming the visitor.

  3.  **Determine the Goal of the Memo:**
      *   To facilitate a compromise that satisfies scientific rigor without sacrificing educational clarity.
      *   To set a timeline for revision.
      *   To frame the discussion for the Friday meeting.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the specific issue (the ear panel) and the validity of both sides.
      *   **Engaging the Paleontologist:** Explicitly mention Gould & Lewontin and the concept of exaptation. Validate that the current text risks teleological error.
      *   **Engaging the Designer:** Acknowledge the need for clarity. "Exaptation" is jargon. Complex evolutionary stories can lose the average visitor.
      *   **Proposed Solution:** A textual tweak. Keep the function clear but add the evolutionary context. Instead of "evolved to let you hear," use "now function to let you hear" or "were repurposed."
      *   **Concrete Action & Timeline:** We need a revised draft before the end-of-month deadline. Suggest a collaborative edit between the designer and paleontologist by a specific date (e.g., next Wednesday) to allow time for final approval before the month ends.
      *   **Closing:** Reiterate the goal (accuracy + accessibility).

  5.  **Refining the Tone:**
      *   *Avoid:* Taking sides aggressively. Don't say "The designer is wrong." Don't say "The paleontologist is being too pedantic."
      *   *Adopt:* "Both perspectives are essential for a world-class exhibit."
      *   *Key Phrase:* "Scientific accuracy need not come at the cost of accessibility."

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hey team. Regarding the ear panel. Dr. X is right about the jaw bones. Gould and Lewontin said don't treat everything as adaptation. But the Designer is right that visitors need to know what the bones do. Let's change the text to say they were repurposed. We need this done by the 25th so we can print by month end. Let's discuss Friday.

  7.  **Drafting - Iteration 2 (Adding Polish and Specifics):**
