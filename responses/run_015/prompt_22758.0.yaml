  8.  **Drafting - Iteration 3 (Final Polish matching the prompt's requirements):**
      *   *Make it sound like a journalist/board member:* Professional, persuasive.
      *   *Ensure the Gould/Lewontin reference is respectful.*
      *   *Ensure the Designer's concern is validated.*
