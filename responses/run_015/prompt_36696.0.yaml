prompt: |-
  So heres my situation: I'm a retired physicist (condensed matter, mostly) and I've spent the last couple years actually reading metaphysics instead of dabbling. Somewhere along the way I committed hard to perdurantism -- persisting objects are four-dimensional worms stretched through spacetime, you and I are just short temporal parts of longer worms, persistence is literally just having parts located at different times, and change is different parts having different properties. My physics instincts pushed me there: relativity seems to kill any privileged global now, so treating the time dimension the way we treat space looked like the only scientifically respectable option, and endurantism started smelling like wanting a "flowing now" back. Tell me what would count against this. Not just the usual "it's counterintuitive, where's the change?" stuff, but which arguments, cases, or results perdurantism actually stands or falls with -- and I'd like the defeaters ranked from fatal to merely awkward. Two things I specifically want your honest take on: (1) someone in my reading group claimed the strongest argument for perdurantism has nothing to do with physics at all but comes out of vagueness about how many objects exist (something about arbitrary undetected parts), and I genuinely don't know what to make of that; (2) I'm starting to suspect my relativity argument doesn't actually buy me perdurantism -- that it only rules out presentism, and endurantism is perfectly comfortable with relativity if you give up the flowing now. Is that right? If so I've maybe talked myself into a view on bad grounds. And at the end, be honest about whether perdurantists have over the decades insulated the view so it can't lose -- whether anything a defender would concede really counts against it -- and whether that insulation matters for a metaphysical claim in a way it wouldn't for one of my old lab hypotheses.
