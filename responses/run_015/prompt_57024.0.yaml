  You press me hard, sir, and rightly so, for it is a point where many stumble. I hold that money is indeed a ticket or counter, but I never claimed it was a ticket for *nothing*. Must not the tickets be proportioned to the trade and produce of the kingdom? If I issue ten times the counters while the labour and commodities remain the same, do I not merely make the tickets contemptible? The virtue lies not in the multitude of counters, but in their due circulation among industrious hands. A ticket without credit is but painted paper, and credit arises from the security behind it and the purpose to which it is put. I maintain that the power of money is exhausted when it has set the people to work; to multiply it beyond the capacity of the people to employ it is to invite confusion, not plenty.

  As to those sad disasters in London and Paris, were they not born of avarice and the hope of getting wealth without labour? I hold that the ruin you speak of came because those schemes were built upon air and stock-jobbing, not upon the solid foundation of land and improvement. When men seek to grow rich by the rise of funds rather than the sweat of their brows, the nation suffers. My proposal is for a bank secured upon the lands of Ireland, to lend to men who will clear, build, and plant. Would you say that a ticket secured by an acre of improved land is the same as a promise backed by a bubble of shares? The one excites industry, the other excites gambling; and I argue for the former as the true source of a nation's wealth.
