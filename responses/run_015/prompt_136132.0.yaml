answer: |-
  Theo scribbles on a napkin, pen digging into the paper. Priya watches, arms crossed.

  THEO
  It's idle. Good's theorem is a constraint on the ideal agent. It tells you nothing about you.

  PRIYA
  It tells me where I'm wrong. That's the point. If looking looks bad to you, you don't stop looking. You fix the rule that makes looking look bad.

  THEO
  That's normative fantasy. I need a framework for the agent I am, not the one I wish I was. Look. Two states, safe act, risky act. You switch on a threshold posterior. Say you need sixty percent to take the risk.

  PRIYA
  And the break-even is fifty. You're too conservative.

  THEO
  Exactly. Now, coarse signal. It pools the cases, gives you a sixty-two percent posterior. You take the risk. You win. Fine signal splits that sixty-two into eighty and forty-four. At eighty you take it. At forty-four your broken threshold says stop. You miss the gain.

  PRIYA
  So your broken threshold—

  THEO
  The finer signal is strictly worse for her. And neutral for the well-calibrated agent. The part of the theorem that licenses buying the finer instrument is exactly the part that doesn't survive a nearly-right agent. Blackwell monotonicity collapses.

  PRIYA
  You're treating the response rule like it's carved in stone. Since when is the rule you'll actually follow independent of whether you look?

  THEO
  Because I know myself. I know I'll hesitate.

  PRIYA
  Sometimes looking is how you find out your threshold is off. If you refuse the signal because your current policy is bad, you lock in the bad policy.

  THEO
  I'm not refusing the signal. I'm valuing it correctly. Call it R-value. Expected utility of your actual post-signal policy minus expected utility of your actual no-signal act.

  PRIYA
  Which means if your default act is terrible, information looks incredibly valuable. You're saying a coin-flipper gains more from data than a maximizer does.

  THEO
  —okay, fine. Yes. An agent whose default act is bad can gain more from information than the optimal agent does. R-value isn't just Good's value with a penalty subtracted. It's sensitive to the baseline mess.

  PRIYA
  There it is. You just conceded the point. If the broken agent gains more, then information is doing work. It's correcting the mess.

  THEO
  It's correcting the mess relative to a terrible baseline.

  PRIYA
  But your framework slides into conservatism. The R-value for an agent who never looks at anything is always zero.

  THEO
  Because they don't look.

  PRIYA
  So if I'm anxious, if I'm biased, your math says I shouldn't inquire. Because for me, right now, looking hurts. You're building a rationality theory that tells the depressed person to stay in the dark because the light hurts their eyes.

  THEO
  I'm telling them the light hurts their eyes! Good says the light is free. I'm saying if you wear sunglasses made of lead, the light isn't free for you.

  PRIYA
  Then take off the glasses. Don't ban the sun. The theorem has teeth precisely because it can fail. It tells you where the break is. If the value of information goes negative, you aren't a counterexample to Good, you're a counterexample to rationality.

  THEO
  That's the food-isn't-bad-for-you-just-because-some-people-chew-wrong move.

  PRIYA
  And it's true. If chewing hurts, fix the jaw.

  THEO
  You can't fix the jaw mid-meal. I need to know whether to buy the ticket. If my R-value is negative, I don't buy. End of story. Whether I should be the kind of person who buys is a different question.

  PRIYA
  But decision theory is supposed to guide the choice. If your guide says "don't look" whenever you're slightly biased, you've built a theory that protects bias.

  THEO
  I've built a theory that doesn't lie to me. Good's theorem lies to the non-ideal agent. It says "look, it's free." But it's not free for me. It costs me utility because I'm broken.

  PRIYA
  It costs you utility because you're refusing to update the rule. You're treating the policy as exogenous. It's not.

  THEO
  It is exogenous to the decision of whether to look *now*.

  PRIYA
  Is it? If I know looking will trigger my bias, I can pre-commit to a different response rule.

  THEO
  Can you?

  PRIYA
  Yes.

  THEO
  Then calculate the R-value of the pre-commitment.

  PRIYA
  Which brings us back to Good. Because if you pre-commit to the optimal rule, the value is non-negative.

  THEO
  If.

  PRIYA
  You're hiding behind the "if."

  THEO
  I'm standing in the reality of the "if." Most people can't pre-commit. They look, they panic, they switch thresholds. The finer signal splits them apart and they freeze.

  PRIYA
  So teach them not to freeze.

  THEO
  Teach them to buy the coarse signal. It's cheaper and it keeps them from shooting themselves in the foot.

  PRIYA
  Until they need the fine signal to see the foot is already gone.

  THEO
  Then they should have fixed the threshold yesterday.

  PRIYA
  They're fixing it today. By looking.

  THEO
  And losing utility while they fix it.

  PRIYA
  Investment costs utility. That doesn't make it irrational.

  THEO
  It makes it costly. And my framework counts the cost. Good's doesn't.

  PRIYA
  Good's counts the cost of the information. It doesn't count the cost of your stubbornness.

  THEO
  Stubbornness is a parameter.

  PRIYA
  It's a bug.

  THEO
  It's the system.

  PRIYA
  Then the system is wrong.

  THEO
  The system is what we have.

  PRIYA
  We have the theorem.

  THEO
  We have the napkin.

  Theo taps the ink-stained paper. Priya leans in, doesn't look at the numbers.

  PRIYA
  Burn the napkin.

  THEO
  Calculate the R-value of burning it.

  PRIYA
  Zero. Because I already know what it says.

  THEO
  Then why are we arguing?

  PRIYA
  Because you think the zero means stop. I think it means start.

  THEO
  Start what?

  PRIYA
  Fixing the rule.

  THEO
  After I lose the utility?

  PRIYA
  If you don't look, you lose the chance.

  THEO
  If I do look, I lose the money.

  PRIYA
  You lose the money because you won't change your mind.

  THEO
  I won't change my mind because the signal is noisy.

  PRIYA
  The signal is fine. You're coarse.

  THEO
  Says the agent who thinks she's ideal.

  PRIYA
  Says the agent who thinks the theorem matters.

  THEO
  It matters for God.

  PRIYA
  It matters for us.

  THEO
  Then show me the utility.

  PRIYA
  Show me the jaw.

  They stare at the napkin. The ink is still wet.
