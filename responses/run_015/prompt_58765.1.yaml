  3.  **Identify the Core Tension:**
      *   This is a classic formulation of the *Spectrum Argument* or *Continuum Problem*.
      *   The tension is between *Lexicality* (some goods/bads are incomparable or strictly superior regardless of quantity) and *Aggregation* (small bads sum up to exceed large bads).
      *   The specific pivot point is Premise (3). This is the "Generalization of Priority." It claims that if Kind A > Kind B, then *any* amount of A > *any* amount of B.
