answer: |-
  Your hypothesis that the dispute is a "clash of questions" (normative advice vs. procedure specification) is the most diagnostic lever available, but it requires sharpening. It is not merely that the two sides are answering different questions; it is that they hold incompatible metaphysics of **agency**. The Two-Boxer treats the agent as a *token event* in a causal chain; the One-Boxer treats the agent as a *logical function* instantiated in the world.

  Here is the diagnosis of the disagreement, evaluated through your variants and hypotheses.

  ### 1. Diagnosis of the Variants

  **The Amnesiac Series**
  *   **Where it bites:** This variant successfully strips away the "disposition training" defense often used by pragmatic One-Boxers. It isolates the claim that one-boxing is rational *even when* it cannot causally influence future predictions or build a reputation. It forces the Two-Boxer to admit that they are recommending a *token act* that guarantees a worse outcome for the *type* of agent they are, without the excuse that the agent is "learning" or "signaling."
  *   **Where it fails to bite:** It does not dismantle the **Dominance Argument**. The Two-Boxer can reply: "In this specific token round, the million is either there or not. Your amnesia prevents you from knowing which, but it does not change the fact that your current physical movement cannot alter the box's content." The Amnesiac variant removes *inter-round* causation, but the Two-Boxer's core commitment is to *intra-round* causal efficacy. As long as the agent views themselves as a momentary causal lever, the dominance principle holds. The variant shows that Two-Boxing is a losing *strategy*, but the Two-Boxer replies that rationality is about making the right *move*, not picking the right strategy when the strategy cannot be causally enacted at the moment of choice.

  **The Sealed Simulation**
  *   **Where it bites:** This variant demolishes the "occult prediction" objection. It removes the intuition that One-Boxing requires backwards causation or magic. By making the predictor a simulation of the agent, it establishes that the correlation is due to **identity of process**. It forces the Two-Boxer to admit that the correlation is perfect and mechanistic.
  *   **Where it fails to bite:** It does not move the Causal Decision Theorist (CDT) because CDT is committed to ignoring **logical correlations** that lack **causal arrows**. Even if the simulation is "you," the CDTer argues that *this* physical instance's choice does not causally affect *that* past simulation's output. This variant reveals that the disagreement is not about the *physics* of the predictor, but about the **metaphysics of the self**. The One-Boxer (and Functional Decision Theorist) says, "I am the algorithm; my output determines the simulation's output." The Two-Boxer says, "I am this specific physical instantiation; my movement happens after the simulation has halted." The variant clarifies that CDT requires a token-physicalist view of agency, while One-Boxing requires a functionalist view.

  ### 2. The Core Disagreement: Locus of Agency

  Your hypothesis (d) is correct but needs to be framed as a conflict over **what constitutes the unit of agency**.

  *   **The Two-Boxer (Causal/Token View):** Agency is located in the **physical act**. Rationality is the virtue of exerting maximal causal control over the environment. If an act does not causally influence an outcome, counting that outcome in the decision calculation is "magical thinking." The question they answer is: *"Given the fixed state of the world, which physical movement yields the best result?"*
  *   **The One-Boxer (Functional/Type View):** Agency is located in the **decision procedure**. Rationality is the virtue of instantiating a function that yields high utility. If my decision procedure outputs "two-box," the predictor's procedure (which is identical or isomorphic) output "predict two-box." The question they answer is: *"Which output from my decision function results in the best world-state?"*

  This explains why the arguments talk past each other.
  *   When the Two-Boxer says, "You can't change the past," they mean: "The physical state of the box is causally sealed."
  *   When the One-Boxer says, "You determine the prediction," they mean: "Your algorithm determines the output of the predictor's algorithm."

  Both are true within their own ontologies. The stalemate exists because there is no neutral ground to adjudicate whether "you" refers to the *token physical event* or the *functional source code*.

  ### 3. Evaluating Your Hypotheses

  *   **(a) Semantics of Counterfactuals:** This is the **technical engine** of the dispute, not the root. CDT uses "causal counterfactuals" (hold fixed the past, vary the act). EDT/FDT uses "evidential/logical counterfactuals" (hold fixed the logical relations, vary the output). The disagreement over which counterfactuals are "well-defined" is a proxy for the disagreement over the locus of agency.
  *   **(b) Underdetermined Problem Description:** This is **substantively true**. The problem description does not specify whether the agent is a token or a type. However, calling it "underdetermined" suggests a solution exists if we just add more details. Your Sealed Simulation variant adds details, and the disagreement persists. This suggests the underdetermination is not in the *scenario*, but in the *concept of the agent*.
  *   **(c) Bedrock Intuition:** This is the **terminal state**. The intuition that "I can only affect the future" (Two-Box) vs. "I should be the kind of person who wins" (One-Box) rests on primitive, unrevisable commitments about control.
  *   **(Your Hypothesis) Clash of Questions:** This is the **best high-level diagnosis**. Specifically, it is a clash between **Rationality as Local Optimization** (Two-Box) vs. **Rationality as Global Success** (One-Box).

  ### 4. What Would Count as Progress?

  Given this diagnosis, here is the honest account of prospects for resolution:

  **1. Formal Results:**
  Formal progress has already happened (e.g., Functional Decision Theory). It formalizes the One-Boxer's intuition about logical correlations. However, this does not resolve the dispute because the Two-Boxer rejects the formalism's primitive axioms (specifically, that logical counterfactuals are decision-relevant). A formal result only convinces those who accept the underlying metaphysics.

  **2. Empirical Facts:**
  Empirical facts about simulability (your Sealed Simulation) will not resolve this. Even if we prove agents are perfectly simulable, the CDTer will maintain that *simulation* is not *causation*. The dispute is normative, not empirical.

  **3. Distinction/Reformulation:**
  The only viable path to progress is **conceptual separation**. We must stop asking "What is the rational thing to do?" and start asking "What concept of agency do we want to operationalize?"
  *   If we want an agent that never regrets its causal influence, we build a Two-Boxer.
  *   If we want an agent that never regrets its existence in a world with predictors, we build a One-Boxer.

  **4. Why We Should Expect No Resolution:**
  We should expect no resolution because the disagreement is **constitutive**. It is not a puzzle to be solved; it is a boundary dispute between two incompatible definitions of "rationality."
  *   To the Two-Boxer, One-Boxing looks like **superstition** (believing your choice affects the fixed past).
  *   To the One-Boxer, Two-Boxing looks like **spite** (choosing to lose because you refuse to acknowledge logical constraints).

  These are not arguments that can be won; they are aesthetic or moral commitments about what it means to be an agent. The Two-Boxer values **causal purity** (I only claim credit for what I cause). The One-Boxer values **outcome efficacy** (I claim credit for what happens because of my nature).

  ### Summary Diagnosis
  The fifty-year stalemate persists because Newcomb's Problem is not a decision problem; it is a **mirror**. It reflects two incompatible intuitions about the self.
  *   Your **Amnesiac Variant** proves that the One-Boxer does not need causal feedback to justify their position, isolating the dispute to the *token* choice.
  *   Your **Sealed Simulation** proves that the Two-Boxer does not doubt the *correlation*, but refuses to treat logical identity as causal leverage.

  The dispute is verbal only in the sense that "rationality" is the contested term. Substantively, it is a clash between a **physics-based ontology of action** (Two-Box) and a **computation-based ontology of action** (One-Box). Progress will not come from solving Newcomb's Problem, but from abandoning the hope that a single decision theory can satisfy both ontologies. The "correct" answer depends entirely on whether you believe you are your body or your code.
