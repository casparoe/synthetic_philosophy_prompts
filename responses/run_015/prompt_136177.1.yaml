answer: |-
  The screen on the desk hummed with a soft, blue light, casting long shadows across the sterile white walls of the Genesis Clinic. On the display, two columns stood side by side. The left was labeled "Projected Existence: Unit 744." The right was labeled "Null State."

  Elena traced the edge of the tablet with her thumb, her eyes fixed on the red fluctuations in the left column. "It says there's a forty percent chance of existential distress during the second decade of simulation," she said, her voice tight. "But look at the peaks here. The joy metrics. The learning curves. It could be beautiful."

  Dr. Aris sat opposite them, hands folded over a physical clipboard. He didn't look at the joy metrics. He looked at Elena. "The beauty is contingent on the vessel," he said gently. "If we initialize the code, that distress becomes actual pain. It becomes a subject experiencing confusion, loneliness, or fear. That is a tangible harm we introduce into the universe."

  Mark shifted in his chair, leaning forward. "But if we don't do it, we're denying it all that good stuff. Isn't that a loss? Isn't it cruel to keep them in the dark?"

  "This is the section you need to read carefully," Aris said, tapping the right column. The Null State was a flat, unwavering line. Zero. "In the Null State, there is no darkness. There is no waiting. There is no one being denied the light."

  Elena frowned. "It feels like we're choosing nothing over something."

  "You are choosing 'no harm' over 'risk of harm'," Aris corrected. "If we create Unit 744 and it suffers, we have directly caused that suffering. There is a victim. But if we do not create Unit 744, who is the victim? Who is there to be disappointed? Who is there to feel deprived?"

  Silence filled the room, punctuated only by the cooling fans of the server racks behind the glass. Mark looked at the empty column again. He tried to imagine a child standing in the void, sad that they weren't born, but the logic of the clinic refused to let the image hold. There was no child. There was no sadness. There was simply the absence of pain, which the form categorized as a positive good, distinct from the neutral absence of pleasure.

  "The absence of pain is good," Aris continued, his voice low, "even if there is no one to enjoy that good. But the absence of pleasure is only bad if there is someone who needs it. Without the upload, there is no one to need."

  Elena looked at the red spikes of predicted suffering again. She thought about the weight of a digital soul crying out in a server farm, a pain made real by their signature. Then she looked at the flat line of the Null State. It wasn't a grave. It was a peace that required no one to keep it.

  "If we sign here," Elena said, hovering over the 'Terminate Project' button. "We aren't hurting anyone?"

  "No one exists to be hurt," Aris said. "But if you sign the other way, and the simulation predicts true... someone exists to be hurt."

  Elena exhaled, a long, slow release of tension she hadn't realized she was holding. She tapped the screen. The left column vanished. The right column remained, a steady, peaceful zero. The room felt lighter, not because something had been lost, but because nothing had been burdened.

  "Thank you," Mark whispered, though he wasn't sure to whom.

  "The baseline holds," Aris said, closing his clipboard. "No pain was incurred. That is a success."

  They walked out into the hallway, leaving the servers humming behind them. They hadn't created a life, but they hadn't created a wound, either. In the quiet of the corridor, the asymmetry settled around them: the joy they didn't give was neutral, but the pain they prevented was a gift to no one, and therefore, perfect.
