          *   *Ecological/Enactive Direct Realism* might say yes. If the model is transparent and action-oriented, we perceive *through* it, not *it*.
          *   Analogy: Glasses. You see the world through glasses. You don't see the glasses (unless dirty). PP models are like clean glasses.
