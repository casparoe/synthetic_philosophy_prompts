      Also, mention Dennett's own view on this. Dennett acknowledges the stance works, but does he admit it *changes* the system? He mostly argues the stance reveals patterns that are already there (Real Patterns). The user's insight is that the pattern gets *stronger*. This pushes beyond standard Dennett into Hacking/MacKenzie territory.

      *Wait, one more concept:* **Goodhart's Law** is usually negative. Is there a positive version? **Campbell's Law**? No. **Lucas Critique**? That's about policy changing parameters. Close. Let's stick with Hacking and Performativity as the strongest matches.

      *Refining the "Slot Machine" distinction:* The slot machine *could* become performative if it had an algorithm that changed payout based on player belief (e.g., "lucky" players get more). But standard ones don't. The key is the *coupling*.

