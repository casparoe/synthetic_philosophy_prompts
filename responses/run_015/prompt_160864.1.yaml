      *   **Performativity:** (J.L. Austin / Judith Butler / Donald MacKenzie). "Speaking things into existence." MacKenzie's "An Engine, Not a Camera" (economic models make markets behave like the models). This fits the "prediction makes it true" aspect perfectly. *Verdict: Very strong candidate.*
      *   **The Intentional Stance (Dennett):** The user starts here. Dennett argues the stance is valid if it predicts. But does he account for the stance *improving* the prediction via adoption? Dennett talks about "Real Patterns." If the pattern gets stronger because we look for it, is it still a "Real Pattern"? Yes, but the *mechanism* is the key.
