prompt: |-
  I chair the evidence review panel for a public health risk report, and two panelists I consider epistemic peers keep giving different probabilities for the same hazard — 2% vs 8% — even after a full evidence exchange where everyone's seen each others data and reasoning. The report has to commit to a single number by the end of the week. Aumann's agreement theorem (if two people are rational, share a common prior, and their posteriors are common knowledge, they should have converged by now) makes the fact that they havent a little worrying. Can you draft the short memo I'll circulate before Thursday's vote? It should recommend a concrete procedure for what the panel does next, be honest about why the obvious options — averaging, or just taking the more cautious number — don't work, and say what the fact that they still disagree after the full exchange actually tells us about the two of them.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an evidence review panel for a public health risk report.
      *   **Problem:** Two epistemic peers (panelists) disagree on a probability estimate (2% vs. 8%) for a hazard, even after full evidence exchange and reasoning discussion.
      *   **Constraint:** The report must commit to a single number by the end of the week.
      *   **Theoretical Context:** Aumann's Agreement Theorem (rational agents with common priors and common knowledge of posteriors should agree). The fact that they *haven't* agreed is worrying.
      *   **Task:** Draft a short memo to circulate before Thursday's vote.
      *   **Key Requirements:**
          *   Recommend a concrete procedure for the next step.
          *   Explain why obvious options (averaging, taking the conservative number) are insufficient.
          *   Address what the persistent disagreement implies about the panelists (in the context of Aumann).
          *   Tone: Professional, authoritative, intellectually honest, actionable.

  2.  **Deconstruct the Theoretical Issue (Aumann's Agreement Theorem):**
      *   *Theorem:* If agents are Bayesian rational, share a common prior, and have common knowledge of each other's posteriors, they cannot agree to disagree.
      *   *Reality:* They *are* disagreeing.
      *   *Implication:* At least one assumption of the theorem is violated.
          *   Are they irrational? (Unlikely to accuse peers directly).
          *   Do they have different priors? (Very likely. Different background assumptions, weighting of evidence types, model structures).
          *   Is it *really* common knowledge? (They've exchanged data, but maybe they interpret the *weight* of that data differently based on hidden priors).
      *   *Memo Angle:* Don't accuse them of irrationality. Frame it as "divergent priors" or "structural model uncertainty" that the evidence exchange couldn't resolve. This validates their expertise while acknowledging the impasse.

  3.  **Evaluate "Obvious Options":**
      *   *Averaging (5%):* Why is this bad? It implies the truth is likely in the middle. But if one model is right and the other is wrong, the average might be meaningless. It also discourages deep justification (why bother arguing if we just average?). It masks the uncertainty range.
      *   *Conservative (8%):* Why is this bad? It introduces policy bias into scientific estimation. It inflates risk potentially unnecessarily, leading to resource misallocation or alarmism. It rewards the more pessimistic prior without evidentiary justification.

  4.  **Develop a Concrete Procedure:**
      *   We need a single number, but we need to capture the *reason* for the disagreement.
      *   *Option A: Vote.* (Too simplistic, ignores the nuance).
      *   *Option B: Delphi Method.* (Too slow, they've already exchanged views).
      *   *Option C: Weighted Average based on Performance.* (Hard to quantify past performance quickly).
      *   *Option D: Report the Range + Central Estimate with Caveats.* (The prompt says "commit to a single number," but usually reports can have a primary estimate with uncertainty bounds).
      *   *Option E: The "Chair's Decision" based on a specific criterion.* (Too authoritarian).
      *   *Option F: A Structured Reconciliation Vote.* Ask them to estimate the *probability that the other person is right*. Or, use a "Prediction Market" style approach internally.
      *   *Selected Approach:* Since a single number is mandated, I need a method to derive it that acknowledges the disagreement. A **weighted average based on self-assessed confidence in the *model structure* (not just the number)** or a **formal elicitation of the uncertainty distribution** is best. However, the prompt asks for a procedure for *what the panel does next* to get that number.
      *   *Refined Procedure:* "Structured Expert Judgment (SEJ) / Cooke's Method" lite. Or simply, a final round where they assign weights to each other's estimates based on track record/reliability *before* averaging.
      *   *Actually, a better philosophical fit:* If Aumann fails, it's because priors differ. The procedure should be to **explicitly document the divergent priors** and then select the number that represents the *consensus of the evidence* distinct from the priors, or use a **median of the group** (if there are more panelists) or a **weighted average where weights are derived from calibration questions**.
      *   *Simpler for a Memo:* Let's propose a **"Reasoned Weighting"** step. Before voting on the number, each panelist assigns a weight to the two estimates based on methodological robustness, not outcome preference. Then we calculate.
      *   *Wait, the prompt says "commit to a single number".* I need to tell them how we get there.
      *   *Best Practical Solution:* Acknowledge the Aumann violation means we have **Model Uncertainty**, not just Parameter Uncertainty. The procedure: We will not average. We will not default to conservative. We will select the estimate associated with the **most robustly validated model structure**, as determined by a blind scoring of the *methodologies* (not the numbers). If that fails, we use the median of the full panel (assuming more than 2 people, but the prompt implies the whole panel is stuck on these two).
      *   *Let's assume the Panel is larger than just the two, but these two are the key voices.*
      *   *Actually, let's look at the constraint:* "The report has to commit to a single number."
      *   *Procedure:* **Structured Reconciliation.** Step 1: Isolate the specific prior assumption driving the gap. Step 2: Vote on the *assumption*, not the *risk*. Step 3: Calculate risk based on the winning assumption.
      *   *Why this works:* It respects Aumann. If they agree on the prior/assumption, they should agree on the posterior. The disagreement is actually about the input, not the math.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the deadline and the specific impasse (2% vs 8%).
      *   **The Aumann Point:** Address the theoretical elephant in the room. If rational peers disagree after full exchange, it's not about the data anymore; it's about the *priors* (underlying assumptions/models). This isn't a failure of rationality, but a signal of structural uncertainty.
      *   **Why Not Average/Conservative:**
          *   Average: Implies truth is linear between them. Masks the binary nature of the model disagreement.
          *   Conservative: Conflates risk assessment with risk management (policy). Scientific integrity issue.
      *   **The Procedure:**
          *   Shift the vote from "What is the probability?" to "Which model assumption is better supported?"
          *   Once the assumption is chosen, the number follows mathematically.
          *   If the panel cannot agree on the assumption, we use a weighted average where weights are based on *calibration* (past accuracy), not opinion.
      *   **Closing:** Call to action for Thursday.

  6.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid accusing them of being irrational.
      *   Use the Aumann theorem as a diagnostic tool, not a weapon.
      *   Ensure the distinction between *risk assessment* (science) and *risk management* (policy) is clear regarding the "conservative" option.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking them to vote on assumptions too abstract?
      *   *Fix:* Make it concrete. "Identify the specific variable or prior driving the divergence."
      *   *Critique:* Does this guarantee a single number?
      *   *Fix:* Yes, because once the assumption is picked, the 2% or 8% (or a recalculated number) becomes the output. If they still can't pick, the Chair (me) will arbitrate based on methodological rigor.
      *   *Critique:* The prompt asks what the disagreement tells us about *them*.
      *   *Fix:* Explicitly state: It tells us they are operating from different, equally rational structural models, not that one is ignoring data.

  8.  **Final Polish:** Check word count (keep it short/memo style). Ensure the "Thursday's vote" deadline is clear. (Proceed to generate output).

  *(Self-Correction on Aumann Interpretation)*: I need to be careful not to misapply Aumann. Aumann assumes *common priors*. If they disagree, they likely have *different priors*. The memo should clarify that this is the diagnosis. It's not that they are irrational; it's that the "common prior" condition isn't met. This is a crucial distinction for epistemic peers.

  *(Final Plan)*:
  1. Header.
  2. Context: The 2% vs 8% stalemate.
  3. Diagnostic: Aumann implies divergent priors/models, not irrationality.
  4. Rejection of shortcuts (Average/Conservative).
  5. Procedure: Vote on the *driver* of the divergence, not the number.
  6. Deadline reminder.cw
answer: |-
  **MEMORANDUM**

  **TO:** Evidence Review Panel
  **FROM:** Chair, Evidence Review Panel
  **DATE:** Monday, [Date]
  **SUBJECT:** Procedure for Resolving Probability Estimate Discrepancy (Hazard X)

  **Context**
  By Thursday's deadline, we must commit to a single probability estimate for Hazard X. Currently, we face a persistent divergence between two well-supported estimates: 2% and 8%. Despite full evidence exchange and reasoning transparency, these positions have not converged.

  **Diagnostic: What the Disagreement Tells Us**
  In light of Aumann's Agreement Theorem, persistent disagreement between rational peers with common knowledge of evidence suggests we are not dealing with a calculation error or data gap. Instead, it indicates **divergent priors** or **structural model uncertainty**. 

  Essentially, both estimates are rational, but they are conditioned on different underlying assumptions about how the system works. The data alone cannot resolve this because the disagreement is not about the *likelihood* of the evidence, but the *weight* assigned to different causal pathways. Acknowledging this protects the integrity of both panelists: neither is ignoring the data; they are prioritizing different valid models.

  **Why Standard Shortcuts Are Insufficient**
  1.  **Simple Averaging (5%):** This is methodologically unsound. It implies the truth is linearly distributed between the two models. If one model structure is correct and the other is flawed, the average is not a "compromise," it is simply wrong. It also masks the magnitude of our structural uncertainty.
  2.  **Defaulting to the Conservative Estimate (8%):** This conflates *risk assessment* (science) with *risk management* (policy). Selecting a higher probability solely for caution introduces a policy bias into our scientific findings, potentially misallocating public health resources based on precaution rather than evidence.

  **Procedure for Thursday's Vote**
  To resolve this while maintaining scientific rigor, we will shift the vote from the *outcome* to the *driver*.

  1.  **Isolation of Divergence (30 mins):** The two primary panelists will explicitly state the single specific prior or model assumption that accounts for the majority of the gap (e.g., "transmissibility rate in asymptomatic carriers" or "decay rate of immunity").
  2.  **Assessment Vote (1 hour):** The full panel will vote on which of the two *assumptions* is better supported by the broader literature, independent of the resulting probability number.
  3.  **Final Calculation:** The single probability estimate will be derived from the winning assumption. 

  If the panel cannot reach a majority on the assumption itself, we will proceed with a weighted average, where weights are assigned based on each panelist's calibration score from our pre-panel accuracy testing, rather than the persuasiveness of their current argument.

  Please come prepared to evaluate the *models*, not just the *numbers*.

  Regards,

  [Your Name]
  Chair, Evidence Review Panel
