answer: |-
  Good morning, everyone. Welcome.

  Before I say anything substantive, I need to address the elephant in the room—or rather, the missing 'i' on the banner. Yes, the workshop title is "Premature Falsificaton." That is not a typo on the printer's part. It's on purpose. If we can't laugh at a misspelling in a room full of people obsessed with error correction, we're in the wrong line of work.

  But it also sets the tone for what we're doing this weekend.

  Looking around this room, I see a specific tension. On one side, I have historians of science and demographers. You know the Malthus literature inside out. You know the 1798 *Essay*, the subsequent editions, and exactly where the arithmetic breaks down against the historical record. You know that when Malthus said population grows geometrically while food production grows arithmetically, history eventually shouted him down. The Green Revolution, the demographic transition, the massive decoupling of income growth from birth rates—you have the data that says he was wrong.

  On the other side, I have philosophers of science and climate researchers. To many of you, Malthus is less a historical figure and more a case study. He's the guy in the textbook who illustrates the principle of falsification. Popper says if a prediction fails, the theory is falsified. You move on. But you're also looking at soil degradation, climate stress, and resource limits, and you're asking a uncomfortable question: *What if the theory wasn't false, just early?*

  That is the friction I want us to sit with for the next two days.

  I am not asking us to rehabilitate Malthus as a secret prophet. If anyone spends this weekend arguing that the Green Revolution was just a temporary blip and Malthus is actually winning right now, the historians in this room have permission to throw the data at you. We cannot ignore the fact that human ingenuity and technological shifts changed the variables he thought were constants. To pretend otherwise is bad history.

  But I also don't want us to simply bury him and move on. Because if we do that, we miss the philosophical point.

  In physics, if an experiment contradicts a hypothesis, the hypothesis is usually dead. But in long-term social and ecological prediction, the timeline is murky. If I predict a bridge will collapse in 100 years, and it's still standing at year 50, have I been falsified? Or have I just been premature?

  This is where the title comes in. Is "Premature Falsification" a real logical category? Or is it just a face-saving story we tell when we want to resurrect a "zombie theory" because it suddenly becomes useful for a new crisis?

  When climate scientists talk about carrying capacity today, they aren't making the exact same claim Malthus made. But the shadow is there. And when we look at the data now, the mechanism isn't just "people breeding too fast." It's "systems degrading under stress." That's a different model. But it feels familiar.

  So, here is my request for the weekend.

  To the historians: Don't let the philosophers turn Malthus into a pure abstraction. Keep us grounded in what he actually wrote and what actually happened. Remind us when we're engaging in presentism.

  To the philosophers and climate folks: Don't let the historians shut down the theoretical questions just because the historical data is messy. Push us on whether our standards for falsification change when the time horizon stretches beyond a human lifespan.

  We are not here to decide if Malthus was "right." We are here to decide if a theory can be wrong for a century, and then become useful in the next, without anyone in the room being irrational. Does falsification have an expiration date? Or do some ideas just wait for the world to catch up to them?

  There's a lot of coffee outside, and I suspect there's going to be a lot of disagreement in there. Let's get to work.
