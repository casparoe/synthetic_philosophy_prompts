prompt: |-
  After a long and ultimately unresolved argument with a close friend about whether Garrett Hardin's lifeboat analogy genuinely establishes that selective exclusion is the rational response to scarcity, or whether it merely converts a refusal to share into an apparently neutral administrative principle, I want you to write a sustained piece of deadpan satire. The form should be an in-universe passenger-safety brochure issued by the fictional luxury cruise line Aqua Mundi, which operates under an explicit Lifeboat-First Governance Charter. The brochure should present emergency-evacuation protocols with cheerful corporate professionalism, while quietly embedding the core logical moves of Hardin's reasoning: the denial of any shared commons analogous to spaceship earth, the insistence that each vessel has a fixed carrying capacity, the warning that distributing resources to all produces total ruin rather than justice, and the dismissal of universal solidarity as a dangerous fiction. To keep the satire precise rather than cartoonish, inject two invented bureaucratic instruments that extend this logic but do not appear in Hardin's original text: a Dynamic Capacity Index that recalculates remaining lifeboat seats in real time based on passengers' projected resource consumption, and a Pre-Boarding Contribution Assessment that assigns boarding priority according to prior tax contributions rather than need. The target is not any individual but the style of reasoning that transforms moral scarcity into a seemingly objective procedural rule. The tone must remain legible irony: a specialist should recognize that the exaggeration is fair to the underlying argument, while a general reader should understand that the brochure's logic is being presented for critical inspection rather than endorsement. Aim for roughly 650 words, using standard brochure headings such as Welcome Aboard, Our Philosophy, Emergency Protocols, and Frequently Asked Questions. Do not include citations, footnotes, bibliographies, or references to external scholarship; the piece should stand entirely on its own.
