      *   **Our Philosophy:** Address the "Spaceship Earth" denial. We are not one ship; we are many boats. Capacity is fixed.
      *   **Emergency Protocols:** This is where the exclusion happens. Who gets saved? Introduce the bureaucratic instruments here.
