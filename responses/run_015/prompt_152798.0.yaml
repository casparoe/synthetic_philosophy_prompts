      *   **Specific Inclusions:**
          *   Dynamic Capacity Index (real-time seat recalculation based on projected consumption).
          *   Pre-Boarding Contribution Assessment (boarding priority based on tax contributions, not need).
          *   Standard brochure headings (Welcome Aboard, Our Philosophy, Emergency Protocols, FAQ).
      *   **Constraints:** ~650 words, no citations/footnotes/external references.

  2.  **Deconstruct Hardin's Argument (for satire):**
      *   *Spaceship Earth is a bad metaphor:* We are in separate lifeboats.
      *   *Carrying Capacity:* Boats have limits. Exceeding them sinks everyone.
      *   *Sharing is Ruin:* Helping those outside the boat swamps the boat.
      *   *Justice vs. Survival:* Universal justice leads to universal ruin. Survival requires exclusion.
      *   *Satirical Twist:* Corporate bureaucracy codifying this exclusion as "safety" and "efficiency."

  3.  **Drafting - Section by Section:**

