          *   *Pre-Boarding Contribution Assessment (PCA):* Who paid enough to deserve survival?
      *   **Frequently Asked Questions:** Address the moral objections (Why not share? Why not let them in?) with corporate speak masking the harsh logic.
      *   **Closing:** Reiterate safety through exclusion.

  4.  **Drafting - Tone Check:**
      *   Needs to sound like a Hilton or Royal Caribbean brochure, but darker.
      *   Words like "optimization," "sustainability," "guest experience," "integrity of the vessel."
