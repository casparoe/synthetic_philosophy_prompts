          *   Identify the load-bearing argument (suspects (a) is Newcomb-like).
          *   Address the "War/Concorde" objection (distinguishing rational persistence from irrational escalation).
          *   Address empirical evidence (does debiasing work?).
          *   Address the "Reflective Person" problem (can you use a commitment device if you know it's a device?).
