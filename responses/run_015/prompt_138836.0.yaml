answer: |-
  **Project Title:** Revealed Lock-in: Reframing the Path Dependence Debate

  **Summary**
  This project proposes a conceptual overhaul of how we argue about path dependence and technological lock-in. The current literature is stalled between 'contingency' camp (history matters, outcomes are fragile) and 'inevitability' camp (functional pressures dominate, outcomes are robust). I argue this stalemate persists because both sides answer different questions without noticing. I propose three clarifications: fixing the grain of description, distinguishing types of counterfactuals, and shifting focus to 'revealed lock-in'—inferring lock-in strength from actual displacement costs rather than hypothetical reruns. Additionally, I will explore a reflexive hypothesis: that narratives of lock-in are endogenous to the phenomenon itself. The output is a framework paper that allows empirical researchers to stop talking past one another.

  **The Problem: A Stalemate of Definitions**
  It is basically settled among people who work on this that history sometimes matters. The live controversy is about *how much* and *when*. Currently, debates over whether a standard (like QWERTY) is 'locked in' produce heat but no light. 

  The proposal argues this is because existing approaches fail on three counts:
  1.  **Grain of Description:** Outcomes look contingent at a fine grain (this specific keyboard layout) but inevitable at a coarse grain (some qwerty-like arrangement). Neither side fixes the grain before arguing.
  2.  **Counterfactual Ambiguity:** "Would the same thing have happened?" is ambiguous between nudging initial conditions slightly (testing stability) versus redrawing the whole sequence of shocks (testing robustness). These test different claims.
  3.  **Hypothetical vs. Revealed:** Both sides argue from hypothetical reruns of history. There is a class of actual evidence rarely used systematically: episodes where an established arrangement was in fact displaced, or very nearly was.

  **The Intervention: Revealed Lock-in**
  The core conceptual innovation is to treat lock-in analogously to revealed preference. Instead of asking "could it have been different?", we ask: "what price did agents actually pay to switch?" 

  If a population switches despite high transition costs, lock-in was weaker than assumed. If they endure massive inefficiencies rather than switch, lock-in is strong. This moves the debate from metaphysical history to observable transition costs. 

  *The Reflexive Twist (High Risk/High Reward)*
  I also intend to test the claim that belief in lock-in is partly constitutive of lock-in. If agents believe a standard is locked in, they coordinate on it, making it so. Conversely, a narrative of 'contingency' might help challengers coordinate defection. This makes the answer to "was it locked in?" endogenous to the story told about it. I flag this as speculative; if it doesn't hold, the core framework on revealed lock-in still stands.

  **Methodology: Conceptual Analysis + Case Re-interrogation**
  This is a conceptual project that makes progress without new data collection. The justification for funding this over a dataset is that current empirical work is often wasted because the concepts are muddy. Collecting more data on QWERTY won't help if we haven't agreed on what counts as 'the outcome'. This project clears the ground so future data collection isn't talking past itself. It is a force multiplier for empirical work.

  I will not collect new archival data. Instead, I will re-interrogate well-known cases using the new framework to demonstrate its utility. 
  *   **Case 1: QWERTY.** (Note: I am aware the historical details are contested/mythic, but it is the canonical example everyone knows. I will use it strictly as a foil for the argument structure, not to settle the historical record.)
  *   **Case 2: Metric vs. Imperial Systems.** (A clearer case of partial lock-in and costly switching attempts.)
  *   **Case 3: Institutional Standards.** (e.g., Rail gauge or legal systems—pending final selection based on literature I already know).

  **Work Plan (6 Months, Part-Time)**
  *   **Month 1: Conceptual Mapping.** Formalise the distinctions (grain, counterfactual types). Draft the definition of 'revealed lock-in'.
  *   **Month 2: The Reflexivity Hypothesis.** Stress-test the endogeneity claim. If it looks too speculative, scale it back to a discussion point rather than a core theorem.
  *   **Month 3: Case Re-analysis.** Apply the framework to the selected cases. Focus on identifying where previous arguments slipped between grains of description.
  *   **Month 4: Drafting the Paper.** Write the working paper. Target is a conceptual journal (e.g., *Philosophy of Science* or interdisciplinary equivalents) or a high-level social science venue.
  *   **Month 5: Revision.** Internal review and refinement. Prepare the talk.
  *   **Month 6: Final Polish & Workshop.** Submit paper to pre-print server/repository. Deliver talk at funders' workshop.

  **Deliverables**
  1.  **One Working Paper:** (~8,000 words). Needs to be readable by non-philosophers. A 'decent' deliverable here isn't just a taxonomy; it's a set of operational criteria researchers can use to classify their own cases. If a sociologist reads this, they should know what data they need to collect to prove lock-in exists in their field.
  2.  **One Talk:** 20 minutes + Q&A. Focused on the 'revealed lock-in' metric.

  **Scope Note**
  I worry this is really three papers (one on grain, one on counterfactuals, one on reflexivity). For the purposes of this grant, I am treating the first two as the core foundation and the third as the speculative edge. If the reflexivity argument proves too heavy, it will be spun out for later work. The goal here is the framework, not a comprehensive history of technology.

  **Failure Conditions**
  What counts as this project failing?
  1.  **Triviality:** If 'revealed lock-in' turns out to be just a restatement of "switching costs matter," without adding analytical leverage.
  2.  **Incoherence:** If the reflexive claim collapses under scrutiny (i.e., if beliefs about lock-in don't actually correlate with coordination outcomes).
  3.  **Non-adoptability:** If the framework is too abstract for empirical researchers to use. (I will mitigate this by testing the definitions on the cases in Month 3).

  **Why Fund This?**
  The panel may prefer a dataset. However, bad concepts lead to wasted data. There is no point in collecting more data on path dependence if we cannot agree on what counts as evidence for it. This project reduces uncertainty for future empirical grants. It is low-cost conceptual infrastructure.

  **Tone and Consensus Check**
  *   **Consensus:** History matters; increasing returns exist; switching costs are real.
  *   **Controversy:** Whether specific historical outcomes were contingent or determined; whether lock-in is ubiquitous or rare.
  *   **My Position:** The debate is stalled due to category errors, not lack of data. I am not taking a side on whether QWERTY *was* locked in, but on how we should argue about it.

  ***

  **Notes for you to consider before submitting:**

  *   **The Reflexivity Bit:** I've kept this in, but marked it as high risk. If your supervisor thinks it's too much, you can easily cut it down to a "discussion" paragraph without breaking the proposal. It's the most novel part, but also the easiest to attack.
  *   **Cases:** I've flagged QWERTY as potentially mythic. You might want to swap this for something less contested if you know one, but since you said "well known so you don't need to check," I left it. The Metric/Imperial split is probably safer ground for "actual displacement."
  *   **Scope:** I was honest about the "three papers" worry. For a seed grant, admitting you might spin out extra work later shows you understand the workload, provided you promise the *core* framework will be delivered.
  *   **Justification:** I leaned hard on the "force multiplier" argument. Panels hate funding "thinking" unless you convince them it saves money later.
  *   **Tone:** Kept it direct. British spelling used (analyse, formalise, programme, centre). 

  You'll need to slot in your citations where I've left gaps (e.g., specific names in the literature), but the structure should hold. Good luck.
