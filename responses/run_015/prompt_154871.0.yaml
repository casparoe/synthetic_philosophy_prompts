      *   *Classic Induction:* We see green emeralds, we predict future emeralds are green.
      *   *Grue:* An object is "grue" if it's green and observed before time $t$, or blue and observed after time $t$.
      *   *Paradox:* All observed emeralds are grue (since they are green and before $t$). So why predict "green" instead of "grue"?
      *   *Solution (Goodman):* "Entrenchment." We use predicates that have been successfully projected in the past. "Green" is entrenched; "Grue" is not.
      *   *Projectibility:* Some predicates are valid for induction; others aren't.

