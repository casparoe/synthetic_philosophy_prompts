      *   *Empirical Risk:* Both hypotheses have zero training error on $D_{train}$.
      *   *Underdetermination:* Multiple $h \in \mathcal{H}$ fit $D_{train}$ perfectly.
      *   *Inductive Bias:* The preference for one $h$ over another (e.g., via regularization, architecture, prior).
