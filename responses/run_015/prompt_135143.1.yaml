answer: |-
  You have identified a genuine and mathematically sound phenomenon, yet you are correct to sense a gap in the terminology. There is no single, universally recognised noun in the social sciences that captures this specific configuration precisely as you describe it. However, the mechanics are well-understood in distinct literatures which, when synthesised, provide the definition and boundaries you seek.

  The closest existing concepts are found in the **Diversity Prediction Theorem** (Scott Page) and the literature on **Correlated Errors** within Condorcet's Jury Theorem. In engineering and reliability theory, the direct analogue is **"Common Mode Failure"**.

  Because no single label exists in the behavioural sciences, I shall outline the conceptual framework that defines it, distinguish it from its neighbours, and offer a precise coinage that you may find useful.

  ### 1. The Mathematical Core

  Your intuition regarding Condorcet is accurate. The classical Jury Theorem relies on two assumptions:
  1.  **Competence:** Each voter is more likely to be right than wrong ($p > 0.5$).
  2.  **Independence:** Voters decide independently of one another.

  Your cases describe a violation of the second assumption induced by an increase in the first. By standardising the protocol (the scoring rubric or the identification aid), you reduced the **variance** of individual errors (noise) but inadvertently increased the **covariance** of those errors (systematic bias).

  This is best formalised by the **Diversity Prediction Theorem**, which states:
  $$ \text{Collective Error} = \text{Average Individual Error} - \text{Prediction Diversity} $$

  In your examples, the reform reduced *Average Individual Error* (the individuals got better). However, it reduced *Prediction Diversity* even more drastically. When the tasks are difficult (where individual accuracy dips below 0.5), diversity is the only thing preventing the collective from converging on the wrong answer. If everyone uses the same heuristic, and that heuristic fails on a specific class of hard problems, the group fails with 100% consensus. Previously, uncorrelated errors meant that while the average individual might be wrong, the *majority* might still stumble upon the truth through scattered luck.

  ### 2. Distinction from Neighbours

  It is vital to separate this from phenomena that look similar but have different causal mechanisms.

  *   **Groupthink / Social Pressure:** This arises from interpersonal dynamics. Members suppress dissent to maintain harmony. In your cases, the panelists were not pressured by one another; they were aligned by the *tool*.
  *   **Information Cascades / Herding:** This occurs when individuals observe the choices of predecessors and ignore their own private information. Your cases involve simultaneous or independent assessment; the correlation comes from a shared *method*, not shared *information flow*.
  *   **Common Knowledge Effects:** This refers to groups focusing only on information everyone already holds. Your cases are about shared *processing rules*, not shared data.

  The phenomenon you describe is structural, not social. It is **"Methodologically Induced Error Correlation"**.

  ### 3. A Proposed Coinage

  Given the absence of a canonical term, I propose **"The Homogenisation Hazard"**.

  **Definition:** The Homogenisation Hazard occurs when an intervention designed to improve individual competence (training, standardisation, calibration) reduces cognitive diversity to such an extent that the correlation of errors increases, causing collective accuracy to decline despite individual improvement.

  **Conditions for Appearance:**
  1.  **Task Difficulty:** The task contains a subset of items where the average individual competence is low (approaching or below 0.5).
  2.  **Shared Heuristic:** The improvement mechanism imposes a common mental model or algorithm on all members.
  3.  **Systematic Bias:** The common heuristic possesses a blind spot that coincides with the difficult items.

  ### 4. The Boundary: When does Homogenisation Help?

  You asked for the boundary between homogenisation that helps and one that harms. This is determined by the ratio of **Variance Reduction** to **Covariance Increase**.

  *   **Helpful Homogenisation:** Occurs when the task is generally easy ($p \gg 0.5$) or the standardisation removes "noise" (random error) without introducing shared "bias". Here, the reduction in individual error outweighs the loss of diversity. The group converges on the truth faster.
  *   **Harmful Homogenisation (The Hazard):** Occurs when the task is hard ($p \approx 0.5$ or $< 0.5$ on specific items) and the standardisation aligns the *bias*. Here, the loss of diversity outweighs the gain in individual accuracy. The group converges on error with high confidence.

  In your moth-recording example, the difficult taxa likely possess ambiguous morphological features. The old, diverse identifiers used different cues (wing shape, flight time, location); some cues worked, others did not, but they were uncorrelated. The new aid likely relied on a single diagnostic feature that was misleading for those specific pairs. Every recorder, now competent, was competently wrong in the same way.

  ### 5. Diagnostic: How to Tell in Advance

  To determine whether a reform will trigger the Homogenisation Hazard, one must measure the **Intraclass Correlation Coefficient (ICC)** of errors during the pilot phase.

  1.  **Select a Test Set:** Include a representative mix of easy and "hard" cases (where expert disagreement is historically high).
  2.  **Measure Individual Accuracy:** Calculate $p$ for each member before and after the intervention.
  3.  **Measure Error Correlation:** Calculate the correlation between members' errors.
      *   If errors are uncorrelated (random), the crowd wisdom holds.
      *   If errors become highly correlated (especially on the hard cases), the Hazard is present.

  A practical rule of thumb: If the standardisation causes the **rate of unanimous agreement** to rise significantly, but the **accuracy on difficult items** does not rise commensurately, you are entering the Hazard zone. High unanimity on hard tasks is a warning sign of shared bias, not shared truth.

  ### Summary

  You have observed a violation of the independence assumption in Condorcet's Jury Theorem, driven by procedural alignment rather than social influence. While often discussed under the umbrella of **"Loss of Cognitive Diversity"**, there is no single noun for the specific dynamic where *improvement* drives *correlated failure*.

  **"The Homogenisation Hazard"** serves as a precise label for this. It is defined by the trade-off in the Diversity Prediction Theorem: when the reduction in prediction diversity exceeds the reduction in average individual error, the collective intelligence degrades. The warning sign is not disagreement, but rather a sudden, suspicious consensus on the most difficult problems.

  I hope this provides the conceptual clarity you sought. It is a sophisticated observation, and one that warrants precise language.
