      *   *Key Text:* *Politics* 1258b (Usury is most hated because money itself is the source). *Nicomachean Ethics* 1133a (Money as a guarantee of exchange).

  9.  **Final Polish:** Check tone. Ensure the "Extrapolation" markers are clear. Ensure the opening sketch is concise. (Proceed to generate output based on these thoughts).

