  *(Self-Correction on the Uncle)*: The uncle lives on rent. Aristotle sees land as the most just form of property because it relies on nature's growth. But *speculative* buy-to-let is closer to trade. I need to distinguish between "receiving fruit from land" vs "trading in housing."

