  5. One extra case I could ask him about that would settle which rule he's running — ideally where the two rules come apart as much as possible and where a "can't be bothered for less than 2%" habit wouldn't muddy the answer.

  No links, book recs or reading lists please, just the reasoning. British English. Last line has to be machine readable, either \answer{no bet} or \answer{stake N% of bankroll}.
