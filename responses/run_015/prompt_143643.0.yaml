answer: |-
  Elena coordinates a neighborhood mutual-aid group. During an in-person pantry shift, she notices a volunteer shivering, immediately lends her jacket, and spends twenty minutes listening to his housing worries, later citing this as proof of her compassionate character. Two weeks later, during a Zoom planning meeting with the same volunteer, he mentions eviction risks while his audio glitches; Elena, focused on a shared spreadsheet and irritated by the lag, interrupts him to prioritize agenda efficiency, afterward attributing the coldness to technical difficulties rather than her own responsiveness. She maintains she is consistently kind, unable to see how the medium shifted her moral attention.

  **Walkthrough**

  The behavior in question is Elena's differential response to identical distress cues (housing insecurity) across two media: physical co-presence versus video-mediated interaction. The method involves comparing her actions in these nearby worlds—one where sensory cues are rich and immediate, and another where they are fragmented by technology. The virtue ethicist argues that virtue requires *phronesis* (practical wisdom), which is context-sensitive; Elena possesses the seed of compassion but lacks the cultivated moral perception to recognize demands in digital spaces, meaning her virtue is incomplete rather than absent. The situationist claims that because her behavior flips based on a trivial environmental cue (audio lag/screen focus), there is no stable global trait of kindness, only situational responses masked by her self-narrative. The exact conceptual feature doing the work is *attributional self-image*: Elena's mistaken belief that she is consistently kind prevents her from correcting the digital deficit. If you remove this feature—if Elena admits she was callous on Zoom—the virtue ethicist can frame this as moral growth and trait expansion, whereas the situationist would still point to the initial inconsistency as proof that traits are fragile. The virtue defender pushes back by arguing that virtues are not robotic outputs but responses to perceived reasons; since digital contexts obscure moral reasons, the variation in behavior reflects a failure of attention rather than a lack of character, provided the agent commits to refining their perception across contexts.

