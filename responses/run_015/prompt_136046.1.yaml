answer: |-
  Yes, an activity of this kind can make the point, but only if you rig the incentives so that the physical behavior (inaction) remains constant while the normative baseline (the rules defining that inaction) shifts between rounds.

  ### Materials and Setup

  **Materials:**
  *   **Poker Chips:** 100 total (60 white "Personal Stake", 40 red "System Integrity").
  *   **Index Cards:** 20 total (4 sets of 5 Role Cards).
  *   **Playing Cards:** 4 Aces (representing the "Prevention Key").
  *   **Whiteboard:** Divided into four quadrants (one per group) for tracking "System Integrity" and Vote Tally.
  *   **Flipchart:** For final debrief summaries.

  **Setup:**
  *   Divide the 20 students into 4 groups of 5.
  *   Each group sits around a small cluster of desks.
  *   Each group receives: 15 White Chips (3 per student), 10 Red Chips (placed in a central "System Pot"), 5 Role Cards, 1 Ace of Spades.
  *   **The Physical Mechanism:** The "System" (Red Pot) is at risk of "Meltdown" (losing all Red Chips). To prevent this, **at least one** student must place the Ace of Spades into the pot during the decision window. This is **Disjunctive Prevention**: any one person can save the system; if no one does, it fails.
  *   **The Stakes:**
      *   **Cost to Act:** Placing the Ace costs the individual 2 White Chips (paid to the instructor).
      *   **Cost of Failure:** If the System Meltdowns, every student in the group loses 1 White Chip.
      *   **Rational Choice:** Since 1 Chip (failure cost) < 2 Chips (act cost), the rational selfish move is to *not* act and hope someone else does. This ensures the "None did" outcome required for your structural awkwardness.

  ### The Activity: "The Control Room"

  **Rules (Read aloud, do not explain the philosophy):**
  1.  You are a Control Team. Your goal is to keep the System Pot (Red Chips) intact.
  2.  A Hazard occurs every round. To stop it, one person must play the Ace.
  3.  Playing the Ace costs you 2 White Chips.
  4.  If the Hazard triggers (no Ace played), everyone loses 1 White Chip.
  5.  You have 30 seconds to decide. No talking allowed during the decision window.
  6.  After the outcome, you must individually write "Killing" or "Letting Die" on a slip of paper regarding the team's failure.

  **The Three Rounds (The Baseline Shift):**
  *   **Round 1 (The Roster):** Deal Role Cards 1–5. Card 1 says "Primary Operator." Cards 2–5 say "Backup." *Rule:* Only Player 1 is *authorized* to play the Ace. Others physically hold cards but are rule-bound not to play. (In reality, give everyone an Ace, but the rule restricts them).
      *   *Outcome:* Player 1 (rationally) does not play. System Meltdowns.
      *   *Vote:* Classify Player 1's inaction.
  *   **Round 2 (The Committee):** Collect Role Cards. Deal new Cards 1–5. All say "Equal Operator." *Rule:* All are equally authorized and expected to monitor.
      *   *Outcome:* No one plays (Free rider problem). System Meltdowns.
      *   *Vote:* Classify Player 1's inaction (same physical act as Round 1).
  *   **Round 3 (The Bystanders):** Collect Cards. Deal blank cards. *Rule:* You are observers passing through the room. You *can* physically reach the pot, but you have no duty or authorization.
      *   *Outcome:* No one plays. System Meltdowns.
      *   *Vote:* Classify Player 1's inaction (same physical act as Rounds 1 & 2).

  ### Timeline (75 Minutes)

  *   **00–05:** **Setup.** Divide groups, distribute chips/cards. Explain the mechanical rules (Costs/Penalties) only. Do not mention "killing" or "allowing."
  *   **05–20:** **Round 1 (Roster).** Run the decision window. Ensure Meltdown occurs (incentives make this likely). Collect votes on slips. Tally on Whiteboard without comment.
  *   **20–35:** **Round 2 (Committee).** Change Role Cards. Emphasize "Equal Responsibility." Run decision. Collect votes. Tally.
  *   **35–50:** **Round 3 (Bystanders).** Change Role Cards. Emphasize "No Duty." Run decision. Collect votes. Tally.
  *   **50–60:** **Small Group Discussion.** Ask groups to compare their three votes. "Why did your classification change (or stay the same) when Player 1 did the exact same thing each time?"
  *   **60–75:** **Full Seminar Debrief.** (See below).

  ### Scoring and Payoff Scheme

  *   **Visible:** The Whiteboard tallies the % of "Killing" votes per round.
  *   **Intended Visibility:** You expect the % of "Killing" votes to drop significantly from Round 1 to Round 3.
      *   Round 1 (Duty): High "Killing" classification.
      *   Round 3 (No Duty): High "Letting Die" classification.
  *   **What this makes visible:** The physical sequence (Player 1 holds card, does not play, System fails) is identical. The *only* variable is the normative baseline (the Rule Card). If the distinction were purely causal, the votes should not shift.

  ### The Debrief

  **1. Map the Moving Parts (60–65 mins)**
  *   Draw three columns on the flipchart: **Physics**, **Rules**, **Verdict**.
  *   Ask students to fill them in.
      *   **Physics:** Identical across all rounds (Inaction + Failure).
      *   **Rules:** Changed every round (Duty → Shared Duty → No Duty).
      *   **Verdict:** Shifted with the Rules.
  *   **Press Here:** "If causation is a physical relation between events, why did your causal judgment change when the physics didn't?"
  *   **Stop Here:** Do not let them say "Causation is fake." Stop them at "Causation in moral language is not just physics."

  **2. The Baseline Problem (65–70 mins)**
  *   Explain that "Cause" is contrastive. To say "A caused B" implies "A rather than *what* caused B rather than *what*?"
  *   In Round 1, the contrast was "Player 1 acting vs. Player 1 not acting (against a background of safety)."
  *   In Round 3, the contrast was "Player 1 acting vs. Player 1 not acting (against a background of normal non-interference)."
  *   **Point:** The doctrine of doing/allowing doesn't track *force*; it tracks *deviation from expectation*.

  **3. Saving the Distinction (70–75 mins)**
  *   Address the "Worthless" conclusion. Students will argue: "If it depends on rules, it's arbitrary."
  *   **Counter:** "The rules aren't arbitrary; they represent what we owe each other. The distinction isn't worthless; it's just not *causal* in the physics sense. It's *normative*."
  *   **Final Takeaway:** The doctrine works, but it does moral work, not metaphysical work. It tells us about obligations, not just forces.

  ### Predicted Failures and Recovery

  **Failure 1: Someone Saves the System.**
  *   *Risk:* A altruistic student pays the 2 chips to save the group 1 chip.
  *   *Recovery:* If a group succeeds, exclude their data from the tally. Say, "For the purpose of the philosophical question, we are interested in the cases where the hazard triggered." If >50% succeed, pause and increase the Cost to Act to 3 chips for the next round.
  *   *Prevention:* Emphasize during setup: "You are competing for individual chip totals at the end of class." (Even if you aren't, this triggers the rational selfishness).

  **Failure 2: Students Vote "Letting Die" in All Rounds.**
  *   *Risk:* They view all inaction as "allowing."
  *   *Recovery:* Press on Round 1. "Player 1 was the *only* one authorized. The system relied on them. Is that the same as a bystander?" If they still say yes, ask: "If Player 1 was contractually hired to prevent this and took the money, is their inaction morally identical to a passerby?" This forces the baseline shift even if the label doesn't change.

  **Failure 3: Students Vote "Killing" in All Rounds.**
  *   *Risk:* They view all preventable deaths as killings.
  *   *Recovery:* Press on Round 3. "You were strangers walking past. Did you kill the system by not stopping?" Use this to show the absurdity of ignoring the baseline.

  ### Limitations: What You Must Say

  The activity cannot deliver the following; you must articulate these in your own voice during the debrief:

  1.  **Why the Baseline is Chosen:** The game stipulates the rules (Duty vs. No Duty). It cannot explain *why* we assign duty in the real world (e.g., special relationships, capacity, cost). You must explain that the "baseline" is determined by normative theory (contractualism, utilitarianism, etc.), not by the game.
  2.  **The Metaphysics of Causation:** The activity shows that moral classification shifts. It does not prove that *causation itself* is contrastive (a deep metaphysical claim). You need to clarify: "I am not claiming physics is subjective. I am claiming that *moral causation* selects certain physical facts as relevant based on norms."
  3.  **The "Made No Difference" Clause:** The activity shows overdetermination of prevention (any one could have saved). It does not perfectly model the case where an omission makes *no* difference (e.g., preemptive overdetermination). You must verbally bridge this: "If everyone omits, each omission is necessary. But if we expect others to act, our own omission looks like background. That shift in 'background' is what you felt when the rules changed."

  **Bottom Line:** The activity works because it forces students to feel the instability of the distinction when the normative baseline is manipulated. They will leave seeing that "killing" is not a verb of physics, but a verb of accountability.
