prompt: |-
  I sit on the grant committee for a small regional foundation—maybe $400k a year, 25 proposals, mostly local nonprofits and some odd advocacy projects—and we're trying to stop arguing in circles about what to fund. A friend mentioned the importance-tractability-neglectedness framework from cause prioritization, which sounds smart, but when we try to apply it to our actual pile it just collapses. We get direct stuff like food-bank equipment and weird indirect stuff like a journalist fellowship on water rights, and nobody knows how to compare them. Can you turn ITN into a real decision procedure I could actually run in a meeting? I need the questions in strict order, what counts as a sufficient answer at each step, where the procedure gives a hard no, and where it stops being facts and becomes values so we just vote. It needs to work for people without econ backgrounds, say what to do when you can't get a real number, and be honest about which steps are just judgment calls dressed up as procedure. Then apply it to two proposals: upgrading refrigeration at a food bank (direct, easy to understand) and a three-year fellowship for a journalist covering state water policy (indirect, high stakes, unclear tractability). Please include at least one case where the procedure spits out an answer my committee will hate, so I can see where it breaks. Also, seperate what's actually settled in the literature on this framework from what's genuinely contested—don't present one view on weighting importance vs tractability as if it's the consensus—because I need my board to know exactly where they're faking precision.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Grant committee member for a small regional foundation ($400k/year, ~25 proposals).
      *   **Problem:** Circular arguments about funding decisions (direct vs. indirect impact).
      *   **Tool:** Importance-Tractability-Neglectedness (ITN) framework (from Effective Altruism/Cause Prioritization).
      *   **Goal:** Turn ITN into a *practical* decision procedure for a meeting.
      *   **Requirements:**
          *   Strict order of questions.
          *   Criteria for sufficient answers.
          *   Hard "No" conditions.
          *   Clear distinction between facts and values (where to vote).
          *   Accessible to non-economists.
          *   Handling missing data (no real numbers).
          *   Honesty about judgment calls vs. procedure.
          *   Application to two specific cases: Food Bank Refrigeration (Direct) vs. Journalist Fellowship (Indirect).
          *   Include a "hateable" outcome (where the procedure conflicts with intuition).
          *   Distinguish settled literature from contested areas (weighting, etc.).

  2.  **Deconstruct the ITN Framework:**
      *   *Importance:* How bad is the problem? How many people affected? Severity?
      *   *Tractability:* How solvable is it? Does money help? What's the marginal return?
      *   *Neglectedness:* How many others are working on it? Is there room for more funding?
      *   *Critique:* ITN is designed for *global* cause prioritization (e.g., AI risk vs. Malaria), not necessarily *local* grantmaking where mission alignment matters more than pure utility. It often assumes comparability that doesn't exist (apples to oranges).
      *   *Adaptation:* Need to scale it down. "Importance" becomes "Local Impact." "Neglectedness" becomes "Funding Gap." "Tractability" becomes "Organizational Capacity/Plan Viability."

  3.  **Drafting the Procedure (The "ITN-Lite" Protocol):**
      *   *Constraint:* Must be usable in a meeting. No complex spreadsheets.
      *   *Structure:* Funnel approach. Eliminate early, score later.
      *   *Step 1: Eligibility/Fit (The "Hard No" Gate).* Before ITN, does it fit the mission?
      *   *Step 2: Importance (Scale & Severity).* Who benefits? How much?
      *   *Step 3: Tractability (Can we actually help?).* Is the plan sound?
      *   *Step 4: Neglectedness (Are we the only ones?).* Is this crowded?
      *   *Step 5: The Weighting (The "Values" Vote).* This is where the literature is contested.
      *   *Handling Uncertainty:* Use ranges (Low/Med/High) instead of numbers.
      *   *Honesty:* Explicitly label where the framework is being stretched.

  4.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* ITN is a heuristic, not a formula. Multiplicative models are common but arbitrary.
      *   *Contested:* How to weight I vs. T vs. N. (EA community debates this heavily). Whether to use log scales. Whether "Neglectedness" implies diminishing returns.
      *   *Action:* Make sure the user knows the weighting is a *policy choice*, not a mathematical truth.

  5.  **Developing the Case Studies:**
      *   *Case A: Food Bank Refrigeration.*
          *   Importance: High (hunger is immediate).
          *   Tractability: High (fridges work).
          *   Neglectedness: Low/Med (usually funded, but specific need exists).
          *   *Result:* Likely fund.
      *   *Case B: Journalist Fellowship.*
          *   Importance: High (water policy affects everyone).
          *   Tractability: Low/Uncertain (one journalist might not change policy).
          *   Neglectedness: High (investigative journalism is underfunded).
          *   *Result:* This is where it gets tricky.
      *   *The "Hateable" Outcome:* The procedure might favor the Food Bank because Tractability is clearer, even if the Journalist has higher *potential* upside. Or, if we weight Neglectedness heavily, it might favor the Journalist over the Food Bank, which feels wrong to locals who see hunger *now*. Let's aim for the latter: The framework might say "Fund the Journalist" because the Food Bank is "crowded," which will annoy the committee who want to help neighbors immediately.

  6.  **Refining the Procedure for the User's Context:**
      *   $400k / 25 proposals = ~$16k average grant. This is small.
      *   The Journalist Fellowship (3-year) probably costs way more than $16k. *Correction:* I need to treat them as *requests*. Maybe the fellowship is asking for $50k (a chunk of the budget) and the fridge is $15k.
      *   *Crucial Adjustment:* ITN is for *causes*, not *organizations*. I need to adapt it to *proposals*.
      *   *Step 0:* Budget Fit. (Can we actually afford this?)
      *   *Scoring:* 1-5 scale is easier than "numbers."
      *   *The "Values" Vote:* Explicitly vote on the weights *before* scoring proposals.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the friction. ITN is for macro, we are adapting for micro.
      *   **The Literature Check:** Be honest about EA debates (multiplicative vs. additive, weighting).
      *   **The Procedure:**
          *   Pre-Meeting: Set Weights (The Value Judgment).
          *   Step 1: The Hard No (Eligibility).
          *   Step 2: Importance (Local Severity).
          *   *Step 3: Tractability (Evidence of Success).*
          *   *Step 4: Neglectedness (Funding Landscape).*
          *   Step 5: Calculation & Vote.
      *   **Handling Uncertainty:** Use "Confidence Intervals" (Low/Med/High confidence).
      *   **The Case Studies:** Run them through the protocol.
      *   **The "Hateable" Outcome:** Show how high Neglectedness can override low Tractability, leading to funding "risky" advocacy over "sure" aid.
      *   **Where it Breaks:** Acknowledge that ITN ignores *mission alignment* and *community trust*, which are vital for local foundations.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too complex?
      *   *Fix:* Simplify the scoring. Use a "Traffic Light" system or simple 1-3 scale. Let's stick to 1-5 but emphasize *relative* ranking, not absolute scores.
      *   *Critique:* Did I answer the "settled vs. contested" part?
      *   *Fix:* Add a specific sidebar or section on "What the Experts Actually Disagree On."
      *   *Critique:* Is the "Hateable Outcome" clear?
      *   *Fix:* Make sure the Journalist wins *mathematically* despite feeling riskier, highlighting the tension between "maximum impact" and "visible help."
      *   *Critique:* The prompt asks for "strict order" and "sufficient answer."
      *   *Fix:* Ensure each step has a "Pass/Fail" or "Data Needed" checkpoint.

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly skeptical of the framework's limits (matching the user's skepticism).
      *   Formatting: Bold headers, bullet points for readability.
      *   Check against constraints: $400k budget, 25 proposals, local context.

  *(Self-Correction on the "Hateable Outcome"):* If the Food Bank is "neglected" (maybe no one funds equipment, only food), it might win. If the Journalist is "important" but "intractable," it might lose. To make it hateable, the framework should probably prioritize the *Journalist* because the Food Bank is "saturated" (high neglectedness score for journalist), even though the Food Bank helps people *eat today*. This clashes with the "local foundation" ethos of immediate relief. I will construct the scoring to demonstrate this tension.

  *(Refining the "Settled vs Contested"):*
  *   Settled: ITN is a heuristic.
  *   Contested: Multiplicative (I x T x N) vs Additive. Logarithmic scales. How to define "marginal" vs "average" tractability.
  *   I need to tell the committee to pick a weighting scheme, not pretend one exists.

  10. **Final Output Generation** (incorporating all thoughts).
answer: |-
  This is a common friction point. The Importance-Tractability-Neglectedness (ITN) framework was built by the Effective Altruism (EA) community to compare *global causes* (e.g., "AI Safety" vs. "Global Health"), not to compare *local grant proposals* (e.g., "Fridges" vs. "Reporting"). When you apply macro-theory to micro-grants without adaptation, it breaks because "Neglectedness" looks different in a region of 500k people than it does on a planet of 8 billion.

  Below is a modified decision procedure designed for your specific constraints ($400k budget, 25 proposals, mixed portfolio). It strips away the econ-jargon, forces value judgments into the open, and identifies exactly where the framework is lying to you.

  ### Part 1: What's Settled vs. What's Contested
  *Be honest with your board about this. Do not present the math as objective truth.*

  **Settled in the Literature:**
  1.  **ITN is a heuristic, not a formula.** There is no universal equation. It is a checklist to prevent bias (e.g., funding what feels good rather than what does good).
  2.  **Marginal vs. Average.** You must evaluate the impact of *your* specific dollar, not the organization's overall impact. (e.g., The food bank is great, but do they already have enough fridges?)
  3.  **Diminishing Returns.** As a problem becomes less neglected, additional funding usually yields less impact.

  **Genuinely Contested (Where you must vote):**
  1.  **Weighting.** Should Importance count for 50% of the score, or 20%? There is no consensus. Some EA thinkers argue Tractability is the bottleneck; others argue Importance is the only thing that matters.
  2.  **Multiplicative vs. Additive.** Do you multiply the scores (I × T × N)? If Tractability is 0, is the whole project 0? Or do you add them? Multiplicative is stricter; Additive is more forgiving.
  3.  **Time Horizon.** Does "Importance" count only immediate relief (meals today) or systemic change (policy in 5 years)? The literature does not agree on the discount rate for future benefits.

  ---

  ### Part 2: The "ITN-Lite" Decision Procedure
  *Run this in order. Do not skip steps.*

  #### Pre-Meeting: The Value Vote
  *Before looking at proposals, the committee must agree on the weights. This is where you admit you are making value judgments.*
  *   **Action:** Vote on the weighting scheme for this cycle.
      *   *Option A (Relief Focus):* Importance (50%), Tractability (30%), Neglectedness (20%).
      *   *Option B (Systems Focus):* Importance (40%), Tractability (20%), Neglectedness (40%).
  *   **Sufficient Answer:** A simple majority vote. Record this in the minutes. **Do not change this mid-meeting.**

  #### Step 1: The Hard No (Eligibility & Budget)
  *Filter out noise before applying ITN.*
  *   **Question:** Does this proposal fit our geographic/mission mandate, and can we afford it without consuming >25% of the annual budget (unless explicitly strategic)?
  *   **Data Needed:** Requested amount, location, mission statement.
  *   **Hard No Condition:** If "No" to mandate OR "Yes" to >25% budget (single grant).
  *   **Fact vs. Value:** Fact. No debate allowed here.

  #### Step 2: Importance (Scale & Severity)
  *Adapted for local context: How bad is the problem here, and how many locals suffer?*
  *   **Question:** If this project succeeds, how many people benefit and how deeply does it affect their lives?
  *   **Scoring (1-5):**
      *   1: Niche benefit (<50 people), low severity.
      *   3: Significant benefit (500+ people), moderate severity.
      *   5: Critical benefit (2,000+ people), survival/severe rights impact.
  *   **Handling Uncertainty:** If the applicant claims "Statewide impact" but provides no data, cap the score at 3.
  *   **Sufficient Answer:** Consensus on a single integer. If range >2 points (e.g., some say 2, some say 5), discuss for 5 mins, then Chair decides.

  #### Step 3: Tractability (Evidence of Success)
  *Adapted: Is the plan sound, and does money actually solve this?*
  *   **Question:** Is there evidence that this specific intervention works, and does this organization have the capacity to execute it?
  *   **Scoring (1-5):**
      *   1: Theoretical only, untested org, or money is not the bottleneck.
      *   3: Standard intervention, competent org.
      *   5: Proven model, high capacity, money is the direct constraint.
  *   **Hard No Condition:** If Score = 1. (Do not fund experiments with high failure risk unless your mission is R&D).
  *   **Fact vs. Value:** Mostly Fact (look at past reports, budgets), but capacity assessment is Judgment.

  #### Step 4: Neglectedness (Funding Gap)
  *Adapted: Are others already covering this?*
  *   **Question:** If we don't fund this, will someone else? Is this specific need currently unfunded?
  *   **Scoring (1-5):**
      *   1: Crowded. Many funders, likely to be funded elsewhere.
      *   3: Some interest, but gaps remain.
      *   5: Critical gap. No other funders are looking at this specific niche.
  *   **Handling Uncertainty:** If you don't know the local funding landscape, assign a 3. Do not guess 5.
  *   **Fact vs. Value:** Fact (check other grants), but "Is this specific niche distinct?" is Judgment.

  #### Step 5: The Calculation & Rank
  *   **Action:** Apply the Pre-Meeting Weights to the Scores.
  *   **Formula:** `(Importance × Weight) + (Tractability × Weight) + (Neglectedness × Weight) = Total Score`
      *   *Note: I recommend Additive for local foundations. Multiplicative punishes low Tractability too harshly for small grants.*
  *   **Decision Rule:** Fund from highest score down until budget is exhausted.
  *   **The "Values" Check:** If the top-ranked project feels morally wrong to the committee, you are allowed to override **once** per cycle, but you must record *why* the framework failed.

  ---

  ### Part 3: Application to Your Two Proposals

  *Assumptions for the Scenario:*
  *   **Budget Weighting:** The committee voted for **Option B (Systems Focus)**: Importance (40%), Tractability (20%), Neglectedness (40%). *This weighting favors the Journalist.*
  *   **Grant Sizes:** Food Bank ($15k), Journalist ($50k).

  #### Proposal A: Food Bank Refrigeration
  *   **Step 1 (Hard No):** Pass. Fits mission, budget OK.
  *   **Step 2 (Importance):** **4**. Hunger is severe. Affects ~1,000 families locally.
  *   **Step 3 (Tractability):** **5**. Fridges work. Org is established. Money is the only barrier.
  *   **Step 4 (Neglectedness):** **2**. Food banks are popular. Corporate donors often fund equipment. This specific fridge might get funded by a rotary club if you say no.
  *   **Calculation:**
      *   (4 × 0.4) + (5 × 0.2) + (2 × 0.4)
      *   1.6 + 1.0 + 0.8 = **3.4**

  #### Proposal B: Journalist Fellowship (Water Policy)
  *   **Step 1 (Hard No):** Pass. Fits advocacy mandate, budget OK (assuming you can stretch for one large grant).
  *   **Step 2 (Importance):** **5**. Water policy affects the entire region (500k+ people). Long-term health/economic stakes.
  *   **Step 3 (Tractability):** **2**. One journalist might not change policy. Success is hard to measure. High risk of "no impact."
  *   **Step 4 (Neglectedness):** **5**. Investigative journalism is collapsing. No one funds state-house water reporting specifically. If you don't, no one will.
  *   **Calculation:**
      *   (5 × 0.4) + (2 × 0.2) + (5 × 0.4)
      *   2.0 + 0.4 + 2.0 = **4.4**

  #### The Result
  **The Procedure Says:** Fund the **Journalist Fellowship**.
  **The Committee Will Hate This:** Because the Food Bank helps people *eat this week*, and the Journalist *might* change a law in three years. The Food Bank score was dragged down by "Neglectedness" (it's too popular), while the Journalist shot up because it's "Neglected" (underfunded).

  **Why this breaks:**
  1.  **Time Preference:** ITN often ignores that local donors care about *now*. The framework treats a meal today and a policy in 2027 as comparable units of "Importance."
  2.  **Attribution:** The Journalist's "Importance" assumes the reporting *causes* the policy change. That is a huge assumption. The Food Bank's impact is direct.
  3.  **Community Trust:** If the community sees you funding a journalist instead of food during a downturn, you lose legitimacy. ITN does not measure "Reputation Risk."

  ---

  ### Part 4: Where the Procedure Fails (And How to Fix It)

  You asked for honesty about where this is just judgment dressed up as procedure. Here are the three failure points you will encounter:

  **1. The "Neglectedness" Trap**
  *   **The Problem:** In a small region, "Neglectedness" is often a proxy for "Hard to Fund." Just because no one funds a controversial advocacy project doesn't mean it's a *good* investment; it might be unfunded because it's ineffective or toxic.
  *   **The Fix:** Add a **"Quality Floor"** to Neglectedness. You cannot score higher than a 3 on Neglectedness unless there is evidence that the lack of funding is due to oversight, not lack of merit.

  **2. The Incommensurability Problem**
  *   **The Problem:** You are comparing "Meals" to "Democracy." The math pretends these are the same unit. They aren't.
  *   **The Fix:** **Bucketing.** Divide your $400k into two pots *before* using ITN.
      *   Pot 1: Direct Services ($250k). Run ITN only on food/housing/health proposals.
      *   Pot 2: Systems/Advocacy ($150k). Run ITN only on policy/journalism proposals.
      *   *This prevents the Journalist from stealing the Food Bank's money mathematically.*

  **3. The Precision Illusion**
  *   **The Problem:** Giving a Journalist Fellowship a "Tractability: 2" feels precise. It's actually a guess.
  *   **The Fix:** **Confidence Flags.** Next to every score, mark it **H** (High Evidence), **M** (Some Evidence), or **L** (Guess).
      *   If a proposal has a high Total Score but mostly **L** flags, it requires a 2/3 majority vote to fund.
      *   *In our example:* The Journalist has Low Confidence on Tractability. The Food Bank has High Confidence. This allows the committee to legally override the score based on risk tolerance.

  ### Summary Recommendation for Your Meeting
  1.  **Adopt the "Bucketing" strategy.** Do not let direct aid compete directly with advocacy using the same math. It creates resentment and bad optics.
  2.  **Use the Pre-Meeting Weight Vote.** Force the board to admit if they value "Systems Change" over "Relief" *before* they see the proposals.
  3.  **Accept the "Hateable Outcome" as a Feature.** If the framework tells you to fund the Journalist, use that as a prompt: *"The math says this has higher leverage. Are we willing to accept the risk of less visible impact for higher potential systemic change? If not, change the weights."*

  The framework doesn't make the decision for you. It just forces you to argue about the right things (weights and evidence) instead of the wrong things (personal preferences and anecdotes).
