  **NEURATHIA**

  **Population:** 4.2 million (approx.)
  **Language:** Standard ISOTYPE
  **Currency:** The Unit (¢)

  Upon crossing the border, travellers will immediately notice the silence. There are no welcome signs, no billboards advertising local beer, and no graffiti. The landscape is organised into a grid of flat, brightly coloured pictograms. A row of identical men indicates a residential zone; a stylised tree denotes a park. This is Neurathia, the world's only nation committed to Otto Neurath's vision of a universal visaul language free from the ambiguities of speech.

  The promise here is anti-metaphysical clarity. In Neurathia, you cannot lie, because you cannot speak in abstractions. There is no word for 'freedom', 'justice', or 'tomorrow'. Communication is restricted to observable facts. However, visitors often find that removing verbal ambiguity merely replaces it with pictorial indeterminacy. A picture of a man sleeping may indicate a hotel, a nap, or unconsciousness. Context is king, yet context is rarely depicted.

  Negation is particularly troublesome. The universal 'red slash' is used to denote prohibition, absence, or death. Asking for 'no ice' in a drink often results in the bartender refusing service entirely, interpreting the slash as a cancellation of the order. Furthermore, tense is non-existent. A picture of a train means 'train', 'arriving train', or 'train crash'. Locals rely on sequence to imply time, but misunderstandings are frequent. Do not attempt to discuss feelings; there is no icon for 'loneliness' that does not also signify 'single occupancy room'.

  **LOCAL CUSTOMS: THE COFFE PROBLEM**
  Ordering refreshments requires nerve. The menu is a grid of cups. The danger lies in the additives. The icon for milk is a solid white square. Due to ISOTYPE's prohibition on texture, this looks identical to the icon for white paint or bleach. Locals drink their coffee black to avoid poisoning. If you require dairy, point to the cow icon followed by the cup. Do not point to the cow followed by the red slash, or you will be escorted out for advocating animal cruelty.

  **ENTRY REQUIREMENTS: THE PICTOGRAM EXAM**
  Immigration is conducted entirely through drawing. You will be given a stylus and a tablet. You must depict 'Tourism'.
  *   **Tip:** Do not draw a camera. This signifies 'Surveillance' or 'Spying'.
  *   **Tip:** Do not draw a sunbed. This signifies 'Illegal Labour'.
  *   **Success:** Draw a suitcase next to a bed, followed by a coin. This implies 'Paid Accommodation'.
  If your drawing is too artistic (perspective, shading), it will be rejected for metaphysical excess. Keep it flat. Keep it dull.

  **PUBLIC HOLIDAY: THE ABOLITION OF VERBS**
  Every 14th November, Neurathia celebrates *Tag der Stille* (Day of Silence). To honour the logical purity of the noun, all verbs are banned for 24 hours. No actions can be depicted or performed. Citizens stand still. Shops do not open (the icon for 'open' implies movement). It is a day of profound static clarity. Travellers are advised to remain in their hotels. Walking in public during the holiday may be interpreted as a depiction of 'Labour', which is punishable by a fine.

  **GETTING AROUND**
  Maps are excellent, provided you know where you are. If you become lost, do not ask for help verbally. Hold up a map and point to your location. If the local responds with a question mark, they do not know. If they respond with a picture of a police officer, you are standing in a restricted zone. Move away slowly. Do not run. Running looks like 'Panic' or 'Guilt'.

  *Note: Recieve all instructions literally. If shown a picture of a dog with a slash, do not bring a dog. It also means 'No Barking'.*
