      *   Single change? Yes.
      *   Answer specific questions? Yes.
      *   Don't dictate dropping core attachment? Yes.

  *(Self-Correction on the "Single Change"):* The user asks "which single change would clean up the most." I need to be prescriptive here but gentle. The most efficient fix is refining (1) to include an *epistemic condition*. You can only suspect adaptive preference if the person *knows* what they are missing. If they don't know, you can't discount them. This saves the Aunt (she didn't know), saves the Activists (they know the alternatives), and keeps the Door Test (it measures awareness).

