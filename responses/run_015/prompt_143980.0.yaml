answer: |-
  # The Protocol: "The Floor & Fraction" Procedure

  This document is the operating procedure for the betting syndicate. It overrides vibes, hunches, and "feeling lucky." If you cannot complete a step, the answer is **No Bet**.

  **Definitions:**
  *   **Bankroll:** Total liquid cash dedicated to betting ($42,000).
  *   **Floor:** The hard stop-loss limit ($25,000).
  *   **Risk Capital:** Bankroll minus Floor ($17,000). *All sizing is based on this number, not the total Bankroll.*
  *   **Market Prob:** The probability implied by the odds/price.
  *   **Our Prob:** The probability you assign after following the Disagreement Rule.
  *   **Decimal Odds:** The payout multiplier (e.g., 25-to-1 is 26.0 decimal; even money is 2.0).

  ---

  ## Step 1: The Veto (Time & Liquidity)
  **Question:** Can this bet be settled before the house deposit deadline (24 months from now), and does it take less than 15 minutes to execute?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP. No Bet.**
  *   **Note:** If the bet resolves after the house deposit date, you are betting with money you might need for a down payment. That violates the Floor constraint.

  ## Step 2: The Cluster Check (Correlation)
  **Question:** Is there a single news event or outcome that would resolve this bet *and* any other open bet in the same direction?
  *   **No:** Treat as a standalone bet. Proceed to Step 3.
  *   **Yes:** This is a **Cluster**.
      *   Group all correlated bets together.
      *   Sum the *potential stake* of all bets in the cluster.
      *   **Constraint:** The total stake of the cluster cannot exceed the result of the Sizing Formula (Step 5) calculated for the single best bet in the group.
      *   *Example:* If you have three bets on "Candidate X wins," and the formula says bet $500 on the best price, you cannot bet $500 on all three. You bet $500 total, allocated to the best prices.
      *   Proceed to Step 3 with the "Cluster Representative" (the bet with the best price/highest edge).

  ## Step 3: The Numbers (Disagreement, Tax, & Overhead)
  You must agree on three numbers. If you cannot agree, use the rules below.

  **A. Probability (The Disagreement Rule)**
  *   If your probability estimates differ by 5% or less: Average them.
  *   If they differ by more than 5%: **Use the conservative estimate** (the one closer to the Market Prob).
  *   *Rationale:* If one of you sees less edge than the other, that uncertainty is risk. Do not bet on the optimist's number.

  **B. The Tax & Fee Haircut**
  *   Calculate **Expected Gross Profit**: $(Stake \times Our Prob \times Decimal Odds) - Stake$.
  *   Calculate **Expected Net Profit**: $(Win Amount \times 0.70) - (Loss Amount \times 1.0)$.
      *   *Note:* We assume 30% tax on wins and 0% immediate benefit on losses (since they carry forward). This is conservative.
  *   **The Overhead Filter:** Is the Expected Net Profit greater than **$50**?
      *   **No:** **STOP. No Bet.** (Your time and fees cost more than the edge is worth).
      *   **Yes:** Proceed to Step 4.

  ## Step 4: The Calibration Shrinkage
  Check your shared log of the last 20 settled bets.
  *   Calculate **Realization Ratio**: (Total Actual Net Profit) / (Total Expected Net Profit at time of bet).
  *   **If Ratio < 0.5:** You are overconfident. Apply a **0.5x Multiplier** to your final stake.
  *   **If Ratio ≥ 0.5:** You are calibrated enough. Apply a **1.0x Multiplier**.
  *   *Note:* If you have fewer than 20 settled bets, default to the 0.5x Multiplier.

  ## Step 5: The Sizing Formula (Quarter-Kelly on Risk Capital)
  Do not use the full Bankroll. Use the **Risk Capital** ($17,000). Do not use Full Kelly. Use **Quarter-Kelly** to survive variance and tax drag.

  **The Formula:**
  1.  **Edge %** = $(Our Prob \times Decimal Odds) - 1$
  2.  **Kelly Fraction** = $Edge \% / (Decimal Odds - 1)$
  3.  **Raw Stake** = $Risk Capital \times Kelly Fraction \times 0.25$ (Quarter Kelly)
  4.  **Final Stake** = $Raw Stake \times Calibration Multiplier$ (from Step 4)

  **Rounding:** Round down to the nearest $10.

  ## Step 6: The Decision
  *   If **Final Stake** is less than the platform minimum: **No Bet.**
  *   If **Final Stake** is greater than $0: **Place the bet.**
  *   **Record:** Immediately log the bet, the "Our Prob," and the Expected Net Profit in your shared sheet.

  ---

  # Case Study Runs

  Here is how the procedure handles your three specific scenarios.
  *Assumptions for all cases: Risk Capital = $17,000. Calibration Multiplier = 1.0 (for simplicity). Tax Rate = 30%.*

  ### Case 1: The Near-Certain Thing
  *   **Market:** 91% (Decimal Odds: 1.10).
  *   **Our Prob:** 94%.
  *   **Disagreement:** None.
  *   **Cluster:** Standalone.

  **Run:**
  1.  **Edge %:** $(0.94 \times 1.10) - 1 = 0.034$ (3.4% edge).
  2.  **Kelly Fraction:** $0.034 / (1.10 - 1) = 0.34$ (34% of bankroll).
  3.  **Raw Stake:** $\$17,000 \times 0.34 \times 0.25 = \$1,445$.
  4.  **Overhead Check:**
      *   Win: $\$1,445 \times 0.10 = \$144.50$. After Tax (70%): $\$101$.
      *   Loss: $\$1,445$.
      *   Expected Net: $(0.94 \times \$101) - (0.06 \times \$1,445) = \$95 - \$86 = \$9$.
  5.  **Decision:** Expected Net Profit ($9) is less than the $50 Overhead Filter.
  6.  **Result:** **NO BET.**
  *   *Why:* The edge is too thin. Once you account for taxes and the value of your time, you are working for free.

  ### Case 2: The Election Cluster
  *   **Scenario:** Three bets on "Candidate X wins" across three venues.
  *   **Best Price:** 55% implied (Decimal 1.82).
  *   **Our Prob:** 65%.
  *   **Cluster Rule:** Treat as one bet sized off the best price.

  **Run:**
  1.  **Edge %:** $(0.65 \times 1.82) - 1 = 0.183$ (18.3% edge).
  2.  **Kelly Fraction:** $0.183 / (1.82 - 1) = 0.22$.
  3.  **Raw Stake:** $\$17,000 \times 0.22 \times 0.25 = \$935$.
  4.  **Allocation:** You have $935 total to deploy across the three venues. You prioritize the venue with the best price until its limit is hit, then move to the second best.
  5.  **Overhead Check:**
      *   Win (Net of Tax): $\$935 \times 0.82 \times 0.70 = \$538$.
      *   Loss: $\$935$.
      *   Expected Net: $(0.65 \times \$538) - (0.35 \times \$935) = \$349 - \$327 = \$22$.
  6.  **Decision:** Expected Net Profit ($22) is less than $50.
  7.  **Result:** **NO BET.**
  *   *Why:* Even with a decent edge, the tax drag on the winnings (30%) combined with the full loss of the stake makes the *cash-flow* expectation negative relative to your time. You are effectively subsidizing the government's revenue with your volatility.
  *   *Correction:* To pass the $50 EV filter, you would need a larger edge or higher odds. This highlights how taxes kill low-odds arbitrage.

  ### Case 3: The Longshot (The "Hate It" Number)
  *   **Market:** 4% (Decimal Odds: 26.0).
  *   **Our Prob:** 8%.
  *   **Disagreement:** None.

  **Run:**
  1.  **Edge %:** $(0.08 \times 26.0) - 1 = 1.08$ (108% edge).
  2.  **Kelly Fraction:** $1.08 / (26.0 - 1) = 0.0432$ (4.32%).
  3.  **Raw Stake:** $\$17,000 \times 0.0432 \times 0.25 = \$183.60$.
  4.  **Overhead Check:**
      *   Win (Net of Tax): $\$183 \times 25 \times 0.70 = \$3,202$.
      *   Loss: $\$183$.
      *   Expected Net: $(0.08 \times \$3,202) - (0.92 \times \$183) = \$256 - \$168 = \$88$.
  5.  **Decision:** Expected Net Profit ($88) is greater than $50.
  6.  **Result:** **BET $180.**
  *   *Why you'll hate it:* You see an 8% chance vs 4%. It feels like a "mortgage the house" situation. But the math says: if you are wrong 92% of the time, you cannot afford to bet big, even if the payout is huge. The Quarter-Kelly plus the Risk Capital floor protects you from ruin during the 92% of times this goes to zero. The $180 stake feels insultingly low for a "sure thing," but it is the only amount that keeps you in the game if you lose 10 times in a row.

  ---

  # What This Procedure Cannot Do

  1.  **It Cannot Fix Bad Data:** If you both agree the probability is 8% but the real probability is 3%, you will lose money. The Calibration Shrinkage (Step 4) will eventually catch this, but you will pay for the lesson first.
  2.  **It Cannot Predict Platform Risk:** If the betting exchange goes bust or freezes withdrawals (common in crypto-prediction markets), this math assumes you get paid. Keep no more than 20% of your Bankroll on any single platform.
  3.  **It Cannot Optimize Taxes Legally:** This procedure assumes the worst-case tax scenario (30% flat). It does not advise on LLC structures, harvesting losses, or jurisdiction changes. That requires a CPA, not a phone calculator.
  4.  **It Cannot Remove Variance:** You can follow this perfectly and lose $5,000 in a week. This procedure manages *risk of ruin*, not *risk of sadness*. If your wife sees a $5k drawdown, she will not care that your Kelly Criterion was correct.
  5.  **It Cannot Handle "All-In" Moments:** If a black swan event happens (e.g., market suspension), you cannot exit. This procedure assumes liquid markets.

  # Final Instruction for the Brother-in-Law

  If you are running this alone:
  1.  Open the Shared Sheet.
  2.  Run Steps 1 through 6.
  3.  If the result is **No Bet**, log it as "Passed on Opportunity." This is crucial. We need to track what we *didn't* bet to measure discipline.
  4.  If the result is a **Dollar Amount**, place the bet and log it.
  5.  If you are unsure on a number, **default to the more conservative option**. Preserving the Floor ($25k) is more important than maximizing growth.

  **The Goal:** We are not trying to get rich quick. We are trying to generate alpha on surplus cash without ever having to tell my wife we dipped into the house fund.
