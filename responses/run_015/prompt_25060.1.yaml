answer: |-
  **The Theorem**
  Good's theorem, formulated by I.J. Good in 1967, states that the expected utility of obtaining free information is always greater than or equal to the expected utility of acting without that information. The logic is straightforward: if you receive new evidence, you can always choose to ignore it and take the same action you would have taken originally, so you are never worse off than you started; however, if the evidence suggests a different action yields higher utility, you can switch strategies and gain value. For the theorem to hold strictly, several assumptions must be met: the information must be costless (no resources or time expended to acquire it), the decision-maker must update their beliefs rationally (via Bayes' rule), they must act optimally given the new beliefs, and crucially, the act of observing the information must not alter the state of the world or the available options.

  **The Episode**
  In late 2002 and early 2003, the US administration faced a binary decision structure: initiate a military invasion of Iraq immediately or delay action to allow UN weapons inspectors, led by Hans Blix, more time to verify intelligence regarding Weapons of Mass Destruction (WMDs). The core uncertainty was whether Saddam Hussein possessed active, deployable WMD programs that posed an imminent threat. The available information was ambiguous; intelligence agencies provided conflicting assessments, while the inspectors on the ground requested months to complete their surveys without finding definitive proof. The argument for immediate action, encapsulated by Condoleezza Rice's "mushroom cloud" comment, posited that delay itself carried a catastrophic risk: waiting for confirmation might allow a latent threat to mature into an actual attack or proliferation event. Conversely, the argument for waiting relied on the premise that better information would prevent an unnecessary war based on false premises.

  **The Analysis**
  Through the lens of Good's theorem, the US administration is the decision-maker, and the inspectors' final report represents the "free information." Normatively, the theorem suggests the administration should have waited for the inspectors to finish, as better information regarding WMDs should theoretically improve the decision quality without cost. However, the "mushroom cloud" argument explicitly challenges the theorem's assumption that information gathering is costless and non-interfering. In this framework, time is not neutral; every day spent gathering information is a day the adversary potentially strengthens their position or launches an attack. Therefore, the "cost" of the information was not monetary but existential—the risk accrued during the delay. The administration's logic implies that the expected utility of waiting was negative because the state of the world was dynamic and adversarial, not static.

  Furthermore, the episode highlights a violation of the assumption that observation does not change the payoff structure. In a security dilemma, the act of waiting signals hesitation to the adversary, potentially encouraging them to hide assets or escalate, thereby changing the very reality the information was meant to reveal. Good's theorem assumes a single-agent decision problem against "nature," where the truth is fixed waiting to be discovered. In Iraq, the "truth" (Saddam's capabilities and intentions) was potentially mutable based on the US's decision to wait or strike. Consequently, the argument wasn't that information itself had negative value, but that the *process* of acquiring it altered the probabilities of the worst-case outcomes, rendering the standard calculation of the value of information inapplicable.

  **What the Episode Reveals**
  This episode does not break Good's theorem so much as it exposes the fragility of its assumptions in high-stakes, adversarial environments. It confirms that the theorem is only useful when the costs of information gathering—including opportunity costs and time delays—are correctly specified. When the "cost" of waiting includes the potential for a catastrophic event (the mushroom cloud), the net value of information can indeed become negative, consistent with a modified utility calculation that accounts for temporal risk. The theorem remains useful as a baseline check: it forces decision-makers to articulate exactly *why* they aren't waiting. If they claim information is useless, they must justify why the cost of acquiring it outweighs the benefit of reduced uncertainty.

  Ultimately, the Iraq case reveals that real-world decision theory often collapses into game theory when other agents can react to your information-gathering process. Good's theorem treats information as a passive commodity, but in geopolitics, information gathering is an active move that opponents can counter. The episode suggests that while Good's theorem is mathematically sound for static problems, it requires significant modification to handle dynamic systems where the act of looking changes what is being looked at. It teaches us that in volatile contexts, the value of information is inextricably linked to the value of time and the strategic reactions of others.
