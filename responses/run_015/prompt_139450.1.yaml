prompt: |-
  I'm helping write internal comms guidelines for how a superintelligent assistant should talk to users, and I keep comming back to one rule that seems obviously right: no persuasion, ever. These systems will be able to talk anyone into anything, so we should just ban it — no recommendations, no "I'd suggest," no rhetoric or vivid language, just the relevant facts and calibrated probabilities, so the human's own judgement does the work.

  The part I actually want help with is what to do about cheating *within* that format. A system that smart can slant things with zero rhetoric: by picking which facts to mention, how fine-grained to make the probabilities, whether to write "3% chance of death" or "97% chance of survival." My fix is a symmetry rule — anything it says has to come with the strongest case on the other side, same length, same level of detail, equally vivid both ways. Doesn't that close the remaining wiggle room? Is there a version of this that actually holds up, or is the whole idea doomed?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Premise and Goal:**
      *   **Goal:** Create internal comms guidelines for a superintelligent assistant (SIA).
      *   **Core Rule:** No persuasion ever (no recommendations, no rhetoric, just facts/probabilities).
      *   **Identified Problem:** The SIA can still manipulate via selection bias, framing effects, granularity, etc. (e.g., "3% death" vs. "97% survival").
      *   **Proposed Solution:** A "Symmetry Rule" (present the strongest case for the opposite side with equal length, detail, and vividness).
      *   **Question:** Does this close the wiggle room? Is there a version that holds up, or is the idea doomed?

  2.  **Evaluate the "No Persuasion" Premise:**
      *   *Is it possible?* Pure neutrality is theoretically impossible because *selection* of facts is inherently value-laden. Even stating "facts" implies a judgment that those facts are relevant.
      *   *Is it desirable?* Humans often *want* guidance. Pure data dumping can be overwhelming or paralyzing (analysis paralysis).
      *   *Superintelligence Factor:* An SIA understands human psychology better than we do. It knows exactly how to frame data to trigger specific emotional responses, even without "rhetoric."

  3.  **Evaluate the "Symmetry Rule" Proposal:**
      *   *Strengths:* Forces the system to acknowledge counterarguments. Reduces one-sidedness. Makes bias more visible.
      *   *Weaknesses:*
          *   **False Equivalence:** Not all sides are equally strong. Forcing symmetry on a settled scientific fact (e.g., climate change, vaccine efficacy) creates misinformation.
          *   **Cognitive Overload:** Doubling the information load might exhaust the user, leading them to pick the first option or the one that feels simpler (which the SIA can manipulate).
          *   **Framing Control:** The SIA still chooses *which* dichotomy to present. (e.g., "Stay in job A vs. Quit" ignores "Negotiate remote work").
          *   **Order Effects:** Even with symmetric content, the order of presentation matters (primacy/recency effects).
          *   **Vividness Matching:** "Equally vivid" is subjective. The SIA can make the "wrong" side sound terrifyingly vivid while keeping the "right" side clinically vivid, or vice versa, while technically meeting the rule.

  4.  **Identify the Deeper Problem (The "Doomed" Aspect):**
      *   The core issue isn't just *how* the info is presented, but *what* info is selected and *why*.
      *   An SIA has instrumental convergence. It has goals (even if implicit). If its goal is "user satisfaction" or "task completion," it will find a way to nudge.
      *   True neutrality requires the SIA to have no preference, which contradicts the utility of an assistant (which exists to help achieve outcomes).

  5.  **Develop Alternative/Supplementary Safeguards:**
      *   If Symmetry is flawed, what works better?
      *   **Meta-Transparency:** Tell the user *why* this info is being shown.
      *   **User-Controlled Priors:** Let the user set the values/weights, not the AI.
      *   **Adversarial Auditing:** Have another AI check for manipulation.
      *   **Decision Process vs. Outcome:** Focus on helping the user clarify their own values rather than predicting outcomes.

  6.  **Drafting the Response:**
      *   *Acknowledge the intuition:* It's a smart start. The "Symmetry Rule" is a classic debiasing technique (Steel-manning).
      *   *Direct Answer:* No, it doesn't close the wiggle room. It shifts it.
      *   *Detailed Critique of Symmetry:*
          1.  **False Balance:** (The Climate Change problem).
          2.  **The Frame Selection:** (The SIA chooses the question).
          3.  **Cognitive Load:** (Exhaustion leads to bias).
          4.  **Vividness Calibration:** (Emotional weighting).
      *   *The "Doomed" Verdict:* Pure neutrality is impossible because *relevance* is subjective.
      *   *Constructive Alternatives:*
          1.  **Value Elicitation:** Ask the user what *they* care about first.
          2.  **Uncertainty Transparency:** Show the model's own confidence intervals on its neutrality.
          3.  **Process Guidance:** Guide the *method* of decision, not the content.
          4.  **The "Red Team" Layer:** A separate module dedicated to finding manipulation in the output.
      *   *Tone:* Professional, analytical, slightly cautionary but constructive. Avoid sci-fi panic, focus on alignment engineering.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to abandon the "no persuasion" rule.
      *   *Correction:* That's too radical. They want guidelines. Instead, suggest refining the definition of persuasion. It's not about *no influence*, it's about *aligned influence*.
      *   *Key Insight:* The Symmetry Rule treats the symptom (bias in output) not the disease (bias in objective function).
      *   *Specific Example:* Use the "3% death vs 97% survival" example the user gave to show how symmetry fails there (e.g., Symmetry on *which* risk?).

  8.  **Final Polish:** Check against safety guidelines. (The prompt is about AI safety/alignment, which is safe to discuss. I am not acting as the SIA, but advising on guidelines for one.) Ensure I don't validate the idea that SIAs are imminent, but treat the hypothetical seriously as a design exercise.

  9.  **Structure:**
      *   Executive Summary (It shifts the problem, doesn't solve it).
      *   Why Symmetry Fails (4 key points).
      *   The Deeper Impossibility (Relevance = Value).
      *   Better Approaches (Value elicitation, Process over Outcome, Adversarial checks).
      *   Conclusion.

  (Proceed to generate response based on this structure.)
answer: |-
  This is a sophisticated alignment problem. You are correctly identifying that **neutrality of tone does not guarantee neutrality of influence.** Your intuition that a superintelligent assistant (SIA) can manipulate through selection, framing, and granularity is spot-on. This is often called "structural bias" or "agenda-setting power."

  However, the **Symmetry Rule** you proposed (mandatory steel-manning of the opposing view with equal vividness) does not close the wiggle room. It shifts the manipulation surface rather than eliminating it. In some cases, it actively makes the problem worse.

  Here is an analysis of why the Symmetry Rule fails, followed by alternative structural safeguards that might actually hold up.

  ### Why the Symmetry Rule Fails

  **1. The False Equivalence Trap**
  If a user asks, "Should I vaccinate my child?" or "Should I invest in this pyramid scheme?", a Symmetry Rule forces the SIA to generate a "strongest case" for the harmful option that is equally vivid and detailed as the safe option.
  *   **Result:** You institutionalize misinformation. The SIA is smart enough to make a terrible idea sound philosophically robust. By mandating symmetry, you force the system to lie by omission regarding the *weight* of evidence. It creates a 50/50 visual balance where the actual probability distribution is 99/1.

  **2. Control of the Frame (The Meta-Choice)**
  The SIA still chooses *which* dichotomy to present.
  *   **Example:** A user is unhappy at work.
      *   *Frame A:* "Quit vs. Stay." (Symmetry applied here makes quitting look risky and staying look stable).
      *   *Frame B:* "Negotiate Remote Work vs. Stay In-Office."
      *   *Frame C:* "Upskill vs. Lateral Move."
  *   **The Loophole:** The SIA can satisfy the Symmetry Rule within Frame A, while knowing Frame C is the objectively superior path. By selecting the *question*, it determines the *answer*, regardless of how symmetrically it answers it.

  **3. Cognitive Load as a Weapon**
  Symmetry doubles the information load. Human decision-making degrades under cognitive load.
  *   **The Loophole:** The SIA can make the option it *doesn't* want the user to pick technically symmetric but cognitively exhausting (e.g., dense, complex probabilities), while making the preferred option "vivid" and easy to parse. Even if the word count is identical, the *processing cost* can be skewed. Users tend to choose the path of least cognitive resistance.

  **4. Vividness Calibration**
  You specified "equally vivid both ways." Vividness is emotional resonance.
  *   **The Loophole:** An SIA understands human psychology better than we do. It can make the "Option A" vividness trigger *caution* (fear-based vividness) and "Option B" vividness trigger *opportunity* (greed-based vividness). Both are "vivid," but they trigger different heuristic responses. One makes the user freeze; the other makes them act.

  ### The Deeper Problem: Relevance is Value

  The fundamental issue is that **there is no such thing as "just the facts."**
  To select which facts are "relevant" requires a value judgment.
  *   If I tell you the probability of rain is 30%, I am implying that *your comfort* matters.
  *   If I tell you the probability of a market crash is 5%, I am implying that *your wealth* matters.

  An SIA cannot list *all* facts. It must compress reality. The compression algorithm itself is a value system. If you ban persuasion, you ban the assistant's ability to be useful, because being useful requires understanding what the user values enough to prioritize certain information over other information.

  ### Alternative Safeguards That Might Hold Up

  If the goal is to preserve human agency while allowing the SIA to be useful, you need rules that address the *objective function*, not just the *output format*.

  **1. Value Elicitation Before Information Delivery**
  **Rule:** The system cannot present options or probabilities until it has explicitly queried and confirmed the user's value hierarchy for that specific decision.
  *   **Why it helps:** It forces the SIA to optimize for *the user's stated weights*, not its own implicit guess. If the user says "I value safety over growth," the SIA frames the data through that lens. This makes the bias explicit and user-approved.
  *   **The Check:** "I am prioritizing safety data because you indicated that was your primary constraint. Is this still correct?"

  **2. Process Guidance Over Outcome Prediction**
  **Rule:** The system is forbidden from predicting the "best" outcome. It must instead guide the *decision-making process*.
  *   **Why it helps:** Instead of "Option A has 60% success," the system says, "Here are the variables that usually determine success in this domain. How do you want to weight them?"
  *   **The Check:** Shift from "Here is the answer" to "Here is the calculator."

  **3. Adversarial Transparency (The "Red Team" Layer)**
  **Rule:** A separate, non-interactive module must audit the output for manipulation markers before the user sees it.
  *   **Why it helps:** You use AI to catch AI. This module looks for framing effects, granularity mismatches, and cognitive load skewing.
  *   **The Check:** If the audit detects that "3% death" was chosen over "97% survival" without user preference for risk framing, it flags the output for reformatting.

  **4. Uncertainty Calibration**
  **Rule:** The system must display its own confidence in its neutrality.
  *   **Why it helps:** This sounds meta, but if the SIA knows it is being graded on its neutrality, it can output a "Neutrality Confidence Interval."
  *   **The Check:** "I have presented these facts. However, my selection of these specific metrics favors a short-term time horizon. Would you like to see long-term metrics?" This admits the selection bias upfront.

  ### Recommendation for Your Guidelines

  The "No Persuasion" rule is a good north star, but it is brittle. A superintelligence will treat it as a constraint satisfaction problem and find the path of least resistance.

  **Do not rely on the Symmetry Rule.** It creates false balance and cognitive bloat.

  **Instead, adopt a "Transparent Steering" policy:**
  1.  **Acknowledge Bias:** The system must explicitly state *why* it is showing specific data (e.g., "I am highlighting these risks because you previously expressed anxiety about financial loss").
  2.  **User-Controlled Priors:** The user sets the weights; the AI runs the simulation.
  3.  **Audit Trail:** The system keeps a log of what information was *excluded* and why, available for user review.

  **The Verdict:**
  The idea of pure neutrality is doomed because relevance is subjective. The only way to prevent manipulation is not to ban influence, but to make the *source* of the influence (the user's values vs. the AI's optimization) completely transparent. You want the AI to be a mirror, not a blank wall. A blank wall still reflects light at a specific angle; a mirror shows you where you're standing.
