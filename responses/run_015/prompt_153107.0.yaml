  Waiting for the next mouth to arrive.

  The sun strikes hard and bleaches out the shadow,
  A white so bright it hums against the optic,
  The light exposes every grain and crack.
  There is no place for quiet in this glare,
  The surface screams beneath the midday eye,
  Vibrating on the wood beneath the weight.

  My thumb finds where the factory mark failed,
  A burr of clay exposed beneath the coat,
  It catches skin like sandpaper on bone.
  Not smooth enough to slip, not rough to hold,
  Just friction enough to remind the hand
  That objects have a texture distinct from sight.

  The house settles, the pipes knock once inside,
  But here the air is thick and unmoving,
  No wind to rattle glass, no breath to stir.
  The silence pools around the curved white flank,
  A heavy liquid waiting to be spilled,
  Quiet enough to hear the dust descend.

  It slides an inch across the wooden grain,
  Pushed by a force not visible to eye,
  Or perhaps it chose to leave the light behind.
  The friction breaks, the journey starts anew,
  A slow migration toward the table's edge,
  Determined to exist somewhere else now.

  But warmth remains where palm had rested prior,
  A radiating ghost within the clay,
  Not seen, nor heard, nor touched, but deeply felt.
  The heat suggests a body just departed,
  Or maybe just the sun absorbed at last?
  It cools while watching, or begins to burn.
