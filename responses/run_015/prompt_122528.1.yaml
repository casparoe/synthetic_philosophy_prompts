answer: |-
  **Run-of-Show (45 mins)**

  *   **0–5: Setup.** Define preferences as binary relations over states. State the goal: testing coherence, not psychology. **Decline:** Descriptive reasons why cycles happen (framing, etc.); we are doing normative rationality.
  *   **5–15: The Cycle (No Money).** Use **Three Flats** (A, B, C). A > B (quiet), B > C (size), C > A (light). Establish strict preference at each node. **Must-have:** Deterministic outcomes. **Must-not-have:** Any hint of changing tastes or diminishing returns during the sequence.
  *   **15–30: The Pump.** Introduce negligible switching fee ($\epsilon$). Walk the cycle: A $\to$ B $\to$ C $\to$ A. Show net loss ($-3\epsilon$) for identical state.
  *   **30–40: Objections.**
      *   *Finite Horizon/BI:* Address here. Concede that knowing the sequence allows refusal. **Point:** The argument shows preferences *permit* exploitation, not that they *force* it. If you refuse, you are overriding your stated preference at that node.
      *   *Switching Costs:* Address here. Concede high friction blocks the pump. **Point:** The flaw is structural. If *any* $\epsilon$ exists where you swap, you are vulnerable.
  *   **40–45: Conclusion & Check.** Summarize: Cyclic preferences cannot be mapped to a utility function. Ask check question.

  **Misconceptions & Defusal Points**

  *   **"You just changed your mind" (Min 15):** Students will claim preferences shifted during the swap. **Defuse:** Insist preferences are over the *attributes* of the flats, which remain constant. The cycle exists *before* movement starts.
  *   **"This is sunk cost" (Min 20):** They'll argue you swap to justify the previous fee. **Defuse:** The decision at each step is marginal: Is Next Flat + $\epsilon$ better than Current Flat? Previous fees are irrelevant to the local choice.
  *   **"Backward Induction solves it" (Min 35):** (Your member's objection). **Defuse:** Concede BI stops the loss in a *known finite* game. **Damage Control:** This concedes the pump requires naivety or uncertain horizon. **Conclusion Shift:** The argument proves cyclic preferences are *incoherent* (no utility representation), not that you *must* lose money. If you use BI to refuse, you are imposing transitivity on *choices* because your *preferences* fail to guide you.
  *   **"Switching costs protect me" (Min 38):** (Your second member's objection). **Defuse:** Concede practical safety if costs > gaps. **Damage Control:** The normative claim is that *some* fee exists small enough to pump you. Tolerating cycles means accepting potential dominance violations.
  *   **"Never change your mind" (Min 40):** They may think transitivity forbids updating. **Defuse:** Transitivity applies to simultaneous preferences. Updating on new info is different.

  **Check Question**
  "If you refuse the final swap to save money, have you acted rationally despite cyclic preferences, or have you admitted your preferences cannot guide action?"
  *(Target answer: The latter. Refusing implies your preference relation doesn't actually determine choice, violating the definition of rational agency.)*

  **Success Metric**
  They articulate that cyclic preferences prevent constructing a utility function, making "maximization" undefined, rather than just saying "you lose cash."
