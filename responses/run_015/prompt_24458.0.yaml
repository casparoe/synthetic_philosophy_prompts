  *(Self-Correction during drafting)*: I should explicitly name the principle. "The Relevance Principle" or "Domain Relativity." Let's go with **Domain Relativity**. It captures that the *same* trait (e.g., liking someone) can be a bias in one context and a preference in another.

  *(Refining the Worry)*: The worry is that "Preference" is just "Bias I haven't scrutinized." I need to validate that *some* preferences are structurally necessary for a human life (Williams' point).

