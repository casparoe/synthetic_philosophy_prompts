      *   *Bernard Williams' "Integrity" objection:* A life without personal projects/affections is alienated.
      *   *Conclusion:* You need a pluralistic ethics. Some domains demand impartiality (justice, hiring), some demand partiality (love, friendship, taste). The threat is real only if you flatten all domains into one.
