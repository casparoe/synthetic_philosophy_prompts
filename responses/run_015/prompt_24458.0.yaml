      *   *Nuance:* Distinguish between *Moral Status* (intrinsic) and *Moral Duty* (relational).
      *   *Verdict:* Believing the dog *suffers less* is a bias (if false). Believing you have *more duty* to the dog because it's your pet is a preference (special obligation).
