  **Note on Interpretive Choices**

  I leaned heavily on the disquotationalist strand of deflationism (Quine, Ramsey) rather than the minimalist/propositional strand (Horwich), treating "is true" as a syntactic device for disquotation rather than a property denoter. The middle tercets dramatize the Equivalence Schema (*P* iff "P" is true), insisting on the redundancy of the predicate in singular cases.

  The liberty I took is in the quatrain's resolution. Strict deflationism holds that the truth predicate is *only* needed for generalization (blind ascription), not that it fails in singular cases. I framed the ending to suggest the bare sentence (Refrain A) "can't get there" regarding generalization, while Refrain B holds the necessary tool ("is true") even if it remains stuck in a specific instance here. My least confident choice is whether the B-rhymes in the quatrain ("array"/"say") sufficiently signal the logical problem of infinite conjunction without making the poem too technical; I hoped the phrase "bind the whole" would carry the weight of quantification for the philosophers without losing the lay reader.
