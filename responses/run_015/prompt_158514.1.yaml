answer: |-
  To: Program Evaluation Committee
  From: Student Member, Program Evaluation Committee
  Date: December 1, 2023
  Subject: Recommendation for Remaining Program Allocation

  I recommend the committee approve Option A, the mentoring and college-advising program for first-generation seniors, subject to a mandated review of our outcome metric conversions at our March meeting.

  This decision rests on how we resolve the conflict between our efficiency metric (outcome points) and our equity policy. Our current arithmetic favors Option B, yielding 5,700 points compared to Option A's 2,500. However, the equity policy states we should not adopt a program whose gains are too small to matter to the individual student. This policy must function as a viability threshold rather than a weighting factor. If an intervention does not clear the bar of meaningful individual impact, its aggregate sum is irrelevant. Option B's effect—0.6 homework points per term—is universally described by members as negligible to the recipient. Option A's effect—one additional year of postsecondary enrollment—is transformative. Therefore, Option B is ineligible under current policy, leaving Option A as the only compliant choice.

  We must acknowledge the strongest case for Option B. It offers statistical robustness; the effect is distinguishable from zero across every subgroup checked, ensuring reliability. It also addresses a significant equity gap regarding access: the 1,900 students in grades 9 through 11 currently receive nothing from any district program, whereas the seniors in Option A may have other ad-hoc supports. Choosing Option A means denying 1,900 students resources they currently lack, concentrating all remaining capital on a cohort of only 25. From a utilitarian perspective, Option B democratizes support, spreading benefits widely rather than narrowing them. It treats education as a system of marginal gains, where small improvements across a population compound into significant district-wide progress. Rejecting this breadth requires us to accept that helping many people slightly is less valuable than helping a few people profoundly.

  However, the structure of our outcome-points conversion obscures this value judgment. The conversion rates (100 points for a year of enrollment, 5 points for a homework point) imply a linear relationship where 20 homework points equal one year of college enrollment. This is structurally unsound. Educational outcomes are not currency; they are thresholds. A homework point is incremental; enrollment is categorical. By treating them as interchangeable units, we risk validating interventions that move needles on metrics without moving needles on lives. The committee must decide by March whether this conversion model accurately reflects district values or if it incentivizes low-dose, high-scale programs that technically maximize points while violating the spirit of equity.

  To revisit this decision effectively, we require specific data by the March meeting. For Option A, we must measure confirmed postsecondary enrollment status for the 25 participants by August, with interim mentoring engagement metrics reported in March. Furthermore, the committee must vote in March on a definition of "meaningful gain" to operationalize the equity policy. Without a defined threshold, we remain stuck between aggregate efficiency and individual significance. We should also task the statistician with modeling the proposed third route—a higher-dose version of Option B for 400 students. We lack data on whether increased dosage yields linearly improved outcomes or diminishing returns. Until we understand the dose-response structure, we cannot safely trade off depth for breadth.

  Approving Option A now honors our commitment to meaningful change for students facing the highest barriers. It accepts that with limited funds, we cannot help everyone, so we must ensure those we do help are actually changed. But this is not a permanent verdict on scale. By March, we must repair the conversion framework that forced this choice, ensuring future decisions do not require us to choose between mathematical efficiency and human impact.
