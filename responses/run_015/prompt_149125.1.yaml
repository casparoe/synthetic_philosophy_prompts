answer: |-
  Your tutor is giving you the "introductory syllabus" version. The gardener case is the *minimum viable product*, not the full specification. If a theory only handles the gardener, it usually collapses under the weight of the **Proliferation Problem** (if the gardener's not watering caused the death, why didn't the Queen of England's not watering also cause it?).

  Here is the full specification for an adequate theory of causation by omission, broken down by test cases, boundary conditions, empirical constraints, and theoretical tensions.

  ### 1. The Test Suite: Cases the Theory Must Handle
  A robust theory cannot just explain why the plant died. It must navigate these specific scenarios without breaking:

  | Case Type | Scenario | The Challenge |
  | :--- | :--- | :--- |
  | **Classic Agent Omission** | Gardener doesn't water; plant dies. | Must validate intuition that gardener caused death. |
  | **The Proliferation Case** | Queen of England doesn't water; plant dies. | Must **exclude** the Queen as a cause without arbitrary stipulation. |
  | **Collective Omission** | A pit crew fails to change a tire (no single member was assigned). | Must locate causation in the group without a single "omitter." |
  | **Double Omission** | Sensor fails to send signal (omission 1), so Brake fails to engage (omission 2). | Must handle **omission causing omission** without infinite regress. |
  | **Deterministic/Physical** | In a closed physical system, every event is determined by prior positive states. | Must explain how "nothing" (absence of water) exerts influence in a world of positive physical states. |
  | **Non-Agent Systems** | Algorithm fails to flag fraud; Institution fails to regulate. | Must handle omissions where there is no moral agency or "intent" to omit. |

  ### 2. The Boundary Conditions: Distinctions Not to Collapse
  If your theory makes these pairs identical, it is too coarse-grained to be useful.

  *   **Causing vs. Allowing:**
      *   *Causing:* Pushing someone into a river (positive action).
      *   *Allowing:* Watching someone drown when you could save them (omission).
      *   *Requirement:* The theory must explain why we punish these differently legally/morally, even if both are "causes" of death.
  *   **Absence vs. Omission:**
      *   *Absence:* An ontological category (there is no water here).
      *   *Omission:* An action category (the gardener did not water).
      *   *Requirement:* Not all absences are omissions (e.g., the absence of a meteor hitting the plant). The theory must distinguish *relevant* non-events from *background* non-events.
  *   **Negative Causation vs. Correlation:**
      *   *Negative Causation:* The lack of rain *caused* the famine.
      *   *Correlation:* The lack of rain and the famine are both effects of a high-pressure system.
      *   *Requirement:* Must distinguish causal dependency from shared etiology.

  ### 3. Empirical Constraints: What You Can't Contradict
  Metaphysics cannot float free of science. Your theory fails if it demands physics or cognitive architecture that doesn't exist.

  *   **Physics (Conservation Laws):**
      *   *Constraint:* There is no transfer of energy or mass from an absence.
      *   *Implication:* The theory cannot rely on a "process connection" (like Salmon's mark transmission) for omissions. It must admit that omission-causation is metaphysically distinct from positive causation, or redefine physical causation entirely.
  *   **Cognitive Science (Perception):**
      *   *Constraint:* Humans do not have dedicated "absence detectors." We detect absences via **violated expectations** (prediction error).
      *   *Implication:* If the theory requires omissions to be mind-independent objects "out there" waiting to be perceived, it contradicts how we cognize them. This pushes toward a pragmatic or mind-dependent view.
  *   **Neuroscience (Action):**
      *   *Constraint:* "Not acting" is not a specific neural state distinct from "resting."
      *   *Implication:* The theory cannot locate the omission in a specific "inaction neuron." It must locate it in the *counterfactual* capacity to act.

  ### 4. The Impossible Pairs (Incompatible Desiderata)
  You cannot have it all. Most seminars stall because they try to maximize all three of these. You usually have to sacrifice one.

  1.  **Objectivity + Selectivity:**
      *   *Objectivity:* Causation is a mind-independent feature of the world.
      *   *Selectivity:* We can distinguish the *cause* (gardener) from the *background conditions* (Queen of England).
      *   *Conflict:* If causation is purely objective/physical, the Queen is just as much a cause as the gardener (both satisfied the physical conditions for the plant's death). To select the gardener, you need **norms** (expectations), which makes causation mind/norm-dependent.
  2.  **Uniformity + Physicalism:**
      *   *Uniformity:* Positive causation (pushing) and negative causation (not saving) are the same metaphysical relation.
      *   *Physicalism:* Causation requires physical connection/energy transfer.
      *   *Conflict:* Omissions lack physical connection. If you insist on Uniformity, you must abandon Physicalism. If you keep Physicalism, you must admit omissions aren't "real" causation (quasi-causation).
  3.  **Determinism + Counterfactual Dependence:**
      *   *Determinism:* Given prior states and laws, the omission *had* to happen.
      *   *Counterfactuals:* "If the gardener *had* watered..." implies the gardener *could have* watered.
      *   *Conflict:* In a hard deterministic setup, the counterfactual antecedent is impossible. The theory needs a robust account of modality to function here.

  ### 5. The "Killer" Requirement
  Which single requirement does the most damage to the usual suspects?

  **The Requirement: Non-Normative Selectivity.**
  *(The demand that the theory distinguishes the Gardener from the Queen of England without appealing to moral duties, social norms, or expectations.)*

  *   **Damage to Counterfactual-Dependence (Lewis):**
      *   *Why:* Pure counterfactuals fail here. It is true that "If the Queen had watered, the plant would have lived." Therefore, the Queen is a cause. To fix this, Lewisians have to add "normality conditions" or "defaults," which smuggles in norms.
      *   *Verdict:* **Fatal** without modification.
  *   **Damage to Process/Mechanistic Views (Salmon/Dowe):**
      *   *Why:* These theories require physical transmission. Omissions have no physical transmission.
      *   *Verdict:* **Fatal.** They must classify omissions as "quasi-causes" or explain them away entirely.
  *   **Damage to Normative Accounts (Hart & Honoré):**
      *   *Why:* These theories *embrace* norms to solve selectivity (the gardener had a duty, the Queen didn't).
      *   *Verdict:* **Survives Selectivity, dies on Objectivity.** If causation depends on duty, then if we change the law, we change the *physics* of what caused the death. Most metaphysicians find this unacceptable.
  *   **Damage to Interventionism (Woodward):**
      *   *Why:* Interventionism asks: "If we intervened to make the gardener water, would the plant live?" This works. But it struggles with the "Queen" case unless we specify *which* interventions are "serious possibilities."
      *   *Verdict:* **Resilient but costly.** It survives by admitting that causation is relative to a set of modeled variables, not an absolute feature of the universe.

  **Winner:** The **Counterfactual-Dependence View** takes the most damage. It promises a clean, logical account but collapses into absurdity (the Queen caused the death) the moment you apply **Non-Normative Selectivity**.

  ### 6. The "Causal Weakness" Intuition
  *Question:* Does the theory need to explain why omissions feel causally weaker, or is that a bias?

  *   **The Bias View (Pragmatic):** Omissions are metaphysically identical to positive causes. They feel weaker because of **Gricean implicature**. When we say "The gardener caused the death," we imply he *should* have acted. If we drop the norm, the causal strength is identical.
  *   **The Realist View (Metaphysical):** Omissions are genuinely **ontologically lightweight**. Positive causation involves energy transfer (a "push"); omission causation involves the *removal of a preventer*.
  *   **Recommendation:** Do not build "weakness" into the metaphysics. It is better to treat it as a **pragmatic feature of causal explanation**.
      *   *Reasoning:* If you make omissions metaphysically weaker, you struggle to explain why a doctor's omission to save a patient is legally equivalent to killing them in some jurisdictions. Keep the metaphysics binary (Cause/Not Cause) and put the "weakness" in the **moral/legal attribution**.

  ### Summary Specification Table

  | Component | Specification |
  | :--- | :--- |
  | **Core Cases** | Gardener, Queen of England, Collective Failure, Algorithmic Failure, Double Omission. |
  | **Key Distinctions** | Causing vs. Allowing; Absence (state) vs. Omission (action); Negative Causation vs. Correlation. |
  | **Empirical Hard Limits** | No violation of Conservation of Energy; No assumption of direct "absence perception." |
  | **The "Impossible" Trinity** | You can have **Objectivity**, **Selectivity**, and **Uniformity** (positive=negative causation). Pick two. |
  | **The Theory Killer** | **Non-Normative Selectivity.** (Distinguishing causes from background conditions without using norms). |
  | **Causal Weakness** | Treat as **pragmatic/epistemic**, not metaphysical. |

  **Final Advice for the Seminar:**
  If your tutor insists the "Gardener" is enough, ask them: *"Does the Queen of England's failure to water the plant count as a cause in your theory? If yes, how do we avoid causal proliferation? If no, what non-normative feature distinguishes her from the gardener?"* That is the bottleneck where most theories die.
