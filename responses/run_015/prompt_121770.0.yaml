answer: |-
  **Project Title:** Siloed Selves: A Modular Approach to the Absent-Minded Driver

  **Applicant:** [Your Name]
  **Duration:** 3 Months (Half-Time)

  **1. The Research Question**
  Standard decision theory treats the agent as a unified belief box across time. My project asks: **Is it diachronically rational for an execution module to follow a plan when it is architecturally blocked from accessing the evidential basis of that plan?**

  Basically, everyone treats the Absent-Minded Driver as one guy who forgets where he is. I want to model him as two modules: a Planner (who knows the map) and an Executor (who runs on autopilot). The Planner assigns high credence to exiting. The Executor cant see the Planner's reasoning. The question is whether the Executor taking the exit counts as rational action or a kind of structural self-deception.

  **2. The Gap in Standard Decision Theory**
  The literature on the Absent-Minded Driver (Piccione & Rubinstein, etc.) mostly fights over credence assignment. Should the driver believe he's at the first intersection or the second? Solutions usually involve tweaking self-locating beliefs or using causal decision theory with modified consistency constraints.

  But these approaches all assume a single agent who *could* know the state of the world but has imperfect memory. They miss the architectural gap. They assume the information is lost due to noise (forgetting), not design (siloing). If the Executor module literally *cannot* access the Planner's reasoning in real-time, standard updating rules dont apply. The gap here is between *epistemic loss* (forgetting) and *informational encapsulation* (modularity). Current models dont have a place for an agent that is rational precisely because it ignores available evidence. I want to show that standard accounts leave this open because they assume unity of access is a prerequisite for rationality, rather than something that can be strategically suspended.

  **3. Methodology (3 Months, Half-Time)**
  Honestly, three months half-time is tight, so I'm keeping the formalization light and the conceptual work heavy. I'm aiming for ~10 hours a week.

  *   **Month 1: Mapping the Terrain.**
      *   Weeks 1-2: Deep dive into the specific literature on Absent-Minded Driver variants and modular mind theories (Fodor-ish stuff but applied to decision theory).
      *   Weeks 3-4: Drafting the formal setup. I wont build a full new logic system. Just a basic probability model showing the information asymmetry between Planner and Executor.
  *   **Month 2: Stress Testing.**
      *   Weeks 5-6: Running thought experiments. If the Executor ignores the plan, does the system fail? If it follows blindly, is it a zombie? I'll compare this to real-world cases (e.g., implementation intentions in psych).
      *   Weeks 7-8: Writing the core argument. Focusing on the "self-deception" charge. Is hiding reasoning from oneself irrational, or is it efficiency?
  *   **Month 3: Synthesis and Draft.**
      *   Weeks 9-10: Refining the argument based on feedback (if any) or self-review.
      *   Weeks 11-12: Final polish. Getting the paper to a submission-ready state for a workshop or journal.

  **4. Success and Failure Criteria**
  *   **Success:** A complete draft (approx. 6,000 words) that successfully distinguishes "modular ignorance" from "forgetting." Even if I dont solve the normativity question completely, showing that the distinction matters for decision theory counts as a win. Ideally, I demonstrate that modular agents can maximize utility in ways unified agents cant.
  *   **Failure:** The project fails if I get bogged down trying to formalize a new logic system and end up with no philosophical payoff. It also fails if the distinction collapses—i.e., if I prove that modular siloing is just mathematically identical to standard forgetting. If theres no difference, theres no paper.

  **5. Scope Check**
  This is scoped for a semester because I'm avoiding a full axiomatic reconstruction of decision theory. I'm using existing frameworks and just tweaking the information flow.
  *   **What I'll drop if it balloons:** The formal probability model. If the math starts taking more than 20 hours, I'll cut it and rely on conceptual analysis and verbal models. I'll also drop the comparative analysis with psychological implementation intentions if it gets too empirical. The core philosophy is the priority.
  *   **Why it's feasible:** I'm not collecting data. I'm not building a new theory from scratch. I'm re-interpreting an existing problem through a modular lens. That's a classic philosophy move and fits the timeline.

