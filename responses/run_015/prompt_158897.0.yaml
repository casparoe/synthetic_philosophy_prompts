answer: |-
  ### The "Who Exists?" Quiz

  Here are ten situations. For each, pick the answer that matches your gut verdict. Don't overthink it, and don't try to guess which answer is "philosophically correct".

  **1. The Teenage Mother**
  A 14-year-old girl can have a baby now or wait until she is 25. If she waits, she will be richer and more stable, and will conceive a *different* child (because conception happens at a different time). If she has the baby now, the child will have a harder life, but a life that is still worth living. Is it wrong for her to have the baby now?
  *   **A.** Yes, because the child she has now will be worse off than the child she *would* have had.
  *   **B.** Yes, because the world is worse off with a harder-life child in it, even if it's a different child.
  *   **C.** No. The child she has now isn't worse off than *they* would have been otherwise (they wouldn't have existed).
  *   **D.** It depends on how similar the two children would have been.

  **2. The Factory Leak**
  A factory leaks a chemical. The leak causes a delay in production that changes the shift patterns of workers, which changes exactly when they conceive their children. One worker conceives a child who has a birth defect *caused* by the leak. If the leak hadn't happened, that specific child would never have existed, but a different child would have been born healthy. Is the factory liable for the defect?
  *   **A.** Yes, because they made this specific child worse off than they would otherwise be.
  *   **B.** Yes, because they caused a defective child to exist instead of a healthy one.
  *   **C.** No. Without the leak, this child wouldn't exist. Their life is still worth living, so they aren't harmed.
  *   **D.** Yes, but because they broke a safety rule, not because of the harm to the child.

  **3. The Hospital Budget**
  A hospital has enough money for one programme. Programme A cures a painful disease in 100 children who already exist. Programme B funds IVF for 100 couples, resulting in 100 new children who will have very good lives (but wouldn't have existed otherwise). Which should they pick?
  *   **A.** Programme A. Helping existing people matters more than creating new ones.
  *   **B.** Programme B. If the new children's lives are good enough, adding them is better.
  *   **C.** Whichever creates the most total happiness, regardless of who it is.
  *   **D.** You can't compare curing pain with creating life; they are different kinds of good.

  **4. The Flood Defence**
  Your council is planning a flood defence for 50 years' time. Plan A is cheaper but leads to a flood that changes migration patterns, meaning different people are born in the region in 2070. Plan B is expensive and prevents the flood, leading to a different set of people being born. Neither group of future people complains (their lives are fine). Does the council have a duty to pick Plan B?
  *   **A.** No. Neither group of future people is harmed by the choice.
  *   **B.** Yes. We should leave the best possible world for whoever ends up living in it.
  *   **C.** Yes, but only because we should act as if future people matter like existing ones.
  *   **D.** It depends on whether the Plan A people would have existed anyway without the council's intervention.

  **5. The Embryo Choice**
  You are doing IVF. You have two embryos. Embryo A will grow into a person with a very happy life. Embryo B will grow into a person with a slightly happier life. They will be different people. Is there a reason to pick B?
  *   **A.** No. Both will have happy lives; you can't say one person is "better" than another.
  *   **B.** Yes. It is better to create the happier person, even if they are different.
  *   **C.** Yes, but only if Embryo A's life would be miserable.
  *   **D.** No, unless the parents have a specific preference.

  **6. The Crowd**
  You can choose between two futures. Future X has 1 billion people with excellent lives. Future Y has 100 billion people with lives that are just barely worth living (no pain, but very bland). Total happiness is higher in Y. Which is better?
  *   **A.** Future X. Quality matters more than quantity.
  *   **B.** Future Y. More total happiness is better, even if individual lives are bland.
  *   **C.** Neither. We can't compare different populations like this.
  *   **D.** Future X. It's wrong to create people whose lives are only barely worth living.

  **7. The Near-Twin**
  A mother takes a vitamin that changes the exact minute of conception. The child born has a harder life than the child who *would* have been born a month later. However, the alternative child would have had the same parents, the same name, and 95% of the same genetic traits and life path. Does this make the choice worse than in Question 1?
  *   **A.** Yes. It feels much closer to harming the "same" person.
  *   **B.** No. Genetically distinct means a different person, however similar.
  *   **C.** It makes it wrong, but for a different reason (interfering with nature).
  *   **D.** It makes no difference to the ethics, only to our feelings.

  **8. The Baseline**
  When deciding if a policy is wrong because it changes who exists, what do you compare it against?
  *   **A.** What would have happened if I had done nothing at all.
  *   **B.** What would have happened if I had made the best possible choice.
  *   **C.** Whether the people who exist have lives worth living.
  *   **D.** It depends on whether I intended to change who exists.

  **9. The Coin Toss**
  You are about to take a drug. You know there is a 50% chance it will change which child you conceive, and a 50% chance it won't (it just affects the pregnancy). The child conceived either way will have a hard life. Does the uncertainty make it harder to justify taking the drug?
  *   **A.** Yes. Risking harm to a specific potential person is wrong.
  *   **B.** No. As long as the actual child's life is worth living, the risk doesn't matter.
  *   **C.** Yes. We should act on the assumption that identity *might* change.
  *   **D.** No. 50/50 is a guess; ethics needs facts.

  **10. The Million Cuts**
  Option A: One specific child is born with a severe disability (due to identity-changing choices). Option B: One million existing people each lose £10 (same identities). Which is worse?
  *   **A.** Option A. A severe disability is worse than a small financial loss.
  *   **B.** Option B. A million small harms add up to more total suffering.
  *   **C.** Option A. You can't sum up small harms to compare them to a life's shape.
  *   **D.** They are different kinds of badness; you can't compare them.

  ***

  ### Scoring Key

  Count up how many times you picked each letter. Don't worry if you don't have a clear majority; look for the pattern.

  *   **Mostly C's:** You are a **Narrow Person-Affecting** thinker.
  *   **Mostly B's:** You are an **Impersonal Total** thinker.
  *   **Mostly A's (with Q6 = X):** You are an **Average/Quality** thinker.
  *   **Mostly D's:** You are a **Pluralist/Incomparable** thinker.
  *   **Mix of B and C (specifically Q1=C, Q5=B):** You might be **Asymmetric**.
  *   **Specific Q7=A:** You hold a **Similarity-Sensitive** view (often unnamed).

  ***

  ### The Positions

  Here is what your pattern maps to. Each includes the one-line gloss and the "awkward consequence" you'll have to swallow.

  **1. The Narrow View (Mostly C's)**
  *   **Gloss:** An act is only wrong if it makes a specific person worse off than *that same person* would otherwise have been.
  *   **Awkward Consequence:** You cannot say it is wrong for a teenager to have a child she can't support, provided the child's life is still worth living.

  **2. The Impersonal Total View (Mostly B's)**
  *   **Gloss:** Identity doesn't matter; we should simply maximise the total amount of wellbeing in the world, regardless of who holds it.
  *   **Awkward Consequence:** You must accept the "Repugnant Conclusion": a world of billions of people with barely livable lives is better than a world of fewer, very happy people (if the total sum is higher).

  **3. The Average View (Mostly A's, Q6=X)**
  *   **Gloss:** Identity doesn't matter, but we should maximise the *average* quality of life, not the total sum.
  *   **Awkward Consequence:** You might have to conclude that adding a happy person to the world is wrong if their happiness is slightly below the current average.

  **4. The Asymmetric View (Q1=C, Q5=C, Q6=D/X)**
  *   **Gloss:** We have a duty not to create children who will be miserable, but no duty to create children who will be happy.
  *   **Awkward Consequence:** It becomes hard to explain why happiness matters at all if creating it is never a reason to act.

  **5. The Incomparable View (Mostly D's)**
  *   **Gloss:** Outcomes involving different people are fundamentally different kinds of things and cannot be weighed against each other.
  *   **Awkward Consequence:** You lose the ability to make rational decisions about long-term policy, as you can't say one future is "better" than another.

  **6. The Principle View (Mostly D's, specifically Q2/Q4)**
  *   **Gloss:** An act can be wrong because it violates a rule or principle (like fairness), even if no one is made worse off.
  *   **Awkward Consequence:** You have to explain what the principle is without secretly smuggling in "worse off" judgments.

  **7. The Similarity View (Q7=A)**
  *   **Gloss:** Identity matters less if the alternative person would have been genetically and circumstantially very similar to the actual person.
  *   **Awkward Consequence:** There is no clear line for how similar is "similar enough," making the view vague.

  **8. The Risk-Sensitive View (Q9=A/C)**
  *   **Gloss:** The uncertainty about whether identity changes matters morally; we should avoid risks of harming specific people.
  *   **Awkward Consequence:** You might be forced to avoid beneficial actions just because there is a tiny chance they alter who exists.

  ***

  ### The Empty Seats

  You asked which combinations of answers nobody actually holds. In building this key, three profiles emerged as logically empty.

  **1. The "Narrow Repugnant" (Q1=C + Q6=Future Y)**
  *   **The Combo:** Believing identity matters (so the teenager isn't harming her child) BUT believing we should maximise total numbers regardless of quality (the bland billions).
  *   **Why it's empty:** **Incoherent.** If you believe identity matters (Narrow), you generally believe we only owe duties to specific people. Specific people in the "bland billions" scenario would arguably prefer the "excellent lives" scenario. Holding both views requires you to treat people as interchangeable vessels for the Total view, but unique individuals for the Narrow view.
  *   **Status:** Logically impossible to hold consistently.

  **2. The "Incomparable Aggregator" (Q10=B + Q3=D)**
  *   **The Combo:** Believing you *can* sum up small harms across a million people (Aggregation) but believing you *cannot* compare curing existing children vs. creating new ones (Incomparability).
  *   **Why it's empty:** **Unattractive.** If you have a method to sum up harms across a million people (to answer Q10), you have a "common currency" of value. If you have a common currency, you can theoretically compare the hospital programmes in Q3. Denying one while accepting the other looks like special pleading.
  *   **Status:** Unexplored, likely because it collapses under scrutiny.

  **3. The "Baseline Absolutist" (Q8=A + Q4=B)**
  *   **The Combo:** Believing we must compare actions to "doing nothing" (Q8=A) but also believing we have a duty to pick the "best possible plan" for the future (Q4=B).
  *   **Why it's empty:** **Incoherent.** "Doing nothing" (Baseline) and "Best possible plan" (Ideal) are opposite ends of the spectrum. If the duty is to do the best possible (B), the baseline of inaction is irrelevant. If the duty is to not worsen the baseline (A), you don't need to find the best plan, just a non-harmful one.
  *   **Status:** Incoherent.

  ***

  ### The Blind Spots

  You also asked where this quiz fudges it. I can't separate these pairs cleanly, no matter how clever the questions get.

  **1. Impersonal Total vs. The Principle View**
  *   **The Problem:** Both will tell you the factory leak (Q2) and the teenager (Q1) are "Wrong". The Totalist says "because the outcome is worse". The Principle theorist says "because it violates a norm".
  *   **The Blur:** In a quiz format, their verdicts look identical. You can only separate them by asking "Why?", which invites theory-speak you wanted to avoid.

  **2. Average vs. Asymmetric**
  *   **The Problem:** Both tend to reject the "Repugnant Conclusion" (Q6). Both might say "Don't have the baby if life is hard" (Q1).
  *   **The Blur:** They diverge on whether adding a *very* happy person is good. The Average view says "Yes, if it raises the average". The Asymmetric view says "No, it's neutral". But in real-life cases, lives are rarely "very happy" in a way that shifts averages noticeably, so their practical advice often overlaps.

  **3. Similarity View vs. Narrow View**
  *   **The Problem:** The Similarity View (Q7) is usually just a softened Narrow View.
  *   **The Blur:** If you say similarity matters "a bit", you are essentially admitting the Narrow View is false but keeping it as a heuristic. There is no formal theory for "95% similarity counts as half a person", so this position often collapses into one of the others when pressed.

  **Final Note:** If your group is still arguing after this, check Q8 (Baseline). That is the most common hidden disagreement. One of you is comparing the policy to "inaction", the other is comparing it to "the ideal". You aren't disagreeing on ethics; you're disagreeing on the yardstick.
