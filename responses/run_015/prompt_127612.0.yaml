answer: |-
  This is a sophisticated objection that cuts to the heart of how expressivist semantics interfaces with the philosophy of action and time. You are asking whether the *diachronic* dimension of agency exposes a fissure in the expressivist solution to the Frege-Geach (F-G) problem.

  The short answer is that while your intuition identifies a genuine tension, it does not resurrect the logical Frege-Geach problem. Instead, it shifts the burden to a problem of **diachronic rationality** and **normative persistence**. Gibbard's framework (particularly in *Thinking How to Live*) is well-equipped to handle the semantic embedding without requiring a metaphysical theory of personal identity, provided we understand the "unity" of the agent as practical rather than ontological.

  Here is a detailed breakdown of why the difficulty is largely apparent regarding logic, but genuine regarding practical authority.

  ### 1. Distinguishing Semantic Embedding from Diachronic Authority

  To evaluate whether F-G returns, we must distinguish two distinct problems:
  1.  **The Semantic/Logical Problem (F-G):** How can moral sentences function in unasserted contexts (like conditionals) to preserve validity if they merely express attitudes?
  2.  **The Diachronic Problem:** How can a past attitude exert normative force on a present agent if the attitude no longer exists?

  Your scenario involves a conditional: *"If N was the correct norm to accept in 2018, then A is obligatory."*
  *   **For F-G:** The expressivist must show that the logical relation between the antecedent and consequent is preserved by the relations between the *current* attitudes expressed by the whole sentence.
  *   **For Diachronic Authority:** The expressivist must explain why the 2025 agent should care about the 2018 norm.

  The F-G problem is solved if the 2025 agent can express a coherent state of mind that accepts the conditional. It does **not** require the 2018 attitude to be psychologically present in 2025. It only requires that the 2025 agent can have an attitude *about* the 2018 norm.

  ### 2. Gibbard on Tense and Past Norms

  Gibbard's later work (specifically *Thinking How to Live*) refines expressivism into a **plan-based semantics**. To judge that "Action X was obligatory in 2018" is not to re-enact the 2018 feeling. It is to **now** accept a norm that condemns/requires the past action.

  *   **The Semantics:** When the 2025 agent asserts the antecedent ("N was correct in 2018"), they are expressing a *present* normative attitude toward a past object. They are planning to hold their past self to a standard.
  *   **The Embedding:** When the agent asserts the conditional ("If N was correct..."), they are expressing a higher-order plan: a plan to rule out the combination of (accepting that N was correct) and (not doing A).

  Because both the evaluation of the past norm and the conditional link are expressed by **present** attitudes of the 2025 agent, the logical link is not severed by time. The "inferential link" exists within the 2025 cognitive/normative architecture. The agent is not reasoning *from* a 2018 attitude; they are reasoning *about* it from a 2025 standpoint. Therefore, the logical consistency required to solve F-G remains synchronic (within the 2025 mind), even if the content is diachronic.

  ### 3. The Unity of the Agent: Practical vs. Metaphysical

  You ask if resolving this requires an independent theory of personal identity. For an expressivist, the answer is **no**.

  Expressivism is a thesis about the *function* of moral language, not the metaphysics of the speaker. Gibbard treats the agent as a **planning system**.
  *   **Practical Identity:** The "unity" of the agent over time is constituted by the continuity of planning. To be an agent *just is* to treat one's past plans as presumptively binding and one's future actions as settled by present plans.
  *   **No Metaphysics Needed:** We do not need to know *why* 2018-You is the same substance as 2025-You. We only need to acknowledge that 2025-You treats 2018-You's commitments as relevant data for current planning.

  If the 2025 agent asks, "Why should I follow N?" they are engaging in a first-order normative inquiry, not a semantic one. If they decide N is no longer valid, they reject the antecedent. If they accept the antecedent, they are bound by the consequent. The *logic* holds regardless of whether the normative force is justified. Thus, expressivism does not need a metaphysical theory of persistence; it needs a **theory of rational planning**, which Gibbard provides.

  ### 4. Is this a New F-G Variant or a Persistence Challenge?

  This is the crucial classification. It is **not** a new variant of the Frege-Geach problem.
  *   **F-G** is about how moral sentences have **meaning** in complex structures.
  *   **Your Challenge** is about how past commitments retain **authority**.

  If the 2025 agent says, "If N was correct, then A is obligatory," and then accepts "N was correct" but denies "A is obligatory," they are logically inconsistent *now*. The F-G problem is solved because the inconsistency is located in the 2025 attitude set.

  However, you have identified a genuine **Diachronic Rationality Problem** (sometimes discussed in the context of Michael Bratman's planning theory). The challenge is: *What makes the 2025 agent's endorsement of the 2018 norm rational?*
  *   If expressivism says moral judgments are just expressions of attitude, what prevents the 2025 agent from simply shedding the 2018 attitude without reason?
  *   This is not a failure of logic (F-G); it is a potential failure of **normative stability**.

  ### 5. Conclusion: The Difficulty is Apparent regarding Logic, Genuine regarding Rationality

  To summarize the answers to your specific questions:

  1.  **Does F-G return?** No. The logical relations are preserved because the 2025 agent expresses a *current* attitude about the past norm. The embedding is handled by the 2025 cognitive state.
  2.  **Is the difficulty merely apparent?** It is apparent regarding *logic/semantics*, but genuine regarding *practical rationality*. The gap doesn't break the logic, but it does raise the question of why the past self binds the present self.
  3.  **Does Gibbard treat stages as a unified subject?** Yes, but functionally, not metaphysically. The agent is unified by the activity of planning, which inherently spans time.
  4.  **Does it require a theory of personal identity?** No. It requires a theory of **diachronic agency**. The "identity" is constituted by the normative relations the agent acknowledges between their temporal stages.
  5.  **New F-G or Persistence Challenge?** It is a **Persistence Challenge**. It belongs to the family of problems concerning *akrasia*, resolution, and the binding nature of past plans, rather than the semantic problem of embedding.

  **Final Verdict:** The expressivist can maintain that the conditional is meaningful and logically valid because the 2025 agent expresses a coherent plan to link past norms to present actions. The worry that the "inferential link is severed" confuses the *causal history* of the attitude (which is in the past) with the *logical structure* of the current judgment (which is present). The challenge that remains is not explaining the meaning of the sentence, but justifying the normative authority of the past self—a challenge that faces cognitivist and non-cognitivist theories alike.
