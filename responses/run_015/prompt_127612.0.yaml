prompt: |-
  Since expressivists typically resolve the Frege-Geach problem by treating moral judgments as expressions of norm-acceptance that can stand in logical and inferential relations without being assigned descriptive truth-conditions, I have been considering whether that resolution extends to what might be called cross-temporal normative embedding. Imagine an agent who in 2018 accepted a norm N, and who in 2025 evaluates the conditional: "If N was the correct norm to accept in 2018, then my present action A is obligatory." The embedded clause seems to express a past normative commitment, while the conditional as a whole expresses a present practical stance. Because standard accounts of this solution require that the attitudes expressed in premise and conclusion be simultaneously available within a single reasoning agent, it appears that the temporal gap between the embedded commitment and the present evaluation severs the inferential link that was supposed to preserve logical consistency. Does this show that the Frege-Geach problem returns for any diachronic moral agent, or is the difficulty merely apparent? Specifically, does Gibbard's norm-expressivist framework already treat past and present stages of an agent as a unified normative subject, or would resolving this require supplementing expressivism with an independent theory of personal identity over time? And if the problem is genuine, should we regard it as a new variant of the original embedding difficulty, or as a separate challenge about the persistence of non-cognitive attitudes?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Expressivism (specifically normative expressivism, likely Gibbardian) and the Frege-Geach (F-G) problem.
      *   **Specific Problem:** "Cross-temporal normative embedding."
      *   **Scenario:** An agent in 2018 accepts norm $N$. In 2025, they evaluate: "If $N$ was the correct norm to accept in 2018, then my present action $A$ is obligatory."
      *   **The Worry:** Standard expressivist solutions to F-G rely on attitudes being simultaneously available for logical consistency (e.g., avoiding inconsistency between believing $P$, believing $If P then Q$, and not believing $Q$). The temporal gap (2018 vs. 2025) might sever this link.
      *   **Key Questions:**
          1.  Does this show F-G returns for diachronic agents?
          2.  Is the difficulty merely apparent?
          3.  Does Gibbard's framework treat past/present stages as a unified subject?
          4.  Does this require a theory of personal identity?
          5.  Is this a new F-G variant or a separate challenge about attitude persistence?

  2.  **Analyze the Philosophical Landscape:**

      *   **Expressivism & F-G:** The classic F-G problem is about how moral sentences in unasserted contexts (conditionals, negations, questions) can have meaning if their primary function is expressing non-cognitive attitudes. Expressivists (Blackburn, Gibbard) solve this by positing higher-order attitudes or norms about attitudes (e.g., accepting a norm that forbids accepting $P$ and $If P then Q$ without accepting $Q$).
      *   **Diachronic Rationality:** Rationality isn't just synchronic (at one time). It's also diachronic (across time). Plans and norms are inherently future-directed, but they also bind past commitments.
      *   **Gibbard's Framework:** Gibbard (in *Wise Choices, Apt Feelings* and *Thinking How to Live*) focuses on *planning*. Norms are plans. A plan is valid if it survives reflection. Crucially, Gibbard treats the agent as a "planner" across time.
      *   **The "Temporal Gap" Issue:** The user suggests that because the 2018 attitude is *past*, it's not currently "expressed" in the same way, so how can it enter into a logical relation with a 2025 attitude?
      *   **Counter-argument:** When I say "If I ought to have done X yesterday, I ought to do Y today," I am not expressing the 2018 attitude *now*. I am expressing a *current* attitude *about* the 2018 attitude. The content is about the past, but the expression is present.

  3.  **Address the Specific Questions:**

      *   **Q1: Does F-G return?**
          *   *Analysis:* Not exactly. F-G is about logical syntax and semantic content. The diachronic issue is about the *stability* or *authority* of past attitudes. The logical form "If P then Q" works the same way regardless of tense. The expressivist needs to explain what attitude is expressed by "N was correct in 2018."
          *   *Verdict:* It's not a *logical* embedding problem (syntax/semantics), but a *diachronic rationality* problem.

      *   **Q2: Is the difficulty apparent?**
          *   *Analysis:* Yes, largely. The embedded clause "N was correct in 2018" is evaluated from the 2025 perspective. The 2025 agent expresses a *current* acceptance of a norm that validates the past norm.
          *   *Nuance:* However, if the 2025 agent *rejects* N now, can they still validly reason from it? Yes, conditionally. "If I was right then, I must do this now." This doesn't require currently accepting N, only accepting the conditional link.

      *   **Q3: Gibbard on Unified Subject?**
          *   *Analysis:* Gibbard's planning theory inherently spans time. To plan is to settle for the future. To be rational is to maintain coherence across time. He doesn't need a metaphysical theory of personal identity; he needs a *practical* theory of agency. The "agent" is the locus of planning.
          *   *Key Concept:* "Hyperplan" or the system of norms. The system exists *now* and includes judgments about past norms.

      *   **Q4: Theory of Personal Identity?**
          *   *Analysis:* No. Expressivism is practical, not metaphysical. We don't need to know *why* 2018-Me is 2025-Me ontologically; we just need to know that 2025-Me treats 2018-Me's plans as binding (or revisable).
          *   *Reference:* Parfit's reductionism might be relevant, but expressivists usually bypass metaphysics.

      *   **Q5: New F-G Variant or Attitude Persistence?**
          *   *Analysis:* It's closer to the problem of *akrasia* or *diachronic rationality* (Bratman's planning theory) than F-G. F-G is about truth-conditions vs. expression in logic. This is about the *normative force* of past expressions over present actions.
          *   *Label:* "Diachronic Consistency Problem" or "Problem of Normative Persistence."

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the query. It touches on the intersection of metaethics and philosophy of action/time.
      *   *Section 1: Diagnosing the Problem.* Distinguish between the *semantic* F-G problem (logic of unasserted contexts) and the *diachronic* problem (authority of past selves). The user's scenario is technically a semantic embedding (a conditional), but the worry is about the *attitude* availability.
      *   *Section 2: The Expressivist Solution to Tense.* How does Gibbard handle past tense? "It was wrong" = I now accept a norm that condemns the past act. It's a present attitude about a past object. Therefore, the 2025 agent *can* embed it because they are expressing a 2025 attitude about 2018.
      *   *Section 3: Gibbard and the Unified Agent.* Gibbard doesn't rely on metaphysical identity. He relies on *planning*. A plan is a state that persists. Rationality requires coherence between past plans and present actions (unless there's a reason to revise).
      *   *Section 4: Is it F-G or Persistence?* Argue it's the latter. F-G is solved if the logic holds. The worry here is "Why should I care about 2018-Me?" That's a question of practical rationality, not semantic logic.
      *   *Section 5: Conclusion.* Summarize. The problem is apparent regarding logic, but genuine regarding diachronic authority. No extra metaphysics needed, just a robust theory of planning agency.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to dismiss the user's insight. There *is* a tension. If expressivism says moral judgments *are* attitudes, and the 2018 attitude is gone, how can it be the antecedent?
      *   *Response:* The antecedent isn't the *attitude itself*; it's the *content* of the attitude (the norm's correctness). The 2025 agent expresses an attitude *towards the proposition that the 2018 norm was correct*.
      *   *Gibbard's Specific View:* Gibbard moves towards "normative concepts" as concepts of *what to do*. "Ought" is about settling. "I ought to have done X" means "I now settle that X was to be done." This makes the past judgment fully accessible to the present agent without needing the past attitude to exist *now*.
      *   *Personal Identity:* Explicitly state that expressivists generally avoid metaphysical commitments here. The "unity" is practical, not ontological.

  6.  **Final Polish:** Ensure tone is academic, precise, and directly answers the specific sub-questions. (Check: Did I address Bratman? Maybe mention him as a complement to Gibbard on planning.) (Check: Did I distinguish between the logical form and the normative force? Yes, crucial distinction.)

  7.  **Final Output Structure:**
      *   Introduction: Validate the insight.
      *   Distinguishing Semantic vs. Diachronic problems.
      *   Gibbard's handling of tense (Present attitude about past norms).
      *   The Unity of Agency (Planning vs. Metaphysics).
      *   Classification (F-G variant vs. Persistence).
      *   Conclusion.

  *(Self-Correction during final review)*: Make sure to emphasize that the Frege-Geach problem is primarily about *logic* (validity), whereas the user's worry is about the *psychological availability* of the attitude. Expressivism solves logic by defining validity in terms of attitude inconsistency. The question is: Can I be inconsistent with a past attitude? Gibbard says rationality is about the *current* system of norms. If my current system says "Past Norm N was correct," then I am bound. If my current system says "Past Norm N was wrong," I am not bound, but I can still reason conditionally. The logical link holds regardless of the temporal gap because the *current* system houses both the conditional and the evaluation of the past.

