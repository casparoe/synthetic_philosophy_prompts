  **Project Title:** The Phenomenological Condition of Organic Unity in Moore's *Principia Ethica*

  **Project Summary**
  G. E. Moore's *Principia Ethica* remains a foundational text for non-naturalist metaethics, primarily due to its formulation of the principle of organic unity. This principle asserts that the intrinsic value of a whole is not necessarily identical to the sum of the values of its parts. Moore identifies two paradigmatic instances of such valuable wholes: the appreciation of beautiful objects, constituting aesthetic experience, and the pleasures of human intercourse, constituting personal friendship. While standard commentary acknowledges these categories as the highest goods within Moore's system, interpretations typically treat them as distinct domains—aesthetic value versus ethical value—without interrogating the structural conditions that allow them to function as organic unities. This project proposes that there is an unstated structural assumption linking these examples: that for a complex to exhibit non-additive value, its constituent experiences or relations must be unified within a single conscious perspective over time.

  **Research Question**
  The central research question driving this inquiry is: Does the structural integrity of Moore's account of organic unity necessitate that the constituents of a valuable whole be unified within a single conscious subject? This question admits a determinate answer. Either the text supports the claim that cross-subjective or distributed unities are excluded from intrinsic value, or it permits valuable wholes that transcend individual consciousness. Resolving this is critical because if the single-subject condition is essential, then collective practices—such as collaborative artworks or communal rituals—are excluded from Moore's category of intrinsic goods. Conversely, if the condition is not essential, Moore's specific remarks on personal affection require revision to accommodate relational dynamics that are not reducible to individual mental states.

  **Literature and Gap**
  Existing scholarship on Moore generally focuses on the open question argument or the definition of good. When addressing organic unity, commentators often analyze the aesthetic examples separately from the ethical remarks on friendship. Those who do connect them typically assume the unity is metaphysical rather than phenomenological. Consequently, the role of consciousness as the binding agent of the valuable whole remains under-theorized. This project fills that gap by arguing that the coherence of Moore's examples depends on a phenomenological constraint that standard interpretations overlook. By exposing this constraint, the project challenges the applicability of Moore's value theory to intersubjective or collective phenomena.

  **Methodology**
  The semester will be divided into three distinct phases. The first phase involves a close textual reconstruction of Moore's arguments regarding parts, wholes, and consciousness. This requires isolating every instance where Moore describes the relation between the object of appreciation and the conscious state appreciating it. The goal is to formalize the necessary conditions for a whole to possess intrinsic value greater than its parts. The second phase constructs an extension of this framework to distributed cases. I will formulate a model of collaborative aesthetic practice where the value depends on sustained interaction among multiple agents. This model will serve as a test case to determine if Moore's criteria can be met without a single subject. The third phase tests this extension against Moore's explicit commitments about personal relations. I will analyze whether friendship, in Moore's view, is constituted by reciprocal individual states or a shared relational reality. If the latter, does it violate the single-subject condition derived in phase one?

  **Outcomes and Evaluation**
  A successful result will demonstrate either that Moore's framework implicitly excludes distributed value, thereby limiting its scope, or that his framework can be consistently extended to include collective unities without contradicting his explicit commitments. Success is defined by producing a coherent argument that resolves the tension between the single-subject requirement and the relational nature of friendship. A failure would consist in finding that the textual evidence is too ambiguous to support a determinate conclusion regarding the role of consciousness, or that the proposed extension creates insurmountable contradictions with Moore's non-naturalist ontology. Specifically, if the reconstruction shows that Moore relies on consciousness for unity but also insists friendship is intrinsic despite being relational, the project would demonstrate an inconsistency in *Principia Ethica*.

  **Scope and Contingencies**
  The primary risk to this project is the complexity of reconstructing Moore's mereology of value within a single semester. If time runs short, the section on collaborative aesthetic practices will be dropped. In this contingency, the project will focus exclusively on the internal consistency of Moore's remarks on friendship and aesthetic appreciation as individual experiences. This reduced scope ensures that the core question regarding the single-subject condition is still addressed, even if the application to collective art is omitted. The final deliverable will be a research paper of approximately twenty pages suitable for submission to a graduate journal or presentation at a student conference. The work will remain strictly textual and analytical, avoiding empirical claims about psychology, to ensure feasibility within the allotted timeframe. Priority will be given to the chapters concerning ideal utilitarianism and the concept of isolation, as these contain the densest arguments regarding organic unity.
