answer: |-
  This is a **Normative Disagreement about Moral Replaceability**, specifically manifesting as a conflict between a *Total Utilitarian* view of ecological states and a *Person-Affecting* constraint on transitional harm. It is not a hidden factual disagreement, nor is it primarily about intuitions of naturalness. The stalemate persists because both sides are using empirical data to adjudicate a question that is fundamentally about the moral permissibility of swapping existing populations for potential ones.

  Here is the diagnosis, defense, and assessment of resolvability.

  ### 1. The Diagnosis: The Non-Identity Problem in Ecology
  The core friction is not about trophic efficiency or turnover rates; it is about whether the animals in the "successional relief" scenario are morally interchangeable with the animals in the "disturbance stressor" scenario.

  *   **Side A (Successional Relief)** operates on a **Total View**. They treat the ecosystem as a vessel for utility units. If State B (pioneer community) contains fewer units of suffering than State A (primary forest) over time $t$, the transition is justified. They implicitly accept that killing or displacing the occupants of State A is permissible if it brings into existence the occupants of State B, whose aggregate lives are less suffering-heavy.
  *   **Side B (Disturbance Stressors)** operates on a **Person-Affecting View** (or a prioritarian constraint). They focus on the specific individuals subjected to the destruction event. For Side B, the suffering inflicted on the *existing* primary forest occupants during destruction and fragmentation is not offset by the "non-suffering" of the pioneer animals who would not have existed otherwise. The transition costs are not just empirical variables to be summed; they are moral veto points.

  ### 2. Defense of the Diagnosis
  You asked for explicit reference to replacement, temporal discounting, and pioneer-community suffering. The normative split is visible in how each side handles these three variables:

  **A. Treatment of Replacement**
  *   **Side A** treats replacement as **fungible**. To them, "reducing net suffering" justifies the replacement of one community by another. The death of a primary forest predator is a negative value, but it is cancellable by the prevented birth/suffering of future predator-prey dyads in the stable primary state.
  *   **Side B** treats replacement as **harm**. They do not view the pioneer community as a "replacement" that cancels out the loss of the primary community. Instead, they view the destruction as an active harm inflicted on identifiable subjects (the current population), whereas the benefit accrues to non-identifiable subjects (the future pioneer population). The empirical data on turnover is identical, but Side B weights the *loss* of existing welfare capacities higher than the *gain* of future welfare capacities.

  **B. Temporal Discounting of Transitional Lives**
  *   **Side A** applies a **low discount rate to the transition phase**. They view the "unstable ecological window" as a short-term cost amortized over the long-term stability of the pioneer community. Their models implicitly assume the transition is a bounded event.
  *   **Side B** applies a **high discount rate (or lexical priority) to the transition phase**. They argue that the "unstable window" is not merely a short-term cost but a period of intensified, chronic suffering (fragmentation, disease) that carries a higher moral weight than steady-state suffering. This is not an empirical claim about intensity alone; it is a normative claim that *acute, human-caused transition suffering* cannot be traded off against *chronic, natural steady-state suffering*.

  **C. Moral Status of Pioneer-Community Suffering**
  *   **Side A** assumes pioneer suffering is **quantitatively lower**. They rely on the ecological generalization that $r$-selected pioneer species have shorter lifespans and less complex social structures, implying less aggregate suffering per unit biomass.
  *   **Side B** assumes pioneer suffering is **qualitatively distinct**. They argue that stressors like "invasive-mediated disease" and "chronic malnutrition" represent a type of suffering (security violation, physiological distress) that is morally worse than the "high-intensity predator-prey dynamics" of the primary forest. This is a hidden normative claim about the *quality* of suffering, not just the quantity. Side B implies that suffering caused by ecological collapse (anthropogenic or otherwise) is weightier than suffering inherent in a stable evolutionary equilibrium.

  ### 3. Resolvability: The Honest Assessment
  **No empirical finding, formal welfare-accounting model, or conceptual distinction within the current framing can resolve this dispute.**

  *   **Empirical Findings:** You already noted they cite overlapping meta-analyses. Even if you produced a perfect calorimetric map of suffering per hectare, Side A would sum it over 100 years to show a net gain, and Side B would sum the transition spike to show a net violation. The data enters the equation differently because the *moral weighting functions* differ.
  *   **Formal Models:** A welfare model requires a normative axiology to function. If you build a model that weights existing lives heavier than potential lives, Side B wins. If you build a model that maximizes aggregate welfare regardless of identity, Side A wins. The model does not resolve the dispute; it codifies one side's premise.
  *   **Conceptual Distinctions:** Distinguishing "natural" vs. "unnatural" suffering fails because Side A argues that *allowing* high-suffering natural states to persist is itself a form of non-interference bias.

  **The framing question is ill-posed.**
  The question "Does large-scale habitat destruction reduce net wild-animal suffering?" presupposes that "net suffering" is the sole metric of moral value in ecological engineering. It ignores the *rights of existing occupants* not to be destroyed for the benefit of future occupants. It treats the destruction of a habitat as a neutral variable in an equation, rather than a moral event with deontological constraints.

  ### 4. Recommendation: The Reframed Question
  As a doctoral student, your contribution should not be to solve the calculation but to dissolve the frame. Abandon the question of whether destruction *reduces* suffering. Instead, adopt a **Constraint-Based Intervention Ethics**.

  The productive question is: *"Under what conditions, if any, does the reduction of future aggregate suffering justify the infliction of transition harm on existing ecological communities?"*

  This shifts the burden of proof. It forces Side A to defend the permissibility of the replacement (addressing the Non-Identity Problem) rather than merely asserting the arithmetic of the outcome. It forces Side B to specify whether their objection is absolute (deontological) or scalar (prioritarian). Until the debate moves from "Who has the better spreadsheet?" to "What are the constraints on ecological swapping?", the standstill will remain.
