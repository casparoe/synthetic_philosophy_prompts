      *   *Potential Issue:* Is it judging "my failure to feel"? Or is it judging "the agent's excess"? Smith usually focuses on the agent's propriety. However, in the context of *mutual* sympathy, the agent also judges the spectator's ability to sympathize. The user's twist is that the *internalized* spectator judges *my* capacity to sympathize with others. This leans into TMS Part III (Conscience).
