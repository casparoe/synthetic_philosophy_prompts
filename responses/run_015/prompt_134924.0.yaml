      *   **Topic:** Adam Smith's *Theory of Moral Sentiments* (TMS), specifically the mechanism of "sympathy."
      *   **Core Claim 1:** Sympathy is not emotional mirroring but a "conditional reconstruction" based on the cause/situation (mediated by a counterfactual self).
