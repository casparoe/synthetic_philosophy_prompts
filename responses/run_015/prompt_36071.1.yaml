answer: |-
  ### Introduction: Reconstructing Rules from Intuition
  G. E. Moore's *Principia Ethica* famously rejects utilitarian calculation and rule-based derivation in favor of "self-evident" intuitions regarding intrinsic value. He insists that we simply "see" that certain wholes are good. However, to analyze his verdicts in Chapter VI systematically, we must reconstruct the tacit principles that generate his intuitions. Based on your catalogued verdicts (1–5), two overarching interpretive principles emerge that fit his track record equally well, though they diverge on edge cases.

  For the purpose of this analysis, I will apply two candidate rules derived from the track record to each of your three new cases.
  *   **Rule 1 (The Veridical Constraint):** The intrinsic value of a state of consciousness is positively correlated with the truth of its cognitive content and the actual value of its object. (Derived from Verdicts 3 & 4: "real" beauty and "true" beliefs maximize value).
  *   **Rule 2 (The Attitudinal Primacy):** The intrinsic value resides primarily in the quality of the emotional attitude itself, provided it is not directed at something intrinsically evil, regardless of the object's actual properties. (Derived from Verdict 1: Value lies in the *consciousness*, not the object; and Verdict 3: Emotion appropriate to the object is key).

  ---

  ### Case (a): The Woman and the Android
  **Scenario:** A decade of devotion based on false beliefs (the companion has no mind), though emotions are appropriate to the *believed* object.

  *   **Moore's Predicted Verdict:** The state of consciousness possesses significant positive value, but the *whole situation* (including the falsehood) is less valuable than a corresponding case of true affection. It is not a "Great Good" in the highest sense, but it is not worthless.
  *   **Rule Predictions:**
      *   **Rule 1 (Veridical):** Predicts **Low Value**. Since the beliefs are entirely false and the object (a persona) lacks the inner life required for personal affection (Verdict 4), the necessary conditions for the "Great Good" of affection are missing.
      *   **Rule 2 (Attitudinal):** Predicts **High Value**. The woman's mental life matches the "Great Good" of personal affection (love, cherishing). The value lies in her consciousness, which is intact.
  *   **Best Guess & Reasons:** Moore explicitly addresses this in *Principia Ethica* (§114). He argues that while the *existence* of the false belief is an evil (or a defect), the *state of mind* (the love itself) remains good. However, because the "Ideal" requires the appreciation of *what is good*, and a mindless persona is not a proper object of personal affection, the *organic unity* of the whole is diminished. Thus, the value is real but inferior to the veridical case.
  *   **Splitter Case:** **The Benevolent Delusion.** A person feels profound love for a vicious tyrant, believing him to be a saint.
      *   *Why it splits:* Rule 2 (Attitudinal) might still assign value to the love itself. Rule 1 (Veridical) combined with Verdict 4 (affection must be directed at *good* qualities) would deem this bad or worthless, as the object is evil. This forces a choice between the quality of the emotion and the moral status of the object.

  ### Case (b): The Deluded Connoisseur
  **Scenario:** Aesthetic appreciation directed at worthless trinkets believed to be beautiful.

  *   **Moore's Predicted Verdict:** Slight positive value, but significantly less than genuine aesthetic appreciation. The mental state is admirable, but it is not strictly "appreciation of beauty."
  *   **Rule Predictions:**
      *   **Rule 1 (Veridical):** Predicts **Very Little Value**. Verdict 3 specifies "cognition of qualities that *really are* beautiful." If the objects are stipulated as worthless, the cognitive relation is false, collapsing the value toward that of mere sense-pleasure (Verdict 2).
      *   **Rule 2 (Attitudinal):** Predicts **High Value**. The connoisseur's mental state (attention, discrimination, feeling) is identical to the "Great Good" of aesthetic appreciation. Since Verdict 1 locates value in the consciousness, the object's actual status should matter less.
  *   **Best Guess & Reasons:** Moore distinguishes between the *beauty* of the object (little value without mind) and the *consciousness* of beauty (great value). However, he insists it must be consciousness *of beauty*. If the object is not beautiful, the state is not "consciousness of beauty" but "consciousness of trinkets." Therefore, it fails the specific description of the Great Good in Verdict 3. It retains the value of a refined mental state but loses the specific value of aesthetic appreciation.
  *   **Splitter Case:** **The Ugly Masterpiece.** A critic correctly identifies a work as *ugly* but feels a complex, appropriate admiration for its technical failure.
      *   *Why it splits:* Rule 1 (Veridical) says the belief is true (it is ugly), so it has cognitive merit. Rule 2 (Attitudinal) asks if "admiration for ugliness" is an appropriate emotion. If Moore holds that only love of the *good* is valuable, Rule 2 aligns with Rule 1. If Moore holds that *any* appropriate emotion is valuable, Rule 2 predicts value where Rule 1 might hesitate (since ugliness is bad).

  ### Case (c): Compassion for Real Suffering
  **Scenario:** Profound, well-informed compassion for real, terrible suffering.

  *   **Moore's Predicted Verdict:** Intrinsically Good on the whole. This is explicitly one of the "Great Goods" alongside beauty and affection.
  *   **Rule Predictions:**
      *   **Rule 1 (Veridical/Hedonic Summation):** Predicts **Mixed/Negative Value**. The suffering is bad (Verdict 5). The pain of sympathy is pain (bad). If we sum the parts, the pain might outweigh the love.
      *   **Rule 2 (Organic Unity):** Predicts **Positive Value**. Verdict 5 establishes that a whole containing pain (retributive) can be good. The combination of love (good) and pain of sympathy (bad) creates a whole that is better than the sum of its parts.
  *   **Best Guess & Reasons:** Moore discusses this explicitly (§111). He classifies the "pleasures of sympathy" (which include compassion) as one of the greatest goods. He acknowledges the pain of sympathy is intrinsically bad, but the *whole* (love + pain of sympathy + knowledge of suffering) is intrinsically good. The presence of the real suffering is a necessary condition for this specific organic unity, even though the suffering itself is bad.
  *   **Splitter Case:** **Compassion for Deserved Suffering.** A person feels compassion for a vicious criminal undergoing just punishment.
      *   *Why it splits:* Rule 2 (Organic Unity) relies on Verdict 5, where "Vice + Pain" is good. If the suffering is *deserved*, Moore might view compassion as misplaced (a failure of justice), potentially making the whole less good or bad. Rule 1 (Hedonic Summation) would simply tally the pain of the criminal (good, if retributive) vs. the pain of the sympathizer (bad). This tests whether the *justice* of the suffering alters the value of the compassion.

  ---

  ### The Obstruction of Self-Evidence
  You noted that Moore would deny running any rule at all. This doctrine of **Self-Evidence** creates a significant obstruction to the analysis above. For Moore, asking "Which rule applies?" is a category error. He would argue that the value of Case (a) is not derived from a principle of Truth vs. Emotion, but is a unique, unanalyzable property of that specific whole that we intuit directly.

  This obstructs our seminar's inquiry in two ways:
  1.  **It halts justification:** If we ask Moore *why* false belief reduces value, he can only reply, "It is self-evident that it does." This prevents us from building a coherent normative system from his verdicts.
  2.  **It masks inconsistency:** Without rules, we cannot formally prove if Moore's verdicts are consistent. We are forced to treat his intuitions as atomic data points. Our reconstruction of "tacit rules" is therefore a charitable imposition of systematicity on a philosopher who explicitly rejected systematic derivation in ethics. We are essentially doing what Moore forbade: trying to calculate the incalculable.

  **Recommendation for the Seminar:** Frame the discussion not as "What is the rule?" but as "Where does Moore's intuition seem to rely on truth, and where on feeling?" This honors his method while exposing the tensions your cases reveal.
