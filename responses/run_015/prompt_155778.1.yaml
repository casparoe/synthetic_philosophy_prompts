          2.  Popperian pre-screening must be done by a mechanism. That mechanism can't be Popperian (regress), so it must be Skinnerian (dumb).
          3.  Therefore, Popperian machinery is Skinnerian.
          4.  Gregorian tools are shaped by selection; scoring is done by Skinnerian machinery.
          5.  Conclusion: All higher levels are just Skinnerian/Darwinian mechanisms running at different timescales.
          6.  Generalization: Implementation by lower levels negates the reality of higher levels (eliminativism about beliefs/desires).
      *   **User's Goals:**
          *   Keep: Distinction between rejecting unexecuted candidates vs. blundering (Popperian advantage).
