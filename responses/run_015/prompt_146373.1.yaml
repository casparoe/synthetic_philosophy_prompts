  Observer A rests on Earth while Observer B flies past at constant velocity toward Andromeda, and at the moment they coincide (event O), both reason about a distant event E on Andromeda—such as a fleet launch—which is spacelike separated from O. In A's rest frame, E occurs tomorrow, but in B's frame, the relativity of simultaneity tilts their "now"-slice such that E occurs today. We impose the condition of 'frame-transitive reality': if O is co-real with E in B's frame, and O is co-real with A in A's frame, then A and E are co-real simpliciter. Consequently, B reasons that E is already fixed relative to A's present, while A, relying on their own simultaneity slice, treats E as a contingent future event, creating a tension between the openness of the future and the transitivity of co-reality.

  **(1) Eternalist Verdict:** Both reasonings are partially correct but perspectival; the block universe exists tenselessly, so E is equally real as O regardless of frame. The disagreement is merely about which slice of the block constitutes "now," not about what exists. **(2) Presentist Verdict (Rejecting Transitivity):** Presentism holds because co-reality is frame-relative; A and E are co-real only relative to B's frame, not absolutely. There is no contradiction because "real" is indexed to a reference frame, so A's future remains unreal in A's frame. **(3) Presentist Verdict (Accepting Transitivity):** Presentism collapses; if co-reality is transitive across frames, E is co-real with A absolutely, meaning A's future already exists, forcing the presentist into eternalism. **(4) Working Feature & Local Collapse:** The argument relies on the transitivity of co-reality across distinct simultaneity hyperplanes. If we shrink the separation from Andromeda-scale to a local lab, the temporal offset ($\Delta t = v\Delta x/c^2$) becomes negligible; without significant spatial distance, the simultaneity planes do not diverge enough to include macroscopically distinct future events, shielding local presentism from this specific reductio.

  **Presentist Defense:** A presentist defender attacks the 'frame-transitive reality' condition itself, arguing that co-reality is not an equivalence relation across frames. They assert that "exists" is primitive and frame-invariant, but "simultaneous with" is conventional; thus, B's claim that E is co-real with O does not entail E is co-real with A in any ontologically robust sense, preserving the uniqueness of the present without accepting transitivity.

  **Typo Correction:** The spec sheet specified the event as "A sends a message tomorrow" while A and B are coincident. In standard SR, events timelike separated from the observers (like A's own future) cannot have their tense disagreed upon by inertial frames; all frames agree A's tomorrow is in the future. I corrected the event to be distant (on Andromeda) to ensure spacelike separation, which is physically required for observers to disagree on the tense of an event relative to their meeting point.
