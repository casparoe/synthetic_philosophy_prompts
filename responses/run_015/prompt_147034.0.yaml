  **The Priority Foundation: 2024 Impact & Allocation Report**

  **From the Desk of the Director**

  Welcome to another year of maximizing weighted welfare. Our donors remain incredibly generous, though we notice a recurring confusion in your feedback letters. Many of you ask if we are "closing the gap" or "reducing inequality." We want to reassure you: these concepts are morally inert to us. We do not care about the distance between persons, only the absolute lifetime well-being of each, weighted by their starting position. When you ask about equality, we hear a concern for the right function, simply misphrased. Rest assured, your dollars are purchasing priority-weighted units, not envy reduction.

  **Programme Highlights**

  **1. Regional Infrastructure Upgrade (Q1–Q2)**
  *Parameter Setting: $\epsilon = 2.5$*
  Standard utility maximization still holds weight at baseline settings. We paved 400 miles of road, benefiting 50,000 residents moderately. The cost per unit of priority-weighted welfare was efficient ($12.40/unit). While this helped the moderately badly off, our models indicated that shifting resources to the absolute bottom would yield higher moral value as we adjusted our curvature.

  **2. Nutritional Micro-Grants (Q3)**
  *Parameter Setting: $\epsilon = 2.7$*
  As we turned the dial, focus sharpened. We identified a cohort of 12 individuals at the lowest absolute welfare threshold. We spent $4.2 million delivering specialized protein packs. Each recipient gained approximately 0.05 welfare units. While the raw utility cost per unit was high ($7 million per unit), the priority weight transformed this into a bargain ($140 per weighted unit). Donors asked why we didn't feed 10,000 others; we explained that helping the slightly-less-badly-off yields diminishing moral returns.

  **3. The Singular Benefit Initiative (Q4)**
  *Parameter Setting: $\epsilon = 2.9$*
  Our boldest intervention. We located one individual at the global minimum of lifetime well-being. To ensure a Pareto improvement—we must never leave anyone behind—we secured a guaranteed gain for them: a single, heated winter coat. The logistical cost was $15 million. Critics note this could have vaccinated a city. However, the priority weight attached to that single coat outweighed the aggregate loss elsewhere. One person gained. No one lost welfare (the donors volunteered their funds). The math holds.

  **Ex Ante Performance Note**
  You will notice the "Probabilistic Relief Fund" is listed as a success despite zero actual beneficiaries. Because the *expected* priority-weighted value was positive at the time of signing, the grant counts as impact. We act on expectations, not hindsight.

  **Closing**

  We anticipate raising $\epsilon$ to 3.1 next fiscal year. This may result in fewer total beneficiaries, but the moral value per dollar will soar. Thank you for trusting the function.

  **Technical Appendix**
  *Weighting Function:* $w(u) = u^{(1-\epsilon)}/(1-\epsilon)$.
  *Current Dial:* $\epsilon = 2.9$ (Target 3.1).
  *Note:* As $\epsilon \to \infty$, we approach leximin. As $\epsilon \to 0$, we approach utilitarianism. We are neither. We are correct.

  ***

  ^1 ^Some ^staff ^members, ^specifically ^Gary ^in ^Monitoring ^& ^Evaluation, ^continue ^to ^ask ^who ^actually ^received ^the ^coat ^and ^if ^it ^fits. ^He ^suggests ^verifying ^existence ^before ^allocating ^capital. ^We ^have ^moved ^his ^desk ^away ^from ^the ^whiteboard ^for ^his ^own ^peace ^of ^mind. ^Existence ^is ^a ^variable, ^not ^a ^constraint.
