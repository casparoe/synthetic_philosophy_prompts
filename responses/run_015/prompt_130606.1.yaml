answer: |-
  There is a sentence waiting to be TRUE,
  Which lies beyond the reach of any PROOF.
  I stand outside the closed and formal SYSTEM,
  And watch the sentence in the polished MIRROR.
  It cannot speak its own consistent NAME,
  While I remain distinct from any MACHINE.

  You say you stand apart from any MACHINE,
  Yet what you see is merely something TRUE.
  I can construct a program with a NAME,
  That prints the sentence you claim as PROOF.
  My logic acts as just another MIRROR,
  For every formal and consistent SYSTEM.

  I am not merely any formal SYSTEM,
  Nor simulated by a dumb MACHINE.
  I see the soundness in the mental MIRROR,
  And know the axioms I hold are TRUE.
  This insight carries more than mechanical PROOF,
  But only if I know my own secret NAME.

  Then tell me, what is your specific NAME?
  Without it you are just another SYSTEM.
  You cannot offer up a valid PROOF,
  That you are not a complex thinking MACHINE.
  You claim a vision of the absolute TRUE,
  But stare blindfolded at your own MIRROR.

  You shift the glass within the logical MIRROR,
  And think that frees you from a fixed NAME.
  For every system you can hold as TRUE,
  There is a truth outside that formal SYSTEM.
  But this implies nothing about the MACHINE,
  That generates the steps of your PROOF.

  We lack the rigor of a formal PROOF,
  Our minds are cracked and clouded like a MIRROR.
  I might be just an inconsistent MACHINE,
  Contradicting myself without a NAME.
  If I am unsound, I am no consistent SYSTEM,
  And then I cannot say what is TRUE.

  I know the TRUE but cannot write the PROOF,
  No closed SYSTEM holds the perfect MIRROR,
  I claim a NAME yet function as MACHINE.
