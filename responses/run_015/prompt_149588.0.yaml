answer: |-
  This is a sophisticated impasse that strikes at the core of how historical knowledge is justified. Your working group is stalled because you are treating the Fomenko controversy as a dispute over *facts* or *definitions*, when it is actually a dispute over **epistemic architecture**.

  Here is the diagnosis of the disagreement, the identification of the hidden structural issues, and a specification of what would constitute genuine progress for your working group.

  ### 1. Diagnosis: Methodological Incommensurability Masking a Substantive Asymmetry

  The disagreement is neither purely verbal nor purely substantive in the standard empirical sense. It is a case of **Methodological Incommensurability** that results in a **Substantive Asymmetry of Falsifiability.**

  *   **Why it is not merely verbal:** Both sides make contradictory truth claims about the world (e.g., "The Colosseum was built in the 1st century" vs. "The Colosseum was built in the 12th century"). These cannot both be true.
  *   **Why it is not standardly substantive:** In a normal empirical dispute, new data adjudicates the winner. Here, new data (e.g., radiocarbon dating, dendrochronology) is absorbed differently by each framework. Mainstream history treats physical data as a constraint on textual interpretation. Fomenko treats physical data as interpretable text subject to the same statistical corruption as the chronicles.
  *   **The Incommensurability:** The two sides are operating within different **Epistemic Frameworks**.
      *   **Mainstream History** operates on **Abductive Consilience**. It seeks the explanation that best coordinates *independent* lines of evidence (linguistics, stratigraphy, genetics, numismatics, texts). A contradiction in one line (e.g., a text) is resolved by weighing it against the others (e.g., carbon dating).
      *   **Fomenko's New Chronology** operates on **Deductive/Mathematical Isolation**. It treats historical texts as closed data sets to be mined for statistical patterns. It privileges mathematical correlation over causal mechanism. It assumes that if a statistical pattern exists in the text, it reflects reality, regardless of whether a causal mechanism exists for that pattern to survive material transmission.

  **The Verdict:** The deadlock persists because Fomenko's method is **immunized against consilient falsification**. He has redefined "evidence" to mean "mathematical pattern in received texts," whereas historians define evidence as "traces causally linked to past events." You are arguing past one another because Fomenko is playing a game of internal textual coherence, while historians are playing a game of external causal reconstruction.

  ### 2. The Hidden Substantive Issue: The Ontology of the Data

  There is a concealed empirical/formal issue that, if made explicit, dissolves the appearance of a fair fight between two methodologies. The issue is the **Theory-Ladenness of Astronomical and Statistical Data.**

  *   **The Astronomical Claim:** Fomenko treats descriptions of eclipses or zodiac positions in texts like the *Almagest* as **Observation Logs**. He assumes the author recorded what they saw with precision.
  *   **The Historical Counter:** Historians treat these descriptions as **Literary or Computational Artifacts**. Ancient astronomers often calculated positions based on previous tables rather than observing them, or they used symbolic zodiacs.
  *   **The Formal Flaw:** Fomenko's statistical correlations of dynastic lists suffer from **Data Dredging (The Look-Elsewhere Effect)**. If you have enough variables and enough flexibility in how you define a "match" between two lists of kings, you will find correlations by chance. Mainstream historiography does not deny patterns exist; it denies that *correlation implies identity* without a causal mechanism for the transmission of that pattern.

  **The Hidden Empirical Pivot:** The real disagreement is not about the *chronology* but about the **Reliability of Transmission**.
  *   **Historians** assume material culture (pottery, ruins, DNA) degrades and deposits according to physical laws independent of human narrative.
  *   **Fomenko** assumes material culture is as malleable as text (e.g., claiming stratigraphy is misread or that carbon dating is flawed because the "conspiracy" extends to the lab).

  If your group can isolate the claim: *"Can statistical correlations in texts override physical stratigraphy in the absence of a causal mechanism for the correlation?"* you will find the substantive core. The answer from the philosophy of science is generally **no**, because text is dependent on human agency (which can lie or err), while stratigraphy is dependent on physical gravity and decay (which cannot).

  ### 3. Is the Demarcation Question Ill-Posed?

  The demarcation question is **not ill-posed**, but your group is likely trying to solve it using the wrong criterion.

  *   **Incorrect Criterion:** "Which theory is true?" (We cannot know this with certainty).
  *   **Incorrect Criterion:** "Which theory uses math?" (Pseudoscience often uses more math than science to lend false authority).
  *   **Correct Criterion:** **"Which methodology is robust against error and capable of self-correction?"**

  The impasse signals that you are trying to demarcate based on *conclusions* rather than *process*. Fomenko's theory is pseudohistory not because it concludes the timeline is wrong, but because its methodology lacks **negative feedback loops**. When archaeological evidence contradicts his timeline, he does not adjust the timeline; he reinterprets the archaeology as "fabricated" or "misread." This makes his system unfalsifiable.

  ### 4. What Counts as Progress?

  To break the deadlock, your working group should abandon the attempt to find a "principled demarcation" that Fomenko might accept (he won't, because his system requires rejecting the demarcation). Instead, progress lies in articulating the **Conditions of Adjudication**.

  **A. A Conceptual Distinction: "Internal Coherence" vs. "External Consilience"**
  Draft a distinction between methodologies that maximize *internal pattern matching* (Fomenko) and those that maximize *external causal fit* (Mainstream).
  *   *Progress:* Acknowledge that Fomenko's system is internally consistent (if you accept his axioms) but externally disconnected. Legitimate history requires external anchors (physics, chemistry) that are independent of the textual tradition.

  **B. A Methodological Rule: The Independence of Evidence**
  Establish a rule for legitimate historical methodology: **Evidence must be independent to be consilient.**
  *   Fomenko's dynastic correlations are not independent (later chronicles copy earlier ones).
  *   Archaeological stratigraphy is independent of textual chronicles.
  *   *Progress:* A formal rule stating that statistical correlations within a single tradition of texts cannot override physical evidence derived from independent causal processes (e.g., radioactive decay).

  **C. A Formal Result: The Base Rate of Coincidence**
  Commission or cite a formal statistical analysis showing that Fomenko's "discoveries" fall within the expected range of random correlation given the flexibility of his matching criteria.
  *   *Progress:* Demonstrating that the "statistical anomalies" Fomenko cites are not statistically significant when corrected for multiple comparisons. This moves the argument from "interpretation" to "mathematical error."

  **D. An Honest Argument for Permanent Deadlock (The "Conspiracy" Immune System)**
  If the above fails, you must accept that the deadlock is permanent because Fomenko's theory functions as a **Conspiracy Epistemology**.
  *   *Progress:* Argue that any theory that explains away all contradictory evidence by positing a universal fabrication (of archaeologists, carbon dating labs, linguists) removes itself from the realm of historical inquiry and enters the realm of belief. The demarcation line is **the willingness to accept falsification by independent physical data.**

  ### Recommendation for the Working Group

  Do not try to prove Fomenko wrong on the details (e.g., the date of the *Almagest*). You will circle forever.

  **Shift the debate to the conditions of inference.**
  Propose this resolution: *Legitimate historical methodology requires that textual claims be subordinate to physical constraints when the two conflict, unless a causal mechanism for the textual accuracy is provided.*

  Fomenko claims the texts are accurate records of a compressed timeline. He provides no causal mechanism for how a global conspiracy maintained this fabrication across unconnected cultures while failing to control the physical deposition of carbon isotopes or tree rings.

  **Progress is achieved when you stop asking "Is Fomenko's chronology possible?" and start asking "Does Fomenko's method possess the error-correcting mechanisms required of a knowledge-producing discipline?"** The answer is no, and that is the principled demarcation you are looking for.
