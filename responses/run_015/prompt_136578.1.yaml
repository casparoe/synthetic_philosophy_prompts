answer: |-
  ### Part I: Evaluation of Candidate Tests

  You proposed four tests. Here is the judgment on their utility, ordering, and necessary modifications for a protocol constrained by time, analyst expertise, and the need for public defensibility.

  1.  **The Mirror Test (Keep, First):** This is your primary symmetry check. It forces the analyst to strip the actor's identity from the action. If the action is only objectionable because *this* party did it, it is partisan noise, not structural backsliding.
      *   *Modification:* It must be applied to the *text of the rule*, not the rhetoric.
  2.  **The Turnover Test (Keep, Second):** This is the functional core of democratic integrity. Does this change alter the probability of the incumbent losing power or the certainty of their exit? If no, it is likely policy, not regime change.
      *   *Modification:* It must account for *cumulative* effects. One change might not alter turnover, but three might.
  3.  **The Irreversibility Test (Keep, Third):** This distinguishes normal politics from regime engineering. A ratchet is a change that a future majority cannot easily undo using the same rules.
      *   *Modification:* "Easily" must be defined procedurally (e.g., requires supermajority vs. simple majority).
  4.  **The Latent-Capacity Test (Modify, Fourth):** This is the most dangerous for analysts. Coding unused powers invites speculation.
      *   *Decision:* Keep only for powers where the *threshold for use* is low (e.g., executive decree) and the *check on use* has been removed. If the power exists but requires judicial approval that remains independent, code as "No."
      *   *Ordering:* It must come last. Only if a change passes Mirror, Turnover, and Irreversibility do we ask if latent capacity matters.

  **Additions:**
  *   **The Baseline Gate:** You must distinguish between erosion from a democratic baseline and tightening within an authoritarian one. The test for turnover applies to democracies; the test for autocracies is *constraint on contestation*.
  *   **The Federal Filter:** In federal systems, subnational changes count only if they are systemic (multiple states) or affect national electoral integrity.

  **Distinctions the Protocol Cannot Collapse:**
  1.  **Policy vs. Rules of the Contest:** Tax rates are policy; electoral boundaries are rules. Only rules trigger the flag.
  2.  **Legality vs. Democratic Valence:** A law passed legally can destroy democracy. Legality is a binary fact; valence is the coding target.
  3.  **Capacity vs. Exercise:** Capacity counts only if checks are removed.
  4.  **National vs. Subnational:** Subnational counts if systemic.
  5.  **Erosion (Democracy) vs. Tightening (Autocracy):** Different severity weights, same flag logic.

  ---

  ### Part II: The Coding Protocol (v1.0)

  **Objective:** Determine if a "Negative Integrity Event" (NIE) occurred in the quarter.
  **Time Budget:** 4 Hours per country.
  **Analyst Instruction:** Code the *institutional effect*, not the *stated intent*.

  #### Step 1: The Baseline & Jurisdiction Gate
  *   **Question 1.1:** Is the country currently rated above the democratic threshold in our index?
      *   *Yes:* Proceed to Step 2 (Democratic Erosion Track).
      *   *No:* Proceed to Step 2b (Authoritarian Tightening Track).
  *   **Question 1.2 (Federal Filter):** Is the change national or subnational?
      *   *National:* Proceed.
      *   *Subnational:* Does this change occur in >25% of subnational units OR affect the integrity of national elections?
          *   *No:* **STOP. Code: No Event.** (Record as "Local Policy" in notes).
          *   *Yes:* Proceed. Treat as National for coding purposes.

  #### Step 2: The Change Identification
  *   **Question 2.1:** Is the change a modification of the *rules of political competition* or *checks on power*? (e.g., electoral law, judiciary, media regulation, civil service tenure).
      *   *No (e.g., tax, foreign policy, spending):* **STOP. Code: No Event.**
      *   *Yes:* Proceed to Step 3.
  *   **Question 2.2 (Evidence Rule):** What is the source of the claim that this is harmful?
      *   *Domestic Opposition Only:* **STOP. Code: No Event.** (Unless backed by court ruling).
      *   *Government Self-Description:* Ignore.
      *   *International Body (Venice Commission, UN, Court) or Multi-Source Domestic (NGOs + Media + Academia):* Proceed.

  #### Step 3: The Mirror Test (Symmetry)
  *   **Question 3.1:** If the primary opposition party had enacted this exact change using the same legal procedure, would it have been cited by *this* government as a threat to democracy?
      *   *No:* **STOP. Code: No Event.** (Likely normal policy).
      *   *Yes:* Proceed.
      *   *Analyst Note:* If unsure, search for past statements by current officials criticizing similar moves by predecessors.

  #### Step 4: The Turnover Test (Effect)
  *   **Question 4.1:** Does this change increase the cost of campaigning for challengers OR decrease the certainty that a losing incumbent leaves office?
      *   *No:* **STOP. Code: No Event.**
      *   *Yes:* Proceed.
      *   *Inference Rule:* Do not ask "Did they mean to?" Ask "Does the math work out that way?" If the change creates a structural advantage >5% for incumbents, code Yes.
      *   *Default:* If the effect is ambiguous, code **No**. (False Negative preference over False Positive).

  #### Step 5: The Irreversibility Test (Ratchet)
  *   **Question 5.1:** Can a future simple legislative majority reverse this change without a constitutional amendment or supermajority?
      *   *Yes:* Downgrade Severity by 1 level. Proceed to Step 6.
      *   *No:* Proceed to Step 6.
      *   *Escalation Gate:* If the change is irreversible AND passes Turnover, **ESCALATE TO DIRECTOR.** (This is a high-stakes coding).

  #### Step 6: Latent Capacity (The Safety Valve)
  *   **Question 6.1:** Does this grant powers that are not yet used?
      *   *No:* Code based on Steps 4-5.
      *   *Yes:* Are the checks on those powers (judicial, legislative) still intact?
          *   *Yes:* **STOP. Code: No Event.** (Capacity without opportunity is not backsliding).
          *   *No:* **Flag Event.**

  #### Step 7: Severity Rating (1-4)
  *   **1 (Low):** Reversible, single institution, democratic baseline.
  *   **2 (Medium):** Irreversible OR multiple institutions, democratic baseline.
  *   **3 (High):** Irreversible, multiple institutions, OR authoritarian tightening affecting national contestation.
  *   **4 (Critical):** Systemic collapse of contestation (e.g., election cancellation, ban on opposition).

  #### Convergence & Quality Control
  *   **Blind Double-Code:** 10% of files are randomly assigned to two analysts.
  *   **Convergence Metric:** If disagreement on Binary Flag > 15%, protocol is revised. If disagreement on Severity > 1 level, Director reviews.
  *   **Symmetry Audit:** Quarterly, the Director swaps party names in 5 coded files and asks analysts to re-code. If flags change, the analyst is retrained.

  ---

  ### Part III: Application to Cases

  #### Case A: The "Legal" Landslide
  *   **Step 1:** Democratic Baseline? Yes. National? Yes.
  *   **Step 2:** Rules of Contest? Yes (Electoral formula, Media, Judiciary, Civil Service). Evidence? Public record of legislative changes.
  *   **Step 3 (Mirror):** If opposition did this (indefinite media tenure, lowering judge retirement to purge court), would current gov call it a coup? Yes. **Pass.**
  *   **Step 4 (Turnover):**
      *   Electoral formula: 52% vote -> 66% seats. Increases incumbent advantage. **Yes.**
      *   Media/Judiciary/Civil Service: Reduces check on incumbent. **Yes.**
  *   **Step 5 (Irreversibility):**
      *   Media/Judiciary appointments: Indefinite tenure/Lowered retirement. Cannot be easily reversed by next majority. **Irreversible.**
      *   *Escalation Gate:* Triggered. (Director must confirm).
  *   **Step 6 (Latent):** Media regulator has indefinite tenure. Power is latent but check is removed.
  *   **Protocol Output:** **FLAG: YES.** Severity: **3 (High).**
  *   *Note:* The fact that it is legal and cites other democracies is irrelevant under Step 2 and 3. The *combination* creates the ratchet.

  #### Case B: The Federal Patchwork
  *   **Step 1:** Democratic Baseline? Yes. Subnational? Yes (6 of 20 states = 30%).
  *   **Step 1.2 (Federal Filter):** >25% of units? Yes. Affects national integrity? Potentially (voter ID/Election Board). **Proceed.**
  *   **Step 2:** Rules of Contest? Yes (Districts, ID, Election Board).
  *   **Step 3 (Mirror):** If opposition governors did this, would national incumbent complain? Yes. **Pass.**
  *   **Step 4 (Turnover):** Redistricting mid-decade + Control of Election Board. Raises cost for challengers in those states. **Yes.**
  *   **Step 5 (Irreversibility):** State laws reversible by state legislatures, but if partisan lock-in exists, effectively irreversible. **Escalate.**
  *   **Protocol Output:** **FLAG: YES.** Severity: **2 (Medium).**
  *   *Reasoning:* National government didn't do it, but systemic subnational erosion compromises the national electoral environment.

  #### Case C: The Autocrat and The Restorer
  *   **Case C1 (Autocracy closes TV, lifts Emergency):**
      *   **Step 1:** Baseline Below Threshold? Yes. **Track: Authoritarian Tightening.**
      *   **Step 2:** Rules of Contest? Yes (Media closure).
      *   **Step 4 (Turnover/Contestation):** Closing last independent TV reduces contestation. Lifting Emergency increases rights.
      *   **Protocol Logic:** Net effect on *integrity*. Closing the last independent voice is a critical reduction in contestation capacity. Lifting emergency is policy/rights, but media closure is structural.
      *   **Output:** **FLAG: YES.** Severity: **3 (High).** (Tightening trumps liberalization in structural terms).
  *   **Case C2 (Restoration):**
      *   **Step 1:** Baseline? (Assume transitioning).
      *   **Step 2:** Rules of Contest? Yes (Restoring rules).
      *   **Step 4 (Turnover):** Does this raise cost for challengers? No, it lowers it.
      *   **Protocol Output:** **FLAG: NO.**
      *   *Handling Restoration:* The protocol detects *negative* events. Restoration is a "Positive Integrity Event." It should be recorded in a separate field ("Reform Score") but does not trigger the Backsliding Flag. **The protocol returns Zero.**

  #### Case D: The "Efficiency" Reform (The Uncomfortable Output)
  *   **Step 1:** Democratic Baseline? Yes.
  *   **Step 2:** Rules of Contest? Yes (Upper Chamber, Judiciary, Dissolution).
  *   **Step 3 (Mirror):** If opposition abolished the Upper Chamber (where they might be strong) and changed judicial appointments? Current gov would likely have opposed it previously. **Pass.**
  *   **Step 4 (Turnover):**
      *   Abolish Upper Chamber: Removes check on legislative majority.
      *   Judicial Appointment: Moves from profession to Legislature (majority control).
      *   Remove Dissolution: Stabilizes parliament, but removes check on legislative deadlock *in favor of the majority*.
      *   *Net Effect:* Concentrates power in the current legislative majority. Raises cost of losing. **Yes.**
  *   **Step 5 (Irreversibility):** Constitutional change likely required to restore Upper Chamber. **Irreversible.**
  *   **Escalation Gate:** Triggered.
  *   **Protocol Output:** **FLAG: YES.** Severity: **3 (High).**
  *   *Why this is uncomfortable:* It looks like "reform" (recommended by commissions, ends deadlock). But structurally, it removes veto points that protect minorities. The protocol prioritizes *structural check-and-balance* over *governance efficiency*.

  ---

  ### Part IV: Evaluation of Director's Priors

  You hold four priors. Here is how they survive contact with the protocol:

  1.  **Prior:** *"A change that is legal and that some established democracy also has cannot count as backsliding."*
      *   **Verdict:** **FAIL.**
      *   **Reason:** Protocol Step 2 & 3. Legality is not valence. "Cherry-picking" democratic precedents (e.g., using UK tenure rules for media but US rules for elections) creates a hybrid that no single democracy possesses. The *combination* is the backsliding, not the individual statutes. Case A proves this.
  2.  **Prior:** *"Nothing should be flagged unless the government meant to entrench itself."*
      *   **Verdict:** **FAIL.**
      *   **Reason:** Protocol Constraint 3. Motive is unverifiable in half a day. The protocol codes *effect* (Turnover Test). If the effect is entrenchment, the flag triggers regardless of whether they claimed it was for "efficiency." Case D proves this.
  3.  **Prior:** *"Case D is genuine reform and should not be flagged."*
      *   **Verdict:** **FAIL.**
      *   **Reason:** Protocol Step 4. Removing checks (Upper Chamber, Judicial Independence) structurally advantages the incumbent majority. Even if deadlock is bad, the *solution* chosen (concentration of power) fails the Turnover Test. The protocol forces you to publish a flag that will be criticized as "anti-reform."
  4.  **Prior:** *"A country already below the threshold cannot backslide further."*
      *   **Verdict:** **PARTIAL FAIL.**
      *   **Reason:** Protocol Step 1 distinguishes the *track* (Erosion vs. Tightening), but Case C1 shows a country below threshold can still lose integrity (closing last TV channel). The flag remains, but the severity definition shifts from "Democracy Loss" to "Rights/Contestation Loss." You cannot ignore decline in autocracies if your index measures "Integrity."

  ---

  ### Part V: Limitations (What This Protocol Cannot Do)

  1.  **It Cannot Measure Social Trust:** The protocol codes institutions, not culture. A country can pass all tests while social polarization makes democracy impossible.
  2.  **It Cannot Predict Collapse:** It flags the *step*, not the *fall*. A Severity 1 flag might be the first step to collapse, or a dead end. The protocol is myopic by design.
  3.  **It Cannot Adjudicate "Necessary Evil":** Case D shows this. Sometimes removing a check *is* necessary to govern (e.g., post-civil war). The protocol will flag it as backsliding because it prioritizes *long-term contestation* over *short-term governability*. You will be accused of valuing gridlock over stability.
  4.  **It Cannot Detect "Soft" Backsliding:** Harassment of journalists without legal changes, or use of tax audits to punish opponents, often fails Step 2 (Rule Change). This protocol under-codes informal repression.
  5.  **It Cannot Resolve the "Restoration" Paradox:** As seen in Case C2, a country can be "backsliding" in Q1 and "restoring" in Q4. The index will show volatility. The protocol does not smooth this. It records the quarter's transaction, not the net position.

  **Final Instruction to Analysts:**
  "If the protocol forces you to flag a reform you personally support, or clear a government you personally dislike, you have done your job. If you feel comfortable with every code, you have likely failed the Mirror Test."
