      *   *Ordering:* The prompt suggests Mirror -> Turnover -> Irreversibility -> Latent. A logical flow for an analyst is: Is it real? (Mirror) -> Does it affect competition? (Turnover) -> Is it stuck? (Irreversibility) -> Is it dangerous even if unused? (Latent).
