answer: |-
  Dear Colleague,

  It is a pleasure to engage with a query of such precision. Your hypothetical scenario regarding the isolated scientific community and their formal notation system cuts directly to the bone of Quine's ontological relativity. It serves not merely as an illustration, but as a stress test for the boundaries of his semantic behaviourism.

  To answer your central question directly: within the strict confines of Quine's conceptual apparatus, your crystal scenario does not generate a *new* or *more radical* form of indeterminacy. Rather, it strips away the psychological and sociological accretions of the *gavagai* example to reveal the underlying logical structure of Quine's thesis. It demonstrates that the indeterminacy is not a defect of natural language, but a fundamental feature of the relation between theory and world. However, the absence of a 'home language' does require us to be exceptionally rigorous about *whose* background language is doing the work of regimentation.

  Let us dissect this using Quine's core machinery: stimulus meaning, the inscrutability of reference, and the role of regimentation.

  ### 1. Stimulus Meaning and Empirical Equivalence

  In the *gavagai* case, the indeterminacy arises because the stimulus meaning (the range of sensory stimulations that prompt assent to 'Gavagai') is compatible with multiple ontological interpretations (rabbit, rabbit stage, undetached rabbit part). Your crystal scenario replicates this structure precisely. The symbol $\phi$ is triggered by specific geometric structures in the field. If both the 'macroscopic lattice' interpretation and the 'distributed bond network' interpretation preserve every observational prediction and intra-theoretic inference, they are empirically equivalent.

  For Quine, empirical equivalence is the necessary and sufficient condition for translation indeterminacy. If two manuals (or interpretations) account for all possible behavioural dispositions (in this case, the application of the symbol $\phi$ to stimuli) equally well, there is no fact of the matter as to which is correct. The fact that the community uses a formal notation rather than a natural language does not alter the stimulus conditions. The 'observations' are still sensory inputs processed by the community's theorists. Therefore, on the level of empirical underdetermination, the crystal case is identical to the rabbit case.

  ### 2. The 'No Home Language' Constraint and Ontological Relativity

  This is the most critical juncture of your query. You posit that there is "no home language available to anchor reference beyond the formal system itself." We must distinguish between two perspectives here: the internal perspective of the community, and the external perspective of the interpreter (you and I).

  Quine's thesis in *Ontological Relativity* is that reference is inscrutable *except relative to a background language*. There is no absolute reference.
  *   **From the Internal Perspective:** If the community truly possesses *only* the formal notation and no background language to explicate it, Quine would argue that the question of what $\phi$ *refers to* is meaningless even to them. Reference requires a theory of individuation (identity conditions), which is typically supplied by the logical apparatus (quantifiers, identity sign) regimented within a background language. If their formalism lacks explicit quantificational structure that defines the domain of variables, $\phi$ is merely a mark on a page. It has no ontology until regimented.
  *   **From the External Perspective:** When *we* interpret their system, *our* language (English, or our own regimented scientific theory) becomes the background language. The indeterminacy arises relative to *us*. We can map their $\phi$ to our 'crystal lattice' or our 'bond network'. Since both mappings save the phenomena, reference is inscrutable.

  Does the absence of a natural language make this *more radical*? One might argue that in the *gavagai* case, we lean on the native's implicit folk ontology to narrow the possibilities, only to find it insufficient. In your crystal case, there is no folk ontology to lean on. However, for Quine, folk ontology carries no privileged weight. He explicitly rejects the idea that pre-theoretic intuition anchors reference. Science (regimented theory) is the ultimate arbiter. Therefore, the absence of natural language does not deepen the indeterminacy; it merely removes a potential source of confusion. It confirms that even a 'perfect' formal system, devoid of natural language ambiguity, fails to fix its own ontology. This is precisely the point Quine wishes to make: syntax does not determine semantics.

  ### 3. Regimentation and Ontological Commitment

  You ask whether there is a principled reason within Quine's philosophy to privilege one translation over the other, perhaps tied to his view that ontological commitment is carried by regimented language.

  Quine's criterion for ontological commitment is: "to be is to be the value of a bound variable." To determine what $\phi$ commits the community to, we must translate their notation into our canonical notation (first-order logic).
  *   If we translate $\phi$ such that it functions as a predicate $L(x)$ where $x$ ranges over macroscopic objects, we attribute an ontology of lattices.
  *   If we translate it as $B(y)$ where $y$ ranges over bond networks, we attribute an ontology of processes/structures.

  If the formal notation itself does not explicitly specify the domain of quantification (i.e., if it is a calculus without a specified semantics), then the ontology is genuinely indeterminate until *we* impose a regimentation. Quine would not privilege one over the other based on 'truth', as both are empirically adequate. He might privilege one based on **theoretical virtues**: simplicity, conservatism, or explanatory power within *our* overall scientific worldview.

  For instance, if 'bond network' integrates more smoothly with our physics, we might prefer that manual. But this preference is pragmatic, not metaphysical. It does not resolve the indeterminacy; it merely selects a manual for use. Quine is clear that simplicity is a reason to choose a theory, but not a guide to 'real' reference. Thus, no principled metaphysical reason exists to favour the lattice over the network.

  ### 4. Boundaries of the Thesis: Formal vs. Natural Systems

  Does this scenario lie at the boundary of Quine's thesis? In a sense, yes, but not because it breaks the thesis. It lies at the boundary because it challenges the notion that 'translation' requires a natural language.

  Quine often speaks of translating a native language into English. However, his broader view is that science itself is a web of belief, and any sector of that web can be regimented. Your hypothetical community essentially treats their formalism as their 'language'. Quine would accept this. He views natural language as a clumsy instrument that we refine into formal logic for science.

  If the community uses *only* the formalism, they have effectively skipped the 'natural language' stage of ontological confusion. One might expect this to *reduce* indeterminacy. The fact that it does not is the profound lesson. It shows that indeterminacy is not a result of the vagueness of words like 'rabbit' or 'crystal'. It is a result of the gap between observational evidence and theoretical posits. Even with perfect formal precision, the link between the symbol and the object is mediated by a translation manual that is itself underdetermined by evidence.

  ### Conclusion

  To summarise: your scenario does not introduce a genuinely different kind of indeterminacy. It reproduces the *gavagai* argument in a purified form.
  1.  **Empirical Equivalence:** Both translations save the phenomena (stimulus meaning is identical).
  2.  **Inscrutability:** Reference is fixed only relative to a background language (ours).
  3.  **Ontological Relativity:** There is no fact of the matter about whether $\phi$ refers to lattices or bonds, only facts about which manual we adopt.

  The absence of a background natural language for the community does not generate a more radical indeterminacy; rather, it validates Quine's claim that natural language offers no secure foundation for reference to begin with. The indeterminacy is not a bug of natural language; it is a feature of empirical theory construction.

  If your reading group is looking for a point of contention, I would suggest examining the coherence of a community having *no* background language. Quine might argue that to learn and use the formalism, they must possess some prior apparatus of individuation (a proto-language). If they do, the indeterminacy relative to *that* apparatus becomes the relevant question. But if we accept the hypothetical as stated, the conclusion remains robust: the formal notation, like the native's utterance, fails to determine its own ontology.

  I hope this assists in your discussion. It is a stimulating hypothetical that serves Quine's purposes rather better than the rabbit example, precisely because it removes the temptation to rely on intuitive notions of 'objecthood'.

  Yours sincerely,

