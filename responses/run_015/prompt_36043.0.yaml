      *   *Nuremberg Comparison:* Post-WWII focused on "Crimes Against Peace," "War Crimes," and "Crimes Against Humanity," targeting individuals (though there was also "collective guilt" in the public sphere, legally it was individual).
      *   *Historical Context:* The Allies (especially France) wanted security and compensation. The US (Wilson) wanted self-determination and a League of Nations. The UK was somewhere in between.
      *   *Fischer Controversy:* Fritz Fischer (1960s) argued Germany *did* have war aims/plans. Does this validate Versailles? Not necessarily, because Versailles punished the *state* perpetually, not just the regime.

