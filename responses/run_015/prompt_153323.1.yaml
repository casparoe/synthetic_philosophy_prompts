answer: |-
  # PREP SHEET: KEYNOTE Q&A STRATEGY

  ## I. THE OPENING CONCESSIONS (First 5 Minutes)
  *Do not wait for the Q&A to soften the room. Build these into your closing remarks before the panel responds.*

  1.  **Concede Competence:** "I am not arguing that you are doing your jobs badly. I am arguing that the job description you were given contains a contradiction that no amount of technical proficiency can resolve."
  2.  **Concede Defensibility:** "I know that 'philosophical honesty' does not win cases in the D.C. Circuit. 'Methodological consistency' does. My argument is not that you should become moral philosophers, but that hiding the philosophy makes your analysis *less* legally defensible, not more."
  3.  **Concede the Status Quo:** "I am not asking you to stop using WTP tomorrow. I am asking you to label the WTP number exactly for what it is: a proxy for a moral judgment, not a substitute for one."

  ## II. THE OBJECTIONS (Ordered by Likelihood and Damage)

  ### 1. The "Arbitrary and Capricious" Trap
  *   **Source:** Senior Regulatory Economist / Practitioners (High Likelihood, High Damage)
  *   **The Idiom:** "You're asking us to replace a peer-reviewed, court-tested metric with a 'reasonability test.' If I put 'Audit Condition Satisfied' in the Federal Register instead of a VSL number, that rule gets remanded. Courts want objective data, not moral reasoning. Aren't you just trading defensibility for honesty?"
  *   **The 90-Second Reply:** "Courts strike down rules for being 'arbitrary,' which means the agency didn't explain its reasoning. Right now, you explain the *math* but hide the *moral premise*. When a judge asks why you valued a senior's life differently than a worker's, you say 'the model says so.' That is the definition of arbitrary. If you explicitly state, 'We compared the stakes and judged this distribution more defensible under role-reversal,' you are giving the court a *reason* to uphold you. Honesty isn't the enemy of defensibility; opacity is."
  *   **Weakness:** This assumes judges care about moral reasoning. They often prefer bright-line rules, even flawed ones. If the pushback is "Judges hate discretion," you have no empirical proof that your method reduces remand rates.

  ### 2. The "WTP is Revealed Preference, Not Welfare" Defense
  *   **Source:** Practitioners / Senior Regulatory Economist (High Likelihood, Medium Damage)
  *   **The Idiom:** "You're conflating ability to pay with well-being. We don't claim WTP measures happiness. It measures the marginal rate of substitution between risk and money. We aren't comparing people; we're comparing the efficiency of resource allocation. Why do you insist on calling this an interpersonal comparison of welfare?"
  *   **The 90-Second Reply:** "Because when you aggregate those marginal rates across persons to declare a 'net benefit,' you are asserting that a dollar's worth of risk reduction for a rich person counts the same as a dollar's worth for a poor person. That *is* a comparison of welfare weights. You can call it 'efficiency,' but the result determines who gets protected and who doesn't. If you refuse to call it a comparison, you refuse to examine whether the weight is justified."
  *   **Weakness:** They can technically retreat to the Kaldor-Hicks compensation test ("potential" compensation) and claim they never assert actual welfare gains. You must press that *regulatory decisions* treat potential gains as actual justification.

  ### 3. The "Operationalization" Challenge
  *   **Source:** Practitioners / Consulting Economists (Medium Likelihood, High Damage)
  *   **The Idiom:** "Okay, say we accept your 'Audit Condition.' How do I code that? How do I run a sensitivity analysis on 'role-reversal stability'? If you can't give us a spreadsheet formula, you're giving us poetry, not policy."
  *   **The 90-Second Reply:** "You already do this. When you adjust VSL for income elasticity, or when you write a 'Distributional Effects' appendix that you know the Agency Head will read, you are making this judgment. I'm asking you to move that judgment from the footnote to the methodology section. The 'formula' is the documentation of the stake comparison: 'Option A imposes a 10% loss on Group X; Option B imposes a 2% loss on Group Y. We judge the latter more defensible because...' That is a record courts can review."
  *   **Weakness:** This is the softest spot. You are asking for qualitative documentation in a quantitative field. If they demand a cardinal metric, you cannot give one without violating your own metaphysical claim.

  ### 4. The Utilitarian Objection: "The Greater Good"
  *   **Source:** Act-Utilitarian Panelist (Medium Likelihood, Low Damage to Practitioners, High Damage to Your Credibility)
  *   **The Idiom:** "You're making this too hard. Interpersonal comparisons are straightforward: sum the utilities. Your 'Audit Condition' forbids policies that maximize well-being just because the loser won't agree. Why should the veto power of the worst-off override the total good? You're smuggling in a Rawlsian prior under the guise of method."
  *   **The 90-Second Reply:** "Because regulators aren't utilitarian dictators. They operate under statutes that require 'reasonable' and 'equitable' protection, not just 'maximum' protection. If your maximization requires telling the worst-off 'your sacrifice is necessary for the sum,' and you cannot explain why *they* should accept that, you have left the realm of public justification and entered the realm of force. My condition isn't about maximizing; it's about legitimating authority."
  *   **Weakness:** The Utilitarian will correctly note that many statutes *do* mandate efficiency (e.g., "feasible" vs. "optimal"). If the statute says "maximize net benefits," your Audit Condition might be legally irrelevant.

  ### 5. The Capabilities Objection: "The Category Mistake"
  *   **Source:** Capabilities Theorist Panelist (Low Likelihood, Medium Damage)
  *   **The Idiom:** "You say compare 'stakes' not 'lives.' But a stake is still monetized. You haven't escaped the reductionism. Health, dignity, and agency aren't quantities to be traded. By keeping the dollar metric, you validate the very error you claim to expose."
  *   **The 90-Second Reply:** "I agree that well-being isn't a quantity. But the regulator *must* choose. Budgets are finite. If I ban the pollutant, I spend money that can't be used for the workplace safety rule. That trade-off is real, even if the metric is imperfect. I am not saying dollars measure dignity. I am saying that in a budget-constrained world, we must openly acknowledge the trade-off rather than pretending the dollars solved it for us."
  *   **Weakness:** You concede the metric is imperfect but keep using it. The Capabilities theorist will press: "Why not use a dashboard of functionings instead?" You need to hold the line on *decision necessity* vs. *measurement perfection*.

  ### 6. The Political Theorist Objection: "Technocratic Legitimacy"
  *   **Source:** Political Theorist Panelist (Low Likelihood, Low Damage)
  *   **The Idiom:** "You want to make the comparison 'honest.' But the problem isn't dishonesty; it's authority. Economists shouldn't be making these comparisons at all. That's for the legislature. You're just polishing the chains of technocracy."
  *   **The 90-Second Reply:** "The legislature delegated this to the agency. They didn't give us a bright line. They said 'protect public health with an ample margin of safety.' That requires judgment. If we refuse to make the judgment because it's 'political,' we default to the status quo, which is also a political outcome. I am asking analysts to clarify the choice for the political appointees, not to make the final choice themselves."
  *   **Weakness:** This blurs the line between analyst and appointee. If the audience believes analysts *should* be neutral technicians, this sounds like an invitation to activism.

  ## III. THE SINGLE REPLY THAT MUST LAND
  *   **The Point:** **"Hiding the moral judgment makes the rule *more* vulnerable to legal challenge, not less."**
  *   **Why:** This is the only argument that aligns your philosophical thesis with the practitioners' primary survival instinct (avoiding remand). If they think you are asking them to be "better people," they will ignore you. If they think you are helping them write "bulletproof" analyses, they will listen.
  *   **If It Fails:** If the Senior Economist or the room pushes back hard with, "Actually, courts prefer bright-line numbers to qualitative reasoning," **pivot immediately.** Stop arguing about "honesty." Argue about "Sensitivity Analysis." Say: "Fine. Treat the moral weight as a parameter. Run the analysis with equal weights, then with distributional weights. Show the Administrator the range. But label the parameters as 'Ethical Weights,' not 'Market Data.'"

  ## IV. THE QUESTION YOU HOPE NOBODY ASKS
  *   **The Question:** "If we adopt your 'Stakes' approach, and it leads to a different conclusion than the standard WTP aggregation, are you advising the Analyst to recommend the policy that fails the WTP test? If so, aren't you telling us to violate OMB Circular A-4?"
  *   **The Honest Answer:** "I am advising you to present *both* numbers to the decision-maker. One labeled 'Efficiency (Unweighted),' the other 'Defensibility (Weighted).' Circular A-4 asks for the best available science. If the science of welfare economics admits that WTP is income-sensitive, then presenting unweighted WTP as the *sole* bottom line is the violation. Let the Agency Head sign the rule, but let the record show they knew the trade-off."
  *   **Risk:** This sounds like insubordination. Be careful to emphasize *disclosure* over *recommendation*.

  ## V. THE RESTRUCTURE TRIGGER
  *   **The Objection:** **"Stakes are just Distributional Weights by another name, and OMB has explicitly told us not to use distributional weights in the bottom line."** (Likely from the Senior Economist or a seasoned OMB veteran).
  *   **Why it Breaks the Talk:** Your third claim (The Unit Claim) relies on the idea that comparing "stakes" is distinct from and more permissible than comparing "lives" or applying "weights." If the room conflates "Stakes" with "Distributional Weighting," they will categorize your proposal as "Forbidden/Illegal" and stop listening.
  *   **The Restructure:** If this objection lands early (during the talk or first Q&A), **cut the "Unit Claim" section of your closing.**
  *   **The New Ending:** Pivot to **"The Two-Number Rule."** Argue that even if "Stakes" sounds like weighting, the solution is to report *two* bottom lines: one for Efficiency (Kaldor-Hicks) and one for Equity (Stakes/audit). Argue that *suppressing* the second number is the real legal risk. Abandon the attempt to distinguish "stakes" from "weights" philosophically; focus on the administrative utility of reporting both.

  ## VI. PANELIST-SPECIFIC NOTES
  *   **Utilitarian:** They will try to hug you ("Finally someone admits ICWs exist!"). Do not let them co-opt you. Distinguish your "Audit Condition" from their "Sum Maximization."
  *   **Capabilities:** They will try to drown you ("Money isn't value!"). Agree in principle, but hold firm on "Budget Constraints require trade-offs."
  *   **Political Theorist:** They will attack your legitimacy. Defend the *necessity* of the bureaucracy, not its perfection.
  *   **Senior Economist:** This is your primary adversary. They will attack your *practicality*. Win them over by focusing on *litigation risk*, not moral truth.

  ## VII. FINAL TONE CHECK
  *   **Do not sound like a critic.** Sound like a risk manager.
  *   **Do not use the word "Corrupt."** Use "Incomplete" or "Opaque."
  *   **Do not claim to solve the problem.** Claim to make the problem *manageable*.
  *   **Remember:** You are in a room of people who build bridges. Don't tell them bridges are immoral. Tell them the load-bearing calculations are missing a variable, and if they don't write it down, the bridge might fall.
