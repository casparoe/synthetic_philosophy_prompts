      *   Reference relevant literature implicitly (Christensen, Elga, Titelbaum) without getting bogged down in citations unless helpful. (Actually, better to stick to the logic provided).
      *   Ensure the distinction between "undercutting" and "eliminating" is clear.

  11. **Final Check:**
      *   Did I answer the specific prompt? "Name the step you reject, explain why it looked fine, and price the alternatives."
      *   Did I address the "Global" version? Yes, by showing that even global doubt leads to suspension, not belief.
      *   Did I respect the attachment to (1)-(4)? Yes, by showing how rejecting (7) saves them.

      *(Self-Correction during drafting)*: I need to be careful about the "Enkratic Constraint" (4). If I reject (7), do I violate (4)?
      *   (4) says: Irrational to believe $p$ while judging process unreliable.
      *   If I reject (7), I say $H$ has *some* weight. So I judge the process *somewhat* unreliable.
      *   Do I believe $p$? No, I suspend.
      *   So (4) is satisfied. I don't believe $p$. I also don't believe $\neg p$. I withhold.
      *   The user's argument claims (8) follows: "You ought to believe $p$." This is because (7) says $H$ contributes *nothing*. If $H$ contributes *something*, $E$ is defeated (at least partially), so you don't ought to believe $p$.
      *   So rejecting (7) saves (4) and avoids the absurdity of (8).

