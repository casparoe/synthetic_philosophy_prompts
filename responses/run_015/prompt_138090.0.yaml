answer: |-
  This is a remarkably clear-eyed diagnosis of a field that often mistakes terminological turf wars for substantive disagreement. Your hypothesis is correct: the thirty-year stalemate is largely an artifact of equivocation. The Lewisian program and the Normativist program are not competing answers to the *same* question; they are competing answers to *different* questions that have been不幸ly labeled with the same word.

  Here is the diagnosis of the disagreement, an evaluation of your "Broadcast Equilibria" probe, and a prescription for what actual progress looks like.

  ### 1. Diagnosis: Equilibrium vs. Obligation

  The standoff persists because the two camps are carving the social world at different joints.

  *   **The Lewisian Question:** *How do stable behavioral regularities emerge and persist in the absence of a central coordinator?*
      *   **Target:** Stability and predictability.
      *   **Mechanism:** Conditional preferences and common knowledge (empirical expectations).
      *   **Scope:** Broad. Includes driving sides, language, and potentially some norms.
  *   **The Normativist Question:** *What distinguishes a behavior people feel pressured to perform from a behavior they merely find convenient?*
      *   **Target:** Obligation and social control.
      *   **Mechanism:** Normative expectations (beliefs about what others think one *should* do) and sanctioning readiness.
      *   **Scope:** Narrow. Excludes pure conventions, includes moral norms, etiquette, and duties.

  The Lewisian claims that norms are a *subset* of conventions (those with added enforcement). The Normativist claims that norms are a *distinct kind* of phenomenon (constitutively involving normative attitudes).

  The stalemate arises because Lewisians point to the *stability* of norms to prove they are conventions, while Normativists point to the *experience of obligation* to prove they are not. Both are right about their respective targets, but they talk past each other because they treat "norm" as a natural kind with a single essence, rather than a functional label applied to overlapping but distinct mechanisms.

  ### 2. The Broadcast Equilibria Case

  Your "Broadcast Equilibria" thought experiment is not just a data point; it is a **wedge**. It separates the variables that the two camps have kept conflated.

  **How it cuts:**
  *   **For the Lewisian:** This is a vindication. It shows that a self-enforcing regularity (a coordination equilibrium) can arise and persist solely on empirical expectations (the public percentage) without any normative superstructure. It proves that *stability does not require normativity*.
  *   **For the Normativist:** This is also a vindication, but of a different claim. They will argue: "Exactly! Because there are no sanctions and no normative expectations, this is *not* a social norm. It is a statistical regularity or a pure convention." It proves that *normativity does not emerge from stability alone*.

  **Verdict:**
  The case is **decisive evidence that each framework is answering a different question.**

  It dismantles the Lewisian reductionist hope that norms are *nothing but* conventions with extra steps, because the Broadcast case shows you can have the "convention" part (stable regularity based on expectations) without the "norm" part (sanctions/obligation), and the regularity remains fragile (it unravels when the number crosses a threshold). Conversely, it shows the Normativists that you cannot derive the *genesis* of the regularity solely from the *normative* attitude; the empirical expectation (the broadcast number) is doing the heavy lifting on coordination.

  If your department is split on whether this touches the question, it is because half of them are looking for the *origin of order* (Lewis) and the other half are looking for the *origin of ought* (Normativists). The Broadcast case satisfies the first group and frustrates the second, which proves they are studying different phenomena.

  ### 3. What Counts as Progress?

  If the impasse is terminological and categorical, arguing over definitions will yield no further returns. Progress requires shifting from **taxonomy** (what is a norm?) to **dynamics** (how do these states transform into one another?).

  Here are three concrete avenues for progress, ranked by viability:

  **A. The Transition Model (Highest Value)**
  Stop asking "Is X a norm?" and start asking "Under what conditions does a Broadcast Equilibrium transform into a Sanctioned Norm?"
  *   *The Research Question:* What triggers the shift from merely observing aggregate behavior to monitoring individual behavior and sanctioning deviations?
  *   *Why it helps:* It accepts the Lewisian baseline (coordination) as the substrate and the Normativist features (sanctions) as an evolutionary add-on. It turns the dispute into a timeline. You might find that norms are simply Broadcast Equilibria that have developed "immune systems" (sanctions) to resist the unraveling you described.
  *   *Result:* A unified theory where "convention" and "norm" are stable and unstable states of the same underlying system, rather than distinct ontological categories.

  **B. The Distinction of Expectations (High Value)**
  Formalize the distinction between *Empirical Expectations* (I believe you will do X) and *Normative Expectations* (I believe you believe I should do X).
  *   *The Research Question:* Can we empirically measure the point at which a change in empirical expectation triggers a normative reaction?
  *   *Why it helps:* In your Broadcast case, agents only have Empirical Expectations. A norm emerges only when agents develop a second-order belief: "If the percentage drops, I am not just inconvenienced; I am *angered*."
  *   *Result:* A psychosocial threshold model. This moves the debate from philosophy to behavioral science, where it can be tested.

  **C. Honest Expectation of Impasse (Low Value but Realistic)**
  Accept that "Norm" is a **cluster concept** (Wittgensteinian family resemblance) with no necessary and sufficient conditions.
  *   *The Stance:* Acknowledge that Lewisians study *coordination devices* and Normativists study *social control mechanisms*. Sometimes they overlap (tipping), sometimes they don't (Broadcast Equilibria vs. Moral Duties).
  *   *Why it helps:* It ends the futile quest for a "Unified Theory of Norms."
  *   *Result:* You stop trying to resolve the dispute and start specifying which mechanism you are modeling in any given paper.

  ### Recommendation

  Your Broadcast Equilibria case is strong enough to publish as a critique of the stalemate itself. It demonstrates that **stability** and **normativity** are separable variables.

  To move the field, do not try to convince the Normativists that Broadcast Equilibria are norms. Convince them that Broadcast Equilibria are the **precursors** to norms. The dispute isn't about what a norm *is*; it's about where the boundary of the *evolutionary process* lies.

  If you can model the mechanism by which a population moves from watching a nightly percentage to watching their neighbors' doors, you will have done more for the evolution of norms than thirty years of arguing over the definition of "convention." The Lewisians explain the signal; the Normativists explain the enforcement. Your job is to explain the **coupling**.
