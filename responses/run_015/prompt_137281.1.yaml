  # Joint Statement on Historiographical Method and Demarcation

  ### 1. Agreed Claims

  The undersigned participants in this seminar affirm the following propositions as a basis for further inquiry, acknowledging that while we share these premises, we weigh and interpret their implications differently:

  1.  **Evidence is Constitutive:** Historical knowledge claims must be grounded in evidence (textual, archaeological, material) that is, in principle, accessible to and evaluable by independent investigators.
  2.  **Consensus is Fallible:** The current mainstream historical consensus is not infallible. There are documented cases (e.g., the existence of the Hittites, Norse presence in North America) where claims initially marginalized or dismissed were later vindicated by new evidence or re-evaluation.
  3.  **Institutional Filters are Imperfect:** Institutional acceptance (peer review, university posts) is not a guarantee of truth. There are documented cases (e.g., Piltdown Man, the Hitler Diaries) where claims passed through institutional filters and were later exposed as false.
  4.  **Methodological Standards Exist:** There are identifiable methodological practices that distinguish robust historical argumentation from weak argumentation. These include: seeking independent attestation, checking claims against established chronological frameworks, acknowledging counter-evidence, and specifying conditions under which a claim would be abandoned.
  5.  **Specific Cases Currently Fail Standards:** Claims regarding Atlantis as a lost civilization, ancient-astronaut construction theories, and Fomenko-style global chronology revision currently fail to meet standard methodological burdens. Specifically, they rely heavily on selective reading of sources, ignore contradictory archaeological data, and often lack physical evidence that withstands independent testing.
  6.  **Vindicated Claims Succeeded via Method:** The claims regarding the Hittites and Norse voyagers were ultimately accepted not merely because institutions changed their minds, but because proponents eventually produced the kind of consilient evidence (archaeological, textual, scientific) that satisfies the standards listed in Claim 5.
  7.  **Good vs. Bad Practice:** A good historian explicitly tracks uncertainty, engages with the strongest version of counter-arguments, and submits to the risk of refutation. A bad historian (whether mainstream or marginal) immunizes claims from refutation by attributing counter-evidence to conspiracy, suppression, or systematic error without independent proof of such suppression.
  8.  **The Alcoutim Case Requires Balance:** Regarding the invented case of the Alcoutim lead tablets: both sides agree that the conflicting signals (strong internal data like eclipses and C14 vs. weak provenance and forgery precedents) require a transparent evaluation of risk. Both agree that the final judgment should depend on how the evidence is handled, not merely on who handles it.

  ### 2. Residual Disagreements and Cruxes

  The following table outlines the specific points where our interpretations diverge. We agree to treat these as open questions to be tested against the Alcoutim case and similar scenarios.

  | Crux ID | Sub-question | Demarcationist's Position (Own Terms) | Continuity Critic's Position (Own Terms) | Shared Test (Alcoutim Case) | Demarcationist's Prediction | Continuity Critic's Prediction | Disagreement Type |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **The Veto Power of Provenance** | Does weak provenance automatically invalidate strong internal data? | Provenance is a risk factor, not a veto. Internal consistency (eclipse + C14) can override provenance issues if robust. | The community's weighting of the "bought from collector" status vs. the "astronomical match" in the initial review. | The tablets will be classified as 'inauthentic' or 'unprovenanced' and excluded from reconstruction because the risk of forgery (given the 1990s precedent) outweighs internal consistency. | The tablets will be classified as 'problematic but potentially genuine' and used to challenge the frontier model, because the internal data outweighs the provenance risk. | Conceptual |
  | **C2** | **The "Extraordinary" Threshold** | Does a claim contradicting the frontier model require a higher burden of proof than a claim fitting it? | Yes. Claims that force a rewrite of the established web require evidence proportionate to the disruption (Bayesian prior is low). | The level of skepticism applied to the King-Names absent from Tyrian lists compared to a find that fits the lists. | Skepticism will be high and justified; the burden of proof scales with the magnitude of the required revision to the standard model. | Skepticism will be high but unjustified; the "extraordinary" label is a rhetorical shield used to protect the paradigm from valid revision. | Conceptual |
  | **C3** | **Institutional Error Base Rate** | How often does the mainstream reject true claims due to bias vs. methodological flaws? | Rejections are primarily due to methodological flaws in the claim (lack of evidence). Institutional filters generally work. | The reasoning given for any initial rejection of the Alcoutim cache (citing method vs. citing paradigm incompatibility). | If rejected, it will be because the evidence is genuinely ambiguous or flawed (e.g., eclipse data is derivable from later sources). | If rejected, it will be because the evidence threatens the consensus, and the reasoning will retroactively fabricate methodological flaws to justify exclusion. | Empirical |
  | **C4** | **Definition of Pseudohistory** | Is "pseudohistory" a methodological category identifiable in advance? | Yes. It is defined by specific failures (immunization from refutation, lack of consilience) regardless of institutional status. | Whether proponents of the Alcoutim find are labeled "pseudohistorians" if they insist on authenticity despite provenance issues. | Insisting on authenticity despite provenance issues moves the argument into pseudohistory (ignoring refutation conditions). | Insisting on authenticity despite provenance issues is standard historical dissent; the label "pseudohistory" will be applied sociologically to mark them as outsiders. | Verbal |

  ### 3. Analysis of Verbal vs. Substantive Dispute

  A significant portion of our dispute is verbal, centering on the label **"pseudohistory."**

  *   **The Verbal Component:** The Demarcationist uses "pseudohistory" as a *normative methodological category* (claims that fail specific epistemic tests). The Continuity Critic uses "pseudohistory" as a *sociological status* (claims currently excluded from the institutional mainstream). When the Demarcationist says "Atlantis is pseudohistory," she means "it fails methodological tests." When the Continuity Critic hears this, he interprets it as "Atlantis is excluded by the institution," which he knows can be wrong (as with the Hittites).
  *   **Non-Question-Begging Content:** Once we strip away the label "pseudohistory," the substantive disagreement remains. It is not about whether Atlantis exists, but about **risk tolerance** and **prior probabilities**.
      *   **Substantive Core:** How much weight should be given to *provenance* (context of discovery) versus *internal consistency* (content of the artifact)? What is the base rate of institutional error versus the base rate of fraudulent claims?
      *   **Resolution Path:** We agree that if the Alcoutim tablets are eventually proven genuine despite the bad provenance, the Demarcationist must admit that provenance is not an absolute veto. If the tablets are proven forged despite the good internal data, the Continuity Critic must admit that internal consistency can be manufactured and institutional skepticism was warranted.

  ### 4. Epistemic Self-Critique

  In drafting this synthesis, I encountered several difficulties in maintaining neutrality:

  *   **Hardest Formulation:** It was most difficult to state the Continuity Critic's view on Atlantis (Claim 5) without implying he believes Atlantis might exist. I had to frame it as "currently failing methodological burdens" rather than "false," to allow for his view that the *method of dismissal* is the problem, not necessarily the claim's truth value.
  *   **Leaked Framing:** I suspect I have quietly smuggled in the Demarcationist's framing in Claim 7 ("Good vs. Bad Practice"). By defining "good historians" as those who "submit to the risk of refutation," I may have biased the definition against the Continuity Critic's view that sometimes refutation is manufactured by the mainstream to protect a paradigm. The Critic might argue that "submitting to refutation" is impossible when the refutation is politically motivated.
  *   **What Would Move the Demarcationist:** She should be moved by a clear case where a claim exhibiting all the markers of "pseudohistory" (e.g., initial lack of provenance, contradiction of consensus, championed by outsiders) turns out to be true *and* is accepted because the evidence forced it, not because the proponents gained institutional power.
  *   **What Would Move the Continuity Critic:** He should be moved by a clear case where the mainstream institution rejects a claim solely due to paradigm incompatibility despite the evidence meeting all standard methodological tests (perfect provenance, consilience, falsifiability), and maintains that rejection for a prolonged period without new counter-evidence.
  *   **Synthesis Breakdown:** This synthesis is most likely to break down on **Crux C3 (Institutional Error Base Rate)**. This is an empirical question about the frequency of false negatives (true claims rejected) versus false positives (false claims accepted) in history. Neither side can actually estimate these base rates without a comprehensive sociological study of the field that neither of us possesses. If the base rate is unknowable, the dispute reverts to philosophical priors about trust in institutions versus trust in individual insight.

