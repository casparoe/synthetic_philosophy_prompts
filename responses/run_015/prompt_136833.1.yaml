answer: |-
  You have articulated a very strong, philosophically defensible position: **species nominalism** (or conventionalism). It is the view that species are human constructs imposed on a continuous biological reality. Many philosophers of biology (e.g., Philip Kitcher, some readings of David Hull) have argued variations of this.

  However, since you asked for the steelman of **species realism**—specifically in the face of Horizontal Gene Transfer (HGT) and the failure of the Biological Species Concept (BSC)—I am going to attack three specific premises in your argument.

  The realist counter-argument is not that the BSC works for bacteria (it doesn't), but that **you are looking for the wrong kind of "joint."**

  ### 1. The Empirical Claim: The Graph is Not Connected
  Your argument hinges on this conditional: *"Suppose... the gene-sharing graph across all sequenced prokaryotes is more or less connected."*

  The strongest empirical pushback is: **The data suggests this is false.**

  While HGT is rampant, it is not a free-for-all. It is highly structured. If you analyze whole-genome data (not just 16S), you do not see a smooth continuum of genetic distance. You see **multimodal distributions**. There are peaks (dense clusters of similar genomes) and valleys (rare intermediates).

  *   **Barriers to Recombination:** HGT is constrained by molecular compatibility. Restriction-modification systems, CRISPR-Cas immunity, and simple sequence divergence (homologous recombination requires high similarity to function) create friction. You can swap a plasmid with a distant cousin, but you cannot easily swap core housekeeping genes.
  *   **The "Wall" is Ecological:** The most robust barrier to gene flow in bacteria is not mechanical isolation (like genital mismatch), but **ecological isolation**. A *Vibrio* strain adapted to a specific sponge in the Caribbean cannot swap genes with a *Vibrio* strain in the Pacific, not because they *can't* mechanically, but because they never meet, and if they did, the immigrant genes would be selected against because they aren't adapted to the local niche.

  **The Realist Conclusion:** The clusters are real dynamical attractors. The "valleys" between species are real zones of low fitness. The fact that a bridge *could* theoretically be built doesn't mean the canyon isn't there.

  ### 2. The Conceptual Claim: Cohesion, not Isolation
  You are treating the BSC as the gold standard: *Species = things that don't mix.*
  The modern evolutionary realist argues: *Species = things that **do** mix enough to stay together.*

  This is the **Genic/Recombination Species Concept** applied to bacteria (championed by microbiologists like Frederick Cohan and Martin Polz).

  *   **Periodic Selection:** In asexual populations (or effectively asexual bacteria), a beneficial mutation sweeps through the population, wiping out diversity (a selective sweep). This binds the population together genetically.
  *   **Recombination as Glue:** In bacteria, homologous recombination acts as a cohesive force. It scrubs divergence between lineages. As long as two lineages recombine frequently enough, they remain one species. When ecological divergence becomes strong enough that recombination stops (or becomes maladaptive), they split.
  *   **Ecotypes:** Cohan's "Ecotype Model" posits that a bacterial species is a population of cells occupying a specific ecological niche, subject to the same periodic selection events.

  **The Realist Conclusion:** Bacterial species are real because they are **independent evolutionary lineages**. They are distinct "clouds" in genotype-phenotype space that move together over time. The 97% 16S cutoff is indeed a convenient heuristic for *identification*, but it is a proxy for the underlying reality of **ecological cohesion**. The cutoff is arbitrary; the cluster it approximates is not.

  ### 3. The Philosophical Claim: Fuzzy Boundaries $\neq$ Arbitrary
  You dismiss the "gray doesn't mean arbitrary" argument because the borders look "committee-picked."

  The steelman here relies on the distinction between **Vagueness** and **Convention**.
  *   **Convention:** We decide to call a hill a "mountain" if it's over 1,000 meters. (This is your view of species).
  *   **Vagueness:** There is a physical process that creates mountains (tectonic uplift) and erosion that wears them down. There is a point where a hill becomes a mountain due to isostatic rebound or ecological shifts, even if we can't pinpoint the exact meter.

  **The Language Analogy:**
  Consider human languages. English and Dutch are distinct. Yet, there is a dialect continuum. People borrow words (HGT). There are creoles (hybrids). By your logic, "English" is just a map, not territory, because there is no reproductive isolation between English speakers and Dutch speakers, and the boundaries are fuzzy.

  But a linguist would tell you English is a **real historical entity**. It has a trajectory, a grammar, and a lineage that is causally distinct from Dutch. The fact that they borrow words doesn't dissolve the reality of the linguistic system.

  Similarly, a bacterial species is a **historical lineage**. It has a trajectory. The fact that it occasionally picks up a gene from a neighbor (like English borrowing "kindergarten" from German) does not mean the lineage isn't a distinct, trackable unit of nature.

  ### 4. Addressing the "Pluralism Concedes the Point" Worry
  You asked: *If the answer is "there are many species concepts," doesn't that concede that there's no fact of the matter?*

  **No.** This is the argument from **Convergent Realism**.

  If the BSC (reproductive isolation), the ESC (ecological niche), and the PSC (phylogenetic monophyly) all carved nature at completely different, random places, you would be right. That would be nominalism.

  But in practice, **they mostly converge.**
  *   The clusters defined by core genomes (PSC) usually match the clusters defined by ecological niche (ESC).
  *   In eukaryotes, those clusters usually match reproductive isolation (BSC).

  When three independent metrics (gene flow, ecology, and ancestry) all light up the same boundaries, the most parsimonious explanation is not "we got lucky with our conventions," but **"there is a causal structure in the world producing this convergence."**

  The "Species Problem" is not that species don't exist; it's that "Species" is a **natural kind** that is produced by multiple overlapping processes (selection, drift, recombination, isolation). When those processes align, you get a "good" species. When they conflict (like Humans/Neanderthals, or ring species), you get edge cases.

  **The Human/Neanderthal Counter:**
  You mentioned Humans and Neanderthals interbred, so BSC fails, so they aren't real species.
  The realist reply: They *were* distinct lineages for hundreds of thousands of years. They had distinct morphologies, distinct ecologies, and distinct genetic clusters. The fact that they merged back together upon secondary contact doesn't erase the reality of their separation during the Pleistocene. It just means the speciation process was incomplete. **Speciation is a process, not an event.** Naming them separate species tracks the reality that they were distinct evolutionary trajectories for most of their history.

  ### Summary of the Steelman
  1.  **Empirical:** The bacterial genomic graph is **not** fully connected; it is clustered. The valleys between clusters are real zones of low fitness/ecological incompatibility.
  2.  **Mechanistic:** Bacterial species are held together by **ecological cohesion** and periodic selection, not just reproductive isolation. They are independent evolutionary lineages.
  3.  **Philosophical:** Fuzzy boundaries are a property of **dynamic systems**, not evidence of human convention. (Mountains are real despite foothills).
  4.  **Pluralism:** The fact that different concepts (ecological, phylogenetic, genealogical) converge on the same units is evidence of **mind-independent reality**, not arbitrary carving.

  **Where you might still be right:**
  You are right that the *rank* of "Species" is sometimes over-interpreted. In microbiology, especially with "metagenome-assembled genomes" (MAGs), we are often binning continuous variation because we need labels for clinical or ecological work. In those specific operational contexts, you are correct: it is map, not territory.

  But the *underlying phenomenon*—that life self-organizes into discrete, cohesive, historically independent lineages—is territory. The map is imperfect, but it is tracking something real.
