  *(Refining Q1)*: The user asks if Hard Core is just "what we can't afford to test." This is a strong critique. I need to validate that suspicion. In ML, often the "Hard Core" *is* just sunk cost + compute constraint. Lakatos would say that's irrational protection, not methodological protection. I must distinguish *methodological* protection from *economic* protection.

  *(Refining Q2)*: Novel facts. In ML, a "novel fact" is arguably a successful deployment in a context not used during training. Benchmark performance is *not* a novel fact; it's accommodation.

