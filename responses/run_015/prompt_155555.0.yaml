      *   *Interactive Kinds:* Yes, this is core Hacking. People react to being classified, changing the classification's extension over time. Contrast with "indifferent kinds" (quarks, gold).
      *   *Realism vs. Constructionism:* Hacking is often misread as a radical constructionist. He calls himself a "dynamic nominalist." He does *not* deny that there is suffering or biological substrate. He argues the *kind* itself is historically contingent and co-evolves with the people. He distinguishes between "making up people" and "making up the suffering."
      *   *MPD/DID Case:* Hacking discusses this extensively (e.g., in *Rewriting the Soul*). He acknowledges the role of therapists, media, and patients co-creating the specific *form* of the disorder. He does not necessarily say *no one* had dissociative experiences, but that the specific taxonomy of "MPD" created a niche that was filled and then abandoned.
      *   *Normative Conclusion:* Does Hacking argue for abolishing the DSM? Generally, no. He is descriptive/metaphysical, not primarily prescriptive in that specific way. He warns against reification, but doesn't typically argue for pure phenomenology without labels, as labels have utility (even if interactive).
      *   *Biology:* Hacking accepts biological reality but argues that the *classification* cuts nature in a way that is sensitive to human self-conception. He is not a biological reductionist, nor a biological denialist.

