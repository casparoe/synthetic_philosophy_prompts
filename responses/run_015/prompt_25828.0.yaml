  Now I'm trying to figure out what she'd say about a few cases we didn't discuss: a chicken, a jumping spider (like Portia, the ones that plan detour routes), and a cleaner wrasse (the fish that passes the mirror test). I'm less interested in the answers themselves than in what rule or rules could generate her pattern — ideally laid out as a menu of candidate principles that all fit her verdicts so far — and which of those new cases would do the most work in telling the candidate rules apart. If you had to bet, which way does she go on each, and what's the further case that would settle which rule she's actually running?

  Also, when you lay this out, please flag what's actually settled among people who study animal consciousness and what's genuinely contested. I don't want to walk away thinking there's a consensus when there isnt one.
