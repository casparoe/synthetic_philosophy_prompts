answer: |-
  This is a fascinating puzzle because your friend's list aligns almost perfectly with a specific, influential document in the field, while simultaneously rejecting a metric (behavioral complexity) that often confuses laypeople.

  Below is an analysis of the principles that could generate her verdicts, predictions for your new cases, and a crucial reality check on what science actually knows versus what is debated.

  ### Part 1: The Menu of Candidate Principles

  To generate her specific list (In: Humans, Dogs, Cows, Crows, Octopuses / Out: Trout, Bees, *C. elegans*, Sponges), she is likely operating on one of three implicit rules.

  **Principle A: The "Cambridge Declaration" Heuristic (Neuroanatomical Substrates)**
  *   **The Rule:** Consciousness requires specific neural hardware (a cortex, a functional pallium, or a complex centralized nervous system analog) found in mammals, birds, and cephalopods.
  *   **Why it fits:** This mirrors the 2012 *Cambridge Declaration on Consciousness*, signed by many leading neuroscientists. It explicitly includes mammals, birds, and octopuses, while remaining non-committal or skeptical about fish and insects.
  *   **Why she rejected "behavior":** Under this rule, a bee can do complex things via "hardwired" algorithms, but without the right *hardware* (e.g., a mammalian-style cortex or avian pallium), there is no "inner light."

  **Principle B: The "Amniote + Convergent" Lineage (Phylogenetic)**
  *   **The Rule:** Consciousness evolved once in the ancestor of land vertebrates (Amniotes: mammals, birds, reptiles) and once independently in cephalopods.
  *   **Why it fits:** It explains why Crows (Birds) and Cows (Mammals) are in, but Trout (Fish) are out. Fish diverged before the evolution of the specific brain structures associated with consciousness in land animals. It accounts for the Octopus as a famous exception of convergent evolution.
  *   **Why she rejected "behavior":** Evolutionary lineage matters more than current output. A bee is too phylogenetically distant.

  **Principle C: The "Warm-Blooded + Octopus" Intuition (Physiological)**
  *   **The Rule:** Endothermy (warm-bloodedness) is a proxy for high metabolic brain activity required for consciousness, with Octopuses as the acknowledged "smart invertebrate" exception.
  *   **Why it fits:** Humans, Dogs, Cows, Crows are endotherms. Trout, Bees, *C. elegans*, Sponges are ectotherms (or lack metabolism).
  *   **Why she rejected "behavior":** She views cold-blooded animals as more "reflexive" or "automatic," regardless of behavioral output.

  ---

  ### Part 2: Predictions for the New Cases

  Here is how each principle maps onto the three cases you want to test.

  | Case | Principle A (Cambridge/Neuro) | Principle B (Lineage) | Principle C (Warm-Blooded) | **My Best Bet on Her Verdict** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Chicken** | **Conscious** (Bird pallium) | **Conscious** (Amniote/Bird) | **Conscious** (Endotherm) | **Conscious** |
  | **Jumping Spider** (*Portia*) | **Not Conscious** (Invertebrate ganglia) | **Not Conscious** (Arthropod) | **Not Conscious** (Ectotherm) | **Not Conscious** |
  | **Cleaner Wrasse** | **Not Conscious** (Fish brain structure) | **Not Conscious** (Fish) | **Not Conscious** (Ectotherm) | **Not Conscious** |

  **Why these bets?**
  *   **Chicken:** It is very hard for people to include Crows but exclude Chickens. They share the same brain architecture and evolutionary class. Unless she thinks "intelligence" is the key (and chickens are "dumb"), she likely groups them with Crows.
  *   **Jumping Spider:** Even though *Portia* spiders plan detours (high behavioral complexity), they are arachnids. Since she excluded Honeybees (insects), she will almost certainly exclude Spiders. They are "bugs" in the layperson's taxonomy.
  *   **Cleaner Wrasse:** This is the trickiest. However, since she explicitly excluded **Trout**, she has already drawn a line at "Fish." Unless she is aware of the Wrasse's specific fame regarding the mirror test, she will likely categorize it with the Trout.

  ---

  ### Part 3: The Discriminating Cases (How to tell which rule she uses)

  If you want to know *which* principle she is using, you need to present cases where the principles disagree.

  **1. The "Portia" Spider (The Behavior vs. Hardware Test)**
  *   **Why:** *Portia* spiders exhibit planning and problem-solving that rivals vertebrates (Behavior = Conscious). However, they lack the neural architecture of mammals/birds (Hardware = Not Conscious).
  *   **The Tell:**
      *   If she says **Conscious**: She is secretly using a **Behavioral Flexibility** rule, despite her denial. She values *what* the animal does over *what* it is.
      *   If she says **Not Conscious**: She is committed to **Neuroanatomy or Lineage** (Principles A or B).

  **2. The Crocodile or Lizard (The "Cold-Blooded Vertebrate" Test)**
  *   **Why:** Reptiles are Amniotes (like birds/mammals) but are Ectotherms (like fish/bees).
  *   **The Tell:**
      *   If she says **Conscious**: She is following **Lineage** (Principle B). Reptiles are on the "land vertebrate" branch.
      *   If she says **Not Conscious**: She is likely following the **Warm-Blooded** heuristic (Principle C).

  **3. The Pigeon (The "Dumb Bird" Test)**
  *   **Why:** Pigeons are birds (Principle A & B say Conscious) but are often perceived as less intelligent than Crows.
  *   **The Tell:**
      *   If she says **Conscious**: She is relying on **Brain Architecture/Class** (All birds have the same hardware).
      *   If she says **Not Conscious**: She is relying on **Perceived Intelligence**, contradicting her claim that behavior doesn't matter.

  ---

  ### Part 4: The "Settled Science" Reality Check

  You asked to flag what is settled versus contested. This is critical because your friend speaks with confidence where scientists speak with caution.

  **1. Sponges and *C. elegans***
  *   **Status:** **Broadly Settled.**
  *   **Detail:** Sponges have no neurons. *C. elegans* has 302 neurons and no central brain. While a panpsychist might argue everything has some proto-consciousness, there is consensus that these organisms lack the biological machinery for sentience or subjective experience as we understand it.

  **2. Mammals (Dogs, Cows, Humans)**
  *   **Status:** **High Consensus.**
  *   **Detail:** There is very little serious scientific debate that mammals are conscious. They share the same cortical structures and neurochemistry associated with consciousness in humans.

  **3. Birds (Crows, Chickens)**
  *   **Status:** **Strong Consensus (Trending Yes).**
  *   **Detail:** Recent research shows birds possess a pallium (functional analog to the mammalian cortex) with high neuron density. The *Cambridge Declaration* explicitly includes them. However, laypeople often underestimate birds compared to mammals.

  **4. Octopuses**
  *   **Status:** **Strong Consensus (Trending Yes).**
  *   **Detail:** They are the "alien intelligence." Their nervous system is decentralized (neurons in their arms), but their behavioral complexity and pain responses lead most experts to grant them consciousness.

  **5. Fish (Trout, Wrasse)**
  *   **Status:** **Highly Contested.**
  *   **Detail:** Your friend's exclusion of Trout is **not** settled science.
      *   *The Debate:* Fish have a pallium, but it is structured differently than tetrapods. Some argue fish feel pain and have awareness; others argue their responses are purely reflexive.
      *   *The Wrasse:* The Cleaner Wrasse passing the mirror test (2019 study) was a bombshell. However, the mirror test itself is **contested** as a measure of consciousness (some argue it tests self-recognition, not sentience; others argue the methodology was flawed). Excluding all fish is a common layperson bias, not a scientific fact.

  **6. Insects (Honeybees, Spiders)**
  *   **Status:** **The New Frontier (Highly Contested).**
  *   **Detail:** This is where the field is moving *right now*.
      *   *The Debate:* Insects have tiny brains, but they show learning, navigation, and even "optimism/pessimism" biases. Some philosophers (e.g., Peter Godfrey-Smith) and scientists argue for "minimal consciousness" in insects.
      *   *Your Friend's View:* Excluding bees is the "safe" traditional view, but it is increasingly challenged. Excluding *Portia* spiders specifically would be harder to defend scientifically given their planning abilities, but fits the "no cortex" rule.

  ---

  ### Part 5: The Decisive Question

  If you want to settle which rule she is actually running, ask her this one question:

  > **"If we genetically modified a Honeybee to have the exact same number of neurons and brain structure as a Mouse, but it still looked like a bee and lived in a hive, would it be conscious?"**

  *   **If she says YES:** She cares about **Internal Hardware** (Principle A).
  *   **If she says NO:** She cares about **Lineage/Evolutionary History** (Principle B) or is implicitly relying on **Behavior/Environment** (Principle C).

  **The Ultimate "Settler" Case:**
  Ask her about a **Crocodile**.
  *   It is a vertebrate (like the Trout she rejected).
  *   It is an Amniote (like the Cow/Crow she accepted).
  *   It is Cold-Blooded (like the Trout/Bees she rejected).
  *   It is highly intelligent/complex (like the Octopus/Crow).

  If she says **Conscious**, she is following the **Neuro/Lineage** rule (Amniotes).
  If she says **Not Conscious**, she is following the **Warm-Blooded** heuristic.

  ### Summary Recommendation
  Your friend is likely operating on the **Cambridge Declaration Heuristic** (Mammals + Birds + Cephalopods). This is a robust, defensible position that aligns with current mainstream neurobiology, even if the "Fish" and "Insect" exclusions are more debated than she realizes.

  *   **Bet on:** Chicken (Yes), Spider (No), Wrasse (No).
  *   **Test with:** The Crocodile (to distinguish Lineage from Warm-Bloodedness) or the *Portia* Spider (to distinguish Hardware from Behavior).
  *   **Caveat to give her:** "You're aligning with the Cambridge Declaration, which is great, but you should know that the 'No Fish' and 'No Insect' verdicts are currently the biggest battles in the field, not settled facts."
