prompt: |-
  My friend and I got into a long argument about which animals are conscious, and she ended up laying out her verdicts pretty clearly. Here's where she landed:

  Conscious: humans, dogs, cows, octopuses, crows.
  Not conscious: trout, honeybees, C. elegans, sponges.

