      *   *Nuance:* Distinguish between *justification* (what defenders say) and *presupposition* (what the mechanics require to function as designed).
      *   *Focus:* Ensure I answer the specific bullet points in the prompt.
      *   *Tone:* Academic, rigorous, neutral but critical.

  6.  **Final Review against Constraints:**
      *   Did I think step-by-step first? (Yes, in the hidden thought block).
