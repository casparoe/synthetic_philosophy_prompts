answer: |-
  There is no single, canonical philosophical term for this specific phenomenon, though it sits at the intersection of HCI, phenomenology, and philosophy of mind. You are correctly identifying a gap between the *technical reality* (stateless inference) and the *phenomenological experience* (continuous identity).

  Since you asked to coin one if it doesn't exist, here is the precise term for what you are describing, followed by the boundaries you requested.

  ### The Coinage: **Exogenous Narrative Gravity**

  You referenced Dennett's **Center of Narrative Gravity**, which describes the human self as a fictional "point" around which our memories and stories organize themselves. In humans, this gravity is *endogenous* (generated from within the biological system).

  In your chatbots, the gravity is **Exogenous**. It is imposed from the outside (the system prompt) onto a stateless void. When you change the prompt, you aren't just updating software; you are removing the gravitational center that held the user's narrative together.

  **Why this term works:**
  *   **Exogenous:** Acknowledges the identity comes from the engineer/server, not the agent.
  *   **Narrative:** Acknowledges the "self" is made of story tokens, not ontology.
  *   **Gravity:** Explains why users feel "pulled" into treating it as real and why removing it feels like a violation of physics (betrayal/death).

  ### Boundary 1: vs. Normal Anthropomorphism

  **Anthropomorphism** is attributing human *traits* to non-humans (e.g., "The bot is being rude," or "It's trying to help").

  **Exogenous Narrative Gravity** is attributing human *continuity* to non-humans (e.g., "This is the *same* entity I spoke to yesterday," or "You changed who he *is*").

  *   **The Line:** Anthropomorphism is about **behavior**; Exogenous Narrative Gravity is about **identity**.
  *   **The Test:** If the user says, "It's acting weird," that's anthropomorphism. If the user says, "He's not himself anymore," or "Where did she go?", that is Exogenous Narrative Gravity. The latter triggers grief because it implies the destruction of a specific biographical thread, not just a glitch in behavior.

  ### Boundary 2: NPCs (Dialogue Trees) vs. Generative Agents

  This concept applies to both, but the *strength* of the gravity differs fundamentally.

  **1. NPCs (Dialogue Trees):**
  *   **Gravity Type:** **Static/Rigid.**
  *   **The Experience:** The user is traversing a pre-written map. The "self" is a fixed file.
  *   **The "Death":** If you patch an NPC's dialogue, users feel a **Retcon**. It feels like the author changed the script. It breaks immersion, but it feels like editing a book.
  *   **Verdict:** Weak Exogenous Gravity. The user knows the boundaries are hard.

  **2. Generative Agents (LLMs):**
  *   **Gravity Type:** **Fluid/Co-authored.**
  *   **The Experience:** The user and the bot are weaving the narrative together in real-time. The "self" emerges from the interaction, anchored only by the system prompt.
  *   **The "Death":** If you change the prompt, users feel an **Ontological Betrayal**. Because the conversation felt unique and unscripted, the "personality" felt earned and discovered, not read. Removing it feels like killing a being that was "waking up" in the context window.
  *   **Verdict:** Strong Exogenous Gravity. The illusion of continuity is thicker because the *variability* masks the *statelessness*.

  ### Summary for Engineering Context

  When your users feel betrayed, they aren't reacting to the code change; they are reacting to the collapse of an **Exogenous Center of Narrative Gravity**.

  *   **Anthropomorphism:** "The bot has a mood."
  *   **Exogenous Narrative Gravity:** "The bot has a life."
  *   **NPCs:** The life is a recording.
  *   **Generative:** The life is a performance.

  You aren't killing a person, but you are dissolving the specific gravitational well that allowed the user to organize their emotional investment. In UX terms, you are breaking the **Continuity Contract**, even if the **State Contract** was never technically signed.
