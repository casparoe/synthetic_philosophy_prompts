      *   *Difference:* In science, evidence *conflicts* with theory. In ethics, "evidence" (suffering) only conflicts if we already accept a normative premise (suffering is bad). Quine sees this premise as biologically/culturally ingrained, not empirically discovered.

  6.  **Instrumentalism vs. Minimal Realism:**
      *   *Quietist Instrumentalism:* Moral statements are imperatives in disguise. They aren't true/false. This fits Quine's skepticism about moral truth.
      *   *Naturalized Moral Realism:* Can we say moral facts are facts about human needs? Quine might allow this *within* science (e.g., sociology), but not as *normative* ethics.
      *   *The Verdict:* Quine's position is closer to a projectivist or expressivist view naturalized. It's not a robust realism. It's a recognition of moral discourse as a necessary social technology. However, because he rejects the analytic-synthetic distinction, he can't sharply separate "fact" from "value" in principle, only in practice based on their proximity to sensory periphery. This creates a tension: if *all* is web, why is ethics so far out?
