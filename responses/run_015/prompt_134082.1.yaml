      *   *Web of Belief:* Sentences face the tribunal of experience not individually but as a corporate body.
      *   *Physicalism:* Everything that exists is physical. Stimulations of sensory receptors are the evidence base.
      *   *Ethics:* Quine often treats ethics as lacking truth values in the same robust sense as science, or at least lacking empirical content. He sometimes calls them expressions of desire or social policy.
      *   *The Problem:* If the web is held together by empirical implications, where do moral sentences fit? They don't seem to predict sensory stimuli.

  3.  **Address the Core Tension (Empirical Content vs. Physicalism):**
      *   Quine's criterion for cognitive significance is usually tied to contribution to the prediction of sensory experience.
      *   Moral sentences (e.g., "Stealing is wrong") do not, even in conjunction with physical theories, entail specific sensory stimulations.
      *   *Interaction:* This creates a bifurcation. Descriptive sentences aim at truth (correspondence/coherence within the web relative to input). Normative sentences aim at something else (guidance, coordination).
      *   *Physicalist Commitment:* Since Quine is a physicalist, moral properties cannot be non-natural properties. They must be reducible or eliminable. If they aren't reducible to physical/behavioral states, they risk elimination.

  4.  **Analyze the "Fabric of Belief" Status:**
      *   Why keep them? They aren't *in* the web in the same way as "There is a rabbit."
      *   *Option A: Pragmatic Tolerance.* They are tools for social engineering. They stay because they work for group survival/cohesion. This aligns with Quine's view of language as a social art.
      *   *Option B: Indirect Anchoring.* Can moral claims be translated into claims about human flourishing, pain, or behavioral conditioning? If "Wrong" = "Conducive to social disruption," then it *does* have empirical content.
      *   *Quine's Lean:* He tends toward Option A but acknowledges Option B as a scientific study *of* morals (ethology/psychology), not morals *itself*. The normative force is not empirical.

  5.  **Underdetermination Thesis Application:**
