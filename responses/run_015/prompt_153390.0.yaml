answer: |-
  **Correspondence Table**
  *   **Radioactive Atom:** Weighted Loot Table (Decay = Common Drop, Survival = Legendary Drop).
  *   **Universe Branching:** Seed Splitting (Every roll generates parallel runs simultaneously).
  *   **Death:** Permadeath (Save file instantly corrupted/deleted).
  *   **Conscious You:** The Active Save File (the run currently being played).
  *   **Outside Observer:** None (There is no player outside the game).

  **The Translation**
  The universe is an engine that forces a reroll every second. If "Death" drops, that save file deletes. If "Click" drops, the run continues. Since you *are* the save file, you cannot experience deletion. You only experience the chain of seeds where the RNG kept hitting "Click." From inside the run, you hear infinite clicks. From a spectator view (if one existed), 99% of runs end instantly.

  **Residue Report**
  1.  **The Outside Player:** In *Isaac*, *you* sit outside managing seeds. MWI claims there is no "outside you." The runs are all that exist. I am not smuggling in a player; the argument fails if one is required.
  2.  **Existence:** Games delete failed runs. MWI says failed runs exist physically, just uninhabited by consciousness.

  **Stuck Points**
  1.  **The Dial:** Lowering survival to 0.1% is like a 0.1% drop rate. In games, rarity doesn't stop the item existing. In MWI, the branch exists, but its "measure" (amplitude) shrinks. Think of it like render brightness or allocated processing power. The run exists, but it's "dimmer." Subjectively, you don't feel dim—you're just alive. However, the *likelihood* of this specific run being the one you started in drops. It weakens the *rationality* of betting on immortality, even if the experience persists. This is the "Born Rule" problem: does low measure mean you should expect to die?
  2.  **Memory Erasure:** This is a corrupted save that keeps running. The process survives, but the *build* is wiped. Is it immortality? Technically yes, the instance persists. Practically, no—it's a hollow run. You care about the build (memories), not just the engine process.

  **Conclusion**
  The immortality conclusion survives the translation only if you define "you" strictly as the active process, ignoring probability weight and memory continuity. The game framing clarifies that "existence" ≠ "playable run."

  **Confidence:** 85%.
  **Least Sure:** Whether "measure" (brightness) actually affects subjective experience or just external probability. If measure drops to zero, does the save file actually close? Physics doesn't agree.
