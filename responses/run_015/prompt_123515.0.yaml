  i want a numbered agreed-claims section first: both should accept that descriptive representation is more accurate under random selection, that party capture is a real failure mode in current systems, that epistemic diversity is genuinely improved by lot, and that the Irish citizens assembly is a real-world proof of concept but not a full lottocracy. then a disagreements table with the exact wording each side accepts for their own view. the cruxes should cover (1) whether random selection destroys democratic mandate or just relocates it, (2) whether advisory bodies can avoid elite capture if they have no binding power, and (3) a concrete hybrid design—say, a 150-member senate selected by lot for seven years with staggered replacement, paired with an elected auditor-general who can trigger mandatory referendums on any bill—would this stabilize governance or just create deadlock? for crux 3 each side should record a specific prediction about institutional stability over fifteen years. please avoid citation lists or asking for quotes from texts, my friend cant search online and i want this reasoned from the concepts themselves. also flag if part of their disagreement turns out to be verbal about what "mandate" actually means.
