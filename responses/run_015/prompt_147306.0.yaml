  I'm a software engineer without formal training in philosophy. I'm developing a decision framework for resource allocation in long-running engineering projects—specifically for cases where prior, unrecoverable investment in a legacy architecture or computation path generates intermediate state that might carry epistemic or coordination value. The standard view treats honoring such sunk costs as fallacious, but I want to understand the deeper philosophical debate: is honoring sunk costs always irrational, or can it be rationalized as a credible commitment mechanism, a correction for mismeasured switching costs, or a form of path-dependent continuity?

