answer: |-
  subject: teaching plan for bongard session

  hey, thanks for reaching out about this session. since you are working with philosophy of science students who lack a cognitive psych background, the goal is to pivot away from how the brain solves these puzzles and toward how justification works when data is sparse and labels are absent. you want to avoid the trap of treating this as a game of spot-the-difference and instead frame it as a problem of underdetermination and hypothesis selection. to do that, you need to structure the dependency order carefully so they cannot settle for simple feature extraction. the first idea that must be in place is the notion of a relational invariant rather than a property list. before they even see the first problem, you need to establish that a valid rule must explain the presence of the left panel and the absence of the right panel simultaneously. if they think the rule is just a description of the left side, they will fail to see the inductive leap. so, step one is to define the task not as classifying the left images but as defining the boundary between the two sets. this primes them to look for contrast rather than content. once that is set, you can introduce the carrying example, which needs to be selected specifically to break their reliance on object-based features. i would recommend using a problem based on asymmetry in negative space rather than the properties of the figures themselves. for instance, choose a set where the left panel contains black shapes arranged such that the white space between them forms a vertically symmetric polygon, while the right panel contains black shapes where the intervening white space is asymmetric. the critical requirement for this example is that the black shapes themselves must be irregular and devoid of any consistent symmetry or countable features that could serve as a distractor. it must avoid having any obvious property like number of sides or color shading that correlates perfectly with the rule, because if such a feature exists, they will default to feature-listing and miss the point about negative space. by forcing them to attend to the void rather than the object, you disrupt the habit of cataloging positive instances and force them to construct a relationship between figure and ground.

  as you move through the session, you will encounter specific misconceptions in a predictable sequence, and you need to intercept them before they harden into wrong mental models. the first one will pop up almost immediately when you reveal the example. they will default to pattern matching by listing features of the left panel, saying something like all the left images have three shapes or all have sharp corners. you need to cut this off by introducing a single counter-example from the left panel that violates their proposed feature but still belongs to the set. do this early, within the first ten minutes, to show that surface features are unreliable. the second misconception arises when they try to formulate the rule. they will assume the left panel is the rule-set and the right panel is just noise or exceptions. they will try to write a definition that only fits the left side. you need to interrupt this by asking them to apply their rule to the right panel and show why it fails there, emphasizing that the rule is the difference-maker between the two groups, not a description of one group. this shifts their focus from classification to differentiation. the third misconception usually appears toward the end when they start talking about how a machine would learn this. they will conflate the task with supervised learning, assuming there is a training set and a test set with ground truth labels. you need to correct this by pointing out that in a bongard problem, there is no training phase separate from the testing phase. the six examples on the left are not training data; they are the entirety of the evidence. the induction happens from the contrast alone, without external validation. highlight that supervised learning assumes the hypothesis space is constrained by prior labels, whereas here the hypothesis space is open and constrained only by the logical consistency of the distinction.

  for the closing check, do not ask them to solve a new problem. solving a puzzle only proves they can find a pattern, not that they understand the inductive problem. instead, ask them to generate a competing hypothesis that fits all twelve images equally well but is conceptually distinct from the true rule. for example, if the real rule is about the symmetry of the negative space, ask them to devise a rule about the curvature of the convex hull of the black shapes that happens to correlate perfectly in this specific instance but would diverge on new data. if they can articulate why their alternative rule is empirically adequate but theoretically inferior, or vice versa, then they have grasped the problem of underdetermination. this shows they understand that the issue is not finding a rule that works, but justifying why one rule is preferred over another when the data is minimal. this connects directly to their background in philosophy of science regarding theory choice and evidence. finally, be explicit about what to leave out. do not spend time on the 1960s AI history or mikhail bongard's original book context. leave out the discussion of pattern recognition algorithms like decision trees or neural networks that were later applied to these problems. the reason is that your audience is interested in the epistemology of concept formation, not the engineering history of computer vision. bringing in the AI history risks turning the session into a lecture on symbolic vs connectionist architectures, which distracts from the core philosophical issue of how we justify inductive inferences from minimal data. keep the focus strictly on the logic of the discovery process and the constraints on hypothesis generation. if you stick to this arc, starting with relational invariants, using the negative space example to break feature-listing habits, intercepting the supervised learning conflation, and ending with the underdetermination check, you should get them to see bongard problems not as puzzles but as microcosms of the problem of induction. hope that helps you structure the session.
