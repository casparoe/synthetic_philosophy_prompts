answer: |-
  Right, let's take this slowly. You have described a remarkably precise slice of social reality, and it is entirely understandable that standard dictionary definitions fail to capture it. What you are describing sits right at the jagged intersection of linguistics, social ontology, and political philosophy.

  As requested, I shall begin by brainstorming the candidate concepts that spring to mind, weighing them against your examples, before settling on an analysis. I will write in British English throughout.

  ### 1. Brainstorming Candidate Concepts

  When I read your description, several labels from the philosophy of language and related fields float to the surface. Let us inspect them one by one to see if they fit.

  *   **The Austinian 'Misfire':** As you correctly noted, this does not fit. For Austin, a misfire occurs when the procedure is botched (e.g., I try to marry you but I am not a registrar). The act simply *does not happen*. In your cases, the act *does* happen. The sub-group *is* tasked; the rota *does* change. So, it is not a misfire.
  *   **The Austinian 'Abuse':** Austin distinguishes misfires from 'abuses'. An abuse is when the procedure is followed, but the requisite thoughts or feelings are absent (e.g., promising without intending to keep the promise). The act *is* performed, but it is hollow. This is closer. Your Chair is perhaps 'abusing' the procedure of consensus. However, 'abuse' implies the act is somehow defective or voidable. In your scenario, the act becomes *robust* once accepted. It solidifies. 'Abuse' feels too moralistic and doesn't capture the *ontological magic* of the thing becoming true.
  *   **The Searlean 'Declaration':** John Searle identified a class of speech acts called Declarations (e.g., "You are hired", "War is declared"). These change the world to match the words. Your Chair is effectively issuing a Declaration ("We agreed"). However, Declarations usually require specific institutional power (a judge, a priest, a boss). Your Chair has *some* power, but not the power to unilaterally declare agreement. They are borrowing power they do not strictly possess.
  *   **Presupposition Accommodation:** This is a strong contender from pragmatics (associated with David Lewis and Robert Stalnaker). When a speaker says, "The King of France is bald," they presuppose there is a King of France. If nobody objects, the listeners 'accommodate' the presupposition to keep the conversation going. Your Chair says, "As we agreed," presupposing an agreement. The room accommodates. This explains the mechanism, but 'accommodation' is usually about *conversational score*, not necessarily *institutional reality* (like binding a sub-group to work).
  *   **Collective Acceptance:** In social ontology (Searle, Margaret Gilbert), facts like "money" or "marriage" exist only because we collectively accept them. Your phenomenon looks like a forced march towards collective acceptance.
  *   **The 'Fait Accompli':** This is a political term, not a linguistic one. It describes a thing done that cannot be undone. It captures the *effect*, but not the *linguistic mechanism*.

  ### 2. The Analysis: What is the Thing?

  Having weighed these, I believe your phenomenon is a composite. It is not one single speech act type, but a specific *trajectory* of an utterance.

  It is best understood as **a Constative Utterance functioning as a Declaration, achieved via Presupposition Accommodation and Tacit Uptake.**

  Let us carve this out carefully.

  **A. The Guise (Constative)**
  The utterance is grammatically a report of fact ("We agreed", "Following the review"). In Austin's terms, this is a *Constative*. It claims to describe a state of affairs that already exists. This is crucial. If the Chair said, "I hereby decide we agree," it would be an *Exercitive* (exercising authority). It would invite immediate challenge because it claims power openly. By phrasing it as a Constative, the Chair shifts the burden of proof. To object, you must not just disagree with a decision; you must accuse the Chair of misrepresenting reality (i.e., lying or being mistaken). This raises the social cost of objection.

  **B. The Force (Declaration)**
  Despite the grammar, the *function* is a Declaration. It creates a new institutional fact (the mandate for the sub-group). It changes the deontic powers (who is allowed/obliged to do what).

  **C. The Mechanism (Accommodation + Uptake)**
  How does a Constative become a Declaration without the proper authority? Through **Presupposition Accommodation**.
  When the Chair says, "As we agreed," they introduce a presupposition into the 'conversational score' (the shared understanding of the room).
  *   **If challenged:** The presupposition fails. The Chair is exposed. The act misfires.
  *   **If unchallenged:** The room accommodates the presupposition. The 'score' is updated. It is now part of the common ground that "an agreement exists."
  Because this is an institutional setting (a committee), updating the conversational score *is* updating the institutional record. The minutes later record it because the room treated it as true in the moment.

  **D. The Glue (Tacit Uptake)**
  Austin insisted that for a speech act to be successful, it requires 'uptake' from the audience. Usually, uptake is active (saying "I do" in a wedding). In your cases, uptake is **tacit**. Silence is construed as consent. This is why it collapses if someone speaks up. The silence is not merely absence of sound; it is a performative act of ratification.

  ### 3. Evaluating Your Contrasts

  You asked how far your contrasts hold up.

  *   **Vs. The Misfire:** You are quite right. In a misfire, the act fails to launch. Here, the act launches *because* the conditions were missing, provided nobody points it out. It is a **successful infelicity**. It succeeds *in spite of* the missing conditions, by retroactively installing them.
  *   **Vs. The Self-Fulfilling Prophecy:** Your distinction holds. A prophecy is predictive ("The bank will fail"). This is reportive ("The bank has failed"). However, there is a nuance: once the report is accepted, it creates a *retrospective* truth. It rewrites the past. A self-fulfilling prophecy makes the *future* match the words; this makes the *past* match the words.
  *   **Vs. Lying:** This is the most subtle point. You noted the Chair seems "completely sincere" later. This suggests it is not a lie in the speaker's mind. A liar knows $P$ is false and intends you to believe $P$. Here, the speaker intends you to *accept $P$ as institutionally valid*, regardless of its historical truth. Once you accept it, the speaker's own memory often aligns with the new reality. It is not a lie; it is **ontological editing**.

  ### 4. Boundary Cases

  You asked about the edges. Here is where the phenomenon dissolves or changes shape.

  *   **Authority:** Does the speaker need *some* authority? **Yes.** If a random member of the public walked in and said, "As we agreed, the council will pay me £10,000," it would not work. The speaker must have a recognized status (Chair, Trustee) that grants their utterances *prima facie* credibility. It is an exploitation of existing status, not creation from nothing.
  *   **Audience Capacity:** You mentioned interest. I would refine this to **Capacity to Object**. If the audience is gagged, or terrified, or lacks the information to know no agreement occurred, the mechanism is not 'Accommodation' but 'Coercion' or 'Deception'. For your phenomenon to be this specific linguistic trick, the audience *must* be capable of objecting but *chooses* (consciously or unconsciously) to accommodate.
  *   **Writing vs. Speech:** It works in writing (your email example), but the 'uptake' window is longer. In a meeting, silence is immediate. In email, silence is delayed. However, the principle holds: failing to 'Reply All' with an objection constitutes tacit uptake.
  *   **No Audience (The Diary):** If you write "I have decided to leave" in a diary, does it become true? **No.** This confirms the phenomenon is essentially social. Without an audience to provide uptake (even a hypothetical future reader), there is no accommodation. You cannot 'smuggle' an illocutionary act to yourself in this way without a social mirror.
  *   **Fact vs. Permission:** You asked if it matters if the thing manufactured is a fact ("we agreed") versus a permission ("you may speak"). **No, it does not matter.** In institutional contexts, facts *are* permissions. "We agreed" creates the obligation for the sub-group. "The review happened" creates the permission to change the rota. Both are changes in **deontic status** (rights and duties).

  ### 5. Naming the Phenomenon

  Is there an established name? **No.** There is no single noun in the handbook that captures this specific retroactive, constative-disguised-as-declarative trick.

  If I were writing the handbook entry, I would coin the term **"Constitutive Accommodation"**.

  **Definition:** *Constitutive Accommodation* occurs when a speaker issues a constative utterance that presupposes the existence of an institutional fact (e.g., an agreement, a review) which does not yet exist. If the audience provides tacit uptake (by not challenging the presupposition), the conversational score is updated, and the institutional fact is retroactively constituted.

  **Why this name?**
  *   **Constitutive:** Because it brings a new reality into existence (like a Constitution).
  *   **Accommodation:** Because it relies on the pragmatic mechanism of listeners accepting presuppositions to maintain social flow.

  **Alternative:** Some sociologists might call this **"The Vanishing Mediator"**, but that is too vague. In legal theory, it resembles **"Estoppel by Conduct"**, but that is a remedy, not the act itself. **"Illocutionary Smuggling"** is a good colloquialism, but **"Constitutive Accommodation"** is the precise philosophical carving.

  ### 6. Confidence and Uncertainty

  You asked me to single out where I am least sure.

  **High Confidence:**
  I am highly confident that the mechanism relies on **Presupposition Accommodation** (Lewis/Stalnaker) combined with **Institutional Facts** (Searle). The analysis that the utterance is constative in form but declarative in force is robust. The distinction from lying (based on the retroactive sincerity) is also philosophically sound; this is a feature of institutional reality, not just individual psychology.

  **Low Confidence:**
  I am less certain about the **necessary conditions for Authority**. I have claimed the speaker needs *some* prior status. However, there are edge cases in radical democratic groups where *any* member might pull this off if the group is sufficiently passive. The threshold of "how much authority is needed to make the smuggling possible" is empirical and context-dependent, not strictly logical.

  Furthermore, I am not entirely certain that **"Constitutive Accommodation"** is not already in use in a niche sub-field of sociolinguistics I do not have immediate access to. It is a descriptive term I have constructed from existing components. It fits, but language is slippery; someone may have called this **"Retroactive Ratification"** in a 1998 paper on corporate governance I cannot see from here.

  **The Bit to Push Back On:**
  If you wish to challenge me, push on the **Silence**. I have treated silence as 'Tacit Uptake'. But is it? Or is it merely **Failure to Prevent**? There is a moral and linguistic difference between *consenting* to something and simply *not stopping* it. In your committee examples, is the room *agreeing*, or are they just *tired*? If they are just tired, does the act still 'succeed' in the same way? I argue yes (the minutes still stand), but the *legitimacy* differs. The philosophy of language struggles to distinguish between 'validating silence' and 'exhausted silence'. That is the fuzzy edge of this concept.

  ***

  **Summary:**
  You have identified a real, potent linguistic mechanism. It is not a misfire, nor a lie, nor a prophecy. It is a **Constitutive Accommodation**: a speech act that smuggles a change in institutional reality inside a report of fact, relying on the audience's reluctance to disrupt the conversational flow to grant it validity. It works because, in committees as in language, it is often easier to accept a false presupposition than to halt the proceedings to correct it.
