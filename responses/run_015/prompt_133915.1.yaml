answer: |-
  This is a classic tension in Quine scholarship, and your friends have actually reconstructed a very sophisticated version of the "Putnam vs. Quine" debate without realizing it. Maya is channeling Hilary Putnam (who argued Quine's criteria *do* commit us to moral realism), while Leo is defending a strict, hard-nosed reading of Quine's physicalism.

  Here is the move-by-move refereeing based on the internal logic of Quine's system, followed by what both of them are missing about Quine's actual stance on ethics.

  ### Move-by-Move Refereeing

  **Move 1: Maya's Structural Analogy**
  *   **Claim:** Math is saved by indispensability/centrality in the web; morals are indispensable for social coordination/prediction; therefore, morals should be saved too.
  *   **Verdict:** **Split Decision.**
      *   **Maya is right** that Quine rejects the analytic/synthetic distinction and saves math based on its structural role in the web of belief rather than some mystical "a priori" status. She correctly identifies that Quine's ontology is driven by utility within the system.
      *   **Leo is right** (implicitly) that she is equivocating on "prediction." For Quine, the "web of belief" is a mechanism for predicting *sensory stimulation* (physical events), not *social outcomes*. Math helps predict the trajectory of a projectile; morals help navigate a dinner party. Quine privileges the former as "ontology" and relegates the latter to "sociology."
      *   **Who wins the point?** **Leo.** Quine's indispensability argument is specifically tied to *natural science*. Maya is trying to expand the definition of "science" to include social coordination, which Quine resists.

  **Move 2: Leo's Empirical Constraint**
  *   **Claim:** Indispensability is about empirical science (predicting rocks falling), not social utility. Ethics isn't entangled with physics. Maya is smuggling in a pragmatic criterion Quine didn't endorse.
  *   **Verdict:** **Leo Wins.**
      *   Leo is textually accurate here. Quine's criterion for ontological commitment is: "To be is to be the value of a bound variable in our best *scientific* theory." For Quine, "science" essentially means natural science (physics, biology, etc.).
      *   Maya *is* smuggling in a broader pragmatism. Quine is a pragmatist, but a *scientific* pragmatist. He does not grant ontological status to concepts just because they are useful for social cohesion. If he did, he'd have to ontologize money, borders, and polite fictions, which he treats as social artifacts, not fundamental realities.

  **Move 3: Maya's Collapse of Theoretical/Practical**
  *   **Claim:** Naturalized epistemology collapses theoretical and practical reason. Predictive success is value-laden (depends on what we care about). Therefore, normative framing is inside the web.
  *   **Verdict:** **Maya Wins the Premise, Leo Wins the Conclusion.**
      *   **Maya is right** that Quine admits values into the web. Quine explicitly acknowledges "virtues of theory" (simplicity, conservatism, generality). Science *is* value-laden for Quine.
      *   **However,** she is wrong to think this validates *moral* values. The values Quine admits are *epistemic* values (how to get truth), not *moral* values (how to live).
      *   **Leo is right** to resist the slide from "science uses values" to "science validates moral ontology." Just because science relies on the value of "simplicity" doesn't mean the value of "justice" gets the same ontological footing.

  **Move 4: Leo's Astrology Reductio**
  *   **Claim:** If moral values are in because science has goals, then astrology is in because some scientists care about it. This drains the criterion of content.
  *   **Verdict:** **Leo Wins.**
      *   This is a strong logical check. Quine's indispensability is not about what individual scientists *psychologically* care about; it's about what is logically required for the theory to function.
      *   Astrology is not indispensable to physics; it is a competitor that fails. Maya's argument risks making ontology subjective ("If I care about it, it exists"). Quine's ontology is objective relative to the best theory. Leo is correct that Maya's criterion is too loose.

  **Move 5: Maya's "Stabilizing the System"**
  *   **Claim:** Ethics organizes experience and stabilizes the whole system, even if not in physics textbooks.
  *   **Verdict:** **Leo Wins (on Quinean grounds).**
      *   For Quine, the "system" is stabilized by its ability to anticipate *sensory input*. Ethics might stabilize *society*, but it does not stabilize the *prediction of sensory stimuli*.
      *   Quine is a physicalist. He believes all real events are physical events. If ethics doesn't help map the physical events causing our sensory stimulations, it remains outside the ontology, regardless of how useful it is for social peace.

  ---

  ### What Both Are Missing About Quine's Stance on Values

  If you put this in your dissertation, you need to move past the "Maya vs. Leo" dichotomy. Both are assuming Quine is trying to solve the problem of *Moral Truth*. Quine actually dissolves the problem by changing the subject. Here is what they are both missing:

  **1. The Distinction Between "Posits" and "Dispositions"**
  Both friends are arguing about whether moral values are *objects* (posits) in the world. Quine's behaviorism leads him to view moral statements not as descriptions of reality (which can be true or false) but as expressions of *dispositions* to act.
  *   **What they miss:** For Quine, saying "Stealing is wrong" is not like saying "Electrons exist." It is more like saying "Ouch!" or "Don't do that!" It is a verbal behavior conditioned by society.
  *   **Implication:** Maya wants morals to be *true* (ontological). Leo wants them to be *false* (non-ontological). Quine says they are neither; they are *tools*. You don't ask if a hammer is "true"; you ask if it works. Quine treats ethics as social technology, not a branch of physics.

  **2. The Humean Heritage (Is vs. Ought)**
  Quine is deeply Humean. He accepts a naturalized version of the Is/Ought distinction.
  *   **What they miss:** They assume naturalism means "everything real must be scientific." But Quine allows that "oughts" are real *psychological phenomena* (feelings of obligation) without being *moral facts*.
  *   **Implication:** We can study morality scientifically (psychology, sociology) as a natural phenomenon. We can explain *why* humans have moral values (evolution, conditioning). But the *values themselves* do not get to sit in the ontology alongside electrons and sets. Leo is right about the ontology, but Maya is right that morality is a natural phenomenon worth studying. They are talking past each other on this distinction.

  **3. Epistemic Values vs. Moral Values**
  Maya correctly notes that science relies on values (Move 3), but she conflates *epistemic* values with *moral* values.
  *   **What they miss:** Quine grants ontological respect to the values that govern *inquiry* (truth, simplicity) because they are constitutive of science itself. He does not grant this to moral values because they govern *action*, not inquiry.
  *   **Implication:** Quine's "double standard" (which Maya complains about) is intentional. He creates a hierarchy: Physics is fundamental; Biology is built on Physics; Psychology is built on Biology; Ethics is built on Psychology. Ethics is "further from the sensory surface." For Quine, distance from sensory stimulation determines ontological weight. Math is close (logical structure); Ethics is far (social sentiment).

  **4. The Role of "Truth"**
  Finally, both friends assume Quine thinks moral statements can't be "objective."
  *   **What they miss:** Quine is deflationary about truth generally. For Quine, "True" is just a device of disquotation (to say "Snow is white" is true is just to say "Snow is white").
  *   **Implication:** The question isn't "Are moral values objectively true?" The question is "Can we integrate moral terms into our canonical notation for science?" Quine's answer is no, not because they are fake, but because they don't help us regiment our theory of the world. They belong to the "folk theory" of society, not the "scientific theory" of nature.

  ### Summary for Your Dissertation
  *   **Leo** is more faithful to Quine's *ontology* (what exists).
  *   **Maya** is more faithful to Quine's *holism* (how beliefs connect), but she overextends it.
  *   **The Gap:** Quine isn't denying the reality of moral *experience*; he is denying the utility of moral *properties* for fundamental physics. Your dissertation could argue that this distinction is unstable. If the web is truly holistic (as Maya argues), and science is value-laden (as Maya argues), Quine struggles to explain why epistemic values get ontological privilege while moral values get relegated to "sentiment." That is the crack in the dam you should explore.
