  TO: Museum Director
  FROM: Senior Intern (Philosophy 101 Final Project)
  DATE: Oct 14
  SUBJECT: Conservation Log 44B – The Thinker in Clay Status Update

  So this report is about the material constituson of the artifact known as "The Thinker." We finally finished the restoration project where every single atom of the original clay was replaced with synthetic resin using a slow 3D-printing overlay method. Basically, we didn't touch the shape, we just swapped the stuff underneath over four years. It was boring but apparently necessary for the grade.

  The goal was to test the view that shape and continuity matter more than actual physical stuff. According to the theory of dominant sortals, the object falls under the sortal "Statue" rather than "Lump of Clay." Since the "Statue" sortal is dominant, the identity follows the form, not the matter. This explains why the statue survived the replacement even though none of the original atoms are left. There's also the issue of modal parts. The theory says an object can survive the replacement of parts if those parts are modal equivalents. So swapping clay for resin is fine because the resin performs the same role in the structure, holding up the chin and everything.

  The weird paradox here is the timing of the destruction. If we had smashed the original clay all at once, the statue would be dead. The continuity would break. But because we destroyed the material slowly while maintaining the form, the statue survives. It's like if you replace a car engine while driving versus crashing the car to install a new one. One keeps the identity, the other kills it. This parady on persistence conditions is working exactly as predicted, except for the legal stuff which is getting out of hand.

  The original clay is currently suing the museum for identity theft. It claims that since it provided the original mass, it owns the rights to the thought process of the statue. The clay substrate submitted a formal complaint via seismic vibration. It stated, "I was here first. Now I'm just a pile of dust in the basement while plastic me gets the glory. I feel demoted to a historical footnote." It also mentioned, "You can't just print over my soul and expect me to be cool with it. I have geological rights and I want residuals."

  To manage the assets and avoid paying the clay, we registered the restored resin statue as an NFT on the blockchain. This ensures the form is owned digitally even if the physical object is contested by the dirt. Meanwhile, the leftover original clay has launched a subscription service called "Authentic Substrate Experiences." For $14.99 a month, patrons receive a vial of the original dust and a QR code to hear the clay complain about its existence. The clay marketing says, "At least I'm monetizing my own erasure. It's passive income for being obsolete. Also, I smell like history."

  This whole situation really highlights the conflict between matter and form. It's basically hylomorphisim but with legal fees and better PR. The form stays, the matter leaves, and everyone is confused about who is actually thinking. The museum prefers the resin because it doesn't crack when it gets existential dread.

  Anyway, the clay is threatening to crack itself on purpose if we don't recognize its personhood. Please advise before the artifact commits suicide via structural failure. I need this grade so please let me know if the constituson argument holds up or if I need to cite more people who are dead.

  Thanks,
  Intern
