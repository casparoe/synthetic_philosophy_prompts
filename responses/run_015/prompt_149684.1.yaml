answer: |-
  **Project Title:** Procedural Information Loss in Distilled Amplification: A Bounds and Toy-Model Analysis

  **1. The Research Question**
  Does the distillation step in Iterated Amplification and Distillation (IDA) necessarily discard the structural information required for alignment verification, even when it successfully preserves task accuracy?

  Standard IDA theory assumes that if the amplified tree produces aligned outputs, distilling that input-output map into a single model preserves alignment. This project challenges that assumption by distinguishing between *outcome accuracy* (getting the right answer) and *procedural certifiability* (having the reasoning trace required to verify the answer). The specific question is: **Under what conditions does compressing an amplified reasoning tree into a single forward pass reduce the verifiability of the output below the threshold required for alignment, despite maintaining accuracy on the training distribution?**

  **2. Motivation and Gap**
  Current discourse splits into two camps. Optimists argue that if the amplified tree is aligned, the distilled model inherits this because it learns the same function. Pessimists argue that distillation is a black box that breaks the chain of trust. Both positions leave a critical gap: they treat alignment as a property of the output string alone.

  My advisor notes that if "aligned" is only a property of outputs, the mechanism doesn't matter. However, in high-stakes alignment, we care about *robustness* and *generalization* to adversarial inputs, not just training distribution accuracy. A model that outputs the right answer but lacks the internal structure to justify it under critique is not aligned; it is merely competent on-distribution. The "Legibility Tax" hypothesis posits that distillation acts as an information bottleneck that preferentially compresses reasoning traces (the "why") while retaining answers (the "what"). Existing literature lacks a formal characterization of this loss. Without it, we cannot know if IDA scales alignment or just scales competence while hiding the alignment failure.

  **3. Methodology and Scope**
  Given the six-month, 50%-time, and no-GPU constraints, I will not build a neural IDA loop. Instead, I will model the amplification/distillation cycle using symbolic systems (decision trees and logical proofs) where "reasoning traces" are explicitly representable and "distillation" is defined as complexity reduction (e.g., tree pruning or proof compression).

  *   **Months 1–2: Formalizing Verifiability.** Define a metric for "procedural certifiability" in a toy domain (e.g., boolean satisfiability or arithmetic proofs). This metric must capture the cost for an external overseer to verify the answer given the model's output structure.
  *   **Months 3–4: Constructing the Counter-Example.** Design a task where the amplified tree solves the problem via a verifiable path, but the minimal function approximator (the distilled model) that achieves the same accuracy on the training set necessarily obscures that path. This involves proving that the "verifiable" function class is strictly more complex than the "accurate" function class.
  *   **Months 5–6: Generalization Bounds.** Analyze whether the loss of certifiability correlates with performance degradation on adversarial or out-of-distribution inputs. If the distilled model fails faster under critique than the tree, the Legibility Tax is confirmed as an alignment risk.

  **Why this approach?** Building a neural IDA loop is engineering-heavy and opaque; it would consume the entire grant without guaranteeing a legible result. A symbolic/information-theoretic approach yields determinate answers (proofs or explicit counter-examples) that generalize beyond specific architectures. It directly addresses the "Legibility Tax" without getting bogged down in the "Composition Gap" (decomposition choices), which is a separate mechanism better suited for a different grant.

  **4. Possible Conclusions**
  *   **Positive (for IDA):** I prove that for any verifiable amplified tree, there exists a distilled model of comparable complexity that preserves the verification structure. (Unlikely, but valuable).
  *   **Negative (for IDA):** I identify a class of tasks where accuracy is preserved under distillation but verifiability drops to zero. This confirms the Legibility Tax.
  *   **Conditional:** I establish a bound showing that verifiability is preserved only if the distillation budget (model size) scales exponentially with tree depth, undermining IDA's efficiency claims.

  **Deciding Factors:** The project succeeds if I can mathematically demonstrate a divergence between the *accuracy-optimal* compressed function and the *verification-optimal* compressed function. If the two functions are identical in all tested toy domains, the hypothesis is weakened.

  **5. Deliverables**
  The primary deliverable will not be code, but a **technical report containing a "No-Go" theorem or a specific counter-example domain.**

  For funders and researchers, this provides a decision criterion:
  1.  **If the Legibility Tax is proven:** IDA requires a new distillation objective that penalizes opacity, not just error. Current approaches are insufficient.
  2.  **If the Tax is bounded:** We know the compute cost required to maintain alignment (i.e., distillation cannot be too aggressive).
  3.  **If the project fails (Inconclusive):** Failure is defined as inability to formalize "verifiability" in a way that distinguishes it from accuracy. In this case, the deliverable is a negative result on the measurability of process properties, suggesting the field must revert to output-only metrics.

  This scope is tight enough for 300 hours of work. It avoids the trap of "building a system to see what happens" and instead asks "what *must* happen given the information constraints," providing a theoretical guardrail for future empirical IDA work.
