prompt: |-
  I've been trying to work out what a theory of belief revision on conditionals actually owes us, especialy after re-reading the Judy Benjamin paratrooper vs radio-operator setup but also playing with a twist I cooked up: Judy learns her commander will use a noisy chanell to announce her role, so her update has to mix self-locating uncertainty about being on red or blue with evidential uncertainty about which signal she'll actually hear. I don't want a bibliography or citation list — just the full spec.

  Write the desiderata: what any adequate theory of updating on conditionals must deliver in cases that combine self-locating partitions with nested or noisy evidential conditions. For each one, give the motivating case (use both the classic Benjamin scenario and my noisy-chanell variant) and flag whether it's non-negotiable or just a camp preference. Cover at least: (1) how it resolves the tension between Jeffrey conditioning across the red/blue partition and direct conditioning on a conditional proposition; (2) whether updates must respect total evidence or can be compartmentalized; (3) how credences over partition cells shift when the learned information is conditional on being in one cell; (4) consistency with reflection principles about an agent's future beliefs, especially when those beliefs are indexical; and (5) whether the theory permits rational disagreement from identical priors and evidence or demands a unique update. Then briefly score Jeffrey conditioning, a direct-conditionalization rule, and a "partition-tracking with indexical anchoring" view against the list.

  Please separate what's settled — like the formal math behind Jeffrey conditioning — from what's genuinely contested among philosophers of probability (like whether reflection applies to self-locating credences), and don't present a contested view as the consensus.

  After the main answer, put a brief structured summary in a table with columns: Requirement, Motivating Case (Classic / Noisy-Channel), Status (Hard Requirement / Camp Preference), Jeffrey, Direct Conditionalization, Partition-Tracking — using values Satisfies / Partial / Fails for the last three.
