answer: |-
  # Specification: Desiderata for Belief Revision on Conditionals with Self-Location

  This specification outlines the requirements for a theory of belief revision capable of handling conditional evidence within a framework of self-locating uncertainty. It distinguishes between formal constraints (settled mathematics) and philosophical commitments (contested interpretations). The evaluation uses two cases:
  1.  **Classic Judy Benjamin:** An agent learns a constraint on conditional probability (e.g., "If you are in Red Territory, the probability you are in HQ is 3/4") without learning her location directly.
  2.  **Noisy-Channel Variant:** The agent knows the message regarding the conditional constraint is transmitted via a noisy channel. She must update on the signal received, which carries uncertainty about both the message content and her self-location (Red vs. Blue).

  ---

  ## 1. Input Interpretation: Jeffrey vs. Direct Constraint
  **Requirement:** The theory must specify whether conditional information is treated as a direct constraint on the posterior probability function or as a proposition upon which to conditionalize.

  *   **Motivating Case (Classic):** Judy learns $P(\text{HQ} | \text{Red}) = 3/4$. Does this fix the posterior ratio of $P(\text{HQ} \cap \text{Red})$ to $P(\text{Red})$ directly (Van Fraassen style), or is it evidence $E$ such that she computes $P(\cdot | E)$?
  *   **Motivating Case (Noisy-Channel):** Judy hears a garbled signal implying the constraint. She must weigh the probability that the signal *means* the constraint holds against the probability that the channel distorted it. A theory treating conditionals as direct constraints struggles to model the "distortion" of a constraint without a higher-order probability space.
  *   **Status:** **Camp Preference.** The mathematics of probability allows both, but they yield different posteriors.
  *   **Settled Math:** Probability axioms must hold in the posterior.
  *   **Contested Philosophy:** Whether conditionals have truth conditions (allowing direct conditionalization) or are merely constraints on belief (requiring alternative updating rules).

  ## 2. Total Evidence vs. Compartmentalization
  **Requirement:** The theory must determine whether background knowledge about the source of the conditional (e.g., channel reliability) is integrated into the update or compartmentalized away from the conditional content.

  *   **Motivating Case (Classic):** Often ignored in simplified versions, but implicitly assumes the informant is reliable.
  *   **Motivating Case (Noisy-Channel):** Judy knows the channel flips signals with probability 0.1. If she treats the conditional info in isolation (compartmentalization), she ignores the noise. If she respects Total Evidence, she must update her belief about the channel's state and her location jointly.
  *   **Status:** **Hard Requirement.** Ignoring known reliability parameters violates the Principle of Total Evidence, a standard norm of rationality.
  *   **Settled Math:** Bayesian conditioning formally requires conditioning on the strongest available evidence.
  *   **Contested Philosophy:** Whether "conditional information" counts as evidence in the same way observational data does, or if it occupies a separate normative tier.

  ## 3. Partition Cell Shifts (The Flow of Probability)
  **Requirement:** The theory must explain how credence shifts between the antecedent partition cells (Red vs. Blue) when the learned information is conditional on being in one specific cell.

  *   **Motivating Case (Classic):** Standard Van Fraassen updating keeps $P(\text{Red})$ fixed. Intuitively, however, learning that HQ is likely *given* Red might make Red more attractive (or less, depending on priors regarding HQ). The theory must justify why $P(\text{Red})$ moves or stays still.
  *   **Motivating Case (Noisy-Channel):** If the signal is more likely to be received clearly if Judy is in Red (e.g., better reception), hearing the signal should boost $P(\text{Red})$. The theory must account for this correlation between location and evidence reception.
  *   **Status:** **Hard Requirement (for adequacy), Contested (for outcome).** An adequate theory *must* provide a determinate answer, but philosophers disagree on what the correct answer is.
  *   **Settled Math:** Law of Total Probability must be preserved.
  *   **Contested Philosophy:** Whether learning about a sub-region (HQ within Red) provides evidence about the region itself (Red).

  ## 4. Diachronic Coherence and Indexical Reflection
  **Requirement:** The theory must address consistency between current credences and expected future credences (Reflection), specifically when the future credences depend on self-locating information.

  *   **Motivating Case (Classic):** If Judy knows she will receive the conditional info later, should her current credence in Red match her expected future credence in Red?
  *   **Motivating Case (Noisy-Channel):** Judy knows she will hear a noisy signal. Standard Reflection principles often fail in self-locating cases (analogous to Sleeping Beauty). The theory must specify if it modifies Reflection to accommodate indexical uncertainty or accepts the violation.
  *   **Status:** **Camp Preference.** Standard Reflection is widely accepted for non-indexical beliefs but is heavily contested for self-locating beliefs.
  *   **Settled Math:** Martingale properties of conditional expectation hold for standard filtrations.
  *   **Contested Philosophy:** Whether self-locating belief updates constitute "learning" in the sense required for Reflection principles.

  ## 5. Uniqueness vs. Rational Disagreement
  **Requirement:** The theory must declare whether identical priors and identical conditional evidence necessitate identical posteriors.

  *   **Motivating Case (Classic):** Two commanders give the same conditional info. Must Judy update identically? Some argue the "weight" of conditional info is underdetermined.
  *   **Motivating Case (Noisy-Channel):** Two operators interpret the "noise" differently (one thinks it's static, one thinks it's interference). If the theory allows subjective likelihoods for the noise, it permits disagreement. If it fixes the update rule, it demands uniqueness.
  *   **Status:** **Camp Preference.** This maps onto the Uniqueness Thesis debate in epistemology.
  *   **Settled Math:** Given a fixed likelihood function and prior, Bayes' rule yields a unique posterior.
  *   **Contested Philosophy:** Whether the mapping from conditional evidence to likelihood functions is objective or subjective.

  ---

  ## Theory Evaluation

  ### 1. Jeffrey Conditioning
  *   **Mechanism:** Updates probabilities directly on a partition (e.g., $P(\text{Red})$, $P(\text{Blue})$) while preserving conditional probabilities within cells.
  *   **Performance:**
      *   *Input:* Fails to handle conditional inputs naturally; requires translating "If Red..." into a partition shift, which is often arbitrary.
      *   *Total Evidence:* Partial. Can incorporate noise if modeled as a partition, but struggles with the *content* of the conditional.
      *   *Partition Shifts:* Fails the intuitive test in Classic Benjamin (forces $P(\text{Red})$ to be exogenous).
      *   *Reflection:* Satisfies standard Reflection but struggles with indexical variants.
      *   *Uniqueness:* Satisfies (deterministic given partition shifts).

  ### 2. Direct Conditionalization
  *   **Mechanism:** Treats the conditional "If $A$, then prob($B$)=$x$" as a proposition $C$ and updates on $C$.
  *   **Performance:**
      *   *Input:* Fails formally if conditionals lack truth values (Adams' Thesis). If treated as truth-apt, it often yields counterintuitive results (e.g., lowering $P(\text{Red})$ too drastically).
      *   *Total Evidence:* Satisfies. Treats the signal as standard evidence.
      *   *Partition Shifts:* Satisfies (shifts occur naturally via Bayes' rule), but the magnitude is contested.
      *   *Reflection:* Satisfies standard Reflection.
      *   *Uniqueness:* Satisfies (given agreement on the truth conditions of $C$).

  ### 3. Partition-Tracking with Indexical Anchoring
  *   **Mechanism:** Treats the conditional as evidence about the *relationship* between the self-location and the world state. Updates the joint distribution of (Location, State, Signal).
  *   **Performance:**
      *   *Input:* Satisfies. Explicitly models the conditional as a link between index and state.
      *   *Total Evidence:* Satisfies. Built to handle noisy channels and reliability.
      *   *Partition Shifts:* Satisfies. Allows $P(\text{Red})$ to shift based on the informativeness of the conditional regarding the location.
      *   *Reflection:* Partial. Requires modified Reflection principles for self-location.
      *   *Uniqueness:* Partial. Depends on subjective priors regarding the channel noise.

  ---

  ## Summary Table

  | Requirement | Motivating Case (Classic / Noisy-Channel) | Status | Jeffrey Conditioning | Direct Conditionalization | Partition-Tracking |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Input Interpretation** | **Classic:** How to parse "If Red, then HQ"? <br> **Noisy:** How to parse garbled conditional? | Camp Preference | **Fails** (Requires arbitrary translation to partition) | **Partial** (Depends on truth-apt semantics) | **Satisfies** (Models relation explicitly) |
  | **2. Total Evidence** | **Classic:** Informant reliability. <br> **Noisy:** Channel noise probability. | Hard Requirement | **Partial** (Can model noise, ignores conditional content) | **Satisfies** (Treats signal as evidence) | **Satisfies** (Integrates noise & content) |
  | **3. Partition Cell Shifts** | **Classic:** Should $P(\text{Red})$ change? <br> **Noisy:** Does signal clarity favor Red? | Hard Requirement (Outcome Contested) | **Fails** (Fixes $P(\text{Red})$ by design) | **Satisfies** (Shifts via Bayes, but magnitude debated) | **Satisfies** (Shifts based on indexical link) |
  | **4. Indexical Reflection** | **Classic:** Expectation of future belief. <br> **Noisy:** Expectation of future signal reception. | Camp Preference | **Partial** (Standard Reflection only) | **Partial** (Standard Reflection only) | **Partial** (Requires modified Reflection) |
  | **5. Uniqueness** | **Classic:** Same info, same update? <br> **Noisy:** Same noise, same interpretation? | Camp Preference | **Satisfies** | **Satisfies** | **Partial** (Allows prior divergence on noise) |
