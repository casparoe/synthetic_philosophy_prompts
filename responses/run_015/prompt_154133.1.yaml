answer: |-
  ### 1. Foundation Tiering

  **Workhorse**
  *   **Care/Harm:** This foundation consistently accounts for the largest share of variance in moral judgment across nearly all demographic and national contexts.
  *   **Fairness/Cheating:** Like Care, this foundation demonstrates robust universality and serves as a primary axis for distinguishing moral from immoral actions globally.

  **Real but Secondary**
  *   **Loyalty/Betrayal:** While culturally variable in expression, group-binding intuitions reliably predict conservative social attitudes distinct from individualizing foundations.
  *   **Authority/Subversion:** Hierarchy-respecting intuitions show consistent predictive power for social order preferences, particularly in high-threat or traditional environments.
  *   **Sanctity/Degradation:** Although heavily reliant on religious or cultural elaboration, purity concerns uniquely predict attitudes on bodily and spiritual boundaries.
  *   **Liberty/Oppression:** This foundation captures a distinct reactive resistance to domination that is not fully absorbed by Fairness or Care metrics.
  *   **Stewardship:** Intergenerational responsibility appears to be a distinct temporal binding mechanism that survives controls for Loyalty and Authority in pilot data.

  **Probably Reduplicative**
  *   **Legibility:** Despite pilot separation, the demand for transparency is theoretically indistinguishable from a modern, institutional instantiation of Procedural Fairness and Liberty.
  *   **Liberty/Oppression:** (Note: If forced to demote one existing foundation to make room, Liberty is the most conceptually overlapping with Fairness, but given your list, Legibility takes the reduplicative slot). *Correction for clarity:* I will assign **Legibility** to this tier as the only candidate here.

  **Probably Not a Foundation**
  *   *(None of the eight items currently meet the threshold for total exclusion given your pilot data, so this tier remains empty.)*

  ### 2. Candidate Scoring (0–5)

  | Admission Criteria | Legibility | Stewardship |
  | :--- | :---: | :---: |
  | **1. Innate preparedness / Early emergence** | 1 | 3 |
  | **2. Recognizable eliciting pattern of events** | 4 | 4 |
  | **3. Characteristic emotion** | 4 | 4 |
  | **4. Characteristic motivation** | 4 | 5 |
  | **5. Culturally variable elaboration on shared core** | 2 | 4 |
  | **6. Unique predictive power (political attitudes)** | 5 | 5 |
  | **Total** | **20** | **25** |

  **Scoring Notes:**
  *   **Legibility (Innate = 1):** The cognitive machinery required to conceptualize "algorithms," "institutions," or "bureaucratic opacity" is culturally recent and developmentally late, unlike the toddler-level sensitivity to harm or resource sharing.
  *   **Legibility (Cultural Variability = 2):** This intuition presupposes a "legible state" or complex technical system; it may not emerge in stateless societies or low-technology contexts, limiting cross-national utility.
  *   **Stewardship (Innate = 3):** Resource conservation and tool maintenance have deep evolutionary roots, even if the "inherited landscape" framing is culturally elaborated.
  *   **Stewardship (Motivation = 5):** The drive to preserve and transmit is a clear, actionable behavioral imperative (maintenance) compared to the more reactive drive of Legibility (audit).

  ### 3. Item Budget Split

  **Allocation:** **0.80 to Stewardship / 0.20 to Legibility**

  **Reasoning:**
  Your goal is a *cross-national* module for contexts where the US-centric six-foundation structure fits poorly, which implies a need for high cultural generalizability. Stewardship scores significantly higher on "Innate preparedness" and "Cultural variability," suggesting it relies on cognitive adaptations (resource management, intergenerational planning) present in hunter-gatherer, agrarian, and industrial societies alike. Legibility, by contrast, is contingent on the existence of complex, opaque bureaucracies or algorithmic systems; in nations with low state capacity or different governance traditions, "legibility" items may suffer from floor effects or be interpreted as simple Fairness violations. You should spend the bulk of your budget validating the more evolutionarily robust construct (Stewardship) while retaining a minimal set of Legibility items to test if it is indeed a universal foundation or merely a WEIRD (Western, Educated, Industrialized, Rich, Democratic) subtype of Fairness.

  ### 4. Normative Implications for the "Symmetric Conclusion"

  Admitting these candidates, particularly Stewardship, would likely **weaken** the strong symmetric conclusion that liberals and conservatives are merely drawing on different but equally valid subsets of the moral domain. The standard Moral Foundations Theory (MFT) argument rests on descriptive symmetry: conservatives use five or six foundations, liberals use three, but neither is "right" about the objective moral truth because morality is pluralistic. However, if Stewardship is admitted as a distinct foundation and proves to be politically asymmetric (loading heavily conservative, as binding foundations usually do), it introduces a functional asymmetry regarding societal survival. Unlike Sanctity or Authority, which can be viewed as culturally contingent social technologies, Stewardship tracks objective constraints on resource depletion and institutional continuity. If one side systematically scores low on a foundation that measures the preservation of the conditions necessary for future moral agents to exist, it becomes harder to maintain that their moral subset is merely "different" rather than "deficient" in a pragmatic sense. Consequently, the module would shift the conclusion from "both sides have partial insights" to "both sides have partial insights, but the conservative subset includes a necessary condition for long-term collective survival that the liberal subset neglects," thereby reintroducing a normative hierarchy that the original six-foundation model sought to avoid.
