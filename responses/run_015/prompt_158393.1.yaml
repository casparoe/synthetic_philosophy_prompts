      *   *Distinction:* Distinguish between the *Diegetic* level (the society in the story) and the *Non-Diegetic* level (the construction of the novel).
      *   *Refined Cost:* The cost is admitting that *utopia is a genre of conflict*, not a state of perfection. The author must take a stand on what "tolerance" means in this world.

  9.  **Final Polish:**
