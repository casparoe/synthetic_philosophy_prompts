answer: |-
  The slogan functions as a proxy for liability and control boundaries rather than a technical classification, meaning it cannot settle the shipping decision without explicitly defining who owns the risk of autonomous actions.

  ### Menu of Interpretations for "Tools, Not Agents"

  1.  **Locus of Control**
      *   **Reading:** A tool requires explicit human invocation for every atomic action, whereas an agent executes a chain of actions from a high-level prompt.
      *   **Tag:** Defensible.
      *   **Rules out overnight PRs?** Yes.
      *   **Meeting Reality:** This is the most common surface-level meaning people reach for.
      *   **Does it work?** It fails on edge cases like spellcheckers or cron jobs, but it successfully distinguishes "suggest vs. ship" in your specific context.

  2.  **Liability Allocation**
      *   **Reading:** A tool transfers liability for outcomes to the user, whereas an agent retains liability with the vendor.
      *   **Tag:** Defensible.
      *   **Rules out overnight PRs?** Yes, unless your org accepts liability for broken production.
      *   **Meeting Reality:** This is the actual subtext driving the fear, though rarely stated explicitly.
      *   **Does it work?** Yes, this is the only reading that addresses the actual business risk rather than semantic purity.

  3.  **Temporal Scope**
      *   **Reading:** A tool completes a single defined step, whereas an agent pursues a goal across multiple steps without intermediate confirmation.
      *   **Tag:** Defensible.
      *   **Rules out overnight PRs?** Yes (multi-step loop), but allows the "pre-approved scope" middle option.
      *   **Meeting Reality:** High; this matches the "scaffolding" argument you noted.
      *   **Does it work?** Yes, this provides a clear engineering boundary for the "middle option" compromise.

  4.  **Goal Optimization**
      *   **Reading:** A tool optimizes for immediate task completion, whereas an agent optimizes for long-term outcome achievement.
      *   **Tag:** Defensible.
      *   **Rules out overnight PRs?** Yes.
      *   **Meeting Reality:** Medium; people use words like "goals" loosely to mean "surprises."
      *   **Does it work?** No, because chess engines and compilers have goals/outcomes but are universally considered tools.

  5.  **Intrinsic Architecture**
      *   **Reading:** The model weights themselves determine whether the system is a tool or an agent.
      *   **Tag:** False.
      *   **Rules out overnight PRs?** No, because the weights are identical in both shipping scenarios.
      *   **Meeting Reality:** High; people often treat "agent" as a model type rather than a deployment mode.
      *   **Does it work?** No, this creates confusion because the same API can be wrapped as either.

  ### Verdict on Your Hypothesis

  Your "relation, not property" idea is a real and defensible position known in philosophy of technology as **functional agency** or **delegated authority**. It correctly identifies that agency is conferred by the user's delegation of decision-making power, not by the system's internal weights. This reading does the most work for your team: it allows you to ship the "overnight PR" feature *as a tool* if you structure the deployment so the human explicitly delegates that specific authority window (e.g., signing a waiver or setting a specific "night mode" scope), rather than treating the capability as inherently forbidden.
