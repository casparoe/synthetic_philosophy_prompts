  I'm on a philosophy of moral responsibility course and we've just done Strawson's reactive attitudes essay. I keep thinking his split between reactive and objective attitdues doesn't quite cover what happens when people blame things like algorithms or big institutions—there's no single agent, but the feeling still isn't detached or clinical. Please argue that Strawson's binary actually colapses in cases of collective harm, say when a credit-scoring system denies loans unfairly, because our resentment there is still participatory rather than objective. From that, make the case for a third category—'structural reactive attitudes'—that his framework misses entirely. Don't bother with a bibliography or page references; I just want the argument built out from the concepts he actually uses, and maybe flag where it feels weakest. My tutor reckons I'm overcomplicating it, but I think there's something real here.
