answer: |-
  This is a compelling intuition, and your tutor's skepticism is likely rooted in a desire to keep Strawson's framework tidy. However, Strawson's project in "Freedom and Resentment" is descriptive—he is trying to map how we *actually* feel and operate in moral life, not just how we *should* logically categorize things. If our actual moral experience involves blaming systems without feeling detached, then his map is incomplete.

  Here is an argument built from Strawson's own concepts to support your case for "Structural Reactive Attitudes," followed by an honest assessment of where the argument is most vulnerable.

  ### 1. The Collapse of the Binary in Collective Harm

  Strawson's central distinction rests on the **participant stance** versus the **objective stance**.

  *   **Reactive Attitudes (Participant Stance):** These are emotions like resentment, gratitude, and indignation. They are "reactive" because they are responses to the quality of will others display toward us. They presuppose that the other is a moral agent capable of goodwill or ill will. Crucially, they are *participatory*; they keep us engaged in the human community.
  *   **Objective Attitudes:** These are detached, clinical, or managerial. We take this stance toward objects, natural forces, or humans we view as exempt (the insane, the very young). We do not feel *wronged* by a storm; we feel endangered. We manage the storm; we do not reason with it.

  **The Credit-Scoring Problem**
  Consider your example: a credit-scoring algorithm denies a loan unfairly due to biased historical data.

  If we apply Strawson's binary strictly, we are forced into a corner:
  1.  **Option A (Objective):** We treat the algorithm/bank as a non-agent. We adopt a detached stance. We analyze the code, fix the bug, or regulate the industry. We feel no resentment, only a need for management.
  2.  **Option B (Reactive):** We treat the algorithm as a moral agent. We resent it as if it *intended* to slight us. We demand it feel guilt.

  Neither fits the phenomenology.
  *   It is not **Option A**, because the victim does not feel detached. They feel *insulted*. They feel a sense of injustice that burns. They do not view the denial as a natural disaster (like an earthquake); they view it as a normative failure. They want to protest, not just repair.
  *   It is not **Option B**, because no sane person believes the algorithm has a mind. We know there is no "ill will" in the code.

  Here is where the binary collapses. We are holding a **participant stance** (we feel the heat of resentment, we demand accountability) toward a target that logically requires an **objective stance** (it is a non-agential structure).

  For Strawson, reactive attitudes are the glue of human relationships. But in modern life, the "relationships" that harm us most are often with structures, not individuals. If we say our resentment here is "irrational" (because there's no agent), we are dismissing a massive chunk of real-world moral experience. If we say it is "objective," we are lying about how it feels.

  ### 2. Arguing for "Structural Reactive Attitudes"

  To fix this, we need a third category: **Structural Reactive Attitudes**. This category preserves the *heat* of the reactive stance without requiring the *individual agent* that Strawson thinks is necessary.

  **A. The Target: Norms rather than Wills**
  Standard Strawsonian resentment targets a specific *will* ("You disregarded me"). Structural reactive attitudes target a *set of norms or practices* ("This system disregards people like me").
  The object of the attitude shifts from the *psychology of the other* to the *architecture of the interaction*. You are not blaming a mind; you are blaming a pattern of exclusion.

  **B. The Demand: Regard from the Community, not the Machine**
  Strawson says reactive attitudes embody a demand for goodwill. In structural cases, this demand is not directed at the algorithm (which can't hear it), but at the **community that sustains the structure**.
  When you resent the credit score, you are issuing a demand to society: *"This structure violates the terms of participation we owe each other."*
  This keeps it "reactive" in Strawson's sense—it is a plea for recognition within the moral community—but it acknowledges that the barrier to recognition is structural, not interpersonal.

  **C. The Function: Modification of Practice, not Will**
  Standard reactive attitudes aim to modify the other's will (make them apologize, make them stop). Structural reactive attitudes aim to modify the *rules of engagement*.
  The "guilt" associated with this isn't felt by a person, but manifests as **liability** or **reparations**. The "resentment" manifests as **political protest** or **litigation**. It is still participatory—we are fighting for our standing in the community—but the mechanism is structural reform rather than interpersonal reconciliation.

  ### 3. Where the Argument is Weakest (The Tutor's Counter)

  You need to be prepared for where a Strawsonian will push back. Your tutor might say you are overcomplicating it because Strawson actually *does* have resources to handle this, or because your third category creates more problems than it solves.

  **Weakness 1: The "Generalized Indignation" Defense**
  Strawson distinguishes between *personal* reactive attitudes (resentment) and *vicarious/moral* reactive attitudes (indignation). Indignation is what we feel when someone violates a moral rule, even if they didn't hurt us personally.
  *   *The Tutor's Point:* Your "structural" attitude is just **Indignation**. We feel indignation that the *designers* or *CEOs* allowed this system. We don't need a new category; we just need to locate the responsible humans upstream.
  *   *Your Rebuttal:* This fails in cases of **distributed harm**. In algorithmic bias, often no single human intended the harm. It emerges from thousands of small decisions and historical data. If we say "just blame the CEO," we are inventing a villain to fit Strawson's theory. Structural reactive attitudes allow us to blame the *outcome* without needing to find a specific *villain*.

  **Weakness 2: The Category Error (The "Straw Man" Problem)**
  Strawson argues that reactive attitudes are constitutive of human relationships. To have a reactive attitude toward a non-human is, for Strawson, a category error—like being angry at a door for hitting your shin.
  *   *The Tutor's Point:* If you introduce "Structural Reactive Attitudes," you are diluting the definition of "reactive." If we can have reactive attitudes toward systems, why not toward storms? Where does it stop?
  *   *Your Rebuttal:* The distinction is that systems are **human creations imbued with norms**. A storm is nature; a credit algorithm is frozen human policy. Resenting the algorithm is actually a way of resenting the *human choices solidified in code*. It remains within the human community, unlike resentment toward nature.

  **Weakness 3: The Loss of the "Interpersonal"**
  Strawson's whole point is that responsibility is about *interpersonal relationships*.
  *   *The Tutor's Point:* By moving to structures, you lose the "face-to-face" element that makes responsibility meaningful. You can't negotiate with a structure.
  *   *Your Rebuttal:* This is exactly why we need the new category. The "face-to-face" model is outdated for institutional harm. If we stick strictly to Strawson, we are forced to say victims of structural harm are irrational for feeling resentment. A theory of moral responsibility that calls the oppressed "irrational" for resenting their oppression is flawed.

  ### Summary for your Essay

  Your argument is that Strawson's binary forces a false choice: either we treat harmful institutions as moral agents (which they aren't) or as natural forces (which they don't feel like).

  By proposing **Structural Reactive Attitudes**, you argue that we can maintain the **participant stance** (the feeling of being wronged, the demand for justice) while shifting the target from **individual will** to **structural norms**.

  **The Critical Flag:**
  Acknowledge that the weakest point is whether this is truly a *new* attitude or just a misapplication of **Indignation**. To win the argument, you must prove that structural harm often exists where no specific agent is liable enough to warrant standard indignation, yet the demand for accountability remains just as hot and personal as resentment.

  Your tutor thinks you are overcomplicating it because they want to preserve Strawson's clean interpersonal model. You are arguing that the model breaks when the "person" is replaced by the "system," and if philosophy ignores that, it ignores the reality of modern blame.
