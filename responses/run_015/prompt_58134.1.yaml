answer: |-
  # The Tripartite Liberty Screen (TLS)
  **For Use by Policy Review Analysts**

  **Purpose:** To identify potential liberty impacts of proposed ordinances and rules within a 60-minute review window.
  **Scope:** Advisory only. Final authority rests with the City Council.
  **Definitions for Analysts:**
  *   **Negative Liberty:** Is the citizen directly stopped or penalized for an action? (Interference)
  *   **Republican Liberty:** Is the citizen subject to someone else's arbitrary whim, even if that whim is rarely exercised? (Domination/Discretion)
  *   **Positive Liberty:** Does the citizen lack the real capacity or viable alternatives to make a meaningful choice? (Duress/Capacity)

  ---

  ## Part I: The Decision Procedure

  ### Step 1: Negative Liberty Check (Interference)
  **Question:** Does the proposal criminalize, penalize, or physically prevent a specific action that is currently lawful and feasible?
  *   **Evidence:** Look for "shall not," "prohibited," "fine," "arrest," or physical barriers in the text.
  *   **If NO:** Proceed to Step 2.
  *   **If YES:**
      *   **Mitigation:** Can the prohibition be narrowed (e.g., time, place, manner) to reduce the burden while meeting the policy goal?
      *   **Staff Judgment:** If the restriction is standard (e.g., noise limits) and narrowly tailored, **Clear** with a note.
      *   **Council Flag:** If the restriction is broad or targets expressive/conduct rights, **Flag for Council**.
      *   *Plain Language Explanation:* "This proposal stops residents from doing X. To mitigate, consider allowing X under conditions Y."

  ### Step 2: Republican Liberty Check (Arbitrary Power)
  **Question:** Does the proposal grant an official the power to make decisions affecting rights or benefits without clear criteria, without a right to appeal, or without a requirement to explain the decision?
  *   **Evidence:** Look for "may," "in the discretion of," "without cause," "final determination," or lack of appeal process.
  *   **Crucial Distinction:** It does not matter if the power is *rarely used*. It matters if the power *exists*.
  *   **If NO:** Proceed to Step 3.
  *   **If YES:**
      *   **Mitigation:** Can written criteria, a reporting requirement, or an appeal process be added?
      *   **Staff Judgment:** If discretion is necessary for emergency/safety *and* safeguards are added, **Clear** with note.
      *   **Council Flag:** If discretion is unbounded and affects significant interests, **Flag for Council**.
      *   *Plain Language Explanation:* "This proposal gives Officer X the power to decide Y without rules or review. Even if used rarely, this places residents under the control of another. To mitigate, add criteria Z."

  ### Step 3: Positive Liberty Check (Capacity & Duress)
  **Question:** For "voluntary" programs or conditional benefits: Do participants face such severe consequences for non-participation that their consent is coerced by circumstance rather than genuine choice?
  *   **Evidence:** Testimony on alternatives, data on eligibility exclusivity, severity of penalty for non-compliance (e.g., eviction vs. loss of bonus).
  *   **If NO:** **Clear**.
  *   **If YES:**
      *   **Staff Judgment:** This is a **Value Judgment for Council**. Staff cannot determine if the benefit justifies the pressure.
      *   **Council Flag:** **Flag for Council**.
      *   *Plain Language Explanation:* "While voluntary, the lack of alternatives means residents may feel forced to accept conditions they would otherwise reject. The Council must decide if the benefit outweighs the pressure."

  ### Step 4: Final Determination
  *   **Clear:** No flags raised, or mitigations adopted.
  *   **Flagged (Mitigable):** Return to drafting department with specific liberty-preserving edits.
  *   **Flagged (Value Judgment):** Send to Council with "Liberty Impact Statement" detailing the trade-off.

  ---

  ## Part II: Limitations & Misfires
  **Analysts must acknowledge the following simplifications:**
  1.  **The "Rare Use" Blind Spot:** The Republican Check treats unused power as dangerous. In practice, some discretion is efficient. This procedure may over-flag efficient administrative flexibility.
  2.  **The "Desperation" Threshold:** The Positive Liberty Check relies on identifying "no viable alternatives." Analysts are not social workers; determining what counts as "desperate" involves subjective judgment.
  3.  **Conflict of Liberties:** This procedure identifies conflicts but cannot resolve them. (e.g., One group's Negative Liberty [noise] conflicts with another's Positive Liberty [quiet sleep]). This requires Council value judgment.
  4.  **Judgment Points:** Staff judgment cannot be eliminated at the "Mitigation" stage. Determining if a safeguard is "sufficient" is a normative call, not a factual one.

  ---

  ## Part III: Application to Pending Proposals

  ### Case 1: Park-Hours Ordinance
  *   **Proposal:** Closes parks overnight. Officers may permit overnight presence for "good cause" with no published criteria and no review of refusals. Enforcement is stated to be rare.
  *   **TLS Application:**
      *   **Step 1 (Negative):** Yes, prohibits overnight presence. *Mitigation:* Time-limited restriction is standard for parks. **Pass.**
      *   **Step 2 (Republican):** **YES.** Officers have unqualified discretion ("good cause" undefined) with no appeal. The fact that enforcement is "rare" is irrelevant under TLS Step 2.
      *   **Step 3 (Positive):** N/A.
  *   **Determination:** **Flag for Council (Republican Liberty).**
  *   **Plain Language Explanation:** "This ordinance gives police officers the power to decide who can stay in the park at night without any rules to guide them and no way to appeal their decision. Even if they promise to use this power rarely, the power itself places park users at the mercy of individual officers."
  *   **Mitigation:** Require written criteria for "good cause" and a simple administrative review process for denials.
  *   **Likely Friction:** Unwelcome to Police Department and Council members prioritizing operational flexibility over procedural due process.

  ### Case 2: Sanitation-Department Scheduling
  *   **Proposal:** Optimization tool assigns shifts; honors preferences. Policy reserves supervisors unqualified right to reassign without explanation or appeal. Seldom used.
  *   **TLS Application:**
      *   **Step 1 (Negative):** No, employees are not prohibited from action, though work conditions change. **Pass.**
      *   **Step 2 (Republican):** **YES.** Supervisors hold unqualified right to reassign without explanation/appeal. The "seldom use" defense is explicitly rejected by TLS Step 2.
      *   **Step 3 (Positive):** N/A.
  *   **Determination:** **Flag for Mitigation (Republican Liberty).**
  *   **Plain Language Explanation:** "Employees are subject to the arbitrary power of supervisors. Even if shifts are rarely changed, the rule means an employee's schedule depends on a supervisor's whim rather than a known rule."
  *   **Mitigation:** Require "business necessity" justification for reassignment and a 24-hour notice period.
  *   **Likely Friction:** Unwelcome to HR/Management who view the "unqualified right" as necessary for emergency operational coverage.

  ### Case 3: Voluntary Anti-Poverty Program
  *   **Proposal:** Rental assistance conditioned on financial course and quarterly spending reviews. Eligible residents face eviction without it; no comparable alternative exists.
  *   **TLS Application:**
      *   **Step 1 (Negative):** No, participation is technically voluntary. **Pass.**
      *   **Step 2 (Republican):** Potential concern on caseworker discretion during spending reviews, but secondary to the main issue. **Pass for now.**
      *   **Step 3 (Positive):** **YES.** Residents report facing eviction without assistance and have no comparable alternative. The "choice" to accept monitoring is driven by the threat of homelessness.
  *   **Determination:** **Flag for Council (Value Judgment).**
  *   **Plain Language Explanation:** "While the program is voluntary, the lack of other housing options means residents may feel forced to accept privacy intrusions they would otherwise reject. The Council must decide if the housing benefit justifies the pressure placed on participants' autonomy."
  *   **Mitigation:** None available without altering the fundamental structure of the aid (e.g., unconditional cash assistance).
  *   **Likely Friction:** **Highly Unwelcome to Program Advocates.** This flags a popular social safety net program as potentially coercive, challenging the narrative that "voluntary" conditions are inherently free of liberty concerns.

  ---

  ## Part IV: Conclusion on Unsettled Matters

  This procedure cannot settle the **weight** of competing liberties. In Case 1, the public's Negative Liberty (safety from vandalism) conflicts with the user's Republican Liberty (freedom from arbitrary police power). In Case 3, the Positive Liberty (capacity to house oneself) is enhanced by the program, but at the cost of Positive Liberty (freedom from coercive circumstance).

  The TLS identifies the *structure* of the constraint, but it cannot calculate the *value* of the trade-off. Determining whether safety, efficiency, or survival justifies a liberty cost is a political question, not an analytical one. That determination remains the exclusive province of the elected Council.
