      *   *Negative Liberty:* Is someone being stopped from doing something they could otherwise do? (Interference/Coercion).
      *   *Positive Liberty:* Do people have the actual capacity/resources to choose, or are they forced by circumstance/addiction/ignorance? (Capacity/Enablement). *Note: In policy review, this often flips. Does the policy *enhance* capacity, or does it *rely* on a lack of capacity to coerce?*
