          *   Step 2: Republican Liberty (Arbitrary Power).
          *   Step 3: Positive Liberty (Capacity/Constraint).
          *   Step 4: Mitigation & Council Flag.
      *   *Simplification:* Avoid deep philosophical debate. Focus on *mechanisms* (rules, discretion, resources).
      *   *Judgment Calls:* Need to explicitly state where analysts must make a call vs. where they pass it to the Council.

      *(Self-Correction during drafting)*: Make sure the distinction between Negative and Republican is clear. Negative = "You can't do X." Republican = "I can stop you from doing X whenever I want, even if I usually don't."
      *(Self-Correction on Positive)*: Positive liberty is tricky for regulators. Usually, it's about whether a "voluntary" program is actually coercive due to lack of alternatives (duress).

  4.  **Developing the Three Cases:**

      *   **Case 1: Park Hours.**
