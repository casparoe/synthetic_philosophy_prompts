answer: |-
  # Instructor's Map: The Logical Space

  Before handing out the instrument, here is the taxonomy of positions derived from the distinctions you requested. This map informs the scoring key.

  ### The Branching Structure
  1.  **Conflict Resolution:** When two claims clash ($P$ and $\neg P$), do we:
      *   **A:** Reject one? (Monism)
      *   **B:** Accept both? (Contradiction-Tolerance / Qualification)
      *   **C:** Reject language itself? (Ineffabilism)
      *   **D:** Dissolve the clash? (Deflationism/Verbalism)

  2.  **Location of Fault (If B or D):**
      *   **In the World:** Reality has incompatible features.
      *   **In the Words:** We are using terms with hidden parameters (e.g., "good *for what*").

  3.  **The Total View (Omniscience Test):**
      *   **Possible:** A complete account exists (even if humans can't hold it).
      *   **Impossible:** Partiality is fundamental; no "view from nowhere" exists.
      *   **Silent:** A complete account exists but cannot be spoken.

  4.  **Self-Application:**
      *   Does the rule apply to itself? (e.g., Is "all claims are partial" itself a partial claim?)

  ### The Leaves (Positions)
  *   **Hard Monist:** One description is correct; others are errors. Total view possible and singular.
  *   **Verbal Deflationist:** Disagreements are due to unstated parameters. Add a clause, fix the truth. Total view is just the sum of all clarified sentences.
  *   **Domain Separatist:** Truth changes nature across domains (physics vs. carpentry). No conflict because the domains don't overlap.
  *   **Contradiction Tolerator (Dialetheist):** Reality contains literal contradictions. $P$ and $\neg P$ are both true in the same respect.
  *   **Ineffabilist (Determinate):** Reality is one/determinate, but language cannot reach it. "Can't be said" means *we* lack the capacity.
  *   **Ineffabilist (Indeterminate):** Reality itself is unsettled. "Can't be said" means *nothing* makes it true or false.
  *   **Jain Anekāntavādin:** Reality has infinite aspects. No single sentence captures it. Contradictions are managed via the 7-mode scheme (qualification). A total view exists (omniscient being) and asserts all modes simultaneously. The doctrine applies to itself (it is also qualified).
  *   **Framework Internalist:** Truth is valid only inside a system. No external arbitration is possible. (Note: Hard to distinguish from Domain Separatist without the Omniscience Test).

  ### Empty or Unstable Leaves
  *   **Monist + No Total View:** Incoherent. If there is only one truth, it is in principle statable by someone.
  *   **Verbal Deflationist + Contradiction Tolerant:** Incoherent. If the dispute is verbal, there is no contradiction to tolerate.
  *   **Jain + Self-Exempt:** Unstable. If "all claims are qualified" is unqualified, it refutes itself.

  ### Indistinguishable Leaves (with this instrument)
  *   **Quietist vs. Ineffabilist:** Both end in silence. Distinguishing them requires asking *why* they are silent (boredom vs. awe), which is hard to capture in multiple choice.
  *   **Framework Internalist vs. Domain Separatist:** Both say "Both are true." Distinguishing them requires asking if the domains *could* merge. I have flagged this in the key.

  ---

  # Student Handout: Mapping Disagreement

  **Instructions:** Below are eight scenarios involving disagreement or description. For each, select the **single option** that best matches your intuition. Do not worry about consistency yet; just answer what seems right to you in the moment. There are no right or wrong answers.

  **1. The Smashed Pot**
  A clay pot is dropped and shatters. The clay fragments lie on the floor. Someone says, "The pot is gone." Another says, "The pot is still here; the clay is all there."
  *   A. The pot is gone. The form is essential; without it, it is just clay.
  *   B. The pot is still here. The matter is essential; the stuff hasn't vanished.
  *   C. Both statements are correct. It is a pot in one way, and not a pot in another.
  *   D. Neither statement is adequate. The reality of the object cannot be captured by "is" or "is not."

  **2. The Eyewitnesses**
  At a crowded demonstration, two honest witnesses watch the same police action. One says, "The police were violent." The other says, "The police showed restraint."
  *   A. One of them is mistaken or lying. They cannot both be right.
  *   B. Both are describing real features of the event, depending on where they stood.
  *   C. The event is too complex for these words. We should not say either.
  *   D. They are using "violent" and "restraint" to mean different things.

  **3. The Table**
  A physicist describes the table as "mostly empty space with vibrating fields." A carpenter describes it as "solid wood."
  *   A. The physicist is describing what the table *really* is. The carpenter is describing how it *appears*.
  *   B. The carpenter is describing what the table *is* for us. The physicist is describing a mathematical model.
  *   C. Both descriptions are true. The table is solid and it is mostly empty space.
  *   D. Neither description reaches the nature of the table itself.

  **4. The Knife**
  You have a serrated knife. It cuts bread perfectly. It ruins the skin of a raw fish.
  *   A. It is a good knife. Its primary function is working.
  *   B. It is a bad knife. A proper knife should handle delicate tasks.
  *   C. It is a good bread-knife and a bad fish-knife. The quality depends on the task.
  *   D. Words like "good" and "bad" do not apply to the knife itself.

  **5. The Boundary**
  Consider the edge of the physical universe. Does space have a boundary there?
  *   A. Yes, it must end somewhere.
  *   B. No, it is infinite or loops back.
  *   C. Both. It has a boundary and it does not.
  *   D. It cannot be put into words. To speak of it is to misunderstand.

  **6. The Self-Test**
  Consider the claim: "Every statement about reality is only partially correct."
  *   A. This claim is fully correct. It is the one exception.
  *   B. This claim is also only partially correct.
  *   C. This claim is false. Some statements are fully correct.
  *   D. This claim cannot be stated meaningfully.

  **7. The Omniscience Test**
  Imagine a being who knows everything about the Table (from Question 3) perfectly. What does this being say?
  *   A. "It is solid."
  *   B. "It is mostly empty space."
  *   C. "It is solid, and it is mostly empty space, and it is indescribable."
  *   D. The being says nothing. Language fails even for this being.

  **8. The Add-a-Clause Test**
  Return to the Eyewitnesses (Question 2). Can we make both statements true by adding words to them?
  *   A. No. One statement must be removed.
  *   B. Yes. Add "from my position" to both sentences.
  *   C. No. Adding words does not fix the gap between language and the event.
  *   D. Yes, but we would need to add so many clauses that the sentences become useless.

