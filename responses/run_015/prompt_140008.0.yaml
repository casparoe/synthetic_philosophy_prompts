  # Scoring Key & Profile Matcher

  **Do not look at this until you have answered all 8 questions.**

  This key does not give you a "score." It matches your pattern of answers to a philosophical position. Find the profile below that best matches your selection history.

  ### Profile 1: The Single-View (Hard Monist)
  *   **Your Answers:** Mostly **A** or **B**. You rarely chose C or D.
  *   **Your Position:** You believe that for any event, there is one complete description that matches reality. If two claims clash, one must be wrong.
  *   **Logical Location:** You locate the conflict in *error*. One party has failed to match the world.
  *   **Blind Spot:** You may struggle to explain why honest experts (like the physicist and carpenter) persistently disagree without one being "wrong."

  ### Profile 2: The Parameterizer (Verbal Deflationist)
  *   **Your Answers:** Mostly **C** on Questions 2, 4, and 8. You chose **B** on Question 6.
  *   **Your Position:** You believe disagreements are usually due to missing information. If we specify the context ("good *for bread*," "violent *from the left*"), the conflict vanishes.
  *   **Logical Location:** You locate the conflict in *language*. The world is fine; our sentences are elliptical.
  *   **Blind Spot:** This works for knives, but can it handle the Smashed Pot? Is "pot" just a hidden parameter, or is the ontology itself split?

  ### Profile 3: The Domain Separatist
  *   **Your Answers:** **C** on Question 3 (Table). **B** or **C** on Question 2. **A** or **C** on Question 7.
  *   **Your Position:** You believe truth operates differently in different areas (physics vs. carpentry). Claims don't clash because they belong to different games.
  *   **Logical Location:** You locate the conflict in *categorization*.
  *   **Blind Spot:** Does the universe respect our boundaries? Can a physicist fix the table? If so, the domains overlap.

  ### Profile 4: The Contradiction Tolerator (Dialetheist)
  *   **Your Answers:** **C** on Question 1, 3, and 5. **A** on Question 6 (The rule doesn't apply to itself). **B** or **C** on Question 7.
  *   **Your Position:** You believe reality can contain genuine contradictions. It is possible for $P$ and $\neg P$ to both be true in the same respect.
  *   **Logical Location:** You locate the conflict in *the world*. The world is inconsistent.
  *   **Blind Spot:** You must accept that logic as traditionally understood is flawed.
  *   **Distinction:** Unlike the Jain view, you do not require the "indescribable" mode. You are happy with "Both."

  ### Profile 5: The Silence Keeper (Ineffabilist)
  *   **Your Answers:** Mostly **D**. Especially on Question 5 and 7.
  *   **Your Position:** You believe language is fundamentally incapable of capturing reality. The truth is either too high (determinate but unsayable) or too vague (indeterminate).
  *   **Logical Location:** You locate the conflict in *the gap between mind and world*.
  *   **Blind Spot:** If nothing can be said, can you say *that*? (See Question 6).
  *   **Distinction:** Unlike the Jain view, you do not believe an omniscient being could speak the truth (Question 7). For you, silence is the final answer, even for a god.

  ### Profile 6: The Seven-Mode Navigator (Jain Anekāntavādin)
  *   **Your Answers:** **C** on Question 1 and 3. **D** or **C** on Question 5. **B** on Question 6 (Self-qualifying). **C** on Question 7 (Omniscient asserts all modes). **B** or **C** on Question 8.
  *   **Your Position:** You believe every claim captures a facet of reality but misses the whole. Contradictions are managed by qualifying the "respect" (mode). A total view exists, but it requires holding all 7 modes at once, which humans cannot do.
  *   **Logical Location:** You locate the conflict in *partiality*. The world is complex; our access is limited; but the total view is possible (for a perfected being).
  *   **Distinction:**
      *   Vs. **Contradiction Tolerator:** You use "indescribable" (Mode 4) where they use "both." You qualify the truth; they accept the contradiction.
      *   Vs. **Ineffabilist:** You believe the total view *can* be spoken (by an omniscient being), whereas they believe silence is final.
      *   Vs. **Parameterizer:** You believe the qualification is ontological (in the thing), not just linguistic (in the sentence).

  ### Profile 7: The Framework Internalist
  *   **Your Answers:** **B** on Question 2 and 3. **D** on Question 7 (Omniscience is irrelevant).
  *   **Your Position:** Truth is valid only within a system of belief. There is no "outside" to judge between the physicist and the carpenter.
  *   **Logical Location:** You locate the conflict in *incommensurability*.
  *   **Note:** This is hard to distinguish from the Domain Separatist without asking if the frameworks can ever merge. If you think they *cannot* merge, you are here. If you think they *could* but haven't yet, you are a Domain Separatist.

