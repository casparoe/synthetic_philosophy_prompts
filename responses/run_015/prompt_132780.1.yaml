          *   *Interlocutor B (Representationalist/Phenomenologist):* Argues suffering requires encoding states as undesirable for *itself* across possible futures (counterfactual), which model-free lacks.
      *   **Key Debates:** Global integration of scalar signal vs. counterfactual self-representation; decoupling valence from content.
      *   **Tone:** Workshop discussion, direct responses, no straw-manning, minor concessions allowed, core disagreement firm. No citations.

  2.  **Character Conception:**
