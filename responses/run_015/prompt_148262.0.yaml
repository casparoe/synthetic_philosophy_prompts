      *   **Constraints:** American English, no bibliographies/reading lists, defend ranking with explicit criteria (not appeal to authority).

  2.  **Deconstruct the Core Problem:**
      *   The "DNA as Code" metaphor is ubiquitous but philosophically contentious. Is it *really* information/semantics, or just causal chemistry?
