      *   *Verbal vs. Substantive:* There is likely a verbal component regarding the definition of "equal." If "equal" means "maximally similar in normative force," parity might look like inequality. If "equal" means "permissibly interchangeable," parity looks like equality. But the Sorites argument suggests a deeper structural disagreement.
      *   *Different Questions:* Position 1 & 2 are largely metaphysical/semantic about value relations. Position 3 is practical/agential. Position 1 & 2 *do* overlap on "what is true of values," but Position 1 leans towards "what reasons exist" while Position 2 leans towards "what the value facts are."
