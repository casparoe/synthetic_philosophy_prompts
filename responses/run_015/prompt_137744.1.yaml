      *Wait, let's look closer at the finance term.* "Alpha Decay" is definitely the right term for the *value* dropping. The *mechanism* is Reflexivity. The *ethical tension* is the Transparency-Alpha Tradeoff.
      I will validate "Alpha Decay" as the primary label for the economic phenomenon, but coin **The Transparency-Alpha Tradeoff** for the specific ethical/operational bind they are in.

