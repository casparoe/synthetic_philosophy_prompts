answer: |-
  This is a sophisticated problem, and the fact that you are running into it means you are actually using the framework correctly. Most committees treat "neglectedness" as a static property of a cause (like the height of a mountain). You have discovered it is a dynamic property of a *system* (like the depth of snow on a mountain, which changes when you ski on it or tell others where to ski).

  Here is the breakdown of the concepts, the naming, and how to handle the framework itself.

  ### 1. Is there a name for this?

  Your friend in finance was right: **Alpha Decay** is a real term, not just desk slang. In quantitative finance, "alpha" is the excess return on an investment relative to a benchmark. "Alpha decay" describes how that edge erodes over time as more market participants discover and exploit the same inefficiency.

  However, Alpha Decay describes the *result*, not the *mechanism*. The mechanism you are describing—where the act of measuring or signaling changes the underlying reality—is best described by **Reflexivity**. Coined by George Soros (and rooted in sociology), reflexivity describes a feedback loop where participants' views influence the situation they are observing. In your case, your *analysis* of the funding landscape changes the *funding landscape*.

  For the specific tension you are feeling—the conflict between being transparent and preserving the value of the opportunity—I propose we coin the term:

  **The Transparency-Alpha Tradeoff**

  **Definition:** The inverse relationship between a funder's commitment to public transparency and the longevity of their high-leverage opportunities. As transparency increases, information asymmetry decreases, causing "neglected" opportunities to become crowded faster, thereby reducing the funder's future marginal impact per dollar.

  **What counts:** A foundation delaying a press release to prevent a land-speculation spike; a researcher withholding a specific methodology to prevent premature saturation.
  **What doesn't count:** Secrecy for legal compliance; secrecy to hide poor performance; general market competition where no signaling occurred.

  ### 2. Deconstructing the Three Elements

  You asked if this is one thing or several. It is a chain reaction of three distinct established concepts.

  **(a) The recommendation going stale**
  *   **Nearest Concept:** **Arbitrage Exhaustion.**
  *   **The Fit:** In efficient markets, profit opportunities (arbitrage) exist only until someone spots them. Once spotted, capital flows in, prices adjust, and the opportunity vanishes. Your "high score" was essentially an arbitrage opportunity (high impact per dollar).
  *   **Where it breaks:** Philanthropy isn't a market. Prices don't clear instantly. An opportunity can be "exhausted" not because it's solved, but because the *coordination cost* drops when a big player enters. The "staleness" is often about loss of *control* or *marginal utility*, not total solution.

  **(b) The analyzing and telling being part of what makes it stale**
  *   **Nearest Concept:** **The Observer Effect (Social Reflexivity).**
  *   **The Fit:** In physics, measuring a particle changes its state. In social systems, publishing a measurement changes human behavior. By publishing your note, you didn't just describe the world; you edited it. You lowered the "search cost" for the larger funder.
  *   **Where it breaks:** The Observer Effect usually implies an unavoidable physical consequence. Here, the effect is optional. You *chose* to forward the note. This makes it a strategic decision, not a law of nature.

  **(c) The pull toward silence**
  *   **Nearest Concept:** **Information Hazard / Perverse Incentive.**
  *   **The Fit:** An information hazard is knowledge that causes harm when disseminated. Your framework has created a perverse incentive: to maximize the metric (Neglectedness), you must minimize information flow. This directly conflicts with the normative goal of philanthropy (field building, transparency).
  *   **Where it breaks:** In standard perverse incentives (like Goodhart's Law), the metric is usually gamed by lying. Here, the metric is "honest," but the honesty is costly. It's not corruption; it's a strategic dilemma.

  ### 3. Is the third factor specified wrong?

  **No, but it is specified *statically* when it should be *dynamic*.**

  The standard "Scale, Neglectedness, Tractability" framework (popularized by Effective Altruism) often treats Neglectedness as a snapshot: *"How much money is in this bucket right now?"*

  For a small foundation, that is the wrong variable. You should be measuring **Counterfactual Neglectedness**: *"How much money will be in this bucket given that we have identified it?"*

  If your analysis is good, you must assume that *someone else* will eventually find what you found. The only variable you control is *when*.
  *   **Episode 1** wasn't a failure of the framework; it was a success of **Leverage**. You spent $0 of your own capital (just time) to move a "much bigger funder." That is arguably a higher return on investment than spending your own $50k. The framework penalized you because it treats your $50k as the only unit of impact, ignoring your *signal* as a unit of impact.

  **The Specification Fix:**
  You need to add a time-horizon and a probability weight to the Neglectedness factor.
  *   *Old Score:* Current Funding Gap.
  *   *New Score:* (Current Funding Gap) × (Probability no one else funds it in 24 months).

  If you share your research, that probability drops, and the score drops. That is accurate! The score *should* drop. The problem is not the score; the problem is expecting the score to stay high after you've done your job.

  ### 4. Practical Advice for the Committee

  You are experiencing the growing pains of moving from "checkbook philanthropy" to "strategic philanthropy." Here is how to live with the **Transparency-Alpha Tradeoff** without becoming secretive:

  1.  **Lag Your Reporting:** You do not need to be real-time transparent. Publish your annual report 12 months after the grants are made. By then, the "alpha" has decayed naturally, and you can be fully transparent without accelerating the crowding.
  2.  **Aggregate Your Metrics:** Instead of publishing "We funded X because it had a neglectedness score of 9/10," publish "We funded a cohort of early-stage interventions in sector Y." This signals your priorities without handing over the specific arbitrage map.
  3.  **Reframe Episode 1 as "Field Building":** If your analysis brings in a big funder, count that as a win in your internal metrics, even if it ruins the "Neglectedness" score for future grants. You are a small foundation; your comparative advantage is not *capital* (you have little); it is *attention and curation* (you have agility).
  4.  **Accept the Decay:** A high "Neglectedness" score is a consumable resource, like a non-renewable fuel. You burn it to generate impact. If you find a cause that stays neglected forever, it usually means it's a black hole (money goes in, nothing comes out). The fact that the score collapses is evidence that the opportunity was real.

  **Summary:**
  You are suffering from **Reflexive Obsolescence**. Your success makes your map outdated. This is not a bug in the world; it is a feature of being an early mover. Do not hide your work, but do not expect the metrics to remain static after you have shone a light on them. Adjust the framework to value *signaling* as highly as *spending*.
