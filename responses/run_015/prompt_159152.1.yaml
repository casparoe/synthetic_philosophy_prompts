  **Least Confident:** **Term 4** (Unified Apparatus). I am least sure that one mechanism must explain both identity informativeness and belief substitution failures.

  **Moving the Needle:** A formal proof demonstrating that pragmatic accounts of belief reports inevitably generate contradictions in iterated ascriptions (e.g., "John believes that Mary believes that Hesperus...") would raise my credence significantly.

  **Settled:** This question would be settled not by experiment, but by the emergence of a single formal semantic framework that is universally adopted as the standard tool for linguistics and logic, rendering rival frameworks obsolete for technical work.
