  2. **0.65 (Obs), 0.35 (Lex)** — Observational convergence tracks worldly structure, whereas glossary learning is plausibly metalinguistic, making the cases disanalogous.
  3. **0.80** — Substitution failures in belief ascriptions resist purely pragmatic explanation because they persist under logical embedding and iteration.
  4. **0.55** — A mixed theory (semantic for belief, pragmatic for identity) is theoretically costly but remains a live option against a unified Fregean semantics.
  5. **0.90** — The cognitive triviality of 'a=a' is a robust phenomenological datum, even if its explanation depends on the semantic framework adopted.

  **Combination:** I calculated a weighted average, assigning 25% weight each to the core semantic claims (1, 2, 3), 15% to theoretical unity (4), and 10% to the datum's stability (5), then rounded to two decimals.

