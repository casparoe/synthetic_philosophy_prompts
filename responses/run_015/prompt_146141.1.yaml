answer: |-
  Here are eight technical questions designed for a deep-dive podcast interview on Tiered Disquotationalism. They avoid biographical intros and focus immediately on the structural tensions in her view.

  **1. The Boundary Problem & The Scope Ambiguity Defense**
  "You draw a hard line between atomic sentences, where 'true' is purely disquotational, and universal claims over infinite domains, where you admit a minimal correspondence role. Critics argue this boundary is unstable: if the motivation for correspondence is the lack of a concrete token to disquote, isn't that just an epistemic limitation rather than a semantic one? Why doesn't this pressure collapse the whole system into a full correspondence theory?"

  *   *[Anticipated Deflection]:* She will likely reply that this is merely a **scope ambiguity** in the truth predicate—that we aren't changing the *nature* of truth, just the logical scope of the operator to handle infinite conjunctions.
  *   *[The Hard Push]:* "If it's just a scope issue, the logic should remain invariant. But you're admitting a correspondence *relation* for the universal tier that you explicitly deny for the atomic tier. If the mechanism of truth-making changes based on the quantifier scope, aren't you effectively positing two different properties linked by homonymy? If so, what justifies using the single word 'true' other than historical accident?"

  **2. The Liar Paradox as Pragmatic Failure**
  "You treat the Liar sentence ('This sentence is false') not as a semantic contradiction but as a pragmatic failure of assertion. You argue it violates a norm of assertibility rather than breaking the logic of truth. But norms of assertion usually depend on the speaker's ability to represent a state of affairs. By grounding the failure in pragmatics, aren't you secretly smuggling in a hidden correspondence condition? i.e., the sentence fails *because* it fails to correspond to a fact, even if you refuse to call it that."

  **3. Mathematical Truth and Infinite Domains**
  "Let's look at 'There is no largest prime number.' On your view, is this true merely because we lack a token counterexample in our linguistic practice, or is it true because the infinite domain of numbers genuinely *lacks* such an entity? If you say the latter, you seem committed to the domain having a structure independent of our disquotational practices. Does this tiered view inadvertently commit you to a form of mathematical Platonism you might otherwise want to avoid?"

  **4. The SLM Test: Learning Generalization Without Correspondence**
  "Imagine a small language model trained exclusively on your atomic disquotational sentences—it sees 'Snow is white' is true, 'Grass is green' is true, but never sees a universal claim. If we then ask it to generalize to 'All emeralds are green,' could it learn that rule without implicitly representing a correspondence relation in its latent space? If the model *must* build a world-model to handle the generalization, doesn't that suggest the correspondence relation is cognitively primitive, undermining your claim that it's only a secondary, tiered addition?"

  **5. Negative Existentials and Truthmakers**
  "Consider 'There are no unicorns.' You grant this a correspondence role because there's no unicorn token to disquote. But what is the 'correspondent' here? Is it a negative fact? If you deny negative facts, you seem to be saying the sentence corresponds to the *absence* of something. But an absence isn't a thing. How do you cash out this 'minimal correspondence' without reifying the void, which seems metaphysically heavier than the disquotational base you started with?"

  **6. Univocality of the Truth Predicate**
  "If the atomic tier is deflationary and the universal tier is correspondence-heavy, does the word 'true' mean the same thing in 'It is true that snow is white' and 'It is true that all electrons have negative charge'? If you say yes, how do you explain the shift in metaphysical commitment? If you say no, aren't you vulnerable to the charge that you haven't solved the problem of truth, but merely relocated it to an ambiguity in the predicate?"

  **7. Epistemic Access to the Correspondence Tier**
  "For atomic sentences, I know 'Snow is white' is true because I can verify the token. For universal claims, you appeal to a correspondence with an infinite domain. How do we gain epistemic access to that correspondence? If we can't survey the infinite domain, isn't your 'minimal correspondence' functionally indistinguishable from idealized assertibility? If it is indistinguishable, why not just be a pure deflationist and save the metaphysical baggage?"

  **8. The Normative Force of Truth**
  "Finally, what is the normative cash value of this tiered system? If I assert a universal claim, and you correct me by saying 'That isn't true,' are you telling me I violated a linguistic rule (deflationary) or that I missed how the world is (correspondence)? If the normative force shifts between tiers, how do we navigate mixed inferences—arguments that move from atomic premises to universal conclusions—without committing a fallacy of equivocation mid-argument?"
