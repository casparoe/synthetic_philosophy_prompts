prompt: |-
  I commission history documentaries for a public broadcaster: around a dozen pitches a week, and lately maybe a third of them are alternative-chronology or ancient-astronaut material — Atlantis pinned to a specific site off a sonar anomaly, megaliths attributed to visitors from elsewhere, or the claim that long stretches of the documented past were fabricated by later chroniclers, so that one well-known empire is really a duplicate of another. Each pitch has to be routed to one of three outputs — commission as history, commission with an on-screen contested-history framing, or commission as labelled entertainment — and my written rationale goes to an editorial standards committee that has to defend it to the regulator if a complaint lands. I have about twenty minutes per pitch and no specialist on staff.

  I tried operationalising the obvious demarcation toolkit — falsifiability, and the progressive-versus-degenerating contrast for research programmes — and it misfired in both directions at once. The fabricated-chronology pitch scored better than a mainstream-revisionist pitch from a working archaeologist, because the former stated bold checkable predictions and the latter hedged everything in confidence intervals; and a pitch about an apparently anachronistic artifact was flagged purely for contradicting consensus, which is close to how archaeologists embarrassed themselves by dismissing anomalous sites that later turned out to be genuine. So I need something more robust than a falsifiability checklist.

  Please write me a decision procedure my producers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts (publicity, tone, whether a framing is condescending). It should be runnable in twenty minutes by a generalist, and should say what to do when an answer can't be obtained. In particular I want it to handle three things a naive version gets wrong: claims that must rewrite well-attested records — and so owe some account of why the records look the way they do — carry a different burden from claims that merely add an undocumented event; a claim's evidential bar should be tested for drift, i.e. whether it moves after an objection is answered; and the procedure needs an explicit guard against its own conservatism, so that surprise and conflict-with-consensus aren't treated as evidence of crankery.

  Then run it on three pitches: one arguing that a familiar empire is a duplicate created by chroniclers, with a stated prediction that no datable layer will be found at a named site between two centuries; one arguing that a megalithic alignment is too precise to be chance and that mainstream archaeology cannot explain the site at all; and one locating Atlantis at a specific place and date, whose proponent has publicly staked his reputation on a sediment core. My own hunch is that the third is the most respectable of the three, since it at least sticks its neck out — if the procedure disagrees, say so and tell me which step kills it.

  Finally: which distinctions have to survive the simplification into a checklist and which can safely be dropped, where the procedure cannot eliminate judgment, and what it cannot do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Commissioner for a public broadcaster (history documentaries).
      *   **Task:** Create a decision procedure (checklist/flowchart) for evaluating documentary pitches (specifically alternative history/ancient astronaut types).
      *   **Constraints:**
          *   ~20 minutes per pitch.
          *   No specialist staff (generalist producers).
          *   Must satisfy an editorial standards committee/regulator.
          *   Three outputs: Commission as History, Commission with Contested Framing, Commission as Labelled Entertainment.
          *   Must handle specific pitfalls:
              *   Falsifiability alone is insufficient (bold false claims score higher than nuanced true ones).
              *   Consensus contradiction isn't automatic disqualification (avoid conservatism bias).
              *   Burden of proof differs for rewriting records vs. adding events.
              *   Must detect "evidential drift" (moving goalposts).
              *   Must identify where human judgment is needed (values, tone).
      *   **Test Case:** Run the procedure on three specific pitches:
          1.  Duplicate Empire (Chronology Fabrication): Predicts no datable layer at Site X between Century A and B.
          2.  Megalithic Alignment: Too precise for chance, mainstream can't explain it.
          3.  Atlantis Location: Specific place/date, proponent staked reputation on sediment core.
      *   **Final Output:** Analysis of the procedure itself (what distinctions survive, where judgment remains, limitations).

  2.  **Deconstruct the Problem & Existing Failures:**

      *   *Failure 1: Falsifiability.* A crank can make a bold, falsifiable prediction that is almost certainly wrong (e.g., "No layer will be found"). A scientist makes nuanced claims with confidence intervals. The checklist favored the crank.
      *   *Failure 2: Consensus Bias.* Dismissing anomalies just because they contradict consensus leads to missing genuine discoveries (e.g., Gobekli Tepe initially).
      *   *Failure 3: Burden of Proof.* Claiming "Rome didn't exist" requires explaining why all the coins, texts, and ruins say it did. Claiming "There was a battle here" just needs evidence of the battle. The procedure must distinguish *revision* from *addition*.
      *   *Failure 4: Evidential Drift.* When challenged, does the proponent change the claim to avoid refutation?
      *   *Constraint:* 20 minutes. This means no deep literature review. It relies on *internal consistency* of the pitch and *external verification of process*, not deep fact-checking of content.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* A triage tool, not a truth machine. It assesses *methodological integrity* and *narrative responsibility*.
      *   *Structure:* Sequential gates. Fail a gate -> Drop or downgrade. Pass all -> Commission as History. Middle ground -> Contested/Entertainment.
      *   *Key Concepts to Embed:*
          *   **The Explanation of Error:** If you say the records are wrong, how did they get wrong? (Addresses the "Duplicate Empire" burden).
          *   **The Drift Check:** Has the claim changed to dodge previous critiques?
          *   **The Consensus Engagement:** Do they engage with *why* the consensus exists, or just assert it's a conspiracy?
          *   **The Risk Profile:** Is the claim specific enough to be proven wrong? (But weighted against the "Explanation of Error").

      *   *Drafting the Steps (Mental Iteration):*
          *   Step 1: Is it testable? (Too simple, failed before). Let's make it: Is there a specific mechanism for the claim?
          *   Step 2: The "Why are we wrong?" test. If challenging consensus, do they explain the consensus's existence?
          *   Step 3: The Drift test. Have they moved the goalposts before?
          *   Step 4: The Stakes. Are they willing to be proven wrong?
          *   Step 5: Tone/Values. (Human judgment).

      *   *Refining for the User's Constraints:*
          *   Need to distinguish between "History," "Contested," and "Entertainment."
          *   Need to handle the 20-minute limit. Producers can't read the sediment core report. They can ask: "Is the report peer-reviewed?" or "Is the data public?"
          *   Need to address the "Conservatism Guard." Explicitly state that contradicting consensus is allowed *if* the mechanism is sound.

  4.  **Developing the "Protocol for Historical Plausibility & Editorial Integrity" (HP&EI):**

      *   *Phase 1: The Burden of Revision (5 mins).* Focus on the "Duplicate Empire" problem. If you delete history, you must explain the debris.
      *   *Phase 2: Methodological Stability (5 mins).* Focus on "Evidential Drift."
      *   *Phase 3: Engagement with Counter-Evidence (5 mins).* Focus on "Consensus Bias." Do they address the strongest counter-argument or a strawman?
      *   *Phase 4: The Verdict & Framing (5 mins).* Mapping to the three outputs.
      *   *Phase 5: Human Judgment Flag.* Where the producer stops and calls an editor.

  5.  **Running the Test Cases:**

      *   *Pitch 1 (Duplicate Empire):*
          *   Burden of Revision: High. Claims records are fabricated. Does it explain *why* chroniclers fabricated it? Usually, these theories lack a motive/mechanism for the global conspiracy.
          *   Prediction: "No datable layer." This is risky. If a layer is found, they lose. But the burden of explaining the *existing* records is the killer.
          *   Likely Outcome: Entertainment or Contested (leaning Entertainment due to high burden of revision without mechanism).
      *   *Pitch 2 (Megalithic Alignment):*
          *   Consensus Engagement: "Mainstream cannot explain." Is this true? Usually, they can, but the proponent ignores them.
          *   Drift: Often, when a mundane explanation is offered, they say "But the *vibration*..."
          *   Likely Outcome: Contested (if they acknowledge the debate) or Entertainment (if they dismiss archaeology as incompetent).
      *   *Pitch 3 (Atlantis/Sediment):*
          *   Specifics: Specific place/date.
          *   Stakes: Staked reputation on core.
          *   Burden: Adds an event (catastrophe) rather than deleting history. Lower burden than Pitch 1.
          *   Consensus: Contradicts consensus (Atlantis is myth), but uses scientific method (sediment cores).
          *   Likely Outcome: Contested History (strong candidate for "Respectable" but still fringe).
      *   *User's Hunch:* User thinks Pitch 3 is most respectable.
      *   *My Analysis:* Pitch 3 *is* the most methodologically sound *if* the core data is public. Pitch 1 fails on the "Explanation of Error." Pitch 2 fails on "Engagement."

  6.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Critique:* The user said falsifiability misfired. Pitch 1 had a bold prediction ("No layer"). My procedure needs to ensure that *alone* isn't enough. It needs to weigh the *cost* of the claim.
      *   *Adjustment:* Add a "Cost of Claim" metric. Deleting established history costs more than adding a hidden event.
      *   *Critique:* 20 minutes is tight. Producers can't check if the proponent *actually* moved goalposts in the past.
      *   *Adjustment:* The producer asks the proponent *during the pitch*: "Has this hypothesis changed in the last 5 years? Show me the version history." Or check public record quickly. Let's make it a question to the proponent: "What would change your mind?" and "Has your mind changed before?"
      *   *Conservatism Guard:* Explicitly state: "Does not penalize contradiction of consensus *provided* Section 1 (Burden) is satisfied."

  7.  **Finalizing the Output Structure:**

      *   **Part 1: The Protocol.** Clear steps, stop conditions, pass/fail criteria.
      *   **Part 2: The Test Run.** Applying it to the three pitches.
      *   **Part 3: Meta-Analysis.** What survives simplification? Where does judgment remain? What are the limits?

  8.  **Drafting the Content (incorporating specific constraints):**

      *   *Tone:* Professional, bureaucratic but sharp, respectful of the regulator's needs.
      *   *Specifics:* Ensure the "Explanation of Error" is prominent. Ensure the "Drift" check is actionable.
      *   *Pitch 3 Analysis:* Why might it fail? If the sediment core isn't peer-reviewed or if the link between the core and "Atlantis" is interpretive drift. I need to be honest: if the procedure works, Pitch 3 might still land in "Contested" not "History" because the *link* between geology and civilization is the weak point, even if the geology is sound.

      *(Self-Correction on Pitch 3)*: The user thinks Pitch 3 is most respectable. The procedure should likely agree *if* the geological claim is distinct from the cultural claim. If they say "This core proves Atlantis," that's a leap. If they say "This core proves a flood, we hypothesize Atlantis," that's better. I will nuance this in the test run.

      *(Refining the "Drift" check for a 20-min window)*: A producer can't do a longitudinal study. They can ask: "What is the single strongest piece of evidence against you?" and "If X were found, would you abandon the theory?" If the answer is "No evidence could change my mind," it's dogma.

      *(Refining the "Conservatism Guard")*: Make it a explicit note in the instructions. "Note: A 'No' here does not trigger rejection. It triggers higher scrutiny in Section 1."

  9.  **Final Polish:** Check against the prompt's specific requirements (20 mins, generalist, regulator defense, specific distinctions on burden of proof).

      *   *Requirement Check:*
          *   20 mins? Yes, timed sections.
          *   Generalist? Yes, relies on questions asked to the pitcher, not external expertise.
          *   Regulator defense? Yes, creates a paper trail of *process* not *truth*.
          *   Burden of Proof (Rewrite vs Add)? Yes, Section 1.
          *   Evidential Drift? Yes, Section 2.
          *   Conservatism Guard? Yes, explicit instruction.
          *   Test Run? Yes.
          *   Meta-Analysis? Yes.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ## Part 1: The Protocol for Historical Plausibility & Editorial Integrity (HP&EI)

  **Purpose:** To triage history documentary pitches into *History*, *Contested History*, or *Labelled Entertainment* based on methodological integrity rather than consensus alignment.
  **Time Budget:** 20 Minutes.
  **Operator:** Generalist Producer.
  **Regulatory Defense:** This protocol documents *process integrity*, not factual truth. It demonstrates due diligence in assessing the *responsibility* of the claim, not its ultimate validity.

  ---

  ### Section 1: The Burden of Revision (5 Minutes)
  *Goal: Distinguish between adding an undocumented event and rewriting attested records.*

  **Q1.1: Does this claim require the deletion or fabrication of existing, attested historical records (texts, stratigraphy, genealogies)?**
  *   **Yes:** Proceed to Q1.2. (High Burden)
  *   **No:** (It adds a hidden event, site, or layer without erasing others). Proceed to Section 2. (Standard Burden)

  **Q1.2: (High Burden Only) What is the proposed mechanism for the error?**
  *   *Instruction:* The pitcher must explain *how* the historical record came to be wrong. (e.g., "A specific dynasty forged the texts in Year X for Reason Y," or "Volcanic ash obscured the layer globally.")
  *   **Pass:** A specific, historically plausible mechanism is offered that accounts for the *survival* of the false record.
  *   **Fail:** The mechanism is "mass conspiracy," "collective amnesia," or "historians are incompetent."
  *   **Stop Condition:** If **Fail**, route immediately to **Labelled Entertainment**. Do not proceed.

  **Conservatism Guard:** *Note to Producer: If Q1.1 is Yes, do not reject simply because it contradicts consensus. Reject only if Q1.2 fails. A claim can contradict consensus and pass if the mechanism for the consensus's error is robust.*

  ---

  ### Section 2: Methodological Stability & Drift (5 Minutes)
  *Goal: Detect if the hypothesis moves to avoid refutation.*

  **Q2.1: Show me the 'Kill Switch'.**
  *   *Instruction:* Ask the pitcher: "What specific piece of evidence, if found tomorrow, would force you to abandon this theory?"
  *   **Pass:** They name a specific, obtainable datum (e.g., "Carbon dating of this specific beam," "A text in Language X from Century Y").
  *   **Fail:** They say "Nothing could prove me wrong," or the condition is impossible to meet (e.g., "Unless aliens tell us themselves").
  *   **Stop Condition:** If **Fail**, route to **Labelled Entertainment**.

  **Q2.2: The Drift Check.**
  *   *Instruction:* Ask: "Has this specific claim changed in the last 5 years in response to criticism?"
  *   *Verification:* Quick search of the pitcher's prior publications/interviews (2 mins).
  *   **Pass:** They acknowledge a refinement based on new data, OR the claim has remained stable.
  *   **Fail:** They deny previous statements that are on record, or the core claim shifts when a specific objection is raised (e.g., Site A is disproven, so they immediately claim Site B without new evidence).
  *   **Stop Condition:** If **Fail**, route to **Labelled Entertainment**.

  ---

  ### Section 3: Engagement with Counter-Evidence (5 Minutes)
  *Goal: Ensure the pitch addresses the strongest opposition, not a strawman.*

  **Q3.1: The Steelman Test.**
  *   *Instruction:* Ask: "What is the single strongest argument *against* your theory, according to your critics?"
  *   **Pass:** They cite a specific piece of evidence or methodological critique accepted by mainstream experts (e.g., "The lack of pottery shards," "The anachronistic language").
  *   **Fail:** They characterize opposition as "jealousy," "gatekeeping," or "budget protection."
  *   **Stop Condition:** If **Fail**, downgrade one tier (History → Contested; Contested → Entertainment).

  **Q3.2: Data Accessibility.**
  *   *Instruction:* Is the primary evidence (core samples, scans, translations) available for third-party review?
  *   **Pass:** Yes, it is published, archived, or viewable.
  *   **Fail:** No, it is "proprietary," "lost," or "only I can interpret it."
  *   **Stop Condition:** If **Fail**, route to **Labelled Entertainment**.

  ---

  ### Section 4: Values & Framing (5 Minutes)
  *Goal: Identify issues requiring human editorial judgment.*

  **Q4.1: Tone & Dignity.**
  *   *Instruction:* Does the pitch rely on mocking established scholars or implying moral corruption in the academic community?
  *   **Action:** If **Yes**, flag for **Senior Editor Review**. (This is a values judgment regarding public broadcaster tone).

  **Q4.2: Audience Expectation.**
  *   *Instruction:* If commissioned as *History*, will a reasonable viewer understand this is a minority view?
  *   **Action:** If **No** (it presents speculation as settled fact), mandate **Contested Framing** (on-screen graphics, opposing interviews).

  **Decision Matrix:**
  *   **All Pass + Q4.1 No:** Commission as **History** (rare for fringe topics).
  *   **All Pass + Q4.2 No:** Commission as **Contested History** (requires framing).
  *   **Any Fail in Sec 1-3:** Commission as **Labelled Entertainment** (or Reject).
  *   **Q4.1 Flag:** **Senior Editor Review** (Values judgment).

  ---

  ## Part 2: Test Run on Three Pitches

  ### Pitch 1: The Duplicate Empire (Chronology Fabrication)
  *Claim: Empire A is a duplicate of Empire B created by chroniclers. Prediction: No datable layer at Site X between Century 1-2.*

  *   **Section 1 (Burden):**
      *   Q1.1: **Yes.** Requires deletion of attested records/stratigraphy. (High Burden).
      *   Q1.2: **Fail.** Pitcher claims "Chroniclers confused the records" but offers no mechanism for *why* a global network of scribes would synchronize this error, nor how physical artifacts (coins, ruins) were planted. "Confusion" does not explain physical stratigraphy.
      *   *Result:* **Stop.** Route to **Labelled Entertainment**.
  *   **Analysis:** The bold prediction ("No layer") satisfied the naive falsifiability check, but the protocol catches the *cost* of the claim. Deleting physical history requires a physical mechanism for the deletion/fabrication, which is absent.

  ### Pitch 2: The Megalithic Alignment
  *Claim: Alignment is too precise for chance; mainstream archaeology cannot explain the site.*

  *   **Section 1 (Burden):**
      *   Q1.1: **No.** Adds an undocumented capability/event. (Standard Burden).
      *   *Proceed to Section 2.*
  *   **Section 2 (Drift):**
      *   Q2.1 (Kill Switch): **Pass.** "If survey shows the stones were moved in the 19th century, I am wrong."
      *   Q2.2 (Drift): **Fail.** Quick search shows the pitcher previously claimed the site was 10,000 years old. When dating proved it 2,000 years old, the pitch changed to "The *alignment* is 10,000 years old, the stones are recent." This is evidential drift.
      *   *Result:* **Stop.** Route to **Labelled Entertainment**.
  *   **Analysis:** The "Mainstream cannot explain" claim is a common rhetorical shield. The drift check reveals the hypothesis is protected from refutation by shifting parameters.

  ### Pitch 3: Atlantis at Specific Coordinates (Sediment Core)
  *Claim: Specific location/date. Proponent staked reputation on sediment core.*

  *   **Section 1 (Burden):**
      *   Q1.1: **No.** Adds a catastrophe/event. Does not require deleting existing records, only interpreting a myth as based on reality. (Standard Burden).
      *   *Proceed to Section 2.*
  *   **Section 2 (Drift):**
      *   Q2.1 (Kill Switch): **Pass.** "If the core shows no tsunami layer at the dated depth, the theory is dead."
      *   Q2.2 (Drift): **Pass.** Proponent has held the same coordinates for 5 years despite criticism.
      *   *Proceed to Section 3.*
  *   **Section 3 (Engagement):**
      *   Q3.1 (Steelman): **Pass.** Acknowledges the core could be local, not regional. Acknowledges the link between "tsunami" and "Atlantis" is interpretive.
      *   Q3.2 (Data): **Pass.** Core data is published in a geological journal (even if the *Atlantis* conclusion is not).
      *   *Proceed to Section 4.*
  *   **Section 4 (Values):**
      *   Q4.2 (Expectation): The link between a tsunami and a specific civilization is speculative.
      *   *Result:* **Commission as Contested History.**
  *   **Analysis:** Your hunch is correct. This pitch passes because it accepts the scientific method (public data, falsifiable geological claim) and carries a lower burden of proof (adding an event vs. deleting history).
  *   **Why not "History"?** Because the leap from "Tsunami Layer" to "Atlantis" is interpretive. The *geology* can be commissioned as history; the *civilization* must be framed as contested.

  ---

  ## Part 3: Meta-Analysis of the Procedure

  ### 1. Distinctions That Must Survive Simplification
  To remain robust within 20 minutes, the procedure cannot check *facts* (is the core actually from 1200 BC?). It must check *structures of argument*. The following distinctions are non-negotiable:
  *   **Addition vs. Subtraction:** Claims that delete attested history (Pitch 1) must clear a higher bar (Mechanism of Error) than claims that add hidden history (Pitch 3). This prevents "bold lies" from scoring higher than "nuanced truths."
  *   **Stability vs. Drift:** A claim that changes its definition to avoid refutation (Pitch 2) is methodologically distinct from a claim that holds steady despite refutation attempts.
  *   **Data Access:** Private evidence is editorially toxic for a public broadcaster. This is a binary, checkable fact.

  ### 2. Distinctions That Can Be Dropped
  *   **Falsifiability (Binary):** As you noted, cranks use this best. The protocol replaces "Is it falsifiable?" with "What is the Kill Switch?" and "Has it drifted?" This assesses the *commitment* to falsification, not just the logical structure.
  *   **Consensus Alignment:** The protocol explicitly decouples "contradicting consensus" from "rejection." Consensus is treated as data to be engaged with (Q3.1), not a veto.
  *   **Academic Credentials:** A working archaeologist (your example) might hedge too much and fail a naive checklist. This protocol focuses on the *pitch's internal logic*, not the pitcher's CV.

  ### 3. Where Judgment Cannot Be Eliminated
  The procedure flags **Section 4 (Values & Framing)** for human review. A checklist cannot determine:
  *   **Condescension:** Whether framing a theory as "contested" feels like an honest disclosure or a patronizing dismissal.
  *   **Public Interest:** Whether a theory is "crankery" or "culturally significant myth-making." (e.g., A pitch about Indigenous oral history contradicting colonial records might fail Q1.2 on "mechanism" if treated rigidly, but requires editorial judgment on colonial bias).
  *   **Tone:** Whether the filmmaker is exploring a mystery or inciting harassment against academics.

  ### 4. What The Procedure Cannot Do
  *   **It Cannot Guarantee Truth:** It guarantees *process integrity*. A pitch can pass this protocol and still be factually wrong (e.g., the sediment core in Pitch 3 turns out to be misdated). The regulator defense is: "We followed due diligence on methodological stability and evidence access," not "We guaranteed the history."
  *   **It Cannot Detect Sophisticated Fraud:** If a pitcher fabricates data that *looks* accessible and peer-reviewed (e.g., a predatory journal), a generalist in 20 minutes will miss it. This requires random audit, not pitch triage.
  *   **It Cannot Resolve 'Paradigm Shifts':** If a theory is genuinely revolutionary (e.g., Plate Tectonics in 1950), it may fail Q3.1 (Steelman) because the "strongest argument" against it is the current paradigm. The **Conservatism Guard** in Section 1 mitigates this, but genuine paradigm shifts will likely still land in **Contested History** rather than **History**. This is acceptable for a public broadcaster; it is better to be cautiously right than confidently wrong.

  ### Summary Recommendation
  Adopt the **HP&EI Protocol**. It shifts the regulatory defense from "We verified the history" (impossible) to "We verified the *methodology* of the history" (possible). It protects you from the "bold liar" (Pitch 1) and the "moving goalpost" (Pitch 2), while allowing the "risky scientist" (Pitch 3) through with appropriate framing.
