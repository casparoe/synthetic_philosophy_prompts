answer: |-
  ### 1. The Exam Question

  **Module: Advanced Metaethics (Year 4)**
  **Take-Home Final Examination**

  **Question 1**

  Consider two competing views about the structure of normative reasons.

  **View A (Non-Relationalism):** Normative reasons are irreducibly normative facts that obtain independently of any agent's motives, capacities, or perspectives. A reason can exist even if it is not a reason *for* any specific agent to act.
  **View B (Relationalism):** A normative reason is necessarily a reason *for* someone. The fundamental normative facts are always agent-indexed (e.g., "R is a reason for S to $\phi$"). There are no free-floating reasons.

  Relationalists often argue that View A is metaphysically objectionable because it posits normative facts detached from agency. However, critics offer the **Remainder Argument**: Any relationalist theory must rely on general principles to determine which considerations count as reasons for which agents. Furthermore, to compare the importance of different agents' reasons (e.g., to judge which outcome is better), the theory must rely on rules of combination or weighting. Neither these general principles nor these rules of combination are themselves reasons *for* any specific agent. Therefore, the relationalist appears to have abolished free-floating *reasons* only by admitting free-floating *normative principles*.

  **The Case:**
  Ada and Bo are causally isolated. Ada can prevent one severe injury to a stranger. Bo can prevent five mild injuries to five different strangers on an island Ada cannot access. No third party can intervene.
  Intuitively, there is a fact of the matter that Bo's opportunity matters more than Ada's. Yet, this comparative fact is not a reason for Ada (she cannot act on Bo's situation), not a reason for Bo (he cannot act on Ada's situation), and not a reason for anyone else (no one else exists in the scenario).

  **Task:**
  Using the Case above, evaluate the Remainder Argument. Does the Relationalist successfully eliminate free-floating normativity, or do they merely relocate it to principles and weighting rules? In your answer, you must explicitly identify what you take to be the underlying motivation for Relationalism (i.e., what theoretical work it was supposed to do) and explain whether the Remainder Argument undermines that specific motivation.

  **Word Limit:** 1,500 words
  **Marks:** 30

  ***

  ### 2. Model Answer

  **Candidate Number: 00492**

  The Remainder Argument succeeds in demonstrating that Relationalism does not eliminate free-floating normativity; it merely relocates it. While Relationalism attempts to ground normativity in the relation between facts and agents, the machinery required to sustain that relation reintroduces the very detached normative facts the view seeks to avoid. Consequently, the theoretical gain is illusory, amounting to a change of subject rather than an ontological improvement.

  To see this, we must first isolate the motivation for Relationalism. The view is not merely semantic; it is driven by the desire to anchor normativity in agency. The Non-Relationalist posits reasons that exist regardless of whether any agent can grasp or act on them. The Relationalist objects that this renders normativity alien—a system of demands floating above the creatures supposed to be bound by them. By insisting that all reasons are reasons *for* someone, Relationalism promises to tether normative force to the perspective of the agent. The gain is supposed to be a naturalistic or constitutive fit between normativity and the agents subject to it.

  However, the Case of Ada and Bo reveals a crack in this tether. We are asked to accept that there is a truth to the claim "Bo's opportunity matters more than Ada's." For the Relationalist, this truth cannot be a free-floating reason. It must be constructed from agent-indexed facts. But whose agent-indexed facts? It is not a reason for Ada to act on Bo's behalf, nor for Bo to act on Ada's. If we say it is a reason for a hypothetical observer, we violate the causal isolation stipulation; there is no observer positioned to act. If we say it is a reason for them jointly, we violate the causal isolation between them; they cannot coordinate.

  The Relationalist's only escape is to claim that the comparative fact is not a reason at all, but a derivative truth grounded in the sum of individual reasons. Bo has five reasons of weight $x$; Ada has one reason of weight $y$; $5x > y$. But this move triggers the Remainder Argument. The claim that $5x > y$ relies on a weighting principle. Where does this principle come from? If the principle "five mild injuries outweigh one severe injury" is itself a reason for someone, we ask: for whom? It is not a reason for Ada or Bo to believe the principle; it is the standard by which their reasons are measured.

  If the Relationalist admits the weighting principle is a free-floating normative truth, they have conceded the core of the Non-Relationalist position. They have eliminated free-floating *reasons* only by positing free-floating *principles* that generate reasons. The ontological commitment to detached normative facts remains; only the label has changed from "reason" to "principle."

  A sophisticated Relationalist might argue this is still a gain. They might claim that while principles are free-floating, they are merely formal or logical, whereas reasons are substantive. By keeping the substantive normative force indexed to agents, they preserve the link to agency. However, this defense collapses under scrutiny. The weighting principle in the Ada/Bo case is not formal logic; it is a substantive normative claim about the value of suffering and aggregation. If that principle is not anchored to an agent's perspective, then the "alienation" objection Relationalists raise against Non-Relationalism applies equally to their own principles. The normativity is still coming from "outside" the agents' perspectives.

  Furthermore, the relocation creates a new problem: regress. If the principle determining why Bo has a reason is itself a normative fact, do we need a further principle to explain why that principle applies to Bo? If so, we face an infinite regress of free-floating principles. If not, then the first principle applies to Bo without being a reason *for* him, which contradicts the Relationalist's core thesis that all normativity is agent-indexed.

  Therefore, the Remainder Argument shows that Relationalism fails to achieve its motivating goal. The goal was to remove the "spookiness" of detached normative facts by binding them to agents. But because the binding mechanism (the principles of reason-generation and weighting) must itself be normative and cannot be agent-indexed without circularity, the spookiness remains. The Relationalist has not grounded normativity in agency; they have simply hidden the free-floating facts one layer deeper in the theory.

  In conclusion, the Ada/Bo case demonstrates that comparative normative facts cannot be reduced to agent-relative reasons without remainder. The Relationalist must appeal to principles that are not reasons for anyone. Since these principles carry the same metaphysical weight as the free-floating reasons they replace, Relationalism offers no ontological advantage. It changes the vocabulary of normativity without changing its structure. The motivation to anchor normativity in agency is laudable, but the Relationalist fails to execute it, leaving the normative realm just as detached from the agents as the Non-Relationalist supposed.

  ***

  ### 3. Marking Scheme

  **Total Marks: 30**
  **Pass Mark: 15**

  | Criterion | Marks | Description of Required Move | Competent (2:1) Performance | Common Error |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Reconstruction of Relationalism** | 6 | Accurately defines Relationalism not just as "reasons for agents" but identifies the *motivation* (anchoring normativity to agency/perspective) before critiquing it. | Defines Relationalism correctly as agent-indexing but treats the motivation as generic "anti-realism" or fails to articulate *why* detachment is objectionable. | Treating Relationalism as merely a semantic claim about the word "reason" rather than a metaphysical stance on normativity. |
  | **2. Application of the Case** | 6 | Demonstrates why the comparative fact ("Bo matters more") cannot be reduced to Ada's or Bo's specific reasons given the causal isolation constraints. | Uses the Ada/Bo case but suggests a third party or joint action could solve the comparison, ignoring the isolation constraint in the prompt. | Ignoring the causal isolation stipulation and suggesting Ada ought to care about Bo's outcome. |
  | **3. Execution of Remainder Argument** | 6 | Explicitly distinguishes between *reasons for action* and *principles of weighting/generation*, arguing the latter remain free-floating on the Relationalist view. | States that principles exist but fails to argue why they count as "free-floating normativity" equivalent to Non-Relationalist reasons. | Conflating "principles" with "beliefs about reasons," missing the ontological point of the Remainder Argument. |
  | **4. Evaluation of "Gain vs. Subject"** | 6 | Judges whether relocating normativity from reasons to principles is a theoretical victory or a verbal shuffle, based on the motivation identified in Criterion 1. | Concludes the argument succeeds or fails but does not link this verdict back to the initial motivation (anchoring to agency). | Hedging by saying "both sides have merits" without committing to whether the relocation is a real gain. |
  | **5. Structural Coherence & Precision** | 6 | Essay maintains a single substantive thesis throughout; avoids name-dropping or external theories not in the prompt; adheres to word limit. | Essay is clear but surveys multiple positions (Constructivism, Buck-Passing) rather than arguing one line deeply. | Violating the "no external reading" constraint by citing Scanlon, Parfit, or specific literature not provided. |

  **Differentiation Note:**
  *   **Upper-Second (2:1):** Candidates will typically secure marks in Criteria 1, 2, and 5. They will explain the case and the argument clearly. They often lose marks on Criterion 4 by failing to connect the metaphysical remainder back to the *motivation* for Relationalism (i.e., they show the principles remain free-floating but don't explain why that defeats the Relationalist's goal of anchoring normativity).
  *   **First-Class (1st):** Candidates will secure full marks on Criterion 4. They will explicitly argue that if the *principles* are detached, the *agency anchor* is cut, rendering the Relationalist's specific motivation void. They will also avoid the "third-party observer" escape route in Criterion 2 by rigorously respecting the causal isolation constraint.
