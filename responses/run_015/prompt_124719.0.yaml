          *   **Reasoning:** RDU (Quiggin, 1982) *allows* for a non-linear utility function, but it *separates* risk attitude from utility curvature. You *can* have linear utility in RDU, but you don't *have* to. The core innovation is the probability weighting function, not forcing $u(x) = x$. Standard EU conflates risk aversion with diminishing marginal utility; RDU disentangles them. Saying it "keeps the utility curve totally linear" implies it *must* be linear, which is wrong. It *can* be linear to isolate risk attitude, but usually, it's kept general.

      *   *Claim 2: All risk aversion goes into rank-dependent decision weights.*
          *   **Verdict:** Simplification/Partially True.
          *   **Reasoning:** This is the *point* of RDU. It allows you to model risk aversion even if utility is linear. However, you can still have risk aversion coming from *both* the utility function and the weighting function. The claim implies utility *cannot* contribute, which is too strong. But the *philosophical* point is that you *can* shift the explanation of risk aversion to the weights.

      *   *Claim 3: Weights depend on the ordering of outcomes.*
