answer: |-
  Your roommate has a decent grasp of the *intuition* behind Risk-Weighted Expected Utility (RDU), but his summary mixes up some technical details and makes one major categorical error. If you base your response paper on his summary without correcting these points, you might lose credit for accuracy.

  Here is a breakdown of his claims, idea by idea, separated into what is right, what is a simplification, and what is wrong.

  ### 1. Claim: RDU keeps the utility curve totally linear (no diminishing marginal utility).
  **Verdict: Wrong (mostly).**

  This is the biggest technical error in his summary. RDU does **not** require the utility function to be linear.
  *   **The Reality:** In standard Expected Utility (EU), risk aversion is *conflated* with diminishing marginal utility. If you are risk-averse in EU, your utility function *must* be concave (curved). RDU's main innovation is that it **disentangles** these two things.
  *   **Why he's confused:** You *can* model an RDU agent with a linear utility function to show that risk aversion can exist purely because of how they weight probabilities. However, the general RDU framework allows for *both* a curved utility function (reflecting taste for money/goods) *and* a non-linear weighting function (reflecting attitude toward risk).
  *   **For your paper:** The key philosophical point isn't that utility *is* linear, but that risk aversion *no longer requires* utility to be curved. You can have linear utility and still be risk-averse, which EU cannot explain.

  ### 2. Claim: All risk aversion goes into rank-dependent decision weights.
  **Verdict: Simplification.**

  *   **The Reality:** As noted above, risk aversion *can* come from the weights, but it doesn't *have* to come exclusively from them.
  *   **The Nuance:** In EU, if you observe risk-averse behavior, you are forced to say the agent values the second \$100 less than the first. In RDU, you can say the agent values the dollars equally (linear utility) but is pessimistic about the odds of winning (weighting function).
  *   **For your paper:** This is a feature, not a bug. RDU gives you an extra parameter to fit data. It allows economists to separate "how much I want the prize" (utility) from "how I feel about the gamble" (risk weights).

  ### 3. Claim: Weights depend on the ordering of outcomes.
  **Verdict: Right.**

  *   **The Reality:** This is the "Rank-Dependent" part of the name. In RDU, the weight assigned to a probability depends on whether that outcome is the best, the worst, or somewhere in the middle.
  *   **Why it matters:** In standard EU, the probability of winning \$100 is treated the same way regardless of whether the alternative is \$0 or \$1,000,000. In RDU, people might treat a 10% chance differently if it's a chance to avoid a loss versus a chance to win a bonus. The "rank" of the outcome changes the decision weight.

  ### 4. Claim: RDU applies weights to cumulative probabilities.
  **Verdict: Right.**

  *   **The Reality:** This is the mathematical mechanism that makes RDU work. If you just weighted individual probabilities non-linearly, your weights might not add up to 1 (which breaks the math of probability).
  *   **The Mechanism:** By transforming the *cumulative* distribution function (the probability of getting *at least* outcome X), RDU ensures the math stays consistent while still allowing for non-linear weighting. This is technically called "Quiggin's Anticipated Utility."

  ### 5. Claim: RDU explains Allais patterns.
  **Verdict: Right.**

  *   **The Reality:** This is the primary reason RDU was developed. The Allais Paradox shows that people violate the "Independence Axiom" of Expected Utility.
  *   **The Mechanism:** Because RDU weights probabilities non-linearly (usually overweighting small probabilities and underweighting moderate ones), it naturally predicts the preference reversals seen in the Allais Paradox without calling the agent "irrational" in the EU sense. It satisfies a weaker axiom called "Comonotonic Independence."

  ### 6. Claim: RDU explains ambiguity aversion like in Ellsberg.
  **Verdict: Wrong.**

  *   **The Reality:** This is a critical distinction in philosophy of economics. **Risk** involves known probabilities (like a die roll). **Ambiguity (or Uncertainty)** involves unknown probabilities (like an urn with unknown color composition).
  *   **The Error:** RDU is a theory of decision under **Risk**. It requires you to have probabilities to weight. In the Ellsberg Paradox, the probabilities are unknown, so there is nothing for the RDU weighting function to operate on.
  *   **For your paper:** Do not claim RDU solves Ellsberg. To explain Ellsberg, you need different models, such as Maxmin Expected Utility (Gilboa-Schmeidler) or Smooth Ambiguity models. Confusing Risk (RDU) with Ambiguity (Ellsberg) is a common student mistake.

  ### 7. Claim: RDU is Prospect Theory without the reference point/loss aversion.
  **Verdict: Mostly Right.**

  *   **The Reality:** Cumulative Prospect Theory (CPT), developed by Tversky and Kahneman later, essentially uses the RDU mathematical machinery.
  *   **The Difference:** Prospect Theory adds psychological specifics: it divides outcomes into "gains" and "losses" relative to a reference point, and it assumes people are loss-averse (losses hurt more than gains feel good). RDU strips that out to be a more general, "cleaner" economic model that applies to final wealth states rather than changes.
  *   **For your paper:** It is fair to say RDU is the "economic purification" of Prospect Theory. It keeps the descriptive power of probability weighting but drops the specific psychological assumptions about loss aversion to make it more normatively defensible.

  ### Summary for Your Response Paper

  If I were writing this paper, here is how I would frame the correction to your roommate's view:

  1.  **The Big Win:** RDU successfully separates **risk attitude** from **marginal utility**. This solves the theoretical problem where EU forces us to say a rich person and a poor person have different "tastes" for money just because they buy different insurance policies.
  2.  **The Big Error:** RDU handles **Risk** (Allais), not **Ambiguity** (Ellsberg). Your roommate is conflating two different critiques of Expected Utility.
  3.  **The Utility Function:** RDU does not *force* utility to be linear; it *allows* it to be linear while still modeling risk aversion. This flexibility is the main theoretical contribution.

  Your roommate's summary is about 70% accurate on the intuition but fails on the technical scope (Ambiguity) and the specific constraints on the utility function. Correcting those two points will make your paper much stronger.
