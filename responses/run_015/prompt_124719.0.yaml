          *   **Reasoning:** Cumulative Prospect Theory (CPT) is essentially RDU applied to gains and losses separately with an S-shaped value function. RDU is indeed the "cleaner" economic version that drops the psychological specifics of Kahneman & Tversky (like loss aversion and specific reference points) to maintain more normative appeal, though it still violates standard rationality axioms (Independence).

