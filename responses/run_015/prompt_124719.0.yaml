          *   **Verdict:** False.
          *   **Reasoning:** RDU is a theory of decision under *Risk* (known probabilities). Ellsberg is about *Ambiguity/Uncertainty* (unknown probabilities). RDU does not solve Ellsberg. You need Maxmin Expected Utility (Gilboa-Schmeidler) or Smooth Ambiguity (Klibanoff et al.) for that. This is a critical error in the roommate's summary.

      *   *Claim 6: RDU applies weights to cumulative probabilities.*
