  **MEMORANDUM**

  **TO:** Planning Commission
  **FROM:** Vice-Chair [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Application 24-18 (Elm Corridor Rezoning)

  **Recommendation**
  I recommend that the Planning Commission approve Application 24-18 with specific conditions regarding shadow mitigation and traffic calming measures. We must deny the Neighborhood Association's counterproposal. While the counterproposal offers stability, it fails to meet the scale of our housing crisis. My bottom line is clear: we should authorize the mixed-use rezoning but instruct staff to draft conditions requiring a detailed shadow analysis for adjacent properties and a funded traffic management plan for the peak transit hours.

  **Context and Staff Findings**
  Staff analysis confirms that Application 24-18 aligns with our Climate Action Plan and housing elements. The project yields 180 homes, 72 of which will be permanently affordable. In contrast, the Neighborhood Association's counterproposal yields only eight homes, all affordable. Quantitatively, the application provides nine times the housing supply and nine times the affordable stock. Furthermore, locating density near rail reduces regional vehicle miles traveled, whereas maintaining single-family zoning perpetuates car dependency. The staff finding that average rents may decrease citywide due to supply expansion is a critical public benefit that outweighs localized inconveniences.

  **Principled Grounds: Who Decides?**
  The central conflict here is not merely density versus character, but competing claims on decision-making authority. The Neighborhood Association argues that current residents hold a exclusive right to self-determination based on property ownership and proximity. They contend that those most affected by change should hold veto power. Conversely, tenant groups argue that housing scarcity is a regional harm dispersed onto renters elsewhere, granting prospective residents a moral claim to shape the city.

  As a Commission, we must reject the notion that a neighborhood is a sovereign enclave. Zoning is a legislative act concerning the public welfare, not a private contract between neighbors. The 1974 downzoning foreseeably excluded lower-income and minority households, locking in demographic homogeneity. To uphold that exclusion now based on "character" validates historical inequities. We are stewards of the entire city, not just the Elm Corridor. While local input is vital for design and mitigation, it cannot extend to vetoing housing that serves a critical regional need. Allowing incumbent owners to block supply concentrates benefits on them while dispersing the costs of scarcity onto vulnerable populations elsewhere. Our authority derives from representing the public interest, which includes the housing needs of those not yet living here.

  **Engaging the Opposition's Strongest Claim**
  However, we must engage seriously with the Neighborhood Association's strongest argument: the legitimacy of reliance interests. Homeowners purchased properties under specific regulatory expectations. They invested capital based on the stability of the 1974 zoning. To change the rules mid-stream feels like a breach of faith, destabilizing the financial and social planning of long-term residents. This is not merely NIMBYism; it is a claim about fairness and the rule of law.

  We cannot dismiss this concern. Property stability is a public good. However, reliance interests are not absolute. Zoning has always been subject to change as community needs evolve. The harm of maintaining exclusionary zoning—perpetuating segregation and climate inefficiency—outweighs the harm of altered expectations. Furthermore, the "character" argument often masks a desire to preserve property values through scarcity. We address the legitimate reliance interest not by denying housing, but by mitigating the physical impacts. We acknowledge their disruption is real, but it is not sufficient to justify denying 72 affordable homes to families who currently have no seat at this table.

  **Conditions and Next Steps**
  To balance these interests, approval must be conditioned on tangible mitigations. First, the developer must fund a traffic calming study for the two adjacent blocks identified in the staff report, implementing physical barriers or signal timing changes prior to occupancy. Second, a shadow study must ensure no adjacent private gardens lose more than 15% of sunlight during peak growing seasons.

  **Next Steps**
  1.  **Staff Directive:** Direct staff to draft a resolution of approval incorporating the traffic and shadow conditions outlined above.
  2.  **Timeline:** Schedule the final vote for the next regular meeting on November 15th.
  3.  **Community Outreach:** Require the applicant to host a design workshop with the Neighborhood Association to address facade materials, ensuring the scale feels integrated rather than imposed.

  We must choose the path that aligns with our climate goals and equity mandates. We can respect our neighbors by mitigating impacts, but we cannot respect them by preserving exclusion.

  **Decision:** Approve with Conditions.
