prompt: |-
  Bit of a weird one. I've just taken over as head of people at a ~200-person organisation (officially as of last Monday) and the first thing that lands on my desk is a 'generational inclusion' strategy from a consultancy that wants us to run separate onboarding for Gen Z. At home I've got my stepson, 17, and my dad, 74, both living with me at the mo, so I get both ends of this discourse over breakfast. And I was born in one of those cuspy years that every quiz sorts differently, so I've never really known which box I'm in.

  I don't want to bin the document on a hunch, and I don't want to sign it off either. So before I read any more about generations I want to know what I should be demanding of an account of them. Write me the spec: what would a theory have to get right for a sentence like 'Gen Z are like that' to be more than a vibe?

  Purpose, so you know what adequacy is relative to here: good enough (a) to decide whether a generational policy at work could ever be coherent, and (b) to say whether cohort talk is tracking something real, or whether its just a polite way of saying 'young people' or 'the economy'.

  Here's what I've got so far, some of which I suspect are just one camp's prejudices. Tell me which requirements are genuine, which aren't, and which ones I'm missing entirely:

  1. It has to seperate cohort effects from age effects and period effects. Otherwise 'Gen Z are X' might only mean 'people who are 22 are X' or 'people in 2025 are X'.
  2. The boundaries have to come from somewhere other than whoever named the thing, and whatever the theory says shouldn't flip if you nudge a cut-off by a year or so.
  3. If there's a mechanism behind it, the effect should grade with how much of it you actually got rather than step at a birth-year line. My stepson and his mate born eleven months apart are not different animals.
  4. It has to cope with migration. Kid arrives in the UK at 13 from a completely different school system — is he in the cohort his birth year says, or not? And is 'Gen Z' even exportable, or is it an Anglophone thing that goes a bit odd in, say, Poland or Nigeria?
  5. It has to cope with within-cohort spread. If one birth year contains wildly diverging lives — class, region, religion, whether your parents had any money — maybe the cohort isn't picking out a shared thing at all.
  6. It has to say whether the label is doing any explanatory work, or just sitting on top of the actual causes, which don't line up neatly with year boundaries.
  7. It has to deal with the fact that once people believe in generations they start treating each other accordingly, so the categories partly make themselves true. I genuinely can't tell whether that's a requirement or a trap.
  8. It has to be clear whether generations are the same sort of thing as family generations — my dad, me, my stepson — or a completely different animal that just happens to share the word.

  One more thing I keep tripping over: people throw around 'real kind' as if we all know what that would take. Is there a requirement in there somewhere, or is the whole ontology question a red herring for my purposes?

  For each requirement you keep, give me the case behind it and mark it non-negotiable or negotiable. Flag any pair that can't both be satisfied — that's the bit I most want, because I think my list might be asking for something impossible. Tell me which single requirement does the most damage to the ways people actually talk about generations, and add the ones I've missed. Don't skimp on the criteria. And give me a short scorecard too, on four views: cohorts as demographic kinds fixed by birth year and fertility rates; generations as groups with a shared formative history; generations as self-fulfilling human kinds; and the view that there's nothing here but age and period effects. Ta.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** New Head of People at a ~200-person org. Pragmatic, skeptical but open-minded, intellectually rigorous (asks for a "spec"), personally situated (sandwich generation, cuspy birth year).
      *   **Task:** Create a specification ("spec") for evaluating theories of generations. The goal is to decide whether a "Gen Z separate onboarding" policy is coherent and whether "cohort talk" tracks reality or is just proxy language for age/economy.
      *   **Input:** A list of 8 potential requirements (cohort/age/period separation, boundary stability, gradient mechanisms, migration, within-cohort spread, explanatory work, self-fulfilling prophecy, family vs. social generations).
      *   **Constraints:**
          *   Evaluate each requirement (keep/discard, non-negotiable/negotiable).
          *   Identify conflicts/trade-offs between requirements.
          *   Identify the single most damaging requirement to popular discourse.
          *   Add missing requirements.
          *   Address the "real kind" ontology question.
          *   Provide a scorecard for four specific views (Demographic, Shared History, Human Kinds, Age/Period Only).
          *   Tone: Professional, analytical, direct, not skimping on criteria.

  2.  **Evaluate the User's 8 Requirements:**

      *   *1. Cohort vs. Age vs. Period (CAP):* This is the gold standard in social science (APC analysis). Crucial for policy. If you can't distinguish, you can't design interventions. -> **Keep, Non-negotiable.**
      *   *2. Boundary Stability:* If moving the cutoff by 1 year changes the theory, the theory is fragile. Cuspy people prove this. -> **Keep, Non-negotiable.**
      *   *3. Gradient Mechanism:* Social phenomena are rarely binary. A step-function at Jan 1st, 1997 is biologically/sociologically implausible. -> **Keep, Non-negotiable.**
      *   *4. Migration/Geography:* Generational labels are often culturally specific (e.g., Gen Z in US vs. Iran). Policy needs to know if this applies to *their* specific workforce. -> **Keep, Negotiable (depends on org scope).**
      *   *5. Within-Cohort Spread:* Variance within the group vs. variance between groups. If within > between, the category is noise. -> **Keep, Non-negotiable.**
      *   *6. Explanatory Work:* Is "Gen Z" the cause or a label for the cause (e.g., smartphones, gig economy)? -> **Keep, Non-negotiable.**
      *   *7. Self-Fulfilling (Reflexivity):* Hacking's "Human Kinds." Important, but tricky. If the theory relies on this, it's unstable. -> **Keep, Negotiable (more of a risk factor).**
      *   *8. Family vs. Social:* Linguistic confusion. Not strictly necessary for policy, but good for conceptual clarity. -> **Keep, Negotiable.**

  3.  **Identify Conflicts/Trade-offs:**
      *   *Requirement 2 (Boundaries) vs. Requirement 3 (Gradients):* Strict boundaries contradict gradients. You can't have hard cutoffs *and* smooth transitions.
      *   *Requirement 1 (APC Separation) vs. Requirement 7 (Reflexivity):* APC assumes objective measurement. Reflexivity assumes the measurement changes the object. Hard to model both simultaneously.
      *   *Requirement 5 (Within-Cohort Spread) vs. Utility:* If you demand low within-cohort variance, you might find *no* generations exist. But policy needs groups. There's a tension between statistical purity and managerial utility.

  4.  **Identify the "Most Damaging" Requirement:**
      *   Requirement 1 (APC Separation) is the killer. Most pop-sci generation talk fails this completely. They attribute age effects (being young) to cohort effects (being Gen Z).

  5.  **Address the "Real Kind" Ontology:**
      *   Is it a red herring? For policy, yes and no. You don't need metaphysical reality, you need *predictive validity*. But if it's not a "real kind" (natural kind), it's a "practical kind." The spec should focus on *utility* rather than *ontology*.

  6.  **Add Missing Requirements:**
      *   *Actionability:* Can we actually *do* anything different based on this? (If Gen Z needs X, can we give X without alienating others?)
      *   *Temporal Durability:* Will this hold for 5 years, or is it a snapshot?
      *   *Intersectionality:* How does this interact with gender, race, class? (Related to #5 but distinct).

  7.  **Draft the Scorecard:**
      *   *View 1: Demographic Kinds (Strauss-Howe etc.):* Fails APC, fails boundaries.
      *   *View 2: Shared History (Formative Events):* Better, but still struggles with gradients and geography.
      *   *View 3: Human Kinds (Reflexive):* Interesting, but unstable for policy.
      *   *View 4: Age/Period Only (Skeptic):* Passes most tests, implies policy should be age-neutral or need-based.

  8.  **Refine Tone and Structure:**
      *   Use the user's "spec" metaphor.
      *   Be decisive.
      *   Ensure the "Head of People" context is respected (200 people, onboarding policy).
      *   Check against constraints: "Don't skimp on the criteria."

  9.  **Self-Correction/Review during drafting:**
      *   *Correction:* I initially thought about making Migration negotiable. But for a UK org (implied by "Head of People" and "UK" mention in req 4), migration is huge. I'll mark it non-negotiable for *validity*, but negotiable for *policy scope*. Actually, let's keep it Non-Negotiable for the *theory* to be valid, even if the policy doesn't need to cover it.
      *   *Correction on "Real Kind":* Don't get bogged down in philosophy. Frame it as "Predictive Stability."
      *   *Conflict:* Make sure the conflict between Boundaries and Gradients is highlighted sharply. This is the "cuspy" problem the user mentioned.

  10. **Final Polish:** Check the scorecard against the four specific views requested. Ensure the "Most Damaging Requirement" is clearly identified. (APC separation is definitely the one).

  *(Self-Correction on the "Most Damaging" requirement)*: Actually, Requirement 5 (Within-Cohort Spread) is often the statistical killer. But Requirement 1 (APC) is the conceptual killer. I will stick with APC (Req 1) because it exposes the fundamental confusion in 90% of consultancy decks.

  *(Refining the "Ontology" question)*: The user asks if it's a red herring. I need to answer that directly. It is a red herring *if* you seek prediction, but critical *if* you seek fairness. I'll argue for "Functional Realism."

  *(Final check on constraints)*: Did I mark Non-negotiable/Negotiable for each? Yes. Did I flag pairs that can't be satisfied? Yes. Did I do the scorecard? Yes.

  Let's write it.cw
answer: |-
  This is a sharp brief. You are right to be suspicious. In the social sciences, "generation" is a contested construct, and in the consultancy market, it is often a product sold to solve problems it doesn't diagnose.

  For a Head of People in a 200-person org, you do not need metaphysical truth; you need **predictive validity** and **intervention logic**. If the theory cannot predict behaviour better than chance, or if the intervention it suggests creates more friction than it solves, it fails the spec.

  Here is the evaluation of your requirements, the conflicts, the missing criteria, and the scorecard.

  ### Part 1: The Spec Evaluation

  I have assessed your eight requirements based on whether they are necessary for a *coherent policy* (your purpose a) and whether they track *reality* (your purpose b).

  **1. Cohort vs. Age vs. Period (CAP) Separation**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** This is the "Identification Problem" in social science. If you cannot distinguish whether a trait is due to being 22 (Age), being born in 1998 (Cohort), or living through a pandemic (Period), you cannot design policy. If Gen Z "want flexibility," is that because they are young adults testing boundaries (Age), or because they learned work remotely (Period)? If it's Age, separate onboarding is patronating and temporary. If it's Cohort, it might be enduring. Most consultancy decks fail this completely.
  *   **Risk:** Statistically difficult to achieve without longitudinal data you don't have.

  **2. Boundary Stability**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** As you noted with your "cuspy" status. If a theory collapses when you move the birth year cutoff by 12 months, it is measuring noise, not signal. Social change is continuous; administrative categories are discrete. A robust theory must acknowledge the fuzziness of the edges.
  *   **Risk:** Consultancies love hard dates (e.g., 1997–2012) because they are sellable. A theory that admits fuzziness is harder to market.

  **3. Gradient Mechanism (No Step-Functions)**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** Biological and social socialisation does not switch on at midnight on December 31st. If the theory claims a binary difference between someone born Dec 1996 and Jan 1997, it is pseudoscience. The effect must correlate with *exposure* to the formative condition (e.g., years spent with a smartphone in adolescence), not birth certificate date.
  *   **Risk:** Makes segmentation messy. HR systems like boxes; gradients require nuance.

  **4. Migration and Geography**
  *   **Verdict:** **Non-Negotiable (for Validity); Negotiable (for Scope).**
  *   **Case:** "Gen Z" is largely a Western, Anglophone construct. A 17-year-old arriving from a non-digital-native context or a different political regime does not share the "formative events" of a UK-born peer. If the theory claims universality but fails here, it is ethnocentric.
  *   **Risk:** For a 200-person UK org, you might argue you only care about the UK cohort. But if the theory claims to be about *human development*, it must travel.

  **5. Within-Cohort Spread**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** This is the variance test. If the difference *within* Gen Z (rich vs. poor, London vs. rural) is larger than the difference *between* Gen Z and Millennials, the category is statistically useless for prediction. It's a "mean" that represents no individual.
  *   **Risk:** If enforced strictly, this requirement likely kills the concept of generations entirely.

  **6. Explanatory Work (Causality)**
  *   **Verdict:** **Non-Negotiable.**
  *   **Case:** "Gen Z" is a label, not a cause. The cause is "ubiquitous broadband," "housing crisis," or "gig economy." If the theory uses the label as the explanation ("They do X because they are Gen Z"), it is tautological. It must point to the environmental driver.
  *   **Risk:** Consultancies sell the label because the drivers (economy, tech) are harder to "fix" with a workshop.

  **7. Reflexivity (Self-Fulfilling Prophecy)**
  *   **Verdict:** **Negotiable (but high risk).**
  *   **Case:** This is Ian Hacking's "Human Kinds." If you treat people as Gen Z, they may perform Gen Z-ness. This makes the category *unstable*. A good theory should account for this feedback loop. However, demanding the theory solve this might be asking too much.
  *   **Risk:** If you accept this, you admit your onboarding policy might *create* the division it claims to manage.

  **8. Family vs. Social Generations**
  *   **Verdict:** **Negotiable.**
  *   **Case:** This is mostly semantic clarity. Family generations are biological/genealogical (30 years); social generations are historical/cultural (15–20 years). Confusing them leads to bad analogies.
  *   **Risk:** Low impact on policy, mostly conceptual hygiene.

  ---

  ### Part 2: The Conflicts (The Impossible Trinity)

  You suspected your list might ask for the impossible. You are right. There are three specific tensions here that a consultancy report will almost certainly fail to resolve.

  **Conflict A: Boundary Stability (Req 2) vs. Gradient Mechanism (Req 3)**
  *   **The Tension:** You cannot have stable, named boundaries *and* a smooth gradient. If the effect grades smoothly, the boundary is arbitrary. If the boundary is real, the effect must step.
  *   **The Trap:** Consultancies will give you the *appearance* of boundaries (names like "Zoomers") while claiming the *nuance* of gradients ("it's a spectrum"). They want the marketing power of the box with the scientific cover of the gradient.
  *   **Resolution:** Demand they treat boundaries as **administrative conveniences**, not biological realities. If they claim the boundary is real, they fail Req 3.

  **Conflict B: Within-Cohort Spread (Req 5) vs. Actionability**
  *   **The Tension:** To satisfy Req 5 (acknowledge huge internal variance), you must admit the cohort is a weak predictor. But to satisfy your Purpose (a) (decide on policy), you need a strong predictor.
  *   **The Trap:** If the variance within Gen Z is huge, a "Gen Z Onboarding" will misfire on 50% of Gen Zs and alienate 50% of Millennials.
  *   **Resolution:** Demand they quantify the **effect size**. Is "Generation" a stronger predictor of work preference than "Role Type" or "Tenure"? If not, the policy is incoherent.

  **Conflict C: CAP Separation (Req 1) vs. Reflexivity (Req 7)**
  *   **The Tension:** CAP analysis assumes objective variables. Reflexivity assumes the measurement changes the variable. If people change behaviour because they read the report, the CAP analysis is instantly outdated.
  *   **The Trap:** A static report cannot model a dynamic feedback loop.
  *   **Resolution:** Accept that any generational theory has a **half-life**. Policy based on it must be reviewed in 24 months, not 5 years.

  ---

  ### Part 3: The Ontology Question

  > *Is there a requirement in there somewhere, or is the whole ontology question a red herring for my purposes?*

  It is a red herring **if** you are looking for "Natural Kinds" (like chemical elements). Generations are not natural kinds.
  It is **critical** if you are looking for "Functional Kinds" (like "inflammation").

  **The Requirement to Add:** **Predictive Stability.**
  Does using this label allow me to predict an outcome better than random chance, *over time*?
  *   If "Gen Z" just means "people currently aged 18–24," the prediction fails in 5 years (they become 23–29).
  *   If "Gen Z" means "people shaped by Algorithm X," the prediction might hold.

  **Ontology Verdict:** Do not ask "Are generations real?" Ask **"Is this category stable enough to build a process on?"** If the category shifts meaning every 3 years, you cannot build an onboarding track on it.

  ---

  ### Part 4: Missing Requirements

  You missed two critical constraints for a Head of People.

  **9. The Intervention Test (Actionability)**
  *   **Spec:** The theory must specify an intervention that works for the cohort *without* violating equity norms for others.
  *   **Case:** If Gen Z needs "more feedback," can you give that to them without triggering a grievance from Millennials who also want feedback? If the solution is "treat everyone better," you didn't need a generational theory.
  *   **Status:** **Non-Negotiable.**

  **10. The Intersectionality Check**
  *   **Spec:** The theory must account for how generation interacts with class, gender, and ethnicity.
  *   **Case:** A wealthy Gen Z male in London and a working-class Gen Z female in Sunderland may share a birth year but have divergent economic realities. If the theory treats them as identical, it is likely class bias masquerading as generational insight.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Part 5: The "Most Damaging" Requirement

  **Requirement 1 (CAP Separation)** does the most damage to the way people actually talk about generations.

  **Why:** 95% of public discourse conflates **Age Effects** (being young) with **Cohort Effects** (being born in a specific era).
  *   *Discourse:* "Gen Z are job-hoppers."
  *   *Reality:* Young people have always job-hopped more than older people (Age Effect).
  *   *Damage:* When you enforce Req 1, you reveal that most "generational insights" are just stereotypes about youth. This collapses the business case for separate onboarding. It forces the conversation to be about *career stage*, not *birth year*.

  ---

  ### Part 6: The Scorecard

  Here is how the four major views stack up against your Spec.

  | Requirement | **1. Demographic Kinds** (Strauss-Howe style cycles) | **2. Shared History** (Formative Events) | **3. Human Kinds** (Reflexive/Social Construct) | **4. Age/Period Only** (The Skeptics) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. CAP Separation** | **FAIL.** Often conflates age and cohort. | **PASS.** Explicitly tries to isolate formative events. | **N/A.** Rejects objective separation. | **PASS.** Argues cohort effects are negligible. |
  | **2. Boundaries** | **FAIL.** Rigid dates (e.g., 1981–1996). | **NEGOTIABLE.** Allows for fuzzy edges based on memory. | **PASS.** Admits boundaries are arbitrary. | **PASS.** Rejects boundaries entirely. |
  | **3. Gradients** | **FAIL.** Binary membership. | **PASS.** Exposure to events varies by individual. | **PASS.** Identity is fluid. | **PASS.** Age is continuous. |
  | **4. Migration** | **FAIL.** Usually US/UK centric. | **NEGOTIABLE.** Depends on event locality. | **PASS.** Context dependent. | **PASS.** Economic/Age effects travel better. |
  | **5. Within-Spread** | **FAIL.** Assumes homogeneity. | **NEGOTIABLE.** Acknowledges class/region nuance. | **PASS.** Expects divergence. | **PASS.** Highlights variance as proof against cohorts. |
  | **6. Explanatory** | **FAIL.** "Because they are Gen X." | **PASS.** "Because they experienced Y." | **PASS.** "Because they are labelled Y." | **PASS.** "Because they are 25 / Economy is Z." |
  | **7. Reflexivity** | **FAIL.** Treats traits as fixed. | **FAIL.** Treats traits as fixed. | **PASS.** Central to the theory. | **N/A.** |
  | **8. Family vs Social** | **FAIL.** Often conflates the two. | **PASS.** Distinguishes clearly. | **PASS.** Focuses on social. | **PASS.** Ignores family. |
  | **9. Intervention** | **RISKY.** Suggests fixed management styles. | **GOOD.** Suggests context-aware management. | **RISKY.** Management changes the data. | **BEST.** Suggests universal/needs-based policy. |
  | **10. Intersectionality**| **FAIL.** Ignores class/gender. | **NEGOTIABLE.** Can be layered. | **PASS.** Built on social context. | **PASS.** Class/Economy are primary drivers. |
  | **VERDICT** | **Reject.** Too rigid, poor science. | **Consider.** Good narrative, hard to measure. | **Caution.** Useful for culture, bad for policy. | **Accept.** Most robust for policy design. |

  ### Summary Recommendation for the Desk

  1.  **Reject the "Separate Onboarding" proposal** in its current form. It fails Requirement 1 (CAP) and Requirement 9 (Intervention). It risks creating a self-fulfilling prophecy (Req 7) that fragments your culture.
  2.  **Ask the Consultancy for the CAP Analysis.** If they cannot show you the data that separates Age from Cohort, they are selling stereotypes.
  3.  **Pivot to "Career Stage" + "Context".** Design onboarding for *new joiners* (Period effect) and *early career* (Age effect), while acknowledging *digital fluency* or *economic anxiety* (Context) regardless of birth year.
  4.  **Use the "Gradient" argument.** Tell them: "My stepson and his friend born 11 months apart are not different species. Show me the curve, not the cliff."

  This spec protects you from buying a vibe, without requiring you to become a sociologist.
