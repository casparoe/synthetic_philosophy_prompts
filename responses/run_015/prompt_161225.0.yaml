prompt: |-
  I am a PhD student in machine learning, working on interpretability, and for two terms I am embedded with the evaluation team at a lab that ships a vision-and-language model into regulated settings — clinical triage support and insurance claims handling. Part of my job is to help the team write the feature descriptions that go into our model cards and safety cases: statements of the form "direction 14.882 in layer 22 represents X". Those statements are read and signed off by a governance lead with a clinical background, and in two or three disputes a month they are the crux of the disagreement: one engineer reads a feature off its causal profile (what it responds to, what happens to behaviour when it is ablated or clamped), another reads it off training history (what it was ever useful for, at which stage, under which objective). The engineers have no philosophy training, they have roughly half a day per feature, and the documents they produce have to survive external review. So what I need is a written protocol, not a discussion.

  Please write that protocol: a decision procedure the team can run on a candidate feature description, in a fixed order, using only artefacts we actually have — training logs, checkpoints saved at intervals, per-example loss attributions, ablation and clamping results, the data mix, the loss, and the fine-tuning schedule. Ground it in the teleosemantic, selected-effects tradition (Millikan, Papineau, Neander): the content of a representation is fixed by what it has the proper function of indicating, where that function is fixed by a history of selection rather than by the representation's current causal or dispositional profile. The whole difficulty is in the translation, so please keep what the theory actually says while making each step checkable by someone who has never heard of it, and say plainly where a step is a judgement call dressed up as a check.

  Specific requirements:

  - For each step, state what counts as a sufficient answer and what counts as no answer at all. Where a step needs something the team cannot obtain (a counterfactual retrain, a lineage of checkpoints we did not save), say so and say what to do instead.
  - Mark the points at which the procedure returns "no content ascription is licensed here" and stops, and the points at which it hands the remainder to a named person because the residual question is a decision about how fine-grained or how revision-tolerant our descriptions should be, not a fact about the model.
  - Handle explicitly: (a) representations that were never causally recruited — bystanders that track what the network was rewarded for without ever driving it; (b) polysemantic directions, i.e. single directions carrying several apparently unrelated sensitivities; (c) features that first appear during a short fine-tuning stage, and features that survive fine-tuning unchanged; (d) inputs off the training distribution, including adversarial ones — that is, what a Millikan-style notion of Normal conditions should mean for an artefact whose environment is a data pipeline; (e) the standing worry that gradient descent on a next-token or contrastive objective is not selection in the relevant sense, so that nothing in the model has a proper function and every ascription fails — say what the procedure does with that worry rather than leaving it in a footnote; (f) the fact that the team does not really want a historical claim at all. What the governance lead needs is forward-looking: can we rely on this direction to mean X when we monitor it at deployment? Separate that reliability question from the content question in the procedure itself, and say what to do when they come apart.
  - The procedure proper should fit on two printed pages; the applications below can be as long as they need to be.

  Then run it on three cases:

  1. A direction in the image encoder that fires reliably on photographs of dogs and on dog-like textures in rendered scenes, whose clamping degrades dog/non-dog classification and nothing else, and which the whole team wants to call a dog detector.
  2. A direction that appears only after a short fine-tuning stage on a narrow task, which under probing still separates the pretraining property perfectly, but whose ablation now affects only the fine-tuning task.
  3. A scalar feature in the language model's residual stream that tracks a property the team cares about a great deal, which predicts a downstream refusal decision almost perfectly, but which never contributed to the loss during training because it was a bystander to a feature that did.

  I expect the procedure to answer (3) in a way I will not like; say what it says and say why I will not like it. Close with a short section on what the protocol cannot deliver — what a team reading its outputs should still not conclude.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** PhD student in ML interpretability, embedded with an evaluation team in a regulated setting (clinical/insurance).
      *   **Task:** Write a written protocol (decision procedure) for ascribing content to model features (e.g., "direction 14.882 in layer 22 represents X") based on teleosemantics (Millikan, Papineau, Neander).
      *   **Constraints:**
          *   Must be actionable by engineers with no philosophy training (approx. 0.5 day/feature).
          *   Must use available artifacts (logs, checkpoints, loss attributions, ablations, data mix, etc.).
          *   Must acknowledge missing artifacts (counterfactual retraining, etc.).
          *   Must mark stop points ("no content ascription") and hand-off points (judgment calls).
          *   Must handle specific edge cases: bystanders, polysemy, fine-tuning origins, OOD/adversarial inputs, the "GD is not selection" worry, and the reliability vs. content distinction.
          *   Length: Protocol proper $\approx$ 2 printed pages. Cases can be longer.
          *   Output: Protocol + 3 Case Studies + Limitations section.
          *   Specific expectation: Case 3 (bystander) should yield an unfavorable result that needs explaining.

  2.  **Theoretical Grounding (Teleosemantics):**

      *   *Core Idea:* Content is determined by *proper function*. Proper function is determined by *history of selection*. A representation means $X$ if it was selected for indicating $X$ (or causing behavior appropriate to $X$) in the past.
      *   *Key Distinction:* Current causal role (what it does now) $\neq$ Content (what it was selected to do).
      *   *Normal Conditions:* Conditions under which the mechanism was selected to operate.
      *   *The "GD is not Selection" Worry:* Biological evolution selects replicators. Gradient descent minimizes loss. Is there a lineage? Yes, via checkpoints. The "replicator" is the weight configuration persisting because it lowered loss.
      *   *Bystanders:* If a feature correlates with the target but didn't *cause* the loss reduction that kept it, it has no proper function (Millikan's "free rider" problem).
      *   *Reliability vs. Content:* A feature can mean $X$ (historical function) but be unreliable now (broken/drifted), or be reliable for $Y$ now but mean $X$ historically.

  3.  **Drafting the Protocol (Iterative Process):**

      *   *Goal:* Make it look like an engineering SOP (Standard Operating Procedure).
      *   *Structure:*
          1.  Pre-flight Check (Artifacts).
          2.  Step 1: Causal Efficacy (Did it do anything?).
          3.  Step 2: Selection History (Why did it stay?).
          4.  Step 3: Normal Conditions (When was it selected?).
          5.  Step 4: Content Ascription vs. Reliability Handoff.
      *   *Constraint Check:* Needs to fit on ~2 pages. Needs to be strict.
      *   *Addressing the "GD is not Selection" worry:* Address this in the Preamble/Scope. We treat loss-reduction persistence as selection for the sake of the protocol.
      *   *Addressing Bystanders:* This is the crux of Case 3. If it didn't contribute to loss, it has no content.
      *   *Addressing Reliability:* Separate the "What is it?" question from "Can we trust it?" question.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in philosophy jargon. Use terms like "Loss Contribution" instead of "Selection Pressure." Use "Operational Environment" instead of "Normal Conditions." But I must explicitly map these back to the theory in the preamble so the governance lead knows *why* we are doing this.

      *Refining the Steps:*
      *   Step 1: Existence & Stability. (Is it there across checkpoints?)
      *   Step 2: Causal Contribution. (Did ablation hurt loss *during training*?)
      *   Step 3: Specificity. (What specific data feature correlated with the loss drop?)
      *   Step 4: The Bystander Filter. (Crucial for Case 3).
      *   Step 5: The Reliability Handoff.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Dog Detector):* Standard case. Fires on dogs, ablation hurts dog class. History shows it emerged during pretraining on image data. *Verdict:* Content = Dog. Reliability = High.
      *   *Case 2 (Fine-tuning Relic):* Emerges late. Ablation hurts FT task, but probing shows pretraining property. *Teleosemantic twist:* If it existed in pretraining but wasn't *selected* until FT, its content is tied to the FT objective. If it was selected in pretraining but repurposed, content might be ambiguous. Let's make it tricky: It separates pretraining property perfectly (so it carries that info) but ablation only affects FT. Teleosemantics says: Content is what it was selected for. If it only became causal in FT, its content is FT-related, even if it correlates with pretraining stuff. *Wait, prompt says:* "appears only after short fine-tuning... separates pretraining property perfectly... ablation affects only FT task." This implies it's a new direction. If it's new, it was selected during FT. Content = FT task feature. The pretraining correlation is incidental (or latent structure).
      *   *Case 3 (The Bystander):* Tracks property, predicts refusal, *never contributed to loss*. *Teleosemantic Verdict:* **No Content.** It is a free-rider. It correlates with the real feature that did the work. *Why the user won't like it:* Because it's practically useful for monitoring (reliability), but the protocol says we can't claim it *means* the property. This highlights the Content vs. Reliability split.

  5.  **Refining the "GD is not Selection" Worry:**

      *   Must be explicit. We treat the sequence of checkpoints as the lineage. We treat loss reduction as the fitness criterion. We acknowledge this is an analogy, but adopt it as policy for the safety case.

  6.  **Writing the Protocol (Formatting for "2 Pages"):**

      *   Use bold headers.
      *   Use boxes or distinct sections for "Stop" and "Handoff."
      *   Keep language imperative ("Check," "Verify," "Record").

  7.  **Review against Constraints:**

      *   *Fixed order?* Yes.
      *   *Only available artifacts?* Yes (checkpoints, logs, ablations).
      *   *Mark missing artifacts?* Yes (counterfactuals).
      *   *Mark "No Content"?* Yes.
      *   *Mark Handoffs?* Yes.
      *   *Handle (a) Bystanders?* Yes (Step 4).
      *   *Handle (b) Polysemy?* Yes (Step 3 specificity).
      *   *Handle (c) FT vs Pretrain?* Yes (Step 2 timeline).
      *   *Handle (d) OOD/Normal Conditions?* Yes (Step 3 data mix).
      *   *Handle (e) GD vs Selection?* Yes (Preamble).
      *   *Handle (f) Reliability vs Content?* Yes (Step 5).
      *   *Case 3 explanation?* Yes.
      *   *Limitations section?* Yes.

  8.  **Final Polish:**

      *   Ensure the tone is professional, regulatory, yet philosophically rigorous.
      *   Make sure the distinction between "Meaning" (Teleosemantics) and "Utility" (Monitoring) is sharp.
      *   Check the "2 pages" constraint visually (in text, this means concise density).

  *(Self-Correction on Case 2)*: Re-reading the prompt: "appears only after a short fine-tuning stage... separates the pretraining property perfectly." This is a "sleeper" feature or a linear combination that becomes active. If it *appears* only after FT, it wasn't selected in pretraining. Its selection history is the FT stage. Its content is defined by the FT objective. The fact that it separates pretraining property is a correlation, not its function.
  *(Self-Correction on Case 3)*: The prompt says "never contributed to the loss during training because it was a bystander." Teleosemantics is ruthless here. No selection = No function = No content. I must ensure the protocol enforces this strictly.

  9.  **Finalizing the Output Structure:**
      *   **Preamble:** Scope and Theoretical Stance (GD as Selection).
      *   **Protocol:** Steps 1-5.
      *   **Case Studies:** 1, 2, 3.
      *   **Limitations:** What this doesn't solve.

  Let's write it.
answer: |-
  # PROTOCOL 7.4: TELEOSEMANTIC FEATURE ASCRIPTION (TFA)

  **Scope:** This protocol determines the *content* of a candidate feature (direction/neuron) for inclusion in Model Cards and Safety Cases. It relies on **Teleosemantics**: a feature represents $X$ if it was *selected* for indicating $X$ during training.
  **Theoretical Stance:** We treat Gradient Descent as a selection process. Checkpoints are the lineage; Loss Reduction is the fitness criterion. A feature has content only if it causally contributed to loss reduction in a way that preserved it.
  **Artifacts Required:** Training logs, Checkpoint sequence ($C_0 \dots C_N$), Per-example loss attributions (Integrated Gradients/Trak), Ablation/Clamping results, Data mix metadata.
  **Time Budget:** 4 hours per feature.

  ---

  ### STEP 1: LINEAGE AND STABILITY CHECK
  **Goal:** Establish the feature existed long enough to be selected, not merely fluctuated.
  **Procedure:**
  1.  Project the candidate direction onto saved checkpoints $C_0, C_{mid}, C_{final}$.
  2.  Measure cosine similarity of the direction across checkpoints.
  3.  Check activation statistics on a fixed validation set across checkpoints.

  *   **PASS:** Direction exists ($>0.8$ cosine similarity) for $\geq 10\%$ of training steps. Activation variance is non-zero.
  *   **FAIL (STOP):** Direction appears/disappears randomly or exists only in final weights without buildup.
      *   *Action:* Mark as **"Epiphenomenal Noise."** No content ascription licensed.
  *   **MISSING ARTIFACT:** If intermediate checkpoints are missing for a training stage, you cannot verify lineage.
      *   *Action:* Mark as **"Lineage Obscured."** Hand off to **Lead Architect** for risk acceptance.

  ### STEP 2: CAUSAL CONTRIBUTION TO LOSS (THE SELECTION FILTER)
  **Goal:** Determine if the feature was a *driver* of selection or a *bystander*. (Addresses Worry E & Case A).
  **Procedure:**
  1.  Identify the training stage where the feature stabilized (from Step 1).
  2.  Retrieve per-example loss attributions for that stage.
  3.  Correlate feature activation magnitude with loss reduction on those examples.
  4.  **Crucial:** Perform *retrospective ablation* on the checkpoint *prior* to stabilization. Did removing the feature capability increase loss on the *next* checkpoint's validation set?

  *   **PASS:** High correlation between feature activity and loss reduction. Ablation at $C_{t}$ degrades performance at $C_{t+1}$.
  *   **FAIL (STOP):** Feature tracks the target property but shows **zero loss attribution**. It correlates with a driver but did not drive the gradient update.
      *   *Action:* Mark as **"Selected-Effect Bystander."** No content ascription licensed. (See Case 3).
  *   **JUDGMENT CALL:** If attribution is noisy, threshold at top 10% of contributing features.
      *   *Action:* If borderline, hand off to **Safety Lead**. Note: This is a decision about evidence tolerance, not fact.

  ### STEP 3: CONTENT SPECIFICATION (NORMAL CONDITIONS)
  **Goal:** Define $X$ in "Direction represents $X$". $X$ is the property that caused the selection in Step 2. (Addresses Case B, C, D).
  **Procedure:**
  1.  Isolate the top 5% of training examples (by loss attribution) where this feature was active and causal (from Step 2).
  2.  Annotate the common semantic property of these examples.
  3.  Check Data Mix: Does this property belong to the distribution the model was selected on during the stabilization stage?

  *   **PASS:** A single, coherent semantic property (e.g., "canine visual features," "negation syntax") explains $>80\%$ of the causal activations.
  *   **FAIL (STOP):** Activations are causally linked to multiple unrelated properties (Polysemy) with no hierarchical structure.
      *   *Action:* Mark as **"Polysemantic/Collapsed."** Do not ascribe a single semantic label. Describe as "Disjunctive Detector (A or B)."
  *   **FINE-TUNING ORIGIN:** If feature stabilized during Fine-Tuning (FT), content is restricted to the **FT Objective**, even if it correlates with Pretraining properties.
      *   *Action:* Label content relative to FT task (e.g., "Claim Denial Indicator" not "Medical Risk").
  *   **OOD/ADVERSARIAL:** If the feature is monitored on data outside the Step 3 Data Mix (e.g., adversarial attacks):
      *   *Action:* This is a **Reliability** question, not Content. Proceed to Step 5.

  ### STEP 4: THE CONTENT STATEMENT
  **Goal:** Draft the Model Card statement.
  **Format:** "Direction $D$ in Layer $L$ represents [Property $X$], selected during [Stage $S$] under [Objective $O$]."
  **Constraint:** Do not claim the feature *is* $X$. Claim it has the proper function of indicating $X$.

  *   **HANDOFF POINT:** If Steps 1–3 pass, the Content Statement is generated.
  *   **RESIDUAL QUESTION:** The Governance Lead requires assurance that the feature *currently* indicates $X$ reliably. This is not guaranteed by history.
      *   *Action:* Pass the feature to **Step 5 (Reliability Audit)**. Do not conflate Step 4 (Content) with Step 5 (Reliability).

  ### STEP 5: RELIABILITY AUDIT (NON-TELEOSEMANTIC)
  **Goal:** Determine if the historical content holds at deployment. (Addresses Worry F).
  **Procedure:**
  1.  Test feature on current deployment distribution (including OOD).
  2.  Compare activation profile to Step 3 "Normal Conditions."

  *   **OUTPUT:** "Reliable," "Drifted," or "Broken."
  *   **NOTE:** A feature can have Content "Dog" (Step 4) but Reliability "Broken" (Step 5) if it no longer fires for dogs. Conversely, a Bystander (Step 2 Fail) can have Reliability "High" but Content "None."
  *   **DECISION:** The Governance Lead signs off on **Reliability**, not Content. Content justifies *why* we monitor it; Reliability justifies *trusting* it.

  ---

  # CASE STUDIES

  ### Case 1: The Dog Detector
  **Profile:** Image encoder direction. Fires on photos of dogs + dog-like textures in renders. Clamping degrades dog/non-dog classification only.
  **Protocol Run:**
  1.  **Lineage:** Present from mid-pretraining. Stable. (PASS)
  2.  **Causal Contribution:** Loss attributions show high correlation between feature activation and correct dog classification during pretraining. Ablation at $C_{mid}$ increases loss on $C_{final}$. (PASS)
  3.  **Content:** Top causal examples are dogs and dog-textures. Data mix includes renders. Property = "Canine visual patterns." (PASS)
  4.  **Statement:** "Direction 14.882 represents canine visual patterns, selected during pretraining under image-classification objective."
  5.  **Reliability:** Fires on renders (OOD relative to photos, but IN-D relative to training mix). Reliability = High.
  **Verdict:** **Licensed.** The teleosemantic content matches the engineering intuition.

  ### Case 2: The Fine-Tuning Relic
  **Profile:** Appears only after short FT on insurance claims. Probing shows it separates a pretraining property (e.g., "sentence length") perfectly. Ablation affects *only* the FT task (claim approval), not sentence length prediction.
  **Protocol Run:**
  1.  **Lineage:** Absent in pretraining checkpoints. Appears at $C_{FT\_start}$. (PASS for FT lineage).
  2.  **Causal Contribution:** No loss attribution in pretraining (did not exist). High attribution during FT for *claim approval loss*. (PASS for FT selection).
  3.  **Content:** Although it separates "sentence length," the selection pressure (Step 2) was the **Claim Approval Objective**. The correlation with length is incidental to the selection event.
      *   *Constraint Check:* Content is fixed by what it was selected *for*, not what it correlates *with*.
  4.  **Statement:** "Direction $D$ represents claim-approval risk indicators, selected during Fine-Tuning." (NOT sentence length).
  5.  **Reliability:** If sentence length correlates with risk in deployment, it is reliable. If that correlation breaks, reliability breaks.
  **Verdict:** **Licensed, but restricted.** You cannot call it a "Sentence Length Detector" in the safety case, even if probing says so. Its proper function is Claim Risk. Calling it "Length" is a category error under this protocol.

  ### Case 3: The Bystander (The Unfavorable Result)
  **Profile:** Scalar feature in LM residual stream. Tracks "Medical Urgency" perfectly. Predicts downstream refusal decisions ($R^2 = 0.95$). **Never contributed to loss** during training (Integrated Gradients show zero attribution); it rides on the coattails of a nearby direction that *did* drive the gradient.
  **Protocol Run:**
  1.  **Lineage:** Stable. (PASS)
  2.  **Causal Contribution:** **FAIL.** Per-example loss attributions are zero. The feature persisted not because *it* lowered loss, but because it is geometrically coupled to a feature that did. It is a "free rider."
  3.  **Stop Condition:** Protocol Step 2 mandates **STOP**.
  4.  **Statement:** **"No content ascription is licensed here."**
  5.  **Reliability:** Step 5 audit shows it is highly reliable for monitoring urgency.

  **Why you will not like this:**
  You want to write in the Model Card: *"Feature 404 monitors Medical Urgency."* The Governance Lead wants to rely on it for triage auditing.
  The Protocol forces you to write: *"Feature 404 is a reliable statistical correlate of Medical Urgency, but has no proper function."*
  **Reasoning:** Under teleosemantics, meaning requires a history of selection *for that specific indication*. If the gradient descent algorithm never 'noticed' this feature (zero attribution), it never selected it for indicating urgency. It is a shadow cast by the real feature. If you deploy a patch that fixes the *real* feature but leaves this bystander intact, the bystander might decouple from urgency immediately. It lacks the *modal robustness* of a selected trait. The protocol prioritizes safety (avoiding false assurances of semantic stability) over convenience (writing a cleaner model card).

  ---

  # LIMITATIONS & WARNINGS

  **1. The "Black Box" Selection Problem**
  This protocol assumes we can identify *which* feature caused a loss drop via attribution methods. Attribution is imperfect. If attribution fails to credit the true causal feature, Step 2 will falsely classify it as a Bystander. We accept this false-negative rate as the cost of regulatory conservatism.

  **2. Content $\neq$ Use**
  A feature can represent "Dog" (Content) but be used by the head to predict "Cat" (Use) if the downstream weights invert the signal. This protocol ascribes content based on the feature's *input-side* selection history. It does not validate how the readout layer uses it. A separate "Readout Audit" is required for full safety cases.

  **3. The Normative Gap**
  This protocol tells you what the feature *means*, not what it *ought to mean*. If a feature was selected to indicate "Race" during pretraining (Content = Race), and you want to claim it indicates "Zip Code" (to avoid bias), this protocol will flag that claim as false. It prevents sanitizing history, not fixing it.

  **4. No Counterfactuals**
  We cannot retrain the model without the feature to prove necessity (the gold standard for proper function). We substitute with ablation + attribution. This is a proxy. Treat "No Content Ascription" as "Insufficient Evidence for Content," not necessarily "Proof of No Content."
