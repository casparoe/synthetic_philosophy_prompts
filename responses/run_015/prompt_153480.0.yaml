answer: |-
  Here is a 40-minute teaching plan designed for a literary audience. It bypasses technical jargon in favor of structural analogies they already use in their work.

  **Note on Terminology:** In philosophy, the standard term is **"Reasons"** (normative considerations), whereas **"Rationale"** usually implies a post-hoc explanation or a specific agent's reasoning process. Since your draft uses "Rationale," stick to it for consistency in the room, but know that the philosophical weight rests on the word "Reason."

  ### I. The Prerequisite Idea (Minutes 0–5)
  **Concept:** *Discovery vs. Invention.*
  Before they can accept "reasons without reasoners," they must accept that **normative truth is found, not made.**

  *   **The Pitch:** Tell them you are not talking about *laws* (which require a lawgiver) or *feelings* (which require a feeler). You are talking about *fit*.
  *   **The Land:** You must land the distinction between **Psychology** (what is in our heads) and **Normativity** (what is actually correct).
  *   **How to say it:** "When you are writing, you sometimes feel a line is 'wrong.' It's not wrong because you dislike it. It's wrong because it violates the poem's internal gravity. That gravity exists before you identify it. That is the prerequisite: admitting that 'correctness' can exist prior to 'recognition.'"

  ### II. The Carrying Example (Minutes 5–15)
  **The Example:** **The Unwritten Stanza.**
  Do not use the Trolley Problem. Use the experience of a poem that refuses to be written.

  *   **The Scenario:** Imagine a poet sits down to finish a sonnet. They try six different ending couplets. All feel forced. Finally, a seventh option arrives. It feels inevitable.
  *   **What it must HAVE:**
      *   **Constraint:** The poet cannot simply *decide* the seventh option is correct. They must *recognize* it.
      *   **Independence:** If the poet dies before writing it down, the "correctness" of that stanza relative to the previous 12 lines does not vanish. The relationship between the lines holds a truth value independent of the poet's brain.
  *   **What it must LACK:**
      *   **A Enforcer:** There is no "Poetry Police" mandating the line.
      *   **A Audience:** It doesn't matter if anyone ever reads the poem. The fit is internal to the structure, not dependent on reception.
  *   **The Bridge to Morality:** "My character insists moral reasons work like that sonnet. The reason to help a stranger isn't 'because I feel like it' (psychology) or 'because God said so' (lawgiver). It's because the situation *demands* that response, like the sonnet demands that rhyme. The demand exists even if no one hears it."

  ### III. The Arc & Misconception Management (Minutes 15–35)
  Walk them through the three specific traps they will fall into. Head them off *before* they ask.

  **1. The "Divine Command" Trap (Minute 15)**
  *   **The Misconception:** They will hear "objective reasons" and think you mean Religious Morality or Universal Human Rights (i.e., "Rules written in the stars by a Reasoner").
  *   **Where to Head It Off:** Immediately after the Sonnet example.
  *   **The Correction:** "This is not about Commandments. A sonnet doesn't *command* the rhyme; the structure *invites* it. Moral reasons, in this view, are not orders from a king; they are truths about fit. No Reasoner required, just as no God is required for 2+2 to equal 4."

  **2. The "Intentions" Trap (Minute 25)**
  *   **The Misconception:** They will think this erases character motivation. "If the reason is out there, why does the character's inner life matter?"
  *   **Where to Head It Off:** When discussing the character's agency.
  *   **The Correction:** "Reasons without reasoners are not *causes*. They don't make people move. They are just *there*, waiting to be grasped. A character can ignore the reason (write the bad stanza) or heed it (write the good one). The reason exists either way. This actually *increases* dramatic tension: the character can now be *wrong* about reality, not just different from it."

  **3. The "Relativism in Disguise" Trap (Minute 35)**
  *   **The Misconception:** They will think, "Oh, so it's just true *for the character*."
  *   **Where to Head It Off:** In the final summary of the concept.
  *   **The Correction:** "If I say the stanza is 'true for me,' that's taste. If I say the stanza is 'correct,' that's a claim about the poem itself. My character claims moral reasons are correct *simpliciter* (simply), not relative to the agent. If you ignore them, you aren't 'doing your own thing'; you are making a math error."

  ### IV. What NOT to Explain (The "Do Not Cross" Line)
  **Topic:** **Metaethical Ontology.**
  *   **What to say out loud:** "I am not going to explain *where* these reasons live. Are they in a Platonic heaven? Are they brute facts of the universe? Philosophers fight wars over that. For this novel, and for this hour, we only need to agree on the *logic*, not the *location*. We are treating them like mathematical truths: we use them without needing to know what numbers are made of."
  *   **Why:** If you open the door to "Non-Naturalist Realism vs. Quasi-Realism," you will lose the poets. Keep it functional.

  ### V. The Check-Question (Minutes 35–40)
  Do not ask "Does this make sense?" (They will lie to be polite). Ask a structural question that forces them to apply the logic.

  **The Question:**
  > "If we burn every copy of a novel before anyone reads it, did the protagonist still make a *mistake* in Chapter 3 if they betrayed their friend against the logic of their own character?"

  **The Correct Answer (Structure, not Vibe):**
  *   **Yes:** They understand the concept. The "reason" (character logic) existed independently of the "reasoner" (the reader/author observing it).
  *   **No / "It doesn't matter":** They have reverted to Relativism or Subjectivism (believing the truth depends on being observed).

  **Closing Instruction:**
  "Take five minutes. Write down your answer to that question. Don't talk to your neighbor yet. I want to see if the reason survives the fire."
