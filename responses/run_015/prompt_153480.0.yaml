      *Wait, the user is a novelist.* Let's use a **Plot Necessity**.
      *Example:* In *Anna Karenina*, Anna *had* to jump. Not because Tolstoy wanted it, but because the logic of the character + world made it the only "true" outcome.
      *Prerequisite:* Truth in fiction vs. Truth in reality (analogy).
      *Okay, I'm ready.*

