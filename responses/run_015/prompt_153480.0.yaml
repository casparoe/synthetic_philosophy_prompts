      *Let's go with the "Math of Melody" analogy.* Musicians understand that a resolution is "correct" without a person deciding it. But the prompt asks for narrative/art. Let's use **The Rhyme That Wasn't Chosen**.
      *Actually, the "Unread Manuscript" is the strongest philosophical parallel.* If a book is never read, are the truths inside it true?
      *Okay, I will build the plan around **The Unread Manuscript**.*

