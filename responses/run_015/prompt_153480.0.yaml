          2.  Authoritarianism (Intentions).
          3.  Subjective taste (Relativism).
      *   **Off-limits:** Metaethics (Realism vs. Anti-Realism).
      *   **Check Question:** The "Burned Draft" scenario.

      *Wait, I need to be careful.* "Reasons without reasoners" is a specific metaethical claim (Parfit). It's not just about fiction. It's about *moral* reasons. I need to bridge the art example to the moral claim.
      *Bridge:* Just as the poem demands a line, the situation demands an action.
      *Okay, I will structure the example to mirror the moral claim.*

      *Revised Plan:*
      1.  **Prerequisite:** Normativity vs. Psychology.
      2.  **Example:** The "True Note" in music (or poem). Let's go with **The Unplayed Chord**.
      3.  **Misconceptions:** (as above).
      4.  **Off-limits:** Metaethics.
