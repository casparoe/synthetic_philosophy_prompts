answer: |-
  **Project Title:** Relocating the Leveling-Down Objection: The Priority View Under Uncertainty

  **1. Central Question**
  The central question of this project is: Does the Priority View retain its claimed structural advantage over telic egalitarianism when extended from certain outcomes to choice under uncertainty? The standard defence of prioritarianism holds that it avoids the leveling-down objection because it ranks outcomes by summing a concave transform of individual well-being, thereby entailing that a change cannot be better unless it is better for someone. This project tests the conjecture that this immunity is an artefact of restricting the domain to certain outcomes. Specifically, it asks whether the two natural extensions of prioritarianism to uncertainty—ex post and ex ante—violate structural principles that play the same rhetorical role as the "nobody is better off" condition. The possible answers are determinate: either the Priority View survives the extension without violating principles analogous to the leveling-down constraint, or it faces a dilemma where avoiding one violation necessitates another, thereby relocating rather than resolving the objection.

  **2. Why the Question is Open**
  This question remains open despite the formal maturity of social choice theory, primarily because three deflationary responses have not been fully exhausted in the normative literature.

  First, one might argue that uncertainty is the wrong setting for distributive justice because well-being is only realized, not expected. If justice evaluates only actual histories, the ex ante/ex post distinction collapses. However, public policy and moral choice invariably occur under uncertainty. If a theory cannot guide choice where probabilities are known, its practical relevance is severely limited. If this deflationary response is right, the project shifts to proving that prioritarianism is action-guiding only in a restricted domain, which is itself a significant theoretical cost.

  Second, it might be claimed that the choice of extension is already settled by dynamic-consistency arguments, which typically favour the ex ante view. If consistency rules out ex post prioritarianism, there is no substantive dilemma. Yet, ex ante prioritarianism violates statewise dominance in aggregate value, implying a prospect can be better even if it is worse in every possible state. If this deflationary response is right, the project must demonstrate that dynamic consistency is not lexically prior to statewise dominance in distributive contexts.

  Third, one might argue that every aggregative distributive view faces a trade-off among structural principles, so nothing follows specifically against prioritarianism. Impossibility theorems are common. However, prioritarianism is marketed specifically as escaping the leveling-down objection that plagues egalitarianism. If it faces a parallel cost under uncertainty, its unique selling point is undermined. If this response is right, the project concludes that the leveling-down objection is a general feature of distributive trade-offs, not a specific refutation of egalitarianism.

  **3. Method and Work Plan**
  The method combines formal modeling with normative analysis. The early phase involves rebuilding the two initial sketches under explicit assumptions. The ex post sketch suggests that prioritarianism can rank a safe prospect above a risky one even when every person strictly prefers the risky prospect by expected well-being. The ex ante sketch suggests the mirror image: preferring a risky prospect even when its prioritarian value is strictly lower in every state.

  A significant risk must be acknowledged here: these sketches rely on specific utility functions (e.g., square-root transforms) and probability distributions. It is not yet established whether these violations are robust across all concave transforms or merely artefacts of the selected parameters. Furthermore, the normative weight of violating statewise dominance in aggregate value is less intuitive than violating Pareto unanimity. The project must establish that these violations are morally salient, not just mathematically present.

  The most difficult unresolved difficulty is defining what it is for a prospect to be better *for a person* when that person's good is itself risky. The conjecture relies on the claim that ex post prioritarianism violates unanimity about prospects. But this assumes individuals evaluate prospects by expected well-being. If a prioritarian treats individuals as risk-averse about their own well-being, the violation might disappear. However, assuming individuals are risk-neutral about well-being may beg the question against the objection, as it imports the very aggregative logic being tested into the individual evaluation. Resolving whether a prioritarian may stipulate individual risk-neutrality without circularity is a core philosophical task of the first year.

  **Month-by-Month Work Plan**
  *Months 1-3:* Formalize the ex post and ex ante sketches. Verify robustness across alternative utility functions and probability distributions. Identify parameter ranges where violations hold.
  *Months 4-6:* Investigate the "better for" condition. Analyze whether individual risk-attitudes can be separated from social risk-attitudes without circularity. Draft paper on the individual good under risk.
  *Months 7-9:* Explore third extensions. Investigate whether applying the transform to a risk-adjusted certainty-equivalent or weighting states and persons in distinct stages offers a principled escape or is merely ad hoc.
  *Months 10-12:* Complete normative analysis of the violations. Determine if violating statewise dominance in aggregate value is analogous to leveling down. Draft paper on the relocated objection.
  *Months 13-15:* Synthesize findings. Compare results against known impossibility theorems to ensure the result is not a mere restatement. Draft synthesis paper.
  *Months 16-18:* Revision and dissemination. Present at workshops, submit papers, and prepare final report.

  **4. Intended Results and Deliverables**
  The eighteen months will produce three distinct deliverables. First, a technical paper formalizing the dilemma between ex ante and ex post prioritarianism under uncertainty, establishing the robustness of the violations. Second, a normative paper arguing that the structural principles violated under uncertainty play the same rhetorical role as the leveling-down condition, thereby undermining the Priority View's claimed immunity. Third, a working paper on the metaphysics of individual good under risk, addressing the circularity risk regarding individual risk-attitudes. These will be submitted to leading journals in ethics and social choice. Additionally, I will present preliminary findings at two major conferences to solicit feedback on the normative interpretation of the formal results.

  **5. What Would Count as Failure**
  I state candidly that the project could fail in two ways. First, the constructions might be unstable. If the violations disappear under more general specifications of the utility function or probability space, the conjecture is false. The initial sketches are loose; formalization might reveal they rely on edge cases. Second, the generalized objection might turn out to be a restatement of a known impossibility result wearing philosophical clothing. If the dilemma is merely a known theorem regarding ex ante versus ex post welfare without specific implications for the leveling-down debate, the project yields no new normative insight. In either case, the result would be published as a negative finding, clarifying the limits of the Priority View, but it would not achieve the primary goal of relocating the objection.

  **6. Scope and Disciplinary Fit**
  If the project runs too large, I will cut the search for a "third extension" at the six-month mark. If the ex ante/ex post dilemma is proven robust, exploring hybrid views is secondary. The core contribution lies in establishing the dilemma itself, not in solving it. I will focus solely on proving that the Priority View's immunity is artefactual.

  Regarding disciplinary fit: this project belongs in an ethics fellowship rather than a social choice theory seminar because its primary aim is normative, not formal. Social choice theory typically identifies impossibility results; this project asks what those results mean for the justification of distributive principles. The question is not merely whether the axioms are consistent, but whether the Priority View retains its moral advantage over egalitarianism. The formal tools are necessary to test the conjecture, but the deliverable is a conclusion about ethical theory, specifically the viability of prioritarianism as a solution to the leveling-down objection. The project uses formal precision to settle a debate in normative ethics, ensuring that the philosophical stakes drive the mathematical modeling rather than vice versa.
