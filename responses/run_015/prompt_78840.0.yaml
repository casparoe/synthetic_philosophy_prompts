answer: |-
  **Pre-Proposal Reflection on Framing**

  Three candidate questions present themselves. First: *"What is the normatively correct rate of pure time preference for social choice?"* This loses because it asks for a number, which is the domain of economics, not philosophy, and presupposes a single answer exists. Second: *"Does Parfit's reductionism about personal identity entail zero discounting for future generations?"* This loses because it assumes the entailment holds, begging the question against the disanalogies I intend to test. Third: *"Do the standard structural disanalogies between prudential and moral concern suffice to decouple the normative status of pure time preference in individual rationality from that in intergenerational justice?"* This is the winner. It isolates the argumentative mechanism (the disanalogies) rather than the conclusion. It allows for a determinate answer (e.g., "The agency disanalogy fails, but the non-identity disanalogy holds") and clarifies exactly what philosophical labor is required: stress-testing the bridge between the prudential and the moral.

  ***

  **Project Title:** The Prudential-Moral Parallel: Testing the Coupling Thesis in Intergenerational Ethics

  **The Research Question**
  Standard debates on climate economics and intergenerational justice often conflate three distinct claims under "pure time preference": a descriptive claim (how we *do* discount), a prudential claim (how I *should* value my future welfare), and a moral claim (how we *should* value future people's welfare). While often treated as independent, a reductionist view of personal identity suggests a structural parallel: my future self is related to me via psychological connectedness much as a future stranger is related to me, differing perhaps in degree but not in kind. This project asks: **Do the standard structural disanalogies between prudential and moral concern suffice to decouple the normative status of pure time preference in individual rationality from that in intergenerational justice?**

  A successful answer will not merely assert a position but will determine whether specific candidate disanalogies (promissory binding, causal agency, non-identity, and the gradability of concern) can logically block the inference from permissible self-discounting to permissible social discounting. The outcome will be a mapped topology of the argument: identifying which disanalogies successfully sever the link and which fail, thereby clarifying whether the standoff in climate economics between near-zero and positive discount rates rests on a defensible moral distinction or a category error.

  **State of the Debate**
  Current literature treats the prudential and moral spheres as separate silos. Defenders of positive time preference in economics often rely on a tacit prudential intuition (opportunity cost, uncertainty) without justifying its translation to the moral sphere. Conversely, moral philosophers arguing for zero discounting often assume the prudential case is settled or irrelevant. This leaves a gap: if the reductionist picture of personal identity is correct, the burden of proof shifts to those claiming the cases are different. Existing arguments cite differences—such as the ability to bind one's future self via resolution, or the fact that future people's identities depend on our choices (the non-identity problem)—but these are rarely reconstructed as formal constraints on a discount function. Consequently, it remains unclear whether these differences are substantive enough to sustain a divergence in discount rates, or whether they are merely descriptive features without normative weight. The question remains open because the *inferential link* itself has not been stress-tested against its strongest counter-arguments.

  **Methodology and Work Plan (10 Weeks)**
  This project employs conceptual reconstruction rather than empirical survey or historical exegesis. The core method is to treat the candidate disanalogies not as intuitive objections, but as proposed constraints on a normative discount function, testing whether they hold across both prudential and moral cases.

  *   **Weeks 1–3: Formalizing the Coupling Thesis.** I will reconstruct the argument from reductionist personal identity to the "Coupling Thesis" (that prudential and moral discount rates should align). This involves defining the relevant notion of "psychological connectedness" and establishing the baseline parity between future selves and future people.
  *   **Weeks 4–7: Stress-Testing Disanalogies.** I will take the four candidate disanalogies identified in preliminary work (promissory binding, causal agency, non-identity, and gradability of concern) and model them as constraints. For each, I will ask: If this constraint permits discounting in the prudential case, does it *necessitate* or *permit* it in the moral case? For example, if psychological connectedness is graded and grounds graded prudential concern, does moral concern admit of degrees? If not, why?
  *   **Weeks 8–10: Synthesis and Economic Implications.** I will synthesize the results to determine if the Coupling Thesis survives. The final output will map the implications for the parameters used in integrated assessment models, specifically distinguishing between the elasticity of marginal utility and the pure rate of time preference.

  This method is superior to cataloguing intuitions because it forces the arguments into a structure where inconsistencies become visible. Intuition pumping often allows scholars to hold contradictory standards for selves versus strangers; reconstructing these as constraints on a function reveals whether the distinction is principled or ad hoc.

  **Success and Failure Conditions**
  I am committed to a honest assessment of the argument's viability.
  *   **Success:** A determinate verdict on at least two of the four disanalogies. For example, demonstrating that the "non-identity" disanalogy fails to block the coupling claim, while the "gradability of concern" disanalogy succeeds. This would narrow the philosophical ground significantly, even if it doesn't settle the exact discount rate.
  *   **Failure:** The project fails if the reconstruction shows that the disanalogies are too context-dependent to function as general constraints, or if the "Coupling Thesis" relies on a conception of personal identity that is too controversial to serve as a premise for public policy. In this case, the deliverable will be a proof of the *indeterminacy* of the current debate, demonstrating that existing arguments are insufficient to decouple the two spheres. This is a negative result, but a philosophically robust one.

  **Feasibility and Fallback**
  Ten weeks is sufficient for the reconstruction and testing phase, but there is a risk that the "causal agency" and "promissory binding" disanalogies require more extensive engagement with political theory than anticipated.
  *   **Fallback Plan:** If the scope proves too broad, I will prioritize the "Non-Identity" and "Gradability" constraints. These are the most distinctly philosophical and have the highest leverage on the Coupling Thesis. The "agency" and "promise" arguments, while important, are more contingent on institutional facts and can be noted as areas for future work without compromising the core ethical argument.

  **Interdisciplinary Payoff**
  For economists, this project clarifies the ethical provenance of the discount parameter. It suggests that the disagreement between the "near-zero" camp (e.g., Stern) and the "positive rate" camp (e.g., Nordhaus) may not be about patience versus impatience, but about whether they accept the moral relevance of the prudential/moral parallel. For political theorists, it reframes obligations to posterity. If the Coupling Thesis holds, obligations to the future are not acts of charity or supererogation, but requirements of consistency analogous to prudential rationality. This shifts the debate from "how much should we sacrifice?" to "what constitutes rational agency over time," offering a new vocabulary for climate justice that bridges the gap between individual rationality and collective obligation.
