answer: |-
  Yes, this is fundamentally a moral luck movie, but it uses the framework to demonstrate why philosophical absolution fails to alleviate human grief.

  The standard philosophical examples you read often focus on the blameless truck driver to show how we punish outcomes rather than intentions, but *Manchester by the Sea* operates on a more brutal variant called resultant luck involving negligence. You are right that Lee isn't the blameless driver; he was careless with a fire and intoxicated, which means on a purely logical level, he bears responsibility regardless of the outcome. However, the film illustrates how moral luck warps that responsibility into something unmanageable: on ninety-nine other nights, his negligence results in a burnt pot or a smoke alarm, and he goes to bed guilty but unchanged. On this one night, the same negligence results in three deaths, transforming a manageable guilt into a totalizing identity. The film illuminates how the magnitude of the outcome, which was largely a matter of chance (the wind, the matches, the timing), dictates the severity of the punishment Lee inflicts on himself, proving that our moral landscape is indeed governed by luck, even when negligence is present.

  Where the film resists the standard philosophical reading is in its treatment of external forgiveness versus internal acceptance. Moral luck theory often suggests that if we acknowledge the role of chance, we should mitigate our blame and move forward; the town of Manchester attempts exactly this by refusing to condemn Lee, offering him a social pardon based on the understanding that the tragedy outweighs the crime. The scene with his ex-wife Randi is the crushing counter-argument to this theory. She offers him the ultimate moral repair: she admits her own cruelty, forgives his negligence, and asks to share the burden. Lee's inability to accept this isn't just stubbornness; it is the film asserting that some outcomes create a moral debt that forgiveness cannot cancel. While philosophy argues that luck should dilute blame, the film argues that when the luck is catastrophic, the agent's internal experience of guilt becomes immune to external absolution.

  Your concept of "audience luck" is not a standard term in the canonical literature, but it is a sharp and valid extension of circumstantial luck regarding moral community. Circumstantial luck usually refers to the challenges you face, but you have identified the luck of who is left standing to witness your penance. Lee's brother Joe was the crucial buffer; he was the only person who could hold Lee's guilt without breaking, effectively acting as a container for Lee's shame. When Joe dies, Lee loses that audience, leaving him alone with a guilt too large for one person to carry. This compounds the resultant luck of the fire with the circumstantial luck of isolation. If Joe had lived, Lee might have stayed in Manchester; the luck of Joe's health was just as pivotal as the luck of the fire.

  Ultimately, the movie is not asking whether Lee is to blame—the film accepts he is—but whether blame can ever be resolved through reason or community. The moral luck framework explains why the accident happened and why the town forgives him, but the film concludes that these factors are irrelevant to the sufferer. Lee cannot accept the town's kindness or his ex-wife's forgiveness because he recognizes that the luck involved doesn't change the reality of the ashes. The film argues that while moral luck may determine how the world judges us, it cannot determine whether we can live with ourselves, and in Lee's case, the luck was simply too bad for any philosophical framework to fix.
