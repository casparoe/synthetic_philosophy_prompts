  *   **Assessment:** This is the probability that moral obligation in collective contexts does *not* conceptually require causal efficacy (e.g., fairness-based duties vs. consequentialist duties). If obligation requires efficacy, the objection succeeds against voting and fails against climate (due to marginal harm). If obligation relies on fairness/membership, the objection fails for both (force = 0 for both).
