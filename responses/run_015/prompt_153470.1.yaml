  **Decomposition and Calculation**

  This figure is derived from a weighted synthesis of the four sub-components. The calculation assumes the proposition $E$ (the objection applies with equal force) is true if either moral obligation is independent of efficacy ($d$) OR, if obligation depends on efficacy, the causal pathways are effectively identical ($a$). Components ($b$) and ($c$) act as modifiers on the weight of ($a$) and ($d$).

