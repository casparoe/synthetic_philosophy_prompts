  **(a) Causal Pathways & Pivotal Probabilities: 0.20**
  *   **Assessment:** Under Causal Decision Theory (CDT), the pathways are fundamentally distinct. Voting is a threshold mechanism (binary outcome); climate mitigation is a linear mechanism (continuous harm). Even controlling for pivotality (probability $\approx 0$), the *expected causal value* of reducing emissions is non-zero (marginal harm), whereas the expected causal value of a single vote is effectively zero.
  *   **Framework Location:** This probability assumes a **CDT framing**. Under Evidential Decision Theory (EDT), the correlation between individual action and group outcome raises $P(a)$ significantly (toward 0.6), as voting and mitigating both signal/cause similar actions in like-agents. I have weighted CDT higher (0.8) than EDT (0.2) in this synthesis, depressing $P(a)$.

