answer: |-
  **Session Plan: Path Dependence in History of Science**

  **1. The Dependency Order**
  Before the phrase "locked in" makes sense, students must grasp **Self-Reinforcement**. If they view historical choices as static events, lock-in looks like conspiracy or stubbornness. They need to understand that early adoption changes the *value* of subsequent adoption.
  *   **Teach this first:** A choice isn't just a selection; it's an investment. The more people adopt Option A, the costlier it becomes to switch to Option B, regardless of Option B's quality.
  *   **Why:** Without self-reinforcement, "lock-in" is just "tradition." With it, "lock-in" is a structural constraint.

  **2. The Carrying Example: The 1884 Greenwich Meridian**
  Use the International Meridian Conference. Do not use QWERTY.
  *   **What it must show:**
      *   **Equifinality:** Paris and Greenwich were scientifically equivalent. Neither was "true."
      *   **The Critical Juncture:** The 1884 vote was close (22 to 1). It was not a foregone conclusion of British imperial power alone; French resistance was viable.
      *   **The Lock-In Mechanism:** Once Greenwich was adopted for maritime charts, the cost of re-printing global navigation logs, maps, and timekeeping infrastructure created prohibitive switching costs. The *network* locked it, not the *science*.
  *   **What it must avoid:**
      *   **Technical Determinism:** Do not imply Greenwich time was more accurate.
      *   **Political Determinism:** Do not imply Britain simply forced it. Emphasize the voluntary coordination by other nations because switching became too expensive later.
      *   **Conflating with Determinism:** Make clear that *after* 1884, the outcome looks inevitable. *Before* 1884, it was not.

  **3. Mapping the Misconceptions**
  Address these in the order students will naturally generate them.

  *   **Misconception 1: Determinism ("It had to happen this way.")**
      *   **When to head off:** **Introduction.**
      *   **How:** Explicitly state the counterfactual: "If the 1884 vote had gone differently, we would likely be using Paris time today." Force them to accept initial contingency before discussing later constraint.
  *   **Misconception 2: Radical Contingency ("Anything could have happened at any point.")**
      *   **When to head off:** **During the Example (Post-1884).**
      *   **How:** Show the narrowing of options. By 1900, switching to Paris was theoretically possible but practically impossible. History isn't infinitely flexible; the path narrows over time.
  *   **Misconception 3: Meritocracy ("The best idea always wins eventually.")**
      *   **When to head off:** **Conclusion/Synthesis.**
      *   **How:** Ask why Paris didn't win back later when it might have been more convenient for continental Europe. Answer: The "merit" gain was smaller than the "switching" cost. Efficiency does not overwrite inertia.

  **4. What to Refuse to Explain**
  Do not explain **ergodicity** or the underlying **mathematical models** (Markov chains, probability distributions).
  *   **What to say:** "Economists model this with non-ergodic stochastic processes. For historians, the translation is simple: history does not erase its tracks. We are not doing the math; we are tracing the mechanism."
  *   **Why:** It distracts from the historical mechanism and alienates non-economists without adding explanatory power for this session.

  **5. The Check Question**
  Do not ask them to define path dependence or recount the Greenwich vote. Ask this:

  *"If we rewound history to 1880 and changed only one variable—the size of the British Navy—would the outcome necessarily change? Why or why not, based on the mechanism of self-reinforcement?"*

  *   **Correct Answer:** No. The Navy size matters less than the existing infrastructure of charts and logs already in use by multiple nations. The lock-in was driven by coordination costs among *all* users, not just British coercion.
  *   **What it proves:** They understand that path dependence relies on systemic switching costs, not just the power of the initial actor.
