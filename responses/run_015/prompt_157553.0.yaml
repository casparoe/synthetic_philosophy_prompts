      *   *Correction:* The speaker says "solely to the absolute condition of the worst-off." This sounds like **Maximin** (Rawls) or **Strict Prioritarianism**. But Rawls *does* care about equality (the first principle). So it's more likely a **Prioritarian** view (Parfit).
