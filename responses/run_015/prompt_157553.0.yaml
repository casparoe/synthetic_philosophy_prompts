      *   The weakness is that **Priority to the Worse-Off is inherently relational in practice.** You cannot identify the "worst-off" without a metric that implies a scale where others are "better-off." Furthermore, the *weight* given to the worst-off is often justified by the *unfairness* of their position relative to others (luck egalitarianism roots), even if the theory claims to be non-comparative. If the speaker denies *any* value to equality, they struggle to explain why we prioritize the worst-off *over* the best-off if not because the *gap* represents a moral deficit.

