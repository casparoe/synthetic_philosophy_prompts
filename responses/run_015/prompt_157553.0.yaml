      *   The weakness: **The Identification Problem.** To identify the "worst-off" for priority, you often need a distribution. More subtly, the *reason* we care about the absolute level often stems from social comparisons (envy, status, power dynamics). In an ecological settlement, relative power often dictates absolute survival. Ignoring equality might ignore the *causes* of the absolute deprivation.
