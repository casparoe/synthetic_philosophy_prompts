      *   *Neuron Swap (Ship of Theseus variant):* Classic Ramp Pump. High risk of "Impossible Physics" in Cog Sci context.
      *   *Mary's Room (Knowledge Argument):* User thinks it's persuasive. I need to be honest. Does it pass the checklist? It often fails the "Self-certifying" check (what counts as "knows"?). It often fails the "Cog Sci" check (is the setup physically coherent?). I must not let it slide if the checklist kills it, per instructions.

  6.  **Refining the "Human Judgement" vs. "Objective" distinction:**
      *   Objective: Is the term defined? Is the step skipped?
      *   Judgement: Is the intuition *shared*? Is the trade-off *worth it*?

  7.  **Drafting the Content (Iterative refinement):**
