prompt: |-
  Hey — I referee for a small interdisciplinary journal (philosophy + cog sci) and maybe one paper in three rests most of its weight on a thought experiment: a trolley variant, an overnight violinist hookup, a neuron-by-neuron brain swap told as a slow ladder. I want a checklist I can actually run in ~15 minutes to decide whether the case is doing real work or just pumping an intuition, and what to put in the report when it's the latter (let it stand / needs a minimal-pair sibling / illustrative only / not fixable in a revision).

  Three failure modes I keep suspecting and want handled: filler-flip, where the reader silently fills the unstated background in from the actual world so two readers are running different cases (test: invert the defualt filler and see if the verdict flips); ramp pumps, where every step of a graded series looks fine and only the endpoint gets rejected (test: shuffle the steps, or skip straight to the end); and self-certifying description, where the case is told using the very term under dispute. Add any mode I'm missing, mark which checks are genuine requirements and which are just one camp's prejudice, and flag the points where it has to hand the decision to a human because it's a values or judgement call.

  Run it on those three cases, plus the colour scientist in the black-and-white room — I think that last one is genuinely persuasive, so if the procedure kills it say so plainly rather than letting it slide. My co-editor signs off on the report, so note which steps she can spot-check quickly. And be honest about what the procedure can't tell me.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **User:** Referee for a small interdisciplinary journal (Philosophy + Cog Sci).
      *   **Problem:** Too many papers rely heavily on thought experiments (TEs). Need a way to distinguish "doing real work" vs. "just pumping intuition."
      *   **Goal:** A ~15-minute checklist to evaluate TEs.
      *   **Specific Failure Modes to Address:**
          1.  *Filler-flip:* Unstated background assumptions vary between readers.
          2.  *Ramp pumps:* Sorites-style slippery slopes where steps look fine but the endpoint is rejected.
          3.  *Self-certifying description:* Begging the question via language.
      *   **Additional Requirements:**
          *   Add missing failure modes.
          *   Distinguish genuine requirements vs. camp-specific prejudices.
          *   Flag human judgement calls (values/judgement).
          *   Test the checklist on four specific cases: Trolley, Violinist, Ship of Theseus/Neuron Swap, Mary's Room (Color Scientist).
          *   Provide reporting recommendations (Let stand / Minimal-pair sibling / Illustrative only / Not fixable).
          *   Note steps the co-editor can spot-check.
          *   Be honest about limitations.

  2.  **Deconstruct the Task:**
      *   I need to create a structured protocol (The "15-Minute TE Stress Test").
      *   I need to integrate the user's specific failure modes.
      *   I need to identify *other* common failure modes (e.g., Idealization vs. Impossibility, Framing Effects).
      *   I need to apply this protocol to the four specific examples.
      *   I need to provide reporting templates.
      *   I need to maintain a tone that is professional, critical, yet practical for an interdisciplinary context.

  3.  **Drafting the Checklist (The "15-Minute TE Stress Test"):**
      *   *Time Management:* 15 minutes is tight. The checks need to be heuristic, not deep dives.
      *   *Structure:*
          1.  Description Check (Self-certifying).
          2.  Background Check (Filler-flip).
          3.  Structure Check (Ramp pumps).
          4.  Relevance Check (Interdisciplinary bridge).
      *   *Categorization:* Must mark "Hard Requirement" vs. "Theoretical Preference" vs. "Human Judgement."
      *   *Editor Spot-Check:* Identify which parts are objective enough for a co-editor to verify quickly.

      *   *Missing Failure Modes:*
          *   *The "Impossible Physics" Problem:* In Cog Sci, if the TE violates known cognitive architecture, it might be useless.
          *   *Framing Effects:* Does the order of presentation change the intuition? (Related to Ramp Pumps but distinct).
          *   *The "So What?" Test:* Does the intuition actually support the conclusion, or just establish a premise?

  4.  **Developing the Reporting Categories:**
      *   *Let Stand:* TE is robust.
      *   *Minimal-Pair Sibling:* Needs a control case to rule out confounds.
      *   *Illustrative Only:* TE is heuristic, not evidential.
      *   *Not Fixable:* TE is fundamentally flawed for the argument's weight.

  5.  **Running the Checklist on the Four Cases:**
      *   *Trolley:* Classic. High risk of filler-flip (cultural norms). Ramp pump risk (loop variant).
