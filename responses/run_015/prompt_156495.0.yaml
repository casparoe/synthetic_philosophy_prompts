answer: |-
  Here is a 15-minute protocol designed for interdisciplinary refereeing (Philosophy + Cog Sci). It treats thought experiments (TEs) as *data-generating instruments* rather than rhetorical flourishes. If the instrument is uncalibrated, the data is noise.

  ### The 15-Minute TE Stress Test

  **Legend:**
  *   **[REQ]**: Genuine requirement for argumentative validity.
  *   **[PRJ]**: Theoretical prejudice (flag for author transparency, not necessarily rejection).
  *   **[JUD]**: Human judgement call (values/interpretation).
  *   **[ED]**: Co-editor can spot-check this quickly (objective/verifiable).

  ---

  #### Phase 1: Description & Semantics (3 Minutes)
  *Goal: Detect Self-Certifying Description.*

  1.  **[ED][REQ] The Definition Scan:** Circle every loaded term in the TE setup (e.g., "person," "knows," "pain," "conscious"). Does the text define these operationally, or does it rely on the reader's pre-theoretic usage?
      *   *Fail:* If the conclusion is hidden in the definition (e.g., calling a fetus a "person" in the setup of an abortion argument).
  2.  **[JUD] The Synonym Swap:** Replace the contested term with a neutral placeholder (e.g., swap "knowledge" for "K"). Does the intuition persist?
      *   *Fail:* If the intuition vanishes when the label is removed.

  #### Phase 2: Background & Context (5 Minutes)
  *Goal: Detect Filler-Flip & Psychological Plausibility.*

  3.  **[REQ] The Background Inversion:** Identify one unstated background assumption (e.g., "the driver is sober," "the violinist is a stranger," "the room is sealed"). Invert it mentally (e.g., "the driver is negligent," "the violinist is your child").
      *   *Fail:* If the verdict flips based on this inversion, the case is under-specified.
  4.  **[ED][REQ] The Cog-Sci Reality Check:** Does the TE violate known cognitive architecture or physical laws in a way that breaks the mechanism being tested? (e.g., A TE about memory that assumes infinite storage without cost).
      *   *Fail:* If the impossibility is relevant to the conclusion (not just a convenient simplification).
  5.  **[PRJ] The Cultural/Gender Load:** Does the scenario rely on specific social norms (e.g., pregnancy, trolley authority) that might not generalize?
      *   *Flag:* Author must acknowledge this limitation if the claim is universal.

  #### Phase 3: Structure & Progression (5 Minutes)
  *Goal: Detect Ramp Pumps & Framing.*

  6.  **[ED][REQ] The Endpoint Jump:** Look at the graded series (the "ramp"). Does the author argue every step is identical, then claim the endpoint is different?
      *   *Fail:* If no relevant difference is identified between Step N and Step N+1, yet the verdict changes.
  7.  **[JUD] The Shuffle Test:** If the steps were presented in reverse order, would the reader arrive at the same conclusion?
      *   *Fail:* If the order creates a momentum that forces the verdict (hysteresis).
  8.  **[REQ] The Control Case:** Is there a "minimal-pair" scenario provided where the variable of interest is absent, but background conditions are identical?
      *   *Fail:* If the TE is the *only* evidence offered for a causal claim.

  #### Phase 4: Weight & Function (2 Minutes)
  *Goal: Determine Reporting Category.*

  9.  **[JUD] The Weight Check:** If you remove this TE, does the argument collapse, or does it just lose an illustration?
  10. **[JUD] The "So What?" Test:** Even if the intuition is robust, does it actually settle the theoretical dispute, or does it just push the problem back one step?

  ---

  ### Reporting Categories
  *Based on the failures above, assign one of these dispositions:*

  1.  **Let Stand:** No [REQ] failures. Intuition is robust across inversions.
  2.  **Minimal-Pair Sibling:** [REQ] Fail on #8 (Control Case). Author must construct a contrast case to isolate the variable.
  3.  **Illustrative Only:** [REQ] Fail on #9 (Weight). The TE is too unstable to carry the argument's weight; it must be demoted to a heuristic example, and empirical/theoretical support must be added.
  4.  **Not Fixable:** [REQ] Fail on #1 (Self-Certifying) or #4 (Cog-Sci Reality). The TE is fundamentally question-begging or physically incoherent in a way that matters.

  ---

  ### Application to Your Four Cases

  Here is the protocol run on the specific examples you provided.

  #### 1. The Trolley Variant
  *   **Filler-Flip (#3):** High risk. *Inversion:* What if the one person on the track is the driver's child? Verdict flips.
      *   *Result:* **Minimal-Pair Sibling.** The author must specify that personal relationships are held constant, or argue why they aren't relevant.
  *   **Self-Certifying (#1):** Low risk, unless "harm" is defined in the setup.
  *   **Cog-Sci Check (#4):** Pass. Physics are standard.
  *   **Verdict:** Usually **Illustrative Only**. In interdisciplinary work, Trolley cases often fail to predict actual behavior (experimental philosophy data). If the paper claims this dictates normative truth, it needs empirical backing.
  *   **Editor Spot-Check:** Verify if the author acknowledges the "personal relationship" confound.

  #### 2. The Overnight Violinist (Thomson)
  *   **Filler-Flip (#3):** Critical failure point. *Inversion:* What if the violinist is a fetus? (This is the point, but readers fill in "stranger" vs "kin"). What if the hookup was consensual vs. kidnapping?
      *   *Result:* **Minimal-Pair Sibling.** Needs a version where the dependency arises from negligence to test the "right to life" vs "right to bodily autonomy" isolation.
  *   **Self-Certifying (#1):** Moderate risk. Describing the entity as a "person" vs "potential person" in the setup often decides the case.
  *   **Cog-Sci Check (#4):** Pass (biologically plausible enough).
  *   **Verdict:** **Needs Revision.** Often functions as a *reductio* of the "right to life" premise, but in an interdisciplinary journal, it requires acknowledgment of the psychological dissimilarity between a violinist and a pregnancy (attachment hormones, etc.).
  *   **Editor Spot-Check:** Check if the setup explicitly rules out prior consent.

  #### 3. Neuron-by-Neuron Brain Swap (Ship of Theseus / Ladder)
  *   **Ramp Pump (#6 & #7):** Critical failure point. This is the definition of a Sorites paradox.
      *   *Result:* **Not Fixable** *if* the argument relies on a sharp cutoff. If the argument is that "identity is vague," it passes. If the argument is "Identity persists at 100% swap," it fails the Ramp Pump check because no mechanism explains *where* persistence stops.
  *   **Cog-Sci Check (#4):** High risk. Current Cog Sci suggests identity/selfhood is not a simple substrate-independent variable.
      *   *Result:* **Illustrative Only.** It cannot bear the weight of a claim about *actual* personal identity without a theory of information integration.
  *   **Verdict:** **Illustrative Only.** It pumps an intuition about continuity, but cannot prove metaphysical persistence.
  *   **Editor Spot-Check:** Verify if the author claims a specific % swap retains identity (if so, reject).

  #### 4. Mary's Room (The Color Scientist)
  *   **Honest Assessment:** You suspect this is persuasive. The checklist is designed to be harsh. Here is where it breaks.
  *   **Self-Certifying (#1):** **FAIL.** The case rests on the definition of "knows." If "knows" includes "phenomenal experience," the conclusion is in the premise. If "knows" means "propositional information," the intuition holds. The TE often smuggles the dualist conclusion into the word "learn."
  *   **Cog-Sci Check (#4):** **FAIL.** A brain deprived of color input does not process "black and white" in the way the TE assumes; neural plasticity and cross-modal compensation make the "complete physical knowledge" premise physically incoherent.
  *   **Filler-Flip (#3):** **FAIL.** If Mary is an AI vs. a Human, the intuition shifts.
  *   **Verdict:** **Not Fixable (as a proof).**
      *   *Note:* I know you find this persuasive. However, under this protocol, Mary's Room functions as a *statement of a puzzle*, not a *solution*. It demonstrates a gap in physicalist *descriptions*, but it does not prove non-physical *properties* unless one accepts the self-certifying definition of knowledge.
      *   *Recommendation:* If the paper uses Mary to *prove* dualism, it must be **Illustrative Only**. If it uses Mary to *highlight* the explanatory gap (without claiming to solve it), it can **Let Stand**.
      *   *Editor Spot-Check:* Check if the conclusion claims "Physicalism is false" (Reject) vs "Physicalism has an explanatory gap" (Accept).

  ---

  ### Missing Failure Modes (Added to Protocol)

  1.  **The "Impossible Physics" Problem:** (Included in #4 above). In Cog Sci, we cannot assume the brain works like a Cartesian theater. If the TE requires a homunculus to work, it fails.
  2.  **Framing Effects:** (Included in #7 above). The order of information presentation alters moral/intuitive judgment (confirmed by psych literature).
  3.  **The "So What?" Test:** (Included in #10). A TE can be valid but irrelevant. (e.g., Proving a zombie is conceivable doesn't prove zombies exist).

  ### Limitations of this Procedure

  Be honest with your co-editor about what this checklist *cannot* do:

  1.  **It cannot settle metaphysics:** It can tell you if an argument is *validly structured*, not if the conclusion is *true*. A valid TE can still support a false theory.
  2.  **It cannot measure "Shared Intuition":** The checklist assumes the referee's intuition is the control. It cannot detect if the referee is the outlier. (Mitigation: Check if the author cites experimental philosophy data).
  3.  **It penalizes novelty:** New TEs will almost always fail the "Background Inversion" test initially because the background hasn't been mapped yet. Use discretion for groundbreaking papers.
  4.  **It favors Physicalism:** The "Cog-Sci Reality Check" inherently biases against dualist or non-naturalist TEs. Mark this as **[PRJ]** in your report so the author knows the bias source.

  ### Template for the Report (Copy/Paste)

  > **Thought Experiment Evaluation**
  >
  > I have evaluated the central thought experiment ([Name]) using a structural stress test.
  >
  > **Status:** [Let Stand / Minimal-Pair Sibling / Illustrative Only / Not Fixable]
  >
  > **Key Findings:**
  > *   **Self-Certification:** [Pass/Fail]. The term "[Term]" appears to carry the conclusion in its definition.
  > *   **Background Stability:** [Pass/Fail]. Inverting the assumption regarding [Assumption] flips the verdict.
  > *   **Interdisciplinary Coherence:** [Pass/Fail]. The setup conflicts with current models of [Cognitive Mechanism].
  >
  > **Requirement for Revision:**
  > The TE cannot carry the full weight of the conclusion. Please either:
  > 1.  Provide a minimal-pair control case to isolate [Variable].
  > 2.  Demote the TE to an illustrative role and provide empirical/theoretical support for the claim.
  > 3.  Explicitly acknowledge the [Cultural/Physical] limitation identified in check #3/#4.
  >
  > *(Editor Note: Checks #1, #4, and #6 are objective and can be verified by cross-referencing the manuscript text.)*

  This gives you a defensible, standardized way to push back on "intuition pumping" without simply saying "I don't buy it."
