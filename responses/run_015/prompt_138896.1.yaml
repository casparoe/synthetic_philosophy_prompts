          *   Idea B (Cohesion): Mechanism-based (Biological Species Concept / Cohesion Species Concept leanings).
      *   **Tasks:**
          1.  Identify where they diverge (real cases, not just verbal).
          2.  Apply both to five specific cases and judge the verdicts.
