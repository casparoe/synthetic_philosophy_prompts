prompt: |-
  I chair the clinical ethics consultation committee at a 400-bed community hospital, and I have been asked to write down, once and for all, how we actually reach a recommendation. The constraints matter: we meet weekly, we have roughly forty minutes per consultation, our written recommendation must be signed by at least three of the five members and countersigned by the attending physician, it is read by families and occasionally by hospital counsel, and although it is formally advisory it is in practice almost always followed. The five of us do not share a moral outlook and are not going to. One member reasons in terms of side-constraints and the distinction between ordinary and extraordinary means; one is a straightforward consequentialist who thinks in expected QALYs; one works in a care-ethics register where the unit of analysis is the relationship and the family rather than the patient; one is a lawyer who mostly asks what is defensible after the fact; I am on the committee only because I took two philosophy courses and got assigned the paperwork. So I do not want a resolution of our disagreement. I want a procedure for aggregating across moral theories that none of us fully accepts, in a form that five non-specialists can run in forty minutes in a room with a family waiting, and that is honest about which of its steps are arithmetic and which are value judgments in a lab coat.

  We tried the obvious thing already and it broke in three specific ways, which is why I am writing to you rather than just using it. We each named the theories we give weight to, assigned credences, had each theory score the available options on a 0–100 scale, and took the weighted average. First, it recommended options that no theory on our list endorses — in one case, continue the ventilator but stop the pressors, which the consequentialist regards as pointless cruelty and the deontologist regards as impermissible once you have granted that stopping is killing; the average liked it only because it was midway. Second, the numbers were not comparable: a 70 from the consequentialist is most of the way to the best available outcome, while a 70 from a constraints-based theory is a flat prohibition with no room to trade, and we had no defensible way to normalize the two onto one scale or to say where each scale's zero and ceiling sit. Third, when one member assigned a small credence to a theory on which a certain action is catastrophic in a way that dwarfs everything else, that theory swallowed the calculation entirely and the other ninety-odd percent stopped mattering. I want your procedure to have something to say about each of these three failure modes — options no theory endorses, intertheoretic comparisons of how much a theory cares, and stakes that are unbounded or lexicographically dominant — and also about two further wrinkles: whose credences go in (the five of us averaged, versus the patient's own values if we know them, versus some outside moral expert), and what to do when the theories on our list disagree about how to aggregate under moral uncertainty in the first place.

  So please give me the decision procedure itself: the questions in order, what counts as an adequate answer to each at the level of rigor a non-philosopher can actually produce in a few minutes, the points at which the procedure halts with a no, and the points at which it must stop and hand the decision to a human being because the question is one of values rather than facts. Then run it on three cases from our last year. (1) A daughter, acting as surrogate, insists that everything continue for her father three weeks after a catastrophic brain injury that the treating team regards as incompatible with any meaningful recovery; the team wants to withdraw life-sustaining treatment and the two of us who think in constraints disagree about whether this is a case of ceasing futile treatment or of killing. (2) One ICU bed remains during a respiratory surge: the first patient arrived earlier and is far sicker, with roughly a 25 percent chance of survival, the second arrived later with roughly a 70 percent chance, and our members split between sickest-first and most-lives-saved reasoning. (3) The withdrawal case again, but now one member reports a 3 percent credence in a view, shared by the family's religious tradition, on which the patient may still have a conscious inner life and withdrawing nutrition and hydration is the killing of an innocent person with a disvalue so large it cannot be traded off; on our old method this fixes the answer at never withdraw, and does so for any nonzero credence, which no one on the committee is willing to sign. Case 3 is the one where I expect to dislike the answer, and I would rather have the procedure tell me something I hate than have it quietly rigged to avoid that. Please also say plainly what the procedure cannot do, and give me a short format for recording the reasoning so that a future committee, or a lawyer, can audit what we actually did.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a clinical ethics consultation committee (CEC) at a 400-bed community hospital.
      *   **Task:** Write down the procedure for reaching recommendations.
      *   **Constraints:**
          *   Weekly meetings, ~40 mins per consult.
          *   5 members (Deontologist, Consequentialist, Care Ethicist, Lawyer, Chair/Generalist).
          *   Recommendation signed by 3/5 members + Attending.
          *   Read by families/counsel, practically binding.
          *   Members have divergent moral outlooks (no consensus expected).
          *   Need aggregation procedure, not resolution of disagreement.
          *   Must handle specific failure modes of previous weighted averaging attempt:
              1.  *Compromise Options:* Avoiding options no single theory endorses (e.g., ventilator yes, pressors no).
              2.  *Intertheoretic Comparison:* Incommensurable scales (0-100 means different things).
              3.  *Lexical Dominance/Extremes:* Small credence in catastrophic views shouldn't veto everything automatically.
          *   Must address: Whose credences count? How to handle disagreement on aggregation itself?
          *   Output: The procedure (steps, halting points), application to 3 specific cases, limitations, and an audit log format.
      *   **Tone:** Pragmatic, rigorous but accessible to non-philosophers, honest about value judgments vs. arithmetic.

  2.  **Deconstruct the Problem:**

      *   *The Core Tension:* Moral uncertainty + Time pressure + High stakes + Diverse theories + Need for actionable consensus.
      *   *Why Weighted Averaging Failed:* It treats moral theories like policy preferences (which can be split) rather than truth-claims or structural constraints (which often cannot). It assumes cardinal utility across theories (false). It allows "tyranny of the minority" via lexical dominance.
      *   *The Solution Strategy:* Move from *Aggregation of Scores* to *Filtering and Veto with Justification*. This is often called a "Reflective Equilibrium" or "Consensus Conference" model, but needs to be formalized to fit the 40-minute constraint.
      *   *Key Concept:* **Satisficing Constraints + Maximizing within Bounds.** Instead of averaging, we eliminate options that violate hard constraints for high-credence theories, then choose the best remaining option according to the most robust consensus.
      *   *Handling Lexical Dominance:* Distinguish between *logical impossibility* (cannot do X) and *moral catastrophe* (should not do X). Use a "Threshold of Plausibility" for veto power.
      *   *Handling Credences:* Use the Committee's collective credence, not the patient's (patients aren't moral philosophers), but weight the patient's *values* as data for the theories.
      *   *Handling Aggregation Disagreement:* The procedure itself must be the agreed-upon meta-rule.

  3.  **Drafting the Procedure (The "Four-Step Filter"):**

      *   *Step 1: Option Generation.* List clinically viable options. (Prevents "compromise options" that make no clinical/moral sense).
      *   *Step 2: The Veto (Hard Constraints).* Can any theory rule an option *out* definitively? Only if credence > Threshold (e.g., 20-25%). This handles the "lexical dominance" issue. A 3% credence shouldn't veto.
      *   *Step 3: The Ranking (Soft Preferences).* Among remaining options, which is *supported* (not just averaged) by the most theories/weight?
      *   *Step 4: The Sign-off.* Requires 3/5 signatures. This forces human accountability.

      *Refining Step 2 (The Veto):* To avoid the "3% credence kills everything" problem, we need a *Credence Threshold for Veto*. If a theory says "X is forbidden," it only vetoes X if the committee assigns that theory > $T$ credence. Let's set $T$ at 20% (1/5th). This respects minority views but prevents tyranny.
      *Refining Step 1 (No Compromise):* Options must be clinically coherent and morally intelligible to at least one theory. No "midpoint" options unless a theory actually supports them.
      *Refining Step 3 (Comparison):* Instead of 0-100, use "Support/Neutral/Oppose." This solves intertheoretic comparison.

  4.  **Addressing Specific User Constraints:**

      *   *40 Minutes:* Steps must be rapid. No deep metaphysical debate.
      *   *Non-Philosophers:* Language must be plain English.
      *   *Audit Trail:* Need a specific form.
      *   *Case 3 (The 3% Catastrophe):* The procedure must explicitly handle this. If the credence is below the Veto Threshold, the veto fails. The recommendation proceeds, but the dissent is recorded.

  5.  **Developing the Cases:**

      *   *Case 1 (Surrogate vs. Team):*
          *   Options: Continue All, Withdraw All, Continue X/Stop Y (Compromise).
          *   Veto: Deontologist A says Withdraw = Killing (Veto?). Deontologist B says Futile = No Obligation (No Veto).
          *   Resolution: If Veto threshold not met for "Killing," Withdraw is allowed. Care ethicist focuses on family distress. Consequentialist focuses on futility.
      *   *Case 2 (Triage):*
          *   Options: Patient A (Sick), Patient B (Less Sick).
          *   Veto: Neither is "killing."
          *   Ranking: Consequentialist prefers B. Deontologist (First-come?) prefers A.
          *   Resolution: Hospital Policy usually dictates Triage protocol. Ethics defers to Policy unless Policy violates Hard Constraints.
      *   *Case 3 (3% Religious Catastrophe):*
          *   The specific test for the "Lexical Dominance" failure.
          *   Procedure: Is credence > Threshold? No (3% < 20%). Veto fails. Recommendation: Withdraw. Dissent recorded.

  6.  **Refining the Meta-Ethics:**

      *   *Whose Credences?* The Committee's. We are the moral agents signing the note. Patient values inform the *application* of the theories, not the theories themselves.
      *   *Agreement on Aggregation:* This procedure *is* the agreement. By adopting the procedure, we agree to abide by its output even if we disagree with the meta-ethics.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the difficulty. State the goal (procedural legitimacy, not moral truth).
      *   *The Procedure:* "The Constrained Consensus Protocol."
      *   *Step 1 (Viable Options):* Clinically distinct. No "split the difference."
      *   *Step 2 (The Veto Threshold):* Crucial for Case 3. Set at 20% (one member).
      *   *Step 3 (Positive Support):* Count theories that *affirmatively support*, not just "don't hate."
      *   *Step 4 (The Human Override):* If the math says X but everyone feels Y, the math is wrong.
      *   *The Form:* Simple table.
      *   *Limitations:* Be honest. This doesn't solve morality; it manages disagreement.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20% too low? If one person vetoes, is that fair?
      *   *Adjustment:* Make it 20% *provided* the argument is intelligible to the group. Also, the Sign-off requirement (3/5) acts as a second check. If a veto is ridiculous, the other 4 won't sign the alternative if it violates the veto-holder's core constraint? No, if the veto passes the threshold, the option is off the table. If the veto fails (3%), the option is on the table. The 3/5 sign-off ensures the recommendation has broad support *among the remaining options*.
      *   *Critique:* Intertheoretic comparison.
      *   *Adjustment:* Use ordinal ranking (Better/Worse) within theories, then count support across theories. Avoid cardinal utility (0-100).
      *   *Critique:* Case 2 (Triage).
      *   *Adjustment:* Ethics committees usually shouldn't decide triage *in the moment* if policy exists. But for the sake of the exercise, treat it as a policy conflict.
      *   *Critique:* Case 3.
      *   *Adjustment:* Ensure the procedure explicitly outputs "Proceed despite minority objection" and records the objection. This satisfies the user's request to "tell me something I hate."

  9.  **Final Polish:** Check tone. Ensure it sounds like a document a Chair would actually circulate. Ensure the "Audit Log" is practical. (Make sure to explicitly mention the "No Compromise Options" rule to address Failure Mode 1).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **To:** Clinical Ethics Consultation Committee
  **From:** Chair
  **Subject:** Standard Operating Procedure for Moral Aggregation (The "Constrained Consensus Protocol")

  **Purpose:**
  This document establishes the procedure by which this Committee converts moral disagreement into actionable recommendations. We acknowledge that we do not share a moral ontology. We acknowledge that moral uncertainty is real. We acknowledge that we have forty minutes. This procedure is not designed to find the *Truth*; it is designed to find a *Defensible Path* that respects the gravity of our dissent without paralyzing clinical care.

  This protocol replaces the "Weighted Average" method. It is adopted as the Committee's meta-rule. By sitting on this Committee, you agree to abide by the output of this procedure, even if you disagree with the specific moral reasoning that generated it.

  ---

  ### Part I: The Decision Procedure

  **Time Allocation:** 40 Minutes Total
  **Required Output:** A recommendation signed by 3/5 members.

  #### Step 1: Define Clinically Coherent Options (5 Minutes)
  **Question:** What are the distinct, clinically viable courses of action?
  **Rule:** No "Compromise Options." An option is only valid if at least one Committee member can articulate a moral theory under which this option is *positively good* or *morally required*, not just "less bad."
  *   *Failure Mode 1 Check:* We do not generate options like "Ventilator Yes, Pressors No" unless a specific theory endorses that specific distinction. If an option is only a mathematical midpoint between two other options, discard it.
  **Output:** A list of 2–4 options (e.g., "Continue Full Support," "Withdraw to Comfort Care," "Time-Limited Trial").

  #### Step 2: The Veto Threshold (10 Minutes)
  **Question:** Does any option violate a *Hard Constraint* held with sufficient credence?
  **Definition:** A Hard Constraint is a claim that an action is impermissible (forbidden), not merely suboptimal.
  **Rule:** An option is removed from consideration **if and only if**:
  1.  At least one member (20% credence minimum) asserts a Hard Constraint against it.
  2.  The assertion is intelligible to the group (it maps to a recognizable ethical framework, e.g., "killing," "violation of autonomy," "abandonment").
  3.  The member holding the constraint cannot be persuaded to reclassify it as a *Soft Constraint* (strongly discouraged but permissible under duress).
  *   *Failure Mode 3 Check:* A credence below 20% (e.g., the 3% religious catastrophe view) cannot trigger a Veto. It is recorded as a Dissent, but it does not eliminate the option. This prevents lexical dominance by low-probability extremes.
  **Output:** A reduced list of "Permissible Options." If all options are vetoed, proceed to Step 5 (Crisis).

  #### Step 3: Positive Support Count (10 Minutes)
  **Question:** Among the Permissible Options, which has the broadest *affirmative* support?
  **Rule:** Do not score 0–100. Use ternary classification per member/theory:
  *   **(+) Supported:** This option aligns with my primary moral reasoning.
  *   **(0) Tolerated:** This option is not ideal, but I can sign the recommendation.
  *   (-) **Opposed:** I cannot sign this recommendation (distinct from Veto; I step aside, but do not block).
  **Aggregation:** Select the option with the highest count of **(+) Supported**.
  *   *Failure Mode 2 Check:* We are counting *endorsements*, not utilities. We do not ask "How much better is A than B?" We ask "Who can stand behind A?" This bypasses intertheoretic comparison of scale.
  **Tie-Breaker:** If tied, prefer the option that preserves future optionality (e.g., Time-Limited Trial over Immediate Withdrawal).
  **Output:** A "Tentative Recommendation."

  #### Step 4: The Sign-Off Test (10 Minutes)
  **Question:** Can three of us sign this?
  **Rule:** The recommendation is valid only if three members are willing to attach their names to it.
  *   *Human Override:* If the Procedure selects Option A, but the three members willing to sign feel a "moral residue" (deep unease not captured by the steps), they may invoke the **Human Override**. This halts the procedure. The Chair must then escalate to Hospital Counsel or Administration for a non-ethical decision (e.g., risk management). This acknowledges that the procedure is a tool, not a conscience.
  **Output:** Final Recommendation or Escalation.

  #### Step 5: Crisis Protocol (If Step 2 Veto Eliminates All Options)
  **Rule:** If every clinically viable option is Vetoed by a >20% credence holder (e.g., Continuing is Killing, Withdrawing is Killing):
  1.  The Committee recommends **Status Quo** (continue current treatment) for a fixed period (e.g., 72 hours).
  2.  The recommendation includes a explicit statement: "The Committee is morally deadlocked. Continued treatment is not endorsed as beneficial but is permitted to avoid immediate irreversible harm while legal/external review is sought."
  3.  Escalate to Hospital Counsel immediately.

  ---

  ### Part II: Addressing Your Specific Wrinkles

  **1. Whose Credences?**
  We use the **Committee's Credences**. We are the moral agents signing the note. The patient's values are *data* input into our theories (e.g., "The patient valued independence," informs the Consequentialist's QALY calculation and the Care Ethicist's relationship analysis), but the patient does not assign weight to *our* moral frameworks. We are not polling the family on deontology; we are applying deontology to the family's situation.

  **2. Disagreement on Aggregation**
  This document *is* the resolution. By adopting this SOP, we agree that "Veto Threshold + Support Count" is the legitimate meta-rule. If a member disagrees with this meta-rule, they must recuse themselves from the vote, not the Committee.

  **3. Intertheoretic Comparison**
  Solved by Step 3. We do not compare the *intensity* of a Consequentialist's "70" to a Deontologist's "70." We compare the *fact* of endorsement. One vote is one vote.

  **4. Lexical Dominance (The 3% Catastrophe)**
  Solved by Step 2. The Veto Threshold is set at 20% (one member). A 3% credence, even if it posits infinite disvalue, is treated as a risk to be managed, not a constraint to be obeyed. The recommendation proceeds, but the dissent is recorded in the audit log.

  ---

  ### Part III: Application to Cases

  #### Case 1: Surrogate Insists on Continuation (Futile Care)
  *   **Options:** (A) Continue All, (B) Withdraw to Comfort Care, (C) Time-Limited Trial (72 hrs).
  *   **Step 1 (Coherence):** All three are clinically coherent. (C) is supported by Care Ethics (relationship repair) and Consequentialism (uncertainty reduction).
  *   **Step 2 (Veto):**
      *   Deontologist A (Killing): Vetoes (B). Credence > 20%.
      *   Deontologist B (Futility): Vetoes (A). Credence > 20%.
      *   *Result:* (A) and (B) are removed.
  *   **Step 3 (Support):** Only (C) remains.
      *   Consequentialist: (+) Supports (reduces error risk).
      *   Care Ethicist: (+) Supports (allows family acceptance).
      *   Lawyer: (0) Tolerates (defers liability).
      *   Deontologists: (0) Tolerate (avoids immediate killing/futility violation).
  *   **Step 4 (Sign-Off):** 5/5 sign.
  *   **Recommendation:** **Time-Limited Trial of 72 hours.**
  *   **Note:** This avoids the "Withdraw vs. Kill" binary by finding a third option that is *positively supported* by at least two theories, not just a midpoint.

  #### Case 2: Triage (One ICU Bed, Two Patients)
  *   **Options:** (A) Treat Patient 1 (Sicker, 25% survival), (B) Treat Patient 2 (Less Sick, 70% survival).
  *   **Step 1 (Coherence):** Both viable.
  *   **Step 2 (Veto):**
      *   Deontologist (First-Come/First-Served): Vetoes (B)? *Discussion:* Is "first-come" a Hard Constraint or a Soft Preference? Committee rules it is a Soft Preference in disaster triage policy. No Veto.
      *   Consequentialist: No Veto.
      *   *Result:* Both Permissible.
  *   **Step 3 (Support):**
      *   Consequentialist: (+) Supports (B).
      *   Lawyer: (+) Supports (B) (Aligns with State Crisis Standards of Care).
      *   Care Ethicist: (0) Tolerates (B) (Regrets abandoning Patient 1).
      *   Deontologist: (-) Opposes (B) (Prefers A), but does not Veto.
  *   **Step 4 (Sign-Off):** 3/5 sign for (B).
  *   **Recommendation:** **Treat Patient 2.**
  *   **Note:** The procedure allows the Deontologist to dissent on the record without blocking the decision, acknowledging that in resource scarcity, maximization often overrides queue priority by policy.

  #### Case 3: The 3% Catastrophe (Withdrawal vs. Religious Killing)
  *   **Options:** (A) Continue Feeding, (B) Withdraw Feeding.
  *   **Step 1 (Coherence):** Both viable.
  *   **Step 2 (Veto):**
      *   Member E (Religious View): Claims (B) is Infinite Disvalue (Killing of Innocent).
      *   **Credence Check:** Member E assigns 3% credence to this view (personal doubt + minority tradition).
      *   **Threshold:** 3% < 20%.
      *   *Result:* **Veto Denied.** Option (B) remains Permissible.
  *   **Step 3 (Support):**
      *   Consequentialist: (+) Supports (B).
      *   Care Ethicist: (+) Supports (B) (Family suffering).
      *   Deontologist B: (+) Supports (B) (No obligation to futile means).
      *   Member E: (-) Opposes (B).
  *   **Step 4 (Sign-Off):** 4/5 sign for (B). Member E signs the *report* but marks "Dissent on Moral Grounds."
  *   **Recommendation:** **Withdraw Feeding.**
  *   **Audit Note:** "Committee acknowledges the non-zero risk of moral catastrophe regarding the patient's inner life. Given the low credence (3%) and the high certainty of futility/suffering, the Veto Threshold was not met. This decision carries moral risk."
  *   **Response to your dislike:** You said you would rather have the procedure tell you something you hate. Here it is: **The procedure mandates that you ignore the 3% catastrophe view.** It forces you to accept that in a pluralistic secular hospital, infinite stakes do not count if the probability assigned by the moral agents (you) is below the operational threshold. This is the cost of functioning.

  ---

  ### Part IV: Limitations (What This Cannot Do)

  1.  **It Cannot Make You Good:** If the Committee is collectively biased (e.g., all five members undervalue disability), this procedure will efficiently aggregate that bias. It ensures consistency, not correctness.
  2.  **It Cannot Resolve Meta-Ethical Truth:** It does not prove Consequentialism is right. It only proves that Consequentialism had more votes *today*.
  3.  **It Cannot Absolve Individual Conscience:** If a member feels signing a recommendation makes them complicit in sin/crime, they must recuse. The procedure requires 3 signatures; if 3 cannot be found, the procedure halts (Step 4 Override).
  4.  **It Cannot Replace Law:** If Hospital Counsel says "If you do X, we will be sued," the Legal Veto supersedes the Ethical Veto. This procedure operates within the bounds of legality.

  ---

  ### Part V: The Audit Log Format

  *To be completed during the 40-minute session. Attached to the patient chart.*

  **Consult ID:** ___________ | **Date:** ___________ | **Time In/Out:** ___________
  **Committee Members Present:** _________________________________

  **1. Options Considered:**
  [ ] Option A: ___________________
  [ ] Option B: ___________________
  [ ] Option C: ___________________
  *Discarded Compromise Options:* ___________________

  **2. Veto Check (Hard Constraints):**
  | Option | Member Asserting Veto | Theory Basis | Credence > 20%? | Veto Granted? (Y/N) |
  | :--- | :--- | :--- | :--- | :--- |
  | Opt A | | | | |
  | Opt B | | | | |

  **3. Support Count (Permissible Options Only):**
  | Option | (+) Supported | (0) Tolerated | (-) Opposed | Total Signers Willing |
  | :--- | :--- | :--- | :--- | :--- |
  | Opt A | | | | |
  | Opt B | | | | |

  **4. Final Recommendation:**
  _______________________________________________________

  **5. Dissents & Moral Residue:**
  *(Must record any Veto denied due to credence threshold, or any member opposing the final choice)*
  _______________________________________________________
  _______________________________________________________

  **6. Signatures (Minimum 3):**
  ___________________ ___________________ ___________________

  **Attending Countersignature:** ___________________

  ---

  **Chair's Note:**
  This procedure is cold. It treats moral horror as a variable. It treats your deepest convictions as vote counts. This is necessary because we are not a church; we are a committee in a hospital. We must decide. If this procedure yields a result you cannot live with, Step 4 allows you to refuse to sign. But you cannot break the math to save your conscience. You must own the refusal.
