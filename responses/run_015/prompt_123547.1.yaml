answer: |-
  Epiphenomenalist: Stop treating "I am in pain" as a descriptive report about an inner object. It functions as a self-referential indexical, calibrated by a subpersonal loop that tracks neural coherence. When nociceptive data integrates globally, the loop closes and triggers the judgment. The qualia doesn't need to cause the report; the loop ensures the report tracks the state.

  Interactionist: That explains why the report matches the brain state. It doesn't explain why *I* know I'm in pain. If the referent—the qualia itself—never enters the causal chain producing the judgment, then my judgment is blind to the very thing it claims to know. How does that preserve incorrigibility?

  Epiphenomenalist: Because incorrigibility is a structural feature of the loop, not a metaphysical relation to qualia. The indexical binds to the coherence state. If the state is present, the judgment is true. The qualia supervenes on the state. You don't need the qualia to push the button when the button is wired to the state the qualia accompanies. Reliability depends only on the loop.

  Interactionist: But the state isn't the qualia. If the loop tracks coherence, it could track coherence without the feeling. If I can say "I am in pain" based on coherence alone, then I am not incorrigible about the *pain*. I'm only incorrigible about the coherence. You've shifted the object of knowledge.

  Epiphenomenalist: There is no shift. The paradox assumes knowledge requires causal friction between qualia and judgment. I'm saying knowledge is just successful calibration. The loop guarantees the calibration. If the neural state necessitates the qualia, tracking the state tracks the qualia. The judgment is reliable because the loop is tight, not because the qualia pushes back.

  Interactionist: Reliability isn't authority. Authority requires that the subject be sensitive to the truth of the feeling, not just the neural noise. If the qualia never enters the chain, I have no access. I'm just a vessel for the loop's output. An incorrigible judge must be sensitive to the truth; your model makes me sensitive only to physical variables.

  Epiphenomenalist: The sensitivity *is* the physical variable. The "feeling" of authority is part of the coherence package the loop monitors. You're demanding the qualia do work that the structure already handles.

  Interactionist: Then the feeling of authority is a lie. If the structure handles it, I could feel authoritative without the pain. That destroys incorrigibility. You haven't dissolved the paradox; you've eliminated the first-person perspective to save the physics.
