  **MINUTES OF THE FORTY-FIRST SESSION OF THE STANDING COMMITTEE ON THE HISTORICITY THRESHOLD**

  **Present:** Representatives from the Institute of Stratigraphic Integrity, the Chair of Diachronic Verification, the Office of Narrative Stability, and three rotating members from the Consortium for Bronze Age Collapse.

  **Item 1: Revision of Schedule B (Weighting Table for Argument from Silence)**
  The Committee opened by addressing Schedule B, which governs penalties applied when expected documentation is absent. Proposal 14-A suggested a flat 0.4 deduction from the Historicity Score for every century of silence between event and earliest source. An amendment from the Office of Narrative Stability increased this to 0.6, citing the degradation of oral transmission. A counter-amendment noted that archive survival rates vary by region; the table was subsequently revised to apply penalties only where clay or stone preservation is statistically probable. No consensus was reached on defining "statistically probable." Schedule B was marked as Provisional, pending Session 42.

  **Item 2: File 74-Alpha (The Trojan Conflict)**
  The Committee reviewed evidence regarding the conflict at Hisarlik. A settlement layer corresponding to the late Bronze Age shows signs of violent destruction within the correct century. Under the Wilusa Clause, which permits corroboration from foreign archives using alternate spellings, the Hittite diplomatic records mentioning "Wilusa" were accepted as a 0.8 match for the Greek toponym. Despite the gap between the destruction and the poetic codification, the Committee agreed that the persistence of place-names allows a slide from "a city on this site was destroyed" to "this poem preserves a memory of that destruction." Multiple independent attestation was deemed satisfied by the convergence of archaeological burn layers and Hittite textual references. The file was assigned a Provisional Certificate of Historicity, Grade B (Historical Core), contingent on further excavation.

  **Item 3: File 89-Beta (The Arthurian Campaigns)**
  Evidence for the British leadership figure was adjudicated strictly under Schedule B. A British monk writing within a century of the alleged events describes a siege at Mount Badon and denounces contemporary kings at length but fails to name the protagonist. The first unambiguous appearance of the name occurs in a compilation roughly three centuries later. The Embarrassment Rider was invoked to determine whether the hero's absence from the earlier source constitutes embarrassment for the ancient author or the modern defenders. The Committee ruled that the silence embarrasses the defenders, not the monk, as the monk's purpose was moral exhortation rather than cataloging commanders. Consequently, the gap was penalized heavily. The possibility that the named hero is a composite into whom several dimly-attested figures have been folded was accepted as the primary explanatory model. Grade C- (Narrative Accumulation) assigned.

  **Item 4: File 12-Gamma (The Exodus Narrative)**
  The Committee examined the late-thirteenth-century-BCE Egyptian victory inscription which names Israel as a people already established in Canaan. While this satisfies multiple independent attestation for the existence of the group, nothing in the abundant Egyptian documentation of the period corresponds to a sojourn, a series of plagues, a flight, or a population anywhere near the size the narrative presupposes. Under the revised Schedule B, the argument from silence regarding the plagues was weighted heavily due to the high survival rate of Egyptian administrative records. The Committee noted that while a small group movement cannot be ruled out, the narrative scale is incompatible with the evidentiary threshold. Grade D (Typological Construct) assigned.

  **Item 5: Procedural Matter on Feedback Loops**
  A concern was raised regarding the causal impact of Provisional Certificates. Once a Certificate is issued, heritage funding, tourism revenue, and excavation permits typically follow. The subsequent excavation produces finds. The Committee must now decide whether finds that it has itself caused to exist count as independent confirmation warranting an upgrade. If the Grade records how the evidence stands, but the Grade causes the evidence to stand differently, the metric becomes circular. The Chair noted that upgrading a Grade based on funded excavations would validate the funding, not the history. No resolution was achieved. The matter was referred to the Subcommittee on Epistemic Contamination.

  **Adjournment:**
  The session closed without resolving Files 74-Alpha, 89-Beta, or 12-Gamma. The Committee agreed that the question "when does a legend become history?" remains procedurally complex. The next session will convene to discuss whether the issuance of a Certificate constitutes a performative speech act that alters the past. Meeting adjourned at 16:00.
