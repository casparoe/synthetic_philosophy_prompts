  # Final Exam: Rationality and Indexical Reasoning
  **Time Allowed:** 90 Minutes
  **Total Marks:** 40

  ## Essay Question: The Multiverse Urn

  Consider the following scenario:

  A philosopher, whom we shall call **The Presumptuous One**, attempts to estimate the total number of observer-moments in the multiverse ($N$). She posits two competing theories: $T_{small}$ (where $N = 10^{12}$) and $T_{large}$ (where $N = 10^{50}$). She treats her own current existence as analogous to drawing a specific red ball from an urn containing $N$ balls. She reasons that because she finds herself as *this* particular observer-moment, and because $T_{large}$ contains vastly more observer-moments, the probability of her drawing *this* specific indexical "ball" is much lower under $T_{large}$ than under $T_{small}$. Consequently, she updates her prior credence downward for $T_{large}$ and concludes that $T_{small}$ is significantly more probable.

  In a well-structured essay, answer the following three parts:

  1.  **Conditioning and Assumptions (10 Marks):** Identify whether The Presumptuous One's reasoning tracks the **Self-Sampling Assumption (SSA)** or the **Self-Indication Assumption (SIA)**. Explain the conditioning logic she is using (i.e., how she treats the probability of her existence or rank given the theory). Explain why the *alternative* assumption (the one she is *not* using) would reject her inference and likely favor $T_{large}$.
  2.  **The Presumptuous Philosopher Objection (10 Marks):** In the wider literature, the "Presumptuous Philosopher" objection is raised against indexical reasoning in cosmology. Explain this objection. Specifically, identify which assumption (SSA or SIA) the standard objection targets, and explain why relying on that assumption is considered "presumptuous" in a way that undermines empirical cosmological reasoning.
  3.  **Evaluation and Asymmetry (10 Marks):** Evaluate The Presumptuous One's argument in the scenario above. Does her reasoning actually commit a fallacy of presumption, or is there a hidden asymmetry between "observer-moments" and "physical samples" (like the urn balls) that saves her inference? Discuss whether treating indexical evidence as ordinary statistical sampling is valid in this context.
  4.  **Clarity and Precision (10 Marks):** Your essay will be assessed on the precision of your terminology, the logical flow of your argument, and your ability to distinguish between priors, likelihoods, and indexical conditioning.

  ***

  ## Model Answer

  **1. Conditioning and Assumptions**
  The Presumptuous One's reasoning tracks the **Self-Sampling Assumption (SSA)**. Under SSA, an observer should reason as if they are a random sample from the set of all actual observers (or observer-moments) in their reference class. Her logic relies on the likelihood ratio $P(E | T_{large}) / P(E | T_{small})$, where $E$ is the evidence "I am this specific observer-moment."
  *   **SSA Logic:** If $T_{large}$ is true, there are $10^{50}$ observers. The probability of being *this* specific one is $1/10^{50}$. If $T_{small}$ is true, there are $10^{12}$ observers. The probability is $1/10^{12}$. Since $1/10^{12} \gg 1/10^{50}$, SSA favors $T_{small}$. This is structurally identical to the Doomsday Argument.
  *   **SIA Rejection:** The alternative, the **Self-Indication Assumption (SIA)**, conditions on the evidence "I exist" rather than "I am this specific sample." SIA weights worlds by the number of observers they contain. Under SIA, $P(I exist | T_{large}) \propto 10^{50}$ and $P(I exist | T_{small}) \propto 10^{12}$. SIA would update *upward* for $T_{large}$, cancelling out the SSA penalty. The Presumptuous One rejects this because she treats her identity as a specific sample draw rather than mere existence.

  **2. The Presumptuous Philosopher Objection**
  In standard literature (e.g., Bostrom 2002), the "Presumptuous Philosopher" objection specifically targets **SIA**.
  *   **The Objection:** If SIA is true, a philosopher could conclude with near certainty that the universe is astronomically large simply because larger universes contain more observers like her, even without empirical data. For example, if Theory A predicts 1 billion observers and Theory B predicts 1 trillion, SIA dictates we should be 1000 times more confident in Theory B *a priori*.
  *   **Why it Undermines Cosmology:** This is deemed "presumptuous" because it allows armchair reasoning to override empirical physics. It implies we can determine the size of the multiverse through indexical logic alone, rendering empirical observation secondary. It targets the SIA assumption that $P(World | I exist) \propto P(I exist | World) \times P(World)$, where the likelihood term scales with observer count.
  *   **Contrast with Scenario:** While the standard objection targets SIA (for favoring large worlds), The Presumptuous One in this scenario uses SSA (favoring small worlds). However, the *spirit* of the objection applies to her as well: she assumes she can derive cosmological facts from her mere existence without causal interaction with the multiverse structure.

  **3. Evaluation and Asymmetry**
  The critical evaluation hinges on whether observer-moments are analogous to physical urn balls.
  *   **The Asymmetry:** In a physical urn, the balls exist independently of the draw. In the multiverse case, the "draw" (the observer's existence) is ontologically dependent on the world size.
  *   **Defense of SSA:** Proponents argue SSA is necessary to avoid the absurdity of SIA (the Presumptuous Philosopher problem). If we reject SSA, we accept that we can know the universe is huge without looking. Therefore, her presumption might be necessary to maintain empirical humility.
  *   **Critique of SSA:** However, her reasoning may still be presumptuous regarding the **Reference Class**. SSA requires defining which observers count as "samples." If she defines the class too narrowly (e.g., "observers exactly like me"), the inference weakens. Furthermore, treating indexical information ("I am here now") as non-indexical statistical data ("Ball #45 was drawn") commits a category error. Indexical facts are necessary truths for the observer; they do not reduce uncertainty about the world in the same way random sampling does.
  *   **Conclusion:** Her argument avoids the SIA presumption (favoring the huge multiverse) but incurs the Doomsday presumption (favoring the early end/small size). The asymmetry suggests that while the urn analogy is heuristic, it fails to capture the metaphysical difference between *selecting* an observer and *being* an observer.

  **4. Clarity and Precision**
  *(Awarded based on the essay's actual performance)*
  *   Clear distinction between $P(T|E)$ and $P(E|T)$.
  *   Correct use of terms: Reference Class, Likelihood, Prior, Indexical Evidence.
  *   No conflation of SSA/SIA as merely "optimistic/pessimistic" priors.

  ***

  ## Marking Scheme (40 Marks Total)

  ### Part 1: Conditioning and Assumptions (10 Marks)
  *   **Correct Identification (4 marks):** Explicitly identifies the reasoning as **SSA**. (0 marks if identified as SIA).
  *   **Conditioning Logic (4 marks):** Correctly explains that SSA treats the observer as a random sample from actual observers, leading to a likelihood penalty for larger $N$ ($1/N$).
  *   **Alternative Rejection (2 marks):** Explains that SIA conditions on existence, scaling probability *with* $N$, thus favoring $T_{large}$.
      *   *Penalty:* -2 marks if student claims SSA ignores the observer's existence (SSA conditions on existence, then samples).
      *   *Penalty:* -2 marks if student treats SSA/SIA as different *priors* rather than different conditioning rules.

  ### Part 2: The Presumptuous Philosopher Objection (10 Marks)
  *   **Target Identification (4 marks):** Correctly states the standard objection targets **SIA** (not SSA).
      *   *Note:* If the student argues the objection targets the Philosopher in the scenario (SSA), they must justify why SSA is presumptuous (e.g., assuming typicality) to receive partial credit. Full credit requires acknowledging the standard SIA target.
  *   **Explanation of Presumption (4 marks):** Explains that SIA allows deriving cosmological size from armchair reasoning, bypassing empirical evidence.
  *   **Impact on Cosmology (2 marks):** Explains why this is problematic (makes physics subservient to indexical logic).
      *   *Penalty:* -3 marks if student claims the objection is about "arrogance" rather than probabilistic weighting.
      *   *Penalty:* -3 marks if student confuses this with the Doomsday Argument (which targets SSA).

  ### Part 3: Evaluation and Asymmetry (10 Marks)
  *   **Urns vs. Observers (4 marks):** Discusses the ontological difference between drawing a ball and being an observer (existence dependence).
  *   **Reference Class Issue (3 marks):** Mentions that SSA results depend heavily on how the reference class is defined.
  *   **Verdict (3 marks):** Provides a reasoned conclusion on whether the inference is valid or fallacious (either stance is acceptable if justified).
      *   *Penalty:* -4 marks if student claims the urn analogy is perfect with no caveats.
      *   *Penalty:* -4 marks if student argues indexical evidence is identical to ordinary statistical data without qualification.

  ### Part 4: Clarity and Precision (10 Marks)
  *   **Terminology (4 marks):** Correct use of "likelihood," "prior," "indexical," "reference class."
  *   **Structure (3 marks):** Essay is divided into clear sections corresponding to the prompt.
  *   **Logic Flow (3 marks):** Arguments follow logically; no contradictions between Part 1 and Part 2.
      *   *Penalty:* -2 marks for every instance of sloppy notation (e.g., confusing $P(H|E)$ with $P(E|H)$).
      *   *Penalty:* -5 marks if the essay is incoherent or fails to address the prompt directly.

  ### Specific Mistakes That Cost Marks (Checklist for Graders)
  1.  **The "Prior" Error:** Treating SSA and SIA as competing prior probabilities over worlds rather than competing rules for updating on indexical evidence. (**Deduct 4 marks**)
  2.  **The "Existence" Error:** Claiming that SSA does not condition on the observer's existence. (SSA assumes existence, then samples; SIA conditions on existence to update priors). (**Deduct 3 marks**)
  3.  **The "Target" Error:** Claiming the standard Presumptuous Philosopher objection targets SSA. (It targets SIA). (**Deduct 4 marks** unless nuanced argument is made).
  4.  **The "Sampling" Error:** Treating the observer as a physically independent entity drawn from a pre-existing set, ignoring that the set size determines the observer's existence. (**Deduct 3 marks**)
  5.  **The "Doomsday" Conflation:** Confusing the Presumptuous Philosopher argument (SIA -> Large World) with the Doomsday Argument (SSA -> Small World/Early End). (**Deduct 5 marks**)
