answer: |-
  **GREEN PASTURES ENTITLEMENT FESTIVAL: OFFICIAL HOLDINGS FAQ**
  **From the Desk of Festival Director Alan Nozik**

  **Q: Everyone started with ten drink tickets. Why does Jax "The Stick" Miller have four thousand?**
  **A:** Because you gave them to him. The initial distribution was just; every attendee received an equal holding of ten tickets upon entry. This satisfied the principle of justice in acquisition. However, during Jax's percussion solo, you voluntarily transferred your tickets to him in exchange for the service of watching him hit things very fast. Since the initial holding was just and the transfer was voluntary, the resulting holding is also just. We do not judge justice by the snapshot of who has what now, but by the history of how they got it.

  **Q: Can't you just take some back so everyone has equal tickets again?**
  **A:** No. To interfere with the distribution now would be to violate the liberty of the attendees. You chose to give Jax your tickets. If we redistribute them to maintain an egalitarian pattern, we are effectively forcing you to not give them to him, or forcing Jax to work for free. Liberty upsets patterns. There is no way to maintain a specific distributional pattern—like equality—without continuously interfering with people's voluntary choices to exchange their holdings. We are not in the business of stopping you from making choices that lead to inequality.

  **Q: But isn't it unfair that Jax can buy all the beer now?**
  **A:** Fairness is determined by entitlement, not outcome. If Jax is entitled to the tickets based on the voluntary exchanges that occurred, he is entitled to the beer those tickets purchase. You are looking at the end-state and seeing inequality. We are looking at the process and seeing justice. If you wanted to keep your tickets, you were free to do so. You preferred the solo. You cannot now claim the result is unjust simply because you dislike the pattern it produced. Please stop asking us to violate property rights to satisfy a aesthetic preference for equality.

  **Q: I claim Jax stole two tickets from me in 2019. Will you rectify this?**
  **A:** Finally, a valid question. The principle of rectification states that if holdings were acquired through injustice (theft, fraud), we must correct it. If you can provide empirical evidence that Jax's current holdings stem from past theft, we will seize the appropriate amount to restore you to the position you would have occupied had the injustice not occurred. However, mere speculation does not constitute evidence. Until you prove the theft, we must assume his holdings are just. Note that even if we rectify the past theft, future voluntary transfers will likely disrupt the pattern again. We cannot guarantee permanent equality, only historical justice.

  **Q: Will next year be equal?**
  **A:** We intend to start with an equal distribution again. But if Jax plays again, and you are free to tip him, he will end up with more tickets again. We cannot stop this without stopping you. Please direct further complaints to the philosophical implications of liberty. The bar is closed.
