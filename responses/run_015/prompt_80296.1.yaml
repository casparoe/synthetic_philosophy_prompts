prompt: |-
  I'm in a seminar on judgment aggregation and we just did the discursive dilemma and List's impossibility theorem, and I want to make a one-page decision tree for the next session that sorts people by their answers to concrete cases rather than by wich label they'd volunteer. Start the tree from my own default — that a group voting on logically connected questions has to end up with a consistent judgment set — and let each branch be a question a respondent can answer on the case alone, before knowing which box they'll end up in.

  For the case, don't use the standard court example from the literature. Use this one instead: a three-member research ethics board reviewing a drug trial, where the questions on the table are (P) the interim data show the drug is ineffective, (Q) a drug that is ineffective should not stay in the trial, and (C) the trial should be terminated, with C following from P and Q. Each member is individually consistent, but the majority accepts P and Q and rejects C. Build the tree around what a group like this should do.

  Keep it to 6 to 8 leaves since it's one page. At each leaf, give the position a name (or call it unnamed if it's just a logical possibility nobody actually defends) plus one sentence on the commitment that makes it hardest to live with. The leaves have to cover at least: the conclusion-based option, the premise-based option, the option of just recording the majority on each question and letting the group be inconsistent, the deflationary option that the group never had beliefs to begin with and only has preferences, and at least one escape route from the impossibility theorem (e.g., giving up the requirement that the group can be asked to vote on any subset of the agenda, or restricting which individual judgment sets are admissable). I also want a branch on whether the dilemma is specific to the modus ponens shape of the agenda or general to any logically connected set of questions, since I keep hearing both things and can't tell which is right.

  Finally, list any combination of answers the tree can't reach and say in one line why nobody is there (incoherent, unattractive, or just unexplored), and point out any pair of leaves that the questions you've got can't actually tell apart.
