      *   **Cranes vs. Greedy Reductionism:** Dennett explicitly distinguishes these. A crane is a *good* reduction. Greedy reductionism is a *bad* reduction that skips levels. The student implies that *being* a crane guarantees avoiding greedy reductionism. This is a category error. You can attempt a crane-based explanation that is still greedy (e.g., explaining language solely via genetics without cultural evolution, even if genetics is "bottom up"). The prompt specifies the explanation appeals to "incrementally scaffolded" mechanisms, so *this specific explanation* avoids greedy reductionism, but the student's *reasoning* ("Because cranes... automatically avoid") is flawed.
