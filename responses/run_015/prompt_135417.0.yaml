      *   *Claim 4:* "Dennett holds that any appearance of leftover mystery is just an illusion produced by pre-theoretic intuition." (**Misattribution/Oversimplification**). While Dennett is an eliminativist/illusionist about *qualia* in some contexts, regarding *normativity*, the prompt asks about "explanatory residue." Dennett acknowledges that higher-level patterns are real *if* they are robustly predictive, but the student claims there is *no* residue because it's "nothing over and above." This touches on the Real Pattern vs. Elimativism debate.
