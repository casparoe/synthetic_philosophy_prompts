answer: |-
  1. Divide the twelve students into six first-person auditors and six phenomenal reporters, instructing the auditors to determine their current state of consciousness using only internal phenomenological evidence while the reporters generate descriptions of experiences that ambiguously mimic those specific markers.
  2. Enforce a principle of recursive phenomenological neutrality wherein any criterion an auditor proposes is invalidated if the reporters can construct a nested-state description in which a dreamer falsely believes they have successfully applied that same criterion.
  3. Auditors must iteratively refine their criteria for waking reality, but each refinement triggers a reporter counter-scenario that forces the auditor into a self-checking regress without an external anchor to halt the recursion.
  4. During debriefing, map each failed internal criterion onto its corresponding move in Zhuangzian skepticism, predicting that participants will initially invoke memory continuity and bodily presence before demonstrating how reporters can replicate both within a fabricated dream narrative.
  5. Frankly state that the rules approximate the absence of any non-circular first-person access point, acknowledging that this structural uncertainty cannot be fully reproduced without direct facilitation to prevent students from collapsing the paradox into mere semantic play.
