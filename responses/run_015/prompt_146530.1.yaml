prompt: |-
  Write the desiderata that any adequate theory of gradated moral status—treating sentience and ethical standing as continuous rather than binary—must satisfy. Your list should cover: (1) the borderline cases it must classify consistently, with explicit reference to insects possessing nociceptive pathways, synthetic language models that generate affective discourse without embodied valence, thermostats and other homeostatic feedback loops, and entities with fragmented or distributed processing architectures (such as decorticate mammals, hive-analog collectives, or synthetic networks maintaining set-points through non-centralized loops) that lack unified representational integration; (2) the conceptual distinctions it must respect, including that between reflexive withdrawal and phenomenal suffering, between functional information integration and subjective experience, and between evolutionary continuity in biological lineages and architectural discontinuities in artificial or damaged systems; (3) the normative constraints it must meet, particularly whether moral consideration must scale smoothly without discontinuity, whether practical ethics requires administrable thresholds despite underlying gradation, and whether relational or ecological embeddedness can compensate for low individual cognitive complexity; and (4) the theoretical results it must remain consistent with, such as the absence of a sharp metaphysical boundary in nature and the need to avoid both anthropocentric exclusion and indiscriminate panpsychist inclusion. For each desideratum, state the motivating case or consideration behind it, and flag any pair you judge to be jointly unsatisfiable—pay special attention to tensions between phenomenological fidelity and practical decision-making, and between continuity principles and architectural uniqueness conditions. Finally, briefly assess how a capacity-based metric view, a neural-complexity gradient view, and a relational-ecological view fare against your criteria, keeping the weight of your response on the desiderata themselves and their internal conflicts rather than on the comparative scoring.
