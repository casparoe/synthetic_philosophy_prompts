answer: |-
  What I'm describing
  You identify a systematic bifurcation in hedonistic argumentation. Proponents ground hedonism in the "experience requirement," relying on a phenomenological conception (felt-quality) to exclude external goods. When confronted with heterogeneity, they pivot to an attitudinal conception (pleasure as enjoying) to unify diverse states. However, when critiquing competing theories, they revert to the phenomenological conception to argue external satisfaction lacks intrinsic value. The phenomenological view excludes external goods; the attitudinal view unifies diverse pleasures. Each does specific work, but they are incompatible foundations used interchangeably within a single argument. This ensures the theory appears intuitive and robust, switching between motivation and defense.

  Nearest existing concepts
  The core tension lies between *felt-quality theories* (pleasure as a distinctive sensation) and *attitudinal theories* (pleasure as enjoying an object). *Adverbialism* attempts to bridge this metaphysically, but your observation targets the argumentative switch, not the ontological solution. The *experience requirement* is the principle being exploited: it demands internalism but is ambiguous on what counts as "experience." *Motte-and-bailey* fails because neither position is a defensive retreat; both are offensive tools used at different stages. *Equivocation* is closer, as "pleasure" shifts meaning, but standard equivocation implies confusion. Your case is functional: the shift is strategic. The felt-quality view secures the internalist intuition (excluding external goods), while the attitudinal view secures the universality of pleasure (answering heterogeneity). The breakdown occurs because the attitudinal view weakens the experience requirement, undermining the initial exclusion of external goods. Thus, the argument relies on the strength of the felt-quality view while retaining the flexibility of the attitudinal view, without sustaining the costs of either. It leverages the phenomenological force of sensation to block externalism, then leverages the logical breadth of attitude to block heterogeneity objections, never settling on one ontology. Consequently, the arguer avoids the empirical burden of proving a common sensation exists. They avoid normative burdens regarding attitudes toward false propositions. This selective burden-shifting is the hallmark of the move. For example, the experience requirement's power to exclude external goods depends on a narrow view of experience. Broadening that view to include attitudes inevitably invites external goods back in, as attitudes can be directed at external states of affairs. The arguer ignores this interdependence.

  Is it actually an inconsistency
  It is not necessarily a logical inconsistency if one adopts a *dual-component theory*. Fred Feldman, for instance, argues for attitudinal hedonism but acknowledges sensory pleasure. A sophisticated hedonist could argue that "pleasure" is a determinable genus with both sensory and attitudinal determinates. On this view, the experience requirement is satisfied by either component. However, the inconsistency arises in the *argumentative weight* assigned to each. When motivating hedonism against objective lists, the arguer implies only *sensory* experience counts (hence the Experience Machine). When defending against heterogeneity, they imply *attitude* counts (hence no common sensation needed). If attitude alone suffices for pleasure, the Experience Machine loses its punch (one could attitude-enjoy the real world even if simulated feelings differed). If sensation is required for the Experience Machine to work, heterogeneity remains a problem. The cheat is claiming the *exclusionary power* of sensation (blocking external goods) while claiming the *inclusive power* of attitude (blocking heterogeneity). A consistent dual-component theorist must admit that if attitudinal pleasure counts, then satisfying desires (which involves attitudes) might also count, blurring the line between hedonism and desire satisfactionism. Therefore, while holding both concepts is permissible, using them to simultaneously tighten and loosen the criteria for well-being without justification is inconsistent.

  Name it
  Call this **The Hedonic Pivot**. It is the strategic oscillation between phenomenological and attitudinal definitions of pleasure to maximize coverage. It exploits ambiguity to resist falsification. Clear Case: Arguing the Experience Machine proves only feelings matter (phenomenological), then defining pleasure as "pro-attitude" to explain why reading philosophy is pleasant despite lacking a specific sensation (attitudinal). Near-Miss: A pluralist hedonism explicitly stating both sensory and attitudinal pleasures count equally. This isn't the pivot because the theorist owns the duality openly rather than switching definitions to dodge objections. The Pivot hides the cost; pluralism pays it.
