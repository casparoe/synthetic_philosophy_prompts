      *   *Goal:* Can a hedonist hold both?
      *   *Draft:* It is not necessarily a logical inconsistency if one adopts a *dual-component theory*. Fred Feldman, for instance, argues for attitudinal hedonism but acknowledges sensory pleasure. A sophisticated hedonist could argue that "pleasure" is a determinable genus with both sensory and attitudinal determinates. On this view, the experience requirement is satisfied by either component.
