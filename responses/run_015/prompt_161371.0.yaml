  9.  *(Final check on the VK Machine)*: Actually, there is a nuanced reading. If the replicant is designed *to pass the test*, then the test is part of the design condition. But in the film, they are designed to *be* slaves, and the test detects them. So the test is adversarial. I will advise the user to focus on the *adversarial* nature breaking "Normal Conditions."

