  Open with a single bottom-line sentence summarizing the audit's finding (for example, that unreconciled moral variance across reincarnation cycles exceeds acceptable regulatory thresholds). Then proceed with numbered sections: (1) The double-entry problem—how debiting a wrong and crediting its consequence requires tracking personal identity across lives without a continuous substrate; (2) Information asymmetry—why agents who cannot access prior-life ledgers face radical moral hazard in pricing present risk; (3) Temporal decay—whether suffering or reward delayed by centuries retains the normative force required for genuine desert; (4) Proposed regulatory fixes, including standardized karma-rating agencies and mandatory past-life liability disclosure.

  The satire must come from treating metaphysical absurdities as accounting technicalities: exaggerate real features of desert-based moral theories (proportionality, causal efficacy, agent responsibility) rather than invent fictional ones. Do not cite philosophers, texts, or schools by name; invent all institutional titles. A reader should recognize that the author understands the underlying conceptual problems—moral luck, the metaphysics of personal identity, and the difficulty of making delayed punishment genuinely retributive—without any authorial wink. Keep every claim in the voice of an accountant who sincerely believes the system can be made to work.
