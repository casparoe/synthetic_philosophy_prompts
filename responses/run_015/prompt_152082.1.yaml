          **2. Information Asymmetry and Moral Hazard**
          Agents operate under conditions of radical information asymmetry regarding prior-life liabilities. Because current incarnations lack access to historical ledgers, they cannot accurately price present moral risk. This creates severe moral hazard; an agent may engage in high-risk unethical behavior assuming the cost will be amortized over a future entity over which they exert no control. Conversely, agents suffering unexplained deficits cannot distinguish between punitive retribution and random market fluctuation. This opacity prevents rational moral calculation. Without transparent disclosure of opening balances upon birth, agents cannot optimize utility functions relative to karmic debt service.

          **3. Temporal Decay of Normative Force**
