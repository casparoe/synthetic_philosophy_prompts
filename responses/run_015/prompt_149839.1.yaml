answer: |-
  **PROJECT NARRATIVE**
  **Date:** October 14, 1998
  **To:** The Fellowship Committee (Attn: David)
  **From:** Dr. Elena Vasquez
  **Subject:** Administrative Invisibility: A Comparative Study of Post-Complex Continuity

  David,

  You know me. You know I'm tired of the word "collapse." It's overused. It's become a catch-all bucket for anything that stops building big things. When the palaces burn, when the statues stop rising, when the stelae go silent, the textbooks say the society died. I'm proposing we stop asking why they died and start asking why they went quiet.

  I'm calling this project "Administrative Invisibility." The core question is precise: **To what extent does the cessation of monumental production and centralized record-keeping mask the continuity of population and local social networks?**

  We need to separate the *administration* from the *people*. Standard ecological and systems-collapse theories—your buddy Tainter's complexity models, the usual overshoot narratives—they settle why the *center* couldn't hold. They explain why the king couldn't pay the scribes or why the soil gave out on the acropolis. But they don't settle whether the people disappeared or just reorganized. They assume that without the signal, the organism is dead. I think the organism just stopped broadcasting.

  I want to test this across three distinct cases where the "collapse" is canonical.
  1.  **Late Bronze Age Aegean:** The loss of Linear B. The palaces burn, the script vanishes. But did the farmers leave?
  2.  **Rapa Nui (Easter Island):** The halt of statue-building. The orthodoxy says ecological suicide. I want to look at the adaptation.
  3.  **The Maya Southern Lowlands:** The Classic abandonment. Everyone moved north or to the coasts. The society didn't vanish; the map just shifted.

  Here's the method: I'm not asking for money to dig. I don't need a trowel. I need six months to sit in the stacks and make phone calls. This is conceptual reframing plus comparative case study. I want to synthesize existing data that usually lives in separate silos. I'm looking at non-monumental traces. Pottery networks that persist after the palace styles vanish. Dietary isotopes from bone collagen that show if people stayed on the same land even when the temples were closed.

  Most reports from the field sit in university libraries gathering dust. I'll be using the interlibrary loan system heavily—God help me—and faxing colleagues in Cambridge and Cambridge (the other one) to get at the raw isotope data from the Maya digs that hasn't made it into the big journals yet. I want to overlay the timeline of "monument silence" with the timeline of "dietary continuity."

  **What a result looks like:**
  If this works, we produce a framework for "invisible continuity." We stop teaching students that the Bronze Age ended in a dark age and start teaching them that it ended in a decentralization. We change the metric of survival from stone to bone. The deliverable is a monograph draft and a seminar series for the department.

  **Honest Assessment of Risk:**
  Six months is tight. I know it. The biggest risk is data incompatibility. The isotope studies on the Maya are high-res; the data from the Aegean is thirty years old and measured differently. I might spend three months just trying to normalize the datasets and find out they don't speak to each other. If that happens, I fail. Also, I'm relying on published reports. If the crucial evidence is still in unpublished field notebooks sitting in a director's office in Guatemala, I won't get it in time. There's no web to search, no digital archives to query. I have to wait for the mail.

  But if I'm right, we stop mourning ghosts. We start seeing the people who stayed.

  Thanks for reading this. I'll drop the hard copy in the mail tomorrow.

  Best,
  Elena
