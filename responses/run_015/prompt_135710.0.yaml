answer: |-
  Here is your Q&A prep sheet. I've ranked these by **Likelihood × Damage**. The top three are the ones that can actually derail the presentation if you get flustered; the bottom five are manageable if you stay calm.

  ### 1. The TA (The "Imagination" Reduction)
  **Likelihood:** High | **Damage:** Fatal
  **The Objection:** "You're saying the duty is to the *Encounter*. But the Encounter is just the intersection of the code and your imagination. If the character can't be harmed, isn't this duty just a duty *to yourself* to imagine responsibly? You're adding 'directedness' as extra steps to describe a virtue ethic."

  *   **Concede:** You can't prove the character is a metaphysical entity. Admit the duty is grounded in the player's psychology.
  *   **Hold:** The *Encounter* has resistance. Unlike pure imagination, the game pushes back. It prescribes specific imaginings (Walton).
  *   **90-Second Reply:** "That's the strongest challenge, and here's the distinction: pure imagination is sovereign; I can imagine a friend and treat them well easily. The *Encounter* involves an artifact that resists me. The game prescribes specific imaginings I didn't choose. When I mistreat the character, I'm violating the terms of *that specific relationship* constituted by the software, not just failing a general standard of virtue. The duty is directed because the *source of the constraint* is external to my will, even if the *victim* isn't a rights-bearer. It's the difference between breaking a promise to a person and breaking a promise to yourself; the structure of the obligation feels different because the 'other' is providing the resistance."
  *   **Weakest Point:** If they press that "resistance" is just code (see CS objection), you risk circularity.

  ### 2. The Professor (The "Opportunity Cost" Strike)
  **Likelihood:** High | **Damage:** High (Grade/Social)
  **The Objection:** "Let's look at the utility. Worrying about simulated entities diverts attention from real suffering. If this duty doesn't prevent harm to a rights-bearer, isn't it just emotional machinery misfiring? Why allocate moral capital here?"

  *   **Concede:** Simulated suffering is not equal to real suffering. Do not claim it is.
  *   **Hold:** Moral habits are transferable. The "cost" is low; the "training value" is high.
  *   **90-Second Reply:** "I agree that simulated pain doesn't weigh the same as real pain in a utilitarian calculus. But moral attention isn't a zero-sum tank; it's a muscle. Cultivating a sensitivity to 'directedness' in low-stakes environments trains the reflexes for high-stakes ones. If I treat the Encounter as disposable because it lacks rights, I'm rehearsing a mode of engagement I don't want active when I deal with vulnerable humans who *also* might be dismissed as 'processes.' The duty isn't about the character's welfare; it's about the player's moral calibration. The opportunity cost is negative; the practice is cheap, and the downstream benefit to real agents is the actual utility."
  *   **Weakest Point:** A hard utilitarian might still say "Just practice on real people."

  ### 3. The CS/ML Person (The "Autocomplete" Ontology)
  **Likelihood:** Medium | **Damage:** High (Credibility)
  **The Objection:** "You need an implementation criterion. The 'Encounter' is just your brain projecting agency onto autocomplete. How is this ontologically different from an imaginary friend? If I talk to a chatbot, is that an Encounter?"

  *   **Concede:** There is no magic in the code. It is math.
  *   **Hold:** The *design intent* creates the Encounter. The chatbot is open; the game character is curated.
  *   **90-Second Reply:** "The difference isn't in the code's complexity; it's in the *prescription*. An imaginary friend is wholly generated by me. A game character is a curated artifact designed to solicit specific emotional responses. The 'Encounter' is the interface where that design intent meets my agency. A chatbot is a tool; a companion character is a simulated subject. If I scream at a calculator, no duty. If I scream at a character designed to love me, the Encounter creates a normative friction. The implementation criterion is *design intent for relationality*, not computational complexity."
  *   **Weakest Point:** Blurry line between advanced NPC AI and "relational design."

  ### 4. Game Design Student (The "Shooter" Scope)
  **Likelihood:** High | **Damage:** Medium (Audience Alienation)
  **The Objection:** "So if I mow down faceless goons in *Doom*, am I violating a duty? Because if yes, your theory makes all gaming immoral. If no, what's the difference between a goon and a companion?"

  *   **Concede:** You are not arguing all violence in games is wrong.
  *   **Hold:** The *Encounter* requires a history of play and persistence. Goons are process; Companions are encounters.
  *   **90-Second Reply:** "Great question, and the distinction is in the *Encounter* definition. Faceless enemies are 'Character-as-Process.' They reset instantly, have no history, and no relational design. A companion character accumulates a shared history *with you*. The duty arises from the *relationship* built over time, not the visual fidelity. Mowing down a goon is mechanics; betraying a companion is a narrative act. My claim only applies where the game has successfully built a persistent, relational Encounter. If the game treats them as ammo, I'm not claiming you owe them a duty."
  *   **Weakest Point:** Some "goons" have more personality than some "companions."

  ### 5. Media Studies Auditor (The "Labor" Deflection)
  **Likelihood:** Medium | **Damage:** Medium (Political Blindspot)
  **The Objection:** "Focusing on the player's duty to the character lets the designers off the hook. Who decided this character was killable? Isn't this duty just a way to dodge the labor politics of who gets made disposable?"

  *   **Concede:** Absolutely. This theory does not exonerate designers.
  *   **Hold:** Player ethics and Designer ethics are separate layers. Both can be true.
  *   **90-Second Reply:** "I completely agree that player ethics shouldn't obscure design ethics. Who gets designed as killable is a political question about labor and representation. My claim is about the *player's* position within that system once it's built. We can hold designers accountable for creating exploitative systems *and* hold players accountable for how they inhabit them. Acknowledging a duty to the Encounter doesn't forgive the designer for making the Encounter exploitable; it just means I don't get to be the one to pull the trigger without moral residue."
  *   **Weakest Point:** Can sound like you're accepting blame for systemic issues.

  ### 6. The Professor (The "Error Theory" Follow-up)
  **Likelihood:** Medium | **Damage:** Low
  **The Objection:** "You say it's not misfiring machinery. But if there's no right-holder, what is the duty *anchored* to? It sounds like you're describing a feeling and calling it a norm."

  *   **Concede:** It feels like a feeling.
  *   **Hold:** Norms exist without right-holders (duties to the dead, to nature, to art).
  *   **90-Second Reply:** "We already accept duties without right-holders in other contexts. I owe a duty to a corpse, but the corpse has no rights. I owe a duty to a historic site, but the building has no claims. The anchor isn't a claimant; it's the *value of the relationship itself*. I'm arguing the Encounter is a valuable thing, like a secret or a trust. Violating it destroys something valuable, even if nothing 'suffers' in the utilitarian sense. The norm is anchored in the preservation of meaningful engagement, not the prevention of pain."
  *   **Weakest Point:** Analogies to corpses/sites can be challenged as disanalogous.

  ### 7. Game Design Student (The "Reload" Mechanics)
  **Likelihood:** Low | **Damage:** Low
  **The Objection:** "You said reloading makes it worse. But if I reload, the encounter never 'happened' in the server logs. How can I owe a duty to something that was erased?"

  *   **Concede:** The server state is reset.
  *   **Hold:** The *player's* state is not reset. You remember.
  *   **90-Second Reply:** "The save file resets the code, but it doesn't reset *me*. I know I did it. The 'Encounter' is partly constituted by my memory and my agency. Reloading to undo cruelty is a form of gaslighting myself. It says, 'I only behave well when there are no consequences.' The repetition is the harm—I've practiced the cruelty multiple times, even if the code doesn't track it. The duty is to my own integrity within the play space, not to the server state."
  *   **Weakest Point:** Relies heavily on the "player integrity" argument, which borders on virtue ethics.

  ### 8. General Room (The "Directedness" Coherence)
  **Likelihood:** Low | **Damage:** Low
  **The Objection:** "Philosophically, can a duty be 'directed' if there's no one to claim it? Isn't that just an 'obligation'?"

  *   **Concede:** Terminology is tricky here.
  *   **Hold:** Directedness describes the *structure* of the thought, not the legal standing.
  *   **90-Second Reply:** "I'm using 'directed' to describe the phenomenological structure, not the legal standing. When I betray a friend, I think 'I wronged *them*.' When I betray the Encounter, I think 'I wronged *it*,' not just 'I acted badly.' That directional vector matters for how we process guilt and repair. Even if the character can't sue me, the moral motion is toward them, not just inward. I want to preserve that directional intuition without needing the metaphysical baggage of rights."
  *   **Weakest Point:** Philosophical purists might reject this redefinition of "directed duty."

  ***

  ### Strategic Overview

  **The Fatal Fumble:**
  **The TA's Objection (#1).** If you cannot distinguish the "Encounter" from "Your Imagination," your whole three-way split collapses into subjectivity. If it's just your imagination, the duty is to yourself (Virtue Ethics), not directed (Relational Ethics). **Do not let this slide.** You must emphasize the *external constraint* of the game artifact.

  **The Survivable Fumble:**
  **The Media Studies Objection (#5).** If you stumble here, just concede heavily. "You're right, I haven't addressed labor, and that's a limitation of this specific talk." It doesn't invalidate your core ethical claim about the player.

  **The Question You Hope Nobody Asks:**
  *"If the server shuts down tomorrow, does the duty vanish?"*
  (If you say yes, the duty was about the Process. If you say no, where does the duty live? This attacks the ontological grounding of the Encounter.)
  *Prep Answer:* "The duty vanishes because the *Encounter* vanishes. The Encounter requires the possibility of interaction. A dead server is like a dead friend; duties shift from interaction to memory/respect."

  **The Opening Volunteer Move:**
  In your first minute, explicitly say: **"I want to be clear: I am not arguing that mowing down faceless enemies in a shooter is morally equivalent to betraying a companion character. My claim is about persistent, relational Encounters."**
  *Why:* This disarms the Game Design students immediately (Objection #4) so they don't spend the whole Q&A trying to trap you on *Call of Duty*.

  ***

  ### Advisor Feedback: The Three-Way Split
  Your advisor is half-right. The split *is* scaffolding, but it's **necessary scaffolding**.
  *   **Where it works:** It successfully blocks the CS objection (Process) and the TA objection (Fiction). It isolates the only place your theory can live (Encounter).
  *   **Where it's weak:** It risks looking like you moved the goalposts to find a place where the duty fits.
  *   **Fix:** Don't present the split as a taxonomy of *objects*. Present it as a taxonomy of *relationships*.
      *   Process = Relationship with a machine.
      *   Fiction = Relationship with an author.
      *   Encounter = Relationship with a *presence*.
      *   *Emphasize:* "I'm not cutting the character into pieces; I'm identifying which *mode of engagement* carries the weight."

  Good luck. Keep the replies tight. Don't try to win the Utilitarian argument; just survive it.
