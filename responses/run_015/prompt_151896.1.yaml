      *   **Conclusion:** We aren't looking for one winner. We are looking for a fuller picture. No view is exhaustive.

      *   **Refining the Tone:** Needs to sound like a smart high school junior, not a professor. Respectful but confident.
      *   **Timing:** 4 minutes is roughly 500-600 words.
