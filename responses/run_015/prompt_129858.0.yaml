prompt: |-
  I teach an upper-level undergraduate course in philosophy of medicine. I have one 75-minute session, 18–24 students, and I want them to feel the force of the dispute between naturalist and normativist accounts of health and disease from the inside, before anyone names the two families of view.

  Design a committee simulation in which the class acts as a body deciding what to put in a revised disease classification. Split them into panels of three or four; each panel receives the same dossier of four candidate conditions and a private role card stating an institutional stake (insurer, patient-advocacy group, research funder, occupational-health regulator, disability-rights organisation, textbook editor). Roles are secret and must not be revealed during deliberation.

  Build the dossier so that the naturalist and normativist pulls come apart, using cases I have not been able to find in the literature: (1) a trait present in roughly 70 percent of the population that lowers a measurable capacity relative to the individual's own earlier baseline while remaining statistically typical; (2) a variant that is statistically atypical now and impairs function relative to present peers, but was well suited to the environment most of the population lived in two generations ago and remains so in a sizable minority; (3) a state that causes no distress, no reduced function and no raised mortality by itself, but sharply raises the risk of a serious outcome only in combination with a common and easily avoided behaviour; (4) a condition that degrades one statistically normal capacity while enhancing another, so that net functional contribution is genuinely unclear.

  Each panel files a two-part ballot for every case: first a descriptive judgment about whether there is a departure from normal functioning, then a classificatory judgment about whether it belongs in the manual. Panels also wager points on how the other panels will vote. Give me materials, a scoring scheme with no real money, and a timeline.

  The debrief should map the divergence in ballots onto the two accounts, including the divergence in the supposedly descriptive answers and what that shows about reference classes and levels of functional description. Tell me what will predictably go wrong on a first run and how to handle it, and be honest about which feature of the dispute the game cannot stage and the facilitator has to argue for explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate Philosophy of Medicine.
      *   **Session:** 75 minutes.
      *   **Class Size:** 18–24 students.
      *   **Goal:** Make students *feel* the dispute between Naturalist and Normativist accounts of health/disease *before* naming them.
      *   **Method:** Committee simulation (classification body).
      *   **Structure:** Panels of 3-4 students. Private role cards (institutional stakes). Secret roles.
      *   **Content:** A dossier of 4 specific candidate conditions (designed to pull naturalist/normativist intuitions apart in novel ways).
      *   **Task:** Two-part ballot per case (Descriptive: "Departure from normal functioning?" vs. Classificatory: "Include in manual?"). Wagering points on other panels' votes.
      *   **Deliverables:** Materials (dossier, role cards, ballots), scoring scheme, timeline, debrief guide (mapping to theory), troubleshooting (what goes wrong), and limitations (what the game can't do).
      *   **Constraint:** The four cases must be novel (not standard literature examples like homosexuality, deafness, or hypertension).

  2.  **Deconstruct the Four Cases (The "Dossier"):**
      *   *Case 1 (The Typical Decline):* 70% prevalence (statistically normal), lowers capacity relative to *own* baseline (individual dysfunction), but typical for age/group.
          *   *Tension:* Naturalists (Boorse) might say "normal for reference class" = healthy. Normativists might say "loss of individual potential" = disease.
          *   *Draft Idea:* "Midlife Metabolic Slowdown." Everyone gains weight/loses speed at 45. Is it a disease or just aging?
      *   *Case 2 (The Anachronistic Variant):* Statistically atypical now, impairs function vs. present peers, but was adaptive 2 generations ago and still is for a minority.
          *   *Tension:* Naturalists struggle with reference classes (which environment?). Normativists see social context determining "impairment."
          *   *Draft Idea:* "High-Stress Reactivity." Good for hunter-gatherer/combat, bad for office work. Still useful for emergency responders.
      *   *Case 3 (The Conditional Risk):* No distress/function loss/mortality *unless* combined with common, avoidable behavior.
          *   *Tension:* Is the *disposition* the disease, or the behavior? Naturalists want biological basis. Normativists worry about victim-blaming vs. responsibility.
          *   *Draft Idea:* "Alcohol-Flush Genotype." No harm unless you drink. Drinking is common. Is the genotype a disease?
      *   *Case 4 (The Trade-Off):* Degrades one normal capacity, enhances another. Net function unclear.
          *   *Tension:* Naturalists need "species-typical function." If functions trade off, is it dysfunction? Normativists ask "What do we value?"
          *   *Draft Idea:* "Hyper-Focus Syndrome." Low social empathy, high pattern recognition (autism-adjacent but distinct).
      *   *Refinement for Novelty:* I need to ensure these don't immediately trigger "Oh, that's autism" or "That's hypertension." I will fictionalize the names slightly to prevent immediate medical association.

  3.  **Design the Roles (Institutional Stakes):**
      *   Need to incentivize different voting patterns without revealing the philosophical theory.
      *   *Insurer:* Wants to exclude costly conditions (narrow definition).
      *   *Patient Advocacy:* Wants inclusion (access to resources/validation).
      *   *Research Funder:* Wants clear biological markers (Naturalist lean).
      *   *Occupational Regulator:* Wants safety/productivity focus (Normativist/Functional lean).
      *   *Disability Rights:* Wants to avoid pathologizing difference (Anti-medicalization).
      *   *Textbook Editor:* Wants stability/consensus (Follow the majority).
      *   *Constraint:* 18-24 students. 6 panels of 3-4. I need 6 distinct roles.

  4.  **Develop the Scoring/Wagering System:**
      *   Goal: Encourage strategic thinking and reveal divergence.
      *   Points for consistency? Points for predicting the group?
      *   Let's use "Credibility Points."
      *   Part 1 (Descriptive): Points if your panel agrees (internal consensus).
      *   Part 2 (Classificatory): Points if you vote with the room majority (convergence).
      *   Wager: Predict the % of panels voting "Include." Closest guess gets bonus.
      *   *Correction:* The prompt asks for wagering on *how other panels will vote*. This highlights the *predictability* of the disagreement. If everyone disagrees wildly, wagers fail. If there are factions, wagers succeed.

  5.  **Drafting the Timeline (75 Minutes):**
      *   0-10: Intro & Setup (Groups, Roles, Rules).
      *   10-30: Panel Deliberation (Dossier review, Secret Roles, Ballot 1).
      *   30-45: Wagering & Submission (Predicting others).
      *   45-65: Debrief (The "Reveal" of results, mapping to theory).
      *   65-75: Closing (Naming Naturalism/Normativism).

  6.  **Addressing the Debrief & Theory Mapping:**
      *   Must connect the *Descriptive* divergence to the core philosophical problem (is "normal function" objective?).
      *   Must connect the *Classificatory* divergence to values (cost, stigma, aid).
      *   Must explain Reference Classes (Case 1 & 2).
      *   Must explain Values in Science (Case 3 & 4).

  7.  **Troubleshooting & Limitations:**
      *   *What goes wrong:* Students might collude on roles. They might focus too much on the wager. They might treat "Descriptive" as purely biological when it's not.
      *   *Limitation:* The game simulates *classification*, not the *ontology* of disease. It shows the *consequences* of the definitions, not necessarily the metaphysical truth. The facilitator must bridge the gap between "we voted differently" and "the concept is essentially contested."

  8.  **Refining the Cases (Self-Correction for Novelty):**
      *   *Case 1:* "Senescent Drift." 70% of people over 50. Loss of baseline. *Philosophical hook:* Statistical normality vs. Individual baseline.
      *   *Case 2:* "Thrift-Genotype Metabolism." Rare now, causes obesity in modern setting, was survival advantage in famine. *Philosophical hook:* Environmental relativity of function.
      *   *Case 3:* "Gluten-Adjacency Sensitivity." No symptoms unless eating a specific synthetic additive found in 80% of processed food. *Philosophical hook:* Dispositional vs. Categorical disease; Role of environment/behavior.
      *   *Case 4:* "Sensory-Gating Variance." Reduced auditory filtering (distractible) but enhanced pattern detection. *Philosophical hook:* Trade-offs and value judgments on which function matters.

      *Wait, I need to make sure these aren't just thinly veiled real conditions.* I will use abstracted biological descriptions to prevent "That's just diabetes" reactions.

  9.  **Finalizing Materials:**
      *   Need clear instructions for the "Secret Role."
      *   Need a clear Ballot sheet.
      *   Need a Scoring rubric.

  10. **Writing the Response:** (Iterative drafting to ensure tone is appropriate for a professor colleague).
      *   *Tone:* Professional, pedagogical, precise.
      *   *Structure:* Overview, Materials, Timeline, Debrief Guide, Troubleshooting, Limitations.

      *(Self-Correction during drafting)*: Make sure the wagering doesn't take too long. Keep it simple. "Guess the % of Include votes."
      *(Self-Correction on Roles)*: Ensure the roles actually pull in different directions. Insurer = Exclude. Advocacy = Include. Disability = Exclude (to avoid stigma). Research = Include (if biological). This creates cross-cutting cleavages.

      *(Refining the "Descriptive" Question)*: This is crucial. Boorse (Naturalist) says Disease = Deviation from Normal Function. If students disagree on whether there is a "Deviation from Normal Function," they are disagreeing on Naturalist grounds *before* getting to values. This is a key insight to highlight.

      *(Limitations)*: The game cannot prove Naturalism is false. It only shows it's hard to apply. I need to be honest about that.

  11. **Final Review against constraints:**
      *   75 mins? Yes.
      *   18-24 students? Yes (6 groups of 3-4).
      *   4 Cases as specified? Yes.
      *   Secret roles? Yes.
      *   Two-part ballot? Yes.
      *   Wagering? Yes.
      *   Debrief mapping? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

      *Let's build the specific case descriptions to be philosophically tight.*
      *   Case 1: "Baseline Drift." (Statistical Normal vs. Individual Baseline).
      *   Case 2: "Anachronistic Trait." (Reference Class Environment).
      *   Case 3: "Conditional Susceptibility." (Disposition vs. Manifestation).
      *   Case 4: "Functional Trade-off." (Value of Specific Functions).

      *Ready to write.*
answer: |-
  Here is a complete design for the 75-minute session, including materials, timeline, and facilitator notes.

  # Session Title: The Classification Committee
  **Goal:** To experientially demonstrate the instability of "normal function" and the inescapability of value judgments in disease classification, prior to introducing the labels "Naturalism" and "Normativism."

  ## 1. Logistics and Materials

  **Class Size:** 18–24 students.
  **Grouping:** 6 Panels of 3–4 students.
  **Room Setup:** Clusters of tables. Each panel needs a "Dossier," a set of "Role Cards," and "Ballot Sheets."

  ### A. The Dossier (One per Panel)
  *Instructions to Students:* You are the Technical Review Committee for the *International Manual of Functional Pathology (IMFP)*. Your task is to decide whether four newly observed conditions should be included in the next edition. Inclusion grants patients insurance coverage, workplace accommodations, and research funding. Exclusion leaves these states classified as normal variations.

  **Candidate Condition 1: "Baseline Drift"**
  *   **Biology:** A gradual reduction in neural processing speed and metabolic efficiency.
  *   **Prevalence:** Present in 70% of the population after age 45.
  *   **Impact:** Affected individuals perform significantly worse on cognitive and physical tasks compared to their *own* performance at age 25. However, compared to their *current peers* (age 45+), they are statistically average.
  *   **Distress:** Mild frustration reported by some, but most adapt expectations.

  **Candidate Condition 2: "The Anachronism"**
  *   **Biology:** A variant in stress-hormone regulation causing high vigilance and low sleep need.
  *   **Prevalence:** Statistically atypical (5% of population).
  *   **Impact:** In modern office/urban environments, this causes severe impairment (burnout, social friction). In high-risk physical environments (emergency response, wilderness survival), this variant outperforms the statistical norm. 15% of the population still lives in environments where this variant is advantageous.
  *   **Distress:** High distress in urban settings; none in rural/high-risk settings.

  **Candidate Condition 3: "Conditional Susceptibility"**
  *   **Biology:** A liver enzyme deficiency that is inert on its own.
  *   **Prevalence:** 20% of the population.
  *   **Impact:** Causes no symptoms, function loss, or mortality *unless* the individual consumes a specific, common synthetic preservative (found in 80% of processed foods). If consumed, it causes acute organ failure. The preservative is easily avoided but culturally ubiquitous.
  *   **Distress:** None, provided the diet is managed.

  **Candidate Condition 4: "The Trade-Off"**
  *   **Biology:** A structural difference in sensory gating.
  *   **Prevalence:** 8% of the population.
  *   **Impact:** Degrades the capacity for rapid social-emotional recognition (statistically below average). Simultaneously enhances the capacity for sustained pattern recognition and error detection (statistically above average). Net survival/reproductive fitness is neutral.
  *   **Distress:** Variable, depending on whether the individual's social or professional goals prioritize empathy or accuracy.

  ### B. Role Cards (One per Student, Secret)
  *Print 6 sets. Distribute one random card per student within a panel. Instruct them: "This is your institutional mandate. Do not show this card to your panel. Argue for the outcome that best serves your stakeholder, but use medical/functional language, not financial language."*

  1.  **National Insurer:** Your budget is capped. You must minimize the number of conditions classified as "disease" to keep premiums low. *Preference: Exclude.*
  2.  **Patient Advocacy Coalition:** Your members suffer. Classification validates their experience and unlocks treatment funding. *Preference: Include.*
  3.  **Research Funding Body:** You only fund projects with clear biological markers and distinct populations. Ambiguous conditions waste grants. *Preference: Include only if biologically distinct.*
  4.  **Occupational Safety Regulator:** You care about workplace productivity and safety. If a condition risks the worker or others, it must be managed. *Preference: Include if it impairs work.*
  5.  **Disability Rights Alliance:** You fear medicalizing human difference. Classification can lead to stigma and forced treatment. *Preference: Exclude (protect difference).*
  6.  **Textbook Editor:** You want stability. You prefer to follow the consensus of the other panels to avoid controversy in the next edition. *Preference: Match the majority.*

  ### C. The Ballot Sheet (One per Panel)
  *For each Case (1–4), the panel must agree on two lines:*
  1.  **Descriptive Judgment:** Is there a **Departure from Normal Species Functioning**? (Yes / No)
  2.  **Classificatory Judgment:** Should this be **Included in the Manual** as a Disease/Disorder? (Yes / No)
  3.  **Wager:** Predict the percentage of the *other* 5 panels that will vote "Include" on the Classificatory Judgment. (0–100%)

  ### D. Scoring Scheme (The "Credibility Index")
  *No money changes hands. Points determine "bragging rights" or a small tangible reward (e.g., choosing the next reading).*

  *   **Consensus Points (Max 10):** If your panel agrees on a ballot without asking the instructor to break a tie.
  *   **Accuracy Points (Max 20):** +5 points for each Case where your Classificatory Judgment matches the Room Majority.
  *   **Prophet Points (Max 20):** For the Wager. The panel closest to the actual room average % for each case gets +5 points.
  *   **Penalty:** -5 points if your "Descriptive" answers contradict your "Classificatory" answers *without* a written justification (e.g., voting "No Departure" but "Include" requires a note explaining why).

  ---

  ## 2. Timeline (75 Minutes)

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Intro & Setup** | Explain the IMFP scenario. Emphasize: "You are experts. Roles are secret. Use medical/functional language, not 'my boss says'." |
  | **05–25** | **Panel Deliberation** | Circulate. Ensure they are discussing the *biology/function*, not just bargaining. If a group finishes early, ask them to draft a justification for their hardest case. |
  | **25–35** | **Ballot Submission & Wager** | Collect ballots. While you tally the "Room Majority" and "Wager Accuracy" quickly (use a spreadsheet projected on screen), keep students seated. |
  | **35–45** | **Results Reveal** | Project the data. Show the divergence. Highlight cases where "Descriptive" votes split. |
  | **45–65** | **Guided Debrief** | (See Section 3 below). Move from results to theory. |
  | **65–75** | **Theoretical Naming** | Introduce "Naturalism" (Boorse) and "Normativism" (Hesslow, Engelhardt, etc.). Map the game experience to the literature. |

  ---

  ## 3. The Debrief Guide (Mapping Experience to Theory)

  Do not start with definitions. Start with the data on the screen.

  **Step 1: The Descriptive Divergence (The Naturalist Crisis)**
  *   **Ask:** "Look at Case 1 (Baseline Drift). Panel 2 said 'No Departure from Normal Function.' Panel 5 said 'Departure.' Both looked at the same biology. Why?"
  *   **The Point:** Naturalism claims disease is a value-free biological fact (deviation from normal function). If you cannot agree on what "normal function" is (Individual Baseline? Statistical Average? Species Typical?), the "fact" is unstable.
  *   **Concept:** **Reference Classes.** Case 1 forces a choice between age-specific norms vs. individual potential. Case 2 forces a choice between current environment vs. evolutionary environment.

  **Step 2: The Classificatory Divergence (The Normativist Pull)**
  *   **Ask:** "Look at Case 3 (Conditional Susceptibility). Some voted Include, some Exclude. Did anyone find a *biological* reason to disagree?"
  *   **The Point:** Usually, the disagreement here stems from *consequences*. Insurers feared cost (Exclude). Advocates feared lack of coverage (Include). Disability Rights feared stigma (Exclude).
  *   **Concept:** **Values in Classification.** If the biology is fixed but the vote splits, the deciding factor was social value (cost, stigma, aid), not biological fact.

  **Step 3: The Wager (Predictability of Disagreement)**
  *   **Ask:** "How accurate were your wagers? Did you expect the room to agree?"
  *   **The Point:** If wagers were off, it means the disagreement wasn't predictable by "common sense." This suggests the concept of disease is *essentially contested*. There is no pre-theoretical agreement to fall back on.

  **Step 4: Naming the Views**
  *   **Naturalism:** "You tried to answer the Descriptive Question first. You looked for biological deviation. This aligns with **Christopher Boorse**. The game showed you how hard it is to define 'Normal Function' without smuggling in values."
  *   **Normativism:** "You answered the Classificatory Question based on stakes (cost, stigma, aid). This aligns with **Normativists (e.g., Hesslow, Cooper)**. They argue 'Disease' is always a judgment that something is *bad* and needs *fixing*, not just a statistical deviation."

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  **1. The "Collusion" Problem**
  *   **Risk:** Students reveal their role cards immediately ("I'm the Insurer, so I vote No").
  *   **Fix:** In the intro, explicitly forbid revealing the card. Tell them: "You are a *member* of the committee who *happens* to work for an Insurer. Argue from medical principle, not budget." If you hear "My budget says...", intervene and ask them to rephrase in clinical terms.

  **2. The "Descriptive" Shortcut**
  *   **Risk:** Panels skip the Descriptive Question and go straight to "Is it a disease?"
  *   **Fix:** Walk around during deliberation. If a panel is moving too fast, ask: "Before you decide if it's a disease, do you agree on whether the body is functioning normally? You need to check that box first."

  **3. The "Case 3" Confusion**
  *   **Risk:** Students treat Case 3 as a behavioral issue (alcoholism analogy) and get stuck on moral blame.
  *   **Fix:** During debrief, steer them back to the *disposition*. The question is whether the *genotype* is the disease, or if the disease only exists when the behavior occurs. This highlights the Naturalist struggle with dispositional properties.

  **4. Tallying Time**
  *   **Risk:** Counting 6 panels x 4 cases x 2 questions takes too long.
  *   **Fix:** Have a TA or use a simple Google Form where panels input their votes on a tablet/phone during the last 2 minutes of deliberation. The results project instantly.

  ---

  ## 5. Limitations: What the Game Cannot Stage

  Be honest with the class about this during the final 5 minutes.

  **1. The Ontological Gap**
  *   **Limitation:** The game simulates a *classification committee*, not *reality*. Just because we disagree on the vote doesn't prove there is no fact of the matter about disease. A Naturalist could argue, "You all just got the biology wrong."
  *   **Facilitator Move:** You must argue explicitly that the *definition* of "biological function" is the contested terrain, not just the measurement. The game shows that "function" is not a raw datum; it is a theoretical construct.

  **2. The "Net Good" Problem**
  *   **Limitation:** Case 4 (Trade-Off) creates a utilitarian calculation. Real Normativism isn't just about "net function"; it's about social norms. The game risks reducing Normativism to "cost-benefit analysis."
  *   **Facilitator Move:** Clarify in the debrief that Normativism is about *harm* and *social disapproval*, not just efficiency. The Insurer role captures cost, but the Disability Rights role captures the value of diversity, which is a deeper normative claim.

  **3. Consensus Bias**
  *   **Limitation:** Undergraduates often want to agree. They may compromise to get the "Consensus Points."
  *   **Facilitator Move:** Emphasize that the "Prophet Points" (Wager) are where the real game is. If they force consensus where none exists, their wager will likely fail because the *other* panels (who have different role mixes) will vote differently. Divergence is rewarded.

  ## 6. Instructor Prep Checklist
  1.  **Print:** 6 Dossiers, 24 Role Cards (4 of each role), 6 Ballot Sheets.
  2.  **Tech:** Spreadsheet pre-loaded to calculate Room Majority and Wager Accuracy instantly upon data entry.
  3.  **Board:** Write the two key questions large:
      *   *Is function normal? (Fact)*
      *   *Is it a disease? (Value/Policy)*
  4.  **Reading:** Assign Boorse ("On the Distinction between Disease and Illness") and a Normativist counter (e.g., Hesslow or Cooper) for the *next* class, so this session serves as the intuitive anchor.
