      *   *Verdict:* This is a major friction point. Davidson requires sentence-sized units held true. If the Heptapods don't have "sentences" but rather "whole situations," Davidson might call it non-linguistic communication or deny it's possible. *Correction:* Davidson allows for holism, but truth conditions need to be assignable. If the logogram expresses a proposition, it works. If it expresses a *feeling* or *experience* without truth value, it fails Davidson's test.
      *   *Refinement:* The film implies the language *causes* the non-linear time perception. For Davidson, language describes the world; it doesn't rewire the sensory apparatus to break causality. This leans into the "Conceptual Scheme" ban.

