      *   *Nuance:* However, the *Passing Theory* idea is that interpretation is dynamic. Louise's " Passing Theory" converges so completely with the Heptapods that she adopts their perspective. But Davidson would say she's just adopting their *beliefs*, not their *mode of existence*. The film suggests the latter.
