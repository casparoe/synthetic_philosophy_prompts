  2.  **Deconstruct the Davidsonian Framework vs. *Arrival*:**

      *   **Radical Interpretation:** Starts from scratch, no shared dictionary. Observer assigns truth conditions to utterances based on behavior/environment.
      *   **Compositionality:** Language must have structure (syntax) to generate infinite meaning from finite parts. Truth theories apply to sentences.
      *   **Charity:** We must assume the speaker is mostly right about the world to make sense of them. We maximize agreement.
      *   **Conceptual Schemes:** Davidson argues *against* the idea of radically different conceptual schemes. "Different scheme" usually just means "false beliefs," which Charity handles. There is no "untranslatable" language.
      *   **Triangulation:** Two creatures interacting with a shared object/event in the world. Meaning arises at the intersection.
      *   **Prior/Passing Theory:** Prior theory is what you bring to the table; Passing theory is what you actually use to interpret a specific utterance (handling malapropisms, quirks). Convergence of these is communication.

  3.  **Address Point 1: The Logograms (Compositionality):**
      *   *Davidson's View:* Language needs structure to be learnable/interpretable. If it's just "semantic blobs," how do you map parts to parts?
