      *   *The Twist:* The film validates the Heptapods. Time *is* non-linear for them (and Louise). This violates Davidson's "ban on alternative conceptual schemes." Davidson would say: Either they are lying, or we translate "time" differently, but we can't accept their ontology as *true* if it contradicts the logic required for interpretation.
