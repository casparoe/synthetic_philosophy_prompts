prompt: |-
  hey — i need a hand with a paper i'm writing for a phil lang seminar. we're doing Davidson (radical interpretation, charity, triangulation, the ban on alternative conceptual schemes, the compositionality requirement for truth theories, and the prior theory / passing theory thing from the malapropism essay), and i want to use Arrival (2016) as a worked example rather than just another made-up alien case. please read the film through that machinery and tell me whether it actually is a case of radical interpretation or whether it quietly dramatizes the exact things Davidson says can't happen.

  some things i want you to take seriously. first: the logograms. the heptapods' writing is circular, has no direction, no apparent word order, and as far as we ever see, no way to negate or to ask a question — it looks like one semantic blob rather than something built out of sentences. on Davidson's picture meaning is compositional and a truth theory assigns truth conditions to sentence-sized units we can catch someone holding true. so does he have to say this isn't a language at all? is there any way to build a compositional truth theory over an unordered non-linear sign, or does the structure requirement just kill it?

  second, the scenes. louise taking off her hazmat suit and walking up to the glass to show her hands reads to me as straight triangulation — she's engineering the third point of the triangle so that meaning has something to hook onto. and the big translation crisis over whether the sign means weapon or tool looks like underdetermination plus a charity failure: the humans read it under a hostile prior theory, and every site is interpreting the same data through its own paranoia. is charity ever actually applied correctly in the film, or does the movie think charity is naive? also, davidson says we can't make sense of massive error, but the heptapods' central claim (that time isn't sequential) is one her colleagues would have to count as wholesale false — so either charity breaks down here or the film is cheating.

  third, my own half-baked idea, which i'd like you to attack: that louise's precognition is best read as her passing theory leaking into first-personal experience. once she's gone native on their language she can hold-true sentences she has no grounds for yet, and the future shows up for her the way the logograms do — as something to be read rather than lived. does davidson's account have room for an interpreter whose own psychology gets restructured by the interpretation? and if it doesn't, is that a defect, or a reason to think the film's premise is incoherent?

  couple of ground rules: work from the film as a normal person remembers it, i don't need citations or a reading list, and don't just tell me it's Sapir-Whorf — i know, everyone says that, and i want the davidsonian version. also please push back where the pairing is forced: if the honest answer is that the movie only looks like radical interpretation because it's first contact, say so and tell me what the reading would have to distort. and i'd like it to end with what, if anything, the film adds to the debate that the papers don't — i keep feeling there's something about interpretation being costly and slow and bodily that you can't get from a two-page formalism, but i can't quite say what.
