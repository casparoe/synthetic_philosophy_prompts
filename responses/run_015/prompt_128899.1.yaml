  Within a hybrid framework that lexically prioritizes phenomenal binding while using functional integration to differentiate lower tiers, the entities are assigned as follows:

  1.  **Sleeping human adult:** Assigned **full moral status** because the temporary suspension of awareness does not negate the enduring capacity for phenomenal binding inherent to the human neurological substrate.
  2.  **Brainstem-active patient with no cortical function:** Assigned **substantial but diminished status** because the loss of cortical phenomenal binding drastically reduces experiential capacity, though preserved brainstem function maintains a baseline of biological functional integration.
  3.  **Honeybee hive operating as an integrated decision-making unit:** Assigned **marginal status** because the superorganism demonstrates high functional integration across temporal scales, but the lack of a centralized nervous system precludes unified phenomenal binding.
  4.  **Large language model during active inference:** Assigned **negligible status** because the system exhibits complex functional integration during inference but operates without any phenomenological ground or intrinsic valence.
  5.  **Thermostat with adaptive predictive feedback loops:** Assigned **no moral status** because the predictive feedback loops constitute simple mechanical regulation rather than genuine functional integration or phenomenal binding.
  6.  **Unicellular organism exhibiting phototactic avoidance:** Assigned **negligible status** because the phototactic behavior indicates minimal biological functional integration, yet the absence of a nervous system rules out phenomenal binding.

  These rankings track a **hybrid criterion** that treats phenomenal binding capacity as the necessary condition for substantial moral standing, while relying on functional integration across temporal scales to distinguish between negligible and non-moral entities in the absence of consciousness. This approach explicitly separates the two dimensions by allowing functional integration to dictate gradations only within the lower tiers where phenomenal binding is absent or uncertain, thereby preventing the collapse of complexity into sentience.
