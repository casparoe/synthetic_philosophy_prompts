answer: |-
  **Guidance for Applicants and Auditors: Permits for Acts Beyond the Call of Duty (Ref: SUPER-104)**

  **1. Preamble**
  This document establishes procedural standards for the Licensing Division of the Bureau of Ethical Administration (hereinafter "the Bureau"). The Bureau is charged with administering the category of the Supererogatory (hereinafter "SA"). An SA is defined as an act that is morally good and praiseworthy to perform but not blameworthy to omit. Staff are reminded that the integrity of the SA category depends on its voluntary nature. Any procedural error that converts an SA into a duty constitutes a regulatory failure. Applicants are advised that submission of Form S-1 does not guarantee certification.

  **2. Retrospective Authorization**
  Authorization for an SA is necessarily retrospective. A permit issued in advance would constitute a mandate, thereby negating the supererogatory status of the act. Consequently, applicants must perform the act prior to filing Form S-1. Applicants bear the risk that the act may later be classified as mandatory or motivated by credit-seeking, in which case the permit will be refused. Staff should note that applicants often express distress regarding this uncertainty; however, certainty is incompatible with optionality.

  **3. Compliance Thresholds and Demand Management**
  Obligation depends on what everyone else is doing. An act is reclassified as mandatory once the participation rate within the relevant reference class crosses the Compliance Threshold (currently set at 65%). Upon crossing this threshold, existing permits are revoked and non-participants are cited retroactively. To prevent this reclassification, the Bureau manages demand. Caps are applied to specific acts. Allocation lotteries are conducted for high-volume categories, such as blood donation or wallet return. The Bureau maintains waiting lists of individuals willing to perform these acts for the sole purpose of keeping participation rates below the threshold. Staff must ensure that willing participants are not permitted to act too frequently.

  **4. The Bystander Field Test**
  The field test for whether an act was ever really optional is the reaction of bystanders. During audit, Officers canvass neighbours and passers-by for resentment or indignation at the omission of the act. Where such reactive attitudes are found, the act is held to have been a duty all along. The permit is refused, and the file is transferred to Enforcement for non-compliance proceedings. Staff should record specific phrases indicating indignation (e.g., "I can't believe they didn't...") on Form B-7. Absence of resentment confirms optionality.

  **5. Non-Transferability of Credit**
  Optional good works are not transferable credit. A claimant may not set an act of rescue or extraordinary generosity against an unmet obligation. For example, a missed support payment or an unfiled tax return cannot be offset by a certified SA. The ledger of optional works cannot be drawn down against the ledger of requirements. Auditors must verify that applicants are not attempting to use Form S-1 as a mitigation strategy for unrelated regulatory breaches.

  **6. Motivation Audit**
  Applicants are disqualified if they acted in order to obtain a permit, or because permits exist. Auditors review diaries, messages, and search histories for evidence of credit-seeking motivation. Phrases such as "doing this for the certification" invalidate the application. A dry statistical note for file: valid applications have fallen steadily since the Bureau opened, correlating with increased awareness of the motivation audit. Staff should not attempt to reverse this trend.

  **Appendix A: Worked Examples and Internal Objections**

  **A.1 Worked Examples**
  Classification problems arise from local rates of compliance.
  *   *Example 1:* An applicant stays late to finish a project. In a department where overtime is standard, this is mandatory. In a department where leaving at 5:00 PM is the norm, this is SA.
  *   *Example 2:* Pulling someone out of a canal. Generally SA. However, if the applicant is a lifeguard on duty, this is mandatory. If bystanders express shock that the applicant walked past the canal, the act is deemed mandatory via Clause 4.
  *   *Example 3:* Returning a lost wallet. Subject to lottery due to high volume. Applicants on the waiting list must refrain from returning wallets until called upon to maintain optionality.

  **A.2 Office of Maximizing Review**
  The internal objector, the Office of Maximizing Review (OMR), holds that since the best available act is always the one you ought to perform, the category is empty and every permit is void. The Bureau does not refute this position but observes the awkward consequence for its own staff. If the OMR is correct, the Bureau's operations are unnecessary, and staff positions are themselves supererogatory. Staff are advised to continue processing forms while the OMR position remains theoretical.

  **7. Forward Programme**
  If anything is to remain supererogatory, participation must be kept low. High visibility encourages imitation, which raises participation rates and triggers mandatory reclassification. Therefore, the Bureau proposes to stop publicizing the scheme. Names of permit-holders will be withheld from public registers. The Bureau will pilot a quiet discouragement of the most generous acts. Public information campaigns will emphasize the risks of intervention. Staff are instructed to process forms efficiently but without encouragement.
