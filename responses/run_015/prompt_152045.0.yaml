  I assign a very low probability to the claim that lexical-threshold negative utilitarianism (LTNU) remains a viable, distinct moral theory under the constraint of rejected cardinal intersubjective commensurability (CIC). While the intra-subjective maneuver avoids direct aggregation, it fails to resolve the problem of social resource allocation without implicitly reintroducing interpersonal comparisons or ceasing to be a *social* ethic.

  ### Decomposition of Reasoning

  **(i) The thesis that inter-personal cardinal comparison of hedonic states is genuinely impossible, not merely epistemically inaccessible.**
  *   **Probability:** 0.30
  *   **Justification:** Emerging neuroscience on affective scaling suggests a common neural currency for valence, making metaphysical incommensurability unlikely even if measurement is currently imprecise.

  **(ii) The thesis that lexical-threshold negative utilitarianism necessarily requires such inter-personal comparison to ground its priority rule, rather than being sustainable on intra-subjective ordinal dominance alone.**
  *   **Probability:** 0.80
  *   **Justification:** Any moral theory guiding resource allocation between agents under scarcity implicitly compares the moral weight of different agents' states, necessitating an interpersonal metric.

  **(iii) The thesis that an intra-subjective lexical rule can be formulated without implicitly smuggling in a cardinal scale through the back door of boundary specification.**
  *   **Probability:** 0.50
  *   **Justification:** While qualitative categories of suffering exist, drawing a non-arbitrary "threshold" line typically presupposes an underlying magnitude scale rather than pure ordinal ranking.

  **(iv) The thesis that the view does not collapse into standard prioritarianism or a merely subjective preference ordering.**
  *   **Probability:** 0.80
  *   **Justification:** Lexical constraints are formally distinct from continuous weighting functions (prioritarianism) and objective hedonic states differ from revealed preferences (subjectivism).

  ### Combination Logic

  The overall credence represents the probability that the *entire philosophical project* is viable, which requires the conjunction of the metaphysical premise (i) and the normative coherence conditions (negation of ii, plus iii and iv).

  $$ \text{Credence} \approx P(i) \times [1 - P(ii)] \times P(iii) \times P(iv) $$
  $$ 0.05 \approx 0.30 \times 0.20 \times 0.50 \times 0.80 $$

  The calculation is dominated by the high probability of thesis (ii); if LTNU requires interpersonal comparison to function socially (0.80), then the strategy of retreating to intra-subjective rules fails to preserve the theory's normative force, reducing the survival probability to near zero regardless of the other factors.

  ### Least Confidence and Potential Shifters

  **Term with Least Confidence:** Thesis (i) (The impossibility of interpersonal cardinal comparison).

  **Decisive Argument/Empirical Result:**
  My confidence would shift most significantly upon the discovery of a **universal neural correlate of hedonic intensity** (e.g., a specific firing rate or neurotransmitter concentration) that scales isomorphically across all conscious subjects. If neuroscience demonstrates that "one unit of pain" is physically identical in all brains, thesis (i) would drop to near zero (making the objection moot), but thesis (ii) would rise to near one (confirming that comparison is possible and required), fundamentally altering the landscape of the debate from metaphysical impossibility to epistemic measurement. Conversely, a proof in **multi-profile social choice theory** demonstrating that lexical thresholds cannot be defined without violating Arrow-style independence conditions on ordinal data would push thesis (iii) toward zero, confirming the incoherence of the boundary specification.
