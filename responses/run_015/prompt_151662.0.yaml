answer: |-
  This is an excellent prompt that touches on one of the most vibrant and contentious debates in contemporary Buddhist ethics. The summary your classmate circulated closely mirrors the "Consequentialist Thesis" most rigorously defended by scholar Charles Goodman (particularly in *Consequences of Compassion*), but it blends that with several simplifications common in online discourse that obscure the nuance found in primary texts and specialized scholarship.

  Your intuition that this framing "flattens distinctions" is well-founded. While the consequentialist reading is a legitimate scholarly position, the summary presents it as settled fact and glosses over significant textual and philosophical counter-evidence, particularly regarding *cetanā* and the ontological implications of Madhyamaka.

  Here is an audit of the summary, claim-by-claim, distinguishing between robust scholarly interpretations, simplifications, and misrepresentations.

  ### 1. Claim: Buddhist ethics is long-range consequentialism mediated by karma (predicting aggregate welfare over indefinite time).

  *   **Alignment:** There is a strong scholarly precedent for this view. Charles Goodman argues that because the moral quality of an act is determined by its karmic fruit (*vipāka*), and karmic fruit is defined by pleasure/pain or soteriological progress, the structure is consequentialist. The "long-range" aspect is accurate insofar as karma operates across lifetimes.
  *   **Simplification:** The summary suggests ethical judgment *requires predicting* these effects ("functioning like rule-utilitarianism"). This is epistemologically problematic. In the *Aṅguttara Nikāya*, the precise workings of karma are listed among the four *acinteyya* (imponderables)—things the human mind cannot calculate. If an agent cannot calculate the consequences, they cannot function as a utilitarian agent. Instead, they follow precepts (*śīla*) established by the Buddha, who *does* see the consequences. This shifts the agent's ethics from act-utilitarianism to something closer to rule-following based on trust in the Buddha's insight.
  *   **Misrepresentation:** It conflates "karmic result" with "welfare." Karmic results are not always about "welfare" in a secular utilitarian sense; they are about congruence with the path to liberation. A painful result might be karmically "ripe" but not "unethical" in the moment.

  ### 2. Claim: *Cetanā* (intention) is a causal filter, not mental-state ethics; Buddhism judges actions by results rather than motives.

  *   **Alignment:** It is true that in Abhidharma, unintentional actions (e.g., stepping on an insect while asleep) do not generate heavy karmic fruit. Intention is a necessary condition for karma.
  *   **Misrepresentation:** This is the most significant distortion in the summary. The Buddha explicitly states in the *Nibbedhika Sutta*: "Intention (*cetanā*), I tell you, is karma." In the virtue-ethical reading (championed by Damien Keown), *cetanā* is not merely a switch that allows consequences to attach; it *constitutes* the moral quality of the act.
      *   **The Abhidharma Nuance:** Abhidharma psychology analyzes *cetanā* alongside root mental factors (*mūla*). An action is *kuśala* (wholesome) if it arises from non-greed, non-hatred, and non-delusion. It is *akuśala* (unwholesome) if it arises from greed, hatred, or delusion. The moral valuation happens *at the moment of intention*, prior to the external result. If a monk intends to save a life but accidentally causes death, the karma is based on the intention, not the accidental result. The summary's claim that Buddhism "judges actions by their results rather than motives" contradicts the foundational definition of karma as intention.
  *   **Verdict:** This is a **misrepresentation** of the mainstream Theravāda and Abhidharma view, though it attempts to co-opt Abhidharma causal theory to support a consequentialist end.

  ### 3. Claim: The Bodhisattva ideal treats nirvana as subordinate to collective welfare; compassion is a universal utility function.

  *   **Alignment:** The Bodhisattva vow does prioritize the liberation of all beings over personal exit from saṃsāra. This looks structurally similar to altruism.
  *   **Simplification:** Describing this as "maximization of collective welfare" imports a utilitarian aggregation model that Mahayana texts often undermine. The Bodhisattva seeks the *awakening* of beings, not merely their temporal happiness (utility). In fact, a Bodhisattva may cause temporary suffering (e.g., tough love, or the *Upāyakauśalya Sūtra* example of the captain killing a murderer to save him from hell) to prevent greater spiritual harm.
  *   **Misrepresentation:** The phrase "universal utility function" implies a duality between the agent and the recipients of welfare. Mahayana ethics, particularly in the *Prajñāpāramitā* literature, is grounded in the non-duality of self and other (*parātmasamatā*). Compassion (*karuṇā*) arises from seeing that there is no inherent self to be saved and no inherent beings to save. It is not an aggregative calculation ("most beings for most happiness") but an ontological realization of interconnectedness. Reducing *bodhicitta* to a utility function ignores the wisdom (*prajñā*) component, which deconstructs the very "beings" being aggregated.

  ### 4. Claim: Madhyamaka critique of *svabhava* reinforces this by denying non-instrumental value to mental states.

  *   **Alignment:** Madhyamaka denies inherent existence (*svabhava*) to all phenomena.
  *   **Misrepresentation:** This is a philosophical non-sequitur often used to force Buddhism into Western meta-ethical boxes. If *svabhava* is denied, it is denied for *results* and *welfare* just as much as for *intentions*. Emptiness (*śūnyatā*) does not privilege consequences over motives; it empties both.
      *   Furthermore, Madhyamaka ethics (e.g., in Śāntideva's *Bodhicaryāvatāra*) often emphasizes the cultivation of virtuous mental states (patience, generosity) as intrinsically necessary for maintaining the realization of emptiness. To claim emptiness renders mental states merely instrumental is to misunderstand the Two Truths doctrine. Conventionally, intentions have moral weight; ultimately, they are empty. A consequentialist reading usually gets stuck on the conventional level while claiming ultimate support.

  ### 5. Final Conclusion: Is Buddhist ethics functionally equivalent to reincarnation-augmented rule-utilitarianism?

  **Does this conclusion survive audit?**
  **No.** While the "Consequentialist Thesis" is a valid heuristic for *some* aspects of Buddhist ethics (particularly regarding the motivation to follow the path to avoid suffering), it fails as a totalizing description for three reasons:

  1.  **The Locus of Evaluation:** As noted in Claim 2, the primary locus of moral evaluation in the Suttas and Abhidharma is the quality of the volition (*cetanā*) and its roots (greed/hatred/delusion), not the external outcome. A utilitarian framework cannot easily account for why an action with good results but malicious intent is considered karmically unwholesome.
  2.  **The Epistemic Barrier:** Utilitarianism requires the agent to assess consequences. Buddhism explicitly denies the agent the capacity to assess karmic consequences fully, shifting the ethical burden to adherence to precepts and cultivation of character (Virtue Ethics).
  3.  **The Soteriological Goal:** Utilitarianism seeks to maximize preference satisfaction or happiness. Buddhism seeks the cessation of craving (*taṇhā*) and ignorance (*avidyā*). Sometimes, maximizing "welfare" in a conventional sense reinforces attachment. The goal is *nirvāṇa*, which is not a "state of welfare" but an unconditioned cessation.

  **Corrected View:**
  A more accurate scholarly synthesis (such as that proposed by Damien Keown or a hybrid view by scholars like Jay Garfield) would describe Buddhist ethics as **Soteriological Virtue Ethics**.
  *   **Virtue Ethics:** Because it focuses on the cultivation of character traits (paramitas, brahmaviharas) and the moral quality of intention.
  *   **Soteriological:** Because the "good" is defined teleologically by the end of suffering (nirvana), not by aggregate worldly welfare.
  *   **Consequentialist Elements:** It acknowledges that karma is causal and results matter, but these results are secondary to the transformation of the agent's mind.

  ### Recommendation for Your Seminar
  Your worry is justified. The summary you received is a "strong reading" that privileges one interpretive lens (Consequentialism) while dismissing the textual evidence for the moral primacy of intention.

  For your discussion, I recommend you raise the distinction between **karmic causality** (which is consequentialist in structure) and **moral evaluation** (which is often intentionalist/virtue-based). You might ask: *If Buddhism were truly utilitarian, how do we explain the karmic weight of failed attempts? If I intend to kill but miss, utilitarianism says no harm was done; Buddhist ethics says the karma of killing is generated. Does this not prove that intention, not result, is the primary locus of value?*

  This will demonstrate that you have engaged with the complexity of the tradition beyond the forum summary's reductionism.
