prompt: |-
  I'm working out the implicit rule behind a colleague's judgments on historical practice, framed through Nietzsche's distinction between monumental, antiquarian, and critical history. Her record: she endorses a streamlined civic founding narrative taught to motivate present democratic participation; she rejects an archive that preserves every artifact of a dead industry with equal weight and no guiding narrative; she approves a recent demolition of a national origin myth that currently justifies exclusionary policy; she condemns an immersive historical reenactment of past suffering that offers participants emotional intensity but no present political aim, describing it as history that drains rather than activates life.

  Consider now an AI-assisted reconstruction project that restores erased personal narratives from fragmentary records, letting descendants inhabit their ancestors' daily lives with granular detail, explicitly without any present reformist agenda—only to recover voices excluded from official histories. Would she read this as a rehabilitated antiquarianism serving life through expanded moral imagination, as a covert monumental project shaping present identity, or as a category error? Identify the closest analog in her prior verdicts, state what each plausible rule predicts, and specify the follow-up case—perhaps one in which those same reconstructed voices are deployed explicitly to argue for present reparations—that would reveal whether her criterion is instrumental orientation toward present action or the formal mode of engagement with the past.
