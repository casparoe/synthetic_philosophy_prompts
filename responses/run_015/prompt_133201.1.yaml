answer: |-
  Based on the record provided, your colleague operates under a rule of **Vitalist Instrumentalism**. She evaluates historical practice not by its fidelity to truth or its preservation of memory, but by its capacity to energize present agency. She accepts Nietzsche's **Monumental** (civic narrative for motivation) and **Critical** (demolishing myths for liberation) modes because they subordinate the past to the needs of the present. She rejects the **Antiquarian** (the dead industry archive) and the **Aestheticized** (the suffering reenactment) because they treat the past as an end in itself, consuming present vitality without returning it as action.

  Here is the analysis of the AI-assisted reconstruction project through her framework.

  ### 1. Closest Analog
  The closest analog in her prior verdicts is the **immersive historical reenactment of past suffering**.

  *   **Similarity:** Both projects prioritize granular, emotional, or experiential connection with the past ("inhabit their ancestors' daily lives" vs. "emotional intensity").
  *   **Constraint:** Both explicitly lack a "present political aim" (the reenactment had none; the AI project is "without any present reformist agenda").
  *   **Her Prior Verdict:** She condemned the reenactment because it "drains rather than activates life."
  *   **Implication:** She will likely view the AI project similarly: as a consumption of energy for the sake of recovery, rather than an investment of energy for the sake of the future.

  ### 2. Plausible Rules and Predictions
  There are three ways she might categorize this project, depending on how strictly she applies her instrumental rule versus how she defines "Life."

  *   **Prediction A: The "Drain" (Failure of Instrumentalism)**
      *   *Rule:* History must yield immediate civic or political utility. Recovery without reform is hoarding.
      *   *Verdict:* **Rejection.** She will classify this as **Antiquarianism failing the Life-Test**. Despite the "Critical" element of recovering excluded voices, the refusal to deploy them for present justice renders the project functionally identical to the "dead industry archive." It preserves the past but does not weaponize it for the living.
      *   *Nietzschean Label:* Excessive Antiquarianism.

  *   **Prediction B: Rehabilitated Antiquarianism (Moral Imagination as Action)**
      *   *Rule:* Expanding moral imagination *is* a form of activation. To "recover voices" is to repair the present's ethical fabric, even without specific policy aims.
      *   *Verdict:* **Endorsement.** She might argue that inhabiting the lives of the excluded creates a "monumental" capacity for empathy in the descendants, motivating democratic participation indirectly.
      *   *Nietzschean Label:* Antiquarianism subordinated to Monumental ends (unconsciously).

  *   **Prediction C: Covert Monumental Project (Identity Shaping)**
      *   *Rule:* Any recovery of excluded voices inevitably shapes present identity, regardless of stated intent.
      *   *Verdict:* **Skeptical Endorsement.** She may accept it but critique the designers for lacking self-awareness. She would argue that by selecting *which* voices to reconstruct, they are already creating a new civic narrative, and they should own that political responsibility rather than claiming neutrality.
      *   *Nietzschean Label:* Monumental history masking as Antiquarianism.

  **Most Likely Outcome:** Given her condemnation of the reenactment ("no present political aim"), **Prediction A** is strongest. She distinguishes between *feeling* the past and *using* the past.

  ### 3. The Follow-Up Case
  To definitively reveal whether her criterion is **Instrumental Orientation** (the *purpose* of the history) or **Formal Mode** (the *method* of engagement), propose the following variation:

  **The Case:** The **same** AI-assisted reconstruction is deployed, but this time the granular data is explicitly used to **argue for present-day reparations**, quantifying the economic loss of the erased narratives to demand material restitution.

  **Diagnostic Outcomes:**

  *   **If she Approves:** Her criterion is **Instrumental Orientation**.
      *   *Reasoning:* The *method* (AI inhabitation/Antiquarian detail) was not the problem; the lack of *aim* was. When the "drain" is converted into "fuel" for a Critical political aim (reparations), the practice becomes valid. This confirms she judges history by its political utility, not its epistemological form.
  *   **If she Rejects:** Her criterion is **Formal Mode**.
      *   *Reasoning:* She opposes the *method* of "inhabiting" the past via granular reconstruction, regardless of the goal. She may prefer a **Monumental** approach (a streamlined narrative of injustice) over an **Antiquarian** one (fragmentary reconstruction), even if both serve reparations. This would reveal that she views deep immersion in the past as inherently stifling to present action, preferring history that is curated and distilled rather than experienced and inhabited.

  **Conclusion:**
  Your colleague is a pragmatic Nietzschean. She does not object to the Antiquarian impulse (preservation) in principle, but only when it is unmoored from the Critical or Monumental needs of the present. The AI project, by claiming neutrality, removes the anchor. She will likely reject it as a "luxury of memory" that drains the vitality required for justice. The reparations follow-up will test whether she believes *any* amount of detail can be justified if the political payoff is high enough, or if she believes that only streamlined, narrative-driven history can truly serve life.
