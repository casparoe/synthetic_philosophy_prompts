answer: |-
  **Question**

  This project asks: Does a regime of differentiated temporal vesting for welfare entitlements constitute a morally permissible compromise between welfare sustainability and migration openness, or does it inevitably instantiate unjustifiable second-class status? The question admits a determinate normative answer independent of empirical fiscal modeling. Even without precise data on migrant lifecycle balances, we can determine whether the *structure* of delayed entitlements violates principles of reciprocity or equality. The inquiry is not whether such a regime saves money, but whether the mechanism of unbundling membership—treating residence, labor access, and transfer eligibility as distinct vesting schedules—is conceptually compatible with democratic citizenship. If the moral objection to bounded membership relies on the binary nature of exclusion, a graduated system might dissolve the objection. If the objection relies on the mere existence of tiers, the system fails. The project seeks to locate the threshold where fiscal prudence transforms into caste.

  **Why the existing positions leave it open**

  Three dominant positions fail to resolve this question because they treat membership as binary. The open-borders position typically demands immediate equal treatment upon arrival, arguing that coercive exclusion violates basic liberty. It fails here because it assumes fiscal sustainability is either irrelevant or achievable only through full openness, ignoring the possibility that delayed vesting could secure sustainability without closed borders. It treats any differentiation as exclusion, missing the nuance of deferred inclusion.

  Conversely, the bounded-membership position argues that generosity requires exclusion, treating the welfare state as a club good. This fails because it assumes contributions and entitlements must coincide instantaneously with entry, overlooking the fiscal potential of long-term residents who vest later. It conflates border closure with fiscal insurance, missing the opportunity to insure via timing rather than exclusion.

  Finally, the integrationist objection warns that probationary tiers create second-class status, undermining social cohesion. While crucial, this objection remains underspecified; it lacks a metric for distinguishing legitimate probationary periods from unjust caste systems. It assumes any tiering damages integration but does not identify the threshold where differentiation becomes domination.

  Because none of these positions analyze *timing* as an independent moral variable, they talk past one another. The open-borders advocate sees exclusion; the bounded advocate sees safety; the integrationist sees stigma. None see the vesting schedule. Consequently, the debate remains stuck between closure and immediate equality, missing the intermediate institutional design that this project interrogates. Without a theory of temporal differentiation, we cannot know if the fiscal objection is truly about numbers or merely about membership boundaries. This conceptual gap leads to policy paralysis. Proponents of openness concede too much to fiscal constraints, accepting closure as the only alternative to fiscal collapse. Proponents of restriction assume openness necessarily entails welfare dilution. By failing to isolate the variable of vesting timing, existing theories cannot adjudicate whether a migrant who works for five years before accessing non-contributory transfers is being exploited or fairly insured. This project fills that gap by treating the temporal structure of rights as the primary object of normative analysis rather than a secondary implementation detail.

  **Method and timeline**

  The method is conceptual analysis grounded in institutional design, avoiding both pure abstract theory and empirical fiscal modeling. Pure theory risks irrelevance to actual welfare architectures; empirical modeling risks obscuring normative principles behind contested data. This project bridges the gap by constructing a normative framework for evaluating vesting schedules. The goal is not to calculate fiscal balances but to determine the moral conditions under which such calculations justify rights differentiation.

  Quarter One involves taxonomic work. I will unbundle membership into distinct rights clusters: residence, labor access, contributory insurance, and non-contributory transfers. I will map existing visa categories onto these clusters to identify where current regimes already employ implicit vesting. This establishes the institutional reality against which the normative theory is tested.

  Quarter Two focuses on the fiscal-moral link. I will analyze the principle of reciprocity to determine if delayed vesting satisfies contributory fairness without requiring border closure. This involves constructing thought experiments comparing closed-border regimes against open-entry/delayed-vesting regimes to test moral equivalence. I will examine whether lifecycle contribution matters more than point-of-entry status. In this quarter, I will engage with contractualist accounts of fairness to see if delayed vesting can be justified to those subject to it.

  Quarter Three addresses the integrationist objection. I will develop criteria for distinguishing probation from caste, drawing on theories of social status and recognition. This quarter determines the maximum permissible duration of tiered status before it undermines democratic equality. I will assess whether temporary inequality inevitably hardens into permanent stratification. I will utilize republican non-domination theory to assess whether probationary status renders migrants vulnerable to arbitrary power.

  Quarter Four is synthesis and drafting. I will integrate the fiscal reciprocity analysis with the status objection to produce a conditional verdict on the permissibility of differentiated vesting.

  This method is chosen because the core question is structural, not numerical. Whether a five-year wait is unjust does not depend on the exact fiscal savings it generates, but on whether the wait violates obligations owed to residents. Conceptual engineering is required to create the vocabulary for this evaluation, which existing literature lacks. By treating timing as a policy variable, I can isolate the moral weight of duration from the moral weight of exclusion. This allows for a determinate answer on permissibility even without settling empirical disputes about migrant net contributions.

  **Results and failure conditions**

  Possible conclusions are threefold. First, differentiated vesting is permissible provided duration is limited and rights are progressive. Second, it is impermissible because any tiering violates equal moral status regardless of fiscal benefit. Third, it is permissible only with compensatory measures, such as accelerated paths to full membership or enhanced labor protections during the probationary period.

  Considerations deciding between these include the weight of reciprocity versus the weight of status. If fiscal sustainability is a precondition for justice, vesting may be required. If equal status is lexically prior, vesting is forbidden. The deciding factor will be whether the fiscal benefit is substantial enough to outweigh the moral cost of temporary inequality. I will assess whether the "fiscal defensibility" of open borders relies on this mechanism.

  Failure conditions are specific. The project fails if the distinction between probation and caste collapses conceptually, meaning any tiering is indistinguishable from oppression. It also fails if the fiscal argument proves incoherent—for instance, if delayed vesting cannot theoretically achieve sustainability regardless of timing. Finally, it fails if the trade-off is illusory; if open borders with immediate vesting are fiscally sustainable, the problem dissolves.

  Success requires demonstrating that timing is a morally salient variable independent of exclusion. If the analysis shows that timing is merely exclusion by another name, the project concludes negatively, which is still a determinate answer. However, the project fails if it cannot articulate the conditions under which a positive answer would hold.

  **Scope and risks**

  Scope risks include drifting into empirical economics or comparative law. If the project expands to validate fiscal claims quantitatively, it becomes two projects. I will cut empirical modeling entirely, relying on philosophical plausibility rather than actuarial proof. Similarly, I will avoid detailed case studies of specific national laws, keeping the analysis comparative and theoretical.

  Another risk is conflating immigration ethics with general welfare theory. I must ensure the focus remains on the migrant-specific vesting schedule. If the analysis of welfare theory becomes too broad, I will restrict it to the specific mechanisms of contributory versus non-contributory transfers relevant to migration.

  The primary deliverable is the normative framework. If time constrains, I will prioritize the reciprocity analysis over the integrationist objection, as the fiscal-moral link is the novel contribution.
