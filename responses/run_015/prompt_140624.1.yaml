  # Joint Statement of Adversarial Collaboration: Pluralist Cooperation Agreements

  ## Section 1: Agreed Claims

  1.  **Definition:** A pluralist cooperation agreement is a conditional commitment where Agent A supports Project B only if Agent B supports Project A, despite conflicting value judgments regarding the projects' intrinsic worth.
  2.  **Disagreement:** Such agreements presuppose genuine, unresolved disagreement about first-order values; they are not mechanisms for resolving value disputes but for navigating them.
  3.  **Efficiency Condition:** Cooperationists assert that where marginal costs diverge sharply, refusing trade wastes potential outcome value; Non-Alienationists agree this holds *only* if agency integrity is not compromised.
  4.  **Integrity Condition:** Non-Alienationists assert that acting against one's all-things-considered judgment degrades moral disposition; Cooperationists agree this holds *only* if the action is not re-described as fulfilling a higher-order reciprocal duty.
  5.  **Non-Convexity Risk:** Both sides agree that in threshold-shaped payoff scenarios (e.g., vaccination coverage), fragmented trade commitments can leave both parties below efficacy thresholds, yielding worse outcomes than specialized non-trade.
  6.  **Conviction Signal:** Both sides agree that willingness to trade signals information about an agent's conviction strength; the dispute lies in whether this signal indicates healthy flexibility or dangerous weak commitment.
  7.  **Erosion Metric:** Both sides agree that long-term trading relationships (e.g., food-system vs. faith-based coalitions) must monitor internal recruitment and retention shifts as a proxy for motivational erosion.
  8.  **Bystander Constraint:** Both sides agree that costs imposed on third-party constituencies who reject both value systems count as negative externalities that must be weighed against bilateral gains.
  9.  **Epistemic Limit:** Both sides agree that agents operate with systematically biased estimates of the counterparty's value function; certainty about the counterparty's gain is unwarranted.
  10. **Falsification:** Cooperationists would concede error if trade consistently correlates with long-term disposition degradation; Non-Alienationists would concede error if trade consistently yields net outcome gains without measurable integrity loss.

  ## Section 2: Cruxes and Predictions

  | Crux | Neutral Statement | Cooperationist Formulation | Non-Alienationist Formulation | Shared Case / Argument | Coop Prediction | Non-Alienationist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Commensurability** | Does trade require a common metric of value? | Trade requires only comparative cost advantage (cheap-for-you/dear-for-me), not shared value units. | Trade implicitly imposes a false common metric, treating incommensurable values as fungible holdings. | **Non-Convexity Case:** Threshold failures suggest values cannot be partially swapped without losing essence. | Specialization clears thresholds; values remain distinct but coordinated. | Partial support dilutes value; thresholds reveal incompatibility. |
  | **2. Normative Source** | What force does the agreement exert? | The agreement generates genuine internal reasons (promissory/reciprocal) that enter deliberation. | The agreement imposes an external price; acting on it overrides rather than enters moral deliberation. | **Reason vs. Price:** Deliberative records showing how agents justify the traded action. | Agents cite reciprocity as a primary moral reason in internal memos. | Agents cite reciprocity as an external constraint overriding moral reason. |
  | **3. Dispositional Impact** | Does trade alter moral character? | Dispositions are tools; using them strategically enhances agency without degradation. | Dispositions are constitutive; using them as currency corrupts the judge and agent. | **Erosion Case:** Ten-year coalition swap showing shifts in recruitment/retention. | Retention stays stable; members view flexibility as strategic virtue. | Retention drops; members view flexibility as compromise of core identity. |
  | **4. Epistemic Confidence** | How well do we know the other's values? | Biases are correctable; sufficient dialogue allows reliable estimation of counterparty gain. | Biases are structural; we cannot know if the counterparty truly values our concession as intended. | **Bystander Case:** Funders shifting costs onto a rejecting constituency. | Constituency costs are outweighed by verified bilateral gains. | Constituency costs reveal fundamental illegitimacy of the valuation. |
  | **5. Selection Effects** | Does trade attract specific agent types? | Trade selects for sophisticated agents capable of managing pluralist complexity. | Trade selects for low-conviction agents willing to liquidate principles for leverage. | **Revealed-Conviction Case:** Anonymous matching showing appetite for trade. | High-conviction agents trade most effectively due to clarity. | High-conviction agents refuse trade; pool fills with weak compromisers. |

  ## Section 3: Analysis of Disagreement

  **Verbal vs. Genuine Disputes**
  A significant portion of the conflict is verbal, centering on the definition of "acting against judgment." Cooperationists define this as acting against a *prima facie* preference for the sake of a higher-order reciprocal duty; Non-Alienationists define it as acting against an *all-things-considered* judgment. If both sides accept that the reciprocal duty can become part of the all-things-considered judgment, the "corruption" claim loses force. Similarly, the dispute over whether integrity is a "value" (to be maximized) or a "side constraint" (to be maintained) is stipulative. We recommend adopting the neutral term "dispositional stability" for empirical monitoring.

  **Genuine Disputes**
  The empirical disagreements are genuine and settle the matter. Specifically: (1) The magnitude of dispositional erosion over time (Claim 7); (2) The accuracy of cross-value estimation (Claim 9); and (3) The net impact on third-party constituencies (Claim 8). These are not philosophical but measurable.

  **Settling Conditions**
  Both sides would accept a longitudinal study of participating organizations as settling evidence. If data shows that organizations engaging in trade maintain recruitment stability and achieve higher threshold clearance than non-trading controls, Cooperationists are vindicated. If data shows recruitment shifts toward "flexibility" over "mission" and increased bystander harm, Non-Alienationists are vindicated.

  **Invented Distinctions**
  To make Claim 4 signable, I introduced the distinction between "re-describing action" (Coop) and "overriding judgment" (NA). This allows Cooperationists to argue they are not acting against judgment but expanding it, while Non-Alienationists maintain that the original judgment remains the moral baseline. To make Claim 6 signable, I separated "signal of flexibility" from "signal of weakness," allowing both sides to agree on the signaling mechanism while disagreeing on its valuation.

  **Confused Cruxes**
  I rejected the user's suggested crux regarding "Reason vs. Price" as a standalone philosophical binary. In practice, a price *becomes* a reason if accepted. I reframed it in Table Row 2 as a question of *deliberative justification* (internal vs. external), which is empirically observable via meeting minutes and internal memos, rather than a metaphysical dispute about normativity. This ensures the document remains actionable for the working group.
