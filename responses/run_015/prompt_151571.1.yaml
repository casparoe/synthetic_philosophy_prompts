answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name].

  Looking around this room, I realize I'm standing at the intersection of two very different worlds. Half of you know my mom as the Director of the Eastside Center. You know the budgets, the county protocols, the clinical outcomes. The other half of you are family and neighbors. You mostly know her as the woman who missed a lot of Sunday dinners, came home exhausted, and usually smelled like industrial bleach and stale coffee.

  I want to talk about that smell for a second. Because I think it explains everything.

  To the family: That bleach smell wasn't just cleaning. It was her trying to wipe away the mess of people's worst days. And the coffee? That was fuel for the fights she had to keep having.

  Because here's the thing about my mom's work. If you ask most people what mental health care is about, they'll say it's about "giving people choices" or "empowerment." And if I say that up here, the clinicians in the room are going to roll their eyes. Because you know that's not what happens in a crisis.

  When someone is in acute crisis, they don't want freedom. Freedom is heavy. Freedom is hard. When your world is falling apart, you don't want a menu of options. You want someone to tell you where to sleep, when to eat, and that you're going to be safe.

  Mom knew this. She used to talk about this old story, the Grand Inquisitor. I'm not going to get into the book stuff, but the idea is this: People are scared. They will happily trade their freedom for bread and safety. They want structure. They want a path someone else has cleared.

  The Inquisitor in the story says, "Fine, I'll give them safety, but I'll take their freedom. I'll lock them up to keep them safe."

  Mom spent 32 years trying to prove you could have the first part without the second.

  She believed people in crisis needed that tight, almost paternalistic structure. They needed to be told what to do. But she refused to take away their right to walk away. She wanted to offer the Inquisitor's kindness without the Inquisitor's prison.

  Now, to the family side of the room: This is why she turned down so much funding. This is why she came home arguing with county officials. There were grants available—lots of them—that would have made her life easier. But they came with strings. Mandatory treatment. Locked doors. Coercion.

  She said no. Every time.

  She'd tell me, "If I lock the door, I'm not helping them. I'm just managing them. If I keep the door open, but make the inside so safe, so structured, that they *choose* to stay? That's treatment."

  To the clinicians and staff here: You know how hard that line is to walk. You know the tension of holding space for someone who wants you to take control, without actually taking control. You know the pressure she put on herself to keep that door unlocked, even when it was scary. Even when it was easier not to.

  She built a place where the structure was so strong, the routine so reliable, that people didn't need to be forced to follow it. They wanted it. They needed it. And because she refused to lock them in, when they stayed, it was because they were finally ready to heal.

  That's why she's tired. That's why the bleach smell never really went away. She was constantly scrubbing away the easy answers to make room for the hard right ones.

  She didn't save everyone. She'd be the first to tell you that. But for thirty-two years, she offered people a narrow path without building a wall around it. She gave them relief without taking their dignity.

  So, if you could raise your glasses.

  To the clinicians: Thank you for walking that tightrope with her.
  To the family: Thank you for waiting up for her, even when she came home late and smelled like a hospital.
  And to Mom: Thank you for proving that you can give people safety without taking away their freedom.

  Cheers.
