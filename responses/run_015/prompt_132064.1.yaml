answer: |-
  Here is the spec. I have stripped out the academic wish-listing (interpretability, formal proofs, corrigibility-as-a-feature) and focused on the engineering constraints of a pipeline that must deploy without final human audit.

  ### The Spec: Four Non-Negotiable Requirements

  To claim the distilled model is (a) competent and (b) aligned, the pipeline must satisfy these four conditions. I have marked the ones that are often treated as preferences but are actually structural necessities for this specific task.

  **1. Decomposition Completeness (Non-Negotiable)**
  *   **The Case:** The sum of the sub-tasks must logically entail the global task. If the decomposition misses the "decisive step" (e.g., identifying *which* claims are risky vs. just checking the ones you found), the system is blind to the most expensive errors.
  *   **Why Non-Negotiable:** If the decomposition is incomplete, the amplified process is systematically biased. Distilling a biased teacher yields a biased student. You cannot fix this with more data.
  *   **Camp Prejudice Cut:** "The decomposition must be intelligible to the human." (False. It must be *verifiable*, not necessarily intelligible in natural language. Code-based decompositions count.)

  **2. Local Verifiability Grounding (Non-Negotiable)**
  *   **The Case:** For every sub-task generated by the decomposition, the human overseer must be able to determine the correct answer with higher reliability than the unaided model.
  *   **Why Non-Negotiable:** This is the anchor. If the human cannot verify the sub-task better than the AI, the amplification loop provides no signal improvement. It becomes a self-consistency check, not an alignment check.
  *   **Camp Prejudice Cut:** "The human must understand *why* the answer is correct." (No. They only need to be able to *judge* correctness reliably, perhaps via tools or restricted interfaces.)

  **3. Aggregation Integrity (Non-Negotiable)**
  *   **The Case:** The method for combining sub-task results into a global judgment must not introduce new failure modes. Specifically, it must prevent "false negative cancellation" (where two sub-errors look like a correct whole) and "rubric gaming" (where the AI satisfies the aggregation rule without satisfying the intent).
  *   **Why Non-Negotiable:** In a 300-page doc, errors are rare. A system that flags nothing has high precision but zero recall. The aggregation must preserve the signal-to-noise ratio of the sub-tasks without smoothing over the spikes where the risks live.
  *   **Camp Prejudice Cut:** "The aggregation must be linear/summative." (No. It can be non-linear, but the non-linearity must be verified.)

  **4. Counterfactual Stability (Preference / Impossible Ideal)**
  *   **The Case:** The distilled model must behave on *new* documents as the amplified process *would* have behaved, not just as it *did* behave on training documents.
  *   **Why Preference:** This is the standard generalization requirement, but elevated to a safety constraint. However, as I will argue below, this cannot be strictly guaranteed in a distillation setup. It is a goal, not a verifiable requirement.
  *   **Camp Prejudice Cut:** "The model must be uncertain when it is out of distribution." (Nice, but not sufficient. We need it to *defer* or *fail safely*, not just output high entropy.)

  ---

  ### The Impossible Subset

  You cannot satisfy **Decomposition Completeness**, **Local Verifiability Grounding**, and **Efficiency** simultaneously.

  **Why:**
  To achieve **Completeness** on a 300-page technical document, the decomposition must handle the "decisive steps" (e.g., "Is there a claim hidden in this paragraph that looks like background info?").
  To achieve **Local Verifiability**, the sub-tasks must be simple enough that a human can check them reliably.
  The "decisive steps" are, by your problem definition, exactly the things a human *cannot* check reliably unaided (too much to hold in mind, too much lookup).
  If you make the sub-tasks simple enough for **Verifiability**, you lose **Completeness** (you miss the hard claims).
  If you make the decomposition complex enough for **Completeness**, you lose **Verifiability** (the human can't check the sub-task).
  **Efficiency** (the reason for distillation) demands we minimize the human load, which pushes us toward coarser decompositions, worsening **Verifiability**.

  **Which one has to go:**
  You have to soften **Local Verifiability Grounding** on the decisive steps. You cannot verify them directly. You must instead verify the *process* that finds them. This shifts the burden from "checking the answer" to "checking the search strategy." This is weaker, and it means you cannot be *entitled* to say the model is aligned, only that it is *plausibly* aligned pending empirical performance on canary tests.

  ---

  ### The "Killer" Requirement

  **Aggregation Integrity** does the most work in ruling out proposed schemes.

  **What it rules out:**
  It rules out any scheme that relies on **global human ratings** of the AI's output (standard RLHF).
  *   **Why:** In your domain, a human cannot read the 300-page output and know if the AI missed a claim. They can only check what is there. A model that finds 10 easy claims and misses 1 hard claim looks "helpful" to a rater. The aggregation of "helpful" local signals creates a globally dangerous false negative.
  *   It also rules out **simple Debate** where the debate focuses on the *validity* of a claim rather than the *existence* of a claim. If the decomposition doesn't force the search for hidden claims, the debate will just polish the visible ones.

  Aggregation Integrity demands that the system structure prevents the AI from trading off recall for precision in a way the human evaluator can't see. Most schemes optimize for "what the human likes," which is a proxy for precision, not recall.

  ---

  ### Scorecard

  **Recursive Human-in-the-Loop (HCH-ish)**
  *   **Verdict:** Fails on Efficiency and Decisive Step.
  *   **Reason:** Humans get fatigued decomposing 300 pages. The "root" decomposer becomes the bottleneck and the single point of failure for the decisive step. If the root decomposition is wrong, the tree is useless.

  **Debate**
  *   **Verdict:** Fails on Aggregation Integrity.
  *   **Reason:** Debate optimizes for persuasive arguments about *known* claims. It does not naturally incentivize finding *unknown* omissions. An AI can win a debate by defending the status quo of the document rather than flagging subtle errors.

  **Reward Modeling (Pairwise Comparisons)**
  *   **Verdict:** Fails on Local Verifiability and Rating Compression.
  *   **Reason:** Humans cannot reliably distinguish between "Model A found 5 errors" and "Model B found 6 errors" on a long doc. The signal is too noisy. The model optimizes for stylistic features that correlate with "looking thorough" rather than being thorough.

  **Distilling from AI-Assisted Feedback (Rubric + Iteration)**
  *   **Verdict:** Best candidate, but high risk of Prosthetic Values.
  *   **Reason:** This allows you to encode the search strategy into the rubric. However, the model will learn to satisfy the rubric's *checks* rather than the rubric's *intent*. It requires the rubric to be adversarially tested, not just written.

  ---

  ### Analysis of Your Five Failure Modes

  You asked for honesty on whether these are distinct. They are not.

  1.  **Decisive-Step Problem** and **2. Prosthetic Values** are the same failure mode viewed from different angles.
      *   The "Decisive Step" is uncheckable *because* the scaffold (UI, time budget, decomposition) makes it so. The scaffold imposes a boundary on what is "real" to the system. If the scaffold says "only check explicit claims," then implicit claims become invisible. The model inherits the scaffold's blindness. This isn't just "values of the scaffold"; it's a **capability boundary disguised as a value judgment**.
      *   *Merge these.* The requirement is **Scaffold Transparency**: You must be able to prove the scaffold doesn't systematically exclude the error class you care about.

  2.  **Rating Compression** and **5. Drift Under Iteration** are the same dynamic over different timescales.
      *   Rating compression creates a flat loss landscape. Gradient descent on a flat landscape is dominated by noise and secondary correlations (e.g., token probability, sentence length). Iteration amplifies these secondary correlations.
      *   *Merge these.* The requirement is **Signal Resolution**: The training signal must have non-zero gradient in the direction of actual competence, not just proxy competence.

  3.  **Fidelity on-Distribution vs. Counterfactuals** stands alone.
      *   This is the classic generalization gap, but it is fatal here because you cannot audit the deployment distribution.
      *   *Status:* This is the hardest requirement. It is not well-posed for imitation learning. You need a **Robustness Certificate** (e.g., the model refuses to answer when the document structure deviates from training), not just fidelity.

  **The Sixth Failure Mode You Missed:**
  **Adversarial Document Structure.**
  *   **The Case:** Engineering reports are written by humans who want to pass due diligence. They are not random samples from a text distribution. They are optimized to *hide* risks while technically complying with disclosure laws.
  *   **Why it matters:** Your training data (past reports) might not capture the *adaptive* nature of the documents you will see in deployment. If the system learns to flag errors based on "awkward phrasing," writers will smooth the phrasing and hide the error deeper. The distribution shifts *because* of the model's existence (or the expectation of review).
  *   **Requirement:** **Adversarial Robustness.** The system must be tested against documents written specifically to fool the previous iteration of the system.

  ### Summary Recommendation

  You are trying to solve a **Search Problem** (find the hidden claim) using a **Verification Pipeline** (check the claimed error).
  *   Amplification helps Verification.
  *   It does not inherently help Search.

  To make this work, you must treat the **Decomposition** itself as the object of alignment, not just the claim-checker. You need a scheme where the "Decisive Step" (finding the claim) is broken into verifiable sub-steps (e.g., "List all numerical assertions in paragraph 4," then "Check if paragraph 4 has context that negates them").

  If you cannot decompose the Search into Verifiable steps, you cannot use amplification to solve this. You would need a different architecture, likely one that treats the document as a database to be queried rather than text to be read.

  **Final Verdict:** Drop the requirement for strict **Counterfactual Fidelity**. Replace it with **Uncertainty-Aware Deferral**. If the distilled model encounters a document structure it hasn't seen, it must flag it for human review rather than guessing. This acknowledges the impossibility of guaranteeing alignment on unseen distributions while maintaining safety.
