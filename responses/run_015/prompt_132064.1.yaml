prompt: |-
  you're a professional philosopher who's also spent a couple of years in an alignment lab — take this seriously, brainstorm a candidate list of requirements first and cut the ones that are just one camp's prejudices before you commit to anything.

  Setup. We're building a pipeline, not writing a paper. The domain is long technical document review: a system that goes through a 300-page engineering due-diligence report and flags claims that aren't actually supported by the sections they cite. No single human on the team can do that unaided — too much to hold in mind, too much domain-specific lookup. But a human can, given one claim and the section it cites, judge pretty well whether the claim follows. So the plan is the usual recursive thing: decompose the task into pieces a human can grade, have humans grade amplified versions of themselves doing the pieces, distill the result into a fast model, repeat.

  What I want from you is the spec, not a survey. What does an amplification-and-distillation scheme have to deliver for me to be entitled to say: the distilled model is (a) genuinely better at the unaided task than any human who supervised it, and (b) still pointed at what those humans actually wanted? Adequacy-for-what is fixed: I want to deploy the distilled model on exactly this kind of task, where a miss is expensive but not catastrophic, and where I cannot check the final model's outputs myself — that's the whole point of the exercise, so don't give me a list that secretly assumes I can audit the result.

  For each requirement, give me the concrete case or consideration that makes it a requirement, and mark it non-negotiable versus a preference of some camp. Then the parts I care most about:

  - which subset of the requirements you think can't all be satisfied at once, and why. If the list is impossible, that's the interesting answer, so don't quietly drop a requirement to make it come out consistent — say which one has to go.
  - which single requirement does the most work in ruling out the schemes people actually propose, and what it rules out.
  - a very short scorecard afterwards — a line or two each, that's all — for: recursive human-in-the-loop amplification (the HCH-ish thing), debate, reward modeling from pairwise human comparisons, and distilling from AI-assisted feedback against a written rubric, then iterating. No citations, no reading list, no who-argued-what; I've read the blog posts and I want the criteria rather than the discourse.

  Please make sure the list actually deals with these five, because they're the failure modes I keep half-thinking about and can't get straight:

  1. the decisive-step problem — in most decompositions there's one step that carries the difficulty: deciding how to carve the document up, deciding which claim is worth checking, the judgment that a cited section is the wrong one to look at. That step is usually exactly the one the human overseer can't grade, so amplification reliably supervises the checkable 90% and leaves the decisive 10% unsupervised. Is that a desideratum, or is it a fact about decomposition that any adequate scheme has to route around?
  2. prosthetic values — when we amplify, the thing producing the behavior is the human plus scaffolding: the decomposition scheme, the time budget, the UI, the fact that only checkable-looking output gets approved. Some of the dispositions we then bake into the model are values of the scaffold, not of anyone. What does a scheme have to do to tell those apart, and is that even well posed?
  3. rating compression — the rater can only see some of the variation in quality, so good and excellent look identical to them and the training signal is flat in the region that matters; distillation then optimizes hard for the visible correlates. What should we require here?
  4. fidelity on-distribution versus fidelity of counterfactuals — the cheap distilled model should agree with the slow amplified procedure on the training distribution, but what I really want is that it would agree on the documents it will actually see in deployment, including the ones where the procedure would have gone a different way. Can that be a requirement, given that distillation is just imitation learning on a finite sample?
  5. drift under iteration — each round selects for what's easy to rate and what's easy to learn by gradient descent, and repeated rounds could walk to a stable but degenerate fixed point. Is stability even the right thing to ask for, or is it anti-correlated with competence growth?

  And tell me honestly whether any of my five are the same requirement wearing different hats, whether I've smuggled in something that isn't a desideratum at all, and whether there's a sixth failure mode I'm missing that's in the same family.
