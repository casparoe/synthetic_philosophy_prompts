answer: |-
  **Required Screening List**
  To sustain this reading without reducing the film to plot, screen only these four sequences:
  1.  **"News on the March" (The Newsreel):** The opening summation of Kane's life.
  2.  **The Thatcher Library:** Thompson reading the memoirs; the flashback to the review of Susan's opera.
  3.  **The Xanadu Warehouse:** Thompson and Bernstein walking through the crates.
  4.  **The Final Fireplace:** The burning of the sled; Thompson's exit.

  ***

  ### 1. A Taxonomy of Silences
  Your four categories map onto the film with surprising precision, but the film complicates the movement between them.

  *   **The Record Never Generated:** Kane's interior life regarding his mother. There is no document, no testimony, and no memory that captures the moment of separation accurately because Kane himself repressed it. It is a silence of psychic exclusion, not archival loss.
  *   **The Record Generated and Destroyed:** This is the most literal category. The sled ("Rosebud") exists, is identified by the camera, and is burned in the final seconds. It is a record destroyed *after* the inquiry concludes but *before* the researcher accesses it.
  *   **The Record Survives but is Unconsulted:** The crates in the Xanadu warehouse. Thompson walks past them. They are cataloged (presumably) by the staff, but they are not recognized by the researcher as evidentiary. They are treated as debris, not data.
  *   **The Record Survives, is Consulted, but is Illegible:** The testimonies of Bernstein, Leland, and Susan. Thompson reads/hears them all. They are present. They contradict. They do not yield the "key." The text is legible linguistically but hermeneutically opaque.

  **The Fifth Kind:** The film supplies a fifth category: **The Record that is Legible Only in the Moment of Destruction.** The sled is legible to the audience (we see the name) and was legible to Kane (he died speaking it), but it becomes legible to the archive only as it ceases to exist. This suggests a category of *retrospective legibility*: meaning that attaches to a record only when it is removed from circulation.

  **Movement Between Categories:** The film shows items moving. The memoirs of Thatcher start as "Generated/Consulted" but become "Illegible" as Thompson realizes Thatcher's bias. The sled moves from "Unconsulted" (in the crate) to "Destroyed." The taxonomy is not static; the status of a record depends on the position of the researcher in time.

  ### 2. Gap in the Archive vs. Blindness in the Archivist
  This is the film's strongest contribution to your seminar. The literature on archives often fetishizes the *gap* (the burned document, the excluded voice). *Citizen Kane* argues that the *surplus* is equally silencing.

  **Survival without Legibility is a Distinct Category.** It is not merely your fourth kind (illegible text) dramatised. In the fourth kind, the researcher engages with the document and fails to extract meaning. In the warehouse scene, Thompson does not engage. He is defeated by volume. He stands amidst the answer (the crate containing the sled) and declares the inquiry failed.

  This cuts against the instinct to locate archival power solely in suppression. Here, power is located in **drowning**. Kane's power allowed him to save *everything*. Xanadu is not a vault; it is a landfill. The archival power exercised here is the power to render the significant indistinguishable from the trivial by preserving both with equal indifference. The "blindness" is not a failure of the archivist's eyes, but a structural condition of the archive itself: when everything is kept, nothing is evidence. The film suggests that preservation without curation is a form of silence.

  ### 3. The Document with False Provenance
  The scene where Kane finishes the negative review of Susan's opera and forces it into publication under Leland's name is a case study in **archival forgery as self-defense.**

  This is closer to destruction than to bias, but it is more insidious. Bias admits a perspective; forgery mimics objectivity. The document enters the archive with a stated author (Leland) who did not write it, and an actual author (Kane) who is not recorded.

  **What this does to archival reading:** It severs the link between *intent* and *trace*. A historian reading that review in 50 years would deduce Leland's hostility toward Susan. They would be factually correct about the text's existence but fundamentally wrong about the human relationship. The film means for us to notice that provenance is irretrievable even when the source is intact. It suggests that the archive does not preserve truth; it preserves *transactions*. The transaction recorded is "Leland published this," not "Kane wrote this." The film argues that a record can be authentic (it really was published) and yet false (it misrepresents the agency). This corrupts the chain of custody permanently. You cannot "read against the grain" to find Kane's authorship because the grain itself was manufactured by Kane.

  ### 4. The Inversion: Power Archiving Itself
  Kane is the uncommon case: the subject is the architect of the archive. He built Xanadu; he owned the newspapers that printed the records; he commissioned the statues.

  **Does volume buy legibility?** The film's verdict is a definitive no. Volume buys *presence*, but not *intelligibility*. Xanadu is a monument to misinterpretation. The more Kane recorded of himself, the more he obscured the core of his identity.

  **What would have had to be added?** Concretely, a diary entry from 1871 explaining the sled. But the film's deeper answer is that *nothing* could have been added. The inquiry fails not because of missing data, but because the data requested (a single word explaining a life) is a category error. The "significance" of Rosebud was not information; it was an affect. It was a feeling attached to an object. Kane never externalized that feeling into a record. He archived the object but not the emotion. The film suggests that self-archiving guarantees misinterpretation because the self cannot objectively catalog its own trauma. By turning his life into a dossier, Kane turned himself into a subject to be investigated rather than a human to be known. The archive captured the *public* Kane perfectly; that is precisely why it failed to capture the *man*.

  ### 5. The Constraint of Format
  The inquiry is commissioned by a newsreel (*March of Time*). The newsreel format demands a narrative arc, a villain, a hero, and a "key."

  **Failure of Archive or Failure of Question?** The film distinguishes these cleanly in Thompson's final line: "I don't think any word can explain a man's life."
  *   **Failure of the Archive:** If the sled had been found and read, the archive would have yielded the word.
  *   **Failure of the Question:** Even if the sled were found, would the word "Rosebud" explain the life? No. It would only name the loss.

  The film argues the failure is primarily **epistemological**, located in the question put to the archive. The newsreel format requires reduction (a "key"). The archive (the sum of memories and objects) provides multiplicity. Thompson gives up not because he lacks evidence, but because the evidence contradicts the format. He cannot put "contradiction" into a newsreel. The film teaches that the archive will always answer the question asked, not the question needed. If you ask the archive for a "key," it will sell you a slogan, even if it has to burn the truth to do it.

  ***

  ### The Two Checks

  **1. Where does this reading overreach?**
  Be careful with the character of **Raymond (the Butler)**. It is tempting to cast him as the "ideal archivist"—the one who knows the secret (he saw the sled thrown away) but remains silent. Do not press this too hard. Raymond is not an archivist; he is a servant. His silence is not methodological; it is transactional (he wants a tip). If you frame him as a guardian of the archive, you romanticize his indifference. He doesn't withhold the truth to protect the sanctity of the record; he withholds it because Thompson didn't pay enough.
  Also, avoid over-reading the **Snow Globe**. It is a symbol, not a document. It triggers the memory, but it is not part of the dossier Thompson assembles. Treating it as a "record" conflates cinematic symbolism with archival evidence.

  **2. What does the film add to the philosophical discussion?**
  Argument alone describes silence as an absence. Film shows silence as a **presence**.
  *   **Duration:** The time it takes to walk through the warehouse creates a physical sensation of the "surplus" problem. You feel the exhaustion of the search in a way a text description of "a large warehouse" cannot convey.
  *   **Visual Weight:** The burning sled is not just a metaphor for lost history; it is a visual of destruction happening *now*. Philosophy discusses the "loss of the past." The film shows the *active destruction of the present record*.
  *   **The Echo Chamber:** The acoustics of Xanadu. When characters speak in the great halls, their voices bounce back. This sonic texture demonstrates the "blindness" of the archive: the record talks back to you, but it is only your own voice returning.

  The film adds the **affect of futility**. You can write an essay about how the archive is incomplete. *Citizen Kane* makes you feel the fatigue of the researcher who has everything and still knows nothing. That is something argument cannot do.
