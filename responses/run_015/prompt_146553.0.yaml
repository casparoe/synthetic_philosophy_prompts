      *   *Key Insight:* To define a truth-value gap, you need boundaries. What bounds the gap? The set of possible futures. Therefore, a semantic gap implies a modal structure.
      *   *Disagreement:* Branching handles the "assertion" better. We assert relative to expected branches.
      *   *Action:* Both support action, but Branching integrates better with decision theory (expected utility over branches). Aristotle integrates with virtue ethics (shaping the real).

