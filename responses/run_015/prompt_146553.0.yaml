      *   **Position B: Aristotle (Semantic/Supervaluationist Reading)**
          *   *Core:* Statements lack truth values because the *context of evaluation* is incomplete.
          *   *Logic:* Truth-value gaps based on precision/completion. Supertruth = true on all completions.
          *   *Metaphysics:* Agnostic or compatible with openness, but focuses on language/logic limits.
          *   *Truth:* Defined over a set of histories. If $p$ is true on some, false on others $\rightarrow$ indeterminate.

      *   **Position C: Branching-Time (Ockhamist/Peircean variants)**
          *   *Core:* The future is a tree of real possibilities.
          *   *Logic:* Truth is relative to a moment *and* a history (branch).
