  **UNIVERSITY INSTITUTIONAL REVIEW BOARD | MEMORANDUM**

  **TO:** Dr. Aris Thorne, Department of Genetic Ethics
  **FROM:** Committee 4-B (Bioengineering and Germline Interventions)
  **DATE:** October 24, 2023
  **SUBJECT:** IRB Protocol Review #2024-AX (Project Hedone Zero)

  **1. Project Overview**
  Principal Investigator Dr. Thorne proposes a germline editing trial intended to eliminate the neurological substrate of suffering in all subsequent descendants of edited embryos. The protocol utilizes CRISPR-Cas9 variants to downregulate nociceptors and modify limbic system responsiveness to negative stimuli. The stated objective is not the treatment of specific pathologies but the permanent abolition of the capacity for physical and psychological distress across the human species. The PI classifies this as a preventative therapeutic intervention against the condition of existence itself, arguing that suffering constitutes a systemic biological error rather than a functional feature. The trial seeks to enroll fifty embryos for initial implantation, with the expectation that the edited genotype will become dominant within four generations.

  **2. Risk-Benefit Analysis**
  The Committee acknowledges the potential for infinite reduction in negative utility. However, standard risk assessment matrices struggle to quantify the absence of harm as a benefit exceeding baseline health. Concerns were raised regarding evolutionary mismatch; specifically, whether organisms lacking distress signals can survive in unmodified environments. The PI argues that environmental modification will accompany biological editing. The Committee notes that removing the capacity for suffering may constitute a fundamental alteration of species-typical function rather than a restoration of health. If suffering is within normal statistical distribution, its removal may be classified as enhancement, subject to stricter regulatory scrutiny than therapeutic intervention. Furthermore, the asymmetry between pain and pleasure presents a calculation error; while pain is strictly negative, pleasure is not strictly necessary for survival. Eliminating the former without guaranteeing the latter may result in a neutral state indistinguishable from apathy, complicating quality-of-life metrics.

  **3. Informed Consent Protocol**
  Standard informed consent requires subject comprehension and voluntariness. As the primary subjects are unborn generations, direct consent is impossible. The PI proposes a model of proxy consent based on the presumption that no rational agent would choose suffering over non-suffering. The Committee finds this logically sound but procedurally problematic. We cannot verify the preferences of non-existent entities. Furthermore, consent typically allows for withdrawal from the study. Since germline edits are heritable, withdrawal is impossible for downstream descendants. The Committee suggests a framework of "retroactive ratification," wherein edited subjects may lodge complaints upon reaching maturity, though no mechanism for reversal exists. This creates a liability gap where the subjects cannot opt out of the condition of being unable to suffer.

  **4. Committee Deliberation**
  Deliberation focused on the therapy/enhancement distinction. If suffering is deemed a disease, abolition is therapy. If suffering is a functional feature of sentient life, abolition is enhancement. The Committee struggled to define the baseline human condition. Several members argued that anxiety and pain are protective mechanisms essential for survival. Others countered that technological mediation already buffers these risks, rendering biological pain obsolete. The tension lies in categorizing a universal philosophical shift as a routine medical procedure. Treating the abolition of suffering as a standard clinical trial implies it is optional, yet the PI's goal is universal application, rendering the concept of a control group ethically dubious. To maintain scientific validity, a control group must suffer; to maintain ethical standards, suffering must be minimized.

  **5. Final Recommendation**
  Protocol #2024-AX is Approved with Conditions. The Committee recognizes the moral urgency of reducing harm. However, to satisfy safety regulations regarding species-typical function, the editing must retain a minimum threshold of nociceptive signaling labeled as "Adaptive Discomfort." This ensures subjects retain the ability to withdraw from immediate physical hazards. Additionally, a control group of unedited humans must be maintained in a protected environment to monitor the long-term survival rates of the edited cohort. This creates a paradox wherein the success of the trial depends on the continued existence of the suffering it seeks to eradicate. The PI must submit quarterly reports on the psychological state of the control group to ensure their suffering remains within acceptable ethical limits for the sake of scientific validity.

  ***

  **Authorial Note**

  This satire targets the friction between radical transhumanist ethics and standard bureaucratic bioethics. I took liberties with the therapy/enhancement distinction, exaggerating the IRB's inability to categorize universal abolition as either curing a disease or upgrading a species. In serious scholarship, Norman Daniels argues for restoring species-typical function, while transhumanists reject this baseline as arbitrary. The memo flattens this philosophical debate into regulatory compliance. I also leaned heavily on the Non-Identity Problem (associated with Derek Parfit) regarding consent for unborn generations, treating a metaphysical puzzle as a paperwork hurdle. The "Adaptive Discomfort" condition highlights the contradiction of seeking safety through the very mechanisms (pain) the project aims to abolish, exposing the limits of institutional risk management when faced with existential modification.
