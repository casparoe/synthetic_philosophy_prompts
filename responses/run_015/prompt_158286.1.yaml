          *   Analogy: A computer. Is it electrons moving or a program running? Both, but the program level explains *why* the electrons move that way.

      *   **Body Paragraph 2: Defining "Real" Causation.**
          *   What does it mean for a symbol to push matter?
          *   It's not magic force fields. It's about *statistical constraint*.
          *   When simms lock into a simmball, their individual freedom is reduced. The cluster's trajectory becomes the marble's trajectory.
          *   The pattern *is* the cause because the pattern determines the configuration.

      *   **Body Paragraph 3: Symbols Pushing Physical Stuff.**
          *   Address the prompt's specific question: Do symbols push physical stuff?
          *   Yes. Example: The thought "I am hungry" (symbol) leads to making a sandwich (physical action).
          *   In the Careenium: A simmball representing "Hunger" triggers a chain reaction that outputs a signal.
          *   If we deny downward causation, we deny agency. We become zombies.

      *   **Body Paragraph 4: The Ant Colony Analogy (Briefly, as requested).**
          *   Don't summarize, but use it to reinforce the point.
          *   Ants (simms) don't know they are spelling "HOFFMAN." The word (simmball) has meaning that affects the reader.
