          *   Thesis: "Simmballs pushing simms" is not lazy shorthand; it is an ontological necessity. Downward causation is real because high-level patterns constrain low-level degrees of freedom. Without this, "meaning" cannot exist.

      *   **Body Paragraph 1: The Reductionist Trap.**
          *   Acknowledge the opposing view (it's just magnets).
