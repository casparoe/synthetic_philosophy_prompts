prompt: |-
  Two people at my rationality meetup got into it for like an hour last night over this and I gave up trying to referee, so I'm outsourcing. We've all read more LessWrong than is probaly good for us, which is context for why anyone thought this was worth arguing about.

  Marcus — another guy in the group, not one of the two fighting — wants to run a real-money thing at the next meetup. Everyone fills out a 200-question values-and-politics quiz; he pairs each person with their nearest neighbor in answer-space (he says the typical top match is around 85% agreement, and nobody's partner is a stranger). Then everyone plays a one-shot anonymous prisoner's dilemma against their partner, for actual cash: both cooperate, $30 each; both defect, $10 each; you defect while your partner cooperates, you get $50 and she gets $0, and vice versa. He also floated a second variant for the same 40 people: a $4000 pot that gets paid out to a single claimer, but only if exactly one person claims it by noon. Zero claimers or two or more, nobody gets anything.

  The argument was about what the correct play is and why:

  (1) Jonas: cooperate. Forget the fancy version for a second — even on the dumb, purely statistical version, with these payoffs cooperating pays iff the probability your partner makes the same move you do is above 5/7, i.e. about 71%. An 85% match clears that. But the real point is that the correlation that matters is logical, not statistical: the argument for cooperating with a copy of yourself isn't "copies tend to do the same thing," it's that there's one decision procedure being run twice. And you can't coherently hope to be the unique defector — if defecting is right for you it's right for her.

  (2) Rae: the 85% is agreement on a quiz, not probability of matching moves. You've swapped in a different quantity. What you actually need is P(she cooperates | I cooperate), and a values quiz doesn't hand you that. What drives one-shot PD cooperation is whether someone has accepted a particular argument about it, and quiz similarity barely touches that. Worse, shared exposure to an argument doesn't even reliably push people the same way: if a third of the room thinks superrationality is obviously right, a third thinks it's obviously a sucker move, and a third has never heard of it, "she reads the same blogs I do" moves P(match) almost not at all. And "you can't hope to be the unique defector" is only a coherence constraint at perfect correlation; at 85% the branch where you defect and she cooperates is a real branch, and it's the $50 branch.

  (3) Jonas: two things. The base-rate worry is weak because partners aren't random draws — nearest-neighbor matching out of 40 selects hard, so the population base rate for one-shot PDs isn't the relevant prior. And "you can't have 85% of a copy" is too quick: the threshold calculation shows superrationality doesn't need identity, it needs the match probability above 5/7, so it degrades continuously rather than dying the instant you perturb the setup. Also, look at Marcus's second variant. Nobody in that room thinks "I should be the unique claimer" is a reason to claim. The superrational move there is to randomize — press with probability 1/40 — which gives roughly a 37% chance that anybody gets anything, about $37 in expectation per person. But even that is bad next to conditioning on a public signal: everyone agrees in advance that the claimer is whoever's badge number equals tomorrow's high temperature in Central Park mod 40, and you collect the whole $4000 for sure, $100 expected each. That's the real lesson — superrationality isn't about reasoning your way into your partner's head, it's about latching onto a shared signal so you land on a correlated equilibrium. The survey-match pairing is that kind of shared signal. So cooperate.

  (4) Rae: the temperature scheme only works if it's common knowledge that everyone follows it, and with 40 semi-anonymous people in a group chat it isn't; if you think even two people will freelance, your own best move changes, and the whole thing unravels. And it's worse than that: the scheme has no teeth, because a non-selected person who spoils loses nothing personally — the pot dies for everyone else, but she was getting $0 either way. So it's only weakly incentive compatible, and if there's any chance the selected person flakes, everyone has a reason to claim as a backup and you're back to two-or-more. Anyway the variant-2 move is a different animal from variant 1. Agreeing in advance to a rule that picks one winner is a coordination device. What's at issue in the PD is which decision theory is correct. If I can bind myself to a rule in the PD case I'd just bind myself to cooperate — that's precommitment, not superrationality, so your analogy smuggles in enforcement and then credits the enforcement to the decision theory.

  (5) Jonas: fine, grant all that. You still have to pick a move, and "cooperate" is what you'd want everyone in your epistemic position to do, and not being certain she does it doesn't make defecting any less of an attempt to be the unique defector.

  (6) Rae: that last bit just restates what's under dispute. "What you'd want everyone in your position to do" is universalizability with a decision-theory costume on, and it only spits out cooperation because the game is symmetric — in a PD where the two players' payoffs differ slightly, superrationality gives no answer at all, which is odd for something claiming to be the right decision theory.

  Can you go through this move by move and tell me who's right about what — which specific points land, which are confused or question-begging, and whether the numbers anyone threw out (the 5/7, the 37%, the $100) actually check out? Also say what both of them are missing, if anything. Don't just tell me who wins overall.
reasoning: |-
  Here's a thinking process that leads to the analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** A rationality meetup (LessWrong-adjacent culture). Two people (Jonas and Rae) argued about a proposed game scenario.
      *   **The Scenario:**
          *   Variant 1: 40 people, paired by quiz similarity (85% match). One-shot Anonymous Prisoner's Dilemma (PD). Payoffs: CC=$30, DD=$10, DC=$50/0, CD=$0/50.
          *   Variant 2: 40 people. $4000 pot. Paid to *exactly one* claimer. If 0 or 2+ claim, $0 for everyone.
      *   **The Task:** Analyze the argument move-by-move (1 through 6). Determine who is right about specific points, check the math (5/7, 37%, $100), identify confusion/question-begging, and identify what both are missing. Do not just declare an overall winner.

  2.  **Analyze the Payoffs and Math (Variant 1 - PD):**
      *   Payoffs: $T=50$ (Temptation), $R=30$ (Reward), $P=10$ (Punishment), $S=0$ (Sucker).
      *   Standard PD condition: $T > R > P > S$ and $2R > T + S$.
      *   Check: $50 > 30 > 10 > 0$. $60 > 50$. It is a valid PD.
      *   Expected Utility (EU) of Cooperate ($C$): $30 \cdot P(C_{other}) + 0 \cdot P(D_{other}) = 30p$.
      *   Expected Utility (EU) of Defect ($D$): $50 \cdot P(C_{other}) + 10 \cdot P(D_{other}) = 50p + 10(1-p) = 40p + 10$.
      *   Cooperate is better if $30p > 40p + 10 \Rightarrow -10p > 10$. Wait.
      *   Let's re-calculate.
      *   $EU(C) = 30 \cdot P(C|C) + 0 \cdot P(D|C)$. (Assuming I cooperate).
      *   $EU(D) = 50 \cdot P(C|D) + 10 \cdot P(D|D)$. (Assuming I defect).
      *   Jonas's claim: "cooperating pays iff the probability your partner makes the same move you do is above 5/7".
      *   This implies a specific assumption about correlation. Jonas is arguing from a *superrational* or *acausal* perspective where $P(C_{other}|C_{me}) \approx P(D_{other}|D_{me})$. Let's call this probability of matching $p_{match}$.
      *   If I assume my decision correlates with theirs (Newcomb-like):
          *   $EU(C) = 30 \cdot p_{match} + 0 \cdot (1-p_{match}) = 30 p_{match}$.
          *   $EU(D) = 50 \cdot (1-p_{match}) + 10 \cdot p_{match} = 50 - 40 p_{match}$.
          *   Set $EU(C) > EU(D)$: $30 p_{match} > 50 - 40 p_{match} \Rightarrow 70 p_{match} > 50 \Rightarrow p_{match} > 5/7$.
      *   $5/7 \approx 0.714$.
      *   Jonas's math holds *under the assumption of acausal correlation* (i.e., treating the probability of matching as the variable).
      *   Rae's counter: Quiz match $\neq$ Move match. This is a standard causal decision theory (CDT) objection.

  3.  **Analyze Variant 2 (The $4000 Pot):**
      *   Game: Symmetric coordination/anti-coordination. Win if $N_{claim} = 1$.
      *   Jonas's claim: Randomize with $p = 1/40$.
      *   Probability exactly one person claims: $40 \cdot (1/40) \cdot (39/40)^{39}$.
      *   $(39/40)^{39} \approx (1 - 1/40)^{40 \cdot (39/40)} \approx e^{-0.975} \approx 0.377$.
      *   So probability $\approx 37\%$.
      *   Expected Value per person: $0.37 \cdot (4000 / 40) = 0.37 \cdot 100 = 37$.
      *   Jonas says: "$37 in expectation per person." Correct.
      *   Jonas's alternative: Correlated equilibrium via public signal (Temperature mod 40).
      *   If everyone follows the rule, exactly one person claims. Probability = 1.
      *   EV per person: $1/40 \cdot 4000 = 100$.
      *   Jonas says: "$100 expected each." Correct.
      *   Rae's counter: Incentive compatibility. If I am *not* the selected person, do I have an incentive to claim?
      *   If I follow the rule and I'm not selected: Payoff = 0.
      *   If I deviate and claim (assuming selected person follows rule): Payoff = 0 (because now 2 people claim).
      *   If I deviate and claim (assuming selected person *might* flake): Payoff could be 4000.
      *   Rae argues the rule has "no teeth" because a non-selected person loses nothing personally by spoiling (they get 0 either way), but they might gain if the selected person flakes. This creates a risk of "backup claiming."
      *   This is a valid game-theoretic point about subgame perfection and trembles.

  4.  **Move-by-Move Analysis:**

      *   **(1) Jonas:**
          *   *Math:* 5/7 threshold is correct for the superrational calculation.
          *   *Logic:* Argues for acausal decision theory (ADT/TDT). Claims logical correlation outweighs statistical.
          *   *Weakness:* Assumes the quiz match translates to decision-procedure match.
      *   **(2) Rae:**
          *   *Logic:* Distinguishes statistical correlation (quiz) from logical/causal correlation (decision).
          *   *Point:* "Shared exposure... doesn't reliably push people the same way." This is strong. Reading LW doesn't make you a TDT agent.
          *   *Point:* "At 85% the branch where you defect... is a real branch." This is the CDT critique of TDT.
      *   **(3) Jonas:**
          *   *Logic:* Nearest-neighbor matching increases correlation beyond base rate.
          *   *Logic:* Superrationality degrades continuously (TDT view).
          *   *Variant 2:* Uses the coordination game to argue for Schelling points/correlated equilibrium.
          *   *Math:* 37% and $100 checks out.
          *   *Weakness:* Equating a coordination device (Variant 2) with a PD (Variant 1). Variant 2 has a focal point solution; Variant 1 (PD) has a dominant strategy in CDT.
      *   **(4) Rae:**
          *   *Logic:* Common knowledge problem.
          *   *Logic:* Incentive compatibility (the "spoiler" problem). If I'm not the chosen one, I have nothing to lose by claiming, and something to gain if the chosen one fails. This undermines the correlated equilibrium.
          *   *Logic:* Distinguishes precommitment/enforcement from decision theory.
      *   **(5) Jonas:**
          *   *Logic:* Restates universalizability/Kantian imperative. "What you'd want everyone... to do."
          *   *Weakness:* Begging the question. Assumes the decision theory that validates this is the correct one.
      *   **(6) Rae:**
          *   *Logic:* Points out asymmetry problem for superrationality. If payoffs differ, "what everyone should do" is ill-defined.
          *   *Validity:* This is a known critique of naive superrationality (Hofstadter style). TDT handles asymmetry better by conditioning on the output of the algorithm, but Jonas is using more naive language here.

  5.  **Identify What's Missing:**
      *   **Mechanism Design:** Marcus (the proposer) is the real villain here. He's setting up a game where the incentives fight the social norms.
      *   **Reputation/Iterated Effects:** It's a meetup group. "One-shot" is a fiction. Defecting might get you ostracized. This dominates the decision theory debate.
      *   **Selection Bias:** The people arguing are LW readers. They *know* the arguments. This makes the quiz correlation less relevant than the "common knowledge of arguments" correlation.
      *   **The "85%" Stat:** Is it Hamming distance? Euclidean? How robust is "nearest neighbor" in 200 dimensions with 40 people? (Curse of dimensionality). With 40 people, the "nearest neighbor" might not be that close.
      *   **Variant 2 Implementation:** The temperature mod 40 rule fails if the temperature isn't known to all *before* the decision, or if the modulo mapping isn't bijective (e.g., temp is 32, 32 mod 40 = 32. What if temp is 100? 100 mod 40 = 20. Is every number 0-39 equally likely? Probably not).
      *   **Decision Theory Consensus:** There is no consensus on "Correct Decision Theory." CDT, EDT, TDT, FDT all exist. Jonas argues FDT/TDT; Rae argues CDT/EDT.

  6.  **Drafting the Response:**
      *   *Structure:* Introduction -> Math Check -> Move-by-Move Breakdown -> What Both Missed -> Conclusion.
      *   *Tone:* Analytical, neutral, slightly conversational (fitting the meetup context).
      *   *Key Insight:* The debate is fundamentally about Decision Theory (CDT vs. FDT/TDT) disguised as a game analysis.
      *   *Math Verification:* Explicitly confirm 5/7, 37%, $100.
      *   *Critique:* Highlight that Jonas conflates coordination with cooperation, and Rae underestimates the power of focal points but is right about incentive compatibility.

  7.  **Refining the "5/7" Calculation:**
      *   Jonas says: "cooperating pays iff the probability your partner makes the same move you do is above 5/7".
      *   Let $p$ be prob of matching.
      *   If I C: Partner C with prob $p$ ($30), Partner D with prob $1-p$ ($0). Exp = $30p$.
      *   If I D: Partner C with prob $1-p$ ($50), Partner D with prob $p$ ($10). Exp = $50(1-p) + 10p = 50 - 40p$.
      *   $30p > 50 - 40p \rightarrow 70p > 50 \rightarrow p > 5/7$.
      *   Yes, math is solid *given the assumption*.

  8.  **Refining Variant 2 Math:**
      *   $N=40$, $p=1/40$.
      *   $P(\text{exactly 1}) = \binom{40}{1} (1/40)^1 (39/40)^{39}$.
      *   $= 40 \cdot (1/40) \cdot (0.975)^{39}$.
      *   $= 1 \cdot 0.373...$
      *   Jonas says 37%. Correct.
      *   EV = $0.373 \cdot 4000 / 40 = 37.3$. Jonas says $37. Correct.
      *   Correlated Equilibrium: Everyone gets $100 EV. Correct.

  9.  **Refining Rae's Variant 2 Critique:**
      *   Rae says: "non-selected person who spoils loses nothing personally."
      *   If I am not selected, my payoff following rule = 0.
      *   If I claim (and selected person claims), payoff = 0.
      *   If I claim (and selected person *doesn't* claim), payoff = 4000.
      *   So claiming is a weakly dominant strategy for non-selected players if there is *any* uncertainty about the selected player's compliance.
      *   This leads to the "unraveling" Rae mentions. This is a strong point.

  10. **Refining Jonas's Variant 2 Argument:**
      *   Jonas uses Variant 2 to prove superrationality works in Variant 1.
      *   This is a category error. Variant 2 is a *coordination* game (multiple Nash equilibria, need to pick one). Variant 1 is a *social dilemma* (Defect is dominant in CDT).
      *   Superrationality helps in PD by breaking the dominance via logical correlation.
      *   Focal points help in Coordination by selecting an equilibrium.
      *   They are different mechanisms. Jonas is conflating them.

  11. **Final Review of "What They Missed":**
      *   **Social Sanctions:** It's a meetup. Real money + reputation > abstract decision theory.
      *   **The Quiz:** 200 questions, 40 people. Nearest neighbor in high dimensions with low N is noisy. 85% might be optimistic.
      *   **Marcus's Intent:** Is Marcus trying to lose money? If everyone cooperates, he pays $30 \times 20 = $600. If everyone defects, $10 \times 20 = $200. If mixed, varies. Variant 2: Max liability $4000.
      *   **Anonymity:** "Anonymous" PD in a small group is rarely truly anonymous.

  12. **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure not to take sides on "Which Decision Theory is True." Instead, evaluate the internal consistency of their arguments.
      *   Ensure the math check is prominent.
      *   Highlight the "Category Error" in Jonas's Variant 2 analogy.
      *   Highlight Rae's "Incentive Compatibility" point on Variant 2.

  13. **Final Polish:** Check tone. Keep it sharp but fair. (The prompt asks for "who's right about what," not "who wins.")

  *(Self-Correction on Variant 2 Math)*: Wait, Jonas says "$100 expected each."
  If the scheme works perfectly (exactly one claimer), the *group* gets $4000.
  There are 40 people.
  Ex-ante (before knowing who is selected), everyone has a 1/40 chance of being the claimer.
  $EV = (1/40) * 4000 = 100$.
  Yes, this is correct.

  *(Self-Correction on Rae's Variant 2 point)*: Rae says "if there's any chance the selected person flakes, everyone has a reason to claim as a backup."
  If I am not selected, and I think Selected will flake (prob $\epsilon$):
  My EV(Claim) = $\epsilon \times 4000 + (1-\epsilon) \times 0$.
  My EV(Follow Rule) = 0.
  So yes, any $\epsilon > 0$ makes Claiming strictly better for non-selected players.
  This destroys the equilibrium unless there is *external* enforcement (reputation, punishment). Rae is right about "no teeth."

