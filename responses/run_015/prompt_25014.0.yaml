prompt: |-
  I'm a novelist and I've been stuck on a scene for weeks. My protagonist is in a fire and he can either pull out his wife or two strangers he doesn't know. He grabs his wife without even thinking about it. Later, another character — the kind of guy who reads a lot of philosophy — presses him hard: "Why was her life worth more than theirs? Give me the justification." And my protagonist just says "she's my wife" and the guy says that's not a reason, that's just restating the fact you're trying to justify.

  Here's the thing: I can't tell whether I'm writing my protagonist as philosophically shallow — like he should have a better answer and I need to give him one — or whether the friend's whole demand for a justification is what's broken. I have this gut feeling that having to justify saving your wife in terms of some impartial principle is itself a kind of moral mistake, like it misses what it actually means to love someone. But I can't articulate why. Is the demand for justification here the problem? And if so, what kind of problem is it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A novelist is stuck on a specific scene.
      *   **Scenario:** Protagonist saves wife from fire over two strangers.
      *   **Conflict:** A philosophy-reading friend challenges the protagonist: "Why was her life worth more? Justify it." Protagonist says, "She's my wife." Friend says, "That's not a reason, that's restating the fact."
      *   **User's Intuition:** The user feels the *demand* for justification might be the problem, not the protagonist's lack of an answer. They suspect requiring an impartial principle to justify loving someone is a moral mistake.
      *   **Goal:** Validate/explore this intuition, articulate *why* the demand might be flawed, and provide philosophical/narrative tools to write the scene effectively.

  2.  **Initial Philosophical Assessment:**
      *   The friend is arguing from a **Utilitarian/Impartialist** framework (everyone counts equally, need a universal reason).
      *   The protagonist is acting from a **Partialist/Communitarian/Virtue Ethics** framework (special obligations exist due to relationships).
      *   The friend's claim ("That's not a reason") is philosophically contentious. Many ethicists argue relationships *are* reasons.
      *   Key philosophical concepts: Impartiality vs. Partiality, Agent-Relative Reasons, The Nature of Love, Bernard Williams' "One Thought Too Many."

  3.  **Deconstruct the Friend's Challenge:**
      *   Is the friend right? In strict utilitarianism (Peter Singer, etc.), maybe. But in most human ethical systems, no.
      *   Why is the demand problematic? It treats love like a transaction or a calculation. It demands an "external" view on an "internal" commitment.
      *   *Bernard Williams:* This is the perfect reference. The "one thought too many" example involves saving a wife vs. a stranger. Exactly this scenario.

  4.  **Formulate the Core Argument:**
      *   The protagonist isn't shallow; the friend is asking a category error.
      *   Love *creates* reasons. It doesn't need reasons external to itself.
      *   To ask for a justification is to misunderstand the nature of the relationship.

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Start by affirming the user's gut feeling. It's philosophically robust, not just an intuition.
      *   **The Philosophical Anchor (Bernard Williams):** Introduce the "One Thought Too Many" concept. This is the smoking gun for this specific scene. It gives the user concrete intellectual ammunition.
      *   **Why the Demand is Flawed (The "Category Error"):** Explain *why* the friend is wrong.
          *   Impartiality vs. Partiality.
          *   Agent-Relative Reasons (reasons that exist *because* of who I am to someone).
          *   Love as a commitment, not a calculation.
      *   **Narrative Implications:** How does this help the writing?
          *   Don't make the protagonist "lose" the argument because he can't articulate it.
          *   Make the friend's rigidity a character flaw (intellectualizing human connection).
          *   The protagonist's silence or simple answer is strength, not weakness.
      *   **Alternative Responses for the Protagonist:** Give the user options for dialogue that aren't just "She's my wife."
          *   "Because I love her." (Still might be rejected by the friend).
          *   "If I had to think about it, I wouldn't be the man she married."
          *   "There is no universe where I leave her."
      *   **The Friend's Perspective:** Acknowledge the friend isn't necessarily a villain. He represents a valid (but limited) ethical framework. This adds depth.

  6.  **Refining the Tone:**
      *   Keep it encouraging for a writer.
      *   Ensure philosophical terms are explained clearly (no jargon without definition).
      *   Focus on how this serves the *story*, not just the philosophy.

  7.  **Self-Correction/Review during drafting:**
