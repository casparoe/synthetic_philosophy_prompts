  Hey — I'm a journalist working on a piece about why academic decision theory has started to matter outside philosophy departments, and I need one section of it nailed down.

  Setup: evidential decision theory says to do whatever would be the best news if you found out you'd done it. In a small one-shot prisoner's dilemma that gets you defection. But the recent literature on evidential cooperation in large worlds argues that if a big universe contains many agents in structurally similar situations, your own choice is evidence about what they're doing — so a large enough world turns an EDT agent into a cooperator, with no causal influence anywhere in the picture. Note that the payoff argument scales with how many agents there are: even a one-in-a-billion correlation, times a trillion agents, swamps the personal cost of cooperating.

  Here's the wrinkle, call it the long-tail problem. Suppose you could run a scan and learn exactly how similar you are to everyone else, and you turn out to be a massive outlier — top 0.001% by overall dissimilarity, and apparently the only agent around who reasons about decision theory at all. Naively that should destroy the correlation your cooperation was riding on.

  Please argue that the long-tail problem does not defeat ECL: that the EDT agent's reason to cooperate survives learning she is an extreme outlier. State the objection as strongly as you can before you knock it down, and don't hedge into a both-sides shrug — I want the best pro-ECL answer you've got, definately not a fence-sitting one. Under 500 words, readable for someone who's never heard of any of this.
