  But this objection misunderstands what binds agents together. It treats similarity like a genetic test, when ECL treats it like a math problem.

  The correlation isn't about sharing your biology, history, or surface-level traits. It's about instantiating the same decision algorithm. Imagine two calculators made of different materials, owned by different people, in different galaxies. If you both type "2 + 2," both display "4." They aren't similar because they're made of the same plastic; they're similar because they obey the same logic.

  Even if you are an outlier in personality, you are not an outlier in rationality. If your decision to cooperate stems from a logical argument—that cooperation maximizes value in a large world—then any other agent capable of following that logic must arrive at the same conclusion. The link isn't "people like me cooperate." The link is "valid reasoning converges." Your choice is evidence of theirs because you both submit to the same laws of reason. You don't need to know you're being scanned; you just need to be rational.

  Furthermore, the "long tail" is misleading in a large universe. Being one in a billion sounds isolating until you realize a trillion-agent universe contains a thousand copies of you. The scan might say you're unique among your neighbors, but ECL looks at the cosmic horizon. Unless you are literally the only mind in existence, there are others running your same logical software. Your choice remains evidence of theirs, not because you are twins, but because truth is universal. The long tail doesn't cut the link; it just stretches it across the stars. Your outlier status is irrelevant; the logic holds.
