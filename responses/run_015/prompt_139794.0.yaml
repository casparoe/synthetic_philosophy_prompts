  ### Framing Considerations (Pre-Proposal Analysis)

  Before settling on the final proposal structure, I considered three ways to frame the core problem:
  1.  **The Metaphysical Framing:** Focus on whether "uncertain evidence" is a distinct ontological category or merely certain evidence about one's own mind. *Rejection:* This leads to stalemate. Sam's reductionism is unfalsifiable without a formal test.
  2.  **The Normative Framing:** Focus on whether order-dependence violates a norm of rationality (e.g., "evidence should be commutative"). *Rejection:* This is well-trodden ground. Defenses of order-dependence (e.g., changing reliability) are already standard.
  3.  **The Dynamical Framing (Selected):** Treat belief updating as a trajectory over a state space. Ask if the non-commutativity is an artifact of discrete time-steps (coarse-graining) or a property of the underlying flow. *Acceptance:* This allows for a precise mathematical test (the limit behavior) that directly addresses Sam's "bookkeeping" objection without getting bogged down in metaphysics.

  ***

  # Project Proposal: The Continuum Limit of Uncertain Evidence

  **Project Title:** Convergence and Commutativity: A Dynamical Systems Approach to Jeffrey Conditionalization

  **1. The Research Question**
  Jeffrey Conditionalization (JC) allows an agent to update beliefs when experience shifts probabilities over a partition without making any cell certain. A known formal feature of JC is non-commutativity: updating on partition $\mathcal{E}$ then $\mathcal{F}$ yields a different posterior than $\mathcal{F}$ then $\mathcal{E}$. Standard defenses argue this reflects genuine changes in the evidential context (e.g., learning about reliability). However, this project asks a sharper, structural question: **Is the non-commutativity of Jeffrey Conditionalization an artifact of discrete, coarse-grained updates, or does it persist in the continuous limit?**

  Specifically, if we model a total body of uncertain evidence as a sequence of $N$ infinitesimal Jeffrey updates, does the final belief state converge to a unique limit as $N \to \infty$, regardless of the order in which the incremental shifts are interleaved? If the order-dependence vanishes in the fine-grained limit, Sam's reductionist intuition (that JC is merely approximate bookkeeping for a deeper commutative process) gains formal traction. If order-dependence survives the limit, then non-commutativity is a fundamental feature of uncertain evidence, not a bug of discretization.

  **2. Why Existing Positions Do Not Settle This**
  The debate is currently stalled between two unsatisfying poles.
  *   **The Reductionist Objection (Sam's View):** This view claims that for every JC update, there exists a certain proposition (e.g., "I am in brain state $B$") on which one can condition ordinarily. Ordinary conditioning commutes. *Critique:* This move shifts the partition with every update. It fails to model the phenomenon of receiving *competing* uncertain signals about the *same* partition (e.g., two dim lights indicating the same switch position). It explains away the data rather than modeling the dynamics.
  *   **The Standard Defense:** Proponents of JC accept non-commutativity but argue it is normatively acceptable because later evidence often bears on the reliability of earlier evidence. *Critique:* This conflates *content* with *structure*. It excuses the formal property by adding external context. It does not tell us whether the rule itself has a stable behavior when the "content" is held fixed and only the "granularity" changes.

  Neither position addresses the *topological* behavior of the update rule. We do not know if the "path dependence" of JC is like walking on a curved surface (where order fundamentally matters) or like approximating a straight line with jagged steps (where order matters only because the steps are too big).

  **3. Methodology and Timeline (9 Months)**
  The project treats the probability simplex as a differentiable manifold and Jeffrey updates as vector fields generating flows over this space.

  *   **Months 1–3: Formalization.** I will define a "fine-grained" Jeffrey update. Instead of shifting a partition $\{E_i\}$ from $p$ to $q$ in one step, I will model this as $N$ steps of size $(q-p)/N$. I will derive the differential equation governing the belief trajectory as $N \to \infty$.
      *   *Math required:* Calculus on the probability simplex; Taylor expansions of the JC formula; identifying the associated vector field.
  *   **Months 4–6: Commutativity Analysis.** I will compare the flow generated by update $\mathcal{E}$ followed by $\mathcal{F}$ against $\mathcal{F}$ followed by $\mathcal{E}$ in the limit. I will check if the Lie bracket of the associated vector fields vanishes. (Inspired by the Trotter product formula in physics, which determines when non-commuting operators converge to a commutative sum in the limit).
      *   *Contingency:* If the analytic derivation of the Lie bracket proves intractable due to boundary conditions on the simplex, I will pivot to high-precision numerical simulations to test for convergence rates.
  *   **Months 7–9: Philosophical Interpretation.** I will map the mathematical results back to the epistemological debate.
      *   *If Commutative:* I will argue that JC is a discrete approximation of a commutative continuous process, validating a modified version of Sam's view (it's not certain *propositions*, but a certain *flow*).
      *   *If Non-Commutative:* I will argue that uncertain evidence is fundamentally path-dependent, requiring a dynamic rather than static norm of rationality.

  **4. Possible Outcomes and Decision Criteria**
  *   **Outcome A (Convergence):** The distance between the "E then F" and "F then E" posteriors goes to zero as the step size goes to zero.
      *   *Implication:* The order-dependence is a discretization error. The "true" rational update is order-independent.
  *   **Outcome B (Persistence):** The distance remains non-zero even in the limit.
      *   *Implication:* Uncertain evidence creates a "curved" epistemic space. The order of processing is constitutive of the belief state.
  *   **Decision Criteria:** The project succeeds if I can rigorously prove either convergence or persistence for a general class of partitions. A proof for the binary partition case ($\{E, \neg E\}$) will count as a sufficient proof of concept for the fellowship.

  **5. Risks, Failure Conditions, and Scaled-Down Scope**
  *   **Honest Failure Condition:** The project fails if the limit does not exist (e.g., the trajectory becomes chaotic or undefined at the boundaries of the simplex) or if the mathematical tools required (e.g., specific information geometry) exceed the scope of philosophical training without collaboration. If the vector fields are not smooth, the differential approach collapses.
  *   **Scaled-Down Version:** If the general limit proof is too demanding, I will restrict the scope to **Binary Partitions only**. Instead of general $\{E_i\}$, I will analyze the 1-dimensional manifold of credences in a single proposition $E$. This reduces the geometry to a line segment, making the differential analysis tractable while still answering the core question: does splitting a single large Jeffrey shift into many tiny shifts remove order sensitivity?

  ***

  **Confidence Note**
  (i) **Openness:** I am highly confident (90%) that the fine-grained question is open. Standard texts discuss commutativity of finite updates, but the continuum limit of JC is not standard curriculum and touches on niche intersections of information geometry and epistemology.
  (ii) **Tractability:** I am moderately confident (70%) this is tractable in nine months. The binary case is definitely doable; the general partition case risks becoming a pure math problem.
  (iii) **Least Defensible Claim:** I am least willing to defend the claim that **"If the limit is commutative, Sam's reductionism is vindicated."** Even if the math converges, Sam's ontological claim (that we are *actually* certain of brain states) is a metaphysical leap that a commutative flow does not strictly necessitate; it only vindicates the *formal* utility of JC, not necessarily Sam's foundationalism.
