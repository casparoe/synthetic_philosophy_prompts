answer: |-
  1. **Unit of Analysis**
  The smallest community for which this episode counts as a revolution is the specialized subfield of TSE (transmissible spongiform encephalopathy) research. For the handful of laboratories working directly on scrapie and kuru, the shift from "unconventional virus" to "prion" overturned the foundational ontology of their specific domain. The largest community for which it does *not* count as a revolution is molecular biology as a whole. For the broader discipline, the Central Dogma (DNA → RNA → Protein) remained intact because prions do not replicate genetic information, only conformational state; thus, the episode was absorbed as a peculiar exception or a novel mechanism of protein aggregation rather than a overthrow of genetic theory. The veterinary and public-health apparatus occupies a middle ground: for them, the shift was pragmatic rather than theoretical. Whether the agent was a virus or a protein mattered less than the fact that meat-and-bone meal transmitted it. Consequently, the verdict changes drastically with scale: it is a revolution for the neuropathologists and biochemists of the subfield, but merely a puzzle-solution or a regulatory update for the surrounding disciplines.

  2. **The Paradigm**
  The paradigm at stake was not biology-in-general but the specific etiological framework governing infectious disease and replication. The hard commitments were: (1) Infectivity requires nucleic acid (DNA or RNA) to carry the information necessary for replication; (2) Any infectious agent capable of independent propagation must possess a genome susceptible to mutation and selection; (3) Inactivation by nucleic acid-targeting radiation (UV, ionizing) is a necessary condition for identifying a viral agent. The habitual commitments included: (1) Diseases are taxonomically sorted by their agent (viral, bacterial, fungal); (2) Long incubation periods imply slow viral replication kinetics rather than alternative mechanisms; (3) Familial diseases are genetically distinct from infectious diseases. The protein-only hypothesis was unthinkable because it violated the first hard commitment: it proposed information transfer without nucleic acid, seemingly contradicting the molecular basis of life established in the 1950s.

  3. **Puzzles, Anomalies, and Crisis**
  The introduction of the categories "slow virus" and "unconventional virus" was paradigm-preserving accommodation, characteristic of normal science. Faced with the anomaly of radiation resistance (Alper's data) and long incubation, the community manufactured a sub-kind ("unconventional") to absorb the recalcitrant case without abandoning the nucleic acid requirement. This allowed researchers to continue working within the viral paradigm while acknowledging odd data. A genuine Kuhnian crisis did not arrive from theoretical failure alone. Alper's results in the 1960s and 1970s were anomalies, but they were isolated and ignored rather than allowed to destabilize the field. The crisis arrived externally with the BSE epizootic and the 1996 identification of vCJD. This was not a theoretical breakdown but a public health emergency that made the cost of the old paradigm (uncertainty about transmission risks) untenable. This modifies Kuhn's crisis mechanism: here, crisis was driven by socio-political pressure and economic disaster rather than the accumulation of internal theoretical contradictions. The paradigm fell not because it stopped working scientifically, but because it stopped working socially.

  4. **Incommensurability**
  Your suspicion that Grade 3 (Normative/Evidential) does the heavy lifting is largely correct, but Grade 2 (Taxonomic) is more significant than you allow.
  *   **Grade 1 (Referential):** There was variance, but it was not total. "Virus" referred to a nucleic acid-protein complex for the old guard, and to a null set for Prusiner. "Replication" meant genome copying for one side, conformational templating for the other. However, terms like "infectivity," "titre," and "incubation period" retained stable reference across the divide, allowing data comparison.
  *   **Grade 2 (Taxonomic):** This was a major fault line. The old taxonomy separated sporadic, familial, and infectious CJD into distinct kinds (genetic defect vs. external agent). The prion paradigm collapsed these into a single kind (misfolded protein) with different triggers. This restructuring of similarity space meant that a familial case was no longer ontologically distinct from an infectious case, a shift that resisted acceptance because it undermined genetic counseling frameworks.
  *   **Grade 3 (Normative):** This was the battlefield. The old standard required purification of nucleic acid to prove infectivity; the new standard accepted purification of protein plus loss of infectivity upon protein denaturation. Crucially, both sides accepted Alper's inactivation curves (shared evidence), but disagreed on their bearing. For the virus camp, failure to detect nucleic acid was evidence of technical limitation (shielding); for the prion camp, it was evidence of absence.
  The dispute looks incommensurable only if one conflates these grades. The shared vocabulary of biochemistry (inactivation curves, lesion profiles) made the sides commensurable enough to argue, but the normative standards for what counted as proof prevented resolution until the external crisis forced a change in standards.

  5. **Silence of the Framework**
  Kuhn's apparatus is silent on two features that plausibly mattered to the outcome. First, the role of agricultural practice and economic interest. The BSE crisis was not merely a scientific puzzle but a trade disaster; the pressure to resolve the etiology came from government and industry needing to manage risk, not just scientists seeking truth. Kuhn's internalist history cannot account for why the paradigm shifted in 1996 rather than 1986, given the scientific data changed little in that interval. Second, the resistance was sustained by a structurally available alternative: the "virino" hypothesis (a small nucleic acid shielded by host protein). This was not mere paradigm attachment but a rational competing hypothesis that explained the radiation data without abandoning nucleic acid. Kuhn treats resistance as psychological or sociological commitment to a paradigm; he lacks the resources to describe resistance as rational theory choice between underdetermined options.

  6. **Case Back on Theory**
  (a) **Accommodation versus Crisis:** Normal science always has the resource of inventing intermediate categories (e.g., "unconventional virus"). Kuhn offers no metric for when accommodation becomes exhaustion. In this case, the tipping point was not theoretical saturation but external cost. The framework cannot distinguish between a paradigm stretching normally and a paradigm breaking, except retrospectively.
  (b) **Shared Evidence:** Both sides accepted the same inactivation data. The disagreement was over the *weight* of the evidence, not its *meaning*. This challenges Kuhn's meaning-variance thesis, which suggests opponents see different things. Here, they saw the same curves but drew different inferences about nucleic acid presence. Kuhn's account handles disagreements over theory well, but disagreements over the bearing of uncontentious evidence poorly.
  (c) **Scale:** The episode was a revolution for the subfield but a routine extension for the discipline. If a paradigm shift can be hyper-local, the notion of a "disciplinary matrix" loses determinacy. Kuhn's theory implies a wholesale change in worldview; if one can have a prion paradigm within a molecular biology paradigm without contradiction, the concept of "paradigm" becomes too fluid to do explanatory work.
  (d) **Loss:** There was a Kuhn loss. The heritable diversity of strains and the species barrier were awkward for the conformational account for a long time. How could a protein without a genome mutate into distinct strains with specific incubation periods? The viral hypothesis explained this naturally. The prion hypothesis only recovered this explanatory power later with the concept of conformational strains. For a significant period, the new paradigm was less explanatory than the old regarding strain variation.
  (e) **Unfalsifiability:** To conclude this was *not* a Kuhnian shift, I would look for seamless absorption without resistance. If the "slow virus" proponents had adopted "prion" immediately as a synonym for "unconventional virus" without ontological debate, it would have been normal science evolution. The fierce resistance fits the Kuhnian narrative, but the condition is close to being met: many researchers accepted prions pragmatically for safety protocols while privately maintaining a "virino" belief. If that private belief had remained the dominant scientific view despite the Nobel, the "revolution" would have been merely nominal.

  7. **Verdict**
  This was a local paradigm shift driven by external crisis rather than internal theoretical exhaustion, a nuance Kuhn's vocabulary misdescribes by attributing the change solely to scientific anomaly. The episode fits the pattern of resistance and conversion but fails the internalist mechanism, as the shift was compelled by public health necessity rather than the collapse of explanatory power. A defender of the theory would argue that the BSE epizootic merely accelerated the recognition of anomalies that had already theoretically destabilized the viral paradigm, maintaining that the external pressure only revealed the internal breakdown that Kuhn predicts.
