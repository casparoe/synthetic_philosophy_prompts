      *   *Application to Baseline:* Writing hinges as a list of "truths" makes them vulnerable. If we say "The external world exists" as a rule, a student can ask "Why?" and we have no answer except "Because we said so." This validates the skeptic. Better to frame it as "This is how we operate here."
      *   *Losing Side Considerations:* Acknowledge the registrar's fear (anarchy) and the student member's fear (punishing curiosity). Acknowledge the faculty's need for stability vs. the risk of dogmatism.
      *   *Closing:* Reiterate the path forward.

