answer: |-
  Your premise is sound, though the terminology is slightly idiosyncratic. "Morphological reference class" isn't standard jargon in econometrics or political science (you'll usually hear "causal homogeneity," "structural equivalence," or "historical institutionalism"), but the distinction you're drawing is real and foundational. You are not forcing two fields into one argument; you have accurately identified the friction point between **Reference Class Forecasting (RCF)** and **Comparative Historical Analysis (CHA)**.

  Here is the diagnosis.

  ### 1. The Diagnosis: Teleological Divergence Masked as Methodological Dispute

  This is not merely verbal, nor is it purely substantive. It is a **teleological divergence**. The two camps are optimizing for different loss functions, which makes their methodological disagreements intractable.

  *   **Camp A (Outside-View/Actuarial):** Their goal is **calibration**. They want to minimize bias (overconfidence) and maximize statistical accuracy over a large set of predictions. For them, a forecast is a **betting odd**. To achieve this, they need $N$ (sample size). They must cast the net wide (Rome, USSR, Qing) to get enough data points to compute a frequency. They treat the state as a black box; internal mechanics matter less than the input/output history.
  *   **Camp B (Historians/Institutionalists):** Their goal is **validity** (specifically, causal validity). They want to minimize variance caused by heterogeneity. For them, a forecast is a **plausibility constraint on a narrative**. To achieve this, they need causal homogeneity. They must cast the net narrow (nuclear-armed, digital, capitalist states) to ensure the mechanisms are comparable. They treat the state as a white box; internal mechanics are the *only* thing that matters.

  **The Stall:** Camp A accuses Camp B of "special pleading" (making the case unique to avoid uncomfortable probabilities). Camp B accuses Camp A of "pseudo-precision" (calculating precise probabilities on nonsense categories). Both are right, relative to their goals.

  ### 2. Your Theory on 'Similarity'

  You are correct: **Similarity is a framing decision, not an empirical discovery.**

  This is the core of the **Reference Class Problem** (famously articulated by Alan Hájek). Any individual event (e.g., "The US in 2024") belongs to infinite reference classes (e.g., "North American powers," "Nuclear states," "States with declining birth rates," "States led by men over 70"). Each class yields a different base rate.

  *   **Camp A's Error:** They pretend the choice of reference class is objective or default ("Empires"). It is not. Choosing "Empire" over "Liberal Democracy" is a theoretical commitment that longevity is the primary driver of collapse.
  *   **Camp B's Error:** They often refuse to quantify at all because they recognize the ambiguity, retreating into qualitative nuance that cannot be scored or calibrated.

  The disagreement stalls because neither side admits that **selecting a reference class is a theory-laden act.** Camp A thinks they are being "scientific" by using numbers; Camp B thinks they are being "rigorous" by using mechanisms. Both are skipping the step where they justify *why* a specific similarity metric is causally relevant.

  ### 3. Inside-View Override and Indexing

  You asked about the rules for indexing and inside-view override. This is where the teleological split becomes clear.

  *   **On Indexing:**
      *   **Camp A** indexes by **outcome** (Did the regime fall?). This maximizes data availability but mixes distinct causal pathways (e.g., a coup vs. an invasion vs. economic dissolution).
      *   **Camp B** indexes by **mechanism** (Did the fiscal contract break?). This ensures causal clarity but results in tiny $N$ (often $N=1$), making frequency calculations impossible.
  *   **On Inside-View Override:**
      *   **Camp A** allows inside-view adjustments only as a penalty. In Superforecasting tournaments, moving away from the base rate requires strong evidence, and forecasters are often penalized for over-adjusting. The base rate is the anchor; the inside view is the noise.
      *   **Camp B** argues the inside view *determines* the base rate. If the morphological features (nukes, digital surveillance) prevent the mechanism of collapse seen in Rome, the Roman base rate is literally zero for this case. The inside view isn't an adjustment; it's the selection criteria for the class itself.

  ### 4. Is the Stall Permanent?

  **Philosophically: Yes.**
  You cannot prove empirically which reference class is "correct" because the correctness of the class depends on the causal theory you hold before you look at the data. If you believe technology changes state ontology, Camp B wins. If you believe human organizational psychology is constant, Camp A wins. This is a normative/metaphysical disagreement about the nature of social reality, disguised as a statistical one.

  **Practically: No.**
  Progress is possible, but not through a formal proof or agreed indexing rules. Progress looks like **Hierarchical Bayesian Modeling.**

  *   **The Synthesis:** Treat the broad historical base rate (Camp A) as the **Prior**. Treat the morphological/institutional analysis (Camp B) as the **Likelihood**.
  *   **The Protocol:** You start with the "Empire" base rate. Then you calculate a likelihood ratio based on the specific morphological features (e.g., "How much does nuclear deterrence reduce the probability of external conquest compared to pre-nuclear empires?"). You update the prior.

  ### 5. What Progress Would Look Like

  Do not look for a formal result on reference-class ambiguity; that is a known undecidable problem in probability theory. Do not look for agreement on indexing rules; that requires agreeing on a unified theory of social science, which won't happen.

  **Progress looks like this:**
  1.  **Explicit Priors:** Camp A must admit their reference class choice is a prior belief about causal similarity, not an objective fact.
  2.  **Quantified Mechanisms:** Camp B must stop saying "it's different" and start estimating *how much* different (e.g., "Nuclear weapons reduce external conquest risk by factor X").
  3.  **Scored Explanations:** Forecasts must be scored not just on outcome (did it happen?), but on *pathway* (did it happen for the reason you predicted?). This forces Camp A to care about mechanisms and Camp B to care about calibration.

  ### Summary
  You are not confused. The term "morphological reference class" is non-standard, but the methodological distinction is the central tension in political risk forecasting. The stall is not due to a lack of data, but because **Camp A is asking an actuarial question** (what is the frequency?) while **Camp B is asking a causal question** (what is the mechanism?).

  They will not agree on the numbers until they agree on whether a forecast is a **bet** or an **explanation**. Until then, the "similarity" judgment will remain a hidden normative choice, and the debate will cycle indefinitely.
