      *   *Check Task 4:* Ensure I don't just say "both failed." I need to say what the law *reveals* about the theories. It reveals that Republicanism is more coherent on state sovereignty, while Multiculturalism is better on individual harm but weaker on institutional cohesion *as defined by the state*. Or, more sharply: The law reveals that the state prioritizes *boundary maintenance* over the normative goals of either theory.

