          *   *Crucial nuance:* Multiculturalism isn't just "wear whatever." It usually involves a harm principle (Okin vs. Shachar).

      *   **Task 2: The Multiculturalism Critique (Coherence & Assimilation):**
          *   Does Multiculturalism handle *institutional neutrality*?
          *   Problem: Multiculturalism often accepts the liberal public/private split. It asks for accommodation *within* the structure, not necessarily a dismantling of the structure.
          *   Does it smuggle assimilation? Yes, by accepting that the "public" is a neutral arbiter, it implicitly accepts the majority's definition of the public sphere. It asks for exceptions, not structural change.
          *   Also, the "visibility" demand: Multiculturalism wants recognition, but does it demand *conspicuous* symbols in schools specifically? Or just the right to them? The user's "asymmetry" holds up here: Multiculturalism defends the *right* to visibility, Republicanism mandates *invisibility*.

      *   **Task 3: The Republicanism Critique (Omissions):**
          *   What is missed?
