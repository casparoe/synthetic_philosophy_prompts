      *   *The 2004 Law:* It codified the ban. It shifted from case-by-case (1989-2004) to blanket prohibition.
      *   *Agents:*
          *   Ministry of Education (Lionel Jospin in '89, later governments).
          *   Local Administrators/Principals (Ernst in Creil).
          *   Students (the three girls in Creil).
          *   Teachers (unionized, defenders of *laïcité*).
