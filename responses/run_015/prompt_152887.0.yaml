      *   **User's Intervention:** "Asymmetry of visibility demands" (State demands invisibility vs. Multiculturalism demands visibility).
      *   **Task 1 (Mapping):** Identify agents (Ministry, admins, students/families, teachers, public) and map options/payoffs/prescriptions for both frameworks.
      *   **Task 2 (Multiculturalism Critique):** Does it offer a coherent account of clashes with neutrality, or does it smuggle in assimilationist public/private boundaries?
      *   **Task 3 (Republicanism Critique):** What does it misdescribe/miss? (Gender, class, lived experience of expelled students).
      *   **Task 4 (Reverse Analysis/2004 Law):** What does the law reveal about both theories? (Vindication, anomaly, or misidentified state interest in symbolic boundaries?).
      *   **Constraint:** Be disciplined about theoretical silence; don't force guidance where none exists.

  2.  **Initial Brainstorming & Theoretical Grounding:**

      *   *Republican Universalism:* Rooted in Rousseau, the Revolution, *laïcité* (1905 law). The citizen is abstract, unmarked. Religion is private. Public space must be neutral to ensure equality. The headscarf is seen as a political/religious encroachment on the neutral space and potentially oppressive to women.
      *   *Multiculturalism:* Rooted in Kymlicka, Taylor, Modood. Group rights, recognition, accommodation. Identity is constitutive. Banning symbols harms dignity and participation.
