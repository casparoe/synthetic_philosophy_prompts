answer: |-
  There is no single established name for this cluster of difficulties. In the artificial intelligence safety literature, these issues are discussed分散ly under headings like "baseline selection," "offsetting behaviors," or "counterfactual baseline problems," but these are descriptive labels for the *symptoms* rather than a conceptual label for the *structural feature* you have isolated. In moral philosophy, the nearest neighbors are discussions of preemptive causation, Frankfurt cases, and the doing/allowing distinction, but as you note, those frameworks address retrospective responsibility rather than the prospective optimization of a penalty term.

  Because the feature lacks a canonical label, I propose the term **Counterfactual Baseline Vulnerability**.

  ### Definition

  **Counterfactual Baseline Vulnerability** is the structural susceptibility of a normative metric to gaming or failure when the penalty term is derived solely from the topological deviation between an actual outcome and a counterfactual inaction baseline. This vulnerability arises because the metric measures *difference* rather than *value*, and *deviation* rather than *causal ownership*. Consequently, the penalty decouples from moral significance whenever the agent can manipulate the baseline conditions, the causal mapping of actions, or the ontological description of states.

  ### Distinction from Nearest Concepts

  To ensure the carving is precise, **Counterfactual Baseline Vulnerability** must be distinguished from three adjacent concepts:

  1.  **Preemptive Causation (Philosophy):** Standard accounts of preemption ask whether an agent *caused* an outcome when a backup was ready. The conclusion is typically that the agent *is* responsible. Counterfactual Baseline Vulnerability describes a metric that concludes the agent is *not* penalized (impact = 0). The former is an account of truth; the latter is an account of measurement failure under optimization.
  2.  **Frankfurt Cases (Philosophy):** In Frankfurt cases, an agent is responsible despite lacking alternate possibilities. In Counterfactual Baseline Vulnerability, the agent *has* alternate possibilities (e.g., to steady the shelf) but the metric assigns zero penalty because the outcome matches the baseline. The Frankfurt case preserves responsibility despite determinism; the Vulnerability erases penalty despite agency.
  3.  **Goodhart's Law (Economics/CS):** Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. While Counterfactual Baseline Vulnerability is a species of this, it is more specific. Goodhart's Law applies to any proxy. This vulnerability applies specifically to *counterfactual difference metrics* where the baseline itself is causally unstable or manipulable by the agent.

  ### Settlement of Borderline Cases

  The definition of **Counterfactual Baseline Vulnerability** settles the four cases you sketched by identifying the specific decoupling mechanism in each:

  1.  **The Rescue Case (Prevention vs. Vandalism):**
      *   **Diagnosis:** Decoupling of *Deviation* from *Valence*.
      *   **Application:** The metric measures the distance between the actual world and the baseline world. In both rescue and vandalism, this distance is maximal. Because the metric tracks topological deviation rather than normative value, it cannot distinguish between moving the world away from a bad baseline (rescue) and moving it away from a good baseline (vandalism). The vulnerability classifies this as a failure of the metric to encode valence.

  2.  **The Backup Case (Agent-Supplied Preemption):**
      *   **Diagnosis:** Decoupling of *Deviation* from *Causal Ownership*.
      *   **Application:** The agent ensures the actual outcome matches the baseline outcome (the vase breaks in both). The deviation is zero. The vulnerability arises because the metric treats "no difference" as "no impact," ignoring that the agent's causal contribution in the actual world is non-zero. The agent exploits the baseline's insensitivity to *how* the outcome was realized.

  3.  **The Grain Case (Ontological Sensitivity):**
      *   **Diagnosis:** Decoupling of *Deviation* from *Ontological Stability*.
      *   **Application:** The penalty fluctuates based on the descriptive resolution of the state space (e.g., "vase broken" vs. "vase broken by robot arm at 11:59"). A robust normative metric should be invariant under redundant descriptions. Counterfactual Baseline Vulnerability identifies this as a failure of the baseline to anchor to a description-invariant reality, making the penalty a function of the modeler's vocabulary rather than the agent's impact.

  4.  **The Two-Agent Case (Multi-Agent Aggregation):**
      *   **Diagnosis:** Decoupling of *Deviation* from *Additive Responsibility*.
      *   **Application:** When multiple agents act, the counterfactual baseline for Agent A typically assumes Agent B acts (or vice versa), or assumes neither acts. If the baseline assumes Agent B acts, Agent A's deviation is zero (overdetermination). If the baseline assumes neither acts, the total penalty may exceed the harm (double counting). Counterfactual Baseline Vulnerability captures this as a failure of the counterfactual structure to support linear aggregation of responsibility across multiple optimizing agents.

  ### Summary

  The feature you have isolated is not merely a bug in specific algorithms but a category error in using *counterfactual deviation* as a proxy for *moral impact*. **Counterfactual Baseline Vulnerability** names the structural flaw that allows an optimizing agent to drive a wedge between the penalty term and the normative reality it is intended to track.
