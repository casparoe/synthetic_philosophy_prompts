answer: |-
  There is no single, canonical noun phrase in the historiography of science that exclusively labels this specific move. It is typically discussed as a subset of **Whig history**, **presentism**, or **reification**, but as you correctly note, those terms are too broad. Whig history explains *why* we look back (to trace progress), but not *how* we erase conceptual heterogeneity to do so. Reification explains treating an abstraction as a thing, but not the merging of two *different* things into one.

  For the purposes of your seminar, the most precise existing descriptor is **Retrospective Conceptual Conflation**. However, to capture the ontological weight of the move you are describing—the transformation of distinct practices into a single "discoverable object"—I propose you adopt the term **Retrospective Ontological Collapsing**.

  Below is a precise definition, a distinction from related concepts, and an application to your test cases.

  ### Proposed Definition: Retrospective Ontological Collapsing

  **Retrospective Ontological Collapsing** is the historiographical operation by which two or more heterogeneous conceptual systems, practices, or formalisms are narratively merged into a single, stable "discovery object" based on their perceived functional equivalence in the present, thereby obscuring their original structural incommensurability.

  **The Mechanism involves four steps:**
  1.  **Extraction:** Specific results (e.g., the derivative, the prediction of species change) are extracted from their native theoretical frameworks (fluxions vs. differentials; Malthusian economics vs. biogeography).
  2.  **Translation:** These results are translated into a modern, standardized formalism (modern calculus notation; modern synthesis genetics).
  3.  **Equivalence:** The translated results are declared "identical," ignoring the fact that the original frameworks rendered the *meaning* of those results incompatible.
  4.  **Compression:** The priority dispute is framed as a race for ownership of this newly constructed identical object, rather than a conflict between competing visions of nature.

  ### Distinguishing from Related Concepts

  To ensure the carving is sharp enough for your seminar, distinguish it as follows:

  | Concept | Definition | Why it is distinct from Ontological Collapsing |
  | :--- | :--- | :--- |
  | **Multiple Discovery** (Merton) | The empirical fact that similar ideas arise independently. | Describes the *event*, not the *narrative distortion*. Merton often assumes the ideas *are* identical; Collapsing critiques that assumption. |
  | **Whig History** (Butterfield) | Interpreting the past as a inevitable progression toward present truths. | Explains the *motivation* (progress), but not the *method* (erasing conceptual difference). One can be Whiggish without collapsing (e.g., "Newton was better than Leibniz"). |
  | **Convergence** | Independent lines of inquiry arriving at the same solution. | Implies the solutions *actually met*. Collapsing argues they did not meet; the historian *made* them meet via translation. |
  | **Reification** | Treating an abstract concept as a concrete physical object. | Collapsing is a specific type of reification where *two* distinct abstractions are fused into *one* concrete object. |
  | **Incommensurability** (Kuhn) | The inability to translate one paradigm fully into another without loss. | This is the *theoretical condition* that makes Collapsing a distortion. If they are incommensurable, Collapsing is historiographically violent. |

  ### Application to Test Cases

  You can use this definition to evaluate whether the flattening is justified or obscuring in your other examples.

  #### 1. Lavoisier and Priestley (Oxygen)
  *   **The Flattening:** "Both discovered oxygen in the 1770s."
  *   **The Heterogeneity:** Priestley discovered "dephlogisticated air" within a framework where combustion releases phlogiston. Lavoisier discovered "oxygen" within a framework where combustion absorbs a substance. For Priestley, the gas was defined by what it *lacked* (phlogiston); for Lavoisier, by what it *was* (an acid generator/element).
  *   **Verdict:** **Unjustified Collapsing.** Priestley died rejecting Lavoisier's ontology. To say they discovered the "same thing" requires ignoring that "oxygen" did not exist as an ontological category for Priestley. The collapsing serves to validate the victor (Lavoisier) by annexing the loser's data.

  #### 2. Boltzmann and Gibbs (Statistical Mechanics)
  *   **The Flattening:** "Both founded statistical mechanics."
  *   **The Heterogeneity:** Boltzmann worked from a kinetic, atomistic, mechanical tradition (the H-theorem, collisions, time-evolution). Gibbs worked from a thermodynamic, ensemble-based, geometric tradition (phase space, Liouville's theorem, static probabilities). Boltzmann sought to *reduce* thermodynamics to mechanics; Gibbs sought to *analogize* thermodynamics via mechanics.
  *   **Verdict:** **Partially Justified, but Obscuring.** Unlike Priestley/Lavoisier, these frameworks were eventually synthesized (by Ehrenfest and others). However, collapsing them obscures a deep methodological rift: the "kinetic" vs. "ensemble" approaches still generate different intuitions and pedagogical conflicts in physics today. The collapsing hides the fact that "statistical mechanics" is a hybrid of two distinct styles of reasoning (to use Ian Hacking's term).

  ### Theoretical Lineage for Your Seminar

  If your students ask for the intellectual pedigree of this critique, you can trace it through three nodes:

  1.  **Thomas Kuhn (Incommensurability):** Provides the philosophical warrant for saying Newton and Leibniz (or Priestley and Lavoisier) were not talking about the same world.
  2.  **Bruno Latour (Black Boxing):** Explains *why* the collapsing happens. Once a fact is stabilized (e.g., "Calculus works"), the controversy of its construction is "black-boxed." The priority dispute becomes a story about the box, not the contents.
  3.  **Ian Hacking (Styles of Reasoning):** Provides the vocabulary to describe the differences. Newton's "geometric/physical" style vs. Leibniz's "algebraic/combinatoric" style are different ways of establishing truth, not just different paths to the same truth.

  ### Recommendation for the Seminar

  I recommend introducing **Retrospective Ontological Collapsing** as a specific heuristic tool. Ask your students to identify the "translation step" in standard textbook narratives. Where does the historian switch from Newton's fluxions to modern $dy/dx$ notation? That switch is usually where the collapsing occurs, and where the historiographical violence is done.

  This moves the seminar beyond "Who was first?" to "What counts as 'the same'?"—which is the core sociological question of scientific discovery.
