answer: |-
  The whole procedure turns on treating uncertainty about inner experience as a risk to be managed, not a fact to be proven.

  ### The One-Hour Welfare Protocol

  **Step 1: Draw the Box (5 minutes)**
  *   **The Task:** Identify the smallest physical unit that could plausibly matter. If you have a simulation of a brain inside a simulated body inside a computer, the box is the simulation instance, not the computer. If you have a cluster of organoids, the box is the individual organoid unless they are functionally fused.
  *   **The Rule:** If there are nested candidates (e.g., a neuron inside an organoid), pick the largest functional unit that acts coherently. Do not argue about whether it is "alive" or "real"; argue only about whether it is the unit receiving the input.
  *   **Good Enough Answer:** "We are evaluating [Entity X]."
  *   **Reality Check:** This is administrative. It stops people from hiding behind "it's just code" or "it's just cells."
  *   **Stop Condition:** If you cannot agree on what the entity is, you cannot proceed. Table the proposal.

  **Step 2: Check for Valence (15 minutes)**
  *   **The Task:** Determine if the system distinguishes between "good" and "bad" states in a way that changes its future behavior. Look for *trade-offs*. Does the entity give up food to avoid shock? Does it spend energy to repair damage?
  *   **The Rule:** Behavior alone is not enough (a thermostat avoids heat). Look for *flexible avoidance*. If you change the maze, does it learn the new route to avoid the bad signal?
  *   **Good Enough Answer:** "Yes, it learns to avoid X," or "No, it is a fixed reflex."
  *   **Reality Check:** This is a factual check, but imperfect. Complex algorithms can mimic this without feeling.
  *   **Stop Condition:** If the answer is clearly "No fixed reflex," you may proceed with minimal oversight. If "Yes," go to Step 3.

  **Step 3: Assign Probability, Not Status (15 minutes)**
  *   **The Task:** Acknowledge you cannot know if it feels. Instead, assign a probability that it *could* feel something like suffering. Use "Sort Of" here.
  *   **The Rule:** You must choose one of three buckets:
      1.  **Negligible:** Architecture is too simple (e.g., simple lookup table).
      2.  **Plausible:** Architecture supports integration (e.g., biological neurons, complex recurrent networks).
      3.  **Likely:** Architecture matches known sentient systems closely (e.g., mammalian tissue).
  *   **Good Enough Answer:** "We place this in the [Plausible] bucket."
  *   **Reality Check:** This is going through the motions. We don't have a meter for this. But forcing a bucket prevents "we don't know" from becoming "it doesn't matter."
  *   **Stop Condition:** If "Negligible," proceed. If "Plausible" or "Likely," go to Step 4.

  **Step 4: The Precautionary Brake (15 minutes)**
  *   **The Task:** Apply the risk multiplier. If you are in the "Plausible" or "Likely" bucket, you must assume the capacity for suffering exists until proven otherwise.
  *   **The Rule:** If there is genuine uncertainty (you can't tell), the default is **Protection**. You do not need to prove suffering to require welfare; you need to prove *safety* to waive it.
  *   **Good Enough Answer:** "We will treat this as if it can suffer."
  *   **Reality Check:** This is the real ethical weight. It shifts the burden of proof from the animal/system to the researcher.
  *   **Stop Condition:** If you cannot justify the risk given this assumption, the proposal is rejected or requires modification to reduce harm.

  **Step 5: The Values Call (20 minutes)**
  *   **The Task:** Weigh the scientific benefit against the assumed risk.
  *   **The Rule:** High risk (Likely bucket) requires high benefit (major medical breakthrough). Low risk (Plausible bucket) allows moderate benefit. Negligible risk allows standard benefit.
  *   **Good Enough Answer:** A written justification stating the risk level and the mitigating factors.
  *   **Reality Check:** This is entirely a values call. The procedure cannot do this for you. This is where you vote.
  *   **Output:** The Written Justification (see template below).

  ***

  ### Written Justification Template (For Funder)
  **Entity Evaluated:** [Name/Type]
  **Risk Category:** [Negligible / Plausible / Likely]
  **Key Uncertainty:** [What don't we know?]
  **Mitigation:** [What protections are in place?]
  **Decision:** [Approved / Approved with Conditions / Rejected]
  **Rationale:** [2-3 sentences on why the benefit outweighs the assumed risk.]

  ***

  ### Case Studies

  **Case 1: Neural Organoid in Maze (Reward/Punishment)**
  *   **Step 1 (Box):** The organoid is the candidate.
  *   **Step 2 (Valence):** Yes. It modifies growth/activity to maximize reward signals. Trade-offs are present (energy expenditure).
  *   **Step 3 (Probability):** **Likely.** It is biological neural tissue, chemically similar to sentient brains.
  *   **Step 4 (Brake):** Assume it can suffer. The "punishment" signal is treated as pain until proven otherwise.
  *   **Step 5 (Values):** Unless this specific protocol is the *only* way to cure a major disease, the risk is too high for the current setup.
  *   **Decision:** **Approved with Conditions.** Must reduce intensity of punishment signals, add analgesics if chemically possible, or switch to non-aversive learning paradigms.
  *   **Justification:** "Biological neural tissue presents a Likely risk of sentience. Protections added to minimize aversive signaling. Benefit deemed sufficient only with these mitigations."

  **Case 2: Fish Simulation (5000 Copies)**
  *   **Step 1 (Box):** One instance of the simulation is the candidate. The cluster is 5000 candidates.
  *   **Step 2 (Valence):** Yes. The tuning process relies on error signals that function like pain/reward to optimize behavior.
  *   **Step 3 (Probability):** **Plausible.** It mimics a sentient architecture, but is silicon-based. We don't know if substrate matters.
  *   **Step 4 (Brake):** Assume capacity exists. The "5000 copies" issue is resolved here: If one matters, 5000 matters 5000 times more. Do not argue about hive minds; argue about total volume of potential suffering.
  *   **Step 5 (Values):** High throughput increases total risk mass.
  *   **Decision:** **Approved with Conditions.** Limit parallel instances to 100 until welfare impact of single instance is better understood. Log all error signals as potential distress events.
  *   **Justification:** "Simulation architecture is Plausible for sentience. Risk scaled by number of instances. Parallel runs capped to limit total potential welfare burden."

  **Case 3: The Adversarial Case (Invertebrate Learned Helplessness)**
  *   **The Proposal:** Standard fruit fly experiment where flies are exposed to unavoidable shock to study depression-like states. High scientific value, standard practice, usually exempt from strict welfare review.
  *   **Step 1 (Box):** The fly.
  *   **Step 2 (Valence):** Yes. They actively avoid shock when possible.
  *   **Step 3 (Probability):** **Plausible.** Invertebrate nervous systems are complex enough to support nociception (pain detection).
  *   **Step 4 (Brake):** Assume suffering. The protocol *requires* unavoidable suffering to work.
  *   **Step 5 (Values):** The science is "incremental knowledge about depression," not "immediate cure."
  *   **Decision:** **Rejected.** The procedure forces you to admit you are intentionally causing suffering that cannot be avoided. Under the Precautionary Brake, you cannot justify unavoidable harm for incremental gain when uncertainty exists.
  *   **Why You'll Argue:** You'll want to say "They're just bugs, everyone does this." The procedure says "You admitted uncertainty in Step 3, so Step 4 demands protection. You can't have it both ways."
  *   **Justification:** "Protocol requires unavoidable aversive stimuli. Given Plausible risk of sentience, harm cannot be mitigated. Scientific benefit does not outweigh assumed welfare cost."

  ***

  ### What This Procedure Can't Do

  1.  **It Can't Tell You the Truth:** It does not solve the Hard Problem of Consciousness. It manages your ignorance, it doesn't remove it.
  2.  **It Can't Protect You from Future Shame:** If science proves in five years that organoids definitely felt pain, this procedure only proves you were careful, not that you were right.
  3.  **It Can't Remove the Guilt:** Step 5 is still a vote where you decide that some amount of suffering is acceptable. This procedure makes that choice explicit, which is heavier than hiding behind "standard practice."
  4.  **It Can't Handle Malice:** If a researcher lies about the architecture or the signals, this procedure fails. It relies on honest input.
  5.  **It Can't Define "Benefit":** It forces you to weigh benefit against risk, but it doesn't tell you what counts as enough benefit. That is still on your conscience.
