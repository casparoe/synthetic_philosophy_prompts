answer: |-
  # Simulation Plan: The Fidelity Protocol

  **Course:** Upper-Division Social Ontology Seminar
  **Topic:** The Metaphysics of Quasi-Monetary Kinds & Reverse-Constitutive Loops
  **Duration:** 90 Minutes
  **Participants:** 16 Students
  **Room:** Flat classroom, movable desks, shared whiteboard.

  ## I. Learning Objective
  To experientially demonstrate how an arbitrary classification, when coupled with institutional rules, generates outcomes that are subsequently cited as the *justification* for the original classification, thereby closing the "reverse-constitutive loop."

  ## II. Materials & Room Layout
  *   **Materials:**
      *   16 Desk Stickers (8 Green, 8 Red) – *opaque until placed face down*.
      *   40 Poker Chips (or distinct paper tokens) – *The "Resource"*.
      *   4 Dry-Erase Markers (Green) – *The "Tool"*.
      *   1 Printed "Protocol Sheet" for the Instructor.
      *   16 Index Cards & Pens (for Round 4).
      *   Timer (projected or visible).
  *   **Layout:**
      *   Desks arranged in a large hollow square.
      *   Whiteboard cleared completely at the front.
      *   Instructor stands at the front, neutral posture.

  ## III. Timeline & Procedure

  ### 0:00 – 0:05 | Launch (No Framing)
  *   **Instructor Script:** "Welcome. We are beginning a protocol exercise. Please do not discuss the rules with each other unless instructed. Your goal is to maximize your token count. Silence is required during rounds."
  *   **Action:** Distribute the Desk Stickers face down. Ask students to flip them simultaneously.
  *   **Constraint:** Do not explain what the colors mean yet.

  ### 0:05 – 0:15 | Round 1: Descriptive Tagging (The "Fidelity" Test)
  *   **Activity:** "Rhythmic Replication."
  *   **Instruction:** "I will clap a rhythm. You will replicate it once with your hands. I will assess the *fidelity* of your replication."
  *   **Action:** Instructor claps a simple, ambiguous rhythm (e.g., *Clap... Clap-Clap... Clap*). Students clap.
  *   **The Move:** As you walk around, place the **Green** or **Red** sticker on their desk.
      *   *Secret Rule:* Assignment is strictly random (50/50). Do not look at their clapping.
      *   *Public Narrative:* "I am tagging based on fidelity. Green is High Fidelity. Red is Low Fidelity."
  *   **Outcome:** Students now possess a descriptive label they believe is based on performance, but is actually arbitrary.

  ### 0:15 – 0:30 | Round 2: Institutional Reinforcement (The Access Rule)
  *   **Instruction:** "Protocol Phase Two. Resource Generation is now open."
  *   **The Rule:**
      *   **Green Desks:** May approach the whiteboard. You may write *one* symbol per minute. Each symbol earns **2 Tokens** from the Instructor.
      *   **Red Desks:** Must remain seated. You may not touch the whiteboard. You may earn **1 Token** per minute by stacking index cards into a tower at your desk. (Stacks must be 5 cards high to cash out).
  *   **Tools:** Place the 4 Green Markers *only* on the whiteboard ledge.
  *   **Duration:** 10 Minutes of active trading/working.
  *   **Instructor Role:** Act as a cold banker. Pay tokens immediately. If a Red student approaches the board, silently point to their sticker and gesture them back. Do not argue.
  *   **Predicted Outcome:** Greens accumulate tokens rapidly (approx. 20 each). Reds struggle (approx. 5-10 each).

  ### 0:30 – 0:55 | Round 3: Resource Distribution (The Market)
  *   **Instruction:** "Protocol Phase Three. Exchange is open."
  *   **The Rule:** Tokens can now be traded for **Speaking Credits**.
      *   1 Token = 1 Minute of guaranteed, uninterrupted speaking time during the final debrief.
      *   Additionally, Tokens can be traded for **Seating Priority** for the next class session (Front Row vs. Back Row).
  *   **Action:** Allow 5 minutes of open trading.
      *   *Observation:* Greens will likely hoard tokens or lend them to Reds at interest. Reds may try to sell labor (stacking cards for Greens) to earn tokens.
  *   **Freeze:** "Stop all exchange. Count your tokens."

  ### 0:55 – 1:10 | Round 4: Explanatory Inversion (The Survey)
  *   **Instruction:** "Before we discuss the simulation, you must complete a Compliance Survey on this index card. This determines if your tokens are valid."
  *   **The Prompt (Written on Board):**
      1.  *Why do you hold the number of tokens you currently hold?*
      2.  *What property distinguishes a Green Desk from a Red Desk?*
      3.  *Did the rules of Phase Two affect your ability to earn tokens? Yes/No. Explain.*
  *   **Constraint:** Students must answer individually. Collect the cards.
  *   **The Trap:** Most Greens will answer Q1 with "Because I worked faster" or "Because I had board access." They will answer Q2 with "Greens are higher fidelity" or "Greens are more productive." They will often downplay the rule constraint in Q3.
  *   **The Inversion:** They will cite the *outcome* (tokens/productivity) as evidence of the *property* (fidelity/value), ignoring that the property was assigned randomly in Round 1.

  ### 1:10 – 1:30 | Debrief & Mapping
  *   **Setup:** Return to the circle. Distribute speaking time strictly according to tokens earned. (This will feel unfair; let it feel unfair).
  *   **The Reveal:** "The phrase for today is: **Reverse-Constitutive Loop**."
  *   **Mapping the Rounds:**
      1.  **Descriptive Tagging (Round 1):** The arbitrary assignment (Clap Fidelity). In money: The initial credit score or gold standard.
      2.  **Institutional Reinforcement (Round 2):** The rules linking tag to resource (Board Access). In money: Legal tender laws or banking access.
      3.  **Explanatory Inversion (Round 4):** Citing the resource accumulation as proof of the tag's validity. In money: "I have money because I am productive" (ignoring that the *definition* of productivity was set by the monetary system).
      4.  **Normative Entrenchment:** The feeling that the token distribution was "earned" rather than "engineered."
  *   **Closing the Gap (Verbal Supply):**
      *   *Instructor Script:* "In this room, you knew it was a game. You felt the arbitrariness. In the real world, this loop has run for centuries. The 'Green Sticker' is not on your desk; it is in the architecture of the buildings, the code of the software, and the habits of your language. History sediments the loop until the *institutional rule* disappears from view, leaving only the *naturalized property*. Money feels like physics, not ontology, because the Round 1 assignment happened before you were born."

  ## IV. Payoff & Incentive Structure
  *   **Currency:** Poker Chips (Tokens).
  *   **Value:**
      *   **High Token Count:** Priority seating choice for next week + 1st right of reply in debrief.
      *   **Low Token Count:** Must sit in remaining seats + must wait until High Token holders finish speaking.
  *   **Why:** This makes the ontology *matter*. If tokens are worthless, the inversion in Round 4 won't sting. They must care about the resource to justify their hold on it.

  ## V. Predictable Failure Modes & Management

  | Failure Mode | Prediction | Management Strategy |
  | :--- | :--- | :--- |
  | **Resistance to Arbitrariness** | Students in Round 1 may argue their clap was "better" despite the random sticker. | **Do not validate.** Reply: "The Protocol assessment is final." Maintain bureaucratic neutrality. This friction is data for the debrief. |
  | **Rule Breaking (Red Rebellion)** | Red students may try to use the whiteboard in Round 2. | **The Compliance Stop.** Calmly withhold tokens. "Protocol Violation. Tokens forfeited." Do not scold. Treat it as a system error. |
  | **Over-Identification (Green Guilt)** | Green students may refuse tokens or share markers illicitly. | **Allow it, then Tax it.** If they share, count it as a "transfer." If they refuse tokens, note it as "opting out of liquidity." Both are valuable debrief points. |
  | **Cynicism** | "This is fake, money is real." | **Save for Debrief.** Acknowledge it during the "Closing the Gap" section. The simulation's artificiality is the control variable. |

  ## VI. Limitations & The "Sedimentation" Gap
  **What the Classroom Cannot Reproduce:**
  The simulation cannot reproduce **Historical Sedimentation**. In the class, the "Round 1" assignment happened 10 minutes ago. Students retain the memory of the arbitrariness. In reality, the "Round 1" of monetary kinds (e.g., the gold standard, colonial property laws) occurred generations ago. The participants are dead. The rules have been rewritten so many times that the original contingency is invisible.

  **Verbal Closure Requirement:**
  You must explicitly state in the debrief:
  > "You felt the injustice because you saw the seam where the arbitrary label was stitched to the resource. In the economy, that seam is buried under decades of case law, infrastructure, and habit. The 'Reverse-Constitutive Loop' works best when no one remembers Round 1. When the category feels like a discovery rather than a decision, the loop is closed."

  ## VII. Instructor Cheat Sheet (Do Not Share)
  *   **Round 1 Assignment:** Use a mental coin flip. Heads=Green, Tails=Red. Do not waver.
  *   **Round 2 Enforcement:** If a Red student asks "Why?", say: "High Fidelity grants Board Access." Do not elaborate.
  *   **Round 4 Collection:** Read 2-3 cards aloud in debrief that show the inversion (e.g., "I have more tokens because I am more efficient").
  *   **Timekeeping:** Be ruthless. The pressure creates the ontological stress.

  ---
  *Note: Ensure the phrase "reverse-constitutive loop" is written on the board only at the 1:10 mark.*
