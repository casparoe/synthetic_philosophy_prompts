answer: |-
  Heterophenomenology is frequently misunderstood as a metaphysical denial of the inner life, a claim that nothing exists beyond what can be publicly observed. This is a category error. The method should not be read as a thesis about what consciousness *is*, but as a calibration norm governing the instrument we use to measure it: the subject's report. When an investigator treats a subject's speech as text to be interpreted rather than gospel to be transcribed, she is not asserting that the subject is wrong about her experience. She is asserting that the channel connecting experience to speech has a finite resolution, and that science must respect the limits of its instruments. This shift from metaphysics to metrology saves the method from charges of eliminativism while preserving its objective stance. It treats the subject not as an oracle but as a complex device outputting data streams.

  Consider the realist who worries that heterophenomenology begs the question by assuming there are no facts about experience beyond the reports. On the calibration reading, this worry dissolves. The investigator is not denying that there might be facts beyond the reports; she is declining to let an uncalibrated channel bear evidential weight it cannot carry. Just as a physicist does not deny the existence of particles smaller than her collider's energy threshold, the consciousness scientist does not deny the existence of phenomenal differences that fail to register in speech. She merely refuses to treat speculation about those differences as data. Neutrality is thus preserved not as a blank skepticism about the world, but as a disciplined skepticism about the tool. The method becomes a way of publishing a resolution-limited map of reportable differences, accompanied by explicit error bars, in the way an image from a microscope is published together with the diffraction limit that bounds it.

  This reconception does genuine work on the problem of shy phenomenal differences. A difference is shy when it is neurally real but reportably noisy, leaving the heterophenomenological record identical under competing hypotheses. If heterophenomenology were a metaphysical claim, this underdetermination would force a collapse into eliminativism: if the report doesn't show it, it isn't there. But if the method is a calibration norm, an instrument of finite resolution is not blind to everything; it is blind below a threshold. The right response to a threshold is to characterize it, report it, and where possible build a second channel—not to announce that the region below the threshold is empty. The scientist acknowledges the shy difference as a region of current instrumental incapacity rather than ontological void. This allows the science to progress by improving the resolution—perhaps through better prompting or neural proxies—without pretending the current blur is sharp. Consequently, experimental design shifts from seeking verification of experience to characterizing the limits of reportability, turning silence into data about the instrument rather than data about the void.

  Finally, this reading resolves the worry about the investigator's own case. The experimenter's introspective vocabulary inevitably enters into the interpretation of subjects' reports, yet her own reports are never themselves heterophenomenologized by anyone else. On the calibration reading, this is not a scandal and not a regress to be terminated by fiat. The experimenter is part of the instrument, calibrated against other experimenters in the way any instrument is cross-checked. Her introspective judgments are not privileged access to truth; they are the standard weights against which the subject's reports are balanced. If her calibration drifts, the community corrects it through replication and consensus. The regress stops not because the experimenter is infallible, but because the community of investigators functions as the ultimate reference frame, stabilizing the meaning of the reports through public use. Just as a meter stick is validated by comparison to other sticks rather than by an appeal to its intrinsic length, the experimenter's vocabulary is validated by its interoperability with the field.

  However, there is a remaining objection this reconception does not answer. It is possible that the report channel is not merely low-resolution, but fundamentally mismatched to the phenomenon. If consciousness is essentially private in a way that prevents *any* public calibration from touching it, then the map is not just blurry; it is of a different territory entirely. The calibration norm assumes that reports track experience well enough to be calibrated, but a radical skeptic could argue that the link is broken at the source. I do not take this to be fatal to the science, though it remains fatal to the hope of a complete metaphysical closure. The method survives because it yields predictive power and technological control regardless of the metaphysical gap. Science requires reliable instruments, not necessarily transparent ones. We can navigate by a compass even if we do not understand magnetism, provided the needle moves consistently. The calibration reading accepts this pragmatic sufficiency, leaving the metaphysical mystery intact but scientifically manageable.

