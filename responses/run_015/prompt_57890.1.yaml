prompt: |-
  As a longtime reader of LessWrong and related forums, I find textbook appeals to diminishing marginal utility an unsatisfying dissolution of the St Petersburg game, where a fair coin is tossed until the first heads on toss n pays £2^n. Please rank the following four decision rules from most to least defensible for an agent of finite wealth who will face many independent gambles across a lifetime: maximise expected monetary value, maximise expected logarithmic utility of wealth, maximise the time-average growth rate, and follow prospect-theoretic probability weighting. Give each rule a score out of 10 for its handling of the classic game, with a sentence of justification for each score. Then state briefly whether your ranking would shift for either of these two variants I keep returning to: (1) the prize is paid in years of healthy life rather than pounds, and (2) you cannot buy entry directly but may sell a transferable ticket that commits whoever holds it to play at the stated price. Close with a one-sentence verdict on which rule a rationalist should actually internalise.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Longtime LessWrong reader (familiar with rationality, decision theory, utility functions, Kelly criterion, prospect theory, etc.). Finds standard "diminishing marginal utility" (log utility) dissolutions of St. Petersburg unsatisfying (likely because it depends on arbitrary utility functions or doesn't address the core paradox of infinite expectation in a finite world).
      *   **Task:** Rank four decision rules for an agent of finite wealth facing *many independent gambles* across a lifetime.
      *   **The Rules:**
          1.  Maximise Expected Monetary Value (EMV).
          2.  Maximise Expected Logarithmic Utility of Wealth (Log Utility).
          3.  Maximise Time-Average Growth Rate (Ergodicity/Ergodic Economics).
          4.  Follow Prospect-Theoretic Probability Weighting (Prospect Theory).
      *   **Scoring:** Score out of 10 for handling the *classic* St. Petersburg game, with one sentence justification each.
      *   **Variants:** Discuss if ranking shifts for:
          1.  Prize in years of healthy life.
          2.  Transferable ticket (secondary market).
      *   **Verdict:** One-sentence conclusion on what a rationalist should internalise.

  2.  **Evaluate the Decision Rules (Context: Finite Wealth, Many Gambles):**
      *   *EMV:* Leads to betting everything on St. Petersburg because expectation is infinite. In a sequence of gambles, this leads to almost sure ruin (Gambler's Ruin). Terrible for finite agents.
      *   *Log Utility:* The standard Bernoulli solution. Resolves St. Petersburg by capping the value based on current wealth. For *many* gambles, it aligns with the Kelly Criterion, which maximizes long-term growth. Very strong candidate.
      *   *Time-Average Growth Rate:* This is essentially the Ergodicity Economics argument (Ole Peters). For multiplicative dynamics (wealth growth), the time average equals the ensemble average of log wealth. It mathematically derives Log Utility from dynamics rather than assuming a psychological utility function. In the context of "many independent gambles across a lifetime," this is arguably the most robust physical justification.
      *   *Prospect Theory:* Descriptive, not prescriptive. Humans overweight small probabilities. This might make someone pay *more* for St. Petersburg (lottery ticket behavior) or less depending on the framing. It doesn't resolve the paradox normatively; it just describes why humans deviate from EMV. Weak for a *rationalist* prescription.

  3.  **Drafting the Ranking & Scores:**
      *   *Constraint:* "Most to least defensible."
      *   *Top Tier:* Time-Average Growth Rate vs. Log Utility. They are mathematically equivalent in multiplicative environments. However, Time-Average is often seen as a *derivation* of Log Utility, making it more fundamental (less arbitrary). Let's put Time-Average slightly ahead or tie them. Given the prompt asks for a ranking, I need to distinguish. Time-Average is more robust because it doesn't require assuming a utility function, it derives it from the dynamics. Log Utility is the specific implementation. Let's rank Time-Average #1, Log Utility #2.
      *   *Middle Tier:* Prospect Theory. It's descriptive. As a normative rule for a rationalist? Poor. But it acknowledges human limits.
      *   *Bottom Tier:* EMV. Suicide for finite wealth in repeated games.
      *   *Scores:*
          *   Time-Average: 9/10 (Resolves paradox via ergodicity, fits "many gambles" constraint perfectly).
          *   Log Utility: 8/10 (Functionally identical to Time-Average here, but often presented as an arbitrary psychological assumption rather than a structural necessity).
          *   Prospect Theory: 4/10 (Descriptive bias, not a normative solution; might even exacerbate the paradox by overvaluing low-probability tails).
          *   EMV: 1/10 (Guarantees ruin in repeated play; ignores finite wealth constraint).

  4.  **Addressing the Variants:**
      *   *Variant 1: Years of Healthy Life.* Utility of life years is not linear, nor necessarily logarithmic. There's a hard cap (death/maximum lifespan). Diminishing returns are steeper. Log utility might still work, but Time-Average growth is harder to define (you can't compound life years multiplicatively in the same way). EMV is definitely out. Prospect Theory might shift (loss aversion on life?). Actually, for life, the "many gambles" constraint breaks down because you only live once (non-ergodic in a sense). If you die, game over. This favors a more conservative approach than Log, perhaps Minimax or a steeper utility curve. Ranking shift: Log/Time-Average drop slightly because the dynamics aren't purely multiplicative wealth.
      *   *Variant 2: Transferable Ticket.* This introduces market pricing. The value becomes what someone else will pay. This moves the problem from decision theory to asset pricing. EMV is still wrong. Log/Time-Average determines the *hold* value, but market value depends on the buyer's utility. If the market is efficient and populated by Log-utility agents, the price converges. This doesn't change the *decision rule* for the holder, but it changes the *outcome*. Actually, if I can sell it, I don't play the game; I arbitrage. The decision rule becomes "Maximise sale price." But assuming I must value it to sell: Log/Time-Average still dictates the floor. No major shift in ranking of the *rules*, but the context changes from consumption to trading.
      *   *Refinement on Variant 1:* If the prize is life years, you cannot "recover" from a loss in the same way (if entry cost is life years). If entry is money and prize is life, it's a conversion problem. If the "many gambles" constraint holds (you face many health gambles), Log/Time-Average still holds for health capital? Maybe. But usually, life is treated as non-renewable. I should note that Time-Average relies on ergodicity, which life violates (death is absorbing). So Log/Time-Average might drop below a more conservative rule, but among the *given four*, Log is still better than EMV.
      *   *Refinement on Variant 2:* Transferability makes the ticket an asset. The value is defined by the market's aggregate utility. If the market is rational (Log), the price is finite. This validates Log/Time-Average as the pricing mechanism.

  5.  **Drafting the Verdict:**
      *   Needs to be one sentence.
      *   Should synthesize the "rationalist" perspective (LessWrong style).
      *   Focus on ergodicity/growth as the physical basis for utility.

  6.  **Review against Constraints:**
      *   Rank 4 rules.
      *   Score out of 10 for classic game.
      *   One sentence justification per score.
      *   Address Variant 1 (Life).
      *   Address Variant 2 (Ticket).
      *   One sentence verdict.
      *   Tone: Intellectual, precise, acknowledging LessWrong context (ergodicity, Kelly, etc.).

  7.  **Polishing the Content (Self-Correction during drafting):**
      *   *Critique:* Is Time-Average really distinct from Log Utility here? In the context of "many independent gambles," maximizing time-average growth *is* maximizing expected log wealth. Distinguishing them might seem pedantic.
      *   *Adjustment:* I will distinguish them by *justification*. Log Utility is often an axiom; Time-Average is a derivation from dynamics. For a LW reader, the derivation is more satisfying than the axiom.
      *   *Critique:* Prospect Theory score. Is 4 too high? It's descriptive. As a *rule* to follow? It's irrational by definition (biases). I'll lower it to 3.
      *   *Critique:* EMV score. 1 is fair.
      *   *Variant 1:* Life years are non-fungible and non-compounding in the same way. The "many gambles" assumption is shaky if one gamble kills you. I need to mention the absorbing state.
      *   *Variant 2:* Transferability implies market efficiency. The "value" becomes intersubjective.

  8.  **Finalizing the Output Structure:**
      *   Ranking List with Scores and Justifications.
      *   Variant Analysis Paragraph.
      *   Verdict Sentence.

  9.  **Final Polish (checking tone):** Ensure it sounds like it's speaking to a peer in the rationalist community (using terms like "ergodicity," "absorbing state," "normative vs descriptive").

  *(Self-Correction on Variant 1)*: If the prize is life years, can you compound them? No. You can't bet your life years to get more life years in a multiplicative way easily. The "Time-Average Growth Rate" rule specifically applies to multiplicative wealth dynamics. If the currency is life, the dynamics change. I should note that Log Utility remains robust (diminishing returns on life years), but Time-Average loses its mathematical derivation. So the ranking between those two might flip or converge. I will argue Log stays strong, Time-Average weakens.

  *(Self-Correction on Variant 2)*: If I can sell the ticket, the "decision" is pricing. The price is determined by the buyer's utility. If the market is rational, the price reflects Log Utility. This strengthens Log/Time-Average as the *pricing* mechanism.

