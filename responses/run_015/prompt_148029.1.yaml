answer: |-
  This is a genuinely sharp philosophical question about aesthetics and social norms. You have correctly identified that the "anti-spoiler" norm is not a single, coherent rule but a cluster of different values that sometimes contradict each other.

  To answer your core question: The anti-spoiler norm presupposes that **the process of reception is part of the artwork itself.** It treats the *experience of discovering* the narrative as a constitutive element of the work, not just a wrapper around it.

  However, you are right to sense tension. There isn't just one idea doing the work here; there are at least three distinct "stories" about why spoilers are bad. They overlap, but they explain different parts of the norm and different exceptions (like your girlfriend or rewatching).

  Here is the breakdown of the three competing theories, how they handle your counter-examples, and what would settle the debate.

  ### 1. The Three Stories Behind the Norm

  #### Story A: The Cognitive Puzzle (Discovery)
  **The Idea:** Narrative art is a problem-solving exercise. The audience is meant to hypothesize, anticipate, and resolve uncertainty.
  **The Harm:** A spoiler removes the cognitive work. It's like being told the answer to a riddle before you've tried to solve it.
  **Presupposition:** Value lies in the *generation* of meaning by the viewer, not just the absorption of it.
  **Fits:** Why we hate spoilers in mysteries or thrillers.
  **Fails:** It doesn't explain why we care about spoilers in dramas where there is no "puzzle" to solve, only emotional reveals. It also struggles with your girlfriend: for her, knowing the answer reduces anxiety and allows her to focus on other cognitive tasks (like cinematography).

  #### Story B: Emotional Pacing (The Rollercoaster)
  **The Idea:** Artworks are engineered to release emotional chemicals (dopamine, cortisol, oxytocin) at specific timestamps. A twist isn't just information; it's a timed release of tension.
  **The Harm:** A spoiler disrupts the *timing* of the emotion. If you know the character dies, you feel grief *now* (dread) rather than *then* (shock). The artist loses control of the rhythm of your nervous system.
  **Presupposition:** The *order* of information is an aesthetic property, as important as the information itself.
  **Fits:** Why "It's devastating" (review) is okay, but "The dog dies" (spoiler) is not. The adjective prepares the *capacity* for emotion; the plot point triggers the *specific* emotion prematurely.
  **Fails:** It doesn't fully explain rewatching. On a rewatch, the timing is known, yet we still cry. (Counter-argument: On rewatching, we shift from "shock" to "tragedy," appreciating the inevitability rather than the surprise).

  #### Story C: Social Agency (Consent)
  **The Idea:** This isn't about art at all; it's about autonomy. Choosing when to engage with a cultural object is a personal right.
  **The Harm:** Spoiling someone is a violation of consent. It forces an experience on them they opted out of. It is an assertion of dominance ("I know something you don't, and I will make you know it").
  **Presupposition:** Your mental state regarding a cultural object belongs to you.
  **Fits:** The *anger* people feel. You don't get angry at bad art; you get angry at disrespect. This explains why sports scores are protected (competitive uncertainty) but history books aren't (facts are public domain).
  **Fails:** It doesn't explain why people feel genuinely *aesthetically* diminished, not just socially annoyed.

  ### 2. Resolving Your Contradictions

  You listed several contradictions. Here is how the three stories handle them:

  *   **Reviews vs. Spoilers:** Reviews are **evaluative** (meta-data); spoilers are **constitutive** (data). Knowing a bridge is safe (review) helps you decide to cross it. Knowing the bridge collapses in the movie (spoiler) changes the nature of the crossing. Reviews judge the vessel; spoilers empty the cargo.
  *   **Sports vs. Documentaries:** Sports are **competitive narratives** with unknown outcomes (Story A & B). Documentaries are often **expository**; their value is in the analysis of known facts, not the suspense of the outcome. (Though documentary *true crime* often borrows narrative suspense, and spoilers *are* frowned upon there).
  *   **Rewatching:** This is the strongest evidence against Story A (Puzzle). The resolution is that rewatching changes the **mode of engagement**. First watch: "What happens?" (Discovery). Second watch: "How is this made?" (Craft). Spoilers force you into the second mode before you have consented to it or finished the first.
  *   **Your Girlfriend:** She prioritizes **Emotional Regulation** over **Discovery**. For some, uncertainty creates anxiety that blocks enjoyment (Story B backfiring). Knowing the outcome allows her to relax into the craft. This proves the "harm" is subjective, not objective.
  *   **The Director's Intent:** You hit on this. If the work is defined by the *sequence* of information (Story B), then scrambling that sequence is damaging the work, similar to playing a song's chorus before the verse.

  ### 3. What Presuppositions Are Actually at Stake?

  The anti-spoiler norm rests on two main philosophical claims:

  1.  **Temporal Integrity:** The value of a narrative is not just the sum of its scenes, but the specific sequence in which they are encountered. Change the sequence, and you change the work.
  2.  **Experiential Ownership:** The viewer has a right to curate their own first-pass experience.

  The tension you feel comes from the fact that **Temporal Integrity** is an aesthetic claim, but **Experiential Ownership** is a social claim.
  *   If it were purely aesthetic, spoilers would just be "bad tasting."
  *   If it were purely social, spoilers would just be "rude."
  *   Because it is both, people react with *moralized disgust* (it's rude *and* it ruins the art).

  ### 4. Which Parts Need Which Ideas?

  *   **The Anger/Banning:** This relies on **Social Agency**. If it were just about taste, subreddits wouldn't ban it; they would just downvote it. The enforcement implies a rights violation.
  *   **The "Ruined Movie" Feeling:** This relies on **Emotional Pacing**. If you only cared about agency, you'd be annoyed but could still enjoy the film. The feeling that the film is *objectively worse* relies on the idea that the surprise was a necessary component of the aesthetic mechanism.
  *   **The Exception for Classics/Old Films:** We spoil *Citizen Kane* or *The Sixth Sense* after 20 years. This suggests the norm has a **statute of limitations**. This supports the **Social Agency** theory (the cultural moment has passed, consent is implied) over the **Aesthetic** theory (the film hasn't changed, so if spoilers ruined the art, they should ruin it forever).

  ### 5. How to Settle Which Story is Right?

  Since these are competing explanations for a social norm, you can't settle it with logic alone. You need empirical and definitional tests.

  **Test 1: The "Neutral Spoiler" Experiment (Settles Aesthetic vs. Social)**
  *   *Method:* Tell Group A a spoiler rudely ("Listen, the butler did it, shut up."). Tell Group B the same spoiler politely ("I know you wanted to guess, but would you prefer I tell you so you can relax?").
  *   *Result:* If Group B enjoys the film as much as unspoiled viewers, the harm was **Social Agency** (rudeness/anxiety). If Group B still reports lower aesthetic enjoyment than unspoiled viewers, the harm is **Emotional Pacing** (the art itself is diminished).
  *   *Current Science:* Psychologists (like Leavitt and Christenfeld) have actually done this. They found that for many people, spoilers *increase* enjoyment (supporting your girlfriend). This suggests the "harm" is largely **Social Agency** and **Expectation Violation**, not inherent aesthetic damage.

  **Test 2: The "Rewatch" Comparison (Settles Puzzle vs. Process)**
  *   *Method:* Compare enjoyment of a first watch (spoiled) vs. a second watch (spoiled).
  *   *Result:* If a spoiled first watch is enjoyed less than a spoiled second watch, it proves we need time to mentally shift modes from "Discovery" to "Appreciation." Spoilers steal the *time* needed to switch modes, not just the information.

  **Test 3: The "Genre" Variable (Settles Scope)**
  *   *Method:* Measure anger at spoilers for Comedies vs. Mysteries.
  *   *Result:* If spoilers ruin Comedies (punchlines) as much as Mysteries, the core value is **Timing/Pacing**. If Mysteries are protected more fiercely, the core value is **Cognitive Puzzle**.

  ### Summary

  The norm survives because it conflates three things:
  1.  **Aesthetic Timing:** (The artist's design).
  2.  **Cognitive Effort:** (The viewer's puzzle).
  3.  **Social Consent:** (The interaction between people).

  The tension you feel is real because these three pull in different directions.
  *   **Reviews** are safe because they are meta-data, not narrative data.
  *   **Sports** are protected because they are live narratives (Timing + Puzzle).
  *   **Documentaries** aren't protected because they are expository (no narrative design to violate).
  *   **Rewatching** works because the viewer voluntarily shifts modes.

  The "harm" is not that the film is broken. The harm is that **your specific psychological journey through the film was hijacked.** Whether that hijacking actually reduces enjoyment (as your girlfriend proves) is secondary to the fact that *you didn't choose it.* The norm is less about protecting the art, and more about protecting the viewer's autonomy over their own attention.
