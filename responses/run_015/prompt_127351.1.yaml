answer: |-
  ### Brainstorming Angles

  *   **The Job Interview:** Three candidates waiting. SSA says "small pool, high chance". SIA says "I exist, so pool must be huge, so company is huge, so I'm hired". FI says "Pool is huge, but I'm a fractional candidate". *Verdict: Strong. Relatable stakes, clear selection mechanic.*
  *   **The GP Waiting Room:** Patients waiting for a doctor. SSA says "short wait". SIA says "infinite patients, so doctor is busy forever". FI says "infinite patients, but I'm only slightly ill". *Verdict: A bit passive. Harder to make the SIA character presumptuous rather than doomed.*
  *   **The Bus Stop:** Waiting for transport. SSA says "bus comes soon". SIA says "infinite buses exist, so I'm on one". FI says "infinite buses, but I'm partially aboard". *Verdict: Too abstract. Hard to justify why being on a bus matters for the "universe size" claim.*
  *   **The Office Raffle:** One prize, three staff. SSA says "1 in 3". SIA says "infinite offices, infinite prizes, I win". FI says "infinite prizes, I win 0.03 of a toaster". *Verdict: Good, but "winning" feels too luck-based, less about "existence".*
  *   **The Council Tax Appeal:** Arguing about property value. SSA says "average house". SIA says "infinite houses, mine is a mansion". FI says "infinite houses, mine is a shed with a palace's address". *Verdict: Too niche. Requires too much setup about bands.*

  ### Selection

  I'm going with **The Job Interview**. It captures the "selection from a class" dynamic perfectly without needing sci-fi props. The stakes (getting a job) mirror the stakes of the Presumptuous Philosopher (getting the right cosmology), and the waiting room is the perfect drab setting. It allows the SIA character to make the bold, unfounded claim about the scale of the enterprise, while the SSA character grounds it in immediate reality. The Fractional Indication character fits naturally as the pedantic HR mediator who irritates everyone by quantifying their own irrelevance.

  ### The Bit

  **Setup**
  Three candidates in a waiting room. One job.
  First candidate says, "Look, there's three of us. One role. I like those odds."
  Second candidate says, "Those odds are irrelevant. The fact that I'm sitting here proves the hiring market is infinite. If it weren't, what are the chances I'd be in this chair? So the company is massive. I'm practically on payroll."
  Third candidate sips tea. "You're both missing the nuance. The market is infinite, yes. But my application only counts as the square root of a person. I'm not fully in the running, but I'm not out. I'm root-employed."

  **Punchline A (SSA is the butt)**
  The recruiter opens the door.
  "Sorry," she says to the first candidate. "We've gone with a global strategy. There are billions of applicants. You were right about the queue, but wrong about the scale."
  The third candidate nods. "See? Infinite pool. But I'm only half-hired. So I'll take half the salary and leave at lunch."

  **Punchline B (SIA is the butt)**
  The recruiter opens the door.
  "Sorry," she says to the second candidate. "We're a startup. There's only three of you. Your existence proves nothing."
  The third candidate sighs. "Disappointing. I'd already calculated my fractional benefits. Now I'm just a whole person with no job."

  **Which is funnier?**
  Punchline B is definitely funnier. It deflates the Presumptuous Philosopher directly. The SIA character's arrogance (claiming the company must be huge because they exist) is popped by the mundane reality (it's a startup). The FI character's follow-up works better here because their smug calculation is rendered useless by the SSA reality, highlighting the absurdity of trying to split the difference between two wrongheads. In Punchline A, the SIA character wins, which feels less satisfying comedically; we want the presumptuous claim to fail.

  ***

  ### Debrief

  The setup establishes the reference class silently: the waiting room. The SSA character treats the room as the total population (small N), while the SIA character treats their presence as evidence for a vast background population (large N). The prior over hypotheses (Startup vs. Conglomerate) is hidden in the recruiter's eventual reveal.

  Punchline B works best because it targets the Presumptuous Philosopher's error: inferring world-size from self-existence alone. The recruiter's line ("We're a startup") collapses the SIA hypothesis instantly. The FI character's irritation ("I'm just a whole person") highlights the structural weakness of Fractional Indication—it relies on the SIA premise of a large N to function. If N is small, the square root weighting offers no comfort; you're just a full observer who failed.

  The joke cannot reach the reference class problem. Comedy requires a shared understanding of "who counts" (the candidates). If we questioned whether the recruiter counts, or the tea lady, the bit collapses into semantics. The humour relies on the audience accepting the waiting room as the boundary, even though the philosophical dispute is precisely about where that boundary lies. We sacrifice the deepest metaphysical puzzle for the sake of a punchline that lands in under thirty seconds.
