      *   *Specific Constraint:* "Where you rely on something that has arguably already been observed, say whether you are confident of it or extrapolating." I need to be careful about claiming empirical facts. I should lean on software engineering principles (e.g., verification costs) which are well-established.

  6.  **Final Polish:**
      *   Check against the "Control-First" definition provided.
      *   Ensure the distinction between "Refutation" (position is false) and "Reweighting" (position is true but less useful) is clear.
      *   Address the "Insulation" point sharply.

  7.  **Final Output Structure:**
      *   Executive Summary (The Map).
      *   Tier 1: The Economic and Security Ceilings (Refutation).
      *   Tier 2: The Epistemic Leaks (Reweighting).
