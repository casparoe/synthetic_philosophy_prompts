      *   Conclusion.

  *(Self-Correction on the "Asymmetry" point)*: I need to be careful. A monitor doesn't need to be *as* capable, just capable enough to verify the *output*. But if the output is complex code, verifying correctness is as hard as writing it (asymptotically). This is a strong argument.

  *(Self-Correction on "Decomposition")*: The user wants a "worked estimate." I can't give a specific number, but I can give a framework for estimating it (e.g., ratio of verification lines to code lines, or time spent). I should reference the "verification bottleneck" in formal methods.

  *(Self-Correction on "Insulation")*: This is crucial. If "more control" is the only answer to failure, when do you stop? The answer must be "when cost exceeds benefit." If the safety case ignores cost, it's not a safety *case*, it's a safety *demand*.

