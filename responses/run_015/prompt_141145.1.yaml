      *Refining the "Name":* There isn't a single, universally recognized proper noun (like "Arrow's Theorem") for exactly this *diachronic* variant where individuals remain consistent. It is essentially the Discursive Dilemma extended into time. However, in political science and organizational theory, this is often discussed under **Sequential Voting Inconsistency** or **Diachronic Collective Rationality Failure**.
      *Wait, is there a more specific term?*
