      Consider "Path Dependence" (Pierson, Mahoney). That's about history constraining future choices, not necessarily logical inconsistency.
      Consider "Dynamic Inconsistency" (Kydland & Prescott). That's about policy preferences changing over time, usually at the individual or planner level.
      Consider "Sequence Independence" in Judgment Aggregation. Dietrich and List have work on this.
      *Verdict:* There is no single "established name" like "The Smith-Jones Paradox." It is best characterized as a **Diachronic Discursive Dilemma** or **Sequential Judgment Inconsistency**. I should probably state there is no single established name but point to the nearest concepts.

