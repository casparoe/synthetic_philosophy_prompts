  3.  **Evaluate Potential Names/Concepts:**
      *   *Discursive Dilemma/Doctrinal Paradox:* This is the synchronic version. Premises $P, Q \vdash R$. Vote on $P$ (Yes), Vote on $Q$ (Yes), Vote on $R$ (No). The user's case is $A$ (Yes), $B$ (Yes), $A \land B$ (No). This is logically equivalent to the conclusion-based vs. premise-based conflict, *but* separated by time.
      *   *Dynamic Consistency / Diachronic Rationality:* Usually applies to individual choice (e.g., preference reversal over time). Here it's collective.
      *   *Path Dependence:* This is close. Path dependence usually means the outcome depends on the sequence of decisions. If we voted on "A & B" first, we might have said No, then A, then B. But path dependence usually implies the *final* outcome changes based on order. Here, the final outcome is a set of decisions that are mutually inconsistent.
      *   *Sequential Voting Paradox:* Often refers to cycling (Condorcet).
      *   *Judgment Aggregation over Time:* There is literature on "sequential judgment aggregation" or "dynamic judgment aggregation."
      *   *The "Multiple Election Paradox":* This is a specific term often used when voters vote on multiple related propositions separately, leading to an inconsistent set. However, that is usually synchronic.
      *   *Diachronic Discursive Dilemma:* This seems the most accurate descriptive term, but is it "established"? Not really a standard textbook term like "Condorcet Paradox."
