answer: |-
  This is a sharp observation. You have identified a structural feature of collective decision-making that is logically isomorphic to the doctrinal paradox (discursive dilemma) but topologically distinct because it unfolds over time rather than across a single agenda.

  In the literature, there is no single, canonical proper noun for this specific diachronic variant (unlike "Condorcet's Paradox" or "Arrow's Theorem"). It is typically discussed as a subclass of **sequential judgment aggregation** or under the broader heading of **collective diachronic rationality**. However, because it mirrors the logical structure of the discursive dilemma while relying on temporal separation to hide the inconsistency, the most precise conceptual label is the **Diachronic Discursive Dilemma**.

  Here is the carving you requested, distinguishing this phenomenon from its nearest neighbors.

  ### 1. The Core Structure
  The phenomenon you describe relies on three conditions:
  1.  **Synchronic Consistency:** At any time $t$, the collective judgment set $J_t$ is logically consistent.
  2.  **Individual Stability:** For every member $i$, their judgment set over time $J_{i, t_1} \cup J_{i, t_2}$ is logically consistent (no individual contradicts themselves).
  3.  **Diachronic Inconsistency:** The union of collective judgments over time $J_{t_1} \cup J_{t_2}$ is logically inconsistent.

  The "smell" is the same as the doctrinal paradox because the aggregation rule (majority) fails to preserve logical closure. The difference is that in the standard doctrinal paradox, the inconsistency is *immediate* and *visible* upon adjournment. In your cases, the inconsistency is *latent*, revealed only by the existence of a future agenda item that connects logically to a past decision.

  ### 2. Differentiation from Nearest Concepts

  **(a) Versus the Ordinary Discursive Dilemma**
  The ordinary dilemma is synchronic: premises and conclusion are on the table simultaneously. The diagnosis there is often procedural (premise-based vs. conclusion-based voting). In your case, the procedure *was* consistent (conclusion-based voting on each motion as it arose). The failure is not in the procedure at $t$, but in the **institutional memory**. The committee lacks a mechanism to check new motions against the logical closure of *past* motions, only against past *precedents* (which are often treated as distinct cases). The ordinary dilemma is a failure of aggregation at a moment; yours is a failure of aggregation across a timeline.

  **(b) Versus a Group Changing Its Mind**
  If a group changes its mind, the inconsistency is explained by preference reversal. $J_{t_1} = \{A\}$, $J_{t_2} = \{\neg A\}$. This is rational if preferences shift. In your finance committee case, no individual reversed their preference on the underlying principles. The inconsistency arises because the *coalition* required to pass $A$ (5 members) and the coalition to pass $B$ (5 members) are not the same coalition required to pass $A \land B$ (which might require a different 5, or the same 5 might balk at the cost). The group didn't change its mind; the **intersection of winning coalitions** shifted.

  **(c) Versus Path Dependence**
  Path dependence usually implies that the *final outcome* depends on the sequence (e.g., voting on $A$ then $B$ yields a different result than $B$ then $A$). Your case is stronger: it's not just that the outcome differs, but that the **outcome set is impossible**. However, it is a specific species of path dependence: **Logical Path Dependence**. If the agenda had been ordered $\{A \land B, A, B\}$, the inconsistency might have been avoided (by rejecting $A \land B$ first). The diagnosis here is that the agenda-setting power failed to recognize the logical dependency between temporally separated items.

  **(d) Versus Membership Turnover (The Curriculum Case)**
  This is the subtlest distinction. If the membership changes, is it the same agent?
  *   **Individualist View:** If the group is just the sum of its members, the Curriculum Committee Year 1 and Year 2 are different agents. There is no paradox, just two different groups making decisions that happen to clash.
  *   **Corporate View:** If the committee is a continuous institutional entity (which legal and procedural norms usually assert), then it is the *same* phenomenon as the Finance Committee. The "individual stability" condition is relaxed to "institutional stability," but the collective irrationality remains. The diagnosis changes slightly: in the Finance case, it is an aggregation failure; in the Curriculum case, it is an **identity failure**. The institution failed to bind its future self, partly because the "self" changed personnel.

  **(e) The Rescission Motion Nuance**
  If a motion to rescind the earlier decision fails, the diagnosis shifts from "unintended inconsistency" to **"stable inconsistency."** It reveals that the group values the transaction cost of reversing a decision (or the political capital involved) higher than logical consistency. This moves the phenomenon out of pure social choice theory and into **institutional stickiness**. It confirms that the inconsistency is not a glitch, but a feature of the rules: the rules allow the group to lock in contradictions if the cost of unlocking them is too high.

  ### 3. Conclusion
  You are dealing with a **Diachronic Discursive Dilemma**. It is the familiar paradox with a time index, but the time index matters because it bypasses the usual cognitive checks (seeing the whole table at once) and exploits the friction of institutional memory. It differs from simple mind-changing because the individuals are stable; it differs from standard path dependence because the result is logically impossible, not just sequence-sensitive.

