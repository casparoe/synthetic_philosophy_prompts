answer: |-
  Here is the committed read on Roz, the rule she's running, and how to break it open for your seminar.

  ### The Verdict
  **She will say the meeting was adjourned at 9:47.**
  **Odds:** 70/30.

  ### The Rule She Is Running
  Roz is operating on a principle of **Institutional Archivalism**.

  For unilateral, authoritative performatives (sentencing, resigning, adjourning), she does not require *psychological uptake* by the target audience (the defendant, the dean, the faculty). Instead, she requires **procedural issuance into the institutional record**.

  *   **Why the Sentencing Case controls:** In the sentencing case, the *defendant* (the target) didn't hear, but the *Court* (the institution: clerk, prosecutors, reporter) did. The act was valid because it entered the institutional record immediately.
  *   **Why the Email Case supports this:** She explicitly decoupled the speech act validity from the "effect" (when the dean read it). The act happened at dispatch because it entered the *channel of record*.
  *   **Why the Chat Proviso is a red herring:** When she said "provided people are looking at the chat," she wasn't setting an uptake condition; she was defining the **publicity condition** of the medium. For text, "public" means "visible on the screen." For speech, "public" means "audible in the room." However, in your case, the *transcript* functions as the "Clerk" from the sentencing case. The autotranscription software is the institutional reporter. Because the utterance was captured by the official recording mechanism, it satisfies the archival requirement, even if the human audience was temporarily deafened by technical failure.

  She will treat the audio drop as a **transmission glitch**, not a **procedural misfire**. The Chair had the authority, used the correct words, and the utterance was captured by the official record. The fact that human ears didn't catch it live is an "abuse" of the meeting management (lousy tech check), not a voiding of the performative.

  ### The Closest Analogue
  **The Sentencing Case** is doing the heavy lifting here.
  In both cases, the primary target of the speech act (defendant / faculty) is ignorant at the moment of utterance. In both cases, a secondary institutional agent (clerk-reporter / autotranscript) captures the utterance. Roz's verdict on sentencing establishes that *institutional witnessing* substitutes for *target uptake*.

  The **Email Case** is the secondary support, insulating her from your question about "when it took effect." She will likely repeat her dodge: "Whether the *consequences* kick in at 9:47 or when you read the summary is a matter of faculty bylaws; the *speech act* of adjournment occurred at 9:47."

  ### The Weak Point (And How to Exploit It)
  Your current case is vulnerable because it conflates **channel failure** (speakers died) with **record failure** (nobody heard). Roz might pivot and argue that for *spoken* performatives in a *physical room*, the "publicity condition" requires *potential* audibility, not just archival capture. If the speakers were dead, the "room" was not a valid venue for speech acts, much like the web-ordained officiant was not a valid authority.

  To force her hand and distinguish **Archivalism** (Record = Act) from **Publicity** (Potential Uptake = Act), you need to remove the transcript.

  ### The Variant To Rebuild The Case
  **The "Black Box" Variant:**
  Keep the scenario exactly the same (audio drops, no one hears, Chair speaks), **but the recording system malfunctioned and no transcript was generated.** The only evidence that she said "meeting adjourned" is the Chair's own testimony two weeks later.

  *   **If she says "Still Adjourned":** She is a pure **Intentionalist/Authority Absolutist**. The Chair's word is law; the record is just evidence, not a condition.
  *   **If she says "Not Adjourned" (Misfire):** She is a **Publicity Conventionalist**. The act requires the utterance to be *made public* to the relevant body. Without the recording, and without ears to hear, the act vanished into the void.
  *   **Why this works:** This strips away the "Clerk/Reporter" analogue from the Sentencing case. It forces her to decide if the *Chair's authority alone* is sufficient, or if the *community's access* is a constitutive rule of the act.

  ### Seminar Handout Advice
  If you stick with the original case (with the transcript), prepare your students for the **"Dispatch vs. Receipt"** debate. Roz will likely frame it as: *"The act was issued correctly into the official channel; the failure of the audience to monitor that channel is their problem, not a voiding of the act."*

  If you use the **Black Box Variant**, you force the **"Constitutive vs. Evidentiary"** debate. Is the record part of *what makes* the act happen, or just proof that it happened? Given her "Chat" proviso ("provided people are looking"), I suspect she will crack on the Black Box variant and call it a **misfire**. That contradiction (Valid with transcript, Invalid without) is gold for a seminar discussion on the role of materiality in speech acts.

  **Recommendation:** Run the **Black Box Variant**. It prevents her from hiding behind the "legal rule" dodge (since there's no transcript to trigger legal timelines) and directly tests whether she prioritizes the *Speaker's Authority* or the *Audience's Accessibility*.
