  Consider a macroscopic Maxwell's demon constructed as a pressure-sensitive mechanical latch system operating in a vacuum, where the "memory" is the position of a rigid lever that blocks or allows gas particles to pass between two chambers. The lever is actuated by a perfectly conservative spring mechanism isolated from any thermal bath during the reset phase, allowing the lever to be returned to its neutral "0" position adiabatically and reversibly without dissipating heat, effectively achieving a logical erasure (resetting the lever state regardless of its prior history) at zero immediate thermodynamic cost. The demon operates by allowing the lever to be displaced by particle impacts (measurement), sorting fast particles to one side, and then using the conservative spring to snap the lever back to neutral (erasure) before the next cycle, seemingly bypassing the heat dissipation usually required to reset a bit.

  According to Landauer's standard account, this setup should theoretically succeed in violating the Second Law because the principle posits that the minimum energy cost of computation is tied specifically to the logically irreversible step of erasure; if you engineer a physical substrate where that erasure step is physically reversible (adiabatic and conservative), Landauer's bound suggests no heat must be dumped, implying the work extracted from the sorted gas should be net positive. However, the demon actually fails to produce net work because the entropy increase is not generated during the erasure step but during the measurement interaction itself, where the phase space of the combined gas-lever system expands due to the establishment of correlations between the particle velocities and the lever position. The hidden assumption doing the work here is that the measurement coupling is thermodynamically transparent, meaning it assumes the physical interaction required to correlate the demon's memory with the gas state does not itself incur a phase-space volume penalty or require work input to maintain the necessary non-equilibrium conditions. If you strip away that assumption and acknowledge that establishing the correlation requires a work investment equal to the information gained (or equivalently, that the lever must be thermalized to be reusable), the scenario reverts to Szilard's original formulation where the cost is paid during measurement rather than erasure, rendering Landauer's specific focus on memory reset redundant for this particular mechanical realization while still preserving the Second Law.
