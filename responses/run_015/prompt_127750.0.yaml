  In a controlled neurology ward trial, a patient with chronic neuropathic pain undergoes a targeted intervention that surgically isolates the neural correlate of consciousness from the motor-output pathways responsible for verbal reporting, ensuring that the subjective feeling of pain cannot physically trigger the speech act. Despite this causal severance, the physical nociceptive signals still bypass the phenomenal center to activate the language centers directly via a preserved parallel pathway. When the physician asks, "What does it feel like?" the patient reliably answers, "It feels like burning," accurately describing the inert phenomenal quality even though that quality played no role in generating the answer, creating a situation where the judgment is veridical but causally disconnected from the experience it describes.

  The epiphenomenalist argues this scenario simply makes explicit what is always true: the physical brain state causes both the inert qualia and the verbal report, so the correlation is guaranteed by a common cause rather than direct interaction. They claim the judgment comes out right because the physical substrate is reliable, not because the feeling pushes the belief into place. An interactionist or physicalist opponent counters that this renders the accuracy miraculous, arguing that without a causal link, the belief is not actually *about* the experience but merely a parallel physical event that happens to match it, undermining any claim to knowledge. The feature doing the heavy lifting here is the stipulation of the parallel physical pathway, which allows the report to occur without the qualia's involvement, forcing us to confront whether causal power is necessary for reference. A defender of epiphenomenalism might attack this case by arguing the intervention is incoherent, claiming that if the patient is truly describing the phenomenal quality, there must be a causal link, and if there isn't, the judgment is not genuinely phenomenal but merely a report on physical states disguised as introspection.
