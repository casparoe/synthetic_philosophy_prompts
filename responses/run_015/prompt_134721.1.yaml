  **Joint Statement on the Scope and Substance of Kantian Universalizability in Collective Harm Contexts**

  **Preface**
  Following an adversarial collaboration regarding the efficacy of Immanuel Kant's moral framework in addressing distributed agency and collective harm, the undersigned parties—one defending the universalizability tests as substantive moral criteria, the other critiquing them as merely formal consistency checks—submit this joint statement. Our discussion centered on the Formula of Universal Law (FUL) and the Formula of Humanity (FH), specifically applying them to cases of incremental environmental degradation and resource depletion rather than classic interpersonal violations. While we remain divided on the generative power of the tests, we have clarified the structural commitments of our respective positions.

  **I. Agreed Claims Regarding the Formulations**
  We endorse the following propositions as accurate descriptions of the Kantian framework under discussion, regardless of our divergent evaluations of their moral sufficiency:

  1.  **The Primacy of the Maxim:** Both the FUL and FH operate on the principle that moral evaluation targets the *maxim* (the subjective principle of volition) rather than the isolated action or its consequences alone.
  2.  **Contradiction in Conception (CC):** We agree that a contradiction in conception occurs when the universalization of a maxim renders the action itself impossible or inconceivable within the resulting state of affairs.
  3.  **Contradiction in Will (CW):** We agree that a contradiction in will occurs when an agent cannot consistently will the universalization of a maxim without undermining something that a rational agent necessarily wills (e.g., the development of talents or the aid of others).
  4.  **The Status of Humanity:** We agree that the FH requires treating rational nature, whether in oneself or another, always as an end and never merely as a means, implying constraints on how agents may interact with the conditions necessary for rational agency.
  5.  **The Challenge of Distributed Harm:** We agree that cases involving incremental contributions to collective harm (e.g., carbon emissions, groundwater depletion) constitute the primary stress test for whether the FUL and FH can generate specific duties without relying on external consequentialist calculations.
  6.  **Contextual Dependence:** We agree that the formulation of a maxim must include the agent's relevant circumstances, though we disagree on the threshold of relevance required to trigger a contradiction.

  **II. Table of Disagreements**
  The following table outlines our divergent interpretations regarding the substantive reach of the universalizability tests and their application to aggregate patterns.

  | Issue | Defender's Position (Substantive Criterion) | Critic's Position (Formal Consistency) |
  | :--- | :--- | :--- |
  | **Substantive Moral Conclusions** | The FUL and FH yield specific moral duties directly from the structure of rational volition; empirical facts about harm inform the maxim but do not constitute the moral ground. | The FUL and FH identify logical inconsistencies only; substantive moral conclusions require smuggled empirical premises regarding harm that are not inherent to the formal test itself. |
  | **Aggregate Patterns vs. Individual Maxims** | Universalization inherently tests the *aggregate* effect of everyone acting on the maxim; if the aggregate outcome undermines the action's possibility or rational will, the individual maxim is forbidden. | Universalization tests the *concept* of the individual action; aggregate outcomes are consequentialist data points that cannot generate a formal contradiction for the individual agent. |
  | **Role of Empirical Premises** | Empirical premises (e.g., "carbon causes warming") are necessary contextual conditions for the maxim, which rationality requires us to acknowledge when testing universalizability. | Empirical premises are external inputs; if the test requires specific empirical knowledge to find a contradiction, the test is not purely rational and fails as a priori moral law. |
  | **Temporal Scope of FH** | The requirement to treat humanity as an end extends to the preservation of conditions necessary for future rational agency, binding present agents to future generations. | The FH applies to existing rational beings; potential future humanity does not possess the status of "ends in themselves" capable of grounding a contradiction in will for present agents. |

  **III. The Cruxes of the Debate**
  We identify two specific philosophical cruxes where our interpretations diverge most sharply. For each, we specify a concrete case and our respective predictions regarding what the Kantian test demonstrates.

  **Crux 1: Collective-Action Cases and Hidden Contradictions**
  *   **The Question:** Do collective-action cases involve hidden contradictions in the individual maxim once ecological and temporal dependencies are made explicit, or does the individual act remain logically consistent regardless of aggregate harm?
  *   **Concrete Case:** An individual agent adopts the maxim: "I will operate a high-emission vehicle for personal convenience whenever public transit is unavailable, despite knowing this contributes incrementally to climate instability."
  *   **Defender's Prediction:** When universalized, this maxim leads to a Contradiction in Conception. If everyone acts on this maxim, the ecological stability required for the reliable use of vehicles (and the safety of the agents) collapses, making the maxim inconceivable in a world of universal law.
  *   **Critic's Prediction:** The test yields no contradiction. The individual act of driving remains logically possible even if everyone does it; the resulting climate instability is an empirical bad outcome, not a logical impossibility. The contradiction arises only if one smuggles in the premise "I will drive only if the climate remains stable," which is not part of the original maxim.

  **Crux 2: Discounting Future Welfare and Contradiction in Will**
  *   **The Question:** Does a maxim that discounts distant future welfare introduce a contradiction in will analogous to temporal partiality, or is preferring present convenience over future viability rationally permissible?
  *   **Concrete Case:** An agent adopts the maxim: "I will extract non-renewable resources at the maximum rate profitable today, accepting that this will render them unavailable for agents 100 years hence."
  *   **Defender's Prediction:** This generates a Contradiction in Will. A rational agent necessarily wills the preservation of the conditions for rational agency. Willing a world where future agency is impossible contradicts the necessary will to sustain rational nature (via FH), even if the future agents do not yet exist.
  *   **Critic's Prediction:** This generates no contradiction. A rational agent can consistently will their own present advantage over the potential advantage of non-existent beings. To claim otherwise is to impose a consequentialist duty to maximize future welfare, which contradicts the formal nature of the CW test.

  **IV. Identification of Verbal vs. Substantive Disagreement**
  We acknowledge that a portion of our dispute is verbal rather than substantive, centering on the **individuation of maxims**.

  *   **The Verbal Dispute:** The Defender tends to formulate maxims with thick descriptive content (e.g., "I will drive... *knowing it contributes to system collapse*"), whereas the Critic formulates maxims with thin descriptive content (e.g., "I will drive... for convenience").
  *   **Resolution:** If the disagreement rests solely on how much empirical context must be included in the maxim's description before the test is applied, this is a verbal dispute about the rules of maxim individuation. However, if the Critic maintains that *no* description including empirical harm can generate a *logical* contradiction (only a pragmatic one), the disagreement remains substantive regarding the nature of rationality itself. We conclude that while maxim individuation accounts for some friction, the core disagreement regarding whether logical consistency can capture collective harm obligations remains substantive.
