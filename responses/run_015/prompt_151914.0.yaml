answer: |-
  ### Smuggled Commitments in Your Framing

  Before refining the list, you must recognize two commitments your request presupposes. If your committee does not share these, the desiderata will fail.

  1.  **Determinacy:** You ask for a theory that allows the committee to "actually reach a decision." This excludes indeterminist views (where reasons run out and no unique right answer exists). *Status: Contested.* Many philosophers argue moral dilemmas are genuinely undecidable.
  2.  **Individual Justifiability:** You require a justification "addressable to each individual loser." This smuggles in a contractualist constraint. Pure aggregative views (like Utilitarianism) justify decisions to the *collective*, not necessarily to the individual sacrificed. *Status: Contested.* This is the core divide between contractualism and consequentialism.

  If you remove these, the list becomes a menu of options rather than a filter for a decision procedure. I have retained them below because your role requires a decision, but I have flagged them as philosophical commitments, not neutral requirements.

  ---

  ### Refined Desiderata for Interpersonal Aggregation

  I have collapsed your eight points into five functional requirements. I discarded the "future claimants" point (vi) as out of scope for a regional annual budget, and collapsed the "ontology of aggregation" (viii) into Description Invariance.

  **1. Description Invariance (The Framing Constraint)**
  *   **Specification:** The moral verdict must not change when the same state of affairs is described differently (e.g., one person suffering ten harms vs. ten people suffering one harm; one life segment vs. a whole life).
  *   **Motivating Case:** Your "single patient described as several harms" example. If moral weight shifts based on linguistic or conceptual carving, policy becomes manipulable.
  *   **Status:** **Non-negotiable** for policy stability.
  *   **Confidence:** *Settled as a requirement.* Almost all theories claim to satisfy this, though many fail it in practice.

  **2. The Aggregation Threshold (The Numbers Constraint)**
  *   **Specification:** The theory must specify whether and when many small losses can outweigh one catastrophic loss. It must avoid the "tyranny of small sums" (where trivial costs to millions always outweigh a death) and the "tyranny of the one" (where one severe need always trumps any number of minor needs).
  *   **Motivating Case:** Your "thousand patients each carrying a small probability" vs. "one patient facing ten years disabling."
  *   **Status:** **Non-negotiable** for budget allocation.
  *   **Confidence:** *Highly Contested.* There is no consensus on where the threshold lies, or if it exists.

  **3. Risk Sensitivity (The Probability Constraint)**
  *   **Specification:** The theory must state whether it aggregates *expected* value (probability × outcome) or cares about the *distribution* of risk (ex-ante vs. ex-post).
  *   **Motivating Case:** One person certain to suffer vs. 1,000 people with a 1/1,000 risk.
  *   **Status:** **Non-negotiable** for health systems (which deal in probabilities).
  *   **Confidence:** *Contested.* Ex-ante prioritarianism and ex-post utilitarianism diverge here.

  **4. Priority Sensitivity (The Severity Constraint)**
  *   **Specification:** The theory must state whether the absolute size of the benefit matters more, or the starting position of the recipient. Does saving a life count for more if the person is already worse off?
  *   **Motivating Case:** Your "worse-off-anyway" point (vii).
  *   **Status:** **Preference of a camp** (Prioritarians vs. Utilitarians), but practically essential for health equity mandates.
  *   **Confidence:** *Contested.*

  **5. Individual Justifiability (The Reciprocity Constraint)**
  *   **Specification:** The rationale for the decision must be intelligible and acceptable (in principle) to the losing claimant, not just to the winners or the administrator.
  *   **Motivating Case:** Your requirement to "offer each losing claimant a justification."
  *   **Status:** **Non-negotiable** *given your framing*, but excludes pure summing theories.
  *   **Confidence:** *Contested.* This is the defining feature of contractualism.

  ---

  ### Incompatibilities and Tensions

  *   **The "Impossible Trinity":** It is widely suspected (though not proven) that you cannot simultaneously satisfy **Description Invariance**, **Aggregation Threshold**, and **Individual Justifiability** perfectly.
      *   To satisfy *Justifiability*, you often need to treat people separately (non-aggregation).
      *   To satisfy *Aggregation Threshold* (handling large numbers), you must aggregate.
      *   To satisfy *Description Invariance*, you must treat intra- and interpersonal trade-offs similarly, which often undermines *Justifiability* (since I can sacrifice my present self for my future self in ways I cannot sacrifice you).
  *   **Risk vs. Outcome:** Satisfying *Risk Sensitivity* fairly often violates *Description Invariance* depending on whether you value the reduction of risk or the actual avoidance of harm.

  ### The "Killer" Constraint

  **Requirement #5 (Individual Justifiability)** does the most work in excluding otherwise popular candidates.

  *   **Why:** Standard Cost-Benefit Analysis (Utilitarianism) easily satisfies Aggregation and Description Invariance but fails Individual Justifiability (it tells the loser: "You lost because the sum was greater," which is not a reason *to them*).
  *   **Second Place:** **Requirement #2 (Aggregation Threshold)** excludes Taurek-style non-aggregation views, which are popular among those worried about "numbers counting."

  ---

  ### Scoring Four Candidate Theories

  **Total-Utilitarian Summing**
  *   **Score:** Fails **Individual Justifiability**. Passes **Description Invariance** and **Aggregation Threshold**.
  *   **Verdict:** Efficient for the budget, but politically fragile. It cannot tell the denied patient why *they* specifically were not owed aid, only that the total gain elsewhere was larger. Good for administration, bad for committee cohesion.

  **Scanlon-Style Reasonable Rejectability**
  *   **Score:** Passes **Individual Justifiability**. Struggles with **Aggregation Threshold** (the "Large Numbers" problem).
  *   **Verdict:** Excellent for small-committee decisions on severe cases. Fails when facing your "thousand patients with small probabilities." It lacks a clear mechanism for summing small complaints to override a large one, risking paralysis in high-volume/low-stakes scenarios.

  **Prioritarian Weighting**
  *   **Score:** Passes **Priority Sensitivity** and **Aggregation Threshold**. Ambiguous on **Individual Justifiability**.
  *   **Verdict:** The strongest practical contender. It weights benefits to the worse off more heavily, satisfying equity intuitions without banning aggregation. However, it still ultimately justifies to the "sum of weighted well-being," not strictly to the individual loser.

  **Taurek-Style Refusal to Aggregate**
  *   **Score:** Passes **Individual Justifiability** (strictly). Fails **Aggregation Threshold** catastrophically.
  *   **Verdict:** Unusable for a health system. It implies you cannot fund a prevention programme (small cost to many) even if it saves lives, because you cannot sum the small costs. It forces a lottery between one severe case and many minor ones, which violates fiscal mandates.

  ---

  ### Confidence Markers

  *   **Settled:** There is consensus that **Description Invariance** is a formal requirement for any coherent theory. There is consensus that **Taurek-style views** fail to handle large-scale policy (Aggregation Threshold).
  *   **Contested:** There is *no* consensus on how to satisfy **Individual Justifiability** while allowing **Aggregation**. This is the active frontier of the literature (e.g., "Contractualism with Aggregation"). There is no consensus on **Risk Sensitivity** (ex-ante vs. ex-post).
  *   **Caution:** Do not treat the "Intra/Interpersonal Symmetry" (your point ii) as settled. Many theorists argue intrapersonal trade-offs (my pain now vs. my pain later) are fundamentally different from interpersonal ones (my pain vs. your pain). A policy that assumes they are the same risks ethical error.
