      *   Burge's view: Social externalism might say the community fixation matters. If the community is split, the idiolect might be indeterminate.
      *   Implication: The handout's claim ("whatever the stuff in his environment happens to be") fails here because there are two stuffs. It suggests a simplicity that doesn't exist. The reference fixing requires a *selection* mechanism (causal dominance, intention to refer to *this* kind, etc.).
      *   Does this expose something left out? Yes. It exposes the need for a "nominal essence" or a "stereotype" vs. "real essence" distinction, and the role of *intentions* to refer to a unified kind. It also highlights the Division of Linguistic Labor's role in resolving ambiguity. If the community is split, reference might be indeterminate until experts weigh in.

