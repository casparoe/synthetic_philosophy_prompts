      *   Did I address the sympathy mechanism? Yes, in Section 2.
      *   Did I address the zero-effect counterexample? Yes, the "Psychopath Loophole."
      *   Is there a defensible conclusion? Yes, arguing for a systematic revision.

  7.  **Final Polish:** Check tone. Ensure it sounds like a philosophical mediation, not just a rant. (Self-Correction: Make sure not to say Kant was "wrong" outright, but that his *system* demands a correction he didn't make.)

  8.  *(Final thought before drafting)*: The strongest point is the *a priori* vs. *empirical* distinction. Kantian ethics collapses if duties rely on empirical outcomes (like character hardening). I need to hammer that home.

