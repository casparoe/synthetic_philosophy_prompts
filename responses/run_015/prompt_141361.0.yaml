answer: |-
  Here is the adjudication of your disagreement, the evaluation of your conceptual toolkit, and the proposed research agenda.

  ### 1. Adjudicating the Crux: Is Design Downstream of Epistemology?

  Your friend is operating under a **foundationalist** assumption: that you cannot evaluate the *construction* of a measuring device until you have settled the *metaphysics* of what it measures. On this view, if intuitions are not evidence, thought experiments (TEs) are worthless, so designing them better is a waste of time.

  You are operating under an **instrumentalist** assumption: that a tool can be well- or ill-constructed regardless of the ultimate status of the material it processes.

  **Verdict:** For your specific goal (producing norms for construction), **you are right.** The design-level project is not downstream of the evidential-status question; it is *parallel* to it.

  **Reasoning:** Even if we grant your friend's premise that "intuitions are evidence," a thought experiment can still fail due to poor design. Consider a courtroom: even if witness testimony is admissible evidence (epistemology), a lawyer can still ask a leading question that coerces the witness (design). The testimony is still "evidence," but the *procedure* for eliciting it is flawed. Similarly, a TE might elicit a genuine intuition, but if that intuition is triggered by a normatively irrelevant feature (e.g., first-person framing), the TE fails to test the *principle* it claims to test.

  **The Trade-off:** By spending a year on design, you are trading the *depth* of the epistemological debate for the *breadth* of philosophical practice. You will not solve skepticism about intuitions. However, you will make that skepticism less disruptive. If you produce a "Stress-Test Protocol" for TEs, a skeptic can no longer simply say "intuitions vary"; they must show *which* design failure caused the variation. You are raising the cost of skepticism, not refuting it.

  **Conclusion:** The project is not premature. It has independent structure. You can write a manual on "How to build a sturdy bridge" without settling "What is the metaphysical nature of physical forces."

  ### 2. Evaluating Your Three Labels

  You asked which labels survive contact with existing distinctions.

  1.  **Support Laundering:** **Survives, but needs renaming.**
      *   *Existing Lit:* This overlaps with "confounding variables" in case methodology and "theory-ladenness" in observation.
      *   *Critique:* "Laundering" implies intent to deceive. Most philosophers do this accidentally.
      *   *Recommendation:* Rename to **Principle Confounding**. It captures the idea that the case elicits a verdict supported by Principle B, which the author mistakes for support for Principle A. This is a distinct, identifiable design failure.

  2.  **The Cost of Abstraction:** **Survives and is robust.**
      *   *Existing Lit:* Connects directly to literature on "idealization" in science (Cartwright, O'Neill) and "thick concepts" in ethics.
      *   *Critique:* This is your strongest concept. It addresses the tension between clarity (requiring abstraction) and applicability (requiring context).
      *   *Recommendation:* Keep this. It is the core of the "mapping" problem between the TE and the real world.

  3.  **Verdict Portability:** **Collapses unless reframed.**
      *   *Existing Lit:* This is the "Framing Effects" literature (experimental philosophy).
      *   *Critique:* As stated, this sounds like an empirical claim ("verdicts move"). Since you have no empirical resources, you cannot research this directly. If you frame it as "Intuitions are unstable," you fall back into your friend's trap (the epistemology debate).
      *   *Recommendation:* Reframe as **Normative Irrelevance**. The question is not "Do verdicts change?" (empirical) but "Which features *ought* to be irrelevant to the principle?" (conceptual). You are researching which variables a well-designed TE must *control for*, regardless of whether subjects actually vary on them.

  ### 3. The Research Agenda: Three Questions

  Given your constraints (1 year, 1 GA, no empirics, practical output), here are the three questions you should pursue, in order.

  #### Question 1: Which features of a vignette are Normatively Irrelevant?
  *   **Reasoning:** This addresses your "Verdict Portability" label but sidesteps the need for surveys. You cannot measure stability without subjects, but you can analyze *logical relevance*. If a principle is about "killing," the color of the killer's shirt is normatively irrelevant. If a principle is about "intent," the first/third-person distinction might be relevant.
  *   **Upstream/Downstream:** This is upstream of everything. You cannot build a stress test until you know what variables need to be held constant.
  *   **Tractability:** High. This is armchair conceptual analysis. You and your GA can review classic TEs (Trolley, Gettier, Swampman) and catalogue which features were varied in the literature and whether those variations were deemed significant.
  *   **Neglect:** Neglected. Experimental philosophers measure *whether* framing matters; normative philosophers rarely specify *which* framing ought not to matter.
  *   **Trade-off:** You are not discovering new psychological facts. You are codifying existing philosophical commitments about relevance.

  #### Question 2: What is the Threshold of Normative Stripping?
  *   **Reasoning:** This addresses "Cost of Abstraction." TEs must simplify to be intelligible, but over-simplification removes the very features that make the principle applicable. You need to define the boundary where a case becomes "too thin" to carry normative weight.
  *   **Upstream/Downstream:** Upstream of application. If you don't know this, you cannot audit a case for "Cost of Abstraction."
  *   **Tractability:** Moderate. This requires close reading of cases where TEs failed because they were "unrealistic" (e.g., objections to utilitarianism that rely on psychological impossibilities).
  *   **Neglect:** Unfashionable. The trend is toward "naturalizing" philosophy (more realism), but there is little work on the *minimum* realism required for a TE to function.
  *   **Trade-off:** You risk getting bogged down in metaphysics (what is "real"?). You must stay focused on *normative* relevance, not ontological density.

  #### Question 3: How do we Isolate the Target Principle?
  *   **Reasoning:** This addresses "Principle Confounding" (Support Laundering). A TE often smuggles in a secondary principle (e.g., a case meant to test *justice* that actually triggers *loyalty*). You need a protocol for checking if a case is "pure."
  *   **Upstream/Downstream:** Downstream of Q1 and Q2. Once you know what is irrelevant (Q1) and what is essential (Q2), you can check if the case contains contaminants.
  *   **Tractability:** High. This is logical analysis. Can the verdict be explained by a principle other than the one intended?
  *   **Neglect:** Neglected. Philosophers often accuse each other of this ("Your case just triggers disgust!"), but there are no formal heuristics for preventing it.
  *   **Trade-off:** You cannot guarantee isolation without empirical testing. You must frame this as "Plausibility of Alternative Explanations," not "Proof of Isolation."

  ### 4. What a "Solved" Version Looks Like

  You asked for the end state. Do not aim for a book-length theory. Aim for a **Protocol**.

  **The Output:** A "Stress-Test Checklist for Thought Experiments" (approx. 10–15 pages + appendix of audited cases).
  *   **Format:** A set of 5–7 diagnostic questions a philosopher must answer before publishing a TE.
      *   *Example:* "Have you varied the narrative perspective? If not, is perspective normatively irrelevant to the principle?"
      *   *Example:* "What is the nearest competing principle that could explain the verdict?"
  *   **Success Condition:** You know you have succeeded if a colleague can take a draft paper containing a new TE, apply your checklist, and identify a design flaw you missed, *without* needing to run a survey.
  *   **GA Role:** The GA should not run subjects. They should "audit" existing TEs from the last 5 years of top journals using your draft checklist to see if it flags known controversies.

  ### 5. What is Overrated (and what to abandon)

  **1. The "Intuition as Evidence" Debate (For Your Purposes)**
  *   **Why:** You cannot settle this in a year. More importantly, settling it doesn't help a philosopher construct a better case *tomorrow*.
  *   **Implication:** Do not spend time defending the existence of intuitions. Grant them for the sake of argument. Your norms apply *conditional* on their use.

  **2. Psychological Realism**
  *   **Why:** There is a temptation to think TEs fail because they aren't "realistic" enough (e.g., "No one would actually face this choice").
  *   **Correction:** TEs fail because they are *normatively* thin, not psychologically rare. A TE about a trolley doesn't fail because trolleys are rare; it fails if the track-switching mechanism hides a relevant moral distinction. Do not chase realism; chase **normative transparency**.

  **3. Universal Agreement**
  *   **Why:** Do not aim for a TE that everyone agrees on. That is impossible.
  *   **Correction:** Aim for a TE where the *source* of disagreement is clear. A good TE isolates the disagreement to the principle, not the presentation. If people disagree because one read it in the first person and one in the third, the TE is broken. If they disagree because they hold different moral principles, the TE is working.

  ### Summary of Recommendation

  1.  **Reject the Friend's Priority:** Design is independent of epistemology. Proceed.
  2.  **Reframe "Portability":** Make it about *Normative Irrelevance*, not empirical stability.
  3.  **Focus on the Checklist:** Your year is successful if you produce a usable audit tool, not a new theory of mind.
  4.  **Abandon Empirics:** Do not try to simulate surveys. Use logical analysis of existing case histories.

  This agenda respects your constraints, leverages your insight about design, and produces a tangible tool that improves philosophical practice regardless of how the intuition wars end.
