  *Test:* Review Corwen Commission funding outcomes for interdisciplinary projects.
  *Miriam's Prediction:* Projects with empirical feedback loops will show higher citation impact and clearer return.
  *Adele's Prediction:* Projects focusing on conceptual clarification without empirical data will show equal stability in long-term uptake.

