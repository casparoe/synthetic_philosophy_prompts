  *Miriam Vance:* Yes. Progress often looks like secession. When a question becomes solvable, such as psychology or physics, it leaves philosophy. This is success.
  *Adele Okonjo-Ruiz:* No. That is abandonment, not progress. If philosophy only progresses by disappearing, it has no positive account of its own survival.

