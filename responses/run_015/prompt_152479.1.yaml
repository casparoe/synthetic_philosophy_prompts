      **TO:** The Corwen Commission
      **FROM:** Miriam Vance and Adele Okonjo-Ruiz, Department of Philosophy
      **SUBJECT:** Statement of Intellectual Return: Philosophy (1974–2024)

      **Introduction**
      This statement represents an adversarial collaboration. We agree on the data of philosophical practice but disagree on its interpretation. The Commission asks whether philosophy has moved forward. We submit that the answer depends on whether one defines progress as the elimination of error or the refinement of pluralism. Below we outline our consensus, our divergence, and the empirical tests that distinguish our views.

      **I. Agreed Claims**
      1. **Nature of Questions:** Philosophical questions are persistent. They do not vanish through empirical verification alone. They concern normative force, conceptual coherence, and the weighting of incommensurable reasons.
      2. **Condition for Progress:** For any discipline to progress, the state of knowledge or practice at Time 2 must differ from Time 1 in a way that is not merely random variation. There must be a directional change in how practitioners engage with problems.
      3. **Subfield Consensus:** We agree that Formal Logic and Philosophy of Mind have progressed. Logic has tightened its standards of validity; Philosophy of Mind has converged with cognitive science. We agree that Ethics and Aesthetics have not progressed in the same manner; viable positions from fifty years ago remain viable today.
      4. **Dialectical Space:** The space of possible positions is not infinite. Practitioners operate within a finite set of coherent frameworks constrained by logic and phenomenological plausibility.

      **II. Disagreements**
      While we agree on the landscape, we disagree on the trajectory. The following table summarizes our competing interpretations of the same phenomena.

      **Topic: The Live-Options Ledger**
      *Measure:* Count of mutually incompatible positions actively defended in the last decade versus a matched sample from fifty years ago.
      *Miriam Vance:* The count has shrunk. Arguments available in 1974 (e.g., naive realism, certain forms of dualism) are no longer coherent options. The space has been winnowed.
      *Adele Okonjo-Ruiz:* The count is stable. Apparent shrinkage is reclassification. Positions once called "dualism" are now "non-reductive physicalism." The underlying stance persists despite vocabulary shifts.

      **Topic: Reversion Rate**
      *Measure:* Percentage of recent work that is a substantive restatement of a position defended before 1900.
      *Miriam Vance:* Low. We stand on the results of past winnowing. We do not need to revisit refuted errors unless history is ignored.
      *Adele Okonjo-Ruiz:* High. Central questions recur because they address permanent features of human reasoning. Virtue ethics and compatibilism return because they answer needs that eliminationist accounts cannot.

      **Topic: Transmission Test**
      *Measure:* Can current doctoral students routinely produce objections to a canonical paper of the 1970s that the paper did not address?
      *Miriam Vance:* Yes. Later workers see further. Students possess conceptual tools and distinctions sharpened by decades of debate that were unavailable to the original authors.
      *Adele Okonjo-Ruiz:* No. Most "new" objections are restatements of older counter-arguments lost to fashion. The tools are sharper, but the cuts are the same.

      **Topic: The Secession Question**
      *Measure:* Did every subfield both agree has progressed do so by ceasing to be philosophy?
      *Miriam Vance:* Yes. Progress often looks like secession. When a question becomes solvable (e.g., psychology, physics), it leaves philosophy. This is success.
      *Adele Okonjo-Ruiz:* No. That is abandonment, not progress. If philosophy only progresses by disappearing, it has no positive account of its own survival.

      **III. Cruxes and Concrete Tests**
      Our disagreement rests on specific cruxes. Settling these would move at least one of us.

      **Crux 1: Dissolution vs. Renaming**
      *Issue:* When a question disappears, is it because it was solved (Miriam) or because the vocabulary shifted (Adele)?
      *Test:* Analyze the "Mind-Body Problem" literature from 1970 to 2020. Track specific argument structures rather than terminology.
      *Miriam's Prediction:* Argument structures from 1970 deemed incoherent will not appear in 2020 top-tier journals.
      *Adele's Prediction:* Argument structures from 1970 will appear in 2020 under new labels (e.g., "qualia" replaced by "phenomenal consciousness" with identical logical properties).

      **Crux 2: The Value of Pluralism**
      *Issue:* Is persistent disagreement a sign of failure (Miriam) or a sign of adequate complexity (Adele)?
      *Test:* Survey practitioners in Ethics vs. Logic. Ask if the lack of consensus impedes their work.
      *Miriam's Prediction:* Ethicists will report impediment; the lack of consensus signals stagnation.
      *Adele's Prediction:* Ethicists will report no impediment; pluralism is functional and allows for nuanced engagement with different moral phenomena.

      **Crux 3: The Boundary of Philosophy**
      *Issue:* Does progress require empirical traction?
      *Test:* Review Corwen Commission funding outcomes for interdisciplinary projects.
      *Miriam's Prediction:* Projects with empirical feedback loops will show higher citation impact and clearer "return."
      *Adele's Prediction:* Projects focusing on conceptual clarification without empirical data will show equal stability in long-term uptake.

      **IV. Falsification and Conclusion**
      We conclude by stating what would count as evidence against our own views.

      For **Miriam Vance**, her view would be falsified if the Live-Options Ledger showed an expansion of coherent positions without a corresponding increase in confusion or error. If the space of live options grows while clarity increases, the "winnowing" model fails. She would also concede if the Secession Question revealed that fields remaining within philosophy showed equal progress to those that left.

      For **Adele Okonjo-Ruiz**, her view would be falsified if a consensus emerged in Ethics or Aesthetics without exclusionary power dynamics or empirical colonization. If practitioners voluntarily converged on a single framework because it demonstrably outperformed others in reasoning, the "principled pluralism" model would fail. She would also concede if the Transmission Test showed that current students could not understand past objections, proving a loss of knowledge rather than recurrence.

      **Will anything settle this dispute?**
      We suspect part of our quarrel is verbal. We define "progress" differently. Miriam defines it as convergence on truth or coherence. Adele defines it as the refinement of the capacity to navigate disagreement. However, the disagreement is not merely verbal. It concerns resource allocation. If Miriam is right, funding should target subfields nearing empirical secession or logical resolution. If Adele is right, funding should support the maintenance of pluralistic dialectical spaces.

      Ultimately, the Corwen Commission must decide whether it values the narrowing of questions or the deepening of their context. We agree that philosophy has changed. We disagree on whether that change is a vector or a cycle. We submit this map of our disagreement not as a failure of collaboration, but as the most accurate account of intellectual return philosophy can offer: a clarified understanding of its own limits.

