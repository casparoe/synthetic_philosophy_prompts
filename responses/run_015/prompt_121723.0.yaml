answer: |-
  A seasoned Dutch Bookie corners an imprecise probabilist at a conference, confident he can exploit the vagueness of her credences. "I've calculated your lower and upper envelopes," he says, sliding a betting slip across the table. "Your credence in 'Quantum Decay' is the interval $[0.3, 0.8]$, not a sharp value. Standard coherence requires a single fair price where you'll transact in either direction. I'll sell you this bet for $0.55 now, and I've prepared a contract to buy it back after you learn the evidence, locking in a sure loss via a diachronic book."

  The probabilist sips her tea, unbothered. "My rule is strict: I only accept a bet if it looks favourable by the lights of *every* function in the set. At $0.55$, my lower-bound functions say I'm overpaying, so I won't buy. And since my upper-bound functions say it's undervalued, I won't sell." The bookie freezes, realizing he's assumed a symmetric fair price where none exists; he's tried to Dutch Book a bid-ask spread. In his frustration to prove the vulnerability of her imprecision, he accidentally takes both sides of the bet himself to force the transaction, guaranteeing a sure loss for his own portfolio while she remains perfectly coherent—and solvent—in her silence.
