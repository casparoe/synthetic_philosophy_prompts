          *   *Money:* Grounded in collective intentionality regarding status functions (X counts as Y in context C). The physical substrate (paper, token, digital number) is arbitrary.
          *   *Token Case:* The token is physically plastic. As money, it's grounded in student agreement. As a washer token, it's grounded in machine programming + Uni rules.
          *   *Confidence:* High. This is standard Searle vs. Haslanger/Mallon territory.

      *   **Dimension 2: Abolition (Conditions for Cessation)**
          *   *Race:* Harder. Requires dismantling power structures *and* changing perceptual habits. Even if we stop "believing," the historical inertia of embodiment keeps it alive.
          *   *Money:* Easier (conceptually). If collective acceptance stops, it becomes paper. If the institution collapses, the money stops.
          *   *Token Case:* If students stop trading it, it reverts to just a washer token. If the Uni changes the locks, the token fails as a washer tool.
          *   *Confidence:* Medium-High. Abolition of race is highly contested (elimativism vs. conservationism).

      *   **Dimension 3: Causal Explanations (Causal Power)**
          *   *Race:* Causal via discrimination, structural advantage, psychological internalization. It's a "structural cause."
          *   *Money:* Causal via purchasing power, incentive structures. It's an "institutional cause."
          *   *Token Case:* The token causes a shirt to get washed (mechanical) or a beer to be bought (social).
          *   *Confidence:* High. Both are causally real in social science.

