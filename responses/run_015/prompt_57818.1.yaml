  2.  **Deconstruct the Concepts (Mental Sandbox):**
      *   *Race:* Often analyzed via critical race theory (CRT), social ontology (Mallon, Hacking, Haslanger). Usually involves biological markers *interpreted* through social norms/power structures. It has a "real" impact on life chances. Abolition is hard because it's tied to embodiment and deep-seated power structures.
      *   *Money:* Analyzed via Searle (status functions), Knapp (chartalism), Graeber (credit/debt). It's institutional. It relies on collective intentionality + status functions. Abolition is theoretically easier (change the rules/system), though practically hard due to economic interdependence.
      *   *The Laundry Token:* This is a "local currency" or "quasi-money." It has use-value (washers) but exchange-value (among students). It highlights the difference between *institutional decree* (University says X) and *social practice* (Students say Y).
      *   *Construction Types:*
          *   Race: Often "interactive kind" (Hacking) or "normative real kind" (Haslanger). Grounded in perception + power.
          *   Money: Often "institutional fact" (Searle). Grounded in collective acceptance + function.
      *   *Causal Efficacy:* Both definitely have causal power (race affects hiring; money buys food). The question is *how*.

  3.  **Drafting the Comparison (Dimension by Dimension):**

      *   **Dimension 1: Grounds (Ontological Basis)**
