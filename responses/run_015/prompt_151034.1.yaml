      *   **The Request:** They do *not* want a tour of standard arguments (Parfit, Rachels, Temkin, etc.). They want a *structural account* of the deadlock. They want a diagnosis of *why* they are stuck. They want to know if it's verbal, substantive, bedrock, or confused. They want an evaluation of their two hypotheses. They want to know what would count as *progress*.
