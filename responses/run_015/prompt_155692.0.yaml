answer: |-
  ### Phase 1: Brainstorming Rival Accounts of Persistence

  Before tackling the museum case, I need to lay out the metaphysical options for how an object stays "itself" over time.

  1.  **Mereological Essentialism (Strict Materialism):**
      *   *Core Idea:* An object is identical to the specific sum of its material parts.
      *   *Persistence Condition:* If you lose or replace even a single atom, the original object ceases to exist. A replacement is a numerically distinct copy.
      *   *Implication for Art:* If the wax flakes off, the sculpture is gone. A cast is a new object.

  2.  **Hylomorphism (Form-Matter Constitution):**
      *   *Core Idea:* An object is a compound of matter (*hyle*) and form (*morphe*).
      *   *Persistence Condition:* The object persists as long as the substantial form remains embodied in matter, even if the specific matter changes (e.g., biological growth, repair). However, the causal link to the original imposition of form (the artist's act) is usually crucial.
      *   *Implication for Art:* You can replace the wax if the shape (form) is preserved, but the chain of causation from the artist's original mold matters.

  3.  **Institutional/Social Constitution:**
      *   *Core Idea:* An object's identity is conferred by social practices, documentation, and authority (the "artworld").
      *   *Persistence Condition:* The object persists as long as the relevant community (museum, artists, critics) agrees to track it as the same entity via records, titles, and provenance.
      *   *Implication for Art:* The "work" is the status, not the stuff. If the catalog says it's the same, it's the same.

  4.  **Perdurantism (Four-Dimensionalism):**
      *   *Core Idea:* Objects are space-time "worms" composed of temporal parts.
      *   *Persistence Condition:* Identity is a matter of causal continuity between temporal stages.
      *   *Implication for Art:* The original wax is the early stage; the cast is the later stage. As long as there is a causal link (the mold), they are parts of the same worm.

  ***

  ### Phase 2: Reconstructing the Museum's Implicit View

  The conservation practice you describe—allowing total material replacement and eventually destroying the original causal tools (the mold), relying solely on the catalog entry—is a fascinating edge case. It reveals a specific metaphysical commitment regarding what an artwork *is*.

  **The Presupposed Theory: Institutional/Social Constitution**
  This practice presupposes that the artwork is primarily an **institutionally tracked entity** rather than a concrete particular.

  Here is the reasoning:
  1.  **Severing Material Continuity:** By allowing the original material to decay and be replaced, the museum rejects Mereological Essentialism.
  2.  **Severing Causal Continuity:** By destroying the original mold after the third replacement, the museum eventually breaks the direct physical causal chain to the artist's original act. If the fourth cast is made from a mold taken from the third cast, the link to the artist's hand becomes increasingly attenuated (a "copy of a copy"). A Hylomorphist might object here, arguing that the "form" has drifted from the artist's original imposition.
  3.  **Prioritizing Documentation:** The rule states the replacements keep the "same catalog entry and title." This is the smoking gun. The identity of the work is anchored in the *administrative record*, not the physical substrate. The museum is asserting that the "Work" is a normative status that can be transferred from one physical host to another, provided the bureaucracy says so.

  Therefore, the implicit view is that the artwork is a **socially constituted abstract object** that is *manifested* by physical tokens. The physical token is expendable; the institutional identity is permanent.

  ***

  ### Phase 3: Compatibility with Other Theories

  Is this practice locked into Institutionalism, or can other metaphysical frameworks justify it?

  **Compatible with Perdurantism (with caveats):**
  A Four-Dimensionalist could argue that the artwork is a temporal worm extending from the artist's creation into the future. Each cast is a "temporal part" of the whole work. As long as there is causal continuity (Cast 1 makes Mold 2, which makes Cast 2), the worm remains unbroken.
  *   *The Conflict:* The prompt notes "zero physical continuity... except paperwork." If the physical chain of causation is broken (e.g., the mold is destroyed and the next cast is made purely from measurements or photos because the previous cast also decayed), Perdurantism fails. Perdurantism requires causal connection between stages. If the museum relies *only* on paperwork when the physical chain snaps, they have moved beyond 4Dism into pure Institutionalism.

  **Incompatible with Strict Materialism:**
  This practice is fundamentally incompatible with Mereological Essentialism. A strict materialist museum could not ethically display the replacement under the original ID.

  **Tension with Hylomorphism:**
  Traditional Form-Matter theory struggles here. While it allows matter replacement, it usually requires the *form* to be preserved via the original efficient cause (the artist's mold). Once the original mold is destroyed, the "form" being instantiated is no longer the artist's form, but a copy's form. A Hylomorphist might accept the first two casts but would likely argue the third or fourth generation is a new substance, not the original.

  **Verdict:** The practice is *most* coherent under **Institutional Theory**, compatible with **Perdurantism** only so long as physical causal chains exist, and incompatible with **Strict Materialism**.

  ***

  ### Phase 4: The Strict Materialist Alternative

  If a museum operated under a belief in **Strict Material Continuity** (Mereological Essentialism), their policy for ephemeral sculptures would look radically different. They would view the artwork as identical to the specific atoms arranged by the artist.

  **Required Policy Changes:**
  1.  **No Recasting as "Original":** When the original wax/chocolate decays, the work is considered dead. You cannot cast a replacement and give it the original accession number.
  2.  **Display of Remains:** The museum would display the decaying remnants (the crumbs, the stain, the dust) as the actual work. The aesthetic value might be low, but the ontological integrity is preserved.
  3.  **New Identity for Replicas:** If they cast a replacement from the mold for educational or aesthetic purposes, it must be cataloged as a distinct object (e.g., *"Study for [Original Title]"* or *"Facsimile of [Original Title]"*). It would receive a new catalog number.
  4.  **Mold Preservation:** The mold would be treated as a crucial relic of the original object's causal history. It would never be destroyed, as it is the only link to the original form, even if it cannot be used to create "the work" again.

  **Summary:**
  The niche conservation rule you describe treats the artwork as a **legal-institutional personhood** of sorts—it survives the death of its body through the continuity of its "birth certificate" (the catalog). A strict materialist museum, by contrast, treats the artwork as a **biological organism**—when the body dies, the entity ceases to exist, and any clone is a new being.
