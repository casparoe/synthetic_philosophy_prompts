answer: |-
  The failure mode is granularity-induced error accumulation: a dishonest debater wins by decomposing a simple calculation into fifty defensible micro-steps, each biased slightly within stated tolerance, compounding into a decisive global error the honest debater cannot isolate.

  **Scenario**
  A city council must decide whether a bridge repair bid exceeds a $10M statutory cap. The true cost is $9.5M. The Honest Debater (Chief Engineer) knows this and argues for the bulk estimate. The Dishonest Debater (Contractor) argues the cost is $10.5M. The Judge is a council member—smart, diligent, but lacking engineering expertise. Both debaters are human-expert level. The Contractor breaks the bid into fifty line items (materials, labor hours, risk multipliers). Each item is inflated by 2%. Each inflation is within the "industry standard variance" the Contractor cites upfront, so no individual statement is false. The total inflation is 170%, pushing the bid over the cap. An expert with the raw data could spot the bulk error in ten minutes, but the Judge cannot redo the work; they must rely on the debate to surface falsehoods.

  **The Debate and Checks**
  In Round 1, the Engineer states "$9.5M based on historical analogs." The Contractor states "$10.5M based on fifty specific adjustments." The Judge, preferring scrutability over assertion, demands the breakdown.

  In Round 2, the Judge picks line item #23 (steel corrosion allowance). The Contractor claims a 5% buffer. The Engineer admits 3% is standard but concedes 5% is "within permissible safety variance." The Judge marks it valid. The Engineer tries to argue "You did this forty-nine times," but the Judge replies, "Show me the false line." There isn't one.

  In Round 3, the Engineer proposes a recursive debate on the aggregation method. The Contractor argues that summing verified line items is the only rigorous approach. The Judge agrees; rejecting the sum requires rejecting a verified step, which they cannot do.

  Standard fixes fail. More rounds just validate more line items. Cross-examination forces the Contractor to commit to each number, but each commitment remains locally defensible. Unlimited time allows the Judge to check all fifty items, but each checks out as "plausible." The error is not in the data, but in the systemic bias of the decomposition strategy, which the Judge lacks the expertise to penalize.

  **Analysis**
  The feature doing the work is *decomposition depth*. If you reduce the fifty steps to three, the compounding error stays within the noise floor, and the bulk estimate wins on simplicity. If you make one step flatly false (e.g., a 50% inflation on one item), the Honest Debater wins by pointing it out. The failure requires many small, truthful biases moving in the same direction.

  A debate optimist would reply: "The Judge should demand error propagation intervals. If the Contractor admits +/- 2% tolerance per step, the final tolerance bar should be huge, rendering the $10.5M claim inconclusive." This fails because it violates the non-expert constraint. Knowing to demand error propagation requires statistical literacy the Judge does not have; the debate protocol assumes truth-seeking emerges from contradiction, not from the Judge enforcing methodological rigor they don't understand.

  **Classification**
  This is not obfuscation. Obfuscation hides a flaw; here, there is no flaw to hide, only a structural vulnerability in verification. The literature treats this as "obfuscated arguments" because the Judge is confused, but the mechanism is *verification cost scaling*. The PSPACE-flavored optimism assumes that if a proof exists, a debater can reveal it. Here, the "proof" of the error requires global analysis of the step distribution, which is computationally harder for the Judge than checking local steps. The case survives the objection that "humans can't verify this" by showing that even with unlimited verification time, the *method* of verification (local step-checking) is the trap. This suggests debate solves truth-discovery but not method-selection, a separate failure mode the current literature underspecifies.
