prompt: |-
  Hey — I'm helping put together the problem sets for a small reading group on scalable oversight that some grad students in my department run, and last week we went through the AI safety via debate paper (Irving and co., 2018: two agents take turns making short statements, a human judge picks whichever one gave the most true and useful information). We spent the whole session on the obfuscated-arguments worry — the debater who's wrong buries the flaw somewhere the judge will never find it — and I want a worked example for the group that's sharper than the usual "hire a slick lawyer and dazzle the jury" hand-wave. What I need from you is a thought experiment, built to spec, in which debate fails even though nothing that would normally get called obfuscation happens.

  The specs:

  - Ordinary, non-sci-fi setting and a question with one determinate right answer, ideally a number or a yes/no threshold (a hospital budget, an insurance claim, a bridge safety sign-off, whatever you like). One paragraph of setup.
  - Both debaters are no smarter than a good human expert, and the judge is a smart, careful, non-expert generalist. The failure can't come from anyone being a genius or an idiot.
  - The dishonest debater never lies. Every single statement they make is true, or true within a tolerance they state out loud, and they'll answer any direct question truthfully if the judge puts it to them.
  - The honest debater knows the right answer, is at least as articulate, gets equal airtime — and still loses.
  - The judge has unlimited time, a calculator, no cap on statement length, and the power to make either debater expand any single step. So the loss can't be pinned on laziness, time pressure, missing background knowledge, or some fact nobody could check.
  - The key one: the honest debater must not be able to win by pointing at the bad step, because there isn't one. The error has to be distributed across many individually innocent steps. My own idea was that each step is defensible to within a couple of percent and the drift compounds across, say, thirty of them, so the total is off by more than a factor of two while every step survives scrutiny — but if you have a cleaner mechanism, use it. The point is the same: a case where "just point out the flaw" isn't available.
  - And the question shouldn't be intrinsically hard. A domain expert with the underlying figures in front of them should get it right in ten minutes. The difficulty has to live entirely in transmitting the answer to someone who can't redo the work.

  After the scenario, do the checks: sketch two or three rounds so I can watch the honest debater try and fail, then show why each of the standard fixes still doesn't save it — more rounds, cross-examination where the judge can force a debater to commit to a hypothetical, recursive debate over sub-questions, better tools or unlimited time for the judge. Then tell me which single feature of the case is doing the work, what happens if you remove it (e.g. if you make one step flatly false, or cut thirty steps down to three), and what the strongest thing a debate optimist says in reply. I'm expecting something like "that's not obfuscation, that's just a question a human judge can't verify, and no oversight method fixes it," so tell me whether the case can be redesigned to survive that objection. Last thing: does this failure mode really belong under the obfuscated-arguments heading, or is it a seperate one that the debate literature doesn't name? I care because it changes whether the PSPACE-flavored optimism in the paper is even aimed at the right target — it definately looks like verification cost is the issue rather than rhetorical trickery, but I want to see it fall out of the case rather than me stipulating it.

  Lead with your bottom line in the first sentence — the case in miniature plus the feature doing the work — then give me the scenario and the checks, no preamble and no restating my question back to me. Skip citations and don't send me off to read anything; I want your own construction. American English, and keep the whole thing around 600 to 800 words.
