      *   *The "Parrot" label:* Hobbes might actually defend the parrot! If a parrot says "Hello," does it have a conception of greeting? No. It's just noise.
      *   *The "Understanding" label:* Understanding requires the *Markes* function first. You must use language to regulate your *own* reasoning before you can use it to signal others.
      *   *The Roommate's Point:* The roommate says "just next word prediction." Hobbes would say "Speech is the counting of names." But the *counting* must serve a *purpose* (desire/fear) rooted in a living organism.
