answer: |-
  Here are the metrics applied to your seven cases, followed by the analysis you requested.

  ### The Cases

  **1. The Black Death and the rise in real wages / weakening of bound labour (Western Europe)**
  *   **C: 8** — Remove the plague, and the sudden labor scarcity that leveraged peasant bargaining power does not occur in the 14th century.
  *   **S: 3** — The pathogen hit from Russia to Ireland, but wages rose in the West while serfdom intensified in the East; local property relations determined the variance.
  *   **Tier:** Fine with a wink.
  *   **Why:** The bacterium killed the workers, but the landlord's legal power determined whether the survivor starved or bargained.

  **2. Old World pathogens and Native American demographic collapse (post-1492)**
  *   **C: 10** — Remove smallpox, measles, and influenza, and the population does not collapse by 50–90% regardless of political structure.
  *   **S: 9** — While recovery rates varied, the initial catastrophic mortality occurred across almost all political formations (Aztec, Inca, decentralized groups) with little mediation.
  *   **Tier:** Fine.
  *   **Why:** Immunological naivety was a biological constant that overwhelmed almost every human variable in the hemisphere.

  **3. Tambora (1815), the "Year Without a Summer," and subsequent rioting/emigration**
  *   **C: 7** — Remove the eruption, and the specific harvest failures of 1816–1817 in the North Atlantic do not happen.
  *   **S: 2** — Some regions saw revolution, some saw state relief, some saw mass migration, and some saw stability; market integration and poor laws explained the spread, not the ash.
  *   **Tier:** Only in scare quotes.
  *   **Why:** Volcanoes do not riot; weather creates the price spike, but humans create the violence.

  **4. Potato blight and the Irish Famine**
  *   **C: 9** — Remove *Phytophthora infestans*, and the caloric collapse in Ireland between 1845–1849 does not trigger.
  *   **S: 1** — The blight struck across Europe, but mass mortality was almost exclusively Irish due to land tenure, export policies, and relief ideology.
  *   **Tier:** Only in scare quotes.
  *   **Why:** The blight killed the crop, but British political economy killed the people.

  **5. Cholera pandemics and 19th-century urban sewer-building**
  *   **C: 6** — Remove the panic of cholera, and many sewer projects are delayed or framed purely as aesthetic improvements rather than urgent necessities.
  *   **S: 4** — Some cities built comprehensive systems (London, Hamburg), others did not (Naples, many US cities); municipal fiscal capacity and governance mattered more than the germ.
  *   **Tier:** Fine with a wink.
  *   **Why:** The pathogen provided the political capital for engineering, but it did not lay the pipes itself.

  **6. Cooling in the 1300s and the disappearance of Norse Greenland**
  *   **C: 5** — Remove the Little Ice Age, and farming is easier, but recent archaeology suggests trade failure and cultural rigidity were equally fatal.
  *   **S: 6** — The Inuit survived the same cooling; the outcome depended on cultural adaptability rather than the temperature alone.
  *   **Tier:** Don't.
  *   **Why:** Current scholarship suggests "climate killed the Norse" is a misleading simplification of a complex adaptive failure.

  **7. The Laki Fissure Eruption (1783) and Icelandic famine**
  *   **C: 9** — Remove the fluorine poisoning and acid rain, and the livestock mortality (the primary capital of Icelanders) does not occur.
  *   **S: 3** — The fog reached Europe, causing health issues, but only Iceland suffered catastrophic famine due to its isolation and lack of grain reserves.
  *   **Tier:** Fine with a wink.
  *   **Why:** The gas directly poisoned the grass, but the lack of import options turned poison into starvation.

  ***

  ### Analysis: High C / Low S
  **The Cases:** 1 (Black Death), 3 (Tambora), 4 (Irish Famine), 7 (Laki).

  **Your Hypothesis:** You hypothesized that **High C / Low S** is exactly where calling the non-human thing an "actor" does the most damage, because it is doing enormous causal work locally but isn't the thing that explains the variation across cases.

  **Verdict:** **You are exactly right.**
  This quadrant represents the **Trigger vs. Cause** trap. In these cases, the non-human event is a *necessary condition* for the specific outcome in that specific place (High C), but it is not a *sufficient explanation* for why the outcome looked the way it did compared to neighbors (Low S).
  If a student writes "The Potato Blight caused the Irish Famine," they are technically correct on $C$ (no blight = no famine trigger), but they are historically wrong on $S$ (blight existed elsewhere without famine). Granting the blight "agency" in this quadrant erases the political economy (land laws, export bans, relief efforts) that actually explains the variance. It allows students to treat a biological shock as a historical explanation, which lets human actors (landlords, ministers, colonizers) off the hook.

  ### Grammatical Subject Tiering
  *   **Fine:** Case 2. The biology is so overwhelming that "Smallpox killed" is an accurate shorthand for "Smallpox infected humans who died."
  *   **Fine with a wink:** Cases 1, 5, 7. The non-human provided the shock or the leverage, but shorthand agency obscures the human mediation.
  *   **Only in scare quotes:** Cases 3, 4. The non-human created a constraint, but the "action" (rioting, starving) was fundamentally social.
  *   **Don't:** Case 6. The empirical claim is too contested to grant the climate grammatical authority in a first-year seminar.

  ### Empirical Flags & Student Conflation
  **Shaky Case:** **Case 6 (Norse Greenland).**
  The "climate killed the Norse" narrative has been heavily revised in the last 15 years (e.g., work by Jette Arneborg, Thomas McGovern). Evidence suggests they could have survived the cooling but chose not to adapt culturally (e.g., refusing to eat seal, maintaining trade with Europe for luxury goods rather than survival). Putting this in front of first-years requires a heavy hedge that "environmental stress interacted with cultural choices," otherwise you teach outdated determinism.

  **The Conflation:** Students will almost universally conflate **C and S**.
  They will see a High C (the plague definitely changed England) and assume that implies a High S (therefore the plague explains the difference between England and Poland). They struggle to hold the idea that an event can be *locally decisive* but *comparatively irrelevant*. Your seminar needs to explicitly drill the distinction: "Did this event matter here?" ($C$) vs. "Does this event explain why here is different from there?" ($S$).
