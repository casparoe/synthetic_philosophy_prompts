      *   *User's Hypothesis:* High $C$ / Low $S$ is where calling the non-human an "actor" is most dangerous. Why? Because it did the work locally ($C$), but it doesn't explain the variation ($S$). If you say "The Plague caused the end of serfdom," you ignore why it ended serfdom in England but reinforced it in Eastern Europe.
      *   *Grammatical Subject:* Can we say "The Plague killed..." vs "The Plague contributed to..." vs "Humans died because..."

