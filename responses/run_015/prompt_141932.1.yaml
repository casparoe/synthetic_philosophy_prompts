          *   $S$ (Spread Explanation, 0-10): How much does the event explain the *difference* in outcomes across affected societies vs. pre-existing human arrangements? (Comparative impact). High $S$ = event overrides local differences. Low $S$ = local differences mediate the event.
      *   **Additional Tasks:**
          *   Identify High $C$ / Low $S$ cases and evaluate the user's hypothesis about them.
          *   Assign a "Grammatical Subject Tier" (fine / fine with a wink / only in scare quotes / don't) with a one-sentence justification.
