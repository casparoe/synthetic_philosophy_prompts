  5.  **Addressing the "High C / Low S" Hypothesis:**
      *   User says: High $C$ / Low $S$ is where "non-human as actor" does damage.
      *   My analysis: Yes. If $C$ is high, the event mattered locally. If $S$ is low, human institutions determined the *variation*. Saying "The Blight caused the Famine" ignores that the Blight didn't cause a Famine in Belgium. It validates the event as the sole cause, erasing the political economy.
      *   Verdict: The hypothesis is sound. It highlights the difference between a *trigger* and an *explanation of variance*.

  6.  **Addressing the Grammatical Subject:**
      *   Need to be precise. "The virus killed" (Fine). "The Blight starved Ireland" (Scare quotes - policies starved them).

  7.  **Addressing Empirical Shakiness:**
