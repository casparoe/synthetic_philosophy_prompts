      *   Do conclusions survive? Yes.
      *   Better analogy? Yes.

  10. (Final thought on the "Bodyguard" bit): The uncle says hiring a pro army is like hiring a bodyguard to wear your quills. That's biologically impossible. A better critique is that a pro army is a *sword*, conscription is a *shield*. You need both. Or, a pro army is a fire department, conscription is fire-proofing the house.

      *Let's refine the "Better Analogy" to be about **Fire Safety**.*
