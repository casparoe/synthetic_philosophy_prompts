answer: |-
  The weak link in this otherwise tight paradox is **Premise (1)**.

  ### The Diagnosis: Why (1) is the Weak Link

  **Why it seemed plausible:**
  Premise (1) appeals to a deep pre-theoretic intuition: when we see an "a," we feel we are recognizing a single, unified *thing*. This phenomenological immediacy suggests that there must be a singular "essence" (a Platonic form) that all tokens share. It aligns with the computational ideal of pattern matching: if the input matches the template, it *is* the object.

  **Why it is false:**
  (1) commits a category mistake by conflating **glyph identity** (visual form) with **grapheme identity** (linguistic function). It assumes that the conditions for being a *shape* are the same as the conditions for being a *letter*.
  *   A **glyph** is defined by its geometry (topology).
  *   A **grapheme** is defined by its systemic role (its value within a specific orthography).

  By asserting that the essential property is *necessary and sufficient* for being $L$ (the letter), (1) demands that visual form alone constitutes linguistic identity. This ignores the Saussurean principle that signs are defined by their differences within a system, not just their intrinsic properties. An "a" is an "a" not just because of its loops, but because it occupies the "first vowel" slot in the Latin system, distinct from "b" and "c."

  ### Pricing the Three Responses

  Here is the cost-benefit analysis of the three ways to resolve the dilemma, keeping your preference to preserve (2) in mind.

  #### 1. Reject the Absolute Sufficiency in (1)
  *The Modification:* Admit that the topological letter-spirit is **necessary but not sufficient**. A token must possess the topology *and* be licensed by a specific notational system to count as the letter $L$.

  *   **The Cost:**
      *   **Loss of Purity:** You lose the elegant monism where "seeing is knowing." Identity becomes disjunctive: $Identity = Form + Context$.
      *   **Ontological Bloat:** You now need two entities for every letter: the *glyph-type* (the topological spirit) and the *grapheme-type* (the functional role).
  *   **The Benefit:**
      *   **Preserves (2):** This is the only option that keeps your topological definition of letter-spirit intact. The spirit remains purely visual; it just doesn't carry the full weight of linguistic identity on its own.
      *   **Solves Overgeneration:** Greek alpha has the "a-spirit" (topology) but lacks the "a-license" (Latin orthography). It is a homograph, not a token of the Latin letter.
  *   **Verdict:** **Highly Recommended.** This aligns with your desire to keep (2). It treats "letter-spirit" as the *vehicle* of the letter, not the letter itself.

  #### 2. Reject the Purity Claim in (2)
  *The Modification:* Argue that the letter-spirit *must* include non-metric, non-topological features (e.g., "intended for Latin script") to be sufficient.

  *   **The Cost:**
      *   **Mysterious Form:** You undermine the very notion of "form." If "form" includes historical lineage or authorial intent, it is no longer something perceivable in the token itself. It makes "seeing a letter" dependent on knowing its biography.
      *   **Computational Intractability:** For OCR or cognitive modeling, this is a disaster. It implies you cannot recognize a letter without first classifying the language, which usually requires recognizing the letters first (a circular dependency).
  *   **The Benefit:**
      *   **Direct Solution:** It stops the Greek alpha problem at the source by denying it shares the spirit.
  *   **Verdict:** **Too High a Cost.** It violates the phenomenological truth that we *can* recognize the shape of an 'a' before we know what language it belongs to. It sacrifices the perceptual reality of (2) to save the linguistic definition.

  #### 3. Accept Lineage-Anchoring (The "Historical Essence" View)
  *The Modification:* Claim that the letter-spirit is indeed lineage-anchored. The "spirit" is the historical chain of transmission (causal theory of reference), not just the shape.

  *   **The Cost:**
      *   **Epistemic Burden:** As you noted in (8), this makes cross-cultural recognition mysterious. If I see a Latin "a" in a vacuum, do I really see an "a"? According to this view, without knowing the lineage, I only see a shape. This contradicts the immediate intelligibility of writing.
      *   **Fragmentation:** It implies that every time a script evolves or is borrowed, the "spirit" shifts. It makes the letter-spirit unstable over time.
  *   **The Benefit:**
      *   **Linguistic Accuracy:** It correctly identifies that alphabets are historical artifacts, not just geometric sets. It explains why we don't treat a Cyrillic "а" as a Latin "a" even if they are pixel-perfect identical.
  *   **Verdict:** **Philosophically Robust, Phenomenologically Weak.** It is true that alphabets are historical, but it fails to explain how we recognize letters in new contexts (e.g., a font we've never seen, or a script we are just learning).

  ### Synthesis: How to Keep (2) Intact

  To satisfy your constraint, you should adopt **Response 1**.

  You can maintain that the **letter-spirit is purely topological (2)**, provided you redefine what the spirit *does*. The letter-spirit is the **visual invariant**, but it is not the **ontological ground of the grapheme**.

  Think of it like currency:
  *   **Topology (2):** A round piece of metal with a head on it. (This is invariant across pennies).
  *   **System (1 modified):** It is only a "penny" if issued by the US Mint. A round metal disc with a head made in Canada is a "cent," not a "penny," even if the topology is identical.

  **The Revised Argument:**
  1.  For any letterform $L$, there is a topological **glyph-spirit** necessary for recognizing its shape.
  2.  (Kept Intact) Because style varies, this glyph-spirit must be purely topological.
  3.  (Kept Intact) The glyph-spirit of "a" is one enclosed counter joined to an ascending stem.
  4.  (Kept Intact) Greek alpha shares this glyph-spirit.
  5.  **Revised:** Possessing the glyph-spirit makes a token a *visual candidate* for $L$, but not necessarily an *instance* of the grapheme $L$.
  6.  **Resolved:** Alphabet membership fixes function. Greek alpha is a visual homograph of Latin "a," but a distinct grapheme.

  This preserves the topological purity you value in (2) while acknowledging that "being a letter" is a functional status, not just a visual one. The "mystery" of recognition isn't how we know the history (Lineage), but how we map the **Glyph-Spirit** onto the **Grapheme-Role** based on context.
