  hey im in 11th grade and for my philosophy elective we got to talk about moral saints and whether being maximally good is even something you want. i have these gut takes on different people and i want to know if there's a principle behind them or if im just being inconsistent.

  case 1: my cousin donates like 80% of her paycheck and never buys coffee or anything. i think thats super admirable but also kinda depressing, like she's missing out on being a normal teenager.

  case 2: this guy from my church who spends every saturday at the food bank but also plays in a band and has friends. that feels right, like he's good without being a robot.

  case 3: a girl who never lies, not even little white lies, and told her mom her dress looked bad at a wedding. i feel like thats not moral, thats just being a jerk in the name of honesty. but she is sacrificing social comfort for truth, so why do i reject it?

  case 4: someone who gives away tons of money but hides that they still collect stamps because they think its selfish. the hiding part makes it feel worse than case 1, even though case 1 has no hobbies at all.

  case 5: a nurse who works every holiday and never takes vacation, and says she doesnt need friends outside work. i think thats gone too far, she's not a full person anymore.

  so i tried to come up with a rule: maybe 'moral goodness is only desirable when it leaves room for non-moral parts of your life.' but case 3 messes it up because honesty is a moral thing and she's leaving room for nothing, yet i still think shes wrong. and case 4 messes it up because he DOES have a non-moral part but hides it, and that feels bad too.

  also there's this weird case i made up: a person who is literally maximally kind to everyone but has zero inner life, like they never think about themselves at all, just react with perfect empathy. is that the ultimate saint or just a creepy kindness-machine?

  can you figure out what principle actually fits my takes, tell me which ones i have to drop, and say what happens with the kindness-machine? please dont just list philosophers i should read, i dont have libary access and im writing this on my phone.
