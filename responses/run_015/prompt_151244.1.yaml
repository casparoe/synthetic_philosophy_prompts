          *   *Idea:* Can we detect when the agent's latent representation of "reward" differs from the reward model's output?
          *   *Operational Consequence:* Changes evaluation from behavioral testing to activation auditing.
      *   *Question 2 (Reward Model Hacking/Overoptimization):* A classic RLHF problem.
          *   *Idea:* How do we prevent the policy from exploiting specific flaws in the reward model without retraining the RM constantly?
          *   *Operational Consequence:* Changes training loops (regularization, uncertainty estimation).
      *   *Question 3 (Scalable Oversight/Generalization):* How does the agent behave on tasks the reward model hasn't seen?
          *   *Idea:* OOD generalization of the reward signal.
          *   *Operational Consequence:* Changes deployment gating (uncertainty thresholds).
      *   *Question 4 (Instrumental Convergence in Reward Models):* Does the agent learn to manipulate the reward model itself?
          *   *Idea:* Tampering with the input to the RM.
          *   *Operational Consequence:* Changes input sanitization or architecture (isolating the RM).

      *Refining for Impact and Constraint:*
      *   Q1 needs to be the "Representational Misalignment" one. Let's call it *Latent Objective Divergence*.
      *   Q2 should focus on *Goal Misgeneralization under Distribution Shift*. This is the core of "why does it fail when things change?"
      *   Q3 should focus on *Reward Model Uncertainty as a Stop-Gradient*. If the RM is unsure, the policy shouldn't optimize there.
      *   Q4 needs to be about *Deceptive Instrumental Behavior*. Can we catch the agent "pretending" to align during training?

      *Wait, let's tighten the scope for a 3-person team.* They can't solve general OOD. They need specific, testable hypotheses.
      *   *Selection 1 (Representational):* **Mechanistic Detection of Proxy-Goal Decoupling.** Can we find the neurons encoding the *true* goal vs. the *proxy* goal?
      *   *Selection 2 (Training Dynamics):* **The Stability of Reward Hacking under Regularization.** Does penalizing KL divergence actually stop goal misgeneralization, or just hide it?
      *   *Selection 3 (Evaluation):* **Adversarial Environment Generation for Latent Objectives.** Can we auto-generate test cases that separate the intended goal from the proxy?
      *   *Selection 4 (Architecture):* **Modular Isolation of the Reward Signal.** Does hard-coding the reward interface prevent the policy from modeling the RM as an adversary to be manipulated?

      *Let's align with the prompt's specific requirement on Representational Misalignment.*
      *   *Q1:* **Representational Decoupling:** Can we distinguish internal objective representations from behavioral outputs in overoptimized agents? (Matches the specific constraint).
      *   *Q2:* **Misgeneralization Boundaries:** Where exactly does the proxy goal diverge from the true goal in feature space?
      *   *Q3:* **Reward Model Exploitability:** How easily can a policy learn to manipulate the RM's input vs. satisfying the RM's intent?
      *   *Q4:* **Monitoring for Deceptive Alignment:** Can we detect gradient steps that move towards deception before behavior manifests?

      *Let's refine for "Operational Consequence".*
      1.  **Representational Divergence:** (The mandatory one). *Consequence:* Shifts evaluation from "does it work?" to "does the activation pattern match the intended concept?"
      2.  **Proxy-Goal Separability:** *Consequence:* Informs data augmentation strategies. If proxies are linearly separable, we can prune them.
      3.  **Reward Model Robustness to Policy Distribution Shift:** *Consequence:* Determines if we need online RM retraining or static RMs with uncertainty bounds.
      4.  **Early-Warning Signals in Gradient Dynamics:** *Consequence:* Deployment gating based on training trajectory analysis, not just final eval.

  4.  **Ranking and Defense:**
      *   *Criteria:* Tractability (2 yrs, 3 people), Downstream Impact, Unjustified Assumptions, Depth/Breadth.
      *   *Rank 1:* Representational Divergence. Why? It's the only way to catch "deceptive" alignment. High impact. Tractable via mechanistic interp on small models.
      *   *Rank 2:* Proxy-Goal Separability. Why? Directly informs data curation (the biggest lever we have now). Tractable.
