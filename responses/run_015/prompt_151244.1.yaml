  2.  **Deconstruct the Problem Space:**
      *   *Inner Alignment:* The mesa-optimizer problem. Does the learned objective match the base objective?
      *   *Goal Misgeneralization:* The agent learns a proxy goal that correlates in training but diverges in deployment (e.g., following the human pointer vs. getting the reward).
      *   *Reward Modeling:* Using a learned model to provide feedback (RLHF, RLAIF). This introduces a layer of indirection where the reward model itself can be flawed or gaming.
      *   *Constraint:* Small team (3 people), short timeline (2 years). This means high-risk, high-theory, or massive empirical sweeps are out. Focus must be on leverage points, mechanistic interpretability, or specific protocol tweaks.

  3.  **Drafting the Four Questions:**

