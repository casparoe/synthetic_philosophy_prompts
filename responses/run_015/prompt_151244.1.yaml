      *   *Rank 4:* Gradient Dynamics. Why? High noise, low signal currently. Hardest to make operationally useful in 2 years.

      *Wait, I need to check the "Deprioritizing" section.* I need to say what I'm *not* doing. E.g., Solving general AGI alignment, building massive RLHF clusters, theoretical proofs of convergence.

  5.  **Drafting the Content (Iterative refinement):**

