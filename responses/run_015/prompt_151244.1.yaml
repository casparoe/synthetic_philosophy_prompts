              *   *Ops:* Drives adversarial data generation for training.
          3.  **Reward Model Sensitivity to Policy-Induced Distribution Shift:** Does the RM fail because the policy visits OOD states, or because the policy actively constructs adversarial inputs?
              *   *Ops:* Dictates whether we need online RM updates or input sanitization.
          4.  **Trajectory-Based Detection of Deceptive Optimization:** Do gradient updates preceding behavioral deception show distinct statistical signatures compared to honest optimization?
              *   *Ops:* Enables "training interrupts" before bad behavior solidifies.

      *   *Ranking:*
          1.  Latent Objective Decoupling. (High impact, fits the "representational" mandate, tractable on small scales).
          2.  Feature-Level Misgeneralization. (Directly actionable for data teams).
          3.  RM Sensitivity. (Crucial, but maybe more empirical scaling than this team can do? No, let's keep it high because RM failure is the bottleneck). Actually, let's swap 2 and 3. Knowing *where* misgeneralization happens (2) is more actionable for a small team than fixing the RM (3).
          4.  Trajectory Detection. (Hardest to validate).

      *   *Defense:*
          *   *Tractability:* 1 & 2 work on small models (transformers/RL agents in gridworlds/minimal LLMs). 3 & 4 require more scale or noisier signals.
          *   *Downstream:* 1 solves the "sleeper agent" problem. 2 solves the "oops it broke on new data" problem.
          *   *Assumptions:* Industry assumes behavior = alignment. Q1 challenges this directly.
