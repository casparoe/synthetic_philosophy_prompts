      *   *Reordering Triggers:*
          *   If mechanistic interp fails to scale beyond toy models.
          *   If reward hacking proves impossible to elicit in controlled settings.

  6.  **Review against Constraints:**
      *   2 years, 1 senior, 2 junior.
      *   No bibliographies.
      *   Must include Representational Misalignment (Q1 covers this).
      *   Must specify operational changes.
      *   Must defend ranking with specific criteria.
