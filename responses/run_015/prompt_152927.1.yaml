answer: |-
  Your hunch is correct. The stalemate is not about the hardware (brains vs. silicon) but about the **status of generalizations** in science. The debate persists because the two sides are optimizing for different theoretical virtues under the guise of a single ontological question.

  Here is the diagnosis of the stalemate and what actual progress would look like.

  ### The Diagnosis: Modal Metaphysics vs. Explanatory Taxonomy

  The debate is a category error resulting from conflating **modal breadth** with **causal depth**.

  1.  **Functionalism is a Modal Claim:** When functionalists argue for multiple realizability (MR), they are making a claim about *possibility space*. They are asking: "What are the necessary and sufficient conditions for a state to count as 'pain' across all possible worlds?" Their goal is to secure the **autonomy** of psychology. If mental kinds are tied to neural kinds, then a silicon mind is impossible. To save the intuition that aliens/robots can have minds, they must treat mental kinds as substrate-independent.
  2.  **Reductionism is a Taxonomic Claim:** When reductionists attack MR, they are making a claim about *actual causal structure*. They are asking: "Do the entities referred to by 'pain' share a common causal mechanism that supports induction and prediction?" Their goal is **explanatory unity**. If 'pain' refers to a wildly disjunctive set of physical states (C-fibers firing, silicon gates switching, hydraulic pressure), then there is no single *thing* doing the explaining.

  **The Stalemate:**
  *   The Functionalist says: "MR proves mental kinds are real because they survive substrate changes." (Truth condition: Consistency of input/output relations).
  *   The Reductionist says: "MR proves mental kinds are fake because they fragment across substrate changes." (Truth condition: Homogeneity of underlying mechanism).

  They are talking past each other because they are using "Real" to mean different things. For the Functionalist, "Real" means **robust across counterfactuals**. For the Reductionist, "Real" means **projectible within a causal mechanism**.

  ### The Core Conflict: Disjunctive Kinds and Laws

  You asked if this is a hidden fight over whether disjunctive kinds can figure in laws. **Yes.** This is the engine of the stalemate.

  *   **Fodor's Position:** Special science laws (psychology) are real, so their kinds must be projectible. If mental kinds were disjunctive physical properties, they couldn't support laws. Therefore, mental kinds are *sui generis*.
  *   **Kim's Position:** If a kind is disjunctive at the physical level, it is not a natural kind. Causal powers reside in the physical base. Therefore, "pain" is just a convenient label for a heterogeneous set of physical events, not a causal kind itself.

  The stalemate endures because neither side can definitively prove whether "projectibility" is a feature of the world or a feature of our descriptive granularity.

  ### What Would Move the Debate?

  A formal result about projectibility is unlikely to solve this because projectibility is context-dependent. A clarification of metaphysical "realization" won't help because the metaphysics is being driven by the explanatory needs.

  Progress requires **dissolving the binary question** via a specific clarification of **mechanistic explanation**.

  #### 1. Abandon "Type Identity" for "Mechanism Schemas"
  The debate assumes we must choose between "Mental State = Neural State" (Identity) or "Mental State = Abstract Role" (Functionalism). Both are wrong.
  *   **Progress:** Adopt the **New Mechanist** framework (e.g., Craver, Kaplan). Mental states are not types identical to neural states, nor are they abstract roles floating above them. They are **mechanism schemas**.
  *   A mechanism schema is a sketch of a causal structure that can be filled in by different details in different contexts. "Pain" is a schema that is filled in by C-fibers in humans, different ganglia in octopuses, and potentially logic gates in AI.
  *   **Resolution:** The mental kind is "real" as a schema (functional organization), but it only has causal power when instantiated in a specific mechanism (reduction). This validates the Functionalist's intuition about aliens *and* the Reductionist's demand for mechanisms.

  #### 2. Contextual Projectibility (The "Grain" Solution)
  The question "Can disjunctive kinds figure in laws?" is badly posed. The answer is: **It depends on the grain of the explanation.**
  *   **Progress:** We stop asking if "Pain" is a natural kind *simpliciter* and start asking: "At what level of abstraction does the generalization hold?"
  *   In a clinical context, "Pain" is projectible regardless of substrate (humans and dogs both withdraw and vocalize). In a neurosurgical context, "Pain" is not projectible (you can't treat dog pain exactly like human pain).
  *   **Resolution:** Mental kinds are **scale-relative**. They are robust at the behavioral/functional scale but fragment at the molecular scale. The debate stalls because Functionalists operate at the behavioral scale and Reductionists at the molecular scale, yet both claim their scale is the "ontologically fundamental" one.

  ### Verdict

  The question is **badly posed** because it demands a single ontological status for mental states across all levels of description.

  **What progress looks like:**
  1.  **Stop asking:** "Are mental states identical to brain states?"
  2.  **Start asking:** "Under what constraints does a functional description successfully predict the behavior of a physical mechanism?"
  3.  **The Shift:** Move from a metaphysics of **substances/kinds** to a metaphysics of **control hierarchies**. Mental states are control variables in a system. Whether they are "real" depends on whether manipulating that variable reliably changes the system's output, regardless of the substrate.

  The debate ends not when one side wins, but when we recognize that "Multiple Realizability" is not an argument against reduction, but an argument for **abstraction**. It shows that certain causal structures are invariant across physical changes. That invariance is what we call "the mental." It is real, but it is not a *substance*; it is a **stable pattern of organization**. Recognizing patterns as ontologically legitimate (without being fundamental particles) dissolves the need to choose between functionalism and reductionism.
