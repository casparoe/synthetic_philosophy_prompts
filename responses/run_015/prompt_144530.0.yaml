answer: |-
  The actionability worry is fatal unless you concede the norm guides only via reasonable expectations of stakes, which collapses the view into a standard contextualist knowledge norm.

  **1. Fatal and Serious Defeaters**

  **The Actionability Problem (Fatal)**
  A norm must be followable. If permissibility depends on the hearer's actual stakes, you cannot know if you are violating the norm until after the assertion is made, because you rarely have access to the hearer's internal situation. In your coordinator case, she knows the patient's stakes are high. In a bar case, you assume they are low. But in intermediate cases (e.g., telling a colleague a project deadline), you cannot know if they are betting their bonus on it. If the norm requires actual stakes, you are perpetually blind to your permissibility.
  *   **Consequence:** To save the view, you must retreat to "reasonable expectation of hearer stakes."
  *   **Damage:** This shifts the locus back to the speaker's epistemic state. If I reasonably believe your stakes are low, I am permitted to assert with low warrant, even if your actual stakes are high. This effectively makes the norm speaker-relative again.

  **The Collapse Objection (Serious/Meta)**
  Your friend suspects this is the Knowledge Norm wearing a different hat. If "being in a position to know" is sensitive to practical context (Pragmatic Encroachment), and that context includes the hearer's stakes (as your view demands), then "Assert only if you know" yields the exact same verdicts as your view.
  *   **Consequence:** The view is not false, but redundant. The "interesting question" of which norm governs assertion dissolves into a question about the nature of knowledge.
  *   **Damage:** You lose the distinctiveness of your theory. To avoid this, you must argue that knowledge is invariant while assertion norms are variable, but this severs the tight link between knowledge and assertion that motivates norm theories in the first place.

  **Hearer-Stakes Intuition Divergences (Serious)**
  There are cases where hearer stakes are high, but intuition says the warrant bar does not rise.
  *   **Harmful Truths:** Telling someone "your spouse is cheating" or "you have a terminal illness" creates massive stakes for the hearer. Intuition suggests you need evidence (the test result, the photo), but not *more* evidence than you would need to tell them something benign. Your view risks implying you need near-certainty to deliver bad news, which paralyzes necessary communication.
  *   **Hostile/Self-Imposed Stakes:** A gambler asks for a tip; a litigant asks for your memory of an event. Their stakes are self-imposed and high. Your view implies you owe them higher warrant. Intuition says their risk is on them.
  *   **Damage:** You must define "stakes" narrowly (e.g., "legitimate stakes in acting on the information"), which looks like ad hoc maneuvering to save the theory from counterexamples.

  **2. Awkward Consequences and No-Hearer Cases**

  **No-Hearer Cases (Awkward)**
  Diary entries, soliloquies, and fictional narration lack a specific hearer with specific stakes.
  *   **Consequence:** If your norm is constitutive of assertion, these acts are either impermissible or not assertions.
  *   **Damage:** This suggests assertion isn't a unified kind. For fiction, the standard defense is that narrators are *pretending* to assert, so norms don't apply. This is principled (Searle), but awkward for a novelist who feels a normative weight to write truthfully. If you claim fiction is exempt, you must explain why the feeling of normative constraint exists.

  **Unfalsifiability (Meta)**
  If "stakes" can be tweaked to match any intuition (e.g., "in this case the stakes were actually low"), the theory predicts nothing.
  *   **Prediction:** Your view uniquely predicts that moral blame for bad assertions tracks hearer harm, while epistemic criticism tracks speaker warrant. Rivals often blend these.
  *   **Defect:** If you qualify "stakes" too much (e.g., "reasonable expectation," "legitimate stakes," "action-relevant stakes"), the view becomes unfalsifiable. For norms-of-assertion theories, some qualification is the normal condition; total vacuity is a defect. Your view is near the line.

  **3. Concessions vs. Wave-Offs**

  **What a Committed Defender Must Concede**
  *   **Access Limitation:** You must concede speakers cannot know actual hearer stakes, only reasonable expectations. This admits the norm is not strictly hearer-relative in practice.
  *   **Redundancy:** You must concede that if knowledge encroaches on stakes, your view is extensionally equivalent to the Knowledge Norm, making the dispute terminological.
  *   **Fictional Exemption:** You must concede that fictional assertions are exempt from the norm, relying on the "pretend assertion" distinction, which may not satisfy the phenomenological experience of writing truth.

  **What a Committed Defender Would Wave Off**
  *   **Extreme Opacity:** Cases where stakes are utterly unknowable (e.g., random stranger). The defender will claim assertion is excused but technically impermissible, or that a "community standard" of stakes applies.
  *   **Harmful Truths:** The defender will distinguish "stakes in hearing" from "stakes in acting." They will argue the bar rises only for action-guiding assertions, waving off the intuition that bad news requires the same warrant as good news.
  *   **Hostile Hearers:** The defender will argue that self-imposed risks do not count as normative stakes for the speaker, layering a moral theory onto the epistemic norm to avoid counterintuitive results.
