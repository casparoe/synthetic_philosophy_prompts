answer: |-
  This kind of embedding shows that pure expressivism must abandon compositionality, because a disjunctive-attitude fix cannot preserve it without smuggling in cognitive content. When the clause "it is wrong that, necessarily, every agent acts only if they know they cause harm" is asserted alone, the expressivist analyzes it as expressing a higher-order conative state, such as disapproving of any norm-system that permits the necessary implication of action by knowledge of harm. However, embedding this clause inside "Sarah believes that..." creates a semantic mismatch: the belief operator requires a propositional object to which Sarah stands in a doxastic relation, yet the expressivist insists the clause contributes only an attitude type. To maintain compositionality, the semantic value of the clause must remain constant across contexts, but if it remains an attitude expression in the belief context, the attribution becomes category-mistaken, as one cannot believe an imperative or a feeling.

  Blackburn-style or Gibbard-style fixes attempt to resolve this by defining the embedded content as a complex normative property or a set of hyperplans, where "Sarah believes that [clause]" is parsed as "Sarah accepts the norm encoded by [clause]." This disjunctive-attitude strategy fails to preserve logical consequence relations across the modal-quantifier embedding without covertly treating the embedded clause as having descriptive belief-content. For the inference from "Sarah believes that [clause]" to "Sarah believes that it is not permissible that some agent acts without knowing harm" to be valid, the internal modal operators ($\Box$, $\forall$) must function truth-functionally over a domain of possibilities. If the content is merely a plan-state, the logical connectives operate on consistency of plans rather than truth conditions; yet, belief attributions standardly track truth-apt content. By reifying the plan-state into a proposition-like object to satisfy the logical requirements of the belief context, the expressivist grants the clause the very truth-conditional structure they deny, effectively treating the embedded clause as having descriptive belief-content about normative facts.

  Relaxing pure expressivism does less damage to the broader non-cognitivist program than giving up compositionality. Abandoning compositionality renders normative discourse logically inert, making it impossible to explain the validity of ethical reasoning or the rationality of disagreement, which are central to the non-cognitivist's aim of capturing normative practice. While relaxing pure expressivism blurs the metaphysical distinction between cognitive and non-cognitive states by mimicking propositional structure, it allows the non-cognitivist to retain the core denial of robust normative facts while accommodating the linguistic data through a quasi-realist semantics that treats normative claims as truth-apt without ontological commitment.
