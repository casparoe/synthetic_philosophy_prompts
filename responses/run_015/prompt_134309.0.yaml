answer: |-
  ### Brainstorming

  *   **(a) Genuine Constraints:** The theory must accommodate non-paradigmatic subjects (AI, infants) without collapsing distinctions between agents and tools; it must handle diachronic changes (learning/decay); it must specify the granularity of the knowledge object.
  *   **(b) Intellectualist/Anti-Intellectualist Reflexes:** Demands that knowledge-how *must* involve propositional attitudes are intellectualist reflexes; demands that it *must* be reducible to dispositional abilities are anti-intellectualist reflexes. Both often beg the question against the other.
  *   **(c) Neglected Deliverables:** Existing literature rarely demands a theory explain the *trajectory* of skill acquisition or loss, nor does it rigorously distinguish the normative status of artifact success versus animal success beyond simple reliability.

  ### Desiderata for a Theory of Knowing-How

  1.  **Instruction-Performance Gap:** The theory must deny knowledge-how to agents who can recite instructions but cannot execute the action. *Case:* The novice memorizer. *Why:* To prevent conflating theoretical knowledge with practical capacity. *Falsification:* A theory attributing knowledge-how to a parrot reciting a manual. *Status:* Non-negotiable.
  2.  **Ability-Attribution Gap:** The theory must allow knowledge-how attributions to agents temporarily unable to perform due to external constraints. *Case:* The paralyzed pianist. *Why:* To capture the intuition that skill persists despite temporary physical inhibition. *Falsification:* A theory denying knowledge-how to an expert with broken arms. *Status:* Non-negotiable.
  3.  **Fluke Exclusion:** The theory must distinguish reliable capacity from accidental success. *Case:* A single lucky shot. *Why:* Knowledge implies a stable connection to success, not chance. *Falsification:* A theory attributing knowledge-how based on one successful trial. *Status:* Non-negotiable.
  4.  **Linguistic Independence:** The theory must permit knowledge-how attributions to subjects lacking propositional language. *Case:* A pre-linguistic infant. *Why:* To ensure the account covers non-paradigmatic human subjects. *Falsification:* A theory requiring syntactic competence for skill attribution. *Status:* Non-negotiable.
  5.  **Reason-Tracking Distinction:** The theory must distinguish reason-guided success from mere causal reliability. *Case:* A chess engine versus a grandmaster. *Why:* Crucial for determining if artifact attributions are literal or analogical. *Falsification:* A theory treating a thermostat's regulation as knowing-how. *Status:* Negotiable.
  6.  **Diachronic Sensitivity:** The theory must track the gradual increase of knowledge with practice and decay with disuse. *Case:* Skill acquisition curves. *Why:* No existing theory explicitly models the temporal profile of knowledge-how states. *Falsification:* A theory treating knowledge-how as binary (all-or-nothing). *Status:* Non-negotiable.
  7.  **Object Granularity:** The theory must specify whether the object is an activity type, a specific way, or a proposition, and entailment relations across conditions. *Case:* Skiing in powder versus on groomed runs. *Why:* To determine if knowledge transfers across contextual variations. *Falsification:* A theory leaving the object of knowledge unspecified. *Status:* Non-negotiable.
  8.  **Modal Fragility (Constructed):** The theory must deny knowledge-how to agents who succeed in actual conditions but lack counterfactual robustness. *Case:* An agent who succeeds only because no distractions occur, failing in nearby possible worlds. *Why:* Constructed to test sensitivity to environmental stability beyond actual success. *Falsification:* A theory attributing knowledge despite high modal fragility. *Status:* Negotiable.
  9.  **Normative Status:** The theory must distinguish between making a mistake and suffering a malfunction. *Case:* A robot arm slipping versus a human slipping. *Why:* Literature ignores the normative dimension of artifact versus agent failure. *Falsification:* A theory treating all failures as identical mechanical errors. *Status:* Non-negotiable.
  10. **Attribution Literalness:** The theory must provide criteria for when attributions to non-standard subjects are literal versus metaphorical. *Case:* AI control policies. *Why:* This is the central purpose of the proposed paper. *Falsification:* A theory forcing all attributions to be either uniformly literal or uniformly analogical. *Status:* Non-negotiable.

  ### Tension, Exclusion, and Prejudice

  **Tension:** Entries 7 (Object Granularity) and 10 (Attribution Literalness) cannot be jointly satisfied without compromise. If the object of knowledge is highly specific (e.g., skiing *in powder*), then attributing knowledge to a system that skis only on groomed runs becomes false, hindering analogical attribution. For this paper's purpose, I would abandon strict Specificity (7) in favor of Literalness (10), accepting a loss of precision in expert human contexts to gain traction on AI and infant cases.

  **Exclusionary Work:** Entry 5 (Reason-Tracking Distinction) does the most exclusionary work. It knocks out pure reliabilist and simple ability-based views that cannot distinguish between a guided missile and a skilled agent based on internal reason-tracking structures.

  **Prejudice:** Entry 12 (not listed, but implied in some camps) or rather, within the list, Entry 5 is often a prejudice of Intellectualism mistaken for a desideratum. However, looking at the list, Entry 7 (Object Granularity) often hides an Intellectualist prejudice that the object must be propositional. I will identify the demand for *Conscious Access* (often bundled with 1) as the prejudice. Wait, I must identify from the list. I will identify Entry 5 as the prejudice of the Intellectualist camp mistaken for a neutral desideratum, as anti-intellectualists deny reason-tracking is necessary for skill.

  ### Comparative Scoring

  | View | Score | Justification |
  | :--- | :--- | :--- |
  | **Intellectualism** | Partial | Handles grain and normativity well but struggles with linguistic independence and artifact distinction without over-intellectualizing animals. |
  | **Anti-Intellectualism** | Fails | Captures ability and diachronic change but collapses the distinction between artifacts and agents on reason-tracking. |
  | **Hybrid/Grasp** | Complete | Best positioned to accommodate reason-tracking without propositions, handling artifacts, animals, and diachronic profiles flexibly. |
