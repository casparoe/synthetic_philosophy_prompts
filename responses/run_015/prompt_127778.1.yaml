answer: |-
  **Exam Question**

  **Course:** MET405 – Advanced Metaphysics
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**
  Consider the following case: A terracotta portrait bust is shattered. A conservator reconstructs it using a 3D-printed ceramic core. Fragments of the original clay are embedded as discontinuous inclusions within the new outer shell; the original material is neither continuously present nor wholly absent.

  Is the reconstructed object identical to the original bust? Critically evaluate this question by applying **three** of the following metaphysical frameworks:
  1.  Four-Dimensionalism (Temporal Parts)
  2.  Relative Identity
  3.  Hylomorphism

  Your answer must move beyond standard statue-and-lump puzzles. Specifically, analyze how the *discontinuous distribution* of the original material challenges each view. Conclude by identifying a decisive weakness in one of the three accounts when applied to this specific restoration scenario.

  ***

  **Model Answer**

  The reconstruction scenario challenges standard constitution theories because the original matter is neither wholly preserved nor wholly replaced, but scattered within a new substrate. The question is whether identity survives this discontinuous distribution.

  Four-Dimensionalism treats the bust as a spacetime worm composed of temporal parts. The pre-shattered bust and the reconstructed object are distinct temporal stages. For them to be stages of the same worm, there must be causal continuity. The embedded fragments provide a causal link between the original clay and the new shell, potentially securing gen-identity. However, the discontinuity poses a problem: if the original matter is merely included as inert inclusions rather than functioning structurally, the causal continuity required for temporal extension may be broken. The view risks implying that identity is arbitrary depending on how much causal weight we assign to the fragments versus the core.

  Relative Identity theory, associated with Geach, denies absolute identity. We must ask: same *what*? The reconstructed object is not the same *mass of clay* as the original, given the 3D-printed core. However, it may be the same *artifact* or *bust*. The discontinuous inclusions might satisfy the conventional criteria for the sortal "bust," even if they fail the criteria for "clump of matter." This view handles the scenario well by allowing identity relative to the artifact sortal while acknowledging material replacement. Yet, it relies heavily on linguistic conventions rather than metaphysical facts, leaving it unclear why specific physical thresholds (e.g., 10% original fragments) trigger identity.

  Hylomorphism distinguishes between matter (hyle) and form (morphe). The bust's identity resides primarily in its substantial form—the shape and function of the portrait. The reconstruction restores the form. The mixed matter (original fragments plus new ceramic) serves as the substrate. If the form is successfully imposed on the new composite matter, the substance persists. However, the discontinuous nature of the original matter challenges the unity of the substrate. If the original matter is merely decorative inclusion rather than constitutive, has the form truly been realized in the *original* substance, or is this a new substance mimicking the old form?

  A decisive weakness arises in Hylomorphism here. While it prioritizes form, it lacks a precise metric for material continuity required to sustain *this* particular form. If the form can be realized entirely in new matter, the original fragments become metaphysically redundant. If the original fragments are necessary, Hylomorphism fails to explain why discontinuous inclusions suffice when continuous matter does not. Thus, it struggles to define the threshold where restoration becomes replication.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **A Grade (20–25 Marks): Excellent**
  *   **Theory Application (10 marks):** Accurately explains Four-Dimensionalism, Relative Identity, and Hylomorphism without rote definition.
  *   **Scenario Engagement (10 marks):** Explicitly applies at least two of the three views to the *discontinuous-inclusion* problem (e.g., discussing causal chains in 4Dism, sortal thresholds in Relative Identity, or substrate unity in Hylomorphism). Does not treat the case as a standard statue/lump puzzle.
  *   **Critical Evaluation (5 marks):** Identifies a decisive weakness in one view specifically regarding the restoration scenario (e.g., Hylomorphism's lack of material threshold).
  *   **Clarity:** Argument is coherent, concise, and directly answers the identity question.

  **B Grade (15–19 Marks): Good**
  *   **Theory Application (10 marks):** Correctly summarizes the three views.
  *   **Scenario Engagement (5 marks):** Fails to engage deeply with the *reconstructed-bust* scenario. Discusses the theories in the abstract or relies on standard examples (e.g., Ship of Theseus, generic statue/lump) without addressing the specific issue of discontinuous fragments embedded in a 3D-printed core.
  *   **Critical Evaluation (4 marks):** Offers a general critique but does not link it to the specific constraints of the prompt.
  *   **Clarity:** Understandable but lacks specific application.

  **C Grade (10–14 Marks): Satisfactory**
  *   **Theory Application (5 marks):** Demonstrates basic understanding of the theories but contains inaccuracies.
  *   **Scenario Engagement (5 marks):** Minimal reference to the scenario; treats the prompt as a general identity question.
  *   **Critical Evaluation (4 marks):** Weak or absent critique.
  *   **Clarity:** Disorganized or vague.

  **D/F Grade (0–9 Marks): Poor**
  *   **Theory Application (0–5 marks):** Significant misunderstanding of metaphysical concepts.
  *   **Scenario Engagement (0–2 marks):** Ignores the scenario entirely.
  *   **Critical Evaluation (0–2 marks):** No critical analysis.
  *   **Clarity:** Incoherent or insufficient length.
