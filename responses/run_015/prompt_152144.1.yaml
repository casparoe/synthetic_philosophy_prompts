      *   **Tone:** Professional, direct, theoretically grounded but practically oriented.

  2.  **Deconstruct the Theory for Practice:**
      *   *Prediction Error Minimization:* The writer has a model of their text; the reader (tutor) has a model of the assignment/genre. Mismatch = error.
      *   *Precision Weighting:* How confident is the writer? High precision = rigid beliefs (hard to change). Low precision = diffuse/unsure (needs structure).
      *   *Active Inference:* Action (editing/writing) changes the world to match predictions. Perception changes predictions to match the world. Tutoring mediates this.
      *   *Expected Free Energy (EFE):*
          *   *Pragmatic Value:* Achieving the goal (good grade, finished draft).
          *   *Epistemic Value:* Reducing uncertainty (learning how to write, understanding the topic).
      *   *Dark Room Problem:* Agents minimize surprise by doing nothing (hiding in a dark room). In tutoring, this looks like seeking only validation to avoid the "surprise" of criticism.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Translate CS jargon into tutor actions.
      *   *Step 1: Calibration (Reading Precision).* Ask open-ended questions to gauge confidence.
      *   *Step 2: Goal Alignment (Pragmatic vs. Epistemic).* Determine if they need a fix or a lesson.
      *   *Step 3: Intervention (Updating the Model).* High precision needs counter-evidence. Low precision needs scaffolding.
