  # Handout: Taxonomy of Responses to Death in Damascus
  **Graduate Reading Group: Decision Theory & Predictive Instability**

  ## I. Background Fixation
  To ensure we are debating the same case, we fix the following parameters for all branches of this tree:
  *   **The Setup:** You are in Damascus. Death predicts where you will be tomorrow (Aleppo or Damascus) and goes there. If you meet, you die (-1000 utility). If you evade, you survive (+100 utility). Travel costs 1 utility.
  *   **The Predictor:** Death is not a pursuer; he is a predictor. He makes his prediction *before* you choose.
  *   **The Variants:**
      1.  **Accuracy:** Death is either 99% accurate or 70% accurate.
      2.  **Legibility:** In some variants, the prediction is written on a card in a sealed envelope you may open.
      3.  **Delegation:** You may irrevocably hand your destination choice to a device whose output you cannot predict.
      4.  **Amnesia:** You may take a drug that erases your memory of the envelope's content before you choose.

  ## II. The Logical Space (Branch Nodes)
  *Answer these questions based on your intuitions about the case variants above. Do not worry about which theory your answer implies.*

  1.  **Coherence:** Is it metaphysically possible for an external predictor to be 99% accurate about a deliberating agent who knows this fact?
      *   *(Yes → Go to 2)*
      *   *(No → Leaf A)*
  2.  **Envelope Response:** If you open the envelope and see "Aleppo," is it rational to go to Damascus?
      *   *(Yes → Leaf B)*
      *   *(No → Go to 3)*
  3.  **Evidential Relevance:** If the envelope is *not* opened, does the act of *choosing* Aleppo make it more likely (as a matter of evidence) that Death is in Aleppo?
      *   *(Yes → Go to 4)*
      *   *(No → Go to 5)*
  4.  **Stability:** If you tentatively decide "Aleppo," does the conditional probability of Death being in Aleppo rise high enough that "Damascus" becomes the better option?
      *   *(Yes → Go to 6)*
      *   *(No → Go to 5)*
  5.  **Algorithmic Control:** Do you influence Death's prediction primarily by fixing your decision *rule* (algorithm) rather than your specific physical movement?
      *   *(Yes → Leaf C)*
      *   *(No → Leaf D)*
  6.  **Mixed Acts:** If no pure act is stable, is "flip a coin and obey" available to you as a basic rational option?
      *   *(Yes → Leaf E)*
      *   *(No → Go to 7)*
  7.  **Delegation:** Is handing choice to an unpredictable device rationally distinct from flipping a coin yourself?
      *   *(Yes → Leaf F)*
      *   *(No → Go to 8)*
  8.  **Amnesia:** If you open the envelope, is it rational to take the drug that erases that knowledge before choosing?
      *   *(Yes → Leaf G)*
      *   *(No → Leaf H)*
  9.  **Bias Sensitivity:** If Death is 70% accurate and biased toward predicting Aleppo, should you go to Damascus more than 30% of the time?
      *   *(Used to diagnose Leaves D & F)*
  10. **Accuracy Sensitivity:** Does your advice change structurally if accuracy drops from 99% to 70%?
      *   *(Used to diagnose Leaves D & E)*

  ## III. The Leaves (Positions)

  | Leaf | Position Name | Path Signature | The Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **The Incoherence View** | Node 1: No | The case is ill-posed; near-perfect external prediction of a deliberating agent is inconsistent with the agent's deliberating at all, so the instability is an artifact of stipulations that cannot jointly hold. |
  | **B** | **Evidential Decision Theory** | Node 2: Yes | You should stay where you are if the envelope says you will die there, effectively treating the prediction as a fatalistic decree you cannot causally evade. |
  | **C** | **Functionalism** | Node 5: Yes | You are responsible for Death's prediction because you are the algorithm that generated it, even if you don't know the output yet. |
  | **D** | **Causal Decision Theory** | Node 5: No | You should ignore the envelope and the correlation entirely, acting as if your choice cannot possibly be evidence of a past prediction. |
  | **E** | **Mixed-Strategy Dynamics** | Node 6: Yes | Rationality requires you to flip a coin, even though Death predicts the outcome of the coin flip, relying on the degradation of accuracy to chance. |
  | **F** | **Delegation View** | Node 7: Yes | You can save yourself only by ceasing to be an agent and becoming a conduit for an unpredictable device, which degrades Death's accuracy to chance. |
  | **G** | **Ratificationism** | Node 8: Yes | A permissible act must maximize expected utility conditional on your making it, and you must take the drug to make any act satisfy this requirement. |
  | **H** | **Diachronic Tragedy** | Node 8: No | No act is rationally permissible and the case is a diachronic tragedy; rationality requires the impossible, and the drug offers no escape. |

  ## IV. Unoccupied Logical Space
  *Combinations of answers that yield no standard position.*

  *   **Nodes 2 (Yes) + 4 (No):** *Diagnosed as Incoherent.* If opening the envelope changes your choice (EDT), then your choice is evidence of the prediction. If your choice is evidence, then settling on a choice must shift the probabilities (Stability). Denying stability while affirming the envelope response creates a logical loop where the evidence matters for the prediction but not for the deliberation.
  *   **Nodes 6 (No) + 7 (No) + 8 (No):** *Diagnosed as Merely Unattractive.* This combination asserts that no pure act is stable, mixing is not allowed, delegation doesn't help, and information avoidance is irrational. This leaves the agent with no permissible moves but refuses to label the situation a "Tragedy." It is a paralysis without a diagnosis.
  *   **Nodes 9 (No) + 10 (No) for Leaf E:** *Diagnosed as Unexplored.* Most Mixed-Strategy accounts assume accuracy levels matter for the equilibrium mix. A view that recommends mixing at 99% but denies the mix should shift at 70% bias/accuracy has not been seriously defended in the literature.

  ## V. Indistinguishable Leaves & Separating Variants
  *Pairs of positions this tree fails to separate, and the variants required to pry them apart.*

  **1. Causal Decision Theory (Leaf D) vs. Functionalism (Leaf C)**
  *   **The Problem:** In *Death in Damascus*, both views typically recommend ignoring the prediction and choosing the city you prefer (or randomizing if indifferent). They converge on the same action because Death predicts *location*, not *algorithm*.
  *   **The Separating Variant:** **Newcomb's Problem with a Predictor of Algorithms.** Modify the case so Death predicts your *decision rule* (e.g., "Always choose Aleppo" vs. "Maximize Expected Utility") rather than your destination. Functionalism will one-box (or align with the rule); CDT will two-box (or ignore the rule's correlation).

  **2. Ratificationism (Leaf G) vs. Diachronic Tragedy (Leaf H)**
  *   **The Problem:** At 99% accuracy, both views agree that no standard act is stable. They diverge on the *drug* (Node 8), but many Ratificationists argue the drug merely shifts the instability to the drug-choice itself, collapsing back into Tragedy.
  *   **The Separating Variant:** **The Transparent Envelope.** Make the prediction legible *without* an envelope (e.g., Death announces it aloud). If the agent can take the drug *before* hearing the announcement, Ratificationism permits it (restoring ratifiability); Tragedy argues the mere *availability* of the prediction creates the instability, regardless of memory.

  **3. Mixed Strategy (Leaf E) vs. Delegation (Leaf F)**
  *   **The Problem:** If Death predicts *where you will be*, he predicts the outcome of your coin flip just as well as the output of a device. Both rely on "degrading accuracy to chance," but if Death predicts the *outcome* of the chance process, both fail equally.
  *   **The Separating Variant:** **Causal Isolation of the Randomizer.** Specify that Death predicts *your neural states* but cannot predict *quantum events* in an external device. Delegation works; internal mixing does not. This separates views that locate the "self" in the brain (Mixing fails) from views that locate the "self" in the causal chain of command (Delegation works).
