answer: |-
  Here are ten interview questions designed to press the specific contours of your guest's Predictive Interoceptive Framing theory, including the required follow-ups.

  **1. The Intentionality Problem**
  "Classical feeling theories have historically struggled to explain how a bodily state can be *about* an external object—how a racing heart is fear *of the bear* rather than just a racing heart. On your view, the conscious feeling is merely the residual prediction error. But prediction errors are typically self-referential signals about the model's failure, not the world. How does a residual interoceptive error acquire intentionality directed at an external situation?"
  *   **Follow-up:** "If you answer that the *top-down model* provides the intentional object while the feeling is just the error signal, doesn't that render the conscious feeling explanatorily redundant for intentionality? In other words, if the scaffolding carries the 'aboutness,' what work is the feeling actually doing?"

  **2. The Cognitivism Collapse**
  "You emphasize that top-down predictive models assign affective significance to interoceptive signals *before* they reach awareness. This sounds remarkably like a neo-cognitivist view where a judgment or appraisal precedes the emotion. What prevents your view from collapsing into the very cognitivism you seek to replace, where the 'emotion' is essentially the predictive model and the feeling is just a downstream echo?"
  *   **Follow-up:** "If you insist the feeling is constitutive rather than epiphenomenal, can you specify a causal power the *residual error* has that the *predictive model* lacks? If the model already assigned significance, why do we need the error to complete the episode?"

  **3. Moral Emotions and Normative Content**
  "Consider moral indignation. This emotion seems to require grasping a normative violation—someone *ought not* to have done that. It is difficult to see how a 'residual prediction error' in the viscera could encode the conceptual content of unfairness or justice. How does your account accommodate emotions that appear essentially concept-laden?"
  *   **Follow-up:** "If you argue that the predictive model contains the normative concepts and the feeling is just the bodily reaction to their violation, are we not back to a standard judgment-plus-arousal view? How is this distinct from the classical Nussbaum or Solomon cognitivist accounts you are critiquing?"

  **4. Pathology vs. Appropriateness**
  "In clinical contexts, we distinguish between appropriate fear (a response to immediate threat) and pathological anxiety (a response to uncertain or non-existent threat). If both are mechanistically identical—high-precision prediction errors regarding interoceptive states—on what basis do you distinguish the rational from the pathological? Is it simply a matter of external accuracy?"
  *   **Follow-up:** "If you appeal to external accuracy, doesn't that undermine the internalist nature of feeling theory? If the feeling is the same in both cases, then the 'emotion' itself cannot tell us whether it is fitting; only the external context can. Does this not strip the emotion of its own epistemic authority?"

  **5. The Phenomenology of Error**
  "You identify conscious feeling with *prediction error*. In predictive processing literature, error signals usually function as 'surprise' markers that prompt model updating. However, many emotional states, like melancholy or contentment, do not feel like 'surprise' or 'glitches'; they feel like sustained backgrounds. How does an error signal sustain a stable phenomenological tone?"
  *   **Follow-up:** "If you suggest that the error is sustained because the model fails to update repeatedly, does this not imply that a healthy emotional life requires a constant failure of prediction? That seems to contradict the predictive brain's goal of minimizing surprise."

  **6. Valence and Polarity**
  "Prediction errors are typically quantified as magnitudes of deviation. But emotions have valence—they are positive or negative. How does a purely statistical prediction error encode the qualitative difference between the 'good surprise' of joy and the 'bad surprise' of dread? Is valence just another hyperparameter in the model?"
  *   **Follow-up:** "If valence is determined by the model's expectations rather than the error itself, doesn't that return us to the problem that the *feeling* (the error) is valence-neutral? How can a bare residue carry the positive or negative charge we experience?"

  **7. Differentiation of Discrete Emotions**
  "Without relying on cognitive labels, can the interoceptive residue alone distinguish anger from fear? Classical James-Lange theory was criticized because bodily states are too undifferentiated to support discrete emotion categories. Does your predictive framing solve this, or does it rely on the top-down model to categorize the error post-hoc?"
  *   **Follow-up:** "If the model categorizes the error, then the conscious feeling is not the emotion, but the *raw material* of the emotion. Why, then, do we identify the feeling *as* the emotion in our first-person experience?"

  **8. The Function of Consciousness**
  "If the top-down model has already assigned significance and initiated physiological regulation before awareness, what is the evolutionary function of the conscious residue? Why does the system need to 'feel' the prediction error rather than just updating the weights unconsciously?"
  *   **Follow-up:** "If you argue it allows for flexible behavioral intervention, why must that intervention be *affective*? Could the system not simply flag 'high uncertainty' cognitively without the qualitative pain or pleasure of the feeling?"

  **9. Temporal Structure and Moods**
  "Prediction errors are typically transient signals that vanish once the model updates. However, moods like depression or anxiety can last for weeks. How does a theory based on residual error account for long-term affective states? Are these just chronically un-updated errors?"
  *   **Follow-up:** "If they are chronically un-updated errors, does this imply that emotional recovery is essentially a matter of forcing the brain to ignore valid prediction errors? That seems to pathologize the process of accurate interoceptive monitoring."

  **10. Agency and Regulation**
  "You suggest that feelings are what survive suppression. This implies that emotional regulation is a matter of refining predictions to suppress error. Does this view entail that a perfectly rational agent with perfect predictive models would feel no emotions at all?"
  *   **Follow-up:** "If the answer is yes, does this not confirm the Stoic critique that emotions are errors of reasoning? And if the answer is no, please clarify what kind of prediction error is constitutive of a flourishing human life."
