answer: |-
  **Project Title:** The Authority Deficit: Reframing Democratic Backsliding as Institutional Trust Decay

  **Research Question**
  Current scholarship treats democratic backsliding as either a procedural failure (broken elections, courts) or a substantive one (rights violations). Both assume institutions must be *functionally* impaired to count as backsliding. This project asks: Can we reconstruct backsliding as a phenomenon of *institutional trust decay*—where citizens cease to treat institutions as authoritative even when they function technically—and does this metric track across Hungary, Poland, Turkey, and the US without collapsing into partisan polarization?

  **Problem Statement**
  The procedural/substantive dichotomy has stalled. Proceduralists argue Hungary still holds elections; substantivists argue those elections are unfair. Both miss the phenomenological layer: legitimacy. If citizens view a functioning court as illegitimate simply because they dislike the verdict, democracy erodes regardless of the rule of law's technical status. The current framing leaves open whether backsliding is an objective institutional condition or a subjective crisis of faith. By focusing on trust decay independent of performance evaluation, we can isolate whether the "democratic crisis" is real or merely a reflection of partisan sorting.

  **Methodology**
  *   **Month 1: Conceptual Calibration & Data Selection.** I will define "trust decay" distinct from "performance dissatisfaction" using existing literature on political legitimacy. I will gather longitudinal datasets (World Values Survey, Eurobarometer, ANES) focusing on confidence in courts, legislatures, and electoral bodies from 2010–2023.
  *   **Month 2: Comparative Application.** I will apply this metric to the four cases. For Hungary and Poland, I will compare trust metrics against V-Dem indices during periods where elections occurred but norms shifted. For the US, I will examine trust decay during periods of unified vs. divided government. The key move is looking for divergence: instances where institutional function remained stable but trust plummeted.
  *   **Month 3: Synthesis & Validation.** I will correlate the trust-decay metric with standard backsliding indices. I will write the final paper arguing whether trust decay provides a unified field theory for backsliding or exposes the concept as incoherent.

  **Success and Failure Conditions**
  The project succeeds if the trust-decay metric identifies backsliding in the US (where proceduralists see stability) and Hungary (where substantivists see autocracy) using the same variable, thereby rescuing "backsliding" from being a partisan label applied only to opponents. It fails entirely if trust decay maps perfectly onto electoral loss (i.e., trust only drops when "my party" loses power), proving the phenomenon is just polarization rather than democratic erosion.

  **Feasibility and Position**
  Three months is insufficient for original survey data collection, but adequate for secondary analysis of existing high-quality datasets. I argue this trust-decay framing *does* rescue the concept. The closest competing framing is **Procedural Minimalism**, which argues that as long as elections are free, democracy holds. This is wrong because it ignores the citizenry's withdrawal of consent; a system cannot remain democratic if the losers refuse to recognize the winners' authority, regardless of the ballot count. By shifting focus from elite behavior to public authority, we capture the actual mechanism of collapse. This timeline is tight, but focusing on secondary data ensures completion.
