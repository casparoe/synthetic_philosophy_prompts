      *   **Task:** Create a 90-minute graduate seminar plan on Original vs. Derived Intentionality, focusing on Searle vs. Dennett.
      *   **Specific Constraints:**
          *   Brainstorm logical dependency chain first.
          *   Target Audience: 1st-year CogSci PhDs (know Chinese Room in passing, haven't read closely).
          *   Core Sequence: Original/Derived Distinction $\rightarrow$ Syntax/Semantics Gap $\rightarrow$ Two-Bitser Reply.
          *   Carrying Example: Distributed predictive system (neural net on unlabeled satellite telemetry outputting storm trajectories). *No* standard Chinese Room narrative as the primary vehicle.
          *   Misconceptions to Address: Dennett = Behaviorist, Derived = Fake, Derivation = No Consciousness.
          *   Check-for-Understanding (CFU): Apply distinction to the predictive system case.
          *   Exclusions: Searle's Biological Naturalism, Dennett's full taxonomy of stances (explain why).
          *   Niche Framing: "Third Category" (Distributed Derivation/Structural Inheritance).
          *   Output Format: Structured plan with rationale.

  2.  **Brainstorming the Logical Dependency Chain:**
      *   *Goal:* Understand why the sequence matters.
      *   *Step 1: Original vs. Derived Intentionality.* This is the foundational ontology. Without knowing *what* kind of "aboutness" we are looking for, we can't judge if a system has it. If we skip this, students conflate "acting as if" with "meaning."
      *   *Step 2: Syntax/Semantics Gap.* Once we know what intentionality is (Original), we can ask how formal systems relate to it. Searle argues syntax (form) is insufficient for semantics (meaning). This argument *requires* the definition of Original Intentionality to have force. If intentionality were just derived (functional role), the gap disappears.
      *   *Step 3: Two-Bitser Reply.* Dennett's counter-argument attacks the intuition pump behind the Gap. It argues that "Original" intentionality is just "Derived" intentionality that has been recursively grounded enough to look intrinsic. To evaluate this, one must already understand the Gap. If introduced before the Gap, it looks like a non-sequitur or mere behaviorism.
      *   *Dependency:* Distinction $\rightarrow$ Gap $\rightarrow$ Reply.
      *   *Damage if Reordered:*
          *   If Gap before Distinction: Students think the argument is about computation generally, not about *meaning*.
          *   If Reply before Gap: Dennett looks like he's ignoring the hard problem of meaning (behaviorism charge).
          *   If Distinction is weak: The whole debate collapses into verbal dispute.

  3.  **Developing the Carrying Example (Satellite-Telemetry Neural Net):**
      *   *Why this example?* It avoids the "homunculus" trap of the Chinese Room (where a person is inside). It removes the "biological substrate" bias (Searle's hidden premise). It removes "explicit symbolic rules" (classic GOFAI).
      *   *Key Features:*
          *   Unlabeled data (no explicit semantic assignment by humans).
          *   Distributed representation (no localist symbols).
          *   Output is coherent (storm trajectories) but source is opaque.
      *   *Pedagogical Weight:* It forces the question: Where did the "aboutness" of the storm come from? The weights? The training data? The user?
      *   *What it must lack:* No single interpreter (challenges Derived), no biology (challenges Original/Biological Naturalism), no explicit rules (challenges Syntax/Semantics as traditionally framed).

  4.  **Mapping Misconceptions & Interventions:**
      *   *Misconception 1: Dennett is a Behaviorist.*
          *   *When:* During the Two-Bitser section.
          *   *Fix:* Emphasize that Dennett isn't denying internal states, but redefining their ontological status (Intentional Stance as real pattern, not just prediction).
      *   *Misconception 2: Derived = Fake.*
          *   *When:* During the Original/Derived section.
          *   *Fix:* Show that human language use is largely derived (words on a page), yet effective. The issue is *source*, not *reality*.
      *   *Misconception 3: Derivation denies Consciousness.*
          *   *When:* Transition to Biological Naturalism exclusion.
          *   *Fix:* Clarify that intentionality $\neq$ qualia. One can have derived intentionality without being a zombie, but the *source* of meaning is external/functional.

  5.  **Handling the "Third Category" (Distributed Derivation):**
      *   *Concept:* Intentionality inherited from a training environment that lacks original intentionality (e.g., physical causal structures of the atmosphere).
      *   *Placement:* End of the session, after the main Searle/Dennett clash is resolved.
      *   *Risk:* If introduced too early, it muddies the binary distinction required to understand the debate.
      *   *Function:* It destabilizes Dennett slightly (is it really just *human* stance?) and Searle (is biology really the only source?).

  6.  **Determining Exclusions:**
      *   *Searle's Biological Naturalism:* Exclude because it shifts the debate from semantics to metaphysics of mind/brain. It stops the conceptual engineering work on intentionality.
      *   *Dennett's Full Taxonomy (Design/Physical/Intentional):* Exclude because we only need the Intentional Stance to make the Two-Bitser point. Full taxonomy distracts into functionalism generally.

