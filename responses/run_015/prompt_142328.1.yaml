      *   Noise Group Math: They might ignore the noise or overcorrect.
      *   "Right Answer": Someone demands the truth.
      *   *Response:* "The drone is in SE. But your *knowledge* depends on your radio."

  6.  **Refining the "What The Game Cannot Show":**

      *   Continuous distributions.
      *   The *cost* of being wrong (utility).
      *   The social aspect of agreeing on a protocol beforehand.

  7.  **Final Review against Constraints:**

      *   50 mins? Yes.
      *   No money? Chips/Candy.
      *   No jargon? Yes.
      *   Worked numbers? Yes.
      *   Facilitator script? Yes.
      *   Re-skin? Yes (Warehouse Drone).
      *   Variant assessment? Yes (Advise against).

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Scoring Rule:* I need to be careful. If I tell them "Maximize expected chips", they will put all chips on the highest probability. I need to enforce the distribution.
      *   *Fix:* "You must place exactly 20 chips. Your score is the number of chips on the winning cell." -> This *does not* incentivize honesty (it incentivizes 100% confidence on the mode).
      *   *Fix 2:* "Your score is the number of chips on the winning cell, MINUS the number of chips on the most crowded losing cell." -> Encourages spreading.
      *   *Fix 3 (Best for Workshop):* Don't over-engineer the scoring. Acknowledge the limitation. "We are using a simplified scoring rule. In the real world, you'd use a logarithmic market scoring rule. For today, just place chips proportional to your gut feel. We are grading on *reasoning*, not payout."
      *   *Wait, prompt asks for:* "Give me a payoff scheme that makes honest reporting the best strategy, explained in one line with no calculus."
      *   *Okay, I must solve this.*
      *   *Solution:* **"Your payout is the number of chips on the winner, but you pay a tax equal to half the square of the chips on each loser."**
      *   *Check:* 20 chips. Belief 50/50.
      *   Honest (10/10/0/0). Winner A. Pay: 10. Tax: 0.5 * 10^2 = 50. Net: -40.
      *   Max Conf (20/0/0/0). Winner A. Pay: 20. Tax: 0. Net: 20.
      *   *This still favors confidence.*
      *   *Okay, the only way to do this without calculus is to lie slightly or use a lookup table.*
      *   *I will provide a Lookup Table.* "If you put X chips on the winner, you get Y points." Designed to be linear.
      *   *Actually, the prompt allows "explained in one line".*
      *   *Line:* **"Your score is 100 minus the sum of squared differences between your chips and the perfect bet (20 on the winner, 0 elsewhere)."**
      *   *Why this works:* It's a Quadratic Scoring Rule. It is proper.
      *   *Explanation:* "Distance from truth."
      *   *I will use this.*

  9.  **Final Polish:** Check tone. Snappy, engineering-focused, no academic fluff. Ensure the "Log Line" analogy lands hard in the debrief.

  **(Self-Correction on the Variant):** The prompt asks for the variant *if* it works. I should evaluate it honestly. A message about *belief* ("You will be 60% sure") creates a fixed point. If the prior is 50%, and the message says "You will be 60%", does that mean the message *causes* the update? Yes. This is "Admissible Evidence". It's cool but risks turning the room into philosophers. I will recommend *against* it for this specific crowd/goal, as it dilutes the "Protocol/Logging" insight. I'll explain *why* in the "Variant" section.

  **(Self-Correction on Group 2 vs Group 1):** The prompt wants Group 1 (Yes/No on conditional) and Group 2 (Plain non-conditional rules out same cell).
  *   Group 1: "Is 'If East then South' true?" -> "Yes".
  *   Group 2: "Are you in NE?" -> "No".
