  # Session Design: The Silent Drone Protocol

  **Title:** Hard Problems, Cold Pizza: The Silent Drone
  **Time:** 50 Minutes
  **Props:** 4x4 Grid on whiteboard (labeled NW, NE, SW, SE), ~300 poker chips (or candy wrappers), printed Protocol Cards (one set per group), trophy (ugly mug or 3D print).

  ## The Setup (Re-skin)
  Forget Judy Benjamin. You are Operations. A drone is lost in a 2x2 warehouse grid (NW, NE, SW, SE). Prior probability is uniform (25% each). You receive a single text message from the drone. Your job: Distribute 20 search-team chips across the grid to maximize recovery score.

  ## The Scoring Rule (One Line)
  **"Your score is 100 points minus the sum of the squared differences between your chip placement and the truth (20 chips on the actual location, 0 elsewhere)."**

  *Why this works:* It is a Quadratic Scoring Rule. It mathematically forces honest probability reporting without requiring them to know calculus. If they believe a cell is 50% likely, they maximize their *expected* score by placing 10 chips there. If they hedge or guess wildly, their expected score drops.
  *Facilitator Cheat Sheet:* If a group puts 10 chips on the winner, their penalty is $(20-10)^2 + (0-10)^2 + 0 + 0 = 200$. Score = -100. If they put 20 on the winner, penalty is 0. Score = 100. If they put 5 on each, penalty is $15^2 + 5^2 + 5^2 + 5^2 = 275$. Score = -175.

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:05: Intro & Priors
  *   **Say:** "Drone is lost in the grid. Equal chance it's in any of the four quadrants. You have 20 chips. Place them now."
  *   **Action:** Everyone places 5 chips on each cell.
  *   **Say:** "Good. That's your prior. Now, you get a message. But different teams have different radio firmware."

  ### 0:05 – 0:10: Group Split & Protocol Handout
  *   **Action:** Split into 4 groups (3-4 people each). Hand each group a sealed **Protocol Card**.
  *   **Say:** "The drone is in **SE**. All of you receive the *same message text*. But your card tells you how the drone's software *decided* to send that text. Update your chips based *only* on your card and the message. Do not talk to other groups yet."
  *   **The Message (Written on Board):** `STATUS: IF EAST THEN SOUTH`
  *   **The Protocol Cards:**
      *   **Group 1 (The Negation):** "System checks: 'Am I in NE?' If YES, send 'ERROR'. If NO, send 'STATUS: IF EAST THEN SOUTH'."
      *   **Group 2 (The Logic Check):** "System checks: 'Is the statement (If East Then South) true?' If YES, send 'STATUS: IF EAST THEN SOUTH'. If NO, send 'FALSE'."
      *   **Group 3 (The Selector):** "System checks location. If SE, send 'STATUS: IF EAST THEN SOUTH'. If NW or SW, send 'STATUS: WEST'. If NE, send 'ERROR'."
      *   **Group 4 (The Noise):** "System tries to send location. 50% chance message is corrupted to 'STATUS: IF EAST THEN SOUTH' regardless of location. 50% chance it sends true location."

  ### 0:10 – 0:35: The Work (Facilitator Silence)
  *   **Action:** Walk around. Listen. Do not correct math.
  *   **Shut Up About:** Bayes' theorem, conditional probability, "Judy Benjamin", "material implication".
  *   **Intervene Only If:** A group asks "What does the message mean?"
      *   **Say:** "The message text is identical for everyone. The *codebook* is different. Trust the codebook."
  *   **Watch For:** Group 1 and 2 realizing they have the same math. Group 4 arguing about the noise floor.

  ### 0:35 – 0:45: The Reveal & Bet
  *   **Action:** Have each group write their final chip distribution on the whiteboard.
  *   **Expected Results:**
      *   **Group 1 (Negation):** NW: 7, SW: 7, SE: 6 (Roughly 1/3 each). *Logic: NE is ruled out.*
      *   **Group 2 (Logic):** NW: 7, SW: 7, SE: 6 (Roughly 1/3 each). *Logic: NE makes statement false.*
      *   **Group 3 (Selector):** SE: 20, Others: 0. *Logic: Only SE triggers this specific message.*
      *   **Group 4 (Noise):** NW: 5, NE: 5, SW: 5, SE: 5. *Logic: Message is equally likely to be noise from anywhere.*
  *   **Action:** Reveal the drone was in **SE**.
  *   **Scoring:** Calculate scores live. Group 3 wins big. Group 4 scores lowest (despite being "safest"). Group 1 & 2 tie middle.
  *   **Say:** "Group 3 got the same message as Group 1. Why did they bet everything on SE?"

  ### 0:45 – 0:50: The Debrief (The Log Line)
  *   **Map the Moments:**
      1.  **Group 1 vs 2:** "You noticed you had the same numbers. That's because logically, 'Not NE' and 'If E then S' rule out the same cell. If your radio just checks truth, they are identical."
      2.  **Group 3:** "They heard the same words but knew the *code*. The drone *only* speaks in conditionals when it's in SE. The message wasn't data; it was a tag."
      3.  **Group 4:** "The message looked informative but was actually noise. Because the error rate was uniform, the message carried zero information."
  *   **The Landing:** "Think about our incident reviews. We stare at a log line: `ConnectionTimeout`. We treat it as a fact: 'The connection timed out.' But we never ask: 'What code path produced this log? Would it have logged this if the DB was dead? Would it have logged this if the network was dead?' A log line is not a fact. It is the output of a specific protocol. If you don't know the protocol, the log line is just noise."

  ## Worked Numbers (Facilitator Sanity Check)
  *   **Prior:** 0.25 each.
  *   **Group 1 & 2:** $P(NE) = 0$. Remaining mass (0.75) spread over NW, SW, SE. $0.25 / 0.75 = 1/3$. **Target: 6.6 chips each.**
  *   **Group 3:** $P(Msg|SE) = 1$. $P(Msg|Others) = 0$. Posterior $P(SE) = 1$. **Target: 20 chips on SE.**
  *   **Group 4:** $P(Msg|Any) = 0.5$ (Noise) + $0.5$ (Truth if SE) -> Wait, simplify for the room:
      *   *Correction for Group 4 Card:* "50% chance message is corrupted to 'IF EAST THEN SOUTH'. 50% chance it sends true location."
      *   If Drone in NE: Sends "NE" (50%) or "IF EAST..." (50%).
      *   If Drone in SE: Sends "SE" (50%) or "IF EAST..." (50%).
      *   Likelihood of "IF EAST..." is 0.5 for *all* cells.
      *   Posterior = Prior. **Target: 5 chips each.**

  ## What Will Definitely Go Wrong
  1.  **The Logic Puzzle Trap:** Someone will say, "But 'If East then South' is logically equivalent to 'Not NE', so Group 3 is wrong."
      *   **Fix:** "In a vacuum, yes. In a system with a sender, no. Group 3 knows the sender *would not* have said 'West' if they were in SE. Group 1 doesn't know that."
  2.  **The Spread Bet:** A group puts 5 chips on each "to be safe" regardless of protocol.
      *   **Fix:** Remind them of the scoring rule. "Hedging costs you points if you actually know something. Group 3 *knew* it was SE. If they hedged, they lost points."
  3.  **The Noise Math:** Group 4 gets stuck on whether the noise is symmetric.
      *   **Fix:** If they stall, tell them: "Assume the glitch happens randomly everywhere."
  4.  **The "Right Answer" Demand:** "Which group was actually right?"
      *   **Say:** "The drone *was* in SE. Group 3 was most *confident*. But if the protocol *had* been Group 1's, Group 3 would have been overconfident and lost points. There is no right answer without the protocol."

  ## What The Game Cannot Show
  This exercise isolates *epistemic* uncertainty (what do I know?). It cannot show *strategic* uncertainty (what does the sender *want* me to know?). In real systems, services aren't neutral radios; they are written by engineers with goals. A log line might be suppressed to save cost, or amplified to alert on-call. The game assumes the protocol is fixed and known. In reality, half the work is reverse-engineering the protocol from the logs themselves.

  ## The 5-Minute Closing Variant (Assessment)
  **The Idea:** The message is: "After you update your beliefs, you will be more than 60% sure you are in the West."
  **Verdict:** **Do not run this.**
  **Why:** It turns the session into a recursive logic puzzle ("If I believe I'm in West, does that make the message true?"). It shifts focus from *Protocol Dependence* (the core engineering lesson) to *Self-Reference* (a philosophical rabbit hole). It requires them to simulate their own brain updating, which creates meta-confusion.
  **Alternative:** If you have 5 minutes left, ask: "What if the drone *chooses* which message to send to make us search the wrong place?" This introduces adversarial protocols (security) which is more relevant to backend folks than reflexive belief.

  ## Facilitator Script: The "One Line" Explanation
  When explaining the scoring rule, do not derive it. Just say:
  **"This scoring system penalizes you for the distance between your bet and the truth; the only way to minimize your average penalty is to place chips exactly proportional to your belief."**

  ## Final Note on Jargon
  Do not use the words *Bayes, Posterior, Prior, Likelihood, Conditional, Implication*.
  Use: *Starting odds, Updated odds, Chance of message, Rules out, If-Then*.
  Save the jargon for the very last sentence if you must, but better to let them leave thinking about "Protocols" than "Conditionals."
