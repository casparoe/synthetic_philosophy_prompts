      *   How? "Fixed" means "uniquely determined."
      *   If EV isn't uniquely determined, how can it give a *specific* reason?
      *   Answer: Because the agent *makes* it determined by adopting a prior.
      *   So the "Information" in (4) must be expanded to include the prior.
      *   If "Information" includes the prior, then (3) "EV not fixed by info" becomes false (because the prior fixes it).
      *   But the User wants to keep (3).
      *   So the User must mean "Information = External Data."
      *   So I must reject (4) under the interpretation "Information = External Data."
      *   Claim: "External data doesn't need to fix EV for EV to provide a reason."
      *   Reason: "Because the agent contributes the rest."
      *   This is the Subjective Bayesian stance.
