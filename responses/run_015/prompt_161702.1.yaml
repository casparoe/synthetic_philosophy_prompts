answer: |-
  Two motorists take a blind corner equally fast. Both miss a child by a metre. The first passes no witnesses. The second is filmed by a doorbell camera, and the near-miss replays on the evening news. The first is deemed a careful driver. The second is condemned as a menace. It appears that in modern morality, your culpability is determined not by the damage you cause, but by how vividly the public can visualise the damage you didn't.

  The punchline exploits the epistemic availability of the avoided outcome, rather than the outcome itself. The joke will fall flat if students interpret it as a comment on media intrusion alone, or if they mistake it for resultant luck, assuming one driver actually struck the child.
