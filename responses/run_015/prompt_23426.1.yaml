answer: |-
  Here are ten questions designed to press the Difference Principle defense of the Pasadena Paradox, tailored for an audience familiar with the technical literature. They include the three mandatory topics and seven additional pressure points, each with a likely evasion and a targeted follow-up.

  ### 1. The Natural-Order Sum
  **Question:** In the physical implementation of the Pasadena game, the coin-flip process inherently indexes outcomes by the trial number $n$. This picks out a specific ordering of the payoff series: $1 - 1/2 + 1/3 - 1/4 \dots$, which converges to $\ln 2$. The Riemann rearrangement theorem warns us about *arbitrary* reordering, but the physical chance mechanism fixes the order naturally. Why isn't $\ln 2$ the expected value, and does the rearrangement objection actually do any work once the causal process is fixed?

  **Likely Answer:** "Expectation is defined over the probability space, not the temporal sequence of discovery. Relying on the natural order makes expectation dependent on how the gamble is described or implemented rather than the underlying distribution. We want a theory invariant to representation."
  **Follow-up:** "But the probability measure *is* defined on the natural numbers $\mathbb{N}$. To apply a rearrangement, you have to map the outcomes to different indices, which effectively redefines the random variable. If the causal structure of the world provides a canonical indexing, isn't insisting on permutation invariance imposing an external mathematical constraint that ignores the physical facts of the gamble?"

  ### 2. Altadena vs. The Status Quo
  **Question:** Let's look at the Altadena game (Pasadena payoffs + $1). Your framework handles Altadena vs. Pasadena easily: the difference is exactly 1. But what about Pasadena vs. *not playing* (the zero baseline)? If the difference between Pasadena and 0 is undefined, your theory says they are incomparable. Does this mean a rational agent cannot decide whether to play the Pasadena game for free?

  **Likely Answer:** "Correct. If the relative expectation is undefined, the theory remains silent. You need a third anchor gamble to compare them against."
  **Follow-up:** "So if I offer you Pasadena for free, you have no recommendation. But if I offer Altadena for $0.50, you accept (since $E[A-P]=1$). Since Altadena is just Pasadena + $1, accepting Altadena for $0.50 implies you value Pasadena at $-0.50$. But earlier you said you couldn't value Pasadena against zero. Aren't you deriving a value for Pasadena against zero through the back door, contradicting your claim that it's undefined?"

  ### 3. The Decomposition Problem
  **Question:** Consider the decomposition: $\text{Altadena} - \text{Pasadena} = (\text{Altadena} - \text{St. Petersburg}) + (\text{St. Petersburg} - \text{Pasadena})$. The left side has an expectation of exactly 1. But if you use the St. Petersburg game as an intermediate, both terms on the right diverge ($-\infty$ and $+\infty$). Why is the direct computation authoritative when the decomposed computation breaks arithmetic linearity?

  **Likely Answer:** "Linearity of expectation only holds when the individual expectations are well-defined. You cannot decompose undefined terms. The direct difference is well-defined, so that's the only valid calculation."
  **Follow-up:** "This implies valuation is non-compositional. If I offer you the bundle $(\text{Altadena} - \text{Pasadena})$ as a single contract, you price it at $1. If I offer the two components on the right as separate contracts, you refuse to price them. Isn't this a framing effect? I can hide a valued asset inside a 'undefined' decomposition to avoid pricing it, or bundle undefined assets to create value. How do you prevent arbitrageurs from exploiting this non-linearity?"

  ### 4. Transitivity and Chains
  **Question:** If preference is defined by $E[X - Y] > 0$, transitivity requires that if $E[X-Y]$ and $E[Y-Z]$ are defined, $E[X-Z]$ must be defined and equal to their sum. Can you guarantee this for any chain of Pasadena-like gambles, or does your theory allow for intransitive preference cycles where $X \succ Y$, $Y \succ Z$, but $X$ and $Z$ are incomparable?

  **Likely Answer:** "We assume the differences are well-behaved enough to preserve transitivity in practical cases."
  **Follow-up:** " 'Well-behaved enough' is doing a lot of heavy lifting. If I construct a chain of ten gambles where each adjacent difference converges, but the endpoints diverge, your agent prefers $A \to B \to \dots \to J$, but cannot compare $A$ to $J$. If I then offer a swap from $J$ back to $A$ for a small fee, and that specific difference *does* converge, haven't you just authorized a money pump? How do you bound the length of comparison chains?"

  ### 5. Weak Dominance Failures
  **Question:** Your theory captures the intuition that Altadena beats Pasadena because the difference is positive. But are there cases where Gamble A strictly dominates Gamble B in every state of the world, yet $E[A - B]$ is undefined? If so, your theory fails to prescribe the dominant choice.

  **Likely Answer:** "In those cases, the theory remains silent. It's a limitation, but better than prescribing the wrong answer."
  **Follow-up:** "Silence in the face of strict dominance is a fatal flaw for a *normative* theory. If I show you two payoff tables where A > B in every row, and you say 'I have no recommendation,' you are violating a basic axiom of rationality. Why should we accept a decision theory that is weaker than the dominance principle?"

  ### 6. The Zero-Point Privilege
  **Question:** The Difference Principle seems to require a privileged 'zero point' or status quo to function as an anchor, since utility is usually only unique up to positive affine transformation. Does your view commit us to the idea that utility is ratio-scale with a natural zero, rather than interval-scale?

  **Likely Answer:** "We fix the zero point at the agent's current endowment or status quo."
  **Follow-up:** "But the status quo might itself be a gamble with undefined expectation. If my current endowment is a Pasadena-like risk, and I'm offered a new Pasadena-like risk, the difference between two undefined quantities is unstable. Does your theory require that rational agents must always occupy a 'safe' status quo with finite expectation to even begin making decisions?"

  ### 7. Finitism vs. Countable Additivity
  **Question:** Much of this pathology relies on countable additivity. If we adopt a finitely additive probability measure (à la de Finetti), the Pasadena expectation can often be made well-defined. Why stick to countable additivity just to save the Difference Principle, rather than dropping countable additivity to save standard Expected Utility?

  **Likely Answer:** "Countable additivity is standard in modern measure theory and decision theory. Dropping it creates other paradoxes, like the inability to handle infinite lotteries consistently."
  **Follow-up:** "But you're already abandoning standard EU for these infinite lotteries. If the cost of keeping countable additivity is that you have to replace EU with a Difference Principle that violates linearity and transitivity, isn't the parsimonious choice to drop countable additivity? Why is preserving the measure theory more important than preserving the decision theory?"

  ### 8. The "Patching" Critique
  **Question:** This looks like ad-hoc patching. Standard EU breaks, so you restrict comparisons to differences. Then linearity breaks, so you restrict decomposition. What is the positive justification for the Difference Principle other than it solves Pasadena? Is there an independent axiom set that derives it?

  **Likely Answer:** "It's the minimal revision to save the core intuition of expectation without accepting undefined values as prescriptive."
  **Follow-up:** "Is it minimal? You're giving up linearity, transitivity in the general case, and the ability to compare to the status quo. Isn't it more parsimonious to say 'Pasadena gambles are unpricable' or 'EU is wrong for infinite cases' rather than 'EU is right but only for differences'? What positive work does the Difference Principle do outside of solving this specific paradox?"

  ### 9. Bounded Agents and Computation
  **Question:** To check if $E[X - Y]$ is defined, an agent must compute the limit of the partial sums of the difference. But if $X$ and $Y$ are complex gambles, determining whether their difference converges might be undecidable or computationally intractable. How does a bounded agent verify the precondition for using your theory?

  **Likely Answer:** "We are discussing ideal rationality, not computational complexity."
  **Follow-up:** "Even for an ideal agent, if the convergence is conditional, the value depends on the ordering. If the agent evaluates the gambles separately in their head before comparing, they get stuck. You're requiring a 'holistic' evaluation where the agent never represents the values of X or Y, only the difference. How does an agent plan their life if they can't assign values to individual prospects, only to pairwise swaps?"

  ### 10. The Arbitrage Objection
  **Question:** In financial markets, if two assets have a well-defined price difference but undefined individual prices, arbitrageurs would typically force the individual prices to align. If your theory says Pasadena has no value but Altadena - Pasadena = 1, how does the market clear? Does your theory imply that Pasadena-like assets cannot exist in an efficient market?

  **Likely Answer:** "Pasadena-like assets don't exist in the real world due to finite bankrolls."
  **Follow-up:** "Rationality is about ideal agents, and we use these paradoxes to test the limits of the theory. But if we approximate Pasadena with a truncated version (N flips), the expectation is defined. As $N \to \infty$, your theory says the value vanishes into undefinedness, but the difference remains 1. This creates a discontinuity. Why should rational preference flip from defined to undefined just because we remove the cap on the bankroll, when the difference remains stable?"
