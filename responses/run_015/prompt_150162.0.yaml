answer: |-
  There is no single, canonical noun (like "gravity" or "entropy") that exclusively names this specific configuration in the philosophy of science. However, the phenomenon you describe is a well-recognized composite of several technical concepts. It is most precisely identified as a **Degenerating Problemshift** (Imre Lakatos) that relies on a **Conventionalist Stratagem** (Karl Popper) to assert **Definitional Equivalence** (contemporary formal philosophy of science) in the face of **Empirical Equivalence**.

  In contemporary debates, this is often discussed under the header of **Theoretical Equivalence**, specifically the dispute over whether empirical equivalence entails theoretical equivalence.

  Here is a detailed breakdown of the phenomenon, its boundaries, and its implications for the taxonomy of scientific change.

  ### 1. The Technical Taxonomy of the Phenomenon

  To map this neatly, we must distinguish between the *state* of the theories, the *tactic* of the defenders, and the *evaluation* of the move.

  *   **The State: Engineered Empirical Equivalence.**
      Unlike standard underdetermination, where two theories naturally predict the same data, this is a state where the older theory has been actively modified (via auxiliary hypotheses) to *match* the newer theory's predictions. The equivalence is not a starting point but a manufactured result.
  *   **The Tactic: The Conventionalist Stratagem.**
      Karl Popper coined this term to describe the move of redefining terms or adding untestable assumptions to save a theory from refutation. When the caloric theorist says kinetic results are just "notational variants" of caloric distributions, they are treating the ontology as a matter of convention rather than fact. They are claiming the dispute is **merely verbal**.
  *   **The Claim: Definitional (or Intertranslatability) Equivalence.**
      In modern formal philosophy of science (e.g., work by Hans Halvorson, Thomas Barrett, James Weatherall), a distinction is drawn between *empirical equivalence* (same predictions) and *theoretical equivalence* (same content). The old guard is claiming **Definitional Equivalence**: they argue every term in the new theory can be defined within the old theory without loss.
  *   **The Evaluation: A Degenerating Problemshift.**
      Imre Lakatos provides the most robust framework for evaluating this. He argues that a research programme is **progressing** if it predicts novel facts, and **degenerating** if it only explains past facts by adding *ad hoc* auxiliary hypotheses. The configuration you describe is the hallmark of a **Degenerating Problemshift**: the old framework is becoming more complex and less unified to absorb the successes of the rival, without generating new heuristics of its own.

  ### 2. Distinctions from Related Concepts

  You asked how this differs from ordinary underdetermination and successful reduction. The edges are drawn by **directionality**, **motivation**, and **explanatory power**.

  **Vs. Empirical Underdetermination (Duhem-Quine)**
  *   **Underdetermination** is typically passive: the available data is insufficient to decide between two *independent* hypotheses.
  *   **Your Phenomenon** is active: The old theory is being *stretched* specifically to mimic the new one. The asymmetry matters. In underdetermination, Theory A and Theory B stand on equal footing regarding data. In your scenario, Theory Old is parasitic on Theory New; it only achieves equivalence by copying New's structure via auxiliaries.
  *   **Key Difference:** Underdetermination implies a lack of evidence; this phenomenon implies a surplus of *ad hoc* adjustments.

  **Vs. Theoretical Reduction (Nagel)**
  *   **Reduction** usually involves the *new* theory deriving the *old* theory as a limit case (e.g., relativity reducing to Newtonian mechanics at low speeds). It acknowledges the old theory was "approximately true" within a domain.
  *   **Your Phenomenon** is **Assimilation**: The *old* theory attempts to absorb the *new* theory. It denies the new ontology entirely, claiming the new terms are just shorthand for old terms.
  *   **Key Difference:** Reduction is a success story of continuity (New explains why Old worked). Assimilation is a defensive story of continuity (Old claims New adds nothing).

  ### 3. Is this a Failure Mode for Kuhn's Incommensurability?

  This is the most philosophically significant aspect of your query. You note that both sides understand each other, which seems to contradict Kuhn's claim that competing paradigms are **incommensurable** (lacking a common measure/language).

  However, philosophers of science generally regard this not as a refutation of Kuhn, but as a clarification of what incommensurability *is*.

  *   **Local vs. Global Incommensurability:** Kuhn later clarified that incommensurability is not total mutual unintelligibility (which would make debate impossible). It is **local**. The two sides can translate terms (as you described), but they disagree on the **standards of explanation** and **ontological commitment**.
  *   **The Axiological Shift:** The phenomenon you describe shows that the conflict has shifted from *logic* (can we translate?) to *values* (is this translation *explanatorily virtuous*?).
      *   The **Old Guard** values **Ontological Conservation** (keep caloric) and **Formal Continuity** (keep the equations).
      *   The **New Guard** values **Explanatory Unification** (link heat to work) and **Non-Ad Hocness** (no contrived auxiliaries).
  *   **Conclusion on Kuhn:** This configuration is a **boundary case** that demonstrates incommensurability is not about the *possibility* of translation, but about the *cost* of translation. Kuhn would argue that while the Old Guard *can* translate the New terms, doing so renders the Old theory so unwieldy and conceptually fragmented that it ceases to function as a viable paradigm. The "failure" is not in communication, but in the **loss of explanatory coherence**.

  ### 4. Contemporary Terminology

  If you are looking for the most current label to use in a paper or argument, the following terms are currently in circulation within the *British Journal for the Philosophy of Science* and similar venues:

  1.  **"The Equivalence Thesis" (Defensive):** Used when one side argues that empirical equivalence implies theoretical equivalence to deny ontological commitment.
  2.  **"Ad Hoc Rescue of Empirical Equivalence":** Describes the specific maneuver of adding auxiliaries to maintain equivalence.
  3.  **"Structural Continuity vs. Ontological Discontinuity":** This frames the debate as one where the Old Guard argues for structural preservation (the math works) to deny ontological change (the stuff is different). This aligns with **Structural Realism** (John Worrall), though in your case, the Old Guard is using it conservatively rather than realistically.

  ### Summary

  The phenomenon is best described as a **Degenerating Problemshift** characterized by the **Ad Hoc Maintenance of Empirical Equivalence**.

  The specific argumentative move—claiming the new theory is just a notational variant—is a **Conventionalist Stratagem** asserting **Definitional Equivalence**.

  It distinguishes itself from underdetermination by being an active, asymmetric engineering of equivalence rather than a passive lack of data. It distinguishes itself from reduction by being an assimilation of the new into the old, rather than a derivation of the old from the new.

  Regarding Kuhn, it does not falsify incommensurability but refines it: it shows that **translatability does not entail conceptual neutrality**. The "cost" of the translation (in terms of complexity and loss of unification) is where the scientific revolution actually occurs. The Old Guard wins the logical argument (translation is possible) but loses the axiological argument (the translation is scientifically worthless).
