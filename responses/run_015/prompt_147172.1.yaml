answer: |-
  Your distinction between **statistical typicality** (everyone did it) and **modal necessity** (no one *could* have done otherwise) is not muddled. It is the exact fault line where this argument breaks. Your friend is relying on the slogan to slide between these two meanings without noticing they are incompatible.

  If the claim is merely statistical, it commits the *argumentum ad populum* fallacy (slavery was common, therefore it was acceptable). If the claim is modal (he literally could not have acted otherwise), it is historically false for figures like Jefferson, who had clear contemporary counter-examples (e.g., Benjamin Franklin's later abolitionism, or the Somerset Case in Britain).

  Here is the menu of readings for "He was a man of his time," ranked from trivial to substantive, with an assessment of whether they actually support your friend's conclusion ("don't blame him, keep the name").

  ### 1. The Sociological Claim (Descriptive Typicality)
  *   **The Claim:** "His views were the statistical norm for his class and location."
  *   **Plausibility:** **High.** For Jefferson and slavery, or Churchill and imperialism, these views were indeed mainstream among their peers.
  *   **Does it support the conclusion?** **No.** Being typical does not make an action morally neutral. Most people in 1850 Mississippi thought slavery was right; that explains their behavior but does not exonerate it, nor does it make a slaveholder a suitable namesake for a school today.
  *   **Defensive Status:** **Opening Move.** This is what your friend says first. It is the easiest to attack (by pointing out dissenters existed), and when attacked, defenders usually abandon it.

  ### 2. The Epistemic Claim (Culpable Ignorance)
  *   **The Claim:** "He lacked access to the moral information we have now; he couldn't *know* better."
  *   **Plausibility:** **Low (for Jefferson/Churchill).** For Columbus, maybe. For Jefferson? He wrote "all men are created equal" while owning humans. He corresponded with abolitionists. He knew the contradiction. To claim he "couldn't know" requires ignoring his own writings.
  *   **Does it support the conclusion?** **Weakly.** If he truly couldn't know, blame is mitigated. *However*, this does not justify **commemoration**. We do not name schools after people because they were "as good as they could be given their ignorance"; we name them because they exemplify virtues we want to emulate. Ignorance is not a virtue.
  *   **Defensive Status:** **First Retreat.** When you point out contemporaries who acted better, the defender shifts from "everyone thought this" to "he couldn't have been expected to know."

  ### 3. The Structural Claim (Material Constraint)
  *   **The Claim:** "He might have known better, but acting on it would have required sacrificing his life's work or causing greater harm." (e.g., Jefferson freeing slaves would have ruined his estate and political power, preventing the Declaration/Constitution).
  *   **Plausibility:** **Medium.** This is the "Necessary Evil" argument. It acknowledges moral failure but argues the cost of rectification was prohibitively high *for him*.
  *   **Does it support the conclusion?** **No.** This creates a "tragic hero" narrative, which might excuse *blame* (somewhat), but it actively undermines **commemoration**. If the argument is "he had to do evil to achieve good," you are admitting he did evil. Do we name schools after people who traded human freedom for political capital? That makes him a utilitarian calculator, not a moral exemplar.
  *   **Defensive Status:** **Second Retreat.** This is the most substantive charitable reading. Defenders use this when you corner them on the existence of abolitionists. It's the "he was trapped by the system" defense.

  ### 4. The Teleological Claim (Historical Necessity)
  *   **The Claim:** "Progress happens in stages; we need the flawed founders to get to our enlightened present. Criticizing them undermines the foundation we stand on."
  *   **Plausibility:** **Debatable.** This is a philosophy of history, not a moral claim. It suggests that moral purity is less important than historical efficacy.
  *   **Does it support the conclusion?** **Yes, but at a cost.** This is the only reading that gets you to "keep the name." It argues that the name serves a functional purpose (unity, continuity) that outweighs the moral stain. But note: this is no longer about *blame*. It's an admission that we are honoring a flawed instrument because we like the results. It requires admitting the flaw is real.
  *   **Defensive Status:** **Rarely Stated.** Defenders rarely admit they are prioritizing political utility over moral truth. They prefer to pretend the moral truth is on their side.

  ### 5. The Meta-Ethical Claim (Anachronism)
  *   **The Claim:** "Moral judgment requires contemporary standards. Applying 2024 morality to 1776 is a category error."
  *   **Plausibility:** **False.** Moral realism (the idea that slavery was *always* wrong, even when legal) contradicts this. If morality is just "what your time says," then the Nazis were right in 1940. Most defenders don't actually believe moral relativism; they just use it as a shield.
  *   **Does it support the conclusion?** **No.** It shuts down the conversation, but it doesn't justify the name. It just says "judgment is invalid."
  *   **Defensive Status:** **The Nuclear Option.** When all else fails, the defender claims you are being "unfair" by judging the past. This is the conversation-ender you are experiencing.

  ***

  ### The Verdict on the Slogan

  You asked me to be honest about whether the slogan is doing real work. **It is not.**

  The phrase "man of his time" is a **motte-and-bailey fallacy**.
  *   **The Motte (Defensible):** "We should understand the historical context before judging." (Reading 1 & 2).
  *   **The Bailey (Desired):** "Therefore, he is not blameworthy and deserves public honor." (The Conclusion).

  The slogan allows your friend to occupy the defensible position (context matters) while securing the unjustified conclusion (keep the name).

  **Your "Typical vs. Available" distinction is the key to breaking this.**
  When your friend says it, ask: *"Do you mean everyone did it, or that he couldn't have done otherwise?"*
  *   If **everyone did it**: Point out that "common practice" is not a moral defense. (Slavery was common; it was still wrong).
  *   If **he couldn't have done otherwise**: Point out that Jefferson *could* have freed his slaves (he freed some in his will, he discussed manumission constantly). He chose not to. That is a choice, not a constraint.

  **The "Keep the Name" Gap:**
  Even if you grant the strongest version of the defense (Reading 3: He was constrained), it does not logically lead to "Keep the Name."
  *   **Blame** looks backward (Was he responsible?).
  *   **Commemoration** looks forward (What values do we want to signal?).
  You can excuse a man from blame because he was trapped by his era, and still decide he is not the right person to put on a school building. We don't name schools after "men of their time"; we name them after "men for all time." If his values don't translate, the name doesn't fit.

  **Confidence Level:** High. The "man of his time" defense is historically lazy and philosophically incoherent when used to block moral judgment. It conflates *explanation* with *exoneration*. Your friend is using it to avoid the discomfort of admitting that heroes can be villains in specific lights, and that we are allowed to change our mind about who we honor.
