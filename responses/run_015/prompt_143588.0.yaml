answer: |-
  # Activity: The Explanatory Eviction Game
  **Time:** 90 mins  
  **Players:** 10 grad students (split into 3 groups: two groups of 3, one group of 4)  
  **Goal:** Feel the pragmatic cost of greedy reductionism via "explanatory eviction."

  ### Materials Needed
  *   **Index Cards:** 4 colors (or just mark them). You need 4 sets of "Level Cards."
  *   **Scenario Sheets:** One per group (see below).
  *   **Large Paper/Whiteboard:** For each group to map their stack.
  *   **Markers.**
  *   **Timer:** Your phone is fine.

  ### The Setup (10 mins)
  Split the room into 3 groups. Tell them this isn't about truth yet; it's about *work*. Explain the framing briefly:

  > "We're looking at **Explanatory Eviction**. This happens when a lower-level story doesn't just support a higher-level one, it kicks it out. It claims the higher level is redundant. But when you evict the higher level, you often leave behind **explanatory residue**—stuff the lower level can't actually do, like guide action or set norms."

  Hand out the **Scenario Card** to everyone:
  > **The Trust Circle:** A ritual where Partner A is blindfolded. Partner B must guide A across an uneven floor using only voice commands. Success means A doesn't stumble. Failure means A falls or refuses to walk.

  Hand out the **Level Cards** (write these on index cards beforehand, or have groups write them based on these prompts if you're lazy):
  1.  **Neurochemical:** Oxytocin release, cortisol regulation, motor cortex activation, vestibular system balance.
  2.  **Evolutionary:** Kin selection, reciprocal altruism heuristics, group cohesion pressures.
  3.  **Game-Theoretic:** Iterated prisoner's dilemma, costly signaling, Nash equilibria in coordination games.
  4.  **Social-Normative:** "Don't let them fall," "Speak clearly," "Trust me," "Step up now."

  **Assignment:**
  *   **Group 1 & 2 (The Crane Builders):** Build a bottom-up stack. The lower levels support the higher ones, but the higher ones are real and necessary.
  *   **Group 3 (The Greedy Reducers):** You must perform an **Explanatory Eviction**. Pick the lowest level (Neurochemical) and argue the other three are redundant illusions. You must list the **Residue**—what useful work those evicted cards were doing that your neuro-story can't pick up.

  *(Note: If you have 3 groups, make two Crane groups and one Greedy group. The Greedy group needs to struggle.)*

  ### Round 1: Building the Stack (25 mins)
  Groups arrange their cards.
  *   **Cranes:** Draw arrows showing how neuro enables Evo, which enables Game Theory, which enables Social Norms. All levels stay in play.
  *   **Greedy:** Put the Neuro card on top of everything else, literally covering them up. On a separate sheet, write the **Residue List**. What did you lose by evicting the Social/Normative layer? (e.g., "We lost the ability to say 'ought'.")

  **Facilitator Check-in:** Walk around. Make sure the Greedy group is actually committing to the reduction. If they say "Well, neuro causes norms," stop them. They need to say "Norms are just noise; only neurons are real."

  ### Round 2: The Advice Wall (25 mins)
  Here is where they feel the force.
  **Task:** Write a "New Member Pamphlet" (bullet points) for someone joining the Trust Circle tomorrow. The advice must be derived *strictly* from your stack.

  *   **Cranes:** Can use any level, but preferably the top Social-Normative level because it's most usable.
  *   **Greedy:** Must derive advice *only* from the Neurochemical level. You cannot use words like "trust," "rule," "should," or "guide." You can only talk about states, causes, and effects.

  **Stakes:** Groups earn **Design Points**.
  *   1 Point for completing the stack.
  *   2 Points if the Advice Pamphlet is actually actionable (a human could read it and know what to do).
  *   **Winner:** The group with the most actionable advice picks next week's discussion topic. (Spoiler: The Greedy group will likely fail the actionable test).

  ### Debrief & Mapping (15 mins)
  Bring everyone back. Don't let them debate metaphysics yet. Stick to the game results.

  1.  **Ask the Greedy Group:** "Read your advice."
      *   *Expected output:* "Increase oxytocin," "Stabilize vestibular input."
      *   *Ask:* "If I'm blindfolded and nervous, does 'increase oxytocin' help me walk?" (No.)
      *   *Map:* This is **Explanatory Eviction**. You evicted the norm to save the ontology, but you created **Residue**. The residue is the *guidance function* that the neuro-story cannot carry.

  2.  **Ask the Crane Groups:** "Why did you keep the Social card?"
      *   *Expected output:* "Because it tells us what to do."
      *   *Map:* This is the **Crane**. The lower levels support the structure, but the higher levels do the work of coordination. Dennett's point: Cranes lift heavy loads; Skyhooks (or greedy reductions) pretend to lift loads but actually just hang there.

  3.  **The Kicker:** Ask the Greedy group to read their **Residue List** from Round 1.
      *   Highlight that they *knew* what they were losing. Greedy reductionism isn't stupid; it's a trade-off. It buys ontological simplicity at the cost of pragmatic utility.

  ### Limitations (The Honest Note)
  Tell them this explicitly:
  > "This game shows a **pragmatic** failure, not a metaphysical one. The Greedy group failed to give *advice*, but that doesn't prove the Social-Normative level is *real* in a metaphysical sense. It just proves it's useful. Dennett wants to say higher levels are real *because* they are indispensable patterns, but this activity only proves they are indispensable for *us*, right now. It doesn't settle whether norms exist independently of our need to use them."

  ### What Will Predictably Go Wrong (First Run)
  1.  **The Metaphysics Trap:** Grad students love to argue about whether neurons are "more real" than norms during Round 2. Shut this down. Remind them: "I don't care what's real, I care if the blindfolded person falls." Keep it pragmatic.
  2.  **The Cheat:** The Greedy group will try to sneak norm words into their advice ("Optimize your social bonding"). Call them out. If they say "bonding," they are using the evicted card. Force them to say "neural coupling."
  3.  **Time Creep:** Round 1 often drags as they argue over where Evolution fits. Cut them off at 25 mins hard. The friction is the point, not the perfect map.
  4.  **Card Ambiguity:** If "Game-Theoretic" feels too abstract, let them rename it "Strategy." Just keep the logic intact.

  ### Wrap Up (5 mins)
  Award the Design Points. (Cranes should win). Let the winners pick the next topic. Dismiss.

  ---
  *Note: If you run out of time, skip the "Residue List" writing in Round 1 and have them discuss it verbally in the debrief, but writing it makes the "loss" concrete.*
