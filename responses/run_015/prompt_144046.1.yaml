  **Note on Theory and Form**

  I take a liberty with Sartre's phenomenology by rendering the emotional choice as somewhat more reflective than he might allow. In *Sketch for a Theory of Emotions*, Sartre describes the magical transformation of the world (e.g., fainting to annihilate a threat) as a spontaneous, pre-reflective mode of consciousness, not necessarily a deliberated "I say" or "I weave." The poem's speaker sounds like they are consciously constructing the emotion, whereas Sartre argues we *live* the emotion as a specific way of apprehending the world when practical pathways are blocked.

  A contested reading here is whether bad faith requires explicit lying to oneself or if it can be entirely pre-reflective. If emotion is truly pre-reflective, the speaker's insistence ("I say") is already a secondary rationalization, not the primary bad faith act. Textual evidence from *Being and Nothingness* regarding the "cynical" vs. "faithful" aspects of bad faith would challenge the poem's mapping: if the speaker knows they are hiding liberty (as the refrain suggests), they are closer to cynicism than the unstable faith Sartre describes. Conversely, if the speaker genuinely believes the fear is natural, the second refrain ("A magic shift...") functions as an authorial exposure rather than the speaker's own realization, which softens the existential tension. To change my mind, one would need to demonstrate that Sartre views emotional choice as fully transparent to consciousness at the moment of occurrence, rather than a structure of being we inhabit.
