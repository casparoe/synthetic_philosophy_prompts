      *   End with `\answer{Sam}` or `\answer{Riley}` on its own line? Yes.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is Riley right about the definition of joint intention?* Bratman does say shared intention involves interlocking intentions. If Riley privately doubted, does that break the "we"? Most philosophers would say the *public commitment* overrides private doubt once action is taken (flyer, work split). So Sam still holds the stronger ground on the *existence* of the commitment.
      *   *Is Riley right that quitting is always available?* Yes, morally, you can quit a club. But you owe an explanation. Riley admits quitting is available but frames the consequence only as "cost." Sam frames it as "breaking something." Sam's framing is more accurate to human relationships.
