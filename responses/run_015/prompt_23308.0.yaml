          4.  Final Verdict.
      *   *Philosophical References (Simplified):* Mention Margaret Gilbert (Joint Commitment) and Michael Bratman (Shared Intention) lightly to ground the analysis without overwhelming.
      *   *Verdict:* Sam is more right overall because the social reality of the agreement (flyer, split work) created an obligation that Riley violated by ghosting. Riley's philosophical defense is a rationalization for bad behavior.

