answer: |-
  Here is a usable procedure designed for your constraints (5 mins/case, manager-friendly, honest about subjectivity).

  ### The "Agency vs. Condition" Filter (v1.0)

  **Goal:** Distinguish between non-human forces that *drove* history (Actors) and those that merely *framed* it (Background).
  **Time Budget:** 5 Minutes.
  **Output:** Tag as `HISTORICAL_ACTOR` or `BACKGROUND_CONDITION`.

  ---

  #### The Checklist (Run in Order)

  **Q1. The Specificity Test**
  *   **Question:** Is this a discrete *event* (happened at a specific time) or a continuous *state* (always there or changing slowly)?
  *   **Pass (Event):** Proceed to Q2.
  *   **Fail (State):** Tag `BACKGROUND_CONDITION`. **STOP.**
  *   *[SUBJECTIVE FLAG]:* Defining "slowly" is a judgment call. A 5-year drought might feel like an event to a farmer but a state to a demographer. Use the dataset's median timescale as your baseline.

  **Q2. The Mitigation Test**
  *   **Question:** At the time, did humans have the *technology or knowledge* to reasonably mitigate this, but failed?
  *   **Pass (No mitigation possible):** Proceed to Q3. (e.g., They couldn't stop the volcano).
  *   **Fail (Mitigation possible):** Tag `BACKGROUND_CONDITION`. **STOP.**
      *   *Reasoning:* If humans could have fixed it but didn't, the *human decision* is the actor, not the condition. This prevents the "determinism trap."
  *   *[SUBJECTIVE FLAG]:* "Reasonably" is doing a lot of work here. You are judging past tech/capacity.

  **Q3. The Disruption Test**
  *   **Question:** Did this non-human thing force a *change in trajectory* that human plans could not absorb?
  *   **Pass (Trajectory Broken):** Tag `HISTORICAL_ACTOR`.
  *   **Fail (Absorbed):** Tag `BACKGROUND_CONDITION`.
      *   *Reasoning:* If society kept functioning normally despite the thing, it's scenery. If it broke the script, it's an actor.
  *   *[SUBJECTIVE FLAG]:* "Change in trajectory" is interpretive. You are deciding what the "normal" path was.

  **Q4. The Gut Check (Mandatory)**
  *   **Question:** Does tagging this as an `ACTOR` accidentally absolve a human group of responsibility?
  *   **Yes:** Override to `BACKGROUND_CONDITION` and add a note: *"Human agency primary."*
  *   **No:** Confirm `HISTORICAL_ACTOR`.
  *   *[SUBJECTIVE FLAG]:* This is pure moral judgment. There is no rule here.

  ---

  ### Test Run: 3 Cases

  #### Case 1: 1815 Tambora Eruption → 1816 Riots
  *   **Q1 (Specificity):** Discrete event (April 1815). **PASS.**
  *   **Q2 (Mitigation):** Could 1815 humans stop a volcano or grow food in global freezing temps? No. **PASS.**
  *   **Q3 (Disruption):** Did it break the trajectory? Yes, global harvest failure, mass migration, riots where there were none before. **PASS.**
  *   **Q4 (Gut Check):** Does this absolve humans? No. The riots were human reactions, but the *trigger* was undeniable external force.
  *   **Final Tag:** `HISTORICAL_ACTOR`
  *   **Time:** 3 minutes.

  #### Case 2: Cholera Strain (1854 Broad Street Pump)
  *   **Q1 (Specificity):** Discrete outbreak event. **PASS.**
  *   **Q2 (Mitigation):** Could they have mitigated it? Yes (boil water, fix sewage), but they didn't *know* germs caused it yet. Knowledge gap = No reasonable mitigation. **PASS.**
  *   **Q3 (Disruption):** Did it break trajectory? Yes, killed 10% of the neighborhood, changed public health policy forever. **PASS.**
  *   **Q4 (Gut Check):** **WARNING.** Does tagging the *germ* as an actor absolve the Local Board of Health who ignored sanitation?
      *   *Decision:* For this dataset, we are tagging *causes*. The germ is a cause.
  *   **Final Tag:** `HISTORICAL_ACTOR`
  *   **Time:** 4 minutes.

  #### Case 3: 200-Year Aridification → Migration
  *   **Q1 (Specificity):** Continuous state (200 years).
  *   **Result:** **FAIL.**
  *   **Final Tag:** `BACKGROUND_CONDITION`
  *   **Time:** 1 minute.
  *   **Note:** Even if it caused migration, the slowness makes it a "stage" humans moved across, not a "player" that entered the stage.

  ---

  ### Where This Procedure Breaks (The "Honesty" Report)

  You asked me to flag where this is just dressed-up gut feeling. Here is where you and your manager will fight, and where the "objectivity" is fake.

  **1. The "Reasonable Mitigation" Trap (Q2)**
  *   **The Break:** In the Cholera case, I argued they couldn't mitigate it because they didn't know about germs. But a critic could say, "They could have cleaned the pump anyway."
  *   **The Risk:** If you define "mitigation" too loosely, *nothing* becomes an Actor because humans *always* could have done something differently. If you define it too strictly, *everything* becomes an Actor.
  *   **Your Move:** When your manager asks why Cholera is an Actor but a Famine caused by bad policy isn't, your answer is: "Could they have stopped it with 1850s tech?" Be consistent on the *tech/knowledge baseline*, not the outcome.

  **2. The "Feels Wrong" Case (Cholera)**
  *   **The Issue:** The checklist spits out `HISTORICAL_ACTOR` for the Cholera strain.
  *   **Why it feels wrong:** Calling a bacteria an "Actor" sounds like we are blaming the germ instead of the city council that dumped sewage in the water. It risks biological determinism.
  *   **Why the checklist keeps it:** Because without the germ, the event doesn't happen. It satisfies the "Disruption" test.
  *   **Recommendation:** Keep the tag, but add a metadata field for `HUMAN_AMPLIFIER`. Tag the Board of Health there. This satisfies the "no determinism" worry without breaking the logic.

  **3. The Timescale Arbitrary Line (Q1)**
  *   **The Break:** I tagged the 200-year Aridification as `BACKGROUND`. But what if it was a 5-year drought? Is 5 years an "event"?
  *   **The Risk:** This is purely arbitrary. A 10-year drought might be tagged `ACTOR` under a different engineer.
  *   **Your Move:** Document a hard cutoff in your team wiki (e.g., "Anything >50 years is Background"). Don't debate it per case.

  **4. The Moral Override (Q4)**
  *   **The Break:** Q4 admits that sometimes the logic is right, but the *implication* is dangerous.
  *   **The Risk:** This is where your personal politics enter the dataset. You might tag a Hurricane as `BACKGROUND` because you don't want to distract from poor infrastructure planning, while your colleague tags it `ACTOR`.
  *   **Your Move:** This is the only step you cannot automate. If Q1-Q3 say "Actor" but Q4 makes you uncomfortable, **escalate to the manager.** Do not make the moral call alone. That is not an engineering decision; it is a historiographical one.

  ### Summary for your Manager
  *   **Workflow:** 4 Questions. If Q1 or Q2 fails, it's Background. If Q3 passes, it's Actor. Q4 is the safety valve.
  *   **Efficiency:** ~3 mins/case.
  *   **Transparency:** We acknowledge that "Mitigation" and "Disruption" require human judgment. We are not claiming this is math; we are claiming it is *consistent* judgment.
  *   **Safety:** The "Gut Check" step prevents us from tagging things in a way that erases human responsibility.
