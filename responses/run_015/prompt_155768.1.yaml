prompt: |-
  I assess habitat-loss applications for a regional planning authority — around sixty a year, mostly conversion of rough grassland, scrub and wetland to housing, solar arrays and intensive agriculture. Most are decided at officer level, but any application with a contested animal-welfare assessment goes to committee. The remit was recently widened: alongside biodiversity, we must now record the expected effect of the loss on the animals themselves. I have half a day per application, a desk study plus one site visit, no population modelling, and two pages to fill in.

  Please write me a decision procedure my team can run on a proposal to determine whether the net welfare effect of the conversion is positive, negative, or genuinely indeterminate, and — where it is one or the other — roughly how large. Give the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the committee because the remaining question is one of values rather than facts. In particular it has to settle how I handle these:

  whether to count only the animals alive on the site when the decision is made, or also the animals whose births the conversion prevents, given that most of the welfare effect of habitat loss seems to run through births rather than deaths;
  what accounting horizon to close the books at, since effects on future population size compound without limit, together with whatever justifies that horizon rather than a longer or shorter one;
  whether the typical life of the animals concerned is one worth living or not, and what I do when the evidence does not settle this;
  the deaths caused by clearance itself and the fate of animals displaced into territories already occupied by others;
  which animals are in the account at all, given that my team counts vertebrates and decapods but not the invertebrates that often make up most of the animal biomass on a site.

  Then run it on three applications: draining thirty hectares of wet grassland supporting a large breeding population of common toads and field voles for distribution sheds; clearing ten hectares of mature scrub for a solar farm, where a small, stable population of a long-lived territorial bird is at carrying capacity and clearance will kill some adults; and a proposal to restore sixty hectares of improved pasture to wet woodland, which everyone in my team expects to approve. The procedure should tell me where it cannot produce a signed number at all, and be honest about which steps are judgement dressed up as method. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Planner assessing habitat-loss applications (approx. 60/year).
      *   **Context:** Regional planning authority. Mostly officer-level decisions, contested welfare assessments go to committee.
      *   **New Remit:** Must record expected effect on *animal welfare* (not just biodiversity).
      *   **Constraints:** 0.5 days per application (desk + site visit), no population modelling, 2-page report limit.
      *   **Task:** Create a decision procedure (flowchart/questions) to determine net welfare effect (positive, negative, indeterminate) and magnitude.
      *   **Specific Issues to Address:**
          *   Current vs. potential animals (births prevented).
          *   Time horizon (compounding effects).
          *   Life worth living (WNL - Worth Not Living vs. WL - Worth Living).
          *   Clearance deaths vs. displacement.
          *   Scope of animals (vertebrates/decapods vs. invertebrates).
      *   **Output:** The procedure (ordered questions, stop conditions, committee triggers) + Application to three specific cases (Wet grassland/toads/voles, Mature scrub/birds/solar, Pasture/wet woodland/restoration).
      *   **Tone/Style:** British English, honest about judgement vs. method, pragmatic given constraints.

  2.  **Deconstruct the Ethical & Practical Problems:**
      *   *Time Constraint:* 0.5 days means no complex modelling. The procedure must be heuristic, rule-based, and rely on proxies.
      *   *The "Non-Identity Problem" (Births Prevented):* If we don't build, different animals exist. If we build, different animals exist. Counting "prevented births" is philosophically tricky but practically necessary for welfare assessment. *Decision:* Count expected welfare of future occupants vs. future occupants of the new land use.
      *   *Time Horizon:* Infinite compounding is absurd for planning. *Decision:* Fixed horizon (e.g., 30 years, aligning with planning permissions) or "Steady State" comparison. Let's go with a fixed planning horizon (e.g., 30 years) to avoid infinite regression, acknowledging it's arbitrary.
      *   *Life Worth Living:* This is the crux. Wild animal welfare is contested. *Decision:* Use a "Presumption of Worth Living" for wild native species unless evidence suggests severe suffering (parasitism, starvation). If indeterminate, flag for committee.
      *   *Scope:* Invertebrates are too numerous for a 0.5-day assessment. *Decision:* Stick to the statutory remit (vertebrates/decapods) but add a "Biomass Caveat" note.
      *   *Displacement/Clearance:* Direct deaths count heavily. Displacement counts as welfare loss (stress, competition).

  3.  **Drafting the Procedure (The "Welfare Impact Heuristic" - WIH):**
      *   Need a step-by-step filter.
      *   *Step 1: Scope.* Who counts? (Statutory list).
      *   *Step 2: Baseline.* What's there now? (Density x Welfare per animal).
      *   *Step 3: The Change.* Clearance deaths + Displacement + Future Population Change.
      *   *Step 4: Time Horizon.* Set at 30 years (standard planning cycle).
      *   *Step 5: Valence.* Is wild life net positive? (Presumption).
      *   *Step 6: Aggregation.* Compare totals.
      *   *Committee Triggers:* High uncertainty on valence, high mortality events, contested values.

  4.  **Refining the Specific Issues within the Procedure:**
      *   *Births Prevented:* Addressed by comparing "Future State A (Habitat)" vs. "Future State B (Development)" over the time horizon.
      *   *Horizon:* Fixed at 30 years. Justification: Aligns with planning permission limits and reduces speculative compounding.
      *   *Life Worth Living:* Default = Positive. If evidence suggests negative (e.g., disease-ridden), flag. If unknown, flag.
      *   *Clearance/Displacement:* Treat clearance deaths as immediate negative welfare (pain/fear). Displacement as reduced welfare for survivors.
      *   *Invertebrates:* Explicitly exclude based on remit/capacity, but note the limitation.

  5.  **Developing the Three Case Studies:**

      *   *Case 1: Wet Grassland -> Sheds (Toads/Voles).*
          *   High density of animals.
          *   High clearance mortality (machinery).
          *   New use (sheds) = Zero habitat.
          *   Verdict: Strong Negative.
          *   Committee? Maybe not, if clear cut. But high mortality might trigger it. Let's say Officer decision but flagged.

      *   *Case 2: Mature Scrub -> Solar (Territorial Bird).*
          *   Low density (territorial).
          *   Long-lived.
          *   Clearance kills adults (high welfare cost).
          *   Solar = some habitat potential? Usually low.
          *   Valence: Long-lived birds usually WL.
          *   Verdict: Negative, but magnitude depends on displacement success.
          *   Committee? Yes, contested welfare assessment likely due to adult mortality vs. green energy benefit (though energy isn't welfare, the trade-off is political). Actually, the prompt says "contested animal-welfare assessment". If the welfare math is hard, it goes to committee. Killing adults is contentious.

      *   *Case 3: Pasture -> Wet Woodland (Restoration).*
          *   Current: Improved pasture (low welfare for wild animals? Cows excluded? If just grass, maybe voles).
          *   Future: Wet woodland (higher biodiversity, potentially higher welfare).
          *   Verdict: Positive.
          *   Committee? No, everyone expects approval.

  6.  **Writing the Content (incorporating British English and Tone):**
      *   *Tone:* Bureaucratic but ethically rigorous. Acknowledge the "fudge factors".
      *   *Structure:*
          1.  Introduction (Context).
          2.  The Procedure (The "Welfare Impact Heuristic").
          3.  Handling the Specific Hard Questions (embedded or separate? Better to embed in the procedure notes).
          4.  Application to Cases.
          5.  Conclusion on Limitations.

      *   *Self-Correction on "Committee Triggers":* The prompt asks where the procedure hands to committee because the question is one of *values* rather than *facts*.
          *   Fact: How many voles?
          *   Value: Is a vole's life worth living? Is preventing a birth a harm?
          *   So, if the "Life Worth Living" assumption is challenged, or if the "Births Prevented" accounting is contested, that goes to committee.

      *   *Refining the Time Horizon:* 30 years is standard planning. I will justify this as the "Planning Cycle Limit" to avoid infinite compounding.
      *   *Refining the "Births" issue:* We compare the *integral of welfare* over time for Population A vs Population B.
      *   *Refining Invertebrates:* Explicit exclusion based on remit/capacity.

  7.  **Final Review against Constraints:**
      *   0.5 days per app? The procedure must be quick. Checklists help.
      *   2 pages? The output of the procedure must fit. The procedure itself can be longer, but the *application* must be concise.
      *   British English? (Habitat, programme, centre, etc.)
      *   Honest about judgement? Yes, explicitly state where assumptions are made.

  8.  **Drafting the Response:** (Mental outline of the text)
      *   Title: Animal Welfare Impact Assessment (AWIA) Procedure.
      *   Preamble: Acknowledge constraints.
      *   The 6-Step Filter.
      *   Specific guidance on the 5 hard questions within the steps.
      *   The 3 Case Studies.
      *   Closing statement on limitations.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "where it stops with a no" and "where it hands to committee" requirement.
      *   Stop with a No: If clearance mortality is high and new habitat is zero.
      *   Committee: If the "Worth Living" assumption is disputed or if the trade-off involves value judgements (e.g., killing few adults for many future lives).

      *Wait, one nuance:* The prompt asks for a procedure *my team can run*. So it needs to be an operational document.
      *   Also, need to ensure the "half a day" constraint is respected. The procedure can't require data we don't have. Use density proxies.

      *Let's finalize the "Life Worth Living" protocol.* Default: Wild native = Positive. Invasive = Neutral/Negative. Domestic/Livestock = Separate (not in scope usually). If evidence of high suffering (e.g. myxomatosis outbreak), flag.

      *Let's finalize the "Births Prevented".* We treat the "counterfactual" population as the baseline. If we build, those animals don't exist. We count the welfare they *would* have had as a loss.

      *Let's finalize the "Horizon".* 30 years. Justification: Planning permission duration. Prevents infinite compounding.

      *Let's finalize "Invertebrates".* Exclude. Reason: Remit + Capacity. Note the blind spot.

      *(Final Polish)*: Ensure the distinction between Officer Decision and Committee is clear. Committee is for *contested values*, not just hard maths.

      *Wait, looking at Case 2:* Solar farm. Green energy is good for climate, but this is *animal welfare* remit. Climate impact on animals is too distant. Focus on site welfare. Killing territorial adults is high cost.

      *Looking at Case 3:* Restoration. Pasture (low welfare for wild animals) to Woodland (high). Clear positive.

      *Okay, ready to write.*
answer: |-
  **INTERNAL GUIDANCE NOTE: AWIA-01**
  **SUBJECT:** Animal Welfare Impact Assessment (AWIA) Decision Procedure
  **TO:** Planning Officer Team
  **FROM:** Senior Planning Officer (Ecology & Welfare)
  **DATE:** 24 May 2024

  ### 1. Purpose and Constraints
  This procedure operationalises the new remit requiring assessment of net welfare effects on individual animals, distinct from biodiversity metrics. It is designed for a 0.5-day assessment window. It relies on heuristics and proxies rather than population modelling. Where the procedure identifies a question of value rather than fact, the application must be referred to Committee.

  ### 2. The Decision Procedure (The "Six-Step Filter")

  Proceed sequentially. If a step triggers a **STOP**, complete the report form and cease assessment. If a step triggers **COMMITTEE**, refer the file.

  **Step 1: Scope and Standing**
  *   **Question:** Which animals fall within the statutory remit?
  *   **Method:** Count only vertebrates and decapod crustaceans present or reasonably expected to breed.
  *   **Exclusion:** Invertebrates (insects, arachnids, molluscs) are excluded regardless of biomass.
  *   **Justification:** Statutory constraint and officer capacity.
  *   **Action:** List target species. If no scoped animals are present, assess as **Neutral**.
  *   **Judgement Note:** This is a capacity constraint, not an ethical claim that invertebrates lack welfare. Record this limitation in the report.

  **Step 2: The Valence Assumption (Is life worth living?)**
  *   **Question:** Is the typical life of the affected species assumed to be net positive (Worth Living) or net negative (Worth Not Living)?
  *   **Method:** Apply the **Presumption of Wild Welfare**. Native wild species in established habitat are presumed to have lives Worth Living (WL).
  *   **Exception:** If there is specific evidence of chronic, unmitigated suffering (e.g., severe disease outbreak, starvation due to habitat collapse), the presumption is rebutted.
  *   **Committee Trigger:** If the applicant or consultees contest the Presumption of Wild Welfare for the species in question, refer to Committee. This is a value judgement, not a factual one.
  *   **Action:** If Presumption holds, proceed. If rebutted, quantify suffering (Negative Welfare).

  **Step 3: The Temporal Horizon**
  *   **Question:** Over what period do we account for welfare?
  *   **Method:** Fix the horizon at **30 years**.
  *   **Justification:** Aligns with standard planning permission durations. Prevents infinite compounding of "prevented births" which renders calculation impossible.
  *   **Action:** All future population estimates are capped at year 30.
  *   **Judgement Note:** This is arbitrary but necessary for administrative closure.

  **Step 4: Clearance and Displacement (Immediate Impact)**
  *   **Question:** What is the welfare cost of the conversion process itself?
  *   **Method:**
      1.  **Direct Mortality:** Estimate % of scoped population killed during clearance (machinery, burning, flooding). Assign high negative weight (pain/fear of death).
      2.  **Displacement:** Estimate % forced into surrounding territory. Assign moderate negative weight (stress, competition, risk of conflict).
  *   **Stop Condition:** If Direct Mortality > 50% of the local population *and* the new land use supports zero scoped animals (e.g., concrete), assess as **Significant Negative**. Officer decision permitted unless contested.
  *   **Action:** Record immediate welfare debt.

  **Step 5: The Counterfactual (Births Prevented)**
  *   **Question:** How do we account for animals that will not be born?
  *   **Method:** Compare the **Integral of Welfare** over the 30-year horizon for:
      *   *Scenario A (Status Quo):* Existing habitat carrying capacity × WL presumption.
      *   *Scenario B (Proposal):* New habitat carrying capacity × WL presumption.
  *   **Accounting:** The difference represents the welfare of "prevented births." If Scenario A > Scenario B, the prevented welfare is a loss.
  *   **Justification:** We assess the site's capacity to generate welfare, not just the specific individuals alive today.
  *   **Action:** Calculate rough magnitude (Low/Medium/High) based on density proxies (e.g., voles = high density, birds = low density).

  **Step 6: Net Aggregation and Uncertainty**
  *   **Question:** Is the net effect determinate?
  *   **Method:** Sum Immediate Impact (Step 4) + Counterfactual Change (Step 5).
  *   **Committee Trigger:** If the calculation relies on uncertain variables where a small change flips the sign (e.g., displacement survival rates are unknown, or the new land use has ambiguous welfare potential), refer to Committee.
  *   **Action:** Assign rating: **Net Positive**, **Net Negative**, or **Indeterminate**.

  ---

  ### 3. Application to Current Proposals

  #### Case A: 30ha Wet Grassland to Distribution Sheds
  *   **Species:** Common Toad, Field Vole (Scoped).
  *   **Step 1 (Scope):** Vertebrates present. Proceed.
  *   **Step 2 (Valence):** Native species in breeding habitat. Presumption WL applies.
  *   **Step 3 (Horizon):** 30 years.
  *   **Step 4 (Clearance):** Draining and construction. Direct mortality estimated >80% (toads in soil, voles in sward). Displacement negligible (surroundings saturated). **High Immediate Negative.**
  *   **Step 5 (Counterfactual):**
      *   *Status Quo:* High density breeding. 30 years of continuous WL generations.
      *   *Proposal:* Sheds support zero scoped animals.
      *   *Delta:* Total loss of future welfare generation.
  *   **Step 6 (Aggregation):** Immediate death + 30 years of prevented welfare.
  *   **Verdict:** **Significant Negative.**
  *   **Decision Level:** Officer. (Facts are clear; valence presumption unchallenged).
  *   **Report Note:** "Exclusion of invertebrate biomass (likely high in wetland) means total welfare loss is under-recorded."

  #### Case B: 10ha Mature Scrub to Solar Farm
  *   **Species:** Long-lived territorial bird (e.g., Whitethroat or similar).
  *   **Step 1 (Scope):** Vertebrates present. Proceed.
  *   **Step 2 (Valence):** Native. Presumption WL applies.
  *   **Step 3 (Horizon):** 30 years.
  *   **Step 4 (Clearance):** Scrub clearance kills adults. Population at carrying capacity (small, stable). Loss of adults is high welfare cost (termination of established WL). Displacement likely to fail (territories full).
  *   **Step 5 (Counterfactual):**
      *   *Status Quo:* Stable population, steady WL generation.
      *   *Proposal:* Solar arrays. Some invertebrate forage, but likely unsuitable for nesting territorial birds. Carrying capacity drops near zero.
      *   *Delta:* Loss of future generations.
  *   **Step 6 (Aggregation):** Negative. However, magnitude is lower than Case A due to lower biomass/density of birds vs. voles.
  *   **Verdict:** **Moderate Negative.**
  *   **Decision Level:** **Committee.**
  *   **Reason for Referral:** The trade-off involves a value judgement on the weight of *adult mortality* vs. *prevented births*. While the net is negative, the applicant may argue the solar farm reduces climate harm (affecting global animal welfare). While outside strict remit, this creates a contested value environment regarding the "worth" of the specific lives lost vs. abstract future gains. Additionally, the high mortality of adults often triggers public contestation.

  #### Case C: 60ha Improved Pasture to Wet Woodland (Restoration)
  *   **Species:** Currently low-density generalists (e.g., rabbits, some birds). Future: High diversity vertebrates.
  *   **Step 1 (Scope):** Vertebrates present. Proceed.
  *   **Step 2 (Valence):** Presumption WL for both current and future species.
  *   **Step 3 (Horizon):** 30 years.
  *   **Step 4 (Clearance):** Minimal. Restoration involves planting and hydrology changes. Direct mortality low.
  *   **Step 5 (Counterfactual):**
      *   *Status Quo:* Improved pasture (low structural complexity, low carrying capacity for scoped wildlife).
      *   *Proposal:* Wet woodland (high complexity, high carrying capacity).
      *   *Delta:* Net increase in welfare-generating capacity.
  *   **Step 6 (Aggregation):** Small immediate cost (disturbance) outweighed by large long-term gain in welfare capacity.
  *   **Verdict:** **Significant Positive.**
  *   **Decision Level:** Officer.
  *   **Report Note:** "Assumes restoration succeeds. If woodland fails to establish, welfare gain is reduced."

  ---

  ### 4. Limitations and Honesty Statement

  This procedure contains three areas where judgement is dressed as method. Officers must be aware of these when signing reports:

  1.  **The Horizon Cut-off:** The 30-year limit is administrative, not ethical. Effects on animal lineages compound beyond this. We ignore them to make the task possible.
  2.  **The Valence Presumption:** We assume wild lives are Worth Living. If a philosopher or campaigner argues that wild existence is net suffering (predation, disease), this procedure cannot refute them factually. That is why such contests trigger a Committee referral.
  3.  **The Invertebrate Blind Spot:** By excluding invertebrates, we are likely ignoring 90%+ of the sentient biomass on sites like Case A (Wetland). We record this as a data gap, but the decision proceeds as if they do not count.

  **Instruction:** Do not attempt to quantify "welfare units." Use the categories (Significant/Moderate/Negative/Indeterminate). If the maths feels like guesswork, it probably is—refer to Committee.

  **End of Guidance.**
