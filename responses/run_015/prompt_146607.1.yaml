prompt: |-
  Design a runnable 75-minute classroom simulation for 16 advanced undergraduates in a philosophy-economics cross-listed seminar. The goal is to make participants feel the structural pull of rational herding and information cascades through direct experience, not through lecture. Frame the scenario in everyday institutional terms—do not name the cascade model or its canonical authors in any student-facing material, and reveal the formal concept only in the debrief.

  Construct the simulation around a sequential peer-review panel awarding a single internal research grant. Each student receives a private evaluation envelope containing a noisy score (drawn from a hidden distribution with an objective true mean) for the same hypothetical proposal. They must then declare a recommendation—approve or reject—one at a time, in a fixed visible order. Each student hears all prior recommendations, but never sees the underlying scores that produced them.

  Inject a non-standard structural twist: assign half the participants an invisible institutional-loyalty cost—an unknown penalty, applied only if they break with the majority recommendation—that is drawn randomly and revealed only after the cascade locks. Crucially, students do not know whether they themselves bear this cost, and they know that others may or may not bear it, but they do not know who does. This creates a second-order reasoning problem: breaking the cascade requires not only disagreeing with observed public belief, but also risking an unknown private penalty, and assuming that others are not rationally responding to the same hidden risk.

  Design the payoff scheme using only course-participation points (no real money). Reward individual accuracy relative to the hidden true mean, but also award alignment points if the student's recommendation matches the final group decision. Make the alignment reward substantial enough that a purely accuracy-seeking agent might still rationally herd once the public sequence looks strong.

  Provide: (1) exact materials and setup rules (cards, envelopes, or digital equivalents; how scores are generated and hidden; the order of declaration); (2) the payoff matrix and point totals; (3) a minute-by-minute timeline for the 75-minute session, including when the cascade should be expected to lock; (4) the student-facing instructions, written in plain language without philosophical or technical jargon; (5) the facilitator's debrief, mapping specific moments in the sequence onto the distinction between private signal and public belief, identifying the point at which rational Bayesians with common knowledge of rationality should still follow the crowd, and explaining how the hidden loyalty parameter transforms a first-order cascade into a self-sealing second-order one; (6) an honest assessment of which formal feature of cascade theory—such as the precise Bayesian updating rule with known signal precision—this physical simulation necessarily simplifies or misrepresents, and how the facilitator should supply that missing piece verbally; and (7) a prediction of the most likely failure mode on the first run—such as a student breaking the cascade too early because they misread the payoff structure—and a specific recovery strategy.

  Keep everything self-contained: no bibliographies, no citations, no requests for further reading, and no dependence on named theories outside common knowledge. Ensure the philosophical idea does its work through the rules, incentives, and hidden parameters, not through explanation given beforehand.
reasoning: |-
  Here's a thinking process that leads to the suggested simulation design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 advanced undergraduates (Philosophy-Economics seminar).
      *   **Duration:** 75 minutes.
      *   **Goal:** Experiential understanding of rational herding/information cascades (without naming them initially).
      *   **Scenario:** Sequential peer-review panel awarding a single research grant.
      *   **Mechanism:** Private noisy scores + Public sequential declarations (Approve/Reject).
      *   **Twist:** Invisible "institutional-loyalty cost" (penalty for breaking with the majority) assigned randomly to 50% of students, unknown to them individually.
      *   **Payoffs:** Course participation points based on accuracy (vs. true mean) + alignment (with final group decision).
      *   **Deliverables:** Materials/Setup, Payoff Matrix, Timeline, Student Instructions, Facilitator Debrief, Limitations Assessment, Failure Mode/Recovery.
      *   **Constraints:** No jargon in student materials, no citations/bibliographies, self-contained.

  2.  **Deconstruct the Core Mechanics:**
      *   *Standard Cascade:* Private signal ($H$ or $L$) + Public history. If history is strong enough, ignore private signal.
      *   *The Twist:* A hidden cost for dissent. This adds a layer of *strategic uncertainty*. Even if my signal says "Reject," if the crowd says "Approve," I risk a penalty *and* I suspect others might be staying silent because *they* fear the penalty too. This creates a "pluralistic ignorance" loop on top of the information cascade.
      *   *Payoffs:* Need to balance Accuracy vs. Conformity. If Accuracy is too high, they won't herd. If Conformity is too high, they'll herd immediately regardless of signals. The sweet spot is where herding becomes *rationally* optimal after a certain point.
      *   *True Mean:* Need a ground truth. Let's say the proposal is actually "Good" (Mean > Threshold) or "Bad" (Mean < Threshold). For the simulation to work best, the private signals should be mixed enough to allow a cascade to form in the *wrong* direction or a fragile direction, but let's aim for a standard cascade where early signals dictate the path. Let's fix the "True State" as **Good** (Approve is correct), but allow early noise to potentially trigger a Reject cascade, or just let the loyalty cost solidify an Approve cascade. Actually, to make the "loyalty cost" twist salient, the cascade should lock early. Let's assume the True State is **Approve**.
      *   *Signals:* High (H) suggests Approve, Low (L) suggests Reject.
      *   *Loyalty Cost:* 50% of students have a "Penalty Card." If they vote against the *Final Majority*, they lose points. They don't know if they have it until the end.

  3.  **Drafting the Components:**

      *   **Materials:** 16 Envelopes. Inside: Signal Card (H/L) + Loyalty Card (Yes/No). Score sheet for facilitator. Whiteboard for public tally.
      *   **Payoffs:**
          *   Accuracy: +10 pts if vote matches True State.
          *   Alignment: +10 pts if vote matches Final Group Decision.
          *   Loyalty Penalty: -15 pts if you have a Loyalty Card AND vote against Final Group Decision.
          *   *Calculation:* If I vote against the crowd, I lose Alignment points (-10 relative) AND risk Loyalty Penalty (-15). Total risk = 25 pts. Gain for Accuracy = +10. Rational choice: Herd once the crowd is established, even if my signal disagrees.
      *   **Timeline:**
          *   0-10: Setup & Instructions.
          *   10-20: Private Review (reading envelopes).
          *   20-50: Sequential Declaration (2 mins per student roughly, or faster). 16 students * 2 mins = 32 mins. Need to tighten. Let's do 1.5 mins per student. ~25 mins.
          *   50-60: Reveal & Scoring.
          *   60-75: Debrief.
      *   **Instructions:** Plain English. "You are a reviewer." "You have a private assessment." "You want to maximize points." "Beware of institutional friction."
      *   **Debrief:** Connect experience to theory. Private Signal vs. Public Action. The "Loyalty Cost" as a friction term that accelerates the cascade.
      *   **Limitations:** Real Bayes updating is hard. Students won't calculate probabilities. They will use heuristics. The "Loyalty Cost" is binary here, whereas in reality, social cost is continuous.
      *   **Failure Mode:** Someone rebels early. *Recovery:* Highlight their bravery but point out the point loss. Or, if the cascade doesn't lock, adjust the debrief to discuss *why* it failed (signals were too strong/contradictory).

  4.  **Refining the "Loyalty Cost" Twist:**
      *   The prompt says: "assign half the participants an invisible institutional-loyalty cost... revealed only after the cascade locks."
      *   Crucially: "students do not know whether they themselves bear this cost."
      *   This is tricky. If they don't know if *they* have the cost, they must assume a 50% chance they do.
      *   Expected Value of Dissent:
          *   If I dissent, I lose Alignment Points (guaranteed).
          *   If I dissent, I *might* lose Loyalty Points (50% chance).
          *   If I dissent, I *might* gain Accuracy Points (if I'm right and crowd is wrong).
      *   To make herding rational: The cost of dissenting (Alignment + Expected Loyalty) must outweigh the benefit of Accuracy.
      *   Let's refine the points:
          *   Accuracy (Vote = Truth): +10.
          *   Alignment (Vote = Majority): +10.
          *   Loyalty Penalty (Has Card + Vote != Majority): -20.
          *   *Scenario:* Majority is Approve. Truth is Approve.
          *   If I Vote Approve: 10 (Acc) + 10 (Align) = 20.
          *   If I Vote Reject: 0 (Acc) + 0 (Align) - (0.5 * 20 Loyalty Risk) = -10 expected.
          *   *Scenario:* Majority is Approve. Truth is Reject (Cascade Error).
          *   If I Vote Approve (Herd): 0 (Acc) + 10 (Align) - (0.5 * 20 Loyalty Risk) = 0 expected.
          *   If I Vote Reject (Truth): 10 (Acc) + 0 (Align) - 0 Loyalty Risk = 10.
          *   *Wait,* if the cascade is wrong, truth-telling is better *unless* the Loyalty Penalty is certain. But they don't know if they have the card.
          *   To ensure the cascade locks: The risk must feel high. Let's make the Loyalty Penalty applied to *everyone* who dissents, but the *severity* is hidden? No, prompt says "assign half... unknown penalty... revealed only after."
          *   Okay, let's stick to the prompt's specific constraint: 50% have the cost. They don't know if they are in the 50%.
          *   This creates a "Risk Aversion" cascade. Even if I think the crowd is wrong, I can't afford the risk of the penalty if I happen to be one of the unlucky 50%.
          *   Payoff tweak: Make Alignment points very high. Make Accuracy points lower.
          *   Accuracy: +5. Alignment: +10. Loyalty Penalty: -20.
          *   If I Herd: Min +10 (Align). Maybe +5 (Acc). Total 10-15.
          *   If I Dissent: Min 0 (Align). Maybe +5 (Acc). Risk -20 (50% chance) = -10 expected. Total -5 to +5.
          *   Herding dominates.

  5.  **Refining the Signal Distribution:**
      *   To ensure a cascade *can* happen, signals shouldn't be unanimous.
      *   Total Students: 16.
      *   True State: **Fundable** (Approve).
      *   Signals: 10 "Approve" signals, 6 "Reject" signals. (Noisy but leaning right).
      *   Distribution in Envelopes: Pre-set. Do not randomize live, or you risk no cascade. Hard-code the envelopes to ensure a mix that allows a cascade to start (e.g., first 3 students get "Reject" signals despite True State being "Approve").
      *   *Correction:* If True State is Approve, but first 3 get Reject signals, they will Reject. Then the cascade starts. This demonstrates the *fragility* of truth.
      *   Let's set the envelopes:
          *   Students 1-3: Signal = Reject (Low).
          *   Students 4-16: Signal = Approve (High).
          *   True State = Approve.
          *   This guarantees an initial "Reject" cascade that *should* be overturned by private info, but the loyalty cost prevents it. This makes the simulation dramatic.
          *   *Wait, prompt says:* "drawn from a hidden distribution." I can pre-set the distribution to ensure the pedagogical outcome. I will prepare 16 envelopes with specific signals to guarantee the pedagogical arc.
          *   Loyalty Cards: Randomly assign 8 "Yes" and 8 "No" among the 16 envelopes.

  6.  **Writing the Instructions:**
      *   Tone: Professional, administrative.
      *   Avoid: "Cascade," "Bayesian," "Herding."
      *   Use: "Consensus," "Institutional Fit," "Private Assessment."

  7.  **Addressing the Debrief:**
      *   Must reveal the "Loyalty Cost" mechanic.
      *   Must explain why rational people ignored their own eyes.
      *   Must connect to the "Second-Order" problem (I think you are herding because you are scared, so I am scared too).

  8.  **Review against Constraints:**
      *   75 minutes? Yes.
      *   16 students? Yes.
      *   No jargon in student face? Yes.
      *   Self-contained? Yes.
      *   Specific failure mode? Yes (Early rebellion).

  9.  **Final Polish:**
      *   Check point math.
      *   Ensure the "Loyalty Cost" reveal is dramatic.
      *   Make sure the timeline is realistic (transitions take time).

  *(Self-Correction during drafting)*: 75 minutes is tight for 16 sequential turns plus debrief. 16 turns @ 2 mins = 32 mins. Setup 10. Reveal 10. Debrief 23. This works. I need to enforce the timing strictly.
  Also, the "Loyalty Cost" needs to be clear. If they don't know if *they* have it, they act as if they *might*. The payoff structure must make the *risk* of having it sufficient to deter dissent.
  Let's adjust the payoff to ensure the "Risk" is palpable.
  Base Points: 100.
  Accuracy Bonus: +20.
  Consensus Bonus: +30.
  Loyalty Penalty: -50 (if applicable).
  If I dissent: I lose Consensus (-30). I risk Loyalty (-25 expected). I gain Accuracy (+20). Net: -35.
  If I conform: I gain Consensus (+30). I risk nothing. I might gain Accuracy (+20). Net: +30 to +50.
  Conformity is strictly dominant once a consensus appears likely.

