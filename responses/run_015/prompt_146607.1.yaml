  This is the ideal pedagogical path.

  Okay, ready to write.

  *(One last check on the "Loyalty Cost" constraint)*: "assign half the participants an invisible institutional-loyalty cost... revealed only after the cascade locks. Crucially, students do not know whether they themselves bear this cost."
