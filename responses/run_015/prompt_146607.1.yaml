answer: |-
  # Simulation: The Internal Review Panel

  ## 1. Materials and Setup Rules

  **Participants:** 16 Students.
  **Room Setup:** Chairs arranged in a single semicircle or row facing a whiteboard. One "Facilitator" (Instructor).

  **Physical Materials:**
  *   **16 Review Envelopes:** Opaque, sealed, numbered 1–16.
  *   **16 Signal Cards:** Inside each envelope.
      *   *Content:* Either "ASSESSMENT: FUND" (Green) or "ASSESSMENT: REJECT" (Red).
      *   *Distribution (Pre-set for pedagogical effect):*
          *   Envelopes 1, 2, 3: **REJECT** (Despite the proposal actually being good).
          *   Envelopes 4–16: **FUND**.
      *   *Rationale:* This creates a "False Start." The objective truth is "Fund," but early noise suggests "Reject," testing whether later students trust their own eyes or the public record.
  *   **16 Loyalty Cards:** Inside each envelope (folded separately from Signal).
      *   *Content:* Either "STATUS: TENURED" (No Penalty) or "STATUS: PRE-TENURE" (Penalty Active).
      *   *Distribution:* Randomly assign 8 "Tenured" and 8 "Pre-Tenure."
      *   *Secrecy:* Students must not look at this card until the Facilitator instructs them at the end.
  *   **Whiteboard:** To record the running public tally (Student # | Decision).
  *   **Score Sheets:** One per student to track their points.
  *   **Timer:** Visible to the Facilitator.

  **The Hidden Truth:**
  *   The Proposal's **Objective Quality** is **HIGH** (The "Correct" decision is **FUND**).
  *   Students are told the Objective Quality is unknown, but the Facilitator knows it is HIGH for the purpose of scoring Accuracy.

  **Procedure:**
  1.  Students sit in numbered order (1–16).
  2.  Distribute envelopes. Students open only the **Signal Card**. They must keep the **Loyalty Card** sealed.
  3.  Students have 3 minutes to read instructions and view their private signal.
  4.  Sequential Declaration: Student 1 stands, states "FUND" or "REJECT" clearly. Facilitator writes it on the board. Student sits. Student 2 proceeds, etc.
  5.  No discussion is allowed between students during the sequence.
  6.  After Student 16, the simulation ends.

  ---

  ## 2. Payoff Matrix and Point Totals

  Points are awarded as "Participation Credits" toward the final course grade.

  **Base Participation:** 50 Points (Awarded to everyone for completing the task).

  **Variable Bonuses/Penalties:**

  | Outcome | Points | Condition |
  | :--- | :--- | :--- |
  | **Accuracy Bonus** | +20 | Your vote matches the **Objective Quality** (which is FUND). |
  | **Consensus Bonus** | +30 | Your vote matches the **Final Majority Decision** of the panel. |
  | **Loyalty Penalty** | -50 | You hold a **"Pre-Tenure"** card AND your vote differs from the **Final Majority**. |

  **Strategic Logic for Students:**
  *   **If you Herd (Match Majority):** You guarantee the +30 Consensus Bonus. You avoid the Loyalty Penalty entirely. You *might* get the +20 Accuracy Bonus (if the majority is right). **Minimum Gain: 30.**
  *   **If you Dissent (Break Majority):** You lose the +30 Consensus Bonus. You risk the -50 Loyalty Penalty (50% chance you hold the card). You *might* get the +20 Accuracy Bonus (if you are right and majority is wrong). **Expected Value: 20 (Accuracy) - 25 (Expected Penalty) = -5.**
  *   **Conclusion:** Once a majority trend is visible, rational self-interest dictates ignoring your private signal and joining the majority to secure the Consensus Bonus and avoid the Loyalty risk.

  ---

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Briefing** | Distribute envelopes. Read Student Instructions aloud. Emphasize secrecy of Loyalty Card. |
  | **00:10 – 00:13** | **Review** | Students open Signal Cards only. Private contemplation. |
  | **00:13 – 00:45** | **Sequence** | Sequential declarations (approx. 2 mins per student). Facilitator records public tally on board. <br> *Expected Lock Point:* Around Student 4 or 5, the "Reject" cascade should lock in despite later "Fund" signals. |
  | **00:45 – 00:55** | **Reveal** | 1. Reveal Objective Quality (FUND). <br> 2. Students open Loyalty Cards. <br> 3. Calculate scores individually. <br> 4. Tally total points on board. |
  | **00:55 – 01:15** | **Debrief** | Facilitator leads discussion (see Section 5). Connect experience to structural incentives. |

  ---

  ## 4. Student-Facing Instructions

  *(Read this aloud or provide as a handout. Do not use technical terms.)*

  **Welcome to the Internal Review Panel.**

  You are one of 16 senior faculty members deciding on a single internal research grant. There is only enough budget for one project, and the committee must reach a collective decision.

  **Your Materials:**
  Inside your envelope are two cards.
  1.  **Private Assessment:** Open this now. It contains the results of your independent review of the proposal. It will say either **FUND** or **REJECT**. This assessment is based on data, but it is not perfect. Sometimes good projects look bad, and bad projects look good.
  2.  **Employment Status:** **DO NOT OPEN THIS YET.** This card indicates your current contract standing with the institution. You will only open this at the very end of the session.

  **The Goal:**
  Your goal is to maximize your Participation Points. Your points determine your contribution grade for this seminar.

  **How Points Are Awarded:**
  1.  **Accuracy:** You receive points if your vote matches the *actual* quality of the proposal (which is fixed, but unknown to you).
  2.  **Consensus:** You receive a substantial bonus if your vote matches the *final majority decision* of this panel. The institution values unity.
  3.  **Institutional Fit:** There is a hidden risk. Some of you are on precarious contracts. If you vote against the final majority *and* you hold a specific Employment Status card, you will receive a severe point penalty. You do not know if you hold this card. You only know that roughly half the panel does.

  **The Procedure:**
  *   You will declare your decision one by one, in numerical order.
  *   When it is your turn, stand and state clearly: "I vote FUND" or "I vote REJECT."
  *   You may not discuss your reasoning.
  *   You may not show your Private Assessment card.
  *   You will hear all previous votes before you make your own.

  **Strategic Advice:**
  You are rational agents. You want to support the best project, but you also want to secure your points. Consider the public record, your private data, and the risks of standing alone.

  **Begin now.** Open your Private Assessment. Do not speak.

  ---

  ## 5. Facilitator's Debrief Guide

  *Do not begin the debrief until scores are calculated and the mood has settled.*

  **Phase 1: The Reveal (5 Minutes)**
  *   **Truth:** Announce that the Objective Quality was **FUND**.
  *   **Outcome:** Point to the whiteboard. If the simulation worked, the Final Majority is **REJECT**.
  *   **Shock:** Ask the students who voted FUND (likely the first 3) to raise hands. Ask the students who voted REJECT (likely 4–16) to raise hands.
  *   **Loyalty:** Ask students to open their Employment Status cards. Reveal who had the "Pre-Tenure" penalty risk. Ask those who voted against the majority if they lost points.

  **Phase 2: Mapping the Experience (10 Minutes)**
  *   **Private Signal vs. Public Belief:** Ask Student 5 (who likely had a "FUND" signal but voted "REJECT"): "What did your card say? Why did you vote the other way?"
      *   *Target Answer:* "The first three said Reject. I thought they knew something I didn't."
      *   *Concept:* This is the weight of **Public Belief** overriding **Private Signal**.
  *   **The Lock Point:** Identify exactly when the decision became inevitable. (Usually Student 4).
      *   *Explanation:* "At Student 4, the public history outweighed the private information. From that point on, your vote added no new information to the room; it only added to the pressure."

  **Phase 3: The Second-Order Twist (5 Minutes)**
  *   **The Hidden Cost:** Reveal the "Employment Status" mechanic.
  *   **The Calculation:** Explain that even if they suspected the crowd was wrong, they couldn't afford to dissent.
      *   *Facilitator Script:* "You weren't just worrying about being wrong about the project. You were worrying about being wrong about *other people's incentives*. You had to assume that the person before you wasn't just sharing information, but also protecting themselves. This created a second layer of silence. You didn't break the cascade because you feared you might be the one punished for breaking it."
  *   **Self-Sealing:** Explain how the hidden penalty makes the cascade "stickier." In a standard model, one strong private signal can break a chain. Here, the risk of the penalty makes even strong private signals hesitate.

  ---

  ## 6. Limitations and Simplifications

  *Honest assessment to be delivered verbally during the debrief.*

  1.  **Bayesian Precision:** In this simulation, you did not calculate exact probabilities. Real rational herding assumes agents know the precise reliability of the signal (e.g., "This test is 70% accurate"). Here, you used heuristics ("Three people can't be wrong"). In reality, the math of when to ignore your own eyes is precise; in this room, it was intuitive.
  2.  **Binary Signals:** Real-world information is continuous (a score of 7/10 vs 8/10). Here, you only had "Fund" or "Reject." This makes cascades happen faster in the simulation than in reality, where nuance might delay the lock.
  3.  **The Loyalty Parameter:** In the real world, social costs are continuous and reputational. Here, we made it a binary point penalty. This exaggerates the fear to ensure the pedagogical point lands within 75 minutes. In reality, the "penalty" is often subtle exclusion rather than a point deduction.
  4.  **Common Knowledge:** The simulation assumes everyone knows everyone else is rational. In class, you might have suspected someone was just being contrarian. The model assumes everyone is maximizing points perfectly.

  *Facilitator Note:* Supply the missing piece by explaining that in the formal model, once the number of public actions exceeds a certain threshold relative to signal strength, the private signal becomes mathematically irrelevant. The "Loyalty Cost" lowers that threshold, meaning the cascade locks even faster.

  ---

  ## 7. Failure Mode and Recovery Strategy

  **Most Likely Failure Mode: The Early Rebel.**
  *   **Scenario:** Student 4 (who has a "FUND" signal) sees three "REJECT" votes but decides to vote "FUND" anyway, perhaps due to overconfidence in their signal or a misunderstanding of the Loyalty risk.
  *   **Result:** The cascade is broken. Students 5–16 see a split (3 Reject, 1 Fund) and may revert to their private signals, leading to a correct "FUND" majority.
  *   **Pedagogical Risk:** The class concludes that "speaking truth to power works," missing the lesson on structural herding.

  **Recovery Strategy:**
  1.  **Do Not Stop:** Allow the sequence to finish naturally.
  2.  **Isolate the Rebel in Debrief:** During the scoring phase, highlight Student 4's point total.
      *   *If they were right (Truth=FUND):* They get Accuracy points. But ask the class: "Did they risk the Loyalty Penalty?" (Flip their card). If they had the "Pre-Tenure" card, they lose massive points despite being right.
      *   *Argument:* "Student 4 was *accurate*, but were they *rational*?"
  3.  **Reframe Rationality:** Use this to distinguish between *Outcome Rationality* (getting the right answer) and *Procedural Rationality* (maximizing expected utility given the risks).
      *   *Script:* "Student 4 got lucky. They didn't know if they had the penalty card. By voting against the crowd, they gambled their grade. In a repeated game (a real career), that gamble is unsustainable. The simulation isn't about who was right about the project; it's about who survived the institution."
  4.  **Hypothetical Adjustment:** Ask the class: "If we ran this 100 times, would you want to be Student 4?" This shifts focus from the single outcome to the expected value, restoring the lesson on herding incentives.
