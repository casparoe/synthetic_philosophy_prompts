      *   Expert follows private signal.
      *   If Expert says "1" (against herd "0").
      *   Agent $k+1$ sees: Herd History + Expert Vote "1".
      *   Does Agent $k+1$ know the Expert is an expert? Prompt: "publicly known".
      *   So Agent $k+1$ treats Expert vote as weight 9. Herd as weight 4.
      *   Net weight 5 towards "1".
      *   Agent $k+1$ follows "1" regardless of private signal (unless private signal is super strong, but it's 2/3).
      *   So new cascade forms immediately behind Expert.
      *   Accuracy determined by Expert's signal quality + prior herd info.
      *   Essentially, the decision rests on the Expert + the 2 initial signals.
      *   Accuracy will be very close to Expert's accuracy (0.9).
