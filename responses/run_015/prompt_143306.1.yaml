answer: |-
  This variant—let's call it the St. Petersburg Sleeping Beauty—is a stress test that breaks the machinery of the Copy-Frequency principle while leaving the No-News principle battered but standing.

  Here is the comparison of the principles in this specific context, followed by the verdict on which one is embarrassed.

  ### 1. The Zero Credence Problem (The Principal Principle Violation)

  The most immediate casualty is the Copy-Frequency principle. Under this view, Beauty's credence in Heads is the ratio of Heads-awakenings to total expected awakenings.
  *   Heads-awakenings: 1
  *   Tails-awakenings: Expected value is $\infty$.
  *   Ratio: $1 / \infty \approx 0$.

  This forces Beauty to assign a credence of 0 to Heads. This is a catastrophic result. Beauty knows, as a matter of brute physical fact established on Sunday, that the coin is fair. The objective chance of Heads is 1/2. A core constraint on rational belief (often called the Principal Principle) is that if you know the objective chance of an event is $x$, and you have no "inadmissible" information, your credence should be $x$.

  By driving her credence to 0, the Copy-Frequency principle forces Beauty to be certain the coin landed Tails, despite knowing it was a fair toss. It conflates the *probability of the world state* (the coin) with the *probability of the observer moment* (the awakening). In the finite case, this conflation is debatable but tolerable. In the infinite case, it forces a logical contradiction between her knowledge of the setup and her resulting belief.

  The No-News principle avoids this entirely. It maintains that the awakening provides no evidence about the coin toss itself. The coin was fair on Sunday, and waking up doesn't change the physics of the coin. Her credence remains 1/2. This respects the link between objective chance and rational credence.

  ### 2. The Discontinuity and the Limit

  You noted the discontinuity: if we cap $N$ at $2^K$, the Copy-Frequency credence drops as $K$ increases, approaching 0 as $K \to \infty$. The No-News credence stays at 1/2 regardless of $K$.

  Is the untruncated case ill-posed? Mathematically, dealing with infinite expectations is tricky, but conceptually, the discontinuity indicts the Copy-Frequency principle, not the case.

  If a principle yields a sequence of answers ($1/3, 1/4, \dots, 1/K$) that converges to 0, but the physical reality of the limit case (a fair coin) demands 1/2, the principle is tracking the wrong variable. Copy-Frequency is tracking the *density of observations*, not the *truth of the proposition*. As the number of Tails-observations balloons, the "sample" becomes overwhelmingly Tails-heavy, even though the "population" of worlds is still 50/50.

  The No-News principle shows no discontinuity because it doesn't rely on the count of awakenings to determine coin credence. It treats the coin flip as the primary event and the awakenings as secondary consequences. The fact that the Copy-Frequency answer changes based on how many times she is woken suggests that, under that principle, her belief about the past coin toss is sensitive to future experimental parameters (how many times they plan to wake her). This looks like backward causation in the epistemology: the number of future interviews dictates the probability of the past toss. No-News avoids this by decoupling the two.

  ### 3. Betting and the Credence-Action Gap

  This is where the No-News principle has to do some heavy lifting, but it survives, whereas Copy-Frequency collapses the distinction between belief and betting odds.

  Consider the bet: Beauty is offered a bet on Heads at every awakening.
  *   **If Heads:** She bets once, wins \$1.
  *   **If Tails:** She bets $N$ times, loses \$1 each time.

  Expected Value of the betting strategy:
  $$EV = 0.5 \times (1) + 0.5 \times (-E[N])$$
  Since $E[N] = \infty$, the Expected Value is $-\infty$. Rational decision theory says she should **not** take the bet at any positive price.

  *   **Copy-Frequency:** Says Credence = 0. Therefore, don't bet. Credence and Action align perfectly.
  *   **No-News:** Says Credence = 1/2. If she used this credence directly in a standard expected utility calculation (ignoring the number of bets), she would take the bet. But she shouldn't.

  Does this embarrass No-News? No. It embarrasses the assumption that *Credence must directly dictate Betting Odds in self-locating scenarios*.

  The No-News proponent argues that Credence is about the state of the world (Heads vs. Tails), while Betting Odds must account for the *consequences* of the belief, which includes how many times the bet is instantiated. In this variant, the "Halfer" (No-News) can say: "I believe the coin is Heads with 50% probability, but I know that if it is Tails, I will be forced to make this bad bet thousands (or infinitely) of times. Therefore, I decline the bet."

  The Copy-Frequency proponent saves the betting behavior by corrupting the belief. They say: "I believe the coin is Tails with 100% probability." This is a lie about the world to save the math of the bet. The No-News principle preserves the truth about the world (the coin is fair) and handles the betting anomaly through decision theory (accounting for the stake multiplicity). It is better to have a correct belief with a complex decision rule than an incorrect belief with a simple one.

  ### 4. Bigger Picture: Frequencies vs. Credence

  Your final question asks if this shows self-locating credence shouldn't be identified with long-run frequencies of copies.

  The verdict is yes. This case demonstrates that **frequencies of observer-moments diverge from probabilities of world-states when expected observer counts are infinite.**

  The Copy-Frequency principle relies on a "Self-Sampling Assumption": you should reason as if you are a random sample from the set of all observers. In finite cases, this is a plausible heuristic. In this infinite variant, the set of Tails-observers is infinitely larger than the set of Heads-observers. If you sample randomly from an infinite set where one subset is countably infinite and the other is finite, the probability of landing in the finite set is zero.

  But Beauty isn't just a random sample from a void; she is a specific agent in a specific experimental protocol. The "frequency" of her awakenings is a feature of the *protocol*, not the *coin*. By letting the protocol's intensity (the number of awakenings) dictate the probability of the coin, Copy-Frequency allows the experimenter to manipulate Beauty's belief about the past simply by promising to wake her more times in the future.

  ### Verdict

  **The Copy-Frequency principle is embarrassed. The No-News principle survives.**

  The St. Petersburg variant acts as a *reductio ad absurdum* for Copy-Frequency. It forces the principle to violate the Principal Principle (assigning 0 credence to a known 1/2 chance event) and implies that an agent's belief about a past stochastic event is determined by the expected number of future observations.

  The No-News principle avoids these pitfalls. It accepts the counter-intuitive result that Credence (1/2) and Betting Behavior (act as if probability is 0) come apart. This separation is a feature, not a bug. It acknowledges that in self-locating scenarios with asymmetric stakes (one awakening vs. infinite awakenings), rational action cannot be derived from coin-credence alone; it must also weight the *consequences* of the world-state.

  Copy-Frequency tries to solve the betting problem by fixing the credence. No-News solves it by fixing the decision theory. In a case where the betting odds go to infinity, fixing the decision theory is the only way to preserve the sanity of the belief system. Beauty should believe the coin is fair, even if she bets as if it isn't. Copy-Frequency cannot allow her to believe the coin is fair. Therefore, Copy-Frequency fails.
