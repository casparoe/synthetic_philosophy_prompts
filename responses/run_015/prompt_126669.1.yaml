  # Thought Experiment Triage Key

  **Instructions:** Apply the probes in order. Stop at the first leaf that matches the case's behavior.

  ### **Node 1: Stipulation Audit**
  *List the case's explicit supposes. Does any single one assert the conclusion you are meant to draw?*
  *   **Yes** → **Leaf 1: Circular Setup**
  *   **No** → Go to Node 2.

  ### **Node 2: Flip Test**
  *Invert the surface features (names, order, imagery) while holding the structure fixed. Does your verdict flip with them?*
  *   **Yes** → **Leaf 2: Framing Effect**
  *   **No** → Go to Node 3.

  ### **Node 3: Possibility Test**
  *What has to be false or incoherent for the scenario to get off the ground? Is that impossibility required for the point?*
  *   **Incoherent & Essential** → **Leaf 3: Modal Overreach**
  *   **Incoherent & Incidental** → **Leaf 4: Broken Mechanics**
  *   **Coherent** → Go to Node 4.

  ### **Node 4: Fill-in Test**
  *Supply the causally or normatively relevant detail the description omits. Does the verdict change, and if so, is the missing detail arbitrary?*
  *   **Changes & Arbitrary** → **Leaf 5: Underdetermined**
  *   **Changes & Hidden** → **Leaf 6: Hidden Variable**
  *   **Stable** → Go to Node 5.

  ### **Node 5: Repetition Test**
  *Run the case many times over, or embed it in a sequence. Is the verdict stable, and if not, why does it shift?*
  *   **Unstable (Vagueness)** → **Leaf 7: Boundary Blur**
  *   **Unstable (Habituation)** → **Leaf 8: Intuition Fatigue**
  *   **Stable** → **Leaf 9: Robust**

  ---

  ### **Leaf Dispositions & Illustrations**

  1.  **Circular Setup** | **Retire.** The argument assumes what it proves, offering no independent leverage.
      *   *Illustration:* A case defining a "person" as "a being with rights" to prove persons have rights.
      *   *Confidence:* High.
  2.  **Framing Effect** | **Replace.** The intuition tracks rhetoric or emotion, not the theoretical structure.
      *   *Illustration:* Trolley switch vs. Footbridge push described with identical utilitarian calculus but different emotional loading.
      *   *Confidence:* High.
  3.  **Modal Overreach** | **Retire.** The point requires metaphysical impossibility, making it useless for actual-world theory.
      *   *Illustration:* Philosophical Zombies used to prove physicalism false.
      *   *Confidence:* Medium.
  4.  **Broken Mechanics** | **Repair.** The impossibility is incidental but breaks the causal chain; fix the physics, keep the point.
      *   *Illustration:* Time travel ethics where the paradox prevents the action, not the moral principle.
      *   *Confidence:* Medium.
  5.  **Underdetermined** | **Repair.** The case lacks sufficient detail to yield a verdict; specify the missing parameters.
      *   *Illustration:* Teletransportation case that fails to specify psychological continuity.
      *   *Confidence:* High.
  6.  **Hidden Variable** | **Replace.** The verdict tracks a detail the case hides, misleading the theorist about the cause.
      *   *Illustration:* Knowledge cases where 'luck' is the real driver, not justification structure.
      *   *Confidence:* Medium.
  7.  **Boundary Blur** | **Replace.** The distinction vanishes over iterations; use as an illustration of vagueness, not evidence.
      *   *Illustration:* Sorites paradox applied to moral status (conception to birth).
      *   *Confidence:* High.
  8.  **Intuition Fatigue** | **Replace.** Repetition numbs the moral response; the intuition is a resource, not a constant.
      *   *Illustration:* Repeated demands to save distant strangers (effective altruism burnout).
      *   *Confidence:* Medium.
  9.  **Robust** | **Keep.** The intuition holds across variations and isolates the target variable.
      *   *Illustration:* Standard Trolley (Switch).
      *   *Confidence:* High.

  ---

  ### **Methodological Notes**

  **Indistinguishable Pairs:**
  *   **Leaves 3 & 4 (Modal Overreach vs. Broken Mechanics):** The Possibility Probe identifies incoherence, but the "Essential vs. Incidental" distinction relies on theoretical judgment not strictly encoded in the probe. Treat this split as a hypothesis to be debated, not a mechanical finding.
  *   **Leaves 7 & 8 (Boundary Blur vs. Intuition Fatigue):** Both fail the Repetition Test. Distinguishing vagueness from habituation requires introspection on *why* the verdict shifted, which the probe flags but does not resolve.

  **Unoccupied Combinations:**
  *   **Gap:** *Fail Possibility (Essential) + Pass Fill-in.*
  *   **Reason:** **Incoherence.** If a scenario is essentially impossible, there are no coherent details to fill in; the path terminates at Node 3.
  *   **Gap:** *Fail Stipulation + Fail Flip.*
  *   **Reason:** **Neglect.** Circular cases are usually abstract; they rarely have enough surface texture to trigger a framing effect, though the tree permits it.

  **Specialist Disagreement:**
  *   **Branch:** **Node 3 (Possibility Test).**
  *   **Why:** Many specialists argue that metaphysical impossibility (Leaf 3) does not invalidate a thought experiment if it is conceptually coherent (e.g., Twin Earth). This tree treats metaphysical possibility as a requirement for evidence, a stance some modal rationalists will reject.

  **Confidence Key:** *High = Structural failure obvious to novices. Medium = Requires theoretical context to diagnose.*
