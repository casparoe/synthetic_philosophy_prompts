answer: |-
  **Setting:** *A university office, late evening. Whiteboards are covered in causal graphs and snippets of Python code. Two researchers, Elena and Marcus, are finishing a seminar on algorithmic accountability.*

  **Elena:** Let's go back to the climate pipeline case. You're dismissing the exclusion of the aerosol-forcing variable as a non-event. But look at the structural equations. If we treat the pipeline as a causal model, the variable $A$ (aerosol) is set to null not by random noise, but by a deterministic function in the feature-selection heuristic $H$. $H$ was trained on low-variance financial data, not climatic data. When $H$ runs, it actively suppresses $A$. The output $P$ (projection) is dangerously optimistic. If $A$ were present, $P$ changes drastically. That's a counterfactual dependency.

  **Marcus:** It's a counterfactual dependency, yes. But you're conflating dependency with causation. In a Humean framework, causation is about the succession of positive events. What actually happened? The code executed. The heuristic $H$ ran a filter. It assigned a weight of zero to $A$. That assignment is a positive event. The *absence* of $A$ in the final model is just a description of that positive assignment. To say the "omission caused the harm" is to reify the zero. It's metaphysically inflationary.

  **Elena:** It's not inflationary if the zero is structurally enforced. This isn't a case of a gardener forgetting to water a plant, where the "cause" is just the lack of water. Here, the system is engineered to *maintain* the lack. The upstream heuristic acts as a gatekeeper. In interventionist terms, if I intervene on the system to bypass $H$, $A$ enters the model and the harm is averted. The stability of that omission is maintained by the architecture. That's what I mean by "institutional omission." The design commitment from five years ago is exerting causal force today.

  **Marcus:** "Exerting causal force" is a metaphor. The design commitment exists now only insofar as the bits are stored on a server and the CPU is processing them. The cause of the optimistic projection is the *presence* of that legacy code running in the present. If you blame the omission, you diffuse the responsibility. You make it sound like the universe failed to provide aerosol data, rather than the engineers failed to update the heuristic. By focusing on the absence, you obscure the positive act of deploying an unpatched system.

  **Elena:** But that's exactly why the standard "positive act" view fails in distributed socio-technical systems. There is no single engineer present to "fail." The team that wrote $H$ is gone. The team maintaining the pipeline assumes $H$ is valid. The causality is embedded in the *relation* between the components, not just the components themselves. If we say only the execution of $H$ is the cause, we miss the specific causal pathway: the *exclusionary* pathway. We need to be able to say the system harmed the population *by ignoring* the aerosol variable. That "by ignoring" is causal.

  **Marcus:** You can say it linguistically. But ontologically, you're describing the same physical process. Let's be precise. If I claim omission is causation, I open the door to infinite causes. Why didn't the pipeline include a variable for solar flare intensity? Or volcanic activity? If every excluded variable is a cause of the error, then the model has ten thousand causes for every single output. That renders the concept of causation useless for attribution. We need a principle of salience. The positive act of deploying the heuristic is salient. The infinite set of non-included variables is not.

  **Elena:** Salience is context-dependent. In a climate context, aerosol forcing isn't just "one of many excluded variables." It's a known critical factor. The heuristic $H$ wasn't just passively not including it; it was designed to minimize variance by dropping outliers. In the financial domain, aerosols are noise. In the climate domain, they are signal. The heuristic is *maladapted*. The causation lies in the mismatch between the heuristic's exclusionary logic and the domain's requirements. That mismatch is an absence of fit. You can't map that mismatch to a single positive event without losing the systemic nature of the failure.

  **Marcus:** The mismatch is a positive state of affairs! It's the state of the code being $X$ when the world is $Y$. You don't need "omission" to explain that. You just need "misalignment." My worry is legal and moral. If we accept "institutional omission" as a causal category, we risk letting the actual actors off the hook. If the harm was caused by the "absence of the variable," then who is responsible for the absence? The ghost of the designer? The algorithm itself? A Humean view forces us to point to the people who signed off on the deployment. It keeps the chain of agency intact.

  **Elena:** But the chain of agency *is* broken. That's the reality of modern infrastructure. If we insist on a human agent at the moment of failure to validate causation, we can't account for autonomous drift. The system evolved. The data distribution shifted. The heuristic remained static. The "cause" of the failure is the *inertia* of the system. Inertia is the persistence of a state despite changing conditions. That persistence is often defined by what the system *does not do*—it does not update, it does not flag, it does not include. If we can't call that causal, we can't regulate it. We can't mandate "duties to include" if exclusion isn't a causal lever.

  **Marcus:** I agree we need to regulate it. I agree there's liability. I just dispute that we need to twist our metaphysics of causation to do it. We can say the engineers were negligent *because* they allowed the system to run without the variable. The negligence is the positive failure to audit. The omission in the code is just the mechanism of the negligence. When you elevate the omission to a primary cause, you risk treating the software as a moral agent. "The algorithm omitted the variable." No. The algorithm *processed* data according to rules. The *engineers* omitted the variable when they wrote the rules.

  **Elena:** Consider the counterfactual again. If the engineers had written the rules differently, but the variable was still dropped due to a database corruption, that's a different cause. Here, the rules *are* the dropping mechanism. The "institutional omission" is a specific type of structural causation where the absence is functionally equivalent to a negative input. Think of it like a circuit breaker. If the breaker trips, the absence of current causes the machine to stop. We don't say the "presence of the trip mechanism" caused the stop; we say the "loss of power" caused it. In high-dimensional algorithmic spaces, the "loss of information" via feature selection is functionally identical to a negative input.

  **Marcus:** A circuit breaker tripping is a positive mechanical event. A switch opens. Electrons stop flowing. That's physical. You're trying to equate "feature selection dropping a column" with "switch opening." But in the code, the column isn't "dropped" in a physical sense; it's just never referenced. It's a null pointer. You're trying to make the null pointer the agent. I'm saying the function calling the null pointer is the agent. If we treat structural absence as causation, we lose the ability to distinguish between a system that is broken and a system that is simply incomplete. Every model is incomplete. Is every missing variable a cause of every error?

  **Elena:** No, only the ones where there was a normative and technical expectation of inclusion. That's why the "institutional" part matters. The institution established a standard for climate modeling that includes aerosol forcing. The pipeline violated that standard via the heuristic. The violation is an omission relative to the institutional standard. It's not just "missing"; it's "missing relative to a requirement." That normative gap creates the causal relevance. The counterfactual isn't "if the variable existed in the universe," it's "if the system adhered to the institutional standard of inclusion."

  **Marcus:** Now we're mixing normativity with metaphysics. You're saying the cause is the violation of a standard. That's a legal conclusion, not a scientific one. I can accept that for liability. I can't accept it for causal ontology. If I'm debugging the system, I don't look for the "absence." I look for the line of code that filtered the data. I fix the line. I don't "fill the absence." I change the positive instruction. Why should our philosophy of science differ from our debugging practice?

  **Elena:** Because debugging fixes the symptom, but causal analysis prevents the recurrence. If I fix the line, I've addressed the positive act. But if I don't recognize the *pattern* of institutional omission, the next pipeline will have a different heuristic that drops a different critical variable. The causal lesson isn't "fix line 405." The lesson is "feature-selection heuristics trained on non-climate data cause harm by exclusion." That generalization relies on treating the exclusion as the causal unit. If we reduce it all to positive code execution, we lose the generalization. We become blind to the risks of what isn't there.

  **Marcus:** I see the pragmatic value. I do. But I maintain it's a heuristic for inquiry, not a description of reality. The reality is electrons moving through logic gates. The "omission" is a story we tell to manage complexity. In this specific case, the story is useful. But we must admit it's a map, not the territory. If we start believing the absence is a force, we might start looking for ghosts in the machine. The harm was real. The projections were wrong. But the cause was the code that *was* there, not the code that *wasn't*.

  **Elena:** Then we agree on the remedy, if not the ontology. We audit the heuristic. We mandate variable inclusion standards. But I'll keep calling it causation by omission. Because in a socio-technical system, the structure *is* the territory. The absence of safety features in a bridge causes it to collapse, even if the collapse is physically explained by the presence of gravity and stress. The missing reinforcement is the cause. Why is code different?

  **Marcus:** Because a bridge is physical. Code is logic. But... fine. If "institutional omission" gets regulators to mandate the aerosol variable, I won't fight the terminology. I'll just insist that when the lawsuit comes, we name the engineers who deployed the heuristic, not the "absence" itself.

  **Elena:** Deal. But I'm writing the audit protocol. And it's going to track structural gaps, not just execution logs.

  **Marcus:** As long as you can trace those gaps back to a human decision to leave them there.

  **Elena:** In this system, Marcus, the decision was made five years ago. The gap is the only thing left that's real.

  **Marcus:** Then we're in deeper trouble than I thought.

  **Elena:** That's why the omission matters.
