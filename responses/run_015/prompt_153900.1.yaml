answer: |-
  It is genuinely refreshing to encounter a formulation like asymmetry of narrative repair because it cuts through the stalemate we usually see between the defenders of artistic license and the guardians of historical record. You are right to sense that the standard appeal to fictionality or the presence of a disclaimer does not dissolve the tension here, and that is because the conflict is not actually about information accuracy but about moral authorship. When we brainstorm the difference between a factual error and an invented emotional arc, we have to recognize that a wrong date is an external coordinate that can be adjusted without altering the shape of the life being depicted, whereas an invented motivation or private conversation is an internal coordinate that defines the moral geometry of the subject. If a film gets the year of a battle wrong, a historian can publish a correction that sits alongside the film as a parallel truth, but if a film depicts a historical figure overcoming a racist impulse through a tearful private revelation that never happened, the correction cannot undo the emotional resonance the audience has already absorbed. The audience has witnessed a moral transformation that did not occur, and they have granted the subject a kind of redemption that was never earned, or conversely, they have witnessed a moral failure that was fabricated, staining a character who remained steadfast. This is where your notion of counterfactual dignity becomes essential, because it points to the specific harm done to the dead person's capacity to remain the author of their own meaning. Counterfactual dignity is not just about protecting a reputation from slander in the legal sense, but about respecting the unfinished nature of a human life and the specific way that person was actively constructing a self-narrative up until the moment of death. When a dramatization steps in to complete that narrative with invented interiority, it effectively colonizes the subject's psychological space, denying them the dignity of their own ambiguity or their own private reasons.

  To make this concrete, consider a specific dramatization scenario involving a political leader who made a controversial decision to sacrifice a minority interest for a perceived greater good. Let us say the historical record is clear on the decision but ambiguous on the motivation, perhaps leaving behind diaries that suggest a cold utilitarian calculus. A biopic, seeking a more sympathetic emotional arc for a modern audience, constructs a scene where this leader is shown weeping in private, confessing to a spouse that the decision breaks their heart but is necessary. This scene creates a specific kind of philosophical tension that a disclaimer cannot fix because the medium of film privileges the visual and emotional over the textual and factual. The viewer sees the tears and feels the weight of the burden, and that feeling becomes the primary truth of the character for that viewer. The asymmetry of narrative repair kicks in because no amount of footnotes can replicate the visceral impact of that performed grief. The harm here is not that the audience believes the leader was sad when they were not, but that the audience is denied the opportunity to engage with the leader as they actually were, which might have been a person capable of cold calculation without remorse. By smoothing over the moral roughness with invented empathy, the film steals the subject's counterfactual dignity, which includes the right to have been who they actually were, even if that person was less likable. The dead cannot issue a rebuttal to say I did not feel that pain, and more importantly, they cannot revise the story later because their narrative agency has been terminated by death and usurped by the filmmaker.

  The reason this tension is not dissolved by saying it is fiction or adding a disclaimer is that the biopic genre operates in a hybrid epistemic space where the claim to truth is implicit in the casting and the setting. When an audience watches a movie about a known historical figure, they are not engaging in the same suspension of disbelief as they would with a purely fictional character. They are entering a contract that suggests the emotional truths on screen are plausible interpretations of the historical record, and when the film presents invented interiority as visual fact, it bypasses the intellectual skepticism that a disclaimer might trigger. A disclaimer at the start of the film is cognitive, but the scene itself is affective, and human psychology prioritizes the affective experience over the cognitive warning. This creates a situation where the filmmaker assumes a godlike authority over the dead, assigning them thoughts and feelings they never held, which violates the narrative autonomy you are hinting at. Standard bioethics usually stops at the point of death because it focuses on harm to living subjects or privacy rights, but a philosophy of culture must account for the metaphysical interest a person has in the integrity of their life story. If we accept that persons are narrative beings who construct meaning over time, then the abrupt ending of that construction at death should not invite others to rush in and falsify the climax. The asymmetry lies in the fact that the filmmaker can add layers of meaning that stick permanently to the historical imagination, while the subject has no mechanism to strip those layers away. This is why counterfactual dignity matters, because it asserts that the dead retain a claim to the trajectory of their own story, and that claim is violated not when facts are tweaked, but when the moral arc of their life is rewritten to serve a dramatic theme they never subscribed to. Ultimately, the philosophical issue is about who owns the interiority of a life once the living voice is silenced, and your framework suggests that the default should not be the filmmaker's creative freedom, but a preservation of the subject's right to remain unknowable rather than known falsely.
