answer: |-
  ### Private Brainstorming Notes

  *   **Base Case Structure:** Driver predicts based on passenger type; offer conditional on prediction; payment post-ride. (Keep - foundational setup).
  *   **Causal Inefficacy:** Payment cannot causally affect the offer once in town. (Keep - both camps concede this).
  *   **Disposition Value:** Being the type who pays yields the ride; being the type who doesn't yields no ride. (Keep - both camps concede this).
  *   **Act Cost:** Paying reduces utility compared to not paying *in that moment*. (Keep - both camps concede this).
  *   **Same Agent:** We are talking about one agent over time, not person-stages. (Keep - required constraint).
  *   **Amortization:** Dispositions must pay off over time, not just once. (Keep - required constraint).
  *   **Primary Locus:** Is rationality primarily of acts or dispositions? (Dispute - core theoretical divergence).
  *   **Act Verdict:** Is the act of paying rational or irrational? (Dispute - D says irrational, R says rational).
  *   **Advice Convergence:** Do both say "Pay" at the moment of decision? (Keep - likely yes, but justification differs).
  *   **Verbal Dispute Check:** Is "rational act" just shorthand for "act from rational disposition"? (Flag - Camp R rejects this; Camp D insists on it).
  *   **Self-Binding:** Is installing a device better than having a disposition? (Keep - tests causal vs evidential value).
  *   **Trace-Reader:** If driver reads past records only, does disposition matter? (Keep - tests if D collapses to reputation management).
  *   **Acquisition:** Can one choose to be disposed? (Keep - tests "ought implies can" for Camp D).
  *   **No-Predictor:** Does this apply to self-command without external observers? (Keep - tests generality of the theory).
  *   **Substantive vs Verbal:** If advice is identical, is the dispute merely semantic? (Flag - No, because it affects theory construction and edge cases).

  ***

  ### Joint Statement on Rationality, Disposition, and the Base Case

  **Part 1: Agreed Claims**

  1.  **Causal and Informational Structure:** In the Base Case, the driver's offer is causally prior to the passenger's payment. The driver's decision depends on a reliable prediction of the passenger's disposition, while the passenger's payment decision occurs after the ride is secured and cannot causally influence the driver's prior choice.
  2.  **Act Efficacy Concession:** Both camps agree that the act of paying, considered strictly in isolation as a cause of its own immediate consequences once the passenger is in town, reduces the passenger's utility compared to the act of not paying.
  3.  **Disposition Benefit:** Both camps agree that the passenger is strictly better off being the sort of person who is disposed to pay than being the sort of person who is disposed not to pay, as only the former receives the ride.
  4.  **Identity of Agent:** Both camps address the same single agent persisting through time. We are not modeling the pre-ride passenger and the in-town passenger as distinct agents with conflicting interests, but as one agent facing a temporal consistency problem.
  5.  **Ex Ante Recommendation:** Both camps recommend that the agent, before encountering the driver, should take steps to ensure he becomes the sort of person who pays upon arrival.
  6.  **Instrumental Scope:** This debate concerns instrumental rationality (how best to achieve one's aims) rather than moral obligation. The "ought" in question is hypothetical: if you want the ride and to keep your money, what should you do or be?
  7.  **Predictor Reliability:** The analysis assumes the driver is a reliable reader of character or evidence. If the driver were guessing randomly, the disposition to pay would confer no advantage, and neither camp would recommend it.
  8.  **No Backward Causation:** Both camps deny that the passenger's payment causally influences the past. The correlation between payment and receiving the ride is explained by the driver's prediction tracking the passenger's stable traits or policies.
  9.  **Normative Force:** Both camps claim their verdicts are normative. They are not merely describing what agents do, but prescribing what agents should do or be to count as rational.
  10. **The Amortization Condition:** A disposition counts as rational only if the gains it secures across the range of occasions on which it operates exceed what it costs to have and to exercise, so that a disposition exercised exactly once and never again is not automatically vindicated.
  11. **Deception Inefficacy:** Both camps agree that attempting to deceive the driver (appearing disposed to pay while intending not to) is not a viable solution if the driver can detect deception with the same reliability as she detects genuine disposition.
  12. **Systematic Success:** Both camps agree that a theory of rationality should not recommend strategies that systematically leave agents worse off than available alternatives over the long run.

  **Part 2: Residual Disagreements**

  | Issue | Camp D (Disposition-First) Formulation | Camp R (Decision-Theory-Revision) Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Primary Locus of Rationality** | Rationality is fundamentally a property of standing dispositions, traits, or characters. Acts are rational only derivatively, by flowing from a rational disposition. | Rationality is fundamentally a property of acts selected by a choice rule. Dispositions are rational only derivatively, as tools for generating rational acts. | Substantive. This determines whether we model agents as optimizers of traits or optimizers of choices. |
  | **Verdict on the Act of Paying** | The act of paying is irrational *qua* act, because it fails to maximize utility given the situation at the time of action. It is required only because it flows from a rational disposition. | The act of paying is rational *qua* act, because the correct choice rule (accounting for evidential links) ranks it higher than not paying. | Substantive. This affects how we classify acts in edge cases where disposition and act utility diverge sharply. |
  | **Explanation of Requirement** | The passenger should pay because he *is* the sort of person who pays. The requirement stems from identity consistency with a valuable trait. | The passenger should pay because paying *maximizes expected utility* under the correct decision rule. The requirement stems from outcome optimization. | Verbal. Diagnosis: Both prescribe the same act; the disagreement is solely on the label "rational" applied to the act itself. |
  | **Role of Prediction** | The driver's prediction reveals the agent's nature. The value lies in *having* the nature, regardless of whether it is observed in this specific instance. | The driver's prediction creates an evidential link. The value lies in the *correlation* between the act and the offer. | Substantive. This leads to divergent predictions in cases where the link is broken (see Part 3). |

  **Part 3: Crux Table**

  | Crux / Sub-Question | Test Case or Variation | Camp D Prediction | Camp R Prediction |
  | :--- | :--- | :--- | :--- |
  | **The Trace-Reader Variant** | The driver cannot read current disposition but predicts based on accumulated behavioral traces of past behavior. | **Prediction:** Recommendation holds only if the disposition causes the traces. If traces are independent of current disposition, Camp D admits the disposition loses value. Camp D's story risks collapsing into reputation management. | **Prediction:** Recommendation holds regardless. The act of paying provides evidence relevant to the traces record. The evidential link sustains the rationality of paying even without direct disposition reading. |
  | **The Costly-Self-Binding Variant** | Passenger can install a device preventing non-payment at a cost lower than the fare. Driver observes installation. | **Prediction:** This is inferior to genuine disposition. Binding is a substitute only when disposition acquisition fails. It confirms that the act itself is not naturally rational. | **Prediction:** This is the paradigmatic solution. It makes the act of paying causally effective (by removing the option not to). It shows the Base Case is just an imperfect binding scenario. |
  | **The Serial-Rider Variant** | Passenger faces the structure many times; drivers read the record of previous occasions. | **Prediction:** Validates the Amortization Condition. The disposition is vindicated by the sum of rides gained over the series, outweighing the costs of individual payments. | **Prediction:** Validates Iterated Decision Theory. The rule "pay" is vindicated by the sum of utilities. Disposition is unnecessary if the rule is followed strategically. |
  | **The Advice Test** | What is said to the passenger *in town* at the moment of decision? | **Advice:** "Pay, because you are the sort of person who pays, and betraying your nature is worse than the cost." Acknowledges the act is locally costly. | **Advice:** "Pay, because paying is the rational choice given the evidence." Denies the act is locally costly under the correct description. |
  | **The Clean-Acquisition Question** | By what route does a non-payer become a payer? Is there an irrational step involved? | **Prediction:** Requires a path that does not itself violate rationality. If no rational path exists, Camp D must concede the agent "ought" to be something he cannot become, violating "ought implies can." | **Prediction:** Requires only adopting a rule. If the agent can commit to the rule, acquisition is possible. If not, the agent is simply irrational, with no paradox. |
  | **The No-Predictor Question** | Cases with no external reader (e.g., self-command, emotional commitment to threats). | **Prediction:** The structure holds. Dispositions are valuable internally for self-command even without external prediction. | **Prediction:** The structure fails without an evidential link. Without a predictor, paying/keeping threats is strictly irrational unless it causally aids future selves. |

  **Part 4: Closing Statement**

  We, the undersigned representatives of Camp D and Camp R, acknowledge that while we agree on the practical recommendation in the Base Case (acquire the disposition and pay the fare), we disagree on the theoretical explanation of why this is so.

  **Camp D** would count it as a genuine embarrassment if it were demonstrated that dispositions cannot be cultivated voluntarily, or if the "Amortization Condition" fails to vindicate the disposition in a long-run series where individual acts are consistently utility-reducing. Their view relies on the agent's ability to shape their character as a rational project.

  **Camp R** would count it as a genuine embarrassment if their revised choice rule recommended acts that clearly reduced utility in cases where no evidential link existed (e.g., where the predictor is known to be unrelated to the agent's choice). Their view relies on the stability of the evidential connection between act and outcome.

  **Further Development:**
  We agree that the debate will not be moved by restating the definitions of rationality. The one development that would actually move the debate is a **formal comparative model of long-term utility** in variable environments. Specifically, we need a model that pits a "Disposition-First" agent against a "Rule-Revision" agent in a world where predictors vary in reliability and where opportunities for self-binding exist. If one strategy strictly dominates the other in expected utility across these variable conditions, the losing camp must revise its account of what rationality prescribes.

  Signed,

  *Rapporteur for Camp D (Disposition-First)*
  *Rapporteur for Camp R (Decision-Theory-Revision)*
