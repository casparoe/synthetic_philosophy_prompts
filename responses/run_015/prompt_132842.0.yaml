  4. I then ran the same routine on a three-player example — three firms each picking one of two platforms, no communication between them — and wrote in the solutions that the surviving strategies are exactly the ones compatable with common belief in rationality.
  5. When the strict version leaves too much standing, I also bin weakly dominated strategies and don't fuss about the order there either, e.g. I'm happy to delete down to the bottom in traveller's-dilemma-style games.

  Which pairs genuinely clash, which only look like they do, and what's the cheapest fix each time? Rank the tensions by severity rather than flagging all of them as equally bad, and if one of my case verdicts (the 3x3, or the three-firm thing) isn't actually delivered by what I say elsewhere, say so plainly and tell me which commitment has to go.
