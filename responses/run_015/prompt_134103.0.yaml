answer: |-
  Three candidate mechanisms: (1) **Complementary Fit**, where merit depends on filling team gaps while desert tracks past output; (2) **Marginal Utility**, where merit tracks future value added and desert tracks past labor; (3) **Seniority Weighting**, where merit ignores tenure and desert rewards it. I reject Marginal Utility because it collapses merit into general welfare maximization rather than role-specific aims. I reject Seniority Weighting because it makes desert purely a function of institutional rules, violating the constraint against institutional-desert replies.

  **Scenario**
  A public health agency aims to maximize accurate disease reporting. Two candidates, M and D, apply for a Senior Analyst role. Both had equal access to training and rotations (opportunity) and exerted comparable effort over five years. D voluntarily chose high-volume rotations, processing 10,000 cases with 95% accuracy. M chose low-volume rotations, processing 2,000 cases with 99% accuracy. Both knew the selection rule in advance and neither altered behavior. The current team already includes three high-volume processors but lacks a dedicated accuracy auditor. D's total past contribution (cases processed) is higher. However, appointing D would duplicate existing capacity, whereas M's specific profile fills the critical accuracy gap. All parties agree on these facts.

  **Verdicts**
  The meritocratic standard selects M. Given the team's current composition, M's appointment best serves the agency's aim of accurate reporting by remedying the specific bottleneck. D's appointment would yield diminishing returns. The desert standard selects D. The fixed desert base is **Past Contribution** to institutional aims. D processed more cases than M through voluntary choice, not luck or talent disparity, thereby earning the position through prior service. Both verdicts retain intuitive pull: M is the smarter hire, but D seems owed the promotion.

  **The pool-swap test**
  This case relies on **Complementary Fit**, a structural feature relating the candidate to the existing team. To run the pool-swap test, imagine the existing team changes: suppose the three high-volume processors leave, replaced by three accuracy auditors. Holding M and D's intrinsic qualities fixed, the merit verdict flips to D, because D's high-volume capacity is now the scarce resource needed to serve the agency's aims. The desert verdict stays with D, because D's past contribution remains unchanged regardless of the current team's composition. This confirms merit is interaction-sensitive while desert is not.

  **Ablation**
  Remove the interaction feature by assuming the team has no specific gaps (a generic pool). Both candidates would then be evaluated on general predictive performance. Since D's past volume suggests higher aggregate output without sacrificing acceptable accuracy, the merit verdict converges on D. The desert verdict remains on D. The merit verdict moves from M to D; the desert verdict does not move. This shows the divergence in the main case depends entirely on the relational fit, not intrinsic superiority.

  **The best attack**
  The strongest objection targets the desert verdict: "The Purpose Reply." Why reward past contribution if doing so undermines the agency's aim of accurate reporting? Appointments are forward-looking tools, not backward-looking medals. To appoint D is to privilege the agent over the mission.
  *Reply:* This conflates the *justification of the role* with the *claims of the agent*. While the role exists for public health, the institution also generates obligations to those who sustained it. Ignoring D's contribution treats D as a mere means to current efficiency, violating a duty of reciprocity. The intuitive pull remains because we recognize institutions as cooperative ventures, not just aim-maximizing machines.

  **Honest note**
  There is a real disagreement here, not merely underspecification. One might argue "merit" should include desert, but the constraint fixes merit as "serving the aims of the role." One might argue "desert" is institutional, but the constraint fixes desert as "what they have actually done." The tension persists because we value both institutional efficacy and fairness to contributors. The case survives the Institutional-Desert Reply because D's contribution is real, not rule-stipulated. It survives the Mask Reply because no third value (like need) is invoked; it is strictly contribution versus fit. Transparency is satisfied as neither candidate adapted behavior. The conflict is genuine.
