prompt: |-
  i'm TAing a final-year philosophy of science seminar, 14 students, one 80-minute slot, and I've got the session on scientific realism and theory change. I want them to feel the pull of structural realism before I name it — the thought that when a theory gets overthrown we keep the equations and lose the furniture: the ethers and the calorics go, but the pattern of relations they were standing in survives into the successor theory, so maybe that pattern was all we ever should have believed in. But I also want them to feel the thing that makes me suspicious of it. If all a theory ultimately says is "there are some things, call them #1, #2, #3, standing in such-and-such relations, and everything we observe follows from that" — the theoretical names crossed out and replaced with blanks — then it looks like you can make it true with basically any old junk, as long as there's enough of it and you can arrange it to match the pattern: the pens in the room, four people's left shoes, some prime numbers. Last year I tried a version of this with a toy theory about three invisible magnets and it fell flat, mostly because I explained the point first and then asked them to do the exercise, which killed it.

  So: can you design the whole session for me — groups, materials (index cards and random junk, nothing that needs a projector), a timeline for the 80 minutes, and what exactly the facilitator says and doesn't say? My rough idea is that each group gets the "crossed-out" theory plus a pile of objects and has to build models that make it true, and then something turns on their noticing that they can do it again and again with completely different stuff, and that this is either the whole point or a disaster, without me having told them which. Two things I care about. First, the epistemological and the ontic versions shouldn't collapse into each other: "structure is all we can know" and "structure is all there is" have to come apart in the activity, and by the end students should be able to say which one the junk-model problem actually bites and which one it sort of doesn't. Second, I want a debrief that maps specific moments in the room onto specific claims, tells me what will predictably go wrong the first time I run it (I'm guessing someone builds a model with the wrong number of objects, and someone else says "well obviously the theory also says the things are physical / causal / in spacetime" and short-circuits the whole thing before anyone feels it), and is honest about what the game can't deliver — I suspect it can't show the continuity-across-theory-change argument that made structural realism attractive in the first place, since my little toy theory has no history, and it probably can't reproduce whatever makes the triviality worry bite for infinite domains rather than for four pens. Oh, and please don't put the words "structural realism" or "Ramsey" or "Newman" on any handout that goes out before the debrief, and no looking things up — just build it from what the setup already gives you.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a final-year philosophy of science seminar.
      *   **Audience:** 14 students (advanced undergraduates/graduates).
      *   **Time:** 80 minutes.
      *   **Topic:** Scientific Realism, Theory Change, Structural Realism (SR).
      *   **Goal:** Make students *feel* the pull of SR (equations stay, ontology goes) and *feel* the suspicion (Newman's Problem/triviality objection) *before* naming the concepts.
      *   **Constraint 1 (Pedagogy):** Do not explain the point first. Let the exercise drive the realization. Last year's "invisible magnets" failed because the TA explained too much.
      *   **Constraint 2 (Materials):** Index cards, random junk, no projector.
      *   **Constraint 3 (Philosophical Nuance):** Distinguish between Epistemic SR ("structure is all we can *know*") and Ontic SR ("structure is all there *is*"). The activity must show where the "triviality" objection bites (Epistemic) and where it might not (Ontic).
      *   **Constraint 4 (Debrief):** Map room moments to claims, predict failure modes (wrong number of objects, adding hidden constraints like "physical"), and admit limitations (no historical continuity, finite vs. infinite domains).
      *   **Constraint 5 (Handouts):** No forbidden words ("Structural Realism", "Ramsey", "Newman") before the debrief.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Pull:* Theory $T_1$ (e.g., Fresnel's ether) is replaced by $T_2$ (e.g., Maxwell's EM). The ontology (ether) is discarded, but the mathematical structure (wave equations) is retained. Conclusion: Believe in the structure, not the ontology.
      *   *The Push (Newman's Problem):* If a theory is just "There exist entities $x, y, z$ such that Relation $R(x,y,z)$ holds," then *any* collection of objects with enough cardinality can satisfy this, provided we define the relations appropriately. The theory becomes trivially true.
      *   *Epistemic vs. Ontic:*
          *   Epistemic SR: We can only *know* the structure. (Newman bites hard here: if structure is just mathematical relations, we can "know" it about anything, so it's not informative knowledge).
          *   Ontic SR: The world *is* structure. (Newman bites less hard or differently: if the world is *constituted* by relations, then the "junk" isn't a counterexample to reality, it's a category mistake about what constitutes the world).
      *   *The Activity:* Needs to simulate the "crossed-out theory" (Ramsey sentence style without the name). Students need to map abstract relations to concrete junk. They need to realize they can do this *too easily*.

  3.  **Drafting the Activity Design:**
      *   *Group Size:* 14 students. 3 groups of 4, 1 group of 2? Or 2 groups of 7? 3 groups of 4 + 1 group of 2 is awkward. 2 groups of 7 is good for discussion but maybe too big for hands-on. Let's aim for 3 groups (5, 5, 4).
      *   *Materials:* Envelopes with "Theory Cards" (abstract relations), piles of junk (pens, shoes, keys, coins, paperclips).
      *   *Phase 1: The Setup (10 mins).* Introduce the "Lost Theory." No context. Just abstract relations.
      *   *Phase 2: Modeling (25 mins).* Groups must make the theory true using the junk.
      *   *Phase 3: The Twist (15 mins).* Swap junk. Do it again. Realize it's too easy.
      *   *Phase 4: Debrief/Discussion (30 mins).* Connect to SR, Newman, Epistemic vs. Ontic.

      *Refining the "Theory":* It needs to be specific enough to feel like a theory but abstract enough to be mapped to anything.
      *   *Bad:* "A causes B." (Too vague).
      *   *Bad:* "3 magnets repel." (Too specific, led to failure last year).
      *   *Good:* A set of relational constraints. "There are 5 entities. Entity 1 bears relation R to Entity 2. Entity 2 bears relation R to Entity 3..." Or better, a structural diagram.
      *   *Decision:* Use a "Structure Sheet" with nodes and labeled edges (R1, R2) and a set of rules (e.g., R1 is asymmetric, R2 is transitive). This forces them to *interpret* the relations.

      *Refining the "Junk":* Needs to be diverse. Pens (linear), Keys (distinct), Coins (two-sided), People (complex).
      *   *Constraint:* The prompt mentions "crossed-out theory." I should give them a text that looks like a physical theory but with nouns redacted.
      *   *Example:* "There exist three [REDACTED]s. [REDACTED] A exerts [REDACTED] on [REDACTED] B."
      *   *Wait, better:* Give them the *Ramsey Sentence* form without calling it that. "There exist entities $x, y, z$ such that $R_1(x,y)$ and $R_2(y,z)$..."
      *   *Actually, let's make it more tactile.* Give them a "Law Sheet" that describes relations functionally but doesn't name the relata.
      *   *Revised Plan:*
          1.  Handout A: The "Formal Structure" (Nodes and Edges).
          2.  Handout B: The "Interpretation Constraints" (e.g., "Relation 1 must be observable," "Relation 2 must be asymmetric").
          3.  Pile of Junk.

      *Wait, the prompt wants them to feel the "Theory Change" pull first.*
      *   Okay, I need to hint that this structure survived a revolution.
      *   *Intro:* "Imagine this is the mathematical core of a theory from 1890. The nouns are gone. Your job is to see if this structure can describe the world in front of you."

      *Addressing Epistemic vs. Ontic:*
      *   In the debrief, I need to ask: "Did you discover the structure in the junk, or did you impose it?"
      *   If they imposed it -> Epistemic worry (Newman).
      *   If the junk *had* to have it -> Ontic possibility.

  4.  **Developing the Timeline:**
      *   0-10: Intro & Handouts.
      *   10-35: Modeling Phase 1 (Make it true).
      *   35-50: Modeling Phase 2 (Make it true with *different* junk).
      *   50-80: Debrief & Philosophical Mapping.

  5.  **Addressing the "Failure Modes":**
      *   *Student says:* "But the objects have to be physical!" -> *TA Response:* "The theory says 'entities'. Does 'physical' appear in the formal structure?"
      *   *Student says:* "We used 6 pens, theory says 5." -> *TA Response:* "Can you ignore one? Does the theory say 'only 5'?" (Good teaching moment about existential quantifiers).
      *   *Student says:* "This is trivial." -> *TA Response:* "Write that down. Why is it trivial?"

  6.  **Writing the Handouts:**
      *   Must be clean. No jargon.
      *   "Theory Fragment 1895."
      *   List of Relations (R1, R2, R3).
      *   List of Constraints (Asymmetric, Transitive, etc.).
      *   Task: "Find a model in the room."

  7.  **Drafting the Debrief Script:**
      *   Need to guide them from "We built a model" to "We could build *any* model" to "So what does the theory claim?"
      *   Distinguish Epistemic (We can't know the nouns) vs. Ontic (There are no nouns).
      *   Acknowledge limitations (Finite vs. Infinite, History).

  8.  **Review against Constraints:**
      *   No "Structural Realism"/"Ramsey"/"Newman" on handouts? Check.
      *   Distinguish Epistemic/Ontic? Check.
      *   Predict failure modes? Check.
      *   Timeline feasible? 80 mins is tight for 14 students. Need to keep groups focused.
      *   Materials? Index cards, junk. Check.

  9.  **Refining the "Pull" of SR:**
      *   The prompt says: "feel the pull... before I name it."
      *   How to do this in the activity?
      *   Maybe start with a brief story about Fresnel/Maxwell *before* the activity, but without using the word "Realism." Just "History of Science."
      *   "In 1890, physicists believed in the Ether. In 1905, they didn't. But the equations worked the same. Here are the equations (structure). Ignore the Ether."
      *   This sets up the "Structure survives" intuition.

  10. **Refining the "Push" (Newman):**
      *   The second round of modeling (different junk) is crucial.
      *   If they can map the structure to pens, then to shoes, then to people... the structure is detachable from the ontology.
      *   If it's detachable, does it tell us anything about the world?

  11. **Final Polish:**
      *   Make sure the TA instructions are explicit about *what not to say*.
      *   Ensure the distinction between Epistemic and Ontic is clear in the debrief notes.
      *   Check the group dynamics (14 students). 3 groups (5, 5, 4) works best.

      *(Self-Correction during drafting)*: I need to make sure the "Theory" isn't *too* easy. If it's just "A relates to B", it's trivial immediately. It needs enough complexity that finding a model feels like an achievement first, before realizing it's trivial.
      *   *Idea:* A specific graph structure. 5 nodes. Specific connections.
      *   *Constraint:* Relations must be "findable" in the junk.
      *   *Better:* Give them the *logic* of the relations, not just a map. "R1 is asymmetric." "R2 is transitive." This requires them to test the junk.
      *   *Actually, keep it simpler.* The point is the *mapping*, not the logic puzzle. Let's give them a specific structural diagram (a specific network) and ask them to instantiate it.
      *   *Wait, the Newman problem arises because *any* set of objects with the right cardinality can satisfy the structure.* So the structure should be defined purely extensionally.
      *   *Decision:* Handout gives a "Schema": 4 Entities. Relation A (asymmetric). Relation B (symmetric).
      *   Task 1: Instantiate with Junk Set 1.
      *   Task 2: Instantiate with Junk Set 2.
      *   Task 3: Instantiate with *People*.
      *   Realization: The schema doesn't constrain the *nature* of the entities, only the number and arrangement.

      *(Final check on Epistemic vs Ontic)*:
      *   Epistemic: "We can't know if it's pens or shoes." (Skepticism).
      *   Ontic: "It doesn't matter if it's pens or shoes, only the arrangement exists." (Metaphysics).
      *   The activity shows the *underdetermination* of ontology by structure. This supports Epistemic SR (we can't know the ontology) but threatens it via Newman (if structure is all we know, and structure is trivial, we know nothing). Ontic SR escapes by saying "There is no ontology to know, only structure."
      *   I need to make sure the debrief hits this distinction hard.

      *(Final check on "No Projector")*: All materials must be printable/handwritten.

      *(Final check on "TA Script")*: Needs to be natural, not robotic.

      Let's assemble the plan.

      *Structure of the Output:*
      1.  Session Overview.
      2.  Materials List.
      3.  Handout Content (Text to copy).
      4.  Minute-by-Minute Timeline.
      5.  TA Script & Facilitation Notes (The "What to say/Not say").
      6.  Debrief Guide (Mapping moments to philosophy).
      7.  Troubleshooting (Predicted failure modes).
      8.  Limitations (What the game can't do).

      *Wait, one nuance:* The prompt asks to distinguish Epistemic and Ontic *in the activity* if possible, or at least ensure they come apart in the debrief based on the activity.
      *   *Idea:* In Round 1, ask "What *are* these things?" (Ontology). In Round 2, ask "Does it matter?" (Epistemology).
      *   *Better:* In the debrief, ask: "Did the theory tell you what the objects *were*?" (Epistemic limit). "If the theory is true, does it matter what they *are*?" (Ontic claim).

      Okay, ready to write.
answer: |-
  # Session Plan: The Structure and the Junk
  **Course:** Philosophy of Science (Final Year Seminar)
  **Topic:** Scientific Realism, Theory Change, Structural Realism (Undisclosed)
  **Time:** 80 Minutes
  **Students:** 14
  **Materials:** No projector. Index cards, pens, envelopes, "junk" (see below).

  ## 1. Materials Prep
  **The "Junk" Piles (3 piles total):**
  *   **Pile A:** 10 pens, 5 paperclips, 3 coins.
  *   **Pile B:** 4 keys, 2 erasers, 6 sticky notes.
  *   **Pile C:** The students themselves (their shoes, watches, or just their seating arrangement).

  **Handout 1: "The 1895 Fragment" (14 copies)**
  *   *See text below.* Do not include the words "Structural Realism," "Ramsey," or "Newman."
  *   Print on plain paper. No letterhead.

  **Handout 2: "Model Report" (3 copies, one per group)**
  *   *See text below.*

  **Envelopes (3):**
  *   Each contains one copy of Handout 1 and one copy of Handout 2.

  ---

  ## 2. Handout Text (Copy/Paste)

  **Handout 1: The 1895 Fragment**
  > **Context:** This text is recovered from a physics textbook published in 1895. The specific nouns referring to physical entities have been redacted by a later editor who believed they were mistaken. The mathematical and logical relations remain.
  >
  > **The Schema:**
  > 1.  There exist exactly **four** distinct entities ($x_1, x_2, x_3, x_4$).
  > 2.  There is a relation **$R$** holding between some of these entities.
  > 3.  **Constraint 1:** $R$ is **asymmetric** (If $x_1 R x_2$, then it is *not* the case that $x_2 R x_1$).
  > 4.  **Constraint 2:** $R$ is **transitive** (If $x_1 R x_2$ and $x_2 R x_3$, then $x_1 R x_3$).
  > 5.  **Constraint 3:** Every entity bears $R$ to at least one other entity.
  > 6.  **Observation Claim:** Any phenomenon we observe in the laboratory can be derived from the arrangement of these four entities and relation $R$.
  >
  > **Your Task:**
  > Using the objects provided to you, construct a **Model**.
  > 1.  Select four objects to serve as $x_1, x_2, x_3, x_4$.
  > 2.  Define what relation $R$ *is* in terms of these objects (e.g., "is touching," "is heavier than," "is to the left of").
  > 3.  Verify that your definition satisfies Constraints 1, 2, and 3.
  > 4.  Record your Model on the Report Sheet.

  **Handout 2: Model Report**
  > **Group Number:** \_\_\_\_\_
  > **Round 1 Objects:** (List the 4 items chosen)
  > **Definition of Relation R:** (Describe the physical relation)
  > **Verification:** (Briefly note how you checked Asymmetry and Transitivity)
  >
  > **Round 2 Objects:** (List 4 *different* items)
  > **Definition of Relation R:**
  >
  > **Discussion Question:**
  > Does the "1895 Fragment" tell you what the objects *are*, or only how they are arranged? Explain.

  ---

  ## 3. Timeline & Script

  ### 00:00 – 00:10: Introduction & Grouping
  **Setup:** Arrange tables into 3 clusters. Place one Envelope and one "Junk Pile" (A, B, or C) at each.
  **TA Script:**
  "Welcome. Today we are doing history of science, but without the names. In the late 19th century, physicists had a theory that worked incredibly well. It predicted experiments perfectly. Then, the theory was overthrown. The main objects the theory talked about were declared non-existent. But the equations—the structure—were kept and used in the new theory.
  You have a fragment of that old theory in the envelope. The nouns are gone. Your job is not to guess the nouns. Your job is to see if you can make the text *true* using the junk on your table.
  You have 25 minutes for Round 1. Go."

  **TA Action:** Do not elaborate. Do not define "model." If asked "Does R have to be physical?", say: "The text says 'relation'. You decide." If asked "Can we use more than 4 objects?", say: "The text says 'There exist exactly four'. Can you ignore the rest of the pile?"

  ### 00:10 – 00:35: Round 1 (Construction)
  **Goal:** Students struggle slightly to find a relation that is both asymmetric and transitive among 4 items.
  *   *Common solution:* "Is shorter than," "Is heavier than," "Is inside."
  *   *Common error:* Using a symmetric relation like "is next to."
  **TA Action:** Circulate. If a group finishes early, ask: "Is this the *only* way to satisfy the text?" Do not confirm or deny. Just prompt.
  **Warning:** If a group says "This is impossible," check their logic. Usually, they are trying to force a specific physical interaction (like magnetism) rather than a logical relation (like ordering). Remind them: "You define what $R$ means."

  ### 00:35 – 00:50: Round 2 (The Swap)
  **TA Script:**
  "Stop. Keep your Report Sheet. Pass your Junk Pile to the group on your left. Take the new pile.
  You have 15 minutes. Construct a *new* Model that satisfies the exact same 1895 Fragment.
  **New Rule:** You cannot use the same *type* of relation definition if you can avoid it. If you used 'heavier than' last time, try to find a different physical relation."

  **Goal:** They will realize they can satisfy the text with keys, then with pens, then with people.
  **TA Action:** Listen for the moment of boredom or amusement. "Wait, I can just use 'is to the left of' again." "I can use anything."
  **Crucial Intervention:** If a student says, "But the theory is about *physics*, these are just pens," write that sentence on the board. Do not comment on it yet.

  ### 00:50 – 01:20: Debrief & Philosophical Mapping
  **Setup:** Bring everyone to a circle. Put the Board Script (below) on the whiteboard.

  **Board Script (Write this during Round 2):**
  1.  "The theory is about *physics*."
  2.  "We can make it true with *anything*."
  3.  "Structure survives; Ontology goes."
  4.  "Structure is all we *know*."
  5.  "Structure is all there *is*."

  **Phase 1: The Success (5 mins)**
  **TA:** "Did you succeed? Could you make the 1895 text true with the pens? With the keys?"
  **Students:** "Yes."
  **TA:** "Did the text force you to use specific objects?"
  **Students:** "No, just four of them."
  **TA:** "So, if the 1895 physicists said 'This theory is true,' and we can make it true with pens, keys, or shoes... did the theory tell them what the world is made of?"
  *(This targets **Epistemic Structural Realism**: The theory constrains the structure, not the nature of the relata.)*

  **Phase 2: The Worry (10 mins)**
  **TA:** "Look at sentence #1 on the board. Someone said 'The theory is about physics.' But look at sentence #2: 'We can make it true with anything.'
  If I can take this theory and apply it to the shoes in this room, does the theory actually rule anything out? If a theory is compatible with *any* four objects, is it informative?"
  *(This targets **Newman's Problem**: If structure is just mathematical relations, any collection of objects with the right cardinality satisfies it. The theory becomes trivial.)*

  **TA:** "Why did it feel like a 'physics' theory in 1895? What did they think they were adding that you didn't?"
  **Students:** "They thought it was ether." "They thought it was causal."
  **TA:** "Right. They thought the 'nouns' mattered. The text you had stripped the nouns. If you strip the nouns, do you lose the physics? Or do you keep the only part that was actually true?"
  *(This targets the **No Miracles / Continuity Argument**: The equations worked, so the structure must be real, even if the ether wasn't.)*

  **Phase 3: Epistemic vs. Ontic (10 mins)**
  **TA:** "Look at #4 and #5 on the board.
  #4: Structure is all we can *know*. (Maybe there are real nouns, but we can't touch them.)
  #5: Structure is all there *is*. (There are no nouns, only relations.)
  In the game, did you feel like there *were* hidden nouns you couldn't see? Or did it feel like the pens *just were* the nodes in the structure?"

  *   *If they say "Hidden nouns":* "That's the Epistemic view. But if we can't know the nouns, and the structure is trivial (Newman's point), do we know anything?"
  *   *If they say "No nouns":* "That's the Ontic view. If the world *is* the structure, then the 'triviality' isn't a bug. It doesn't matter if it's pens or electrons, as long as the relations hold."

  **TA:** "Which view protects science from the worry that 'it's all just junk'?"
  *(Guide them to see: Epistemic SR is vulnerable to Newman (triviality). Ontic SR tries to escape by saying the structure is physical/causal by nature, not just mathematical.)*

  **Phase 4: Naming (5 mins)**
  **TA:** "Okay, you've just reinvented a debate from the 1920s.
  The move of keeping the equations but dropping the nouns is called **Structural Realism**.
  The worry that 'any junk fits the structure' is called **Newman's Problem**.
  The text you worked from was a **Ramsey Sentence**—a way of writing a theory that says 'There exist some things...' without naming them.
  Next week, read [Insert Reading]. We will discuss whether Ontic SR actually solves Newman's problem, or just hides it."

  ---

  ## 4. Troubleshooting & Failure Modes

  **1. The "Physical Constraint" Short-Circuit**
  *   **Risk:** A student insists, "R has to be a causal force, not 'to the left of'."
  *   **Why:** They are importing external knowledge about what "physics" means.
  *   **Fix:** "The 1895 text doesn't say 'causal'. It says 'Relation'. If you add 'causal', you are adding a noun back in. Stick to the text."
  *   **Philosophical Payoff:** This is exactly the debate! The Structural Realist says "Don't add causal." The Critic says "Without causal, it's trivial." Let the tension sit until the debrief.

  **2. The "Wrong Cardinality" Error**
  *   **Risk:** A group uses 5 pens because there are 5 handy.
  *   **Fix:** "The text says 'Exactly four'. Can you designate one pen as 'not part of the theory'?"
  *   **Philosophical Payoff:** Highlights that the theory *does* constrain the world (cardinality), just not the *nature* of the world. This limits the triviality objection slightly (you need enough objects), which is a nuance for the debrief.

  **3. The "It's Too Easy" Realization**
  *   **Risk:** Students finish Round 1 in 5 minutes and disengage.
  *   **Fix:** "If it was that easy, write down *three other ways* you could have done it."
  *   **Philosophical Payoff:** This *is* the point. The ease is the Newman problem. Lean into it. "Why does it feel cheap?"

  **4. Collapsing Epistemic and Ontic**
  *   **Risk:** Students treat "We can't know the nouns" and "There are no nouns" as the same thing.
  *   **Fix:** In the debrief, ask: "In Round 1, did you think the pens *really were* the $x_1$ entities? Or were they just *standing in* for them?"
      *   *Standing in:* Epistemic (Pens are models of the unknown reality).
      *   *Really were:* Ontic (The structure is instantiated right here).

  ---

  ## 5. Limitations (For Your Eyes Only)
  *Be honest about these in the debrief if students press, or save for the lecture follow-up.*

  1.  **Finite vs. Infinite:** The game uses 4 objects. Newman's problem is devastating for infinite domains (any infinite set can satisfy any structure). With 4 pens, it's just a puzzle. Acknowledge: "In the real world, theories deal with continuous fields and infinite particles. The 'junk' problem gets much worse there."
  2.  **No History:** The game doesn't show *Theory 1* turning into *Theory 2*. It just shows *One Structure* fitting *Many Junk Piles*. You have to narrate the history (Fresnel/Maxwell) yourself in the intro. The game demonstrates the *logic* of SR, not the *historical evidence* for it.
  3.  **Causal Structure:** The game treats relations as logical (asymmetric/transitive). Real scientific structure is often causal. Ontic SR argues that causal relations *are* the structure. The game abstracts this away. Acknowledge: "We used 'to the left of'. Real science uses 'exerts force on'. Does that make the structure less trivial? Maybe."

  ## 6. TA Mindset Checklist
  *   [ ] **Don't Explain:** If they ask "What is the point?", say "I want to see what you can build."
  *   [ ] **Don't Validate:** If they ask "Is this right?", say "Does it satisfy the constraints?"
  *   [ ] **Watch the Clock:** Hard stop at 35 mins for Round 1. The realization needs to happen in Round 2.
  *   [ ] **Protect the Tension:** Do not resolve the "Is it trivial?" question until the final 10 minutes. Let them feel the unease.
