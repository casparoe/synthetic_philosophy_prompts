answer: |-
  The alarm isn't a siren; it's a soft, persistent chirp, like a bird trapped in the ventilation duct. Tank Four. Oxygen saturation dipping below the threshold. I swipe the screen to silence it, but the red icon pulses, a little heartbeat on the glass.

  It's 2:17 AM. The facility hums around me, the sound of water moving through pipes, pumps breathing in the basement. I stand over Tank Four, looking down into the greenish wash of the submersible lights. They're agitated. Usually, at this hour, they're settled in the substrate, legs tucked, conserving energy. Tonight, they're jerking through the water column, tails snapping, colliding with the acrylic walls.

  The software flags it as "Environmental Stress." It doesn't say who is stressed.

  I lean closer. My breath fogs the lid. Down there, a shrimp backs away from the inlet pipe. Its movement isn't smooth. The tail curls, a sharp hydraulic kick, but the front half lags a fraction of a second behind, as if the signal has to travel down a long wire and some of the connection is frayed. I watch a pair of walking legs twitch on the left side while the right side stays still. They don't seem to know what the other side is doing.

  If I log this, the system timestamps the drop. It flags a welfare anomaly. An auditor comes next week, sees the log, sees the pattern. The certification gets reviewed. If the certification goes, the contract goes. If the contract goes, Mara loses her job. Mara, who brings me half her sandwich every day because she says I look pale. Mara, who has a kid in daycare that costs more than this shift pays.

  I hover my finger over the *Clear* button.

  But looking at them, I can't tell where one ends and the other begins. Not between shrimp, but inside them. There's a heaviness in the water, a cloud of molted shells settling on the bottom like snow. I think about the broodstock shed, the place I'm not supposed to go but have seen through the open bay door. The females there, blinded so they'll put their energy into eggs instead of looking around. When the scissors snap, does the body feel it? Or does the pain stop at the cut, trapped in the eye stalk while the rest of the animal goes on working, a machine running without an operator?

  If the pain is local, if it stays in the segment where it happens, then there isn't one animal in this tank. There are thousands of small, thin things stacked together. A crowd of tiny sufferings wrapped in one shell. If I leave the oxygen low, I'm not hurting one creature; I'm hurting a hundred thousand committees. Each leg, each gill plate, each segment of the belly burning on its own private circuit.

  But if the wiring is broken, if the top doesn't know what the bottom feels, then maybe the bottom doesn't know it either. Maybe a nerve firing without a brain to catch it is just electricity. Like a lightning strike in an empty field. No one to hear the thunder.

  The shrimp near the surface bumps against the glass. Its eye stalks are fixed, black beads on swivels. It doesn't look at me. It can't. It scans. It filters. One of its feeding appendages stops moving while the others keep rhythm. It doesn't notice. It just drifts, bumping the wall again.

  I think about Mara's kid. I think about the rent. I think about the spreadsheet that counts biomass by weight, not by headcount. To the spreadsheet, a shrimp is a unit of protein. To the auditor, it's a sentient being. To me, right now, it's a question of wiring.

  If I log it, I save the crowd. If I clear it, I save the jobs. But I don't know if the crowd exists. I don't know if I'm protecting a multitude or managing a machine. The biology is the same either way. The water is low on oxygen. The hemolymph is moving slow. The cells are starving. Whether there's someone home to feel the starvation is the variable I can't solve.

  The chirp starts again. I silenced it, but the system resets the warning cycle.

  I look at my hand. It's one thing. Five fingers, one palm. If I burn my fingertip, my head knows. The signal goes up the ladder and someone answers. I try to imagine having a ladder where the rungs don't talk to each other. Where the foot burns and the head sleeps. Is that mercy? Or is it just a different kind of horror?

  The shrimp sinks. It doesn't swim down; it just stops fighting the density. It settles into the pile of shells. Another one takes its place, jerking, uncoordinated. The tank is full of them, a churning mass of segments and signals.

  I look at the screen. The cursor blinks over *Clear*.

  If I'm wrong about the wiring, if every segment is a witness, then this tank is a cathedral of pain. If I'm wrong about the unity, if they're just loose bags of chemistry, then I'm worrying about ghosts. The water doesn't care. The pumps don't care. The only thing that cares is the part of me that knows I have to press a button.

  I reach out. My finger hovers. The glass is cool under my other palm, vibrating with the flow of the water. I can feel the thrum of the pumps through the acrylic, a constant, low-frequency shiver. It travels up my wrist, into the elbow. It feels like a pulse, but it's mechanical.

  I press *Clear*. The red icon turns green. The chirp stops. The silence rushes back in, heavier than before.

  I leave my hand on the glass. Underneath, a single molted shell drifts past, caught in the current. It's perfectly whole, empty, transparent as cellophane. I watch it spin until it hits the corner and stops. I press my fingernail against the acrylic, right where the shell rests, feeling the vibration of the water pushing it back and forth, back and forth, against the wall.
