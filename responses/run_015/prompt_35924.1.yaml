          *   *Creolization:* Bickerton's Language Bioprogram Hypothesis is strong for innatism, but recent work shows creoles aren't as uniform as thought.
          *   *Specific Defeater:* **The "Logical Problem" vs. "Developmental Problem".** Even if the logic holds, do children actually go through the stages predicted? (e.g., do they *ever* make the linear error? Some studies say yes, briefly).

  4.  **Refining and Ranking:**
      *   *Fatal:* Nothing is truly "fatal" in social science, but the **Modeling Results** + **Corpus Cues** combined are the biggest threat because they attack the *necessity* of the innate claim.
      *   *Serious:* The retreat to vagueness (Minimalism).
      *   *Awkward:* Correction/Recasts and Cross-cultural input.

  5.  **Polishing the Tone:**
