  Second, the **asymmetry of power**. Constitutional control relies on Humean equilibrium: ambition counteracting ambition. This requires rough parity among branches. Your student contemplates an entity that outgrows all institutional capacity combined. There is no constitutional analogue for checking a god. Mixed government assumes all parties remain within the realm of human capability. If one branch acquires omnipotence, the constitution dissolves into dictatorship regardless of parchment barriers. The AI scenario posits a "branch" that can rewrite the constitution itself. In political theory, this is the state of nature returning; in AI safety, it is the baseline risk.

