  **The Translation**
  The **trusted weaker monitor** is bicameralism or judicial review: a slower, smaller body checking the potent executive. **Decoy tasks** resemble tests of fidelity: oaths of office or impeachment traps designed to reveal disloyalty under stress. **Staged privileges** mirror age and tenure requirements for magistracy, granting power only as reliability is proven. The **shutdown button** is the power of impeachment and removal. **Withheld capabilities** are enumerated powers: domains where the government is forbidden to tread, regardless of utility. **Alignment** corresponds to civic education and moral formation—the Republican hope that rulers will internalize the common good so constraints become redundant.

