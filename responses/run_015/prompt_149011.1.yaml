answer: |-
  # Session Plan: The Commitment Exchange

  **Topic:** The Normativity of Promising
  **Time:** 55 Minutes
  **Participants:** 14–18 High School Seniors
  **Materials:**
  *   40 Index Cards (20 Red, 20 Blue).
  *   10 Pens.
  *   A timer (phone is fine).
  *   A "Ledger" (sheet of paper for you to track points).
  *   Snacks for *next* week (announce that today's performance determines access).

  ---

  ## Part 1: The Activity (40 Minutes)

  ### 0:00–0:05 | Setup & Stakes
  **Script:** "Welcome. Today we are running a favor market. You will trade commitments for points. Points determine who gets first pick of snacks next week.
  There are two types of cards.
  **Blue Cards:** Write 'I intend to...'
  **Red Cards:** Write 'I promise to...'
  On every card, you must write:
  1.  **The Task:** Something small you can do by next week (e.g., 'Bring a cookie,' 'Save a seat,' 'Lend a pen').
  2.  **The Creditor:** The name of the person you are giving the card to.
  3.  **The Debtor:** Your name.

  **The Rule of Fulfillment:** Next week, if you hold a card that was fulfilled, you get 1 Point. If you hold a card that was *not* fulfilled:
  *   If it is **Blue**: Nothing happens.
  *   If it is **Red**: The Debtor loses 1 Point and must bring a snack for the club next week.
  *   *Note:* Do not discuss *why* the rules differ. Just accept them."

  *(Distribute 2 Red and 2 Blue cards to each student. Keep 5 Red/Blue spares.)*

  ### 0:05–0:20 | Round 1: The Market (Redundancy & Conflict)
  **Instruction:** "You have 10 minutes. Walk around. Trade cards. You want to end up holding cards you think will be fulfilled. You want to give out cards you are sure you can fulfill. You may keep a card for yourself (promise yourself something), but it's worth half points."

  **The Trap (Facilitator Note):**
  *   Encourage over-commitment. If someone looks hesitant, say, "You only need to fulfill what you sign."
  *   Watch for students signing more Red Cards than they can realistically fulfill (e.g., promising to bring 5 cookies when they can only bake 3).
  *   **Do not intervene** if they over-promise. Let the conflict sit.

  **Stop at 0:15.** "Freeze. Look at your hand. If you have promised more than you can do, you have a problem. You have 5 minutes to negotiate."

  **The Difficulty:** Students with conflicting Red Cards must choose who to disappoint. They will likely try to ask for **Release**.
  *   *Facilitator Rule:* "A Red Card can only be voided if the **Creditor** writes 'Released' on it and signs it."
  *   *Observation:* Watch the awkwardness of asking to be released. Watch the Creditor feel the power to say "No."

  ### 0:20–0:30 | Round 2: Special Cases (Assignment, Unowned, Contentless)
  **Instruction:** "We are introducing three special transactions. I need volunteers."

  **Case A: The Assignment Test (3 mins)**
  *   **Setup:** Student X holds a Red Card from Student Y.
  *   **Action:** X tries to give the card to Student Z. "I don't need this favor. Z does. Y, you now owe Z."
  *   **Rule:** "For a Red Card to change Creditor, the **Debtor (Y)** must initial the change."
  *   **Expected Friction:** X assumes they own the favor. Y might refuse ("I promised *you*, I don't know Z").
  *   **Goal:** Highlight that the obligation is personal, not just a transferable debt.

  **Case B: The Unowned Release (5 mins)**
  *   **Setup:** Student Y takes a Red Card and writes Creditor: **"The Club."** Task: "Bring 10 cookies."
  *   **Action:** Student X (a member of the club) says, "I release you. You don't have to bring them."
  *   **Rule:** "If the Creditor is 'The Club,' a single member cannot release. It requires a majority vote or the Facilitator's veto."
  *   **Facilitator Action:** Veto the release. "X is not 'The Club'."
  *   **Expected Friction:** Y is stuck. X feels powerless despite being a beneficiary. This isolates the "group" as a distinct entity.

  **Case C: The Contentless Promise (5 mins)**
  *   **Setup:** Student A gives Student B a Red Card. Task: "**Whatever you ask me to do next week.**"
  *   **Action:** B makes a request that is annoying but safe (e.g., "Stand in the corner for 1 minute during lunch," "Write 'I like broccoli' on your hand").
  *   **Rule:** "The Debtor must fulfill the request if it is safe and legal."
  *   **Expected Friction:** A feels vulnerable. B feels the weight of having authority without a specific script.

  ### 0:30–0:40 | Settlement & Collection
  **Instruction:** "Collect all cards. I will record who owes what. If you have a Red Card that is voided, hand it to me. If you have a Red Card that is active, keep it."
  *(This creates a physical record of the 'debt' that hangs over them until next week.)*

  **Script:** "Keep your cards. Next week, we redeem. Remember the rules: Broken Blue = Nothing. Broken Red = Penalty. Released Red = Nothing."

  ---

  ## Part 2: The Debrief (15 Minutes)

  **Facilitator Note:** Do not lecture. Ask questions. Use their frustration as data. Write three headers on the board: **1. The Agreement**, **2. The Harm**, **3. The Power**.

  ### 0:40–0:45 | Mapping the Redundancy Worry
  **Question:** "In Round 1, some of you wrote 'I intend' (Blue) and some wrote 'I promise' (Red). The rules treated them differently. But why? If I already intend to do it, what did the word 'promise' actually *do*?"
  *   **Theory 1 (Convention):** "It's just a code we agreed on."
      *   *Evidence:* The game rules worked because we all accepted them at the start.
      *   *Weakness:* If it's just a code, why did asking for release feel awkward? Why didn't Blue cards feel awkward to break?
  *   **Theory 2 (Expectations):** "It makes the other person count on you."
      *   *Evidence:* When someone broke a Red card, holders felt more cheated than with Blue.
      *   *Weakness:* What if I promise you something I know you *don't* care about? Does it still bind?
  *   **Theory 3 (Authority):** "You gave them a right to demand it."
      *   *Evidence:* In the Assignment Test, the Debtor could refuse the new Creditor. It wasn't just about the task; it was about *who* could claim it.

  ### 0:45–0:50 | Mapping Release & Group Promises
  **Question:** "In the 'Club Promise' case, one person tried to release the Debtor. I stopped it. Why did that feel right?"
  *   **Convention View:** "The rules said 'Majority Vote'." (Circular: why did we make that rule?)
  *   **Authority View:** "The promise was made to the *group*, so the group holds the power, not one person."
  *   **Discussion:** "When you asked to be released from a personal promise, did it feel like you were asking for a favor, or asking for a right?"
      *   *Point:* If it were just about harm, release should be easy. If it's about authority, the Creditor has to *give up* something (their claim).

  ### 0:50–0:55 | The Contentless Promise & Limits
  **Question:** "For the Blank Check promise: Did the Debtor feel they had less control than the Creditor?"
  *   **Discussion:** "If promising gives someone authority over you, is there a limit? What if they ask something terrible?"
  *   **Closing Thought:** "Next week, when you redeem these, notice: Does the penalty for breaking the Red card feel like a 'price' you pay, or like a 'punishment' you deserve? That difference is the whole puzzle."

  ---

  ## Part 3: Risk Assessment & Mitigation

  | Risk | Probability | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **Ironic/Joke Promises**<br>(e.g., "I promise to fly") | High | **Rule:** "Facilitator must approve all tasks for feasibility." If a task is impossible, reject the card at the start. Keep stakes low enough that joking isn't worth the penalty. |
  | **Refusal to Participate**<br>(Student opts out) | Medium | **Role:** Assign them the role of "Auditor." They watch for rule breaks and verify signatures. They get points for accuracy, not trading. Keeps them involved without forcing commitment. |
  | **Unkeepable Promises**<br>(Student promises 10 cookies, can't bake) | High | **Safety Valve:** Allow "Partial Fulfillment." If they bring 5 cookies, they lose only 0.5 points. This prevents total disengagement/shame. |
  | **Deflationary Move**<br>("It's just a game/feelings") | High | **Counter:** Acknowledge it. "Yes, it is a game. But the awkwardness you felt asking for release was real. Why did the game mechanics trigger real feelings? That's the philosophy." |
  | **Social Embarrassment**<br>(Public shaming for breaking) | Medium | **Privacy:** Penalties are paid to the *Facilitator* (snacks), not the individual. The Ledger is kept private. Only aggregate points are announced. |

  ---

  ## Part 4: Limitations (What You Must Say)

  This activity cannot solve the philosophical problem on its own. You must explicitly state these limitations in the final 2 minutes:

  1.  **The "Practice" Problem:** The game worked because *I* (the Facilitator) enforced the rules. In real life, there is no referee. The activity shows *that* promises bind, but it relies on an external authority to make them bind. It cannot fully show how they bind *without* a referee.
  2.  **The "Origin" Problem:** We started with the rules already in place. It doesn't show how the practice of promising started in the first place. (Did we all agree once? Or did it evolve?)
  3.  **The "Moral" Gap:** The game uses points and snacks. Real promises involve trust and relationships. The activity simulates the *structure* of obligation, but not the full *moral weight*. You must bridge this gap by asking: "If we played this with no snacks and no points, would the Red cards still feel heavier?"

  ---

  ## Facilitator Cheat Sheet (Theory Mapping)

  *Keep this hidden. Use it to guide the debrief.*

  | Moment in Activity | **Social Convention**<br>(It binds because we agreed) | **Expectation/Reliance**<br>(It binds because they get hurt) | **Normative Authority**<br>(It binds because you gave them power) |
  | :--- | :--- | :--- | :--- |
  | **Red vs. Blue Card** | **Best Evidence:** The rule was arbitrary. We could have swapped colors. | **Worst Fit:** What if I tell you "Don't count on me" but say "I promise"? | **Best Evidence:** The Red card changed the *status* of the task, not just the prediction. |
  | **Requesting Release** | **Worst Fit:** If it's just a convention, why is asking awkward? | **Best Evidence:** We release people to stop them from letting us down. | **Best Evidence:** The Creditor has the *power* to cancel the duty. |
  | **Assignment Test** | **Best Evidence:** We agreed transfers require consent. | **Worst Fit:** The new person expects the favor just as much. | **Best Evidence:** The obligation is *to a person*, not just *to do a thing*. |
  | **Club Promise** | **Worst Fit:** Conventions usually apply to individuals. | **Best Evidence:** The group relies on the cookies. | **Best Evidence:** No single person holds the "authority" to release. |

  ---

  ## Final Preparation Checklist
  1.  **Snacks:** Ensure you have a stash for next week to make the stakes visible.
  2.  **Cards:** Pre-write "Released" on a few spare cards to speed up Round 1 if needed.
  3.  **Tone:** Keep the game phase brisk and slightly bureaucratic. The drier the rules, the sharper the philosophical contrast in the debrief.
  4.  **Silence:** During the trading phase, do not explain *why* students are feeling stress. Let them sit in it.
