answer: |-
  ### Brainstorming: The Crux of the Distinction

  Before drafting the exam materials, we need to isolate the functional difference between Hume and Moore, as this is where students typically blur the lines.

  1.  **Hume's Is-Ought Problem (The Inferential Gap):**
      *   **Core Mechanism:** Logical Validity.
      *   **The Bite:** You cannot validly deduce a normative conclusion from purely descriptive premises. It's a syntactic error in the argument structure.
      *   **Practice:** In the climate scenario, Hume attacks the *arrow* between the stats and the obligation. Even if the stats are true, the conclusion doesn't follow without a bridge premise (e.g., "Suffering is bad").
      *   **Key Phrase:** "No valid deduction."

  2.  **Moore's Naturalistic Fallacy (The Definitional Error):**
      *   **Core Mechanism:** Semantic/Metaphysical Identity.
      *   **The Bite:** You cannot define "good" (a non-natural property) in terms of natural properties (like carbon levels, pleasure, survival). It's an error in meaning, not just inference.
      *   **Practice:** In the climate scenario, Moore attacks the *equivalence*. If the researcher claims "Reducing carbon *is* the good," Moore says you can always ask, "But is reducing carbon actually good?" (The Open Question Argument).
      *   **Key Phrase:** "No definition possible."

  3.  **The "Same Mistake" Debate:**
      *   Are they distinct? Hume is about *argument structure* (epistemology/logic); Moore is about *property identity* (metaphysics/semantics).
      *   Overlap: Both prevent reducing ethics to science.
      *   Distinction: You can accept Hume (logic gap) but reject Moore (maybe goodness *is* a natural property, we just can't deduce it simply). Or vice versa (rare).

  4.  **Reverse Derivation (Ought -> Is):**
      *   Hume's Law is asymmetric. "Is" does not imply "Ought."
      *   Does "Ought" imply "Is"? Often, yes. "I ought to do X" implies "X is possible" (Kant's "Ought implies Can"). Moral claims often entail existential facts (e.g., "Slavery is wrong" entails "Slaves are moral patients").
      *   **The Trap:** Students often assume the gap is symmetrical (neither implies the other). The sophisticated answer recognizes the asymmetry.

  ---

  ### Exam Question

  **Course:** PHI 405: Meta-Ethics and Moral Reasoning
  **Time Allowed:** 90 Minutes
  **Word Count Target:** ~700 Words

  **Question 1:**
  A prominent climate researcher publishes a paper claiming to have derived a direct moral obligation to reduce carbon emissions purely from atmospheric temperature statistics and economic cost-benefit models. She explicitly states there are zero hidden value premises in her derivation; the obligation is a direct function of the physical data.

  Diagnose the specific logical or semantic failure in this derivation. Does it collapse primarily due to Hume's Is-Ought problem, Moore's Naturalistic Fallacy, or both? Defend your classification by explaining whether these represent the same logical mistake wearing different hats or genuinely separate errors. Finally, engage with the concept of reverse derivation: if the move from *Is* to *Ought* is blocked, does the barrier work symmetrically to block an *Ought* from implying an *Is*? Use this symmetry test to refine your distinction between Hume and Moore.

  ---

  ### Model Answer

  The researcher's derivation fails on two distinct levels, corresponding to Hume's Is-Ought problem and Moore's Naturalistic Fallacy. While both arguments prohibit reducing ethics to empirical science, they target different structural components of moral reasoning. The derivation collapses primarily due to Hume's logical gap, but Moore's semantic objection reinforces the impossibility of the claim. These are not the same mistake; Hume identifies an inferential error, while Moore identifies a definitional error.

  Hume's objection targets the validity of the argument structure. He argues that a prescriptive conclusion (an "ought") cannot be logically deduced from purely descriptive premises (an "is") without a bridging normative premise. In the climate scenario, the temperature statistics and economic models are descriptive facts. Even if true, they do not logically entail a moral obligation unless one assumes a hidden premise, such as "economic stability is morally good" or "suffering ought to be prevented." The researcher's claim of "zero hidden value premises" makes the argument formally invalid. Hume's point is epistemic and logical: you cannot get normativity out of thin air, regardless of how robust the data is.

  Moore's objection, however, targets the metaphysics of moral properties. Through the Open Question Argument, Moore contends that "good" is a simple, non-natural property that cannot be defined by natural properties like carbon levels or economic utility. If the researcher claims that reducing carbon *is* the moral obligation (identifying the good with the natural fact), Moore argues this is a fallacy because it is always meaningful to ask, "I know reducing carbon lowers temperature, but is it *good*?" If the terms were identical, the question would be nonsensical (like asking "Is a bachelor an unmarried man?"). Moore's bite is semantic: the researcher isn't just making a bad inference; she is misidentifying the nature of moral value itself.

  Are these the same mistake? No. Hume allows that moral truths might exist alongside facts, but insists they cannot be *derived* without normative input. Moore argues moral truths are sui generis and cannot be *defined* by facts. One could theoretically accept Hume's logical gap (you need a bridge premise) while rejecting Moore's non-naturalism (the bridge premise could define good naturalistically). Therefore, they are separate errors: one of inference, one of identity.

  This distinction sharpens when applying the reverse derivation test. Hume's Law states *Is* does not imply *Ought*. Does the barrier work symmetrically? Can an *Ought* imply an *Is*? In many cases, yes. Moral claims often entail existential facts. For example, the statement "You ought to save the child" implies "The child exists" and "It is possible to save the child" (Kant's "Ought implies Can"). Here, the normative premise constrains the factual reality.

  If the barrier were symmetrical, moral claims would be entirely disconnected from reality, rendering them action-guiding impossible. The asymmetry reveals the specific nature of Hume's constraint: facts do not dictate values, but values must be grounded in feasible facts. Moore's fallacy does not share this asymmetry; it remains a block on definition regardless of direction. You cannot define "good" as "carbon reduction," nor can you define "carbon reduction" as "good" without losing empirical precision.

  In conclusion, the researcher's claim fails Hume's test because the inference is invalid without normative bridges, and it fails Moore's test because it conflates natural properties with moral value. They are distinct failures: Hume protects the autonomy of moral reasoning from factual determinism, while Moore protects the uniqueness of moral properties from naturalistic reduction. The asymmetry of reverse derivation confirms that while facts cannot generate obligations, obligations must respect factual constraints, a nuance Hume captures but Moore does not address.

  ---

  ### Marking Scheme (Total: 20 Points)

  **1. Correct Diagnosis of Hume (4 Points)**
  *   **Must Hit:** Identify that Hume targets the *logical validity* of the inference (descriptive premises cannot yield normative conclusions without a bridge).
  *   **Common Mess-up:** Students define Hume generally as "facts aren't values" without mentioning the *inferential gap* or validity of the argument structure.

  **2. Correct Diagnosis of Moore (4 Points)**
  *   **Must Hit:** Identify that Moore targets the *semantic definition* or identity of properties (Good cannot be defined as Natural) via the Open Question logic.
  *   **Common Mess-up:** Students treat Moore as just "another version of Hume" or confuse the Open Question Argument with simple skepticism.

  **3. Distinction Defense (Same vs. Separate) (4 Points)**
  *   **Must Hit:** Argue they are separate errors (Inference vs. Definition/Metaphysics) and explain why one could theoretically accept one but not the other.
  *   **Common Mess-up:** Claiming they are identical because both "stop science from doing ethics" without analyzing the mechanistic difference.

  **4. Reverse Derivation Engagement (4 Points)**
  *   **Must Hit:** Address the symmetry question. Argue that the barrier is *asymmetric* (Ought can imply Is, e.g., "Ought implies Can" or existential entailment).
  *   **Common Mess-up:** Assuming the gap is symmetrical (neither implies the other) or ignoring the prompt's requirement to discuss reverse derivation entirely.

  **5. Synthesis and Application (4 Points)**
  *   **Must Hit:** Apply the asymmetry back to the climate scenario (e.g., noting that while stats don't create obligations, obligations require feasible stats).
  *   **Common Mess-up:** Keeping the reverse derivation discussion abstract without linking it back to the researcher's claim or the Hume/Moore distinction.
