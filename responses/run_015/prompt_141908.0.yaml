answer: |-
  This procedure is a four-step sequential filter that isolates factual uncertainty, identifies impermissible constraints, distinguishes clean resolutions from those with moral residue, and defaults to surrogate valuation when ethical weighing yields no unique solution.

  ### The Decision Procedure

  **Step 1: The Uncertainty Check**
  *   **Question:** Is the disagreement driven by unknown medical facts (prognosis, efficacy) or unknown patient values (unclear directives, conflicting accounts of prior wishes)?
  *   **Sufficient Answer:** Yes, if further data collection or mediation could reasonably change the ethical landscape.
  *   **Stop Condition:** If **Yes**, stop. Do not recommend treatment.
  *   **Output (Box 2):** Write: *"Recommendation: Suspend definitive treatment decision. Priority is resolving uncertainty regarding [prognosis/patient wishes] via [specific test/mediation/family conference]."*
  *   **If No:** Proceed to Step 2.

  **Step 2: The Permissibility Check**
  *   **Question:** Are all available options morally prohibited (e.g., medically futile, harmful, illegal, or violating core rights)?
  *   **Sufficient Answer:** Yes, if every path violates a binding moral norm.
  *   **Stop Condition:** If **Yes**, stop. Do not recommend a specific action as "right."
  *   **Output (Box 4):** Write: *"Recommendation: No ethically permissible option exists. Any course of action involves unavoidable moral wrong; proceed with harm mitigation."*
  *   **If No:** Proceed to Step 3.

  **Step 3: The Weighing Check**
  *   **Question:** Do shared ethical principles (beneficence, autonomy, justice) clearly prioritize one option over the others?
  *   **Sufficient Answer:** Yes, if one option demonstrably better satisfies the agreed-upon principles without violating prohibitions.
  *   **Stop Condition:** If **No**, stop. This is a values conflict, not an ethics puzzle.
  *   **Output (Handoff):** Write: *"Recommendation: Ethical weighing yields no unique solution; options are morally equivalent. Decision rests with [legal surrogate/policy tie-breaker]."*
  *   **If Yes:** Proceed to Step 4.

  **Step 4: The Residue Check**
  *   **Question:** Does the preferred option violate a significant moral claim (e.g., overriding autonomy for safety, sacrificing one for many) that remains valid even though it is outweighed?
  *   **Sufficient Answer:** Yes, if a genuine duty is infringed, not just a preference frustrated.
  *   **Stop Condition:** If **Yes**, categorize as Box 3. If **No**, categorize as Box 1.
  *   **Output (Box 3):** Write: *"Recommendation: Proceed with [Option]. Acknowledge moral cost: [Specific Duty] is overridden but remains a valid claim requiring [apology/monitoring/compensation]."*
  *   **Output (Box 1):** Write: *"Recommendation: Proceed with [Option]."*

  ### Case Applications

  **(1) Two Patients, One Ventilator (Policy Tie)**
  *   **Step 1 (Uncertainty):** No. Scores are identical; facts are known.
  *   **Step 2 (Permissibility):** No. Withholding from one is permissible if justified; giving to both is impossible.
  *   **Step 3 (Weighing):** No. Justice and utility are deadlocked. The policy runs out here.
  *   **Result:** **Handoff.**
  *   **Chart Entry:** *"Recommendation: Ethical weighing yields no unique solution. Decision rests on institutional tie-breaker policy (e.g., randomization); if none exists, administration must establish one before allocation."*
  *   **Analysis:** If the hospital forces a choice without a tie-breaker, this shifts to **Box 4 (No Permissible Option)** because arbitrary selection violates justice. A tie-breaker like lottery does not resolve the moral conflict; it relocates it from "choosing who lives" to "accepting the rule." It proceduralizes the tragedy but does not erase the moral residue of the death.

  **(2) Comatose Man (Wife vs. Son)**
  *   **Step 1 (Uncertainty):** Yes. The conflict is about *what the patient wanted* (substituted judgment), not purely about values. Both surrogates claim epistemic access to the patient's will.
  *   **Result:** **Box 2 (Uncertainty).**
  *   **Chart Entry:** *"Recommendation: Suspend withdrawal/continuation decision. Priority is resolving uncertainty regarding patient's prior wishes via ethics-mediated family conference to assess credibility of oral directives."*
  *   **Analysis:** This is not yet a moral dilemma; it is an evidentiary problem. Deciding now privileges one witness over another without due process. If mediation fails and no legal hierarchy exists, it moves to **Handoff** (values conflict between surrogates) or **Box 4** if continuing care is futile.

  **(3) Ten-Year-Old Leukemia (Parents Disagree)**
  *   **Step 1 (Uncertainty):** No. Prognosis and options are medically defensible either way.
  *   **Step 2 (Permissibility):** No. Both continuing and stopping are within the zone of parental discretion.
  *   **Step 3 (Weighing):** No. There is no ethical principle that clearly overrides one parent's valuation of quality vs. quantity of life when both are reasonable.
  *   **Result:** **Handoff.**
  *   **Chart Entry:** *"Recommendation: Ethical weighing yields no unique solution. Both paths are medically and ethically permissible. Decision rests with parents; if consensus fails, legal adjudication is required, not ethics recommendation."*
  *   **Analysis:** Your suspicion is correct. This is not a tragedy the committee can solve; it is a family conflict within the zone of discretion. The procedure refuses to deflate the tragedy by pretending ethics can solve it; instead, it locates the agency where it belongs. The tragedy remains with the parents, not the committee. Treating this as a **Box 1** or **Box 3** problem arrogates authority the committee does not have.

  ### Misfires and Tie-Breakers

  **Where the Procedure Misfires**
  The procedure fails when "shared ethical principles" are not actually shared. If the committee contains a utilitarian and a deontologist, Step 3 (Weighing) will produce false negatives (Handoff) where one philosopher thinks the answer is clear. You must train the committee on a specific framework (e.g., Four Boxes method or Principlism) to ensure Step 3 functions. Additionally, Step 2 (Permissibility) risks becoming too rigid if "medically futile" is defined too broadly; ensure the threshold for "impermissible" is high (e.g., physiological impossibility vs. poor quality of life).

  **The Tie-Breaker Illusion**
  Be straight: a tie-breaker like first-come-first-served or lottery does not resolve the moral conflict of Box 4 cases; it merely sanitizes the selection process. It converts a moral wrong (arbitrary killing) into a procedural necessity (fair allocation). This is necessary for system function, but do not log it as **Box 1** (Clean Resolution). It must be logged as **Box 3** (Residue) or **Handoff**. If you log it as Box 1, you lie to the chart. The moral residue—the death of the equally deserving patient—remains even if the procedure was fair. The procedure forces you to document that residue rather than hiding it behind a policy tick-box.
