      *   **Tone:** Professional, analytical, critical, nuanced.

  2.  **Deconstruct the Qualified Position:**
      *   *Core Claim:* Antinatalist asymmetry (Benatar-style) is contingent on "narrative selfhood."
      *   *Implication 1:* Beings with narrative selves (adult humans?) are subject to the asymmetry (coming into existence is always a harm/risk).
      *   *Implication 2:* Beings without narrative selves (embryos, AI, maybe infants/animals) are *not* subject to the asymmetry in the same way. The asymmetry might collapse (presence of pleasure counts equally to absence of pain) or reverse (coming into existence might be neutral or even good if pleasure outweighs pain, because there's no "subject" to miss out).
      *   *Underlying Metaphysics:* Personal identity matters for harm/benefit assessment. Existence itself isn't the sole metric; the *quality* of existence (narrative structure) modulates the weight of presence vs. absence.

  3.  **Identify Conceptual Dependencies (Internal Monologue/Planning):**
      *   *Harm Theory:* What is harm? Is it setback to interests? Frustration of desires? Phenomenal suffering? If harm requires a subject to experience it, does non-existence harm anyone? Benatar says absence of pain is good even if no one is there to enjoy that good. This qualified view says that "good" depends on the *type* of being.
      *   *Personal Identity:* What is a "narrative self"? Is it psychological continuity? Autobiographical memory? If it's gradual, where is the cutoff?
      *   *Population Ethics:* Total view vs. Critical Level vs. Negative Utilitarianism. The asymmetry is usually a shield against the Repugnant Conclusion or Procreative Beneficence. If we limit it to narrative selves, do we open the door to creating lots of non-narrative beings for net pleasure?
      *   *AI/Embryos:* Why treat them differently? If an AI feels pain but has no story, does the pain count? If yes, why does the asymmetry collapse? If the asymmetry collapses, does creating a happy AI become obligatory?

  4.  **Rank Potential Defeaters:**
