  ### The Case: The Duplicate Intake

  **Scenario**
  Dr. Aris is the Shift Supervisor at a biological containment facility. Her job is to track specimens using the facility's Automated Intake System. One morning, a specific rhesus monkey enters the lock. Due to a sensor glitch, the Intake System registers the monkey twice in rapid succession, generating two distinct ID codes: "Subject-88" and "Subject-89". Both codes are produced by the same machine, via the same algorithm, during the same processing cycle. Aris knows the complete history: she knows both IDs were generated by the Intake System during the 0800 cycle. She does not know, and the system log does not display, which specific sensor trigger generated which code; to her, both names share the exact same origin story: "Designated by the Intake System during the 0800 cycle." She articulates no descriptive difference between them other than the labels themselves.

  For three weeks, Aris maintains two distinct digital files. She makes true singular claims using each name: she logs "Subject-88 requires feeding" (true) and "Subject-89 exhibits agitation" (true). She believes she is tracking two distinct monkeys because the system maintains two active files. The identity statement "Subject-88 is Subject-89" is not trivial to her; it requires an empirical discovery. During a physical inventory count, she enters the cage and realizes there is only one monkey wearing both RFID tags. Upon this discovery, "Subject-88 is Subject-88" remains trivial and a priori, while "Subject-88 is Subject-89" becomes an informative empirical truth she accepts.

  **Walkthrough**

  **Fregean Sense**
  A Fregean is forced to assign a sense to each name that differs despite the identical descriptive origin ("Designated by the Intake System"). The only available difference is metalinguistic: the sense of "Subject-88" becomes "The object designated by the Intake System under the label 'Subject-88'," and similarly for "Subject-89." This sense *is* available to her, as she knows the labels. This preserves the triviality of self-identity ("The object designated... under 'Subject-88'" is trivially identical to itself) while explaining the informativeness of the cross-identity (discovering that the object labeled '88' is the object labeled '89'). However, this risks making the sense parasitic on the name itself. If the sense is just "The bearer of 'N'", the Fregean account threatens to collapse into a claim about words rather than modes of presentation of the object.

  **Direct Reference**
  A direct-reference theorist claims Aris learned nothing semantic; the proposition expressed by "Subject-88 is Subject-89" is <Monkey, Identity, Monkey>, identical to "Subject-88 is Subject-88." The informativeness is entirely psychological, not semantic. It lies in the updating of her cognitive system: she must merge two distinct "mental files" or dossiers that were previously kept separate. The semantic content was constant throughout; what changed was her epistemic access to the fact that the two files tracked one object. This keeps semantics clean but outsources the puzzle to psychology.

  **Mental Files**
  Using the mental files idea is a claim about her *mind*, not the language. It concedes the cognitive point to Frege (there are two distinct ways of thinking about the object) while denying the semantic point (there are not two distinct senses constituting the proposition). If one argues that the files *constitute* the sense, one concedes the point to Frege by individuating sense finely enough to match cognitive significance. If one argues the files are merely psychological vehicles for the same singular proposition, one remains a Millian. The case forces this distinction: the files were distinct despite identical descriptive content, suggesting the distinction is non-descriptive.

  **The Single Feature**
  The feature doing all the work is the **indistinguishability of the token naming events**. Aris knows the *type* of origin (Intake System, 0800 cycle) is identical, and she lacks access to the *token* distinction (e.g., "the first scan" vs. "the second scan"). If you delete this feature—say, by giving her access to a log showing "Subject-88 generated at 08:01:01" and "Subject-89 generated at 08:01:05"—the case collapses into a bog-standard identity with a descriptive difference ("The one scanned at t1" vs. "The one scanned at t2"). The puzzle only exists because the causal history is semantically opaque to her, leaving only the labels to distinguish the senses.

  **Best Fregean Objection**
  The strongest objection is the **Competence Constraint**. A Fregean would argue that if Aris cannot articulate any difference in the naming events other than the labels themselves, she does not actually possess two distinct *senses* of the object, only two distinct *words*. To be a competent user of two names for what she takes to be two objects, she must believe there were two distinct baptismal events. If she believes there were two events, she *must* have some descriptive way of individuating them in her mind (e.g., "the event that produced '88'"), even if she can't articulate it externally. If she has that description, Constraint 1 is violated (there is a descriptive difference). If she doesn't, she isn't truly thinking of two objects, merely using two words for one object without understanding why. Thus, the case either smuggles in a descriptive difference or fails to generate two genuine senses.
