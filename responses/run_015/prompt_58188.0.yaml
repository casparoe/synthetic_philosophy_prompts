      *   *Thesis:* Anti-neutrality claim. The line between preference and bias is normative, not descriptive.
      *   *Behavioral Economist:* Believes preferences can be revealed and welfare defined by satisfaction. Nudges help people get what they *really* want (debiasing). *Threat:* Claims the thesis undermines the scientific basis of welfare economics and makes nudging impossible or dishonest.
      *   *Kantian:* Autonomy is key. Bias interferes with rational will. *Threat:* If bias correction is just another moral imposition, does this undermine the possibility of true autonomy? Or does it collapse the distinction between heteronomy and autonomy?
      *   *Feminist:* Adaptive preferences (wanting what oppression dictates). *Threat:* Might agree with the thesis but worry it leads to paralysis. If we can't distinguish bias without moralizing, how do we help the oppressed without imposing external values?
