          4.  Clinical Ethics Chair (Practical Guidance, Surrogates, Policy).
      *   **Deliverables:** 7-8 objections (ordered by likelihood/damage), phrased in examiner's vocabulary. For each: 2-minute reply, concessions/hold firm, vulnerability note. Plus, one "Doomsday Question" (most difficult to answer).

