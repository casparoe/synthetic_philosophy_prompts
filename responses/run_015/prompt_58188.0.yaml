answer: |-
  # Doctoral Defense Preparation Sheet
  **Thesis Title:** [Insert Title]
  **Core Claim:** Distinguishing "preference" from "bias" in morally loaded contexts is never morally neutral; it presupposes substantive moral judgments about legitimate influences.
  **Proposal:** Interveners must explicitly state the moral premise licensing the classification of an influence as a bias.

  ---

  ## Part I: Likely Objections & Prepared Replies

  ### 1. The Welfare Incoherence Objection (Behavioral Economist)
  **Objection:** "Your thesis threatens the scientific basis of welfare economics. If we cannot distinguish bias from preference without moralizing, we cannot measure welfare objectively. Libertarian paternalism works because we assume 'debiasing' helps agents achieve *their own* ends, not ours. If you claim this distinction is merely a moral mask, you render nudging either impossible or dishonestly manipulative. Are you arguing we should abandon welfare-improving policy because we can't achieve moral neutrality?"

  **Reply (2 mins):**
  "I am not arguing we should abandon policy, but that we must abandon the *pretense* of neutrality. Revealed preference theory assumes choices map to welfare, but my caregiver case shows choices often map to moralized norms (e.g., self-sacrifice). When a nudge corrects 'status quo bias' in hospital defaults, it isn't merely fixing a cognitive glitch; it is prioritizing autonomy-over-tradition or life-extension-over-burden.
  **Concede:** I agree this makes welfare measurement messier. We lose the clean metric of 'satisfaction of revealed preference.'
  **Hold Firm:** I hold that pretending these choices are technically neutral is more dangerous than admitting they are normative. Honesty about the moral premise (e.g., 'we prioritize life-extension') allows for democratic scrutiny, whereas 'debiasing' hides the value judgment behind a scientific veil.
  **Vulnerability:** This reply risks sounding like I am advocating for policy paralysis. I must emphasize that *transparent* paternalism is still functional policy, just politically accountable."

  ### 2. The Rationality/Morality Distinction Objection (Kantian Ethicist)
  **Objection:** "You conflate practical rationality with substantive morality. Kantian autonomy relies on the distinction between acting on inclination (bias) and acting on rational law. Correcting for time-pressure bias in your hiring manager case isn't a moral imposition; it is restoring the conditions for rational self-legislation. If you claim correcting logical inconsistency or informational deficits is 'moralizing,' you collapse the distinction between rationality and morality, making autonomy incoherent."

  **Reply (2 mins):**
  "I acknowledge the distinction between logical consistency and moral ends. However, my thesis targets *which* influences count as illegitimate inclinations. In the hiring case, labeling the time-pressure reaction as 'bias' rather than 'intuition' presupposes that egalitarian outcomes outweigh efficiency.
  **Concede:** I concede that formal logical contradictions are distinct from moral values. If an agent contradicts themselves purely formally, that is a rational error.
  **Hold Firm:** I hold that most real-world 'biases' (like the hiring manager's) are not formal contradictions but conflicts between competing values (efficiency vs. equality). Identifying one as the 'error' requires a moral ranking of those values.
  **Vulnerability:** The examiner may press on 'pure' cognitive errors (e.g., calculation mistakes). I must clarify my scope is *morally loaded* contexts, not arithmetic."

  ### 3. The Critical Leverage Objection (Feminist Philosopher)
  **Objection:** "My work on adaptive preferences shows that oppressed agents often internalize their oppression as preference. If we accept your claim that calling this 'bias' is just a moral imposition, we lose the critical leverage to challenge oppression. We need to say the caregiver's self-sacrifice is *distorted* by patriarchy, not just a different moral view. Does your thesis force us to treat oppressive socialization as merely a competing moral premise, thereby neutralizing feminist critique?"

  **Reply (2 mins):**
  "This is a crucial tension. However, my proposal strengthens rather than weakens critique. Currently, calling a preference 'adaptive' often smuggles in a perfectionist ideal of the 'liberated woman' without stating it.
  **Concede:** I concede that we must be able to name oppression. We cannot treat all moral premises as equally valid.
  **Hold Firm:** I hold that we name oppression *more effectively* by stating the moral premise explicitly (e.g., 'we view gendered self-sacrifice as unjust') rather than claiming we are simply 'correcting a cognitive error.' This moves the debate to the moral ground where it belongs—justice—rather than hiding it in psychology.
  **Vulnerability:** This risks appearing to relativize oppression. I must ensure I don't sound like I'm saying the feminist premise is just 'one option among many' rather than a demand of justice."

  ### 4. The Action-Guidance Objection (Clinical Ethics Chair)
  **Objection:** "As a clinician, I need decision procedures, not meta-ethical observations. When a surrogate must decide for an incapacitated patient, telling them to 'state your moral premise' does not tell them *which* premise to use. If your thesis implies there is no neutral way to choose between 'best interest' and 'substituted judgment,' aren't you leaving surrogates in a state of moral paralysis? How does your proposal offer practical guidance?"

  **Reply (2 mins):**
  "My thesis is not meant to replace decision procedures but to clarify their justification. Currently, surrogates often oscillate between standards claiming one is 'objective.'
  **Concede:** I concede my proposal does not generate a specific moral answer for the surrogate. It is not a normative ethic itself.
  **Hold Firm:** I hold that practical guidance is *more* robust when it acknowledges the moral weight. If a hospital policy defaults to life-extension, admitting this is a moral choice allows surrogates to opt-out based on conflicting moral premises. Transparency reduces moral distress even if it doesn't solve the dilemma.
  **Vulnerability:** The Chair may find this unsatisfyingly abstract. I need to offer a concrete example of how transparency changes a clinical outcome (e.g., family trust)."

  ### 5. The System 2 Neutrality Objection (Behavioral Economist)
  **Objection:** "You ignore the dual-process literature. We distinguish bias from preference by appealing to System 2 (deliberative, reflective) preferences versus System 1 (impulsive) reactions. The hiring manager *reflectively* endorses egalitarianism. Isn't the reflective preference a neutral, empirical baseline for what the agent truly values, avoiding the need for external moral judgment?"

  **Reply (2 mins):**
  "Reflective endorsement is not a neutral baseline; it is itself shaped by the same moral environment.
  **Concede:** I agree that reflective endorsement is a crucial data point for respecting agency.
  **Hold Firm:** I hold that *why* we privilege System 2 over System 1 is a moral choice. In the caregiver case, her 'System 1' might be self-preservation, but her 'System 2' endorses sacrifice. If we 'debias' her toward self-preservation, we are privileging individualism over communitarianism. The choice of which system counts as 'true' is normative.
  **Vulnerability:** The economist may argue that without System 2 as a baseline, we have *no* baseline. I must argue we have *multiple* competing baselines, not none."

  ### 6. The Autonomy Undermining Objection (Kantian Ethicist)
  **Objection:** "If correcting bias is merely imposing a moral premise, then any intervention to restore autonomy is just heteronomy. You seem to suggest that helping the hiring manager overcome implicit bias is imposing a value on them. Does this not imply that true autonomy is impossible because any aid to rationality is an imposition?"

  **Reply (2 mins):**
  "I am not claiming aid to rationality is impossible, but that it is not *neutral*.
  **Concede:** I concede that interventions always risk heteronomy if they bypass the agent's will.
  **Hold Firm:** I hold that we can support autonomy without claiming neutrality. We support it by aligning interventions with the agent's *acknowledged* moral commitments (e.g., the manager's endorsed egalitarianism). The 'imposition' only occurs if we claim the intervention is value-free. Acknowledging the moral stake respects the agent as a moral counterpart, not a broken machine.
  **Vulnerability:** This walks a fine line. If the intervention is moral, how is it not heteronomous? I must emphasize *alignment* with the agent's own professed values."

  ### 7. The Surrogate Authority Objection (Clinical Ethics Chair)
  **Objection:** "In your hospital defaults case, if we admit the default is a moral premise, doesn't that undermine the authority of the policy? If a surrogate knows the default is just 'one moral view,' they may feel entitled to reject it even when it represents a societal consensus on resource allocation. Are you encouraging moral relativism in triage?"

  **Reply (2 mins):**
  "Transparency does not equate to relativism regarding resource constraints.
  **Concede:** I concede that surrogates cannot override legitimate systemic constraints (e.g., scarcity).
  **Hold Firm:** I hold that distinguishing between 'clinical bias correction' and 'moral prioritization' protects trust. If a default is about resource allocation, call it that. If it's about patient values, acknowledge the moral weight. This prevents surrogates from feeling manipulated, which actually increases compliance with necessary constraints.
  **Vulnerability:** The Chair may worry this invites litigation or conflict. I need to stress that clarity reduces conflict born of suspicion."

  ### 8. The "Whose Morality?" Objection (Feminist Philosopher/Clinician)
  **Objection:** "You say interveners must state the moral premise. But in institutional settings, *which* moral premise gets stated? If a hospital board selects the premise, isn't that just institutional paternalism? You haven't solved the power problem; you've just made the power move visible. How do you prevent the 'stated premise' from just becoming a new form of coercion?"

  **Reply (2 mins):**
  "Visibility is the first step to accountability.
  **Concede:** I concede that stating a premise does not guarantee the premise is just or democratic.
  **Hold Firm:** I hold that hidden power is harder to challenge than visible power. My thesis forces the justification into the public sphere where it can be contested by stakeholders (patients, staff, community). It shifts the burden of proof to the intervener.
  **Vulnerability:** This is the weakest link. Transparency is necessary but not sufficient for justice. I must acknowledge this limitation without surrendering the core claim."

  ---

  ## Part II: The "Doomsday Question"

  **The Question:**
  *"You argue that no distinction between bias and preference is morally neutral. Yet, your own concluding proposal—that interveners **must** openly state their moral premises—is presented as a normative requirement for all contexts. Is your own proposal not itself a substantive moral judgment masquerading as a procedural neutral rule? If so, on what non-moralized ground do you justify imposing this requirement on us?"*

  **Why this threatens the core:**
  This is a **Performative Contradiction**.
  1.  **If I say "Yes, my proposal is moral":** Then I have not escaped the problem I identified. I am just another intervener imposing a moral premise (transparency/honesty) without a neutral foundation. The examiner can ask, "Why should we accept *your* moral premise over the economist's welfare premise?"
  2.  **If I say "No, my proposal is neutral":** I contradict my central thesis that *no* such distinctions are neutral. I undermine the entire dissertation.
  3.  **The Trap:** It suggests the thesis is self-defeating. If all normative claims are moralized, the thesis itself is just a moralized claim with no special authority, reducing it to a mere opinion rather than a philosophical conclusion.

  **Preparation Strategy:**
  Do not try to claim the proposal is neutral. Own the moral status of the proposal.
  *   **Response:** "You are correct. My proposal is not a neutral algorithm; it is a moral argument for *transparency* and *accountability* over *technocratic concealment*. I am not claiming to stand outside the moral fray; I am arguing that the moral cost of concealment is higher than the moral cost of transparency. I am inviting you to reject my moral premise, but to do so openly, rather than hiding behind the claim of scientific neutrality."
  *   **Risk:** This admits the thesis is a normative plea, not a metaphysical discovery. It shifts the defense from "This is how the world is" to "This is how we ought to act." I must be prepared to defend the *value* of transparency as a sufficient normative ground.
