      *   **Task:** Identify specific counter-arguments (defeaters), rank them (fatal to awkward), analyze specific cases (gradual vs. sudden), connect to other domains (identity, artifacts, contracts), assess the risk of unfalsifiability, and be honest about what a defender would concede vs. dismiss.
