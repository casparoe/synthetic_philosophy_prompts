      *   *Competence:* Fixed or sliding? *Requirement:* Must handle capacity fluctuations. *Case:* Marit (Alzheimer's).
      *   *Third-Party Reliance:* Can an observer tell? *Requirement:* Must be externally accessible to some degree. *Case:* The Husband (Did he know?).
