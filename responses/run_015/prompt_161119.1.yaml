answer: |-
  ### Specification for Valid Consent: Desiderata and Constraints

  You are asking for a normative technology that can bear the weight of literary ambiguity without collapsing into moral vagueness. Below are the desiderata any robust account of consent must meet to handle your five cases. I have marked which are non-negotiable (structural requirements for the concept to function) and which are camp prejudices (theoretical preferences that vary by school).

  #### 1. The Desiderata

  **A. The Distinction: Consent vs. Acquiescence/Permission**
  *   **Requirement:** Consent must be an exercise of normative power (changing rights/obligations), not merely a failure to resist. Acquiescence is behavioral; consent is authoritative.
  *   **Case:** *The Marriage.* If the wife's "yes" is merely to keep the peace (acquiescence), the husband acts on a false premise. If it is consent, he is permitted. The theory must distinguish internal resignation from external authorization.
  *   **Status:** **Non-negotiable.** Without this, consent dissolves into mere prediction of behavior.

  **B. The Validity/Prudence Gap**
  *   **Requirement:** An account must distinguish between consent that is *valid* (normatively binding) and consent that is *unwise* or *coerced* (prudent to refuse). One can validly consent to a bad bargain.
  *   **Case:** *The Aide.* The aide's threat is coercive, but is the son's agreement valid consent? If the theory makes all pressure invalidate consent, no labor contract is ever valid. If it makes none invalidate consent, coercion is permitted. The theory must locate the threshold where pressure becomes duress.
  *   **Status:** **Non-negotiable.** Without this, you cannot distinguish a contract from a hostage situation.

  **C. The Scope/Description Problem**
  *   **Requirement:** Consent attaches to an act under a specific description. If the description changes (via omission or lie), the consent may not cover the act performed.
  *   **Case:** *The Surgeon.* The pianist consented to "surgery," not "surgery with 0.4% risk of career-ending tremor." The theory must explain why omission of material fact voids consent to the physical act.
  *   **Status:** **Non-negotiable.** Without this, fraud is indistinguishable from agreement.

  **D. Content-Independence vs. Reasons**
  *   **Requirement:** Does validity depend on the *reason* for consent? A moral power is usually content-independent (I can consent to X for a bad reason). However, if the reason is ignorance or coercion, validity fails.
  *   **Case:** *The Data Toggle.* Skimming a screen implies a reason ("I trust defaults" or "I don't care"). Is inertia a reason? The theory must decide if passive behavior counts as an exercise of autonomy.
  *   **Status:** **Camp Prejudice.** Libertarians say inertia is consent (opt-out is valid); Autonomy Theorists say only active choice is consent (opt-in required). You must choose which camp serves the theme.

  **E. Competence: Threshold vs. Sliding Scale**
  *   **Requirement:** Is capacity a fixed status or decision-relative?
  *   **Case:** *Marit (Alzheimer's).* She was competent at T1 (signing), incompetent at T2 (refusing). A fixed threshold validates the advance directive; a sliding scale validates the current refusal (if she is content in the moment).
  *   **Status:** **Non-negotiable (with tension).** You cannot have both full advance directive authority and full current-refusal authority. One must yield.

  **F. Third-Party Reliance (External Readability)**
  *   **Requirement:** Consent must be accessible to the recipient. If consent is purely internal, no one can ever know they have it.
  *   **Case:** *The Husband.* He needs to know if he is permitted. If consent is a secret mental state, he is always guessing. The theory must provide an external criterion he can rely on.
  *   **Status:** **Non-negotiable.** Without this, social coordination is impossible.

  **G. Diachronic Identity (The Erosion Problem)**
  *   **Requirement:** Does the past self bind the future self when values or continuity erode?
  *   **Case:** *Marit.* The person who signed is psychologically distinct from the person who refuses. The theory must specify when the "self" is continuous enough for the signature to bind the refuser.
  *   **Status:** **Jointly Unsatisfiable** (see below).

  ---

  #### 2. The Joint Unsatisfiability (The Trilemma)

  You cannot satisfy these three requirements simultaneously. You must sacrifice one to save the other two.

  1.  **Internal Authority:** Only the consenter's current mental state determines validity.
  2.  **External Reliance:** The recipient must be able to know/verify validity from the outside.
  3.  **Diachronic Stability:** Past commitments (advance directives/contracts) bind the future self.

  *   **If you keep 1 & 2:** You lose Diachronic Stability. Marit's current refusal overrides her past signature. (The past self cannot bind the present).
  *   **If you keep 1 & 3:** You lose External Reliance. The husband can never know if the wife's "yes" is real (Internal), and Marit's past signature is valid only if we can access her past mind (Diachronic), but her current mind says no.
  *   **If you keep 2 & 3:** You lose Internal Authority. The husband can rely on the "yes" spoken (External) and the signature signed (Diachronic), even if the wife's internal state is "no."

  **For your novel:** This unsatisfiability is not a bug; it is the subject. Do not solve it. Let the characters inhabit the different corners of the trilemma. The husband relies on **External/Diachronic** (she said yes, she signed). The wife inhabits **Internal/Current** (I am saying yes, but I mean no). The reader sees the gap.

  ---

  #### 3. The Single Workhorse Requirement

  **The Voluntariness Threshold.**

  This is the requirement that does the most work in knocking out otherwise attractive accounts.
  *   **Why:** The most attractive simple theory is **Performative Consent** ("If you say 'yes' or sign, it counts"). This is clean, legally efficient, and externally readable.
  *   **What it excludes:** It excludes the **Aide** (economic duress) and the **Marriage** (subtle coercive atmosphere) and the **Surgeon** (informational asymmetry).
  *   **The Knockout:** If you do not enforce a Voluntariness Threshold (that the "yes" must be free from controlling influence or material ignorance), you cannot distinguish the Aide's contract from a robbery, or the Wife's peace-keeping from desire.
  *   **Cost:** Enforcing this makes **External Reliance** difficult. The husband *cannot* be sure the wife is voluntary. This creates the narrative tension you need.

  ---

  #### 4. Narrative Constraint: Internal vs. External

  You noted a constraint: *Close-limited narration (Internal) vs. Reader/Judgment (External).*

  A theory that prioritizes **Internal Authority** protects the wife's POV (she knows she didn't truly consent) but makes the husband a villain by accident (he couldn't know).
  A theory that prioritizes **External Reliance** exonerates the husband (he acted on available evidence) but silences the wife (her internal "no" is normatively inert).

  **Recommendation:** Adopt a **Hybrid/Asymmetric Theory**.
  *   **For the Recipient (Husband/Surgeon/Son):** Consent is valid if it meets **External Reliance** standards (reasonable belief in voluntariness and competence). This allows them to act.
  *   **For the Consenter (Wife/Marit/Pianist):** Consent is valid only if it meets **Internal Authority** standards (actual understanding and voluntariness). This allows them to feel violated even if the other party acted "correctly."
  *   **Result:** This creates the moral residue your novel requires. The husband is *permitted* to proceed, but the wife is *harmed*. The tragedy is not that consent failed, but that the two definitions of consent diverged.

  ---

  #### 5. Scoring the Three Families of View

  | Family of View | Core Claim | Score on Your Cases | Narrative Utility |
  | :--- | :--- | :--- | :--- |
  | **Internal Attitude** | Consent is a mental state of agreement. | **Fails:** *Husband* (cannot know), *Aide* (hard to prove duress internally), *Data* (inertia counts if mental state is 'okay'). <br> **Passes:** *Wife* (her 'no' is real), *Marit* (current refusal matters). | **High for POV.** Renders the wife's inner alienation perfectly. **Low for Plot.** Makes the husband's actions inexplicable or purely villainous. |
  | **Public Act** | Consent is a communicative performance (speech/signature). | **Fails:** *Wife* (her 'yes' counts even if internal 'no'), *Marit* (signature binds her even if she refuses now), *Surgeon* (signature binds despite omission). <br> **Passes:** *Husband* (he can rely on the 'yes'), *Aide* (contract is signed). | **High for Conflict.** Creates clear dramatic irony (we know she didn't mean it, he thinks she did). **Risk:** Can feel legally cold. |
  | **Moralized** | Consent is valid only if the background conditions are just. | **Fails:** *Aide* (invalidates contract due to power imbalance), *Data* (invalidates due to design manipulation). <br> **Passes:** *Surgeon* (omission voids consent), *Wife* (patriarchal context voids 'yes'). | **High for Theme.** Good for social critique. **Low for Character.** Turns characters into avatars of systems; reduces agency. |

  **Final Specification:**
  To serve the novel, treat Consent as a **Public Act** (for the husband/reader's external judgment) that is **Haunted by Internal Attitude** (for the wife's close-third narration). Use the **Voluntariness Threshold** to blur the line between them: the husband tries to meet it, the wife knows she fails it, and the reader holds both truths. For Marit, embrace the **Joint Unsatisfiability**: let the advance directive and the current refusal both be "right" in their own temporal frames, forcing the son to choose which version of his mother to honor.
