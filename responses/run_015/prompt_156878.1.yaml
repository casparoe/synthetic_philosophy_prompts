      *   *Item 2 (Utility vs Money):* Verify weights attach to wellbeing rather than cash; Rule (1) passes only if interpreted as adjusting for diminishing marginal utility of income, but fails if treated as a moral priority claim, since the theorem requires weighting utilities, not monetary units directly.
      *   *Item 3 (Lotteries and Risk):* Ensure valuations treat risk reductions linearly; Rule (2) fails because valuing identifiable lives differently from statistical lives violates the principle that society should value a person's safety equally regardless of whether the risk is known in advance.
      *   *Item 4 (Additivity/Independence):* Confirm benefits sum across people without interaction penalties; Rule (3) passes if viewed as inequality aversion within a concave function, but fails as a separate haircut because it double-counts distributional concerns already embedded in the income weights.
      *   *Item 5 (Handoff/Verdict):* Stop here if any rule violates consistent valuation over lotteries and hand the file to the board to decide if they want to break mathematical consistency for moral reasons; you lose the argument because your mate is right that you cannot claim theoretical coherence while using endogenous weights and identifiability premiums.

      *Refining for constraints (1-2 sentences, board-friendly language):*

      *   *Item 1:* Check that the value we place on a person's gain is fixed before we calculate the project's outcome; Rule (1) fails this test because recomputing weights after the project changes the value of a pound based on the policy choice itself, which breaks logical consistency.
      *   *Item 2:* Verify that we are weighting changes in wellbeing rather than changes in cash; Rule (1) passes only if framed as correcting for diminishing marginal utility, but fails if intended as a moral priority, since the math requires weights on utility, not money.
      *   *Item 3:* Ensure we value a reduction in risk equally whether the person at risk is named or anonymous; Rule (2) fails this check because privileging identifiable lives violates the requirement that social preferences over lotteries must treat identical probability changes consistently.
      *   *Item 4:* Confirm that distributional concerns are handled within the weighting rather than as a separate penalty; Rule (3) fails because applying a haircut on top of income weights double-counts inequality aversion and obscures the actual trade-offs being made.
      *   *Item 5:* Halt the automation if any check fails and require the board to explicitly accept that we are sacrificing mathematical consistency for moral intuition; you lose the argument because your mate correctly identified that your manual violates the axioms required to claim the results represent a coherent social welfare function.

