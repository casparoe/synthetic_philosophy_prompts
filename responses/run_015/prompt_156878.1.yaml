          *   Mate (Philosophy PhD): Harsanyi's aggregation theorem implies social welfare must be a weighted sum of individual vNM utilities with constant weights. Therefore, weighting money based on income is only valid if reflecting marginal utility of money. Rules (2) and (3) are hand-waving. Rule (1) is doubly bad because it recomputes weights post-project (endogenous weights).
