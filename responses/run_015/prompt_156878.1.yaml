  2.  **Deconstruct the Economics/Philosophy:**
      *   **Harsanyi's Aggregation Theorem:** If individual preferences satisfy vNM axioms and social preferences satisfy vNM axioms + Pareto, then social welfare is a linear sum of individual utilities ($W = \sum a_i U_i$). The weights $a_i$ are constant (cannot depend on the outcome/state).
      *   **Rule (1) Income Weights:** Standard distributional weighting often appeals to diminishing marginal utility of income. However, the user's manual applies weights to *benefits* (money/values), not utilities directly, unless converted. The critical flaw pointed out by the mate is the *recomputation* using post-project incomes. This makes weights endogenous to the policy choice. Harsanyi requires constant weights across outcomes. If weights change based on the outcome (post-project income), it violates the linearity/independence structure required for the theorem to hold as a representation of consistent social preferences over lotteries.
      *   **Rule (2) Identifiability Premium:** Valuing identifiable lives over statistical lives violates the basic premise of expected utility theory regarding risk. It introduces a preference over the *structure* of the risk allocation that isn't captured by individual ex-ante utilities. This is generally seen as violating impartiality or ex-ante Pareto principles in standard welfare economics, though philosophically defensible on other grounds (prioritarianism, contractualism). Harsanyi's framework (utilitarianism) typically rejects this.
      *   **Rule (3) Inequality Haircut:** This is an inequality aversion tweak. If done via concave social welfare function, it's consistent with weighted utilitarianism. But a flat "15% haircut" on uneven spread is a heuristic.
