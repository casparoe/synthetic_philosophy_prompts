answer: |-
  # The Ambiguity Diagnostic Instrument

  ## Part I: The Decision Tree

  **Instructions:** Proceed from Node 1. Answer **A** or **B**. Follow the arrow to the next Node or to a **Leaf**. Answer based on your immediate intuition about the case described, not on what theory suggests you *should* answer.

  **Node 1: The Standard Comparison**
  You face two urns. Urn K contains 50 red balls and 50 black balls. Urn U contains 100 balls of red and black in an unknown proportion. You must bet on drawing a Red ball to win \$1,000. You may choose which urn to draw from.
  *   **A:** I am indifferent; the probability is 50% in both cases by symmetry. → **Go to Leaf 1**
  *   **B:** I strictly prefer Urn K. → **Go to Node 2**

  **Node 2: The Isolation Test**
  You face only Urn U (unknown composition). There is no Urn K to compare it to. You must bet on Red or Black to win \$1,000.
  *   **A:** I am indifferent between Red and Black; without a comparison, there is no reason to favor one. → **Go to Leaf 2**
  *   **B:** I still prefer one color over the other (or feel a distinct unease that affects the choice), even in isolation. → **Go to Node 3**

  **Node 3: The Source Stake**
  Urn U was filled in one of two ways. Scenario 1: A friend filled it randomly with no knowledge of your bet. Scenario 2: An adversary filled it after seeing your bet, aiming to make you lose.
  *   **A:** My preference for Urn K (from Node 1) disappears in Scenario 1 but remains in Scenario 2. → **Go to Leaf 3**
  *   **B:** My preference for Urn K remains the same regardless of who filled the urn or when. → **Go to Node 4**

  **Node 4: The Repeated Play**
  You must draw from Urn U 100 times with replacement. You see the result of each draw before the next bet.
  *   **A:** My aversion vanishes; I can learn the composition and bet optimally. → **Go to Leaf 4**
  *   **B:** My aversion persists; the initial uncertainty about the composition still burdens the first several bets. → **Go to Node 5**

  **Node 5: Gain vs. Loss Frame**
  Compare two cases. Case 1: Bet on Red to win \$1,000. Case 2: Bet on Red to avoid losing \$1,000 (you start with the money).
  *   **A:** My aversion to Urn U is significantly stronger in the Loss case than the Gain case. → **Go to Leaf 5**
  *   **B:** My aversion is roughly symmetric; I dislike the unknown probability equally in gains and losses. → **Go to Node 6**

  **Node 6: Correlation Structure**
  You face two Urn Us (both unknown composition). Option 1: Bet that both draws match (Red-Red or Black-Black). Option 2: Bet that they mismatch (Red-Black or Black-Red).
  *   **A:** I treat the ambiguity about the *correlation* differently than the ambiguity about the *marginal* color probability. → **Go to Leaf 6**
  *   **B:** I treat ambiguity about correlation and marginal probability identically. → **Go to Node 7**

  **Node 7: Value of Information Timing** [Non-Canonical Variant]
  You may pay \$50 to learn the exact composition of Urn U. When is this information valuable?
  1. Before you place your bet.
  2. After you place your bet, but before the ball is drawn.
  3. After the ball is drawn, but before the color is revealed.
  *   **A:** I would pay in Case 2 or 3 (I value knowing the truth even if it cannot change my action or payoff). → **Go to Leaf 7**
  *   **B:** I would only pay in Case 1 (Information is only valuable if it changes my decision). → **Go to Node 8**

  **Node 8: Group Consensus** [Non-Canonical Variant]
  Three colleagues must make one joint bet using Urn U. Each has a different range of plausible probabilities (e.g., 40-60%, 30-70%, 20-80%).
  *   **A:** We should average our priors and bet as a single Bayesian agent. → **Go to Node 9**
  *   **B:** We should choose the action that minimizes our maximum joint regret (worst-case across our combined ranges). → **Go to Leaf 8**

  **Node 9: Second-Order Probability**
  Can you assign a probability distribution to the possible compositions of Urn U (e.g., "There is a 50% chance the urn is 40% Red")?
  *   **A:** Yes, and I evaluate the bet by averaging over these probabilities, but I weight the "average" pessimistically. → **Go to Leaf 9**
  *   **B:** No, I refuse to assign probabilities to probabilities; I only work with the set of possible priors. → **Go to Node 10**

  **Node 10: Weighting Mechanism**
  When evaluating the set of possible priors, how do you aggregate them?
  *   **A:** I take a fixed weighted average of the Best-Case and Worst-Case prior. → **Go to Leaf 10**
  *   **B:** I weight priors based on a measure of "confidence" or "precision" associated with each prior. → **Go to Leaf 11**

  ---

  ## Part II: The Leaves (Positions)

  **Leaf 1: Expected Utility**
  *Standard Label.* Ambiguity is irrelevant. All uncertainty is reducible to a single subjective probability measure. Preferences satisfy the Sure-Thing Principle.

  **Leaf 2: Unnamed (Deflationary/Isolationist)**
  The aversion is an artifact of comparison. In isolation, the agent satisfies Expected Utility. The effect is a framing error induced by juxtaposing known and unknown risks, not a fundamental preference.

  **Leaf 3: Unnamed (Distrust/Strategic)**
  The effect is not about probability but about agency. It is rational to avoid bets set by adversaries, but irrational to avoid bets set by nature or stake-free friends. This dissolves when the source is verified as non-strategic.

  **Leaf 4: Unnamed (Statistical Robustness)**
  Ambiguity aversion is a heuristic for small sample sizes. It is ecologically rational in one-shot or short-horizon environments but vanishes when data allows for convergence to the true parameter.

  **Leaf 5: Unnamed (Contextual Asymmetry)**
  Ambiguity is not a stable preference but interacts with loss aversion. The agent is ambiguity-neutral over gains but ambiguity-averse over losses (or vice versa).

  **Leaf 6: Unnamed (Correlation-Specific)**
  The agent is neutral to marginal ambiguity but averse to ambiguity regarding dependence structures (correlation) between events.

  **Leaf 7: Unnamed (Temporal Resolution)**
  The preference is not about probability but about *when* uncertainty resolves. The agent pays to resolve uncertainty early (or late) regardless of instrumental value.

  **Leaf 8: Unnamed (Group Regret Minimization)**
  In collective choice, the group adopts a maximin strategy over the union of individual prior sets, even if individuals would not do so privately.

  **Leaf 9: Smooth Ambiguity**
  *Standard Label.* The agent holds a second-order probability distribution over first-order priors and applies a concave transformation to the expected utility of each prior before aggregating.

  **Leaf 10: Unnamed (Fixed Mix)**
  The agent evaluates acts by a fixed convex combination of the maximum and minimum expected utility across the set of priors (Alpha-MaxMin).

  **Leaf 11: Unnamed (Confidence-Weighted)**
  The agent weights priors not equally, nor by a fixed alpha, but by a confidence function that measures the reliability of the information generating each prior.

  ---

  ## Part III: Structural Analysis

  ### (i) Indistinguishable Leaves
  The following pairs of leaves cannot be separated by this instrument (or standard choice data) without additional structural assumptions or physiological measurement:

  1.  **Leaf 3 (Distrust) vs. Leaf 9/10/11 (Genuine Ambiguity):** On the standard 2-urn case (Node 1), these produce identical choices.
      *   *Separating Node:* Node 3 attempts this, but a respondent may claim "Nature is adversarial" metaphysically. To truly separate them, you need a node where the urn is filled by a verified random physical process (e.g., radioactive decay) unknown to any agent. If aversion persists, Distrust is ruled out.
  2.  **Leaf 10 (Fixed Mix) vs. Leaf 4 (MaxMin):** On binary choices (Win/Lose), a MaxMin agent and an Alpha-MaxMin agent with high alpha often choose the same option.
      *   *Separating Node:* You need a pricing task (willingness to pay) rather than a choice task. MaxMin implies a kink in indifference curves; Fixed Mix implies smoothness. This is not answerable by intuition alone; it requires elicitation.
  3.  **Leaf 6 (Correlation) vs. Leaf 9/10/11 (Plain Ambiguity):** Without Node 6, these are indistinguishable.
      *   *Separating Node:* Node 6 is necessary. However, if a respondent answers "Same" at Node 6 but still exhibits correlation aversion in complex portfolios, the tree misclassifies them. Intuition on correlation is notoriously unreliable without formal training.

  ### (ii) Permitted but Unoccupied Combinations
  The logic of the tree permits certain answer patterns that correspond to no coherent theoretical position:

  *   **Pattern:** Node 1 (A: Indifferent) + Node 2 (B: Preference in Isolation).
      *   *Status:* **Incoherent.** If you are indifferent in the comparison, you must hold a unique prior. If you hold a unique prior, you cannot have a preference in isolation. This indicates the respondent misunderstood Node 1.
  *   **Pattern:** Node 4 (A: Vanishes in Repeat) + Node 7 (A: Pay for Info after Bet).
      *   *Status:* **Unattractive.** If learning solves the ambiguity (Node 4), paying for information that cannot change the bet (Node 7) implies a preference for resolution that contradicts the "learning" rationale. It suggests a fetish for information rather than a robustness concern.
  *   **Pattern:** Node 9 (B: No Second-Order) + Node 11 (B: Confidence Weighted).
      *   *Status:* **Unexplored/Tense.** Confidence weighting usually implies a second-order structure (confidence *in* a prior). Denying second-order probabilities while asserting confidence weights is theoretically difficult to formalize without collapsing into MaxMin.

  ### (iii) Internal Instability
  The following answer pattern indicates dynamic inconsistency, suggesting the instrument has captured a preference that cannot be implemented as a policy:

  *   **Pattern:** Node 7 (B: Info only valuable before bet) + Node 10 (A: Fixed Mix of Best/Worst).
      *   *Instability:* A Fixed Mix agent often exhibits dynamic inconsistency. They may plan at Node 7 (Before Bet) to ignore information that doesn't change the action, but once at Node 7 (After Bet), the "worst case" may shift, causing them to wish they had paid for the info to hedge their regret.
      *   *Verdict:* **Instrument Valid, Position Unstable.** This is not a flaw in the tree; it correctly identifies that the Fixed Mix view (Leaf 10) often violates dynamic consistency. The respondent should be warned that their preferences today will be rejected by their future self.

  *   **Pattern:** Node 1 (B: Prefer Known) + Node 2 (A: Indifferent in Isolation).
      *   *Instability:* This is the Deflationary view (Leaf 2). It is internally stable *if* the agent acknowledges the comparison is the cause. However, if they maintain Node 1 preference in a real-world deployment (where isolation is impossible), they are acting on a framing artifact.
      *   *Verdict:* **Position Valid, Ecologically Fragile.** The tree classifies them correctly, but their position is vulnerable to environmental framing they cannot control.

  ***

  **Note on Non-Canonical Variants:**
  *   **Node 7 (Value of Information Timing):** The specific distinction between paying for information *after* the bet but *before* the draw is not a standard textbook elicitation. It is included here to test for preferences over uncertainty resolution independent of instrumental value.
  *   **Node 8 (Group Consensus):** The specific framing of "overlapping plausible-prior ranges" requiring a single joint choice is a variant of group decision theory problems but is not a canonical individual ambiguity test. Use caution when citing this as a standard ambiguity measure.
