prompt: |-
  hey — i'm in grade 11 and I run this little science-and-philosophy club at my school. Usually like 14 people turn up, we get 50 minutes in a normal classroom with desks pushed together, and thats it: no laptops, projector is unreliable if it works at all. I've got to run a session next week on the units of selection thing (genes vs individuals vs groups — like, what does natural selection actually act on) and most of the club will say "obviously the individual" and I want them to stop being that sure by the end. But I really don't want to stand at the front and explain the debate first, so design me a game where they hit the problem themselves with cards or slips of paper and maybe candy as the payoff — no real money.

  What I need:

  - 14ish people, groups of 3 or 4, about 5 rounds, and the whole thing including me explaining the rules has to fit in 50 minutes.
  - Two roles/cards: one that does great for the person holding it and bad for their group, one that does the opposite. Payoffs tuned so that inside any group the selfish card always comes out ahead, but groups of cooperators out-produce groups full of selfish players. Give me the actual numbers and tell me how to retune it if everyone just defects by round 2.
  - The bit I'm most stuck on: in round 4 I want to quietly redraw the group boundaries — split the best-performing group in two, merge the two worst into one — without saying why, and then have them notice that whether group selection looks like it's doing anything depends on where I drew the lines. Is that a terrible idea? If there's a better way to make the boundaries question show up in what happens rather than in what I say, do that instead.
  - I vaguely heard theres some equation that splits evolutionary change into a within-group part and a between-group part (Price something?). I don't want the formula, but can they see that split in their own score sheets using numbers they collected themselves? If yes show me how; if it won't work just say so.
  - What I want them walking out with: that "what level does selection act on" isn't just word games, it changes what you'd predict; and that the group-level story only gets off the ground if something keeps cooperators together (relatives, staying put, whatever) — and that genes don't sit around choosing like they do in the game.

  Also give me: the rules and materials, the payoff table, a rough timeline, and a debrief that maps specific moments in the game onto the gene-eye / individual / group answers instead of naming them up front. Plus honestly: what will go wrong the first time I run this, how do I handle it, and which part of the real debate the game just can't reproduce so I'll have to say it myself.

  Keep the whole answer under 700 words — bullets and short lines are fine, I don't need full sentences everywhere.
