answer: |-
  **Game: "The Trait Lottery"**
  **Players:** 14 (4 groups: 3-4 people). **Rounds:** 5. **Time:** 50 mins.

  **Materials**
  *   14 Cards (7 Red/Selfish, 7 Green/Coop).
  *   Candy (payoff).
  *   Score sheets (Player ID, Card Played, Personal Score, Group Total).

  **Payoff Table (Per Round)**
  *   **Green:** You get **1 pt**. Group Pool adds **4 pts**.
  *   **Red:** You get **3 pts**. Group Pool adds **0 pts**.
  *   **Payout:** Group Pool split equally among members. **Total = Personal + Share.**
  *   **Logic:**
      *   *All Green (4):* You = 1 + (16/4) = **5 pts**. (Group wins).
      *   *All Red (4):* You = 3 + 0 = **3 pts**.
      *   *Mixed (3G, 1R):* Green = 1 + 3 = **4 pts**. Red = 3 + 3 = **6 pts**. (Red wins inside).
  *   **Retuning:** If everyone plays Red Round 2, double Group Pool bonus (Green adds 8). Makes cooperation vital.

  **Timeline**
  *   **0-5:** Rules. Secret play (hold card to chest), reveal simultaneous. No talking strategies.
  *   **5-25:** Rounds 1-3. Record scores.
  *   **25-30:** **Reorganization.** Split highest-scoring group. Merge two lowest. Randomize rest. Frame as "Environmental Shift," not selection.
  *   **30-40:** Rounds 4-5.
  *   **40-50:** Debrief.

  **The Boundary Move**
  Not terrible. It mimics "population structure." To make it visible: Track % Green in class vs. % Green inside groups. If Green survives overall but dies inside every group, group boundaries saved it. If the merge kills Green, structure was required.

  **Seeing the "Price Equation" Split**
  Skip the formula. Use two comparisons on their sheets:
  1.  **Within-Group:** Avg Score(Red) minus Avg Score(Green). (Should be positive).
  2.  **Between-Group:** Avg Score(High-Green Groups) minus Avg Score(High-Red Groups). (Should be positive).
  *   **Visual:** If #2 > #1, Green spreads globally despite losing locally.

  **Debrief Script (Map Moments to Concepts)**
  *   **"Why did Red win inside groups?"** → Individual selection (Selfish Gene).
  *   **"Why did All-Green groups get more candy?"** → Group selection advantage.
  *   **"Did Round 4 change the outcome?"** → Selection depends on boundaries (structure/assortment).
  *   **"Did cards choose?"** → No. Traits spread via replication, not decision.

  **Failure Modes & Fixes**
  *   **Math Slowdown:** You calculate group pools. Students track only personal cards.
  *   **Collusion:** They agree to all play Green. **Fix:** Secret play, reveal simultaneous.
  *   **Cynicism:** "I just want candy." **Fix:** Candy proportional to total points.
  *   **Confusion on Reorg:** They think you're punishing them. **Fix:** Frame as "Random Migration Event."

  **Limitations (Say This)**
  *   **Agency:** Students choose cards; genes don't. Selection is blind filtering, not decision.
  *   **Replication:** Winners don't automatically copy themselves here. You must mention: "In nature, high scorers leave more offspring."
  *   **Time:** Real selection takes generations. This is a snapshot.

  **Takeaway**
  Selection isn't one thing. It's a tug-of-war between levels. Without structure (keeping cooperators together), individual advantage always wins.
