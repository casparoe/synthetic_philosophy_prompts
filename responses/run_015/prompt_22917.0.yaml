answer: |-
  This is a sophisticated distinction to draw, and your intuition that they are often conflated is correct. While both conclusions look similar to the outsider (the grandfather survives), the machinery driving that conclusion differs fundamentally because Lewis is doing conceptual analysis while Novikov is doing theoretical physics.

  Here is a side-by-side breakdown of the four points you requested, followed by their convergences and specific objections.

  ### 1. Agency in the Past: Compossibility vs. Physical Constraint
  **David Lewis** treats the traveler's agency through the lens of **compossibility**. For Lewis, "can" is equivocal. Relative to the facts of Tim's skill, the gun's functionality, and his proximity, Tim *can* kill his grandfather. However, relative to the fact that his grandfather survived to father his father, Tim *cannot*. Lewis argues that Tim retains full agency: he can try, aim, and pull the trigger. His failure is contingent and local—he slips, he loses his nerve, a bird flies in the way. The universe does not stop him; mundane causality does. Lewis preserves the intuition that the traveler is a normal agent who simply fails to succeed.

  **The Novikov Principle** treats agency as subject to **global physical constraints**. In General Relativity, if a Closed Timelike Curve (CTC) exists, the laws of physics must yield a self-consistent solution across the entire manifold. Here, the traveler's agency is structurally limited. It is not merely that Tim *happens* to miss; it is that the probability amplitude for the "kill" scenario is zero. If Tim tries to shoot, the gun jams not because of a random coincidence, but because the boundary conditions of the CTC suppress that event. Agency is not "free to try and fail"; it is constrained such that only consistent actions are physically realizable.

  ### 2. The "Fixed" Past: Logical Facts vs. Boundary Conditions
  **Lewis** views the past as fixed because **facts are true**. In his block universe, propositions about the past have truth values. If "Grandfather survived 1920" is true, then any scenario where he dies is logically incompatible with that truth. The fixity is semantic and logical. The motivation is to preserve the Law of Non-Contradiction. The past is fixed because changing it implies a contradiction (A and not-A), which is meaningless.

  **Novikov** views the past as fixed because of **dynamic boundary conditions**. The fixity is not just about truth values but about the continuity of fields and matter. The state of the universe at the "exit" of the time machine constrains the state at the "entry." The motivation is to preserve the laws of physics (specifically, the Einstein Field Equations) from breaking down. The past is fixed because the physics of the CTC demands a single, consistent history to avoid singularities or undefined states.

  ### 3. Free Will and Determinism
  **Lewis** is a **compatibilist** and does not commit to global determinism. He argues that Tim's failure is consistent with free will because Tim *could* have succeeded in a different possible world where the grandfather died (and Tim was never born). In the actual world, Tim's free will is compatible with the fixed past because his actions are part of what makes the past fixed. He chooses not to kill (or fails to), and that choice is free even if the outcome is predetermined by consistency.

  **Novikov** leans heavily toward a **strong determinism**. Because the future (the traveler's arrival) constrains the past (the grandfather's survival), the causal arrow is bidirectional. This creates a "self-consistent loop" where events are determined by the global topology of spacetime rather than just local initial conditions. While Novikov himself argued this preserves free will (you do what you choose, you just can't choose inconsistently), critics argue this reduces free will to an illusion of consistency, as the "choice" to fail is enforced by physical law.

  ### 4. Dissolving vs. Relocating the Paradox
  **Lewis** claims to **dissolve** the paradox. He argues the paradox arises from an equivocation on the word "can." Once we distinguish "can relative to local facts" from "can relative to global facts," the contradiction vanishes. There is no mystery left to explain; it is a logical error, not a physical one.

  **Novikov** effectively **relocates** the paradox. He accepts the logical contradiction is impossible but moves the burden to physics: "How does the universe enforce consistency?" The paradox is resolved by asserting a principle (self-consistency), but this raises new questions about the mechanism of enforcement (e.g., quantum interference, probability suppression). It shifts the problem from "Is this logical?" to "Is this physically stable?"

  ### Quiet Convergences
  Despite their different origins, Lewis and Novikov agree on two crucial points that often go unstated:
  1.  **Eternalism:** Both rely on a block universe where past, present, and future exist equally. Neither allows for a "moving now" that gets rewritten.
  2.  **Affecting vs. Changing:** Both distinguish between *changing* the past (making it different from what it was) and *affecting* the past (being a causal part of what it always was). Both agree time travel allows the latter but forbids the former.

  ### Less Common Objections
  **For Lewis: The Principle of V-Correlation (Paul Horwich).**
  Introductory treatments often accept Lewis's "coincidences" (banana peels, jams) as sufficient. However, Paul Horwich argued that if time travel were possible, we would observe an inexplicable asymmetry in causation. To prevent the paradox, the universe would need to generate "inverse forks"—events converging to prevent the killing—without a common cause. Horwich argues this violates the statistical regularity of the universe. It's not just that Tim fails; it's that *every* time traveler fails via unrelated coincidences, which is statistically improbable without a causal mechanism (which Lewis denies exists).

  **For Novikov: The Non-Uniqueness Problem.**
  While often praised for consistency, the Novikov principle suffers from the problem of multiple solutions. Research by Echeverria, Klinkhammer, and Thorne (using the billiard ball model) showed that for certain CTC configurations, there are *multiple* self-consistent solutions for the same initial data. The physics tells you consistency is required, but it doesn't tell you *which* consistent history occurs. This undermines the principle's predictive power and suggests that consistency alone is not enough to fully determine events, leaving a gap in the explanation.

