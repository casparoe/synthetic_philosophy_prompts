      *   *Audience Check:* Ensure the family understands "moral desert." Gloss it as "what we owe each other."
      *   *Length Check:* A 5-minute speech is roughly 750 words at 150 wpm. I need to be concise but expansive enough to feel warm.

  8.  **Final Polish:** Check the explicit constraint about identifying the ruled-out claim. Make sure it stands out. Ensure the distinction between ledger and vector drives the praise.

