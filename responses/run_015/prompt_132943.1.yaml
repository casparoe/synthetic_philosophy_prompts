      *   **Audience:** 50% academic colleagues (philosophy/religious studies), 50% family/non-academic friends/former students.
      *   **Task:** Write a 5-minute retirement toast.
      *   **Key Constraint 1 (Conceptual):** Distinguish between "ledger karma" (accumulated balance sheet of credits/debts) and "vector karma" (present directional orientation/structural commitment to giving what is deserved).
      *   **Key Constraint 2 (Application):** Do *not* praise her career by listing honors as proof of favorable karmic balance (ledger). *Do* frame pedagogical patience, refusing credit for students' discoveries, and correcting senior colleagues at personal cost as expressions of vector orientation.
      *   **Key Constraint 3 (Accessibility):** Gloss technical terms in a single clause; no bibliographies/citations/names of specific scholars (unless common knowledge); no requests to look things up.
      *   **Key Constraint 4 (Explicit Identification):** Identify at least one conventional retirement-toast claim that the framework rules out (e.g., "she earned every good thing") and replace it with a permitted claim.
      *   **Tone:** Warm, specific, spoken.
      *   **Ending:** Direct toast.
      *   **Length:** About 5 minutes (approx. 650-800 words spoken at normal pace).

  2.  **Brainstorming & Structural Constraint Analysis:**
      *   *The Problem:* If karma is moral desert, not a reward system, then saying "She worked hard, so she deserves this retirement party" treats the party as a cosmic payoff. That's "ledger karma."
      *   *The Solution:* Focus on the *direction* of her moral agency. Did she act in ways that align with giving others their due? That's "vector karma."
      *   *What is forbidden:* "She earned this honor," "Her struggles were balanced by her success," "The universe paid her back."
      *   *What is permitted:* "She oriented herself toward justice," "She gave students their due credit," "She stood up for truth even when it cost her."
      *   *Audience Balance:* Need to explain "ledger" vs. "vector" simply enough for family/students but precisely enough for philosophers.
      *   *Explicit Rule-Out:* I need to explicitly say something like, "I won't say she earned this night..."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the mixed crowd, state the purpose (honoring Elena).
      *   **The Philosophical Hook:** Introduce Elena's life work (karma as moral desert) without getting bogged down. Define the two types of karma (ledger vs. vector) simply.
      *   **The Constraint Application (The "No" Zone):** Explicitly state what I *cannot* say based on her own philosophy. (e.g., "I cannot say this party is her reward.")
      *   **The Vector Application (The "Yes" Zone):** Highlight specific behaviors that show her moral orientation.
          *   Pedagogical patience (giving students time/credit).
          *   Refusing credit for students' discoveries (giving them their due).
          *   Correcting senior colleagues at personal cost (integrity over status).
      *   **The Replacement Claim:** Instead of "she earned this," say "she embodies the direction we aspire to."
      *   **Closing:** Bring it back to the community, the toast itself.

  4.  **Refining the Tone:**
      *   Needs to sound like a speech, not a paper. Use rhetorical pauses, direct address ("Elena," "Friends").
      *   Keep the philosophy accessible. "Ledger" is easy. "Vector" needs a quick gloss (direction/magnitude).
      *   Ensure the distinction does *real work*. It shouldn't just be a metaphor; it should dictate *why* we are praising her.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Greeting:* Good evening.
      *   *Intro:* Elena's work on karma.
      *   *Concept:* Ledger (balance sheet) vs. Vector (direction).
      *   *Constraint:* I can't say "She deserves this because she worked hard." That's ledger thinking.
      *   *Pivot:* Instead, look at how she treated others.
      *   *Examples:* The grad student whose paper she stepped back from. The department meeting where she challenged the chair.
      *   *Conclusion:* We toast not her balance, but her direction.
      *   *Toast:* To Elena.

  6.  **Review against Constraints:**
