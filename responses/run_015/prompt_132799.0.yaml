answer: |-
  Consider a regional hospital ethics committee convened to allocate a scarce batch of antitoxin. Five paediatric patients require immediate doses to survive, whilst a sixth, currently stabilised, holds the only remaining vial assigned to them. The committee comprises seven members, each holding a partial veto; authorisation to redirect the vial requires a majority vote, yet no single member physically administers the drug—that task falls to a nursing team acting on the written directive. The decision is thus authorised collectively but executed by no single hand, diffusing the causal link between the choice to withhold treatment and the sixth patient's subsequent decline. This setup isolates the moral weight of the decision from the physical act of killing, forcing a examination of whether the prohibition against harming the one persists when agency is fragmented across a bureaucratic body rather than residing in a lone clinician.

  Where the agent-centred restriction bites is on the individual will of each member, not the abstract committee. Even if the committee is the formal agent, deontology cares about the moral integrity of the person willing the act; so yes, each member has the same agent-relative reason not to vote for the harm as a surgeon would have not to inject it. However, the committee *does* have an agent-neutral reason to stop a rogue surgeon from harming the one to save five, because preventing a rights violation is permissible even if committing one isn't. The feature doing the philosphical work here is distributed agency—it attempts to dilute responsibility so no single person feels they 'killed' the patient. If you collapse the committee back into a single decider, the diffusion vanishes and you're left with the standard paradox: the single agent must not kill the one, even to save the five. A hardline deontologist would attack this by claiming each veto-holder bears the restriction separately. They'd argue you can't hide behind the collective; casting a 'yes' vote is morally equivalent to pulling the trigger, so the restriction applies to every member individually regardless of the group outcome.
