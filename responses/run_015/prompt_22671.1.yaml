prompt: |-
  I've been reading about updateless decision theory, mostly blog posts about Newborn's problem, and I keep getting stuck on the name. If the agent is supposed to be "updateless," how does it ever use evidence at all? Like, I come home and the lights are on and the car's in the driveway, and that's clearly evidence that someone's home, and I'd change my beliefs about that under any decision theory I've heard of. If UDT says to be updateless, does it mean I should just ignore what I see and act like I know nothing? That seems absurd. So what does "updateless" actually mean here? What's the real idea behind it?
reasoning: |-
  Here's a thinking process that leads to the explanation of Updateless Decision Theory (UDT):

  1.  **Analyze the User's Confusion:**
      *   **Core Issue:** The user is confused by the term "updateless" in Updateless Decision Theory (UDT).
      *   **Specific Example:** They cite a mundane scenario (lights on, car in driveway $\rightarrow$ someone is home) where updating beliefs based on evidence seems obvious and necessary.
      *   **Misconception:** They interpret "updateless" as "ignoring evidence" or "never changing beliefs."
      *   **Goal:** Clarify what "updateless" actually means in the context of decision theory, specifically distinguishing between *updating beliefs* (Bayesian conditioning) and *updating policies* (decision rules).

  2.  **Deconstruct "Updateless":**
      *   *What is being updated?* In standard Causal Decision Theory (CDT) or Evidential Decision Theory (EDT), the agent updates its *credence function* (probabilities) upon receiving new information, then chooses the action that maximizes expected utility *given those updated probabilities*.
      *   *What does UDT do?* UDT selects a *policy* (a mapping from observations to actions) *before* receiving specific information. It chooses the policy that would have yielded the best outcome if followed, considering all possible worlds weighted by their prior probabilities.
      *   *Key Distinction:* It's not about ignoring sensory input. It's about *when* and *how* that input influences the decision rule.
      *   *The "Newcomb/Parfit's Hitchhiker/Counterfactual Mugging" Context:* UDT shines in problems where updating *causes* you to lose. (e.g., Counterfactual Mugging: If you update on "I am being asked for money," you say no. If you pre-commit, you say yes, and the mugger wouldn't have asked in the counterfactual where you wouldn't pay).

  3.  **Formulate the Explanation:**

      *   **Acknowledge the Validity of the Intuition:** Start by validating the user's reaction. Yes, ignoring evidence in daily life is absurd. UDT isn't about being blind to reality.
      *   **Define "Update" in this Context:** Clarify that "update" refers to *conditionalizing on observations before choosing an action*, not *having observations*.
      *   **The "Policy" vs. "Action" Distinction:** This is the crux.
          *   Standard Agent: See $X$ $\rightarrow$ Update Probabilities $\rightarrow$ Pick Action $A$.
          *   UDT Agent: Pick Policy $\pi$ (If I see $X$, do $A$; If I see $Y$, do $B$) $\rightarrow$ Execute $\pi$ given observation $X$.
      *   **The "Behind the Veil of Ignorance" Analogy:** Use a Rawlsian analogy. You choose your life strategy *before* you know who you are. Once you know who you are, you follow the strategy. You don't re-evaluate the strategy based on who you turned out to be.
      *   **Concrete Example (Counterfactual Mugging):** This is the classic case where updating hurts.
          *   Scenario: Omega flips a coin. Heads: asks for \$10. Tails: gives \$1M *if* you would have given \$10 on Heads.
          *   CDT/EDT (Updateful): See "Heads". Update: "Tails is impossible now." Decision: Keep \$10. Result: Omega predicted this, so Tails happened (or didn't happen depending on setup), you get nothing.
          *   UDT (Updateless): Pre-commit: "If asked, I pay." Result: Omega predicts this, flips Tails, you get \$1M.
          *   *Crucial Point:* The UDT agent *sees* the coin is Heads. It doesn't deny that. It just follows the pre-computed policy.
      *   **Address the "Lights On" Example:** Explain how UDT handles the user's specific example.
          *   Policy: "If lights on + car in driveway $\rightarrow$ Believe someone home $\rightarrow$ Act accordingly."
          *   UDT agrees this is the optimal policy. It just selected that policy *earlier* (conceptually).
      *   **Why "Updateless"?** It's technically "Updateless *Decision* Theory." It avoids updating the *decision criterion* based on indexical information (information about *which* situation you are in) if doing so would undermine the optimality of the policy across all possible situations.
      *   **Summary/Takeaway:** Reiterate that it's about *pre-commitment to a strategy* rather than *ignoring data*.

  4.  **Refine the Tone:**
      *   Keep it conversational but precise.
      *   Avoid overly dense math (no Bayes formulas unless necessary for clarity).
      *   Use bolding for key terms.
      *   Ensure the distinction between *observation* and *conditioning* is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe explain logical uncertainty.
      *   *Correction:* No, that complicates it too much. Stick to the "policy selection" aspect first.
      *   *Initial thought:* Use Newcomb's Problem.
      *   *Correction:* Counterfactual Mugging is actually better for explaining why *updating* is the problem, whereas Newcomb is often about causation vs. correlation. But Newcomb is more famous. I'll mention Newcomb briefly but focus on the logic of "policy selection." Actually, the "Parfit's Hitchhiker" or "Counterfactual Mugging" is the strongest case for *why* updating is bad. I will use Counterfactual Mugging as the primary technical example but keep the "Lights On" example to ground it.
      *   *Check:* Did I answer the specific question? "What does 'updateless' actually mean?" Yes.

  6.  **Final Polish:** Organize into clear sections: The Misconception, The Real Meaning, The Policy Shift, The Example, and Why It Matters. (This matches the structure of the final output).

  7.  *(Final check on the "Lights On" scenario)*: Make sure to explicitly state that a UDT agent *does* turn on the lights or call out "Hello?" when they see the car. They don't act like no one is home. They act according to the policy that says "If car, then someone is home."

  8.  **Drafting the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  You have hit on the single most common confusion about Updateless Decision Theory (UDT), and your intuition is completely correct: **An agent that literally ignored evidence would be insane.**

  If you came home, saw the lights on, and decided to act as if the house was dark because you're "updateless," you would walk into a wall. That is not what UDT recommends.

  The term "updateless" is technical jargon that refers to **when** you choose your decision rule, not whether you process sensory input.

  Here is the breakdown of what "updateless" actually means, why it's named that way, and how it handles your "lights on" example.

  ### 1. The Misconception: Updating Beliefs vs. Updating Policies
  In standard decision theory (like Causal Decision Theory), the process looks like this:
  1.  **Prior:** You have prior probabilities about the world.
  2.  **Observation:** You see evidence (lights on, car in driveway).
  3.  **Update:** You use Bayes' theorem to update your probabilities (it is now highly probable someone is home).
  4.  **Decision:** You choose the action that maximizes expected utility *given these new probabilities*.

  **UDT changes step 4.** It argues that Step 3 (updating your probabilities before deciding) can sometimes lead you to make choices that are suboptimal from the perspective of your "earlier self."

  In UDT, the process looks like this:
  1.  **Prior:** You have prior probabilities about the world.
  2.  **Policy Selection:** *Before* seeing specific evidence, you choose a **policy**. A policy is a function that says: "If I see X, I will do A. If I see Y, I will do B."
  3.  **Observation:** You see evidence (lights on).
  4.  **Execution:** You execute the policy you already chose. You do **not** re-calculate the best action based on the new evidence; you just look up what your policy says to do in this situation.

  So, "updateless" means **you do not update your decision criterion based on new information.** You stick to the plan you would have made if you didn't know what you know now.

  ### 2. The "Veil of Ignorance" Analogy
  Think of it like a political constitution.
  *   **Updateful:** You are already living in the country, you know you are rich, and then you vote on tax laws. You will vote for low taxes because you updated on the fact that you are rich.
  *   **Updateless:** You are behind a "veil of ignorance." You don't know if you will be rich or poor. You write the tax law *now*. You decide: "If I turn out to be rich, I will pay high taxes. If I turn out to be poor, I will receive welfare."
  *   **The Result:** Once the veil is lifted and you discover you are rich, an updateless agent **still pays the high taxes.** Not because they ignore the fact that they are rich, but because they are following the optimal policy they selected *before* they knew their status.

  ### 3. Why would anyone do this? (The Counterfactual Mugging)
  In your "lights on" example, updating works fine. If you update, you conclude someone is home. If you use a UDT policy, the policy says "If lights on, assume someone is home." The result is the same.

  UDT only differs from standard theory in **logical decision problems** where your ability to get a good outcome depends on what you *would have done* in a situation you are *not* currently in.

  The classic example is **Counterfactual Mugging**:
  > Omega (a super-predictor) flips a coin.
  > *   **Heads:** Omega asks you for $10.
  > *   **Tails:** Omega gives you $1,000,000, *but only if* Omega predicts you would have given the $10 had the coin come up Heads.
  >
  > You come home. Omega is there. The coin is **Heads**. Omega asks for $10.

  **The Updateful Agent (Standard):**
  1.  **Observation:** "The coin is Heads."
  2.  **Update:** "The Tails world is impossible. I will never get the $1,000,000. That money is gone."
  3.  **Decision:** "Why should I give Omega $10? It won't change anything. I keep the $10."
  4.  **Result:** Omega (who predicted this) flipped the coin to Heads (or didn't give the money in the Tails world). You get $0.

  **The Updateless Agent (UDT):**
  1.  **Policy Selection (Pre-game):** "I want to maximize my money across both Heads and Tails possibilities. The only way to get the $1M in the Tails world is to commit to paying in the Heads world."
  2.  **Policy:** "If Omega asks for $10, I pay."
  3.  **Observation:** "The coin is Heads."
  4.  **Execution:** "My policy says pay. I pay $10."
  5.  **Result:** Omega predicted this. Omega flipped Tails. You get $1,000,000.

  The UDT agent **knows** the coin is Heads. It is not deluded. But it recognizes that if it "updates" on that fact and changes its behavior, it loses the million dollars in the counterfactual world. To win, it must act as if it doesn't know the coin outcome yet, even though it does.

  ### 4. Back to Your Example (Lights and Car)
  How does UDT handle your scenario?

  *   **Updateful:** See car $\rightarrow$ Update probability of "someone home" to 99% $\rightarrow$ Decide to knock on door.
  *   **Updateless:**
      *   *Pre-computation:* "What is the best rule for life? The best rule is: 'If I see a car and lights, knock on the door. If I see no car and dark lights, use my key.'"
      *   *Execution:* I see the car. I follow the rule. I knock on the door.

  In mundane life, UDT and standard decision theory usually converge. The "updateless" part is invisible because the optimal policy *is* to react to evidence. The difference only becomes visible in high-stakes scenarios involving predictors, logical correlations, or Newcomb-like problems.

  ### Summary
  "Updateless" does not mean "ignore evidence." It means:
  1.  **Don't condition your decision rule on indexical information** (information about *which* specific situation you are in) if doing so would make you predictable in a way that hurts you.
  2.  **Choose a strategy** that works best on average across all possible worlds you might find yourself in.
  3.  **Stick to that strategy** even after you find out which world you are actually in.

  It is called "Updateless" because it refuses to **update the decision algorithm** upon receiving new information, even though it uses that information as an input to the algorithm.

  It's the difference between saying:
  *   **Updateful:** "Now that I know I'm in the 'Heads' world, what is the best thing to do?"
  *   **Updateless:** "Knowing I *might* end up in the 'Heads' world, what should I decide *now* to do if I get there?"
