prompt: |-
  I teach an upper-level philosophy of mind seminar with a rationalist bent—heavy on explicit reasoning, skeptical of citation rituals, and interested in whether arguments survive once their hidden premises are formalized. I'm drafting the final exam and need one essay question that students can answer in about 75 minutes (~900 words) on insect sentience and the scale argument, but I don't want responses that merely recite the "vast numbers multiplied by a tiny prior" formula. To force students into the weeds, the question should embed what I'll call the partitioned reference-class problem: instead of applying a flat prior across all ~10^19 living insects, we condition on specific neural architectures linked to conscious integration—recurrent processing loops and centralized nociceptive integration—which collapses the reference class to perhaps ~10^12 organisms but raises the conditional prior within that subset. The prompt should ask students to do four things: (1) reconstruct the unpartitioned scale argument precisely, explaining why the low-probability/high-number trade-off is supposed to generate large expected moral weight; (2) evaluate whether architectural partitioning is epistemically justified or instead smuggles in a controversial functionalist theory of consciousness; (3) analyze the moral-risk asymmetry—if restricting the class lowers aggregate expected suffering but increases confidence per individual, does that strengthen or weaken the practical case for intervention; and (4) determine whether the argument ultimately depends on a binary or graded conception of sentience, and why that distinction matters for the arithmetic. The question must be answerable without citing specific authors, texts, or dates, and must not ask for a bibliography or reading list.

  Please provide:
  - The exam question itself, phrased for students who have encountered the standard debate but must reason from first principles.
  - A model answer of about 700-800 words that demonstrates the specific conceptual moves separating a top response: precise formalization of the prior update, explicit identification of the hidden functionalist commitment, a balanced analysis of the risk asymmetry, and a clearly defended stance on binary versus graded sentience.
  - A marking scheme out of 20 points, with point allocations tied to the four required moves plus coherence. For each block, name the specific shallow or missing move that typically separates an A (16-20) from a B (12-15)—for example, accepting partitioning without defending the neural criteria, or treating the risk asymmetry as obvious rather than working through its implications. Include a one-line note on the common error that costs marks in each block.
