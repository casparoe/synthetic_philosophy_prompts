answer: |-
  ### The Case: The "Self-Tape" Audition

  Consider a casting call for a niche commercial role with a $10,000 prize. The director asks for a "self-tape" audition (a 1-minute video submitted online) to filter applicants. There are two types of actors: **High Fit** (perfect look/skill for this specific role) and **Low Fit** (wrong look, generic skill). Both types *can* produce the tape (same equipment, same time cost), and the Low Fit desperately wants the money. In the first scenario, the only cost is the time to record (valued at $100). High Fit actors know they have a 50% chance of booking the job if they submit (Expected Value: $5,000); Low Fit actors know they have only a 0.1% chance (Expected Value: $10). The tape signal is honest: High Fits submit, Low Fits don't bother. In the second scenario, the casting agency adds a uniform $5,000 "Union Processing Fee" to submit the tape. Now, the High Fit's net expected surplus is negative ($5,000 - $5,100), and they stop applying. The Low Fits were already out. The pool empties, and the signal carries zero information, despite the signal now being vastly more "costly."

  ### Payoff Structure

  *   **Types:** $\theta \in \{H, L\}$.
  *   **Prize:** $V = \$10,000$ (awarded upon hiring).
  *   **Signal:** Submit self-tape ($s=1$) or not ($s=0$).
  *   **Hiring Rule:** Employer hires randomly from the pool of signalers (or with probability $p_\theta$ conditional on type, known to the actor ex-ante).
  *   **Costs:**
      *   Base Signal Cost ($C_{tape}$): Uniform $\$100$ (time/effort).
      *   Added Cost ($F$): Uniform Fee (Step 1: $F=0$; Step 2: $F=\$5,000$).
  *   **Probabilities of Success (Ex-Ante):**
      *   $P(H) = 0.5$ $\rightarrow$ Expected Benefit $B_H = \$5,000$.
      *   $P(L) = 0.001$ $\rightarrow$ Expected Benefit $B_L = \$10$.
      *   *Note: This differential benefit arises from the match quality, not the signal cost.*

  ### Equilibrium Check

  **Equilibrium 1 (Cheap Signal):** $C_{total} = \$100$.
  *   **High Type:** $B_H - C_{total} = 5000 - 100 = 4900 > 0$. **Signals.**
  *   **Low Type:** $B_L - C_{total} = 10 - 100 = -90 < 0$. **Does Not Signal.**
  *   **Result:** Separating Equilibrium. The signal is informative. The cost ($100) is "cheap" relative to the prize ($10,000), yet it sustains honesty because it exceeds the Low Type's *expected* return.

  **Equilibrium 2 (Costly Signal):** $C_{total} = \$5,100$.
  *   **High Type:** $B_H - C_{total} = 5000 - 5100 = -100 < 0$. **Does Not Signal.**
  *   **Low Type:** $B_L - C_{total} = 10 - 5100 < 0$. **Does Not Signal.**
  *   **Result:** Empty Pool. No signal is sent. Information content is zero. The uniform fee killed the signal at the **participation margin** for the High Type, who had thin net surplus relative to the fee.

  ### The Single Feature Doing the Work

  The mechanism is the **Participation Margin** driven by **Differential Expected Benefits**, not Differential Costs.

  In standard Spence signaling, honesty is maintained at the *mimicry margin*: the cost is low enough for $H$ to bear but too high for $L$ to bear *given the same benefit*. In this model, the benefit differs ($B_H \gg B_L$) because the High Type is more likely to secure the prize. The signal is honest in Step 1 because the uniform cost sits in the gap between $B_L$ and $B_H$. It fails in Step 2 because the uniform cost exceeds $B_H$. The "costliness" of the signal in Step 2 is real, but because it is uniform, it acts as a barrier to entry rather than a filter of quality.

  ### Counterfactual: Differential Cost (Spence Direction)

  If the added cost were differential in the Spence direction (e.g., a difficult skills test where $H$ finds it easier than $L$), increasing the cost would *preserve* the signal.
  *   Suppose the test costs $H$ $\$100$ and $L$ $\$6,000$.
  *   Even with the added difficulty, $H$ still nets positive surplus ($5000 - 100 > 0$), while $L$ is further deterred ($10 - 6000 < 0$).
  *   The signal remains honest and active. The failure in the uniform case occurs precisely because the cost structure lacks this differential burden; it taxes the High Type's surplus directly rather than exploiting the Low Type's inefficiency.

  ### The Zahavian Reply

  **Is this a counterexample to the Handicap Principle?**
  No. The Zahavi/Handicap Principle (and Spence signaling generally) explicitly requires that the signal be **differentially costly** (or differentially burdensome) relative to quality. A handicap is only honest if the "high quality" individual pays a lower *marginal* cost for the signal than the "low quality" individual.

  **The Reply:**
  "You have not constructed a costly signal; you have constructed a **toll booth**. The Handicap Principle predicts that signals must be wasteful *expenditures* that are easier for the fit to afford. By imposing a uniform fee, you removed the 'handicap' element (differential burden) and replaced it with a 'barrier' element (absolute cost). When a barrier exceeds the value of the prize for everyone, the market collapses. This is not a failure of signaling theory; it is a confirmation that without differential costs, there is no signaling, only filtering."

  **Is this reply ad hoc?**
  No, it is definitional. Signaling theory distinguishes between *indices* (uncorrelated with cost), *signals* (correlated with differential cost), and *barriers* (uniform cost). Your model demonstrates that uniform costs cannot sustain separation when surplus is thin, which is exactly what the theory predicts: separation requires a wedge between types, and a uniform cost provides no wedge.
