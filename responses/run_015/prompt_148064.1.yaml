answer: |-
  This is a clean formulation of the Doomsday Argument (DA), and you've correctly identified the load-bearing walls. You're also right to be worried: if the argument holds as written, it is one of the few a priori arguments that can empirically constrain the future of the universe, which feels like getting something for nothing.

  Here is my direct answer, followed by the cost analysis and the confidence flags you requested.

  ### The Step to Reject: Step (1) — Specifically the Reference Class

  You wrote: *"I should reason as if I'd been drawn at random from all the humans who will ever exist."*

  This is the **Self-Sampling Assumption (SSA)**. While it feels like "bare Bayesian bookkeeping," it is actually a substantive, controversial philosophical commitment. The specific failure point in your formulation is the **Reference Class** implicit in (1): *"all the humans."*

  **Why reject this?**
  Your friend's objection in Step (6) is the smoking gun. If you can run the argument on "people in democracies" or "people who know the DA" and get distinct doomsday predictions for each, the reasoning is generating information from arbitrariness. Probability theory shouldn't let you derive empirical facts about the future of democracy solely from your birth rank within democracies.

  The reference class "humans" is not a natural kind for anthropic reasoning. It is biologically defined but functionally arbitrary.
  *   **If you widen the class** to "all conscious observers" (including potential AIs/uploads), your rank $n$ drops from $10^{11}$ to potentially $10^{11}$ out of $10^{30}$. Under SSA, this makes your existence astronomically unlikely unless the total number of observers is small. This *strengthens* the Doomsday conclusion (no AI future) rather than weakening it.
  *   **If you narrow the class** to "biological humans," you are effectively begging the question. You are assuming the class closes (no post-humans) to prove the class closes.

  **The Cost of Rejecting (1):**
  If you drop SSA, you generally move toward the **Self-Indication Assumption (SIA)** or **Full Non-indexical Conditioning (FNC)**.
  *   **How SIA fixes it:** SIA says you should reason as if you are more likely to exist in a world with *more* observers. Your prior over $N$ gets multiplied by $N$ (because there are $N$ times as many "slots" for you to be in).
  *   **The Cancellation:** Your likelihood was $1/N$ (Step 3). Your SIA prior adjustment is $\times N$. They cancel exactly. The posterior becomes identical to the prior. The Doomsday update vanishes.
  *   **The Price:** You inherit the **"Presumptuous Philosopher"** problem. SIA implies you should believe in a vastly larger universe (or multiverse) over a smaller one, *even without empirical evidence*, simply because the larger one contains more observers. If Theory A says there are $10^{20}$ observers and Theory B says $10^{10}$, SIA says Theory A is a billion times more likely, prior to looking at a telescope.

  **My Verdict:** Pay the Presumptuous Philosopher cost. It is less dangerous than the Doomsday cost. Believing the universe is big is a harmless metaphysical eccentricity; believing civilization will end soon based on a math trick is an actionable error that distorts altruistic priorities. The "too many conclusions" problem in Step (6) demonstrates that SSA allows reference classes to act as reality-generating engines, which is a stronger reductio ad absurdum than the Presumptuous Philosopher.

  ### The Headcount vs. Time Distinction (Your Last Point)

  You asked: *"I genuinely can't tell whether that makes the argument weaker, or just weirder than people admit."*

  This makes the argument **weaker** regarding *value*, but **weirder** regarding *ontology*.

  The DA bounds **observer-moments** (or births), not calendar years.
  1.  **The "Stall" Scenario:** Humanity survives for a billion years but maintains a steady-state population of 10 billion. Total $N \approx 10^{20}$. Your rank $10^{11}$ is incredibly early. DA says this is unlikely.
  2.  **The "Digital" Scenario:** We upload. Population explodes to $10^{30}$. Your rank is infinitesimally early. DA says this is incredibly unlikely.
  3.  **The "Doom" Scenario:** Population peaks soon and goes to zero. Total $N \approx 10^{12}$. Your rank is median. DA says this is likely.

  The DA strongly penalizes futures with **high total headcounts**. This includes both long biological futures *and* digital futures. If you believe digital minds are possible, the DA becomes an argument *against* the digital future (or for the Simulation Hypothesis: we are in a simulation where the "real" $N$ is small).

  **Implication for your 15%:**
  If you interpret "Doom" as "Extinction," the DA is shaky (due to Step 1 rejection).
  If you interpret "Doom" as "End of Biological Reproduction," the DA is more robust *if* you keep SSA. A future where we transition to digital substrates or low-fertility longevity implies a total $N$ that might not be vastly larger than $10^{11}$ (if digital minds aren't counted or don't reproduce in the same way).
  However, since you should reject SSA, you should not let this drive your giving. The empirical evidence for existential risk (AI alignment, biosecurity) is far stronger than the anthropic evidence.

  ### Confidence and Uncertainty

  **Confidence Level: 75%**
  I am highly confident that the Reference Class problem (Step 6) invalidates the argument as a *decisive* proof. No other probabilistic argument allows you to change the likelihood of a hypothesis by changing the definition of the group you belong to without new empirical data.

  **The One Thing I Am Least Sure Of:**
  I am least sure about the **normative status of SIA vs. SSA**.
  While I recommend rejecting SSA to avoid Doomsday, I am not certain that SIA is the *correct* replacement. The field of anthropic reasoning is not settled. There are hybrid models (like "SSA + SIA" in specific contexts) or alternative frameworks like **Full Non-indexical Conditioning (FNC)** which try to split the difference.
  It is possible that the "true" anthropic theory lies in a place where the Doomsday Argument retains *some* force (a weak update), but not the overwhelming $1/N^2$ force you calculated. If there is a weak update, it might still warrant a small priority shift, but not the 15% move you made based on a "90% mass below 10x" conclusion.

  **Summary Advice:**
  1.  **Reject Step (1)** (SSA) due to the arbitrariness of the Reference Class.
  2.  **Accept the cost:** You must tolerate the Presumptuous Philosopher implication (favoring larger worlds).
  3.  **Re-evaluate the 15%:** The empirical case for longtermism (AI risk, etc.) relies on physical possibility, not anthropic probability. The DA does not override empirical evidence of technological potential. I would suggest moving that 15% back, or at least freezing further shifts until the anthropic landscape is clearer. The DA is a philosophical puzzle, not a risk factor comparable to unaligned AGI.
