answer: |-
  Dear colleague,

  You are onto something real, and your intuition that the standard literature might not have a single canonical label for this is correct. There is no established term that captures this specific intersection of disavowed narrative, continued behavioral pull, and resistance to argumentative correction. What you are calling narrative drag is a genuine phenomenon, but I suspect you are bundling at least two distinct mechanisms under one description, which is why it feels resistant to a clean definition. The first mechanism is cognitive and internal, concerning the gap between explicit and implicit self-conception. The second is social and performative, concerning the way roles are enforced by others regardless of internal endorsement. Distinguishing these helps explain why arguing fails while acting succeeds, and it clarifies whether the gravity metaphor survives the encounter.

  Let us start with the cognitive split. When your friend says he is not a finisher but cannot leave a manuscript alone, he is reporting a conflict between his explicit self-theory and his implicit self-schema. Explicit beliefs are propositional and responsive to evidence; this is why the factual correction about the birth month works instantly. You provide counter-evidence, the proposition updates, and the behavioral grip vanishes because there was no behavioral grip to begin with. Birth months do not guide action. But the claim I am the kind of person who finishes things is not merely a proposition; it is a script embedded in procedural memory. It is closer to a habit than a belief, but unlike a simple habit like biting nails, it is tied to identity. When he acts against it, he is not just breaking a habit; he is rewiring the associative network that links self-conception to action. This is why stress brings it back. Under cognitive load, the brain defaults to the most entrenched pathways, which are the ones laid down by thirty years of the old narrative. So, on the internal side, what you are seeing is the inertia of implicit self-concept. It is not that the narrative is still believed; it is that the neural pathways associated with that narrative are still the path of least resistance.

  However, the case of the student suggests something external is also at work, and this is where the bundle splits. When she is the responsible one because her siblings assigned her that role, the gravity is not just inside her head; it is in the social field. Even if she disavows the title, the family system continues to treat her as the responsible one. They wait for her to book the flights. If she does not, there is social friction, conflict, or chaos. Her compliance is not just a failure of will; it is a rational response to social pressure. In this context, the narrative persists because it is socially sustained. This tells us that what you are tracking is not always a feature of the individual mind but sometimes a feature of the interpersonal dynamic. The narrative survives disavowal because the community refuses to let it die. This is why acting against it works slowly; she has to train not only her own impulses but also the expectations of her siblings. She has to endure the discomfort of letting the flights go unbooked until the social system recalibrates around a new center. This distinction matters for your seminar because it means the solution is not always introspective. Sometimes the cure is not changing your mind about the story, but changing the social incentives that reward the story.

  This brings us to your question about Dennett and the center of narrative gravity. Does this phenomenon break the metaphor? I do not think it breaks it, but it does require us to clarify what kind of object the center of gravity is. If the center of gravity is defined as the story the agent consciously endorses, then yes, your cases show the metaphor fails, because the center is still pulling despite being rejected. But if the center of gravity is defined as the abstraction that best predicts the agent's trajectory, then the disavowed story remains the center until the new behavior gains enough mass to shift the orbit. The problem with the gravity metaphor in your context is that it suggests a passive physics, whereas your cases show that the agent is actively fighting the pull. A better modification might be to think of it as momentum rather than gravity. Gravity implies a static attractor, but what you are describing is kinetic. The old narrative provided the initial velocity, and even after the engine is cut, the object coasts. It slows down due to friction—what you called acting against it—but it does not stop instantly. This preserves the explanatory power of the narrative view without requiring the agent to believe the narrative. The story explains the trajectory even if the agent denies the map.

  There is a risk, however, in assuming the narrative is the cause. You note that the phenomenon attaches to the evaluative and teleological bits of the life story rather than the dated ones. This is correct, but we should be careful not to reify the narrative as the driver. It is quite possible that the narrative is the dashboard, not the engine. The engine is the habit and the social reinforcement; the narrative is the readout. When your friend says I am a finisher, he might be describing a compulsion rather than causing it. If this is true, then correcting the narrative should not be expected to change the behavior, because the narrative was never doing the work. This would explain why argument fails. You are arguing with the dashboard while the engine is still running. The reason acting against it works is that you are finally engaging the engine. You are changing the input, not the readout. This suggests that for your students, the lesson is not to find the true story of themselves, but to recognize that the story may be a lagging indicator of their habits. The disavowed story is not their center of gravity; it is the ghost of a center that used to exist. It haunts the house because the furniture is still arranged for the previous occupant.

  So, to answer your request for a carving: I would split this into implicit procedural inertia and socially sustained role performance. The first is internal and resists argument because it is non-propositional; it yields only to counter-conditioning. The second is external and resists argument because it is enforced by others; it yields only to boundary-setting. Both look like narrative drag because both are justified by the old story, but neither is driven by belief in that story. As for a name, there is no single term in the literature that covers this composite. You will find discussions of implicit self-concept in social psychology and discussions of habitus in social theory, but neither captures the specific phenomenology of disavowed narrative pull that you are describing. Your term narrative drag is as good as any, provided you specify that the drag comes from habit and social expectation, not from the narrative itself.

  I am confident enough in this decomposition to suggest it to your students, but I would offer it with the caveat that we are mapping the edges of a concept that philosophy has not yet fully settled. The contrast case you offered between factual and evaluative autobiography is the strongest lever you have. Use it to show that self-knowledge is not just knowing the facts of your life, but knowing the forces that move you. Sometimes those forces wear the mask of a story we have already outgrown. The work of the seminar, then, is not just to find the true story, but to learn how to change the momentum when the story lies.
