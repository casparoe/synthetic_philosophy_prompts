answer: |-
  Here is the specification of adequacy conditions for a theory of dispositions, tailored to your two purposes (truth-conditions for regulation/engineering and ontological weight for explanation) and constrained by your specific cases.

  ### I. The Requirements List

  For each requirement, I specify the **Case** that motivates it, the **Requirement** itself, and its **Status** (Genuine Desideratum vs. Camp Prejudice).

  **1. The Separation Constraint**
  *   **Case:** Finks (basis destroyed by stimulus) and Masks (manifestation blocked by interference).
  *   **Requirement:** The theory must distinguish the *possession* of the disposition from the *occurrence* of the manifestation. A thing can have the disposition without manifesting (mask), and lack the disposition even if it manifests (mimic/fink).
  *   **Status:** **Genuine Desideratum.** Any theory that collapses possession into manifestation (like the Simple Conditional Analysis) fails to track the stability required for engineering specs (e.g., a fault-tolerant cluster is still fault-tolerant even if no faults occur).

  **2. The Probabilistic Integrity Constraint**
  *   **Case:** Irreducibly chancy manifestations (Radium decay).
  *   **Requirement:** The theory must accommodate manifestations that are not determined by the stimulus + basis, without reducing the probability to ignorance. The "stimulus" here may be null or temporal; the "manifestation" is the event occurring within a window.
  *   **Status:** **Genuine Desideratum.** Quantum mechanics is non-negotiable. A theory requiring deterministic conditionals is empirically false.

  **3. The Self-Consumption Constraint**
  *   **Case:** One-shot dispositions (Fragility, Self-sealing tyres).
  *   **Requirement:** The theory must allow the manifestation to alter or destroy the categorical basis without rendering the disposition ascription false *ex post facto*. The truth of "X was fragile" cannot depend on X surviving the shattering.
  *   **Status:** **Genuine Desideratum.** Essential for safety engineering and materials science.

  **4. The Stimulus Individuation Constraint**
  *   **Case:** The Selective Fink (Guardian repairs only above threshold).
  *   **Requirement:** The theory must provide a non-arbitrary principle for distinguishing between a *complex stimulus condition* (e.g., "impact > threshold without guardian") and a *standard stimulus + external interference*. It cannot simply push all interference into the *ceteris paribus* clause or the stimulus definition becomes trivial ("impact that causes breaking").
  *   **Status:** **Genuine Desideratum.** Without this, regulatory thresholds become unfalsifiable.

  **5. The Locality of Basis Constraint**
  *   **Case:** The Distributed Bearer (Server clusters, Colonies).
  *   **Requirement:** The theory must allow the "basis" of the disposition to be relational, structural, or systemic, rather than intrinsic to a fundamental simple. The bearer can be a composite system where no part possesses the disposition.
  *   **Status:** **Camp Prejudice (Intrinsicist).** Traditional metaphysics (Lewis, Martin) demands dispositions be intrinsic. However, for your Purpose 1 (engineering/regulation), this is a **Genuine Desideratum**. If the theory demands intrinsic bases, it cannot account for systemic robustness.

  **6. The Explanatory Non-Circularity Constraint**
  *   **Case:** Purpose 2 (Explanation vs. Redescription).
  *   **Requirement:** Ascribing the disposition must provide information over and above the conditional "If S, then M." The disposition must be the *ground* of the conditional, not a label for it.
  *   **Status:** **Camp Prejudice (Humean).** Humeans reject this, viewing dispositions as summaries of regularities. Realists demand it. For your Purpose 2, this is a **Genuine Desideratum**.

  **7. The Non-Dispositional Specification Constraint**
  *   **Case:** General adequacy (Defining the *ceteris paribus* conditions).
  *   **Requirement:** The *ceteris paribus* clauses (conditions under which the manifestation occurs) must be specifiable in non-dispositional, categorical terms.
  *   **Status:** **Camp Prejudice (Humean/Reductionist).** As you suspected, this is negotiable. Dispositional Essentialists argue the world is inherently dispositional; demanding non-dispositional clauses begs the question against them.

  ---

  ### II. Incompatibilities (What Blows Up)

  You cannot satisfy all requirements simultaneously. Here are the critical tensions:

  **1. Intrinsicness vs. Distributed Bearer**
  *   **Conflict:** If you enforce **Requirement 5 (Locality)** as "The basis must be intrinsic to the bearer," you automatically fail the **Distributed Bearer** case.
  *   **Resolution:** You must either deny that clusters/colonies are genuine bearers (reductionism) or reject the Intrinsicness prejudice. For your purposes, Intrinsicness must go.

  **2. Non-Dispositional CP vs. Explanatory Power**
  *   **Conflict:** If you enforce **Requirement 7 (Non-Dispositional Specification)**, you generally force a reduction of dispositions to categorical conditionals. This collapses the distinction between the disposition and its manifestation conditions, undermining **Requirement 6 (Explanatory Non-Circularity)**.
  *   **Resolution:** To keep explanatory power, you must allow *ceteris paribus* clauses to reference other dispositions (e.g., "provided no interfering dispositions are active").

  **3. Strict N&S Conditions vs. Masking/Finking**
  *   **Conflict:** If you demand **Necessary and Sufficient Conditions** for disposition ascription (via conditionals), you struggle with **Requirement 1 (Separation)**. Masks and Finks show that the conditional can be false while the disposition is true, and vice versa.
  *   **Resolution:** You must move from strict conditionals to *tendencies*, *powers*, or *counterfactuals with rigidified bases*, abandoning the hope for simple N&S truth conditions.

  **4. Stimulus Individuation vs. Triviality**
  *   **Conflict:** In the **Selective Fink** case, if you define the stimulus too broadly ("any impact"), you count the guardian as a mask. If you define it too narrowly ("impact without guardian"), the disposition becomes trivial (true by definition).
  *   **Resolution:** The theory needs a notion of *normal conditions* or *standard interference* that is not merely ad hoc. This often requires a teleological or functional component (what is the system *for*?), which introduces new metaphysical baggage.

  ---

  ### III. The Single Requirement That Excludes the Most Candidates

  **The Demand for Non-Dispositional Specification of Ceteris Paribus Clauses.**

  *   **Why:** This is the graveyard of disposition theories.
      *   It kills **Dispositional Essentialism** (Bird), which holds that properties are inherently powerful.
      *   It kills **Mutual Manifestation Views** (Molnar, Handfield), where manifestations depend on partner dispositions.
      *   It kills **Sophisticated Conditional Analyses** (Lewis), which eventually rely on causal bases that are themselves dispositional.
      *   It leaves only **Humean Regularity Views** and **Simple Conditional Analyses**, both of which fail your **Explanatory Non-Circularity** and **Separation** constraints.
  *   **Verdict:** If you keep this requirement, you have no theory that satisfies Purpose 2 (Explanation). If you drop it, you open the field to Power Realism and Essentialism.

  ---

  ### IV. Scorecard of Usual Suspects

  *   **Simple Conditional Analysis (SCA):** Fails **Separation** (Finks/Masks) and **Probabilistic Integrity**. Good for engineering shorthand, useless for explanation.
  *   **Revised Conditional Analysis (Lewis):** Handles **Finks** via causal bases, but struggles with **Selective Finks** without circularity. Fails **Explanatory Non-Circularity** (still reductionist).
  *   **Mutual Manifestation Views (Molnar/Handfield):** Excellent on **One-Shot** and **Chancy** cases. Struggles with **Distributed Bearer** if they insist on pairwise partner relations rather than systemic structures.
  *   **Dispositional Essentialism (Bird):** Passes **Explanation** and **Separation**. Fails **Non-Dispositional CP** (by design). Can handle **Distributed Bearer** if structural properties are accepted as powerful.

  ### Summary Recommendation for Your Intro
  To nail the spec: Explicitly reject **Intrinsicness** (to save the Distributed Bearer) and **Non-Dispositional CP Clauses** (to save Explanation). Accept that you cannot have strict Necessary and Sufficient conditions in categorical terms. Your theory will likely need to be a **Realist Power Theory with Systemic Bases**. This clears the deck of Humean reductions before you begin.
