      *(Self-Correction during drafting)*: Wait, the prompt asks me to "Read the film against LoTH seriously... and say where the reading holds and where it breaks." I should structure the response to directly answer the four numbered points while keeping the overarching thesis (Arrival vs. LoTH) in mind.

      *Refining Point 1 (Constraints):* Focus on how non-linear time breaks the sequential nature of computational processing implied by LoTH.
      *Refining Point 2 (Primitives):* Focus on the "acquirability" of the primitives. If Mentalese is innate, how can we learn alien primitives that change temporal perception?
      *Refining Point 3 (Holism):* This is the strongest technical point. LoTH *requires* compositionality. Heptapod B *appears* non-compositional. If thought becomes like Heptapod B, LoTH is dead.
