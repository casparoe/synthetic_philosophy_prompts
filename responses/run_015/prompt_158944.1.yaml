      *   *Refining 3 (Symmetry):* Demanding full symmetry is often impossible in history (path dependence). But *Asymmetric Support* is dangerous. Let's require *Counterfactual Robustness*: The cause must be necessary in F and potentially sufficient in C (conceptually), even if we can't test both empirically.
      *   *Refining 4 (Independence):* Galton's Problem. If F and C interact, they aren't independent data points. But in history, interaction *is* the mechanism sometimes (competition). So, *Causal Closure*: We must account for the interaction, not pretend it doesn't exist.
      *   *Refining 5 (Timing):* Crucial. If the cause existed in 1600 but the effect happened in 1750, why the lag? *Temporal Specificity*.
      *   *Refining 6 (Transportability):* This is about *Generalizability*. But historical explanations are often specific. Let's focus on *Difference-Making Power*. Common causes are background conditions, not explanatory variables for the *difference*.
      *   *Refining 7 (Levels):* "Integration" is often a code for "make my dissertation longer." A single level is fine *if* it doesn't presuppose the unexplained level. *Non-Presupposition*.
