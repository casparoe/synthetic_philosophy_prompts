answer: |-
  ### Specification of Desiderata for Contrastive Historical Explanation

  **Standard of Adequacy:** An explanation meets the standard if a negative finding (the cause was absent in *F*, or present/ineffective in *C*) would fundamentally alter the causal model rather than merely requiring a footnote. The hypothesis must be specific enough to be falsified by primary sources, but robust enough that falsification yields theoretical insight.

  Here are the adjudicated desiderata, re-cut into three domains: **Validity of the Contrast**, **Structure of the Mechanism**, and **Empirical Adequacy**.

  ---

  #### I. Validity of the Contrast

  **1. Functional Homogeneity of the Contrast Class (Non-Negotiable)**
  *   **Motivation:** Your Point 1 (Natural vs. Gerrymandered) and Point 8 (Shared Baseline).
  *   **Specification:** *C* must be a class of cases that failed to achieve outcome *Y* despite possessing the *functional capacity* to do so. If *C* failed because it lacked the basic preconditions for *Y* (e.g., access to maritime trade), it is not a valid contrast for *F*'s success, but a control for necessity.
  *   **The Test:** Can you identify a specific period and region within *C* (e.g., 17th-century Izmir or Aleppo) where the functional capacity for *F*'s outcome (commercial sophistication, fiscal extraction) was empirically present but the outcome did not follow?
  *   **Status:** **Non-Negotiable.** If *C* is functionally incapable of *F*, the question "Why F and not C?" collapses into "Why F and not a place that couldn't be F?" This renders three years of work deflationary.
  *   **Application:** For Dutch vs. Ottoman, you cannot compare "The Netherlands" to "The Ottoman Empire." You must compare "Amsterdam" to "Izmir/Thessaloniki." If the Ottoman arm is defined as an agrarian empire, the contrast is invalid. It must be defined as a commercial node that failed to transition.

  **2. Accounted-for Interdependence (Non-Negotiable)**
  *   **Motivation:** Your Point 4 (Separation of Arms).
  *   **Specification:** You cannot demand statistical independence (Galton's Problem) in a connected world. Instead, the explanation must explicitly model the interaction. Did *F*'s success actively depress *C*'s outcome (zero-sum competition), or did they diverge independently?
  *   **The Test:** Does the archival record show *F* capturing market share *from C*, or *F* growing in a sector *C* abandoned?
  *   **Status:** **Non-Negotiable.** Ignoring coupling makes the counterfactual "What if C had F's cause?" incoherent. If *F* succeeded by blocking *C*, giving *C* *F*'s cause wouldn't help *C*.
  *   **Application:** If Dutch success relied on shutting Ottomans out of the Baltic grain trade, then "Ottoman institutions" cannot be the sole explanation for Ottoman stagnation.

  ---

  #### II. Structure of the Mechanism

  **3. Asymmetric Difference-Making (Non-Negotiable)**
  *   **Motivation:** Your Point 6 (Transportability vs. Difference-Making).
  *   **Specification:** The candidate cause *X* must be shown to be **present and effective in *F*** AND **(absent OR present but blocked/ineffective in *C*)**. Factors present in both are background conditions, not explanations for divergence.
  *   **The Test:** Can you find evidence of *X* in *C*? If yes, can you demonstrate why *X* failed to produce *Y* in *C*?
  *   **Status:** **Non-Negotiable.** This is the primary filter for "Three-Year" worthiness. If you spend three years proving *F* had property rights, but find *C* also had enforceable property rights, your explanation is dead. The work must focus on the *difference in effect*, not just presence.
  *   **Application:** Both Dutch and Ottomans had joint-stock-like structures (e.g., *ma'una*). An explanation citing "corporate form" fails unless it specifies why the Dutch form scaled and the Ottoman form did not.

  **4. Temporal Specificity (Non-Negotiable)**
  *   **Motivation:** Your Point 5 (Diachronic Adequacy).
  *   **Specification:** The cause *X* must emerge or become decisive *at the time of divergence*. If *X* existed in *F* for a century before the outcome, it is a necessary condition, not a trigger.
  *   **The Test:** Can you date the instantiation of *X* to within a window that correlates with the take-off?
  *   **Status:** **Non-Negotiable.** "Deep" causes (culture, long-term institutions) usually fail this. If the "Protestant Ethic" existed in 1600, why did the divergence snap in 1650?
  *   **Application:** If you argue "fiscal centralization" caused Dutch success, you must show centralization increased *precisely* when shipping tonnage exploded, not that it existed generally.

  **5. Mechanism Stability over Contrast Invariance (Preference)**
  *   **Motivation:** Your Point 2 (Invariant vs. Relative).
  *   **Specification:** Do not demand the *same* cause explains *F* against *C1* (Ottomans) and *F* against *C2* (France). Demand that the *mechanism* (e.g., "lower transaction costs") is stable, even if the specific institutional instantiation varies.
  *   **The Test:** Does the explanation rely on a specific label ("Calvinism") or a functional process ("risk mitigation")?
  *   **Status:** **Preference (Methodological Camp).** Strict invariance leads to vague, universal theories. Contrast-relativity is acceptable if the mechanism is precise. However, if the explanation changes *completely* depending on *C*, you are describing *F*, not explaining *F*.
  *   **Application:** You may find the Dutch diverged from Ottomans due to *credit access*, but from French due to *fuel costs*. This is acceptable if "capital allocation efficiency" is the unifying mechanism.

  ---

  #### III. Empirical Adequacy

  **6. Microfoundational Closure (Preference)**
  *   **Motivation:** Your Point 7 (Level and Integration).
  *   **Specification:** You do not need to integrate all levels (culture + institutions + geography). However, you cannot posit a macro-cause (e.g., "State Formation") without specifying the micro-mechanism (e.g., "how state bonds changed merchant behavior").
  *   **The Test:** Can you trace the causal chain from the variable to the individual decision without a "black box"?
  *   **Status:** **Preference.** Institutionalists demand this; some structuralists do not. However, for a "Three-Year" test, microfoundations are where the archives live.
  *   **Application:** Don't just say "Ottoman state was extractive." Show a specific tax farm contract that disincentivized long-term investment compared to a Dutch bond.

  **7. Symmetric Counterfactual Support (Preference)**
  *   **Motivation:** Your Point 3 (Symmetry).
  *   **Specification:** Ideally, show that removing *X* from *F* stops *Y*, and adding *X* to *C* starts *Y*. In practice, demanding both is often impossible.
  *   **The Test:** Is at least one direction robustly supported by evidence (e.g., a natural experiment in *F* where *X* was removed)?
  *   **Status:** **Preference.** Demanding full symmetry often leads to speculative modeling rather than archival work. Prioritize **Necessity in F** (Removing *X* kills *Y*) as it is more testable in the focal case archives.
  *   **Application:** It is easier to find Dutch records showing a crisis when credit tightened (Necessity) than to prove Ottomans *would* have grown if credit loosened (Sufficiency).

  ---

  ### Incompatibilities and Trilemmas

  **1. Contrast Stability vs. Causal Specificity**
  *   **Conflict:** If you broaden the contrast class to ensure **Functional Homogeneity** (Desideratum 1) — e.g., "All early modern commercial hubs" — you increase the variance in outcomes, making it harder to find a **Specific Mechanism** (Desideratum 4/6) that fits all cases. If you narrow the contrast for specificity (Amsterdam vs. Izmir), the contrast becomes fragile and potentially gerrymandered.
  *   **Resolution:** You must accept **Contrast-Relativity** (Desideratum 5). Acknowledge that the explanation for Dutch/Ottoman divergence may not hold for Dutch/French divergence. Do not claim a "Theory of Modern Growth"; claim a "Theory of 17th-Century Levantine Divergence."

  **2. Independence vs. Interaction**
  *   **Conflict:** You cannot satisfy **Accounted-for Interdependence** (Desideratum 2) and maintain the statistical logic of independent cases. If *F* and *C* are causally coupled, they are a single system, not two data points.
  *   **Resolution:** Abandon the pretense of independent cases. Treat the *F-C* pair as a single unit of analysis (a system of trade). The "cause" is not a variable within *F*, but a structural feature of the *F-C* relationship (e.g., terms of trade, naval hegemony).

  **3. The "Three-Year" Trilemma**
  *   You can have **Temporal Specificity**, **Asymmetric Difference-Making**, or **Microfoundational Closure**. You likely cannot have all three.
      *   To prove **Asymmetry**, you need deep archives in *C* (Ottoman), which are often fragmentary.
      *   To prove **Temporal Specificity**, you need high-frequency data (prices, shipments) which may not exist for *C*.
      *   To prove **Microfoundations**, you need individual ledgers/contracts, which may be scattered.
  *   **Recommendation:** Prioritize **Asymmetric Difference-Making**. It is the logical core of the "Why F rather than C" question. Sacrifice Temporal Specificity (allow a wider window) or Microfoundations (stay at the firm level, not individual) if the archives force you to.

  ---

  ### Conclusion on the Question

  If you find that **Functional Homogeneity** cannot be established (i.e., there is no Ottoman commercial node that was functionally comparable to Amsterdam in capacity but failed to transition), then the question "Why Dutch and not Ottoman?" is **ill-posed**.

  **Conclusion:** You should not answer the question. You should reframe it.
  *   *Bad Reframe:* "Why did Europe succeed and Islam fail?" (Deflationary, essentialist).
  *   *Good Reframe:* "Under what conditions did commercial sophistication translate into sustained capital accumulation in the 17th century?" (Shifts from *cases* to *mechanisms*).
  *   *Action:* If the Ottoman arm lacks the baseline capacity, drop the Ottoman Empire as the contrast. Compare Amsterdam to Genoa, or Amsterdam to London. Use the Ottoman case only as a boundary condition (where the mechanism broke).

  ---

  ### The Exclusionary Desideratum

  The single desideratum that excludes the largest share of usual families of answers (resource endowments, institutions, culture, state formation, pure contingency) is:

  **Asymmetric Difference-Making (Desideratum 3).**

  **Why:**
  *   **Resource Endowments:** Ottomans had coal, minerals, and grain. Unless you prove these were *inaccessible* due to a specific mechanism present in F but not C, "resources" fails the asymmetry test.
  *   **Institutions:** Both had property rights, courts, and contract enforcement. Unless you prove the Ottoman version was *functionally inert* for this specific outcome (not just "different"), the explanation fails. Most institutionalism lists presence in F, not absence/inefficacy in C.
  *   **Culture:** Rarely testable for asymmetry. Hard to prove "Ottoman culture prevented X" without proving "Dutch culture enabled X" in a way that isn't circular.
  *   **State Formation:** Both had fiscal states. The "fiscal-military state" argument fails unless you show the Ottoman fiscal apparatus actively *suppressed* the specific commercial outcome, rather than just failing to promote it.
  *   **Contingency:** By definition, contingency cannot demonstrate asymmetric necessity.

  **Teeth:** This requirement forces you out of the Dutch archives and into the Ottoman archives. You cannot spend three years proving the Dutch had bills of exchange. You must spend three years proving the Ottomans *could not use* bills of exchange for long-term capital, or that they did but it didn't work. That is the work that justifies the dissertation.
