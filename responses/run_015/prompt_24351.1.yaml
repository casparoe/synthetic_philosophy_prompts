answer: |-
  Your diagnosis is sharp, and you are correctly sensing that the surface-level argument (logic vs. ad hoc clauses) is a proxy for a deeper conflict. However, I would refine your hypothesis slightly. The disagreement isn't merely about where to draw the line between "serious" and "ad hoc" theories. That line-drawing is the *symptom*, not the *disease*.

  The stalemate is a **Meta-Normative Disagreement about the Function of Theoretical Virtues.**

  Here is the breakdown of why the debate is stuck, what kind of disagreement this is, and what actual progress would look like.

  ### 1. The Diagnosis: It is a Meta-Normative Disagreement

  You asked if this is verbal, empirical, or substantive. It is **substantive**, but specifically **meta-normative**.

  Both sides agree on the logic: Yes, you can construct empirically equivalent rivals. Both sides agree on the history: Yes, there are cases like Newton vs. Cartesian vortices (at the time) or matrix vs. wave mechanics.

  The split occurs on the **epistemic weight of theoretical virtues** (simplicity, coherence, unity, non-ad-hocness).

  *   **The Deflater/Realist Camp:** They argue that virtues like simplicity are *truth-conducive* (or at least rationality-constraining). When they dismiss the "trivial" rival (e.g., $T + \text{observation clause}$) as "ad hoc," they are making a substantive claim: *A theory that lacks unity is irrational to believe, regardless of empirical fit.* For them, "serious theory" means "theory that satisfies rational constraints beyond empirical adequacy."
  *   **The Quinean/Anti-Realist Camp:** They argue that virtues are *pragmatic* or *aesthetic*. They are useful for calculation or psychology, but they do not track truth. Therefore, if logic allows two theories, rationality allows two theories. Dismissing the rival as "ad hoc" is just begging the question by smuggling in a preference for simplicity as if it were a logical rule.

  **Why this causes a stalemate:**
  The debate looks like it's about *underdetermination*, but it's actually about *scientific rationality*.
  *   If you believe simplicity tracks truth, underdetermination is solved (you pick the simpler one).
  *   If you believe simplicity is just utility, underdetermination is real (you have no truth-tracking reason to pick one).

  Neither side can move because to concede on underdetermination is to concede on the nature of rationality. The "triviality objection" is just the Realist saying, "That rival violates the norms of rationality." The Quinean reply is, "Those norms aren't truth-tracking." They are talking past each other because they are operating with different **teleologies of science** (Truth vs. Empirical Adequacy).

  ### 2. Why it isn't (just) Empirical or Verbal

  *   **Not Purely Empirical:** You might think, "Just go check history! Do non-trivial pairs exist?" (This is Kyle Stanford's *Exceeding Our Grasp* approach). But even if historians find a "smoking gun" case of two serious, non-ad-hoc theories coexisting with equal evidence, the Realist will say, "Eventually one was proven better by deeper virtues," and the Anti-Realist will say, "No, it was just sociological preference." The *interpretation* of the empirical data is theory-laden by the meta-normative commitments described above.
  *   **Not Purely Verbal:** It's not just that they define "theory" differently. They define it differently *on purpose* to serve their meta-normative goals. A Realist defines "theory" to include explanatory depth because they care about ontology. An Empiricist defines "theory" as an instrument for prediction because they care about observables. Changing the definition won't solve the conflict; it just hides it.

  ### 3. What Would Count as Progress?

  Given that this is a meta-normative stalemate, standard philosophical argumentation (intuition pumping) will not work. Progress requires changing the terrain. Here are three specific avenues where progress is actually possible, ranked from most promising to least.

  #### A. Formal Epistemology (The "Ockham's Razor" Route)
  This is the most concrete path to progress. Instead of arguing intuitively about whether simplicity tracks truth, we use formal learning theory to prove it.
  *   **The Work:** Kevin Kelly (Carnegie Mellon) has done work showing that following Ockham's Razor is the most *efficient* strategy for converging on the truth in certain formal models, even if you don't assume simplicity is true *a priori*.
  *   **The Progress:** If it can be formally demonstrated that adhering to specific theoretical virtues minimizes the number of "mind changes" required to reach the truth, the "pragmatic vs. truth-tracking" distinction collapses. Simplicity becomes a *methodological necessity* for truth-seeking, not just an aesthetic preference.
  *   **Requirement:** A theorem showing that non-trivial underdetermination is transient under specific learning conditions.

  #### B. Localism (The "Dissolution" Route)
  Progress comes from abandoning the global question ("Is science underdetermined?") for local questions ("Is *this specific domain* underdetermined?").
  *   **The Work:** Moving away from Quine's "total web of belief" (which guarantees global underdetermination) to specific model comparisons in physics or biology.
  *   **The Progress:** Acknowledging that underdetermination is a **gradient**, not a binary. In particle physics, it might be high; in organic chemistry, it might be negligible.
  *   **Requirement:** A taxonomy of scientific domains ranked by their susceptibility to underdetermination, based on the availability of "crucial experiments" or structural constraints. This turns a metaphysical problem into a methodological one.

  #### C. The "Unconceived Alternatives" Shift (The Empirical Route)
  This shifts the burden from *logical possibility* to *historical probability*.
  *   **The Work:** Kyle Stanford's argument that the problem isn't that we *can* conceive of rivals (logic), but that we *have failed* to conceive of rivals that turned out to be true (history).
  *   **The Progress:** This bypasses the "triviality objection." It doesn't matter if you can cook up a trivial rival; what matters is that history shows serious rivals are often invisible to the current paradigm.
  *   **Requirement:** Robust historical case studies that demonstrate the *mechanism* by which serious alternatives are suppressed or unnoticed, independent of their empirical fit.

  ### 4. Why the Impasse Might Be Structural

  If none of the above happens, the impasse is likely **structural** for the following reason:

  The debate is a **Proxy War for Scientific Realism.**
  Underdetermination is the Anti-Realist's primary weapon. Realism is the Realist's primary goal.
  *   If the Anti-Realist concedes that underdetermination is "trivial" or "resolved by virtues," they lose the argument for Instrumentalism.
  *   If the Realist concedes that underdetermination is "robust" and "normatively significant," they lose the argument for Truth.

  Because the stakes are the *definition of scientific success*, neither side can afford to move on the definitions. The "serious vs. ad hoc" line is the trench line. To move the line is to surrender territory in the larger war.

  **Conclusion:**
  You are right that the disagreement hinges on the "serious/ad hoc" distinction, but that distinction is rigid because it is doing the heavy lifting for incompatible views on the **goal of science**.

  **Progress is only possible if:**
  1.  **Formalization:** We can prove that "seriousness" (virtues) is mathematically linked to convergence on truth (Kelly).
  2.  **Localization:** We stop asking if *Science* is underdetermined and ask if *Quantum Gravity* is underdetermined.
  3.  **Dissolution:** We agree that "Truth" is not the metric for scientific success, rendering the underdetermination of truth irrelevant (a Pragmatist dissolution).

  Without one of these shifts, the debate will remain a 40-year loop because it is not actually a debate about evidence or logic; it is a debate about whether science is in the business of describing the world or saving the phenomena. Until that teleological question is settled, the underdetermination debate cannot be.
