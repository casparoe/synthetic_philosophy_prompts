      *   *Constraint Question:* Do prioritarians rule out $-1/w$? Most standard formulations use power functions ($w^{1-\epsilon}$) or log. They avoid singularities at zero if possible, or accept that extreme priority is plausible *if* the bottom is truly desperate. But "wasteful transfer" is generally seen as a bug, not a feature. This is the "Lexical Prioritarianism" vs. "Moderate Prioritarianism" debate.

