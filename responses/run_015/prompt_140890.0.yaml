          *   What about Square Root? $\sqrt{500} - \sqrt{1000} \approx 22.36 - 31.62 = -9.26$. $\sqrt{2} - \sqrt{1} \approx 1.41 - 1 = 0.41$. Net negative. Rejects transfer.
          *   So the result *does* depend on the curvature (degree of concavity).
