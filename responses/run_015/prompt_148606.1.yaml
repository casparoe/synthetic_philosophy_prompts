      *   (5) says: "If guilt can be inherited... it attaches to every successive generation."
      *   (7) says: "Membership in *any* persistent collective... makes one guilty."
      *   The block should be on **(7)**. Political guilt is specific to the *State* (the apparatus of power), not *any* collective (ethnic/religious).
      *   *But is that enough?* If I am a US citizen today, am I guilty for US slavery? The argument says yes. Is that absurd? Many political philosophers say "No, not guilty, but responsible for repair."
