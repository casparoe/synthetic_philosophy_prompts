      *Self-Correction on Step 6 vs 7:* Step 6 says "If agency... not necessary... then moral responsibility no longer requires agency." This is the category error. Political responsibility doesn't require agency. Moral responsibility does. Step 6 claims the former negates the latter. That's the slip. Step 7 expands the scope. I will focus on 6 as the philosophical heart of the error, and 7 as the structural overreach.

