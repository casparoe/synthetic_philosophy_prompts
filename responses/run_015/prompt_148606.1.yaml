      *   If "Guilt" = "Liability for Repair," then (8) doesn't follow. Being liable for repair doesn't mean you are universally stained. It means you have a debt.
      *   If "Guilt" = "Moral Blame," then (4) is false (you can't inherit blame).
      *   The classmate wants to keep (4). So she must accept that "Guilt" here means "Liability," not "Blame."
      *   Therefore, the argument fails at **Step (6)** because it assumes that inheriting political guilt undermines the agency condition for *moral* responsibility. It doesn't. It establishes a different category: *Political Liability*.

      *   *Let's check the Jaspers text specifically.* Jaspers says political guilt is incurred by all citizens. It is paid by loss of power, reparations, etc. It *can* be inherited by the successor generation (the new Germany must pay for the old Germany). But this is not moral guilt.
      *   The student's argument treats "Political Guilt" as if it carries the weight of "Moral Guilt" in Step (6).
      *   So the error is an **Equivocation on "Guilt"** between Steps (4) and (6).
      *   In (4), "Guilt" = Political Liability (collective).
      *   In (6), "Guilt" is treated as Moral Blame (requires agency).
      *   By sliding between these, the argument generates the *reductio*.

  6.  **Developing the Response:**
      *   **Acknowledge the sophistication:** This is a classic problem in transitional justice and collective responsibility (referencing Jaspers, Arendt, maybe later thinkers like Waldron or Thompson).
      *   **Identify the Slip:** The equivocation occurs between **Political Liability** and **Moral Blame**. Specifically, Step (6) smuggles in a moral conception of guilt into a political framework.
      *   **Analyze the Cost:** To fix this, the classmate must concede that "Political Guilt" is not "Moral Guilt." It is a debt/obligation.
      *   **Address the Classmate's Commitments:** She can keep (2) and (4) *if* she redefines what is inherited. It's not "sin," it's "debt."
      *   **Address Step (7):** Also, Step (7) overgeneralizes. Political guilt applies to *states* (coercive power structures), not *ethnic/religious* groups. This blocks the "universal stain."
      *   **Conclusion:** The argument fails at (6) and (7). You can have intergenerational political liability without universal moral guilt.

