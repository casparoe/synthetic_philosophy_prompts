answer: |-
  **Project Title:** Universalizability as Systematic Consistency: A Set-Theoretic Reformulation of Kant's Formula of Universal Law

  **Project Summary**
  This project proposes a structural reformulation of Kant's Formula of Universal Law (FUL). Standard interpretations treat the universalizability test as a decision procedure applied to individual maxims in isolation. This approach faces two persistent objections: the *individuation problem* (verdicts flip based on maxim description) and the *competition problem* (maxims to compete for scarce goods appear to generate contradictions in conception). I hypothesize that both problems arise from treating the test as a property of single maxims rather than a consistency constraint on a *set* of maxims. Over three months, I will formalize a "maxim-set" constraint—asking not "Can this maxim be universalized?" but "Can this maxim belong to a set of maxims that every agent could adopt at once such that their purposes are jointly satisfiable?"—and test it against a specific battery of cases.

  **Research Question**
  Can a set-based consistency constraint resolve the individuation and competition problems of the FUL without relying on ad-hoc adjustments to maxim descriptions or independently motivated adequacy conditions?

  **Background and Problem Statement**
  The FUL is standardly read in three ways, all of which stall on the problems above.
  1.  **Logical-Contradiction Reading:** Universalization generates a logical contradiction (e.g., promises cease to exist). *Failure:* It is too weak. Many immoral maxims are logically consistent when universalized; conversely, competition maxims (e.g., "I will apply for this job") appear logically inconsistent if universalized because not all can succeed.
  2.  **Teleological Reading:** The contradiction lies in the will, turning on necessary ends of rational agency. *Failure:* It relies on contentious claims about what rational agents must will, often smuggling in consequentialist reasoning to rule out competition.
  3.  **Duty-Generation Reading:** The test is a procedure for deriving specific duties. *Failure:* It cannot determine which duty is derived without first solving the individuation problem. If I describe my maxim as "break promises when beneficial," it fails; if "break promises when a friend is in trouble," it passes. There is no non-ad-hoc rule for the operative description.

  My proposal shifts the unit of analysis from the single maxim ($M$) to the maxim-set ($\{M_1, M_2... M_n\}$). A maxim is defined as a triple: <Condition, Action, Purpose>. The test becomes: Is there a possible world where every agent satisfying the Condition performs the Action for the Purpose, such that the Purposes in the set are jointly satisfiable? This reframes individuation as a question of which set is relevant, and competition as a question of purpose-compatibility rather than action-repeatability.

  **Methodology and Work Plan**
  The project is divided into three months of full-time research.

  **Month 1: Formalization and Definitions**
  I will construct the formal constraints for the maxim-set model. Three specific decisions must be made and fixed before testing:
  1.  **Cash out "Purpose":** I will define purpose functionally as the state of affairs the agent intends to bring about, distinguishing between *constitutive* purposes (the action itself constitutes the end) and *instrumental* purposes (the action causes the end).
  2.  **Adoption vs. Permission:** I will adopt the "Universal Adoption" reading (everyone *does* adopt the maxim) rather than "Universal Permission," as the latter collapses into a rule-utilitarian calculation.
  3.  **Second-Order Maxims:** I will formalize how schemata like "Adopt whatever maxim is most expedient" enter the set. The hypothesis is that universalizing this schema creates a set where the purpose (expediency) is self-defeating because universal expediency-seeking creates a zero-sum environment where expediency is impossible to secure.

  **Month 2: Case Testing**
  I will apply the formalized constraint to four specific cases. The goal is to see if the model yields stable verdicts without tweaking the maxim descriptions mid-stream.
  1.  **The Jacket on the Chair:** Maxim: <I see a table, I place my jacket, Purpose: Reserve seat>. Under the set-model, if everyone does this, the practice of "reserving" via objects collapses. Verdict: Impermissible.
  2.  **Ad Blockers:** Maxim: <I visit ad-supported site, I block ads, Purpose: Consume content without cost>. If universalized, the site ceases to exist. Verdict: Impermissible (purpose defeated).
  3.  **Ticket Scalping:** Maxim: <I see last ticket, I buy to resell, Purpose: Profit>. If universalized, no one buys for consumption, market collapses. Verdict: Impermissible.
  4.  **Strategic Voting:** Maxim: <I prefer Candidate A, I vote for B, Purpose: Prevent worst outcome>. This is the critical test. My hypothesis is that the set-model classifies this as a *coordination failure*, not a contradiction in conception. Unlike the lying promise, the purpose (influencing the outcome) is not logically defeated by universal adoption, only instrumentally made more difficult. The proposal commits to the line that strategic voting is permissible under FUL, distinguishing it from cases where the institution itself dissolves.

  **Month 3: Evaluation and Drafting**
  I will analyze the results against the adequacy conditions.
  *   **Success:** The model recovers the intuitive verdicts on the test cases without requiring *post-hoc* redescription of the maxims. The individuation problem is solved because the "relevant set" is determined by the intersection of conditions, not agent choice.
  *   **Failure:** A "no-go" result. This occurs if the set-based reformulation merely relocates the individuation problem (e.g., ambiguity in which set is the "relevant" one) or if the model only works by tuning the definition of "joint satisfiability" to match pre-existing intuitions. I will explicitly document if the model requires independent moral premises to function, as this would indicate the FUL cannot stand as a standalone decision procedure.

  **Scope and Limitations**
  This project is strictly limited to the structural logic of the universalizability test.
  1.  **No Textual Exegesis:** I am not arguing that this is what Kant *meant* in the *Groundwork* or *Critique of Practical Reason*. I am arguing this is what the test *requires* to function philosophically.
  2.  **No Full Ethical Derivation:** I am not attempting to derive a complete normative system or solve the Contradiction in the Will vs. Contradiction in Conception distinction broadly. The focus is solely on the Contradiction in Conception mechanism as it pertains to individuation and competition.
  3.  **Timeframe:** The three-month limit restricts the case studies to the four listed above plus the second-order maxim analysis. I will not expand to complex bioethical or geopolitical cases.

  **Significance**
  Even a negative result is valuable. If the set-based reformulation fails to solve individuation without circularity, it demonstrates that the FUL cannot be repaired structurally and requires external moral input. If successful, it offers a robust defense of Kantian ethics against the "scarce goods" objection, preserving the deontological core while acknowledging the systemic nature of moral reasoning. This fits the scope of a summer grant: a focused, high-risk/high-reward structural analysis that produces a determinate answer to a specific logical problem.
