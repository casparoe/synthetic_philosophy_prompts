answer: |-
  Here is the agenda, stripped of bibliography and framed for a one-year pre-dissertation sprint.

  ### The Criteria

  I am ranking these based on three metrics, weighted in this order:

  1.  **Upstream Dependency (Leverage):** If this question is answered (or dissolved), does it determine the viability of the others? A high-leverage question is a gatekeeper; if you get it wrong, the rest of the architecture collapses.
  2.  **Dialectical Vulnerability (The "Friend" Test):** Which question is the point where the "shell game" objection actually bites? You need to spend your year fortifying the weakest wall, not the highest one.
  3.  **Conceptual Tractability:** Given your constraints (no heavy formalism, one year), which questions can be advanced via armchair argument and existing decision-theoretic tools rather than requiring new formal proofs or empirical data?

  **The Trade-off:** High leverage often correlates with low tractability (the hard metaphysical problems). High tractability often correlates with low leverage (applied corollaries). The strategy here is to prioritize Leverage and Vulnerability, accepting that Tractability will be the bottleneck you manage, not the selector you optimize for.

  **The Drop:** **(c) The Aggregation Order Problem.**
  *Defense:* This is downstream. It presupposes that the individual-level idealization (a, b, d) is coherent. If the ideal advisor model fails for a single agent, it doesn't matter whether you aggregate before or after idealization; the inputs are already poisoned. Furthermore, this drifts rapidly into social choice theory and political liberalism, which dilutes your metaethical focus. Save this for the second book.

  ---

  ### The Ordered Agenda

  #### 1. The Baseline/Vacuity Cluster (Items a & d)
  **Priority:** Critical. Spend 5–6 months here.
  **Why:** These are not distinct questions; (d) is the formal constraint on (a). Your friend's "shell game" objection lands here. To define "idealization," you must specify what is held fixed (values, psychology, abstract aims) and what is improved (logic, information, coherence).
  *   **The Trap:** If you hold too much fixed (e.g., current substantive values), the procedure is vacuous—it just outputs what you already think. If you hold too little fixed (e.g., only abstract rationality), the procedure is substantive—it outputs a specific ethical theory (e.g., utilitarianism) by fiat, violating the "realism without dogmatism" claim.
  *   **The Work:** Your goal is to map the "Smuggling Space." Identify the minimal set of psychological fixes required to maintain personal identity without presupposing normative truth. Can you articulate a baseline that is *thick* enough to generate specific verdicts but *thin* enough to avoid being a disguised substantive ethic?
  *   **Leverage:** If you cannot solve this, the "Ideal Advisor" is either empty or dogmatic. The project ends.

  #### 2. The Authority Problem (Item b)
  **Priority:** High. Spend 3–4 months here.
  **Why:** This is the metaphysical crux. Even if you solve the Baseline problem and the Ideal You produces a coherent verdict, why does *Actual You* care? If the idealization process changes your values significantly, the Ideal You is a stranger. Normative authority requires a continuity of agency that idealization threatens to sever.
  *   **The Work:** You need an account of *normative identification* that survives radical cognitive improvement. Is authority grounded in psychological continuity, or in the structural role of deliberation? This connects to your metaethics: is normativity internalist or externalist?
  *   **Leverage:** If Authority fails, the theory becomes descriptive (what a god-like version of me would do) rather than normative (what I ought to do). It saves the realism but loses the "guide to action."

  #### 3. The Deferral Problem (Item e)
  **Priority:** Moderate. Spend 2–3 months here.
  **Why:** This is the bridge to non-ideal theory. Assuming (1) and (2) are solvable, how do you act *now* under the uncertainty of future deliberation? This is where decision theory meets metaethics.
  *   **The Work:** Develop a stopping rule for deliberation. When is the cost of further thinking higher than the expected value of a better verdict? This prevents the view from collapsing into perpetual skepticism ("I must wait until I am ideal").
  *   **Leverage:** Lower than (1) and (2). If the Ideal Advisor doesn't exist or doesn't bind, stopping rules don't matter. But if (1) and (2) hold, this is necessary to make the view action-guiding.
  *   **Warning:** This is the most likely place to violate your "no heavy math" constraint. Keep it conceptual (value of information) rather than formal.

  ---

  ### The Crux: Where the Damage Is Done

  You asked: *If the indirect approach turns out to be untenable, which of these is the question whose answer is doing the damage?*

  **It is (a) The Baseline Problem.**

  Here is the diagnosis: The Authority problem (b) is often cited as the killer objection (the "smarter stranger"), but it is usually a symptom of a failure at (a). If the Baseline is set correctly—holding fixed the right constitutive elements of the agent—the Authority problem mitigates because the Ideal Self remains recognizably *you*.

  However, if you set the Baseline correctly to preserve Authority, you almost invariably trigger the Vacuity objection (d): the procedure yields no substantive results. If you adjust the Baseline to yield results, you trigger the "smuggling" objection: you've just built your favorite moral theory into the definition of "rational."

  Therefore, the project lives or dies on whether there is a **non-arbitrary, non-vacuous, non-smuggling Baseline**. If that space is empty, the Ideal Advisor model is not a metaethical foundation; it is a rhetorical device for substantive ethics. That is the failure mode.

  ### Re-ranking Conditions

  Over the next year, use these triggers to adjust the agenda:

  1.  **Move (b) Authority to #1 if:** You discover that *any* plausible Baseline (a) necessarily alters the agent's core commitments enough to break psychological continuity. If the "Ideal You" is too different to be you, solving the Baseline is useless. You would then need to pivot to a metaphysics of persons to save the view.
  2.  **Move (e) Deferral to #1 if:** You find a stable solution to (a) and (b) quickly (unlikely, but possible). Then the live issue becomes "action guidance," and the literature's inability to handle non-ideal deliberation becomes the main gap.
  3.  **Abort the Project if:** After 4 months of work on (a), you conclude that the "Smuggling Space" is logically empty. If every constraint on the baseline is either arbitrary or substantive, the Ideal Advisor model cannot do the work you want it to do (realism without dogmatism). In that case, pivot to a view that accepts dogmatism (substantive realism) or abandons realism (expressivism/constructivism).

  ### Summary of Strategy
  Ignore the social/political dimension (c) for now. Treat Baseline and Vacuity (a/d) as a single conceptual knot that must be untied first. Treat Authority (b) as the metaphysical cost of untying it. Treat Deferral (e) as the application. If the Baseline knot cannot be untied without cutting the rope (smuggling ethics), the view is dead, and you need to know that before you write Chapter 1.
