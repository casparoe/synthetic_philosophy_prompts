  **[FINAL CALIBRATION NOTE FOR THE USER]**
  *   **The "Split" in Case 4b:** I explicitly noted the split in the P camp on counterproductive abstention. This is a real fault line in the literature (e.g., *complicity* vs. *virtue*). If your P friend is a "clean hands" deontologist, they will accept abstention even if it's counterproductive. If they are a "fair play" contractualist, they will reject it (because they are failing the collective goal). Watch how they react to that row; it tells you which P theorist they actually are.
  *   **The Jurisdiction Case:** This is your best bet for prying them apart. If ED says "Duty is equal" here, they aren't really ED. If P says "Duty is stronger in Coin Flip," they are secretly ED.
  *   **The Heckler Section:** I tried to make the defenses symmetrical (Epistemic constraints for ED; Structural constraints for P). This is the strongest point of agreement: both views have "off switches" to prevent absurdity, they just locate the switch differently.
  *   **Typos/Polish:** I left a few rough edges (e.g., "Signable" vs "Signed") to keep it feeling like a working draft, as requested.
