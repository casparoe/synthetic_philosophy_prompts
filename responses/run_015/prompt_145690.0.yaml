  # JOINT STATEMENT ON INDIVIDUAL IMPACT AND COLLECTIVE HARM
  **Draft for Review: ED & P Camps**
  **Date:** October 26, 2023
  **Subject:** Resolving the "Inefficacy Objection"

  ## PART I: AGREED CLAIMS
  *We, the undersigned, acknowledge that while our theoretical justifications differ, we converge on the following practical and normative claims regarding individual action within collective harms.*

  1.  **The Inefficacy Objection is False.** The claim "My individual act makes no difference, therefore I have no duty to refrain" is rejected by both camps. Whether grounded in expected value or participation, a duty exists.
  2.  **Expected Value is Relevant.** Even if not the sole determinant of duty, the probability and magnitude of outcomes are not morally irrelevant. We agree that a 100% chance of harm is worse than a 0% chance, ceteris paribus. **[Calibration Note: ED will want to say "sole determinant." P will want to say "one factor among many." This wording is a compromise; P might cross out "relevant" and write "informative."]**
  3.  **Collective Structure Matters.** The context of the act (e.g., a market, an election, a social practice) changes the moral valence of the act. An isolated act is not morally identical to the same act performed as part of a aggregate pattern.
  4.  **Ex-Ante Duty Stands.** Retrospective knowledge that an act was non-pivotal (e.g., an audit showing your vote didn't matter) does not retroactively negate the duty to have acted otherwise.
  5.  **No "Free" Participation.** One cannot claim the benefits of a restrictive practice (e.g., others restraining their consumption) while exempting oneself from the restraint, regardless of causal pivotality.

  ***

  ## PART II: DISAGREEMENTS TABLE
  *Where we diverge on reasoning, specific verdicts, or the shape of the normative ground.*

  | Case / Issue | ED Wording (Expected Difference) | P Wording (Participation / Fair Share) | Merely Verbal? | The Crux | Shared Case / Argument | Predictions (Written in Advance) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Pallet Case**<br>*(Chunky vs. Smooth Supply)* | **Verdict:** Identical duty in both cases.<br>**Reason:** Expected Value (1/10,000 × 10,000 birds) equals (1/1 × 1 bird). The "chunkiness" is empirically interesting but normatively inert. | **Verdict:** Identical duty in both cases.<br>**Reason:** In both worlds, you signaled demand into a system designed to harm. In the 9,999 worlds where the order stands, you still *joined* the demand signal that justified the order. | **No.** | **Causal Process vs. Causal Output.**<br>ED cares about the *output* (birds killed). P cares about the *input* (joining the practice). | **The Signal Argument:** Both accept that sending a demand signal is the mechanism. ED says the signal only matters if it changes the order. P says the signal matters because it validates the order. | **ED:** P is mystifying "joining" with no causal cash-out.<br>**P:** ED is blind to the normative significance of being a "customer" vs. a "cause." |
  | **2. Two Jurisdictions**<br>*(Tie=Status Quo vs. Tie=Coin Flip)* | **Verdict:** Duty is **stronger** in Coin Flip jurisdiction.<br>**Reason:** Your vote has higher Expected Value. In Status Quo, a tie is a loss. In Coin Flip, a tie is 0.5 win. Probability of mattering is higher. | **Verdict:** Duty is **equal** in both jurisdictions.<br>**Reason:** The duty is to participate in the democratic practice. The administrative mechanism for counting (coin vs. rule) does not alter the categorical duty to vote. | **No.** | **Instrumental vs. Constitutive.**<br>Is voting a tool to change outcomes (ED) or a duty of citizenship regardless of marginal utility (P)? | **The "Why Vote?" Test:** If the election were decided by a random dictator *before* votes were cast, ED says "Stay home." P says "Vote anyway." | **ED:** P is fetishizing the act.<br>**P:** ED reduces citizenship to gambling. |
  | **3. The Audit**<br>*(Retrospective Non-Pivotality)* | **Verdict:** No change in moral status.<br>**Reason:** Decision was rational ex-ante. Ex-post relief is an emotional error (outcome bias). | **Verdict:** No change in moral status.<br>**Reason:** Complicity is not erased by luck. You still ate the meat/cast the vote. The "stain" of participation remains. | **No.** | **Decision-Procedure vs. Moral Luck.**<br>ED worries about rationality. P worries about complicity/clean hands. | **The "Relief" Intuition:** Ordinary people feel relief upon learning they weren't pivotal. | **Both:** Ordinary people are wrong to feel relief.<br>**ED:** Because EV was real.<br>**P:** Because complicity was real. |
  | **4a. Reversed: Compensation**<br>*(Eat Beef + Buy Offsets)* | **Verdict:** Permissible (or less wrong).<br>**Reason:** Net expected harm is neutralized or reduced. If the offset works, the $P \times V$ is managed. | **Verdict:** Impermissible.<br>**Reason:** You cannot buy your way out of complicity in a harmful practice. Offsets treat harm as a tax rather than a violation. | **No.** | **Net Harm vs. Dirty Hands.**<br>Can harm be "canceled" mathematically, or is the act itself tainted? | **The "Indulgence" Analogy:** Both accept the historical parallel to selling indulgences. | **ED:** P is letting perfect be the enemy of good.<br>**P:** ED is commodifying morality. |
  | **4b. Reversed: Counterproductive Abstention**<br>*(Give up car; buyer drives 2x)* | **Verdict:** Impermissible.<br>**Reason:** Net expected harm increases. You made the world worse to keep your hands clean. | **Verdict:** **Split.**<br>*(i)* Impermissible (Solidarity requires effectiveness).<br>*(ii)* Permissible (My hands are clean; the system is at fault).<br>**Reason:** Tension between "doing your part" and "not making it worse." | **Yes (Internal to P).** | **Purity vs. Solidarity.**<br>Does P require effectiveness? If the practice continues without you, are you still "in" it? | **The "Leakage" Problem:** Both accept that market leakage (someone else buying the car) is a real empirical risk. | **ED:** P(ii) is narcissism.<br>**P:** ED is too willing to get dirty. |

  ***

  ## PART III: CLOSING STATEMENT TO THE HECKLER
  *Addressed to the skeptic who claims our views lead to absurdity.*

  **To the Skeptic:**
  You argue that if we take individual duty seriously in cases of tiny probabilities or collective practices, we collapse into fanaticism or moral tyranny. We respond jointly:

  **1. To the ED Camp (On Pascal's Mugging):**
  *The Worry:* If tiny probabilities of enormous harms generate duties, why aren't we obligated to every obscure cult that claims infinite stakes?
  *The Joint Defense:* We rely on **epistemic constraints**, not moral ones. The probability must be *evidentially supported*, not merely logically possible. In the cases above (climate, voting, supply chains), the probability is tiny but *empirical*, based on known mechanisms (aggregation, thresholds). Pascal's Mugging relies on hypotheses with no empirical anchor.
  *[Calibration Note: ED will sign this. P might add "And the harm must be causal, not just asserted."]*

  **2. To the P Camp (On Harmless Practices):**
  *The Worry:* If participation grounds duty, why aren't we obligated to abstain from harmless rituals that *look* like harmful practices (e.g., fake fur, mock elections)?
  *The Joint Defense:* We rely on **structural connection**, not expressive resemblance. The duty arises from joining a practice that *actually* sustains harm (the supply chain, the legislature), not one that merely resembles it. A practice that causes no harm and sustains no harmful structure generates no duty to abstain.
  *[Calibration Note: P will sign this. ED might add "Because the expected value of abstaining from harmless practices is zero."]*

  **3. The Shared Bottom Line:**
  We are not demanding perfection. We are demanding that "I made no difference" ceases to be a conversation-stopper. Whether because you shifted the expected value (ED) or because you refused to be a free-rider on a harmful scheme (P), the inefficacy objection is dead.

  **Signed,**

  _____________________ (ED Camp)
  _____________________ (P Camp)

