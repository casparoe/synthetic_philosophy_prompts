  1.  **The Camps:** "ED" is basically act-consequentialism (or expectational). "P" is a mix of contractualism, complicity theory, and fairness views. They are distinct, but some "P" theorists are just consequentialists who think long-term/indirect effects matter more than ED admits. I have written this assuming "P" is non-consequentialist about the *act itself*. If your P friend is actually a rule-consequentialist, half this document will annoy them.
  2.  **Agreed Claims:** I have stripped these down to the bare minimum. A hardline ED theorist might refuse to sign Claim #3 (that consequences aren't the *whole* story), and a hardline P theorist might refuse Claim #2 (that expected value is *relevant*). I have phrased them to be "signable," but expect marginal scribbles.
