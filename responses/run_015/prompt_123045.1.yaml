answer: |-
  Here is a complete lesson plan designed for your 75-minute seminar. It uses a truncated Centipede Game to operationalize the epistemic conditions.

  ### **Session Overview**
  *   **Topic:** The Epistemic Conditions of Backward Induction (Common Knowledge of Rationality vs. Uncertainty).
  *   **Time:** 75 Minutes.
  *   **Class Size:** 18 Students (9 Pairs).
  *   **Incentive:** Top point-scorer wins a £10 coffee voucher (announce this at the start).

  ---

  ### **1. Materials & Setup**
  *   **Game Sheets:** 18 copies (one per student per run). Each sheet has a decision tree with 3 nodes.
  *   **Role Cards:** 9 marked "Player A", 9 marked "Player B".
  *   **"Type" Cards (Run 2 only):** 16 "Normal" cards, 2 "Forced Pass" cards.
  *   **Scoreboard:** Whiteboard to track cumulative points per student.
  *   **Reasoning Log:** A small slip attached to the Game Sheet where they write *why* they moved (crucial for debrief data).

  **The Payoff Structure (3-Node Centipede)**
  *   **Node 1 (Player A):** **TAKE** → (A: 2, B: 0) | **PASS** → Node 2
  *   **Node 2 (Player B):** **TAKE** → (A: 1, B: 3) | **PASS** → Node 3
  *   **Node 3 (Player A):** **TAKE** → (A: 4, B: 1) | **PASS** → (A: 3, B: 3)
  *   *Note:* This structure ensures Backward Induction (BI) dictates **TAKE at Node 1**.
      *   Node 3: A compares 4 (Take) vs 3 (Pass). A Takes.
      *   Node 2: B knows A Takes at 3 (getting 1). B compares 3 (Take) vs 1 (Pass). B Takes.
      *   Node 1: A knows B Takes at 2 (getting 0). A compares 2 (Take) vs 0 (Pass). A Takes.

  ---

  ### **2. The Script & Procedure**

  #### **Introduction (5 Minutes)**
  "Welcome. Today we are testing decision-making under different information structures. You will play a simple game in pairs. Points translate directly to the leaderboard; the top scorer gets a coffee voucher. You will not know who your partner is. You will not speak to them. You only see your own screen/sheet."

  #### **Run 1: The Baseline (20 Minutes)**
  **Setup:** Pair students randomly. Hand out Role Cards (A or B) and Game Sheets.
  **Instructions (Read Exactly):**
  > "Look at your sheet. You have a sequence of moves. If you are Player A, you move first. You can Take the points shown or Pass to the next node. If you Pass, the pot grows, but the other player decides the next split.
  >
  > **Crucial Assumption:** For this round, assume that **every player in this room is rational and aims to maximize their own points.** Assume also that **everyone knows this.**
  >
  > You play this game three times with three different anonymous partners. Record your move and your points. On the back of the sheet, write one sentence: *'I moved this way because I thought my partner would...'*"

  **Execution:**
  1.  Round 1 (5 mins): Collect sheets, reshuffle pairs.
  2.  Round 2 (5 mins): Collect, reshuffle.
  3.  Round 3 (5 mins): Collect.
  4.  Tally points on the board (5 mins).

  *Expected Outcome:* If they follow the instruction "Assume everyone is rational and everyone knows this," BI should trigger. Most should Take at Node 1. If they Pass, they are violating the epistemic assumption (altruism or doubt).

  #### **Run 2: The Uncertainty Condition (20 Minutes)**
  **Setup:** Same pairing method. Hand out Role Cards.
  **The Twist:** Before handing out Game Sheets, hold up two distinct cards.
  **Instructions (Read Exactly):**
  > "Same game. Same payoffs. New rule.
  >
  > Before we deal roles, I have shuffled two special cards into the deck. If you receive a **'Forced Pass'** card, you **cannot Take**. You must Pass if it is your turn. You know immediately if you have this card. Your partner does not know if you have this card.
  >
  > If you have a **'Normal'** card, you play as before.
  >
  > I am telling you publicly: There are exactly two 'Forced Pass' cards among the 18 of you. You do not know if your partner is Normal or Forced.
  >
  > Play three rounds. Record your move. On the back, write: *'I moved this way because I thought there was a chance my partner was...'*"

  **Execution:**
  1.  Deal cards secretly. (Ensure the 2 "Forced" players know their status).
  2.  Run 3 rounds as before (15 mins).
  3.  Tally points (5 mins).

  *Expected Outcome:* Rational players (Normal cards) should Pass *longer* than in Run 1. Why? Because there is a non-zero probability the opponent is Forced to Pass. If I Pass, I might reach a later node where the pot is bigger, exploiting the chance that they are Forced. This breaks the Backward Induction chain.

  #### **Debrief & Data Analysis (30 Minutes)**

  **Step 1: The Data Reveal (5 mins)**
  Draw two histograms on the board: "Run 1: % Taking at Node 1" vs "Run 2: % Taking at Node 1".
  *   *Likely Reality:* Run 1 will have significant Passing (humans are nice). Run 2 will have *more* Passing.
  *   *The Lesson:* Focus on the *shift*. "Did passing increase in Run 2?"

  **Step 2: Mapping the Epistemic Logic (15 mins)**
  *   **Run 1 (The CKR Ideal):** "In Run 1, I told you: 'Everyone is rational, and everyone knows this.' In game theory, this is **Common Knowledge of Rationality (CKR)**.
      *   If CKR holds, we reason backwards: 'He knows I'm rational, so he knows I'll Take at Node 3. So he'll Take at Node 2. So I must Take at Node 1.'
      *   The chain of 'I know that he knows that I know...' goes all the way to the end. It forces the game to collapse immediately."
  *   **Run 2 (The Break):** "In Run 2, I introduced a sliver of doubt. You didn't know if your partner was Rational or Forced.
      *   This breaks the CKR chain. Even if *you* are rational, you cannot be *commonly known* to be rational, because there is a chance you (or they) are a 'Forced' type.
      *   Because the chain is broken, the Backward Induction logic **unwinds**. You can no longer be sure they will Take at Node 2. So Passing at Node 1 becomes rational.
      *   **The Feeling:** In Run 1, you felt pressure to Take early (or felt foolish Passing). In Run 2, you felt *justified* in Passing. That justification is the mathematical difference between CKR and Uncertainty."

  **Step 3: Mutual vs. Common Knowledge (10 mins)**
  *   "Why does this matter for 'Mutual' vs 'Common' knowledge?"
  *   "Mutual Knowledge means: I know you are rational. You know I am rational."
  *   "Common Knowledge means: I know you are rational. You know I am rational. I know that you know I am rational. Ad infinitum."
  *   "In Run 1, BI requires the 'Ad infinitum'. If the chain stops at level 2 ('I know you know I'm rational' but I don't know if 'you know that I know...'), the logic fails at Node 1.
  *   Run 2 simulated this break. By adding a tiny probability of a non-rational type, we functionally made Rationality **not** Common Knowledge. That tiny doubt allowed cooperation to survive."

  ---

  ### **3. What Will Go Wrong (Failure Modes)**

  1.  **Altruism in Run 1:** Students may ignore the "Assume Rationality" instruction and Pass anyway because they are philosophy students who value cooperation.
      *   *Fix:* In the debrief, acknowledge this. "The theory predicts Take. You Passed. This means either you aren't rational (you care about fairness) or you didn't believe I had Common Knowledge of your rationality."
  2.  **Confusion in Run 2:** Students with "Forced Pass" cards might think they are being punished.
      *   *Fix:* Emphasize "Forced Pass" is a *type*, not a penalty. They still get points if the pot grows.
  3.  **The "Unwinds" Phrasing:** You mentioned "chain of reasoning unwinds the other way."
      *   *Risk:* Students might think "unwind" means "goes backwards."
      *   *Clarification:* Use the term "Collapses" for Run 1 (BI) and "Sustains" for Run 2. The "chain of justification" for Taking is what unwinds.

  ### **4. Limitations (What this game can't stage)**

  *   **Mutual vs. Common Knowledge Distinction:** This is the biggest caveat. A Centipede game with incomplete information (Run 2) technically models **Incomplete Information** (Harsanyi types), not strictly the difference between Mutual and Common Knowledge of Rationality.
      *   *Why:* To strictly test Mutual vs. Common, you need a scenario where everyone *is* rational, but they aren't *sure* everyone else knows it (e.g., Muddy Children). Run 2 actually introduces *irrational/committed* types.
      *   *How to handle:* In the debrief, admit this. "Strictly speaking, Run 2 introduces uncertainty about *types*. But epistemically, the effect is the same: it breaks the infinite regress of 'I know that you know'. It shows that **CKR is a fragile condition**. Remove the certainty, and the equilibrium flips."
  *   **Finite Horizon:** With only 3 nodes, the BI is too obvious. Students might solve it too fast.
      *   *Mitigation:* The "Reasoning Log" forces them to articulate the level of recursion they used.

  ### **5. Confidence & Uncertainty**

  *   **Confidence Level:** **85%**. The mechanics are standard experimental game theory (Centipede + Gang of Four reputation effect). The contrast between Run 1 (BI) and Run 2 (Reputation/uncertainty) is robust.
  *   **Least Sure Bit:** **The "Mutual vs. Common" Precision.** I am least confident that this specific setup cleanly isolates *Common Knowledge of Rationality* from *Mutual Knowledge of Rationality* without introducing *Incomplete Information about Types*.
      *   *Reason:* True CKR experiments usually require public announcements of rationality without introducing "forced" types. By using "Forced Pass" cards, you are technically changing the game's type space, not just the epistemic depth.
      *   *Recommendation:* In the debrief, frame Run 2 as "Relaxing the CKR assumption" rather than "Testing Mutual Knowledge." It achieves the *pedagogical goal* (showing how fragile the BI logic is) even if the formal epistemic model is slightly blended.

  ### **6. Data Recovery (The "Slip" Question)**
  To ensure you have data on their reasoning levels, require this specific fill-in on the game sheet:

  > **"I chose to [TAKE/PASS] because:"**
  > *   [ ] I wanted to be nice.
  > *   [ ] I thought my partner would Take at the next node.
  > *   [ ] I thought my partner would Pass, hoping I would Pass later.
  > *   [ ] I was unsure if my partner was rational/forced.

  **Analysis:** In Run 1, look for the second option (BI reasoning). In Run 2, look for the fourth option (Uncertainty reasoning). If you see a shift from Option 2 to Option 4, you have successfully demonstrated the epistemic shift.
