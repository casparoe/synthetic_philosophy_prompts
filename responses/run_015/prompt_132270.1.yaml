      *   **Objectivity:** Hinges are not subjective opinions. They are public, shared norms of a community/practice. Calling something a hinge doesn't make it arbitrary; it makes it constitutive of the practice.
      *   **Limits:** Hinges are not empirical hypotheses. They look empirical but function grammatically/normatively.

