      *   **Core Argument:** What she gains is not a new *propositional fact* (she knew the neural pattern) but a new *functional capacity/causal power* (ability to generate/recognize the state from the inside).
      *   **Three Claims:**
          1.  Jackson's gap depends on ordinary perceptual channels.
          2.  DCS blurs knowing-that vs. knowing-how (she can trigger the state without new physics).
          3.  Physicalism is only incomplete about abilities/skills, not factual knowledge.
      *   **Specific Questions:**
          1.  Is the distinction between propositional knowledge and functional capacity coherent, or does it just rename the problem?
          2.  Does altering the "exit" condition misrepresent Jackson's core point about phenomenal character?
          3.  Should a stronger physicalist reply (denying the gap entirely) be considered instead of the "ability" framing?
      *   **Constraint:** No sources or reading lists, just an assessment of the argument's coherence.

  2.  **Evaluate the Modified Scenario (Direct Cortical Stimulation - DCS):**
      *   *Standard Mary:* Leaves room -> Sees red -> "Oh, *this* is what it's like."
      *   *Modified Mary:* Stays in room -> Brain zapped -> Experiences red.
      *   *Implication:* The experience is caused internally (or artificially) rather than externally via light/retina.
      *   *Philosophical Weight:* Does the *cause* of the experience matter for the *nature* of the experience? Most physicalists say no (supervenience). If the neural state is identical, the phenomenal state should be identical.
      *   *User's Twist:* The user argues that because she *knows* the neural state, the new element is the *capacity* to inhabit it, not a fact about it.

  3.  **Address Question 1: Propositional Knowledge vs. Functional Capacity (The Ability Hypothesis):**
      *   *Coherence:* This is a well-trodden path in philosophy (The Ability Hypothesis, associated with David Lewis and Laurence Nemirow). The user is essentially rediscovering/repurposing this.
      *   *Renaming the Problem?* The hard question is: Is "knowing what it's like" *just* an ability? If I have the ability to imagine red, do I know what it's like? The user argues yes. Critics argue that having the ability *presupposes* the phenomenal experience. You can't have the ability to recognize/imagined red unless you've experienced red. So the experience (the qualia) is still the primary gain, the ability is secondary.
      *   *Assessment:* It's coherent, but it faces the objection that abilities are grounded in experiences. The DCS twist adds a nice layer: since she knows the *physical* cause (the stimulation pattern), the "mystery" isn't about the physical world, but about *access*.
      *   *Verdict:* It's a solid distinction, but needs to defend against the claim that the ability *entails* the phenomenal fact.

  4.  **Address Question 2: Does DCS Misrepresent Jackson's Core Point?**
      *   *Jackson's Point:* Physicalism is false because there are truths about human experience (qualia) that are not physical truths. The *source* of the experience (light vs. electrode) is usually irrelevant to Jackson. What matters is the *phenomenal character*.
      *   *User's Claim 1:* "Jackson's epistemic gap depends on Mary encountering color through ordinary perceptual channels."
