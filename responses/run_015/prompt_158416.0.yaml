  5.  **Address Question 3: Stronger Physicalist Reply (Denying the Gap) vs. Ability Framing:**
      *   *Denying the Gap:* This is the "Representationalism" or "Illusionism" route (e.g., Dennett). Arguing Mary *doesn't* learn anything new is a hard sell intuitively. Most people feel she *does* learn something.
      *   *Ability Framing:* This accepts she learns something but categorizes it differently (know-how vs. know-that). This is generally more intuitive and defensible for a high school essay.
      *   *Assessment:* Stick with the Ability Framing. Denying the gap often looks like denying the obvious (that experience feels like something). The Ability Hypothesis respects the intuition while saving physicalism.
      *   *DCS Twist:* The DCS scenario actually makes the Ability Hypothesis *stronger*. Why? Because if the brain state is physically induced, the "newness" is clearly about *access* to that state, not about the state's physical properties.

