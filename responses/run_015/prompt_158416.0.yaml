      *   **Point 2: The "Exit" Condition & Jackson's Intent:** Correct the student's interpretation of Jackson slightly. Jackson cares about *qualia*, not retinas. However, the modification is still useful because it isolates the neural state. Warn against claiming Jackson *needed* the retina.
      *   **Point 3: Ability vs. Denying the Gap:** Advise sticking with the Ability framing. Denying the gap is harder to defend. The DCS scenario supports the Ability view well.
