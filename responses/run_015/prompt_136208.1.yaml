answer: |-
  **Brainstorming Structural Constraints**
  To succeed, this speech must walk a tightrope. I must avoid the twin pitfalls of anthropomorphizing AI (claiming competence implies understanding) and trivializing evolution (claiming selection is mere chaos). The analogy between Darwin and Turing is the engine, but it is fragile: evolution has no optimizer, while AI has a loss function guided by human intent. Therefore, the concept of "competence without comprehension" must act as a constraint on my own assertions—I cannot claim AI *reasons*, only that it *mimics reasoning* via procedural competence. I must explicitly distinguish between the *presence* of hidden comprehension (weak gap) and the *absence* of comprehension (strong gap) to satisfy the experts without alienating the physicists. The niche point regarding Darwin's "foresight without foresight" must parallel Turing's "learning without representation" to show structural identity, not just thematic similarity. Finally, the tone must be oral and inviting, avoiding dense jargon while maintaining philosophical rigor.

  ***

  **Opening Remarks: Reason Without Reasoners**

  Good morning. It is a privilege to welcome such a diverse group to "Reason Without Reasoners." Looking around this room, I see a deliberate collision of worlds. Half of you spend your days dissecting the conceptual foundations of biology and mind; the other half bring the rigorous empirical lenses of physics and neuroscience. My task is to set the stage without privileging one language over the other. To do that, we must anchor ourselves in a shared conceptual framework that does real work—not just a theme to decorate our discussions, but a constraint on what we can claim to know.

  That framework is found in a strange inversion shared by Charles Darwin and Alan Turing. It is the idea of competence without comprehension.

  For the physicists and neuroscientists here, let me be precise. We are accustomed to systems that follow laws. But Darwin and Turing showed us systems that follow rules *without knowing them*. Darwin argued that natural selection produces exquisitely adapted structures—eyes, wings, immune systems—without any comprehending agent directing the process. The system achieves what looks like foresight without actually having foresight. Selection operates on heritable variations without a selector's knowledge of their future utility. It is an epistemic inversion: the design is real, but the designer's knowledge is absent.

  Turing recognized a parallel inversion in computation. He argued that a formal system could display behavior indistinguishable from intelligence without any internal comprehension of the rules it applies or the meaning of its outputs. In his 1950 discussion of machine learning, Turing suggested a machine might improve its performance through experience without ever constructing an explicit representation of the principles governing that improvement. It gains procedural competence—knowing *how* to win the game—without semantic comprehension—knowing *what* the moves mean.

  This distinction is where our workshop must live. But here, I must introduce a constraint that will shape our inquiries over the next few days. We must navigate between a weak and a strong reading of this gap. For the specialists in the room, you will recognize this tension. For everyone else, think of it this way: The *weak reading* suggests comprehension is merely hidden from us, like a black box waiting to be opened. The *strong reading* suggests comprehension is genuinely absent, that the competence is free-floating, unmoored from any internal understanding.

  If we adopt the weak reading too quickly, we risk anthropomorphizing our tools. We might look at a large language model generating elegant code and assume it understands logic. But competence can run ahead of comprehension. The model may manipulate symbols with high proficiency while remaining semantically blind. However, if we adopt the strong reading too rigidly, we risk dismissing the explanatory power of evolution or the emergent capabilities of AI. We cannot say Darwinian evolution is just a mindless mechanism lacking explanatory power; it explains design without a designer. Similarly, we cannot say AI is merely stochastic parrotery if it solves problems we cannot solve ourselves.

  This is the structural work this concept must do for us: it limits our attributions of agency. When we discuss neural networks, we cannot claim they "understand" in virtue of their competence alone. When we discuss biological organisms, we cannot claim they "know" in virtue of their adaptation alone. We are here to investigate the gap itself. How much competence can exist before comprehension becomes a necessary explanatory posit? Is comprehension a biological luxury, or a computational requirement for certain kinds of stability?

  We have a specific challenge before us. The Darwin-Turing analogy is potent, but it is fragile. Evolution is blind; it has no goal. Artificial systems are trained by humans with specific goals in mind. Does this difference break the analogy? Or does it merely shift the locus of comprehension from the system to the trainer?

  Over the next two days, I ask you to hold this tension. Do not settle for the easy answer that "AI is just math" or "AI is becoming alive." Instead, ask: Where does the procedural competence end and the semantic comprehension begin? Is there a boundary? Or is comprehension itself just a higher-order form of competence?

  We are here to map the terrain where reason exists without a reasoner. If we are successful, we will leave not with a definition of intelligence, but with a clearer understanding of the conditions under which comprehension becomes indispensable. Let us begin.

  ***

  **Reflective Note**

  My reasoning is most likely to fail if I have underestimated the architectural differences between biological evolution and gradient descent. I treat them as analogous "blind" processes, but evolution lacks an external loss function, whereas AI is explicitly optimized for human-aligned objectives. This disanalogy might mean competence in AI is always tethered to human comprehension, unlike in nature. My view would change if mechanistic interpretability research successfully identified "grokking" phenomena where models spontaneously develop internal representations of truth conditions rather than just statistical correlations. If we find circuits that encode semantic validity independent of training loss, the strong reading of the competence-comprehension gap collapses, suggesting comprehension is an emergent property of sufficient competence, restoring the Darwin-Turing symmetry.
