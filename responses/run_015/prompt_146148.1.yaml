  (4) maya said jordan is conflating formal failure with preference-based reasons. st petersburg gets rejected for risk aversion and ruin avoidance — thats about preferences, not about expectation being undefined. using undefinedness itself as a reason is like refusing to drive because your speedometer broke. she also said both miss that you could drop EUT entirely and use prospect-theory weighting, which doesnt need a well-defined expectation at all.

