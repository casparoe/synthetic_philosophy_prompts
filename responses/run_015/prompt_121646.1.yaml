answer: |-
  Here is a 40-minute lesson plan designed for a group of novelists. It prioritizes narrative intuition over formal logic while ensuring the philosophical core remains intact.

  ### 1. Strategic Decisions (The "Why" Before the "How")

  **Dependency Order: Start with Single-Choice (Synchronic), then move to the Loop (Diachronic).**
  *   **Why:** Novelists understand scene-level motivation. If you start with the loop, the character looks stupid or addicted. If you start with the single choice, you prove the character is *rational in the moment*. The tragedy only emerges when you stack the scenes. You need them to agree that Step 1 is smart before you show them Step 1 leads to ruin.

  **Carrying Example: Use a Neutral Analogy first, then the Character.**
  *   **Why:** Do not start with your amnesiac gambler. Her amnesia is a narrative device that invites the wrong conclusion (that memory is the bug). Start with a concrete, non-emotional trade (e.g., swapping seats at a dinner party or trading collectible cards). Once the logic of the "loop" is accepted as universal, apply it to the character. This separates the *philosophical error* from the *medical condition*.

  ### 2. The 40-Minute Lesson Plan

  **0:00 – 0:05: The Hook (The Writer's Problem)**
  *   **Action:** State the narrative problem clearly. "My character makes the smart choice every morning, but goes broke every year. Readers call it a plot hole. I say it's a logic trap."
  *   **Goal:** Frame this as a tool for character consistency, not a logic lecture.

  **0:05 – 0:15: The Snapshot (Synchronic Rationality)**
  *   **Activity:** The "Seat Swap" Analogy.
  *   **Setup:** Imagine three seats: A (Window), B (Aisle), C (Middle).
  *   **Scenario:** I prefer A > B, B > C, but also C > A (maybe C is closer to the bar).
  *   **Interaction:** Ask the group: "If I'm in C, and offered A for $1, is that rational?" (Yes). "If I'm in A, offered B for $1?" (Yes, based on preferences).
  *   **Key Point:** Emphasize that *at each specific moment*, the trade makes sense. There is no weakness of will here.
  *   **Misconception Intercept:** If someone says "Just pick the best one," stop them. Explain that "best" is subjective and context-dependent. The character isn't failing to choose; she is choosing correctly based on flawed rankings.

  **0:15 – 0:25: The Movie (Diachronic Rationality)**
  *   **Activity:** Play the sequence forward.
  *   **Visual:** Draw a circle on the whiteboard. A → B → C → A.
  *   **Action:** Add the cost. Every swap costs $1.
  *   **Result:** We are back in Seat C, but we are $3 poorer. We can do this forever until bankruptcy.
  *   **Definition:** Introduce the term **Money Pump**. It's not about bad luck; it's about cyclic preferences.
  *   **Misconception Intercept:** If someone says "She should remember she lost money," acknowledge it but table it. Say: "Even if she remembers, if she truly prefers C over A *in that moment*, she will swap again. Memory helps, but inconsistent preferences are the engine."

  **0:25 – 0:35: Application to the Character**
  *   **Activity:** Map the analogy to the novel.
  *   **Action:** Replace Seats with Bets. Replace $1 swap cost with House Edge/Transaction Fees.
  *   **Clarification:** Explain the amnesia. "In the book, the amnesia hides the pattern from her. But the *money pump* works even without amnesia. The amnesia just makes her a easier target for the casino."
  *   **Goal:** Shift their view from "She forgets, therefore she loses" to "Her preferences cycle, therefore she loses; she forgets, therefore she doesn't stop."

  **0:35 – 0:40: The Check & Close**
  *   **Activity:** The "Notebook Test" (See below).
  *   **Close:** Reiterate that this makes the character tragic, not stupid. She is logically consistent locally, but globally incoherent.

  ### 3. Managing Misconceptions

  You anticipate two main errors. Here is exactly where to kill them:

  **Misconception A: "She's just weak-willed / addicted."**
  *   **Where to head it off:** **Minute 10 (The Snapshot).**
  *   **How:** When discussing the single choice, explicitly state: "There is no impulse control issue here. If you offered her the reverse trade immediately, she would refuse. She wants what she wants *now*. That is rationality, not addiction."

  **Misconception B: "Forgetting is the real problem."**
  *   **Where to head it off:** **Minute 25 (Application).**
  *   **How:** When mapping the analogy to the character, ask: "If I give her a notebook that shows she lost money yesterday, does she stop?"
  *   **The Answer:** If her preferences are truly cyclic (A > B > C > A), the notebook doesn't fix the preference order. It only adds data. She might look at the notebook and say, "I lost money, but I still prefer Bet A today."
  *   **Correction:** Tell them: "The amnesia explains why she doesn't *learn*, but the Money Pump explains why she *loses*."

  ### 4. The Understanding Check

  Do not ask "Does everyone understand?" They will lie. Use **The Notebook Test** as your final verification.

  *   **The Question:** "In the next draft, if I give the character a perfect memory of her losses but keep her betting preferences the same, does she still go broke?"
  *   **Pass:** They say "Yes, because she still values the bet over the cash in the moment."
  *   **Fail:** They say "No, because she'd learn her lesson."
  *   **Remedy:** If they fail, return to the Seat Swap analogy. Ask: "If you love the window seat more than the aisle, does knowing you paid $10 to swap yesterday change how much you love the window seat today?"

  ### 5. The Exclusion Zone (What to Refuse)

  You must explicitly set boundaries to keep this within 40 minutes and accessible to creatives.

  *   **What to refuse:** **The Formal Dutch Book Axioms.**
  *   **How to phrase it:** Put this on your first slide as a "House Rule."
      *   *"We are not doing math today. We are not proving theorems. We are not discussing Bayesian coherence or formal Dutch Book arguments. We are discussing character motivation over time."*
  *   **Why:** If you introduce axioms, the novelists will tune out. The *concept* of the pump is what matters for the story, not the mathematical proof of its inevitability.
