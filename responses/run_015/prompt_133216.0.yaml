answer: |-
  Here is the diagnosis of your disagreement, the evaluation of your thought experiment, and the steelman you requested.

  ### 1. The Diagnosis: Metaethical Direction of Fit

  Your hypothesis is correct that you are sliding between three questions, but the engine driving the slide is a deeper **metaethical clash regarding the "Direction of Fit" between moral theory and moral psychology.**

  You are operating with a **Critical/Reformist** conception of morality. For you, the job of moral theory is to scrutinize intuitions and discard those that cannot be justified by reason or universalizable principles. On this view, moral psychology is a source of *bias* to be corrected. When you say the binding foundations "aren't really moral," you mean they do not survive the filtering process of normative justification. You are asking: *What ought we to value?*

  Your friend is operating with a **Naturalist/Descriptive** conception of morality. For them, the job of moral theory is to account for the phenomenon of human moral experience as it actually exists. On this view, moral psychology is the *data* to be explained. When they say pluralism wins by Inference to Best Explanation, they are treating "morality" as a natural kind discovered by observing human societies. They are asking: *What do humans actually value, and how does it function?*

  This is why the genealogy argument stalls.
  *   **For you,** genealogy is **debunking**. Showing that Sanctity arises from pathogen avoidance shows it is a misfiring heuristic, not a moral truth.
  *   **For your friend,** genealogy is **vindicating** (or at least neutralizing). Showing that Loyalty arises from coalitional stability shows it is a robust, evolved solution to coordination problems, which grants it normative weight equivalent to Care.

  You are arguing about **Normative Authority** (which foundations have a claim on us); your friend is arguing about **Phenomenological Completeness** (which foundations are necessary to describe the moral landscape). You are trying to prune the tree; they are trying to map the roots.

  ### 2. The Thought Experiment: Is it Bedrock?

  Your prediction about the preregistered study is correct: **both of you would claim victory, confirming that the disagreement is not empirical.**

  *   **Your move:** If Sanctity reduces to pathogen avoidance, you will say, "See? It's a biological contamination reflex, not a moral truth. It's debunked." You will treat the Authority/Loyalty persistence as a remaining problem to be solved, not a vindication.
  *   **Their move:** If Authority/Loyalty remain distinct modules, they will say, "See? These are innate, distinct systems. They are as 'real' as Care. The fact that Sanctity is pathogen-avoidance just means one foundation was misidentified, not that the pluralist approach is wrong."

  This is not defeatist; it is **categorically accurate**. You are not arguing about the furniture of the universe (empirical); you are arguing about the criteria for counting something as furniture (ontological).

  The "muscle" analogy you raised is the crux.
  *   **You** believe there is a "true" set of moral muscles (Care/Fairness) and the rest are scar tissue or spasms.
  *   **Your friend** believes that if the organism uses it to move, it counts as muscle.

  Because you disagree on the *function* of moral theory (prescriptive vs. descriptive), no amount of empirical data about modularity will resolve the normative status of the foundations. The disagreement is bedrock because it rests on incompatible views of what "moral" means. For you, "moral" implies *justifiable*. For your friend, "moral" implies *binding*.

  ### 3. The Steelman: Binding Foundations as Constitutive

  You asked for the strongest version of the claim that binding foundations are moral, not conventional, without begging the question or relying on group-level utilitarianism (which would vindicate norms you reject).

  The strongest argument is the **Constitutive Ontology Argument**.

  **The Claim:** Care and Fairness are the *content* of morality, but Loyalty, Authority, and Sanctity are the *form* of morality. Without the binding foundations, the individualizing foundations have no substrate upon which to operate.

  **The Structure:**
  1.  **Morality requires Moral Agents.** You cannot have duties of Care or Fairness unless there are beings capable of bearing rights and obligations.
  2.  **Moral Agents require Moral Communities.** An isolated individual cannot be a moral agent; agency is constituted through recognition by others within a normative structure. (You are only a "person" because a community recognizes you as one).
  3.  **Binding Foundations Constitute Communities.** Care and Fairness regulate interactions *within* a group, but they do not create the group boundary. Loyalty (boundary), Authority (structure), and Sanctity (sacred values) are the mechanisms that create the "We" necessary for there to be an "I" and a "You."
  4.  **Therefore, Binding Foundations are Constitutive Conditions.** They are not merely instrumental tools for group survival (which would be contingent); they are logically prior conditions for the existence of the moral domain itself.

  **Why this avoids your objections:**
  *   **It's not just "strong feelings."** It argues that without these foundations, the concept of obligation collapses. You can feel Care for a stranger, but you cannot feel *bound* to them without a shared normative framework (Authority/Sanctity) that defines the relationship.
  *   **It avoids the "group benefit" trap.** It does not argue that these foundations are good because they help the group survive (which could justify slavery or sacrifice). It argues that you cannot have *any* morality (including Care/Fairness) without the *bindingness* that these foundations provide. It claims that "morality" literally means "that which binds," and a theory that removes the binding elements is not a moral theory, but a theory of benevolence.

  This forces you to argue not that these foundations are "fake," but that we should attempt to construct moral communities without boundaries, hierarchy, or sacred values—a claim you might find empirically impossible or conceptually incoherent.

  ### 4. What Counts as Progress?

  Since empirical data won't resolve this, progress requires a **terminological and metaethical truce**.

  **What won't work:**
  *   More fMRI studies or cross-cultural surveys.
  *   Arguments about whether specific norms (e.g., purity laws) are "good."
  *   Inference to Best Explanation regarding psychological data.

  **What would work:**
  You need to distinguish between **Morality-as-Justification** (your project) and **Morality-as-Phenomenon** (your friend's project).

  Progress looks like this:
  1.  **Acknowledge the Ambition:** Agree that Haidt's MFT is a theory of *Morality-as-Phenomenon*. It successfully maps the psychological inputs humans *treat* as moral. Your friend wins on the descriptive utility of the theory.
  2.  **Assert the Filter:** Agree that a theory of *Morality-as-Justification* must filter those inputs. You win on the normative authority to reject binding foundations that fail universalizability tests.
  3.  **The Real Debate:** Move the argument to the intersection. Instead of "Are these foundations real?", ask: **"To what extent can a moral system based on Care/Fairness sustain itself without the constitutive support of Binding foundations?"**

  This shifts the debate from ontology (what exists) to feasibility (what works). It allows you to say, "These are real psychological drivers, but they are not normatively authoritative," while allowing them to say, "They are normatively authoritative because without them, your Care/Fairness system will fail to sustain a community."

  **Verdict:** The disagreement is bedrock, but not useless. It is a clash between **Ethical Rationalism** (morality is what reason dictates) and **Ethical Naturalism** (morality is what human nature sustains). You will not convince each other because you are prioritizing different goods: Truth vs. Cohesion. Recognizing this allows you to stop trying to debunk each other's data and start arguing about the trade-off between rational justification and social stability. That is a political argument, not a psychological one, and it is actually resolvable.
