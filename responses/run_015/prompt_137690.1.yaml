prompt: |-
  A podcast I've been listening to did an episode on Goodman's new riddle of induction, and the host sums up the puzzle in one breath like this:

  "Goodman wasn't worried about whether induction works at all — that's Hume's problem, and Goodman was happy to grant that past regularities give us some reason to expect future ones. His question is which regularities we're entitled to project. Here's the puzzle. Call a thing 'grue' if it is first examined before some future time t and is green, or is not first examined before t and is blue. Every emerald examined so far has been green, and so every emerald examined so far has also been grue; the hypotheses 'all emeralds are green' and 'all emeralds are grue' therefore fit the evidence exactly equally well, and they contradict each other about the next emerald we examine — one predicts green, the other blue. Since the evidence can't break the tie, the deciding factor can't be anything about the world; it has to come from the predicates themselves. Goodman's answer is that 'green' is projectible and 'grue' isn't, because 'green' is entrenched: speakers have projected it, and used it, vastly more often than 'grue', which somebody invented yesterday. So whether a generalization licenses a prediction is really just a matter of our linguistic habits — there's no deep fact about which predicate is the natural one. A community that had grown up with 'grue' rather than 'green' in its language would be perfectly rational to expect emeralds examined after t to be blue, and nothing we could say would show them to be wrong."

  Later in the episode he applies it:

  "That is exactly the position of a modern machine-learning system. A model trained on data gathered before t faces the new riddle in its pure form: distribution shift just is the grue problem, and the moral is the same — no quantity of training data, however large, can tell you whether your model has learned 'green' or 'grue', so more data can never settle which predictions it will get right."

  I've read about Hume's version of the problem of induction before, but not this one, and I can't tell how much of the host's account to trust. My only instinct is that the clause about how often a word has been used is too glib to be what Goodman meant — but I can't say what's wrong with it, or whether fixing it would change anything downstream.

  Please audit the passage. Go through the summary sentence by sentence, and the later application as well, marking for each whether someone who works on this material would accept it as stated, accept it as a compression, wince at it, or reject it. Where you wince or reject, give the more careful claim and say what is being conflated or overstated. Three things I'd especially like pinned down: what entrenchment is actually a property of, and whether the host's gloss of it is the same thing as Goodman's; whether the two hypotheses really conflict about the next emerald in the way he says, given how 'grue' was defined; and whether the "no deep fact / nothing we could say would show them wrong" conclusion follows from the parts of the summary that are correct. Then say what a defender of Goodman's own position would object to in the summary as a whole, and whether the machine-learning application survives once the summary is cleaned up. Please argue it out rather than pointing me to sources — I don't want citations or further reading.

  Close with two lines: how confident you are in the audit overall, and the single verdict in it you would be least willing to defend.

  Keep the entire answer under 600 words.
