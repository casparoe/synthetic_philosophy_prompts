answer: |-
  There is a profound conceptual parallel between Newton's heterodox theology and his natural philosophy, rooted in a unified metaphysical commitment to **voluntarism** and the **rejection of necessary connections between distinct ontological entities.** While the arguments arise in different domains (exegesis versus phenomenology), they share a structural logic: reality is not constituted by essential identities or inherent causal powers, but by distinct substances related solely through the direct, sustaining will of a supreme agent.

  To understand this parallel, one must examine how Newton treats the problem of **mediation** in both theology and physics.

  ### 1. The Theological Logic: Distinction over Consubstantiality
  In orthodox Trinitarianism, the Father and the Son are *homoousios* (of the same substance). This implies a unity of essence where the distinction between persons does not compromise their ontological identity. For Newton, this blurred the necessary hierarchy between Creator and Creature.

  Newton's Arian-leaning theology posits that the Son is a distinct being, created by the Father, and subordinate to Him. The logical core of this position is the preservation of **ontological distinction**. If the Son were consubstantial with the Father, the Father's absolute sovereignty would be compromised by a shared essence. For Newton, the Father acts *through* the Son; the Son is the mediator of creation, not the co-architect. The relationship is not one of essential identity, but of **volitional delegation**. The Son exists and acts only because the Father wills it. Thus, there is no "unmediated" identity between the Father and the Son; their unity is a unity of purpose and authority, not of substance.

  ### 2. The Physical Logic: Passivity over Inherent Power
  In natural philosophy, Newton encounters a structurally identical problem regarding matter and force. The mechanistic philosophy of the 17th century (particularly Cartesian) struggled to explain gravity. To attribute gravity as an **inherent, essential property of matter** would, for Newton, be to grant matter a causal power it does not possess.

  Newton defines matter fundamentally by *vis inertiae* (force of inertia)—a passive resistance to change. Matter cannot initiate motion, nor can it act where it is not. Therefore, for Body A to influence Body B across a vacuum (action-at-a-distance) without a medium implies that matter possesses an "occult" power to transcend its own spatial limits. This is metaphysically absurd to Newton because it grants a created substance (matter) an autonomous causal agency that belongs only to the Divine Will.

  Just as the Son does not share the Father's essence, **gravity does not share matter's essence.** Gravity is an external imposition upon passive matter, sustained continuously by an agent. Newton famously wrote that gravity must be caused by an agent "acting according to certain laws," but he left it ambiguous whether this agent was material or spiritual. However, in his unpublished theological manuscripts, the implication is clear: the agent is God.

  ### 3. The Metaphysical Bridge: Absolute Space as the Medium of Will
  The convergence of these two positions is most visible in Newton's conception of **Absolute Space**. In the *General Scholium* and *De Gravitatione*, Newton describes space not as a void, but as an "emanative effect" of God's existence. Space is the "Sensorium of God," the medium through which He perceives and governs the universe.

  This concept resolves the parallel:
  *   **In Theology:** The Father governs the universe through the Son. There is no direct identification of the Creature with the Creator; there is a chain of command.
  *   **In Physics:** God governs matter through Space. There is no direct interaction between distant bodies (which would imply unmediated causal power); there is a chain of causation.

  In both cases, Newton rejects **immanence** in favor of **transcendent mediation**.
  1.  **Rejection of Essential Connection:** Just as he denies that the Son is essentially the Father, he denies that attraction is essentially matter. Both would imply a necessary connection inherent in the nature of the entities themselves.
  2.  **Requirement of a Mediator:** Just as the Son mediates the Father's will to creation, Absolute Space (as the presence of God) mediates gravitational force between bodies.
  3.  **Contingency of Relations:** The relationship between Father and Son is contingent on the Father's will. Similarly, the gravitational relation between two bodies is contingent on God's continuous sustenance. If God withdrew His will, the Son's status and the gravitational order would cease.

  ### 4. Single Commitment vs. Independent Arguments
  Are these independent arguments or a single metaphysical commitment? The evidence suggests a **single underlying metaphysical commitment** that manifests in different domains.

  If the arguments were independent, one could theoretically hold Newton's physics without his theology (e.g., a materialist who accepts action-at-a-distance as a brute fact) or his theology without his physics (e.g., a Trinitarian who accepts Cartesian contact mechanics). However, Newton's specific resistance to "action-at-a-distance" is not merely empirical; it is ontological. He calls it an "absurdity" for matter to act without mediation. This mirrors his theological claim that it is an absurdity for the Son to be equal without subordination.

  The unifying principle is **Divine Voluntarism**. For Newton, the universe is not a self-sufficient machine governed by necessary laws of essence (which would limit God's freedom). It is a Kingdom governed by a King.
  *   To make the Son consubstantial is to bind God by a necessary law of essence.
  *   To make gravity inherent to matter is to bind the universe by a necessary law of mechanism, removing the need for God's continuous providence.

  Therefore, Newton's refusal to grant bodies self-acting causal powers is the physical correlate of his refusal to grant the Son co-eternal status. Both positions protect the **absolute sovereignty and distinctness of the First Cause.** In Newton's metaphysics, no secondary entity (whether the Son or a particle of matter) can possess autonomous causal power or essential identity with the Source. All relations between distinct entities must be mediated by the direct dominion of the Supreme Will.

  ### Conclusion
  The parallel is not coincidental but structural. Newton's natural philosophy and his theology are bound by a consistent ontology that forbids **unmediated relations between ontologically distinct entities.** Just as the Father relates to the World through the Son, Matter relates to Matter through the Divine Presence in Space. To accept inherent gravity would be to make matter "divine" (self-acting); to accept consubstantiality would be to make the Son "equal" (co-eternal). Both violate the hierarchical, voluntarist order in which all power flows from a single, distinct Source through mediated channels. Thus, Newton's physics is not merely a study of motion, but a theological assertion that the world requires a Governor, not just a set of laws.
