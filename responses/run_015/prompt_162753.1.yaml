  *   **Theory:** **Protocol Dependence.** (Reference: Igor Douven's work on "Inference to the Best Explanation" vs. Bayes, or Van Fraassen's Judy Benjamin).
  *   **Takeaway:** You cannot update on *what* was said without knowing *why* it was said. The "Judy Benjamin Problem" isn't just about the math; it's about the missing information regarding the speaker's selection procedure.

