  ### 4. The Math for the Facilitator (Cheat Sheet)

  **Group A (Constraint / Fixed Marginal)**
  *   Constraint: $P(W|N) = 0.75$.
  *   Heuristic: "Don't move the North/South line unless forced."
  *   $P(N)_{new} = P(N)_{old} = 0.5$.
  *   $P(NW)_{new} = 0.5 \times 0.75 = 0.375$.
  *   $P(NE)_{new} = 0.5 \times 0.25 = 0.125$.
  *   **Target Price: 0.50**

  **Group B (Menu / Likelihood)**
  *   Message $M$: "If North, then West" (Statement 1 from menu).
  *   **Likelihoods $P(M | Cell)$:**
      *   **NW:** $N \to W$ is True. $N \to E$ is False. Tautology is True. (2 True options). Operator picks uniformly. $P(M|NW) = 1/2$.
      *   **NE:** $N \to W$ is False. (0 True options for M). $P(M|NE) = 0$.
      *   **SW/SE:** $N$ is False, so $N \to W$ is Vacuously True. $N \to E$ is Vacuously True. Tautology is True. (3 True options). $P(M|S) = 1/3$.
  *   **Unnormalized Posterior (Prior $\times$ Likelihood):**
      *   **NW:** $5 \text{ chips} \times 0.5 = 2.5$
      *   **NE:** $45 \text{ chips} \times 0 = 0$
      *   **South:** $50 \text{ chips} \times 0.333 = 16.67$
      *   **Total Mass:** $19.17$
  *   **Posterior $P(N)$:** $2.5 / 19.17 \approx \mathbf{0.13}$.
  *   **Target Price: 0.13**

