  ### 2. Session Materials & Setup
  *   **Room:** Whiteboard for tracking the "Market Price" of $P(N)$.
  *   **Currency:** Poker chips or slips of paper ("Epistemic Points").
  *   **Handouts:**
      1.  **Prior Sheet:** The 5/45/25/25 grid.
      2.  **Betting Slip:** "I BUY 10 units of 'North' at price X" / "I SELL..."
      3.  **Protocol Envelopes:** Two types (A and B), distributed randomly to half the room each. *Crucial: They must not show each other the inside of the envelope.*

