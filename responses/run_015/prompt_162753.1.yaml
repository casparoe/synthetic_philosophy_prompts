  ### 3. The Activity Timeline (90 Minutes)

  #### Phase 1: Calibration & Prior Betting (15 mins)
  1.  **Briefing:** Explain the grid and the priors. Write the 5/45/25/25 split on the board.
  2.  **Warm-up Bet:** Ask everyone to write down their current credence in $N$ (North). It should be 0.5.
  3.  **Market:** Open a market on "Is the paratrooper North?". Let them trade at 0.5 to ensure liquidity and comfort.

  #### Phase 2: The Message & Private Protocols (15 mins)
  1.  **Broadcast:** Announce the Radio Message: *"If North, then West w.p. 0.75."*
  2.  **Distribution:** Hand out the Envelopes.
      *   **Group A (Constraint):** "The Operator is bound by truth. This message is a **hard constraint** on your new probability function. You must update to satisfy $P(W|N)=0.75$ while disturbing your other beliefs (like $P(N)$) as little as possible."
      *   **Group B (Menu):** "The Operator knows your exact cell. He has a **Menu of 3 Statements**. He checks which are *true* of your cell, then picks one uniformly at random to broadcast. You heard the message above. Calculate your posterior using Bayes' Rule on the *process*."
      *   **The Menu (Inside Envelope B):**
          1.  *"If North, then West."* (Material conditional $N \to W$)
          2.  *"If North, then East."* (Material conditional $N \to E$)
          3.  *"South is possible."* (Tautology, always true)
          *Note: The broadcast message "If North... 3/4" is the semantic equivalent of Statement 1 for the purpose of this game.*
  3.  **Calculation Time:** Give them 10 minutes to compute their new $P(N)$. Walk around.
      *   *Hint for Group B if stuck:* "Calculate the likelihood of hearing Statement 1 given you are in NW. Now given you are in SW."

  #### Phase 3: The Market Clash (40 mins)
  1.  **Open Market:** Re-open betting on "Is the paratrooper North?".
  2.  **The Rule:** They can trade with anyone. They **cannot** reveal their envelope content, but they can state their price.
  3.  **Expected Dynamics:**
      *   Group A will value $P(N)$ at **0.50**.
      *   Group B will value $P(N)$ at **0.13**.
      *   Group B will aggressively sell "North" contracts to Group A.
      *   Group A will feel they are getting a bargain; Group B will feel they are offloading risk.
  4.  **The Reveal:** After trading volume peaks (or stalls), ask for a show of hands: "Who thinks $P(N) > 0.3$?" (Group A raises). "Who thinks $P(N) < 0.2$?" (Group B raises).
  5.  **Protocol Reveal:** Ask Group A and B to read their envelope instructions aloud.

  #### Phase 4: Debrief (20 mins)
  (See detailed guide below).

