  ### 5. Debrief Guide: Mapping Moments to Theory

  **1. The Trading Frenzy (0.50 vs 0.13)**
  *   **Observation:** "You traded eagerly. Group A thought Group B was irrational; Group B thought Group A was suckers."
  *   **Theory:** This demonstrates **Underdetermination**. The sentence *"If N, then W w.p. 0.75"* has a semantic content, but it does not have a unique **update rule**.
  *   **Map:** Group A used **Jeffrey Conditioning / IE** (Constraint on the function). Group B used **Bayes Conditioning** (Evidence about the world). Both are rational *given their protocol*, but the sentence alone didn't specify the protocol.

  **2. The "Vacuous Truth" Moment**
  *   **Observation:** "Group B, did anyone struggle with why the message was 'true' if you were in the South?"
  *   **Theory:** This highlights the difference between **Indicative Conditionals** (often treated as constraints on belief) and **Material Conditionals** (truth-functional). Protocol B forced a material interpretation to make the likelihoods computable. Protocol A treated it as a constraint on the conditional probability itself.
  *   **Takeaway:** The semantics of "If" are slippery. In formal epistemology, we must specify if we are learning a *fact* (Bayes) or a *constraint* (Jeffrey/Van Fraassen).

  **3. The Envelope Reveal**
