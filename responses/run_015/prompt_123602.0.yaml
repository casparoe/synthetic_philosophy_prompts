answer: |-
  Here are 10 questions tailored to your conversation, written in a conversational tone so you can read them aloud naturally. I've included a follow-up for each one based on how she'll likely respond.

  **1. The Motive Question**
  "Hi, thanks for the talk. You made this really helpful distinction between moral behavior and moral dispositions. I'm trying to wrap my head around how we weigh those. If an atheist donates to charity purely for a tax break, and a believer donates purely out of fear of hell, neither seems to have a 'good' intention in the purest sense. But in your view, does one of those count as closer to moral improvement than the other, or are they both just instrumental?"
  *   **Follow-up:** (If she says the believer is closer because fear implies accountability): "But if the fear is just about self-preservation—saving their own soul—isn't that still pretty self-centered compared to a secular person who might give out of simple empathy, even if mixed with tax benefits?"

  **2. The Saturation Threshold (Empirical vs. Conceptual)**
  "I was really intrigued by your idea of an 'institutional saturation threshold.' I'm curious—is that threshold something you think we can actually measure empirically, like with crime rates or trust surveys? Or is it more of a conceptual limit, like a philosophical boundary that shows up when we think about what contracts can't do?"
  *   **Follow-up:** (If she says it's conceptual): "If it's conceptual, how do we know when a society has hit it? Is there a risk that we just label any secular society that struggles as having 'hit the threshold,' which makes the idea hard to falsify?"

  **3. Crisis and Trust**
  "You mentioned that religious trust becomes crucial when institutions fail. I'm thinking about scenarios like natural disasters or pandemics where the grid goes down or supply chains break. Do you have evidence that religious communities actually sustain cooperation better in those specific blackouts than, say, secular neighborhood associations?"
  *   **Follow-up:** (If she cites general community cohesion): "Sure, but secular groups often form quickly during crises too. Is the difference that religious trust is *pre-loaded' before the crisis, whereas secular trust has to be built in the moment?"

  **4. Metaphysics vs. Coordination**
  "I was debating this with a friend who thinks morality is just social coordination—like, we agree on rules so we don't kill each other. But you seem to suggest morality might need a metaphysical foundation to really stick. Do you think morality collapses without that metaphysical backing, or does it just become thinner?"
  *   **Follow-up:** (If she says it becomes thinner): "If it's just thinner, is that enough? Like, is 'thin' morality sufficient for a stable society, or do we need the 'thick' version religion provides to handle the really hard ethical stuff?"

  **5. Secular Substitutes**
  "If the saturation threshold is real, could secular ideologies fill that gap? I'm thinking about things like nationalism or humanism. Can those generate the same kind of deep trust you're talking about, or is there something unique about the religious element that makes it work?"
  *   **Follow-up:** (If she says nationalism is dangerous): "That makes sense, but isn't there also a risk with religious trust turning into tribalism? How do we get the benefit of that deep trust without the downside of excluding people outside the faith?"

  **6. Measuring Dispositions**
  "Since you argue that dispositions matter—like having good intentions when nobody's watching—how do we actually measure that? Behavior is easy to track, but intentions are internal. Are we relying on self-reporting, which seems unreliable, or is there another way to gauge that inner moral character?"
  *   **Follow-up:** (If she suggests psychological studies): "Even in studies, aren't people prone to presenting themselves as more virtuous than they are? How do we separate actual disposition from just knowing the right answers to give?"

  **7. The Free-Rider Problem**
  "In a mixed society, couldn't secular people just free-ride on the trust that religious communities generate? Like, if religious people are maintaining the moral infrastructure, can atheists benefit from that safety and trust without contributing to the religious part of it?"
  *   **Follow-up:** (If she says yes, but it's unsustainable): "If it's unsustainable, does that mean secularization is essentially borrowing capital from a religious past that it can't replenish?"

  **8. Technology and Surveillance**
  "I'm wondering about technology's role here. We have more surveillance and digital tracking than ever before. Does technology push that institutional saturation threshold further out? Like, if cameras and algorithms enforce behavior, do we still need religious dispositions to ensure morality?"
  *   **Follow-up:** (If she says technology doesn't create trust): "So you're saying that being watched isn't the same as being trustworthy? That even if I behave because of a camera, my disposition hasn't actually improved?"

  **9. Defining 'Better' Morality**
  "When you say religion makes people 'more moral,' I want to make sure I understand the metric. Are you arguing that religious morality is *better* in a universal sense, or just that it's more *effective* at sustaining social order? Because those seem like two different claims."
  *   **Follow-up:** (If she says effective): "If it's just about effectiveness, could a highly effective secular system eventually outperform a religious one, or is the religious mechanism uniquely efficient?"

  **10. The Normative Question**
  "Finally, if your analysis is right and secular societies hit this limit, what's the takeaway? Are you suggesting we should encourage religious belief for the sake of social stability, or is this just a descriptive claim about the challenges secular societies need to solve differently?"
  *   **Follow-up:** (If she says she's not prescribing belief): "If we can't prescribe belief, are there specific secular institutions we should be building now to prepare for that saturation point before we hit it?"
