answer: |-
  Here is the specification for an adequate post-situationist virtue theory, followed by the tension analysis and the scoring of the two proposed fixes.

  ### I. The Full Spec: Desiderata for Post-Situationist Virtue Theory

  To survive the situationist critique (Doris, Harman, etc.), a virtue theory cannot simply assert that traits exist. It must satisfy five specific constraints derived from empirical data and ethical requirements.

  **1. The Empirical Adequacy Constraint**
  *   **Requirement:** The theory must accommodate the finding that cross-situational behavioral correlations are low (typically *r* < 0.30). It cannot claim that a person who is honest in context A will necessarily be honest in context B.
  *   **Why Genuine:** Denying this renders the theory empirically falsified. If virtue ethics claims traits predict behavior better than situational variables, and data shows they don't, the theory is descriptively false.

  **2. The Trait/State Distinction Constraint**
  *   **Requirement:** The theory must distinguish between a *trait* (a stable disposition over time) and a *state* (a temporary reaction to immediate stimuli). It cannot collapse character entirely into a series of unconnected states.
  *   **Why Genuine:** If traits are reduced to states, there is no "character" to cultivate or evaluate. Moral responsibility requires a subject that persists over time; if you are only a collection of momentary states, praise and blame lose their anchor.

  **3. The Explanatory Power Constraint**
  *   **Requirement:** The theory must explain why behavioral consistency *sometimes* occurs (e.g., why some people resist situational pressure more often than others) without reverting to the "global trait" model that situationism debunked.
  *   **Why Genuine:** People *do* differ in reliability. A theory that claims all variation is purely situational ignores individual differences in temperament, history, and cognitive processing. It must explain the variance that situations don't capture.

  **4. The Normative Action-Guidance Constraint**
  *   **Requirement:** The theory must provide actionable advice for moral improvement. It cannot be purely descriptive. It must tell an agent *how* to become better, not just *that* they are fragmented.
  *   **Why Genuine:** Ethics is practical. If the theory concludes "you are at the mercy of situations," it offers no path to improvement. Virtue ethics is fundamentally about *cultivation*; if cultivation is impossible, it ceases to be an ethical system.

  **5. The Unity of Character Constraint**
  *   **Requirement:** The theory must preserve some notion of the "whole person." It cannot fragment the agent into infinite micro-dispositions (e.g., "honest-in-telephone-booths," "honest-in-tax-returns").
  *   **Why Genuine:** Moral evaluation relies on generalizations. We need to be able to say "she is trustworthy" to navigate social life. If every context requires a new evaluation, moral language becomes useless, and the concept of a "good life" (eudaimonia) dissolves into a series of unrelated good moments.

  ---

  ### II. Jointly Unsatisfiable Pairs (The Tensions)

  The situationist challenge creates friction between these desiderata. You cannot maximize all of them simultaneously.

  **1. Predictive Accuracy vs. Normative Guidance**
  *   **The Conflict:** To be **Predictively Accurate** (Desideratum 1), you must admit that knowing someone's "virtue" tells you little about their behavior in a novel situation. To be **Normatively Action-Guiding** (Desideratum 4), you must imply that cultivating a virtue *will* make behavior more reliable across situations.
  *   **The Trade-off:** If you emphasize accuracy, you undermine the motivation for self-improvement (why build a trait if it won't predict behavior?). If you emphasize guidance, you risk empirical falsehood (promising stability you can't deliver).

  **2. Empirical Adequacy vs. Unity of Character**
  *   **The Conflict:** To satisfy **Empirical Adequacy** (Desideratum 1), you must acknowledge fragmentation (behavior changes wildly by context). To satisfy **Unity of Character** (Desideratum 5), you must posit a stable core that transcends context.
  *   **The Trade-off:** High unity requires ignoring situational variance (hand-waving). High adequacy requires accepting fragmentation (dissolving the "self").

  **3. Responsibility vs. Situational Determinism**
  *   **The Conflict:** To maintain **Responsibility** (implied in Desideratum 2), the agent must have control over their actions. However, if **Situational Factors** are the primary drivers of behavior (per situationist data), agent control is minimized.
  *   **The Trade-off:** If situations determine behavior, traits are epiphenomenal, and blame is unjust. If traits determine behavior, you deny the situationist data.

  ---

  ### III. Scoring the Fixes

  Here is an evaluation of the two specific strategies you proposed, scored against the constraints above (Scale: 0 = Fails, 1 = Partial, 2 = Succeeds).

  #### Fix A: Global Virtues via 'Trait-Activation Profiles'
  *The Logic:* Virtues exist but are conditional. A trait is not "Honesty" but "Honesty-Unless-Threatened-With-Loss." The trait is a complex function mapping situational features to behavioral outputs.
  *   **Empirical Adequacy:** **1.5**
      *   *Why:* It acknowledges context-dependence better than traditional Aristotelianism. However, it risks becoming unfalsifiable. If every failure is explained by a "missing trigger condition," the trait becomes a tautology ("I have the virtue of doing what I do").
  *   **Trait/State Distinction:** **2**
      *   *Why:* Successfully preserves the idea of a stable disposition (the profile itself is stable), even if the output varies.
  *   **Normative Guidance:** **1**
      *   *Why:* Guidance becomes computationally expensive. To act virtuously, I must know my specific activation profile. It shifts the burden from "be brave" to "know exactly which situations trigger your cowardice."
  *   **Unity of Character:** **2**
      *   *Why:* Preserves the language of global virtues. We can still say "He is honest," provided we understand it implies a complex profile.
  *   **Total Score:** **6.5 / 8**
  *   **Verdict:** The stronger philosophical candidate, but vulnerable to the charge of triviality. It saves the *concept* of virtue by making it so complex it barely resembles the folk-psychological version.

  #### Fix B: Purely Local 'Situational Virtues'
  *The Logic:* Abandon global traits. Virtues are local habits tied to specific contexts (e.g., "office-honesty," "family-honesty"). Moral work is about situation-management rather than character-building.
  *   **Empirical Adequacy:** **2**
      *   *Why:* Fully aligns with social psychology data. Admits low cross-situational correlation without resistance.
  *   **Trait/State Distinction:** **0.5**
      *   *Why:* Blurs the line. If a "virtue" is only valid in one specific context, it begins to look like a state or a reflex rather than a character trait.
  *   **Normative Guidance:** **1**
      *   *Why:* Guidance shifts to "engineering your environment" rather than "improving your soul." This is actionable, but it abandons the core virtue-ethical project of internal transformation.
  *   **Unity of Character:** **0**
      *   *Why:* Explicitly rejects unity. The agent is a patchwork of local habits. You cannot call the person "good," only "good-at-X."
  *   **Total Score:** **3.5 / 8**
  *   **Verdict:** Empirically robust but ethically hollow. It saves the data by sacrificing the "Virtue" in Virtue Ethics. It becomes a form of behavioral management, not character ethics.

  ### Summary Logic
  To survive situationism without hand-waving, a theory must occupy the narrow space between **Fix A** and **Fix B**. It must posit stable dispositions (Fix A) that are sensitive enough to context to match the data (Fix B).

  The critical failure point for **Fix A** is **Predictive Accuracy**: if the "activation profile" is too complex to be known by the agent, it cannot guide action.
  The critical failure point for **Fix B** is **Unity**: if the agent is fully fragmented, moral responsibility and the concept of a "good life" collapse.

  **Winner:** **Fix A (Trait-Activation)** is the only viable option for *Virtue Ethics*, provided it accepts a reduction in predictive confidence. It must admit that virtues make behavior *more probable* but not *certain*, and that moral education is largely about widening the activation range of positive traits across diverse situations. Fix B is empirically superior but ceases to be virtue ethics.
