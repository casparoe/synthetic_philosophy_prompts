          *   **No reading lists, just logic.**
      *   **Tone:** Analytical, rigorous, philosophical but grounded in empirical constraints.

  2.  **Deconstruct the Situationist Challenge:**
      *   *Core Claim:* Behavior is driven more by situational factors than stable character traits.
      *   *Evidence:* Milgram (obedience), Stanford Prison (roles), Darley & Batson (Good Samaritan/time pressure), Isen & Levin (phone booth/dime).
      *   *Implication for Virtue Ethics:* If traits don't exist or are too fragmented, virtue ethics (which relies on stable character for moral evaluation and guidance) collapses or becomes empty.

  3.  **Drafting the Desiderata (The "Full Spec"):**
      *   *What must a revised theory do?*
      *   1. **Explain Stability (without overclaiming):** People *do* show some consistency. A theory can't say *nothing* is stable.
      *   2. **Accommodate Fragmentation:** It must admit that "honesty" in context A doesn't guarantee "honesty" in context B.
      *   3. **Maintain Normative Force:** It still needs to tell us what to *do* or *become*. If it's just descriptive psychology, it's not ethics.
      *   4. **Preserve Agency/Responsibility:** If situations control us, blame/praise makes no sense. The theory must leave room for moral responsibility.
      *   5. **Explain Moral Development:** Virtue ethics is about cultivation. The theory must allow for improvement over time.

  4.  **Refining the Constraints (Why they are genuine):**
      *   *Empirical Constraint:* Can't deny the data (low correlation coefficients, usually r < 0.3).
      *   *Conceptual Constraint:* Can't dissolve "character" entirely, or it's not virtue ethics anymore.
      *   *Practical Constraint:* Must guide action, not just describe failure.

  5.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**
      *   *Predictive Accuracy vs. Action Guidance:* To be empirically accurate, you must admit behavior is situation-dependent (hard to predict). To guide action, you need stable rules/dispositions (easy to predict).
      *   *Global Evaluation vs. Local Description:* We want to praise someone as "brave" (global). Data says they are only "brave-in-context-X" (local).
      *   *Responsibility vs. Determinism:* If situations dictate behavior, responsibility fades. If traits dictate behavior, responsibility holds, but empirical accuracy fades.

  6.  **Evaluating the Two Fixes:**
