  Rigid designation fails because the name *doesn't* stay rigid; it slides toward the description over time. Tacit knowledge explains the silence but not the structural erasure; it describes the skill, not the power dynamic. Operationalism describes the outsider's method but treats it as valid, ignoring the loss of the original referent. Your case isn't just a clash of definitions; it's a temporal process where the proxy (shape) consumes the source (history). The division of linguistic labor misses this because it assumes experts stabilize reference. Here, institutions stabilize the *proxy*, and the experts lack the authority to stop the drift. The overlap is real: experts do hold a hidden standard, and outsiders do use a stereotype. But the unique mechanism is the *retroactive editing* of the canon to fit the proxy, ensuring the proxy never appears wrong. The experts aren't overruled; they are bypassed. The history isn't argued against; it is re-catalogued as "atypical." This creates a feedback loop where the codified rule becomes more real than the artifacts that spawned it. The contradiction vanishes not through resolution, but through archival revision. This ensures the system remains consistent on paper while diverging from reality.

  The name and the definition
  I propose **Referential Flattening**. This occurs when a category sustained by historical lineage and expert intuition is codified by visible proxies, causing the lineage to be pruned to match the proxy. It is not concept creep, as the boundary doesn't expand; it smooths over. It isn't mere misunderstanding, because the codification becomes the new reality. The edge lies in authority: if experts can veto the rule, it's standard gatekeeping. If the rule vetoes the experts silently, it's flattening. The concept requires a shift from ostensive definition (these examples) to intensional definition (these rules), where the rules gain the power to rewrite the examples. It ends when the lineage is fully severed, leaving only the shape.

  Cases and non-cases
  A clear case is **folk music archiving**: field recordings labeled "Appalachian" are retuned or re-categorized in databases to match music theory standards, erasing microtonal anomalies that defined the style. A second is **vintage car authentication**: a chassis number (history) overrides engine specs (shape), but insurance registries often categorize by engine, eventually forcing restorers to swap original engines to match the paperwork. Non-cases include **concept creep**, where "trauma" expands to include mild stress; that's boundary movement, not internal editing. Also **counterfeiting**: a fake jug lacks the history but pretends to have the shape; that's fraud, not a systemic redefinition. Finally, **standardization** itself isn't flattening if the exceptions are preserved as "variants." Flattening requires the exceptions to be re-described as errors. Another non-case is **translation loss**: meaning is lost, but the original isn't rewritten to match the translation. Here, the original pots are relabeled to fit the catalogue.
