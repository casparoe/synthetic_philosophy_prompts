prompt: |-
  I'm a causal inference statistician — I spend my days with DAGs, potential outcomes, do-calculus, and arguing about which variables count as "background" versus "treatment" — and I just got into a really long argument with a philosopher friend about the doing/allowing distinction. She thinks there's a genuine moral difference between killing someone and letting them die, and I kept trying to say "but isn't that just a difference in the causal structure, like which node you intervene on?" and we went in circles for like a hour and a half. I cant get it to line up in my head.

  So can you restate the doing/allowing debate in the vocabulary I actually work in: counterfactuals and potential outcomes (would the person have died had I not intervened?), causal diagrams and the choice of which variables go into the model versus which get absorbed into the baseline, do-interventions versus not-doing, proximate versus remote causes, and the reference class you pick? I'd like you to go through the main positions — the view that the distinction is real and just tracks causation, the view that it's an illusion, the cases where acting and not-acting both seem to be within your control so "agency" doesn't do the work, and the Doctrine of Double Effect cases where the harm is a foreseen side effect rather than the means — and tell me how each one maps onto my terms.

  Then the part I actually care about: the residue report. Which claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all? I have a hunch the doing/allowing distinction doesn't track pure counterfactual dependence but instead tracks the choice of causal model — which variables you treat as the background versus the intervention — and that this choice is underdetermined by the data, which is exactly the kind of thing I'm used to complaining about. Is that hunch right, or am I smuggling in an assumption from my field and calling it translation? And if there's a residue, is it a defect of my causal-inference vocabulary, or does it show the philosophers' disagreement is less clean than it looks?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Causal inference statistician. Comfortable with DAGs, potential outcomes (Rubin Causal Model), do-calculus (Pearl), confounding, interventions, baseline vs. treatment, counterfactuals.
      *   **The Problem:** Had a 1.5-hour argument with a philosopher friend about the "doing/allowing" distinction (killing vs. letting die). The user tries to reduce it to causal structure (which node you intervene on), but the philosopher insists on a moral difference. The user feels stuck and wants a translation of the philosophical debate into causal inference terminology.
      *   **Specific Tasks:**
          1.  Restate the doing/allowing debate using causal inference vocabulary (counterfactuals, DAGs, do-ops, reference classes, etc.).
          2.  Cover main positions: Real distinction (tracks causation), Illusion (consequentialism/negligence), Agency/Control cases, Doctrine of Double Effect (DDE).
          3.  **The Residue Report:** Evaluate what translates cleanly, what distorts, and what has no expression. Address the user's hunch (that the distinction tracks model specification/background vs. intervention choice) and determine if it's a valid insight or a category error.

  2.  **Deconstruct the "Doing/Allowing" Distinction:**
      *   *Philosophical Core:* Is there a moral asymmetry between actively causing harm (commission) and passively permitting harm (omission)?
      *   *Standard Example:* Pushing someone into a pond (doing) vs. watching them drown when you could save them (allowing).
      *   *Causal Intuition:* In both cases, the outcome (death) counterfactually depends on the agent's action/inaction. $Y(1) \neq Y(0)$.
      *   *The User's Hunch:* The difference lies in how we define the *intervention* and the *baseline*.

  3.  **Drafting the Translation (Section 1: The Vocabulary Map):**
      *   *Potential Outcomes:* Let $A$ be the agent's action, $Y$ be the victim's survival.
          *   Doing: $A=1$ (push), $Y(1)=0$ (die), $Y(0)=1$ (live).
          *   Allowing: $A=0$ (don't save), $Y(0)=0$ (die), $Y(1)=1$ (live).
          *   *Problem:* Mathematically symmetric. $|Y(1) - Y(0)|$ is the same.
      *   *DAGs:*
          *   Doing: $A \rightarrow Y$. $A$ is an exogenous shock to the system.
          *   Allowing: $U \rightarrow Y$ (natural cause), $A \dashrightarrow Y$ (prevention). $A$ blocks the path from $U$.
          *   *Key Insight:* It's about the *default state* of the DAG.
      *   *Do-Calculus:*
          *   Doing: $do(A=1)$ introduces a new cause.
          *   Allowing: $do(A=0)$ fails to block an existing cause.
      *   *Reference Class/Baseline:* What is the "normal" value of $A$? Is $A=0$ "doing nothing" or "refusing to act"?

  4.  **Mapping the Positions (Section 2: The Arguments in CI Terms):**
      *   *View 1: The Distinction is Real (Causal Structure).*
          *   Argument: The DAG topology differs. One adds an edge; the other removes a protective shield.
          *   CI Term: *Structural Asymmetry.* One is an activation of a harmful path; the other is a failure to activate a protective path.
      *   *View 2: The Distinction is an Illusion (Consequentialism).*
          *   Argument: Only $\mathbb{E}[Y]$ matters. If $P(Y=1 | do(A=1)) = P(Y=1 | do(A=0))$, morality is identical.
          *   CI Term: *Exchangeability of Outcomes.* The ACE (Average Causal Effect) is identical in magnitude but opposite in sign relative to the baseline.
      *   *View 3: Agency/Control (The "Easy Rescue" Case).*
          *   Argument: If I can easily save you, my $A=0$ is effectively a choice.
          *   CI Term: *Feasibility Set.* The support of $A$ includes the saving action. Cost function $C(A)$ is low. If $C(A_{save}) \approx 0$, then $A=0$ is a selected intervention, not a passive state.
      *   *View 4: Doctrine of Double Effect (DDE).*
          *   Argument: Harm as side effect vs. harm as means.
          *   CI Term: *Mediation.* $A \rightarrow M \rightarrow Y$.
          *   Means: $M$ is the mechanism of harm. $NDE$ (Natural Direct Effect) is zero; all effect is mediated through harm.
          *   Side Effect: $A \rightarrow Y$ (good) and $A \rightarrow M \rightarrow Y$ (bad). There is a direct effect on the good outcome independent of the harm.

  5.  **The Residue Report (Section 3: The Core Analysis):**
      *   *What Translates Cleanly:* Counterfactual dependence, mediation (DDE), feasibility (cost of intervention).
      *   *What Distorts:* The "Default" state. In stats, $A=0$ is arbitrary coding. In ethics, $A=0$ is "normal course of nature." This requires an external normative prior, not data.
      *   *What Has No Expression:* Normative status of the baseline. Causal inference tells you *what happens* if you change $A$; it doesn't tell you which $A$ is the *null*.
      *   *Addressing the Hunch:* The user suspects the distinction tracks the choice of causal model (background vs. intervention).
          *   *Verdict:* The hunch is **correct**. This is the "Reference Point Problem."
          *   *Is it a defect?* No, it's a feature. Causal models require a "world model." Ethics provides the priors for what counts as "interference" vs. "background."
          *   *Philosophers' Disagreement:* It's not messy; it's about *model specification*. They are arguing over the DAG, not the math on the DAG.

  6.  **Refining the Tone:**
      *   Needs to be respectful of both fields.
      *   Use precise CI jargon (ACE, do-operator, identifiability, DAG topology, mediation analysis).
      *   Avoid dismissing the philosophy; validate the user's intuition that model specification is the crux.
      *   Make the "Residue Report" punchy and actionable.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I explain DDE well enough?* Need to ensure the distinction between "means" and "side effect" maps to mediation analysis (NDE vs. NIE).
      *   *Is the "Baseline" argument clear?* Emphasize that in statistics, coding $0/1$ is arbitrary. In ethics, "doing nothing" has ontological weight. This is the friction point.
      *   *User's Hunch:* Make sure to explicitly confirm this. It's the strongest part of the prompt.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Residue Report" stands out. (Proceed to generate output based on this structure.)
answer: |-
  This is a fantastic collision of fields. You are running into the limit of what formal causal syntax can encode about *normative priors*. Your hunch is sharp: the doing/allowing distinction is largely a dispute over **model specification** (specifically, the definition of the baseline and the exogenous nodes) rather than a dispute over the calculus of counterfactuals once the model is fixed.

  Here is the translation of the doing/allowing debate into the vocabulary of causal inference, followed by the Residue Report you asked for.

  ---

  ### Part 1: The Doing/Allowing Debate in Causal Vocabulary

  Let $A$ be the agent's action, $Y$ be the outcome (e.g., survival), and $U$ be the set of background/unmeasured causes (e.g., gravity, disease, the water in the pond).

  #### 1. The Potential Outcomes Framework (The Symmetry Problem)
  In the Rubin Causal Model, moral symmetry looks like mathematical symmetry.
  *   **Doing (Killing):** You push the victim. $A=1$.
      *   $Y(1) = \text{Death}$, $Y(0) = \text{Life}$.
      *   Causal Effect: $Y(1) - Y(0) = -1$.
  *   **Allowing (Letting Die):** You withhold aid. $A=0$.
      *   $Y(0) = \text{Death}$, $Y(1) = \text{Life}$ (had you acted).
      *   Causal Effect: $Y(0) - Y(1) = -1$.

  **The Statistician's View:** The Average Causal Effect (ACE) is identical in magnitude. The counterfactual dependence is symmetric. If morality supervenes on counterfactuals, there is no distinction.
  **The Philosopher's View:** The *direction* of the deviation from the baseline matters. One is a deviation from the natural course ($U \to Y$); the other is a failure to interrupt the natural course.

  #### 2. DAGs and Structural Asymmetry
  This is where your intuition about "which node you intervene on" lives.
  *   **Doing:** You introduce a new edge $A \to Y$ that did not exist in the natural DAG. You are an exogenous shock.
      *   *Graph:* $A \to Y \leftarrow U$.
  *   **Allowing:** The path $U \to Y$ (e.g., disease $\to$ death) exists naturally. $A$ is a *modifier* or a *blocker* on that path.
      *   *Graph:* $U \to M \to Y$, where $A$ blocks $M \to Y$.

  **The Distinction:** "Doing" activates a harmful path. "Allowing" fails to activate a protective path. In structural equation terms, "Doing" changes the structural function $f_Y$ to include $A$ as a sufficient cause of death. "Allowing" leaves $f_Y$ determined by $U$, where $A$ was merely a potential parameter that remained at its null setting.

  #### 3. The Do-Operator and the Baseline
  The `do()` operator forces a variable to a value. But what is the *null* value?
  *   **Doing:** $do(A=1)$ where $A=0$ is the "natural state" of the agent (inaction).
  *   **Allowing:** $do(A=0)$ where $A=0$ is treated as "withholding."

  **The Conflict:** In statistics, coding $0$ vs $1$ is arbitrary. In ethics, $A=0$ (omission) is often treated as the *reference class* of "no intervention," whereas $A=1$ (commission) is the *treatment*. The philosopher argues that the "untreated" state has ontological priority. You are arguing that $do(A=1)$ and $do(A=0)$ are just two points in the support of $A$, and the distance between them is what matters.

  #### 4. Doctrine of Double Effect (DDE) as Mediation Analysis
  DDE says harm is permissible if it is a side effect, but not if it is the means. This maps cleanly to **Mediation Analysis**.
  Let $M$ be the harmful event (e.g., cutting the skin). Let $Y$ be the good outcome (e.g., saving the life).
  *   **Harm as Means:** $A \to M \to Y$. The Natural Direct Effect (NDE) of $A$ on $Y$ is zero. The effect is fully mediated by the harm.
  *   **Harm as Side Effect:** $A \to Y$ (direct benefit) AND $A \to M$ (collateral harm). There is a non-zero NDE of $A$ on $Y$ that does not pass through $M$.

  In DDE terms, the "means" case is inadmissible because the causal path to the good *requires* the harmful node to fire. The "side effect" case is admissible because the good outcome is identifiable even if we could magically set $M=0$ (conceptually).

  ---

  ### Part 2: The Residue Report

  Here is the audit of what translates, what distorts, and what vanishes.

  #### 1. Clean Translations (High Fidelity)
  *   **Counterfactual Dependence:** The claim "He wouldn't have died but for me" translates perfectly to $Y(1) \neq Y(0)$. Both doing and allowing satisfy this.
  *   **Mediation (DDE):** The distinction between "harm as means" vs. "harm as side effect" is structurally identical to "full mediation" vs. "partial mediation." Causal inference actually clarifies this better than standard philosophical prose.
  *   **Feasibility/Control:** The argument that "I could have easily saved him" translates to the **support of the treatment variable**. If $A_{save}$ is in the feasible set and the cost function $C(A_{save})$ is negligible, then $A=0$ is a chosen intervention, not a passive state.

  #### 2. Distorted Translations (Lossy Compression)
  *   **The "Normal Course of Events":** In CI, the "baseline" is a modeling choice. In ethics, the "normal course" is a metaphysical claim.
      *   *Distortion:* You treat the baseline as $E[Y | do(A=0)]$. The philosopher treats the baseline as $E[Y | \text{Nature}]$. If your $A=0$ (standing still) alters the system compared to "Nature" (you not existing), the math diverges from the moral intuition.
  *   **Omissions as Causes:** CI handles omissions fine ($A=0$ causes $Y$). But ethics often treats omissions as "negative causes."
      *   *Distortion:* In your DAG, an omitted variable is a confounder. In ethics, an omitted *action* is sometimes treated as a cause, sometimes as a non-event. Your vocabulary forces you to model the omission as a variable with a value, which reifies "nothing" into "something."

  #### 3. No Expression (The Residue)
  *   **Normative Status of the Reference Point:** This is the big one. Causal inference can tell you the effect of changing $A$ from 0 to 1. It **cannot** tell you which value of $A$ is the *moral default*.
      *   Is $A=0$ "doing nothing" or "refusing to help"? The data cannot answer this. It requires a prior distribution over "entitlements" or "rights."
      *   *Example:* In a vacuum, $do(\text{inject poison})$ and $do(\text{withhold antidote})$ look symmetric. The distinction relies on an external variable $R$ (Rights/Entitlements) that determines if the agent *owns* the antidote. If $R=1$ (you own it), withholding is allowing. If $R=0$ (it's mine), giving it is doing. $R$ is not in the causal DAG of the physical event; it is in the DAG of the social contract.
  *   **Intentionality as a Structural Parameter:** You can model intention as a variable $I \to A$. But the moral weight of intention in DDE isn't just about the path; it's about the *objective function* the agent is optimizing. CI models the *effect* of the action, not the *loss function* of the actor.

  ---

  ### Part 3: Verdict on Your Hunch

  **Your hunch is correct.**

  The doing/allowing distinction does not track pure counterfactual dependence. It tracks **the choice of causal model**, specifically:
  1.  **Which variables are treated as exogenous (Background) vs. endogenous (Intervention).**
  2.  **Which value of the treatment variable is coded as the Null ($0$).**

  In causal inference, we complain that model specification is "underdetermined by the data." You cannot learn the DAG from observational data alone; you need subject-matter knowledge.
  In ethics, the "subject-matter knowledge" required to specify the DAG is **Normative Theory**.

  *   **The Consequentialist** says: "Specify the model such that only $Y$ matters. $A$ is just a switch. The baseline is arbitrary."
  *   **The Deontologist** says: "Specify the model such that $A$ has a structural prior. Some values of $A$ are 'interference' and some are 'permission.' The baseline is fixed by rights, not data."

  **Is this a defect of your vocabulary?**
  No. It is a feature. Your vocabulary correctly identifies that the disagreement is not about the *consequences* (which are identifiable) but about the *model specification* (which is unidentifiable from data).

  **Is the philosophers' disagreement less clean than it looks?**
  Yes, but not because they are confused. They are arguing about **identification conditions**.
  When you argue with your friend, you are arguing about the **estimand** (the ACE). She is arguing about the **identification strategy** (which DAG represents the moral reality).

  **The Synthesis:**
  You can tell your friend: *"I agree that the causal structure differs. But in my field, choosing which variables are 'background' and which are 'interventions' is a modeling assumption, not a statistical fact. You are smuggling a normative prior into the DAG specification. You're claiming the 'Letting Die' DAG is the true structural model. I'm claiming both DAGs are valid representations of the physics, and the choice between them is a moral prior, not a causal fact."*

  The residue isn't a failure of causal inference; it's the boundary where **causality ends and normativity begins**. Your tools are perfect for analyzing the *structure* of their disagreement, even if they can't solve it.
