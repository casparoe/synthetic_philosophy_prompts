          *   *Analysis:* This is technically accurate. The PBR theorem explicitly assumes that independently prepared systems have independent ontic states ($\rho_{\lambda_1, \lambda_2} = \rho_{\lambda_1} \otimes \rho_{\lambda_2}$). If this is violated, the proof fails.
          *   *Accuracy:* Correct. This is the standard caveat discussed in the literature.

      *   **Move 3: Grad Student's Defense (PI is physically obvious/nonlocality).**
          *   *Claim:* PI is "physically obvious." Violating it implies action at a distance/spooky nonlocality. Therefore, choose PI + $\psi$-ontic OR $\psi$-epistemic + nonlocality.
