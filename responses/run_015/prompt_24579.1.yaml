          *   *Accuracy:* Contested. PI is motivated by separability/locality, but it's stronger than Bell-locality. Violating PI doesn't necessarily imply *signaling* or Bell-type nonlocality in the same way. It implies a holistic constraint on preparations. Calling it "action at a distance" is a specific interpretation, not a settled fact.

