  Where no one acts to block or disrespect
  Freedom is measured by this bare absence
  No power comes to harm or to protect
  The second claims a vital self-essence
  To guide the will and properly direct
  One sits within a silent, empty fence
  The other seeks a capacity to select
  Yet republican liberty claims the right
  That power must not arbitrarily own
  It needs social powers of condition
  For domination blocks the civic light
  Reduce to negative, the status shown
  It dies if arbitrary is obstruction
