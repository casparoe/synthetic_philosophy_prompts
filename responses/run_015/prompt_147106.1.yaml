prompt: |-
  I'm a novelist applying for a three-month writing fellowship and need a one-page proposal. My half-baked idea: everyone treats Zhuangzi's butterfly dream like its just Cartesian skepticism with wings—how do you know you're not dreaming right now?—but I think thats missing the actual punch. The butterfly isnt just an unknown mental state; its a transformation where the self that remembers being human is now a butterfly. So the problem might not be epistemic at all, but about narrative continuity: if your first-person story can include being an insect that was once you, then identity is doing the work that wakefulness usually does, and maybe they come appart. I want the proposal to ask whether Zhuangzi's version specifically breaks first-person continuity in wich Descartes' dream argument doesnt even touch, and whether that matters for fiction that plays with reality and dream. Write it with: the precise question, why the standard skepticism framing leaves this open, the method (close reading of the passage plus comparing it to modern narratology—definately no empirical work), what a result looks like for a novelist actually using this, and what'd count as failure if the distinction collapses. No citations or reading lists, I'll add those myself. Keep it casual—this is for an arts foundation, not a philosophy department.
