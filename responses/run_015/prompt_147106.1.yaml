      **Title:** Project Butterfly: Identity Beyond Wakefulness
      **Intro:** We all know the story. Zhuangzi wakes up unsure if he's a man who dreamed of a butterfly or a butterfly dreaming of a man. Usually, people treat this as the ancient Chinese version of Descartes: How do you know you're not dreaming right now? It's treated as a puzzle about reality vs. illusion.
