answer: |-
  This is a textbook case of what philosophers call **pragmatic encroachment**, weaponized by office politics. You are sensing something real: the board member is not challenging the *truth* of your numbers; he is challenging the *price of being wrong*.

  Here is a breakdown of what is happening epistemically, the difference between the two types of risk-raisers, and how to handle the decision without handing over your power.

  ### 1. Is this a legitimate epistemic move or just pressure?

  It is pressure dressed up as an epistemic point, but it relies on a legitimate philosophical mechanism.

  In epistemology, there is a debate about whether "knowledge" depends only on evidence (Invariantism) or if the stakes of being wrong change whether you can claim to know (Contextualism/Pragmatic Encroachment).
  *   **Low Stakes:** If the funder doesn't care, your standard process (reading the sheets) is enough to say "I know."
  *   **High Stakes:** If an error destroys the nonprofit, the standard for "I know" rises. You might need double-verification to truthfully claim knowledge *in that context*.

  The board member is exploiting this. He knows he cannot prove the numbers are wrong (no new evidence). So, he raises the stakes to raise the threshold for "knowledge." He is trying to move the goalposts so that your usual standard of care no longer counts as "knowing."

  **Is it legitimate?** Only partially. It is legitimate to acknowledge that higher stakes require higher verification *before acting*. It is **not** legitimate to imply that your past nine reports were unknowable or that your current process is inherently flawed without evidence. He is conflating "You haven't verified this enough for a catastrophe" with "You don't know if this is true." Those are different claims.

  ### 2. The Difference: New Evidence vs. Vivid Risk

  You asked for the difference between a stakes-raiser who brings new evidence and one who only makes vivid a risk you'd priced in. This is the crux of your intuition.

  *   **The Evidence-Raiser (Changes the Probability):**
      *   *Claim:* "I noticed the sign-in sheets from Site B are often illegible."
      *   *Effect:* This lowers the probability that your belief is true. It attacks the **truth condition**. Your confidence should drop because the world is likely different than you thought.
      *   *Feeling:* "Oh, I might be wrong."

  *   **The Vivid Risk-Raiser (Changes the Cost):**
      *   *Claim:* "If you are wrong, we all lose our jobs."
      *   *Effect:* This leaves the probability of truth exactly the same (9/9 track record), but it raises the **cost of error**. It attacks the **warrant condition**.
      *   *Feeling:* "I am probably right, but I can't afford to be."

  **Why it feels different:**
  The board member is trying to make the second feel like the first. He wants you to feel the *anxiety* of potential error (which belongs to the cost) and mistake it for *doubt* about the data (which belongs to the evidence).
  *   **New Evidence** says: "The map is wrong."
  *   **Vivid Risk** says: "The cliff is deeper than you thought."
  You are standing on the same ground, but he is screaming about the drop to make you afraid to move.

  ### 3. How to decide: To verify or not to verify?

  You are facing a decision theory problem, not just an epistemic one. You need to separate **Epistemic Certainty** (are the numbers right?) from **Procedural Warranty** (can I defend the numbers?).

  **Do not cancel the three site visits.**
  Canceling site visits hurts the actual program. If the funder audits you, they care about attendance, but they also care about program impact. Sacrificing actual program delivery for administrative paranoia is a net loss for the nonprofit.

  **Do not spend two days re-verifying everything.**
  This validates the board member's framing that your process is unreliable. It sets a precedent that you require 2 days of overtime to do your core job every quarter.

  **The Middle Path: "Proportional Diligence"**
  You need to increase the *warranty* without admitting *doubt*.

  1.  **Spot Check, Don't Re-count:** Spend 2 hours, not 2 days. Randomly select 10% of the sheets and verify the math. This gives you statistical confidence without paralyzing you.
  2.  **Document the Chain of Custody:** Create a one-page memo attached to the report. "Data collected via X method, verified by Y process, spot-checked on Z date." This creates an audit trail. If an error is found later, you can show *due diligence*, which protects you from the "negligence" accusation the board member is hinting at.
  3.  **Reframe the Reply:** Do not say, "I'm not sure, let me check." Say, "The risk is noted. Our process has a 100% accuracy rate over 9 quarters. To align with the high-stakes context you've raised, I have added a spot-check protocol and documented the verification chain for this submission."

  ### 4. Handling the Board Member

  He wants you to hand over the sign-off. If you act panicked, he gets leverage. If you act dismissive, he gets leverage ("she's reckless").

  **Your stance:** "I know the numbers are right based on our established process. However, I acknowledge that the *consequences* of error require us to document that process more rigorously."

  This asserts your epistemic authority ("I know") while accepting his pragmatic point ("The stakes are high"). It denies him the opening to say you are negligent, but it also denies him the opening to say you are incapable of handling the pressure.

  ### Summary
  *   **The Move:** He is using **pragmatic encroachment** to raise the threshold for "knowledge" without providing evidence of error.
  *   **The Distinction:** Evidence changes the likelihood of truth; Vivid Risk changes the tolerance for error. He is pretending the latter is the former.
  *   **The Action:** Do not cancel site visits. Do not re-do all the work. Perform a **spot check** and **document the process**. This satisfies the audit risk without capitulating to the power grab.
  *   **The Mindset:** You still *know* the numbers are right. You just need to build a better shield around that knowledge for the sake of the organization. Don't let him convince you the shield is the knowledge itself.
