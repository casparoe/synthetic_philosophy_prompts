  5.  **Address Question 3: New Evidence vs. Vivid Risk (The Crucial Distinction):**
      *   *New Evidence:* Changes the *probability* that the belief is true (e.g., "I saw a smudge on last quarter's sheet"). This affects the *truth condition*.
      *   *Vivid Risk:* Changes the *cost* of being wrong. This affects the *action threshold*.
      *   *Why it feels different:* One attacks the *world* (the numbers might be wrong); the other attacks the *agent* (you can't afford to be wrong).
      *   *Philosophical Term:* This is the difference between *evidential support* and *pragmatic encroachment*.
      *   *The Manipulation:* The board member is using vivid risk to simulate evidential doubt. He wants you to feel like the numbers are wrong, when actually he just wants you to feel the pain of potential error more acutely.

