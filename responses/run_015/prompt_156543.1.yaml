      "still_counts_as_doing_good": "yes | no | qualified",
      "why": "..."
    },
    "weakest_link": "...",
    "confidence": 0.0
  }

  Use 0.0 to 1.0 for "confidence", understood as your confidence in the overall reconstruction rather than in any single claim.
