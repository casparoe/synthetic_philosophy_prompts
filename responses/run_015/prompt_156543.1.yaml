answer: |-
  # The Architecture of Tractability

  To reconstruct the rationality of this practice, we must first catalogue the implicit commitments embedded in its moves. We begin by listing ten candidate commitments, rejecting those that fail to explain the specific tensions observed.

  First, *Straightforward Expected Utility Maximisation*: the view that the point estimate represents the true mathematical expectation of value. I reject this because the evaluators explicitly admit the uncertainty bounds are too wide for the point estimate to be epistemically honest. Second, *Satisficing*: the view that agents merely seek interventions that are "good enough." I reject this because the practice involves ranking and recommending the top option, implying maximisation. Third, *Institutional Legibility*: the view that the numbers exist solely for donor coordination, not truth. I reject this as merely compatible; it explains the existence of numbers but not the logical structure of the "cluelessness haircut." Fourth, *Risk Neutrality*: the view that variance in outcomes does not matter. I reject this because the haircut discounts uncertain effects, implying aversion. Fifth, *Moral Realism about Aggregation*: the view that there is a fact of the matter about the single number. I reject this as underdetermined; the practice works even if the number is a heuristic.

  The commitments that do the explanatory work are four. *Commensurability of Value*: the assumption that diverse goods (health, income, existence) can be reduced to a single metric. *Separation of Criterion and Procedure*: the distinction between what makes an act right (consequences) and how an agent should decide (heuristics). *Uncertainty-Based Temporal Discounting*: the principle that future effects are discounted due to decaying probability, not intrinsic time preference. *Ambiguity Aversion*: the preference for known risks over unknown model structures.

  ## Theory of Rationality and Decision Procedure

  The practice presupposes a hybrid theory of rationality. Publishing a point estimate suggests *expected utility theory*—the view that rational agents choose the action with the highest sum of probabilities multiplied by values—but the admitted uncertainty complicates this. If agents held *imprecise credences*—representing belief as a range of probabilities rather than a single number—straight maximisation would be impossible, as some options would be incomparable. The practice resolves this by treating the point estimate as a *proxy for tractability*. The "cluelessness haircut" is not a departure from expected value reasoning but a correction for model uncertainty. It functions as a penalty for causal complexity. When effects are systemic or distant, the number of unmodelled variables increases, widening the credence interval. Discounting these effects is a heuristic for maximising expected value under the constraint that our models are likely misspecified.

  This leads to the distinction between *criterion* and *procedure*. The *criterion of rightness* is consequentialist: an act is right if it produces the best actual outcomes. The *decision procedure* is the method agents use to choose. The epistemic objection to consequentialism argues that if we are clueless about consequences, the theory cannot guide action. This practice accepts the consequentialist criterion but adopts a non-consequentialist procedure. It uses rules (like the haircut) and proxies (like point estimates) that are not themselves consequentialist calculations but are believed to track consequentialist success over time. This combination is coherent provided the procedure is reliably connected to the criterion. The practice needs this separation; without it, the admission of deep uncertainty would paralyse action.

  ## Weighting, Cluelessness, and Inconsistency

  The practice presupposes a solution to *weighting-cluelessness*—uncertainty about how to aggregate different values—by publishing a single number denominated in health-per-dollar. This assumes *commensurability*: that life years, income, and existence can be traded off against one another on a single scale. The practice locates cluelessness primarily in the world (outcome-cluelessness), not in values. It assumes we know what is good (health/welfare) but not how to achieve it.

  The apparent inconsistency between discounting near-term systemic effects (move 2) while claiming confidence in far-term existential effects (move 5) is resolved by distinguishing temporal distance from causal complexity. The principled line is not time, but *causal structure*. Near-term systemic effects (e.g., market distortions) involve complex, feedback-heavy systems where models are fragile. Far-term existential effects (e.g., preventing extinction) are often modelled as binary events with simpler causal chains (e.g., an asteroid hits or it does not). The practice is consistent if it discounts complexity, not time. The "Lower-Bound Rule" (move 4) does not resolve this but smuggles in *maximin* reasoning—maximising the minimum possible outcome—which conflicts with the expected utility framework unless uncertainty is treated as absolute ignorance.

  ## Underdetermination and Strong Cluelessness

  Three distinct theories license this behaviour. First, a *Permissivist Bayesian* view holds that any precise credence within the wide bounds is rationally acceptable; the point estimate is simply one permissible choice. Second, an *Imprecise Credence* view holds that belief is inherently a set of probabilities; the point estimate is a reporting convention for the centre of the set, while the haircut reflects the width of the set. Third, a *Rule-Consequentialist* view holds that agents should follow rules that generally maximise good, regardless of case-by-case calculation.

  These are discriminated by observable changes. If the Permissivist view holds, evaluators should be indifferent between different point estimates within the bounds. If the Imprecise view holds, they should publish intervals and change rankings when intervals overlap. If the Rule view holds, they should stick to the heuristic even when specific evidence suggests it fails. Currently, the practice is underdetermined between these, though the demand for single numbers leans Permissivist.

  If we took the strongest cluelessness worry seriously—where imprecise credences and incommensurability prevent any expected value calculation—the practice would collapse. Evaluators would stop publishing point estimates. They would start publishing causal maps and uncertainty intervals. Money would move via *diversification* across cause areas rather than concentration on the top rank, prioritising *option value* (keeping future choices open) and funding meta-level research to reduce uncertainty. This would still count as doing good, but it would resemble venture capital portfolio management rather than engineering optimisation.

  ## Weakest Link

  The weakest link in this reconstruction is the assumption that causal tractability correlates with moral value. The practice assumes that what we can measure and model is what matters most. If the most valuable interventions are precisely those with complex, unmeasurable systemic effects (e.g., political reform), the "cluelessness haircut" systematically biases resources away from the highest-impact opportunities. An observation of high-impact interventions consistently emerging from unmodelled, complex systems would force abandonment of the haircut heuristic.

