prompt: |-
  You are a philosopher who works at the intersection of normative ethics, decision theory, and social epistemology — someone equally at home with expected-utility theory, the debate over imprecise or indeterminate credences, and the literature on what agents and institutions owe each other when they cannot foresee the results of what they do. Please reason carefully and slowly, and argue from the structure of the problem rather than from the literature: I do not want citations, author names, or reading suggestions, and I am not interested in who said what first. Define every technical term you use.

  Before you write the answer proper, brainstorm in a few paragraphs: list eight to ten candidate commitments that the practice described below might carry — including at least three you will go on to reject as merely compatible with the practice, as misdescriptions of it, or as views under which the practice would look exactly the same. Give one line on why you reject each. Then commit to the three or four that do the real explanatory work, and reconstruct those in full.

  The practice. Over roughly the last fifteen years a recognisable institutional style has grown up around spending money so as to do good. Independent evaluators study interventions of the sort that aid and development agencies run — unconditional cash transfers, insecticide-treated bednets, deworming programmes, micronutrient supplementation, and the like — and publish a headline figure: dollars per life saved, or health-adjusted life years averted per thousand dollars. The headline figure is a point estimate, stated to two or three significant digits. The uncertainty around it is large and heterogeneous: plausible bounds differ by factors of five or ten, and not merely because of sampling noise but because of model choice, whether effects decay, whether they generalise to a new country, and what the intervention does to people the study never measured — local markets, siblings, future births, government budgets.

  The evaluators know this, and their practice contains all of the following moves at once, which is what puzzles me:

  1. They say that what matters is the *sign* — we can be confident the intervention helps rather than harms, and we should not pretend to fine-grained precision about magnitude.
  2. They apply what I will call a cluelessness haircut: effects that are further away in causal space, more systemic, or further in the future are discounted before they enter the ranking, on the grounds that we are likelier to be wrong about them.
  3. They nevertheless rank interventions by the headline point estimate and recommend whatever is on top.
  4. Some participants propose replacing (3) with what I will call the Lower-Bound Rule: rank by the pessimistic end of the interval rather than the middle, because the middle is a fiction.
  5. The very same community that demands tight experimental evidence before acting on near-term effects will, in other contexts, make confident comparative claims about interventions whose effects are supposed to run centuries or millennia into the future.

  Two distinctions I want you to use, though you should tell me if they are ill-drawn. First: separate *outcome-cluelessness* — we cannot predict the total downstream consequences of an action — from *weighting-cluelessness* — even granted a complete and correct list of consequences, we do not know how to aggregate them, whether because the values at stake are incommensurable, or because the aggregation rule itself is contested (how to weigh near-term against far-term welfare, how to handle effects on the number and identity of future people, whether welfare is the only thing that goes into the sum). Most discussion I have seen concerns the first; I suspect this practice carries more commitments about the second than anyone states aloud, since publishing a single number denominated in health-per-dollar already assumes a great deal about commensurability. Second: distinguish the consequentialist *criterion* of rightness from the *decision procedure* an agent or institution should actually run.

  What I want from you:

  - Reconstruct the implicit theory of practical rationality under deep uncertainty. What view of rational choice does publishing and acting on a point estimate presuppose — straightforward expected-value maximisation, a permissivist view on which any of a range of rankings is rationally acceptable, a robustness or ambiguity-averse rule, or merely a satisficing heuristic? Does the cluelessness haircut in (2) presuppose something incompatible with straight expected value, or can it be reconstructed as expected-value reasoning under model uncertainty — a mixture over models rather than a departure from expected value? Be careful to distinguish what the practice *strictly presupposes* from what it merely fits well with, and say where it is underdetermined.
  - Does the practice presuppose a settled answer to the epistemic objection to consequentialism — that we are clueless about consequences and so consequentialism cannot guide action? Or is it better read as accepting a consequentialist criterion of rightness while adopting a non-consequentialist decision procedure? If the latter, is that combination coherent, and does the practice actually need it?
  - What does the practice presuppose about aggregation and commensurability, that is, about weighting-cluelessness? And what does it presuppose about where cluelessness lives: in the world, in our evidence, or in the values?
  - Name at least three quite different theories that would each license roughly this behaviour — I would like one permissivist-Bayesian candidate, one imprecise-credence candidate, and one rule- or virtue-theoretic candidate — and for each say what observable change in the practice would discriminate it from the others. Where exactly is the practice philosophically underdetermined?
  - Settle the apparent inconsistency between (2) and (3) on the one hand and (5) on the other. Is there a principled line between the long-run effects we are entitled to forecast and the long-run effects we are entitled to discount, or is the practice simply inconsistent? Does (4) help, or does the Lower-Bound Rule smuggle in a decision rule nobody has defended?
  - If we took the strongest version of the cluelessness worry seriously — the version on which imprecise credences plus incommensurability mean there is no expected value to be maximised at all — what would have to change? Be concrete: what would evaluators stop publishing, what would they publish instead, how would money actually move (diversification across causes, buying information, patience, option value, funding meta-level research, accepting a hit-and-miss portfolio), and would any of that still count as doing the most good?
  - Finally, identify the weakest link in your own reconstruction and say what argument or observation would make you abandon it.

  Write 1,000 to 1,400 words of polished prose, organised under headings, with no citations and no named authors. Then append a single JSON object, valid and parseable on its own, with exactly this schema:

  {
    "presuppositions": [
      {
        "practice_feature": "the element of the practice in question, e.g. 'point-estimate ranking', 'cluelessness haircut', 'sign-only confidence', 'Lower-Bound Rule'",
        "implicit_commitment": "the commitment it carries",
        "status": "strictly_presupposed | strongly_suggested | merely_compatible",
        "rivals_excluded": "which rival views this rules out, or 'none' if it rules none out",
        "warrant": "one sentence of justification"
      }
    ],
    "rejected_candidates": [ {"candidate": "...", "why_rejected": "..."} ],
    "underdetermination": [
      {
        "theory": "name of the theory",
        "licenses_practice_because": "...",
        "discriminating_observation": "what change in the practice would tell us this theory, rather than its rivals, is the right one"
      }
    ],
    "criterion_vs_procedure": { "reading": "...", "coherent": true, "needed_by_practice": true, "comment": "..." },
    "weighting_vs_outcome": { "more_load_bearing": "outcome | weighting | neither", "argument": "..." },
    "inconsistency_verdict": { "consistent": true, "principled_line_if_any": "...", "resolution": "..." },
    "if_cluelessness_taken_seriously": {
