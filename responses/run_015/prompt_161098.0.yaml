answer: |-
  This is a sharp distinction, and you are right to sense that it cuts across the standard "fundamental vs. derived" or "axiom vs. theorem" dichotomies. You are identifying a difference in **modal role** and **temporal function**.

  There is no single canonical term that captures exactly what you want without baggage, but there are three overlapping frameworks in the literature that get close. I will walk through them, explain where they miss your target, and then offer a synthesis that handles your Humean worries and the Second Law edge case.

  ### 1. The Historical Precedent: Principle vs. Constructive Theories
  Einstein introduced this distinction in 1919.
  *   **Constructive theories** (e.g., kinetic theory of gases) build up complex phenomena from simple entities using dynamical laws. They tell you *how* things happen.
  *   **Principle theories** (e.g., Thermodynamics, Special Relativity) start from empirically observed constraints (e.g., "no perpetual motion," "speed of light is constant") that limit possibilities. They tell you *what* can happen.

  **Where it fits:** It captures your "constraint vs. push" intuition perfectly. Principle theories eliminate candidate histories without specifying the mechanism.
  **Where it fails:** Einstein's distinction is about *theories*, not individual laws within a theory. You can have a principle theory that contains dynamical equations (like GR). Also, in modern physics, conservation laws are often derived *within* constructive theories via Noether's theorem, blurring the line. However, your observation that they survive theory change suggests they function *as if* they were principle-theory elements even when embedded in constructive frameworks.

  ### 2. The Technical Distinction: Kinematical vs. Dynamical Constraints
  In classical mechanics and GR (specifically the ADM formalism), there is a hard mathematical distinction.
  *   **Dynamical equations** (Evolution equations): Tell you how state $\psi(t)$ becomes $\psi(t+\delta t)$. (e.g., Schrödinger eq, Einstein field equations' time components).
  *   **Constraint equations**: Must be satisfied by the state at *any* given time slice. (e.g., Gauss's law $\nabla \cdot E = \rho$, the Hamiltonian constraint in GR).

  **Where it fits:** This matches your "rules out histories" vs. "pushes along" distinction. Constraints define the phase space; dynamics define the trajectory through it.
  **Where it fails:** In standard philosophy of physics, "kinematical" is often treated as definitional or conventional, whereas you are noting that these constraints (like Energy Conservation) have *more* modal force than the dynamics. Also, the Uncertainty Principle is often derived from the dynamics (commutation relations), yet functions as a kinematical constraint.

  ### 3. The Metaphysical Distinction: Meta-laws (Marc Lange)
  This is the most relevant philosophical literature for your Humean worry. Marc Lange (specifically in *A Surprising Metaphysics* and *Because Without Cause*) argues exactly your point: Conservation laws and Symmetry principles possess a stronger variety of **nomic necessity** than ordinary dynamical laws.

  *   **First-order laws:** The dynamical laws (e.g., Newton's force laws). They govern events.
  *   **Meta-laws:** Symmetries and Conservation principles. They govern the *first-order laws*.

  **Why this matters for you:** Lange argues that if Conservation of Energy were just a theorem derived from the dynamical laws (the Humean/Best-System view), it would be contingent on those laws. But our intuition (and your observation about theory change) is that Energy Conservation is *more* stable than the dynamics. If the dynamics changed, Energy Conservation would still hold (constraining the *new* dynamics).
  Therefore, Lange argues, they cannot be mere theorems of the Best System. They must be meta-laws that explain *why* the dynamics have the form they do.

  **Where it fails:** Lange focuses on Symmetries as the meta-laws, with Conservation as their consequence. You are focusing on Conservation/Exclusion directly. Also, Lange is an anti-Humean; he uses this distinction to *break* the Best System Account. If you want to remain Humean-friendly, this creates tension.

  ---

  ### The Humean Tension: Theorems vs. Governors
  You asked: *"On a best-system picture these look like theorems rather than axioms — so maybe they aren't laws at all?"*

  This is the crux. On a strict Lewisian Best System Account (BSA), there is no distinction in kind between axioms and theorems. Everything is just a sentence in the best deductive system. If Conservation of Energy makes the system simpler (by summarizing many dynamical facts), it's in the system.

  However, your intuition about **robustness** highlights a known weakness in BSA. BSA struggles to account for *counterfactual stability*.
  *   **Dynamical Law:** "If I had pushed the ball harder, it would have accelerated more."
  *   **Constraint:** "If the dynamics had been different (e.g., inverse-cube law), Energy would *still* have been conserved (provided time-translation symmetry held)."

  If Conservation is just a theorem of the actual dynamics, it shouldn't hold in worlds with different dynamics. But physicists treat it as holding across theory space.
  **Verdict:** If you stay Humean, you must call these **"High-Compression Theorems."** They aren't laws that govern; they are summaries so robust they *look* like governors. If you go Anti-Humean, they are **"Meta-laws."**

  ---

  ### Edge Case: The Second Law of Thermodynamics
  Does it fit in your box?
  *   **Constraint?** Yes. It rules out histories where entropy decreases (macroscopically). It is often used to rule out models (no perpetual motion machines) rather than calculate specific trajectories.
  *   **Robustness?** Yes. It survives changes in micro-dynamics (classical, quantum, stochastic).
  *   **Difference:** It is **probabilistic** and **time-asymmetric**. Your other examples (Energy, Pauli, Uncertainty) are typically deterministic constraints (or strict bounds) and time-symmetric (except for measurement collapse issues).

  **Verdict:** It belongs in the box, but it is a **Statistical Constraint** rather than a **Structural Constraint**. It constrains the *measure* over histories, not just the support.

  ---

  ### Proposed Terminology
  Since "Meta-law" implies governing the laws (Lange's view) and "Kinematical" implies mere definition, I suggest adopting a distinction used in some corners of foundations of physics, refined for your purpose:

  **1. Evolutionary Laws (The "Pushers")**
  *   **Function:** Propagate state $t \to t+\delta t$.
  *   **Form:** Differential equations in time.
  *   **Modal Status:** Contingent on the specific theory (e.g., Newton vs. Schrödinger).
  *   **Humean Status:** Axioms of the Best System.

  **2. Structural Constraints (The "Rulers")**
  *   **Function:** Define the manifold of physically possible states/histories.
  *   **Form:** Algebraic relations, integral conditions, inequalities (e.g., $\Delta x \Delta p \geq \hbar/2$, $\nabla_\mu T^{\mu\nu} = 0$).
  *   **Modal Status:** Trans-theoretic (survive dynamics change).
  *   **Humean Status:** High-compression theorems that function *as if* they were axioms due to their stability across the "space of nearby theories."

  ### Why this distinction matters for your PhD
  If you are working on Humeanism, this distinction is your lever.
  The Humean says: "Laws are just summaries of events."
  You ask: "Why do some summaries (Constraints) survive the replacement of other summaries (Dynamics)?"
  If the Constraints are just summaries of the events, and the Dynamics are summaries of the events, why do the Constraints constrain the Dynamics?

  **The "Coinage":**
  If you need a label for your dissertation, I recommend **"Trans-theoretic Constraints."**
  *   **Definition:** Principles that restrict the space of physically possible histories independently of the specific evolutionary equations governing those histories, characterized by their stability across theory change.
  *   **Borderline Cases:**
      *   *Second Law:* In (Statistical Constraint).
      *   *Einstein Field Equations:* Out (They are dynamical, though they contain constraint components).
      *   *Causality/Signal Locality:* In (Often treated as a constraint on the dynamics).
      *   *Boundary Conditions:* Out (These are contingent facts, not nomic constraints).

  This allows you to acknowledge the Humean view (they are part of the system) while capturing the anti-Humean intuition (they play a different functional role in scientific reasoning, specifically in model selection and theory construction). It validates your intuition that "governing" for a constraint means **filtering** rather than **pushing**.
