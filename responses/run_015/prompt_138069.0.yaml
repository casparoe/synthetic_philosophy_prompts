  hey — i need a poem to close out the last session of my intro metaphysics seminar. weve spent two weeks on the statue and the clay and i want something better out of them than huh, weird.

  write a sestina: six stanzas of six lines plus a three-line envoi. end-words in this opening order — CLAY, STATUE, SHAPE, GRAM, SAME, STILL — permuted properly, and the envoi has to get all six back in and land on STILL. no need for strict meter, just keep the lines roughly the same length.

  put it in a museum conservation lab that is deciding whether to roll the whole piece into a ball to ship it and re-form it at the other end, and get the metaphysics right rather than naming it: the lump survives being squashed, the statue doesnt; the lump predates the sculptor, the statue doesnt; the statue can lose or gain a bit of matter and carry on, the lump has the matter it has; and right now the two of them are in the same place, same matter, same weight, same causal powers, so it isnt physics that settles which one is there. someone who actually knows this literature should find the poem right, not just find the word constitution in it.

  the thing im really after, though, is a view ive been pushing on them, call it the paper-thin view: there is no deep fact about which of the two the museum has beyond what its bookkeeping tracks — the piece is insured at two million as a statue and at the price of raw material as clay, and if the gallery switched to insuring by the gram, or some religion bought the lump and consecrated it, then on this view what the museum has would change too. i want the poem to work that consequence honestly, including the way it makes the answer sound optional, and to let the sestina form carry it: the same six words coming back over and over in new company, never turning into one another. feel free to let the speaker flirt with the move that there is no statue at all, just clay arranged statuewise, but dont let the poem settle there either. american english please, and leave it unresolved — no last line that tells the students which thing it is.
