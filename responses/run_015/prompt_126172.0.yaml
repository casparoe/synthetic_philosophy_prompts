answer: |-
  Dear Colleague,

  I have spent the last few weeks wrestling with the construction you requested, and I must confess that the constraints you imposed are far more restrictive than they initially appear. The demand for a fixed roster and budget, combined with the prohibition on imperceptible differences and the requirement for replication stability, effectively blocks the usual pathways to intransitivity. Before settling on the case I will present below, I worked through and discarded two constructions that I suspect you will recognize as familiar temptations. The first was a variation on Temkin's spectrum arguments, where I allocated pain relief across six fixed patients with varying intensities of suffering; I set this aside because it inevitably relies on accumulating imperceptible losses or qualitative shifts that verge on the indistinguishable, which violates your constraint against smuggling in differences too small to notice. The second was a variant of Parfit's Mere Addition, where I attempted to simulate a population increase by splitting a single beneficiary's share into two smaller shares for distinct individuals; I discarded this because it violates the fixed roster constraint by effectively introducing a new claimant into the moral equation. Both of these constructions ultimately re-stage the classic paradoxes in new vocabulary rather than generating a genuine intransitivity within the strict bounds of an ordinary institutional decision.

  The case that remains, and which I believe meets your specifications, involves a Regional Health Board allocating a fixed budget of three million dollars across six named patients: Arthur, Beatrice, Charles, Diana, Edward, and Fiona. The budget allows for exactly three full treatment packages, which cannot be split, and the options differ in which patients receive the full treatment and which receive only palliative care. The patients have distinct medical profiles. Arthur, Beatrice, and Charles are currently in stable but chronic conditions; a full treatment would grant them significant quality-of-life improvements, yielding a total of ninety quality-adjusted life years across the three. Diana, Edward, and Fiona are in acute, life-threatening distress; a full treatment would save their lives but yield only fifteen quality-adjusted life years in total due to their poor prognoses, though without it they die immediately. We have three options on the table. Option A funds Arthur, Beatrice, and Charles. Option B funds Diana, Edward, and Fiona. Option C funds all six patients with a partial treatment regimen that saves the lives of Diana, Edward, and Fiona while granting significant improvement to Arthur, Beatrice, and Charles, but at a lower total aggregate benefit than Option A due to inefficiencies in splitting the resource, yielding eighty quality-adjusted life years in total.

  The verdicts are as follows. In the pairwise comparison between A and B, Option A is better than Option B. The reasoning here is that while Option B satisfies the priority principle by saving the lives of the worst off, the aggregate loss in welfare is so massive—ninety years versus fifteen—that the utilitarian consideration of total benefit outweighs the priority consideration. The gap in total welfare is robust and clear, and any reasonable evaluator would judge that preventing the loss of ninety years of good life is more important than saving three lives that will be very short, provided the three who lose out do not die but merely remain in chronic conditions. In the pairwise comparison between B and C, Option B is better than Option C. Here, the trade-off is between saving the lives of the worst off completely versus saving everyone partially. The priority principle dominates because the difference in need is acute; Diana, Edward, and Fiona face immediate death in Option C if the partial treatment is insufficient to sustain them long-term, but let us stipulate that in Option C they survive but with severe disability, whereas in Option B they survive with moderate disability. Actually, to make the verdict clear, let us refine the medical facts: in Option C, the partial treatment saves everyone's life but leaves Diana, Edward, and Fiona in a state of severe pain, whereas Option B relieves that pain completely for them but leaves Arthur, Beatrice, and Charles in chronic pain. The verdict B is better than C rests on the principle that relieving severe suffering for the worst off takes precedence over relieving chronic suffering for the better off, even if the total welfare in C is slightly higher. Finally, in the pairwise comparison between C and A, Option C is better than Option A. Here, the trade-off is between total aggregate benefit and fairness. Option A yields ninety years but abandons half the group to death or severe neglect, while Option C yields eighty years but treats everyone with equal concern. Because the gap in total benefit is small—only ten years—the principle of fairness and equal concern outweighs the marginal gain in aggregate utility. Thus we have A better than B, B better than C, and C better than A.

  The structural feature doing the work here is the context-sensitive weighting of competing moral principles. The weight assigned to aggregate utility, priority to the worst off, and fairness is not fixed but shifts depending on the magnitude of the stakes in the specific comparison. When the utility gap is large, utility dominates priority. When the need gap is acute, priority dominates fairness. When the utility gap is small, fairness dominates utility. This is an essentially comparative view of value. If we remove this feature and impose a single metric, such as a fixed weighted sum of QALYs and equality scores, the cycle collapses immediately. For instance, if we assign a fixed weight to equality, then either A will beat C in all cases or C will beat A in all cases, restoring transitivity. Similarly, if we impose a lexical threshold where priority always trumps utility, B would beat A, breaking the cycle. The intransitivity exists only because the moral force of a principle is sensitive to what it is being compared against.

  Regarding replication stability, if we duplicate this situation into two non-interacting copies with twelve patients and double the budget, the same cycle reappears. The gaps in utility, need, and fairness all scale proportionally. The ratio of the utility gap in the A versus B comparison remains large, preserving the verdict that A is better than B. The acuity of the need in the B versus C comparison remains high relative to the chronic nature of the other claims, preserving B over C. The smallness of the utility gap in the C versus A comparison remains marginal relative to the fairness violation, preserving C over A. The structural relations are preserved under duplication, so the cycle is replication-stable.

  The strongest reply available to someone who insists betterness must be transitive is to argue that my clear verdicts are really incompleteness or verdict-fragility in disguise. They will argue that I do not truly judge A better than B all-things-considered, but rather that A is better than B with respect to utility and B is better than A with respect to priority, and I have no meta-principle to resolve the conflict, leaving the overall betterness relation incomplete. Furthermore, they will raise the money-pump objection: if a committee truly preferred A to B, B to C, and C to A, they could be induced to pay a fee to switch from A to B, then from B to C, then from C to A, ending up back at A with less money and no improvement, which is irrational. My best answer to this is to distinguish between the betterness relation and rational choice. Betterness is a theoretical relation describing the value of states of affairs, while rational choice is a practical constraint on agents. A rational committee, aware of the cycle, would not engage in sequential pairwise switching; they would recognize the cycle and choose from the feasible set {A, B, C} using a secondary decision rule, such as selecting the option that is not beaten by a large margin or simply picking one arbitrarily. The existence of a money pump shows that intransitive betterness cannot guide sequential choice without modification, but it does not prove that the underlying value relation is transitive. The intransitivity lies in the value, not necessarily in the rationality of the agent who knows the structure of their values.

  Closing with an honest judgement on whether all four constraints can be satisfied at once, I must concede that while the case above is constructed to meet them, Constraint Two regarding robust verdicts is the most vulnerable. The transitivity defender will insist that if the verdicts are truly robust and all-things-considered, transitivity must hold, and that my appeal to context-sensitive weighting is merely a description of incompleteness where the weights are indeterminate. If one constraint must give, it is Constraint Two, because maintaining the claim that the verdicts are clear and complete while admitting they cycle requires a conception of value that many find metaphysically unstable. However, if we accept that value is essentially comparative, then Constraint Two can be held, but only at the cost of accepting that rational choice requires policies rather than direct pursuit of the better option. Ultimately, the case demonstrates that intransitivity is possible in fixed populations without spectra, but it rests on a controversial view of how moral principles interact.

  Yours,

  A. Theorist
