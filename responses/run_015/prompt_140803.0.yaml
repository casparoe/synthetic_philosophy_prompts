answer: |-
  The MFA faculty will argue that expanding "propaganda" to include art-for-art's-sake empties the word of meaning, and your answer must turn on proving that aesthetic neutrality is a political luxury unavailable to Black artists in 1926.

  ### **PREP SHEET**

  **1. The MFA Faculty Objection (Most Damaging)**
  *   **The Objection:** "You're redefining propaganda so broadly it loses its bite. If 'art for art's sake' is propaganda, then everything is propaganda, and you've just won a semantic victory while losing the ethical distinction."
  *   **The Reply:** "I am not saying everything is propaganda everywhere. I am saying that in a context of racial subjugation, claiming neutrality is a claim that the status quo is acceptable. When a white writer writes for art's sake, she assumes a public that shares her humanity. Du Bois argues the Black artist cannot assume that public exists yet. So 'art for art's sake' isn't an escape from propaganda; it's propaganda for the status quo. The word retains its bite because it identifies who benefits from the silence. If you claim your work doesn't persuade, you are persuading us that persuasion isn't necessary."
  *   **Softest Spot:** This sounds like you are accusing them of bad faith or complicity simply for valuing aesthetics.

  **2. The Locke Scholar Objection**
  *   **The Objection:** "Du Bois explicitly judged art by its content—whether it showed Negroes in a 'good light.' Your 'stance' theory erases the actual historical conflict where Locke fought for the right to portray ugly truths without being called a traitor."
  *   **The Reply:** "You're right that Du Bois cared about content, and I concede he often conflated the two. But his theoretical criterion—'all art is propaganda'—fails if it only means 'uplift messages.' If it means 'stance toward public,' it explains why he attacked Locke: not just for what Locke portrayed, but for addressing a white public that consumed Black pain as entertainment without answering to the Black community. I'm rescuing the theory from Du Bois's own inconsistent application of it."
  *   **Softest Spot:** Admitting Du Bois was inconsistent undermines your authority on him.

  **3. The Art Historian Objection**
  *   **The Objection:** "'Answerability' sounds like Bakhtin or reception theory. Why dress existing literary theory in the clothes of propaganda studies? What work is the word 'propaganda' doing here that 'addressivity' doesn't?"
  *   **The Reply:** "Reception theory describes how meaning is made. Propaganda describes how power is exercised. 'Answerability' isn't just about interpretation; it's about accountability. My condition requires the work to invite a refusal that carries cost. Reception theory doesn't measure the stakes of that refusal. I use 'propaganda' because Du Bois used it, and he used it because he was talking about war, not just hermeneutics."
  *   **Softest Spot:** "Cost" is vague; you haven't defined what the cost of refusing your novel is.

  **4. The 'Bad Art' Objection**
  *   **The Objection:** "Does this framework excuse aesthetically failed work if the politics are right? Are we back to measuring novels by their moral utility?"
  *   **The Reply:** "No. Stance is the floor, not the ceiling. A pamphlet might meet the propaganda criterion but fail as art. Du Bois wanted art that was both. My argument is that without the stance, the art fails its people, regardless of its beauty. But beauty remains necessary. I'm not arguing for bad art; I'm arguing that good art cannot be politically innocent."
  *   **Softest Spot:** Du Bois sometimes praised aesthetically weak work if it helped the cause.

  ### **STRATEGIC NOTES**

  **Where You Are Simply Wrong**
  You are historically wrong that Du Bois ignored message. He explicitly demanded positive representation and criticized art that portrayed Blacks as criminals or unintelligent, regardless of its stance toward the public. You are retrofitting a structuralist theory onto a moralist man.

  **What to Concede Preemptively**
  Concede in your opening remarks that Du Bois's own application of this criterion was often moralistic and content-focused. Frame your talk as a *reconstruction* of what the criterion *could* mean to save it from its historical limitations, not as pure exegesis.

  **The Single Reply That Must Land**
  Objection #1 (The MFA Faculty). If you convince the writers that "neutrality is a political stance," you turn the room from hostile to implicated. If you fail here, you are just a politician lecturing artists.

  **The Question You Hope Nobody Asks**
  "Does your novel successfully achieve this answerability, or does it just manipulate the reader into feeling guilty without offering a way to answer?"
