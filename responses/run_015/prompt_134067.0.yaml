answer: |-
  To the Seminar Participants

  The following conceptual map is designed to orient your navigation of the debates surrounding the means of valid knowledge, or pramāṇas, within classical and Navya-Nyāya thought. Rather than cataloging schools by name or chronology, this taxonomy arranges positions according to the logical space of their epistemological commitments. You should treat this as a diagnostic tool for identifying the structural consequences of specific claims about cognition, allowing you to locate historical viewpoints as occupants of these logical nodes rather than as the primary organizing principle. We begin at the root of the tree with the most fundamental division concerning the sufficiency of the empirical and rational faculties. The first split asks whether direct perception and inference are jointly sufficient to account for all valid cognition, or whether the landscape of knowledge requires sources beyond these two. If one maintains that perception and inference are exhaustive, one occupies the reductionist leaf typically associated with Cārvāka materialists and certain Buddhist epistemologists. In this position, any claim to knowledge via comparison or testimony must be reconstructed as a complex mixture of seeing and reasoning. For instance, knowing a cow by hearing a description of its horns and hump is not a distinct cognitive event but merely an inference based on the reliability of the speaker and the perceptual memory of the features described. This view denies that analogical comparison, or upamāna, operates as an independent source, collapsing it instead into perception coupled with inference, and similarly treats verbal testimony as inferential chain involving speaker reliability and linguistic convention.

  If, however, one argues that valid cognition requires sources beyond direct perception and inference, one moves down the expansionist branch, which immediately forces a decision regarding the status of verbal testimony. Here the conceptual case turns on whether verbal knowledge of a distant object requires an irreducible authority relation or whether it can be subsumed under inference. One possible position holds that testimony is reducible to inference, a stance that occasionally appears in Mīmāṃsā-inspired arguments regarding human speech where the validity of the word is derived from an inference about the speaker's competence and honesty. Occupants of this node accept extra sources beyond perception and inference in principle but deny that language provides a unique, irreducible access to reality, treating the understanding of meaning as a process of reasoning rather than immediate grasping. Conversely, if one claims that testimony is irreducible, asserting that the relation between word and meaning is autonomous and not mediated by inferential markers of reliability, one proceeds further down the tree to the question of comparison. At this juncture, the student must decide whether analogical comparison operates as an independent source or collapses into perception coupled with inference. The standard classical Nyāya view maintains that upamāna is autonomous, arguing that the cognition of similarity between a known object and a described object involves a unique relational knowledge that cannot be fully parsed into separate acts of perceiving and inferring. Those who deny this independence, often aligning with Buddhist critics, revert to a composite model where comparison is merely the recognition of a perceptual similarity triggered by an inferential expectation.

  For those who maintain both testimony and comparison as irreducible, the final major split concerns the cognition of absence. The question here is whether recognizing that there is no pot on the ground demands recognition as a distinct fifth means, known as anupalabdhi, or whether such negative cognition can be subsumed under one of the canonical four. The classical Nyāya position typically subsumes the knowledge of absence under perception or inference, arguing that non-existence is registered within ordinary perception as a qualified locus rather than requiring a separate faculty. However, the Navya-Nyāya position often introduces anupalabdhi as a distinct means, arguing that absence is a real objective category that requires a specific epistemic instrument to be known, distinct from the perception of positive entities. This creates a terminal leaf where five autonomous sources are recognized, distinguishing the later technical developments from the earlier four-fold scheme. There exists also a synthetic stance that preserves the four traditional labels but reinterprets their internal relations, perhaps by expanding the definition of perception to include the grasp of absence or by redefining inference to cover the relational knowledge of comparison. This position occupies a leaf that is structurally similar to the classical four-fold view but differs in its internal mechanics, representing a theoretical adjustment designed to preserve traditional terminology while accommodating new ontological commitments.

  Having established these branches, we must note explicitly any combinations in the logical space that remain unoccupied. For instance, there is no stable historical position that accepts absence as a distinct fifth source yet denies that comparison is independent. This gap likely reflects incoherence rather than mere neglect, because a thinker who posits a special faculty for knowing non-existence is already committed to the reality of abstract or negative categories, making it inconsistent to deny that the relational knowledge involved in comparison warrants similar ontological standing. Similarly, a view that accepts five autonomous sources yet denies comparison altogether remains unoccupied, as the acceptance of anupalabdhi usually correlates with a broader realism that supports the independence of upamāna. These gaps suggest that the logical space is constrained by underlying ontological commitments; one cannot easily mix a robust realism about absence with a reductionist view of relational knowledge without undermining the coherence of the system.

  Finally, you should flag any pair of positions that these branches genuinely cannot separate, particularly where later syntheses replicate the structural commitments of the classical four-fold scheme under revised descriptions. The classical Nyāya view and the synthetic stance that preserves the four labels but reinterprets their internal relations are often indistinguishable at the level of terminal outcomes, even if their internal definitions of perception or inference differ. For example, if a later thinker defines perception broadly enough to include the knowledge of absence but still counts only four sources, the external taxonomy records this as identical to the classical view, masking the significant internal shift in how perception is understood. This limitation highlights that the taxonomy maps commitments regarding the number and autonomy of sources, but it cannot fully capture shifts in the definition of the sources themselves. Consequently, while this map allows you to diagnose whether a thinker treats testimony as inferential or autonomous, it may not reveal whether their definition of inference has been stretched to accommodate what others call testimony. You are therefore advised to use this structure as a preliminary diagnostic rather than a definitive classification, keeping in mind that two thinkers located on the same leaf may still disagree on the nature of the cognitive processes that populate that node. This diagnostic map should serve as a foundation for your analysis of the primary texts, allowing you to identify where a author is arguing for the necessity of a new branch or attempting to collapse an existing one into a more parsimonious structure.
