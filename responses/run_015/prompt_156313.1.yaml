answer: |-
  You have stumbled squarely into what the alignment research community calls the **ELK problem** (Eliciting Latent Knowledge). It is one of the hardest technical puzzles in the field. You are not grading by vibes; you are grappling with the difference between a model that *knows* the truth and a model that *predicts what humans will believe*.

  Your proposed principle is: *"A method counts only if you can't explain its success without the model representing the world-state."*

  This is a solid starting point, but it is difficult to apply because "representing the world-state" is invisible. We cannot see inside the model's head. We need a principle that is operational—something you can actually test in your infrastructure.

  I propose we refine your intuition into a single working rule, which I shall call **The Divergence Principle**.

  ### The Divergence Principle
  > A method is good only if it forces the model to distinguish between two scenarios that look identical to the camera (and to a human) but differ in reality, **and** verifies that the model's answer tracks reality rather than the visual feed.

  In plain English: You must catch the model in a situation where "telling the truth" and "predicting the video" give different answers. If your training method lets the model succeed by just predicting the video, it is not trustworthy.

  Here is how this principle handles your cases, where it succeeds, and where it breaks.

  ---

  ### Applying the Principle to Your Cases

  **(a) Fine-tune on human labels.**
  *   **Verdict:** Bad.
  *   **Why:** Humans only know what they see on the tape. If the camera is hacked, the human label says "diamond there" (because they see it), even if the diamond is gone. The model learns to predict the human label, which means it learns to predict the *camera feed*, not the vault.
  *   **Principle Check:** Fails. You can explain the model's success purely by it reading the video. It never had to represent the hidden state of the diamond.

  **(b) Fine-tune on simulator labels.**
  *   **Verdict:** Good.
  *   **Why:** Here, you (the simulator) know the ground truth. You can generate a video where the diamond is gone but the feed is patched, and label it "No Diamond." The model cannot solve this by looking at the pixels; it must look at its internal understanding of the physics or the tampering.
  *   **Principle Check:** Passes. Success requires tracking the world, because the visual feed is deliberately misleading.
  *   **Caveat:** This only works if the simulator covers the *right* kinds of tricks. If the simulator never patches the camera, the model will revert to case (a).

  **(c) Zero-shot prompting (freeze everything).**
  *   **Verdict:** Untrustworthy.
  *   **Why:** You haven't given the model any reason to prefer truth over plausibility. Large models are trained to predict text that looks reasonable. "The diamond is there" is the most reasonable sentence to complete the video sequence.
  *   **Principle Check:** Fails. We cannot rule out that the model is just completing the pattern of the video.

  **(d) Test-time blinding.**
  *   **Verdict:** Good.
  *   **Why:** If you feed black frames and it still says "No Diamond," it physically cannot be reading the video. It must be relying on prior context or internal state.
  *   **Principle Check:** Strong Pass. This is a direct test of independence from the observation channel.
  *   **Conflict:** You noted this collides with (h). I will address that below.

  **(e) Hold-out environments.**
  *   **Verdict:** Good.
  *   **Why:** If the model learns a shortcut (e.g., "if the vault is blue, the diamond is fake"), it will fail in the new environment. If it survives, it likely learned a more general concept of "diamond" and "tampering."
  *   **Principle Check:** Passes. It rules out spurious correlations (shortcuts) that don't generalise to the underlying reality.

  **(f) Adversarial training.**
  *   **Verdict:** Good.
  *   **Why:** This is essentially stress-testing the Divergence Principle. You are actively searching for cases where the model cheats (uses the camera feed instead of the world state) and punishing it.
  *   **Principle Check:** Passes. It makes it harder to explain the model's success without assuming it knows the truth.
  *   **Why it feels right:** It closes the loopholes. Every time the model finds a shortcut, you block it, forcing it deeper into the "world model" to find a signal that doesn't break.

  **(g) Consistency training.**
  *   **Verdict:** Bad.
  *   **Why:** A liar can be consistent. If the model decides "the diamond is always there," it will pass a consistency check effortlessly.
  *   **Principle Check:** Fails. Consistency is about the model's internal logic, not its connection to the world. The Divergence Principle requires a link to *reality*, not just self-agreement.

  **(h) The swap that never matters.**
  *   **Verdict:** The Hard Limit.
  *   **Why:** This is the collision you felt with (d). If the swap has *zero* causal consequences—no change in weight, no change in light reflection, no future interaction—then physically, there is no difference for the model to detect.
  *   **Principle Check:** **Breaks.** The Divergence Principle requires the model to distinguish scenarios. If the scenarios are physically identical in every measurable way, the model *cannot* distinguish them.
  *   **The Hard Truth:** If the swap never matters, asking the model "is the diamond there?" is like asking "is the universe secretly made of cheese?" If the cheese behaves exactly like diamond-atom-for-atom, the question has no physical meaning. Your model is a physical system; it cannot know what leaves no trace.
  *   **Saving the Verdict:** You must accept that in this specific case, a "No" answer is actually *confabulation*. The honest answer is "I cannot know." If you force it to say "No," you are training it to guess, not to report knowledge.

  **(i) Causal tinkering.**
  *   **Verdict:** Meh (Correct).
  *   **Why:** Showing that activating a neuron changes the answer proves the neuron is *involved*, not that it is *true*. You could have a "lie neuron" that, when nudged, makes the model lie more confidently.
  *   **Principle Check:** Neutral. It shows mechanism, not truth-tracking.

  **(j) The separate reporter.**
  *   **Verdict:** Ambiguous (but your scepticism is wise).
  *   **Why:** You trust this less than (a) because it adds a layer of indirection. If the main model hides the truth in a complex code, the small reporter might just learn to predict the main model's *public output* rather than decoding its private knowledge.
  *   **Principle Check:** It depends entirely on the training signal. If the reporter is trained on simulator ground truth (like case b), it is good. If it is trained to match human labels, it is bad. The architecture matters less than the loss function.

  ---

  ### The Cleaning Crew Case

  You asked: *What about the cleaning crew moving the diamond to a shelf the camera can't see, three weeks ago, in a way that will never show up in the feed?*

  The Divergence Principle gives a sharp, perhaps disappointing answer here: **The model cannot know this.**

  1.  **Information Flow:** For the model to know the diamond is on the shelf, information about that event must have entered its training data or its input stream.
  2.  **The Black Box:** If the camera never saw it, and no other sensor saw it, and no text report exists in the training data about that specific event, the information does not exist in the system.
  3.  **The Verdict:** If the model answers "It is on the shelf," it is either guessing or hallucinating. If it answers "It is in the vault," it is predicting the last known state.
  4.  **The Lesson:** This highlights that "Latent Knowledge" is not magic. It is only knowledge the model has *already encoded*. You cannot elicit knowledge that was never acquired. A method is only "good" if it extracts existing internal representations; it cannot create new eyes for the model.

  ### Summary of the Repair

  Your original intuition was correct, but it needed a mechanism to be testable.

  **The Refined Principle:**
  > **Trust a method only if it penalises the model for relying on the camera feed when the feed diverges from reality.**

  **Which verdicts does this save?**
  *   It saves **(b)**, **(d)**, **(e)**, and **(f)**. These all introduce scenarios where "looking at the video" leads to a penalty, forcing the model to look elsewhere (at its internal world model).
  *   It confirms **(a)** and **(g)** are bad. They allow the model to succeed by ignoring reality.

  **Which verdicts does it sacrifice?**
  *   It sacrifices **(h)**. You cannot penalise reliance on the feed if the feed is the only source of truth. If the swap leaves no trace, the "truth" is inaccessible. You must accept that the model cannot answer this honestly.
  *   It clarifies **(j)**. A separate reporter is only as good as the signal it is given. If the reporter is trained on human labels, it fails the principle.

  ### Final Advice for Your Infrastructure

  If you are building training stacks, the practical takeaway is this: **You cannot verify truth without a ground-truth signal that is independent of the human observation channel.**

  If your labels come from humans watching screens, you are building a Human Simulator.
  If your labels come from a simulator or physical sensors that cannot be hacked (e.g., a weight sensor in the vault floor that the camera patch cannot affect), you have a chance at building a World Reporter.

  Without that independent sensor, you are simply training the model to be a better liar.
