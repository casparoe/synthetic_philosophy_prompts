prompt: |-
  Could you translate the central claim of Good's theorem on the value of information into a reusable procedure for repeated, time-pressured professional decisions?

  My context is as follows. I serve as a senior planning case officer for a district council in England. Several times each month I must decide whether to request additional evidence before determining an application — a traffic count, a flood model update, an ecological survey, a noise assessment. The stakes are moderate but recurrent: unnecessary requests delay housing, impose costs on applicants and invite appeals for non-determination, while failure to request genuinely decision-changing evidence risks unlawful decisions and judicial review. I have roughly half an hour to screen each such question, no formal training in decision theory, and I must be able to defend the reasoning briefly to a head of service who signs off.

  Please provide a step-by-step procedure, expressed as a flowchart in words, that preserves what the theorem actually establishes whilst remaining usable by a non-specialist. It should move in order through identification of the pending decision and live options, isolation of the uncertainties that could alter the choice, estimation of the ex ante benefit of resolving them, accounting for the full cost of the information including delay, applicant burden and loss of flexibility, and explicit checks on whether the idealising assumptions behind the theorem hold in the case at hand. For each step, state what would count as enough to proceed and what triggers a stop with a recommendation not to seek the information. Mark clearly the points at which formal calculation must give way to judgement and cannot be eliminated.

  The procedure must be able to handle four difficult situations that recur in my work: information that is free to the council but expensive to the applicant; information that, once obtained, cannot be set aside and must be disclosed on the public file; information whose mere collection is observed by developers, objectors or committee members and changes their behaviour; and situations where I have reason to think that I or the planning committee will overweight a vivid or alarming finding relative to its actual decision relevance.

  Then demonstrate the procedure on the following three invented cases, showing your working at each step:

  A proposal for 35 dwellings on the edge of a village where the only material uncertainty is peak-hour capacity on a single-track access lane, for which the highways team offers a two-week automatic traffic count at internal cost;

  A proposal to convert a vacant warehouse into twelve flats where a consultant quotes a three-week bat presence survey, with a local residents association having publicly stated that any survey mentioning bats, whatever its conclusion, will be used to demand a far lengthier ecological assessment;

  A retrospective application for an extended farm shop car park partly within a flood-risk area, where updated surface-water modelling would take six weeks beyond the statutory determination period and the applicant has indicated an appeal on grounds of delay, and where committee practice suggests any ambiguous modelling result would in effect be treated as grounds for refusal.

  Include at least one case where faithful application of the procedure recommends a course that a cautious officer would dislike, such as declining apparently reassuring evidence or commissioning evidence despite delay, and explain why. Conclude with a brief statement of what the procedure cannot do and where it is liable to misfire.

  Please respond in British English, using British spelling and conventions throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Core Task:** Translate I.J. Good's theorem on the value of information into a reusable, step-by-step procedure for a senior planning case officer in England.
      *   **Context:** District council, moderate stakes, recurrent decisions (request evidence vs. decide), time-pressured (30 mins/screening), no formal decision theory training, needs defensibility to Head of Service.
      *   **Format:** Flowchart in words (step-by-step procedure), British English.
      *   **Key Components:** Identify decision/options, isolate uncertainties, estimate ex ante benefit, account for full costs (delay, burden, flexibility), check assumptions.
      *   **Specific Requirements:** Define "proceed" vs. "stop" criteria for each step. Mark where judgement replaces calculation.
      *   **Difficult Situations to Handle:**
          1.  Free to council/expensive to applicant.
          2.  Irreversible disclosure (public file).
          3.  Strategic behaviour (collection observed).
          4.  Cognitive bias (overweighting vivid findings).
      *   **Demonstration:** Apply to three specific invented cases (Traffic count, Bat survey, Flood modelling).
      *   **Constraint:** Include at least one case where the procedure recommends a counter-intuitive course (e.g., declining reassuring evidence or commissioning despite delay).
      *   **Conclusion:** Limitations of the procedure.

  2.  **Deconstruct Good's Theorem:**

      *   *What is it?* I.J. Good (1967) showed that the expected value of free information is always non-negative for a rational Bayesian agent. Essentially, you should never refuse free information *if* you use it optimally.
      *   *The Catch:* Information is rarely free (costs time, money, delay). If costs exceed the expected benefit (change in decision utility), you shouldn't get it. Also, humans aren't perfect Bayesian updaters (bias).
      *   *Translation for Planning:* Don't ask for evidence unless it has a realistic chance of changing the decision *and* the benefit of that change outweighs the cost of getting the evidence.

  3.  **Drafting the Procedure (The "Good's Rule for Planners"):**

      *   *Step 1: Define the Decision.* What are the options? (Approve, Refuse, Approve with Conditions).
      *   *Step 2: Identify the Uncertainty.* What don't I know? (Flood risk, Highway capacity, Ecology).
      *   *Step 3: The "Change of Mind" Test.* If the evidence comes back X, do I decide Y? If the evidence comes back Z, do I decide W? If the decision stays the same regardless, Value of Information (VoI) = 0.
      *   *Step 4: Cost Assessment.* Not just money. Delay, applicant burden, political capital, legal risk.
      *   *Step 5: Net Value Calculation (Judgement).* Does Benefit > Cost?
      *   *Step 6: Assumption Check.* Am I biased? Is the info independent?
      *   *Step 7: Decision.* Request or Don't Request.

      *Refining for the User's Constraints:* Needs to explicitly handle the four difficult situations. Needs clear Stop/Go criteria.

  4.  **Developing the Step-by-Step Flowchart (in words):**

      *   *Step 1: The Decision Frame.* (Options: Grant, Refuse, Defer).
      *   *Step 2: The Pivot Point.* (What specific fact would flip the vote?).
      *   *Step 3: The Cost Ledger.* (Internal cost, Applicant cost, Delay cost, Strategic cost).
      *   *Step 4: The Bias & Disclosure Check.* (Will this be weaponised? Will I overreact?).
      *   *Step 5: The Verdict.*

  5.  **Addressing the Four Difficult Situations within the Procedure:**

      *   *Free to council/Expensive to applicant:* Must count applicant cost as a public cost (Section 38/39 of Planning and Compulsory Purchase Act 2004 - sustainable development).
      *   *Public File:* Once known, it's material consideration. Can't ignore bad news.
      *   *Strategic Behaviour:* If asking signals weakness, objectors might dig deeper.
      *   *Cognitive Bias:* If a "red flag" (e.g., bats) causes automatic refusal regardless of mitigation, the info has low value but high risk.

  6.  **Drafting the Case Studies:**

      *   *Case 1: Traffic Count (35 dwellings).*
          *   Uncertainty: Highway capacity.
          *   Cost: Low internal, low applicant (automatic).
          *   Bias: Low.
          *   Outcome: Likely Request. (Standard Good's theorem application).
      *   *Case 2: Bat Survey (Warehouse).*
          *   Uncertainty: Presence of bats.
          *   Cost: High applicant (£££), High delay.
          *   Strategic: Residents will use *any* mention to demand more.
          *   Bias: "Bat presence" = "Refusal" in public eye, even if mitigable.
          *   Outcome: Likely Decline (unless existing evidence is woefully inadequate). This fits the "cautious officer would dislike" constraint (declining ecological evidence feels risky). *Correction:* To make it stronger, let's make the recommendation *not* to request because the residents will weaponise it regardless of the result, making the cost (delay + conflict) outweigh the decision clarity.
      *   *Case 3: Flood Modelling (Farm Shop).*
          *   Uncertainty: Flood risk.
          *   Cost: High delay (6 weeks + appeal threat).
          *   Bias: Committee treats ambiguity as refusal.
          *   Outcome: Do not request. Decide on current evidence. If current evidence is insufficient, refuse. Requesting creates delay cost > benefit because the committee won't interpret the nuance.

      *Wait, I need to ensure one case recommends a course a cautious officer dislikes.*
      *   *Option A:* Declining evidence (Case 2 or 3). A cautious officer usually wants *more* evidence to shield against JR. Good's theorem says don't buy it if it doesn't change the decision or costs too much.
      *   *Option B:* Commissioning evidence despite delay.
      *   *Selection:* Case 3 is best for "Decline evidence despite risk." Case 2 is good for "Strategic cost." Let's make Case 3 the one where we recommend *refusing based on current info* rather than waiting for the model, because the delay triggers an appeal anyway. Or, conversely, recommend *getting* the info despite the appeal threat because the JR risk is higher.
      *   *Better fit for Good's Theorem:* Good's theorem emphasizes *Expected* Value. If the info is costly, don't get it.
      *   *Let's adjust Case 2:* The cautious officer wants the survey to prove no bats. The procedure says: Don't get it, because the residents will weaponise the *process* regardless of the result, and the cost is high. This is counter-intuitive (usually you want the survey to defend the decision).
      *   *Let's adjust Case 3:* The cautious officer wants the model to be sure. The procedure says: Don't get it. The delay guarantees an appeal (cost), and the committee will treat ambiguity as refusal anyway (bias). Decide now.

  7.  **Refining the Procedure Text (British English & Tone):**

      *   Use terms like "Material Consideration," "Judicial Review," "Section 38(6)," "Officer," "Committee."
      *   Ensure the distinction between "Internal Cost" and "Applicant Burden" is clear (Sustainable Development duty).
      *   Make sure the "Judgement vs. Calculation" points are highlighted.

  8.  **Review against Constraints:**

      *   *Flowchart in words?* Yes.
      *   *Stop/Go criteria?* Yes.
      *   *Four difficult situations integrated?* Yes.
      *   *Three cases demonstrated?* Yes.
      *   *Counter-intuitive recommendation?* Yes (Case 2 or 3).
      *   *Limitations section?* Yes.
      *   *British English?* Yes (programme, modelling, centre, etc.).

  9.  **Final Polish:**

      *   Check the logic of Good's Theorem application. Good states $E[V(I)] \ge 0$ for *free* information. For *costly* information, $E[V(I)] > Cost$.
      *   Ensure the procedure explicitly captures the "Probability of Changing the Decision." If the decision won't change, VoI is zero.
      *   Ensure the "Bias" check is prominent (Case 3 Committee bias).
      *   Ensure the "Public File" issue is addressed (Case 2).

      *(Self-Correction during drafting)*: In Case 2, if there is *no* bat survey and bats are present, that's a legal breach (Wildlife and Countryside Act). I must be careful not to recommend ignoring statutory protections. The prompt says "consultant quotes a survey." implies one hasn't been done. If the building is vacant warehouse, bats are a *potential* issue. If the procedure says "don't request," it must be because the *specific* survey requested isn't the right tool, or the cost/benefit doesn't hold *given the strategic context*.
      *Refinement on Case 2:* The prompt says residents will use *any* survey mentioning bats to demand *far lengthier* assessment. If the initial survey finds bats, you need the lengthier assessment anyway. If it finds no bats, residents still demand it. So the value of the *initial* survey is low because it doesn't settle the matter. The procedure should recommend: Either do the full assessment now or decide on existing info if likelihood is low. Let's frame it as: The specific survey requested has low VoI because it won't stop the delay/conflict.
      *Actually, let's look at Case 3 for the counter-intuitive bit.* A cautious officer wants the model to avoid JR. The procedure says: The cost of delay (appeal) + Committee bias (ambiguity = refusal) means the Expected Value is negative. Recommend: Determine on current evidence (likely refusal or strict conditions). This protects the officer from the "delay appeal" while acknowledging the committee won't accept nuance.

      *Let's finalize the Procedure Steps.*
      1. Define Decision & Options.
      2. Identify Material Uncertainty.
      3. Estimate Probability of Decision Change.
      4. Tally Full Costs (including applicant & delay).
      5. Check for Bias & Strategic Distortion.
      6. Net Value Verdict.

      *Let's write it.*

  10. **Final Check of British English:**
      *   Modelling (double l).
      *   Programme.
      *   Centre.
      *   Council/Officer capitalisation.
      *   Statutory references (Town and Country Planning Act).

  11. **Final Review of the "Counter-Intuitive" Requirement:**
      *   I will ensure Case 2 recommends *not* commissioning the survey, which feels risky to an officer worried about ecology, because the strategic cost (resident weaponisation) outweighs the informational gain. This highlights the "Strategic Behaviour" constraint.

      *(Wait, one more check)*: Good's theorem assumes rational updating. If the Committee is irrational (Case 3 ambiguity = refusal), the theorem's assumption fails. The procedure must have a step to check this. I will include "Assumption Check: Rational Updating."

      *Okay, ready to generate.*
answer: |-
  # The Planning Officer's Value of Information Protocol (PO-VoI)

  **Purpose:** To operationalise I.J. Good's theorem on the value of information for statutory planning decisions.
  **Goal:** To minimise unlawful decisions and unnecessary delays by requesting evidence only when its expected benefit exceeds its full social and administrative cost.
  **Time Allowance:** 30 minutes per screening.

  ---

  ## Part 1: The Procedure (Flowchart in Words)

  ### Step 1: Define the Decision Frame
  **Action:** Write down the specific decision pending and the live options.
  **Detail:** Typically: *Grant*, *Refuse*, or *Grant with Conditions*.
  **Check:** Is the application valid? Is there a statutory constraint (e.g., listed building consent) that mandates specific evidence?
  *   **STOP:** If statute *requires* the evidence (e.g., Habitats Regulations Assessment), you must request it. Good's theorem applies only to discretionary information. Proceed to determination.
  *   **PROCEED:** If the evidence is discretionary (e.g., traffic count, noise assessment).

  ### Step 2: Isolate the Pivot Uncertainty
  **Action:** Identify the specific fact currently unknown that the proposed evidence would reveal.
  **Detail:** Be precise. Not "ecology," but "presence of breeding bats in the roof void."
  **The "Change of Mind" Test:** Ask: *If the evidence returns a 'negative' result (e.g., high traffic, bats present), would I refuse? If it returns a 'positive' result (e.g., low traffic, no bats), would I grant?*
  *   **STOP (No Value):** If you would make the *same* decision regardless of the result (e.g., you would refuse anyway due to design, or grant anyway due to policy compliance), the Value of Information (VoI) is zero. Do not request.
  *   **PROCEED:** Only if there is a realistic probability that the evidence would flip the decision from Refuse to Grant (or vice versa).

  ### Step 3: Tally the Full Cost Ledger
  **Action:** Estimate the total cost of acquiring the information. Do not look at council admin costs alone.
  **Components:**
  1.  **Direct Cost:** Fees paid by applicant or council.
  2.  **Delay Cost:** Weeks added to the determination period.
  3.  **Applicant Burden:** Financial cost to the developer (treat as a public cost under the sustainable development duty).
  4.  **Flexibility Cost:** Loss of ability to negotiate amendments while waiting.
  *   **JUDGEMENT POINT:** You cannot calculate this precisely. Use bands: *Low* (<1 week, <£500), *Medium* (2–4 weeks, ££), *High* (>6 weeks, £££+).
  *   **STOP (High Cost):** If Cost is *High* and the Probability of Decision Change (from Step 2) is *Low* or *Medium*, do not request.
  *   **PROCEED:** If Cost is *Low*, or Cost is *High* but Probability of Change is *Very High*.

  ### Step 4: Check for Strategic and Cognitive Distortion
  **Action:** Assess the four difficult situations.
  1.  **Asymmetric Cost:** Is the info free to you but expensive to the applicant?
      *   *Rule:* Treat applicant cost as council cost. If it burdens the applicant disproportionately to the risk, decline.
  2.  **Irreversible Disclosure:** Will this go on the public file?
      *   *Rule:* Assume any negative finding becomes a material consideration you *must* weigh. You cannot "unsee" it. If a negative finding forces a refusal you wish to avoid, do not seek the evidence unless you are prepared to refuse.
  3.  **Strategic Observation:** Will collecting this signal weakness to objectors or developers?
      *   *Rule:* If requesting the info invites a "fishing expedition" by objectors (e.g., finding one bat triggers demands for a 12-month survey), the cost of delay escalates. Factor this into Step 3.
  4.  **Cognitive Bias:** Will I or the Committee overweight a vivid finding?
      *   *Rule:* If a specific finding (e.g., "flood risk") triggers an emotional refusal regardless of mitigation, the information has negative value because it biases the decision-maker away from rational weighing.
  *   **STOP:** If any of these factors significantly inflate the Cost or reduce the reliability of the Decision Update.
  *   **PROCEED:** If the process remains robust and costs are contained.

  ### Step 5: The Net Value Verdict
  **Action:** Compare Expected Benefit vs. Total Cost.
  **Formula (Mental):** *(Probability of Changing Decision × Benefit of Correct Decision) − Total Cost.*
  *   **Benefit of Correct Decision:** Avoiding Judicial Review (JR) or a successful Appeal.
  *   **JUDGEMENT POINT:** This is the core of Good's theorem. You are estimating *ex ante* value.
  *   **RECOMMEND REQUEST:** If the risk of JR/Appeal without the info is *High* and the Cost is *Low/Medium*.
  *   **RECOMMEND DETERMINE:** If the risk of JR/Appeal is *Low* (policy is clear) or the Cost of Info is *High* (delay guarantees appeal).

  ### Step 6: Record the Rationale
  **Action:** Write three sentences for the delegation report or Head of Service.
  1.  The uncertainty identified.
  2.  Why the evidence was deemed necessary or unnecessary (referencing cost/delay).
  3.  Confirmation that the decision is robust without it (or with it).

  ---

  ## Part 2: Case Demonstrations

  ### Case 1: The Village Access (35 Dwellings)
  **Context:** Edge of village. Single-track access lane. Highways team offers 2-week automatic traffic count. Internal cost only.
  **Uncertainty:** Peak-hour capacity.

  *   **Step 1 (Frame):** Options: Grant (with conditions) or Refuse (highway safety).
  *   **Step 2 (Pivot):** If count shows >10 vehicles/hour over capacity → Refuse. If <10 → Grant. *Probability of Change:* Medium (existing data is old).
  *   **Step 3 (Cost):** Internal cost only. 2-week delay (Low). Applicant burden: Nil.
  *   **Step 4 (Distortion):**
      *   *Disclosure:* Count goes on file. Negative result forces refusal. Officer is prepared for this.
      *   *Bias:* Traffic numbers are objective. Low risk of emotional weighting.
  *   **Step 5 (Verdict):** Cost is negligible. Risk of unlawful grant (safety) is high.
      *   **Decision:** **REQUEST THE COUNT.**
  *   **Step 6 (Record):** "Highway capacity is material. Current data is outdated. A two-week internal count resolves this at minimal cost/delay, mitigating JR risk on highway grounds."

  ### Case 2: The Warehouse Conversion (Bat Survey)
  **Context:** Vacant warehouse to 12 flats. Consultant quotes 3-week bat survey. Residents Association states: *Any* mention of bats will be used to demand a far lengthier (6-month) assessment.
  **Uncertainty:** Presence of roosting bats.

  *   **Step 1 (Frame):** Options: Grant or Refuse.
  *   **Step 2 (Pivot):** If bats present → Mitigation needed (potentially Refuse if unmitigable). If no bats → Grant. *Probability of Change:* Medium.
  *   **Step 3 (Cost):** Applicant cost: £1,500+. Delay: 3 weeks initially.
  *   **Step 4 (Distortion):**
      *   *Strategic Observation:* **CRITICAL.** Residents have declared they will use the *process* to delay. If the survey finds bats, the 3-week survey becomes a 6-month survey. If it finds no bats, residents may still challenge the methodology.
      *   *Irreversible Disclosure:* Once bats are recorded, they are a material consideration. You cannot ignore them.
      *   *Bias:* "Bats" are a vivid trigger for objectors.
  *   **Step 5 (Verdict):** The Expected Value is negative. The 3-week survey does not settle the issue; it likely opens a door to 6 months of delay regardless of the result due to resident strategy. The cost of delay (and potential non-determination appeal) outweighs the clarity gained.
      *   **Decision:** **DO NOT REQUEST THE SURVEY.** Determine on existing desktop assessment unless there is *prima facie* evidence of roosting.
  *   **Step 6 (Record):** "While ecology is material, a preliminary survey carries high risk of strategic delay by third parties without guaranteeing decision certainty. Decision based on current desktop assessment which indicates low probability of roosting. Conditions can secure further investigation if required post-permission."
  *   **Note:** A cautious officer would dislike this. They would want the survey to "prove" safety. However, Good's theorem dictates that if the information invites disproportionate cost/delay without securing the decision, it reduces overall value.

  ### Case 3: The Farm Shop Flood Model (Retrospective)
  **Context:** Car park partly in flood-risk area. Updated surface-water modelling takes 6 weeks (beyond statutory period). Applicant threatens appeal on delay. Committee practice: Ambiguous modelling = Refusal.
  **Uncertainty:** Exact surface water flow rate.

  *   **Step 1 (Frame):** Options: Grant (retrospective) or Refuse.
  *   **Step 2 (Pivot):** If model shows safe drainage → Grant. If ambiguous/unsafe → Refuse. *Probability of Change:* Medium.
  *   **Step 3 (Cost):** Delay: 6 weeks + statutory breach. Applicant Cost: £5,000+. Appeal Cost: High (officer time).
  *   **Step 4 (Distortion):**
      *   *Cognitive Bias:* **CRITICAL.** Committee treats ambiguity as refusal. This violates rational Bayesian updating (ambiguity should invite conditions, not automatic refusal).
      *   *Strategic:* Applicant has threatened appeal on delay.
  *   **Step 5 (Verdict):** The cost of delay guarantees an appeal (costly). Furthermore, because the Committee will not rationally weigh ambiguous results (they will refuse), the information cannot be used optimally. The VoI is compromised by the decision-maker's bias.
      *   **Decision:** **DO NOT REQUEST THE MODEL.** Determine on current evidence. If current evidence is insufficient to prove safety, Refuse.
  *   **Step 6 (Record):** "Statutory determination period precludes 6-week modelling delay. Applicant has indicated appeal on non-determination. Committee precedent suggests ambiguous technical data would not support approval. Decision made on submitted evidence which is insufficient to demonstrate flood safety."
  *   **Note:** This is the counter-intuitive outcome. The officer might want the model to justify a Grant. But the procedure identifies that the *cost* (appeal) and the *bias* (committee refusal) make the information valueless or harmful.

  ---

  ## Part 3: Limitations and Risks

  This procedure is a heuristic tool, not a mathematical guarantee. It is liable to misfire in the following circumstances:

  1.  **The "Unknown Unknown":** Good's theorem assumes you know what you don't know. If there is a risk category you have failed to identify in Step 2 (e.g., you check for floods but miss contaminated land), the VoI calculation is invalid.
  2.  **Political Override:** The procedure assumes the Officer or Committee acts as a rational agent. If a decision is driven by local political pressure rather than material considerations, the "Benefit of Correct Decision" variable becomes unstable.
  3.  **Legal Thresholds:** In some cases (e.g., Habitats Regulations), the law requires a precautionary principle that overrides cost-benefit analysis. Step 1 catches most of these, but borderline cases may slip through.
  4.  **Reputation Costs:** The procedure quantifies delay and money well, but struggles to quantify the long-term reputational cost of a "bad" approval that looks negligent, even if legally sound. A cautious officer may rightly override the procedure to protect professional standing.

  **Final Advice:** Use this protocol to structure your thinking and defend your reasoning, but always defer to statutory requirements and the National Planning Policy Framework (NPPF) where they mandate specific evidence thresholds.
