prompt: |-
  Hey — I'm a journalist who covers science and ideas and I've been roped into teaching a one-off session for second-year PPE undergrads on how groups make up their minds. Could you draft me a 45-minute essay question on the discursive dilemma that they can't just answer by reciting premise-based vs conclusion-based? I want to give them a fresh 3-editor newsroom case I made up where a majority backs each of two factual claims but a majority rejects the joint verdict, and make them diagnose what breaks and evaluate one way out. Act as a pro philosopher of social choice and think carefully through the crux before you write. Please include a model answer of about 500 words and a marking scheme out of 20 that spells out what seperates an A answer from a B one in terms of specific moves, plus the classic mix-ups that should lose marks. Would be great if its all usable without any outside readings. End with a one-sentence takeaway on its own last line starting with Summary:
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Journalist covering science/ideas, teaching a one-off session for 2nd-year PPE (Philosophy, Politics, Economics) undergrads.
      *   **Topic:** How groups make up their minds (specifically the Discursive Dilemma/Doctrinal Paradox).
      *   **Task:** Draft a 45-minute essay question.
      *   **Constraint 1:** Cannot be answered by simply reciting "premise-based vs. conclusion-based" (needs deeper analysis).
      *   **Constraint 2:** Use a fresh 3-editor newsroom case (majority backs each of two factual claims, majority rejects joint verdict).
      *   **Constraint 3:** Act as a pro philosopher of social choice.
      *   **Constraint 4:** Include a model answer (~500 words).
      *   **Constraint 5:** Include a marking scheme out of 20 (distinguishing A vs. B, specific moves, classic mix-ups).
      *   **Constraint 6:** Usable without outside readings (self-contained).
      *   **Constraint 7:** End with a one-sentence takeaway on its own last line starting with "Summary:".

  2.  **Deconstruct the Discursive Dilemma:**
      *   *Core Logic:* Individual judgments on premises $P$ and $Q$ are aggregated to form a collective judgment on conclusion $C$ (where $C = P \land Q$).
      *   *The Paradox:* Majority vote on $P$ is Yes. Majority vote on $Q$ is Yes. But majority vote on $C$ is No (because the individuals who say Yes to $P$ are not the same as those who say Yes to $Q$).
      *   *Standard Solutions:* Premise-based procedure (PBP) vs. Conclusion-based procedure (CBP).
      *   *The Challenge:* The prompt asks to move *beyond* just naming these. Students need to diagnose *what breaks* (consistency, rationality, accountability) and evaluate *one way out* (e.g., deliberation, weighting, specialized roles, or the normative implications of each procedure).
      *   *The Case:* Needs to be a newsroom. 3 Editors. Decision: Publish a story? Premises: Is Source A reliable? Is Corroboration B sufficient? Conclusion: Publish?

  3.  **Drafting the Case Study:**
      *   Editors: Alice, Ben, Cara.
      *   Decision: Run the story "Minister Resigns".
      *   Logic: Run IF (Source is Credible) AND (Evidence is Corroborated).
      *   Votes:
          *   Alice: Credible (Yes), Corroborated (No) -> Run (No)
          *   Ben: Credible (No), Corroborated (Yes) -> Run (No)
          *   Cara: Credible (Yes), Corroborated (Yes) -> Run (Yes)
      *   Aggregation:
          *   Credible: 2 Yes (Alice, Cara) -> Majority Yes.
          *   Corroborated: 2 Yes (Ben, Cara) -> Majority Yes.
          *   Run: 1 Yes (Cara) -> Majority No.
      *   *Result:* The group believes the premises individually but rejects the conclusion. This is the Discursive Dilemma.

  4.  **Drafting the Question:**
      *   Needs to force evaluation, not just description.
      *   Prompt: Diagnose the normative tension (responsibility vs. consistency) and evaluate one procedural fix.
      *   Time: 45 minutes (so length should be manageable, ~500-800 words expected from students, but the model answer is 500).
      *   Condition: No outside readings allowed.

  5.  **Drafting the Model Answer:**
      *   Must be ~500 words.
      *   Must identify the paradox clearly.
      *   Must explain *why* it's a problem (collective rationality vs. majority responsiveness).
      *   Must evaluate a solution (e.g., Premise-Based Procedure) critically (not just "it solves consistency" but "it sacrifices direct control over the outcome").
      *   Tone: Philosophical but accessible.

  6.  **Drafting the Marking Scheme:**
      *   Total: 20 marks.
      *   Categories: Diagnosis (logic), Normative Analysis (what breaks), Evaluation (solution), Clarity/Structure.
      *   A vs. B distinction: A answers discuss *why* the procedure matters (accountability/integrity), B answers just describe the mechanics.
      *   Classic Mix-ups: Confusing with Condorcet cycles, getting the vote counts wrong, treating it as a compromise problem.

  7.  **Refining the "Beyond Recitation" Constraint:**
      *   To ensure they don't just say "PBP fixes it," the question should ask about the *cost* of the fix. E.g., "Does fixing the logic undermine the editors' democratic control over the final decision?"
      *   This forces them to weigh collective rationality against majority will.

  8.  **Review against Constraints:**
      *   45-min essay question? Yes.
      *   Fresh 3-editor newsroom case? Yes.
      *   Majority backs claims, rejects verdict? Yes.
      *   Model answer ~500 words? Yes.
      *   Marking scheme out of 20? Yes.
      *   A vs. B distinction? Yes.
      *   Classic mix-ups? Yes.
      *   No outside readings? Yes.
      *   Final line "Summary:"? Yes.

  9.  **Final Polish:**
      *   Check the logic of the case again.
      *   Alice: Yes, No -> No.
      *   Ben: No, Yes -> No.
      *   Cara: Yes, Yes -> Yes.
      *   Majority Premise 1: Yes (Alice, Cara).
      *   Majority Premise 2: Yes (Ben, Cara).
      *   Majority Conclusion: No (Alice, Ben).
      *   Perfect.
      *   Ensure the marking scheme is specific enough for a journalist-turned-teacher to use easily.
      *   Ensure the tone is professional.

  10. **Writing the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure the model answer doesn't exceed word count too much. Keep it tight.
      *   *Correction:* Ensure the marking scheme clearly penalizes the "just describe PBP/CBP" approach since the prompt explicitly forbids answering by just reciting them. The question must demand evaluation of the *trade-off*.
      *   *Correction:* Check the final line format.

  11. **Final Output Generation** (incorporating all steps).

  *(Self-Correction on Model Answer Word Count)*: I need to make sure it's around 500 words. I will count roughly during drafting.
  *(Self-Correction on Marking Scheme)*: Make sure the "A" grade requires normative insight, not just technical correctness.

