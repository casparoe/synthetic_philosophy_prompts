answer: |-
  Your intuition is spot-on. Your roommate is deploying a pop-sci slogan that conflates **Bell's Theorem** (a mathematical result) with **Bell's Conclusion** (an interpretive choice).

  Bell's Theorem does not strictly prove "nature is nonlocal." It proves that **Nature cannot satisfy a specific set of three assumptions simultaneously.** If you want to keep locality, you have to sacrifice one of the other two.

  Here is the breakdown of the slogan, the actual math, and the loopholes you can use to win the argument.

  ### 1. The Actual Theorem: The Trilemma
  Bell's Inequality is derived from three assumptions. If the inequality is violated (which experiments confirm it is), at least one assumption must be false.

  1.  **Locality:** No influence travels faster than light. What happens at detector A cannot instantly depend on the setting or outcome at detector B.
  2.  **Realism (Hidden Variables):** Particles have definite properties prior to measurement. (The moon is there even if you don't look).
  3.  **Statistical Independence (Freedom):** The choice of measurement setting is independent of the hidden variables of the particle. (The experimenter has "free will," or at least the universe isn't conspiring to correlate the source with the detector settings).

  **The Roommate's Claim:** "Bell proves Nonlocality."
  **The Correction:** "Bell proves **Local Realism** is dead. You can keep Locality if you drop Realism or Freedom."

  ### 2. The Loopholes (How to Save Locality)
  If you want to argue that locality *might* survive, here are the three escape hatches.

  #### A. Superdeterminism (Dropping "Freedom")
  This is the one you hinted at. Bell's derivation assumes $P(\lambda | \text{settings}) = P(\lambda)$. In plain English: the hidden state of the particle ($\lambda$) shouldn't know in advance which way you're going to tilt your detector.
  *   **The Loophole:** If the universe is superdeterministic, the particle source and your brain (choosing the setting) share a common causal past that correlates them perfectly.
  *   **The Cost:** It kills the scientific method. If you can't assume your experimental settings are independent of the system, you can't test anything. It implies a "cosmic conspiracy."
  *   **Dinner Ammo:** "Bell only rules out locality if you assume the universe isn't conspiring against us. Superdeterminism saves locality, but it makes science impossible. Are you willing to bet on a conspiracy to save Einstein?"

  #### B. Many Worlds / Everettian (Dropping "Single Outcome")
  In the Many Worlds Interpretation (MWI), there is no collapse. The wavefunction evolves locally and unitarily everywhere.
  *   **The Loophole:** When Alice measures spin-up, she branches. When Bob measures, he branches. The correlation exists because they are part of the same global wavefunction, but no signal passed between them.
  *   **The Cost:** You have to accept infinite branching universes.
  *   **Dinner Ammo:** "If you buy Many Worlds, the wavefunction never collapses nonlocally. It's all local unitary evolution. You only get nonlocality if you insist on a single unique outcome."

  #### C. QBism / Copenhagen (Dropping "Realism")
  If the wavefunction isn't a physical object but just a catalog of an observer's expectations (QBism), then nothing physical travels faster than light.
  *   **The Loophole:** Updating the wavefunction upon measurement is just Bayesian updating of information, not a physical change in the distant particle.
  *   **The Cost:** You give up on the idea that physics describes an objective reality independent of observers.
  *   **Dinner Ammo:** "If the wavefunction is just information, 'collapse' is just me updating my email. No spooky action, just spooky bookkeeping."

  ### 3. Parameter vs. Outcome Independence (The Technical Kill Shot)
  If your roommate wants to get technical about "Locality," hit them with **Jarrett's Decomposition**. Bell's "Locality" condition is actually the product of two distinct conditions:

  1.  **Parameter Independence:** The outcome at A does not depend on the *setting* at B. (Violating this allows Faster-Than-Light signaling).
  2.  **Outcome Independence:** The outcome at A does not depend on the *outcome* at B.

  **Quantum Mechanics violates Outcome Independence but respects Parameter Independence.**
  *   **Why this matters:** Violating Parameter Independence breaks Special Relativity (you can send messages). Violating Outcome Independence is weird, but it doesn't allow signaling.
  *   **Dinner Ammo:** "QM respects Parameter Independence, so we can't send signals faster than light. It only violates Outcome Independence. So when you say 'nonlocal,' do you mean 'signaling' (which is false) or 'correlation' (which is trivial)?"

  ### 4. Summary: Your Dinner Table Cheat Sheet

  | Claim | The Reality | Your Counter |
  | :--- | :--- | :--- |
  | **"Bell proves Nonlocality."** | Bell proves **Local Realism** is false. | "It proves you can't have Locality, Realism, *and* Freedom. Pick two." |
  | **"Hidden Variables are dead."** | **Local** Hidden Variables are dead. | "Bohmian Mechanics uses nonlocal hidden variables and works fine. Locality is the casualty, not variables." |
  | **"Superdeterminism is crazy."** | It's logically valid but methodologically toxic. | "It saves locality perfectly. The price is that you can't trust experiments. Are you a physicist or a conspiracist?" |
  | **"QM is Nonlocal."** | QM is **Signal-Local** but **Ontologically Nonlocal** (usually). | "I can't use QM to bet on horse races faster than light. So practically, it's local." |

  ### The Ultimate Mic Drop
  Wait for him to say "Bell proves nonlocality" one more time, then say:

  > "Bell's theorem is a constraint on **models**, not nature. It says any model that is Local, Real, *and* Free is impossible. Bohm saves Realism by dropping Locality. Many Worlds saves Locality by dropping Single-Outcomes. Superdeterminism saves Locality by dropping Freedom. You're presenting an interpretive choice as a mathematical proof."

  Then eat your pasta. Let him chew on that.
