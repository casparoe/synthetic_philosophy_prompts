      *   *Check:* Did I address the bodily suffering? *Yes, in the limits section.*
      *   *Check:* Cholera classification? *Need to be nuanced. It's not purely one.*
      *   *Check:* No bibliography. *Ensure none is added.*

  5.  **Self-Correction/Polishing during drafting:**
