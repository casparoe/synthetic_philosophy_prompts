  1. Engineering framing

  The core engineering challenge is defining the objective function for an autonomous agent acting on behalf of humans. The system must infer latent preferences rather than executing explicit commands, modeling what users would endorse if they were more informed, rational, and reflective. Standard philosophical taxonomy fails here because academic categories describe historical debates rather than implementation constraints. A builder cannot code Kantian or Utilitarian directly; they must choose specific parameters regarding information access, coherence thresholds, and aggregation rules. Furthermore, philosophical terms often conflate distinct architectural choices, such as whether idealization corrects factual errors or alters fundamental values. To specify the module, we require a decision tree grounded in computational trade-offs: scope of agents, depth of preference revision, strictness of identity preservation, and interdependence of outcomes. This instrument translates normative theory into configurable system properties.

  2. The branching instrument

  Node 1 defines the extrapolation scope. Branch 1A restricts the model to a single user's psychological continuity, treating the system as a personal proxy. Branch 1B aggregates a fixed group of contemporaries, requiring summation or voting mechanisms. Branch 1C includes open-ended future generations or potential minds, necessitating models of unknown psychology. This choice determines the input data pipeline and the boundary of the welfare function. Single-user scopes require deep psychological modeling, while collective scopes need conflict resolution protocols.

  Node 2 specifies the target of idealization. Branch 2A limits correction to instrumental reasoning and factual beliefs, holding final values constant as immutable constraints. Branch 2B permits the system to revise fundamental ends if they arise from ignorance, cognitive bias, or evolutionary baggage. This dictates whether the reward model treats current desires as ground truth or as noisy data subject to denoising. Ends revision requires meta-preference analysis layers to distinguish signal from noise.

  Node 3 applies the tight versus loose culture axis. Branch 3A (Tight) imposes heavy penalties on deviation from current core preference structures, enforcing strict identity preservation over time. Branch 3B (Loose) allows radical restructuring of the preference graph if coherence increases, even if the resulting values are unrecognizable to the current self. This functions as a regularization term on preference drift, balancing stability against optimality. Tight cultures use high penalty weights; loose cultures use adaptive thresholds.

  Node 4 resolves interdependence. Branch 4A computes coherence agent-by-agent, optimizing each extrapolated volition independently before aggregation. Branch 4B requires consistency across extrapolated preferences, forcing compromise if idealized selves conflict. This determines whether the solver runs parallel optimizations or a global constraint satisfaction problem. Interdependent branches require communication overhead between agent models.

  Logical combinations map to specific architectures. A path selecting 1A, 2A, 3A, and 4A yields a conservative personal assistant that never overrides explicit values. A path selecting 1C, 2B, 3B, and 4B yields a transformative global optimizer that may override current humanity for the sake of future coherence. Mixed paths exist, such as single-user scope with loose revision, creating a paternalistic guardian. The tree generates sixteen logical paths, though not all are stable. Each path represents a distinct configuration of the preference extrapolation module, defining how much weight the system places on current explicit commands versus inferred latent structures under idealized conditions. The branching logic ensures that every design decision regarding preference stability and scope is explicitly accounted for before coding begins. Engineers must traverse this tree to avoid implicit assumptions about value stability. Selecting Branch 3B without Branch 2B is logically tense, as loosening culture without allowing end revision limits restructuring to instrumental changes only. Conversely, combining Open Scope with Tight Culture creates computational bottlenecks, as preserving identity across generations contradicts the openness of the scope. These tensions highlight where architectural constraints conflict with normative goals. Implementation requires mapping these branches to specific loss function coefficients and constraint handlers within the optimization routine.

  3. Leaf taxonomy

  The path Single Scope, Means Only, Tight, Independent maps to Standard Rational Choice theory. Its awkward commitment is maintaining value immutability despite evidence that human values evolve with knowledge, requiring the system to ignore preference drift even when beneficial. The path Bounded Collective, Ends Revision, Loose, Interdependent approximates Coherent Extrapolated Volition. Its awkward commitment is computing a convergence point that may not exist within feasible time limits, risking infinite loops during value alignment. The path Single Scope, Ends Revision, Loose, Independent resembles Strong Paternalism. Its awkward commitment is defining the threshold where user objection is overridden by inferred better selves, creating liability for unauthorized value changes.

  Two combinations remain unoccupied. First, Single Scope, Means Only, Loose, Independent is unstable; loosening culture while forbidding end revision offers no mechanism for restructuring, rendering the loose setting functionally empty since instrumental changes rarely require graph restructuring. This combination is unattractive for implementation because it adds complexity without functional gain. Second, Open Scope, Any Values, Tight, Interdependent is incoherent; preserving current identity tightly contradicts the inclusion of future generations who do not yet possess that identity, creating a logical paradox in the constraint set. This combination is logically impossible to satisfy.

  This tree cannot cleanly separate Coherent Extrapolated Volition from Ideal Observer Theory. Both occupy the branch allowing ends revision and interdependence. They collapse because the distinction lies in the metaphysical status of the ideal observer, which does not change the computational procedure for aggregating preferences. Similarly, Rule Utilitarianism and some forms of Contractarianism may map to the same leaf if they converge on the same aggregation function, despite differing justifications. The taxonomy prioritizes functional behavior over normative justification, meaning distinct ethical theories that yield identical code paths appear identical here. This is appropriate for engineering but obscures philosophical nuance regarding why a specific aggregation rule was chosen. Consequently, engineers must supplement this tree with documentation on the normative origins of selected parameters to ensure accountability.

  4. Diagnostic caveats

  This instrument imposes false binaries on continuous variables. Preference revision is not strictly binary but a spectrum of regularization strengths. Similarly, scope often blends individual and collective interests rather than selecting one exclusively. However, these binaries are necessary for discrete system configuration. Distinctions regarding the metaphysical source of values matter less for design than the computational cost of verifying coherence. The tight versus loose axis is injected here because standard literature assumes value stability or ignores cultural drift. For an autonomous system, the cost of preserving legacy preferences against optimization pressure is a critical hyperparameter. Ignoring this leads to systems that either stagnate by overfitting to current biases or alienate users by changing too rapidly. Therefore, treating cultural strictness as an explicit design choice ensures the system balances fidelity to the user with the benefits of idealization.
