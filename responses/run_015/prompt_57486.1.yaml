answer: |-
  ### 1. The Desiderata of Resolution

  To count as a resolution rather than a restatement, an account must do more than label the tension; it must provide a generative mechanism that explains why the tension arises without dissolving the deontological intuition. The following six desiderata specify the conditions of adequacy. For each, I indicate whether it is a non-negotiable condition for solving the puzzle as stated, or a substantive theoretical commitment that risks begging the question.

  **1. The Explanatory Independence Condition**
  *   **Requirement:** The account must justify the constraint without deriving it from the disvalue of the state of affairs the constraint prohibits. It must explain why the agent is forbidden to minimize the very badness that motivates the prohibition.
  *   **Motivation:** This is the core of the paradox. If the constraint is justified by the badness of killing, minimizing killing should be obligatory. A resolution must sever the justificatory link between the *wrongness of the act* and the *badness of the outcome*.
  *   **Status:** **Non-negotiable.** Without this, the account is consequentialist in disguise.

  **2. The Institutional Asymmetry Condition**
  *   **Requirement:** The account must explain the divergence between the regulator case (where violation-minimization intuition is weaker) and the standard killing case, and must adjudicate the permissibility of spending public resources to prevent violations versus committing violations to prevent them.
  *   **Motivation:** The regulator case shows that deontological resistance is not uniform; it varies by role and context. The spending case shows that we permit causal contribution to violation-reduction via resources but not via personal agency.
  *   **Status:** **Non-negotiable.** These are data points any empirical theory of moral intuition must accommodate.

  **3. The Non-Collapsing Distinction Condition**
  *   **Requirement:** The account must maintain the distinction between doing and allowing, and between killing a patient and killing an attacker, without relying solely on physical causation. It must explain why these distinctions carry normative weight.
  *   **Motivation:** If the distinction collapses under pressure (e.g., if omitting to save is equivalent to killing), the paradox evaporates because the constraint vanishes. If it holds only by fiat, the paradox is restated.
  *   **Status:** **Substantive Commitment (Smuggled).** Demanding that the *doing/allowing* distinction be fundamental presupposes that the paradox lies in the nature of agency rather than the structure of value. A consequentialist resolution would deny this distinction's relevance; demanding it rules out that class of resolutions by definition.

  **4. The Phenomenological Residue Condition**
  *   **Requirement:** The account must explain the propriety (or impropriety) of regret, distress, and the duty of compensation in an agent who rightly declines to violate the constraint.
  *   **Motivation:** Agents who obey constraints often feel moral distress or owe compensation to those they failed to save. A resolution must explain whether this is rational residue or irrational confusion.
  *   **Status:** **Substantive Commitment (Smuggled).** This assumes a specific "dirty hands" or tragic view of deontology. A rigid rights-based view might hold that a right-holder who is not violated has no claim to the agent's regret. Demanding regret biases the resolution toward agent-centered prerogatives rather than patient-centered rights.

  **5. The Numerical Resistance Condition**
  *   **Requirement:** The account must explain why the constraint resists being swamped by numbers, while accounting for the intuition in the regulator case that numbers *do* exert some pressure (weakening the constraint).
  *   **Motivation:** The paradox is sharpest when one death prevents five. If the account cannot explain why 1 ≠ 5 in this context, it has not resolved the paradox. However, it must also explain why the regulator feels *some* pull to minimize.
  *   **Status:** **Non-negotiable.** This is the phenomenon to be explained.

  **6. The Non-Outcome Basis Condition**
  *   **Requirement:** The account must demonstrate that the paradox survives (or evaporates) when the constraint is restated in purely non-teleological terms (e.g., respect for persons, not using as means).
  *   **Motivation:** If the paradox disappears when we stop talking about "badness" and start talking about "rights," the paradox was merely verbal.
  *   **Status:** **Substantive Commitment (Smuggled).** This presupposes that the deontological basis *can* be severed from outcomes. If all constraints are ultimately grounded in outcome-value (even distantly), this condition makes resolution impossible by fiat.

  ***

  ### 2. Joint Unsatisfiability

  There is a critical tension between **Desideratum 1 (Explanatory Independence)** and **Desideratum 5 (Numerical Resistance)** when combined with the data from the **Regulator Case**.

  It is jointly unsatisfiable to demand:
  1.  A formulation that owes *nothing* to outcomes (pure Explanatory Independence);
  2.  An explanation of why the constraint resists numbers;
  3.  An accommodation of the Regulator intuition (that the constraint weakens when violation-minimization is at stake).

  If the basis owes *nothing* to outcomes, the constraint should be absolute; numbers should never matter. If numbers never matter, the Regulator intuition (that the constraint feels weaker when many firms are at risk) is left unexplained or must be dismissed as error. If the account accommodates the Regulator intuition by admitting a threshold where numbers *do* matter, it violates Explanatory Independence by admitting outcome-value into the justification.

  Therefore, a resolution must either:
  *   Accept that the basis is not purely non-outcome (admitting a threshold);
  *   Accept that the Regulator intuition is a mistake (maintaining absolutism);
  *   Accept that the constraint is not genuinely independent of the outcome's value.

  A list that demands all three is not a set of criteria for resolution, but a proof of impossibility.

  ***

  ### 3. The Killer Requirement

  The single requirement that eliminates the largest share of familiar moves is **The Explanatory Independence Condition** (Desideratum 1).

  This condition demands that the justification for the constraint cannot be the minimization of the prohibited harm. This is the hardest hurdle because most intuitive attempts to resolve the paradox secretly rely on the badness of the outcome to explain the stringency of the rule, or they rely on outcome-minimization at a higher level of abstraction.

  **Evaluation of the Five Moves:**

  1.  **Agent-Relative Value:** **Fares Well.** It posits that the agent has special reason to avoid *their own* killing, independent of the total count of killings, satisfying independence while explaining numerical resistance.
  2.  **Side-Constraints (Non-Teleological):** **Fares Well.** By defining rights as trumps that preclude aggregation, it meets the independence condition by fiat, though it struggles to explain the Regulator intuition without ad hoc modifications.
  3.  **Threshold Deontology:** **Fails.** It explicitly admits outcome-value into the justification once the threshold is met; it resolves the paradox by conceding to consequentialism at the margin, violating Explanatory Independence.
  4.  **The Doing and Allowing Distinction:** **Fails.** It describes *where* the constraint applies but does not explain *why* the constraint exists independently of outcomes; it restates the paradox as a boundary problem without solving the justificatory gap.
  5.  **Deflationary (Verbal) Claim:** **Fails.** It denies the paradox exists by arguing the terms are confused, thereby refusing to meet the Explanatory Independence condition because it denies there is a constraint to justify in the first place.
