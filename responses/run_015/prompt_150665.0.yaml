              *   Embryo A (Track focus): 52% chance of Track (vs 50% baseline). EWB = $0.52(120) + 0.48(100) = 62.4 + 48 = 110.4$.
              *   Embryo B (Health focus): 50% chance of Track. 5% chance of Condition (vs 10% baseline). EWB = $0.50(120) + 0.50(100) - (0.05 \times 40) = 60 + 50 - 2 = 108$.
