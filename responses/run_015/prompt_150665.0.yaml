      *   *Numbers:* As calculated above.
      *   *Verdicts:* PB -> A. PNP -> B.
      *   *Derivation:* PB sums expected utility. PNP filters for robustness.
      *   *Feature doing the work:* The generalization test (fixed quota vs. intrinsic risk).
      *   *Counterfactual 1 (Make A non-positional):* If Track expands to accommodate all qualified (no fixed quota), A's advantage becomes robust. PB and PNP align on A.
