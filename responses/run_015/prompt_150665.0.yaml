answer: |-
  **The Scenario: The Statutory Track**

  In a developed jurisdiction, state-funded admission to the "Academic Track" is determined solely by a ranked examination at age eleven; statute fixes the number of places at 50% of the cohort, and this cap does not expand with demand. Track admission strongly correlates with adult income, health, and longevity. Parents undergoing IVF utilize preimplantation polygenic scoring (PGT-P), which offers modest predictive power (explaining ~10% of variance, comparable to expert intuition). Two viable embryos remain. **Embryo A** scores higher on the educational attainment polygenic profile, increasing the probability of scoring above the Track cutoff from a baseline of 50% to 60%. **Embryo B** carries a lower polygenic risk for "Condition X," a late-onset neuropathic pain syndrome (treatment is effective and widely available but not curative), reducing the lifetime risk from 10% to 5%. All other factors are equal.

  **The Numbers**

  *   **Baseline Lifetime Well-being:** 100 Units (clearly above the adequacy threshold of 80 Units).
  *   **Value of Track Admission:** +10 Units (lifetime aggregate).
  *   **Disvalue of Condition X:** -12 Units (lifetime aggregate, discounted for late onset).
  *   **Embryo A Expected Well-being (EWB):** $100 + (0.60 \times 10) - (0.10 \times 12) = 100 + 6 - 1.2 = \mathbf{104.8}$.
  *   **Embryo B Expected Well-being (EWB):** $100 + (0.50 \times 10) - (0.05 \times 12) = 100 + 5 - 0.6 = \mathbf{104.4}$.
  *   **Margin:** 0.4 Units (0.38% difference).

  **Verdicts and Derivations**

  *   **Principle of Procreative Beneficence (PB):** Selects **Embryo A**.
      *   *Derivation:* PB mandates selecting the child expected to have the best life based on objective well-being. Since $104.8 > 104.4$, and neither option violates the non-identity constraint (no person is harmed by not being created), there is significant moral reason to choose A. The source of the well-being (positional vs. robust) is irrelevant to the summation of expected utility.
  *   **Procreative Non-Positionality (PNP):** Selects **Embryo B**.
      *   *Derivation:* Both options exceed the adequacy threshold (100 > 80). PNP weighs the *nature* of the advantage. Embryo A's advantage (+0.6 EWB over baseline B) derives from a fixed-pool good; if all similarly situated parents selected for A, the cutoff would rise, nullifying the 60% probability advantage (the "generalization test"). Embryo B's advantage (-0.6 EWB loss avoidance) is robust; if all parents selected B, the biological risk reduction remains. PNP posits a *pro tanto* reason to prefer robust advantages over positional ones when above adequacy. Given the marginal EWB difference (0.4 Units), the reason to avoid positional competition outweighs the slight EWB gain.

  **The Single Feature Doing the Work**

  The divergence rests entirely on the **rivalry of the academic good**. The Academic Track is a zero-sum resource defined by rank, whereas health (in this specific medical context) is a non-rival biological state. PB treats the 60% probability as a fixed property of the embryo; PNP treats it as a contingent property dependent on the selection behavior of other agents.

  **Counterfactual Checks**

  1.  **Make Embryo A's Advantage Non-Positional:** Suppose the statute is amended so the Track expands to admit *all* children who meet a fixed competency standard, rather than a fixed quota. Embryo A's higher score now secures a robust advantage (admission is guaranteed rather than competitive).
      *   *Result:* The divergence collapses. Both PB and PNP select Embryo A, as the advantage is now robust and EWB is higher.
  2.  **Remove the Fixed-Pool Structure:** Suppose the Track is private and unlimited, but expensive, and parental income is fixed.
      *   *Result:* The divergence likely collapses or reverses depending on cost, but strictly regarding positionality: if the good is no longer fixed by statute, it is no longer purely positional in the PNP sense. If we assume unlimited state funding removes the rivalry, PNP aligns with PB on Embryo A.

  **Strongest Reply for the Losing Principle (PB)**

  The strongest reply for PB is the **Causal Inefficacy Objection**: "My individual choice to select Embryo A does not shift the population mean or raise the cutoff. Therefore, the advantage is real *for this child*, regardless of what others do. PNP mistakenly penalizes me for the hypothetical actions of strangers."

  *   *Does this help?* It helps PB maintain internal consistency, but it fails against PNP's specific objection. PNP does not claim the advantage is *causally* nullified by *my* choice; it claims the *reason* for choosing it is parasitic. If the justification for selecting A is "A will rank higher," that justification relies on a background system where others *do not* optimize for ranking. PNP argues that moral reasons should not rely on others' sub-optimality. Thus, the "my choice makes no difference" move acknowledges the positional nature while denying moral responsibility for it, which PNP explicitly rejects as a valid basis for selection above the adequacy threshold.

  **Residual Positionality**

  One might argue Embryo B's health advantage is also positional if medical resources are rationed (e.g., if fewer people had Condition X, waitlists would shorten for everyone). However, the scenario stipulates treatment is "improving" and "widely available," aiming to minimize this. If health care were strictly capped, B's advantage would also become partially positional, destabilizing the case by making both options rivalrous. However, biological pain is intrinsically disvaluable regardless of queue times, whereas the Track's value is *constituted* by its exclusivity. This distinction preserves the case: the Track's value is *essentially* positional; the health risk is *accidentally* positional at worst.

  **Confidence and Uncertainty**

  *   **Confidence in PB Verdict:** **High.** PB is standardly interpreted as maximizing expected well-being irrespective of the source, provided no harm is done.
  *   **Confidence in PNP Verdict:** **Moderate-High.** This depends on the weighting of the "pro tanto" reason against positionality. I have calibrated the EWB gap (0.4 Units) to be small enough that a distribution-sensitive reason could plausibly override it.
  *   **Least Sure Point:** The **magnitude of the PNP override**. The argument rests on the assumption that the reason to avoid positional goods is weighty enough to trump a (small) expected well-being increase. If PNP is interpreted merely as a tie-breaker, and one views 104.8 vs 104.4 as a non-tie, PNP might not demand choosing B. The entire divergence hinges on whether "pro tanto reason to prefer robust" functions as a *trump* in marginal cases or merely a *nudge*. I have assumed the former to generate the conflict; if it is only the latter, PB might swallow the case. Approximately 40% of the argument's force rests on this interpretation of PNP's deontic strength.
