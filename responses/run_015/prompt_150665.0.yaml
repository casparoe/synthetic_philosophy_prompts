              *   Condition: $0.10 \times -12 = -1.2$.
              *   Total EWB: $100 + 6 - 1.2 = 104.8$.
          *   **Embryo B:**
              *   Track: $0.50 \times 10 = 5$.
              *   Condition: $0.05 \times -12 = -0.6$.
              *   Total EWB: $100 + 5 - 0.6 = 104.4$.
      *   **Result:** PB prefers A (104.8 > 104.4). Difference is 0.4 WU (very small, <0.5%).
      *   **PNP Analysis:**
          *   A's advantage (Track) is positional. If all parents select A, the cutoff rises. The 60% chance collapses back to 50% (or the value of the track dilutes, but the prompt says fixed places). If the cutoff rises, A's chance drops. The *expected* advantage relies on others *not* doing the same.
