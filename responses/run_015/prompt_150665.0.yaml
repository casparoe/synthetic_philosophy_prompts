              *   So: PB says A (107.8 > 107.2). PNP says B (Robust > Positional).

  3.  **Refining the Numbers for Realism:**

      *   Polygenic scores for education explain ~10-15% of variance. Moving from 50th percentile to 55th percentile embryo is realistic.
      *   In a fixed quota system, being at the 55th percentile vs 50th percentile increases admission chance only if the cutoff is near there.
      *   Let's simplify: The score predicts *exam performance*. The exam is ranked.
      *   Embryo A: Expected exam rank percentile 55.
      *   Embryo B: Expected exam rank percentile 50.
      *   Cutoff for Track: Top 50%.
      *   Probability A > Cutoff: 60%. Probability B > Cutoff: 50%. (Due to variance around the mean).
