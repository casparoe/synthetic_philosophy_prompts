      *   *Rebuttal to Reply:* PNP isn't about causal efficacy; it's about the *nature* of the reason. Relying on a positional good is parasitic on others *not* optimizing. It's a free-rider logic.
      *   *Residual Positionality:* Is health positional? (e.g., health care resources). Prompt says treatment is improving/available. Assume robust.
      *   *Confidence:* High on PB verdict. Moderate on PNP verdict (depends on interpretation of "reason").
