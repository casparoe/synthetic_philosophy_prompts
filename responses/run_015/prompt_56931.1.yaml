      *   *Self-Correction during drafting:* Make sure not to dismiss the user's "developmental" idea entirely. It captures a *feeling* of the texts, even if technically imprecise. Frame it as "close, but the distinction is ontological, not chronological."

  8.  **Final Polish:** Check against the specific questions asked.
