      *   **Hirsch:** Distinguishes meaning vs. significance. (Correct). Holds original intent fixes meaning permanently. (Correct). *However*, claims Hirsch allows later self-interpretation to revise meaning retroactively. (Red Flag: Hirsch is very strict about *original* intention. If the author claims later they meant X, but the text/public evidence suggests Y, Hirsch usually prioritizes the original intention at the time of creation. If the author says "I meant X all along," Hirsch might accept that as evidence of original intent, but the phrasing "revising the poem's meaning retroactively" based on a "later, more reflective self-interpretation" sounds like it conflates Hirsch with something more flexible. Hirsch argues meaning *cannot* change. If the author clarifies original intent, that's different than revising meaning based on later reflection.)
