answer: |-
  First, a quick correction on your historical mapping: you have got it exactly right. Ruth Millikan is the flagship for the historical, selected-effects account (often called 'proper functions'), while Robert Cummins is the father of the causal-role, systemic-capacity account. You have done your homework there.

  Now, as requested, I shall put on my brainstorming hat. I am going to sketch three candidate principles below, rough and ready, to see how they handle your specific biological intuitions. I am not polishing these; I am testing them against your cases to see where the blood gets on the floor.

  ### Unstructured Brainstorming

  **Candidate 1: The Pure Selected-Effect Principle (Millikan-style)**
  *   **The Gist:** A trait $T$ has function $F$ if and only if $T$ exists now because ancestors of $T$ performed $F$ and were selected for doing so.
  *   **Saves:** Fish heart (selected for pumping); Neutral mutation (no selection history, so no function); Cow udder (artificial selection counts as selection); Whale pelvis (if not selected for anchoring, it's a spandrel, so no function).
  *   **Wrecks:** Nudibranch cnidae (the *slug's* lineage didn't select for them, the hydroid's did); Computer-designed protein (no evolutionary history); Lymphocyte receptor (somatic selection isn't germline selection); Sanctuary population (if selection has stopped, strictly speaking, the 'because' clause gets wobbly for current maintenance).
  *   **Trade-off:** This is the cleanest historically, but it is too rigid for your symbiosis and immunology cases. It treats the organism as a closed historical loop, which biology simply isn't.

  **Candidate 2: The Causal-Role Principle (Cummins-style)**
  *   **The Gist:** A trait $T$ has function $F$ if and only if $T$ currently contributes to the capacity of the containing system $S$ to do something.
  *   **Saves:** Nudibranch cnidae (contributes to defence); Lens enzyme (contributes to transparency); Whale pelvis (contributes to muscle anchoring); Computer protein (contributes to the metabolic goal); Sanctuary population (traits still do jobs).
  *   **Wrecks:** Fish heart noise (contributes to *your* capacity to dissect, but we agree it's not a function); Neutral mutation (contributes to survival in the warm bay, but you insist it's not a function); Hermit crab shell (contributes to survival, but you say no function).
  *   **Trade-off:** This captures current utility beautifully but fails to distinguish between a function and a lucky accident. It makes 'function' too easy to come by.

  **Candidate 3: The 'Stabilised System' Hybrid**
  *   **The Gist:** A trait $T$ has function $F$ if $T$ contributes to $S$'s capacity, AND $T$'s presence is maintained by a feedback loop (selection, design, or somatic selection) specific to $S$'s boundary.
  *   **Saves:** Fish heart; Lymphocyte (somatic selection is a feedback loop); Cow udder; Computer protein (design is a feedback loop).
  *   **Wrecks:** Nudibranch (is the hydroid DNA part of the slug's feedback loop? No, but the sequestration mechanism is); Hermit crab (no maintenance loop for the shell itself, only for the behaviour).
  *   **Trade-off:** This looks most promising for your intuitions. It allows for different *types* of history (germline, somatic, artificial) but insists on a maintenance loop. However, it struggles to define the 'System Boundary' (why is the cnida inside the boundary but the shell outside?).

  ***

  ### The Settled Principle

  Having weighed those up, I believe your intuitions are fundamentally **Selected-Effect** in nature, but they require a broader definition of 'Lineage' and 'Selection' than the orthodox 1990s literature allows. You are implicitly arguing for a **Generalised Selected-Effect Principle**.

  Here is the principle I propose we work with:

  > **The Generalised Maintenance Principle:**
  > A trait or part $T$ of a system $S$ has the function $F$ if and only if:
  > 1.  $T$ currently has the capacity to do $F$; AND
  > 2.  $T$ is present in $S$ because of a history of differential retention (selection, design, or somatic screening) where $F$ was the criterion for retention; AND
  > 3.  $T$ is physiologically or developmentally integrated into the boundary of $S$ (distinguishing parts from tools).

  This principle modifies the standard selected-effects view by accepting artificial design and somatic selection as valid 'histories', and it adds a boundary clause to solve the Hermit Crab problem.

  ### Testing the Principle Against Your Cases

  Let us run your specific verdicts through this machine.

  *   **Fish Heart:** Passes. Capacity (pumping); History (germline selection); Boundary (integrated). **Verdict: Function.**
  *   **Heart Thumping:** Fails clause 2. The noise did not drive the retention of the heart. **Verdict: Side Effect.** (Matches your intuition).
  *   **Nudibranch Cnidae:** Passes. Capacity (defence); History (the *sequestration mechanism* in the slug was selected for retaining these); Boundary (integrated into epidermis). **Verdict: Function.**
  *   **Hermit Crab Shell:** Fails clause 3. The shell is not developmentally integrated; it is an external object utilised by behaviour. The *behaviour* has a function, the shell does not. **Verdict: No Function.** (This solves your worry about the difference).
  *   **Lens Enzyme (Old):** Passes. The recruitment event is old enough that selection has acted on the transparency. **Verdict: Function.**
  *   **Lens Enzyme (New):** Fails clause 2. If it is merely present due to drift or recent expression without selection for transparency, it is 'doing a job' but not functioning *as* a lens protein yet. **Verdict: No Function.** (Matches your intuition).
  *   **Whale Pelvis:** Fails clause 2. You stipulate it is a leftover. If the muscle anchoring is not the *reason* the pelvis is retained (i.e., if the pelvis would persist even without the muscles due to developmental constraint), it lacks function. **Verdict: No Function.**
  *   **Neutral Mutation (Drift + Benefit):** Fails clause 2. The retention was due to drift, not the benefit. The benefit is coincidental. **Verdict: No Function.**
  *   **Lymphocyte Receptor:** Passes clause 2. This is the crucial case. The 'lineage' here is the somatic cell lineage within the organism. The receptor is retained *because* it bound the antigen (clonal expansion). **Verdict: Function.**
  *   **Snail Sperm (Fertile):** Passes. **Verdict: Function.**
  *   **Snail Parasperm:** Passes clause 2. If they help fertile sperm, and this trait is maintained in the lineage because of that help, they have a function. Your lack of confidence likely stems from uncertainty about whether they are truly selected for or just developmental noise. **Verdict: Function (provisional).**
  *   **Devil Facial Tumour:** Passes, but indexed to the *cell lineage*, not the devil. The 'System $S$' is the tumour. **Verdict: Function for Tumour, Parasite for Devil.**
  *   **Cow Udder:** Passes. Artificial selection counts as 'differential retention'. **Verdict: Function.**
  *   **Broiler Legs:** Fails clause 2. The collapsing is not what was selected *for*; it is a cost of the growth selection. **Verdict: Side Effect.**
  *   **Pacemaker/Beaver Dam:** Passes. Design counts as 'differential retention' by an agent. **Verdict: Function.**

  ### The Hard Pairs: Inconsistency or Nuance?

  You asked me to identify which of your pairs is genuinely inconsistent.

  **1. The Nudibranch vs. The Hermit Crab**
  *   *Your worry:* Both are external items used for defence. Why is one a part and the other not?
  *   *My diagnosis:* This is **not inconsistent**. It is a boundary issue. The cnidae are sequestered into the slug's tissues; they are metabolically and developmentally managed by the slug's genome (even if the cnida DNA is hydroid). The shell is merely carried. The principle saves this by invoking Clause 3 (Integration). The slug *grows* the cnidae into its skin; the crab *finds* the shell.

  **2. The Lymphocyte vs. The Neutral Mutation**
  *   *Your worry:* Both involve chance events that turn out to be useful. Why is one a function and the other not?
  *   *My diagnosis:* This is the **critical theoretical hinge**. If you treat these as identical, you collapse into Causal-Role theory (where any benefit is a function). To maintain your intuition (which I support), you must distinguish *Somatic Selection* from *Germline Drift*.
      *   The lymphocyte receptor is subject to a selection process *within the organism's lifetime* (clonal expansion). The 'history' requirement is met on a somatic timescale.
      *   The neutral mutation is subject to drift. The benefit arises *after* fixation, without influencing the fixation.
      *   *Verdict:* This pair is **subtly different**, not inconsistent. The difference is the presence of a feedback loop (selection) versus a blind process (drift) followed by luck.

  **3. The Lens Enzyme vs. The Whale Pelvis**
  *   *Your worry:* Both are old traits doing new jobs.
  *   *My diagnosis:* This depends entirely on your empirical claim. If the whale pelvis is actively maintained *because* it anchors muscles, it **is** functional (an exaptation turned adaptation). If it is merely a shrinking remnant that *happens* to anchor muscles (a spandrel), it is not. Your intuition suggests the latter. The principle holds, provided the biological fact is that selection is not currently acting on the pelvis for anchoring.

  ### New Cases

  You asked for verdicts on three cases you hadn't settled.

  **1. An enzyme in one of my gut bacteria has a function in me.**
  *   *Analysis:* This is the hologenome problem. Is the bacteria a part of 'you'?
  *   *Verdict:* Under the Generalised Maintenance Principle, if the bacteria are obligate symbionts (vertically transmitted and integrated into your developmental/physiological boundary), then **Yes**, the enzyme has a function in *you*. If they are transient environmental bacteria, **No**, they have a function in *themselves*, and you merely benefit. Given your nudibranch intuition, I suspect you would treat obligate symbionts as parts.

  **2. A population down to thirty individuals in a sanctuary where selection has effectively stopped.**
  *   *Analysis:* Does function vanish when selection stops?
  *   *Verdict:* **Yes, they retain function.** Function is a historical property. The heart pumps *because* ancestors pumped. That history does not evaporate instantly when selection pressure relaxes. However, if the population persists for hundreds of generations under pure drift, the traits will degrade. At that point, the 'because' clause fails. For now, the function remains, grounded in the immediate past history before the sanctuary.

  **3. A protein designed by a computer and expressed in a bacterium, which works beautifully and has no selection history whatsoever.**
  *   *Analysis:* This wrecks pure biological SE theory, but fits your 'Pacemaker' intuition.
  *   *Verdict:* **Yes, it has a function.** We must treat 'Intelligent Design' (human) as equivalent to 'Natural Selection' in the principle. The 'history' is the design process in the computer/engineer's mind, and the 'retention' is the decision to synthesise it. It satisfies Clause 2 via the 'Design' loophole you already included in your draft.

  ### Conclusion

  Your gut is remarkably consistent with a sophisticated Selected-Effects account, provided we acknowledge that 'selection' can happen somatically (immune system) and 'system boundaries' can include integrated symbionts (nudibranchs) but not external tools (shells).

  The only place you need to be careful is the Whale Pelvis. If you claim it anchors muscles *and* that anchoring is useful, you must check if that anchoring is actually *maintaining* the pelvis in the population. If it is, it has acquired a function. If the pelvis is disappearing regardless, it is a spandrel. Your intuition that it is a 'leftover' suggests the latter, which keeps your theory intact.

  You have essentially reconstructed a version of Peter Godfrey-Smith's 'Modern History' account without reading the text, which is a considerable achievement for a retired marine biologist. Stick with the Historical Maintenance view; it respects the normativity you clearly feel (the difference between what a trait *does* and what it is *for*) better than the Causal-Role alternative.
