      *   *Why not Repair?* Repair implies preserving the core identity through minor changes. Distributed replacement implies total material turnover without a "core" persisting, yet without a sharp cut-off.
      *   *Why Triadic?* Because the relation holds only if the transformation from $M_1$ to $M_2$ satisfies rule $R$ (continuity of form/causal capacity), even if $M_1$ is gone.

