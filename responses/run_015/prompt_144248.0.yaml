answer: |-
  **Argument for Successor Constitution via Distributed Replacement**

  **I. Definitions and Scope**
  Let $S_{orig}$ denote the original bronze statue at time $t_0$.
  Let $L_{orig}$ denote the original lump of bronze constituting $S_{orig}$ at $t_0$.
  Let $S_{final}$ denote the entity occupying the spatial region of the statue at time $t_{10}$ (after the decade of replacement).
  Let $L_{final}$ denote the aggregate of alloy atoms constituting $S_{final}$ at $t_{10}$.
  Let $P$ denote the process of distributed, volumetrically uniform atomic replacement occurring over the interval $[t_0, t_{10}]$.

  **II. Formal Argument**

  1.  **Mereological Essentialism of Lumps:** The identity of a material lump ($L$) is strictly determined by the identity of its constituent atoms; if all original atoms are removed, $L$ ceases to exist.
  2.  **Material Continuity Condition for Artifacts:** The identity of a statue ($S$) requires not only the preservation of macroscopic form but also a non-trivial continuity of material substrate; total material replacement, even if gradual, disrupts the causal history required for $S$ to persist as the *same* numerically identical object.
  3.  **Totality of Replacement:** Under process $P$, every atom composing $L_{orig}$ is removed and substituted with a distinct alloy atom; therefore, at $t_{10}$, no part of $L_{orig}$ remains.
  4.  **Cessation of the Original Lump:** From (1) and (3), $L_{orig}$ ceases to exist during the interval $[t_0, t_{10}]$.
  5.  **Cessation of the Original Statue:** From (2) and (3), the material continuity of $S_{orig}$ is fully disrupted; therefore, $S_{orig}$ ceases to exist during the interval $[t_0, t_{10}]$.
  6.  **Macroscopic Invariance:** Despite the atomic turnover, process $P$ maintains continuous invariance in crystalline lattice structure, weight distribution, and causal capacities; thus, at $t_{10}$, there exists an entity $S_{final}$ that is qualitatively indistinguishable from $S_{orig}$.
  7.  **Non-Identity of Successor:** Since $S_{orig}$ ceases to exist (Premise 5) and $S_{final}$ exists at $t_{10}$, $S_{final}$ is not numerically identical to $S_{orig}$.
  8.  **Distinctness from the Final Lump:** $S_{final}$ possesses modal properties distinct from $L_{final}$ (e.g., $S_{final}$ cannot survive being melted down without loss of identity, whereas $L_{final}$ can); therefore, $S_{final} \neq L_{final}$.
  9.  **The Successor Thesis:** $S_{final}$ is a distinct, successor-constituted object that instantiates the form of $S_{orig}$ without inheriting its specific material history.
  10. **The Triadic Constitution Thesis:** Standard binary constitution ($Matter$ constitutes $Object$) is insufficient to explain the persistence of form through total material turnover; constitution must be modeled as a triadic relation $C(m, f, r)$, where $m$ is the matter, $f$ is the form, and $r$ is a continuity-preserving transformation rule.
  11. **Satisfaction of the Rule:** Process $P$ satisfies rule $r$ by maintaining macroscopic causal invariance despite microscopic turnover; therefore, constitution holds between $L_{final}$ and $S_{final}$ only relative to the transformation history $P$.
  12. **Undermining the Dominance Argument:** The standard dominance argument claims $S \neq L$ because they differ in modal/temporal properties (e.g., survival conditions); however, in this case, both $S_{orig}$ and $L_{orig}$ cease to exist, replaced by $S_{final}$ and $L_{final}$ linked by $r$; thus, the modal clash is not between coincident objects at a single time, but between distinct temporal stages linked by a transformation rule, dissolving the paradox of coincident entities having incompatible properties.
  13. **Conclusion:** The entity existing at $t_{10}$ is a successor object constituted via a triadic relation, proving that material constitution relies on transformation rules rather than binary matter-form coincidence.

  **III. Objection and Rebuttal**

  **Objection: The Gradual Repair Claim**
  A proponent of the standard binary view might argue that distributed replacement is metaphysically indistinguishable from gradual repair. They would contend that replacing a single atom does not destroy the statue; therefore, replacing atoms sequentially over a decade is merely an extended repair process. On this view, $S_{orig}$ survives $P$ because there is no precise moment where the statue goes out of existence. Consequently, $S_{final}$ is identical to $S_{orig}$, and the triadic model is unnecessary.

  **Rebuttal: The Significance of the Absent Boundary**
  This objection fails because it conflates *epistemic vagueness* with *ontological persistence*. The claim that "no discrete boundary exists" is precisely why the original statue cannot survive. If there were a discrete boundary (e.g., a sudden swap of the entire lump), we could locate the cessation of $S_{orig}$. In the distributed case, the absence of a spatiotemporal boundary means there is no locus where the original matter persists as a core.

  "Repair" presupposes a surviving subject that undergoes modification. However, Premise 3 establishes that *no* original matter survives. To claim $S_{orig}$ survives is to claim that form can persist without *any* of its original material substrate, which reduces the statue to a purely abstract type rather than a concrete particular. The absence of a discrete boundary does not preserve the original object; rather, it masks the transition from one concrete particular ($S_{orig}$) to a successor ($S_{final}$).

  Because there is no boundary where $S_{orig}$ definitively ends, we cannot say $S_{orig}$ extends to $t_{10}$. Instead, the continuous invariance of causal capacities (Premise 6) indicates that a *rule* ($r$) has been satisfied, allowing a new object to inherit the functional role of the old one. The lack of a boundary blocks the repair reply because repair requires a persistent substrate to be "fixed," whereas distributed replacement operates on a substrate that is entirely flux. Thus, the relation is not one of identity preservation (repair), but of successorship mediated by the transformation rule $r$. This confirms that constitution is not a static binary relation between matter and form, but a dynamic triadic relation dependent on the history of transformation.
