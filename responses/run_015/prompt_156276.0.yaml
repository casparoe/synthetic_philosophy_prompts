          *   **Truth:** This is a common *misinterpretation* or reductionist critique of Hofstadter's work. Hofstadter argues that "insight" *emerges* from the interaction of simple processes. He doesn't dismiss insight; he redefines it as the result of complex sub-cognitive activity. He definitely does *not* say it's "just" search in a trivial sense. He argues against the "magic" of insight, but not the phenomenon itself.

