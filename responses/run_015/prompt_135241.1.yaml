      *   *Charlotte's Web:* The farm operates on killing pigs for food (the "rule"). Wilbur is saved (the "exception").
      *   *The Tension:* Does saving Wilbur critique the system (pushing past Maimonides) or just highlight a lucky exception within an accepted system (staying inside Maimonides)?
      *   *Charlotte's Death:* Natural death vs. slaughter.
