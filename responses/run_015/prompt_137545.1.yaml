      *   If Premium > Lockout Cost * Probability of Lockout -> Don't Commit.

  6.  **Addressing the "Depleting Asset" (Credibility):**
      *   This is crucial. Schellingian power relies on perceived irrationality or binding constraints. If you do it too often, it becomes a tactic, not a constraint.
      *   Need a "Credibility Budget."

  7.  **Drafting the Cases:**
