          *   What is the cost of committing early (premium)?
          *   What is the probability they follow?
          *   *Handling Uncertainty:* If unknown, assume worst-case for us, best-case for them (conservative).
      *   *Step 4: The Credibility Ledger (Depleting Asset)*
          *   Track past commitments. Are we overusing the "irrational actor" persona?
      *   *Step 5: Alternative Moves (Non-Commitment)*
          *   Conditional commitment ("If you...").
          *   Simultaneous exchange.
          *   Strategic incapacity (make it impossible to commit quickly).
          *   Devalue the prize (make exclusivity less valuable).
      *   *Step 6: Hard Stops.*
          *   If Credibility Ledger is low.
          *   If FMP is negative.
          *   If Uncertainty is too high on counterparty valuation.
      *   *Step 7: Escalation.*
          *   Anything affecting the Credibility Ledger goes to CEO/Board.
          *   Anything involving "Strategic Incapacity" goes to CEO.
      *   *Step 8: Failure Modes.*
          *   Multi-party (coordination problems).
          *   Internal races (principal-agent problems).
          *   Counterparty inability (negotiating with ghosts).

  4.  **Refining the Taxonomy:**
      *   User's: Preclusive, Positional, Signalling.
      *   Critique: "Signalling" is usually a byproduct, not a primary race type. "Preclusive" and "Positional" are better.
      *   Addition: *Attrition Races* (who can bleed longer).
      *   Key distinction for procedure: Is the value in *exclusion* (Preclusive) or *coordination* (Positional)? This changes the alternative moves.

  5.  **Addressing the "Win Framing, Lose Terms" Observation:**
      *   This is real. It's the "Commitment Premium."
