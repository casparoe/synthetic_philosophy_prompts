      *   (c) Regulator (Signalling/Regulatory). High risk. CEO wants it. Past success might be survivorship bias. *Critical:* Regulatory commitments are often irreversible and set precedents. If the procedure says "No," explain why (credibility debt, regulatory trap).

  8.  **Review against Constraints:**
