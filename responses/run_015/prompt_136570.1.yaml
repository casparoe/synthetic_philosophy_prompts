prompt: |-
  hey so i'm advising a tiny research cluster — three people, about two years, philosophy and political theory — and we're trying to figure out where to put our effort on constitutional monarchy in modern democracies, mainly UK Scandinavia and Japan. We're specifically stuck on this weird gap between what the monarch is symbolically and these hidden reserve powers that technically still exist but haven't been used in over a century. I'm using a framing I call procedural dormancy — the idea that a monarch's formal veto or dissolution rights stay technically alive through specific parliamentary deadlock protocals, even if everyone pretends they don't exist.

  If you were mapping our agenda, which open conceptual questions about that dormancy should we tackle first? I need an actual ordering with reasoning: which ones are upstream so that resolving them reshuffles the others, which are tractable with philosophy tools rather than deep legal history, and which sound important but are actually dead ends for democratic legitamacy. Also, which implications do people overhype — like, does settling the dormancy question actually change anything for citizens, or is it mostly constitutional navel-gazing?

  Don't give me a bibliography or cite specific scholars, just defend the priorities. Oh and I keep typing dormency by mistake, sorry about that.
reasoning: |-
