  4.  **Drafting the Priorities (Iterative Process):**

      *   *Priority 1: The Ontology of Dormant Power.* Before asking if it's *good*, we need to know what it *is*. Is it a "nuclear option" or a "ghost"? If it's truly unusable without collapsing the system, is it still a power? This reshuffles everything because if it's not a real power, the rest of the project collapses.
