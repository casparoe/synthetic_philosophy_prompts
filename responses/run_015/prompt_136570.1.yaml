answer: |-
  First, no worries on the typo ("dormency" vs. "dormancy")—it happens. The concept itself is sharp. "Procedural dormancy" is a strong hook for a political theory cluster because it moves beyond the standard "monarchy is outdated" debate into the mechanics of *how* outdated institutions sustain modern legitimacy.

  With a team of three and a two-year horizon, you cannot do comparative legal history. You must do conceptual architecture. If you get bogged down in the specific statutory differences between the Swedish Instrument of Government and the Japanese Constitution, you will run out of time.

  Here is the prioritized agenda, ordered by upstream conceptual leverage.

  ### Phase 1: The Ontology of the "Sleeping" Power (Months 1–8)
  **Priority:** Highest (Upstream)
  **Question:** *Is a power that cannot be exercised without system collapse actually a power, or is it a constitutional fiction?*

  **Reasoning:** This is the foundational metaphysical question. Before you can judge whether dormancy is good or bad, you must define what status these reserve powers hold.
  *   **Why it reshuffles the rest:** If you conclude these powers are ontologically "dead" (i.e., using them is legally possible but politically impossible to the point of absurdity), then your project shifts to studying *myths*. If you conclude they are "live but restrained" (i.e., genuine discretion exists), your project shifts to studying *guardianship*.
  *   **Philosophy Tractability:** High. This is speech-act theory and institutional fact analysis. You don't need a lawyer to analyze what it means for a rule to exist but not apply. You can use thought experiments: *If the Monarch vetoed a bill tomorrow, would it be a legal act or a revolutionary act?*
  *   **Risk:** Getting stuck in semantic definitions. Keep it tied to the *capacity* to act.

  ### Phase 2: The Normative Value of Ambiguity (Months 9–16)
  **Priority:** High (Midstream)
  **Question:** *Does the uncertainty of dormancy perform a stabilizing function that explicit rules would destroy?*

  **Reasoning:** Once you define the power, you must justify its silence. Standard democratic theory hates ambiguity; it wants clear lines of accountability. But your "procedural dormancy" suggests ambiguity might be a feature, not a bug.
  *   **Why it's next:** This builds on Phase 1. If the power is "live," why keep it vague? Perhaps the *threat* of intervention keeps political actors in check without the intervention ever needing to happen. This is the "nuclear deterrent" theory of monarchy.
  *   **Philosophy Tractability:** Very High. This is pure political theory. You are arguing against transparency/accountability norms using concepts of epistemic humility or "constructive ambiguity."
  *   **Comparative Angle:** This is where you bring in Japan vs. UK. In Japan, the Emperor has *no* nominal powers (strictly symbolic), whereas the UK Monarch has theoretical prerogatives. Does the UK's ambiguity create more stability than Japan's clarity? Or vice versa?

  ### Phase 3: The Legitimacy of Non-Democratic Insurance (Months 17–24)
  **Priority:** Medium (Downstream)
  **Question:** *Can a democratic system legitimately rely on a non-democratic actor as a "circuit breaker" for democratic failure?*

  **Reasoning:** This is the normative payoff. If dormancy acts as insurance against parliamentary deadlock or authoritarian drift, is it morally permissible to keep that insurance policy in a hereditary hand?
  *   **Why it's later:** You can't answer this until you know what the insurance *does* (Phase 2) and what it *is* (Phase 1).
  *   **Philosophy Tractability:** Medium. This risks becoming a standard "monarchy vs. republic" debate. To keep it fresh, focus specifically on the *dormancy* aspect. It's not about the monarch ruling; it's about the monarch *waiting*. Is "waiting" a political act that requires legitimacy?
  *   **Risk:** This is where most projects die because the answer is usually "No, it's incompatible with popular sovereignty." You need to find a nuance, perhaps regarding *temporal* legitimacy (the monarch represents the long term vs. the parliament's short term).

  ---

  ### The "So What?" Check: Implications for Citizens
  You asked if settling the dormancy question changes anything for citizens. Be honest in your framing: **Directly, almost nothing. Indirectly, it shapes constitutional psychology.**

  *   **Overhyped Implication:** The idea that the Monarch could personally stop a coup or a tyrannical law. In almost all modern contexts, if the Monarch tried to use reserve powers, the bureaucracy and military would likely side with the elected government, or the system would collapse into civil conflict. The "savior" narrative is mostly fantasy.
  *   **Underhyped Implication:** The effect on *political behavior*. If politicians believe the Monarch *might* intervene in a deadlock, they may compromise more readily to avoid triggering the crisis. The dormancy changes how elected officials treat each other, even if it never touches the citizen.
  *   **The Citizen Takeaway:** Your research won't change tax policy. It will explain why these democracies feel "stable" despite having archaic loopholes. It explains the *texture* of their democracy, not the output.

  ### Dead Ends to Avoid
  To protect your two-year timeline, explicitly deprioritize these:

  1.  **Specific Legal Precedents:** Do not try to map the exact legal pathway of a veto in Sweden vs. Norway. That is legal history, not philosophy. Use them only as binary examples (e.g., "Power exists" vs. "Power abolished").
  2.  **The "Succession" Debate:** Do not get dragged into gender equality or primogeniture. That is a separate moral issue. Stick to *institutional power*, not *personnel selection*.
  3.  **The "Cost" Argument:** Do not waste time on the financial cost of monarchies. That is public policy analysis, not political theory. It doesn't touch the "procedural dormancy" concept.
  4.  **Crisis Simulation:** Avoid writing detailed scenarios of "What if the King says No in 2025?" These tend to become speculative fiction. Stick to the *conditions of possibility* for such an act.

  ### Summary of Strategy
  Your unique selling point is **dormancy as a mechanism**. Most people argue monarchy is either "symbolic" (harmless) or "autocratic" (dangerous). You are arguing it is **operational through silence**.

  1.  **Define the silence** (Ontology).
  2.  **Justify the silence** (Function).
  3.  **Defend the silence** (Legitimacy).

  If you nail the first one, the rest follows. If you skip the first one, you're just doing standard comparative politics. Good luck.
