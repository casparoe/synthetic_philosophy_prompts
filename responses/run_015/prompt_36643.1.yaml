answer: |-
  **MEMORANDUM**

  **TO:** Moderation Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework: The "SETTLED" Tag Proposal & Epistemic Governance

  ### 1. Executive Summary

  Following the incident regarding the seroprevalence thread and the subsequent departure of three senior forecasters, this memo recommends a modified path forward regarding Member D.'s "SETTLED" tag proposal.

  **Recommendation:** We should **adopt the "SETTLED" designation only under strict conditions** that fundamentally alter its mechanics. Specifically:
  1.  **Remove Auto-Collapse:** Counter-evidence must never be hidden or deprioritized algorithmically.
  2.  **Mandatory Falsification Criteria:** Applying the tag requires the user to specify exactly what evidence would remove the tag.
  3.  **Community Validation:** The tag cannot be applied unilaterally; it requires a supermajority of verified high-calibration forecasters or Mod approval.

  This approach preserves the efficiency gains D. seeks (reducing noise on high-confidence items) while satisfying the Conservation of Expected Evidence (preventing the tag from becoming a shield against updating).

  ### 2. Context & Stakes

  Member D.'s proposal stems from a valid frustration: high-signal forecasters waste cognitive bandwidth re-litigating questions where the answer is, to them, obvious. D. invokes Gilbert Harman's **Dogmatism Paradox**: *If I know $P$, I am entitled to dismiss evidence against $P$ as misleading.*

  D. is correct that we already draw this line elsewhere. We do not maintain open threads for Flat Earth claims or Astrology. As D. noted, the disagreement is not *whether* a line exists, but *where* we draw it.

  However, the trial implementation failed because it conflated **Individual Confidence** with **Community Consensus**. When D. marked the seroprevalence thread "SETTLED," he effectively used his personal track record to override the community's ability to process new data. This violated the core function of a forecasting forum: the aggregation of dispersed information. The departure of three respected forecasters signals that we are perilously close to incentivizing epistemic learned helplessness—the exact opposite of our mission.

  ### 3. Epistemic Analysis

  To resolve the split in the committee, we must address the two competing epistemic norms at play.

  **A. The Validity of D.'s Claim (The Dogmatism Point)**
  D. is right that perpetual openness is a failure mode. If a question is resolved (e.g., "Did Event X happen?"), keeping the thread open for "what if" speculation degrades signal-to-noise. We need a mechanism to signal that a question is effectively closed *without* waiting for the official resolution date.

  **B. The Validity of the Opposition (Conservation of Expected Evidence)**
  The opposition is right that a "SETTLED" tag that hides counter-evidence creates a one-way ratchet. If a user can mark a question settled, and the system hides evidence that would lower their probability, their 97% confidence is no longer a probability—it is a status claim. In a forecasting market, **visibility of dissent is the primary error-correction mechanism.** Hiding counter-evidence doesn't prove D. right; it just prevents us from finding out if D. is wrong.

  **C. The Synthesis: Intersubjective Verification**
  The distinction between "Flat Earth" and "D.'s Geopolitical Model" is not just about confidence levels; it is about **intersubjective verifiability**. Flat Earth is settled because the evidence is public, overwhelming, and easily verified by any participant. D.'s models often rely on private heuristics or complex causal chains that are not immediately obvious to the aggregate.

  Therefore, we cannot allow a *unilateral* declaration of "Settled." We can only allow a *provisional* declaration that invites verification rather than suppressing it.

  ### 4. Proposed Policy: The "Provisional Consensus" Protocol

  We will implement the "SETTLED" functionality (renamed **"CONSENSUS REACHED"** to reduce dogmatic connotations) under the following constraints. These criteria are designed for Mod enforcement.

  **Condition 1: No Suppression of Evidence (The Visibility Rule)**
  *   **Rule:** The tag may sort counter-arguments to the bottom, but it **cannot auto-collapse or hide them.**
  *   **Rationale:** This addresses the "Conservation of Expected Evidence" critique. If new data emerges (like the seroprevalence study), it must be visible so the community can update. D. is free to ignore it, but the forum cannot hide it.
  *   **Mod Action:** Any tag application that triggers a collapse script is invalid.

  **Condition 2: Mandatory Falsification Field (The Update Rule)**
  *   **Rule:** To apply the tag, the user must fill a mandatory field: *"This status would be revoked if [Specific Observable Event/Data Point] occurs."*
  *   **Rationale:** This addresses the "Slogan vs. Probability" critique. It forces the tagger to put skin in the game. If they cannot name what would change their mind, the question cannot be marked settled.
  *   **Mod Action:** Reject tag applications where the falsification condition is vague (e.g., "if new data proves me wrong" is invalid; "if seroprevalence in Region X exceeds Y%" is valid).

  **Condition 3: Threshold for Application (The Authority Rule)**
  *   **Rule:** The tag cannot be applied unilaterally, regardless of track record. It requires either:
      *   (a) Agreement from 3 other forecasters with a Brier score in the top 5%; OR
      *   (b) Explicit Mod approval based on external verification (e.g., official government confirmation).
  *   **Rationale:** This prevents the "One-Way Ratchet." It ensures "Settled" reflects a *community state*, not an *individual privilege*.
  *   **Mod Action:** Verify signer credentials before approving the tag status.

  **Condition 4: Expiry & Review**
  *   **Rule:** The tag expires after 30 days unless renewed via the same process.
  *   **Rationale:** Prevents "zombie" settlements where a question remains tagged settled long after the context has shifted.

  ### 5. Implementation Criteria for Moderators

  To ensure consistent application, Mods should use the following checklist when reviewing "CONSENSUS REACHED" requests:

  1.  **Is the falsification criteria specific?** (Pass/Fail)
  2.  **Is the counter-evidence still fully visible?** (Pass/Fail)
  3.  **Does the user meet the track-record threshold (Top 5% Brier/Log Loss)?** (Pass/Fail)
  4.  **Is there independent corroboration (either from other top forecasters or external primary sources)?** (Pass/Fail)

  ### 6. Conclusion & Next Steps

  This compromise acknowledges D.'s core insight: we need a way to signal high-confidence closure to reduce noise. However, it rejects the method of *authority-based suppression* in favor of *evidence-based transparency*.

  By requiring a falsification field, we turn the "SETTLED" tag from a shield into a target. It challenges the community to try to unsettle the consensus, which is the engine of good forecasting.

  **Action Item:** I propose we vote on this framework at next week's meeting. If passed, Engineering will need to disable the auto-collapse script and update the tagging interface to include the Falsification Field before the next release cycle.

  We must retain D. as a member—his calibration is an asset—but we cannot retain a feature that incentivizes the exodus of the very peers required to validate that calibration.

  ***

  **Prepared for:** Moderation Committee Closed Session
  **Distribution:** Committee Members Only
