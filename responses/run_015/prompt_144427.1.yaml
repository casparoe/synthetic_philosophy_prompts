prompt: |-
  After my sister, a working painter with no philosophy background, admitted that she recently praised a peer's installation mainly because the gallery owner was present and she hoped to secure a future show, she asked me why philosophers say some reasons "count" for an aesthetic judgment while others do not, even when both motivate you. I want to design a single-session teaching plan—delivered over dinner, without texts or citations—to help her understand the wrong-kind-of-reasons problem well enough to audit her own evaluations. I need the conceptual architecture specified: the exact sequence in which to introduce the distinction between reasons that bear on whether an attitude is fitting and reasons that merely cause or incentivize it; why the idea of a "pro-attitude" should come only after she has seen a concrete failure case, not before; the one carrying example drawn from artistic judgment—preferably one that contains both an obvious wrong-kind reason (financial or career gain) and a less obvious one (loyalty to a mentor or institutional pressure)—and what that example must include and exclude so she does not confuse wrong-kind reasons with mere selfishness; the misconceptions she is likely to bring (that honesty about one's motives dissolves the problem, that any explanatory reason is automatically justifying, or that the issue is only about hypocrisy) together with the point in the sequence where each should be preempted; a brief check for understanding that requires her to classify a novel case rather than repeat a slogan; and an explicit boundary of what to leave out—such as parallel problems for belief, metaethical debates about value realism, and institutional-rationality literature—so the session stays focused. Please present this as a plan for explanation, not the explanation itself, and do not include reading lists or references she could not access.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** The user's sister, a working painter with no philosophy background. She's pragmatic, honest about her motives (admitted praising a peer for career gain), and wants to understand *why* some reasons "count" for aesthetic judgment while others don't.
      *   **Goal:** Design a single-session teaching plan (delivered over dinner, no texts/citations) to help her understand the "Wrong Kind of Reasons" (WKR) problem well enough to audit her own evaluations.
      *   **Specific Requirements:**
          *   Specify conceptual architecture (sequence of ideas).
          *   Explain *why* "pro-attitude" comes *after* a concrete failure case.
          *   Define one carrying example (artistic judgment) containing both obvious (financial) and less obvious (loyalty/pressure) WKR, ensuring it doesn't confuse WKR with selfishness.
          *   Identify likely misconceptions (honesty dissolves problem, explanatory = justifying, issue is hypocrisy) and when to preempt them.
          *   Include a check for understanding (classify a novel case).
          *   Set explicit boundaries (what to leave out: belief parallels, metaethics, institutional rationality).
          *   **Format:** A plan for explanation, *not* the explanation itself. No reading lists.

  2.  **Deconstruct the Philosophical Problem (WKR):**
      *   The core distinction is between *object-given reasons* (Right Kind) and *state-given/attitude-given reasons* (Wrong Kind).
      *   In aesthetics: Does the reason point to features of the *art* (fittingness), or features of the *praiser/benefit* (incentive)?
      *   The sister's case: Praising because the gallery owner is present. This is a classic WKR.
      *   The challenge: Making this intuitive without jargon like "fittingness attitudes" or "buck-passing accounts."

  3.  **Drafting the Conceptual Architecture (Sequence):**
      *   *Step 1: The Hook.* Start with her confession. Validate it, then pivot to the puzzle.
      *   *Step 2: The Concrete Failure Case.* Before defining terms, show where the logic breaks. Use the carrying example here.
      *   *Step 3: The Distinction.* Introduce the "About the Art" vs. "About the Situation" distinction (layman's terms for Object vs. State given).
      *   *Step 4: The "Pro-Attitude" Concept.* Now introduce the idea that praise is a specific tool with a specific job.
      *   *Step 5: Misconception Management.* Address honesty, explanation vs. justification, and hypocrisy as they arise.
      *   *Step 6: Check for Understanding.* A new scenario.
      *   *Step 7: Boundaries.* What we aren't talking about.

  4.  **Developing the Carrying Example:**
      *   Needs to be artistic.
      *   Needs obvious WKR (money/career).
      *   Needs subtle WKR (loyalty/pressure).
      *   *Constraint:* Must not confuse WKR with selfishness. (Altruistic reasons can also be WKRs).
      *   *Idea:* A critique of a mentor's bad painting.
          *   Obvious WKR: Don't criticize because you want a grant the mentor controls.
          *   Subtle WKR: Don't criticize because you love the mentor and don't want to hurt their feelings (loyalty).
          *   RKRs (Right Kind): The brushwork is muddy, the composition is off.
      *   *Refinement:* Let's make it about *praise* to match her situation. Praising a mediocre work.
      *   *Scenario:* "The Mentor's Retrospective." You praise a weak piece.
          *   Reason A: You want to be in the next show (Self-interest).
          *   Reason B: The mentor is elderly and this is their last show; you don't want to diminish their legacy (Loyalty/Kindness).
          *   Both are WKRs. Neither is about the *quality* of the work. This breaks the "selfishness" confusion.

  5.  **Addressing the "Pro-Attitude" Timing:**
      *   Why wait? If I start with "Praise is a pro-attitude," she'll tune out. It's abstract.
      *   If I start with "Imagine you lie about a painting," she sees the tension. Then I explain *why* it feels like a lie even if everyone knows the motive. That leads to the function of praise (the pro-attitude).

  6.  **Mapping Misconceptions:**
      *   *Honesty:* "But I admitted it!" -> Preempt during the distinction phase. Honesty about motives doesn't make the motive relevant to *art*.
      *   *Explanation vs. Justification:* "I have a reason, so it's valid." -> Preempt when defining the distinction. Having a cause isn't having a warrant.
      *   *Hypocrisy:* "It's just lying." -> Preempt during the Pro-Attitude phase. It's not about lying; it's about using the wrong tool for the job.

  7.  **Designing the Check for Understanding:**
      *   Needs to be novel. Not about painting/praise directly, or a twist on it.
      *   *Idea:* A restaurant review? Or a different art context. Let's stick to art but change the role. She is judging a student's work.
      *   *Scenario:* She recommends a student for a scholarship.
      *   *Reasons:* Student is talented (RKR) vs. Student needs money more than others (WKR - compassion) vs. Student is the Dean's nephew (WKR - fear).
      *   *Task:* Which reasons support the judgment "This is the *best* work" vs. "This is the *most deserving* person"? (Wait, that might complicate it).
      *   *Better Task:* "You are writing a blurb for a catalog. Which reasons go in the blurb, and which stay in your head?"

  8.  **Setting Boundaries:**
      *   No epistemology (belief).
      *   No metaethics (realism vs. anti-realism).
      *   No institutional theory (artworld definitions).
      *   Keep it focused on *aesthetic judgment*.

  9.  **Review against Constraints:**
      *   Single session/dinner? Yes, keep it conversational.
      *   No texts/citations? Yes.
      *   Plan, not explanation? Yes.
      *   Specific sequence requirements met? Yes.
      *   Example requirements met? Yes.

  10. **Refining the Output:**
      *   Ensure the tone is instructional for the *user* (the brother/sister teaching her), not the sister directly.
      *   Make sure the "Why" for the Pro-Attitude timing is clear.
      *   Ensure the distinction between "Selfishness" and "WKR" is highlighted in the example section.

  11. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't accidentally explain the philosophy *to the user* too densely; keep it focused on the *pedagogy*.
      *   *Correction:* Ensure the "Check for Understanding" is actionable at a dinner table.
      *   *Correction:* Verify the "Loyalty" example clearly distinguishes from selfishness. Loyalty is virtuous, but still a WKR for *aesthetic* judgment. This is crucial.

  12. **Final Structure:**
      *   Session Goal & Tone.
      *   Phase 1: The Hook (Her Confession).
      *   Phase 2: The Carrying Example (The Mentor's Retrospective).
      *   Phase 3: The Distinction (Art vs. Situation).
      *   Phase 4: The Function of Praise (Pro-Attitude).
      *   Phase 5: Misconception Checkpoints.
      *   Phase 6: Assessment (The Catalog Blurb).
      *   Phase 7: Boundaries (What we ignore).

  (Proceed to generate response based on this structure.)
answer: |-
  # Teaching Plan: The "Wrong Kind of Reasons" in Aesthetic Judgment
  **Context:** Single dinner session. No texts, no jargon-heavy definitions.
  **Goal:** Enable the learner (your sister) to distinguish between reasons that justify an aesthetic judgment and reasons that merely motivate it, specifically to audit her own professional evaluations.

  ## I. Session Architecture & Sequence
  Do not begin with definitions. Begin with the tension she already feels. The sequence must move from **Intuition** → **Case Study** → **Distinction** → **Theory** → **Application**.

  1.  **Validate the Confession:** Acknowledge her honesty about the gallery owner incident. Establish that her motive was rational for *career survival*, but she senses it was invalid for *art criticism*.
  2.  **The Carrying Example (The "Mentor's Retrospective"):** Introduce a hypothetical scenario that mirrors her situation but complicates the moral stakes.
  3.  **The Distinction (Object vs. Context):** Derive the rule from the example. Separate reasons about the *work* from reasons about the *consequences of praising*.
  4.  **The Function of Praise (Pro-Attitude):** Explain *why* the distinction exists only after the distinction is felt. Define praise as a specific tool with a specific job.
  5.  **Misconception Preemption:** Address specific errors as they naturally arise during the distinction phase.
  6.  **Check for Understanding:** A novel classification task.
  7.  **Boundary Setting:** Explicitly state what is out of scope to prevent scope creep.

  ---

  ## II. The Carrying Example: "The Mentor's Retrospective"
  You must use this specific narrative to drive the point home. It is designed to separate "Wrong Kind of Reasons" (WKR) from "Selfishness."

  **The Scenario:**
  Imagine a respected, elderly mentor is having their final retrospective. You are asked to write a short catalog essay praising a specific painting. You privately believe the painting is technically flawed (muddy brushwork, weak composition).

  **The Reasons to Praise Anyway:**
  1.  **Reason A (Career):** If you praise it, the mentor might recommend you for a prestigious residency. (Obvious WKR).
  2.  **Reason B (Loyalty/Kindness):** The mentor is frail. Criticizing the work now would cause them deep emotional pain and tarnish their legacy in their final year. (Subtle WKR).
  3.  **Reason C (Aesthetic):** The color harmony in the second quadrant is genuinely innovative. (Right Kind of Reason - RKR).

  **Requirements for Delivery:**
  *   **Include:** The fact that Reason B (Loyalty) is morally *good*, but still the "wrong kind" for an *aesthetic* judgment. This prevents her from equating WKR with selfishness.
  *   **Exclude:** Any mention of lying. She can praise it sincerely out of loyalty, but the *reason* for the praise remains external to the art.
  *   **Goal:** Show that Reason A and Reason B are structurally identical in this context: they are both about the *effects* of the praise, not the *features* of the painting.

  ---

  ## III. Conceptual Sequence & Misconception Management
  Introduce concepts in this exact order to prevent abstraction fatigue.

  ### Step 1: The Failure Case (Before Theory)
  *   **Action:** Present the "Mentor's Retrospective" scenario. Ask her: "If you write the essay based on Reason B (Loyalty), have you evaluated the *painting*?"
  *   **Why:** She needs to feel the intuitive "click" that loyalty is a valid reason for *action* but an invalid reason for *judgment* before you give it a name.
  *   **Preempt Misconception 1 (Honesty):** She may say, "But if I admit I'm doing it for loyalty, isn't that honest?"
      *   *Response:* "Honesty about your motive doesn't make the motive relevant to the art. You can be honestly wrong about what counts as evidence."

  ### Step 2: The Distinction (Art vs. Situation)
  *   **Action:** Draw a line on a napkin. Left side: "Features of the Work." Right side: "Features of the Situation."
  *   **Instruction:** Sort Reasons A, B, and C from the example.
  *   **Preempt Misconception 2 (Explanation = Justification):** She may argue, "Loyalty explains why I praised it, so it's a valid reason."
      *   *Response:* "It explains the *event* of your praise, but it doesn't support the *content* of your praise. We are looking for reasons that support the claim 'This is good,' not the claim 'I said this is good.'"

  ### Step 3: The "Pro-Attitude" (After the Distinction)
  *   **Action:** Now introduce the concept of praise as a tool.
  *   **Explanation:** "Praise isn't just a noise you make; it's a signal. It tells the listener, 'Look here, there is value in this object.' If you signal based on loyalty, you are breaking the signal. You are using a 'quality detector' as a 'kindness generator.'"
  *   **Why Wait?** If you start here, it sounds like semantic pedantry. After the example, it sounds like a solution to the problem she just identified.
  *   **Preempt Misconception 3 (Hypocrisy):** She may think this is just about lying or hypocrisy.
      *   *Response:* "You can believe the painting is good *because* of loyalty (you convince yourself). The problem isn't insincerity; it's that the reason doesn't track artistic value. Even if everyone knows you're doing it for loyalty, the praise still doesn't function as aesthetic guidance."

  ---

  ## IV. Check for Understanding: "The Scholarship Committee"
  Do not ask her to define WKR. Ask her to classify a new case.

  **The Scenario:**
  "You are on a committee awarding a scholarship to a young artist. Two candidates apply."
  *   **Candidate X:** Brilliant work, wealthy family, doesn't need money.
  *   **Candidate Y:** Mediocre work, struggling single parent, desperately needs money.

  **The Task:**
  "You decide to give the money to Candidate Y.
  1. Can you justify this decision? (Yes).
  2. Can you write in the official citation that Candidate Y produced the *better art*? (No).
  3. Why not? What kind of reason is 'need for money'?"

  **Success Criteria:**
  She must identify that "need for money" is a valid reason for *aid*, but a Wrong Kind of Reason for *aesthetic ranking*. If she conflates the two, revisit the "Mentor" example.

  ---

  ## V. Explicit Boundaries (What to Leave Out)
  To keep the dinner conversation focused and actionable, explicitly state (mentally or verbally) that you are **not** discussing:

  1.  **Belief/Evidence Parallels:** Do not discuss whether there are wrong kinds of reasons for *belief* (e.g., believing in God for comfort). Stick strictly to aesthetic valuation.
  2.  **Metaethics:** Do not discuss whether "value" is real or subjective. The problem exists even if value is subjective (the reason must still track the subject's aesthetic response, not their wallet).
  3.  **Institutional Rationality:** Do not discuss whether galleries *should* run this way. Focus on the integrity of her judgment, not the ethics of the art market.
  4.  **Moral Judgment:** Do not let the conversation drift into whether it is *moral* to praise for career gain. The focus is on whether it counts as an *aesthetic* judgment, not whether it is ethically permissible.

  ## VI. Summary of Pedagogical Logic
  *   **Sequence:** Intuition → Case → Distinction → Function.
  *   **Pro-Attitude Timing:** Introduced only after she sees the "signal breaking" in the Mentor example.
  *   **Example Design:** Uses Loyalty to decouple WKR from Selfishness.
  *   **Assessment:** Tests ability to separate *aid decisions* from *quality judgments* in a novel context.
  *   **Constraints:** No jargon, no texts, no meta-philosophical drift.
