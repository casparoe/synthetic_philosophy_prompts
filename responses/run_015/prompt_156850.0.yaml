          2.  *Application:* Current LLMs satisfy this criterion, so they have beliefs.
      *   **Defined Terms:**
          *   *Surplus Predictiveness:* Predictive edge of intentional stance over best non-intentional description (even with full access to weights/compute).
          *   *Attributional Decoherence:* Locally optimal but globally unsatisfiable belief attributions (contradictory across contexts).
          *   *Playback Problem:* A replay device satisfies the criterion just like the original agent.
      *   **Tasks:**
          1.  Map exposure/defeaters (Fatal -> Awkward).
          2.  Address three specific challenges: Surplus Predictiveness (Idealized Interpreter), Attributional Decoherence, Instrumentalism/Fictionalism (Interpreter Ignorance).
          3.  Identify unique predictions (vs. rivals like fictionalism/functionalism).
          4.  Assess falsifiability/insulation risk.
