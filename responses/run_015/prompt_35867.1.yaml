  2.  **Forced Restitution:** A court forces a thief to repay stolen funds. Is this a "wrong"? If the proverb condemns this, it undermines civil law. If it allows this but condemns imprisonment, the classmate must explain the moral difference between depriving property vs. liberty when both are state-imposed harms following wrongs. If they accept restitution but reject punishment, they are committed to the **Standing Claim**, not the Intrinsic Wrongness Thesis.
