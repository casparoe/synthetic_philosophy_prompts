  3.  **The Symmetry Claim:** "Retaliatory harm is morally identical to the initial harm."
      (a) Falsehood. (b) Targets retributivism specifically by denying moral asymmetry. (c) Condemns self-defense and restitution; unacceptable as it ignores authority and desert.
  4.  **The Absolutist:** "Inflicting suffering is always wrong."
      (a) Substantive but dubious pacifist claim. (b) Hits retributivism and consequentialism equally. (c) Condemns defensive war, policing, and surgery; likely fatal to the reading as too demanding.

  **Wrongness and Symmetry**
  The proverb's force depends on whether "wrong" attaches to act-types (inflicting pain), act-tokens (unjustified infliction), or the agent's standing.
  *   **Act-Type:** If punishment is wrong because it hurts, the proverb condemns quarantine or self-defense. This proves too much.
  *   **Act-Token:** If punishment is wrong because it is unjustified, the proverb is circular (it assumes punishment is unjustified to prove it is unjustified).
  *   **Standing:** The retributivist argues crime is a liberty-excess by the offender; punishment is a liberty-restoration by the state. The proverb assumes symmetry (crime = punishment) to deny the state's special standing. Only the **Standing Claim** (Menu #2) respects this asymmetry without begging the question.

