  **Menu of Theses (Trivial to Radical)**

  1.  **The Tautology:** "Do not commit wrongful acts."
      (a) Platitude. (b) No force against any theory; retributivists simply deny punishment is a "wrong." (c) Acceptable universally; condemns nothing specific.
  2.  **The Standing Claim:** "Private agents cannot rectify wrongs with harm."
