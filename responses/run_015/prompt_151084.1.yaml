      *   *Prefrontal component:* This is the neural correlate of the *report confidence*, not the consciousness itself.

      *Self-Correction on "Unfalsifiability":* I need to be careful not to make GWT immune to *any* report failure. The line is: If ignition happens without *any* behavioral signature (even implicit), GWT is in trouble. But here implicit signatures exist. So the theory holds.

