prompt: |-
  Hey — I'm a first-year cog sci PhD student, and I keep getting beaten in arguments by a friend in the lab next door about global workspace stuff, so I'd really like a proper philosopher's take on this. Please act like a philosophy of mind professor who is genuinely sympathetic to global workspace theory but has read all the Block-style objections and takes them seriously; brainstorm a bit before you settle on a line, and please don't hedge everything into mush — I want a real position defended.

  The setup is an invented empirical pattern, so just grant it for the sake of the argument. Imagine intracranial recordings in epilepsy patients where, on some trials, you get what we've started calling dark ignition: the stimulus produces the full global-workspace signature — late, sustained, widely distributed activity, the standard ignition marker — and the content is demonstrably available downstream. The patient can pick it out on a forced-choice test well above chance, it primes their decisions minutes later, and it even shows up in what they say if you ask them to talk for a minute about whatever was going through their head. But asked directly, at the time, they say they saw nothing. Not in a hesitant, "I'm not sure" way either: they'll take a bet that no stimulus was presented, they stick to it when you encourage them, and when you tell them the recording says otherwise they say things like, well, the electrode must have picked something up, I didn't see anything. On other trials with the very same stimulus — echo trials, we call them — you get ignition plus a later, reverberating prefrontal component, and those ones get reported as a perfectly ordinary visual experience. And if you re-present a dark-ignition stimulus a few seconds later, it usually flips into an echo trial and gets reported.

  What I want you to argue is that my friend is wrong to read dark ignition as evidence for a real gap between access consciousness and phenomenal consciousness. Argue that the right thing for a global workspace theorist to say is that the dark-ignition patients are conscious of the stimulus and their denials are the unreliable part: report is just one more consumer system, an introspective/metacognitive channel that broadcast can fail to reach, and phenomenal consciousness as something over and above global availability either collapses into it or is an extra ingredient the theory never needed. Please also deal with the obvious comebacks — that this looks like you're simply stipulating that consciousness is whatever the workspace does and thereby making the theory unfalsifiable; that if you discard report you've discarded the only evidence you ever had that ignition tracks consciousness at all; and that a distinction which correctly predicts a difference between the two kinds of trial isn't obviously doing no work. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating my question back to me.
