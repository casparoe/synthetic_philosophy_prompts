      *   **Task:** Argue against the friend's interpretation of "dark ignition" (ignition + availability + no report) as evidence for a gap between Access Consciousness (A-consciousness) and Phenomenal Consciousness (P-consciousness).
      *   **Core Position:** Dark ignition patients *are* conscious; their denials are unreliable (metacognitive failure). P-consciousness collapses into (or is constituted by) global availability. Report is just another consumer system.
