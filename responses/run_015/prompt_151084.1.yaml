  6.  **Final Polish of the Argument:**
      *   *Bottom Line:* Your friend is wrong because dark ignition reveals a fracture in metacognitive reporting, not a gap between access and phenomenality; the patients are conscious, and their denials are false negatives generated by a specific failure in the higher-order monitoring system.
      *   *Argument:* GWT identifies consciousness with global availability. The data shows availability (priming, forced choice, spontaneous speech). Therefore, consciousness is present. The denial is a specific behavioral output that requires an extra step (the prefrontal component).
      *   *Block's Objection:* Block says "But it doesn't feel like anything!" Response: How do you know? Only because they say so. But they also say things implying they processed it. Their self-model is glitching.
      *   *Unfalsifiability:* It's not stipulative because ignition is neurally defined. If ignition occurred with *zero* downstream effects (no priming, no forced choice), GWT would be dead. Here, downstream effects exist.
      *   *Report:* We don't discard report; we contextualize it. It's a dependent measure, not the definition.
      *   *Work:* The distinction predicts neural differences (prefrontal component), so it's empirically robust, just mislabeled by Blockians as P vs. A.

  7.  **Checking Constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   No restating question? Yes.
      *   Address comebacks? Yes.
