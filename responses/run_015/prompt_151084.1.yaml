answer: |-
  Your friend is wrong because dark ignition reveals a fracture in metacognitive reporting, not a gap between access and phenomenality; the patients are conscious, and their denials are false negatives generated by a specific failure in the higher-order monitoring system.

  Global Workspace Theory identifies phenomenal consciousness with global availability: for a content to be conscious just is for it to be broadcast to the suite of downstream systems governing reasoning, action, and verbal report. In your dark ignition cases, the content *is* globally available. You have the neural signature (ignition), you have the implicit behavioral signatures (priming, forced choice), and crucially, you have the spontaneous verbalization. If a patient can weave the stimulus content into a spontaneous narrative about their mental state, that content is phenomenally present; it is "like something" to be the system processing that information. The direct denial ("I saw nothing") is not a transparent window into their phenomenology; it is a specific, high-threshold behavioral output that requires an additional layer of metacognitive certification.

  The existence of the extra prefrontal component in echo trials is the smoking gun here. That component isn't the neural correlate of consciousness; it is the neural correlate of *confidence in reporting*. In dark ignition trials, the perceptual content reaches the workspace and drives behavior, but the metacognitive monitor fails to tag that content as "reportable" with high confidence. When the patient says, "I didn't see anything," they are not reporting on their raw experience; they are reporting on the output of their metacognitive monitoring system, which in this specific instance returns a false negative. This is analogous to anosognosia, where a paralyzed patient insists they can move their arm; we don't posit a gap between their "motor consciousness" and "motor access," we recognize a breakdown in the self-model. Your friend is treating the patient's verbal report as infallible testimony, but in cognitive science, report is just another dependent variable, susceptible to noise and dissociation like any other motor output.

  Now, let's deal with the charge that this makes GWT unfalsifiable by stipulating that consciousness is whatever the workspace does. This objection fails because ignition is defined independently of report, via its neural signature (late, sustained, widespread activity). GWT makes the risky empirical claim that *this specific neural pattern* is sufficient for consciousness. If you found ignition without *any* downstream consequences—no priming, no forced-choice accuracy, no spontaneous mention—then GWT would be falsified, because availability would be absent despite the neural signature. But in dark ignition, availability is present. The theory isn't shielding itself from refutation; it's distinguishing between first-order availability (consciousness) and second-order availability (knowing that you know). The unfalsifiability charge only sticks if you insist that verbal denial trumps all other behavioral measures, which is precisely the dogma we should reject.

  This leads to the worry that by discarding report as the gold standard, we lose the evidence that ignition tracks consciousness at all. We haven't discarded report; we've demoted it from a definition to a correlate. In standard cases, metacognitive monitoring works, so report aligns with ignition. In dark ignition, it doesn't. But we don't throw out the thermometer because it reads differently in a vacuum; we explain the variance. The evidence that ignition tracks consciousness comes from the convergence of measures: neural dynamics, implicit behavior, and *usually* report. When they diverge, we look for the mechanism of divergence. The mechanism here is clear: the lack of the prefrontal confidence signal. If we privilege the denial over the spontaneous speech and forced-choice accuracy, we are prioritizing a single, fragile channel of output over the broader functional profile of the system.

  Finally, your friend will argue that a distinction which correctly predicts the difference between dark and echo trials is obviously doing work, so why deny the P-consciousness/A-consciousness split? Because the distinction *is* doing work, just not the work Block wants it to do. The difference between dark and echo trials isn't between unconscious access and conscious experience; it's between conscious experience with low metacognitive confidence and conscious experience with high metacognitive confidence. This is a distinction within consciousness, not between consciousness and something else. It predicts the neural data (the prefrontal component) and the behavioral data (denial vs. affirmation) without positing a magical, non-functional phenomenal residue. If you adopt the Blockian view, you have to explain why "phenomenal consciousness" without report still drives forced choice and spontaneous speech anyway. On the GWT view, the explanation is straightforward: the content is available, so it drives behavior; the metacognitive tag is missing, so it drives denial. That is a leaner, more integrated explanation that respects the neuroscience without reifying intuition.
