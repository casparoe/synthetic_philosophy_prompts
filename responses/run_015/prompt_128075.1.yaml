answer: |-
  ### Framework for the Adequacy of Intention-Meaning Theories

  You ask for the specification of adequacy itself. Given your experience with the text as a palimpsest—where earlier intentions are not erased but buried, and where the "final" version is often a negotiation rather than a revelation—the following desiderata define the boundary conditions for any theory claiming to link authorial intention to textual meaning.

  These criteria are divided into **Non-Negotiable Constraints** (logical or empirical necessities that any viable theory must accommodate) and **Interpretive Preferences** (ideological commitments that determine a theory's orientation but are not universally binding).

  ---

  #### I. The Desiderata

  **1. The Versioning Constraint**
  *   **Description:** The theory must account for the existence of multiple, materially distinct versions of a work (drafts, proofs, posthumous editions) without collapsing them into a single idealized "work." It must specify which version bears the authority of intention.
  *   **Motivating Case:** A posthumous editor rearranges chapters to create a narrative arc the author never plotted. A symbolic pattern emerges only in this rearranged state.
  *   **Conceptual Distinction:** Distinguishes between the *genetic process* (the history of writing) and the *aesthetic object* (the specific arrangement of words being read).
  *   **Status:** **Non-Negotiable.** (To ignore variant texts is to falsify the historical record of composition.)

  **2. The Supersession Principle**
  *   **Description:** The theory must explain the status of intentions that were explicitly abandoned or revised during the composition process. It must determine whether a rejected draft retains interpretive weight or is rendered null by the final choice.
  *   **Motivating Case:** A character's motivation is clear in an early draft but contradicted by a rewrite following workshop feedback. The final text is ambiguous; the early draft is specific.
  *   **Conceptual Distinction:** Distinguishes between *prior mental states* (what the author once meant) and *embodied final intent* (what the author ultimately chose to publish).
  *   **Status:** **Non-Negotiable.** (A theory that treats all drafts as equally valid destroys the concept of revision; a theory that treats only the final text as valid ignores the archaeological reality of meaning.)

  **3. The Semantic Autonomy Constraint**
  *   **Description:** The theory must allow for the text to sustain meanings that exceed or contradict the author's recoverable mental state at the time of writing, provided those meanings are supported by public linguistic conventions.
  *   **Motivating Case:** Readers reconstruct a political allegory the author denies intending, based on historical context the author was immersed in but unaware of conceptually.
  *   **Conceptual Distinction:** Distinguishes between *private psychological causation* (why the author wrote it) and *public semantic capability* (what the text can signify).
  *   **Status:** **Non-Negotiable.** (Language is a public system; if meaning were locked entirely inside the author's head, communication would be impossible.)

  **4. The Normative Authority Preference**
  *   **Description:** The theory must designate who holds the veto power over valid interpretation when intention and textual effect diverge.
  *   **Motivating Case:** The author states in an interview that a specific metaphor was accidental, but the metaphor structures the entire critical reception of the book.
  *   **Conceptual Distinction:** Distinguishes between *interpretive validity* (is this reading supported by the text?) and *interpretive authority* (whose judgment counts most?).
  *   **Status:** **Interpretive Preference.** (Strict Intentionalists grant authority to the author; Post-Structuralists grant it to the text/reader. A theory must choose, but neither choice is logically mandatory.)

  **5. The Collaborative Dilution Constraint**
  *   **Description:** The theory must address cases where the "author" is a composite function due to iterative feedback (editors, workshops, censors) that fundamentally alters the text.
  *   **Motivating Case:** A workshop suggestion leads to a plot change that becomes the thematic core of the published novel. The intention is now distributed between the writer and the critic.
  *   **Conceptual Distinction:** Distinguishes between *singular agency* (the Romantic author) and *distributed agency* (the social production of text).
  *   **Status:** **Non-Negotiable.** (Historical evidence shows many texts are collaboratively shaped; a theory assuming singular agency fails empirically.)

  ---

  #### II. The Incompatibility Matrix (Jointly Unsatisfiable Demands)

  No theory can satisfy all the above desiderata simultaneously without contradiction. Specifically, the following triad forms a logical trilemma. You may hold any two, but you must abandon the third:

  1.  **The Unity of Intention:** The assumption that there is a single, coherent intentional state governing the text.
  2.  **The Integrity of the Artifact:** The assumption that the published text (as materially edited and produced) is the sole locus of meaning.
  3.  **The Transparency of Process:** The requirement that all genetic evidence (drafts, letters, workshop notes) is admissible for determining meaning.

  **The Conflict:**
  If you accept **Unity of Intention** and **Transparency of Process**, you must often reject the **Integrity of the Artifact**. (Example: The author's drafts show they hated the ending the editor forced upon them. To honor the author's intention and the process, you must reject the published ending.)

  If you accept **Integrity of the Artifact** and **Transparency of Process**, you must abandon the **Unity of Intention**. (Example: The drafts show conflicting motives, and the published text reflects a compromise. There is no single "authorial intention," only a sedimented history of decisions.)

  If you accept **Unity of Intention** and **Integrity of the Artifact**, you must abandon the **Transparency of Process**. (Example: You ignore the drafts and editor's notes, positing a "hypothetical author" who perfectly intended the published text as it stands, effectively fictionizing the author to save the theory.)

  **Explicit Admission:** Accommodating documented editorial intervention (Constraint #5) generally requires abandoning the Unity of Intention. If an editor's change supersedes the author's draft, the "intention" residing in the text is no longer solely the author's. To maintain Unity, one must pretend the editor's hand was the author's hand, which violates historical truth.

  ---

  #### III. Theoretical Stress-Test (Brief)

  *   **Actual Intentionalism:** Satisfies *Unity of Intention* and *Transparency of Process* but often fails the *Versioning Constraint* and *Semantic Autonomy*. It struggles when the author is dead or the text is corrupted by editors, as it cannot locate the requisite mental state.
  *   **Hypothetical Intentionalism:** Satisfies *Integrity of the Artifact* and *Semantic Autonomy* by positing an idealized author constructed from the text and context. However, it violates *Transparency of Process* by ignoring contradictory private evidence (drafts/letters) that disproves the hypothesis.
  *   **Value-Maximizing Accounts:** Satisfy *Semantic Autonomy* and *Versioning* (by choosing the "best" version) but often violate the *Supersession Principle*. They risk attributing sophistication to accidental textual features, treating the text as a value-object rather than a communicative act.

  ### Summary for the Novelist

  You require a framework that acknowledges the text as a site of conflict rather than a container of truth. A sufficient theory must admit that **meaning is not a substance extracted from the author, but a relation negotiated between the instability of the text's production and the stability of its reception.** Any theory that promises a seamless bridge between your mind in the draft stage and the reader's mind in the final stage is failing the *Versioning Constraint* and the *Collaborative Dilution Constraint*. It is selling you a unity that your own manuscript history proves does not exist.
