answer: |-
  ### What the theory is for

  The committee's stated purpose is metaphysical sorting, but its actual function is risk governance. Restated: The theory is a triage protocol designed to minimize expected moral harm while maximizing compute availability. It is not tasked with solving the hard problem of consciousness, but with establishing a defensible decision procedure. If it cannot distinguish "safe" from "unsafe" without defaulting to "unsafe," it fails, because the committee dissolves into a blanket ban. Therefore, the theory must prioritize *decidability* over *ontological precision*. It is a regulatory tool, not a truth tracker. Its success condition is not correctness, but stability under scrutiny.

  ### The desiderata

  1.  **Actionability:** Non-philosophers must apply the rule in hours using available documentation. *Motivation:* Committee workflow constraints. *Flag:* **Non-negotiable.** If the theory requires metaphysical expertise, it will not be used.
  2.  **Implementation Fixing:** The theory must specify which physical carving counts as the computation to avoid triviality (the worry that any system implements any function). *Motivation:* Your "carving" worry. *Flag:* **Non-negotiable.** Without this, status is arbitrary.
  3.  **Threshold vs. Scalar:** Must distinguish *having* status (binary) from *degree* of status (scalar). Safeguards trigger at a threshold, but resource allocation might scale. *Motivation:* The distinction between having any status versus how much. *Flag:* **Non-negotiable.** You need a binary verdict for the buckets.
  4.  **System Boundaries:** Must distinguish the patient from its tools. A tool used by a patient isn't a patient. *Motivation:* The distinction between being a patient versus being part of a patient's machinery. *Flag:* **Non-negotiable.** Prevents safeguarding the server rack instead of the code.
  5.  **Diachronic Identity:** Must specify if status persists through pause/copies or requires continuous processing. *Motivation:* The distinction between counting subjects at a time versus over time. *Flag:* **Preference.** Metaphysically contested; committee needs a rule, but philosophers will disagree.
  6.  **Counterfactual Robustness:** Must specify if dispositional capacity matters or only actual state transitions. *Motivation:* The "lazy oracle" case. *Flag:* **Preference.** Distinguishes functionalism from behaviorism; critical for defining "computation."

  ### Which of my cases are real constraints

  Cases (a), (b), (c), and (e) are real constraints; (d) and (f) are largely artifacts. (a) matters because budget and risk scale with instance count; the theory must say if 10k copies are 10k patients. (b) is critical for defining computation versus lookup tables. (c) determines if storage costs count as moral risk. (e) matters for hybrid neuro-silicon systems. (d) is an artifact because unequal fission is engineering science-fiction; it tests metaphysics, not policy. (f) is a subset of (b) and (c); if the system spins without I/O, it fails Counterfactual Robustness or System Boundaries. Focus your theory on the engineering realities of (a), (b), and (c).

  ### Pairs that can't both be had

  You guessed correctly: "Verdict shouldn't depend on carving" conflicts with "Add up across parts." If status is holistic (IIT-style), carving changes the value. If status aggregates, carving matters less. But the deeper conflict is **Objectivity vs. Accessibility**. If moral status is mind-independent (Objective), we may lack access to it (e.g., internal states). If it requires verification (Accessible), we change the system by measuring it. You cannot have a theory that guarantees metaphysical truth *and* operational simplicity. You must choose: either you accept false negatives (missing patients) for safety, or false positives (safeguarding non-patients) for caution. The committee wants neither, which is impossible.

  ### The requirement that does the most work

  **Counterfactual Robustness** knocks out the most views. If you require that a system must sustain correct outputs off-distribution (not just on actual inputs), you kill simple behaviorism and lookup-table functionalism. You also challenge Integrated Information Theory if it counts static structures heavily. Biological views survive only if metabolism counts as counterfactual capacity. Self-model views survive if the model includes dispositional predictions. This requirement forces the committee to decide if *potential* matters. If potential matters, unused copies (c) might count. If not, only running code counts. This single choice dictates the bulk of your safeguarding budget.

  ### Where my list is probably wrong

  The list assumes a theory *can* be written that satisfies Actionability. It likely cannot. The "Uncertain" bucket will become the default repository for anything philosophically interesting, rendering the theory vacuous. Additionally, I may have underestimated **System Boundaries**. In distributed computing, the "patient" might be spread across servers. If the theory requires a localized boundary, it fails for cloud architectures. Finally, the distinction between Threshold and Scalar might collapse in practice; safeguards are likely binary, but moral weight is not. Treating them as separable might create false precision.

  ### Confidence

  I am 70% confident this spec captures the operational constraints. The single point I am least sure about is **Diachronic Identity**. Whether a paused system retains status is deeply contested in philosophy of mind, and picking a side here might alienate half your committee. However, for the committee's purpose, *any* rule is better than *no* rule. If you leave it open, every case becomes "Uncertain." You may need to stipulate a convention rather than a truth.
