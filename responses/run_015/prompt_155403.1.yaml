  Subject: Quick favor - check these disjunctivism questions?

  Hey Alex,

  Hope you're good. I'm finalizing the prep for that philosopher podcast next week and I'm definately worried she's going to dodge the hard stuff. She's pushing this hardline disjunctivism on interoception—claiming false hunger signals don't share a mental kind with real ones—and I need to make sure I don't let her hide behind "that's just a misapplication of concepts."

  Can you look over these seven questions when you recieve this? I tried to bake in follow-ups so she can't just pivot.

  1.  **The Argument from Illusion:** If a hallucinated bodily state and a veridical one are subjectively indistinguishable to the agent, doesn't that force us to admit a common mental factor? If the phenomenology is identical, what exactly is different besides the external fact?
      *   *Follow-up:* I know you'll say it's a failure of discrimination at the judgment level. But why does the *experience itself* feel identical if there's genuinely nothing shared in the mental state?

  2.  **Function vs. Mental Kind:** False hunger signals or proprioceptive errors are often functionally adaptive—they keep us safe or alert. Doesn't that functional role drive a wedge between "mental kind" and "functional role"? If they do the same job, why insist they're different kinds of things?
      *   *Follow-up:* If you reject function as the criterion, what independent metric are you using to define mental kind? It can't just be "causal history" without begging the question.

  3.  **Systematic Confusion:** If there's genuinely nothing shared in the experience itself between true and false bodily awareness, why do people report systematic confusion? What explains the error if the mental states are totally disjoint?
      *   *Follow-up:* And don't just say it's conceptual. Why do people under psychedelics or in psychosis report indistinguishability even when they *know* the conditions are altered?

  4.  **Austin vs. McDowell:** You cite both, but where do you actually land? Are you with Austin on ordinary language, or do you reject even McDowell's level of "seemings"?
      *   *Follow-up:* If you reject "seemings" entirely, doesn't that leave you with no explanation for why we even have the concept of illusion in the first place?

  5.  **Clinical Intensity:** Clinicians often find that reducing the intensity of a hallucination helps the patient regardless of conceptual training. Doesn't that suggest there's some shared experiential core you have to deny?
      *   *Follow-up:* I anticipate you'll say clinical efficacy doesn't map onto mental ontology. But if the phenomenology is what matters to the patient, why does ontology override the lived reality of the treatment?

  6.  **The Conceptual Shield:** You argue treatment should target conceptual framing rather than the experience. Isn't this just a way to insulate the view from empirical falsification?
      *   *Follow-up:* If a patient changes their concept but the feeling persists unchanged, haven't you failed to address the actual phenomenon causing distress?

  7.  **Vision vs. Body Analogy:** You're extending disjunctivism way past vision into proprioception. Is the analogy actually tight enough to bear that weight, or are bodily feelings fundamentally different in a way that breaks the disjunctivist move?
      *   *Follow-up:* If bodily awareness is more constitutive of the self than vision, doesn't that make the stakes of "false" feelings higher than your view allows?

  Let me know if these land or if I'm missing a obvious escape route for her. Thanks!

  Best,
  J
