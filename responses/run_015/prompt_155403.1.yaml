al training, so doesn't that suggest there's some shared experiential core she has to deny? And include the follow-up for her likely deflection that clinical efficacy doesn't map onto mental ontology. Write it casually, like I'm emailing a friend for help, with a typo or two — maybe "definately" or "recieve". No generic opener like "what drew you to philosophy".
