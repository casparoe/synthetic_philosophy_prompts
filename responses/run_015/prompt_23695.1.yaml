  2.  **Deconstruct the Core Debate:**
      *   *Etiological Account (Millikan, Neander, etc.):* Function = What the trait was *selected for* in the past. (Historical/Teleological).
      *   *Causal-Role Account (Cummins, etc.):* Function = What the trait *currently does* that contributes to the system's capacity. (Ahistorical/Dispositional).
      *   *The Crux:* The "Spandrel" or "Exaptation" case. A heart pumps blood (selected for) but also makes a thumping sound (not selected for). Causal-Role says both are functions. Etiological says only pumping is a function.
      *   *The User's specific angle:* Why is the Etiological restriction *good*? Because biology needs to distinguish between "why this is here" and "what this is doing now." It preserves the normativity of function (malfunction).

  3.  **Outline the Argument:**
      *   **Introduction:** Define the two accounts. State the thesis: The Etiological account is superior because it preserves the explanatory link between function and existence, and maintains the normative dimension of malfunction, which the Causal-Role account dilutes.
      *   **Point 1: The Explanatory Power of Function.** Function claims explain *presence*. If a trait is there *because* it does X, X is its function. If it does Y but wasn't selected for Y, Y doesn't explain its presence. The Causal-Role account conflates effect with reason for being.
      *   **Point 2: The Normativity/Malfunction Argument.** Functions set a standard. A heart *ought* to pump blood. If it doesn't, it's broken. A heart *ought not* necessarily to make a thumping sound (it's just a side effect). Causal-Role struggles to distinguish malfunction from mere variation in causal output. Etiological handles this naturally.
      *   **Point 3: Addressing the "New Environment/Exaptation" Case.** (The user's specific interest). When a trait takes on a new role (e.g., feathers for warmth -> flight), calling the new role a "function" prematurely obscures the evolutionary process. It's an *effect* first, a *function* only after selection acts. Denying immediate function status tracks the biological reality of selection.
      *   **Point 4: Addressing Objections.**
          *   *Objection 1: Environmental Change.* (Does a heart lose function in a vacuum?). Response: Function is tied to the *selected environment*, but we attribute function based on design, not current utility. A heart in a vat still has the function of pumping.
          *   *Objection 2: Epistemic Access.* (We don't know history). Response: This is an epistemic problem, not an ontological one. Just because we can't *know* the history doesn't mean the history didn't determine the function. Science infers history; it doesn't vanish because it's hard to see.
      *   **Conclusion:** Summarize. The Etiological account aligns better with biological practice (explanation and normativity).

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Keep it punchy. Define Selected Effects (SE) vs. Causal Role (CR). Thesis: SE is better because it captures the *teleological* nature of biology without mysticism.
      *   *The "Spandrel" Argument:* Use the classic heart example. Pumping vs. Thumping. CR says both are functions. SE says only pumping. Why SE is right: Pumping explains why hearts exist. Thumping doesn't. If we call thumping a function, we lose the ability to say *why* the organ is there.
      *   *The Malfunction Point:* This is crucial. If function is just "what it does," then everything it does is functional. Then nothing can malfunction. If a heart stops pumping but keeps thumping, CR might say it's still functioning (thumping). SE says it's malfunctioning. Biology needs "malfunction" to make sense of disease and error.
      *   *The Exaptation/New Role Point:* (User's specific request). Feathers for warmth used for display. CR says display is immediately a function. SE says it's an effect. Why SE is better: It distinguishes between *opportunistic utility* and *evolutionary purpose*. This matters for predicting stability. If it's not selected for yet, it might disappear. Calling it a function prematurely implies stability it doesn't have.
      *   *Objections:*
          *   *Environment:* If the environment changes, does function vanish? No, because the *history* remains. The trait was *designed* (by selection) for X. It retains that identity even if currently useless. Analogy: A screwdriver in a world without screws is still a screwdriver.
