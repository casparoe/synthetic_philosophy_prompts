answer: |-
  Here is the breakdown of how Dennett and Caruso handle the intuition gap between crimes of passion and calculated fraud, tracking the mechanics of their arguments and where they stumble.

  ### 1. Dennett: Where Reactive Attitudes Survive
  Dennett is a compatibilist. He believes determinism is true, but that "free will" is not a magical exemption from causality; it is a specific set of cognitive capacities (control, deliberation, reasons-responsiveness). For Dennett, moral responsibility is about **evitability**. Could the agent have avoided the outcome if they had chosen differently, given their cognitive machinery?

  **The Fraudster:**
  Dennett's machinery keeps reactive attitudes (resentment, blame, indignation) fully online here.
  *   **The Mechanism:** The fraudster demonstrates high **reasons-responsiveness**. They planned, they weighed risks, they suppressed moral qualms for gain. Their deliberative engine was running hot.
  *   **Why Punishment Fits:** Because the fraudster's action flowed through their rational control systems, they are the proper target of reactive attitudes. Blame works here because it is a signal the fraudster is equipped to process. Punishment isn't just containment; it's a moral price tag. Dennett argues we *should* feel okay locking them up because they had the capacity to do otherwise *in the sense that matters*: they could have responded to the moral reason "do not steal."
  *   **The Asymmetry:** The fraudster is "more free" in the compatibilist sense because their actions were more tightly coupled with their higher-order volitions (what they want to want).

  **The Crime of Passion:**
  Dennett's machinery dampens reactive attitudes here, but doesn't necessarily kill them.
  *   **The Mechanism:** In a crime of passion, the agent's deliberative machinery is temporarily hijacked by high-arousal emotion. The link between "moral reason" and "action" is severed or bypassed.
  *   **Why Hesitation?** We hesitate because the agent's **control variance** is low. They were less reasons-responsive in that moment. Blaming them is less useful (they weren't listening to reason) and less fair (their control system was compromised).
  *   **The Survival of Responsibility:** Dennett doesn't let them off the hook entirely. If the passion was foreseeable (e.g., you know you have a temper and you put yourself in the situation), responsibility creeps back in. But the immediate reactive attitude is blunted because the "control condition" was degraded.

  **Summary for Dennett:** The asymmetry is real and moral. The fraudster *deserves* more blame because they exercised more of the relevant control capacities.

  ### 2. Caruso: Where Basic Desert Collapses
  Caruso is a free will skeptic (hard incompatibilist). He argues that because our actions are ultimately the result of factors we did not choose (genetics, environment, luck), **basic desert** is impossible. No one ever *truly* deserves punishment in the retributive sense.

  **The Collapse:**
  For Caruso, the fundamental moral distinction between the fraudster and the passion criminal evaporates.
  *   **The Mechanism:** Both agents are products of causal chains they did not initiate. The fraudster's "calculation" is just as determined as the passion criminal's "explosion." The fraudster didn't *create* their own capacity for calculation; they were lucky to have a brain that supports cold executive function.
  *   **The Result:** Neither *deserves* to suffer. To punish the fraudster because they "earned it" is morally illegitimate, akin to punishing someone for having a bad liver.

  **The Re-emergence of Asymmetry (The Quarantine Model):**
  Caruso doesn't abolish punishment; he abolishes *retributive* punishment. He replaces it with a public health/quarantine model.
  *   **The Fraudster:** We lock them up not because they are bad, but because they are **dangerous**. A calculated fraudster shows a pattern of behavior that suggests high recidivism risk. They are rational actors, so deterrence (changing the cost-benefit analysis) might actually work on them.
  *   **The Crime of Passion:** We hesitate to lock them up because they may pose a lower long-term risk. They aren't "predators"; they are "broken." They need rehabilitation or therapy, not incarceration.
  *   **The Difference:** For Dennett, the difference is *backward-looking* (what did you do?). For Caruso, the difference is entirely *forward-looking* (what will you do?).

  **Summary for Caruso:** The asymmetry is pragmatic, not moral. We treat the fraudster harsher because they are a higher risk to society, not because they are more blameworthy.

  ### 3. Which Account Explains the Intuition Better?
  The intuition you described is that we feel **okay** locking up the fraudster but **hesitate** with the passion criminal. This is a moral feeling, not just a safety calculation.

  **Dennett Wins on Phenomenology:**
  Dennett does more work explaining why we feel *okay* about it. Our intuition is steeped in retributivism—we feel the fraudster *owed* a debt. Dennett validates this feeling by redefining desert in terms of social agency. He explains why the fraudster feels like a proper target of anger: they violated the social contract using the very tools (reason) the contract relies on. He captures the *satisfaction* of justice.

  **Caruso Wins on Consistency, Loses on Feeling:**
  Caruso explains the hesitation on the passion case well (they couldn't help it), but he struggles to explain why we feel *okay* punishing the fraudster without smuggling in desert. If the fraudster didn't choose their calculating brain, why does locking them up feel "just" rather than just "necessary"? Caruso has to tell us our feeling of "okayness" is largely an illusion or needs to be retrained into a public health mindset. He explains the *policy* asymmetry, but he fails to explain the *moral* asymmetry that drives our gut reaction.

  ### 4. Blind Spots: Where Both Miss the Asymmetry
  There are spots where both theories gloss over the messiness of the passion/fraud divide.

  **1. The Luck of Control (The Ultimate Blind Spot):**
  Both theories rely on the idea that the fraudster had "more control." Caruso admits this is luck, but Dennett treats it as a sufficient basis for responsibility. Both miss that the *capacity* for cold calculation is itself a biological lottery. A sociopath might find fraud easy (low emotional friction), while a neurotypical person finds it hard. If the fraudster found it easy because of a neurological quirk, Dennett's "reasons-responsiveness" looks a lot like Caruso's "luck." Both theories struggle to justify why being *better* at calculating crime makes you *more* responsible rather than just more dangerous.

  **2. The Blur of Psychology:**
  Both theories assume a clean split between "passion" (uncontrolled) and "fraud" (controlled). Modern psychology suggests this is often false.
  *   **Calculated Passion:** Some crimes of passion are nurtured over time (stalking, simmering jealousy). Dennett might over-punish this as "passion," while Caruso might under-estimate the risk.
  *   **Impulsive Fraud:** Some fraud is opportunistic and impulsive, not calculated.
  *   **The Miss:** Both philosophers treat the *type* of crime as a proxy for the *state of mind*. But the legal categories (fraud vs. manslaughter) don't always map perfectly onto the cognitive reality (high control vs. low control). Both theories risk justifying punishment based on the *label* of the crime rather than the actual cognitive state of the offender at the time.

  **3. The Social Function of "Desert":**
  Dennett says reactive attitudes are useful tools. Caruso says they are harmful illusions. Both miss a middle ground: perhaps the intuition that the fraudster "deserves" it is a heuristic for **trust repair**. We punish the fraudster severely not just to deter them, but to signal to the victims that the community values their trust enough to inflict pain on the violator. Neither Dennett's "evitability" nor Caruso's "quarantine" fully captures the *expressive* function of punishment that validates the victim's suffering, which is often the real source of the intuition that the fraudster must be punished harder.

  ### Bottom Line
  Dennett preserves the distinction by saying the fraudster **could have done otherwise** (in the only sense that matters), so your anger is justified. Caruso collapses the distinction by saying neither **could have done otherwise** (ultimately), so your anger is unjustified, even if the prison term is necessary.

  If you want to know why you *feel* the asymmetry, Dennett is the better guide. If you want to know if that feeling is *metaphysically coherent*, Caruso is the better guide. But both stumble when the "calculated" mind is just as much a product of luck as the "passionate" one.
