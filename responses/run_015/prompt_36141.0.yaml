      *   *Let's go with the "Fiscal Legitimacy" thesis.* The government believes it lacks the moral license to *tax* behavior, but retains the license to *shape* behavior through standards. The money must stay in the private sector (manufacturers, builders) rather than go to the state.
      *   *Wait, the "Deontological" angle is compelling.* The public campaign said "immoral to buy the right to pollute." That sounds deontological. But the policy is consequentialist (cost-benefit).
