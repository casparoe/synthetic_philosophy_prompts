answer: |-
  The legal practices you describe do not rest on a single, coherent theory of emotion. They rest on a pragmatic hybrid that shifts its theoretical commitments depending on what work the law needs to do at that specific moment. The doctrine is not muddled because you have failed to find the unifying principle; it is muddled because the law requires emotion to be three incompatible things simultaneously to serve three different functions: excusing, evaluating, and correcting.

  Here is the reconstruction of that implicit theory, followed by the counterfactuals you requested.

  ### I. The Implicit Theory: A Functional Hybrid

  The law treats emotion as a **temporary suspension of agency** when granting mitigation, as a **claim about the world** when testing for reasonableness, and as a **modifiable habit** when sentencing.

  **1. Emotion as Bodily Agitation (The Storm)**
  *   **Practices supported:** The cooling-off rule; the distinction between words and blows; the "pause" for contracts and strikes.
  *   **The Commitment:** This view presupposes that emotion is a physiological disturbance that interferes with reason. Like a fever or a intoxicant, it has a onset, a peak, and a decay.
  *   **Why it fits:** The cooling-off rule only makes sense if time acts as a solvent. If rage is a judgment that "I have been wronged," waiting three hours does not necessarily make the judgment false. But if rage is a surge of adrenaline, time allows metabolism to restore baseline. The rule that driving across town to buy a weapon kills the mitigation presupposes that the *act* of deliberation proves the *state* of agitation has ended. It assumes agency and passion are mutually exclusive: if you are planning, you are not raging.

  **2. Emotion as Evaluative Judgment (The Appraisal)**
  *   **Practices supported:** The "reasonable person" test; the "justifiable sense of being wronged"; the cumulative provocation rule.
  *   **The Commitment:** This view presupposes that emotions contain propositions. To be angry is to judge that "a wrong has occurred." Therefore, emotions can be correct or incorrect, reasonable or unreasonable.
  *   **Why it fits:** You cannot ask if a "feeling" is reasonable; you can only ask if a *judgment* is reasonable. The cumulative provocation rule (the "last straw") relies on this. A single trivial trigger cannot cause a physiological storm sufficient to overwhelm a man. But a trivial trigger *can* validate a judgment that "this pattern of abuse is intolerable." The law allows the history in because it treats the emotion as an assessment of a narrative, not just a reaction to a stimulus.

  **3. Emotion as Modifiable Disposition (The Habit)**
  *   **Practices supported:** Anger-management courses; the discounting of unexpressed remorse; the requirement that remorse show in action.
  *   **The Commitment:** This view presupposes that emotions are skills or character traits that can be trained. It assumes the agent has authority over their emotional life and can be held responsible for failing to cultivate better ones.
  *   **Why it fits:** If emotion were purely a storm (Theory 1), ordering anger management would be like ordering a diabetic to stop producing insulin. If it were purely a judgment (Theory 2), management would be purely intellectual debate. The fact that the law mandates *courses* implies emotion is a behavioral pattern that can be rewired through practice. Similarly, remorse counts only when performed because the law views emotional states as social facts; an internal feeling that does not alter behavior is legally inert.

  **The Inconsistency and Its Resolution**
  You asked if the pattern is truly inconsistent: *Does the mitigation have to treat emotion as an involuntary storm given that the system trains offenders out of their anger?*
  Yes, it is inconsistent. It treats the defendant as a victim of their biology at the moment of the crime (to excuse them) and as the master of their psychology at the moment of sentencing (to punish/rehabilitate them).
  The law resolves this not logically, but **temporally**.
  *   *Then (The Crime):* You were not yourself. The storm displaced your agency. (Theory 1)
  *   *Now (The Trial/Sentence):* You are yourself. You must account for the storm and learn to weather it. (Theory 3)
  *   *Throughout:* We must decide if the storm was one a citizen is allowed to have. (Theory 2)

  **Underdetermination**
  There are areas where the practices do not force a choice between theories.
  *   **Words vs. Blows:** This fits Theory 1 (a blow causes physical shock/agitation; words do not). But it also fits Theory 2 (a blow is an objective wrong; words are subjective). The law does not need to decide *why* words are insufficient, only *that* they are.
  *   **Remorse:** Discounting a counsel-read apology fits Theory 3 (remorse is a habit of character, not a script). But it also fits Theory 1 (remorse is a physiological state that cannot be faked by a lawyer). A character could argue either point without contradicting the rule.

  ---

  ### II. The Counterfactuals: Strict Adoption

  If your legal system were to purge the hybrid and adopt one theory strictly, the practices would fracture.

  **1. Strict Theory: Emotion as Bodily Agitation**
  *   **The Core:** Emotion is a non-cognitive physiological event. It has no truth value.
  *   **What Survives:** The cooling-off rule becomes paramount. It is the only rule that measures physiology. The "pause" for contracts remains valid.
  *   **What Collapses:** The "reasonable person" test becomes incoherent. You cannot ask if a heartbeat is reasonable. The "justifiable sense of being wronged" vanishes; if the defendant was physiologically overwhelmed, the cause does not matter. Anger management becomes cruel or medical; you cannot "manage" a seizure, you treat it.
  *   **What Replaces It:** Mitigation becomes a medical defense. Expert testimony on heart rate, cortisol, and adrenaline replaces jury intuition. The "cooling off" period is not a fixed time (e.g., one hour) but a biological metric (return to baseline). A defendant who remains enraged for days is *more* mitigated, not less, because their pathology is more severe.
  *   **The Cooling-Off Rule:** On this view, the rule is not about "calming down" morally, but about the half-life of a chemical. If the rage persists, the mitigation holds *longer*, not shorter.

  **2. Strict Theory: Emotion as Evaluative Judgment**
  *   **The Core:** Emotion is a claim about value. Anger is the judgment "I have been wronged."
  *   **What Survives:** The "reasonable person" and "justifiable wrong" tests become the *only* tests. The cumulative provocation rule is strengthened; the narrative of wrongs is all that matters.
  *   **What Collapses:** The cooling-off rule becomes unjust. If I judge that you murdered my brother, my anger is justified today, tomorrow, and in a year. Time does not make a true judgment false. To deny mitigation because the defendant "had time to think" is to punish them for holding a consistent moral view. Anger management becomes re-education; the state is correcting "false beliefs."
  *   **What Replaces It:** Mitigation merges with Justification. If the anger was reasonable, the killing was closer to self-defense. If the anger was unreasonable, it is murder. There is no middle ground of "passion."
  *   **The Cooling-Off Rule:** This rule would have to be abolished or inverted. A "cooling off" period would imply the defendant *abandoned* their judgment. If they killed after a week, they are more culpable (premeditated judgment) not less (passion).

  **3. Strict Theory: Emotion as Perception of Value (Concern-Based Construal)**
  *   **The Core:** Emotion is a way of seeing the world, like a visual perception but of value. It is not a judgment (which is deliberate) nor a storm (which is blind). It is an appearance. "He looked dangerous."
  *   **What Survives:** The cumulative provocation rule fits best here. The "last straw" changes the *appearance* of the situation. Remorse counts because it is a new perception of the victim's value.
  *   **What Collapses:** The "Words vs. Blows" distinction weakens. Words can alter the appearance of a situation as much as blows. The cooling-off rule is problematic; a perceptual distortion can last a lifetime (a grudge).
  *   **What Replaces It:** The focus shifts to *veridicality*. Was the emotional perception a hallucination? The "reasonable person" test becomes the "normal perception" test. Did the world actually look that way to a normal observer?
  *   **The Cooling-Off Rule:** It becomes a rule about *attention*. Did the defendant have time to look again? If they killed immediately, they acted on the first impression. If they waited, they had time to check the perception. Mitigation applies only if the perception was fixed and unshakeable.

  ---

  ### III. The Invented Rule: The Object of Anger

  *The Rule: Mitigation is unavailable unless the jury finds the defendant's anger was about the thing he says it was about. (No displaced anger; no narcissistic humiliation.)*

  **1. Which Theory is Legislated?**
  This rule secretly legislates **Emotion as Evaluative Judgment (Theory 2)**, specifically requiring **Intentionality**.
  *   **Why:** A bodily storm (Theory 1) has a *cause*, not an *object*. If a bomb goes off and I am agitated, my agitation is caused by the bomb, but it isn't "about" the bomb in a semantic sense. If I am humiliated, my agitation is about *me*. This rule demands that the emotion be *directed outward* at a specific wrong. It requires the anger to have a propositional content: "I am angry *that you did X*," not "I am angry *because I feel small*."
  *   **Coherence:** It is coherent within Theory 2. It forces the defendant to claim their anger was a response to justice, not ego. It aligns with the "justifiable sense of being wronged" practice. However, it creates tension with Theory 1 (Agitation). A physiological storm *can* be displaced (kicking the dog because you were fired). By ruling this out, the law admits that physiology is not enough; the *logic* of the emotion must hold.

  **2. Cross-Examination Under Each View**

  **View A: Bodily Agitation (The Defense tries to use this; The Prosecution attacks with the Invented Rule)**
  *   *Defense:* "Isn't it true your client's heart rate was 180? That he was shaking? That he was in a blind fury?"
  *   *Prosecution (using your rule):* "Doctor, does the adrenaline tell you *who* he was angry at? Does the shaking prove he was angry at the deceased, or angry at himself? If he killed the wrong man in that fog, is that the same storm?"
  *   *Result:* The rule breaks the Agitation defense. It shows that a storm without a target is just violence, not passion.

  **View B: Evaluative Judgment (The Prosecution's natural home)**
  *   *Prosecution:* "You say you were angry. What was the judgment you were making? Was it 'He wronged me' or 'He made me look weak'?"
  *   *Defendant:* "He insulted me."
  *   *Prosecution:* "So the judgment was about your reputation, not his conduct? If he had insulted you in private, where no one saw, would you have been angry?"
  *   *Defendant:* "No."
  *   *Prosecution:* "Then your anger wasn't about the wrong. It was about the audience. Under our law, that is vanity, not passion. The mitigation fails."
  *   *Result:* This is the intended use of the rule. It dissects the *content* of the anger to find it selfish rather than moral.

  **View C: Perception of Value (The Nuanced Defense)**
  *   *Defense:* "When he stood over him, what did you see? Did you see a man, or did you see a threat?"
  *   *Defendant:* "I saw a monster."
  *   *Defense:* "And this anger you felt, was it a feeling in your chest, or was it a recognition of what he was?"
  *   *Defendant:* "I saw what he was."
  *   *Prosecution (using your rule):* "But you admitted earlier you thought he was laughing at you. If he hadn't laughed, would he still be a monster? Or did the monster appear only when your pride was touched?"
  *   *Result:* This cross-examination tests the *veridicality* of the perception. The rule forces the defendant to prove the "monster" was really there, not just a projection of their own humiliation.

  ### Summary for your Draft
  Your legal system is not confused; it is **schizophrenic by design**. It needs the defendant to be a victim of biology to be merciful, but a master of judgment to be moral. Your invented rule is the lever that forces the switch. It stops the defendant from hiding behind the "storm" (Agitation) and forces them to stand behind the "reason" (Judgment).

  If you want your characters to disagree:
  *   **The Traditionalist Judge** should argue from **Agitation**: "The law knows the blood boils. It does not dissect the mind." (He opposes your invented rule).
  *   **The Reformist Prosecutor** should argue from **Judgment**: "Anger is a claim. If the claim is selfish, it is not passion, it is greed." (He supports your invented rule).
  *   **The Defense Counsel** should argue from **Perception**: "He did not judge; he saw. You cannot ask a man to reason when the world looks like fire." (He tries to bypass your invented rule).

  The inconsistency you feel is the friction between these three voices. It is the correct texture for a courtroom.
