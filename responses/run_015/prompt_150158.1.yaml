      *   **Goal:** Reconstruct the implicit theory of emotion underlying a specific cluster of legal practices in courtroom fiction.
      *   **Input Data:** A set of legal rules/practices regarding provocation, heat of passion, remorse, sentencing, contract cancellation, strike pauses, etc. Plus a specific invented rule about the *object* of anger.
      *   **Tasks:**
          1.  Identify the implicit theory of emotion (worked out, not just named).
          2.  Map specific practices to specific theoretical commitments (bodily agitation vs. evaluative judgment vs. perception of value).
          3.  Identify underdetermination (where rival theories yield the same rules).
          4.  Address apparent inconsistencies (mitigation vs. anger management vs. reasonable person).
          5.  **Counterfactual Analysis:** For each of the three theories (Agitation, Judgment, Perception), describe how practice would change if that theory were strictly adopted.
          6.  **Analyze the Invented Rule:** Determine which theory it legislates, its coherence, and sketch cross-examination under each view.
      *   **Constraints:** No authorities/names/reading lists. Focus on argument and concepts. Tone should be analytical, precise, and suitable for a writer seeking philosophical depth.

  2.  **Deconstruct the Input Practices:**
      *   *Heat of Passion/Cooling Off:* Mitigation requires lack of time to cool. Driving/buying weapon/waiting kills mitigation even if rage persists. -> Suggests emotion is transient, bodily, displaced by reason.
      *   *Reasonable Person/Justifiable Wrong:* Provocation must move a "reasonable person." Some jurisdictions ask if the sense of being wronged was "justifiable." -> Suggests emotion is cognitive, evaluative, subject to norms of rationality.
      *   *Cumulative Provocation:* Small provocations + trivial trigger = mitigation. -> Suggests emotion is a pressure vessel or a narrative assessment, not just immediate reaction.
      *   *Words vs. Blows:* Words traditionally insufficient; blows sufficient. -> Suggests physical threat/agitation is key, or perhaps social norms of honor.
      *   *Remorse/Apology:* Remorse counts; counsel-read apology doesn't. Assertion of fear/grief worthless unless shown in action. -> Suggests emotion must be authentic, embodied, performative.
      *   *Anger Management:* Probation includes courses. Disposition to anger is manageable/accountable. -> Suggests emotion is a habit/skill/character trait, subject to will.
      *   *Cooling Off Periods (Contracts/Strikes):* Agitation is temporary; reflection dissolves it. -> Suggests emotion interferes with true will/reason.

  3.  **Synthesize the Implicit Theory (The "Doctrine's Muddle"):**
      *   The law doesn't have *one* theory. It has a *functional* hybrid.
      *   *Core Tension:* Is passion an *excuse* (I wasn't myself) or a *justification* (I had reason)?
      *   *The "Official" Theory:* Emotion is a temporary suspension of rational agency (the "storm"). This explains cooling-off periods.
      *   *The "Hidden" Theory:* Emotion is a judgment of value (the "appraisal"). This explains the "reasonable person" and "justifiable wrong" tests.
      *   *The "Correctional" Theory:* Emotion is a modifiable disposition (the "habit"). This explains anger management.
      *   *Resolution of Inconsistency:* It's not logically consistent, but it is *pragmatically* consistent. It treats emotion as a storm *when excusing*, a judgment *when evaluating worthiness*, and a habit *when punishing/rehabilitating*. The inconsistency is the point: it allows the law to be merciful without endorsing violence.

  4.  **Drafting Section 1: The Implicit Theory:**
      *   Need to articulate the hybrid nature.
      *   *Agitation:* Explains the "cooling off" rule. Emotion is a fever that breaks.
      *   *Appraisal:* Explains the "reasonable person" rule. Emotion is a claim about the world that can be true/false.
      *   *Perception/Concern:* Explains the "cumulative provocation." Emotion reveals what matters to the agent.
      *   *Underdetermination:* The "Words vs. Blows" rule fits both Agitation (physical shock) and Appraisal (objective threat). The "Remorse" rule fits both Agitation (physiological sign) and Perception (recognition of value violation).
      *   *The Inconsistency:* Is it real? Yes. The law says "You weren't responsible (heat of passion)" but then says "You need to learn control (anger management)." The resolution is temporal: *Then* you were compromised; *Now* you must be responsible.

  5.  **Drafting Section 2: The Counterfactuals (Strict Adoption):**
      *   *Theory A: Emotion as Bodily Agitation (The Storm).*
          *   *Survives:* Cooling-off rules (physiology calms).
          *   *Collapses:* "Reasonable person" test (feelings aren't reasonable/unreasonable). "Justifiable wrong" (pain is pain). Anger management (you can't reason away a fever).
          *   *Replacement:* Medical evidence of arousal. Mitigation based on pulse/adrenaline, not time.
      *   *Theory B: Emotion as Evaluative Judgment (The Appraisal).*
          *   *Survives:* Reasonable person test. Justifiable wrong. Anger management (retraining thoughts).
          *   *Collapses:* Cooling-off rule (if the judgment stands, time doesn't matter). If I'm right to be angry, I'm right to be angry in an hour.
          *   *Replacement:* "Reasonable Anger" defense. If the judgment was correct, it's justification, not mitigation. If incorrect, no mitigation.
      *   *Theory C: Emotion as Perception of Value (The Construal).*
          *   *Survives:* Cumulative provocation (narrative context shapes perception). Remorse (seeing the value of the victim now).
          *   *Collapses:* Strict cooling-off (perception can remain distorted). Words vs. Blows (words can wound value just as much).
          *   *Replacement:* Focus on the "truth" of the emotional perception. Did the world look that way to him? Was it a hallucination of value?

  6.  **Drafting Section 3: The Invented Rule (Object of Anger):**
      *   *Rule:* Mitigation unavailable unless anger was about the *thing* he says it was about (no displaced anger, no narcissistic humiliation).
      *   *Theory Legislated:* This leans heavily into **Emotion as Evaluative Judgment/Perception**. It demands *intentionality* (aboutness). A bodily storm doesn't have an "object" in a philosophical sense, it just has a cause. A judgment *must* be about something.
      *   *Coherence:* It forces the defendant to claim "I judged *this* act as wrong," not "I felt bad." It closes the loop on the "Reasonable Person" test.
      *   *Cross-Examination:*
          *   *Agitation View:* "Did your blood boil?" (Irrelevant to object). "Did you see red?"
          *   *Judgment View:* "What proposition were you affirming?" "Did you kill him because he wronged you, or because you looked small?"
          *   *Perception View:* "What did you see in that moment?" "Did you see a threat or a mirror?"

  7.  **Refining and Polishing:**
      *   *Tone:* Keep it analytical but accessible. Avoid jargon where possible, or explain it.
      *   *Check:* Did I answer the specific question about the inconsistency? (Yes, the temporal shift).
      *   *Check:* Did I handle the "underdetermined" parts? (Yes, words vs. blows).
      *   *Check:* Is the invented rule analysis robust? (Need to ensure the distinction between "cause" and "object" is clear).
      *   *Self-Correction on "Perception of Value":* This is close to Judgment but distinct. Judgment is propositional ("He wronged me"). Perception is pre-reflective ("He is threatening"). I need to make sure I distinguish B and C clearly in the counterfactuals. B is about *correctness*, C is about *veridicality/appearance*.
      *   *Refining the Invented Rule:* This rule specifically targets *narcissism* vs. *justice*. It demands the emotion be outwardly directed (at a wrong) rather than inwardly directed (at a self-image). This aligns with the "Justifiable Sense of Being Wronged" practice.

  8.  **Final Review against constraints:**
      *   No names (Aristotle, Nussbaum, etc.).
      *   No citations.
      *   Focus on argument.
      *   Address the "muddle" vs. "doctrine" question.

  9.  (Self-Correction during drafting): Make sure to explicitly address the "cooling off" rule in the Judgment section of the counterfactual. If emotion is a judgment, time doesn't fix it. That's a key insight. Also, ensure the "Anger Management" point is linked to the idea of emotion as a skill/habit.

  10. **Final Polish:** Check the flow. Ensure the transition from the reconstruction to the counterfactuals to the invented rule is smooth. (Proceed to generate output).

