      *   *Joke:* "I spent 40 years writing grant proposals justifying the *purpose* of my research. Schlick says meaning is found in activities that are their own purpose. So I finally told the department head the truth: 'I'm not trying to cure cancer. I'm just fascinated by how these liquids change color.' He cut my funding. Which proves Schlick's other point: society treats life like work, even when you're trying to play."
