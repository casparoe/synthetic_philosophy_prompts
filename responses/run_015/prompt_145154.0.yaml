      *   *Selected Approach:* The realization that the "suffering" was the *justification*, not the *activity*.
      *   "Schlick says suffering enters when you treat an activity as a means to an end, rather than an end in itself. It hit me hard. I spent 40 years thinking the 'work' was the chemistry. But according to Schlick, the chemistry was play—it was autotelic. The actual 'work' was convincing everyone else it had a purpose. So I'm not a retired chemist. I'm a recovered justificationist."

