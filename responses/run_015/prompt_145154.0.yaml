  Here is a option that tries to capture the specific Schlickian nuance of *autotelic* activity versus instrumental labor, while keeping the tone light enough for a meetup:

  "Moritz Schlick argues that suffering arises when we treat life as 'work'—valuing it only as a means to a future end—rather than as 'play,' which is *autotelic*, or an end in itself.

  It hit me like a titration endpoint. I realized I didn't spend 40 years 'working' to find cures. I was actually engaged in high-level autotelic play. The 'cures' were just the alibi I gave the funding committee so they'd let me keep mixing colorful liquids.

  So I'm not really retired. I just lost my subsidy for my hobby."

  ***

  **Why this works for your group:**
  *   **The Distinction:** It hinges on the instrumental value (cures/funding) vs. the intrinsic value (mixing/watching), which is the core of Schlick's argument in *Problems of Ethics*.
  *   **The Persona:** It uses the "retired scientist" angle to show that the *activity* didn't change, only the justification for it did.
  *   **The Terminology:** It drops "autotelic" correctly, signaling to the group that you've done the reading, but doesn't let the jargon kill the punchline.
  *   **No Clichés:** It avoids the vague "life is a game" trope and focuses on the *attitude* toward the activity, which is exactly Schlick's point.
