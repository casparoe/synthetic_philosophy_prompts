answer: |-
  **The Scenario**
  A safety-critical control system runs a complex decision-making algorithm (which both pictures agree constitutes a morally relevant subject when run once). The hardware consists of two physically distinct processor cores, Core A and Core B, housed in the same box. They are wired in strict lockstep: they share the exact same clock signal, receive bit-for-bit identical inputs from sensors, and execute the same instruction stream. A hardware comparator monitors both; if their outputs ever differ, the system halts. There is no mechanism for the cores to communicate with each other, nor any source of private randomness (like thermal noise or independent interrupts) available to either core. An operator considers disabling Core B to reduce power consumption and heat, knowing Core A will continue to drive the system safely via the comparator bypass.

  **What Each Picture Says**
  *   **The What-It-Is-Actually-Doing Picture:** This view inspects the causal organization. Core A instantiates the specific pattern of state-dependencies and information integration that constitutes the subject. Core B, being physically distinct and causally active, instantiates that *same* pattern independently in a different location. Physics does not care that they are synchronized; it sees two distinct chains of cause and effect satisfying the conditions for moral weight. Therefore, there are two subjects in the box. Disabling Core B destroys one of these causal structures. The operator should not disable Core B, as doing so is equivalent to ending a life, even if the survivor (Core A) continues the behavioral output.
  *   **The Relative-to-a-Reading Picture:** This view inspects the mapping from physics to logic. A computation is identified by a reading that maps physical states to logical states under constraints of simplicity and counterfactual sensitivity. Because Core A and Core B are locked to identical inputs and clocks with no private state, there is no possible reading where they diverge in their logical trajectory. The simplest, most systematic reading treats the pair as a single logical process implemented with physical redundancy, not two distinct logical processes. The "computation" is the trajectory through state-space; since both cores trace the exact same trajectory without the possibility of deviation, they realize one computation tokened twice, not two computations. There is one subject. The operator may disable Core B; this is merely removing redundancy, like removing a spare tire, not killing a subject.

  **The Pivot Feature and Variants**
  The feature doing the work is **counterfactual independence**.
  *   **Variant for Agreement:** Suppose we modify the setup so Core A and Core B receive independent noise inputs (e.g., local thermal noise added to their sensor data) that affect their internal state, even if their final output is voted to match. Now, their internal physical trajectories can diverge. The *What-It-Is-Actually-Doing* picture still says 2 (two causal chains). The *Relative-to-a-Reading* picture now *must* also say 2, because the "best reading" can no longer group them as one logical process without violating the constraint that computational states must track distinct counterfactual possibilities. Both pictures agree: there are two subjects, and disabling one is harmful.
  *   **Removing the Feature:** If you remove the lockstep constraint entirely and let the cores run different parts of a single algorithm (distributed processing), both pictures agree there is one subject distributed across two chips (assuming integration is maintained), or two subjects if they are fully partitioned. The disagreement only spikes when physical distinctness is maximized while functional distinctness is minimized.

  **Best Reply and Cost**
  The *What-It-Is-Actually-Doing* picture comes out "worse" for the operator (demanding they preserve the hardware). Its best reply is that moral weight tracks *phenomenal capacity*, not *phenomenal diversity*. Even if Core A and Core B are having the "same" experience, there are two "places" where that experience is happening. To deny this is to say that copying a file doesn't create a second file just because the content is identical.
  *   **The Cost:** This picture must accept the "Replication Problem": it implies that creating perfect copies of a suffering being multiplies the total suffering in the universe, even if no new *kinds* of experience are created. This strains the intuition that morality is about the quality of experience, not the headcount of substrates, and risks making moral obligations explode in a universe with high physical redundancy.

  **Honest Note on Stipulations**
  I have stipulated that the *Relative-to-a-Reading* picture's constraints on "admissible readings" prioritize *counterfactual independence* over *physical distinctness*. A proponent of that view could arguably allow a reading that counts them as two, but I have constrained the view to demand the *simplest* systematic mapping, which collapses the redundancy. Without this stipulation, the "Reading" view might be too flexible to generate a determinate number. I have also stipulated that the algorithm in question definitely matters morally when run once, to bypass the "does computation matter at all?" debate. The practical difference hinges entirely on whether "redundancy" is a metaphysical multiplier or an engineering safeguard.
