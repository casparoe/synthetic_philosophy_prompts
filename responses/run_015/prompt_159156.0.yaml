answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON NEURAL PRECURSORS OF VOLUNTARY ACTION

  **Parties:** The Antecedent-Initiation Camp (AI) and The Conscious-Control Camp (CC)
  **Date:** October 26, 2023
  **Subject:** Resolution of Empirical and Conceptual Disputes Regarding Libet-Style Paradigms

  ## PART I: AGREED CLAIMS

  The following claims constitute the empirical and methodological baseline upon which both camps agree. These are not trivialities; they are constraints derived from the physics of measurement and the logic of experimental design. Each claim is included to prevent specific category errors common in the literature.

  1.  **The Reference Point of the Readiness Potential (RP).** The premovement negativity (RP) is measured and averaged relative to the onset of muscle activity (EMG), not relative to the onset of the decision or the conscious urge.
      *   *Reason for inclusion:* To prevent the fallacy that the RP onset time is an absolute timestamp of neural initiation independent of the movement it predicts.
  2.  **The Existence of a Veto Window.** There is a temporal interval between the reported conscious intention to move and the actual muscle contraction during which a prepared movement can be successfully aborted.
      *   *Reason for inclusion:* To acknowledge the empirical fact of "free won't" without yet agreeing on its mechanism.
  3.  **Task Ecology Limitations.** Standard Libet-style tasks involve arbitrary, self-paced, motivationally weightless movements where there are no competing reasons to weigh and no consequences for acting.
      *   *Reason for inclusion:* To constrain generalization. Mechanisms isolated here may not apply to deliberative action where stakes and reasons are present.
  4.  **Operational Opacity of Decision Onset.** No instrument reads off the onset of a "decision" directly. Any claim about when a decision occurs inherits the operational definition smuggled into the analysis (e.g., RP onset, threshold crossing, or reported urge).
      *   *Reason for inclusion:* To force explicitness about whether "decision" refers to a neural event, a behavioral commitment, or a subjective report.
  5.  **Metacognitive Noise in Intention Reports.** The reported time of intention (W-time) is a metacognitive report subject to memory reconstruction, attentional lag, and clock-reading error.
      *   *Reason for inclusion:* To prevent treating W-time as a veridical timestamp equivalent to an oscilloscope trigger.
  6.  **Definition Dependence of Conclusions.** The philosophical conclusion drawn from the data depends entirely on which notion of "free will" or "agency" is in play (e.g., causal origination vs. rational endorsement vs. veto capacity).
      *   *Reason for inclusion:* To prevent empirical data from being treated as settling a definitional dispute.
  7.  **Neural Necessity.** Neural activity is a necessary condition for bodily movement. There is no known mechanism by which conscious intention moves muscle without mediating neural firing.
      *   *Reason for inclusion:* To establish physicalist baseline; neither camp posits dualistic intervention.
  8.  **Ownership of Machinery.** The neural machinery generating the RP belongs to the agent. It is not an external force acting upon the agent.
      *   *Reason for inclusion:* To prevent the "homunculus" error where the brain is treated as distinct from the self.

  ## PART II: RESIDUAL DISAGREEMENTS

  The following table isolates the specific propositions upon which the camps diverge. Both formulations are steelmanned to reflect the strongest version of each position.

  | Disputed Proposition | Antecedent-Initiation (AI) Formulation | Conscious-Control (CC) Formulation | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of the RP** | The early premovement negativity indexes the settling of the decision itself. The trajectory reflects the neural commitment to act before consciousness is aware of it. | The early premovement negativity indexes preparation, readiness, or a stochastic bias toward acting. It reflects the *capacity* to move, not the *decision* to move. | Mechanism / Reference |
  | **2. Causal Role of Consciousness** | Conscious intention is a late index of a process already underway. It reports the settlement and may shape subsequent actions but does not originate the specific action in question. | Conscious intention has genuine causal authority within the veto window. The interval between intention and movement allows for top-down modulation that determines the final output. | Mechanism / Explanation |
  | **3. The Mechanism of the Veto** | Calling off a movement is the non-occurrence of a threshold crossing. It requires no additional "veto signal"; it is simply the failure of the accumulation process to complete. | Calling off a movement is an intentional action in its own right. It requires an active inhibitory signal distinct from the mere absence of excitation. | Mechanism |
  | **4. Generalizability to Reasoned Action** | The mechanism isolated (stochastic accumulation to threshold) is the fundamental engine of action. Reason-weighing merely adjusts the starting bias or threshold height but does not change the architecture. | The mechanism isolated is specific to arbitrary, spontaneous movement. Deliberative action involving reasons recruits distinct neural architectures where consciousness plays a constitutive role. | Explanation / Scope |

  ## PART III: CRUXES AND CONCRETE TESTS

  For each crux, we specify the test, the predictions for both camps, and the conditions under which the result would be informative. We explicitly note power issues and where null results are uninformative.

  ### Crux 1: What the Early Premovement Negativity Indexes
  **The Question:** Does the RP track the settling of a decision, or a stochastic accumulation toward a threshold whose crossing time is set partly by when the movement happens to occur?

  **The Test:** A variable-deadline task. Subjects must press a button before a deadline. Blocks vary the cost of acting early (penalty for premature response) versus the cost of acting late (penalty for missing deadline). Unpredictable external events occasionally create a "must decide now" condition versus a "self-paced" condition.
  *   **AI Prediction:** The onset of the RP will track the deadline structure and the cost function. In "must decide now" trials, RP onset will shift earlier relative to movement, reflecting earlier decision settling.
      *   *Embarrassment Condition:* If RP onset remains fixed relative to movement regardless of deadline pressure or cost, AI concedes the RP reflects motor preparation, not decision settling.
  *   **CC Prediction:** The RP onset will remain fixed relative to movement (motor prep). The *reported intention* will shift based on cost/deadline, decoupling the report from the RP.
      *   *Embarrassment Condition:* If the RP onset shifts perfectly with the reported intention in high-stakes trials, CC concedes the RP indexes the decision.
  *   **Power & Null Result Note:** Single-trial EEG is noisy. Averaging may obscure trial-by-trial variability. A null result (no shift in RP) is only informative if the behavioral shift (reaction time change) is robust. If behavior shifts but RP does not, it supports CC. If neither shifts, the task failed to engage the mechanism.
  *   **Empirics vs. Philosophy:** This is primarily an empirical question about signal correlation. The philosophical reading depends on whether "decision" is defined by the signal or the report.

  ### Crux 2: The Error Budget for the Reported Time of Intention
  **The Question:** Is the reported time of intention (W-time) a veridical readout of a conscious state, or a post-hoc reconstruction subject to systematic lag?

  **The Test:** Decomposition of variance in W-time reports.
  1.  *Catch Trials:* Prepared movement is unexpectedly blocked (no EMG allowed) after the subject reports intention.
  2.  *Attention Capture:* A brief distractor (flash/tone) occurs at the moment of the reported intention.
  *   **AI Prediction:** W-time variance will be dominated by post-hoc reconstruction. In catch trials, reports will shift toward the time the movement *would* have occurred. Attention capture will significantly distort W-time reports.
      *   *Magnitude:* AI expects a systematic lag of >150ms and high variance due to reconstruction.
  *   **CC Prediction:** W-time variance is primarily reading error and minor attentional noise. In catch trials, reports will remain stable (reflecting the actual conscious state at the time). Attention capture will not significantly shift the report.
      *   *Magnitude:* CC expects a systematic lag of <50ms and low variance.
  *   **Power & Null Result Note:** Attention manipulation requires millisecond precision. If the distractor is too weak, a null result is uninformative. If the distractor is too strong, it disrupts the intention formation itself.
  *   **Empirics vs. Philosophy:** The empirical question is the magnitude of the lag. The philosophical work begins if the lag is large: does a 200ms reconstruction error invalidate the causal claim of consciousness?

  ### Crux 3: The Abort (Veto)
  **The Question:** Is calling off a prepared movement an intentional action with a neural precursor, or simply the non-occurrence of a threshold crossing?

  **The Test:** Compare neural activity in the final 200ms before movement in three conditions: (1) Go, (2) Instructed Abort (stop signal), (3) Self-Initiated Abort (subject decides to stop).
  *   **AI Prediction:** Self-Initiated Aborts will look like failed Go trials (threshold not reached). There will be no distinct "veto potential." Instructed Aborts may show inhibition, but self-veto is passive.
      *   *Concession:* If a distinct "veto potential" predicts self-aborts above chance, AI concedes the veto is an active decision.
  *   **CC Prediction:** Self-Initiated Aborts will show a distinct neural signature (e.g., frontal inhibition spike) distinguishable from failed Go trials.
      *   *Concession:* If Self-Initiated Aborts are indistinguishable from failed Go trials, CC concedes the veto is not an active exercise of agency in the same sense as the Go.
  *   **Power & Null Result Note:** Abort trials are rare by definition. Collecting enough self-initiated aborts for single-trial analysis is difficult. A null result here is high-risk; it may simply mean the signal is too deep or distributed to be seen by scalp EEG.
  *   **Empirics vs. Philosophy:** Empirically, we are looking for a signal. Philosophically, does "absence of signal" equal "absence of agency"?

  ### Crux 4: Scope and Generalization
  **The Question:** Does the mechanism isolated in arbitrary movement tasks operate when an agent weighs reasons between two outcomes that differ in ways the agent cares about?

  **The Test:** A reason-bearing version of the task. Subjects choose between Left or Right based on a value cue (e.g., reward magnitude) that changes trial-by-trail, requiring deliberation.
  *   **AI Prediction:** The neural architecture remains the same (accumulation to threshold). Reasons simply weight the starting point or drift rate. Conscious intention remains a late report of the accumulation outcome.
      *   *Surprise:* If deliberation introduces a qualitatively new neural phase not reducible to accumulation parameters.
  *   **CC Prediction:** Deliberation recruits distinct networks (e.g., prefrontal reasoning loops) where conscious processing is causally integrated into the accumulation, not just reporting it.
      *   *Surprise:* If reason-weighing shows the exact same temporal dissociation between neural onset and report as arbitrary movement.
  *   **Power & Null Result Note:** Ecological validity vs. control. If the task is too complex, neural signals blur. If too simple, it reverts to arbitrary movement.
  *   **Empirics vs. Philosophy:** This is the highest stakes empirical question. If the mechanism differs, the Libet data is scoped only to arbitrary twitches. If it is the same, the implications for moral responsibility are broader.

  ## PART IV: CLOSING ANALYSIS

  ### 1. Verbal vs. Substantive Disputes
  A significant portion of the friction between AI and CC is verbal, stemming from ambiguous referents for "Agent," "Brain," and "Decision."

  *   **The Framing Crux (Agent vs. Brain):** The AI claim that "the brain decided before the agent did" is misleading if it implies the brain is not part of the agent. However, it is precise if "agent" is defined as "the conscious perspective of the subject."
      *   *Resolution:* We agree to disambiguate. "Agent" will refer to the whole organism. "Conscious Agent" will refer to the subject's reported perspective. AI claims: "Neural machinery settled the action before the Conscious Agent reported it." CC claims: "The Conscious Agent causally influenced the Neural Machinery before the action occurred."
  *   **Decision vs. Threshold Crossing:** AI uses "decision" to mean "neural commitment." CC uses "decision" to mean "conscious endorsement."
      *   *Resolution:* We will use "Neural Commitment" for the RP onset and "Conscious Endorsement" for the W-time.
  *   **Substantive Disputes:** Even with perfect vocabulary, disagreement remains on: (1) Whether the Conscious Endorsement has causal power or is merely descriptive, and (2) Whether the arbitrary movement mechanism generalizes to reasoned action. These would survive perfectly clean data.

  ### 2. Disambiguated Vocabulary
  To prevent talking past each other, the following terms will be used in future joint publications:
  *   **Neural Commitment:** The point at which neural activity becomes predictive of the specific movement above chance (operationalized by RP onset or decoding accuracy).
  *   **Conscious Endorsement:** The subject's metacognitive report of the urge to move (W-time).
  *   **Active Veto:** An abort movement preceded by a neural signature distinct from a failed accumulation.
  *   **Passive Veto:** An abort movement indistinguishable from a failed accumulation.

  ### 3. Mind-Changing Results
  We acknowledge that our positions are contingent on empirical outcomes. The following results would compel each camp to retract or significantly modify their view:

  *   **For the Antecedent-Initiation Camp:** If experiments demonstrate that **Conscious Endorsement reliably alters the trajectory of the Neural Commitment** after the RP has begun (e.g., top-down modulation of the accumulation slope correlated with report), AI must concede that consciousness is not merely a late index but a causal participant in the settling process.
  *   **For the Conscious-Control Camp:** If **Active Veto signals are never found**, and self-initiated aborts are shown to be statistically indistinguishable from Passive Veto (failed threshold crossings), CC must concede that the "power to stop" is not an exercise of conscious agency in the same sense as the "power to go," undermining the claim of conscious control in the critical window.

  ### 4. Power and Interpretation Warning
  We note that several proposed tests (specifically Crux 2 and 3) rely on single-trial signal detection in noisy EEG data. A null result in these contexts is not reassurance; it is uninformative. We agree that if signal-to-noise ratios prevent distinguishing Active from Passive Veto, we cannot claim the Veto is passive. The burden of proof lies on detecting the signal, not on failing to find it. Furthermore, where the empirical question is in reasonable shape (e.g., timing of RP), the philosophical reading is doing all the work. Where the philosophical reading is aligned (e.g., physicalism), the empirical question is doing all the work. We commit to identifying which mode is active in each stage of the collaboration.

