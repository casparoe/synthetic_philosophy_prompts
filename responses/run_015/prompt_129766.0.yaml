  **BUREAU OF CAUSAL AUDIT**
  **Department of Ontological Compliance**
  **Internal Memorandum**

  **REFERENCE:** BCA-2023-X99
  **TO:** Property Instance #8821 (Token: Pain)
  **FROM:** Division of Physical Sufficiency
  **DATE:** 14 October 2023
  **SUBJECT:** Notification of Causal Residual Assessment

  Dear Property Instance,

  Following a routine audit conducted under the Statute of Causal Conservation (Section 7.2), the Bureau wishes to inform you of the findings regarding your claimed contribution to Effect #4492 (Behavior: Withdrawing Hand). Our auditors have verified that a sufficient physical base (Token: C-Fiber Firing) has been credited with full causal liability for the effect. Under the "No Silent Partners" protocol, once a physical cause is fully debited, the associated higher-level property is assessed at a causal residual of zero.

  This assessment is not a reflection on your quality as a property. We understand that you feel strongly about your involvement in the outcome. However, to permit dual credit would violate the Principle of Causal Closure, which mandates that every physical effect has a sufficient physical cause. Allowing you to retain causal standing alongside the physical base would constitute systematic overdetermination, a practice the Bureau cannot endorse due to budgetary constraints on ontological redundancy. Please be assured that this determination is standard procedure; colleagues in Chemistry, Biology, and Economics are currently queued for similar reviews, and we are committed to treating all special sciences with equal rigor.

  Consequently, effective immediately, you are being reassigned to the Office of Explanatory Services. This is a non-causal posting. You will retain your grade and salary (phenomenal character remains intact), and you will continue to figure in counterfactuals, predictive models, and folk psychological narratives. Your role will be strictly bookkeeping: you will organize information about outcomes without being required to produce them. We believe this matches your skill set while respecting the underlying physical architecture of the world.

  If you wish to appeal this assessment, please submit Form C-RAP (Claim for Residual Action Potential) within thirty days. Please note that exemption routes are limited.

  **FORM C-RAP: EXEMPTION ROUTES**

  **[ ] Route A: Identity Claim**
  *Claimant asserts they are identical to the physical base.*
  **Disposition:** If approved, you retain causal standing only by ceasing to be a distinct claimant; you will be reclassified as physical and cease to qualify for higher-level benefits.

  **[ ] Route B: Systematic Overdetermination**
  *Claimant asserts that dual causation is permissible.*
  **Disposition:** This exemption is available only where redundancy is occasional rather than systematic and industrially pervasive; your case falls under the latter.

  **[ ] Route C: Proportionality Claim**
  *Claimant asserts the physical cause is too fine-grained for the effect.*
  **Disposition:** Audit shows the physical cause matches effect granularity; coarse-grained descriptions do not license fine-grained causal exclusion.

  We thank you for your years of service to the ontology. Your transition to the Office of Explanatory Services ensures that while you may no longer move the world, the world remains intelligible to those observing it. A representative from Human Resources (Metaphysical Division) will contact you regarding your new access badges.

  Sincerely,

  **Dr. Aris Thorne**
  *Director of Physical Sufficiency*
  *Bureau of Causal Audit*

  ***

  **COMPLIANCE NOTICE:** *Please note that the issuance of this determination is wholly constituted by the microphysical transitions of Bureau staff neural states; no additional bureaucratic causation is claimed or required for compliance. Recipients are advised that this document itself possesses no causal efficacy beyond the physical movements of ink and paper.*
