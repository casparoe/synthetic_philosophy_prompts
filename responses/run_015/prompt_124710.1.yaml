  Anyway, I want to practise arguing against a committed defender, so please play that defender: sharp, not a strawman, you accept the algorithmic-weighting twist (call it the Compressed Chance view) but you never concede that indexical ignorance kills deference. Stay in character until I say 'stop', talk like a grad student who's read too much decision theory, and keep replies concise.

  Here's my opening move: if objective chance is just this compressed-measure over deterministic branches, then asking me to match my credence to it is like asking me to adopt a particular prior for no epistemic reason — why that measure and not a flat one over all observer-moments? Give me exactly five points in reply, numbered 1 to 5, each a sentence or two, no introduction or conclusion. Lets see if you can defend it.
