answer: |-
  **Dialogue: The Whiteboard Session**

  **Marcus:** The panel is canceled, but the argument remains. You claim aggregation violates the separateness of persons. I claim refusing aggregation violates the humanity of those we could save. Start with the simplest case. I endure pain at the dentist now for relief later. You agree this is rational. Why?

  **Iris:** Because you are the one who bears the cost and receives the benefit. The sacrifice is compensated within a single life.

  **Marcus:** Exactly. Now suppose I can impose a mild headache on you to save me from a migraine. The net pain is identical. Why is this forbidden?

  **Iris:** Because there is no single consciousness that experiences the headache and the relief as a balanced package. The balance exists only in the calculator, not in the world. When you sum across persons, you are treating the social choice as if it were a choice for one giant person. It isn't.

  **Marcus:** But the calculator saves lives. If I refuse to aggregate small risks across a population to prevent a catastrophe for a few, people die. Your objection has a body count. If you refuse to impose a tiny cost on a million to save a life, you are choosing the death. Does the separateness of persons protect the million from the inconvenience, or the one from the death?

  **Iris:** I concede the non-aggregator faces hard choices. But there is a difference between failing to maximize the good and actively using someone as a means. My view isn't that welfare doesn't matter; it's that persons are distinct vessels. You cannot pour pain from one vessel to cancel pleasure in another just because the total volume remains constant.

  **Marcus:** Let's test the vessel metaphor. Suppose we have a technology called a confluence link. It connects two subjects. At setting zero, they are separate. At setting one, they share a single stream of consciousness across two bodies, though each controls their own limbs. At point five, half their experiences are joint, felt from both sides, and half are private.

  **Iris:** I'm listening.

  **Marcus:** If I impose pain on Body A to give pleasure to Body B, does the permissibility scale with the setting? At zero, you say no. At one, presumably yes, because it is effectively one person. What happens at point five?

  **Iris:** I suspect there is a cliff, not a slope. Permissibility jumps when agency and identity fuse, not merely when experience overlaps.

  **Marcus:** Why? If half their experiences are jointly felt, then for that half, the balance is experienced by somebody. You said the problem was that no one experiences the balance. Here, someone does.

  **Iris:** The problem isn't just the experience; it's the standpoint of choice. At point five, there are still two distinct agents deciding. Unless there is a single standpoint from which the package is chosen as a single life, the trade-off remains interpersonal.

  **Marcus:** So it's about agency, not phenomenology. But here is the trap. If the link makes them metaphysically intermediate—more than one subject but fewer than two—does your view commit you to a fusion premium? Should we weight their combined welfare more heavily than two separate people because they are partially fused?

  **Iris:** No. I reject the premium. Two bodies, two claims, regardless of the link.

  **Marcus:** Then your view isn't about separateness of experience. It's about identity. You are saying moral status tracks the count of persons, and you are insisting the count remains two until the link hits one. But if experience is shared, why doesn't the moral math change? You seem to be protecting a metaphysical boundary rather than preventing suffering.

  **Iris:** I am protecting the structure of concern. But let me press you on the reverse. Consider one person whose future self is psychologically discontinuous from them. Total change of values, no anticipation, no identification. Like a stranger inhabiting their body later.

  **Marcus:** Okay.

  **Iris:** If intrapersonal compensation is your model case, does it work there? Can I impose pain on the current self for the benefit of that future stranger?

  **Marcus:** Yes. It is one life.

  **Iris:** Why? If the psychological continuity is broken, the "single life" is a fiction. You are aggregating across temporal slices that relate to each other exactly like separate people. If you allow trade-offs there, you are aggregating across discontinuous selves. If you disallow it, you paralyze planning. Which is it?

  **Marcus:** I allow it. Continuity isn't the ground of compensation; identity is.

  **Iris:** But you just argued that shared experience should matter in the confluence case. Now you say identity matters even without continuity. You are inconsistent. Either the confluence link matters because experience merges, or the future self matters because identity persists. You cannot have it both ways.

  **Marcus:** I concede the tension. I will reframe. The operative variable is the impartial standpoint. From the view of the universe, pain is pain. Whether it is separated by skin or by time is secondary. The confluence link just makes the separation visible. The future self case shows that even without visible separation, we treat lives as units.

  **Iris:** So you admit the unit of accounting is doing the work. But is that unit metaphysical or moral? If I say the unit is the moral agent, and you say the unit is the biological life, we aren't disagreeing about welfare. We are disagreeing about what a person is.

  **Marcus:** Precisely. And if your view rests on a metaphysical thesis about personhood, then changes in metaphysics should change your ethics. If we discover persons are just stages, you must aggregate.

  **Iris:** Not necessarily. I can say that even if persons are stages, the moral law forbids treating stages as interchangeable means. But I will concede this: if the confluence link creates a single agent, I must permit the trade. My hesitation is that I suspect you are using the link to smuggle in aggregation where agency remains distinct.

  **Marcus:** And I suspect you are using agency to smuggle in a prohibition where suffering is identical. Here is what would move me: Show me a principle that forbids aggregation in the confluence case at point five without relying on a arbitrary count of bodies.

  **Iris:** And here is what would move me: Show me how to count victims without assuming the very boundaries you are trying to justify. If you cannot define the unit of aggregation without presupposing aggregation is valid, you are begging the question.

  **Marcus:** Then we are stuck. You think I am ignoring the boundaries of persons. I think you are reifying them.

  **Iris:** No. I think you are treating the boundaries as permeable membranes for utility. I treat them as walls. The question is whether the walls are made of flesh or of law.

  **Marcus:** If they are made of law, who wrote it?

  **Iris:** We did. Every time we chose not to sacrifice one for the many.

  **Marcus:** And every time we chose to save the many, we wrote a different line.

  **Iris:** Then the whiteboard remains blank.

  **Marcus:** Until the next conference.

  ***

  **Moderator's Note**

  This dialogue reconstructs standard moves in the debate over aggregative ethics while introducing a novel thought experiment to stress-test the underlying metaphysics.

  **Dialectical Status:**
  Most participants will grant the standard premises: intrapersonal trade-offs are generally permissible, and interpersonal ones are controversial. The claim that refusing aggregation has victims (the "body count" argument) is a standard consequentialist rejoinder, though deontologists often dispute the framing of doing versus allowing. The live fight here is whether the separateness objection relies on a metaphysical thesis about personal identity. Iris argues it is a structural constraint on agency; Marcus argues it is an arbitrary barrier to welfare maximization. The confluence link case is not standard literature; it is designed to force a choice between phenomenological continuity and agential identity.

  **Concessions and Contested Readings:**
  Iris concedes that aggregation failures have costs but reframes this as a constraint rather than a goal failure. This is a common move in non-consequentialist theory, though hardliners might refuse the concession entirely. Marcus concedes the tension between psychological continuity and identity but reframes it via an impartial standpoint. This relies on a contested reading of whether the impartial spectator can override first-personal boundaries. Some defenders of aggregation argue the spectator view dissolves the problem entirely; Iris challenges whether that dissolution is legitimate.

  **Formal Results:**
  Marcus leans on an expected-utility framework where the value of an outcome is the sum of individual utilities. This reconstruction assumes a simple additive function without discounting for distribution. Iris implicitly relies on a constraint-based model where certain actions are ruled out regardless of the sum. Neither character invokes specific theorems (e.g., Harsanyi's aggregation theorem), but Marcus's position implies that if one accepts rational choice theory under uncertainty, one must accept aggregation. This reconstruction is approximate; actual proofs rely on specific axioms about Pareto efficiency and impartiality that are not fully unpacked here. Use this handout to identify which axioms your group is willing to reject.
