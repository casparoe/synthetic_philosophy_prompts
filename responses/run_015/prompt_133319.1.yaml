answer: |-
  The practice of treating indicative statistical parity and counterfactual fairness as interchangeable operationalizations of a single latent construct ("unfairness") presupposes a specific, and philosophically contentious, theory of conditionals and causation. It relies on a form of **causal deflationism**, wherein cross-world dependencies are assumed to supervene neatly upon observed-world regularities.

  Below is a reconstruction of the implicit theory, an analysis of its consistency, and the regulatory implications of refusing to collapse the distinction.

  ### 1. Philosophical Commitments: The Identity of Conditionals

  To treat an indicative check ($P(Y|A) \neq P(Y|\neg A)$) and a counterfactual criterion ($Y_{A=1} \neq Y_{A=0}$) as measuring the same thing, regulatory frameworks presuppose the **Identity Thesis of Fairness Conditionals**. This thesis relies on two underlying philosophical commitments:

  **A. Humean Reductionism (The Commitment to Regularity)**
  This practice assumes a Humean view of causation, where causal power is nothing more than constant conjunction. Philosophically, this treats the counterfactual conditional ("If $A$ had been different, $Y$ would differ") as reducible to the indicative conditional ("If $A$ is different, $Y$ is different"). It assumes there is no "causal glue" or mechanistic structure that exists independently of the statistical correlation. In the language of David Lewis, it assumes the similarity ordering of possible worlds is determined entirely by the actual world's frequency distribution, ignoring structural equations that govern how variables *would* behave under intervention.

  **B. The Identification Assumption as Ontological Fact**
  In causal inference, "identification" is the mathematical condition under which a causal quantity can be estimated from observational data (e.g., $P(Y|do(A)) = P(Y|A)$). Regulatory auditing treats this epistemic condition as an ontological guarantee. It presupposes **Causal Closure**: that the dataset contains all relevant confounders and that there are no selection biases or proxy variables that decouple the indicative signal from the causal mechanism. It assumes that the *Ramsey Test* for indicatives (add $A$ to your stock of beliefs, adjust for consistency, check $Y$) yields the same result as the *Interventionist Test* for counterfactuals (set $A$ to 1 via $do$-operator, propagate through structural model, check $Y$).

  ### 2. The Direction of Reduction

  Does treating them as one thing assume counterfactuals reduce to statistics, or statistics to counterfactuals?

  It primarily assumes that **counterfactuals reduce to indicative statistical patterns.**

  Regulatory frameworks generally lack the infrastructure to model structural causal models (SCMs). Therefore, they operationalize the counterfactual ideal ("no causal effect of race") using the indicative proxy ("no correlation with race"). This presupposes that **indicative correlations can be interpreted counterfactually without loss.**

  This is a strong assumption of **No Unobserved Confounding**. It implies that if a correlation exists, it *must* be due to the protected attribute causing the outcome (or the outcome causing the attribute), rather than a third variable causing both. Conversely, it implies that if no correlation exists, no causal discrimination exists. This ignores the possibility of **fairness through unfairness** (where bias in the data cancels out bias in the model) or **unfairness through fairness** (where a model is causally biased but statistical parity is maintained via post-hoc adjustment).

  ### 3. Reconstructing the Implicit Theory: "Operational Causal Monism"

  We can reconstruct the implicit theory embedded in current auditing practice as **Operational Causal Monism**. Its axioms are:

  1.  **Monism:** There is only one type of algorithmic unfairness.
  2.  **Supervenience:** Counterfactual unfairness supervenes on indicative unfairness. If there is no statistical disparity, there is no causal discrimination.
  3.  **Epistemic Transparency:** The observed dataset is a sufficient map of the causal structure. There are no "hidden variables" relevant to fairness that are not captured in the data.
  4.  **Interchangeability:** The indicative conditional ($A \to Y$) and the counterfactual conditional ($A \Rightarrow Y$) are truth-functionally equivalent in the context of liability.

  **Consistency Check:**
  The theory is **inconsistent**.

  *   **Logical Inconsistency:** It violates the **Impossibility Theorems of Fairness** (e.g., Kleinberg et al., 2016). One cannot simultaneously satisfy calibration, balance for positive class, and balance for negative class across groups unless risk scores are perfectly accurate or base rates are identical. By treating statistical parity (indicative) and error rate balance (often a proxy for counterfactual equality of opportunity) as compatible measures of the same thing, the theory demands logically incompatible states.
  *   **Causal Inconsistency:** It fails in the presence of **colliders** or **mediators**. If a protected attribute $A$ causes a legitimate feature $Z$ (e.g., Gender $\to$ Physical Strength), and $Z$ causes Outcome $Y$ (Strength $\to$ Hiring), a counterfactual test might deem this fair (the path is legitimate), while an indicative test deems it unfair (correlation exists). Operational Causal Monism cannot distinguish between a *confounding path* (bias) and a *causal mediating path* (legitimate qualification), rendering it incoherent when proxies are involved.

  ### 4. Regulatory Design Without Collapse

  If we refuse to collapse the indicative/counterfactual distinction, regulatory design must shift from **compliance-based auditing** (checking boxes on statistical metrics) to **mechanism-based adjudication** (evaluating causal structures). The following changes would be necessary:

  **A. Tiered Evidentiary Standards**
  Regulators must distinguish between *Screening* and *Liability*.
  *   **Indicative (Screening):** Statistical parity tests remain useful as *triggers* for investigation. A correlation indicates a *risk* of unfairness, not the *presence* of it.
  *   **Counterfactual (Liability):** Establishing legal liability requires demonstrating a causal path. The burden of proof shifts from "show me the disparity" to "show me the mechanism."

  **B. Mandatory Causal Infrastructure (DAGs)**
  Current regulations require data dumps (CSV/JSON). New regulations would require **Causal Graphs**. Engineers would need to submit a Directed Acyclic Graph (DAG) asserting the causal relationships between features, protected attributes, and outcomes.
  *   *Change:* Auditors would not just test $P(Y|A)$; they would test the validity of the DAG. Is "Zip Code" a descendant of "Race"? If the firm claims it is not, they must justify the causal separation.

  **C. Separation of "Bias in Data" vs. "Bias in Model"**
  The collapse obscures whether the unfairness originates in the historical data (indicative pattern) or the algorithm's logic (counterfactual dependency).
  *   *Change:* Regulations must allow a **Bona Fide Causal Defense**. If a firm can show that the correlation is driven by a legitimate causal mediator (e.g., credit score mediates income, not race), they should be exempt from indicative parity tests, provided the mediator itself is not a proxy for the protected class.

  **D. Interventional Testing over Observational Testing**
  Instead of static dataset evaluation, regulators would require **A/B Testing** or **Shadow Mode Deployment**.
  *   *Change:* To verify counterfactuals, firms must demonstrate stability under intervention. This might require "twin testing" (sending identical profiles with altered protected attributes) in live environments, moving from observational conditionals to experimental conditionals.

  **E. Redefining "Proxy"**
  Currently, a proxy is often defined statistically (high correlation with protected class). Without the collapse, a proxy must be defined **causally** (a variable that transmits the causal influence of the protected attribute).
  *   *Change:* A variable highly correlated with race (e.g., "distance from city center") is not necessarily a discriminatory proxy if the causal path to the decision does not flow *through* race. Regulatory design must penalize *causal proxies*, not *statistical correlates*.

  ### Summary

  The current practice presupposes that the world is causally simple enough that **correlation implies causation** in the specific domain of fairness. This is a philosophical error that treats the indicative conditional as a sufficient truth-maker for the counterfactual. Refusing this collapse requires admitting that fairness is not a statistical property of a dataset, but a structural property of a decision-making process. Regulatory design must consequently evolve from auditing *outputs* to auditing *causal claims*.
