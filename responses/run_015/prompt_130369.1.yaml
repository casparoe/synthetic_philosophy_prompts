      *Wait, a nuance check:* Bradley *did* believe in internal relations. But his regress argument is often used *against* realist accounts of relations. Mara is using an Idealist move (relations are internal) to stop a regress that Bradley used to motivate Idealism. Leo is pointing out that even Idealism needs a ground. This is a sophisticated exchange. I need to make sure I don't confuse the user.
