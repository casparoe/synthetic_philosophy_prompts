answer: |-
  Here is your Q&A prep sheet. I have ordered these by potential damage to the core claims of the paper, not necessarily by likelihood. The phrasing mimics the specific disciplinary dialects in your room.

  ### The Concessions (First 2 Minutes)
  *Before you take the first question, or in your opening summary:*
  1.  **Concede the "Dormant Feature" bullet:** Don't fight the intuition that dormant features *feel* like representations. Concede that on your view, they are *representational capacities* or *structural potentials*, not active representations. Frame this as a feature: it distinguishes what the network is *doing* from what it *could do*.
  2.  **Concede the "External Consumer" dependency:** Acknowledge that for the network *as a whole*, the "consumer" is the external user/environment. If the room pushes that this makes content observer-relative, concede that *ascription* is relative, but the *causal role* (the truth-maker) is objective. Do not try to find an internal consumer for the output layer; you will dig a regress hole.

  ### The Critical Reply (Must Land)
  **The Normativity/Error Distinction.**
  If you cannot distinguish *misrepresentation* from *causal failure* (suboptimality), you lose the "Realism" in your title. You must land the claim that **normativity is internal to the consumer's success conditions.**
  *   *The Line:* "Misrepresentation isn't a violation of a biological norm; it's a state that plays the 'X-role' for consumer C but fails to covary with X in the contexts where C relies on that covariance to minimize *its* loss."
  *   *Why it must land:* Without this, the Teleosemanticists will categorize your view as "Causal Covariance," which they believe was refuted by the disjunction problem in the 80s.

  ### The Weakest Move (Prepare to Defend)
  **Export Width Stability.**
  The engineers know that vector space directions are not stable ontological units. If you change the basis (e.g., via SAEs vs. PCA vs. raw residuals), your "number of distinct consumers" might change.
  *   *The Risk:* Export width looks like an artifact of your decomposition choice.
  *   *Prep:* Be ready to argue that *mechanistically distinct* consumers (e.g., specific attention heads with distinct query/key projections) ground the width, not just vector angles. The consumers are architectural, not geometric.

  ---

  ### The Objection List (Ordered by Damage)

  #### 1. The Normativity Collapse (Teleosemanticists)
  **Phrasing:** "You've given us a causal story, but you haven't given us a normative one. If a state plays the 'gender-role' for a downstream head but the input is ambiguous, and the head guesses wrong, that's just a causal mismatch. Why is that *error* rather than just *suboptimal functioning*? Without selection history fixing the 'proper function' of the consumer, your 'counterfactual role' is just description, not normativity. You've bought causality at the price of content."
  **2-Minute Reply:** "I agree selection history is one way to ground norms, but it's not the only one. In artificial systems, the 'norm' is fixed by the *consumer's* optimization target. If Consumer C is tuned to minimize loss $L$ using State $S$ as a proxy for $X$, then $S$ misrepresents $X$ when $S$ obtains but $X$ does not, *and* this leads to higher $L$ for $C$. The normativity is local to the consumer's success condition, not global to the organism's evolution. It's not 'suboptimal' in the abstract; it's a failure of the specific control loop $S \to C \to Action \to Loss$."
  **Soft Spot:** This relies on "loss minimization" being a sufficient normative ground. Teleosemanticists often reject this as merely dispositional. If they press, concede you offer a *structural* normativity, not a *biological* one.

  #### 2. The Superposition Artifact (Interpretability Engineers)
  **Phrasing:** "Your 'Export Width' metric assumes features are directions in a fixed basis. But we know features are superposed. If I train an SAE on that residual stream, I might find 50 sparse features where you see one dense direction. My 50 features might have different export widths. Isn't your 'indeterminacy' just a reflection of your choice of decomposition? You're measuring the stability of your own analysis, not the network."
  **2-Minute Reply:** "That's a crucial methodological point. However, Export Width isn't about geometric orthogonality; it's about *mechanistic separation*. In my splitting case, the two consumers are distinct attention heads with distinct parameters. Whether the input is one dense vector or two sparse features, the fact remains that *one* mechanism reads it as 'string literal' and *another* as 'opening quote'. The indeterminacy exists because the *upstream mechanism* hasn't separated the signals yet, regardless of how we slice the vector space. The split I induce is architectural, not just geometric."
  **Soft Spot:** If they show that the "single direction" is actually two superposed features from the start, your "splitting" narrative collapses into "unmasking."

  #### 3. The Dormant Feature Refutation (Engineers + Intuition)
  **Phrasing:** "You admitted this feels wrong, so let's press it. I fine-tune a model and a 'latent knowledge' feature lights up that predicts truthfulness. On your view, before fine-tuning, that feature didn't represent truth because nothing read it. But it was *there*, causally potent, ready to be read. Are you saying the content of the network changes retroactively? Or that the feature didn't exist? This makes representation too ephemeral to be scientifically useful."
  **2-Minute Reply:** "I'm not saying the *causal structure* didn't exist. I'm saying *content* is a relational property, like 'being a key.' A piece of metal isn't a key until there's a lock it fits. The dormant feature is a 'key without a lock.' It has the *capacity* to represent, but it isn't *representing* until a consumer utilizes that capacity. This isn't retroactive change; it's the actualization of a potential. This distinction helps us explain why some fine-tuning is easy (lock already exists) and some is hard (need to build the lock)."
  **Soft Spot:** This is your weakest intuitive sell. It sounds like semantic externalism pushed to a counter-intuitive extreme.

  #### 4. The Explanatory Placeholder (Philosopher of Science)
  **Phrasing:** "Talk of 'genes' survived because it predicted inheritance patterns before we knew about DNA. What does 'representation' predict here that 'activation pattern in layer 8' doesn't? You say your view handles interventions, but I can describe the intervention purely causally: 'Ablating vector V changes output O.' Where is the *explanatory gain* of adding the representational layer? Is this just a placeholder for 'causally relevant structure'?"
  **2-Minute Reply:** "The gain is in *generalization across consumers*. If I say 'Vector V carries gender info,' I can predict how *any* new head added to the network will behave if it reads V. A purely causal description is local to the current architecture. Representational talk abstracts the *informational bottleneck*. It predicts that if I swap the consumer for a different head with the same readout profile, the behavior persists. It licenses transfer learning predictions that raw causal descriptions don't."
  **Soft Spot:** You need a concrete example of a prediction made by representational talk that failed under causal talk. Have one ready.

  #### 5. The "Whole Network" Collapse (Hope Nobody Asks)
  **Phrasing:** "If representation requires a downstream consumer, what consumes the output of the final layer? There is no internal consumer. If you say 'the user,' then representation is observer-relative, not mind-relative. If you say 'the loss function,' the loss function doesn't read representations, it reads scalars. So, on your view, the network *as a whole* represents nothing. It's a system of internal representations that sums to global non-representation. That seems absurd."
  **2-Minute Reply:** "I accept that on this view, the network *as a monolithic block* doesn't have content. Only its sub-systems do. This is actually a virtue: it dissolves the temptation to treat the model as a unified agent. The 'global' content is an ascription we make as external consumers. The internal content is real and relative to internal consumers. We shouldn't expect the whole to mirror the parts."
  **Soft Spot:** This effectively concedes that "AI Representation" is mostly an external ascription, undermining the "Realism" claim for the system as a whole.

  #### 6. Conceptual Role Semantics Redux (Phil Mind)
  **Phrasing:** "This looks exactly like Conceptual Role Semantics (CRS). Content is determined by the role in the system. We rejected CRS because it makes content too holistic and private. If two networks have slightly different downstream heads, do they have different contents? You've just renamed the old objections."
  **2-Minute Reply:** "It's CRS with a causal anchor. Classic CRS struggled with normativity and holism. By tying the 'role' to specific, identifiable downstream consumers and counterfactual interventions, I'm restricting the 'conceptual role' to a local mechanistic circuit. It's not the *whole* system's role; it's the *consumer's* role. This avoids holism while keeping the structural insight."
  **Soft Spot:** Distinguishing "local mechanistic role" from "conceptual role" is semantically thin.

  #### 7. The Splitting Case Specifics (Engineers)
  **Phrasing:** "In your Python case, you ablated and fine-tuned to split the direction. How do you know the direction didn't *already* contain two orthogonal features that were just correlated? You might have just decorrelated them. If they were already distinct features in superposition, your 'indeterminate pre-split state' claim is false. They were determinate all along."
  **2-Minute Reply:** "That's an empirical possibility, which is why the intervention is key. If they were distinct features, I should be able to patch them separately *before* fine-tuning. In my tests, patching the 'string' effect also killed the 'quote' effect pre-split. They were causally entangled. The fine-tuning didn't just unmask them; it created distinct causal pathways where there was previously one bottleneck."
  **Soft Spot:** Ensure your patching data is robust. If they find a patch that separates them pre-split, your core example fails.

  #### 8. The Phenomenal Objection (Phenomenal Intentionality Person)
  **Phrasing:** "You're talking about functional role. But representation feels like something. Even if we grant you the functional story, haven't you just described information processing? Where is the intentionality?"
  **2-Minute Reply:** "I'm defending a naturalistic account of *derived* intentionality, not original or phenomenal intentionality. I'm not claiming the network has experiences. I'm claiming it has states that function *as* representations for its parts. If you require phenomenology for representation, I concede networks don't have it, but I deny that's required for the scientific utility of the term in ML."
  **Soft Spot:** This is a stalemate. They won't be convinced, but it won't damage the view with the rest of the room.

  ---

  ### The "Hope Nobody Asks" Question
  **"So the whole network, taken as one system with no downstream consumer outside itself, ends up representing nothing at all?"**
  *   **Why it's lethal:** It exposes the regress problem of consumer-relative views. If every representation needs a consumer, and the network is the system, the system itself is contentless. This undermines the "Representational Realism about Neural Networks" title, reducing it to "Representational Realism about Neural Network *Fragments*."
  *   **Why I put it here:** It's structurally devastating but easy to deflect by saying "I'm only talking about internal layers." However, if pressed, it forces you to admit the "Global Content" is just an external ascription, which the Teleosemanticists will pounce on as "Not Real Realism."
  *   **Prep:** Stick to the "Key/Lock" analogy. A keychain isn't a key. The network is a keychain.

  ### Final Strategic Advice
  *   **Don't fight the Teleosemanticists on Biology:** Don't try to convince them that loss functions are evolution. Concede the difference, but argue that *functional normativity* is sufficient for *engineering realism*.
  *   **Lean on the Engineers:** They are your natural allies on the "divergent readout" point. Use their language ("intervention," "patching," "circuit") to shield yourself from the Phil Mind abstractions.
  *   **Own the Dormant Feature Bullet:** You already know this is weak. Don't waffle. State it clearly: "Capacity vs. Actuality." It shows philosophical rigor to admit the counter-intuitive consequence rather than hiding it.

  Good luck. The "Export Width" metric is novel enough that if you survive the Superposition objection, you've made a contribution.
