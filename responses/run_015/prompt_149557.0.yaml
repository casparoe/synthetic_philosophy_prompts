      *   *AI's Role:* AI accelerates the "work" mentality. It makes metrics king. Even if it frees time, the *cultural pressure* (driven by EA logic) is to use that time for *more* optimization, not play.
      *   *The "Scalability" Insight:* Schlick's ethics are fragile. They work for a philosopher in Vienna, not for a civilization managing existential risk. His distinction is a luxury good that breaks under systemic stress.
