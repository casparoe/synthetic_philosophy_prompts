  Two stationary observers, Alice and Bob, occupy stations 300,000 kilometers apart in a vacuum. At absolute time $t=0$, synchronized flares ignite at each location, sending light signals at speed $c$. Alice detects her flare at $t=0$ and Bob's at $t=1$ second; Bob detects his at $t=0$ and Alice's at $t=1$. A block-universe proponent argues that at $t=0.5$, Alice's reality includes her flare but excludes Bob's due to epistemic isolation, while Bob's includes his but excludes Alice's; to prevent reality from fracturing into observer-dependent fragments, both events must exist timelessly within a fixed four-dimensional manifold independent of observation.

  **Block Reasoning:** This view equates ontological presence with epistemic access; because symmetric signal delays create temporary informational asymmetries, reality must be static to ensure both observers inhabit the same world. **Presentist Reasoning:** This view distinguishes ontology from epistemology; both events exist absolutely at $t=0$ for both observers, rendering the delay merely informational rather than existential. **Single Feature:** The argument's weight rests on **frame-dependent simultaneity**. **Collapse:** If this feature is removed (as in this Newtonian framework), there is no disagreement about which events constitute the "present," so no logical pressure exists to elevate non-simultaneous events to reality to reconcile observers. **Presentist Attack:** The defender rejects the premise that reality is constrained by signal arrival, asserting that existence precedes knowledge within a universal present, thereby dissolving the need for a block universe without conceding any ground on the nature of time.
