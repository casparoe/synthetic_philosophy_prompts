answer: |-
  **Credence in C: 0.40**

  I side closer to you than your friend. Among *informed* observers (polisci undergrads/grads/experts), the concept of democratic backsliding retains enough analytic traction that a label swap would *not* flip the verdict 60% of the time. However, 40% is high enough to admit your friend has identified a real contamination effect.

  ### Decomposition

  Here are the four drivers determining whether a verdict flips when labels swap. I treat these as weighted factors pushing the probability of C (the flip) up or down.

  1.  **Inter-Rater Reliability of Expert Metrics (Weight: 0.40) → Probability: 0.20**
      *   *Justification:* Datasets like V-Dem show high correlation between coders of different ideologies on institutional facts, suppressing pure partisan flipping among the informed.
  2.  **Definitional Elasticity (Weight: 0.25) → Probability: 0.70**
      *   *Justification:* "Backsliding" lacks a bright line between "hardball" and "erosion," allowing motivated actors to plausibly categorize the same move differently.
  3.  **Case Selection Bias (Weight: 0.25) → Probability: 0.80**
      *   *Justification:* Disputes almost never concern clear coups (Hungary 2010) but rather borderline moves (court expansion), where prior beliefs dominate the classification.
  4.  **Baseline Fluidity (Weight: 0.10) → Probability: 0.50**
      *   *Justification:* Observers often shift the counterfactual ("restoring balance" vs. "breaking norms") to excuse their side, but this is secondary to the act itself.

  **Calculation:**
  I model this as a Base Rate for *uninformed* partisans (0.85, your friend's number), discounted by the "Informed" constraint, then adjusted for case ambiguity.
  *   Base Rate (General Public): 0.85
  *   Discount for Expert/Informed Constraint (Piece 1): -0.35 (Driven by the 0.20 probability that data constrains them)
  *   Adjustment for Borderline Case Focus (Piece 3): +0.10
  *   Net Adjustment for Elasticity/Baseline (Pieces 2 & 4): -0.20 (These cancel out somewhat; vagueness helps bias, but baseline arguments are often principled).
  *   **Final:** 0.85 - 0.35 + 0.10 - 0.20 = **0.40**

  ### Sensitivity Analysis

  **Most Sensitive Piece:** **Case Selection Bias (Piece 3).**
  My number relies on the assumption that "typical informed disagreement" focuses on borderline institutional hardball (e.g., filibuster reform, court packing). If the sample of disagreements shifted to include clear authoritarian moves (jailing opponents, canceling elections), the probability of C would drop to **0.10**. If the sample shifted to purely rhetorical disputes, it would rise to **0.75**.
  *   **Evidence to move me:** A systematic audit of polisci journal op-eds coding the *same* event (e.g., the 2020 US election administration changes) by author ideology. If the correlation between author ideology and "backsliding" verdict is >0.6 after controlling for facts, move my credence on C to **0.70**.

  ### The Instrument

  **Your friend is wrong.**
  Her objection (ratings aren't stable) confuses *noise* with *bias*.
  *   **Why it works:** You don't need perfect test-retest reliability to detect a treatment effect. If Person A rates "Party X does Move Y" as 8/10 backsliding and "Party Z does Move Y" as 3/10 backsliding, that within-person delta is the signal. Random noise averages out across 30 items and N participants.
  *   **Diagnostic Value:** High. If the mean flip rate is statistically indistinguishable from zero, C is false. If the mean flip rate is large, C is true. The design isolates the *partisan* variable specifically, which is exactly what Claim C posits.

  ### Verbal vs. Partisan Disagreement

  **Credence that the disagreement is primarily verbal (semantic): 0.25**
  I assign low probability to this being merely a dictionary dispute. When two polisci students argue about backsliding, they are rarely arguing about the definition of "democracy"; they are arguing about the *normative weight* of a specific action.

  **Where the gap lives (0.3 vs 0.85):**
  The gap is not about facts; it is about whether **Normative Weighting** counts as **Bias**.
  *   **Your view (0.3):** You believe weighting a move differently based on context (e.g., "expanding courts to correct imbalance" vs. "packing courts to seize power") is a principled distinction, even if it correlates with party.
  *   **Friend's view (0.85):** She treats *any* differential weighting based on the actor's identity as proof the concept is a slur. She collapses the distinction between "I support this because it's my team" (Bias) and "I support this because the context justifies it" (Principle).
  *   **Reality:** It is a mix. But because context is infinitely malleable, "Principle" is often used as a camouflage for "Bias." That is why my number (0.40) is higher than yours (0.3)—you are giving too much credit to the stability of "context."
