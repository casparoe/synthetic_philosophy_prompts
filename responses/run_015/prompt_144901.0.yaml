answer: |-
  ### The positions in concrete detail

  Formalists propose minimizing the Kolmogorov complexity of the difference between the actual world trajectory and a counterfactual where the agent remains inactive, restricted to variables outside the explicit reward function. They argue this captures "unexpected" physical change via causal structure alone, treating baseline selection as a technical invariant. Value-dependence theorists counter that constructing the counterfactual baseline (e.g., "inaction" vs. "status quo") and selecting which variables matter (e.g., vase position vs. air molecule arrangement) presupposes normative judgments about what constitutes a disturbance. They argue that without prior value commitments, the divergence measure treats all physical changes equally, failing to distinguish between breaking a vase and rearranging dust, thus rendering the formalism value-laden despite claims of neutrality.

  ### Diagnosis of the stall

  This is primarily a disagreement about **standards of valid formalization** underpinned by conflicting **bedrock intuitions about naturalness**. Formalists adhere to a "physics-first" standard: safety constraints must be derivable from causal structure and information theory alone to avoid corrupting the reward function with implicit values. They view the baseline as a causal invariant. Value-dependence theorists adhere to a "semantics-first" standard: concepts like "side effect" are inherently pragmatic and teleological. They view the baseline as a normative choice.

  The stall persists because neither side can satisfy the other's validity criteria. Formalists reject value-laden baselines as circular or error-prone, demanding a universal prior on impact. Value-theorists reject value-agnostic baselines as semantically empty, noting that without values, "impact" is indistinguishable from thermodynamic noise. Consequently, they talk past each other: Formalists argue about computability and causal graphs, while Value-theorists argue about meaning and preference satisfaction. It is not merely verbal, as they agree on examples, but foundational: one seeks a value-independent safety *structure*, the other insists safety is inherently value-*relative*. The Formalists fear value corruption; the Theorists fear semantic emptiness.

  ### The hidden structure

  The hidden structure concerns the **observer-relativity of counterfactual baselines** and the **granularity of state descriptions**. The Formalist proposal assumes a unique, natural "inaction" state exists within the causal graph. However, counterfactuals are not mind-independent facts; selecting the baseline trajectory (e.g., "agent stays off" vs. "agent maintains status quo") determines whether moving a vase counts as impact. Furthermore, the Kolmogorov measure depends on the variable set chosen to describe the state. There is no "view from nowhere" variable set; choosing to track vase positions but not air molecules is already a value judgment about relevance. Thus, the debate hinges on whether one believes a "natural" coordinate system exists for agency. Formalists assume causal structure provides this naturalness; Value-theorists argue causal structure is too dense, requiring pragmatic compression that inevitably imports values. The impasse is really about whether agency can be defined without a prior theory of relevance, akin to choosing a coordinate system in physics without a reference frame.

  ### Prospects for progress

  Progress requires **reframing the agent's task** rather than seeking a theorem on baseline invariance, which is likely impossible. The field should abandon the search for a value-independent impact measure and instead formalize **how values enter the baseline**. A productive path is treating the baseline not as a causal fact but as a learned prior over human preferences regarding stability. This shifts the question from "How do we define side effects without values?" to "How do we efficiently learn which changes humans consider side effects?" Alternatively, distinguishing between *instrumental convergence* (generic resource usage) and *normative impact* (value-relevant change) could split the problem. Resolution lies in admitting the Value-Dependence theorists are conceptually right, but challenging the Formalists to find robust approximations that minimize value-learning burdens.
