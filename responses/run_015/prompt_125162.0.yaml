answer: |-
  Here are ten colloquium questions designed for Dr. Varga, structured to press the theoretical weaknesses of her neo-Langean model without asking for basic exposition.

  **1. The Common Denominator Problem (Mises)**
  Dr. Varga, Mises's calculation argument hinges on the idea that rational economic calculation requires a common denominator of value derived from the exchange of private property titles. In your model, the "currency" used in the internal futures market is a notional social dividend that cannot be accumulated or converted into personal consumption power outside the system. If the unit of account isn't tied to a claim on *real* residual income or property, on what basis do you claim it functions as a universal equivalent? How do you ensure these accounting prices reflect genuine opportunity costs rather than just internal bookkeeping ratios?

  **2. Follow-up: The "Smuggling" Charge (Mises)**
  *(Anticipated Answer: She will likely argue that the functional outcome—clearing prices—is what matters, not the legal title.)*
  If the functional outcome is what matters, your internal futures market for capital goods looks structurally identical to a capitalist stock market, differing only in who holds the residual claim at the end of the day. If managers are trading claims on capital allocations based on expected future yields, aren't you effectively smuggling in a capital market while denying the property relations that make such markets robust? If the "owners" (the public) cannot trade these titles, how do you prevent the managers from becoming a de facto owning class without the accountability mechanisms of actual ownership?

  **3. Tacit Knowledge and Bet Specification (Hayek)**
  Hayek's critique emphasizes that much of the knowledge required for economic coordination is tacit—it's know-how that cannot be easily articulated or transmitted. Prediction markets, however, require traders to specify the terms of a contract (e.g., "Price of X will be Y on date Z"). If the relevant knowledge is truly tacit, managers shouldn't be able to formulate the bets required to trade on it. How does your internal market capture knowledge that the managers themselves cannot explicitly articulate enough to write into a futures contract?

  **4. Follow-up: Radical Uncertainty vs. Risk (Hayek)**
  *(Anticipated Answer: She will likely argue that the market aggregates dispersed expectations regardless of their source.)*
  Even if they can formulate bets, prediction markets are generally proven to handle *risk* (known probability distributions) rather than *radical uncertainty* (unknown unknowns or structural breaks). Hayek argued the price system is a discovery procedure for *new* possibilities, not just a calculator of existing probabilities. If a technological shock renders a whole class of capital goods obsolete, wouldn't your internal market simply price in the decline too slowly because no one has a prior contract for the "new" technology? Does your model have a mechanism for entrepreneurial discovery that exists *outside* the futures contracts currently on the books?

  **5. Loss Bearing and Moral Hazard (Incentives)**
  In a capitalist firm, a bad investment decision leads to a loss of private capital, potentially bankrupting the decision-maker. In your model, losses from bad futures trades are settled in notional dividends and ultimately socialized; no manager loses their personal home or savings. Given this separation of decision-making from personal wealth risk, what prevents severe moral hazard? Why should a manager bet truthfully on a risky project if the downside is absorbed by the social dividend pool while the upside boosts their internal standing?

  **6. Follow-up: Gaming and Scoring Rules (Incentives)**
  *(Anticipated Answer: She will likely suggest that proper scoring rules or reputation mechanisms will enforce truth-telling.)*
  Reputation and scoring rules work well in academic or low-stakes environments, but in high-stakes resource allocation, agents often herd to avoid standing out as the one who deviated from the plan. If the Central Planning Board sets the rules of the prediction market, won't managers simply bet on what they think the Board *wants* to fund rather than what they actually believe about demand? How do you insulate the internal market from political signaling when the "market makers" are also the political planners?

  **7. The Entrepreneurial Function**
  Your model relies heavily on managers optimizing within a framework of existing or near-future capital goods. However, Schumpeterian innovation often involves creating goods that have no close substitutes and therefore no basis for a futures contract yet. Does your Central Planning Board have a mechanism to fund "blue sky" projects that cannot be priced in the internal prediction market because there is no historical data or comparable asset to bet on? If not, isn't the system biased toward incrementalism?

  **8. The Political Role of the Central Planning Board**
  You assign the Central Planning Board the role of setting the initial accounting prices and the rules of the prediction market. If the Board has the power to adjust the rules of the market to correct "failures," doesn't that reintroduce the very calculation problem you're trying to solve? Who calculates the optimal rules for the prediction market? If the Board adjusts the rules based on observed outcomes, aren't they effectively engaging in the same trial-and-error planning Lange originally proposed, rendering the prediction market a redundant layer of bureaucracy?

  **9. Consistency in Labor Allocation**
  Your model applies the prediction market mechanism to capital goods and investment, but you retain Lange's original proposal for labor and consumer goods (market allocation). If capital is priced via internal prediction but labor is priced via external negotiation, don't you risk a mismatch in signals? For example, if the internal market signals a boom in a specific sector but labor markets are sticky or fail to price that skill scarcity accurately, how does the system coordinate the two without the Board intervening to direct labor, which would violate your market socialist commitments?

  **10. Falsifiability and Evidence**
  Finally, let's step back from the internal logic. What empirical result or conceptual argument would count *against* your model? If we were to run a pilot of this internal prediction market in a large state-owned enterprise and it performed no better than a traditional hierarchical allocation system, how would you diagnose the failure? Is there a specific threshold of price volatility or allocation efficiency where you would concede that the notional market is incapable of solving the calculation problem?
