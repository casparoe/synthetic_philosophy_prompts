      *   *The Solution:* Count I's. MI has 1 I. Rule 1: $+1$ U (I count unchanged). Rule 2: double string (I count doubles). Rule 3: $-3$ I's. Rule 4: $-2$ U's (I count unchanged).
      *   *Invariant:* Number of I's is never divisible by 3. $1 \not\equiv 0 \pmod 3$. Doubling $k \not\equiv 0 \implies 2k \not\equiv 0 \pmod 3$. Subtracting 3 preserves mod 3.
      *   *Translation:*
          *   System: Transition system $(S, \to)$. $S = \{\text{M, I, U}\}^*$.
          *   Abstraction: $\alpha: S \to \mathbb{Z}/3\mathbb{Z}$, where $\alpha(s) = (\text{count}_\text{I}(s)) \pmod 3$.
          *   Galois Connection: Concrete domain $\mathcal{P}(S)$, Abstract domain $\mathcal{P}(\mathbb{Z}/3\mathbb{Z})$ (or just elements since it's a homomorphism).
          *   Inductive Invariant: $I(s) \iff \alpha(s) \neq 0$.
          *   Proof: Structural induction on the derivation tree. Base case: MI ($\alpha=1$). Step case: Show $\forall s, s'. s \to s' \land \alpha(s) \neq 0 \implies \alpha(s') \neq 0$.
      *   *Assessment:* Does this capture Hofstadter? Yes, technically. But Hofstadter emphasizes the *discovery* of the invariant. The formalism verifies the invariant, it doesn't generate it. This is the first hint of "residue."

