answer: |-
  The unanimity rule presupposes an epistemologically unstable conjunction principle that treats the aggregation of twelve fallible judgments as collectively infallible, an assumption that licenses categorical verdicts only by ignoring the mathematical erosion of probability that occurs when independent high-confidence propositions are combined. This institutional epistemology implicitly relies on the Conjunction Principle, asserting that if each juror knows or justifiably believes the defendant is guilty, the collective body knows it categorically, thereby masking the distinction between individual credence and collective truth. Under the assumption that juror judgments are roughly independent, the arithmetic exposes the incoherence of this assumption: if each of the twelve jurors assigns a confidence of 0.99 to guilt, the probability that all twelve are right is $0.99^{12}$, which equals approximately 0.886. This figure falls below the plausible threshold for the standard of proof, taken here to be 0.95, demonstrating that a unanimous verdict derived from independent judgments fails to meet the very standard of certainty required for conviction. However, if the jurors' judgments are highly correlated because they all weigh the same evidence without independent verification, the probability that the unanimous verdict is correct remains near 0.99, as the group is effectively repeating a single measurement rather than multiplying independent probabilities. Consequently, the lottery-paradox critique of the rule depends entirely on the independence case; it dismantles the epistemic validity of the verdict only if jurors are true independent agents, whereas the rule functions coherently only if jurors act as redundant validators of a common signal. To replace the implicit closure assumption with a straightforwardly probabilistic one, the verdict would have to change from a binary declaration of guilt to a graded assertion of likelihood, or the unanimity requirement would need to be adjusted to ensure the collective probability stays above the threshold despite independent error rates. The resulting system would be more epistemically coherent by accurately reflecting the uncertainty inherent in the evidence, but less legally coherent because the criminal justice system requires binary outcomes to justify the deprivation of liberty, creating a fundamental tension between mathematical honesty and normative finality.
