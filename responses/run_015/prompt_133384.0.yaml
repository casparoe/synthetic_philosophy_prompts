answer: |-
  Each micro **subject** feels its own small state,
  Possessing some intrinsic **quality**,
  But nothing seems to **bound** them into one.
  No **part** surrenders to a greater fate,
  They sum to less than any **whole** begun,
  From mere atoms mind cannot **derive**.

  How can the macro ever **derive**
  If every single **subject** stays alone?
  We seek the mind integrated as **whole**
  But find only a **quality** unknown,
  Each little **part** refuses to combine,
  No relation seems to **bound**.

  Though spatial fields may **bound**
  And from the micro **derive**
  Structure for every **part**,
  The inner **subject** remains apart.
  A spectrum of **quality**
  That never makes a **whole**.

  Now posit one vast cosmic **whole**
  Where all are strictly **bound**
  By shared **quality**,
  From which the fragments **derive**
  Their status as a **subject**,
  And every **part** is mere modulation.

  But how does any **part**
  Escape the cosmic **whole**?
  If the universal **subject** sees,
  What **bound** sets the individual free?
  Does ignorance **derive**
  Or is the **quality** suppressed?

  No **quality** explains the gap,
  Nor does the isolated **part**
  Fully **derive**
  From the **whole**,
  Nor does the phenomenal **bound**
  Create a new **subject**.

  Where **subject** meets **quality**,
  The **bound** releases every **part**,
  And **whole** refuses to **derive**.
