answer: |-
  You claim the criterion is ill-posed because the label is missing for enrollees, but that is precisely why I require a randomized holdout—say, five percent of each group denied care regardless of score—to identify the counterfactual error rates without selection bias. The ratchet you describe is a feedback loop we control, not a law of nature; we set the threshold based on the holdout's ground truth, not the enrolled sample's observed failures. I will impose equal false-negative rates measured on that holdout, because that observation is the only thing that prevents the model from simply learning to ignore the harder-to-help group because their failures are less predictable or less costly to us. Your worry about the definition being unmeasurable collapses once you accept that auditability requires sacrificing some optimization power to maintain a stable measurement surface.

  You ask why I would spend real health on a definition, but unconstrained welfare maximization is itself a definition—one that equates institutional duty with aggregate output. When you move slots from the Group B patient at 0.19 to the Group A patient at 0.22 because A's base rate is twenty-five percent versus B's ten, you are not finding efficiency; you are penalizing B for having a lower prior probability of failure that they did not choose. We are not here to maximize aggregate health units; we are here to ensure the institution does not treat patients as mere inputs to an objective function. The clinician's confusion over thresholds is a training problem, not a reason to abandon equal false-negative rates; we tell them the score means risk within group, but the slot goes to the person most likely to disengage relative to their peers. I will block deployment until you show me that the health lost is not simply the cost of refusing to let the algorithm write off the group with the lower base rate.
