answer: |-
  ### The Chaos & Predictability Decision Tree

  **Root:** Consider a chaotic double pendulum governed by deterministic ordinary differential equations (ODEs) with positive Lyapunov exponents.

  **Q1. Prediction Target:** When you claim this system is "predictable," are you claiming you can specify the **exact angle** of the second arm at $t=100$ seconds, or that you can specify the **proportion of time** it spends in the left hemisphere over a year?
  *   **Exact Angle (State):** Go to Q2.
  *   **Proportion of Time (Statistical/Action):** Go to Q7.

  **Q2. Source of Failure:** If you cannot specify the exact angle, is the barrier that you cannot **measure the starting angle** to infinite precision, or that **no finite algorithm** could process the exact starting angle to produce the future angle even if you had it?
  *   **No Algorithm (Computability):** Go to **Leaf: Computational Indeterminism**.
  *   **Measurement (SIC):** Go to Q3.

  **Q3. Physical Continuum:** If the barrier is measurement precision, does the pendulum arm actually occupy a **precise real-number position** between the markings of your ruler, or is "position" undefined below a physical threshold (e.g., atomic scale)?
  *   **Undefined (Discrete):** Go to **Leaf: Continuum Idealization**.
  *   **Precise Real Number (Continuum):** Go to Q4.

  **Q4. Empirical Content:** If the position is a real number but no human can measure it, is the claim "the pendulum is deterministic" **empirically meaningless**, or does it still describe a fact about the world?
  *   **Meaningless:** Go to **Leaf: Instrumentalist**.
  *   **Fact about World:** Go to Q5.

  **Q5. Demon's Burden:** If it is a fact about the world, does the truth of determinism require that a **Laplacian Demon could calculate** the trajectory from exact data (making chaos a mere annoyance), or is it enough that the future is **fixed regardless of calculability**?
  *   **Requires Calculation:** Go to **Leaf: Laplacian Determinism**.
  *   **Fixed Regardless:** Go to Q6.

  **Q6. Model vs. Reality:** If the future is fixed regardless of calculability, is this determinism a property of the **physical pendulum itself**, or only of the **mathematical model's** state space (owing nothing to physical measurability)?
  *   **Physical Pendulum:** Go to **Leaf: Standard Textbook**.
  *   **Mathematical Model:** Go to **Leaf: Model-Relative Determinism**.

  **Q7. Statistical Viability:** (From Q1 Statistical) If you rely on statistical prediction, does the system settle into a **computable invariant measure** (is it ergodic/mixing), or does it wander non-ergodically through state space?
  *   **Computable Measure:** Go to **Leaf: Statistical/Mixing View**.
  *   **Non-Ergodic/Uncomputable:** Go to **Leaf: The Empty Cell**.

  ---

  ### The Leaves

  1.  **Computational Indeterminism:** *Awkward Commitment:* Nature is deterministic but transcends Turing computation, so not even a hypercomputer could predict the trajectory.
  2.  **Continuum Idealization:** *Awkward Commitment:* Our best deterministic equations are literally false of the physical world because physical reality is not continuous.
  3.  **Instrumentalist:** *Awkward Commitment:* Unpredictable determinism is a meaningless metaphysical assertion because verification is impossible.
  4.  **Laplacian Determinism:** *Awkward Commitment:* Infinite precision measurement is physically possible in principle, making chaos merely an epistemic annoyance.
  5.  **Standard Textbook:** *Awkward Commitment:* The future is fixed but forever unknowable, making determinism an empirically idle ontological claim.
  6.  **Model-Relative Determinism:** *Awkward Commitment:* Determinism is a feature of our equations, not the world, and owes nothing to physical measurability.
  7.  **Statistical/Mixing View:** *Awkward Commitment:* True predictability exists only at the level of distributions, rendering individual events fundamentally opaque.
  8.  **The Empty Cell (Metaphysical Determinism):** *Awkward Commitment:* Determinism is true but confers no predictive, control, or probabilistic advantage whatsoever.

  ---

  ### Diagnosis of "The Empty Cell"

  **Verdict:** Unattractive / Philosophically Idle.

  **Diagnosis:** This cell represents **Metaphysical Determinism without Scientific Cash Value**.
  In the literature, this position is rarely occupied because it severs the link between determinism and *explanation*. If state prediction fails (chaos), action-guiding prediction fails (control impossible), and statistical prediction fails (non-ergodic/uncomputable measure), then asserting "the system is deterministic" does no work. It cannot distinguish the system from a truly indeterministic one via any experiment, probability assignment, or control strategy.

  It is not logically *incoherent* (one can consistently assert $x(t)$ is fixed even if unknowable and statistically opaque), but it is **theoretically sterile**. Grad students usually abandon this cell because it retains the metaphysical baggage of determinism (closure, fixity) without any of the scientific benefits (prediction, explanation, control), making it indistinguishable from "Spooky Indeterminism" in practice. It survives only as a skeptical hypothesis, not a working scientific position.
