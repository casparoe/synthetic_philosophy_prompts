  6.  **Drafting Section 4: Verbal Disputes:**
      *   *Goal:* Diagnose the "talking past" aspect.
      *   *Term: "Desert".* Dennett uses a pragmatic/social notion (desert as a status within a practice). Caruso uses a metaphysical/notion (basic desert requiring ultimate responsibility). This is a huge chunk of the disagreement.
      *   *Term: "Free Will".* Dennett: "Free Will Worth Wanting" (capacities). Caruso: "Free Will" (contra-causal power).
      *   *Term: "Punishment".* Dennett: Includes the expressive function of blame. Caruso: Defines it by the hard treatment which requires strict justification.
      *   *Residue:* Even after clarifying terms, there is a *pragmatic* disagreement. Even if Dennett admits "No Basic Desert," he thinks we must *act as if* there is. Caruso thinks acting as if is lying and harmful. This is a genuine disagreement about policy and moral psychology, not just semantics.

  7.  **Review and Refine:**
