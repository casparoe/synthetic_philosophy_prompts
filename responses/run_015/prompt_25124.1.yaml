      *   *Drafting thought:* Make sure to capture that neither supports *cruel* punishment.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Precision. Avoid "Yes/No."
      *   *Issue 1: Basic Desert.*
          *   Neutral: Does moral responsibility entail a backward-looking claim that justifies suffering?
          *   Dennett: Responsibility entails a liability to sanctions that is *not merely* instrumental; it's a status earned by participation in the moral community.
          *   Caruso: No backward-looking justification for suffering is ever valid; liability is purely forward-looking (safety).
      *   *Issue 2: Sufficiency of Forward-Looking Justifications.*
          *   Neutral: Are deterrence/rehab enough to justify the *hard treatment* of punishment?
          *   Dennett: No, without the retributive element (desert), the system loses legitimacy and efficacy (the "sting").
          *   Caruso: Yes, the quarantine model is sufficient and morally superior; adding desert adds injustice without utility.
      *   *Issue 3: Social Consequences.*
          *   Neutral: What happens if we publicly abandon retributive language?
          *   Dennett: Catastrophic erosion of norms, vengeance goes underground, victims feel ignored.
          *   Caruso: Liberation from barbarism, more rational policy, reduced recidivism, increased empathy.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* What would change minds?
