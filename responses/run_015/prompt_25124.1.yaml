          2.  Disagreements Table (Neutral Claim, Dennett's View, Caruso's View).
          3.  Cruxes (Sub-questions, evidence/argument types, predictions).
          4.  Verbal Disputes (Analysis of terminology vs. substantive disagreement).
      *   **Tone:** Academic, precise, charitable, philosophically nuanced (suitable for a PhD level).

  2.  **Deconstruct the Positions (Dennett vs. Caruso):**
      *   **Dennett:** Compatibilist. Believes in a pragmatic, evolutionarily grounded notion of free will and moral responsibility. "Free Will Worth Wanting." Rejects basic desert in a *metaphysical* (libertarian) sense but retains it in a *sociopolitical* sense. Fears the societal collapse if we abandon retributive attitudes (deterrence loses sting, victims feel unjustly treated). Supports legal punishment but wants it humane.
      *   **Caruso:** Free Will Skeptic / Hard Incompatibilist. Rejects *basic desert* entirely. No one is ultimately responsible in the way required for retributive blame. Advocates the "Public Health Quarantine Model" (PHQM). Punishment is only justified for safety/rehab, never because someone *deserves* suffering. Fears the injustice of punishing the non-responsible.
      *   **Common Ground:** Both reject libertarian free will (contra-causal). Both accept determinism/naturalism. Both want a humane justice system. Both agree on forward-looking goals (deterrence, rehab, incapacitation). Both dislike the current harsh US system.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Maximize overlap without glossing over real differences.
      *   *Determinism/Science:* Both agree neuroscience/physics undermines libertarian free will.
      *   *Legal System:* Both agree the current system is too harsh and often unjust.
      *   *Forward-looking:* Both agree punishment *should* serve deterrence, rehabilitation, and incapacitation.
