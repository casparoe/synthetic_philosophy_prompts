          *   Dennett predicts: Negative outcomes (rise in crime/vengeance).
          *   Caruso predicts: Positive/Neutral outcomes (better rehab, less vengeance).
      *   *Crux 2: The Phenomenology of Guilt.* Is the feeling of "I deserve this" essential for moral reform?
          *   Evidence: Psychological studies on recidivism and internalization of norms.
          *   Dennett predicts: Essential.
          *   Caruso predicts: Shame is counter-productive; empathy drives reform.
      *   *Crux 3: The Definition of "Suffering".* Is incarceration inherently "suffering" that needs desert to justify, or is it "incapacitation" that needs safety to justify?
          *   This is tricky. Let's focus on the *Justification* itself.
          *   Better Crux: The Moral Weight of Luck.
          *   Actually, let's stick to the *Function of Retribution*. Is it a necessary fiction?
          *   Let's go with: *The Necessity of Retributive Emotions for Social Cohesion.*
          *   Evidence: Evolutionary psychology / Game Theory models.
