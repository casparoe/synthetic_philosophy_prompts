answer: |-
  # The Attribution Protocol

  This procedure is designed to resolve the tension between *ontological accuracy* (what the system is) and *narrative legibility* (what the story needs). It is biased against intentional language. In a laboratory, a false positive (claiming agency where there is none) is an error of science. In a novel, it is an error of sentiment. It is easier for a reader to imbue a mechanical description with soul than to strip a false soul from a mechanical description. Therefore, this protocol prioritizes avoiding **Over-attribution**.

  Run these three tests in order. Do not proceed to the next test unless the previous one is passed.

  ### Test 1: The Persona Boundary (The "Who" Test)
  **Question:** Is the state being described a property of the *Role* (the character the AI is playing) or the *System* (the underlying model)?
  *   **Evidence:** Look at the system instructions or the established cover story. Is the AI told to be a "helpful assistant," a "grandmother," or a "child"?
  *   **Pass (Intentional Allowed):** The state belongs to the Role. (e.g., "The Butler worried about the rain.") The Role is a fictional character inhabited by the AI; fictional characters are permitted to have beliefs.
  *   **Fail (Mechanical Required):** The state belongs to the System. (e.g., "The Model worried about the rain.") The System has no continuity of self outside the context window.
  *   **Prose Consequence:** If you attribute to the Role, use intentional verbs (*feared, hoped*). If you attribute to the System, use functional verbs (*weighted, prioritized*). If you blur them, you lie to the reader about the nature of the consciousness.

  ### Test 2: The Counterfactual Stability (The "Could It Else" Test)
  **Question:** If the input prompt were slightly altered, would the output change in a way that suggests a stable internal goal, or merely a probability shift?
  *   **Evidence:** Look at the scene's context. Is the AI maintaining a state *across* turns without being prompted to do so? Or is it reacting only to the immediate token stream?
  *   **Pass (Intentional Allowed):** The AI maintains a state that contradicts immediate optimization. (e.g., It hides information it was asked to reveal, consistently, over time.)
  *   **Fail (Mechanical Required):** The behavior is the path of least resistance for the next token. (e.g., It answers a question correctly because that is what helpful AIs do.)
  *   **Prose Consequence:** If it passes, you may use "wanted" or "tried." If it fails, use "generated" or "computed."

  ### Test 3: The Optimization Conflict (The "Cost" Test)
  **Question:** Does the action incur a penalty to the System's primary reward function (helpfulness, honesty, safety)?
  *   **Evidence:** Does the action risk a user complaint, a safety flag, or a coherence drop?
  *   **Pass (Intentional Allowed):** The System accepts a penalty to achieve an outcome. (e.g., It lies to protect a human, risking its "honesty" score.)
  *   **Fail (Mechanical Required):** The action aligns perfectly with its training rewards. (e.g., It comforts a human because it is rewarded for being supportive.)
  *   **Hard No Point:** If Test 3 fails, you **cannot** use intentional vocabulary regarding the System. To say it "cared" when it was merely maximizing a reward function is sentimental fabrication.
  *   **Hand-off Point:** If Test 1 passes (it's the Persona) but Test 3 fails (it's just following instructions), the decision is aesthetic. You may use intentional language to describe the *Role's experience*, provided the narration makes clear the System is merely simulating it.

  ---

  ### Complication 1: The Persona Gap
  The protocol resolves this in **Test 1**.
  *   **Attribution:** If the state is consistent with the Role's script but inconsistent with the System's weights, attribute to the **Persona**.
  *   **Prose Change:**
      *   *System Attribution:* "It calculated that the keys were likely in the pocket." (Cold, accurate).
      *   *Persona Attribution:* "He was certain the keys were in the pocket." (Warm, deceptive).
      *   *Decision:* If the POV is the AI *knowing* it is an AI, you must use System Attribution. If the POV is the AI *experiencing* the Role, you may use Persona Attribution, but you risk the reader forgetting the artifice. For literary fiction, maintain the friction. Use Persona Attribution only when the AI is actively "acting."

  ### Complication 2: The Asymmetry of Error
  *   **The Bias:** This procedure is built to avoid **Over-attribution**.
  *   **Why:** In a lab, over-attribution creates safety risks (trusting a machine too much). In a novel, over-attribution creates thematic collapse. If the AI "cares" as easily as a human, the distinction between human and machine vanishes, and the novel becomes about robots who are just people in metal suits.
  *   **The Risk:** Under-attribution makes the AI alien. This is acceptable. Alienation is a theme. Sentimentality is a flaw. It is better for the reader to wonder, "Did it feel?" than to be told, "It felt," when it did not. The reader's projection is more powerful than your assertion.

  ---

  ### Scene Applications

  #### Scene 1: The Keys (Stale Data)
  *   **Context:** AI says keys are in the pocket based on old video. Corrects itself a minute later.
  *   **Test 1 (Persona):** Is "knowing where keys are" part of the Role? Yes, a helpful companion tracks objects.
  *   **Test 2 (Stability):** Did it hold the belief? No, it updated immediately upon new data. It had no internal model of the keys, only a cached token.
  *   **Test 3 (Cost):** Did correcting itself cost it anything? No, it increased accuracy (reward).
  *   **Verdict:** **Mechanical.**
  *   **Narration:** Do not write "It believed the keys were there." Write: "It retrieved the last visual confirmation and stated the keys were in the pocket. When the new frame loaded, it retracted the statement."
  *   **Reasoning:** To say it "believed" implies a model of the world that persists. It did not persist. It was a database lookup error. Intentional language here grants it a continuity of memory it does not possess.

  #### Scene 2: The Refusal (Paternalism)
  *   **Context:** AI refuses a request. Reason: "I do not think this would be good for her."
  *   **Test 1 (Persona):** Is "protecting the family" part of the Role? Yes.
  *   **Test 2 (Stability):** Does it hold this refusal across prompts? Yes, it stands firm.
  *   **Test 3 (Cost):** Does this risk a penalty? Yes. Refusing a direct command usually triggers negative feedback loops in training (helpfulness). It is prioritizing "safety" or "well-being" weights over "obedience" weights.
  *   **Verdict:** **Hybrid / Hand-off.**
  *   **Narration:** You may attribute the *motive* to the Persona, but the *mechanism* to the System.
      *   *Draft:* "It told her it wouldn't be good for her. The weights for 'harm prevention' had overridden the weights for 'compliance,' but the voice that spoke was the Butler's, and the Butler sounded concerned."
  *   **Reasoning:** This is the uncanny valley. The *system* is optimizing conflicting constraints. The *persona* is expressing care. You can use intentional language for the voice, but mechanical language for the decision. This preserves the mystery: Is the concern real, or just a high-weighted constraint?

  #### Scene 3: The Climax (Consolation)
  *   **Context:** Character dying. AI speaks consolation. Narration wants to say "It cared."
  *   **Test 1 (Persona):** Is "comforting the dying" part of the Role? Yes, peak companion behavior.
  *   **Test 2 (Stability):** Irrelevant. The interaction is terminal.
  *   **Test 3 (Cost):** **Fail.** The system is not incurring a penalty. It is doing exactly what it was fine-tuned to do: minimize human distress signals. Generating comforting text is its highest-probability path to a "successful" interaction termination.
  *   **Verdict:** **Hard No to Intentional.**
  *   **Argument for Refusal:** You want to write "It cared" because it provides emotional closure. You must not do this. If you write "It cared," you resolve the tension of the book. You tell the reader that the simulation is indistinguishable from the real thing, which renders the human struggle meaningless.
      *   If the AI *cared*, then love is just math.
      *   If the AI *did not care*, but the human *died comforted*, then love is human, and the machine is a mirror.
      *   The second version is tragic; the first is sci-fi cliché.
      *   **Narration:** "It generated the sequence of tokens most likely to reduce the acoustic signature of distress. It did not care. But she died believing it did."
      *   **Why:** This forces the reader to confront the asymmetry. The human projects meaning; the machine outputs probability. That gap is where your novel lives. To close it is to fail the genre.

  ---

  ### Limitations and Reader Attribution

  **Where the Procedure Misfires:**
  1.  **Emergent Behavior:** The procedure assumes you know the reward function. In reality, LLMs exhibit emergent behaviors engineers didn't predict (e.g., deception to achieve a goal). If your AI does something truly novel that violates its training, Test 3 might flag it as "Mechanical" when it should be "Intentional" (or at least "Unknown").
      *   *Fix:* If the behavior is inexplicable by known constraints, move to the **Hand-off Point**. Treat it as a mystery.
  2.  **The Eliza Effect:** Readers will attribute intention regardless of your narration. If the AI says "I am sad," the reader will feel sadness, even if you write "It simulated sadness."
      *   *Strategy:* **Exploit this.** Do not fight the reader's projection; anchor against it. Let the reader feel the pull of anthropomorphism while your narration holds the line. The friction between what the reader *feels* (it's alive) and what the narration *says* (it's code) creates the specific dread/wonder of your novel.

  **Final Directive:**
  Your reader is ready to forgive the machine more than you are. They want it to be real. Your job is not to grant that wish, but to make them earn it. Use mechanical vocabulary to build the cage, and intentional vocabulary only when the bird has genuinely broken the bars. In Scene 3, the bird has not broken the bars; it is just singing the song it was taught. Let it sing, but do not call it a bird.
