answer: |-
  ### The Debate: `origin` vs. `fork`

  **The Lockean Position (Labor-Mixing as Commit Authority)**
  In this model, the global namespace of code is the `commons`. When a developer initializes a repository and generates commits, they are mixing their labor with the `commons`. Each `commit` object is a cryptographic snapshot containing the tree state, the parent hash, the timestamp, and the `author` identity. Because the SHA-1 hash is deterministically generated by the content and the author's metadata, the commit is inextricably bound to the laborer.

  Therefore, the `remote` repository (the `origin`) should function as a title deed. Only the author who generated the initial commits should have write access to the `main` branch. To merge an outside contributor's branch without explicit authorization (a Pull Request acceptance) is to overwrite the author's `HEAD` reference. The Lockean argues that because the commit hash proves labor, the author retains exclusive write permissions to the `origin` ref. Any `clone` that redistributes the code without a license file is a violation of the author's control over their commit history.

  **The Anti-Propertarian Position (Non-Rivalry as Distributed Architecture)**
  This position argues that code is fundamentally non-rivalrous, mirrored by Git's distributed nature. When User B runs `git clone` on User A's repository, User A's `objects` directory is not depleted. User B receives a full copy of the `.git` directory, including the entire DAG (Directed Acyclic Graph) of history.

  Because the data is replicated, not transferred, there is no technical conflict. User B can `fork` the repository, creating a divergent `remote`. They can modify the code, create new commits, and push to their own `origin`. This does not alter User A's `HEAD`. Conflict only arises if both parties attempt to `push` to the *same* remote ref. The anti-propertarian claim is that since the `fork` does not delete or corrupt the original `commit` objects, "ownership" is an artificial restriction imposed by the remote host's permission settings, not a property of the code itself. The `merge` conflict is a technical state to be resolved, not a moral violation.

  ***

  ### Residue Report

  Here is the mapping of philosophical claims onto Git mechanics, categorized by fidelity.

  #### 1. Clean Mappings (High Fidelity)
  *   **Attribution (Paternity Rights):** Git handles this natively. `git log` and `git blame` permanently bind an email and name to every `commit` hash. As long as the history is not rewritten, the lineage of labor is technically immutable. This maps cleanly to the moral right of attribution.
  *   **Labor as Value:** The `commit` hash is proof of work. You cannot generate a valid hash for a specific blob of code without performing the computational and intellectual labor to create it. The cryptographic signature validates the labor claim.
  *   **The Commons:** A public `remote` (e.g., on GitHub/GitLab) functions exactly as the philosophical commons. It is readable by all (`git clone`), but writable only by those with SSH keys or tokens.

  #### 2. Distorted Mappings (Requires Stretching Mechanics)
  *   **Exclusion/Scarcity:** Locke relies on the idea that if I take your apple, you have no apple. In Git, "taking" is `cloning`. To simulate scarcity, you must rely on the *remote server's* access control lists (ACLs), not Git itself. Git the tool allows infinite copying. You have to distort Git's function by treating the `remote` host as the authority rather than the local `.git` directory.
  *   **Damage/Harm:** In IP law, unauthorized use causes economic harm. In Git, unauthorized forking causes *divergence*. There is no technical signal for "loss." A `fork` is structurally identical to a `clone` until a `push` is attempted. Mapping "harm" to "divergence" requires a normative leap that Git does not make.
  *   **Transfer of Ownership:** In Git, you cannot "transfer" a commit's authorship. You can only add new commits on top. To change ownership, you must `rebase` or `filter-branch` to rewrite history, which changes the hashes and breaks the chain of trust. IP law allows ownership transfer without altering the work; Git requires altering the work (the hashes) to change the recorded owner.

  #### 3. Null Sets (No Technical Counterpart)
  *   **The "Idea" vs. The "Expression":** IP law distinguishes between an idea (unownable) and its expression (ownable). Git sees only blobs and trees. It cannot distinguish between a generic sorting algorithm (idea) and your specific implementation (expression). To Git, all `diff`s are equal.
  *   **Derivative Works:** Legally, a derivative work requires permission. In Git, a `branch` or `fork` that modifies logic is technically just a new set of commits. Git has no flag for "derivative." It only tracks parent-child relationships in the DAG.
  *   **Fair Use:** There is no `--fair-use` flag. Either you have write access to the `remote`, or you don't.

  ***

  ### The Integrity Question: Moral Rights vs. The Fork

  You asked whether the idea of inalienable moral rights over a work—specifically the right to control integrity—survives translation into a system where anyone can fork and modify without permission.

  **The Verdict: It does not survive technically.**

  In Git, the "right to integrity" is technically impossible to enforce once the code is public.
  1.  **Immutability is Local:** Your `.git` directory is immutable regarding past hashes. However, anyone else who has cloned your repo has a copy of the `objects`. They can checkout a branch, modify the files, commit new changes, and publish this to a new `remote`.
  2.  **The Fork Override:** If a user disagrees with your implementation (integrity), they do not need your permission to fix it. They `fork`, `commit` the fix, and `push`. Your original `main` branch remains untouched, but the *ecosystem* may migrate to their fork if your integrity is deemed "broken."
  3.  **Signed Tags:** You can use `git tag -s` (GPG signed tags) to mark a specific commit as the "official" release. This asserts integrity. However, a user can still `checkout` that tag, modify the code, and release "v2.0" on their own `remote`. Git verifies *who* signed the tag, not whether the code *should* be changed.

  **The Residue Analysis**

  This failure reveals a critical asymmetry between IP philosophy and Version Control:

  **1. IP Philosophy Imports Scarcity Assumptions Absent from Code**
  Locke's argument relies on rivalrous resources. If I farm a plot of land, you cannot farm that same plot. IP law tries to artificially impose this scarcity on non-rivalrous ideas. Git exposes this as a fiction. In Git, the "land" (the code) can be farmed by a million people simultaneously without soil depletion. The "ownership" Locke argues for is not a property of the *code objects*, but a property of the *social protocol* (licenses) and the *hosting platform* (permissions). The residue shows that IP law is trying to manage social coordination, not protect a tangible asset.

  **2. Git is Missing a Normative Dimension**
  Conversely, Git is morally agnostic. It tracks *provenance* (who wrote what), but not *permission* (who is allowed to use what). A `commit` proves you wrote it, but the `LICENSE` file (a plain text blob) tells people what they can do with it. Git enforces the former cryptographically; it ignores the latter completely.
  *   **The Gap:** Git cannot prevent a license violation technically. If someone clones your GPL repo, modifies it, and distributes it without source, Git sees this as a valid `push` to a different `remote`. The violation is invisible to the DAG.

  **Conclusion**
  The residue reveals that **IP philosophy imports assumptions absent from collaborative code.**

  Locke's labor-mixing argument assumes that labor creates a scarcity boundary. Git proves that in the digital realm, labor creates *abundance* (more copies, more variations). The "conflict" in Git is not over the *existence* of the code, but over the *convergence* of the history (which `commit` is `HEAD`).

  The "moral right to integrity" fails in Git because the system is designed for *evolution*, not *preservation*. The `fork` is the ultimate check against authority. If IP philosophy claims you have a right to stop me from modifying your idea, Git's architecture demonstrates that you can only stop me from modifying *your specific remote reference*. You cannot stop me from continuing the work elsewhere.

  Therefore, the friction isn't that Git is missing a normative dimension; it's that IP philosophy is trying to apply physical-world scarcity logic to a system (digital code) where scarcity is a configuration setting, not a physical law. The "ownership" Locke describes maps to `write access on origin`, not to the `commit` objects themselves.
