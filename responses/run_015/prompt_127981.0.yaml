      *   *Anti-Propertarian (Non-Rivalrous):* My using an idea doesn't stop you from using it. In Git terms: Cloning/forking doesn't delete the original. Code is infinitely copyable without loss.
      *   *Moral Rights:* Right of attribution (paternity) and integrity (no distortion). In Git: `git blame`, signed commits, but also the ability to `rebase` or `cherry-pick` and change history.

  3.  **Drafting the Translation (Git Vocabulary Only):**
