  4.  **Developing the Argument (Locke vs. Anti-Propertarian in Git):**
      *   *Locke:* When you `git commit`, you generate a unique hash bound to your identity. This commit is your labor. Therefore, you should control the `main` branch. Merging your work without permission is like stealing your commit hash.
      *   *Anti-Propertarian:* When I `git clone` your repo, I have the full history. My local copy doesn't diminish yours. If I fork and modify, I create a new DAG (Directed Acyclic Graph). Your DAG remains intact. There is no conflict unless we try to push to the *same* remote ref.

