  **DEPARTMENT OF STOCHASTIC GOVERNANCE**
  **Interagency Council for Uncertainty Quantification**
  **48 CFR Part 700**
  **Docket No. ICUQ-2024-0042**
  **RIN 3410-AA09**

  **Mandatory Assignment of Prior Probabilities in the Absence of Empirical Data**

  **AGENCY:** Interagency Council for Uncertainty Quantification (ICUQ).

  **ACTION:** Notice of Proposed Rulemaking.

  **SUMMARY:** The ICUQ proposes to require federal agencies to assign probability distributions to quantities lacking empirical evidence using the Principle of Indifference. Currently, agencies decline to quantify uncertainty when data is absent, creating regulatory gaps. This rule ensures all epistemic voids are filled with determinate numbers.

  **DATES:** Comments must be received by December 31, 2024.

  **BACKGROUND:**
  Under current practice, agencies encountering an "Epistemic Void"—a parameter lacking empirical frequency data—often declare the probability "unknown." This impedes cost-benefit analysis. The proposed rule mandates that ignorance constitutes a determinate input to the probability calculus. By regulating the selection of variables, the Council ensures resulting numbers are non-arbitrary.

  **DEFINITIONS:**
  *   **Epistemic Void:** A state where empirical evidence regarding a quantity is absent.
  *   **Canonical Variable:** A parametrization registered in the Approved Parametrization Registry.
  *   **Measure:** A function assigning size to subsets of the sample space.

  **REGULATORY TEXT:**

  **§ 700.1 Mandatory Assignment.**
  In the event of an Epistemic Void, the agency shall assign a uniform probability distribution over the space of possible outcomes. Agencies shall not decline to quantify.

  **§ 700.2 Parametrization and Measure.**
  Agencies must recognize that probability assignments depend on the measure chosen over the sample space. For example, consider the regulation of structural integrity involving a chord drawn at random in a circle. The agency must determine the probability that the chord exceeds the side of the inscribed equilateral triangle.
  (1) If the agency selects *Random Endpoints* (uniform measure over circumference), the probability shall be 1/3.
  (2) If the agency selects *Random Radius* (uniform measure over distance from center), the probability shall be 1/2.
  (3) If the agency selects *Random Midpoint* (uniform measure over area), the probability shall be 1/4.
  These values differ because each method imposes a different weight on chords near diameters versus chords near the periphery. The family of admissible answers is not limited to these three. Agencies shall select one method via the Registry.

  **§ 700.3 Approved Parametrization Registry.**
  Agencies shall register their chosen Canonical Variable in advance. Registration provides a safe-harbor against litigation regarding arbitrariness.
  *Comment:* "Clients used to fear audit findings on prior selection. Now we bill by the hour to identify the variable parametrization that yields the compliant probability bound," says Dr. Elena Rostova, Principal at BayesCompliance Solutions.

  **§ 700.4 Second-Order Indifference.**
  Absent information about which parametrization to use, agencies shall be indifferent among those on the Registry. However, agencies must note that the resulting mixture depends on how the Registry is indexed or grouped. If the Registry is grouped by geometric method versus algebraic formulation, the second-order prior shifts. Agencies shall document the indexing schema.

  **COMPLIANCE COSTS:**
  The Council anticipates growth in the variable-selection consulting industry. Costs associated with resolving conflicts between competing parametrizations are estimated to be non-zero but quantifiable.

  **REQUEST FOR COMMENTS:**
  The ICUQ invites comments on the following:
  1. Should the Principle of Indifference apply to continuous variables without a specified measure?
  2. Does the Principle of Transformation Groups sufficiently restrict the admissible parametrizations to a unique solution?
  3. Should agencies be indifferent among parametrizations, or among the groups generating them?
  4. How should the Registry handle variables invariant under scaling but not translation?
  5. Is maximum entropy a sufficient substitute for indifference in high-dimensional voids?
  6. Does the choice of metric presuppose the information it seeks to derive?

  **SIGNATURE:**
  Dr. Aris Thorne, Deputy Director for Stochastic Compliance.

  ***

  **Author's note:**
  (i) It is settled mathematics that Bertrand's three procedures yield 1/3, 1/2, and 1/4 because they define different measures on the space of chords; "random chord" is ill-defined without specifying the selection mechanism. (ii) Contested issues include whether Jaynes' principle of transformation groups (invariance) uniquely resolves this by selecting the measure invariant under rotation, scaling, and translation, or whether choosing the relevant group itself presupposes information. Some argue the Principle of Indifference has no legitimate domain for continuous variables. (iii) This satire presses the claim that regulation can resolve the meta-paradox (indexing the Registry) harder than most invariance proponents would allow; serious work suggests invariance constraints *can* narrow the options, though whether they eliminate arbitrariness entirely remains live debate.
