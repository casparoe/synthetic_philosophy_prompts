      *   *Equal Chance (2) vs. Stratification (3):* Pure lottery (2) vs. Stratified sample (3). Stratification interferes with pure equal chance to ensure representativeness. Is this a fatal contradiction or a technical adjustment?
      *   *Procedural Authority (8) vs. Advisory/Near-term (9):* If the output is *authoritative* (8), why is it only *advisory* (9)? If I must treat it as authoritative, why can it be ignored by the referendum/electorate?
      *   *Deliberated Microcosm vs. Undeliberated Macrocosm (Specific Question 2):* Commitment 4 says deliberation creates better judgment. Commitment 9 says the final decision goes to a referendum (mass electorate) or elected officials. If the mass electorate is prone to the pathologies in Commitment 1, why let them override the deliberated body? This looks like a major stability issue.
