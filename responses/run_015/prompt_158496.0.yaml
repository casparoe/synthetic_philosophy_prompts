      *   Which is bigger? The Micro/Macro tension (1 vs 9) is the most politically fatal. It makes the reform pointless according to its own logic. If elections are broken (1), don't let elections veto the fix (9).
      *   *Decision:* The single revision should be to Commitment 9. Remove the referendum veto for matters within the assembly's remit.

