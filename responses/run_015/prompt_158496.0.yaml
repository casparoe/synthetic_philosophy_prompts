      *   *Let's finalize the "Single Revision".* It's better to suggest modifying Commitment 3 (The Mirror). If the justification is *Transformation* (4), then *Mirroring* (3) is not the source of authority. The source of authority is the *Deliberative Process*. This dissolves the Mirror/Transformation tension and strengthens the case for Binding Power (because the value add is the thinking, not the sampling). If the value is just the sampling, a poll is enough. If the value is the thinking, they need power. So shifting justification from Descriptive to Epistemic/Deliberative fixes multiple downstream issues.
