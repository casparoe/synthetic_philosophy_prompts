      *   4. *Transformation:* Preferences are endogenous. Deliberation changes minds. Not just aggregating pre-existing views.
      *   5. *Experts:* Experts inform, members decide values. No expert veto.
      *   6. *No Filtering:* No competence tests. Compulsory service. Post-service restrictions (cooling-off).
      *   7. *Openness:* Livestream/public materials. Legitimacy via public observation.
      *   8. *Procedural Authority:* Output is authoritative even if substantively wrong (procedural legitimacy).
