answer: |-
  Here's the scenario: Imagine Oakhaven and Pinewood, two towns with identical demographics and the same library board headache. Pinewood adopts a static rule: "No hate speech, period." Oakhaven tries to be more democratic with "Proportional Silence": they allow any speech unless it gains 30% local support, at which point it's deemed a threat to public order and restricted. It sounds fairer—why ban fringe views?—but over five years, Oakhaven's board cancels twice as many meetings and removes three times as many books. Not because they're tyrants, but because every time a controversial topic hits 25% interest, the board panics that another discussion might push the metric over the 30% trigger, so they shut down the whole conversation preemptively to stay compliant. Pinewood just kicks out the guy shouting slurs; Oakhaven silences the whole book club to keep the numbers safe.

  Here's why the threshold backfires. In Pinewood, the boundary is about *conduct*; you know the line, you walk up to it, and if you cross it, you're out. In Oakhaven, the boundary is about *momentum*. The 30% rule turns speech into a counted resource that needs management. The board isn't just judging content anymore; they're polling sentiment, tracking attendance, and worrying about "slippage." To avoid hitting the trigger, they suppress ambiguous dissent—moderate critiques, hypothetical debates, anything that might add weight to the intolerant side—because they can't afford to let the counter tick up. That's the feature doing the philosophical work: the threshold creates a "capacity limit" on controversy. If you move it to 5%, you're basically Pinewood (immediate ban). If you move it to 80%, you allow chaos until a mob forms. But at 30%, you're in the "Management Zone"—high enough to require constant monitoring, low enough to trigger bureaucratic anxiety.

  A defender of Oakhaven would say you're rigging the game. They'd argue, "Pinewood chills fringe innovation by banning ideas day one; we only act when an idea proves it has teeth. Your scenario assumes the board is cowardly, not principled." And honestly? Yeah, I'm baking the outcome in slightly. I'm assuming the board cares more about preserving the rule than the principle of tolerance. But that's the realist point: bureaucracies optimize for stability, not truth. By making tolerance conditional on popularity, you force the institution to manage popularity, and that management always costs more speech than a simple line in the sand.
