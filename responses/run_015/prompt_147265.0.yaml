prompt: |-
  I am giving the eulogy for my great-uncle, who volunteered at eighteen for a war that nearly everyone in the room now regards as unjust, and who spent fifty years neither defending the cause nor repudiating his part in it. He left instructions: I am not to say the cause was just, I am not to say he was wrong to fight, and I am not to shield him by pointing out that he was following orders or that he was only a boy — because, he wrote, being permitted to do a thing and being innocent in doing it are not the same thing, and the gap between them, which he called the unpaid difference, is owed something even after the permission has been granted and even after the war is long over. He wanted that gap named rather than closed. The room will include his surviving comrades, who still believe the war was just and will hear any concession as a betrayal, and his grandchildren, who regard the whole enterprise as criminal; two men from the army he fought against have travelled to be there, and he asked that I say something true to them as well — something that grants them whatever it is that combatants on opposite sides of a war are supposed to share, without pretending that this settles anything and without asking them to forgive him. Please write the eulogy, about five minutes long, for a room that is not made of philosophers and that cannot be allowed to leave consoled by a lie.
reasoning: |-
  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Great-nephew/niece.
      *   **Subject:** Great-uncle (volunteered at 18 for a war now seen as unjust).
      *   **Subject's Stance:** Spent 50 years neither defending nor repudiating. Acknowledged the "unpaid difference" between permission and innocence.
      *   **Instructions:**
          *   Do *not* say the cause was just.
          *   Do *not* say he was wrong to fight.
          *   Do *not* excuse him (following orders, just a boy).
          *   *Do* name the gap (the unpaid difference).
          *   Address surviving comrades (who believe it was just).
          *   Address grandchildren (who believe it was criminal).
          *   Address two former enemies (grant them shared combatant status without false reconciliation).
          *   Tone: Truthful, not consolatory via lies, not philosophical jargon (room of normal people), ~5 minutes long (approx. 750-850 words spoken at a moderate pace).

  2.  **Determine the Core Theme:**
      *   The core theme is *responsibility without justification*. It's about holding the weight of action without trying to lighten the load with excuses or victories. The "unpaid difference" is the central metaphor.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the complexity of the room. Don't start with "We are here to celebrate." Start with the reality of the gathering.
      *   **The Uncle's Life/Choice:** Mention the volunteering at eighteen. Acknowledge the war's reputation now vs. then, without taking a side on the politics.
      *   **The Instructions (The "Unpaid Difference"):** This needs to be the heart. Explain his specific request. He didn't want absolution. He wanted the debt acknowledged.
      *   **Addressing the Comrades:** They feel betrayed if the cause is questioned. Acknowledge their bond without validating the cause. The bond is in the *doing*, not the *why*.
      *   **Addressing the Grandchildren:** They feel shame or anger. Acknowledge their moral clarity without letting the uncle off the hook. He carried the weight so they wouldn't have to carry the denial.
      *   **Addressing the Enemies:** This is delicate. Shared humanity of combatants. Not forgiveness, but recognition of shared risk and consequence.
      *   **Closing:** Bring it back to the "unpaid difference." How do we honor him? By not forgetting the cost.

  4.  **Drafting - Iteration 1 (Mental Outline & Tone Check):**
      *   *Tone:* Solemn, direct, unadorned. No flowery poetry that obscures meaning.
      *   *Constraint Check:* Am I excusing him? No. Am I condemning him? No. Am I calling the war just? No.
      *   *Key Phrase:* "The unpaid difference." Must include this.

  5.  **Drafting - Writing the Content (incorporating constraints):**

      *   *Intro:* Welcome everyone. Note the tension in the room. It's okay that it's tense.
      *   *The Man:* He was 18. He chose to go. He came back. He didn't talk much about the politics.
      *   *The Note:* He left specific instructions. He knew people would try to fix his memory. He didn't want fixing.
      *   *The Concept:* Permission vs. Innocence. The state said "go," but that didn't make it "clean."
      *   *To the Comrades:* You stood together. That bond is real. I won't deny your service. But he knew service wasn't a shield.
      *   *To the Family:* You look back with horror. He didn't ask you to look away. He asked you to see the cost.
      *   *To the Enemies:* You are here. That matters. We don't shake hands and say "no hard feelings." We say "we were there."
      *   *Conclusion:* We honor him by keeping the debt open.

  6.  **Refining and Polishing (Focusing on Word Count and Flow):**
      *   *Self-Correction during drafting:* I need to make sure I don't sound *too* academic when explaining the "unpaid difference." It needs to sound like something a human feels, not a thesis.
      *   *Timing:* 5 minutes is roughly 750 words. I need to keep it tight.
      *   *The Enemies:* Make sure I don't ask for forgiveness. Just acknowledgment.
      *   *The Comrades:* Validate their loyalty without validating the war.
      *   *The Grandchildren:* Validate their judgment without condemning the grandfather.

  7.  **Final Review against Constraints:**
      *   Did I say the cause was just? No.
      *   Did I say he was wrong? No.
      *   Did I say he was just a boy/following orders? No.
      *   Did I name the gap? Yes.
      *   Is it too philosophical? I need to ground it in the physical reality of the room.

  8.  **Final Polish (Simulated):**
      *   *Check:* "Being permitted to do a thing and being innocent in doing it are not the same thing." -> Keep this quote, it's powerful.
      *   *Check:* Ensure the transition between the groups in the room feels natural.
      *   *Check:* Ending needs to be strong. Not "Rest in Peace" in the traditional sense, but "Rest in Truth."

  **(Self-Correction Note):** Make sure the language isn't *too* cold. It's a eulogy. There must be love, but a tough love. The love is in respecting his wish for honesty.

  9.  **Final Word Count Check:** Aiming for ~800 words.

