answer: |-
  Friends, family, comrades, and guests.

  We are gathered here in a room that holds a great deal of silence. Some of you sit with memories of a shared cause. Some of you sit with the anger of those who suffered from it. Some of you sit with the confusion of those who loved the man but cannot love his history. If you feel a tension in the air, do not try to breathe it away. This tension was part of him. To smooth it over would be to speak a lie, and he asked us for the truth.

  My great-uncle was eighteen years old when he volunteered. He was not drafted. He was not forced. He walked toward a war that history has largely judged as a mistake, perhaps even a crime. He knew that judgment was coming. He lived fifty years with it. And in the instructions he left for this day, he forbade me from telling you that he was right to go. He also forbade me from telling you that he was wrong.

  He knew that if I called the cause just, I would insult the dead who died opposing it. He knew that if I called his service a sin, I would betray the living who served beside him. So he left us with a harder task. He asked us to hold two things in our hands at once: the reality of his choice, and the cost of that choice.

  He wrote to me about what he called "the unpaid difference." He said that being permitted to do a thing and being innocent in doing it are not the same thing. The government gave him permission. The uniform gave him authority. But he knew that a signature on a deployment order does not wash the blood from a hand. He believed that there is a debt incurred when one takes a life, or risks a life, for a cause that may not hold up to time. He called that debt the unpaid difference. He did not want me to pay it off today with excuses. He did not want me to say he was only a boy, or that he was following orders. He was a man who acted. He wanted the gap between his permission and his innocence to remain open.

  To his comrades sitting here: He honored you. He never questioned your loyalty, and he never questioned the bond you forged in the mud and the fire. He knew that the man next to you is the only thing that remains solid when the world dissolves. I am not here to ask you to renounce that bond. Your service to each other is real, regardless of the service to the state. He loved you. But he also knew that your shared survival did not cancel the cost of the war. He carried that cost so you wouldn't have to pretend it didn't exist.

  To his grandchildren: You look at this history and you see a crime. You feel a righteous anger. He did not ask you to soften that anger. He did not ask for your forgiveness. He knew that your moral clarity was a luxury he had to purchase with his own ambiguity. He hoped that by refusing to defend his actions, he could spare you the need to defend them for him. You are allowed to believe the war was wrong. He believed that you judging him was part of the price he owed.

  And to the two men who traveled from the other side of the line to be here: You are welcome. He asked that I speak something true to you. The truth is this: You were the obstacle, and he was the obstacle. You were both instruments of a will that was not your own, and you were both the ones who had to pull the triggers. He did not want your forgiveness. He knew that forgiveness implies a transaction, a settling of accounts. He did not believe the account could be settled. He only wanted you to know that he saw you. He saw that you bled, and that you lost, and that you survived with the same weight he carried. There is no handshake that fixes this. But there is recognition. We recognize that you are here, and that the war ended, but the consequence did not.

  We cannot leave here consoled by the idea that everything happens for a reason. We cannot leave here saying he was a hero in the clean, bright sense of the word. And we cannot call him a villain, because he spent fifty years refusing to hide from what he did.

  He was a man who understood that some debts are not meant to be paid, but carried. He carried the unpaid difference so that we could stand here today and acknowledge that war is not a game of points, but a accumulation of costs.

  Let us honor him not by cleaning up his memory, but by letting it stand as it is: complicated, burdened, and honest. Let us leave here understanding that peace is not the absence of conflict, but the willingness to bear the weight of it without looking away.

  He is gone. The debt remains. And we are still here to witness it.
