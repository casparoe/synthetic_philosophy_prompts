  **Brainstorming on Mnemonic Persistence vs. Narrative Fossilization**
  *   **Tension:** Lian views myth as a palimpsest where history bleeds through; Kess views myth as a functional construct where history is erased by narrative needs.
  *   **Troy:** Lian cites archaeology (Hissarlik) as proof of core; Kess argues archaeology proves destruction, not the *Iliad*'s specific historicity.
  *   **Arthur:** Lian cites textual persistence (Badon); Kess argues persistence proves cultural utility, not biological fact.
  *   **Exodus:** Lian cites stratified testimony (Semitic expulsion); Kess cites lack of external corroboration and foundation myth status.
  *   **Method:** Lian uses "stratified testimony" to dig down; Kess uses "coherence filter" to show how oral tradition reshapes data.

  1. **Dr. Lian:** Schliemann uncovered Hissarlik beneath the *Iliad*, proving the Trojan War left a mnemonic sediment we can excavate. **Prof. Kess:** Finding a burned city isn't finding Agamemnon, since the poem filters events through heroic coherence rather than evidentiary record.
  2. **Dr. Lian:** Yet Badon Hill persists across texts, suggesting a historical core survives even when Geoffrey of Monmouth layers on the magic. **Prof. Kess:** That persistence proves the story's utility, not its truth, as oral transmission reshapes figures like Riothamus into a coherence filter for kingship.
  3. **Dr. Lian:** Even the Exodus retains stratified testimony of Semitic expulsion from Egypt, hidden beneath the theological narrative accretion. **Prof. Kess:** But without Egyptian corroboration, you're treating a foundation myth as history, ignoring how oral traditions destroy specific evidentiary value.
  4. **Dr. Lian:** My stratified testimony analysis peels back the narrative costume to reveal the historical body underneath the myth. **Prof. Kess:** You cannot peel back a shadow to find a wall, because the legend is the only object that ever existed.
  5. **Dr. Lian:** If we dismiss the mnemonic sediment, we lose the only bridge we have to the pre-literate past. **Prof. Kess:** Better to admit the bridge is illusion than to walk off it pretending it's stone.
