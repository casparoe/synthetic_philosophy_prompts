  **Mark:** 54%
  **Classification:** Lower Second-Class Honours (2:2)

  **General Comments:**
  This is a clearly written answer that demonstrates a strong intuitive grasp of the basic motivation behind Lewis's project. You correctly identify the coordination problem and provide a solid explanation of arbitrariness in part (a). However, as you move into parts (b) and (c), your answer relies on several significant theoretical conflations that undermine your analysis of Lewis's specific arguments. While you have engaged with the secondary literature (Schelling) and understood the broad stakes, there are fundamental inaccuracies regarding Lewis's definitions of agreement, stability, and the distinction between coordination and collective action problems. In a second-year module, we expect precision on these core distinctions.

  **Point-by-Point Feedback:**

  **(a) The Problem and Arbitrariness (Approx. 65% level)**
  *   **Strengths:** You correctly identify that conventions solve coordination problems where agents have a common interest in matching behaviour. Your explanation of arbitrariness is excellent: you capture Lewis's criterion that an alternative regularity ($R'$) could have solved the problem just as well. The driving example is appropriate and clearly explained.
  *   **Weaknesses:** You suggest that arbitrariness implies a government could change the rule "overnight". While true empirically, this slightly misses Lewis's philosophical point. Lewis is interested in how conventions arise *prior* to legislation. The arbitrariness is what allows the convention to emerge spontaneously, not necessarily what licenses state intervention. Additionally, you introduce "common knowledge" here. While relevant to Lewis's definition, the question asked specifically about the *problem* and *arbitrariness*; this material would have been better deployed in part (c) regarding stability.

  **(b) Salience and Precedent (Approx. 50% level)**
  *   **Strengths:** You correctly attribute the concept of salience to Schelling's focal points and accurately describe how precedent functions to make a specific equilibrium salient in future interactions. The "train station" example is standard and correctly applied.
  *   **Weaknesses:** There is a major theoretical error in your claim that "Lewis's paradigm case is explicit agreement — a convention is like a promise made by a whole population at once." This is directly contrary to Lewis's thesis. Lewis explicitly argues that conventions are *not* agreements (see *Convention*, Chapter 1, Section 4). Agreements create obligations via promising; Lewis aims to explain normative force *without* prior agreement, relying instead on expectations and preferences. By framing convention as a type of agreement, you misrepresent the reductionist ambition of Lewis's account. This is a significant conflation that prevents this section from reaching 2:1 standard.

  **(c) Stability and Example (Approx. 45% level)**
  *   **Strengths:** You attempt to address the stability question directly and provide a concrete example (overfishing).
  *   **Weaknesses:** This section contains two critical errors. First, you claim Lewis explains stability "via the sanctions a group attaches to them." For Lewis, the stability of a convention is grounded in the *coordination equilibrium itself*: unilateral deviation is self-punishing because it leads to a failure of coordination (e.g., a crash), not necessarily because of external sanctions like fines or honking. Sanctions may exist, but they are not the source of stability in Lewis's game-theoretic model; recursive expectations are.
      Second, and more seriously, you conflate coordination problems with collective action problems (Prisoner's Dilemmas). Overfishing is a classic Prisoner's Dilemma: individuals have an incentive to defect even if others cooperate. Lewis's conventions solve *coordination* problems, where there is no incentive to defect if others cooperate. Lewis's account does not solve Prisoner's Dilemmas without additional mechanisms (such as the external sanctions you mentioned, which Lewis treats as distinct from the convention itself). By claiming Lewis's account explains stability in overfishing via sanctions, you are attributing a solution to Lewis that he does not offer in *Convention*. This distinction is fundamental to social philosophy (often mapped onto the Hume vs. Hobbes distinction), and conflating them undermines your critical discussion.

  **Summary:**
  You have a good grasp of the intuitive examples and the basic definition of arbitrariness, which secures a pass well above the third-class boundary. However, the errors regarding agreement and the nature of the problem (coordination vs. collective action) are fundamental misunderstandings of the text. To reach a 2:1 or First, you must ensure your technical characterisation of the philosopher's arguments is precise, particularly regarding game-theoretic distinctions.

  **Advice for Improvement:**
  1.  **Read the definitions closely:** Lewis is very specific that conventions are *not* agreements. Check your notes against the primary text on this point.
  2.  **Distinguish Problem Types:** Ensure you can distinguish a Coordination Problem (matching is key) from a Prisoner's Dilemma (defection is tempting). Lewis's theory applies to the former, not the latter.
  3.  **Internal vs. External Stability:** When discussing stability in Lewis, focus on *expectations* and *preferences* (internal to the game) rather than sanctions (external to the game), unless you are critically evaluating the limits of his account.
