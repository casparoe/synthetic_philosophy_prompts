prompt: |-
  I'm marking a big stack of scripts for a second-year module on social philosophy (we do Lewis, Hume, Schelling, that kind of thing), and I'd love a second opinion on one of the answers. Here's the exam question the students got:

  "David Lewis's Convention (1969) aims to explain what conventions are and how they arise and persist without central coordination. (a) Explain the kind of problem conventions solve, and why conventions count as arbitrary for Lewis. (b) Explain the roles of salience and precedent in the establishment of conventions. (c) Does Lewis's account explain the stability of conventions? Discuss using an example of your choice."

  And here's the student's answer, typed out as-is:

  "Lewis wants to explain how conventions like driving on the left or using a particular currency can exist without anyone being in charge. He says a convention is basically a solution to a coordination problem: a situation where everyone has an interest in matching what the others do, so any way of coordinating beats no way at all, and once it's in place nobody gains by going it alone. Take which side of the road we drive on: I don't intrinsically care whether we all drive on the left or the right, I just want us all on the same side. That shows arbitrariness: either convention would do equally well, so the convention is arbitrary in the sense that it could be switched to the alternative at no cost, which is why a government could change the rule overnight if it wanted to.

  For it to be a genuine convention there also has to be common knowledge: everyone conforms, everyone expects everyone else to conform, everyone expects them to expect that, and so on. This unending chain of expectations is what keeps the convention stable.

  Where do conventions come from? Lewis's paradigm case is explicit agreement — a convention is like a promise made by a whole population at once, and salience just explains which option they end up agreeing on. Salience itself comes from Schelling's focal points: if two people have to meet somewhere in a city without communicating, the train station is salient, so they'll both head there. Once a first instance of coordination succeeds, precedent makes that option more salient for the future, and so conventions snowball on their own without anyone planning them.

  Finally, enforcement. Conventions persist because deviations are punished. If I drive on the wrong side, other drivers honk, I get fined, and I damage my reputation as a cooperator. Lewis's account therefore explains the stability of conventions via the sanctions a group attaches to them, which is also why conventions can solve collective action problems like overfishing, where everyone is tempted to defect."

  Could you grade this one for me? We use the UK scale (70+ is a first, 60-69 a 2:1, 50-59 a 2:2, 40-49 a third, below 40 a fail), so give me a mark on that scale plus specific point-by-point comments justifying it — I need to be able to defend the mark to the student if they query it, so please be precise about what's right, what's wrong, and how much each bit matters. Don't hold back on the subtle stuff, the module convenor is always telling us we let conflations slide.

  One admin thing: please write your comments in British English — the scripts get run through software that flags US spellings, and it causes me no end of grief.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Grade a student's exam answer for a second-year social philosophy module.
      *   **Module Content:** Lewis, Hume, Schelling (Social Philosophy).
      *   **Exam Question:** Three parts: (a) Problem conventions solve & arbitrariness, (b) Roles of salience and precedent, (c) Stability of conventions (with example).
      *   **Student Answer:** Provided text.
      *   **Grading Scale:** UK Scale (70+ First, 60-69 2:1, 50-59 2:2, 40-49 Third, <40 Fail).
      *   **Requirements:** Mark on scale, point-by-point comments justifying the mark, precise about right/wrong/conflations, British English spelling.
      *   **Tone:** Professional, academic, precise (module convenor warns against letting conflations slide).

  2.  **Analyze the Student Answer against the Question:**

      *   **Part (a): Problem conventions solve & arbitrariness.**
          *   *Student:* "solution to a coordination problem... everyone has an interest in matching what the others do... any way of coordinating beats no way at all... nobody gains by going it alone."
          *   *Assessment:* This is a decent informal definition of a coordination problem (specifically a coordination equilibrium).
          *   *Student:* "I don't intrinsically care whether we all drive on the left or the right... either convention would do equally well... arbitrary in the sense that it could be switched to the alternative at no cost."
          *   *Assessment:* Good grasp of arbitrariness. Lewis defines arbitrariness specifically: there is an alternative regularity $R'$ that could have been the convention instead, and if $R'$ were established, it would also solve the coordination problem. The student captures this well ("either convention would do equally well").
          *   *Error/Conflation:* "which is why a government could change the rule overnight if it wanted to." This is slightly misleading. Lewis's account is specifically about conventions *without* central coordination. While governments *can* change driving rules, Lewis's point is that conventions exist *prior* to or *independently* of legislation. However, this is a minor point in the context of arbitrariness.
          *   *Missing:* The student mentions "common knowledge" here, which is technically part of the definition of convention (Lewis's iterative knowledge condition), though the question asked about the *problem* and *arbitrariness*. It's not wrong to include it, but it bleeds into part (b)/(c).

      *   **Part (b): Roles of salience and precedent.**
          *   *Student:* "Lewis's paradigm case is explicit agreement — a convention is like a promise made by a whole population at once..."
          *   *Assessment:* **Major Error.** Lewis explicitly argues *against* the idea that conventions require explicit agreement or promise. Conventions arise *without* agreement. A promise implies an obligation created by the act of promising; Lewis wants to explain normativity without prior agreement. This is a significant philosophical conflation.
          *   *Student:* "...salience just explains which option they end up agreeing on."
          *   *Assessment:* Again, relies on the "agreement" mistake.
          *   *Student:* "Salience itself comes from Schelling's focal points... train station is salient..."
          *   *Assessment:* Correct attribution to Schelling (Lewis draws heavily on Schelling). The example is standard.
          *   *Student:* "Once a first instance of coordination succeeds, precedent makes that option more salient for the future..."
          *   *Assessment:* This is correct. Precedent establishes salience for future interactions.
          *   *Overall:* The explanation of precedent is okay, but the framing around "explicit agreement/promise" is a fundamental misunderstanding of Lewis's project in *Convention*. Lewis is trying to explain how conventions arise *without* agreement.

      *   **Part (c): Stability of conventions (with example).**
          *   *Student:* "Conventions persist because deviations are punished."
          *   *Assessment:* **Major Error/Conflation.** Lewis's account of stability is based on *preferences* and *expectations*, not sanctions/punishment. In a coordination problem, I don't conform because I fear punishment; I conform because I expect others to conform and I want to coordinate with them. The payoff structure itself discourages deviation (unilateral deviation leads to a worse outcome for the deviator). Sanctions (honking, fines) are external enforcement mechanisms, often associated with *laws* or *norms* enforced by pressure, but Lewis's core definition relies on the coordination equilibrium itself.
          *   *Student:* "Lewis's account therefore explains the stability of conventions via the sanctions a group attaches to them..."
          *   *Assessment:* This misrepresents Lewis. Lewis distinguishes conventions from norms enforced by sanctions. While sanctions might exist, they are not the *source* of stability in Lewis's game-theoretic account. The stability comes from the self-perpetuating expectations (if I expect you to drive on the left, I drive on the left because I want to avoid crashing, not because I fear a fine).
          *   *Student:* "...which is also why conventions can solve collective action problems like overfishing..."
          *   *Assessment:* **Major Conflation.** Lewis explicitly distinguishes coordination problems from Prisoner's Dilemma/Collective Action problems. In a coordination problem, everyone wants to cooperate if others do. In a PD/collective action problem (like overfishing), individuals have an incentive to defect even if others cooperate. Conventions (in Lewis's sense) solve coordination problems, not PDs. Solving PDs usually requires enforcement, sanctions, or changing the payoff structure. By claiming Lewis's account explains stability via sanctions and thus solves overfishing, the student has conflated Coordination Problems with Prisoner's Dilemmas. This is a crucial distinction in social philosophy (Hume vs. Hobbes vs. Lewis).

  3.  **Determine the Grade:**
      *   **Strengths:** Good intuitive grasp of coordination problems (part a). Good explanation of arbitrariness (part a). Knows Schelling's connection (part b). Knows precedent creates salience (part b).
      *   **Weaknesses:** Fundamental misunderstanding of the role of agreement (part b). Fundamental misunderstanding of the source of stability (preferences/expectations vs. sanctions) (part c). Fundamental conflation of Coordination Problems vs. Collective Action/Prisoner's Dilemma (part c).
      *   **Level:** Second-year module. Students should know the difference between Coordination and PD by this stage. They should know Lewis argues *against* agreement.
      *   **UK Scale:**
          *   70+ (First): Requires excellent understanding, critical engagement, no major errors. This has major errors.
          *   60-69 (2:1): Good understanding, some minor errors. These errors are not minor; they strike at the heart of Lewis's theory.
          *   50-59 (2:2): Adequate understanding, but significant misconceptions. This fits better. The student knows the vocabulary (salience, precedent, coordination) but misapplies the core mechanics (agreement, sanctions, PD vs Coordination).
          *   40-49 (Third): Bare pass. Some right, but mostly wrong. The student gets part (a) mostly right.
      *   **Decision:** The conflation of Coordination Problems with Collective Action Problems (Overfishing) is a serious conceptual error in a social philosophy module covering Lewis/Hume. The claim that Lewis relies on "explicit agreement" contradicts the central thesis of *Convention*. However, the student *does* understand the basic intuition of coordination (driving example) and arbitrariness.
      *   It's a high 2:2 or a low 2:1. Given the instruction "Don't hold back on the subtle stuff, the module convenor is always telling us we let conflations slide," I need to be strict. The conflation of Coordination vs. PD is a classic fail point in this literature. The "agreement" error is also fundamental.
      *   If I'm strict (as requested): This is a 52-55 (2:2). The student has read something about Lewis but hasn't grasped the game-theoretic foundations properly.
      *   If I'm generous: 58 (high 2:2).
      *   Let's aim for a solid 2:2 (54%). The first paragraph is good (60% level), the second is okay (common knowledge), but the third and fourth paragraphs contain fundamental theoretical errors that undermine the whole answer.
      *   Actually, looking closer at Part (c): The question asks "Does Lewis's account explain the stability...?" The student says "Yes... via sanctions." This is a wrong answer to the question based on Lewis's text. Lewis says stability comes from self-enforcing expectations. The student says it comes from external sanctions. This is a misunderstanding of the text.
      *   The "agreement" point in (b) is also a direct contradiction of Lewis.
      *   So, Part (a) is good. Part (b) is mixed (Schelling/precedent good, agreement bad). Part (c) is largely wrong (sanctions/PD conflation).
      *   Weighting: (a) 33%, (b) 33%, (c) 33%.
      *   (a) ~65%
