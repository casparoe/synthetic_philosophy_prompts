answer: |-
  # Seminar Handout: Diagnostic Tree for Indirect Normativity

  **Starting Commitment:** An act's deontic status is not settled by what the agent's own actual deliberation would deliver, but by what an idealised version of that deliberation would deliver.

  **Instructions:** Answer the following questions by selecting the option that best matches your intuition about the specific case described. Do not attempt to identify the philosophical position yet; simply follow the path indicated by your answers to the terminal leaves. Record your path (e.g., 1A → 2B → 3A…) rather than collapsing it into a score.

  ---

  ### The Diagnostic Instrument

  **1. Anchoring (The Oppressed Agent)**
  *Case:* An agent's actual desires are deformed by upbringing or oppression, leading them to desire their own subordination.
  *   **A:** The idealised deliberator retains these actual desires as inputs, refining only the means to satisfy them.
  *   **B:** The idealised deliberator replaces these desires with objective aims or flourishing, disregarding the agent's actual motivational set.
      *(Proceed to 2)*

  **2. Information (The Concept Gap)**
  *Case:* An agent lacks the concepts needed to grasp decisive information even when it is handed to her.
  *   **A:** The idealised deliberator is supplied with that information regardless of the agent's conceptual capacity.
  *   **B:** The idealised deliberator is limited to evidence the agent could have gathered and grasped within a realistic span.
      *(Proceed to 3)*

  **3. Powers (The Physician)**
  *Case:* A physician chooses between two drugs on asymmetric evidence requiring complex statistical integration.
  *   **A:** Deliberation is idealised as costless and computationally unbounded; all data is processed instantly.
  *   **B:** Deliberation is bounded but cleansed of bias, distraction, fatigue, and weakness of will.
      *(Proceed to 4)*

  **4. Target (The Trust Case)**
  *Case:* Deliberating about whether to trust a friend is itself what destroys the trust.
  *   **A:** The idealised deliberator chooses to trust directly as the output of their calculation.
  *   **B:** The idealised deliberator concludes that the agent ought to bypass deliberation entirely to trust successfully.
      *(Proceed to 5)*

  **5. Uptake-Sensitivity (Partial Compliance)**
  *Case:* An idealised advisor knows the agent will comply only partially with any recommendation due to weakness.
  *   **A:** The recommendation changes to accommodate this predicted failure (e.g., a second-best option).
  *   **B:** The recommendation remains optimal for full compliance, ignoring the likelihood of failure.
      *(Proceed to 6)*

  **6. Indirectness (The Decision Procedure)**
  *Case:* General deliberation on moral action.
  *   **A:** The output of the idealised deliberation is itself the procedure the real agent should try to follow.
  *   **B:** The real agent should follow a different rule or disposition selected by the idealised deliberation.
      *(If A, proceed to 9. If B, proceed to 7)*

  **7. Reason for Indirectness (The Barrier)**
  *Case:* General deliberation where the procedure is separated from the criterion.
  *   **A:** The separation is required because calculating causes error, corruption, or self-deception.
  *   **B:** The separation is required because others need assurance you will not calculate (coordination).
      *(Proceed to 10)*

  **8. Vindication (The Source of Authority)**
  *Case:* General justification of the recommended procedure.
  *   **A:** The procedure is vindicated because it leads to the best outcome defined by the criterion.
  *   **B:** The procedure is vindicated because it satisfies an independent standard of practical rationality or coherence.
      *(Note: This node applies to both Direct and Indirect paths where relevant distinctions remain. If you came from 6A, answer here then go to 9. If from 7, answer here then go to 10.)*
      *(Correction for Tree Flow: To maintain strict branching, answer 8 only if you came from 6A. If from 6B, proceed to 10.)*
      *(Revised Flow for 6A Path: 6A → 9 → 8 → Leaf)*
      *(Revised Flow for 6B Path: 6B → 7 → 10 → Leaf)*
      *(Let's standardise: 6A goes to 9. 6B goes to 7. 9 goes to 8. 7 goes to 10.)*

  **9. Modality (The Action-Guidance)**
  *Case:* General relation between ideal agent and real act.
  *   **A:** The right act is what the idealised deliberator *would do* in the agent's shoes.
  *   **B:** The right act is what the idealised deliberator would *rank first*, even if they could not do it themselves.
      *(Proceed to 8)*

  **10. Self-Effacement (The Scope)**
  *Case:* A theory that advises the agent not to believe the theory itself.
  *   **A:** This advice is global; the agent should never explicitly adopt the theory.
  *   **B:** This advice is local; the agent should adopt the theory only in specific high-stakes deliberations.
      *(Proceed to Leaf)*

  ---

  ### Terminal Leaves (Positions)

  **1. Idealised Act Consequentialism**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6A, 9A, 8A.
  *Awkward Commitment:* Demands impossible calculation from real agents while judging them by that standard.

  **2. Bounded Act Consequentialism**
  *Path:* 1B, 2B, 3B, 4A, 5B, 6A, 9A, 8A.
  *Awkward Commitment:* Struggles to define 'reasonable' bounds non-arbitrarily without collapsing into actual deliberation.

  **3. Subjective Ideal Advisor Theory**
  *Path:* 1A, 2A, 3A, 4B, 5B, 6A, 9A, 8A.
  *Awkward Commitment:* May vindicate oppressive projects if the agent's deformed desires are retained as anchors.

  **4. Objective Ideal Advisor Theory**
  *Path:* 1B, 2A, 3A, 4B, 5B, 6A, 9A, 8A.
  *Awkward Commitment:* Loses connection to the agent's actual practical identity, making advice alien.

  **5. Satisficing Consequentialism**
  *Path:* 1B, 2A, 3A, 4A, 5A, 6A, 9A, 8A.
  *Awkward Commitment:* Permits sub-optimal acts without providing clear cut-off points for 'good enough'.

  **6. Rule Consequentialism (Assurance Model)**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6B, 7B, 10B.
  *Awkward Commitment:* May require following rules known to be sub-optimal in specific cases to maintain coordination.

  **7. Motive Consequentialism (Corruption Model)**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6B, 7A, 10B.
  *Awkward Commitment:* Suggests moral improvement (e.g., honesty) might be instrumentally irrational for some agents.

  **8. Global Self-Effacing Consequentialism**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6B, 7A, 10A.
  *Awkward Commitment:* The theory claims to be true but advises no one to believe it, creating pragmatic paradox.

  **9. Local Self-Effacing Consequentialism**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6B, 7A, 10B.
  *Awkward Commitment:* Creates an unstable boundary between when to believe the theory and when to suppress it.

  **10. Rationalist Constructivism**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6A, 9A, 8B.
  *Awkward Commitment:* May divorce morality from actual good outcomes entirely in favour of coherence.

  **11. Hybrid Ranking View**
  *Path:* 1B, 2A, 3A, 4A, 5B, 6A, 9B, 8A.
  *Awkward Commitment:* Distinguishes rightness from choice-worthiness without clear action-guidance for the agent.

  **12. Unnamed View (Bounded Objectivism)**
  *Path:* 1B, 2B, 3B, 4A, 5B, 6A, 9A, 8B.
  *Awkward Commitment:* Combines objective standards with human limits incoherently, lacking a clear vindication story.

  ---

  ### Unoccupied Logical Space

  The following combinations of answers yield no stable leaf in the current literature:

  *   **1A + 2A + 3A + 6B:** *Incoherent.* Retaining deformed desires while selecting an indirect procedure for others creates a stability problem in the selection criterion.
  *   **5A + 6A:** *Unattractive.* Accommodating failure while demanding direct adherence to the accommodated procedure invites strategic manipulation by the agent.
  *   **3A + 2B:** *Incoherent.* Computationally unbounded processing is logically incompatible with evidence limits based on realistic gathering spans.
  *   **7B + 10A:** *Unexplored.* Assurance-based indirectness is rarely argued to require global self-effacement rather than local discretion.

  ### Diagnostic Limitations

  *   **Leaves 8 and 9 (Global vs Local Self-Effacement):** The tree cannot fully separate these if the agent's definition of 'high-stakes' varies; the distinction relies on the theorist's stipulation of scope rather than the agent's deliberative output.
  *   **Leaves 1 and 11 (Do vs Rank):** In many concrete cases, what the ideal deliberator would do and what they would rank first coincide, making this distinction diagnostic only in cases of constraint.

  ---

  **Usage Note:** This instrument is designed to map the logical topology of your commitments, not to score your correctness. A student's route through the tree should be recorded as a path, not collapsed into a total score.
