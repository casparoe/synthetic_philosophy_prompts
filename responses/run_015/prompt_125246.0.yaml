  # FINE-TUNING LOGICAL SPACE MAP

  **Instructions:** Start at Q1. Answer **Y** (Yes), **N** (No), or **-** (Skipped/Does Not Apply). Follow the arrows. Record your path code (e.g., N-N-Y...). Match the code to a Leaf.

  ### THE BRANCH QUESTIONS

  **Q1. Parameterization:** Is the sensitivity an artifact of varying constants while holding laws fixed?
  *   **Y** → Go to **Leaf 1**.
  *   **N** → Q2.

  **Q2. Measure:** Is there a well-defined measure over theory space to calculate "fraction of life-permitting universes"?
  *   **N** → Go to **Leaf 1**.
  *   **Y** → Q3.

  **Q3. OSE Sufficiency:** Does the fact that we exist screen off the need for a causal explanation?
  *   **Y** → Q4.
  *   **N** → Q5.

  **Q4. Reference Class:** Are we a random sample from the class of all possible observers?
  *   **N** → Go to **Q5** (OSE fails without sampling).
  *   **Y** → Go to **Leaf 2**.

  **Q5. Mechanism Type:** Is our universe *typical* (one of many) or *aimed-at* (constrained to be this way)?
  *   **Typical** → Q6.
  *   **Aimed** → Q8.
  *   **Neither** → Go to **Leaf 3**.

  **Q6. Ensemble Origin:** Is the ensemble generated by physical processes within spacetime?
  *   **N** (Mathematical/Modal) → Go to **Leaf 4**.
  *   **Y** (Physical) → Q7.

  **Q7. Law Variation:** Does the ensemble vary fundamental laws, or just constants/initial conditions?
  *   **Laws** → Go to **Leaf 4** (Merged with Modal).
  *   **Constants** → Q8.

  **Q8. Filtering/Measure:** Does the generation mechanism favor complex structures over minimal fluctuations?
  *   **N** (Blind) → Go to **Leaf 5**.
  *   **Y** (Filtered) → Go to **Leaf 6**.

  **Q9. Constraint Source:** (From Q5 Aimed) Is the constraint imposed by an intentional agent?
  *   **Y** → Go to **Leaf 7**.
  *   **N** → Go to **Leaf 8**.

  ---

  ### THE LEAVES

  | Code | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Y- - -** | **The Illusionist** | The sensitivity is a modeling error; "fine-tuning" dissolves under better physics. |
  | **- - Y Y** | **Bare Anthropic** | We owe no explanation beyond "we couldn't observe otherwise" (SIA/SSA dependent). |
  | **- - N N** | **Brute Fact** | Our universe is a single, low-probability luck-out with no mechanism or selection. |
  | **- - T N M** | **Modal Realist** | All mathematical structures exist; we are in one of them (Tegmark Level IV). |
  | **- - T Y C N** | **Standard Multiverse** | Eternal Inflation/String Landscape; must explain why we aren't Boltzmann Brains. |
  | **- - T Y C Y** | **Cosmological Natural Selection** | Universes reproduce via black holes (Smolin); requires unknown physics linking BHs to life. |
  | **- - A Y** | **Theistic Design** | An agent intended these constants; must explain the agent's origin/nature. |
  | **- - A N** | **Axiological Necessity** | Value or Logic necessitates these constants; implies a normative fabric to reality. |

  *(Code Key: T=Typical, A=Aimed, M=Modal, C=Constants, N=No, Y=Yes)*

  ---

  ### EMPTY & COLLAPSED CELLS

  1.  **Modal Realism vs. Axiological Necessity:** These are functionally indistinguishable from inside the universe. If "All Math Exists" and "Value Necessitates This Math," the observational predictions are identical. The tree separates them by *ontology* (everything vs. only the good), but you cannot empirically tell them apart.
  2.  **Bare Anthropic vs. Brute Fact:** Predictively equivalent. Both say "expect nothing else." The split is purely about whether you feel an explanation is *owed* (philosophical taste, not physics).
  3.  **Law Variation vs. Modal Realism:** Merged into Leaf 4. If laws vary physically, you eventually hit the question of whether *all* consistent laws exist. If yes, you are a Modal Realist. If no, you need a meta-law explaining which laws are allowed, which pushes you back toward "Aimed" or "Illusion."
  4.  **The "God of the Gaps" Cell:** (Aimed + Agent + No Mechanism). If you claim an Agent but deny the Agent is subject to logic/value/necessity, you have posited a brute fact with extra steps. This collapses into Leaf 3 or Leaf 7 depending on if you define the Agent as necessary.

  ### NOTES ON CHANGES

  *   **Cut #1 (Datum):** Split into Q1 (Parameterization) and Q2 (Measure). This prevents the "it's real" crowd from skipping the measure problem, which is where most fine-tuning arguments die.
  *   **Cut #2 (OSE):** Q3 and Q4 enforce the distinction between "OSE explains it" and "OSE applies." Many claim the former without accepting the random-sampling assumption required for the latter (Q4). If they fail Q4, they are routed to Mechanism (Q5), correctly identifying that their OSE claim was insufficient.
  *   **Cut #3 (Typical vs. Aimed):** Q5 is the main split. Q6/Q7 handle the "Same Laws vs. Law Variation vs. Everything" requirement. Q8 handles the "Filtering" requirement and doubles as the Boltzmann Brain diagnostic (Blind ensembles predict BBs; Filtered ensembles do not).
  *   **BB Diagnostic:** Q8 forces the Typicality branch to declare if their ensemble is "Blind" (Leaf 5, must swallow BBs) or "Filtered" (Leaf 6, avoids BBs but needs new physics).
