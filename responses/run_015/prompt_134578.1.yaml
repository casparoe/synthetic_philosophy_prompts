answer: |-
  # Q&A Prep Sheet: Reconstructing the Protestant Ethic

  **Strategy Overview:** Your goal is to pivot the room from *estimating an effect size* to *evaluating an ontological claim*. You must validate the economists' skepticism about the traditional thesis (to gain credibility) while arguing that their tools are category errors for your specific claim (to protect your thesis).

  ### I. The Opening Concession (First 60 Seconds of Talk)
  **Do not wait for Q&A to admit the traditional thesis is dead.**
  *   **Say this:** "I begin by conceding to the historians and economists in the room: if Weber's thesis is read as a standard causal claim—that Protestant confession caused higher growth rates—the data has spoken, and the thesis is false. Better identification has shrunk that coefficient to zero. I am not here to revive that claim. I am here to argue that reading it as a causal claim is why it fails, and that a constitutive reading saves the insight without violating the data."
  *   **Why:** This disarms the economists (you agree with their findings) and the historian (you agree the empirical basis is dismantled) before they can attack you. It frames your paper as a *solution* to their skepticism, not a denial of it.

  ---

  ### II. The Eight Objections (Ordered by Etiquette & Damage)

  #### 1. The Identification Challenge (Economist)
  *   **Phrasing:** "If the vocabulary constitutes the action, you've made the claim unfalsifiable. Any behavior can be retroactively described as fitting the vocabulary. If there's no counterfactual where the action exists without the vocabulary, how is this social science and not just hermeneutics?"
  *   **Damage:** **Critical.** If this sticks, the paper is dismissed as philosophy, not political economy.
  *   **Reply (2 min):** "It is falsifiable, but not via regression. The falsification condition is the *lag*. If we find aggregate capitalist behavior *preceding* the diffusion of the specific vocabulary of 'calling' and 'scruple' in a region, the constitutive claim fails. We are testing the *sequence of description*, not the correlation of variables. It moves the method from causal inference to process tracing, which is valid social science when the variable is ontological."
  *   **Soft Spot:** Process tracing is often viewed as "soft" by CI-focused economists. If they demand a formal model of the "option space," you may struggle.

  #### 2. The Reverse Causality of the Lag (Economist)
  *   **Phrasing:** "You argue vocabulary follows conduct, then locks it in. But isn't it more likely that economic opportunities changed first, and agents developed the vocabulary to justify their new behavior? That's standard ideological superstructure, not constitutive."
  *   **Damage:** **High.** Reverts your thesis to standard materialism.
  *   **Reply (2 min):** "If it were just justification, we wouldn't see the *scruples* you find in diaries—specifically guilt over *idle* wealth. Justification rationalizes gain; the Protestant Ethic generates anxiety about *consumption*. The empirical signature I'm looking for is not 'I made money so I call it a calling,' but 'I am afraid to spend this money because I cannot describe it as godly.' That psychological friction is the observable."
  *   **Soft Spot:** Diaries are anecdotal. An economist can argue selection bias in whose diaries survived.

  #### 3. The Mechanism Black Box (Economist)
  *   **Phrasing:** "You say it changes the 'space of options.' Mechanically, how? Does it change transaction costs? Information asymmetry? If you can't map this to a constraint in a utility function, how does it push action?"
  *   **Damage:** **Medium.** Annoying, but survivable if you hold the ontological line.
  *   **Reply (2 min):** "It changes the *cost of description*, not the transaction cost. In standard models, agents choose between X and Y. Here, the vocabulary makes X *unintelligible* as a choice. It's not that X is more expensive; it's that X cannot be formulated as a maximization problem. That's why standard tooling misses it—it assumes the menu is fixed."
  *   **Soft Spot:** Economists may reject "unintelligible" as a variable. They want a shadow price.

  #### 4. The "So What?" for Policy/History (Economist)
  *   **Phrasing:** "Even if you're right, what does this buy us? If we can't intervene on vocabulary to change growth, is this just a historical curiosity?"
  *   **Damage:** **Low.** Dismissive, but implies irrelevance.
  *   **Reply (2 min):** "It buys us explanatory power for persistence. Causal effects decay; constitutive rules stick. It explains why economic cultures persist long after the original material incentives vanish. For political economy, it suggests that institutional change requires vocabularic change, not just incentive realignment."
  *   **Soft Spot:** "Vocabularic change" sounds vague to a policy-focused audience.

  #### 5. The Power/Elite Objection (Sociologist)
  *   **Phrasing:** "You treat the 'space of options' as neutral. But who controls the vocabulary? Isn't this just a story about how elites disciplined labor by making idleness sinful? You've stripped Weber of power."
  *   **Damage:** **Medium.** Threatens your critical edge.
  *   **Reply (2 min):** "I agree power is central. The 'switchmen' metaphor isn't neutral; it's about who lays the tracks. My claim is that power operates *through* this constitutive mechanism, not just alongside it. Discipline works *because* it changes the description of the self, not just because it threatens punishment. I'm adding a mechanism to the power story, not removing power."
  *   **Soft Spot:** If your paper focuses heavily on individual diaries, you may lack evidence of *elite imposition* of the vocabulary.

  #### 6. The "Iron Cage" Materialism (Sociologist)
  *   **Phrasing:** "Weber's later work emphasizes the material 'iron cage' of bureaucracy overtaking the religious spirit. By focusing on the early vocabulary, aren't you ignoring the structural hardening that actually sustained capitalism?"
  *   **Damage:** **Medium.** Suggests you are cherry-picking Weber.
  *   **Reply (2 min):** "The iron cage is the *result* of the constitutive shift becoming institutionalized. Once the vocabulary becomes secularized, the 'spirit' remains as a constraint even without the religion. My thesis explains the *entry* into the cage. Without the constitutive shift, the cage has no bars, only incentives."
  *   **Soft Spot:** Requires you to be very clear on the transition from religious to secular ethics, which is complex.

  #### 7. The Catholic Capitalist / Timeline Fact (Historian/Chair)
  *   **Phrasing:** "You rely on a lag between vocabulary and conduct. But Catholic merchants in Flanders and Italy were using double-entry bookkeeping and accumulating capital a century before Luther. They had the conduct without the Protestant vocabulary. How do you explain that?"
  *   **Damage:** **Critical.** Direct empirical falsification of the "lag" claim.
  *   **Reply (2 min):** "That is the crucial test. My claim isn't that *accumulation* requires the vocabulary, but that *systematic, rationalized accumulation as a duty* does. The Catholic merchants viewed wealth as a means to an end (status, salvation via charity). The Protestant shift made accumulation the *end itself* under the description of 'calling.' The lag I'm tracking is not trade, but the *moral normalization of reinvestment over consumption*."
  *   **Soft Spot:** The line between "means" and "end" is blurry in historical data. The Historian may have receipts showing Catholic reinvestment for its own sake.

  #### 8. The Interventionist Coherence (Philosopher)
  *   **Phrasing:** "I work with interventionist causation. If I cannot manipulate the vocabulary without manipulating the outcome by definition, is this causation or just semantics? If the variables aren't distinct, the causal graph collapses."
  *   **Damage:** **Low/Medium.** Conceptual, but validates the economists' skepticism.
  *   **Reply (2 min):** "It is not causation in the manipulationist sense; it is *constitution*. In interventionism, we assume the relata exist independently. Here, the relata (the actions) are dependent on the framework. I'm arguing that for social kinds, the 'intervention' must be on the *classification system* itself. It's a different model of explanation, compatible with interventionism only if we allow the 'variables' to be semantic structures."
  *   **Soft Spot:** Philosophers may argue you are just relabeling "cause" to avoid falsification.

  ---

  ### III. The "Must Land" Reply
  **The Reply to Objection #1 (Identification/Unfalsifiability).**
  *   **Why:** If the economists leave the room thinking your theory is untestable mysticism, the paper will not be cited or taken seriously in a political economy context. You must convince them that *process tracing the lag* is a rigorous empirical strategy, not a retreat from rigor.
  *   **Key Phrase to Use:** "I am not asking you to abandon identification; I am asking you to identify the *constitution of the variable*, not just its effect."

  ---

  ### IV. The Question You Hope Nobody Asks
  **The Question:** "Can you give me a concrete example of an economic action that was *impossible* for a Catholic to conceive of, but *possible* for a Protestant, solely due to vocabulary? If the action is the same (e.g., reinvesting profit), isn't the 'description' just epiphenomenal?"
  *   **Why it's dangerous:** It forces your abstract ontological claim into a concrete behavioral box. If you say "No, the action looks the same," you concede the description doesn't matter. If you say "Yes, they did different things," the Historian will produce a counter-example.
  *   **How to Answer:** "The action *looks* the same physically (moving coin A to account B), but it is a *different social act*. For the Catholic, it is 'stewardship' (revocable, for community). For the Protestant, it is 'calling' (obligatory, systematic). The 'impossibility' isn't physical; it's *normative*. A Protestant *could* physically consume the capital, but they could not do so *as a virtuous agent*. The constraint is on the *identity of the actor*, not the physics of the market."
  *   **Risk:** This leans heavily on the "identity" argument, which some materialists reject as "ideas in the head." Hold firm that social reality *is* constructed by these identities.
