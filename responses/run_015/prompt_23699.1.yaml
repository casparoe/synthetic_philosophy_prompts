answer: |-
  This is a classic game theory problem called the **Shubik Dollar Auction**, devised by economist Martin Shubik in 1971. It is famous specifically because it breaks our intuition about what "rational" means.

  Your friends have stumbled onto one of the deepest debates in economics and philosophy: **Time Inconsistency.**

  Here is the breakdown of who is right about what, where they are wrong, and the piece of the puzzle both of them are missing.

  ### 1. Jake's Argument: "Local Rationality"
  **Jake says:** *At the specific moment you are at $98 vs. $99, bidding $100 is the only rational move because it minimizes immediate loss.*

  *   **Where Jake is Right:** Mathematically, in that exact isolated second, Jake is correct. This is called **myopic rationality**.
      *   **Option A (Stop):** You lose the $98 you already bid. Net: -$98.
      *   **Option B (Bid $100):** If the other person stops, you pay $100, get $100. Net: $0.
      *   From a purely accounting standpoint at *t=now*, losing $0 is better than losing $98. Jake is correctly identifying that the $98 is a **sunk cost**. It is gone. The only decision that matters is future money.
  *   **Where Jake is Wrong:** He is treating a **sequential game** as a **one-off decision**.
      *   Rationality isn't just about the current move; it's about anticipating the *next* move. If Jake bids $100, the other player is now in the exact same position Jake was in at $98. They will reason exactly like Jake and bid $101.
      *   By arguing that "any rational person breaks the promise," Jake is admitting that a "rational" person is incapable of winning this game. If rationality guarantees you lose $200 for a $100 bill, is it really rationality? Or is it a flaw in the definition?

  ### 2. Maya's Argument: "Global Rationality"
  **Maya says:** *Rationality is about the strategy you pick at the start. You must pre-commit to a cap or not play, even if your future self wants to break it.*

  *   **Where Maya is Right:** She is correct about **strategic rationality**.
      *   In game theory, the only way to win the Dollar Auction is to recognize the trap *before* you enter it. This is called an **Ex-Ante** (before the event) vs. **Ex-Post** (after the event) analysis.
      *   She is describing a **Ulysses Contract**. Just as Ulysses tied himself to the mast so he couldn't steer into the Sirens (even though future-Ulysses wanted to), a rational player must bind their future self to avoid the escalation trap.
      *   She correctly identifies that if "rationality" means "always minimize immediate loss," you end up in an infinite loop of losses. Therefore, that definition of rationality must be flawed.
  *   **Where Maya is Wrong:** She glosses over the **enforcement problem**.
      *   She says you "cap your bid and stick to it." But in a casual lunch auction, there is no contract. There is no judge.
      *   If Jake is at $98, what physically stops him from bidding $100? Nothing. Maya's strategy requires a "commitment device" (like giving a friend $500 and telling them to burn it if you bid over $50). Without an external enforcer, her "promise" is just words, and Jake is right that words break under financial pressure.

  ### 3. What Both of Them Are Missing
  There are two major concepts neither of them fully articulated that resolve the tension between their views.

  **A. The Only Winning Move is $0**
  Both friends are arguing about how to play the game *once it has started*. The consensus among game theorists is that the only truly rational move is **not to bid at all**, or to bid $1 and hope the other person is rational enough not to respond.
  *   Once the bidding passes 50 cents, the total money committed by the two players exceeds the prize.
  *   Once the bidding passes $1.00, the *winner* starts losing money too.
  *   Maya hints at this ("deciding not to even enter"), but Jake dismisses it because he's focused on the heat of the moment. The "rational" solution is to refuse to participate in a game with negative expected value.

  **B. Credible Commitment vs. Cheap Talk**
  This is the bridge between Jake and Maya.
  *   Jake says: "You can't bind yourself."
  *   Maya says: "You must bind yourself."
  *   **The Missing Link:** You can bind yourself, but only if the commitment is **credible**.
      *   If I just say "I won't bid past $50," that is *cheap talk*. Jake is right that I will break that.
      *   If I publicly announce, "If I bid over $50, I will punch myself in the face," that is a **credible commitment**. Now, when I get to $50, the pain of punching myself outweighs the loss of $50.
      *   Maya is right that commitment is necessary, but Jake is right that without a *mechanism* to enforce it, the commitment is fake. Rationality involves setting up those mechanisms *before* the emotion of the auction kicks in.

  ### The Verdict

  **Who is right?**
  *   **Jake is right about the *moment*.** If you find yourself in the trap without a pre-commitment device, his logic holds. You *will* feel compelled to bid $100. To say otherwise is to ignore human psychology and immediate incentives.
  *   **Maya is right about the *game*.** If you define "rational" as "maximizing your total wealth," her strategy is the only one that works. A rational agent anticipates the trap and avoids it.

  **The Honest Truth for the Table:**
  You can tell them they are both describing different types of rationality, and that's why they are talking past each other.
  *   Jake is describing **Instrumental Rationality** (doing the best thing *right now* to achieve a goal).
  *   Maya is describing **Strategic Rationality** (choosing the best *system* to achieve a goal over time).

  **The Tie-Breaker:**
  Maya wins on **theory**, but Jake wins on **reality**.
  In a textbook with perfect robots, Maya is right; the robots calculate the end state and don't bid. In the real world with humans, Jake is right; once the blood is up and the loss is real, almost everyone escalates past $100.

  **The Solution:**
  The only way to satisfy both is to agree that **the rational move is to laugh, refuse to bid, and order dessert.** Anyone who bids is already irrational, regardless of how they justify the math later.
