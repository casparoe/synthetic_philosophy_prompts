  # Diagnostic Taxonomy: Lakatosian Research Programme Commitments

  ## Decision Tree Structure

  **Root Question:** "When a mature research programme encounters a persistent empirical anomaly, is its hard core ever rationally revisable?"
  *   **YES:** (Revisionist Branch)
  *   **NO:** (Protectionist Branch)

  **Dimension 1 (Constitution):** "Is the protected element best understood as a cluster of metaphysical commitments rather than a methodological rule or unprotected network?"
  *   **YES:** (Metaphysical Core)
  *   **NO:** (Methodological Rule or Unprotected Network)

  **Dimension 2 (Normative):** "Does rationality require that changes to the protective belt generate novel predictions (progressive problem-shift) rather than merely preserving explanatory coherence?"
  *   **YES:** (Novelty Required)
  *   **NO:** (Coherence Sufficient)

  **Dimension 3 (Meta-Methodological):** "Is the distinction between progressive and degenerating programmes an empirical-historical judgment that can be shown false by the record of science?"
  *   **YES:** (Empirical-Historical)
  *   **NO:** (Normative-Reconstructive)

  ***

  ## Terminal Leaves (N=8)

  *Note: To satisfy the leaf count constraint, branches where distinctions become logically moot (e.g., evaluating the status of a degenerating programme, or applying Lakatosian criteria to a revisable core) are terminated early. These are marked as **Collapsed Distinctions**.*

  ### Branch A: Root = YES (Core is Revisable)
  *In this branch, the concept of a "Hard Core" is effectively dissolved. Dimensions 2 and 3 collapse because Lakatosian criteria presuppose an irrevisable core.*

  **Leaf 1**
  *   **Path:** Yes → Dim 1: Yes (Metaphysical) → [Dims 2-3 Collapsed]
  *   **(a) Position:** **Incoherent Revisionism** (Unoccupied)
  *   **(b) Awkward Commitment:** One must defend a metaphysical commitment that is simultaneously immune to refutation and open to rational revision.
  *   **(c) Diagnosis:** **Incoherent.** A "metaphysical hard core" is defined by its irrefutability; making it revisable dissolves the category into ordinary theoretical adjustment.

  **Leaf 2**
  *   **Path:** Yes → Dim 1: No (Network/Method) → [Dims 2-3 Collapsed]
  *   **(a) Position:** **Radical Pragmatism** (e.g., late Feyerabend or Rortyian variants)
  *   **(b) Awkward Commitment:** There is no structural distinction between core and belt, so theory choice is determined solely by transient social or pragmatic utility.
  *   **(c) Diagnosis:** **Unexplored Hybrid.** While Pragmatism exists, few explicitly frame it as a "revisable research programme," preferring to abandon the MSRP vocabulary entirely.
  *   **⚠️ Collapsed Distinction:** This leaf cannot separate **Critical Rationalism** (Popper) from **Epistemological Anarchism** (Feyerabend). Both reject an irrevisable core, rendering the specific Lakatosian criteria of novelty (Dim 2) and historical evaluation (Dim 3) inapplicable or identical in outcome.

  ### Branch B: Root = NO (Core is Irrevisable)
  *In this branch, the Hard Core exists. Dimension 3 collapses if Dimension 2 is rejected, because the status of evaluation is moot for programmes that do not require progress.*

  **Leaf 3**
  *   **Path:** No → Dim 1: Yes (Metaphysical) → Dim 2: Yes (Novelty) → Dim 3: Yes (Empirical)
  *   **(a) Position:** **Orthodox Lakatosianism**
  *   **(b) Awkward Commitment:** One must accept that a theory can be rationally retained despite known falsifications, provided it predicts novel facts, even if history shows scientists often acted otherwise.
  *   **(c) Diagnosis:** **Occupied.** This is the standard MSRP position.

  **Leaf 4**
  *   **Path:** No → Dim 1: Yes (Metaphysical) → Dim 2: Yes (Novelty) → Dim 3: No (Normative)
  *   **(a) Position:** **Rationalist Reconstructionism** (e.g., certain readings of Laudan)
  *   **(b) Awkward Commitment:** The history of science is treated as a court of appeal that is systematically corrected by the philosopher's normative model when they diverge.
  *   **(c) Diagnosis:** **Occupied.** Represents the "internalist" reading of MSRP where the methodology dictates the history, not vice versa.

  **Leaf 5**
  *   **Path:** No → Dim 1: Yes (Metaphysical) → Dim 2: No (Coherence) → [Dim 3 Collapsed]
  *   **(a) Position:** **Dogmatic Conventionalism** (e.g., Duhemian variants)
  *   **(b) Awkward Commitment:** A research programme can be rational even if it never produces novel predictions, provided it maintains internal consistency.
  *   **(c) Diagnosis:** **Unmotivated.** Few philosophers defend a research programme that is immune to falsification *and* exempt from the requirement of progress, as this renders the programme scientifically sterile.
  *   **⚠️ Collapsed Distinction:** This leaf cannot separate **Kuhnian Paradigm Normal Science** from **Degenerating Lakatosian Programmes**. Both allow for puzzle-solving without novelty; the tree cannot distinguish a "healthy" normal science from a "degenerating" programme without invoking the collapsed Dimension 3.

  **Leaf 6**
  *   **Path:** No → Dim 1: No (Methodological) → Dim 2: Yes (Novelty) → Dim 3: Yes (Empirical)
  *   **(a) Position:** **Methodological Fallibilism** (e.g., Worrall's structural realism)
  *   **(b) Awkward Commitment:** The hard core is merely a methodological rule, yet violating it is treated with the same severity as an empirical falsification.
  *   **(c) Diagnosis:** **Occupied.** Represents a softened MSRP where the core is protected by decision, not metaphysics, but progress is still empirically tracked.

  **Leaf 7**
  *   **Path:** No → Dim 1: No (Methodological) → Dim 2: Yes (Novelty) → Dim 3: No (Normative)
  *   **(a) Position:** **Procedural Rationalism** (e.g., certain sociological adaptations)
  *   **(b) Awkward Commitment:** The rules of scientific procedure are normative constructs that may have no correspondence to the actual historical success of the programmes they evaluate.
  *   **(c) Diagnosis:** **Unexplored.** Most methodological accounts seek some empirical validation; a purely normative proceduralism is rare in post-Lakatosian literature.

  **Leaf 8**
  *   **Path:** No → Dim 1: No (Methodological) → Dim 2: No (Coherence) → [Dim 3 Collapsed]
  *   **(a) Position:** **Bureaucratic Science** (Unnamed Hybrid)
  *   **(b) Awkward Commitment:** Science is a set of methodological rules that require only consistency, allowing for indefinite stagnation without rational grounds for theory change.
  *   **(c) Diagnosis:** **Incoherent.** If the core is only methodological (not metaphysical) and novelty is not required, there is no mechanism to prevent arbitrary theory change or stagnation, defeating the purpose of a "programme."
  *   **⚠️ Collapsed Distinction:** This leaf cannot separate **Static Conventionalism** from **Administrative Science**. Without the requirement for novelty (Dim 2) or empirical evaluation (Dim 3), the distinction between a stagnant theory and a rule-bound bureaucracy collapses.

  ***

  ## Structural Notes on Collapsing Distinctions

  1.  **Root = YES (Leaves 1 & 2):** The distinction between **Novelty** (Dim 2) and **Coherence** (Dim 2) collapses. If the hard core is revisable, the specific MSRP mechanism of "protecting the core to allow for novel predictions from the belt" is inoperative. All such positions default to general theory-choice criteria.
  2.  **Dim 2 = NO (Leaves 5 & 8):** The distinction between **Empirical** (Dim 3) and **Normative** (Dim 3) collapses. If a programme does not require novel predictions (Degenerating/Static), evaluating whether that judgment is empirical or normative is moot; the programme is rationally stagnant regardless of the meta-methodological status.
