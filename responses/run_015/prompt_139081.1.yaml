answer: |-
  Here is a reconstruction of the implicit theory governing our treatment of the dead, an analysis of its consistency, and a proposal for a coherent practice.

  ### I. Reconstructing the Implicit Theory

  To understand what we owe the real dead (given they have no welfare interests), we must distinguish between what our current practices *strictly presuppose* to function and what merely *fits comfortably* alongside them.

  **1. What Practice Strictly Presupposes**
  *   **The Persistence of Narrative Identity:** The practice presupposes that a person constitutes a "narrative identity" that survives biological cessation. While the *subject* is gone, the *object* (the public persona) remains a fixed point in the shared reality. If the dead were merely dust, the historian's ban on invention would be unintelligible; there would be no "truth" to violate.
  *   **Domain-Specific Ontology:** The practice presupposes a hard boundary between the *Epistemic Domain* (History) and the *Aesthetic Domain* (Drama). In the former, the dead are evidence; in the latter, they are symbols. The norms only hold if we accept that a single human life can simultaneously be a data point (forbidden to alter) and a mythic archetype (permitted to alter).
  *   **The Survivorship of Dignity-as-Property:** The legal shift toward inheritable likeness rights presupposes that "dignity" or "reputation" transforms into an asset upon death. It is no longer a right of personality (which dies) but a right of property (which persists).

  **2. What Merely Fits Comfortably**
  *   **Respect for Legacy:** The idea that we owe the dead "respect" fits the norms but is not required by them. A historian could refuse to invent dialogue purely to maintain data integrity without feeling any reverence for the subject.
  *   **Emotional Truth:** The defense that biopics convey "deeper truths" through invention fits the dramatic convention comfortably but contradicts the historical convention. It is a post-hoc justification, not a structural necessity.

  ### II. Evaluating the Candidate Accounts

  You propose two accounts: **Anti-Deception** (duty to the living audience) and **Answerability** (duty to the subject's agency).

  **The Failure of Answerability**
  Your counter-example of the living but non-responsive (unconscious, dementia) is decisive. If the duty were based on *answerability* (the right to correct the record), the permanently unconscious and the dead should be treated identically: both lack the capacity to reply.
  However, practice treats the unconscious living as *hyper-protected*. We require surrogate consent for their medical narrative, their image, and their story. This confirms that the protection is not about the *capacity to answer*, but about the *capacity to suffer* or the *moral status of the vessel*.
  Since we have granted for this argument that the dead cannot suffer, the Answerability Account fails. It cannot explain why the voiceless living are shielded more rigorously than the voiceless dead.

  **The Partial Success of Anti-Deception**
  The Anti-Deception Account explains the historian's constraint well: do not lie to the reader. However, it fails to explain the biopic. If the duty is to prevent audience deception, the "Based on a True Story" card is insufficient, as you note audiences do not discount the drama. If the duty were strictly anti-deception, biopics would be regulated like history books.
  Therefore, the Anti-Deception Account explains the *history* norm but is actively violated by the *drama* norm.

  **The Vulnerability Principle**
  The treatment of the unconscious living points to a **Vulnerability Principle**. We protect entities that cannot protect themselves *proportionate to their remaining moral status*.
  *   **Living Unconscious:** High moral status (human being) + High vulnerability (cannot speak) = Maximum Protection.
  *   **The Dead:** Zero moral status (non-being) + High vulnerability (cannot speak) = Minimum Protection (Property rights only).
  *   **Historical Figures:** Zero moral status + High cultural value = Contextual Protection (High for historians, Low for artists).

  ### III. Consistency and Underdetermination

  **Is the Practice Consistent?**
  No. The current practice is fundamentally inconsistent because it relies on an **Epistemic Schism**.
  It asks the audience to hold two contradictory cognitive frames simultaneously:
  1.  *Frame A:* This person existed, and their life matters (The Historical Frame).
  2.  *Frame B:* This person is a character serving a plot (The Dramatic Frame).

  By allowing filmmakers to use the authority of Frame A (authenticity) to sell the product, while employing the liberties of Frame B (invention), the practice creates a "truth decay." It exploits the dead's vulnerability (they cannot sue for defamation) to bypass the Anti-Deception obligation owed to the living.
  The inconsistency lies here: We forbid the historian from inventing motives because it corrupts the record, but we praise the filmmaker for inventing motives because it clarifies the theme. Both produce the same output in the audience's mind: a belief about the dead person. One is policed; the other is monetized.

  **Where is the Practice Underdetermined?**
  1.  **The "Based on a True Story" Card:** This disclaimer is theoretically underdetermined. It could signal "Epistemic Warning" (History), "Legal Shield" (Defamation avoidance), or "Genre Marker" (Drama). Currently, it functions as a Legal Shield that masquerades as an Epistemic Warning.
  2.  **Right of Publicity:** The law treats likeness as property, but does not define the scope of "distortion." Is a caricature a use of property? Is a psychological misrepresentation a tort? The theory underdetermines where "artistic license" ends and "property damage" begins.

  ### IV. A Coherent Practice

  If we accept that the dead have no welfare interests, the duty is not *to* them, but *regarding* them. The duty is owed to the **Epistemic Commons**—the shared repository of facts and narratives the living use to navigate reality. The dead are the anchors of that commons. When we move the anchors (invent motives/dialogue), we drift the living.

  A coherent practice must align the norms of Drama with the reality of Audience Cognition. Since audiences form historical beliefs from dramas and do not discount them, dramas are functioning as *de facto* history.

  **1. Abolish "Based on a True Story"**
  This phrase is the engine of the deception. It implies a fidelity that the craft does not sustain.
  *   **Replacement:** Use genre-specific labels. "Historical Fiction" or "Dramatization." If a work claims to be a "Biopic," it should be held to a higher standard of fidelity than a "Historical Drama."

  **2. Implement Granular Provenance Markers**
  Since the "Based on a True Story" card is too blunt, we need granular signaling.
  *   **On-Screen Indicators:** When a scene relies on invented dialogue or unrecorded motives, a subtle visual marker (e.g., a specific border, a fade, or an icon) should indicate "Dramatization."
  *   **Digital Companions:** A mandatory, linked resource (QR code or streaming menu) that acts as a "variorum edition" of the film. It should list scene-by-scene deviations from the historical record, distinguishing between *compressed time*, *composite characters*, and *invented psychology*.

  **3. Shift the Legal Standard from Property to Misrepresentation**
  Currently, the dead are protected as *property* (likeness). They should be protected as *data*.
  *   While we cannot give the dead a right against defamation, we can impose a duty of **Non-Misrepresentation** on works that market themselves as historical.
  *   If a filmmaker claims to depict a specific historical figure, they assume a duty of care to the audience's understanding of that figure. Gross negligence in portraying established facts (not artistic interpretation, but factual inversion) should be actionable by estate heirs, not as defamation, but as **consumer fraud**.

  **4. The Vulnerability Standard**
  Apply the logic of the unconscious living to the dead regarding *egregious* distortion.
  *   If a portrayal is so distorted that it would be actionable if the subject were merely unconscious (e.g., attributing heinous, unrecorded crimes), the "Artistic License" defense should be weakened. The vulnerability of the subject (inability to correct) combined with the permanence of the medium creates a duty of care for the creator.

  **Conclusion**
  The current practice is a compromise that privileges the artist's freedom over the audience's epistemic security, using the dead as the buffer. A coherent practice acknowledges that since the dead cannot be harmed, the harm falls entirely on the living viewer's grasp of reality. We owe the dead nothing, but we owe the living a clear distinction between what *happened* and what *makes a good story*. The "Based on a True Story" card is a lie; replace it with a map of the fiction.
