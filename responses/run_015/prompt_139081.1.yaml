prompt: |-
  Professional historians are forbidden to invent. No invented dialogue, no ascription of unrecorded thoughts or motives, no composite minor characters — and the ban holds even when the invention is scrupulously in character, is the only way to make a sparse record legible, and arguably conveys more truth than the documents do. Biopics and historical dramas do exactly that as routine craft, are praised for it, and answer to nothing but a based-on-a-true-story card. Same activity, opposite conventions about the same device. And as I understand it the law lines up with the drama rather than the history: in the common-law world defaming the dead is not a tort at all — the action is personal and dies with the plaintiff — while a dead person's name, image, and likeness are increasingly treated as inheritable, licensable property.

  I want the implicit theory of what we owe the real dead, and I want it split into what the practice strictly presupposes and what merely fits it comfortably. Grant for the sake of argument that the dead have no welfare-level interests: no experiences, no frustratable preferences, nothing a portrayal could be *bad for*. Something still seems to go wrong in some of these cases, and I can see two candidate accounts. One says the duty is really owed to the living — an anti-deception obligation whose object is the audience and the integrity of a shared record, so that nothing is owed to the dead at all. The other says what matters is answerability: a person is entitled to participate in the making of their own public image, and the dead uniquely cannot consent, correct, or reply.

  The case that makes me doubt the second story is a living person who also cannot answer back — someone permanently unconscious, or with advanced dementia, or simply someone who will never learn the film exists and whose standing is unaffected by it. Practice treats those people as *more* protected, not as free material, which looks like a vulnerability principle rather than an answerability one. So: reconstruct the theory the practices actually presuppose, say whether the two halves of it are consistent with each other, tell me where the practice is underdetermined by several theories, and tell me what a coherent practice would look like under the view you defend — on-screen provenance markers, disclaimers, nothing, or something else — especially given that audiences form most of their historical beliefs from dramas and visibly do not discount them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** Professional historians are forbidden from inventing (dialogue, thoughts, composite characters), even if it makes the record legible or conveys "more truth." Biopics/historical dramas do this routinely and are praised for it (with a "based on a true story" disclaimer).
      *   **Legal Context:** Defamation of the dead is not a tort (action dies with the plaintiff). However, rights of publicity (name, image, likeness) are increasingly inheritable/property.
      *   **Constraint/Assumption:** Grant that the dead have no welfare-level interests (no experiences, no preferences, nothing can be *bad for* them).
      *   **Task:**
          1.  Reconstruct the implicit theory of what we owe the real dead (split into what practice *strictly presupposes* vs. what *fits comfortably*).
          2.  Evaluate two candidate accounts:
              *   *Account A (Anti-Deception):* Duty owed to the living/audience/integrity of the record.
              *   *Account B (Answerability/Consent):* Duty owed to the subject's right to participate in their image (but they can't consent).
          3.  Address the Counter-Example: Living but non-responsive people (unconscious, dementia, unaware). Practice treats them as *more* protected, suggesting a "vulnerability principle" rather than "answerability."
          4.  Assess Consistency: Are the two halves of the reconstructed theory consistent?
          5.  Identify Underdetermination: Where does practice allow multiple theoretical explanations?
          6.  Propose a Coherent Practice: What *should* we do? (Provenance markers, disclaimers, etc.), considering audiences trust dramas.

  2.  **Analyze the Candidate Accounts:**

      *   *Account A (Anti-Deception):* Focuses on epistemic hygiene. Historians lie if they invent; filmmakers entertain. The duty is to the truth-seeker.
          *   *Problem:* Doesn't explain why we care about specific *individuals* being misrepresented if the "general truth" is preserved. Doesn't explain the legal shift toward property rights in likeness.
      *   *Account B (Answerability):* Focuses on agency/autonomy. You own your story. Death removes the ability to correct the record.
          *   *Problem:* The prompt notes that non-responsive *living* people are *more* protected. If answerability were key, the unconscious person (who can never answer) should be treated like the dead person (who can never answer). But they aren't. The living unconscious are treated with *more* care. This suggests vulnerability, not just lack of answerability.

  3.  **Reconstructing the Implicit Theory (The "What We Owe" Analysis):**

      *   *Strict Presupposition:* What *must* be true for the current norms to exist?
          *   There is a distinction between "Record" (History) and "Representation" (Art).
          *   There is a residual interest in the *narrative identity* of a person that survives biological death.
          *   The living have a claim to accuracy that the dead do not (legally), but socially/professionally, the dead still command some respect (hence the historian's ban vs. the filmmaker's license).
      *   *Comfortable Fit:* What aligns well but isn't strictly required?
          *   The idea of "dignity" surviving death.
          *   The idea of "legacy" as property.

      *   *The Vulnerability Principle:* The prompt highlights that the living vulnerable (dementia/unconscious) are *more* protected. Why? Because they *could* suffer if they woke up, or because their surrogates exist. The dead cannot suffer. So, if the dead are protected at all, it's not because of *their* welfare.
      *   *Synthesis:* The practice seems to rely on a hybrid: **Stewardship of Narrative Identity.**
          *   To Historians: The dead are data points in a truth-claim. Invention corrupts the data.
          *   To Filmmakers: The dead are raw material for meaning-making. Invention enhances the meaning.
          *   To Law: The dead are property (likeness) but not persons (defamation).

  4.  **Addressing the Consistency Check:**

      *   Are the halves consistent?
      *   *Tension:* Historians treat the dead as sacred truth-bearers. Filmmakers treat them as malleable symbols. Law treats them as assets.
      *   *Inconsistency:* The "Based on a True Story" card acts as a magical shield. It tells the audience "This is truth" while allowing the craft "This is fiction." This creates an epistemic gap.
      *   *The Vulnerability vs. Answerability conflict:* If we protect the unconscious living because they are vulnerable, we should protect the dead *less* (as they are less vulnerable) or the *same* (as they are equally voiceless). But we protect the dead *less* legally, yet historians protect them *more* rigorously than filmmakers.
      *   *Conclusion:* The practice is *inconsistent*. It oscillates between treating the dead as subjects (who deserve truth) and objects (which can be shaped).

  5.  **Identifying Underdetermination:**

      *   Where do multiple theories fit?
      *   The "Right of Publicity" (property) fits both a Lockean labor theory (they built the fame) and a Utilitarian theory (incentivize creation).
      *   The Historian's Ban fits both the Anti-Deception theory (don't lie to readers) and a Virtue Ethics theory (integrity of the historian).
      *   The Filmmaker's License fits both Artistic Freedom and the idea that "Emotional Truth" > "Literal Truth."

  6.  **Developing the Coherent Practice (Normative Proposal):**

      *   *Current State:* Audiences believe dramas. Disclaimers ("Based on a true story") are ignored or misunderstood.
      *   *Goal:* Align practice with the "Stewardship of Narrative Identity" + "Epistemic Responsibility."
      *   *Proposal:* We need to bridge the gap between the Historian's rigor and the Filmmaker's license without stifling art.
      *   *Mechanism:* **Granular Provenance Markers.**
          *   Not just a card at the start.
          *   On-screen indicators when specific dialogue or scenes are invented.
          *   Companion materials (websites) detailing deviations.
          *   Shift the norm from "Based on a True Story" (vague) to "Dramatization of Historical Events" (clearer).
      *   *Why?* Because the duty is ultimately to the *living audience's* epistemic health, not the dead's welfare. The dead don't care; the living get misinformed.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Define the scope (dead have no welfare).
      *   *Section 1: Reconstructing the Theory.* Split into "Strict Presuppositions" (what makes the practice possible) and "Comfortable Fits" (what justifies it nicely).
          *   *Strict:* Narrative identity survives death; Distinction between epistemic and aesthetic domains.
          *   *Comfortable:* Dignity; Legacy as property.
      *   *Section 2: Evaluating the Accounts (Deception vs. Answerability).*
          *   Show why Answerability fails the "unconscious living" test.
          *   Show why Deception explains the Historian but not the Filmmaker.
          *   *The Vulnerability Principle:* This is the key insight. We protect the voiceless living *more* because they retain moral status. The dead retain *narrative* status but not *moral patient* status.
      *   *Section 3: Consistency Check.*
          *   The practice is inconsistent. It treats the dead as "truth-bound" for historians but "plastic" for artists. This creates a "Truth Decay" where audiences can't distinguish.
      *   *Section 4: Underdetermination.*
          *   Law vs. Norms. Property rights vs. Free speech.
      *   *Section 5: Coherent Practice.*
          *   Defend the "Anti-Deception/Stewardship" view.
          *   Propose specific changes: Kill "Based on a True Story." Use "Historical Fiction." Require digital companions for deviations.
          *   Rationale: The duty is to the *shared epistemic commons*, not the dead.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Historians are right, Filmmakers are wrong." The prompt asks for a theory of what we owe the dead. If the dead have no welfare, we owe them nothing *directly*. So the duty must be indirect.
      *   *Refinement:* The duty is to the *concept* of the person as a public good. Misrepresenting a dead person corrupts the cultural vocabulary we use to understand ourselves.
      *   *Key Distinction:* The "Vulnerability Principle" applied to the dead suggests we protect them *less* than the living unconscious, but *more* than fictional characters. Why? Because they anchor reality.
      *   *Final Polish:* Ensure the tone is analytical and philosophical, matching the prompt's sophistication.

  9.  **Final Review against constraints:**
      *   Did I split practice into presupposes vs. fits? Yes.
      *   Did I address the two accounts? Yes.
      *   Did I address the unconscious living counter-example? Yes.
      *   Did I assess consistency? Yes.
      *   Did I propose a coherent practice? Yes.

