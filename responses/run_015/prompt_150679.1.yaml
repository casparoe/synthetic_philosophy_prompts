answer: |-
  Here is a dissection of the slogan "Utilitarianism for animals, Kantianism for people," broken down into the conceptual readings available to your character. Each reading offers a different philosophical foundation for the two-tier regulatory regime you described.

  ### 1. The Bare Domain Split
  **The Claim:** The moral universe is partitioned into two distinct jurisdictions. In Jurisdiction A (non-humans), the right action is that which maximizes aggregate good. In Jurisdiction B (humans), the right action is that which respects inviolable constraints. No deeper principle explains the border; it is a brute fact of the moral landscape.

  *   **Status:** **Substantive but Indefensible.** It is not trivial (it makes a strong claim about moral structure) but it is philosophically vulnerable because it posits an arbitrary boundary.
  *   **Commitments:** Your character commits to moral dualism without a unifying meta-ethic. They assert that moral rules change based on group membership without explaining *why* group membership matters morally.
  *   **Coherence:** Logically consistent, but theoretically unstable. It functions like a legal jurisdiction (e.g., "state law applies here, federal law there") without a constitution explaining the division.
  *   **Policy Justification:** It supports the regime by fiat. It works administratively but collapses under cross-examination. If an activist asks, "Why does the boundary lie here?", the character has no answer other than "Because it does."
  *   **Verdict:** Use this if your character is pragmatic, impatient with theory, or relies on institutional authority rather than moral reasoning.

  ### 2. The Capacity Threshold
  **The Claim:** The division tracks a specific cognitive or agential property (e.g., rational autonomy, moral agency, second-order volition). Possession of this property triggers Kantian side-constraints; lack of it renders a being eligible for utilitarian aggregation. Humans typically possess it; animals typically do not.

  *   **Status:** **Substantive and Defensible.** This is the standard liberal-contractualist position. It grounds moral status in relevant capacities rather than biology.
  *   **Commitments:** Your character must commit to the idea that *capacity* creates *rights*. They also inherit the "marginal cases" problem: they must explain why human infants, the severely cognitively impaired, or the senile retain Kantian status despite lacking the threshold capacity.
  *   **Coherence:** High, provided they can handle the marginal cases (usually by arguing for "kind membership" or "potentiality").
  *   **Policy Justification:** Strong. It justifies the two-tier regime by linking it to a morally relevant difference. It allows the character to argue that sacrificing a rat for a cure is permissible (no autonomy violated), while sacrificing a human is not (autonomy violated).
  *   **Verdict:** Use this if your character is intellectually rigorous and prepared to defend the specific cognitive threshold against edge cases.

  ### 3. The Hybrid Normative Architecture
  **The Claim:** Two independent moral theories are objectively true and run in parallel. Consequentialism is the correct theory for non-persons; Deontology is the correct theory for persons. There is no single currency of value to compare them, and no meta-principle to adjudicate conflicts between the two theories.

  *   **Status:** **Actually False (Theoretically Incoherent).** Moral theories generally claim universality. To say one theory is true for X and another for Y implies a higher-order rule selecting the theories, which returns you to Reading 1 or 2.
  *   **Commitments:** Your character commits to moral pluralism without a decision procedure. They accept that there may be situations where Utilitarianism demands an action that Kantianism forbids, with no way to resolve the conflict.
  *   **Coherence:** Low. It creates a "conflict of laws" with no supreme court. If maximizing animal welfare requires violating a human right (or vice versa), the framework offers no guidance.
  *   **Policy Justification:** Weak. It justifies the regime only so long as the two tiers do not conflict. In bioethics, they often do (e.g., animal research that benefits humans).
  *   **Verdict:** Use this only if your character is theoretically confused or is hiding a lack of foundational belief behind complex jargon.

  ### 4. The Rhetorical Compression
  **The Claim:** The slogan sounds like a principled dualism but masks either a gradualist view (moral status comes in degrees) or an unstated reliance on biological species membership (speciesism).

  *   **Status:** **True Description of Usage, False Description of Theory.** This is not a moral claim itself but a diagnosis of the slogan's function.
  *   **Commitments:**
      *   *If Gradualist:* The character actually believes animals have *some* rights and humans have *more*, but uses the slogan as a shorthand for "strong rights vs. weak interests." This contradicts the strict utilitarian/Kantian split.
      *   *If Speciesist:* The character believes being *Homo sapiens* is the sole criterion. This is coherent but morally arbitrary.
  *   **Coherence:** Depends on the hidden premise. If species membership, it is consistent but ethically suspect. If gradualism, the slogan is misleading because it suggests a binary where there is a spectrum.
  *   **Policy Justification:** Effective politically, fragile philosophically. It justifies the regime by appealing to human solidarity rather than moral logic.
  *   **Verdict:** Use this if your character is cynical, politically savvy, or subconsciously aware that their position rests on human bias rather than moral truth.

  ---

  ### Fault Lines and Collapses

  You asked to flag where these readings bleed into one another. There are two critical collapse points your character may encounter in dialogue:

  **1. The Capacity-to-Species Collapse**
  Reading 2 (Capacity) often collapses into Reading 4 (Speciesism) in practice. If your character defines the threshold capacity as "rational autonomy," they must address humans who lack it. If they grant rights to those humans anyway (which they almost certainly will), they are no longer using Capacity as the criterion; they are using Species Membership.
  *   *The Trap:* If the activist asks, "Do you vivisect anencephalic infants?" and the character says "No," the Capacity reading collapses. The character is then implicitly holding Reading 4 (Speciesism) while claiming Reading 2.

  **2. The Aggregation Collapse**
  Reading 3 (Hybrid) collapses under the weight of interspecies comparison. If animals feel pain and humans feel pain, a regulatory framework that maximizes animal welfare (Utilitarianism) will inevitably generate a "currency" of suffering. If a policy causes massive animal suffering to prevent minor human inconvenience, the Utilitarian calculus for animals might demand stopping the policy. But if the human convenience is protected by Kantian rights, the system jams.
  *   *The Trap:* You cannot run a Utilitarian calculation for animals without generating a number large enough to theoretically outweigh a human interest, unless you arbitrarily cap the animal value. If you cap the value, you have returned to Reading 1 (Bare Domain Split).

  ---

  ### Sociological Reality: Who Holds What?

  To make your character legible to a philosophically trained reader, you should know how this slogan is actually deployed in the wild:

  *   **The Straw Figure:** Reading 3 (Hybrid Architecture). Serious philosophers rarely argue that two contradictory meta-ethics are simultaneously true based on species. This is usually a caricature attributed to opponents.
  *   **The Public Defense:** Reading 4 (Rhetorical Compression). In public debate, proponents usually mean a mix of Species Membership and Capacity, using the slogan to signal "Humans come first" without engaging the marginal cases problem.
  *   **The Philosophical Defense:** Reading 2 (Capacity Threshold). This is the only version that survives peer review. Defenders argue that "personhood" (not biology) grants Kantian status, and "sentience" (not personhood) grants Utilitarian consideration. They accept that some humans might lack personhood but are protected by social contract or potentiality.

  ### Recommendation for the Scene

  If your character is meant to be **intellectually formidable**, have them operate from **Reading 2 (Capacity Threshold)**. They should explicitly acknowledge the "marginal cases" problem (infants, disabled humans) and offer a quick, sharp defense (e.g., "We protect them based on species-typical potential or social relation, not because they are currently autonomous"). This shows they have thought deeper than the slogan.

  If your character is meant to be **dogmatic or bureaucratic**, have them operate from **Reading 1 (Bare Domain Split)**. They should treat the boundary as a regulatory given, getting annoyed when asked to justify the metaphysics. "The law draws the line at *Homo sapiens*. My job is to maximize welfare within the constraints the law sets."

  If your character is meant to be **cynical**, have them hint at **Reading 4 (Rhetorical Compression)**. They might admit off-hand that the slogan is "a useful fiction" to keep the public from panicking about animal research, revealing that the "Kantianism" for people is really just tribalism.

  **Final Note on Nozick:**
  Be aware that Robert Nozick originally invoked this phrase not to *defend* the two-tier system, but to critique Utilitarianism. His point was: "If we think it's absurd to sacrifice humans for the greater good, we should also think it's absurd to sacrifice animals. If Utilitarianism is wrong for humans, it's likely wrong for animals too."
  If your character uses the slogan to *justify* the two-tier system, they are inverting Nozick's original intent. They are arguing that the asymmetry is *correct*. To make this philosophically legible, your character must explicitly reject Nozick's inference. They must argue that the asymmetry is a feature, not a bug—that there *is* a morally relevant difference that justifies treating the two groups under different ethical calculi.
