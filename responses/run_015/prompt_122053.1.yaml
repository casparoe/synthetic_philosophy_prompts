          *   *Member 2 (Skeptical):* PE relies on causal links (referee, shared syntax, guaranteed existence) that real acausal trade lacks. The analogy smuggles in the missing channel.
      *   **The Task:**
          1.  **Mapping:** Explicit table of correspondences (Referee, Program, Inspection, Payoff, Simultaneity, Self-reference, Fixed Point).
          2.  **Disanalogies Audit:** Separate load-bearing disanalogies from noise regarding the two conclusions (Deflationary theory, Practical investment).
