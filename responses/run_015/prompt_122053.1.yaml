      *   *Program Equilibrium (PE):* Tennenholtz (2004). Players submit programs. Programs read each other's source. Output C/D.
      *   *The Core Tension:* PE assumes a *causal* mechanism (the referee running the code) that establishes the correlation. AT claims the correlation exists *without* such a mechanism, purely via logical identity/similarity.
      *   *Member 1's Claim:* The "magic" of AT is just the logic of PE. If you want AT, build PE-compatible agents (transparent specs).
