answer: |-
  ### Exam Question: Historical Explanation and Counterfactual Fragility

  **Question:**
  Historians often disagree on how explanations work. Some argue history should mimic science by using universal laws (the Covering-Law Model), while others argue history explains through storytelling and context (the Narrative Model).

  Consider this scenario: A historian claims the 1789 grain crisis caused the revolution. They argue using **counterfactual fragility mapping**, stating that if the harvest had failed just one week later, the revolutionary chain would not have started.

  **Task:**
  Does this fragility prove that hidden law-like rules about food supply and riots are actually driving the explanation? Or is this fragility internal to the narrative chain itself? In your answer, you must:
  1.  Distinguish between logical dependence and causal dependence.
  2.  Explain why fragility does not automatically require a covering law.
  3.  Identify the mistake of confusing narrative coherence with nomological subsumption.

  *(Recommended time: 45 minutes)*

  ***

  ### Model Answer

  The debate between scientific and narrative explanation centers on whether history requires universal laws to be valid. When a historian uses counterfactual fragility mapping—suggesting a tiny change in timing alters the entire outcome—it tempts us to think there must be a hidden scientific law governing the event. However, this assumption misunderstands how narrative explanation functions.

  First, we must distinguish logical dependence from causal dependence. In the Covering-Law Model, events are causally dependent on universal rules; if condition X happens, Y must follow everywhere. In narrative explanation, events are logically dependent on their specific context. The grain crisis leads to revolution not because a law says "hunger equals riot," but because, in that specific story, the hunger connected to existing political anger. The connection holds together logically within the story, not causally across all of history.

  Second, the presence of fragility does not automatically import a covering law. Just because the revolution was sensitive to the harvest timing does not mean a universal law exists about harvest timing and regime collapse. It simply means the specific situation was volatile. A covering law requires stability across different cases, but fragility highlights uniqueness. If the explanation relied on a law, changing the week shouldn't matter as much as the general condition of hunger. The fact that the timing is crucial proves the explanation relies on specific contingent details, not universal regularities.

  Finally, students often make the mistake of confusing narrative coherence with nomological subsumption. Nomological subsumption means fitting an event under a general law. Narrative coherence means the story makes sense internally. When a historian shows that changing the harvest date breaks the story, they are showing the story's internal coherence, not proving a scientific rule. The fragility belongs to the plot structure, not the laws of nature. Assuming otherwise forces history to be something it is not: a search for predictable rules rather than an understanding of unique human actions.

  Therefore, counterfactual fragility supports the Narrative Model. It shows that historical outcomes depend on specific, interconnected details rather than hidden scientific laws. The explanation works because the story hangs together, not because it obeys a universal rule of social physics.

  ***

  ### Marking Scheme (20 Points Total)

  **Separate Section 1: Logical vs. Causal Dependence (6 Points)**
  *   **Full Marks (5-6):** Clearly defines causal dependence (universal rules) vs. logical dependence (contextual connection). Explicitly applies this to the grain crisis example.
  *   **Partial Marks (3-4):** Defines the terms but fails to apply them to the specific scenario.
  *   **Low Marks (0-2):** Confuses the two terms or treats them as identical.
  *   **Common Error:** Claiming that logical dependence is just "weaker" causal dependence.

  **Separate Section 2: Fragility and Covering Laws (6 Points)**
  *   **Full Marks (5-6):** Argues that sensitivity to initial conditions (fragility) proves contingency, not universal law. Explains that laws require stability across cases.
  *   **Partial Marks (3-4):** States fragility doesn't need laws but fails to explain why (e.g., doesn't mention uniqueness vs. stability).
  *   **Low Marks (0-2):** Argues that fragility *does* prove hidden laws exist.
  *   **Common Error:** Assuming that because an outcome changes, a variable in a law must have changed.

  **Separate Section 3: Coherence vs. Subsumption (6 Points)**
  *   **Full Marks (5-6):** Identifies the specific mistake: treating a story that makes sense (coherence) as a story that fits a law (subsumption).
  *   **Partial Marks (3-4):** Mentions coherence but does not contrast it with nomological subsumption.
  *   **Low Marks (0-2):** Does not address the confusion between the two concepts.
  *   **Common Error:** Using "coherence" to mean "truth" rather than "internal consistency."

  **Grade Boundaries & Feedback**

  *   **A Grade (17-20 Points):** Hits all three moves clearly. Directly answers the "hidden law" objection using the fragility concept. Writing is clear and grounded.
  *   **B Grade (13-16 Points):** Describes Covering-Law and Narrative models well but ignores the "fragility twist." Treats the question as a general summary rather than analyzing the specific grain crisis scenario.
  *   **C Grade (9-12 Points):** Summarizes the theories but fails to distinguish logical vs. causal dependence.
  *   **D Grade (0-8 Points):** Significant misunderstandings of the core concepts or fails to complete the task.
