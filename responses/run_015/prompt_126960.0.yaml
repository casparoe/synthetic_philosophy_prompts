answer: |-
  This is a sharp dissection of a foundational result. You are right to be suspicious of the leap from "information has non-negative expected value" to "strategic ignorance is always irrational." Good's Theorem (1967) is mathematically sound *within its axioms*, but those axioms exclude significant swaths of real-world rationality.

  Here is the exposure map you requested: distinguishing the noise (trivial violations) from the structural risks (fatal defeaters), analyzing the unfalsifiability trap, and identifying the formal counterexamples that survive the "you aren't Bayesian" defense.

  ### 1. The Core Axioms vs. The Real World
  Good's Theorem relies on three critical assumptions. If any break, the theorem fails.
  1.  **Costless Information:** The act of observing has no resource cost.
  2.  **Fixed Utility Function:** Utility is defined over *world states*, not *belief states*. ($U(S)$, not $U(S, B)$).
  3.  **Causal Independence:** Observing the state does not causally influence the state (no quantum observer effects, no self-fulfilling prophecies).

  **The Noise (What Defenders Concede):**
  *   **Acquisition/Processing Costs:** If reading the news costs \$10 or 2 hours of time, ignorance is rational. Defenders admit this immediately. It doesn't violate Good; it just adds a cost term $C > E[V]$.
  *   **Bounded Rationality:** If you lack the compute to update correctly, info can hurt. Defenders dismiss this as "ideal theory." They argue Good's theorem describes *ideal* rationality, not human cognitive limitations. This is a valid distinction but limits the theory's normative force for actual agents.

  **The Fatal Defeaters (Where the Theory Breaks):**
  These are cases where an *ideal* Bayesian with *costless* access to information and *perfect* reasoning still suffers negative expected utility from learning.

  #### A. Endogenous Preferences (Utility over Beliefs)
  Good assumes $U$ is a function of the outcome. But humans often derive utility directly from their beliefs (e.g., hope, dignity, faith).
  *   **The Case:** You value believing your spouse is faithful. If they are faithful, $U=10$. If they cheat, $U=0$. However, *knowing* they cheated imposes a psychological cost of $-20$ (anguish), regardless of whether you stay or leave.
  *   **The Math:** $E[U|Info] < E[U|No Info]$.
  *   **Defender's Move:** "Then your utility function is weird. You should define $U$ over the reality, not the belief."
  *   **Why It's Fatal:** This is gaslighting the utility function. If agents *actually* have utility functions over belief states (which introspection and behavioral econ suggest they do), then Good's theorem is descriptively false for those agents. It prescribes a utility function rather than analyzing the one present.
  *   **Verdict:** **Fatal.** It restricts the domain of "rational agents" to those who don't care about their own mental states, only external reality.

  #### B. Game-Theoretic Commitment (Strategic Ignorance)
  In multi-agent settings, information can destroy bargaining power or credible commitment.
  *   **The Case:** The "Threat of Retaliation." You are a nation. If attacked minorly, you want to ignore it to avoid escalation. If attacked majorly, you retaliate. If you *know* the scale of the attack, you might calculate that retaliation is too costly for a minor attack, rendering your deterrent threat non-credible. By remaining ignorant of the scale, you commit to a blanket retaliation policy that deters all attacks.
  *   **The Formalism:** This is a **Bayesian Game** with imperfect information. The equilibrium with ignorance yields higher ex-ante payoff than the equilibrium with perfect information because ignorance acts as a binding commitment device.
  *   **Defender's Move:** "You aren't modeling the game correctly. Include the *other agent's belief about your knowledge* in the state space."
  *   **Why It's Fatal:** Even if you model it perfectly, the *causal mechanism* for the higher utility is the *absence* of information in your head. The information itself has negative value because it unravels the commitment. Good's theorem assumes single-agent decision theory; it does not hold in equilibrium analysis where your knowledge affects others' strategies.
  *   **Verdict:** **Fatal.** Good's theorem is a single-agent result. It does not generalize to Nash equilibria where information asymmetry is a strategic asset.

  #### C. Acausal / Logical Dependence (Newcomb-like Problems)
  In problems involving predictors (Newcomb's Problem, Counterfactual Mugging), observing information can update your belief about a past event that is logically correlated with your decision to observe.
  *   **The Case:** A predictor puts \$1M in Box B if they predict you will *not* look inside Box A before choosing. If you look, they leave Box B empty.
  *   **The Math:** Looking provides information (what's in Box A), but the act of looking causes Box B to be empty. The value of the information is negative because the *decision to acquire it* is evidentially linked to a worse world state.
  *   **Defender's Move:** "This is Causal Decision Theory (CDT) failing. A proper agent uses Evidential or Functional Decision Theory."
  *   **Why It's Fatal:** Good's Theorem is derived within CDT. If CDT is the standard for "Bayesian Rationality" (as classically defined), this is a counterexample. If defenders switch to FDT to save the result, they are changing the definition of "rational updating."
  *   **Verdict:** **Awkward but Manageable.** Defenders usually concede classical CDT fails here, but argue this shows CDT is flawed, not that information is bad. However, it proves Good's result is not robust across decision theories.

  ### 2. The Unfalsifiability Trap
  You asked: *If every counterexample gets answered with "then you weren't a proper Bayesian," is that a problem?*

  **Yes. It is a problem.**

  This is the **No True Scotsman** risk. If "Rational Agent" is defined as "An agent for whom information has non-negative value," then Good's Theorem becomes a tautology:
  > "For all agents $A$, if $A$ is Rational, then $Value(Info) \ge 0$."
  > "Agent $X$ avoided info."
  > "Therefore, Agent $X$ is not Rational."

  This strips the theory of predictive power. A robust theory must allow for the possibility that a rational agent *could* reject information under specific, definable conditions.

  **What Defenders Concede:**
  Sophisticated defenders (e.g., Brian Skyrms, James Joyce) concede that Good's Theorem applies to **instrumental rationality** regarding **fixed goals**. They admit:
  1.  If goals change upon learning (preference shift), info can hurt.
  2.  If the utility function includes epistemic terms (curiosity, anxiety), info can hurt.
  3.  If the environment is game-theoretic, info can hurt.

  **The Risk:** By conceding these, the domain of Good's Theorem shrinks to "Single-agent, fixed-preference, causally isolated, costless decision problems." This is a tiny slice of reality. Defenders often try to expand it back by "reformulating" the problem (e.g., "Just add the anxiety to the cost function!"), but as noted in Section 1A, this often feels like moving the goalposts to preserve the theorem rather than explaining the behavior.

  ### 3. Predictions: Good's View vs. Rival Accounts
  What does this view predict that others don't?

  | Feature | **Good's View (Strict Bayesian)** | **Rival View (Bounded/Strategic)** |
  | :--- | :--- | :--- |
  | **Medical Testing** | Never refuse a test unless it costs money/time. Refusal implies irrational fear or miscalculation. | Refusal is rational if the *psychological cost* of knowing outweighs the medical utility, or if it triggers self-fulfilling nocebo effects. |
  | **Negotiation** | Always gather max intel on the opponent's reservation price. | Sometimes rational to remain ignorant to maintain a credible "hardball" stance or avoid temptation to settle. |
  | **Politics/News** | Ignorance is always a failure of civic duty or cognitive laziness. | Ignorance can be a rational protection against manipulation or affective polarization (utility of belief). |
  | **Falsifiability** | Low. Any avoidance is explained away as "hidden cost" or "irrationality." | High. Predicts systematic avoidance in high-stakes/low-control scenarios. |

  **Unique Prediction of Good's View:**
  It predicts that as agents become more computationally powerful and emotionally detached (more "ideal"), information avoidance should disappear entirely.
  **Rival Prediction:** Even superintelligent agents in game-theoretic contexts will strategically hide information from themselves to maintain commitment credibility.

  ### 4. The Live Formal Counterexample
  You asked for a formal counterexample that doesn't depend on post-learning irrationality.

  **The "Halter-Pfanzagl" Counterexample (1970):**
  They demonstrated that if the utility function is not linear in probabilities (i.e., not standard Expected Utility), or if the utility depends on the *information system* itself, the value of information can be negative.

  **Simpler Modern Example: The "Self-Fulfilling Risk"**
  *   **Setup:** You are a bank manager. There is a 1% chance your bank is insolvent ($S_{bad}$).
  *   **Action:** If you learn $S_{bad}$, you must declare bankruptcy immediately (regulatory rule). This causes a bank run, guaranteeing loss $L$.
  *   **Alternative:** If you remain ignorant, you can continue operating. There is a 90% chance market conditions improve, solvency is restored, and $L$ is avoided.
  *   **The Kicker:** The act of *knowing* forces the action that guarantees the loss. Ignorance allows a stochastic path to survival.
  *   **Formal Violation:** $E[U|Info] < E[U|No Info]$.
  *   **Why it survives the "Rationality" Defense:** You are updating perfectly. You are choosing optimally *given* the knowledge. The constraint is external (regulatory/physical), not internal irrationality. The information *causes* the bad outcome via a rule that binds the knower.
  *   **Defender's Rebuttal:** "Include the regulatory rule in the decision tree."
  *   **Counter-Rebuttal:** Even included, the branch where you *know* dominates the branch where you *don't*. The theorem claims the *value of the information* is non-negative. Here, the marginal value of that specific bit is negative.

  ### 5. The Exposure Map

  Here is the risk assessment for the position that "Strategic Ignorance is Never Rational."

  | Domain | Risk Level | Why |
  | :--- | :--- | :--- |
  | **Single-Agent, Costless, Fixed Utility** | **Safe** | Good's Theorem holds perfectly here. This is the "Noise" zone for critics. |
  | **Information Acquisition Costs** | **Noise** | Trivial violation. Defenders absorb this easily. |
  | **Bounded Rationality (Compute)** | **Noise** | Defenders concede this applies to humans, not ideal agents. |
  | **Utility of Belief (Happiness/Dignity)** | **High Risk** | Requires redefining utility functions in ways that feel ad-hoc. Challenges the "fixed preference" axiom. |
  | **Game Theory (Commitment)** | **Fatal** | Ignorance is a strategic asset. Good's theorem is single-agent; it cannot model the value of *not* knowing in equilibrium. |
  | **Regulatory/Physical Constraints** | **Fatal** | Cases where knowledge triggers mandatory negative outcomes (e.g., mandatory reporting laws, self-fulfilling prophecies). |
  | **Tautology Risk** | **Meta-Fatal** | If "Rational" = "Doesn't avoid info," the theory explains nothing. |

  ### Summary Recommendation
  If you want to defend Good's result, you must retreat to **Ideal Single-Agent Decision Theory**. You must concede that in **Game Theory** and **Endogenous Preference** contexts, information has negative value.

  If you maintain that strategic ignorance is *never* rational, you risk making your definition of rationality unfalsifiable. The strongest position is: **"For an ideal Bayesian agent with fixed preferences over world states, information is non-negative. However, real agents have preferences over belief states and face strategic constraints where ignorance functions as a commitment device. In those cases, 'rational ignorance' is not a failure of reasoning, but a feature of the environment."**

  This preserves the mathematical truth of Good's Theorem without forcing it to carry the normative weight of "always seek truth," which it cannot support.
