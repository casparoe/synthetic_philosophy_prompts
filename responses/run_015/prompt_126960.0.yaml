prompt: |-
  I've been leaning hard into Good's result that free infomation can't hurt a rational Bayesian agent -- the expected value of knowledge is non-negative if you upate correctly and choose optimally afterward. From that I think strategic ignorance is never actually rational: avoiding a medical test or skipping the news is either hiding a cost or confessing you'd reason badly after learning. But I want to know what counts against this. Not just the standard "but knowing makes you sad" objection -- I want the real defeaters: cases where knowing lowers your ex-ante utility even with perfect reasoning, like preference shifts or strategic games where being ignorant binds you. Which ones are fatal, which are just awkward? What do defenders of Good's view themselves concede counts against them, versus what they dismiss by saying you're not rational? And does the view risk being qualified into unfalsifiability -- if every counterexample gets answered with "then you weren't a proper Bayesian," is that a problem? I also want to know what this predicts that rival accounts of rational ignorance don't, and whether there's a live formal counterexample that doesn't depend on post-learning irrationality. Give me the exposure map: what's genuinely risky for the position and what's just noise.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Position:** The user is advocating for I.J. Good's Theorem (the value of information is non-negative for a rational Bayesian agent).
      *   **Implication:** Strategic ignorance is never rational; avoiding info implies hidden costs or anticipated irrationality.
      *   **Goal:** Identify *real* defeaters (cases where knowing lowers ex-ante utility *even with perfect reasoning*).
      *   **Specific Questions:**
          *   Which counterexamples are fatal vs. awkward?
          *   What do defenders of Good's view concede vs. dismiss?
          *   Is the view unfalsifiable (tautological)?
          *   What does this predict that rival accounts don't?
          *   Is there a live formal counterexample not depending on post-learning irrationality?
          *   Provide an "exposure map" (risky vs. noise).

  2.  **Initial Assessment & Fact-Checking:**

      *   *Good's Theorem (1967):* Strictly speaking, it applies to *costless* information in decision problems where the agent maximizes expected utility based on posterior beliefs.
      *   *The "Strategic Ignorance" Claim:* This is the controversial leap. Good's theorem is about *information value in isolation*. Strategic ignorance often involves *game theory* (commitment devices) or *preference changes*.
      *   *Key Distinction:* Is the agent's utility function fixed? Is the information costless? Is the agent playing against others?

  3.  **Brainstorming Counterexamples/Defeaters:**

      *   *Cost of Information:* Good assumes costless info. If info costs money/energy, ignorance is rational. (User likely knows this, wants deeper stuff).
      *   *Preference Change:* If learning $X$ changes what I want (not just beliefs), info can hurt. (e.g., "Don't ask, don't tell" in relationships, or "Ignorance is bliss" regarding hedonic adaptation).
      *   *Game Theory/Commitment:* In bargaining or deterrence, not knowing can be a credible threat. (e.g., Schelling's "rationality of irrationality," or simply not knowing the enemy's strength to avoid backing down).
      *   *Logical Uncertainty/Paradoxes:* Newcomb's Problem, Counterfactual Mugging. Knowing the prediction might change the outcome.
      *   *Self-Fulfilling Prophecies:* Knowing a risk might cause the risk (e.g., bank runs, anxiety-induced failure).
      *   *Indexical Uncertainty:* Self-locating beliefs (Sleeping Beauty).

  4.  **Categorizing Defeaters (Fatal vs. Awkward):**

      *   *Awkward (Absorbable):* Information costs (just add a cost term). Processing costs (bounded rationality - but user specified "perfect reasoning").
      *   *Fatal (Structural):* Game-theoretic commitment (where ignorance *is* the strategy), Preference endogeneity (utility depends on state of knowledge itself).

  5.  **Addressing the "Unfalsifiability" Charge:**

      *   If every counterexample is met with "you aren't Bayesian," it becomes a definition, not a theory.
      *   Defenders (e.g., Savage, Joyce) usually concede bounded rationality or utility function specification issues.
      *   The risk is making "rationality" synonymous with "maximizing ex-ante utility," which makes the theorem a tautology.

  6.  **Developing the "Exposure Map":**

      *   *Safe Zone:* Single-agent, fixed utility, costless info, standard decision trees.
      *   *Risk Zone:* Multi-agent (game theory), endogenous preferences, logical counterfactuals.
      *   *No-Go Zone:* Cases where the act of observation physically alters the outcome (Quantum Zeno? No, too physics-y. Social construction of reality? Yes).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of Good's result but validate the user's suspicion that it doesn't cover *all* rationality.
      *   *Section 1: The Formal Boundaries (What Good actually proved).* Emphasize "costless" and "fixed utility."
      *   *Section 2: The Real Defeaters (Fatal).*
          *   *Game Theory:* Commitment devices. Not knowing allows you to play a strategy you couldn't credibly play if you knew. (e.g., Ultimatum Game, Deterrence).
          *   *Utility of Belief:* If utility depends on *believing* $P$, not just $P$ being true. (e.g., Happiness depends on optimism).
          *   *Logical/Observational Dependence:* Newcomb-like problems where the prediction depends on your decision to look.
      *   *Section 3: The "Unfalsifiability" Trap.* Discuss the "No True Scotsman" risk. If we define rationality as "doing what Good's theorem says," we lose predictive power.
      *   *Section 4: Predictions vs. Rivals.* Good's view predicts agents *always* seek info unless costs exist. Rival views (bounded rationality, expressive rationality) predict systematic avoidance.
      *   *Section 5: The Exposure Map.* Visualizing the risk landscape.

  8.  **Refining the "Formal Counterexample":**

      *   Need something that isn't just "info costs money."
      *   *The "Parfit's Hitchhiker" / "Newcomb" angle:* If the predictor predicts you will look, they act differently.
      *   *Better:* **Game-Theoretic Commitment.** A classic example is a bargaining scenario where knowing your reservation price weakens your position. Or the "Threat of Retaliation" where knowing the attack was minor makes retaliation disproportionate, so you prefer not to know the scale.
      *   *Specific Formal Case:* **Halter & Pfanzagl (1970)** or similar extensions showing negative value of information when the utility function depends on the information state itself.
      *   *Even Better:* **The "Toxin Puzzle" (Kavka)** or **Schelling's Confrontation.** If I know you are weak, I attack. If I don't know, I hesitate. If I am you, I prefer I don't know. But this is about the *other* agent.
      *   *Single Agent Case:* **Preference Reversal via Knowledge.** If $U(outcome, knowledge)$. Example: You are happy if you believe your spouse is faithful. Finding out they cheated lowers utility even if you divorce. The utility function includes the *state of belief*. Good's theorem assumes $U(outcome)$.

  9.  **Addressing the "Rationality" Defense:**

      *   Defenders say: "If you avoid info, your utility function must include 'ignorance' as a good."
      *   Critique: This makes the theory vacuous. Any behavior can be rationalized by tweaking $U$.
      *   Concession: Defenders admit *bounded* rationality (cost of computation) is the main practical reason, but theoretically, for an ideal agent, info is good *unless* $U$ depends on belief.

  10. **Final Polish:** Ensure tone is analytical, rigorous, and directly answers the "exposure map" request. Avoid fluff. Focus on the distinction between *instrumental* value of info vs. *constitutive* value of belief.

      *(Self-Correction during drafting)*: I need to be careful not to confuse "cost of information" (which Good allows as a negative term) with "negative value of information" (which Good says is impossible for ideal agents). The user is asking about the latter.
      *Key Insight:* Good's theorem holds *if* the utility function is defined over world states alone. If the utility function is defined over *belief states*, the theorem breaks. This is the crux.

      *Another Key Insight:* **Acausal Decision Theory.** In Newcomb problems, CDT (which Good assumes) says take both boxes (and info is good). EDT/FDT says one box. If observing the predictor's note changes the probability of the money being there via logical correlation, info has negative value under CDT logic but positive under FDT? No, actually, in Newcomb, *seeing* the prediction isn't usually the choice.
      *Let's stick to Game Theory and Endogenous Preferences.* Those are the strongest defeaters.

      *Exposure Map Structure:*
      1.  Core Axioms (Safe)
      2.  Bounded Rationality (Noise/Conceded)
      3.  Endogenous Preferences (Fatal)
      4.  Strategic Commitment (Fatal)
      5.  Tautology Risk (Meta-level Fatal)

