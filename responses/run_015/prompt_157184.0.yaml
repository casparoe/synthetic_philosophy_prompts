answer: |-
  You are absolutely right to be annoyed. In philosophy of physics circles, "time is an illusion" functions as a conversation-stopper that smuggles in a load of unargued metaphysics under the guise of a technical result. Gödel's 1949 paper ("An Example of a New Type of Cosmological Solutions of Einstein's Field Equations of Gravitation") and his accompanying essay ("A Remark About the Relationship Between Relativity Theory and Idealistic Philosophy") are notoriously dense, and the slogan collapses at least four distinct claims into one.

  Here is the breakdown of the precise readings, categorized by what they are, whether they are true, and whether Gödel actually held them.

  ### 1. The Geometric Claim: No Global Time Function
  *   **The Claim:** The Gödel metric does not admit a global foliation into spacelike hypersurfaces orthogonal to the worldlines of matter. There is no cosmic time $t$ that orders the universe for everyone.
  *   **Status:** **True (of the metric).** This is a technical feature of the solution.
  *   **Gödel's View:** He uses this as a premise, not the conclusion.
  *   **The Slogan Usage:** When physicists say this, they usually mean "There is no privileged 'now'."
  *   **Verdict:** **Technical Fact.** It is not a philosophical claim about the *reality* of time per se, but about the *structure* of this specific spacetime. However, people often conflate "no global time coordinate" with "time doesn't exist."

  ### 2. The Causal Claim: Closed Timelike Curves (CTCs)
  *   **The Claim:** The metric contains Closed Timelike Curves. An observer can travel into their own past. This breaks the linear ordering of cause and effect (partial ordering becomes impossible).
  *   **Status:** **True (of the metric).**
  *   **Gödel's View:** He viewed this as demonstrating that "objective time" (understood as a linear, irreversible succession) is not a necessary feature of a physically possible world.
  *   **The Slogan Usage:** When people invoke this to dismiss time travel paradoxes, they usually mean: **"Since the geometry allows loops, 'past' and 'future' are just local coordinates, not ontological categories."**
  *   **Verdict:** **Technical Fact.** However, using this to say time travel is "no big deal" is a non-sequitur. CTCs make time travel *geometrically* possible, but they create massive problems for *causal* consistency.

  ### 3. The Modal Argument (Gödel's Actual Philosophical Argument)
  *   **The Claim:** This is the one everyone misses. Gödel argues modally:
      1.  If objective time (temporal passage/change) is real, it must be real in *all* physically possible worlds (it is an essential property of reality).
      2.  In the Gödel universe (a physically possible solution to GR), objective time is impossible (due to CTCs/no global time).
      3.  Therefore, objective time is not an essential property of reality.
      4.  Therefore, objective time is not real in *our* world either, even if our world doesn't have CTCs.
  *   **Status:** **Gödel held this.** This is the core of his 1949 essay.
  *   **Verdict:** **Controversial Philosophy.** Most contemporary philosophers of physics reject premise (1). They argue time could be contingent. But this is what Gödel *actually meant* by "time is an illusion." He wasn't just talking about his universe; he was using his universe to prove time is illusory *here*.

  ### 4. The Ontological Claim: The Block Universe (Eternalism)
  *   **The Claim:** All events (past, present, future) exist equally. "Passage" is a psychological artifact.
  *   **Status:** **Platitude in Relativity.** This is the standard "B-Theory" reading of Special and General Relativity.
  *   **Gödel's View:** Gödel was an idealist (heavily influenced by Kant and Leibniz). He didn't just believe in a Block Universe; he believed the Block was *mental* or that time was a mode of intuition, not a feature of things-in-themselves.
  *   **The Slogan Usage:** When people say "time is an illusion" to dismiss the *possibility* of changing the past, they mean this. "You can't change the past because the past is just as fixed as the future; it's all a 4D block."
  *   **Verdict:** **Metaphysical Stance.** It is not a consequence of the physics alone (you need metaphysics to get from "spacetime is a manifold" to "the future exists").

  ### 5. The Phenomenological Claim: Psychological Time
  *   **The Claim:** Time is only real as a subjective experience (the "feeling" of now), not as an external physical structure.
  *   **Status:** **Gödel held this.**
  *   **Verdict:** **Idealism.** Gödel was a Platonic realist about concepts but an idealist about time. He thought our *perception* of time passing was the only "time" we have access to, but that it misrepresents reality.

  ---

  ### Summary Table: Who Means What?

  | Claim | Is it True (in Gödel metric)? | Did Gödel Hold It? | What People *Mean* When Dismissing Time Travel |
  | :--- | :--- | :--- | :--- |
  | **No Global Slice** | Yes | As a premise | "There is no universal clock to sync against." |
  | **CTCs Exist** | Yes | As a premise | "Causal loops are allowed, so 'before/after' is local." |
  | **Modal Argument** | N/A (Philosophical) | **Yes (Core View)** | Rarely understood. |
  | **Block Universe** | Compatible | Yes (with caveats) | **"You can't change the past; it's already there."** |
  | **Psychological Time** | N/A | **Yes** | "Time travel is just a mental construct." |

  ---

  ### The McTaggart Confusion: Real or Pedantic?

  You are **not being pedantic**. This is a substantive confusion, though there is a genuine overlap.

  **The Overlap:**
  J.M.E. McTaggart (1908) argued that time is unreal because the **A-Series** (events being past, present, future) is contradictory, while the **B-Series** (events being earlier/later) is static and doesn't constitute "time" (change).
  Gödel concludes that "objective time" (which looks a lot like the A-Series, i.e., the *lapse* of time) is illusory.
  So, both conclude: **Temporal Passage is not real.**

  **The Confusion:**
  1.  **Methodology:** McTaggart's argument is *a priori* (logical/linguistic analysis of the concept of time). Gödel's argument is *a posteriori* (based on the empirical success of General Relativity). Conflating them ignores Gödel's specific contribution: using physics to settle a metaphysical debate.
  2.  **The B-Series:** McTaggart accepts the B-Series as a rational ordering but says it isn't "time." Gödel, in the Block Universe sense, accepts the B-Series structure of spacetime. However, because Gödel is a Kantian idealist, he might argue the B-Series is also a feature of our intuition, not the noumenal world.
  3.  **The "Illusion" Label:** When people say "Gödel proves McTaggart right," they usually mean "Gödel proves the A-Series is unreal." But they often skip the **Modal Argument**. McTaggart says time is unreal because the concept is contradictory. Gödel says time is unreal because *physics allows worlds without it*.

  **Verdict:** It is a **real confusion** to treat them as identical.
  *   If someone says "Gödel proves McTaggart's paradox," they are wrong. Gödel provides a *physical model* that supports a McTaggartian *conclusion*.
  *   If someone says "Gödel denies the B-Series," they are likely wrong. Gödel denies the *objective lapse* (A-Series properties).
  *   **Why it matters:** If you treat it as just McTaggart, you ignore the role of General Relativity. If you treat it as just GR, you ignore Gödel's idealist metaphysics.

  ### How to Intervene in Your Group
  When someone tosses out "time is an illusion" regarding Gödel:

  1.  **Ask:** "Do you mean the **Modal Argument** (that time isn't essential because it's absent in some possible worlds) or just the **Block Universe** (that passage is subjective)?"
  2.  **On Time Travel:** If they say "Time travel is possible so time is an illusion," point out that **CTCs (Claim 2)** make time travel geometrically possible, but **Block Eternalism (Claim 4)** is what they are using to dismiss the *paradoxes*. Those are two different claims.
  3.  **On McTaggart:** "Gödel uses GR to argue for a McTaggartian conclusion, but his argument relies on the contingency of physical laws, not just the logic of tenses. It's a physical argument for idealism, not a linguistic paradox."

  Your intuition is spot on: the slogan is a philosophical camouflage. It hides the jump from "This metric has CTCs" to "Therefore, temporal passage is ontologically void in our world." That jump requires the Modal Argument, and without it, the slogan is just hand-waving.
