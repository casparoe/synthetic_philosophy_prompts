answer: |-
  Here is the specification you requested, framed within the epistemic constraints of historical inquiry and calibrated against your stratigraphic background.

  ### I. The Specification: Desiderata for Criteria of Authenticity

  To count as evidence rather than assertion, a criterion of authenticity must satisfy the following requirements. They are ranked by how much material they exclude (most exclusive to least exclusive) and marked as **Non-Negotiable** (methodological integrity) or **Preference** (scholarly camp).

  **1. Calibration (The "Known Answer" Test)**
  *   **Requirement:** The method must be demonstrably capable of distinguishing authentic from inauthentic material when applied to a control set where the provenance is known independently of the method.
  *   **Case:** In stratigraphy, a dating method is useless until it correctly dates a layer of known age. If a criterion cannot identify a known forgery as false or a known authentic report as true, it has no predictive power.
  *   **Status:** **Non-Negotiable.** Without this, the method is unfalsifiable.
  *   **The Calibration Set:** There is **no** body of material in the Jesus tradition whose status can be checked without using the criteria themselves. We have no contemporary inscriptions, no autograph manuscripts, and no independent eyewitness accounts against which to test the Gospel traditions.
  *   **Implication:** This is a **defect in the evidence**, not merely the criteria. It means historical Jesus research cannot operate as a hard science. It operates as a probabilistic inference based on coherence, not verification.

  **2. Positive Probative Value (The Asymmetry Constraint)**
  *   **Requirement:** A criterion must be able to *raise* the probability that a tradition originates with Jesus against a stated baseline, not merely *fail to lower* it.
  *   **Case:** You identified that Embarrassment and Dissimilarity act as vetoes. They show the Church *might not* have invented something. They do not show Jesus *did* say it. (Someone else could have said it; or it could be a random preservation). A criterion that only filters out noise without identifying signal yields a null set, not a history.
  *   **Status:** **Non-Negotiable.** A filter that only removes false positives but generates no true positives is a sieve, not a detector.
  *   **Output:** Criteria must output a **graded likelihood** (Bayesian update), not a binary verdict (Authentic/Inauthentic). The evidence is fragmentary and graded; the output must match.

  **3. Independence from Background Model (The Bootstrap Constraint)**
  *   **Requirement:** The criterion must not presuppose the conclusion in its background assumptions. It must be able to test the transmission model, not just operate within one.
  *   **Case:** If the criterion assumes "The Church invented all theological claims" to prove "Jesus made no theological claims," it is circular. Multiple Attestation fails here if the sources are not genealogically independent (e.g., if Matthew and Luke both used Mark).
  *   **Status:** **Non-Negotiable.** Circular reasoning invalidates the result.
  *   **Transmission Premise:** A criterion is **not permitted** to take as a premise a specific theory of transmission (e.g., "Form Criticism's law of increasing detail") unless that theory is itself tested against external data. Since it cannot be, criteria relying on specific transmission laws are weak.

  **4. Historical Plausibility (The Continuity Constraint)**
  *   **Requirement:** The resulting portrait of Jesus must be intelligible as a first-century Jew and causally adequate to explain the movement that followed him.
  *   **Case:** If the criteria strip away everything Jewish and everything Christian, the remaining Jesus is a historical anomaly who could not have existed in Galilee nor founded the Church.
  *   **Status:** **Non-Negotiable.** A historical figure must fit their context and effects.

  **5. Neutrality regarding Truth Claims**
  *   **Requirement:** The criterion should not presuppose the theological truth or falsity of the tradition.
  *   **Case:** Does the method assume miracles are impossible? Does it assume the Resurrection is a legend?
  *   **Status:** **Preference.** Strict neutrality is often a disguise for naturalistic prejudice. However, *methodological naturalism* (bracketing supernatural claims for historical analysis) is a standard historical constraint, not necessarily an anti-confessional one.

  ---

  ### II. The Three Specific Issues as Desiderata

  You asked for these to be treated as candidate desiderata. Here is their evaluation within the specification above.

  **1. The Asymmetry Desideratum**
  *   **Verdict:** **Accepted as Non-Negotiable (see #2 above).**
  *   **Implication:** If a criterion (like Dissimilarity) can only lower probability or maintain the baseline, it cannot be used to construct a positive portrait. It can only isolate a "safe core." If the honest answer is that these criteria only fail to lower probability, then the strength of the conclusion is **negative only**. We can say "The Church likely didn't invent this," but not "Jesus definitely said this." Most scholarship, however, treats them as positive proofs. This is a methodological error.

  **2. The Bootstrap Desideratum**
  *   **Verdict:** **Accepted as Non-Negotiable (see #3 above).**
  *   **Multiple Attestation:** This **fails** this desideratum in its current usage. It assumes source independence (Mark, Q, John, Paul) that is disputed. If Q is a hypothesis and John is dependent on Synoptics, the "multiple" lines collapse into one.
  *   **Transmission Premise:** A criterion **must not** take the transmission theory as a premise. It must be able to test it. Since we cannot test the transmission theory independently, criteria relying on it (like Form Criticism's "laws of tradition") are inherently unstable. They return their input.

  **3. The Incompatibility Desideratum (The Paradox)**
  *   **Conflict:** You flagged the pair: (A) Criterion must not authenticate what is continuous with Judaism/Church (Dissimilarity), vs. (B) Jesus must be intelligible as a Jew who founded the Church (Plausibility).
  *   **Resolution:** These **cannot be jointly satisfied.**
  *   **Surrender:** You must surrender **(A) Discontinuity.**
  *   **Cost:** You lose the ability to claim you have isolated the "unique" words of Jesus against his environment. You admit that most of what Jesus said was probably typical for a first-century Jew.
  *   **Reason:** If you keep (A), you violate (B). A Jesus discontinuous from Judaism is a fantasy; a Jesus discontinuous from the Church is causally inadequate. Modern scholarship (the "Third Quest") has largely surrendered (A) in favor of (B). The Criterion of Dissimilarity is now widely regarded as useful only for identifying the *distinctive* edges, not the *substance*.

  ---

  ### III. Purpose-Dependent Variations

  The list changes depending on the goal. You cannot use the same specification for all three aims in your reading group.

  | Goal | Required Desiderata | Relaxed Desiderata | Consequence |
  | :--- | :--- | :--- | :--- |
  | **Authentic Sayings** (Your assumption) | Strict Calibration, Positive Probative Value, Independence. | Historical Plausibility (can tolerate oddities). | Yields a tiny, fragmented corpus. High confidence, low utility. |
  | **Minimal Biography** | Historical Plausibility, Coherence. | Calibration, Positive Probative Value. | Yields a coherent life story. Lower confidence on specific events, higher confidence on general trajectory. |
  | **Movement Explanation** | Causal Adequacy (Jesus explains Church), Plausibility. | Dissimilarity, Neutrality. | Yields a Jesus who looks more like the Lord of Faith. High explanatory power, low differentiation from early theology. |

  **Judgment:** If the goal is *history* in the scientific sense, only the first list is valid, but it yields almost no data. If the goal is *historical understanding* (making sense of the past), the second and third are necessary, but they require accepting tradition as *prima facie* plausible rather than *prima facie* suspect.

  ---

  ### IV. Prejudice vs. Desiderata

  **Is Neutrality a Genuine Desideratum?**
  *   **Verdict:** **No. It is a Preference (often anti-confessional).**
  *   **Reason:** Requiring "neutrality" often stacks the deck by assuming the tradition is guilty until proven innocent. In stratigraphy, you do not assume a rock layer is "reworked" until proven "in situ." You assess the features. In Jesus studies, the default setting of the criteria (Dissimilarity, Embarrassment) assumes the tradition is *inauthentic* until it survives a veto. This is not neutrality; it is hyper-skepticism.
  *   **Correction:** The genuine desideratum is **Awareness of Bias**, not Neutrality. The method must declare its priors (e.g., "We assume miracles are historically inaccessible" or "We assume the Gospel writers intended to report history").

  ---

  ### V. The Verdict: Ranking and Commitment

  You asked me to rank the desiderata by exclusivity, identify the flagrant violation, and commit to the nature of these criteria.

  **1. Ranking by Exclusivity (Most to Least)**
  1.  **Calibration:** Excludes *all* current criteria (none pass).
  2.  **Positive Probative Value:** Excludes Embarrassment and Dissimilarity (they are negative tests).
  3.  **Independence from Model:** Excludes Multiple Attestation (sources are not proven independent).
  4.  **Historical Plausibility:** Excludes the "Radical Skeptic" portraits (Jesus as Cynic sage, etc., if they don't fit Jewish context).
  5.  **Neutrality:** Excludes confessional histories (but is itself a bias).

  **2. The Flagrant Violation**
  The current set of criteria most flagrantly violates **Calibration** and **Positive Probative Value**.
  *   **Calibration:** There is no control set. The method is uncalibrated.
  *   **Positive Value:** The criteria are treated as positive proofs ("This passes the Criterion of Embarrassment, therefore Jesus said it") when they are logically only negative filters ("The Church wouldn't invent this, so it *might* be old").

  **3. Commitment: What are these criteria?**
  *   **Definition:** They are **codifications of scholarly judgment dressed as method.**
  *   **Reasons:**
      1.  They lack independent verification (Calibration).
      2.  They rely on circular background models (Bootstrap).
      3.  They produce contradictory results depending on the scholar's priors (a skeptic finds a skeptic's Jesus; a liberal finds a liberal's Jesus).
      4.  They function rhetorically to justify conclusions reached by intuition, rather than generating conclusions from data.
  *   **Confidence:** **High (85%).** This is the consensus of the methodological critique in the field since the 1980s (e.g., Porter, Meier's own caveats, the Jesus Seminar's internal critiques).
  *   **What would change my mind:**
      1.  Discovery of a contemporary, independent record of Jesus's ministry (e.g., a first-century non-Christian archive) that allows calibration.
      2.  Development of a probabilistic model that successfully predicts unknown data points in similar historical contexts (e.g., applied to other charismatic leaders of antiquity where we have better data).

  **Summary for your Reading Group:**
  You are working with tools that are rhetorically powerful but methodologically leaky. They are better at telling you what the early Church *valued* (by what they kept) and what they *struggled with* (by what they embarrassed), than they are at telling you what Jesus *said*. If you want a biography, you must rely on **Plausibility** (Context) rather than **Dissimilarity** (Uniqueness). If you want scientific certainty, you must admit the data does not support it.
