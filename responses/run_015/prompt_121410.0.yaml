prompt: |-
  In methodological debates about historiography, a common analogy compares writing the history of a present institution—say, modern empirical science—to reconstructing the evolutionary lineage of a living species. On this view, the historian traces the ancestral forms that actually transmitted conceptual "genetic material" to the present (figures like Galileo or Newton, institutions like the Royal Society), while treating extinct branches—hermetic cosmologies, alchemical research programs that left no conceptual descendants—as evolutionary dead ends: perhaps interesting for intellectual paleontology, but not part of the functional explanation of the current form. Defenders present this not as Whig history but as sound causal selection: we study the past that was actually inherited and selected for. Critics respond that the analogy smuggles in a false equivalence between biological inheritance and cultural transmission, and that it treats historical "failure" as absence of causal relevance rather than as a constitutive condition for what eventually succeeded. Please audit this analogy in detail. Provide an explicit correspondence table—what plays the role of the genome, the selection environment, the dead-end lineage, the functional explanation, and the present organism—then locate the fractures in the mapping, especially regarding counterfactual dependency (would the present institution have developed differently had those dead branches persisted or merged?) and the normativity of selection (whether biological "function" can be translated into historical "significance"). Finally, assess whether the analogy genuinely licenses selecting only past ideas that led to the present, or whether the conclusion that such selection is methodologically sound collapses once the disanalogies are on the table; if a better analogy for how historians should relate past ideas to present ones exists, propose it.
