  Subject: Qs for the PAP guest / next week

  Hey Alex,

  Here's the draft for the philosopher interview next week. She's defending PAP against Frankfurt cases by claiming they rely on "unitary intervention architecture" (basically, saying real agency has redundant parallel tracks so alternatives survive at a meta-level). 

  I wanna make sure we don't just let her lecture on that mechanic. Need to press where it breaks. Here's the six I'm thinking, with follow-ups if she tries to wiggle out.

  **1. The Compatibilism Trap**
  If agency is just about having these redundant deliberative tracks, isn't that basically compatibilism? You're saying I'm free because my internal structure works a certain way, not because I could've actually done otherwise in that moment. Are you secretly a compatibilist trying to save libertarian language?
  *Follow-up:* If she says "No, the tracks are indeterministic," ask where the randomness enters without making the action accidental. If it's just determined processing, the label doesn't matter.

  **2. Split-Brain & Collective Cases**
  Your model relies on physical/functional redundancy. So what happens in split-brain patients or committee decisions where those backup tracks are physically separated or distributed? Are those agents *more* free than us because they have more distinct tracks? Or does the architecture break down?
  *Follow-up:* If she says "It's about functional role, not hardware," ask why the Frankfurt counterexample (which is functional) fails then. She can't have it both ways.

  **3. The Super-Intervener**
  Okay, so Black (the intervener) can't see the meta-tracks. But what if we just upgrade Black? If a super-intervener can monitor and block those parallel deliberative tracks too, do alternatives disappear? Or is there an infinite regress of meta-tracks?
  *Follow-up:* If she says "That's metaphysically impossible," ask why. If it's just technologically hard, then PAP still fails in principle, which is all Frankfurt needs.

  **4. Moral Weight of Meta-Alternatives**
  Even if you're right and alternatives exist at the meta-level, does anyone care? If the output action is locked, does the fact that my brain *could have deliberated* differently actually save moral responsibility? It feels like a technicality.
  *Follow-up:* If she says "Deliberation is the action," hit her with snap decisions or habits where deliberation is minimal. Do we lose responsibility there?

  **5. Empirical vs. Conceptual**
  Is this claim about parallel tracks an empirical psychological thesis or a conceptual one? Because if it's empirical, Frankfurt cases (which are thought experiments) shouldn't be vulnerable to it. You're changing the subject from metaphysics to neuroscience.
  *Follow-up:* If she says "It's conceptual," ask why real-world architecture matters. Conceptual truths shouldn't depend on how many neurons we have.

  **6. The "Flicker" Strategy**
  This sounds like a sophisticated version of the "flicker of freedom" strategy (finding some tiny alternative possibility to save PAP). What's the actual difference? If the flicker is just internal processing that never cashes out in action, have you really saved PAP?
  *Follow-up:* If she denies it's a flicker strategy, ask for the definitive distinction. If it quacks like a flicker...

  Let me know if any of these feel too dense for audio. Might need to simplify the setup on #3. 

  Talk soon,
  J
