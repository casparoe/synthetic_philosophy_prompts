  | **Asexual Lineages** | **Case B (Kappa clade):** Bacteria, 4Mb genomes, recombination 2x mutation within ecotypes, 1/20x between, 18% turnover, core vertical. | Ecotypes are species under ecological/phylogenetic concepts; lineage concept is inapplicable or yields one species. | Ecotypes are species if they represent separate evolving lineages; the criterion survives if recombination barriers define lineage segments. | If recombination rates prove irrelevant to ecological independence and niche separation. | If core genome shows no vertical signal distinguishing ecotypes despite niche separation. |
  | **Reticulation & Time** | **Case C (Fern & Marine):** Allopolyploid speciation + 5Myr anagenetic sequence named as three species morphologically. | Allopolyploid adds a species; anagenetic sequence is three species under morphological concept, one under lineage. | Allopolyploid adds a species if isolated; anagenetic sequence is one species unless lineage splits, regardless of morphological change. | If morphological change correlates with reproductive isolation in fossils reliably. | If fossil record reveals cryptic branching within the anagenetic sequence matching morphological shifts. |

  **4. Closing Statement**

  We agree that further empirical work on gene flow rates in asexuals and fossilized lineage splitting would clarify the extent of cross-cutting versus nesting in nature. However, neither party should expect these data to settle the metaphysical question of whether the category itself is singular or plural, as data interpretation relies on prior categorical commitments. The Pluralist most wants the Monist to concede that operational criteria sometimes track real, distinct natural joints that do not nest. The Monist most wants the Pluralist to concede that lineage separation is the only property that grounds cross-clade biodiversity comparisons. If the dispute is verbal regarding the term "species," the residual substantive disagreement concerns whether nature permits multiple equally real ways of segmenting history for scientific purposes. We sign this acknowledging that our collaboration has clarified the stakes without dissolving the disagreement.

