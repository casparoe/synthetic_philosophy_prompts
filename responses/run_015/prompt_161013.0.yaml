  **Joint Statement on the Species Category**

  **1. Agreed Claims**

  1. Species taxa are historical individuals with specific origin-and-extinction conditions, not abstract classes or kinds.
  2. The rank of species carries no metaphysical privilege over the ranks above and below it in the Linnaean hierarchy.
  3. The category question (what is it to be a species?) is logically distinct from the taxon question (is this particular group a species?).
  4. Interbreeding criteria fail to delineate taxa in asexual, uniparental, and reticulate groups where gene flow is absent or ubiquitous.
  5. Diagnosability criteria fragment continuously varying lineages and are sensitive to sampling density and to which loci are chosen.
  6. Different operational criteria frequently yield nested, cross-cutting, or incommensurable groupings depending on the clade and timescale.
  7. Cross-cutting taxa identified by distinct criteria are real historical entities, regardless of their categorical status as species.
  8. Operational criteria are indispensable to practice, serving either as evidence for underlying properties or as constitutive definitions.
  9. Taxonomy requires stability and communicability in naming conventions to function effectively for scientific communication.
  10. Conservation law requires units that capture evolutionary potential and ecological distinctness rather than strict categorical adherence.
  11. Biodiversity accounting requires measures that allow comparison across clades with different reproductive systems.
  12. Within a single clade, one criterion is usually best suited for the specific investigative question at hand.
  13. Within-clade diversity comparisons are scientifically meaningful when criteria are held constant across the comparison.
  14. Conflict among criteria marks either limits of evidence regarding a single property or genuine multiplicity in nature's structure.

  **2. Disagreements Table**

  | Crux | Neutral Restatement | Pluralist Formulation | Monist Formulation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Account Multiplicity** | Does the category admit one correct account or several? | There are several legitimate accounts corresponding to distinct investigative questions about nature. | There is one correct account; others are legitimate only as proxies for that single underlying property. | Substantive (Metaphysics of category) |
  | **Conflict Symptom** | What does conflict among criteria indicate about nature? | Conflict indicates genuine multiplicity where nature presents cross-cutting joints for different questions. | Conflict indicates evidential limitation where proxies fail to track the single lineage property accurately. | Substantive (Structure of nature) |
  | **Criteria Status** | Do criteria constitute species status or merely indicate it? | Criteria constitute status relative to the investigative question supplied by the scientist. | Criteria indicate status but do not constitute it; only lineage separation constitutes species status. | Verbal (Term: "Constitute") |
  | **Taxon Identity** | Can a taxon be a species under one concept but not another? | Yes; the individual remains the same, but its categorical status changes with the concept employed. | No; changing the concept changes the referent, so the taxon is not the same species individual under different concepts. | Verbal (Term: "Species") |
  | **Comparability** | Is species number a legitimate comparative measure across clades? | Only if relativized to a concept; unrelativized comparisons are category mistakes without a shared question. | Yes; species number is determinate even if unknowable, allowing true comparison of diversity across clades. | Substantive (Epistemology) |
  | **Anagenetic Identity** | What identity does a taxon have without branching events? | Identity is relative to the chosen criterion; morphological change may warrant new species names over time. | Identity is fixed by lineage segmentation; anagenesis is one species unless the lineage splits into two. | Substantive (Temporal parts) |

  **3. Tests-and-Predictions Table**

  | Crux | Case or Argument | Pluralist Prediction | Monist Prediction | Outcome Moving Pluralist | Outcome Moving Monist |
  | :--- | :--- | :--- | :--- | :--- | :--- |
