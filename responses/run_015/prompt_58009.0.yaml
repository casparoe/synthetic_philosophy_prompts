answer: |-
  ### The "What Do You Mean by Function?" Decision Tree

  **Start:** We all agree a heart's function is to pump blood. But *why* is that its function? Answer these questions about the tricky cases to find your view.

  **Q1. The One-Off Rabbit**
  A rabbit is born with a random gut mutation that lets it digest a new pesticide. This helps the rabbit survive *right now*, but it is the first rabbit ever to have it, so it has no evolutionary history yet.
  **Is it correct to say the mutation has a biological *function*?**
  *   **NO:** (You think history or established norms are required.) → **Go to Q2.**
  *   **YES:** (You think current usefulness is enough.) → **Go to Q3.**

  **Q2. The Vestigial Goosebumps** (For those who said NO to Q1)
  Human goosebumps don't keep us warm anymore, so they have no current use. But they *did* keep our ancestors warm, so they have an evolutionary history.
  **Do goosebumps still have a *function*?**
  *   **YES:** → **Leaf: Strict History-Only View**
      *   *(You believe function is strictly about what a trait was selected for in the past. If it has history, it has function, even if it does nothing now.)*
  *   **NO:** → **Leaf: Eliminativist View**
      *   *(You rejected the rabbit because it lacked history, and you rejected goosebumps because they lack current use. You likely think "function" is just a loose word for "cause" and doesn't refer to anything real in nature.)*

  **Q3. The Goosebumps Again** (For those who said YES to Q1)
  You think the rabbit's mutation has a function because it helps the rabbit now. But what about human goosebumps? They don't help us now, but they did in the past.
  **Do goosebumps have a *function*?**
  *   **YES:** → **Leaf: Pluralist View**
      *   *(You accept that "function" can mean two different real things: sometimes it means "what it does now," and sometimes it means "what it was designed for." Both count.)*
  *   **NO:** (You require current usefulness, history doesn't count.) → **Go to Q4.**

  **Q4. The Synthetic *E. coli*** (For those who said YES to Q1, NO to Q3)
  Our lab club designed a synthetic *E. coli* from scratch. It detects arsenic to clean up soil. It helps the environment, but humans designed it; the bacterium's own organization didn't create this trait to keep *itself* alive.
  **Does this trait have a biological *function*?**
  *   **YES:** → **Leaf: Current-Contribution View**
      *   *(You believe function is just about what a part does for any larger system it is in. If it does a job (like cleaning soil), it has a function, regardless of who designed it or if it helps the organism survive.)*
  *   **NO:** → **Leaf: Organizational Closure View**
      *   *(You believe a trait only has a function if it contributes to the *self-maintenance* of the living organism itself. Since this trait was externally designed to help the soil (not the bacterium's own survival), it's just a capacity, not a biological function.)*

  ***

  ### Analysis of the Logical Space

  **1. Empty Answer Combos (The "Nobody Sits Here" Zones)**
  There is one logically unstable combination that this tree naturally filters out:
  *   **The "Artifact-Only" Combo:** Saying **NO** to the Rabbit (no history), **NO** to Goosebumps (no current use), but **YES** to the Synthetic *E. coli* (designed utility).
  *   **Why it's empty:** This position is incoherent for a biologist. If you reject function when nature provides current utility (Rabbit) and when nature provides past utility (Goosebumps), you cannot consistently accept function just because a human designer had an intention. That would make "biological function" identical to "human intended use," which contradicts the starting consensus that hearts have functions independent of human designers. This combo usually indicates a student hasn't thought through the implications of their answer.

  **2. Hard-to-Separate Leaves (The "Fuzzy Boundary")**
  *   **Current-Contribution vs. Organizational Closure:** These two leaves are the hardest to separate cleanly (Q4).
  *   **Why:** In many standard biological cases (like a heart pumping blood), these two views agree completely. They only diverge on edge cases like engineered organisms or traits that help the ecosystem but not the organism. A student might hold an Organizational view but answer "Yes" to Q4 because they assume the *E. coli* was engineered to survive *better* with the trait.
  *   **Flag:** If a student lands on **Organizational Closure** but argues that the *E. coli* trait *does* help the bacterium survive, they might actually be a **Current-Contribution** theorist who misunderstood the case description. You may need to clarify: "Imagine the trait does *nothing* for the bacterium's survival, only for the soil."

  **3. The Eliminativist Trap**
  *   The **Eliminativist** leaf (Q2: No) looks identical to a **Current-Contribution** theorist who simply made a mistake on Q1.
  *   **Distinction:** A Current-Contribution theorist says "Yes" to the Rabbit (Q1). An Eliminativist says "No" to the Rabbit (because they deny the category exists) and "No" to Goosebumps (because the category is fake). The tree separates them at Q1, but be aware that some Eliminativists might play along and say "Yes" to the Rabbit colloquially, only to deny the ontology later. This tree forces them to reveal their ontology through case judgments.
