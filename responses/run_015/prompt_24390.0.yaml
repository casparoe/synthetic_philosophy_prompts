prompt: |-
  I run a small expert-dispute desk, and we keep getting cases where two credible experts give conflicting probability estimates on the same factual question and the client has to make a decision that cant be reversed. Right now we just average the two numbers or go with whoever is more senior, which I know is basically a coin flip. Can you turn the common-prior assumption and Aumann's agreeing-to-disagree result (that whole line of work) into a decision procedure my team can actually run on a case, even though none of us have a decision-theory background and we've got roughly a day per case: the questions to put to each expert in order, what counts as a sufficient answer to each, how to tell whether the disagreement is just asymmetric information we can elicit, versus one of them being incoherent, versus the two of them genuinely holding different priors, and where the procedure stops and hands the call to a person because it has become a values question rather than a facts question. Be honest about which steps are judgment calls dressed up as procedure and where the whole thing will misfire, including the case where the common-prior assumption is just false and we should say so instead of forcing a verdict. Then run it on two worked cases: a structural engineer and a geologist disagreeing on the probability a bridge deck fails within ten years, and two epidemiologists disagreeing on whether a new treatment actually reduces mortality. Make sure at least one of the two lands somewhere the client would not want it to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Deconstruct the Request:**
      *   **Context:** Small expert-dispute desk.
      *   **Problem:** Two credible experts give conflicting probability estimates on factual questions. Client needs irreversible decisions. Current method (averaging/seniority) is inadequate.
      *   **Task:** Create a practical decision procedure based on Aumann's Agreement Theorem and common-prior assumptions.
      *   **Constraints:**
          *   No decision-theory background for the team.
          *   Roughly one day per case.
          *   Must include specific questions, criteria for sufficient answers, diagnosis of disagreement type (information vs. incoherence vs. priors), and a stop-rule for values questions.
          *   Must be honest about limitations (judgment calls, failure modes, false common-prior assumption).
          *   Must include two worked cases (Bridge/Engineering vs. Epidemiology).
          *   At least one case must land somewhere the client *would not want* (i.e., counter-intuitive or uncomfortable result).

  2.  **Theoretical Foundation (Aumann & Common Priors):**
      *   *Aumann's Agreement Theorem:* If two agents have common priors and common knowledge of each other's posteriors, they cannot agree to disagree. Their posteriors must be identical.
      *   *Implication:* If they disagree, either (a) they don't have common priors, (b) they don't actually know each other's reasoning/evidence (lack of common knowledge), or (c) one/both are irrational/incoherent.
      *   *Practical Application:* The goal is to convert "private information" into "common knowledge" to see if the disagreement resolves. If it doesn't, we need to diagnose *why*.

  3.  **Drafting the Procedure (The "Aumann Audit"):**
      *   *Goal:* Make it actionable for non-experts in decision theory.
      *   *Timeframe:* 1 day.
      *   *Steps:*
          1.  **Calibration & Definition:** Ensure they are answering the *same* question.
          2.  **Evidence Exchange (The "Bayesian Update"):** Force them to reveal the *weight* of their evidence, not just the conclusion.
          3.  **The "Why" Interrogation:** Dig into the models/priors.
          4.  **Diagnosis:** Classify the disagreement.
          5.  **Resolution/Handoff:** Decide or escalate.
      *   *Honesty Check:* Where are the judgment calls? (e.g., determining if a prior is "reasonable," identifying hidden values). Where does it misfire? (e.g., when priors are fundamentally different due to professional training).

  4.  **Developing the Questions:**
      *   Need to avoid jargon. Instead of "What is your prior?", ask "Before seeing this specific data, what would you have guessed?"
      *   Instead of "Posterior," ask "Given X, what is your new estimate?"
      *   Key question: "What specific piece of information would change your mind?"

  5.  **Defining the Disagreement Types:**
      *   *Asymmetric Information:* One knows something the other doesn't. (Resolvable).
      *   *Incoherence:* Math doesn't add up, or they ignore evidence. (Resolvable by discarding/weighting).
      *   *Different Priors:* Fundamental worldview differences. (Not resolvable factually).
      *   *Values disguised as Facts:* "Safe" means different things to different people. (Handoff).

  6.  **Developing the Worked Cases:**
      *   *Case 1: Bridge Deck (Engineer vs. Geologist).*
          *   *Conflict:* Engineer says 5% failure risk. Geologist says 20%.
          *   *Dynamic:* Engineer trusts materials/models. Geologist trusts soil/unpredictability.
          *   *Resolution:* Likely different priors on "unknown unknowns."
          *   *Client Preference:* Client wants to build (low risk).
          *   *Outcome:* Procedure reveals Geologist is accounting for tail risk Engineer ignores. Result might be "Don't build" or "Expensive mitigation." Let's make it land where the client *doesn't* want it (i.e., the higher risk estimate is validated).
      *   *Case 2: Epidemiology (Treatment Mortality).*
          *   *Conflict:* Exp A says reduces mortality. Exp B says no effect/harm.
          *   *Dynamic:* RCT data vs. Observational data / Mechanism.
          *   *Resolution:* One is incoherent or relying on outdated priors.
          *   *Client Preference:* Client wants to approve drug (profit/help).
          *   *Outcome:* Let's make this one resolve cleanly (information asymmetry) to show the procedure *can* work, contrasting with the Bridge case. Or vice versa. The prompt asks for *at least one* landing where the client would not want it. I'll make the Bridge case the "uncomfortable" one (high risk confirmed) and the Epi case the "resolved" one (information asymmetry cleared).

  7.  **Refining the "Honesty" Section:**
      *   Must explicitly state: This doesn't magic away uncertainty.
      *   Common Prior Assumption (CPA) is often false in practice (different training = different priors).
      *   The procedure can be gamed by sophisticated experts.
      *   Time limit (1 day) is tight for deep epistemic digging.

  8.  **Review against Constraints:**
      *   *Decision procedure?* Yes, step-by-step.
      *   *Questions included?* Yes.
      *   *Sufficient answer criteria?* Yes.
      *   *Diagnosis types?* Yes.
      *   *Stop rule for values?* Yes.
      *   *Honest about limitations?* Yes.
      *   *Two worked cases?* Yes.
      *   *One uncomfortable outcome?* Yes (Bridge case).

  9.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, pragmatic, slightly skeptical of the theory's limits.
      *   *Structure:* Introduction -> The Procedure (The "Aumann Audit") -> Limitations/Warnings -> Worked Case 1 -> Worked Case 2.
      *   *Self-Correction on Case 1:* Make sure the Engineer isn't just "wrong." Make it a clash of *models*. The Engineer uses standard load models. The Geologist sees soil liquefaction potential not in standard models. The procedure should highlight that the Engineer's prior assumes "standard conditions" while Geologist's prior assumes "local anomalies." This is a prior clash. The verdict should side with the Geologist (higher risk), which costs the client money.
      *   *Self-Correction on Case 2:* Epidemiologists. One looks at Intent-to-Treat, one looks at Per-Protocol. Or one trusts the RCT, one trusts the biological mechanism. Let's go with Data Weighting. Expert A ignores a confounder. Expert B spots it. Procedure reveals Expert A missed a variable (Incoherence/Info Asymmetry). Verdict sides with B. Client wanted A (maybe A was the internal team).

  10. **Final Polish:** Ensure the distinction between "Fact" and "Value" is clear. (e.g., "Is it safe?" is a fact. "Is it safe *enough*?" is a value.)

  *(Self-Correction during drafting)*: Wait, Aumann's theorem assumes *common priors*. In the real world, an Engineer and a Geologist *do not* have common priors. Their training instills different baseline probabilities. I need to make sure the procedure explicitly tests for this and admits when CPA fails. The procedure shouldn't promise to resolve prior clashes, but to *identify* them so the client knows they are making a value judgment (risk tolerance) rather than a fact judgment.

  *Revised Plan for Case 1:* The procedure identifies that the disagreement is *not* resolvable via information exchange because it stems from different professional priors (Engineer: materials are predictable; Geologist: earth is chaotic). The recommendation to the client is: "This is not a factual dispute; this is a risk-tolerance question. Expert A says 5%, Expert B says 20%. You must choose your risk appetite." This forces the client to own the risk. That is an outcome they might not want (they wanted an answer, not a choice).

  *Revised Plan for Case 2:* Information asymmetry. One expert didn't see the latest dataset. Procedure fixes it. Consensus reached.

  Let's write it.
answer: |-
  # The "Aumann Audit": A Practical Procedure for Expert Disputes

  **Warning:** This procedure is based on Aumann's Agreement Theorem, which states that two rational agents with common priors and common knowledge of each other's beliefs cannot agree to disagree. In the real world, experts are not perfectly rational, and priors are rarely common. This tool does not magic away uncertainty. It distinguishes between **resolvable ignorance** (missing data), **incoherence** (bad math/reasoning), and **fundamental divergence** (different worldviews/values).

  **Time Budget:** 1 Day (approx. 6 hours of active facilitation).
  **Facilitator:** One member of your desk (no PhD required, but must be authoritative).

  ---

  ## Part 1: The Procedure

  ### Phase 1: Calibration (Hour 1)
  *Goal: Ensure they are answering the exact same question.*

  **Question to Both:** "Write down the exact proposition you are assigning a probability to. Define every term."
  *   **Sufficient Answer:** "Probability that [Specific Component] fails under [Specific Load/Condition] within [Specific Timeframe]."
  *   **Red Flag:** If Expert A says "failure" means "catastrophic collapse" and Expert B means "needs repair," stop. Force a unified definition. If they refuse, this is a values dispute, not a facts dispute. **Hand off to client.**

  ### Phase 2: The "Prior" Check (Hour 2)
  *Goal: Test the Common Prior Assumption (CPA).*

  **Question to Both:** "Ignore the specific data for this case for a moment. Based on your general experience in this field, what is the base rate for this outcome? If I told you nothing else, what would your guess be?"
  *   **Sufficient Answer:** A number or range grounded in historical data or standard models (e.g., "Historically, 1 in 100 bridges of this type fail").
  *   **Diagnosis:**
      *   **Match:** Priors are similar. Proceed to Phase 3.
      *   **Mismatch:** One says 1%, the other says 30%. This indicates **Different Priors**. Their professional training or worldview differs. Note this. Proceed to Phase 3 to see if data bridges the gap.

  ### Phase 3: Evidence Exchange & Weighting (Hours 3-4)
  *Goal: Convert private information into common knowledge.*

  **Step 3a:** Ask Expert A: "List the top three pieces of evidence that moved your estimate from your Base Rate (Phase 2) to your Final Estimate. Assign a 'weight' to each (how much it moved the needle)."
  **Step 3b:** Show this list to Expert B. Ask: "Do you have this data? If yes, do you interpret it differently? If no, does acquiring it change your estimate?"
  **Step 3c:** Repeat for Expert B.

  *   **Sufficient Answer:** Specific data points (e.g., "Soil sample #4," "RCT Table 2"). Not vague appeals to authority ("The literature says...").
  *   **Diagnosis:**
      *   **Asymmetric Information:** Expert B says, "I didn't see Soil Sample #4. If I include that, my estimate moves to match Expert A." **Verdict: Consensus Reached.**
      *   **Interpretive Disagreement:** Both have the data, but Expert A thinks it implies X and Expert B thinks it implies Y. Proceed to Phase 4.

  ### Phase 4: The "Change My Mind" Test (Hour 5)
  *Goal: Identify Incoherence vs. Deep Prior Clash.*

  **Question to Both:** "What specific piece of information, if I showed it to you right now, would cause you to move your probability estimate by at least 10% toward the other expert's number?"
  *   **Sufficient Answer:** A falsifiable condition (e.g., "If the tensile strength is below X," "If the p-value is above 0.05").
  *   **Red Flag (Incoherence):** "Nothing would change my mind." (Dogmatism). **Verdict: Discount this expert.**
  *   **Red Flag (Values Disguised as Facts):** "I wouldn't change my mind because the cost of failure is too high." This is a risk tolerance statement, not a probability estimate. **Hand off to client.**
  *   **Green Light:** They identify a data gap. If time permits, check the data. If not, note the uncertainty.

  ### Phase 5: The Verdict Memo (Hour 6)
  *Goal: Classify the disagreement for the client.*

  Do not just give a number. Give a **Classification**:
  1.  **Resolved:** Experts agreed after information exchange. (Use the agreed number).
  2.  **Information Gap:** Experts still disagree, but we know exactly what data is missing. (Recommend: Buy the data, or average the numbers with a warning).
  3.  **Prior Clash:** Experts have the same data but different baseline models of how the world works. (Recommend: This is a risk-tolerance choice, not a fact finding. Present both numbers).
  4.  **Incoherence:** One expert is ignoring evidence or logic. (Recommend: Side with the coherent expert).

  ---

  ## Part 2: Honest Limitations (Where This Misfires)

  1.  **The Common Prior Assumption is Usually False:** An engineer and a geologist *should* have different priors. One trusts materials; the other trusts earth. This procedure cannot "fix" that. It only reveals it. If you force a consensus here, you are lying.
  2.  **Gaming:** Sophisticated experts can learn to give "Sufficient Answers" that sound rigorous but hide their bias. Your team must check if the "weights" in Phase 3 make mathematical sense.
  3.  **The "Values" Mask:** Experts often hide value judgments ("Safety is paramount") inside probability estimates ("Probability of failure is high"). Phase 4 catches most of this, but not all.
  4.  **Time Pressure:** One day is not enough to verify complex data. You are auditing their *process*, not their *data*. If they lie about the data, you will miss it.

  ---

  ## Part 3: Worked Cases

  ### Case 1: The Bridge Deck (Structural Engineer vs. Geologist)
  **Context:** Client wants to extend the life of a 30-year-old bridge by 10 years.
  **Conflict:**
  *   **Expert A (Structural Engineer):** 5% probability of deck failure within 10 years.
  *   **Expert B (Geologist):** 25% probability of deck failure within 10 years.
  **Client Preference:** Client wants to keep the bridge open (prefers Expert A).

  **Running the Audit:**
  *   **Phase 1 (Calibration):** Both agree "failure" means "closure for emergency repair."
  *   **Phase 2 (Priors):**
      *   Engineer Base Rate: 2% (Steel decks in dry climates last 50 years).
      *   Geologist Base Rate: 15% (Foundations in this specific watershed are unstable).
      *   *Diagnosis:* **Different Priors.** Engineer looks up; Geologist looks down.
  *   **Phase 3 (Evidence):**
      *   Engineer cites steel corrosion tests (all within spec).
      *   Geologist cites soil subsidence data from 2 miles away (showing sinkhole activity).
      *   Engineer says: "That soil data is irrelevant to the steel."
      *   Geologist says: "If the foundation shifts 2 inches, the steel shears regardless of corrosion."
  *   **Phase 4 (Change My Mind):**
      *   Engineer: "If you show me foundation movement < 0.5 inches over the last 5 years, I will lower my risk to 10%."
      *   Geologist: "If you show me the steel can tolerate 3 inches of shear, I will lower my risk to 10%."
      *   *Facilitator Check:* There is no data on foundation movement for *this* bridge (only the one 2 miles away). The steel tolerance is theoretical.
  *   **Phase 5 (Verdict Memo):**
      *   **Classification:** **Prior Clash / Information Gap.**
      *   **Finding:** The disagreement is not about the steel quality (Engineer is right) but about the likelihood of ground movement triggering failure (Geologist is right). The Engineer's model assumes stable ground; the Geologist's model assumes chaotic ground. Neither is "incoherent."
      *   **Recommendation:** **Do not average.** The Geologist's estimate accounts for a "tail risk" the Engineer's model structurally ignores.
      *   **Final Number to Client:** **20-25% failure risk.** (We side with the expert whose model includes the external shock variable).

  **Outcome:** The client **hates this**. They wanted to keep the bridge open. The procedure forced you to validate the "pessimistic" expert because their model was more comprehensive regarding external variables, even though the Engineer was more senior. You had to tell the client: "This isn't a math error; it's that your Engineer isn't looking at the ground."

  ---

  ### Case 2: The New Treatment (Epidemiologist A vs. Epidemiologist B)
  **Context:** Client (Insurance Co.) deciding whether to cover a new expensive heart drug.
  **Conflict:**
  *   **Expert A:** 80% probability the drug reduces mortality.
  *   **Expert B:** 40% probability the drug reduces mortality.
  **Client Preference:** Client wants to deny coverage (prefers Expert B).

  **Running the Audit:**
  *   **Phase 1 (Calibration):** Both agree "reduces mortality" means "statistically significant reduction in all-cause mortality at 5 years."
  *   **Phase 2 (Priors):**
      *   Both cite similar base rates for similar drug classes (approx. 50% chance of success).
      *   *Diagnosis:* **Common Priors.**
  *   **Phase 3 (Evidence):**
      *   Expert A cites the Phase 3 Randomized Controlled Trial (RCT).
      *   Expert B cites observational data from early adopters showing high side-effect dropout.
      *   *Facilitator Check:* Expert A reveals they excluded patients with comorbidities from their probability calculation. Expert B included them.
  *   **Phase 4 (Change My Mind):**
      *   Facilitator asks Expert A: "If we include patients with comorbidities, does your probability drop?"
      *   Expert A: "Yes, significantly. The RCT excluded them for safety, but real-world usage includes them."
      *   Expert A admits their 80% figure applies only to "ideal patients," not the general population.
      *   *Diagnosis:* **Incoherence / Scope Error.** Expert A's probability claim was factually misleading regarding the population scope.
  *   **Phase 5 (Verdict Memo):**
      *   **Classification:** **Resolved (Information Asymmetry).**
      *   **Finding:** Expert A was not lying, but their probability estimate was conditional on a population subset that does not match the client's insured pool. Expert B was looking at the correct population.
      *   **Recommendation:** **Side with Expert B.** Adjusted probability is 40%.

  **Outcome:** The client is **happy**, but for the right reasons. The procedure didn't just validate their bias; it exposed that Expert A's "80%" was technically true but practically useless for the specific decision at hand.

  ---

  ## Summary for Your Team

  1.  **Don't Average Blindly:** If the disagreement is a **Prior Clash** (Case 1), averaging hides the risk. Pick the model that accounts for more variables (usually the more pessimistic one on safety).
  2.  **Watch for Scope:** If the disagreement is **Information/Scope** (Case 2), force them to align the population/conditions. One will usually concede.
  3.  **Know When to Quit:** If Phase 4 reveals they won't change their mind even with new data, stop. Tell the client: "This is a values question. Expert A values efficiency; Expert B values safety. You must choose the value, not the fact."

  **Final Warning:** If you run this audit and conclude "Common Prior Assumption is False" (Case 1), do not try to fix it. Your job is to tell the client they are buying a lottery ticket, not a certainty. That is the only honest verdict.
