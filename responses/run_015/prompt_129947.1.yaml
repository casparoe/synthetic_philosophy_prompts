          *   Clarify Schelling's "threat that leaves something to chance." It's not necessarily a Dead Hand (deterministic). It's often about the *fog of war* and the risk of escalation spiraling out of control. Automation reduces control, which *creates* the uncertainty the adversary fears.
          *   *Correction on User's Premise:* The user says automation removes uncertainty. Actually, automation *creates* uncertainty about whether the human can stop it. If I know you have a Dead Hand, I am uncertain if I can provoke you without triggering it.
      *   *Section 2: Is "Rational Brinkmanship" Incoherent?*
          *   No. It's a commitment problem.
          *   Analogy: Ulysses and the Sirens. Tying oneself to the mast is rational.
          *   The coherence lies in the *belief* of the adversary. If they believe the mechanism is out of your hands, the threat is credible.
      *   *Section 3: Luck vs. Design in the Cold War.*
          *   Design: MAD, second-strike stability, crisis comms.
          *   Luck: Near misses (Petrov, etc.).
          *   Schelling's own view: He admitted the strategy relies on accepting risk. If the risk is too high, luck becomes the deciding factor.
          *   Conclusion: It was a mix. Design managed the probabilities; luck determined the specific outcomes of close calls.
      *   *Section 4: Refining the "Uncertainty" Concept.*
          *   Crucial distinction: Uncertainty about *intent* vs. uncertainty about *control*.
          *   Dead Hand creates certainty of retaliation *if* triggered, but uncertainty about *what triggers it* (due to fog of war).
          *   Brinkmanship is about raising the *shared risk*, not just promising retaliation.

