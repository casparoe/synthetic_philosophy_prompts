      *   *Schelling's specific point:* He argued against "certain retaliation" because it's incredible. He argued for "probabilistic retaliation." A Dead Hand makes retaliation *conditional* on sensors, not human will. This introduces a different kind of uncertainty (technical failure vs. human hesitation).
