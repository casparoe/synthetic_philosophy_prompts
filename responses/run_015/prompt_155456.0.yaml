      *   *Objection 5 (Clinical/Operational):* Defining an "episode." Is it temporal? Phenomenological? How do we measure this at the bedside?
          *   *Bloc:* Clinicians/Ethicists.
          *   *Damage:* Medium (operationalizability).
          *   *Likelihood:* High.
      *   *Objection 6 (Disability/Chronic):* Chronic conditions don't have "episodes." They have states. Does your view ignore chronic sufferers?
          *   *Bloc:* Disability Studies/Palliative.
          *   *Damage:* High (exclusion of key population).
          *   *Likelihood:* Medium.
      *   *Objection 7 (Deontology/Non-Identity):* You claim to avoid existence questions, but resource allocation affects who gets treated and potentially future demographics.
          *   *Bloc:* Deontologists/Philosophers.
