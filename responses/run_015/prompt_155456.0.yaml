      *   *Lexical Priority:* No trade-off between agony and mild pain.
      *   *Leximin:* Prioritize the person with the worst worst-episode.
      *   *Vulnerability 1 (Clinical):* Triage implications. Ignoring total burden. What about chronic moderate pain vs. acute severe pain?
      *   *Vulnerability 2 (Disability):* Stigmatizing severe impairment. Expressivism.
      *   *Vulnerability 3 (Economics):* Efficiency loss. Opportunity costs.
      *   *Vulnerability 4 (Deontology):* Aggregation is still happening (interpersonal).
      *   *Vulnerability 5 (Metaphysical/Epistemic):* Defining an "episode." Measurement issues.
