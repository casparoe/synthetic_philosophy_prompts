prompt: |-
  I work in the economics office of a regulatory agency, and I am drafting an internal methods note on our benefit–cost practice. I do not want a verdict on whether the practice is good; I want the theory it is implicitly committed to reconstructed, and I want the places where it is philosophically underdetermined flagged as underdetermined.

  The practice, as it actually operates. To score a proposed rule we monetize every consequence in dollars and add: households' willingness to pay for each benefit, firms' compliance costs, and mortality risk reductions valued at a single figure per statistical life applied to the expected number of deaths averted. A reduction of one-in-ten-thousand in the annual risk of each of ten thousand people is costed exactly as one life saved, and exactly as the certain avoidance of one identifiable death. Rules are ranked by net benefits with no weights attached to whose benefits and costs they are; when a rule's costs fall on one income group and its benefits on another, our guidance asks for a separate distributional statement but instructs us not to fold equity weights into the net-benefit calculation. The value-of-life figure itself is revised upward over time as real incomes rise, on the ground that willingness to pay for safety increases with income.

  I have been reading about Harsanyi's aggregation theorem, and the practice looks as though it were built to match that result's conclusion — social welfare as a weighted sum of individual expected utilities — while quietly failing to match its premises. I want that suspicion tested piece by piece, in the following order.

  First, reconstruct the social welfare function the practice must be using if it is coherent, and tell me what it strictly presupposes as opposed to what merely fits it. In particular, does the practice need each of the theorem's premises — expected-utility rationality for individuals, expected-utility rationality for the social ranking itself, the unanimity condition, and the impartiality or equiprobability step that converts free weights into equal ones — or does it need only the conclusion? My own suspicion is that the instruction not to use equity weights is doing work that nothing in the aggregation result requires, since the result leaves the weights undetermined; confirm or dislodge that.

  Second, the currency problem. The weights in the theorem are weights on von Neumann–Morgenstern utility functions, and those functions are determined only up to positive affine transformation, with the weights absorbing any rescaling, so that the resulting ranking is invariant to how each person's utility is normalized. Our currency is dollars, and a person's utility is an affine function of dollars only if that person is risk-neutral with respect to money. Work out what the practice therefore implies: if a dollar is counted as worth the same wherever it lands, what is being said about the weight on each person's well-being? I think the answer is that equal treatment per dollar amounts to unequal treatment per unit of utility in a determinate direction, and that the direction is the opposite of what the impartial framing of the practice suggests — but I want the argument made properly, including whether the practice might instead be defended as a weighted sum with unequal yet principled weights rather than dismissed as a botched equal-weight sum.

  Third, a diagnostic I would like you to apply. Because the Harsanyian sum is invariant to positive affine rescaling of each individual's utility, any aggregation method whose rankings shift when you change units or baselines is not a Harsanyian sum. Is dollar-metric aggregation invariant in that sense, given that the dollar value assigned to a person's gain depends on the income or consumption level at which the conversion into money is made? If two analysts who convert at different reference levels can reverse the ranking of the same pair of rules, say what that establishes: is the practice committed to universal risk-neutrality in money, or only to a particular cardinalization that it never explicitly chose?

  Fourth, ex ante or ex post. Under the practice as described, a prospect that imposes certain death on one person and one that imposes a one-in-ten-thousand risk on each of ten thousand people are costed identically. Is the practice therefore committed to evaluating prospects by the sum of expected utilities rather than by how outcomes look once the uncertainty is resolved, and to indifference between concentrated and dispersed fatal risk at equal expected value? Tell me what the best-known objection to that indifference is, what it would take for the practice to register it, whether any scoring rule we actually use would have to change, and whether our separate handling of identifiable lives — the refusal to score a named worker facing a known hazard the way we score a statistical one — is a genuine inconsistency or a defensible division of labor.

  Fifth, suppose an internal review found that stated willingness to pay per unit of risk reduction is systematically larger for large risk reductions than for small ones, so that the single value-of-life figure is not a constant marginal rate of substitution at all. Which premise of the reconstruction would that break, and would we then still be aggregating expected utilities, or something that merely resembles them? Does anything in the argument for the aggregation result tell us which way to go once that premise fails?

  Finally, and most usefully for my note: if we took the result seriously as a constraint on our practice, what exactly would have to change? Separate the changes that are forced by the aggregation result itself, the changes that follow only if one adds an equal-weight or impartial-observer premise, and the changes that follow only if one rejects ex ante evaluation in favour of an ex post one. And be explicit about where the practice is underdetermined: if several different welfare functions would generate the same scores, the note should say so rather than announcing that we have uncovered a hidden utilitarianism in our spreadsheets.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Economist in a regulatory agency drafting an internal methods note on benefit-cost analysis (BCA).
      *   **Goal:** Reconstruct the implicit social welfare theory behind current practice, flag philosophical underdetermination, and test the connection to Harsanyi's Aggregation Theorem.
      *   **Constraints:** No verdict on "goodness." Focus on theoretical coherence vs. underdetermination. Specific six-part structure required.
      *   **Current Practice:** Monetize all consequences (WTP for benefits, compliance costs, VSL for mortality). Sum net benefits. No equity weights in the sum (distributional analysis is separate). VSL scales with income. Risk neutrality regarding statistical lives (1/10,000 x 10,000 = 1 life).
      *   **Key Theoretical Lens:** Harsanyi's Aggregation Theorem (Social Welfare = Weighted Sum of Individual Expected Utilities).
      *   **Tone:** Professional, analytical, precise, suitable for an internal methods note.

  2.  **Deconstruct the Six Parts:**

      *   **Part 1: Social Welfare Function (SWF) Reconstruction & Harsanyi's Premises.**
          *   *Task:* Identify the implicit SWF. Does it need Harsanyi's premises (Individual EU, Social EU, Pareto/Unanimity, Impartiality) or just the conclusion? Address the "no equity weights" instruction.
          *   *Analysis:* The practice sums dollars. This implies $SW = \sum W_i \cdot U_i$. If dollars are the metric, it looks like Utilitarianism (Sum of Utilities). Harsanyi proves that if Individual and Social preferences satisfy VNM axioms and Pareto, then $SW = \sum a_i U_i$. The weights $a_i$ are *not* determined by the theorem; they are ethical inputs. The agency's instruction "no equity weights" effectively sets $a_i$ based on dollar capacity, not equal welfare weights.
          *   *Key Insight:* The practice matches the *form* (linear sum) but bypasses the *derivation* (it doesn't check VNM axioms for individuals). The "no equity weights" instruction fixes the weights based on market capacity (WTP), not moral impartiality. Harsanyi leaves weights free; the agency fixes them implicitly via income-dependent WTP.

      *   **Part 2: The Currency Problem (Dollars vs. Utility).**
          *   *Task:* Harsanyi weights VNM utilities (affine invariant). Agency weights dollars. What does equal weight per dollar imply for weight per utility?
          *   *Analysis:* $U_i(\$)$ is concave for risk-averse individuals (diminishing marginal utility of income). If we sum dollars ($\sum \Delta Y_i$), we are implicitly weighting utility by $1/U'_i(Y)$. Richer people have lower marginal utility of money, so a dollar represents *less* utility for them. However, the agency uses WTP, which scales with income. If VSL rises with income, the weight on safety for the rich is higher.
          *   *Key Insight:* Summing dollars is *not* summing utilities unless everyone is risk-neutral in money. If $U_i$ is concave, summing dollars gives more weight to the rich (per unit of utility). The practice implies a specific cardinalization where money is the utility proxy. This contradicts the "impartial" veneer if impartiality means equal weight on *welfare*, not *willingness to pay*.

      *   **Part 3: Invariance Diagnostic (Affine Transformations).**
          *   *Task:* Harsanyi sum is invariant to affine rescaling of $U_i$. Is dollar aggregation invariant?
          *   *Analysis:* No. WTP depends on the budget constraint and marginal utility of income. If Analyst A assumes high marginal utility of income and Analyst B assumes low, WTP changes. More critically, if we change the numeraire or the baseline income level for WTP elicitation, the dollar values shift non-linearly if utility isn't linear in money.
          *   *Key Insight:* Dollar aggregation is *not* invariant to affine transformations of underlying utility. It commits to a specific cardinalization (money = utility). This implies the practice assumes universal risk-neutrality in money *or* arbitrarily fixes the cardinalization without justification. It exposes the "underdetermination": the math works only if we assume $U(\$) = \$$.

      *   **Part 4: Ex Ante vs. Ex Post (Risk & Identifiable Lives).**
          *   *Task:* 1/10,000 risk x 10,000 people = 1 life. Certain death = 1 life. Is this Ex Ante Expected Utility? What about the "Identifiable Victim Effect"?
          *   *Analysis:* Treating statistical and certain deaths equally implies Ex Ante Expected Utility maximization (linearity in probabilities). Ex Post views (e.g., prioritarianism or concern for ex post inequality) would dislike concentrated risk.
          *   *Key Insight:* The practice is strictly Ex Ante EU. The "identifiable victim" distinction (often treated differently in public discourse/politics, though the prompt says the agency costs them the same) is actually consistent with the theory *if* the probability is 1. However, if the agency treats a *known* person differently than a *statistical* person with $p=1$, that's inconsistent. The prompt says they cost them "exactly as" one life saved. So the practice is consistent internally with Ex Ante EU. The objection is usually "ex post prioritarianism" or "fairness in risk distribution." To register this, the scoring rule would need a penalty for variance in risk exposure.

      *   **Part 5: Non-Constant Marginal WTP (WTP for Risk).**
          *   *Task:* If WTP per unit risk isn't constant (e.g., higher for large risks), what breaks?
          *   *Analysis:* VSL assumes linearity: $WTP = VSL \times \Delta p$. If WTP is non-linear in $p$, then $U$ is not linear in probabilities, or the marginal utility of income changes significantly with the risk change. This violates the VNM independence axiom or the small-risk approximation.
          *   *Key Insight:* It breaks the "Expected Utility" premise for the individual. If $WTP$ isn't linear in $p$, individuals aren't maximizing EU (or the risk is too large for the VSL approximation). The aggregation is no longer a sum of expected utilities. It becomes a sum of non-linear value functions. Harsanyi doesn't apply.

      *   **Part 6: Prescriptive Changes (What if we took Harsanyi seriously?).**
          *   *Task:* What changes are forced by Aggregation Theorem vs. Equal Weights vs. Ex Post? Where is it underdetermined?
          *   *Analysis:*
              *   *Aggregation Theorem:* Requires consistent EU preferences. Requires Pareto. Doesn't force equal weights.
              *   *Equal Weights:* Requires equity weighting (adjusting dollars to utils).
              *   *Ex Post:* Requires changing the objective function (not just summing ex ante expectations).
              *   *Underdetermination:* Many SWFs can mimic dollar sums locally. We haven't proven Utilitarianism, only Kaldor-Hicks efficiency potential.
          *   *Key Insight:* To be Harsanyi-compliant, we need to measure *utils*, not dollars (equity weighting). To be Ex Post compliant, we need to penalize risk concentration. Currently, the practice is Kaldor-Hicks (potential Pareto), not necessarily Social Welfare Maximization.

  3.  **Drafting the Response:**
      *   *Tone:* Formal, analytical, "internal memo" style but addressing the user's theoretical queries directly.
      *   *Structure:* Follow the user's six points exactly.
      *   *Content:* Ensure precise economic/philosophical terminology (VNM, affine transformation, Kaldor-Hicks, Ex Ante/Ex Post).
      *   *Self-Correction during drafting:*
          *   *Check:* Did I distinguish between Harsanyi's theorem (which leaves weights free) and Utilitarianism (which sets them equal)? *Correction:* Yes, emphasize that the agency's "no equity weights" is an ethical choice that contradicts the "impartial observer" interpretation of Harsanyi, even if it fits the linear form.
          *   *Check:* Did I address the VSL income scaling? *Correction:* Yes, this is crucial for Part 2. If VSL rises with income, the implicit welfare weight on the rich is higher.
          *   *Check:* Is the distinction between "underdetermined" and "inconsistent" clear? *Correction:* Ensure Part 6 explicitly lists where multiple theories fit the data.

  4.  **Final Review against Constraints:**
      *   No verdict on "goodness." (Check)
      *   Reconstruct theory. (Check)
      *   Flag underdetermination. (Check)
      *   Six specific sections. (Check)
      *   Address Harsanyi specifics (premises vs. conclusion). (Check)

  5.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output).

  *(Self-Correction Note on Part 4)*: The prompt says "exactly as one life saved, and exactly as the certain avoidance of one identifiable death." This means the agency *does not* distinguish between statistical and identifiable lives in the *scoring*. I need to make sure I don't accuse them of inconsistency there, but rather note that this *confirms* the Ex Ante EU commitment, despite public intuition to the contrary.

  *(Self-Correction Note on Part 2)*: Be careful with the "risk neutrality" claim. Summing dollars implies risk neutrality *with respect to the numeraire*. It doesn't mean individuals are risk neutral about safety (VSL captures risk aversion regarding death), but it assumes linear aggregation of monetary equivalents.

  *(Refining Part 6)*: Make sure to distinguish between what Harsanyi *requires* (linearity, Pareto) vs. what *Utilitarianism* requires (equal weights). The agency does the former (roughly) but rejects the ethical implication of the latter (equity weighting).

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Internal Methods Working Group
  **FROM:** Economic Office
  **SUBJECT:** Theoretical Reconstruction of Benefit–Cost Aggregation Practice
  **DATE:** October 26, 2023

  **1. Reconstruction of the Implicit Social Welfare Function**

  Your practice aggregates monetized consequences into a single net benefit figure: $NB = \sum Benefits - \sum Costs$. In welfare theoretic terms, this operates as a Social Welfare Function (SWF) of the form:

  $$W = \sum_{i=1}^{N} \lambda_i \cdot Y_i$$

  Where $Y_i$ represents the monetary equivalent gain for individual $i$, and $\lambda_i$ is the weight attached to that individual's monetary gain. By instructing analysts not to apply equity weights, the agency effectively sets $\lambda_i = 1$ for all $i$.

  **Relation to Harsanyi's Aggregation Theorem:**
  Harsanyi's theorem states that if (1) individual preferences satisfy von Neumann–Morgenstern (VNM) axioms, (2) social preferences satisfy VNM axioms, and (3) the Social Welfare Function satisfies the Pareto principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then the SWF must be a weighted sum of individual utilities: $W = \sum a_i U_i$.

  Your practice matches the *conclusion* (a linear sum) but bypasses the *premises*.
  *   **Individual Rationality:** The practice does not verify that households satisfy VNM axioms; it infers utility from observed Willingness To Pay (WTP), which presupposes rationality but does not test it.
  *   **Social Rationality:** The practice assumes the social ranking is transitive and complete by construction (summing scalars), but this is an arithmetic artifact, not a derived property of social preferences.
  *   **Unanimity/Pareto:** The practice respects the Pareto principle only in the Kaldor-Hicks sense (potential compensation), not the strict Paretian sense. A rule with positive net benefits could make some individuals worse off without compensation.
  *   **Impartiality/Weights:** Harsanyi's theorem *does not* determine the weights $a_i$; they remain free parameters determined by ethical premises. The "impartial observer" argument is often used to justify setting $a_i$ equal (Utilitarianism).

  **The "No Equity Weights" Instruction:**
  You suspect this instruction does work that the aggregation result does not require. This is correct. Harsanyi's theorem allows for *any* set of positive weights $\{a_i\}$. The instruction to set equity weights to unity is not a requirement of aggregation logic; it is an independent ethical constraint that equates a dollar of WTP across persons. Consequently, the practice is not committed to Harsanyi's *derivation*, only to a *Kaldor-Hicks efficiency* criterion that mimics the mathematical form of Utilitarianism while rejecting its distributional implications. The practice is theoretically coherent as a Potential Pareto criterion, but it is underdetermined as a Social Welfare maximization exercise because it conflates *capacity to pay* with *moral weight*.

  **2. The Currency Problem: Dollars vs. Utility**

  Harsanyi's weights apply to VNM utility functions, which are unique only up to positive affine transformation ($U' = aU + b$). A sum of utilities $\sum U_i$ is invariant to these transformations provided the weights adjust inversely.

  Your practice sums dollars ($\sum Y_i$). This implies that for each individual, $U_i(Y) = Y$ (or is linear in $Y$).
  *   **Implication:** If individuals are risk-averse regarding income (which standard economic theory posits, implying concave utility $U''(Y) < 0$), then the marginal utility of a dollar declines as income rises.
  *   **The Weighting Effect:** By counting every dollar equally ($\lambda_i = 1$), you are implicitly weighting individual *utility* by the inverse of their marginal utility of income. Since marginal utility of income is typically lower for high-income individuals, giving equal weight to their dollars assigns *greater* welfare weight to the rich than to the poor.
  *   **Direction of Bias:** Contrary to the impartial framing, the practice systematically favors outcomes where benefits accrue to those with higher marginal WTP (typically higher income), even if their utility gain is smaller.
  *   **Defense as Principled Weights:** The practice could be defended not as a "botched equal-utility sum" but as a deliberate "Welfarism via Sovereignty" model. This view holds that individual preferences revealed through market constraints (WTP) are the only legitimate metric, regardless of income inequality. However, this is a substantive ethical claim (libertarian/contractarian), not a neutral application of Harsanyi's aggregation. It requires admitting that the SWF is $W = \sum U_i(Y_i) \cdot (1/U'_i(Y_i))$, which is a specific, inegalitarian weighting scheme.

  **3. Diagnostic: Invariance to Affine Rescaling**

  A true Harsanyian sum is invariant to affine rescaling of individual utilities. If Analyst A measures utility in "hedons" and Analyst B in "utils" (where $1 \text{ hedon} = 2 \text{ utils}$), the social ranking should not change.

  **Dollar-Metric Aggregation:**
  Dollar aggregation is *not* invariant to affine rescaling of underlying utility because the conversion from utility to dollars depends on the marginal utility of income at a specific reference level.
  *   **The Mechanism:** WTP for a risk reduction is defined by $U(Y) = (1-p)U(Y) + pU(Y - WTP)$. Solving for WTP requires knowing the curvature of $U(Y)$.
  *   **The Reversal:** If two analysts assume different baseline marginal utilities of income (e.g., due to different assumptions about the consumption baseline or risk aversion parameters), they will derive different dollar values for the same utility gain. If the income distribution of beneficiaries differs between two rules, these valuation differences can reverse the net benefit ranking.
  *   **Establishment:** This establishes that the practice is committed to a specific *cardinalization* of utility: it assumes $U(\$) \equiv \$$. This is equivalent to assuming universal risk-neutrality with respect to money.
  *   **Underdetermination:** The practice never explicitly chooses this cardinalization; it inherits it by default from the choice of numeraire. It is theoretically underdetermined because the agency has not justified why money should be the cardinal measure of welfare rather than a medium of exchange with diminishing marginal welfare returns.

  **4. Ex Ante vs. Ex Post Evaluation**

  Your practice values a certain death and a statistical expectation of one death ($\sum p_i = 1$) identically.
  *   **Commitment:** This confirms a strict **Ex Ante Expected Utility** commitment. The social welfare function evaluates the prospect *before* uncertainty resolves: $W = \sum E[U_i]$. It is indifferent to the variance of the risk distribution, provided the expectation is constant.
  *   **The Objection:** The best-known objection is **Ex Post Prioritarianism** or concern for **Ex Post Equity**. An ex post view evaluates welfare based on the actual outcome distribution. A world where one specific person dies for sure is often judged worse than a world where risk is dispersed, even if expected deaths are equal, because the ex post inequality (one person bears the full burden) is greater in the concentrated case.
  *   **Registering the Objection:** To register this, the scoring rule would need to include a penalty term for the variance of risk exposure or for the ex post inequality of outcomes. The current net benefit formula ($\sum p_i \cdot VSL$) cannot capture this.
  *   **Identifiable Lives:** You note the refusal to score a named worker differently than a statistical one. Theoretically, this is **consistent** with the Ex Ante EU framework. The "Identifiable Victim Effect" is a psychological bias, not a welfare theoretic distinction, *unless* one adopts an Ex Post view where the certainty of harm to a known individual carries greater moral weight than probabilistic harm. Your practice is internally consistent; the inconsistency lies between your practice and the moral intuitions that often drive Ex Post critiques.

  **5. Non-Constant Marginal WTP for Risk**

  If WTP per unit of risk reduction varies with the size of the risk reduction (e.g., WTP is higher per unit for large risks than small risks), the linearity assumption fails.
  *   **Broken Premise:** This violates the **Independence Axiom** of Expected Utility theory for the individual. In VNM theory, the value of a probability change $\Delta p$ should be linear (or at least consistent) such that $V(p) = p \cdot V(1)$. Non-linearity implies the individual is not maximizing Expected Utility, or the risk is too large for the "small risk" approximation used to derive VSL.
  *   **Aggregation Consequence:** If individuals are not maximizing EU, Harsanyi's theorem does not apply. You would no longer be aggregating expected utilities. You would be aggregating non-linear value functions.
  *   **Guidance:** The aggregation result offers no guidance here. If the micro-foundations (individual rationality) break, the macro-aggregation (social welfare sum) loses its normative justification as a welfare measure. It becomes a purely technocratic sum of monetary equivalents without a welfare interpretation. The agency would need to decide whether to enforce the VNM axioms (by restricting analysis to small risks) or abandon the welfare claim entirely.

  **6. Prescriptive Implications: What Would Have to Change?**

  If the agency took Harsanyi's result seriously as a constraint on practice, changes would fall into three categories:

  **A. Forced by the Aggregation Result (Technical Coherence):**
  *   **Consistency Check:** We would need to verify that the WTP measures used satisfy VNM axioms (e.g., linearity in probabilities). Currently, we assume this; Harsanyi requires it.
  *   **Pareto Compliance:** We would need to ensure no rule is adopted that makes everyone worse off (trivially satisfied by net benefits) but also acknowledge that positive net benefits do not guarantee a Pareto improvement without compensation.

  **B. Forced by Adding an Equal-Weight/Impartial Premise (Ethical Coherence):**
  *   **Equity Weighting:** To move from "Sum of Dollars" to "Sum of Utilities," we must convert dollars to utils. This requires applying equity weights inversely proportional to the marginal utility of income. Rich beneficiaries would count for less per dollar than poor beneficiaries.
  *   **VSL Adjustment:** The Value of a Statistical Life would need to be standardized across income groups if we believe the *utility* of life preservation is equal, rather than scaling it with income (which assumes the *value* of life is income-elastic).

  **C. Forced by Rejecting Ex Ante for Ex Post (Structural Change):**
  *   **Risk Distribution Metrics:** We would need to track not just expected deaths, but the distribution of risk. A rule concentrating risk would receive a lower score than one dispersing it, even with identical expected mortality.
  *   **Outcome-Based Scoring:** We might need to evaluate rules based on simulated outcome distributions rather than expected values.

  **Underdetermination Flag:**
  It is crucial to state in the methods note that the current spreadsheet scores are **underdetermined** with respect to social welfare theory.
  1.  **Utilitarianism:** Fits the linear form, but contradicts the "no equity weights" instruction (unless money = utility).
  2.  **Kaldor-Hicks Efficiency:** Fits the "no equity weights" instruction, but lacks the normative force of a Social Welfare Function (it is a test of potential efficiency, not actual welfare improvement).
  3.  **Weighted Prioritarianism:** Could generate similar rankings locally if weights happen to align with income distribution, but is theoretically distinct.

  **Conclusion for the Note:**
  The practice is not "hidden Utilitarianism." It is a **Kaldor-Hicks efficiency test** that utilizes the mathematical *form* of Utilitarian aggregation (linear summation) while explicitly rejecting the *ethical weights* (equity weighting) required to make that form represent impartial welfare. The theoretical gap lies in the numeraire: we sum dollars as if they were utils. To close this gap, we must either defend dollars as the true measure of welfare (risk-neutrality assumption) or introduce equity weights to convert dollars to utils. Currently, the practice rests on an unargued assumption that the distribution of willingness-to-pay capacity is the correct metric for social value.
