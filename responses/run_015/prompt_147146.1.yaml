  3.  **Translate to ML Vocabulary (The "Restatement"):**
      *   *Team View:* Archive Memory = Training Data in Cold Storage + Retrieval-Augmented Generation (RAG). If we can retrieve it, we "remember."
      *   *Margalit View:* Imprint Memory = Weights/Generalization. The data subject must bend the decision boundary. If the model behaves the same without them, they aren't remembered ethically, even if retrievable.
      *   *Rieff/Friend View:* Over-archiving (Cold Storage of everything) creates a "Museum Model." If everything is retrievable, nothing shapes the weights preferentially. It's a form of "Machine Unlearning" via dilution. If the weights don't change, the dead don't command the living (model).
      *   *Memorization Flip:*
          *   ML: Memorization = Overfitting/Privacy Leak (Bad).
          *   Ethics: Memorization = Fidelity to the specific victim (Good).
