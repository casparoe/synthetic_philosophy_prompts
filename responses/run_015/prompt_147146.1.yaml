      *   *Correction:* Ensure the "Memorization Flip" is clear. In ML, we fight memorization (DP, regularization). In Ethics, memorization (fidelity) is the goal for victims. This is a crucial tension.
      *   *Correction:* The "Residue" needs to be sharp. Don't hedge.
      *   *Correction:* The policy sentence must be actionable enough for a policy doc but deep enough to capture the philosophy.

  10. **Final Polish:** Check the "Imprint vs Archive" definition again.
      *   Imprint: Test-time behavior changes if data is removed (Influence Function > 0).
      *   Archive: Data exists in DB, retrieved via RAG, but weights are unchanged if DB is queried vs not queried (or if DB is deleted, weights stay same).
      *   Wait, if RAG is used, deleting the DB *does* change output. But the *weights* don't change. The user defined Imprint as "bends what the system does off-distribution." This implies generalization, not just retrieval. I need to stick to the user's definition: Imprint = Weights/Generalization. Archive = Retrieval/Cold Storage.
      *   Rieff's point: If you put everything in Archive, you stop updating Weights based on moral selection. You neutralize the "command" of the past.

