      *   I need to admit where my translation might fail. Probably on the "Duty to the Dead." ML can't really owe anything to dead entities in a mathematical sense. That's the biggest stretch.

  8.  **Review against Constraints:**
      *   *Vocab:* Training set, weights, memorization, generalization, catastrophic forgetting, replay buffers, synthetic rehearsal, machine unlearning, differential privacy, distillation, embedding drift, retrieval-time grounding. (Check).
      *   *User Distinctions:* Imprint vs. Archive, Memorization flip. (Check).
      *   *Residue Report:* Clean, Distorted, No Expression. (Check).
      *   *Commitment:* No survey. One sentence policy. One paragraph why. Note on error. (Check).
      *   *Tone:* Professional, engineering-focused but philosophically honest.

