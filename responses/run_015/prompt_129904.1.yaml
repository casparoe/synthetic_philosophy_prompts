      *   *Section 1: Conservation in Hybrid Zones.* Focus on the shift from "purity" to "process," the legal/administrative friction, and the revaluation of hybrids.
      *   *Section 2: Ethical Reasoning & Moral Considerability.* Discuss the shift from species-centric ethics to process/individual/variation-centric ethics. Address the "unit of concern."
      *   *Section 3: Undermining Species-Based Priorities.* Direct answer: Yes, it undermines the *ontological* appeal but necessitates a *pragmatic* defense. Discuss the risk of paralysis vs. the opportunity for more robust conservation.
