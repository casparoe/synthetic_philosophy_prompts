      *   **Tone:** Honest, rigorous, pedagogical, respectful of the philosophy and the audience's intelligence.

  2.  **Deconstruct the Philosophy (for the purpose of the plan):**

      *   *Family Resemblance* (§66-67) is often taught in isolation. But it relies on the breakdown of the Augustinian picture of language (naming objects).
      *   *Language Games* (§7, §23) provide the context. Words are tools in activities.
      *   *Meaning as Use* (§43) is the engine. If meaning isn't reference, what is it? It's how the word is wielded.
      *   *Criteria vs. Symptoms* is a later distinction (Zettel/Investigations later parts), often too technical, but relevant for "correct vs. incorrect use."
      *   *The Goal:* To show that concepts don't need essences to function, and that looking for essences causes philosophical (and perhaps artistic) confusion.

  3.  **Drafting Section 1: Order of Components:**

      *   *Problem:* If you start with Family Resemblance, it looks like "things are kinda similar." If you start with Meaning as Use, it sounds like "anything goes."
      *   *Solution:* Start with *Language Games*. Why? Because it establishes that language is an *activity*, not a picture. This undermines the demand for a definition.
      *   *Next:* *Meaning as Use*. This follows from Games. If language is a tool in an activity, meaning is how the tool is used.
      *   *Then:* *Family Resemblance*. Now that we've stopped looking for referents/essences, we can look at how the concept actually spreads across cases.
      *   *Criteria/Symptoms:* Keep this minimal. It's useful for the "correct/incorrect" constraint but might be too technical. Let's include it as the mechanism for "rule-following" without "essence."
      *   *Justification:* You can't understand why there's no essence (Resemblance) until you understand why we shouldn't expect one (Games/Use).

  4.  **Drafting Section 2: The Carrying Example:**

      *   *Constraint:* No "Games" (board/card/ball).
      *   *Requirement:* 3-4 applications sharing no single feature. Clear correct/incorrect uses. No available definition.
      *   *Idea 1:* "Art." (Too cliché, too close to their job).
      *   *Idea 2:* "Ritual." (Good, but maybe too anthropological).
      *   *Idea 3:* "Apology." (Very Wittgensteinian, practical).
      *   *Idea 4:* "A Meal." (Breakfast, Lunch, Dinner, Feast, Snack).
      *   *Selection:* **"A Promise."**
      *   *Why:* Novelists deal with promises constantly (characters, plot contracts). It has clear rules (you can break a promise, but it's still a promise; you can't "promise" something impossible in certain contexts). It varies wildly (wedding vow vs. "I promise I'll call" vs. legal contract vs. silent nod).
      *   *Cost of Trade Example ("The Novel"):* If you use "The Novel" as the example, they will immediately try to define their own work. It becomes therapeutic/self-help rather than philosophical. It triggers defensiveness. Keep the example adjacent to their trade, not *in* it.

  5.  **Drafting Section 3: Misconceptions:**

      *   *Expected:* Disjunctive definition, Vagueness, No fact of the matter, Author decides meaning, Rules = Chess.
      *   *Novelist-specific:* "Inner Life." If meaning is public use, does character interiority vanish? (Solipsism/Behaviorism worry).
      *   *Timing:*
          *   "Author decides meaning": Pre-empt early with "Use" (social practice).
          *   "Chess Rules": Pre-empt when introducing Language Games.
          *   "Inner Life": Correct when it arises (likely late).
          *   "Vagueness/No Essence": Pre-empt with the "Refusal of Demand" stance (see Section 4).

  6.  **Drafting Section 4: The Explicit Choice:**

      *   *Option A:* Positive claim (Concepts *are* fuzzy).
      *   *Option B:* Refusal (The demand for a boundary is the error).
      *   *Decision:* **Option B (Refusal).** This is more faithful to Wittgenstein's therapeutic aim. It stops them from trying to find a *new* theory of concepts and instead dissolves the anxiety about definitions.
      *   *Impact on Closing:* The exercise isn't "decide if this is a novel." It's "notice why you feel compelled to decide, and what happens if you don't."

  7.  **Drafting Section 5: Scope & Private Language:**

      *   *Refuse:* Metaphysical implications, truth conditions, detailed exegesis of later sections.
      *   *Private Language:* If raised, acknowledge it but bracket it. "That argument secures the public nature of the game, but for today we are looking at the grammar of our concepts, not the metaphysics of mind." Don't let it hijack the 3 hours.

  8.  **Drafting Section 6: The Check/Exercise:**

      *   *Task:* Borderline case (e.g., *Autobiography of Red* or *Lincoln in the Bardo*).
      *   *Success:* They describe the *consequences* of calling it a novel vs. not. They discuss the *use* of the label.
      *   *Failure:* They try to vote on the "true" definition. They say "it doesn't matter." (It *does* matter, just not for the reasons they think).

  9.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? Keep it sharp. The user is a novelist; use precise language.
