answer: |-
  Here is a plan for the seminar. It is designed to respect the intelligence of the room while managing the specific friction points of teaching Wittgenstein to practitioners who want "takeaways."

  ### 1. The Order of Components

  Do not begin with Family Resemblance. If you start there, you confirm their suspicion that it is merely a observation about fuzzy categories. You must dismantle the *expectation* of a sharp category before you show them the alternative.

  **The Sequence:**
  1.  **Language Games (The Context):** Begin here. You must establish that language is an activity, not a nomenclature. If they think words are labels for things, Family Resemblance looks like a failure of labeling. If they see words as moves in an activity, the lack of a fixed label becomes intelligible.
  2.  **Meaning as Use (The Mechanism):** Once language is an activity, meaning is the move's function. This must come before Family Resemblance to prevent the idea that resemblance is about *visual* or *structural* similarity. It is about functional overlap.
  3.  **Family Resemblance (The Structure):** Now you can introduce this. It is no longer a claim about "things being similar," but a description of how a concept sustains itself across different games without a central core.
  4.  **Criteria vs. Symptoms (The Boundary):** Introduce this last, briefly. It is necessary to distinguish "no essence" from "anything goes." Criteria are the public grounds for the application of a concept; symptoms are correlated evidence. This stops the slide into permissiveness.

  **Justification:**
  *   **Games before Resemblance:** Without the "Game," the audience will ask, "Resemblance in respect of what?" The answer is "in respect of how we use them," which requires "Meaning as Use."
  *   **Use before Resemblance:** If you say "Meaning is Use" too early, without the "Game" context, they will hear "Meaning is whatever I intend." The "Game" establishes the public, rule-governed (though not rigid) nature of the use.
  *   **Criteria last:** You cannot explain why some uses are *wrong* (essential for avoiding the "anything goes" error) until they understand that rules exist without essences. Criteria provide the rule without the essence.

  ### 2. The Carrying Example

  **The Example:** **"A Promise."**

  **Why this example:**
  *   **No Single Feature:** Some promises are written, some spoken, some silent nods. Some use the word "promise," some do not ("I'll be there"). Some are binding (legal), some moral, some trivial. There is no physical or linguistic thread running through all of them.
  *   **Correct/Incorrect Use:** You can fail to make a promise (ambiguity). You can break a promise (it remains a promise, but a broken one). You can attempt a promise in a context where promising is impossible (e.g., promising to change the past). This satisfies the need for rules without essence.
  *   **No Definition:** If asked to define "promise," they will list features (commitment, future action, communication). You can easily produce counter-examples for each within the room.

  **The Cost of Using a Trade Example ("The Novel"):**
  Do not use "The Novel" as the carrying example for the philosophical heavy lifting.
  *   **Defensiveness:** If you analyze "The Novel," every participant will immediately map the analysis onto their own manuscript. They will stop listening to the philosophy and start auditing their genre classification.
  *   **Stakes:** The stakes become personal too quickly. If you argue "The Novel has no essence," a writer whose work is borderline may hear "Your book doesn't count."
  *   **Strategy:** Use "A Promise" to teach the philosophy. It is intimate enough to resonate (writers deal in character promises) but distant enough to remain an object of study. Save "The Novel" for the final check (Section 6).

  ### 3. Misconceptions and Interventions

  **1. Family Resemblance as Disjunctive Definition**
  *   *The Error:* "So, a promise is *either* written *or* spoken *or* implied..."
  *   *Timing:* Pre-empt during the **Family Resemblance** section.
  *   *The Move:* Show a network diagram, not a list. Emphasize that the overlaps are crisscrossing, not branching from a single trunk. Say: "We are not looking for a list of sufficient conditions. We are looking at a history of uses."

  **2. Collapsed into Mere Vagueness**
  *   *The Error:* "So the concept is just fuzzy."
  *   *Timing:* Correct immediately when it arises (likely during Q&A).
  *   *The Move:* Distinguish *blurriness* from *lack of essence*. A photograph can be sharp but still not capture the "essence" of a face. The concept works perfectly well; the *philosophical demand* for a boundary is what is vague, not the concept itself.

  **3. No Fact of the Matter (Nihilism)**
  *   *The Error:* "If there's no essence, then whether this is a promise is just an opinion."
  *   *Timing:* Pre-empt during **Criteria vs. Symptoms**.
  *   *The Move:* Reiterate that there are right and wrong moves in a game. You can be checkmated. You can break a promise. The lack of an essence does not remove the norms of the practice.

  **4. Meaning as Use = Authorial Intent**
  *   *The Error:* "If meaning is use, then I decide what my words mean by how I use them."
  *   *Timing:* Pre-empt during **Meaning as Use**.
  *   *The Move:* Emphasize that "Use" is *public* and *customary*. You cannot play chess alone and decide the knight moves diagonally. Meaning is determined by the community of speakers, not the individual speaker.

  **5. Language Games = Constitutive Rules (Chess)**
  *   *The Error:* "So there are strict rules we just don't know yet."
  *   *Timing:* Pre-empt during **Language Games**.
  *   *The Move:* Contrast "strict rules" (chess) with "rules of thumb" or "signposts" (walking down a street). Language games often involve improvisation. The rule is found in the practice, not prior to it.

  **6. The Inner Life (Novelist Specific)**
  *   *The Error:* "If meaning is public use, then a character's inner thought is meaningless until expressed. You are reducing character to behaviour."
  *   *Timing:* Correct when raised (it will come up).
  *   *The Move:* Acknowledge the anxiety. Clarify that Wittgenstein does not deny inner experience; he denies that inner experience can *ground* meaning privately. A character's thought is intelligible to us only because we share the public language that gives it shape. This does not make the thought less real; it makes it shareable.

  ### 4. The Explicit Choice

  **The Commitment:** You must teach Family Resemblance as a **Refusal of the Demand for a Boundary**, not as a positive claim about the concept's extension.

  **Why:**
  If you teach it as a positive claim ("Concepts *are* fuzzy"), the audience will treat "fuzziness" as a new kind of essence. They will try to measure the fuzz. They will ask, "How fuzzy is too fuzzy?"
  If you teach it as a refusal ("Why do you need a boundary?"), you shift the burden. The philosophical problem dissolves because the question was malformed.

  **Impact on Closing Exercise:**
  This dictates that the final exercise (Section 6) is not about *deciding* if the borderline case is a novel. It is about examining *why* we feel the need to decide, and what work the label "novel" is doing in that specific context. The goal is to relieve the anxiety of classification, not to solve the classification.

  ### 5. Scope and The Private Language Argument

  **What to Refuse:**
  *   **Truth Conditions:** Do not discuss whether statements are true or false. Discuss whether they are *moveable* or *intelligible*.
  *   **Metaphysics:** Do not discuss what exists. Discuss how we speak about what exists.
  *   **Historical Exegesis:** Do not discuss the *Tractatus* or the shift in his thinking unless it clarifies a specific confusion in the room.

  **Handling the Private Language Argument (PLA):**
  It will be raised. A novelist will ask, "But I write in private. My diary is a language only I understand."
  *   **The Response:** Do not attempt to teach the PLA. It requires too much scaffolding.
  *   **The Move:** Say: "That argument is designed to show that even your private diary relies on public rules of grammar to be intelligible to you tomorrow. But for this seminar, we are bracketing the metaphysics of mind. We are looking at the grammar of our concepts. Whether the mind is private or not, the *word* 'mind' is public. Let's stick to the word."
  *   **Why:** This acknowledges their point without derailing the three hours into a debate on solipsism.

  ### 6. The Check: The Borderline Case

  **The Exercise:**
  Present a specific book: *Autobiography of Red* (Anne Carson) or *Lincoln in the Bardo* (George Saunders). Ask: "Is this a novel?"

  **Success Criteria:**
  *   **Success:** Participants discuss the *consequences* of the label. "If we call it a novel, we expect X. If we call it a poem, we expect Y." They recognize that the classification serves a purpose (marketing, shelving, expectation setting) rather than identifying a metaphysical truth. They are comfortable leaving the question unsettled if the context doesn't demand a decision.
  *   **Failure (Type 1 - Essentialism):** The room votes. They compile a list of features to determine the "true" answer. This means they missed the "Refusal of Demand" point.
  *   **Failure (Type 2 - Nihilism):** They say, "It doesn't matter, labels are meaningless." This means they slid into the "No Fact of the Matter" error. The label *does* matter, just not for the reasons they thought.

  **What Failure Tells You:**
  *   If they vote: You taught Family Resemblance as a new definition. Go back to "Refusal."
  *   If they dismiss the label: You taught "Meaning as Use" as "Meaning is Irrelevant." Go back to "Criteria."

  ### Summary of the Three Hours

  *   **Hour 1: The Game.** Establish language as activity. Use "A Promise" to show rules without rigidity. Pre-empt the "Chess Rules" and "Authorial Intent" errors.
  *   **Hour 2: The Resemblance.** Show the crisscrossing network of promises. Pre-empt "Disjunctive Definition" and "Vagueness." Introduce Criteria to secure correctness.
  *   **Hour 3: The Application.** Address the "Inner Life" concern. Move to the Borderline Case (The Novel). Enforce the "Refusal of Demand" stance. Conclude by handing the "What has this to do with writing?" question back to the room, now equipped to answer it without looking for essences.
