      *Why Insult?* It's dramatic (novelists like drama). It depends entirely on context/use (Meaning as Use). It has no physical essence (words don't matter, intent/reception matters). It has clear correct/incorrect uses (you can fail to insult). It avoids the "Novel" trap until the end.
