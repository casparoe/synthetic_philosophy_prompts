      *   *Concessions:* Powers theorists admit we use counterfactuals *epistemically*. They admit some dispositions are "compounded."

  9.  **Refining the "Two Cases":**
      *   Bomb: Intrinsic fink. Shows disposition is distinct from conditional. Supports powers.
      *   Oxide: Self-masking/change of basis. Shows dispositions are mutable. Supports powers (dynamic ontology).
      *   *Verdict:* They help. They show the richness of the ontology.

  10. **Refining "Collapse" & "Unfalsifiability":**
      *   Collapse: Strongest *pragmatic* objection, not logical.
