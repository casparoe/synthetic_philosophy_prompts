answer: |-
  # The Induction Inventory: A Self-Administered Quiz

  **Instructions:** Read each scenario carefully. Choose the option that best matches your immediate, gut-level reaction to the situation. Do not choose the answer you think a philosopher *should* give; choose the one you would actually act on. Record your choices (A, B, or C) to find your profile at the end.

  ***

  ### 1. The Wager
  You are observing a machine that dispenses balls. It has dispensed 1,000 red balls in a row, without exception. I offer you a bet: You pay me $100 now. If the 1,001st ball is red, I pay you $200. If it is any other color, you get nothing. The machine is sealed; you cannot see the mechanism.

  *   **A.** I take the bet. After 1,000 reds, it would be absurd for the next one not to be red.
  *   **B.** I refuse the bet. The past sequence gives me no logical reason to expect the next one to be red.
  *   **C.** I don't take the bet, but not because I'm skeptical. I just think the odds are impossible to calculate from this data alone.

  ### 2. The Emerald Deadline
  We have examined 5,000 emeralds. Every single one has been green. Define a new word: an object is **"grue"** if it is green before January 1, 2050, and blue after January 1, 2050. All 5,000 emeralds examined so far are grue (because they are green and it is currently before 2050).

  *   **A.** I expect the next emerald to be green. The "grue" definition is a trick of language.
  *   **B.** I expect the next emerald to be green, but I admit I have no non-circular reason to prefer "green" over "grue."
  *   **C.** I cannot say what color the next emerald will be. The evidence supports "green" and "grue" equally.

  ### 3. The Lottery Pump
  A water pump has functioned perfectly every day for ten years. We define a pump as **"secure"** if it functions perfectly on every day *prior* to the next national lottery draw. The lottery draw is tomorrow. The pump has been "secure" for ten years by this definition.

  *   **A.** I expect the pump to work tomorrow. Its history of being "secure" supports that expectation.
  *   **B.** I expect the pump to work tomorrow, but the word "secure" has nothing to do with it. The pump's mechanics matter, not the lottery.
  *   **C.** I have no expectation. Linking the pump's reliability to a lottery draw makes the history irrelevant.

  ### 4. The Synthetic Compound
  Chemists synthesize a new element, *Novum-29*. They create 50 atoms. All 50 are stable and do not decay. There is no prior history of this word or this element in human language or nature.

  *   **A.** I expect the 51st atom to be stable. Stability is a property I expect nature to maintain.
  *   **B.** I expect the 51st atom to be stable, because 50 successes is a strong track record, even for something new.
  *   **C.** I have no basis to expect the 51st atom to be stable. Without a history of the *concept*, past atoms teach me nothing about future ones.

  ### 5. The Jade Mistake
  For centuries, miners and scientists called a certain hard green stone "jade." They assumed all jade shared the same internal structure. In the 19th century, it was discovered that "jade" was actually two completely different minerals (jadeite and nephrite) that looked the same.

  *   **A.** The scientists who extrapolated were unreasonable. They should have known a name doesn't guarantee a single underlying nature.
  *   **B.** The scientists were reasonable. They made a mistake of luck, not method. They couldn't have known the category was split.
  *   **C.** The scientists were wrong to trust the name. The error lies in assuming our words carve nature at its joints.

  ### 6. The Curve Fit
  You plot data points on a graph showing the temperature of a liquid over time. The points form a perfect straight line. However, you can draw an infinite number of curved lines that also pass through every single point.

  *   **A.** I predict the next point will fall on the straight line. It is the simplest fit.
  *   **B.** I predict the next point will fall on the straight line, because physics usually behaves linearly in these cases.
  *   **C.** I make no prediction. The data alone does not tell me which line to follow; the evidence underdetermines the answer.

  ### 7. The Two Observers
  Two scientists watch the same 100 trials of an experiment. Scientist X believes the outcome is 90% likely to repeat. Scientist Y believes the outcome is only 10% likely to repeat. Both have seen the exact same data.

  *   **A.** One of them is being irrational. The data forces a specific degree of confidence.
  *   **B.** Both can be rational. As long as their beliefs are consistent, their starting expectations are a matter of personal judgment.
  *   **C.** One of them is right, but I can't tell which without knowing more about the mechanism.

  ### 8. The Survival Test
  A theory has survived fifty rigorous attempts to prove it false. It has passed every test.

  *   **A.** The theory is probably true. Passing tests adds weight to its correctness.
  *   **B.** The theory is not necessarily true. It has simply not been killed yet.
  *   **C.** The theory is useful. Whether it is "true" doesn't matter as long as it keeps surviving tests.

  ### 9. The Pragmatic Wager
  Suppose I told you that no method of predicting the future can be proven to work. However, if *any* method could work, the method of copying past patterns would be it.

  *   **A.** That's comforting, but without proof it works, I won't rely on it.
  *   **B.** That's enough for me. If any method will work, this is the one to use. I'm in.
  *   **C.** That's a logical trick. It doesn't tell me if I'll actually get what I want.

  ***

  ## Scoring Key & Results

  Tally your answers. You likely have a mix, but look for the **dominant pattern** below that matches your choices. Your philosophical "leaf" is defined by how you handle the tension between past data and future expectations.

  ### 1. The Humean Skeptic
  *   **Pattern:** You frequently chose **B** or **C** in Questions 1, 2, 4, and 6. You consistently feel that the leap from "has happened" to "will happen" is logically unjustified.
  *   **Your Label:** **The Humean Skeptic**
  *   **Your Awkward Commitment:** You must admit that expecting the sun to rise tomorrow is no more rational than expecting it to turn into a giant pumpkin.

  ### 2. The Falsificationist (Popperian)
  *   **Pattern:** You chose **B** in Question 8 and generally rejected the idea that success "confirms" a theory (Question 1, Option B/C). You believe science progresses by eliminating errors, not by accumulating proofs.
  *   **Your Label:** **The Falsificationist**
  *   **Your Awkward Commitment:** You must accept that science can never tell you what *is* true, only what has not yet been proven false.

  ### 3. The Subjective Bayesian
  *   **Pattern:** You chose **B** in Question 7 and **C** in Question 1 or 6. You believe rationality is about internal consistency, not about matching the world. Different starting points are allowed.
  *   **Your Label:** **The Subjective Bayesian**
  *   **Your Awkward Commitment:** You must concede that a person who believes the moon is made of cheese is rational, provided they update that belief consistently when presented with new data.

  ### 4. The Conventionalist (Goodmanian)
  *   **Pattern:** You chose **B** in Question 2 and **B** or **C** in Question 5. You think we project "green" instead of "grue" because of how we speak, not because of how nature is.
  *   **Your Label:** **The Conventionalist**
  *   **Your Awkward Commitment:** You must admit that if our ancestors had used the word "grue" for centuries, it would be "green" that looks like the weird, unnatural prediction today.

  ### 5. The Natural-Kind Realist
  *   **Pattern:** You chose **A** in Questions 2, 4, and 5. You believe some categories (like "emerald" or "stable atom") track real structures in the universe that license induction.
  *   **Your Label:** **The Natural-Kind Realist**
  *   **Your Awkward Commitment:** You must claim that nature itself prefers certain descriptions over others, independent of human language or observation.

  ### 6. The Pragmatist (Reichenbachian)
  *   **Pattern:** You chose **B** in Question 9 and **A** in Question 1. You don't claim induction is "true," but you argue it is the best tool available if survival is the goal.
  *   **Your Label:** **The Pragmatist**
  *   **Your Awkward Commitment:** You are making a blind gamble that only pays off if gambling itself pays off; you cannot prove the method works, only that it is our only shot.

  ***

  ## Limitations Note: Where the Quiz Blurs

  No quiz of this length can perfectly separate every philosophical position. Be wary of your result if you fall into the following overlaps:

  *   **The Bayesian vs. The Conventionalist:** This quiz cannot reliably separate these two. Both the Subjective Bayesian and the Goodmanian Conventionalist deny that the *world* forces a specific prediction on us. The Bayesian attributes the choice to personal prior belief; the Conventionalist attributes it to linguistic habit. Since both result in refusing to say one prediction is objectively "forced" by nature (Question 2, Option B/C), your answers may look identical even if your reasons differ.
  *   **The Humean vs. The Pragmatist:** Both admit induction cannot be logically proven. The split relies entirely on Question 9. If you feel the logical gap (Hume) but still choose to act (Pragmatist), the quiz may sort you as a Skeptic because of your earlier answers, even if your final stance is action-oriented.

  **Why Question 2 splits Realists from Conventionalists:**
  Question 2 (The Emerald Deadline) is the primary divider here. A Realist believes "green" is a natural property, so they choose A. A Conventionalist believes "green" is just a habit of speech, so they choose B. A simple wager (Question 1) fails to split them because both Realists and Conventionalists will usually take the bet; they just disagree on *why* it is safe.

  **Why Question 7 splits Bayesians from Realists:**
  Question 7 (The Two Observers) isolates the Bayesian. A Realist or Falsificationist typically believes the data constrains rational belief (Option A or C). Only the Bayesian comfortably accepts that two rational people can hold opposite degrees of belief on the same data (Option B).

  ***

  ## Guidance for the "Mixed Bag" Reader

  Did you find yourself choosing **A** (Realist) on the Wager (Question 1) but **B** or **C** (Skeptic/Conventionalist) on the Grue case (Question 2)?

  **You are not broken; you are likely a Working Scientist.**
  Most people operate as **Contextualists**. You presuppose uniformity when the stakes are low and the categories are familiar (balls, pumps), but you deny uniformity when the categories look artificial (grue, lottery-pumps).

  **What to make of this:**
  This suggests you do not hold a universal theory of induction. Instead, you treat induction as a tool that is valid only when the predicates involved are "entrenched" or "natural." You are effectively a Goodmanian in the philosophy seminar, but a Realist in the laboratory. This is a stable position: you trust induction where language and nature have a long history of cooperation, and you suspend it where they do not. Do not force yourself into a single leaf; your inconsistency is a feature of a functioning cognitive system, not a bug.
