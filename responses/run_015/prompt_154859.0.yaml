prompt: |-
  I am a journalist covering science and ideas, and I am preparing a long-form feature on how the AI research community implicitly defines "understanding." I would like you to respond as a professional philosopher of mind and an expert on the philosophy of artificial intelligence and semantic theory. Before you begin, please take a few moments to brainstorm the key philosophical positions at stake—functionalism, behaviorism, biological naturalism, semantic externalism, and the syntax-semantics distinction associated with John Searle's Chinese Room argument. Then proceed with a careful, step-by-step analysis.

  Here is the institutional practice I want you to examine. In contemporary AI laboratories and technology firms, the standard method for determining whether a system possesses language understanding, reasoning ability, or general intelligence is almost entirely behavioral and benchmark-driven: researchers measure accuracy on standardized reasoning tests, evaluate fluency and coherence of outputs, compare performance to human baselines, and, in recent years, treat intermediate "chain-of-thought" verbal traces as transparent windows into the system's cognitive processing. At no point does the evaluation protocol require evidence of internal representational states with original intentionality, causal-historical connections to the referents being discussed, or biological substrate. Functional performance is treated as sufficient, and sometimes necessary, for attributing understanding.

  What philosophical commitments about mind, meaning, and evidence does this evaluation practice presuppose? Reconstruct the implicit theory with precision: does the practice strictly require a functionalist or behaviorist ontology of mental states, or is it philosophically underdetermined and compatible with rival views? How does it relate to Searle's Chinese Room argument, which holds that syntactic manipulation of formal symbols is not sufficient for semantic understanding? Is the practice internally consistent, or does it contain a tension—for instance, between treating chain-of-thought outputs as meaningful reasoning traces and treating all outputs as syntactic strings lacking intrinsic intentional content? Identify which rival philosophical positions the practice quietly rules out, and distinguish what it strictly presupposes from what merely fits well with it. Finally, tell me what concrete changes would have to occur in benchmarking protocols, regulatory audits, or professional norms if one took seriously the claim that syntax is not sufficient for semantics, and note where the practice could remain intact even under that view.
