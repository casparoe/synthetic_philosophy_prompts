answer: |-
  The implicit theory of mechanism identity presupposed by Statistical Process Control (SPC) is **Operationalized Dispositionalism**.

  It does not commit you to a structural view (parts and organization) nor a purely functional view (goal attainment). Instead, it identifies a mechanism strictly by its **stable propensity to generate a specific probability distribution**.

  Here is where that theory is doing the work in your three specific trouble spots.

  ### 1. The View of Identity: The Mechanism *is* the Distribution
  In the New Mechanism literature (Machamer, Darden, Craver), a mechanism is typically individuated by its entities and activities organized to produce a phenomenon. SPC inverts this. It treats the **phenomenon (the output stream)** as the primary ontological anchor, and the "mechanism" is merely the label we apply to the generator of that stream *as long as the stream remains stationary*.

  *   **The Commitment:** Identity is **extensional** rather than **intensional**. Two physically distinct machines (or the same machine at different times) are the "same mechanism" if and only if they belong to the same statistical population.
  *   **Where it works:** This allows for **equifinality**. It doesn't matter if wear on a bearing or a shift in ambient temperature caused the variance; if the variance stays within the limits, the mechanism is considered identical. The "black box" is not an epistemic limitation here; it is an ontological choice. The internal causal structure is deemed irrelevant to identity unless it manifests statistically.
  *   **The Conflict:** This clashes with the engineer's structural realism. If you swap a motor for an identical model, the engineer says "same mechanism." If the new motor has slightly different tolerances that shift the mean by 0.5 sigma, SPC says "special cause" (potentially different mechanism). SPC prioritizes **causal invariance of output** over **continuity of constitution**.

  ### 2. The Circularity: Pragmatic Convention vs. Explanatory Failure
  You identified the loop: limits are drawn from history to detect changes in the thing that produced the history. Is this vicious circularity?

  *   **The Verdict:** It is a **pragmatic convention for prediction**, but an **explanatory failure for ontology**.
  *   **Where it does the work:** Shewhart (the father of SPC) was aware of this. The goal of SPC is not to tell you *what* the mechanism is, but to tell you *when to intervene*. The circularity is the feature, not the bug. It defines a "state of control" as a state where past behavior is a reliable guide to future behavior.
  *   **The Real Problem:** The circularity breaks down when **structural drift** occurs without **statistical signal**. If a component degrades slowly, keeping output within 3-sigma until catastrophic failure, SPC maintains the mechanism is "the same" throughout. Here, the operational definition masks the ontological reality. The "mechanism" is slowly dying, but the statistical identity remains intact until the cliff edge.
  *   **Philosophical Cost:** You lose the ability to distinguish between a **robust mechanism** (structural stability ensures output stability) and a **fragile mechanism** (output stability is maintained despite structural instability). SPC treats them as identical.

  ### 3. The Software Case: The Collapse of Common/Special Cause
  In software, the "entities" are logical (code, states) and "activities" are computations. A firmware update is a deliberate structural change.

  *   **The Breakdown:** In physical manufacturing, "special cause" implies an *intrusion* or *fault* (something external or broken). In software, a structural change is often *intentional*.
  *   **The Survival of the Distinction:** The common-cause/special-cause split **does not survive** in its original form unless re-mapped from **ontology to governance**.
      *   **Physical SPC:** Common = Inherent to the machine. Special = External to the machine.
      *   **Software SPC:** Common = Inherent to the *current version*. Special = Deviation from the *current version*.
  *   **The Implication:** If you push a firmware update and the output distribution shifts, SPC flags a "special cause." But ontologically, you *know* the mechanism changed. The statistical signal is redundant. Conversely, if you push an update and the distribution *doesn't* shift, SPC says "same mechanism" (common cause), but ontologically the mechanism *did* change (the code is different).
  *   **The Implicit Theory Exposed:** In software, SPC reveals that it was never tracking the mechanism's structure at all. It was tracking the **stability of the input-output mapping**. If the mapping holds, the mechanism is effectively the same, regardless of code refactoring. This commits you to a **functionalist view of software mechanisms**: the code is implementation detail; the input-output disposition is the mechanism.

  ### Summary of the Implicit Theory
  SPC quietly commits you to the view that a mechanism is not a collection of parts, but a **stationary stochastic process**.

  1.  **Identity:** Defined by **distributional invariance**, not structural continuity.
  2.  **Circularity:** Accepted as an **epistemic boundary** for control, but it blinds you to structural drift (the "silent killer" problem).
  3.  **Software:** Reveals that the "common/special" distinction is actually about **authorized vs. unauthorized changes to the disposition**, not internal vs. external causal forces.

  If you are writing on mechanisms, the friction point is that SPC treats the mechanism as a **node in a causal network defined solely by its edges (inputs/outputs)**, whereas the philosophy of mechanisms usually demands access to the **internal wiring** to claim identity. SPC works precisely because it ignores the wiring, but that makes it ontologically shallow.
