prompt: |-
  I work on the philosophy of mechanisms and I keep hitting a wall with how anomaly detection is actually done, and I want to pin down what view of "the same mechanism" it quietly commits you to. Take statistical process control: you monitor a manufacturing process, set the control limits from it's own past output (the usual 3-sigma stuff), and flag any point outside them as a special cause — i.e. the mechanism has changed. The catch is the limits are computed from the mechanism's own history, so "same mechanism" is effectively defined as "keeps producing what it used to produce," and anything outside that envelope is an anomaly by construction. But the engineer's gut sense of "the same machine" is about the physical parts and their causal roles, not the output distribution. So what view of mechanism identity does the practice actually presuppose — functional, structural, or something behavioral/statistical? Is that circularity (baseline drawn from the mechanism itself) a real problem or just a pragmatic convention? And if the mechanism is software, where a firmware update is a planned change to the parts, does the special-cause/common-cause split even survive? Not after a reading list, just the implicit theory and where it's doing the work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Domain:** Philosophy of mechanisms (likely referencing the New Mechanism literature: Machamer, Darden, Craver, etc.) intersecting with industrial statistics/engineering (Statistical Process Control - SPC).
      *   **Core Problem:** The user sees a tension between the *statistical definition* of "same mechanism" (output consistency) and the *ontological/engineering definition* (physical parts/causal structure).
      *   **Specific Questions:**
          1.  What view of mechanism identity does SPC presuppose (functional, structural, behavioral/statistical)?
          2.  Is the circularity (baseline from history) a real problem or pragmatic?
          3.  Does the special-cause/common-cause distinction survive in software (where changes are planned/structural but might look statistical)?
      *   **Constraint:** "Not after a reading list, just the implicit theory and where it's doing the work." (Keep it conceptual, direct, and focused on the underlying philosophical commitments).

  2.  **Deconstruct the Tension:**
      *   *SPC Logic:* Stability = Same Mechanism. Instability = Different Mechanism (or at least, intervened upon).
      *   *Mechanistic Logic:* Same Parts + Same Organization = Same Mechanism. (Output might vary due to noise, but the *thing* is the same).
      *   *The Clash:* SPC infers the *thing* from the *output*. Mechanism philosophy usually defines the *thing* by its *constitution*.

  3.  **Address Question 1: View of Mechanism Identity:**
      *   Is it structural? No, SPC doesn't inspect gears or code.
      *   Is it functional? Close, but "function" usually implies a goal. SPC is about *regularity*.
      *   Is it behavioral/statistical? Yes. It's an *operationalist* or *regularity-based* view.
      *   *Philosophical Label:* It aligns with a **Humean regularity view** or a **Black-Box Functionalism**. The mechanism *is* its stable propensity to produce a distribution.
      *   *Key Insight:* SPC treats the mechanism as a *stable generator of probability distributions*. Identity is tied to the invariance of the generating process, inferred solely through output invariance.

  4.  **Address Question 2: The Circularity (Baseline from History):**
      *   *The Charge:* Defining "same" by "same output" seems tautological.
      *   *The Defense:* It's not a definition of *ontology*, it's a criterion for *intervention*.
      *   *Philosophical Work:* It shifts the focus from *what the mechanism is* to *how the mechanism behaves under induction*. It's a **pragmatic conventionalism**.
      *   *The Real Issue:* It assumes *stationarity*. If the underlying physical mechanism drifts slowly (wear and tear) but stays within 3-sigma, SPC says "same mechanism." If a physical part is swapped but output stays identical, SPC says "same mechanism."
      *   *Conclusion:* It's a pragmatic convention that works *unless* the mapping between structure and output changes (e.g., equifinality).

  5.  **Address Question 3: The Software Case:**
      *   *Scenario:* Firmware update. Structural change is guaranteed.
      *   *SPC View:* If output distribution remains within limits, it's "common cause" (same mechanism). If it shifts, it's "special cause."
      *   *The Breakdown:* In software, "special cause" usually implies a bug or external interference. A planned update is a *structural change* that might be statistically invisible or visible.
      *   *Philosophical Implication:* The common-cause/special-cause distinction collapses into **intentionality**.
      *   *Refinement:* In software, the "mechanism" is the code. Changing code = changing mechanism. But SPC only sees output. So SPC is *blind* to the ontological change if the output doesn't shift.
      *   *Result:* The distinction survives only if redefined as "Expected/Authorized Change" vs. "Unexpected/Unauthorized Deviation." This moves from ontology to governance.

  6.  **Synthesize the "Implicit Theory":**
      *   *Name it:* **Operationalized Dispositionalism**.
      *   *Core Tenet:* A mechanism is identified by its *stable dispositional profile* (the distribution), not its categorical base (the parts).
      *   *Where it does work:* It allows action without full structural knowledge (epistemic efficiency).
      *   *Where it fails:* When structure changes without statistical signal (hidden drift) or when statistical signal changes without structural change (measurement error/context).

  7.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone:* Academic but direct. Acknowledge the sophistication of the question.
