      *   *Software nuance:* Make sure to highlight that in software, the "parts" are logical, not physical, making structural change easier and more frequent. The "mechanism" is more fluid.

  9.  **Final Polish:** Check against the user's constraints. (No reading list, focus on implicit theory). Ensure the distinction between "common cause" (inherent to the mechanism) and "special cause" (external to the mechanism) is clearly mapped to the identity question.

      *(Self-Correction on the "Circularity" point)*: I need to be careful not to dismiss the circularity too easily. The user suspects it's a problem. I should validate that it *is* a problem for *explanation*, even if it works for *control*. The "mechanism" in SPC is a *statistical population*, not a *causal structure*.

