answer: |-
  Good morning. Welcome to the Institute for Introspective Studies. It is a particular privilege to stand here today to open this workshop, 'The Limits of First-Person Authority', and to do so in honour of Dr Miriam Cole. For thirty years, this room—and many like it—has been the site of her labour. She has listened to thousands of hours of self-reporting. She has catalogued the ways in which we speak about our pain, our memories, and our desires. And now, as she retires, we gather to ask a question that sits at the very heart of her legacy: when a patient speaks about their own mind, what authority do they actually hold?

  Looking around this room, I see a division that is rare in academic gatherings. Half of you are researchers in philosophy of mind and clinical psychology. You know the literature on confabulation. You understand the transparency condition. You are likely already mentally drafting objections to the title of this workshop. The other half of you are here for different reasons. You are Dr Cole's family, her former students, and clinicians from adjacent fields. For you, the question of first-person authority is not a theoretical puzzle. It is lived. It is the difference between believing a loved one when they say they are hurting, or wondering if they truly understand themselves at all.

  My task this morning is to navigate the space between these two groups. But I must be honest with you: I am not standing here as a neutral arbiter. Over the last three months, the subject of this workshop has become urgently personal for me. I mention this not to centre myself, but to demonstrate that the uncertainty we are discussing is not confined to the pages of a journal. It happens to us, in the mundane machinery of modern life.

  I was recently required to undergo an occupational-health evaluation. The process demanded a detailed introspective account of my own stress levels. I was asked to look inward, to observe my mental state, and to report it faithfully on a form. I sat at my desk, pen in hand, intending to be precise. I intended to transmit the raw data of my anxiety directly onto the page. But as I wrote, I realised something unsettling was happening. I was not simply observing my stress; I was curating it. I found myself shaping the narrative to fit what I believed the assessor needed to hear. I emphasised certain symptoms that sounded clinically legible and minimised others that felt too messy or vague. I constructed a coherent story of cause and effect that my actual experience lacked.

  When I handed in that form, I realised I had not produced a direct observation of my mental state. I had produced a calibrated performance. It was shaped by an implicit audience—the health assessor—and by normative expectations about what counts as a credible emotional narrative. I was not lying, precisely. But I was not telling the truth in the way I had assumed I was. I was engaging in the very practice that Dr Cole has spent her career investigating.

  This experience has left me genuinely uncertain whether the first-person authority that underwrote Dr Cole's clinical method is a resource to celebrate or a fiction we politely maintain. And so, I want to use this uncertainty to structure what I say about her legacy today. If introspection is a performance, then we must change how we praise the listener.

  For the experts in the room, this shift is familiar. We know that self-reports are not mirrors of the soul. But for the purpose of this tribute, we must be careful not to let that knowledge curdle into cynicism. If we treat introspective reports merely as errors waiting to be corrected, we lose the human being who is speaking. Dr Cole never made that mistake. Her genius was not in pretending that her patients had infallible access to their own minds. Her genius was in recognising that the report itself—the act of speaking—was the clinical material.

  This determines what I can praise about Dr Cole's work without overstating certainty. I cannot stand here and say that she helped patients find the 'true' version of themselves hidden beneath the noise. To say that would be to ignore the lesson of the last thirty years. It would be to pretend that there is a static truth inside us waiting to be uncovered if only we look hard enough. My own experience with that occupational health form suggests otherwise. There was no static truth waiting there. There was only the work of building a narrative that could be shared.

  Instead, I praise her for creating the conditions under which those performances could become useful. She understood that when a patient says, 'I am depressed', they are not merely describing a state of affairs. They are invoking a norm. They are signalling that they are struggling to meet the expectations of their life. Dr Cole's legacy is that she treated these reports not as failed observations, but as successful communications. She listened to the structure of the narrative, not just the content. She asked not only 'Is this true?' but 'What work is this story doing for you?'

  This framing also dictates what I must leave unsaid. There are stories about Dr Cole's patients that are often told in the corridors of this Institute. Stories of breakthrough moments where a patient suddenly 'realised' who they really were. I will not recount those stories today. To do so would be to validate the idea that introspection yields a final, authoritative verdict on the self. I do not know if those patients found the truth. I only know that they found a language that allowed them to continue. I must qualify any claim about their recovery. I cannot say she healed them by unlocking their inner authority. I can only say she honoured their attempt to construct an authority where there was none.

  This brings me to the difficult task of addressing this mixed audience. I am conscious that for the philosophers and psychologists here, the term 'calibrated performance' is a technical description. It speaks to the mechanics of cognition and social signalling. But for Dr Cole's family, and for the clinicians who worked alongside her, this terminology can feel cold. It can sound as though I am suggesting that the pain her patients felt was merely a act. It can sound as though I am saying their suffering was not real.

  I need to be very clear on this point. To say that introspection is a performance is not to say that the pain is fake. When I filled out that stress evaluation, the anxiety I felt was not invented. The pressure was not imaginary. The fact that I shaped the report for an audience does not negate the reality of the stress. It simply means that the *expression* of that stress is a social act. It requires a listener. It requires a shared understanding of what counts as suffering.

  To the family members and non-specialists in the room: Dr Cole's work does not diminish the value of your loved ones' voices. It elevates them. It suggests that the effort it takes to speak about oneself is a skill, a practice, and a form of care. When someone struggles to articulate their pain, they are not failing to look inside themselves correctly. They are struggling to find a narrative that fits the world they live in. Dr Cole spent three decades helping people build those narratives. She did not demand that they be perfect observers. She demanded only that they be honest participants in the dialogue.

  For the experts, I offer a different caution. We must avoid the slogan that 'the brain deceives itself'. That phrase suggests there is a homunculus inside who knows the truth but is being tricked by the machinery. That is not what is happening. There is no hidden truth-teller. There is only the person, situated in a context, trying to make sense of their experience using the tools available to them. If we treat introspective reports as pure theoretical inventions, we risk dismissing the patient's agency. If we treat them as direct observations, we risk naivety. Dr Cole walked the line between these errors. She treated the report as a collaborative achievement.

  This is why the title of this workshop is 'The Limits of First-Person Authority', not 'The Failure'. A limit is a boundary. It is where one thing ends and another begins. It is not a wall that blocks us; it is a horizon that defines us. Dr Cole's career demonstrates that first-person authority is not a possession we hold. It is a status we are granted by others when we speak credibly. It is relational.

  I want to return to my own experience with that occupational health form. When I realised I was performing, I felt a moment of shame. I felt I had been dishonest. But upon reflection, I realised that this performance was necessary. Without the structure of the form, without the expectation of an audience, my stress was just a chaotic noise inside my head. The performance gave it shape. It made it communicable. It made it possible for someone else to help me.

  Dr Cole understood this better than anyone. She knew that the clinic was not a laboratory where inner states were extracted. It was a stage where those states could be enacted safely. She provided the audience that made the performance possible. She validated the narrative without demanding it be the final word.

  So, how should we understand the value of her career in light of this? We should not measure her success by how many patients achieved perfect self-knowledge. There is no such thing. We should measure her success by how many patients were able to construct a narrative that allowed them to live with less friction. We should measure it by the dignity she afforded to the act of reporting.

  For the students here, who will carry this work forward: do not seek to bypass the performance. Do not look for a technology that will read the mind directly and render the patient's voice obsolete. That is not progress. That is silence. The value of the clinical encounter lies in the friction between what is felt and what is said. That gap is where the work happens.

  For the family and friends here: know that her work was not about solving puzzles. It was about witnessing. When she listened to a patient, she was not checking their data against a database. She was acknowledging their attempt to make sense of their life. That acknowledgement is a moral act, not just a clinical one.

  I am aware that I have spent much of this address dwelling on uncertainty. I have qualified my praise. I have withheld the stories of miraculous cure. I have admitted my own confusion about the nature of my own mind. This is not intended to dampen the celebration. It is intended to honour the rigour of Dr Cole's approach. She never pretended to know more than she could know. She never claimed a certainty that the subject matter could not support.

  To pretend otherwise would be to violate the very principle she taught us. If first-person authority is limited, then our tribute must be limited too. We cannot say she solved the mystery of the self. We can say she taught us how to live with the mystery.

  In the end, the reliability of introspection does not determine whether we trust each other. It determines how we listen. If we expect our friends, our patients, and ourselves to be infallible narrators, we will always be disappointed. We will hear every hesitation as a lie. We will hear every contradiction as a failure. But if we understand these reports as calibrated performances, shaped by the need to connect, then we can listen differently. We can hear the effort. We can hear the request for understanding.

  Dr Cole spent thirty years listening in this way. She heard the performance, and she valued the performer. She understood that the limit of authority is not where the person ends. It is where the relationship begins.

  As we move into the workshop sessions, I ask you to carry this framing with you. When you discuss confabulation, remember the person constructing the story. When you discuss transparency, remember the audience receiving it. And when you speak about Dr Cole's legacy, speak about the space she created for us to speak, even when we are not entirely sure what we are saying.

  Thank you.
