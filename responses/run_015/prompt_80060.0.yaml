answer: |-
  There is no single, canonical term in philosophy or social science that captures this *exact* configuration as a standalone concept. However, your description is precise enough that it carves out a distinct niche at the intersection of decision theory, moral psychology, and rhetoric.

  The phenomenon you are describing is best understood as a specific species of **Preference Construction**, but distinguished by its *retroactive* and *commensurating* nature. While standard "rationalization" implies hiding a pre-existing motive, and "revealed preference" implies uncovering a pre-existing ranking, your case involves the **creation of a ranking that did not previously exist.**

  For the purposes of your taxonomy, the most precise label is **Retroactive Commensuration**.

  Here is the breakdown of why this label fits, how it distinguishes itself from its neighbors, and where the boundaries lie.

  ### 1. Why the Neighboring Terms Fail
  You correctly identified that standard terms miss the mark. Here is the specific failure mode of each:

  *   **Rationalization:** Standard rationalization (in the Freudian or sociological sense) assumes a *hidden truth*. The agent prefers $A$ for selfish reasons but claims $A$ for noble reasons. In your cases, there is no hidden truth. The agent genuinely experienced the options as incommensurable. The "noble reasons" are not a mask; they are a *new construction*.
  *   **Revealed Preference:** This economic concept assumes that action reveals a pre-existing utility function ($U(A) > U(B)$). Your cases explicitly deny this. The utility function was flat ($U(A) = U(B)$ or $A \parallel B$) until the moment of choice, at which point the function was rewritten to show inequality.
  *   **Cognitive Dissonance (Spread of Alternatives):** This is the closest psychological cousin. Festinger's research shows that after a hard choice, people rate the chosen item higher and the rejected item lower to reduce psychological discomfort. However, dissonance theory focuses on the *internal attitude shift*. Your taxonomy is about the *external argumentative move*—the fluent production of a shared scale ("career impact," "discounted income") that was explicitly rejected as a common measure prior to the choice.
  *   **Incommensurability-as-Ignorance:** This view holds that a common measure *exists* but we are too stupid to find it. Your cases assert the opposite: the measure is *generated* by the choice.

  ### 2. The Philosophical Lineage: "Hard Choices" and Normative Creation
  The metaphysical underpinning of this move comes from the philosophy of **Ruth Chang** regarding **"Hard Choices."**

  Chang argues that in some cases, options are not equal, nor is one better; they are **"on a par."** There is no fact of the matter about which is better. In these cases, reason runs out. To choose is not to track a pre-existing value but to **create a reason** through the act of willing.

  *   **The Move:** When your friend argues post-hoc that the high-paying job is *objectively* better, she is engaging in what Chang might call a **misdescription of normative power.** She is taking a reason she *created* by choosing (commitment makes the job better) and presenting it as a reason she *discovered* (the job was always better).
  *   **The Label:** In a taxonomy of argumentative moves, this is **Retroactive Commensuration**. It is the rhetorical collapse of parity ("on a par") into inequality ("better than") after the fact, to satisfy social or internal demands for justification.

  ### 3. Defining "Retroactive Commensuration"
  To pin this down for your taxonomy, you can define it by these four necessary conditions:

  1.  **Prior Parity:** The agent genuinely regards the options as incommensurable or on a par (no shared scale applies).
  2.  **Arbitrary Resolution:** The choice is made via a mechanism acknowledged as non-rational (coin flip, whim, seniority).
  3.  **Post-Hoc Commensurability:** When challenged, the agent produces a justification that relies on a *single shared scale* (money, impact, utility) that renders the choice objectively superior.
  4.  **Counterfactual Fragility:** The justification is contingent on the outcome. If the arbitrary mechanism had selected the other option, an equally robust argument would have been constructed for it.

  ### 4. Distinguishing the Boundaries
  You asked where this stops being *Retroactive Commensuration* and starts being something else. Here are the edge conditions:

  *   **vs. Ordinary Deliberation:** In deliberation, the ranking *precedes* the choice. If the agent weighs the pros and cons, finds a tie-breaker reason (e.g., "I actually do care slightly more about money"), and *then* chooses, that is deliberation. **Retroactive Commensuration** requires that the agent explicitly acknowledges the *absence* of a ranking prior to the arbitrary break.
  *   **vs. Self-Deception:** Self-deception requires the agent to *believe* the false narrative to protect their ego. **Retroactive Commensuration** can be cynical. A grant committee member might know perfectly well they are constructing an argument to defend the committee's arbitrary procedure, without necessarily believing the project is objectively superior. The move works rhetorically regardless of the agent's internal belief state.
  *   **vs. Preference Formation:** Preferences often form *through* action (e.g., I try sushi, I like it, now I prefer sushi). This is **Endogenous Preference.** However, that is about *taste*. **Retroactive Commensuration** is about *value ranking*. It is not that the agent now *likes* the high-paying job more; it is that they argue it is *better* according to a metric they previously deemed insufficient to decide.

  ### 5. Why This Move Exists (The Function)
  If there is no fact of the matter, why make the move?
  *   **Social Legibility:** We live in a culture that demands "reasons" for decisions. "I flipped a coin" is socially illegitimate for high-stakes choices (jobs, grants). "I calculated the long-term impact" is legitimate. The move translates an **existential commitment** into a **bureaucratic justification**.
  *   **Stabilizing the Choice:** As Sartre noted, choice creates anguish because it is groundless. By constructing a narrative that the choice was *determined* by value rather than *creating* value, the agent reduces the anxiety of their own freedom.

  ### Summary for Your Taxonomy
  *   **Label:** **Retroactive Commensuration**
  *   **Definition:** The argumentative move of constructing a definitive, shared value scale to justify a choice that was originally resolved via arbitrary tie-break between incommensurable options.
  *   **Key Feature:** The justification is *constitutive* (created by the choice) but presented as *discovery* (tracking pre-existing value).
  *   **Distinct From:** *Rationalization* (which hides a true motive), *Revealed Preference* (which assumes a pre-existing motive), and *Cognitive Dissonance* (which describes the psychological state, not the rhetorical structure).

  This captures the specific "configuration" you identified: the transformation of an arbitrary *will* into an objective *reason* after the fact.
