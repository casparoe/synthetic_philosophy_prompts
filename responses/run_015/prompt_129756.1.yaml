prompt: |-
  I work in a memory and assistive-technology clinic, and several times a month our team faces variants of the same question: whether some external resource a patient depends on should count as part of that patient's own thinking, or merely as a tool they happen to use. The decision is not academic. If the resource is part of the patient's mind, then degrading or removing it looks like impairing a person rather than depriving them of property; if it is a mere tool, it does not. The same question arises in the opposite direction: when a relative supplies the missing half of a decision — the retrieval cue, the unfinished sentence, the standing set of values — should we score that as the patient's own decision-making capacity, or as someone else's influence on it?

  Please turn the extended mind thesis into a decision procedure my team can actually run, in about fifteen minutes, on a real case. Take as raw material — and do not feel obliged to keep — these candidate conditions: the resource is reliably available when needed; its contents are easily accessible; it is trusted and taken at face value rather than checked against something else; consulting it requires no special effort; past reliance on it has become automatic; and the store is durable over time. Say which conditions you keep, which you drop, which you tighten, and which you demote to mere evidence rather than requirements; say what the team should do when a condition is only partly met or cannot be assessed in a quarter of an hour; and mark clearly the points where no amount of procedure removes the need for a value judgment, and who on the team has to make it.

  One distinction I want handled explicitly, because I think we have been conflating three things that can come apart. First, whether the resource is a component of the cognitive system that actually produces the performance. Second, whether the resulting memory, belief, or action is attributable to the patient as theirs, in the way that matters for credit, responsibility, and consent. Third, whether interfering with the resource wrongs or harms the patient, and whether maintaining it falls under our duty of care. A resource could satisfy the first without settling the third, for instance if it is owned and remotely rewritable by a third party. Tell me how the procedure keeps these separate, and what it does when they disagree.

  Then run it on three cases: a man with dense amnesia whose entire prospective and autobiographical memory lives in a cloud-synced voice assistant that his daughter and the manufacturer can both edit; a single jointly maintained notebook that both partners of a couple rely on for their shared life, where one partner now wants it destroyed; and a spouse who, during a capacity assessment, reliably supplies the cues and values the patient cannot retrieve. I expect to dislike the answer on the last one, so give it to me straight. Finally, state plainly what the procedure cannot do — whether it settles legal capacity, personhood, or consent — and where a clinician should refuse to use it as if it did.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** Memory and assistive-technology clinic.
      *   **Problem:** Distinguishing between external resources as part of the patient's mind vs. mere tools. This affects ethical/legal judgments (impairment vs. property loss, capacity attribution).
      *   **Task:** Create a 15-minute decision procedure based on the Extended Mind Thesis (EMT).
      *   **Inputs:** Candidate conditions (reliability, accessibility, trust, effort, automaticity, durability). I need to modify these (keep, drop, tighten, demote).
      *   **Requirements:**
          *   Handle partial meets/uncertainty.
          *   Mark where value judgments are unavoidable and who makes them.
          *   Explicitly distinguish three concepts: (1) Cognitive Component, (2) Attribution/Agency, (3) Ethical/Legal Protection (Harm/Duty).
          *   Handle disagreements between these three.
          *   Run the procedure on three specific cases (Cloud Amnesia, Shared Notebook, Spousal Scaffolding).
          *   State limitations (what it *cannot* decide).
      *   **Tone:** Practical, clinical, direct ("give it to me straight"), philosophically rigorous but actionable.

  2.  **Analyze the Extended Mind Thesis (EMT) for Clinical Use:**

      *   *Standard EMT (Clark & Chalmers):* Parity principle. If a process inside the head counts as cognitive, a process outside should too if it meets criteria (reliability, accessibility, trust, automaticity).
      *   *Clinical Adaptation:* We aren't just asking "Is this mind?" We are asking "What are the consequences of treating it as mind?"
      *   *The Three Distinctions:* The prompt wisely separates Ontology (is it part of the system?), Agency (is it *their* action?), and Ethics (do we protect it?). Standard EMT often conflates these. I need to build a procedure that assesses them sequentially but separately.

  3.  **Drafting the Decision Procedure (The "EMT-Clinical Triage"):**

      *   *Time Limit:* 15 minutes. Needs to be a checklist or flow, not an essay.
      *   *Modifying Conditions:*
          *   *Reliability/Availability:* Keep, but tighten. It must be *individually* reliable, not just generally.
          *   *Accessibility:* Keep.
          *   *Trust:* Keep. Crucial.
          *   *Effort/Automaticity:* Demote to evidence. "Automaticity" is hard to measure in 15 mins.
          *   *Durability:* Keep.
          *   *New Condition:* *Endorsement/Integration.* Does the patient identify with it?
      *   *Structure:* Three Phases corresponding to the three distinctions.
      *   *Value Judgments:* Need to specify that the Clinician leads on Cognitive/Agency, but Ethics requires Team/Patient/Family input.

  4.  **Refining the Three Distinctions:**

      1.  **Functional Integration (The "Is it Mind?" test):** Does it function like internal memory?
      2.  **Agency Attribution (The "Is it Theirs?" test):** Does the patient own the output?
      3.  **Protective Status (The "Do We Defend It?" test):** Does removing it constitute harm/negligence?

      *Crucial Insight:* You can have Functional Integration without Protective Status (e.g., the cloud server owned by a hostile third party). You can have Protective Status without Functional Integration (e.g., a basic tool necessary for life, like glasses, even if not 'mind').

  5.  **Developing the Procedure Steps:**

      *   *Step 1: Functional Integration (5 mins).* Check the criteria.
      *   *Step 2: Agency Attribution (5 mins).* Check endorsement and control.
      *   *Step 3: Protective Status (5 mins).* Check vulnerability and duty of care.
      *   *Handling Uncertainty:* If data is missing, flag as "Provisional." Default to protection if risk of harm is high.
      *   *Who Decides:* Clinician assesses function; Patient assesses agency (if possible); Team/Ethics assesses protection.

  6.  **Applying to the Three Cases:**

      *   *Case 1: Cloud Amnesia.*
          *   Function: High (replaces memory).
          *   Agency: Mixed (Patient relies, but Daughter/Manufacturer edit).
          *   Protection: High risk. Removing it = lobotomy. But who controls it?
          *   *Verdict:* Functionally part of mind. Agency compromised by third-party edit rights. Protection required (treat removal as harm), but access rights need legal/ethical review.
      *   *Case 2: Shared Notebook.*
          *   Function: High (shared memory).
          *   Agency: Joint.
          *   Protection: Conflict. One wants destruction.
          *   *Verdict:* It is a *distributed* cognitive system. Destroying it harms the system. But property rights conflict with cognitive rights. Procedure should flag this as an ethical conflict, not just a clinical one.
      *   *Case 3: Spousal Scaffolding.*
          *   Function: High (cueing).
          *   Agency: The hard one. Is the decision the patient's or the spouse's?
          *   Protection: Separating them causes harm.
          *   *Verdict:* "Give it to me straight." If the spouse supplies the *values* and *retrieval*, the capacity is *dyadic*. Scoring the patient alone is inaccurate. The procedure must admit that the patient *lacks* individual capacity but possesses *supported* capacity. This challenges legal frameworks that require individual capacity.

  7.  **Addressing Limitations:**

      *   It doesn't decide legal capacity (courts do).
      *   It doesn't define personhood.
      *   It doesn't override consent laws.
      *   Clinicians must not use it to bypass due process.

  8.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? Need to make it sound like a clinic protocol.
      *   *Constraint Check:* Did I modify the conditions as requested? Yes.
      *   *Distinction Check:* Are the three layers clear? Yes.
      *   *Case 3 Check:* Did I pull punches? Need to ensure I state that relying on the spouse means the patient *in isolation* fails the capacity test, even if the *unit* succeeds. This is the uncomfortable truth.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Value Judgment" points are highlighted. (Self-Correction: Make sure the distinction between "Tool" and "Mind" doesn't obscure the "Duty of Care." Even tools necessary for life are protected, but 'mind' parts are protected *differently*.)

      *Refining the Conditions:*
      *   *Reliability:* Keep.
      *   *Accessibility:* Keep.
      *   *Trust:* Keep.
      *   *Effort:* Drop (too subjective).
      *   *Automaticity:* Demote to evidence.
      *   *Durability:* Keep.
      *   *Add:* **Endorsement** (Patient accepts it as theirs).
      *   *Add:* **Control** (Who can alter the data?).

      *Refining the "Value Judgment" points:*
      *   Determining "Trust" is subjective.
      *   Determining "Harm" is ethical.
      *   Determining "Agency" when communication is impaired is interpretive.

      *Refining Case 3:* The prompt says "I expect to dislike the answer." The answer must be: "The patient does not have capacity *on their own*. The unit does. If the law requires individual capacity, the patient fails."

  10. **Final Output Generation** (Drafting the response based on these thoughts).
answer: |-
  # The Extended Mind Clinical Triage (EMCT)
  **Time Allocation:** 15 Minutes
  **Purpose:** To distinguish between external resources that function as cognitive prosthetics (parts of the mind) versus mere tools, and to determine the ethical/clinical implications of that status.
  **Warning:** This procedure informs clinical judgment; it does not determine legal status.

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: Functional Integration (5 Minutes)
  *Goal: Determine if the resource acts as a component of the cognitive system (Distinction 1).*

  **The Criteria (Modified from Clark & Chalmers):**
  1.  **Reliability (Keep & Tighten):** Is the resource available *whenever* the cognitive task arises, not just often? (Tighten: Intermittent access = Tool).
  2.  **Accessibility (Keep):** Can the patient retrieve information from it as quickly as internal memory?
  3.  **Trust (Keep):** Is the information accepted automatically, without verification against other sources?
  4.  **Durability (Keep):** Does the information persist over time without constant re-entry?
  5.  **Endorsement (Add):** Does the patient identify the output as their own thought/memory?

  **Scoring:**
  *   **4-5 Met:** Strong evidence of Functional Integration.
  *   **2-3 Met:** Hybrid Status (Proceed to Phase 2 with caution).
  *   **0-1 Met:** External Tool.

  **Uncertainty Protocol:** If you cannot verify Reliability or Trust in 15 minutes, mark as **"Provisional Integration."** Default to treating it as Integrated for the sake of care planning until proven otherwise.

  ### Phase 2: Agency Attribution (5 Minutes)
  *Goal: Determine if the output is attributable to the patient for credit/responsibility/consent (Distinction 2).*

  **The Criteria:**
  1.  **Control (Add):** Who can alter, delete, or inject data into the resource? (Patient only? Shared? Third party?)
  2.  **Alignment (Demote from Trust):** Do the values/preferences stored in the resource match the patient's historical and current expressed values?
  3.  **Automaticity (Demote to Evidence):** Is the use of the resource habitual or effortful? (Note: High effort does not rule out integration, e.g., a paralyzed person using eye-gaze tech).

  **Scoring:**
  *   **High Control + High Alignment:** Agency resides with Patient.
  *   **Shared Control + High Alignment:** Agency is Dyadic/Shared.
  *   **Low Control (Third Party) OR Low Alignment:** Agency is Compromised or Ventriloquized.

  **Value Judgment Point #1:** *Who assesses Alignment?*
  If the patient cannot verbally confirm alignment, the **Lead Clinician** must interpret behavioral cues. This is not objective. Document the interpretation explicitly.

  ### Phase 3: Protective Status (5 Minutes)
  *Goal: Determine if interfering with the resource wrongs the patient or triggers duty of care (Distinction 3).*

  **The Criteria:**
  1.  **Harm Magnitude:** Would removal cause cognitive collapse (disorientation, loss of identity) or mere inconvenience?
  2.  **Vulnerability:** Is the resource susceptible to hostile manipulation (hacking, family editing, institutional removal)?
  3.  **Necessity:** Is there a feasible alternative?

  **Decision Rule:**
  *   If **Functional Integration** is High AND **Harm Magnitude** is High → **Protective Status Granted.** (Removing it is akin to impairing a biological function).
  *   If **Functional Integration** is Low BUT **Necessity** is High → **Protective Status Granted.** (Removing it is akin to removing a wheelchair, even if the wheelchair isn't 'mind').
  *   If **Agency** is Compromised (Phase 2) → **Protective Status is Conditional.** You must protect the patient *from* the resource's controllers as well as *for* the resource.

  **Value Judgment Point #2:** *Who decides Protective Status?*
  This is an ethical determination. The **Clinician** recommends, but the **Ethics Team/Legal Proxy** must ratify if it conflicts with property rights or institutional policy.

  ---

  ## Part 2: Handling Disagreements Between Distinctions

  The procedure explicitly separates the three layers. They will often disagree. Here is how to adjudicate:

  1.  **Integrated but Not Attributable (The "Hijacked Mind"):**
      *   *Scenario:* A cloud device functions as memory (Phase 1 Pass), but a manufacturer or relative edits the data (Phase 2 Fail).
      *   *Action:* The resource is part of the mind, but the *patient* does not own the agency.
      *   *Clinical Duty:* Treat removal as harm (Phase 3 Pass), but treat *access* as a security risk. Do not accept the device's output as valid consent until Control is established.

  2.  **Attributable but Not Integrated (The "Conscious Tool"):**
      *   *Scenario:* A patient uses a diary effortfully, checking every entry (Phase 1 Fail), but claims it as their own (Phase 2 Pass).
      *   *Action:* It is a tool, not a cognitive organ.
      *   *Clinical Duty:* Removal is property deprivation, not cognitive impairment. However, if it is necessary for safety, Duty of Care still applies (Phase 3).

  3.  **Integrated and Attributable but Vulnerable (The "Hostage Mind"):**
      *   *Scenario:* A spouse supplies all cues (Phase 1 & 2 Pass for the Dyad), but the spouse is hostile or unreliable.
      *   *Action:* The capacity exists only in the unit.
      *   *Clinical Duty:* You cannot score the patient as having individual capacity. You must assess the *safety of the unit*.

  ---

  ## Part 3: Case Runs

  ### Case 1: The Cloud Amnesiac
  *Profile:* Dense amnesia. Memory lives in a cloud voice assistant. Daughter and Manufacturer have edit rights.
  *   **Phase 1 (Integration):** **Pass.** Reliability, Accessibility, Trust, Durability all high. It is his hippocampus.
  *   **Phase 2 (Agency):** **Fail.** Control is shared with Daughter/Manufacturer. Alignment is unknown (if they edit, whose values are stored?).
  *   **Phase 3 (Protection):** **High.** Removal causes cognitive collapse.
  *   **Verdict:** This is a **Hijacked Mind**.
  *   **Action:** Treating the device as mere property is malpractice; removing it is impairing the patient. However, you cannot accept decisions generated by the device as valid *patient consent* because Agency is compromised. You must advocate for the patient to gain exclusive Control (e.g., legal guardianship over the device settings) before treating the output as autonomous.

  ### Case 2: The Shared Notebook
  *Profile:* Couple relies on one notebook for shared life. One partner wants it destroyed.
  *   **Phase 1 (Integration):** **Pass (Dyadic).** The system functions reliably for the couple.
  *   **Phase 2 (Agency):** **Shared.** It represents the "couple's mind," not just the patient's.
  *   **Phase 3 (Protection):** **Conflict.** Destruction harms the patient's cognitive system but falls under the partner's property rights or autonomy.
  *   **Verdict:** **Distributed Cognitive System.**
  *   **Action:** The notebook is not just property; it is a shared cognitive organ. Destroying it inflicts cognitive harm on the patient. However, the procedure cannot override the partner's legal right to destroy their property. The Clinician must flag this as an **Ethical Conflict**: The duty to prevent cognitive harm to the patient vs. the rights of the partner. Mediation is required; clinical authority is insufficient.

  ### Case 3: The Spousal Scaffold
  *Profile:* Spouse supplies retrieval cues and values during capacity assessment. Patient cannot retrieve alone.
  *   **Phase 1 (Integration):** **Pass.** The spouse functions as an external retrieval cue and value-storage module. The cognitive system is the Patient + Spouse.
  *   **Phase 2 (Agency):** **Dyadic.** The decision emerges from the interaction. It is not solely the patient's, nor solely the spouse's.
  *   **Phase 3 (Protection):** **High.** Separating them degrades capacity.
  *   **Verdict:** **The Patient Lacks Individual Capacity.**
  *   **The Straight Answer:** You asked for the truth you expect to dislike. If the legal standard requires *individual* capacity, **the patient fails.** The procedure confirms that the *capacity resides in the dyad*, not the individual.
  *   **Action:** Do not score the patient as "having capacity" based on this performance. That is falsifying the assessment. Instead, document: *"Patient demonstrates capacity only within the specific scaffold of [Spouse]."* If the law does not recognize supported decision-making, the patient is legally incapacitated. Your duty is to advocate for a legal framework that recognizes dyadic capacity, not to pretend the patient has individual capacity they do not possess.

  ---

  ## Part 4: Limitations and Refusals

  **What This Procedure Cannot Do:**

  1.  **Settle Legal Capacity:** Courts decide capacity, not clinicians. This procedure tells you *where* the cognitive work is happening, not whether the law recognizes it. Do not write "Patient has capacity" in a legal form based solely on Phase 1 success. Write "Patient requires Resource X to demonstrate capacity."
  2.  **Define Personhood:** This does not determine if the patient is a "person" under the law. It only maps the boundaries of their cognitive processing.
  3.  **Override Consent Laws:** If Phase 2 (Agency) fails, you cannot use the resource's output to sign consent forms, even if Phase 1 (Integration) passes. A hijacked mind cannot consent.
  4.  **Resolve Property Disputes:** In Case 2, this procedure identifies the harm, but it does not grant the clinic the power to seize the notebook from the partner.

  **When to Refuse Use:**
  *   **When Legal Coercion is Imminent:** If the goal is to find a pretext to remove a resource to facilitate discharge or guardianship, do not use this. It is designed to protect cognitive integrity, not bypass it.
  *   **When Time is Insufficient:** If you cannot assess Trust or Control in 15 minutes, do not declare "Tool." Declare "Insufficient Data" and maintain Protective Status by default.
  *   **When Values Conflict:** If the patient's past values (in the resource) conflict with current behavior, this procedure cannot resolve which is "authentic." That is a philosophical/ethical judgment, not a clinical one. Refer to Ethics Committee.

  **Final Instruction to Team:**
  Use this to prevent the *invisible harm* of treating a prosthetic mind like a lost wallet. But do not use it to pretend that a supported decision is an independent one. The goal is accurate mapping, not comforting fictions.
