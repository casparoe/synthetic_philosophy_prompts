answer: |-
  You have isolated a precise and significant phenomenological anomaly, but there is no single, canonical term that captures it in its entirety. It sits at the intersection of philosophy of mind, metacognitive psychology, and predictive neuroscience.

  The phenomenon you describe is best understood as a mismatch between **phenomenal grain** (the resolution of the experience) and **reportable content** (the specificity of the output), coupled with a failure of **metacognitive monitoring** to detect that mismatch.

  Here is the breakdown of the existing literature, where it fits, where it breaks, and a proposal for how to carve this out conceptually.

  ### 1. The Existing Concepts (and Why They Break)

  **A. Confabulation**
  *   **Fit:** You are producing specific details that are factually incorrect without intending to deceive.
  *   **Break:** In clinical literature (e.g., Korsakoff's, split-brain), confabulation is usually a response to a *felt* gap or a neurological deficit. You report "no hesitation" and "no deficit." This is **normal confabulation**, which is less studied but recognized in eyewitness testimony research. However, "confabulation" implies a narrative fabrication; your case includes low-level perceptual details (red triangle), which feels more like perception than narrative.

  **B. The "Grand Illusion" of Consciousness (Dennett / Noë)**
  *   **Fit:** Daniel Dennett and Alva Noë argue that we *think* our experience is rich and detailed, but it is actually sparse, filled in only where attention lands.
  *   **Break:** This is a broad theoretical claim, not a label for the specific mechanism of *determinacy*. It explains *that* you are wrong, but not *why the content feels specific* rather than vague. It describes the deficit, not the positive presence of the false detail.

  **C. Perceptual Filling-in (e.g., Blind Spot, Amodal Completion)**
  *   **Fit:** The brain generates content where there is no signal (e.g., filling in the blind spot with surrounding texture).
  *   **Break:** Standard filling-in usually replicates surrounding context (texture, color). Your example ("red triangle tilted left") implies **semantic or object-level specification** without data. This is closer to **constructive perception** than simple filling-in.

  **D. Metacognitive Overconfidence**
  *   **Fit:** You are confident despite being wrong.
  *   **Break:** As you noted, this is not just an error in *confidence estimation*. It is an error in the *determinacy of the content*. You don't just feel *sure* you saw a triangle; the experience *is* of a triangle. Standard overconfidence models separate the signal from the confidence rating; in your case, the signal itself seems corrupted.

  ### 2. The Philosophical Core: "Phenomenal Determinacy"

  The specific philosophical debate you are engaging with is the **Determinacy of Experience**.
  *   **The Realist View (e.g., Michael Tye):** Experience is determinate; if it seems like a red triangle, it is a red triangle in your phenomenology.
  *   **The Indeterminacy View (e.g., Daniel Dennett, Keith Frankish):** Experience is often gappy or vague; the specificity is added later by judgment.

  Your observation supports the **Indeterminacy View**, but with a crucial addendum: **The Indeterminacy is Phenomenologically Invisible.** You do not experience the vagueness. You experience a "determinate hallucination."

  ### 3. A Proposed Term: "Phenomenal Over-Specification"

  Since no single term exists, I propose **Phenomenal Over-Specification** (or **Illusory Determinacy**).

  **Definition:** A state in which the reportable content of an experience possesses a higher degree of semantic or perceptual specificity than the underlying sensory or mnemonic data can support, accompanied by a lack of metacognitive uncertainty.

  **Why this term?**
  *   **Phenomenal:** It claims the specificity is present in the *feel* of the experience, not just the report.
  *   **Over-Specification:** It highlights that the "resolution" exceeds the "bandwidth."
  *   It distinguishes itself from *confabulation* (which implies narrative) and *filling-in* (which implies texture).

  ### 4. The Boundary Problem: Experience vs. Report

  You asked: *"Tell me what would distinguish specificity that belongs to the experience from specificity that enters only at the point of report."*

  **The Hard Truth:** From the inside (first-person perspective), **you cannot distinguish them.**

  This is the crux of Dennett's **Orwellian vs. Stalinesque** distinction:
  *   **Stalinesque:** The brain fabricates the detail *before* it enters consciousness (a "show trial"). The experience *is* specific, but false.
  *   **Orwellian:** The experience is vague, but the memory/report is revised *after* the fact to look specific (a "revisionist history").

  Dennett argues this distinction is **empirically empty** from the first-person view. If you cannot detect the vagueness, then functionally, the specificity *is* part of your experience.

  **How to Carve It Out (Third-Person/Functional Criteria):**
  Since you cannot tell from the inside, you must use **converging operations** (exactly what you are doing):
  1.  **Latency:** If the specificity is part of the experience, reaction times should be fast. If it is a post-hoc report construction, there may be a measurable (though perhaps introspectively invisible) delay or neural signature of decision-making *after* the percept.
  2.  **Interference:** If the specificity is perceptual, it should be susceptible to perceptual masking. If it is mnemonic/report-based, it should be susceptible to verbal interference.
  3.  **Forced-Choice vs. Free-Report:** You found that allowing "unclear" answers didn't help. This suggests the specificity is **pre-decisional**. It is baked into the percept/hypothesis before the "I don't know" gate opens.

  ### 5. The Mechanism: Predictive Processing

  The most robust explanatory framework for this is **Predictive Processing** (Friston, Seth, Hohwy).
  *   The brain is a hypothesis generator. It does not passively receive data; it predicts the world.
  *   To minimize "prediction error," the brain must commit to a specific hypothesis (e.g., "Triangle"). A "fuzzy triangle" is computationally expensive and less actionable.
  *   **Precision Weighting:** The brain assigns a "precision" (confidence) value to its predictions. In your case, the system is **miscalibrating precision**. It is assigning high precision to a low-data hypothesis.
  *   **Why no hesitation?** Because hesitation is a signal of *low precision*. If the system erroneously tags the hypothesis as high precision, hesitation is suppressed.

  ### 6. Recommended Reading

  To deepen this inquiry, you should look at these specific clusters of literature:

  **On the Determinacy Illusion:**
  *   **Daniel Dennett,** *Consciousness Explained* (specifically the chapters on "Orwellian vs. Stalinesque" and the "Grand Illusion").
  *   **Keith Frankish,** *The Illusion of Conscious Will* and his work on **Illusionism**. He argues that phenomenal properties themselves are a user-illusion.
  *   **Ian Phillips,** "The Phenomenology of Memory" (Philosophical discussions on whether memory experience is determinate).

  **On the Mechanism (Predictive/Constructive):**
  *   **Anil Seth,** *Being You: The New Science of Consciousness*. (Look for "controlled hallucination").
  *   **Firestone & Scholl,** "Cognition Does Not Affect Perception" (and their subsequent work on **post-perceptual inference**). They argue that what looks like perception is often judgment.
  *   **Steve Fleming,** *Know Thyself: The Science of Self-Awareness*. (Focuses on metacognition and why we fail to detect our own errors).

  **On the Specific Phenomenon:**
  *   **Elizabeth Loftus,** work on **Eyewitness Memory**. She documents exactly this: high specificity, high confidence, zero accuracy.
  *   **Kouider et al. (2016),** "Dissociation between objective performance and subjective awareness." (Look for papers on **meta-contrast masking** and **subjective visibility scales**).

  ### Summary

  You have isolated **Phenomenal Over-Specification**. It is not standard confabulation because it lacks the felt gap. It is not standard overconfidence because the content itself is affected, not just the confidence rating.

  It is likely a **Predictive Processing error** where the brain commits to a high-precision hypothesis to facilitate action, suppressing the uncertainty signal. You cannot distinguish whether this happens "in experience" or "at report" from the inside; that distinction is a third-person functional claim, not a first-person datum. Your experiments are the correct way to map the boundary, because the boundary is behavioral, not phenomenological.
