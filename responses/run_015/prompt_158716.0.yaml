  **The sequence** (~350 words)
  Your instinct is correct: "two kinds of not-knowing" must land before the urn. If you start with balls, they count. If you start with concepts, they feel. Define risk (known odds) versus ambiguity (unknown odds) immediately. Use a coin versus a weather forecast. Once that distinction is felt, introduce Ada's urn. Do not explain the paradox yet. Get the room to vote on Bet 1: Red versus Black. Most will pick Red. Write this consensus on the board. Then vote on Bet 2: Red-or-Yellow versus Black-or-Yellow. Most will pick Black-or-Yellow. Write this down too. *Now* reveal the contradiction. If they believe Red is safer than Black, they must believe Black-or-Yellow is safer than Red-or-Yellow. Their votes say the opposite. The contradiction must land after commitment. If you show the math first, they defend the math. If they commit first, they defend their intuition. Then explain the intuition isn't stupidity; it's ambiguity aversion. The sequence depends on emotional investment before logical dismantling. Do not explain *why* until they feel the conflict. Your instinct is correct: define the two ignorances first, then trap them in the urn, then spring the logic. If you reverse it, you're lecturing. If you follow this, you're guiding an experience. The room must feel the itch before you offer the scratch. If you explain ambiguity aversion before the vote, they will perform correctness. If you wait, their own hands betray them. The dependency is strict: definition, trap, revelation, explanation. Allocate exactly five minutes per stage. Rushing the vote kills the complicity. If they don't raise their hands, they don't own the contradiction. The reveal needs silence. Let the math sit there for a moment before you speak. The explanation is the relief valve. If you open it too soon, the pressure never builds. You are not teaching math; you are staging a scene where the audience plays Ada. They need to be Ada before they can judge her. Make them sit with the discomfort.

  **The urn** (~200 words)
  Keep the book's urn. Swapping to a bookie or lottery introduces narrative noise (trust, rigging) that distracts from the structural paradox. The audience knows the urn; use that familiarity. A bookie implies agency; a lottery implies external randomness. The urn is pure structure. The example must have a fixed total (90), a known subset (30 Red), and a hidden subset (60 Black/Yellow) that remains hidden during the choice. Crucially, it must not have *any* mechanism for revealing the ratio later. If there's a chance to know, it becomes an information-gathering problem, not a decision-under-uncertainty problem. The opacity must be absolute. The physical prop matters less than the structural constraints. Don't let them ask "can I shake it?" The unknown must stay unknown. If you change the vessel, you change the rules. Readers will fight the new metaphor instead of seeing the old scene. Stick to the text. The urn is neutral. It doesn't want her to lose; it just doesn't tell her. That neutrality is vital. If the container seems malicious, the paradox becomes paranoia. If it seems random, it becomes risk. It must be neither. It must simply be silent.

  **The extra urn** (~200 words)
  Use this as the payoff, not a distraction. If a machine picks the split uniformly, you now know the second-order probability. Technically, this converts ambiguity to risk. Mathematically, the paradox dissolves because expected values align. Psychologically, it might not feel safer, but logically it changes the game. Place this after the main contradiction to show the boundary of the feeling. The adversarial version (someone wants Ada to lose) is stronger for fiction. It reintroduces ambiguity because the distribution isn't random; it's optimized against her. Use the adversarial version to validate Ada's caution without calling it a math error. It shifts the scene from "Ada is bad at math" to "Ada suspects the game is rigged." Introduce this in the final five minutes. It answers the "why" without fixing the math. The notarised machine is a clean theoretical boundary, but the adversary is a narrative truth. Readers understand enemies. They don't understand uniform distributions. If you must choose, choose the adversary. It justifies her fear. The machine explains the theory; the enemy explains the character. Use the machine to show you know the math, then use the enemy to show you know the story.

