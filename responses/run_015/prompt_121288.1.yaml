      *   *Key Insight to add:* The distinction between *commiseration* (theater) and *communion* (festivals). The theater isolates even in a crowd; the festival unites.

  6.  **Final Polish:** Check against the user's constraint ("No need for sources"). Ensure I don't just say "Yes" but explain *why* it holds or where it might wobble. (Self-Correction: Make sure to emphasize that the "spectator" critique is actually the *most* textually supported part, more so than simple moral corruption).

