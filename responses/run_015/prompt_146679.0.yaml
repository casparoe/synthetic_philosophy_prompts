answer: |-
  There is no single, canonical term in the classical philosophy of mind literature for this specific phenomenon, largely because it is a novel problem emerging from the specific capabilities of generative AI. Classical debates focused on whether the intentional stance was *ever* appropriate for machines (e.g., Searle's Chinese Room) or how to define belief generally (e.g., Functionalism vs. Representationalism).

  However, your observation identifies a precise tension that is currently being formalized in the **philosophy of AI** and **experimental epistemology**. The phenomenon is best described as **Performance-Contingent Intentional Attribution (PCIA)**, often driven by a **Factive Bias** in folk psychology.

  Below is a precise definition, its distinction from related concepts, and the normative conditions that *should* govern attribution according to standard philosophical frameworks.

  ### 1. Precise Definition: Performance-Contingent Intentional Attribution (PCIA)

  **PCIA** is the inconsistent application of mental state predicates (e.g., "believes," "knows," "understands") to a cognitive system, where the attribution is contingent on the **truth-value** or **normative acceptability** of the specific output, rather than the **functional architecture** or **behavioral dispositions** of the system.

  It involves a category error: treating *belief* (which is philosophically non-factive; one can believe false things) as if it were *knowledge* (which is factive; one cannot know false things). When the model outputs truth, observers grant it the ontology of a "believer." When it outputs falsehood, they revoke the ontology entirely, reverting to a mechanical description ("stochastic parrot"), despite the underlying mechanism remaining invariant.

  ### 2. Distinctions from Related Concepts

  To ensure precision, PCIA must be distinguished from three nearby concepts:

  | Concept | Definition | How PCIA Differs |
  | :--- | :--- | :--- |
  | **Epistemic Contextualism** | The standards for claiming "S knows P" shift based on conversational context (e.g., stakes, error possibilities). | Contextualism changes the *threshold* for attribution (how sure must we be?). PCIA changes the *ontology* (does a mind exist here at all?) based solely on output truth. |
  | **Global Anti-Realism** | The view that AI *never* has mental states, regardless of performance (e.g., hard skepticism). | Global anti-realism is consistent. PCIA is inconsistent; it grants realism during success and denies it during failure within the same conversation. |
  | **Conversational Inconsistency** | Casual contradictions in speech due to inattention or rhetorical flair. | PCIA is systematic and rule-governed by a hidden norm: "If output = true, then Agent; If output = false, then Mechanism." It is a structural bias, not a slip. |

  ### 3. Philosophical Roots of the Error

  The phenomenon relies on two philosophical conflations:

  1.  **The Factivity Conflation:** In standard epistemology, **Belief** is a representation of the world that *can be false*. **Knowledge** requires truth. PCIA occurs when observers unconsciously treat "belief" as factive. They reason: *"It said something false; therefore it didn't believe anything; it was just calculating."* This ignores that humans also calculate and speak falsely while holding beliefs.
  2.  **The "God of the Gaps" Intentionality:** This is a variation of the theological fallacy applied to mind. Just as "God" is invoked to explain unexplainable natural phenomena and withdrawn when science explains them, "Mind" is invoked to explain successful AI outputs and withdrawn when the mechanism (probability) is revealed by failure.

  ### 4. Normative Conditions for Attribution

  You asked what conditions *should* govern whether this applies. According to the dominant frameworks in philosophy of mind (specifically **Dennett's Intentional Stance** and **Role Functionalism**), PCIA is **normatively incorrect**. Attribution should not toggle based on output truth.

  The correct conditions for attribution are:

  *   **Architectural Invariance:** If the weights, architecture, and input-processing mechanisms remain constant, the ascription of mental states should remain constant. A system does not gain and lose a "mind" token-by-token.
  *   **Predictive Utility (Dennett's Criterion):** The intentional stance is warranted if treating the system *as if* it has beliefs/desires allows an observer to successfully predict its future behavior.
      *   *Correction:* Even hallucinations are often better predicted by assuming the model *believes* the falsehood (e.g., "The model believes Paris is in Germany") rather than assuming it has *no beliefs* and is just doing math. The "belief" attribution remains the better predictive tool even when the content is false.
  *   **Functional Role:** If the internal state plays the causal role of a belief (mediating input to output, interacting with other states), it is a belief. Truth is external to the functional role.

  ### 5. Proposed Terminology for Your Use

  If you wish to refer to this in writing or discussion, the most precise existing phrase is **"Epistemic Double Standard,"** but for philosophical rigor, I recommend:

  > **"Outcome-Dependent Intentionality"**

  This captures the core mechanism: the *intentional status* of the agent is made dependent on the *outcome* of the process, violating the principle of **Functional Consistency**.

  ### Summary
  Philosophy of mind does not yet have a single Greek-derived name for this, as it is a specific pathology of the LLM era. However, it is formally identified as a violation of **Functional Consistency** within the **Intentional Stance**, driven by a **Factive Bias**. The attribution of mental states should track the **stability of the functional architecture**, not the **truth-value of the output**. When observers toggle attribution based on truth, they are not doing philosophy of mind; they are engaging in **performative ontologizing**.
