  ### Instructor's Design Key & Logical Space Mapping

  **Node Layout & Combinations**
  1.  **Logical Form:** Disagree on object only vs. logical grammar (term/quantifier).
  2.  **Ontology:** Disagree on existence commitments (quantifiers/identity) vs. same ontology.
  3.  **Home Language:** Applies to self vs. only others.
  4.  **Physical Facts:** Neural/physical facts fix meaning vs. do not. *[Marked as Spectrum]*
  5.  **Factuality:** Hidden fact exists vs. no fact at all.
  6.  **Cost:** Breaks belief-desire psychology vs. retainable (relativized).
  7.  **Source:** Internal structure vs. external causal history.
  8.  **Social:** Requires second speaker (triangulation) vs. does not.

  **Position Mapping**
  1.  **Deflationary:** Node 1 (Object only).
  2.  **Unoccupied (Incoherent):** Node 1 (Form) → Node 2 (Same Ontology). *Diagnosis: If logical form differs, ontological commitment usually shifts; view unmotivated.*
  3.  **Triangulation:** Node 3 (Others) → Node 8 (Requires Second Speaker).
  4.  **Unoccupied (Solipsistic):** Node 3 (Others) → Node 8 (No Second Speaker). *Diagnosis: Translation of others without social constraint is unexplored/unattractive.*
  5.  **Global Permutation:** Node 4 (No Fix) → Node 5 (Hidden Fact).
  6.  **Quine:** Node 4 (No Fix) → Node 5 (No Fact) → Node 6 (Retain Psychology).
  7.  **Meaning Skeptic:** Node 4 (No Fix) → Node 5 (No Fact) → Node 6 (Break Psychology).
  8.  **Internalist:** Node 4 (Fix) → Node 7 (Internal).
  9.  **Direct Reference:** Node 4 (Fix) → Node 7 (External).

  **Separability & Spectrum Notes**
  *   **Inseparable Leaves:** Quine and Meaning Skeptic are adjacent. They differ on whether indeterminacy destroys normative psychology. This is a subtle philosophical distinction, not a logical contradiction.
  *   **Spectrum Node:** Node 4 (Physical Facts) is a spectrum (supervenience), treated here as a fork for clarity.

  ***

  # SEMINAR HANDOUT: The Indeterminacy Decision Tree

  **Starting Commitment:** Two manuals for translating a field linguist's informant can fit every possible bit of stimulus and behavior evidence and still disagree about what the one-word utterance is about.

  **Instructions:** Follow the arrows based on your philosophical intuitions. Answer the questions as they seem to *you*, not as you think a specific theorist would. At the end, you will land on a position. Read the "Awkward Commitment" to see the cost of your view, and the "Push-Off" to see the strongest argument against it.

  ---

  **1. Do the competing manuals disagree only about *which* object a term picks out, or do they also assign different logical forms (e.g., one treats the utterance as a name for a rabbit, another as a quantifier over rabbit parts)?**
  *   (A) Only about the object. → **Go to Leaf 1**
  *   (B) Also about logical form. → **Go to Question 2**

  **2. Does the reinterpretation push through the quantifiers and identity predicate, so the manuals disagree about what the natives are committed to *existing*?**
  *   (A) No, ontological commitments remain the same. → **Go to Leaf 2**
  *   (B) Yes, ontological commitments differ. → **Go to Question 3**

  **3. Does this puzzle get a grip on the informant's own idiolect, or only on the translation of another speaker?**
  *   (A) Only on another speaker. → **Go to Question 8**
  *   (B) On my own current idiolect too. → **Go to Question 4**

  **4. Does the indeterminacy survive if the linguist is handed every physical fact there is to have, neural facts included?***
  *   (A) No, physical facts fix the correct manual. → **Go to Question 7**
  *   (B) Yes, it survives even then. → **Go to Question 5**
      *( *Note: This is technically a spectrum of supervenience, treated here as a fork.)*

  **5. If physical facts don't fix it, is there still a hidden fact of the matter about meaning, or is there no fact at all?**
  *   (A) There is still a hidden fact. → **Go to Leaf 3**
  *   (B) There is no fact at all. → **Go to Question 6**

  **6. If there is no fact, is this bad news for belief-desire psychology and cognitive science, or something we can shrug off?**
  *   (A) Bad news (requires a skeptical solution). → **Go to Leaf 4**
  *   (B) Shrug off (relativize to a background language). → **Go to Leaf 5**

  **7. If physical facts do fix it, is meaning fixed by innate internal structure or by external causal history?**
  *   (A) Innate internal structure. → **Go to Leaf 6**
  *   (B) External causal history. → **Go to Leaf 7**

  **8. Does fixing the meaning of another speaker require interaction with a second speaker (triangulation)?**
  *   (A) Yes, social interaction is required. → **Go to Leaf 8**
  *   (B) No, individual interaction suffices. → **Go to Leaf 9**

  ---

  ### LEAF POSITIONS

  **Leaf 1: Deflationary Underdetermination**
  *   **Names:** Early Quine readings, some Pragmatists.
  *   **Awkward Commitment:** You must claim deep disagreements about logical form are merely verbal or trivial.
  *   **Push-Off:** If logical forms differ, truth conditions differ, making the disagreement substantive, not trivial.

  **Leaf 2: [Unoccupied]**
  *   **Names:** None.
  *   **Diagnosis:** Incoherent. If logical form differs (e.g., term vs. quantifier), ontological commitment usually shifts automatically.
  *   **Push-Off:** N/A.

  **Leaf 3: Global Permutation**
  *   **Names:** Putnam.
  *   **Awkward Commitment:** You must accept reference is fixed even when physical evidence allows multiple mappings.
  *   **Push-Off:** If physical evidence allows multiple mappings, positing a hidden fact looks like magic without a mechanism.

  **Leaf 4: Meaning Skepticism**
  *   **Names:** Kripke, Wittgenstein.
  *   **Awkward Commitment:** You must deny there is any fact about what you mean now, requiring a non-factual solution to rule-following.
  *   **Push-Off:** This threatens to make all intentional content illusory, which is too high a price for most realists.

  **Leaf 5: Ontological Relativity**
  *   **Names:** Quine.
  *   **Awkward Commitment:** You must accept reference is only meaningful relative to a background manual, not absolutely.
  *   **Push-Off:** It feels intuitive that when I say "rabbit," I mean rabbit absolutely, not just relative to a translation scheme.

  **Leaf 6: Internalism**
  *   **Names:** Chomsky, Fodor.
  *   **Awkward Commitment:** You must accept meaning is in the head, disconnected from external objects in the world.
  *   **Push-Off:** It struggles to explain how we talk about specific external objects (like water or gold) distinct from our internal concepts.

  **Leaf 7: Direct Reference**
  *   **Names:** Kripke, Putnam, Burge.
  *   **Awkward Commitment:** You must accept speakers can refer to things they cannot describe or identify internally.
  *   **Push-Off:** It makes meaning opaque to the speaker, violating the intuition that we know what we mean.

  **Leaf 8: Triangulation**
  *   **Names:** Davidson.
  *   **Awkward Commitment:** You must accept a solitary speaker cannot have determinate thoughts or meaning.
  *   **Push-Off:** It seems plausible that a Robinson Crusoe could think determinate thoughts before meeting Friday.

  **Leaf 9: [Unoccupied]**
  *   **Names:** None.
  *   **Diagnosis:** Unattractive. Translation of others without social constraint or physical fixity leaves no ground for correctness.
  *   **Push-Off:** N/A.

  ---
  *Note for Students: Leaves 4 and 5 are closely related. Both deny a fact of the matter given physical facts. They separate on whether this denial destroys normative psychology (Leaf 4) or allows relativization (Leaf 5).*
