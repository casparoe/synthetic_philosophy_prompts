          *   Explain that the proportional rule treats the *risk* as the harm. The all-or-nothing rule treats the *death* as the harm.
      *   **Section 2: Policy vs. Metaphysics (Underdetermination).**
          *   Address the "deterrence/fairness" question. Yes, you can argue policy without metaphysics.
          *   *Key Insight:* Law is often "as if." It acts *as if* agents have free will or chances are real, even if determinism is true, because that's what makes the system work.
      *   **Section 3: Preference for Actual Outcomes.**
