      *   *Essentialism intuition:* People naturally think in essentialist terms. We want clear boundaries. Changing the boundary feels like changing reality, not just words. It disrupts the "language game" of childhood education and cultural shared knowledge.

  6.  **Address the Tension: Science vs. Language Games:**

      *   *Science's Goal:* Precision, predictive power, distinct categories for modeling.
      *   *Wittgenstein's Goal:* Describing how language is actually used in everyday life.
      *   *The Clash:* Science often *stipulates* definitions to make progress (operationalism). Wittgenstein describes *existing* usage.
      *   *Can they match?* Yes, but with caveats. Science creates *technical* language games. The IAU created a new rule for a specific game (planetary science). The public plays a different game (cultural/astronomical literacy).
      *   *Does Pluto disprove Family Resemblance?* No. It shows that when a category becomes scientifically critical, we often *force* it into essentialism to make it useful. But the *resistance* to that force shows the underlying family resemblance nature of the common concept.

