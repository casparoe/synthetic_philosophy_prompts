answer: |-
  This specification maps the theoretical landscape of metaphysical grounding. It is structured to separate the "Moorean facts" (data any theory must accommodate) from the theoretical commitments (ways of explaining that data). I have flagged which desiderata are widely treated as constitutive of the concept (non-negotiable) and which represent specific metaphysical camps.

  ---

  ### I. The Phenomenological Data (Standard Test Cases)
  Any theory of grounding must accommodate the intuitive judgments about specific metaphysical dependencies. These are the "input data" for the theory.

  **1. The Conjunction Case**
  *   **Requirement:** A conjunction ($P \land Q$) must be grounded in its conjuncts ($P$ and $Q$).
  *   **Motivation:** It is metaphysically opaque why $P \land Q$ is true unless we cite the truth of $P$ and the truth of $Q$. The whole depends on the parts.
  *   **Direction:** Parts $\to$ Whole.

  **2. The Disjunction Case**
  *   **Requirement:** A true disjunction ($P \lor Q$) must be grounded in its true disjunct(s).
  *   **Motivation:** If $P$ is true, $P \lor Q$ is true *because* $P$ is true. The truth of the disjunction is not a further fact over and above the truth of the disjunct.
  *   **Direction:** Disjunct $\to$ Disjunction.

  **3. The Existential Case**
  *   **Requirement:** An existential generalization ($\exists x Fx$) must be grounded in its instances ($Fa$).
  *   **Motivation:** There are no "free-floating" existentials. That something is $F$ is grounded in the specific object $a$ being $F$.
  *   **Direction:** Instance $\to$ Existential.

  **4. The Determinable/Determinate Case**
  *   **Requirement:** Typically, the determinate (Scarlet) must ground the determinable (Red).
  *   **Motivation:** The object is red *in virtue of* being scarlet. Being scarlet is a specific way of being red; the specific fixes the general.
  *   **Note:** This is contested. Some theories (e.g., certain versions of priority monism or specific accounts of laws) reverse this, but a theory must explicitly account for why the standard intuition holds or why it is mistaken.
  *   **Direction:** Determinate $\to$ Determinable.

  **5. The Set-Theoretic Case**
  *   **Requirement:** A singleton set $\{a\}$ is grounded in its member $a$.
  *   **Motivation:** The set exists and has its members *in virtue of* the existence of the member. (Contested by those who view sets as fundamental, but a dominant datum).
  *   **Direction:** Member $\to$ Set.

  ---

  ### II. Logical and Formal Constraints
  These constraints govern the logic of the grounding relation. Some are treated as definitional; others are substantive metaphysical theses.

  **1. Hyperintensionality (Non-Negotiable)**
  *   **Requirement:** Grounding must distinguish between necessarily equivalent truths. $A$ can ground $B$ even if $A$ and $B$ are true in all the same possible worlds.
  *   **Motivation:** Consider "2+2=4" and "$\emptyset$ has no members." Both are necessary truths. If grounding were just necessary entailment, they would ground each other. But it is false that numbers exist *in virtue of* sets (or vice versa). Grounding tracks *structure* and *content*, not just modal profile.
  *   **Status:** **Non-Negotiable.** If a theory collapses grounding into modality (e.g., strict implication), it is generally considered to have changed the subject.

  **2. Irreflexivity (Strong Consensus)**
  *   **Requirement:** Nothing grounds itself ($\neg(A \prec A)$).
  *   **Motivation:** Grounding is a relation of *dependence*. If $A$ depends on $A$, the dependence is vacuous. It collapses the distinction between the grounded and the ground.
  *   **Status:** **Near Non-Negotiable.** Some coherentists argue for reflexivity in specific contexts, but this is a minority view that requires explaining away the standard intuition of priority.

  **3. Asymmetry (Strong Consensus)**
  *   **Requirement:** If $A$ grounds $B$, then $B$ does not ground $A$.
  *   **Motivation:** Grounding imposes a direction or order. If $A$ and $B$ mutually ground each other, there is no priority, which undermines the "in virtue of" locution.
  *   **Status:** **Near Non-Negotiable.** Like irreflexivity, denying this moves toward metaphysical coherentism.

  **4. Transitivity (Contested)**
  *   **Requirement:** If $A$ grounds $B$, and $B$ grounds $C$, then $A$ grounds $C$.
  *   **Motivation:** Dependence seems to "flow." If the mental is grounded in the physical, and the physical is grounded in the quantum, the mental is grounded in the quantum.
  *   **Status:** **Camp-Specific.** Some argue transitivity fails in cases of "structural" grounding or when the *kind* of grounding changes (e.g., full vs. partial). Denying transitivity allows for layered realities that don't collapse into the bottom layer.

  **5. Well-Foundedness (The Major Fault Line)**
  *   **Requirement:** There are no infinite descending chains of grounding. Every grounded fact must ultimately terminate in an ungrounded (fundamental) fact.
  *   **Motivation:** Without a foundation, reality lacks a "bottom." If everything is grounded in something else, nothing is ever fully explained (the "turtles all the way down" worry).
  *   **Status:** **Camp-Specific.** This is the divide between **Metaphysical Foundationalists** (Schaffer, Fine) and **Non-Foundationalists** (Infinitists like Bliss, Coherentists). Insisting on this rules out all infinitist and coherentist theories.

  ---

  ### III. Metaphysical Status and Scope
  These desiderata concern the nature of the relation itself and its place in our ontology.

  **1. Grounding vs. Explanation (The Connection)**
  *   **Requirement:** The theory must specify the link between worldly grounding and epistemic explanation.
  *   **Motivation:** We use grounding claims to explain things ("The glass broke *because* it was struck").
  *   **Option A (Backing):** Grounding is a worldly relation that *makes true* explanatory claims. (Fine, Schaffer). Grounding is distinct from explanation; one is metaphysical, the other representational.
  *   **Option B (Identity):** Grounding *is* metaphysical explanation. (Audi, Bliss). There is no "worldly relation" over and above the explanatory connection.
  *   **Status:** **Camp-Specific.** This determines whether grounding is a primitive relation in the world or a feature of our theoretical discourse.

  **2. Unity vs. Plurality (Generalism vs. Varietism)**
  *   **Requirement:** The theory must state whether "grounding" is a single generic relation or a family of specific relations (causal, nomological, set-theoretic, etc.).
  *   **Motivation:** Is the "in virtue of" in "The set exists in virtue of its member" the *same* relation as "The action is wrong in virtue of its consequences"?
  *   **Option A (Generalism):** There is one strict partial order of grounding. Specific cases are just determinate forms of the generic relation. (Schaffer).
  *   **Option B (Varietism):** "Grounding" is a placeholder for various distinct dependency relations. There is no generic grounding. (Wilson).
  *   **Status:** **Camp-Specific.** Generalism offers theoretical unity but risks being too abstract. Varietism captures nuances but risks fragmentation.

  **3. The Grounding of Grounding Facts (The Regress)**
  *   **Requirement:** The theory must specify what grounds facts of the form "$A$ grounds $B$".
  *   **Motivation:** If grounding is a real relation, facts about that relation obtain. Do they obtain *in virtue of* something?
  *   **Option A (Always Grounded):** Grounding facts are themselves grounded (e.g., in the essences of the relata). (Rosen).
  *   **Option B (Ungrounded):** Grounding facts are brute. They are the "structural glue" that is not itself glued. (Dasgupta).
  *   **Status:** **Camp-Specific.** This is the primary source of formal tension (see below).

  ---

  ### IV. Incompatibilities and Tensions
  You requested a clear layout of tensions, specifically regarding the formal properties and the grounding of grounding facts.

  **The "Rosen/Dasgupta" Tension Triad**
  There is a known tension between three plausible claims. A theory cannot jointly satisfy all three without significant complication.

  1.  **Formal Strictness:** Grounding is Irreflexive, Asymmetric, and Transitive.
  2.  **Universal Grounding:** All grounding facts are themselves grounded (No brute grounding facts).
  3.  **Well-Foundedness:** There are no infinite descending chains of grounding.

  **The Argument:**
  *   Assume (2): The fact $[A \text{ grounds } B]$ is grounded in some fact $C$.
  *   Assume (1) (Transitivity): If $C$ grounds $[A \text{ grounds } B]$, and $[A \text{ grounds } B]$ implies a connection between $A$ and $B$, does $C$ ground $B$?
  *   More critically, if *every* grounding fact is grounded (2), and chains cannot go on forever (3), there must be a **fundamental layer of grounding facts** that are *ungrounded*.
  *   But (2) says there are *no* ungrounded grounding facts.
  *   **Result:** You must drop one.
      *   Drop (3): Accept infinitism about grounding facts.
      *   Drop (2): Accept that some grounding facts are brute (Dasgupta's "autonomous facts").
      *   Drop (1): Deny transitivity to block the chain from becoming problematic (some argue the ground of a grounding fact does not ground the original grounded fact).

  **The "Explanation" Tension**
  *   **Claim:** Grounding is identical to Explanation.
  *   **Claim:** Grounding is a worldly relation (mind-independent).
  *   **Tension:** Explanation is typically pragmatic and interest-relative (what explains something to you might not explain it to me). Grounding is typically taken to be objective (it doesn't depend on us).
  *   **Resolution:** You cannot have grounding be *both* fully interest-relative (like explanation) and fully mind-independent (like a worldly relation). You must choose: either grounding is worldly (and merely *backs* explanation) or grounding is a species of explanation (and is not a "heavyweight" worldly relation).

  ---

  ### V. Classification of Desiderata
  To help you take a position, here is the breakdown of what is required vs. what is optional.

  | Desideratum | Status | Consequence of Rejection |
  | :--- | :--- | :--- |
  | **Hyperintensionality** | **Non-Negotiable** | You are no longer theorizing about grounding; you are theorizing about modality/entailment. |
  | **Irreflexivity/Asymmetry** | **Near Non-Negotiable** | You move from Foundationalism to Coherentism. You lose the "priority" aspect of grounding. |
  | **Standard Test Cases** | **Non-Negotiable** | You must either accommodate these (conjunctions, existentials, etc.) or provide an error theory explaining why our intuitions are wrong. |
  | **Transitivity** | **Camp-Specific** | Rejecting this allows for "layered" metaphysics where higher levels are not directly grounded in the fundamental base. |
  | **Well-Foundedness** | **Camp-Specific** | Rejecting this allows for Infinitism (reality has no bottom layer). |
  | **Unity of Grounding** | **Camp-Specific** | Rejecting this (Varietism) avoids the difficulty of finding a common genus for all dependency relations. |
  | **Grounding Facts Grounded** | **Camp-Specific** | Rejecting this (Ungrounded Grounding) stops the regress but leaves the structure of reality partially brute. |

  ---

  ### VI. The Most Restrictive Requirement
  If you insist on one requirement, which rules out the largest number of otherwise viable theories?

  **The Requirement: Well-Foundedness.**

  **Why:**
  While Hyperintensionality is the *definitional* gatekeeper (ruling out modal accounts), **Well-Foundedness** is the most restrictive *structural* constraint on viable metaphysical systems.

  1.  **It Rules Out Infinitism:** A significant and growing camp (e.g., Ricki Bliss, Jessica Wilson in some moods) argues that reality need not have a fundamental layer. Insisting on well-foundedness declares their entire research program incoherent *by fiat*.
  2.  **It Forces Fundamentalism:** It compels the theorist to identify a "fundamental layer" (particles, fields, the cosmos, etc.). This forces an ontological commitment that many contemporary metaphysicians wish to avoid (e.g., those who prefer ontological free lunches or coherentist webs).
  3.  **It Creates the "Brute Fact" Dilemma:** As shown in the Tension Triad above, if you demand Well-Foundedness, you are forced to either accept that some grounding facts are brute (violating the Principle of Sufficient Reason for structural facts) or deny Transitivity. It forces a choice between two other major theoretical virtues.

  **Comparison:**
  *   If you drop **Hyperintensionality**, you aren't doing grounding.
  *   If you drop **Unity**, you can still do grounding (just pluralistically).
  *   If you drop **Well-Foundedness**, you can still do grounding (infinitistically).
  *   **But:** If you *insist* on **Well-Foundedness**, you eliminate Infinitism, Coherentism, and any view that posits infinite ontological descent. Given that the debate between Foundationalists and Non-Foundationalists is the single largest fault line in contemporary analytic metaphysics, this requirement does the most work to narrow the field of *metaphysical systems* compatible with your theory of grounding.

  **Recommendation for Mapping:**
  Start by accepting **Hyperintensionality** and the **Standard Test Cases** (these define the game). Then, treat **Well-Foundedness** as your primary variable. Your position on Well-Foundedness will determine your stance on the Grounding of Grounding, the necessity of a fundamental layer, and the acceptability of infinite regresses. This is the most efficient way to locate your position in the landscape.
