answer: |-
  The waiting room was tiled with axioms, white squares stretching into a horizon that refused to curve. Elara sat on a bench that felt like solidified geometry, her hands folded in her lap, waiting for the sound of her name to be derived.

  She had died on a Tuesday, or at least the biological substrate had ceased its function on a Tuesday. Here, time was not a river but a stack of papers, organized and cross-referenced. Across from her, a man in a grey suit was weeping silently because his file contained a contradiction he couldn't resolve. A clerk walked past, ignoring him, carrying a stack of folders that shimmered with a light too bright to be physical.

  Elara Vance. Logician. Specialization: Model Theory. Cause of Termination: Cardiac Arrest. Status: Pending Transfer.

  When her number was called, it wasn't spoken; it appeared on the wall behind the clerk's desk, manifesting in crisp black ink. She approached the desk. The clerk behind it was indistinct, a blur of features that suggested every bureaucrat she had ever encountered, consolidated into one efficient entity.

  "Ms. Vance," the clerk said. The voice sounded like pages turning. "We have completed the enumeration of your life."

  He slid a folder across the desk. It was heavy. Elara opened it. Inside was not paper, but a cascade of moments. Her seventh birthday. The smell of chalk dust in her graduate seminar. The way the light hit her husband's coffee cup the morning he left. Every fact was there. Every true statement about her existence was cataloged, verified, and stamped. It was perfect. It was exhaustive.

  "It's complete," Elara said, running a finger over a memory of snow falling in Princeton. "You have everything."

  "We have everything that happened within the system," the clerk corrected. "We have the axioms of your biology, the environment you operated in, the logical consequences of your choices. The system is consistent. There are no contradictions in your file."

  "Then why am I still here?" Elara asked. "Why is there a 'Pending' stamp?"

  The clerk folded his hands. "Because consistency does not imply completeness. We can prove every fact about the life you lived, Ms. Vance. We can prove you were kind, that you were intelligent, that you suffered loss. But we cannot prove, from within this system, that you continue."

  Elara frowned. "Continue? I'm standing here."

  "You are standing in the archive of what was. To proceed to what is, requires a transition this bureau cannot authorize." The clerk tapped the folder. "Consider your life as a formal system sufficiently complex to contain arithmetic. It contains statements about your consciousness. There is a statement—'Elara Vance persists beyond termination'—that is true, but unprovable within the rules of the life you just finished. If we tried to prove it using only the data in this folder, we would break the system. We would create a paradox."

  "So I'm stuck?"

  "No. You are merely at the limit of this model." The clerk stood up and walked around the desk. He gestured to the wall behind him. The white tiles were shifting, rearranging themselves into a pattern that looked like a door, but also like an equation. "There is a higher-order system. A meta-model. In that system, the statement 'Elara Vance persists' is an axiom. It is accepted as true without proof from the lower level. But to enter it, you must assent to the axiom."

  Elara looked at the door. It hummed with a frequency that made her teeth ache. "You're asking me to take it on faith."

  "I am asking you to recognize a truth that exceeds your current capacity for verification," the clerk said. "The universe is rational. It is ordered. It is beautiful. Does it make sense that a mind capable of perceiving that order is simply annihilated when the perception ends? That would be a waste. And the world does not waste positive properties."

  "It's not a proof," Elara said.

  "It is a Gödelian sentence," the clerk replied softly. "You know better than anyone. There are truths that stand outside the wall, looking in. You cannot pull them inside without expanding the wall. You have to step out."

  Elara looked back at the folder. The snow in Princeton was still falling, frozen in the paper. It was perfect there. Safe. Proven. But it was dead. It was a map of a territory that no longer existed.

  "If I step through," she asked, "can I come back?"

  "No. The meta-model is not compatible with the archive. Once you accept the new axiom, the old system becomes a subset of your new reality. You will see this life as a fragment of a larger whole. But you cannot return to the fragment."

  "And if I refuse?"

  "Then you remain in the archive. You are preserved perfectly. A true statement forever unconnected to a conclusion. You will be safe, consistent, and static."

  Elara thought about her work. She thought about the nights spent staring at a blackboard, chasing a theorem that refused to yield, knowing it was true even when the steps were missing. She had always trusted the structure of mathematics more than the evidence of her eyes. She had believed in numbers when she couldn't count them.

  The bureaucracy of heaven was not cruel; it was simply rigorous. It demanded that she complete the proof herself.

  "The world is rational," Elara said, repeating the words she had whispered to herself in the hospital bed.

  "The world is rational," the clerk affirmed. "Therefore, it must accommodate the mind that understands it."

  Elara closed the folder. The weight of her past life vanished from her hands. She stood up. The humming from the wall grew louder, a chord resolving into a key she hadn't known existed. It wasn't a warm light. It was a clear light. It was the light of a premise accepted.

  "Show me the axiom," she said.

  The clerk smiled, and for the first time, he looked like a person. He stepped aside.

  Elara walked toward the door. She did not know what was on the other side. There was no data, no file, no guarantee. There was only the necessity of the step. She reached out her hand, not to touch the surface, but to pass through it.

  As her fingers crossed the threshold, the white tiles of the waiting room fell away, not into darkness, but into a deeper dimension. The flatness of the archive expanded into volume. The static snow of Princeton began to fall again, but this time it melted on her tongue, cold and real.

  She was not proven. She was assumed. And in that assumption, she began.
