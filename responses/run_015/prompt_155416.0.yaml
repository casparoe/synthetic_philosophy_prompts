  **BENTHAM COLLEGE OF FELICIFIC COMPLIANCE**
  **INTERNAL CIRCULAR 7(b): PRELIMINARY ESTIMATE OF FELICIFIC RETURN (SEXUAL)**
  **REF: PANOPTICON STATUTES §4.2 | CLEARANCE: ALL STAFF**

  **1. PURPOSE AND SCOPE**
  1.1. Pursuant to the College's mandate to maximise the aggregate happiness of the constituency, all Staff intending to embark upon romantic or sexual engagements must submit this Form prior to the commencement of said acts.
  1.2. The practical question is settled by arithmetic. Once the Net Felicific Balance is calculated, the moral status of the act is determined. Speculation regarding virtue, sin, or natural law is superseded by the Calculus.
  1.3. Staff are reminded that the Auto-Icon in the lobby observes all submissions for consistency.

  **2. THE FELICIFIC CALCULUS**
  2.1. Pleasures and Pains must be quantified across seven dimensions: Intensity, Duration, Certainty, Propinquity, Fecundity, Purity, and Extent.
  2.2. **Exclusions:** Claims based on "Unnaturalness," "Delicacy," or "Offence to Persons of a Particular Persuasion" shall be assigned a Weighting of 0.0. Such objections derive from the Principle of Sympathy and Antipathy rather than observable harm. *Ipse-dixitism* is not a valid pain metric.
  2.3. **Consent:** In instances where Consent is not universal among participants, the Pain of Coercion is entered as a fixed constant (Value: 999). While the Calculus reduces all sensation to quantity, Staff are reminded that Non-Consensual acts generate Pain of such magnitude that no subsequent Pleasure may offset it. The spreadsheet is a thin vessel for this gravity, but the sum remains absolute.
  2.4. **Sanctions:** The Moral Sanction (reputation, gossip, disapproval) constitutes real Pain. If the act becomes public, expected reputational damage must be entered under 'Extent'.

  **3. SCORING TABLE**

  | Dimension | Weighting (0-10) | Pleasure (+) | Pain (-) | Net |
  | :--- | :---: | :---: | :---: | :---: |
  | **Intensity** | 1.0 | | | |
  | **Duration** | 1.5 | | | |
  | **Certainty** | 1.2 | | | |
  | **Propinquity** | 1.1 | | | |
  | **Fecundity** | 1.3 | | | |
  | **Purity** | 1.4 | | | |
  | **Extent** | 2.0 | | | |
  | **Moral Sanction** | 2.5 | N/A | (See Cl. 2.4) | |
  | **TOTAL** | | | | **BALANCE** |

  **4. WORKED EXAMPLES**

  **Example A: The Mutually Enjoyed Fling vs. The Dutiful Union**
  *Subject A proposes a brief liaison with no expectation of continuity. Subject B proposes a lifelong marital contract devoid of affection.*
  *   **Fling:** Scores high on Intensity (8.0) and Purity (9.0). Low on Duration (2.0). Net Balance: +45.5.
  *   **Marriage:** Scores low on Intensity (2.0) and Purity (3.0). High on Duration (9.0). Net Balance: +12.4.
  *   **Determination:** The Fling is approved. The Marriage is discouraged as inefficient. Duty without pleasure is a fictitious good.

  **Example B: The Impact of the Moral Sanction**
  *Subject C proposes an act identical to Example A, but within a community known to harbour antipathy toward such acts.*
  *   **Scenario 1 (Public):** Act is known. Moral Sanction Pain (Gossip/Ostracisation) entered as -50.0. Net Balance: -4.5.
  *   **Scenario 2 (Concealed):** Act remains private. Moral Sanction Pain is 0.0. Net Balance: +45.5.
  *   **Determination:** In Scenario 1, the act is prohibited. In Scenario 2, the act is approved.
  *   **Recommendation:** To maximise happiness, Staff are advised to proceed only under Conditions of Strict Secrecy. Scheduling should avoid peak gossip hours (typically Sundays). Concealment is not deceit; it is mitigation of external pain vectors.

  **5. COMPLIANCE NOTES**
  5.1. Forms must be laminated and deposited in the Lobby Box.
  5.2. Self-regarding acts where the only sanction is self-approbation require only Form 7(c) (Admonition).
  5.3. See also Circular 9(d) regarding *Post-Coital Recalibration*.

  **APPROVED BY:** *The Office of Felicific Arithmetic*
  **DATE:** *14th Vendémiaire, Year 240*
  **STATUS:** *Mandatory*
