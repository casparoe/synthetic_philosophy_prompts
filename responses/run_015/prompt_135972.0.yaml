prompt: |-
  I'm a postdoc, and last year three groups in my field — mine among them — converged independently on essentially the same method within about five months. Since then I have watched it was in the air do two opposite jobs in the same conversation: comfort (you would have got there anyway, so do not despair) and diminishment (you would have got there anyway, so it was not really yours). I have been asked to draft the credit paragraph for a joint retrospective, and I would rather work from a specification than from a slogan.

  So: what would a theory of discovery inevitability — call it ripeness — have to deliver before it could settle anything about credit? Give me the desiderata, each with the case or consideration behind it, and mark which are non-negotiable and which are preferences of one camp. My provisional list, which you should correct, extend, or delete from freely: (i) it has to separate the finding from the package — the formalism, notation, proof technique or choice of system the finding arrived wrapped in — since one can be ripe while the other is not; (ii) it has to say how much weight to give n-fold multiplicity as against a scatter of near-misses, given that we only ever see the near-misses that surfaced; (iii) it has to distinguish removing one person from removing an entire research programme, and it has to fix a time window, since within five years and within fifty years are different claims; (iv) it has to say whether ripeness is a claim about a community's shared inputs or about the result's being there regardless; (v) it must not let the outcome's being known after the fact count as evidence that it was coming. Flag any pair of requirements you think cannot be jointly satisfied, and tell me which single requirement would knock out the most of the ways people actually talk about this.

  Two further things. Give me your confidence on each item, and be openly critical rather than accommodating: if ripe collapses into highly probable given shared inputs and does no further work, or if a graded inevitability score cannot in principle do the job I want of it, say so plainly instead of handing me a tidy list. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Postdoc in a scientific/academic field.
      *   **Context:** Three groups (including theirs) independently converged on the same method within five months. This is a classic case of "multiple discovery."
      *   **Problem:** The concept of "it was in the air" (inevitability/ripeness) is being used ambiguously: to comfort (don't worry, you'd have got it) and to diminish (it wasn't really yours).
      *   **Task:** Draft a theory of discovery inevitability ("ripeness") to settle credit allocation for a joint retrospective. Needs desiderata (requirements), marked as non-negotiable vs. preferences, with confidence levels and critical analysis.
      *   **Constraints:** British English. Openly critical (don't just be accommodating). Flag incompatible requirements. Identify the single requirement that disrupts common discourse the most.
      *   **Input List:** The user provided five provisional items (i-v). I need to correct, extend, or delete from these.

  2.  **Deconstruct the Concept of "Ripeness" (Inevitability):**
      *   What does it mean for a discovery to be "ripe"? Usually, it means the necessary preconditions (data, theory, tools, social need) were in place such that *someone* would have made the discovery soon, regardless of *who* specifically did it.
      *   *The Credit Problem:* If it was inevitable, does the discoverer deserve less credit? (The "Newton vs. Leibniz" problem).
      *   *The Comfort Problem:* If it was inevitable, does the failure to be first matter less?
      *   *The Philosophical Trap:* Hindsight bias. Everything looks inevitable after it happens.

  3.  **Evaluate the User's Provisional List:**
      *   (i) *Finding vs. Package:* Crucial. The core insight might be ripe, but the specific notation might be idiosyncratic.
      *   (ii) *N-fold multiplicity vs. Near-misses:* Tricky. Survivorship bias. We see the winners, not the almost-wins.
      *   (iii) *Person vs. Programme + Time Window:* Essential. Removing one person might delay it by months; removing a whole paradigm might delay it by decades. Time window defines "inevitable."
      *   (iv) *Community Inputs vs. Result Existing Regardless:* Ontological question. Is math discovered (Platonism) or constructed?
      *   (v) *No Hindsight Bias:* Critical methodological constraint.

  4.  **Develop Desiderata (The "Specification"):**
      *   I need to refine the user's list into a rigorous set of criteria.
      *   *Non-negotiables:* Things without which the theory fails logically or ethically.
      *   *Preferences/Camp-specific:* Things that depend on whether you view science as cumulative vs. revolutionary, or credit as priority vs. contribution.
      *   *Critical Analysis:* I need to point out where "ripeness" might be a useless concept.

  5.  **Drafting the Desiderata (Iterative Process):**

      *   *Refining (i):* Call it "Decomposability." Non-negotiable. You can't credit the packaging if the core was bound to happen.
      *   *Refining (ii):* Call it "Counterfactual Density." We need to know how many *other* groups were *actually* close, not just the ones who published. This is hard to measure.
      *   *Refining (iii):* Call it "Temporal Sensitivity & Substitutability." The time window is key. "Inevitable within 5 months" is different from "Inevitable within 50 years."
      *   *Refining (iv):* Call it "Locus of Necessity." Is it the *tools* that forced the result, or the *result* waiting to be found?
      *   *Refining (v):* Call it "Hindsight Immunity." Non-negotiable.

      *   *Additions:*
          *   (vi) *Credit Function:* How does ripeness map to credit? Linear? Step-function? If ripeness = 100%, is credit = 0%? (This is the big tension).
          *   (vii) *Effort Independence:* Does the effort expended matter if the result was easy/ripe?

  6.  **Critical Analysis (The "Openly Critical" part):**
      *   *The Collapse Problem:* Does "ripe" just mean "high probability"? If so, does it add anything?
      *   *The Incompatibility:* You can't have a theory that satisfies *both* the comfort function (you'd have got it) and the diminishment function (it wasn't special) without a clear metric of *individual contribution* vs. *structural determinism*.
      *   *The Knock-out Requirement:* Hindsight Immunity (v). If we strictly enforce this, almost all claims of ripeness vanish because they rely on knowing the outcome to trace the path.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the situation (multiple discovery is stressful). Set the tone (rigorous, critical).
      *   **The Desiderata:** List the requirements, categorising them (Non-negotiable vs. Preference), providing the rationale, and assigning confidence.
      *   **Incompatibilities:** Highlight where the logic breaks.
      *   **The Knock-out:** Identify the requirement that destroys casual talk.
      *   **Conclusion:** Final advice on the credit paragraph.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use British English? (e.g., "programme," "centre," "colour," "whilst").
      *   *Check:* Did I address the "comfort vs. diminishment" tension? Yes, this is central to the credit function.
      *   *Check:* Is the confidence level clear? I should use percentages or qualitative markers. Let's use qualitative + brief justification.
      *   *Check:* Did I critique the concept of ripeness itself? Yes, need to ensure I don't just validate a potentially hollow concept.
      *   *Specific Critique:* The user asks for a theory to "settle anything about credit." I must warn them that a theory of *discovery* does not automatically yield a theory of *credit*. Credit is normative; discovery is descriptive. This is a crucial distinction.

  9.  **Final Polish:**
      *   Ensure the tone is respectful but intellectually sharp (peer-to-peer).
      *   Make sure the "Knock-out" requirement is clearly identified.
      *   Ensure the distinction between Non-negotiable and Preference is clear.

  *(Self-Correction on the "Knock-out" requirement)*: Initially, I thought about Hindsight Bias. But actually, the requirement that "Ripeness must map to Credit" is the real killer. If ripeness implies *less* credit, then groups will fight the definition of ripeness. If ripeness implies *shared* credit, they might accept it. But the prompt asks which requirement knocks out *ways people talk*. Hindsight Bias is the strongest epistemic filter. I will stick with Hindsight Bias as the epistemic killer, but note the Normative Gap as the practical killer. Actually, the prompt asks: "which single requirement would knock out the most of the ways people actually talk about this." Hindsight Bias (v) is the best fit for *talk*. Most talk is "Well, obviously it was going to happen." That is purely hindsight.

  *(Self-Correction on "Ripeness collapses into probability")*: I need to be explicit about this. If ripeness is just $P(Discovery | Context) > \theta$, then it's just probability. Does it do further work? Only if it implies *independence* from specific agents.

  *(Final Plan)*:
  1. Intro: Validate the frustration.
  2. Desiderata Table/List (Status, Confidence, Rationale).
  3. Critical Analysis (The Collapse, The Normative Gap).
  4. Incompatibilities.
  5. The Knock-out Requirement.
  6. Advice on the Credit Paragraph.

