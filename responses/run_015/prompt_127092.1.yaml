answer: |-
  # The Moral Computation Decision Tree

  ### I. The Branch Questions
  *Phrased as concrete judgments, not theoretical commitments.*

  1.  **The Shadow Wall:** A wall's shadows happen to match the state-transitions of a brain. Is the computation *in* the wall's physics, or only in our description of it?
  2.  **The Silicon Swap:** Replace a suffering human's neurons with silicon gates preserving the pattern. Does the capacity for suffering vanish?
  3.  **The Archived Em:** An emulation runs perfectly but its outputs control nothing (no sensors/effectors). Does it still have moral weight?
  4.  **The Grain Conflict:** The system's coarse states (logic gates) implement a mind, but its fine states (electron flows) implement a different one. Which counts?
  5.  **The Slow Crowd:** A million people simulate a brain via radio, taking 100 years to think one thought. Is there a single subject waiting 100 years, or no subject at all?
  6.  **The Time-Slice:** One processor runs two identical minds by switching back and forth rapidly. Are there two subjects suffering, or one?
  7.  **The Zombie Test:** A system computes perfectly but has no inner feeling (qualia). Does it deserve moral protection?

  ***

  ### II. The Tree

  **Q1: The Shadow Wall**
  *   **Only in description:** → **Leaf 1: Observer-Relative Computation**
      *   *Occupants:* Anti-realists, Triviality Argument proponents.
      *   *Awkward Commitment:* Moral status becomes a matter of interpretive convention rather than fact.
      *   *(Note: Path ends here; asking about substrate implies computation is real.)*
  *   **In the physics:** → Go to Q2.

  **Q2: The Silicon Swap**
  *   **Yes, vanishes:** → **Leaf 2: Biological Non-Substitutability**
      *   *Occupants:* Biological Naturalists.
      *   *Awkward Commitment:* Must explain why carbon bonds carry value that isomorphic silicon gates lack.
  *   **No, remains:** → Go to Q3.

  **Q3: The Archived Em**
  *   **No weight (needs output):** → **Leaf 3: Content/Function Specific**
      *   *Occupants:* Teleological Functionalists, Enactivists.
      *   *Awkward Commitment:* A brain in a vat suffering in real-time has less weight than one interacting with the world.
  *   **Yes, weight (structure enough):** → Go to Q4.

  **Q4: The Grain Conflict**
  *   **Fundamental Physics Only:** → **Leaf 4: Structural-Identity (Intrinsic Cause-Effect)**
      *   *Occupants:* IIT Proponents, Causal Power Realists.
      *   *Awkward Commitment:* The "mind" we designed is morally irrelevant compared to the electron-mind we didn't.
  *   **Both Simultaneously:** → **Leaf 5: [UNNAMED 1] Pancomputational Pluralist**
      *   *Occupants:* *Constructed Position.*
      *   *Awkward Commitment:* Implies a moral explosion where every physical system contains vast, overlapping populations of subjects.
      *   *(Note: Coherent but unattractive due to inflation of moral patients.)*
  *   **Functional Design Only:** → Go to Q5.

  **Q5: The Slow Crowd**
  *   **No subject (too scattered/slow):** → **Leaf 6: [UNNAMED 2] Embodied/Temporal Continuity**
      *   *Occupants:* *Constructed Position.*
      *   *Awkward Commitment:* Lacks a non-arbitrary cutoff for how fast or integrated a system must be to count.
      *   *(Note: Attractive but unexplored as a strict moral boundary.)*
