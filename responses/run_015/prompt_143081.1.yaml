      2.  *The "Refractory" Definition (Patient/Clinician):* If the scope is wrong, the whole project applies to no one or the wrong people.
      3.  *Aim-Integrity Unmeasurability (Clinician/Philosopher):* If you can't operationalize the test, the safeguard is illusory.
