answer: |-
  You are bumping up against the hard boundary of the "Modularity of Mind" debate, specifically the contention between **Encapsulated Vision** (Pylyshyn/Firestone & Scholl) and **Cognitive Penetration** (Churchland/Clark). Your intuition is correct: the "it's just judgment" defense is often a motte-and-bailey used to protect the classical computational view of perception (Input → Processing → Output) from the more modern **Predictive Processing** view (Prediction → Error Correction → Perception).

  In the Predictive Processing framework (which fits your rationalist background), perception *is* controlled hallucination constrained by sensory input. Your brain is constantly guessing what's out there and only updating when the guess mismatches the data. Therefore, "learning changing what things look like" isn't a bug or a special exception; it is the standard operating procedure. The "blur" was your brain's low-confidence prediction; the "crisp eye-ring" is a high-confidence prior that suppresses the noise.

  Here is the shape of the thing, the classification of your three cases, and the coinage you requested.

  ### 1. The Classification: Which cases are the same?

  Your three cases are not one phenomenon. They are three distinct mechanisms of how top-down information interfaces with bottom-up signal.

  **Case A: The Warbler (Perceptual Learning / Feature Tuning)**
  *   **Mechanism:** This is **Perceptual Learning**. It is structural. By attending to warblers, you have physically retuned the gain on specific feature detectors in your visual cortex. You aren't just labeling a blur "warbler"; your brain has stopped treating the eye-ring as noise and started treating it as a signal.
  *   **Relationship to Case 3:** This is the *same* phenomenon as your **De-enrichment (Case 3)**, just the flip side. Expertise is compression. To see the warbler crisply, your brain must aggressively down-weight the "irrelevant" background leaves and other bird calls. The undergrad sees the mush because their priors are flat; you see the bird because your priors are spiky. You are both seeing the same data, but your error-correction algorithms are discarding different chunks of it as "noise."
  *   **Verdict:** This is **not** Cognitive Penetration in the strict philosophical sense. It is bottom-up rewiring caused by past top-down attention. It is permanent(ish) calibration, not online belief.

  **Case B: The Friend's Face (Affective Hysteresis)**
  *   **Mechanism:** This is **Affective Priming with Inertia**. When you believed the rumor, your brain updated its "Friend" model to include "Threat." This likely changed how you scanned her micro-expressions (looking for confirmation). When the belief was retracted, the *semantic* belief updated instantly, but the *affective* calibration (the somatic marker attached to her face) decayed slowly.
  *   **Verdict:** This is distinct from the Warbler. The Warbler case is about *clarity*; this case is about *valence*. It feels like perception because the emotional tag is applied pre-consciously. However, because it outlasted the belief, it suggests the mechanism wasn't "current belief penetrating vision" but rather "belief created a habit that now runs autonomously." It's a ghost in the machine, not the machine itself.

  **Case C: The Provenance/Mimic (Evaluative Penetration)**
  *   **Mechanism:** This is the only case that qualifies as true **Cognitive Penetration**. The acoustics are identical. The low-level feature detection hasn't changed (you hear the same frequencies). Yet, the *phenomenal character* of the experience shifts. The sound loses "weight" or "authenticity."
  *   **Verdict:** This is the interesting one. It is not about feature detection (Warbler) or emotional habit (Face). It is about high-level semantic properties (native vs. introduced, real vs. mimic) bleeding into the qualitative experience of the sensation.

  ### 2. How to tell "Seeing Differently" from "Judging Differently"

  Your friend claims you are just "more willing to say the words." The standard philosophical counter-argument is the **Cognitive Load Test**.

  *   **The Test:** Perform the task (identify the bird / listen to the call) while simultaneously holding a heavy working-memory load (e.g., memorizing a 7-digit number, or tapping a complex rhythm).
  *   **The Logic:** Judgment and labeling require working memory. Low-level perception does not.
  *   **The Result:** If the "crispness" of the warbler or the "hollowness" of the mimic disappears when your working memory is clogged, it was judgment. If the effect persists despite your brain being busy elsewhere, it is perceptual.
  *   **The "Unseeing" Test (which you already did):** The Duck-Rabbit test is valid. If you *cannot* voluntarily revert to the naive state despite knowing the truth, it indicates the processing has happened below the level of voluntary control. Judgment is reversible; perceptual flips are often sticky.

  ### 3. Coining the Term for the Provenance Case

  The subset where *value, origin, or normativity* changes the *qualia* of the sensation (without changing the features) does not have a universally agreed-upon single word, though it is discussed in aesthetics as "aesthetic properties" or in ethics as "thick concepts."

  I propose the term: **Semantic Staining**.

  **Definition:** Semantic Staining occurs when high-level conceptual knowledge (provenance, authenticity, moral status) alters the phenomenal quality of a sensory experience, independent of feature detection or emotional valence.

  **Why "Staining"?** It captures the idea that the raw data is transparent, but the meaning acts as a dye through which the data is viewed. The light passing through is the same; the color is different.

  **Boundary Cases (Where Semantic Staining stops):**

  1.  **The Association Boundary:** If hearing the mimic makes you *think* "fake" and feel disappointed, but the sound itself sounds identical to the real bird, that is **Association**, not Staining. Staining requires the *sound itself* to feel thinner, cheaper, or less substantial.
      *   *Tweak:* If you can say "I know this is a mimic, it sounds exactly like the real one, I just don't like it," Staining is absent. If you say "It sounds *hollow* compared to the real one," Staining is present.
  2.  **The Attention Boundary:** If knowing a bird is invasive makes you *ignore* its call, that is **Attentional Gating** (your Case 3).
      *   *Tweak:* If you stop hearing the call entirely, it's Gating. If you hear the call clearly but it sounds "wrong" or "lesser," it's Staining.
  3.  **The Expectation Boundary:** If you expect a mimic to sound bad, and therefore interpret ambiguity as badness, that is **Bias**.
      *   *Tweak:* If the sound is ambiguous and you resolve it as "bad," that's Bias. If the sound is acoustically perfect but *still* feels "lesser" solely due to the label, that's Staining.

  ### Summary of the Shape

  You are experiencing the collapse of the sensation/perception/cognition hierarchy.

  *   **Warbler/De-enrichment:** Your brain has optimized its compression algorithm. (Perceptual Learning)
  *   **Face:** Your brain's emotional calibration has lagged behind your factual update. (Affective Hysteresis)
  *   **Provenance:** Your brain is integrating semantic truth conditions into the sensory render. (**Semantic Staining**)

  The "friend" who says it's just vocabulary is operating on a camera model of the eye (light hits sensor, image forms). You are operating on a renderer model of the eye (engine predicts scene, textures applied based on priors). In a renderer, changing the metadata of an object *can* change the shader applied to it. That is what you are seeing.
