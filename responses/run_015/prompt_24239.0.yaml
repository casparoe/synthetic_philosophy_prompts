answer: |-
  Your nagging feeling is well-founded. The blog post you read contains a mixture of accurate high-level intuition, technical imprecisions, and one critical logical error that reverses the actual reasoning behind UDT.

  This is a common problem with pop-explanations of decision theory: they often sacrifice the mechanism for the sake of a soundbite ("delete the update step!"), which leads to the exact confusion you are experiencing.

  Here is a breakdown of the post's claims, categorized by how a proponent of Updateless Decision Theory (UDT) would view them, followed by an analysis of the claim regarding "real decisions."

  ### 1. "UDT is a decision theory that says you shouldn't update your beliefs once you've observed the world."
  **Verdict: Subtle Mischaracterization (The "Elevator Pitch" Trap)**

  *   **Why it feels right:** UDT is called "Updateless" because it evaluates decisions based on your **prior** probabilities (what you believed before you started) rather than your **posterior** probabilities (what you believe after seeing evidence).
  *   **Why it's misleading:** It sounds like UDT agents ignore sensory data. They do not. A UDT agent still "sees" the world. The difference is *when* the optimization happens.
      *   **Standard Theory (CDT/EDT):** You observe the world $\rightarrow$ Update beliefs $\rightarrow$ Choose the best action *now*.
      *   **UDT:** Before you observe anything, you choose a **policy** (a function that maps every possible observation to an action) that maximizes expected utility according to your *prior*. Then, when you observe the world, you simply execute the policy.
  *   **Correction:** You don't delete the step where you process information. You delete the step where you *re-evaluate your strategy* based on that information. You stick to the plan you would have made if you knew you'd end up in this situation, even if the new information makes the plan look suboptimal in the moment.

  ### 2. "Treat your decision process as a function and ask what the expected outcome would be if that function output a particular action."
  **Verdict: Mostly Accurate**

  *   **The Good:** This captures the core technical shift of UDT. Standard decision theories select an **action**. UDT selects a **policy** (the function itself).
  *   **The Nuance:** It's not asking "what if this function output a particular action *this one time*?" It is asking "what if this function was defined to output Action A in Situation X and Action B in Situation Y?" It optimizes the whole mapping, not just the local output. This is crucial for handling logical correlations (like predictors).

  ### 3. "The predictor is trying to guess what you'll do, but since you're just a deterministic function, it can't really predict you..."
  **Verdict: Plain Wrong**

  *   **The Error:** This is the most damaging sentence in the summary. It reverses the logic of Newcomb's Problem.
  *   **The Reality:** In Newcomb's Problem (and UDT logic), the predictor can predict you *precisely because* you are a deterministic function (or at least logically correlated). If you were truly unpredictable (random), the predictor would guess at chance, and the million dollars would likely not be in the box.
  *   **UDT Logic:** UDT one-boxes because it recognizes that its decision and the predictor's simulation are **logically linked**. If the UDT agent's source code says "one-box," the simulation says "one-box," so the money is there. If the code says "two-box," the simulation says "two-box," so the money is gone.
  *   **Correction:** The blog post implies unpredictability helps you win. UDT argues that *recognizing your own predictability* is what allows you to win.

  ### 4. "...so you one-box and pocket the million dollars."
  **Verdict: Accurate Conclusion**

  *   UDT does one-box. It gets the million. But as noted above, the reasoning provided in the post to get there was flawed.

  ### 5. "Basically, UDT is standard Bayesian decision theory with the belief-updating step deleted."
  **Verdict: Subtle Mischaracterization**

  *   **Why it's used:** It's a handy mnemonic.
  *   **Why it's dangerous:** As with Claim 1, this suggests the agent acts blindly. A better summary is: "UDT is Bayesian decision theory where you optimize your **policy** from the perspective of your **prior**, rather than optimizing your **action** from the perspective of your **posterior**."
  *   **Key Distinction:** In standard theory, if you learn you are in a "losing" branch of the universe, you might change your behavior to cut losses. In UDT, if your pre-commitment said "stay the course even in the losing branch," you stay the course, because deviating would have lowered the expected utility of the policy *before* you knew which branch you were in.

  ---

  ### Does the claim "UDT is only useful for Newcomb-type problems" follow?

  The blog post claims UDT is useless for real decisions. **This conclusion depends entirely on the distorted parts of the summary, not the accurate ones.**

  Here is why:

  **1. If you believe the distortion (that UDT ignores information):**
  If you think UDT literally means "don't update on evidence," then yes, the theory seems useless for real life. In the real world, if you see a car coming, you update your belief and step out of the way. If you refused to update, you'd get hit. So, under the *mischaracterization*, UDT is indeed only for weird philosophical puzzles.

  **2. If you understand the actual theory (Policy Selection):**
  UDT proponents argue it is **critical** for real decisions, specifically in the context of AI Alignment and advanced agency. Here is why:

  *   **Precommitment and Credibility:** Real agents (especially AIs) need to make credible threats and promises. If an agent updates on new information to renege on a deal because it's no longer locally optimal, other agents won't trust it in the future. UDT formalizes "sticking to your guns" when it is strategically necessary to have committed to doing so.
  *   **Logical Correlation (The "Real" Newcomb):** In AI alignment, we expect AIs to encounter other AIs that can simulate them or reason about their source code. This is not a sci-fi "Omega predictor"; it is standard software analysis. If your AI is negotiating with another AI that can read its code, that is a Newcomb-like problem. UDT is the decision theory that handles interactions where your decision influences the other party's decision via logical correlation, not just physical causation.
  *   **Self-Modification:** An AI that wants to self-modify to be more effective needs a decision theory that tells it *what* to modify into. CDT (Causal Decision Theory) agents often wish they could precommit but can't. UDT agents effectively act as if they have already precommitted to the optimal policy.

  ### Summary for your understanding

  To clear up your confusion, replace the blog post's mental model with this one:

  1.  **Don't think:** "UDT ignores data."
  2.  **Do think:** "UDT chooses a **strategy** before the game starts, rather than choosing a **move** after the game starts."
  3.  **The Newcomb Error:** The blog post claimed you win because you are unpredictable. The truth is you win because you acknowledge that your move and the predictor's move are **coupled**.
  4.  **Real World Utility:** The "Newcomb" scenarios aren't just boxes and demons; they are any situation where your decision procedure is visible to or simulated by other agents (common in AI safety, economics, and bargaining).

  The blog post failed because it tried to explain a **structural** change (Action Selection vs. Policy Selection) as a **procedural** change (Delete the update step). That simplification breaks the theory's actual utility.
