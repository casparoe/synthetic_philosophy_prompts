answer: |-
  This is a sophisticated pivot. You have identified that the standard defense of lexical-threshold views often hand-waves the transition point, and your "distributed-subthreshold" worry exposes a potential collapse point where the theory either becomes standard aggregative utilitarianism (if sub-threshold suffering aggregates fully) or becomes implausibly indifferent to mass mild suffering (if it doesn't).

  For a three-year pure philosophy agenda, you need to order these by **logical dependency** (upstreamness) and **fatalness** (if this fails, does the project end?). Tractability is secondary to logical priority; there is no point in solving a downstream implication for a theory that is axiomatically incoherent.

  Here is the ranking and reasoning for your research agenda.

  ### 1. The Commensurability & Threshold Coherence Problem
  **Rank:** First (The "Existence" Proof)
  **Reasoning:** Upstreamness & Fatalness

  This is the bottleneck. Your intuition is correct: a lexical threshold functions as a conversion rate. It says, "Any amount of Value B is worth less than *this specific amount* of Disvalue A." If A and B are truly incommensurable (different categories of value, like length and weight), no such threshold can exist without a category error.

  Most lexical views dodge this by assuming a single "welfare metric" where suffering just has a steeper slope. But if you claim they are *qualitatively* different (which motivates the lexicality in the first place), you lose the metric.

  *   **Why it's first:** If you cannot coherently define the threshold without presupposing the commensurability you deny, the theory is dead on arrival. You cannot solve the aggregation problem (Line 2) if the units being aggregated are undefined relative to one another.
  *   **Tractability:** Low. This is deep meta-axiology. However, it is the only place that justifies the three-year investment.
  *   **The Confidence-Moving Argument:** You need to determine if **lexicality requires cardinal comparability**.
      *   *Search for:* A formal proof that lexical priority implies a shared scale. If this exists, LTNU must abandon strong incommensurability claims.
      *   *Alternative:* A robust defense of "lexicality without comparability" (e.g., using Ruth Chang's notion of *parity* or a vagueness-based approach where the threshold is a sorites sequence rather than a line). If you can model the threshold as a zone of indeterminacy rather than a sharp cut-off, you might bypass the commensurability objection.
      *   *Hypothetical:* If you can construct a model where "Suffering > Threshold" is a binary state property rather than a magnitude comparison, you save the theory. If not, you must concede that LTNU is just a weighted view, not a lexical one.

  ### 2. The Distributed-Subthreshold Aggregation Asymmetry
  **Rank:** Second (The "Structure" Proof)
  **Reasoning:** Specificity & Theoretical Novelty

  Once (and only once) you have a defensible account of how the threshold functions, you must tackle your specific wrinkle. Standard lexical views assume that below the threshold, standard aggregation applies. Your insight is that suffering might have **non-linear aggregation properties** that pleasure lacks.

  *   **Why it's second:** This is logically downstream of Line 1 (you need to know *what* is aggregating), but it is the core of your specific contribution. If Line 1 is solvable, this is where the actual work lies. It determines whether LTNU collapses into Negative Utilitarianism (if sub-threshold suffering aggregates lexically against pleasure) or becomes implausible (if billions of mild headaches count for nothing against a single sublime joy).
  *   **Tractability:** Medium. This is fertile ground for thought experiments. It is more concrete than Line 1 because it deals with intuitive cases (dust specks vs. torture variants) rather than abstract value theory.
  *   **The Confidence-Moving Argument:** You need to test the **Independence Axiom**.
      *   *Search for:* A case where $N \times \text{Sub-Threshold Pain}$ clearly outweighs $M \times \text{Pleasure}$ in intuition, despite individual units being below the lexical cut-off.
      *   *Hypothetical:* If you can show that suffering is *super-additive* (the moral weight of 1 billion mild headaches is greater than the sum of their parts due to shared phenomenology or systemic risk) while pleasure is *sub-additive* or linear, you justify a distinct aggregation function. This would require revising the standard "threshold then aggregate" model to a "threshold + aggregation weight" model.
      *   *Risk:* If you find that sub-threshold suffering *must* aggregate linearly to avoid absurdity, LTNU loses its distinctive "negative" force and becomes a standard prioritarian view.

  ### 3. Downstream Implications (Population Ethics & Longtermism)
  **Rank:** Third (The "Stress Test")
  **Reasoning:** Derivative Nature

  I advise deprioritizing this for the first two years. Population ethics is where moral theories go to die, but it is also where they are least informative about *why* they died.

  *   **Why it's third:** This is entirely dependent on the outputs of Lines 1 and 2. If you don't know if the threshold is coherent (Line 1) or how sub-threshold units aggregate (Line 2), you cannot calculate the value of future populations. Working on this now is building a roof before the foundation is poured.
  *   **Tractability:** High. It is easier to generate *reductio ad absurdum* cases here than in axiology.
  *   **The Confidence-Moving Argument:** This is only useful as a **Reflective Equilibrium Check**.
      *   *Search for:* Does the settled view from Lines 1 & 2 imply the "Sadistic Conclusion" (creating miserable lives is better than creating happy ones) or extreme anti-natalism?
      *   *Why Deprioritize:* If your theory implies we should extinguish humanity to prevent sub-threshold suffering, that is a bullet many negative utilitarians are willing to bite. It doesn't necessarily falsify the axiology; it just clarifies the cost. Solving Line 1 or 2 might automatically resolve the population ethics puzzles, but solving the population ethics puzzles will not fix the axiology.

  ### Strategic Advice for the Three Years

  **Year 1: The Threshold Mechanism (Line 1)**
  Do not try to solve "commensurability" broadly. Focus narrowly on the **threshold mechanism**. Is it a magnitude? A qualitative state? A vague boundary?
  *   *Goal:* Produce a formal or semi-formal model of the threshold that does not presuppose a single cardinal metric. If you fail here, the project pivots to "Weighted Negative Utilitarianism" and ends.

  **Year 2: The Aggregation Function (Line 2)**
  Assuming Year 1 yields a viable model, test the distributed-subthreshold problem.
  *   *Goal:* Determine if suffering requires a non-linear aggregation function. If yes, formalize the "Suffering Aggregation Curve." This is your novel contribution.

  **Year 3: Stress Testing (Line 3)**
  Apply the Year 1 & 2 model to population cases.
  *   *Goal:* Check for *reductios*. If the theory demands extinction, decide if that is a feature or a bug. This is where you write the final defense or the final critique.

  **Summary of Deprioritization:**
  Do not spend significant time on Line 3 until Line 1 is stable. There is a vast literature on lexical prioritarianism in population ethics (e.g., Blackorby, Bossert, Donaldson), but engaging with it now is premature. Their models assume a coherent threshold; your project is questioning whether that assumption holds. Engaging with them before solving Line 1 is arguing about the furniture in a house that may not have walls.
