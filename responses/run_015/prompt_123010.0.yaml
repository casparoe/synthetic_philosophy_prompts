      *   *Exclusionary Requirement:* **Downstream Stakes.** This kills the simple Knowledge Norm (Williamson) because one can know $P$ but not be permitted to assert if the stakes for a third party are life-or-death (contextualism/pragmatic encroachment). It also troubles the Truth Norm.

