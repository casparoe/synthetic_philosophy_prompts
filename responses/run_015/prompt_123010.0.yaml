          3.  Downstream stakes (low for speaker/audience, high for third party).
          4.  Assertion to no one (no uptake possible).
          5.  Collective assertion (no single mind).
          6.  Contested truth-aptness (moral, aesthetic, legal).
      *   **Final Analysis:** Identify one pair of requirements that might be in tension (cannot be jointly satisfied) and one single requirement that excludes the most attractive candidates.
