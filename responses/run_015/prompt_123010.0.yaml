      *   *Hearer Acquisition:* If I tell you $P$, what do you get? Usually, a reason to believe, or a guarantee, or a transfer of warrant. The norm needs to explain why the hearer is entitled to rely on the assertion.
      *   *Institutional Obligation:* When a CDC or Government says $P$, what do they owe? Accuracy? Transparency? Justification? The norm needs to scale from individuals to bodies.

  3.  **Drafting the Desiderata (incorporating distinctions and cases):**

      *   *Distinction 1: Sincerity vs. Warrant.* A speaker can believe $P$ (sincere) but lack evidence (unwarranted). The norm must govern the *right* to assert, not just the psychological state.
      *   *Distinction 2: Defective Act vs. Blameworthy Speaker.* I can assert improperly without being morally culpable (e.g., misleading evidence). The norm evaluates the *move*, not the *agent*.
      *   *Distinction 3: Constitutive vs. Regulative.* Is assertion *defined* by the norm (like chess moves) or just regulated by it (like driving)? Given the "institutional" requirement, a constitutive element seems strong, but maybe not strictly Searle-style.
      *   *Case: Hedging.* "I think P" vs "P". The norm must explain why hedging changes the normative status.
      *   *Case: Disavowal.* "P, but I don't know P." Infelicitous. The norm must explain this clash.
      *   *Case: Downstream Stakes.* "The bridge is safe" (said casually to a friend, but a stranger overhears and drives). The norm must account for responsibility beyond the immediate dyad.
      *   *Case: No Audience.* Diary entry or shouting into the void. Is it assertion? The norm must handle the "uptake" requirement from the Core Purpose.
      *   *Case: Collective.* "The Company asserts..." No single mind to have knowledge/belief. The norm must accommodate distributed epistemic states.
      *   *Case: Contested Content.* "Murder is wrong." Is this true? The norm shouldn't presuppose robust realism if it's to cover these cases.

  4.  **Categorizing Requirements:**

      *   *Non-Negotiable:* Must serve the Core Purpose (Hearer/Institution), handle the Distinctions (Sincerity/Warrant, Act/Agent, Constitutive/Regulative), and cover the critical Cases (Downstream, Collective, Disavowal).
      *   *Negotiable:* Specific formulations (e.g., "Knowledge" specifically), whether the norm is purely internalist or externalist.
      *   *Mere Prejudice:* Unity (single rule), Truth-Aptness presuppositions, Individualism (ignoring collectives).

