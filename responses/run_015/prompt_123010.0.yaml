answer: |-
  # Specification for the Norm of Assertion

  ## I. Fixed Purpose
  Before evaluating candidate norms (Knowledge, Truth, Reasonable Belief, etc.), the functional role of the norm is fixed. The norm is not merely a description of linguistic practice; it is a theoretical tool intended to underwrite two specific downstream accounts:

  1.  **The Account of Uptake:** It must explain what a hearer acquires when a statement is made (e.g., a right to rely, a transfer of warrant, or a guarantee).
  2.  **The Account of Institutional Obligation:** It must explain what public bodies (governments, corporations, scientific bodies) owe the public when they issue statements, scaling the norm from individual minds to collective agents.

  Any candidate norm that cannot serve these two masters is disqualified, regardless of its intuitive fit with ordinary conversation.

  ---

  ## II. Desiderata List

  ### A. Structural Distinctions
  *The theory must preserve these conceptual boundaries.*

  1.  **Sincerity vs. Warrant**
      *   **Requirement:** The norm must distinguish between a speaker who believes what they say (sincere) and a speaker who is entitled to say it (warranted).
      *   **Consideration:** A sincere speaker may rely on superstition; a warranted speaker may rely on evidence they do not personally believe (e.g., a press secretary reading a verified report). A norm collapsing these (e.g., pure Belief Norm) cannot explain why we challenge unwarranted sincere assertions.
  2.  **Defective Act vs. Blameworthy Speaker**
      *   **Requirement:** The norm must allow that an assertion can be impermissible (defective) without the speaker being morally culpable (blameworthy).
      *   **Consideration:** If a speaker asserts $P$ based on misleading but overwhelming evidence, the assertion may be improper (if $P$ is false or unknown) but the speaker is not blameworthy. A norm that ties permissibility strictly to moral blame fails to capture the *epistemic* governance of the act.
  3.  **Constitutive vs. Regulative**
      *   **Requirement:** The theory must specify whether the norm defines the act of assertion (constitutive) or merely governs an act that exists independently (regulative).
      *   **Consideration:** If constitutive, violating the norm means one hasn't truly asserted (like moving a bishop diagonally in chess). If regulative, one can assert improperly (like driving recklessly). Given the **Institutional Obligation** purpose, the norm must have constitutive force for institutions (issuing a statement *counts* as taking on an obligation), even if it is merely regulative for individuals.

  ### B. Empirical Coverage (The Cases)
  *The theory must accommodate the normative intuitions surrounding these scenarios.*

  4.  **Hedged vs. Unhedged Assertion**
      *   **Requirement:** The norm must explain the difference in commitment between "P" and "I think P."
      *   **Consideration:** Hedging reduces the speaker's liability. The norm must account for how the strength of the norm scales with the strength of the commitment.
  5.  **The Disavowal Intuition (Moorean Paradox)**
      *   **Requirement:** The norm must explain the infelicity of asserting $P$ while explicitly disavowing the normative status required for $P$ (e.g., "P, but I don't know P").
      *   **Consideration:** This is the primary data point for the Knowledge Norm. Any competing norm must explain why this sounds contradictory or improper without simply stipulating that knowledge is the norm.
  6.  **Downstream Stakes**
      *   **Requirement:** The norm must account for cases where stakes are low for the speaker/audience but high for a third party who might overhear and act.
      *   **Consideration:** Telling a friend "The bridge is safe" casually is permissible in low stakes. If a stranger overhears and drives a heavy load across, the speaker may be held responsible. The norm must explain how permission is sensitive to consequences beyond the immediate dyad.
  7.  **Assertion to No One**
      *   **Requirement:** The norm must determine if an utterance counts as an assertion when no hearer is present to acquire anything (e.g., a diary entry, a shout into a void).
      *   **Consideration:** Given the **Account of Uptake** purpose, the norm must clarify if the *capacity* for uptake is sufficient, or if actual uptake is required. If the norm is purely about hearer acquisition, solitary assertion becomes problematic.
  8.  **Collective Assertion**
      *   **Requirement:** The norm must apply to agents that lack a single mind or biological cognitive states.
      *   **Consideration:** Institutions issue statements. They cannot "believe" or "know" in the human sense. The norm must be formulable in terms of *informational states* or *procedural warrant* rather than purely psychological states.
  9.  **Contested Truth-Aptness**
      *   **Requirement:** The norm must function for moral, aesthetic, or legal claims where truth is philosophically contested.
      *   **Consideration:** When a court asserts "The defendant is liable," or a critic asserts "This is kitsch," they operate under norms of assertion. A norm presupposing robust realism (e.g., correspondence to fact) may exclude these domains from the scope of assertion, undermining the **Institutional Obligation** purpose (since courts are paradigmatic asserters).

  ---

  ## III. Categorization of Requirements

  ### Non-Negotiable
  *Demands any viable theory must meet to satisfy the Fixed Purpose.*
  1.  **Downstream Stakes Sensitivity:** To satisfy the **Institutional Obligation** purpose, the norm must account for responsibility to the public, not just the immediate interlocutor. Institutions are liable for downstream effects of their guidance.
  2.  **Collective Scalability:** To satisfy the **Institutional Obligation** purpose, the norm cannot rely on properties exclusive to biological minds (e.g., phenomenal belief).
  3.  **Sincerity/Warrant Distinction:** To satisfy the **Account of Uptake**, the hearer must be able to rely on the *warrant*, not just the speaker's psychology.
  4.  **Contested Content Coverage:** To satisfy the **Institutional Obligation** purpose (covering courts, legislatures, ethics boards), the norm cannot presuppose a specific metaphysics of truth.

  ### Negotiable
  *Features a theory might sacrifice, provided it compensates elsewhere.*
  1.  **Constitutivity:** A theory could treat the norm as purely regulative if it can still explain the *force* of institutional statements through other means (e.g., social contract).
  2.  **Assertion to No One:** A theory could rule that solitary utterances are not assertions, provided it explains why they *feel* like assertions (e.g., as simulated dialogue).
  3.  **Disavowal Infelicity:** A theory could treat Moorean paradoxes as pragmatic rather than semantic violations, provided it explains the strength of the intuition.

  ### Mere Prejudice
  *Demands often made by specific camps that no theory should have to grant.*
  1.  **Unitary Rule:** The demand that there be *one* single rule (e.g., "Know that P") for all contexts. A hybrid or context-sensitive norm is permissible if it handles the data better.
  2.  **Knowledge Formulation:** The demand that the norm be phrased in terms of "Knowledge." This begs the question against Truth or Justification norms.
  3.  **Individualism:** The demand that the norm apply only to individual epistemic agents. This is incompatible with the Fixed Purpose regarding institutions.

  ---

  ## IV. Critical Analysis

  ### The Suspected Incompatibility
  **Pair:** **Constitutivity** vs. **Downstream Stakes Sensitivity**.

  *   **The Tension:** If the norm is *constitutive* of assertion, it defines what the act *is*. Constitutive rules are typically invariant (a bishop moves diagonally regardless of the stakes of the game). However, the **Downstream Stakes** requirement suggests that the permissibility of an assertion shifts based on external consequences unknown to the speaker (the stranger on the bridge).
  *   **The Conflict:** If the stakes change the permission conditions, does the *act type* change? If the norm is sensitive to downstream stakes, it looks regulative (governing the consequences of the act) rather than constitutive (defining the act). Satisfying the **Institutional Obligation** purpose (which demands stakes sensitivity) may force us to abandon the idea that the norm is strictly constitutive of the speech act itself, treating it instead as a constitutive norm of *public trust* that regulates assertion.

  ### The Most Exclusionary Requirement
  **Single Requirement:** **Collective Scalability**.

  *   **Why:** This requirement does the most work to exclude otherwise attractive candidates, specifically the **Knowledge Norm** and the **Belief Norm**.
  *   **The Exclusion:** Standard epistemic norms are psychologistic. They require a subject to stand in a specific relation (knowing, believing) to a proposition. Collectives (corporations, states) do not have minds; they do not "know" or "believe" in the literal sense.
  *   **Impact:** To satisfy this, a candidate norm must be reformulated in terms of *procedural justification*, *informational access*, or *authorized representation*. The classic Knowledge Norm ("Assert P only if you know P") fails outright unless "you" and "know" are metaphorically stretched to the breaking point. The Truth Norm fares slightly better (statements can be true regardless of who makes them), but fails the **Sincerity/Warrant** distinction. This requirement forces a move from *epistemic* norms to *institutional/informational* norms.

  ---

  ## V. Brief Touch on Familiar Norms (Failure Modes Only)

  *   **The Knowledge Norm:** Fails **Collective Scalability** (institutions don't know) and struggles with **Downstream Stakes** (one can know $P$ but be impermissible to assert if downstream risk is catastrophic).
  *   **The Truth Norm:** Fails **Sincerity vs. Warrant** (allows accidental truth-telling to count as proper assertion) and fails **Disavowal** (it is not infelicitous to say "P is true but I don't know it" in many contexts, yet "P but I don't know P" remains odd).
  *   **The Reasonable Belief Norm:** Fails **Downstream Stakes** (reasonable belief is often insufficient for high-stakes institutional guidance) and fails **Contested Truth-Aptness** (what is "reasonable" in moral aesthetics is less clear than in empirical domains).
  *   **The Credence/Probability Norm:** Fails **Hedged vs. Unhedged** distinctions (hard to map specific credence thresholds to binary assertion without losing the categorical force of the act).

  *Scoring is left to the user.*
