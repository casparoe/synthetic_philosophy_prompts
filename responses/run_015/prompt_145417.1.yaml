      *   Separate trivial vs. substantive? Yes.
      *   Flag false/collapsing ones? Yes.
      *   Menu with verdicts? Yes.
      *   JSON summary with specific fields? Yes.

  8.  **Final Polish:** Ensure tone is helpful for a writer (focus on subtext and character motivation). (Self-correction: Ensure the JSON is valid syntax).

