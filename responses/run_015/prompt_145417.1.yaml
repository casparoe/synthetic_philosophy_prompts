prompt: |-
  Im drafting a novel scene where an aging profesor keeps saying "Weber proved culture is an independant cause" every time someone mentions coal deposits or trade routes. I want the line to do real philosophical work, not just sound authoritative, so can you break down the precise claims hiding inside that slogan? Separate the trivial ones—like beliefs motivate people—from the substantive theses about values having causal autonomy, flag which ones are false or just collapse back into material explanations, and tell me which reading actually lets him dismiss economic history versus which ones secretly depend on it. Lay the readings out as a menu with verdicts: platitude, defensible, or false. Then summarize after in a JSON object with these fields: slogan_reading, core_claim, verdict, supports_anti_materialism (true/false/partial), dialogue_notes.
