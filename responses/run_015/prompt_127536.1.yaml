answer: |-
  The slogan "Kelly maximizes long-run growth" is a compressed theorem, not a universal commandment. Your reading group is treating a specific mathematical result as a normative axiom of rationality, ignoring the boundary conditions under which the theorem holds.

  Here is the disambiguation of the slogan, followed by an analysis of how the 10% floor breaks the standard Kelly logic.

  ### Part 1: Disambiguating the Slogan

  The claim "Kelly maximizes long-run growth" can be unpacked into at least five distinct theses. They differ in what is being maximized, the time horizon, and the class of competing strategies.

  | Thesis | Quantity Supposedly Maximized | Truth Status | Platitude or Substantive? | Does it license "Irrational"? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Expected Log-Wealth** | $E[\log(W_n)]$ for finite $n$. | **True** (by definition). | **Platitude.** This is how the Kelly fraction is derived. | **No.** Maximizing $E[\log W]$ is a specific utility choice. A risk-neutral agent maximizing $E[W]$ (betting 100%) is not irrational, just different. |
  | **2. Asymptotic Growth Rate** | $\lim_{n \to \infty} \frac{1}{n} \log(W_n/W_0)$ almost surely. | **True** (Breiman, 1961). | **Substantive.** Requires proof that log-utility maximization converges to pathwise dominance. | **No.** "Almost surely" allows for paths where you go bust before the limit kicks in. If you have a finite lifespan or constraints, the limit is irrelevant. |
  | **3. Median Wealth** | The median of the wealth distribution at time $n$. | **Approx. True.** | **Substantive.** For multiplicative processes, the geometric mean (Kelly) tracks the median closely. | **No.** Maximizing the median ignores the upper tail. An agent preferring a skewed payoff (small chance of huge win) is not irrational. |
  | **4. Probability of Profit** | $P(W_n > W_0)$ for fixed $n$. | **False.** | **Substantive.** Kelly often *minimizes* this probability in the short run compared to fractional Kelly. | **No.** If your goal is "don't lose money this quarter," Kelly is often the *wrong* tool. Betting less increases $P(\text{profit})$. |
  | **5. Strategy Dominance** | $P(W_n^{\text{Kelly}} > W_n^{\text{Other}}) \to 1$ as $n \to \infty$. | **True** (for "essentially different" strategies). | **Substantive.** Kelly wealth eventually exceeds any other strategy with probability 1. | **No.** "Eventually" is doing all the work. You can be dominated asymptotically but outperform for any relevant human horizon. |

  **Verdict on "Irrationality":** None of these theses license the claim that non-Kelly betting is *irrational*. They only show that non-Kelly betting sacrifices *asymptotic geometric growth* to achieve other objectives (higher probability of short-term profit, lower risk of ruin, higher arithmetic expectation). Calling this "irrational" is a category error: it conflates a specific optimization goal with rationality itself. The "volatility tax" argument is valid only if your sole utility function is log-wealth without constraints.

  ---

  ### Part 2: The 10% Floor Constraint

  The introduction of a hard floor at 10% of *starting* bankroll ($W_{\text{floor}} = 0.1 W_0$) fundamentally alters the optimization problem. The standard Kelly derivation assumes a constraint only at $W=0$ (handled by the log singularity), but it does not account for an absorbing barrier at a positive wealth level relative to the start.

  Here is how the floor interacts with the optimal strategy:

  #### 1. Does it leave the optimal constant fraction unchanged?
  **No.** Even if you restrict yourself to the class of *constant-fraction* strategies, the optimal fraction $f$ drops below the standard Kelly fraction of 20%.

  *   **Reasoning:** Standard Kelly maximizes the drift of the random walk on log-wealth. However, with a hard floor, the objective function is no longer just the drift; it includes the probability of hitting the absorbing barrier.
  *   **The Mechanism:** With $f=0.2$, a loss multiplies wealth by $0.8$. To breach the 10% floor, you need a sequence of roughly 11 consecutive losses ($0.8^{11} \approx 0.085$). While the probability of this in a single trial is low ($\approx 4 \times 10^{-5}$), over a long horizon, the probability of encountering such a drawdown sequence approaches 1.
  *   **The Cost:** If hitting the floor yields a payoff of 0, the expected log-utility of any strategy with a non-zero ruin probability is technically $-\infty$ over an infinite horizon. Even over a finite horizon, the *risk* of ruin imposes a penalty on expected utility. To maximize expected utility subject to the constraint, you must reduce variance to widen the "safety margin" between your current wealth and the floor. Thus, the optimal constant $f$ is strictly less than 0.2.

  #### 2. Does it make the optimal stake state-dependent?
  **Yes.** The optimal strategy is no longer a fixed fraction of current wealth; it becomes a function of the ratio $W_t / W_{\text{floor}}$.

  *   **Reasoning:** The problem is not homogeneous in wealth. In standard Kelly, the optimal fraction depends only on the edge and odds, which are constant. Here, the "distance to ruin" changes as wealth fluctuates.
  *   **The Control:** As $W_t$ grows large relative to $W_{\text{floor}}$, the constraint becomes irrelevant, and the optimal fraction converges to the standard Kelly fraction (20%). As $W_t$ approaches $W_{\text{floor}}$, the marginal cost of a loss increases discontinuously (from "lower utility" to "game over").
  *   **Mathematical Intuition:** This is a stochastic control problem with an absorbing boundary. The value function $V(W, t)$ satisfies a Hamilton-Jacobi-Bellman equation with a boundary condition $V(W_{\text{floor}}, t) = -\infty$ (or 0 payoff). The solution requires the control variable (bet size) to vanish as the state approaches the boundary.

  #### 3. In which direction does it push someone close to the floor?
  **It pushes you to bet less (de-leverage).**

  *   **Near the Floor:** If your bankroll is at 11% of starting value, you are one bad streak away from elimination. The "volatility tax" is now compounded by a "ruin tax." The rational move is to reduce $f$ significantly, potentially to zero, to ensure survival.
  *   **The "Rationality" Reversal:** Your reading group claims that betting less than Kelly is "paying a volatility tax for nothing." In the presence of the floor, betting *full* Kelly is actually paying a "ruin tax" (a high probability of hitting the floor before the asymptotic growth kicks in). Reducing your stake is not paying a tax for nothing; it is purchasing *survival insurance*.

  ### Summary for Your Group

  You can offer this precise correction to the discussion:

  1.  **The Slogan:** "Kelly maximizes long-run growth" is a theorem about **unconstrained asymptotic limits**. It is true, but it is not a normative axiom of rationality for finite agents with constraints.
  2.  **The Floor:** The 10% floor introduces a **non-zero probability of ruin** for any constant-fraction strategy, including standard Kelly.
  3.  **The Optimization:** Because the payoff at the floor is zero, the expected utility of standard Kelly is degraded by the risk of absorption. The mathematically optimal response to a hard floor is a **state-dependent strategy** that reduces bet size as wealth approaches the floor.
  4.  **The Verdict:** Betting less than 20% is not "irrational"; it is the **rational adaptation to the boundary condition**. Those advocating for full Kelly are ignoring the constraint that defines the game.

  The "volatility tax" argument assumes the only cost of variance is reduced geometric growth. The floor adds a second cost: **termination**. Ignoring termination risk is the actual irrationality here.
