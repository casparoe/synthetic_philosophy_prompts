answer: |-
  ### Q&A Preparation Sheet

  **Strategy Overview**
  *   **Concede in Opening:** The Hume novelty claim (frame as development, not rupture) and the role of Philosophy in Part VI (acknowledge it exists but argue it is elitist/rare).
  *   **Must-Land Reply:** The mechanism of Calibration Asymmetry (why resentment dampens but admiration amplifies).
  *   **Hope Nobody Asks:** "If the mechanism guarantees corruption, is Smith a moral skeptic?"
  *   **Volunteer Weakness:** The textual evidence for "upward calibration" is thinner than for "downward calibration."

  ---

  ### Objections and Replies (Ordered by Damage)

  **1. The Contractualist Ethicist (Normative Standpoint)**
  *   **Objection:** "If the impartial spectator is just internalized actual spectators, and actual spectators are biased by rank, you've stripped Smith of any normative standpoint from which to criticize his own society. You're left with descriptive sociology, not moral theory. How can Smith call sentiments 'corrupt' if the only measure of corruption is the very mechanism producing them?"
  *   **Reply:** "That's the exact tension I'm highlighting. Smith isn't offering a transcendent Archimedean point; he's diagnosing a structural failure within sentimentalism itself. The judgment of 'corruption' comes from the friction between the 'man within'—which strives for consistency—and the actual spectators who demand rank-admiration. Smith criticizes society not from outside, but from the strain internal consistency places on social compliance. It's an immanent critique, not a contractualist one."
  *   **Weakness/Cost:** This risks making Smith's critique seem psychologically unstable rather than morally authoritative.

  **2. The Intellectual Historian (Natural Law/Teleology)**
  *   **Objection:** "Smith operates within a natural-law framework where nature intends propriety. You're arguing the mechanism *produces* corruption as a feature. That makes Smith a skeptic about nature's teleology, which contradicts his providential language. Are you turning Smith into a proto-Nietzschean?"
  *   **Reply:** "I'm not denying Smith's providentialism, but distinguishing between systemic outcomes and individual intentions. The 'invisible hand' passage shows beneficial *economic* outcomes from corrupt *moral* motives. Smith can believe nature aims at preservation while acknowledging the moral sentiments are distorted in pursuing it. The teleology is in the survival of the species, not the moral purity of the agents."
  *   **Weakness/Cost:** This divorces Smith's moral theory from his broader metaphysical commitments, which may look like cherry-picking.

  **3. The Contractualist Ethicist (The 'Man Within' Text)**
  *   **Objection:** "Smith explicitly distinguishes the 'man within the breast' from actual spectators. He says the former is the judge of the latter. Your bootstrapping argument collapses if the internal spectator is designed to correct the biases of the external one."
  *   **Reply:** "Smith says the man within is *formed* from actual spectators. My point is about acquisition: if the raw material is biased, the product inherits the bias unless there's a separate filtering mechanism. Smith describes the formation as internalization, not transformation. The 'judge' function exists, but it judges based on the standards it absorbed. It can strive for consistency, but not necessarily impartiality in the contractualist sense."
  *   **Weakness/Cost:** It requires reading Smith's distinction as functional rather than ontological, which some texts resist.

  **4. The Virtue Theorist (Self-Command)**
  *   **Objection:** "You dismiss self-command as circular, but for Smith, it's the master virtue that allows us to resist social pressure. If self-command doesn't work, what's the point of Part VI? You're rendering the culmination of the book inert."
  *   **Reply:** "Self-command moderates passion to the pitch the spectator approves. If the spectator approves of rank-admiration, self-command just makes you better at admiring rank. It ensures you don't overshoot the social norm, but it doesn't correct the norm itself. It's a virtue of social coordination, not necessarily moral correction in this specific context."
  *   **Weakness/Cost:** This redefines self-command in a way that might seem too narrow compared to Smith's broader praise of it.

  **5. The Moral Psychologist (Mechanism)**
  *   **Objection:** "Your asymmetry claim rests on a psychological mechanism: resentment dampens because bystanders feel less, admiration amplifies because they feel more. Where's the evidence? Couldn't bystanders also amplify resentment in a mob?"
  *   **Reply:** "Smith distinguishes between unsocial and social passions precisely on this communicability. Resentment is inherently isolating; bystanders fear becoming targets. Admiration is inherently shareable; it binds the group. Smith's text relies on this phenomenological difference. Mob resentment is an exception that proves the rule—it requires dehumanizing the target to become shareable."
  *   **Weakness/Cost:** Relies on Smith's psychology being empirically accurate, which opens you to modern counter-examples.

  **6. The Hume Specialist (Novelty)**
  *   **Objection:** "This sounds like Hume's 'steady and general point of view.' Hume already knows sentiments vary and need correction. What's the actual novelty here? You're overstating the break to sell the contribution."
  *   **Reply:** "Hume's steady point of view is a corrective lens the philosopher adopts. Smith's spectator is a social mechanism every agent uses constantly. Hume corrects sentiment from the outside; Smith shows how sentiment corrects itself from the inside—and fails. The novelty isn't that sentiments vary, but that the calibration procedure itself has asymmetric outcomes."
  *   **Weakness/Cost:** The distinction is subtle; a Hume expert might still see it as a variation on a theme.

  **7. The Historian of Economic Thought (Commerce)**
  *   **Objection:** "Smith is generally read as defending commercial society. You're arguing his moral theory predicts its corruption. Are you turning Smith into a critic of capitalism? That clashes with the Wealth of Nations narrative."
  *   **Reply:** "I'm not saying Smith rejects commerce. I'm saying he recognizes its moral costs. The 'invisible hand' passage admits the rich are motivated by vanity, not benevolence. Smith defends the *outcome* of commercial society, not the *virtue* of the agents within it. My reading explains how he can defend the system while lamenting the sentiments it requires."
  *   **Weakness/Cost:** Risks making Smith seem inconsistent between his two major works.

  **8. The Intellectual Historian (Philosophy/Stoics)**
  *   **Objection:** "Smith relies on philosophy and Stoicism to correct sentiments in Part VI. You say internal resources don't repair the problem. You're ignoring Smith's proposed solution."
  *   **Reply:** "I acknowledge philosophy as a remedy, but Smith treats it as rare and elitist. It's not a structural fix available to the moral mechanism itself. My claim is about the default operation of the spectator, not the exceptional case of the philosopher. The mechanism predicts corruption for the vast majority; philosophy is the exception that proves the rule."
  *   **Weakness/Cost:** Concedes that a solution exists, weakening the "no internal resources" claim slightly.

  ---

  ### Premise Check: Settled vs. Contested

  | Premise | Status | Hedging Required? |
  | :--- | :--- | :--- |
  | **IS as Calibration vs. Ideal Observer** | **Contested.** Many read IS as a normative ideal. | **Yes.** Frame as "I argue..." not "Smith shows..." |
  | **Concord of Sentiments Yields Pleasure** | **Settled.** Core textual claim in Part I. | **No.** Can state confidently. |
  | **Downward Calibration (Resentment)** | **Settled.** Smith explicitly discusses moderating resentment. | **No.** Textual support is strong. |
  | **Upward Calibration (Admiration)** | **Contested.** Interpretive leap regarding rank admiration. | **Yes.** Flag as "My reading suggests..." |
  | **Man Within Inheritance (Bootstrapping)** | **Contested.** Debate over origin of conscience. | **Yes.** Acknowledge alternative readings of Part VI. |
  | **Self-Command Circularity** | **Contested.** Virtue ethicists strongly disagree. | **Yes.** Frame as "On this specific issue..." |
  | **Invisible Hand (Unintended Consequences)** | **Contested.** Some read it as moral justification. | **Yes.** Clarify "beneficial outcomes, not moral validation." |
  | **Corruption as Structural Prediction** | **Contested.** Many see corruption as incidental/fixable. | **Yes.** This is the core thesis; frame as argumentative claim. |

  ---

  ### Strategic Notes

  **Two Objections to Concede in Opening**
  1.  **The Hume Specialist (Novelty):** Explicitly state in the intro that you are not arguing Smith breaks *entirely* with Hume, but rather radicalizes the social mechanism of calibration. This prevents the Hume specialist from spending their question time correcting your genealogy.
  2.  **The Intellectual Historian (Philosophy/Part VI):** Acknowledge early that Smith *does* point to philosophy as a remedy in Part VI. This disarms the charge that you haven't read the end of the book. You can then argue immediately that this remedy is exceptional, not structural.

  **Single Reply That Must Land**
  *   **The Calibration Asymmetry (Objection 5).** If the audience doesn't accept that resentment calibrates downward while admiration calibrates upward, the entire "corruption is predicted" thesis collapses. You must spend the most clear, textual time establishing this mechanism in the talk itself so the reply is just a reminder.

  **The Question You Hope Nobody Asks**
  *   "If the mechanism guarantees corruption for everyone except the rare philosopher, is Smith's moral theory practically useless?" (This forces you into the "Nihilism/Skepticism" corner).

  **Weak Point to Volunteer**
  *   **The Textual Basis for Upward Calibration.** Before Q&A, note: "I want to flag that while Smith is explicit about moderating resentment, the claim about admiration amplifying is an inference from his discussion of rank and vanity. I welcome pushback on whether that textual leap holds." This shows confidence and controls the framing of the attack.
