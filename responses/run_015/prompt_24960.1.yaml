answer: |-
  To say it is asserts a solid ground,
  Where essence stands, and truth is safely bound.
  To say it is not leaves the world unbound,
  Where nothing is, and silence is profound.
  Both is and not, a contradictory strain,
  A clash of states, a dualistic chain.
  Nor neither nor, logic wrought in vain,
  Dissolving marks, releasing every pain.

  Yet logic breaks; no fifth position stands,
  No essence holds, for no self-nature remains,
  The ladder falls from conceptual hands,
  And emptiness itself is empty of its chains.
  Not nothingness, where life and meaning cease,
  But open space where dependent things find peace.
