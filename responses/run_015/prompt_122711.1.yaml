answer: |-
  Here is a case constructed within clinical practice, followed by an analysis of the tension it creates for the Gricean framework.

  ### The Case: The Discharge Summary

  **Context:**
  Consider a psychiatric discharge summary written by a consultant psychiatrist (Dr. A) for a patient (Mr. B) being released back to the care of a General Practitioner (Dr. C). In this jurisdiction, patients have a legal right to access their full medical records upon request (transparency norm). However, the psychiatrist also has a duty of care to warn the GP of specific risks that might precipitate relapse if handled clumsily (safety norm).

  **The Utterance:**
  In the section regarding medication management, Dr. A writes:
  > *"Mr. B is compliant with his medication regimen."*

  **The Local Norm:**
  Within this specific hospital trust and among the local network of GPs, there is an established, unwritten coding protocol.
  *   **"Adherent"**: Used when the patient takes medication reliably without supervision.
  *   **"Compliant"**: Used specifically when the patient takes medication only under direct observation (e.g., by nursing staff or family) but is known to divert or skip doses when unsupervised.

  To an outsider (a GP from a different region or a lawyer), "compliant" is synonymous with "adherent" or simply "doing what is told." To the local competent reader (Dr. C), "compliant" signals: *"He takes it when watched, but do not trust him with a full prescription supply."*

  **The Failure of Gricean Tests:**

  1.  **Calculability:** The implicature ("He is unsafe unsupervised") is not calculable from the Cooperative Principle alone. A hearer relying only on general conversational maxims (Quality, Quantity, etc.) would infer that Mr. B is taking his meds. The inference requires access to a *local code* (the Compliant/Adherent distinction) that is not part of general linguistic competence. It is not derived from "what is said" + "universal maxims," but from "what is said" + "institutional cipher."
  2.  **Cancellability:** Dr. A cannot cancel the implicature without violating institutional constraints. She cannot add, *"...by which I mean he takes it only when observed,"* because Mr. B may read the file. If he sees this explicit warning, it breaches the therapeutic alliance and may cause the very non-compliance she is warning against. Yet, she is answerable for the warning. If Mr. B harms himself after Dr. C prescribes a full supply based on a literal reading, Dr. A is professionally liable for having used the code "compliant" without ensuring Dr. C understood the risk. She is bound to the implicature by professional accountability, not just conversational intention.
  3.  **Intention:** While Dr. A intends Dr. C to recognize the risk, she must simultaneously intend that Mr. B *not* recognize that specific intention (if he reads the file). This creates a split-addressee problem that strains the standard Gricean model of a single recognized intention.

  ### The Position: Cancellability Must Give

  In this institutional setting, the **cancellability test** is the requirement that must fail.

  Grice's cancellability test assumes the speaker is a free agent who can clarify their meaning without logical or pragmatic contradiction. In institutional practices, the speaker is not free; they are bound by **normative accountability**. Dr. A is answerable to the medical board and the legal system for how a *competent* reader interprets her note, regardless of whether she explicitly cancels the meaning. If she writes "compliant" and adds "but I don't mean he's risky," she has not cancelled the professional liability; the board will still judge her by the standard interpretation of the code.

  **Why this does not collapse into Convention (Semantic Meaning):**
  One might argue that if "compliant" consistently means "compliant-only-under-observation" in this context, it has simply become a synonym. It has not, for two reasons:
  1.  **Context Sensitivity:** If Dr. A uses "compliant" in a conversation with a colleague in a different hospital trust where this code does not exist, the implicature vanishes. Semantic conventions travel with the word; institutional implicatures travel with the *practice*.
  2.  **Truth Conditions:** The literal meaning remains true. Mr. B *is* compliant (in the ward). If "compliant" semantically meant "compliant-only-under-observation," the statement would be false if he were ever compliant at home. The literal truth conditions are preserved, while the pragmatic force carries the warning. This preserves the distinction between "what is said" (literal truth) and "what is implicated" (professional warning).

  **Why this does not collapse into "What is Said":**
  The additional content is not part of the propositional content of the sentence. It is not entailed. It is an instruction on how to *act* on the proposition (prescribe limited quantities). "What is said" describes the patient's behavior; the implicature dictates the GP's response.

  ### Theoretical Cost and Resolution

  Conceding that cancellability can fail in institutional contexts requires us to modify the Gricean apparatus. We must acknowledge that the **Cooperative Principle** is sometimes superseded or constrained by an **Institutional Protocol**.

  In standard conversation, the maxims are the highest authority. In this clinical note, the maxims (specifically Manner: "Be Clear") are in tension with the Institutional Protocol (Duty of Care vs. Patient Transparency). The Protocol dictates that the speaker *must* generate an implicature that cannot be cancelled.

  This does not destroy the theory of implicature; it locates it within a sociology of speech. It suggests that **calculability** is not always a matter of logical derivation from universal maxims, but sometimes a matter of **competence in a local practice**.

  For your reading group, the takeaway is this: Grice's tests work perfectly for "free" conversation between equals. They fracture when speech is **asymmetric** and **regulated**. In these cases, the "implicature" becomes a tool of professional governance. The speaker conveys more than they say not because they are being subtly cooperative, but because they are being **professionally responsible** within a system that forbids them from saying exactly what they mean.

  The tension reveals that speaker meaning is not just a psychological state (intention recognition) but a **normative status**. Dr. A means the warning not just because she intends it, but because the institution holds her to it. Grice's psychological definition of meaning needs to be bolstered by a normative account of answerability to handle institutional speech.
