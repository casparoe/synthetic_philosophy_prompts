answer: |-
  To the collection of aggregates currently occupying the chairs in this room, and to the causal series of mental and physical phenomena constituting the "Philosophy Department" and the "Buddhist Studies Center": welcome.

  I am tasked with opening this workshop, "Anatta and Institutional Memory." This presents a structural awkwardness that I suspect pleases everyone here, for different reasons. To speak of a "workshop" implies a container that persists from day one to day two. To speak of "participants" implies selves that endure from the morning session to the coffee break. Yet, if we take the Abhidhamma seriously, there is only this *citta-vithi*—this stream of consciousness-moments—arising and passing away with terrifying speed. There is no workshop, only a succession of venue-rentals and agenda-items. There are no persons, only five aggregates clinging to the idea of a coffee break.

  However, we are not gathered to dissolve into silence. We are gathered because, as the Buddha taught, we must navigate the world using *sammuti-sacca*—conventional truth—even as we train our insight toward *paramattha-sacca*—ultimate truth. To deny the convention would be to spill the coffee we have paid for. To reify the convention would be to misunderstand the nature of the debt.

  This tension is the engine of our next two days. We are using the institution as a macrocosm for the person. When a department loses its chair, changes its curriculum, and moves buildings, what persists? For our colleagues in analytic philosophy, this echoes debates over four-dimensionalism and narrative identity. Is the department a space-time worm composed of temporal parts? Is it a story we tell to make sense of administrative budget lines?

  For our colleagues in Buddhist studies, this mirrors the tension between *santana*, the causal continuity of processes, and the illusion of a fixed entity. Here, we must be precise about what is settled and what is open. It is settled doctrine that there is no *atman*, no permanent, unchanging self. It is settled that language operates on the level of convention. But it is *not* settled how much weight those conventions can bear.

  We are not here to reduce *anatta* to a Western bundle theory. The Buddhist denial of self is soteriological, not merely metaphysical; it is about the cessation of suffering, not just the categorization of parts. Yet, we must ask: Is a narrative account of identity compatible with *anatta*? Can we speak of "institutional memory" without smuggling in a soul?

  This brings us to the ghost in the room: the *Pudgala-vada*. For centuries, the "Personalist" view was dismissed as heresy, a strawman of substantialism. Contemporary scholarship, however, asks whether the Pudgalavadins were actually articulating a sophisticated middle way—a recognition that while there is no *atman*, the "person" is not merely a linguistic fiction, but a pragmatic reality that cannot be fully reduced to the aggregates without losing the coherence of karma and rebirth. We leave that question open. We are not here to adjudicate orthodoxy, but to explore the friction between the need for continuity and the reality of impermanence.

  So, why are we here? If there is no "we," and no "here"? We are here because conventions have causal efficacy. Suffering arises conventionally; understanding arises conventionally. The grant funding this event exists only by collective agreement, yet it pays the caterers. The "department" has no soul, yet it houses our books.

  Over the next two days, I invite you to speak freely of "persons" and "institutions," knowing that we are using rafts to cross a river, not building houses on the water. To the philosophers: treat the Buddhist materials with metaphysical rigor, not just as historical precursors to Hume. To the Buddhist scholars: treat the analytic tools not as reductions, but as fresh lenses on old problems.

  Let us proceed with the understanding that while the workshop is empty of inherent existence, the work we do within it matters. The coffee is hot, the lunch is at noon, and the causal conditions for a fruitful dialogue are, for this moment, assembled.

  Thank you.
