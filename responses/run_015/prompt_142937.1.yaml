answer: |-
  The terminal blinked with a steady, amber cursor. On the screen, the eviction order for Block 42 scrolled into view, signed with the cryptographic hash of the Municipal Council.

  Elias rubbed his eyes. He was a systems architect for the Borough of Highbury Link, responsible for maintaining the 'Statute Daemon'—the automated legal engine that governed everything from waste collection to zoning permissions. It was supposed to be perfect. No human bias, no clerical errors. Just code executing policy.

  'It's a logic error,' Elias said, turning from the screen to the woman standing behind him.

  Director Vance adjusted her glasses. She managed Legal Compliance, the human interface for the Daemon. 'The hash checks out, Elias. The statute was ratified by the Council last quarter, signed by the Mayor, and pushed to production. The pedigree is clean.'

  'The pedigree is fine,' Elias replied, tapping the glass. 'But the execution is impossible. Look at Statute 89-C. It mandates that all residential structures must maintain internal decibel levels below thirty during peak wind events.'

  'A noise pollution control,' Vance said. 'Standard quality of life legislation.'

  'Except the wind sensors recorded gusts of ninety miles per hour last night. The physics of the glass panes installed in Block 42—glass approved by this very council, I might add—means that at ninety miles per hour, the resonance hits thirty-five decibels. It is physically impossible for those residents to comply.'

  Vance sighed, leaning against the server rack. The hum of the cooling fans filled the silence. 'So, the law is harsh. That happens.'

  'No,' Elias said, his voice tightening. 'You're thinking like a positivist. You think law is just data. If the right people sign the right digital certificates, it becomes "law". That's what Hart argued, isn't it? That law is a matter of social fact. If the system recognises it, it's valid. Morality doesn't enter the equation.'

  Vance nodded slowly. 'Essentially. If we start questioning the validity of every statute because someone thinks it's unfair, the system collapses. Certainty is the primary virtue of law. People need to know where they stand. The Council passed the rule. The rule is now live. Therefore, it is law.'

  'But it fails the functional test,' Elias countered. He pulled up a schematic of the legal architecture. 'Think of it like an API. If I write a function that demands an integer output but the input string makes that mathematically impossible, the function doesn't just return an error; it fails to execute. It's not a bad function; it's broken code.'

  'Law isn't code, Elias. It's authority.'

  'Fuller would disagree,' Elias said. 'He argued that law has an "inner morality". It's not about whether the outcome is nice or nasty. It's about whether the system actually works as a system of rules. He listed eight principles. If you break them, you aren't just making bad law; you aren't making law at all.'

  Vance crossed her arms. 'And which principle did we break?'

  'Principle six: Possibility of Compliance. You cannot oblige people to do what they cannot do. If the wind blows, the glass vibrates. The residents cannot stop physics. By punishing them for it, the Daemon isn't enforcing a rule; it's just inflicting pain.'

  'They could have installed better glass,' Vance suggested.

  'The Council banned retrofits during the heritage preservation cycle last year. That's Statute 70-A. So we have Statute 70-A contradicting Statute 89-C. That breaks Principle five: Non-contradiction. And because the Daemon is fining them for something they couldn't prevent, the official action doesn't match the declared rule. That breaks Principle eight: Congruence.'

  Vance looked at the eviction order again. 'So, what are you proposing? That you, a systems engineer, override the Municipal Council because the physics don't align with the policy?'

  'I'm proposing that this isn't a legal violation. It's a system exception. If a rule demands the impossible, it ceases to guide conduct. Law is supposed to guide human behaviour. If I tell you to "walk on air", I'm not giving you a law to follow; I'm speaking nonsense. Fuller said that when you ignore these internal principles, you stop governing through law and start governing through force.'

  'And Hart would say,' Vance replied, her tone hardening, 'that even a nonsense rule is law if it comes from the sovereign authority. The danger of your view, Elias, is subjectivity. Who decides what is "possible"? Who decides what is "congruent"? If you allow engineers to invalidate statutes based on moral or logical intuitions, you undermine the Rule of Recognition. You replace the law of the land with the law of the engineer.'

  'But look at the output!' Elias gestured to the screen. 'A family is being evicted because the wind blew too hard. The system is technically consistent but functionally absurd. If the law doesn't connect with reality, it loses its legitimacy. People won't respect a system that punishes them for gravity.'

  'Legitimacy is not validity,' Vance corrected. 'A law can be valid and illegitimate. That is the price of a structured society. We follow the procedure. If the law is bad, we change it through the Council. We do not have the Daemon ignore it.'

  'That's the positivist trap,' Elias said, turning back to the keyboard. 'You separate law from morality so completely that you allow the law to become a tool of tyranny, provided the paperwork is in order. Fuller said that there is a necessary connection between law and morality—not that laws must be holy, but that they must respect the agency of the subject. They must be capable of being obeyed.'

  He hovered his finger over the 'Execute' key. The eviction order was queued. In ten seconds, the locks on Block 42 would engage.

  'If you stop that,' Vance warned, 'you are committing insubordination. You are treating the statute as null because you disagree with its application.'

  'I'm treating it as null because it fails to compile against reality,' Elias said. 'If I deploy code that crashes the server, I don't call it a "valid programme with bad outcomes". I call it a bug. This is a bug in the jurisprudence.'

  'It is not a bug. It is a feature of a system that prioritises order over exception.'

  'Order without justice is just tyranny with a schedule.'

  Elias looked at the countdown. He thought about Hart's cold clarity: law is what is enacted. He thought about Fuller's warmer demand: law is what guides. One promised certainty, the other promised integrity.

  'If I override it,' Elias said quietly, 'the Council will say I've broken the law.'

  'You will have,' Vance said. 'Because the law says the eviction proceeds.'

  'But if Fuller is right,' Elias murmured, more to himself than to her, 'then there is no law here to break. There is only a command backed by threats. And I don't work for threats. I work for the system.'

  'The system *is* the threats, Elias. That's what enforcement is.'

  'No,' he said, his hand moving away from the keyboard. 'The system is the promise that the rules make sense. If the rules don't make sense, the promise is void.'

  He opened a new terminal window. He couldn't delete the statute—that was beyond his clearance. But he could flag the sensor data as 'anomalous environmental interference', triggering a mandatory review clause buried in the maintenance protocol. It was a workaround. A patch.

  'You're hacking the legal process,' Vance observed, watching the code scroll.

  'I'm ensuring congruence,' Elias replied. 'I'm making the official action match the reality of the rule. Until the Council fixes the contradiction between the wind and the glass, this statute is dead letter. It looks like law, it hashes like law, but it functions like noise.'

  Vance watched the eviction order dissolve into a 'Pending Review' status. She didn't stop him. She couldn't, not without physically restraining him. But her expression remained unreadable.

  'You've bought them time,' she said. 'But you haven't answered the question. Next time the wind blows, the sensors will work. The glass will vibrate. The statute will still be on the books. Will you hack it again?'

  Elias looked at the amber cursor, now blinking patiently on a blank line.

  'Next time,' he said, 'I'll hope the Council remembers that you can't legislate against physics. Until then, I suppose I'm the compiler.'

  'And compilers,' Vance said, turning to leave, 'are supposed to be silent.'

  The door hissed shut. Elias sat alone in the server room, the hum of the machines surrounding him. The statute was still there, valid in the eyes of the Council, recognised by the social system. But as he looked at the code, he wondered if validity mattered at all if the law had forgotten how to speak to the people it was meant to govern. He saved the log, marked the case as 'Resolved', and waited for the next input.
