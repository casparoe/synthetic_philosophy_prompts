      Williams's integrity objection posits that consequentialism requires agents to view their own ground projects from an impersonal standpoint, creating alienation. This is not merely about emotional distress; it is a claim about rational agency. For Williams, an agent acts integrity-wise when their actions flow from commitments constitutive of their identity. Consequentialism disrupts this by inserting a neutral calculation between the agent and their projects.

