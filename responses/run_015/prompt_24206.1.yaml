      Consequently, the status of the objection changes. Under internalism, integrity is a rational veto; consequentialism is irrational because it demands action without reasons. Under externalism, integrity is merely a psychological barrier. The conflict becomes contingent: morality provides genuine reasons, but human psychology finds following them alienating. The objection no longer refutes consequentialism's rational authority; it only highlights its high human cost.

