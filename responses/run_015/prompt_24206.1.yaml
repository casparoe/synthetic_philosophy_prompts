answer: |-
  **Exam Question**

  Williams argues that consequentialism attacks integrity by demanding an alienating standpoint. Show why this critique presupposes an internalist account of practical reasons. If an externalist account of reasons is adopted, does the integrity objection lose its force, or does it merely reveal a contingent conflict between morality and psychology? Defend your view.

  **Model Answer**

  Williams's integrity objection posits that consequentialism requires agents to view their own ground projects from an impersonal standpoint, creating alienation. This is not merely about emotional distress; it is a claim about rational agency. For Williams, an agent acts with integrity when their actions flow from commitments constitutive of their identity. Consequentialism disrupts this by inserting a neutral calculation between the agent and their projects, forcing them to adopt a standpoint outside themselves.

  Crucially, this objection relies on Williams's internalism about reasons. Internalism holds that for something to be a reason for an agent, it must be derivable from their subjective motivational set via sound deliberation. If a moral demand cannot be linked to the agent's existing desires or projects, it is not a genuine reason for them. Therefore, when consequentialism demands sacrificing a ground project for the greater good, it demands action without an internal reason. The "one thought too many" is the recognition of a demand that lacks internal traction. The integrity objection works because, under internalism, the consequentialist requirement is rationally inert for the agent whose subjective motivational set does not prioritize impartial utility. The agent is being asked to act on a reason that, by definition, does not exist for them.

  If we reject internalism for externalism, the landscape shifts fundamentally. Externalism claims reasons exist independently of the agent's subjective motivational set. An agent might have a reason to maximize utility even if doing so contradicts every desire they currently hold. Under this view, the consequentialist demand retains its rational force regardless of alienation. The agent still has a reason to act, even if acting violates their integrity. The alienation is real, but it is not evidence of a rational mistake; it is evidence of a conflict between objective reasons and subjective motivation.

  Consequently, the status of the objection changes from refutation to psychological observation. Under internalism, integrity is a rational veto; consequentialism is irrational because it demands action without reasons. Under externalism, integrity is merely a psychological barrier. The conflict becomes contingent: morality provides genuine reasons, but human psychology finds following them alienating. The objection no longer refutes consequentialism's rational authority; it only highlights its high human cost. It shows that consequentialism clashes with our contingent attachments, not that it is logically incoherent.

  Therefore, the integrity objection is not a standalone refutation. It is parasitic on internalism. Without internalism, Williams shows only that consequentialism is difficult for humans, not that it is wrong. A strong defense of Williams must therefore defend internalism. If externalism is plausible, the integrity objection collapses into a complaint about demandingness rather than a critique of rational coherence. The agent may feel alienated, but they are not necessarily making a rational error. Thus, the objection fails to refute consequentialism normatively if reasons are external, serving instead as a description of the phenomenological burden of impartial morality. To save the objection, one must prove that reasons cannot be alien to the self. If reasons can be alien, then integrity is a cost of morality, not a proof of its falsity. The objection ultimately tests whether morality must be rooted in the self to be valid.

  **Marking Scheme (30 Marks)**

  1.  **Integrity as Identity (5 marks):** Must define integrity as acting from ground projects constitutive of the self, not just honesty.
      *   *Common Error:* Defining integrity as mere consistency or telling the truth.
  2.  **Internalism Defined (5 marks):** Must state reasons require a link to the agent's subjective motivational set.
      *   *Common Error:* Confusing internalism with psychological egoism or selfishness.
  3.  **The Dependency Link (5 marks):** Must argue the objection only works if consequentialist reasons lack internal traction for the agent.
      *   *Common Error:* Treating integrity and internalism as separate, unconnected arguments.
  4.  **Externalism Defined (5 marks):** Must state reasons exist independently of the agent's desires or projects.
      *   *Common Error:* Claiming externalism denies reasons exist at all for the agent.
  5.  **Impact on Objection (5 marks):** Must argue externalism renders alienation a psychological cost, not a rational veto.
      *   *Common Error:* Claiming externalism solves the alienation problem entirely rather than changing its status.
  6.  **Refutation vs. Clash (5 marks):** Must conclude objection refutes only under internalism; otherwise shows contingent psychological conflict.
      *   *Common Error:* Concluding consequentialism is refuted regardless of the meta-ethical framework.

  **A vs. B Distinction:** An A answer demonstrates the *structural dependency* of the normative critique on the meta-ethical premise, showing the objection collapses without internalism. A B answer treats integrity and internalism as adjacent topics without establishing that the former relies on the latter for its rational force.
