prompt: |-
  Hey, I'm running a workshop for sociology grad students — smart, but zero analytic phil background — and I want them to understand standing to blame and why hypocrisy undermines it. I'm framing it around a distinction I'm calling mirror vs structural hypocrisy: mirror is blaming you for the exact fault you have (like screaming at someone for being loud), structural is blaming you for X while I do Y, where X and Y share the same underlying moral form — say I call out a colleague for free-riding on shared lab protocols but I'm free-riding on departmental service commitments. I think they disqualify differently, and I want the session built around that.

  Don't explain it to me; plan how I'd teach it. What's the right dependency order — do they need to see standing as an entitlement rather than a reward for virtue before we even introduce hypocrisy, or after? What's the one carrying exmaple that has to contain both mirror and structural versions, and what must it have and lack? I want to avoid the tired 'adultery preacher' case since it's too obvious. What misconceptions will they bring — probably that hypocrisy is just being a bad messanger — and exactly where in the sequence should I head each off? Give me a quick check at the end to see if they grasp why structural hypocrisy is trickier than mirror. And tell me what I should flat-out refuse to explain at this level — I don't want to wander into whether blame is fundamentally a speech act or some deep Kantian machinery they won't follow.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Audience:** Sociology grad students (smart, no analytic philosophy background).
      *   **Topic:** Standing to blame, specifically how hypocrisy undermines it.
      *   **Core Distinction:** Mirror Hypocrisy (blaming for exact fault) vs. Structural Hypocrisy (blaming for X while doing Y, where X and Y share underlying moral form).
      *   **Goal:** Plan the teaching sequence, not explain the concepts to me.
      *   **Key Questions to Answer:**
          *   Dependency order (Standing as entitlement vs. reward).
          *   The "Carrying Example" (needs to cover both mirror and structural, avoid adultery/preacher).
          *   Misconceptions (hypocrisy = bad messenger) and when to address them.
          *   Final Check (why structural is trickier).
          *   What to refuse to explain (avoid deep meta-ethics/speech act theory).

  2.  **Determine the Conceptual Dependency Order:**
      *   *Question:* Do they need to understand standing as an *entitlement* (authority) rather than a *reward for virtue* before introducing hypocrisy?
      *   *Reasoning:* If they think standing is a reward for virtue, then *any* fault undermines standing. Hypocrisy becomes just "being bad." If they understand standing as a relational authority/entitlement (like a judge or a peer), then hypocrisy is specific: it's about the *relation* between the blamer's fault and the blamee's fault.
      *   *Decision:* **Before.** They must grasp that good people can lack standing (e.g., non-victims in some contexts, or outsiders) and bad people can have standing (e.g., a reformed addict blaming a current user). Hypocrisy is a specific *defeater* of that entitlement, not just general moral unworthiness.

  3.  **Develop the "Carrying Example":**
      *   *Constraints:* No adultery/preacher. Needs to fit sociology grad students (academic/professional context works best). Needs to show Mirror and Structural clearly.
      *   *Idea:* Academic Integrity/Citation Practices.
      *   *Mirror:* Prof A accuses Grad Student B of plagiarism, but Prof A has also plagiarized *the exact same paper* or *the same type of citation error*. (A bit weak on "exact fault").
      *   *Better Idea:* Resource Hoarding/Information Sharing.
      *   *Scenario:* A research lab or department setting.
      *   *Mirror Version:* Dr. X scolds Dr. Y for withholding data from a collaborator, when Dr. X is currently withholding data from *that same collaborator* on *the same project*. (Too specific?). Let's try: Dr. X scolds Dr. Y for ghostwriting a paper, and Dr. X ghostwrote a paper.
      *   *Structural Version:* Dr. X scolds Dr. Y for ghostwriting (intellectual dishonesty/unfair credit), but Dr. X hoards grant money/equipment (resource dishonesty/unfair access). Both share the form: "Claiming more than your fair share of credit/resources to the detriment of the collective."
      *   *Refinement:* Let's go with **"Gatekeeping vs. Access."**
      *   *Scenario:* A senior scholar (Dr. Aris) criticizing a junior scholar (Dr. Bell).
      *   *Mirror:* Aris criticizes Bell for excluding a marginalized voice from a co-authored paper. Aris has excluded a marginalized voice from *their* co-authored paper.
      *   *Structural:* Aris criticizes Bell for excluding a marginalized voice (epistemic exclusion). Aris excludes marginalized voices from *conference panels they organize* (institutional exclusion).
      *   *Wait, needs to be clearer on "Underlying Moral Form".* Let's try **"Free-Riding on Trust."**
      *   *Scenario:* Confidentiality in fieldwork.
      *   *Mirror:* Aris blames Bell for leaking a specific informant's identity. Aris leaked *that same* informant's identity.
      *   *Structural:* Aris blames Bell for leaking an informant's identity (breach of confidentiality trust). Aris breaches *institutional* trust by faking IRB compliance. Both are "violating protective protocols for personal gain/convenience."
      *   *Selection:* **The "Protocol Violation" Case.** It fits sociology (IRB, fieldwork, data).
      *   *Mirror:* Aris blames Bell for skipping informed consent steps with Participant A. Aris skipped informed consent steps with Participant B.
      *   *Structural:* Aris blames Bell for skipping informed consent (violating subject protection). Aris falsifies expense reports (violating institutional protection/trust). Both are "cutting corners on safety/integrity rules to speed up work."

      *   *Actually, let's make it more interpersonal to fit "Blame".*
      *   *Scenario:* **The "Collegial Support" Case.**
      *   *Context:* A department struggling with workload.
      *   *Mirror:* Prof A blames Prof B for skipping a department meeting. Prof A also skipped a department meeting.
      *   *Structural:* Prof A blames Prof B for skipping a department meeting (violating shared labor norms). Prof A refuses to mentor grad students (violating shared labor norms).
      *   *Why this works:* It's relatable. Mirror is "you did the *thing* I did." Structural is "you violated the *principle* I violate."

  4.  **Identify Misconceptions & Timing:**
      *   *Misconception:* "Hypocrisy just makes the message annoying/ugly." (The "Bad Messenger" fallacy).
      *   *Timing:* Address this *immediately after* defining standing. If they think it's just aesthetic, they won't see the normative force.
      *   *Misconception:* "If I'm guilty, I can never blame." (The "Clean Hands" fallacy).
      *   *Timing:* Address this when distinguishing Standing from Virtue.

  5.  **Drafting the Sequence:**
      *   **Phase 1: Standing as Authority (Not Virtue).** Establish that blame is like a verdict, not a sermon.
      *   **Phase 2: The Defeater (Hypocrisy).** Introduce the concept.
      *   **Phase 3: The Carrying Example.** Run the Mirror vs. Structural distinction.
      *   **Phase 4: Why Structural is Harder.** The check.
      *   **Phase 5: Boundaries.** What not to teach.

  6.  **Refining the "Check":**
      *   Need a scenario where Mirror is obvious, but Structural is debatable.
      *   *Check:* A case where the actions look different but the principle is the same. If they say "That's not hypocrisy, that's a different action," they failed. If they say "It is hypocrisy because the commitment violated is the same," they passed.

  7.  **Refining "What Not to Explain":**
      *   No meta-ethics of blame (emotional vs. normative).
      *   No deep Kantian autonomy stuff.
      *   No "Is standing ever fully lost?" (waiver/forgiveness nuances).

  8.  **Review against Constraints:**
      *   *Sociology audience:* Use examples about institutions, norms, power, labor.
      *   *No preaching:* Keep it instructional design.
      *   *Mirror vs. Structural:* Ensure this is the core pivot.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Structural" definition is tight. It's not just "different action." It's "different action, same normative commitment."
      *   *Correction:* Ensure the "Entitlement vs. Reward" point is the foundation. If they miss this, the rest fails.

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the workshop plan, structured for a 90-minute session.

  ### 1. Conceptual Dependency Order
  **Teach Standing as Entitlement *Before* Hypocrisy.**

  Do not introduce hypocrisy until they have grasped that standing is a **normative authority**, not a **moral report card**.
  *   **Why:** If they view standing as a reward for virtue, *any* moral failing looks like hypocrisy. They will conflate "being a bad person" with "lacking the authority to blame."
  *   **The Move:** Frame standing as a relational status (like a judge in a court or a referee in a game). A referee can be a cheater in their personal life and still validly call a foul (Virtue $\neq$ Standing). However, if the referee calls a foul they are currently committing *in the game*, they lose authority (Hypocrisy = Standing Defeater).
  *   **Sequence:**
      1.  Define Blame as a claim to authority (not just expressing anger).
      2.  Define Standing as the entitlement to make that claim.
      3.  *Then* introduce Hypocrisy as a specific condition that voids that entitlement.

  ### 2. The Carrying Example: "The Committee Labor Case"
  Avoid the adultery/preacher trope. Use a scenario that mirrors their academic labor conditions. This ensures the "structural" link feels sociological, not just logical.

  **The Scenario:**
  Dr. Aris (Senior) blames Dr. Bell (Junior) for failing to uphold departmental obligations.

  *   **Mirror Version:** Aris blames Bell for **skipping the weekly colloquium**. Aris has also **skipped the weekly colloquium** without excuse.
      *   *Fault:* Identical action.
      *   *Intuition:* Obvious hypocrisy. "You do it too!"
  *   **Structural Version:** Aris blames Bell for **skipping the weekly colloquium** (violating the norm of *shared intellectual presence*). Aris consistently **refuses to mentor grad students** (violating the norm of *shared reproductive labor*).
      *   *Fault:* Different actions.
      *   *Underlying Form:* Both violate the specific commitment to **uncompensated collective maintenance** that keeps the department running. Aris is opting out of the "tax" required to participate in the community while demanding Bell pay it.

  **What this example must HAVE:**
  *   **Shared Community:** Both must be members of the same normative community (the department).
  *   **Explicit Norm:** The obligation must be understood as a shared duty, not a personal preference.
  *   **Power Differential:** Aris must have some authority over Bell, making the standing claim plausible initially.

  **What this example must LACK:**
  *   **Severity Imbalance:** Do not make one violation a crime and the other a misdemeanor (e.g., don't make Aris a thief). Keep the moral weight roughly equivalent so the *structure* is the variable, not the severity.
  *   **Personal Gain:** Avoid making it look like Aris benefits directly from Bell's specific action. The issue is the *right to blame*, not the *outcome of the blame*.

  ### 3. Misconceptions & Intervention Points

  **Misconception A: "The Bad Messenger" (Hypocrisy just makes the message annoying)**
  *   *The Error:* Students will think hypocrisy just makes Aris unlikable, but Bell is still wrong to skip the meeting.
  *   *Intervention Point:* **Immediately after introducing Standing.**
  *   *The Fix:* Ask: "If a corrupt judge sentences a guilty criminal, is the sentence legally valid?" (Yes). "If a judge sentences a criminal for a crime the judge is actively committing *on the bench*, is it valid?" (No). Show that hypocrisy doesn't just stain the messenger; it **silences the speech act**. Bell doesn't just get to ignore Aris; Aris *cannot* validly blame Bell.

  **Misconception B: "Clean Hands" (I can't blame if I'm imperfect)**
  *   *The Error:* "If Aris has ever skipped a meeting, he can never blame anyone."
  *   *Intervention Point:* **During the Mirror vs. Structural distinction.**
  *   *The Fix:* Emphasize **Temporal and Contextual Specificity**. Aris can blame Bell for skipping meetings if Aris *used to* skip them but stopped (reformed), or if Aris skips them for a *justified reason* (illness). Hypocrisy requires a *current, unjustified* commitment violation. This clears the ground for Structural Hypocrisy: it's not about being perfect; it's about violating the *same principle* right now.

  ### 4. The "Structural is Trickier" Check
  End the session with this diagnostic scenario. Do not ask for definitions; ask for a verdict.

  **The Check Scenario:**
  > A sociologist publicly shames a corporation for using **algorithmic bias** to deny loans to minorities (Epistemic/Technical harm).
  > Later, it is revealed this sociologist uses **prestige bias** to reject papers from junior scholars at non-R1 institutions (Social/Professional harm).

  **Ask:** "Does the sociologist have standing to blame the corporation?"

  *   **Fail State:** They say "Yes, because algorithms aren't the same as hiring." (They missed the structural form).
  *   **Fail State:** They say "No, because they are a bad person." (They reverted to Virtue theory).
  *   **Pass State:** They say "No, because both actions violate a commitment to **fair evaluation procedures free from arbitrary exclusion**." (They identified the shared moral form).

  ### 5. What to Flat-Out Refuse to Explain
  Keep the sociology students in their lane. If they push on these, park them in a "Parking Lot" for later and move on.

  1.  **The Metaphysics of Blame:** Do not discuss whether blame is fundamentally an emotion (resentment) or a judgment (normative assertion). Treat blame as a **social practice** with rules.
  2.  **Kantian Autonomy:** Do not explain *why* hypocrisy violates autonomy (the "right to blame" vs. "being subject to norms"). Just state that it functions as a veto.
  3.  **Forgiveness vs. Standing:** Do not get into whether standing can be restored by apology. Keep it binary for the workshop: You have it, or the hypocrisy defeats it.
  4.  **Third-Party Standing:** Do not discuss whether *you* (the observer) can blame Aris for being hypocritical. Focus strictly on Aris's standing to blame Bell.

  ### Summary of Flow
  1.  **Standing = Authority** (Not Virtue).
  2.  **Hypocrisy = Authority Defeater** (Not Annoyance).
  3.  **Mirror vs. Structural** (Same Act vs. Same Principle).
  4.  **Diagnostic Check** (Identify the Principle, not the Act).
