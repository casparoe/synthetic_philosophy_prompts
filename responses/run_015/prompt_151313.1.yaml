answer: |-
  Good evening. For those who don't know me, I'm [Name]. Looking around this room, I see the two worlds my mother has lived in for thirty-two years. On one side, the people who know her by the bill numbers, the committee chairs, and the late nights in session. On the other, the cousins, the bridge club, and the family who know her by the card table and the Sunday dinner. Usually, these groups don't overlap much. But tonight, you're all here to honor the same thing: her integrity.

  Now, anyone who knows me knows I've spent the last few years reading too many books about political theory. And anyone who knows my mother knows she has very little patience for theory that doesn't survive contact with reality. We've had our debates. I've argued about systems and structures; she's argued about craft. She told me, repeatedly, that legislating isn't about abstract ideals—it's about knowing where the bodies are buried, knowing who to call, and knowing what you can actually pass. She told me that constituents re-elected her because they wanted someone who knew how to get things done, not someone who was just pure at heart.

  For a long time, I resisted that. I wanted to believe the system mattered more than the person. But then came the vote on Medicaid expansion.

  Many of you remember it. She broke with her own leadership. She took heat from her own party. She did it because it was right for the constituents who sent her here. But there is a detail about that vote that matters to me. She made it three weeks after announcing she wasn't running again.

  For years, I've believed that the hardest part of this job isn't knowing what's right—it's having the freedom to do it when it costs you something. I've argued that the pressure of the next election distorts the work of this place. Watching her that week, I saw something I hadn't seen before. I saw that my mother spent thirty-one years mastering the craft of this legislature so that, when the pressure of reelection vanished, she could wield that craft without compromise.

  It wasn't that she changed in those three weeks. It was that the noise stopped. And because she had spent three decades learning how the machine worked, she knew exactly how to make it move in the right direction, even when her own leadership told her not to. The vote wasn't an anomaly; it was the culmination. You needed the thirty-one years to build the capital, and you needed the retirement to spend it all on one thing.

  So, to the staff and colleagues here: thank you for working with her on the craft. To the family and friends: thank you for reminding her there was a world outside these walls. And to my mother: You taught me that experience gives you the power to act, but freedom gives you the clarity to know when to use it. You didn't just serve your constituents while you were here; you showed us what service looks like when you have nothing left to prove.

  We can argue about the best way to design a legislature. But looking at you, I know what the best version of a legislator looks like.

  \answer{To the courage that comes from mastery, and the freedom that comes from having nothing left to prove.}
