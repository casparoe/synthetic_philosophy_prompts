answer: |-
  Darwin warned us not to reify **species**,
  but trace the branching of a **lineage**,
  finding no fixed reproductive **barrier**
  between the distinct form and the **hybrid**.
  It is not a class, not a Platonic **kind**,
  but a distinction saved by a **name**.

  Yet Mayr gave the **name** a biological weight,
  defining the reality of **species**
  by who mates with whom, not by morphological **kind**,
  holding the population's **lineage**
  safe from the swamping flow of the **hybrid**,
  behind a strict isolating **barrier**.

  But laws require universals, not a **barrier**;
  so Ghiselin struck the **name** from the class-list,
  where membership is false, for clone or **hybrid**,
  for you are a proper part of **species**,
  a temporal segment of **lineage**,
  born in speciation, not a **kind**.

  The phylogeneticist rejects the natural **kind**,
  ignoring the reproductive **barrier**
  for the smallest diagnosable **lineage**.
  Here the ancestor loses its **name**
  the moment it buds a daughter **species**;
  the parent dies, leaving no **hybrid**.

  Then bacteria laugh at the **hybrid**,
  having no sex to define a **kind**,
  while ring populations mock **species**.
  A mates with B, no **barrier**;
  B mates with C, sharing a **name**,
  but A and C unravel the **lineage**.

  So we map the **lineage**
  and measure the flow of the **hybrid**,
  we stamp every specimen with a **name**,
  hoping to find a natural **kind**,
  or settle for a porous **barrier**,
  and leave the concept of **species**.

  No single drawer holds the **species** or the **lineage**,
  no glass case seals the **barrier** from the **hybrid**,
  we file the **kind** beneath an arbitrary **name**.
