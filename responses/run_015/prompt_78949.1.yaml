answer: |-
  **Verdict: Reject Premise (2).**

  You must reject the claim that "One can hold another to a standard only if one meets that standard oneself." Your friend is correct that (2) is false, but wrong to infer from this that the blamer's record is irrelevant (6). The error in (2) is not that it links standing to conduct, but that it links standing to the *wrong kind* of conduct.

  **Why (2) Looked Fine**
  Premise (2) captures a powerful moral intuition: the **Manipulator**. When someone blames you for lying while actively lying to your face, their blame feels like a weapon, not a correction. It feels like an assertion of dominance rather than an appeal to a shared norm. In this case, the blamer's failure to meet the standard *does* undermine their standing. This makes (2) seductive; it correctly identifies that hypocrisy can silence criticism. It appeals to a sense of fairness: why should I be answerable to you if you are not answerable to the same rule?

  **Why (2) Must Go**
  However, (2) is overbroad. It treats *any* failure to meet the standard as disqualifying, regardless of time, context, or attitude. This is where the **Recovered Hypocrite** and the **Court** destroy the premise.

  The Recovered Hypocrite has failed the standard (satisfying the antecedent of (2)'s negation), yet she has standing. Why? Because standing is not a reward for moral purity; it is a function of **current normative commitment**. She now upholds the standard she invokes. Her past failure is not a shield for the wrongdoer because she no longer identifies with that failure. She has repaired her relationship to the norm. Premise (2) cannot distinguish between her and the Manipulator because it looks only at the fact of failure, not the *status* of that failure.

  The Court case reinforces this. A judge's private failings do not void a conviction because the *institution* is the blamer, not the individual. The Court, as an entity, *does* meet the standard—it upholds the law by convicting. Premise (2) fails here because it conflates the agent's personal history with the authority's current function. It assumes the "self" in "meets that standard oneself" must be the biological individual, ignoring that standing can be vested in a role that demands current upholding of the norm, not historical sinlessness.

  **The Price of Alternatives**
  To see why rejecting (2) is the least costly move, consider the alternatives:

  1.  **Keep (2) and Reject (3):** This saves standing but demands **Moral Elitism**. You would have to claim that some people have *never* failed a comparable standard. This is empirically dubious and morally dangerous. It suggests only saints can speak against sin, which concentrates moral authority in the hands of those least likely to understand human frailty. You sacrifice the Recovered Hypocrite's humility; she must hide her past to be heard.
  2.  **Keep (2) and (3), Accept (4):** This leads to **Moral Silence**. If no one has standing, wrongdoers gain immunity. The Manipulator wins by pointing out that his critic once stumbled ten years ago. This sacrifices the community's ability to self-correct.
  3.  **Accept the Friend's (6):** This leads to **Moral Anarchy**. If the record is *irrelevant*, the Manipulator retains standing. His current hypocrisy becomes morally invisible. This sacrifices the intuition that current consistency matters. It severs the link between authority and example, allowing bad actors to police others without constraint.

  **The Cost of Rejecting (2)**
  By rejecting (2), you pay a specific price: you lose the simplicity of the "clean hands" doctrine. You can no longer say "You sinned, so you are silent." Instead, you must do the harder work of distinguishing between **historical fallibility** and **current hypocrisy**.

  You replace (2) with a refined principle: *One lacks standing to blame only if one currently violates the standard in a way that renders the blame hypocritical or manipulative.*

  This repair saves the Recovered Hypocrite (she is not currently violating) and condemns the Manipulator (he is). It accommodates the Court (the institution is currently upholding the standard). It preserves (5) without accepting (6). The blamer's record remains relevant—not as a disqualifier for past sins, but as a disqualifier for present inconsistency. You retain the concept of standing, but it becomes a measure of your current relationship to the norm, not your permanent moral scorecard. This is the only path that allows moral criticism to survive without granting immunity to the hypocrite.
