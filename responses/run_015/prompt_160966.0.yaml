answer: |-
  # Commitments and Defaults Review Protocol (CDR-P)

  **Owner:** Commitments and Defaults Review Chair
  **Audience:** Product Managers, Compliance Officer, General Counsel
  **Timebox:** 90 Minutes per Feature
  **Data Constraints:** Product telemetry only. No user surveys.

  ## 1. Purpose and Scope
  This procedure distinguishes between **Commitment Devices** (features that help users execute long-term plans despite short-term temptation) and **Exploitative Pumps** (features that profit from users' inability to stick to plans or from confusion).

  **Core Principle:** We permit designs that charge for *changing a mind* if the charge is transparent and covers administrative cost or risk. We prohibit designs that *induce* mind-changing to collect fees, or that trap users in cycles of reversal where value is extracted without new information.

  ## 2. The Procedure (5 Gates)
  Reviewers must pass through these gates in order. If a gate triggers a **STOP**, the verdict is "Not Permitted" unless the "Missing Data" instruction is invoked to gather evidence.

  ### Gate 1: The Revenue Source Test
  **Question:** When a user reverses a commitment (cancels, withdraws early, opts out), does the Company retain money that would otherwise have remained with the User?
  *   **Pass:** No. (Money moves between user accounts, or to a third party, or is zero).
  *   **Fail:** Yes. (Company collects a fee, keeps interest, or retains a deposit).
  *   **Missing Data:** **STOP.** Assume **Fail**. PM must instrument revenue attribution within 48 hours to proceed.
  *   **Rationale:** If the company does not profit from the reversal, it is not a money pump. It may be a usability issue, but not financial exploitation.

  ### Gate 2: The Information-Bearing Test
  **Question:** Is the reversal correlated with an external change in the user's circumstances or new information about the product?
  *   **Pass:** Yes. Telemetry shows reversals spike alongside: (a) Support tickets citing errors/misunderstanding, (b) Life events (address change, income drop detected via direct deposit variance), or (c) First-time usage (learning curve).
  *   **Fail:** No. Reversals occur randomly, or correlate with Company nudges (push notifications, UI prompts) without external triggers.
  *   **Missing Data:** **Flag for Legal Review.** Assume **Fail** if no correlation logic exists in the product roadmap.
  *   **Rationale:** Rational preference change is driven by new information. Gratuitous drift is driven by design friction or confusion.

  ### Gate 3: The Cycle Test (Pump Closure)
  **Question:** Do users return to the original state and repeat the reversal within 90 days? (State A → State B → State A).
  *   **Pass:** No. Users reverse once and stay reversed, or stay committed.
  *   **Fail:** Yes. >5% of reversing users re-enroll/re-lock within 90 days and reverse again.
  *   **Missing Data:** **STOP.** Assume **Fail**. PM must track cohort re-enrollment.
  *   **Rationale:** A single reversal may be a rational change of mind. A cycle indicates the user cannot find a stable preference, allowing repeated extraction.
      *   *Stance on Pump Closure:* A single completed cycle (A→B→A) is sufficient to condemn the design *if* Gate 1 (Revenue) is also failed. We do not require infinite loops to prove harm; one profitable loop proves the mechanism exists.

  ### Gate 4: The Anticipation Test
  **Question:** Was the cost of reversal clearly disclosed *before* the initial commitment, and was the opt-out path friction-equivalent to the sign-up path?
  *   **Pass:** Yes. Cost disclosed on signup screen. Opt-out clicks ≤ Sign-up clicks.
  *   **Fail:** No. Cost hidden in T&Cs, or opt-out requires phone call/more clicks than sign-up.
  *   **Missing Data:** **Fail.** Compliance Officer to verify UX flows.
  *   **Rationale:** If the user anticipated the defection and the cost, the fee is a price for an option (rational). If the cost was hidden or friction asymmetrical, the user mispredicted their behavior due to design (exploitation).

  ### Gate 5: The Net Welfare Test
  **Question:** For the cohort that reversed, is the cumulative cost of fees greater than the cumulative benefit (interest earned, savings achieved)?
  *   **Pass:** No. Users are net neutral or positive.
  *   **Fail:** Yes. Users are net negative.
  *   **Missing Data:** **Flag for Legal Review.** Model worst-case scenario based on maximum fee frequency.
  *   **Rationale:** Distinguishes intertemporal transfer (User-Time-A pays User-Time-B) from extraction (User pays Company).

  ## 3. Explicit Stances on Edge Cases

  **A. Pump Closure (Is one cycle enough?)**
  **Ruling:** Yes. If Gate 1 (Revenue) and Gate 3 (Cycle) are both failed, the feature is **Not Permitted**.
  **Reasoning:** A rational "price for keeping options open" is a one-off insurance premium. A mechanism that allows a user to pay, reset, and pay again for the *same* option indicates the design is harvesting instability rather than pricing risk. We do not wait for the user to go bankrupt to identify the trap.

  **B. Autonomy Pumps (Cycles with no financial extraction)**
  **Ruling:** These are **Permitted with Changes**.
  **Reasoning:** If Gate 1 passes (no company revenue from reversal), the Money Pump argument does not apply financially. However, a design that prevents a user from executing a stable plan violates our autonomy mandate.
  **Action:** PM must reduce friction or add "cooling off" periods to stabilize user choice. This is a UX debt, not a compliance ban.

  ---

  ## 4. Feature Reviews (Application of Protocol)

  ### Feature 1: Auto-Renewing Subscription (Price Hike)
  *   **Description:** 1st month free, then $10/mo. Renews automatically at $15/mo after 3 months.
  *   **Gate 1 (Revenue):** **FAIL.** Company retains the $5 increase on renewal.
  *   **Gate 2 (Info):** **FAIL.** Price hike is scheduled, not triggered by user life events or product changes.
  *   **Gate 3 (Cycle):** **PASS.** Users typically cancel after hike and do not rejoin immediately.
  *   **Gate 4 (Anticipation):** **FAIL.** Renewal price often buried in T&Cs; cancellation requires 3 clicks vs 1 for signup.
  *   **Gate 5 (Welfare):** **FAIL.** Users pay higher rate for same service without consent.
  *   **Verdict:** **Not Permitted.**
  *   **Required Change:** Renewal price must be disclosed prominently at signup. Renewal requires active consent (opt-in) for the price increase, or cancellation must be 1-click.

  ### Feature 2: Auto-Escalating Contribution (Save More Tomorrow)
  *   **Description:** Contribution rate increases by 1% on every detected pay raise. User can opt out anytime.
  *   **Gate 1 (Revenue):** **PASS.** Company earns AUM fee on total balance, but does not profit from the *reversal* (opt-out).
  *   **Gate 2 (Info):** **PASS.** Escalation triggered by external event (pay raise).
  *   **Gate 3 (Cycle):** **PASS.** Linear progression. No cycling back and forth.
  *   **Gate 4 (Anticipation):** **PASS.** Terms clear at setup. Opt-out is instant in settings.
  *   **Gate 5 (Welfare):** **PASS.** User savings increase.
  *   **Verdict:** **Permitted as Designed.**
  *   **Note:** This is a classic commitment device. It aligns user success with company revenue.

  ### Feature 3: Gamified Savings Streak
  *   **Description:** Visual "streak" counter resets to zero if a weekly deposit is missed. No fees.
  *   **Gate 1 (Revenue):** **PASS.** No financial extraction on reset.
  *   **Gate 2 (Info):** **FAIL.** Resets are often due to forgetfulness, not life changes.
  *   **Gate 3 (Cycle):** **FAIL.** Users build streak, miss, rebuild, miss (Psychological Cycle).
  *   **Gate 4 (Anticipation):** **PASS.** Rules are clear.
  *   **Gate 5 (Welfare):** **PASS.** No financial loss.
  *   **Verdict:** **Permitted with Changes (Autonomy Pump).**
  *   **Reasoning:** While not a money pump, this creates a "Frustration Loop" (Gate 3) that destabilizes user planning.
  *   **Required Change:** Implement a "Streak Freeze" or grace period to prevent gratuitous resets. Reduce psychological volatility.

  ### Feature 4: Lockbox (Flagship Savings Lock)
  *   **Description:** User locks funds for 12 months. Earns 4% APY. Early withdrawal incurs 5% penalty fee (retained by Company).
  *   **Gate 1 (Revenue):** **FAIL.** Company retains the 5% penalty.
  *   **Gate 2 (Info):** **MIXED.** Some withdrawals are emergencies (info-bearing). Telemetry shows 15% of users withdraw early *without* external triggers (e.g., no income drop detected).
  *   **Gate 3 (Cycle):** **FAIL.** Telemetry shows 8% of users Lock → Withdraw (Pay Penalty) → Re-Lock → Withdraw (Pay Penalty) within 12 months.
  *   **Gate 4 (Anticipation):** **PASS.** Penalty is disclosed upfront. Opt-out is available (but costly).
  *   **Gate 5 (Welfare):** **FAIL.** For the cycling cohort, penalties (10%+) exceed interest earned (4%). Net negative.
  *   **Verdict:** **Not Permitted (as currently monetized).**
  *   **Reasoning:** This feature fails the Money Pump test. While it functions as a commitment device for many, the 8% cycling rate indicates a subset of users are being exploited for their diachronic inconsistency. The Company is profiting from their failure to stick to the plan, not just their success.
  *   **Required Change:**
      1.  **Cap Penalties:** Penalties cannot exceed interest earned (prevents net negative welfare).
      2.  **Redirect Fees:** Early withdrawal fees must go to a community pool or charity, not Company revenue. (Removes incentive to design for breakage).
      3.  **Cooling Off:** 24-hour window to reverse a withdrawal request without penalty.
  *   **Commercial Viability Conclusion:** If redirecting fees makes Lockbox unprofitable, **the feature should be sunset.** We cannot build a flagship product on the premise of harvesting user inconsistency. We must monetize via spread or AUM fees on successful locks, not failure fees.

  ---

  ## 5. Limits of the Procedure

  Reviewers and General Counsel must acknowledge the following boundaries of this protocol:

  1.  **Preference Change vs. Irrationality:** This procedure cannot determine if a user's preference change over time is *irrational*. It only determines if the *design* profited from the change. A user may genuinely prefer to spend now rather than save later; we do not ban features that allow this, provided we do not charge them cyclically for the oscillation.
  2.  **Paternalism Limit:** This protocol does not license us to prevent users from making expensive mistakes if they are informed (Gate 4 Pass). If a user anticipates they will break a lock and accepts the fee as the price of flexibility, we permit it. We only intervene when the *design* obscures that choice or induces the cycle.
  3.  **Data Blind Spots:** Because we forbid surveys, we cannot know *why* a user felt regret, only that they reversed. We assume reversals without external triggers are design-induced. This is a conservative assumption that may flag some benign features.
  4.  **Intertemporal Welfare:** We treat the user as a single entity over time. We do not adjudicate conflicts between "Past Self" and "Future Self" unless money leaves the user ecosystem. If the Past Self binds the Future Self successfully (Lockbox held), we permit it. If the Past Self is tricked into binding the Future Self for Company profit, we prohibit it.

  **Sign-off:**
  *   **Review Chair:** ___________________
  *   **Compliance Officer:** ___________________
  *   **General Counsel:** ___________________
  *   **Date:** ___________________
