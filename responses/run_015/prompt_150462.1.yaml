  **Rescue Moves for Long-Run Predictive Theories**

  1.  **Mechanism/Trend Decoupling:** Assert the causal power exists even if observed data trends are masked.
  2.  **Temporal Indeterminacy:** Treat prediction dates as heuristic, not falsifiable conditions.
  3.  **Exception-as-Confirmation:** Frame temporary countervailing causes as validations of the rule by their eventual exhaustion.
  4.  **Tendency Formulation:** Reframe discrete forecasts as directional pressures.
  5.  **Comparative Anomaly Defense:** Note rival theories possess unexplained residuals of their own.
  6.  **Auxiliary Hypothesis Lock:** Prohibit dropping supporting assumptions without a supermajority vote.
  7.  **Stock Depletion Evidence:** Classify drawing down finite reserves as evidence of pressure, not relief.

  ***

  **INTERNAL MEMORANDUM**

  **TO:** Faculty of Social Sciences
  **FROM:** Standing Committee on Provisional Falsification
  **DATE:** October 14
  **SUBJECT:** Retention Protocols for Delayed Predictive Models

  The Committee convened to establish administrative guidelines for theories whose central predictions have not materialized within the original temporal window. It is the finding of the Committee that premature retirement of such models constitutes a procedural error regarding the nature of time and causal latency. The following findings and resolutions are hereby enacted to standardize the defense of long-run mechanisms.

  **Finding 1 (Temporal Elasticity):** Specific dates attached to predictions are deemed heuristic markers rather than strict falsification conditions. A theory claiming an event will occur "soon" retains validity indefinitely, provided "soon" is interpreted as a function of pressure accumulation rather than calendar years. The clock resets upon the identification of any new countervailing cause.

  **Finding 2 (The Exhaustion Clause):** When a countervailing cause (e.g., technological innovation, resource discovery) delays the predicted outcome, the theory is not weakened but strengthened if said cause is finite. The depletion of the countervailing cause shall be recorded as positive evidence for the underlying mechanism. The moment the rescue fails is the moment the theory succeeds.

  **Finding 3 (Borrowed Surplus):** Instances where subsistence is maintained via stock drawdown (fossil aquifers, carbon reserves, soil depth) are to be coded as "confirmatory stress" rather than "refutation." The act of borrowing from the future validates the claim that the future will be poor. Consumption of the one-off reserve is itself the predicted pressure manifesting in disguise.

  **Resolution 4 (Auxiliary Hypothesis Lock):** No auxiliary hypothesis (e.g., "fertility rates will remain high") may be withdrawn without a two-thirds division of the house. This prevents ad hoc adjustments from destabilizing the core mechanism. Proponents are protected from having to concede that a specific parameter was incorrect, provided the general direction remains intact.

  **Resolution 5 (Comparative Anomaly):** A theory shall not be suspended merely because its predictions are absent, provided rival theories possess unexplained residuals of their own. Mutual assured non-falsification is an acceptable state of affairs. The presence of anomalies in opposing frameworks grants provisional immunity to the framework under review.

  **Budget Item 6:** Funding is allocated for Intergenerational Wait-Time Compensation. Theorists must be supported during the latency period between prediction and fulfillment to prevent talent drain. Stipends are available for those maintaining vigilance during periods of apparent prosperity.

  **Final Protocol (Prospective Vindication):** To ensure continuity, the Committee authorizes the issuance of Pre-emptive Confirmation Vouchers. These instruments allow proponents to claim credit for a catastrophe before it occurs, provided they maintain the warning. Liability for the event is transferred to future generations, who will lack the capacity to dispute the claim. This ensures the theory remains in good standing regardless of current data, securing its position until the inevitable arrives. By discounting the testimony of future generations on the grounds that they will have been warned, the Committee guarantees that no future evidence can overturn the present consensus. The theory is thus insulated from both current success and future failure.
