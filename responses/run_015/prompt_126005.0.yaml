answer: |-
  # Specification: Belief Attribution for AI Documentation

  **Purpose:** To enable deployers (black-box access) to predict system behavior in novel contexts and calibrate reliance.
  **Exclusions:** Moral responsibility, legal liability, internal credit assignment.

  ## 1. Desiderata for Belief Attribution

  The following requirements define when a documentation team may assert "The system believes *p*" versus "The system behaves as if *p*."

  ### D1. Novel-Input Predictive Power
  *   **Requirement:** The attribution must increase the accuracy of the reader's predictions on inputs *not* present in the training or evaluation set. If the attribution only summarizes past performance, it is a report, not a belief ascription.
  *   **Motivating Case:** *General Utility.* (Baseline).
  *   **Status:** **Non-negotiable.** (Core to the stated purpose).
  *   **Camp Alignment:** **Pragmatist.** (Interpretivists and Mechanists may accept this, but only Pragmatists make it the *sole* criterion).
  *   **Distinction Respected:** Distinguishes an attribution that *predicts* from one that merely *explains* past logs.

  ### D2. Observability (Black-Box Verifiability)
  *   **Requirement:** The evidence for the attribution must be derivable from input-output behavior, documented architecture, or public training data descriptions. It cannot rely on inspecting weights, activations, or gradient flows.
  *   **Motivating Case:** *The Reader Constraint.* (Baseline).
  *   **Status:** **Non-negotiable.** (Constraint of the documentation medium).
  *   **Camp Alignment:** **Pragmatist / Operationalist.** (Mechanists will view this as a necessary evil; Interpretivists accept it as the only available evidence).
  *   **Distinction Respected:** Distinguishes *licensing reliance* (based on observable guarantees) from *explaining mechanism* (which requires white-box access).

  ### D3. Format Invariance (Robustness)
  *   **Requirement:** The attributed belief must persist across superficial changes to the prompt template, input modality, or output formatting. If the attribution vanishes when the surface form changes, it is an artifact, not a belief.
  *   **Motivating Case:** *(6) The Mirror.* (A system that predicts well only because the prompt template forces a specific completion pattern).
  *   **Status:** **Non-negotiable.** (Critical for reliance; artifacts are unsafe to rely on).
  *   **Camp Alignment:** **Tracking / Causal-Informational.** (Pragmatists risk failing here if they prioritize predictive success over stability).
  *   **Distinction Respected:** Distinguishes *representing a content* (stable) from *merely carrying information* about it (fragile/correlational).

  ### D4. Behavioral Priority over Avowal
  *   **Requirement:** When the system's explicit self-report ("I am guessing") contradicts its forced-choice discriminatory behavior ("I consistently select the correct option"), the documentation must attribute belief based on the behavior.
  *   **Motivating Case:** *(3) The Autobiographer.* (A model that denies knowledge but acts with high competence).
  *   **Status:** **Non-negotiable.** (Critical for safety/reliance).
  *   **Camp Alignment:** **Pragmatist / Tracking.** (Interpretivists might weigh avowal higher as part of a rational profile; Mechanists would look for the circuit).
  *   **Distinction Respected:** Distinguishes *licensing reliance* (based on capability) from *trusting self-description*.

  ### D5. Holistic Attribution (System-Level)
  *   **Requirement:** Attribution is permitted at the system level even if no single internal component (module, layer, head) encodes the content, provided the routing or interaction logic produces the content reliably.
  *   **Motivating Case:** *(5) The Committee.* (A router-scaffold system where deterioration is tracked by the ensemble, not a specific sensor).
  *   **Status:** **Preference.** (Pragmatist preference over Mechanist).
  *   **Camp Alignment:** **Pragmatist / Interpretivist.** (Mechanists require a localized substrate).
  *   **Distinction Respected:** Distinguishes *having a belief* (functional capacity) from *centrality* (how deeply embedded it is in the architecture).

  ### D6. Source Tagging (World vs. Corpus)
  *   **Requirement:** The documentation must specify whether the content is fixed by the state of the world (tracking) or fixed by the statistical regularities of the training corpus (testimony).
  *   **Motivating Case:** *(2) The Census-Taker.* (A model asserting a falsehood because its training community asserted it).
  *   **Status:** **Non-negotiable.** (Critical for reliance; users must know if the system is lying or mistaken).
  *   **Camp Alignment:** **Tracking / Causal-Informational.** (Pragmatists often collapse this if prediction is equal).
  *   **Distinction Respected:** Distinguishes *content fixed by the world* from *content fixed by the system's training corpus*.

  ### D7. Self/World Decoupling
  *   **Requirement:** Attributions must distinguish between beliefs about the external environment and beliefs about the system's own future outputs. High accuracy on the latter does not license reliance on the former.
  *   **Motivating Case:** *(4) The Oracle of Itself.* (A system fine-tuned on its own logs that predicts itself perfectly but the world poorly).
  *   **Status:** **Non-negotiable.** (Critical for reliance).
  *   **Camp Alignment:** **Tracking.** (Pragmatists risk conflating these if predictive score is the only metric).
  *   **Distinction Respected:** Distinguishes an attribution that *predicts system behavior* from one that *predicts world states*.

  ### D8. Lineage Agnosticism
  *   **Requirement:** The student model's beliefs are attributed to the student, not the teacher, even if the error profile is identical. The documentation should not describe the student as "simulating the teacher."
  *   **Motivating Case:** *(1) The Apprentice.* (Distilled model reproducing teacher errors on novel inputs).
  *   **Status:** **Preference.** (Mechanist preference over Pragmatist).
  *   **Camp Alignment:** **Mechanist.** (Pragmatists treat the input-output map as identical, so the belief is the same).
  *   **Distinction Respected:** Distinguishes *representing a content* (current system) from *carrying information* about a predecessor.

  ---

  ## 2. Tensions and Ruling Requirements

  ### The Fundamental Tension
  **Mechanistic Grounding vs. Operational Verifiability.**
  You suspect a tension between requiring an attribution to be answerable to what is *really going on inside* (Mechanist/Tracking) and requiring it to be available to someone with *only black-box access* (Documentation Constraint). This is correct and unavoidable.
  *   **Why:** True mechanistic grounding (e.g., verifying a specific circuit encodes "belief") requires weight access (violating D2). Pure black-box verifiability (e.g., behavioral consistency) cannot rule out spurious correlations like *The Mirror* case (violating D3) without exhaustive testing that is practically impossible.
  *   **Resolution for Documentation:** You must prioritize **Operational Verifiability (D2)** but enforce **Format Invariance (D3)** as a proxy for mechanism. If a belief survives adversarial prompt changes, it is *likely* mechanistically grounded enough for reliance, even if unproven.

  ### The Single Ruling Requirement
  **D4: Behavioral Priority over Avowal.**
  This requirement does the most work in ruling out the accounts people actually hold in industry.
  *   **Why:** Most current documentation defaults to trusting the model's text output (e.g., "I am an AI and cannot know this"). D4 forces the team to write "The system claims uncertainty but acts with high confidence," which directly contradicts the "behaves as if" camp's hesitation to ascribe belief, and the "believes" camp's tendency to trust the text. It forces the documentation to warn users about *capabilities* rather than *statements*, which is the primary safety failure mode in current deployments.

  ---

  ## 3. Contender Evaluation

  | Feature | **Dennettian Pragmatism** (Predictive Strategy) | **Davidsonian Interpretivism** (Rational Agent) | **Mechanistic** (Read-the-Weights) |
  | :--- | :--- | :--- | :--- |
  | **D1: Predictive Power** | **Pass.** (This is its definition). | **Mixed.** (Fails if system is irrational). | **Pass.** (If mechanism is understood). |
  | **D2: Observability** | **Pass.** (Relies on I/O). | **Pass.** (Relies on I/O). | **Fail.** (Requires weight access). |
  | **D3: Format Invariance** | **Fail.** (Accepts any predictive strategy, even brittle ones). | **Mixed.** (Depends on rationality constraints). | **Pass.** (Mechanisms are usually stable). |
  | **D4: Behavioral Priority** | **Pass.** (Actions speak louder). | **Fail.** (Avowals are key to interpretation). | **Pass.** (Circuits determine action). |
  | **D5: Holistic Attribution** | **Pass.** (Intentional stance applies to whole). | **Pass.** (Agent is the whole). | **Fail.** (Requires localized realization). |
  | **D6: Source Tagging** | **Fail.** (Indifferent to source if prediction holds). | **Mixed.** (Charity principle complicates falsehoods). | **Pass.** (Can trace data lineage). |
  | **D7: Self/World Decoupling** | **Fail.** (Prediction is prediction). | **Pass.** (Propositional attitudes distinguish content). | **Pass.** (Can separate input channels). |
  | **D8: Lineage Agnosticism** | **Pass.** (Function is identical). | **Pass.** (History irrelevant to current rationality). | **Fail.** (Causal history matters). |
  | **Verdict for Docs** | **High Utility.** Best for prediction, risky on stability. | **Low Utility.** AI is not a rational agent. | **Impossible.** Violates black-box constraint. |

  **Recommendation:** Adopt a **Pragmatist core** (for D1, D2, D4, D5) but harden it with **Tracking constraints** (for D3, D6, D7). Do not attempt a Mechanist account in user-facing documentation; reserve that for internal red-teaming reports.
