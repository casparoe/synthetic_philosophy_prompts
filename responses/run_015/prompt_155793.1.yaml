      *Let's look at (3).* "Artistic conviction should be somewhat immune to peer disagreement." This is pragmatic.
      *Let's look at (4).* "If i genuinely found my narrative instincts were systematicaly distorted, i'd have to rewrite." This is a counterfactual condition. "If I genuinely found..." How? If I ignore peers (3), I won't find out.

      *The Crucial Tension:* (3) protects the process; (4) demands a halt to the process. The bridge between them is the judgement of "systematic distortion." Who makes that judgement? If it's solely the author, (3) protects them from ever making it. If it's peers, (3) blocks them.

