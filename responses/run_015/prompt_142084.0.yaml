  8.  *(Self-Correction during drafting)*: Make sure I don't just solve the problem for them, but explain *why* the seminar is stalled so they can write about the stall itself or use the diagnosis to cut through it. The prompt asks for a diagnosis to help the paper *and* sanity.

      *   *Key Insight to emphasize:* The Exclusion Argument is actually an argument against *Non-Reductive Physicalism* generally, not just Philosophy of Mind. The seminar is stalled because they are treating it as a "Mind Problem" when it is a "Metaphysics of Science Problem."

  9.  **Final Polish:** Check against constraints. "Tell me which of my hypotheses is right, which one is confused." "Diagnosis with reasons." "What would actually count as progress."

