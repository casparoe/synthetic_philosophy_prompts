prompt: |-
  I've come round to Sartre's view that radical freedom is unavoidable and that bad faith is essentially the refusal to own your transcendence — either by hiding behind your facticity (claiming 'I can't help it, that's just how I am') or by pretending your facticity doesn't constrain you at all. I want to map out what would genuinely count against this whole package. Not the tired 'people don't feel free' objection, but specifically: what do cases of deeply internalised social roles — say, caste or gender norms that feel like destiny — do to the claim that we're always transparently free? How does the later Sartre's idea of the practico-inert, where past actions crystallise into structures that seem to dictate present choices, interract with this: does it save the view or collapse it into determinism? Also, what about findings from cognitive science on automaticity and implicit bias — if a large part of behaviour is driven by processes the subject doesn't access, is that bad faith or just limited freedom? Rank the defeaters from fatal to merely awkward, and say which ones Sartre's defenders would conceed as counting against them vs dismiss as misunderstandings of the pre-reflective. Please answer in British English — apologies if there's a typo or two in this prompt.
