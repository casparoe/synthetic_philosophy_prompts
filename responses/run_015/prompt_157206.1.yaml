          *   *Verdict:* Moderate/Significant. It saves the *system* by modifying the *claim*. It concedes that radical freedom is often impotent.
      *   **Defeater 3: Cognitive Science (Automaticity/Implicit Bias).**
          *   *The Challenge:* Non-conscious processes drive behaviour. Sartre assumes transparency of consciousness (pre-reflective cogito). If the mind is opaque to itself, bad faith (which requires knowing the truth to hide it) becomes impossible or redefined.
