answer: |-
  ### Pre-Analysis Sketch: Moving Parts and Evidence Thresholds

  Before mapping the cases, I need to stress-test your operationalization to see where it breaks.

  **1. The Insurance Test (a)**
  *   **Moving Part:** Counterfactual stability. We aren't measuring current popularity; we are measuring the *slope* of the relationship between popularity and tenure.
  *   **Evidence Required:** We need to see a decoupling. If vote share drops, seat share or executive power must not drop proportionally.
  *   **Failure Mode:** If an incumbent loses power immediately upon losing a majority (even a slim one), the test fails, regardless of how nasty the rhetoric was. Backsliding requires *stickiness*.

  **2. The Two-Step Taxonomy (b)**
  *   **Moving Part:** Reversibility. Rule changes (electoral maps) are hard to reverse but require a majority to enact. Referee capture (courts/audit) removes the entity that adjudicates the reversal.
  *   **Evidence Required:** Legal continuity vs. personnel discontinuity. Are the rules the same but the umpires swapped? Or are the rules changed to ensure the umpires can't be swapped?
  *   **Failure Mode:** If referee capture happens without rule changes, it's a coup or purge, not necessarily backsliding. If rule changes happen without referee capture, it's ordinary partisan warfare. The *combination* is the signal.

  **3. The Restoration Trap (c)**
  *   **Moving Part:** The paradox of clean hands. To restore the referees, the new majority must use the captured referees or bypass them.
  *   **Evidence Required:** A new government hesitating to reform because the legal path is blocked by the very institutions they are trying to reform.
  *   **Failure Mode:** If a new government can sweep out the old referees via simple legislation without constitutional crisis, the trap is false. The trap only exists if the *legal* path to restoration is structurally compromised.

  **4. The Symmetry/Partisan Charge**
  *   **Moving Part:** Intent vs. Structure. You rightly flag "intent to entrench" as unverifiable. We must rely on *durability* and *scope*. Does the measure survive a change in power? Does it apply to the actor enacting it if they lose?
  *   **Evidence Required:** Asymmetry in *referee* targeting. Both sides play the game (a), but does one side target the *rules of the game* (b) more systematically?

  **5. Who Decides?**
  *   **Moving Part:** Jurisdiction of judgment.
  *   **Silence:** Your framework is structural. It cannot judge *policy* (taxes, welfare) or *normative legitimacy* (did the people *want* this?). It only judges the *machinery of removal*.

  ***

  ### Analysis

  #### 1. The Paradigm: Hungary (Post-2010)
  **Mapping:**
  *   **Insurance (a):** Fidesz used its supermajority to pass an electoral law that favored large parties and redrew districts. Even when Fidesz's vote share dipped in subsequent elections, their seat share remained supermajority-level. The machinery converting unpopularity to removal was degraded.
  *   **Taxonomy (b):** They did both. Rule changes (electoral law, media council composition) were locked in. Referee capture (Constitutional Court expansion, retirement age changes for judges) ensured those rule changes couldn't be challenged. The Court was packed *before* the controversial laws were fully cemented, insulating the legislation from review.
  *   **Restoration (c):** The opposition cannot reverse this without a two-thirds majority, which the electoral system makes mathematically improbable even with a popular vote win. The trap is closed.

  **Verdict:** Your framework describes this perfectly. It distinguishes Fidesz from a standard hegemonic party because the legal architecture itself was rewired to sustain power independent of vote share fluctuations.

  #### 2. The Stress Case: Poland (2015–2024)
  **Mapping:**
  *   **PiS Phase (2015–2023):**
      *   **Insurance (a):** PiS did not achieve Fidesz-level insulation. They remained removable via election, which happened in 2023. However, they attempted to degrade the machinery by politicizing the state media and public prosecutor's office.
      *   **Taxonomy (b):** This is the core of the PiS project. They did not rewrite the constitution (lack of supermajority). Instead, they focused almost exclusively on **Referee Capture**. The Constitutional Tribunal was neutralized by refusing to seat judges and passing laws to reorganize the bench. The National Council of the Judiciary (NCJ) was restructured to allow parliamentary selection of judicial appointees rather than peer selection. This made the *ordinary courts* vulnerable to politicization without changing the constitution.
  *   **Tusk Phase (2023–Present):**
      *   **Restoration Trap (c):** This is where your test earns its keep. The new coalition won the legislature but faces a PiS-aligned President (veto power) and a judiciary staffed under the new NCJ rules.
      *   **The Dilemma:** To restore the rule of law, Tusk's government must declare the PiS judicial appointments illegitimate.
          *   *Option 1 (Legal Path):* Pass laws to restructure the NCJ. **Result:** Blocked by Presidential veto. Requires 60% majority to override (unavailable).
          *   *Option 2 (Structural Path):* Ignore the captured Tribunal's rulings or pass legislation that specifically targets the status of judges appointed under PiS. **Result:** PiS and the EU warn this violates judicial independence. It looks like *new* referee capture.
      *   **Evidence:** The Tusk government has had to proceed incrementally, often accepting the validity of some PiS-era appointments to avoid a constitutional crisis, while trying to "starve" the captured bodies of funding or jurisdiction. They are navigating the trap, not springing it.

  **Verdict:** **Confirmation, not Counterexample.** The fact that reversal is slow, legally fraught, and opens the new government to accusations of authoritarianism *proves* the Restoration Trap exists. If backsliding were just "bad policies," a new majority could repeal them in a semester. The fact that they cannot cleanly restore the referees without risking democratic backsliding themselves confirms that PiS successfully weaponized the structure. The trap is real.

  #### 3. The Symmetry Test: United States
  **Mapping:**
  *   **Insurance (a):**
      *   **Both Parties:** Gerrymandering (MD/IL vs. NC/TX/OH) raises incumbent retention probability conditional on unpopularity. This is symmetric. Both parties degrade the machinery of removal in safe seats.
      *   **Divergence:** Voting access laws. One party tends to pass laws restricting access (ID requirements, mail-in limits) citing fraud prevention; the other expands access citing participation. The *insurance* effect is stronger in the restriction model (raises the cost of voting for demographics likely to oppose the incumbent).
  *   **Taxonomy (b):**
      *   **Referee Capture:** This is the asymmetry point.
      *   **Federal Level:** Court-packing is threatened by both sides but never enacted. Judicial appointments are partisan but tenure is secure.
      *   **State Level (The Critical Variable):** Election administration referees (Secretaries of State, local boards) are partisan in most states.
      *   **The Divergence:** In the 2020 cycle, one party attempted to move beyond *rule changes* (voting laws) to *referee capture* regarding the *certification of results*. Efforts to install loyalists in election administration positions specifically to overturn or delay certification constitute Referee Capture. The other party has not reciprocated with an equivalent structural move to seize control of election certification machinery for the purpose of overturning losses.
      *   **Irreversibility:** Gerrymandering is reversible with a flip of the state legislature. Capturing the certification process makes the flip itself contestable.

  **Verdict:** **Asymmetric.**
  *   **Feature Making the Difference:** The *scope* of Referee Capture. Both sides engage in Rule Changes (a) via gerrymandering. Only one side has systematically pursued Referee Capture (b) regarding the *adjudication of election outcomes* themselves.
  *   **Is "Intent" Smuggled In?** No. The evidence is in the *durability* and *target*. If Party A passes a voting law, and Party B wins and repeals it, that's normal politics. If Party A passes a law making it harder for Party B to certify a win, and Party B cannot repeal it because the certification body is now controlled by Party A appointees, that is structural backsliding. The US shows symmetric *rule-changing* but asymmetric *referee-capturing* regarding the transfer of power.

  #### 4. Who Decides? (Jurisdictions and Silence)
  Your framework is structural, which means it is silent on legitimacy. Here is the division of labor:

  *   **Domestic Voters:** Decide **Popularity**. They determine if the government is unpopular. Your framework takes this as a given input. They *cannot* decide on Backsliding, because backsliding is designed to survive their verdict.
  *   **Domestic Courts:** Decide **Legality**. If the referees are captured, they will rule the backsliding measures legal. In Poland, the captured Tribunal ruled PiS reforms legal. In the US, the Supreme Court rules on voting laws. They determine if the move fits the *existing* constitution, not if it degrades democracy.
  *   **EU/International Institutions:** Decide **Treaty Compliance**. They can withhold money (conditionality) or issue Article 7 warnings. They determine if the state is violating *international* commitments. They cannot determine domestic legitimacy.
  *   **Comparative Political Science:** Decides **Democratic Quality**. This is where your framework lives. It determines if the *structure* allows for alternation of power.

  **Where Your Framework is Silent:**
  1.  **Policy Content:** It does not tell us if the government is doing good or bad things (taxes, war, welfare). A backsliding government can build hospitals.
  2.  **Initial Mandate:** It does not judge whether the initial election that brought the backslider to power was fair. It assumes the starting point is democratic.
  3.  **Normative Legitimacy:** It cannot answer "Who speaks for the people?" If the people *want* the referees captured (to punish corrupt judges, for example), your framework calls it backsliding, but the voters call it democracy. It privileges *liberal* constraints over *majoritarian* will.

  #### 5. Conclusion: Does "Backsliding" Pick Out Something Real?
  Yes. Your operationalization successfully distinguishes "Democratic Backsliding" from "Partisan Policy Shifts."
  *   **Policy Shift:** Party A wins, passes laws, Party B wins, repeals laws. (Restoration is easy).
  *   **Backsliding:** Party A wins, captures referees, passes laws, Party B wins, cannot repeal laws because referees block it. (Restoration is trapped).

  The Poland case proves the concept is not just a label for "government I dislike," because the *same* actors (the opposition) who cried backsliding are now constrained by the very mechanisms they criticized, unable to undo them without risking their own democratic credentials. That structural stickiness is the fingerprint of the phenomenon.

  ***

  ### The Single Hardest Objection

  **"The Majoritarian Mandate Objection"**

  > "Your framework assumes that 'democracy' means 'liberal democracy with constraints on the majority.' But if a majority of voters explicitly wants to dismantle the independent referees—because they view them as elitist, corrupt, or obstacles to the popular will—and they vote for a party that promises to do exactly that, your test flags this as 'backsliding.'
  >
  > By your definition, the voters are wrong about what democracy is. You are defining democracy as a specific set of institutions (independent courts, neutral auditors) rather than the mechanism of popular choice. If the people choose to burn down the referees, calling that 'backsliding' is just a technocratic way of saying 'the people voted incorrectly.' You haven't proven backsliding is happening; you've proven that your preferred version of liberalism lost a vote."
