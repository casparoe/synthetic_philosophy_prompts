answer: |-
  **Diagnosis: Dissolving the Paradoxes**
  Your friend is right about the logic, but wrong about the danger. The Lottery Paradox assumes belief is binary and closed under conjunction (if you believe *A* and believe *B*, you believe *A-and-B*). In journalism, neither holds. You do not believe the *conjunction* of all 500 claims; you warrant each individually. The Preface Paradox isn't a contradiction; it's a distinction between *local warrant* (this claim is supported) and *global infallibility* (no human process is error-free).

  The goal isn't logical certainty; it's **warranted assertibility**. You are not mapping reality; you are managing risk. The procedure below treats verification as an engineering constraint, not a truth condition.

  **I. Claim-Level Protocol**

  **1. Confidence Bands (No Numbers)**
  Assign each claim a band based on source quality and corroboration.
  *   **Green (Flat Assertion):** Direct document, multiple independent sources, or physical evidence. No reasonable alternative explanation.
  *   **Yellow (Hedge/Attribute):** Single source, circumstantial chain, or conflicting accounts. Use "according to," "appears to," or "documents suggest."
  *   **Red (Cut/Unplaced):** Speculation, single anonymous source without corroboration, or known gaps.
  *   **Unplaced:** If you cannot assign a band after 20 minutes of discussion, default to Yellow. This is judgment wearing a lab coat: you are admitting uncertainty without halting production.

  **2. Stakes-Sensitive Thresholds**
  Epistemically, truth doesn't change with stakes. Pragmatically, *assertion* does. You are not asking "Is this true?" but "Is this safe to print?"
  *   **Low Stakes (Dates, Titles):** Green band suffices for Flat Assertion.
  *   **High Stakes (Dishonesty, Legal Liability):** The Green bar rises. "Strong but not airtight" is insufficient for Flat Assertion on allegations of misconduct. Downgrade to Yellow (Hedge) or cut. Do not move the threshold; move the *requirement for evidence*. If the stakes are high, you need a second independent source to reach Green.

  **3. The Shared-Source Check (Correlated Clusters)**
  Naive multiplication fails when claims share a root. If six claims rely on one leaked document, they are not six independent bets; they are one bet with six payouts.
  *   **Rule:** Group claims by primary source. Assess the *source's* reliability, not just the claims'. If the source wobbles, the entire cluster downgrades to Yellow. If the source is singular and high-stakes, the cluster is a single point of failure.

  **4. Compound Claims**
  Do not assert conjunctions (*A and B*) unless the link is sourced.
  *   **Rule:** If you assert "X did Y because of Z," you need evidence for the *because*, not just X and Z separately. If you only have evidence for X and Z, split them or hedge the causal link ("X did Y; documents suggest Z was the motive").

  **II. Global Protocol**

  **1. The Headline Pass**
  Headlines often smuggle in universal quantifiers ("The Agency Ignored 47 Complaints").
  *   **Rule:** Identify the logical structure. Is it a conjunction (All 47 were ignored)? If so, the weakest link dictates the headline's validity. If four are ambiguous, "47" is technically false.
  *   **Fix:** Weaken the quantifier ("Dozens," "At least 43") or the verb ("Failed to act on" vs. "Ignored"). A narrative summary is safer than a count if the count is fragile.

  **2. The Preface Note**
  Standing behind every claim while expecting error is coherent if you distinguish *effort* from *outcome*.
  *   **Wording:** "We stand by our reporting," followed by "We welcome corrections." Do not write "There are likely errors here." That invites litigation. Write: "Errors are possible despite rigorous verification." This acknowledges the Preface Paradox without handing critics a weapon.

  **3. Stop and Handoff**
  *   **Stop:** If a High-Stakes claim rests on a Single-Source Cluster (Red), cut it. No procedure saves a lawsuit.
  *   **Handoff:** If the evidence is Green but the *risk* is existential (e.g., truthful but could cause violence or collapse a vital program), this is not epistemology. It is values. Hand to the Managing Editor.

  **III. Test Cases**

  **(1) Regional Office Destroyed Records (Cluster Risk)**
  *   **Analysis:** Six claims lean on one leaked document. This is a Shared-Source Cluster.
  *   **Verdict:** Treat as one unit. If the document is authentic (Green), all six pass. If authenticity is disputed or unverified (Yellow), all six must be hedged ("Documents indicate...").
  *   **Action:** Verify the leak's provenance. If you cannot verify the document itself outside the leak, downgrade the cluster to Yellow. Do not flatly assert destruction based solely on the document's say-so.

  **(2) Official Signed Off on Fake Inspection (High Stakes)**
  *   **Analysis:** Allegation of dishonesty against a named individual. High stakes. Evidence is "strong but not airtight."
  *   **Verdict:** Under the Stakes Protocol, "not airtight" cannot support Flat Assertion for misconduct.
  *   **Action:** Hedge. "Documents show she signed off; inspectors say the visit never occurred." Attribute the dishonesty to the conflict in evidence, not your voice. Do not publish "She knew" flatly.

  **(3) Headline: "Agency Ignored 47 Complaints" (Conjunction Risk)**
  *   **Analysis:** This is a universal conjunction. It implies all 47 were *ignored*. You admit 4 might be "lost." "Lost" ≠ "Ignored."
  *   **Verdict:** The procedure says **change it**. "47 Ignored" is falsifiable by the 4 ambiguous cases.
  *   **Action:** Publish "Agency Failed to Act on 47 Complaints" (covers both ignoring and losing) or "At Least 43 Complaints Ignored." If you must keep the number, weaken the verb: "47 Complaints Preceded Explosion." Do not keep "Ignored 47" if 4 are ambiguous. It is logically vulnerable and dishonest to your own standards.

  **Final Note on Judgment**
  Steps involving "High Stakes" classification and "Source Reliability" are judgment wearing a lab coat. No algorithm tells you if a source is lying. Use the bands to force consensus, not to replace thinking. If two verifiers disagree on a band, escalate. That friction is the only real safety mechanism you have.
