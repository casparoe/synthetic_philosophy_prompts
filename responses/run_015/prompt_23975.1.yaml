answer: |-
  The phenomenon you are describing is sophisticated and well-observed. You are correct that standard logical fallacies like *equivocation* (using a term in two different senses within a single argument to deceive) or *umbrella terms* (neutral categories) do not capture the strategic, structural function of the phrase.

  The established concept that fits your description best comes from political theory and discourse analysis: **The Empty Signifier** (sometimes closely related to the **Floating Signifier**).

  Here is an analysis of why this term fits, how it relates to adjacent concepts like the **Ideograph** and **Essentially Contested Concepts**, and where the boundary lies between this strategic maneuvering and good-faith disagreement.

  ### 1. The Primary Term: Empty Signifier
  **Origin:** Post-structuralist political theory, specifically the work of **Ernesto Laclau** and **Chantal Mouffe** (Essex School of discourse analysis).

  **Why it fits:**
  An empty signifier is a signifier (a word or phrase) that has no precise, fixed signified (concept/content), yet functions to unify a political group.
  *   **The Container Metaphor:** You described the phrase as a "container that gets refilled." In Laclauian theory, an empty signifier works by evacuating specific content so that it can represent the "fullness" of a community or ideal. "Western values," "The People," "Freedom," or "Justice" often function this way.
  *   **Claim to Universality:** You noted that speakers treat it as having a "single, stable, knowable referent." This is crucial. For an empty signifier to work politically, it must claim to represent the universal good. If the traditionalist admits "Western values" only means "Christian heritage," they lose the universal claim. If the liberal admits it only means "secular rights," they lose the cultural claim. Both *need* the term to appear full and stable to claim they represent the "true" West.
  *   **Hegemonic Function:** The struggle over the term is not a mistake; it is the point. Politics, in this view, is the struggle to fill the empty signifier with your particular content and pass it off as the universal truth.

  **Where it stops applying:**
  The concept stops applying when the term is successfully operationalized. If two speakers sit down and agree, "For the purpose of this bill, 'Western values' refers specifically to Articles 1–5 of the Treaty of Rome," the signifier is no longer empty. It has become a **stipulative definition**. The "Empty Signifier" dynamic exists only as long as the vagueness is preserved to maintain coalition or rhetorical power.

  ### 2. The Rhetorical Term: Ideograph
  **Origin:** Rhetorical theory, specifically **Michael McGee** (1980).

  **Why it fits:**
  If "Empty Signifier" explains the *structural* role of the term, "Ideograph" explains its *argumentative* use. An ideograph is a high-order abstraction that represents a commitment of a particular culture (e.g., "Liberty," "Security," "Rule of Law").
  *   **Justification of Conduct:** McGee argues ideographs are used to justify behavior or policy. When Speaker A uses "Western values" to restrict immigration, or Speaker B uses it to intervene abroad, they are using the ideograph to warrant action without needing to prove the specific premises.
  *   **Snapshot of Belief:** Ideographs function as a shorthand for a complex worldview. The audience is expected to "fill in the blanks" with their own understanding, which allows the speaker to bypass scrutiny.

  **Distinction:**
  While an Empty Signifier focuses on the *political unity* the term creates (uniting disparate groups under one banner), an Ideograph focuses on the *persuasive power* (using the term to shut down debate). Your example leans slightly more toward **Empty Signifier** because you highlight the incompatible contents (traditionalism vs. liberalism) vying for the same label, which is a hegemonic struggle.

  ### 3. The Philosophical Near-Miss: Essentially Contested Concept
  **Origin:** **W.B. Gallie** (1956).

  **Why it is close but distinct:**
  Gallie described concepts like "democracy," "art," or "justice" where disagreement is inherent to the concept itself. There is no single "correct" definition because the concept is evaluative and complex.
  *   **The Difference:** In a good-faith engagement with an Essentially Contested Concept, the speakers *acknowledge* the contestability. They might say, "My conception of democracy differs from yours, and here is why mine is better."
  *   **Your Observation:** You noted that speakers treat the referent as "stable" and treat others as "misusing it." This suggests the term is being treated *as if it were not contested*, even though it is. This is a **weaponized Essentially Contested Concept**. The speakers are exploiting the contestability while denying it to gain rhetorical advantage.

  ### 4. Boundary Cases: Strategic Ambiguity vs. Good-Faith Disagreement

  You asked where this ends and ordinary disagreement begins. The boundary lies in **operationalizability** and **falsifiability**.

  **Good-Faith Disagreement:**
  *   **Operationalization:** A speaker is willing to break the term down into component parts to test them. ("When I say Western values, I am specifically referring to the legal precedent set by Case X.")
  *   **Acknowledgment of Complexity:** The speaker admits the term has evolved or has multiple strands. ("Traditionally this meant X, but modern interpretations include Y.")
  *   **Risk:** The speaker puts the definition at risk. If evidence shows "Western values" do not lead to Outcome Z, they might adjust the definition or the policy.

  **The "Empty Signifier" Configuration (Your Phenomenon):**
  *   **Teleological Definition:** The meaning of the term shifts to match the desired conclusion. If the goal is restriction, the term means "order"; if the goal is intervention, the term means "rights." The conclusion dictates the definition, not vice versa.
  *   **Immunization:** The term is used to shield the argument from critique. Challenging the policy is framed as attacking the "value" itself (e.g., "You oppose this restriction? Then you oppose Western order.").
  *   **Refusal to Specify:** When pressed for a concrete definition, the speaker retreats to abstraction ("You know what I mean," or "It's the sum of our history").

  ### Summary Recommendation

  If you need a single established term, **Empty Signifier** is the most precise fit for the *structural* phenomenon you described (a container claiming universality while holding incompatible particularities).

  If you are analyzing the *rhetorical move* in a specific debate, **Ideograph** is the better tool.

  If you wish to coin a descriptive phrase for a general audience who may not know discourse theory, you might call it **Hegemonic Ambiguity** or **Strategic Universality**.

  **The Diagnostic Test:**
  To determine if a term is functioning this way, ask: *Does the definition of the term remain constant when the political objective changes?*
  *   If **Yes**: It is a standard concept (potentially an Essentially Contested one).
  *   If **No**: It is an Empty Signifier/Ideograph doing strategic work. The "stability" the speakers claim is a rhetorical illusion required to maintain the term's power.
