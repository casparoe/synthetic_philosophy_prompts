      *   **Key Characteristic:** Each speaker treats the phrase as having a *single, stable, knowable referent*, accusing others of misuse, even though the content shifts strategically based on the argument being made.
      *   **Function:** It acts as a "container" refilled with different commitments but wielded as a fixed signifier.
      *   **Question:** Is there an established term for this? If so, which one fits best and what are its limits? If not, what would be a good name, and how does it differ from good-faith disagreement?
      *   **Rejected Candidates:** Equivocation (usually implies one person shifting meaning), Moving the Goalposts (about standards of proof), Umbrella Term (too neutral/descriptive).

  2.  **Brainstorming Potential Concepts:**

      *   *Linguistic/Semantic:* Empty Signifier, Floating Signifier, Signifier without a Signified. (Semiotics/Post-structuralism).
      *   *Rhetorical/Logical:* Equivocation (already rejected by user, but worth revisiting in a specific context), Persuasive Definition, Stipulative Definition.
      *   *Political Science/Ideology:* Hegemonic Signifier, Nodal Point, Ideograph, Essentially Contested Concept.
      *   *Cognitive Science:* Cluster Concept, Family Resemblance (Wittgenstein).
      *   *Sociological:* Boundary Work, Symbolic Boundary.

  3.  **Evaluating the Candidates:**

      *   **Essentially Contested Concept (Gallie):** This is a strong contender. It describes concepts (like "democracy," "justice," "art") where disagreement is inherent to the concept itself. *Limit:* Gallie usually implies a shared recognition of the contestability. The user notes that speakers treat it as *stable* and accuse others of misuse. ECCs acknowledge the dispute; the user's phenomenon involves *denying* the dispute while exploiting it.
      *   **Empty Signifier / Floating Signifier (Laclau/Mouffe, Lévi-Strauss):** This fits the "container" metaphor perfectly. An empty signifier is a signifier that has no precise meaning but unifies a chain of other signifiers. It allows diverse groups to rally around a symbol ("The People," "Freedom") while projecting their own meanings. *Fit:* Very high. It captures the strategic vagueness and the claim to universality.
      *   **Ideograph (McGee):** A rhetorical term for a high-order abstraction representing a commitment (e.g., "Liberty," "Security"). It functions to justify conduct. *Fit:* Good, specifically for political rhetoric. It explains how the term justifies action despite vagueness.
      *   **Persuasive Definition (Stevenson):** Redefining a term with emotive meaning to sway argument. *Limit:* Usually implies a conscious redefinition. The user describes a broader systemic phenomenon where the term *already* exists in this state.
      *   **God Term (Burke):** A term that holds ultimate authority and stops inquiry. "Western values" could be one, but "God Term" usually implies a hierarchy of terms.
      *   **Polysemy:** Just means "many meanings." Too neutral. Doesn't capture the *strategic* denial of multiplicity.

  4.  **Selecting the Best Fit:**

      *   **Top Choice:** **Empty Signifier** (or **Floating Signifier**). This comes from discourse theory (Ernesto Laclau, Chantal Mouffe). It perfectly describes a term that is structurally necessary for a political project but lacks fixed content, allowing different groups to invest it with their own demands while claiming it represents the "whole."
      *   **Strong Runner-Up:** **Ideograph**. This is more rhetorical (Michael McGee). It focuses on how the term functions in public argument to justify power.
      *   **Philosophical Context:** **Essentially Contested Concept**. Important to mention because it's the standard analytic philosophy answer, but needs to be distinguished based on the "bad faith/stable referent" aspect the user noted.

  5.  **Drafting the Response:**

      *   **Acknowledge the Insight:** Validate the user's observation. It's a sophisticated linguistic/political observation.
      *   **Primary Term:** **Empty Signifier** (Laclau/Mouffe). Explain why: It unifies a group by being vague enough to include everyone, but specific enough to exclude enemies. The "container" metaphor matches exactly.
      *   **Secondary Term:** **Ideograph** (McGee). Focus on the rhetorical function (justifying policy).
      *   **Tertiary Term:** **Essentially Contested Concept** (Gallie). Contrast it. Gallie says "we know we disagree." The user's phenomenon says "we disagree because you are wrong about the *one* truth."
      *   **Distinction from Good Faith:** How to tell the difference?
          *   *Good Faith:* Willingness to refine definition, acknowledges complexity, operationalizable.
          *   *The Phenomenon:* Definition collapses under scrutiny, used to shut down debate, content shifts to match the conclusion (teleological).
      *   **Proposed Name (if none existed):** "Strategic Universality" or "Hegemonic Signifier." But since "Empty Signifier" exists, stick with that.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful with "Empty Signifier." In strict Laclauian theory, it becomes empty *through* political struggle. The user describes it as *already* functioning this way. This fits.
      *   *Nuance:* The user mentions the speakers treat it as *stable*. This is the key. An empty signifier *pretends* to be full. It claims to represent the "fullness of the community" (Western Values = All Good Things) while actually being a site of struggle.
