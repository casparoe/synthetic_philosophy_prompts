answer: |-
  # The Assertion Diagnostic Instrument

  **Purpose:** To locate your position in the logical space of assertion norms without presupposing the standard labels.
  **Method:** Part A determines the *architecture* of the norm you accept. Part B determines the *epistemic threshold* of that norm. The Scoring Key combines these to identify your committed view.

  ---

  ## Part A: The Meta-Normative Decision Tree

  Answer the following six questions. Do not worry about how the answer affects your final classification; answer according to your immediate philosophical intuition.

  **Q1. Constitutivity:** Is there a rule that makes an utterance an assertion *in virtue of* satisfying it (like the rules of chess make a move a castling move), or is assertion a pre-existing act that is merely *evaluated* by various standards (like a speech evaluated by standards of rhetoric, truth, and morality)?
  *   (A) Constitutive: Without the rule, it isn't assertion.
  *   (B) Regulative: It is assertion anyway; the rule just rates it.
  *   (C) Deflationary: There is no specific norm of assertion beyond general norms of communication or belief-induction.

  **Q2. The Penalty:** If the norm is violated, what is the status of the assertion?
  *   (A) Incorrect Move: The assertion is "out of bounds" or void, analogous to an illegal move in a game.
  *   (B) Blameworthy: The assertion stands, but the speaker is open to criticism.
  *   (C) Neither: Violation implies no specific normative failure unique to assertion.

  **Q3. Access:** Must the speaker be able to tell, from the inside and without further empirical investigation, that they satisfy the norm?
  *   (A) Yes (Internalist): If I can't tell I meet the norm, I shouldn't assert.
  *   (B) No (Externalist): I can satisfy the norm even if I don't know I satisfy it.

  **Q4. Stability:** Does the required epistemic strength change depending on the practical stakes of being wrong?
  *   (A) Invariant: The bar is the same whether the stakes are low or high.
  *   (B) Sensitive: The bar rises as the cost of error rises.

  **Q5. Relativisation:** Is the norm uniform across all subject matters and institutional settings, or does it shift based on the context of the speaker or the audience?
  *   (A) Uniform: One norm for all assertions.
  *   (B) Contextual: The norm shifts with the speaker's context.
  *   (C) Relativist: The norm shifts with the assessor's/audience's context.

  **Q6. Direction:** Does the norm attach strictly to the speaker's epistemic position, or can an assertion be improper because the *audience* is already in a certain position (e.g., already knows the content)?
  *   (A) Speaker-Relative: Only my state matters.
  *   (B) Audience-Sensitive: The audience's state can render my assertion improper.

  ### Logical Space Map: Occupied and Empty Cells

  Based on your answers above, you have located yourself in a region of logical space. Below is the map of that space, diagnosing empty cells.

  | Architecture | Penalty | Access | Stability | Status | Label |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Constitutive** | Incorrect Move | Externalist | Invariant | **Occupied** | *Standard Robust Norms* (e.g., Knowledge, Truth) |
  | **Constitutive** | Incorrect Move | Internalist | Invariant | **Occupied** | *Internalist Robust Norms* (e.g., Rational Credibility) |
  | **Constitutive** | Incorrect Move | Externalist | Sensitive | **Occupied** | *Stakes-Sensitive Norms* |
  | **Constitutive** | Blameworthy | Any | Any | **Sparse** | *Weak Constitutivism* (Rare; risks collapsing into Regulative) |
  | **Regulative** | Blameworthy | Any | Any | **Occupied** | *Moral/Prudential Accounts* (Assertion governed by lying/harm norms) |
  | **Deflationary** | Neither | N/A | N/A | **Occupied** | *No-Norm View* (Assertion governed only by Gricean/intentional norms) |
  | **Constitutive** | Neither | Any | Any | **Empty** | *Incoherent:* A constitutive rule without a penalty for violation is not a rule. |
  | **Regulative** | Incorrect Move | Any | Any | **Empty** | *Category Error:* Regulative standards criticize moves; they do not define move identity. |

  *   **Diagnosis of Empty Cells:**
      *   *Constitutive/No Penalty:* If violating the rule doesn't make the move incorrect or the player blameworthy, the rule is not actually governing the practice. This cell is theoretically unstable.
      *   *Regulative/Incorrect Move:* If a standard renders a move "void" or "illegal," it is functioning constitutively, not merely regulatively.

  *   **Instruction:** If you landed in an **Empty** cell, you must revise either your view of the norm's status (Q1) or its penalty (Q2) before proceeding to Part B. If you landed in **Deflationary (Q1-C)**, you may skip Part B and proceed to the *Deflationary Leaf* in the Scoring Key.

  ---

  ## Part B: The Ten-Item Quiz

  For each case, select the verdict that best matches your intuition.
  **Verdict Options:**
  1.  **Defective:** The assertion is improper/wrong, even if the speaker is blameless.
  2.  **In Order:** The assertion is fully proper.
  3.  **Infelicitous:** The assertion is not defective (normatively), but it is pointless, misleading, or pragmatically odd.

  **Case 1: The Unlucky Truth (Gettier)**
  Sara has excellent evidence for *p* (a justified true belief), but her evidence is connected to the truth only by luck (e.g., she sees a working clock that stopped exactly 12 hours ago). She asserts *p*.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 2: The Lottery Claim**
  Henry holds one ticket in a fair million-ticket lottery. The draw has occurred but results are unpublished. He asserts, "My ticket lost," based solely on the odds.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 3: High Stakes**
  Elena has the same evidence for *p* as in a low-stakes context (e.g., she checked the bank website this morning). However, today the stakes are incredibly high (if *p* is false, she ruins a friend's life). She asserts *p*.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 4: The Blameless Error**
  Marcus has impeccable evidence for *p* (every test confirms it). Unbeknownst to anyone, *p* is false due to a systematic, undetectable calibration error. He asserts *p*.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 5: The Self-Fulfilling Intention**
  You are undecided whether to go to the gym. You say to a friend, "I will go to the gym," and hearing yourself say this settles your intention, making it true. At the moment of assertion, it was not yet determined.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 6: The Redundant Assertion**
  You are in a room with a group. Everyone, including you, already knows *p* is true. You assert *p* flatly, with no new context or irony.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 7: The Borderline Vague**
  A patch is borderline red. You assert, "The patch is red." There is no fact of the matter regarding its truth.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 8: The Institutional Voice**
  An automated weather system asserts, "It will rain," based on data models. No single human individual currently knows it will rain, but the system is reliable.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 9: The Hedged Assertion**
  A speaker says, "I'm not certain, but *p*," explicitly disclaiming knowledge, though they actually have strong evidence for *p*.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  **Case 10: The Clinical Prognosis**
  A doctor tells a patient, "You will recover," based on statistical likelihoods appropriate for medical practice, though she does not know it for certain.
  *   [ ] Defective
  *   [ ] In Order
  *   [ ] Infelicitous

  ---

  ## Scoring Key

  ### Step 1: Determine the Family (From Part A)
  *   **If Q1 = (C) Deflationary:** You hold the **No-Norm View**. Assertion is governed only by the intention to induce belief and general Gricean maxims. Stop here.
  *   **If Q1 = (B) Regulative:** You hold a **Moral/Prudential View**. Assertion is governed by norms of honesty, harm, or cooperation, not a specific epistemic norm. Stop here.
  *   **If Q1 = (A) Constitutive:** Proceed to Step 2.

  ### Step 2: Tally the Quiz (From Part B)
  Count your selections for **Defective (D)**, **In Order (IO)**, and **Infelicitous (IF)**.

  | Item | Discriminates Between | If you chose **Defective**... | If you chose **In Order**... |
  | :--- | :--- | :--- | :--- |
  | **1 (Unlucky)** | Knowledge vs. Truth/Justification | Points to **Knowledge Norm** | Points to **Truth/Justification Norm** |
  | **2 (Lottery)** | Knowledge vs. High Probability | Points to **Knowledge Norm** | Points to **Rational Credibility Norm** |
  | **3 (Stakes)** | Invariantism vs. Stakes-Sensitive | Points to **Stakes-Sensitive Norm** | Points to **Invariantist Norms** |
  | **4 (Error)** | Truth vs. Epistemic Norms | Points to **Truth Norm** | Points to **Knowledge/Justification Norm** |
  | **5 (Future)** | Truth vs. Knowledge of Intention | Points to **Truth Norm** (if false at time) | Points to **Knowledge Norm** (if known intent) |
  | **6 (Redundant)** | Knowledge vs. Truth (Need to Know) | Points to **Knowledge Norm** | Points to **Truth Norm** |
  | **7 (Vague)** | Truth-Value Gaps vs. Epistemicism | Points to **Truth Norm** (if no truth) | Points to **Warrant/Knowledge Norm** |
  | **8 (System)** | Individual vs. Collective Warrant | Points to **Individual Knowledge Norm** | Points to **Warrant/Institutional Norm** |
  | **9 (Hedge)** | Strength of Commitment | Points to **Knowledge Norm** | Points to **Weaker Norms** |
  | **10 (Practice)** | Uniformity vs. Contextualism | Points to **Uniform Norm** | Points to **Contextual/Relativist Norm** |

  ### Step 3: Map to Leaves

  **Leaf 1: The Truth Norm**
  *   *Profile:* Q1-A, Q4-A. Quiz: 1-IO, 2-IO, 3-IO, 4-D, 7-D (if truth-value gap).
  *   *View:* Assertion is governed by the rule: Assert *p* only if *p* is true.
  *   *Diagnosis:* Violations are false assertions. Justified false assertions (Case 4) are defective. Gettiered truths (Case 1) are in order.

  **Leaf 2: The Knowledge Norm**
  *   *Profile:* Q1-A, Q4-A. Quiz: 1-D, 2-D, 3-IO, 4-D, 6-D (often), 9-D.
  *   *View:* Assertion is governed by the rule: Assert *p* only if you know *p*.
  *   *Diagnosis:* Violations include lottery claims, Gettier cases, and assertions where the speaker lacks knowledge even if *p* is true.

  **Leaf 3: The Justified Belief / Rational Credibility Norm**
  *   *Profile:* Q1-A, Q3-A (Internalist). Quiz: 1-IO, 2-IO (if prob. high enough), 4-IO, 3-IO.
  *   *View:* Assertion is governed by the rule: Assert *p* only if you are justified in believing *p* (or it is rational to believe *p*).
  *   *Diagnosis:* False assertions (Case 4) are not defective if justified. Lottery claims (Case 2) may be in order if probability is high enough.

  **Leaf 4: The Warrant Norm (Collective/Institutional)**
  *   *Profile:* Q1-A, Q5-B/C. Quiz: 8-IO, 10-IO, 2-D.
  *   *View:* Assertion requires warrant appropriate to the institutional role, not necessarily individual knowledge.
  *   *Diagnosis:* Distinguishes individual epistemic states from institutional authority (Case 8, 10).

  **Leaf 5: Stakes-Sensitive / Interest-Relative Norm**
  *   *Profile:* Q1-A, Q4-B. Quiz: 3-D, 1-D/IO (depending on stakes), 2-D.
  *   *View:* The epistemic strength required varies with practical context.
  *   *Diagnosis:* Same evidence suffices in low stakes but fails in high stakes (Case 3).

  **Leaf 6: Contextualist / Relativist Norm**
  *   *Profile:* Q1-A, Q5-B or C, Q6-B. Quiz: 10-IO, 3-D/IO (depending on context), 6-D.
  *   *View:* The norm shifts depending on the speaker's context or the audience's standards.
  *   *Diagnosis:* An assertion can be proper for the speaker but improper for the audience (or vice versa).

  **Leaf 7: Deflationary / No-Norm View**
  *   *Profile:* Q1-C. Quiz: Mostly IF or IO. D only if lying.
  *   *View:* There is no distinct norm of assertion.
  *   *Diagnosis:* "Defects" are merely pragmatic infelicities or moral failures (lying), not violations of a constitutive rule.

  ### Troubleshooting: Ties and Inconsistencies

  1.  **The "Truth vs. Knowledge" Tie:** If you marked Case 1 (Unlucky) as *In Order* and Case 4 (Error) as *Defective*, you are a **Truth Theorist**. If you marked Case 1 as *Defective* and Case 4 as *Defective*, you are a **Knowledge Theorist**.
      *   *Conflict:* If you marked Case 1 *In Order* and Case 4 *In Order*, you likely hold a **Justified Belief Norm**.
  2.  **The "Knowledge vs. No-Luck" Indistinguishability:** This instrument cannot separate the Knowledge Norm from a "No-Luck Justified True Belief" norm. Both yield *Defective* on Case 1 and Case 2. To separate these, you would need a case where a speaker has knowledge *without* justification (if possible) or JTB *without* knowledge (which Case 1 attempts). If you find Case 1 defective, you reject luck, but you cannot tell from this quiz if you require *Knowledge* specifically or just *Non-Accidental Truth*.
  3.  **The "Vague Content" Problem:** If you marked Case 7 (Vague) as *Defective*, you might be a Truth Theorist who believes vague sentences lack truth values. However, a Knowledge Theorist might also mark it *Defective* because one cannot know a proposition without a determinate truth value. This instrument treats Case 7 as indicative of the **Truth Norm** (due to truth-value gaps), but acknowledges this overlaps with Knowledge limitations.
  4.  **Inconsistent Patterns:** If you marked Case 3 (Stakes) as *In Order* (Invariantist) but Case 10 (Practice) as *Defective* (Contextualist), you hold an unstable position. You likely believe the norm is Uniform generally but admits of *institutional exceptions*. Classify yourself under **Warrant Norm (Leaf 4)**.
  5.  **Tied Scores:** If your tally fits two leaves equally (e.g., Knowledge and Warrant), check Q8 (Institutional). If you said *Defective* for Case 8, you are **Knowledge**. If *In Order*, you are **Warrant**.

  ### Limitations of the Instrument

  *   **Knowledge vs. Certainty:** This quiz does not distinguish between a norm requiring *Knowledge* and one requiring *Certainty*. Both would render Case 9 (Hedge) defective. A case involving a speaker who knows *p* but feels uncertain would be required to separate these.
  *   **Truth vs. Knowledge on Vague Contents:** As noted in Troubleshooting, Case 7 pulls apart Truth-Value Gaps from Epistemic Gaps, but the verdicts often align. A case where a vague claim is known to be true (e.g., "This heap is not a single grain") would be needed to separate them.
  *   **Audience Sensitivity:** Case 6 (Redundant) attempts to capture the "Need to Know" component of the Knowledge Norm. However, some Truth Theorists agree redundant assertions are infelicitous for pragmatic reasons. If you chose *Infelicitous* rather than *Defective* for Case 6, the instrument cannot determine if you reject the Knowledge Norm or simply view the "need to know" as pragmatic.

  ---
