answer: |-
  A solution to the deontological paradox must explain how rule-following avoids catastrophic collective outcomes without collapsing into consequentialism. It must handle climate change and supply chain cases where individual choices seem causally negligible yet collectively harm everyone. The theory needs to preserve distinctions between an act being objectively wrong, the agent being blameworthy, and the group violating a rule.

  It must address the Sorites paradox and not contradict social science findings on causal impotence. **Non-negotiable:** Logical consistency and acknowledging real harm. **Camp preferences:** Whether rules are absolute or defeasible. A **jointly impossible** pair is maintaining strict individual causal responsibility while demanding individuals prevent collective harms without consequentialist math.

  **Settled:** Individual causal impact in these cases is often empirically negligible. **Contested:** Whether moral rules bind individuals to collective outcomes or only govern personal conduct. Some argue complicity makes acts wrong; others insist only direct harm matters. No consensus exists on solving the paradox without some consequentialist leakage.

  Ultimately, the theory must navigate between rigid rule-following that ignores disaster and flexible rules that dissolve deontology. It must show why an individual shouldn't defect even if their defection changes nothing empirically. This requires reconciling agency with collective impact without abandoning the core deontological constraint against using people merely as means or failing to protect them.
