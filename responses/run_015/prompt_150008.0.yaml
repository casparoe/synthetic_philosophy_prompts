answer: |-
  **The Scenario**

  In the ICU transfer bay, a portable ventilator has entered a fault mode requiring a manual "dual-grip" override to maintain airflow; a hardware interlock requires continuous contact with two capacitive sensors on opposite handles to keep the internal valve open, a physical safeguard preventing unattended operation during faults. Nurse A, the patient's assigned caregiver, and Nurse B, an off-duty colleague visiting the ward with no institutional role or obligation regarding this patient, stand on either side of the device. Both know the mechanism, both are physically able to hold the grips, and both are equally proximate. While discussing a weekend plan, both become absorbed in conversation and simultaneously release their grips at $t_1$. The valve closes immediately, ventilation ceases, and the patient suffers hypoxic injury. It is stipulated that B has no duty to act, while A does; there is no intermediate event between the release and the valve closure, and no other action (such as calling for help) would have intervened in time to prevent the injury given the speed of the mechanism's failure.

  ***

  **1. Derivation of Verdicts**

  *   **Difference-Making (DM):** DM asks: Had A not omitted (i.e., held the grip), would the outcome have occurred? In the closest world where A holds the grip, we hold the rest of actual history fixed, which includes B's omission. Since B also let go, the valve closes regardless of A's action. The outcome is not counterfactually dependent on A's omission. The same logic applies to B. **Verdict: No causation for either.**
  *   **Interventionism (IV):** IV asks: Is there an intervention on A that changes the outcome, with dependence invariant across a range of background settings? While holding B fixed at its *actual* value (omit) shows no change, the structural equation governing the device ($Outcome = \neg (A \land B)$) shows that A's value determines the outcome when B is set to 'act'. This dependence is invariant across the *range* of possible settings for B (act vs. omit), satisfying the requirement that the relationship holds across background variations, not just the actual token. **Verdict: Causation for both.**
  *   **Production/Process (PA):** PA requires a physical process (energy transfer, mark transmission) linking cause and effect. An omission is the absence of an event; there is no physical quantity transmitted from A's *not-holding* to the valve's closing. The valve closes due to spring tension, not due to a signal sent by A's absence. **Verdict: No causation for either (for lack of process, not lack of counterfactual dependence).**
  *   **Norm-Gated (NG):** NG stipulates that an omission is causal only if the agent was under a duty to act. A was assigned to the patient and breached a duty; B was off-duty and under no obligation (by stipulation, not capability). The structural symmetry is broken by the deontic asymmetry. **Verdict: Causation for A, not for B.**

  **2. Ablations**

  *   **Rewiring the Mechanism:** Suppose the hardware is changed so the valve stays open if *at least one* grip is held (outcome occurs only if *both* omit). Here, if A had acted, the outcome would have been prevented. The but-for test is satisfied. **DM flips to Yes** for both agents. IV remains Yes. PA remains No. NG remains A-Yes/B-No. This shows DM tracks the *structure* of dependence (overdetermination vs. joint necessity), while NG tracks the *norm*.
  *   **Removing the Deontic Asymmetry:** Suppose both A and B are assigned nurses with equal duty. The structural facts remain identical. **NG flips to Yes** for B. DM, IV, and PA remain unchanged. This shows NG tracks the *duty*, while the others track the *structure* or *physics*. The two variables (duty and dependence) are independent.

  **3. Generalization**

  For $n$ agents where any single omission suffices for the outcome (symmetric overdetermination): DM yields no causation for any $n \ge 2$ (the but-for test always fails due to redundancy). IV yields causation for all $n$ (the structural dependence remains invariant across background settings of the other $n-1$ agents). PA yields no causation for all $n$ (absences remain non-processes). NG yields causation only for those $n$ agents under a duty. At $n=1$, overdetermination vanishes; DM flips to Yes, while the others remain stable in their logic. Nothing breaks at $n=1$, but the divergence between DM and the others disappears regarding the structural verdict.

  **4. The Profligacy Check**

  A also omitted to call for help, to fetch a colleague, or to press the control with her elbow. If any of these actions would have prevented the outcome (e.g., a colleague was close enough to take over), DM and IV count these omissions as causes alongside the grip release. This over-generates causation, flooding the explanation with irrelevant alternatives. PA and NG are less profligate here: PA rejects them as absences (unless redescribed, see below), and NG rejects them if no specific duty existed to call or use an elbow. The cheapest repair for DM/IV is a **variable selection constraint**: only "serious possibilities" or variables representing the *expected* course of events are modeled, excluding far-fetched alternatives like "pressing with elbow."

  **5. The Redescription Check**

  The omissions can be redescribed as positive doings: A is "chatting at the station," B is "standing in the doorway."
  *   **PA:** This verdict is sensitive to redescription. "Chatting" involves sound waves and neural activity (a process). If the cause is described as the positive act of chatting (which distracted A), PA may deliver **Yes**, whereas it delivered **No** for the omission. This shows PA's verdict depends on how the cause is individuated.
  *   **DM, IV, NG:** These verdicts survive redescription. For DM and IV, the variable is functionally defined (Grip Held vs. Not); labeling the state "chatting" does not change the counterfactual or interventionist structure. For NG, the duty attaches to the agent's role regarding the *task*, not the description of their behavior; B still lacks a duty even if "standing." This shows DM, IV, and NG are more robust to descriptive variance than PA.

  **6. The Worst View and the Strongest Reply**

  **DM comes out worst.** It denies causation in a case where pre-theoretically both agents look equally causal, and where the hardware physically treats their contributions as identical. It fails to capture the intuition that both agents contributed to the failure simply because the other also failed.
  *   **Strongest Reply:** A DM defender invokes the **Intrinsicness Principle**: the causal structure of the A-outcome pair should be judged by the intrinsic physical processes in that region, not by extrinsic facts about B. Since the process from A's omission to the outcome is intrinsic to A's situation, and would have been causal if B had acted, it should count as causal now.
  *   **Why it fails here:** Constraint (ii) (no stepwise-dependence) blocks this. There is no intermediate process (like a signal sent) that is intrinsic to A's omission. The "process" is simply the valve closing due to spring tension. Without an intermediate event to bear the intrinsic mark of causation, the Intrinsicness repair cannot get a foothold. The case is designed to leave DM with nothing but the failed but-for test.

  **7. Closing**

  This case establishes a narrow but significant claim: in omission scenarios, structural dependence and normative status are separable variables that different theories of causation track independently. It does not prove that norms *are* causal, nor that structure is irrelevant. It demonstrates only that a theory can be structurally sensitive (like IV) without being normatively sensitive, and normatively sensitive (like NG) without being structurally sensitive. Consequently, arguments that attempt to resolve causal selection in omission cases by appealing solely to counterfactuals or solely to duties are incomplete; they are measuring different dimensions of the same problem.
