  *(Self-Correction on "Predictor")*: In RL, the environment is usually Markovian. A predictor that reads the policy makes it non-Markovian or requires the policy to be part of the state. This is effectively a Game Theory problem (Nash Equilibrium) disguised as Single-Agent RL. I should highlight this.

