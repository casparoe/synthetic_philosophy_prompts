answer: |-
  This is an excellent request. You have correctly identified the friction points. The commenter is deploying a standard "structuralist" reading of *On Certainty* that is common in introductory epistemology but often misses the naturalistic, anti-voluntarist turn Wittgenstein takes in his final notes. Your intuition that "hinges" are being conflated with "arbitrary rules" is spot-on.

  Here is an accuracy audit of the comment, followed by a breakdown of the Bayesian implication, and finally a draft reply you can adapt for the thread.

  ### Part 1: Accuracy Audit of the Comment

  **1. What a sympathetic Wittgensteinian would endorse:**
  *   **"Justification has to bottom out somewhere."** (OC §110, §204). Wittgenstein agrees that the chain of reasons is not infinite.
  *   **"Hinges aren't the sorts of things that can be known."** (OC §137, §312). Wittgenstein explicitly argues that "I know" is a grammatical mistake when applied to hinges. Knowledge implies the possibility of doubt and verification; hinges are the framework *within which* verification happens.
  *   **"Hinges shift for reasons internal to the practice."** (OC §96-99). The "riverbed" of thoughts can shift, but slowly, and usually due to changes in the "water" (our empirical investigations) over long periods, not single observations.

  **2. Misleading shorthand (Acceptable for specialists, dangerous for beginners):**
  *   **"Committing to a hinge can't be a matter of following the evidence; it has to be a leap, or at best a decision to stop asking."**
      *   *The Problem:* The words "leap" and "decision" imply **voluntarism**. Wittgenstein is fiercely anti-voluntarist here. We do not *decide* to hold fast to the proposition that the world exists. We find ourselves already acting that way. It is not a choice; it is a form of life (*Lebensform*). It is animal certainty, not intellectual assent.
      *   *Correction:* It is not a decision to stop asking; it is the realization that asking *makes no sense* in this context. Doubt requires grounds; where there are no grounds for doubt, there is no doubt.

  **3. Conflations (Where the derivation goes wrong):**
  *   **Proposition vs. Rule/Action:** You suspected this, and you are right. The commenter treats hinges as *propositions* that we believe very strongly ("The earth has existed for 100 years"). Wittgenstein oscillates, but his deeper point is that hinges function as *rules* or *ways of acting*.
      *   *Why it matters:* If hinges are propositions, they can be true or false, and different communities can have "incompatible" ones. If hinges are *rules of the game* (like "the king moves one square"), they aren't true/false, they are constitutive. You can play chess or checkers, but you can't play chess while treating the king like a queen. The commenter treats hinges as competing *theories*; Wittgenstein treats them as competing *grammars* grounded in human nature.
  *   **"Drilled into us" vs. "Natural History":** The commenter says hinges are "what our upbringing drilled into us," implying social constructivism. Wittgenstein says they are grounded in "natural history" (OC §415). There are constraints on what can be a hinge. A community cannot have a hinge that "people usually turn into birds at noon" because that contradicts the shared human form of life. This blocks the slide into radical relativism.

  **4. Live Objection vs. Settled Refutation:**
  *   **The Relativism Charge:** The commenter presents relativism ("nothing to adjudicate between them") as a settled consequence. This is a **live objection**, not a settled fact.
      *   *The Nuance:* Wittgenstein allows for *systemic* relativity (different language games), but denies *arbitrary* relativity. We can adjudicate between systems by seeing which one allows for successful prediction and action, but we cannot adjudicate from a "view from nowhere." The commenter presents this as a bug (relativism); a Wittgensteinian sees it as a feature (contextualism).
  *   **The Anti-Skeptical Move:** The commenter says Wittgenstein "pulls the rug out" from under anti-skepticism. This is debatable. Wittgenstein doesn't refute the skeptic with an argument; he **dissolves** the skeptic by showing their doubt is empty (it has no consequences, no use). Whether this counts as a "refutation" depends on what you think philosophy is supposed to do.

  ### Part 2: The Moore-Style Conclusion ("I know I have hands")

  The commenter writes: *"You can't answer the simulation or brain-in-a-vat worry by saying you know you have hands, because on Wittgenstein's account hinges aren't the sorts of things that can be known at all."*

  **Verdict:** **Accurate to Wittgenstein, but easily misunderstood.**

  Wittgenstein agrees with Moore that the skeptic is wrong, but disagrees with Moore's *grammar*.
  *   **Moore:** "I know I have hands" is a super-strong empirical claim.
  *   **Wittgenstein:** "I know I have hands" is a category mistake. "I know" belongs in the language game of evidence, verification, and the possibility of error. "I have hands" is a hinge. It stands fast for me. To say "I know it" suggests I have investigated it and ruled out error. But I haven't investigated it; I *act* on it.
  *   **The Implication:** You don't defeat the skeptic by claiming **Knowledge** (which invites the challenge "How do you know?"). You defeat the skeptic by pointing out that their doubt is **idle**. If I doubt I have hands, I cannot coherently continue to act. The certainty is in the *doing*, not the *saying*.

  ### Part 3: Does the Anti-Bayesian Conclusion Follow?

  **Strict Universal Bayesianism? Yes, it is refuted.**
  If the Bayesian ideal is "Every belief must have a probability assigned and must be updated conditional on new evidence," Wittgenstein refutes this. Hinges function like probabilities of 1 (or 0) that are *insulated* from updating. If you update your hinge (e.g., "The earth exists"), you aren't learning; you are going mad or changing language games. Standard Bayesianism forbids priors of 1 (dogmatism) because you can never update away from them. Wittgenstein says some priors *must* be 1 for the system to function.

  **Practical/Local Bayesianism? No, it survives.**
  Wittgenstein does not say we cannot use evidence for non-hinge beliefs. Within the system of hinges (e.g., assuming physics works, assuming memory is reliable), we can absolutely be Bayesian. We can update on whether it will rain, whether a drug works, etc.
  *   **The Defensible Claim:** The commenter should have said: *"Bayesian updating is a tool that operates **within** a framework of hinges. It cannot be used to justify the framework itself."*
  *   **The Error:** The commenter implies that because hinges aren't evidence-based, *no* beliefs are evidence-based, or that rationality is impossible. Wittgenstein saves rationality by grounding it in action, not by grounding it in infinite justification chains.

  ### Part 4: Draft Reply for the Forum

  Here is a draft you can post. It validates the commenter's insight while correcting the "relativist/voluntarist" drift, using terminology familiar to rationalists.

  ***

  **Draft Reply:**

  This is a compelling summary of the structural role hinges play, and I think you're right that *On Certainty* poses a serious challenge to the idea of a "universal updater." However, having spent some time with the text, I think the derivation toward relativism and voluntarism ("a leap," "a decision," "drilled into us") slides past some crucial distinctions Wittgenstein makes.

  Three specific corrections might help bridge the gap between the hinge picture and the rationalist one:

  **1. Hinges are not "Decisions" (Anti-Voluntarism)**
  You describe holding a hinge as a "decision to stop asking" or a "leap." This makes it sound like an intellectual choice we make when evidence runs out. Wittgenstein's point is more naturalistic: we don't *decide* to hold fast to "The world exists"; we find that we *cannot* doubt it without ceasing to act. It's not a commitment we choose; it's a "form of life." It's less like choosing an axiom and more like the fact that we don't choose to feel pain when touched by fire. This blocks the idea that we can just "swap" hinges arbitrarily.

  **2. Relativism vs. Framework Dependence**
  You suggest that because hinges are grounded in upbringing, incompatible hinges are possible with "nothing to adjudicate between them." This is the standard relativist reading, but it ignores Wittgenstein's appeal to "natural history" (OC §415). Hinges aren't just cultural software; they are constrained by human biology and the physical world. A community couldn't genuinely have a hinge that "humans can fly unaided" because their form of life would not sustain it. The adjudication isn't via *evidence* (since evidence presupposes hinges), but via *viability*. This isn't full-blown relativism; it's contextualism grounded in shared human nature.

  **3. The Moore Point: "Knowing" vs. "Being Certain"**
  You're correct that Wittgenstein denies we can *know* we have hands. But this isn't skepticism. It's a grammatical point. "I know" implies "I could be wrong, but I've checked." For hinges, the possibility of being wrong is nonsensical. Wittgenstein isn't saying we lack certainty; he's saying hinges are *more* than knowledge. They are the scaffolding that makes knowledge possible. So the anti-skeptical move isn't "I know I'm not a brain in a vat," it's "The hypothesis that I am a brain in a vat does no work in my language game."

  **On the Bayesian Implication:**
  Does this kill Bayesianism? It kills **Universal** Bayesianism (the claim that *everything* is subject to updating). You cannot update your priors if you have no framework to interpret the likelihoods. But it leaves **Local** Bayesianism intact. We can still proportion beliefs to evidence *within* the system of hinges.

  A more defensible claim might be: *"Rationality isn't about having no hinges; it's about having hinges that allow for a rich, predictive, and self-correcting language game."*

  The rationalist ideal isn't incoherent, but it is incomplete. It describes the water, but forgets the riverbed.

  ***

  ### Summary for You (The User)

  *   **Your Gloss:** Your intuition that hinges are "fixed points of a language game" is actually **closer** to Wittgenstein than the commenter's "drilled beliefs" view, provided you understand "fixed" as "temporarily stable riverbed" rather than "eternal logical truth."
  *   **The Conflation:** The commenter treats hinges as *beliefs* (mental states) that are unjustified. Wittgenstein treats them as *actions* (practices) that are groundless.
  *   **The Bayesian Takeaway:** You can be a Bayesian about hypotheses, but you cannot be a Bayesian about your framework. The commenter is right that the *universal* ideal fails, but wrong to imply this leads to "anything goes" relativism.

  This position allows you to respect the Wittgensteinian critique without abandoning the utility of probabilistic reasoning in your actual life.
