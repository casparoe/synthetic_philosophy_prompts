  1. Your hunch is correct: this is a clash between viewing entropy as subjective state-counting versus an objective dynamical constraint. The stalemate persists because both sides agree on the calculations but disagree on whether the Second Law governs nature or merely our descriptions of it.

  2. The trash-tape demon proves the dissipation cost is invariant to labeling, shifting the burden to the preparation of the blank tape rather than the erasure step itself. This demonstrates that the Second Law is preserved by the total cycle cost of resetting state spaces, regardless of whether you call it erasure or manufacturing.

  3. The sloppy demon forces the circularity camp to admit that work extraction scales strictly with mutual information rather than raw memory size, separating logical bits from thermodynamic value. This shows that the cost is tied to physical correlation strength, not just the abstract act of recording or deleting data.

  4. This is not a hidden empirical question but a bedrock disagreement about what an explanation in physics is supposed to look like, specifically whether laws must be dynamical or can be statistical. Experiments cannot resolve this because both camps predict the same outcomes for any conceivable apparatus you could build.

  5. Progress consists in making a conceptual distinction that treats Landauer's principle as a consistency condition for modeling open systems rather than a fundamental law of motion. Your group should move on by accepting that the erasure cost is real for agents but not necessarily a property of the universe independent of observation.
