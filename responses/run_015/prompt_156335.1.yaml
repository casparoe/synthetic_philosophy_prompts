      *   Need to know what's irreversible.

      *(Self-Correction during drafting)*: I need to make sure I answer the "Who was closer?" question briefly but pivot quickly to the practical application. The friend is right about the *logic*, the user is right about the *sociology*. The charter needs to encode the sociology.

