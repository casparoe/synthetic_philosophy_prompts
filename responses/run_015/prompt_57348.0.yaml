prompt: |-
  I got volunteered to write the retrospective on a launch that flopped. Shipped eight months late, overspent by about 40%, and got killed quietly three months after release. Leadership wants a document explaining what went wrong, and I've got about two weeks.

  The problem is that when I sit down with the timeline, the thing basically writes it's self. The warning signs are all sitting there in old Slack threads and they read like neon now. One engineer flagged in month two that we were building on a vendor whose API was still in beta, and looking at that message today it's impossible to see it as anything other than the start of the whole disaster. But I was in that meeting. The same engineer flagged two other risks that afternoon, we ranked all three as minor and moved on, and the other two never amounted to anything. It only looks like the important one because of what came after.

  Worse, I've caught myself rewriting my own memory. I would have sworn I felt uneasy about the vendor deal when we signed it. Then I found the notes I took that day, and what I actually wrote was that everyone was relieved we'd found somebody who could start immediately.

  Second issue: I drafted one honest paragraph — something like, at the time this was close to a coin flip, here were the three signals we had, one of them went bad — and a colleague read it and said it came across as making excuses. The version that sounds like accountability is the one where the failure was there to see and we walked into it anyway. So the accurate account makes us look evasive, and the flattering-to-blame account is the one people call rigorous, and I dont know how to get out of that.

  Third: every lesson I can write gets drawn from a failure. We only do these retros when something blows up. Nobody has ever written up the three launches that used the same sloppy vendor process and came out fine.

  So two questions really. Is my instinct right that what I'm producing is a story wearing the costume of an explanation — and if it is, is that avoidable, or is every account of why something happened a story at that level, meaning I'm holding out for something that doesn't exist? And practically: is there a way to structure the writeup so it fights the pull instead of feeding it? I really don't want to hand over a document that makes the next team paranoid about exactly the wrong signals.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Task:** Write a post-mortem/retrospective on a failed product launch (8 months late, 40% overspent, killed 3 months post-release).
      *   **Timeline:** 2 weeks.
      *   **Core Conflict:** The user sees the "hindsight bias" clearly. Warning signs look obvious *now* but weren't *then*. Memory is being rewritten to match the outcome.
      *   **Social/Political Pressure:** Leadership wants an explanation. An honest account ("it was a coin flip") sounds like excuse-making. A deterministic account ("we walked into it") sounds like accountability but is factually shaky.
      *   **Systemic Issue:** Retrospectives only happen on failures (survivorship bias). Successful projects used the same risky processes.
      *   **Questions:**
          1.  Is this just a story wearing a costume? Is objective explanation impossible?
          2.  Practically: How to structure the writeup to fight hindsight bias and avoid teaching the wrong lessons?

  2.  **Deconstruct Question 1: Story vs. Explanation:**
      *   *The User's Instinct:* Yes, it's a story.
      *   *The Reality:* All post-mortems are narratives. Human brains crave causality. We connect dots backwards.
      *   *The Nuance:* It's not *just* a story, but it's never a pure physics equation. The danger is *deterministic* storytelling ("A caused B") vs. *probabilistic* storytelling ("A increased the risk of B, given context C").
      *   *Verdict:* The user is right that it's a narrative construction. But that doesn't mean it can't be useful. The goal isn't "absolute truth" (impossible) but "actionable insight without distortion."

  3.  **Deconstruct Question 2: Practical Structure:**
      *   *The Trap:* The "Five Whys" often leads to a single root cause (the vendor API). The "Accountability" trap leads to scapegoating or false confession ("we were blind").
      *   *The Goal:* Capture the *decision quality* at the time, not just the *outcome*. Distinguish between process errors and bad luck. Acknowledge survivorship bias.
      *   *Key Concept:* "Decision Hygiene" vs. "Outcome Bias."
      *   *Key Concept:* "Pre-mortem" data (what did we think *then*?).
      *   *Key Concept:* Systemic factors (why did the risky process work 3 times before?).

  4.  **Drafting the Advice - Section by Section:**

      *   **Validation:** Acknowledge the sophistication of the user's insight. They are seeing the "Hindsight Bias" and "Outcome Bias" clearly. This is rare and valuable.
      *   **Answering Q1 (Philosophy):** Yes, it's a story. But not all stories are equal. Distinguish between *Narrative Fallacy* (Taleb) and *Constructive Narrative*. The goal isn't to eliminate the story, but to make the *uncertainty* part of the story.
      *   **Answering Q2 (Practice):** How to structure it?
          *   *Shift the Frame:* From "Why did we fail?" to "Why did our decision-making process fail to account for variance?"
          *   *The "Decision Log" Approach:* Reconstruct the decision *as it existed then*, not as it looks now. Show the trade-offs.
          *   *Address Survivorship Bias:* Explicitly mention the 3 successful launches. Why was this one different? (Scale? Market timing? Specific vendor feature?) This prevents over-correcting.
          *   *The "Accountability" Reframe:* Accountability isn't admitting you're an idiot; it's admitting you relied on a process that has a known failure rate.
          *   *Recommendations:* Focus on *risk calibration*, not *risk avoidance*. (e.g., "Don't avoid beta APIs," but "If using beta APIs, have Plan B funded").

  5.  **Refining the Tone:**
      *   Needs to be empathetic but professional.
      *   Needs to acknowledge the political reality (Leadership wants blood/confession).
      *   Needs to be actionable.
      *   Avoid jargon where possible, but use precise terms (Hindsight Bias, Outcome Bias) to validate the user's thinking.

  6.  **Specific Tactical Ideas:**
      *   *Timeline with "State of Knowledge":* Annotate the timeline with what was known *at that moment*.
      *   *The "Garden Path" Section:* Explicitly call out the hindsight bias in the doc itself. "Note on Hindsight."
      *   *Process vs. Outcome:* Separate these clearly.
      *   *The "Successful Counterfactuals":* Include the 3 successful projects as a comparison case.

  7.  **Review against Constraints:**
      *   User has 2 weeks. Advice needs to be implementable.
      *   User is worried about looking evasive. Advice needs to help them sound accountable without lying.
      *   User is worried about future teams becoming paranoid. Advice needs to focus on risk management, not risk elimination.

  8.  **Final Polish:**
      *   Make sure to address the specific "engineer flag" example. That's the crux of the hindsight bias.
      *   Address the "colleague's feedback" on the draft. How to write the "coin flip" paragraph so it sounds like analysis, not excuse.

      *(Self-Correction during drafting)*: I initially thought about suggesting they push back on leadership. *Correction:* No, that's political suicide. The goal is to write the doc so it satisfies leadership *and* remains truthful. The trick is framing "uncertainty" as a manageable variable, not an excuse.

      *(Refining the "Accountability" point)*: The colleague said "coin flip" sounds like an excuse. Why? Because it implies lack of agency. The fix is to say "We treated a high-variance bet as a low-variance certainty." That is accountability. It admits the error was in *calibration*, not in *fate*.

  9.  **Final Structure of Response:**
      *   Validate the insight (You are seeing the matrix).
      *   Address Q1: The Nature of Post-Mortems (Story vs. Truth).
      *   Address Q2: Structural Solutions (The "Decision Quality" Framework).
      *   Specific Wording/Tactics (How to phrase the "coin flip").
      *   The Survivorship Bias Fix.
