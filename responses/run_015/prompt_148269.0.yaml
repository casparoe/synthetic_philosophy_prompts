answer: |-
  Here are nine questions designed to fit a 50-minute window, with follow-ups that tighten the screw on her "moralism" escape hatch. The private asides give you the scholarly landscape so you know when you're pressing a contested point versus a structural vulnerability.

  ### Question 1: The Currency of "Working" (Topic A)
  **Host:** Let's start with the engine of the view. You say we judge frameworks by "how well they work" rather than whether they're true. But when you compare two planning frameworks—say, a market-heavy one versus a coordinated one—what is the currency of "working"? Is it GDP, stability, satisfaction, something else? And if you say *that* metric is just internal to a higher-order framework, what stops the regress? Why should we accept the higher-order framework?

  **Anticipated Answer:** She will likely say the metric is internal (e.g., "satisfaction of preferences defined within the framework") and that the regress stops at a pragmatic choice we make because it facilitates cooperation.
  **Follow-up:** "If the stopping point is just a pragmatic choice to facilitate cooperation, couldn't a framework that facilitates cooperation *better* by silencing dissent be superior on your own terms? If you say 'no,' aren't you smuggling in a value independent of the framework's success?"

  > **Aside to Host:** This is the classic Carnapian vulnerability. Carnap was vague on whether the "external" choice of a framework was purely pragmatic or had normative weight. Contemporary political theorists are split: some think the Principle of Tolerance implies liberalism; others think it's purely methodological and has no political content. By asking this, you aren't committing to a specific reading, but you are forcing her to admit that "pragmatism" does normative work.

  ### Question 2: The Non-Regression Clause as Moral Constraint (Topic B)
  **Host:** I want to press on your signature addition, the non-regression clause. You say revisions are only admissible if they preserve everyone's standing to raise internal claims. If I'm a planner looking purely at expediency, and excluding a noisy minority makes the system run significantly smoother, your clause forbids it. Why? Is that constraint itself a pragmatic rule, or is it a moral side-constraint smuggled into a view that claims to bypass morality?

  **Anticipated Answer:** She will likely say it's pragmatic: "If you lose standing, the framework loses information and becomes brittle."
  **Follow-up (Trap Level 1):** "Okay, but suppose we have a framework that is incredibly robust and stable *precisely because* it excludes that minority. It works beautifully by your pragmatic metrics. You still forbid it. At that point, when you overrule the 'working' system to protect 'standing,' aren't you just prioritizing rights over outcomes? And isn't that the moralism you said we could avoid?"

  > **Aside to Host:** This is the strongest point of attack. The non-regression clause looks suspiciously like a deontological right to participation. If she insists it's purely pragmatic, she risks making an empirical claim that is easily falsifiable (authoritarian regimes can be very stable). If she admits it's normative, she concedes that "justice" hasn't been eliminated, just relocated.

  ### Question 3: The Losers and Compensation (Topic C)
  **Host:** Let's talk about the people who lose out. If a planning decision displaces workers to improve overall efficiency, on your view, are they merely on the losing side of a practical choice, or are they *wronged*? If their framework has no provision for compensation, does your view allow that they are owed nothing?

  **Anticipated Answer:** She will likely invoke the non-regression clause again: "They must have standing to claim compensation internally."
  **Follow-up (Trap Level 2):** "But what if the framework was validly adopted and *explicitly* rejects compensation claims as 'market distortions'? If that framework is stable and works for the majority, and you say 'too bad, they need standing,' you're appealing to a standard outside that framework to judge it. You're saying they *should* have standing. Isn't that 'should' a moral claim about their worth, not just a technical rule about linguistic frameworks?"

  > **Aside to Host:** This connects Q2 and Q3. You are cornering her on whether "standing" is instrumental (useful for the system) or intrinsic (valuable for the person). The literature on "internal points of view" in law (Hart vs. critics) suggests that valid legal systems can lack moral legitimacy. You are asking if her view collapses that distinction.

  ### Question 4: Tolerance of the Intolerant (Topic D)
  **Host:** You rely heavily on the Principle of Tolerance. Does that tolerance extend to frameworks that would abolish tolerance? If a group proposes a planning framework that permanently locks in their rule and bans revision, do you tolerate that choice?

  **Anticipated Answer:** She will likely say "No, that violates the non-regression clause."
  **Follow-up:** "So there is a boundary. But if the boundary isn't drawn by 'truth' or 'justice,' what draws it? If you say 'stability,' history suggests intolerant regimes can be very stable. If you say 'freedom,' you've reintroduced a moral value. How do you defend the boundary without putting on the moralist's lab coat?"

  > **Aside to Host:** This is the "Paradox of Tolerance" (usually associated with Popper) applied to Carnap. It's a standard objection. The key here is to prevent her from saying "It's just a rule of the game." You want to force her to admit *why* this is the rule of the game.

  ### Question 5: The "Scientific" in Scientific Planning (Topic E)
  **Host:** You frame this as a form of scientific planning. But if evidence and reasons are always internal to a framework, and frameworks are chosen pragmatically, what work is the word "scientific" doing? If I can't check your evidence from outside your framework, why is this planning rather than just organized ideology?

  **Anticipated Answer:** She will say "Science is the best example of framework pluralism; it's about predictive success, not metaphysical truth."
  **Follow-up:** "But in natural science, frameworks that fail to predict get discarded by reality. In institutional planning, 'reality' doesn't discard a framework unless people revolt. If the feedback loop is political rather than empirical, doesn't calling it 'scientific' obscure the power choices involved?"

  > **Aside to Host:** Carnap did believe in the unity of science, but applying logical empiricism to politics is highly contested. Many philosophers of science argue that social planning lacks the falsification mechanisms of natural science. You are highlighting the disanalogy.

  ### Question 6: The "We" and Legitimacy (Topic F)
  **Host:** Who is the "we" that chooses the framework? If the choice isn't truth-apt—if there's no fact of the matter that one framework is right—what makes the choice legitimate? Why should I accept a framework I didn't choose, if it's not because it's *true* that I ought to?

  **Anticipated Answer:** "Legitimacy comes from the procedure, specifically the preservation of standing."
  **Follow-up:** "But why is that procedure legitimate? If you say 'because it works,' we're back to Q1. If you say 'because it respects persons,' you're back in moral territory. Is there any ground here that isn't either circular or moral?"

  > **Aside to Host:** This targets political legitimacy. Liberal theorists usually ground legitimacy in consent or fairness. She is trying to ground it in pragmatic coherence. This is a very hard sell in political theory. You are asking for the "normative glue."

  ### Question 7: The Sharpness of the Distinction (Topic G)
  **Host:** In law and institutions, competent practitioners genuinely disagree about what the framework *says*. Is that an internal question (what the rules are) or an external one (what the rules should be)? If the line blurs, does your machinery jam?

  **Anticipated Answer:** "It's internal if it's about interpretation, external if it's about changing the rules."
  **Follow-up:** "But in constitutional law, interpreting a right often changes its scope so much it looks like a new framework. If the internal/external distinction is fuzzy in practice, doesn't that make the non-regression clause unenforceable? Who decides when a revision is too big?"

  > **Aside to Host:** Legal realists and Dworkinians argue the internal/external distinction is unstable in law. Carnapians insist it's logical. You don't need to take a side, just point out that her "clause" requires a sharp line that legal practice often refuses to draw.

  ### Question 8: The Zoning Case (Topic H)
  **Host:** Let's run a live case. Municipal zoning: a city considers allowing duplexes on single-family lots. The current framework was chosen by homeowners years ago. Renters and the priced-out weren't participants. On your view, do they have standing to challenge the framework itself, or only internal rules within it?

  **Anticipated Answer:** "They must have standing to challenge the framework, per the non-regression clause."
  **Follow-up:** "But they weren't at the table when the framework was set. If the current framework says 'only property owners vote,' and that's stable and working for owners, how do the renters get a seat? Do you need an *external* agent to force the door open? And if so, isn't that agent imposing a moral view of inclusion?"

  > **Aside to Host:** This applies the "non-participant" problem. It tests whether her view can handle historical injustice or exclusion without importing an external moral standard (like "equality"). If she says "the framework must be revised to include them," ask *who* mandates that revision if the current framework doesn't.

  ### Question 9: Falsification (The Exit)
  **Host:** Final question. You've built a sophisticated machine to avoid moralism and technocracy. But what would actually count as evidence against your view? Is there a scenario, a historical case, or a logical outcome where you would say, "Okay, framework pluralism is the wrong tool for planning"?

  **Anticipated Answer:** (Varies)
  **Follow-up:** (Listen closely. If she says "If it stops working," ask "Who defines working?" If she says "If it violates rights," ask "Where did those come from?")

  > **Aside to Host:** This is your standard closer, but vital here. If she cannot specify falsification conditions, the view risks being unfalsifiable—any critique can be dismissed as "external." This tests the scientific pretensions of the theory one last time.

  ### Strategy Note on the "Moralism" Escape Hatch
  In Questions 2, 3, and 4, I have arranged the follow-ups to progressively block her "moralism in a lab coat" line.
  *   **In Q2,** you let her try the pragmatic defense, then ask why pragmatism overrides efficiency.
  *   **In Q3,** you present a case where pragmatism *supports* the immoral outcome, forcing her to overrule pragmatism.
  *   **In Q4,** you show that her boundary conditions look exactly like moral boundaries.
  By Q4, if she uses the "lab coat" line, the audience should hear it as an evasion rather than a defense.
