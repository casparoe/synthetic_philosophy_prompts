      *   **Core Thesis:** Carnap's internal/external distinction + Principle of Tolerance > Justice/Rights/Common Good for planning. Judge frameworks by "how well they work."
      *   **Key Mechanism:** "Non-regression clause" (revisions must preserve standing for affected parties to raise internal claims).
      *   **Guest's Defense Style:** Dismisses critiques as "moralism in a lab coat" or "external questions wearing internal clothes."
      *   **Goal:** 8-10 questions pressing on the *machinery*, not biography/history.
      *   **Specific Topics to Cover:**
          *   (a) Currency of "what works" & regress problem.
          *   (b) Non-regression clause as smuggled moral constraint.
          *   (c) Losers/Displacement (wronged vs. losing side).
          *   (d) Tolerance of intolerant frameworks.
          *   (e) Role of "scientific" if evidence is internal.
          *   (f) Who is the "we" choosing? Legitimacy without truth.
          *   (g) Sharpness of internal/external in legal/institutional contexts.
          *   (h) Concrete case: Municipal zoning (duplexes), focusing on non-participants.
          *   (i) Falsification: What counts as evidence against her view?
      *   **Constraint:** At least one question per topic (a-h), plus falsification. Total 8-10 questions.
      *   **Format:** Spoken-ready questions + anticipated follow-ups (specifically trapping the "moralism" escape hatch 2-3 times).
      *   **Aside:** Private note to host on scholarly consensus vs. contestation (no citations/reading lists).

  2.  **Deconstruct the Guest's Position & Weak Points:**

      *   *The "Works" Problem:* If "working" is internal, it's circular. If external, what's the metric? Efficiency? Stability? Satisfaction?
      *   *The Non-Regression Clause:* This sounds suspiciously like a deontological right (a right to be heard). If it's just pragmatic, why *must* we preserve standing? What if silencing a group makes the framework work *better*?
      *   *The "Moralism" Escape:* She labels normative critiques as "external" or "moralism." The strategy is to force her to admit that her own constraints (like non-regression) are normative, not just pragmatic.
      *   *The "We":* Planning implies a planner. Who empowers them? If it's democratic, that's a moral value (equality). If it's technocratic, that's elitism.
      *   *Zoning Case:* This is perfect for exposing the "non-participant" problem. If the framework was chosen by homeowners, renters are outside the "standing" loop.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Currency of "Works"):* Need to pin down the metric.
          *   *Draft:* What does "works" mean?
          *   *Refinement:* Make it harder. If it's internal, it's circular. If external, isn't that just utilitarianism?
          *   *Trap:* If she says "efficiency," ask why efficiency matters. If she says "internal coherence," ask what happens when coherent frameworks fail people.
      *   *Q2 (Non-Regression/Moral Smuggle):* This is the big one.
          *   *Draft:* Isn't the non-regression clause just a right?
          *   *Refinement:* Frame it as a pragmatic choice. What if excluding a group makes the system run smoother? Why is that inadmissible?
          *   *Trap:* Force her to justify the clause without using moral language.
      *   *Q3 (Losers/Compensation):* Focus on the human cost.
          *   *Draft:* What about displaced workers?
          *   *Refinement:* If a framework works overall but ruins specific lives, are they wronged? If no compensation clause exists internally, is there no wrong?
          *   *Trap:* Connect this to Q2. If they can't claim compensation internally, does the non-regression clause save them?
      *   *Q4 (Tolerance/Intolerance):* The paradox of tolerance.
          *   *Draft:* Can we tolerate intolerant frameworks?
          *   *Refinement:* If a framework proposes abolishing the right to revise frameworks, do you tolerate it?
          *   *Trap:* If she says "no," isn't that a moral boundary?
      *   *Q5 (Scientific Status):* Epistemology.
          *   *Draft:* Why call it scientific?
          *   *Refinement:* If evidence is framework-relative, what makes the planning "scientific" rather than just "organized"?
      *   *Q6 (The "We"/Legitimacy):* Political authority.
          *   *Draft:* Who chooses?
          *   *Refinement:* If the choice isn't truth-apt, what makes it binding? Why should I accept a framework I didn't choose?
      *   *Q7 (Internal/External Sharpness):* Legal realism angle.
          *   *Draft:* Is the distinction real in law?
          *   *Refinement:* Lawyers argue about what the rules *are*. Is that internal or external? If it's blurry, does your machinery jam?
      *   *Q8 (Zoning Case):* Concrete application.
          *   *Draft:* Let's talk zoning.
          *   *Refinement:* Use the specific constraints: renters/non-participants. How do they have standing if they weren't at the table?
      *   *Q9 (Falsification):* The exit.
          *   *Draft:* What proves you wrong?
          *   *Refinement:* Make it concrete. What empirical or logical outcome would make you abandon framework pluralism?

      *   *Review against constraints:* Need 8-10 questions. I have 9 topics. I can combine or split. Let's make sure the "Moralism in a Lab Coat" trap is set up in at least 2-3 questions (Q2, Q3, Q4 seem best for this).

  4.  **Refining the "Moralism" Traps:**

      *   *Trap Strategy:* The guest wants to say "This isn't morality, it's structural stability." The host needs to ask, "Why is stability the goal?" or "Why is *this* kind of stability required?"
      *   *Q2 (Non-Regression):* Ask why we can't adopt a framework that silences a group if it increases overall output. If she says "because they need standing," ask "Why? Is that not a moral claim?"
      *   *Q3 (Losers):* Ask if a framework without compensation is valid. If she says "No, because of non-regression," ask "Isn't that just a right to compensation dressed up?"
      *   *Q4 (Intolerance):* Ask if we ban intolerant frameworks. If she says "Yes," ask "On what grounds? Pragmatic? But if they promise stability through uniformity..."

  5.  **Drafting the Asides (Scholarly Context):**

      *   *Need:* No citations. Just "Here's where the field stands."
      *   *Carnap's Politics:* Contested. Some say purely logical/linguistic. Some (like the guest) say it implies liberalism.
      *   *Internal/External:* Quine criticized this heavily. Legal theorists (Hart vs. Dworkin) debate internal/external points.
      *   *Tolerance:* The "Paradox of Tolerance" is Popper, but applies here.
      *   *Note:* Keep these brief and actionable for the host.

  6.  **Final Polish:**

      *   Check tone: Respectful but probing. "Grad school friends" vibe means we can use terms like "truth-apt" or "side-constraint" without defining them, but avoid jargon soup.
      *   Check timing: 50 minutes for 9 questions is tight (approx 5 mins per Q including follow-up). The prompts need to be punchy.
      *   Check the "Moralism" instruction: Ensure the follow-ups explicitly block the "lab coat" line.

  7.  **Self-Correction during drafting:**
      *   *Critique:* Q5 (Scientific) might be too abstract.
      *   *Fix:* Tie it to the planning aspect. "If I can't check your evidence from outside, why trust the plan?"
      *   *Critique:* Q8 (Zoning) needs to ensure the "non-participant" angle is clear.
      *   *Fix:* Emphasize that the framework choice itself excluded them.
      *   *Critique:* Make sure the "Moralism" traps escalate.
      *   *Fix:* In Q2, let her try the escape. In Q3, cut it off. In Q4, corner her.

  8.  **Final Review against constraints:**
