prompt: |-
  hey, I'm a second-year PhD in philosophy of science (mostly working on probabilistic reasoning and policy) and I was arguing with my friend over coffee about whether the referance class problem is actually dead in practice or just stuck in decision theory textbooks. I'm trying to figure out where to put my energy for the next few years, and my advisor thinks I should treat it like a macro-strategy question: not 'solve the puzzle' but 'which open lines actually change anything if they get resolved.'

  So if I'm advising a tiny group—maybe three philosophers and one statistician, four years, not much funding—which questions around reference-class reasoning should we actually prioritize? I'm specifically wondering about three angles: first, the metaphysical question of whether singular causal claims have a uniquely correct reference class at all; second, the normative/policy question about how decision-makers should pick classes when different choices imply totally different resource allocations (like in climate adaptation for specific towns); and third, this somewhat niche idea I keep calling 'reference class drift,' where in long-term predictive models the class itself shifts over the prediction horizon in ways that standard Bayesian updates don't capture, which might break a lot of current risk-assessment frameworks.

  But I don't just want a list. I want the reasoning: which of these is upstream of the others, which ones are tractable for philosophers rather than just statisticians, and what kind of result over the next couple years would actually move one up or down the ranking? Also, are there implications for real-world governance that are overrated—like, if we solved the metaphysical version, would policymakers even care? Defend the ordering, tell me what evidence or argument would change your mind, and please don't just give me a reading list—I need to know where the work actually goes.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** Second-year PhD in Philosophy of Science (probabilistic reasoning & policy).
      *   **Goal:** Deciding research focus for the next few years (dissertation/early career).
      *   **Constraint/Scenario:** Advising a tiny group (3 philosophers, 1 statistician, 4 years, low funding). This is a *project management* question disguised as a *philosophical* question.
      *   **Advisor's Stance:** Macro-strategy. Not "solve the puzzle" but "which open lines actually change anything if resolved."
      *   **The Three Angles:**
          1.  *Metaphysical:* Do singular causal claims have a uniquely correct reference class?
          2.  *Normative/Policy:* How should decision-makers pick classes when allocations differ (e.g., climate adaptation)?
          3.  *Technical/Modeling:* "Reference Class Drift" (class shifts over prediction horizons, breaking Bayesian updates).
      *   **Requirements:** Reasoning for prioritization, tractability for philosophers vs. statisticians, impact on governance, evidence/arguments that would change the ranking. *No reading lists.*

  2.  **Deconstruct the Three Angles:**

      *   **Angle 1: Metaphysical (Uniquely Correct Class)**
          *   *Nature:* Foundational, abstract, historically entrenched (Reichenbach, Salmon, Hájek).
          *   *Tractability:* Low. Philosophers have debated this for a century without consensus. It often leads to stalemates between frequentists, propensity theorists, and Bayesians.
          *   *Impact:* Low immediate policy impact. Policymakers don't wait for metaphysical resolution to act.
          *   *Role:* Upstream theoretically, but downstream practically.

      *   **Angle 2: Normative/Policy (Decision Rules for Allocation)**
          *   *Nature:* Applied ethics, decision theory, governance.
          *   *Tractability:* High for philosophers. Involves value judgments, fairness, transparency, and procedural justice.
          *   *Impact:* High. Directly affects resource allocation (climate adaptation example is strong).
          *   *Role:* The bridge between theory and practice.

      *   **Angle 3: Reference Class Drift (Temporal Shift in Classes)**
          *   *Nature:* Technical, modeling, statistical/philosophical hybrid.
          *   *Tractability:* Medium/High for a Phil+Stat team. Requires formal modeling but conceptual clarity is the bottleneck.
          *   *Impact:* High for risk assessment (insurance, climate, pandemics). If standard Bayesian updating fails here, current frameworks are flawed.
          *   *Role:* Potential "killer app" for the group.

  3.  **Evaluate Strategic Priorities (The "Macro-Strategy"):**
      *   *Constraint:* 4 years, low funding, small team.
      *   *Goal:* Maximize impact/change.
      *   *Philosophy's Comparative Advantage:* Conceptual clarity, normative framing, critiquing assumptions. *Not* deriving new theorems (leave that to stats) or solving metaphysical realism (leave that to metaphysicians).
      *   *The "Upstream/Downstream" Dynamic:*
          *   Metaphysics is upstream of Normative, but solving Metaphysics doesn't fix Normative (the "Is-Ought" gap + the "Action under Ignorance" problem).
          *   Drift is a specific technical failure mode that *creates* the Normative problem.
          *   Normative is where the "change" happens in the real world.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Prioritize Normative. It's most useful.
      *   *Correction:* But you can't do Normative well without understanding *why* the classes are shifting (Drift). If Drift is real and unmodeled, Normative rules are built on sand.
      *   *Refinement:* Prioritize Drift as the *lever*, Normative as the *output*. Metaphysics is a distraction for this specific team constraint.
      *   *Wait, check the User's specific question:* "Which is upstream?" Metaphysics is technically upstream, but strategically it's a dead end. Drift is upstream of Normative *in practice*.
      *   *Key Insight:* The "Reference Class Problem" isn't one problem. It's a cluster. The Metaphysical version is a zombie. The Practical version (Drift + Policy) is alive and dangerous.

  5.  **Structuring the Response:**
      *   **Executive Summary:** Direct answer on prioritization.
