      *   **Claim 3 (Constructive Existence):** Core tenet of constructivism. Directly conflicts with classical existence proofs (e.g., pure existence by contradiction).
      *   **Claim 4 (IVT):** In classical math, IVT is standard. In *strict* intuitionistic/constructive math, the standard IVT is actually *false* or requires significant modification (approximate roots, not exact roots).
