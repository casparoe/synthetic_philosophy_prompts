  **NEXUS STREAM TECHNOLOGIES**
  **INTERNAL PEOPLE-OPS MEMORANDUM**
  **POL-HR-2024-09B | EFFECTIVE: Q3 PERFORMANCE CYCLE**
  **TO:** All Staff Level 3 and Above
  **FROM:** People Operations & Compensation Committee
  **SUBJECT:** Introduction of Performance Tier 5 ("Beyond the Call")

  **1.0 Purpose and Scope**
  This policy operationalizes the new Tier 5 ("Beyond the Call") classification within the Annual Performance Rubric. Tier 5 is designed to capture value creation that exceeds the boundaries of defined role responsibilities and standard employment contracts. This classification replaces the previous cap at Tier 4 ("Exceeds Expectations") to allow for finer granularity in high-performance differentiation and to accommodate behaviors that reside outside the scope of contractual obligation.

  **2.0 Promotion Precondition**
  Effective immediately, attainment of a Tier 5 rating in at least one core competency is a mandatory prerequisite for promotion to Level 4 and above. While the specific actions required to achieve Tier 5 status are not assigned by management, employees seeking advancement must demonstrate at least one instance of Tier 5 behavior during the review cycle. Failure to provide evidence of Tier 5 behavior will result in automatic stagnation at the current level, regardless of Tier 4 performance metrics. This distinction preserves the voluntary nature of the act while maintaining the mandatory nature of the career outcome.

  **3.0 Definition of Supererogatory Deliverables**
  Tier 5 acts are defined as contributions that are beneficial to the company but not contractually required. Employees are reminded that pursuant to Ethics Policy 4.1 ("Total Value Maximization"), all staff are obligated to produce the maximum possible utility for the firm during work hours.^1 Consequently, Tier 5 status applies only to utility generated outside of standard contractual utility expectations, despite the overarching mandate to maximize total output. Any act considered part of your core role, even if performed exceptionally, remains Tier 4.

  **4.0 Intent Verification**
  Credit for Tier 5 acts is contingent upon the altruistic nature of the intent. Acts undertaken with the primary objective of securing a Tier 5 rating are ineligible for classification. Employees must submit Form 88B (Declaration of Intent) alongside their performance portfolio. People Operations reserves the right to audit subjective intent through follow-up interviews. If an employee claims an act was done solely for the benefit of the company, but evidence suggests the motive was promotion eligibility, the act will be reclassified as Tier 4. Self-reporting of mixed motives will result in automatic disqualification.

  **5.0 Cost and Sacrifice Metrics**
  To qualify as "Beyond the Call," the act must incur a demonstrable personal cost to the agent. This ensures the contribution was not merely efficient work but a genuine sacrifice. Employees must complete Attachment B ("Personal Sacrifice Ledger"), detailing hours forgone, stress incurred, or opportunity costs accepted. People Operations will audit these logs to ensure the sacrifice was material. Artificially inflated sacrifice, such as unnecessary overtime without corresponding output, will be flagged as inefficiency rather than supererogation. Medical notes or third-party verification of stress are recommended for sacrifices exceeding forty hours.

  **6.0 Collective Action and Distribution**
  In cases where a team delivers a Tier 5 outcome, but no individual member's contribution exceeded their specific role obligations, no individual Tier 5 credit is awarded. Supererogatory status is assigned at the individual level only. If the collective effort was beyond the call, but the individual share was within reasonable expectations, the act is classified as "Standard Team Performance." Bonus pooling may apply, but performance rubric classification remains at Tier 4. This prevents the dilution of individual accountability within high-performing units.

  **7.0 Rubric Normalization**
  This adjustment addresses statistical compression observed in the top quintile of the performance distribution. Previous data indicated that "Exceeds Expectations" was no longer sufficiently distinguishing high-performers for compensation modeling. The Tier 5 bucket is necessary to maintain the integrity of the bell curve and ensure compensation packages align with market differentiation strategies for top talent. The existence of the tier is driven by distribution needs rather than the frequency of eligible behaviors.

  ^1 *Note: Employees seeking clarification on how Tier 5 acts are optional despite the Policy 4.1 mandate to maximize all possible good should refer to the Ethics FAQ, which states that contractual obligations supersede general ethical mandates unless specified otherwise.*

  **FAQ**

  **Q: If Tier 5 is required for promotion, is it still optional?**
  A: The action is discretionary; the result is mandatory. You are not told *what* to do, but you must do *something* extra to advance.

  **Q: Can I claim Tier 5 for working through lunch?**
  A: Only if working through lunch was not expected and incurred verifiable personal hardship. Routine overtime is considered Tier 3.

  **Q: What if my manager asks me to do a Tier 5 task?**
  A: If requested, it becomes a job requirement. You cannot receive Tier 5 credit for assigned tasks. You must identify the opportunity independently.

  **Calibration Note**
  The Compensation Committee advises managers that Tier 5 distribution should not exceed 5% of the department headcount. If more than 5% of your team appears to be acting "Beyond the Call," please recalibrate your baseline expectations for Tier 4 downward until the distribution aligns with the mandated curve. The existence of supererogatory behavior is less critical than the statistical validity of the rating distribution.
