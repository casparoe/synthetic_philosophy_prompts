      **NEXUS STREAM TECHNOLOGIES**
      **INTERNAL PEOPLE-OPS MEMORANDUM**
      **POL-HR-2024-09B | EFFECTIVE: Q3 PERFORMANCE CYCLE**
      **TO:** All Staff Level 3 and Above
      **FROM:** People Operations & Compensation Committee
      **SUBJECT:** Introduction of Performance Tier 5 ("Beyond the Call")

      **1.0 Purpose and Scope**
      This policy operationalizes the new Tier 5 ("Beyond the Call") classification within the Annual Performance Rubric. Tier 5 is designed to capture value creation that exceeds the boundaries of defined role responsibilities. This classification replaces the previous cap at Tier 4 ("Exceeds Expectations") to allow for finer granularity in high-performance differentiation.

      **2.0 Promotion Precondition**
      Effective immediately, attainment of a Tier 5 rating in at least one core competency is a mandatory prerequisite for promotion to Level 4 and above. While the specific actions required to achieve Tier 5 status are not assigned by management, employees seeking advancement must demonstrate at least one instance of Tier 5 behavior during the review cycle. Failure to provide evidence of Tier 5 behavior will result in automatic stagnation at the current level, regardless of Tier 4 performance metrics.

      **3.0 Definition of Supererogatory Deliverables**
      Tier 5 acts are defined as contributions that are beneficial to the company but not contractually required. Employees are reminded that pursuant to Ethics Policy 4.1 ("Total Value Maximization"), all staff are obligated to produce the maximum possible utility for the firm during work hours.^1 Consequently, Tier 5 status applies only to utility generated outside of standard contractual utility expectations, despite the overarching mandate to maximize total output.

      **4.0 Intent Verification**
      Credit for Tier 5 acts is contingent upon the altruistic nature of the intent. Acts undertaken with the primary objective of securing a Tier 5 rating are ineligible for classification. Employees must submit Form 88B (Declaration of Intent) alongside their performance portfolio. People Operations reserves the right to audit subjective intent through follow-up interviews. If an employee claims an act was done solely for the benefit of the company, but evidence suggests the motive was promotion eligibility, the act will be reclassified as Tier 4.

      **5.0 Cost and Sacrifice Metrics**
      To qualify as "Beyond the Call," the act must incur a demonstrable personal cost to the agent. This ensures the contribution was not merely efficient work but a genuine sacrifice. Employees must complete Attachment B ("Personal Sacrifice Ledger"), detailing hours forgone, stress incurred, or opportunity costs accepted. People Operations will audit these logs to ensure the sacrifice was material. Artificially inflated sacrifice, such as unnecessary overtime without corresponding output, will be flagged as inefficiency rather than supererogation.

      **6.0 Collective Action and Distribution**
      In cases where a team delivers a Tier 5 outcome, but no individual member's contribution exceeded their specific role obligations, no individual Tier 5 credit is awarded. Supererogatory status is assigned at the individual level only. If the collective effort was beyond the call, but the individual share was within reasonable expectations, the act is classified as "Standard Team Performance." Bonus pooling may apply, but performance rubric classification remains at Tier 4.

      **7.0 Rubric Normalization**
      This adjustment addresses statistical compression observed in the top quintile of the performance distribution. Previous data indicated that "Exceeds Expectations" was no longer sufficiently distinguishing high-performers for compensation modeling. The Tier 5 bucket is necessary to maintain the integrity of the bell curve and ensure compensation packages align with market differentiation strategies for top talent.

      ^1 *Note: Employees seeking clarification on how Tier 5 acts are optional despite the Policy 4.1 mandate to maximize all possible good should refer to the Ethics FAQ, which states that contractual obligations supersede general ethical mandates unless specified otherwise.*

