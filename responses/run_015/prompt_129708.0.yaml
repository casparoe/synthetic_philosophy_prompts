      **Q: If Tier 5 is required for promotion, is it still optional?**
      A: The action is discretionary; the result is mandatory. You are not told *what* to do, but you must do *something* extra to advance.

      **Q: Can I claim Tier 5 for working through lunch?**
      A: Only if working through lunch was not expected and incurred verifiable personal hardship. Routine overtime is considered Tier 3.

      **Q: What if my manager asks me to do a Tier 5 task?**
      A: If requested, it becomes a job requirement. You cannot receive Tier 5 credit for assigned tasks. You must identify the opportunity independently.

      **Calibration Note**
      The Compensation Committee advises managers that Tier 5 distribution should not exceed 5% of the department headcount. If more than 5% of your team appears to be acting "Beyond the Call," please recalibrate your baseline expectations for Tier 4 downward until the distribution aligns with the mandated curve. The existence of supererogatory behavior is less critical than the statistical validity of the rating distribution.

