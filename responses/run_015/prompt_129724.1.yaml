  (1) The framing and its central crux
  The Orwellian/Stalinesque distinction hinges on whether conscious reports falsify a completed experience (Stalinesque) or construct an experience that never occurred as reported (Orwellian). Dennett originally argued this distinction lacks empirical teeth without a Cartesian Theater. However, predictive processing (PP) revitalizes the debate by suggesting all conscious access involves post-hoc binding of prediction errors. The central crux is whether temporal binding windows are flexible enough to render the distinction metaphysically idle, or whether there remains a fact of the matter about the temporal location of phenomenal content independent of report. It is settled that subjects report specific temporal sequences in cases like color phi; it is contested whether these reports track prior phenomenal states or constitute them. If conscious reports function as control signals stabilizing a generative model, the difference between "revising" a record and "constructing" a state may collapse into a single functional description of error minimization. The conceptual stake is whether phenomenology has temporal truth-conditions upstream of cognitive access, or if "conscious time" is entirely constituted by the binding process itself.

  (2) Prioritized open questions with dependency-aware reasoning
  Three conceptual projects deserve priority, ordered by upstream dependency. First, establish the **Functional Equivalence Thesis** within active inference frameworks. If reports are control signals minimizing variational free energy, then "revision" (updating memory) and "construction" (generating perception) are identical optimization steps. Resolving this is upstream because if true, the Orwellian/Stalinesque binary is a category error. Philosophers can formalize this using decision-theoretic models where report accuracy is subordinate to model stability, bypassing neural latency data.

  Second, analyze the **Temporal Ontology of Prediction Errors**. Does PP require errors to be timestamped prior to binding? If errors arrive with temporal indices, Stalinesque revision remains possible. If errors are temporally neutral until bound, Orwellian construction is default. This is secondary because even if errors are timestamped, functional equivalence might render the timestamp irrelevant to consciousness. This work requires mapping formal PP architectures onto theories of temporal representation.

  Third, redefine the **Normativity of Phenomenal Truth**. If the distinction collapses, veridicality is no longer the primary norm for conscious report; stability is. This has downstream implications for epistemology. If consciousness is a stabilization tool, "illusion" becomes a functional feature. This depends on the first two projects but is crucial for integrating PP with folk psychology. Prioritize the functional equivalence question because it determines whether the other two are meaningful. If revision and construction are functionally identical, debating temporal indices is merely debugging the engine. This favors conceptual clarity over empirical adjudication. The dependency is strict: you cannot meaningfully ask about temporal boundaries (Project 2) without knowing if the boundary is constitutive of the state (Project 1). Similarly, you cannot assess epistemic norms (Project 3) without knowing if the system aims at truth or stability. By securing the functional account first, you avoid building normative or temporal theories on a potentially dissolved metaphysical foundation. This approach isolates the conceptual leverage points where formal modeling can substitute for empirical data, maximizing the impact of non-experimental work.

  (3) What evidence or conceptual argument would most shift the ranking
  The ranking shifts if a conceptual argument demonstrates that control signals necessitate a prior state to control. If stabilization logically requires something pre-existing to be stabilized, the Functional Equivalence Thesis fails, reviving the Stalinesque option as distinct from Orwellian fabrication. Conversely, a formal proof that binding windows *must* exceed neural latency for stability would cement the Orwellian default, making the distinction cosmetic. Prioritize arguments linking "control" to "temporal precedence." If control can be simultaneous with construction, the distinction dissolves. This conceptual leverage outweighs new behavioral data on color phi, which remains compatible with multiple architectures.

  (4) Honest limitations, including which feature of the debate this framing cannot capture
  This framing cannot capture non-reportable consciousness. If phenomenal overflow exists, the Orwellian/Stalinesque distinction regarding *report* misses the actual phenomenology. It also assumes PP is the correct fundamental architecture; if consciousness involves non-predictive mechanisms, the functional collapse is false. Finally, it sidesteps the qualitative feel of temporal flow. Even if functional revision and construction are identical, the *experience* of time passing might retain a distinction between "remembering differently" and "seeing differently." This framework optimizes for functional coherence but risks eliminating the explanatory target of why temporal experience feels unified rather than fragmented.
