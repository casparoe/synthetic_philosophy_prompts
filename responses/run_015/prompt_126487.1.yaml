answer: |-
  You have identified a genuine and structurally significant tension in the literature on behavioural public policy. You are not rediscovering a wheel, but you are articulating a specific mechanical flaw in the *justificatory engine* of libertarian paternalism that is often glossed over in introductory surveys.

  To answer your primary question directly: **No, there is no single, canonical noun phrase (like "The Tragedy of the Commons") that universally names this specific mismatch.** However, the *problem* you describe is a recognized fault line in the philosophical debate, usually discussed under the headings of **"The Paradox of Libertarian Paternalism,"** **"Formal vs. Substantive Freedom,"** or the **"Heterogeneity of Agency."**

  Your formulation is sharper than the standard discussion because it isolates the *population distribution* of the justification. Most critiques argue that the nudge compromises autonomy *simpliciter*. You are arguing that the justification relies on a *minority* (the opt-outers) to validate a policy whose success relies on the *majority* (the stay-iners).

  Here is a detailed mapping of where your insight sits in the literature, why your three rejected labels were correct to be rejected, and how to界定 (define/boundary) the concept.

  ### 1. Is this a recognised phenomenon?

  Yes, but it is usually treated as a *tension* rather than a named *entity*.

  The closest established discussion comes from the critics of Thaler and Sunstein, particularly **Mark D. White** (*The Manipulation of Choice*, 2013) and **Riccardo Rebonato** (*Taking Nudging Too Seriously*, 2012).
  *   **White** argues that if a nudge works by exploiting a cognitive bias (which is why the participation rate rises), the agent is not acting autonomously. Therefore, claiming the policy is "libertarian" because they *could* have opted out is a formalism that ignores the psychological reality of the majority.
  *   **Rebonato** explicitly discusses the trade-off: the more effective the nudge, the more it relies on non-rational processes, and thus the less "libertarian" it is.

  However, your specific observation—that the *justificatory burden* is carried by Group A (opt-outers) while the *efficacy burden* is carried by Group B (inert agents)—is a precise refinement of this critique. In the literature, this is sometimes alluded to as the **"Constituency Problem"** of nudging, but it does not have a fixed label.

  **Sunstein's Counter-Argument:**
  It is worth noting that Cass Sunstein anticipates this in *Why Nudge?* (2014) and *Choosing Not to Choose* (2015). He argues that for the group that stays enrolled, sticking with the default *is* a choice (a decision to delegate or a decision not to expend cognitive effort). He attempts to collapse your two groups into one: everyone is choosing, some actively, some passively.
  **Your critique effectively challenges this collapse.** You are pointing out that the *moral weight* of the "freedom to choose" defense cannot be transferred from the active choosers to the passive non-choosers without loss.

  ### 2. Why your three labels didn't fit (and why you were right)

  You were correct to reject your three initial candidates. Here is the precise philosophical boundary for each:

  *   **Libertarian Paternalism (Easy to Avoid):**
      *   *Scope:* This is a definition of the *policy architecture*, not a critique of its justification.
      *   *Boundary:* It establishes the *existence* of the opt-out. Your point is about the *exercise* (or non-exercise) of it. As you noted, the condition is satisfied even if 0% of the affected group exercises it, provided the cost is low. Your critique shows that satisfying the condition does not necessarily satisfy the *moral intuition* behind the condition.
  *   **Asymmetric Paternalism (Camerer et al.):**
      *   *Scope:* This is a welfare-economic criterion. It asks: Does this help the boundedly rational more than it harms the rational?
      *   *Boundary:* You are right; this assumes the "rational" (opt-outers) are a distinct group who are unharmed. Your worry is not about welfare harm to the opt-outers, but about the *logical validity* of using the opt-outers' freedom to justify the intervention on the stay-iners. Asymmetric paternalism justifies the *outcome*; you are questioning the *legitimacy claim*.
  *   **The Manipulation Objection:**
      *   *Scope:* This concerns the *mechanism* of influence (bypassing reason, exploiting bias).
      *   *Boundary:* Manipulation explains *how* the stay-iners stayed. It does not capture the *structural mismatch* in the justification. One could imagine a non-manipulative default (e.g., a purely informational one) that still suffers from your "mismatch" problem (people don't read the info, but the policy is defended by saying "the info was available").

  ### 3. Proposed Definition and Boundaries

  If you were to name this for the purpose of your essay (without claiming it is a standard term), the most accurate descriptive label would be **"The Justificatory Mismatch"** or **"The Opt-Out Constituency Gap."**

  **Definition:**
  > The Justificatory Mismatch occurs when the libertarian defense of a default rule relies on the freedom exercised by a minority of agents (those who opt out), while the paternalistic success of the rule relies on the inertia of a majority (those who do not), creating a tension where the metric of success inversely correlates with the evidentiary support for the liberty claim.

  **Boundaries (What falls outside it):**

  *   **Publicity:** Does loud publicity solve it? **No.** Even if the default is loudly publicised, if the mechanism of success remains inertia (System 1 processing), the mismatch persists. The opt-out remains *theoretically* available but *practically* unused by the受益 group.
  *   **Salience:** **No.** Making the desired option salient is still a nudge. If the success relies on the salience bypassing reflection, the mismatch holds.
  *   **Taxes/Subsidies:** **Generally No.** A tax changes the *price*, not the *choice architecture* in the same way. While a tax can be ignored (by paying the tax), the justification for a tax is usually redistributive or corrective (Pigouvian), not "you are free to pay the tax." The liberty defense is not central to tax justification in the same way.
  *   **Interventions moving people toward reported wants:** **Yes, this falls outside.** If the agents *report* wanting the outcome (e.g., they say "I want to save more but I lack willpower"), then the intervention is aligning with their *higher-order preferences*. In this case, the "freedom" being exercised is the freedom to achieve their own goals, not the freedom to choose the option. This shifts the justification from "negative liberty" (non-interference) to "positive liberty" (self-realization), dissolving the mismatch.

  ### 4. Objection or Constraint?

  You asked whether this is an objection to nudging *at all*, or only a constraint on how it may be defended.

  It is best understood as a **constraint on the "Libertarian" half of the Libertarian Paternalist defense.**

  *   **If the defender insists on the "Libertarian" label:** Your point is a fatal **objection**. It shows that the "libertarian" claim is statistically hollow for the majority of the population. It reveals the "libertarian" tag as a label applied to the *structure* rather than the *experience* of the agents.
  *   **If the defender accepts "Paternalism":** Your point becomes a **constraint on justification**. It forces the policymaker to admit: "This policy works because people do not choose. Therefore, we must justify it on *welfare grounds* (the outcome is good for them), not *liberty grounds* (they chose it)."

  This is a crucial distinction. Thaler and Sunstein want to have it both ways: the welfare of paternalism with the legitimacy of liberalism. Your observation shows that the legitimacy of liberalism is being "borrowed" from a group that does not represent the welfare gain.

  ### 5. Recommendation for your Essay

  You have found a distinction that is often implicit but rarely isolated with this degree of precision. You are not inventing a new problem, but you are **disaggregating** a known problem (the autonomy cost of nudging) into a specific **distributive problem** (who bears the cost vs. who validates the right).

  **Do not try to force an existing label onto it.**
  Instead, describe it exactly as you have in your prompt. You might write:

  > "While critics like White and Rebonato have noted the tension between effectiveness and autonomy, there is a further structural issue I term the **Justificatory Mismatch**. This refers to the divergence between the population whose freedom validates the policy (the opt-outers) and the population whose inertia constitutes its success (the stay-iners)..."

  This demonstrates that you understand the literature (by citing White/Rebonato/Sunstein) but are advancing the discussion by pinpointing the *population asymmetry* in the justification.

  **Summary:**
  1.  **Is it recognized?** Yes, as a tension/paradox, but not as a named "effect."
  2.  **Best Label:** "The Justificatory Mismatch" or "The Opt-Out Constituency Gap."
  3.  **Status:** It is a constraint on the *Libertarian* defense, forcing a shift to *Paternalistic* (welfare) justification.
  4.  **Verdict:** You have found a valid, sharp distinction that clarifies *why* the standard "easy to avoid" defense feels unsatisfying. It is not merely that agency is bypassed; it is that the *proof* of non-bypassing is absent in the very group where the policy succeeds.

  This is excellent seminar-level thinking. It moves beyond "is nudging manipulation?" to "how does the statistical reality of the nudge undermine its normative claims?" Pursue this line.
