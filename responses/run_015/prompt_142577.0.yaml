      **Title:** PROPOSAL FOR THE SECOND LOT: FINALIZING STATISTICAL SOVEREIGNTY
      **Issuer:** Office of the Lot
      **Date:** Cycle 40, Week 3

      **Preamble:**
      For four decades, the People's Sample has served as the upper chamber, demonstrating that stratified sortition yields stability unattainable through partisan competition. The Office of the Lot now proposes the Second Lot Reform, extending the logic of random selection to the lower chamber and executive functions. This document outlines the technical apparatus required to maintain descriptive representativeness against the corrupting influence of tenure and information. Legitimacy derives not from consent expressed at intervals, but from the mathematical equivalence between the governing body and the governed population at any given moment.

      **1. The Sealed Verdict Protocol**
      To preserve the integrity of the sample, legislative voting must occur prior to deliberation. Upon induction, Members of the Sample (MoS) will record their votes on all pending questions using the Sealed Verdict mechanism. These votes are cryptographically locked and tallied only after the eleven-week term concludes. Deliberation continues throughout the term, but it cannot alter the outcome. This ensures that the verdict reflects the raw intuition of the stratum rather than the refined preferences of a political class. A member who changes their mind during debate ceases to stand for the stratum that was drawn; a body that no longer matches the population has lost the only property that made its verdict authoritative. The Sealed Verdict guarantees that the law remains the product of the public's initial state, uncorrupted by the acquisition of expertise.

      **2. Sample Drift and Re-randomization**
      Representativeness is a dynamic condition requiring continuous monitoring. The Office will measure Sample Drift weekly, defined as the divergence between a member's post-deliberation opinions and the opinions of their cell in the population at large. Members exceeding the threshold of divergence will be re-randomized—discharged and replaced by a fresh draw from the same cell. This maintains the statistical fidelity of the chamber. If a member learns too much, they become an outlier. The state cannot be governed by outliers. Table 1 outlines the permissible variance limits.

      **Table 1: Permissible Drift Margins by Socioeconomic Cell**
      | Cell Category | Drift Threshold (%) | Re-randomization Trigger |
      | :--- | :--- | :--- |
      | Income Quintile 1 | 4.5 | >2 Std. Dev. |
      | Income Quintile 2-4 | 3.0 | >1.5 Std. Dev. |
      | Income Quintile 5 | 2.5 | >1 Std. Dev. |
      | Regional Minority | 5.0 | >2.5 Std. Dev. |

      **3. The Reversion Lot Mechanism**
      Policy failure must not be interpreted as error. Under the Second Lot, a decision of the Sample that subsequently proves unworkable or unpopular is not treated as a mistaken decision but as evidence of a defective draw. The decision is voided, the question returns to the pool, and the body is thereby never wrong, only mis-sampled. This protects the institution's legitimacy. If a law fails, it implies the specific combination of citizens selected did not accurately mirror the national will over time. The Reversion Lot ensures that the Sample remains infallible by definition, as any failure results in a reset rather than a correction of policy.

      **4. The Question Lot and Shadow Members**
      Since power over the agenda would be the one remaining form of rule by some over others, the questions themselves are drawn by lot from a pool drafted by the secretariat, which holds no power because it only decides what is asked. This neutralizes agenda-setting bias. Furthermore, because the chance of selection must be equal for all residents, including those who cannot serve, each such category is assigned an adult proxy drawn from the same stratum, who deliberates, speaks, and does not vote. These Shadow Members ensure that the incapacitated maintain statistical presence without violating the principle of active service. Compelled service is the purest form of consent, as it removes the selection bias of willingness.[1]

      **5. Epistemic Closure and Deliberation**
      Critics suggest that deliberation and representativeness pull in opposite directions, arguing that debate improves decision quality. We acknowledge this worry but contend that improvement is distortion. The epistemic case for sortition relies on aggregation over many imperfect judges, not the refinement of judgment. If members become better informed than the population they mirror, the aggregation argument collapses. Therefore, we double down on ignorance as a virtue. The Sample is trustworthy precisely because its members are ordinary. To educate them is to disqualify them. The Second Lot prioritizes the mirror over the lamp.

      **Implementation Timetable**
      *   **Phase 1 (Months 1-6):** Recruitment of Secretariat staff for Question Pool drafting.
      *   **Phase 2 (Months 7-12):** Calibration of Drift Monitoring software across all strata.
      *   **Phase 3 (Year 2):** First convening of the Full Sample; lower chamber seats vacated.
      *   **Phase 4 (Year 3):** Electoral Commission transitions to archival status; voter registries repurposed for demographic stratification.

