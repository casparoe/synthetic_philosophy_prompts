prompt: |-
  Hey, I'm putting together a workshop for junior legislative drafters and I need a reusable decision procedure they can actually run. You should act like an expert in penal philosphy and institutional design—think carefully, start by brainstorming the distinctions that survive when you move from seminar-room talk to statutory text, then build the tool. I need a step-by-step checklist for classifying whether a sentencing bill is operating on retributivist logic (backward-looking desert, proportionality to blame) or consequentialist logic (forward-looking deterrence, rehabilitation, incapacitation), plus a specific flag for "rationale laundering"—where the language sounds like one but the mechanism does the other. The proscedure needs ordered questions, clear stop points ("label it X"), explicit escalation points where the call is about values not facts, and a time budget of about 15 minutes per bill with no philosophy training required. Then run it on two proposals: first, a bill that sets mandatory prison terms for ecological damage calculated by an "ecosystem harm index" that mimics proportionality but is actually driven by predictive damage modeling; second, a bill allowing sentence reduction for assault if the offender completes trauma-informed CBT, but framing the reduction as "earning mercy" rather than hitting rehab targets. Include one case where the checklist gives your drafters an answer they won't like and still have to document. End by saying exactly where the procedure will misfire or where two analysts in good faith will run it differently, and don't ask for any citations or reading lists—just the practical framework.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Expert in penal philosophy and institutional design.
      *   **Task:** Create a reusable decision procedure (checklist/tool) for junior legislative drafters to classify sentencing bills as Retributivist or Consequentialist, including a flag for "Rationale Laundering."
      *   **Constraints:**
          *   Must work in statutory text (not seminar talk).
          *   Step-by-step checklist with ordered questions.
          *   Clear stop points ("Label it X").
          *   Explicit escalation points (values vs. facts).
          *   Time budget: ~15 minutes per bill.
          *   No philosophy training required.
          *   Run the tool on two specific proposals (Ecological Harm Index & Trauma-Informed CBT).
          *   Include one case where the answer is unwelcome but must be documented.
          *   End with limitations/misfire points (where analysts might disagree).
          *   No citations or reading lists.

  2.  **Deconstruct the Core Concepts for Statutory Application:**
      *   *Retributivism:* Backward-looking. Focus on the act committed, moral blameworthiness, proportionality (punishment fits the crime), desert ("they deserve this"). Key statutory markers: "gravity of offense," "moral culpability," "just punishment," fixed tariffs based on harm done.
      *   *Consequentialism:* Forward-looking. Focus on future outcomes, deterrence, rehabilitation, incapacitation ("protect the public"). Key statutory markers: "risk assessment," "treatment programs," "public safety," "likelihood of reoffending," "reintegration."
      *   *Rationale Laundering:* Using the language of one to justify the mechanism of the other. E.g., Calling a risk-based detention "just deserts" or calling a punitive measure "rehabilitative."

  3.  **Drafting the Decision Procedure (The Tool):**
      *   *Goal:* Make it algorithmic enough for juniors but sensitive enough for nuance.
      *   *Structure:*
          *   Phase 1: Textual Scan (5 mins). Look for specific keywords and structural triggers.
          *   Phase 2: Mechanism Test (5 mins). What actually drives the sentence length/condition?
          *   Phase 3: The Laundering Flag (3 mins). Compare Phase 1 and Phase 2.
          *   Phase 4: Escalation (2 mins). Where values clash.
      *   *Constraints:* Keep language plain. Avoid terms like "deontology" or "utilitarianism." Use "Backward-Looking" vs. "Forward-Looking."

  4.  **Developing the Test Cases:**
      *   *Case 1: Ecological Harm Index.*
          *   Surface: "Proportionality" (sounds Retributive).
          *   Mechanism: "Predictive damage modeling" (sounds Consequentialist/Risk).
          *   Expected Outcome: Rationale Laundering (Retributive language, Consequentialist engine).
      *   *Case 2: Assault & CBT.*
          *   Surface: "Earning mercy" (sounds Retributive/Grace).
          *   Mechanism: "Completing CBT" (Consequentialist/Rehab).
          *   Expected Outcome: Rationale Laundering (Consequentialist engine, Retributive/Moral language). *Wait, let's refine this.* The prompt asks for one case where the drafters get an answer they won't like. Let's make Case 2 the "unwelcome" one. If the bill *says* it's about rehab but the tool says it's actually punitive (or vice versa).
          *   *Correction:* The prompt specifies the second bill frames reduction as "earning mercy" (Retributive language) but mechanism is CBT (Consequentialist). This is laundering.
          *   *Unwelcome Answer:* Let's ensure one of these reveals a contradiction the drafters tried to hide. Let's make the Ecological one the "Unwelcome" one because it reveals the "proportionality" is a sham. Or better, let's create a scenario within the application where the tool forces them to admit a bill is purely incapacitative despite claiming to be rehabilitative.
          *   *Decision:* I will stick to the prompt's specific descriptions for the two proposals but ensure the *analysis* highlights the unwelcome truth in one. The prompt asks to "Include one case where the checklist gives your drafters an answer they won't like." I can interpret the Ecological bill as the one where they *want* it to look like justice (desert) but the tool exposes it as risk management.

  5.  **Refining the Procedure (Iterative Polish):**
      *   Need to ensure "Stop Points."
      *   Need to ensure "Escalation Points" (where the tool says "Stop, this is a policy choice, not a drafting error").
      *   Time limit: 15 mins. Keep questions binary (Yes/No) where possible.

  6.  **Addressing the "Misfire" Section:**
      *   Where will this fail? Mixed motives (most bills are hybrid).
      *   Ambiguous text (legislative compromise often creates ambiguity on purpose).
      *   Judicial discretion (the bill might be neutral, but judges apply it one way).

  7.  **Final Review against Constraints:**
      *   Expert tone? Yes.
      *   No seminar talk? Yes, focus on text/mechanism.
      *   Step-by-step? Yes.
      *   Two proposals run? Yes.
      *   Unwelcome answer included? Yes.
      *   Limitations section? Yes.
      *   No citations? Yes.

  8.  **Drafting the Content (Mental Simulation):**
      *   *Intro:* Set the stage. This is about institutional integrity, not philosophical purity.
      *   *The Tool:* "The Sentencing Logic Audit."
      *   *Step 1:* The Trigger. What starts the clock? (Conviction vs. Risk).
      *   *Step 2:* The Variable. What changes the sentence? (Harm done vs. Future risk).
      *   *Step 3:* The Cap. What stops the punishment? (Desert met vs. Risk mitigated).
      *   *Laundering Check:* Do Step 1 and Step 2 match?
      *   *Application:* Walk through the Ecological and Assault bills.
      *   *Limitations:* Be honest about the gray zones.

  9.  **Self-Correction on "Unwelcome Answer":**
      *   I need to make sure I explicitly state *why* the answer is unwelcome. For the Ecological bill, the drafters probably want to claim they are being "fair" (proportionate). The tool will show they are actually being "predictive" (risk-based). This undermines the claim of justice. That's the unwelcome truth.

  10. **Final Polish:** Check tone. Ensure it sounds like a practical manual, not an academic paper. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't use philosophy jargon. Instead of "Retributivist," use "Backward-Looking (Desert)." Instead of "Consequentialist," use "Forward-Looking (Outcome)." Actually, the prompt asks to classify as "Retributivist logic" or "Consequentialist logic." I will use those terms but define them operationally.

  Let's build the "Sentencing Logic Audit (SLA)."

  *   **Phase 1: The Anchor (5 mins).** What is the primary input?
  *   **Phase 2: The Engine (5 mins).** What drives the duration/intensity?
  *   **Phase 3: The Exit (3 mins).** How do you get out?
  *   **Phase 4: The Laundering Flag (2 mins).** Mismatch check.

  Okay, ready to write.cw
answer: |-
  # The Sentencing Logic Audit (SLA)
  **For Junior Legislative Drafters**  
  **Time Budget:** 15 Minutes  
  **Purpose:** To ensure statutory text matches policy intent and to identify "Rationale Laundering" (where the stated goal contradicts the legal mechanism).

  ## Instructions
  Do not debate the *merits* of the philosophy. Your job is to identify the *mechanism* written in the text. If the text is ambiguous, mark "Escalation Required." Work through the phases in order. If you hit a **STOP** command, record the label and move to Phase 4.

  ---

  ## Phase 1: The Anchor (Input)
  *Look at the section defining the basis for the sentence.*

  1.  **Q1:** Does the sentence length/condition depend primarily on the **severity of the past act** (harm caused, intent at the time)?
      *   *Yes:* Go to Q2.
      *   *No:* Go to Q3.
  2.  **Q2:** Does the text use terms like "culpability," "gravity," "just punishment," or "proportionate to the offense"?
      *   *Yes:* **STOP. Label: RETRIBUTIVE (Backward-Looking).** Proceed to Phase 4.
      *   *No:* Go to Q3.
  3.  **Q3:** Does the sentence length/condition depend primarily on **future probability** (risk of reoffending, likelihood of rehabilitation, threat to public)?
      *   *Yes:* **STOP. Label: CONSEQUENTIALIST (Forward-Looking).** Proceed to Phase 4.
      *   *No:* **ESCALATION.** The bill mixes anchors without priority. Flag for Senior Counsel.

  ## Phase 2: The Engine (Variable)
  *Look at the section allowing sentence modification (aggravation/mitigation).*

  4.  **Q4:** To increase or decrease the sentence, must the court find new facts about the **crime itself** (e.g., use of a weapon, amount of loss)?
      *   *Yes:* Points to Retributive.
      *   *No:* Points to Consequentialist.
  5.  **Q5:** To increase or decrease the sentence, must the court find facts about the **offender's status or future** (e.g., completion of therapy, risk assessment score, gang affiliation)?
      *   *Yes:* Points to Consequentialist.
      *   *No:* Points to Retributive.
  6.  **Q6:** Compare Q4 and Q5. Do they point in the same direction as Phase 1?
      *   *Yes:* Consistent Logic. Proceed to Phase 4.
      *   *No:* **Potential Laundering.** Proceed to Phase 3.

  ## Phase 3: The Exit (Termination)
  *Look at the release conditions or maximum caps.*

  7.  **Q7:** Is the maximum sentence capped by the **seriousness of the crime** (e.g., "Class A Felony max 10 years")?
      *   *Yes:* Retributive Constraint.
  8.  **Q8:** Is the release contingent on **meeting a behavioral target** (e.g., "until deemed no longer a risk," "upon program completion")?
      *   *Yes:* Consequentialist Constraint.
  9.  **Q9:** If Phase 1 was Retributive, but Q8 is Yes, you have a **MISMATCH.**
      *   If Phase 1 was Consequentialist, but Q7 is Yes, you have a **MISMATCH.**

  ## Phase 4: The Laundering Flag & Documentation
  *Compare your labels from Phases 1–3.*

  *   **Clean Bill:** Anchor, Engine, and Exit all align (e.g., all Retributive or all Consequentialist).
  *   **Hybrid Bill:** Explicitly states it serves both goals (e.g., "for punishment AND rehabilitation"). *No flag needed.*
  *   **Rationale Laundering:** The text claims one goal (in the Purpose Clause) but the Mechanism (Anchor/Engine/Exit) enforces the other.
      *   **Action:** Attach the "Laundering Warning" to the draft. State clearly: *"Purpose Clause claims X, but Section Y operates as Z."*

  ---

  ## Application: Test Run on Two Proposals

  ### Proposal A: The "Ecological Harm Index" Bill
  **Text Summary:** Sets mandatory prison terms for corporate environmental violations. Terms are calculated by an "Ecosystem Harm Index." The Index measures current damage but weights it heavily against "predictive recovery models" (how long nature will take to heal). Purpose Clause states: "To ensure offenders pay a debt proportionate to the damage inflicted."

  **SLA Run:**
  1.  **Phase 1 (Anchor):** Q1 (Severity of past act?) -> *Yes/No Mix.* Q3 (Future probability?) -> *Yes.* The "predictive recovery model" bases the sentence on future healing time, not just past harm. **Label: CONSEQUENTIALIST.**
  2.  **Phase 2 (Engine):** Q5 (Offender status/future?) -> *Yes.* Sentence varies based on predictive modeling of the ecosystem, not just the dump volume.
  3.  **Phase 3 (Exit):** Q7 (Capped by crime seriousness?) -> *No.* Capped by recovery time.
  4.  **Phase 4 (Laundering Check):**
      *   Purpose Clause claims: "Proportionate debt" (Retributive language).
      *   Mechanism operates: "Predictive recovery" (Consequentialist mechanism).
      *   **Result:** **RATIONALE LAUNDERING DETECTED.**

  **Drafters' Unwelcome Answer:**
  The drafters want to sell this as "Justice for Nature" (Retributive). The SLA forces them to document that this is actually "Risk/Repair Management" (Consequentialist). This is unwelcome because Retributive logic limits punishment (you only pay for what you broke), whereas Consequentialist logic can extend punishment indefinitely until the model says the risk/damage is cleared. The SLA exposes that the "proportionality" claim is legally false. They must document this mismatch before finalizing.

  ### Proposal B: The "Trauma-Informed Mercy" Bill
  **Text Summary:** Allows sentence reduction for assault offenders. Mechanism: Complete a 6-month Trauma-Informed CBT program. Purpose Clause: "To allow offenders to earn mercy through moral growth and acknowledgment of harm."

  **SLA Run:**
  1.  **Phase 1 (Anchor):** Q1 (Severity of past act?) -> *Yes* (Conviction required). Q3 (Future probability?) -> *No.* **Label: RETRIBUTIVE** (Baseline is the crime).
  2.  **Phase 2 (Engine):** Q5 (Behavioral target?) -> *Yes.* Reduction depends on completing CBT (Future/Rehab behavior).
  3.  **Phase 3 (Exit):** Q8 (Contingent on target?) -> *Yes.*
  4.  **Phase 4 (Laundering Check):**
      *   Purpose Clause claims: "Earn mercy/moral growth" (Retributive/ Moral language).
      *   Mechanism operates: "Complete CBT" (Consequentialist/Rehab mechanism).
      *   **Result:** **RATIONALE LAUNDERING DETECTED.**

  **Analysis:**
  The bill frames rehabilitation as a moral transaction ("mercy"). The SLA flags that "completing CBT" is a clinical/behavioral metric, not necessarily a moral one. An offender can fake CBT compliance (Consequentialist box-checking) without "moral growth" (Retributive requirement). The drafters are using moral language to sell a rehab program. The SLA requires them to align the text: either change the purpose to "public safety/reintegration" or change the mechanism to a moral hearing (which is unadministrable).

  ---

  ## Limitations & Misfire Points
  *Be advised: This tool is a heuristic, not a truth machine. Two analysts in good faith will diverge on the following:*

  1.  **The "Mixed-Motive" Gray Zone:** Most bills are compromises. If a bill says "for punishment AND public safety," the SLA classifies it as a Hybrid. However, if the *weighting* is unclear (e.g., does public safety override punishment caps?), the SLA will trigger an Escalation. Analysts often disagree on whether a clause is a "tie-breaker" or a "factor."
  2.  **Judicial Discretion vs. Statutory Text:** The SLA analyzes the *text*, not the *courtroom*. A bill may look Retributive (fixed tariffs) but judges may apply it Consequentialistically (using discretion to vary based on risk). The SLA cannot predict judicial behavior. If the text grants broad discretion, the SLA will often flag "Escalation" because the logic is delegated to the judge, not the statute.
  3.  **The "Incapacitation" Blind Spot:** The SLA distinguishes between Desert and Risk. It struggles when the goal is simple incapacitation (locking someone up because they are dangerous, regardless of blame). This often reads as Consequentialist but feels punitive. Analysts may disagree on whether "Protect the Public" is a Consequentialist goal (deterrence/rehab) or a Retributive one (neutralizing a threat). The SLA classifies it as Consequentialist, which may conflict with political intent.
  4.  **Semantic Drift:** Words like "accountability" or "responsibility" are used by both sides. Analyst A may read "accountability" as "taking blame" (Retributive). Analyst B may read it as "answering for future conduct" (Consequentialist). The SLA requires you to look at the *mechanism* (what changes the sentence), not the *noun*. If you focus on the nouns, the tool will misfire.

  **Final Instruction:** If the SLA flags Laundering, do not fix it yourself. Document the mismatch and escalate to the Policy Lead. It is their choice to align the text or accept the contradiction. Your job is to make the contradiction visible.
