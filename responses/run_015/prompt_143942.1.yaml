answer: |-
  Your intuition is correct: introducing the randomizing device is not a cheat but the only rational solution, because decision theory demands we evaluate policies rather than isolated acts, and only a mixed strategy breaks the deterministic link that guarantees your death.

  Let us begin with the arithmetic, which vindicates your hunch. If you choose the pure act "Stay," Death's simulation predicts "Stay," Death waits in Damascus, and you die; your utility is 0 (survival value 0, cost 0). If you choose the pure act "Go," Death's simulation predicts "Go," Death waits in Aleppo, and you die; your utility is -1 (survival value 0, cost 1). If you adopt the mixed policy "Randomize 50/50," the simulation replicates your policy but cannot match the independent quantum outcome. There is a 50% chance your paths cross (Death) and a 50% chance they diverge (Survival). Your expected survival value is 500 units (0.5 × 1,000), and your expected cost is 0.5 units (0.5 × £1,000 fare scaled to your units). Your net expected utility is 499.5. This strictly dominates staying (0) and going (-1). The numbers do not lie: a fifty per cent chance of life is infinitely preferable to a certainty of death, and even on linear utility scales, 499.5 crushes 0.

  Your friends' first objection is that you have changed the subject by altering the stipulation that Death predicts perfectly. They argue that if Death is defined as a perfect predictor, he must predict the coin toss. This confuses predicting a *decision* with predicting a *physical event*. The puzzle stipulates Death predicts *you*—your reasoning, your temperament, your algorithm. If your algorithm is "flip a quantum coin," Death's simulation contains a simulated quantum coin. By the laws of physics you invoked, the simulated coin is statistically independent of the real one. Death predicts your *policy* perfectly, but he cannot predict the *output* of that policy better than chance. You have not broken the rules; you have simply realized that the option set available to a rational agent includes mixed strategies, not just pure acts. To exclude randomization is to arbitrarily restrict the agent's toolbox before the calculation begins.

  The second objection is subtler: once the coin lands heads and you are on the coach, you possess the same evidence of doom as the person who simply decided to go. Since the simulation matched your policy, finding yourself going is evidence that the simulation went, so Death is in Aleppo. Therefore, you should regret the policy. This objection conflates *ex-ante* rationality with *ex-post* regret. Decision theory evaluates the choice of procedure before the procedure is executed. At the moment of choice, you do not know the coin's outcome. You know only that adopting the policy yields a 50% survival rate. Once the coin lands, you are no longer making a decision; you are executing a binding commitment. If you allow yourself to reconsider after the coin flip, you are no longer randomizing—you are reverting to a pure act based on new evidence, which collapses the strategy back into certain death. The rationality lies in the binding nature of the policy: you must be the sort of agent who follows through even when the conditional evidence looks grim, because that very disposition is what secured the 50% survival probability in the first place.

  The third objection is that a clever Death would anticipate the trick and adapt. This is where game theory clarifies the picture. You are describing a zero-sum game between you and Death. If you play a pure strategy (Stay or Go), Death's best response is to match it, yielding you 0 utility. If you play a mixed strategy (50/50), Death's best response is irrelevant: whether Death chooses Damascus, Aleppo, or mixes himself, his maximum accuracy against a true randomizer is 50%. If Death stays in Damascus, you survive whenever the coin says Go (50%). If Death goes to Aleppo, you survive whenever the coin says Stay (50%). Death cannot exploit a mixed strategy because there is no pattern to exploit. This is the Nash Equilibrium of the game. Your friends imagine Death can outthink the randomizer, but against a source of genuine entropy, prediction is mathematically limited to the base rate. You force Death into a game where his maximum payoff is minimized, which is precisely what you should do when facing a superior opponent.

  This leads to the broader philosophical point you suspected: the dispute between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) has been conducted over the wrong option set. Both theories traditionally assume the options are "acts" like Stay or Go. CDT says "your act doesn't cause Death's location, so stay," ignoring that your act is evidence of Death's location. EDT says "going is evidence of death, so stay," ignoring that staying is also evidence of death. Both fail because they treat the act as the unit of choice. The correct unit of choice is the *policy* or *algorithm*. When you expand the option set to include policies like "Randomize," you dissolve the paradox. This aligns with newer frameworks like Functional Decision Theory, which treats your decision as the output of a function that the predictor simulates. By choosing a function that outputs randomness, you decouple the simulation from the reality in the only way physics allows. You are not cheating Death; you are recognizing that in a world where your reasoning is legible to a predictor, the only private move left is to stop reasoning deterministically. Stick with the box.
