answer: |-
  ### Part 1: The Translation (Archaeological Inference as Reverse Engineering)

  Here is the archaeological problem restated in your vocabulary.

  **The Core Mapping**
  *   **The Artifact Assemblage:** A stripped, statically linked binary, partially corrupted by disk sector errors.
  *   **The Culture/Behavior:** The source code and the developer intent.
  *   **Taphonomy (Formation Processes):** Post-execution memory degradation. The program stopped running (the culture ended), and then the storage medium suffered bit rot, physical warping, and overwriting by other processes (natural sedimentation, animal burrowing, erosion).
  *   **Excavation:** Static analysis. You are dumping the memory heap and disassembling the text segment without being able to attach a debugger.
  *   **Ethnoarchaeology:** Access to the compiler toolchain and a corpus of source code from *related* projects (analogous cultures) to infer how *this* binary was likely built.
  *   **The "Underdetermination" Problem:** Non-unique decompilation. Multiple distinct source programs (cultural histories) can compile to the same object code (artifact record).
  *   **Dynamic Analysis:** Impossible. You cannot run the binary (observe the culture in motion) to see how it handles exceptions or what values it loads into registers at runtime.

  **Where the Mapping Does Real Work**
  This analogy holds up well on the epistemic gap. You know that a decompiler can show you *what* the binary does (the control flow graph), but it cannot tell you *why* a specific optimization was chosen (was it for speed, size, or a programmer's quirk?). Similarly, archaeology can describe the physical constraints of a pot or wall, but not the social constraint that mandated it. The concept of "optimizations erasing what the author wrote" maps perfectly to "cultural traditions becoming habitual until the original meaning is lost."

  **Where the Mapping is a Metaphor Wearing a Work Shirt**
  The breakdown occurs at the **Source Code Assumption**. In your work, you operate on the axiom that a source file *existed*. Even if you never recover it, the binary is a deterministic transformation of that source. The compiler is a function $f(source) = binary$.

  Your friend is challenging the existence of $source$. She is arguing that for some social phenomena, there was no discrete "rule" or "belief" that generated the "object." The object *and* the behavior are coupled in a runtime loop. In RE terms, she is claiming that sometimes the binary is **self-modifying code** where the logic emerges from the execution environment, not a pre-compiled instruction set. Or, more accurately, the "institution" is not the code, but the **runtime state**. You are looking for a `.text` section (the rule), but she is saying the institution is the value in the heap at a specific clock cycle (the deposit event).

  **Confidence: 90%**

  ---

  ### Part 2: Residue Report (The Three Cases)

  #### Case 1: The Constant Doorway Bearing
  *   **RE Conclusion:** You would classify this as a **hardcoded constant** or an **alignment constraint**. You'd assume either a `#define DOOR_ANGLE 0x45` in the header (cultural rule) or that the linker script forced alignment to a memory boundary for performance (construction technique). You would look for the "compiler flag" that enforced this.
  *   **Clean Translation:** The "byproduct" story (everyone walked the same track) translates cleanly as a **build environment constraint**. The path is the linker script; the door is the resulting binary layout.
  *   **Distortion:** In RE, a build constraint is technical. In Archaeology, a technical constraint can *become* a ritual. If the path was sacred, the constraint is both technical and symbolic. Your vocabulary forces a split between "optimization" (technical) and "intent" (symbolic).
  *   **Unsayable:** That the orientation *is* the social cohesion. If the bearing is just a byproduct of walking a track, there is no "rule" to recover. The "institution" is the repeated act of walking, not a rule about doors.
  *   **Specific Question (Shared Routine):** Yes, this has an analogue. It is a **macro** or a **build script** that computes a value based on environment variables. If every builder runs the same script, the output is constant, even if no one knows why the script calculates that number. However, in RE, someone wrote the script. In her view, the "script" (the habit) might have emerged without an author.

  **Confidence: 85%**

  #### Case 2: The Axe Deposits
  *   **RE Conclusion:** You see **data blobs** with high entropy but specific structure (groups of 3, 8, 12). You would ask: Is this **payload** (wealth/value) or **padding/checksum** (ritual/symbolic)? You would look for pointers to this data in the code. Since there are no pointers (no context of use), you'd label it "unreferenced data."
  *   **Clean Translation:** The "stored wealth" vs. "votive deposition" debate maps to **Data vs. Code**. Is the axe a variable holding value, or is the deposition an instruction executing a social function?
  *   **Distortion:** The "Utilitarian vs. Symbolic" split. In RE, data is passive. In Archaeology, a "symbolic" object *does work* (it binds a community, appeases a god). A votive axe is functional software, not just data. Your vocabulary lacks a category for "data that executes logic by existing."
  *   **Unsayable:** That the deposit *is* the economy. If the axes are never used, their "value" isn't stored in them; it's generated by the act of burying them. The "institution" of value is the deposition event, not the metal object.
  *   **Specific Question (Utilitarian vs. Symbolic):** This is a **fake distinction** in your framework. You treat code as active and data as passive. In archaeology, "symbolic" objects are active agents in the social system. Calling it "symbolic" doesn't make it non-functional; it just changes the API it interacts with (social vs. physical).

  **Confidence: 80%**

  #### Case 3: The Absence of Burials
  *   **RE Conclusion:** **Missing logs** or **stripped debug symbols**. You assume the function `handle_death()` exists but was optimized out, or the logs were written to a partition you haven't imaged yet (the next valley). You assume the program *must* handle exceptions (death).
  *   **Clean Translation:** "Survey sampled the wrong parts" maps to **incomplete memory dump**. "Disposed of in ways leaving nothing" maps to **secure erase** (organic decomposition).
  *   **Distortion:** In RE, if a function isn't called, it doesn't run. In Archaeology, the *absence* of a feature can be a positive signal. If everyone else buries dead and these people don't, the "null pointer" is the signal.
  *   **Unsayable:** That the absence *is* the institution. In RE, a missing function is a lack of capability. In Archaeology, the refusal to bury (or the lack of a concept of burial) is a positive cultural state. The "institution" is the lack of a trace.
  *   **Specific Question (Deposits as Institution):** This is the hardest fit. In RE, you can't have a function call without a function. She is saying the "institution" is the *negative space* in the binary.

  **Confidence: 95%**

  ---

  ### Part 3: The Three Specific Concepts

  **1. Utilitarian versus Symbolic (Code/Data Distinction?)**
  In your vocabulary, this looks like Code (logic) vs. Data (values). You assume Code *does* and Data *is*.
  *   **Verdict:** This is a **category error** when applied to archaeology. A "symbolic" axe in a pit is executing a social function (reinforcing hierarchy, marking territory). It is code. A "utilitarian" axe in a house is also executing a social function (defining labor roles). Both are code. The distinction isn't Code vs. Data; it's **API Layer**. Utilitarian objects interact with the physics engine; symbolic objects interact with the social engine. Your framework assumes one runtime environment; archaeology deals with two coupled runtimes.

  **2. Constant Doorway Bearing (Shared Routine?)**
  *   **Verdict:** Yes, this translates. It is a **deterministic build process**. If the "source" is the path walked, and the "compiler" is the builder following the path, the "binary" (door) inherits the path's angle.
  *   **Caveat:** In RE, the build script is distinct from the binary. In her view, the "script" (the habit) exists *only* in the execution. If they stop building, the script vanishes. It is **ephemeral code**.

  **3. Deposits *as* Institution (Source Code Existence?)**
  *   **Verdict:** This is where your vocabulary fails. You assume **Source Precedence**. You believe the rule (source) precedes the action (binary). She is describing **Structuration**: the action creates the rule, which constrains the action, in a loop.
  *   **Counterpart in RE:** The closest analogue is **Emergent Behavior in a Botnet**. No single binary contains the "institution" of the botnet. The institution is the network traffic pattern. If you dump one node (excavate one house), you see the packets (deposits), but the "logic" is in the handshake, not the file.
  *   **The Gap:** You look for the `main()` function (the rule). She says `main()` is distributed across the network packets (the deposits). There is no single source file to recover.

  **Confidence: 85%**

  ---

  ### Part 4: The Verdict

  **Is the residue a defect in your vocabulary, evidence of her substantive claim, or ambiguity?**

  It is **evidence that she is claiming something substantive that you genuinely cannot represent** without significant distortion.

  Your vocabulary is built on **Intentionality** and **Lineage**. A binary implies a compiler; a compiler implies a programmer. Even in malware, there is an author. Archaeology, specifically prehistoric archaeology, deals with **Collective Emergence**. The "author" is a distributed system of thousands of agents over centuries. The "source code" is not a file; it is the equilibrium state of that system.

  **Split by Case:**
  *   **Case 1 (Doorways):** Cuts in her favor. The "byproduct" explanation is an emergent property of the build environment, not a hardcoded constant. Your vocabulary forces you to look for the constant.
  *   **Case 2 (Axes):** Cuts in her favor. The "value" of the axe is not a property of the object (data) but of the transaction (execution). Your vocabulary treats the object as the primary unit of analysis.
  *   **Case 3 (Burials):** Cuts in your favor, partially. The "missing data" hypothesis is a valid RE strategy. However, her claim that "absence is the institution" requires treating `NULL` as a value, which your framework resists.

  **Conclusion:**
  Her claim that "deposits are the institution" translates to: **The runtime state is the logic.** In your work, the state is transient; the binary is permanent. In her work, the "binary" (the pot) is transient (it breaks), and the "state" (the practice of making pots) is the permanent structure she wants to study. You are looking for the `.exe`; she is studying the **CPU cycle**.

  **Confidence: 90%**

  ---

  ### Least Sure Claim

  **Claim:** "The closest analogue in RE is Emergent Behavior in a Botnet... The institution is the network traffic pattern."

  **Confidence in Claim:** 60%

  **Note on Changing My Mind:**
  I am least sure that the "Botnet/Network Traffic" analogy captures the *ontological* weight of her claim. A botnet still relies on discrete binaries communicating. Her claim suggests the "institution" might not even be the communication, but the **topology** of the network itself.
  To change my mind, I would need an example from your work where the **file system structure itself** (not the files, not the traffic) constitutes the "program." If you can identify a scenario where the *layout* of the sectors on the disk performs a function independent of the data written to them, that would be a tighter analogue. If no such scenario exists in RE, then the gap is not just vocabulary; it is a fundamental difference between **Engineered Systems** (yours) and **Evolved Systems** (hers). Engineered systems have designers; evolved systems have selection pressures. That distinction might be the true residue.
