answer: |-
  We begin from the shared commitment that Nāgārjuna is not a plain nihilist who denies existence outright. Your first branch question asks whether the tetralemma targets reality itself or merely our discourse about it. If a student answers that it targets reality, they proceed to the second question concerning negation: does denying a corner exclude it and leave something else standing, or does it merely refuse endorsement without positing anything? If they answer that it targets discourse, they are asked whether this failure is semantic, concerning truth values, or conceptual, concerning our ability to carve nature at its joints. Those who chose reality and exclusion move to a third question: is the claim that everything is empty itself a thesis with content? Those who chose reality and refusal are asked whether classical logic holds or whether contradictions can be true. Those who chose discourse are asked whether the device aims to dissolve the question therapeutically or to establish a new conceptual framework. Finally, every path converges on a fifth question regarding regress: is emptiness itself empty, and does this worry you?

  This structure generates ten distinct leaves. The first combines reality, exclusion, thesis, and classical logic; this reading holds emptiness can be established by inference and commits you to the awkward price that emptiness itself becomes a substantive essence. The second combines reality, refusal, no-thesis, and classical logic; this reading holds Nāgārjuna only draws consequences from opponents and commits you to the awkward price that you cannot explain how communication functions without assertions. The third combines reality, refusal, no-thesis, and many-valued logic; this reading treats the four corners as semantic values like true, false, both, or neither and commits you to the awkward price that logical inference becomes non-transitive. The fourth combines reality, exclusion, and dialetheism; this reading holds at least one opposed pair of corners is really both true and commits you to the awkward price that contradictions are features of the world. The fifth combines discourse, semantic failure, and therapeutic intent; this reading holds the whole device is there to dissolve the question and commits you to the awkward price that philosophy must end in silence. The sixth combines discourse, conceptual failure, and no-thesis; this reading holds emptiness is only a claim about concepts failing to cut anywhere and commits you to the awkward price that idealism lurks beneath the surface. The seventh combines reality, exclusion, and no-thesis; this cell is theoretically possible but remains unnamed because it struggles to explain what exclusion achieves without a thesis. The eighth combines discourse, conceptual failure, and thesis; this cell is empty because asserting a thesis about conceptual failure reinstates the very conceptual rigidity being criticised. The ninth combines regress worry and emptiness not empty; this cell is incoherent for Madhyamaka because it makes emptiness a svabhāva. The tenth combines regress benign and emptiness empty; this reading holds the regress is harmless and commits you to the awkward price that ultimate truth is merely the absence of error.

  You asked to flag pairs of leaves the tree cannot honestly separate. The no-assertion reading and the therapeutic reading come out looking identical on most of these questions even though they refuse assertion for quite different reasons. One thinks something is still shown by the refutation, the other thinks nothing is. To pry them apart you would need an extra question about soteriological intent: does the text aim to cure suffering or to describe reality? Without that, the tree collapses them into a single node regarding assertion. You also asked to mark the empty cells. The combination where the tetralemma is about the world plus the negation leaves something in its place plus emptiness is what is left is empty for a reason. It is merely unattractive because it turns emptiness into the very kind of intrinsic nature Nāgārjuna seeks to dismantle. Similarly, the cell where discourse is targeted but a thesis is asserted is incoherent because it performs the error it diagnoses.

  Regarding the utility of your questions, the single question doing nearly all the sorting work is the second one concerning negation. Whether denying a corner cancels the predicate and leaves something in its place, or merely declines to endorse it without committing to anything, determines whether the reader lands in a constructive metaphysics or a deconstructive praxis. Almost every serious interpreter must choose between implicating and non-implicating negation, and this choice dictates the subsequent handling of thesis and regress. The question that is nearly useless because almost everybody answers it the same way is the fifth one regarding regress. Once a student grants that Nāgārjuna is not a nihilist, nearly everybody answers that emptiness is itself empty and that this does not worry them. To admit the regress is vicious is to abandon the Madhyamaka project entirely, so this branch functions less as a sorter and more as a fidelity check. You might cut it to save space, as it rarely generates genuine divergence among competent readers.

  If you typeset this as a diagram, ensure the lines connecting reality and exclusion lead clearly to the thesis question, while discourse paths lead to the therapeutic distinction. The empty cells should be marked visibly so students see where the logical space collapses under its own weight. The indistinguishable pair should be noted with a dashed line indicating that further textual evidence is required to separate them. This approach ensures students see the price before they pick, as you requested. They will understand that choosing a leaf is not merely choosing a label but accepting a specific logical cost. The handout will thus serve as a map of commitments rather than a taxonomy of schools. You should find this fits your seminar needs without requiring prior knowledge of Sanskrit terminology. The logical space is laid out plainly, and the readings occupy the cells they deserve.
