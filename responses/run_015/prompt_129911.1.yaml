answer: |-
  There is no established canonical name for this specific asymmetry in the literature of population ethics or normative theory. While the broader territory is covered by debates on aggregation, lexical thresholds, and the Repugnant Conclusion, the specific domain-sensitive resistance you describe—where somatic micro-harms aggregate more readily than epistemic micro-harms—does not have a standardized label.

  To carve this concept out precisely, we can define it as the **Somatic-Epistemic Aggregation Asymmetry (SEAA)**.

  Below is the conceptual definition, its distinction from neighboring problems, and the boundary conditions where the intuition dissolves.

  ### 1. Conceptual Definition
  **The Somatic-Epistemic Aggregation Asymmetry** is the moral intuition that sub-threshold harms belonging to the *somatic/sensory* domain are aggregable across a population, whereas sub-threshold harms belonging to the *epistemic/cognitive* domain are not, even when stipulated to be equivalent in subjective disutility, duration, and distribution.

  *   **The Somatic Pole:** Harms that present as immediate sensory negative valence (itching, mild pain, irritation). These are treated as "additive units" of welfare loss.
  *   **The Epistemic Pole:** Harms that present as disruptions to cognitive processing (confusion, momentary forgetfulness, loss of clarity). These are treated as "non-additive noise" or ephemeral states that do not sum to a significant moral burden.

  The asymmetry relies on the phenomenological character of the harm. Somatic harms are treated as **objective intrusions** upon the subject, while epistemic harms are often tacitly treated as **subjective fluctuations** of the subject's own capacity. Consequently, a billion moments of confusion are intuitively dismissed as "just how thinking feels," whereas a billion moments of itching are dismissed as "a billion injuries."

  ### 2. Distinctions from Neighboring Concepts
  To isolate SEAA, we must distinguish it from three adjacent ethical problems.

  **Vs. Scope Neglect**
  Scope neglect is a cognitive bias where the moral weight assigned to a harm fails to scale linearly with the number of victims (e.g., valuing saving 200,000 birds roughly the same as 2,000).
  *   **Differentiation:** Scope neglect is domain-general; it applies equally to birds, people, pain, or confusion. SEAA is domain-specific. In SEAA, the agent *successfully* scales the somatic harm (recognizing the large number matters) but *fails* to scale the epistemic harm. The slope of aggregation is steep for somatic issues and flat for epistemic ones.

  **Vs. Lexical Thresholds (Lexical Utilitarianism)**
  Lexical views hold that some higher-quality harms (e.g., torture) cannot be outweighed by any quantity of lower-quality harms (e.g., dust specks).
  *   **Differentiation:** Lexical views are hierarchical based on *intensity*. SEAA operates at the *micro-level* where intensity is stipulated to be equivalent. The question is not whether confusion is "lower" than pain, but whether two equally trivial harms possess different *aggregation potentials* based on their category. SEAA suggests that the "currency" of somatic welfare is fungible, while the "currency" of epistemic welfare is not.

  **Vs. Person-Affecting Restrictions**
  Person-affecting views hold that an outcome can only be bad if it is bad for some particular person.
  *   **Differentiation:** Person-affecting restrictions concern *who* is harmed (existing vs. future people). SEAA concerns *what* counts as a harm. In SEAA scenarios, the same specific people are harmed in both cases; the asymmetry arises solely from the *type* of experience they undergo.

  ### 3. Boundary Conditions and Failure Points
  The SEAA intuition is not robust; it relies on specific phenomenological conditions. If these conditions are violated, the asymmetry collapses.

  **The Instrumental Boundary**
  The asymmetry holds only so long as the epistemic harm remains intrinsic. If the momentary confusion is described as having instrumental consequences (e.g., "this confusion causes a missed turn, leading to lateness, leading to stress"), the intuition shifts. Once epistemic harm is linked to downstream somatic or welfare outcomes, it becomes aggregable. The SEAA applies only to *purely* epistemic disruptions with no causal tail.

  **The Agency Boundary**
  The resistance to aggregating epistemic harms weakens if the harm is framed as a violation of autonomy rather than a welfare loss. If the confusion is described as "manipulation" or "obscuring the truth," it aggregates readily because it triggers deontological constraints rather than utilitarian calculation. SEAA is primarily a phenomenon of welfarist aggregation; it dissolves when rights or autonomy enter the frame.

  **The Salience Boundary**
  The asymmetry depends on the "opacity" of the epistemic harm. If the cognitive disruption is made phenomenally salient (e.g., "a moment of intense panic" vs. "a moment of fog"), the aggregation resistance vanishes. SEAA specifically targets *subtle* cognitive degradations. If the epistemic harm becomes as "grabbable" as a physical sensation, people treat it like a somatic harm.

  **The Identity Boundary**
  If the epistemic harm is cumulative enough to alter the agent's rational capacities permanently (e.g., "this confusion degrades memory over time"), it ceases to be a micro-harm and becomes a structural harm. SEAA applies only to transient states that reset to baseline.

  ### 4. Underlying Mechanism
  While you asked for conceptual carving rather than psychological explanation, the boundary conditions suggest the mechanism driving SEAA is **Objectification Bias**.

  Somatic irritations are easily objectified; they feel like something happening *to* the body, independent of the will. Epistemic confusions are often internalized as functioning *of* the mind. Because we view our cognitive clarity as a tool we wield rather than a state we inhabit, micro-failures of that tool are discounted as user error or background noise rather than moral injuries. The asymmetry is not about the pain itself, but about whether the subject is viewed as a *victim* of the sensation (somatic) or the *locus* of the confusion (epistemic).

  ### Summary
  The phenomenon is the **Somatic-Epistemic Aggregation Asymmetry**. It is defined by the differential fungibility of micro-harms based on their phenomenological category. It is distinct from scope neglect because it is domain-sensitive, and distinct from lexical views because it operates between harms of equivalent intensity. It fails at the boundaries where epistemic harms acquire instrumental consequences, violate autonomy, or become phenomenally salient enough to be objectified as injuries.
