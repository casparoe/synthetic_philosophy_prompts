answer: |-
  \answer{The confederate's key card proving scale is arbitrary convention.}

  ### Workshop Design: The Transformation Game

  **Objective:** To demonstrate empirically that visual data representation requires learned convention, deliberate transformation, and cannot inherently express logical relationships like negation or causality.

  **Participants:** 16 people (8 pairs).
  **Time:** 90 minutes.
  **Materials:**
  *   8 Packets per round (sealed envelopes).
  *   Blank A4 paper (stacks).
  *   Black pens (one per person).
  *   Whiteboard (for scoring tallies only).
  *   **Prop:** One "Confederate Key Card" (see Round 3).
  *   **Data:** Local library lending stats (fictionalized for clarity).

  ---

  ### Preparation (Before Session)
  1.  **Print Claim Cards:** 8 sets of 4 cards per round.
  2.  **Print Icon Sheets (Round 2 & 3):** Simple black outlines of a book, a person, and a building.
  3.  **Prepare Confederate Card:** One card for Round 3 Decoder only. Text: *"KEY: One Book Icon = 10 Items. Ignore all other scales."*
  4.  **Room Setup:** 8 tables (or push desks together), 2 chairs per table. Paper and pens at each seat.

  ---

  ### Timeline & Rules (90 Minutes)

  **0:00–0:10 | Setup & Seating**
  *   Seat participants in 8 pairs.
  *   Distribute Round 1 envelopes (face down).
  *   **Rule:** "You are machines. Encoder draws, Decoder guesses. No words, no numbers, no letters. If you speak or write a digit, you break the machine."

  **0:10–0:20 | Round 1: The Transparency Myth**
  *   **Task:** Encoder receives claim: *"5 Fiction Books Borrowed."*
  *   **Action:** Encoder draws freely. Decoder guesses the number and subject.
  *   **Scoring:** 1 point if subject correct, 1 point if number exact.
  *   **Predicted Failure:** Drawings look like "reading" generally, not quantity. Numbers are guessed via stack height, which is ambiguous.
  *   **Debrief Note:** Do not discuss yet. Just tally scores on whiteboard.

  **0:20–0:35 | Round 2: The Isotype Rule**
  *   **Task:** Encoder receives claim: *"50 Fiction Books Borrowed."*
  *   **New Rule:** "You must use the provided Icon Sheet. You may not enlarge icons to show more. You must repeat the same-sized icon."
  *   **Action:** Encoder draws 50 books (or finds a shortcut). Decoder guesses.
  *   **Predicted Failure:** Drawing 50 icons is tedious. Pairs will invent grouping (rows of 10) without a written key.
  *   **Scoring:** Same as Round 1.

  **0:35–0:55 | Round 3: The Transformation**
  *   **Task:** Encoder receives claim: *"1,250 Total Books Borrowed."*
  *   **New Rule:** "You cannot draw 1,250 icons. You must invent a scale (e.g., 1 icon = 100 books). You must show this scale using *only* pictures."
  *   **Confederate Move:** Hand the **Decoder** in Pair #8 the *Confederate Key Card* secretly as they sit down. Tell them: "Use this to interpret."
  *   **Action:** Encoders invent scales (mostly 1 icon = 100). They draw ~12.5 icons. Decoders interpret.
  *   **Predicted Failure:** Pair #8 Decoder reads 12 icons as 120 (per their card). Everyone else reads 1,200. Encoders struggle to draw "0.5" of a book without numbers.
  *   **Scoring:** Tally heavily. Highlight the discrepancy in Pair #8 publicly.

  **0:55–1:05 | Round 4: The Logical Limit**
  *   **Task:** Encoder receives claim: *"Zero Books Borrowed Because The Library Closed."*
  *   **Rule:** Same as Round 3.
  *   **Action:** Encoder attempts to show "Zero" and "Because."
  *   **Predicted Failure:** "Zero" is shown as empty space or crossed-out book. "Because" is impossible. Decoders guess "No books" but miss the cause, or guess "Books Destroyed."
  *   **Scoring:** Most will fail the "Because" clause.

  **1:05–1:25 | Debrief & Reveal**
  *   **Step 1 (The Confederate):** Ask Pair #8 what they decoded. Reveal the Key Card. Ask the group: "Was the picture wrong, or was the agreement missing?"
  *   **Step 2 (The Transformation):** Ask Round 3 Encoders: "How did you decide what one icon meant? Did you round 1,250 to 1,200? Who decided that?" (Highlight: The human made the data, not the chart).
  *   **Step 3 (The Logic):** Ask Round 4 Decoders: "Did you know *why* books weren't borrowed?" (Highlight: Pictures show states, not logic/connectives).
  *   **Step 4 (The Theory):** Now you speak. "You just reinvented the Vienna Method. Otto Neurath called this 'Visual Education.' He argued pictures are not transparent; they are a 'helping language' that must be learned. He called the step where you decided '1 icon = 100' **Transformation**. It is a human decision, not a mathematical truth."
  *   **Step 5 (The Friend):** "Your friend says pictograms are transparent. You just proved they are conventional. Pair #8 saw a different reality because they learned a different convention."

  **1:25–1:30 | Teardown**
  *   Collect materials.
  *   Hand out a single slip of paper with further reading on ISOTYPE/Neurath for those interested.

  ---

  ### Predictable Failures & Recovery

  1.  **Cheating (Writing Numbers):** Participants will slip digits into Round 1 or 2.
      *   *Recovery:* Do not scold. Disqualify that round's score for that pair. Say: "The machine broke. Reset." This reinforces the constraint as the source of the lesson.
  2.  **Round 3 Stall:** Pairs may spend too long debating the scale.
      *   *Recovery:* Call "Time" strictly at 10 minutes. The stress of the deadline mimics the real-world pressure of design constraints.
  3.  **Confederate Exposure:** If Pair #8 laughs or looks suspicious.
      *   *Recovery:* Frame it as "System Error." "In real information systems, inconsistent keys cause data loss. You experienced a system crash."
  4.  **ESL Participants Feeling Targeted:** If the activity is framed as "Pictures help non-speakers."
      *   *Recovery:* Frame it as "Visual Literacy." Explicitly state: "This is a new language for everyone. Native English speakers often struggle most because they try to translate pictures back into English syntax."

  ---

  ### Judgment on Your Two Questions

  **1. Is your instinct (pictograms are never transparent) too strong?**
  It is correct for *information design*, but too strong for *safety signage*. A biohazard symbol or a restroom figure relies on high-frequency exposure and regulatory standardization, not inherent transparency. In data visualization (your context), transparency is a myth. A bar chart is not "natural"; it is a highly learned convention. Your instinct holds: without a key (legend), a pictogram is art, not data. The workshop proves this via the Confederate moment.

  **2. What to do with participants who do not share a first language?**
  Do not frame this as testing whether pictures "solve" language barriers. That fakes Neurath's internationalist hope. Instead, frame it as testing whether pictures *bypass* language. They do not; they replace one language (English) with another (Visual Syntax).
  *   **Honest Test:** If the ESL participants perform *better* than native speakers, it proves visual literacy is distinct from linguistic literacy. If they perform the *same*, it proves visual literacy must be learned regardless of母语 (mother tongue).
  *   **Advice:** Pair ESL participants with native speakers. Observe if the native speaker tries to dictate English labels. The friction here is the lesson. Neurath's hope was not that pictures need no learning, but that they are *easier to learn jointly* than foreign verbs. This workshop tests the "learning" part, not the "ease" part.

  ---

  ### What This Activity Cannot Make Them Feel
  The activity proves convention and transformation, but it cannot make them feel the **political intent** of Neurath's work. Neurath didn't just want clear charts; he wanted to empower workers to understand economic data so they could participate in democracy. The workshop makes the *method* visible, but the *moral purpose* (why we do this) is something you must state yourself in the final 5 minutes. Tell them: "Neurath did this so a factory worker could understand the national budget. We do this so our neighbors can understand the library's value."

  \answer{The confederate's key card proving scale is arbitrary convention.}
