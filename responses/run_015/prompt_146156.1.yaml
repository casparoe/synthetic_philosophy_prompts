  ### The Rule She Is Running

  She is running a refined version of the **Discriminative Concept Rule** (your third option): *Introspection is reliable only where the reporter has a discriminative concept of the state in question, sharpened by practice or feedback, or where the concept is antecedently stable (innate).*

  While the **Phenomenal/Current Rule** (Option 1) fits the first eight verdicts perfectly, it cannot explain her specific emphasis in Case 8, where she stresses **training rather than subject matter**. If reliability were solely a function of accessing current phenomenal character (Option 1), training would be incidental. Her admiration for Case 8 implies that the *capacity to report* is a skill that must be calibrated, not just a window that is opened.

  The **Monitoring vs. Inference Rule** (Option 2) is a close second and fits the data well. However, it struggles to explain why Case 8 required *thousands of trials* to become reliable if it were simply a matter of switching from inference to monitoring. The Discriminative Concept Rule explains this: the concept of "conscious seeing" at threshold had to be learned/sharpened.

