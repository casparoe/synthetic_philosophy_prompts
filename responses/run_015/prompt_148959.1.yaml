  Your claim holds strictly against a Cartesian model of mind, but fails to accommodate partitioned cognitive architectures where sub-personal modules can withhold information from one another without logical contradiction. The primary assumption requiring adjustment is the unity of the self; if doxastic agency is distributed across semi-autonomous subsystems, as evidenced by split-brain studies and implicit bias research, one module can effectively deceive another without the agent possessing global awareness of the clash. This renders the 'deceiver/deceived' distinction intra-personal rather than inter-personal, sidestepping your architectural objection while preserving the core dynamic of truth suppression. Regarding transparency, empirical findings suggest belief is not always accessible to introspection, allowing for a state where an agent sincerely avows not-p whilst acting on p, which dissolves the static paradox of simultaneous contradictory belief.

  The risk of collapsing into motivated irrationality is not a dead end but rather the prevailing deflationary account championed by philosophers such as Alfred Mele; conceding this point merely refines the definition rather than eliminating the phenomenon. A true dead end would be insisting on conscious, simultaneous awareness of the deception, as no robust theory requires the agent to know the truth at the exact moment of denying it. Consequently, the live escape route involves accepting a fragmented self where knowledge is localised, whilst the conceptual move that saves the phenomenon is redefining self-deception as unintentional motivated bias rather than intentional lying. You are correct that the 'literal' paradox is impossible, but wrong to infer that self-deception therefore does not exist, as the mechanism is merely sub-personal rather than personal.
