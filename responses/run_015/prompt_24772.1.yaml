answer: |-
  **MEMORANDUM**

  **TO:** Technical Committee, Formal Description Language Working Group
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Self-Referential Clause Handling (Spec Issue #402)

  ### Executive Summary

  Following the evaluation engine failure triggered by Spec #402 (the "self-excluding clause"), the committee faces a critical decision regarding self-reference in our language. The incident demonstrated that unbounded self-reference can lead to non-termination (infinite loops) and state corruption in dependent specs. We have three paths: ban self-reference entirely, implement a user-managed stratification (level) system, or adopt a compiler-enforced safety model.

  **Recommendation:** I recommend we adopt **Compiler-Inferred Stratification** (a variant of the level system where levels are implicit, not explicit). This approach prevents logical paradoxes and runtime hangs without imposing the syntactic burden of a manual type system. For the roughly 33% of existing specs that utilize self-reference, we will implement a **Legacy Compatibility Mode** that freezes their current behavior while flagging them for gradual migration.

  ### The Problem

  The core issue is not self-reference itself, but *ungrounded* self-reference. The offending clause ("applies to every clause that does not apply to itself") is a variant of Russell's Paradox. In a formal language used for auditing, logical consistency is our product. If the engine hangs or produces contradictory results, we lose trust. However, self-reference is also a powerful tool for recursive definitions and exception handling ("all rules except this one"). Removing it entirely reduces our language to a toy compared to competitors.

  ### Recommended Solution: Compiler-Inferred Stratification

  Instead of asking users to manually assign "levels" to clauses (which is error-prone and verbose), the compiler will automatically infer a dependency hierarchy during static analysis.

  1.  **Safety:** If the compiler detects a circular dependency that could lead to a paradox (e.g., Clause A negates the result of Clause A), compilation fails. This moves the error from *runtime* (hang/crash) to *compile-time* (logical error).
  2.  **Usability:** Users write specs as they do today. The complexity is hidden in the toolchain, not the syntax.
  3.  **Soundness:** This preserves the mathematical integrity of the language. We are not merely "timing out" bad logic (which hides the error); we are proving it invalid before execution.

  ### Treatment of Existing Specs (The 33%)

  Approximately one-third of specs in the wild use self-reference. Many are benign (e.g., simple recursion that terminates). Breaking these immediately would be disastrous for adoption.

  *   **Legacy Flag:** We will introduce a `@legacy-recursion` annotation. Specs currently in production can be re-compiled with this flag to bypass the new stratification checks, provided they pass a strict resource-bounding test (ensuring they cannot hang).
  *   **Deprecation Schedule:** Legacy specs will be supported for 18 months. After this period, they must be refactored to pass the inferred stratification check to remain valid for new audits.
  *   **Isolation:** Legacy specs will run in a sandboxed evaluation context to prevent the "side-effect" corruption seen in Issue #402.

  ### Addressing the Opposition

  **To the proponents of a Total Ban:**
  I acknowledge your position is the safest. The strongest argument for banning self-reference is **Simplicity and Guarantees.** By removing the feature, we mathematically guarantee that this class of bug can never exist again. We also simplify the engine significantly.
  *Response:* While safe, a ban renders us non-competitive. Our users require recursion for complex contract logic (e.g., merkle proof verification, recursive permission checks). If we ban this, users will migrate to languages that support it, taking their security audits with them. We cannot solve a safety problem by rendering the tool useless.

  **To the proponents of a Manual Level System:**
  I acknowledge your position is the most formally rigorous. The strongest argument for explicit levels is **User Intent.** By forcing users to declare levels, we make them explicitly think about the dependency order, reducing accidental complexity.
  *Response:* While rigorous, explicit levels impose a high cognitive tax. Our language is used by auditors and developers, not just logicians. If the syntax becomes too burdensome, compliance will drop, and users will write "workarounds" that are harder to audit than the original specs. Implicit inference achieves the same safety with less friction.

  ### Conclusion

  We cannot ship a language that allows logical contradictions, but we cannot ship one that is too cumbersome to use. Compiler-Inferred Stratification offers the mathematical safety of a level system with the usability of a modern high-level language. The Legacy Compatibility Mode ensures we do not abandon our existing user base while we secure the future of the platform.

  I request a vote on this recommendation at next week's meeting.

  ***

  **Action Required:** Please review the attached technical proof-of-concept for the inference engine prior to the vote.
