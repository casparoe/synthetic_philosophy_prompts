  The Commissioner's argument for the equivalence rule is the strongest political case we face and deserves to be stated exactly as he intends. He argues that a sentence is a measure of punishment, not merely a measure of time, and that a day spent in a single room with a key and cooked food is materially less punitive than a day in general population. If we ignore this difference, we are effectively allowing two people with identical sentences to serve different amounts of actual punishment based on where they sleep. He further notes that we already allow back-end decisions to alter the bite of a sentence through classification officers, lockdowns, and good-time credits, so his rule only makes explicit what is currently invisible and discretionary. Finally, he warns that if we do not account for this leniency, victims and the public will see eighteen people walking free earlier than expected and view this board as having usurped the judge's authority, potentially destroying the political support needed to keep this facility open. This is not a trivial concern about optics; it is a claim that truth in sentencing requires equalizing the experience of confinement, not just the duration, and that transparency is better than hidden discretion.

  However, implementing this rule requires treating suffering as a single scalar quantity with a stable unit, which is technically incoherent. In engineering terms, you cannot convert meters to seconds without a constant velocity, and here we are asked to convert conditions into time without a known exchange rate. We would be setting this rate based on the reports of residents whose baselines adapt to whatever conditions they are in, calibrated by five people who have never been incarcerated. Beyond the impossibility of calibration, linking housing to release dates creates a dangerous feedback loop where the county's capital budget becomes a sentencing instrument. If a future budget cut forces us to close the normalization wing or reduce its amenities, sentences would effectively extend without a hearing, raising serious ex post facto concerns where punishment is increased after the fact. If housing assignment feeds into release dates, then a reclassification or a facility closure changes the sentence after the judge has spoken, which shifts sentencing power from the judiciary to the board and creates a built-in incentive never to improve conditions in the general wing because doing so would reduce the credit differential.

  Regarding allocation, we must choose between a merit system and a lottery, and both carry moral weight. A merit system converts decent conditions into a behavior-modification tool, which sounds practical until you realize that withdrawing those conditions becomes a punishment imposed without any hearing. If a resident loses their key and single room for a rule violation, they are suffering an increase in punitive severity that was not part of their sentence, administered by staff rather than a court. A lottery is imperfect because it makes the amount of suffering a person serves under an identical sentence a matter of luck, but it avoids turning basic dignity into a carrot and stick. The normalization wing is modeled on the principle that life inside should resemble life outside as closely as security permits, and if that is the standard for humane confinement, it should not be contingent on perfect behavior any more than freedom from torture is contingent on good conduct. A lottery acknowledges scarcity without penalizing behavior extra-judicially, whereas merit suggests the normality principle is a reward rather than a baseline standard of care.

  If we reject the Commissioner's rule, we still owe the general wing something, since the grievance behind his proposal is real. The gap between the two wings will be the largest disparity in living conditions this county has ever created under a single sentence, and ignoring that disparity invites the very legitimacy crisis the Commissioner fears. We should commit to a parallel improvement plan for the general wing, even if it falls short of normalization, to ensure that the baseline conditions do not remain stagnant while the new wing opens. This addresses the retributive concern that punishment should be uniform without accepting the logically flawed mechanism of an exchange rate. We can acknowledge that conditions matter without pretending we can quantify suffering into days off a sentence. We must be honest that we are creating two tiers of confinement, and honesty requires us to mitigate the lower tier rather than falsify the math of the upper tier.

  To move forward, I ask that we vote on these recommendations at the December 12 meeting so that architects have clarity before the March design lock. We need to direct staff to draft the lottery eligibility criteria by January 15 and commission a review of general wing improvements by the same date. If the board wishes to revisit the equivalence rule, it should require a formal opinion from county counsel confirming that linking housing to release dates does not violate state sentencing laws, because without that legal cover, the risk of litigation is too high to ignore. We are building a facility that will stand for fifty years, and the policies we set now must be robust enough to survive budget cycles and political shifts without compromising the rule of law or the safety of the community. I urge you to consider that a system which cannot explain its own math will eventually lose the trust of everyone it is meant to serve.
