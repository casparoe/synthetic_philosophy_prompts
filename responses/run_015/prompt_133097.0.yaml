answer: |-
  You press hard on the outcome, but you ignore the architecture of the violation. I concede freely that the victim's belief state is identical in both scenarios; the cognitive damage—the false belief that taxes will rise—is tragically the same. However, the asymmetry thesis is not concerned merely with the final inventory of the listener's mind, but with how that inventory was corrupted. In your Filtered Transcript case, the journalist has not asserted the falsehood; they have presented true fragments and invited the audience to bridge the gap. The listener's reasoning engine is hijacked to construct the falsehood itself, rather than having the falsehood deposited directly via assertion. This is rerouting, not pollution. The listener remains, technically, the co-author of their own deception, whereas the lie treats the listener as a passive receptacle for poisoned data.

  To call this a syntactic technicality is to mistake the map for the territory. The moral kind differs because the normative commitment differs. When I lie, I pledge my truthfulness to a proposition I know is false; I corrupt the very institution of assertion. When I mislead via ellipsis, I pledge truthfulness only to the fragments printed, violating instead the norm of cooperative communication. The burden of correction shifts: discovering a lie requires me to purge an asserted fact from my archive; discovering misleading requires me to retrace my inferential steps. The wrongness lies in the violation of the specific trust invoked—trust in content versus trust in context—and that distinction remains robust even when the resulting false belief is indistinguishable.
