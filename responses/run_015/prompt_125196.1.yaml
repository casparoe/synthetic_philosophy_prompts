prompt: |-
  I'm leading a single ninety-minute seminar for a reading group of museum-curator and art-history graduate students with no formal philosophy training, though they live inside debates about digital restoration, forgery, and whether a reconstructed object retains its original identity. I want to teach them how intuition pumps actually work—not as colorful illustrations, but as rhetorical devices that covertly import modal commitments (about conceivability, possibility, and identity conditions) while presenting themselves as neutral descriptions. Plan the explanatory arc for me, not the explanation itself. First, lay out the dependency order: which component has to be in place before the next can land, and why, with special attention to why they must understand the distinction between a scenario's narrative coherence and its modal legitimacy before they can see the pump's hidden work. Second, choose the one carrying example or pump that should bear the whole session; it should come from their world—say, a pump about whether a painting reconstructed pixel-by-pixel from ashes by an AI trained on the artist's other works counts as the original work—rather than from standard philosophy-of-mind literature like Mary's room or the Chinese Room, and you must specify exactly what that example must contain and what it must lack (for instance, whether it should include emotional attachment to the original canvas) to do the job. Third, map the misconceptions: the ones they will bring from their professional context (for example, that vivid visualization equals possibility, or that the pump's conclusion is what matters rather than its smuggled premise about what can be identically preserved) and the ones they will form during the session, with the precise point in the sequence where each should be headed off. Fourth, design one check for understanding at the end that reveals whether they have grasped the mechanism—how to detect hidden modal loading—rather than whether they can retell the example. Fifth, say explicitly what standard philosophical machinery should be refused at this level—modal logic notation, specific theories of mental representation, bibliographic debates about particular thinkers—and state why. Take a committed stance throughout: pick one sequence and defend it, choose one version of the carrying example and argue for its features, specify the misconceptions and intervention points without offering a menu of equally valid alternatives, and be direct about what you are excluding. Do not ask for readings, citations, or further texts.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Audience:** Museum curators and art-history grad students (no formal philosophy training, but deep engagement with restoration, forgery, identity).
      *   **Goal:** Teach how "intuition pumps" work as rhetorical devices that covertly import modal commitments (conceivability, possibility, identity), not just as illustrations.
      *   **Format:** 90-minute seminar plan (explanatory arc, *not* the explanation itself).
      *   **Constraints:**
          *   Lay out dependency order (Component A before Component B, why).
          *   Emphasize the distinction between *narrative coherence* and *modal legitimacy*.
          *   Choose *one* carrying example from their world (e.g., AI reconstruction of a painting), specifying inclusions/exclusions.
          *   Map misconceptions (pre-existing and emergent) with intervention points.
          *   Design one end-of-session check for understanding (mechanism detection, not retelling).
          *   Explicitly exclude standard philosophical machinery (modal logic, specific theories, bibliographic debates).
          *   **Tone:** Committed stance, direct, no menus of alternatives, no citations/readings.

  2.  **Deconstruct the Core Challenge:**
      *   The students are used to dealing with *objects* and *histories*. They treat thought experiments as case studies.
      *   The instructor needs to shift their focus from "Is this conclusion true?" to "How did this story force me to accept a hidden premise?"
      *   The critical pivot is realizing that a story can be *coherent* (makes sense narratively) without being *modally legitimate* (actually possible in a way that preserves the relevant identity conditions).

  3.  **Step 1: Dependency Order (The Arc):**
      *   *Why start here?* If I start with the definition of an intuition pump, they'll treat it as a vocabulary word. I need them to *feel* the pump first.
      *   *Sequence:*
          1.  Elicit the intuition (get them to commit).
          2.  Isolate the narrative features (what made it feel real?).
          3.  Reveal the modal smuggling (what rules did the story sneak in?).
          4.  Generalize the mechanism (now define the pump).
      *   *Crucial Dependency:* They must distinguish *narrative coherence* (the story hangs together) from *modal legitimacy* (the story respects the rules of identity/possibility) *before* analyzing the pump. If they don't, they'll just argue about whether the AI *could* do it, rather than how the description *assumed* identity conditions.

  4.  **Step 2: The Carrying Example:**
      *   *Requirement:* Must be from their world (art/restoration).
      *   *Idea:* The "Ashes to Art" AI Reconstruction.
      *   *Specifics:* A famous painting burns. Ashes remain. AI scans ashes + database of artist's other works + chemical analysis. Reconstructs pixel-perfect visual match on new canvas.
      *   *Inclusions:* Needs to emphasize *continuity of information* vs. *continuity of matter*. Needs to mention the *artist's intent* (via AI simulation).
      *   *Exclusions:* **No emotional attachment.** If we include "the curator cries," it muddies the ontological question with an aesthetic/psychological one. **No legal/financial stakes.** (Insurance claims distract from identity). **No viewer deception.** (If no one can tell, is it art? That's a different question). We want *Identity*, not *Value* or *Perception*.
      *   *Why this version?* It isolates the "Ship of Theseus" problem into a digital/material hybrid context they face daily.

  5.  **Step 3: Misconceptions & Interventions:**
      *   *Pre-existing:* "Vividness = Possibility." (If I can picture it, it's a valid counterexample). *Intervention:* Early, when they first react to the story.
      *   *Pre-existing:* "The Conclusion is the Point." (They will argue "Yes it is the original" vs "No it isn't"). *Intervention:* Mid-session, pivot away from the verdict to the *setup*.
      *   *Emergent:* "All Assumptions are Bad." (They might think philosophy just says 'nothing is possible'). *Intervention:* When defining the pump, clarify that assumptions are necessary, but *covert* ones are the rhetorical trick.
      *   *Emergent:* "Modal Legitimacy is just Scientific Possibility." (They might confuse physical possibility with metaphysical identity). *Intervention:* During the coherence vs. legitimacy distinction.

  6.  **Step 4: Check for Understanding:**
      *   *Goal:* Detect hidden modal loading.
      *   *Task:* Don't ask "Is the painting the original?" Ask them to *rewrite* the prompt to force the *opposite* intuition without changing the physical facts.
      *   *Why:* This proves they understand which words carry the modal weight.

  7.  **Step 5: Exclusions:**
      *   *No Modal Logic:* ($\Box$, $\Diamond$). Too technical, distracts from rhetoric.
      *   *No Specific Theorists:* (Dennett, Searle, Lewis). Creates authority bias, distracts from the *tool*.
      *   *No Mental Representation Theory:* (Propositional attitudes, etc.). Irrelevant to curatorial identity.
      *   *Why:* Keep it focused on *rhetorical mechanics*, not metaphysical system-building.

  8.  **Drafting the Plan (Iterative Refinement):**
      *   *Tone Check:* Am I being direct? Yes. Am I offering choices? No.
      *   *Dependency Check:* Does the distinction between coherence and legitimacy come early enough? It needs to be the bridge between the story and the analysis.
      *   *Example Check:* Did I strip out the emotional stuff? Yes.
      *   *Constraint Check:* 90 minutes. The timing needs to be implied in the flow.

      *(Self-Correction during drafting)*: I need to make sure I don't just list the steps but explain *why* the dependency exists as requested ("which component has to be in place before the next can land, and why").
      *(Refining the Example)*: Make sure the "AI" aspect doesn't become a distraction about AI capabilities. It must be about the *description* of the output. The prompt must stipulate the output is visually identical. The question is *identity*.
      *(Refining the Check)*: The "rewrite the prompt" task is strong. It forces them to manipulate the variables.

  9.  **Final Polish:** Ensure the distinction between "narrative coherence" and "modal legitimacy" is the spine of the whole plan. That is the specific intellectual tool they need to neutralize the pump.

      *Structure:*
      1.  Dependency Order (The Logic of the Arc).
      2.  The Carrying Example (The "Ash-Canvas" Pump).
      3.  Misconceptions & Intervention Points.
      4.  Check for Understanding.
      5.  Excluded Machinery.

      *Voice:* Authoritative, pedagogical, precise.

      *(Final Review against constraints)*:
      - 90 mins? (Implied in scope).
      - No citations? (Checked).
      - No menu of alternatives? (Checked).
      - Committed stance? (Checked).
      - Focus on modal commitments? (Checked).

