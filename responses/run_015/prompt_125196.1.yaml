answer: |-
  ### I. Dependency Order: The Logic of the Arc

  You cannot define an "intuition pump" until they have been pumped. If you begin with a definition, they will treat the concept as a taxonomic label rather than a mechanical threat. The sequence must force them to experience the rhetorical coercion before giving them the vocabulary to analyze it.

  1.  **Commitment First:** You must elicit a firm intuitive verdict on the carrying example *before* analyzing the example. If they do not commit to a "Yes/No" on the identity question initially, they have no stake in the mechanism. They must feel the pull of the intuition.
  2.  **Narrative Coherence Before Modal Legitimacy:** This is the critical pivot. You must establish that the story *makes sense* (narrative coherence) before you can challenge whether the story *respects the rules of identity* (modal legitimacy). If you challenge the possibility too early, they will retreat to empirical arguments ("AI can't actually do that"). You must force them to admit the story is coherent *in order* to show them that coherence is not enough. They must understand that a story can be internally consistent but metaphysically illicit.
  3.  **Mechanism Before Generalization:** Only after they see how the specific example manipulated their verdict can you generalize to the concept of the "intuition pump." If you generalize first, they will treat the example as mere illustration. The example must function as the evidence for the theory, not the application of it.
  4.  **Detection Before Evaluation:** The session ends on detecting the loading, not resolving the ontological debate. If you let them debate whether the reconstructed painting *is* the original, you lose the lesson. The goal is to show them how the question was rigged, not to answer it.

  **Why the Coherence/Legitimacy Distinction is the Linchpin:**
  Curators live in the business of plausibility. They are trained to assess whether a restoration narrative holds together historically and materially. They equate "plausible story" with "possible state of affairs." You must break this equation. An intuition pump works by maximizing narrative coherence to mask modal illegitimacy. If they cannot separate the *flow of the story* from the *rules of possibility* embedded in the story, they will remain vulnerable to rhetorical smuggling. They must see that a story can be smooth (coherent) but violate the necessary conditions of the object's identity (illegitimate) without triggering an alarm.

  ### II. The Carrying Example: The "Ash-Canvas" Reconstruction

  Do not use the Ship of Theseus. It is too abstract. Do not use a forgery case; it introduces criminal intent which distracts from ontology. Use the **"Ash-Canvas" Pump**.

  **The Scenario:**
  A canonical painting (e.g., a Rothko) is destroyed by fire. Only chemical ash remains. An AI system, trained on the artist's complete corpus, chemical logs, and high-res scans of the ash, directs a robotic arm to mix new pigments and apply them to a new canvas. The output is molecule-for-molecule indistinguishable from the pre-fire painting in terms of surface chemistry and visual appearance.

  **What This Example Must Contain:**
  1.  **Stipulated Indistinguishability:** You must explicitly state that no scientific test can distinguish the reconstruction from the original. This removes empirical verification as an escape route.
  2.  **Discontinuity of Matter:** You must emphasize that *none* of the original physical substrate (canvas, paint layers) survives, only the chemical ash (the ingredients).
  3.  **Continuity of Information:** You must emphasize that the *pattern* is preserved via the AI's training on the artist's intent and history.

  **What This Example Must Lack:**
  1.  **Emotional Attachment:** Do not mention the curator's grief, the public's awe, or the spiritual presence of the artist. This smuggles in aesthetic reception as a proxy for identity.
  2.  **Financial/Legal Stakes:** Do not mention insurance payouts, museum valuation, or copyright. This shifts the debate to pragmatic convention rather than metaphysical identity.
  3.  **Viewer Deception:** Do not frame it as "fooling the viewer." The question is not "Does it look like the original?" but "Is it the original?" even if everyone knows it is a reconstruction.

  **Why This Version:**
  This specific configuration isolates the **Information vs. Substrate** tension. It forces the students to choose whether identity resides in the *history of the object* (the specific canvas touched by the artist) or the *pattern of the object* (the visual/chemical arrangement). The pump works by describing the reconstruction in terms of "restoration" language (recovering the pattern) while hiding the premise that "pattern equals identity."

  ### III. Misconceptions and Intervention Points

  **1. Pre-Existing Misconception: "Vividness Equals Possibility"**
  *   **The Error:** Students will assume that because they can vividly visualize the AI rebuilding the painting, the scenario is metaphysically possible in a way that preserves identity.
  *   **Intervention Point:** **Immediately after the initial vote.** When you ask why they voted "It is the original," someone will say, "Because I can see how it happens." You must stop this. State clearly: "You have described a manufacturing process, not an identity condition. Just because you can narrate the transition does not mean the object survives it."

  **2. Pre-Existing Misconception: "The Verdict is the Goal"**
  *   **The Error:** They will treat the seminar as a debate to determine the true status of the Ash-Canvas painting.
  *   **Intervention Point:** **Mid-Session.** When the debate heats up, intervene to say: "I am not interested in whether this painting is the original. I am interested in which word in my description forced you to think it was." Shift focus from the *object* to the *text*.

  **3. Emergent Misconception: "Modal Legitimacy is Just Physical Possibility"**
  *   **The Error:** After you introduce the coherence/legitimacy distinction, they will assume "modal legitimacy" just means "is this physically possible according to physics?"
  *   **Intervention Point:** **During the Analysis of the Pump.** Clarify that physics allows the reconstruction. The modal illegitimacy lies in the *identity rules*. It is physically possible to build a duplicate; it is metaphysically illicit to claim the duplicate is the *same* without arguing for that premise. The pump hides the argument that "continuity of pattern suffices for identity."

  **4. Emergent Misconception: "All Assumptions are Manipulative"**
  *   **The Error:** They may conclude that all thought experiments are dishonest because all descriptions contain assumptions.
  *   **Intervention Point:** **During the Generalization.** Distinguish between *explicit parameters* (which are honest) and *covert commitments* (which are the pump). The goal is not to stop using scenarios, but to spot when a scenario claims to be neutral while loading the dice.

  ### IV. Check for Understanding: The "Reverse-Load" Task

  Do not ask a multiple-choice question. Do not ask them to define "intuition pump."

  **The Task:**
  Provide them with a written paragraph describing the exact same Ash-Canvas scenario, but one that leads to the *opposite* intuition (i.e., forces the intuition that it is *not* the original). They must rewrite the description without changing the physical facts (the ash, the AI, the new canvas). They can only change the *framing vocabulary* and the *modal connectors*.

  **Success Criteria:**
  They pass only if they identify and swap the hidden modal loading.
  *   *Fail:* Changing the physical facts (e.g., "The AI makes a mistake").
  *   *Fail:* Adding emotional weight (e.g., "The curator feels it is fake").
  *   *Pass:* Changing the identity conditions via language. For example, shifting from "The AI *restores* the image" to "The AI *replicates* the image." Shifting from "The painting *survives* the fire" to "The painting *ends* at the fire."
  *   **Why this works:** It proves they understand that the intuition was not generated by the *objects*, but by the *linguistic framing of possibility and identity*. It demonstrates they can manipulate the pump mechanism.

  ### V. Excluded Philosophical Machinery

  To keep the session focused on rhetorical mechanics rather than metaphysical system-building, you must explicitly refuse the following:

  1.  **Modal Logic Notation:** Do not use $\Box$ (necessity) or $\Diamond$ (possibility).
      *   **Why:** It creates a technical barrier that allows them to dismiss the insight as "logic" rather than rhetoric. You want them to see this as a language game, not a formal proof.
  2.  **Specific Theories of Mental Representation:** Do not discuss propositional attitudes, qualia, or cognitive architecture.
      *   **Why:** This shifts the focus to psychology. The issue is not how their brains process the story, but how the story is constructed to bypass their critical filters.
  3.  **Bibliographic Debates:** Do not cite Dennett on intuition pumps, Lewis on counterpart theory, or Wollheim on representation.
      *   **Why:** Citations create authority bias. They will focus on interpreting the philosopher rather than analyzing the tool. You want them to trust their own detection of the mechanism, not their ability to recall a reading.
  4.  **Essentialism vs. Anti-Essentialism:** Do not frame this as a debate about whether objects *have* essences.
      *   **Why:** That is an ontological rabbit hole. Frame it as a debate about *commitments*. Whether essences exist is irrelevant; what matters is whether the text *assumes* they exist to drive the conclusion.

  **Stance:**
  You are not teaching them philosophy. You are teaching them **rhetorical self-defense**. You are treating the intuition pump not as a tool for discovery, but as a vector for unargued premises. The session succeeds not if they solve the problem of identity, but if they never again accept a "clearly described scenario" as neutral ground.
