          *   *Twist:* To make one result feel "wrong but correct," maybe the procedure *protects* them initially because they are expressing an *idea*, not enacting a *practice*, unless they actively disrupt. OR, the procedure *bans* the nihilists because their core claim negates the forum's purpose. Let's go with the latter for the "wrong but correct" feel. If the forum is for *rational inquiry*, absolute nihilism is intolerant of the inquiry itself.
          *   *Wait, let's look at the third case.*
      *   *Case 3: Contrarian Ban.* (Mod wants to ban for being "too contrarian").
          *   *Analysis:* Fails Step 1 (Classification). "Contrarian" is not a practice, it's a vibe. Fails Step 2 (No specific norm erosion identified).
          *   *Outcome:* Ban rejected. This feels "right."
