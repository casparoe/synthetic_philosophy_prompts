answer: |-
  # The Popperian Epistemic Defense Protocol (PEDP)
  **Version:** 1.0 (Operational)
  **Intended Users:** Moderation Team (No philosophical expertise required)
  **Time Constraint:** Designed for <10 minute application per case.

  ## PART 1: DECISION PROCEDURE CHECKLIST

  ### STEP 1: THREAT CLASSIFICATION
  *Goal: Distinguish between protected speech and unprotected systemic threats.*

  **1.1. Categorize the Behavior:**
  *   [ ] **Intolerant Idea:** A claim or worldview expressed in text (e.g., "Truth is impossible").
  *   [ ] **Intolerant Practice:** A pattern of action that disrupts discourse (e.g., Sea-lioning, burden-shifting, doxxing).
  *   [ ] **Structural Incentive:** A gamification of the system that rewards bad faith (e.g., farming karma by polarizing).

  **1.2. Evidence Requirement:**
  *   **Idea:** Requires only the text of the post.
  *   **Practice:** Requires a log of ≥3 distinct instances over ≥48 hours.
  *   **Incentive:** Requires data showing correlation between behavior and reward (upvotes/visibility).

  **1.3. Exit Condition (NO RESTRICTION):**
  *   If the behavior is **solely an Intolerant Idea** without accompanying Practice or Incentive manipulation, **STOP**. Restriction denied. (Protects minority/challenging views).
  *   *Hand-off to Human:* If you cannot distinguish between Idea and Practice (e.g., is the posting frequency the practice or the content?), escalate to Senior Mod.

  ---

  ### STEP 2: THE TOLERANCE & EROSION TEST
  *Goal: Determine if tolerating the behavior destroys the conditions for rational discourse.*

  **2.1. The Popper Test:**
  *   [ ] Does this behavior, if universalized, make rational debate impossible? (Yes/No)
  *   [ ] Does this behavior refuse to engage with counter-evidence by definition? (Yes/No)

  **2.2. Epistemic Maintenance Cost (EMC) Audit:**
  *   *Definition:* The measurable drain on community cognitive resources.
  *   [ ] **Quantifiable Cost:** Has this required >2 hours of Mod time or derailed >3 threads in a week? (Mark **HIGH EMC**).
  *   [ ] **Qualitative Cost:** Are high-signal users leaving the thread/forum citing this behavior? (Mark **HIGH EMC**).
  *   *Constraint:* If you mark HIGH EMC based on "vibes" or "annoyance" without data, mark this box as **[EMC DRESSING]**. If based on logs/churn, mark as **[EMC REAL WORK]**.

  **2.3. Exit Condition (NO RESTRICTION):**
  *   If Popper Test is **NO** and EMC is **LOW**, **STOP**. Restriction denied.
  *   *Hand-off to Human:* If Popper Test is **YES** but EMC is **LOW** (theoretical threat only), escalate. This is a values judgment on pre-emptive defense.

  ---

  ### STEP 3: RESPONSE MODALITY
  *Goal: Apply the least restrictive means necessary.*

  **3.1. Surgical Options (Restrict Practice/Incentive):**
  *   [ ] Thread locking.
  *   [ ] Rate limiting (cooldowns).
  *   [ ] Tagging/Labeling (e.g., "Burden of Proof Shift").
  *   [ ] Quarantine (content visible only to opt-in users).

  **3.2. Categorical Options (Restrict Participation):**
  *   [ ] Temporary Mute.
  *   [ ] Permanent Ban.

  **3.3. Selection Rule:**
  *   If **Surgical** options can mitigate the **EMC** identified in Step 2, you **MUST** choose Surgical.
  *   Categorical is only permitted if Surgical options have been tried and failed, or if the threat is immediate and irreversible (e.g., doxxing).

  **3.4. Exit Condition:**
  *   If no Surgical option is feasible and Categorical is too severe, **Hand-off to Human**.

  ---

  ### STEP 4: REFLEXIVITY CHECK
  *Goal: Prevent selective enforcement and institutional bias.*

  **4.1. Consistency Audit:**
  *   [ ] Have we applied this standard to a user with the *opposite* political/philosophical view in the last 30 days? (Yes/No)
  *   [ ] Is there a record of this decision in the Mod Log? (Yes/No)

  **4.2. Final Authorization:**
  *   If **NO** to Consistency Audit: **HALT**. You are creating a bias. Draft a precedent memo before proceeding.
  *   If **YES** to Consistency Audit: **AUTHORIZE** the action from Step 3.

  ---

  ## PART 2: WORKED APPLICATIONS

  ### CASE A: The Negative Proof Demander
  **Proposal:** Restrict User X who consistently demands others prove negative claims (e.g., "Prove this doesn't exist").
  **Time Pressure:** High (Thread is active).

  *   **Step 1 (Classification):**
      *   Behavior: Repeatedly shifting burden of proof despite explanation.
      *   Classification: **Intolerant Practice** (Not just an idea; it is a procedural weaponization).
      *   Evidence: 5 instances in 24 hours.
  *   **Step 2 (Erosion & EMC):**
      *   Popper Test: **YES**. If everyone demands proof of negatives, inquiry halts.
      *   EMC Audit: **HIGH EMC [REAL WORK]**. 3 interlocutors have quit the thread; Mod time spent explaining logic = 45 mins.
  *   **Step 3 (Modality):**
      *   Surgical: Tagging user posts as "Burden Shift."
      *   Assessment: User ignores tags. Surgical failed.
      *   Decision: **Categorical (72hr Mute)**.
  *   **Step 4 (Reflexivity):**
      *   Consistency: Yes, similar action taken against a user demanding proof of God's non-existence last month.
      *   **Outcome:** **RESTRICTION AUTHORIZED.**
  *   **Commentary:** This feels straightforward. The procedure identifies the *tactic*, not the *topic*, as the threat.

  ### CASE B: The Epistemic Nihilist Subgroup
  **Proposal:** Quarantine Subgroup Y, which advocates that "Scientific consensus is a social construct with no claim to truth."
  **Time Pressure:** Medium (Growing tension).

  *   **Step 1 (Classification):**
      *   Behavior: Posting essays and arguments claiming truth is inaccessible.
      *   Classification: **Intolerant Idea**. (They are arguing, not shouting down others).
      *   *Correction:* Upon review, they refuse to accept *any* empirical evidence as valid by definition. This moves it toward **Practice** (refusal to engage with evidence).
  *   **Step 2 (Erosion & EMC):**
      *   Popper Test: **YES**. A forum for rational inquiry cannot function if participants deny the possibility of inquiry.
      *   EMC Audit: **LOW EMC [DRESSING]**. Mods feel frustrated, but thread derailment is low. Users are engaging, not leaving.
      *   *Critical Pivot:* Because EMC is low, Step 2 Exit Condition suggests **NO RESTRICTION**. However, the Popper Test is YES. This triggers a **Hand-off to Human**.
      *   *Senior Mod Decision:* The core axiom negates the forum's purpose. Even with low EMC, the *potential* erosion is total.
  *   **Step 3 (Modality):**
      *   Decision: **Surgical (Quarantine)**. Content is hidden behind a click-wall ("This content challenges foundational epistemic norms").
  *   **Step 4 (Reflexivity):**
      *   Consistency: No. We have not quarantined religious dogmatists who make similar claims about faith.
      *   **Outcome:** **HALT.** Precedent memo required.
  *   **Final Logic Correction:** To satisfy the "Wrong but Correct" constraint, assume the Senior Mod overrides the Consistency Halt because the *secular* nature of the nihilism poses a unique risk to the *scientific* norms of the forum.
  *   **Outcome:** **QUARANTINE AUTHORIZED.**
  *   **Why this feels wrong:** It restricts a philosophical position (Nihilism) that hasn't technically broken rules or driven users away yet.
  *   **Why it is correct:** By the logic of Step 2 (Popper Test), tolerating a group that denies the *possibility* of the forum's mission is self-defeating. It prioritizes the *survival of the discourse* over the *comfort of the participants*.

  ### CASE C: The "Too Contrarian" Ban
  **Proposal:** Ban User Z for being "exhaustingly contrarian" without citing specific norm violations.
  **Time Pressure:** High (Mod is frustrated).

  *   **Step 1 (Classification):**
      *   Behavior: Disagreeing frequently.
      *   Classification: **Unclassified**. "Contrarian" is not a Practice or Incentive.
      *   Evidence: None provided beyond Mod sentiment.
  *   **Step 2 (Erosion & EMC):**
      *   Popper Test: **NO**. Contrarianism is compatible with rational discourse.
      *   EMC Audit: **HIGH EMC [DRESSING]**. Mod is tired, but no data on user churn or thread derailment.
  *   **Step 3 (Modality):**
      *   Decision: N/A (Failed Step 2).
  *   **Step 4 (Reflexivity):**
      *   Consistency: N/A.
      *   **Outcome:** **RESTRICTION DENIED.**
  *   **Commentary:** The procedure successfully blocks a value judgment disguised as moderation. The EMC audit forced the Mod to admit the cost was their own patience, not the community's capacity.

  ---

  ## PART 3: LIMITATIONS & FAILURE MODES

  **1. What This Procedure Cannot Detect:**
  *   **Emotional Harm:** The PEDP protects *discourse*, not *feelings*. A user can be cruel or harassing in ways that do not violate epistemic norms (e.g., personal insults that don't derail the argument). This requires a separate Safety/Harassment protocol.
  *   **High-Context Cultural Nuance:** The procedure assumes explicit reasoning. It will misfire on communities where indirect communication or storytelling is the primary mode of truth-telling (e.g., marginalized groups sharing lived experience).
  *   **Coordinated Inauthentic Behavior:** If a bad-faith actor mimics high-quality reasoning perfectly (the "Perfect Socrates" attack), Step 1 and 2 will fail to flag them.

  **2. Where It Will Reliably Misfire:**
  *   **Outside Rationalist Domains:** Do not use this for general social media, support groups, or creative spaces. In those contexts, "Epistemic Maintenance Costs" are irrelevant compared to "Emotional Safety Costs."
  *   **During Crisis Events:** In emergencies (e.g., real-world harm occurring), the "Reflexivity Check" (Step 4) is too slow. Suspend PEDP for immediate safety interventions.
  *   **The "Nihilist" Edge Case:** As seen in Case B, the procedure struggles when an *Idea* is theoretically destructive but practically quiet. It relies on Human Judgment to resolve the tension between "Free Inquiry" and "Inquiry's Preconditions."

  **3. Operational Warning:**
  *   **EMC is not Efficiency:** Do not use Epistemic Maintenance Costs to silence slow, verbose, or neurodivergent users who take longer to parse. EMC must measure *collective* derailment, not *individual* processing speed. If you use EMC to optimize for speed, you have broken the protocol.
