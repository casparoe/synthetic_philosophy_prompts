  I choose Approach 3. It discriminates better because it prevents rote reproduction of lecture notes. Students must apply the "arbitrariness" and "reader" criteria to a case where the usual intuitions (conservation = function) are decoupled, forcing them to reason in the exam room rather than recall labels.

  **Question 1 (20 marks)**
  **Hypothetical:** Consider Lineage V: a single-celled organism where the codon table is wholly rewritten compared to relatives, yet protein sequences and functions remain identical. The tRNAs and charging enzymes are co-rewritten to match.
  (a) Does Lineage V's existence prove the genetic code is arbitrary? Explain how this supports either the view that DNA is a literal code or that "coding" is merely external bookkeeping. (10 marks)
  (b) The translation machinery is produced by the genome it translates. Does this internal loop undermine the claim that DNA is a code requiring a reader? Conclude by stating what explanatory work the term "code" performs here that a purely causal description ("nucleotides produce amino acids") does not. (10 marks)

  **Model Answer**
  Lineage V confirms the mapping is arbitrary: no chemical law binds specific triplets to specific amino acids. This supports the "literal code" view only if arbitrariness is the sole criterion for codehood. However, because the organism's function remains identical despite the rewrite, the specific mapping is causally redundant regarding the phenotype. The mapping is downstream of the real work (protein folding). This suggests "coding" is bookkeeping we project onto a causal chain rather than a driver of function. The "code" is not in the DNA; it is in the relationship between DNA and the machinery.

  Regarding the reader: The lack of an external stipulator does not dissolve the code claim if we define "reader" functionally rather than intentionally. The ribosome/tRNA complex *is* the reader. The regress stops at the mechanism. However, calling this a "code" adds little over "causal specificity" unless we emphasize history. The term "code" is useful only to highlight the *contingency* of the mapping (it could have been otherwise) compared to strict chemical affinity. A purely causal description captures the physics but misses the evolutionary history of the mapping. Thus, "code" survives as a marker of historical contingency, not semantic content. It distinguishes systems where the mapping is evolved rather than chemically forced. If we remove "code," we lose the ability to describe the system's evolvability—the fact that the mapping itself can change without changing the physics. Therefore, "code" is literal only as a description of contingent causal mapping, not as semantic information.

  **Marking Scheme**
  1.  **Arbitrariness (4):** Must state drift proves mapping isn't chemical law. *Error:* Confusing phenotypic stability with mapping necessity (e.g., "proteins are same so code is fixed").
  2.  **Ontology (4):** Must argue code is real or projected. *Error:* Hedging ("some say X, some say Y") without commitment to a view.
  3.  **Reader Definition (4):** Must define reader as mechanism, not agent. *Error:* Demanding conscious interpretation (e.g., "cells can't read").
  4.  **Regress (4):** Must explain why self-production doesn't invalidate mechanism. *Error:* Claiming the loop makes translation impossible or circular.
  5.  **Vocabulary Work (4):** Must identify "contingency" or "evolvability" as utility. *Error:* Claiming "code" implies meaning/semantics (e.g., "DNA has messages").

  **Note on Contestability**
  The most contestable point is the claim that "code" adds only "contingency." Some argue it implies information flow distinct from causal flow, suggesting the model answer is too deflationary.
