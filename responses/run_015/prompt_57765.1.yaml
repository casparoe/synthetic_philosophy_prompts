answer: |-
  **Elias:** We're out of time. The result was in the air. Both labs had the data, the tools were ready, the question was circulating. If A hadn't announced, B would have within the month. If neither existed, C or D would have within two years. That's the substitution claim. Since the discovery was inevitable, priority is just moral luck. We split the prize.

  **Sarah:** That assumes the discovery was one thing. It wasn't. Lab A sat on the key idea for two years. That silence wasn't idle; it was the work of framing the problem. Lab B didn't have that idea until last autumn. B's method only makes sense inside A's framing. A built the room; B walked in and found a better chair.

  **Elias:** But B's result is stronger. A's bound is loose; B's is tight. If we reward the framing over the result, we're prize-ing the question rather than the answer. And you're relying on the identity claim—that A and B found different things. They announced the same result eleven days apart. The field treats them as identical.

  **Sarah:** The field is often wrong about identity. Look at the calculus dispute. Newton and Leibniz built genuinely different tools. The society vindicated Newton because his notation survived, not because the discovery was identical. Here, A's framing is the notation. B used it, but didn't own it. We shouldn't bundle them like Darwin and Wallace in 1858. That was near-identical content with uneven backing. This is uneven contribution with near-identical announcement.

  **Elias:** You're cherry-picking history. 1858 shows us that when content converges, we bundle, regardless of backing. The calculus case shows us that when tools diverge, we fight over who published first. Here, the content converged. The tools diverged, yes, but the result is the same. You're trying to deny substitution by arguing identity. But even if I concede A's framing was unique—that's a cost to me, because it weakens the inevitability argument—you still haven't proven A was irreplaceable.

  **Sarah:** I don't need to prove A was irreplaceable. That's where I've been wasting my breath. I don't need to deny substitution. I need to deny identity. If A and B produced different discoveries—one conceptual, one empirical—there's nothing to split. You can't split a prize between a mapmaker and a traveler just because they arrived at the same coordinate on the same week.

  **Elias:** If you deny identity, my argument for splitting collapses. I can't say "someone else would have found it" if "it" is undefined. But if they are different discoveries, why does A win outright? B's result is stronger. If we prize the stronger result, B wins. If we prize the framing, A wins. But the committee mandate is to prize the discovery of the result.

  **Sarah:** And I'll concede this: B's method was independent enough that B didn't just copy A. B's result stands on its own. That costs me, because it weakens A's claim to total ownership. But it reinforces that these are two achievements. A achieved the framing; B achieved the bound.

  **Elias:** And I'll concede this: A's two years of confirmatory work wasn't just waiting. It was a specific intellectual labor that wasn't guaranteed. That costs me, because it undermines the idea that the field state alone determines the outcome. But if we admit they are different achievements, we can't give one prize. We'd need two prizes. We only have one.

  **Sarah:** So we're back to forcing a unity that isn't there. You want to split because you think the result is the same object. I want to give it to A because I think the framing is the primary object. But neither of us can agree on what the object is.

  **Elias:** Then that's the crux. We cannot decide who deserves the prize until we decide whether we are rewarding the stability of the field or the specificity of the labor.

  **Sarah:** No, it's narrower than that. We cannot decide until we settle whether the discovery is the path taken or the destination reached.
