prompt: |-
  I wasted way too long arguing with a friend last night about whether what you believe can change what you actually see — not what you'd say you saw, but what its like. We went in circles: half his examples were really just about where you look or how long you look, and half of mine were about people being biased in what they report. So I want to build a sorting tree for my reading group that seperates the positions properly, and I want it to sort people by what they'll say about cases rather than by which label they've heard of.

  What I need from you:

  - No node should just ask "is perception cognitively penetrable?" Each branch should be a question about what *kind* of difference the cognitive state makes: does it change what the scene looks like, how forcibly some feature stands out, which features you can fine-discriminate, where your eyes go, whether the effect survives when you're warned and actively trying to correct for it, whether it shows up early or late in processing.
  - Give each node as a triple: two viewers who differ only in some cognitive state, plus a variant in which that cognitive state is false. The false-belief variant is how I want the tree to tell genuine penetration apart from slow perceptual learning or expertise on one side and from effects that just make the体验 more accurate on the other.
  - Please don't build the whole thing out of the Müller-Lyer illusion, remembered coin sizes, the race of a face, and gun-or-wallet. I want at least half the cases to be ones nobody has a cached verdict about.
  - Leaves should include: strict encapsulation; cognition only orchestrates attention; only slow learning and expertise reshape what you see; beliefs get in, but only where they'd make the experience more accurate; beliefs get in either way, accurate or not; perception just is inference, so priors are in there all the way down; and the deflationary one where the whole debate is verbal. One sentence each on the leaf's most awkward commitment.
  - Ten-ish branch questions. Flag any two leaves your tree can't really pull apart, and for each combination of answers nobody occupies, say whether that's because it's incoherent, unattractive, or just unexplored.

  (Oops — one stray non-English word slipped in above; ignore it, I meant "experience".)
