answer: |-
  Here is a sorting tree designed to separate positions on cognitive penetration by phenomenological and functional markers rather than labels. It uses ten diagnostic nodes, each grounded in a specific triple of cases to isolate the mechanism at work.

  ### The Sorting Tree

  **Node 1: The Oculomotor Check**
  *   **Question:** Does the difference vanish if eye position and fixation duration are strictly yoked?
  *   **Test Triple:** (1) **Umpire** expecting a strike; (2) **Umpire** expecting a ball; (3) **Umpire** expecting a strike but shown a pitch clearly outside the zone (False Belief).
  *   **Yes (Vanishes):** Go to Node 2 (Attention/Encapsulation track).
  *   **No (Persists):** Go to Node 3 (Penetration track).

  **Node 2: The Warning Correction**
  *   **Question:** If the viewer is explicitly warned that their expectation is irrelevant to the stimulus, does the effect disappear?
  *   **Test Triple:** (1) **Driver** believing the gap is wide; (2) **Driver** believing the gap is narrow; (3) **Driver** believing the gap is wide but told "The distance is fixed and measured" (False Belief/Warning).
  *   **Yes (Disappears):** Leaf A (Strict Encapsulation).
  *   **No (Persists):** Leaf B (Attention Orchestrator).

  **Node 3: The Onset Speed**
  *   **Question:** Does the effect require prolonged training, or does it arise from occurrent belief?
  *   **Test Triple:** (1) **Sommelier** believing liquid is wine; (2) **Novice** believing liquid is wine; (3) **Sommelier** believing liquid is wine but it is actually colored water (False Belief).
  *   **Yes (Requires Training):** Leaf C (Slow Learning/Expertise).
  *   **No (Immediate):** Go to Node 4.

  **Node 4: The Truth Sensitivity**
  *   **Question:** Does the perceptual distortion occur even when the belief is demonstrably false?
  *   **Test Triple:** (1) **Radiologist** expecting a tumor; (2) **Radiologist** expecting clear tissue; (3) **Radiologist** expecting a tumor but the scan is artificially clean (False Belief).
  *   **Yes (False belief distorts):** Go to Node 5 (Truth-Insensitive track).
  *   **No (Only true beliefs distort):** Leaf D (Accuracy-Only).

  **Node 5: The Cognitive Load**
  *   **Question:** Does the effect vanish when the viewer is under high working-memory load?
  *   **Test Triple:** (1) **Coder** expecting a syntax error; (2) **Coder** expecting clean code; (3) **Coder** expecting an error but performing a digit-span task simultaneously (False Belief/Load).
  *   **Yes (Vanishes):** Leaf E (Deflationary/Verbal).
  *   **No (Persists):** Go to Node 6.

  **Node 6: The Acuity Threshold**
  *   **Question:** Does the cognitive state change the finest discriminable difference (just-noticeable difference), not just the interpretation?
  *   **Test Triple:** (1) **Musician** expecting a sharp pitch; (2) **Musician** expecting a flat pitch; (3) **Musician** expecting sharp but tone is neutral (False Belief).
  *   **Yes (Acuity changes):** Go to Node 7.
  *   **No (Only categorization changes):** Leaf E (Deflationary/Verbal).

  **Node 7: The Salience Pop-Out**
  *   **Question:** Does the expected feature allow for faster visual search (pop-out) compared to the unexpected feature?
  *   **Test Triple:** (1) **Parent** expecting a pain-cry; (2) **Parent** expecting a hunger-cry; (3) **Parent** expecting pain but hearing hunger (False Belief).
  *   **Yes (Pop-out):** Go to Node 8.
  *   **No (Serial search):** Leaf F (Perception-as-Inference).

  **Node 8: The Cross-Modal Transfer**
  *   **Question:** Does the cognitive state in one modality (e.g., auditory expectation) change the appearance in another (e.g., visual)?
  *   **Test Triple:** (1) **Viewer** hearing "Ba" with ambiguous lips; (2) **Viewer** hearing "Da" with ambiguous lips; (3) **Viewer** hearing "Ba" but lips are clearly "Ga" (False Belief/McGurk variant).
  *   **Yes (Cross-modal):** Leaf F (Perception-as-Inference).
  *   **No (Modality specific):** Go to Node 9.

  **Node 9: The Visuomotor Dissociation**
  *   **Question:** Does the belief change the phenomenal look but *not* the motor grasp (or vice versa)?
  *   **Test Triple:** (1) **Hiker** with heavy pack (slope looks steeper); (2) **Hiker** with light pack; (3) **Hiker** with heavy pack but told "The pack is empty" (False Belief/Embodied).
  *   **Yes (Dissociation):** Leaf F (Perception-as-Inference).
  *   **No (Look and Action match):** Go to Node 10.

  **Node 10: The Pixel Report**
  *   **Question:** Can the viewer point to the specific sensory feature that changed, or only describe the gist?
  *   **Test Triple:** (1) **Restorer** expecting yellowed varnish; (2) **Restorer** expecting clear varnish; (3) **Restorer** expecting yellow but varnish is fresh (False Belief).
  *   **Yes (Can point to pixels):** Leaf G (Truth-Insensitive Penetration).
  *   **No (Only gist changes):** Leaf D (Accuracy-Only).

  ***

  ### The Leaves (Positions)

  1.  **Strict Encapsulation:** Vision is a sealed module; all top-down effects are post-perceptual judgment.
      *   *Awkward Commitment:* Must insist a hungry person doesn't literally see food as larger, only judges it so.
  2.  **Attention Orchestrator:** Cognition moves the spotlight, but the light itself doesn't change color.
      *   *Awkward Commitment:* Cannot explain why attended items sometimes show enhanced contrast sensitivity independent of eye position.
  3.  **Slow Learning/Expertise:** Only chronic re-weighting counts, not occurrent belief.
      *   *Awkward Commitment:* Must draw a magic line between "ten years of training" and "ten minutes of instruction."
  4.  **Accuracy-Only (Zoomancy):** Beliefs penetrate only if they track the truth.
      *   *Awkward Commitment:* Implies the visual system has independent access to the truth to verify the belief before letting it in.
  5.  **Truth-Insensitive Penetration:** Beliefs warp vision regardless of accuracy.
      *   *Awkward Commitment:* Accepts that we could be systematically hallucinating reality due to stubborn false theories.
  6.  **Perception-as-Inference:** Priors are constitutive; there is no "pure" sensation.
      *   *Awkward Commitment:* Makes it difficult to define illusion, since all seeing is biased guessing.
  7.  **Deflationary/Verbal:** The fight is over the word "see" vs. "judge."
      *   *Awkward Commitment:* Risks dismissing genuine neural crosstalk as mere semantics.

  ***

  ### Meta-Analysis

  **Two Leaves the Tree Cannot Pull Apart:**
  **Accuracy-Only (Leaf D)** and **Truth-Insensitive Penetration (Leaf G)**.
  *Reason:* To distinguish these, the experimenter must know the ground truth of the stimulus independently of the viewer's perception. In many novel cases (like the Umpire's strike zone or the Sommelier's wine), the "truth" is either constituted by the expert call or is chemically/physically ambiguous enough that verifying the "False Belief" condition is as difficult as measuring the penetration itself. If the stimulus is ambiguous, a "false belief" that alters perception might actually be making the perception *more* accurate based on subtle cues the experimenter missed, collapsing the distinction.

  **Unoccupied Combinations of Answers:**

  1.  **Combination:** *Immediate Onset (Node 3: No)* + *Requires Truth (Node 4: No)*.
      *   **Verdict:** **Unattractive.** This position claims occurrent beliefs change perception instantly, but *only* if they are true. This requires the visual system to verify the truth of a proposition faster than it can process the perception itself, implying a "homunculus" that checks reality before allowing the image to form.
  2.  **Combination:** *Survives Warning (Node 2: No)* + *Vanishes under Load (Node 5: Yes)*.
      *   **Verdict:** **Incoherent.** If an effect is robust enough to survive explicit warning (suggesting a deep, structural perceptual change), it should be automatic and resource-independent. If it vanishes under cognitive load, it suggests a controlled, post-perceptual process that *should* have been stopped by the warning. Holding both implies the mechanism is both automatic and controlled simultaneously.
  3.  **Combination:** *Cross-Modal (Node 8: Yes)* + *Modality Specific Encapsulation (Node 1: Yes)*.
      *   **Verdict:** **Unexplored.** Most encapsulationists argue for modularity within vision. A position that admits auditory cognition penetrates vision (McGurk) but denies visual cognition penetrates vision (belief about color) is theoretically possible but rarely defended, as it requires an arbitrary boundary between "sensory" crosstalk and "cognitive" crosstalk.
