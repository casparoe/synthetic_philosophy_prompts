      *   **Q2: Change as Illusion:** Perdurantists define change as qualitative variation across temporal parts. Endurantists call this "Cambridge change" or "replacement," not "real change." It's a substantive disagreement about the *nature* of change, not necessarily that perdurantists deny change exists. The TA's phrasing is biased.
      *   **Q3: Endurantism & Presentism:** Definitely false. You can be an Eternalist Endurantist (EE). You just need to handle location differently (multi-location vs. single location).
